<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>墨枢 SUMI-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script defer src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- V86 虚拟机模拟器 (版本锁定 0.5.319，JS/WASM/BIOS 同源同版本，严禁 @latest) -->
<script defer src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js"></script>
<!-- CodeMirror 代码编辑器 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<style>
/* ============================================================
   墨枢 SUMI-OS  ·  Kanagawa 墨色美学
   ============================================================ */
:root{
  --ink0:#16161D; --ink1:#1F1F28; --ink2:#2A2A37; --ink3:#363646; --ink4:#54546D;
  --fg:#DCD7BA; --fg2:#C8C093; --mut:#8a8980;
  --blue:#7E9CD8; --teal:#7AA89F; --gold:#E6C384; --red:#E46876;
  --violet:#957FB8; --green:#98BB6C; --orange:#FFA066;
  --font-ui:"Bricolage Grotesque","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"IBM Plex Mono","SF Mono",Consolas,"PingFang SC",monospace;
  --rad:12px;
  --glass:rgba(31,31,40,.86);
  --cellW:96px; --cellH:108px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-ui);background:var(--ink0);color:var(--fg);font-size:14px;}
::selection{background:rgba(230,195,132,.3);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:6px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink4);background-clip:content-box;border:2px solid transparent;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font-family:inherit;color:var(--fg);}
svg{display:block;}
.hidden{display:none !important;}

/* ---------- 启动画面 ---------- */
#boot{position:fixed;inset:0;z-index:99999;background:var(--ink0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s ease,visibility .7s;}
#boot.off{opacity:0;visibility:hidden;pointer-events:none;}
#boot .blogo{width:96px;height:96px;}
#boot .blogo path{stroke-dasharray:600;stroke-dashoffset:600;animation:bdraw 2.2s ease forwards;}
@keyframes bdraw{to{stroke-dashoffset:0;}}
#boot .bname{font-size:26px;letter-spacing:.5em;text-indent:.5em;font-weight:300;color:var(--fg2);animation:bfade 1.4s .5s both;}
#boot .bsub{font-family:var(--font-mono);font-size:11px;color:var(--mut);letter-spacing:.2em;animation:bfade 1.4s .9s both;}
#boot .bbar{width:180px;height:2px;background:var(--ink3);border-radius:2px;overflow:hidden;animation:bfade .8s 1s both;}
#boot .bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange));animation:bload 1.8s 1s ease forwards;}
@keyframes bload{to{width:100%;}}
@keyframes bfade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .6s ease;}
#wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(22,22,29,.55),transparent 60%);pointer-events:none;}
#icons-layer{position:absolute;inset:0 0 86px 0;}
#windows-layer{position:absolute;inset:0;pointer-events:none;}
#windows-layer>*{pointer-events:auto;}
#desktop.drag-over::before{content:"";position:absolute;inset:10px;border:2px dashed var(--gold);border-radius:18px;z-index:5;pointer-events:none;animation:pulse 1s infinite alternate;}
@keyframes pulse{from{opacity:.4}to{opacity:1}}

/* ---------- 桌面图标 ---------- */
.dicon{position:absolute;width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 6px;border-radius:10px;cursor:default;user-select:none;-webkit-user-select:none;transition:left .3s cubic-bezier(.22,1,.36,1),top .3s cubic-bezier(.22,1,.36,1),background .15s,opacity .2s;touch-action:none;animation:iconin .35s cubic-bezier(.22,1,.36,1) both;}
@keyframes iconin{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
.dicon:hover{background:rgba(220,215,186,.08);}
.dicon.selected{background:rgba(126,156,216,.22);outline:1px solid rgba(126,156,216,.55);}
.dicon.dragging{opacity:.35;}
.dicon .tile{width:52px;height:52px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
.dicon .lbl{font-size:11.5px;line-height:1.25;text-align:center;max-width:82px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);color:#eee9d4;}
#marquee{position:absolute;border:1px solid var(--blue);background:rgba(126,156,216,.14);z-index:4;pointer-events:none;display:none;border-radius:3px;}

/* ---------- Dock / 任务栏 ---------- */
#dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(220,215,186,.13);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.55);max-width:calc(100vw - 16px);}
#start-btn{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--gold);transition:.2s;flex:none;}
#start-btn:hover{background:rgba(230,195,132,.14);transform:translateY(-2px);}
#start-btn.on{background:rgba(230,195,132,.2);}
#dock .dsep{width:1px;height:28px;background:rgba(220,215,186,.14);flex:none;}
#task-items{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:60vw;}
#task-items::-webkit-scrollbar{display:none;}
.titem{height:42px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:12.5px;white-space:nowrap;position:relative;transition:.18s;flex:none;}
.titem:hover{background:rgba(220,215,186,.1);}
.titem.act{background:rgba(126,156,216,.18);color:var(--fg);}
.titem::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:14px;height:2.5px;border-radius:2px;background:var(--blue);transition:.2s;}
.titem.minz::after{width:5px;background:var(--mut);}
#clock{font-family:var(--font-mono);font-size:11.5px;line-height:1.35;color:var(--fg2);text-align:center;padding:0 8px;flex:none;cursor:default;}
#clock b{color:var(--fg);font-weight:600;font-size:13px;}

/* ---------- 窗口 ---------- */
.win{position:absolute;display:flex;flex-direction:column;min-width:280px;min-height:160px;background:rgba(31,31,40,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ink3);border-radius:var(--rad);box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden;animation:winin .28s cubic-bezier(.22,1,.36,1);}
@keyframes winin{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:none;}}
.win.closing{animation:winout .2s ease forwards;}
@keyframes winout{to{opacity:0;transform:scale(.92) translateY(10px);}}
.win.active{border-color:rgba(230,195,132,.45);box-shadow:0 22px 70px rgba(0,0,0,.7),0 0 0 1px rgba(230,195,132,.12);}
.win.maxed{border-radius:0;border:none;}
.win.minz{display:none;}
.win-tb{height:42px;flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 0 14px;background:linear-gradient(180deg,rgba(42,42,55,.7),rgba(31,31,40,.3));border-bottom:1px solid rgba(220,215,186,.07);cursor:default;user-select:none;-webkit-user-select:none;touch-action:none;}
.win-tb .wic{color:var(--blue);flex:none;}
.win-tb .wtitle{flex:1;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;}
.win.active .wtitle{color:var(--fg);}
.wbtn{width:34px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);transition:.15s;flex:none;}
.wbtn:hover{background:rgba(220,215,186,.12);color:var(--fg);}
.wbtn.wclose:hover{background:var(--red);color:#1a1a22;}
.win-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.rs{position:absolute;z-index:10;}
.rs-n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize;}
.rs-s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize;}
.rs-e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize;}
.rs-w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize;}
.rs-ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize;}
.rs-nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize;}
.rs-se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize;}
.rs-sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize;}

/* ---------- 菜单 ---------- */
.menu{position:fixed;z-index:99000;min-width:208px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(220,215,186,.14);border-radius:12px;padding:5px;box-shadow:0 16px 50px rgba(0,0,0,.6);animation:menuin .14s ease;}
@keyframes menuin{from{opacity:0;transform:scale(.95) translateY(-4px);}to{opacity:1;transform:none;}}
.menu .mi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--fg2);cursor:pointer;transition:.12s;white-space:nowrap;}
.menu .mi:hover{background:rgba(126,156,216,.2);color:var(--fg);}
.menu .mi.danger:hover{background:rgba(228,104,118,.22);color:#f5b3bc;}
.menu .mi svg{flex:none;opacity:.8;}
.menu .msep{height:1px;margin:4px 8px;background:rgba(220,215,186,.1);}
.menu .mhead{padding:6px 12px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;}

/* ---------- 开始菜单 ---------- */
#start-menu{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:9500;width:430px;max-width:calc(100vw - 16px);max-height:min(560px,calc(100vh - 110px));background:var(--glass);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border:1px solid rgba(220,215,186,.14);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.65);display:flex;flex-direction:column;overflow:hidden;animation:smin .25s cubic-bezier(.22,1,.36,1);}
@keyframes smin{from{opacity:0;transform:translateX(-50%) translateY(18px) scale(.96);}to{opacity:1;transform:translateX(-50%);}}
#start-menu .smhead{padding:18px 20px 10px;display:flex;align-items:center;gap:12px;}
#start-menu .smhead .smlogo{color:var(--gold);}
#start-menu .smhead .smt{font-size:16px;font-weight:600;letter-spacing:.06em;}
#start-menu .smhead .sms{font-family:var(--font-mono);font-size:10px;color:var(--mut);letter-spacing:.12em;}
#sm-search{margin:0 16px 12px;padding:9px 14px;background:rgba(22,22,29,.6);border:1px solid var(--ink3);border-radius:10px;font-size:13px;outline:none;transition:.2s;}
#sm-search:focus{border-color:var(--blue);}
#sm-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 14px 14px;align-content:start;}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 10px;border-radius:14px;cursor:pointer;transition:.16s;}
.sm-app:hover{background:rgba(220,215,186,.09);transform:translateY(-2px);}
.sm-app .lbl{font-size:11.5px;color:var(--fg2);text-align:center;}
#start-menu .smfoot{flex:none;display:flex;gap:6px;padding:10px 14px;border-top:1px solid rgba(220,215,186,.08);}
.smf-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:10px;font-size:12px;color:var(--fg2);transition:.15s;}
.smf-btn:hover{background:rgba(220,215,186,.1);color:var(--fg);}

/* ---------- 对话框 / Toast ---------- */
.dlg-back{position:fixed;inset:0;z-index:95000;background:rgba(22,22,29,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;animation:bfade2 .15s;}
@keyframes bfade2{from{opacity:0}to{opacity:1}}
.dlg{width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 60px);overflow:auto;background:var(--ink1);border:1px solid rgba(230,195,132,.25);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.7);padding:22px;animation:winin .22s cubic-bezier(.22,1,.36,1);}
.dlg h3{font-size:15px;font-weight:600;margin-bottom:12px;letter-spacing:.03em;display:flex;align-items:center;gap:9px;color:var(--gold);}
.dlg .dmsg{font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}
.dlg input[type=text]{width:100%;padding:10px 13px;background:var(--ink0);border:1px solid var(--ink3);border-radius:9px;font-size:13px;outline:none;margin-bottom:16px;}
.dlg input[type=text]:focus{border-color:var(--blue);}
.dlg .dbtns{display:flex;gap:8px;justify-content:flex-end;}
.btn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:500;background:var(--ink2);color:var(--fg2);transition:.15s;border:1px solid transparent;}
.btn:hover{background:var(--ink3);color:var(--fg);}
.btn.pri{background:var(--gold);color:#1a1a10;font-weight:600;}
.btn.pri:hover{background:#f0d49a;}
.btn.red{background:rgba(228,104,118,.16);color:var(--red);border-color:rgba(228,104,118,.35);}
.btn.red:hover{background:rgba(228,104,118,.3);}
#toasts{position:fixed;top:16px;right:16px;z-index:99500;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(220,215,186,.15);border-left:3px solid var(--teal);border-radius:11px;font-size:13px;box-shadow:0 10px 36px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.22,1,.36,1);max-width:320px;}
.toast.err{border-left-color:var(--red);}
.toast.warn{border-left-color:var(--orange);}
.toast.out{animation:tout .3s ease forwards;}
@keyframes tin{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}
@keyframes tout{to{opacity:0;transform:translateX(40px);}}

/* ---------- 文件管理器 ---------- */
.fx{display:flex;height:100%;font-size:13px;}
.fx-side{width:188px;flex:none;border-right:1px solid rgba(220,215,186,.07);padding:10px 8px;overflow-y:auto;background:rgba(22,22,29,.35);}
.fx-side .sh{padding:8px 10px 5px;font-size:10px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;}
.fx-side .si{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--fg2);cursor:pointer;transition:.13s;font-size:12.5px;}
.fx-side .si:hover{background:rgba(220,215,186,.08);}
.fx-side .si.on{background:rgba(126,156,216,.2);color:var(--fg);}
.fx-side .si svg{flex:none;opacity:.85;}
.fx-side .si .ej{margin-left:auto;opacity:.5;padding:2px;border-radius:5px;}
.fx-side .si .ej:hover{opacity:1;background:rgba(228,104,118,.3);}
.fx-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.fx-bar{flex:none;display:flex;align-items:center;gap:5px;padding:8px 10px;border-bottom:1px solid rgba(220,215,186,.07);flex-wrap:wrap;}
.fx-bar .ib{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:.13s;flex:none;}
.fx-bar .ib:hover{background:rgba(220,215,186,.1);color:var(--fg);}
.fx-bar .ib:disabled{opacity:.3;pointer-events:none;}
.fx-crumb{flex:1;min-width:120px;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px 8px;background:rgba(22,22,29,.5);border-radius:8px;border:1px solid var(--ink3);}
.fx-crumb::-webkit-scrollbar{display:none;}
.fx-crumb .cr{padding:3px 7px;border-radius:6px;cursor:pointer;color:var(--fg2);white-space:nowrap;font-size:12.5px;transition:.12s;}
.fx-crumb .cr:hover{background:rgba(126,156,216,.2);color:var(--fg);}
.fx-crumb .csep{color:var(--ink4);font-size:11px;}
.fx-search{width:150px;padding:7px 11px;background:rgba(22,22,29,.5);border:1px solid var(--ink3);border-radius:8px;font-size:12px;outline:none;}
.fx-search:focus{border-color:var(--blue);}
.fx-cols{flex:none;display:grid;grid-template-columns:minmax(140px,1fr) 150px 110px 88px;gap:0;padding:0 10px;border-bottom:1px solid rgba(220,215,186,.07);}
.fx-cols .fc{padding:7px 8px;font-size:11px;letter-spacing:.06em;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;}
.fx-cols .fc:hover{color:var(--fg);}
.fx-cols .fc.on{color:var(--gold);}
.fx-list{flex:1;overflow-y:auto;padding:5px 10px 30px;position:relative;}
.frow{display:grid;grid-template-columns:minmax(140px,1fr) 150px 110px 88px;border-radius:8px;cursor:default;user-select:none;-webkit-user-select:none;transition:background .1s;align-items:center;}
.frow:hover{background:rgba(220,215,186,.06);}
.frow.selected{background:rgba(126,156,216,.22);}
.frow.cutting{opacity:.45;}
.frow>div{padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;}
.frow .fname{display:flex;align-items:center;gap:9px;color:var(--fg);}
.frow .fname svg{flex:none;}
.frow .fmeta{color:var(--mut);font-family:var(--font-mono);font-size:11px;}
.fx-status{flex:none;padding:6px 14px;border-top:1px solid rgba(220,215,186,.07);font-size:11px;color:var(--mut);font-family:var(--font-mono);display:flex;gap:16px;}
.fx-empty{padding:50px 20px;text-align:center;color:var(--mut);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.fx-drop::after{content:"释放以导入文件";position:absolute;inset:6px;border:2px dashed var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(230,195,132,.07);color:var(--gold);font-size:14px;z-index:5;pointer-events:none;}

/* ---------- 应用通用 ---------- */
.app-tools{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid rgba(220,215,186,.07);flex-wrap:wrap;}
.tb-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-size:12.5px;color:var(--fg2);background:rgba(220,215,186,.05);border:1px solid rgba(220,215,186,.08);transition:.14s;}
.tb-btn:hover{background:rgba(220,215,186,.12);color:var(--fg);}
.tb-btn.pri{background:rgba(230,195,132,.16);color:var(--gold);border-color:rgba(230,195,132,.3);}
.tb-btn.pri:hover{background:rgba(230,195,132,.28);}
.ed-area{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;padding:16px;font-family:var(--font-mono);font-size:13px;line-height:1.7;color:var(--fg);tab-size:2;}
.CodeMirror{flex:1;height:100% !important;min-height:0;background:transparent !important;color:var(--fg) !important;font-family:var(--font-mono) !important;font-size:13px;line-height:1.65;}
.CodeMirror-gutters{background:rgba(22,22,29,.5) !important;border-right:1px solid var(--ink3) !important;}
.CodeMirror-linenumber{color:var(--ink4) !important;}
.CodeMirror-cursor{border-left:2px solid var(--gold) !important;}
.CodeMirror-selected{background:rgba(126,156,216,.25) !important;}
.cm-tag{color:var(--blue) !important;}.cm-attribute{color:var(--gold) !important;}.cm-string{color:var(--green) !important;}
.cm-keyword{color:var(--violet) !important;}.cm-comment{color:var(--mut) !important;}.cm-number{color:var(--orange) !important;}
.cm-property{color:var(--teal) !important;}.cm-def{color:var(--fg) !important;}

/* ---------- 计算器 ---------- */
.calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:12px;}
.calc-disp{flex:none;background:rgba(22,22,29,.7);border:1px solid var(--ink3);border-radius:14px;padding:16px 18px;text-align:right;overflow:hidden;}
.calc-disp .ce{font-family:var(--font-mono);font-size:12px;color:var(--mut);min-height:16px;word-break:break-all;}
.calc-disp .cv{font-family:var(--font-mono);font-size:32px;font-weight:600;color:var(--gold);word-break:break-all;line-height:1.2;}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ck{border-radius:12px;font-family:var(--font-mono);font-size:17px;background:var(--ink2);color:var(--fg);transition:.1s;border:1px solid rgba(220,215,186,.05);}
.ck:hover{background:var(--ink3);}
.ck:active{transform:scale(.94);}
.ck.op{background:rgba(126,156,216,.16);color:var(--blue);}
.ck.eq{background:var(--gold);color:#1a1a10;font-weight:700;}
.ck.fn{background:rgba(149,127,184,.15);color:var(--violet);font-size:14px;}

/* ---------- 设置 ---------- */
.set{display:flex;height:100%;}
.set-nav{width:150px;flex:none;border-right:1px solid rgba(220,215,186,.07);padding:12px 8px;background:rgba(22,22,29,.35);}
.set-nav .sn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--fg2);cursor:pointer;transition:.13s;margin-bottom:2px;}
.set-nav .sn:hover{background:rgba(220,215,186,.08);}
.set-nav .sn.on{background:rgba(126,156,216,.2);color:var(--fg);}
.set-body{flex:1;overflow-y:auto;padding:22px;}
.set-body h2{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:.03em;}
.set-body h4{font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.wall-item{aspect-ratio:16/10;border-radius:10px;cursor:pointer;border:2px solid transparent;background-size:cover;background-position:center;transition:.18s;position:relative;overflow:hidden;}
.wall-item:hover{transform:scale(1.03);}
.wall-item.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(230,195,132,.3);}
.wall-item span{position:absolute;left:8px;bottom:6px;font-size:10.5px;text-shadow:0 1px 3px #000;}
.sbar{height:22px;border-radius:7px;overflow:hidden;display:flex;background:var(--ink0);border:1px solid var(--ink3);margin:10px 0;}
.sbar i{display:block;height:100%;transition:width .6s ease;}
.slegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg2);}
.slegend .li{display:flex;align-items:center;gap:6px;}
.slegend .dot{width:9px;height:9px;border-radius:3px;}

/* ---------- 画板 ---------- */
.paint{display:flex;flex-direction:column;height:100%;}
.paint-cv{flex:1;position:relative;overflow:hidden;background:#23232e;display:flex;align-items:center;justify-content:center;}
.paint-cv canvas{background:#fffef8;box-shadow:0 8px 30px rgba(0,0,0,.5);border-radius:4px;touch-action:none;max-width:100%;max-height:100%;}
.swatch{width:24px;height:24px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:.12s;flex:none;}
.swatch.on{border-color:var(--fg);transform:scale(1.12);}

/* ---------- 浏览器 ---------- */
.brw{display:flex;flex-direction:column;height:100%;}
.brw-bar{flex:none;display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(220,215,186,.07);}
.brw-url{flex:1;padding:8px 14px;background:rgba(22,22,29,.6);border:1px solid var(--ink3);border-radius:99px;font-size:12.5px;font-family:var(--font-mono);outline:none;min-width:0;}
.brw-url:focus{border-color:var(--blue);}
.brw iframe{flex:1;border:none;background:#fff;width:100%;}
.brw-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,var(--ink0),var(--ink1));}

/* ---------- 媒体/查看器 ---------- */
.viewer{height:100%;display:flex;flex-direction:column;background:#101015;}
.viewer .vmain{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;}
.viewer img{max-width:none;cursor:grab;transition:transform .15s ease;user-select:none;-webkit-user-drag:none;}
.player{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:radial-gradient(circle at 50% 30%,#23232e,#121218);}
.player video{max-width:100%;max-height:calc(100% - 40px);border-radius:10px;box-shadow:0 14px 50px rgba(0,0,0,.6);}
.player audio{width:min(420px,90%);}
.player .pdisc{width:130px;height:130px;border-radius:50%;background:conic-gradient(from 0deg,var(--ink2),var(--ink3),var(--ink2),var(--ink3),var(--ink2));border:1px solid var(--ink4);display:flex;align-items:center;justify-content:center;animation:spin 9s linear infinite;box-shadow:0 10px 40px rgba(0,0,0,.55);}
.player .pdisc::after{content:"";width:34px;height:34px;border-radius:50%;background:var(--gold);border:6px solid var(--ink0);}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 表格 ---------- */
.tbl-wrap{flex:1;overflow:auto;}
.tbl{border-collapse:collapse;font-size:12.5px;min-width:100%;}
.tbl th{position:sticky;top:0;background:var(--ink2);color:var(--gold);font-weight:600;padding:8px 14px;text-align:left;border:1px solid var(--ink3);white-space:nowrap;z-index:2;font-family:var(--font-mono);font-size:11.5px;}
.tbl td{padding:7px 14px;border:1px solid rgba(54,54,70,.6);color:var(--fg2);white-space:nowrap;}
.tbl tr:nth-child(even) td{background:rgba(42,42,55,.3);}
.tbl tr:hover td{background:rgba(126,156,216,.1);}
.tbl td:first-child{color:var(--mut);font-family:var(--font-mono);background:rgba(22,22,29,.5);font-size:11px;}

/* ---------- VM ---------- */
.vm{height:100%;display:flex;flex-direction:column;background:#000;}
.vm-screen{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;}
#vm_sc div{white-space:pre;font:14px monospace;line-height:14px;color:#ddd;}
#vm_sc canvas{display:block;}

/* ---------- 移动端适配 ---------- */
@media (max-width:768px){
  :root{--cellW:84px;--cellH:100px;}
  .win{inset:0 0 70px 0 !important;width:auto !important;height:auto !important;border-radius:0;border:none;}
  .rs{display:none;}
  .wbtn{width:42px;height:38px;}
  #dock{left:6px;right:6px;bottom:6px;transform:none;max-width:none;border-radius:16px;justify-content:space-between;}
  .titem span{display:none;}
  .titem{padding:0 11px;}
  #start-menu{left:6px;right:6px;bottom:70px;transform:none;width:auto;animation:smin2 .25s;}
  @keyframes smin2{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
  #sm-grid{grid-template-columns:repeat(4,1fr);}
  .fx-side{position:absolute;z-index:20;height:100%;transform:translateX(-100%);transition:.25s;box-shadow:10px 0 30px rgba(0,0,0,.4);background:var(--ink1);}
  .fx-side.open{transform:none;}
  .fx-cols{grid-template-columns:1fr 90px;}
  .fx-cols .fc:nth-child(2),.fx-cols .fc:nth-child(3){display:none;}
  .frow{grid-template-columns:1fr 90px;}
  .frow>div:nth-child(2),.frow>div:nth-child(3){display:none;}
  #icons-layer{inset:0 0 70px 0;}
  .set-nav{width:52px;}
  .set-nav .sn span{display:none;}
  .set-nav .sn{justify-content:center;}
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  PART 1 · 虚拟文件系统  fs                                 ║
   ║  OPFS 主后端 → IndexedDB 降级 → 内存兜底                    ║
   ║  File System Access API 本地挂载（统一接口，无 isLocal 分支）║
   ╚══════════════════════════════════════════════════════════╝ */

/* ----- 路径工具 ----- */
function normPath(p){
  if(!p)return'/';
  const parts=[];
  for(const seg of String(p).split('/')){
    if(!seg||seg==='.')continue;
    if(seg==='..')parts.pop();else parts.push(seg);
  }
  return'/'+parts.join('/');
}
const pathParts=p=>normPath(p).split('/').filter(Boolean);
const parentOf=p=>{const a=pathParts(p);a.pop();return'/'+a.join('/');};
const baseName=p=>pathParts(p).pop()||'';
const joinPath=(...a)=>normPath(a.join('/'));

/* ----- 后端：基于 FileSystemDirectoryHandle（OPFS 与本地挂载共用同一实现）----- */
function HandleBackend(rootHandleOrGetter){
  const getRoot=typeof rootHandleOrGetter==='function'?rootHandleOrGetter:async()=>rootHandleOrGetter;
  async function dirOf(rel,create=false){
    let dir=await getRoot();
    for(const p of rel){dir=await dir.getDirectoryHandle(p,{create});}
    return dir;
  }
  return{
    async readdir(rel,...rest){
      const dir=await dirOf(rel);const out=[];
      for await(const[name,hd]of dir.entries())out.push({name,kind:hd.kind});
      return out;
    },
    async stat(rel,...rest){
      if(rel.length===0)return{kind:'directory',size:null,mtime:null};
      const parent=await dirOf(rel.slice(0,-1));const name=rel[rel.length-1];
      try{
        const fh=await parent.getFileHandle(name);const f=await fh.getFile();
        return{kind:'file',size:f.size,mtime:f.lastModified};
      }catch(e){
        await parent.getDirectoryHandle(name);
        return{kind:'directory',size:null,mtime:null};
      }
    },
    async file(rel,...rest){
      const parent=await dirOf(rel.slice(0,-1));
      const fh=await parent.getFileHandle(rel[rel.length-1]);
      return fh.getFile();
    },
    async write(rel,data,...rest){
      const parent=await dirOf(rel.slice(0,-1),true);
      const fh=await parent.getFileHandle(rel[rel.length-1],{create:true});
      const w=await fh.createWritable();
      await w.write(data);await w.close();
    },
    async mkdir(rel,...rest){await dirOf(rel,true);},
    async rm(rel,...rest){
      const parent=await dirOf(rel.slice(0,-1));
      await parent.removeEntry(rel[rel.length-1],{recursive:true});
    },
  };
}

/* ----- 后端：IndexedDB 降级（OPFS 不可用时）----- */
function IDBBackend(){
  let db=null;
  const ready=new Promise((res,rej)=>{
    const r=indexedDB.open('sumi-vfs',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('files');
    r.onsuccess=()=>{db=r.result;res();};
    r.onerror=()=>rej(r.error);
  });
  const key=rel=>'/'+rel.join('/');
  const op=(mode,fn)=>ready.then(()=>new Promise((res,rej)=>{
    const st=db.transaction('files',mode).objectStore('files');
    const rq=fn(st);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
  }));
  return{
    async readdir(rel){
      const prefix=rel.length?key(rel)+'/':'/';
      const keys=await op('readonly',st=>st.getAllKeys());
      const seen=new Map();
      for(const k of keys){
        if(!k.startsWith(prefix)||k===prefix)continue;
        const rest=k.slice(prefix.length);const name=rest.split('/')[0];
        if(!seen.has(name))seen.set(name,rest.includes('/')?'directory':null);
      }
      const out=[];
      for(const[name,forced]of seen){
        if(forced){out.push({name,kind:'directory'});continue;}
        const rec=await op('readonly',st=>st.get(prefix+name));
        out.push({name,kind:rec&&rec.kind==='file'?'file':'directory'});
      }
      return out;
    },
    async stat(rel){
      if(rel.length===0)return{kind:'directory',size:null,mtime:null};
      const rec=await op('readonly',st=>st.get(key(rel)));
      if(rec){return rec.kind==='file'?{kind:'file',size:rec.data.byteLength,mtime:rec.mtime}:{kind:'directory',size:null,mtime:rec.mtime};}
      const keys=await op('readonly',st=>st.getAllKeys());
      if(keys.some(k=>k.startsWith(key(rel)+'/')))return{kind:'directory',size:null,mtime:null};
      throw new Error('ENOENT: '+key(rel));
    },
    async file(rel){
      const rec=await op('readonly',st=>st.get(key(rel)));
      if(!rec||rec.kind!=='file')throw new Error('ENOENT: '+key(rel));
      return new File([rec.data],rel[rel.length-1],{lastModified:rec.mtime,type:mimeOf(rel[rel.length-1])});
    },
    async write(rel,data){
      let buf;
      if(data instanceof Blob)buf=await data.arrayBuffer();
      else if(typeof data==='string')buf=new TextEncoder().encode(data).buffer;
      else if(data instanceof ArrayBuffer)buf=data;
      else if(ArrayBuffer.isView(data))buf=data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength);
      else buf=new ArrayBuffer(0);
      for(let i=1;i<rel.length;i++){
        const dk=key(rel.slice(0,i));
        const ex=await op('readonly',st=>st.get(dk));
        if(!ex)await op('readwrite',st=>st.put({kind:'directory',mtime:Date.now()},dk));
      }
      await op('readwrite',st=>st.put({kind:'file',data:buf,mtime:Date.now()},key(rel)));
    },
    async mkdir(rel){
      for(let i=1;i<=rel.length;i++){
        const dk=key(rel.slice(0,i));
        const ex=await op('readonly',st=>st.get(dk));
        if(!ex)await op('readwrite',st=>st.put({kind:'directory',mtime:Date.now()},dk));
      }
    },
    async rm(rel){
      const k=key(rel);
      const keys=await op('readonly',st=>st.getAllKeys());
      for(const kk of keys)if(kk===k||kk.startsWith(k+'/'))await op('readwrite',st=>st.delete(kk));
    },
  };
}

/* ----- 后端：内存兜底（极端环境）----- */
function MemBackend(){
  const map=new Map();map.set('/',{kind:'directory',mtime:Date.now()});
  const key=rel=>'/'+rel.join('/');
  return{
    async readdir(rel){
      const prefix=rel.length?key(rel)+'/':'/';const seen=new Map();
      for(const k of map.keys()){
        if(!k.startsWith(prefix)||k===prefix||k==='/')continue;
        const rest=k.slice(prefix.length);const name=rest.split('/')[0];
        if(!seen.has(name))seen.set(name,rest.includes('/')?'directory':map.get(prefix+name)?.kind||'directory');
      }
      return[...seen].map(([name,kind])=>({name,kind:kind==='file'?'file':'directory'}));
    },
    async stat(rel){
      if(!rel.length)return{kind:'directory',size:null,mtime:null};
      const rec=map.get(key(rel));
      if(rec)return rec.kind==='file'?{kind:'file',size:rec.data.byteLength,mtime:rec.mtime}:{kind:'directory',size:null,mtime:rec.mtime};
      for(const k of map.keys())if(k.startsWith(key(rel)+'/'))return{kind:'directory',size:null,mtime:null};
      throw new Error('ENOENT: '+key(rel));
    },
    async file(rel){
      const rec=map.get(key(rel));
      if(!rec||rec.kind!=='file')throw new Error('ENOENT');
      return new File([rec.data],rel[rel.length-1],{lastModified:rec.mtime,type:mimeOf(rel[rel.length-1])});
    },
    async write(rel,data){
      let buf;
      if(data instanceof Blob)buf=await data.arrayBuffer();
      else if(typeof data==='string')buf=new TextEncoder().encode(data).buffer;
      else if(data instanceof ArrayBuffer)buf=data;
      else if(ArrayBuffer.isView(data))buf=data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength);
      else buf=new ArrayBuffer(0);
      for(let i=1;i<rel.length;i++)if(!map.has(key(rel.slice(0,i))))map.set(key(rel.slice(0,i)),{kind:'directory',mtime:Date.now()});
      map.set(key(rel),{kind:'file',data:buf,mtime:Date.now()});
    },
    async mkdir(rel){for(let i=1;i<=rel.length;i++)if(!map.has(key(rel.slice(0,i))))map.set(key(rel.slice(0,i)),{kind:'directory',mtime:Date.now()});},
    async rm(rel){const k=key(rel);for(const kk of[...map.keys()])if(kk===k||kk.startsWith(k+'/'))map.delete(kk);},
  };
}

/* ----- fs 路由器：统一 API，挂载点透明分派 ----- */
const fs=(()=>{
  let rootBackend=null;
  let backendName='memory';
  const mounts=[]; // {prefix, parts, backend, label}
  function resolve(path){
    const p=normPath(path);const parts=pathParts(p);
    let best=null;
    for(const m of mounts){
      if(p===m.prefix||p.startsWith(m.prefix+'/')){
        if(!best||m.parts.length>best.parts.length)best=m;
      }
    }
    if(best)return{backend:best.backend,rel:parts.slice(best.parts.length)};
    return{backend:rootBackend,rel:parts};
  }
  return{
    get backendName(){return backendName;},
    get mountList(){return mounts.slice();},
    async init(){
      // 探测 OPFS 可用性（含 createWritable）
      try{
        const root=await navigator.storage.getDirectory();
        const fh=await root.getFileHandle('.probe',{create:true});
        const w=await fh.createWritable();await w.write('ok');await w.close();
        await root.removeEntry('.probe');
        rootBackend=HandleBackend(()=>navigator.storage.getDirectory());
        backendName='OPFS';
      }catch(e1){
        try{
          rootBackend=IDBBackend();
          await rootBackend.readdir([]);
          backendName='IndexedDB';
        }catch(e2){
          rootBackend=MemBackend();
          backendName='Memory';
        }
      }
      try{await navigator.storage.persist?.();}catch(e){}
    },
    mount(prefix,backend,label){
      const p=normPath(prefix);
      this.unmount(p);
      mounts.push({prefix:p,parts:pathParts(p),backend,label:label||baseName(p)});
    },
    unmount(prefix){
      const p=normPath(prefix);
      const i=mounts.findIndex(m=>m.prefix===p);
      if(i>=0)mounts.splice(i,1);
    },
    async readdir(path,...rest){
      const p=normPath(path);
      const{backend,rel}=resolve(p);
      let out=[];
      try{out=await backend.readdir(rel);}catch(e){if(p!=='/mnt/local')throw e;}
      // 合成挂载点目录
      for(const m of mounts){
        if(parentOf(m.prefix)===p&&!out.some(x=>x.name===baseName(m.prefix)))
          out.push({name:baseName(m.prefix),kind:'directory',mounted:true});
      }
      return out;
    },
    async stat(path,...rest){
      const p=normPath(path);
      for(const m of mounts)if(m.prefix===p)return{kind:'directory',size:null,mtime:null,mounted:true};
      const{backend,rel}=resolve(p);
      return backend.stat(rel);
    },
    async exists(path,...rest){try{await this.stat(path);return true;}catch(e){return false;}},
    async readFile(path,as='arrayBuffer',...rest){
      const{backend,rel}=resolve(path);
      const f=await backend.file(rel);
      if(as==='text')return f.text();
      if(as==='blob'||as==='file')return f;
      if(as==='url')return URL.createObjectURL(f);
      return f.arrayBuffer();
    },
    async writeFile(path,data,...rest){
      const{backend,rel}=resolve(path);
      return backend.write(rel,data);
    },
    async mkdir(path,...rest){
      const{backend,rel}=resolve(path);
      return backend.mkdir(rel);
    },
    async rm(path,...rest){
      const p=normPath(path);
      for(const m of mounts)if(m.prefix===p){this.unmount(p);return;}
      const{backend,rel}=resolve(p);
      return backend.rm(rel);
    },
    async copy(src,dst,...rest){
      const st=await this.stat(src);
      if(st.kind==='file'){
        const f=await this.readFile(src,'blob');
        await this.writeFile(dst,f);
      }else{
        await this.mkdir(dst);
        const kids=await this.readdir(src);
        for(const k of kids)await this.copy(joinPath(src,k.name),joinPath(dst,k.name));
      }
    },
    async rename(src,dst,...rest){
      if(normPath(src)===normPath(dst))return;
      await this.copy(src,dst);
      await this.rm(src);
    },
    async uniqueName(dir,name,...rest){
      if(!await this.exists(joinPath(dir,name)))return name;
      const e=extOf(name);const base=e?name.slice(0,-(e.length+1)):name;
      for(let i=2;i<999;i++){
        const cand=e?`${base} (${i}).${e}`:`${base} (${i})`;
        if(!await this.exists(joinPath(dir,cand)))return cand;
      }
      return name+'-'+uid();
    },
    async dirSize(path,...rest){
      let total=0;
      try{
        const st=await this.stat(path);
        if(st.kind==='file')return st.size||0;
        const kids=await this.readdir(path);
        for(const k of kids)total+=await this.dirSize(joinPath(path,k.name));
      }catch(e){}
      return total;
    },
  };
})();
window.fs=fs;

/* ----- Blob URL 管理 ----- */
const _urlCache=new Map();
async function urlFor(path){
  if(_urlCache.has(path))return _urlCache.get(path);
  const f=await fs.readFile(path,'blob');
  const blob=f.type?f:new Blob([f],{type:mimeOf(baseName(path))});
  const u=URL.createObjectURL(blob);
  _urlCache.set(path,u);
  return u;
}
function dropUrl(path){
  if(_urlCache.has(path)){setTimeout(()=>URL.revokeObjectURL(_urlCache.get(path)),6000);_urlCache.delete(path);}
}

/* ----- 拖出缓存：dragstart 必须同步，数据需预加载 ----- */
const dragCache=new Map(); // path -> {file, url, t}
async function preloadDrag(path){
  try{
    const st=await fs.stat(path);
    if(st.kind!=='file')return;
    const c=dragCache.get(path);
    if(c&&Date.now()-c.t<30000)return;
    const f0=await fs.readFile(path,'file');
    const file=new File([f0],baseName(path),{type:f0.type||mimeOf(baseName(path)),lastModified:f0.lastModified||Date.now()});
    const url=URL.createObjectURL(file);
    if(c)setTimeout(()=>URL.revokeObjectURL(c.url),6000);
    dragCache.set(path,{file,url,t:Date.now()});
  }catch(e){}
}
function applyDragOut(e,path){
  const c=dragCache.get(path);
  if(!c)return;
  try{e.dataTransfer.items.add(c.file);}catch(err){}
  try{e.dataTransfer.setData('DownloadURL',`${c.file.type||'application/octet-stream'}:${c.file.name}:${c.url}`);}catch(err){}
}
function scheduleDragCacheCleanup(path){
  setTimeout(()=>{
    const c=dragCache.get(path);
    if(c&&Date.now()-c.t>9000){URL.revokeObjectURL(c.url);dragCache.delete(path);}
  },10000);
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  PART 2 · 窗口管理器 / 任务栏 / 对话框 / 菜单 / 开始菜单     ║

const WM=(()=>{
  const wins=new Map();
  let zTop=100,activeId=null,offset=0;
  const layer=()=>$('#windows-layer');

  function create(opts){
    const id=uid();
    const W=window.innerWidth,H=window.innerHeight;
    let w=Math.min(opts.width||640,W-20),hh=Math.min(opts.height||440,H-110);
    let x=opts.x!=null?opts.x:clamp(60+(offset%6)*34,0,W-w-10);
    let y=opts.y!=null?opts.y:clamp(50+(offset%6)*30,0,H-hh-100);
    offset++;
    const el=h('div',{cls:'win',style:`left:${x}px;top:${y}px;width:${w}px;height:${hh}px;z-index:${++zTop}`});
    const titleEl=h('div',{cls:'wtitle'},opts.title||'窗口');
    const tb=h('div',{cls:'win-tb'},
      h('span',{cls:'wic',html:icon(opts.icon||'file',17)}),
      titleEl,
      h('button',{cls:'wbtn',title:'最小化',html:icon('minimize',15),onclick:e=>{e.stopPropagation();minimize(id);}}),
      h('button',{cls:'wbtn wmax',title:'最大化',html:icon('maximize',14),onclick:e=>{e.stopPropagation();toggleMax(id);}}),
      h('button',{cls:'wbtn wclose',title:'关闭',html:icon('close',15),onclick:e=>{e.stopPropagation();close(id);}})
    );
    const body=h('div',{cls:'win-body'});
    el.append(tb,body);
    // 八向 resize 手柄
    for(const dir of['n','s','e','w','ne','nw','se','sw']){
      const hd=h('div',{cls:`rs rs-${dir}`});
      hd.addEventListener('pointerdown',ev=>startResize(ev,id,dir));
      el.append(hd);
    }
    layer().append(el);
    const win={id,el,body,opts,minimized:false,maxed:false,prev:null,
      setTitle(t){titleEl.textContent=t;},
      close:()=>close(id),focus:()=>focus(id)};
    wins.set(id,win);
    el.addEventListener('pointerdown',()=>focus(id),true);
    // 标题栏拖动
    tb.addEventListener('pointerdown',ev=>{
      if(ev.target.closest('.wbtn'))return;
      startDrag(ev,id);
    });
    tb.addEventListener('dblclick',ev=>{if(!ev.target.closest('.wbtn'))toggleMax(id);});
    if(isMobile())setMax(id,true);
    focus(id);
    renderTasks();
    return win;
  }
  function startDrag(ev,id){
    const win=wins.get(id);if(!win||win.maxed||isMobile())return;
    ev.preventDefault();
    const el=win.el,sx=ev.clientX,sy=ev.clientY,ox=el.offsetLeft,oy=el.offsetTop;
    const move=e=>{
      el.style.left=clamp(ox+e.clientX-sx,-el.offsetWidth+90,window.innerWidth-50)+'px';
      el.style.top=clamp(oy+e.clientY-sy,0,window.innerHeight-60)+'px';
    };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  }
  function startResize(ev,id,dir){
    const win=wins.get(id);if(!win||win.maxed)return;
    ev.preventDefault();ev.stopPropagation();
    focus(id);
    const el=win.el,sx=ev.clientX,sy=ev.clientY;
    const r={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
    const move=e=>{
      const dx=e.clientX-sx,dy=e.clientY-sy;
      let{x,y,w,h:hh2}=r;
      if(dir.includes('e'))w=Math.max(280,r.w+dx);
      if(dir.includes('s'))hh2=Math.max(160,r.h+dy);
      if(dir.includes('w')){w=Math.max(280,r.w-dx);x=r.x+r.w-w;}
      if(dir.includes('n')){hh2=Math.max(160,r.h-dy);y=r.y+r.h-hh2;}
      el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=hh2+'px';
    };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  }
  function focus(id){
    const win=wins.get(id);if(!win)return;
    if(win.minimized){win.minimized=false;win.el.classList.remove('minz');}
    win.el.style.zIndex=++zTop;
    if(activeId!==id){
      wins.get(activeId)?.el.classList.remove('active');
      win.el.classList.add('active');
      activeId=id;
    }
    renderTasks();
  }
  function minimize(id){
    const win=wins.get(id);if(!win)return;
    win.minimized=true;win.el.classList.add('minz');
    if(activeId===id)activeId=null;
    renderTasks();
  }
  function setMax(id,on){
    const win=wins.get(id);if(!win)return;
    const el=win.el;
    if(on&&!win.maxed){
      win.prev={l:el.style.left,t:el.style.top,w:el.style.width,h:el.style.height};
      el.classList.add('maxed');
      el.style.left='0';el.style.top='0';
      el.style.width='100vw';el.style.height=`calc(100vh - ${isMobile()?70:74}px)`;
      win.maxed=true;
      el.querySelector('.wmax').innerHTML=icon('restore',13);
    }else if(!on&&win.maxed){
      el.classList.remove('maxed');
      Object.assign(el.style,{left:win.prev.l,top:win.prev.t,width:win.prev.w,height:win.prev.h});
      win.maxed=false;
      el.querySelector('.wmax').innerHTML=icon('maximize',14);
    }
  }
  function toggleMax(id){const w2=wins.get(id);if(w2)setMax(id,!w2.maxed);}
  function close(id){
    const win=wins.get(id);if(!win)return;
    win.el.classList.add('closing');
    setTimeout(()=>{win.el.remove();},190);
    wins.delete(id);
    try{win.opts.onClose?.(win);}catch(e){}
    if(activeId===id)activeId=null;
    renderTasks();
  }
  function renderTasks(){
    const c=$('#task-items');c.innerHTML='';
    for(const[id,win]of wins){
      const b=h('button',{cls:'titem'+(id===activeId?' act':'')+(win.minimized?' minz':''),
        html:icon(win.opts.icon||'file',17),
        onclick:()=>{
          if(win.minimized)focus(id);
          else if(activeId===id)minimize(id);
          else focus(id);
        }});
      b.append(h('span',{},win.opts.title||''));
      c.append(b);
    }
  }
  return{create,focus,close,minimize,toggleMax,wins,get activeId(){return activeId;}};
})();

/* ╔════════ 压缩引擎：zip / gz / tar / tar.gz / 7z ════════╗ */
async function gunzip(buf){
  if(!('DecompressionStream'in window))throw new Error('浏览器不支持 DecompressionStream');
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([buf]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer();
}
function parseTar(buf){
  const u8=new Uint8Array(buf);const files=[];let off=0;
  const dec=new TextDecoder();
  const str=(s,l)=>{const seg=u8.subarray(s,s+l);let end=seg.indexOf(0);return dec.decode(end<0?seg:seg.subarray(0,end)).trim();};
  while(off+512<=u8.length){
    const name=str(off,100);
    if(!name)break;
    const size=parseInt(str(off+124,12),8)||0;
    const type=String.fromCharCode(u8[off+156]||48);
    const prefix=str(off+345,155);
    const full=(prefix?prefix+'/':'')+name;
    if(type==='0'||type==='\0'||type==='')files.push({name:full,kind:'file',data:buf.slice(off+512,off+512+size)});
    else if(type==='5')files.push({name:full,kind:'directory'});
    off+=512+Math.ceil(size/512)*512;
  }
  return files;
}
async function extractArchive(path,destDir,statusCb){
  const name=baseName(path),e=extOf(name);
  const note=s=>{statusCb?.(s);};
  const lower=name.toLowerCase();
  const folderBase=name.replace(/\.(zip|7z|tar|gz|tgz|tar\.gz)$/i,'').replace(/\.tar$/i,'')||'解压';
  const folder=joinPath(destDir,await fs.uniqueName(destDir,folderBase));
  const writeEntries=async files=>{
    await fs.mkdir(folder);
    let n=0;
    for(const f of files){
      const target=joinPath(folder,f.name);
      if(f.kind==='directory'){await fs.mkdir(target);continue;}
      await fs.mkdir(parentOf(target));
      await fs.writeFile(target,f.data);
      note(`写入 ${++n}/${files.length}…`);
    }
  };
  if(e==='zip'){
    if(!window.JSZip)throw new Error('JSZip 未加载（检查网络）');
    note('读取压缩包…');
    const zip=await JSZip.loadAsync(await fs.readFile(path));
    const files=[];
    for(const[n2,entry]of Object.entries(zip.files)){
      if(entry.dir)files.push({name:n2.replace(/\/$/,''),kind:'directory'});
      else files.push({name:n2,kind:'file',data:await entry.async('arraybuffer')});
    }
    await writeEntries(files);
  }else if(lower.endsWith('.tar.gz')||e==='tgz'){
    note('解压 gzip…');
    const tarBuf=await gunzip(await fs.readFile(path));
    note('解析 tar…');
    await writeEntries(parseTar(tarBuf));
  }else if(e==='tar'){
    await writeEntries(parseTar(await fs.readFile(path)));
  }else if(e==='gz'){
    note('解压 gzip…');
    const data=await gunzip(await fs.readFile(path));
    await fs.mkdir(folder);
    await fs.writeFile(joinPath(folder,name.slice(0,-3)||'解压文件'),data);
  }else if(e==='7z'){
    note('加载 7z-wasm 引擎…');
    const mod=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    const sevenZip=await mod.default({print:()=>{},printErr:()=>{}});
    const buf=new Uint8Array(await fs.readFile(path));
    sevenZip.FS.mkdir('/work');
    sevenZip.FS.writeFile('/work/archive.7z',buf);
    sevenZip.FS.mkdir('/out');
    note('解压中…');
    sevenZip.callMain(['x','/work/archive.7z','-o/out','-y']);
    const files=[];
    const walk=dir=>{
      for(const n3 of sevenZip.FS.readdir(dir)){
        if(n3==='.'||n3==='..')continue;
        const fp=dir+'/'+n3;
        const st=sevenZip.FS.stat(fp);
        const rel=fp.slice(5);
        if(sevenZip.FS.isDir(st.mode)){files.push({name:rel,kind:'directory'});walk(fp);}
        else files.push({name:rel,kind:'file',data:sevenZip.FS.readFile(fp).buffer});
      }
    };
    walk('/out');
    await writeEntries(files);
  }else{
    throw new Error('暂不支持的压缩格式: '+e);
  }
  return folder;
}
async function extractWithUI(path,destDir){
  ui.toast('开始解压 '+baseName(path));
  try{
    const folder=await extractArchive(path,destDir,()=>{});
    ui.toast('解压完成 → '+baseName(folder));
    bus.emit('fs-changed',destDir);
  }catch(err){ui.toast('解压失败: '+err.message,'err',5000);}
}

/* ----- 事件总线（fs 变化通知桌面/资源管理器刷新）----- */
const bus={
  _m:new Map(),
  on(ev,fn){if(!this._m.has(ev))this._m.set(ev,new Set());this._m.get(ev).add(fn);return()=>this._m.get(ev).delete(fn);},
  emit(ev,...args){this._m.get(ev)?.forEach(fn=>{try{fn(...args);}catch(e){console.warn(e);}});},
};

/* ----- 物理文件导入（webkitGetAsEntry 递归，readEntries 循环）----- */
async function importEntry(entry,destDir){
  if(entry.isFile){
    const file=await new Promise((res,rej)=>entry.file(res,rej));
    const nm=await fs.uniqueName(destDir,file.name);
    await fs.writeFile(joinPath(destDir,nm),await file.arrayBuffer());
  }else if(entry.isDirectory){
    const nm=await fs.uniqueName(destDir,entry.name);
    const nd=joinPath(destDir,nm);
    await fs.mkdir(nd);
    const reader=entry.createReader();
    while(true){
      const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
      if(!batch.length)break;
      for(const en of batch)await importEntry(en,nd);
    }
  }
}
async function importDataTransfer(dt,destDir){
  const entries=[];
  if(dt.items){
    for(const item of dt.items){
      if(item.kind!=='file')continue;
      const ent=item.webkitGetAsEntry?.();
      if(ent)entries.push(ent);
    }
  }
  let count=0;
  if(entries.length){
    for(const ent of entries){await importEntry(ent,destDir);count++;}
  }else if(dt.files?.length){
    for(const f of dt.files){
      const nm=await fs.uniqueName(destDir,f.name);
      await fs.writeFile(joinPath(destDir,nm),await f.arrayBuffer());
      count++;
    }
  }
  if(count){ui.toast(`已导入 ${count} 个项目`);bus.emit('fs-changed',destDir);}
  return count;
}
async function importFilesTo(destDir){
  pickFiles(async files=>{
    for(const f of files){
      const nm=await fs.uniqueName(destDir,f.name);
      await fs.writeFile(joinPath(destDir,nm),await f.arrayBuffer());
    }
    ui.toast(`已导入 ${files.length} 个文件`);
    bus.emit('fs-changed',destDir);
  });
}

/* ----- 导出 / 下载（移动端拖拽替代方案）----- */
async function downloadPath(path){
  const st=await fs.stat(path);
  if(st.kind==='file'){
    const url=await urlFor(path);
    const a=h('a',{href:url,download:baseName(path)});
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>dropUrl(path),4000);
    ui.toast('已开始下载 '+baseName(path));
  }else{
    if(!window.JSZip){ui.toast('JSZip 未加载，无法打包文件夹','err');return;}
    ui.toast('正在打包文件夹…');
    const zip=new JSZip();
    const addDir=async(p,zf)=>{
      for(const k of await fs.readdir(p)){
        const kp=joinPath(p,k.name);
        if(k.kind==='directory')await addDir(kp,zf.folder(k.name));
        else zf.file(k.name,await fs.readFile(kp));
      }
    };
    await addDir(path,zip);
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    const a=h('a',{href:url,download:baseName(path)+'.zip'});
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
  }
}

/* ----- 剪贴板（复制/剪切/粘贴）----- */
const clipboard={mode:null,paths:[]};
async function pasteInto(destDir){
  if(!clipboard.paths.length)return;
  const mode=clipboard.mode,paths=clipboard.paths.slice();
  for(const p of paths){
    if(destDir===p||destDir.startsWith(p+'/')){ui.toast('不能粘贴到自身内部','warn');continue;}
    const nm=await fs.uniqueName(destDir,baseName(p));
    const target=joinPath(destDir,nm);
    try{
      if(mode==='cut'){await fs.rename(p,target);}
      else await fs.copy(p,target);
    }catch(err){ui.toast('粘贴失败: '+err.message,'err');}
  }
  if(mode==='cut'){clipboard.paths=[];clipboard.mode=null;}
  ui.toast('粘贴完成');
  bus.emit('fs-changed',destDir);
  for(const p of paths)bus.emit('fs-changed',parentOf(p));
}

/* ╔════════ 桌面图标系统 ════════╗ */
const Desktop=(()=>{
  const layerEl=()=>$('#icons-layer');
  let entries=[];
  const selected=new Set(); // names
  let positions={};
  try{positions=JSON.parse(localStorage.getItem('sumi.deskpos')||'{}');}catch(e){}
  const savePos=()=>localStorage.setItem('sumi.deskpos',JSON.stringify(positions));
  const cellW=()=>isMobile()?84:96, cellH=()=>isMobile()?100:108;
  const PAD=10;

  function gridCell(x,y){
    const cols=Math.max(1,Math.floor((layerEl().clientWidth-PAD)/cellW()));
    const rows=Math.max(1,Math.floor((layerEl().clientHeight-PAD)/cellH()));
    return{c:clamp(Math.round((x-PAD)/cellW()),0,cols-1),r:clamp(Math.round((y-PAD)/cellH()),0,rows-1),cols,rows};
  }
  const cellXY=(c,r)=>({x:PAD+c*cellW(),y:PAD+r*cellH()});
  function freeCell(taken){
    const cols=Math.max(1,Math.floor((layerEl().clientWidth-PAD)/cellW()));
    const rows=Math.max(1,Math.floor((layerEl().clientHeight-PAD)/cellH()));
    for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
      if(!taken.has(c+','+r))return{c,r};
    }
    return{c:0,r:0};
  }

  async function refresh(){
    try{entries=await fs.readdir('/Desktop');}catch(e){entries=[];}
    entries.sort((a,b)=>(a.kind===b.kind?a.name.localeCompare(b.name,'zh'):a.kind==='directory'?-1:1));
    render();
  }
  function render(){
    const layer=layerEl();
    layer.querySelectorAll('.dicon').forEach(n=>n.remove());
    const taken=new Set();
    for(const en of entries){const p=positions[en.name];if(p)taken.add(p.c+','+p.r);}
    for(const en of entries){
      if(!positions[en.name]){
        const cell=freeCell(taken);
        positions[en.name]=cell;
        taken.add(cell.c+','+cell.r);
      }
    }
    savePos();
    for(const en of entries)layer.append(makeIcon(en));
  }
  /* 原地更新选中样式 —— 不重建 DOM，避免破坏拖拽/点击手势 */
  function paintSel(){
    layerEl().querySelectorAll('.dicon').forEach(ic=>ic.classList.toggle('selected',selected.has(ic.dataset.name)));
  }
  function makeIcon(en){
    const pos=positions[en.name];
    const{x,y}=cellXY(pos.c,pos.r);
    const path=joinPath('/Desktop',en.name);
    const el=h('div',{cls:'dicon'+(selected.has(en.name)?' selected':''),draggable:'true','data-name':en.name,'data-kind':en.kind,
      style:`left:${x}px;top:${y}px`},
      h('div',{cls:'tile',html:icon(fileIconName(en.name,en.kind),44)}),
      h('div',{cls:'lbl'},en.name));
    // 预加载拖出数据（dragstart 必须同步）
    el.addEventListener('mouseenter',()=>preloadDrag(path));
    el.addEventListener('pointerdown',e=>{
      preloadDrag(path);
      if(e.ctrlKey||e.metaKey){
        if(selected.has(en.name))selected.delete(en.name);else selected.add(en.name);
        paintSel();e.stopPropagation();
      }else if(!selected.has(en.name)){
        selected.clear();selected.add(en.name);paintSel();
      }
    });
    // 单击打开
    el.addEventListener('click',e=>{
      if(e.ctrlKey||e.metaKey||el._justDragged)return;
      selected.clear();selected.add(en.name);
      openPath(path);
    });
    el.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      if(!selected.has(en.name)){selected.clear();selected.add(en.name);paintSel();}
      iconMenu(e.clientX,e.clientY,en);
    });
    /* HTML5 原生拖拽（统一内部移动 + 拖出下载）*/
    el.addEventListener('dragstart',e=>{
      if(!selected.has(en.name)){selected.clear();selected.add(en.name);paintSel();}
      const names=[...selected];
      e.dataTransfer.setData('application/x-sumi',JSON.stringify({src:'desktop',paths:names.map(n=>joinPath('/Desktop',n)),grabbed:en.name}));
      e.dataTransfer.effectAllowed='copyMove';
      if(en.kind==='file')applyDragOut(e,path);
      requestAnimationFrame(()=>el.classList.add('dragging'));
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging');
      scheduleDragCacheCleanup(path);
    });
    // 拖到文件夹图标上 → 移入
    if(en.kind==='directory'){
      el.addEventListener('dragover',e=>{
        if(e.dataTransfer.types.includes('application/x-sumi')||e.dataTransfer.types.includes('Files')){
          e.preventDefault();e.stopPropagation();el.style.background='rgba(230,195,132,.25)';
        }
      });
      el.addEventListener('dragleave',()=>{el.style.background='';});
      el.addEventListener('drop',async e=>{
        e.preventDefault();e.stopPropagation();el.style.background='';
        await handleDropOnFolder(e,path);
      });
    }
    // 触摸拖拽
    attachTouchDrag(el,en);
    return el;
  }
  async function handleDropOnFolder(e,folderPath){
    const raw=e.dataTransfer.getData('application/x-sumi');
    if(raw){
      const data=JSON.parse(raw);
      for(const p of data.paths){
        if(p===folderPath||folderPath.startsWith(p+'/'))continue;
        const nm=await fs.uniqueName(folderPath,baseName(p));
        try{await fs.rename(p,joinPath(folderPath,nm));}catch(err){ui.toast('移动失败: '+err.message,'err');}
        delete positions[baseName(p)];
      }
      savePos();
      bus.emit('fs-changed','/Desktop');bus.emit('fs-changed',folderPath);
    }else{
      await importDataTransfer(e.dataTransfer,folderPath);
    }
  }
  function moveTo(name,x,y){
    const{c,r}=gridCell(x,y);
    // 若目标格被占且不是自己 → 找最近空格
    const occ=Object.entries(positions).find(([n,p])=>n!==name&&p.c===c&&p.r===r);
    let cell={c,r};
    if(occ){
      const taken=new Set(Object.entries(positions).filter(([n])=>n!==name).map(([,p])=>p.c+','+p.r));
      let best=null,bd=1e9;
      const cols=Math.max(1,Math.floor((layerEl().clientWidth-PAD)/cellW()));
      const rows=Math.max(1,Math.floor((layerEl().clientHeight-PAD)/cellH()));
      for(let cc=0;cc<cols;cc++)for(let rr=0;rr<rows;rr++){
        if(taken.has(cc+','+rr))continue;
        const d=(cc-c)**2+(rr-r)**2;
        if(d<bd){bd=d;best={c:cc,r:rr};}
      }
      if(best)cell=best;
    }
    positions[name]=cell;
    savePos();
    const el=layerEl().querySelector(`.dicon[data-name="${CSS.escape(name)}"]`);
    if(el){const{x:nx,y:ny}=cellXY(cell.c,cell.r);el.style.left=nx+'px';el.style.top=ny+'px';}
  }
  /* 触摸长按拖拽 + 长按菜单 */
  function attachTouchDrag(el,en){
    let timer=null,ghost=null,startT=null,moved=false,dragging=false;
    el.addEventListener('touchstart',e=>{
      const t=e.touches[0];startT={x:t.clientX,y:t.clientY};moved=false;dragging=false;
      preloadDrag(joinPath('/Desktop',en.name));
      timer=setTimeout(()=>{
        if(!moved){
          selected.clear();selected.add(en.name);paintSel();
          iconMenu(startT.x,startT.y,en);
          timer=null;
        }
      },550);
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      const t=e.touches[0];
      const dx=t.clientX-startT.x,dy=t.clientY-startT.y;
      if(Math.hypot(dx,dy)>10){
        moved=true;
        if(timer){clearTimeout(timer);timer=null;}
        if(!dragging){
          dragging=true;
          ghost=el.cloneNode(true);
          ghost.style.cssText=`position:fixed;left:${t.clientX-42}px;top:${t.clientY-50}px;width:84px;z-index:99999;opacity:.75;pointer-events:none;margin:0;`;
          document.body.append(ghost);
          el.classList.add('dragging');
        }
      }
      if(dragging){
        e.preventDefault();
        ghost.style.left=(t.clientX-42)+'px';
        ghost.style.top=(t.clientY-50)+'px';
      }
    },{passive:false});
    el.addEventListener('touchend',async e=>{
      if(timer){clearTimeout(timer);timer=null;}
      if(dragging){
        const t=e.changedTouches[0];
        ghost.remove();ghost=null;
        el.classList.remove('dragging');
        const target=document.elementFromPoint(t.clientX,t.clientY);
        const folderEl=target?.closest('.dicon[data-kind="directory"]');
        const fxList=target?.closest('.fx-list');
        if(folderEl&&folderEl!==el){
          const fp=joinPath('/Desktop',folderEl.dataset.name);
          const nm=await fs.uniqueName(fp,en.name);
          await fs.rename(joinPath('/Desktop',en.name),joinPath(fp,nm));
          delete positions[en.name];savePos();
          bus.emit('fs-changed','/Desktop');
        }else if(fxList&&fxList._fxDropDir){
          const dd=fxList._fxDropDir();
          const nm=await fs.uniqueName(dd,en.name);
          await fs.rename(joinPath('/Desktop',en.name),joinPath(dd,nm));
          delete positions[en.name];savePos();
          bus.emit('fs-changed','/Desktop');bus.emit('fs-changed',dd);
        }else{
          const rect=layerEl().getBoundingClientRect();
          moveTo(en.name,t.clientX-rect.left-42,t.clientY-rect.top-30);
        }
        el._justDragged=true;setTimeout(()=>el._justDragged=false,400);
      }else if(!moved){
        // 触摸单击 → 打开
        el._justDragged=true;setTimeout(()=>el._justDragged=false,400);
        openPath(joinPath('/Desktop',en.name));
      }
    });
  }
  function iconMenu(x,y,en){
    const path=joinPath('/Desktop',en.name);
    const multi=selected.size>1;
    const cat=catOf(en.name);
    const items=[
      {label:multi?`打开 ${selected.size} 个项目`:'打开',icon:'open',action:()=>{for(const n of selected)openPath(joinPath('/Desktop',n));}},
    ];
    if(en.kind==='file'&&cat==='archive')items.push({label:'解压到桌面',icon:'extract',action:()=>extractWithUI(path,'/Desktop')});
    if(en.kind==='file'&&cat==='image')items.push({label:'设为壁纸',icon:'wallpaper',action:async()=>setWallpaperCustom(await fs.readFile(path,'blob'))});
    if(en.kind==='file'&&cat==='html'){
      items.push({label:'在浏览器中打开',icon:'appBrowser',action:async()=>Apps.browser.launch({url:await urlFor(path),label:en.name})});
      items.push({label:'编辑源代码',icon:'appCode',action:()=>Apps.code.launch({path})});
    }
    items.push(
      {sep:true},
      {label:'复制',icon:'copy',action:()=>{clipboard.mode='copy';clipboard.paths=[...selected].map(n=>joinPath('/Desktop',n));ui.toast(`已复制 ${clipboard.paths.length} 项`);}},
      {label:'剪切',icon:'cut',action:()=>{clipboard.mode='cut';clipboard.paths=[...selected].map(n=>joinPath('/Desktop',n));ui.toast(`已剪切 ${clipboard.paths.length} 项`);}},
      {label:'重命名',icon:'rename',action:async()=>{
        const nn=await ui.prompt('重命名',en.name);
        if(nn&&nn!==en.name){
          await fs.rename(path,joinPath('/Desktop',nn));
          positions[nn]=positions[en.name];delete positions[en.name];savePos();
          bus.emit('fs-changed','/Desktop');
        }
      }},
      {label:'导出 / 下载',icon:'download',action:()=>{for(const n of selected)downloadPath(joinPath('/Desktop',n));}},
      {sep:true},
      {label:multi?`删除 ${selected.size} 个项目`:'删除',icon:'trash',danger:true,action:async()=>{
        if(!await ui.confirm('删除确认',`确定删除${multi?` ${selected.size} 个项目`:` “${en.name}”`}吗？此操作不可恢复。`,true))return;
        for(const n of selected){await fs.rm(joinPath('/Desktop',n));delete positions[n];}
        selected.clear();savePos();
        bus.emit('fs-changed','/Desktop');
      }},
    );
    showMenu(x,y,items);
  }
  function deskMenu(x,y){
    showMenu(x,y,[
      {label:'刷新',icon:'refresh',action:refresh},
      {label:'整理图标',icon:'menuBars',action:()=>{positions={};savePos();render();}},
      {sep:true},
      {label:'新建文件夹',icon:'newFolder',action:async()=>{
        const nm=await ui.prompt('新建文件夹','新建文件夹');
        if(nm){await fs.mkdir(joinPath('/Desktop',await fs.uniqueName('/Desktop',nm)));bus.emit('fs-changed','/Desktop');}
      }},
      {label:'新建文本文件',icon:'newFile',action:async()=>{
        const nm=await ui.prompt('新建文本文件','未命名.txt');
        if(nm){await fs.writeFile(joinPath('/Desktop',await fs.uniqueName('/Desktop',nm)),'');bus.emit('fs-changed','/Desktop');}
      }},
      {label:'上传文件到桌面',icon:'upload',action:()=>importFilesTo('/Desktop')},
      clipboard.paths.length?{label:`粘贴（${clipboard.paths.length} 项）`,icon:'paste',action:()=>pasteInto('/Desktop')}:null,
      {sep:true},
      {label:'更换壁纸',icon:'wallpaper',action:()=>Apps.settings.launch({tab:'wall'})},
      {label:document.fullscreenElement?'退出全屏':'全屏模式',icon:'fullscreen',action:toggleFullscreen},
      {label:'系统设置',icon:'appSettings',action:()=>Apps.settings.launch()},
    ]);
  }
  /* 桌面背景：框选 + 右键 + 拖放导入/内部移动 */
  function bindDesktop(){
    const layer=layerEl();
    const desk=$('#desktop');
    layer.addEventListener('contextmenu',e=>{
      if(e.target.closest('.dicon'))return;
      e.preventDefault();deskMenu(e.clientX,e.clientY);
    });
    // 框选（鼠标）
    let mq=null;
    layer.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('.dicon')||isTouch&&e.pointerType==='touch')return;
      const rect=layer.getBoundingClientRect();
      mq={x0:e.clientX-rect.left,y0:e.clientY-rect.top};
      if(!(e.ctrlKey||e.metaKey)){selected.clear();paintSel();}
      const mEl=$('#marquee');
      const move=ev=>{
        const x1=ev.clientX-rect.left,y1=ev.clientY-rect.top;
        const l=Math.min(mq.x0,x1),t=Math.min(mq.y0,y1),w2=Math.abs(x1-mq.x0),h2=Math.abs(y1-mq.y0);
        if(w2+h2>8)mEl.style.display='block';
        Object.assign(mEl.style,{left:l+'px',top:t+'px',width:w2+'px',height:h2+'px'});
        layer.querySelectorAll('.dicon').forEach(ic=>{
          const ir={l:ic.offsetLeft,t:ic.offsetTop,r:ic.offsetLeft+ic.offsetWidth,b:ic.offsetTop+ic.offsetHeight};
          const hit=ir.l<l+w2&&ir.r>l&&ir.t<t+h2&&ir.b>t;
          ic.classList.toggle('selected',hit);
          if(hit)selected.add(ic.dataset.name);else if(!ev.ctrlKey&&!ev.metaKey)selected.delete(ic.dataset.name);
        });
      };
      const up=()=>{
        mEl.style.display='none';
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
    });
    // 拖放：内部移动 + 物理桌面导入
    layer.addEventListener('dragover',e=>{
      e.preventDefault();
      if(e.dataTransfer.types.includes('Files')&&!e.dataTransfer.types.includes('application/x-sumi'))desk.classList.add('drag-over');
      e.dataTransfer.dropEffect=e.dataTransfer.types.includes('application/x-sumi')?'move':'copy';
    });
    layer.addEventListener('dragleave',e=>{if(e.target===layer)desk.classList.remove('drag-over');});
    layer.addEventListener('drop',async e=>{
      e.preventDefault();desk.classList.remove('drag-over');
      const raw=e.dataTransfer.getData('application/x-sumi');
      const rect=layer.getBoundingClientRect();
      const dx=e.clientX-rect.left,dy=e.clientY-rect.top;
      if(raw){
        const data=JSON.parse(raw);
        if(data.src==='desktop'){
          // 内部移动：以被抓取图标为基准整组平移
          const gName=data.grabbed;
          const gPos=positions[gName]||{c:0,r:0};
          const{c:nc,r:nr}=gridCell(dx-42,dy-30);
          const dc=nc-gPos.c,dr=nr-gPos.r;
          for(const p of data.paths){
            const n=baseName(p);const cur=positions[n]||{c:0,r:0};
            moveTo(n,PAD+(cur.c+dc)*cellW(),PAD+(cur.r+dr)*cellH());
          }
        }else{
          // 从资源管理器拖到桌面 → 移动到 /Desktop
          for(const p of data.paths){
            if(parentOf(p)==='/Desktop')continue;
            const nm=await fs.uniqueName('/Desktop',baseName(p));
            try{await fs.rename(p,joinPath('/Desktop',nm));}catch(err){ui.toast('移动失败: '+err.message,'err');}
            bus.emit('fs-changed',parentOf(p));
          }
          bus.emit('fs-changed','/Desktop');
        }
      }else{
        await importDataTransfer(e.dataTransfer,'/Desktop');
      }
    });
    layer.addEventListener('click',e=>{
      if(!e.target.closest('.dicon')&&!e.ctrlKey){selected.clear();paintSel();}
    });
    bus.on('fs-changed',p=>{if(normPath(p)==='/Desktop')refresh();});
    window.addEventListener('resize',()=>render());
  }
  return{refresh,bindDesktop,get positions(){return positions;}};
})();
