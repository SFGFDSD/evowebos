/* ----- 本地文件夹挂载 (File System Access API → 统一 fs 后端) ----- */
async function mountLocalFolder(){
  if(!window.showDirectoryPicker){
    ui.alert('不支持','当前浏览器不支持 File System Access API（需要 Chrome / Edge 桌面版）。');
    return null;
  }
  try{
    const handle=await showDirectoryPicker({mode:'readwrite'});
    await fs.mkdir('/mnt/local');
    const mp='/mnt/local/'+handle.name;
    fs.mount(mp,HandleBackend(handle),handle.name);
    const rec=JSON.parse(localStorage.getItem('sumi.mounts')||'[]');
    if(!rec.includes(handle.name)){rec.push(handle.name);localStorage.setItem('sumi.mounts',JSON.stringify(rec));}
    ui.toast(`已挂载本地文件夹 “${handle.name}”`);
    bus.emit('fs-changed','/mnt/local');
    bus.emit('mounts-changed');
    return mp;
  }catch(e){
    if(e.name!=='AbortError')ui.toast('挂载失败: '+e.message,'err');
    return null;
  }
}
function unmountLocal(prefix){
  fs.unmount(prefix);
  const nm=baseName(prefix);
  const rec=JSON.parse(localStorage.getItem('sumi.mounts')||'[]').filter(x=>x!==nm);
  localStorage.setItem('sumi.mounts',JSON.stringify(rec));
  ui.toast(`已卸载 “${nm}”`);
  bus.emit('fs-changed','/mnt/local');
  bus.emit('mounts-changed');
}

/* ----- 资源管理器应用 ----- */
function launchExplorer(args={}){
  let cwd=args.path||'/';
  let history=[cwd],hIdx=0;
  let sortKey='name',sortAsc=true;
  let listing=[]; // {name,kind,size,mtime,type}
  const selected=new Set();
  let searchMode=null; // null 或 {query, results}

  const win=WM.create({title:'文件',icon:'appFiles',width:860,height:560});
  const root=h('div',{cls:'fx'});
  const side=h('div',{cls:'fx-side'});
  const main=h('div',{cls:'fx-main'});
  root.append(side,main);
  win.body.append(root);

  /* --- 侧边栏 --- */
  function renderSide(){
    side.innerHTML='';
    side.append(h('div',{cls:'sh'},'快速访问'));
    const quick=[['/','根目录','home'],['/Desktop','桌面','wallpaper'],['/Documents','文档','doc'],['/Pictures','图片','pic'],['/Music','音乐','music'],['/Downloads','下载','dl']];
    for(const[p,label,ic]of quick){
      const it=h('div',{cls:'si'+(cwd===p?' on':''),onclick:()=>nav(p)},h('span',{html:icon(ic,16)}),label);
      bindDirDrop(it,p);
      side.append(it);
    }
    side.append(h('div',{cls:'sh'},'本地挂载'));
    for(const m of fs.mountList){
      const it=h('div',{cls:'si'+(cwd.startsWith(m.prefix)?' on':''),onclick:()=>nav(m.prefix)},
        h('span',{html:icon('drive',16)}),h('span',{style:'flex:1;overflow:hidden;text-overflow:ellipsis'},m.label),
        h('span',{cls:'ej',title:'卸载',html:icon('eject',14),onclick:e=>{e.stopPropagation();unmountLocal(m.prefix);if(cwd.startsWith(m.prefix))nav('/');}}));
      bindDirDrop(it,m.prefix);
      side.append(it);
    }
    side.append(h('div',{cls:'si',style:'color:var(--gold)',onclick:async()=>{const mp=await mountLocalFolder();if(mp)nav(mp);}},
      h('span',{html:icon('mount',16)}),'挂载本地文件夹…'));
  }
  function bindDirDrop(el,dirPath){
    el.addEventListener('dragover',e=>{e.preventDefault();el.style.outline='1px solid var(--gold)';});
    el.addEventListener('dragleave',()=>{el.style.outline='';});
    el.addEventListener('drop',async e=>{
      e.preventDefault();e.stopPropagation();el.style.outline='';
      const raw=e.dataTransfer.getData('application/x-sumi');
      if(raw){
        const data=JSON.parse(raw);
        for(const p of data.paths){
          if(p===dirPath||dirPath.startsWith(p+'/')||parentOf(p)===dirPath)continue;
          const nm=await fs.uniqueName(dirPath,baseName(p));
          try{await fs.rename(p,joinPath(dirPath,nm));}catch(err){ui.toast('移动失败: '+err.message,'err');}
          bus.emit('fs-changed',parentOf(p));
        }
        bus.emit('fs-changed',dirPath);
      }else await importDataTransfer(e.dataTransfer,dirPath);
    });
  }

  /* --- 工具栏 --- */
  const crumb=h('div',{cls:'fx-crumb'});
  const searchInp=h('input',{cls:'fx-search',type:'text',placeholder:'搜索当前目录…'});
  searchInp.addEventListener('keydown',async e=>{
    if(e.key==='Enter'){
      const q=searchInp.value.trim();
      if(!q){searchMode=null;await load();return;}
      ui.toast('搜索中…');
      const results=[];
      const walk=async(p,depth)=>{
        if(depth>5||results.length>300)return;
        let kids=[];try{kids=await fs.readdir(p);}catch(err){return;}
        for(const k of kids){
          const kp=joinPath(p,k.name);
          if(k.name.toLowerCase().includes(q.toLowerCase()))results.push({path:kp,...k});
          if(k.kind==='directory')await walk(kp,depth+1);
        }
      };
      await walk(cwd,0);
      searchMode={query:q,results};
      await load();
    }
    if(e.key==='Escape'){searchInp.value='';searchMode=null;load();}
  });
  const bar=h('div',{cls:'fx-bar'});
  const backBtn=h('button',{cls:'ib',title:'后退',html:icon('back',17),onclick:()=>{if(hIdx>0){hIdx--;cwd=history[hIdx];load();}}});
  const fwdBtn=h('button',{cls:'ib',title:'前进',html:icon('fwd',17),onclick:()=>{if(hIdx<history.length-1){hIdx++;cwd=history[hIdx];load();}}});
  bar.append(
    isMobile()?h('button',{cls:'ib',html:icon('menuBars',17),onclick:()=>side.classList.toggle('open')}):'',
    backBtn,fwdBtn,
    h('button',{cls:'ib',title:'上一级',html:icon('up',17),onclick:()=>{if(cwd!=='/')nav(parentOf(cwd));}}),
    h('button',{cls:'ib',title:'刷新',html:icon('refresh',16),onclick:()=>load()}),
    crumb,
    h('button',{cls:'ib',title:'新建文件夹',html:icon('newFolder',17),onclick:async()=>{
      const nm=await ui.prompt('新建文件夹','新建文件夹');
      if(nm){await fs.mkdir(joinPath(cwd,await fs.uniqueName(cwd,nm)));refreshAll();}
    }},),
    h('button',{cls:'ib',title:'新建文件',html:icon('newFile',17),onclick:async()=>{
      const nm=await ui.prompt('新建文件','未命名.txt');
      if(nm){await fs.writeFile(joinPath(cwd,await fs.uniqueName(cwd,nm)),'');refreshAll();}
    }}),
    h('button',{cls:'ib',title:'上传文件',html:icon('upload',17),onclick:()=>importFilesTo(cwd)}),
    searchInp
  );

  /* --- 列头 --- */
  const colsEl=h('div',{cls:'fx-cols'});
  function renderCols(){
    colsEl.innerHTML='';
    const cols=[['name','名称'],['mtime','修改日期'],['type','类型'],['size','大小']];
    for(const[key,label]of cols){
      colsEl.append(h('div',{cls:'fc'+(sortKey===key?' on':''),onclick:()=>{
        if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=true;}
        renderCols();renderList();
      }},label,sortKey===key?h('span',{html:icon(sortAsc?'up':'download',11)}):''));
    }
  }

  /* --- 列表 --- */
  const listEl=h('div',{cls:'fx-list'});
  const statusEl=h('div',{cls:'fx-status'});
  listEl._fxDropDir=()=>cwd;

  async function load(){
    if(!searchMode){
      let ents=[];
      try{ents=await fs.readdir(cwd);}catch(e){ui.toast('无法读取目录: '+e.message,'err');ents=[];}
      listing=await Promise.all(ents.map(async en=>{
        let size=null,mtime=null;
        try{const st=await fs.stat(joinPath(cwd,en.name));size=st.size;mtime=st.mtime;}catch(e){}
        return{...en,size,mtime,type:typeLabel(en.name,en.kind),path:joinPath(cwd,en.name)};
      }));
    }else{
      listing=await Promise.all(searchMode.results.map(async r=>{
        let size=null,mtime=null;
        try{const st=await fs.stat(r.path);size=st.size;mtime=st.mtime;}catch(e){}
        return{...r,size,mtime,type:typeLabel(r.name,r.kind)};
      }));
    }
    selected.clear();
    renderSide();renderCrumb();renderCols();renderList();
  }
  function renderCrumb(){
    crumb.innerHTML='';
    crumb.append(h('span',{cls:'cr',onclick:()=>nav('/')},'根目录'));
    const parts=pathParts(cwd);
    let acc='';
    for(const p of parts){
      acc+='/'+p;
      const target=acc;
      crumb.append(h('span',{cls:'csep'},'›'));
      const c=h('span',{cls:'cr',onclick:()=>nav(target)},p);
      bindDirDrop(c,target);
      crumb.append(c);
    }
    if(searchMode){crumb.append(h('span',{cls:'csep'},'›'),h('span',{cls:'cr',style:'color:var(--gold)'},`搜索“${searchMode.query}”`));}
  }
  function sortList(){
    const dir=sortAsc?1:-1;
    listing.sort((a,b)=>{
      if(a.kind!==b.kind)return a.kind==='directory'?-1:1;
      let r=0;
      if(sortKey==='name')r=a.name.localeCompare(b.name,'zh');
      else if(sortKey==='size')r=(a.size||0)-(b.size||0);
      else if(sortKey==='mtime')r=(a.mtime||0)-(b.mtime||0);
      else if(sortKey==='type')r=a.type.localeCompare(b.type,'zh');
      return r*dir;
    });
  }
  /* 原地更新选中样式，避免重建行 DOM 破坏双击/拖拽手势 */
  function paintSel(){
    listEl.querySelectorAll('.frow').forEach(r=>r.classList.toggle('selected',selected.has(r.dataset.path)));
    renderStatus();
  }
  function renderStatus(){
    statusEl.innerHTML='';
    statusEl.append(h('span',{},`${listing.length} 个项目`),h('span',{},selected.size?`已选 ${selected.size} 项`:''),h('span',{style:'margin-left:auto'},fs.backendName+(cwd.startsWith('/mnt/local')?' · 本地挂载':'')));
  }
  function renderList(){
    sortList();
    listEl.innerHTML='';
    if(!listing.length){
      listEl.append(h('div',{cls:'fx-empty'},h('span',{html:icon('folderOpen',40)}),searchMode?'没有匹配结果':'此文件夹为空 — 拖入文件即可导入'));
    }
    for(const en of listing)listEl.append(makeRow(en));
    renderStatus();
  }
  function makeRow(en){
    const path=en.path;
    const row=h('div',{cls:'frow'+(selected.has(path)?' selected':'')+(clipboard.mode==='cut'&&clipboard.paths.includes(path)?' cutting':''),draggable:'true','data-path':path},
      h('div',{cls:'fname'},h('span',{html:icon(fileIconName(en.name,en.kind),19)}),h('span',{style:'overflow:hidden;text-overflow:ellipsis'},searchMode?path:en.name)),
      h('div',{cls:'fmeta'},fmtDate(en.mtime)),
      h('div',{cls:'fmeta'},en.type),
      h('div',{cls:'fmeta'},en.kind==='directory'?'—':fmtSize(en.size)));
    row.addEventListener('mouseenter',()=>{if(en.kind==='file')preloadDrag(path);});
    row.addEventListener('pointerdown',e=>{
      if(en.kind==='file')preloadDrag(path);
      if(e.ctrlKey||e.metaKey){
        if(selected.has(path))selected.delete(path);else selected.add(path);
        paintSel();
      }else if(e.shiftKey&&selected.size){
        const idx=listing.findIndex(x=>x.path===path);
        const last=listing.findIndex(x=>selected.has(x.path));
        const[a,b]=[Math.min(idx,last),Math.max(idx,last)];
        for(let i=a;i<=b;i++)selected.add(listing[i].path);
        paintSel();
      }else if(!selected.has(path)){
        selected.clear();selected.add(path);paintSel();
      }
    });
    let lastTap=0;
    const openIt=()=>openPath(path,{explorer:nav});
    row.addEventListener('dblclick',openIt);
    row.addEventListener('touchend',e=>{
      const now=Date.now();
      if(now-lastTap<350){e.preventDefault();openIt();}
      lastTap=now;
    });
    row.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(!selected.has(path)){selected.clear();selected.add(path);paintSel();}
      rowMenu(e.clientX,e.clientY,en);
    });
    row.addEventListener('dragstart',e=>{
      if(!selected.has(path)){selected.clear();selected.add(path);paintSel();}
      e.dataTransfer.setData('application/x-sumi',JSON.stringify({src:'explorer',paths:[...selected],grabbed:en.name}));
      e.dataTransfer.effectAllowed='copyMove';
      if(en.kind==='file')applyDragOut(e,path);
    });
    row.addEventListener('dragend',()=>scheduleDragCacheCleanup(path));
    if(en.kind==='directory'){
      row.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();row.style.background='rgba(230,195,132,.18)';});
      row.addEventListener('dragleave',()=>{row.style.background='';});
      row.addEventListener('drop',async e=>{
        e.preventDefault();e.stopPropagation();row.style.background='';
        const raw=e.dataTransfer.getData('application/x-sumi');
        if(raw){
          const data=JSON.parse(raw);
          for(const p of data.paths){
            if(p===path||path.startsWith(p+'/'))continue;
            const nm=await fs.uniqueName(path,baseName(p));
            try{await fs.rename(p,joinPath(path,nm));}catch(err){ui.toast('移动失败: '+err.message,'err');}
            bus.emit('fs-changed',parentOf(p));
          }
          bus.emit('fs-changed',path);
        }else await importDataTransfer(e.dataTransfer,path);
      });
    }
    return row;
  }
  function rowMenu(x,y,en){
    const path=en.path;
    const multi=selected.size>1;
    const cat=catOf(en.name);
    const items=[{label:'打开',icon:'open',action:()=>{for(const p of selected)openPath(p,{explorer:nav});}}];
    if(en.kind==='file'&&cat==='archive')items.push({label:'解压到当前文件夹',icon:'extract',action:()=>extractWithUI(path,cwd)});
    if(en.kind==='file'&&cat==='image')items.push({label:'设为壁纸',icon:'wallpaper',action:async()=>setWallpaperCustom(await fs.readFile(path,'blob'))});
    if(en.kind==='file'&&cat==='html'){
      items.push({label:'在浏览器中打开',icon:'appBrowser',action:async()=>Apps.browser.launch({url:await urlFor(path),label:en.name})});
      items.push({label:'编辑源代码',icon:'appCode',action:()=>Apps.code.launch({path})});
    }
    if(en.kind==='file'&&!['image','audio','video','pdf'].includes(cat))items.push({label:'以纯文本打开',icon:'fileText',action:()=>Apps.notepad.launch({path})});
    items.push(
      {sep:true},
      {label:'复制',icon:'copy',action:()=>{clipboard.mode='copy';clipboard.paths=[...selected];ui.toast(`已复制 ${selected.size} 项`);}},
      {label:'剪切',icon:'cut',action:()=>{clipboard.mode='cut';clipboard.paths=[...selected];renderList();ui.toast(`已剪切 ${selected.size} 项`);}},
      {label:'重命名',icon:'rename',action:async()=>{
        const nn=await ui.prompt('重命名',en.name);
        if(nn&&nn!==en.name){await fs.rename(path,joinPath(parentOf(path),nn));refreshAll();bus.emit('fs-changed',parentOf(path));}
      }},
      {label:'导出 / 下载',icon:'download',action:()=>{for(const p of selected)downloadPath(p);}},
      {sep:true},
      {label:multi?`删除 ${selected.size} 项`:'删除',icon:'trash',danger:true,action:async()=>{
        if(!await ui.confirm('删除确认',`确定删除 ${selected.size} 个项目吗？此操作不可恢复。`,true))return;
        for(const p of selected)await fs.rm(p);
        selected.clear();refreshAll();bus.emit('fs-changed',cwd);
      }},
    );
    showMenu(x,y,items);
  }
  /* 空白区域：右键 + 框选 + 拖入 */
  listEl.addEventListener('contextmenu',e=>{
    if(e.target.closest('.frow'))return;
    e.preventDefault();
    showMenu(e.clientX,e.clientY,[
      {label:'刷新',icon:'refresh',action:()=>load()},
      {label:'新建文件夹',icon:'newFolder',action:async()=>{
        const nm=await ui.prompt('新建文件夹','新建文件夹');
        if(nm){await fs.mkdir(joinPath(cwd,await fs.uniqueName(cwd,nm)));refreshAll();}
      }},
      {label:'新建文本文件',icon:'newFile',action:async()=>{
        const nm=await ui.prompt('新建文件','未命名.txt');
        if(nm){await fs.writeFile(joinPath(cwd,await fs.uniqueName(cwd,nm)),'');refreshAll();}
      }},
      {label:'上传文件',icon:'upload',action:()=>importFilesTo(cwd)},
      clipboard.paths.length?{label:`粘贴（${clipboard.paths.length} 项）`,icon:'paste',action:async()=>{await pasteInto(cwd);refreshAll();}}:null,
      {sep:true},
      {label:'挂载本地文件夹',icon:'mount',action:async()=>{const mp=await mountLocalFolder();if(mp)nav(mp);}},
    ]);
  });
  // 列表框选
  listEl.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.frow')||e.pointerType==='touch')return;
    const rect=listEl.getBoundingClientRect();
    const x0=e.clientX,y0=e.clientY;
    if(!(e.ctrlKey||e.metaKey)){selected.clear();renderList();}
    const mEl=h('div',{style:'position:fixed;border:1px solid var(--blue);background:rgba(126,156,216,.14);z-index:50000;pointer-events:none;border-radius:3px;display:none'});
    document.body.append(mEl);
    const move=ev=>{
      const l=Math.min(x0,ev.clientX),t=Math.max(rect.top,Math.min(y0,ev.clientY)),w2=Math.abs(ev.clientX-x0),h2=Math.abs(ev.clientY-y0);
      if(w2+h2>8)mEl.style.display='block';
      Object.assign(mEl.style,{left:l+'px',top:t+'px',width:w2+'px',height:h2+'px'});
      listEl.querySelectorAll('.frow').forEach(r=>{
        const rr=r.getBoundingClientRect();
        const hit=rr.left<l+w2&&rr.right>l&&rr.top<t+h2&&rr.bottom>t;
        r.classList.toggle('selected',hit);
        if(hit)selected.add(r.dataset.path);else if(!ev.ctrlKey)selected.delete(r.dataset.path);
      });
    };
    const up=()=>{mEl.remove();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);renderList();};
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  });
  // 拖入导入
  listEl.addEventListener('dragover',e=>{
    e.preventDefault();
    if(e.dataTransfer.types.includes('Files')&&!e.dataTransfer.types.includes('application/x-sumi'))listEl.classList.add('fx-drop');
  });
  listEl.addEventListener('dragleave',e=>{if(!listEl.contains(e.relatedTarget))listEl.classList.remove('fx-drop');});
  listEl.addEventListener('drop',async e=>{
    e.preventDefault();listEl.classList.remove('fx-drop');
    if(e.target.closest('.frow[data-path]')&&e.target.closest('.frow').style.background)return;
    const raw=e.dataTransfer.getData('application/x-sumi');
    if(raw){
      const data=JSON.parse(raw);
      if(data.src==='explorer'&&data.paths.every(p=>parentOf(p)===cwd))return; // 同目录内拖动忽略
      for(const p of data.paths){
        if(parentOf(p)===cwd||p===cwd||cwd.startsWith(p+'/'))continue;
        const nm=await fs.uniqueName(cwd,baseName(p));
        try{await fs.rename(p,joinPath(cwd,nm));}catch(err){ui.toast('移动失败: '+err.message,'err');}
        bus.emit('fs-changed',parentOf(p));
      }
      bus.emit('fs-changed',cwd);
    }else await importDataTransfer(e.dataTransfer,cwd);
  });

  main.append(bar,colsEl,listEl,statusEl);

  function nav(p){
    p=normPath(p);
    if(p!==cwd){history=history.slice(0,hIdx+1);history.push(p);hIdx++;}
    cwd=p;searchMode=null;searchInp.value='';
    if(isMobile())side.classList.remove('open');
    load();
  }
  function refreshAll(){load();}
  const off=bus.on('fs-changed',p=>{if(normPath(p)===cwd)load();});
  const off2=bus.on('mounts-changed',()=>renderSide());
  win.opts.onClose=()=>{off();off2();};
  win.setTitle('文件');
  load();
  return win;
}

/* ----- 智能打开分派：先 stat 判断目录/文件，再按类型路由 ----- */
async function openPath(path,ctx={}){
  path=normPath(path);
  let st;
  try{st=await fs.stat(path);}catch(e){ui.toast('无法访问: '+baseName(path),'err');return;}
  if(st.kind==='directory'){
    if(ctx.explorer)ctx.explorer(path);
    else Apps.files.launch({path});
    return;
  }
  const name=baseName(path),cat=catOf(name);
  switch(cat){
    case'image':return Apps.viewer.launch({path});
    case'audio':case'video':return Apps.player.launch({path});
    case'pdf':return Apps.pdf.launch({path});
    case'table':return Apps.table.launch({path});
    case'html':{
      const r=await ui.dialog({title:name,iconName:'fileHtml',message:'HTML 文件 — 选择打开方式：',
        buttons:[{label:'取消'},{label:'编辑源代码'},{label:'在浏览器中打开',primary:true}]});
      if(r.index===2)Apps.browser.launch({url:await urlFor(path),label:name});
      else if(r.index===1)Apps.code.launch({path});
      return;
    }
    case'code':return Apps.code.launch({path});
    case'text':return Apps.notepad.launch({path});
    case'archive':{
      const dest=parentOf(path);
      const r=await ui.dialog({title:name,iconName:'fileZip',message:'压缩包 — 选择操作：',
        buttons:[{label:'取消'},{label:'下载'},{label:'解压到当前目录',primary:true}]});
      if(r.index===2)extractWithUI(path,dest);
      else if(r.index===1)downloadPath(path);
      return;
    }
    case'disk':{
      const r=await ui.dialog({title:name,iconName:'fileDisk',message:'磁盘镜像 — 在 v86 虚拟机中启动？',
        buttons:[{label:'取消'},{label:'以文本查看'},{label:'启动虚拟机',primary:true}]});
      if(r.index===2)Apps.vm.launch({path});
      else if(r.index===1)Apps.notepad.launch({path});
      return;
    }
    default:{
      const r=await ui.dialog({title:name,iconName:'file',message:'未知格式 — 系统保证你总能访问原始内容：',
        buttons:[{label:'取消'},{label:'下载'},{label:'以纯文本打开',primary:true}]});
      if(r.index===2)Apps.notepad.launch({path});
      else if(r.index===1)downloadPath(path);
    }
  }
}

/* ═══ 4.2.1 表格（CSV/TSV 双视图）═══ */
Apps.table={name:'表格',icon:'appTable',launch(args={}){
  let path=args.path||null;
  let mode='table';
  const win=WM.create({title:path?baseName(path):'表格',icon:'appTable',width:760,height:520});
  const body=h('div',{style:'flex:1;display:flex;flex-direction:column;min-height:0'});
  const ta=h('textarea',{cls:'ed-area',spellcheck:'false'});
  function parseCSV(text,sep){
    const rows=[];let row=[],cur='',q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){
        if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
        else cur+=c;
      }else{
        if(c==='"')q=true;
        else if(c===sep){row.push(cur);cur='';}
        else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
        else if(c!=='\r')cur+=c;
      }
    }
    if(cur!==''||row.length){row.push(cur);rows.push(row);}
    return rows;
  }
  function renderTable(){
    body.innerHTML='';
    const sep=path&&extOf(path)==='tsv'?'\t':',';
    const rows=parseCSV(ta.value,sep);
    if(!rows.length){body.append(h('div',{cls:'fx-empty'},'空表格'));return;}
    const wrap=h('div',{cls:'tbl-wrap'});
    const tbl=h('table',{cls:'tbl'});
    const thead=h('tr',{},h('th',{},'#'));
    for(const c of rows[0])thead.append(h('th',{},c));
    tbl.append(thead);
    for(let i=1;i<rows.length;i++){
      const tr=h('tr',{},h('td',{},String(i)));
      for(let j=0;j<rows[0].length;j++)tr.append(h('td',{},rows[i][j]??''));
      tbl.append(tr);
    }
    wrap.append(tbl);
    body.append(wrap);
  }
  function show(){
    if(mode==='table')renderTable();
    else{body.innerHTML='';body.append(ta);}
  }
  const toggle=h('button',{cls:'tb-btn',onclick:()=>{mode=mode==='table'?'text':'table';toggle.innerHTML='';toggle.append(iconEl(mode==='table'?'fileText':'appTable',14),mode==='table'?' 文本视图':' 表格视图');show();}},iconEl('fileText',14),' 文本视图');
  const tools=h('div',{cls:'app-tools'},
    toggle,
    h('button',{cls:'tb-btn pri',onclick:async()=>{
      if(!path){const nm=await ui.prompt('保存到','/Documents/数据.csv');if(!nm)return;path=normPath(nm);}
      await fs.writeFile(path,ta.value);
      ui.toast('已保存');win.setTitle(baseName(path));
      bus.emit('fs-changed',parentOf(path));
    }},h('span',{html:icon('save',14)}),'保存'),
    h('span',{style:'margin-left:auto;font-size:11px;color:var(--mut);font-family:var(--font-mono)'},path?extOf(path).toUpperCase():''));
  win.body.append(tools,body);
  (async()=>{
    if(path){try{ta.value=await fs.readFile(path,'text');}catch(e){}}
    show();
  })();
  return win;
}};

/* ═══ 4.5 计算器 ═══ */
Apps.calc={name:'计算器',icon:'appCalc',launch(){
  const win=WM.create({title:'计算器',icon:'appCalc',width:320,height:460});
  let expr='',last='';
  const exprEl=h('div',{cls:'ce'},'');
  const valEl=h('div',{cls:'cv'},'0');
  function evalExpr(s){
    if(!/^[\d+\-*/().%\s]*$/.test(s))throw new Error('非法');
    if(!s.trim())return 0;
    const v=Function('"use strict";return('+s.replace(/%/g,'/100')+')')();
    if(typeof v!=='number'||!isFinite(v))throw new Error('错误');
    return Math.round(v*1e10)/1e10;
  }
  function press(k){
    if(k==='C'){expr='';valEl.textContent='0';exprEl.textContent='';}
    else if(k==='⌫'){expr=expr.slice(0,-1);valEl.textContent=expr||'0';}
    else if(k==='='){
      try{const v=evalExpr(expr);exprEl.textContent=expr+' =';valEl.textContent=String(v);expr=String(v);}
      catch(e){valEl.textContent='错误';expr='';}
    }else{
      expr+=k;valEl.textContent=expr;
      try{exprEl.textContent='= '+evalExpr(expr);}catch(e){}
    }
  }
  const keys=[['C','(',')','⌫'],['7','8','9','/'],['4','5','6','*'],['1','2','3','-'],['0','.','%','+'],['=']];
  const grid=h('div',{cls:'calc-grid'});
  for(const row of keys)for(const k of row){
    const cls='ck'+(k==='='?' eq':'+-*/%'.includes(k)?' op':'C⌫()'.includes(k)?' fn':'');
    const b=h('button',{cls,onclick:()=>press(k)},k==='*'?'×':k==='/'?'÷':k==='-'?'−':k);
    if(k==='=')b.style.gridColumn='span 4';
    grid.append(b);
  }
  win.body.append(h('div',{cls:'calc'},h('div',{cls:'calc-disp'},exprEl,valEl),grid));
  win.el.addEventListener('keydown',e=>{
    if(/[\d+\-*/().%]/.test(e.key))press(e.key);
    else if(e.key==='Enter')press('=');
    else if(e.key==='Backspace')press('⌫');
    else if(e.key==='Escape')press('C');
  });
  win.el.tabIndex=-1;win.el.focus();
  return win;
}};

Apps.paint={name:'画板',icon:'appPaint',launch(){
  const win=WM.create({title:'画板',icon:'appPaint',width:760,height:540});
  const cv=h('canvas',{width:1024,height:680});
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fffef8';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap='round';ctx.lineJoin='round';
  let color='#16161D',size=4,erasing=false,drawing=false,lx=0,ly=0;
  const colors=['#16161D','#E46876','#FFA066','#E6C384','#98BB6C','#7AA89F','#7E9CD8','#957FB8','#ffffff'];
  const swRow=h('div',{style:'display:flex;gap:6px;align-items:center'});
  colors.forEach(c=>{
    const s=h('div',{cls:'swatch'+(c===color?' on':''),style:'background:'+c+(c==='#ffffff'?';border:1px solid #555':''),onclick:()=>{
      color=c;erasing=false;
      swRow.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
      s.classList.add('on');eraseBtn.classList.remove('pri');
    }});
    swRow.append(s);
  });
  const sizeInp=h('input',{type:'range',min:'1',max:'40',value:'4',style:'width:90px;accent-color:var(--gold)',oninput:e=>size=+e.target.value});
  const eraseBtn=h('button',{cls:'tb-btn',onclick:()=>{erasing=!erasing;eraseBtn.classList.toggle('pri',erasing);}},'橡皮');
  const tools=h('div',{cls:'app-tools'},swRow,
    h('span',{style:'font-size:11px;color:var(--mut)'},'粗细'),sizeInp,eraseBtn,
    h('button',{cls:'tb-btn',onclick:()=>{ctx.fillStyle='#fffef8';ctx.fillRect(0,0,cv.width,cv.height);}},'清空'),
    h('button',{cls:'tb-btn pri',style:'margin-left:auto',onclick:()=>{
      cv.toBlob(async blob=>{
        await fs.mkdir('/Pictures');
        const nm=await fs.uniqueName('/Pictures','画板-'+new Date().toISOString().slice(0,10)+'.png');
        await fs.writeFile('/Pictures/'+nm,blob);
        ui.toast('已保存到 /Pictures/'+nm);
        bus.emit('fs-changed','/Pictures');
      },'image/png');
    }},h('span',{html:icon('save',14)}),'保存 PNG'));
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};
  };
  cv.addEventListener('pointerdown',e=>{drawing=true;const p=pos(e);lx=p.x;ly=p.y;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const p=pos(e);
    ctx.strokeStyle=erasing?'#fffef8':color;
    ctx.lineWidth=erasing?size*3:size;
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();
    lx=p.x;ly=p.y;
  });
  cv.addEventListener('pointerup',()=>drawing=false);
  win.body.append(h('div',{cls:'paint'},tools,h('div',{cls:'paint-cv'},cv)));
  return win;
}};

Apps.settings={name:'设置',icon:'appSettings',launch(args={}){

      const legEl=h('div',{cls:'slegend'});
      body.append(barEl,legEl);
      let est={usage:0,quota:0};
      try{est=await navigator.storage.estimate();}catch(e){}
      const dirs=['Desktop','Documents','Pictures','Music','Downloads','System'];
      const colors=['#7E9CD8','#E6C384','#7AA89F','#957FB8','#98BB6C','#E46876','#FFA066'];
      const sizes=[];let totalFS=0;
      for(const d of dirs){
        const s=await fs.dirSize('/'+d);
        sizes.push([d,s]);totalFS+=s;
      }
      let other=0;
      try{
        for(const k of await fs.readdir('/')){
          if(dirs.includes(k.name)||k.name==='mnt')continue;
          other+=await fs.dirSize('/'+k.name);
        }
      }catch(e){}
      if(other>0){sizes.push(['其他',other]);totalFS+=other;}
      const usage=Math.max(est.usage||0,totalFS),quota=est.quota||0;
      info.innerHTML=`存储引擎：<b style="color:var(--gold)">${fs.backendName}</b><br>已用 <b style="color:var(--gold)">${fmtSize(usage)}</b>${quota?` / 配额 ${fmtSize(quota)}（占有率 ${(usage/quota*100).toFixed(2)}%）`:''}<br>虚拟文件系统内容合计 ${fmtSize(totalFS)}`;
      barEl.innerHTML='';legEl.innerHTML='';

      sizes.forEach(([d,s],i)=>{

      });
      if(totalFS===0)barEl.append(h('i',{style:'width:2%;background:var(--ink3)'}));
      if(quota){
        body.append(h('h4',{},'配额占有率'));
        const qb=h('div',{cls:'sbar'},h('i',{style:`width:${Math.max(.5,usage/quota*100)}%;background:linear-gradient(90deg,var(--teal),var(--gold))`}));
        body.append(qb);
      }
    }
    if(tab==='system'){
      body.append(h('h2',{},'系统'));
      body.append(h('h4',{},'本地挂载'));
      if(fs.mountList.length){
        for(const m of fs.mountList)
          body.append(h('div',{style:'display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px'},
            h('span',{html:icon('drive',16)}),h('span',{style:'flex:1'},m.prefix),
            h('button',{cls:'tb-btn',onclick:e=>{unmountLocal(m.prefix);renderBody();}},'卸载')));
      }else body.append(h('p',{style:'font-size:12.5px;color:var(--mut)'},'尚未挂载本地文件夹。'));
      body.append(h('button',{cls:'tb-btn',style:'margin-top:8px',onclick:async()=>{await mountLocalFolder();renderBody();}},h('span',{html:icon('mount',14)}),'挂载本地文件夹'));
      body.append(h('h4',{},'显示'));
      body.append(h('button',{cls:'tb-btn',onclick:toggleFullscreen},h('span',{html:icon('fullscreen',14)}),'切换全屏模式'));
      body.append(h('h4',{},'危险区域'));
      body.append(h('p',{style:'font-size:12.5px;color:var(--mut);margin-bottom:10px;line-height:1.7'},'一键重置将清空 OPFS / IndexedDB 中的全部虚拟文件、壁纸与图标布局，并恢复出厂状态。'));
      body.append(h('button',{cls:'btn red',onclick:async()=>{
        if(!await ui.confirm('一键重置','确定要清除整个虚拟文件系统吗？所有文件将永久丢失！',true))return;
        try{
          try{
            const root=await navigator.storage.getDirectory();
            for await(const[name]of root.entries())await root.removeEntry(name,{recursive:true}).catch(()=>{});
          }catch(e){}
          await new Promise(res=>{const r=indexedDB.deleteDatabase('sumi-vfs');r.onsuccess=r.onerror=r.onblocked=res;});
          localStorage.clear();
          document.cookie='sumi_boot=;max-age=0;path=/';
          ui.toast('已重置，正在重启…');
          setTimeout(()=>location.reload(),900);
        }catch(e){ui.toast('重置失败: '+e.message,'err');}
      }},'清除文件系统并重置'));
    }
    if(tab==='about'){
      body.append(h('h2',{},'关于墨枢'));
      body.append(h('div',{style:'display:flex;align-items:center;gap:16px;margin-bottom:18px'},
        h('span',{html:`<svg width="56" height="56" viewBox="0 0 96 96" fill="none" stroke="#E6C384" stroke-width="5" stroke-linecap="round"><path d="M48 10 a38 38 0 1 1 -26.8 11.2"/><path d="M22 52 q12 -14 26 -4 t26 -4" stroke="#7E9CD8"/></svg>`}),
        h('div',{},h('div',{style:'font-size:18px;font-weight:700'},'墨枢 SUMI-OS'),h('div',{style:'font-family:var(--font-mono);font-size:11px;color:var(--mut)'},'v1.0 · 单文件 Web 桌面操作系统'))));
      body.append(h('p',{style:'font-size:13px;color:var(--fg2);line-height:1.9'},
        '完全运行于浏览器的桌面环境。持久化基于 OPFS（Origin Private File System），并以 IndexedDB、localStorage、Cookie 构成多级降级存储架构。支持本地文件夹挂载（File System Access API）、双向拖拽、zip/tar/gz/7z 解压、CodeMirror 编辑、v86 虚拟机等能力。'));
      body.append(h('h4',{},'运行环境'));

/* ═══ v86 虚拟机 ═══ */
Apps.vm={name:'虚拟机',icon:'appVM',launch(args={}){
  const win=WM.create({title:'v86 虚拟机',icon:'appVM',width:780,height:560});
  const root=h('div',{cls:'vm'});
  let emulator=null;
  const memSel=h('select',{style:'background:var(--ink2);border:1px solid var(--ink3);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--fg)'},
    h('option',{value:'16'},'16 MB (DOS)'),h('option',{value:'64'},'64 MB'),h('option',{value:'128'},'128 MB (Linux)'));
  memSel.value='64';
  let diskPath=args.path||null;
  const diskLbl=h('span',{style:'font-family:var(--font-mono);font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;max-width:200px'},diskPath||'未选择镜像');
  const screen=h('div',{cls:'vm-screen'});
  const scContainer=h('div',{id:'vm_sc_'+uid()});
  // V86 强制结构：white-space:pre 的 monospace div + canvas，顺序固定
  const textDiv=h('div',{style:'white-space:pre;font:14px monospace;line-height:14px'});
  const canvas=h('canvas',{});
  scContainer.append(textDiv,canvas);
  screen.append(scContainer);
  async function pickDisk(){
    // 简易文件选择对话框：列出常见目录中的镜像
    const cands=[];
    const scan=async(p,depth)=>{
      if(depth>3||cands.length>60)return;
      let kids=[];try{kids=await fs.readdir(p);}catch(e){return;}
      for(const k of kids){
        const kp=joinPath(p,k.name);
        if(k.kind==='directory'){if(!kp.startsWith('/mnt'))await scan(kp,depth+1);}
        else if(['iso','img','fda','bin'].includes(extOf(k.name)))cands.push(kp);
      }
    };
    await scan('/',0);
    if(!cands.length){
      const r=await ui.dialog({title:'未找到镜像',iconName:'fileDisk',message:'虚拟文件系统中没有 .iso / .img 镜像。\n可上传一个（如 FreeDOS、Linux 软盘镜像）。',
        buttons:[{label:'取消'},{label:'上传镜像',primary:true}]});
      if(r.index===1)pickFiles(async files=>{
        await fs.mkdir('/Downloads');
        const nm=await fs.uniqueName('/Downloads',files[0].name);
        await fs.writeFile('/Downloads/'+nm,files[0]);
        diskPath='/Downloads/'+nm;diskLbl.textContent=diskPath;
        ui.toast('镜像已导入');
      },{accept:'.iso,.img,.fda,.bin'});
      return;
    }
    showMenu(window.innerWidth/2-100,window.innerHeight/3,cands.slice(0,20).map(p=>({label:p,icon:'fileDisk',action:()=>{diskPath=p;diskLbl.textContent=p;}})));
  }
  async function boot(){
    if(!window.V86){ui.alert('v86 未加载','libv86.js 加载失败，请检查网络后刷新。');return;}
    if(!diskPath){ui.toast('请先选择磁盘镜像','warn');return;}
    if(emulator){try{emulator.destroy();}catch(e){}emulator=null;}
    ui.toast('正在启动虚拟机…');
    const buf=await fs.readFile(diskPath);
    const e=extOf(diskPath);
    const opts={
      wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
      memory_size:(+memSel.value)*1024*1024,
      vga_memory_size:8*1024*1024,
      screen_container:scContainer,
      bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
      vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
      autostart:true,
    };
    if(e==='iso')opts.cdrom={buffer:buf};
    else if(e==='img'||e==='fda'||e==='bin')opts.fda={buffer:buf};
    else opts.hda={buffer:buf};
    try{emulator=new V86(opts);}catch(err){
      try{emulator=new V86Starter(opts);}catch(err2){ui.alert('启动失败',String(err2));}
    }
  }
  root.append(
    h('div',{cls:'app-tools',style:'background:var(--ink1)'},
      h('button',{cls:'tb-btn',onclick:pickDisk},h('span',{html:icon('fileDisk',14)}),'选择镜像'),
      diskLbl,memSel,
      h('button',{cls:'tb-btn pri',onclick:boot},h('span',{html:icon('play',13)}),'启动'),
      h('button',{cls:'tb-btn',onclick:()=>{if(emulator){try{emulator.stop();}catch(e){}ui.toast('已暂停');}}},'暂停'),
      h('button',{cls:'tb-btn',onclick:()=>{if(emulator){try{emulator.run();}catch(e){}}}},'继续')),
    screen);
  win.body.append(root);
  win.opts.onClose=()=>{if(emulator){try{emulator.destroy();}catch(e){}}};
  if(args.path)setTimeout(boot,300);
  return win;
}};

async function firstRunSetup(){
  const flag=await fs.exists('/System/.initialized');
  if(flag)return;
  for(const d of['/Desktop','/Documents','/Pictures','/Music','/Downloads','/System','/mnt/local'])await fs.mkdir(d);
  await fs.writeFile('/Documents/欢迎使用.md',SAMPLE_MD);
  await fs.writeFile('/Documents/创作统计.csv',SAMPLE_CSV);
  await fs.writeFile('/Desktop/示例页面.html',SAMPLE_HTML);
  await fs.writeFile('/Desktop/使用指南.txt','墨枢 SUMI-OS 快速指南\n======================\n\n· 单击桌面图标打开；按住空白处拖动进行框选\n· 把电脑上的文件直接拖到桌面即可导入 OPFS\n· 把虚拟文件拖出浏览器即可下载到物理桌面（桌面端 Chrome/Edge）\n· 文件管理器左侧可挂载真实本地文件夹\n· 设置 → 存储 可查看空间占有率\n· 设置 → 系统 可一键重置\n');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#1F1F28"/><circle cx="620" cy="120" r="70" fill="#E6C384"/><path d="M0 330 Q150 260 300 330 T600 330 T900 330 V500 H0 Z" fill="#2A2A37"/><path d="M0 335 Q150 265 300 335 T600 335" fill="none" stroke="#7E9CD8" stroke-width="4"/><path d="M0 390 Q150 330 300 390 T600 390 T900 390" fill="none" stroke="#7AA89F" stroke-width="3"/><text x="60" y="120" font-family="serif" font-size="84" fill="#DCD7BA" opacity=".3">墨</text></svg>`;

}

async function boot(){
  await fs.init();
  document.cookie='sumi_boot='+Date.now()+';max-age=31536000;path=/'; // Cookie 参与记录启动状态
  try{await firstRunSetup();}catch(e){console.warn('初始化示例失败',e);}
  await applyWallpaper();
  Desktop.bindDesktop();
  await Desktop.refresh();
  // 全局兜底：阻止浏览器直接打开拖入的文件
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>e.preventDefault());
  // 快捷键
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeMenu();toggleStartMenu(false);}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'&&!e.shiftKey){e.preventDefault();Apps.files.launch();}
  });
  // 存储降级提示
  if(fs.backendName!=='OPFS')ui.toast(`OPFS 不可用，已降级为 ${fs.backendName} 存储`,'warn',5000);
  // 挂载提醒（FSA 权限刷新后失效）
  const prevMounts=JSON.parse(localStorage.getItem('sumi.mounts')||'[]');
  if(prevMounts.length&&window.showDirectoryPicker){
    setTimeout(async()=>{
      const r=await ui.dialog({title:'重新挂载本地文件夹',iconName:'mount',
        message:`上次会话挂载过：${prevMounts.join('、')}\n浏览器安全策略要求刷新后重新授权。现在重新挂载吗？`,
        buttons:[{label:'以后再说'},{label:'重新挂载',primary:true}]});
      if(r.index===1)await mountLocalFolder();
      else localStorage.setItem('sumi.mounts','[]');
    },2600);
  }
  // 收起启动画面
  setTimeout(()=>{
    $('#boot').classList.add('off');
    setTimeout(()=>$('#boot').remove(),900);
  },2400);
}
boot().catch(err=>{
  console.error(err);
  $('#boot').classList.add('off');
  alert('系统启动遇到问题: '+err.message);
});
