const imageExts=['jpg','jpeg','png','webp','gif','svg','bmp','ico','avif','jfif','pjpeg'];
const audioExts=['mp3','wav','ogg','oga','flac','aac','m4a','opus','weba'];

function fmtSize(n){if(n===0)return'0 B';if(!Number.isFinite(n))return'—';const u=['B','KB','MB','GB','TB'];const i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));return`${(n/1024**i).toFixed(i?i>2?0:1:0)} ${u[i]}`}
function fmtDate(t,withTime=true){if(!t)return'—';const d=new Date(t);const date=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;if(!withTime)return date;return date+' '+d.toLocaleTimeString('zh-CN',{hour12:settings.clock12,hour:'2-digit',minute:'2-digit'})}

function loadScript(src){return new Promise((res,rej)=>{if($(`script[data-src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.dataset.src=src;s.onload=res;s.onerror=()=>rej(new Error('资源加载失败：'+src));document.head.appendChild(s)})}

function toast(title,msg='',type='info',actions=[]){const el=document.createElement('div');el.className='toast '+(type==='error'?'error':'');el.innerHTML=`<div class="toast-title">${esc(title)}</div>${msg?`<div class="toast-msg">${esc(msg)}</div>`:''}${actions.length?'<div class="toast-actions"></div>':''}`;const box=$('.toast-actions',el);actions.forEach(a=>{const b=document.createElement('button');b.className='btn';b.textContent=a.label;b.onclick=()=>{a.run();el.remove()};box.appendChild(b)});$('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),250)},actions.length?12000:4500);return el}

function modal({title,message='',input=null,choices=null,ok='确定',cancel='取消',danger=false}){return new Promise(resolve=>{const layer=$('#modal-layer');layer.innerHTML='';const m=document.createElement('div');m.className='modal';m.innerHTML=`<h3>${esc(title)}</h3>${message?`<p>${esc(message)}</p>`:''}${input?`<input class="field modal-field" value="${esc(input.value||'')}" placeholder="${esc(input.placeholder||'')}" type="${input.type||'text'}">`:''}<div class="modal-list"></div><div class="modal-actions"><button class="btn" data-cancel>${esc(cancel)}</button>${choices?'':`<button class="btn ${danger?'danger':'primary'}" data-ok>${esc(ok)}</button>`}</div>`;layer.appendChild(m);layer.classList.remove('hidden');const inp=$('input',m);const done=v=>{layer.classList.add('hidden');layer.innerHTML='';resolve(v)};$('[data-cancel]',m).onclick=()=>done(null);$('[data-ok]',m)?.addEventListener('click',()=>done(inp?inp.value:true));(choices||[]).forEach(c=>{const b=document.createElement('button');b.className='modal-choice';b.innerHTML=`<strong>${esc(c.label)}</strong>${c.desc?`<p>${esc(c.desc)}</p>`:''}`;b.onclick=()=>done(c.value);$('.modal-list',m).appendChild(b)});m.onkeydown=e=>{if(e.key==='Escape')done(null);if(e.key==='Enter'&&inp)$('[data-ok]',m)?.click()};setTimeout(()=>{inp?(inp.focus(),inp.select()):$('[data-ok],[data-cancel],.modal-choice',m)?.focus()},30)})}
const confirmBox=(title,msg,danger=false)=>modal({title,message:msg,ok:'继续',danger});

/* ---------- 设置：localStorage / Cookie 负责轻量状态 ---------- */
const DEFAULTS={theme:'dark',accent:'#a9e6c5',radius:14,wallpaper:'fold',wallpaperPath:'',defaultBackend:'OPFS',clock12:true,iconSize:78,snapGrid:true,singleClick:true,animations:true,transparency:true,showSystemIcons:true,hiddenApps:[],pinned:['explorer','editor','browser','settings'],autosave:true,fontScale:100,dockPeek:true};

/* ---------- IndexedDB 基础设施与统一后端 ---------- */
let db=null,opfsRoot=null;
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txDone(t){return new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('事务中止'))})}
async function openDatabase(){return new Promise((res,rej)=>{const r=indexedDB.open('plica-vfs',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('nodes')){const s=d.createObjectStore('nodes',{keyPath:'path'});s.createIndex('parent','parent')}if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});if(!d.objectStoreNames.contains('mounts'))d.createObjectStore('mounts',{keyPath:'name'})};r.onsuccess=()=>res(db=r.result);r.onerror=()=>rej(r.error)})}
const meta={async get(key){if(!db)return null;return(await req(db.transaction('meta').objectStore('meta').get(key)))?.value||null},async set(key,value){if(!db){try{localStorage.setItem('plica.meta.'+key,JSON.stringify(value))}catch(e){}return}const t=db.transaction('meta','readwrite');t.objectStore('meta').put({key,value});await txDone(t)},async del(key){if(!db){localStorage.removeItem('plica.meta.'+key);return}const t=db.transaction('meta','readwrite');t.objectStore('meta').delete(key);await txDone(t)}};
class OPFSBackend{
 constructor(root,id){this.root=root;this.id=id;this.label='OPFS 主存';this.persistent=true}
 parts(p){return splitPath(p)}
 async dir(p,create=false){let h=this.root;for(const part of this.parts(p))h=await h.getDirectoryHandle(part,{create});return h}
 async parent(p,create=false){const a=this.parts(p),name=a.pop();return{dir:await this.dir('/'+a.join('/'),create),name}}
 async stat(p){const parts=this.parts(p),key=this.id+normalize(p);if(!parts.length){const m=await meta.get(key);return{path:'/',name:'/',kind:'directory',size:0,mtime:m?.modified||Date.now(),created:m?.created||Date.now(),type:'文件夹'}}const{dir,name}=await this.parent(p);let handle;try{handle=await dir.getFileHandle(name)}catch(e){handle=await dir.getDirectoryHandle(name)}const m=await meta.get(key);if(handle.kind==='file'){const f=await handle.getFile();return{path:normalize(p),name,kind:'file',size:f.size,mtime:m?.modified||f.lastModified,created:m?.created||f.lastModified,mime:f.type||mimeFor(name),type:extLabel(name)}}return{path:normalize(p),name,kind:'directory',size:0,mtime:m?.modified||Date.now(),created:m?.created||Date.now(),type:'文件夹'}}
 async readdir(p){const h=await this.dir(p),out=[];for await(const[name]of h.entries()){try{out.push(await this.stat(joinPath(p,name)))}catch(e){}}return out}
 async readFile(p,flag){const{dir,name}=await this.parent(p);const h=await dir.getFileHandle(name),f=await h.getFile();if(flag==='blob')return f;if(flag==='file'){const s=await this.stat(p);return new File([f],name,{type:f.type||mimeFor(name),lastModified:s.mtime})}if(flag==='text')return f.text();return f.arrayBuffer()}
 async writeFile(p,data,opt={}){const{dir,name}=await this.parent(p,true);let old=null;try{old=await this.stat(p)}catch(e){}const h=await dir.getFileHandle(name,{create:true}),w=await h.createWritable();await w.write(data);await w.close();const now=Date.now();await meta.set(this.id+normalize(p),{modified:opt.modified??now,created:opt.created??old?.created??now});return this.stat(p)}
 async mkdir(p,opt={}){const now=Date.now();await this.dir(p,true);const key=this.id+normalize(p);if(!(await meta.get(key)))await meta.set(key,{modified:opt.modified??now,created:opt.created??now});return this.stat(p)}
 async unlink(p){const{dir,name}=await this.parent(p);await dir.removeEntry(name,{recursive:true});await meta.del(this.id+normalize(p))}
 async touch(p,s){const old=await meta.get(this.id+normalize(p));await meta.set(this.id+normalize(p),{modified:s.mtime??old?.modified??Date.now(),created:s.created??old?.created??s.mtime??Date.now()})}
}
class IDBBackend{
 constructor(id='idb:'){this.id=id;this.label='IndexedDB 织库';this.persistent=true}
 key(p){return normalize(p)}
 async stat(p){p=this.key(p);if(p==='/'){const m=await meta.get(this.id+'/');return{path:'/',name:'/',kind:'directory',size:0,mtime:m?.modified||Date.now(),created:m?.created||Date.now(),type:'文件夹'}}const n=await req(db.transaction('nodes').objectStore('nodes').get(p));if(!n)throw new Error('路径不存在：'+p);return{path:n.path,name:n.name,kind:n.kind,size:n.kind==='file'?n.data.size:0,mtime:n.modified,created:n.created,mime:n.kind==='file'?(n.data.type||mimeFor(n.name)):undefined,type:n.kind==='file'?extLabel(n.name):'文件夹'}}
 async readdir(p){p=this.key(p);const nodes=await req(db.transaction('nodes').objectStore('nodes').index('parent').getAll(p));return Promise.all(nodes.sort((a,b)=>naturalCompare(a.name,b.name)).map(n=>this.stat(n.path)))}
 async readFile(p,flag){const n=await req(db.transaction('nodes').objectStore('nodes').get(this.key(p)));if(!n||n.kind!=='file')throw new Error('文件不存在');if(flag==='blob')return n.data;if(flag==='text')return n.data.text();if(flag==='file')return new File([n.data],n.name,{type:n.data.type||mimeFor(n.name),lastModified:n.modified});return n.data.arrayBuffer()}
 async writeFile(p,data,opt={}){p=this.key(p);const now=Date.now(),old=await req(db.transaction('nodes').objectStore('nodes').get(p));let blob=data instanceof Blob?data:new Blob([data],{type:mimeFor(p)});const node={path:p,parent:dirname(p),name:basename(p),kind:'file',data:blob,modified:opt.modified??now,created:opt.created??old?.created??now};const t=db.transaction('nodes','readwrite');t.objectStore('nodes').put(node);await txDone(t);return this.stat(p)}
 async mkdir(p,opt={}){p=this.key(p);const now=Date.now(),parts=splitPath(p);let cur='';const t=db.transaction('nodes','readwrite'),s=t.objectStore('nodes');for(const part of parts){cur+='/'+part;const old=await req(s.get(cur));if(old&&old.kind!=='directory')throw new Error('文件与目录重名');if(!old)s.put({path:cur,parent:dirname(cur),name:part,kind:'directory',data:null,modified:opt.modified??now,created:opt.created??now})}await txDone(t);return this.stat(p)}

}
class FSABackend{
 constructor(handle,name){this.root=handle;this.id='fsa:'+name+':';this.label='本地挂载 · '+name;this.mountName=name;this.persistent=false}

v class="setting-row"><div class="setting-copy"><strong>桌面图标尺寸</strong><small>自由布局会随尺寸重新约束在屏幕内</small></div><input type="range" min="58" max="120" data-setting="iconSize" value="${settings.iconSize}"></div><div class="setting-row"><div class="setting-copy"><strong>界面字号</strong><small>按比例调整系统排版</small></div><input type="range" min="85" max="125" data-setting="fontScale" value="${settings.fontScale}"></div></div>`}

 async storage(){this.page.innerHTML=this.head('容量织图','正在逐项遍历真实文件。目录大小、分类占比和顶层目录均从当前数据计算。')+'<div class="empty-state"><div class="fold-loader"></div><p>正在核算存储，不会上传任何数据</p></div>';try{const estimate=await navigator.storage.estimate?.()||{},roots=['/OPFS','/IndexedDB'];const results=[];for(const r of roots){try{results.push([r,await fs.usage(r)])}catch(e){results.push([r,{total:0,files:0,folders:0,categories:{},top:[],error:e.message}])}}const total=results.reduce((a,[,u])=>a+u.total,0),cats={};results.forEach(([,u])=>Object.entries(u.categories).forEach(([k,v])=>cats[k]=(cats[k]||0)+v));let acc=0;const colors=['var(--accent)','var(--warm)','#688e83','#9b7564','#718199','#3b4943'];const segments=Object.entries(cats).filter(([,v])=>v>0).map(([k,v],i)=>{const start=acc;acc+=total?v/total*100:0;return`${colors[i%colors.length]} ${start}% ${acc}%`}).join(',');this.page.innerHTML=this.head('容量织图','统计数据来自当前文件树。浏览器配额是共享估计值，并非人为编造的固定容量。')+`<div class="storage-hero"><div class="storage-ring" style="background:conic-gradient(${segments||'var(--line) 0 100%'})"><div><strong>${fmtSize(total)}</strong><small>VFS 实际内容</small></div></div><div class="usage-bars">${Object.entries(cats).map(([k,v],i)=>`<div class="usage-row"><span>${k}</span><div class="usage-track"><i style="width:${total?v/total*100:0}%;background:${colors[i%colors.length]}"></i></div><span class="mono">${fmtSize(v)}</span></div>`).join('')}</div></div><div class="setting-group"><h4>浏览器存储估计</h4><div class="setting-row"><div class="setting-copy"><strong>源总用量 / 可用配额</strong><small>包括 OPFS、IndexedDB 及此源的其他数据</small></div><span class="mono">${fmtSize(estimate.usage||0)} / ${fmtSize(estimate.quota||0)}</span></div><div class="usage-track" style="height:8px"><i style="width:${estimate.quota?Math.min(100,estimate.usage/estimate.quota*100):0}%"></i></div></div>${results.map(([r,u])=>`<div class="backend-card"><header><strong>${r}</strong><span class="chip">${u.files} 文件 · ${u.folders} 目录</span></header><div class="usage-row"><span>实际大小</span><div class="usage-track"><i style="width:${total?u.total/total*100:0}%"></i></div><span>${fmtSize(u.total)}</span></div>${u.top.slice(0,6).map(t=>`<button class="side-item" data-open-path="${esc(t.path)}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(t.path)}</span><span class="mono">${fmtSize(t.size)}</span></button>`).join('')}</div>`).join('')}<button class="btn" data-action="refresh-storage">${I('refresh')}重新核算</button>`}catch(e){this.page.innerHTML=this.head('容量织图','统计过程中出现错误')+`<div class="empty-state"><p>${esc(e.message)}</p><button class="btn" data-action="refresh-storage">重试</button></div>`}}
 mounts(){const active=fs.routes.filter(r=>r.prefix.startsWith('/mnt/local/'));this.page.innerHTML=this.head('本地目录挂载','真实目录通过同一 fs API 路由到 /mnt/local/，权限始终由浏览器控制。卸载不会删除物理文件。')+`<button class="btn primary" data-action="mount">${I('mount')}挂载一个本地文件夹</button><div class="setting-group"><h4>当前挂载 · ${active.length}</h4>${active.length?active.map(r=>`<div class="mount-row">${I('mount')}<div class="grow"><strong>${esc(basename(r.prefix))}</strong><small>${esc(r.prefix)} · 可读写</small></div><button class="btn" data-open-path="${esc(r.prefix)}">打开</button><button class="btn danger" data-unmount="${esc(r.prefix)}">卸载</button></div>`).join(''):'<p>尚无活动挂载。可挂载多个文件夹，各自独立。</p>'}</div><div class="setting-group"><h4>刷新后等待重新授权 · ${fs.pendingMounts.length}</h4>${fs.pendingMounts.map(m=>`<div class="mount-row">${I('mount')}<div class="grow"><strong>${esc(m.name)}</strong><small>目录句柄已保存，点击后由浏览器重新确认权限</small></div><button class="btn primary" data-remount="${esc(m.name)}">重新授权</button></div>`).join('')||'<p>没有等待授权的目录。</p>'}</div><p>File System Access API 的句柄可保存，但多数浏览器会在新会话要求一次用户手势授权。褶界不会把“已保存句柄”伪报成“可写”。</p>`}
 apps(){this.page.innerHTML=this.head('应用可见性','隐藏只会影响启动器、桌面和固定 Dock，不会关闭已经运行的任务。')+`<div class="app-toggle-grid">${Object.values(apps).map(a=>`<div class="app-toggle">${I(a.icon)}<span style="flex:1">${a.name}</span><button class="switch ${!settings.hiddenApps.includes(a.id)?'on':''}" data-app-visible="${a.id}"></button></div>`).join('')}</div><div class="setting-group"><h4>Dock 固定应用</h4>${Object.values(apps).map(a=>`<div class="setting-row"><div class="setting-copy"><strong>${a.name}</strong><small>${a.description}</small></div><button class="switch ${settings.pinned.includes(a.id)?'on':''}" data-pin="${a.id}"></button></div>`).join('')}</div>`}
 system(){this.page.innerHTML=this.head('系统与重置','时间格式、全屏和危险操作集中在这里。重置虚拟文件系统绝不会触碰本地挂载目录。')+`<div class="setting-group"><h4>时间与日历</h4><div class="setting-row"><div class="setting-copy"><strong>12 小时制</strong><small>默认开启；关闭后使用 24 小时制</small></div>${this.toggle('clock12')}</div><div class="setting-row"><div class="setting-copy"><strong>浏览器全屏</strong><small>与漫画沉浸模式相互独立</small></div><button class="btn" data-action="fullscreen">切换全屏</button></div></div><div class="setting-group"><h4>恢复与危险操作</h4><div class="setting-row"><div class="setting-copy"><strong>恢复默认外观设置</strong><small>保留所有文件，仅恢复主题、交互和 Dock 设置</small></div><button class="btn" data-action="defaults">恢复默认</button></div><div class="setting-row"><div class="setting-copy"><strong>一键重置虚拟文件系统</strong><small>清空 OPFS 与 IndexedDB 中的全部文件，再写入初始示例。物理本地目录不会被删除</small></div><button class="btn danger" data-action="reset">清除并重置</button></div></div><div class="backend-card"><header><strong>褶界 PLICA</strong><span class="chip">SINGLE FILE WEB OS</span></header><p>单 HTML、零后端、统一 fs 路由。Cookie 记录会话时间，localStorage 记录轻量设置，IndexedDB 保存事务文件节点与元数据，OPFS 保存原生二进制文件。当前会话：${new Date(+(document.cookie.match(/plica_session=(\d+)/)||[])[1]||Date.now()).toLocaleString('zh-CN')}</p></div>`}
 control(e){const t=e.target;if(t.dataset.setting){let v=t.type==='range'?+t.value:t.value;settings[t.dataset.setting]=v;applySettings();if(t.dataset.setting==='accent'&&t.type==='color')this.personal();if(t.dataset.setting==='defaultBackend')Desktop.refresh()}}
 async action(e){const t=e.target.closest('button');if(!t)return;if(t.dataset.toggle){const k=t.dataset.toggle;settings[k]=!settings[k];t.classList.toggle('on',settings[k]);applySettings();Desktop.refresh()}if(t.dataset.theme){settings.theme=t.dataset.theme;applySettings();this.personal()}if(t.dataset.wall){if(t.dataset.wall==='custom'&&!settings.wallpaperPath)return $('#wallpaper-input').click();settings.wallpaper=t.dataset.wall;applySettings();this.personal()}if(t.dataset.openPath)openApp('explorer',{path:t.dataset.openPath});if(t.dataset.unmount){await fs.unmount(t.dataset.unmount);toast('挂载已卸载','物理文件未发生变化');this.mounts()}if(t.dataset.remount){const m=fs.pendingMounts.find(x=>x.name===t.dataset.remount);try{if(await m.handle.requestPermission({mode:'readwrite'})!=='granted')throw Error('权限未授予');fs.pendingMounts=fs.pendingMounts.filter(x=>x!==m);await fs.mountLocal(m.handle,false);toast('目录已恢复','/mnt/local/'+m.name);this.mounts()}catch(err){toast('重新授权失败',err.message,'error')}}if(t.dataset.appVisible){const id=t.dataset.appVisible;settings.hiddenApps=settings.hiddenApps.includes(id)?settings.hiddenApps.filter(x=>x!==id):[...settings.hiddenApps,id];t.classList.toggle('on',!settings.hiddenApps.includes(id));applySettings();Desktop.refresh()}if(t.dataset.pin){const id=t.dataset.pin;settings.pinned=settings.pinned.includes(id)?settings.pinned.filter(x=>x!==id):[...settings.pinned,id];t.classList.toggle('on',settings.pinned.includes(id));applySettings()}const a=t.dataset.action;if(a==='wallpaper')$('#wallpaper-input').click();if(a==='mount'){await mountLocalFolder();this.mounts()}if(a==='refresh-storage')this.storage();if(a==='persist'){const result=await navigator.storage.persist?.();toast(result?'持久保护已启用':'浏览器未授予持久保护',result?'存储更不容易被自动清理':'仍可使用全部存储功能，可由浏览器设置管理')}if(a==='fullscreen')toggleFullscreen();if(a==='defaults'){settings={...DEFAULTS};applySettings();await applyCustomWallpaper();Desktop.refresh();this.personal()}if(a==='reset'){if(!await confirmBox('确认重置虚拟文件系统','OPFS 与 IndexedDB 中全部用户文件都会被永久删除。本地挂载目录不受影响。',true))return;const phrase=await ask('最后确认','输入“重置”以继续','');if(phrase!=='重置')return;await resetVFS();toast('虚拟文件系统已重置','初始目录与示例文件已重新建立');this.storage()}}

async function applyCustomWallpaper(){const w=$('#wallpaper');if(settings.wallpaper==='custom'&&settings.wallpaperPath){try{const blob=await fs.readFile(settings.wallpaperPath,'blob');if(window.wallpaperURL)URL.revokeObjectURL(window.wallpaperURL);window.wallpaperURL=URL.createObjectURL(blob);w.style.backgroundImage=`url("${window.wallpaperURL}")`;w.classList.add('custom')}catch(e){settings.wallpaper='fold';w.style.backgroundImage='';applySettings()}}else{w.style.backgroundImage='';w.classList.remove('custom')}}
async function resetVFS(){if(opfsRoot)for await(const[name]of opfsRoot.entries())await opfsRoot.removeEntry(name,{recursive:true});if(db){const t=db.transaction(['nodes','meta'],'readwrite');t.objectStore('nodes').clear();t.objectStore('meta').clear();await txDone(t)}await seedDefaults(true);Desktop.positions={};Desktop.savePositions();await Desktop.refresh()}

async function restoreMounts(){if(!db)return;try{const records=await req(db.transaction('mounts').objectStore('mounts').getAll());for(const m of records){try{const p=await m.handle.queryPermission?.({mode:'readwrite'});if(p==='granted'){const backend=new FSABackend(m.handle,m.name);fs.routes.push({prefix:'/mnt/local/'+m.name,backend,kind:'fsa'});fs.mountRecords.push(m)}else fs.pendingMounts.push(m)}catch(e){fs.pendingMounts.push(m)}}if(fs.pendingMounts.length)setTimeout(()=>toast('本地文件夹等待重新授权',`${fs.pendingMounts.length} 个目录句柄已恢复，但浏览器需要你的手势确认权限。`, 'info',[{label:'前往挂载管理',run:()=>openApp('settings',{page:'mounts'})}]),800)}catch(e){console.warn('挂载恢复失败',e)}}
async function initStorage(){try{await openDatabase()}catch(e){console.error(e);toast('IndexedDB 不可用','将尝试使用 OPFS；轻量设置仍保留在 localStorage。','error')}try{if(navigator.storage?.getDirectory)opfsRoot=await navigator.storage.getDirectory();else throw Error('此浏览器不提供 OPFS')}catch(e){console.warn(e);toast('OPFS 不可用','IndexedDB 织库会作为降级文件后端。','error')}if(opfsRoot)fs.routes.push({prefix:'/OPFS',backend:new OPFSBackend(opfsRoot,'opfs:'),kind:'opfs'});if(db)fs.routes.push({prefix:'/IndexedDB',backend:new IDBBackend('idb:'),kind:'idb'});if(!fs.routes.length){$('#storage-chip').textContent='存储不可用';toast('没有可用持久后端','请使用支持 IndexedDB 或 OPFS 的现代浏览器。','error');return}if(!fs.routes.some(r=>r.prefix==='/'+settings.defaultBackend))settings.defaultBackend=fs.routes[0].prefix.slice(1);$('#storage-chip').textContent=fs.routes.length>1?'OPFS + IDB 已就绪':fs.routes[0].backend.label+' 已就绪';await seedDefaults();await restoreMounts();applySettings();await applyCustomWallpaper();await Desktop.init();fs.events.addEventListener('change',debounce(()=>Desktop.refresh(),180))}
let calendarDate=new Date();calendarDate.setDate(1);
function renderCalendar(){const pop=$('#calendar-pop'),y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());pop.innerHTML=`<div class="cal-head"><button class="icon-btn" data-cal="prev">${I('back')}</button><span class="cal-title">${y} 年 ${m+1} 月</span><button class="icon-btn" data-cal="next">${I('forward')}</button></div><div class="cal-grid">${['日','一','二','三','四','五','六'].map(d=>`<span class="week">${d}</span>`).join('')}${Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const today=new Date(),isToday=d.toDateString()===today.toDateString();return`<button class="cal-day ${d.getMonth()!==m?'out':''} ${isToday?'today':''}" data-day="${d.toISOString()}">${d.getDate()}</button>`}).join('')}</div><div class="statusbar" style="border:0;padding:12px 0 0">今天 · ${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div>`;$$('[data-cal]',pop).forEach(b=>b.onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+(b.dataset.cal==='next'?1:-1));renderCalendar()});$$('[data-day]',pop).forEach(b=>b.onclick=()=>{const d=new Date(b.dataset.day);toast('日期',d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}))})}
function bindSystemUI(){applySettings();renderPinned();setInterval(updateClock,1000);updateClock();$('#start-button').onclick=()=>toggleStart();$('#brand-start').onclick=()=>toggleStart();$('[data-close-start]').onclick=()=>toggleStart(false);$('#app-search').oninput=e=>renderLauncher(e.target.value);$('#app-search').onkeydown=async e=>{if(e.key==='Enter'&&e.target.value.trim()){const q=e.target.value.trim();toggleStart(false);const ex=await openApp('explorer',{path:'/'});ex?.search(q)}};$('[data-open="settings"]').onclick=()=>{toggleStart(false);openApp('settings')};$('#start-upload').onclick=()=>{toggleStart(false);chooseUpload(desktopDir())};$('#fullscreen-button').onclick=toggleFullscreen;$('#clock-button').onclick=e=>{e.stopPropagation();renderCalendar();$('#calendar-pop').classList.toggle('hidden')};$('#global-file-input').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;const t=toast('正在导入',`${files.length} 个本地项目 → ${uploadDestination}`);try{for(const f of files)await fs.importFile(f,uploadDestination);t.remove();toast('导入完成',`文件已持久化，原始修改日期已保留`);Desktop.refresh()}catch(err){t.remove();toast('导入失败',err.message,'error')}};$('#wallpaper-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const root=opfsRoot?'/OPFS':'/'+settings.defaultBackend,dir=root+'/系统/壁纸';await fs.mkdir(dir);const p=await fs.unique(joinPath(dir,f.name));await fs.writeFile(p,f,{modified:f.lastModified,created:f.lastModified});settings.wallpaperPath=p;settings.wallpaper='custom';applySettings();await applyCustomWallpaper();toast('壁纸已保存并应用',p);const s=[...windows.values()].find(w=>w.appId==='settings');s?.instance?.personal()}catch(err){toast('壁纸设置失败',err.message,'error')}};let peeked=false,peekMin=[];const peek=$('#peek-button');peek.onmouseenter=()=>{if(settings.dockPeek){windows.forEach(w=>w.el.classList.add('peek'));peeked=true}};peek.onmouseleave=()=>{windows.forEach(w=>w.el.classList.remove('peek'));peeked=false};peek.onclick=()=>{windows.forEach(w=>w.el.classList.remove('peek'));if(peekMin.length){peekMin.forEach(id=>focusWindow(id));peekMin=[]}else{peekMin=[...windows.values()].filter(w=>!w.el.classList.contains('minimized')).map(w=>w.id);peekMin.forEach(id=>minimizeWindow(id))}};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context-menu'))closeContext();if(!e.target.closest('#start-menu')&&!e.target.closest('#start-button')&&!e.target.closest('#brand-start'))toggleStart(false);if(!e.target.closest('#calendar-pop')&&!e.target.closest('#clock-button'))$('#calendar-pop').classList.add('hidden')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeContext();toggleStart(false);$('#calendar-pop').classList.add('hidden')}if(e.ctrlKey&&e.code==='Space'){e.preventDefault();toggleStart()}if(e.altKey&&e.key==='Tab'){e.preventDefault();const list=[...windows.values()];if(list.length){const i=list.findIndex(w=>w.id===activeWindow);focusWindow(list[(i+1)%list.length].id)}}});window.addEventListener('resize',debounce(()=>{Desktop.refresh();windows.forEach(w=>{if(innerWidth>720){const layer=$('#window-layer');setRect(w.el,{x:clamp(w.el.offsetLeft,0,Math.max(0,layer.clientWidth-80)),y:clamp(w.el.offsetTop,0,Math.max(0,layer.clientHeight-40)),w:Math.min(w.el.offsetWidth,layer.clientWidth),h:Math.min(w.el.offsetHeight,layer.clientHeight)})}})},150));document.addEventListener('dragover',e=>{if([...e.dataTransfer?.types||[]].includes('Files'))e.preventDefault()});document.addEventListener('drop',e=>{if(!e.target.closest('#desktop,.file-viewport'))e.preventDefault()});fs.events.addEventListener('change',()=>{const s=[...windows.values()].find(w=>w.appId==='settings');if(s?.instance?.current==='mounts')s.instance.mounts()})}
bindSystemUI();initStorage();
