<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>曜石 OS · Obsidian Web OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315120e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ff9e45' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff9e45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+QingKe+HuangYou&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- CodeMirror 5.65.16 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<style>
/* ============================================================
   曜石 OS 设计系统 —— 曜石灰烬 (Obsidian Ember)
   ============================================================ */
:root{
  --accent:#ff9e45; --accent-soft:rgba(255,158,69,.16); --accent-line:rgba(255,158,69,.38);
  --bg0:#0b0a08; --bg1:#131109; --panel:rgba(23,20,14,.82); --panel-solid:#181510;
  --panel-2:rgba(32,28,19,.78); --line:rgba(255,214,160,.13); --line-2:rgba(255,214,160,.07);
  --text:#f2e9da; --dim:#a99d88; --faint:#6f6553;
  --win-r:14px; --shadow:0 24px 80px -12px rgba(0,0,0,.75),0 0 0 1px var(--line);
  --glow:0 0 0 1px var(--accent-line),0 12px 60px -10px rgba(255,158,69,.28);
  --tb-h:58px; --glass:blur(22px) saturate(1.5);
  --sel:rgba(255,158,69,.22); --danger:#ff5c5c; --ok:#69db7c;
  --font-ui:"Noto Sans SC",system-ui,sans-serif; --font-brand:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
[data-theme="light"]{
  --accent:#e07f16; --accent-soft:rgba(224,127,22,.14); --accent-line:rgba(224,127,22,.4);
  --bg0:#ece5d5; --bg1:#f5efe1; --panel:rgba(252,249,241,.86); --panel-solid:#fbf7ec;
  --panel-2:rgba(244,238,224,.85); --line:rgba(120,90,30,.18); --line-2:rgba(120,90,30,.09);
  --text:#2c2415; --dim:#7a6c4f; --faint:#a39478;
  --shadow:0 24px 70px -18px rgba(90,60,10,.35),0 0 0 1px var(--line);
  --glow:0 0 0 1px var(--accent-line),0 12px 50px -12px rgba(224,127,22,.3);
  --sel:rgba(224,127,22,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0);color:var(--text);font-family:var(--font-ui);font-size:14px}
body{user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none;user-select:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 34%,transparent);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font-family:inherit;color:var(--text)}
input[type=text],input[type=search],input:not([type]),textarea,select{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;outline:none;user-select:text;-webkit-user-select:text}
input:focus,textarea:focus,select:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.lucide{width:18px;height:18px;stroke-width:1.8}

/* ---------- 壁纸与桌面 ---------- */
#wallpaper{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:opacity .5s,background-image .3s}
#wallpaper::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 85% -10%,transparent 40%,rgba(0,0,0,.18) 100%),
  radial-gradient(100% 80% at 0% 110%,transparent 50%,rgba(0,0,0,.22) 100%);pointer-events:none}
[data-theme="light"] #wallpaper::after{background:radial-gradient(120% 90% at 85% -10%,transparent 55%,rgba(255,255,255,.14) 100%)}
#desktop{position:fixed;inset:0 0 calc(var(--tb-h) + env(safe-area-inset-bottom,0px)) 0;z-index:1;overflow:hidden}
#deskGrid{position:absolute;inset:10px 8px}
.dicon{position:absolute;width:88px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:12px;cursor:default;border:1px solid transparent;transition:background .15s,border-color .15s,box-shadow .15s;touch-action:none}
.dicon .di-ic{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);box-shadow:0 6px 18px -6px rgba(0,0,0,.5)}
.dicon .di-ic img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.dicon .di-ic svg{width:23px;height:23px}
.dicon .di-nm{font-size:12px;line-height:1.3;max-width:84px;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6);padding:1px 5px;border-radius:6px}
[data-theme="light"] .dicon .di-nm{color:#241d0e;text-shadow:0 1px 4px rgba(255,255,255,.8)}
.dicon.sel{background:var(--sel);border-color:var(--accent-line)}
.dicon.drop-ok{background:var(--accent-soft);border-color:var(--accent);box-shadow:var(--glow)}
.icon-accent{color:var(--accent)}
#ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);display:none;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--accent-line);color:var(--text);border-radius:11px;padding:7px 14px;font-size:12px;box-shadow:var(--shadow)}

/* ---------- 窗口 ---------- */
#windows{position:fixed;inset:0;z-index:50;pointer-events:none}
.win{position:absolute;min-width:280px;min-height:200px;background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border-radius:var(--win-r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;
  animation:winIn .28s cubic-bezier(.2,1.4,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .16s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95) translateY(8px)}}
.win.active{box-shadow:var(--glow),var(--shadow)}
.win.min-hide{display:none}
.win.peeked{opacity:.06;pointer-events:none}
.win-title{height:42px;flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 0 14px;border-bottom:1px solid var(--line-2);cursor:grab;touch-action:none}
.win-title:active{cursor:grabbing}
.win-title .wi{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none}
.win-title .wi svg{width:15px;height:15px}
.win-title .wt{font-size:13px;font-weight:500;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.02em}
.wctl{width:38px;height:42px;display:grid;place-items:center;color:var(--dim);transition:.15s}
.wctl:hover{background:var(--panel-2);color:var(--text)}
.wctl.wx:hover{background:#e81123;color:#fff}
.wctl svg{width:15px;height:15px}
.win-body{flex:1;overflow:hidden;position:relative;background:color-mix(in srgb,var(--panel-solid) 55%,transparent)}
.rz{position:absolute;z-index:5}
.rz.n{top:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}.rz.s{bottom:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rz.e{right:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}.rz.w{left:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rz.ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize}.rz.sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize}
.rz.nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize}.rz.se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize}
.win.max .rz{display:none}
#snappre{position:fixed;z-index:49;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--win-r);opacity:0;pointer-events:none;transition:all .18s cubic-bezier(.2,1,.3,1)}

/* ---------- 任务栏 (悬浮 Dock) ---------- */
#taskbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:90;height:var(--tb-h);
  display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px -14px rgba(0,0,0,.8);max-width:calc(100vw - 16px)}
.tb-btn{height:42px;min-width:42px;padding:0 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--dim);position:relative;transition:.15s;flex:none}
.tb-btn:hover{background:var(--panel-2);color:var(--text);transform:translateY(-2px)}
.tb-btn.on{color:var(--accent);background:var(--accent-soft)}
.tb-btn.on::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:3px;background:var(--accent)}
.tb-btn .tb-label{font-size:12px;max-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#startBtn{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7a2d00));color:#1d1102;font-weight:700}
#startBtn:hover{color:#000;filter:brightness(1.12)}
#tbSep{width:1px;height:26px;background:var(--line);flex:none;margin:0 2px}
#tray{display:flex;align-items:center;gap:4px;flex:none}
#clock{padding:0 12px;height:42px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:.15s}
#clock:hover{background:var(--panel-2)}
#clock .c-t{font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:.03em}
#clock .c-d{font-size:10px;color:var(--dim)}
#peekBtn{width:8px;height:42px;border-radius:6px;border-left:1px solid var(--line);flex:none}
#peekBtn:hover{background:var(--accent-soft)}

/* ---------- 开始菜单 ---------- */
#startMenu{position:fixed;z-index:95;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(var(--tb-h) + 18px + env(safe-area-inset-bottom,0px));
  width:min(560px,calc(100vw - 20px));max-height:min(640px,calc(100vh - 120px));background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,1.2,.3,1)}
#startMenu.open{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.sm-head{padding:16px 18px 10px;display:flex;gap:10px;align-items:center}
.sm-head input{flex:1}
.sm-body{flex:1;overflow-y:auto;padding:4px 14px 12px}
.sm-sec{font-size:11px;color:var(--faint);letter-spacing:.18em;text-transform:uppercase;padding:12px 6px 8px;font-weight:600}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:14px;transition:.15s;cursor:default}
.sm-app:hover{background:var(--accent-soft)}
.sm-app .sa-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--accent)}
.sm-app .sa-ic svg{width:22px;height:22px}
.sm-app span{font-size:12px;color:var(--text)}
.sm-res{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;cursor:default;transition:.12s}
.sm-res:hover{background:var(--accent-soft)}
.sm-res .sr-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);color:var(--accent);flex:none}
.sm-res .sr-ic svg{width:15px;height:15px}
.sm-res .sr-p{font-size:11px;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sm-foot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2)}
.sm-foot .u{display:flex;align-items:center;gap:9px;font-size:13px}
.sm-foot .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7a2d00);display:grid;place-items:center;color:#1d1102;font-weight:900;font-family:var(--font-brand)}

/* ---------- 上下文菜单 ---------- */
#ctxMenu{position:fixed;z-index:200;min-width:218px;background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:5px;display:none;font-size:13px}
.ctx-it{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;cursor:default;position:relative;transition:.1s;color:var(--text)}
.ctx-it:hover:not(.dis){background:var(--accent-soft)}
.ctx-it.dis{opacity:.4}
.ctx-it.danger{color:var(--danger)}
.ctx-it svg{width:15px;height:15px;color:var(--dim);flex:none}
.ctx-it.danger svg{color:var(--danger)}
.ctx-it .ck{width:15px;flex:none}
.ctx-it .arr{margin-left:auto;color:var(--faint)}
.ctx-sep{height:1px;background:var(--line-2);margin:5px 8px}
.ctx-sub{position:absolute;left:calc(100% - 4px);top:-6px;min-width:200px;background:var(--panel);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:5px;display:none;z-index:201}
.ctx-it:hover>.ctx-sub{display:block}

/* ---------- 通用组件 ---------- */
.xbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;transition:.15s;color:var(--text)}
.xbtn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.xbtn.acc{background:var(--accent);color:#1d1102;border-color:transparent;font-weight:600}
.xbtn.acc:hover{filter:brightness(1.1)}
.xbtn.danger{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;color:var(--dim);transition:.14s;flex:none}
.ibtn:hover:not(.dis){background:var(--panel-2);color:var(--text)}
.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.ibtn.dis{opacity:.35;pointer-events:none}
.ibtn svg{width:16px;height:16px}
#toasts{position:fixed;right:14px;bottom:calc(var(--tb-h) + 16px);z-index:400;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 28px))}
.toast{background:var(--panel);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 15px;display:flex;gap:11px;align-items:flex-start;animation:tIn .3s cubic-bezier(.2,1.4,.3,1)}
@keyframes tIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast .ti{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.toast .tt{font-size:13px;font-weight:600}
.toast .tm{font-size:12px;color:var(--dim);margin-top:2px;user-select:text;-webkit-user-select:text}
.toast .ta{display:flex;gap:8px;margin-top:8px}
#dlgWrap{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px)}
#dlg{width:min(430px,calc(100vw - 32px));background:var(--panel);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;animation:tIn .25s}
#dlg .dt{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:9px}
#dlg .dt svg{color:var(--accent)}
#dlg .db{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:16px;user-select:text;-webkit-user-select:text}
#dlg .db input{width:100%;margin-top:8px}
#dlg .dbs{display:flex;justify-content:flex-end;gap:9px}
#selrect{position:absolute;z-index:40;border:1px solid var(--accent);background:var(--sel);pointer-events:none;display:none;border-radius:3px}
.prog{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .3s}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px;pointer-events:none;text-align:center;line-height:2}
.switch{position:relative;width:38px;height:21px;border-radius:21px;background:var(--panel-2);border:1px solid var(--line);transition:.2s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--dim);transition:.2s}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{left:19px;background:#fff}

/* ---------- 文件管理器 ---------- */
.fx{display:flex;height:100%;font-size:13px}
.fx-side{width:196px;flex:none;border-right:1px solid var(--line-2);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--panel-solid) 40%,transparent)}
.fx-nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;cursor:default;color:var(--dim);transition:.12s;font-size:12.5px}
.fx-nav:hover{background:var(--panel-2);color:var(--text)}
.fx-nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fx-nav svg{width:15px;height:15px;flex:none}
.fx-nav .fn-t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fx-nav .fn-x{margin-left:auto;opacity:0;width:18px;height:18px;display:grid;place-items:center;border-radius:5px}
.fx-nav:hover .fn-x{opacity:.7}
.fx-nav .fn-x:hover{background:var(--danger);color:#fff;opacity:1}
.fx-tree{display:flex;align-items:center;gap:6px;padding:5px 6px 5px calc(8px + var(--depth,0)*15px);border-radius:8px;cursor:default;color:var(--dim);font-size:12.5px;transition:.12s}
.fx-tree:hover{background:var(--panel-2);color:var(--text)}
.fx-tree.on{background:var(--accent-soft);color:var(--accent)}
.fx-tree svg{width:14px;height:14px;flex:none}
.fx-tree .tw{width:14px;height:14px;display:grid;place-items:center;flex:none;border-radius:4px}
.fx-tree .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fx-side-h{font-size:10.5px;letter-spacing:.16em;color:var(--faint);padding:12px 10px 5px;font-weight:700}
.fx-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fx-tools{flex:none;display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.fx-crumb{flex:1;min-width:120px;display:flex;align-items:center;gap:2px;overflow-x:auto;padding:2px 4px;scrollbar-width:none}
.fx-crumb::-webkit-scrollbar{display:none}
.crumb{display:flex;align-items:center;gap:2px;padding:4px 8px;border-radius:8px;color:var(--dim);font-size:12.5px;white-space:nowrap;transition:.12s;flex:none}
.crumb:hover{background:var(--panel-2);color:var(--text)}
.crumb:last-child{color:var(--text);font-weight:600}
.crumb svg{width:13px;height:13px;color:var(--faint)}
.fx-view{flex:1;position:relative;overflow:auto;outline:none}
.fx-list{min-width:fit-content;width:100%}
.fx-lhead{display:flex;position:sticky;top:0;z-index:6;background:var(--panel-solid);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim);width:fit-content;min-width:100%}
.fx-lrow{display:flex;width:fit-content;min-width:0;border-bottom:1px solid var(--line-2);cursor:default;transition:background .1s;position:relative}
.fx-lrow:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.fx-lrow.sel{background:var(--sel)}
.fx-lrow.cut{opacity:.45}
.fx-cell{padding:7px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:none;display:flex;align-items:center;gap:8px;user-select:none}
.fx-lhead .fx-cell{padding:8px 12px;font-weight:600;letter-spacing:.04em;cursor:default}
.fx-lhead .fx-cell:hover{color:var(--accent)}
.fx-cell .csz{margin-left:auto;font-size:10px;color:var(--faint)}
.col-rz{width:5px;flex:none;cursor:col-resize;margin:0 -2.5px;z-index:3;position:relative}
.col-rz:hover,.col-rz.on{background:var(--accent)}
.fx-grid{display:flex;flex-wrap:wrap;gap:4px;padding:12px;align-content:flex-start;position:relative;min-height:100%}
.fx-gitem{width:96px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:12px;border:1px solid transparent;cursor:default;position:relative}
.fx-gitem:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.fx-gitem.sel{background:var(--sel);border-color:var(--accent-line)}
.fx-gitem.cut{opacity:.45}
.fx-gitem .fg-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.fx-gitem .fg-ic img{width:100%;height:100%;object-fit:cover}
.fx-gitem .fg-nm{font-size:12px;text-align:center;max-width:92px;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;padding:0 2px;border-radius:5px}
.fx-gitem.drop-ok{background:var(--accent-soft);border-color:var(--accent)}
.fx-status{flex:none;display:flex;align-items:center;gap:14px;padding:5px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--dim)}
.fx-status .sp{flex:1}
input.rn{height:26px;padding:2px 8px;font-size:12px}
.thumb{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:none}

/* ---------- 记事本 / 表格 ---------- */
.np{display:flex;flex-direction:column;height:100%}
.np-tools{flex:none;display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.np-body{flex:1;position:relative;overflow:hidden;display:flex}
.np-ta{flex:1;width:100%;height:100%;resize:none;border:0;outline:none;background:transparent;color:var(--text);padding:16px 18px;font-family:var(--font-mono);font-size:14px;line-height:1.7;user-select:text;-webkit-user-select:text}
.np-status{flex:none;display:flex;gap:16px;padding:5px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--dim)}
.np-status .sp{flex:1}
.tbl-wrap{flex:1;overflow:auto;position:relative}
table.tbl{border-collapse:collapse;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line-2);padding:6px 12px;font-size:12.5px;text-align:left;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.tbl th{background:var(--panel-solid);position:sticky;top:0;color:var(--accent);font-weight:600;z-index:2}
.tbl td[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text}
.tbl tr:hover td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}

/* ---------- 代码编辑器 ---------- */
.ce{display:flex;flex-direction:column;height:100%}
.ce-tools{flex:none;display:flex;align-items:center;gap:5px;padding:7px 9px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;row-gap:5px}
.ce-tools select{padding:4px 8px;font-size:12px;border-radius:8px}
.ce-main{flex:1;display:flex;min-height:0;position:relative}
.ce-main.vert{flex-direction:column}
.ce-ed{flex:1;min-width:60px;min-height:60px;position:relative;overflow:hidden}
.ce-ed .CodeMirror{height:100%;font-size:13.5px}
.ce-pv{flex:1;min-width:60px;min-height:60px;position:relative;background:#fff;display:flex;flex-direction:column}
.ce-pv iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.ce-pvmask{position:absolute;inset:0;background:#12100b;display:grid;place-items:center;color:var(--accent);z-index:3;transition:opacity .4s;pointer-events:none}
.ce-split{flex:none;background:var(--line-2);position:relative;z-index:4}
.ce-main:not(.vert) .ce-split{width:6px;cursor:col-resize}
.ce-main.vert .ce-split{height:6px;cursor:row-resize}
.ce-split:hover,.ce-split.on{background:var(--accent)}
.ce-status{flex:none;display:flex;gap:14px;padding:5px 12px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--dim);font-family:var(--font-mono);overflow-x:auto;scrollbar-width:none}
.ce-status span{white-space:nowrap}
.ce-status .sp{flex:1}
.CodeMirror{font-family:var(--font-mono)!important}
.cm-s-material-darker{background:#17130c!important;color:#e8ddc9!important}
.cm-s-material-darker .CodeMirror-gutters{background:#17130c!important;border-right-color:rgba(255,214,160,.1)!important}
.cm-s-material-darker .CodeMirror-cursor{border-left-color:var(--accent)!important}
.cm-s-material-darker .CodeMirror-selected{background:rgba(255,158,69,.2)!important}
.cm-s-material-darker .CodeMirror-activeline-background{background:rgba(255,158,69,.06)!important}
.CodeMirror-dialog{background:var(--panel-solid)!important;border-color:var(--line)!important;color:var(--text)!important;font-family:var(--font-ui)!important;border-radius:0 0 12px 12px!important}
.CodeMirror-dialog input{background:var(--panel-2)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:7px!important}

/* ---------- 图片 / 漫画 ---------- */
.iv{position:relative;height:100%;background:repeating-conic-gradient(#181510 0 25%,#100e0a 0 50%) 0 0/22px 22px;overflow:hidden;display:grid;place-items:center}
[data-theme="light"] .iv{background:repeating-conic-gradient(#efe9db 0 25%,#e5ddc9 0 50%) 0 0/22px 22px}
.iv img{max-width:100%;max-height:100%;transition:transform .18s;cursor:grab;transform-origin:center}
.iv-tools{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:13px;padding:5px;z-index:5}
.mg{height:100%;background:#000;overflow-y:auto;overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;position:relative;scrollbar-width:none}
.mg::-webkit-scrollbar{display:none}
.mg-inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.mg-item{position:relative;width:100%;background:#0d0d0d;min-height:24vh}
.mg-item img{display:block;width:100%;height:auto}
.mg-item .sk{position:absolute;inset:0;display:grid;place-items:center;color:#333}
.mg-hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:5px;background:rgba(20,17,11,.82);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;padding:5px;transition:opacity .3s}
.mg.fs-hud-hide .mg-hud{opacity:0;pointer-events:none}
.mg-x{position:fixed;top:14px;right:14px;z-index:30;width:38px;height:38px;border-radius:50%;background:rgba(20,17,11,.7);border:1px solid var(--line);color:#ddd;display:none;place-items:center;backdrop-filter:blur(10px)}
.mg-x:hover{background:var(--danger);color:#fff}
.mg.fullscreen .mg-x{display:grid}
.mg.fullscreen .mg-hud{display:none}
.win:fullscreen{border-radius:0}
.mg-load{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;justify-content:center;padding:12px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);color:#8a8071;font-size:12.5px}

/* ---------- 浏览器 / 媒体 ---------- */
.br{display:flex;flex-direction:column;height:100%}
.br-bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.br-bar input{flex:1;font-family:var(--font-mono);font-size:12.5px}
.br-view{flex:1;position:relative;background:#fff}
.br-view iframe{width:100%;height:100%;border:0}
.br-mask{position:absolute;inset:0;background:#12100b;display:grid;place-items:center;gap:12px;color:var(--accent);z-index:5;transition:opacity .35s}
.br-home{position:absolute;inset:0;overflow-y:auto;background:radial-gradient(120% 120% at 50% 0%,#201a10,#0d0b08);padding:38px 26px;z-index:4}
.br-home .bh-logo{font-family:var(--font-brand);font-size:34px;color:var(--accent);text-align:center;letter-spacing:.1em}
.br-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;max-width:640px;margin:28px auto 0}
.br-tile{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 8px;background:rgba(255,255,255,.045);border:1px solid rgba(255,214,160,.1);border-radius:16px;transition:.18s;color:#e8dfce;font-size:12px}
.br-tile:hover{background:var(--accent-soft);transform:translateY(-3px);border-color:var(--accent-line)}
.br-tile svg{width:22px;height:22px;color:var(--accent)}
.mp{display:flex;flex-direction:column;height:100%;background:radial-gradient(130% 100% at 50% 0%,color-mix(in srgb,var(--accent) 12%,var(--panel-solid)),var(--panel-solid))}
.mp-stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative;min-height:0}
.mp-stage video{width:100%;height:100%;object-fit:contain;background:#000}
.mp-disc{width:150px;height:150px;border-radius:50%;background:conic-gradient(from 120deg,var(--accent),#3a2c15,var(--accent),#241b0d,var(--accent));display:grid;place-items:center;box-shadow:0 20px 60px -12px rgba(0,0,0,.7),inset 0 0 0 10px rgba(0,0,0,.35);animation:rot 5s linear infinite paused}
.mp-disc.play{animation-play-state:running}
.mp-disc::after{content:"";width:44px;height:44px;border-radius:50%;background:var(--panel-solid);border:1px solid var(--line)}
.mp-ctl{flex:none;padding:12px 18px 16px;display:flex;flex-direction:column;gap:9px}
.mp-name{font-size:13.5px;font-weight:600;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mp-row{display:flex;align-items:center;gap:10px}
.mp-row .tm{font-family:var(--font-mono);font-size:11px;color:var(--dim);flex:none}
.mp-seek{flex:1;height:5px;border-radius:5px;background:var(--panel-2);position:relative;cursor:pointer}
.mp-seek i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.pdfv{width:100%;height:100%;border:0;background:#3a3a3a}

/* ---------- 计算器 ---------- */
.calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:10px;background:radial-gradient(140% 100% at 50% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent)}
.calc-disp{flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:right;min-height:74px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.calc-disp .cd-exp{font-size:12px;color:var(--faint);min-height:16px;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-disp .cd-val{font-size:29px;font-weight:700;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;-webkit-user-select:text}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:8px}
.calc-grid button{border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:17px;font-weight:500;font-family:var(--font-mono);transition:.12s}
.calc-grid button:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.calc-grid button:active{transform:scale(.95)}
.calc-grid .op{color:var(--accent);font-weight:700}
.calc-grid .eq{background:var(--accent);color:#1d1102;font-weight:800;grid-row:span 2}
.calc-grid .eq:hover{filter:brightness(1.12)}

/* ---------- 画板 ---------- */
.pt{display:flex;flex-direction:column;height:100%}
.pt-tools{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.pt-colors{display:flex;gap:5px}
.pt-c{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:.12s}
.pt-c.on{border-color:var(--text);transform:scale(1.15)}
.pt-cv{flex:1;position:relative;overflow:hidden;background:#fff}
.pt-cv canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
input[type=range]{accent-color:var(--accent)}

/* ---------- 设置 ---------- */
.st{display:flex;height:100%;font-size:13px}
.st-side{width:190px;flex:none;border-right:1px solid var(--line-2);padding:14px 10px;overflow-y:auto;background:color-mix(in srgb,var(--panel-solid) 40%,transparent)}
.st-nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--dim);cursor:default;transition:.13s;margin-bottom:2px}
.st-nav:hover{background:var(--panel-2);color:var(--text)}
.st-nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.st-nav svg{width:16px;height:16px}
.st-main{flex:1;overflow-y:auto;padding:22px 26px;min-width:0}
.st-h1{font-size:19px;font-weight:800;font-family:var(--font-brand);letter-spacing:.08em;margin:0 0 4px}
.st-sub{font-size:12px;color:var(--dim);margin-bottom:18px}
.st-card{background:var(--panel-2);border:1px solid var(--line-2);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.st-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.st-row:last-child{border-bottom:0}
.st-row .r-tt{font-weight:600;font-size:13px}
.st-row .r-ds{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.st-row .r-ct{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.wall-it{aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line);background-size:cover;background-position:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.wall-it:hover{transform:scale(1.04)}
.wall-it.on{border-color:var(--accent);box-shadow:var(--glow)}
.wall-it .wn{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:10.5px;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);color:#fff}
.acc-row{display:flex;gap:9px;flex-wrap:wrap}
.acc-dot{width:30px;height:30px;border-radius:11px;cursor:pointer;border:2px solid transparent;transition:.14s}
.acc-dot.on{border-color:var(--text);transform:scale(1.12);box-shadow:0 4px 14px -4px currentColor}
.seg{display:flex;background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:8px;font-size:12px;color:var(--dim);transition:.13s}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.store-bar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--panel-solid);border:1px solid var(--line);margin:10px 0 6px}
.store-bar i{display:block;height:100%}
.store-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--dim);margin-top:8px}
.store-leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.vol-table{width:100%;border-collapse:collapse;font-size:12.5px}
.vol-table td{padding:8px 6px;border-bottom:1px solid var(--line-2)}
.vol-table tr:last-child td{border-bottom:0}

/* ---------- 日历 ---------- */
#calPop{position:fixed;z-index:96;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(var(--tb-h) + 18px + env(safe-area-inset-bottom,0px));width:300px;
  background:var(--panel);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:16px;transform:translateY(14px);opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,1.2,.3,1)}
#calPop.open{transform:none;opacity:1;pointer-events:auto}
#calPop .cal-big{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--accent)}
#calPop .cal-sub{font-size:12px;color:var(--dim);margin:2px 0 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head .cm{font-weight:700;font-size:13.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-grid .cw{font-size:10.5px;color:var(--faint);padding:5px 0;font-weight:700}
.cal-grid .cd{padding:6px 0;border-radius:8px;color:var(--text);cursor:default;transition:.12s}
.cal-grid .cd:hover{background:var(--panel-2)}
.cal-grid .cd.dim{color:var(--faint);opacity:.45}
.cal-grid .cd.today{background:var(--accent);color:#1d1102;font-weight:800}
.cal-grid .cd.picked{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---------- VM ---------- */
.vm{display:flex;flex-direction:column;height:100%;background:#000}
.vm-bar{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line-2);background:var(--panel)}
.vm-scr{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;background:#000}
.vm-scr .screen_container{position:relative;width:100%;height:100%}
.vm-scr .screen_container>div{position:absolute;inset:0;white-space:pre;font-family:monospace;font-size:14px;line-height:1.1em;color:#ccc;display:none}
.vm-scr canvas{position:absolute;inset:0;width:100%;height:100%}
.vm-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);text-align:center;padding:20px;z-index:3;background:radial-gradient(100% 100% at 50% 0%,#1a150d,#0a0906)}

/* ---------- 移动端 ---------- */
#mobBack{display:none}
@media (max-width:760px){
  :root{--tb-h:64px}
  #taskbar{left:8px;right:8px;transform:none;bottom:calc(6px + env(safe-area-inset-bottom,0px));max-width:none;justify-content:flex-start;overflow-x:auto;border-radius:18px;scrollbar-width:none}
  #taskbar::-webkit-scrollbar{display:none}
  .tb-btn .tb-label{display:none}
  #clock{flex-direction:row;gap:7px;padding:0 9px}
  .win{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tb-h) - 8px)!important;border-radius:0;max-height:none!important}
  .win .rz{display:none}
  #mobBack{display:grid}
  .fx-side{position:absolute;z-index:20;height:100%;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow);background:var(--panel-solid)}
  .fx-side.open{transform:none}
  #startMenu{width:calc(100vw - 16px);max-height:calc(100vh - 100px)}
  .st-side{width:150px}
  .st-main{padding:16px}
  .dicon .di-nm{font-size:11px}
  .ce-tools{gap:4px}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.loading-pulse{animation:pulse 1.2s ease infinite}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="desktop"><div id="deskGrid"></div><div id="selrect"></div></div>
<div id="windows"></div>
<div id="snappre"></div>
<button id="ghost"></button>

<div id="taskbar">
  <button class="tb-btn" id="startBtn"><i data-lucide="command"></i><span class="tb-label" style="font-family:var(--font-brand);letter-spacing:.1em">曜石</span></button>
  <div id="tbSep"></div>
  <div id="tbApps" style="display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:52vw"></div>
  <div id="tbSep"></div>
  <div id="tray">
    <button class="tb-btn" id="mobBack" title="关闭当前窗口"><i data-lucide="chevron-down"></i></button>
    <button class="tb-btn" id="fsBtn" title="全屏"><i data-lucide="maximize"></i></button>
    <button id="clock"><span class="c-t">--:--</span><span class="c-d">----</span></button>
    <button id="peekBtn" title="速览桌面"></button>
  </div>
</div>

<div id="startMenu">
  <div class="sm-head">
    <i data-lucide="search" style="color:var(--faint);width:17px"></i>
    <input type="search" id="smSearch" placeholder="搜索应用、文件与设置…">
  </div>
  <div class="sm-body" id="smBody"></div>
  <div class="sm-foot">
    <div class="u"><div class="av" id="smAvatar">曜</div><span id="smUser">本地用户</span></div>
    <div style="display:flex;gap:4px">
      <button class="ibtn" id="smSettings" title="设置"><i data-lucide="settings-2"></i></button>
      <button class="ibtn" id="smReload" title="重新启动"><i data-lucide="rotate-cw"></i></button>
    </div>

const DB={

};
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(st,k){return reqP((await DB.store(st)).get(k))}

async function idbDel(st,k){return reqP((await DB.store(st,"readwrite")).delete(k))}
async function idbAll(st){return reqP((await DB.store(st)).getAll())}
async function idbClear(st){return reqP((await DB.store(st,"readwrite")).clear())}
/* mtime 元数据（OPFS/挂载后端用，保证移动/重命名后修改日期不丢失） */
const metaGet=async k=>(await idbGet("meta",k))||null;
const metaSet=(k,v)=>idbSet("meta",k,Object.assign({},v));
async function metaMerge(k,patch){const cur=(await metaGet(k))||{};Object.assign(cur,patch);await idbSet("meta",k,cur)}
async function metaDelPrefix(prefix){const all=await idbAll("meta");const s=await DB.store("meta","readwrite");for(const m of all){}const keys=await reqP((await DB.store("meta")).getAllKeys());for(const k of keys)if(String(k).startsWith(prefix))await reqP(s.delete(k))}
async function metaMovePrefix(oldP,newP){const keys=await reqP((await DB.store("meta")).getAllKeys());for(const k of keys){if(String(k).startsWith(oldP)){const v=await metaGet(k);await idbDel("meta",k);await idbSet("meta",newP+String(k).slice(oldP.length),v)}}}

/* ---------------- 虚拟路径工具 ---------------- */
function normPath(p){if(!p||p==="/")return"/";const parts=[];for(const s of String(p).split("/")){if(!s||s===".")continue;if(s==="..")parts.pop();else parts.push(s)}return"/"+parts.join("/")}
const pathJoin=(...a)=>normPath(a.join("/"));
const baseName=p=>{p=normPath(p);return p==="/"?"/":p.slice(p.lastIndexOf("/")+1)};
const parentPath=p=>{p=normPath(p);const i=p.lastIndexOf("/");return i<=0?"/":p.slice(0,i)};
const Err=(msg,code)=>{const e=new Error(msg);e.code=code||"ERR";return e};

/* ================================================================
   后端 1：OPFS（主存储）
   ================================================================ */
const OPFS={
 root:null,ok:false,
 async init(){try{this.root=await navigator.storage.getDirectory();this.ok=true}catch(e){this.ok=false;console.warn("OPFS 不可用",e)}},

 async stat(rel){rel=normPath(rel);if(rel==="/")return{name:"本机存储",path:"/disk",type:"dir",size:0,mtime:Date.now(),ctime:Date.now()};
  const parts=rel.slice(1).split("/");const name=parts[parts.length-1];const parent=await this._dir(parts.slice(0,-1)).catch(()=>{throw Err("目录不存在","ENOENT")});
  try{const dh=await parent.getDirectoryHandle(name);const m=await metaGet(this.key(rel));return{name,path:"/disk"+rel,type:"dir",size:null,mtime:m?.mtime||0,ctime:m?.ctime||0}}catch(e){}
  try{const fh=await parent.getFileHandle(name);const f=await fh.getFile();const m=await metaGet(this.key(rel));return{name,path:"/disk"+rel,type:"file",size:f.size,mtime:m?.mtime??f.lastModified,ctime:m?.ctime??f.lastModified}}catch(e){throw Err("不存在 "+name,"ENOENT")}},
 async readdir(rel){rel=normPath(rel);const d=await this._dir(rel==="/"?[]:rel.slice(1).split("/")).catch(()=>{throw Err("目录不存在","ENOENT")});
  const out=[];for await(const[name,h]of d.entries()){const p2=pathJoin(rel,name);if(h.kind==="directory"){const m=await metaGet(this.key(p2));out.push({name,path:"/disk"+p2,type:"dir",size:null,mtime:m?.mtime||0,ctime:m?.ctime||0})}else{try{const f=await h.getFile();const m=await metaGet(this.key(p2));out.push({name,path:"/disk"+p2,type:"file",size:f.size,mtime:m?.mtime??f.lastModified,ctime:m?.ctime??f.lastModified})}catch(e){}}}
  return out},

/* ================================================================
   后端 2：IndexedDB 卷（数据匣）
   ================================================================ */
const IDBFS={
 name:"数据匣",
 _n(rel){return normPath(rel)},
 async stat(rel){rel=this._n(rel);if(rel==="/")return{name:"数据匣",path:"/vault",type:"dir",size:0,mtime:Date.now(),ctime:Date.now()};
  const n=await idbGet("nodes","vault:"+rel);if(!n)throw Err("不存在 "+rel,"ENOENT");return{...n,blob:undefined,path:"/vault"+rel}},

  const all=await idbAll("nodes");const pre=rel==="/"?"vault:/":"vault:"+rel+"/";const out=[];
  for(const n of all){if(!n.path.startsWith(pre))continue;const rest=n.path.slice(pre.length);if(rest&&!rest.includes("/"))out.push({name:n.name,path:n.path.replace(/^vault:/,"/vault"),type:n.type,size:n.size,mtime:n.mtime,ctime:n.ctime})}
  return out},

 async readFile(rel){rel=this._n(rel);const n=await idbGet("nodes","vault:"+rel);if(!n||n.type!=="file")throw Err("文件不存在","ENOENT");return n.blob},

/* ================================================================

const MOUNTS={

   async readFile(rel){const parts=normPath(rel).slice(1).split("/");const nm=parts.pop();const d=await dir(parts);return(await d.getFileHandle(nm)).getFile()},

  const data=await e.async("blob");const mt=e.date?e.date.getTime():Date.now();await fs.writeFile(pathJoin(dstDir,safe),data,{mtime:mt}).catch(()=>{});count++}
 return count}
async function extractGz(path,dstDir){const b=await fs.readFile(path);const ds=new DecompressionStream("gzip");const out=await new Response(new Blob([b]).stream().pipeThrough(ds)).blob();const name=baseName(path).replace(/\.(gz|gzip)$/i,"")||"output";await fs.writeFile(pathJoin(dstDir,name),out);return 1}
async function untarBuffer(buf){const u8=new Uint8Array(buf);const files=[];let off=0;const dec=new TextDecoder();
 while(off+512<=u8.length){const head=u8.slice(off,off+512);if(head[0]===0)break;const name=dec.decode(head.slice(0,100)).replace(/\0.*$/,"");const size=parseInt(dec.decode(head.slice(124,136)).replace(/\0.*$/).trim(),8)||0;const mt=parseInt(dec.decode(head.slice(136,148)).replace(/\0.*$/).trim(),8)*1000;const type=String.fromCharCode(head[156]);let prefix=dec.decode(head.slice(345,500)).replace(/\0.*$/,"");const full=prefix?prefix+"/"+name:name;

 if(mode==="css"){let out="",ind=0,buf="";for(const ch of code){buf+=ch;if(ch==="{"){out+="  ".repeat(ind)+buf.trim()+"\n";ind++;buf=""}else if(ch==="}"){buf=buf.slice(0,-1);ind=Math.max(0,ind-1);out+="  ".repeat(ind)+"}\n";buf=""}else if(ch===";"){out+="  ".repeat(ind)+buf.trim()+"\n";buf=""}}return out+buf}
 /* html/js 通用缩进格式化 */
 const lines=code.split(/\r?\n/);let ind=0,out=[];
 for(let ln of lines){const t=ln.trim();if(!t){out.push("");continue}
  if(/^([}\])]|<\/|!--|else|case|default)/.test(t))ind=Math.max(0,ind-1);
  out.push("  ".repeat(ind)+t);
  const opens=(t.match(/[{[(]/g)||[]).length+(/<(?!!--)[a-zA-Z][^>]*[^/]>/g||[]).length;
  const closes=(t.match(/[}\])]\s*[,;]?\s*$/g)||[]).length+(/<\/[^>]+>|-->|\/>/g||[]).length;

   main.innerHTML=`<h1 class="st-h1">存储</h1><div class="st-sub">配额 ${quota?fmtSize(quota):"未知"} · 已用 ${fmtSize(used)}${quota?`（${(used/quota*100).toFixed(2)}%）`:""}</div>
   <div class="st-card"><div class="r-tt">浏览器存储配额</div>
    <div class="store-bar" style="margin-top:12px"><i style="width:${quota?clamp(used/quota*100,1,100):6}%;background:var(--accent)"></i></div>
    <div class="store-leg"><span><b style="background:var(--accent)"></b>已用 ${fmtSize(used)}</span><span><b style="background:var(--panel-2)"></b>剩余 ${quota?fmtSize(Math.max(0,quota-used)):"—"}</span></div></div>
   <div class="st-card"><div class="r-tt">虚拟文件系统构成（${count} 个条目）</div>
    <div class="store-bar" style="margin-top:12px">${Object.keys(cn).map(k=>`<i style="width:${cat[k]/total*100}%;background:${cc[k]}"></i>`).join("")}</div>
    <div class="store-leg">${Object.keys(cn).filter(k=>cat[k]>0).map(k=>`<span><b style="background:${cc[k]}"></b>${cn[k]} ${fmtSize(cat[k])}</span>`).join("")}</div></div>
   <div class="st-card"><div class="r-tt">存储卷</div>
    <table class="vol-table" style="margin-top:8px">
     <tr><td>${icon("hard-drive")} 本机存储</td><td style="color:var(--dim)">OPFS</td><td style="text-align:right">${fmtSize(vols.opfs)}</td></tr>
     <tr><td>${icon("database")} 数据匣</td><td style="color:var(--dim)">IndexedDB</td><td style="text-align:right">${fmtSize(vols.vault)}</td></tr>
     <tr><td>${icon("laptop")} 本地挂载</td><td style="color:var(--dim)">${Object.keys(MOUNTS.map).length} 个已挂载</td><td style="text-align:right">实时读写</td></tr></table></div>
   <button class="xbtn" id="rsRe">${icon("rotate-cw")} 重新统计</button>`;
   refreshIcons(main);main.querySelector("#rsRe").onclick=()=>R.storage()})()},
 mount(){const names=Object.keys(MOUNTS.map);
  idbAll("mounts").then(saved=>{main.innerHTML=`<h1 class="st-h1">本地挂载</h1><div class="st-sub">通过 File System Access API 直达本机文件夹，功能与虚拟文件完全对等</div>
   <div class="st-card">${saved.length?saved.map(m=>`<div class="st-row"><div style="display:flex;align-items:center;gap:10px">${icon("laptop")}<div><div class="r-tt">${esc(m.name)}</div><div class="r-ds">/mnt/local/${esc(m.name)} · ${MOUNTS.map[m.name]?'<span style="color:var(--ok)">已挂载</span>':'<span style="color:var(--danger)">待重新授权</span>'}</div></div></div>
    <div class="r-ct">${MOUNTS.map[m.name]?"":`<button class="xbtn" data-rem="${esc(m.name)}">重新挂载</button>`}<button class="xbtn danger" data-unm="${esc(m.name)}">卸载</button></div></div>`).join(""):'<div class="r-ds">尚未挂载任何本地文件夹。</div>'}</div>
   <button class="xbtn acc" id="mntAdd">${icon("hard-drive-download")} 挂载本地文件夹</button>
   ${!MOUNTS.has()?'<div class="r-ds" style="margin-top:10px;color:var(--danger)">当前浏览器不支持 File System Access API。</div>':""}`;
   refreshIcons(main);
   main.querySelector("#mntAdd").onclick=async()=>{if(await MOUNTS.mount())R.mount()};
   main.querySelectorAll("[data-rem]").forEach(b=>b.onclick=async()=>{if(await MOUNTS.remount(b.dataset.rem))R.mount()});
   main.querySelectorAll("[data-unm]").forEach(b=>b.onclick=()=>{MOUNTS.unmount(b.dataset.unm);R.mount()})})},
 about(){main.innerHTML=`<h1 class="st-h1">曜石 OS</h1><div class="st-sub">Obsidian Web OS · 单文件浏览器操作系统</div>
  <div class="st-card"><table class="vol-table">
   <tr><td style="color:var(--dim)">内核</td><td>obsidian-core 1.0</td></tr>
   <tr><td style="color:var(--dim)">存储</td><td>OPFS + IndexedDB + File System Access</td></tr>
   <tr><td style="color:var(--dim)">压缩</td><td>JSZip（zip）· 原生 gzip/tar · 7z-wasm</td></tr>
   <tr><td style="color:var(--dim)">虚拟机</td><td>v86 0.5.319（版本锁定）</td></tr>
   <tr><td style="color:var(--dim)">编辑器</td><td>CodeMirror 5.65</td></tr>
   <tr><td style="color:var(--dim)">浏览器</td><td style="word-break:break-all">${esc(navigator.userAgent)}</td></tr></table></div>
  <div class="r-ds">所有数据仅存于此浏览器私有空间中，无任何服务器。</div>`}};
 root.querySelectorAll(".st-nav").forEach(n=>n.onclick=()=>{root.querySelectorAll(".st-nav").forEach(x=>x.classList.remove("on"));n.classList.add("on");R[n.dataset.s]();refreshIcons(main)});
 const rec=WM.open({app:"settings",title:"设置",icon:"settings-2",w:820,h:580,content:root,single:"settings"});
 R[args?.section||"person"]();root.querySelectorAll(".st-nav").forEach(x=>x.classList.toggle("on",x.dataset.s===(args?.section||"person")));
 refreshIcons(root);return rec}}
/* ================================================================
   12. v86 虚拟机（惰性加载 + 版本锁定）
   ================================================================ */
APPS.vm={id:"vm",name:"虚拟机",icon:"cpu",open(){
 const root=el(`<div class="vm">
  <div class="vm-bar">
   <button class="xbtn" id="vPick">${icon("disc-3")}选择镜像</button>
   <button class="xbtn acc" id="vBoot" disabled style="opacity:.4">${icon("power")}启动</button>
   <button class="xbtn" id="vLock" disabled style="opacity:.4">${icon("mouse")}鼠标锁定</button>
   <button class="xbtn" id="vKeys" disabled style="opacity:.4">Ctrl+Alt+Del</button>
   <span style="flex:1"></span><span id="vState" style="font-size:11px;color:var(--dim)">未就绪</span>
  </div>
  <div class="vm-scr">
   <div class="vm-empty" id="vEmpty"><i data-lucide="cpu" style="width:40px;height:40px;color:var(--accent)"></i>
    <div style="font-size:13.5px">v86 x86 虚拟机</div>
    <div style="font-size:11.5px;color:var(--faint);max-width:400px;line-height:1.8">选择你本机的 .iso（光盘）/ .img（软盘 / 硬盘）镜像后启动。<br>出于安全策略，系统不允许直接加载外链镜像文件。</div></div>
   <div class="screen_container" style="display:none"><div></div><canvas></canvas></div>
  </div></div>`);
 let file=null,emulator=null,v86Loading=false;
 const state=t=>root.querySelector("#vState").textContent=t;
 root.querySelector("#vPick").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".iso,.img,.bin,.fda,.hda";
  i.onchange=()=>{file=i.files[0];if(file){root.querySelector("#vBoot").disabled=false;root.querySelector("#vBoot").style.opacity="1";state("已选择 "+file.name+"（"+fmtSize(file.size)+"）")}};i.click()};
 root.querySelector("#vBoot").onclick=async()=>{if(!file)return;root.querySelector("#vBoot").disabled=true;root.querySelector("#vBoot").style.opacity=".4";state("加载 v86 内核…");
  try{if(!window.V86){if(v86Loading)throw new Error("正在加载中");v86Loading=true;await loadScript("https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js");v86Loading=false}
   if(!window.V86)throw new Error("V86 未就绪")}
  catch(e){state("内核加载失败");osAlert("无法加载 v86 内核（需要网络）。\n"+e.message);root.querySelector("#vBoot").disabled=false;root.querySelector("#vBoot").style.opacity="1";return}
  const ext=extOf(file.name);const scr=root.querySelector(".screen_container");root.querySelector("#vEmpty").style.display="none";scr.style.display="";
  const opt={screen_container:scr,memory_size:128*1024*1024,autostart:true,
   bios:{url:"https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin"},
   vga_bios:{url:"https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin"}};
  if(ext==="iso")opt.cdrom={buffer:file};else if(["img","fda","bin"].includes(ext))opt.fda={buffer:file};else opt.hda={buffer:file};
  try{emulator=new V86(opt);state("运行中 · "+file.name);
   root.querySelector("#vLock").disabled=false;root.querySelector("#vLock").style.opacity="1";
   root.querySelector("#vKeys").disabled=false;root.querySelector("#vKeys").style.opacity="1";
   emulator.add_listener("emulator-ready",()=>state("运行中 · "+file.name))}catch(e){state("启动失败");osAlert("v86 启动失败："+e.message)}};
 root.querySelector("#vLock").onclick=()=>{const cv=root.querySelector(".screen_container canvas");cv&&cv.requestPointerLock&&cv.requestPointerLock();toast("鼠标锁定","按 Esc 释放鼠标",{icon:"mouse",ms:2600})};
 root.querySelector("#vKeys").onclick=()=>{if(emulator&&emulator.keyboard_send_scancodes)emulator.keyboard_send_scancodes([0x1D,0x38,0x53,0x1D|0x80,0x38|0x80,0x53|0x80])};
 const rec=WM.open({app:"vm",title:"虚拟机",icon:"cpu",w:840,h:580,content:root,onClose:()=>{try{emulator&&emulator.stop&&emulator.stop()}catch(e){}}});
 refreshIcons(root);return rec}}
/* ================================================================
   启动
   ================================================================ */
APPS.manga.pin=false;APPS.image.pin=false;APPS.media.pin=false;APPS.pdf.pin=false;
["notepad","explorer","browser","code","calc","paint","settings","vm"].forEach(id=>{if(APPS[id]&&APPS[id].pin===undefined)APPS[id].pin=true});
(async function boot(){
 applyTheme();applyWallpaper();refreshIcons();initChrome();
 $("#smUser").textContent=S.get("username");$("#smAvatar").textContent=(S.get("username")||"曜")[0];
 await OPFS.init();
 if(!OPFS.ok){toast("OPFS 不可用","已自动降级到 IndexedDB 单后端模式（可能处于无痕模式）",{icon:"alert-triangle",ms:9000});if(S.get("primary")==="opfs")S.set("primary","idb")}
 try{await seed()}catch(e){console.warn(e)}
 await Desktop.init();
 /* 挂载恢复提醒 */
 try{const ms=await idbAll("mounts");const missing=ms.filter(m=>!MOUNTS.map[m.name]);
  if(missing.length)toast("本地文件夹待重新挂载",missing.map(m=>m.name).join("、")+"（浏览器安全策略要求每次会话重新授权）",{icon:"hard-drive-download",ms:15000,
   actions:[{label:"立即重新挂载",acc:true,click:async()=>{for(const m of missing)await MOUNTS.remount(m.name);Desktop.render();refreshExplorerViews()}}]})}catch(e){}
})();
</script>
