<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LUMEN OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- CodeMirror 代码编辑器 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<!-- Markdown 渲染 + XSS 消毒 -->
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"></script>
<style>
:root{
  --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --panel3:#1c2230;
  --line:#262d3d; --line2:#333b50;
  --ink:#d9d7ce; --dim:#828a9c; --faint:#565e70;
  --acc:#ffb454; --acc-soft:rgba(255,180,84,.14);
  --cy:#59c2ff; --grn:#aad94c; --red:#f07178;
  --disp:'Syne','Noto Sans SC',sans-serif;
  --ui:'IBM Plex Sans','Noto Sans SC',sans-serif;
  --mono:'IBM Plex Mono','Noto Sans SC',monospace;
  --rad:8px;
  --tb-h:48px;
}
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ───────── 启动屏 ───────── */
#boot{position:fixed;inset:0;z-index:99999;background:#07090d;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .7s,visibility .7s}
#boot.off{opacity:0;visibility:hidden}
#boot .blogo{width:74px;height:74px;animation:bspin 2.6s cubic-bezier(.6,.05,.25,1) infinite}
@keyframes bspin{0%{transform:rotate(0)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
#boot .bname{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.55em;color:var(--ink);
  margin-left:.55em;animation:bfade 1.2s .2s both}
#boot .bsub{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.3em;animation:bfade 1.2s .5s both}
@keyframes bfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#boot .bbar{width:180px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
#boot .bbar i{display:block;height:100%;width:40%;background:var(--acc);border-radius:2px;animation:bload 1.3s ease-in-out infinite}
@keyframes bload{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}

/* ───────── 桌面 ───────── */
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:background-image .5s}
#wall::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 110%,rgba(7,9,13,.55),transparent 60%);pointer-events:none}
#desktop{position:fixed;inset:0 0 var(--tb-h) 0;overflow:hidden}
#icons{position:absolute;inset:0;padding:10px}
.dicon{position:absolute;width:88px;height:98px;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding-top:10px;border-radius:10px;cursor:default;user-select:none;-webkit-user-select:none;touch-action:none;
  transition:left .3s cubic-bezier(.3,1.3,.4,1),top .3s cubic-bezier(.3,1.3,.4,1),background .15s,outline-color .15s;
  outline:1px solid transparent}
.dicon.noanim{transition:background .15s}
.dicon:hover{background:rgba(255,255,255,.05)}
.dicon.sel{background:var(--acc-soft);outline-color:rgba(255,180,84,.45)}
.dicon.dropt{background:rgba(89,194,255,.16);outline-color:var(--cy)}
.dicon.dragging{opacity:.85;z-index:99;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.dic{width:46px;height:46px;display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.dlabel{font-size:12px;line-height:1.25;text-align:center;max-width:84px;color:#eceaf0;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.ic-folder{color:var(--acc)} .ic-image{color:var(--cy)} .ic-audio{color:#d2a6ff} .ic-video{color:var(--red)}
.ic-code{color:var(--grn)} .ic-text{color:var(--dim)} .ic-archive{color:#e6b673} .ic-pdf{color:var(--red)}
.ic-html{color:var(--acc)} .ic-table{color:var(--grn)} .ic-app{color:var(--acc)} .ic-file{color:var(--dim)}
#marq{position:absolute;border:1px solid rgba(255,180,84,.6);background:rgba(255,180,84,.1);z-index:50;pointer-events:none}

/* ───────── 任务栏 ───────── */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:5000;display:flex;align-items:stretch;gap:4px;
  background:rgba(13,16,23,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:0 8px}
#startbtn{display:flex;align-items:center;gap:9px;padding:0 13px;border-radius:8px;margin:5px 0;transition:background .15s}
#startbtn:hover,#startbtn.on{background:var(--acc-soft)}
#startbtn .slogo{width:21px;height:21px}
#startbtn .sname{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--ink)}
#tasks{flex:1;display:flex;align-items:stretch;gap:4px;overflow-x:auto;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.titem{display:flex;align-items:center;gap:8px;padding:0 12px;margin:6px 0;border-radius:7px;max-width:185px;
  background:rgba(255,255,255,.04);border:1px solid transparent;position:relative;flex:0 0 auto;transition:background .15s}
.titem:hover{background:rgba(255,255,255,.09)}
.titem.act{background:var(--acc-soft);border-color:rgba(255,180,84,.3)}
.titem.minz{opacity:.55}
.titem .ti-ic{width:16px;height:16px;color:var(--acc);flex:0 0 auto}
.titem .ti-t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
#tray{display:flex;align-items:center;gap:10px;padding:0 6px}
#clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.3;cursor:default}
#clk-t{font-family:var(--mono);font-size:13px;color:var(--ink)}
#clk-d{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ───────── 开始菜单 ───────── */
#startmenu{position:fixed;left:10px;bottom:calc(var(--tb-h) + 10px);width:340px;max-width:calc(100vw - 20px);z-index:6000;
  background:rgba(17,21,31,.93);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  transform-origin:bottom left;animation:smpop .22s cubic-bezier(.3,1.4,.5,1);overflow:hidden}
@keyframes smpop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
#sm-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#sm-head .smt{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.22em;color:var(--acc)}
#sm-head .sms{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.18em;margin-top:3px}
#sm-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:14px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 11px;border-radius:10px;transition:background .14s;
  animation:smitem .35s backwards}
.sm-app:hover{background:rgba(255,255,255,.06)}
.sm-app .sa-ic{width:34px;height:34px;color:var(--acc)}
.sm-app span{font-size:12px;color:var(--ink)}
@keyframes smitem{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sm-foot{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
#sm-foot button{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);padding:7px 11px;border-radius:7px}
#sm-foot button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
#sm-foot button svg{width:14px;height:14px}

/* ───────── 窗口 ───────── */
.window{position:absolute;min-width:320px;min-height:200px;display:flex;flex-direction:column;
  background:rgba(17,21,31,.96);border:1px solid var(--line2);border-radius:11px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  animation:wpop .24s cubic-bezier(.3,1.3,.5,1)}
@keyframes wpop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.window.focus{border-color:rgba(255,180,84,.4);box-shadow:0 26px 70px rgba(0,0,0,.68),0 0 0 1px rgba(255,180,84,.12)}
.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-left:none;border-right:none;border-top:none}
.window.closing{animation:wout .18s ease forwards}
@keyframes wout{to{opacity:0;transform:scale(.94) translateY(10px)}}
.win-head{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px 0 14px;flex:0 0 auto;
  background:rgba(255,255,255,.025);border-bottom:1px solid var(--line);cursor:default;user-select:none;-webkit-user-select:none;touch-action:none}
.win-ic{width:16px;height:16px;color:var(--acc);flex:0 0 auto}
.win-title{flex:1;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.window:not(.focus) .win-title{color:var(--dim)}
.win-btns{display:flex;gap:2px}
.wb{width:36px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--dim);transition:background .12s,color .12s}
.wb:hover{background:rgba(255,255,255,.09);color:var(--ink)}
.wb.cls:hover{background:rgba(240,113,120,.2);color:var(--red)}
.wb svg{width:13px;height:13px}
.win-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.rs{position:absolute;z-index:5}
.rs-n{top:-3px;left:10px;right:10px;height:7px;cursor:n-resize}.rs-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:s-resize}
.rs-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:e-resize}.rs-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:w-resize}
.rs-ne{top:-4px;right:-4px;width:13px;height:13px;cursor:ne-resize}.rs-nw{top:-4px;left:-4px;width:13px;height:13px;cursor:nw-resize}
.rs-se{bottom:-4px;right:-4px;width:13px;height:13px;cursor:se-resize}.rs-sw{bottom:-4px;left:-4px;width:13px;height:13px;cursor:sw-resize}

/* ───────── 右键菜单 ───────── */
.cmenu{position:fixed;z-index:9000;min-width:196px;padding:5px;background:rgba(19,23,34,.97);
  backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 16px 44px rgba(0,0,0,.6);animation:cmpop .14s ease-out}
@keyframes cmpop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.cm-it{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
.cm-it:hover{background:var(--acc-soft)}
.cm-it.dis{opacity:.35;pointer-events:none}
.cm-it svg{width:15px;height:15px;color:var(--dim);flex:0 0 auto}
.cm-it:hover svg{color:var(--acc)}
.cm-sep{height:1px;background:var(--line);margin:5px 8px}

/* ───────── 对话框 / 通知 ───────── */
.dlg-ov{position:fixed;inset:0;z-index:9500;background:rgba(5,7,11,.55);backdrop-filter:blur(3px);
  display:grid;place-items:center;animation:cmpop .15s}
.dlg{width:380px;max-width:calc(100vw - 40px);background:var(--panel2);border:1px solid var(--line2);
  border-radius:13px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
.dlg h3{font-family:var(--disp);font-size:15px;letter-spacing:.05em;margin-bottom:10px;color:var(--acc)}
.dlg p{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:14px;word-break:break-all}
.dlg input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;
  font-size:13px;outline:none;margin-bottom:16px}
.dlg input:focus{border-color:var(--acc)}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;background:var(--panel3);border:1px solid var(--line2);transition:all .14s}
.btn:hover{border-color:var(--faint);background:#222a3c}
.btn.pri{background:var(--acc);color:#221606;border-color:var(--acc);font-weight:600}
.btn.pri:hover{background:#ffc578}
.btn.dgr{color:var(--red);border-color:rgba(240,113,120,.4)}
.btn.dgr:hover{background:rgba(240,113,120,.12)}
#toasts{position:fixed;right:14px;bottom:calc(var(--tb-h) + 14px);z-index:9900;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;max-width:340px;padding:11px 15px;border-radius:10px;
  background:rgba(22,27,40,.96);border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.5);
  font-size:13px;animation:tin .25s cubic-bezier(.3,1.3,.5,1)}
.toast.err{border-color:rgba(240,113,120,.5)}
.toast.ok{border-color:rgba(170,217,76,.4)}
.toast svg{width:16px;height:16px;flex:0 0 auto}
.toast.ok svg{color:var(--grn)}.toast.err svg{color:var(--red)}.toast.info svg{color:var(--cy)}
.toast .ta{color:var(--acc);font-weight:600;cursor:pointer;white-space:nowrap;margin-left:4px}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{transition:all .3s;opacity:0;transform:translateX(40px)}

/* ───────── 通用控件 ───────── */
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--dim);
  border:1px solid transparent;transition:all .13s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.tbtn.on{background:var(--acc-soft);color:var(--acc);border-color:rgba(255,180,84,.3)}
.tbtn svg{width:15px;height:15px}
.tbtn:disabled{opacity:.3;pointer-events:none}
.inp{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;font-size:12.5px;outline:none}
.inp:focus{border-color:var(--acc)}

/* ───────── 文件管理器 ───────── */
.ex{display:flex;height:100%}
.ex-side{width:188px;flex:0 0 auto;border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto;background:rgba(0,0,0,.14)}
.ex-cap{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--faint);padding:8px 10px 5px}
.qa-it{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink);transition:background .12s}
.qa-it:hover{background:rgba(255,255,255,.06)}
.qa-it.on{background:var(--acc-soft);color:var(--acc)}
.qa-it svg{width:15px;height:15px;color:var(--dim);flex:0 0 auto}
.qa-it.on svg{color:var(--acc)}
.qa-it.dropt{background:rgba(89,194,255,.16);outline:1px solid var(--cy)}
.ex-main{flex:1;display:flex;flex-direction:column;min-width:0}
.ex-bar{display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;min-width:120px;overflow-x:auto;scrollbar-width:none;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-family:var(--mono);font-size:12px}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:2px 5px;border-radius:5px;cursor:pointer;color:var(--dim);white-space:nowrap}
.crumb:hover{color:var(--acc);background:var(--acc-soft)}
.crumb.cur{color:var(--ink)}
.crumb-sep{color:var(--faint)}
.ex-search{width:150px}
.ex-tools{display:flex;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ex-list{flex:1;overflow:auto;position:relative}
.ex-list.dropt::after{content:'松开以导入文件';position:absolute;inset:8px;border:2px dashed var(--cy);border-radius:12px;
  display:grid;place-items:center;font-size:15px;color:var(--cy);background:rgba(89,194,255,.07);pointer-events:none;z-index:5}
.ftable{width:100%;border-collapse:collapse;font-size:13px}
.ftable th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:left;font-weight:500;font-size:11.5px;
  color:var(--dim);padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.ftable th:hover{color:var(--acc)}
.ftable td{padding:6px 12px;border-bottom:1px solid rgba(38,45,61,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.frow{cursor:default;user-select:none;-webkit-user-select:none}
.frow:hover td{background:rgba(255,255,255,.04)}
.frow.sel td{background:var(--acc-soft)}
.frow.dropt td{background:rgba(89,194,255,.14)}
.fname{display:flex;align-items:center;gap:9px}
.fname svg{width:17px;height:17px;flex:0 0 auto}
.col-dim{color:var(--dim);font-family:var(--mono);font-size:12px}
.ex-status{padding:5px 13px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;gap:16px}
.ex-empty{padding:50px 20px;text-align:center;color:var(--faint);font-size:13px}
.ex-empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.4}

/* ───────── 记事本 / 编辑器 ───────── */
.np{display:flex;flex-direction:column;height:100%}
.np-bar{display:flex;align-items:center;gap:4px;padding:6px 9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.np-ta{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;padding:14px 17px;
  font-family:var(--mono);font-size:13.5px;line-height:1.65;color:var(--ink);tab-size:4}
.np-status{padding:4px 13px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;gap:14px}
.csv-wrap{flex:1;overflow:auto}
.csv-t{border-collapse:collapse;font-size:12.5px;font-family:var(--mono)}
.csv-t td,.csv-t th{border:1px solid var(--line);padding:5px 11px;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.csv-t th{background:var(--panel3);color:var(--acc);position:sticky;top:0;font-weight:500}
.csv-t tr:nth-child(even) td{background:rgba(255,255,255,.022)}
.csv-t td:first-child{color:var(--faint);background:var(--panel2);position:sticky;left:0}
.cm-split{flex:1;display:flex;min-height:0}
.cm-pane{flex:1;min-width:0;display:flex;flex-direction:column}
.cm-pane .CodeMirror{flex:1;height:auto;font-family:var(--mono);font-size:13px;line-height:1.6;background:transparent;color:var(--ink)}
.CodeMirror-gutters{background:rgba(0,0,0,.18)!important;border-right:1px solid var(--line)!important}
.CodeMirror-linenumber{color:var(--faint)!important}
.CodeMirror-cursor{border-left:2px solid var(--acc)!important}

.cbtn{border-radius:11px;font-family:var(--mono);font-size:18px;background:var(--panel3);border:1px solid var(--line);

@keyframes spin{to{transform:rotate(360deg)}}

const idb={_db:null,

  rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
  rq.onsuccess=()=>{this._db=rq.result;res(this._db);};rq.onerror=()=>rej(rq.error);});},
 async get(k){try{const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return null;}},
 async set(k,v){try{const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}},
};

/* ════════════════════ FS：OPFS 虚拟文件系统（+内存/IDB 降级 +本地挂载） ════════════════════ */
const FS=(()=>{
 let ROOT=null,mem=false,saveTimer=0;
 const mounts=new Map();
 function err404(n){const e=new Error('未找到: '+n);e.name='NotFoundError';return e;}
 function schedSave(){if(!mem)return;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await idb.set('memfs',await ser(ROOT));}catch(e){}},900);}
 class MemW{constructor(f){this.f=f;this.ch=[];}async write(d){this.ch.push(d);}async close(){this.f.blob=new Blob(this.ch);this.f.m=Date.now();schedSave();}async abort(){}}
 class MemFile{constructor(n,b,m){this.kind='file';this.name=n;this.blob=b||new Blob([]);this.m=m||Date.now();}
  async getFile(){return new File([this.blob],this.name,{lastModified:this.m,type:mimeOf(this.name)});}
  async createWritable(){return new MemW(this);}}
 class MemDir{constructor(n){this.kind='directory';this.name=n;this.c=new Map();}
  async getDirectoryHandle(n,o={}){let e=this.c.get(n);if(!e){if(!o.create)throw err404(n);e=new MemDir(n);this.c.set(n,e);schedSave();}if(e.kind!=='directory')throw new Error(n+' 不是文件夹');return e;}
  async getFileHandle(n,o={}){let e=this.c.get(n);if(!e){if(!o.create)throw err404(n);e=new MemFile(n);this.c.set(n,e);schedSave();}if(e.kind!=='file')throw new Error(n+' 不是文件');return e;}
  async removeEntry(n,o={}){if(!this.c.has(n))throw err404(n);this.c.delete(n);schedSave();}
  async *entries(){for(const kv of this.c)yield kv;}}
 async function ser(d){const o={n:d.name,k:'d',c:[]};for(const[,v]of d.c){o.c.push(v.kind==='file'?{n:v.name,k:'f',b:v.blob,m:v.m}:await ser(v));}return o;}
 function des(o){if(o.k==='f')return new MemFile(o.n,o.b,o.m);const d=new MemDir(o.n);for(const c of o.c)d.c.set(c.n,des(c));return d;}

 function split(p){return String(p||'/').replace(/\/+/g,'/').split('/').filter(Boolean);}
 function res(path){const parts=split(path);
  if(parts[0]==='mnt'){
   if(parts.length>=3&&parts[1]==='local'){const m=mounts.get(parts[2]);if(!m)throw new Error('挂载点不可用: '+parts[2]+'（刷新后需重新挂载）');return{root:m,parts:parts.slice(3)};}
   throw new Error('虚拟挂载目录不可写');}
  return{root:ROOT,parts};}
 async function walk(root,parts,create=false){let d=root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d;}

 async function init(){
  try{ROOT=await navigator.storage.getDirectory();
   if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}
  catch(e){mem=true;
   try{const snap=await idb.get('memfs');ROOT=snap?des(snap):new MemDir('');}
   catch(_){ROOT=new MemDir('');}}
  document.cookie='lumen_last_boot='+Date.now()+';path=/;max-age=31536000';}

 async function exists(p){try{await stat(p);return true;}catch(e){return false;}}
 async function stat(path){const parts=split(path);
  if(!parts.length)return{kind:'directory',name:'/',size:0,mtime:0};
  if(parts[0]==='mnt'){
   if(parts.length===1||(parts.length===2&&parts[1]==='local'))return{kind:'directory',name:parts[parts.length-1],size:0,mtime:0};
   if(parts.length===3&&parts[1]==='local'){if(mounts.has(parts[2]))return{kind:'directory',name:parts[2],size:0,mtime:0,mounted:true};throw err404(parts[2]);}}
  const{root,parts:rp}=res(path);
  if(!rp.length)return{kind:'directory',name:baseOf(path),size:0,mtime:0};
  try{const d=await walk(root,rp.slice(0,-1));const fh=await d.getFileHandle(rp[rp.length-1]);const f=await fh.getFile();
   return{kind:'file',name:f.name,size:f.size,mtime:f.lastModified};}catch(e){}
  const d=await walk(root,rp);return{kind:'directory',name:rp[rp.length-1],size:0,mtime:0};}

 async function readdir(path){const parts=split(path);
  if(parts[0]==='mnt'){
   if(parts.length===1)return[{name:'local',kind:'directory',size:0,mtime:0}];
   if(parts.length===2&&parts[1]==='local')return[...mounts.keys()].map(n=>({name:n,kind:'directory',size:0,mtime:0,mounted:true}));}
  const{root,parts:rp}=res(path);const d=await walk(root,rp);const out=[];
  for await(const[name,h]of d.entries()){
   if(h.kind==='file'){let s=0,m=0;try{const f=await h.getFile();s=f.size;m=f.lastModified;}catch(e){}
    out.push({name,kind:'file',size:s,mtime:m});}
   else out.push({name,kind:'directory',size:0,mtime:0});}
  return out;}

 async function readBlob(path){const{root,parts}=res(path);if(!parts.length)throw new Error('不是文件');
  const d=await walk(root,parts.slice(0,-1));const fh=await d.getFileHandle(parts[parts.length-1]);return fh.getFile();}
 async function readText(path){return(await readBlob(path)).text();}
 async function writeFile(path,data){const{root,parts}=res(path);if(!parts.length)throw new Error('路径无效');
  const d=await walk(root,parts.slice(0,-1),true);const fh=await d.getFileHandle(parts[parts.length-1],{create:true});
  const w=await fh.createWritable();await w.write(data);await w.close();}
 async function mkdir(path){const{root,parts}=res(path);await walk(root,parts,true);}
 async function rm(path){const parts=split(path);
  if(parts[0]==='mnt'&&parts.length===3&&parts[1]==='local'){unmount(parts[2]);return;}
  const{root,parts:rp}=res(path);if(!rp.length)throw new Error('不能删除根目录');
  const d=await walk(root,rp.slice(0,-1));await d.removeEntry(rp[rp.length-1],{recursive:true});}

 async function copy(src,dst){const st=await stat(src);
  if(st.kind==='directory'){await mkdir(dst);const list=await readdir(src);
   for(const e of list)await copy(j(src,e.name),j(dst,e.name));}
  else await writeFile(dst,await readBlob(src));}
 async function move(src,dst){if(src===dst)return;if(dst.startsWith(src+'/'))throw new Error('不能移动到自身内部');
  await copy(src,dst);await rm(src);}
 async function uniqueName(dir,name){if(!await exists(j(dir,name)))return name;
  const m=name.match(/^(.*?)(\.[^.]+)?$/);
  for(let i=2;i<999;i++){const n=`${m[1]} (${i})${m[2]||''}`;if(!await exists(j(dir,n)))return n;}return name+'-'+Date.now();}
 async function usage(path){try{const st=await stat(path);if(st.kind==='file')return st.size;
  let t=0;const list=await readdir(path);for(const e of list)t+=await usage(j(path,e.name));return t;}catch(e){return 0;}}

 function mount(handle){let name=handle.name||'本地文件夹';let n=name,i=2;
  while(mounts.has(n))n=name+'-'+(i++);
  mounts.set(n,handle);
  store.set('mounts',[...new Set([...(store.get('mounts',[])),n])]);
  return '/mnt/local/'+n;}
 function unmount(name){mounts.delete(name);store.set('mounts',store.get('mounts',[]).filter(x=>x!==name));emitFS('/mnt/local');}

 return{init,exists,stat,readdir,readBlob,readText,writeFile,mkdir,rm,copy,move,uniqueName,usage,mount,unmount,mounts,
  get isMem(){return mem;}};
})();

    </div></div>
   <div class="win-body"></div>
   ${['n','s','e','w','ne','nw','se','sw'].map(d=>`<div class="rs rs-${d}" data-d="${d}"></div>`).join('')}`;
  desk.appendChild(w);
  const win={id,el:w,body:w.querySelector('.win-body'),opts:o,min:false,maxed:false,prev:null,
   setTitle(t){w.querySelector('.win-title').textContent=t;this.opts.title=t;syncTaskbar();},
   focus(){WM.focus(win);},
   close(){if(o.onClose&&o.onClose(win)===false)return;
    w.classList.add('closing');setTimeout(()=>w.remove(),180);WM.wins.delete(id);syncTaskbar();WM.focusTop();},
   minimize(){win.min=true;w.style.display='none';syncTaskbar();WM.focusTop();},
   restore(){win.min=false;w.style.display='';WM.focus(win);},
   maximize(){if(win.maxed){w.classList.remove('max');win.maxed=false;
     if(win.prev)w.style.cssText=win.prev+';z-index:'+w.style.zIndex;}
    else{win.prev=`left:${w.style.left};top:${w.style.top};width:${w.style.width};height:${w.style.height}`;
     w.classList.add('max');win.maxed=true;}},
  };
  this.wins.set(id,win);
  w.addEventListener('pointerdown',()=>WM.focus(win),true);
  w.querySelector('.wb.cls').onclick=e=>{e.stopPropagation();win.close();};
  w.querySelector('.wb.mn').onclick=e=>{e.stopPropagation();win.minimize();};
  w.querySelector('.wb.mx').onclick=e=>{e.stopPropagation();win.maximize();};
  /* 拖拽移动（Pointer Events，移动端同样可用） */
  const head=w.querySelector('.win-head');
  head.addEventListener('dblclick',e=>{if(!e.target.closest('.wb'))win.maximize();});
  head.addEventListener('pointerdown',e=>{
   if(e.target.closest('.wb')||win.maxed||isPhone())return;
   const sx=e.clientX,sy=e.clientY,ox=w.offsetLeft,oy=w.offsetTop;let moved=false;
   const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    w.style.left=Math.min(Math.max(ox+dx,-W+90),innerWidth-60)+'px';
    w.style.top=Math.max(0,Math.min(oy+dy,desk.clientHeight-36))+'px';};
   const upf=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upf);};
   addEventListener('pointermove',mv);addEventListener('pointerup',upf);e.preventDefault();});
  /* 八向调整大小 */
  w.querySelectorAll('.rs').forEach(h=>{
   h.addEventListener('pointerdown',e=>{
    if(win.maxed||isPhone())return;e.preventDefault();e.stopPropagation();WM.focus(win);
    const d=h.dataset.d,sx=e.clientX,sy=e.clientY;
    const r={x:w.offsetLeft,y:w.offsetTop,w:w.offsetWidth,h:w.offsetHeight};
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
     let nx=r.x,ny=r.y,nw=r.w,nh=r.h;
     if(d.includes('e'))nw=r.w+dx; if(d.includes('s'))nh=r.h+dy;

     if(nw>=320){w.style.width=nw+'px';w.style.left=nx+'px';}
     if(nh>=200){w.style.height=nh+'px';w.style.top=Math.max(0,ny)+'px';}};
    const upf=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upf);};
    addEventListener('pointermove',mv);addEventListener('pointerup',upf);});});

<script>
'use strict';
/* ════════════════════ 文件操作引擎 ════════════════════ */
const CLIP={mode:null,paths:[]};
function clipSet(mode,paths){CLIP.mode=mode;CLIP.paths=[...paths];
 toast(`已${mode==='copy'?'复制':'剪切'} ${paths.length} 项`,{type:'ok',time:1600});}
async function clipPaste(destDir){if(!CLIP.mode||!CLIP.paths.length)return;
 const mode=CLIP.mode,paths=[...CLIP.paths];if(mode==='cut'){CLIP.mode=null;CLIP.paths=[];}
 for(const p of paths){try{
  const name=await FS.uniqueName(destDir,baseOf(p));
  if(mode==='copy')await FS.copy(p,j(destDir,name));
  else await FS.move(p,j(destDir,name));
 }catch(e){toast('粘贴失败: '+e.message,{type:'err'});}}
 emitFS(destDir);toast('粘贴完成',{type:'ok',time:1500});}

async function fsRename(path){const old=baseOf(path);
 const nn=await dialog({title:'重命名',input:true,value:old,ok:'重命名'});
 if(!nn||nn===old)return;
 try{await FS.move(path,j(parentOf(path),nn));emitFS(parentOf(path));}
 catch(e){toast('重命名失败: '+e.message,{type:'err'});}}
async function fsDelete(paths){const ok=await dialog({title:'删除确认',danger:true,ok:'删除',
  message:paths.length===1?`确定删除「${baseOf(paths[0])}」吗？此操作不可恢复。`:`确定删除选中的 ${paths.length} 个项目吗？此操作不可恢复。`});
 if(!ok)return;
 for(const p of paths){try{await FS.rm(p);}catch(e){toast('删除失败: '+e.message,{type:'err'});}}
 emitFS(parentOf(paths[0]));}
async function fsNewFolder(dir){const n=await dialog({title:'新建文件夹',input:true,value:'新建文件夹',ok:'创建'});
 if(!n)return;try{await FS.mkdir(j(dir,await FS.uniqueName(dir,n)));emitFS(dir);}catch(e){toast(e.message,{type:'err'});}}
async function fsNewFile(dir){const n=await dialog({title:'新建文件',input:true,value:'新建文档.txt',ok:'创建'});
 if(!n)return;try{await FS.writeFile(j(dir,await FS.uniqueName(dir,n)),'');emitFS(dir);}catch(e){toast(e.message,{type:'err'});}}

/* ───── 导出（虚拟 → 物理桌面，含文件夹打包） ───── */
async function downloadPath(path){try{const st=await FS.stat(path);
 let blob,name=baseOf(path);
 if(st.kind==='directory'){
  if(typeof JSZip==='undefined'){toast('JSZip 未加载，无法打包文件夹',{type:'err'});return;}
  const zip=new JSZip();
  const add=async(p,zf)=>{for(const e of await FS.readdir(p)){
   if(e.kind==='directory')await add(j(p,e.name),zf.folder(e.name));
   else zf.file(e.name,await FS.readBlob(j(p,e.name)));}};
  await add(path,zip);blob=await zip.generateAsync({type:'blob'});name+='.zip';}
 else blob=await FS.readBlob(path);
 const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),8000);
 toast('已导出 '+name,{type:'ok',time:1800});}catch(e){toast('导出失败: '+e.message,{type:'err'});}}

/* ───── 导入（物理 → 虚拟，递归目录，readEntries 循环） ───── */
async function importEntries(items,destDir){let cnt=0;
 const entries=[];
 for(const it of items){if(it.kind!=='file')continue;
  const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();
  if(en)entries.push(en);else{const f=it.getAsFile();if(f)entries.push({_file:f});}}
 const readAll=dirReader=>new Promise((res,rej)=>{const acc=[];
  const loop=()=>dirReader.readEntries(es=>{if(!es.length)return res(acc);acc.push(...es);loop();},rej);loop();});
 const walk=async(entry,dir)=>{
  if(entry._file){const f=entry._file;const n=await FS.uniqueName(dir,f.name);
   await FS.writeFile(j(dir,n),await f.arrayBuffer());cnt++;return;}
  if(entry.isFile){const f=await new Promise((r,x)=>entry.file(r,x));
   const n=await FS.uniqueName(dir,f.name);
   await FS.writeFile(j(dir,n),await f.arrayBuffer());cnt++;}
  else if(entry.isDirectory){const n=await FS.uniqueName(dir,entry.name);const nd=j(dir,n);
   await FS.mkdir(nd);
   const es=await readAll(entry.createReader());
   for(const e of es)await walk(e,nd);}};
 for(const en of entries){try{await walk(en,destDir);}catch(e){toast('导入失败: '+e.message,{type:'err'});}}
 if(cnt||entries.length){emitFS(destDir);toast(`已导入 ${cnt} 个文件`,{type:'ok'});}}
async function importFileList(files,destDir){let cnt=0;
 for(const f of files){try{const n=await FS.uniqueName(destDir,f.name);
  await FS.writeFile(j(destDir,n),await f.arrayBuffer());cnt++;}catch(e){toast(e.message,{type:'err'});}}
 if(cnt){emitFS(destDir);toast(`已导入 ${cnt} 个文件`,{type:'ok'});}}
function pickUpload(destDir){const f=$('#fup');f.value='';
 f.onchange=()=>importFileList([...f.files],destDir);f.click();}

/* ───── 压缩包：zip / gz / tar / tar.gz / tgz / 7z(懒加载) ───── */
function untar(buf){const u=new Uint8Array(buf),td=new TextDecoder(),out=[];let o=0;
 while(o+512<=u.length){const blk=u.subarray(o,o+512);
  if(blk.every(b=>b===0))break;
  const name=td.decode(blk.subarray(0,100)).replace(/\0[\s\S]*$/,'');
  const size=parseInt((td.decode(blk.subarray(124,136)).replace(/\0[\s\S]*$/,'').trim()||'0'),8)||0;
  const type=String.fromCharCode(blk[156]);
  const pre=td.decode(blk.subarray(345,500)).replace(/\0[\s\S]*$/,'');
  const full=(pre?pre+'/':'')+name;o+=512;
  if(name&&!full.includes('..')){
   if(type==='5')out.push({name:full.replace(/\/$/,''),dir:true});
   else if(type==='0'||type==='\0'||type==='')out.push({name:full,data:u.slice(o,o+size)});}
  o+=Math.ceil(size/512)*512;}
 return out;}
async function gunzip(blob){return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();}
async function extract7z(blob,dest){
 const mod=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
 const seven=await mod.default({print:()=>{},printErr:()=>{}});
 seven.FS.mkdir('/in');seven.FS.mkdir('/out');
 seven.FS.writeFile('/in/a.arc',new Uint8Array(await blob.arrayBuffer()));
 seven.callMain(['x','/in/a.arc','-o/out','-y','-bso0']);
 const walk=async(p,v)=>{for(const n of seven.FS.readdir(p)){if(n==='.'||n==='..')continue;
  const fp=p+'/'+n,st=seven.FS.stat(fp);
  if(seven.FS.isDir(st.mode)){await FS.mkdir(j(v,n));await walk(fp,j(v,n));}
  else await FS.writeFile(j(v,n),new Blob([seven.FS.readFile(fp)]));}};
 await walk('/out',dest);}
async function extractArchive(path){const name=baseOf(path),dir=parentOf(path);
 const lower=name.toLowerCase();
 const stem=name.replace(/\.(tar\.gz|tgz|tar|zip|gz|7z|rar)$/i,'');
 const k=toast('正在解压 '+name+' …',{time:60000});
 try{const blob=await FS.readBlob(path);
  if(lower.endsWith('.zip')){
   if(typeof JSZip==='undefined')throw new Error('JSZip 未加载（离线？）');
   const dest=j(dir,await FS.uniqueName(dir,stem));await FS.mkdir(dest);
   const zip=await JSZip.loadAsync(blob);
   for(const[p,f]of Object.entries(zip.files)){if(p.includes('..'))continue;
    if(f.dir)await FS.mkdir(j(dest,p.replace(/\/$/,'')));
    else{const pp=p.split('/').slice(0,-1).join('/');
     if(pp)await FS.mkdir(j(dest,pp));
     await FS.writeFile(j(dest,p),await f.async('blob'));}}}
  else if(lower.endsWith('.tar.gz')||lower.endsWith('.tgz')){
   const dest=j(dir,await FS.uniqueName(dir,stem));await FS.mkdir(dest);
   const tb=await(await gunzip(blob)).arrayBuffer();
   for(const e of untar(tb)){if(e.dir)await FS.mkdir(j(dest,e.name));
    else{const pp=e.name.split('/').slice(0,-1).join('/');if(pp)await FS.mkdir(j(dest,pp));
     await FS.writeFile(j(dest,e.name),e.data);}}}
  else if(lower.endsWith('.tar')){
   const dest=j(dir,await FS.uniqueName(dir,stem));await FS.mkdir(dest);
   for(const e of untar(await blob.arrayBuffer())){if(e.dir)await FS.mkdir(j(dest,e.name));
    else{const pp=e.name.split('/').slice(0,-1).join('/');if(pp)await FS.mkdir(j(dest,pp));
     await FS.writeFile(j(dest,e.name),e.data);}}}
  else if(lower.endsWith('.gz')){
   const out=await gunzip(blob);
   await FS.writeFile(j(dir,await FS.uniqueName(dir,stem)),out);}
  else if(lower.endsWith('.7z')||lower.endsWith('.rar')){
   const dest=j(dir,await FS.uniqueName(dir,stem));await FS.mkdir(dest);
   await extract7z(blob,dest);}
  else throw new Error('不支持的压缩格式');
  k();toast('解压完成',{type:'ok'});emitFS(dir);}
 catch(e){k();toast('解压失败: '+e.message,{type:'err'});}}

/* ───── 拖出浏览器：预加载缓存（dragstart 必须同步） ───── */
const dragCache=new Map();
async function preloadDrag(path){if(dragCache.has(path))return;
 try{const st=await FS.stat(path);if(st.kind!=='file'||st.size>200*1048576)return;
  const blob=await FS.readBlob(path);
  const file=new File([blob],baseOf(path),{type:mimeOf(path)});
  dragCache.set(path,{file,url:URL.createObjectURL(file),mime:mimeOf(path)});}catch(e){}}
function applyDragOut(e,path){const c=dragCache.get(path);if(!c)return;
 try{e.dataTransfer.items.add(c.file);}catch(_){}
 try{e.dataTransfer.setData('DownloadURL',`${c.mime}:${baseOf(path)}:${c.url}`);}catch(_){}}
function scheduleDragCleanup(){setTimeout(()=>{dragCache.forEach(c=>URL.revokeObjectURL(c.url));dragCache.clear();},6000);}

/* ════════════════════ 打开调度（先 stat 判类型） ════════════════════ */
async function openPath(path,opt={}){
 let st;try{st=await FS.stat(path);}catch(e){toast('无法打开: '+e.message,{type:'err'});return;}
 if(st.kind==='directory'){
  if(opt.explorer){opt.explorer.nav(path);return;}
  APPS.files.launch(path);return;}
 openFile(path);}
function openFile(path){const name=baseOf(path),k=kindOf(name);
 switch(k){
  case 'image':APPS.viewer.launch(path);break;
  case 'audio':case 'video':APPS.media.launch(path);break;
  case 'pdf':APPS.pdfv.launch(path);break;
  case 'archive':
   menuCenter([{l:'解压到当前目录',i:'extract',fn:()=>extractArchive(path)},
    {l:'导出到本机',i:'download',fn:()=>downloadPath(path)}]);break;
  case 'html':APPS.code.launch(path);break;
  case 'code':case 'md':APPS.code.launch(path);break;
  case 'table':case 'text':APPS.notepad.launch(path);break;
  default:APPS.notepad.launch(path);}}
function menuCenter(items){menu(innerWidth/2-95,innerHeight/2-40,items);}
async function openHtmlInBrowser(path){try{const blob=await FS.readBlob(path);
 const url=URL.createObjectURL(new Blob([blob],{type:'text/html'}));
 APPS.browser.launch(url,baseOf(path));}catch(e){toast(e.message,{type:'err'});}}

function ctxItemsFor(path,kind,refresh){const items=[];
 const isHtml=kindOf(baseOf(path))==='html',isArc=kindOf(baseOf(path))==='archive';
 items.push({l:'打开',i:kind==='directory'?'folderOpen':'play',fn:()=>openPath(path)});
 if(isHtml){items.push({l:'在浏览器中打开',i:'globe',fn:()=>openHtmlInBrowser(path)});
  items.push({l:'编辑源代码',i:'code',fn:()=>APPS.code.launch(path)});}
 if(isArc)items.push({l:'解压到当前目录',i:'extract',fn:()=>extractArchive(path)});
 if(kind==='file'&&!isHtml)items.push({l:'用记事本打开',i:'pen',fn:()=>APPS.notepad.launch(path)});
 items.push({sep:1});
 items.push({l:'复制',i:'copy',fn:()=>clipSet('copy',[path])});
 items.push({l:'剪切',i:'cut',fn:()=>clipSet('cut',[path])});
 items.push({l:'重命名',i:'rename',fn:()=>fsRename(path)});
 items.push({l:'导出到本机',i:'download',fn:()=>downloadPath(path)});
 items.push({sep:1});
 items.push({l:'删除',i:'trash',fn:()=>fsDelete([path])});
 return items;}

/* ════════════════════ 桌面环境 ════════════════════ */
const Desktop={CW:94,CH:106,items:[],pos:store.get('pos',{}),sel:new Set(),
 cols(){return Math.max(1,Math.floor(($('#icons').clientWidth-16)/this.CW));},
 rows(){return Math.max(1,Math.floor(($('#icons').clientHeight-12)/this.CH));},
 savePos(){store.set('pos',this.pos);},
 async refresh(){
  const sys=[{key:'app:files',name:'文件管理',icon:'drawer',app:'files'},
   {key:'app:settings',name:'设置',icon:'sliders',app:'settings'}];
  let fsItems=[];
  try{fsItems=(await FS.readdir('/Desktop')).map(e=>({key:'fs:'+e.name,name:e.name,kind:e.kind,path:j('/Desktop',e.name)}));}
  catch(e){}
  fsItems.sort((a,b)=>(a.kind===b.kind?a.name.localeCompare(b.name,'zh'):a.kind==='directory'?-1:1));
  this.items=[...sys,...fsItems];
  this.render();},
 freeCell(occ){const R=this.rows(),C=this.cols();
  for(let c=0;c<C*3;c++)for(let r=0;r<R;r++){const k=c+','+r;if(!occ.has(k)){occ.add(k);return[c,r];}}
  return[0,0];},
 render(){const box=$('#icons');box.innerHTML='';
  const occ=new Set();
  this.items.forEach(it=>{const p=this.pos[it.key];if(p)occ.add(p[0]+','+p[1]);});
  this.items.forEach(it=>{
   let p=this.pos[it.key];
   if(!p){p=this.freeCell(occ);this.pos[it.key]=p;}
   const d=el('div','dicon'+(this.sel.has(it.key)?' sel':''));
   d.dataset.key=it.key;d.draggable=!isTouchDrag;
   const[ic,cls]=it.app?[it.icon,'ic-app']:iconFor(it.name,it.kind);
   d.innerHTML=`<div class="dic ${cls}">${I(ic,46)}</div><div class="dlabel">${esc(it.name)}</div>`;
   d.style.left=(10+p[0]*this.CW)+'px';d.style.top=(8+p[1]*this.CH)+'px';
   this.bindIcon(d,it);
   box.appendChild(d);});
  this.savePos();},
 itemBy(key){return this.items.find(x=>x.key===key);},
 open(it){if(it.app)APPS[it.app].launch();else openPath(it.path);},
 select(key,add){if(!add)this.sel.clear();
  if(add&&this.sel.has(key))this.sel.delete(key);else this.sel.add(key);
  document.querySelectorAll('.dicon').forEach(d=>d.classList.toggle('sel',this.sel.has(d.dataset.key)));},
 clearSel(){this.sel.clear();document.querySelectorAll('.dicon.sel').forEach(d=>d.classList.remove('sel'));},
 cellAt(x,y){const b=$('#icons').getBoundingClientRect();
  return[Math.max(0,Math.round((x-b.left-10-this.CW/2)/this.CW)),
   Math.max(0,Math.min(this.rows()-1,Math.round((y-b.top-8-this.CH/2)/this.CH)))];},
 moveKeysTo(keys,cell){const occ=new Set();
  Object.entries(this.pos).forEach(([k,p])=>{if(!keys.includes(k))occ.add(p[0]+','+p[1]);});
  let[c,r]=cell;
  keys.forEach(k=>{while(occ.has(c+','+r)){r++;if(r>=this.rows()){r=0;c++;}}
   this.pos[k]=[c,r];occ.add(c+','+r);r++;if(r>=this.rows()){r=0;c++;}});
  this.savePos();this.render();},
 arrange(){this.pos={};this.savePos();this.render();},

 bindIcon(d,it){
  /* 选择 + 单击打开（规范要求）*/
  d.addEventListener('click',e=>{e.stopPropagation();
   if(e.ctrlKey||e.metaKey||e.shiftKey){this.select(it.key,true);return;}
   if(d._dragged){d._dragged=false;return;}
   this.select(it.key,false);
   if(e.detail<=1&&!isTouchDrag)setTimeout(()=>this.open(it),10);});
  d.addEventListener('dblclick',e=>{e.stopPropagation();});
  /* 拖出浏览器预缓存（同步 dragstart 前异步预载）*/
  d.addEventListener('pointerenter',()=>{if(it.path&&it.kind==='file')preloadDrag(it.path);});
  d.addEventListener('pointerdown',e=>{if(it.path&&it.kind==='file')preloadDrag(it.path);
   if(!this.sel.has(it.key)&&!e.ctrlKey&&!e.metaKey)this.select(it.key,false);});
  /* HTML5 原生拖拽（鼠标）*/
  d.addEventListener('dragstart',e=>{d._dragged=true;
   const keys=this.sel.has(it.key)?[...this.sel]:[it.key];
   const paths=keys.map(k=>this.itemBy(k)).filter(x=>x&&x.path).map(x=>x.path);
   e.dataTransfer.effectAllowed='copyMove';
   e.dataTransfer.setData('application/x-lumen',JSON.stringify({src:'desktop',keys,paths}));
   e.dataTransfer.setData('text/plain',keys.map(k=>(this.itemBy(k)||{}).name).join('\n'));
   if(paths.length===1&&it.kind==='file')applyDragOut(e,paths[0]);});
  d.addEventListener('dragend',()=>{scheduleDragCleanup();setTimeout(()=>d._dragged=false,80);});
  /* 文件夹作为放置目标 */
  if(it.kind==='directory'){
   d.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();d.classList.add('dropt');});
   d.addEventListener('dragleave',()=>d.classList.remove('dropt'));
   d.addEventListener('drop',async e=>{e.preventDefault();e.stopPropagation();d.classList.remove('dropt');
    const raw=e.dataTransfer.getData('application/x-lumen');
    if(raw){const o=JSON.parse(raw);
     for(const p of o.paths||[]){if(p===it.path||it.path.startsWith(p+'/'))continue;
      try{await FS.move(p,j(it.path,await FS.uniqueName(it.path,baseOf(p))));}catch(err){toast(err.message,{type:'err'});}}
     emitFS('/Desktop');emitFS(it.path);}
    else if(e.dataTransfer.items.length)await importEntries([...e.dataTransfer.items],it.path);});}
  /* 右键菜单 */
  d.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
   if(!this.sel.has(it.key))this.select(it.key,false);
   if(it.app){menu(e.clientX,e.clientY,[{l:'打开',i:'play',fn:()=>APPS[it.app].launch()}]);return;}
   const multi=this.sel.size>1;
   const paths=[...this.sel].map(k=>this.itemBy(k)).filter(x=>x&&x.path).map(x=>x.path);
   if(multi)menu(e.clientX,e.clientY,[
    {l:`复制 ${paths.length} 项`,i:'copy',fn:()=>clipSet('copy',paths)},
    {l:`剪切 ${paths.length} 项`,i:'cut',fn:()=>clipSet('cut',paths)},
    {sep:1},{l:`删除 ${paths.length} 项`,i:'trash',fn:()=>fsDelete(paths)}]);
   else menu(e.clientX,e.clientY,ctxItemsFor(it.path,it.kind||'file'));});
  /* 触摸拖拽（pointer，原生 DnD 触摸不可用） */
  d.addEventListener('touchstart',()=>{},{passive:true});
  d.addEventListener('pointerdown',e=>{
   if(e.pointerType!=='touch')return;
   const sx=e.clientX,sy=e.clientY,t0=Date.now();let drag=false;
   const ox=d.offsetLeft,oy=d.offsetTop;
   const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!drag&&Math.hypot(dx,dy)>14){drag=true;d.classList.add('noanim','dragging');}
    if(drag){ev.preventDefault();d.style.left=(ox+dx)+'px';d.style.top=(oy+dy)+'px';}};
   const upf=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upf);
    if(drag){d.classList.remove('noanim','dragging');
     d.style.visibility='hidden';
     const tgt=document.elementFromPoint(ev.clientX,ev.clientY);
     d.style.visibility='';
     const fd=tgt&&tgt.closest('.dicon');
     const fit=fd&&this.itemBy(fd.dataset.key);
     if(fit&&fit.kind==='directory'&&it.path&&fit.path!==it.path){
      FS.move(it.path,j(fit.path,baseOf(it.path))).then(()=>{emitFS('/Desktop');}).catch(err=>{toast(err.message,{type:'err'});this.render();});}
     else this.moveKeysTo([it.key],this.cellAt(ev.clientX,ev.clientY));}
    else if(Date.now()-t0<450){this.select(it.key,false);this.open(it);}};
   addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',upf);});},

 init(){const box=$('#icons');
  /* 桌面放置：内部移动 / 外部导入 */
  box.addEventListener('dragover',e=>{e.preventDefault();
   e.dataTransfer.dropEffect=e.dataTransfer.types.includes('application/x-lumen')?'move':'copy';});
  box.addEventListener('drop',async e=>{e.preventDefault();
   const raw=e.dataTransfer.getData('application/x-lumen');
   if(raw){const o=JSON.parse(raw);
    if(o.src==='desktop'){this.moveKeysTo(o.keys,this.cellAt(e.clientX,e.clientY));return;}
    /* 来自资源管理器 → 移到桌面 */
    for(const p of o.paths||[]){if(parentOf(p)==='/Desktop')continue;
     try{await FS.move(p,j('/Desktop',await FS.uniqueName('/Desktop',baseOf(p))));}catch(err){toast(err.message,{type:'err'});}}
    emitFS('/Desktop');return;}
   if(e.dataTransfer.items&&e.dataTransfer.items.length)
    await importEntries([...e.dataTransfer.items],'/Desktop');});
  /* 空白点击清除选择 / 框选 */
  box.addEventListener('pointerdown',e=>{
   if(e.target!==box||e.button!==0)return;
   this.clearSel();
   if(e.pointerType==='touch')return;
   const sx=e.clientX,sy=e.clientY;let mq=null;
   const mv=ev=>{if(!mq){mq=el('div');mq.id='marq';box.appendChild(mq);}
    const x=Math.min(sx,ev.clientX),y=Math.min(sy,ev.clientY),
     w=Math.abs(ev.clientX-sx),h=Math.abs(ev.clientY-sy);
    const b=box.getBoundingClientRect();
    mq.style.cssText=`left:${x-b.left}px;top:${y-b.top}px;width:${w}px;height:${h}px`;
    this.sel.clear();
    document.querySelectorAll('.dicon').forEach(d=>{const r=d.getBoundingClientRect();
     const hit=r.left<x+w&&r.right>x&&r.top<y+h&&r.bottom>y;
     d.classList.toggle('sel',hit);if(hit)this.sel.add(d.dataset.key);});};
   const upf=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upf);if(mq)mq.remove();};
   addEventListener('pointermove',mv);addEventListener('pointerup',upf);});
  /* 桌面右键 */
  $('#desktop').addEventListener('contextmenu',e=>{
   if(e.target.closest('.window')||e.target.closest('.dicon'))return;
   e.preventDefault();
   menu(e.clientX,e.clientY,[
    {l:'刷新',i:'refresh',fn:()=>this.refresh()},
    {l:'整理图标',i:'grid',fn:()=>this.arrange()},
    {sep:1},
    {l:'新建文件夹',i:'folderPlus',fn:()=>fsNewFolder('/Desktop')},
    {l:'新建文本文件',i:'filePlus',fn:()=>fsNewFile('/Desktop')},
    {l:'上传文件到桌面',i:'upload',fn:()=>pickUpload('/Desktop')},
    {l:'粘贴',i:'paste',dis:!CLIP.mode,fn:()=>clipPaste('/Desktop')},
    {sep:1},
    {l:'更换壁纸',i:'image',fn:()=>APPS.settings.launch('wallpaper')},
    {l:document.fullscreenElement?'退出全屏':'进入全屏',i:'expand',fn:()=>{
      document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}},
   ]);});
  bus.addEventListener('fs',e=>{const p=e.detail.path;
   if(p==='/Desktop'||p.startsWith('/Desktop'))this.refresh();});
  /* 键盘 */
  addEventListener('keydown',e=>{
   if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.closest('.CodeMirror'))return;
   if(WM.cur&&!WM.cur.min&&WM.cur.el.contains(document.activeElement))return;
   const paths=[...this.sel].map(k=>this.itemBy(k)).filter(x=>x&&x.path).map(x=>x.path);
   if(e.key==='Delete'&&paths.length)fsDelete(paths);
   if(e.key==='F2'&&paths.length===1)fsRename(paths[0]);
   if((e.ctrlKey||e.metaKey)&&e.key==='c'&&paths.length)clipSet('copy',paths);
   if((e.ctrlKey||e.metaKey)&&e.key==='x'&&paths.length)clipSet('cut',paths);
   if((e.ctrlKey||e.metaKey)&&e.key==='v'&&CLIP.mode)clipPaste('/Desktop');
   if((e.ctrlKey||e.metaKey)&&e.key==='a'){e.preventDefault();
    this.items.forEach(it=>this.sel.add(it.key));
    document.querySelectorAll('.dicon').forEach(d=>d.classList.add('sel'));}});
  addEventListener('resize',debounce(()=>this.render(),300));},
};
const isTouchDrag=matchMedia('(pointer:coarse)').matches&&!matchMedia('(pointer:fine)').matches;

function buildExplorer(body,win,startPath){
 const S={path:startPath,hist:[startPath],hi:0,sort:{key:'name',dir:1},sel:new Set(),q:'',entries:[]};
 body.innerHTML=`<div class="ex">

 const q=s=>body.querySelector(s);
 const list=q('.ex-list');

 const explorer={nav};
 function pathSel(){return[...S.sel];}
 async function nav(p,push=true){S.path=p;S.sel.clear();S.q='';q('.ex-search').value='';
  if(push){S.hist=S.hist.slice(0,S.hi+1);S.hist.push(p);S.hi=S.hist.length-1;}

 async function render(){

     for(const sp of o.paths||[]){try{await FS.move(sp,j(p,await FS.uniqueName(p,baseOf(sp))));}catch(err){toast(err.message,{type:'err'});}}
     emitFS(p);emitFS(S.path);}
    else if(e.dataTransfer.items.length)await importEntries([...e.dataTransfer.items],p);});

  [...FS.mounts.keys()].forEach(n=>{const p='/mnt/local/'+n;

  let acc='';parts.forEach((p,i)=>{acc+='/'+p;const pp=acc;

  /* 内容 */
  let entries=[];
  try{
   if(S.q){entries=await searchFS(S.path,S.q.toLowerCase());}

  }catch(e){list.innerHTML=`<div class="ex-empty">${I('warn',40)}<br>${esc(e.message)}</div>`;return;}
  const{key,dir}=S.sort;
  entries.sort((a,b)=>{if(a.kind!==b.kind)return a.kind==='directory'?-1:1;
   let v=0;
   if(key==='name')v=a.name.localeCompare(b.name,'zh');
   else if(key==='size')v=(a.size||0)-(b.size||0);
   else if(key==='mtime')v=(a.mtime||0)-(b.mtime||0);

 function typeName(en){if(en.kind==='directory')return '文件夹';
  const e=extOf(en.name);if(!e)return '文件';
  const k=kindOf(en.name);

  return (names[k]?names[k]+' ':'')+'.'+e;}
 async function searchFS(root,qq,depth=0,acc=[]){if(depth>6||acc.length>400)return acc;
  let es;try{es=await FS.readdir(root);}catch(e){return acc;}
  for(const e of es){const p=j(root,e.name);
   if(e.name.toLowerCase().includes(qq))acc.push({...e,path:p});
   if(e.kind==='directory'&&acc.length<400)await searchFS(p,qq,depth+1,acc);}
  return acc;}

  else if(e.dataTransfer.items&&e.dataTransfer.items.length)

 const onFs=e=>{const p=e.detail.path;if(p===S.path||p==='/mnt/local'||parentOf(p)===S.path)render();};
 bus.addEventListener('fs',onFs);
 win.opts.onClose=()=>{bus.removeEventListener('fs',onFs);};

async function mountLocal(){
 if(!window.showDirectoryPicker){toast('当前浏览器不支持 File System Access API（需 Chrome/Edge）',{type:'err'});return;}
 try{const h=await showDirectoryPicker({mode:'readwrite'});
  if((await h.queryPermission({mode:'readwrite'}))!=='granted')

function parseDSV(text,sep){const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;
  else if(c===sep){row.push(cur);cur='';}
  else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
  else if(c!=='\r')cur+=c;}
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows;}

   const save=async(as)=>{let target=cur;

registerApp('calc',{name:'计算器',icon:'calc',
 launch(){WM.open({app:'calc',title:'计算器',icon:'calc',w:320,h:470,
  content:body=>{
   body.innerHTML=`<div class="calc"><div class="calc-disp"><div class="calc-expr"></div><div class="calc-res">0</div></div>
    <div class="calc-grid"></div></div>`;
   const exprEl=body.querySelector('.calc-expr'),resEl=body.querySelector('.calc-res');
   const grid=body.querySelector('.calc-grid');
   let expr='';
   const keys=[['C','fn'],['(','fn'],[')','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],
    ['%','fn'],['0',''],['.',''],['=','eq']];
   const calc=()=>{const s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
    if(!s)return 0;if(!/^[0-9+\-*/(). ]+$/.test(s))throw new Error('表达式无效');
    const v=Function('"use strict";return('+s+')')();
    if(!isFinite(v))throw new Error('∞');return Math.round(v*1e10)/1e10;};
   const upd=()=>{exprEl.textContent=expr;
    try{resEl.textContent=expr?calc():'0';resEl.style.color='';}
    catch(e){resEl.textContent='…';}};
   const press=k=>{
    if(k==='C'){expr='';}
    else if(k==='='){try{expr=String(calc());}catch(e){resEl.textContent='错误';resEl.style.color='var(--red)';return;}}
    else expr+=k;upd();};
   keys.forEach(([k,cls])=>{const b=el('button','cbtn '+cls,esc(k));b.onclick=()=>press(k);grid.appendChild(b);});
   body.tabIndex=0;body.style.outline='none';
   body.addEventListener('keydown',e=>{const m={'*':'×','/':'÷','-':'−','Enter':'=','Escape':'C','Backspace':null};
    if(e.key==='Backspace'){expr=expr.slice(0,-1);upd();return;}
    if(/^[0-9+().%]$/.test(e.key))press(e.key);
    else if(m[e.key])press(m[e.key]);});
   body.focus();}});}});

    </div><div class="pt-cv"><canvas></canvas></div></div>`;
   const cv=body.querySelector('canvas'),box=body.querySelector('.pt-cv');
   const ctx=cv.getContext('2d');
   let color=colors[0],size=5,eraser=false,drawing=false,last=null;
   function fit(){const img=ctx.getImageData(0,0,cv.width||1,cv.height||1);
    cv.width=box.clientWidth;cv.height=box.clientHeight;
    ctx.putImageData(img,0,0);ctx.lineCap='round';ctx.lineJoin='round';}
   setTimeout(fit,50);
   const ro=new ResizeObserver(debounce(fit,200));ro.observe(box);
   win.opts.onClose=()=>ro.disconnect();
   cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);
    last=[e.offsetX,e.offsetY];draw(e);});
   cv.addEventListener('pointermove',draw);
   cv.addEventListener('pointerup',()=>{drawing=false;last=null;});
   function draw(e){if(!drawing)return;
    ctx.globalCompositeOperation=eraser?'destination-out':'source-over';
    ctx.strokeStyle=color;ctx.lineWidth=eraser?size*2.5:size;
    ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();
    last=[e.offsetX,e.offsetY];}
   body.querySelectorAll('.pt-sw').forEach(s=>s.onclick=()=>{

   body.querySelector('._er').onclick=e=>{eraser=!eraser;e.currentTarget.classList.toggle('on',eraser);};
   body.querySelector('._cl').onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
   body.querySelector('._sv').onclick=()=>cv.toBlob(async b=>{
    const p=new Date(),pad=n=>String(n).padStart(2,'0');

     toast('已保存到 /Pictures/'+name,{type:'ok',action:{label:'查看',fn:()=>APPS.viewer.launch(j('/Pictures',name))}});}
    catch(e){toast(e.message,{type:'err'});}},'image/png');}});}});

      t.style.backgroundImage=`url("${w.css()}")`;t.innerHTML=`<span>${esc(w.name)}</span>`;
      t.onclick=()=>{store.set('wp',w.id);applyWallpaper();renderPage();};g.appendChild(t);});
     if(await FS.exists('/System/wallpaper.bin')){
      const t=el('div','wp-th'+(curWp==='custom'?' on':''));
      try{t.style.backgroundImage=`url("${URL.createObjectURL(await FS.readBlob('/System/wallpaper.bin'))}")`;}catch(e){}
      t.innerHTML='<span>自定义</span>';
      t.onclick=()=>{store.set('wp','custom');applyWallpaper();renderPage();};g.appendChild(t);}
     pg.querySelector('._up').onclick=()=>{const f=$('#fwp');f.value='';
      f.onchange=async()=>{if(!f.files[0])return;
       try{await FS.mkdir('/System');await FS.writeFile('/System/wallpaper.bin',f.files[0]);
        store.set('wp','custom');applyWallpaper();renderPage();toast('壁纸已更新',{type:'ok'});}
       catch(e){toast(e.message,{type:'err'});}};f.click();};}
    else if(cur==='storage'){
     pg.innerHTML=`<h2>存储</h2>
      <h4>浏览器配额（navigator.storage.estimate）</h4>
      <div class="sbar"><i style="background:var(--acc);width:0%" class="_used"></i></div>
      <div style="clear:both"><span class="skey"><b style="background:var(--acc)"></b><span class="_ut">已用 …</span></span>
      <span class="skey"><b style="background:var(--line)"></b><span class="_qt">配额 …</span></span></div>
      <h4 style="clear:both;padding-top:8px">各目录占用（OPFS 实际数据）</h4>
      <div class="_rows"><p class="note">正在分析…</p></div>
      <h4>文件系统状态</h4>
      <p class="note">${FS.isMem?'⚠ OPFS 不可用，当前运行于内存 + IndexedDB 快照降级模式。数据通过 IndexedDB 尽力持久化。':'OPFS（Origin Private File System）持久化运行中。元数据另存于 localStorage / IndexedDB / Cookie。'}</p>
      <h4>危险区</h4><p class="note">一键重置将清空 OPFS 中的全部文件、IndexedDB 与本地设置，恢复出厂状态。</p>
      <button class="btn dgr _rst">${I('warn',14)} 一键重置系统</button>`;
     try{const est=await navigator.storage.estimate();
      const u=est.usage||0,qt=est.quota||1;
      pg.querySelector('._used').style.width=Math.max(.5,u/qt*100)+'%';
      pg.querySelector('._ut').textContent='已用 '+fmtSize(u)+'（'+(u/qt*100).toFixed(2)+'%）';
      pg.querySelector('._qt').textContent='配额 '+fmtSize(qt);}catch(e){}
     (async()=>{const rows=pg.querySelector('._rows');
      let tops=[];try{tops=await FS.readdir('/');}catch(e){}
      const data=[];let max=1;
      for(const t of tops){if(t.kind!=='directory')continue;
       const u=await FS.usage('/'+t.name);data.push([t.name,u]);max=Math.max(max,u);}
      data.sort((a,b)=>b[1]-a[1]);
      rows.innerHTML=data.length?'':'<p class="note">（空）</p>';
      data.forEach(([n,u],i)=>{const r=el('div','urow');
       r.innerHTML=`<span class="un">/${esc(n)}</span><span class="ub"><i style="width:${(u/max*100).toFixed(1)}%;background:${['#ffb454','#59c2ff','#aad94c','#d2a6ff','#f07178'][i%5]}"></i></span><span class="uv">${fmtSize(u)}</span>`;
       rows.appendChild(r);});})();
     pg.querySelector('._rst').onclick=async()=>{
      const ok=await dialog({title:'重置系统',danger:true,ok:'确认重置',
       message:'将删除 OPFS 中所有文件并清除全部设置，此操作不可恢复！'});
      if(!ok)return;
      try{const list=await FS.readdir('/');
       for(const e of list){try{await FS.rm('/'+e.name);}catch(_){}}
       localStorage.clear();
       await new Promise(r=>{const rq=indexedDB.deleteDatabase('lumen-os');rq.onsuccess=rq.onerror=rq.onblocked=r;});
      }catch(e){}
      location.reload();};}
    else if(cur==='mounts'){
     pg.innerHTML=`<h2>本地文件夹挂载</h2>
      <p class="note">通过 File System Access API 将本机真实文件夹挂载到 /mnt/local/，与虚拟文件共用同一套 fs API，支持全部文件操作。浏览器安全策略要求刷新后重新授权挂载。</p>
      <button class="btn pri _mt">${I('drive',14)} 挂载新文件夹</button><h4>已挂载</h4><div class="_list"></div>`;
     const lst=pg.querySelector('._list');
     const ms=[...FS.mounts.keys()];
     lst.innerHTML=ms.length?'':'<p class="note">暂无挂载。</p>';
     ms.forEach(n=>{const r=el('div','mt-row');
      r.innerHTML=`${I('drive',17)}<span class="mn">/mnt/local/${esc(n)}</span>
       <button class="tbtn _o">${I('folderOpen',14)}<span>打开</span></button>
       <button class="tbtn _u">${I('eject',14)}<span>卸载</span></button>`;
      r.querySelector('._o').onclick=()=>APPS.files.launch('/mnt/local/'+n);
      r.querySelector('._u').onclick=()=>{FS.unmount(n);renderPage();};
      lst.appendChild(r);});
     const prev=store.get('mounts',[]).filter(n=>!FS.mounts.has(n));
     if(prev.length)lst.appendChild(el('p','note','上次会话曾挂载：'+prev.map(esc).join('、')+'。请点击上方按钮重新挂载授权。'));
     pg.querySelector('._mt').onclick=async()=>{await mountLocal();renderPage();};}
    else{pg.innerHTML=`<h2>关于 LUMEN OS</h2>
      <div style="display:flex;align-items:center;gap:18px;margin:18px 0">
       <svg width="56" height="56" viewBox="0 0 64 64" fill="none"><rect x="17" y="17" width="30" height="30" transform="rotate(45 32 32)" stroke="#ffb454" stroke-width="2.5"/><rect x="25" y="25" width="14" height="14" transform="rotate(45 32 32)" fill="#ffb454"/></svg>
       <div><div style="font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.3em;color:var(--acc)">LUMEN OS</div>
       <div style="font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px">v1.0 · SINGLE-FILE WEB OPERATING SYSTEM</div></div></div>
      <p class="note">基于浏览器原生 OPFS 的单文件 Web 操作系统。零后端、全客户端运行。<br>
      窗口管理 · 虚拟文件系统 · 双向拖拽 · 本地文件夹挂载 · ZIP/TAR/GZ/7z 解压 · CodeMirror 代码编辑 · CSV 表格 · 全格式媒体预览。</p>
      <h4>运行环境</h4>
      <p class="note">OPFS：${FS.isMem?'不可用（已降级）':'可用'}<br>File System Access API：${window.showDirectoryPicker?'可用':'不可用'}<br>JSZip：${typeof JSZip!=='undefined'?'已加载':'离线'} · CodeMirror：${typeof CodeMirror!=='undefined'?'已加载':'离线'}</p>`;}
   }
   renderNav();renderPage();}});}});

/* ════════════════════ 开始菜单 / 启动 ════════════════════ */
function buildStartMenu(){
 const box=$('#sm-apps');box.innerHTML='';
 let i=0;
 for(const id in APPS){const a=APPS[id];if(a.hide)continue;
  const it=el('div','sm-app');it.style.animationDelay=(i++*0.035)+'s';
  it.innerHTML=`<span class="sa-ic">${I(a.icon,34)}</span><span>${esc(a.name)}</span>`;
  it.onclick=()=>{toggleStart(false);a.launch();};box.appendChild(it);}
 const ft=$('#sm-foot');ft.innerHTML='';
 const fsBtn=el('button',null,`${I('expand',14)}<span>全屏</span>`);
 fsBtn.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
 const mtBtn=el('button',null,`${I('drive',14)}<span>挂载文件夹</span>`);
 mtBtn.onclick=()=>{toggleStart(false);mountLocal();};
 const pwBtn=el('button',null,`${I('power',14)}<span>重启</span>`);
 pwBtn.onclick=()=>location.reload();
 ft.append(fsBtn,mtBtn,pwBtn);}

async function scaffold(){
 if(await FS.exists('/System/.init'))return;
 const dirs=['/Desktop','/Documents','/Pictures','/Music','/Downloads','/System'];
 for(const d of dirs)await FS.mkdir(d);
 await FS.writeFile('/Desktop/欢迎使用.md',
`# 欢迎来到 LUMEN OS

一个完全运行在浏览器中的 **单文件 Web 操作系统**。

## 你可以尝试

- 把本机文件直接 **拖进桌面** —— 它们会写入 OPFS 持久化存储

- 双击 \`示例页面.html\`，体验代码编辑 + 实时预览 + 浏览器打开
- 打开 **文件管理**，点击列头按 *修改日期 / 类型 / 大小* 排序
- 在设置中 **挂载本机真实文件夹** 到 /mnt/local/
- 上传 .zip / .tar.gz / .7z 后右键解压

> 所有数据保存在浏览器 OPFS 中，刷新页面不会丢失。`);
 await FS.writeFile('/Desktop/示例页面.html',

 await FS.writeFile('/Documents/便签.txt','LUMEN OS 便签\n================\n- 记事本 Ctrl+S 直接保存回 OPFS\n- CSV 文件可切换 表格/文本 双视图\n- 桌面图标可自由拖放排列，位置会被记住\n');

async function boot(){
 const t0=Date.now();
 try{await FS.init();}catch(e){}
 $('#boot-msg').textContent=FS.isMem?'OPFS UNAVAILABLE — FALLBACK MODE':'MOUNTING VIRTUAL FILE SYSTEM';
 try{await scaffold();}catch(e){console.warn('scaffold',e);}
 await applyWallpaper();
 Desktop.init();
 await Desktop.refresh();
 buildStartMenu();
 const wait=Math.max(0,1100-(Date.now()-t0));
 setTimeout(()=>{$('#boot').classList.add('off');
  if(FS.isMem)toast('OPFS 不可用，已降级为内存 + IndexedDB 模式',{type:'err',time:6000});
  const prev=store.get('mounts',[]);
  if(prev.length)toast('上次挂载的本地文件夹需重新授权：'+prev.join('、'),
   {time:8000,action:{label:'去挂载',fn:()=>APPS.settings.launch('mounts')}});
 },wait);}
boot();
</script>
