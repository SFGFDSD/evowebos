<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0a">
<meta name="color-scheme" content="dark light">
<title>拓印 · TàYìn 桌面系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-num:"Instrument Serif","Noto Serif SC",serif;
  --f-brush:"Ma Shan Zheng","Noto Serif SC",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --bg:#0d0c0a;--bg2:#141210;--pn:#1b1915;--pn2:#23201a;--pn3:#2d2922;
  --tx:#ece3cf;--tx2:rgba(236,227,207,.68);--tx3:rgba(236,227,207,.44);
  --ln:rgba(236,227,207,.10);--ln2:rgba(236,227,207,.20);
  --acc:#d9432e;--acc-rgb:217,67,46;--acc-ink:#fff4ec;
  --ok:#8fb89a;--warn:#d9a24a;--err:#e86b55;
  --win-r:10px;--glass:rgba(27,25,21,.80);--glass-blur:22px;
  --shadow:0 34px 90px -24px rgba(0,0,0,.78),0 0 0 1px rgba(236,227,207,.06);
  --wp1:#1e1915;--wp2:#0c0b09;--wp3:#1a2320;
  --tb-h:52px;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#e8e0cb;--bg2:#efe8d6;--pn:#f7f2e5;--pn2:#eee7d4;--pn3:#e2d9c3;
  --tx:#211c15;--tx2:rgba(33,28,21,.72);--tx3:rgba(33,28,21,.46);
  --ln:rgba(33,28,21,.12);--ln2:rgba(33,28,21,.22);
  --ok:#3f7a52;--warn:#a86f1c;--err:#b23f2b;
  --glass:rgba(247,242,229,.86);
  --shadow:0 30px 70px -26px rgba(70,46,14,.40),0 0 0 1px rgba(33,28,21,.08);
  --wp1:#f1e9d4;--wp2:#d9cdb2;--wp3:#e6dec9;
  color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f-sans);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.ic{width:18px;height:18px;flex:none;display:block}
.hidden{display:none !important}
::selection{background:rgba(var(--acc-rgb),.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
#os{position:fixed;inset:0;overflow:hidden;isolation:isolate}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes startIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes winIn{from{opacity:0;transform:scale(.955) translateY(10px)}to{opacity:1;transform:none}}
@keyframes iconIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}

/* 壁纸 */
#wall{position:absolute;inset:0;z-index:0;background:radial-gradient(120% 90% at 78% 8%,rgba(var(--acc-rgb),.20),transparent 58%),radial-gradient(90% 70% at 6% 96%,rgba(127,170,140,.12),transparent 60%),linear-gradient(176deg,var(--wp1) 0%,var(--wp2) 100%);transition:background-color .8s var(--ease-out)}
#wall.custom{background-size:cover;background-position:center;background-repeat:no-repeat}
#wall.w-seal{background:radial-gradient(circle at 72% 38%,rgba(var(--acc-rgb),.42) 0 8%,transparent 8.6%),repeating-radial-gradient(circle at 72% 38%,transparent 0 58px,rgba(236,227,207,.055) 58px 59px),linear-gradient(180deg,var(--wp1),var(--wp2))}
#wall.w-stele{background:linear-gradient(90deg,rgba(236,227,207,.035) 1px,transparent 1px) 0 0/112px 112px,linear-gradient(rgba(236,227,207,.035) 1px,transparent 1px) 0 0/112px 112px,radial-gradient(70% 60% at 50% 40%,rgba(236,227,207,.07),transparent 70%),linear-gradient(180deg,var(--wp1),var(--wp2))}
#wall.w-contour{background:repeating-radial-gradient(ellipse 120% 90% at 30% 115%,transparent 0 38px,rgba(236,227,207,.06) 38px 39px),linear-gradient(170deg,var(--wp3),var(--wp2))}
#wall.w-dusk{background:radial-gradient(60% 42% at 50% 104%,rgba(var(--acc-rgb),.5),transparent 72%),linear-gradient(180deg,#2b1913 0%,#120f0c 52%,#0e1916 100%)}
#wall.w-jade{background:radial-gradient(70% 55% at 20% 20%,rgba(143,184,154,.22),transparent 70%),radial-gradient(60% 60% at 90% 90%,rgba(217,162,74,.12),transparent 70%),linear-gradient(160deg,#101a16,#0a0f0d)}
#wall.w-ink{background:linear-gradient(90deg,transparent 0 62%,rgba(236,227,207,.05) 62% 62.3%,transparent 62.3%),radial-gradient(120% 80% at 10% 0%,rgba(236,227,207,.06),transparent 60%),linear-gradient(180deg,#131210,#080807)}
:root[data-theme=light] #wall.w-jade{background:radial-gradient(70% 55% at 20% 20%,rgba(63,122,82,.16),transparent 70%),linear-gradient(160deg,#ebe6d2,#d6cfb6)}
#wall::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .4 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* 桌面 */
.desk{position:absolute;left:0;right:0;top:0;bottom:var(--tb-h);z-index:1;overflow:hidden}
.dicon{position:absolute;left:0;top:0;width:var(--cw,94px);height:var(--ch,104px);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:14px;transition:transform .46s var(--ease-out),background .18s,box-shadow .18s;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default;animation:iconIn .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 36ms)}
.dicon:hover{background:rgba(236,227,207,.07)}
.dicon.sel{background:rgba(var(--acc-rgb),.20);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.5)}
.dicon.dragging{opacity:.45}
.dicon.drop-hi{background:rgba(var(--acc-rgb),.28);box-shadow:inset 0 0 0 1.5px var(--acc)}
.dicon-ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(150deg,var(--pn3),var(--pn2));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 26px -14px rgba(0,0,0,.7);color:var(--tx);overflow:hidden;flex:none;position:relative}
.dicon-ico svg{width:26px;height:26px}
.dicon-ico img{width:100%;height:100%;object-fit:cover}
.dicon-ico.app{color:var(--acc-ink);background:linear-gradient(150deg,var(--acc),rgba(var(--acc-rgb),.7))}
.dicon-ico .badge{position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dicon-lb{font-size:12px;line-height:1.3;text-align:center;max-width:100%;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.75)}
:root[data-theme=light] .dicon-lb{text-shadow:0 1px 2px rgba(255,255,255,.6)}
.drop-ghost{position:absolute;width:94px;height:104px;border:1.5px dashed rgba(var(--acc-rgb),.8);border-radius:14px;pointer-events:none;display:none;z-index:0;transition:transform .2s var(--ease-out)}
.desk-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:var(--tx3);pointer-events:none;letter-spacing:.06em;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* 窗口 */
.wins{position:absolute;left:0;right:0;top:0;bottom:var(--tb-h);z-index:2;pointer-events:none}
.win{position:absolute;left:0;top:0;display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:var(--win-r);background:var(--pn);border:1px solid var(--ln2);box-shadow:var(--shadow);overflow:hidden;pointer-events:auto;transition:opacity .22s var(--ease),transform .3s var(--ease-out),visibility .22s,box-shadow .2s}
.win.anim{animation:winIn .36s var(--ease-out)}
.win.nt{transition:none}
.win:not(.active){box-shadow:0 14px 40px -20px rgba(0,0,0,.7),0 0 0 1px var(--ln)}
.win.min{opacity:0;visibility:hidden;transform:translateY(26px) scale(.94);pointer-events:none}
.win.max .rz{display:none}
.win.immersive{border:0;box-shadow:none}
.win.immersive .win-bar{display:none}
.win.immersive .rz{display:none}
.win.fake-full{position:fixed !important;inset:0 !important;width:auto !important;height:auto !important;border-radius:0 !important;z-index:9400 !important;transform:none !important;border:0}
.win.m-full{left:0 !important;top:0 !important;width:100% !important;height:100% !important;border-radius:0 !important;border:0}
.win.m-full .rz{display:none}
.win-bar{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--pn2);border-bottom:1px solid var(--ln);user-select:none;-webkit-user-select:none;cursor:default;touch-action:none}
.win.active .win-bar{background:linear-gradient(90deg,rgba(var(--acc-rgb),.18),transparent 75%),var(--pn2)}
.win-ico{display:grid;place-items:center;color:var(--acc)}
.win-ico svg{width:15px;height:15px}
.win-title{flex:1;min-width:0;font-size:13px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.win-ctrl{display:flex;gap:2px}
.wc{width:32px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tx2)}
.wc svg{width:14px;height:14px}
.wc:hover{background:var(--ln);color:var(--tx)}
.wc.x:hover{background:var(--acc);color:var(--acc-ink)}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:6;touch-action:none}
.rz[data-d=n]{left:10px;right:10px;top:0;height:5px;cursor:ns-resize}
.rz[data-d=s]{left:10px;right:10px;bottom:0;height:5px;cursor:ns-resize}
.rz[data-d=e]{top:10px;bottom:10px;right:0;width:5px;cursor:ew-resize}
.rz[data-d=w]{top:10px;bottom:10px;left:0;width:5px;cursor:ew-resize}
.rz[data-d=ne]{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.rz[data-d=nw]{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz[data-d=se]{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rz[data-d=sw]{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.snapper{position:absolute;display:none;border-radius:calc(var(--win-r) + 2px);background:rgba(var(--acc-rgb),.14);border:1.5px solid rgba(var(--acc-rgb),.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:8000;pointer-events:none;transition:left .18s var(--ease),top .18s var(--ease),width .18s var(--ease),height .18s var(--ease)}
.snapper.on{display:block}
#os.peeking .win{opacity:.07 !important;box-shadow:inset 0 0 0 1.5px rgba(var(--acc-rgb),.8) !important}
#os.peeking .win.min{opacity:0 !important}

/* 任务栏 */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);z-index:50;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(180deg,rgba(236,227,207,.035),transparent 60%),var(--glass);backdrop-filter:blur(var(--glass-blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.3);border-top:1px solid var(--ln)}
.tb-start{height:40px;display:flex;align-items:center;gap:9px;padding:0 12px 0 6px;border-radius:11px;color:var(--tx);flex:none}
.tb-start:hover,.tb-start.on{background:var(--ln)}
.seal-logo{width:30px;height:30px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-family:var(--f-brush);font-size:19px;line-height:1;border-radius:6px 10px 6px 10px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12),0 6px 16px -8px rgba(var(--acc-rgb),.9);transform:rotate(-4deg);flex:none}
.tb-start-t{font-family:var(--f-serif);font-weight:600;letter-spacing:.14em;font-size:13px}
.tb-apps{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.tb-apps::-webkit-scrollbar{display:none}
.tb-app{position:relative;height:40px;min-width:40px;max-width:210px;padding:0 10px;border-radius:11px;display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12.5px;white-space:nowrap;flex:none}
.tb-app span{overflow:hidden;text-overflow:ellipsis;max-width:130px}
.tb-app:hover{background:var(--ln);color:var(--tx)}
.tb-app.on{color:var(--tx);background:rgba(var(--acc-rgb),.15)}
.tb-app::after{content:"";position:absolute;left:50%;bottom:3px;width:12px;height:2px;margin-left:-6px;border-radius:2px;background:var(--tx3);transition:width .3s var(--ease-out),background .2s}
.tb-app.on::after{background:var(--acc);width:22px;margin-left:-11px}
.tb-app.min::after{background:var(--tx3);width:6px;margin-left:-3px}
.tb-tray{display:flex;align-items:center;gap:4px;flex:none}
.tb-peek{width:9px;height:40px;border-left:1px solid var(--ln2);margin-left:4px;border-radius:0 4px 4px 0;transition:background .2s}
.tb-peek:hover{background:rgba(var(--acc-rgb),.28)}
.tb-clock{height:40px;padding:0 10px;border-radius:11px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.1;color:var(--tx);min-width:88px}
.tb-clock:hover{background:var(--ln)}
#clk-t{font-family:var(--f-num);font-size:17px;letter-spacing:.02em;white-space:nowrap}
#clk-d{font-size:11px;color:var(--tx2);font-family:var(--f-mono);white-space:nowrap}

/* 开始菜单 */
.start{position:absolute;left:12px;bottom:calc(var(--tb-h) + 10px);width:min(430px,calc(100vw - 24px));max-height:min(640px,calc(100% - var(--tb-h) - 30px));z-index:60;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(calc(var(--glass-blur) * 1.4)) saturate(1.3);-webkit-backdrop-filter:blur(calc(var(--glass-blur) * 1.4)) saturate(1.3);border:1px solid var(--ln2);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:startIn .38s var(--ease-out)}
.start-h{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
.start-title{font-family:var(--f-serif);font-size:22px;font-weight:700;letter-spacing:.08em;display:flex;align-items:baseline;gap:10px}
.start-title small{font-family:var(--f-num);font-style:italic;font-size:14px;color:var(--tx3);letter-spacing:.02em;font-weight:400}
.start-search{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--ln);color:var(--tx3)}
.start-search input{flex:1;background:none;border:0;outline:none;min-width:0;color:var(--tx)}
.start-sec{padding:6px 16px 2px;font-size:11px;letter-spacing:.16em;color:var(--tx3)}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 10px 10px}
.start-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:13px;font-size:12px;color:var(--tx2)}
.start-app:hover{background:var(--ln);color:var(--tx)}
.start-app .ico-box{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--pn3);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.start-app .ico-box svg{width:21px;height:21px}
.start-app:hover .ico-box{color:var(--acc)}
.start-recent{padding:0 8px 6px;display:flex;flex-direction:column;gap:1px;overflow:auto;min-height:0;max-height:200px}
.start-r{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-align:left;font-size:13px;color:var(--tx2)}
.start-r:hover{background:var(--ln);color:var(--tx)}
.start-r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.start-f{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--ln);background:rgba(0,0,0,.06)}
.start-f .grow{flex:1}

/* 日历 */
.cal{position:absolute;right:10px;bottom:calc(var(--tb-h) + 10px);width:330px;z-index:70;background:var(--glass);backdrop-filter:blur(calc(var(--glass-blur) * 1.4));-webkit-backdrop-filter:blur(calc(var(--glass-blur) * 1.4));border:1px solid var(--ln2);border-radius:20px;box-shadow:var(--shadow);padding:16px 16px 12px;animation:startIn .34s var(--ease-out)}
.cal-time{font-family:var(--f-num);font-size:50px;line-height:1;letter-spacing:.01em;display:flex;align-items:flex-end;gap:6px}
.cal-time small{font-family:var(--f-sans);font-size:15px;color:var(--tx2);padding-bottom:4px}
.cal-date{font-size:12px;color:var(--tx2);margin:8px 0 14px;font-family:var(--f-mono)}
.cal-nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-nav b{flex:1;font-family:var(--f-serif);font-size:16px;font-weight:700;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-wd{font-size:11px;color:var(--tx3);padding:4px 0}
.cal-d{height:34px;border-radius:11px;font-size:13px;font-family:var(--f-mono);color:var(--tx2);display:grid;place-items:center;position:relative}
.cal-d:hover{background:var(--ln);color:var(--tx)}
.cal-d.out{opacity:.32}
.cal-d.today{background:var(--acc);color:var(--acc-ink);font-weight:700}
.cal-d.sel{box-shadow:inset 0 0 0 1.5px var(--acc)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--tx3)}

/* 菜单 */
.ctx{position:fixed;z-index:9500;min-width:210px;max-width:280px;padding:6px;border-radius:14px;background:var(--glass);backdrop-filter:blur(calc(var(--glass-blur) * 1.2));-webkit-backdrop-filter:blur(calc(var(--glass-blur) * 1.2));border:1px solid var(--ln2);box-shadow:var(--shadow);animation:pop .16s var(--ease-out);max-height:calc(100dvh - 16px);overflow:auto}
.ctx-i{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:6px 10px;border-radius:9px;font-size:13px;text-align:left;color:var(--tx);white-space:nowrap}
.ctx-i:hover:not(:disabled),.ctx-i.open{background:rgba(var(--acc-rgb),.16)}
.ctx-i:disabled{opacity:.38;cursor:default}
.ctx-i.danger{color:var(--err)}
.ctx-i .k{margin-left:auto;font-size:11px;color:var(--tx3);font-family:var(--f-mono);padding-left:12px}
.ctx-i .ar{margin-left:auto;color:var(--tx3);display:inline-flex}
.ctx-i .ar svg{width:12px;height:12px}
.ctx-i svg.ic{width:16px;height:16px;color:var(--tx2)}
.ctx-sep{height:1px;background:var(--ln);margin:5px 6px}
.ctx-sub{margin:2px 0 4px 14px;padding-left:8px;border-left:1px solid var(--ln)}

/* 弹窗 / 提示 / 忙碌 */
.layer{position:fixed;inset:0;z-index:9800;display:grid;place-items:center;background:rgba(6,5,4,.44);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .18s}
.modal{width:min(460px,calc(100vw - 28px));max-height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--ln2);border-radius:calc(var(--win-r) + 8px);box-shadow:var(--shadow);animation:pop .24s var(--ease-out);overflow:hidden}
.modal-h{padding:18px 22px 6px;font-family:var(--f-serif);font-size:19px;font-weight:700;letter-spacing:.04em}
.modal-b{padding:6px 22px 18px;overflow:auto;font-size:13.5px;color:var(--tx2);line-height:1.65;min-height:0}
.modal-b p{margin:0}
.modal-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--ln);background:var(--pn2)}
.toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:94vw}
.toast{pointer-events:auto;padding:10px 16px;border-radius:12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln2);box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center;animation:toastIn .32s var(--ease-out);max-width:94vw;line-height:1.4}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.toast.ok i{background:var(--ok)}
.toast.err i{background:var(--err)}
.toast.warn i{background:var(--warn)}
.busy{position:fixed;left:50%;bottom:calc(var(--tb-h) + 14px);transform:translateX(-50%);z-index:9700;min-width:280px;max-width:92vw;padding:12px 16px;border-radius:14px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--ln2);box-shadow:var(--shadow);font-size:13px;animation:toastIn .3s var(--ease-out)}
.busy-row{display:flex;gap:12px;align-items:center}
.busy-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busy-bar{height:3px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:9px}
.busy-bar b{display:block;height:100%;width:32%;background:var(--acc);border-radius:3px;animation:slide 1.3s infinite ease-in-out}
.busy-bar b.det{animation:none;transition:width .25s var(--ease-out)}
.seal-ld{width:22px;height:22px;position:relative;flex:none}
.seal-ld::before{content:"";position:absolute;inset:0;border-radius:6px;border:2px solid rgba(var(--acc-rgb),.25);border-top-color:var(--acc);animation:spin .9s linear infinite}
.seal-ld::after{content:"";position:absolute;inset:7px;border-radius:2px;background:var(--acc);opacity:.6;animation:fade 1.2s ease-in-out infinite alternate}
.ld-big{width:46px;height:46px;position:relative}
.ld-big::before{content:"";position:absolute;inset:0;border-radius:12px;border:2.5px solid rgba(var(--acc-rgb),.18);border-top-color:var(--acc);border-right-color:rgba(var(--acc-rgb),.5);animation:spin 1s linear infinite}
.ld-big::after{content:"";position:absolute;inset:12px;border-radius:4px;background:var(--acc);transform:rotate(45deg);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:rotate(45deg) scale(.7);opacity:.5}50%{transform:rotate(45deg) scale(1);opacity:1}}
.ld-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--tx2);font-size:13px;text-align:center;padding:24px;min-height:0;flex:1}
.ld-wrap small{color:var(--tx3);font-size:12px}

/* 通用控件 */
.btn{height:34px;padding:0 14px;border-radius:10px;background:var(--pn3);color:var(--tx);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ln);white-space:nowrap;transition:background .15s,border-color .15s,color .15s;flex:none}
.btn:hover:not(:disabled){border-color:var(--ln2);background:var(--pn2)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--acc)}
.btn.danger{color:var(--err)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--ln)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.42;cursor:default}
.btn svg.ic{width:16px;height:16px}
.inp{height:34px;padding:0 11px;border-radius:10px;background:var(--bg2);border:1px solid var(--ln);color:var(--tx);outline:none;min-width:0;width:100%}
.inp:focus{border-color:rgba(var(--acc-rgb),.7);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.16)}
select.inp{padding-right:6px}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fld>label,.fld>.lab{font-size:12px;color:var(--tx3);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--tx3)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg2);border:1px solid var(--ln);gap:2px;flex-wrap:wrap}
.seg button{height:28px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.seg button:hover:not(.on){color:var(--tx)}
.seg button.on{background:var(--pn3);color:var(--tx);box-shadow:0 1px 0 var(--ln2)}
.sw{position:relative;width:40px;height:23px;border-radius:12px;background:var(--pn3);border:1px solid var(--ln2);flex:none;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:var(--tx2);transition:transform .28s var(--ease-out),background .2s}
.sw.on{background:rgba(var(--acc-rgb),.9);border-color:transparent}
.sw.on::after{transform:translateX(17px);background:var(--acc-ink)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--ln2);outline:none;width:170px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.18);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--acc)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:9px 14px;font-size:13px;align-items:baseline}
.kv b{font-weight:500;color:var(--tx3)}
.kv span{word-break:break-all;color:var(--tx)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;background:var(--ln);color:var(--tx2);font-family:var(--f-mono);white-space:nowrap}
.tag.acc{background:rgba(var(--acc-rgb),.18);color:var(--acc)}
.empty{padding:40px 20px;text-align:center;color:var(--tx3);font-size:13px;line-height:1.8}

/* 资源管理器 */
.ex{position:absolute;inset:0;display:flex;min-height:0;min-width:0}
.ex-side{width:204px;flex:none;display:flex;flex-direction:column;background:var(--pn2);border-right:1px solid var(--ln);min-height:0;overflow:auto;padding:6px 6px 14px;font-size:13px;user-select:none;-webkit-user-select:none}
.ex-side h6{margin:14px 8px 6px;font-size:11px;letter-spacing:.16em;color:var(--tx3);font-weight:500}
.tr-row{display:flex;align-items:center;gap:5px;height:29px;padding-right:6px;border-radius:8px;color:var(--tx2);cursor:default;white-space:nowrap;min-width:max-content}
.tr-row:hover{background:var(--ln);color:var(--tx)}
.tr-row.on{background:rgba(var(--acc-rgb),.18);color:var(--tx)}
.tr-row.drop-hi{background:rgba(var(--acc-rgb),.3);color:var(--tx)}
.tr-row .tg{width:18px;height:18px;display:grid;place-items:center;flex:none;color:var(--tx3);cursor:pointer;border-radius:5px}
.tr-row .tg:hover{background:var(--ln2)}
.tr-row .tg svg{width:11px;height:11px;transition:transform .2s var(--ease-out)}
.tr-row .tg.open svg{transform:rotate(90deg)}
.tr-row .tg.none{visibility:hidden}
.tr-row svg.ic{width:15px;height:15px;color:var(--acc)}
.tr-row .tr-l{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tr-kids{padding-left:12px;margin-left:10px;border-left:1px dashed var(--ln)}
.tr-load{font-size:11px;color:var(--tx3);padding:4px 0 4px 26px}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;min-height:0}
.ex-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--ln);flex:none;flex-wrap:wrap;min-height:50px}
.ex-tools{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.ib{height:32px;min-width:32px;padding:0 8px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--tx2);font-size:12.5px;white-space:nowrap;flex:none}
.ib:hover:not(:disabled){background:var(--ln);color:var(--tx)}
.ib:disabled{opacity:.34;cursor:default}
.ib.on{background:rgba(var(--acc-rgb),.2);color:var(--tx)}
.ib svg{width:16px;height:16px}
.ib .lbl{display:inline}
.crumbs{flex:1;min-width:120px;height:32px;display:flex;align-items:center;gap:1px;padding:0 6px;border-radius:10px;background:var(--bg2);border:1px solid var(--ln);overflow:hidden;cursor:text;font-size:13px}
.crumbs .cr{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:7px;white-space:nowrap;color:var(--tx2);flex:none;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.crumbs .cr:hover{background:var(--ln);color:var(--tx)}
.crumbs .cr:last-of-type{color:var(--tx);font-weight:500}
.crumbs .sep{color:var(--tx3);display:inline-flex;flex:none}
.crumbs .sep svg{width:12px;height:12px}
.crumbs .path-in{flex:1;min-width:0;border:0;outline:none;background:none;font-family:var(--f-mono);font-size:12.5px}
.ex-search{width:190px;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--ln);color:var(--tx3);flex:none}
.ex-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--tx);font-size:13px}
.ex-search svg{width:15px;height:15px}
.ex-search.scope{width:auto}
.ex-body{flex:1;min-height:0;position:relative}
.ex-scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ex-scroll.tsel{touch-action:none}
.ex-inner{position:relative;min-width:100%;min-height:100%;width:max(100%,var(--tw,100%));padding-bottom:28px}
.box-sel{position:absolute;left:0;top:0;z-index:30;pointer-events:none;border:1px solid rgba(var(--acc-rgb),.85);background:rgba(var(--acc-rgb),.13);border-radius:4px;display:none}
.ex-status{display:flex;align-items:center;gap:14px;padding:0 12px;height:28px;border-top:1px solid var(--ln);font-size:12px;color:var(--tx3);font-family:var(--f-mono);flex:none;background:var(--pn2);white-space:nowrap;overflow:hidden}
.ex-status .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ex-loading{position:absolute;inset:0;z-index:12;background:var(--pn);display:flex;align-items:center;justify-content:center}
.ex-drop{position:absolute;inset:8px;border:1.5px dashed rgba(var(--acc-rgb),.8);border-radius:14px;background:rgba(var(--acc-rgb),.08);z-index:25;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--tx);pointer-events:none;letter-spacing:.06em}
.ex-drop.on{display:flex}
.dt-head{position:sticky;top:0;z-index:4;width:100%;background:var(--pn2);border-bottom:1px solid var(--ln)}
.dt-hc{display:flex;width:var(--tw);height:32px;align-items:center;font-size:12px;color:var(--tx3)}
.dt-hc>div{position:relative;display:flex;align-items:center;gap:4px;padding:0 10px;height:100%;overflow:hidden;white-space:nowrap;cursor:default;flex:none;letter-spacing:.04em}
.dt-hc>div:hover{color:var(--tx2)}
.dt-hc>div.on{color:var(--tx)}
.dt-hc svg{width:11px;height:11px;transition:transform .2s var(--ease-out)}
.dt-hc svg.up{transform:rotate(180deg)}
.dt-hc>div:nth-child(1){width:var(--c0)}
.dt-hc>div:nth-child(2){width:var(--c1)}
.dt-hc>div:nth-child(3){width:var(--c2)}
.dt-hc>div:nth-child(4){width:var(--c3)}
.dt-grip{position:absolute;right:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:2;touch-action:none}
.dt-grip::after{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--ln2);transition:all .15s}
.dt-grip:hover::after,.dt-grip.drag::after{background:var(--acc);width:2px;left:3px}
.dt-row{display:flex;width:var(--tw);height:30px;align-items:center;font-size:13px;border-radius:7px;cursor:default;content-visibility:auto;contain-intrinsic-size:auto 30px;margin:0 0 1px;position:relative;touch-action:pan-y}
.dt-row:hover{background:var(--ln)}
.dt-row.sel{background:rgba(var(--acc-rgb),.2)}
.dt-row.cut{opacity:.5}
.dt-row.drop-hi{background:rgba(var(--acc-rgb),.34);box-shadow:inset 0 0 0 1.5px var(--acc)}
.dt-row>div{flex:none;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--tx2);height:100%;display:flex;align-items:center;min-width:0}
.dt-row>div:nth-child(1){width:var(--c0);color:var(--tx);gap:9px}
.dt-row>div:nth-child(2){width:var(--c1)}
.dt-row>div:nth-child(3){width:var(--c2)}
.dt-row>div:nth-child(4){width:var(--c3);font-family:var(--f-mono);font-size:12px}
.dt-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fi{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--tx2)}
.fi svg{width:17px;height:17px}
.fi.dir{color:var(--acc)}
.fi.img{width:22px;height:16px;border-radius:3px;overflow:hidden}
.fi img{width:100%;height:100%;object-fit:cover}
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;padding:14px;align-content:start;min-height:100%}
.ic-cell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:12px;font-size:12.5px;cursor:default;text-align:center;content-visibility:auto;contain-intrinsic-size:auto 150px;position:relative;touch-action:pan-y}
.ic-cell:hover{background:var(--ln)}
.ic-cell.sel{background:rgba(var(--acc-rgb),.22);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.5)}
.ic-cell.drop-hi{background:rgba(var(--acc-rgb),.34)}
.ic-cell.cut{opacity:.5}
.ic-thumb{width:86px;height:86px;border-radius:12px;display:grid;place-items:center;background:var(--pn3);overflow:hidden;color:var(--acc);box-shadow:inset 0 0 0 1px var(--ln)}
.ic-thumb svg{width:38px;height:38px}
.ic-thumb img{width:100%;height:100%;object-fit:cover}
.ic-cell .lb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;line-height:1.35;max-width:100%}
.ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:2px 10px;padding:10px;align-content:start;min-height:100%}
.ls-cell{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:9px;font-size:13px;white-space:nowrap;cursor:default;content-visibility:auto;contain-intrinsic-size:auto 34px;min-width:0;touch-action:pan-y}
.ls-cell .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ls-cell:hover{background:var(--ln)}
.ls-cell.sel{background:rgba(var(--acc-rgb),.22)}
.ls-cell.cut{opacity:.5}
.ls-cell.drop-hi{background:rgba(var(--acc-rgb),.34)}
.mc{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.mc-col{width:238px;flex:none;overflow:auto;border-right:1px solid var(--ln);padding:6px;overscroll-behavior:contain}
.mc-item{display:flex;align-items:center;gap:8px;height:31px;padding:0 8px;border-radius:8px;font-size:13px;cursor:default;min-width:0;white-space:nowrap}
.mc-item:hover{background:var(--ln)}
.mc-item.on{background:rgba(var(--acc-rgb),.22)}
.mc-item.sel{background:rgba(var(--acc-rgb),.3)}
.mc-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mc-prev{flex:1;min-width:300px;padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--tx2);text-align:center;font-size:13px}
.mc-prev .big{width:150px;height:150px;border-radius:18px;display:grid;place-items:center;background:var(--pn3);overflow:hidden;color:var(--acc)}
.mc-prev .big svg{width:60px;height:60px}
.mc-prev .big img{width:100%;height:100%;object-fit:contain}
.mc-prev .nm{font-family:var(--f-serif);font-size:16px;color:var(--tx);word-break:break-all}

/* 移动端适配 */
@media (max-width:1100px){
  .dicon{--cw:86px}
  .ex-side{width:172px}
}
@media (max-width:760px){
  :root{--tb-h:74px}
  .taskbar{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:58px;border:1px solid var(--ln2);border-radius:22px;padding:0 6px;box-shadow:var(--shadow)}
  .tb-clock,.tb-peek,.tb-start-t{display:none}
  .tb-app span{display:none}
  .tb-app{min-width:46px;justify-content:center;padding:0 9px}
  .tb-app.on::after{width:16px;margin-left:-8px}
  .tb-start{padding:0 8px 0 4px}
  .start{left:8px;right:8px;width:auto;bottom:calc(var(--tb-h) + 6px)}
  .start-grid{grid-template-columns:repeat(4,1fr)}
  .cal{left:8px;right:8px;width:auto;bottom:calc(var(--tb-h) + 6px)}
  .win .rz{display:none}
  .wins{bottom:var(--tb-h)}
  .desk{bottom:calc(var(--tb-h) - 14px)}
  .ex-side{position:absolute;left:0;top:0;bottom:0;z-index:20;transform:translateX(-102%);transition:transform .32s var(--ease-out);box-shadow:var(--shadow);width:230px}
  .ex.side-open .ex-side{transform:none}
  .ex-search{width:130px}
  .ex-bar{padding:6px 6px}
  .ib .lbl{display:none}
  .ib{min-width:36px;height:36px}
  .crumbs{min-width:90px}
  .dicon{--cw:84px;--ch:96px}
  .dicon-ico{width:50px;height:50px}
  .ic-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .ic-thumb{width:70px;height:70px}
  .mc-col{width:200px}
  .modal{width:calc(100vw - 20px)}
  .win-bar{height:44px}
  .wc{width:38px;height:34px}
  .ex-status{font-size:11px;gap:8px}
  .dt-row{height:40px}
  .dt-row>div:nth-child(1){width:var(--c0)}
  .ls-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
.tb-i{display:grid;place-items:center;color:var(--acc);flex:none;width:18px;height:18px}
.tb-i svg{width:16px;height:16px}
.sep-v{width:1px;height:20px;background:var(--ln2);margin:0 4px;flex:none}
.tg-ghost{position:fixed;left:0;top:0;z-index:9950;width:44px;height:44px;border-radius:13px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ln2);box-shadow:var(--shadow);display:grid;place-items:center;pointer-events:none;color:var(--acc);will-change:transform}
.tg-ghost svg{width:22px;height:22px}
.dangerfill{background:var(--err);color:#fff7f2;border-color:transparent}
.dangerfill:hover:not(:disabled){filter:brightness(1.07);background:var(--err)}
.ld-cancel{margin-top:6px}
.mc-item.sel{background:rgba(var(--acc-rgb),.28)}
.mc-item.drop-hi{background:rgba(var(--acc-rgb),.34)}
.dt-row.dragging,.ic-cell.dragging,.ls-cell.dragging,.mc-item.dragging{opacity:.45}
.ex-scroll,.desk,.mc,.ex-inner,.ex-side{user-select:none;-webkit-user-select:none}
.ic-thumb img,.fi img{width:100%;height:100%;object-fit:cover}
.fi.img{width:22px;height:16px;border-radius:3px;overflow:hidden}
.start-body{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.start-sec{flex:none}
.start-grid{flex:none}
@media (max-width:760px){
  .seg .lbl,.ex-tools .lbl{display:none}
  .ex-bar{gap:4px}
}
.btn.on{background:rgba(var(--acc-rgb),.22);color:var(--tx);border-color:rgba(var(--acc-rgb),.35)}
.btn.ghost.on{background:rgba(var(--acc-rgb),.18);border-color:transparent}
/* 记事本 / 表格 / 图片查看器 / 媒体播放器 */
.np{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.np-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--ln);background:var(--pn2);flex-wrap:wrap;flex:none}
.np-size{min-width:24px;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--tx2)}
.np-banner{display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(217,162,74,.14);color:var(--tx);border-bottom:1px solid rgba(217,162,74,.35);font-size:12.5px;flex:none}
.np-ta{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background:var(--pn);color:var(--tx);padding:14px 18px;font-family:var(--f-mono);line-height:1.7;tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere}

.np-status .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sh{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.sh-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--pn)}
.sh-table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.sh-table th,.sh-table td{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:0 8px;height:28px;min-width:96px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}

.sh-table thead th.rn{z-index:3}

.sh-table td:focus{box-shadow:inset 0 0 0 2px var(--acc);background:var(--pn3)}

.vw{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.vw-stage{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;background:#0d0c0a;background-image:linear-gradient(45deg,#1a1815 25%,transparent 25%),linear-gradient(-45deg,#1a1815 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1815 75%),linear-gradient(-45deg,transparent 75%,#1a1815 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.vw-img{position:absolute;left:50%;top:50%;max-width:none;max-height:none;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vw-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pl{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 220px;min-height:0}
.pl-main-col{display:flex;flex-direction:column;min-width:0;min-height:0}
.pl-stage{flex:1;min-height:0;position:relative;background:radial-gradient(70% 60% at 50% 40%,rgba(var(--acc-rgb),.14),transparent 70%),#080706;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pl-video{max-width:100%;max-height:100%;width:100%;height:100%;background:#000;object-fit:contain}
.pl-vis{position:absolute;inset:0;width:100%;height:100%}
.pl-cover{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:var(--pn3);color:var(--acc);box-shadow:0 20px 40px -18px rgba(0,0,0,.8);z-index:1}

.pl-cover.playing{animation:pulseC 2.4s ease-in-out infinite}
@keyframes pulseC{0%,100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.35),0 20px 40px -18px rgba(0,0,0,.8)}50%{box-shadow:0 0 0 18px rgba(var(--acc-rgb),0),0 20px 40px -18px rgba(0,0,0,.8)}}
.pl-cover.hidden{display:none}
.pl-ctrl{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--pn2);border-top:1px solid var(--ln)}
.pl-title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.pl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);background:var(--pn3);flex:none}
.pl-btn svg{width:16px;height:16px}
.pl-btn:hover{color:var(--tx)}
.pl-main{width:44px;height:44px;background:var(--acc);color:var(--acc-ink)}
.pl-main svg{width:20px;height:20px}
.pl-prog{flex:1;min-width:120px}
.pl-time{font-family:var(--f-mono);font-size:12px;color:var(--tx3);white-space:nowrap}
.pl-vi{display:inline-grid;place-items:center;color:var(--tx3)}
.pl-vi svg{width:16px;height:16px}
.pl-vol{width:90px}
.pl-list{overflow:auto;border-left:1px solid var(--ln);background:var(--pn2);padding:8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.pl-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:12.5px;text-align:left;color:var(--tx2);min-width:0}
.pl-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl-item:hover{background:var(--ln);color:var(--tx)}
.pl-item.on{background:rgba(var(--acc-rgb),.2);color:var(--tx)}
.pl-item svg{width:15px;height:15px;flex:none}
/* 代码编辑器 */
.he{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.he-tb{display:flex;align-items:center;gap:4px;padding:6px 8px;flex-wrap:wrap;border-bottom:1px solid var(--ln);background:var(--pn2);flex:none}
.he-btn{height:30px;padding:0 9px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s;flex:none}
.he-btn svg{width:15px;height:15px}
.he-btn:hover{background:var(--ln);color:var(--tx)}
.he-btn.pri{background:var(--acc);color:var(--acc-ink)}
.he-btn.pri:hover{filter:brightness(1.08)}
.he-btn.on{background:rgba(var(--acc-rgb),.2);color:var(--tx)}
.he-btn.sm{height:26px;padding:0 7px;font-size:12px}
.he-sel{height:30px;font-size:12.5px;padding:0 26px 0 8px;width:auto;border-radius:9px}
.he-find{display:flex;flex-direction:column;gap:6px;padding:8px;border-bottom:1px solid var(--ln);background:var(--bg2);flex:none}

.he-frow .inp{flex:1 1 200px;width:auto;min-width:140px;height:30px}
.he-count{font-family:var(--f-mono);font-size:12px;color:var(--tx3);min-width:58px;text-align:center}
.he-main{flex:1;min-height:0;display:flex;position:relative}
.he-main.col{flex-direction:column}
.he-cmbox{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#212121}
.he-cm{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.he-cm .CodeMirror{height:100%;flex:1;font-family:var(--f-mono);font-size:13px;line-height:1.6}
.he-hit{background:rgba(217,163,74,.36);border-radius:2px}
.he-fb{width:100%;height:100%;border:0;outline:none;resize:none;padding:12px 14px;font-family:var(--f-mono);font-size:13px;line-height:1.6;background:#1e1c19;color:#eae2d0;tab-size:2;white-space:pre;overflow:auto}
.he-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#1e1c19;color:#cfc4ae;font-size:13px;z-index:3}
.he-pvbox{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.he-pv{flex:1;width:100%;height:100%;border:0;background:#fff;display:block}
.he-pvlabel{position:absolute;right:8px;top:8px;font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.45);color:#f2ecde;pointer-events:none;z-index:2}
.he-veil{position:absolute;inset:0;background:#15130f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#cfc4ae;font-size:13px;z-index:4;transition:opacity .25s}
.he-veil.off{opacity:0;pointer-events:none}
.he-split{flex:0 0 6px;background:var(--ln);cursor:col-resize;position:relative;z-index:5;touch-action:none}
.he-split:hover{background:rgba(var(--acc-rgb),.5)}
.he-main.col .he-split{cursor:row-resize}
.he-status{display:flex;gap:12px;align-items:center;padding:0 12px;height:26px;border-top:1px solid var(--ln);font-size:12px;color:var(--tx3);font-family:var(--f-mono);background:var(--pn2);flex:none;white-space:nowrap;overflow:hidden}
.he-status .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 漫画阅读器 */
.mg-root{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#000;overflow:hidden}
.mg-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--pn2);border-bottom:1px solid var(--ln);flex:none}
.mg-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.mg-count{font-family:var(--f-mono);font-size:12px;color:var(--tx3);white-space:nowrap}
.mg-root.imm .mg-bar,.mg-root.imm .mg-tip{display:none}
.mg-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:#000;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;contain:layout style;position:relative}
.mg-scroll.grab{cursor:grabbing}
.mg-stage{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:28px}
.mg-page{position:relative;width:100%;overflow:hidden;background:#0c0c0c;flex:none}
.mg-page.sk{background:linear-gradient(90deg,#111 25%,#1b1b1b 37%,#111 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.mg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mg-tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(300px,calc(100% - 28px));padding:10px 14px;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln2);z-index:6;transition:opacity .3s;box-shadow:var(--shadow)}
.mg-tip.off{opacity:0;pointer-events:none}
.mg-tiprow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.mg-bar2{height:3px;border-radius:3px;background:var(--ln);margin-top:8px;overflow:hidden}
.mg-bar2 b{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.mg-exit{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;display:none;place-items:center;background:rgba(0,0,0,.4);color:rgba(255,255,255,.6);z-index:20;opacity:.45;transition:opacity .2s}
.mg-exit:hover{opacity:1;color:#fff}
.mg-exit svg{width:18px;height:18px}
.mg-root.imm .mg-exit{display:grid}
/* 网页浏览器 */
.br{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.br-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--ln);background:var(--pn2);flex:none}
.br-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx2);flex:none}
.br-btn svg{width:16px;height:16px}
.br-btn:hover:not(:disabled){background:var(--ln);color:var(--tx)}
.br-btn:disabled{opacity:.3;cursor:default}
.br-addrwrap{flex:1;min-width:120px;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--ln)}
.br-addrwrap:focus-within{border-color:rgba(var(--acc-rgb),.7);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.14)}
.br-lock{display:grid;place-items:center;color:var(--tx3);flex:none}
.br-lock svg{width:14px;height:14px}
.br-addr{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--f-mono);font-size:12.5px;color:var(--tx)}
.br-stage{flex:1;min-height:0;position:relative;background:#fff}
.br-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.br-veil{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 40%,#2a231b,#0d0b09);display:flex;align-items:center;justify-content:center;z-index:4;transition:opacity .3s}
.br-veil.off{opacity:0;pointer-events:none}
.br-vbox{display:flex;flex-direction:column;align-items:center;gap:12px;color:#cfc4ae;font-size:13px;text-align:center;max-width:380px;padding:20px}
.br-vbox .vt{letter-spacing:.08em}
.br-vbox .vh{color:#8f8571;line-height:1.6;font-size:12px;min-height:1em}
.br-status{display:flex;padding:0 12px;height:24px;align-items:center;border-top:1px solid var(--ln);font-size:11.5px;color:var(--tx3);font-family:var(--f-mono);background:var(--pn2);flex:none;overflow:hidden;white-space:nowrap}
.br-status .grow{overflow:hidden;text-overflow:ellipsis}
/* 计算器 */
.ca{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0}
.ca-top{flex:none;padding:12px 14px 10px;border-radius:16px;background:var(--bg2);border:1px solid var(--ln);min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}
.ca-exp{font-family:var(--f-mono);font-size:13px;color:var(--tx3);min-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ca-res{font-family:var(--f-num);font-size:clamp(34px,8vw,50px);line-height:1.1;color:var(--tx);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ca-res.err{font-family:var(--f-sans);font-size:17px;color:var(--err)}
.ca-tools{display:flex;align-items:center;gap:6px;padding:0 2px;flex:none}
.ca-hist{flex:none;max-height:150px;overflow:auto;border-radius:12px;background:var(--bg2);border:1px solid var(--ln);padding:4px}
.ca-hi{display:block;width:100%;text-align:right;padding:6px 10px;border-radius:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--tx2)}
.ca-hi:hover{background:var(--ln);color:var(--tx)}
.ca-keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(40px,1fr);gap:7px}
.ca-k{border-radius:14px;font-size:16px;background:var(--pn3);color:var(--tx);border:1px solid var(--ln);transition:transform .08s,background .15s;min-width:0}
.ca-k:hover{background:var(--pn2)}
.ca-k:active{transform:scale(.96)}
.ca-k.fn{font-size:13px;color:var(--tx2)}
.ca-k.op{background:rgba(var(--acc-rgb),.16);color:var(--acc)}
.ca-k.eqk{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.ca-k.eqk:hover{filter:brightness(1.08)}
.ca-k.w2{grid-column:span 2}
/* 画板 */
.pt{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.pt-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#2a2620 0 25%,#221f1a 0 50%) 0 0/24px 24px;padding:14px;overflow:hidden}
.pt-cv{max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);background:#f6f1e4;touch-action:none;cursor:crosshair}
.pt-color{width:34px;height:30px;border:0;border-radius:9px;background:none;padding:0;cursor:pointer}

.pt-size{display:inline-flex;align-items:center;gap:6px}

/* 设置中心 */
.st{position:absolute;inset:0;display:flex;min-height:0}
.st-nav{width:206px;flex:none;background:var(--pn2);border-right:1px solid var(--ln);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.st-nb{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;font-size:13px;color:var(--tx2);text-align:left;white-space:nowrap}
.st-nb svg{width:16px;height:16px;color:var(--tx3);flex:none}
.st-nb:hover{background:var(--ln);color:var(--tx)}
.st-nb.on{background:rgba(var(--acc-rgb),.16);color:var(--tx)}
.st-nb.on svg{color:var(--acc)}
.st-body{flex:1;min-width:0;overflow:auto;padding:14px 22px 30px;overscroll-behavior:contain}
.st-sec{margin:0 0 18px;padding:14px 16px 8px;border-radius:16px;background:var(--pn2);border:1px solid var(--ln)}

.st-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--ln);flex-wrap:wrap}

.st-lb{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}

.st-lb small{color:var(--tx3);font-size:12px;line-height:1.5}
.st-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:100%}
.st-swatches{display:flex;gap:10px;flex-wrap:wrap}
.st-sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .2s}
.st-sw:hover{transform:scale(1.08)}
.st-sw.on{box-shadow:0 0 0 2px var(--pn2),0 0 0 3.5px var(--tx)}
.st-color{width:34px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.st-walls{display:flex;flex-wrap:wrap;gap:10px}
.st-wall{width:108px;display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:12px;color:var(--tx2)}
.st-wp{display:block;height:64px;border-radius:12px;background-size:cover;box-shadow:inset 0 0 0 1px var(--ln2)}
.st-wall:hover{color:var(--tx)}
.st-wall.on{color:var(--tx)}

.st-up{display:grid;place-items:center;background:var(--pn3)}
.st-up svg{width:20px;height:20px;color:var(--tx2)}
.st-wp.w-mist{background:radial-gradient(120% 90% at 78% 8%,rgba(var(--acc-rgb),.25),transparent 58%),linear-gradient(176deg,var(--wp1),var(--wp2))}
.st-wp.w-seal{background:radial-gradient(circle at 72% 38%,rgba(var(--acc-rgb),.42) 0 8%,transparent 8.6%),repeating-radial-gradient(circle at 72% 38%,transparent 0 12px,rgba(236,227,207,.08) 12px 13px),linear-gradient(180deg,var(--wp1),var(--wp2))}
.st-wp.w-stele{background:linear-gradient(90deg,rgba(236,227,207,.05) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(rgba(236,227,207,.05) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(180deg,var(--wp1),var(--wp2))}
.st-wp.w-contour{background:repeating-radial-gradient(ellipse 120% 90% at 30% 115%,transparent 0 9px,rgba(236,227,207,.1) 9px 10px),linear-gradient(170deg,var(--wp3),var(--wp2))}
.st-wp.w-dusk{background:radial-gradient(60% 42% at 50% 104%,rgba(var(--acc-rgb),.55),transparent 72%),linear-gradient(180deg,#2b1913 0%,#120f0c 52%,#0e1916 100%)}
.st-wp.w-jade{background:radial-gradient(70% 55% at 20% 20%,rgba(143,184,154,.3),transparent 70%),linear-gradient(160deg,#101a16,#0a0f0d)}

.st-usage{padding:6px 0 4px}
.st-total{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.st-total b{font-family:var(--f-num);font-size:36px;font-weight:400;letter-spacing:.01em}
.st-total span{color:var(--tx3);font-size:12.5px}
.st-bar{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--ln)}
.st-bar i{display:block;height:100%;transition:width .5s var(--ease-out)}
.st-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 12px}
.st-lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.st-lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.st-root{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--ln)}
.st-rh{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.st-rh span{color:var(--tx3);font-size:12px;font-family:var(--f-mono)}
.st-fold{display:grid;grid-template-columns:minmax(90px,160px) 1fr 90px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.st-fold .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.st-fold .sz{font-family:var(--f-mono);color:var(--tx3);text-align:right;font-size:11.5px}
.st-fb{height:8px;border-radius:6px;background:var(--ln);overflow:hidden}
.st-fb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),rgba(var(--acc-rgb),.5));border-radius:6px;transition:width .5s var(--ease-out)}
.st-fb.wide{margin-top:4px}
.st-mounts{display:flex;flex-direction:column;gap:8px}
.st-mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--ln)}
.st-mrow > svg{width:20px;height:20px;color:var(--acc);flex:none}
.st-mrow.warn > svg{color:var(--warn)}
.st-mrow .st-lb{min-width:0}
.st-feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;width:100%}
.st-feat{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg2);font-size:12.5px;color:var(--tx3);border:1px solid var(--ln)}
.st-feat i{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:none}
.st-feat.ok{color:var(--tx)}
.st-feat.ok i{background:var(--ok)}
/* 虚拟机 */
.vm{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;background:#0a0908}
.vm-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 10px;background:var(--pn2);border-bottom:1px solid var(--ln);flex:none}
.vm-disk{font-family:var(--f-mono);font-size:12px;color:var(--tx2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vm-status{margin-left:auto;font-size:12px;color:var(--tx3);font-family:var(--f-mono);white-space:nowrap}
.vm-stage{flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:auto}
.vm-screen{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.vm-screen canvas{max-width:100%;height:auto;display:block}
.vm-screen > div{color:#e8e0c8;background:#000;padding:4px;overflow:hidden}
.vm-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,7,6,.94);color:#cfc4ae;text-align:center;padding:20px;z-index:3;transition:opacity .3s}
.vm-veil.off{opacity:0;pointer-events:none}
.vm-veil .vt{font-family:var(--f-serif);font-size:18px;letter-spacing:.06em}
.vm-veil .vh{color:#8f8571;font-size:12.5px;max-width:420px;line-height:1.6}
.vm-hint{flex:none;padding:6px 12px;font-size:11.5px;color:var(--tx3);border-top:1px solid var(--ln);background:var(--pn2);line-height:1.5}
@media (max-width:760px){
  .pl{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 150px}
  .pl-list{border-left:0;border-top:1px solid var(--ln)}
  .st-nav{width:150px}
  .st-fold{grid-template-columns:90px 1fr 70px}
  .vm-status{margin-left:0;width:100%}
  .he-btn span{display:none}
  .he-btn{padding:0 7px}
  .br-btn{width:36px;height:36px}
  .he-sel{max-width:110px}
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const U = {
  uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); },
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
  xy(e) { const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e; return { x: t.clientX, y: t.clientY }; },
  debounce(fn, ms) { let t = 0; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  raf(fn) { let id = 0, args = null; return (...a) => { args = a; if (!id) id = requestAnimationFrame(() => { id = 0; fn(...args); }); }; },
  fmtSize(n) {
    if (n == null || isNaN(n)) return '—';
    if (n < 1024) return n + ' B';
    const u = ['KB', 'MB', 'GB', 'TB']; let v = n / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + ' ' + u[i];
  },
  fmtDate(ts, withTime = true) {
    if (!ts) return '—';
    const d = new Date(ts), p = n => String(n).padStart(2, '0');
    const date = `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
    if (!withTime) return date;
    const h = d.getHours(), mi = p(d.getMinutes());
    if (Cfg.d.hour12) { const hh = h % 12 || 12; return `${date} ${h < 12 ? '上午' : '下午'}${p(hh)}:${mi}`; }
    return `${date} ${p(h)}:${mi}`;
  },
  natCmp(a, b) {
    const ax = String(a).match(/\d+|\D+/g) || [], bx = String(b).match(/\d+|\D+/g) || [];
    const n = Math.min(ax.length, bx.length);
    for (let i = 0; i < n; i++) {
      const x = ax[i], y = bx[i];
      if (x === y) continue;
      const xd = /^\d/.test(x), yd = /^\d/.test(y);
      if (xd && yd) {
        const dx = x.replace(/^0+(?=\d)/, ''), dy = y.replace(/^0+(?=\d)/, '');
        if (dx.length !== dy.length) return dx.length - dy.length;
        if (dx !== dy) return dx < dy ? -1 : 1;
        continue;
      }
      const c = x.localeCompare(y, 'zh-CN', { sensitivity: 'base', numeric: true });
      if (c) return c;
    }
    return ax.length - bx.length;
  },
  ext(name) { const s = String(name); const i = s.lastIndexOf('.'); return i > 0 ? s.slice(i + 1).toLowerCase() : ''; },
  stem(name) { const s = String(name); const i = s.lastIndexOf('.'); return i > 0 ? s.slice(0, i) : s; },
  h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, String(sv)); else el.style[sk] = sv; } }
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
    return el;
  },
  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
  },
  mq(q) { return window.matchMedia(q).matches; },
  isMobile() { return this.mq('(max-width: 760px)'); },
  isFine() { return this.mq('(pointer: fine)'); },
  browser() {
    const ua = navigator.userAgent;

    if (/OPR\//.test(ua)) return 'Opera';
    if (/Firefox\//.test(ua)) return 'Firefox';
    if (/Chrome\//.test(ua)) return 'Chrome / Chromium';
    if (/Safari\//.test(ua)) return 'Safari';
    return '未知浏览器';
  }
};

/* ==================== 4. IndexedDB 封装 ==================== */
const DB = {
  db: null, opening: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    if (this.opening) return this.opening;
    this.opening = new Promise((res, rej) => {
      if (!self.indexedDB) { rej(new Error('IndexedDB 不可用')); return; }
      const req = indexedDB.open('tuoyin-vfs', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('nodes')) db.createObjectStore('nodes', { keyPath: 'k' }).createIndex('p', 'p');
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' }).createIndex('p', 'p');
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
      };
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => { try { this.db.close(); } catch (e) { /* */ } this.db = null; this.opening = null; };
        res(this.db);
      };
      req.onerror = () => rej(req.error || new Error('IndexedDB 打开失败'));
      req.onblocked = () => rej(new Error('IndexedDB 被占用'));
    }).catch(err => { this.opening = null; throw err; });
    return this.opening;
  },
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _done(tx) { return new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('IDB 事务中止')); }); },
  async get(store, key) { await this.open(); return this._req(this.db.transaction([store], 'readonly').objectStore(store).get(key)); },
  async put(store, val) { await this.open(); const tx = this.db.transaction([store], 'readwrite'); tx.objectStore(store).put(val); return this._done(tx); },
  async del(store, key) { await this.open(); const tx = this.db.transaction([store], 'readwrite'); tx.objectStore(store).delete(key); return this._done(tx); },
  async getAll(store, query) { await this.open(); return this._req(this.db.transaction([store], 'readonly').objectStore(store).getAll(query)); },
  async getAllByIndex(store, idx, key) { await this.open(); return this._req(this.db.transaction([store], 'readonly').objectStore(store).index(idx).getAll(key)); },
  async delRange(store, query) { await this.open(); const tx = this.db.transaction([store], 'readwrite'); tx.objectStore(store).delete(query); return this._done(tx); },
  async clear(store) { await this.open(); const tx = this.db.transaction([store], 'readwrite'); tx.objectStore(store).clear(); return this._done(tx); }
};

/* ==================== 5. 元数据层（保留修改日期） ==================== */
/* 记录 { m: 逻辑修改时间, n: 写入时的原生修改时间 }。仅当原生时间与记录一致时采用逻辑时间，
   这样移动/复制后修改日期不丢失，外部改动则自动回落为原生时间。 */
const Meta = {
  map: new Map(), pend: new Map(), timer: 0, persist: false,
  async load() {
    try {
      await DB.open();
      this.persist = true;
      const all = await DB.getAll('meta');
      for (const r of all) this.map.set(r.k, { m: r.m, n: r.n });
    } catch (e) {
      this.persist = false;
      try {
        const raw = localStorage.getItem('tuoyin:meta');
        if (raw) for (const [k, v] of Object.entries(JSON.parse(raw))) this.map.set(k, v);
      } catch (_) { /* ignore */ }
    }
  },
  get(p) { return this.map.get(p); },
  set(p, m, n) {
    this.map.set(p, { m, n });
    this.pend.set(p, { k: p, p: FS.parent(p), m, n });
    this._sched();
  },
  del(p) { if (!this.map.has(p)) return; this.map.delete(p); this.pend.set(p, null); this._sched(); },
  delTree(p) {
    const pre = p + '/';
    for (const k of [...this.map.keys()]) if (k === p || k.startsWith(pre)) { this.map.delete(k); this.pend.set(k, null); }
    this._sched();
  },
  rekeyTree(from, to) {
    const pre = from + '/';
    for (const k of [...this.map.keys()]) {
      if (k !== from && !k.startsWith(pre)) continue;
      const v = this.map.get(k), nk = to + k.slice(from.length);
      this.map.delete(k); this.pend.set(k, null);
      this.map.set(nk, v); this.pend.set(nk, { k: nk, p: FS.parent(nk), m: v.m, n: v.n });
    }
    this._sched();
  },
  _sched() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 220); },
  async flush() {
    if (!this.pend.size) return;
    const ups = [], dels = [];
    for (const [k, v] of this.pend) { if (v) ups.push(v); else dels.push(k); }
    this.pend.clear();
    if (this.persist) {
      try {
        await DB.open();
        const tx = DB.db.transaction(['meta'], 'readwrite');
        const st = tx.objectStore('meta');
        for (const r of ups) st.put(r);
        for (const k of dels) st.delete(k);
        await DB._done(tx);
        return;
      } catch (e) { console.warn('元数据写入 IDB 失败，降级到 localStorage', e); }
    }
    try { localStorage.setItem('tuoyin:meta', JSON.stringify(Object.fromEntries(this.map))); } catch (e) { /* 配额 */ }
  }
};

/* ==================== 6. 错误与路径工具 ==================== */
const ERRMSG = { ENOENT: '文件或文件夹不存在', EEXIST: '同名项目已存在', ENOTDIR: '这不是一个文件夹', EISDIR: '这是一个文件夹', EPERM: '没有权限或操作不被允许', ENOTEMPTY: '文件夹不为空', ENOTSUP: '当前存储后端不可用或不支持此操作', ENOSPC: '存储空间不足', EBUSY: '文件正被占用，请稍后重试', EINVAL: '目标位置无效（不能放入自身内部）' };

function wrapErr(e) {
  if (e && e.code) return e;
  const n = (e && e.name) || '';
  if (n === 'NotFoundError') return fsErr('ENOENT');
  if (n === 'TypeMismatchError') return fsErr('ENOTDIR');
  if (n === 'NoModificationAllowedError' || n === 'InvalidStateError') return fsErr('EBUSY');
  if (n === 'NotAllowedError' || n === 'SecurityError') return fsErr('EPERM');
  if (n === 'QuotaExceededError') return fsErr('ENOSPC');
  if (n === 'InvalidModificationError') return fsErr('ENOTEMPTY');

const parentRel = rel => { const i = rel.lastIndexOf('/'); return i < 0 ? '' : rel.slice(0, i); };

/* ==================== 7. 存储后端 ==================== */
/* 7a. 节点存储（IndexedDB 为主，内存为降级）：所有数据以 rel 路径为主键，父路径建立索引 */
class IDBNodes {
  get(k) { return DB.get('nodes', k); }
  children(p) { return DB.getAllByIndex('nodes', 'p', p); }
  put(rec) { return DB.put('nodes', rec); }
  async delTree(rel) {
    await DB.open();
    const tx = DB.db.transaction(['nodes'], 'readwrite');
    const st = tx.objectStore('nodes');
    st.delete(rel);
    st.delete(IDBKeyRange.bound(rel + '/', rel + '/\uffff'));
    await DB._done(tx);
  }
  async moveTree(src, dst) {
    await DB.open();
    const rd = DB.db.transaction(['nodes'], 'readonly').objectStore('nodes');
    const rows = [];
    const one = await DB._req(rd.get(src));
    if (one) rows.push(one);
    const sub = await DB._req(DB.db.transaction(['nodes'], 'readonly').objectStore('nodes').getAll(IDBKeyRange.bound(src + '/', src + '/\uffff')));
    rows.push(...sub);
    const tx = DB.db.transaction(['nodes'], 'readwrite');
    const st = tx.objectStore('nodes');
    for (const r of rows) st.delete(r.k);
    for (const r of rows) { const nk = dst + r.k.slice(src.length); st.put({ ...r, k: nk, p: parentRel(nk) }); }
    await DB._done(tx);
  }
}
class MemNodes {
  constructor() { this.m = new Map(); }
  async get(k) { return this.m.get(k) || null; }
  async children(p) { const out = []; for (const r of this.m.values()) if (r.p === p) out.push(r); return out; }
  async put(rec) { this.m.set(rec.k, rec); }
  async delTree(rel) { const pre = rel + '/'; for (const k of [...this.m.keys()]) if (k === rel || k.startsWith(pre)) this.m.delete(k); }
  async moveTree(src, dst) {
    const pre = src + '/', rows = [];
    for (const [k, r] of [...this.m.entries()]) if (k === src || k.startsWith(pre)) rows.push(r);
    for (const r of rows) this.m.delete(r.k);
    for (const r of rows) { const nk = dst + r.k.slice(src.length); this.m.set(nk, { ...r, k: nk, p: parentRel(nk) }); }
  }

class NodeBackend {
  constructor(store, id, label, persist) { this.store = store; this.id = id; this.label = label; this.persist = persist; }
  async stat(rel) {
    if (!rel) return { type: 'dir', size: 0, mtime: 0 };
    const r = await this.store.get(rel);
    return r ? { type: r.t === 'd' ? 'dir' : 'file', size: r.s || 0, mtime: r.m || 0 } : null;
  }
  async list(rel) {
    const rows = await this.store.children(rel);
    return rows.map(r => ({ name: lastSeg(r.k), type: r.t === 'd' ? 'dir' : 'file', size: r.s || 0, mtime: r.m || 0 }));
  }
  async read(rel) { const r = await this.store.get(rel); if (!r || r.t !== 'f') throw fsErr('ENOENT', rel); return r.b; }
  async write(rel, blob, opts = {}) {

    return m;
  }

/* 7b. 句柄后端：OPFS 根目录与 File System Access 挂载目录共用（同一套接口） */
class HandleBackend {
  constructor(root, id, label) { this.root = root; this.id = id; this.label = label; this.persist = true; this.cache = new Map(); this.addedAt = 0; }

    if (!rel) return this.root;
    if (this.cache.has(rel)) return this.cache.get(rel);
    let d = this.root, acc = '';
    for (const seg of rel.split('/')) {
      acc = acc ? acc + '/' + seg : seg;
      const hit = this.cache.get(acc);

      d = await d.getDirectoryHandle(seg);
      this.cache.set(acc, d);
    }
    return d;
  }
  async _parent(rel) { return { dir: await this._dir(parentRel(rel)), name: lastSeg(rel) }; }
  async _entry(rel) {
    try {
      const { dir, name } = await this._parent(rel);
      try { return { kind: 'file', h: await dir.getFileHandle(name) }; } catch (e) { /* 不是文件 */ }
      try { return { kind: 'dir', h: await dir.getDirectoryHandle(name) }; } catch (e) { /* 不是目录 */ }
    } catch (e) { /* 父目录不存在 */ }
    return null;
  }
  async stat(rel) {
    if (!rel) return { type: 'dir', size: 0, mtime: 0 };
    const e = await this._entry(rel);
    if (!e) return null;
    if (e.kind === 'file') { const f = await e.h.getFile(); return { type: 'file', size: f.size, mtime: f.lastModified }; }
    return { type: 'dir', size: 0, mtime: 0 };
  }
  async list(rel) {
    const d = await this._dir(rel);
    const ents = [];
    for await (const [name, h] of d.entries()) ents.push([name, h]);
    return Promise.all(ents.map(async ([name, h]) => {
      if (h.kind === 'file') { const f = await h.getFile(); return { name, type: 'file', size: f.size, mtime: f.lastModified }; }
      return { name, type: 'dir', size: 0, mtime: 0 };
    }));
  }
  async read(rel) { const e = await this._entry(rel); if (!e || e.kind !== 'file') throw fsErr('ENOENT', rel); return e.h.getFile(); }
  async write(rel, blob) {
    const { dir, name } = await this._parent(rel);
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    try { await w.write(blob); await w.close(); }
    catch (err) { try { await w.abort(); } catch (_) { /* */ } throw err; }
    const f = await fh.getFile();
    return f.lastModified;
  }
  async mkdir(rel) { const { dir, name } = await this._parent(rel); await dir.getDirectoryHandle(name, { create: true }); }
  async remove(rel) { const { dir, name } = await this._parent(rel); await dir.removeEntry(name, { recursive: true }); this._forget(rel); }

    const e = await this._entry(src);
    if (!e || typeof e.h.move !== 'function') return false;
    const dp = await this._parent(dst);

  const n = '.probe-' + U.uid();
  const fh = await root.getFileHandle(n, { create: true });
