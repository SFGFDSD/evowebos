    c.forEach((w, i) => sc.style.setProperty('--c' + i, w + 'px'));
  }
  onFs(paths) {
    if (this.destroyed) return;
    for (const p of paths) { this.treeCache.delete(FS.parent(p)); this.treeCache.delete(p); }
    const touches = paths.some(p => FS.isUnder(p, this.path) || FS.isUnder(this.path, p));
    clearTimeout(this._rt);
    this._rt = setTimeout(() => {
      if (this.destroyed) return;
      if (touches && this.mode === 'dir') { this.sizes.clear(); this.load(true); }
      this.renderSide();
    }, 90);
  }
  /* ---------- 导航与历史 ---------- */
  nav(path, opts = {}) {
    path = FS.norm(path);
    if (opts.push !== false && this.hist[this.hi] !== path) {
      this.hist = this.hist.slice(0, this.hi + 1);
      this.hist.push(path);
      this.hi = this.hist.length - 1;
    }
    this.path = path;
    this.el.scroll.dataset.path = path;
    this.mode = 'dir'; this.results = [];
    if (this.searchCtl) this.searchCtl.aborted = true;
    this.searchCtl = null;
    this.el.q.value = ''; this.q = '';
    this.sel = new Set(); this.anchor = null;
    this.sizes.clear();
    this.mill = [path]; this.millSel = [];
    this.load();
  }
  back() { if (this.hi > 0) { this.hi--; this.nav(this.hist[this.hi], { push: false }); } }
  fwd() { if (this.hi < this.hist.length - 1) { this.hi++; this.nav(this.hist[this.hi], { push: false }); } }
  up() { if (this.path !== '/') this.nav(FS.parent(this.path)); }
  async load(silent = false) {
    const tok = ++this.loadTok;
    const onMount = this.path.startsWith('/mnt/local/');
    if (!silent) this.setLoading(true, onMount ? '正在读取本地文件夹，大目录可能需要几秒…' : '正在读取…');
    let items;
    try { items = await FS.list(this.path); }
    catch (e) {
      if (tok !== this.loadTok || this.destroyed) return;
      this.setLoading(false);
      this.items = []; this.vis = [];
      this.showError(e);
      return;
    }
    if (tok !== this.loadTok || this.destroyed) return;
    this.items = items;
    this.setLoading(false);
    this.refresh();
    this.renderCrumbs();
    this.renderSide();
    this.updateFree();
    if (this.view === 'columns') this.renderMill();
    this.computeSizes(tok);
  }
  setLoading(on, text) {
    this.el.loading.classList.toggle('hidden', !on);
    if (text) this.el.loading.querySelector('.ld-txt').textContent = text;
  }
  showError(e) {
    this.el.scroll.classList.remove('hidden');
    this.el.mc.classList.add('hidden');
    this.el.inner.className = 'ex-inner';
    this.el.inner.innerHTML = '';
    this.el.inner.appendChild(U.h('div', { class: 'empty', style: { paddingTop: '70px' } },
      U.h('div', { style: { fontSize: '15px', color: 'var(--tx)', marginBottom: '8px' } }, '无法打开这个位置'),
      U.h('div', {}, e.message || String(e)),
      U.h('div', { class: 'row', style: { justifyContent: 'center', marginTop: '16px' } },
        U.h('button', { class: 'btn sm', onclick: () => this.up() }, Ico.el('up'), '返回上一级'),
        U.h('button', { class: 'btn sm', onclick: () => this.load() }, Ico.el('refresh'), '重试'))));
    this.renderStatus('无法读取');
  }
  /* ---------- 数据筛选与排序 ---------- */
  refresh() {
    const base = this.mode === 'search' ? this.results : this.items;
    const q = this.q.toLowerCase();
    const show = Cfg.d.showHidden;
    let vis = base.filter(it => (show || !it.name.startsWith('.')) && (!q || (it.label || it.name).toLowerCase().includes(q)));
    this.vis = this.sortItems(vis);
    this.renderContent();
    this.renderStatus();
  }
  sortItems(list) {
    const dir = this.sortDir;
    const cmp = {
      name: (a, b) => U.natCmp(a.label || a.name, b.label || b.name),
      mtime: (a, b) => (a.mtime || 0) - (b.mtime || 0),
      type: (a, b) => Kind.label(a).localeCompare(Kind.label(b), 'zh-CN') || U.natCmp(a.name, b.name),
      size: (a, b) => this.sizeOf(a) - this.sizeOf(b)
    }[this.sortKey] || ((a, b) => U.natCmp(a.name, b.name));
    return [...list].sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return cmp(a, b) * dir;
    });
  }
  sizeOf(it) { return it.type === 'dir' ? (this.sizes.has(it.path) ? this.sizes.get(it.path) : -1) : it.size; }
  setSort(key) {
    if (this.sortKey === key) this.sortDir = -this.sortDir;
    else { this.sortKey = key; this.sortDir = (key === 'mtime' || key === 'size') ? -1 : 1; }
    Cfg.d.explorer.sort = { key: this.sortKey, dir: this.sortDir };
    Cfg.saveSoon();
    this.refresh();
    if (key === 'size') this.computeSizes(this.loadTok);
  }
  async computeSizes(tok) {
    const dirs = this.vis.filter(it => it.type === 'dir' && !this.sizes.has(it.path)).map(it => it.path);
    if (!dirs.length) { this.renderStatus(); return; }
    let idx = 0;
    const worker = async () => {
      while (idx < dirs.length) {
        const p = dirs[idx++];
        if (tok !== this.loadTok || this.destroyed) return;
        let n = 0;
        try { n = await FS.du(p); } catch (e) { n = 0; }
        this.sizes.set(p, n);
        this._paintSize(p, n);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (this.sortKey === 'size' && tok === this.loadTok && !this.destroyed) this.refresh();
    else this.renderStatus();
  }
  _paintSize(p, n) {
    const el = this.el.inner.querySelector(`[data-size="${CSS.escape(p)}"]`);
    if (el) el.textContent = U.fmtSize(n);
  }
  async updateFree() {
    const r = this.path === '/' ? null : (() => { try { return FS.resolve(this.path); } catch (e) { return null; } })();
    if (!r || r.kind !== 'node') { this.freeTxt = ''; this.renderStatus(); return; }
    if (r.mount) { this.freeTxt = '本地磁盘'; this.renderStatus(); return; }
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        this.freeTxt = `${r.be.label.split(' ')[0]} 可用 ${U.fmtSize(Math.max(0, (e.quota || 0) - (e.usage || 0)))}`;
      }

  renderStatus(prefix) {

    if (selItems.length) {
      const total = selItems.reduce((a, it) => a + (it.type === 'dir' ? Math.max(0, this.sizes.get(it.path) || 0) : it.size), 0);
      txt += `　·　已选 ${selItems.length} 项（${U.fmtSize(total)}）`;

    this.el.stR.textContent = this.freeTxt || '';

  /* ---------- 面包屑 / 导航窗格 ---------- */
  _segLabel(p, seg) {

  editPath() {

  _navRow(path, label, icon) {

        this.treeCache.set(path, list);

      if (!vis.length) box.appendChild(U.h('div', { class: 'tr-load' }, path === '/mnt/local' ? '尚未挂载本地文件夹' : '（无子文件夹）'));

  /* ---------- 内容渲染 ---------- */
  emptyEl() {
    const msg = this.mode === 'search' ? '没有找到匹配的项目' : this.q ? `没有匹配「${this.q}」的项目` : '这个文件夹是空的';
    const acts = this.mode === 'dir' && !this.q

        U.h('button', { class: 'btn sm', onclick: () => this.actImport() }, Ico.el('upload'), '导入文件'),

      const frag = document.createDocumentFragment();

    const tgt = e.target.closest('[data-dnd="dir"]');

    if (internal) {
      const payload = DnD.readInternal(dt);
      if (!payload || !(payload.paths || []).length) return;
      if (this.isVirt() && dest === this.path) return UI.toast('无法移动到此位置', 'warn');
      Ops.moveOrCopy(payload.paths, dest, { copy: !!e.ctrlKey });
      return;
    }
    if (this.isVirt() && dest === this.path) return UI.toast('请先进入一个存储位置再导入', 'warn');
    const collected = Import.collectFrom(dt);
    Import.run(collected, dest, { after: () => { if (!this.destroyed) this.load(true); } });
  },
  /* ---------- 拖放：触摸（长按激活 + touchmove 锁定滚动） ---------- */
  _onTouchStart(e) {
    if (this.touchSel) return;
    const el = e.target.closest('[data-key]');
    if (!el) return;
    const it = this.itemBy(el.dataset.key);
    if (!it) return;
    const t0 = e.touches[0];
    const start = { x: t0.clientX, y: t0.clientY };
    let armed = false, moved = false, ghost = null, hov = null, finished = false;
    if (it.type === 'file') DnD.prefetch(it.path).catch(() => {});
    const arm = setTimeout(() => {
      if (moved || finished) return;
      armed = true;
      if (!this.sel.has(it.path)) this.select([it.path]);
      if (navigator.vibrate) navigator.vibrate(12);
      ghost = U.h('div', { class: 'tg-ghost' }, this.icoEl(it));
      document.body.appendChild(ghost);
    }, 380);
    const cleanup = () => {
      finished = true;
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
      el.removeEventListener('touchcancel', onEnd);
    };
    const onMove = ev => {
      const t = ev.touches[0];
      if (!armed) {
        if (Math.hypot(t.clientX - start.x, t.clientY - start.y) > 10) { moved = true; clearTimeout(arm); cleanup(); }
        return;
      }
      ev.preventDefault();
      moved = true;
      ghost.style.transform = `translate(${t.clientX - 22}px, ${t.clientY - 22}px)`;
      const hit = document.elementFromPoint(t.clientX, t.clientY);
      const tgt = hit && hit.closest ? hit.closest('[data-dnd="dir"]') : null;
      if (hov !== tgt) { if (hov) hov.classList.remove('drop-hi'); if (tgt) tgt.classList.add('drop-hi'); hov = tgt; }
    };
    const onEnd = ev => {
      clearTimeout(arm);
      const wasArmed = armed, wasMoved = moved;
      cleanup();
      if (!wasArmed) return;
      this._suppressClick = true;
      if (ghost) ghost.remove();
      if (hov) hov.classList.remove('drop-hi');
      if (!wasMoved) { Menu.show(start.x, start.y, Ops.itemMenu(this.selPaths(), this._ctx())); return; }
      const t = ev.changedTouches[0];
      const hit = document.elementFromPoint(t.clientX, t.clientY);
      const payload = { src: 'explorer', paths: this.selPaths(), keys: this.selPaths(), offX: 22, offY: 22 };
      if (hit) DnD.dropInternal(hit, payload, { x: t.clientX, y: t.clientY }, false);
    };
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    el.addEventListener('touchcancel', onEnd);
  },
  /* ---------- 全局搜索（递归，可取消，带进度） ---------- */
  async globalSearch(q) {
    const root = this.isVirt() ? FS.home() : this.path;
    if (this.searchCtl) this.searchCtl.aborted = true;
    const ctl = { aborted: false };
    this.searchCtl = ctl;
    this.mode = 'search';
    this.results = [];
    this.setLoading(true, `正在搜索「${q}」…`);
    this._ensureCancel();
    try {
      const res = await FS.search(root, q, { signal: ctl, limit: 2000, onProgress: p => { if (!ctl.aborted) this.setLoading(true, `正在搜索 ${p.scanned} 项，已找到 ${p.found} 项`); } });
      if (ctl.aborted || this.destroyed) return;
      this.results = res;
    } catch (e) { if (!ctl.aborted) UI.err(e); }
    if (ctl.aborted || this.destroyed) return;
    this.setLoading(false);
    this.refresh();
    this.renderStatus(`在「${FS.base(root) || '此电脑'}」中找到 ${this.results.length} 项`);
  },
  _ensureCancel() {
    const wrap = this.el.loading.querySelector('.ld-wrap');
    if (wrap.querySelector('.ld-cancel')) return;
    wrap.appendChild(U.h('button', { class: 'btn sm ld-cancel', onclick: () => {
      if (this.searchCtl) this.searchCtl.aborted = true;
      this.setLoading(false);
      this.nav(this.path);
    } }, '取消搜索'));
  },
  applySort(dir) {
    this.sortDir = dir;
    Cfg.d.explorer.sort = { key: this.sortKey, dir };
    Cfg.saveSoon();
    this.refresh();
    if (this.sortKey === 'size') this.computeSizes(this.loadTok);
  }
});

/* ==================== 23. 资源加载器（CDN 按需加载，失败自动切换备用源） ==================== */
const Loader = {
  cache: new Map(),
  script(urls) {
    const key = urls[0];
    if (this.cache.has(key)) return this.cache.get(key);
    const p = (async () => {
      let last = null;
      for (const u of urls) {
        try {
          await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = u; s.async = true;
            s.onload = () => res();
            s.onerror = () => { s.remove(); rej(new Error('网络加载失败：' + u)); };
            document.head.appendChild(s);
          });
          return true;
        } catch (e) { last = e; }
      }
      throw last || new Error('脚本加载失败');
    })();
    this.cache.set(key, p);
    p.catch(() => this.cache.delete(key));
    return p;
  },
  css(urls) {
    const key = 'css:' + urls[0];
    if (this.cache.has(key)) return this.cache.get(key);
    const p = (async () => {
      let last = null;
      for (const u of urls) {
        try {
          await new Promise((res, rej) => {
            const l = document.createElement('link');
            l.rel = 'stylesheet'; l.href = u;
            l.onload = () => res();
            l.onerror = () => { l.remove(); rej(new Error('样式加载失败：' + u)); };
            document.head.appendChild(l);
          });
          return true;
        } catch (e) { last = e; }
      }
      throw last || new Error('样式加载失败');
    })();
    this.cache.set(key, p);
    p.catch(() => this.cache.delete(key));
    return p;
  },
  module(urls) {
    const key = 'mod:' + urls[0];
    if (this.cache.has(key)) return this.cache.get(key);
    const p = (async () => {
      let last = null;
      for (const u of urls) {
        try { return await import(/* webpackIgnore: true */ u); }
        catch (e) { last = e; }
      }
      throw last || new Error('模块加载失败');
    })();
    this.cache.set(key, p);
    p.catch(() => this.cache.delete(key));
    return p;
  }
};
const JSZIP_URLS = ['https://unpkg.com/jszip@3.10.1/dist/jszip.min.js', 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'];
const SEVENZ_URLS = ['https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js', 'https://unpkg.com/7z-wasm@1.2.0/7zz.es6.min.js'];
async function loadJSZip() {
  if (!window.JSZip) await Loader.script(JSZIP_URLS);
  if (!window.JSZip) throw new Error('压缩库加载失败，请检查网络后重试');
  return window.JSZip;
}
/* JSZip 日期修正：DOS 时间在 JSZip 中以 UTC 字段解析；这里把它还原为本地时间，压缩时反向写入 */
const dosToLocal = d => new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds());
const localToZipDate = d => new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()));

/* ==================== 24. 导入（文件选择 / 拖入 / 文件夹递归） ==================== */
const Import = {
  pick(dir) {
    return new Promise(resolve => {
      const inp = $('#picker-file');
      inp.value = '';
      inp.onchange = async () => {
        const files = Array.from(inp.files || []);
        inp.onchange = null;
        if (files.length) await this.run(files.map(f => ({ file: f })), dir);
        resolve(files.length);
      };
      inp.click();
    });
  },
  pickDir(dir) {
    return new Promise(resolve => {
      const inp = $('#picker-dir');
      inp.value = '';
      inp.onchange = async () => {
        const files = Array.from(inp.files || []);
        inp.onchange = null;
        if (files.length) await this.run(files.map(f => ({ file: f, rel: f.webkitRelativePath || f.name })), dir);
        resolve(files.length);
      };
      inp.click();
    });
  },
  /* 必须同步调用：在 drop 事件中先收集 entry，之后才可异步读取 */
  collectFrom(dt) {
    const out = [];
    const items = dt.items ? Array.from(dt.items) : [];
    if (items.length && typeof items[0].webkitGetAsEntry === 'function') {
      for (const it of items) {
        if (it.kind !== 'file') continue;
        const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
        if (en) out.push({ entry: en });
        else { const f = it.getAsFile(); if (f) out.push({ file: f }); }
      }
    } else {
      for (const f of Array.from(dt.files || [])) out.push({ file: f });
    }
    return out;
  },
  async run(list, destDir, opts = {}) {
    const busy = UI.busy('正在导入…');
    const written = [];
    let n = 0, fail = 0;
    try {
      for (const c of list) {
        try {
          if (c.entry) await this._walk(c.entry, destDir, written, busy, () => n++);
          else if (c.file) {
            if (c.rel) {
              const parts = c.rel.split('/');
              let dir = destDir;
              for (const seg of parts.slice(0, -1)) { dir = FS.join(dir, seg); await FS.mkdir(dir, { recursive: true }).catch(() => {}); }
            }
            const p = await this._put(c.file, c.rel ? FS.join(destDir, FS.parent(c.rel) === '/' ? '' : FS.parent(c.rel)).replace(/\/\.$/, '') : destDir, busy);
            if (p) { written.push(p); n++; }
          }
        } catch (e) { fail++; UI.err(e, '导入失败：'); }
      }
    } finally { busy.done(); }
    if (n) UI.toast(`已导入 ${n} 项${fail ? `，${fail} 项失败` : ''}`, fail ? 'warn' : 'ok');
    if (opts.after) { try { opts.after(written); } catch (e) { console.warn(e); } }
    return written;
  },
  async _walk(entry, dir, written, busy, count) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      const p = await this._put(file, dir, busy);
      if (p) { written.push(p); count && count(); }
      return;
    }
    if (entry.isDirectory) {
      const target = FS.join(dir, entry.name);
      await FS.mkdir(target, { recursive: true }).catch(() => {});
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const child of batch) await this._walk(child, target, written, busy, count);
      } while (batch.length > 0);
    }
  },
  async _put(file, dir, busy) {
    const name = await FS.uniq(dir, file.name);
    const p = FS.join(dir, name);
    if (busy) busy.set(`正在导入 ${name}`);
    const data = file.size > 256 * 1024 * 1024 ? file : await file.arrayBuffer();
    const blob = data instanceof Blob ? data : new Blob([data], { type: file.type || mimeOf(name) });
    await FS.write(p, blob, { mtime: file.lastModified || Date.now() });
    return p;
  }
};

/* ==================== 25. 缩略图（按需生成 + LRU 缓存） ==================== */
const Thumbs = {
  cache: new Map(), pending: new Map(), MAX: 360,
  async load(path, size = 160) {
    const hit = this.cache.get(path);
    if (hit) { hit.at = Date.now(); return hit.url; }
    if (this.pending.has(path)) return this.pending.get(path);
    const p = (async () => {
      const st = await FS.stat(path);
      if (!st || st.type !== 'file' || st.size > 60 * 1024 * 1024) return null;
      const blob = await FS.read(path);
      if (U.ext(path) === 'svg') return URL.createObjectURL(blob);
      let bmp = null;
      try { bmp = await createImageBitmap(blob, { resizeWidth: size, resizeQuality: 'medium' }); } catch (e) { bmp = null; }
      if (!bmp) return null;
      const cv = document.createElement('canvas');
      cv.width = bmp.width; cv.height = bmp.height;
      cv.getContext('2d').drawImage(bmp, 0, 0);
      bmp.close && bmp.close();
      const out = await new Promise(res => cv.toBlob(res, 'image/webp', 0.84));
      return out ? URL.createObjectURL(out) : null;
    })();
    this.pending.set(path, p);
    let url = null;
    try { url = await p; } catch (e) { url = null; }
    this.pending.delete(path);
    if (url) { this.cache.set(path, { url, at: Date.now() }); this._evict(); }
    return url;
  },
  _evict() {
    if (this.cache.size <= this.MAX) return;
    const arr = [...this.cache.entries()].sort((a, b) => a[1].at - b[1].at);
    while (this.cache.size > this.MAX && arr.length) {
      const [k, v] = arr.shift();
      this.cache.delete(k);
      setTimeout(() => URL.revokeObjectURL(v.url), 3000);
    }
  },
  observe(ex) {
    const nodes = ex.el.inner.querySelectorAll('[data-thumb]');
    if (!nodes.length || typeof IntersectionObserver === 'undefined') {
      nodes.forEach(n => this.load(n.dataset.thumb, 192).then(u => { if (u && n.isConnected) n.innerHTML = `<img src="${u}" alt="">`; }));
      return;
    }
    if (!ex.io) {
      ex.io = new IntersectionObserver(entries => {
        for (const en of entries) {
          if (!en.isIntersecting) continue;
          const node = en.target;
          ex.io.unobserve(node);
          this.load(node.dataset.thumb, 192).then(u => { if (u && node.isConnected) node.innerHTML = `<img src="${u}" alt="">`; });
        }
      }, { root: ex.el.scroll, rootMargin: '160px' });
    }
    nodes.forEach(n => ex.io.observe(n));
  }
};

/* ==================== 26. 压缩 / 解压 / 导出（ZIP·TAR·GZ 原生；7z·RAR·XZ·BZ2 等由 7z-wasm 按需加载） ==================== */
const Archive = {
  kindOf(name) {
    const n = name.toLowerCase();
    if (n.endsWith('.zip')) return 'zip';
    if (/\.(tar\.gz|tgz)$/.test(n)) return 'tgz';
    if (n.endsWith('.tar')) return 'tar';
    if (n.endsWith('.gz')) return 'gz';
    return '7z';
  },
  stemOf(name) { return name.replace(/\.(tar\.gz|tar\.bz2|tar\.xz|tgz|tbz2?|txz|zip|7z|rar|tar|gz|bz2|xz|iso|cab|wim|lzh|arj)$/i, '') || name; },
  async destFor(path) {
    const parent = FS.parent(path);
    const name = await FS.uniq(parent, this.stemOf(FS.base(path)), true);
    return FS.join(parent, name);
  },
  async openArchive(path, opts = {}) {
    const dest = await this.destFor(path);
    const ok = await this.extract(path, dest);
    if (ok) { UI.toast(`已解压到「${FS.base(dest)}」`, 'ok'); Explorer.openAt(dest, opts); }
  },
  async extractHere(path) {
    const dest = await this.destFor(path);
    const ok = await this.extract(path, dest);
    if (ok) UI.toast(`已解压到「${FS.base(dest)}」`, 'ok');
    return ok;
  },
  async extract(path, dest) {
    const type = this.kindOf(FS.base(path));
    const busy = UI.busy('正在解压…');
    try {
      await FS.mkdir(dest, { recursive: true });
      if (type === 'zip') await this._extractZip(path, dest, busy);
      else if (type === 'tgz' || type === 'tar') await this._extractTar(path, dest, type === 'tgz', busy);
      else if (type === 'gz') {
        const out = await FS.uniq(FS.parent(path), this.stemOf(FS.base(path)));
        const raw = await this._gunzip(await FS.readBytes(path));
        await FS.write(FS.join(FS.parent(path), out), new Blob([raw], { type: mimeOf(out) }), { mtime: Date.now() });
        await FS.remove(dest, { recursive: true }).catch(() => {});
      }
      else await this._extract7z(path, dest, busy);
      return true;
    } catch (e) {
      UI.err(e, '解压失败：');
      await FS.remove(dest, { recursive: true }).catch(() => {});
      return false;
    } finally { busy.done(); }
  },
  async _extractZip(path, dest, busy) {
    const JSZip = await loadJSZip();
    const buf = await (await FS.read(path)).arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const ents = Object.values(zip.files);
    let i = 0;
    for (const ent of ents) {
      i++;
      const rel = ent.name.replace(/\\/g, '/').replace(/^\/+/, '').replace(/\/+$/, '');
      if (!rel || rel.split('/').some(s => s === '..')) continue;
      const target = FS.join(dest, rel);
      if (ent.dir) { await FS.mkdir(target, { recursive: true }).catch(() => {}); continue; }
      await FS.mkdir(FS.parent(target), { recursive: true }).catch(() => {});
      const u8 = await ent.async('uint8array');
      const mt = ent.date ? dosToLocal(ent.date).getTime() : Date.now();
      await FS.write(target, new Blob([u8], { type: mimeOf(rel) }), { mtime: mt });
      busy.set(`正在解压 ${rel}（${i}/${ents.length}）`, (i / ents.length) * 100);
    }
  },
  async _gunzip(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持 gzip 解压');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },
  _parseTar(u8) {
    const out = [];
    const dec = new TextDecoder('utf-8');
    const str = (o, n) => { let e = o; while (e < o + n && u8[e] !== 0) e++; return dec.decode(u8.subarray(o, e)); };
    const oct = (o, n) => parseInt(str(o, n).trim() || '0', 8) || 0;
    let off = 0, longName = null;
    while (off + 512 <= u8.length) {
      let name = str(off, 100);
      if (!name && u8[off] === 0) break;
      const size = oct(124, 12);
      const mtime = oct(136, 12) * 1000;
      const type = String.fromCharCode(u8[off + 156] || 48);
      const prefix = str(off + 345, 155);
      const data = u8.subarray(off + 512, off + 512 + size);
      off += 512 + Math.ceil(size / 512) * 512;
      if (type === 'L') { longName = dec.decode(data).replace(/\0+$/, ''); continue; }
      if (type === 'x' || type === 'g') continue;
      if (longName) { name = longName; longName = null; }
      else if (prefix) name = prefix + '/' + name;
      out.push({ name: name.replace(/^\.\//, '').replace(/\/+$/, ''), dir: type === '5', data, mtime });
    }
    return out;
  },
  async _extractTar(path, dest, gz, busy) {
    let bytes = await FS.readBytes(path);
    if (gz) bytes = await this._gunzip(bytes);
    const ents = this._parseTar(bytes);
    let i = 0;
    for (const e of ents) {
      i++;
      if (!e.name || e.name.split('/').some(s => s === '..')) continue;
      const target = FS.join(dest, e.name);
      if (e.dir) { await FS.mkdir(target, { recursive: true }).catch(() => {}); continue; }
      await FS.mkdir(FS.parent(target), { recursive: true }).catch(() => {});
      await FS.write(target, new Blob([e.data.slice()], { type: mimeOf(e.name) }), { mtime: e.mtime || Date.now() });
      busy.set(`正在解压 ${e.name}（${i}/${ents.length}）`, (i / ents.length) * 100);
    }
  },
  async _extract7z(path, dest, busy) {
    busy.set('正在加载解压引擎（首次使用需要下载，约数 MB）…');
    const mod = await Loader.module(SEVENZ_URLS);
    const factory = mod.default || mod;
    const sz = await factory({ print: () => {}, printErr: () => {} });
    const inName = '/in-' + U.uid() + '.' + (U.ext(path) || 'bin');
    const outDir = '/out-' + U.uid();
    sz.FS.writeFile(inName, await FS.readBytes(path));
    sz.FS.mkdir(outDir);
    busy.set('正在解压（引擎运行中）…');
    let rc = 0;
    try { rc = sz.callMain(['x', inName, '-o' + outDir, '-y']); }
    catch (e) { rc = typeof e === 'number' ? e : (e && e.status) || 1; }
    const files = [];
    const walk = (dir, rel) => {
      for (const n of sz.FS.readdir(dir)) {
        if (n === '.' || n === '..') continue;
        const p = dir + '/' + n;
        const st = sz.FS.stat(p);
        if (sz.FS.isDir(st.mode)) walk(p, rel + n + '/');
        else files.push({ rel: rel + n, data: sz.FS.readFile(p), mtime: st.mtime ? new Date(st.mtime).getTime() : Date.now() });
      }
    };
    try { walk(outDir, ''); } catch (e) { /* 空输出 */ }
    try { sz.FS.unlink(inName); } catch (e) { /* */ }
    if (rc && !files.length) throw new Error('解压引擎返回错误码 ' + rc + '，可能是加密或不支持的格式');
    let i = 0;
    for (const f of files) {
      i++;
      const target = FS.join(dest, f.rel);
      await FS.mkdir(FS.parent(target), { recursive: true }).catch(() => {});
      await FS.write(target, new Blob([f.data], { type: mimeOf(f.rel) }), { mtime: f.mtime });
      busy.set(`正在写入 ${f.rel}（${i}/${files.length}）`, (i / files.length) * 100);
    }
  },
  async _zipBlob(paths, busy) {
    const JSZip = await loadJSZip();
    const zip = new JSZip();
    const add = async (p, rel) => {
      const st = await FS.stat(p);
      if (!st) return;
      if (st.type === 'dir') {
        zip.folder(rel);
        for (const k of await FS.list(p)) await add(k.path, rel + '/' + k.name);
      } else {
        if (busy) busy.set(`正在打包 ${rel}`);
        const b = await FS.read(p);
        zip.file(rel, b, { date: localToZipDate(new Date(st.mtime || Date.now())), binary: true });
      }
    };
    for (const p of paths) await add(p, FS.base(p));

/* ==================== 27. 通用文件选择对话框 ==================== */
UI.pickFile = function (start, opt = {}) {
  return new Promise(resolve => {
    let cur = FS.norm(start || FS.home());
    let sel = null;
    const exts = opt.exts || null;
    const list = U.h('div', { style: { height: '300px', overflow: 'auto', border: '1px solid var(--ln)', borderRadius: '12px', padding: '6px', background: 'var(--bg2)' } });
    const where = U.h('div', { class: 'muted', style: { fontFamily: 'var(--f-mono)', fontSize: '12px', margin: '8px 0 0', wordBreak: 'break-all' } });
    const row = (name, icon, on, fn, dbl) => U.h('button', { class: 'mc-item' + (on ? ' sel' : ''), style: { width: '100%' }, onclick: fn, ondblclick: dbl || null }, Ico.el(icon), U.h('span', { class: 'nm' }, name));
    const render = async () => {
      where.textContent = '当前位置：' + cur;
      list.innerHTML = '';
      try {
        if (cur !== '/') list.appendChild(row('返回上一级', 'up', false, () => { sel = null; cur = FS.parent(cur); render(); }));
        const items = (await FS.list(cur)).filter(x => !x.name.startsWith('.') && (x.type === 'dir' || !exts || exts.includes(U.ext(x.name))));
        items.sort((a, b) => (a.type === b.type ? U.natCmp(a.name, b.name) : a.type === 'dir' ? -1 : 1));
        if (!items.length) list.appendChild(U.h('div', { class: 'empty' }, '这里没有可选的项目'));
        for (const it of items) {
          if (it.type === 'dir') list.appendChild(row(it.label || it.name, 'folder', false, () => { sel = null; cur = it.path; render(); }));
          else list.appendChild(row(it.name, Kind.icon(it.kind), sel === it.path, () => { sel = it.path; render(); }, () => { sel = it.path; done(); }));
        }
      } catch (e) { list.appendChild(U.h('div', { class: 'empty' }, e.message)); }
    };
    let finished = false;
    const done = () => { if (finished) return; finished = true; };
    this.modal({
      title: opt.title || '选择文件',
      body: U.h('div', {}, list, where),
      buttons: [{ label: '取消', value: null }, { label: opt.ok || '打开', primary: true, onClick: () => (sel ? sel : 'keep') }]
    }).then(v => resolve(v || null));
    render();
  });
};

    while (i < lines.length) {
      const ln = lines[i];
      if (/^```/.test(ln)) {
        closeList();
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;

        continue;

      const h = ln.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeList(); out.push(`<h${h[1].length}>${this.inline(h[2])}</h${h[1].length}>`); i++; continue; }

        i++; continue;
      }
      if (/^\s*$/.test(ln)) { closeList(); i++; continue; }
      closeList();
      out.push('<p>' + this.inline(ln) + '</p>');
      i++;

const Fmt = {
  json(s) { return JSON.stringify(JSON.parse(s), null, 2) + '\n'; },
  css(s) {
    let out = '', depth = 0, line = '', str = null, cm = false;
    const ind = () => '  '.repeat(Math.max(0, depth));
    const flush = () => { const t = line.trim(); if (t) out += ind() + t + '\n'; line = ''; };
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (cm) { line += c; if (c === '*' && s[i + 1] === '/') { line += '/'; i++; cm = false; } continue; }
      if (str) { line += c; if (c === '\\') { line += s[++i] || ''; continue; } if (c === str) str = null; continue; }
      if (c === '/' && s[i + 1] === '*') { cm = true; line += '/*'; i++; continue; }
      if (c === '"' || c === "'") { str = c; line += c; continue; }
      if (c === '{') { line = line.replace(/\s+$/, '') + ' {'; flush(); depth++; continue; }
      if (c === '}') { flush(); depth--; out += ind() + '}\n'; continue; }
      if (c === ';') { line += ';'; flush(); continue; }
      if (c === '\n') { flush(); continue; }
      line += c;
    }
    flush();

  },
  js(s) {

    for (let i = 0; i < s.length; i++) {

      if (cmt === 'block') { line += c; if (c === '*' && n === '/') { line += '/'; i++; cmt = null; } continue; }
      if (str) { line += c; if (c === '\\') { line += s[++i] || ''; continue; } if (c === str) str = null; continue; }
      if (c === '/' && n === '/') { cmt = 'line'; line += '//'; i++; continue; }
      if (c === '/' && n === '*') { cmt = 'block'; line += '/*'; i++; continue; }
      if (c === '"' || c === "'" || c === '`') { str = c; line += c; continue; }

      if (c === ')') { par = Math.max(0, par - 1); line += c; continue; }

      if (c === '}') { flush(); depth--; out += ind() + '}\n'; continue; }
      if (c === ';') { line += ';'; flush(); continue; }

      line += c;

  html(s) {

    const RAW_IND = new Set(['script', 'style']);
    const RAW_KEEP = new Set(['pre', 'textarea']);
    const src = s.replace(/\r\n/g, '\n');
    let out = '', depth = 0, i = 0;
    const ind = d => '  '.repeat(Math.max(0, d));

        depth++;

      const nx = src.indexOf('<', i);
      const end = nx < 0 ? src.length : nx;
      const txt = src.slice(i, end).trim();
      if (txt) out += ind(depth) + txt.replace(/\s+/g, ' ') + '\n';
      i = end;
    }

  },

/* ==================== 38. 虚拟机（v86 0.5.319，版本锁定；无内置镜像，用户自备） ==================== */
const VM_URLS = {
  lib: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',
  wasm: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
  bios: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
  vgabios: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
};
const VM_SCREEN_HTML = '<div style="white-space: pre; font: 14px monospace; line-height: 14px"></div><canvas style="display: none"></canvas>';
const VM = {
  open(opts = {}) {
    const win = WM.create({ app: 'vm', title: '虚拟机', icon: 'chip', w: 880, h: 600, minW: 420, minH: 360 });
    win.data.vm = new VMApp(win, opts.path);
    return win;
  }
};
class VMApp {
  constructor(win, path) {
    this.win = win; this.emu = null; this.disk = null; this.destroyed = false;
    this.mem = Cfg.d.vm.mem || 256;
    this.build();
    win.onClose(() => this.destroy());
    this._plH = () => {
      if (this.destroyed) return;
      const locked = !!document.pointerLockElement;
      if (this.emu) this.setStatus(locked ? '鼠标已锁定，按 Esc 释放' : '运行中');
    };
    document.addEventListener('pointerlockchange', this._plH);
    if (path) this.setDisk(path);
    else this.setStatus('请选择或导入一个磁盘镜像');
  }
  build() {
    const B = (icon, label, fn, cls = '') => U.h('button', { class: 'btn sm ' + cls, onclick: fn }, Ico.el(icon), U.h('span', {}, label));
    this.diskLb = U.h('span', { class: 'vm-disk' }, '未选择镜像');
    this.memSel = U.h('select', { class: 'inp he-sel', title: '分配给虚拟机的内存', onchange: e => { this.mem = +e.target.value; Cfg.d.vm.mem = this.mem; Cfg.saveSoon(); } },
      [128, 256, 512].map(v => U.h('option', { value: String(v), selected: v === this.mem ? true : null }, v + ' MB 内存')));
    this.statusEl = U.h('span', { class: 'vm-status' }, '就绪');
    this.bar = U.h('div', { class: 'vm-bar' },
      B('folder', '选择镜像', () => this.pick()),
      B('upload', '导入镜像', () => this.importLocal()),
      B('play', '启动', () => this.start(), 'pri'),
      B('pause', '停止', () => this.stop(false)),
      B('refresh', '重启', () => this.restart()),
      B('mouse', '锁定鼠标', () => this.lockMouse()),
      B('fullscreen', '全屏', () => this.fullscreen()),
      this.memSel, this.diskLb, this.statusEl);
    this.screen = U.h('div', { id: 'screen_container', class: 'vm-screen' });
    this.screen.innerHTML = VM_SCREEN_HTML;
    this.veil = U.h('div', { class: 'vm-veil' }, U.h('span', { class: 'ld-big' }), U.h('span', { class: 'vt' }, '虚拟机待机'), U.h('small', { class: 'vh' }, '选择镜像后点击“启动”'));
    this.stage = U.h('div', { class: 'vm-stage' }, this.screen, this.veil);
    this.hint = U.h('div', { class: 'vm-hint' }, '本系统不内置任何操作系统镜像，请使用你自己合法获得的 ISO / IMG / FDA / BIN 镜像。镜像仅在本机内存中运行，不会上传。');
    this.root = U.h('div', { class: 'vm' }, this.bar, this.stage, this.hint);
    this.win.body.appendChild(this.root);
  }
  showVeil(on, title, sub) {
    this.veil.classList.toggle('off', !on);
    if (title != null) this.veil.querySelector('.vt').textContent = title;
    if (sub != null) this.veil.querySelector('.vh').textContent = sub;
  }
  setStatus(t) { if (this.statusEl) this.statusEl.textContent = t; }
  setDisk(path) {
    this.disk = { path, name: FS.base(path), ext: U.ext(path) };
    this.diskLb.textContent = this.disk.name;
    this.setStatus('已选择镜像，点击“启动”');
    this.showVeil(true, '准备就绪', `镜像：${this.disk.name}（${this.disk.ext === 'iso' ? '光驱' : ['img', 'fda', 'bin'].includes(this.disk.ext) ? '软盘' : '硬盘'}方式挂载）`);
  }
  pick() {
    UI.pickFile(FS.home('Documents'), { title: '选择磁盘镜像', exts: ['iso', 'img', 'fda', 'bin', 'vhd'] }).then(p => { if (p) this.setDisk(p); });
  }
  importLocal() {
    const inp = U.h('input', { type: 'file', accept: '.iso,.img,.fda,.bin,.vhd' });
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      try {
        const dir = FS.join(FS.home('.system'), 'vm');
        await FS.mkdir(dir, { recursive: true }).catch(() => {});
        const name = await FS.uniq(dir, f.name);
        const busy = UI.busy('正在导入镜像到虚拟文件系统…');
        try { await FS.write(FS.join(dir, name), f, { mtime: f.lastModified || Date.now() }); }
        finally { busy.done(); }
        this.setDisk(FS.join(dir, name));
        UI.toast('镜像已导入', 'ok');
      } catch (e) { UI.err(e, '导入失败：'); }
    });
    inp.click();
  }
  async start() {
    if (!this.disk) return UI.toast('请先选择或导入磁盘镜像', 'warn');
    this.stop(true);
    this.showVeil(true, 'v86 内核加载中…', '首次使用需下载内核与 BIOS（数 MB），请稍候');
    this.setStatus('加载中…');
    try {
      await Loader.script([VM_URLS.lib]);
      const Ctor = window.V86Starter || window.V86;
      if (typeof Ctor !== 'function') throw new Error('v86 内核未就绪');
      const buf = await (await FS.read(this.disk.path)).arrayBuffer();
      const ext = this.disk.ext;
      const opts = {
        wasm_path: VM_URLS.wasm,
        memory_size: this.mem * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container: this.screen,
        bios: { url: VM_URLS.bios },
        vga_bios: { url: VM_URLS.vgabios },
        autostart: true
      };
      if (ext === 'iso') opts.cdrom = { buffer: buf };
      else if (ext === 'img' || ext === 'fda' || ext === 'bin') opts.fda = { buffer: buf };
      else opts.hda = { buffer: buf };
      const emu = new Ctor(opts);
      this.emu = emu;
      if (typeof emu.add_listener === 'function') {
        emu.add_listener('download-progress', e => { if (e && e.total) this.showVeil(true, `正在加载资源 ${Math.round((e.loaded / e.total) * 100)}%`); });
        emu.add_listener('emulator-ready', () => { this.showVeil(false); this.setStatus('运行中'); });
      }
      clearTimeout(this._readyT);
      this._readyT = setTimeout(() => { if (this.emu === emu) { this.showVeil(false); this.setStatus('运行中'); } }, 12000);
      this.setStatus('启动中…');
    } catch (e) {
      this.emu = null;
      this.showVeil(true, '启动失败', e.message);
      this.setStatus('启动失败');
      UI.err(e, '虚拟机启动失败：');
    }
  }
  stop(silent) {
    clearTimeout(this._readyT);
    const emu = this.emu;
    this.emu = null;
    if (emu) {
      try { if (typeof emu.stop === 'function') emu.stop(); } catch (e) { /* */ }
      try { if (typeof emu.destroy === 'function') emu.destroy(); } catch (e) { /* */ }
    }
    if (!this.screen) return;
    this.screen.innerHTML = VM_SCREEN_HTML;
    if (!silent) { this.setStatus('已停止'); this.showVeil(true, '虚拟机已停止', '点击“启动”重新开机'); }
  }
  restart() { if (this.disk) this.start(); }
  lockMouse() {
    if (this.emu && typeof this.emu.lock_mouse === 'function') { try { this.emu.lock_mouse(); } catch (e) { /* */ } }
    else if (this.screen.requestPointerLock) { try { this.screen.requestPointerLock(); } catch (e) { /* */ } }
    this.setStatus('鼠标已锁定，按 Esc 释放');
  }
  fullscreen() {
    if (this.screen.requestFullscreen) this.screen.requestFullscreen().catch(() => UI.toast('浏览器拒绝了全屏请求', 'warn'));
  }
  destroy() {
    this.destroyed = true;
    document.removeEventListener('pointerlockchange', this._plH);
    this.stop(true);
  }
}

/* ==================== 39. 本地文件夹挂载（File System Access，句柄持久化，启动时提示重新授权） ==================== */
const Mounts = {
  pending: [],
  async add() {
    if (typeof window.showDirectoryPicker !== 'function') { UI.toast('当前浏览器不支持本地文件夹挂载，请使用桌面版 Chrome / Edge', 'err'); return false; }
    let h;
    try { h = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { return false; }
    const busy = UI.busy('正在挂载本地文件夹…');
    try {
      const name = FS.uniqMountName(h.name);
      FS.addMount(name, h);
      await this.persist();
      UI.toast(`已挂载「${name}」，位于 /mnt/local/${name}`, 'ok');
      return true;
    } catch (e) { UI.err(e, '挂载失败：'); return false; }
    finally { busy.done(); }
  },
  async persist() {
    const live = [...FS.mounts.entries()].map(([name, be]) => ({ name, handle: be.h, at: be.addedAt }));
    const pend = this.pending.map(p => ({ name: p.name, handle: p.handle, at: p.at }));
    try { await DB.put('kv', { k: 'mounts', v: [...live, ...pend] }); } catch (e) { console.warn('挂载信息保存失败', e); }
  },
  forgetByName(name) {
    this.pending = this.pending.filter(p => p.name !== name);
    this.persist();
  },
  async restore() {
    let saved = null;
    try { const rec = await DB.get('kv', 'mounts'); saved = rec && rec.v; } catch (e) { saved = null; }
    if (!Array.isArray(saved) || !saved.length) return;
    for (const item of saved) {
      if (!item || !item.handle) continue;
      if (FS.mounts.has(item.name)) continue;
      try {
        const perm = await item.handle.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') FS.addMount(item.name, item.handle);
        else this.pending.push(item);
      } catch (e) { this.pending.push(item); }
    }
    if (this.pending.length) {
      UI.toast(`有 ${this.pending.length} 个本地文件夹需要重新授权，可在“设置 → 本地挂载”中一键恢复`, 'warn');
    }
    Bus.emit('mounts');
  },
  async reauth(p) {
    try {
      const perm = await p.handle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { UI.toast('未授予权限', 'warn'); return false; }
      this.pending = this.pending.filter(x => x !== p);
      FS.addMount(p.name, p.handle);
      await this.persist();
      UI.toast(`已重新挂载「${p.name}」`, 'ok');
      return true;
    } catch (e) { UI.err(e, '重新授权失败：'); return false; }
  }
};

/* ==================== 42. 启动流程（无假加载动画，直接进入桌面） ==================== */
async function boot() {
  Cfg.load();
  Theme.apply();
  Menu.init();
  Taskbar.init();
  Shell.initKeys();
  window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    if (r && r.code) UI.err(r);
    else console.warn('未处理的异步错误', r);
    e.preventDefault();
  });
  window.addEventListener('error', e => { console.warn('脚本错误', e.message); });
  window.addEventListener('pagehide', () => { try { Meta.flush(); Cfg.save(); } catch (e) { /* */ } });
  window.addEventListener('resize', U.debounce(() => {
    const mobile = U.isMobile();
    for (const w of WM.wins.values()) w.el.classList.toggle('m-full', mobile);
    WM.relayout();
    Start.hide();
  }, 120));
  try { await FS.init(); }
  catch (e) { console.error(e); UI.toast('存储初始化失败，已进入临时模式', 'warn'); }
  if (!FS.be.opfs && Cfg.d.primary === 'opfs') Cfg.d.primary = 'idb';
  if (FS.be.idb && !FS.be.idb.persist) UI.toast('当前环境无法使用 IndexedDB，数据仅在本次会话中保留', 'warn');
  if (!FS.be.opfs && FS.be.idb && FS.be.idb.persist) UI.toast('当前环境不支持 OPFS（需要 HTTPS 或 localhost），已使用 IndexedDB 存储', 'warn');
  await seedDemo();
  try { await FS.ensureHome(); } catch (e) { /* */ }
  Desk.init();
  Desk.render();
  Clock.start();
  Start.build();
  Mounts.restore();
  Bus.on('settings', () => { Theme.apply(); Desk.schedule(); });
  Bus.on('mounts', () => { Desk.schedule(); });
  Wall.apply();
}
boot().catch(err => { console.error(err); UI.toast('系统启动时出现问题：' + (err && err.message), 'err'); });
