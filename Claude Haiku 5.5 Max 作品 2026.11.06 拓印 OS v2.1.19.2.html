}

/* ==================== 8. 统一文件系统 fs（VFS 路由层） ==================== */
/* 路径约定：/opfs/...  私有文件（OPFS）｜ /idb/... 数据库文件（IndexedDB）｜ /mnt/local/<名称>/... 本地挂载 */
const FS = {
  be: { opfs: null, idb: null },
  mounts: new Map(),
  scache: new Map(),
  locks: new Map(),
  ready: false,
  async init() {
    if (navigator.storage && navigator.storage.getDirectory) {
      try {
        const root = await navigator.storage.getDirectory();
        await probeOPFS(root);
        this.be.opfs = new HandleBackend(root, 'opfs', '私有文件 (OPFS)');
      } catch (e) { console.warn('OPFS 不可用，已降级', e); this.be.opfs = null; }
    }
    try {
      await DB.open();
      this.be.idb = new NodeBackend(new IDBNodes(), 'idb', '数据库 (IndexedDB)', true);
    } catch (e) {
      console.warn('IndexedDB 不可用，降级为内存存储', e);
      this.be.idb = new NodeBackend(new MemNodes(), 'idb', '内存 (临时)', false);
    }
    if (!this.be.opfs) Cfg.d.primary = 'idb';
    await Meta.load();
    this.ready = true;
  },
  primary() { return Cfg.d.primary === 'opfs' && this.be.opfs ? 'opfs' : 'idb'; },
  home(sub) { return '/' + this.primary() + (sub ? '/' + sub : ''); },
  desk() { return this.home('Desktop'); },
  norm(p) {
    const out = [];
    for (const seg of String(p || '/').split('/')) { if (!seg || seg === '.') continue; if (seg === '..') out.pop(); else out.push(seg); }
    return '/' + out.join('/');
  },
  join(d, n) { return (d === '/' ? '' : d.replace(/\/+$/, '')) + '/' + n; },
  parent(p) { if (!p || p === '/') return '/'; const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); },
  base(p) { if (!p || p === '/') return '/'; return p.slice(p.lastIndexOf('/') + 1); },
  isUnder(p, dir) { return p === dir || p.startsWith(dir === '/' ? '/' : dir + '/'); },
  resolve(p) {
    p = this.norm(p);
    if (p === '/') return { kind: 'virt', path: '/' };
    const segs = p.slice(1).split('/');
    const head = segs[0], rest = segs.slice(1);
    if (head === 'opfs' || head === 'idb') {
      const be = this.be[head];
      if (!be) throw fsErr('ENOTSUP', p);
      return { kind: 'node', path: p, be, rel: rest.join('/') };
    }
    if (head === 'mnt') {
      if (!rest.length || rest[0] !== 'local') { if (!rest.length) return { kind: 'virt', path: p }; throw fsErr('ENOENT', p); }
      if (rest.length === 1) return { kind: 'virt', path: p };
      const be = this.mounts.get(rest[1]);
      if (!be) throw fsErr('ENOENT', p);
      return { kind: 'node', path: p, be, rel: rest.slice(2).join('/'), mount: rest[1] };
    }
    throw fsErr('ENOENT', p);
  },
  _virtChildren(p) {
    if (p === '/') {
      const out = [];
      if (this.be.opfs) out.push({ name: 'opfs', path: '/opfs', label: this.be.opfs.label, type: 'dir', size: 0, mtime: 0 });
      if (this.be.idb && (Cfg.d.showIdb || this.primary() === 'idb')) out.push({ name: 'idb', path: '/idb', label: this.be.idb.label, type: 'dir', size: 0, mtime: 0 });
      out.push({ name: 'mnt', path: '/mnt', label: '挂载点', type: 'dir', size: 0, mtime: 0 });
      return out;
    }
    if (p === '/mnt') return [{ name: 'local', path: '/mnt/local', label: '本地文件夹', type: 'dir', size: 0, mtime: 0 }];
    if (p === '/mnt/local') return [...this.mounts.entries()].map(([name, be]) => ({ name, path: '/mnt/local/' + name, label: name, type: 'dir', size: 0, mtime: be.addedAt || 0, mount: true }));
    return [];
  },
  _mk(path, nat) {
    const rec = Meta.get(path);
    const mtime = rec && rec.n === nat.mtime ? rec.m : nat.mtime;
    const name = this.base(path);
    return { path, name, type: nat.type, size: nat.type === 'file' ? nat.size || 0 : 0, mtime, kind: Kind.of(name, nat.type), virt: false, mount: false };
  },
  async stat(p) {
    const r = this.resolve(p);
    if (r.kind === 'virt') {
      if (r.path === '/') return { path: '/', name: '此电脑', label: '此电脑', type: 'dir', size: 0, mtime: 0, kind: 'dir', virt: true, mount: false };
      const meta = this._virtChildren(this.parent(r.path)).find(x => x.path === r.path);
      return { path: r.path, name: this.base(r.path), label: meta ? meta.label : this.base(r.path), type: 'dir', size: 0, mtime: meta ? meta.mtime : 0, kind: 'dir', virt: true, mount: !!(meta && meta.mount) };
    }
    const nat = await r.be.stat(r.rel);
    if (!nat) return null;
    return this._mk(r.path, nat);
  },
  async exists(p) { try { return !!(await this.stat(p)); } catch (e) { return false; } },
  async list(p) {
    const r = this.resolve(p);
    if (r.kind === 'virt') return this._virtChildren(r.path).map(x => ({ path: x.path, name: x.name, label: x.label, type: 'dir', size: 0, mtime: x.mtime || 0, kind: 'dir', virt: true, mount: !!x.mount }));
    let raw;
    try { raw = await r.be.list(r.rel); } catch (e) { throw wrapErr(e); }
    return raw.map(c => this._mk(this.join(r.path, c.name), c));
  },
  _node(p) { const r = this.resolve(p); if (r.kind !== 'node') throw fsErr('EPERM', p); return r; },
  async read(p) {
    const r = this._node(p);
    if (!r.rel) throw fsErr('EISDIR', p);
    try { return await r.be.read(r.rel); } catch (e) { throw wrapErr(e); }
  },
  async readText(p) { const b = await this.read(p); return b.text(); },
  async readBytes(p) { const b = await this.read(p); return new Uint8Array(await b.arrayBuffer()); },
  async write(p, data, opts = {}) {
    const r = this._node(p);
    if (!r.rel) throw fsErr('EPERM', p);
    const pdir = this.parent(r.path);
    const blob = data instanceof Blob ? data : new Blob([data], { type: mimeOf(this.base(p)) });
    await this._lock(r.path, async () => {
      const pst = await this.stat(pdir);
      if (!pst) throw fsErr('ENOENT', pdir);
      if (pst.type !== 'dir') throw fsErr('ENOTDIR', pdir);
      const cur = await r.be.stat(r.rel);
      if (cur && cur.type === 'dir') throw fsErr('EISDIR', p);
      let nat;
      try { nat = await r.be.write(r.rel, blob, { mtime: opts.mtime }); } catch (e) { throw wrapErr(e); }
      if (opts.mtime && nat !== opts.mtime) Meta.set(r.path, opts.mtime, nat);
      else Meta.del(r.path);
    });
    await this._touchDir(pdir);
    this._changed([p]);
  },
  async _touchDir(p) {
    try {
      const r = this.resolve(p);
      if (r.kind !== 'node' || !r.rel) return;
      const nat = await r.be.stat(r.rel);
      if (nat) Meta.set(r.path, Date.now(), nat.mtime);
    } catch (e) { /* 忽略 */ }
  },
  async _setMtime(p, m) {
    const r = this.resolve(p);
    if (r.kind !== 'node') return;
    const nat = await r.be.stat(r.rel);
    if (nat) Meta.set(r.path, m, nat.mtime);
  },
  async mkdir(p, opts = {}) {
    const norm = this.norm(p);
    if (opts.recursive) {
      let cur = '';
      for (const s of norm.slice(1).split('/')) {
        cur = cur + '/' + s;
        const st = await this.stat(cur).catch(() => null);
        if (!st) await this._mkOne(cur);
        else if (st.type !== 'dir') throw fsErr('EEXIST', cur);
      }
      return;
    }
    await this._mkOne(norm);
  },
  async _mkOne(p) {
    const r = this._node(p);
    if (!r.rel) return;
    await this._lock(r.path, async () => {
      const ex = await r.be.stat(r.rel);
      if (ex) { if (ex.type === 'dir') return; throw fsErr('EEXIST', p); }
      const pp = this.parent(p);
      const pst = await this.stat(pp);
      if (!pst) throw fsErr('ENOENT', pp);
      if (pst.type !== 'dir') throw fsErr('ENOTDIR', pp);
      try { await r.be.mkdir(r.rel); } catch (e) { throw wrapErr(e); }
      const nat = await r.be.stat(r.rel);
      Meta.set(r.path, Date.now(), nat ? nat.mtime : 0);
    });
    await this._touchDir(this.parent(p));
    this._changed([p]);
  },
  async remove(p, opts = {}) {
    const r = this._node(p);
    if (!r.rel) throw fsErr('EPERM', p);
    await this._lock(r.path, async () => {
      const st = await r.be.stat(r.rel);
      if (!st) throw fsErr('ENOENT', p);
      if (st.type === 'dir' && !opts.recursive) {
        const kids = await r.be.list(r.rel);
        if (kids.length) throw fsErr('ENOTEMPTY', p);
      }
      try { await r.be.remove(r.rel); } catch (e) { throw wrapErr(e); }
      Meta.delTree(r.path);
    });
    await this._touchDir(this.parent(p));
    this._changed([p]);
  },
  async move(src, dst) {
    src = this.norm(src); dst = this.norm(dst);
    if (src === dst) return;
    if (this.isUnder(dst, src)) throw fsErr('EINVAL', dst);
    const sr = this._node(src), dr = this._node(dst);
    const st = await this.stat(src);
    if (!st) throw fsErr('ENOENT', src);
    if (await this.exists(dst)) throw fsErr('EEXIST', dst);
    const dpst = await this.stat(this.parent(dst));
    if (!dpst || dpst.type !== 'dir') throw fsErr('ENOENT', this.parent(dst));
    if (sr.be === dr.be && sr.rel && dr.rel) {
      let ok = false;
      await this._lock(src, async () => {
        try { ok = await sr.be.move(sr.rel, dr.rel); } catch (e) { ok = false; }
        if (ok) {
          Meta.rekeyTree(src, dst);
          await this._setMtime(dst, st.mtime);
        }
      });
      if (ok) {
        await this._touchDir(this.parent(src));
        await this._touchDir(this.parent(dst));
        this._changed([src, dst]);
        return;
      }
    }
    await this.copy(src, dst);
    await this.remove(src, { recursive: true });
  },
  async copy(src, dst) {
    src = this.norm(src); dst = this.norm(dst);
    if (src === dst) return;
    if (this.isUnder(dst, src)) throw fsErr('EINVAL', dst);
    const st = await this.stat(src);
    if (!st) throw fsErr('ENOENT', src);
    if (st.type === 'dir') {
      if (!(await this.exists(dst))) await this.mkdir(dst);
      for (const c of await this.list(src)) await this.copy(c.path, this.join(dst, c.name));
      await this._setMtime(dst, st.mtime);
      this._changed([dst]);
    } else {
      const blob = await this.read(src);
      await this.write(dst, blob, { mtime: st.mtime });
    }
  },
  async du(p) {
    p = this.norm(p);
    if (this.scache.has(p)) return this.scache.get(p);
    const st = await this.stat(p);
    if (!st) return 0;
    let total = 0;
    if (st.type === 'file') total = st.size;
    else {
      let level = [p];
      while (level.length) {
        const lists = await Promise.all(level.map(d => this.list(d).catch(() => [])));
        const next = [];
        for (const items of lists) for (const it of items) {
          if (it.type === 'dir') { if (!it.virt) next.push(it.path); }
          else total += it.size;
        }
        level = next;
      }
    }
    this.scache.set(p, total);
    return total;
  },
  async search(root, q, opts = {}) {
    const out = [], lim = opts.limit || 1500, ql = q.toLowerCase();
    let level = [this.norm(root)], scanned = 0;
    while (level.length) {
      if (opts.signal && opts.signal.aborted) break;
      const lists = await Promise.all(level.map(d => this.list(d).catch(() => [])));
      const next = [];
      for (const items of lists) for (const it of items) {
        scanned++;
        if (it.name.toLowerCase().includes(ql)) { out.push(it); if (out.length >= lim) return out; }
        if (it.type === 'dir' && !it.virt) next.push(it.path);
      }
      if (opts.onProgress) opts.onProgress({ scanned, found: out.length, dir: level[0] });
      level = next;
      await U.sleep(0);
    }
    return out;
  },
  async uniq(dir, name, isDir = false) {
    let base = name, ext = '';
    if (!isDir) { const i = name.lastIndexOf('.'); if (i > 0) { base = name.slice(0, i); ext = name.slice(i); } }
    let cand = name, n = 2;
    while (await this.exists(this.join(dir, cand))) { cand = `${base} (${n})${ext}`; n++; }
    return cand;
  },
  _changed(paths) {
    for (const p of paths) {
      let cur = p;
      for (;;) { this.scache.delete(cur); if (cur === '/') break; cur = this.parent(cur); }
    }
    Bus.emit('fs', { paths });
  },
  async _lock(key, fn) {
    const prev = this.locks.get(key) || Promise.resolve();
    let release;
    const gate = new Promise(r => { release = r; });
    const tail = prev.then(() => gate);
    this.locks.set(key, tail);
    await prev;
    try { return await fn(); }
    finally { release(); if (this.locks.get(key) === tail) this.locks.delete(key); }
  },
  addMount(name, handle) {
    const be = new HandleBackend(handle, 'mnt', name);
    be.addedAt = Date.now();
    this.mounts.set(name, be);
    this.scache.clear();
    Bus.emit('mounts');
    Bus.emit('fs', { paths: ['/mnt/local'] });
    return be;
  },
  removeMount(name) {
    this.mounts.delete(name);
    this.scache.clear();
    Bus.emit('mounts');
    Bus.emit('fs', { paths: ['/mnt/local'] });
  },
  uniqMountName(name) {
    const n = name || '本地文件夹';
    let c = n, i = 2;
    while (this.mounts.has(c)) { c = `${n} (${i})`; i++; }
    return c;
  },
  async ensureHome() {
    for (const root of ['opfs', 'idb']) {
      if (!this.be[root]) continue;
      for (const d of ['Desktop', 'Documents', 'Downloads', 'Pictures', 'Music', 'Videos', '.system']) {
        try { await this.mkdir('/' + root + '/' + d); } catch (e) { /* 已存在 */ }
      }
    }
  }
};

/* ==================== 9. 反馈：提示 / 弹窗 / 忙碌指示 ==================== */
const UI = {
  toast(msg, kind = '') {
    const box = $('#toasts');
    const el = U.h('div', { class: 'toast ' + kind }, U.h('i'), U.h('span', {}, msg));
    box.appendChild(el);
    while (box.children.length > 4) box.firstElementChild.remove();
    setTimeout(() => {
      el.style.transition = 'opacity .3s ease, transform .3s ease';
      el.style.opacity = '0'; el.style.transform = 'translateY(-8px)';
      setTimeout(() => el.remove(), 320);
    }, kind === 'err' ? 4600 : 2400);
  },
  err(e, prefix = '') { this.toast(prefix + ((e && e.message) || String(e)), 'err'); },
  _p(msg) { const p = U.h('p', {}); p.textContent = msg; return p; },
  modal(opts = {}) {
    return new Promise(resolve => {
      const layer = U.h('div', { class: 'layer' });
      const box = U.h('div', { class: 'modal', role: 'dialog' });
      if (opts.width) box.style.width = opts.width;
      const bodyEl = U.h('div', { class: 'modal-b' });
      if (typeof opts.body === 'string') bodyEl.innerHTML = opts.body;
      else if (opts.body) bodyEl.appendChild(opts.body);
      const foot = U.h('div', { class: 'modal-f' });
      const buttons = opts.buttons || [{ label: '确定', value: true, primary: true }];
      let done = false;
      const close = v => {
        if (done) return;
        done = true;
        document.removeEventListener('keydown', onKey, true);
        layer.remove();
        resolve(v);
      };
      const press = b => {
        let v = b.value;
        if (b.onClick) { v = b.onClick(close); if (v === 'keep') return; }
        close(v === undefined ? true : v);
      };
      const onKey = e => {
        if (done) return;
        if (e.key === 'Escape' && opts.dismissable !== false) { e.preventDefault(); e.stopPropagation(); close(null); }
        else if (e.key === 'Enter' && !e.isComposing && e.target.tagName !== 'TEXTAREA') {
          const pri = buttons.find(b => b.primary);
          if (pri) { e.preventDefault(); e.stopPropagation(); press(pri); }
        }
      };
      for (const b of buttons) {
        const cls = 'btn' + (b.danger && b.primary ? ' dangerfill' : b.primary ? ' pri' : b.danger ? ' danger' : '');
        const btn = U.h('button', { class: cls }, b.icon ? Ico.el(b.icon) : null, b.label);
        btn.addEventListener('click', () => press(b));
        foot.appendChild(btn);
      }
      box.append(opts.title ? U.h('div', { class: 'modal-h' }, opts.title) : null, bodyEl, foot);
      layer.appendChild(box);
      layer.addEventListener('pointerdown', e => { if (e.target === layer && opts.dismissable !== false) close(null); });
      $('#layer-root').appendChild(layer);
      document.addEventListener('keydown', onKey, true);
      if (opts.onMount) opts.onMount(box, close);
      setTimeout(() => {
        const f = box.querySelector('input,select,textarea') || box.querySelector('.btn.pri') || box.querySelector('.btn');
        if (f) { f.focus(); if (f.tagName === 'INPUT' && f.select) f.select(); }
      }, 40);
    });
  },
  alert(msg, title = '提示') { return this.modal({ title, body: this._p(msg), buttons: [{ label: '好的', primary: true, value: true }] }); },
  confirm(msg, title = '确认', opt = {}) {
    return this.modal({
      title, body: this._p(msg),
      buttons: [{ label: '取消', value: false }, { label: opt.ok || '确定', primary: true, danger: !!opt.danger, value: true }]
    }).then(v => v === true);
  },
  prompt(title, value = '', hint = '', okLabel = '确定') {
    const inp = U.h('input', { class: 'inp', value: value, spellcheck: 'false', autocomplete: 'off' });
    const body = U.h('div', {}, inp, hint ? U.h('p', { class: 'muted', style: { margin: '10px 0 0', fontSize: '12px' } }, hint) : null);
    return this.modal({
      title, body,
      buttons: [{ label: '取消', value: null }, { label: okLabel, primary: true, onClick: () => inp.value.trim() || 'keep' }]
    });
  },
  pickFolder(start, title = '选择文件夹') {
    return new Promise(resolve => {
      let cur = FS.norm(start || FS.desk());
      const list = U.h('div', { style: { height: '260px', overflow: 'auto', border: '1px solid var(--ln)', borderRadius: '12px', padding: '6px', background: 'var(--bg2)' } });
      const pathEl = U.h('div', { class: 'muted', style: { fontFamily: 'var(--f-mono)', fontSize: '12px', margin: '8px 0 0', wordBreak: 'break-all' } });
      const row = (name, fn, icon = 'folder') => U.h('button', { class: 'mc-item', style: { width: '100%' }, onclick: fn }, Ico.el(icon), U.h('span', { class: 'nm' }, name));
      const render = async () => {
        pathEl.textContent = '当前位置：' + cur;
        list.innerHTML = '';
        try {
          if (cur !== '/') list.appendChild(row('返回上一级', () => { cur = FS.parent(cur); render(); }, 'up'));
          const items = (await FS.list(cur)).filter(x => x.type === 'dir' && !x.name.startsWith('.'));
          if (!items.length) list.appendChild(U.h('div', { class: 'empty' }, '这里没有子文件夹'));
          for (const it of items) list.appendChild(row(it.label || it.name, () => { cur = it.path; render(); }));
        } catch (e) { list.appendChild(U.h('div', { class: 'empty' }, e.message)); }
      };
      this.modal({
        title, body: U.h('div', {}, list, pathEl),
        buttons: [{ label: '取消', value: null }, { label: '选择此文件夹', primary: true, onClick: () => cur }]
      }).then(resolve);
      render();
    });
  },
  busy(text = '处理中…') {
    const root = $('#busy-root');
    const txt = U.h('div', { class: 'busy-txt' }, text);
    const bar = U.h('b');
    const el = U.h('div', { class: 'busy' }, U.h('div', { class: 'busy-row' }, U.h('span', { class: 'seal-ld' }), txt), U.h('div', { class: 'busy-bar' }, bar));
    root.appendChild(el);
    const restack = () => { let i = 0; for (const b of root.children) { b.style.bottom = `calc(var(--tb-h) + 14px + ${i * 64}px)`; i++; } };
    restack();
    return {
      set(t, pct) {
        if (t != null) txt.textContent = t;
        if (pct != null) { bar.classList.add('det'); bar.style.width = Math.max(2, Math.min(100, pct)) + '%'; }
      },
      done() { el.remove(); restack(); }
    };
  }
};

/* ==================== 10. 右键菜单 ==================== */
const Menu = {
  show(x, y, items) {
    const el = $('#ctx');
    el.innerHTML = '';
    const build = (list, container) => {
      for (const it of list) {
        if (!it) continue;
        if (it === '-') { container.appendChild(U.h('div', { class: 'ctx-sep' })); continue; }
        if (it.hidden) continue;
        const btn = U.h('button', { class: 'ctx-i' + (it.danger ? ' danger' : '') + (it.sub ? ' sub' : ''), disabled: it.disabled ? true : null },
          it.icon ? Ico.el(it.icon) : U.h('span', { style: { width: '16px', flex: 'none' } }),
          U.h('span', {}, it.label),
          it.hint ? U.h('span', { class: 'k' }, it.hint) : null,
          it.sub ? U.h('span', { class: 'ar' }, Ico.el('chev')) : null);
        container.appendChild(btn);
        if (it.sub) {
          const wrap = U.h('div', { class: 'ctx-sub hidden' });
          build(it.sub, wrap);
          container.appendChild(wrap);
          btn.addEventListener('click', e => { e.stopPropagation(); wrap.classList.toggle('hidden'); btn.classList.toggle('open'); this._clamp(x, y); });
        } else {
          btn.addEventListener('click', e => { e.stopPropagation(); this.hide(); if (it.fn) it.fn(); });
        }
      }
    };
    build(items, el);
    el.classList.remove('hidden');
    this._clamp(x, y);
  },
  _clamp(x, y) {
    const el = $('#ctx');
    el.style.left = '0px'; el.style.top = '0px';
    const r = el.getBoundingClientRect();
    const nx = Math.max(8, Math.min(x, window.innerWidth - r.width - 8));
    const ny = Math.max(8, Math.min(y, window.innerHeight - r.height - 8));
    el.style.left = nx + 'px'; el.style.top = ny + 'px';
  },
  hide() { const el = $('#ctx'); if (!el.classList.contains('hidden')) { el.classList.add('hidden'); el.innerHTML = ''; } },

/* ==================== 12. 窗口管理器（拖拽 / 八向缩放 / 贴靠 / 置顶 / 透视） ==================== */
const WM = {
  wins: new Map(), z: 30, seq: 0, focusId: null, snapZone: null,
  areaRect() { return $('#wins').getBoundingClientRect(); },
  create(opts = {}) {
    const def = Apps.def(opts.app) || {};

    const ar = this.areaRect();
    const n = this.wins.size;
    const mobile = U.isMobile();

    const h = Math.round(Math.min(opts.h || def.h || 500, Math.max(240, ar.height - 24)));

    const y = opts.y != null ? opts.y : Math.round(Math.max(8, Math.min(28 + (n % 6) * 28, ar.height - h - 8)));

      U.h('button', { class: 'wc', 'data-act': 'max', title: '最大化 / 还原' }, Ico.el('max')),
      U.h('button', { class: 'wc x', 'data-act': 'close', title: '关闭' }, Ico.el('x')));

    const body = U.h('div', { class: 'win-body' });

    for (const d of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) el.appendChild(U.h('i', { class: 'rz', 'data-d': d }));
    $('#wins').appendChild(el);
    const win = {
      id, app: opts.app || '', el, bar, body, title, icon, ctrl,
      rect: { x, y, w, h }, state: 'normal', prev: null, minimized: false, z: 0,
      minW: def.minW || 320, minH: def.minH || 220, cleanups: [], resizers: [], data: {}, taskBtn: null
    };
    win.setTitle = t => { win.title.textContent = t; if (win.taskBtn) win.taskBtn.querySelector('span').textContent = t; };
    win.setIcon = name => { win.icon.innerHTML = Ico.s(name); if (win.taskBtn) win.taskBtn.querySelector('.tb-i').innerHTML = Ico.s(name); };
    win.onClose = fn => { win.cleanups.push(fn); };
    win.onResize = fn => { win.resizers.push(fn); };
    win.close = () => this.close(win);
    win.focus = () => this.focus(win);
    this.wins.set(id, win);
    this.applyRect(win);
    this.bindWin(win);
    if (mobile) win.el.classList.add('m-full');
    this.focus(win);
    Taskbar.sync();
    if (Cfg.d.anim) setTimeout(() => el.classList.remove('anim'), 480);
    return win;
  },
  applyRect(win) {
    const r = win.rect, s = win.el.style;
    s.left = r.x + 'px'; s.top = r.y + 'px'; s.width = r.w + 'px'; s.height = r.h + 'px';
    win.el.classList.toggle('max', win.state === 'max');
  },
  bindWin(win) {
    const { el, bar } = win;
    el.addEventListener('pointerdown', () => this.focus(win), true);
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.win-ctrl')) return;
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      this._dragStart(win, e);
    });
    bar.addEventListener('dblclick', e => { if (!e.target.closest('.win-ctrl') && !U.isMobile()) this.toggleMax(win); });
    win.ctrl.querySelector('[data-act=min]').addEventListener('click', () => this.toggleMin(win));
    win.ctrl.querySelector('[data-act=max]').addEventListener('click', () => this.toggleMax(win));
    win.ctrl.querySelector('[data-act=close]').addEventListener('click', () => this.close(win));
    $$('.rz', el).forEach(h => h.addEventListener('pointerdown', e => { e.stopPropagation(); this._resizeStart(win, h, e); }));
  },
  focus(win) {
    if (!win || !this.wins.has(win.id)) return;
    if (win.minimized) { win.minimized = false; win.el.classList.remove('min'); }
    win.z = ++this.z;
    win.el.style.zIndex = win.z;
    for (const w of this.wins.values()) w.el.classList.toggle('active', w === win);
    this.focusId = win.id;
    Taskbar.sync();
  },
  _topVisible() {
    return [...this.wins.values()].filter(w => !w.minimized).sort((a, b) => b.z - a.z)[0];
  },
  toggleMin(win) {
    if (win.minimized) { this.focus(win); return; }
    win.minimized = true;
    win.el.classList.add('min');
    if (this.focusId === win.id) {
      this.focusId = null;
      const top = this._topVisible();
      if (top) this.focus(top);
    }
    Taskbar.sync();
  },
  toggleMax(win) {
    if (U.isMobile()) return;
    const area = this.areaRect();
    if (win.state === 'max') {
      win.rect = { ...(win.prev || { x: 80, y: 60, w: 760, h: 500 }) };
      win.state = 'normal'; win.prev = null;
    } else {
      if (win.state === 'normal') win.prev = { ...win.rect };
      win.rect = { x: 0, y: 0, w: Math.round(area.width), h: Math.round(area.height) };
      win.state = 'max';
    }
    this.applyRect(win);
    win.resizers.forEach(f => { try { f(); } catch (e) { console.warn(e); } });
    this.focus(win);
  },
  showDesktop() {
    const all = [...this.wins.values()];
    const anyVisible = all.some(w => !w.minimized);
    if (anyVisible) {
      for (const w of all) if (!w.minimized) { w.minimized = true; w.hiddenByShow = true; w.el.classList.add('min'); }
      this.focusId = null;
    } else {
      for (const w of all) if (w.hiddenByShow) { w.hiddenByShow = false; w.minimized = false; w.el.classList.remove('min'); }
      const top = this._topVisible();
      if (top) this.focus(top);
    }
    Taskbar.sync();
  },
  close(win) {
    if (!this.wins.has(win.id)) return;
    this.wins.delete(win.id);
    for (const fn of win.cleanups.splice(0)) { try { fn(); } catch (e) { console.warn(e); } }
    win.el.classList.add('closing');
    win.el.remove();
    if (this.focusId === win.id) {
      this.focusId = null;
      const top = this._topVisible();
      if (top) this.focus(top);
    }
    Taskbar.sync();
    Bus.emit('win:close', win.id);
  },
  closeAll() { for (const w of [...this.wins.values()]) this.close(w); },
  _snapRect(z, area) {
    const W = Math.round(area.width), H = Math.round(area.height), hw = Math.round(W / 2), hh = Math.round(H / 2);
    switch (z) {
      case 'max': return { x: 0, y: 0, w: W, h: H };
      case 'l': return { x: 0, y: 0, w: hw, h: H };
      case 'r': return { x: W - hw, y: 0, w: hw, h: H };
      case 'tl': return { x: 0, y: 0, w: hw, h: hh };
      case 'tr': return { x: W - hw, y: 0, w: hw, h: hh };
      case 'bl': return { x: 0, y: H - hh, w: hw, h: hh };
      case 'br': return { x: W - hw, y: H - hh, w: hw, h: hh };
    }
    return null;
  },
  _zoneAt(p, area) {
    if (!Cfg.d.snap) return null;
    const x = p.x - area.left, y = p.y - area.top, E = 6;
    const nl = x <= E, nr = x >= area.width - E, nt = y <= E, nb = y >= area.height - E;
    if (nt && nl) return 'tl';
    if (nt && nr) return 'tr';
    if (nb && nl) return 'bl';
    if (nb && nr) return 'br';
    if (nt) return 'max';
    if (nl) return 'l';
    if (nr) return 'r';
    return null;
  },
  _snapShow(z, area) {
    const sn = $('#snapper');
    if (!z) { sn.classList.remove('on'); return; }
    const r = this._snapRect(z, area), g = 5;
    sn.classList.add('on');
    sn.style.left = (area.left + r.x + g) + 'px';
    sn.style.top = (area.top + r.y + g) + 'px';
    sn.style.width = (r.w - g * 2) + 'px';
    sn.style.height = (r.h - g * 2) + 'px';
  },
  _dragStart(win, e) {
    if (U.isMobile()) return;
    const area = this.areaRect();
    let start = U.xy(e);
    let base = { ...win.rect };
    let moved = false;
    const el = win.el;
    const move = ev => {
      const p = U.xy(ev);
      const dx = p.x - start.x, dy = p.y - start.y;
      if (!moved) {
        if (Math.hypot(dx, dy) < 4) return;
        moved = true;
        el.classList.add('nt');
        if (win.state !== 'normal') {
          const prev = win.prev || { x: 80, y: 60, w: 760, h: 500 };
          const frac = Math.max(0, Math.min(1, (start.x - area.left) / area.width));
          win.rect = { x: (start.x - area.left) - prev.w * frac, y: Math.max(0, start.y - area.top - 18), w: prev.w, h: prev.h };
          win.state = 'normal'; win.prev = null;
          base = { ...win.rect };
          start = { x: start.x, y: start.y };
        }
      }
      const nx = base.x + (p.x - start.x), ny = base.y + (p.y - start.y);
      win.rect.x = Math.max(-win.rect.w + 120, Math.min(nx, area.width - 120));
      win.rect.y = Math.max(0, Math.min(ny, area.height - 38));
      this.applyRect(win);
      this.snapZone = this._zoneAt(p, area);
      this._snapShow(this.snapZone, area);
    };
    const up = ev => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      el.classList.remove('nt');
      const z = this.snapZone;
      this._snapShow(null);
      this.snapZone = null;
      if (moved && z) {
        if (win.state === 'normal') win.prev = { ...win.rect };
        win.rect = this._snapRect(z, area);
        win.state = z === 'max' ? 'max' : 'snap-' + z;
        this.applyRect(win);
        win.resizers.forEach(f => { try { f(); } catch (er) { console.warn(er); } });
      }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  },
  _resizeStart(win, handle, e) {
    if (U.isMobile() || win.state === 'max') return;
    e.preventDefault();
    const d = handle.dataset.d;
    const area = this.areaRect();
    const start = U.xy(e);
    let base = { ...win.rect };
    if (win.state !== 'normal') {
      win.rect = { ...win.rect, ...(win.prev || {}) };
      win.state = 'normal'; win.prev = null;
      base = { ...win.rect };
      this.applyRect(win);
    }
    win.el.classList.add('nt');
    const move = ev => {
      const p = U.xy(ev), dx = p.x - start.x, dy = p.y - start.y;
      let x = base.x, y = base.y, w = base.w, h = base.h;
      if (d.includes('e')) w = Math.max(win.minW, base.w + dx);
      if (d.includes('s')) h = Math.max(win.minH, base.h + dy);
      if (d.includes('w')) { const nw = Math.max(win.minW, base.w - dx); x = base.x + (base.w - nw); w = nw; }
      if (d.includes('n')) { const nh = Math.max(win.minH, base.h - dy); y = base.y + (base.h - nh); h = nh; }
      if (x < 0) { w += x; x = 0; }
      if (y < 0) { h += y; y = 0; }
      if (x + w > area.width) w = area.width - x;
      if (y + h > area.height) h = area.height - y;
      win.rect = { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
      this.applyRect(win);
      win.resizers.forEach(f => { try { f(); } catch (er) { /* */ } });
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      win.el.classList.remove('nt');
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
    this.focus(win);
  },
  relayout() {
    const area = this.areaRect();
    for (const win of this.wins.values()) {
      if (win.state === 'max') win.rect = { x: 0, y: 0, w: Math.round(area.width), h: Math.round(area.height) };
      else if (win.state.startsWith('snap-')) win.rect = this._snapRect(win.state.slice(5), area);
      else {
        const r = win.rect;
        r.w = Math.min(r.w, Math.max(win.minW, area.width - 8));
        r.h = Math.min(r.h, Math.max(win.minH, area.height - 8));
        r.x = Math.max(-r.w + 120, Math.min(r.x, area.width - 120));
        r.y = Math.max(0, Math.min(r.y, area.height - 38));
      }
      this.applyRect(win);
      win.resizers.forEach(f => { try { f(); } catch (e) { /* */ } });
    }
  }
};

/* ==================== 14. 框选引擎（鼠标 / 触摸通用，含边缘自动滚动） ==================== */
const BoxSel = {
  attach(o) {
    const onDown = e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      if (e.target.closest(o.itemSel)) return;
      if (o.skip && e.target.closest(o.skip)) return;
      if (e.pointerType === 'touch' && !(o.touchOK && o.touchOK())) return;
      this._start(o, e);
    };
    o.box.addEventListener('pointerdown', onDown);
    return () => o.box.removeEventListener('pointerdown', onDown);
  },
  _start(o, e) {
    const box = o.box, inner = o.inner;
    const p0 = U.xy(e);
    const additive = !!(e.ctrlKey || e.metaKey || e.shiftKey);
    const toC = p => { const r = box.getBoundingClientRect(); return { x: p.x - r.left + box.scrollLeft, y: p.y - r.top + box.scrollTop }; };
    const s = toC(p0);
    let cur = s, last = p0, active = false, list = [], raf = 0, edge = 0;
    const rectEl = document.createElement('div');
    rectEl.className = 'box-sel';
    inner.appendChild(rectEl);
    const measure = () => Array.from(inner.querySelectorAll(o.itemSel)).map(el => {
      const r = o.rectOf ? o.rectOf(el) : { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
      return { key: o.keyOf(el), x: r.x, y: r.y, w: r.w, h: r.h };
    });
    const paint = () => {
      raf = 0;
      if (!active) return;
      const x = Math.min(s.x, cur.x), y = Math.min(s.y, cur.y), w = Math.abs(cur.x - s.x), h = Math.abs(cur.y - s.y);
      rectEl.style.display = 'block';
      rectEl.style.left = x + 'px'; rectEl.style.top = y + 'px';
      rectEl.style.width = w + 'px'; rectEl.style.height = h + 'px';
      const hit = new Set();
      for (const it of list) if (it.x < x + w && it.x + it.w > x && it.y < y + h && it.y + it.h > y) hit.add(it.key);
      o.apply(hit, additive);
    };
    const sched = () => { if (!raf) raf = requestAnimationFrame(paint); };
    const edgeTick = () => {
      if (!active) return;
      const r = box.getBoundingClientRect(), E = 40, SP = 0.22;
      let vx = 0, vy = 0;
      if (last.y < r.top + E) vy = -Math.ceil((r.top + E - last.y) * SP);
      else if (last.y > r.bottom - E) vy = Math.ceil((last.y - (r.bottom - E)) * SP);
      if (last.x < r.left + E) vx = -Math.ceil((r.left + E - last.x) * SP);
      else if (last.x > r.right - E) vx = Math.ceil((last.x - (r.right - E)) * SP);
      if (vx || vy) {
        const sx = box.scrollLeft, sy = box.scrollTop;
        box.scrollBy(vx, vy);
        if (box.scrollLeft !== sx || box.scrollTop !== sy) { cur = toC(last); sched(); }
      }
      edge = requestAnimationFrame(edgeTick);
    };
    const blockTouch = ev => { if (active && ev.cancelable) ev.preventDefault(); };
    const move = ev => {
      const p = U.xy(ev);
      if (!active) {
        if (Math.hypot(p.x - p0.x, p.y - p0.y) < 5) return;
        active = true;
        list = measure();
        if (!additive) o.apply(new Set(), false);
        document.addEventListener('touchmove', blockTouch, { passive: false });
        edge = requestAnimationFrame(edgeTick);
      }
      last = p;
      cur = toC(p);
      sched();
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      document.removeEventListener('touchmove', blockTouch);
      cancelAnimationFrame(edge); cancelAnimationFrame(raf);
      rectEl.remove();
      if (!active && !additive && o.onBlank) o.onBlank();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  }
};

/* ==================== 15. 拖放通道（内部 HTML5 DnD + 外部文件 + 下载缓存） ==================== */
const MIME_INT = 'application/x-tuoyin';
const DnD = {
  cache: new Map(), MAX: 10,
  async prefetch(path) {
    const hit = this.cache.get(path);
    if (hit) { hit.at = Date.now(); return hit; }
    const st = await FS.stat(path);
    if (!st || st.type !== 'file' || st.size > 60 * 1024 * 1024) return null;
    const blob = await FS.read(path);
    const name = FS.base(path);
    const mime = mimeOf(name);
    const file = new File([blob], name, { type: mime, lastModified: st.mtime || Date.now() });
    const rec = { file, url: URL.createObjectURL(file), name, mime, at: Date.now(), path };
    this.cache.set(path, rec);
    this._evict();
    return rec;
  },
  _evict() {
    if (this.cache.size <= this.MAX) return;
    const list = [...this.cache.values()].sort((a, b) => a.at - b.at);
    while (this.cache.size > this.MAX && list.length) {
      const rec = list.shift();
      this.cache.delete(rec.path);
      setTimeout(() => URL.revokeObjectURL(rec.url), 5000);
    }
  },
  setInternal(e, payload) {
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData(MIME_INT, JSON.stringify(payload));
    e.dataTransfer.setData('text/plain', (payload.paths || []).join('\n') || 'tuoyin');
  },
  readInternal(dt) { try { return JSON.parse(dt.getData(MIME_INT)); } catch (e) { return null; } },
  hasInternal(dt) { return Array.from(dt.types || []).includes(MIME_INT); },
  hasFiles(dt) { return Array.from(dt.types || []).includes('Files'); },
  dropInternal(el, payload, pt, copy) {
    const t = el && el.closest ? el.closest('[data-dnd]') : null;
    if (!t) return false;
    const kind = t.dataset.dnd;
    if (kind === 'desk') {
      if (payload.src === 'desk') Desk.moveIcons(payload.keys, pt.x - (payload.offX || 0), pt.y - (payload.offY || 0));
      else Desk.acceptPaths(payload.paths || [], pt, copy);
      return true;
    }
    if (kind === 'dir' || kind === 'explorer') {
      const dest = t.dataset.path;
      if (!dest || !(payload.paths || []).length) return false;
      Ops.moveOrCopy(payload.paths, dest, { copy });
      return true;
    }
    return false;
  }
};

/* ==================== 16. 桌面 ==================== */
const Desk = {
  el: null, ghost: null, items: [], imap: new Map(), els: new Map(), sel: new Set(),
  cw: 94, ch: 104, pad: 16, cols: 1, rows: 1, timer: 0, _tok: 0, anchor: null, lpTimer: 0,
  init() {
    this.el = $('#desk');
    this.ghost = $('#drop-ghost');
    this.el.dataset.dnd = 'desk';
    this._size();
    this._bind();
    Bus.on('fs', ({ paths }) => {
      const dp = FS.desk();
      if (paths.some(p => FS.isUnder(p, dp) || FS.isUnder(dp, p))) this.schedule();
    });
    Bus.on('settings', () => this.schedule());
    window.addEventListener('resize', U.debounce(() => { this._size(); this.place(); this.reflow(); }, 140));
  },
  _size() {
    const m = U.isMobile();
    this.cw = m ? 84 : 94; this.ch = m ? 96 : 104; this.pad = m ? 10 : 16;
    const W = this.el.clientWidth, H = this.el.clientHeight;
    this.cols = Math.max(1, Math.floor((W - this.pad * 2) / this.cw));
    this.rows = Math.max(1, Math.floor((H - this.pad * 2) / this.ch));
  },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.render(), 70); },
  cellX(c) { return this.pad + c * this.cw; },
  cellY(r) { return this.pad + r * this.ch; },
  byKey(k) { return this.imap.get(k); },
  async gather() {
    const out = [];
    for (const a of Apps.list) {
      if (!a.desk || Cfg.d.hidden.includes(a.id)) continue;
      out.push({ key: 'app:' + a.id, kind: 'app', id: a.id, icon: a.icon, label: a.name, path: '', fk: '' });
    }
    try {
      const list = await FS.list(FS.desk());
      for (const f of list) {
        if (!Cfg.d.showHidden && f.name.startsWith('.')) continue;
        out.push({ key: 'f:' + f.path, kind: f.type === 'dir' ? 'dir' : 'file', path: f.path, icon: Kind.icon(f.kind), label: f.label || f.name, fk: f.kind, size: f.size, mtime: f.mtime });
      }
    } catch (e) { /* 桌面目录缺失时仅显示应用 */ }
    return out;
  },
  async render() {
    const tok = ++this._tok;
    const items = await this.gather();
    if (tok !== this._tok) return;
    this.items = items;
    this.imap = new Map(items.map(i => [i.key, i]));
    this.place();
    this.sync();
  },
  place() {
    const L = Cfg.d.layout;
    const keys = new Set(this.items.map(i => i.key));
    for (const k of Object.keys(L)) if (!keys.has(k)) delete L[k];
    const occ = new Set(), pending = [];
    for (const it of this.items) {
      const p = L[it.key];
      if (p && p.c >= 0 && p.r >= 0 && p.c < this.cols && p.r < this.rows && !occ.has(p.c + ',' + p.r)) { occ.add(p.c + ',' + p.r); it.c = p.c; it.r = p.r; }
      else pending.push(it);
    }
    let c = 0, r = 0;
    for (const it of pending) {
      while (occ.has(c + ',' + r)) { r++; if (r >= this.rows) { r = 0; c++; } }
      occ.add(c + ',' + r); it.c = c; it.r = r; L[it.key] = { c, r };
      r++; if (r >= this.rows) { r = 0; c++; }
    }
    Cfg.saveSoon();
  },
  sync() {
    const keep = new Set();
    this.items.forEach((it, i) => {
      keep.add(it.key);
      let el = this.els.get(it.key);
      if (!el) { el = this.makeIcon(it, i); this.els.set(it.key, el); this.el.appendChild(el); }
      el.classList.toggle('sel', this.sel.has(it.key));
      el.style.transform = `translate3d(${this.cellX(it.c)}px, ${this.cellY(it.r)}px, 0)`;
    });
    for (const [k, el] of this.els) if (!keep.has(k)) { el.remove(); this.els.delete(k); }
    this.sel = new Set([...this.sel].filter(k => keep.has(k)));
  },
  reflow() {
    for (const it of this.items) {
      const el = this.els.get(it.key);
      if (!el) continue;
      el.style.width = this.cw + 'px'; el.style.height = this.ch + 'px';
      el.style.transform = `translate3d(${this.cellX(it.c)}px, ${this.cellY(it.r)}px, 0)`;
    }
  },
  makeIcon(it, i) {
    const el = U.h('div', {
      class: 'dicon', 'data-key': it.key, 'data-path': it.path || '', 'data-dnd': it.kind === 'dir' ? 'dir' : '',
      draggable: U.isFine() ? 'true' : 'false', title: it.label,
      style: { '--i': Math.min(i, 24), width: this.cw + 'px', height: this.ch + 'px' }
    });
    const ico = U.h('div', { class: 'dicon-ico' + (it.kind === 'app' ? ' app' : '') });
    ico.innerHTML = Ico.s(it.icon);
    el.append(ico, U.h('div', { class: 'dicon-lb' }, it.label));
    this._bindIcon(el);
    if (it.fk === 'image' && typeof Thumbs !== 'undefined') {
      Thumbs.load(it.path, 160).then(url => { if (url && el.isConnected) ico.innerHTML = `<img src="${url}" alt="">`; }).catch(() => {});
    }
    return el;
  },
  _bindIcon(el) {
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button !== 0) return;
      const key = el.dataset.key;
      if (!(e.ctrlKey || e.metaKey || e.shiftKey) && !this.sel.has(key)) this.select([key]);
      const it = this.byKey(key);
      if (it && it.kind === 'file') DnD.prefetch(it.path).catch(() => {});
    });
    el.addEventListener('click', e => {
      if (this._skipClick) { this._skipClick = false; return; }
      const key = el.dataset.key, it = this.byKey(key);
      if (!it) return;
      if (e.ctrlKey || e.metaKey) { this.toggle(key); return; }
      if (e.shiftKey && this.anchor) { this.rangeTo(key); return; }
      this.select([key]);
      if (Cfg.d.click === 'single') this.openItem(it);
    });
    el.addEventListener('dblclick', () => { const it = this.byKey(el.dataset.key); if (it && Cfg.d.click === 'double') this.openItem(it); });
    el.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      const key = el.dataset.key;
      if (!this.sel.has(key)) this.select([key]);
      Menu.show(e.clientX, e.clientY, Ops.itemMenu(this.selPaths(), { from: 'desk', dir: FS.desk() }));
    });
    el.addEventListener('dragstart', e => this._dragStart(e, el));
    el.addEventListener('dragend', () => this._dragEnd());
    el.addEventListener('touchstart', e => this._touchStart(e, el), { passive: false });
  },
  openItem(it) { if (it.kind === 'app') Apps.launch(it.id); else Shell.open(it.path); },
  select(keys) { this.sel = new Set(keys); this.anchor = keys[0] || null; this._paint(); },
  toggle(k) { if (this.sel.has(k)) this.sel.delete(k); else this.sel.add(k); this.anchor = k; this._paint(); },
  rangeTo(k) {
    const a = this.byKey(this.anchor), b = this.byKey(k);
    if (!a || !b) return this.select([k]);
    const lo = Math.min(a.c, b.c), hi = Math.max(a.c, b.c), lr = Math.min(a.r, b.r), hr = Math.max(a.r, b.r);
    this.sel = new Set(this.items.filter(i => i.c >= lo && i.c <= hi && i.r >= lr && i.r <= hr).map(i => i.key));
    this._paint();
  },
  _paint() { for (const [k, el] of this.els) el.classList.toggle('sel', this.sel.has(k)); },
  selPaths() { return [...this.sel].map(k => this.byKey(k)).filter(it => it && it.path).map(it => it.path); },
  _bind() {
    this.el.addEventListener('dragover', e => {
      const internal = DnD.hasInternal(e.dataTransfer);
      if (!internal && !DnD.hasFiles(e.dataTransfer)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = internal ? (e.ctrlKey ? 'copy' : 'move') : 'copy';
      if (internal && this.drag) this._showGhost(e.clientX - this.drag.offX, e.clientY - this.drag.offY);
    });
    this.el.addEventListener('dragleave', e => { if (e.target === this.el) this._hideGhost(); });
    this.el.addEventListener('drop', e => this._onDrop(e));
    this.el.addEventListener('contextmenu', e => {
      if (e.target.closest('.dicon')) return;
      e.preventDefault();
      Menu.show(e.clientX, e.clientY, this.deskMenu());
    });
    BoxSel.attach({
      box: this.el, inner: this.el, itemSel: '.dicon',
      keyOf: el => el.dataset.key,
      rectOf: el => { const it = this.byKey(el.dataset.key); return it ? { x: this.cellX(it.c), y: this.cellY(it.r), w: this.cw, h: this.ch } : { x: 0, y: 0, w: 0, h: 0 }; },
      apply: (keys, add) => { if (add) { for (const k of keys) this.sel.add(k); } else this.sel = new Set(keys); this._paint(); },
      onBlank: () => this.select([]),
      touchOK: () => true
    });
    this.el.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch' || e.target.closest('.dicon')) return;
      const p0 = U.xy(e);
      clearTimeout(this.lpTimer);
      this.lpTimer = setTimeout(() => { Menu.show(p0.x, p0.y, this.deskMenu()); }, 560);
      const cancel = ev => { const p = U.xy(ev); if (Math.hypot(p.x - p0.x, p.y - p0.y) > 10 || ev.type !== 'pointermove') { clearTimeout(this.lpTimer); } };
      const end = () => { clearTimeout(this.lpTimer); this.el.removeEventListener('pointermove', cancel); this.el.removeEventListener('pointerup', end); };
      this.el.addEventListener('pointermove', cancel);
      this.el.addEventListener('pointerup', end);
    });
  },
  _showGhost(x, y) {
    const r = this.el.getBoundingClientRect();
    const c = this._cellAt(x - r.left, y - r.top);
    this.ghost.style.display = 'block';
    this.ghost.style.width = this.cw + 'px'; this.ghost.style.height = this.ch + 'px';
    this.ghost.style.transform = `translate3d(${this.cellX(c.c)}px, ${this.cellY(c.r)}px, 0)`;
  },
  _hideGhost() { if (this.ghost) this.ghost.style.display = 'none'; },
  _cellAt(x, y) {
    const c = Math.max(0, Math.min(this.cols - 1, Math.round((x - this.pad) / this.cw)));
    const r = Math.max(0, Math.min(this.rows - 1, Math.round((y - this.pad) / this.ch)));
    return { c, r };
  },
  _occupied(exclude) {
    const s = new Set();
    for (const it of this.items) if (!exclude.has(it.key)) s.add(it.c + ',' + it.r);
    return s;
  },
  _freeNear(want, occ) {
    const c0 = Math.max(0, Math.min(want.c, this.cols - 1)), r0 = Math.max(0, Math.min(want.r, this.rows - 1));
    if (!occ.has(c0 + ',' + r0)) return { c: c0, r: r0 };
    const lim = Math.max(this.cols, this.rows) + 2;
    for (let d = 1; d <= lim; d++) {
      for (let dc = -d; dc <= d; dc++) for (let dr = -d; dr <= d; dr++) {
        if (Math.max(Math.abs(dc), Math.abs(dr)) !== d) continue;
        const c = c0 + dc, r = r0 + dr;
        if (c < 0 || r < 0 || c >= this.cols || r >= this.rows) continue;
        if (!occ.has(c + ',' + r)) return { c, r };
      }
    }
    let c = this.cols;
    while (occ.has(c + ',0')) c++;
    return { c, r: 0 };
  },
  _dragStart(e, el) {
    const key = el.dataset.key, it = this.byKey(key);
    if (!it) { e.preventDefault(); return; }
    if (!this.sel.has(key)) this.select([key]);
    const its = [...this.sel].map(k => this.byKey(k)).filter(Boolean);
    const r = el.getBoundingClientRect();
    const offX = Math.round(e.clientX - r.left), offY = Math.round(e.clientY - r.top);
    const paths = its.filter(x => x.path).map(x => x.path);
    this.drag = { keys: its.map(x => x.key), offX, offY, paths };
    DnD.setInternal(e, { src: 'desk', keys: this.drag.keys, paths, offX, offY });
    if (its.length === 1 && its[0].kind === 'file') {
      const rec = DnD.cache.get(it.path);
      if (rec) {
        try { e.dataTransfer.items.add(rec.file); } catch (err) { /* 浏览器不支持时仅内部拖拽 */ }
        e.dataTransfer.setData('DownloadURL', `${rec.mime}:${rec.name}:${rec.url}`);
      }
    }
    setTimeout(() => { for (const k of this.drag ? this.drag.keys : []) { const x = this.els.get(k); if (x) x.classList.add('dragging'); } }, 0);
  },
  _dragEnd() {
    this.drag = null;
    for (const el of this.els.values()) el.classList.remove('dragging');
    this._hideGhost();
  },
  _touchStart(e, el) {
    const key = el.dataset.key, it = this.byKey(key);
    if (!it) return;
    const t0 = e.touches[0];
    const start = { x: t0.clientX, y: t0.clientY };
    let moved = false, dragging = false, longFired = false, ghost = null, target = null;
    if (it.kind === 'file') DnD.prefetch(it.path).catch(() => {});
    const lp = setTimeout(() => {
      if (moved) return;
      longFired = true;
      this.select([key]);
      if (navigator.vibrate) navigator.vibrate(8);
      Menu.show(start.x, start.y, Ops.itemMenu(this.selPaths(), { from: 'desk', dir: FS.desk() }));
    }, 480);
    const onMove = ev => {
      const t = ev.touches[0];
      if (!dragging) {
        if (Math.hypot(t.clientX - start.x, t.clientY - start.y) < 10) return;
        if (longFired) return;
        clearTimeout(lp);
        moved = true; dragging = true;
        if (!this.sel.has(key)) this.select([key]);
        ghost = U.h('div', { class: 'tg-ghost' }, Ico.el(it.icon));
        document.body.appendChild(ghost);
      }
      ev.preventDefault();
      ghost.style.transform = `translate(${t.clientX - 26}px, ${t.clientY - 26}px)`;
      this._touchHover(t.clientX, t.clientY);
    };
    const onEnd = ev => {
      clearTimeout(lp);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
      el.removeEventListener('touchcancel', onEnd);
      if (longFired) { this._skipClick = true; return; }
      if (!dragging) return;
      this._skipClick = true;
      const t = ev.changedTouches[0];
      if (ghost) ghost.remove();
      this._touchHoverClear();
      const hit = document.elementFromPoint(t.clientX, t.clientY);
      const payload = { src: 'desk', keys: [...this.sel], paths: this.selPaths(), offX: 26, offY: 26 };
      const r = this.el.getBoundingClientRect();
      const pt = { x: t.clientX - r.left, y: t.clientY - r.top };
      if (hit) DnD.dropInternal(hit, payload, pt, false);
    };
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    el.addEventListener('touchcancel', onEnd);
  },
  _touchHover(x, y) {
    const hit = document.elementFromPoint(x, y);
    const t = hit && hit.closest ? hit.closest('[data-dnd="dir"]') : null;
    if (this._hov && this._hov !== t) this._hov.classList.remove('drop-hi');
    if (t) t.classList.add('drop-hi');
    this._hov = t;
  },
  _touchHoverClear() { if (this._hov) this._hov.classList.remove('drop-hi'); this._hov = null; },
  async _onDrop(e) {
    const dt = e.dataTransfer;
    const internal = DnD.hasInternal(dt);
    const files = !internal && DnD.hasFiles(dt);
    if (!internal && !files) return;
    e.preventDefault();
    this._hideGhost();
    const pt = { x: e.clientX, y: e.clientY };
    if (internal) {
      const payload = DnD.readInternal(dt);
      if (!payload) return;
      const r = this.el.getBoundingClientRect();
      const local = { x: pt.x - r.left, y: pt.y - r.top };
      if (payload.src === 'desk' && e.target.closest('[data-dnd="dir"]')) {
        Ops.moveOrCopy(payload.paths, e.target.closest('[data-dnd="dir"]').dataset.path, { copy: e.ctrlKey });
        return;
      }
      if (payload.src === 'desk') this.moveIcons(payload.keys, local.x - (payload.offX || 0), local.y - (payload.offY || 0));
      else this.acceptPaths(payload.paths || [], local, e.ctrlKey);
      return;
    }
    const folder = e.target.closest('[data-dnd="dir"]');
    const dest = folder && folder.dataset.path ? folder.dataset.path : FS.desk();
    const collected = Import.collectFrom(dt);
    await Import.run(collected, dest, { after: (paths) => this._placeNew(paths, pt) });
  },
  _placeNew(paths, pt) {
    const r = this.el.getBoundingClientRect();
    const c0 = this._cellAt(pt.x - r.left, pt.y - r.top);
    const occ = this._occupied(new Set());
    let i = 0;
    for (const p of paths) {
      if (FS.parent(p) !== FS.desk()) continue;
      const cell = this._freeNear({ c: c0.c + (i % 3), r: c0.r + Math.floor(i / 3) }, occ);
      occ.add(cell.c + ',' + cell.r);
      Cfg.d.layout['f:' + p] = cell;
      i++;
    }
    Cfg.saveSoon();
    this.render();
  },
  moveIcons(keys, px, py) {
    const its = keys.map(k => this.byKey(k)).filter(Boolean);
    if (!its.length) return;
    const anchor = its[0];
    const cell = this._cellAt(px, py);
    const moving = new Set(its.map(i => i.key));
    const occ = this._occupied(moving);
    for (const it of its) {
      const free = this._freeNear({ c: cell.c + (it.c - anchor.c), r: cell.r + (it.r - anchor.r) }, occ);
      occ.add(free.c + ',' + free.r);
      it.c = free.c; it.r = free.r;
      Cfg.d.layout[it.key] = { c: free.c, r: free.r };
    }
    Cfg.saveSoon();
    this.reflow();
  },
  async acceptPaths(paths, pt, copy) {
    const dir = FS.desk();
    const c0 = this._cellAt(pt.x - this.cw / 2, pt.y - this.ch / 2);
    const occ = this._occupied(new Set());
    let i = 0;
    for (const p of paths) {
      try {
        const st = await FS.stat(p);
        if (!st) continue;
        let to = p;
        if (FS.parent(p) !== dir || copy) {
          const name = await FS.uniq(dir, FS.base(p), st.type === 'dir');
          to = FS.join(dir, name);
          if (copy) await FS.copy(p, to); else await FS.move(p, to);
          this.onMoved(p, to, copy);
        }
        const cell = this._freeNear({ c: c0.c + (i % 3), r: c0.r + Math.floor(i / 3) }, occ);
        occ.add(cell.c + ',' + cell.r);
        Cfg.d.layout['f:' + to] = cell;
        i++;
      } catch (e) { UI.err(e); }
    }
    Cfg.saveSoon();
    this.render();
  },
  onMoved(from, to, copy) {
    if (copy) return;
    const L = Cfg.d.layout, k0 = 'f:' + from, k1 = 'f:' + to;
    if (L[k0]) { L[k1] = L[k0]; delete L[k0]; Cfg.saveSoon(); }
  },
  arrange(mode) {
    const cmp = {
      name: (a, b) => U.natCmp(a.label, b.label),
      type: (a, b) => (a.fk || '').localeCompare(b.fk || '') || U.natCmp(a.label, b.label),
      time: (a, b) => (b.mtime || 0) - (a.mtime || 0)
    }[mode];
    if (cmp) this.items.sort(cmp);
    Cfg.d.layout = {};
    this.place();
    this.reflow();
    Cfg.saveSoon();
  },
  deskMenu() {
    return [
      { label: '刷新', icon: 'refresh', fn: () => this.render() },
      { label: '新建', icon: 'plus', sub: [
        { label: '文件夹', icon: 'folderPlus', fn: () => Ops.newFolder(FS.desk()).then(() => this.render()) },
        { label: '文本文档', icon: 'text', fn: () => Ops.newFile(FS.desk(), '新建文本文档.txt', '') },
        { label: 'HTML 网页', icon: 'globe', fn: () => Ops.newFile(FS.desk(), '新建网页.html', '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<title>新建网页</title>\n</head>\n<body>\n  <h1>你好，拓印</h1>\n</body>\n</html>\n') }
      ] },
      '-',
      { label: '粘贴', icon: 'paste', hint: 'Ctrl+V', disabled: !Ops.clip.paths.length, fn: () => Ops.paste(FS.desk()) },
      { label: '上传文件到桌面', icon: 'upload', fn: () => Import.pick(FS.desk()) },
      '-',
      { label: '排列图标', icon: 'grid', sub: [
        { label: '按名称', fn: () => this.arrange('name') },
        { label: '按类型', fn: () => this.arrange('type') },
        { label: '按修改日期', fn: () => this.arrange('time') }
      ] },
      { label: '更换壁纸', icon: 'mountain', fn: () => Shell.pickWallpaper() },
      { label: '个性化设置', icon: 'sun', fn: () => Apps.launch('settings', { page: 'appearance' }) },
      { label: '全屏模式', icon: 'fullscreen', fn: () => Shell.fullscreen() },
      '-',
      { label: '系统设置', icon: 'cog', fn: () => Apps.launch('settings') }
    ];
  },
  onKey(e) {
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Delete') { e.preventDefault(); Ops.del(this.selPaths()).then(() => this.render()); return true; }
    if (e.key === 'F2') { const p = this.selPaths(); if (p.length === 1) { Ops.rename(p[0]).then(() => this.render()); return true; } }
    if (e.key === 'Enter') { const it = this.byKey([...this.sel][0]); if (it) { this.openItem(it); return true; } }
    if (mod && k === 'a') { e.preventDefault(); this.select(this.items.map(i => i.key)); return true; }
    if (mod && (k === 'c' || k === 'x')) { const p = this.selPaths(); if (p.length) { Ops.setClip(k === 'x' ? 'cut' : 'copy', p); return true; } }
    if (mod && k === 'v') { Ops.paste(FS.desk()).then(() => this.render()); return true; }
    return false;
  }
};

const Taskbar = {
  btns: new Map(),
  init() {
    $('#btn-start').addEventListener('click', e => { e.stopPropagation(); Start.toggle(); });
    $('#tb-clock').addEventListener('click', e => { e.stopPropagation(); Cal.toggle(); });
    const peek = $('#tb-peek');
    let pt = 0;
    peek.addEventListener('pointerenter', () => { if (!Cfg.d.peek) return; clearTimeout(pt); pt = setTimeout(() => $('#os').classList.add('peeking'), 260); });
    peek.addEventListener('pointerleave', () => { clearTimeout(pt); $('#os').classList.remove('peeking'); });
    peek.addEventListener('click', () => WM.showDesktop());
    document.addEventListener('pointerdown', e => {
      if (Start.open && !e.target.closest('#start') && !e.target.closest('#btn-start')) Start.hide();
      if (Cal.open && !e.target.closest('#cal') && !e.target.closest('#tb-clock')) Cal.hide();
    }, true);
  },
  sync() {
    const host = $('#tb-apps');
    for (const [id, btn] of this.btns) if (!WM.wins.has(id)) { btn.remove(); this.btns.delete(id); }
    for (const w of WM.wins.values()) {
      let b = this.btns.get(w.id);

        b = U.h('button', { class: 'tb-app', title: w.title.textContent },
          U.h('i', { class: 'tb-i', html: w.icon.innerHTML }),
          U.h('span', {}, w.title.textContent));
        b.addEventListener('click', () => this.click(w));
        this.btns.set(w.id, b);
        host.appendChild(b);
      }
      w.taskBtn = b;
      b.classList.toggle('on', WM.focusId === w.id && !w.minimized);
      b.classList.toggle('min', !!w.minimized);
      b.classList.toggle('open', true);
    }
  },
  click(w) {
    if (w.minimized) WM.focus(w);
    else if (WM.focusId === w.id) WM.toggleMin(w);
    else WM.focus(w);
  }
};

const Clock = {
  timer: 0,
  tick() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const opt = { hour: '2-digit', minute: '2-digit', hour12: !!Cfg.d.hour12 };
    if (Cfg.d.showSec) opt.second = '2-digit';
    $('#clk-t').textContent = new Intl.DateTimeFormat('zh-CN', opt).format(d);
    $('#clk-d').textContent = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} 周${'日一二三四五六'[d.getDay()]}`;
    if (Cal.open) Cal.updateTime();
  },
  start() { this.tick(); clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 1000); }
};

const Cal = {
  open: false, y: 0, m: 0, sel: null,
  toggle() { this.open ? this.hide() : this.show(); },
  show() {
    const n = new Date();
    this.y = n.getFullYear(); this.m = n.getMonth(); this.sel = null;
    this.open = true;
    $('#cal').classList.remove('hidden');
    $('#tb-clock').classList.add('on');
    this.render();
  },
  hide() {
    if (!this.open) return;
    this.open = false;
    $('#cal').classList.add('hidden');
    $('#tb-clock').classList.remove('on');
  },
  move(delta) {
    this.m += delta;
    while (this.m < 0) { this.m += 12; this.y--; }
    while (this.m > 11) { this.m -= 12; this.y++; }
    this.render();
  },
  updateTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const t = $('#cal-t');
    if (t) t.innerHTML = `${new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: !!Cfg.d.hour12 }).format(d).replace(/\s/g, '')}`;
    const dt = $('#cal-dt');
    if (dt) dt.textContent = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} 星期${'日一二三四五六'[d.getDay()]}`;
  },
  render() {
    const box = $('#cal');
    const now = new Date();
    const first = new Date(this.y, this.m, 1);
    const offset = (first.getDay() + 6) % 7;
    const start = new Date(this.y, this.m, 1 - offset);
    const wd = ['一', '二', '三', '四', '五', '六', '日'].map(x => U.h('div', { class: 'cal-wd' }, x));
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const isToday = d.toDateString() === now.toDateString();
      const isSel = this.sel && d.toDateString() === this.sel.toDateString();
      cells.push(U.h('button', {
        class: 'cal-d' + (d.getMonth() !== this.m ? ' out' : '') + (isToday ? ' today' : '') + (isSel ? ' sel' : ''),
        onclick: () => { this.sel = d; this.render(); }
      }, String(d.getDate())));
    }
    const lunarNote = this.sel ? `已选 ${this.sel.getFullYear()}/${this.sel.getMonth() + 1}/${this.sel.getDate()}` : `共 ${new Date(this.y, this.m + 1, 0).getDate()} 天`;
    box.innerHTML = '';
    box.append(
      U.h('div', { class: 'cal-time', id: 'cal-t' }),
      U.h('div', { class: 'cal-date', id: 'cal-dt' }),
      U.h('div', { class: 'cal-nav' },
        U.h('button', { class: 'ib', title: '上个月', onclick: () => this.move(-1) }, Ico.el('chev', '').cloneNode(true)),
        U.h('b', {}, `${this.y} 年 ${this.m + 1} 月`),
        U.h('button', { class: 'ib', title: '下个月', onclick: () => this.move(1) }, Ico.el('chev'))),
      U.h('div', { class: 'cal-grid' }, wd, cells),
      U.h('div', { class: 'cal-foot' },
        U.h('button', { class: 'btn sm', onclick: () => { const n = new Date(); this.y = n.getFullYear(); this.m = n.getMonth(); this.sel = n; this.render(); } }, '回到今天'),
        U.h('span', {}, lunarNote))
    );
    const prevBtn = box.querySelector('.cal-nav .ib');
    if (prevBtn) prevBtn.firstElementChild.style.transform = 'rotate(180deg)';
    this.updateTime();
  }
};

/* ==================== 18. 文件操作（复制 / 移动 / 删除 / 重命名 / 属性 / 右键菜单） ==================== */
const Ops = {
  clip: { op: '', paths: [] },
  setClip(op, paths) {
    this.clip = { op, paths: [...paths] };
    UI.toast(op === 'cut' ? `已剪切 ${paths.length} 项，粘贴到目标位置即可移动` : `已复制 ${paths.length} 项`, 'ok');
  },
  async paste(dir) {
    if (!this.clip.paths.length) { UI.toast('剪贴板是空的', 'warn'); return 0; }
    const { op, paths } = this.clip;
    const alive = [];
    for (const p of paths) if (await FS.exists(p)) alive.push(p);
    if (!alive.length) { UI.toast('源文件已不存在', 'warn'); this.clip = { op: '', paths: [] }; return 0; }
    const n = await this.moveOrCopy(alive, dir, { copy: op !== 'cut' });
    if (op === 'cut') this.clip = { op: '', paths: [] };
    return n;
  },
  async moveOrCopy(paths, destDir, opt = {}) {
    const copy = !!opt.copy;
    let n = 0, fail = 0;
    const busy = UI.busy(`正在${copy ? '复制' : '移动'}…`);
    try {
      const dst = await FS.stat(destDir);
      if (!dst || dst.type !== 'dir') throw new Error('目标不是有效的文件夹');
      for (let i = 0; i < paths.length; i++) {
        const p = paths[i];
        busy.set(`正在${copy ? '复制' : '移动'} ${FS.base(p)}（${i + 1}/${paths.length}）`, (i / paths.length) * 100);
        try {
          const st = await FS.stat(p);
          if (!st) { fail++; continue; }
          if (!copy && FS.parent(p) === destDir) continue;
          if (st.type === 'dir' && FS.isUnder(destDir, p)) { UI.toast(`不能把「${FS.base(p)}」放入它自身中`, 'warn'); fail++; continue; }
          const name = await FS.uniq(destDir, FS.base(p), st.type === 'dir');
          const to = FS.join(destDir, name);
          if (copy) await FS.copy(p, to); else await FS.move(p, to);
          Desk.onMoved(p, to, copy);
          n++;
        } catch (e) { fail++; UI.err(e, FS.base(p) + '：'); }
      }
    } finally { busy.done(); }
    if (n) UI.toast(`${copy ? '已复制' : '已移动'} ${n} 项${fail ? `，${fail} 项失败` : ''}`, fail ? 'warn' : 'ok');
    return n;
  },
  async del(paths) {
    if (!paths.length) return false;
    const msg = paths.length === 1 ? `确定要永久删除「${FS.base(paths[0])}」吗？此操作无法撤销。` : `确定要永久删除选中的 ${paths.length} 个项目吗？此操作无法撤销。`;
    const ok = await UI.confirm(msg, '删除', { danger: true, ok: '删除' });
    if (!ok) return false;
    const busy = UI.busy('正在删除…');
    let fail = 0;
    try {
      for (const p of paths) {
        try { await FS.remove(p, { recursive: true }); } catch (e) { fail++; UI.err(e, FS.base(p) + '：'); }
      }
    } finally { busy.done(); }
    if (paths.length - fail) UI.toast(`已删除 ${paths.length - fail} 项`, 'ok');
    return true;
  },
  async rename(path) {
    const cur = FS.base(path);
    const nn = await UI.prompt('重命名', cur, '名称不能包含 / 或 \\ 字符');
    if (!nn || nn === cur) return null;
    if (/[\/\\]/.test(nn) || nn === '.' || nn === '..') { UI.toast('名称包含非法字符', 'err'); return null; }
    const to = FS.join(FS.parent(path), nn);
    if (await FS.exists(to)) { UI.toast('同名项目已存在', 'err'); return null; }
    try { await FS.move(path, to); Desk.onMoved(path, to, false); UI.toast('已重命名', 'ok'); return to; }
    catch (e) { UI.err(e); return null; }
  },
  async newFolder(dir) {
    const name = await UI.prompt('新建文件夹', '新建文件夹', '同名时会自动编号');
    if (!name) return null;
    try {
      const n = await FS.uniq(dir, name.replace(/[\/\\]/g, '_'), true);
      const p = FS.join(dir, n);
      await FS.mkdir(p);
      UI.toast('已新建文件夹', 'ok');
      return p;
    } catch (e) { UI.err(e); return null; }
  },
  async newFile(dir, name, content = '') {
    try {
      const n = await FS.uniq(dir, name);
      const p = FS.join(dir, n);
      await FS.write(p, new Blob([content], { type: mimeOf(n) }));
      UI.toast(`已创建 ${n}`, 'ok');
      return p;
    } catch (e) { UI.err(e); return null; }
  },
  backendLabel(p) {
    const r = FS.resolve(p);
    if (r.kind !== 'node') return '虚拟目录';
    if (r.mount) return '本地挂载：' + r.mount;
    return r.be.label;
  },
  async props(path) {
    const st = await FS.stat(path);
    if (!st) { UI.toast('文件不存在', 'err'); return; }
    const sizeEl = U.h('span', {}, st.type === 'dir' ? '计算中…' : U.fmtSize(st.size));
    const body = U.h('div', { class: 'kv' },
      U.h('b', {}, '名称'), U.h('span', {}, st.name),
      U.h('b', {}, '类型'), U.h('span', {}, Kind.label(st)),
      U.h('b', {}, '位置'), U.h('span', {}, FS.parent(path)),
      U.h('b', {}, '大小'), sizeEl,
      U.h('b', {}, '修改时间'), U.h('span', {}, U.fmtDate(st.mtime)),
      U.h('b', {}, '存储位置'), U.h('span', {}, this.backendLabel(path)));
    if (st.type === 'dir') {
      FS.du(path).then(n => { sizeEl.textContent = `${U.fmtSize(n)}（${n.toLocaleString('zh-CN')} 字节）`; }).catch(() => { sizeEl.textContent = '无法计算'; });
    }
    UI.modal({ title: '属性', body, buttons: [{ label: '关闭', primary: true, value: true }] });
  },
  openWithItems(path) {
    const kind = Kind.of(FS.base(path), 'file');
    const all = [
      { k: 'notepad', label: '记事本', icon: 'text', kinds: ['text', 'code', 'sheet', 'html', 'file', 'font'] },
      { k: 'editor', label: '代码编辑器', icon: 'editor', kinds: ['html', 'code', 'text'] },
      { k: 'sheet', label: '表格', icon: 'sheet', kinds: ['sheet'] },
      { k: 'viewer', label: '图片查看器', icon: 'image', kinds: ['image'] },
      { k: 'manga', label: '漫画阅读器', icon: 'book', kinds: ['image'] },
      { k: 'player', label: '媒体播放器', icon: 'play', kinds: ['audio', 'video'] },
      { k: 'browser', label: '网页浏览器', icon: 'browser', kinds: ['html', 'pdf'] },
      { k: 'vm', label: '虚拟机', icon: 'chip', kinds: ['disk'] }
    ];
    const rel = all.filter(a => a.kinds.includes(kind));
    return [
      ...rel.map(a => ({ label: a.label, icon: a.icon, fn: () => Shell.openWith(path, a.k) })),
      rel.length ? '-' : null,
      { label: '以纯文本形式打开', icon: 'text', fn: () => Shell.openWith(path, 'text') }
    ].filter(Boolean);
  },
  itemMenu(paths, ctx = {}) {
    const one = paths.length === 1 ? paths[0] : null;
    const kind = one ? Kind.of(FS.base(one), 'file') : '';
    const isDir = one && ctx.dirs && ctx.dirs.has(one);
    const dir = ctx.dir || FS.desk();
    const items = [];
    if (one) {
      items.push({ label: '打开', icon: 'play', fn: () => Shell.open(one, ctx) });
      if (!isDir) items.push({ label: '打开方式', icon: 'editor', sub: this.openWithItems(one) });
      if (!isDir && (kind === 'html' || kind === 'pdf')) items.push({ label: '在网页浏览器中打开', icon: 'browser', fn: () => Shell.openWith(one, 'browser') });
      if (!isDir && kind === 'archive') items.push({ label: '解压到此处', icon: 'extract', fn: () => Archive.extractHere(one).then(() => ctx.onChange && ctx.onChange()) });
      items.push('-');
    }
    items.push({ label: '复制', icon: 'copy', hint: 'Ctrl+C', disabled: !paths.length, fn: () => this.setClip('copy', paths) });
    items.push({ label: '剪切', icon: 'cut', hint: 'Ctrl+X', disabled: !paths.length, fn: () => this.setClip('cut', paths) });
    items.push({ label: '粘贴', icon: 'paste', hint: 'Ctrl+V', disabled: !this.clip.paths.length, fn: () => this.paste(dir).then(() => ctx.onChange && ctx.onChange()) });
    items.push('-');
    items.push({ label: '重命名', icon: 'rename', hint: 'F2', disabled: paths.length !== 1, fn: () => this.rename(one).then(() => ctx.onChange && ctx.onChange()) });
    items.push({ label: '删除', icon: 'trash', hint: 'Del', danger: true, disabled: !paths.length, fn: () => this.del(paths).then(() => ctx.onChange && ctx.onChange()) });
    items.push('-');
    items.push({ label: paths.length > 1 || (one && isDir) ? '压缩为 ZIP' : '导出 / 下载', icon: paths.length > 1 || (one && isDir) ? 'archive' : 'download', disabled: !paths.length, fn: () => ((paths.length > 1 || (one && isDir)) ? Archive.compress(paths, dir) : Archive.exportPaths(paths)) });
    if (one && kind === 'image') items.push({ label: '设为壁纸', icon: 'mountain', fn: () => this.setWall(one) });
    items.push({ label: '属性', icon: 'info', disabled: paths.length !== 1, fn: () => this.props(one) });
    return items;
  },
  async setWall(path) {
    try {
      const b = await FS.read(path);
      const f = new File([b], FS.base(path), { type: mimeOf(path), lastModified: Date.now() });
      await Wall.setCustom(f);
      UI.toast('壁纸已更新', 'ok');
    } catch (e) { UI.err(e); }
  }
};

/* ==================== 19. 打开分派（文件 / 文件夹统一入口） ==================== */
const Shell = {
  async open(path, opts = {}) {
    try {
      const st = await FS.stat(path);
      if (!st) { UI.toast('文件或文件夹不存在', 'err'); return; }
      if (st.type === 'dir') { Explorer.openAt(path, opts); return; }
      this.recent(st);
      switch (st.kind) {
        case 'image': return Apps.launch('manga', { path });
        case 'audio': case 'video': return Apps.launch('player', { path });
        case 'html': return Apps.launch('editor', { path, preview: true });
        case 'sheet': return Apps.launch('sheet', { path });
        case 'pdf': return Apps.launch('browser', { file: path });
        case 'archive': return Archive.openArchive(path, opts);
        case 'disk': return Apps.launch('vm', { path });
        case 'text': case 'code': return Apps.launch('notepad', { path });
        default: return Apps.launch('notepad', { path, force: true });
      }
    } catch (e) { UI.err(e, '打开失败：'); }
  },
  openWith(path, app) {
    switch (app) {
      case 'notepad': return Apps.launch('notepad', { path });
      case 'editor': return Apps.launch('editor', { path });
      case 'sheet': return Apps.launch('sheet', { path });
      case 'viewer': return Apps.launch('viewer', { path });
      case 'manga': return Apps.launch('manga', { path });
      case 'player': return Apps.launch('player', { path });
      case 'browser': return Apps.launch('browser', { file: path });
      case 'vm': return Apps.launch('vm', { path });
      case 'text': return Apps.launch('notepad', { path, force: true });
    }
  },
  recent(st) {
    const list = Cfg.d.recent.filter(r => r.path !== st.path);
    list.unshift({ path: st.path, name: st.name, kind: st.kind, at: Date.now() });
    Cfg.d.recent = list.slice(0, 12);
    Cfg.saveSoon();
  },
  pickWallpaper() { $('#picker-img').value = ''; $('#picker-img').onchange = e => { const f = e.target.files[0]; if (f) Wall.setCustom(f).then(() => UI.toast('壁纸已更换', 'ok')).catch(err => UI.err(err)); }; $('#picker-img').click(); },
  fullscreen() {

  open(opts = {}) {

class ExplorerApp {

    const body = this.el.body = U.h('div', { class: 'ex-body' }, this.el.scroll, this.el.mc, this.el.drop, this.el.loading);
    this.el.main = U.h('div', { class: 'ex-main' }, bar1, bar2, body, this.el.status);
    this.el.root = U.h('div', { class: 'ex' }, this.el.side, this.el.main);

  layout() { this.applyCols(); }
  paintToolbar() {
    this.el.seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === this.view));
    this.el.selBtn.classList.toggle('on', this.touchSel);

  }
  applyCols() {
