/* ============ 任务栏 ============ */
const Taskbar={pinned:['files','browser','htmleditor','terminal','settings'],
  init(){const sb=$('#start-btn');sb.innerHTML=DUNE_LOGO(24);sb.onclick=e=>{e.stopPropagation();StartMenu.toggle();};
    const tray=$('#tray');
    const theme=h('button',{class:'tb-btn tb-hide-m',title:'切换深色 / 浅色'});const syncTheme=()=>theme.innerHTML=svg(Settings.get('theme')==='light'?'sun':'moon',18);syncTheme();
    theme.onclick=()=>{Settings.set('theme',Settings.get('theme')==='light'?'dark':'light');};Settings.on(k=>{if(k==='theme')syncTheme();});
    const fsb=h('button',{class:'tb-btn tb-hide-m',title:'全屏模式',html:svg('fs',18),onclick:()=>toggleFullscreen()});
    document.addEventListener('fullscreenchange',()=>fsb.innerHTML=svg(document.fullscreenElement?'exitfs':'fs',18));
    const store=h('button',{class:'tb-btn tb-hide-m',title:'存储',html:svg('database',18),onclick:()=>APPS.settings.open({page:'storage'})});
    const clock=h('button',{class:'tb-btn',id:'clock',html:'<span class="ck-t"></span><span class="ck-d"></span>',onclick:e=>{e.stopPropagation();Calendar.toggle();}});
    tray.append(store,theme,fsb,clock);this.tick();setInterval(()=>this.tick(),1000);
    const sd=$('#show-desktop');let pt;sd.onclick=()=>{WM.unpeek();WM.showDesktop();};
    sd.onpointerenter=()=>{pt=setTimeout(()=>{if(Settings.get('peek'))WM.layer.classList.add('peek-all');},450);};sd.onpointerleave=()=>{clearTimeout(pt);WM.layer.classList.remove('peek-all');};
    $('#taskbar').addEventListener('contextmenu',e=>{if(e.target.closest('.tk'))return;e.preventDefault();Menu.open(e.clientX,e.clientY,[{label:'显示桌面',icon:'desktop',action:()=>WM.showDesktop()},{label:'任务栏设置',icon:'settings',action:()=>APPS.settings.open({page:'desktop'})}]);});},
  tick(){const d=new Date(),c=$('#clock');if(!c)return;c.querySelector('.ck-t').textContent=fmtTime(d,Settings.get('showSeconds'));c.querySelector('.ck-d').textContent=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;},
  render:debounce(function(){Taskbar._render();},16),
  _render(){const box=$('#task-apps');if(!box)return;box.innerHTML='';const hidden=new Set(Settings.get('hiddenApps')),wins=[...WM.wins.values()],used=new Set();
    for(const id of this.pinned){if(hidden.has(id)||!APPS[id])continue;const ws=wins.filter(w=>w.app===id);if(ws.length)ws.forEach(w=>{box.append(this.item(w));used.add(w.id);});else box.append(this.launcher(id));}
    const rest=wins.filter(w=>!used.has(w.id));if(rest.length){box.append(h('div',{class:'tk-sep'}));rest.forEach(w=>box.append(this.item(w)));}},
  launcher(id){const a=APPS[id];const b=h('button',{class:'tk',title:a.name,html:`<span class="tk-ico">${a.icon}</span>`});b.onclick=()=>a.open();return b;},
  item(w){const lab=Settings.get('taskLabels');const b=h('button',{class:'tk open'+(w.id===WM.active?' active':'')+(w.minimized?' minimized':''),title:w.title,
      html:`<span class="tk-ico">${w.icon||''}</span>${lab?`<span class="tk-t">${esc(w.title)}</span>`:''}<span class="tk-x" title="关闭">${svg('close',12)}</span>`});
    b.onclick=e=>{if(e.target.closest('.tk-x')){e.stopPropagation();WM.close(w.id);return;}WM.unpeek();if(w.minimized)WM.restore(w.id);else if(WM.active===w.id)WM.minimize(w.id);else WM.focus(w.id);};
    b.onauxclick=e=>{if(e.button===1)WM.close(w.id);};
    let pt;b.onpointerenter=e=>{if(e.pointerType!=='mouse')return;pt=setTimeout(()=>WM.peek(w.id),550);};b.onpointerleave=()=>{clearTimeout(pt);WM.unpeek();};
    b.oncontextmenu=e=>{e.preventDefault();WM.winMenu(w,e.clientX,e.clientY-200);};return b;}
};
function toggleFullscreen(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el)?.catch?.(()=>UI.toast('浏览器拒绝了全屏请求',{type:'err'}));}}

/* ============ 开始菜单 ============ */
const StartMenu={
  toggle(){$('#start-menu').classList.contains('on')?this.close():this.open();},
  open(){Calendar.close();const el=$('#start-menu');this.render();el.classList.add('on');$('#start-btn').classList.add('on');setTimeout(()=>{if(!isTouch())el.querySelector('input')?.focus();},60);},
  close(){$('#start-menu').classList.remove('on');$('#start-btn').classList.remove('on');this.ac?.abort();},
  render(){const el=$('#start-menu');el.innerHTML='';const hidden=new Set(Settings.get('hiddenApps'));
    const inp=h('input',{placeholder:'搜索应用、文件与设置…'});const sb=h('div',{class:'sm-search',html:svg('search',18)});sb.append(inp);
    const body=h('div',{class:'sm-body'});el.append(sb,body);
    const foot=h('div',{class:'sm-foot'});
    foot.innerHTML=`<div class="sm-user"><span class="sm-avatar">${appIcon('star','#e8832f','#5a2a0e')}</span><span>${esc(Settings.get('userName'))}</span></div>`;
    foot.append(h('button',{class:'tb-btn',title:'设置',html:svg('settings',18),onclick:()=>{this.close();APPS.settings.open();}}),
      h('button',{class:'tb-btn',title:'全屏模式',html:svg('fs',18),onclick:()=>{this.close();toggleFullscreen();}}),
      h('button',{class:'tb-btn',title:'重新启动（刷新）',html:svg('power',18),onclick:()=>location.reload()}));
    el.append(foot);
    const home=()=>{body.innerHTML='';body.append(h('div',{class:'sm-h',html:'Applications <small>全部应用</small>'}));const g=h('div',{class:'sm-grid'});let i=0;
      for(const a of Object.values(APPS)){if(hidden.has(a.id)||a.internal)continue;const b=h('button',{class:'sm-app',style:{animationDelay:(i++*18)+'ms'},html:`<span class="sa-i">${a.icon}</span><span>${esc(a.name)}</span>`});b.onclick=()=>{this.close();a.open();};g.append(b);}
      body.append(g);const rec=(Settings.get('recent')||[]).slice(0,6);
      if(rec.length){body.append(h('div',{class:'sm-h',html:'Recent <small>最近打开</small>'}));const l=h('div');rec.forEach(p=>l.append(this.fileRow({path:p,name:P.base(p),kind:'file'})));body.append(l);}};
    home();
    const run=debounce(async q=>{this.ac?.abort();if(!q)return home();const ac=this.ac=new AbortController();body.innerHTML='';
      const apps=Object.values(APPS).filter(a=>!hidden.has(a.id)&&!a.internal&&(a.name.includes(q)||a.id.includes(q.toLowerCase())));
      if(apps.length){body.append(h('div',{class:'sm-h',html:'Apps <small>应用</small>'}));apps.forEach(a=>body.append(h('button',{class:'sm-row',html:`<span class="sr-i">${a.icon}</span><span>${esc(a.name)}</span>`,onclick:()=>{this.close();a.open();}})));}
      const pages=SettingsPages.filter(p=>p.title.includes(q)||p.kw.includes(q));
      if(pages.length){body.append(h('div',{class:'sm-h',html:'Settings <small>设置</small>'}));pages.forEach(p=>body.append(h('button',{class:'sm-row',html:`<span class="sr-i" style="color:var(--accent)">${svg(p.icon,24)}</span><span>${esc(p.title)}</span>`,onclick:()=>{this.close();APPS.settings.open({page:p.id});}})));}
      const fh=h('div',{class:'sm-h',html:'Files <small><span class="spin" style="display:inline-block;vertical-align:middle"></span> 正在全局搜索</small>'});const fl=h('div');body.append(fh,fl);let n=0;
      await vfs.search('/',q,{signal:ac.signal,limit:40,onHit:e=>{n++;fl.append(this.fileRow(e));}});if(ac.signal.aborted)return;
      fh.querySelector('small').textContent=n?`找到 ${n} 项`:'没有匹配的文件';},220);
    inp.oninput=()=>run(inp.value.trim());
    inp.onkeydown=e=>{if(e.key==='Enter'){const f=body.querySelector('.sm-row,.sm-app');f&&f.click();}};},
  fileRow(e){const b=h('button',{class:'sm-row',html:`<span class="sr-i">${entryIcon(e)}</span><span style="min-width:0;flex:1"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}</div><div class="sr-sub">${esc(P.dir(e.path))}</div></span>`});
    b.onclick=()=>{this.close();Shell.open(e.path);};return b;}
};

/* ============ 日历 ============ */
const Calendar={y:0,m:0,pick:null,
  toggle(){$('#calendar').classList.contains('on')?this.close():this.open();},
  open(){StartMenu.close();const d=new Date();this.y=d.getFullYear();this.m=d.getMonth();this.pick=null;this.render();$('#calendar').classList.add('on');clearInterval(this._t);this._t=setInterval(()=>this.renderTime(),1000);},
  close(){$('#calendar').classList.remove('on');clearInterval(this._t);},
  renderTime(){const el=$('#calendar .cal-time');if(!el)return;const d=new Date();const t=fmtTime(d,true);const m=t.match(/^(上午|下午)?\s*(.*)$/);el.innerHTML=`${esc(m[2])}${m[1]?`<small>${m[1]}</small>`:''}`;},
  render(){const el=$('#calendar'),now=new Date(),wk='日一二三四五六';const fd=Settings.get('dateFirstDay')??1;
    el.innerHTML=`<div class="cal-time"></div><div class="cal-date">${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${wk[now.getDay()]}</div>
      <div class="cal-head"><b>${this.y} 年 ${this.m+1} 月</b><div style="display:flex;gap:2px"><button class="tbtn" data-a="today" title="回到今天">今天</button><button class="tbtn" data-a="prev" title="上个月">${svg('back',16)}</button><button class="tbtn" data-a="next" title="下个月">${svg('fwd',16)}</button></div></div><div class="cal-grid"></div><div class="cal-pick" style="margin-top:10px;font-size:12px;color:var(--text-3);min-height:16px"></div>`;
    this.renderTime();const g=el.querySelector('.cal-grid');for(let i=0;i<7;i++)g.append(h('div',{class:'wd'},wk[(i+fd)%7]));
    const first=new Date(this.y,this.m,1),off=(first.getDay()-fd+7)%7,start=new Date(this.y,this.m,1-off);
    for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const isT=d.toDateString()===now.toDateString(),pk=this.pick&&d.toDateString()===this.pick.toDateString();
      const b=h('button',{class:(d.getMonth()!==this.m?'mute ':'')+(isT?'today ':'')+(pk?'pick':'')},d.getDate());
      b.onclick=e=>{e.stopPropagation();this.pick=d;if(d.getMonth()!==this.m){this.y=d.getFullYear();this.m=d.getMonth();}this.render();
        const diff=Math.round((new Date(d.toDateString())-new Date(now.toDateString()))/864e5);el.querySelector('.cal-pick').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${wk[d.getDay()]} · ${diff===0?'今天':diff>0?diff+' 天后':(-diff)+' 天前'}`;};g.append(b);}
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.a;if(a==='prev'){this.m--;if(this.m<0){this.m=11;this.y--;}}else if(a==='next'){this.m++;if(this.m>11){this.m=0;this.y++;}}else{this.y=now.getFullYear();this.m=now.getMonth();this.pick=null;}this.render();});
    el.onwheel=e=>{e.preventDefault();this.m+=e.deltaY>0?1:-1;if(this.m<0){this.m=11;this.y--;}if(this.m>11){this.m=0;this.y++;}this.render();};}
};

<!-- ===================== 4. Shell / 拖放 / 桌面 ===================== -->
<script>
'use strict';
const fsErr=e=>{console.warn(e);UI.toast(e.code==='EEXIST'?'同名项目已存在':e.code==='EACCES'?'没有访问权限':'操作失败',{type:'err',sub:e.message});};
/* ============ Shell：打开 / 打开方式 ============ */
const Shell={
  async open(path,o={}){path=P.norm(path);let s;try{s=await vfs.stat(path);}catch(e){return UI.toast('无法打开',{type:'err',sub:e.message});}
    if(s.kind==='directory'){if(o.explorer)return o.explorer.go(path);return APPS.files.open({path});}
    this.addRecent(path);const app=o.with||this.defaultApp(s.name);if(app==='ask')return this.openWith(path);APPS[app].open({path});},
  defaultApp(name){const k=kindOf(name);switch(k){case 'image':return Settings.get('imageOpener')==='viewer'?'viewer':'manga';case 'audio':case 'video':return 'media';case 'html':return Settings.get('htmlOpener')||'htmleditor';
    case 'table':return 'sheet';case 'pdf':return 'pdf';case 'archive':return 'archive';case 'font':return 'font';case 'disk':return 'v86';case 'code':case 'text':return 'notepad';default:return 'ask';}},
  openers(name){const k=kindOf(name),e=P.ext(name),l=[];const add=(...a)=>a.forEach(x=>!l.includes(x)&&l.push(x));
    if(k==='image')add('manga','viewer','browser');if(e==='svg')add('htmleditor');if(k==='audio'||k==='video')add('media','browser');if(k==='html')add('htmleditor','browser');
    if(k==='pdf')add('pdf','browser');if(k==='table')add('sheet');if(k==='archive')add('archive');if(k==='disk')add('v86');if(k==='font')add('font');
    if(['md','markdown','css','js','mjs','json','xml'].includes(e))add('htmleditor');add('notepad','htmleditor');return l;},
  async openWith(path){const v=await UI.choose('选择打开方式 · '+P.base(path),this.openers(P.base(path)).map(id=>({label:APPS[id].name,iconHtml:APPS[id].icon,value:id,desc:id==='notepad'?'以纯文本形式打开':APPS[id].desc})),{icon:'external'});if(v){this.addRecent(path);APPS[v].open({path});}},
  addRecent(p){const r=(Settings.get('recent')||[]).filter(x=>x!==p);r.unshift(p);Settings.set('recent',r.slice(0,12));}
};
const TEMPLATES={html:'<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>新网页</title>\n  <style>\n    body { font-family: serif; padding: 40px; }\n  </style>\n</head>\n<body>\n  <h1>你好，沙丘</h1>\n</body>\n</html>\n',md:'# 标题\n\n正文\n',csv:'列 A,列 B,列 C\n,,\n',json:'{\n  \n}\n'};

/* ============ 文件操作 ============ */
const Ops={clip:{mode:null,paths:[]},
  clipChanged(){document.dispatchEvent(new CustomEvent('clipchange'));},
  isCut(p){return this.clip.mode==='cut'&&this.clip.paths.includes(p);},
  async newFolder(dir){const n=await UI.prompt('新建文件夹','新建文件夹',{icon:'folderPlus'});if(!n)return;try{const p=await vfs.uniqueName(dir,n);await vfs.mkdir(p);return p;}catch(e){fsErr(e);}},
  async newFile(dir,def='新建文本文档.txt'){const n=await UI.prompt('新建文件',def,{icon:'filePlus',select:'stem'});if(!n)return;try{const p=await vfs.uniqueName(dir,n);await vfs.writeFile(p,TEMPLATES[P.ext(n)]||'');return p;}catch(e){fsErr(e);}},
  async rename(path){const old=P.base(path);const n=await UI.prompt('重命名',old,{select:'stem'});if(!n||n===old)return;const to=P.join(P.dir(path),n);try{await vfs.rename(path,to);Desktop.onMoved(path,to);return to;}catch(e){fsErr(e);}},
  async remove(paths){if(!paths.length)return;if(Settings.get('confirmDelete')&&!(await UI.confirm(paths.length===1?`确定要永久删除「${P.base(paths[0])}」吗？此操作无法撤销。`:`确定要永久删除这 ${paths.length} 个项目吗？此操作无法撤销。`,{danger:true,ok:'删除',title:'删除',icon:'trash'})))return;
    const t=paths.length>3?UI.toast('正在删除…',{progress:0}):null;let i=0,ok=0;for(const p of paths){try{await vfs.rm(p,{recursive:true});ok++;}catch(e){fsErr(e);}t&&t.set(null,++i/paths.length);}t?t.done(`已删除 ${ok} 项`):ok&&UI.toast(`已删除 ${ok} 项`,{icon:'trash'});},
  copy(paths){this.clip={mode:'copy',paths:[...paths]};this.clipChanged();UI.toast(`已复制 ${paths.length} 项到剪贴板`,{icon:'copy'});},
  cut(paths){this.clip={mode:'cut',paths:[...paths]};this.clipChanged();UI.toast(`已剪切 ${paths.length} 项`,{icon:'cut'});},
  async paste(dir){const{mode,paths}=this.clip;if(!paths.length)return[];let r;if(mode==='cut'){r=await this.move(paths,dir);this.clip={mode:null,paths:[]};this.clipChanged();}else r=await this.copyTo(paths,dir);return r;},
  async move(paths,dir){dir=P.norm(dir);const out=[];const t=paths.length>2?UI.toast(`正在移动 ${paths.length} 项`,{progress:0}):null;let i=0;
    for(const p of paths){try{if(P.dir(p)===dir){out.push(p);continue;}if(P.isIn(dir,p)){UI.toast('不能把文件夹移动到自身内部',{type:'err'});continue;}const dst=await vfs.uniqueName(dir,P.base(p));await vfs.rename(p,dst);Desktop.onMoved(p,dst);out.push(dst);}catch(e){fsErr(e);}t&&t.set(null,++i/paths.length);}
    t&&t.done(`已移动 ${out.length} 项`);return out;},
  async copyTo(paths,dir){dir=P.norm(dir);const out=[];const t=UI.toast(`正在复制 ${paths.length} 项`,{progress:0});let i=0;
    for(const p of paths){try{if(P.isIn(dir,p)&&dir!==P.dir(p)){UI.toast('不能复制到自身内部',{type:'err'});continue;}const dst=await vfs.uniqueName(dir,P.base(p),P.dir(p)===dir?' - 副本':'');await vfs.copy(p,dst);out.push(dst);}catch(e){fsErr(e);}t.set(null,++i/paths.length);}
    t.done(`已复制 ${out.length} 项`);return out;},
  async download(paths){if(!paths.length)return;if(paths.length===1){const s=await vfs.stat(paths[0]);if(s.kind==='file'){const f=await vfs.readFile(paths[0]);UI.download(new File([f],s.name,{type:f.type,lastModified:s.mtime}),s.name);return;}}
    const t=UI.toast('正在打包为 ZIP…',{progress:0});try{const b=await Archive.zipPaths(paths,p=>t.set(null,p));UI.download(b,(paths.length===1?P.base(paths[0]):'导出-'+new Date().toISOString().slice(0,10))+'.zip');t.done('已导出到本机');}catch(e){t.done('导出失败：'+e.message,'err');}},
  async upload(dir,folder){const files=await UI.pickFiles({dir:folder});if(!files.length)return[];const t=UI.toast(`正在导入 ${files.length} 个文件`,{progress:0});let i=0;const tops=[],topMap={};
    for(const f of files){try{let target;if(folder&&f.webkitRelativePath){const parts=f.webkitRelativePath.split('/');if(!topMap[parts[0]]){topMap[parts[0]]=await vfs.uniqueName(dir,parts[0]);await vfs.mkdir(topMap[parts[0]]);tops.push(topMap[parts[0]]);}
          target=P.join(topMap[parts[0]],...parts.slice(1));await vfs.mkdir(P.dir(target),{recursive:true});}else{target=await vfs.uniqueName(dir,f.name);tops.push(target);}
        await vfs.writeFile(target,f,{mtime:f.lastModified});}catch(e){console.warn(e);}t.set(null,++i/files.length,f.name);}
    t.done(`已导入 ${files.length} 个文件`);return tops;},
  /* 物理桌面 → 虚拟：必须在事件同步阶段取出 entries */
  importDT(dt,dir){const items=[...(dt.items||[])].filter(i=>i.kind==='file');const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);const files=entries.length?[]:[...(dt.files||[])];
    if(!entries.length&&!files.length)return Promise.resolve([]);
    return(async()=>{const t=UI.toast('正在导入…',{progress:0});let n=0;const tops=[];
      const put=async(file,target)=>{await vfs.writeFile(target,file,{mtime:file.lastModified});n++;t.set(`已导入 ${n} 个文件`,null,file.name);};
      const walk=async(en,d,top)=>{if(en.isFile){const f=await new Promise((r,j)=>en.file(r,j));const tg=top?await vfs.uniqueName(d,f.name):P.join(d,f.name);if(top)tops.push(tg);await put(f,tg);}
        else if(en.isDirectory){const sub=top?await vfs.uniqueName(d,en.name):P.join(d,en.name);if(top)tops.push(sub);await vfs.mkdir(sub,{recursive:true});const rd=en.createReader();
          for(;;){const batch=await new Promise((r,j)=>rd.readEntries(r,j));if(!batch.length)break;for(const e of batch)await walk(e,sub,false);}
          try{const md=await new Promise((r,j)=>en.getMetadata(r,j));if(md&&md.modificationTime)await vfs.utimes(sub,0,md.modificationTime);}catch{}}};
      try{for(const e of entries)await walk(e,dir,true);for(const f of files){const tg=await vfs.uniqueName(dir,f.name);tops.push(tg);await put(f,tg);}t.done(`导入完成 · ${n} 个文件`);}catch(e){t.done('导入失败：'+e.message,'err');}
      return tops;})();},
  async extract(path,dest){dest=dest||await vfs.uniqueName(P.dir(path),P.stem(P.base(path)).replace(/\.tar$/i,''));const t=UI.toast('正在解压 '+P.base(path),{progress:0});
    try{const n=await Archive.extract(path,dest,(p,nm)=>t.set(null,p,nm));t.done(`解压完成 · ${n} 项`);return dest;}catch(e){t.done('解压失败：'+e.message,'err');}},

   通用框选（Mouse + Touch）
   - 选框 pointer-events:none，容器 position:relative，坐标累加 scroll

   - 40px 边缘自动滚动；AABB 对 offsetLeft/Top 碰撞

    const hit=new Set(st.base);for(const b of boxes)if(b.x<x2&&b.x+b.w>x1&&b.y<y2&&b.y+b.h>y1){if(st.add&&st.base.has(b.path))hit.delete(b.path);else hit.add(b.path);}onSelect(hit,boxes);};

    if(!st.moved){const s=toLocal(p.x,p.y);if(Math.hypot(s.x-st.sx,s.y-st.sy)<5)return;st.moved=true;

  return()=>{end();container.removeEventListener('mousedown',start);container.removeEventListener('touchstart',start);band.remove();};
}

function md2html(src){const L=String(src).replace(/\r/g,'').split('\n');let o='',i=0;

  return o;}

<script>

class Terminal{
  constructor(body,win,a){this.win=win;this.cwd=P.norm(a.cwd||'/');this.hist=JSON.parse(localStorage.getItem('duneos.termhist')||'[]');this.hi=this.hist.length;

    this.print(`<span class="pr">沙丘终端</span> <span class="dim">— 输入 help 查看命令。所有操作直接调用 fs 模块。</span>`);this.prompt();}
  print(html){this.el.append(h('div',{html}));this.el.scrollTop=this.el.scrollHeight;}
  out(t,cls=''){this.print(`<span class="${cls}">${esc(t)}</span>`);}
  prompt(){const line=h('div');line.innerHTML=`<span class="pr">旅人@dune</span>:<span class="dir">${esc(this.cwd)}</span>$ `;this.inp=h('input',{spellcheck:'false',autocapitalize:'off',autocomplete:'off'});line.append(this.inp);this.el.append(line);this.inp.focus({preventScroll:true});this.el.scrollTop=this.el.scrollHeight;

      else if(e.key==='ArrowUp'){e.preventDefault();if(this.hi>0)this.inp.value=this.hist[--this.hi];}else if(e.key==='ArrowDown'){e.preventDefault();this.inp.value=this.hi<this.hist.length-1?this.hist[++this.hi]:(this.hi=this.hist.length,'');}
      else if(e.key==='Tab'){e.preventDefault();this.complete();}else if(e.key==='l'&&e.ctrlKey){e.preventDefault();this.el.innerHTML='';this.prompt();}};}
  async complete(){const v=this.inp.value,parts=v.split(' '),last=parts.pop()||'';const dir=last.includes('/')?this.abs(last.slice(0,last.lastIndexOf('/')+1)||'/'):this.cwd,pre=last.slice(last.lastIndexOf('/')+1);
    try{const m=(await vfs.readdir(dir)).filter(e=>e.name.startsWith(pre));if(m.length===1){parts.push(last.slice(0,last.length-pre.length)+m[0].name+(m[0].kind==='directory'?'/':''));this.inp.value=parts.join(' ');}else if(m.length>1)this.out(m.map(e=>e.name).join('  '),'dim');}catch{}}
  abs(p){return P.norm(p.startsWith('/')?p:P.join(this.cwd,p));}

    try{switch(cmd){
      case 'help':this.print(`<span class="dim">ls [-l] · cd · pwd · cat · echo … [&gt; 文件] · mkdir [-p] · touch · rm [-r] · mv · cp · tree · du · stat · find 关键字 · open · edit · unzip · zip · df · mount · date · clear · history · neofetch</span>`);break;
      case 'pwd':emit(this.cwd);break;

      case 'ls':case 'dir':{const l=(await vfs.readdir(this.abs(ps[0]||'.'))).sort((a,b)=>(a.kind===b.kind?0:a.kind==='directory'?-1:1)||naturalCompare(a.name,b.name));
        if(flags.has('l'))l.forEach(e=>this.print(`<span class="dim">${e.kind==='directory'?'d':'-'} ${fmtSize(e.kind==='directory'?0:e.size).padStart(9)}  ${fmtDate(e.mtime)}</span>  <span class="${e.kind==='directory'?'dir':''}">${esc(e.name)}</span>`));
        else this.print(l.map(e=>`<span class="${e.kind==='directory'?'dir':''}">${esc(e.name)}</span>`).join('   ')||'<span class="dim">（空）</span>');break;}

function calcEval(s){const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+(e[+-]?\d+)?|[-+*/%()]/gi)||[];let i=0;
  const num=()=>{const x=t[i];if(x==='('){i++;const v=add();if(t[i]===')')i++;return v;}if(x==='-'){i++;return -num();}if(x==='+'){i++;return num();}i++;const v=parseFloat(x);if(isNaN(v))throw 0;if(t[i]==='%'){i++;return v/100;}return v;};
  const mul=()=>{let v=num();while(t[i]==='*'||t[i]==='/'){const o=t[i++],r=num();v=o==='*'?v*r:v/r;}return v;};
  const add=()=>{let v=mul();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=mul();v=o==='+'?v+r:v-r;}return v;};const v=add();if(i<t.length)throw 0;return v;}

  const fmt=v=>{if(!isFinite(v))return '错误';const r=+v.toPrecision(12);return String(r);};
  const press=k=>{if(k==='C'){ex='';done=false;}else if(k==='⌫'){ex=ex.slice(0,-1);}else if(k==='='){if(!ex)return;try{const r=fmt(calcEval(ex));hist.unshift(ex+' ='+'');ex=r;done=true;}catch{ex='错误';done=true;}}

    if(B.secondary&&vfs.mountAt('/mnt/'+B.secondary.kind)){el.append(this.card('迁移',this.row(`复制主磁盘到 ${B.secondary.label}`,'将 / 下的全部内容（保留修改日期）复制到 /mnt/'+B.secondary.kind+'/备份-日期',h('button',{class:'btn sm',onclick:async()=>{const dst='/mnt/'+B.secondary.kind+'/备份-'+new Date().toISOString().slice(0,10);

    el.append(this.card('清理',this.row('清除编辑草稿','记事本自动暂存的未保存内容',h('button',{class:'btn sm',onclick:async()=>{const ks=(await IDB.keys('kv')).filter(k=>String(k).startsWith('draft:'));for(const k of ks)await IDB.del('kv',k);UI.toast(`已清除 ${ks.length} 份草稿`);}},'清除'))));}
  p_mounts(el){this.head(el,'Mounts','↯','File System Access API · 挂载电脑上的真实文件夹到 /mnt/local');
    const c=this.card('已挂载',...vfs.mounts.filter(m=>m.kind==='local').map(m=>this.row(m.label,m.point,h('div',{style:{display:'flex',gap:'6px'}},h('button',{class:'btn sm',onclick:()=>APPS.files.open({path:m.point})},'打开'),h('button',{class:'btn sm',onclick:()=>{Mounts.unmount(m.point);this.show('mounts');}},'卸载')))));
    if(!vfs.mounts.some(m=>m.kind==='local'))c.append(this.row('暂无挂载的文件夹',Mounts.supported()?'点击下方按钮选择一个本地文件夹':'当前浏览器不支持 File System Access API（请使用桌面版 Chrome / Edge）'));el.append(c);
    if(Mounts.pending.length)el.append(this.card('需要重新授权','浏览器在刷新后会收回文件夹权限',...Mounts.pending.map(it=>this.row(P.base(it.point),it.point,h('div',{style:{display:'flex',gap:'6px'}},h('button',{class:'btn sm primary',onclick:async()=>{await Mounts.regrant(it);this.show('mounts');}},'重新挂载'),h('button',{class:'btn sm',onclick:()=>{Mounts.forget(it);this.show('mounts');}},'忘记'))))));
    el.append(h('button',{class:'btn primary',html:svg('plug',16)+'挂载本地文件夹…',onclick:async()=>{await Mounts.pick();this.show('mounts');}}));}
  p_about(el){this.head(el,'Dune','OS','一道山脊，把世界分成阴与阳');const ua=navigator.userAgentData?navigator.userAgentData.brands.map(b=>b.brand+' '+b.version).filter(x=>!/Not/.test(x)).join(' / '):navigator.userAgent;
    const F=[['OPFS',!!(navigator.storage&&navigator.storage.getDirectory)],['IndexedDB',!!window.indexedDB],['File System Access',!!window.showDirectoryPicker],['CompressionStream',!!window.CompressionStream],['DecompressionStream',!!window.DecompressionStream],['WebAssembly',!!window.WebAssembly],['Pointer Events',!!window.PointerEvent],['Fullscreen API',!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)],['Web Audio',!!(window.AudioContext||window.webkitAudioContext)]];
    const kv=h('div',{class:'kv'});kv.innerHTML=`<div><small>浏览器</small><b style="font-size:11.5px;word-break:break-all">${esc(ua)}</b></div><div><small>平台</small><b>${esc(navigator.userAgentData?.platform||navigator.platform||'—')}</b></div><div><small>屏幕</small><b>${screen.width}×${screen.height} @${devicePixelRatio}x</b></div><div><small>语言</small><b>${esc(navigator.language)}</b></div><div><small>输入</small><b>${isTouch()?'触控':'鼠标 / 触控板'}</b></div><div><small>主磁盘</small><b>${esc(vfs.mountAt('/').label)}</b></div>`;
    const f=h('div',{class:'kv'});f.innerHTML=F.map(([n,ok])=>`<div><small>${n}</small><span class="layer-tag ${ok?'ok':'no'}">${ok?'支持':'不支持'}</span></div>`).join('');
    el.append(this.card('系统信息',kv),this.card('浏览器能力',f),this.card('重置',
      this.row('重置设置','恢复所有个性化与偏好，不影响文件',h('button',{class:'btn sm',onclick:async()=>{if(await UI.confirm('确定恢复默认设置吗？')){localStorage.removeItem('duneos.settings');document.cookie='duneos=;max-age=0;path=/';await IDB.del('kv','settings').catch(()=>{});location.reload();}}},'重置设置')),
      this.row('一键重置系统','清除 OPFS、IndexedDB、localStorage 与 Cookie 中的全部数据，并重建虚拟文件系统。不会影响已挂载的本地文件夹中的真实文件。',h('button',{class:'btn sm danger',onclick:()=>resetSystem()},'清除并重置'))));}
}
async function resetSystem(){if(!(await UI.confirm('这将永久删除虚拟文件系统中的全部文件与设置，且无法恢复。确定继续吗？',{danger:true,ok:'全部清除',title:'一键重置'})))return;
  const t=UI.toast('正在重置…',{progress:.2});try{const r=await navigator.storage.getDirectory();await r.removeEntry('duneos',{recursive:true}).catch(()=>{});}catch{}t.set(null,.5);
  try{await IDB.clear('files');await IDB.clear('meta');await IDB.clear('kv');}catch{}t.set(null,.8);
  try{localStorage.removeItem('duneos.settings');localStorage.removeItem('duneos.termhist');}catch{}document.cookie='duneos=;max-age=0;path=/';Meta.map.clear();Meta.q.clear();t.done('已重置，正在重新启动');setTimeout(()=>location.reload(),700);}
regApp('settings',{name:'设置',icon:AICON.settings,desc:'个性化与系统',open(a={}){const w=WM.open({app:'settings',single:'settings',args:a,title:'设置',icon:AICON.settings,w:940,h:640,minW:340,content:(b,win)=>{win.sa=new SettingsApp(b,win,a);}});if(a.page&&w.sa)w.sa.show(a.page);}});

/* ============ 应用设置 ============ */
let _wpUrl=null;
async function applyWallpaper(){const v=String(Settings.get('wallpaper')||'builtin:noon'),el=$('#wallpaper');let url;
  if(v.startsWith('vfs:')){try{const b=await vfs.readFile(v.slice(4));if(_wpUrl)URL.revokeObjectURL(_wpUrl);_wpUrl=URL.createObjectURL(b);url=_wpUrl;}catch{url=WALLPAPERS.noon.url;}}else url=(WALLPAPERS[v.slice(8)]||WALLPAPERS.noon).url;
  el.style.backgroundImage=`url("${url}")`;el.style.backgroundSize=Settings.get('wpFit');}
function applySettings(){const s=Settings.data,b=document.body,root=document.documentElement.style;let th=s.theme;if(th==='auto')th=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  b.classList.toggle('theme-dark',th==='dark');b.classList.toggle('theme-light',th==='light');
  root.setProperty('--accent',s.accent);root.setProperty('--accent-2',th==='light'?'#3c7fb6':'#7fb6e0');root.setProperty('--radius',s.radius+'px');root.setProperty('--blur',s.blur+'px');root.setProperty('--glass',s.glass/100);root.setProperty('--scale',s.fontScale/100);root.setProperty('--wp-dim',s.wpDim/100);
  const mob=isMobile();b.classList.toggle('is-mobile',mob);b.classList.toggle('is-touch',isTouch());
  const IS=mob?{s:[72,82,34],m:[84,94,44],l:[98,108,54]}:{s:[78,86,36],m:[92,98,46],l:[112,120,62]};const[cw,ch,ip]=IS[s.iconSize]||IS.m;b.style.setProperty('--cell-w',cw+'px');b.style.setProperty('--cell-h',ch+'px');b.style.setProperty('--icon-px',ip+'px');
  b.classList.toggle('no-anim',!s.anim);b.classList.toggle('tb-autohide',s.taskbar==='autohide');b.classList.toggle('tb-hidden',s.taskbar==='hidden');b.classList.toggle('hide-icons',!s.showDesktopIcons);
  document.querySelector('meta[name=theme-color]').setAttribute('content',th==='light'?'#efe7dc':'#0d0a08');}
Settings.on(k=>{applySettings();if(k==='wallpaper'||k==='wpFit')applyWallpaper();if(['iconSize','hiddenApps'].includes(k)){Desktop.load();}if(['hour12','showSeconds'].includes(k))Taskbar.tick();if(k==='hiddenApps'||k==='taskLabels')Taskbar.render();});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>Settings.get('theme')==='auto'&&applySettings());

/* ============ 启动（无假加载动画，直接进入） ============ */
async function boot(){applySettings();Taskbar.init();DnD.install();Desktop.init();
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#start-menu,#start-btn'))StartMenu.close();if(!e.target.closest('#calendar,#clock'))Calendar.close();},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){StartMenu.close();Calendar.close();}if(e.key==='Meta'&&!e.repeat){/* 系统保留 */}if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();StartMenu.toggle();}});
  document.addEventListener('contextmenu',e=>{if(!e.defaultPrevented&&!e.target.closest('input,textarea,[contenteditable="true"],iframe,.CodeMirror'))e.preventDefault();});
  addEventListener('resize',debounce(()=>{const was=document.body.classList.contains('is-mobile');applySettings();if(was!==isMobile())Taskbar.render();},100));
  try{await initFS();}catch(e){console.error(e);UI.toast('文件系统初始化失败',{type:'err',sub:e.message});}
  applySettings();applyWallpaper();await Desktop.load();Taskbar.render();
  const pend=await Mounts.restore();
  if(pend.length)UI.toast(`有 ${pend.length} 个本地文件夹需要重新授权`,{sub:pend.map(p=>P.base(p.point)).join('、'),timeout:0,actions:[{label:'重新挂载',primary:true,fn:async()=>{for(const it of [...Mounts.pending])await Mounts.regrant(it);}},{label:'稍后',fn:()=>{}}]});
  if(Settings.fresh&&!localStorage.getItem('duneos.welcomed')){localStorage.setItem('duneos.welcomed','1');UI.toast('欢迎来到沙丘 OS',{sub:'单击打开 · 拖动摆放 · 右键获得更多 · 文件保存在 OPFS 中',icon:'star',timeout:6000});}
}
boot();
</script>
