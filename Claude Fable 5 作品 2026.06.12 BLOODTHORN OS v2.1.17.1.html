<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLOODTHORN OS — 血棘秘典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- V86 虚拟机模拟器（版本锁定 0.5.319，严禁替换） -->
<script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js" defer></script>
<!-- CodeMirror 代码编辑器 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js" defer></script>
<style>
/* ════════════════════ BLOODTHORN · 血棘诅咒主题 ════════════════════ */
:root{
  --void:#070409; --abyss:#0c0810; --iron:#151019; --steel:#1e1724; --ash:#2b2133;
  --vein:#3c2e44; --bone:#d9cdb8; --parch:#a89a82; --dust:#6d6053;
  --blood:#6e0f1d; --blood2:#9c1626; --ember:#e8394b; --ember2:#ff5c6c;
  --gold:#8f7340; --gold2:#c9a45c; --gold3:#ecd29a;
  --dockh:58px;
  --metal:linear-gradient(180deg,#2a2230 0%,#1a141f 45%,#120d16 55%,#1d1622 100%);
  --metal-lit:linear-gradient(180deg,#3a2f44 0%,#241c2c 50%,#191220 100%);
  --gold-line:linear-gradient(90deg,transparent,var(--gold2) 25%,var(--gold3) 50%,var(--gold2) 75%,transparent);
  --blood-line:linear-gradient(90deg,transparent,var(--blood2) 30%,var(--ember) 50%,var(--blood2) 70%,transparent);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; background:var(--void); color:var(--bone);
  font-family:'Cormorant Garamond',serif; font-size:17px;}
::selection{background:var(--blood2); color:var(--gold3);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--abyss);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--vein),var(--ash)); border:2px solid var(--abyss); border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--blood);}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
svg{display:block;}

/* ── 桌面 ── */
#desktop{position:fixed; inset:0 0 var(--dockh) 0; overflow:hidden; z-index:1;
  background:#0a0710 center/cover no-repeat; transition:background-image .6s ease;}
#desktop::before{content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 90% 70% at 50% 110%, rgba(110,15,29,.22), transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(60,46,68,.35), transparent 70%);}
#desktop::after{content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.045) 3px 4px); opacity:.6;}

/* 桌面图标 */
.dicon{position:absolute; width:88px; padding:8px 4px 6px; display:flex; flex-direction:column;
  align-items:center; gap:5px; cursor:default; user-select:none; border-radius:6px; z-index:2;
  border:1px solid transparent; transition:left .28s cubic-bezier(.22,1,.36,1), top .28s cubic-bezier(.22,1,.36,1),
  background .15s, border-color .15s, transform .15s; touch-action:none;}
.dicon:hover{background:rgba(201,164,92,.07); border-color:rgba(201,164,92,.18);}
.dicon.sel{background:rgba(156,22,38,.22); border-color:rgba(232,57,75,.5);
  box-shadow:0 0 18px rgba(156,22,38,.35), inset 0 0 12px rgba(156,22,38,.15);}
.dicon.dragging{opacity:.35; transition:none;}
.dicon .ic{width:46px; height:46px; color:var(--gold2); filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));}
.dicon.sel .ic{color:var(--ember);}
.dicon .lbl{font-family:'Cinzel',serif; font-size:11.5px; font-weight:600; letter-spacing:.03em;
  text-align:center; color:var(--bone); text-shadow:0 1px 3px #000, 0 0 8px rgba(0,0,0,.9);
  max-width:84px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  word-break:break-all; line-height:1.25;}
.dicon.droptarget{background:rgba(201,164,92,.18); border-color:var(--gold2); transform:scale(1.06);}

/* 框选 */
#marquee{position:fixed; z-index:9400; border:1px solid var(--ember); display:none;
  background:rgba(156,22,38,.12); box-shadow:inset 0 0 20px rgba(156,22,38,.15); pointer-events:none;}

/* ── 窗口 ── */
.win{position:absolute; min-width:320px; min-height:200px; display:flex; flex-direction:column;
  background:linear-gradient(180deg, rgba(30,23,36,.97), rgba(14,10,18,.97));
  border:1px solid #000; border-radius:8px; overflow:hidden;
  box-shadow:0 0 0 1px rgba(201,164,92,.22), 0 24px 70px rgba(0,0,0,.85), 0 4px 16px rgba(0,0,0,.6);
  animation:winIn .26s cubic-bezier(.22,1.2,.36,1);}
.win.focus{box-shadow:0 0 0 1px rgba(201,164,92,.45), 0 0 26px rgba(110,15,29,.4), 0 28px 80px rgba(0,0,0,.9);}
@keyframes winIn{from{opacity:0; transform:scale(.92) translateY(18px);} to{opacity:1; transform:none;}}
.win.closing{animation:winOut .2s ease forwards;}
@keyframes winOut{to{opacity:0; transform:scale(.94) translateY(10px);}}
.win.minimized{display:none;}
.win.maxed{border-radius:0;}
.tbar{height:40px; flex:none; display:flex; align-items:center; gap:9px; padding:0 6px 0 12px;
  background:var(--metal); border-bottom:1px solid #000; position:relative; cursor:default; user-select:none; touch-action:none;}
.tbar::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--gold-line); opacity:.5;}
.win.focus .tbar{background:var(--metal-lit);}
.win.focus .tbar::after{background:var(--blood-line); opacity:.9;}
.tbar .ticon{width:17px;height:17px;color:var(--gold2);flex:none;}
.tbar .ticon svg{width:100%;height:100%;}
.tbar .ttl{font-family:'Cinzel',serif; font-size:13px; font-weight:700; letter-spacing:.1em;
  color:var(--parch); flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.win.focus .tbar .ttl{color:var(--gold3);}
.tbtns{display:flex; gap:5px; flex:none;}
.tb{width:30px; height:26px; border:1px solid var(--vein); background:linear-gradient(180deg,var(--ash),var(--iron));
  color:var(--parch); border-radius:4px; display:flex; align-items:center; justify-content:center;
  transition:all .12s; padding:0;}
.tb svg{width:11px; height:11px;}
.tb:hover{border-color:var(--gold2); color:var(--gold3); background:linear-gradient(180deg,var(--vein),var(--ash));}
.tb.cls:hover{border-color:var(--ember); color:#fff; background:linear-gradient(180deg,var(--blood2),var(--blood));
  box-shadow:0 0 12px rgba(156,22,38,.6);}
.wbody{flex:1; overflow:hidden; position:relative; display:flex; flex-direction:column; min-height:0;}
/* resize handles */
.rh{position:absolute; z-index:5;}
.rh-n{top:-3px;left:8px;right:8px;height:7px;cursor:n-resize;}
.rh-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:s-resize;}
.rh-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:e-resize;}
.rh-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:w-resize;}
.rh-ne{top:-3px;right:-3px;width:13px;height:13px;cursor:ne-resize;}
.rh-nw{top:-3px;left:-3px;width:13px;height:13px;cursor:nw-resize;}
.rh-se{bottom:-3px;right:-3px;width:13px;height:13px;cursor:se-resize;}
.rh-sw{bottom:-3px;left:-3px;width:13px;height:13px;cursor:sw-resize;}
.win.maxed .rh{display:none;}

/* ── 任务栏 ── */
#taskbar{position:fixed; left:0; right:0; bottom:0; height:var(--dockh); z-index:9000;
  display:flex; align-items:center; gap:8px; padding:0 10px;
  background:linear-gradient(180deg, rgba(30,23,36,.92), rgba(10,7,13,.96));
  border-top:1px solid rgba(201,164,92,.3); backdrop-filter:blur(14px);}
#taskbar::before{content:''; position:absolute; top:-1px; left:0; right:0; height:1px; background:var(--gold-line); opacity:.55;}
#startBtn{height:42px; padding:0 14px; display:flex; align-items:center; gap:9px; border-radius:6px;
  border:1px solid var(--vein); background:linear-gradient(180deg,var(--ash),var(--iron)); color:var(--gold2);
  font-family:'Cinzel Decorative',serif; font-weight:700; font-size:14px; letter-spacing:.08em; transition:all .15s;}
#startBtn svg{width:22px;height:22px;}
#startBtn:hover, #startBtn.on{border-color:var(--gold2); color:var(--gold3);
  box-shadow:0 0 16px rgba(156,22,38,.45), inset 0 0 12px rgba(201,164,92,.1);}
#startBtn .sb-txt{display:inline;}
#tasks{flex:1; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:4px 2px;}
#tasks::-webkit-scrollbar{display:none;}
.task{height:42px; min-width:46px; max-width:190px; padding:0 12px; display:flex; align-items:center; gap:8px;
  border-radius:6px; border:1px solid var(--vein); background:linear-gradient(180deg,#241c2c,#15101a);
  color:var(--parch); font-family:'Cinzel',serif; font-size:12px; font-weight:600; letter-spacing:.05em;
  position:relative; transition:all .15s; flex:none;}
.task svg{width:17px;height:17px;flex:none;color:var(--gold2);}
.task span{overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.task.active{border-color:rgba(232,57,75,.55); color:var(--gold3);
  background:linear-gradient(180deg,#3a2330,#1c1018); box-shadow:0 0 14px rgba(110,15,29,.4);}
.task.active::after{content:''; position:absolute; bottom:-1px; left:18%; right:18%; height:2px;
  background:var(--blood-line); border-radius:2px;}
.task.minned{opacity:.55;}
#clock{flex:none; text-align:right; padding:0 8px; font-family:'Cinzel',serif; line-height:1.25; user-select:none;}
#clock .t{font-size:16px; font-weight:700; color:var(--gold3); letter-spacing:.08em;}
#clock .d{font-size:10.5px; color:var(--parch); letter-spacing:.12em;}

/* ── 开始菜单 ── */
#startMenu{position:fixed; left:10px; bottom:calc(var(--dockh) + 10px); width:420px; max-width:calc(100vw - 20px);
  max-height:min(620px, calc(100vh - var(--dockh) - 24px)); z-index:9100; display:none; flex-direction:column;
  background:linear-gradient(180deg, rgba(28,21,34,.97), rgba(10,7,13,.98));
  border:1px solid rgba(201,164,92,.35); border-radius:10px; overflow:hidden;
  box-shadow:0 -10px 60px rgba(0,0,0,.85), 0 0 30px rgba(110,15,29,.35);}
#startMenu.open{display:flex; animation:smIn .25s cubic-bezier(.22,1.2,.36,1);}
@keyframes smIn{from{opacity:0; transform:translateY(22px) scale(.97);} to{opacity:1; transform:none;}}
.sm-head{padding:18px 20px 12px; text-align:center; position:relative;}
.sm-head::after{content:''; position:absolute; left:10%; right:10%; bottom:0; height:1px; background:var(--gold-line); opacity:.5;}
.sm-head .sig{width:42px; height:42px; margin:0 auto 6px; color:var(--ember); filter:drop-shadow(0 0 10px rgba(232,57,75,.5));}
.sm-head h1{font-family:'Cinzel Decorative',serif; font-size:21px; font-weight:900; letter-spacing:.18em;
  background:linear-gradient(180deg,var(--gold3),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sm-head p{font-family:'IM Fell English',serif; font-style:italic; font-size:13px; color:var(--dust); margin-top:2px;}
.sm-search{margin:12px 16px 4px; position:relative;}
.sm-search input{width:100%; height:38px; padding:0 14px 0 38px; border-radius:6px; outline:none;
  border:1px solid var(--vein); background:rgba(7,4,9,.7); color:var(--bone); font-size:15px;}
.sm-search input:focus{border-color:var(--gold2); box-shadow:0 0 10px rgba(201,164,92,.2);}
.sm-search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--dust);}
.sm-grid{flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:14px 16px;}
.sm-app{display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px 11px;
  border-radius:8px; border:1px solid transparent; background:transparent; color:var(--bone);
  transition:all .15s; opacity:0; animation:tileIn .4s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes tileIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
.sm-app:hover{background:rgba(156,22,38,.16); border-color:rgba(232,57,75,.4); transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,.5);}
.sm-app .ic{width:36px; height:36px; color:var(--gold2);}
.sm-app:hover .ic{color:var(--ember2);}
.sm-app .nm{font-family:'Cinzel',serif; font-size:12px; font-weight:700; letter-spacing:.05em; text-align:center;}
.sm-app .ds{font-family:'IM Fell English',serif; font-style:italic; font-size:11px; color:var(--dust); text-align:center;}
.sm-foot{flex:none; display:flex; gap:8px; padding:10px 16px 12px; border-top:1px solid rgba(60,46,68,.6);}
.sm-fbtn{flex:1; height:34px; display:flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--vein); border-radius:5px; background:linear-gradient(180deg,var(--ash),var(--iron));
  color:var(--parch); font-family:'Cinzel',serif; font-size:11.5px; font-weight:600; letter-spacing:.06em; transition:all .15s;}
.sm-fbtn svg{width:14px;height:14px;}
.sm-fbtn:hover{border-color:var(--gold2); color:var(--gold3);}

/* ── 右键菜单 ── */
#ctxMenu{position:fixed; z-index:9500; min-width:210px; display:none; flex-direction:column; padding:6px;
  background:linear-gradient(180deg, rgba(30,23,36,.98), rgba(12,8,16,.98));
  border:1px solid rgba(201,164,92,.4); border-radius:8px;
  box-shadow:0 16px 50px rgba(0,0,0,.85), 0 0 20px rgba(110,15,29,.3);}
#ctxMenu.open{display:flex; animation:ctxIn .14s ease-out;}
@keyframes ctxIn{from{opacity:0; transform:scale(.95);} to{opacity:1; transform:none;}}
.ctx-it{display:flex; align-items:center; gap:11px; padding:8px 12px; border-radius:5px; border:none;
  background:none; color:var(--bone); font-family:'Cormorant Garamond',serif; font-size:15.5px; font-weight:600;
  letter-spacing:.02em; text-align:left; transition:all .1s; width:100%;}
.ctx-it svg{width:16px; height:16px; color:var(--gold2); flex:none;}
.ctx-it:hover{background:rgba(156,22,38,.28); color:var(--gold3);}
.ctx-it.danger{color:var(--ember2);}
.ctx-it.danger svg{color:var(--ember2);}
.ctx-it.danger:hover{background:rgba(156,22,38,.4); color:#fff;}
.ctx-it[disabled]{opacity:.35; pointer-events:none;}
.ctx-sep{height:1px; margin:5px 10px; background:linear-gradient(90deg,transparent,var(--vein),transparent);}

/* ── 对话框 ── */
#dlgWrap{position:fixed; inset:0; z-index:9600; display:none; align-items:center; justify-content:center;
  background:rgba(7,4,9,.65); backdrop-filter:blur(3px);}
#dlgWrap.open{display:flex; animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.dlg{width:min(440px, calc(100vw - 32px)); max-height:80vh; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#241c2c,#100b15); border:1px solid rgba(201,164,92,.45); border-radius:10px;
  box-shadow:0 24px 80px rgba(0,0,0,.9), 0 0 30px rgba(110,15,29,.35); overflow:hidden;
  animation:winIn .22s cubic-bezier(.22,1.2,.36,1);}
.dlg-t{padding:14px 20px 10px; font-family:'Cinzel',serif; font-size:15px; font-weight:700; letter-spacing:.12em;
  color:var(--gold3); border-bottom:1px solid rgba(60,46,68,.7); position:relative;}
.dlg-t::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--blood-line); opacity:.6;}
.dlg-b{padding:18px 20px; font-size:16px; color:var(--bone); overflow-y:auto;}
.dlg-b input[type=text]{width:100%; height:40px; margin-top:10px; padding:0 12px; border-radius:6px; outline:none;
  border:1px solid var(--vein); background:rgba(7,4,9,.8); color:var(--gold3); font-size:16px;}
.dlg-b input[type=text]:focus{border-color:var(--gold2);}
.dlg-f{display:flex; gap:10px; justify-content:flex-end; padding:12px 20px 16px;}
.btn{height:36px; padding:0 18px; border-radius:5px; border:1px solid var(--vein);
  background:linear-gradient(180deg,var(--ash),var(--iron)); color:var(--parch);
  font-family:'Cinzel',serif; font-size:12px; font-weight:700; letter-spacing:.08em; transition:all .15s;
  display:inline-flex; align-items:center; gap:7px; justify-content:center;}
.btn svg{width:14px;height:14px;}
.btn:hover{border-color:var(--gold2); color:var(--gold3); box-shadow:0 0 10px rgba(201,164,92,.2);}
.btn.primary{border-color:var(--blood2); background:linear-gradient(180deg,var(--blood2),var(--blood)); color:#f5e9d8;}
.btn.primary:hover{box-shadow:0 0 16px rgba(156,22,38,.6); color:#fff;}
.btn.gold{border-color:var(--gold); background:linear-gradient(180deg,#5a4827,#3a2e18); color:var(--gold3);}
.btn[disabled]{opacity:.4; pointer-events:none;}

/* ── Toast ── */
#toasts{position:fixed; right:16px; bottom:calc(var(--dockh) + 14px); z-index:9700; display:flex;
  flex-direction:column; gap:9px; align-items:flex-end; pointer-events:none;}
.toast{max-width:min(360px, calc(100vw - 32px)); padding:11px 16px; border-radius:7px; display:flex; gap:10px; align-items:center;
  background:linear-gradient(180deg,#241c2c,#120d17); border:1px solid rgba(201,164,92,.45); color:var(--bone);
  font-size:15px; box-shadow:0 10px 32px rgba(0,0,0,.7); animation:toastIn .3s cubic-bezier(.22,1.2,.36,1); pointer-events:auto;}
.toast svg{width:17px;height:17px;flex:none;color:var(--gold2);}
.toast.err{border-color:var(--ember); }
.toast.err svg{color:var(--ember2);}
.toast.fading{animation:toastOut .35s ease forwards;}
@keyframes toastIn{from{opacity:0; transform:translateX(40px);} to{opacity:1; transform:none;}}
@keyframes toastOut{to{opacity:0; transform:translateX(40px);}}

/* ── 通用应用工具栏 ── */
.atb{flex:none; display:flex; align-items:center; gap:6px; padding:7px 10px; flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(43,33,51,.6),rgba(21,16,25,.6)); border-bottom:1px solid rgba(60,46,68,.7);}
.atb .sp{flex:1;}
.itb{height:31px; min-width:31px; padding:0 9px; display:inline-flex; align-items:center; gap:6px; border-radius:5px;
  border:1px solid var(--vein); background:linear-gradient(180deg,var(--ash),var(--iron)); color:var(--parch);
  font-family:'Cinzel',serif; font-size:11px; font-weight:700; letter-spacing:.05em; transition:all .13s;}
.itb svg{width:14px;height:14px;}
.itb:hover{border-color:var(--gold2); color:var(--gold3);}
.itb.on{border-color:var(--ember); color:var(--gold3); background:linear-gradient(180deg,#3a2330,#1c1018);}
.itb[disabled]{opacity:.35; pointer-events:none;}

/* ── 文件管理器 ── */
.fx{display:flex; flex:1; min-height:0;}
.fx-side{width:188px; flex:none; overflow-y:auto; padding:10px 8px; border-right:1px solid rgba(60,46,68,.7);
  background:rgba(12,8,16,.5);}
.fx-side h4{font-family:'Cinzel',serif; font-size:10px; font-weight:700; letter-spacing:.2em; color:var(--dust);
  padding:10px 9px 5px;}
.fx-si{display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border-radius:5px; border:none;
  background:none; color:var(--bone); font-size:14.5px; font-weight:600; text-align:left; transition:all .1s;}
.fx-si svg{width:15px;height:15px;color:var(--gold2);flex:none;}
.fx-si:hover{background:rgba(201,164,92,.1);}
.fx-si.on{background:rgba(156,22,38,.25); color:var(--gold3);}
.fx-si span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   BLOODTHORN OS — 单文件 Web 操作系统
   核心：OPFS 虚拟文件系统（IndexedDB / 内存+localStorage 降级链）
   ═══════════════════════════════════════════════════════════════════ */

/* ── 路径工具 ── */
const P = {
  norm(p){ const seg=String(p||'/').split('/').filter(s=>s&&s!=='.'); const out=[];
    for(const s of seg){ if(s==='..') out.pop(); else out.push(s); } return '/'+out.join('/'); },
  join(...a){ return P.norm(a.join('/')); },
  dir(p){ p=P.norm(p); const i=p.lastIndexOf('/'); return i<=0?'/':p.slice(0,i); },
  base(p){ p=P.norm(p); return p==='/'?'/':p.slice(p.lastIndexOf('/')+1); },
  ext(p){ const b=P.base(p); const i=b.lastIndexOf('.'); return i>0?b.slice(i+1).toLowerCase():''; }
};

const MIME = {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',
  webp:'image/webp',bmp:'image/bmp',ico:'image/x-icon',avif:'image/avif',
  mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',aac:'audio/aac',m4a:'audio/mp4',opus:'audio/ogg',
  mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',mov:'video/quicktime',
  txt:'text/plain',html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',
  json:'application/json',xml:'application/xml',md:'text/markdown',yaml:'text/yaml',yml:'text/yaml',log:'text/plain',
  csv:'text/csv',tsv:'text/tab-separated-values',pdf:'application/pdf',zip:'application/zip',
  gz:'application/gzip',tar:'application/x-tar',tgz:'application/gzip','7z':'application/x-7z-compressed',
  iso:'application/octet-stream',img:'application/octet-stream',wasm:'application/wasm',ttf:'font/ttf',woff2:'font/woff2'};
const mimeOf = p => MIME[P.ext(p)] || 'application/octet-stream';

const IMG_EXT=['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'];
const AUD_EXT=['mp3','wav','ogg','flac','aac','m4a','opus'];
const VID_EXT=['mp4','webm','ogv','mov'];
const TXT_EXT=['txt','html','htm','css','js','mjs','json','xml','md','yaml','yml','log','ini','sh','py','c','h','cpp','rs','java','ts','tsx','jsx','toml','conf','bat','svg'];
const TBL_EXT=['csv','tsv'];
const ARC_EXT=['zip','gz','tar','tgz','7z'];
const VM_EXT=['iso','img','fda','bin'];
const CODE_EXT=['html','htm','css','js','mjs','json','xml','ts','jsx','tsx'];

const fmtSize = n => { if(n==null||isNaN(n)) return '—'; if(n<1024) return n+' B';
  const u=['KB','MB','GB','TB']; let i=-1; do{ n/=1024; i++; }while(n>=1024&&i<3);
  return n.toFixed(n<10?2:1)+' '+u[i]; };
const fmtDate = t => { if(!t) return '—'; const d=new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const typeOf = (name,kind) => { if(kind==='directory') return '文件夹'; const e=P.ext(name);
  if(IMG_EXT.includes(e)) return e.toUpperCase()+' 图像'; if(AUD_EXT.includes(e)) return e.toUpperCase()+' 音频';
  if(VID_EXT.includes(e)) return e.toUpperCase()+' 视频'; if(ARC_EXT.includes(e)) return e.toUpperCase()+' 压缩档';
  if(e==='pdf') return 'PDF 文档'; if(TBL_EXT.includes(e)) return e.toUpperCase()+' 表格';
  if(TXT_EXT.includes(e)) return e.toUpperCase()+' 文本'; if(VM_EXT.includes(e)) return '磁盘镜像';
  return e? e.toUpperCase()+' 文件' : '文件'; };
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── 配置（localStorage + Cookie 协同） ── */
const Cfg = {
  _k:'btos-cfg', _c:null,
  all(){ if(!this._c){ try{ this._c=JSON.parse(localStorage.getItem(this._k))||{}; }catch{ this._c={}; } } return this._c; },
  get(k,d){ const v=this.all()[k]; return v===undefined?d:v; },
  set(k,v){ this.all()[k]=v; try{ localStorage.setItem(this._k, JSON.stringify(this._c)); }catch{} }
};
function setCookie(k,v,days=365){ try{ document.cookie=`${k}=${encodeURIComponent(v)};max-age=${days*86400};path=/;SameSite=Lax`; }catch{} }
function getCookie(k){ try{ const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)')); return m?decodeURIComponent(m[1]):null; }catch{ return null; } }

/* ═══════════════ 文件系统后端 ═══════════════ */

/* OPFS / File System Access 通用句柄后端（两者共用 FileSystemDirectoryHandle 接口） */
function handleBackend(root){
  const segs = rel => String(rel||'').split('/').filter(Boolean);
  async function dirOfSegs(ss, create=false){ let d=root;
    for(const s of ss) d=await d.getDirectoryHandle(s,{create}); return d; }
  async function fileOf(rel, create=false){ const ss=segs(rel); const name=ss.pop();
    if(!name) throw new Error('无效文件路径'); const d=await dirOfSegs(ss, create);
    return d.getFileHandle(name,{create}); }
  return {
    type:'handle', root,
    async readdir(rel, ...x){ const d=await dirOfSegs(segs(rel)); const out=[];
      for await (const [name,h] of d.entries()) out.push({name, kind:h.kind}); return out; },
    async stat(rel, ...x){ const ss=segs(rel);
      if(!ss.length) return {kind:'directory', size:0, mtime:0};
      try{ const fh=await fileOf(rel); const f=await fh.getFile();
        return {kind:'file', size:f.size, mtime:f.lastModified, mime:f.type||mimeOf(rel)}; }
      catch(e){ await dirOfSegs(ss); return {kind:'directory', size:0, mtime:0}; } },
    async readFile(rel, ...x){ const fh=await fileOf(rel); return fh.getFile(); },
    async writeFile(rel, data, ...x){ const ss=segs(rel); const name=ss.pop();
      const d=await dirOfSegs(ss, true); const fh=await d.getFileHandle(name,{create:true});
      const w=await fh.createWritable(); await w.write(data); await w.close(); },
    async mkdir(rel, ...x){ await dirOfSegs(segs(rel), true); },
    async rm(rel, ...x){ const ss=segs(rel); const name=ss.pop();
      const d=await dirOfSegs(ss); await d.removeEntry(name,{recursive:true}); },
    async exists(rel, ...x){ try{ await this.stat(rel); return true; }catch{ return false; } }
  };
}

/* IndexedDB 降级后端 */
function idbBackend(db){
  const norm = rel => '/'+String(rel||'').split('/').filter(Boolean).join('/');
  const tx = mode => db.transaction('files', mode).objectStore('files');
  const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  async function allKeys(){ return req(tx('readonly').getAllKeys()); }
  async function get(k){ return req(tx('readonly').get(k)); }
  return {
    type:'idb',
    async readdir(rel,...x){ const p=norm(rel); const pre=p==='/'?'/':p+'/'; const seen=new Map();
      for(const k of await allKeys()){ if(k===p||!k.startsWith(pre)) continue;
        const rest=k.slice(pre.length); const top=rest.split('/')[0]; if(!top) continue;
        if(!seen.has(top)){ const full=pre+top; const direct=(rest===top);
          if(direct){ const rec=await get(full); seen.set(top,{name:top, kind:rec&&rec.kind==='file'?'file':'directory'}); }
          else seen.set(top,{name:top, kind:'directory'}); } }
      const self=await get(p); if(p!=='/'&&!self&&!seen.size){ /* 隐式目录也允许 */ }
      return [...seen.values()]; },
    async stat(rel,...x){ const p=norm(rel); if(p==='/') return {kind:'directory',size:0,mtime:0};
      const rec=await get(p); if(rec) return {kind:rec.kind, size:rec.data?rec.data.byteLength:0, mtime:rec.mtime||0, mime:rec.mime};
      const pre=p+'/'; for(const k of await allKeys()) if(k.startsWith(pre)) return {kind:'directory',size:0,mtime:0};
      throw new Error('不存在: '+p); },
    async readFile(rel,...x){ const rec=await get(norm(rel)); if(!rec||rec.kind!=='file') throw new Error('文件不存在');
      return new Blob([rec.data],{type:rec.mime||mimeOf(rel)}); },
    async writeFile(rel,data,...x){ let buf;
      if(typeof data==='string') buf=new TextEncoder().encode(data).buffer;
      else if(data instanceof Blob) buf=await data.arrayBuffer();
      else if(data instanceof ArrayBuffer) buf=data;
      else buf=data.buffer ? data.buffer.slice(data.byteOffset, data.byteOffset+data.byteLength) : new ArrayBuffer(0);
      const p=norm(rel); const parts=p.split('/').filter(Boolean); let cur='';
      const store=tx('readwrite');
      for(let i=0;i<parts.length-1;i++){ cur+='/'+parts[i];
        await req(store.put({kind:'directory',mtime:Date.now()}, cur)).catch(()=>{}); }
      await req(tx('readwrite').put({kind:'file', data:buf, mtime:Date.now(), mime:(data&&data.type)||mimeOf(rel)}, p)); },
    async mkdir(rel,...x){ const p=norm(rel); const parts=p.split('/').filter(Boolean); let cur='';
      for(const s of parts){ cur+='/'+s; await req(tx('readwrite').put({kind:'directory',mtime:Date.now()}, cur)); } },
    async rm(rel,...x){ const p=norm(rel); const pre=p+'/'; const st=tx('readwrite');
      for(const k of await allKeys()){ if(k===p||k.startsWith(pre)) await req(tx('readwrite').delete(k)); } },
    async exists(rel,...x){ try{ await this.stat(rel); return true; }catch{ return false; } }
  };
}

/* 内存后端（最终降级，小文本经 localStorage 持久化） */
function memBackend(){
  const files=new Map(); // path -> {kind, data:ArrayBuffer|null, mtime, mime}
  const LSK='btos-memfs';
  try{ const snap=JSON.parse(localStorage.getItem(LSK)||'{}');
    for(const [k,v] of Object.entries(snap)){ files.set(k, v.kind==='file'
      ? {kind:'file', data:new TextEncoder().encode(v.text).buffer, mtime:v.mtime, mime:v.mime}
      : {kind:'directory', data:null, mtime:v.mtime}); } }catch{}
  let saveT=null;
  function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{
    const snap={}; let budget=1800000;
    for(const [k,v] of files){ if(v.kind==='directory'){ snap[k]={kind:'directory',mtime:v.mtime}; continue; }
      if(v.data && v.data.byteLength<200000 && budget>0){ try{ const text=new TextDecoder('utf-8',{fatal:true}).decode(v.data);
        budget-=text.length; snap[k]={kind:'file',text,mtime:v.mtime,mime:v.mime}; }catch{} } }
    localStorage.setItem(LSK, JSON.stringify(snap)); }catch{} }, 600); }
  const norm = rel => '/'+String(rel||'').split('/').filter(Boolean).join('/');
  return {
    type:'mem',
    async readdir(rel,...x){ const p=norm(rel); const pre=p==='/'?'/':p+'/'; const seen=new Map();
      for(const k of files.keys()){ if(k===p||!k.startsWith(pre)) continue;
        const top=k.slice(pre.length).split('/')[0]; if(!top||seen.has(top)) continue;
        const full=pre+top; const rec=files.get(full);
        seen.set(top,{name:top, kind:rec&&rec.kind==='file'&&k===full?'file':(rec?rec.kind:'directory')}); }
      return [...seen.values()]; },
    async stat(rel,...x){ const p=norm(rel); if(p==='/') return {kind:'directory',size:0,mtime:0};
      const rec=files.get(p); if(rec) return {kind:rec.kind, size:rec.data?rec.data.byteLength:0, mtime:rec.mtime, mime:rec.mime};
      const pre=p+'/'; for(const k of files.keys()) if(k.startsWith(pre)) return {kind:'directory',size:0,mtime:0};
      throw new Error('不存在: '+p); },
    async readFile(rel,...x){ const rec=files.get(norm(rel)); if(!rec||rec.kind!=='file') throw new Error('文件不存在');
      return new Blob([rec.data],{type:rec.mime||mimeOf(rel)}); },
    async writeFile(rel,data,...x){ let buf;
      if(typeof data==='string') buf=new TextEncoder().encode(data).buffer;
      else if(data instanceof Blob) buf=await data.arrayBuffer();
      else buf=data instanceof ArrayBuffer ? data : (data.buffer||new ArrayBuffer(0));
      const p=norm(rel); const parts=p.split('/').filter(Boolean); let cur='';
      for(let i=0;i<parts.length-1;i++){ cur+='/'+parts[i];
        if(!files.has(cur)) files.set(cur,{kind:'directory',data:null,mtime:Date.now()}); }
      files.set(p,{kind:'file', data:buf, mtime:Date.now(), mime:(data&&data.type)||mimeOf(rel)}); persist(); },
    async mkdir(rel,...x){ const p=norm(rel); const parts=p.split('/').filter(Boolean); let cur='';
      for(const s of parts){ cur+='/'+s; if(!files.has(cur)) files.set(cur,{kind:'directory',data:null,mtime:Date.now()}); } persist(); },
    async rm(rel,...x){ const p=norm(rel); const pre=p+'/';
      for(const k of [...files.keys()]) if(k===p||k.startsWith(pre)) files.delete(k); persist(); },
    async exists(rel,...x){ try{ await this.stat(rel); return true; }catch{ return false; } }
  };
}

/* ═══════════════ FS 统一文件系统（挂载路由层） ═══════════════
   所有 App 一律通过 fs 调用；本地挂载与虚拟文件完全透明，无 isLocal 分支 */
const FS = {
  mounts: [], listeners: new Set(), backendName: 'OPFS',
  mount(path, backend, meta={}){ path=P.norm(path);
    this.mounts=this.mounts.filter(m=>m.path!==path);
    this.mounts.push({path, backend, meta});
    this.mounts.sort((a,b)=>b.path.length-a.path.length); this.emit(); },
  unmount(path){ path=P.norm(path); this.mounts=this.mounts.filter(m=>m.path!==path); this.emit(); },
  mountAt(path){ path=P.norm(path); return this.mounts.find(m=>m.path===path&&m.path!=='/'); },
  _r(path){ path=P.norm(path);
    for(const m of this.mounts){ if(path===m.path || m.path==='/' || path.startsWith(m.path+'/'))
      return {b:m.backend, rel: m.path==='/' ? path : (path.slice(m.path.length)||'/'), m}; }
    throw new Error('无可用文件系统'); },
  onChange(cb){ this.listeners.add(cb); },
  emit(){ for(const cb of this.listeners){ try{ cb(); }catch{} } },

  async readdir(path){ path=P.norm(path); const {b,rel}=this._r(path);
    let list=[]; try{ list=await b.readdir(rel); }catch(e){ if(!this.mounts.some(m=>P.dir(m.path)===path&&m.path!=='/')) throw e; }
    for(const m of this.mounts){ if(m.path!=='/' && P.dir(m.path)===path){
      const nm=P.base(m.path); if(!list.some(e=>e.name===nm)) list.push({name:nm, kind:'directory', mount:true});
      else list.forEach(e=>{ if(e.name===nm) e.mount=true; }); } }
    return list; },
  async stat(path, ...x){ path=P.norm(path); if(this.mountAt(path)) {
      const {b,rel}=this._r(path); try{ return await b.stat(rel); }catch{ return {kind:'directory',size:0,mtime:0}; } }
    const {b,rel}=this._r(path); return b.stat(rel, ...x); },
  async readFile(path, as='blob', ...x){ const {b,rel}=this._r(path); const f=await b.readFile(rel, ...x);
    const blob = f instanceof Blob ? f : new Blob([f]);
    if(as==='text') return blob.text(); if(as==='arrayBuffer') return blob.arrayBuffer(); return blob; },
  async writeFile(path, data, ...x){ const {b,rel}=this._r(path); await b.writeFile(rel, data, ...x); this.emit(); },
  async mkdir(path, ...x){ const {b,rel}=this._r(path); await b.mkdir(rel, ...x); this.emit(); },
  async rm(path, ...x){ path=P.norm(path); if(this.mountAt(path)){ this.unmount(path); return; }
    const {b,rel}=this._r(path); await b.rm(rel, ...x); this.emit(); },
  async exists(path){ try{ await this.stat(path); return true; }catch{ return false; } },
  async copy(src, dst){ const st=await this.stat(src);
    if(st.kind==='directory'){ await this.mkdir(dst);
      for(const e of await this.readdir(src)) await this.copy(P.join(src,e.name), P.join(dst,e.name)); }
    else { const blob=await this.readFile(src); await this.writeFile(dst, blob); } },
  async move(src, dst){ src=P.norm(src); dst=P.norm(dst);
    if(src===dst || dst.startsWith(src+'/')) return;
    await this.copy(src, dst); await this.rm(src); },
  async uniqueName(dir, name){ if(!await this.exists(P.join(dir,name))) return name;
    const i=name.lastIndexOf('.'); const stem=i>0?name.slice(0,i):name; const ext=i>0?name.slice(i):'';
    for(let n=2;n<999;n++){ const c=`${stem} (${n})${ext}`; if(!await this.exists(P.join(dir,c))) return c; }
    return `${stem}-${Date.now()}${ext}`; },
  async dirSize(path){ let s=0; let list=[]; try{ list=await this.readdir(path); }catch{ return 0; }
    for(const e of list){ if(e.mount) continue; try{ const p=P.join(path,e.name); const st=await this.stat(p);
      if(st.kind==='file') s+=st.size||0; else s+=await this.dirSize(p); }catch{} } return s; }
};
window.fs = FS; // 全局挂载，供所有 App 调用

/* ── 初始化：OPFS → IndexedDB → 内存 三级降级 ── */
async function initFS(){
  // 1) OPFS
  try{ if(navigator.storage && navigator.storage.getDirectory){
    const root=await navigator.storage.getDirectory();
    // 探测写入能力
    const t=await root.getFileHandle('.btos-probe',{create:true});
    const w=await t.createWritable(); await w.write('ok'); await w.close();
    await root.removeEntry('.btos-probe').catch(()=>{});
    FS.mount('/', handleBackend(root)); FS.backendName='OPFS（源私有文件系统）';
    navigator.storage.persist && navigator.storage.persist().catch(()=>{});
    return; } }catch(e){ console.warn('OPFS 不可用，降级 IndexedDB', e); }
  // 2) IndexedDB
  try{ const db=await new Promise((res,rej)=>{ const r=indexedDB.open('btos-fs',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('files');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    FS.mount('/', idbBackend(db)); FS.backendName='IndexedDB（降级模式）'; return;
  }catch(e){ console.warn('IndexedDB 不可用，降级内存', e); }
  // 3) 内存 + localStorage
  FS.mount('/', memBackend()); FS.backendName='内存+localStorage（临时模式）';
}

const WM = {
  wins: new Map(), zTop: 50, seq: 0,
  desk: document.getElementById('desktop'),
  open({title, icon, w=720, h=500, x, y, build, onClose, single}){
    if(single){ for(const win of this.wins.values()) if(win.singleKey===single){ this.restore(win); return win; } }

    this.desk.appendChild(el);

    this.wins.set(id, win);

    task.innerHTML=`${icon||ICONS.sigil}<span>${esc(title)}</span>`;
    task.onclick=()=>{ if(win.minimized) this.restore(win);
      else if(el.classList.contains('focus')) this.minimize(win); else this.focus(win); };

    // 事件
    el.addEventListener('pointerdown', ()=>this.focus(win), true);
    el.querySelector('.tb.cls').onclick=e=>{ e.stopPropagation(); this.close(win); };
    el.querySelector('.tb.min').onclick=e=>{ e.stopPropagation(); this.minimize(win); };

    this._drag(win); this._resize(win);
    el.querySelector('.tbar').addEventListener('dblclick', e=>{ if(!e.target.closest('.tb')) this.toggleMax(win); });

  },
  focus(win){ if(!win||!this.wins.has(win.id)) return;
    for(const w of this.wins.values()){ w.el.classList.toggle('focus', w===win); w.task.classList.toggle('active', w===win); }
    win.el.style.zIndex=++this.zTop; },
  minimize(win){ win.minimized=true; win.el.classList.add('minimized'); win.task.classList.add('minned'); win.task.classList.remove('active'); },
  restore(win){ win.minimized=false; win.el.classList.remove('minimized'); win.task.classList.remove('minned'); this.focus(win); },
  toggleMax(win, force){ const el=win.el;
    if(!win.maxed||force){ if(!win.maxed) win.prev={l:el.style.left,t:el.style.top,w:el.style.width,h:el.style.height};
      win.maxed=true; el.classList.add('maxed');

    else { win.maxed=false; el.classList.remove('maxed');
      const p=win.prev||{l:'60px',t:'40px',w:'720px',h:'500px'};
      el.style.left=p.l; el.style.top=p.t; el.style.width=p.w; el.style.height=p.h;

  close(win){ if(!this.wins.has(win.id)) return;
    try{ win.onClose && win.onClose(); }catch{}
    this.wins.delete(win.id); win.task.remove();
    win.el.classList.add('closing'); setTimeout(()=>win.el.remove(), 200); },
  _drag(win){ const bar=win.el.querySelector('.tbar'); let sx,sy,ox,oy,moving=false;
    bar.addEventListener('pointerdown', e=>{ if(e.target.closest('.tb')||win.maxed) return;
      moving=true; sx=e.clientX; sy=e.clientY; ox=win.el.offsetLeft; oy=win.el.offsetTop;
      bar.setPointerCapture(e.pointerId); });
    bar.addEventListener('pointermove', e=>{ if(!moving) return;
      const nx=Math.max(-win.el.offsetWidth+90, Math.min(ox+e.clientX-sx, this.desk.clientWidth-50));
      const ny=Math.max(0, Math.min(oy+e.clientY-sy, this.desk.clientHeight-36));
      win.el.style.left=nx+'px'; win.el.style.top=ny+'px'; });
    bar.addEventListener('pointerup', ()=>moving=false);
    bar.addEventListener('pointercancel', ()=>moving=false); },
  _resize(win){ for(const h of win.el.querySelectorAll('.rh')){ const dir=h.dataset.rh;
    let sx,sy,r0,on=false;
    h.addEventListener('pointerdown', e=>{ if(win.maxed) return; on=true; sx=e.clientX; sy=e.clientY;
      r0={l:win.el.offsetLeft, t:win.el.offsetTop, w:win.el.offsetWidth, h:win.el.offsetHeight};
      h.setPointerCapture(e.pointerId); e.preventDefault(); });
    h.addEventListener('pointermove', e=>{ if(!on) return;
      const dx=e.clientX-sx, dy=e.clientY-sy; let {l,t,w,h:hh}=r0;
      if(dir.includes('e')) w=Math.max(320, r0.w+dx);
      if(dir.includes('s')) hh=Math.max(200, r0.h+dy);

      if(dir.includes('n')){ hh=Math.max(200, r0.h-dy); t=r0.t+r0.h-hh; }
      Object.assign(win.el.style,{left:l+'px',top:t+'px',width:w+'px',height:hh+'px'}); });
    h.addEventListener('pointerup', ()=>on=false); } }
};

const Clip={mode:null, paths:[]};
const dragCache=new Map(); // path -> {file,url,mime,name}
async function preloadDrag(path){ if(dragCache.has(path)) return;
  try{ const st=await FS.stat(path); if(st.kind!=='file'||st.size>80*1024*1024) return;
    const blob=await FS.readFile(path); const mime=blob.type||mimeOf(path);
    const file=new File([blob], P.base(path), {type:mime});
    dragCache.set(path,{file, url:URL.createObjectURL(file), mime, name:P.base(path)}); }catch{} }

/* 内部拖拽数据约定 */
const DT_PATHS='application/x-btos-paths';
let dragState=null; // {paths, from}

/* 为元素绑定「文件拖出」能力（桌面图标 / 资源管理器行共用）
   规则：dragstart 严格同步；数据在 pointerenter/pointerdown 时预载 */
function bindFileDrag(el, getPath, getSelPaths){
  el.setAttribute('draggable','true');
  el.addEventListener('pointerenter', ()=>preloadDrag(getPath()));
  el.addEventListener('pointerdown', ()=>preloadDrag(getPath()));
  el.addEventListener('dragstart', e=>{ const path=getPath();
    let sel=getSelPaths?getSelPaths():[path]; if(!sel.includes(path)) sel=[path];
    dragState={paths:sel, from:P.dir(path)};
    e.dataTransfer.setData(DT_PATHS, JSON.stringify(sel));
    e.dataTransfer.setData('text/plain', sel.join('\n'));
    if(sel.length===1){ const c=dragCache.get(path);
      if(c){ try{ e.dataTransfer.items.add(c.file); }catch{}
        try{ e.dataTransfer.setData('DownloadURL', `${c.mime}:${c.name}:${c.url}`); }catch{} } }
    e.dataTransfer.effectAllowed='copyMove'; el.classList.add('dragging'); });
  el.addEventListener('dragend', ()=>{ el.classList.remove('dragging');
    const c=dragCache.get(getPath());
    if(c){ setTimeout(()=>{ URL.revokeObjectURL(c.url); dragCache.delete(getPath()); }, 6000); }
    dragState=null; });
}

/* 外部文件递归导入（webkitGetAsEntry；readEntries 必须循环；禁用 Buffer） */
function entryFile(entry){ return new Promise((res,rej)=>entry.file(res,rej)); }
function readAllEntries(reader){ return new Promise((res,rej)=>{ const all=[];
  (function next(){ reader.readEntries(batch=>{ if(!batch.length) return res(all);
    all.push(...batch); next(); }, rej); })(); }); }
async function importEntry(entry, destDir){
  if(entry.isFile){ const file=await entryFile(entry);
    const nm=await FS.uniqueName(destDir, entry.name);
    await FS.writeFile(P.join(destDir,nm), file); return 1; }
  if(entry.isDirectory){ const nm=await FS.uniqueName(destDir, entry.name);
    const sub=P.join(destDir,nm); await FS.mkdir(sub);
    const reader=entry.createReader(); let n=0;
    const children=await readAllEntries(reader);
    for(const c of children) n+=await importEntry(c, sub);
    return n+1; }
  return 0; }
async function importDataTransfer(dt, destDir){
  // 必须在任何 await 之前同步抓取 entries / files
  const entries=[], rawFiles=[];
  if(dt.items){ for(const it of dt.items){ if(it.kind!=='file') continue;
    const en=it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
    if(en) entries.push(en); else { const f=it.getAsFile(); if(f) rawFiles.push(f); } } }
  else if(dt.files) rawFiles.push(...dt.files);
  let n=0;
  for(const en of entries) n+=await importEntry(en, destDir);
  for(const f of rawFiles){ const nm=await FS.uniqueName(destDir, f.name);
    await FS.writeFile(P.join(destDir,nm), f); n++; }
  return n; }

/* 通用放置区：接受内部路径移动 + 外部文件导入 */
function makeDropZone(el, getDestDir, opts={}){
  el.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = dragState?'move':'copy'; el.classList.add('dropglow'); });
  el.addEventListener('dragleave', e=>{ if(!el.contains(e.relatedTarget)) el.classList.remove('dropglow'); });

/* ═══════════════ 压缩 / 解压引擎 ═══════════════ */
async function gunzipBuf(buf){ if(!window.DecompressionStream) throw new Error('浏览器不支持 DecompressionStream');
  const ds=new DecompressionStream('gzip');
  return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer(); }
function untarBuf(buf, write){ const u8=new Uint8Array(buf); const td=new TextDecoder(); const out=[];
  let off=0, longName=null;
  while(off+512<=u8.length){ const block=u8.subarray(off, off+512);
    if(block.every(b=>b===0)) break;
    let name=td.decode(block.subarray(0,100)).replace(/\0.*$/,'');
    const sizeStr=td.decode(block.subarray(124,136)).replace(/\0.*$/,'').trim();
    const size=parseInt(sizeStr,8)||0; const type=String.fromCharCode(block[156]);
    const prefix=td.decode(block.subarray(345,500)).replace(/\0.*$/,'');
    if(prefix) name=prefix+'/'+name;
    if(longName){ name=longName; longName=null; }
    const dataStart=off+512; const data=u8.subarray(dataStart, dataStart+size);
    if(type==='L') longName=td.decode(data).replace(/\0.*$/,'');
    else if(type==='5') out.push({name, dir:true});
    else if(type==='0'||type==='\0'||type==='') out.push({name, data:data.slice().buffer});
    off=dataStart+Math.ceil(size/512)*512; }
  return out; }
async function extractArchive(path, destDir){
  const ext=P.ext(path); const base=P.base(path);
  const stem=base.replace(/\.(zip|7z|gz|tgz|tar)$/i,'').replace(/\.tar$/i,'');
  if(!destDir){ destDir=P.join(P.dir(path), await FS.uniqueName(P.dir(path), stem+'_启封')); }
  await FS.mkdir(destDir);
  const isTarGz=/\.(tar\.gz|tgz)$/i.test(base);
  toast('启封中：'+base+' …');
  try{
    if(ext==='zip'){ if(!window.JSZip) throw new Error('JSZip 未加载（网络受阻）');
      const zip=await JSZip.loadAsync(await FS.readFile(path,'arrayBuffer'));
      const names=Object.keys(zip.files);
      for(const n of names){ const f=zip.files[n]; const tp=P.join(destDir, n);
        if(f.dir) await FS.mkdir(tp);
        else await FS.writeFile(tp, await f.async('blob')); } }
    else if(isTarGz){ const tar=await gunzipBuf(await FS.readFile(path,'arrayBuffer'));
      for(const e of untarBuf(tar)){ const tp=P.join(destDir,e.name);
        if(e.dir) await FS.mkdir(tp); else await FS.writeFile(tp, e.data); } }
    else if(ext==='tar'){ for(const e of untarBuf(await FS.readFile(path,'arrayBuffer'))){
        const tp=P.join(destDir,e.name);
        if(e.dir) await FS.mkdir(tp); else await FS.writeFile(tp, e.data); } }
    else if(ext==='gz'){ const data=await gunzipBuf(await FS.readFile(path,'arrayBuffer'));
      await FS.writeFile(P.join(destDir, base.replace(/\.gz$/i,'')||'extracted'), data); }
    else if(ext==='7z'){ await extract7z(path, destDir); }
    else throw new Error('未知封印形式：'+ext);
    toast('启封完成 → '+P.base(destDir),'ok'); }
  catch(e){ toast('启封失败：'+e.message,'err'); }
}
/* 7z-wasm 解压引擎（按需动态加载） */
let _7zMod=null;
async function extract7z(path, destDir){
  if(!_7zMod){ toast('召唤 7z-wasm 引擎…');
    const m=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    _7zMod=m.default; }
  const seven=await _7zMod({ print:()=>{}, printErr:()=>{} });
  const buf=new Uint8Array(await FS.readFile(path,'arrayBuffer'));
  seven.FS.writeFile('/in.7z', buf);
  seven.FS.mkdir('/out');
  seven.callMain(['x','/in.7z','-o/out','-y']);
  async function walk(dir, vdir){ for(const name of seven.FS.readdir(dir)){
    if(name==='.'||name==='..') continue; const full=dir+'/'+name;
    const st=seven.FS.stat(full);
    if(seven.FS.isDir(st.mode)){ const nd=P.join(vdir,name); await FS.mkdir(nd); await walk(full, nd); }
    else { const data=seven.FS.readFile(full); await FS.writeFile(P.join(vdir,name), data.buffer); } } }
  await walk('/out', destDir); }
async function compressToZip(paths){ if(!window.JSZip){ toast('JSZip 未加载','err'); return; }
  const zip=new JSZip();
  async function add(p, zf){ const st=await FS.stat(p);
    if(st.kind==='directory'){ const f=zf.folder(P.base(p));
      for(const e of await FS.readdir(p)) await addInto(P.join(p,e.name), f); }
    else zf.file(P.base(p), await FS.readFile(p,'arrayBuffer')); }
  async function addInto(p, zf){ const st=await FS.stat(p);
    if(st.kind==='directory'){ const f=zf.folder(P.base(p));
      for(const e of await FS.readdir(p)) await addInto(P.join(p,e.name), f); }
    else zf.file(P.base(p), await FS.readFile(p,'arrayBuffer')); }
  for(const p of paths) await add(p, zip);
  const dir=P.dir(paths[0]);
  const nm=await FS.uniqueName(dir, (paths.length===1?P.base(paths[0]).replace(/\.[^.]+$/,''):'封印集')+'.zip');
  await FS.writeFile(P.join(dir,nm), await zip.generateAsync({type:'blob'}));
  toast('已封印为 '+nm,'ok'); }

/* ═══════════════ 打开分派器（先 stat 判类型，目录→导航 文件→对应秘仪） ═══════════════ */
async function openPath(path, opts={}){ path=P.norm(path);
  let st; try{ st=await FS.stat(path); }catch(e){ toast('无法触及：'+e.message,'err'); return; }
  if(st.kind==='directory'){ if(opts.navigate) opts.navigate(path); else openExplorer(path); return; }
  const e=P.ext(path);
  if(IMG_EXT.includes(e) && e!=='svg') return openImageViewer(path);
  if(e==='svg') return openCodex(path);
  if(AUD_EXT.includes(e)) return openPlayer(path,'audio');
  if(VID_EXT.includes(e)) return openPlayer(path,'video');
  if(e==='pdf') return openPDF(path);
  if(TBL_EXT.includes(e)) return openLedger(path);
  if(e==='html'||e==='htm') return openCodex(path);
  if(ARC_EXT.includes(e)||/\.(tar\.gz)$/i.test(path)) return extractArchive(path);
  if(VM_EXT.includes(e)) return openVM(path);
  if(CODE_EXT.includes(e)) return openCodex(path);
  return openNotepad(path); // 任何未知类型 → 以纯文本形式打开
}

/* ═══════════════ 桌面图标 ═══════════════ */
const Desktop={
  el:document.getElementById('desktop'), sel:new Set(), CW:96, CH:112,
  pos(){ return Cfg.get('deskpos',{}); },
  savePos(p){ Cfg.set('deskpos',p); },
  cellAt(x,y){ const r=this.el.getBoundingClientRect();
    return {c:Math.max(0,Math.round((x-r.left-8)/this.CW)), r:Math.max(0,Math.round((y-r.top-8)/this.CH))}; },
  async refresh(){
    this.el.querySelectorAll('.dicon').forEach(n=>n.remove());
    let entries=[]; try{ entries=await FS.readdir('/Desktop'); }catch{ return; }
    entries.sort((a,b)=>(a.kind===b.kind?0:a.kind==='directory'?-1:1)||a.name.localeCompare(b.name,'zh'));
    const pos=this.pos(); const used=new Set();
    const maxRows=Math.max(1, Math.floor((this.el.clientHeight-16)/this.CH));
    for(const k of Object.keys(pos)) if(!entries.some(e=>e.name===k)) delete pos[k];
    for(const e of entries){ let pc=pos[e.name];
      if(!pc||used.has(pc.c+','+pc.r)){ let c=0,r=0;
        while(used.has(c+','+r)){ r++; if(r>=maxRows){ r=0; c++; } } pc={c,r}; pos[e.name]=pc; }
      used.add(pc.c+','+pc.r);
      this.el.appendChild(this.makeIcon(e, pc)); }
    this.savePos(pos);
  },
  makeIcon(entry, pc){
    const path=P.join('/Desktop', entry.name);
    const el=document.createElement('div'); el.className='dicon'; el.dataset.path=path; el.dataset.name=entry.name;
    el.dataset.kind=entry.kind;
    el.style.left=(8+pc.c*this.CW)+'px'; el.style.top=(8+pc.r*this.CH)+'px';
    el.innerHTML=`<div class="ic">${entry.mount?ICONS.folderMnt:iconForFile(entry.name, entry.kind)}</div><div class="lbl">${esc(entry.name)}</div>`;
    if(this.sel.has(path)) el.classList.add('sel');
    el.addEventListener('click', e=>{ e.stopPropagation();
      if(e.ctrlKey||e.metaKey){ this.toggleSel(path); } else { this.clearSel(); this.addSel(path); } });
    el.addEventListener('dblclick', e=>{ e.stopPropagation(); openPath(path); });
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); e.stopPropagation();
      if(!this.sel.has(path)){ this.clearSel(); this.addSel(path); }
      showMenu(e.clientX, e.clientY, fileMenuItems([...this.sel], null, '/Desktop')); });
    // 拖出 + 内部拖动（统一 HTML5 DnD）
    bindFileDrag(el, ()=>path, ()=>[...this.sel.size?this.sel:[path]]);
    // 文件夹作为放置目标
    if(entry.kind==='directory'){
      el.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('droptarget'); });
      el.addEventListener('dragleave', ()=>el.classList.remove('droptarget'));
      el.addEventListener('drop', async e=>{ e.preventDefault(); e.stopPropagation(); el.classList.remove('droptarget');
        const internal=e.dataTransfer.getData(DT_PATHS);
        if(internal){ try{ const paths=JSON.parse(internal); let n=0;
            for(const sp of paths){ if(sp===path||path.startsWith(sp+'/')) continue;
              const nm=await FS.uniqueName(path, P.base(sp)); await FS.move(sp, P.join(path,nm)); n++; }
            if(n) toast(`${n} 件已沉入「${entry.name}」`); }catch(err){ toast(err.message,'err'); } }
        else { const n=await importDataTransfer(e.dataTransfer, path).catch(err=>{ toast(err.message,'err'); return 0; });
          if(n) toast(`${n} 件外物已沉入「${entry.name}」`); } });
    }
    this.bindTouch(el, path, entry);
    return el;
  },
  addSel(p){ this.sel.add(p); this.paint(); }, toggleSel(p){ this.sel.has(p)?this.sel.delete(p):this.sel.add(p); this.paint(); },
  clearSel(){ this.sel.clear(); this.paint(); },
  paint(){ this.el.querySelectorAll('.dicon').forEach(n=>n.classList.toggle('sel', this.sel.has(n.dataset.path))); },
  moveIconTo(name, clientX, clientY){ const pos=this.pos(); const cell=this.cellAt(clientX, clientY);
    for(const [k,v] of Object.entries(pos)){ if(k!==name && v.c===cell.c && v.r===cell.r){
      // 目标格被占 → 寻找最近空格
      const used=new Set(Object.entries(pos).filter(([kk])=>kk!==name).map(([,vv])=>vv.c+','+vv.r));
      let best=null,bd=1e9;
      for(let c=0;c<24;c++) for(let r=0;r<16;r++){ if(used.has(c+','+r)) continue;
        const d=(c-cell.c)**2+(r-cell.r)**2; if(d<bd){ bd=d; best={c,r}; } }
      pos[name]=best||cell; this.savePos(pos); this.refresh(); return; } }
    pos[name]=cell; this.savePos(pos);
    const el=this.el.querySelector(`.dicon[data-name="${CSS.escape(name)}"]`);
    if(el){ el.style.left=(8+cell.c*this.CW)+'px'; el.style.top=(8+cell.r*this.CH)+'px'; } },
  /* 触摸：长按 → 拖动 / 原地长按 → 菜单；单击 → 打开 */
  bindTouch(el, path, entry){ let t0=null, moved=false, dragging=false, lpTimer=null, ghost=document.getElementById('touchGhost');
    el.addEventListener('touchstart', e=>{ if(e.touches.length!==1) return;
      const t=e.touches[0]; t0={x:t.clientX, y:t.clientY}; moved=false; dragging=false;
      lpTimer=setTimeout(()=>{ dragging=true; el.classList.add('dragging');
        ghost.innerHTML=el.innerHTML; ghost.style.display='block'; ghost.style.width='88px';
        ghost.style.left=t0.x+'px'; ghost.style.top=t0.y+'px';
        navigator.vibrate && navigator.vibrate(20); }, 420); }, {passive:true});
    el.addEventListener('touchmove', e=>{ const t=e.touches[0];
      if(Math.hypot(t.clientX-t0.x, t.clientY-t0.y)>12){ moved=true; if(!dragging) clearTimeout(lpTimer); }
      if(dragging){ e.preventDefault(); ghost.style.left=t.clientX+'px'; ghost.style.top=t.clientY+'px'; } }, {passive:false});
    el.addEventListener('touchend', e=>{ clearTimeout(lpTimer); ghost.style.display='none'; el.classList.remove('dragging');
      const t=e.changedTouches[0];
      if(dragging){
        if(!moved){ // 长按未移动 → 呼出诅咒之环（移动端右键菜单）
          this.clearSel(); this.addSel(path);
          showMenu(t.clientX, t.clientY, fileMenuItems([path], null, '/Desktop'));
          return; }
        // 放置：检查是否落在文件夹图标上
        el.style.pointerEvents='none';
        const under=document.elementFromPoint(t.clientX, t.clientY);
        el.style.pointerEvents='';
        const target=under && under.closest && under.closest('.dicon');
        if(target && target!==el && target.dataset.kind==='directory'){
          FS.uniqueName(target.dataset.path, entry.name)
            .then(nm=>FS.move(path, P.join(target.dataset.path, nm)))
            .then(()=>toast(`已沉入「${target.dataset.name}」`)).catch(err=>toast(err.message,'err')); }
        else this.moveIconTo(entry.name, t.clientX, t.clientY);
        return; }
      if(!moved) openPath(path); // 普通 tap → 打开
    }, {passive:true});
  },
};

/* ═══════════════ 本地文件夹挂载（File System Access API → 统一 fs 后端） ═══════════════ */
async function mountLocalFolder(){
  if(!window.showDirectoryPicker){ toast('此浏览器不支持 File System Access API','err'); return null; }
  try{ const handle=await showDirectoryPicker({mode:'readwrite'});
    try{ await handle.requestPermission({mode:'readwrite'}); }catch{}
    let name=handle.name||'local';
    let mp=P.join('/mnt/local', name); let i=2;
    while(FS.mountAt(mp)) mp=P.join('/mnt/local', name+'-'+(i++));
    FS.mount(mp, handleBackend(handle), {local:true, label:handle.name});
    const hints=Cfg.get('mountHints',[]); if(!hints.includes(handle.name)){ hints.push(handle.name); Cfg.set('mountHints',hints); }
    toast(`尘世之域「${handle.name}」已锚定于 ${mp}`,'ok');
    return mp; }
  catch(e){ if(e.name!=='AbortError') toast('挂载失败：'+e.message,'err'); return null; }
}

      function renderSide(){

        crumbsEl.innerHTML=html;
        crumbsEl.querySelectorAll('.crumb').forEach(b=>b.onclick=()=>nav(b.dataset.p)); }
      function sortEntries(arr){ const k=sortKey, dir=sortAsc?1:-1;
        return arr.sort((a,b)=>{ if(a.kind!==b.kind) return a.kind==='directory'?-1:1;
          let va,vb;
          if(k==='name'){ va=a.name.toLowerCase(); vb=b.name.toLowerCase(); return va.localeCompare(vb,'zh')*dir; }
          if(k==='mtime'){ va=a.st?.mtime||0; vb=b.st?.mtime||0; }
          else if(k==='size'){ va=a.st?.size||0; vb=b.st?.size||0; }
          else { va=typeOf(a.name,a.kind); vb=typeOf(b.name,b.kind); return va.localeCompare(vb,'zh')*dir; }
          return (va-vb)*dir; }); }
      function paintCols(){ body.querySelectorAll('.fx-col').forEach(c=>{
        c.classList.toggle('on', c.dataset.s===sortKey);
        c.innerHTML=({name:'名讳',mtime:'修改日期',type:'类型',size:'大小'})[c.dataset.s]+(c.dataset.s===sortKey?(sortAsc?' ▲':' ▼'):''); }); }
      async function load(){ sel.clear(); searching=false; searchInp.value='';

        entries=await Promise.all(list.map(async e=>{ let st=null;
          try{ st=await FS.stat(P.join(cwd,e.name)); }catch{}
          return {...e, st}; }));

        if(!entries.length){ listEl.innerHTML=`<div class="fx-empty">空荡的墓穴，唯有回声。</div>`; }
        else { listEl.innerHTML='';
          for(const e of entries){ const p=e.fullPath||P.join(cwd,e.name);

            x2=Math.max(m0.x,ev.clientX), y2=Math.max(m0.y,ev.clientY);
          Object.assign(mqEl.style,{display:'block',left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'});
          listEl.querySelectorAll('.frow').forEach(r=>{ const rc=r.getBoundingClientRect();
            const hit=!(rc.right<x1||rc.left>x2||rc.bottom<y1||rc.top>y2);

          paintSel(); };

      // 列排序
      body.querySelectorAll('.fx-col').forEach(c=>c.onclick=()=>{
        if(sortKey===c.dataset.s) sortAsc=!sortAsc; else { sortKey=c.dataset.s; sortAsc=true; }
        Cfg.set('fxSort',sortKey); Cfg.set('fxAsc',sortAsc); render(); });
      // 搜索（递归，上限 400）

      searchInp.addEventListener('input', ()=>{ clearTimeout(searchT);
        const q=searchInp.value.trim().toLowerCase();
        if(!q){ load(); return; }
        searchT=setTimeout(async()=>{ searching=true; const found=[]; const LIM=400;
          async function walk(dir, depth){ if(found.length>=LIM||depth>6) return;
            let list=[]; try{ list=await FS.readdir(dir); }catch{ return; }
            for(const e of list){ if(found.length>=LIM) return; const p=P.join(dir,e.name);
              if(e.name.toLowerCase().includes(q)){ let st=null; try{ st=await FS.stat(p); }catch{}
                found.push({...e, st, fullPath:p}); }
              if(e.kind==='directory'&&!e.mount) await walk(p, depth+1); } }
          await walk(cwd,0); entries=found; sel.clear(); render();
          $('.st-n').textContent=`搜得 ${found.length} 件`; }, 300); });
      // 工具栏
      async function act(a){ switch(a){
        case 'side': sideEl.classList.toggle('open'); break;
        case 'back': if(hi>0){ hi--; nav(hist[hi], false); } break;
        case 'fwd': if(hi<hist.length-1){ hi++; nav(hist[hi], false); } break;
        case 'up': if(cwd!=='/') nav(P.dir(cwd)); break;
        case 'refresh': load(); break;
        case 'newdir': { const n=await promptDialog('新墓室之名','新建文件夹');
          if(n) await FS.mkdir(P.join(cwd, await FS.uniqueName(cwd,n))).catch(e=>toast(e.message,'err')); break; }
        case 'newfile': { const n=await promptDialog('新卷之名','无题.txt');
          if(n) await FS.writeFile(P.join(cwd, await FS.uniqueName(cwd,n)),'').catch(e=>toast(e.message,'err')); break; }
        case 'upload': pickUpload(cwd); break;
        case 'paste': pasteInto(cwd); break;
        case 'export': if(!sel.size){ toast('未选中任何圣物'); break; } [...sel].forEach(p=>exportPath(p)); break;
        case 'del': if(!sel.size){ toast('未选中任何圣物'); break; }
          if(await confirmDialog('焚毁仪式',`确定焚毁 ${sel.size} 件圣物？`,'焚毁')){
            for(const p of sel) await FS.rm(p).catch(e=>toast(e.message,'err')); sel.clear(); }
          break;
        case 'mount': { const mp=await mountLocalFolder(); if(mp) nav(mp); break; } } }
      body.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
      const reload=()=>{ if(!searching) load(); };
      FS.onChange(reload); win.onClose=()=>FS.listeners.delete(reload);
      nav(startPath);
    }});
  return win;
}

/* ═══════════════ 表格「账簿」CSV/TSV 双视图 ═══════════════ */
function parseDSV(text, delim){ const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows; }

/* ═══════════════ 图片查看器（缩放 / 平移 / 触摸捏合） ═══════════════ */
function openImageViewer(path){
  WM.open({title:'画像 — '+P.base(path), icon:ICONS.fileImg, w:780, h:560,
    build(body, win){
      let url=null, scale=1, tx=0, ty=0;
      body.innerHTML=`<div class="atb">
          <button class="itb" data-a="zo">−</button>
          <button class="itb" data-a="zi">+</button>
          <button class="itb" data-a="fit">${ICONS.full}<span>适窗</span></button>
          <button class="itb" data-a="orig">1:1</button>
          <div class="sp"></div>
          <span class="iv-z" style="font-family:'Fira Code',monospace;font-size:11px;color:var(--dust)">100%</span>
          <button class="itb" data-a="export">${ICONS.download}<span>导出</span></button>
          <button class="itb" data-a="wall">${ICONS.wall}<span>设为壁纸</span></button></div>
        <div class="viewer-img"><img alt="" draggable="false"></div>`;
      const wrap=body.querySelector('.viewer-img'), img=wrap.querySelector('img'), zl=body.querySelector('.iv-z');
      function apply(){ img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
        zl.textContent=Math.round(scale*100)+'%'; }
      function fit(){ if(!img.naturalWidth) return;
        scale=Math.min(wrap.clientWidth/img.naturalWidth, wrap.clientHeight/img.naturalHeight, 1)*0.96;
        tx=ty=0; apply(); }
      FS.readFile(path).then(blob=>{ url=URL.createObjectURL(blob); img.src=url; img.onload=fit; })
        .catch(e=>toast(e.message,'err'));
      body.querySelector('[data-a=zi]').onclick=()=>{ scale=Math.min(scale*1.25,20); apply(); };
      body.querySelector('[data-a=zo]').onclick=()=>{ scale=Math.max(scale/1.25,.05); apply(); };
      body.querySelector('[data-a=fit]').onclick=fit;
      body.querySelector('[data-a=orig]').onclick=()=>{ scale=1; tx=ty=0; apply(); };
      body.querySelector('[data-a=export]').onclick=()=>exportPath(path);
      body.querySelector('[data-a=wall]').onclick=async()=>setCustomWallpaper(await FS.readFile(path));
      wrap.addEventListener('wheel', e=>{ e.preventDefault();
        scale=Math.max(.05, Math.min(20, scale*(e.deltaY<0?1.12:0.89))); apply(); }, {passive:false});
      let pan=null;
      wrap.addEventListener('pointerdown', e=>{ pan={x:e.clientX,y:e.clientY,tx,ty}; wrap.setPointerCapture(e.pointerId); });
      wrap.addEventListener('pointermove', e=>{ if(!pan) return; tx=pan.tx+e.clientX-pan.x; ty=pan.ty+e.clientY-pan.y; apply(); });
      wrap.addEventListener('pointerup', ()=>pan=null);
      // 触摸捏合
      let pinch=null;
      wrap.addEventListener('touchstart', e=>{ if(e.touches.length===2){ const [a,b]=e.touches;
        pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), s:scale}; } }, {passive:true});
      wrap.addEventListener('touchmove', e=>{ if(pinch&&e.touches.length===2){ e.preventDefault();
        const [a,b]=e.touches; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
        scale=Math.max(.05,Math.min(20,pinch.s*d/pinch.d)); apply(); } }, {passive:false});
      wrap.addEventListener('touchend', ()=>pinch=null);
      win.onClose=()=>url&&URL.revokeObjectURL(url);
    }});
}

/* ═══════════════ 计算器「算术师」 ═══════════════ */
function openCalc(){
  WM.open({title:'算术师', icon:ICONS.calc, w:340, h:480, single:'calc',
    build(body, win){ win.singleKey='calc';
      let expr='', last='0';
      body.innerHTML=`<div class="calc">
        <div class="calc-scr"><div class="ex"></div><div class="rs">0</div></div>
        <div class="calc-grid">
          ${['C','( )','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(k=>
            `<button class="cbtn ${'÷×−+%'.includes(k)||k==='( )'?'op':''} ${k==='='?'eq':''} ${k==='C'?'op':''}" data-k="${k}">${k}</button>`).join('')}
        </div></div>`;
      const exEl=body.querySelector('.ex'), rsEl=body.querySelector('.rs');
      function evaluate(e){ const s=e.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
        if(!/^[-+*/().\d\s]*$/.test(s)||!s.trim()) return null;
        try{ const v=Function('"use strict";return('+s+')')();
          return (typeof v==='number'&&isFinite(v))?+v.toPrecision(12):null; }catch{ return null; } }
      function upd(){ exEl.textContent=expr||' ';
        const v=evaluate(expr); rsEl.textContent=v!=null?String(v):last; }
      function press(k){ if(k==='C'){ expr=''; last='0'; }
        else if(k==='='){ const v=evaluate(expr); if(v!=null){ last=String(v); expr=String(v); } }
        else if(k==='( )'){ const o=(expr.match(/\(/g)||[]).length, c=(expr.match(/\)/g)||[]).length;
          expr+= o>c && !/[+×÷−(*\/-]$/.test(expr) ? ')' : '('; }
        else if(k==='±'){ const v=evaluate(expr); if(v!=null) expr=String(-v); }
        else expr+=k;
        upd(); }
      body.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>press(b.dataset.k));
      body.tabIndex=0;
      body.addEventListener('keydown', e=>{ const map={'/':'÷','*':'×','-':'−','Enter':'=','=':'=','Backspace':null,'Escape':'C'};
        if(e.key==='Backspace'){ expr=expr.slice(0,-1); upd(); return; }
        if(/^[0-9.+()%]$/.test(e.key)) press(e.key);
        else if(map[e.key]!==undefined&&map[e.key]) press(map[e.key]); });
      upd();
    }});
}

        cv.style.width=(cv.width*s)+'px'; cv.style.height=(cv.height*s)+'px'; }
      new ResizeObserver(fitCanvas).observe(body.querySelector('.paint-cv'));
      function pt(e){ const r=cv.getBoundingClientRect();
        return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; }
      cv.addEventListener('pointerdown', e=>{ drawing=true; cv.setPointerCapture(e.pointerId);
        const p=pt(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
        ctx.strokeStyle=tool==='eraser'?'#16121c':colorI.value;
        ctx.lineWidth=sizeI.value*(tool==='eraser'?2.5:1);
        ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke(); });
      cv.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pt(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
      cv.addEventListener('pointerup', ()=>drawing=false);
      body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tool=b.dataset.t;

      async function toBlob(){ return new Promise(r=>cv.toBlob(r,'image/png')); }
      body.querySelector('[data-a=save]').onclick=async()=>{ const blob=await toBlob();

        a.href=url; a.download='bloodthorn-painting.png'; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),8000); };
    }});
}

          bodyEl.innerHTML=`<h2>存储窟窿</h2><div class="st-load fx-empty">勘测中…</div>`;
          let est={usage:0, quota:0};
          try{ est=await navigator.storage.estimate(); }catch{}
          const roots=[]; let total=0;
          try{ for(const e of await FS.readdir('/')){ if(e.name==='mnt') continue;
            const sz=e.kind==='directory'?await FS.dirSize('/'+e.name):(await FS.stat('/'+e.name)).size||0;
            roots.push({name:e.name, sz, kind:e.kind}); total+=sz; } }catch{}
          roots.sort((a,b)=>b.sz-a.sz);
          const pct=est.quota?Math.min(100,(est.usage/est.quota*100)):0;
          bodyEl.innerHTML=`<h2>存储窟窿</h2>
            <div style="font-family:'Cinzel',serif;font-size:12px;letter-spacacing:.1em;color:var(--parch);margin-bottom:8px">
              后端：<span style="color:var(--gold3)">${esc(FS.backendName)}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--parch);margin-bottom:6px">
              <span>已用 <b style="color:var(--gold3)">${fmtSize(est.usage)}</b> / 配额 ${fmtSize(est.quota)}</span>
              <span style="color:var(--ember2)">${pct.toFixed(2)}%</span></div>
            <div class="meter"><div style="width:${Math.max(pct,.5)}%;background:linear-gradient(90deg,var(--blood2),var(--ember))"></div></div>
            <h2 style="margin-top:26px">疆域占据（虚拟文件系统 ${fmtSize(total)}）</h2>
            <div class="meter" style="margin-bottom:14px">${roots.map((r,i)=>
              `<div style="width:${total?Math.max(r.sz/total*100,r.sz?1:0):0}%;background:${COLORS[i%COLORS.length]}" title="${esc(r.name)}"></div>`).join('')}</div>
            ${roots.map((r,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px">
              <span style="width:11px;height:11px;border-radius:3px;background:${COLORS[i%COLORS.length]};flex:none"></span>
              <span style="flex:1;color:var(--bone)">/${esc(r.name)}</span>
              <span style="color:var(--parch);font-family:'Fira Code',monospace;font-size:12px">${fmtSize(r.sz)}</span>
              <span style="color:var(--dust);font-family:'Fira Code',monospace;font-size:12px;width:56px;text-align:right">${total?(r.sz/total*100).toFixed(1):0}%</span></div>`).join('')||'<div class="fx-empty">虚无</div>'}
            <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn" data-a="persist">${ICONS.check}<span>请求持久化特权</span></button>
              <button class="btn" data-a="rescan">${ICONS.refresh}<span>重新勘测</span></button></div>`;
          bodyEl.querySelector('[data-a=persist]').onclick=async()=>{
            try{ const ok=await navigator.storage.persist();
              toast(ok?'石窟已获永恒持久化特权':'浏览器暂未授予特权（可稍后再试）', ok?'ok':'info'); }
            catch{ toast('此浏览器不支持持久化请求','err'); } };
          bodyEl.querySelector('[data-a=rescan]').onclick=show; }
        else if(tab==='wall'){
          const cur=Cfg.get('wall','crypt');
          bodyEl.innerHTML=`<h2>壁纸结界</h2><div class="wall-grid">
            ${WALLPAPERS.map(w=>`<div class="wall-card ${cur===w.id?'on':''}" data-w="${w.id}" style="background:${w.css.replace(/"/g,'&quot;')}"><span>${esc(w.name)}</span></div>`).join('')}
            <div class="wall-card ${cur==='custom'?'on':''}" data-w="custom" style="display:grid;place-items:center;background:linear-gradient(180deg,#241c2c,#120d17)">
              <div style="color:var(--gold2);width:30px;height:30px">${ICONS.upload}</div><span>献祭自有画像…</span></div></div>
            <p style="margin-top:16px;font-family:'IM Fell English',serif;font-style:italic;color:var(--dust)">自有画像将被铭刻于 OPFS 石窟（/System/wallpaper.img），刷新后仍存。</p>`;
          bodyEl.querySelectorAll('.wall-card').forEach(c=>c.onclick=()=>{
            if(c.dataset.w==='custom'){ document.getElementById('wallImport').click(); return; }
            Cfg.set('wall', c.dataset.w); applyWallpaper(); show(); }); }
        else if(tab==='sys'){
          const mounts=FS.mounts.filter(m=>m.meta&&m.meta.local);
          bodyEl.innerHTML=`<h2>体系铭文</h2>
            <div style="line-height:2.1;font-size:16px">
            <div>体系：<b style="color:var(--gold3)">BLOODTHORN OS</b> · 血棘秘典 v1.0</div>
            <div>存储后端：${esc(FS.backendName)}</div>
            <div>降级链：OPFS → IndexedDB → 内存+localStorage</div>
            <div>JSZip：${window.JSZip?'已就绪':'未召唤'} · CodeMirror：${window.CodeMirror?'已就绪':'未召唤'} · v86：${(window.V86||window.V86Starter)?'已就绪':'未召唤'}</div>
            <div>尘世锚点：${mounts.length?mounts.map(m=>esc(m.path)).join('、'):'无'}</div>
            <div>上次降临：${esc(getCookie('btos_last')||'初临此境')}</div></div>
            <h2 style="margin-top:22px">触摸者须知</h2>
            <p style="color:var(--parch);line-height:1.9">长按图标可拖移；长按列表项呼出诅咒之环；触屏无法拖出浏览器，请以「遣返尘世（导出）」替代。</p>`; }
        else if(tab==='reset'){
          bodyEl.innerHTML=`<h2 style="color:var(--ember2)">湮灭重生</h2>
            <p style="line-height:1.9;color:var(--parch)">此仪式将焚毁 OPFS 石窟中的一切圣物、抹除 IndexedDB 与 localStorage 之铭文，并令体系重归初诞之态。<b style="color:var(--ember2)">血誓既立，不可反悔。</b></p>
            <button class="btn primary" style="margin-top:18px" data-a="reset">${ICONS.skull}<span>执行湮灭仪式</span></button>`;
          bodyEl.querySelector('[data-a=reset]').onclick=async()=>{
            if(!await confirmDialog('湮灭仪式','最后确认：彻底清空虚拟文件系统并重置？','湮灭')) return;
            toast('湮灭进行中…');
            try{ if(navigator.storage&&navigator.storage.getDirectory){
                const root=await navigator.storage.getDirectory();
                for await (const [name] of root.entries()) await root.removeEntry(name,{recursive:true}).catch(()=>{}); } }catch{}
            try{ indexedDB.deleteDatabase('btos-fs'); }catch{}
            try{ localStorage.clear(); }catch{}
            setCookie('btos_last','',0);
            location.reload(); }; }
      }
      body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; show(); });
      show();
    }});
}

/* ═══════════════ v86 虚拟机「魔像」 ═══════════════ */
const V86RES={
  wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
  bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
  vga:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'};
function openVM(diskPath){
  WM.open({title:'魔像 — v86 虚拟机', icon:ICONS.vm, w:860, h:620,
    build(body, win){
      let emulator=null;
      body.innerHTML=`<div class="atb">
          <button class="itb" data-a="boot">${ICONS.play}<span>择镜像而唤醒</span></button>
          <button class="itb" data-a="stop" disabled>${ICONS.stop}<span>沉眠</span></button>
          <div class="sp"></div>
          <span class="vm-st" style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;color:var(--dust)">沉睡中</span></div>
        <div class="v86sc vm-screen"><div style="white-space:pre; font:14px monospace; line-height:14px"></div><canvas style="display:none"></canvas></div>
        <div class="vm-tip" style="flex:none;padding:8px 14px;border-top:1px solid var(--vein);font-family:'IM Fell English',serif;font-style:italic;font-size:13px;color:var(--dust)">
          先以「秘库」导入 .iso / .img 启动镜像（如 FreeDOS、TinyCore），再于此唤醒魔像。iso→光驱 · img/fda/bin→软驱 · 其余→硬盘。</div>`;
      const sc=body.querySelector('.vm-screen'), st=body.querySelector('.vm-st');
      const stopBtn=body.querySelector('[data-a=stop]'), bootBtn=body.querySelector('[data-a=boot]');
      async function boot(p){
        const VC=window.V86||window.V86Starter;
        if(!VC){ toast('v86 引擎未能召唤（网络受阻）','err'); return; }
        try{ st.textContent='灌注血液…';
          const buffer=await FS.readFile(p,'arrayBuffer');
          const ext=P.ext(p);
          const opt={ wasm_path:V86RES.wasm, memory_size:128*1024*1024, vga_memory_size:8*1024*1024,
            screen_container:sc, bios:{url:V86RES.bios}, vga_bios:{url:V86RES.vga}, autostart:true };
          if(ext==='iso') opt.cdrom={buffer};
          else if(['img','fda','bin'].includes(ext)) opt.fda={buffer};
          else opt.hda={buffer};
          if(emulator){ try{ emulator.destroy(); }catch{} }
          emulator=new VC(opt);
          st.textContent='魔像苏醒 — '+P.base(p); stopBtn.removeAttribute('disabled');
          win.setTitle('魔像 — '+P.base(p));
          sc.addEventListener('click', ()=>{ try{ emulator.lock_mouse&&document.activeElement!==sc; }catch{} }); }
        catch(e){ st.textContent='唤醒失败'; toast('魔像唤醒失败：'+e.message,'err'); } }
      bootBtn.onclick=async()=>{ const p=await pickFile('择取启动镜像', VM_EXT); if(p) boot(p); };
      stopBtn.onclick=()=>{ if(emulator){ try{ emulator.destroy(); }catch{} emulator=null;
        st.textContent='已沉眠'; stopBtn.setAttribute('disabled',''); } };
      win.onClose=()=>{ if(emulator){ try{ emulator.destroy(); }catch{} } };
      if(diskPath) boot(diskPath);
    }});
}

/* ═══════════════ 启动序列 ═══════════════ */
(async function boot(){
  const bar=document.getElementById('bootBar'), msg=document.getElementById('bootMsg');
  const step=(p,m)=>{ bar.style.width=p+'%'; msg.textContent=m; };
  try{
    step(15,'AWAKENING THE CRYPT…');
    await initFS();
    step(45,'CARVING THE CATACOMBS…');
    await seedFS();
    step(70,'SUMMONING THE SIGILS…');
    applyWallpaper();
    await Desktop.refresh();
    step(100,'THE COVENANT IS SEALED');
  }catch(e){ console.error(e); step(100,'DEGRADED RITE — '+e.message);
    toast('初始化遭遇阻碍：'+e.message,'err'); }
  setTimeout(()=>{ document.getElementById('boot').classList.add('gone');
    setTimeout(()=>document.getElementById('boot').remove(), 900);
    const last=getCookie('btos_last');
    if(last) toast('血脉认得你 — 上次降临：'+last);
    else toast('初临此境者，血誓之书在桌面等你展读');
    setCookie('btos_last', new Date().toLocaleString());
    const hints=Cfg.get('mountHints',[]);
    if(hints.length && window.showDirectoryPicker)
      setTimeout(()=>toast('上一世曾锚定尘世之域（'+hints.join('、')+'）— 权限随刷新湮灭，请于「秘库」重新挂载'),1800);
    if(FS.backendName.includes('降级')||FS.backendName.includes('临时'))
      setTimeout(()=>toast('OPFS 不可用，当前运行于：'+FS.backendName,'err'),2600);
  }, 700);
  // 桌面尺寸变化 → 重排
  addEventListener('resize', ()=>{ clearTimeout(window.__rsT);
    window.__rsT=setTimeout(()=>Desktop.refresh(), 350); });
  // 阻止浏览器默认拖放打开文件
  addEventListener('dragover', e=>e.preventDefault());
  addEventListener('drop', e=>e.preventDefault());
})();





</script>
