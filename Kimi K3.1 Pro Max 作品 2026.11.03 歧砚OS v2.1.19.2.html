class OPFSBackend{

 async parent(p,create=false){return this.dir(parentPath(p),create)}
 async stat(p,...args){const run=(async()=>{p=norm(p);if(p==='/')return{name:'/',path:'/',kind:'directory',size:0,mtime:0};const name=baseName(p),parent=await this.parent(p);try{const h=await parent.getFileHandle(name);const f=await h.getFile();const meta=await DB.metaGet('opfs:'+p);return{name,path:p,kind:'file',size:f.size,mtime:meta?.mtime??f.lastModified,type:mimeOf(name)}}catch(e){if(e.name!=='TypeMismatchError'&&e.name!=='NotFoundError'){}const h=await parent.getDirectoryHandle(name);const meta=await DB.metaGet('opfs:'+p);return{name,path:p,kind:'directory',size:0,mtime:meta?.mtime??0}}})();return callbackify(run,args)}
 async readdir(p,...args){const run=(async()=>{const d=await this.dir(p),out=[];for await(const [name,h]of d.entries()){const cp=joinPath(p,name);if(h.kind==='file'){const f=await h.getFile(),meta=await DB.metaGet('opfs:'+cp);out.push({name,path:cp,kind:'file',size:f.size,mtime:meta?.mtime??f.lastModified,type:mimeOf(name)})}else{const meta=await DB.metaGet('opfs:'+cp);out.push({name,path:cp,kind:'directory',size:0,mtime:meta?.mtime??0})}}return out})();return callbackify(run,args)}
 async mkdir(p,opts={},...args){const run=(async()=>{await this.dir(p,true);await DB.metaSet('opfs:'+norm(p),{mtime:opts?.mtime||Date.now()});return true})();return callbackify(run,[opts,...args])}

 async readFile(p,opts={},...args){const run=(async()=>{const h=await(await this.parent(p)).getFileHandle(baseName(p));const f=await h.getFile();return opts==='utf8'||opts?.encoding==='utf8'?await f.text():await f.arrayBuffer()})();return callbackify(run,[opts,...args])}

 async rmdir(p,...args){return this.unlink(p,...args)}
 async exists(p,...args){const run=this.stat(p).then(()=>true,()=>false);return callbackify(run,args)}
 async rename(a,b,...args){const run=(async()=>{const st=await this.stat(a);if(st.kind==='file'){const data=await this.readFile(a);await this.writeFile(b,data,{mtime:st.mtime})}else{await this.mkdir(b,{mtime:st.mtime});for(const e of await this.readdir(a))await this.rename(e.path,joinPath(b,e.name))}await this.unlink(a);await DB.metaMovePrefix('opfs:'+norm(a),'opfs:'+norm(b));return true})();return callbackify(run,args)}
}

}

 async stat(p,...args){const run=(async()=>{p=norm(p);if(p==='/')return{name:'/',path:p,kind:'directory',size:0,mtime:0};const e=this.cache[p];if(!e)throw Error('不存在');return{...e,data:undefined}})();return callbackify(run,args)}

 function walk(p){for(const e of await fs.readdir(p)){if(e.kind==='directory')await walk(e.path);else cats[kindOf(e.name)]=(cats[kindOf(e.name)]||0)+e.size}}await walk('/Home');for(const e of await fs.readdir('/Home'))if(e.kind==='directory')tops.push({name:e.name,size:await fs.getSize(e.path)});const total=Object.values(cats).reduce((a,x)=>a+x,0),colors=['#e56b45','#a7c957','#d6b45a','#69a9a2','#ba7962','#85946b','#c8c1ad','#7d8a96','#5b6660'];let ci=0;box.innerHTML=`<div class="setting-card" style="display:flex;gap:25px;align-items:center;flex-wrap:wrap"><div class="storage-ring" style="background:conic-gradient(var(--accent) ${quota?Math.min(100,usage/quota*100):0}%,var(--line) 0)"><strong>${quota?fmtSize(usage):'未知'}</strong></div><div><h3 style="margin:0">浏览器总占用</h3><p class="muted">${fmtSize(usage)} / ${quota?fmtSize(quota):'无配额信息'}<br>占用率 ${quota?(usage/quota*100).toFixed(2):'—'}%</p><p class="muted">/Home 文件合计：${fmtSize(total)}</p></div></div><div class="setting-card"><h3 style="margin-top:0">内容类别占用</h3><div class="storage-bars">${Object.entries(cats).filter(([,n])=>n).map(([k,n])=>`<i style="width:${total?n/total*100:0}%;background:${colors[ci++%colors.length]}" title="${k} ${fmtSize(n)}"></i>`).join('')}</div><div class="legend">${Object.entries(cats).filter(([,n])=>n).map(([k,n],i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${({image:'图片',audio:'音频',video:'视频',text:'文本',code:'代码',sheet:'表格',archive:'归档',pdf:'PDF',file:'其他'}[k])} ${fmtSize(n)}</span>`).join('')}</div></div><div class="setting-card"><h3 style="margin-top:0">目录占用</h3>${tops.sort((a,z)=>z.size-a.size).map(x=>`<div class="setting-row"><span>${esc(x.name)}</span><strong>${fmtSize(x.size)}</strong></div>`).join('')}</div>`}catch(e){box.innerHTML=`<p class="muted">统计失败：${esc(e.message)}</p>`}}}

async function seedDefaults(){const roots=[];if(opfs.root)roots.push('/OPFS');if(DB.available)roots.push('/IndexedDB');if(emergency)roots.push('');for(const root of roots){for(const d of['Desktop','Documents','Pictures','Pictures/Wallpapers','Music','Videos','Archives']){const p=(root||'')+'/Home/'+d;try{if(!await fs.exists(p))await fs.mkdir(p)}catch{}}}const docs=[['/Home/Desktop/欢迎使用.txt','欢迎来到歧砚。\n\n这是一个完全运行于浏览器中的私有桌面。这里的文件不是演示卡片：新建、编辑、移动、压缩和导入都会真实写入你所选择的持久化后端。\n\n快速开始：\n· 桌面空白处拖动可以框选；右键可以新建或导入。\n· 文件可以从电脑拖入，也可以预载后拖出到真实桌面。\n· 文件场侧栏可同时访问 OPFS 与 IndexedDB。\n· 在系统校准中挂载电脑上的真实文件夹。\n· 源码室支持实时预览，画卷阅读支持同目录连续图片。\n\n修改日期由独立元数据层保护，移动项目不会把它重置。\n'],['/Home/Documents/创作札记.md','# 歧砚创作札记\n\n## 三条工作原则\n\n1. **先保存原始材料**，再开始加工。\n2. 文件名使用自然数字：`1, 2, 10`，卷轴阅读会按自然顺序排列。\n3. 重要资料可在 **OPFS 与 IndexedDB** 各保留一个副本。\n\n> 所有数据留在当前浏览器源内，没有服务器。\n'],['/Home/Documents/素材清单.csv','名称,类别,数量,完成\n折岭纹理,图片,12,是\n环境底噪,音频,4,否\n界面字形,字体,3,是\n'],['/Home/Desktop/微观页面.html','<!doctype html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>微观页面</title>\n<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101512;color:#e4dfd2;font-family:serif}main{max-width:650px;padding:8vw}h1{font-size:clamp(42px,9vw,88px);font-weight:400;line-height:1.1}i{display:block;width:70px;height:8px;background:#e56b45;transform:skew(-25deg);margin:30px 0}p{color:#96a097;line-height:2}</style>\n</head>\n<body><main><small>QIYAN / LOCAL DOCUMENT</small><h1>纸上有场，<br>场中有光。</h1><i></i><p>此页由文件场中的真实 HTML 生成。右键选择“编辑源代码”，修改后保存，再用“远窗打开”查看结果。</p></main></body>\n</html>']];for(const[p,text]of docs)try{if(!await fs.exists(p))await fs.writeText(p,text)}catch(e){console.warn('seed',e)}}
