    /* ---------- Archive Engine: Native GZip/TAR + JSZip (Timezone Fixed) + 7z-wasm ---------- */
    const ArchiveEngine = {
      // Fix JSZip DOS date UTC offset bug on READ: DOS stores local wall time, JSZip treats it as UTC
      fixJSZipReadDate(dateObj) {
        if (!dateObj || !(dateObj instanceof Date) || isNaN(dateObj.getTime())) return Date.now();
        return dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
      },
      // Fix JSZip DOS date UTC offset bug on WRITE: shift so JSZip writes exact original local time
      fixJSZipWriteDate(mtimeMs) {
        const ms = mtimeMs || Date.now();
        const d = new Date(ms);
        return new Date(ms - d.getTimezoneOffset() * 60000);
      },

      async gunzip(u8) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('当前浏览器不支持原生 DecompressionStream');
        }
        const ds = new DecompressionStream('gzip');
        const writer = ds.writable.getWriter();
        writer.write(u8);
        writer.close();
        const ab = await new Response(ds.readable).arrayBuffer();
        return new Uint8Array(ab);
      },

      async gzip(u8) {
        if (typeof CompressionStream === 'undefined') {
          throw new Error('当前浏览器不支持原生 CompressionStream');
        }
        const cs = new CompressionStream('gzip');
        const writer = cs.writable.getWriter();
        writer.write(u8);
        writer.close();
        const ab = await new Response(cs.readable).arrayBuffer();
        return new Uint8Array(ab);
      },

      parseTar(u8) {
        const entries = [];
        const dec = new TextDecoder('utf-8');
        let offset = 0;
        const readStr = (buf, start, len) => {
          let end = start;
          while (end < start + len && buf[end] !== 0) end++;
          return dec.decode(buf.subarray(start, end));
        };
        while (offset + 512 <= u8.length) {
          const header = u8.subarray(offset, offset + 512);
          let allZero = true;
          for (let i = 0; i < 512; i++) { if (header[i] !== 0) { allZero = false; break; } }
          if (allZero) break;
          const namePart = readStr(header, 0, 100);
          const prefixPart = readStr(header, 345, 155);
          const fullName = (prefixPart ? prefixPart + '/' + namePart : namePart).replace(/^\/+/, '');
          const sizeOct = readStr(header, 124, 12).trim().replace(/\0.*$/, '');
          const mtimeOct = readStr(header, 136, 12).trim().replace(/\0.*$/, '');
          const typeFlag = String.fromCharCode(header[156] || 48);
          const size = parseInt(sizeOct || '0', 8) || 0;
          const mtimeSec = parseInt(mtimeOct || '0', 8) || 0;
          const mtime = mtimeSec > 0 ? mtimeSec * 1000 : Date.now();
          offset += 512;
          const data = u8.slice(offset, offset + size);
          offset += Math.ceil(size / 512) * 512;
          if (!fullName) continue;
          const isDir = typeFlag === '5' || fullName.endsWith('/');
          entries.push({
            name: fullName.replace(/\/+$/, ''),
            isDir,
            size: isDir ? 0 : size,
            mtime,
            data: isDir ? null : data
          });
        }
        return entries;
      },

      async list(path) {
        const raw = await window.fs.readFile(path);
        const u8 = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
        const ext = extname(path);
        const base = basename(path);

        if (ext === 'zip') {
          const JSZip = await CDNLoader.loadJSZip();
          const zip = await JSZip.loadAsync(u8);
          const out = [];
          zip.forEach((rel, entry) => {
            const clean = rel.replace(/\/+$/, '');
            if (!clean) return;
            out.push({
              name: clean,
              isDir: entry.dir,
              size: entry._data ? (entry._data.uncompressedSize || 0) : 0,
              mtime: this.fixJSZipReadDate(entry.date)
            });
          });
          return out;
        }
        if (ext === 'tar') {
          return this.parseTar(u8).map(e => ({ name: e.name, isDir: e.isDir, size: e.size, mtime: e.mtime }));
        }
        if (ext === 'tar.gz' || ext === 'tgz') {
          const tarBuf = await this.gunzip(u8);
          return this.parseTar(tarBuf).map(e => ({ name: e.name, isDir: e.isDir, size: e.size, mtime: e.mtime }));
        }
        if (ext === 'gz') {
          const inner = await this.gunzip(u8);
          const innerName = base.replace(/\.gz$/i, '') || 'decompressed.bin';
          const st = await window.fs.stat(path);
          return [{ name: innerName, isDir: false, size: inner.byteLength, mtime: st.mtime }];
        }
        // 7z / rar / bz2 / xz via 7z-wasm
        const SevenZipFactory = await CDNLoader.loadSevenZip();
        let stdout = '';
        const sz = await SevenZipFactory({ print: (s) => { stdout += s + '\n'; }, printErr: () => {} });
        const tmpName = 'input.' + (ext || '7z');
        sz.FS.writeFile('/' + tmpName, u8);
        sz.callMain(['l', '-slt', '/' + tmpName]);
        const entries = [];
        const blocks = stdout.split(/\r?\n\r?\n/);
        for (const blk of blocks) {
          const mPath = blk.match(/^Path = (.+)$/m);
          const mSize = blk.match(/^Size = (\d+)$/m);
          const mFolder = blk.match(/^Folder = ([+-])$/m);
          const mMod = blk.match(/^Modified = (.+)$/m);
          if (mPath && mPath[1] !== '/' + tmpName) {
            const p = mPath[1].replace(/\\/g, '/').replace(/^\/+/, '');
            const mt = mMod ? Date.parse(mMod[1].replace(' ', 'T')) : Date.now();
            entries.push({
              name: p,
              isDir: mFolder ? mFolder[1] === '+' : false,
              size: mSize ? Number(mSize[1]) : 0,
              mtime: isNaN(mt) ? Date.now() : mt
            });
          }
        }
        try { sz.FS.unlink('/' + tmpName); } catch (_) {}
        return entries;
      },

      async extract(archivePath, targetDir) {
        const raw = await window.fs.readFile(archivePath);
        const u8 = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
        const ext = extname(archivePath);
        const base = basename(archivePath);
        const folderBase = base.replace(/\.(tar\.gz|tgz|zip|gz|tar|7z|rar|bz2|xz)$/i, '') || 'extracted';
        const destRoot = joinPath(targetDir, folderBase);
        await window.fs.mkdir(destRoot, { recursive: true });
        let count = 0;

        if (ext === 'zip') {
          const JSZip = await CDNLoader.loadJSZip();
          const zip = await JSZip.loadAsync(u8);
          const keys = Object.keys(zip.files);
          for (const rel of keys) {
            const entry = zip.files[rel];
            const clean = rel.replace(/^\/+/, '').replace(/\/+$/, '');
            if (!clean || clean.includes('..')) continue;
            const fixedMtime = this.fixJSZipReadDate(entry.date);
            const fullDest = joinPath(destRoot, clean);
            if (entry.dir) {
              await window.fs.mkdir(fullDest, { recursive: true, mtime: fixedMtime });
            } else {
              await window.fs.mkdir(dirname(fullDest), { recursive: true });
              const data = await entry.async('uint8array');
              await window.fs.writeFile(fullDest, data, { mtime: fixedMtime });
              count++;
            }
          }
          return { destRoot, count };
        }

        if (ext === 'tar' || ext === 'tar.gz' || ext === 'tgz') {
          const tarBuf = (ext === 'tar') ? u8 : await this.gunzip(u8);
          const entries = this.parseTar(tarBuf);
          for (const e of entries) {
            if (!e.name || e.name.includes('..')) continue;
            const fullDest = joinPath(destRoot, e.name);
            if (e.isDir) {
              await window.fs.mkdir(fullDest, { recursive: true, mtime: e.mtime });
            } else {
              await window.fs.mkdir(dirname(fullDest), { recursive: true });
              await window.fs.writeFile(fullDest, e.data, { mtime: e.mtime });
              count++;
            }
          }
          return { destRoot, count };
        }

        if (ext === 'gz') {
          const inner = await this.gunzip(u8);
          const st = await window.fs.stat(archivePath);
          const innerName = base.replace(/\.gz$/i, '') || 'file.bin';
          const outFile = joinPath(targetDir, innerName);
          await window.fs.writeFile(outFile, inner, { mtime: st.mtime });
          return { destRoot: targetDir, count: 1 };
        }

        // 7z-wasm extraction for .7z / .rar / .bz2 / .xz
        const SevenZipFactory = await CDNLoader.loadSevenZip();
        const sz = await SevenZipFactory({ print: () => {}, printErr: () => {} });
        const inFile = '/in_archive.' + (ext || '7z');
        const outDir = '/out_extract';
        try { sz.FS.mkdir(outDir); } catch (_) {}
        sz.FS.writeFile(inFile, u8);
        sz.callMain(['x', inFile, '-o' + outDir, '-y']);

        const walkWasm = async (wasmDir, vfsDir) => {
          const items = sz.FS.readdir(wasmDir).filter(n => n !== '.' && n !== '..');
          for (const name of items) {
            const wp = wasmDir + '/' + name;
            const vp = joinPath(vfsDir, name);
            const stat = sz.FS.stat(wp);
            const mtime = stat.mtime ? new Date(stat.mtime).getTime() : Date.now();
            if (sz.FS.isDir(stat.mode)) {
              await window.fs.mkdir(vp, { recursive: true, mtime });
              await walkWasm(wp, vp);
            } else {
              const bytes = sz.FS.readFile(wp);
              await window.fs.writeFile(vp, new Uint8Array(bytes), { mtime });
              count++;
            }
          }
        };
        await walkWasm(outDir, destRoot);
        return { destRoot, count };
      },

      async compressZip(paths, outputZipPath) {
        const JSZip = await CDNLoader.loadJSZip();
        const zip = new JSZip();
        const addNode = async (vfsPath, relPrefix) => {
          const st = await window.fs.stat(vfsPath);
          const name = basename(vfsPath);
          const rel = relPrefix ? `${relPrefix}/${name}` : name;
          const writeDate = this.fixJSZipWriteDate(st.mtime);
          if (st.isDirectory) {
            zip.folder(rel);
            const children = await window.fs.readdir(vfsPath);
            for (const c of children) {
              await addNode(joinPath(vfsPath, c), rel);
            }
          } else {
            const data = await window.fs.readFile(vfsPath);
            zip.file(rel, data, { date: writeDate });
          }
        };
        for (const p of paths) {
          await addNode(p, '');
        }
        const bytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
        await window.fs.writeFile(outputZipPath, bytes, { mtime: Date.now() });
        return outputZipPath;
      }
    };

    /* =====================================================================
       UNIFIED MULTI-BACKEND VFS (OPFS + IndexedDB + Local FSAA + MetaStore)
       ===================================================================== */

    const DB_NAME = 'XuanYuanOS_VFS_v2';
    const DB_VERSION = 2;

    class MetaAndIDBDatabase {
      constructor() { this._db = null; }
      async open() {
        if (this._db) return this._db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
            if (!db.objectStoreNames.contains('idb_nodes')) db.createObjectStore('idb_nodes', { keyPath: 'path' });
            if (!db.objectStoreNames.contains('mount_records')) db.createObjectStore('mount_records', { keyPath: 'name' });
          };
          req.onsuccess = () => { this._db = req.result; resolve(this._db); };
          req.onerror = () => reject(req.error);
        });
      }
      async get(store, key) {
        const db = await this.open();
        return new Promise((res, rej) => {
          const tx = db.transaction(store, 'readonly');
          const r = tx.objectStore(store).get(key);
          r.onsuccess = () => res(r.result || null);
          r.onerror = () => rej(r.error);
        });
      }
      async put(store, val) {
        const db = await this.open();
        return new Promise((res, rej) => {
          const tx = db.transaction(store, 'readwrite');
          tx.objectStore(store).put(val);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
      async del(store, key) {
        const db = await this.open();
        return new Promise((res, rej) => {
          const tx = db.transaction(store, 'readwrite');
          tx.objectStore(store).delete(key);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
      async getAll(store) {
        const db = await this.open();
        return new Promise((res, rej) => {
          const tx = db.transaction(store, 'readonly');
          const r = tx.objectStore(store).getAll();
          r.onsuccess = () => res(r.result || []);
          r.onerror = () => rej(r.error);
        });
      }
      async clear(store) {
        const db = await this.open();
        return new Promise((res, rej) => {
          const tx = db.transaction(store, 'readwrite');
          tx.objectStore(store).clear();
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
    }

    const vfsDB = new MetaAndIDBDatabase();

    // Helper: parse flexible (opts, callback) signatures required by Section 8.6
    function parseFsArgs(args) {
      let cb = null;
      let opts = {};
      const list = Array.from(args);
      if (list.length && typeof list[list.length - 1] === 'function') {
        cb = list.pop();
      }
      if (list.length) {
        const last = list[list.length - 1];
        if (typeof last === 'string') opts = { encoding: last };
        else if (typeof last === 'boolean') opts = { isLstat: last };
        else if (last && typeof last === 'object') opts = last;
      }
      return { opts, cb };
    }

    function wrapCb(promise, cb) {
      if (typeof cb === 'function') {
        promise.then(res => cb(null, res), err => cb(err));
        return;
      }
      return promise;
    }

    async function toUint8Array(data) {
      if (data == null) return new Uint8Array(0);
      if (data instanceof Uint8Array) return data;
      if (data instanceof ArrayBuffer) return new Uint8Array(data);
      if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      if (typeof Blob !== 'undefined' && data instanceof Blob) return new Uint8Array(await data.arrayBuffer());
      if (typeof data === 'string') return new TextEncoder().encode(data);
      return new TextEncoder().encode(String(data));
    }

    /* ---------- Backend 1: Native OPFS Backend ---------- */
    class OPFSBackend {
      constructor() {
        this.id = 'opfs';
        this.label = 'OPFS 原生私有文件系统';
        this.root = null;
        this.available = false;
        this._metaCache = new Map();
      }

      async init() {
        if (!navigator.storage || typeof navigator.storage.getDirectory !== 'function') {
          this.available = false;
          return false;
        }
        try {
          const originRoot = await navigator.storage.getDirectory();
          this.root = await originRoot.getDirectoryHandle('xuanyuan_root', { create: true });
          const allMeta = await vfsDB.getAll('meta').catch(() => []);
          for (const m of allMeta) {
            if (m.key && m.key.startsWith('opfs:')) this._metaCache.set(m.key.slice(5), m);
          }
          this.available = true;
          return true;
        } catch (err) {
          console.warn('[OPFS] 初始化失败，将启用降级引擎:', err);
          this.available = false;
          return false;
        }
      }

      async _setMeta(path, meta) {
        const n = normalizePath(path);
        const prev = this._metaCache.get(n) || {};
        const merged = {
          key: 'opfs:' + n,
          mtime: meta.mtime ?? prev.mtime ?? Date.now(),
          birthtime: meta.birthtime ?? prev.birthtime ?? meta.mtime ?? Date.now()
        };
        this._metaCache.set(n, merged);
        await vfsDB.put('meta', merged).catch(() => {});
      }

      async _delMetaPrefix(path) {
        const n = normalizePath(path);
        const prefix = n === '/' ? '/' : n + '/';
        for (const k of Array.from(this._metaCache.keys())) {
          if (k === n || k.startsWith(prefix)) {
            this._metaCache.delete(k);
            vfsDB.del('meta', 'opfs:' + k).catch(() => {});
          }
        }
      }

      async _getDir(path, create = false) {
        const n = normalizePath(path);
        if (n === '/') return this.root;
        let cur = this.root;
        for (const seg of n.slice(1).split('/')) {
          cur = await cur.getDirectoryHandle(seg, { create });
        }
        return cur;
      }

      async _resolveHandle(path) {
        const n = normalizePath(path);
        if (n === '/') return { handle: this.root, kind: 'directory' };
        const parent = await this._getDir(dirname(n), false);
        const name = basename(n);
        try {
          const fh = await parent.getFileHandle(name);
          return { handle: fh, kind: 'file' };
        } catch (_) {
          const dh = await parent.getDirectoryHandle(name);
          return { handle: dh, kind: 'directory' };
        }
      }

      async stat(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const { handle, kind } = await this._resolveHandle(n);
          const meta = this._metaCache.get(n);
          if (kind === 'directory') {
            const mt = meta ? meta.mtime : Date.now();
            return {
              path: n, name: basename(n), isDirectory: true, isFile: false,
              size: 0, mtime: mt, birthtime: meta?.birthtime || mt, backend: 'opfs'
            };
          }
          const file = await handle.getFile();
          const mt = meta?.mtime || file.lastModified || Date.now();
          return {
            path: n, name: basename(n), isDirectory: false, isFile: true,
            size: file.size, mtime: mt, birthtime: meta?.birthtime || mt, backend: 'opfs'
          };
        })(), cb);
      }

      async exists(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          try { await this._resolveHandle(path); return true; }
          catch (_) { return false; }
        })(), cb);
      }

      async readdir(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const dir = await this._getDir(path, false);
          const names = [];
          for await (const [name] of dir.entries()) names.push(name);
          return names;
        })(), cb);
      }

      async mkdir(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          if (n === '/') return;
          if (opts.recursive !== false) {
            await this._getDir(n, true);
          } else {
            const parent = await this._getDir(dirname(n), false);
            await parent.getDirectoryHandle(basename(n), { create: true });
          }
          await this._setMeta(n, { mtime: opts.mtime || Date.now() });
        })(), cb);
      }

      async readFile(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const parent = await this._getDir(dirname(n), false);
          const fh = await parent.getFileHandle(basename(n));
          const file = await fh.getFile();
          if (opts.encoding === 'utf8' || opts.encoding === 'utf-8') {
            return await file.text();
          }
          if (opts.asBlob) return file;
          const ab = await file.arrayBuffer();
          return new Uint8Array(ab);
        })(), cb);
      }

      async writeFile(path, data, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const parent = await this._getDir(dirname(n), true);
          const fh = await parent.getFileHandle(basename(n), { create: true });
          const bytes = await toUint8Array(data);
          const writable = await fh.createWritable();
          await writable.write(bytes);
          await writable.close();
          const mtime = opts.mtime != null ? opts.mtime : Date.now();
          await this._setMeta(n, { mtime, birthtime: opts.birthtime || mtime });
        })(), cb);
      }

      async open(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb(this._resolveHandle(path).then(r => r.handle), cb);
      }

      async unlink(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const parent = await this._getDir(dirname(n), false);
          await parent.removeEntry(basename(n), { recursive: false });
          await this._delMetaPrefix(n);
        })(), cb);
      }

      async rmdir(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          if (n === '/') throw new Error('不能删除根目录');
          const parent = await this._getDir(dirname(n), false);
          await parent.removeEntry(basename(n), { recursive: opts.recursive !== false });
          await this._delMetaPrefix(n);
        })(), cb);
      }

      async rename(oldPath, newPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const src = normalizePath(oldPath), dst = normalizePath(newPath);
          if (src === dst) return;
          const st = await this.stat(src);
          const copyRec = async (s, d) => {
            const sStat = await this.stat(s);
            if (sStat.isDirectory) {
              await this.mkdir(d, { recursive: true, mtime: sStat.mtime });
              const kids = await this.readdir(s);
              for (const k of kids) await copyRec(joinPath(s, k), joinPath(d, k));
              await this._setMeta(d, { mtime: sStat.mtime, birthtime: sStat.birthtime });
            } else {
              const bytes = await this.readFile(s);
              await this.writeFile(d, bytes, { mtime: sStat.mtime, birthtime: sStat.birthtime });
            }
          };
          await copyRec(src, dst);
          if (st.isDirectory) await this.rmdir(src, { recursive: true });
          else await this.unlink(src);
        })(), cb);
      }

      async clearAll() {
        if (!this.root) return;
        for await (const [name] of this.root.entries()) {
          await this.root.removeEntry(name, { recursive: true });
        }
        await this._delMetaPrefix('/');
      }

      async inspectAll() {
        const out = [];
        const walk = async (dirPath) => {
          const names = await this.readdir(dirPath).catch(() => []);
          for (const n of names) {
            const full = joinPath(dirPath, n);
            const st = await this.stat(full).catch(() => null);
            if (!st) continue;
            out.push(st);
            if (st.isDirectory) await walk(full);
          }
        };
        if (this.available) await walk('/');
        return out;
      }
    }

    /* ---------- Backend 2: IndexedDB Persistent Backend ---------- */
    class IDBBackend {
      constructor() {
        this.id = 'idb';
        this.label = 'IndexedDB 持久化存储';
        this.available = false;
        this._memFallback = new Map();
        this._useMem = false;
      }

      async init() {
        try {
          await vfsDB.open();
          const rootNode = await vfsDB.get('idb_nodes', '/');
          if (!rootNode) {
            await vfsDB.put('idb_nodes', { path: '/', isDirectory: true, size: 0, mtime: Date.now(), birthtime: Date.now() });
          }
          this.available = true;
          this._useMem = false;
          return true;
        } catch (err) {
          console.warn('[IDB] 初始化失败，降级为内存卷:', err);
          this._useMem = true;
          this.available = true;
          this._memFallback.set('/', { path: '/', isDirectory: true, size: 0, mtime: Date.now(), birthtime: Date.now() });
          return true;
        }
      }

      async _get(p) {
        const n = normalizePath(p);
        return this._useMem ? (this._memFallback.get(n) || null) : vfsDB.get('idb_nodes', n);
      }
      async _put(node) {
        if (this._useMem) { this._memFallback.set(node.path, node); return; }
        return vfsDB.put('idb_nodes', node);
      }
      async _del(p) {
        const n = normalizePath(p);
        if (this._useMem) { this._memFallback.delete(n); return; }
        return vfsDB.del('idb_nodes', n);
      }
      async _all() {
        return this._useMem ? Array.from(this._memFallback.values()) : vfsDB.getAll('idb_nodes');
      }

      async stat(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const node = await this._get(n);
          if (!node) throw new Error('ENOENT: ' + n);
          return {
            path: n, name: basename(n), isDirectory: !!node.isDirectory, isFile: !node.isDirectory,
            size: node.isDirectory ? 0 : (node.size || (node.data ? node.data.byteLength : 0)),
            mtime: node.mtime || Date.now(), birthtime: node.birthtime || node.mtime || Date.now(),
            backend: 'idb'
          };
        })(), cb);
      }

      async exists(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb(this._get(path).then(Boolean), cb);
      }

      async readdir(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const dirNode = await this._get(n);
          if (!dirNode || !dirNode.isDirectory) throw new Error('ENOTDIR: ' + n);
          const all = await this._all();
          const out = [];
          for (const item of all) {
            if (item.path === '/') continue;
            if (dirname(item.path) === n) out.push(basename(item.path));
          }
          return out;
        })(), cb);
      }

      async mkdir(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          if (n === '/') return;
          const parts = n.slice(1).split('/');
          let cur = '';
          for (let i = 0; i < parts.length; i++) {
            cur += '/' + parts[i];
            const existing = await this._get(cur);
            if (!existing) {
              const mt = (i === parts.length - 1 && opts.mtime) ? opts.mtime : Date.now();
              await this._put({ path: cur, isDirectory: true, size: 0, mtime: mt, birthtime: mt });
            }
          }
        })(), cb);
      }

      async readFile(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const node = await this._get(n);
          if (!node || node.isDirectory) throw new Error('ENOENT: ' + n);
          const u8 = node.data instanceof Uint8Array ? node.data : new Uint8Array(node.data || []);
          if (opts.encoding === 'utf8' || opts.encoding === 'utf-8') {
            return new TextDecoder('utf-8').decode(u8);
          }
          if (opts.asBlob) return new Blob([u8], { type: getMimeType(n) });
          return new Uint8Array(u8);
        })(), cb);
      }

      async writeFile(path, data, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          await this.mkdir(dirname(n), { recursive: true });
          const bytes = await toUint8Array(data);
          const existing = await this._get(n);
          const mtime = opts.mtime != null ? opts.mtime : Date.now();
          await this._put({
            path: n, isDirectory: false, data: bytes, size: bytes.byteLength,
            mtime, birthtime: opts.birthtime || existing?.birthtime || mtime
          });
        })(), cb);
      }

      async open(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb(this._get(path), cb);
      }

      async unlink(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb(this._del(path), cb);
      }

      async rmdir(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          if (n === '/') throw new Error('不能删除根目录');
          const prefix = n + '/';
          const all = await this._all();
          for (const item of all) {
            if (item.path === n || item.path.startsWith(prefix)) await this._del(item.path);
          }
        })(), cb);
      }

      async rename(oldPath, newPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const src = normalizePath(oldPath), dst = normalizePath(newPath);
          if (src === dst) return;
          const all = await this._all();
          const prefix = src + '/';
          for (const item of all) {
            if (item.path === src || item.path.startsWith(prefix)) {
              const target = dst + item.path.slice(src.length);
              await this._put({ ...item, path: target });
              await this._del(item.path);
            }
          }
        })(), cb);
      }

      async clearAll() {
        if (this._useMem) {
          this._memFallback.clear();
          this._memFallback.set('/', { path: '/', isDirectory: true, size: 0, mtime: Date.now(), birthtime: Date.now() });
        } else {
          await vfsDB.clear('idb_nodes');
          await vfsDB.put('idb_nodes', { path: '/', isDirectory: true, size: 0, mtime: Date.now(), birthtime: Date.now() });
        }
      }

      async inspectAll() {
        const all = await this._all();
        return all.filter(n => n.path !== '/').map(n => ({
          path: n.path, name: basename(n.path), isDirectory: !!n.isDirectory, isFile: !n.isDirectory,
          size: n.size || 0, mtime: n.mtime || Date.now(), backend: 'idb'
        }));
      }
    }

    /* ---------- Backend 3: Local Folder Mount Backend (File System Access API) ----------
       Completely conforms to Unified VFS backend interface — ZERO isLocal branching! */
    class LocalFSAABackend {
      constructor(dirHandle, mountName) {
        this.id = 'local:' + mountName;
        this.label = '本地挂载: ' + mountName;
        this.root = dirHandle;
        this.mountName = mountName;
        this._mtimeOverrides = new Map();
      }

      async _getDir(relPath, create = false) {
        const n = normalizePath(relPath);
        if (n === '/') return this.root;
        let cur = this.root;
        for (const seg of n.slice(1).split('/')) {
          cur = await cur.getDirectoryHandle(seg, { create });
        }
        return cur;
      }

      async _resolveHandle(relPath) {
        const n = normalizePath(relPath);
        if (n === '/') return { handle: this.root, kind: 'directory' };
        const parent = await this._getDir(dirname(n), false);
        const name = basename(n);
        try {
          const fh = await parent.getFileHandle(name);
          return { handle: fh, kind: 'file' };
        } catch (_) {
          const dh = await parent.getDirectoryHandle(name);
          return { handle: dh, kind: 'directory' };
        }
      }

      async stat(relPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(relPath);
          const { handle, kind } = await this._resolveHandle(n);
          const ov = this._mtimeOverrides.get(n);
          if (kind === 'directory') {
            return {
              path: n, name: basename(n), isDirectory: true, isFile: false,
              size: 0, mtime: ov || Date.now(), birthtime: ov || Date.now(), backend: this.id
            };
          }
          const file = await handle.getFile();
          const mt = ov || file.lastModified || Date.now();
          return {
            path: n, name: basename(n), isDirectory: false, isFile: true,
            size: file.size, mtime: mt, birthtime: mt, backend: this.id
          };
        })(), cb);
      }

      async exists(relPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          try { await this._resolveHandle(relPath); return true; }
          catch (_) { return false; }
        })(), cb);
      }

      async readdir(relPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const dir = await this._getDir(relPath, false);
          const names = [];
          for await (const [name] of dir.entries()) names.push(name);
          return names;
        })(), cb);
      }

      async mkdir(relPath, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(relPath);
          if (n === '/') return;
          await this._getDir(n, true);
          if (opts.mtime) this._mtimeOverrides.set(n, opts.mtime);
        })(), cb);
      }

      async readFile(relPath, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(relPath);
          const parent = await this._getDir(dirname(n), false);
          const fh = await parent.getFileHandle(basename(n));
          const file = await fh.getFile();
          if (opts.encoding === 'utf8' || opts.encoding === 'utf-8') return await file.text();
          if (opts.asBlob) return file;
          return new Uint8Array(await file.arrayBuffer());
        })(), cb);
      }

      async writeFile(relPath, data, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(relPath);
          const parent = await this._getDir(dirname(n), true);
          const fh = await parent.getFileHandle(basename(n), { create: true });
          const bytes = await toUint8Array(data);
          const writable = await fh.createWritable();
          await writable.write(bytes);
          await writable.close();
          if (opts.mtime) this._mtimeOverrides.set(n, opts.mtime);
        })(), cb);
      }

      async open(relPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb(this._resolveHandle(relPath).then(r => r.handle), cb);
      }

      async unlink(relPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(relPath);
          const parent = await this._getDir(dirname(n), false);
          await parent.removeEntry(basename(n), { recursive: false });
          this._mtimeOverrides.delete(n);
        })(), cb);
      }

      async rmdir(relPath, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(relPath);
          if (n === '/') throw new Error('不能删除挂载根目录');
          const parent = await this._getDir(dirname(n), false);
          await parent.removeEntry(basename(n), { recursive: opts.recursive !== false });
          this._mtimeOverrides.delete(n);
        })(), cb);
      }

      async rename(oldPath, newPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const src = normalizePath(oldPath), dst = normalizePath(newPath);
          if (src === dst) return;
          const st = await this.stat(src);
          const copyRec = async (s, d) => {
            const sst = await this.stat(s);
            if (sst.isDirectory) {
              await this.mkdir(d, { recursive: true, mtime: sst.mtime });
              for (const k of await this.readdir(s)) await copyRec(joinPath(s, k), joinPath(d, k));
            } else {
              const bytes = await this.readFile(s);
              await this.writeFile(d, bytes, { mtime: sst.mtime });
            }
          };
          await copyRec(src, dst);
          if (st.isDirectory) await this.rmdir(src, { recursive: true });
          else await this.unlink(src);
        })(), cb);
      }
    }

    /* ---------- Unified VFS Router (window.fs) ---------- */
    class UnifiedVFS {
      constructor() {
        this.opfs = new OPFSBackend();
        this.idb = new IDBBackend();
        this.primaryKey = 'opfs';
        this.showBoth = true;
        this.mounts = new Map(); // mountPoint -> backend
        this._listeners = new Set();
        this._dirSizeCache = new Map();
      }

      async init(preferredPrimary = 'opfs', showBoth = true) {
        await Promise.all([this.opfs.init(), this.idb.init()]);
        if (preferredPrimary === 'opfs' && !this.opfs.available) {
          this.primaryKey = 'idb';
        } else {
          this.primaryKey = preferredPrimary;
        }
        this.showBoth = showBoth;
        this._syncVolumeMounts();
        return this;
      }

      get primaryBackend() {
        return (this.primaryKey === 'opfs' && this.opfs.available) ? this.opfs : this.idb;
      }

      setConfig(primaryKey, showBoth) {
        this.primaryKey = (primaryKey === 'opfs' && this.opfs.available) ? 'opfs' : 'idb';
        this.showBoth = !!showBoth;
        this._syncVolumeMounts();
        this._emit({ type: 'config' });
      }

      _syncVolumeMounts() {
        this.mounts.delete('/volumes/OPFS');
        this.mounts.delete('/volumes/IndexedDB');
        if (this.showBoth) {
          if (this.opfs.available) this.mounts.set('/volumes/OPFS', this.opfs);
          if (this.idb.available) this.mounts.set('/volumes/IndexedDB', this.idb);
        }
      }

      mount(mountPoint, backend) {
        const mp = normalizePath(mountPoint);
        this.mounts.set(mp, backend);
        this._dirSizeCache.clear();
        this._emit({ type: 'mount', path: mp });
      }

      unmount(mountPoint) {
        const mp = normalizePath(mountPoint);
        const existed = this.mounts.delete(mp);
        this._dirSizeCache.clear();
        if (existed) this._emit({ type: 'unmount', path: mp });
        return existed;
      }

      listLocalMounts() {
        const res = [];
        for (const [mp, backend] of this.mounts.entries()) {
          if (mp.startsWith('/mnt/local/')) res.push({ path: mp, name: basename(mp), backend });
        }
        return res;
      }

      // Check whether path is a synthetic virtual mount container (like /mnt, /mnt/local, /volumes)
      _getVirtualMountChildren(path) {
        const n = normalizePath(path);
        const kids = new Set();
        const prefix = n === '/' ? '/' : n + '/';
        for (const mp of this.mounts.keys()) {
          if (mp.startsWith(prefix) && mp !== n) {
            const rest = mp.slice(prefix.length);
            const firstSeg = rest.split('/')[0];
            if (firstSeg) kids.add(firstSeg);
          }
        }
        return Array.from(kids);
      }

      _resolve(path) {
        const n = normalizePath(path);
        let bestMp = null;
        for (const mp of this.mounts.keys()) {
          if (n === mp || n.startsWith(mp + '/')) {
            if (!bestMp || mp.length > bestMp.length) bestMp = mp;
          }
        }
        if (bestMp) {
          const rel = n === bestMp ? '/' : n.slice(bestMp.length);
          return { backend: this.mounts.get(bestMp), relPath: normalizePath(rel), mountPoint: bestMp };
        }
        return { backend: this.primaryBackend, relPath: n, mountPoint: '/' };
      }

      on(fn) { this._listeners.add(fn); return () => this._listeners.delete(fn); }
      _emit(evt) {
        this._dirSizeCache.clear();
        for (const fn of this._listeners) { try { fn(evt); } catch (_) {} }
      }

      async stat(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const vKids = this._getVirtualMountChildren(n);
          const { backend, relPath } = this._resolve(n);
          try {
            const st = await backend.stat(relPath, opts);
            return { ...st, path: n, name: basename(n) };
          } catch (err) {
            if (vKids.length > 0 || n === '/mnt' || n === '/mnt/local' || (this.showBoth && n === '/volumes')) {
              return { path: n, name: basename(n), isDirectory: true, isFile: false, size: 0, mtime: Date.now(), birthtime: Date.now(), backend: 'virtual' };
            }
            throw err;
          }
        })(), cb);
      }

      async exists(path, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          try { await this.stat(path); return true; } catch (_) { return false; }
        })(), cb);
      }

      async readdir(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const set = new Set(this._getVirtualMountChildren(n));
          if (n === '/mnt') set.add('local');
          const { backend, relPath } = this._resolve(n);
          try {
            const names = await backend.readdir(relPath, opts);
            for (const name of names) set.add(name);
          } catch (err) {
            if (set.size === 0 && n !== '/mnt/local' && n !== '/volumes') throw err;
          }
          return Array.from(set);
        })(), cb);
      }

      async readFile(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const { backend, relPath } = this._resolve(path);
          return await backend.readFile(relPath, opts);
        })(), cb);
      }

      async writeFile(path, data, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const { backend, relPath } = this._resolve(n);
          await backend.writeFile(relPath, data, opts);
          this._emit({ type: 'write', path: n });
        })(), cb);
      }

      async open(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const { backend, relPath } = this._resolve(path);
          return await backend.open(relPath, opts);
        })(), cb);
      }

      async mkdir(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const { backend, relPath } = this._resolve(n);
          await backend.mkdir(relPath, opts);
          this._emit({ type: 'mkdir', path: n });
        })(), cb);
      }

      async unlink(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const { backend, relPath } = this._resolve(n);
          await backend.unlink(relPath, opts);
          this._emit({ type: 'unlink', path: n });
        })(), cb);
      }

      async rmdir(path, ...rest) {
        const { opts, cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const n = normalizePath(path);
          const { backend, relPath } = this._resolve(n);
          await backend.rmdir(relPath, opts);
          this._emit({ type: 'rmdir', path: n });
        })(), cb);
      }

      async rm(path) {
        const st = await this.stat(path);
        if (st.isDirectory) await this.rmdir(path, { recursive: true });
        else await this.unlink(path);
      }

      // Copy preserving exact original mtime & birthtime recursively across ANY backends!
      async copy(srcPath, dstPath) {
        const src = normalizePath(srcPath), dst = normalizePath(dstPath);
        if (src === dst) return;
        if (dst.startsWith(src + '/')) throw new Error('不能将文件夹复制到其自身子目录中');
        const st = await this.stat(src);
        if (st.isDirectory) {
          await this.mkdir(dst, { recursive: true, mtime: st.mtime });
          const names = await this.readdir(src);
          for (const name of names) {
            await this.copy(joinPath(src, name), joinPath(dst, name));
          }
          // Re-assert directory mtime after populating children
          const r = this._resolve(dst);
          if (r.backend._setMeta) await r.backend._setMeta(r.relPath, { mtime: st.mtime, birthtime: st.birthtime });
        } else {
          const data = await this.readFile(src);
          await this.writeFile(dst, data, { mtime: st.mtime, birthtime: st.birthtime });
        }
        this._emit({ type: 'copy', src, dst });
      }

      // Rename / Move preserving exact original mtime across same or cross backends!
      async rename(oldPath, newPath, ...rest) {
        const { cb } = parseFsArgs(rest);
        return wrapCb((async () => {
          const src = normalizePath(oldPath), dst = normalizePath(newPath);
          if (src === dst) return;
          if (dst.startsWith(src + '/')) throw new Error('不能将文件夹移动到其自身子目录中');
          const r1 = this._resolve(src), r2 = this._resolve(dst);
          if (r1.backend === r2.backend && r1.mountPoint === r2.mountPoint) {
            await r1.backend.rename(r1.relPath, r2.relPath);
          } else {
            await this.copy(src, dst);
            await this.rm(src);
          }
          this._emit({ type: 'rename', src, dst });
        })(), cb);
      }

      async move(src, dst) { return this.rename(src, dst); }

      async uniquePath(dirPath, desiredName) {
        let candidate = joinPath(dirPath, desiredName);
        if (!(await this.exists(candidate))) return candidate;
        const ext = extname(desiredName);
        const dotIdx = ext ? desiredName.length - ext.length - 1 : -1;
        const stem = dotIdx > 0 ? desiredName.slice(0, dotIdx) : desiredName;
        const suffix = dotIdx > 0 ? desiredName.slice(dotIdx) : '';
        let n = 2;
        while (await this.exists(candidate)) {
          candidate = joinPath(dirPath, `${stem} (${n++})${suffix}`);
        }
        return candidate;
      }

      // Accurate Recursive Folder Size Calculator with cache
      async getDirSize(dirPath) {
        const n = normalizePath(dirPath);
        if (this._dirSizeCache.has(n)) return this._dirSizeCache.get(n);
        let total = 0;
        const visited = new Set();
        const walk = async (p) => {
          if (visited.has(p)) return;
          visited.add(p);
          const names = await this.readdir(p).catch(() => []);
          await Promise.all(names.map(async (name) => {
            const full = joinPath(p, name);
            // Skip recursive volume loop if scanning root when /volumes is mounted
            if (n === '/' && (full === '/volumes' || full === '/mnt')) return;
            const st = await this.stat(full).catch(() => null);
            if (!st) return;
            if (st.isDirectory) await walk(full);
            else total += (st.size || 0);
          }));
        };
        await walk(n);
        this._dirSizeCache.set(n, total);
        return total;
      }

      async searchRecursive(rootPath, query, maxResults = 300) {
        const q = String(query || '').trim().toLowerCase();
        if (!q) return [];
        const results = [];
        const walk = async (p, depth) => {
          if (depth > 12 || results.length >= maxResults) return;
          const names = await this.readdir(p).catch(() => []);
          for (const name of names) {
            if (results.length >= maxResults) break;
            const full = joinPath(p, name);
            if (p === '/' && full === '/volumes') continue;
            const st = await this.stat(full).catch(() => null);
            if (!st) continue;
            if (name.toLowerCase().includes(q)) results.push(st);
            if (st.isDirectory) await walk(full, depth + 1);
          }
        };
        await walk(normalizePath(rootPath), 0);
        return results;
      }
    }

    /* ---------- Toast & Modal Dialog Systems ---------- */
    function showToast(message, type = 'info', duration = 3000) {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = `toast-item ${type}`;
      const iconName = type === 'error' ? 'close' : type === 'success' ? 'check' : 'info';
      const iconColor = type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--accent)';
      el.innerHTML = `<span style="color:${iconColor};font-size:15px;display:flex;">${ico(iconName)}</span><span style="flex:1;line-height:1.4;">${escapeHtml(message)}</span>`;
      root.appendChild(el);
      const remove = () => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(14px)';
        el.style.transition = 'all 0.18s ease';
        setTimeout(() => el.remove(), 190);
      };
      el.addEventListener('click', remove);
      if (duration > 0) setTimeout(remove, duration);
      return remove;
    }

    function showModal({ title, bodyHtml, confirmText = '确定', cancelText = '取消', danger = false, onOpen }) {
      return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="modal-box">
            <div class="modal-head">
              <span>${escapeHtml(title)}</span>
              <button class="win-ctrl-btn" id="m-close-x" type="button">${ico('close', 13)}</button>
            </div>
            <div class="modal-body">${bodyHtml}</div>
            <div class="modal-foot">
              ${cancelText ? `<button class="btn" id="m-cancel" type="button">${escapeHtml(cancelText)}</button>` : ''}
              <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="m-ok" type="button">${escapeHtml(confirmText)}</button>
            </div>
          </div>`;
        root.classList.add('open');
        const close = (val) => {
          root.classList.remove('open');
          root.innerHTML = '';
          resolve(val);
        };
        const okBtn = root.querySelector('#m-ok');
        const cancelBtn = root.querySelector('#m-cancel');
        root.querySelector('#m-close-x').onclick = () => close(false);
        if (cancelBtn) cancelBtn.onclick = () => close(false);
        okBtn.onclick = () => close(true);
        root.onclick = (e) => { if (e.target === root) close(false); };
        if (onOpen) onOpen(root, close);
      });
    }

    /* =====================================================================
       BIDIRECTIONAL DRAG & DROP CACHE (STRICT SECTION 3.3 COMPLIANCE)
       - Preloads file data on mouseenter/mousedown (NEVER async in dragstart!)
       - Sets BOTH dataTransfer.items.add(File) + DownloadURL (mime:name:url)
       - Delays URL.revokeObjectURL by >= 6000ms after dragend
       - Handles recursive webkitGetAsEntry() import with full readEntries loop
       ===================================================================== */
    const DragCache = {
      _map: new Map(), // path -> { file, url, mime, name, ts }
      _pending: new Set(),

      async prefetch(path) {
        if (!path || this._pending.has(path)) return;
        const cached = this._map.get(path);
        if (cached && (Date.now() - cached.ts < 8000)) return;
        this._pending.add(path);
        try {
          const st = await fs.stat(path);
          if (st.isDirectory || st.size > 60 * 1024 * 1024) return;
          const bytes = await fs.readFile(path);
          const name = basename(path);
          const mime = getMimeType(name);
          const file = new File([bytes], name, { type: mime, lastModified: st.mtime || Date.now() });
          const url = URL.createObjectURL(file);
          const prev = this._map.get(path);
          if (prev && prev.url) setTimeout(() => URL.revokeObjectURL(prev.url), 6500);
          this._map.set(path, { file, url, mime, name, ts: Date.now() });
        } catch (_) {
        } finally {
          this._pending.delete(path);
        }
      },

      getSync(path) {
        return this._map.get(path) || null;
      },

      scheduleRevoke(path) {
        const entry = this._map.get(path);
        if (!entry) return;
        this._map.delete(path);
        // Strictly wait at least 6 seconds (>5s requirement) before revoking Blob URL
        setTimeout(() => {
          try { URL.revokeObjectURL(entry.url); } catch (_) {}
        }, 6500);
      }
    };

    // Synchronous dragstart payload helper (ZERO await!)
    function populateDragTransferSync(e, paths, meta = {}) {
      const arr = Array.isArray(paths) ? paths : [paths];
      try {
        e.dataTransfer.effectAllowed = 'copyMove';
        e.dataTransfer.setData('application/x-xuanyuan-vfs', JSON.stringify({ paths: arr, ...meta }));
        e.dataTransfer.setData('text/plain', arr.join('\n'));
      } catch (_) {}

      // Attach real file for OS drag-out using BOTH items.add + DownloadURL
      if (arr.length === 1) {
        const cached = DragCache.getSync(arr[0]);
        if (cached) {
          try {
            if (e.dataTransfer.items && typeof e.dataTransfer.items.add === 'function') {
              e.dataTransfer.items.add(cached.file);
            }
          } catch (_) {}
          try {
            const safeName = cached.name.replace(/:/g, '_');
            e.dataTransfer.setData('DownloadURL', `${cached.mime}:${safeName}:${cached.url}`);
          } catch (_) {}
        }
      }
    }

    function triggerBrowserDownload(data, filename, mime = 'application/octet-stream') {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 6000);
    }

    // Reverse Import (Physical Desktop -> VFS) using webkitGetAsEntry() + full readEntries() loop
    async function importDataTransferToDir(dataTransfer, targetDir) {
      const items = dataTransfer.items ? Array.from(dataTransfer.items) : [];
      const entries = [];
      for (const item of items) {
        if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
          const ent = item.webkitGetAsEntry();
          if (ent) entries.push(ent);
        }
      }

      let importedCount = 0;

      const readAllDirEntries = (dirEntry) => new Promise((resolve, reject) => {
        const reader = dirEntry.createReader();
        const all = [];
        const nextBatch = () => {
          reader.readEntries((batch) => {
            if (!batch || batch.length === 0) resolve(all);
            else { all.push(...batch); nextBatch(); }
          }, reject);
        };
        nextBatch();
      });

      const writeEntryRecursive = async (entry, destDir) => {
        if (entry.isFile) {
          const file = await new Promise((res, rej) => entry.file(res, rej));
          const ab = await file.arrayBuffer(); // Strictly ArrayBuffer, NEVER Buffer.from()
          const outPath = await fs.uniquePath(destDir, file.name);
          await fs.writeFile(outPath, new Uint8Array(ab), { mtime: file.lastModified || Date.now() });
          importedCount++;
        } else if (entry.isDirectory) {
          const outDir = await fs.uniquePath(destDir, entry.name);
          await fs.mkdir(outDir, { recursive: true, mtime: Date.now() });
          const children = await readAllDirEntries(entry);
          for (const child of children) {
            await writeEntryRecursive(child, outDir);
          }
          importedCount++;
        }
      };

      if (entries.length > 0) {
        for (const ent of entries) {
          await writeEntryRecursive(ent, targetDir);
        }
      } else if (dataTransfer.files && dataTransfer.files.length > 0) {
        for (const file of Array.from(dataTransfer.files)) {
          const ab = await file.arrayBuffer();
          const outPath = await fs.uniquePath(targetDir, file.name);
          await fs.writeFile(outPath, new Uint8Array(ab), { mtime: file.lastModified || Date.now() });
          importedCount++;
        }
      }
      return importedCount;
    }

    async function uploadViaFileInput(targetDir) {

      inp.value = '';
      return new Promise((resolve) => {
        inp.onchange = async () => {

          for (const f of files) {
            const ab = await f.arrayBuffer();
            const outPath = await fs.uniquePath(targetDir, f.name);
            await fs.writeFile(outPath, new Uint8Array(ab), { mtime: f.lastModified || Date.now() });
            count++;

          resolve(count);
        };
        inp.click();
      });
