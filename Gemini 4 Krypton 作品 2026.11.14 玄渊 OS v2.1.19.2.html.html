<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>玄渊 OS — 网页桌面操作系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================================
       玄渊 OS (XuanYuan OS) — Obsidian Brass & Architectural Glass Design
       ===================================================================== */
    :root {
      --font-sans: 'Instrument Sans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;

      /* Accent & Customizable Tokens */
      --accent: #e09f42;
      --accent-hover: #edb35c;
      --accent-soft: rgba(224, 159, 66, 0.16);
      --accent-glow: rgba(224, 159, 66, 0.34);
      --accent-contrast: #120f0a;

      --win-radius: 10px;
      --ctrl-radius: 6px;
      --glass-blur: 22px;
      --glass-opacity: 0.84;

      /* Semantic Colors - Dark (Default: 曜石暗境) */
      --bg-base: #0b0d12;
      --bg-elevated: #121620;
      --bg-surface: rgba(17, 21, 30, var(--glass-opacity));
      --bg-surface-solid: #141923;
      --bg-surface-2: #1a202d;
      --bg-surface-3: #222a3a;
      --bg-hover: rgba(255, 255, 255, 0.065);
      --bg-active: rgba(255, 255, 255, 0.11);
      --bg-input: #0e121a;

      --text-primary: #eceef4;
      --text-secondary: #9ba4b8;
      --text-muted: #687287;
      --text-desktop: #f3f5f9;
      --text-desktop-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.65);

      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.17);
      --border-window: rgba(255, 255, 255, 0.12);
      --border-window-active: rgba(224, 159, 66, 0.45);

      --shadow-win: 0 22px 60px rgba(0, 0, 0, 0.58), 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-win-active: 0 28px 75px rgba(0, 0, 0, 0.72), 0 0 0 1px var(--border-window-active);
      --shadow-popup: 0 18px 48px rgba(0, 0, 0, 0.62);

      --danger: #e5534b;
      --danger-soft: rgba(229, 83, 75, 0.18);
      --success: #3fb984;
      --success-soft: rgba(63, 185, 132, 0.16);
      --warning: #e5a93c;
      --info: #4b9ce2;

      --taskbar-h: 48px;
      --titlebar-h: 38px;
      --grid-w: 92px;
      --grid-h: 98px;
    }

    /* Light Mode (宣纸晨光 — Handcrafted Warm Alabaster, NOT invert!) */
    html[data-theme="light"] {
      --bg-base: #e9e5dc;
      --bg-elevated: #f5f2eb;
      --bg-surface: rgba(248, 246, 241, 0.88);
      --bg-surface-solid: #f7f5ef;
      --bg-surface-2: #ede9df;
      --bg-surface-3: #e1dcd0;
      --bg-hover: rgba(20, 24, 34, 0.06);
      --bg-active: rgba(20, 24, 34, 0.11);
      --bg-input: #ffffff;

      --text-primary: #1a1d24;
      --text-secondary: #525969;
      --text-muted: #7f8696;
      --text-desktop: #f8f9fb;
      --text-desktop-shadow: 0 1px 4px rgba(0, 0, 0, 0.78), 0 0 10px rgba(0, 0, 0, 0.45);

      --border: rgba(20, 24, 34, 0.10);
      --border-strong: rgba(20, 24, 34, 0.18);
      --border-window: rgba(20, 24, 34, 0.13);
      --border-window-active: var(--accent);

      --shadow-win: 0 18px 46px rgba(24, 28, 38, 0.14), 0 2px 8px rgba(24, 28, 38, 0.08);
      --shadow-win-active: 0 26px 64px rgba(24, 28, 38, 0.22), 0 0 0 1px var(--accent);
      --shadow-popup: 0 16px 40px rgba(24, 28, 38, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-base);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    input, textarea, select, [contenteditable="true"] {
      user-select: text;
      font-family: inherit;
      color: inherit;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 1.5px solid var(--accent);
      outline-offset: 1px;
    }

    svg.ico {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(130, 142, 165, 0.28);
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(130, 142, 165, 0.5); background-clip: content-box; }

    /* =====================================================================
       Wallpaper Atmosphere Layer
       ===================================================================== */
    #wallpaper-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: #0b0d12;
      transition: background 0.5s ease;
    }

    /* Built-in Aesthetic Wallpapers */
    #wallpaper-layer.wp-obsidian-gold {
      background:
        radial-gradient(ellipse 85% 60% at 18% 82%, rgba(224, 159, 66, 0.22), transparent 62%),
        radial-gradient(ellipse 70% 55% at 82% 20%, rgba(45, 110, 145, 0.24), transparent 58%),
        radial-gradient(circle at 50% 48%, rgba(28, 35, 50, 0.72), transparent 72%),
        linear-gradient(145deg, #090b10 0%, #101521 48%, #0c0e14 100%);
    }
    #wallpaper-layer.wp-obsidian-gold::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, black 25%, transparent 100%);
    }

    #wallpaper-layer.wp-jade-mist {
      background:
        radial-gradient(ellipse 90% 65% at 75% 78%, rgba(46, 196, 182, 0.24), transparent 62%),
        radial-gradient(ellipse 65% 50% at 22% 18%, rgba(21, 94, 117, 0.34), transparent 60%),
        linear-gradient(160deg, #061014 0%, #0a1b22 50%, #071117 100%);
    }

    #wallpaper-layer.wp-vermilion-dusk {
      background:
        radial-gradient(ellipse 80% 55% at 72% 26%, rgba(229, 83, 75, 0.25), transparent 60%),
        radial-gradient(ellipse 75% 60% at 24% 80%, rgba(224, 145, 66, 0.22), transparent 60%),
        linear-gradient(135deg, #120b0d 0%, #1d1216 48%, #0e0c11 100%);
    }

    #wallpaper-layer.wp-ink-topo {
      background:
        radial-gradient(circle at 30% 30%, rgba(120, 148, 195, 0.16), transparent 55%),
        radial-gradient(circle at 75% 70%, rgba(200, 165, 110, 0.12), transparent 52%),
        repeating-radial-gradient(circle at 60% 45%, rgba(255,255,255,0.025) 0 1px, transparent 1px 38px),
        linear-gradient(180deg, #0b0e14 0%, #121722 100%);
    }

    #wallpaper-layer.wp-alabaster-paper {
      background:
        radial-gradient(ellipse 80% 60% at 20% 25%, rgba(224, 159, 66, 0.20), transparent 58%),
        radial-gradient(ellipse 75% 60% at 85% 75%, rgba(75, 136, 162, 0.20), transparent 58%),
        linear-gradient(145deg, #dcd5c8 0%, #cec6b7 52%, #bfb7a7 100%);
    }

    #wallpaper-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #wallpaper-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.34) 100%);
    }

    /* =====================================================================
       Desktop Workspace & Free Grid Icons
       ===================================================================== */
    #desktop {
      position: fixed;
      inset: 0 0 var(--taskbar-h) 0;
      z-index: 1;
      overflow: hidden;
      animation: desktopReveal 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes desktopReveal {
      from { opacity: 0; transform: scale(1.012); }
      to { opacity: 1; transform: scale(1); }
    }

    #desktop.drag-over-external::after {
      content: '释放文件或文件夹以导入到桌面';
      position: absolute;
      inset: 14px;
      border: 2px dashed var(--accent);
      border-radius: 14px;
      background: rgba(12, 16, 24, 0.56);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-hover);
      pointer-events: none;
      z-index: 500;
      letter-spacing: 0.04em;
    }

    .desktop-icon {
      position: absolute;
      width: 84px;
      min-height: 86px;
      padding: 8px 4px 6px;
      border-radius: var(--ctrl-radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      touch-action: none;
      border: 1px solid transparent;
      transition: left 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
      will-change: left, top;
    }

    .desktop-icon.dragging-touch {
      transition: none !important;
      z-index: 400;
      opacity: 0.88;
      transform: scale(1.06);
      pointer-events: none;
    }

    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .desktop-icon.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .desktop-icon.drop-target {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: scale(1.06);
    }

    .desktop-icon-glyph {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(16, 20, 30, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.32);
      color: var(--text-desktop);
      font-size: 24px;
      overflow: hidden;
      pointer-events: none;
    }

    .desktop-icon-glyph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .desktop-icon-label {
      width: 100%;
      text-align: center;
      font-size: 11.5px;
      line-height: 1.3;
      color: var(--text-desktop);
      text-shadow: var(--text-desktop-shadow);
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      pointer-events: none;
      font-weight: 500;
    }

    /* Adaptive Marquee Selection Box */
    .marquee-rect {
      position: absolute;
      pointer-events: none !important;
      z-index: 450;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 2px;
      display: none;
    }

    /* =====================================================================
       Windows Layer, 8-Way Resize, Aero Snap, Aero Peek
       ===================================================================== */
    #windows-layer {
      position: fixed;
      inset: 0 0 var(--taskbar-h) 0;
      z-index: 10;
      pointer-events: none;
    }

    #windows-layer.aero-peek-active .os-window:not(.peek-highlight) {
      opacity: 0.12 !important;
      filter: blur(1px);
      background: rgba(255,255,255,0.04) !important;
      pointer-events: none !important;
    }

    #snap-preview {
      position: fixed;
      z-index: 9000;
      pointer-events: none;
      border-radius: var(--win-radius);
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: scale(0.97);
      transition: opacity 0.15s ease, transform 0.15s ease, left 0.12s ease, top 0.12s ease, width 0.12s ease, height 0.12s ease;
    }
    #snap-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    .os-window {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border-window);
      border-radius: var(--win-radius);
      box-shadow: var(--shadow-win);
      overflow: hidden;
      min-width: 280px;
      min-height: 200px;
      animation: winOpen 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      transition: opacity 0.18s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    @keyframes winOpen {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .os-window.active {
      border-color: var(--border-window-active);
      box-shadow: var(--shadow-win-active);
    }

    .os-window.maximized {
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
      border-left: none;
      border-right: none;
      border-top: none;
    }

    .os-window.minimized {
      opacity: 0;
      transform: scale(0.9) translateY(24px);
      pointer-events: none;
      visibility: hidden;
    }

    .os-window.snapping {
      transition: left 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fullscreen Immersion for Manga Viewer & Apps */
    .os-window.os-immersive-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 99999 !important;
      background: #000 !important;
    }
    .os-window.os-immersive-fullscreen > .win-titlebar,
    .os-window.os-immersive-fullscreen > .win-resize-handle {
      display: none !important;
    }

    .win-titlebar {
      height: var(--titlebar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      cursor: default;
      touch-action: none;
      gap: 8px;
    }

    .win-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      pointer-events: none;
    }

    .win-title-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 16px;
      flex-shrink: 0;
    }

    .win-title-text {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    /* Architectural Geometric Window Controls (NO macOS traffic lights!) */
    .win-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-ctrl-btn {
      width: 34px;
      height: 26px;
      border-radius: calc(var(--ctrl-radius) - 1px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 13px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .win-ctrl-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .win-ctrl-btn.close:hover {
      background: var(--danger);
      color: #fff;
    }

    .win-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-surface-solid);
    }

    /* 8-Way Resize Handles */
    .win-resize-handle { position: absolute; z-index: 30; }
    .os-window.maximized .win-resize-handle { display: none; }
    .rh-n  { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .rh-s  { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .rh-e  { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .rh-w  { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .rh-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .rh-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .rh-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .rh-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

    /* =====================================================================
       Taskbar, System Tray, Aero Peek Strip & Mobile Dock
       ===================================================================== */
    #taskbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-h);
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 8px;
      background: var(--bg-surface);
      backdrop-filter: blur(calc(var(--glass-blur) + 6px));
      -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 6px));
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    .tb-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #btn-start {
      height: 36px;
      padding: 0 12px;
      border-radius: var(--ctrl-radius);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      transition: all 0.16s ease;
    }
    #btn-start:hover, #btn-start.open {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    #tb-apps {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    #tb-apps::-webkit-scrollbar { display: none; }

    .tb-app-item {
      position: relative;
      height: 36px;
      max-width: 170px;
      min-width: 40px;
      padding: 0 10px;
      border-radius: var(--ctrl-radius);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-secondary);
      border: 1px solid transparent;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .tb-app-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .tb-app-item.running::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 2.5px;
      border-radius: 2px;
      background: var(--text-muted);
      transition: all 0.15s ease;
    }
    .tb-app-item.active {
      background: var(--bg-active);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .tb-app-item.active::after {
      width: 24px;
      background: var(--accent);
    }
    .tb-app-item.minimized { opacity: 0.7; }
    .tb-app-item .tb-app-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tb-app-close {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .tb-app-item:hover .tb-app-close { display: flex; }
    .tb-app-close:hover { background: var(--danger); color: #fff; }

    .tb-right {
      display: flex;
      align-items: center;
      height: 100%;
      flex-shrink: 0;
    }

    .tb-tray-btn {
      height: 36px;
      min-width: 34px;
      padding: 0 8px;
      border-radius: var(--ctrl-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text-secondary);
      font-size: 13px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .tb-tray-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

    #tb-clock-btn {
      height: 38px;
      padding: 0 10px;
      border-radius: var(--ctrl-radius);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      line-height: 1.22;
      font-variant-numeric: tabular-nums;
      transition: background 0.14s ease;
    }
    #tb-clock-btn:hover { background: var(--bg-hover); }
    #tb-time { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    #tb-date { font-size: 10.5px; color: var(--text-secondary); }

    /* Aero Peek Strip at Far Right */
    #aero-peek-strip {
      width: 10px;
      height: 100%;
      margin-left: 6px;
      border-left: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.02);
      transition: background 0.15s ease;
    }
    #aero-peek-strip:hover {
      background: var(--accent-soft);
      border-left-color: var(--accent);
    }

    /* Taskbar Aero Peek Hover Preview Popup */
    #peek-preview {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 8px);
      z-index: 6500;
      width: 220px;
      padding: 10px;
      border-radius: var(--win-radius);
      background: var(--bg-surface);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popup);
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: popUp 0.14s ease;
    }
    #peek-preview.visible { display: flex; }

    /* =====================================================================
       Start Menu, Calendar Popover, Context Menu, Modals, Toasts
       ===================================================================== */
    @keyframes popUp {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #start-menu {
      position: fixed;
      left: 8px;
      bottom: calc(var(--taskbar-h) + 8px);
      width: 440px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - var(--taskbar-h) - 24px);
      z-index: 6000;
      border-radius: calc(var(--win-radius) + 2px);
      background: var(--bg-surface);
      backdrop-filter: blur(calc(var(--glass-blur) + 8px));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popup);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #start-menu.open { display: flex; }

    .start-header {
      padding: 14px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .start-search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      height: 34px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--ctrl-radius);
    }
    .start-search-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 12.5px;
    }

    .start-apps-grid {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      overflow-y: auto;
      max-height: 360px;
    }

    .start-app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 11px 6px;
      border-radius: var(--ctrl-radius);
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .start-app-tile:hover {
      background: var(--bg-hover);
      border-color: var(--border);
      transform: translateY(-1px);
    }
    .start-app-tile .tile-ico {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--accent);
    }
    .start-app-tile span {
      font-size: 11.5px;
      text-align: center;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .start-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Interactive Calendar Popover */
    #calendar-popover {
      position: fixed;
      right: 8px;
      bottom: calc(var(--taskbar-h) + 8px);
      width: 316px;
      max-width: calc(100vw - 16px);
      z-index: 6000;
      border-radius: calc(var(--win-radius) + 2px);
      background: var(--bg-surface);
      backdrop-filter: blur(calc(var(--glass-blur) + 8px));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popup);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: popUp 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #calendar-popover.open { display: flex; }

    .cal-clock-big {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }
    .cal-clock-sub {
      font-size: 12px;
      color: var(--accent);
      margin-top: 2px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }
    .cal-dow {
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 0;
      font-weight: 600;
    }
    .cal-day {
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      transition: background 0.12s ease;
    }
    .cal-day:hover { background: var(--bg-hover); }
    .cal-day.other-month { color: var(--text-muted); opacity: 0.45; }
    .cal-day.today {
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
    }
    .cal-day.selected-day:not(.today) {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
    }

    /* Context Menu */
    #context-menu {
      position: fixed;
      z-index: 9500;
      min-width: 204px;
      max-width: 280px;
      padding: 5px;
      border-radius: var(--win-radius);
      background: var(--bg-surface);
      backdrop-filter: blur(calc(var(--glass-blur) + 6px));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popup);
      display: none;
      flex-direction: column;
      gap: 2px;
      animation: ctxPop 0.12s ease;
    }
    @keyframes ctxPop {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    #context-menu.open { display: flex; }

    .ctx-item {
      width: 100%;
      padding: 7px 10px;
      border-radius: calc(var(--ctrl-radius) - 1px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-primary);
      text-align: left;
      transition: background 0.1s ease;
    }
    .ctx-item:hover:not(.disabled) { background: var(--accent-soft); color: var(--accent-hover); }
    .ctx-item.danger:hover:not(.disabled) { background: var(--danger-soft); color: var(--danger); }
    .ctx-item.disabled { opacity: 0.4; pointer-events: none; }
    .ctx-item-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .ctx-item-shortcut { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }
    .ctx-sub-wrap { position: relative; }
    .ctx-submenu {
      position: absolute;
      left: calc(100% + 4px);
      top: -4px;
      min-width: 185px;
      padding: 5px;
      border-radius: var(--win-radius);
      background: var(--bg-surface);
      backdrop-filter: blur(calc(var(--glass-blur) + 6px));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popup);
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .ctx-sub-wrap:hover > .ctx-submenu { display: flex; }

    /* Shared UI Primitives */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: var(--ctrl-radius);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
      color: var(--text-primary);
      transition: all 0.14s ease;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--bg-surface-3); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-contrast);
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger { background: var(--danger-soft); border-color: rgba(229,83,75,0.4); color: var(--danger); }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); }
    .btn-sm { height: 26px; padding: 0 8px; font-size: 11.5px; }
    .btn-active { background: var(--accent-soft) !important; border-color: var(--accent) !important; color: var(--accent-hover) !important; }

    .input-ctrl, .select-ctrl {
      height: 30px;
      padding: 0 9px;
      border-radius: var(--ctrl-radius);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
    }
    .input-ctrl:focus, .select-ctrl:focus { border-color: var(--accent); }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      animation: spin 0.72s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dark-load-mask {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: #0d1017;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #c8d0e0;
      font-size: 12.5px;
      transition: opacity 0.22s ease;
    }
    .dark-load-mask.hidden { opacity: 0; pointer-events: none; }

    /* Modals & Toasts */
    #modal-root {
      position: fixed;
      inset: 0;
      z-index: 9800;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.58);
      backdrop-filter: blur(6px);
      padding: 16px;
    }
    #modal-root.open { display: flex; }
    .modal-box {
      width: 420px;
      max-width: 100%;
      border-radius: calc(var(--win-radius) + 2px);
      background: var(--bg-surface-solid);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-popup);
      overflow: hidden;
      animation: popUp 0.16s ease;
    }
    .modal-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 13.5px;
    }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
    .modal-foot {
      padding: 11px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: var(--bg-surface-2);
    }

    #toast-root {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9950;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: min(360px, calc(100vw - 28px));
    }
    .toast-item {
      pointer-events: auto;
      padding: 10px 14px;
      border-radius: var(--ctrl-radius);
      background: var(--bg-surface);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-strong);
      border-left: 3px solid var(--accent);
      box-shadow: var(--shadow-popup);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-primary);
      animation: toastIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .toast-item.error { border-left-color: var(--danger); }
    .toast-item.success { border-left-color: var(--success); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* =====================================================================
       File Explorer (Windows Accurate Details View + 4 Views + Tree Nav)
       ===================================================================== */
    .exp-root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .exp-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface-2);
      flex-shrink: 0;
    }
    .exp-nav-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface-solid);
      flex-shrink: 0;
    }
    .exp-breadcrumbs {
      flex: 1;
      min-width: 0;
      height: 28px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--ctrl-radius);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .exp-breadcrumbs::-webkit-scrollbar { display: none; }
    .exp-crumb {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .exp-crumb:hover { background: var(--bg-hover); color: var(--text-primary); }
    .exp-crumb.current { color: var(--text-primary); font-weight: 600; }
    .exp-crumb-sep { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }

    .exp-search-box {
      width: 210px;
      max-width: 42%;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 6px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--ctrl-radius);
    }
    .exp-search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      outline: none;
      font-size: 12px;
    }

    .exp-main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .exp-sidebar {
      width: 212px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--bg-elevated);
      overflow-y: auto;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .exp-side-section-title {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 2px 8px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .exp-tree-node {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 6px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }
    .exp-tree-node:hover { background: var(--bg-hover); color: var(--text-primary); }
    .exp-tree-node.active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }
    .exp-tree-toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.14s ease;
    }
    .exp-tree-toggle.expanded { transform: rotate(90deg); }
    .exp-tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    .exp-content-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-surface-solid);
    }

    /* Windows Explorer Accurate Details View:
       Left-aligned sequential columns, NEVER stretched to right edge!
       Right empty space is background marquee selection canvas! */
    .exp-viewport {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: auto;
      background: var(--bg-surface-solid);
    }
    .exp-viewport.marquee-touch-mode { touch-action: none; }

    .exp-details-header-bar {
      position: sticky;
      top: 0;
      z-index: 12;
      min-width: 100%;
      width: max-content;
      background: var(--bg-surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      height: 30px;
    }
    .exp-details-header-cols {
      display: flex;
      align-items: stretch;
      flex: 0 0 auto;
    }
    .exp-col-head {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      border-right: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .exp-col-head:hover { background: var(--bg-hover); color: var(--text-primary); }
    .exp-col-head.drag-over-col { box-shadow: inset 2px 0 0 var(--accent); }
    .exp-col-resizer {
      position: absolute;
      right: -3px;
      top: 0;
      bottom: 0;
      width: 8px;
      cursor: col-resize;
      z-index: 5;
      touch-action: none;
    }
    .exp-col-resizer:hover::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--accent);
    }

    /* Rows strictly take ONLY the sum of column widths, NOT 100%! */
    .exp-details-rows {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 4px 0 48px 0;
      min-width: 0;
    }
    .exp-detail-row {
      display: flex;
      align-items: center;
      height: 30px;
      border-radius: 4px;
      margin: 1px 0;
      cursor: pointer;
      border: 1px solid transparent;
      flex: 0 0 auto;
      touch-action: manipulation;
    }
    .exp-detail-row:hover { background: var(--bg-hover); }
    .exp-detail-row.selected {
      background: var(--accent-soft);
      border-color: rgba(224, 159, 66, 0.45);
    }
    .exp-detail-row.drop-target {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .exp-cell {
      flex: 0 0 auto;
      padding: 0 10px;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-secondary);
    }
    .exp-cell.col-name { color: var(--text-primary); font-weight: 500; }
    .exp-cell.col-size, .exp-cell.col-mtime { font-family: var(--font-mono); font-size: 11.5px; }

    /* Icons View */
    .exp-icons-grid {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px;
      padding: 14px 14px 56px;
      min-height: 100%;
    }
    .exp-icon-card {
      width: 96px;
      padding: 8px 6px;
      border-radius: var(--ctrl-radius);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .exp-icon-card:hover { background: var(--bg-hover); }
    .exp-icon-card.selected { background: var(--accent-soft); border-color: var(--accent); }
    .exp-icon-card.drop-target { background: var(--accent-soft); border-color: var(--accent); }
    .exp-thumb-box {
      width: 58px;
      height: 58px;
      border-radius: 8px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
      color: var(--accent);
    }
    .exp-thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    .exp-icon-name {
      width: 100%;
      font-size: 11.5px;
      text-align: center;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* List View */
    .exp-list-wrap {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 3px 12px;
      padding: 10px;
      height: 100%;
    }
    .exp-list-item {
      width: 210px;
      height: 28px;
      padding: 0 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .exp-list-item:hover { background: var(--bg-hover); }
    .exp-list-item.selected { background: var(--accent-soft); border-color: var(--accent); }
    .exp-list-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Miller Columns View (分栏视图) */
    .exp-columns-wrap {
      display: flex;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .exp-miller-col {
      width: 224px;
      flex-shrink: 0;

      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;

    .exp-miller-item {

      align-items: center;
      gap: 7px;
      padding: 6px 8px;

    .exp-miller-item.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hover); }

      height: 26px;
      padding: 0 10px;

      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);

    .ide-root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .ide-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface-2);
      flex-shrink: 0;
    }
    .ide-findbar {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ide-findbar.open { display: flex; }
    .ide-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .ide-workspace.dir-vertical { flex-direction: column; }
    .ide-pane-code {
      flex: 1 1 50%;
      min-width: 120px;
      min-height: 100px;
      position: relative;
      overflow: hidden;
      background: #1b1e26;
    }
    .ide-pane-code .CodeMirror {
      height: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 13px;
      line-height: 1.55;
    }
    .ide-splitter {
      flex: 0 0 6px;
      background: var(--bg-surface-2);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      cursor: col-resize;
      touch-action: none;
      position: relative;
      z-index: 5;
    }
    .ide-splitter:hover, .ide-splitter.dragging { background: var(--accent); }
    .ide-workspace.dir-vertical .ide-splitter {
      cursor: row-resize;
      border-left: none;
      border-right: none;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .ide-pane-preview {
      flex: 1 1 50%;
      min-width: 120px;
      min-height: 100px;
      position: relative;
      background: #0d1017;
      overflow: hidden;
    }
    .ide-pane-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
    .ide-statusbar {
      height: 26px;
      padding: 0 10px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* =====================================================================
       Webtoon Manga Viewer — Strict Seamless Scroll & Fullscreen Standard
       ===================================================================== */
    .manga-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
      background: #000000;
      position: relative;
      overscroll-behavior-y: none;
      contain: layout style;
    }
    .manga-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: #0c0e13;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #e8ecf4;
      flex-shrink: 0;
      z-index: 10;
    }
    .manga-scroller {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #000000;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      touch-action: pan-y;
      contain: layout style;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      position: relative;
    }
    .manga-scroller.grabbing { cursor: grabbing; }
    .manga-strip {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0;
    }
    .manga-page-slot {
      width: min(100%, 880px);
      min-height: 480px;
      background: #0a0a0c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
    }
    .manga-page-slot.loaded {
      min-height: 0;
      background: #000;
    }
    .manga-page-slot img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .manga-skeleton-label {
      color: #555c6e;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .manga-fs-exit {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100005;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 17, 22, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      backdrop-filter: blur(8px);
      opacity: 0.42;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    .manga-fs-exit:hover { opacity: 1; background: rgba(229, 83, 75, 0.85); color: #fff; }
    .manga-root.is-fullscreen .manga-toolbar { display: none !important; }
    .manga-root.is-fullscreen .manga-fs-exit { display: flex !important; }

    /* =====================================================================
       Spreadsheet, Settings, Calculator, Paint, V86, Media, Terminal
       ===================================================================== */
    .csv-table-wrap { flex: 1; overflow: auto; background: var(--bg-surface-solid); }
    .csv-table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
    .csv-table th, .csv-table td {
      border: 1px solid var(--border);
      padding: 5px 9px;
      min-width: 90px;
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .csv-table th {
      position: sticky;
      top: 0;
      background: var(--bg-surface-2);
      font-weight: 600;
      text-align: left;
      z-index: 2;
      cursor: pointer;

    .csv-table td:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--bg-input); overflow: visible; }

      width: 42px !important;
      min-width: 42px !important;

      color: var(--text-muted);
      background: var(--bg-elevated);
      font-family: var(--font-mono);
      font-size: 11px;

    .settings-layout { display: flex; height: 100%; min-height: 0; }
    .settings-nav {
      width: 196px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    .settings-nav-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--ctrl-radius);
      font-size: 12.5px;
      color: var(--text-secondary);
      text-align: left;
      transition: all 0.14s ease;
    }
    .settings-nav-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .settings-nav-btn.active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }
    .settings-panel { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 18px; }
    .settings-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--win-radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .settings-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .settings-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      border-radius: 99px;
      background: var(--bg-surface-3);
      border: 1px solid var(--border-strong);
      cursor: pointer;
      transition: background 0.18s ease;
      flex-shrink: 0;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .switch.on { background: var(--accent); border-color: var(--accent); }
    .switch.on::after { transform: translateX(18px); }

    /* Storage Stacked Bar */
    .storage-bar {
      height: 14px;
      border-radius: 99px;
      background: var(--bg-surface-3);
      overflow: hidden;
      display: flex;
      border: 1px solid var(--border);
    }
    .storage-seg { height: 100%; transition: width 0.35s ease; }

    /* Calculator */
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; flex: 1; }
    .calc-grid.sci { grid-template-columns: repeat(5, 1fr); }
    .calc-key {
      border-radius: var(--ctrl-radius);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s ease, transform 0.08s ease;
      min-height: 40px;
    }
    .calc-key:hover { background: var(--bg-surface-3); }
    .calc-key:active { transform: scale(0.96); }
    .calc-key.op { background: var(--bg-elevated); color: var(--accent-hover); font-weight: 600; }
    .calc-key.eq { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 700; }

    /* V86 Screen Container */
    .v86-stage {
      flex: 1;
      min-height: 0;
      background: #050608;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      padding: 10px;
    }
    .v86-screen-container {
      background: #000;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      color: #c8f0d4;
      cursor: crosshair;
      max-width: 100%;
    }
    .v86-screen-container canvas { max-width: 100%; height: auto; display: block; }

    /* Terminal */
    .term-wrap {
      flex: 1;
      min-height: 0;
      background: #0a0d12;
      color: #d8e1f0;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.55;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
    }
    .term-line { white-space: pre-wrap; word-break: break-all; }
    .term-input-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .term-prompt { color: var(--accent); font-weight: 600; flex-shrink: 0; }
    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12.5px;
    }

    /* =====================================================================
       Responsive Mobile & Tablet Adaptation (Bottom Dock & Touch Ergonomics)
       ===================================================================== */
    @media (max-width: 768px) {
      :root {
        --taskbar-h: 58px;
        --titlebar-h: 44px;
        --grid-w: 84px;
        --grid-h: 92px;
      }

      #taskbar {
        padding: 0 10px;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        height: calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px));
        border-radius: 16px 16px 0 0;
      }
      #btn-start span.start-label { display: none; }
      #btn-start { width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 12px; }
      .tb-app-item { height: 42px; padding: 0 10px; border-radius: 11px; }
      .tb-app-item .tb-app-title { max-width: 78px; }
      #aero-peek-strip { display: none; }
      .tb-hide-mobile { display: none !important; }

      .os-window {
        min-width: 100% !important;
        border-radius: 0 !important;
      }
      .os-window:not(.mobile-floating) {
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }
      .win-ctrl-btn { width: 38px; height: 32px; }

      .exp-sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 30;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: var(--shadow-popup);
      }
      .exp-sidebar.mobile-open { transform: translateX(0); }

      .settings-layout { flex-direction: column; }
      .settings-nav {
        width: 100%;
        flex-direction: row;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        padding: 6px;
      }
      .settings-nav-btn { white-space: nowrap; flex-shrink: 0; }
      .settings-panel { padding: 14px; }

      #start-menu {
        left: 8px;
        right: 8px;
        width: auto;
        bottom: calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px) + 8px);
      }
      .start-apps-grid { grid-template-columns: repeat(3, 1fr); }
    }

    const _natCollator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
    function naturalCompare(a, b) {
      const sa = String(a || ''), sb = String(b || '');
      const re = /(\d+)|(\D+)/g;
      const ta = sa.match(re) || [], tb = sb.match(re) || [];
      const len = Math.min(ta.length, tb.length);
      for (let i = 0; i < len; i++) {
        if (ta[i] === tb[i]) continue;
        const na = /^\d+$/.test(ta[i]), nb = /^\d+$/.test(tb[i]);
        if (na && nb) {
          const diff = Number(ta[i]) - Number(tb[i]);
          if (diff !== 0) return diff;
          if (ta[i].length !== tb[i].length) return ta[i].length - tb[i].length;
        } else {
          const c = _natCollator.compare(ta[i], tb[i]);
          if (c !== 0) return c;
        }
      }
      return ta.length - tb.length;
    }

    function normalizePath(p) {
      if (!p) return '/';
      let s = String(p).replace(/\\/g, '/').replace(/\/+/g, '/');
      if (!s.startsWith('/')) s = '/' + s;
      const parts = [];
      for (const seg of s.split('/')) {
        if (!seg || seg === '.') continue;
        if (seg === '..') parts.pop();
        else parts.push(seg);
      }
      return '/' + parts.join('/');
    }
    function dirname(p) {
      const n = normalizePath(p);
      if (n === '/') return '/';
      const idx = n.lastIndexOf('/');
      return idx <= 0 ? '/' : n.slice(0, idx);
    }
    function basename(p) {
      const n = normalizePath(p);

    function formatBytes(bytes) {
      if (bytes == null || isNaN(bytes)) return '--';
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(Math.abs(bytes)) / Math.log(1024)), units.length - 1);
      const val = bytes / Math.pow(1024, i);
      return (i === 0 ? val : val.toFixed(val >= 100 ? 0 : val >= 10 ? 1 : 2)) + ' ' + units[i];

        try {
          const prefix = encodeURIComponent('xy_' + key) + '=';
          for (const part of document.cookie.split(';')) {
            const p = part.trim();
            if (p.startsWith(prefix)) return decodeURIComponent(p.slice(prefix.length));
          }
        } catch (_) {}
        return null;

          link.onerror = () => resolve();
          document.head.appendChild(link);
        });
      },

      loadScript(src, fallbackSrc) {
        if (this._scripts.has(src)) return this._scripts.get(src);
        const p = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => {
            if (fallbackSrc) {
              const s2 = document.createElement('script');
              s2.src = fallbackSrc;
              s2.async = true;
              s2.onload = () => resolve();
              s2.onerror = () => reject(new Error('CDN 加载失败: ' + src));
              document.head.appendChild(s2);
            } else {
              reject(new Error('CDN 加载失败: ' + src));
            }
          };
          document.head.appendChild(s);
        });
        this._scripts.set(src, p);
        return p;
      },
