                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
              </select>
            </div>

      const canvas = win.body.querySelector('[data-id="spectrum"]');
      const ctx = canvas.getContext('2d');

      const startSpectrum = () => {
        try {
          if (!state.audioCtx) {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const src = state.audioCtx.createMediaElementSource(audioEl);
            state.analyser = state.audioCtx.createAnalyser();
            state.analyser.fftSize = 128;
            src.connect(state.analyser);
            state.analyser.connect(state.audioCtx.destination);
          }
          if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
          const data = new Uint8Array(state.analyser.frequencyBinCount);
          const draw = () => {
            state.raf = requestAnimationFrame(draw);
            state.analyser.getByteFrequencyData(data);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barW = canvas.width / data.length;
            const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e09f42';
            for (let i = 0; i < data.length; i++) {
              const h = (data[i] / 255) * (canvas.height - 16);
              ctx.fillStyle = accent;
              ctx.fillRect(i * barW + 1, canvas.height - h - 6, Math.max(2, barW - 3), h);
            }
          };
          if (!state.raf) draw();
        } catch (_) {}
      };
      audioEl.addEventListener('play', startSpectrum);

      const loadMedia = async (fp) => {
        if (!fp) return;
        state.curPath = normalizePath(fp);
        try {
          const bytes = await fs.readFile(state.curPath);
          const url = URL.createObjectURL(new Blob([bytes], { type: getMimeType(state.curPath) }));
          if (state.blobUrl) URL.revokeObjectURL(state.blobUrl);
          state.blobUrl = url;
          emptyEl.style.display = 'none';
          const isVid = VIDEO_EXTS.has(extname(state.curPath));
          if (isVid) {
            audioUI.style.display = 'none';
            videoEl.style.display = 'block';
            videoEl.src = url;
            videoEl.play().catch(() => {});
          } else {
            videoEl.style.display = 'none';
            audioUI.style.display = 'flex';
            win.body.querySelector('[data-id="track-name"]').textContent = basename(state.curPath);
            audioEl.src = url;

      win.body.querySelector('[data-id="rate"]').onchange = (e) => {

      win.onClose = () => {
        if (state.raf) cancelAnimationFrame(state.raf);
        if (state.audioCtx) state.audioCtx.close().catch(() => {});
        videoEl.pause(); audioEl.pause();
        if (state.blobUrl) URL.revokeObjectURL(state.blobUrl);

    /* -------------------- 11. CALCULATOR -------------------- */
    function launchCalculator() {
      const win = WM.create({
        appId: 'calc',
        title: '计算器',
        icon: 'calc',
        width: 340,
        height: 490,
        minW: 290,
        minH: 420
      });

      const state = { expr: '', display: '0', sci: false, history: [] };

      win.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;background:var(--bg-surface-solid);">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);">
            <button class="btn btn-sm" data-act="toggle-sci"><span>标准 / 科学</span></button>
            <button class="btn btn-sm btn-ghost" data-act="clear-hist"><span>清空历史</span></button>
          </div>
          <div style="padding:12px 16px 8px;text-align:right;background:var(--bg-elevated);border-bottom:1px solid var(--border);">
            <div data-id="hist" style="font-size:11px;color:var(--text-muted);min-height:16px;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
            <div data-id="expr" style="font-size:13px;color:var(--text-secondary);min-height:20px;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
            <div data-id="disp" style="font-size:32px;font-weight:700;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);">0</div>
          </div>
          <div class="calc-grid" data-id="grid"></div>
        </div>`;

      const dispEl = win.body.querySelector('[data-id="disp"]');
      const exprEl = win.body.querySelector('[data-id="expr"]');
      const histEl = win.body.querySelector('[data-id="hist"]');
      const gridEl = win.body.querySelector('[data-id="grid"]');

      const safeEval = (str) => {
        const cleaned = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'Math.PI').replace(/\^/g, '**')
          .replace(/sin\(/g, 'Math.sin(').replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(')
          .replace(/sqrt\(/g, 'Math.sqrt(').replace(/log\(/g, 'Math.log10(');
        if (!/^[0-9+\-*/().,%\sMathPIsincotagqrle]+$/.test(cleaned)) throw new Error('非法表达式');
        const val = Function('"use strict";return (' + cleaned + ')')();
        if (typeof val !== 'number' || !isFinite(val)) throw new Error('结果无效');
        return Number(val.toPrecision(12));
      };

      const renderKeys = () => {
        gridEl.classList.toggle('sci', state.sci);
        const stdKeys = [
          ['C','op'], ['退格','op'], ['%','op'], ['÷','op'],
          ['7',''], ['8',''], ['9',''], ['×','op'],
          ['4',''], ['5',''], ['6',''], ['-','op'],
          ['1',''], ['2',''], ['3',''], ['+','op'],
          ['±',''], ['0',''], ['.',''], ['=','eq']
        ];
        const sciKeys = [
          ['sin(','op'], ['cos(','op'], ['tan(','op'], ['(','op'], [')','op'],
          ['sqrt(','op'], ['^','op'], ['π','op'], ['C','op'], ['退格','op'],
          ['7',''], ['8',''], ['9',''], ['÷','op'], ['%','op'],
          ['4',''], ['5',''], ['6',''], ['×','op'], ['log(','op'],
          ['1',''], ['2',''], ['3',''], ['-','op'], ['+','op'],
          ['±',''], ['0',''], ['.',''], ['=','eq'], ['ANS','op']
        ];
        const list = state.sci ? sciKeys : stdKeys;
        gridEl.innerHTML = list.map(([k, cls]) => `<button class="calc-key ${cls}" data-key="${escapeHtml(k)}" type="button">${escapeHtml(k)}</button>`).join('');
      };

      const press = (k) => {
        if (k === 'C') { state.expr = ''; state.display = '0'; }
        else if (k === '退格') { state.expr = state.expr.slice(0, -1); state.display = state.expr || '0'; }
        else if (k === '±') {
          if (state.expr.startsWith('-')) state.expr = state.expr.slice(1);
          else if (state.expr) state.expr = '-' + state.expr;
          state.display = state.expr || '0';
        } else if (k === 'ANS') {
          state.expr += state.display;
          state.display = state.expr;
        } else if (k === '=') {
          if (!state.expr) return;
          try {
            const r = safeEval(state.expr);
            state.history.unshift(`${state.expr} = ${r}`);
            histEl.textContent = state.history[0];
            exprEl.textContent = state.expr + ' =';
            state.display = String(r);
            state.expr = String(r);
            dispEl.textContent = state.display;
            return;
          } catch (_) {
            dispEl.textContent = '错误';
            return;
          }
        } else {
          state.expr += k;
          state.display = state.expr;
        }
        exprEl.textContent = state.expr;
        dispEl.textContent = state.display;
      };

      gridEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-key]');
        if (b) press(b.dataset.key);
      });
      win.body.querySelector('[data-act="toggle-sci"]').onclick = () => { state.sci = !state.sci; renderKeys(); };
      win.body.querySelector('[data-act="clear-hist"]').onclick = () => { state.history = []; histEl.textContent = ''; };

      const onCalcKey = (e) => {
        if (WM.activeId !== win.id) return;
        if (/^[0-9.()%+\-]$/.test(e.key)) { e.preventDefault(); press(e.key); }
        else if (e.key === '*') { e.preventDefault(); press('×'); }
        else if (e.key === '/') { e.preventDefault(); press('÷'); }
        else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); press('='); }
        else if (e.key === 'Backspace') { e.preventDefault(); press('退格'); }
        else if (e.key === 'Delete') { e.preventDefault(); press('C'); }
      };
      document.addEventListener('keydown', onCalcKey);
      win.onClose = () => document.removeEventListener('keydown', onCalcKey);

      renderKeys();
      return win;
    }

      const state = { tool: 'brush', color: '#e09f42', size: 4, drawing: false, sx: 0, sy: 0, undoStack: [], redoStack: [], snapshot: null };

          </div>
          <div style="flex:1;overflow:auto;display:grid;place-items:center;background:#10131a;padding:16px;">
            <canvas data-id="cv" width="920" height="560" style="background:#ffffff;border-radius:4px;box-shadow:0 12px 36px rgba(0,0,0,0.45);cursor:crosshair;touch-action:none;max-width:100%;"></canvas>
          </div>
        </div>`;

      const cv = win.body.querySelector('[data-id="cv"]');
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      state.undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));

      const getPos = (e) => {
        const rect = cv.getBoundingClientRect();
        const pt = getClientXY(e);
        return { x: (pt.x - rect.left) * (cv.width / rect.width), y: (pt.y - rect.top) * (cv.height / rect.height) };
      };

      const startDraw = (e) => {
        e.preventDefault();
        state.drawing = true;
        const p = getPos(e);
        state.sx = p.x; state.sy = p.y;
        state.snapshot = ctx.getImageData(0, 0, cv.width, cv.height);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = state.size;
        ctx.strokeStyle = state.tool === 'eraser' ? '#ffffff' : state.color;
      };

      const moveDraw = (e) => {
        if (!state.drawing) return;
        e.preventDefault();
        const p = getPos(e);
        if (state.tool === 'brush' || state.tool === 'eraser') {
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        } else {
          ctx.putImageData(state.snapshot, 0, 0);
          ctx.beginPath();
          if (state.tool === 'line') { ctx.moveTo(state.sx, state.sy); ctx.lineTo(p.x, p.y); }
          else if (state.tool === 'rect') { ctx.rect(state.sx, state.sy, p.x - state.sx, p.y - state.sy); }
          else if (state.tool === 'circle') {
            const r = Math.hypot(p.x - state.sx, p.y - state.sy);
            ctx.arc(state.sx, state.sy, r, 0, Math.PI * 2);
          }
          ctx.stroke();
        }
      };

      const endDraw = () => {
        if (!state.drawing) return;
        state.drawing = false;
        state.undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
        if (state.undoStack.length > 30) state.undoStack.shift();
      };

      cv.addEventListener('mousedown', startDraw);
      cv.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      cv.addEventListener('touchstart', startDraw, { passive: false });
      cv.addEventListener('touchmove', moveDraw, { passive: false });
      cv.addEventListener('touchend', endDraw);

      win.body.querySelector('[data-id="color"]').oninput = (e) => { state.color = e.target.value; };
      win.body.querySelector('[data-id="size"]').oninput = (e) => { state.size = Number(e.target.value); };

      win.body.addEventListener('click', async (e) => {
        const toolBtn = e.target.closest('[data-tool]');
        if (toolBtn) {
          state.tool = toolBtn.dataset.tool;
          win.body.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('btn-active', b === toolBtn));
          return;
        }
        const actBtn = e.target.closest('[data-act]');
        if (!actBtn) return;
        const act = actBtn.dataset.act;
        if (act === 'undo' && state.undoStack.length > 1) {
          state.undoStack.pop();
          ctx.putImageData(state.undoStack[state.undoStack.length - 1], 0, 0);
        } else if (act === 'clear') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, cv.width, cv.height);
          state.undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
        } else if (act === 'save-opfs') {
          const name = await promptDialog('保存画作到 OPFS', `玄绘作品_${Date.now().toString().slice(-4)}.png`);
          if (!name) return;
          const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
          const out = await fs.uniquePath('/Pictures', name.endsWith('.png') ? name : name + '.png');
          await fs.writeFile(out, new Uint8Array(await blob.arrayBuffer()), { mtime: Date.now() });
          showToast(`已保存至 ${out}`, 'success');
        } else if (act === 'download') {
          const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
          triggerBrowserDownload(blob, 'xuanyuan_paint.png', 'image/png');
        }
      });

      win.onClose = () => window.removeEventListener('mouseup', endDraw);
      return win;
    }

                请从本机或虚拟文件系统选择真实的 <code>.iso</code> / <code>.img</code> / <code>.fda</code> / <code>.bin</code> 引导镜像启动，避免跨域拦截与黑屏。
              </div>
              <div style="font-size:11.5px;color:var(--text-muted);">挂载规则：.iso → CD-ROM ｜ .img / .fda / .bin → 软盘 FDA ｜ 其它 → 硬盘 HDA</div>
            </div>
            <div class="v86-screen-container" data-id="screen">
              <div style="white-space:pre;font:14px monospace;line-height:14px"></div>
              <canvas style="display:none"></canvas>
            </div>
          </div>
          <div class="exp-statusbar">
            <span data-id="vm-status">待机 — 未加载镜像</span>
            <span>点击画面或「锁定鼠标」捕获指针（Esc 释放）</span>
          </div>
        </div>`;

      const screenContainer = win.body.querySelector('[data-id="screen"]');
      const placeholder = win.body.querySelector('[data-id="placeholder"]');
      const vmStatus = win.body.querySelector('[data-id="vm-status"]');
      const lockBtn = win.body.querySelector('[data-act="lock-mouse"]');
      const lockLbl = win.body.querySelector('[data-id="lock-lbl"]');
      const cadBtn = win.body.querySelector('[data-act="cad"]');
      const restartBtn = win.body.querySelector('[data-act="restart"]');
      const stopBtn = win.body.querySelector('[data-act="stop"]');

      const stopVM = () => {
        if (emulator) {
          try { emulator.stop(); emulator.destroy(); } catch (_) {}
          emulator = null;
        }
        lockBtn.disabled = true;
        cadBtn.disabled = true;
        restartBtn.disabled = true;
        stopBtn.disabled = true;
        placeholder.style.display = 'flex';
        vmStatus.textContent = '虚拟机已关机';
      };

      const bootBuffer = async (name, arrayBuffer) => {
        stopVM();
        loadedImageName = name;
        loadedImageBuffer = arrayBuffer;
        vmStatus.textContent = '正在按需加载 v86@0.5.319 引擎与 BIOS...';
        try {
          const V86Ctor = await CDNLoader.loadV86();
          const memMB = Number(win.body.querySelector('[data-id="ram"]').value) || 128;
          const ext = extname(name);

          const cfg = {
            wasm_path: V86_LOCKED_ASSETS.wasm,
            memory_size: memMB * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: screenContainer,
            bios: { url: V86_LOCKED_ASSETS.bios },
            vga_bios: { url: V86_LOCKED_ASSETS.vgaBios },
            autostart: true
          };

          // Strictly match drive mount rule by extension: iso->cdrom, img/fda/bin->fda, else->hda
          const cloned = arrayBuffer.slice(0);
          if (ext === 'iso') {
            cfg.cdrom = { buffer: cloned };
            cfg.boot_order = 0x123;
          } else if (ext === 'img' || ext === 'fda' || ext === 'bin' || ext === 'flp') {
            cfg.fda = { buffer: cloned };
            cfg.boot_order = 0x312;
          } else {
            cfg.hda = { buffer: cloned };
            cfg.boot_order = 0x213;
          }

          placeholder.style.display = 'none';
          emulator = new V86Ctor(cfg);
          lockBtn.disabled = false;
          cadBtn.disabled = false;
          restartBtn.disabled = false;
          stopBtn.disabled = false;
          win.setTitle(`V86 虚拟机 — ${name}`);
          vmStatus.textContent = `运行中: ${name} (${formatBytes(arrayBuffer.byteLength)}) | 内存 ${memMB}MB`;
        } catch (err) {
          placeholder.style.display = 'flex';
          vmStatus.textContent = '启动失败: ' + err.message;
          showToast('V86 启动失败: ' + err.message, 'error');
        }
      };

      // Mouse Pointer Lock Support (Critical Requirement!)
      const requestVmMouseLock = () => {
        if (!emulator) return;
        try {
          if (typeof emulator.lock_mouse === 'function') emulator.lock_mouse();
          if (screenContainer.requestPointerLock) screenContainer.requestPointerLock();
        } catch (err) {
          showToast('鼠标锁定被浏览器拒绝: ' + err.message, 'error');
        }
      };

      const onPointerLockChange = () => {
        const locked = document.pointerLockElement === screenContainer ||
                       (document.pointerLockElement && screenContainer.contains(document.pointerLockElement));
        lockLbl.textContent = locked ? '鼠标已锁定 (Esc释放)' : '锁定鼠标';
        lockBtn.classList.toggle('btn-active', !!locked);
      };
      document.addEventListener('pointerlockchange', onPointerLockChange);
      screenContainer.addEventListener('click', () => { if (emulator) requestVmMouseLock(); });

      win.body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'pick-local') {
          const inp = document.createElement('input');
          inp.type = 'file';
          inp.accept = '.iso,.img,.fda,.bin,.flp,.vhd';
          inp.onchange = async () => {
            const f = inp.files?.[0];
            if (!f) return;
            vmStatus.textContent = `正在读取镜像 ${f.name}...`;
            const ab = await f.arrayBuffer();
            bootBuffer(f.name, ab);
          };
          inp.click();
        } else if (act === 'pick-vfs') {
          const p = await promptDialog('输入 VFS 中的镜像文件路径', '/Downloads/boot.img');
          if (!p) return;
          try {
            const bytes = await fs.readFile(normalizePath(p));
            bootBuffer(basename(p), bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
          } catch (err) { showToast('读取 VFS 镜像失败: ' + err.message, 'error'); }
        } else if (act === 'lock-mouse') requestVmMouseLock();
        else if (act === 'cad' && emulator) {
          emulator.keyboard_send_scancodes([0x1d, 0x38, 0x53, 0xd3, 0xb8, 0x9d]);
          showToast('已发送 Ctrl+Alt+Del', 'info', 1400);
        } else if (act === 'restart' && loadedImageBuffer) bootBuffer(loadedImageName, loadedImageBuffer);
        else if (act === 'stop') stopVM();
      });

      win.onClose = () => {
        document.removeEventListener('pointerlockchange', onPointerLockChange);
        stopVM();
      };

      if (path) {
        fs.readFile(path).then(bytes => {
          bootBuffer(basename(path), bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
        }).catch(err => showToast('加载镜像失败: ' + err.message, 'error'));
      }

      return win;
    }

    /* -------------------- 14. VFS TERMINAL CONSOLE -------------------- */
    function launchTerminal() {
      const win = WM.create({
        appId: 'terminal',
        title: '玄渊终端 — /Desktop',
        icon: 'terminal',
        width: 720,
        height: 460
      });

      let cwd = '/Desktop';
      const cmdHist = [];
      let histPos = 0;

      win.body.innerHTML = `
        <div class="term-wrap" data-id="wrap">
          <div class="term-line" style="color:var(--accent);">玄渊 OS 终端内核 [Unified VFS: OPFS + IndexedDB + Local FSAA]</div>
          <div class="term-line" style="color:#7d8ba3;">输入 help 查看所有支持的文件系统命令。</div>
          <div data-id="out"></div>
          <div class="term-input-row">
            <span class="term-prompt" data-id="prompt">xuanyuan:/Desktop$</span>
            <input class="term-input" data-id="in" type="text" autocomplete="off" spellcheck="false" />
          </div>
        </div>`;

      const wrap = win.body.querySelector('[data-id="wrap"]');
      const outEl = win.body.querySelector('[data-id="out"]');
      const promptEl = win.body.querySelector('[data-id="prompt"]');
      const inputEl = win.body.querySelector('[data-id="in"]');

      const print = (text, color = '') => {
        const div = document.createElement('div');
        div.className = 'term-line';
        if (color) div.style.color = color;
        div.textContent = text;
        outEl.appendChild(div);
        wrap.scrollTop = wrap.scrollHeight;
      };

      const resolveP = (p) => (!p ? cwd : (p.startsWith('/') ? normalizePath(p) : joinPath(cwd, p)));

      const execCmd = async (raw) => {
        const line = raw.trim();
        print(`${promptEl.textContent} ${line}`, '#9eb0cc');
        if (!line) return;
        cmdHist.push(line);
        histPos = cmdHist.length;

        const args = line.match(/(?:[^\s"]+|"[^"]*")+/g)?.map(s => s.replace(/^"|"$/g, '')) || [];
        const cmd = args[0].toLowerCase();

        try {
          if (cmd === 'help') {
            print('可用命令:\n  ls [路径]        列出目录\n  ll [路径]        显示详情（修改日期、大小、后端）\n  cd <路径>        切换目录\n  pwd              显示当前目录\n  cat <文件>       打印文本内容\n  mkdir <目录>     创建目录\n  touch <文件>     创建空白文件\n  rm <路径>        删除文件或目录\n  cp <源> <目标>   复制（保留修改日期）\n  mv <源> <目标>   移动/重命名（保留修改日期）\n  du [路径]        计算精确占用大小\n  find <关键词>    全盘搜索文件\n  mounts           查看当前挂载卷与本地目录\n  open <路径>      使用系统关联应用打开\n  clear            清屏');
          } else if (cmd === 'clear') {
            outEl.innerHTML = '';
          } else if (cmd === 'pwd') {
            print(cwd);
          } else if (cmd === 'cd') {
            const target = resolveP(args[1] || '/');
            const st = await fs.stat(target);
            if (!st.isDirectory) throw new Error('不是目录: ' + target);
            cwd = target;
            promptEl.textContent = `xuanyuan:${cwd}$`;
            win.setTitle(`玄渊终端 — ${cwd}`);
          } else if (cmd === 'ls' || cmd === 'll') {
            const target = resolveP(args[1]);
            const names = (await fs.readdir(target)).sort(naturalCompare);
            if (cmd === 'ls') {
              print(names.join('   ') || '(空目录)');
            } else {
              for (const n of names) {
                const st = await fs.stat(joinPath(target, n)).catch(() => null);
                if (!st) continue;
                const sz = st.isDirectory ? await fs.getDirSize(st.path) : st.size;
                print(`${st.isDirectory ? 'd' : '-'}  ${formatDateTime(st.mtime).padEnd(17)}  ${formatBytes(sz).padStart(9)}  [${(st.backend || '').padEnd(6)}]  ${n}`);
              }
            }
          } else if (cmd === 'cat' && args[1]) {
            print(await fs.readFile(resolveP(args[1]), { encoding: 'utf8' }));
          } else if (cmd === 'mkdir' && args[1]) {
            await fs.mkdir(resolveP(args[1]), { recursive: true, mtime: Date.now() });
            print('已创建目录', '#3fb984');
          } else if (cmd === 'touch' && args[1]) {
            await fs.writeFile(resolveP(args[1]), '', { mtime: Date.now() });
            print('已创建文件', '#3fb984');
          } else if (cmd === 'rm' && args[1]) {
            await fs.rm(resolveP(args[1]));
            print('已删除', '#e09f42');
          } else if (cmd === 'cp' && args[1] && args[2]) {
            await fs.copy(resolveP(args[1]), resolveP(args[2]));
            print('复制完成（保留原始修改日期）', '#3fb984');
          } else if (cmd === 'mv' && args[1] && args[2]) {
            await fs.move(resolveP(args[1]), resolveP(args[2]));
            print('移动完成（保留原始修改日期）', '#3fb984');
          } else if (cmd === 'du') {
            const target = resolveP(args[1]);
            const st = await fs.stat(target);
            const sz = st.isDirectory ? await fs.getDirSize(target) : st.size;
            print(`${formatBytes(sz)} (${sz.toLocaleString()} bytes)  ${target}`);
          } else if (cmd === 'find' && args[1]) {
            const res = await fs.searchRecursive('/', args[1]);
            print(res.map(r => r.path).join('\n') || '未找到匹配文件');
          } else if (cmd === 'mounts') {
            print(`主存储后端: ${fs.primaryKey.toUpperCase()} (OPFS=${fs.opfs.available}, IDB=${fs.idb.available})`);
            for (const [mp, bk] of fs.mounts.entries()) print(`  ${mp}  ->  ${bk.label}`);
          } else if (cmd === 'open' && args[1]) {
            await openVfsPath(resolveP(args[1]));
          } else {
            print(`未知命令: ${cmd}（输入 help 查看帮助）`, '#e5534b');
          }
        } catch (err) {
          print('错误: ' + err.message, '#e5534b');
        }
      };

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = inputEl.value;
          inputEl.value = '';
          execCmd(val);
        } else if (e.key === 'ArrowUp' && histPos > 0) {
          e.preventDefault();
          inputEl.value = cmdHist[--histPos] || '';
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          inputEl.value = histPos < cmdHist.length - 1 ? cmdHist[++histPos] : '';
        }
      });
      wrap.addEventListener('click', () => inputEl.focus());
      setTimeout(() => inputEl.focus(), 50);
      return win;
    }

          panel.innerHTML = `
            <div class="settings-card">
              <div class="settings-title">玄渊 OS 运行环境诊断</div>
              <div style="display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:12.5px;">
                <span style="color:var(--text-muted);">OPFS 原生文件系统</span><span style="color:${fs.opfs.available ? 'var(--success)' : 'var(--warning)'};">${fs.opfs.available ? '已启用并持久化挂载' : '当前上下文不可用（已自动降级 IndexedDB）'}</span>
                <span style="color:var(--text-muted);">IndexedDB 引擎</span><span style="color:var(--success);">已连接 (${DB_NAME})</span>
                <span style="color:var(--text-muted);">本地目录挂载 API</span><span>${typeof window.showDirectoryPicker === 'function' ? '支持 (File System Access API)' : '当前浏览器不支持'}</span>
                <span style="color:var(--text-muted);">localStorage & Cookie</span><span style="color:var(--success);">协同同步就绪</span>
              </div>
            </div>
            <div class="settings-card" style="border-color:rgba(229,83,75,0.35);">
              <div class="settings-title" style="color:var(--danger);">危险操作：一键重置系统与虚拟文件系统</div>
              <div class="settings-desc">将彻底清空 OPFS 与 IndexedDB 中的全部用户文件、重置所有桌面排版与偏好设置，并重建初始示例环境。</div>
              <div>
                <button class="btn btn-danger" data-sact="factory-reset">${ico('trash', 14)}<span>一键清除并重置虚拟文件系统</span></button>
              </div>
            </div>`;
        }
      };

      // Event Delegation for Settings Panel
      win.body.addEventListener('click', async (e) => {
        const navBtn = e.target.closest('[data-tab]');
        if (navBtn) { activeTab = navBtn.dataset.tab; renderTab(); return; }

        const themeBtn = e.target.closest('[data-stheme]');
        if (themeBtn) { SettingsStore.save({ theme: themeBtn.dataset.stheme }); renderTab(); return; }

        const accBtn = e.target.closest('[data-saccent]');
        if (accBtn) {
          SettingsStore.save({ accent: accBtn.dataset.saccent, accentHover: accBtn.dataset.shover, accentContrast: accBtn.dataset.scontrast });
          renderTab(); return;
        }

        const wpBtn = e.target.closest('[data-swp]');
        if (wpBtn) { SettingsStore.save({ wallpaper: wpBtn.dataset.swp, customWallpaperPath: '' }); renderTab(); return; }

        const hrBtn = e.target.closest('[data-shour]');
        if (hrBtn) { SettingsStore.save({ hour12: hrBtn.dataset.shour === '12' }); updateClockUI(); renderTab(); return; }

        const tog = e.target.closest('[data-stoggle]');
        if (tog) {
          const key = tog.dataset.stoggle;
          const next = !SettingsStore.data[key];
          SettingsStore.save({ [key]: next });
          if (key === 'fsShowBoth') fs.setConfig(SettingsStore.data.fsPrimary, next);
          if (key === 'showDesktopIcons') Desktop.render();
          renderTab(); return;
        }

        const appVis = e.target.closest('[data-sapp-vis]');
        if (appVis) {
          const appId = appVis.dataset.sappVis;
          const set = new Set(SettingsStore.data.hiddenApps || []);
          if (set.has(appId)) set.delete(appId); else set.add(appId);
          SettingsStore.save({ hiddenApps: Array.from(set) });
          Desktop.render();
          renderStartMenu();
          renderTaskbar();
          renderTab(); return;
        }

        const unm = e.target.closest('[data-sunmount]');
        if (unm) {
          fs.unmount(unm.dataset.sunmount);
          await MountHistory.remove(basename(unm.dataset.sunmount));
          renderTab(); return;
        }

        const actBtn = e.target.closest('[data-sact]');
        if (!actBtn) return;
        const act = actBtn.dataset.sact;
        if (act === 'refresh-storage') renderTab();
        else if (act === 'mount-local') { await mountLocalDirectoryFlow(); renderTab(); }
        else if (act === 'upload-wp') { uploadCustomWallpaper(); setTimeout(renderTab, 800); }
        else if (act === 'clear-wp') { SettingsStore.save({ customWallpaperPath: '' }); renderTab(); }
        else if (act === 'factory-reset') {
          const ok = await confirmDialog('重置虚拟文件系统', '确认要清空 OPFS、IndexedDB 中的所有文件并恢复出厂默认设置吗？此操作不可撤销！', true);
          if (!ok) return;
          try {
            await fs.opfs.clearAll();
            await fs.idb.clearAll();
            await vfsDB.clear('meta');
            await vfsDB.clear('mount_records');
            localStorage.clear();
            CookieStore.clearAll();
            showToast('系统已清空重置，即将重新载入...', 'success');
            setTimeout(() => location.reload(), 700);
          } catch (err) {
            showToast('重置过程出错: ' + err.message, 'error');
          }
        }
      });

      panel.addEventListener('change', (e) => {
        if (e.target.matches('[data-sbind="fsPrimary"]')) {

    /* =====================================================================
       MODULE 6: CONTEXT MENU, TASKBAR, START MENU, CALENDAR & INSTANT BOOT
       ===================================================================== */

    /* ---------- Global Context Menu ---------- */
    const ctxEl = document.getElementById('context-menu');

    function hideContextMenu() {
      ctxEl.classList.remove('open');
      ctxEl.innerHTML = '';
    }

    function showContextMenu(x, y, items) {
      ctxEl.innerHTML = '';
      const buildItems = (list, container) => {
        for (const item of list) {
          if (item.sep) {
            const sep = document.createElement('div');
            sep.className = 'ctx-sep';
            container.appendChild(sep);
            continue;
          }
          if (item.submenu) {
            const wrap = document.createElement('div');
            wrap.className = 'ctx-sub-wrap';
            wrap.innerHTML = `<button class="ctx-item" type="button">
              <span class="ctx-item-left">${item.icon ? ico(item.icon, 14) : ''}<span>${escapeHtml(item.label)}</span></span>
              <span style="color:var(--text-muted);">${ico('chevRight', 12)}</span>
            </button><div class="ctx-submenu"></div>`;
            buildItems(item.submenu, wrap.querySelector('.ctx-submenu'));
            container.appendChild(wrap);
            continue;
          }
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ctx-item' + (item.danger ? ' danger' : '') + (item.disabled ? ' disabled' : '');
          btn.innerHTML = `<span class="ctx-item-left">${item.icon ? ico(item.icon, 14) : ''}<span>${escapeHtml(item.label)}</span></span>${item.shortcut ? `<span class="ctx-item-shortcut">${escapeHtml(item.shortcut)}</span>` : ''}`;
          btn.onclick = (e) => {
            e.stopPropagation();
            hideContextMenu();
            if (!item.disabled && item.action) item.action();
          };
          container.appendChild(btn);
        }
      };

      buildItems(items, ctxEl);
      ctxEl.classList.add('open');

      const rect = ctxEl.getBoundingClientRect();
      const vw = window.innerWidth, vh = window.innerHeight;
      const left = Math.max(6, Math.min(vw - rect.width - 8, x));
      const top = Math.max(6, Math.min(vh - rect.height - 8, y));
      ctxEl.style.left = left + 'px';
      ctxEl.style.top = top + 'px';
    }

    /* ---------- Taskbar & Aero Peek Hover Card ---------- */
    const peekCard = document.getElementById('peek-preview');
    let _peekTimer = null;

    function hidePeekCard() {
      clearTimeout(_peekTimer);
      peekCard.classList.remove('visible');
      WM.setAeroPeek(false);
    }

    function renderTaskbar() {
      const container = document.getElementById('tb-apps');
      container.innerHTML = '';
      const hidden = new Set(SettingsStore.data.hiddenApps || []);

      // Show pinned quick-launch icons for apps that have no open window yet (and are not hidden)
      const openAppIds = new Set();
      WM.windows.forEach(w => openAppIds.add(w.appId));

      for (const app of APP_REGISTRY) {
        if (!app.pinned || hidden.has(app.id) || openAppIds.has(app.id)) continue;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tb-app-item';
        btn.title = app.name;
        btn.innerHTML = `<span style="color:var(--accent);display:flex;">${ico(app.icon, 16)}</span><span class="tb-app-title tb-hide-mobile">${escapeHtml(app.name)}</span>`;
        btn.onclick = () => launchApp(app.id);
        container.appendChild(btn);
      }

      // Show all running windows
      WM.windows.forEach((win) => {
        const item = document.createElement('div');
        item.className = 'tb-app-item running' + (WM.activeId === win.id && !win.minimized ? ' active' : '') + (win.minimized ? ' minimized' : '');
        item.title = win.title;
        item.innerHTML = `
          <span style="color:var(--accent);display:flex;flex-shrink:0;">${ico(win.icon || 'file', 16)}</span>
          <span class="tb-app-title">${escapeHtml(win.title)}</span>
          <button class="tb-app-close" type="button" title="关闭窗口">${ico('close', 11)}</button>`;

        item.onclick = (e) => {
          if (e.target.closest('.tb-app-close')) {
            e.stopPropagation();
            hidePeekCard();
            WM.close(win.id);
            return;
          }
          hidePeekCard();
          if (win.minimized) WM.focus(win.id);
          else if (WM.activeId === win.id) WM.minimize(win.id);
          else WM.focus(win.id);
        };

        // Aero Peek preview on desktop hover
        item.addEventListener('mouseenter', () => {
          if (isMobile()) return;
          clearTimeout(_peekTimer);
          _peekTimer = setTimeout(() => {
            const r = item.getBoundingClientRect();
            const left = Math.max(8, Math.min(window.innerWidth - 230, r.left));
            peekCard.style.left = left + 'px';
            peekCard.innerHTML = `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                <span style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;min-width:0;">
                  <span style="color:var(--accent);">${ico(win.icon || 'file', 14)}</span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(win.title)}</span>
                </span>
                <button class="win-ctrl-btn close" id="peek-close-btn" type="button" style="width:24px;height:22px;">${ico('close', 11)}</button>
              </div>
              <div style="height:82px;border-radius:6px;background:var(--bg-elevated);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;" id="peek-focus-area">
                <span style="color:var(--accent);">${ico(win.icon || 'file', 26)}</span>
                <span style="font-size:11px;color:var(--text-secondary);">${win.minimized ? '已最小化 — 点击恢复' : '运行中 — 点击聚焦'}</span>
              </div>`;
            peekCard.classList.add('visible');
            if (!win.minimized) WM.setAeroPeek(true, win.id);
            peekCard.querySelector('#peek-close-btn').onclick = () => { hidePeekCard(); WM.close(win.id); };
            peekCard.querySelector('#peek-focus-area').onclick = () => { hidePeekCard(); WM.focus(win.id); };
          }, 220);
        });

        item.addEventListener('mouseleave', () => {
          clearTimeout(_peekTimer);
          _peekTimer = setTimeout(() => {
            if (!peekCard.matches(':hover')) hidePeekCard();
          }, 180);
        });

        container.appendChild(item);
      });
    }

    peekCard.addEventListener('mouseleave', () => hidePeekCard());

    /* ---------- Start Menu ---------- */
    const startMenuEl = document.getElementById('start-menu');
    const startBtn = document.getElementById('btn-start');
    const startSearchInput = document.getElementById('start-search-input');

    function toggleStartMenu(force) {
      const open = force !== undefined ? force : !startMenuEl.classList.contains('open');
      startMenuEl.classList.toggle('open', open);
      startBtn.classList.toggle('open', open);
      if (open) {
        toggleCalendar(false);
        renderStartMenu(startSearchInput.value);
        setTimeout(() => startSearchInput.focus(), 30);
      }
    }

    function renderStartMenu(filter = '') {
      const grid = document.getElementById('start-apps-grid');
      const hidden = new Set(SettingsStore.data.hiddenApps || []);
      const q = filter.trim().toLowerCase();
      const visibleApps = APP_REGISTRY.filter(a => !hidden.has(a.id) && (!q || a.name.toLowerCase().includes(q) || a.id.includes(q)));

      grid.innerHTML = visibleApps.map(app => `
        <button class="start-app-tile" data-start-app="${app.id}" type="button">
          <span class="tile-ico">${ico(app.icon, 20)}</span>
          <span>${escapeHtml(app.name)}</span>
        </button>`).join('') || `<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--text-muted);">未找到匹配的应用</div>`;

      grid.querySelectorAll('[data-start-app]').forEach(btn => {
        btn.onclick = () => {
          toggleStartMenu(false);
          launchApp(btn.dataset.startApp);
        };
      });

      document.getElementById('start-backend-tag').textContent = `主存储: ${fs.primaryKey.toUpperCase()} ${fs.showBoth ? '+ 双卷模式' : ''}`;
      document.getElementById('start-storage-summary').textContent = `已挂载本地目录: ${fs.listLocalMounts().length}`;
    }

    /* ---------- Clock (Default 12h + Adjustable) & Interactive Calendar ---------- */
    const calEl = document.getElementById('calendar-popover');
    const calViewState = {
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      selectedDateStr: ''
    };

    function formatClockParts(now, hour12) {
      const pad = n => String(n).padStart(2, '0');
      let h = now.getHours();
      const m = pad(now.getMinutes());
      const s = pad(now.getSeconds());
      let period = '';
      if (hour12) {
        period = h < 12 ? '上午' : '下午';
        h = h % 12 || 12;
      }
      const hm = hour12 ? `${period} ${h}:${m}` : `${pad(h)}:${m}`;
      const hms = hour12 ? `${period} ${h}:${m}:${s}` : `${pad(h)}:${m}:${s}`;
      const dateShort = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())}`;
      const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      const dateFull = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weeks[now.getDay()]}`;
      return { hm, hms, dateShort, dateFull };
    }

    function updateClockUI() {
      const now = new Date();
      const parts = formatClockParts(now, SettingsStore.data.hour12);
      document.getElementById('tb-time').textContent = parts.hm;
      document.getElementById('tb-date').textContent = parts.dateShort;
      document.getElementById('cal-clock-big').textContent = parts.hms;
      document.getElementById('cal-clock-sub').textContent = parts.dateFull;
      document.getElementById('cal-hour-toggle').textContent = SettingsStore.data.hour12 ? '12小时制' : '24小时制';
    }

    function renderCalendar() {
      const { year, month } = calViewState;
      document.getElementById('cal-month-label').textContent = `${year}年 ${month + 1}月`;
      const grid = document.getElementById('cal-grid');
      const dows = ['日','一','二','三','四','五','六'];
      let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

      for (let i = firstDow - 1; i >= 0; i--) {
        html += `<button class="cal-day other-month" type="button" data-cal-shift="-1">${prevDays - i}</button>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${month}-${d}`;
        const cls = (key === todayKey ? ' today' : '') + (key === calViewState.selectedDateStr ? ' selected-day' : '');
        html += `<button class="cal-day${cls}" type="button" data-cal-day="${key}">${d}</button>`;
      }
      const totalCells = firstDow + daysInMonth;
      const tail = (7 - (totalCells % 7)) % 7;
      for (let d = 1; d <= tail; d++) {
        html += `<button class="cal-day other-month" type="button" data-cal-shift="1">${d}</button>`;
      }
      grid.innerHTML = html;

      grid.querySelectorAll('[data-cal-day]').forEach(btn => {
        btn.onclick = () => { calViewState.selectedDateStr = btn.dataset.calDay; renderCalendar(); };
      });
      grid.querySelectorAll('[data-cal-shift]').forEach(btn => {
        btn.onclick = () => shiftCalendarMonth(Number(btn.dataset.calShift));
      });
    }

    function shiftCalendarMonth(delta) {
      let m = calViewState.month + delta;
      let y = calViewState.year;
      if (m < 0) { m = 11; y--; }
      else if (m > 11) { m = 0; y++; }
      calViewState.year = y;
      calViewState.month = m;
      renderCalendar();
    }

    function toggleCalendar(force) {
      const open = force !== undefined ? force : !calEl.classList.contains('open');
      calEl.classList.toggle('open', open);
      if (open) {
        toggleStartMenu(false);
        renderCalendar();
      }
    }

    /* ---------- System Tray Icons & Global Shell Wiring ---------- */
    function updateThemeTrayButton() {
      const btn = document.getElementById('tb-theme-btn');
      if (!btn) return;
      btn.innerHTML = SettingsStore.data.theme === 'dark' ? ico('sun', 15) : ico('moon', 15);
    }

    function updateStorageTrayBadge() {
      const btn = document.getElementById('tb-storage-btn');
      if (!btn) return;
      btn.innerHTML = `${ico(fs.primaryKey === 'opfs' ? 'drive' : 'database', 14)}<span style="font-size:11px;font-family:var(--font-mono);">${fs.primaryKey.toUpperCase()}</span>`;
    }

    function wireShellControls() {
      document.getElementById('start-logo-slot').innerHTML = ico('brand', 17);
      document.getElementById('start-brand-mark').innerHTML = ico('brand', 20);
      document.getElementById('start-search-ico').innerHTML = ico('search', 14);
      document.getElementById('tb-fs-btn').innerHTML = ico('fullscreen', 14);
      document.getElementById('cal-prev-month').innerHTML = ico('chevLeft', 14);
      document.getElementById('cal-next-month').innerHTML = ico('chevRight', 14);

      startBtn.onclick = (e) => { e.stopPropagation(); toggleStartMenu(); };
      startSearchInput.oninput = () => renderStartMenu(startSearchInput.value);
      document.getElementById('start-settings-quick').onclick = () => { toggleStartMenu(false); launchSettings(); };
      document.getElementById('start-mount-local').onclick = () => { toggleStartMenu(false); mountLocalDirectoryFlow(); };
      document.getElementById('start-fullscreen').onclick = () => { toggleStartMenu(false); toggleBrowserFullscreen(); };

      document.getElementById('tb-storage-btn').onclick = () => launchSettings({ tab: 'storage' });
      document.getElementById('tb-theme-btn').onclick = () => {
        SettingsStore.save({ theme: SettingsStore.data.theme === 'dark' ? 'light' : 'dark' });
      };
      document.getElementById('tb-fs-btn').onclick = () => toggleBrowserFullscreen();
      document.getElementById('tb-clock-btn').onclick = (e) => { e.stopPropagation(); toggleCalendar(); };

      document.getElementById('cal-prev-month').onclick = () => shiftCalendarMonth(-1);
      document.getElementById('cal-next-month').onclick = () => shiftCalendarMonth(1);
      document.getElementById('cal-today-btn').onclick = () => {
        const now = new Date();
        calViewState.year = now.getFullYear();
        calViewState.month = now.getMonth();
        calViewState.selectedDateStr = '';
        renderCalendar();
      };
      document.getElementById('cal-hour-toggle').onclick = () => {
        SettingsStore.save({ hour12: !SettingsStore.data.hour12 });
        updateClockUI();
      };

      // Aero Peek Far-Right Strip
      const peekStrip = document.getElementById('aero-peek-strip');
      peekStrip.addEventListener('mouseenter', () => WM.setAeroPeek(true, null));
      peekStrip.addEventListener('mouseleave', () => WM.setAeroPeek(false));
      peekStrip.addEventListener('click', () => { WM.setAeroPeek(false); WM.toggleShowDesktop(); });

      // Global Dismiss for Popups & Context Menu
      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('#context-menu')) hideContextMenu();
        if (!e.target.closest('#start-menu') && !e.target.closest('#btn-start')) toggleStartMenu(false);
        if (!e.target.closest('#calendar-popover') && !e.target.closest('#tb-clock-btn')) toggleCalendar(false);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          hideContextMenu();
          toggleStartMenu(false);
          toggleCalendar(false);
        } else if (e.altKey && e.key.toLowerCase() === 's') {
          e.preventDefault();
          toggleStartMenu();
        }
      });
    }

    /* ---------- Direct Instant Boot (ZERO Fake Loading Screen!) ---------- */
    async function boot() {
      SettingsStore.load();
      SettingsStore.applyToDOM();
      wireShellControls();
      updateClockUI();
      setInterval(updateClockUI, 1000);

      // Initialize Unified Multi-Backend VFS (OPFS + IndexedDB + Local FSAA)
      await fs.init(SettingsStore.data.fsPrimary, SettingsStore.data.fsShowBoth);
      updateStorageTrayBadge();

      // Seed real starter files on first visit
      await seedInitialFilesystem();

      // Initialize Desktop & Shell immediately
      Desktop.init();
      await Desktop.render();
      renderTaskbar();
      renderStartMenu();

      // Section 8.3 Persistence Reminder: Prompt user to re-mount previously mounted local folders
      const prevMounts = await MountHistory.list();
      if (prevMounts.length > 0 && typeof window.showDirectoryPicker === 'function') {
        const names = prevMounts.map(m => m.name).join('、');
        const root = document.getElementById('toast-root');
        const el = document.createElement('div');
        el.className = 'toast-item';
        el.innerHTML = `
          <span style="color:var(--accent);display:flex;">${ico('mount', 16)}</span>
          <div style="flex:1;line-height:1.45;">
            <div style="font-weight:600;">恢复本地文件夹挂载权限</div>
            <div style="font-size:11.5px;color:var(--text-secondary);">上次曾挂载：${escapeHtml(names)}（刷新后浏览器需重新授权）</div>
            <div style="display:flex;gap:6px;margin-top:6px;">
              <button class="btn btn-sm btn-primary" id="remount-now" type="button">立即重新挂载</button>
              <button class="btn btn-sm" id="remount-dismiss" type="button">暂不挂载</button>
            </div>
          </div>`;
        root.appendChild(el);
        el.querySelector('#remount-now').onclick = async () => { el.remove(); await mountLocalDirectoryFlow(); };
        el.querySelector('#remount-dismiss').onclick = () => el.remove();
      }
    }

    boot();

  })();
  </script>
</body>
</html>
