    /* =====================================================================
       ADAPTIVE MARQUEE SELECTION ENGINE (Mouse + Touch + 40px Edge Auto-Scroll + AABB)
       ===================================================================== */
    function getClientXY(e) {
      if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function createMarqueeSelector({
      container,
      marqueeEl,
      itemSelector,
      ignoreSelector = '',
      canTouchMarquee = () => true,
      onSelectionChange,
      onStart
    }) {
      let active = false;
      let startedDrag = false;
      let startX = 0, startY = 0;
      let curClientX = 0, curClientY = 0;
      let additive = false;
      let preSelected = new Set();
      let rafId = null;

      const toContentCoords = (cx, cy) => {
        const rect = container.getBoundingClientRect();
        return {
          x: cx - rect.left + container.scrollLeft,
          y: cy - rect.top + container.scrollTop
        };
      };

      const computeAABBAndSelect = () => {
        const cur = toContentCoords(curClientX, curClientY);
        const left = Math.min(startX, cur.x);
        const top = Math.min(startY, cur.y);
        const width = Math.abs(cur.x - startX);
        const height = Math.abs(cur.y - startY);

        if (!startedDrag && (width > 4 || height > 4)) {
          startedDrag = true;
          marqueeEl.style.display = 'block';
        }
        if (!startedDrag) return;

        marqueeEl.style.left = left + 'px';
        marqueeEl.style.top = top + 'px';
        marqueeEl.style.width = width + 'px';
        marqueeEl.style.height = height + 'px';

        const boxRight = left + width;
        const boxBottom = top + height;
        const containerRect = container.getBoundingClientRect();
        const items = container.querySelectorAll(itemSelector);
        const selectedEls = new Set(additive ? preSelected : []);

        items.forEach((el) => {
          // Compute exact item coordinates inside container scroll space
          let elLeft, elTop, elW, elH;
          if (el.offsetParent === container) {
            elLeft = el.offsetLeft;
            elTop = el.offsetTop;
            elW = el.offsetWidth;
            elH = el.offsetHeight;
          } else {
            const r = el.getBoundingClientRect();
            elLeft = r.left - containerRect.left + container.scrollLeft;
            elTop = r.top - containerRect.top + container.scrollTop;
            elW = r.width;
            elH = r.height;
          }
          const hit = !(elLeft + elW < left || elLeft > boxRight || elTop + elH < top || elTop > boxBottom);
          if (hit) selectedEls.add(el);
        });

        onSelectionChange(selectedEls, true);
      };

      // 40px Edge Auto-Scroll loop
      const autoScrollTick = () => {
        if (!active) { rafId = null; return; }
        const rect = container.getBoundingClientRect();
        const ZONE = 40;
        let dx = 0, dy = 0;
        if (curClientY < rect.top + ZONE) dy = -Math.max(4, Math.round((rect.top + ZONE - curClientY) * 0.35));
        else if (curClientY > rect.bottom - ZONE) dy = Math.max(4, Math.round((curClientY - (rect.bottom - ZONE)) * 0.35));
        if (curClientX < rect.left + ZONE) dx = -Math.max(4, Math.round((rect.left + ZONE - curClientX) * 0.35));
        else if (curClientX > rect.right - ZONE) dx = Math.max(4, Math.round((curClientX - (rect.right - ZONE)) * 0.35));

        if (dx !== 0 || dy !== 0) {
          container.scrollLeft += dx;
          container.scrollTop += dy;
          computeAABBAndSelect();
        }
        rafId = requestAnimationFrame(autoScrollTick);
      };

      const handleStart = (e) => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        if (e.type === 'touchstart' && (!canTouchMarquee() || e.touches.length > 1)) return;
        if (e.target.closest(itemSelector)) return;
        if (ignoreSelector && e.target.closest(ignoreSelector)) return;
        // Do not start marquee on scrollbars
        const rect = container.getBoundingClientRect();
        const pt = getClientXY(e);
        if (pt.x > rect.left + container.clientWidth || pt.y > rect.top + container.clientHeight) return;

        active = true;
        startedDrag = false;
        additive = !!(e.ctrlKey || e.metaKey || e.shiftKey);
        preSelected = new Set(container.querySelectorAll(itemSelector + '.selected'));

        curClientX = pt.x;
        curClientY = pt.y;
        const c = toContentCoords(pt.x, pt.y);
        startX = c.x;
        startY = c.y;

        if (!additive) onSelectionChange(new Set(), false);
        if (onStart) onStart(e);

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('touchmove', handleMove, { passive: false });
        document.addEventListener('touchend', handleEnd);
        document.addEventListener('touchcancel', handleEnd);
        rafId = requestAnimationFrame(autoScrollTick);
      };

      const handleMove = (e) => {
        if (!active) return;
        if (e.type === 'touchmove') e.preventDefault();
        const pt = getClientXY(e);
        curClientX = pt.x;
        curClientY = pt.y;
        computeAABBAndSelect();
      };

      const handleEnd = () => {
        if (!active) return;
        active = false;
        startedDrag = false;
        marqueeEl.style.display = 'none';
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
        document.removeEventListener('touchmove', handleMove);
        document.removeEventListener('touchend', handleEnd);
        document.removeEventListener('touchcancel', handleEnd);
      };

      container.addEventListener('mousedown', handleStart);
      container.addEventListener('touchstart', handleStart, { passive: true });

      return {
        destroy() {
          handleEnd();
          container.removeEventListener('mousedown', handleStart);
          container.removeEventListener('touchstart', handleStart);
        }
      };
    }

    /* =====================================================================
       WINDOW MANAGER (8-Way Resize + Aero Snap + Aero Peek + Responsive)
       ===================================================================== */
    const WM = {
      windows: new Map(), // id -> winObj
      zCounter: 100,
      activeId: null,
      _desktopHiddenBackup: null,

      create({ appId, title, icon, width = 820, height = 560, minW = 300, minH = 220, x, y, maximized = false, onClose, onResize }) {
        const id = 'win_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
        const layer = document.getElementById('windows-layer');
        const desktopRect = layer.getBoundingClientRect();
        const mobile = isMobile();

        const w = Math.min(width, Math.max(minW, desktopRect.width - 24));
        const h = Math.min(height, Math.max(minH, desktopRect.height - 24));
        const cascade = (this.windows.size % 8) * 26;
        const left = x != null ? x : Math.max(12, Math.min(desktopRect.width - w - 12, Math.round((desktopRect.width - w) / 2) + cascade - 40));
        const top = y != null ? y : Math.max(12, Math.min(desktopRect.height - h - 12, Math.round((desktopRect.height - h) / 2) + cascade - 30));

        const el = document.createElement('section');
        el.className = 'os-window';
        el.dataset.winId = id;
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';

        el.innerHTML = `
          <div class="win-titlebar">
            <div class="win-title-left">
              <span class="win-title-icon">${ico(icon || 'file', 16)}</span>
              <span class="win-title-text">${escapeHtml(title)}</span>
            </div>
            <div class="win-controls">
              <button class="win-ctrl-btn min" type="button" title="最小化">${ico('min', 12)}</button>
              <button class="win-ctrl-btn max" type="button" title="最大化/还原">${ico('max', 12)}</button>
              <button class="win-ctrl-btn close" type="button" title="关闭">${ico('close', 13)}</button>
            </div>
          </div>
          <div class="win-body"></div>
          <div class="win-resize-handle rh-n" data-dir="n"></div>
          <div class="win-resize-handle rh-s" data-dir="s"></div>
          <div class="win-resize-handle rh-e" data-dir="e"></div>
          <div class="win-resize-handle rh-w" data-dir="w"></div>
          <div class="win-resize-handle rh-nw" data-dir="nw"></div>
          <div class="win-resize-handle rh-ne" data-dir="ne"></div>
          <div class="win-resize-handle rh-sw" data-dir="sw"></div>
          <div class="win-resize-handle rh-se" data-dir="se"></div>
        `;

        layer.appendChild(el);

        const win = {
          id, appId, title, icon, el,
          body: el.querySelector('.win-body'),
          titleEl: el.querySelector('.win-title-text'),
          maxBtn: el.querySelector('.win-ctrl-btn.max'),
          minimized: false,
          maximized: false,
          snapped: null,
          prevRect: { left, top, width: w, height: h },
          minW, minH,
          onClose, onResize,
          setTitle(t) {
            this.title = t;
            this.titleEl.textContent = t;
            renderTaskbar();
          }
        };

        this.windows.set(id, win);
        this._bindWindowEvents(win);
        this.focus(id);
        if (maximized || mobile) this.toggleMaximize(id, true);
        renderTaskbar();
        return win;
      },

      _bindWindowEvents(win) {
        const { el, id } = win;
        el.addEventListener('mousedown', () => this.focus(id));
        el.addEventListener('touchstart', () => this.focus(id), { passive: true });

        el.querySelector('.win-ctrl-btn.min').onclick = (e) => { e.stopPropagation(); this.minimize(id); };
        el.querySelector('.win-ctrl-btn.max').onclick = (e) => { e.stopPropagation(); this.toggleMaximize(id); };
        el.querySelector('.win-ctrl-btn.close').onclick = (e) => { e.stopPropagation(); this.close(id); };

        const tb = el.querySelector('.win-titlebar');
        tb.addEventListener('dblclick', (e) => {
          if (e.target.closest('.win-controls')) return;
          this.toggleMaximize(id);
        });

        // Drag titlebar + Aero Snap
        const onTitleDragStart = (e) => {
          if (e.target.closest('.win-controls')) return;
          if (e.type === 'mousedown' && e.button !== 0) return;
          if (isMobile()) return;
          e.preventDefault();
          this.focus(id);

          const pt0 = getClientXY(e);
          const layerRect = document.getElementById('windows-layer').getBoundingClientRect();
          let startRect = el.getBoundingClientRect();
          let wasMaximized = win.maximized || !!win.snapped;
          const offsetRatioX = (pt0.x - startRect.left) / Math.max(1, startRect.width);
          let grabOffX = pt0.x - startRect.left;
          let grabOffY = pt0.y - startRect.top;
          let snapZone = null;
          const snapEl = document.getElementById('snap-preview');

          // Disable iframe pointer events during drag
          document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');

          const onMove = (ev) => {
            const pt = getClientXY(ev);
            if (wasMaximized && (Math.abs(pt.x - pt0.x) > 6 || Math.abs(pt.y - pt0.y) > 6)) {
              wasMaximized = false;
              win.maximized = false;
              win.snapped = null;
              el.classList.remove('maximized');
              win.maxBtn.innerHTML = ico('max', 12);
              const pw = win.prevRect.width || 760;
              const ph = win.prevRect.height || 520;
              el.style.width = pw + 'px';
              el.style.height = ph + 'px';
              grabOffX = Math.round(pw * offsetRatioX);
              grabOffY = Math.min(20, Math.max(8, pt0.y - startRect.top));
            }
            if (wasMaximized) return;

            let nx = pt.x - layerRect.left - grabOffX;
            let ny = pt.y - layerRect.top - grabOffY;
            ny = Math.max(0, Math.min(layerRect.height - 38, ny));
            nx = Math.max(-el.offsetWidth + 80, Math.min(layerRect.width - 80, nx));
            el.style.left = nx + 'px';
            el.style.top = ny + 'px';

            // Detect Aero Snap zones
            const edge = 18;
            const corner = 72;
            const rx = pt.x - layerRect.left;
            const ry = pt.y - layerRect.top;
            const W = layerRect.width, H = layerRect.height;

            if (ry <= edge) {
              if (rx <= corner) snapZone = { type: 'tl', l: 0, t: 0, w: W / 2, h: H / 2 };
              else if (rx >= W - corner) snapZone = { type: 'tr', l: W / 2, t: 0, w: W / 2, h: H / 2 };
              else snapZone = { type: 'max', l: 0, t: 0, w: W, h: H };
            } else if (rx <= edge) {
              if (ry >= H - corner) snapZone = { type: 'bl', l: 0, t: H / 2, w: W / 2, h: H / 2 };
              else snapZone = { type: 'left', l: 0, t: 0, w: W / 2, h: H };
            } else if (rx >= W - edge) {
              if (ry >= H - corner) snapZone = { type: 'br', l: W / 2, t: H / 2, w: W / 2, h: H / 2 };
              else snapZone = { type: 'right', l: W / 2, t: 0, w: W / 2, h: H };
            } else {
              snapZone = null;
            }

            if (snapZone) {
              snapEl.style.left = (layerRect.left + snapZone.l + 6) + 'px';
              snapEl.style.top = (layerRect.top + snapZone.t + 6) + 'px';
              snapEl.style.width = (snapZone.w - 12) + 'px';
              snapEl.style.height = (snapZone.h - 12) + 'px';
              snapEl.classList.add('visible');
            } else {
              snapEl.classList.remove('visible');
            }
          };

          const onEnd = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
            snapEl.classList.remove('visible');

            if (snapZone) {
              if (snapZone.type === 'max') {
                this.toggleMaximize(id, true);
              } else {
                win.prevRect = { left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight };
                win.snapped = snapZone.type;
                el.classList.add('snapping');
                el.style.left = snapZone.l + 'px';
                el.style.top = snapZone.t + 'px';
                el.style.width = snapZone.w + 'px';
                el.style.height = snapZone.h + 'px';
                setTimeout(() => { el.classList.remove('snapping'); if (win.onResize) win.onResize(); }, 200);
              }
            } else if (!win.maximized) {
              win.prevRect = { left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight };
            }
          };

          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onEnd);
          document.addEventListener('touchmove', onMove, { passive: false });
          document.addEventListener('touchend', onEnd);
        };

        tb.addEventListener('mousedown', onTitleDragStart);
        tb.addEventListener('touchstart', onTitleDragStart, { passive: false });

        // 8-Way Resize
        el.querySelectorAll('.win-resize-handle').forEach((handle) => {
          const dir = handle.dataset.dir;
          const onResizeStart = (e) => {
            if (win.maximized || isMobile()) return;
            e.preventDefault();
            e.stopPropagation();
            this.focus(id);
            const pt0 = getClientXY(e);
            const initL = el.offsetLeft, initT = el.offsetTop, initW = el.offsetWidth, initH = el.offsetHeight;
            const layerRect = document.getElementById('windows-layer').getBoundingClientRect();
            document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');

            const onMove = (ev) => {
              const pt = getClientXY(ev);
              const dx = pt.x - pt0.x, dy = pt.y - pt0.y;
              let l = initL, t = initT, w = initW, h = initH;

              if (dir.includes('e')) w = Math.max(win.minW, Math.min(layerRect.width - initL, initW + dx));
              if (dir.includes('s')) h = Math.max(win.minH, Math.min(layerRect.height - initT, initH + dy));
              if (dir.includes('w')) {
                const nw = Math.max(win.minW, initW - dx);
                l = initL + (initW - nw);
                if (l < 0) { w = initW + initL; l = 0; } else w = nw;
              }
              if (dir.includes('n')) {
                const nh = Math.max(win.minH, initH - dy);
                t = initT + (initH - nh);
                if (t < 0) { h = initH + initT; t = 0; } else h = nh;
              }
              el.style.left = l + 'px';
              el.style.top = t + 'px';
              el.style.width = w + 'px';
              el.style.height = h + 'px';
              win.snapped = null;
              if (win.onResize) win.onResize();
            };

            const onEnd = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onEnd);
              document.removeEventListener('touchmove', onMove);
              document.removeEventListener('touchend', onEnd);
              document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
              win.prevRect = { left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight };
              if (win.onResize) win.onResize();
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
          };
          handle.addEventListener('mousedown', onResizeStart);
          handle.addEventListener('touchstart', onResizeStart, { passive: false });
        });
      },

      focus(id) {
        const win = this.windows.get(id);
        if (!win) return;
        if (win.minimized) {
          win.minimized = false;
          win.el.classList.remove('minimized');
        }
        this.windows.forEach(w => w.el.classList.remove('active'));
        win.el.style.zIndex = String(++this.zCounter);
        win.el.classList.add('active');
        this.activeId = id;
        renderTaskbar();
      },

      minimize(id) {
        const win = this.windows.get(id);
        if (!win) return;
        win.minimized = true;
        win.el.classList.add('minimized');
        win.el.classList.remove('active');
        if (this.activeId === id) {
          this.activeId = null;
          let topWin = null;
          this.windows.forEach(w => {
            if (!w.minimized && (!topWin || Number(w.el.style.zIndex) > Number(topWin.el.style.zIndex))) topWin = w;
          });
          if (topWin) this.focus(topWin.id);
        }
        renderTaskbar();
      },

      toggleMaximize(id, forceState) {
        const win = this.windows.get(id);
        if (!win) return;
        const target = forceState !== undefined ? forceState : !win.maximized;
        if (target && !win.maximized) {
          if (!win.snapped) {
            win.prevRect = { left: win.el.offsetLeft, top: win.el.offsetTop, width: win.el.offsetWidth, height: win.el.offsetHeight };
          }
          win.maximized = true;
          win.snapped = null;
          win.el.classList.add('maximized');
          win.maxBtn.innerHTML = ico('restore', 12);
        } else if (!target && win.maximized) {
          win.maximized = false;
          win.el.classList.remove('maximized');
          win.el.style.left = win.prevRect.left + 'px';
          win.el.style.top = win.prevRect.top + 'px';
          win.el.style.width = win.prevRect.width + 'px';
          win.el.style.height = win.prevRect.height + 'px';
          win.maxBtn.innerHTML = ico('max', 12);
        }
        if (win.onResize) setTimeout(() => win.onResize(), 40);
      },

      close(id) {
        const win = this.windows.get(id);
        if (!win) return;
        if (win.onClose) {
          try { if (win.onClose() === false) return; } catch (_) {}
        }
        win.el.remove();
        this.windows.delete(id);
        if (this.activeId === id) {
          this.activeId = null;
          let topWin = null;
          this.windows.forEach(w => {
            if (!w.minimized && (!topWin || Number(w.el.style.zIndex) > Number(topWin.el.style.zIndex))) topWin = w;
          });
          if (topWin) this.focus(topWin.id);
        }
        renderTaskbar();
      },

      setAeroPeek(active, highlightWinId = null) {
        const layer = document.getElementById('windows-layer');
        this.windows.forEach(w => w.el.classList.remove('peek-highlight'));
        if (active) {
          layer.classList.add('aero-peek-active');
          if (highlightWinId && this.windows.has(highlightWinId)) {
            this.windows.get(highlightWinId).el.classList.add('peek-highlight');
          }
        } else {
          layer.classList.remove('aero-peek-active');
        }
      },

      toggleShowDesktop() {
        const visibleIds = [];
        this.windows.forEach(w => { if (!w.minimized) visibleIds.push(w.id); });
        if (visibleIds.length > 0) {
          this._desktopHiddenBackup = visibleIds;
          visibleIds.forEach(id => this.minimize(id));
        } else if (this._desktopHiddenBackup) {
          this._desktopHiddenBackup.forEach(id => {
            const w = this.windows.get(id);
            if (w) { w.minimized = false; w.el.classList.remove('minimized'); }
          });
          const last = this._desktopHiddenBackup[this._desktopHiddenBackup.length - 1];
          if (last) this.focus(last);
          this._desktopHiddenBackup = null;
          renderTaskbar();
        }
      }
    };

    /* =====================================================================
       APP REGISTRY & SMART UNIFIED FILE/FOLDER DISPATCHER
       ===================================================================== */
    const APP_REGISTRY = [
      { id: 'explorer', name: '文件资源管理器', icon: 'folder', desktop: true, pinned: true, launch: (args) => launchExplorer(args) },
      { id: 'code', name: 'HTML / 代码编辑器', icon: 'html', desktop: true, pinned: true, launch: (args) => launchCodeEditor(args) },
      { id: 'notepad', name: '记事本', icon: 'fileText', desktop: true, pinned: false, launch: (args) => launchNotepad(args) },
      { id: 'spreadsheet', name: '数据表格', icon: 'table', desktop: false, pinned: false, launch: (args) => launchSpreadsheet(args) },
      { id: 'manga', name: '漫画阅读器', icon: 'manga', desktop: true, pinned: false, launch: (args) => launchMangaViewer(args) },
      { id: 'image', name: '图片查看器', icon: 'image', desktop: false, pinned: false, launch: (args) => launchImageViewer(args) },

      { id: 'settings', name: '系统设置', icon: 'settings', desktop: true, pinned: true, launch: (args) => launchSettings(args) }
    ];

    function launchApp(appId, args = {}) {
      const app = APP_REGISTRY.find(a => a.id === appId);
      if (app) return app.launch(args);
    }

    // Unified Smart Dispatcher — NEVER uses isLocal branching! Always fs.stat() first!
    async function openVfsPath(path, forceApp = null) {
      const n = normalizePath(path);
      let st;
      try {
        st = await fs.stat(n);
      } catch (err) {
        showToast(`无法访问路径: ${n} (${err.message})`, 'error');
        return;
      }

      if (st.isDirectory) {
        launchExplorer({ path: n });
        return;
      }

      if (forceApp) {
        const map = {
          code: () => launchCodeEditor({ path: n }),
          notepad: () => launchNotepad({ path: n }),
          browser: () => launchBrowser({ path: n }),
          manga: () => launchMangaViewer({ path: n }),
          image: () => launchImageViewer({ path: n }),
          spreadsheet: () => launchSpreadsheet({ path: n }),
          media: () => launchMediaPlayer({ path: n }),
          pdf: () => launchPDFViewer({ path: n }),
          archive: () => launchArchiveViewer({ path: n }),
          v86: () => launchV86({ path: n })
        };
        if (map[forceApp]) { map[forceApp](); return; }
      }

      const cat = getFileCategory(n, false);
      switch (cat) {
        case 'html': launchBrowser({ path: n }); break;
        case 'image': launchMangaViewer({ path: n }); break; // Default Manga Viewer per spec
        case 'table': launchSpreadsheet({ path: n }); break;
        case 'audio':
        case 'video': launchMediaPlayer({ path: n }); break;
        case 'pdf': launchPDFViewer({ path: n }); break;
        case 'archive': launchArchiveViewer({ path: n }); break;
        case 'vm': launchV86({ path: n }); break;
        case 'code': launchCodeEditor({ path: n }); break;
        case 'text': launchNotepad({ path: n }); break;
        default: launchNotepad({ path: n }); break; // Universal plain-text fallback
      }
    }

    /* =====================================================================
       DESKTOP ENVIRONMENT (Free Grid + Smooth Anim + Bidirectional DnD + Touch)
       ===================================================================== */
    const Desktop = {
      selectedKeys: new Set(),
      marquee: null,
      _thumbUrls: new Map(),

      init() {
        const el = document.getElementById('desktop');
        const marqueeEl = document.getElementById('desktop-marquee');

        this.marquee = createMarqueeSelector({
          container: el,
          marqueeEl,
          itemSelector: '.desktop-icon',
          onSelectionChange: (els) => {
            this.selectedKeys.clear();
            el.querySelectorAll('.desktop-icon').forEach(node => {
              const hit = els.has(node);
              node.classList.toggle('selected', hit);
              if (hit) this.selectedKeys.add(node.dataset.key);
            });
          }
        });

        // Desktop HTML5 DragOver & Drop (Internal reposition + Folder drop + Physical Import)
        el.addEventListener('dragover', (e) => {
          e.preventDefault();
          const isInternal = e.dataTransfer.types.includes('application/x-xuanyuan-vfs') ||
                             e.dataTransfer.types.includes('application/x-xuanyuan-app');
          e.dataTransfer.dropEffect = isInternal ? 'move' : 'copy';
          if (!isInternal) el.classList.add('drag-over-external');
        });

        el.addEventListener('dragleave', (e) => {
          if (e.target === el) el.classList.remove('drag-over-external');
        });

        el.addEventListener('drop', async (e) => {
          e.preventDefault();
          el.classList.remove('drag-over-external');
          if (e.target.closest('.desktop-icon.drop-target')) return;

          const deskRect = el.getBoundingClientRect();
          const dropX = e.clientX - deskRect.left;
          const dropY = e.clientY - deskRect.top;

          const appData = e.dataTransfer.getData('application/x-xuanyuan-app');
          if (appData) {
            try {
              const payload = JSON.parse(appData);
              const pos = this._computePlacePosition(dropX - (payload.offX || 42), dropY - (payload.offY || 42), payload.key);
              SettingsStore.data.desktopPositions[payload.key] = pos;
              SettingsStore.save();
              this.render();
            } catch (_) {}
            return;
          }

          const vfsRaw = e.dataTransfer.getData('application/x-xuanyuan-vfs');
          if (vfsRaw) {
            try {
              const payload = JSON.parse(vfsRaw);
              if (payload.source === 'desktop' && payload.key) {
                const pos = this._computePlacePosition(dropX - (payload.offX || 42), dropY - (payload.offY || 42), payload.key);
                SettingsStore.data.desktopPositions[payload.key] = pos;
                SettingsStore.save();
                this.render();
              } else if (payload.paths && payload.paths.length) {
                let moved = 0;
                for (const src of payload.paths) {
                  if (dirname(src) === '/Desktop') continue;
                  const dst = await fs.uniquePath('/Desktop', basename(src));
                  await fs.move(src, dst);
                  const k = 'file:' + dst;
                  SettingsStore.data.desktopPositions[k] = this._computePlacePosition(dropX - 42 + moved * 20, dropY - 42, k);
                  moved++;
                }
                if (moved > 0) {
                  SettingsStore.save();
                  showToast(`已移动 ${moved} 项到桌面（修改日期已保留）`, 'success');
                }
              }
            } catch (err) {
              showToast('拖拽移动失败: ' + err.message, 'error');
            }
            return;
          }

          // Reverse Import from Physical Desktop!
          const count = await importDataTransferToDir(e.dataTransfer, '/Desktop');
          if (count > 0) {
            showToast(`已从本地导入 ${count} 项到桌面`, 'success');
            this.render();
          }
        });

        // Desktop Right-Click Context Menu
        el.addEventListener('contextmenu', (e) => {
          if (e.target.closest('.desktop-icon')) return;
          e.preventDefault();
          showContextMenu(e.clientX, e.clientY, [

            { label: '新建文件夹', icon: 'folder', action: () => this.createFolder() },
            {
              label: '新建文件', icon: 'plus', submenu: [
                { label: '文本文档 (.txt)', icon: 'fileText', action: () => this.createFile('新建文档.txt', '') },
                { label: 'HTML 网页 (.html)', icon: 'html', action: () => this.createFile('新建网页.html', '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>新建页面</title>\n</head>\n<body>\n  <h1>你好，玄渊 OS</h1>\n</body>\n</html>') },
                { label: 'Markdown 笔记 (.md)', icon: 'code', action: () => this.createFile('笔记.md', '# 新建笔记\n') },
                { label: 'CSV 表格 (.csv)', icon: 'table', action: () => this.createFile('数据表.csv', '名称,分类,数值\n示例A,默认,100\n') }
              ]
            },
            { label: '粘贴到桌面', icon: 'paste', disabled: FSClipboard.paths.length === 0, action: () => FSClipboard.pasteInto('/Desktop') },
            { sep: true },
            { label: '上传本地文件到桌面', icon: 'upload', action: () => uploadViaFileInput('/Desktop') },
            { label: '挂载真实本地文件夹', icon: 'mount', action: () => mountLocalDirectoryFlow() },
            { label: '更换自定义壁纸', icon: 'image', action: () => uploadCustomWallpaper() },
            { sep: true },
            { label: document.fullscreenElement ? '退出全屏模式' : '进入全屏模式', icon: 'fullscreen', action: () => toggleBrowserFullscreen() },
            { label: '个性化与系统设置', icon: 'settings', action: () => launchSettings({ tab: 'appearance' }) }
          ]);
        });

        fs.on(debounce(() => this.render(), 120));
        window.addEventListener('resize', debounce(() => this.render(), 200));
      },

      _computePlacePosition(rawX, rawY, movingKey) {
        const el = document.getElementById('desktop');
        const gw = isMobile() ? 84 : 92;
        const gh = isMobile() ? 92 : 98;
        const pad = 12;
        const maxX = Math.max(pad, el.clientWidth - gw - 4);
        const maxY = Math.max(pad, el.clientHeight - gh - 4);

        let x = Math.max(pad, Math.min(maxX, rawX));
        let y = Math.max(pad, Math.min(maxY, rawY));

        if (SettingsStore.data.snapToGrid) {
          const col = Math.max(0, Math.round((x - pad) / gw));
          const row = Math.max(0, Math.round((y - pad) / gh));
          x = pad + col * gw;
          y = pad + row * gh;

          // Resolve collision smoothly to nearest open grid cell
          const occupied = new Set();
          for (const [k, p] of Object.entries(SettingsStore.data.desktopPositions)) {
            if (k !== movingKey && p) occupied.add(`${Math.round((p.x - pad) / gw)},${Math.round((p.y - pad) / gh)}`);
          }
          const maxRows = Math.max(1, Math.floor((el.clientHeight - pad) / gh));
          let c = col, r = row, guard = 0;
          while (occupied.has(`${c},${r}`) && guard++ < 200) {
            r++;
            if (r >= maxRows) { r = 0; c++; }
          }
          x = pad + c * gw;
          y = pad + r * gh;
        }
        return { x, y };
      },

      autoArrange() {
        SettingsStore.data.desktopPositions = {};
        SettingsStore.save();
        this.render();
        showToast('桌面图标已重新整齐排列', 'success', 1600);
      },

      async createFolder() {
        const name = await promptDialog('新建文件夹', '新建文件夹');
        if (!name) return;
        const p = await fs.uniquePath('/Desktop', name);
        await fs.mkdir(p, { recursive: true, mtime: Date.now() });
      },

      async createFile(defName, content) {
        const name = await promptDialog('新建文件', defName);
        if (!name) return;
        const p = await fs.uniquePath('/Desktop', name);
        await fs.writeFile(p, content, { mtime: Date.now() });
      },

      async render() {
        const el = document.getElementById('desktop');
        el.querySelectorAll('.desktop-icon').forEach(n => n.remove());
        if (!SettingsStore.data.showDesktopIcons) return;

        const items = [];
        const hidden = new Set(SettingsStore.data.hiddenApps || []);
        for (const app of APP_REGISTRY) {
          if (app.desktop && !hidden.has(app.id)) {
            items.push({ kind: 'app', key: 'app:' + app.id, id: app.id, name: app.name, icon: app.icon, color: 'var(--accent)' });
          }
        }

        // Load real files from /Desktop via unified window.fs
        try {
          if (await fs.exists('/Desktop')) {
            const names = await fs.readdir('/Desktop');
            names.sort(naturalCompare);
            for (const name of names) {
              const full = joinPath('/Desktop', name);
              const st = await fs.stat(full).catch(() => null);
              if (!st) continue;
              items.push({
                kind: 'file', key: 'file:' + full, path: full, name, isDir: st.isDirectory, stat: st,
                icon: getFileIconName(name, st.isDirectory),
                color: getFileIconColor(name, st.isDirectory)
              });
            }
          }
        } catch (_) {}

        const validKeys = new Set(items.map(i => i.key));
        for (const k of Array.from(this.selectedKeys)) {
          if (!validKeys.has(k)) this.selectedKeys.delete(k);
        }

        const gw = isMobile() ? 84 : 92;
        const gh = isMobile() ? 92 : 98;
        const pad = 12;
        const maxRows = Math.max(1, Math.floor((el.clientHeight - pad * 2) / gh));
        const posMap = SettingsStore.data.desktopPositions || {};
        const usedCells = new Set();
        for (const item of items) {
          const p = posMap[item.key];
          if (p) usedCells.add(`${Math.round((p.x - pad) / gw)},${Math.round((p.y - pad) / gh)}`);
        }

        let nextCol = 0, nextRow = 0;
        const allocFreeCell = () => {
          while (usedCells.has(`${nextCol},${nextRow}`)) {
            nextRow++;
            if (nextRow >= maxRows) { nextRow = 0; nextCol++; }
          }
          usedCells.add(`${nextCol},${nextRow}`);
          const res = { x: pad + nextCol * gw, y: pad + nextRow * gh };
          nextRow++;
          if (nextRow >= maxRows) { nextRow = 0; nextCol++; }
          return res;
        };

        const frag = document.createDocumentFragment();
        for (const item of items) {
          let pos = posMap[item.key];
          if (!pos) {
            pos = allocFreeCell();
            posMap[item.key] = pos;
          }

          const node = document.createElement('div');
          node.className = 'desktop-icon' + (this.selectedKeys.has(item.key) ? ' selected' : '');
          node.dataset.key = item.key;
          node.draggable = true; // Pure HTML5 DnD on desktop (NO mouse/pointer conflict!)
          node.style.left = pos.x + 'px';
          node.style.top = pos.y + 'px';
          node.title = item.kind === 'file' ? `${item.name}\n修改日期: ${formatDateTime(item.stat.mtime)}` : item.name;

          node.innerHTML = `
            <div class="desktop-icon-glyph" style="color:${item.color};">${ico(item.icon, 24)}</div>
            <div class="desktop-icon-label">${escapeHtml(item.name)}</div>
          `;

          // Lazy image thumbnail for desktop image files
          if (item.kind === 'file' && !item.isDir && IMAGE_EXTS.has(extname(item.name))) {
            this._loadDesktopThumb(item.path, node.querySelector('.desktop-icon-glyph'));
          }

          // Preload binary data on mouseenter/mousedown for synchronous drag-out!
          if (item.kind === 'file' && !item.isDir) {
            node.addEventListener('mouseenter', () => DragCache.prefetch(item.path));
            node.addEventListener('mousedown', () => DragCache.prefetch(item.path));
          }

          // HTML5 DragStart (Strictly Synchronous!)
          node.addEventListener('dragstart', (e) => {
            const rect = node.getBoundingClientRect();
            const offX = e.clientX - rect.left;
            const offY = e.clientY - rect.top;
            if (item.kind === 'app') {
              e.dataTransfer.effectAllowed = 'move';
              e.dataTransfer.setData('application/x-xuanyuan-app', JSON.stringify({ key: item.key, offX, offY }));
            } else {
              const selectedPaths = Array.from(this.selectedKeys)
                .filter(k => k.startsWith('file:'))
                .map(k => k.slice(5));
              const dragPaths = selectedPaths.includes(item.path) && selectedPaths.length > 1 ? selectedPaths : [item.path];
              populateDragTransferSync(e, dragPaths, { source: 'desktop', key: item.key, offX, offY });
            }
          });

          node.addEventListener('dragend', () => {
            if (item.kind === 'file' && !item.isDir) DragCache.scheduleRevoke(item.path);
          });

          // Drop onto desktop folder icon
          if (item.kind === 'file' && item.isDir) {
            node.addEventListener('dragover', (e) => {
              e.preventDefault();
              e.stopPropagation();
              node.classList.add('drop-target');
            });
            node.addEventListener('dragleave', () => node.classList.remove('drop-target'));
            node.addEventListener('drop', async (e) => {
              e.preventDefault();
              e.stopPropagation();
              node.classList.remove('drop-target');
              const vfsRaw = e.dataTransfer.getData('application/x-xuanyuan-vfs');
              if (vfsRaw) {
                const payload = JSON.parse(vfsRaw);
                for (const src of (payload.paths || [])) {
                  if (src === item.path) continue;
                  const dst = await fs.uniquePath(item.path, basename(src));
                  await fs.move(src, dst);
                }
                showToast(`已移动到 ${item.name}`, 'success');
              } else {
                const n = await importDataTransferToDir(e.dataTransfer, item.path);
                if (n > 0) showToast(`已导入 ${n} 项到 ${item.name}`, 'success');
              }
            });
          }

          // Mobile Touch Repositioning (touchstart/touchmove/touchend with touch-action: none)
          let touchState = null;
          node.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            touchState = {
              sx: t.clientX, sy: t.clientY,
              initL: parseFloat(node.style.left), initT: parseFloat(node.style.top),
              moved: false
            };
          }, { passive: true });

          node.addEventListener('touchmove', (e) => {
            if (!touchState || e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - touchState.sx, dy = t.clientY - touchState.sy;
            if (!touchState.moved && Math.hypot(dx, dy) > 10) {
              touchState.moved = true;
              node.classList.add('dragging-touch');
            }
            if (touchState.moved) {
              e.preventDefault();
              node.style.left = (touchState.initL + dx) + 'px';
              node.style.top = (touchState.initT + dy) + 'px';
            }
          }, { passive: false });

          node.addEventListener('touchend', async (e) => {
            if (!touchState) return;
            const st = touchState;
            touchState = null;
            node.classList.remove('dragging-touch');
            if (st.moved) {
              const t = e.changedTouches[0];
              const under = document.elementFromPoint(t.clientX, t.clientY)?.closest('.desktop-icon');
              if (under && under !== node && under.dataset.key?.startsWith('file:') && item.kind === 'file') {
                const targetPath = under.dataset.key.slice(5);
                const tStat = await fs.stat(targetPath).catch(() => null);
                if (tStat && tStat.isDirectory) {
                  const dst = await fs.uniquePath(targetPath, basename(item.path));
                  await fs.move(item.path, dst);
                  showToast(`已移动到 ${basename(targetPath)}`, 'success');
                  return;
                }
              }
              const pos = this._computePlacePosition(parseFloat(node.style.left), parseFloat(node.style.top), item.key);
              SettingsStore.data.desktopPositions[item.key] = pos;
              SettingsStore.save();
              this.render();
            }
          });

          // Default Single-Click Open (or double-click if user changed in Settings)
          const triggerOpen = () => {
            if (item.kind === 'app') launchApp(item.id);
            else openVfsPath(item.path);
          };

          node.addEventListener('click', (e) => {
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) {
              if (this.selectedKeys.has(item.key)) this.selectedKeys.delete(item.key);
              else this.selectedKeys.add(item.key);
              node.classList.toggle('selected', this.selectedKeys.has(item.key));
              return;
            }
            if (SettingsStore.data.singleClickOpen) {
              triggerOpen();
            } else {
              this.selectedKeys.clear();
              this.selectedKeys.add(item.key);
              el.querySelectorAll('.desktop-icon').forEach(n => n.classList.toggle('selected', n === node));
            }
          });

          node.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (!SettingsStore.data.singleClickOpen) triggerOpen();
          });

          // Icon Context Menu
          node.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!this.selectedKeys.has(item.key)) {
              this.selectedKeys.clear();
              this.selectedKeys.add(item.key);
              el.querySelectorAll('.desktop-icon').forEach(n => n.classList.toggle('selected', n === node));
            }
            if (item.kind === 'app') {
              showContextMenu(e.clientX, e.clientY, [
                { label: '打开应用', icon: item.icon, action: () => launchApp(item.id) },
                { label: '从桌面隐藏此应用', icon: 'close', action: () => {
                  const arr = new Set(SettingsStore.data.hiddenApps || []);
                  arr.add(item.id);
                  SettingsStore.save({ hiddenApps: Array.from(arr) });
                  Desktop.render();
                  renderStartMenu();
                } }
              ]);
            } else {
              const selPaths = Array.from(this.selectedKeys).filter(k => k.startsWith('file:')).map(k => k.slice(5));
              showFileContextMenu(e.clientX, e.clientY, item.path, selPaths.length ? selPaths : [item.path], () => this.render());
            }
          });

          frag.appendChild(node);
        }
        el.appendChild(frag);
      },

      async _loadDesktopThumb(path, box) {
        try {
          if (this._thumbUrls.has(path)) {
            box.innerHTML = `<img src="${this._thumbUrls.get(path)}" alt="" />`;
            return;
          }
          const bytes = await fs.readFile(path);
          const url = URL.createObjectURL(new Blob([bytes], { type: getMimeType(path) }));
          this._thumbUrls.set(path, url);
          if (box.isConnected) box.innerHTML = `<img src="${url}" alt="" />`;
        } catch (_) {}
      }
    };

    /* ---------- Mount Local Directory Flow (File System Access API -> /mnt/local/<name>) ---------- */
    async function mountLocalDirectoryFlow() {
      if (typeof window.showDirectoryPicker !== 'function') {
        showToast('当前浏览器不支持 File System Access API（请使用桌面版 Chrome / Edge）', 'error', 4200);
        return null;
      }
      const stopLoad = showToast('正在打开本地目录选择器并挂载...', 'info', 0);
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const name = dirHandle.name || '本地目录';
        const mountPoint = joinPath('/mnt/local', name);
        const backend = new LocalFSAABackend(dirHandle, name);
        fs.mount(mountPoint, backend);
        await MountHistory.record(name);
        stopLoad();
        showToast(`已挂载本地目录至 ${mountPoint}`, 'success');
        return mountPoint;
      } catch (err) {
        stopLoad();
        if (err && err.name !== 'AbortError') {
          showToast('挂载失败: ' + err.message, 'error');
        }
        return null;
      }
    }

    async function uploadCustomWallpaper() {
      const inp = document.getElementById('hidden-wallpaper-input');
      inp.value = '';
      inp.onchange = async () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        try {
          const ab = await f.arrayBuffer();
          await fs.mkdir('/Pictures/Wallpapers', { recursive: true });
          const dest = joinPath('/Pictures/Wallpapers', f.name);
          await fs.writeFile(dest, new Uint8Array(ab), { mtime: f.lastModified || Date.now() });
          SettingsStore.save({ customWallpaperPath: dest });
          showToast('自定义壁纸已持久化保存到 OPFS 并应用', 'success');
        } catch (err) {
          showToast('壁纸保存失败: ' + err.message, 'error');
        }
      };
      inp.click();
    }

      const sampleHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>

      cv.height = 1040;
      const ctx = cv.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 760, 1040);
      g.addColorStop(0, c1);
      g.addColorStop(1, '#07080c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 760, 1040);

      ctx.lineWidth = 3;
      ctx.strokeRect(36, 36, 688, 968);

      ctx.lineWidth = 1;
      for (let x = 76; x < 700; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 36); ctx.lineTo(x, 1004); ctx.stroke();
      }
      for (let y = 76; y < 980; y += 64) {
        ctx.beginPath(); ctx.moveTo(36, y); ctx.lineTo(724, y); ctx.stroke();
      }

      // Abstract architectural circles
      ctx.save();
      ctx.beginPath();
      ctx.arc(380, 440, 185, 0, Math.PI * 2);
      ctx.strokeStyle = c2;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(380, 440, 125, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(c2, 0.14);
      ctx.fill();
      ctx.restore();

      // Big chapter number
      ctx.fillStyle = c2;
      ctx.font = '700 96px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(num, 380, 474);

      // Title banner
      ctx.fillStyle = '#f2f4fa';
      ctx.font = '700 34px "Noto Sans SC", sans-serif';
      ctx.fillText(title, 380, 720);

      ctx.fillStyle = '#9aa5bc';
      ctx.font = '400 20px "Noto Sans SC", sans-serif';
      ctx.fillText(sub, 380, 768);

      // Dialogue speech box
      ctx.fillStyle = 'rgba(15, 18, 26, 0.88)';
      ctx.fillRect(100, 830, 560, 110);
      ctx.strokeStyle = c2;
      ctx.lineWidth = 2;
      ctx.strokeRect(100, 830, 560, 110);
      ctx.fillStyle = '#e5ebf5';
      ctx.font = '500 18px "Noto Sans SC", sans-serif';
      ctx.fillText('「在条漫阅读器中可按右上角进入纯黑沉浸全屏」', 380, 892);
