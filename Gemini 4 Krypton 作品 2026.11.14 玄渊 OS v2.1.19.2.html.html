      };

      const loadEntries = async () => {
        setLoading(true, state.cwd.startsWith('/mnt/local') ? '正在读取本地挂载目录...' : '正在加载文件列表...');
        try {
          let rawStats = [];
          const q = state.searchQuery.trim();
          if (q && state.globalSearch) {
            rawStats = await fs.searchRecursive('/', q, 300);
          } else {
            const names = await fs.readdir(state.cwd);
            const filtered = names.filter(n => !n.startsWith('.xuanyuan_') && (!q || n.toLowerCase().includes(q.toLowerCase())));
            const stats = await Promise.all(filtered.map(async (name) => {
              const full = joinPath(state.cwd, name);
              return fs.stat(full).catch(() => null);
            }));
            rawStats = stats.filter(Boolean);
          }

          // Enrich entries with type label and compute real directory sizes asynchronously
          state.entries = rawStats.map(st => ({
            ...st,
            typeLabel: getFileTypeLabel(st.name, st.isDirectory),
            actualSize: st.isDirectory ? null : st.size
          }));

          // Calculate accurate real folder sizes in parallel
          await Promise.all(state.entries.map(async (ent) => {
            if (ent.isDirectory) {
              ent.actualSize = await fs.getDirSize(ent.path).catch(() => 0);
            }
          }));

          state.entries = sortEntries(state.entries);
        } catch (err) {
          state.entries = [];
          showToast('读取目录失败: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      // Lazy thumbnail loader ONLY when Icons View is active
      const setupIconThumbnails = () => {
        if (state.thumbObserver) { state.thumbObserver.disconnect(); state.thumbObserver = null; }
        if (state.viewMode !== 'icons') return;
        const boxes = stageEl.querySelectorAll('[data-thumb-path]');
        if (!boxes.length) return;
        state.thumbObserver = new IntersectionObserver((entries) => {
          entries.forEach(async (ent) => {
            if (!ent.isIntersecting) return;
            const box = ent.target;
            const p = box.dataset.thumbPath;
            state.thumbObserver?.unobserve(box);
            if (!p) return;
            try {
              let url = state.thumbUrls.get(p);
              if (!url) {
                const bytes = await fs.readFile(p);
                url = URL.createObjectURL(new Blob([bytes], { type: getMimeType(p) }));
                state.thumbUrls.set(p, url);
              }
              if (box.isConnected) box.innerHTML = `<img src="${url}" alt="" loading="lazy" />`;
            } catch (_) {}
          });
        }, { root: viewportEl, rootMargin: '120px' });
        boxes.forEach(b => state.thumbObserver.observe(b));
      };

      // Attach unified item interaction (Click/Open, ContextMenu, Bidirectional DnD)
      const bindItemEvents = (el, ent) => {
        el.draggable = true;
        if (!ent.isDirectory) {
          el.addEventListener('mouseenter', () => DragCache.prefetch(ent.path));
          el.addEventListener('mousedown', () => DragCache.prefetch(ent.path));
        }

        el.addEventListener('dragstart', (e) => {
          const dragPaths = state.selectedPaths.has(ent.path) && state.selectedPaths.size > 1
            ? Array.from(state.selectedPaths)
            : [ent.path];
          populateDragTransferSync(e, dragPaths, { source: 'explorer' });
        });
        el.addEventListener('dragend', () => {
          if (!ent.isDirectory) DragCache.scheduleRevoke(ent.path);
        });

        if (ent.isDirectory) {
          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.add('drop-target');
          });
          el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
          el.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.remove('drop-target');
            const vfsRaw = e.dataTransfer.getData('application/x-xuanyuan-vfs');
            if (vfsRaw) {
              const payload = JSON.parse(vfsRaw);
              for (const src of (payload.paths || [])) {
                if (src === ent.path || dirname(src) === ent.path) continue;
                const dst = await fs.uniquePath(ent.path, basename(src));
                await fs.move(src, dst);
              }
              showToast(`已移动到 ${ent.name}（修改日期已保留）`, 'success');
              refresh();
            } else {
              const n = await importDataTransferToDir(e.dataTransfer, ent.path);
              if (n > 0) { showToast(`已导入 ${n} 项到 ${ent.name}`, 'success'); refresh(); }
            }
          });
        }

        const openItem = async () => {
          // Unified check via fs.stat (no isLocal!)
          const st = await fs.stat(ent.path).catch(() => null);
          if (!st) return;
          if (st.isDirectory) navigate(ent.path);
          else openVfsPath(ent.path);
        };

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (e.ctrlKey || e.metaKey) {
            if (state.selectedPaths.has(ent.path)) state.selectedPaths.delete(ent.path);
            else state.selectedPaths.add(ent.path);
            el.classList.toggle('selected', state.selectedPaths.has(ent.path));
            updateToolbarButtons();
            updateStatus();
            return;
          }
          state.selectedPaths.clear();
          state.selectedPaths.add(ent.path);
          viewportEl.querySelectorAll('.exp-selectable').forEach(n => n.classList.toggle('selected', n === el));
          updateToolbarButtons();
          updateStatus();
          if (SettingsStore.data.singleClickOpen) openItem();
        });

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (!SettingsStore.data.singleClickOpen) openItem();
        });

        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!state.selectedPaths.has(ent.path)) {
            state.selectedPaths.clear();
            state.selectedPaths.add(ent.path);
            viewportEl.querySelectorAll('.exp-selectable').forEach(n => n.classList.toggle('selected', n === el));
            updateToolbarButtons();
          }
          showFileContextMenu(e.clientX, e.clientY, ent.path, Array.from(state.selectedPaths), () => refresh());
        });
      };

      // Render View Content
      const renderStage = async () => {
        state.entries = sortEntries(state.entries);
        stageEl.innerHTML = '';

        if (state.viewMode === 'details') {
          const totalWidth = state.columns.reduce((s, c) => s + c.width, 0);
          const headerBar = document.createElement('div');
          headerBar.className = 'exp-details-header-bar';
          const headerCols = document.createElement('div');
          headerCols.className = 'exp-details-header-cols';

          state.columns.forEach((col, idx) => {
            const th = document.createElement('div');
            th.className = 'exp-col-head';
            th.style.width = col.width + 'px';
            th.draggable = true;
            const sortMark = state.sortBy === col.key ? (state.sortAsc ? ico('chevUp', 11) : ico('chevDown', 11)) : '';
            th.innerHTML = `<span>${escapeHtml(col.label)}</span><span style="color:var(--accent);display:flex;">${sortMark}</span><div class="exp-col-resizer"></div>`;

            // Sort on click
            th.addEventListener('click', (e) => {
              if (e.target.closest('.exp-col-resizer')) return;
              if (state.sortBy === col.key) state.sortAsc = !state.sortAsc;
              else { state.sortBy = col.key; state.sortAsc = true; }
              renderStage();
            });

            // Reorder columns via drag & drop
            th.addEventListener('dragstart', (e) => {
              if (e.target.closest('.exp-col-resizer')) { e.preventDefault(); return; }
              e.dataTransfer.setData('text/x-exp-col', String(idx));
            });
            th.addEventListener('dragover', (e) => {
              if (e.dataTransfer.types.includes('text/x-exp-col')) { e.preventDefault(); th.classList.add('drag-over-col'); }
            });
            th.addEventListener('dragleave', () => th.classList.remove('drag-over-col'));
            th.addEventListener('drop', (e) => {
              th.classList.remove('drag-over-col');
              const fromIdx = Number(e.dataTransfer.getData('text/x-exp-col'));
              if (!isNaN(fromIdx) && fromIdx !== idx) {
                const [moved] = state.columns.splice(fromIdx, 1);
                state.columns.splice(idx, 0, moved);
                renderStage();
              }
            });

            // Resizable column width (Mouse + Touch)
            const resizer = th.querySelector('.exp-col-resizer');
            const startResize = (e) => {
              e.preventDefault();
              e.stopPropagation();
              const x0 = getClientXY(e).x;
              const w0 = col.width;
              const onMove = (ev) => {
                const dx = getClientXY(ev).x - x0;
                col.width = Math.max(64, Math.min(600, w0 + dx));
                th.style.width = col.width + 'px';
                const newTotal = state.columns.reduce((s, c) => s + c.width, 0);
                rowsBox.querySelectorAll('.exp-detail-row').forEach(r => {
                  r.style.width = newTotal + 'px';
                  const cell = r.children[idx];
                  if (cell) cell.style.width = col.width + 'px';
                });
              };
              const onEnd = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
              };
              document.addEventListener('mousemove', onMove);
              document.addEventListener('mouseup', onEnd);
              document.addEventListener('touchmove', onMove, { passive: false });
              document.addEventListener('touchend', onEnd);
            };
            resizer.addEventListener('mousedown', startResize);
            resizer.addEventListener('touchstart', startResize, { passive: false });

            headerCols.appendChild(th);
          });

          headerBar.appendChild(headerCols);
          stageEl.appendChild(headerBar);

          // Strict Windows Details rows: width = sum of columns ONLY (right area stays blank marquee canvas!)
          const rowsBox = document.createElement('div');
          rowsBox.className = 'exp-details-rows';

          if (state.entries.length === 0) {
            rowsBox.innerHTML = `<div style="padding:36px 24px;color:var(--text-muted);font-size:12.5px;">此文件夹为空 — 可拖入本地文件或右键新建</div>`;
          } else {
            for (const ent of state.entries) {
              const row = document.createElement('div');
              row.className = 'exp-detail-row exp-selectable' + (state.selectedPaths.has(ent.path) ? ' selected' : '');
              row.dataset.path = ent.path;
              row.style.width = totalWidth + 'px';

              for (const col of state.columns) {
                const cell = document.createElement('div');
                cell.className = `exp-cell col-${col.key}`;
                cell.style.width = col.width + 'px';
                if (col.key === 'name') {
                  const color = getFileIconColor(ent.name, ent.isDirectory);
                  cell.innerHTML = `<span style="color:${color};display:flex;flex-shrink:0;">${ico(getFileIconName(ent.name, ent.isDirectory), 15)}</span><span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(ent.name)}</span>`;
                } else if (col.key === 'mtime') {
                  cell.textContent = formatDateTime(ent.mtime);
                } else if (col.key === 'type') {
                  cell.textContent = ent.typeLabel;
                } else if (col.key === 'size') {
                  cell.textContent = formatBytes(ent.actualSize ?? ent.size);
                }
                row.appendChild(cell);
              }
              bindItemEvents(row, ent);
              rowsBox.appendChild(row);
            }
          }
          stageEl.appendChild(rowsBox);
        } else if (state.viewMode === 'icons') {
          const grid = document.createElement('div');
          grid.className = 'exp-icons-grid';
          if (state.entries.length === 0) {
            grid.innerHTML = `<div style="padding:32px;color:var(--text-muted);">此文件夹为空</div>`;
          } else {
            for (const ent of state.entries) {
              const card = document.createElement('div');
              card.className = 'exp-icon-card exp-selectable' + (state.selectedPaths.has(ent.path) ? ' selected' : '');
              card.dataset.path = ent.path;
              const isImg = !ent.isDirectory && IMAGE_EXTS.has(extname(ent.name));
              const color = getFileIconColor(ent.name, ent.isDirectory);
              card.innerHTML = `
                <div class="exp-thumb-box" style="color:${color};" ${isImg ? `data-thumb-path="${escapeHtml(ent.path)}"` : ''}>
                  ${ico(getFileIconName(ent.name, ent.isDirectory), 28)}
                </div>
                <div class="exp-icon-name">${escapeHtml(ent.name)}</div>`;
              bindItemEvents(card, ent);
              grid.appendChild(card);
            }
          }
          stageEl.appendChild(grid);
          setupIconThumbnails();
        } else if (state.viewMode === 'list') {
          const listWrap = document.createElement('div');
          listWrap.className = 'exp-list-wrap';
          for (const ent of state.entries) {
            const item = document.createElement('div');
            item.className = 'exp-list-item exp-selectable' + (state.selectedPaths.has(ent.path) ? ' selected' : '');
            item.dataset.path = ent.path;
            const color = getFileIconColor(ent.name, ent.isDirectory);
            item.innerHTML = `<span style="color:${color};display:flex;">${ico(getFileIconName(ent.name, ent.isDirectory), 15)}</span><span>${escapeHtml(ent.name)}</span>`;
            bindItemEvents(item, ent);
            listWrap.appendChild(item);
          }
          stageEl.appendChild(listWrap);
        } else if (state.viewMode === 'columns') {
          // Miller Columns View (分栏视图)
          const colsWrap = document.createElement('div');
          colsWrap.className = 'exp-columns-wrap';
          const parts = state.cwd === '/' ? [] : state.cwd.slice(1).split('/');
          const chain = ['/'];
          let cur = '';
          for (const seg of parts) { cur += '/' + seg; chain.push(cur); }

          for (let ci = 0; ci < chain.length; ci++) {
            const colPath = chain[ci];
            const nextSel = chain[ci + 1] || null;
            const colEl = document.createElement('div');
            colEl.className = 'exp-miller-col';
            const names = await fs.readdir(colPath).catch(() => []);
            const stats = (await Promise.all(names.filter(n => !n.startsWith('.xuanyuan_')).map(async n => {
              return fs.stat(joinPath(colPath, n)).catch(() => null);
            }))).filter(Boolean);
            stats.sort((a, b) => (a.isDirectory !== b.isDirectory ? (a.isDirectory ? -1 : 1) : naturalCompare(a.name, b.name)));

            for (const st of stats) {
              const row = document.createElement('div');
              row.className = 'exp-miller-item exp-selectable' + ((nextSel === st.path || state.selectedPaths.has(st.path)) ? ' selected' : '');
              row.dataset.path = st.path;
              const color = getFileIconColor(st.name, st.isDirectory);
              row.innerHTML = `<span style="color:${color};display:flex;">${ico(getFileIconName(st.name, st.isDirectory), 15)}</span>
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(st.name)}</span>
                ${st.isDirectory ? `<span style="color:var(--text-muted);">${ico('chevRight', 12)}</span>` : ''}`;
              bindItemEvents(row, { ...st, typeLabel: getFileTypeLabel(st.name, st.isDirectory) });
              colEl.appendChild(row);
            }
            colsWrap.appendChild(colEl);
          }
          stageEl.appendChild(colsWrap);
          colsWrap.scrollLeft = colsWrap.scrollWidth;
        }

        updateToolbarButtons();
        updateStatus();
      };

      const navigate = async (targetPath, pushHistory = true) => {
        const n = normalizePath(targetPath);
        state.cwd = n;
        state.selectedPaths.clear();
        if (pushHistory) {
          state.history = state.history.slice(0, state.histIdx + 1);
          if (state.history[state.histIdx] !== n) {
            state.history.push(n);
            state.histIdx = state.history.length - 1;
          }
        }
        win.setTitle(`文件资源管理器 — ${n}`);
        renderBreadcrumbs();
        renderSidebar();
        await loadEntries();
        await renderStage();
      };

      const refresh = async () => {
        renderSidebar();
        await loadEntries();
        await renderStage();
      };

      // Viewport Drop (Internal Move or Reverse Import from Physical Desktop)
      viewportEl.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('text/x-exp-col')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = e.dataTransfer.types.includes('application/x-xuanyuan-vfs') ? 'move' : 'copy';
      });
      viewportEl.addEventListener('drop', async (e) => {
        if (e.dataTransfer.types.includes('text/x-exp-col')) return;
        if (e.target.closest('.drop-target')) return;
        e.preventDefault();
        const vfsRaw = e.dataTransfer.getData('application/x-xuanyuan-vfs');
        if (vfsRaw) {
          const payload = JSON.parse(vfsRaw);
          let moved = 0;
          for (const src of (payload.paths || [])) {
            if (dirname(src) === state.cwd || src === state.cwd) continue;
            const dst = await fs.uniquePath(state.cwd, basename(src));
            await fs.move(src, dst);
            moved++;
          }
          if (moved > 0) { showToast(`已移动 ${moved} 项（修改日期已保留）`, 'success'); refresh(); }
        } else {
          setLoading(true, '正在导入本地文件...');
          const count = await importDataTransferToDir(e.dataTransfer, state.cwd);
          setLoading(false);
          if (count > 0) { showToast(`已导入 ${count} 项到 ${state.cwd}`, 'success'); refresh(); }
        }
      });

      // Blank viewport context menu
      viewportEl.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.exp-selectable')) return;
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, [
          { label: '刷新', icon: 'refresh', action: () => refresh() },
          { sep: true },
          { label: '新建文件夹', icon: 'folder', action: async () => {
            const name = await promptDialog('新建文件夹', '新建文件夹');
            if (name) { await fs.mkdir(await fs.uniquePath(state.cwd, name), { recursive: true, mtime: Date.now() }); refresh(); }
          } },
          { label: '新建文本文档', icon: 'fileText', action: async () => {
            const name = await promptDialog('新建文件', '新建文档.txt');
            if (name) { await fs.writeFile(await fs.uniquePath(state.cwd, name), '', { mtime: Date.now() }); refresh(); }
          } },
          { label: '粘贴', icon: 'paste', disabled: FSClipboard.paths.length === 0, action: async () => { await FSClipboard.pasteInto(state.cwd); refresh(); } },
          { sep: true },
          { label: '上传本地文件到此目录', icon: 'upload', action: async () => { await uploadViaFileInput(state.cwd); refresh(); } },
          { label: '挂载真实本地文件夹', icon: 'mount', action: async () => { const mp = await mountLocalDirectoryFlow(); if (mp) navigate(mp); } },
          { sep: true },
          { label: document.fullscreenElement ? '退出全屏' : '进入全屏', icon: 'fullscreen', action: () => toggleBrowserFullscreen() }
        ]);
      });

      // Toolbar Actions
      root.addEventListener('click', async (e) => {
        const viewBtn = e.target.closest('[data-view]');
        if (viewBtn) { state.viewMode = viewBtn.dataset.view; renderStage(); return; }
        const actBtn = e.target.closest('[data-act]');
        if (!actBtn) return;
        const act = actBtn.dataset.act;
        if (act === 'toggle-side') sidebarEl.classList.toggle('mobile-open');
        else if (act === 'back' && state.histIdx > 0) navigate(state.history[--state.histIdx], false);
        else if (act === 'forward' && state.histIdx < state.history.length - 1) navigate(state.history[++state.histIdx], false);
        else if (act === 'up' && state.cwd !== '/') navigate(dirname(state.cwd));
        else if (act === 'refresh') refresh();
        else if (act === 'toggle-global') {
          state.globalSearch = !state.globalSearch;
          searchInput.placeholder = state.globalSearch ? '全局搜索全盘文件...' : '搜索当前目录...';
          updateToolbarButtons();
          if (state.searchQuery.trim()) refresh();
        }
        else if (act === 'touch-marquee') { state.touchMarqueeMode = !state.touchMarqueeMode; updateToolbarButtons(); }
        else if (act === 'new-folder') {
          const name = await promptDialog('新建文件夹', '新建文件夹');
          if (name) { await fs.mkdir(await fs.uniquePath(state.cwd, name), { recursive: true, mtime: Date.now() }); refresh(); }
        }
        else if (act === 'new-file') {
          const name = await promptDialog('新建文件', '新建文档.txt');
          if (name) { await fs.writeFile(await fs.uniquePath(state.cwd, name), '', { mtime: Date.now() }); refresh(); }
        }
        else if (act === 'upload') { await uploadViaFileInput(state.cwd); refresh(); }
        else if (act === 'mount') {
          setLoading(true, '等待选择本地目录...');
          const mp = await mountLocalDirectoryFlow();
          setLoading(false);
          if (mp) navigate(mp);
        }
        else if (act === 'copy' && state.selectedPaths.size) { FSClipboard.set('copy', Array.from(state.selectedPaths)); updateToolbarButtons(); }
        else if (act === 'paste') { await FSClipboard.pasteInto(state.cwd); refresh(); }
        else if (act === 'export' && state.selectedPaths.size) {
          for (const p of state.selectedPaths) await exportVfsPathToDevice(p);
        }
        else if (act === 'delete' && state.selectedPaths.size) {
          const ok = await confirmDialog('删除确认', `确定删除选中的 ${state.selectedPaths.size} 个项目吗？`, true);
          if (ok) {
            for (const p of state.selectedPaths) await fs.rm(p).catch(() => {});
            state.selectedPaths.clear();
            refresh();
          }
        }
      });

      searchInput.addEventListener('input', debounce(() => {
        state.searchQuery = searchInput.value;
        refresh();
      }, 260));

      const unsubFs = fs.on(debounce(() => {
        if (!state.loading) refresh();
      }, 300));

      win.onClose = () => {
        marqueeCtrl.destroy();
        unsubFs();
        if (state.thumbObserver) state.thumbObserver.disconnect();
        state.thumbUrls.forEach(u => URL.revokeObjectURL(u));
      };

      navigate(state.cwd, false);
      return win;
    }

    /* -------------------- 2. HTML / CODE EDITOR (CodeMirror 5.65.x) -------------------- */
    function launchCodeEditor({ path = null } = {}) {
      const win = WM.create({
        appId: 'code',
        title: path ? `代码编辑器 — ${basename(path)}` : 'HTML / 代码编辑器 — 未命名.html',
        icon: 'html',
        width: 1060,
        height: 660,
        minW: 420,
        minH: 320
      });

      const LANG_MODES = [
        { id: 'htmlmixed', label: 'HTML', ext: 'html', mime: 'text/html' },
        { id: 'css', label: 'CSS', ext: 'css', mime: 'text/css' },
        { id: 'javascript', label: 'JavaScript', ext: 'js', mime: 'text/javascript' },
        { id: 'application/json', label: 'JSON', ext: 'json', mime: 'application/json' },
        { id: 'markdown', label: 'Markdown', ext: 'md', mime: 'text/markdown' },
        { id: 'xml', label: 'XML / SVG', ext: 'svg', mime: 'image/svg+xml' }
      ];

      function detectModeByExt(filePath) {
        if (!filePath) return 'htmlmixed';
        const ext = extname(filePath);
        if (ext === 'html' || ext === 'htm') return 'htmlmixed';
        if (ext === 'css') return 'css';
        if (ext === 'js' || ext === 'mjs') return 'javascript';
        if (ext === 'json') return 'application/json';
        if (ext === 'md' || ext === 'markdown') return 'markdown';
        if (ext === 'xml' || ext === 'svg') return 'xml';
        return 'htmlmixed';
      }

      const state = {
        filePath: path ? normalizePath(path) : null,
        saveDir: path ? dirname(path) : '/Desktop',
        mode: detectModeByExt(path),
        layout: 'split', // 'split' | 'code' | 'preview'
        splitDir: 'horizontal', // 'horizontal' | 'vertical'
        inputMode: 'auto', // 'auto' | 'desktop' | 'mobile'
        cm: null,
        fallbackTa: null,
        previewBlobUrl: null,
        selChangeHandler: null,
        dirty: false
      };

      win.body.innerHTML = `
        <div class="ide-root">
          <div class="ide-toolbar">
            <select class="select-ctrl" data-id="lang" title="语言模式" style="height:26px;font-size:11.5px;">
              ${LANG_MODES.map(m => `<option value="${m.id}" ${m.id === state.mode ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
            <button class="btn btn-sm btn-primary" data-act="save">${ico('save', 13)}<span>保存</span></button>
            <button class="btn btn-sm" data-act="refresh-preview">${ico('refresh', 13)}<span>刷新预览</span></button>
            <button class="btn btn-sm" data-act="format">${ico('sparkle', 13)}<span>格式化</span></button>
            <button class="btn btn-sm" data-act="find">${ico('search', 13)}<span>查找替换</span></button>
            <button class="btn btn-sm" data-act="undo">${ico('undo', 13)}<span>撤销</span></button>
            <button class="btn btn-sm" data-act="redo">${ico('redo', 13)}<span>重做</span></button>
            <button class="btn btn-sm" data-act="select-all">${ico('marquee', 13)}<span>全选</span></button>
            <button class="btn btn-sm" data-act="copy-all">${ico('copy', 13)}<span>复制全部</span></button>
            <button class="btn btn-sm" data-act="import">${ico('upload', 13)}<span>导入</span></button>
            <button class="btn btn-sm" data-act="export">${ico('download', 13)}<span>导出</span></button>
            <button class="btn btn-sm" data-act="open-tab">${ico('external', 13)}<span>在新窗口打开</span></button>
            <button class="btn btn-sm btn-danger" data-act="clear">${ico('trash', 13)}<span>清空</span></button>
            <div style="width:1px;height:18px;background:var(--border);margin:0 2px;"></div>
            <button class="btn btn-sm" data-act="input-mode" title="切换 CodeMirror inputStyle 输入模式">${ico('desktop', 13)}<span data-id="input-mode-lbl">模式: 自动</span></button>
            <button class="btn btn-sm" data-act="layout-code">${ico('code', 13)}<span>仅代码</span></button>
            <button class="btn btn-sm btn-active" data-act="layout-split">${ico('splitH', 13)}<span>分屏</span></button>
            <button class="btn btn-sm" data-act="layout-preview">${ico('globe', 13)}<span>仅预览</span></button>
            <button class="btn btn-sm" data-act="split-dir">${ico('splitV', 13)}<span data-id="split-dir-lbl">左右分屏</span></button>
          </div>
          <div class="ide-findbar" data-id="findbar">
            <input class="input-ctrl" data-id="find-q" placeholder="查找内容..." style="height:26px;width:165px;" />
            <input class="input-ctrl" data-id="replace-q" placeholder="替换为..." style="height:26px;width:165px;" />
            <button class="btn btn-sm" data-act="find-prev">${ico('chevUp', 12)}<span>上一个</span></button>
            <button class="btn btn-sm" data-act="find-next">${ico('chevDown', 12)}<span>下一个</span></button>
            <button class="btn btn-sm" data-act="replace-one">${ico('edit', 12)}<span>替换</span></button>
            <button class="btn btn-sm" data-act="replace-all">${ico('check', 12)}<span>全部替换</span></button>
            <span data-id="find-info" style="font-size:11.5px;color:var(--text-muted);"></span>
            <button class="btn btn-sm btn-ghost" data-act="find-close" style="margin-left:auto;">${ico('close', 12)}<span>关闭</span></button>
          </div>
          <div class="ide-workspace" data-id="workspace">
            <div class="ide-pane-code" data-id="pane-code">
              <div class="dark-load-mask" data-id="cm-loader">
                <span class="spinner" style="width:24px;height:24px;"></span>
                <span>正在加载 CodeMirror 5.65 编辑内核...</span>
              </div>
            </div>
            <div class="ide-splitter" data-id="splitter"></div>
            <div class="ide-pane-preview" data-id="pane-preview">
              <div class="dark-load-mask" data-id="preview-mask">
                <span class="spinner"></span>
                <span>正在渲染实时预览...</span>
              </div>
              <iframe data-id="iframe" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
            </div>
          </div>
          <div class="ide-statusbar">
            <span data-id="st-cursor">行 1, 列 1</span>
            <span data-id="st-sel"></span>
            <span data-id="st-counts">总 1 行 | 0 字符</span>
            <span style="flex:1;"></span>
            <span data-id="st-lang">HTML</span>
            <span>UTF-8</span>
          </div>
        </div>
      `;

      const q = (id) => win.body.querySelector(`[data-id="${id}"]`);
      const paneCode = q('pane-code');
      const panePreview = q('pane-preview');
      const splitter = q('splitter');
      const workspace = q('workspace');
      const iframe = q('iframe');
      const previewMask = q('preview-mask');
      const cmLoader = q('cm-loader');
      const langSel = q('lang');

      const getValue = () => state.cm ? state.cm.getValue() : (state.fallbackTa ? state.fallbackTa.value : '');
      const setValue = (v) => {
        if (state.cm) state.cm.setValue(v);
        else if (state.fallbackTa) state.fallbackTa.value = v;
      };

      const updateTitle = () => {
        const name = state.filePath ? basename(state.filePath) : '未命名.' + (LANG_MODES.find(m => m.id === state.mode)?.ext || 'html');
        win.setTitle(`HTML / 代码编辑器 — ${name}${state.dirty ? ' *' : ''}`);
      };

      const updateStatusBar = () => {
        const txt = getValue();
        const lines = txt.split('\n').length;
        const langObj = LANG_MODES.find(m => m.id === state.mode) || LANG_MODES[0];
        q('st-lang').textContent = langObj.label;
        q('st-counts').textContent = `总 ${lines} 行 | ${txt.length} 字符`;

        if (state.cm) {
          const cur = state.cm.getCursor();
          q('st-cursor').textContent = `行 ${cur.line + 1}, 列 ${cur.ch + 1}`;
          const sel = state.cm.getSelection();
          q('st-sel').textContent = sel.length > 0 ? `已选 ${sel.length} 字符` : '';
        } else if (state.fallbackTa) {
          const pos = state.fallbackTa.selectionStart || 0;
          const upTo = txt.slice(0, pos).split('\n');
          q('st-cursor').textContent = `行 ${upTo.length}, 列 ${upTo[upTo.length - 1].length + 1}`;
          const selLen = Math.abs((state.fallbackTa.selectionEnd || 0) - pos);
          q('st-sel').textContent = selLen > 0 ? `已选 ${selLen} 字符` : '';
        }
      };

      // Build isolated HTML string for preview iframe
      const buildPreviewHtml = () => {
        const code = getValue();
        if (state.mode === 'htmlmixed') return code;
        if (state.mode === 'xml') {
          if (code.trim().startsWith('<svg')) {
            return `<!DOCTYPE html><html><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#111520;">${code}</body></html>`;
          }
          return `<!DOCTYPE html><html><body style="margin:16px;background:#111520;color:#d6e0f0;font-family:monospace;white-space:pre-wrap;">${escapeHtml(code)}</body></html>`;
        }
        if (state.mode === 'markdown') {
          const rendered = renderSimpleMarkdown(code);
          return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
            body{margin:0;padding:24px 28px;background:#111520;color:#e6ecf7;font-family:-apple-system,sans-serif;line-height:1.75;max-width:780px;}
            h1,h2,h3{color:#e09f42;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:6px;}
            code{background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;font-family:monospace;}
            pre{background:#090c12;padding:14px;border-radius:8px;overflow:auto;border:1px solid rgba(255,255,255,0.08);}
            pre code{background:none;padding:0;}
            blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid #e09f42;background:rgba(224,159,66,0.08);}
            a{color:#58b8e5;}
          </style></head><body>${rendered}</body></html>`;
        }
        if (state.mode === 'css') {
          return `<!DOCTYPE html><html><head><style>${code}</style></head><body style="padding:20px;font-family:sans-serif;"><h2>CSS 样式预览沙盒</h2><p>段落示例文本与 <a href="#">链接样式</a></p><button>示例按钮</button><div class="box">区块元素 (.box)</div></body></html>`;
        }
        if (state.mode === 'javascript') {
          return `<!DOCTYPE html><html><body style="margin:0;padding:16px;background:#0c1018;color:#d8e3f5;font-family:monospace;font-size:13px;"><div style="color:#e09f42;margin-bottom:8px;">JavaScript 控制台输出：</div><pre id="c" style="white-space:pre-wrap;"></pre><script>
            const out=document.getElementById('c');
            const log=(...a)=>{ out.textContent += a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ') + '\\n'; };
            console.log=log; console.info=log; console.warn=(...a)=>log('[WARN]',...a); console.error=(...a)=>log('[ERR]',...a);
            try { ${code} } catch(e) { log('Uncaught ' + e.stack); }
          <\/script></body></html>`;
        }
        if (state.mode === 'application/json') {
          let pretty = code;
          let errMsg = '';
          try { pretty = JSON.stringify(JSON.parse(code), null, 2); } catch (e) { errMsg = e.message; }
          return `<!DOCTYPE html><html><body style="margin:0;padding:16px;background:#0e121a;color:#d4e0f0;font-family:monospace;font-size:13px;">
            ${errMsg ? `<div style="color:#e5534b;margin-bottom:10px;">JSON 语法错误: ${escapeHtml(errMsg)}</div>` : '<div style="color:#3fb984;margin-bottom:10px;">JSON 校验通过</div>'}
            <pre style="white-space:pre-wrap;">${escapeHtml(pretty)}</pre></body></html>`;
        }
        return code;
      };

      const renderPreview = () => {
        if (state.layout === 'code') return;
        previewMask.classList.remove('hidden');
        const html = buildPreviewHtml();
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const nextUrl = URL.createObjectURL(blob);
        iframe.onload = () => previewMask.classList.add('hidden');
        iframe.src = nextUrl;
        if (state.previewBlobUrl) {
          const old = state.previewBlobUrl;
          setTimeout(() => URL.revokeObjectURL(old), 1500);
        }
        state.previewBlobUrl = nextUrl;
      };
      const debouncedPreview = debounce(renderPreview, 320);

      // Formatter preserving exact cursor position!
      const formatCode = () => {
        const cur = state.cm ? { ...state.cm.getCursor() } : null;
        const raw = getValue();
        let formatted = raw;
        try {
          if (state.mode === 'application/json') {
            formatted = JSON.stringify(JSON.parse(raw), null, 2);
          } else if (state.mode === 'htmlmixed' || state.mode === 'xml') {
            formatted = formatMarkup(raw);
          } else if (state.mode === 'css') {
            formatted = formatCSS(raw);
          } else if (state.mode === 'javascript') {
            formatted = formatJS(raw);
          } else {
            formatted = raw.replace(/[ \t]+$/gm, '');
          }
          setValue(formatted);
          if (state.cm && cur) {
            const maxLine = state.cm.lineCount() - 1;
            const targetLine = Math.min(cur.line, maxLine);
            const targetCh = Math.min(cur.ch, state.cm.getLine(targetLine).length);
            state.cm.setCursor({ line: targetLine, ch: targetCh });
            state.cm.focus();
          }
          showToast('代码格式化完成', 'success', 1500);
        } catch (err) {
          showToast('格式化失败: ' + err.message, 'error');
        }
      };

      // Save to VFS (Ctrl+S) -> source dir or /Desktop
      const saveToVFS = async () => {
        const content = getValue();
        let target = state.filePath;
        if (!target) {
          const ext = LANG_MODES.find(m => m.id === state.mode)?.ext || 'html';
          const name = await promptDialog('保存到虚拟桌面', `新建代码.${ext}`);
          if (!name) return;
          target = joinPath(state.saveDir || '/Desktop', name);
          state.filePath = target;
        }
        try {
          await fs.writeFile(target, content, { mtime: Date.now() });
          state.dirty = false;
          updateTitle();
          Desktop.render();
          showToast(`已保存至 ${target}`, 'success', 1800);
        } catch (err) {
          showToast('保存失败: ' + err.message, 'error');
        }
      };

      // Export dialog: custom name + physical desktop OR virtual desktop
      const exportFlow = () => {
        const langObj = LANG_MODES.find(m => m.id === state.mode) || LANG_MODES[0];
        const defName = state.filePath ? basename(state.filePath) : `xuanyuan_export.${langObj.ext}`;
        showModal({
          title: '导出代码文件',
          confirmText: '导出到现实桌面 (下载)',
          cancelText: '取消',
          bodyHtml: `
            <div style="display:flex;flex-direction:column;gap:10px;">
              <label style="font-size:12px;color:var(--text-secondary);">自定义导出文件名（自动匹配当前语言后缀 .${langObj.ext}）：</label>
              <input class="input-ctrl" id="exp-fname" value="${escapeHtml(defName)}" style="width:100%;" />
              <button class="btn" id="exp-to-virtual" type="button">${ico('desktop', 14)}<span>导出到虚拟桌面 (/Desktop)</span></button>
            </div>`,
          onOpen(modalRoot, close) {
            const inp = modalRoot.querySelector('#exp-fname');
            setTimeout(() => inp.focus(), 20);
            modalRoot.querySelector('#exp-to-virtual').onclick = async () => {
              const name = inp.value.trim() || defName;
              const dest = await fs.uniquePath('/Desktop', name);
              await fs.writeFile(dest, getValue(), { mtime: Date.now() });
              Desktop.render();
              showToast(`已导出到虚拟桌面: ${basename(dest)}`, 'success');
              close(false);
            };
            modalRoot.querySelector('#m-ok').onclick = () => {
              const name = inp.value.trim() || defName;
              triggerBrowserDownload(getValue(), name, langObj.mime);
              showToast(`已下载到现实桌面: ${name}`, 'success');
              close(true);
            };
          }
        });
      };

      // Apply Layout (code / split / preview & horizontal / vertical)
      const applyLayout = () => {
        workspace.classList.toggle('dir-vertical', state.splitDir === 'vertical');
        paneCode.style.display = state.layout === 'preview' ? 'none' : '';
        splitter.style.display = state.layout === 'split' ? '' : 'none';
        panePreview.style.display = state.layout === 'code' ? 'none' : '';
        if (state.layout !== 'split') {
          paneCode.style.flex = '1 1 100%';
          panePreview.style.flex = '1 1 100%';
        } else {
          paneCode.style.flex = '1 1 50%';
          panePreview.style.flex = '1 1 50%';
        }
        win.body.querySelector('[data-act="layout-code"]').classList.toggle('btn-active', state.layout === 'code');
        win.body.querySelector('[data-act="layout-split"]').classList.toggle('btn-active', state.layout === 'split');
        win.body.querySelector('[data-act="layout-preview"]').classList.toggle('btn-active', state.layout === 'preview');
        q('split-dir-lbl').textContent = state.splitDir === 'horizontal' ? '左右分屏' : '上下分屏';
        if (state.cm) setTimeout(() => state.cm.refresh(), 30);
        if (state.layout !== 'code') renderPreview();
      };

      // Draggable Splitter
      const onSplitStart = (e) => {
        e.preventDefault();
        splitter.classList.add('dragging');
        iframe.style.pointerEvents = 'none';
        const rect = workspace.getBoundingClientRect();
        const onMove = (ev) => {
          const pt = getClientXY(ev);
          if (state.splitDir === 'horizontal') {
            const pct = Math.max(15, Math.min(85, ((pt.x - rect.left) / rect.width) * 100));
            paneCode.style.flex = `0 0 ${pct}%`;
            panePreview.style.flex = `1 1 ${100 - pct}%`;
          } else {
            const pct = Math.max(15, Math.min(85, ((pt.y - rect.top) / rect.height) * 100));
            paneCode.style.flex = `0 0 ${pct}%`;
            panePreview.style.flex = `1 1 ${100 - pct}%`;
          }
          if (state.cm) state.cm.refresh();
        };
        const onEnd = () => {
          splitter.classList.remove('dragging');
          iframe.style.pointerEvents = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      };
      splitter.addEventListener('mousedown', onSplitStart);
      splitter.addEventListener('touchstart', onSplitStart, { passive: false });

      // CodeMirror Initialization & Recreation for inputStyle switching (自动 / 电脑 / 手机)
      let _cmDefaultInputStyle = null;
      const mountCodeMirror = async (initialText) => {
        try {
          const CM = await CDNLoader.loadCodeMirror();
          if (!_cmDefaultInputStyle) _cmDefaultInputStyle = CM.defaults.inputStyle;
          cmLoader.classList.add('hidden');

          const chosenInputStyle = state.inputMode === 'desktop' ? 'textarea'
            : state.inputMode === 'mobile' ? 'contenteditable'
            : _cmDefaultInputStyle;

          const curPos = state.cm ? state.cm.getCursor() : { line: 0, ch: 0 };
          const scrollInfo = state.cm ? state.cm.getScrollInfo() : null;
          if (state.selChangeHandler) {
            document.removeEventListener('selectionchange', state.selChangeHandler);
            state.selChangeHandler = null;
          }
          if (state.cm) {
            const wrap = state.cm.getWrapperElement();
            wrap.remove();
            state.cm = null;
          }

          state.cm = CM(paneCode, {
            value: initialText,
            mode: state.mode,
            theme: 'material-darker',
            lineNumbers: true,
            lineWrapping: true,
            styleActiveLine: true,
            matchBrackets: true,
            autoCloseBrackets: true,
            autoCloseTags: true,
            indentUnit: 2,
            tabSize: 2,
            inputStyle: chosenInputStyle,
            extraKeys: {
              'Ctrl-S': () => saveToVFS(),
              'Cmd-S': () => saveToVFS(),
              'Ctrl-F': () => { q('findbar').classList.add('open'); q('find-q').focus(); },
              'Ctrl-A': (cm) => {
                // Full-document select-all enhancement (critical in contenteditable/mobile mode!)
                cm.execCommand('selectAll');
              }
            }
          });

          // Mobile contenteditable select-all helper: if user triggers native selectAll inside contenteditable, expand to entire document!
          if (chosenInputStyle === 'contenteditable') {
            const inputEl = state.cm.getInputField();
            inputEl.addEventListener('keydown', (e) => {
              if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                state.cm.execCommand('selectAll');
              }
            });
            // Also detect system context-menu "Select All" covering entire rendered viewport and promote to full doc
            state.selChangeHandler = () => {
              if (!state.cm || document.activeElement !== inputEl) return;
              const sel = window.getSelection();
              if (!sel || sel.isCollapsed) return;
              const str = sel.toString();
              const vp = state.cm.getViewport();
              if (vp.from > 0 || vp.to < state.cm.lineCount()) {
                const renderedText = state.cm.getRange({ line: vp.from, ch: 0 }, { line: Math.max(0, vp.to - 1), ch: 99999 });
                if (str.length >= renderedText.length - 4 && renderedText.length > 40) {
                  state.cm.setSelection({ line: 0, ch: 0 }, { line: state.cm.lineCount() - 1, ch: state.cm.getLine(state.cm.lineCount() - 1).length });
                }
              }
            };
            document.addEventListener('selectionchange', state.selChangeHandler);
          }

          state.cm.setCursor(curPos);
          if (scrollInfo) state.cm.scrollTo(scrollInfo.left, scrollInfo.top);

          state.cm.on('change', () => {
            state.dirty = true;
            updateTitle();
            updateStatusBar();
            debouncedPreview();
          });
          state.cm.on('cursorActivity', updateStatusBar);
          updateStatusBar();
          renderPreview();
        } catch (err) {
          // Graceful offline fallback textarea
          cmLoader.classList.add('hidden');
          const ta = document.createElement('textarea');
          ta.value = initialText;
          ta.style.cssText = 'width:100%;height:100%;resize:none;border:none;outline:none;padding:12px;background:#1b1e26;color:#e6ecf5;font-family:var(--font-mono);font-size:13px;line-height:1.55;';
          paneCode.appendChild(ta);
          state.fallbackTa = ta;
          ta.addEventListener('input', () => { state.dirty = true; updateTitle(); updateStatusBar(); debouncedPreview(); });
          ta.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveToVFS(); }
          });
          ta.addEventListener('keyup', updateStatusBar);
          ta.addEventListener('click', updateStatusBar);
          updateStatusBar();
          renderPreview();
        }
      };

      // Find & Replace Implementation
      let lastSearchCursor = null;
      const doFind = (reverse = false) => {
        const query = q('find-q').value;
        if (!query || !state.cm) return;
        const from = reverse ? state.cm.getCursor('from') : state.cm.getCursor('to');
        let cursor = state.cm.getSearchCursor(query, from, { caseFold: true });
        let found = reverse ? cursor.findPrevious() : cursor.findNext();
        if (!found) {
          const wrapPos = reverse ? { line: state.cm.lineCount() - 1, ch: 99999 } : { line: 0, ch: 0 };
          cursor = state.cm.getSearchCursor(query, wrapPos, { caseFold: true });
          found = reverse ? cursor.findPrevious() : cursor.findNext();
        }
        if (found) {
          lastSearchCursor = cursor;
          state.cm.setSelection(cursor.from(), cursor.to());
          state.cm.scrollIntoView({ from: cursor.from(), to: cursor.to() }, 60);
          q('find-info').textContent = `已定位至第 ${cursor.from().line + 1} 行`;
        } else {
          q('find-info').textContent = '未找到匹配项';
        }
      };

      // Toolbar Events
      langSel.addEventListener('change', () => {
        state.mode = langSel.value;
        if (state.cm) state.cm.setOption('mode', state.mode);
        updateStatusBar();
        updateTitle();
        renderPreview();
      });

      win.body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'save') saveToVFS();
        else if (act === 'refresh-preview') renderPreview();
        else if (act === 'format') formatCode();
        else if (act === 'find') { q('findbar').classList.toggle('open'); q('find-q').focus(); }
        else if (act === 'find-close') q('findbar').classList.remove('open');
        else if (act === 'find-next') doFind(false);
        else if (act === 'find-prev') doFind(true);
        else if (act === 'replace-one' && state.cm) {
          const query = q('find-q').value, rep = q('replace-q').value;
          if (!query) return;
          if (state.cm.getSelection().toLowerCase() === query.toLowerCase()) {
            state.cm.replaceSelection(rep);
          }
          doFind(false);
        }
        else if (act === 'replace-all' && state.cm) {
          const query = q('find-q').value, rep = q('replace-q').value;
          if (!query) return;
          const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const cur = state.cm.getValue();
          let n = 0;
          const next = cur.replace(new RegExp(esc, 'gi'), () => { n++; return rep; });
          state.cm.setValue(next);
          q('find-info').textContent = `已替换 ${n} 处`;
        }
        else if (act === 'undo') { state.cm ? state.cm.undo() : document.execCommand('undo'); }
        else if (act === 'redo') { state.cm ? state.cm.redo() : document.execCommand('redo'); }
        else if (act === 'select-all') {
          if (state.cm) { state.cm.execCommand('selectAll'); state.cm.focus(); }
          else if (state.fallbackTa) { state.fallbackTa.select(); state.fallbackTa.focus(); }
          updateStatusBar();
        }
        else if (act === 'copy-all') {
          try { await navigator.clipboard.writeText(getValue()); showToast('已复制全部代码内容', 'success', 1600); }

    // Lightweight Code Formatters & Markdown Renderer for IDE
    function formatMarkup(code) {
      const voidTags = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
      const tokens = code.replace(/>\s+</g, '>\n<').split('\n');
      let indent = 0;
      const out = [];
      for (let line of tokens) {
        line = line.trim();
        if (!line) continue;
        if (/^<\//.test(line)) indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        const openMatch = line.match(/^<([a-zA-Z0-9-]+)(?:\s[^>]*)?>$/);
        if (openMatch && !line.endsWith('/>') && !voidTags.has(openMatch[1].toLowerCase()) && !line.includes('</')) {
          indent++;
        }
      }
      return out.join('\n');
    }

    function formatCSS(code) {
      let s = code.replace(/\s*\{\s*/g, ' {\n  ').replace(/;\s*/g, ';\n  ').replace(/\s*\}\s*/g, '\n}\n').replace(/  \n\}/g, '\n}');
      return s.replace(/\n{3,}/g, '\n\n').trim();
    }

    function formatJS(code) {
      let indent = 0;
      const out = [];
      for (let rawLine of code.split('\n')) {
        const line = rawLine.trim();
        if (!line) { out.push(''); continue; }
        if (/^[}\])]/.test(line)) indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        const opens = (line.match(/[{([]/g) || []).length;
        const closes = (line.match(/[})\]]/g) || []).length;
        if (opens > closes) indent += (opens - closes);
      }
      return out.join('\n');
    }

    function renderSimpleMarkdown(md) {
      let s = escapeHtml(md);
      s = s.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
      s = s.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
      s = s.replace(/\n\n+/g, '</p><p>');
      return `<p>${s}</p>`;
    }

          } else {

        else if (act === 'redo' && state.undoIdx < state.undoStack.length - 1) { ta.value = state.undoStack[++state.undoIdx]; updateStats(); autoSave(); }

    }

    /* -------------------- 4. SPREADSHEET (CSV / TSV Dual-View) -------------------- */
    function launchSpreadsheet({ path = null } = {}) {
      const sep = path && extname(path) === 'tsv' ? '\t' : ',';
      const win = WM.create({
        appId: 'spreadsheet',
        title: path ? `数据表格 — ${basename(path)}` : '数据表格 — 新建表格.csv',
        icon: 'table',
        width: 880,
        height: 560
      });

      const state = { filePath: path ? normalizePath(path) : null, delimiter: sep, view: 'table', rawText: '列1,列2,列3\n数据1,数据2,数据3', rows: [] };

      function parseDelimited(text, d) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i], next = text[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') { cell += '"'; i++; }
            else if (ch === '"') inQuotes = false;
            else cell += ch;
          } else {
            if (ch === '"') inQuotes = true;
            else if (ch === d) { row.push(cell); cell = ''; }
            else if (ch === '\r' && next === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; }
            else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
            else cell += ch;
          }
        }
        if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }
        return rows.length ? rows : [['']];
      }

      function serializeDelimited(rows, d) {
        return rows.map(r => r.map(c => {
          const s = String(c ?? '');
          return (s.includes(d) || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(d)).join('\n');
      }

      win.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;">
          <div class="exp-toolbar">
            <button class="btn btn-sm btn-primary" data-act="save">${ico('save', 13)}<span>保存</span></button>
            <button class="btn btn-sm btn-active" data-act="view-table">${ico('table', 13)}<span>表格视图</span></button>
            <button class="btn btn-sm" data-act="view-text">${ico('fileText', 13)}<span>文本视图</span></button>
            <div style="width:1px;height:18px;background:var(--border);margin:0 2px;"></div>
            <button class="btn btn-sm" data-act="add-row">${ico('plus', 13)}<span>添加行</span></button>
            <button class="btn btn-sm" data-act="add-col">${ico('plus', 13)}<span>添加列</span></button>
            <select class="select-ctrl" data-id="delim" style="height:26px;font-size:11.5px;margin-left:auto;">
              <option value="," ${sep === ',' ? 'selected' : ''}>分隔符: CSV (,)</option>
              <option value="\t" ${sep === '\t' ? 'selected' : ''}>分隔符: TSV (Tab)</option>
            </select>
          </div>
          <div class="csv-table-wrap" data-id="table-wrap"></div>
          <textarea data-id="text-wrap" style="display:none;flex:1;width:100%;resize:none;border:none;outline:none;padding:14px;background:var(--bg-input);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;line-height:1.6;"></textarea>
          <div class="exp-statusbar">
            <span data-id="st-dims">0 行 × 0 列</span>
            <span>CSV / TSV 双视图引擎</span>
          </div>
        </div>`;

      const tableWrap = win.body.querySelector('[data-id="table-wrap"]');
      const textWrap = win.body.querySelector('[data-id="text-wrap"]');
      const dimsEl = win.body.querySelector('[data-id="st-dims"]');

      const renderTable = () => {
        state.rows = parseDelimited(state.rawText, state.delimiter);
        const maxCols = Math.max(1, ...state.rows.map(r => r.length));
        state.rows.forEach(r => { while (r.length < maxCols) r.push(''); });

        let html = '<table class="csv-table"><thead><tr><th class="csv-row-num">#</th>';
        state.rows[0].forEach((h, ci) => {
          html += `<th contenteditable="true" data-r="0" data-c="${ci}">${escapeHtml(h)}</th>`;
        });
        html += '</tr></thead><tbody>';
        for (let ri = 1; ri < state.rows.length; ri++) {
          html += `<tr><td class="csv-row-num">${ri}</td>`;
          for (let ci = 0; ci < maxCols; ci++) {
            html += `<td contenteditable="true" data-r="${ri}" data-c="${ci}">${escapeHtml(state.rows[ri][ci])}</td>`;
          }
          html += '</tr>';
        }
        html += '</tbody></table>';
        tableWrap.innerHTML = html;
        dimsEl.textContent = `${state.rows.length} 行 × ${maxCols} 列`;
      };

      tableWrap.addEventListener('input', (e) => {
        const cell = e.target.closest('[data-r]');
        if (!cell) return;
        const r = Number(cell.dataset.r), c = Number(cell.dataset.c);
        state.rows[r][c] = cell.textContent;
        state.rawText = serializeDelimited(state.rows, state.delimiter);
        textWrap.value = state.rawText;
      });

      textWrap.addEventListener('input', () => { state.rawText = textWrap.value; });

      win.body.querySelector('[data-id="delim"]').addEventListener('change', (e) => {
        state.delimiter = e.target.value;
        if (state.view === 'table') renderTable();
      });

      win.body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'view-table') {
          state.view = 'table';
          tableWrap.style.display = '';
          textWrap.style.display = 'none';
          win.body.querySelector('[data-act="view-table"]').classList.add('btn-active');
          win.body.querySelector('[data-act="view-text"]').classList.remove('btn-active');
          renderTable();
        } else if (act === 'view-text') {
          state.view = 'text';
          textWrap.value = state.rawText;
          tableWrap.style.display = 'none';
          textWrap.style.display = 'block';
          win.body.querySelector('[data-act="view-text"]').classList.add('btn-active');
          win.body.querySelector('[data-act="view-table"]').classList.remove('btn-active');
        } else if (act === 'add-row') {
          const cols = state.rows[0]?.length || 3;
          state.rows.push(new Array(cols).fill(''));
          state.rawText = serializeDelimited(state.rows, state.delimiter);
          textWrap.value = state.rawText;
          renderTable();
        } else if (act === 'add-col') {
          state.rows.forEach((r, i) => r.push(i === 0 ? `列${r.length + 1}` : ''));
          state.rawText = serializeDelimited(state.rows, state.delimiter);
          textWrap.value = state.rawText;
          renderTable();
        } else if (act === 'save') {
          let target = state.filePath;
          if (!target) {
            const ext = state.delimiter === '\t' ? 'tsv' : 'csv';
            const name = await promptDialog('保存表格', `新建表格.${ext}`);
            if (!name) return;
            target = joinPath('/Desktop', name);
            state.filePath = target;
            win.setTitle(`数据表格 — ${basename(target)}`);
          }
          await fs.writeFile(target, state.rawText, { mtime: Date.now() });
          showToast(`已保存至 ${target}`, 'success', 1600);
        }
      });

      (async () => {
        if (state.filePath) {
          try { state.rawText = await fs.readFile(state.filePath, { encoding: 'utf8' }); }
          catch (err) { showToast('读取表格失败: ' + err.message, 'error'); }
        }
        textWrap.value = state.rawText;
        renderTable();
      })();

      return win;
    }

      // Dual-Mode Seamless Vertical Drag & Physics Inertia (FRICTION = 0.96)
      // Mobile touch automatically uses native 120fps compositor scroll (-webkit-overflow-scrolling: touch + touch-action: pan-y)
      // Desktop PC uses Pointer Events with setPointerCapture & singleton RAF momentum glide
      const FRICTION = 0.96;

      const stopMomentum = () => {

        const step = () => {
          scroller.scrollTop -= state.velocity;
          state.velocity *= FRICTION;
          if (Math.abs(state.velocity) < 0.35) {
            state.rafId = null;
            state.velocity = 0;
            return;
          }
          state.rafId = requestAnimationFrame(step);
        };
        state.rafId = requestAnimationFrame(step);
      };

      scroller.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        stopMomentum();
        dragging = true;
        activePointerId = e.pointerId;
        lastY = e.clientY;
        lastTime = performance.now();
        scroller.classList.add('grabbing');
        try { scroller.setPointerCapture(e.pointerId); } catch (_) {}
      });

      scroller.addEventListener('pointermove', (e) => {
        if (!dragging || e.pointerId !== activePointerId) return;
        const now = performance.now();
        const dy = e.clientY - lastY;
        const dt = Math.max(8, now - lastTime);
        scroller.scrollTop -= dy;
        state.velocity = (dy / dt) * 16.67;
        lastY = e.clientY;
        lastTime = now;
      });

      const endPointerDrag = (e) => {
        if (!dragging || (activePointerId != null && e.pointerId !== activePointerId)) return;
        dragging = false;
        scroller.classList.remove('grabbing');
        try { scroller.releasePointerCapture(activePointerId); } catch (_) {}
        activePointerId = null;
        startMomentum();
      };
      scroller.addEventListener('pointerup', endPointerDrag);
      scroller.addEventListener('pointercancel', endPointerDrag);

      // Update current visible page indicator
      const updatePageIndicator = debounce(() => {
        if (!state.files.length) return;
        const slots = strip.children;
        const midY = scroller.scrollTop + scroller.clientHeight * 0.35;
        let currentIdx = 0;
        for (let i = 0; i < slots.length; i++) {
          if (slots[i].offsetTop <= midY) currentIdx = i;
          else break;
        }
        infoEl.textContent = `${basename(state.files[currentIdx])}  (${currentIdx + 1} / ${state.files.length})`;
      }, 90);
      scroller.addEventListener('scroll', updatePageIndicator, { passive: true });

      // Fullscreen Management (Dual-Path: Native Fullscreen API + Immersive CSS fallback for mobile Safari)
      const applyFullscreenUI = (entering) => {
        state.isFullscreen = entering;
        rootEl.classList.toggle('is-fullscreen', entering);
        win.el.classList.toggle('os-immersive-fullscreen', entering);
      };

      const enterFullscreen = async () => {
        applyFullscreenUI(true);
        try {
          if (rootEl.requestFullscreen && !document.fullscreenElement) {
            await rootEl.requestFullscreen();
          } else if (rootEl.webkitRequestFullscreen) {
            rootEl.webkitRequestFullscreen();
          }
        } catch (_) {
          // Mobile / restricted iframe gracefully remains in CSS immersive fullscreen (and scrolls natively!)
        }
      };

      const exitFullscreen = async () => {
        applyFullscreenUI(false);
        try {
          if (document.fullscreenElement === rootEl || document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (_) {}
      };

      const onFsChange = () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement && state.isFullscreen) {
          applyFullscreenUI(false);
        }
      };
      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('webkitfullscreenchange', onFsChange);
      fsExitBtn.onclick = () => exitFullscreen();

      const onKeyDown = (e) => {
        if (e.key === 'Escape' && state.isFullscreen) exitFullscreen();
      };
      document.addEventListener('keydown', onKeyDown);

      // Load directory images in natural numeric order with parallel read + ordered DOM + deltaH scroll compensation!
      const loadDirectorySequence = async (dirPath, targetFilePath) => {
        state.blobUrls.forEach(u => URL.revokeObjectURL(u));
        state.blobUrls = [];
        strip.innerHTML = `<div style="padding:48px;color:#8e98ad;display:flex;align-items:center;gap:10px;"><span class="spinner"></span><span>正在扫描同目录图片序列...</span></div>`;

        let names;
        try {
          names = await fs.readdir(dirPath);
        } catch (err) {
          showToast(`读取漫画目录失败: ${err.message}`, 'error');
          strip.innerHTML = `<div style="padding:48px;color:var(--danger);">目录读取失败: ${escapeHtml(err.message)}</div>`;
          return;
        }

        // Filter all supported image extensions (case-insensitive)
        const imgNames = names.filter(n => IMAGE_EXTS.has(extname(n)));
        if (imgNames.length === 0) {
          infoEl.textContent = '目录中没有图片文件';
          strip.innerHTML = `<div style="padding:48px;color:#8e98ad;">目录 ${escapeHtml(dirPath)} 中未发现图片文件</div>`;
          return;
        }

        // Strict Natural Numeric Sorting: 1.jpg -> 2.jpg -> 10.jpg
        imgNames.sort(naturalCompare);
        state.dirPath = dirPath;
        state.files = imgNames.map(n => joinPath(dirPath, n));
        const targetIdx = targetFilePath ? Math.max(0, state.files.indexOf(normalizePath(targetFilePath))) : 0;
        win.setTitle(`漫画阅读器 — ${basename(dirPath)} (${state.files.length} 页)`);

        // Create ordered skeleton slots upfront so DOM order is 100% deterministic
        strip.innerHTML = '';
        const slots = state.files.map((fp, idx) => {
          const slot = document.createElement('div');
          slot.className = 'manga-page-slot';
          slot.style.width = `min(${state.fitWidthPct}%, 920px)`;
          slot.innerHTML = `<div class="manga-skeleton-label"><span class="spinner"></span><span>正在加载第 ${idx + 1} 页 (${escapeHtml(basename(fp))})...</span></div>`;
          strip.appendChild(slot);
          return slot;
        });

        let loadedCount = 0;
        let failedCount = 0;
        let hasScrolledToTarget = false;

        const scrollToTargetSlot = () => {
          if (targetIdx > 0 && slots[targetIdx]) {
            scroller.scrollTop = slots[targetIdx].offsetTop;
          }
        };

        // Immediately jump viewport to clicked target slot position
        if (targetIdx > 0) {
          requestAnimationFrame(() => {
            scrollToTargetSlot();
            hasScrolledToTarget = true;
          });
        }

        // Parallel binary reads, deterministic ordered slot insertion, deltaH anti-jitter scroll compensation!
        await Promise.allSettled(state.files.map(async (fp, idx) => {
          const slot = slots[idx];
          try {
            const bytes = await fs.readFile(fp);
            const url = URL.createObjectURL(new Blob([bytes], { type: getMimeType(fp) }));
            state.blobUrls.push(url);

            await new Promise((resolve, reject) => {
              const img = new Image();
              img.decoding = 'async';
              img.onload = () => {
                // Measure slot height BEFORE replacing skeleton & compensate scrollTop if above viewport!
                const oldHeight = slot.offsetHeight;
                const slotTop = slot.offsetTop;
                const wasAboveViewport = slotTop < scroller.scrollTop;

                slot.innerHTML = '';
                slot.classList.add('loaded');
                slot.appendChild(img);

                const newHeight = slot.offsetHeight;
                const deltaH = newHeight - oldHeight;
                if (deltaH !== 0 && wasAboveViewport) {
                  scroller.scrollTop += deltaH;
                }
                if (idx === targetIdx && targetIdx > 0 && !hasScrolledToTarget) {
                  scroller.scrollTop = slot.offsetTop;
                  hasScrolledToTarget = true;
                }
                resolve();
              };
              img.onerror = () => reject(new Error('解码失败'));
              img.src = url;
            });
            loadedCount++;
          } catch (_) {
            // Single image failure NEVER aborts the rest — remove broken slot gracefully
            failedCount++;
            slot.remove();
          }
          infoEl.textContent = `已加载 ${loadedCount}/${state.files.length} 页${failedCount ? ` (跳过 ${failedCount} 张异常)` : ''}`;
        }));

        // Final accurate anchor if user clicked a middle page
        if (targetIdx > 0 && slots[targetIdx] && slots[targetIdx].isConnected && scroller.scrollTop < 10) {
          scroller.scrollTop = slots[targetIdx].offsetTop;
        }
        updatePageIndicator();
      };

      // Toolbar actions
      win.body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'fullscreen') enterFullscreen();
        else if (act === 'width-dec') {
          state.fitWidthPct = Math.max(40, state.fitWidthPct - 12);
          strip.querySelectorAll('.manga-page-slot').forEach(s => s.style.width = `min(${state.fitWidthPct}%, 1200px)`);
        } else if (act === 'width-inc') {
          state.fitWidthPct = Math.min(100, state.fitWidthPct + 12);
          strip.querySelectorAll('.manga-page-slot').forEach(s => s.style.width = `min(${state.fitWidthPct}%, 1400px)`);
        } else if (act === 'switch-imgviewer') {
          const cur = state.targetPath || state.files[0];
          if (cur) launchImageViewer({ path: cur });
        } else if (act === 'open-folder') {
          const p = await promptDialog('打开图片目录', state.dirPath);
          if (p) loadDirectorySequence(normalizePath(p), null);
        }
      });

      win.onClose = () => {
        stopMomentum();
        if (state.isFullscreen) exitFullscreen();
        document.removeEventListener('fullscreenchange', onFsChange);
        document.removeEventListener('webkitfullscreenchange', onFsChange);
        document.removeEventListener('keydown', onKeyDown);
        state.blobUrls.forEach(u => URL.revokeObjectURL(u));
      };

      loadDirectorySequence(state.dirPath, state.targetPath);
      return win;
    }

    /* -------------------- 6. INDEPENDENT IMAGE VIEWER (Zoom & Rotate) -------------------- */
    function launchImageViewer({ path = null } = {}) {
      const win = WM.create({
        appId: 'image',

      };

      win.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;background:#0a0c10;">

            <div style="width:1px;height:18px;background:var(--border);margin:0 2px;"></div>

            <span data-id="zoom-lbl" style="font-family:var(--font-mono);font-size:11.5px;min-width:44px;text-align:center;">100%</span>
            <button class="btn btn-sm" data-act="zoom-in">${ico('zoomIn', 13)}<span>放大</span></button>

            <button class="btn btn-sm" data-act="set-wp">${ico('desktop', 13)}<span>设为壁纸</span></button>
          </div>
          <div data-id="stage" style="flex:1;overflow:auto;display:grid;place-items:center;position:relative;padding:20px;">
            <img data-id="img" alt="" style="max-width:100%;max-height:100%;object-fit:contain;transition:transform 0.14s ease;border-radius:4px;" />
          </div>
          <div class="exp-statusbar">
            <span data-id="meta-left">就绪</span>
            <span data-id="meta-right"></span>
          </div>
        </div>`;

      const imgEl = win.body.querySelector('[data-id="img"]');
      const stageEl = win.body.querySelector('[data-id="stage"]');
      const zoomLbl = win.body.querySelector('[data-id="zoom-lbl"]');

      const applyTransform = () => {
        imgEl.style.transform = `scale(${state.zoom}) rotate(${state.rotate}deg)`;
        zoomLbl.textContent = `${Math.round(state.zoom * 100)}%`;
      };

      const loadImage = async (fp) => {
        if (!fp) return;
        state.curPath = normalizePath(fp);
        state.zoom = 1;
        state.rotate = 0;
        applyTransform();
        try {
          const bytes = await fs.readFile(state.curPath);
          const st = await fs.stat(state.curPath);
          const url = URL.createObjectURL(new Blob([bytes], { type: getMimeType(state.curPath) }));
          if (state.blobUrl) URL.revokeObjectURL(state.blobUrl);
          state.blobUrl = url;
          imgEl.onload = () => {
            win.body.querySelector('[data-id="meta-left"]').textContent = `${basename(state.curPath)}  (${imgEl.naturalWidth} × ${imgEl.naturalHeight})`;
            win.body.querySelector('[data-id="meta-right"]').textContent = `${formatBytes(st.size)}  •  ${formatDateTime(st.mtime)}`;
          };
          imgEl.src = url;
          win.setTitle(`图片查看器 — ${basename(state.curPath)}`);

          const names = await fs.readdir(dirname(state.curPath)).catch(() => []);
          state.siblings = names.filter(n => IMAGE_EXTS.has(extname(n))).sort(naturalCompare).map(n => joinPath(dirname(state.curPath), n));
        } catch (err) {
          showToast('无法加载图片: ' + err.message, 'error');
        }
      };

      stageEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        state.zoom = Math.max(0.2, Math.min(6, state.zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
        applyTransform();
      }, { passive: false });

      win.body.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'zoom-in') { state.zoom = Math.min(6, state.zoom + 0.25); applyTransform(); }
        else if (act === 'zoom-out') { state.zoom = Math.max(0.2, state.zoom - 0.25); applyTransform(); }
        else if (act === 'reset') { state.zoom = 1; state.rotate = 0; applyTransform(); }
        else if (act === 'rotate') { state.rotate = (state.rotate + 90) % 360; applyTransform(); }
        else if (act === 'prev' && state.siblings.length > 1) {
          const i = state.siblings.indexOf(state.curPath);
          loadImage(state.siblings[(i - 1 + state.siblings.length) % state.siblings.length]);
        } else if (act === 'next' && state.siblings.length > 1) {
          const i = state.siblings.indexOf(state.curPath);
          loadImage(state.siblings[(i + 1) % state.siblings.length]);
        } else if (act === 'manga-mode' && state.curPath) {
          launchMangaViewer({ path: state.curPath });
        } else if (act === 'set-wp' && state.curPath) {
          SettingsStore.save({ customWallpaperPath: state.curPath });
          showToast('已将该图片设为桌面壁纸', 'success');
        }
      });

      win.onClose = () => { if (state.blobUrl) URL.revokeObjectURL(state.blobUrl); };
      if (state.curPath) loadImage(state.curPath);
      return win;
    }

    /* -------------------- 7. WEB BROWSER SIMULATOR (Dark Mask + .HTML Bridge) -------------------- */
    function launchBrowser({ path = null, url = null } = {}) {
      const win = WM.create({
        appId: 'browser',
        title: path ? `网页浏览器 — ${basename(path)}` : '网页浏览器',

      });

      };

      win.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;">
          <div class="exp-toolbar">

            <button class="btn btn-sm btn-ghost" data-act="forward" title="前进">${ico('chevRight', 14)}</button>
            <button class="btn btn-sm btn-ghost" data-act="reload" title="重新加载">${ico('refresh', 14)}</button>

          </div>
          <div style="flex:1;position:relative;background:#0d1017;overflow:hidden;">
            <div class="dark-load-mask" data-id="mask">
              <span class="spinner" style="width:24px;height:24px;"></span>
              <span>正在载入页面内容...</span>
            </div>
            <iframe data-id="frame" style="width:100%;height:100%;border:none;background:#0d1017;" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals"></iframe>
          </div>
        </div>`;

      const addrEl = win.body.querySelector('[data-id="addr"]');
      const frame = win.body.querySelector('[data-id="frame"]');
      const mask = win.body.querySelector('[data-id="mask"]');
      const editBtn = win.body.querySelector('[data-act="edit-source"]');

      const loadTarget = async (target, push = true) => {
        mask.classList.remove('hidden');
        let raw = String(target || '').trim();
        if (!raw) raw = '/Desktop/欢迎体验.html';

        if (push) {
          state.history = state.history.slice(0, state.histIdx + 1);
          state.history.push(raw);
          state.histIdx = state.history.length - 1;
        }
        addrEl.value = raw;

        if (raw.startsWith('/')) {
          state.vfsPath = normalizePath(raw);
          editBtn.style.display = 'inline-flex';

            const html = await fs.readFile(state.vfsPath, { encoding: 'utf8' });
            const nextUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
            frame.onload = () => mask.classList.add('hidden');
            frame.src = nextUrl;
            if (state.blobUrl) { const old = state.blobUrl; setTimeout(() => URL.revokeObjectURL(old), 1500); }
            state.blobUrl = nextUrl;
            win.setTitle(`网页浏览器 — ${basename(state.vfsPath)}`);
          } catch (err) {
            mask.classList.add('hidden');
            frame.srcdoc = `<body style="background:#0d1017;color:#e5534b;font-family:sans-serif;padding:32px;"><h2>无法打开本地虚拟网页</h2><p>${escapeHtml(err.message)}</p></body>`;
          }
        } else {
          state.vfsPath = null;
          editBtn.style.display = 'none';
          if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
          addrEl.value = raw;
          frame.onload = () => mask.classList.add('hidden');
          frame.src = raw;
          setTimeout(() => mask.classList.add('hidden'), 2800);
          win.setTitle(`网页浏览器 — ${raw}`);
        }
      };

      addrEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadTarget(addrEl.value); });
      win.body.addEventListener('click', (e) => {

        else if (act === 'home') loadTarget('/Desktop/欢迎体验.html');
        else if (act === 'back' && state.histIdx > 0) loadTarget(state.history[--state.histIdx], false);
        else if (act === 'forward' && state.histIdx < state.history.length - 1) loadTarget(state.history[++state.histIdx], false);
        else if (act === 'edit-source' && state.vfsPath) launchCodeEditor({ path: state.vfsPath });
      });

      // Live reload when user saves the .html file in Code Editor!
      const unsub = fs.on((evt) => {
        if (evt.type === 'write' && state.vfsPath && evt.path === state.vfsPath) {
          loadTarget(state.vfsPath, false);
        }
      });

      win.onClose = () => {
        unsub();
        if (state.blobUrl) URL.revokeObjectURL(state.blobUrl);
      };

      loadTarget(path || url || '/Desktop/欢迎体验.html');
      return win;
    }
