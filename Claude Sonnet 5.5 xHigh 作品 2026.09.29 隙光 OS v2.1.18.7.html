<html lang="zh-CN" data-theme="dark">
<head>

<title>隙光 OS · Fissure Lumen</title>
<script>
/* 早期主题：Cookie + localStorage 双重读取，避免首帧闪烁 */
(function(){try{var m=document.cookie.match(/qr_theme=(dark|light)/);var s=JSON.parse(localStorage.getItem('qr.settings')||'{}');var t=s.theme||(m&&m[1])||'dark';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js" async></script>
<style>
/* ============ 隙光 · 裂隙曜面 (Fissure Lumen) 设计令牌 ============ */
:root{--font-ui:'Familjen Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'Martian Mono','JetBrains Mono',ui-monospace,Consolas,'Noto Sans SC',monospace;--font-disp:'Big Shoulders Display','Familjen Grotesk','Noto Sans SC',sans-serif;--tb:52px;--fs:13.5px;--blur:16px;--accent:#ff6b3d;--on-acc:#160c07;--cw:90px;--ch:106px;--ease:cubic-bezier(.2,.9,.25,1)}
:root{--acc-soft:color-mix(in srgb,var(--accent) 16%,transparent);--acc-line:color-mix(in srgb,var(--accent) 55%,transparent);--acc-glow:color-mix(in srgb,var(--accent) 38%,transparent)}
[data-theme=dark]{--bg0:#08090a;--bg1:#0f1214;--bg2:#161a1d;--bg3:#1e2326;--line:#282f33;--line2:#39434a;--tx:#ebe6d8;--tx2:#a4a196;--tx3:#6c7071;--glass:rgba(12,15,17,.8);--glass2:rgba(20,24,27,.9);--shadow:0 26px 64px -14px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.035);--hi:rgba(255,255,255,.06);--hi2:rgba(255,255,255,.1);--good:#c9f45b;--bad:#ff6b6b;--dtx:#f3efe2}
[data-theme=light]{--bg0:#dcd6c5;--bg1:#efebde;--bg2:#f6f3e9;--bg3:#fffdf6;--line:#cdc6b2;--line2:#b2aa94;--tx:#15181a;--tx2:#4f5249;--tx3:#8a897b;--glass:rgba(238,234,220,.82);--glass2:rgba(246,243,233,.93);--shadow:0 22px 50px -16px rgba(40,34,20,.35),0 0 0 1px rgba(0,0,0,.05);--hi:rgba(0,0,0,.055);--hi2:rgba(0,0,0,.09);--good:#4d7a00;--bad:#c62b2b;--dtx:#15181a}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--tx);font:var(--fs)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
::selection{background:var(--acc-line)}
input,textarea,[contenteditable=true],.sel-ok{user-select:text;-webkit-user-select:text}
.mono{font-family:var(--font-mono)}
body.no-anim *{animation-duration:.001s!important;transition-duration:.001s!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.965)}to{opacity:1;transform:none}}
@keyframes icIn{from{opacity:0;transform:translateY(10px) scale(.86)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes fis{from{background-position:-160% 0}to{background-position:260% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- 基础控件 ---- */
.btn{height:30px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--bg3);border-radius:2px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;flex:none}
.btn:hover{border-color:var(--accent)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-acc);font-weight:600}
.btn.dng{color:var(--bad)}.btn[disabled],.ibtn[disabled]{opacity:.38;pointer-events:none}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:2px;color:var(--tx2);transition:background .15s,color .15s;flex:none;position:relative}
.ibtn:hover{background:var(--hi2);color:var(--tx)}.ibtn.on{color:var(--accent);background:var(--acc-soft)}
.inp{height:30px;padding:0 10px;background:var(--bg0);border:1px solid var(--line);border-radius:2px;outline:0;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--acc-soft)}
select.inp{padding-right:4px;background:var(--bg0)}
textarea.inp{height:auto;padding:8px 10px;resize:none}
.sw{position:relative;width:38px;height:20px;flex:none;display:inline-block}.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:var(--bg0);border:1px solid var(--line2);border-radius:2px;transition:.2s}.sw i::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;background:var(--tx3);transition:.22s var(--ease)}
.sw input:checked+i{background:var(--acc-soft);border-color:var(--accent)}.sw input:checked+i::after{transform:translateX(18px);background:var(--accent)}
input[type=range]{accent-color:var(--accent);height:20px;background:transparent}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.spin{animation:spin .9s linear infinite}
/* ---- 壁纸 ---- */
#wall{position:fixed;inset:0;z-index:0;background:var(--bg0);overflow:hidden}
.wl{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .8s ease}
.wv{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.35));pointer-events:none}
[data-theme=light] .wv{background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(60,50,20,.14))}
/* ---- 桌面与图标 ---- */
#desktop{position:fixed;left:0;top:0;right:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px));z-index:1;touch-action:none;overflow:hidden}
#icons{position:absolute;inset:0}
.dicon{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);display:flex;justify-content:center;transition:transform .36s var(--ease);touch-action:none;cursor:default;will-change:transform}
.dicon.nt{transition:none}
.dicon .di{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 3px;border:1px solid transparent;border-radius:3px;animation:icIn .6s var(--ease) both;animation-delay:calc(var(--i,0)*42ms);transition:background .15s,border-color .15s}
.dicon:hover .di{background:var(--hi);border-color:var(--line)}
.dicon.sel .di{background:var(--acc-soft);border-color:var(--acc-line)}
.dicon.dragging{opacity:.4}.dicon.drop-target .di{background:var(--acc-soft);border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-soft)}
.dicon .lbl{font-size:12px;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;color:var(--dtx);text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.45)}
[data-theme=light] .dicon .lbl{text-shadow:0 0 6px rgba(255,255,255,.7)}
.dicon .lbl input{width:100%;text-align:center;background:var(--bg0);border:1px solid var(--accent);color:var(--tx);outline:0;font-size:12px;text-shadow:none}
.tile{--tc:var(--tx2);width:46px;height:46px;position:relative;display:grid;place-items:center;flex:none;color:var(--tc);background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 26%,var(--bg2)),var(--bg1) 85%);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 50%,transparent)}
.tile::after{content:'';position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(225deg,transparent 50%,var(--tc) 50%);opacity:.85}
.tile i{position:absolute;left:4px;bottom:2px;font:600 7px var(--font-mono);letter-spacing:.05em;font-style:normal;opacity:.9;color:var(--tc)}
.tile.sm{width:24px;height:24px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%)}.tile.sm::after{width:6px;height:6px}.tile.sm i{display:none}
.tile.lg{width:64px;height:64px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}.tile.lg::after{width:16px;height:16px}
.k-folder{--tc:#ffa24d}.k-text,.k-other{--tc:#d9d3c0}.k-code,.k-html{--tc:#a99bff}.k-image{--tc:#b6f04d}.k-audio{--tc:#58d5ff}.k-video{--tc:#ff6a88}.k-pdf{--tc:#ff5b45}.k-archive{--tc:#ffcf5a}.k-sheet{--tc:#4ee0a4}.k-app{--tc:var(--accent)}.k-disk{--tc:#9fb0c0}.k-html{--tc:#ff8f5a}
#marq{position:fixed;z-index:50;border:1px solid var(--accent);background:var(--acc-soft);pointer-events:none;display:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:60000;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--glass2);border:1px solid var(--accent);border-radius:3px;box-shadow:var(--shadow);font-size:12px;max-width:220px}
.drag-ghost b{background:var(--accent);color:var(--on-acc);padding:0 6px;border-radius:2px;font:600 11px var(--font-mono)}
body.ext-drag #desktop::after{content:'释放以导入文件';position:absolute;inset:14px;border:1px dashed var(--accent);display:grid;place-items:center;font:600 18px var(--font-ui);color:var(--accent);background:var(--acc-soft);pointer-events:none;letter-spacing:.2em}
/* ---- 窗口 ---- */
#wins{position:fixed;left:0;top:0;right:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none}
#wins.has-fs{z-index:9800;bottom:0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);min-width:260px;min-height:150px;pointer-events:auto;animation:winIn .34s var(--ease);transition:opacity .22s,transform .3s var(--ease),visibility 0s;contain:layout}
.win.anim{transition:left .3s var(--ease),top .3s var(--ease),width .3s var(--ease),height .3s var(--ease),opacity .22s,transform .3s var(--ease)}
.win.active{border-color:var(--line2);box-shadow:var(--shadow),0 0 0 1px var(--acc-soft),0 0 38px -8px var(--acc-glow)}
.win::after{content:'';position:absolute;inset:-6px;pointer-events:none;opacity:0;transition:opacity .3s;--c:var(--accent);background:linear-gradient(var(--c),var(--c)) 0 0/9px 1px,linear-gradient(var(--c),var(--c)) 0 0/1px 9px,linear-gradient(var(--c),var(--c)) 100% 0/9px 1px,linear-gradient(var(--c),var(--c)) 100% 0/1px 9px,linear-gradient(var(--c),var(--c)) 0 100%/9px 1px,linear-gradient(var(--c),var(--c)) 0 100%/1px 9px,linear-gradient(var(--c),var(--c)) 100% 100%/9px 1px,linear-gradient(var(--c),var(--c)) 100% 100%/1px 9px;background-repeat:no-repeat}
.win.active::after{opacity:.85}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0}.win.max::after{display:none}
.win.min{opacity:0;transform:translateY(70px) scale(.82);pointer-events:none;visibility:hidden;transition:opacity .22s,transform .3s var(--ease),visibility 0s .3s}
.win.closing{opacity:0;transform:scale(.95);pointer-events:none;transition:opacity .18s,transform .18s}
.win-tb{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 3px 0 10px;background:linear-gradient(var(--bg2),var(--bg1));border-bottom:1px solid var(--line);position:relative;touch-action:none;border-radius:3px 3px 0 0}
.win-tb::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 0%,var(--accent) 24%,transparent 50%);background-size:220% 100%;opacity:0;transition:opacity .3s}
.win.active .win-tb::after{opacity:1;animation:fis 1.6s var(--ease) 1}
.win-tb .wi{color:var(--accent);display:grid;place-items:center}
.win-title{flex:1;min-width:0;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.active .win-title{color:var(--tx)}
.win-extra{display:flex;align-items:center;gap:2px}
.wbtn{width:36px;height:30px;display:grid;place-items:center;color:var(--tx2);border-radius:2px;transition:background .15s,color .15s}
.wbtn:hover{background:var(--hi2);color:var(--tx)}.wbtn.x:hover{background:#c8321f;color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg1);border-radius:0 0 3px 3px}
.rz{position:absolute;z-index:5;touch-action:none}
.rz.n{left:8px;right:8px;top:-4px;height:8px;cursor:ns-resize}.rz.s{left:8px;right:8px;bottom:-4px;height:8px;cursor:ns-resize}.rz.e{top:8px;bottom:8px;right:-4px;width:8px;cursor:ew-resize}.rz.w{top:8px;bottom:8px;left:-4px;width:8px;cursor:ew-resize}
.rz.ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize}.rz.nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize}.rz.se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize}.rz.sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize}
.win.max .rz{display:none}
.win.fs,body .win.fs{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;border:0!important;border-radius:0!important;z-index:99999!important}
body.mobile .win.fs{width:100vw!important;height:100dvh!important}
.win.fs .win-tb,.win.fs .rz{display:none!important}
.win.fs::after{display:none}
.fs-exit{display:none;position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:36px;height:36px;z-index:20;place-items:center;background:rgba(0,0,0,.42);color:#fff;border-radius:50%;opacity:.28;transition:opacity .2s;backdrop-filter:blur(6px)}
.win.fs .fs-exit{display:grid}.fs-exit:hover,.fs-exit:active{opacity:1}
#snap-pv{position:fixed;z-index:20;border:1px solid var(--accent);background:var(--acc-soft);box-shadow:inset 0 0 40px var(--acc-glow);pointer-events:none;opacity:0;transition:all .22s var(--ease);border-radius:4px}
#snap-pv.on{opacity:1}
body.peek-desk .win:not(.min){opacity:.05;pointer-events:none;outline:1px solid var(--accent)}
body.peek-win .win{opacity:.04!important;pointer-events:none}
body.peek-win .win.peek-target{opacity:1!important;visibility:visible!important;transform:none!important;z-index:9999!important}
/* ---- 任务栏 / 底部 Dock ---- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tb) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:9000;display:flex;align-items:stretch;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);border-top:1px solid var(--line);animation:rise .7s var(--ease) both}
#taskbar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 20%,transparent 45%,transparent 60%,var(--accent) 85%,transparent);opacity:.5}
.tb-start{width:62px;flex:none;display:grid;place-items:center;color:var(--tx);position:relative;border-right:1px solid var(--line);transition:background .2s}
.tb-start:hover,.tb-start.on{background:var(--acc-soft)}.tb-start svg{transition:transform .4s var(--ease)}.tb-start.on svg{transform:rotate(90deg)}
#tb-apps{flex:1;min-width:0;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tb-apps::-webkit-scrollbar{display:none}
.tb-btn{position:relative;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;min-width:44px;max-width:176px;flex:0 1 176px;color:var(--tx2);border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);transition:background .15s,color .15s;animation:pop .35s var(--ease)}
.tb-btn:hover{background:var(--hi);color:var(--tx)}
.tb-btn .ti{color:var(--tx2);display:grid;place-items:center}.tb-btn .tl{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--tx3);transform:scaleX(.25);transition:transform .3s var(--ease),background .2s}
.tb-btn.active{background:var(--hi);color:var(--tx)}.tb-btn.active::after{background:var(--accent);transform:scaleX(1);box-shadow:0 0 12px var(--accent)}.tb-btn.active .ti{color:var(--accent)}
.tb-btn.min{opacity:.6}.tb-btn .tx{width:18px;height:18px;display:grid;place-items:center;opacity:0;border-radius:2px;color:var(--tx2)}.tb-btn:hover .tx{opacity:1}.tb-btn .tx:hover{background:#c8321f;color:#fff}
#tb-tray{display:flex;align-items:center;gap:2px;padding:0 6px;flex:none}
#tb-clock{height:100%;padding:0 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;line-height:1.15;transition:background .15s}
#tb-clock:hover,#tb-clock.on{background:var(--hi)}
#clk-t{font:700 18px var(--font-disp);letter-spacing:.04em;white-space:nowrap}#clk-t small{font:500 10px var(--font-ui);color:var(--accent);margin-right:5px;letter-spacing:.06em}
#clk-d{font:400 10.5px var(--font-mono);color:var(--tx2);white-space:nowrap}
#tb-show{width:12px;flex:none;border-left:1px solid var(--line);transition:background .2s,width .2s}#tb-show:hover{background:var(--acc-soft);width:16px}
.store-mini{width:54px;height:6px;background:var(--bg0);border:1px solid var(--line2);position:relative;margin:0 8px;cursor:pointer}.store-mini i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width .6s}
#thumb{position:fixed;z-index:9200;width:230px;background:var(--glass2);backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:var(--shadow);padding:6px;display:none;animation:pop .2s var(--ease)}
#thumb .th-h{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 2px 6px;color:var(--tx2)}#thumb .th-h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#thumb .th-v{height:130px;position:relative;overflow:hidden;background:var(--bg0);border:1px solid var(--line)}
/* ---- 面板：开始菜单 / 日历 ---- */
.panel{position:fixed;z-index:9500;background:var(--glass2);backdrop-filter:blur(calc(var(--blur) + 6px)) saturate(160%);-webkit-backdrop-filter:blur(calc(var(--blur) + 6px)) saturate(160%);border:1px solid var(--line2);box-shadow:var(--shadow);visibility:hidden;pointer-events:none;clip-path:inset(100% 0 0 0);transition:clip-path .38s var(--ease),visibility 0s .38s,opacity .25s;opacity:0}
.panel.on{visibility:visible;pointer-events:auto;clip-path:inset(-20px);opacity:1;transition:clip-path .38s var(--ease),opacity .25s}
#start{left:8px;bottom:calc(var(--tb) + 8px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100vw - 16px));height:min(600px,calc(100dvh - var(--tb) - 24px));display:flex;flex-direction:column}
.st-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.st-logo{width:38px;height:38px;display:grid;place-items:center;background:var(--accent);color:var(--on-acc);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.st-head b{font:700 18px var(--font-ui);letter-spacing:.14em;display:block;line-height:1.1}.st-head small{font:400 9.5px var(--font-mono);color:var(--tx3);letter-spacing:.2em}

/* ================================================================
   统一虚拟文件系统 fs：OPFS 主存储 → IndexedDB 降级 → 内存；本地文件夹通过挂载路由接入
   所有后端方法签名一致，并兼容 (…args, callback) 与 Promise 两种调用约定
   ================================================================ */
const fsErr=(code,msg,path)=>Object.assign(new Error(code+': '+msg+(path?' '+path:'')),{code,path});
const P={norm(p){const o=[];for(const s of String(p||'/').replace(/\\/g,'/').split('/')){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s)}return'/'+o.join('/')},join(...a){return P.norm(a.join('/'))},dirname(p){p=P.norm(p);const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)},basename(p){return P.norm(p).split('/').pop()},splitExt(n){const i=n.lastIndexOf('.');return i>0?[n.slice(0,i),n.slice(i)]:[n,'']}};
const dual=fn=>function(...a){const cb=typeof a[a.length-1]==='function'?a.pop():null;const pr=Promise.resolve().then(()=>fn.apply(this,a));if(cb){pr.then(r=>cb(null,r),e=>cb(e));return}return pr};
const conv=(e,p)=>{if(e&&e.code&&/^E[A-Z]+$/.test(e.code))return e;const n=e&&e.name;const code=n==='NotFoundError'?'ENOENT':n==='TypeMismatchError'?'ENOTDIR':n==='InvalidModificationError'?'ENOTEMPTY':n==='NotAllowedError'||n==='SecurityError'?'EACCES':n||'EIO';return Object.assign(new Error(code+': '+((e&&e.message)||'')+' '+(p||'')),{code,path:p,orig:e})};
let _w=null,_wid=0;const _wcb={};
function workerWrite(segs,buf){return new Promise((res,rej)=>{if(!_w){const src=`onmessage=async e=>{const{segs,buf,id}=e.data;try{let d=await navigator.storage.getDirectory();const n=segs.pop();for(const s of segs)d=await d.getDirectoryHandle(s,{create:true});const fh=await d.getFileHandle(n,{create:true});const a=await fh.createSyncAccessHandle();a.truncate(0);a.write(new Uint8Array(buf),{at:0});a.flush();a.close();postMessage({id})}catch(err){postMessage({id,err:String(err)})}}`;_w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));_w.onmessage=e=>{const c=_wcb[e.data.id];delete _wcb[e.data.id];e.data.err?c[1](new Error(e.data.err)):c[0]()}}const id=++_wid;_wcb[id]=[res,rej];_w.postMessage({id,segs,buf},[buf])})}
/* 基于 FileSystemDirectoryHandle 的后端：同时服务 OPFS 根目录与 showDirectoryPicker 挂载的真实文件夹 */
class HandleFS{
 constructor(root,opfs){this.root=root;this.opfs=!!opfs}
 seg(p){return String(p).split('/').filter(Boolean)}
 async _dir(p,create){let h=this.root;try{for(const s of this.seg(p))h=await h.getDirectoryHandle(s,{create})}catch(e){throw conv(e,p)}return h}
 async _par(p,create){const s=this.seg(p);const n=s.pop();let h=this.root;try{for(const x of s)h=await h.getDirectoryHandle(x,{create})}catch(e){throw conv(e,p)}return[h,n]}
 async _h(p){if(!this.seg(p).length)return this.root;const[d,n]=await this._par(p);try{return await d.getFileHandle(n)}catch(e){if(e.name==='TypeMismatchError'){try{return await d.getDirectoryHandle(n)}catch(e2){throw conv(e2,p)}}throw conv(e,p)}}
 async stat(p,isLstat){const h=await this._h(p);const name=this.seg(p).pop()||'';if(h.kind==='directory')return{name,type:'directory',size:0,mtime:0};const f=await h.getFile();return{name,type:'file',size:f.size,mtime:f.lastModified}}
 async exists(p){try{await this._h(p);return true}catch(e){return false}}
 async readdir(p){const d=await this._dir(p,false);const out=[],jobs=[];try{for await(const[name,h]of d.entries()){if(h.kind==='directory')out.push({name,type:'directory',size:0,mtime:0});else jobs.push(h.getFile().then(f=>({name,type:'file',size:f.size,mtime:f.lastModified})).catch(()=>({name,type:'file',size:0,mtime:0})))}}catch(e){throw conv(e,p)}out.push(...await Promise.all(jobs));return out}
 async readBlob(p,flag){const h=await this._h(p);if(h.kind!=='file')throw fsErr('EISDIR','是目录',p);try{return await h.getFile()}catch(e){throw conv(e,p)}}
 async writeFile(p,data,opt){const[d,n]=await this._par(p,true);try{const fh=await d.getFileHandle(n,{create:true});if(typeof fh.createWritable==='function'){const w=await fh.createWritable();await w.write(data);await w.close()}else{const buf=typeof data==='string'?new TextEncoder().encode(data).buffer:data instanceof Blob?await data.arrayBuffer():ArrayBuffer.isView(data)?data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength):data;await workerWrite(this.seg(p),buf)}}catch(e){throw conv(e,p)}}
 async mkdir(p){await this._dir(p,true)}
 async unlink(p){const[d,n]=await this._par(p);try{await d.removeEntry(n)}catch(e){throw conv(e,p)}}
 async rmdir(p){if(!this.seg(p).length){for await(const[n]of this.root.entries())await this.root.removeEntry(n,{recursive:true});return}const[d,n]=await this._par(p);try{await d.removeEntry(n,{recursive:true})}catch(e){throw conv(e,p)}}

const Clock=(()=>{

.rs{position:absolute;left:-6px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:2;touch-action:none}.rs::after{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}.rs:hover::after{background:var(--accent);width:2px}

.ex-row .c-size{text-align:right}
.ex-row:hover{background:var(--hi)}.ex-row.sel{background:var(--acc-soft);border-left-color:var(--accent)}.ex-row.drop-target{outline:1px solid var(--accent);background:var(--acc-soft)}.ex-row.cutm{opacity:.45}.ex-row.dragging{opacity:.4}

  side.addEventListener('click',e=>{const ej=e.target.closest('[data-eject]');if(ej){e.stopPropagation();fs.unmount(ej.dataset.eject).then(()=>{UI.toast('已卸载','ok');if(st.path.startsWith('/mnt/local/'+ej.dataset.eject))go('/mnt/local')});return}const s=e.target.closest('.ex-si');if(s){go(s.dataset.p);side.classList.remove('open')}});
  side.addEventListener('contextmenu',e=>{e.preventDefault();const s=e.target.closest('.ex-si');if(s)UI.menu([{label:'打开',icon:'play',action:()=>go(s.dataset.p)},{label:'在新窗口中打开',icon:'external',action:()=>OS.launch('explorer',{path:s.dataset.p})}],e.clientX,e.clientY)});
  crumb.addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(b){e.stopPropagation();go(b.dataset.p)}});
  $r('.ex-cbox').addEventListener('click',e=>{if(e.target.closest('button'))return;pathIn.value=st.path;pathIn.style.display='block';pathIn.focus();pathIn.select()});
  pathIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){pathIn.style.display='none';go(pathIn.value.trim()||'/')}else if(e.key==='Escape')pathIn.style.display='none'});pathIn.addEventListener('blur',()=>pathIn.style.display='none');
  head.addEventListener('click',e=>{if(e.target.closest('.rs'))return;const c=e.target.closest('[data-k]');if(!c)return;const k=c.dataset.k;if(st.sk===k)st.sd*=-1;else{st.sk=k;st.sd=1}resort()});
  head.addEventListener('pointerdown',e=>{const h=e.target.closest('.rs');if(!h)return;e.preventDefault();e.stopPropagation();const col=h.dataset.c;const start=parseInt(getComputedStyle(main).getPropertyValue('--w-'+col))||colW[col];const sx=e.clientX;h.setPointerCapture(e.pointerId);
   const mv=ev=>{colW[col]=Math.max(56,Math.min(520,start+(sx-ev.clientX)));main.style.setProperty('--w-'+col,colW[col]+'px')};const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);try{localStorage.setItem('qr.excols',JSON.stringify(colW))}catch(_){}};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)});
  /* --- 与文件系统事件联动 --- */
  const reload=debounce(()=>{if(!win.closing&&!st.searching)load(true)},90);
  const fsub=fs.on(dirs=>{if(dirs.includes(st.path)||(st.path==='/mnt/local'&&dirs.includes('/mnt/local')))reload()});
  const rsub=Ev.on('refresh-dir',d=>{if(fs.norm(d)===st.path)reload()});const msub=Ev.on('mounts',buildSide);const csub=Ev.on('clip',()=>{if(!st.searching)render()});
  win.on('close',()=>{fs.off(fsub);Ev.off('refresh-dir',rsub);Ev.off('mounts',msub);Ev.off('clip',csub);if(st.ab)st.ab.abort()});
  go(start);setTimeout(()=>exEl.focus({preventScroll:true}),60);
 }
 return{open}})();
OS.registerApp({id:'explorer',name:'文件管理器',icon:'folder',desc:'浏览 搜索 管理文件 挂载本地文件夹',open:o=>Explorer.open(o)});
</script>

<script>
/* ================================================================
   P6 · 记事本（撤销/重做/字号/自动保存） + 表格（CSV/TSV 双视图）
   ================================================================ */
async function askSave(name){const v=await UI.dialog({title:'未保存的更改',body:`“${name}” 含有尚未保存的更改，要保存吗？`,modal:true,buttons:[{label:'取消',value:'cancel'},{label:'不保存',value:'discard',danger:true},{label:'保存',value:'save',primary:true}]});return v||'cancel'}
async function pickSavePath(def,title='另存为'){let v=await UI.prompt(title,def,{body:'输入完整路径，或仅输入文件名（保存到 /Documents）',select:'name'});if(v==null)return null;v=String(v).trim();if(!v)return null;if(!v.includes('/'))v='/Documents/'+v;v=fs.norm(v);if(await fs.exists(v)&&!await UI.confirm(`“${P.basename(v)}” 已存在，要覆盖吗？`,{ok:'覆盖',danger:true}))return null;return v}
async function looksBinary(p){try{const f=await fs.readBlob(p);const b=new Uint8Array(await f.slice(0,4096).arrayBuffer());let z=0;for(const x of b)if(x===0)z++;return{bin:z>0,size:f.size}}catch(e){return{bin:false,size:0}}}
const Notepad=(()=>{
 async function open(o={}){
  if(o.path){const ex=WM.find(w=>w.app==='notepad'&&w.data.path===o.path)[0];if(ex){ex.focus();return ex}
   const{bin,size}=await looksBinary(o.path);if(bin&&!await UI.confirm('该文件看起来是二进制文件，以纯文本打开可能显示乱码。仍要打开吗？',{ok:'仍然打开'}))return;if(size>15*1048576&&!await UI.confirm(`文件较大（${fmtSize(size)}），记事本可能变慢。继续吗？`))return}
  const win=WM.create({app:'notepad',title:'记事本',icon:'notepad',w:760,h:540,minW:320,minH:240,data:{path:o.path||null}});
  const root=win.body;root.innerHTML=`<div class="tbar"><button class="ibtn" data-a="new" title="新建">${Ic('fileplus',17)}</button><button class="ibtn" data-a="save" title="保存 (Ctrl+S)">${Ic('save',17)}</button><button class="ibtn" data-a="saveas" title="另存为">${Ic('export',17)}</button><div class="sep"></div><button class="ibtn" data-a="undo" title="撤销 (Ctrl+Z)">${Ic('undo',17)}</button><button class="ibtn" data-a="redo" title="重做 (Ctrl+Y)">${Ic('redo',17)}</button><div class="sep"></div><button class="ibtn" data-a="fdn" title="缩小字号"><b style="font-size:11px">A-</b></button><span class="chip np-fs"></span><button class="ibtn" data-a="fup" title="放大字号"><b style="font-size:14px">A+</b></button><div class="sep"></div><button class="ibtn" data-a="wrap" title="自动换行">${Ic('format',17)}</button><button class="ibtn" data-a="find" title="查找 (Ctrl+F)">${Ic('find',17)}</button><button class="ibtn" data-a="auto" title="自动保存到文件">${Ic('clock',17)}</button></div><div class="np-find"><input class="inp" placeholder="查找…" style="flex:1"><button class="btn" data-a="fprev">上一个</button><button class="btn" data-a="fnext">下一个</button><button class="ibtn" data-a="fclose">${Ic('close',15)}</button></div><textarea class="np-ta" spellcheck="false" autocapitalize="off"></textarea><div class="sbar"><span class="pos">行 1, 列 1</span><span class="cnt"></span><span class="grow"></span><span class="as"></span><span>UTF-8</span></div>`;
  const ta=$('.np-ta',root),find=$('.np-find',root),fi=$('input',find);let path=o.path||null,dirty=false,wrap=true,hist=[{v:'',s:0,e:0}],hi=0,ready=false;
  const dkey=()=>'qr.np.'+(path||'__untitled');
  const title=()=>win.setTitle((path?P.basename(path):'未命名')+(dirty?' •':'')+' — 记事本');
  const status=()=>{const v=ta.value,pre=v.slice(0,ta.selectionStart).split('\n');$('.pos',root).textContent=`行 ${pre.length}, 列 ${pre[pre.length-1].length+1}`;$('.cnt',root).textContent=`${v.length} 字符 · ${v.split('\n').length} 行`;$('.np-fs',root).textContent=S.npSize+'px';ta.style.fontSize=S.npSize+'px';$('[data-a=auto]',root).classList.toggle('on',S.npAuto);$('[data-a=wrap]',root).classList.toggle('on',wrap)};
  function snap(){const v=ta.value;if(hist[hi].v===v)return;hist=hist.slice(0,hi+1);hist.push({v,s:ta.selectionStart,e:ta.selectionEnd});if(hist.length>400)hist.shift();hi=hist.length-1}
  const snapD=debounce(snap,350);
  const draft=debounce(()=>{try{if(ta.value.length<2e6)localStorage.setItem(dkey(),ta.value)}catch(e){}},500);
  const autoSave=debounce(()=>{if(S.npAuto&&path&&dirty)save(true)},1500);
  function changed(){dirty=true;title();status();draft();autoSave()}
  function restore(){const h=hist[hi];ta.value=h.v;ta.setSelectionRange(h.s,h.e);changed()}
  const undo=()=>{snap();if(hi>0){hi--;restore()}},redo=()=>{if(hi<hist.length-1){hi++;restore()}};
  async function save(silent){if(!path){const p=await pickSavePath('/Documents/未命名.txt');if(!p)return false;path=p;win.data.path=p}try{await fs.writeFile(path,ta.value);dirty=false;try{localStorage.removeItem(dkey());localStorage.removeItem('qr.np.__untitled')}catch(e){}title();$('.as',root).textContent=(silent?'已自动保存 ':'已保存 ')+new Date().toLocaleTimeString('zh-CN',{hour12:S.hour12});Recent.add(path);return true}catch(e){UI.toast('保存失败：'+e.message,'err');return false}}
  async function saveAs(){const p=await pickSavePath(path||'/Documents/未命名.txt');if(!p)return;const old=path;path=p;win.data.path=p;if(await save()){try{localStorage.removeItem('qr.np.'+old)}catch(e){}}else path=old}
  function doFind(dir){const q=fi.value;if(!q)return;const v=ta.value.toLowerCase(),ql=q.toLowerCase();let i;if(dir>0){i=v.indexOf(ql,ta.selectionEnd);if(i<0)i=v.indexOf(ql)}else{i=v.lastIndexOf(ql,ta.selectionStart-1);if(i<0)i=v.lastIndexOf(ql)}if(i<0){UI.toast('未找到：'+q);return}ta.focus();ta.setSelectionRange(i,i+q.length);const lh=parseFloat(getComputedStyle(ta).lineHeight)||20;ta.scrollTop=Math.max(0,(v.slice(0,i).split('\n').length-4)*lh);status()}
  ta.addEventListener('input',()=>{snapD();changed()});['keyup','click','select'].forEach(t=>ta.addEventListener(t,status));
  ta.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey;if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if(m&&e.key.toLowerCase()==='s'){e.preventDefault();save()}else if(m&&e.key.toLowerCase()==='f'){e.preventDefault();find.classList.add('on');fi.focus();fi.select()}else if(e.key==='F3'){e.preventDefault();doFind(e.shiftKey?-1:1)}else if(m&&(e.key==='='||e.key==='+')){e.preventDefault();setS('npSize',Math.min(40,S.npSize+1));status()}else if(m&&e.key==='-'){e.preventDefault();setS('npSize',Math.max(9,S.npSize-1));status()}else if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');snapD();changed()}});
  ta.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setS('npSize',Math.max(9,Math.min(40,S.npSize+(e.deltaY<0?1:-1))));status()}},{passive:false});
  fi.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')doFind(e.shiftKey?-1:1);else if(e.key==='Escape'){find.classList.remove('on');ta.focus()}});
  root.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
   if(k==='save')save();else if(k==='saveas')saveAs();else if(k==='undo'){undo();ta.focus()}else if(k==='redo'){redo();ta.focus()}else if(k==='fup'){setS('npSize',Math.min(40,S.npSize+1));status()}else if(k==='fdn'){setS('npSize',Math.max(9,S.npSize-1));status()}
   else if(k==='wrap'){wrap=!wrap;ta.classList.toggle('wrap',wrap);status()}else if(k==='auto'){setS('npAuto',!S.npAuto);status();UI.toast(S.npAuto?'自动保存已开启':'自动保存已关闭')}else if(k==='find'){find.classList.toggle('on');fi.focus()}else if(k==='fnext')doFind(1);else if(k==='fprev')doFind(-1);else if(k==='fclose')find.classList.remove('on');
   else if(k==='new')OS.launch('notepad',{})});
  win.beforeClose=async()=>{if(!dirty)return true;if(S.npAuto&&path){await save(true);return true}const r=await askSave(path?P.basename(path):'未命名');if(r==='cancel')return false;if(r==='save')return await save();try{localStorage.removeItem(dkey())}catch(e){}return true};
  ta.classList.add('wrap');
  try{if(path){const t=await fs.readText(path);ta.value=t;hist=[{v:t,s:0,e:0}];const d=localStorage.getItem(dkey());if(d!=null&&d!==t){ta.value=d;hist.push({v:d,s:0,e:0});hi=1;dirty=true;UI.toast('已恢复上次未保存的草稿','ok')}}else{const d=localStorage.getItem('qr.np.__untitled');if(d){ta.value=d;hist=[{v:'',s:0,e:0},{v:d,s:0,e:0}];hi=1;dirty=true;UI.toast('已恢复未命名文档的草稿','ok')}}}catch(e){UI.toast('打开失败：'+e.message,'err')}
  title();status();ta.focus();ready=true;return win}
 return{open}})();
OS.registerApp({id:'notepad',name:'记事本',icon:'notepad',desc:'纯文本编辑 撤销 自动保存',open:o=>Notepad.open(o)});
/* ---- 表格：CSV / TSV，表格视图与文本视图可切换 ---- */
const Sheet=(()=>{
 function parse(t,d){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}else cur+=c}if(cur!==''||row.length){row.push(cur);rows.push(row)}const n=Math.max(1,...rows.map(r=>r.length));rows.forEach(r=>{while(r.length<n)r.push('')});return rows.length?rows:[['']]}
 const ser=(rows,d)=>rows.map(r=>r.map(v=>{v=String(v==null?'':v);return(v.includes(d)||/["\n\r]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v}).join(d)).join('\n')+'\n';
 async function open(o={}){
  const path=o.path||null;if(path){const ex=WM.find(w=>w.app==='sheet'&&w.data.path===path)[0];if(ex){ex.focus();return ex}}
  const win=WM.create({app:'sheet',title:'表格',icon:'sheet',w:860,h:560,minW:340,minH:260,data:{path}});const root=win.body;
  const ext=extOf(path||'x.csv');let delim=ext==='tsv'?'\t':',';let text='',rows=[['']],view='table',dirty=false,header=true,cur={r:0,c:0},limit=1500,sortC=-1;
  root.innerHTML=`<div class="tbar"><div class="seg"><button data-v="table" class="on">表格视图</button><button data-v="text">文本视图</button></div><div class="sep"></div><button class="ibtn" data-a="save" title="保存 (Ctrl+S)">${Ic('save',17)}</button><select class="inp" data-a="delim" style="height:28px;width:92px"><option value=",">逗号 ,</option><option value="&#9;">制表符</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select><div class="sep"></div><button class="ibtn" data-a="addr" title="在下方插入行">${Ic('plus',16)}</button><button class="ibtn" data-a="addc" title="在右侧插入列"><b style="font-size:11px">+列</b></button><button class="ibtn" data-a="delr" title="删除当前行">${Ic('trash',16)}</button><button class="ibtn" data-a="delc" title="删除当前列"><b style="font-size:11px">-列</b></button><div class="sep"></div><button class="ibtn" data-a="asc" title="按当前列升序"><b style="font-size:11px">A↓</b></button><button class="ibtn" data-a="desc" title="按当前列降序"><b style="font-size:11px">Z↓</b></button><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);margin-left:6px"><span class="sw"><input type="checkbox" data-a="hdr" checked><i></i></span>首行表头</label><input class="inp" data-a="filter" placeholder="筛选行…" style="width:120px;margin-left:auto"></div><div class="sh-wrap"></div><textarea class="np-ta" style="display:none"></textarea><div class="sbar"><span class="i1"></span><span class="grow"></span><span class="as"></span></div>`;
  const wrap=$('.sh-wrap',root),ta=$('.np-ta',root),sel=$('[data-a=delim]',root);sel.value=delim;
  const title=()=>win.setTitle((path?P.basename(path):'未命名表格')+(dirty?' •':'')+' — 表格');
  const stat=()=>{$('.i1',root).textContent=`${rows.length} 行 × ${rows[0].length} 列 · 分隔符 ${delim==='\t'?'Tab':delim} · ${view==='table'?'表格':'文本'}视图`};
  const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  function render(){const f=$('[data-a=filter]',root).value.toLowerCase();let h='<table class="sh-t"><thead><tr><th></th>'+rows[0].map((v,c)=>`<th class="${header?'hd':''}" data-c="${c}">${header?esc(v):colName(c)}</th>`).join('')+'</tr></thead><tbody>';let n=0;
   for(let r=header?1:0;r<rows.length;r++){if(f&&!rows[r].some(v=>String(v).toLowerCase().includes(f)))continue;if(++n>limit){h+=`<tr><th></th><td colspan="${rows[0].length}" style="text-align:center;cursor:pointer;color:var(--accent)" data-more="1">显示更多行…（已显示 ${limit}）</td></tr>`;break}h+=`<tr data-r="${r}"><th>${r+(header?0:1)}</th>${rows[r].map((v,c)=>`<td contenteditable="true" data-c="${c}" spellcheck="false">${esc(v)}</td>`).join('')}</tr>`}wrap.innerHTML=h+'</tbody></table>';stat()}
  function setView(v){if(v===view)return;if(view==='text')rows=parse(ta.value,delim);else syncFromTable();view=v;wrap.style.display=v==='table'?'':'none';ta.style.display=v==='text'?'':'none';$$('.seg button',root).forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='table')render();else{ta.value=ser(rows,delim);stat()}}
  const syncFromTable=()=>{};
  function mark(){dirty=true;title()}
  wrap.addEventListener('input',e=>{const td=e.target.closest('td[data-c]');if(!td)return;const r=+td.parentElement.dataset.r;rows[r][+td.dataset.c]=td.textContent;mark()});
  wrap.addEventListener('focusin',e=>{const td=e.target.closest('td[data-c]');if(td){cur={r:+td.parentElement.dataset.r,c:+td.dataset.c};$$('td.cc',wrap).forEach(x=>x.classList.remove('cc'));}});
  wrap.addEventListener('keydown',e=>{const td=e.target.closest('td[data-c]');if(!td)return;const tr=td.parentElement;if(e.key==='Enter'){e.preventDefault();const n=tr.nextElementSibling;n&&n.children[+td.dataset.c+1]&&n.children[+td.dataset.c+1].focus()}else if(e.key==='Tab'){e.preventDefault();const n=e.shiftKey?td.previousElementSibling:td.nextElementSibling;n&&n.tagName==='TD'&&n.focus()}else if(e.key==='ArrowDown'&&!e.shiftKey){const n=tr.nextElementSibling;n&&n.children[+td.dataset.c+1]&&n.children[+td.dataset.c+1].focus()}else if(e.key==='ArrowUp'){const n=tr.previousElementSibling;n&&n.children[+td.dataset.c+1]&&n.children[+td.dataset.c+1].focus()}});
  wrap.addEventListener('click',e=>{if(e.target.closest('[data-more]')){limit+=1500;render();return}const th=e.target.closest('thead th[data-c]');if(th){cur.c=+th.dataset.c;UI.toast('已选中第 '+colName(cur.c)+' 列，可使用排序 / 删除列')}});

.mg-prog{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.62);border:1px solid #333;color:#ddd;font:500 11px var(--font-mono);padding:4px 12px;pointer-events:none;backdrop-filter:blur(6px);letter-spacing:.08em;z-index:4;white-space:nowrap}
.win.fs .mg-tb,.win.fs .mg-prog{display:none!important}
.iv{display:flex;flex-direction:column;height:100%;min-height:0}
.iv-stage{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;background:repeating-conic-gradient(var(--bg0) 0 25%,var(--bg2) 0 50%) 0 0/20px 20px;touch-action:none;cursor:grab}
.iv-stage:active{cursor:grabbing}.iv-stage img{max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none;will-change:transform;image-rendering:auto}
.mp{display:flex;flex-direction:column;height:100%;min-height:0;background:#0a0b0c;position:relative}
.mp-main{flex:1;min-height:0;display:flex}
.mp-stage{flex:1;min-width:0;position:relative;background:#000;display:grid;place-items:center;overflow:hidden}
.mp-stage video{width:100%;height:100%;object-fit:contain;background:#000}
.mp-vis{position:absolute;inset:0;width:100%;height:100%;display:none;background:radial-gradient(70% 60% at 50% 45%,#1a1410,#050505)}
.mp-stage.aud .mp-vis{display:block}.mp-stage.aud video{opacity:0;pointer-events:none;position:absolute}
.mp-ttl{position:absolute;left:14px;top:10px;right:14px;font:500 11px var(--font-mono);color:#ccc;letter-spacing:.1em;text-shadow:0 1px 4px #000;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-list{width:230px;flex:none;border-left:1px solid var(--line);background:var(--bg2);overflow:auto;display:none}.mp-list.on{display:block}
.mp-list button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;text-align:left;font-size:12px;border-left:2px solid transparent;color:var(--tx2)}.mp-list button:hover{background:var(--hi)}.mp-list button.on{border-left-color:var(--accent);color:var(--tx);background:var(--acc-soft)}.mp-list span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-ctl{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--bg2);border-top:1px solid var(--line);flex-wrap:wrap}
.mp-ctl .t{font:500 11px var(--font-mono);color:var(--tx2);min-width:40px;text-align:center}
.mp-ctl input[type=range]{-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line2) var(--p,0%));height:4px;flex:1;min-width:80px;cursor:pointer;outline:0}
.mp-ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--tx);border:2px solid var(--accent)}.mp-ctl input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--tx);border:2px solid var(--accent);border-radius:0}
.mp-ctl .vol{flex:none;width:76px;min-width:60px}
@media (max-width:700px){.mp-list{position:absolute;right:0;top:0;bottom:60px;z-index:5;box-shadow:var(--shadow)}}

<script>
/* ================================================================
   P8 · 漫画阅读器（条漫无限滚动 / 自然排序 / 沉浸全屏） + 图片 / PDF 查看器 + 媒体播放器
   ================================================================ */
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp|ico|svg|avif|apng|jfif|pjpeg|pjp|tiff?|cur)$/i;
const Manga=(()=>{
 async function open(o={}){
  const path=o.path;if(!path){UI.toast('请在文件管理器中点击一张图片以打开漫画阅读器');return}
  const dir=path.slice(0,path.lastIndexOf('/'))||'/';
  const win=WM.create({app:'manga',title:'漫画阅读器',icon:'manga',w:780,h:660,minW:300,minH:260});const root=win.body;
  root.innerHTML=`<div class="mg"><div class="tbar mg-tb"><button class="ibtn" data-a="fs" title="沉浸全屏 (F)">${Ic('fullscreen',17)}</button><div class="sep"></div><select class="inp" data-a="w" style="height:28px;width:112px" title="图片宽度"><option value="fit">适应宽度</option><option value="full">铺满窗口</option><option value="orig">原始尺寸</option></select><button class="ibtn" data-a="prev" title="上一页 (←)">${Ic('up',17)}</button><button class="ibtn" data-a="next" title="下一页 (→)"><span style="transform:rotate(180deg);display:block">${Ic('up',17)}</span></button><span class="chip mg-pg" style="margin-left:6px">—</span><span style="flex:1"></span><span class="mono" style="font-size:10.5px;color:var(--tx3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(dir)}">${esc(dir)}</span></div><div class="mg-scroll" tabindex="0"><div class="mg-strip"></div><div class="mg-loading"><div>正在读取同目录图片…</div><div class="bar"><i></i></div><div class="cnt">0 / 0</div></div></div><div class="mg-prog"></div></div>`;
  const scroll=$('.mg-scroll',root),strip=$('.mg-strip',root),ld=$('.mg-loading',root),prog=$('.mg-prog',root),pg=$('.mg-pg',root);const wSel=$('[data-a=w]',root);
  let mode='fit';try{mode=localStorage.getItem('qr.mg.w')||'fit'}catch(e){}wSel.value=mode;strip.className='mg-strip '+mode;
  let list;try{list=await fs.readdir(dir,true)}catch(e){UI.toast('目录读取失败：'+e.message,'err');win.close(true);return}
  const files=list.filter(s=>s.type==='file'&&IMG_RE.test(s.name)).sort((a,b)=>natCmp(a.name,b.name));
  if(!files.length){UI.toast('该目录下没有可识别的图片','err');win.close(true);return}
  win.setTitle('漫画阅读器 · '+P.basename(path));let done=0,failed=0;const total=files.length;const tick=()=>{$('.cnt',ld).textContent=`${done} / ${total}`;$('.bar i',ld).style.width=(done/total*100)+'%'};tick();
  /* 并行读取二进制，结果按排序后的下标保存 */
  const results=await Promise.all(files.map(async f=>{try{const buf=await(await fs.readBlob(f.path)).arrayBuffer();return{url:URL.createObjectURL(new Blob([buf],{type:mimeOf(f.name)})),f}}catch(e){failed++;return null}finally{done++;tick()}}));
  if(win.closing){results.forEach(r=>r&&URL.revokeObjectURL(r.url));return}
  /* 严格按排序顺序依次插入 DOM */
  const imgs=[];let target=null;const frag=document.createDocumentFragment();
  for(let i=0;i<results.length;i++){const r=results[i];if(!r)continue;const img=new Image();img.decoding='async';img.draggable=false;img.alt=r.f.name;img.dataset.path=r.f.path;img.dataset.i=imgs.length;img.src=r.url;frag.append(img);imgs.push(img);if(r.f.path===path)target=img}
  strip.append(frag);
  if(failed)UI.toast(`${failed} 张图片读取失败，已跳过`,'err');
  await Promise.race([Promise.all(imgs.map(i=>i.decode().catch(()=>{}))),sleep(9000)]);
  if(target)scroll.scrollTop=target.offsetTop;ld.remove();update();
  let raf=0;function cur(){const y=scroll.scrollTop+scroll.clientHeight*.35;let lo=0,hi=imgs.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(imgs[m].offsetTop<=y)lo=m;else hi=m-1}return lo}
  function update(){const i=cur();const t=`${i+1} / ${imgs.length}`;pg.textContent=t;prog.textContent=t+' · '+(imgs[i]?imgs[i].alt:'')}
  scroll.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(update)},{passive:true});
  const go=d=>{const i=Math.max(0,Math.min(imgs.length-1,cur()+d));scroll.scrollTo({top:imgs[i].offsetTop,behavior:S.anim?'smooth':'auto'})};
  root.addEventListener('click',e=>{const a=e.target.closest('button[data-a]');if(!a)return;const k=a.dataset.a;if(k==='fs')win.fullscreen();else if(k==='prev')go(-1);else if(k==='next')go(1)});
  wSel.addEventListener('change',()=>{const i=cur();mode=wSel.value;strip.className='mg-strip '+mode;try{localStorage.setItem('qr.mg.w',mode)}catch(e){}requestAnimationFrame(()=>{scroll.scrollTop=imgs[i].offsetTop})});
  root.addEventListener('keydown',e=>{if(e.target.closest('select'))return;if(e.key==='f'||e.key==='F')win.fullscreen();else if(e.key==='Escape'&&win.fs)win.fullscreen(false);else if(e.key==='ArrowRight'){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
  strip.addEventListener('dblclick',()=>win.fullscreen());
  win.on('fs',on=>{if(on)scroll.focus({preventScroll:true});requestAnimationFrame(update)});
  win.on('close',()=>{imgs.forEach(i=>URL.revokeObjectURL(i.src))});scroll.focus({preventScroll:true});return win}
 return{open}})();
OS.registerApp({id:'manga',name:'漫画阅读器',icon:'manga',desc:'同目录图片条漫式连续阅读',hidden:true,open:o=>Manga.open(o)});
/* ---- 图片查看器 + PDF 查看器 ---- */
const Viewer=(()=>{
 async function open(o={}){if(!o.path)return;return kindOf(o.path)==='pdf'?pdf(o):image(o)}
 async function pdf(o){const p=o.path;const win=WM.create({app:'viewer',title:P.basename(p),icon:'pdf',w:840,h:640,minW:300,minH:240});
  let url;try{const b=await fs.readBlob(p);url=URL.createObjectURL(new Blob([b],{type:'application/pdf'}))}catch(e){UI.toast('读取失败：'+e.message,'err');win.close(true);return}
  const ok=navigator.pdfViewerEnabled!==false;win.body.innerHTML=`<div class="tbar"><span class="chip">PDF</span><span style="flex:1"></span><button class="btn" data-a="tab">${Ic('external',15)}<span>新标签页打开</span></button><button class="btn" data-a="dl">${Ic('export',15)}<span>下载</span></button></div><div style="flex:1;position:relative">${ok?`<iframe src="${url}" style="width:100%;height:100%;border:0;background:#fff" title="PDF"></iframe>`:'<div class="empty">此浏览器不支持内嵌 PDF 预览<div style="font-size:12px">请使用上方按钮在新标签页打开或下载</div></div>'}</div>`;
  win.body.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='tab')window.open(url,'_blank');else fs.readBlob(p).then(b=>FileOps.saveBlob(b,P.basename(p)))});win.on('close',()=>setTimeout(()=>URL.revokeObjectURL(url),1000));return win}
 async function image(o){let path=o.path;const dir=P.dirname(path);let sibs=[];try{sibs=(await fs.readdir(dir,true)).filter(s=>s.type==='file'&&IMG_RE.test(s.name)).sort((a,b)=>natCmp(a.name,b.name)).map(s=>s.path)}catch(e){}
  const win=WM.create({app:'viewer',title:P.basename(path),icon:'image',w:880,h:620,minW:320,minH:260});const root=win.body;
  root.innerHTML=`<div class="iv"><div class="tbar"><button class="ibtn" data-a="prev" title="上一张">${Ic('prev',16)}</button><button class="ibtn" data-a="next" title="下一张">${Ic('next',16)}</button><div class="sep"></div><button class="ibtn" data-a="zo" title="缩小">${Ic('zoomout',17)}</button><span class="chip iv-z" style="min-width:56px;justify-content:center">100%</span><button class="ibtn" data-a="zi" title="放大">${Ic('zoomin',17)}</button><button class="btn" data-a="fit" style="height:28px">适应</button><button class="btn" data-a="one" style="height:28px">1:1</button><button class="ibtn" data-a="rot" title="旋转">${Ic('rotate',17)}</button><div class="sep"></div><button class="ibtn" data-a="paint" title="用画板编辑">${Ic('paint',17)}</button><button class="ibtn" data-a="dl" title="下载">${Ic('export',17)}</button><span style="flex:1"></span><span class="chip iv-i"></span></div><div class="iv-stage"><img alt=""></div></div>`;
  const stage=$('.iv-stage',root),img=$('img',stage),zl=$('.iv-z',root);let st={s:1,x:0,y:0,r:0},url=null;
  const apply=()=>{img.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.s}) rotate(${st.r}deg)`;zl.textContent=Math.round(st.s*100)+'%'};
  const fit=()=>{const nw=img.naturalWidth||1,nh=img.naturalHeight||1,rot=st.r%180!==0;const w=rot?nh:nw,h=rot?nw:nh;st.s=Math.min(1,(stage.clientWidth-20)/w,(stage.clientHeight-20)/h);st.x=st.y=0;apply()};
  async function load(p){path=p;try{const b=await fs.readBlob(p);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);img.src=url;await img.decode().catch(()=>{});st.r=0;fit();win.setTitle(P.basename(p));const i=sibs.indexOf(p);$('.iv-i',root).textContent=`${img.naturalWidth}×${img.naturalHeight} · ${fmtSize(b.size)}${sibs.length?` · ${i+1}/${sibs.length}`:''}`}catch(e){UI.toast('图片读取失败：'+e.message,'err')}}
  const zoom=(k,cx,cy)=>{const r=stage.getBoundingClientRect();const px=(cx??r.left+r.width/2)-(r.left+r.width/2),py=(cy??r.top+r.height/2)-(r.top+r.height/2);const ns=Math.max(.03,Math.min(50,st.s*k)),kk=ns/st.s;st.x=px-(px-st.x)*kk;st.y=py-(py-st.y)*kk;st.s=ns;apply()};
  const nav=d=>{if(!sibs.length)return;const i=sibs.indexOf(path);load(sibs[(i+d+sibs.length)%sibs.length])};
  stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
  const pts=new Map();let d0=0,s0=1;
  stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const[a,b]=[...pts.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);s0=st.s}});
  stage.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;if(pts.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d0)zoom(s0*d/d0/st.s,(a.x+b.x)/2,(a.y+b.y)/2)}else{st.x+=e.clientX-p.x;st.y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;apply()}});
  const up=e=>{pts.delete(e.pointerId)};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',()=>{st.s<1||Math.abs(st.s-1)<.01?fit():(st.s=1,st.x=st.y=0,apply())});
  root.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;if(k==='zi')zoom(1.25);else if(k==='zo')zoom(1/1.25);else if(k==='fit')fit();else if(k==='one'){st.s=1;st.x=st.y=0;apply()}else if(k==='rot'){st.r=(st.r+90)%360;fit()}else if(k==='prev')nav(-1);else if(k==='next')nav(1);else if(k==='paint')OS.launch('paint',{path});else if(k==='dl')fs.readBlob(path).then(b=>FileOps.saveBlob(b,P.basename(path)))});
  root.tabIndex=0;root.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);else if(e.key==='ArrowLeft')nav(-1);else if(e.key==='+'||e.key==='=')zoom(1.25);else if(e.key==='-')zoom(1/1.25);else if(e.key==='0')fit()});
  win.on('resize',()=>{if(Math.abs(st.x)<1&&Math.abs(st.y)<1&&st.s<=1)fit()});win.on('close',()=>{if(url)URL.revokeObjectURL(url)});await load(path);return win}
 return{open}})();
OS.registerApp({id:'viewer',name:'图片 / PDF 查看器',icon:'image',desc:'缩放 旋转 平移 PDF 预览',hidden:true,open:o=>Viewer.open(o)});
/* ---- 媒体播放器：音频（频谱可视化）/ 视频，同目录播放列表 ---- */
const Media=(()=>{
 const isMedia=n=>['audio','video'].includes(kindOf(n));
 async function open(o={}){
  const path=o.path;let list=[],idx=0;if(path){try{list=(await fs.readdir(P.dirname(path),true)).filter(s=>s.type==='file'&&isMedia(s.name)).sort((a,b)=>natCmp(a.name,b.name)).map(s=>s.path)}catch(e){}if(!list.includes(path))list=[path];idx=list.indexOf(path)}
  const win=WM.create({app:'media',title:'媒体播放器',icon:'video',w:860,h:540,minW:320,minH:280});const root=win.body;
  root.innerHTML=`<div class="mp"><div class="mp-main"><div class="mp-stage"><video playsinline></video><canvas class="mp-vis"></canvas><div class="mp-ttl"></div></div><div class="mp-list"></div></div><div class="mp-ctl"><button class="ibtn" data-a="prev" title="上一个 (P)">${Ic('prev',17)}</button><button class="ibtn" data-a="play" title="播放 / 暂停 (空格)">${Ic('play',20)}</button><button class="ibtn" data-a="next" title="下一个 (N)">${Ic('next',17)}</button><span class="t tc">0:00</span><input type="range" class="seek" min="0" max="1000" value="0"><span class="t td">0:00</span><button class="ibtn" data-a="mute" title="静音 (M)">${Ic('volume',17)}</button><input type="range" class="vol" min="0" max="100" value="80"><button class="ibtn" data-a="speed" title="播放速度"><b style="font:600 10px var(--font-mono)">1x</b></button><button class="ibtn" data-a="loop" title="循环模式">${Ic('loop',17)}</button><button class="ibtn" data-a="pip" title="画中画">${Ic('pip',17)}</button><button class="ibtn" data-a="list" title="播放列表">${Ic('playlist',17)}</button><button class="ibtn" data-a="fs" title="全屏 (F)">${Ic('fullscreen',17)}</button></div></div>`;
  const v=$('video',root),stage=$('.mp-stage',root),vis=$('.mp-vis',root),seek=$('.seek',root),vol=$('.vol',root),plist=$('.mp-list',root),ttl=$('.mp-ttl',root);let url=null,loopMode=0,ac=null,an=null,raf=0,seeking=false;
  const fmt=t=>{if(!isFinite(t))return'0:00';t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+p2(m):m)+':'+p2(s)};
  const setP=el=>el.style.setProperty('--p',(el.value/el.max*100)+'%');v.volume=.8;setP(vol);setP(seek);
  function buildList(){plist.innerHTML=list.map((p,i)=>`<button data-i="${i}" class="${i===idx?'on':''}">${Ic(kindOf(p)==='video'?'video':'audio',14)}<span title="${esc(p)}">${esc(P.basename(p))}</span></button>`).join('')||'<div class="empty">无媒体文件</div>'}
  async function load(i){if(!list.length)return;idx=(i+list.length)%list.length;const p=list[idx];try{const b=await fs.readBlob(p);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);v.src=url;win.setTitle(P.basename(p)+' — 媒体播放器');ttl.textContent=P.basename(p);const aud=kindOf(p)==='audio';stage.classList.toggle('aud',aud);buildList();Recent.add(p);v.play().catch(()=>{})}catch(e){UI.toast('读取失败：'+e.message,'err')}}
  function setupAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(v);an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.82;src.connect(an);an.connect(ac.destination)}catch(e){ac=null}}
  function draw(){raf=requestAnimationFrame(draw);if(!stage.classList.contains('aud')||!vis.offsetWidth)return;const w=vis.width=vis.offsetWidth*devicePixelRatio,h=vis.height=vis.offsetHeight*devicePixelRatio,c=vis.getContext('2d');c.clearRect(0,0,w,h);const n=64,d=new Uint8Array(an?an.frequencyBinCount:n);if(an&&!v.paused)an.getByteFrequencyData(d);const bw=w/n,cs=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ff6b3d';
   for(let i=0;i<n;i++){const val=(d[i]||0)/255,bh=Math.max(3*devicePixelRatio,val*h*.5);const x=i*bw+bw*.2;c.fillStyle=cs;c.globalAlpha=.9;c.fillRect(x,h*.5-bh,bw*.6,bh);c.globalAlpha=.25;c.fillRect(x,h*.5+4,bw*.6,bh*.5)}c.globalAlpha=.35;c.fillStyle=cs;c.fillRect(0,h*.5,w,1);for(let i=0;i<w;i+=24*devicePixelRatio)c.fillRect(i,h*.5+2,1,4)}
  const upd=()=>{if(!seeking&&v.duration){seek.value=v.currentTime/v.duration*1000;setP(seek)}$('.tc',root).textContent=fmt(v.currentTime);$('.td',root).textContent=fmt(v.duration)};
  v.addEventListener('timeupdate',upd);v.addEventListener('loadedmetadata',upd);
  v.addEventListener('play',()=>{$('[data-a=play]',root).innerHTML=Ic('pause',20);setupAudio();ac&&ac.state==='suspended'&&ac.resume()});v.addEventListener('pause',()=>$('[data-a=play]',root).innerHTML=Ic('play',20));
  v.addEventListener('ended',()=>{if(loopMode===1){v.currentTime=0;v.play()}else if(idx<list.length-1||loopMode===2)load(idx+1)});
  v.addEventListener('error',()=>{UI.toast('无法播放：浏览器不支持此文件的编码格式','err')});
  seek.addEventListener('input',()=>{seeking=true;setP(seek);if(v.duration)v.currentTime=seek.value/1000*v.duration});seek.addEventListener('change',()=>seeking=false);
  vol.addEventListener('input',()=>{v.volume=vol.value/100;v.muted=false;setP(vol);$('[data-a=mute]',root).innerHTML=Ic(v.volume?'volume':'mute',17)});
  const toggle=()=>v.paused?v.play().catch(()=>{}):v.pause();stage.addEventListener('click',toggle);
  function fsToggle(){const el=stage;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else if(el.requestFullscreen||el.webkitRequestFullscreen)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}

<script>

const Browser=(()=>{
 const LINKS=[['Wikipedia','https://zh.m.wikipedia.org/'],['MDN 文档','https://developer.mozilla.org/zh-CN/'],['Bing','https://www.bing.com/'],['GitHub','https://github.com/'],['DuckDuckGo','https://duckduckgo.com/'],['Example','https://example.com/']];
 function open(o={}){
  const win=WM.create({app:'browser',title:'网页浏览器',icon:'browser',w:980,h:660,minW:360,minH:280});const root=win.body;
  root.innerHTML=`<div class="br"><div class="tbar br-bar"><button class="ibtn" data-a="back" title="后退">${Ic('back',17)}</button><button class="ibtn" data-a="fwd" title="前进">${Ic('forward',17)}</button><button class="ibtn" data-a="reload" title="刷新">${Ic('refresh',17)}</button><button class="ibtn" data-a="home" title="主页">${Ic('home',17)}</button><input class="inp br-url" placeholder="输入网址、搜索词，或 VFS 路径如 /Desktop/示例页面.html" spellcheck="false" autocapitalize="off"><button class="ibtn" data-a="ext" title="在新标签页打开">${Ic('external',17)}</button></div><div class="br-note"><span>提示：许多网站禁止被嵌入框架显示；若页面空白，请点击右侧按钮在新标签页打开。</span><button class="btn" data-a="ext" style="height:26px">新标签页打开</button><button class="ibtn" data-a="nono" style="width:26px;height:26px">${Ic('close',13)}</button></div><div class="br-view"><iframe sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox" title="浏览器视图"></iframe><div class="br-home"></div></div></div>`;
  const url=$('.br-url',root),fr=$('iframe',root),home=$('.br-home',root),note=$('.br-note',root);let hist=[],hi=-1,cur='',blobs=[],curSrc='';

   const inp=$('.sb input',home);$('.sb button',home).onclick=()=>nav(inp.value);inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')nav(inp.value)})}

   if(/^(blob:|data:)/i.test(x)){fr.src=x;curSrc=x;return}
   if(x.startsWith('/')||/^vfs:/i.test(x)){const p=fs.norm(x.replace(/^vfs:/i,''));let st;try{st=await fs.stat(p)}catch(e){UI.toast('文件不存在：'+p,'err');return}if(st.type==='directory'){OS.launch('explorer',{path:p});return}
    const k=kindOf(st.name);let u;if(k==='html'){let h=await fs.readText(p);h=await resolveHtmlAssets(h,P.dirname(p));u=mkBlob(new Blob([h],{type:'text/html'}))}else if(k==='text'||k==='code'||k==='sheet'){u=mkBlob(new Blob([await fs.readBlob(p)],{type:'text/plain;charset=utf-8'}))}else u=mkBlob(await fs.readBlob(p));fr.src=u;curSrc=u;win.setTitle(st.name+' — 浏览器');return}
   let t=x;if(!/^https?:\/\//i.test(t)){if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(t))t='https://'+t;else t='https://www.bing.com/search?q='+encodeURIComponent(t)}
   fr.src=t;curSrc=t;note.classList.add('on');try{win.setTitle(new URL(t).hostname+' — 浏览器')}catch(e){}}
  async function nav(x,push=true){x=(x||'').trim();if(!x||x==='about:home'){if(push){hist=hist.slice(0,hi+1);hist.push('about:home');hi=hist.length-1}cur='about:home';showHome();btns();return}

  const btns=()=>{$('[data-a=back]',root).disabled=hi<=0;$('[data-a=fwd]',root).disabled=hi>=hist.length-1};
  root.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){const k=a.dataset.a;if(k==='back'&&hi>0){hi--;nav(hist[hi],false)}else if(k==='fwd'&&hi<hist.length-1){hi++;nav(hist[hi],false)}else if(k==='reload'){cur==='about:home'?showHome():load(cur)}else if(k==='home')nav('about:home');else if(k==='ext'){if(/^https?:/i.test(curSrc)||/^blob:/i.test(curSrc))window.open(curSrc,'_blank');else UI.toast('当前页面不是外部网址')}else if(k==='nono')note.classList.remove('on');return}

/* ---- 计算器（标准 + 科学） ---- */
const Calc=(()=>{
 function evalExpr(src,deg){let t=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/(\d|\)|pi)\s*(\(|pi\b|sqrt|sin|cos|tan|ln|log|abs|exp)/g,'$1*$2');let i=0;const ws=()=>{while(t[i]===' ')i++};
  const rad=x=>deg?x*Math.PI/180:x,dg=x=>deg?x*180/Math.PI:x;const fact=n=>{if(n<0||n%1)throw Error('阶乘需为非负整数');if(n>170)return Infinity;let r=1;for(let k=2;k<=n;k++)r*=k;return r};
  const F={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>dg(Math.asin(x)),acos:x=>dg(Math.acos(x)),atan:x=>dg(Math.atan(x)),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp};
  function num(){ws();const m=/^\d*\.?\d+(?:e[+-]?\d+)?/i.exec(t.slice(i));if(!m)throw Error('表达式不完整');i+=m[0].length;return parseFloat(m[0])}
  function post(v){ws();for(;;){if(t[i]==='!'){i++;v=fact(v)}else if(t[i]==='%'){i++;v/=100}else break;ws()}return v}
  function prim(){ws();const c=t[i];if(c==='('){i++;const v=add();ws();if(t[i]!==')')throw Error('括号不匹配');i++;return post(v)}if(/[a-z]/i.test(c||'')){const m=/^[a-z]+/i.exec(t.slice(i))[0];i+=m.length;if(m==='pi')return post(Math.PI);if(m==='e')return post(Math.E);if(!F[m])throw Error('未知函数 '+m);ws();if(t[i]!=='(')throw Error('缺少括号');i++;const v=add();ws();if(t[i]!==')')throw Error('括号不匹配');i++;return post(F[m](v))}return post(num())}
  function pow(){const b=prim();ws();if(t[i]==='^'){i++;return Math.pow(b,un())}return b}
  function un(){ws();if(t[i]==='-'){i++;return-un()}if(t[i]==='+'){i++;return un()}return pow()}
  function mul(){let v=un();for(;;){ws();const c=t[i];if(c==='*'){i++;v*=un()}else if(c==='/'){i++;v/=un()}else break}return v}
  function add(){let v=mul();for(;;){ws();const c=t[i];if(c==='+'){i++;v+=mul()}else if(c==='-'){i++;v-=mul()}else break}return v}
  const r=add();ws();if(i<t.length)throw Error('语法错误');return r}
 const fmt=r=>{if(!isFinite(r))return r>0?'∞':r<0?'-∞':'未定义';const x=parseFloat(r.toPrecision(12));return Math.abs(x)>=1e15||(Math.abs(x)<1e-9&&x!==0)?x.toExponential(6):String(x)};
 function open(){
  const win=WM.create({app:'calc',title:'计算器',icon:'calc',w:400,h:560,minW:300,minH:420});const root=win.body;
  const sci=['sin(','cos(','tan(','ln(','log(','√(','^','π','e','!','(',')','%'];
  root.innerHTML=`<div class="calc" tabindex="0"><div class="tbar" style="min-height:36px"><button class="ibtn" data-x="sci" title="科学模式">${Ic('cpu',17)}</button><button class="btn" data-x="deg" style="height:26px;font:600 11px var(--font-mono)">DEG</button><span style="flex:1"></span><button class="ibtn" data-x="hist" title="历史记录">${Ic('clock',17)}</button></div><div class="calc-disp"><div class="calc-ex"></div><div class="calc-res">0</div></div><div class="calc-body"><div class="calc-sci">${sci.map(s=>`<button class="k fn" data-k="${s}">${s.replace('(','')}</button>`).join('')}</div><div class="calc-pad">${['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','±','0','.','+'].map(k=>`<button class="k ${'C⌫()'.includes(k)&&k?'fn':'÷×−+'.includes(k)?'op':''}" data-k="${k}">${k}</button>`).join('')}<button class="k eq" data-k="=" style="grid-column:1/-1">=</button></div></div><div class="calc-hist"></div></div>`;
  const c=$('.calc',root),ex=$('.calc-ex',root),res=$('.calc-res',root),hs=$('.calc-hist',root);let expr='',deg=true,hist=[],just=false;
  try{hist=JSON.parse(localStorage.getItem('qr.calc')||'[]')}catch(e){}
  const show=()=>{ex.textContent=expr;let r='0';if(expr){try{r=fmt(evalExpr(expr.replace(/[+\-×÷−^]$/,''),deg))}catch(e){r=res.dataset.last||'…'}}res.textContent=expr?r:'0';res.dataset.last=r;res.style.fontSize=r.length>12?'28px':r.length>9?'34px':''};
  function press(k){if(k==='C'){expr='';just=false}else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){if(!expr)return;try{const r=fmt(evalExpr(expr,deg));hist.unshift({e:expr,r});hist=hist.slice(0,40);try{localStorage.setItem('qr.calc',JSON.stringify(hist))}catch(e){}expr=r==='未定义'?'':r;just=true;ex.textContent=hist[0].e+' =';res.textContent=r;res.dataset.last=r;return}catch(e){res.textContent=e.message;return}}
   else if(k==='±'){if(expr.startsWith('-('))expr=expr.slice(2,-1);else if(expr)expr='-('+expr+')'}else{if(just&&/[\d.π]/.test(k)&&k.length===1||just&&/^[a-z√(]/.test(k)){expr=''}just=false;expr+=k}show()}
  c.addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k){press(k.dataset.k);return}const x=e.target.closest('[data-x]');if(!x)return;const a=x.dataset.x;if(a==='sci'){c.classList.toggle('sci');win.w=c.classList.contains('sci')?Math.max(win.w,620):win.w;if(!win.max&&c.classList.contains('sci')){win.el.style.width=win.w+'px'}}else if(a==='deg'){deg=!deg;x.textContent=deg?'DEG':'RAD';show()}else if(a==='hist'){hs.innerHTML=hist.length?hist.map((h,i)=>`<div data-i="${i}">${esc(h.e)}<b>= ${esc(h.r)}</b></div>`).join(''):'<div style="text-align:center;color:var(--tx3)">暂无历史</div>';hs.classList.toggle('on')}});
  hs.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d){expr=hist[+d.dataset.i].r;just=false;show();hs.classList.remove('on')}});
  c.addEventListener('keydown',e=>{const k=e.key;if(/^[0-9.()]$/.test(k))press(k);else if(k==='+')press('+');else if(k==='-')press('−');else if(k==='*')press('×');else if(k==='/'){e.preventDefault();press('÷')}else if(k==='Enter'||k==='='){e.preventDefault();press('=')}else if(k==='Backspace')press('⌫');else if(k==='Escape'||k==='Delete')press('C');else if(k==='^')press('^');else if(k==='%')press('%');else if(k==='!')press('!')});
  show();c.focus();return win}

OS.registerApp({id:'calc',name:'计算器',icon:'calc',desc:'标准与科学计算 历史记录',open:()=>Calc.open()});
/* ---- 画板 ---- */
const Paint=(()=>{
 async function open(o={}){
  const win=WM.create({app:'paint',title:'画板',icon:'paint',w:940,h:640,minW:360,minH:320,data:{}});const root=win.body;
  const COLORS=['#000000','#ffffff','#ff6b3d','#ffb547','#f4e04d','#c9f45b','#3ddc97','#38bdf8','#4f7cff','#a78bfa','#f472b6','#8b5e3c','#6b7280','#d1d5db'];

  const cv=$('canvas',root),x=cv.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);

  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  const ps=$('.ps',root),pc=$('.pc',root);ps.oninput=()=>{size=+ps.value;$('.pv',root).textContent=size+'px'};pc.oninput=()=>color=pc.value;
  $$('.pt-sw i',root).forEach(i=>i.onclick=()=>{color=i.dataset.c;pc.value=color});

  function flood(px,py){const w=cv.width,h=cv.height,img=x.getImageData(0,0,w,h),d=new Uint32Array(img.data.buffer);px=Math.floor(px);py=Math.floor(py);const t=d[py*w+px];const tmp=document.createElement('canvas').getContext('2d');tmp.fillStyle=color;tmp.fillRect(0,0,1,1);const c4=tmp.getImageData(0,0,1,1).data;const nc=(255<<24)|(c4[2]<<16)|(c4[1]<<8)|c4[0];if(t===nc)return;const st=[[px,py]];while(st.length){let[cx,cy]=st.pop();while(cy>=0&&d[cy*w+cx]===t)cy--;cy++;let l=false,r=false;while(cy<h&&d[cy*w+cx]===t){d[cy*w+cx]=nc;if(cx>0){if(d[cy*w+cx-1]===t){if(!l){st.push([cx-1,cy]);l=true}}else l=false}if(cx<w-1){if(d[cy*w+cx+1]===t){if(!r){st.push([cx+1,cy]);r=true}}else r=false}cy++}}x.putImageData(img,0,0)}

  root.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;if(k==='undo')doUndo();else if(k==='redo')doRedo();else if(k==='clear'){snap();x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height)}else if(k==='dl')FileOps.saveBlob(await toBlob(),'画板.png');

   else if(k==='open'){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;const bm=await createImageBitmap(f);const w=Math.min(bm.width,3000),h=Math.round(bm.height*w/bm.width);cv.width=w;cv.height=h;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bm,0,0,w,h);undo=[];redo=[]};i.click()}});
  root.tabIndex=0;root.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}else if(k==='y'){e.preventDefault();doRedo()}else if(k==='s'){e.preventDefault();$('[data-a=save]',root).click()}});
  if(o.path)await loadImg(o.path);return win}

OS.registerApp({id:'paint',name:'画板',icon:'paint',desc:'画笔 形状 填充 保存到文件系统',open:o=>Paint.open(o)});

<script>
/* ================================================================
   P10 · 设置（含存储占用可视化）· 压缩包（原生 ZIP/TAR/GZ + JSZip + 7z-wasm）· v86 虚拟机
   ================================================================ */
const Archive=(()=>{
 const safe=n=>String(n).replace(/\\/g,'/').split('/').filter(s=>s&&s!=='.'&&s!=='..').join('/');
 const decName=(b,utf8)=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){try{return new TextDecoder('gbk').decode(b)}catch(e2){return new TextDecoder().decode(b)}}};

 async function nativeZip(blob){const size=blob.size,tail=await blob.slice(Math.max(0,size-66000),size).arrayBuffer(),dv=new DataView(tail);let e=-1;for(let i=tail.byteLength-22;i>=0;i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw Error('不是有效的 ZIP 文件');
  const cnt=dv.getUint16(e+10,true),cdSize=dv.getUint32(e+12,true),cdOff=dv.getUint32(e+16,true);const cdBuf=await blob.slice(cdOff,cdOff+cdSize).arrayBuffer(),cd=new DataView(cdBuf),u8=new Uint8Array(cdBuf);let p=0;const out=[];
  for(let k=0;k<cnt;k++){if(cd.getUint32(p,true)!==0x02014b50)break;const method=cd.getUint16(p+10,true),cs=cd.getUint32(p+20,true),us=cd.getUint32(p+24,true),nl=cd.getUint16(p+28,true),el=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true),lo=cd.getUint32(p+42,true);const name=decName(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
   out.push({name,dir:name.endsWith('/'),size:us,get:async()=>{const lh=new DataView(await blob.slice(lo,lo+30).arrayBuffer());const ds=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);const data=blob.slice(ds,ds+cs);if(method===0)return data;if(method===8)return pipe(data,'deflate-raw');throw Error('不支持的压缩方式 '+method)}})}return out}
 async function zipEntries(blob){try{const JS=await Libs.jszip();const z=await JS.loadAsync(blob,{decodeFileName:b=>decName(Uint8Array.from(b))});const out=[];z.forEach((rel,f)=>out.push({name:rel,dir:f.dir,size:f._data&&f._data.uncompressedSize||0,get:()=>f.async('blob')}));return out}catch(e){console.warn('JSZip 不可用或失败，使用原生解析',e);return nativeZip(blob)}}
 async function tarEntries(blob){const out=[],dec=new TextDecoder();let off=0,longName=null;while(off+512<=blob.size){const h=new Uint8Array(await blob.slice(off,off+512).arrayBuffer());if(h.every(b=>b===0))break;const str=(a,b)=>dec.decode(h.subarray(a,b)).replace(/\0[\s\S]*$/,'');let name=str(0,100);const pre=str(345,500);if(pre)name=pre+'/'+name;const size=parseInt(str(124,136).trim()||'0',8)||0,type=String.fromCharCode(h[156]||48),start=off+512,end=start+size;off=start+Math.ceil(size/512)*512;

 async function sevenEntries(path,blob){const SZ=await Libs.sevenzip();const sz=await SZ();const ext=(path.match(/\.[^./]+$/)||[''])[0];sz.FS.writeFile('/in'+ext,new Uint8Array(await blob.arrayBuffer()));sz.FS.mkdir('/out');sz.callMain(['x','/in'+ext,'-o/out','-y']);const out=[];const walk=(d,rel)=>{for(const n of sz.FS.readdir(d)){if(n==='.'||n==='..')continue;const full=d+'/'+n,r=rel?rel+'/'+n:n,s=sz.FS.stat(full);if(sz.FS.isDir(s.mode)){out.push({name:r+'/',dir:true,size:0,get:async()=>null});walk(full,r)}else out.push({name:r,dir:false,size:s.size,get:async()=>new Blob([sz.FS.readFile(full)])})}};walk('/out','');return out}

 async function extract(path,dest,announce){try{UI.toast('正在解压 '+P.basename(path)+' …');const list=await entriesOf(path);await fs.mkdir(dest);let n=0;for(const e of list){const rel=safe(e.name);if(!rel)continue;const t=P.join(dest,rel);if(e.dir){await fs.mkdir(t);continue}const b=await e.get();await fs.writeFile(t,b);n++}UI.toast(`已解压 ${n} 个文件到 ${dest}`,'ok',{label:'打开',fn:()=>OS.launch('explorer',{path:dest})});return n}catch(err){UI.toast('解压失败：'+err.message,'err');console.error(err);return 0}}
 async function zipPaths(paths){const JS=await Libs.jszip();const z=new JS();const add=async(p,base)=>{const st=await fs.stat(p);if(st.type==='directory'){z.folder(base);for(const c of await fs.readdir(p,true))await add(c.path,base+'/'+c.name)}else z.file(base,await fs.readBlob(p))};for(const p of paths)await add(p,P.basename(p));return z.generateAsync({type:'blob',compression:'DEFLATE'})}

  root.innerHTML=`<div class="tbar"><button class="btn pri" data-a="here">${Ic('import',15)}<span>解压到当前文件夹</span></button><button class="btn" data-a="sub">${Ic('folder',15)}<span>解压到「${esc(base)}」</span></button><button class="btn" data-a="to">${Ic('mount',15)}<span>解压到…</span></button></div><div class="ar-list"><div class="empty">${Ic('archive',34)}<div>正在读取压缩包目录…</div></div></div><div class="sbar"><span class="i1"></span></div>`;
  const lst=$('.ar-list',root);let entries=[];const dir=P.dirname(path);
  try{entries=await entriesOf(path);const files=entries.filter(e=>!e.dir);lst.innerHTML=entries.slice(0,3000).map(e=>`<div>${tileHTML(kindOf(e.name,e.dir),extOf(e.name),'sm')}<span>${esc(e.name)}</span><em>${e.dir?'':fmtSize(e.size)}</em></div>`).join('')||'<div class="empty">压缩包为空</div>';$('.i1',root).textContent=`${files.length} 个文件 · ${entries.length-files.length} 个文件夹${entries.length>3000?' · 仅显示前 3000 项':''}`}catch(e){lst.innerHTML=`<div class="empty" style="color:var(--bad)">${Ic('info',30)}<div>无法读取此压缩包</div><div style="font-size:12px;color:var(--tx3);max-width:380px">${esc(e.message)}</div></div>`}
  root.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;if(k==='here')extract(path,dir);else if(k==='sub')extract(path,P.join(dir,base));else if(k==='to'){const d=await UI.prompt('解压到目录（绝对路径）',dir);if(d)extract(path,fs.norm(d))}});return win}
 return{open,extract,zipPaths,entriesOf}})();
OS.registerApp({id:'archive',name:'压缩包管理器',icon:'archive',desc:'ZIP TAR GZ 7Z RAR 解压与压缩',hidden:true,open:o=>Archive.open(o)});

 const PAGES=[['appearance','外观','palette'],['desktop','桌面','desktop'],['time','任务栏与时间','clock'],['files','文件与应用','folder'],['storage','存储','storage'],['about','关于与重置','info']];

  win.data.start=start;win.on('close',()=>{document.removeEventListener('pointerdown',onDown,true);document.removeEventListener('pointerlockchange',onLock);if(document.pointerLockElement)document.exitPointerLock();if(emu){try{emu.destroy()}catch(e){}}});

const WELCOME=`# 欢迎来到隙光 OS

**隙光**（Fissure Lumen）是一个运行在浏览器中的单文件桌面系统：黑色岩板之间，光从裂隙里透出来。

## 你可以做什么

- 桌面图标就是 \`/Desktop\` 里的真实文件，可以**自由拖动**、吸附到网格、框选、拖进文件夹
- 文件保存在浏览器的 **OPFS** 私有存储中，刷新后依然存在
- 从电脑桌面把文件**拖进来**即可导入；把文件从这里**拖出去**即可导出
- 在文件管理器中点击「+」可**挂载电脑上的真实文件夹**（需 Chrome / Edge）
- 双击 \`.html\` 文件：左侧编辑源码，右侧实时预览
- 点击任意图片：漫画阅读器会按自然顺序载入同目录所有图片，并可沉浸全屏
- 拖动窗口到屏幕边缘可**贴靠**；悬停任务栏图标可**预览窗口**
- 右下角时钟可打开日历，默认 12 小时制，可在设置中调整

## 快捷键

| 键位 | 功能 |
| --- | --- |
| Alt + 方向键 | 窗口贴靠 |
| Ctrl + S | 保存 |
| F2 / Del | 重命名 / 删除 |

> 试试打开 /Pictures/示例漫画 里的任意一页。
`;

async function restoreMounts(){const recs=await IDB.values('handles');const pending=[];
 for(const r of recs){if(!r||!r.handle)continue;try{const perm=await r.handle.queryPermission({mode:'readwrite'});if(perm==='granted')await fs.mount(r.name,r.handle,false);else pending.push(r)}catch(e){pending.push(r)}}
 if(!pending.length)return;const node=mk('div');node.innerHTML='<p>上次挂载的本地文件夹需要重新授权访问（浏览器安全策略要求每次会话重新确认）：</p>';
 pending.forEach(r=>{const row=mk('div');row.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)';row.innerHTML=`<span style="flex:1;word-break:break-all">${Ic('mount',15)} ${esc(r.name)}</span>`;const b=mk('button','btn pri','重新挂载'),d=mk('button','btn dng','忘记');
  b.onclick=async()=>{try{const p=await r.handle.requestPermission({mode:'readwrite'});if(p==='granted'){await fs.mount(r.name,r.handle,false);b.textContent='已挂载';b.disabled=true}else UI.toast('未授予权限','err')}catch(e){UI.toast('授权失败：'+e.message,'err')}};d.onclick=async()=>{await IDB.del('handles',r.name);row.remove()};row.append(b,d);node.append(row)});
 UI.dialog({title:'重新挂载本地文件夹',node,buttons:[{label:'稍后',value:true,primary:true}]})}
