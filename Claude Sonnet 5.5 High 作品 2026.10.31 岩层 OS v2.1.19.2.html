<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0c0e11">
<title>岩层 OS · STRATA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@300;400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" defer></script>
<style>
:root{--accent:#e0a23b;--on-acc:#1b1305;--acc2:#4fc3b0;--danger:#e5604d;--ok:#8ec15a;--r:10px;--r-s:6px;--tbh:54px;--wab:54px;--fs:1;--isz:64px;--cw:96px;--ch:104px;
--font:'Schibsted Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
--mono:'Martian Mono',ui-monospace,Consolas,'Courier New',monospace;
--serif:'Fraunces','Noto Serif SC','Songti SC',serif;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=dark]{--bg0:#0c0e11;--bg1:#13171c;--bg2:#1a1f26;--bg3:#242b34;--bg4:#2f3843;--line:rgba(236,226,200,.09);--line2:rgba(236,226,200,.17);--fg:#ece6d6;--fg2:#a8a294;--fg3:#6f6b60;--shadow:0 18px 50px rgba(0,0,0,.55);--glass:rgba(15,18,23,.8);--acc-t:var(--accent);--hov:rgba(236,226,200,.07);color-scheme:dark}
[data-theme=light]{--bg0:#e6dfcf;--bg1:#f3eee2;--bg2:#fbf8f0;--bg3:#e9e2d1;--bg4:#d9d0bb;--line:rgba(60,50,30,.12);--line2:rgba(60,50,30,.22);--fg:#27241d;--fg2:#5e584a;--fg3:#948d7c;--shadow:0 16px 40px rgba(70,55,25,.26);--glass:rgba(248,244,233,.84);--acc-t:color-mix(in srgb,var(--accent) 62%,#2a1a00);--hov:rgba(60,50,30,.07);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000;color:var(--fg);font:400 calc(13.5px*var(--fs))/1.45 var(--font);user-select:none;-webkit-user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
svg.ic{display:block;flex:none}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:8px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--fg3);background-clip:padding-box;border:3px solid transparent}::-webkit-scrollbar-corner{background:transparent}
body[data-anim=off] *{animation-duration:0s!important;transition-duration:0s!important}
#os{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;background:#111 center/cover no-repeat;transition:opacity .4s}
#wallpaper::after{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 78% 16%,transparent 0 26px,rgba(255,255,255,.028) 26px 27px),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.28))}
#desktop{position:absolute;left:0;top:0;right:0;bottom:var(--wab);overflow:hidden;touch-action:none}
#wins{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:10}
#wins>*{pointer-events:auto}
.rband{position:absolute;pointer-events:none;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent);z-index:50;border-radius:2px;display:none}
.dicon{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;border-radius:var(--r-s);transition:transform .34s var(--ease),background .15s,opacity .15s;cursor:default;touch-action:none;-webkit-user-drag:element;border:1px solid transparent}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon.sel{background:color-mix(in srgb,var(--accent) 26%,transparent);border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.dicon.dragging{opacity:.35}.dicon.dropt{background:color-mix(in srgb,var(--acc2) 35%,transparent);border-color:var(--acc2)}
.dicon .lb{font-size:12px;text-align:center;line-height:1.28;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;width:100%}
#cellhint{position:absolute;border:1.5px dashed var(--accent);border-radius:var(--r-s);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;display:none;left:0;top:0}
/* tiles */
.tile{--s:48px;width:var(--s);height:var(--s);display:grid;place-items:center;position:relative;color:#fff;flex:none;background:linear-gradient(155deg,var(--c1),var(--c2));clip-path:polygon(0 0,calc(100% - var(--s)*.24) 0,100% calc(var(--s)*.24),100% 100%,0 100%);border-radius:calc(var(--s)*.2) 0 calc(var(--s)*.2) calc(var(--s)*.2);overflow:hidden}
.tile::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 calc(var(--s)*.11),rgba(255,255,255,.08) calc(var(--s)*.11) calc(var(--s)*.125))}
.tile svg{width:54%;height:54%;stroke-width:1.7;position:relative;z-index:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.28))}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.gl{color:var(--c1);display:inline-grid;place-items:center;flex:none}
/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:winin .26s var(--ease);transition:opacity .2s,transform .24s var(--ease),box-shadow .2s}
.win.active{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 38%,var(--line2))}
.win.anim{transition:left .24s var(--ease),top .24s var(--ease),width .24s var(--ease),height .24s var(--ease),opacity .2s,transform .24s var(--ease)}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--wab))!important;border-radius:0;border-width:0}
.win.min{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none!important;visibility:hidden;transition:opacity .2s,transform .24s var(--ease),visibility 0s .24s}
.win.closing{opacity:0;transform:scale(.95);pointer-events:none}
@keyframes winin{from{opacity:0;transform:translateY(16px) scale(.965)}}
.win-tb{position:relative;height:38px;flex:none;display:flex;align-items:center;background:var(--bg2);border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid var(--line);touch-action:none;overflow:hidden}
.win.max .win-tb{border-radius:0}
.win-tb::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent) 0 12%,var(--acc2) 12% 17%,var(--line2) 17% 100%);opacity:.35;transition:opacity .2s}
.win.active .win-tb::before{opacity:1}
.win-ic{margin:0 9px 0 11px;display:grid}
.win-title{flex:1;min-width:0;font-weight:600;font-size:12.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.win.active .win-title{color:var(--fg)}
.win-acts{display:flex;height:100%}
.win-btn{width:44px;height:100%;display:grid;place-items:center;color:var(--fg2);transition:background .12s,color .12s}
.win-btn:hover{background:var(--hov);color:var(--fg)}.win-btn.x:hover{background:var(--danger);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:0 0 var(--r) var(--r);background:var(--bg1)}
.win.max .win-body{border-radius:0}
.rz{position:absolute;z-index:5}
.rz[data-d=n]{left:8px;right:8px;top:-4px;height:8px;cursor:ns-resize}.rz[data-d=s]{left:8px;right:8px;bottom:-4px;height:8px;cursor:ns-resize}
.rz[data-d=e]{top:8px;bottom:8px;right:-4px;width:8px;cursor:ew-resize}.rz[data-d=w]{top:8px;bottom:8px;left:-4px;width:8px;cursor:ew-resize}
.rz[data-d=ne]{right:-4px;top:-4px;width:14px;height:14px;cursor:nesw-resize}.rz[data-d=sw]{left:-4px;bottom:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz[data-d=nw]{left:-4px;top:-4px;width:14px;height:14px;cursor:nwse-resize}.rz[data-d=se]{right:-4px;bottom:-4px;width:14px;height:14px;cursor:nwse-resize}
.win.max .rz{display:none}
body.noiframe iframe,body.noiframe embed,body.noiframe video{pointer-events:none!important}
body.peek .win:not(.peek-t){opacity:0!important;pointer-events:none!important}
body.peek .win.peek-t.min{opacity:.97;transform:none;visibility:visible}
body.peek-desk .win{opacity:.1!important;pointer-events:none!important}
#snap-prev{position:fixed;z-index:8000;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:var(--r);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:all .18s var(--ease)}
/* taskbar */
#tb{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);z-index:9000;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35);border-top:1px solid var(--line2);transition:transform .28s var(--ease)}
#tb::before{content:'';position:absolute;left:0;right:0;top:-3px;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 34px,transparent 34px 40px,var(--acc2) 40px 48px,transparent 48px 96px);opacity:.4;pointer-events:none}
body[data-tbhide=on] #tb{transform:translateY(calc(100% - 4px))}body[data-tbhide=on] #tb:hover{transform:none}
#tb-apps{flex:1;display:flex;gap:3px;min-width:0;overflow-x:auto;overflow-y:visible;scrollbar-width:none}
#tb-apps::-webkit-scrollbar{display:none}
body[data-tbalign=center] #tb-apps{justify-content:center}
.tb-i{position:relative;height:42px;min-width:42px;padding:0 9px;display:flex;align-items:center;gap:8px;border-radius:var(--r-s);flex:none;transition:background .15s,transform .15s}
.tb-i:hover{background:var(--hov)}.tb-i:active{transform:scale(.94)}
.tb-i.run::after{content:'';position:absolute;left:32%;right:32%;bottom:2px;height:2px;border-radius:2px;background:var(--fg3);transition:all .25s var(--ease)}
.tb-i.act{background:color-mix(in srgb,var(--accent) 14%,transparent)}.tb-i.act::after{left:16%;right:16%;background:var(--accent)}
.tb-i .cnt{position:absolute;right:3px;top:2px;font:600 9px var(--mono);background:var(--accent);color:var(--on-acc);border-radius:7px;padding:0 4px}
.tb-i .tl{font-size:12px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
body[data-tblabels=on] .tb-i .tl{display:block}
#tb-start{width:44px;padding:0;justify-content:center;color:var(--accent)}
#tb-tray{display:flex;align-items:center;gap:2px}
.tray-b{height:42px;padding:0 10px;display:flex;align-items:center;gap:7px;border-radius:var(--r-s);font:500 11.5px var(--mono);color:var(--fg2);letter-spacing:-.02em}
.tray-b:hover{background:var(--hov);color:var(--fg)}
#tb-clock{flex-direction:column;align-items:flex-end;gap:0;line-height:1.25;font-size:11.5px;color:var(--fg)}
#tb-clock small{font-size:10px;color:var(--fg2)}
#tb-show{width:10px;height:100%;border-left:1px solid var(--line2);margin-left:4px;transition:background .15s}#tb-show:hover{background:var(--hov)}
/* popups */
.pop{position:fixed;z-index:9100;background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border:1px solid var(--line2);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .26s var(--ease),visibility 0s .26s}
.pop.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .2s,transform .26s var(--ease)}
#start{left:8px;bottom:calc(var(--wab) + 10px);width:min(580px,calc(100vw - 16px));height:min(640px,calc(100vh - var(--wab) - 26px));display:flex;flex-direction:column;overflow:hidden}
body[data-tbalign=center] #start{left:50%;margin-left:calc(min(580px,100vw - 16px)/-2)}
.st-search{margin:14px 14px 6px;display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;height:42px;color:var(--fg2)}
.st-search:focus-within{border-color:var(--accent)}
.st-search input{flex:1;background:none;border:0;outline:0;font-size:14px;color:var(--fg)}
.st-body{flex:1;overflow:auto;padding:6px 14px 10px}
.st-h{font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--fg3);text-transform:uppercase;margin:12px 4px 8px}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:var(--r-s);font-size:12px;text-align:center;transition:background .12s,transform .2s var(--ease)}
.st-app:hover{background:var(--hov);transform:translateY(-2px)}
.st-row{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:var(--r-s);width:100%;text-align:left}.st-row:hover{background:var(--hov)}
.st-row .s2{font-size:11px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg0) 40%,transparent)}
.st-foot .u{flex:1;font:600 13px var(--serif);display:flex;align-items:center;gap:10px}
#cal{right:8px;bottom:calc(var(--wab) + 10px);width:330px;padding:18px}
.cal-time{font:300 44px var(--serif);letter-spacing:-.02em;line-height:1}
.cal-date{color:var(--fg2);margin:4px 0 14px;font-size:12.5px}
.cal-hd{display:flex;align-items:center;gap:4px;margin-bottom:8px}.cal-hd b{flex:1;font:600 14px var(--serif)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g span{padding:7px 0;font-size:12px;border-radius:var(--r-s);position:relative;cursor:pointer;font-family:var(--mono)}
.cal-g span.w{color:var(--fg3);font:600 10px var(--font);cursor:default}.cal-g span.o{color:var(--fg3)}
.cal-g span:not(.w):hover{background:var(--hov)}
.cal-g span.t{background:var(--accent);color:var(--on-acc);font-weight:700}
.cal-g span.s{outline:1.5px solid var(--acc2)}
#peekcard{position:fixed;z-index:9050;display:none;gap:8px;padding:8px;background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line2);border-radius:calc(var(--r) + 2px);box-shadow:var(--shadow)}
.pk{width:190px;border-radius:var(--r-s);padding:8px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.pk:hover{border-color:var(--accent)}.pk-h{display:flex;align-items:center;gap:7px;font-size:12px}.pk-h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-h button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg2)}.pk-h button:hover{background:var(--danger);color:#fff}
.pk-m{height:70px;margin-top:7px;border-radius:4px;background:var(--bg0);position:relative;overflow:hidden}
.pk-m i{position:absolute;background:color-mix(in srgb,var(--accent) 30%,var(--bg3));border:1px solid var(--accent);border-radius:2px}
#switcher{position:fixed;inset:0;z-index:9200;background:rgba(0,0,0,.55);backdrop-filter:blur(16px);display:none;padding:24px 16px calc(var(--wab) + 20px);overflow:auto}
#switcher.on{display:block;animation:fadein .2s}
.sw-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw-c{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sw-c .tt{display:flex;width:100%;align-items:center;gap:6px;font-size:12px}.sw-c .tt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes fadein{from{opacity:0}}
/* menu */
.menu{position:fixed;z-index:9500;min-width:216px;padding:5px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:calc(var(--r) + 2px);box-shadow:var(--shadow);animation:menuin .14s var(--ease);max-height:calc(100vh - 16px);overflow:auto}
@keyframes menuin{from{opacity:0;transform:translateY(-5px) scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-s);font-size:13px;position:relative;cursor:default;white-space:nowrap}
.mi:hover:not(.dis){background:color-mix(in srgb,var(--accent) 22%,transparent)}
.mi.dis{opacity:.4}.mi.danger{color:var(--danger)}
.mi .k{margin-left:auto;font:10.5px var(--mono);color:var(--fg3);padding-left:20px}
.mi .ar{margin-left:auto;color:var(--fg3)}
.mi .ck{width:16px;display:grid}
.msep{height:1px;background:var(--line);margin:5px 4px}
.msub{position:absolute;left:100%;top:-6px;display:none}.mi:hover>.msub{display:block}
.mi.flipl>.msub{left:auto;right:100%}
/* dialog */
.dlg-b{position:fixed;inset:0;z-index:9600;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:grid;place-items:center;animation:fadein .15s;padding:12px}
.dlg{width:min(440px,100%);background:var(--bg1);border:1px solid var(--line2);border-radius:calc(var(--r) + 2px);box-shadow:var(--shadow);overflow:hidden;animation:winin .22s var(--ease);max-height:92vh;display:flex;flex-direction:column}
.dlg.wide{width:min(640px,100%)}
.dlg h3{margin:0;padding:15px 18px;font:600 15px var(--serif);border-bottom:1px solid var(--line);background:var(--bg2);position:relative}
.dlg h3::after{content:'';position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--accent)}
.dlg-c{padding:16px 18px;overflow:auto;color:var(--fg2);line-height:1.6}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;background:var(--bg2);border-top:1px solid var(--line)}
.inp{width:100%;background:var(--bg0);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 11px;outline:0;color:var(--fg);user-select:text}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select.inp{padding-right:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;height:34px;border-radius:var(--r-s);background:var(--bg3);border:1px solid var(--line2);font-weight:500;white-space:nowrap;transition:background .12s,transform .12s,border-color .12s}
.btn:hover{background:var(--bg4)}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:var(--on-acc);border-color:transparent;font-weight:700}.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.dng{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}.btn.on{background:color-mix(in srgb,var(--accent) 28%,var(--bg3));border-color:var(--accent)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-s);color:var(--fg2);flex:none;transition:background .12s}
.ib:hover{background:var(--hov);color:var(--fg)}.ib.on{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--acc-t)}.ib[disabled]{opacity:.3;pointer-events:none}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}
input[type=range]{accent-color:var(--accent)}
/* toast / busy */
#toasts{position:fixed;right:14px;bottom:calc(var(--wab) + 14px);z-index:9700;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:min(380px,92vw);background:var(--bg2);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:var(--r-s);padding:10px 14px;box-shadow:var(--shadow);animation:toastin .3s var(--ease);font-size:13px}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--ok)}
@keyframes toastin{from{opacity:0;transform:translateX(30px)}}

.loadmask.off{opacity:0;pointer-events:none}
.loadmask .spin{height:28px}.loadmask .spin i{width:6px;animation-name:strata28}

/* 全局搜索 */
async gsearch(q){this.gq=q;if(this.gtok)this.gtok.cancel=true;const tok=this.gtok={cancel:false};this.mode='search';this.searching=true;this.raw=[];this.items=[];this.map=new Map();this.setSelQuiet([]);this.q='';this.crumbs();this.w.setTitle('搜索: '+q);this.apply();const upd=debounce(()=>{if(!tok.cancel)this.apply()},200);this.loading(true,'正在所有存储中搜索「'+q+'」…');setTimeout(()=>{if(this.searching)this.loading(false)},500);

const rec=async(p,label,icon,depth)=>{const ks=this.exp.has(p)||fs.isVirtual(p)?await kids(p):null;frag.append(node(p,label,icon,depth,ks===null?true:ks.length>0,!fs.isVirtual(p)));if(ks&&this.exp.has(p))for(const k of ks)await rec(k.path,k.label||k.name,gl(k.drive?'drive':'folder',16),depth+1)};
frag.insertAdjacentHTML('beforeend','<div class="tsh">快速访问</div>');for(const q of QUICK){const p=DEFB()+'/'+q;frag.append(node(p,q,gl('folder',16).replace('<span','<span title="'+q+'"'),0,false,true))}

side.innerHTML='';side.append(...frag.children);side.scrollTop=st}

<script>

async function launchNotepad(o={}){const w=WM.open({app:'notepad',title:'记事本',icon:tile('notepad',18),w:760,h:540});

/* ================= 18 · 表格 (CSV / TSV) ================= */
function parseCSV(t,d){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}

async function launchSheet(o={}){const w=WM.open({app:'sheet',title:'表格',icon:tile('sheet',18),w:860,h:560});let path=o.path||null,dirty=false,delim=path&&P.ext(path)==='tsv'?'\t':',',rows=[['']],view='table',hdr=true,cur={r:0,c:0},edited=false;

async function launchImgv(o={}){const w=WM.open({app:'imgv',title:'图片查看器',icon:tile('imgv',18),w:920,h:640});let list=[],idx=0,s=1,tx=0,ty=0,rot=0,fl=1,url=null,nw=0,nh=0;
