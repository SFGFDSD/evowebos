// ===== Calculator App =====
function openCalculator() {
  const id = generateId();
  let expression = '';
  let display = '0';
  let newNumber = true;

  const { el } = wm.create({
    id, title: '计算器', icon: ICONS.calc,
    width: 320, height: 460, app: 'calculator',
    body: `
      <div class="calculator">
        <div class="calc-display">
          <div class="calc-expr">&nbsp;</div>
          <div class="calc-value">0</div>
        </div>
        <div class="calc-grid">
          <button class="calc-btn clear" data-action="clear">AC</button>
          <button class="calc-btn op" data-action="negate">±</button>
          <button class="calc-btn op" data-action="percent">%</button>
          <button class="calc-btn op" data-op="/">÷</button>
          <button class="calc-btn" data-num="7">7</button>
          <button class="calc-btn" data-num="8">8</button>
          <button class="calc-btn" data-num="9">9</button>
          <button class="calc-btn op" data-op="*">×</button>
          <button class="calc-btn" data-num="4">4</button>
          <button class="calc-btn" data-num="5">5</button>
          <button class="calc-btn" data-num="6">6</button>
          <button class="calc-btn op" data-op="-">−</button>
          <button class="calc-btn" data-num="1">1</button>
          <button class="calc-btn" data-num="2">2</button>
          <button class="calc-btn" data-num="3">3</button>
          <button class="calc-btn op" data-op="+">+</button>
          <button class="calc-btn" data-num="0" style="grid-column:span 2">0</button>
          <button class="calc-btn" data-num=".">.</button>
          <button class="calc-btn eq" data-action="equals">=</button>
        </div>
      </div>
    `,
    onCreated: (winEl) => {
      const displayEl = winEl.querySelector('.calc-value');
      const exprEl = winEl.querySelector('.calc-expr');
      let prev = null, op = null, waitingForOperand = false;

      function updateDisplay() {
        displayEl.textContent = display;
      }

      winEl.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const num = btn.dataset.num;
          const op_ = btn.dataset.op;
          const action = btn.dataset.action;

          if (num !== undefined) {
            if (newNumber) { display = num === '.' ? '0.' : num; newNumber = false; }
            else { if (num === '.' && display.includes('.')) return; display += num; }
            updateDisplay();
          } else if (op_) {
            const current = parseFloat(display);
            if (prev !== null && !waitingForOperand) {
              prev = calculate(prev, current, op);
              display = String(prev);
              updateDisplay();
            } else { prev = current; }
            op = op_;
            waitingForOperand = true;
            newNumber = true;
            exprEl.textContent = `${prev} ${op}`;
          } else if (action === 'clear') {
            display = '0'; prev = null; op = null; newNumber = true; waitingForOperand = false;
            exprEl.textContent = '\u00a0';
            updateDisplay();
          } else if (action === 'negate') {
            display = String(-parseFloat(display));
            updateDisplay();
          } else if (action === 'percent') {
            display = String(parseFloat(display) / 100);
            updateDisplay();
          } else if (action === 'equals') {
            const current = parseFloat(display);
            if (prev !== null && op) {
              const result = calculate(prev, current, op);
              exprEl.textContent = `${prev} ${op} ${current} =`;
              display = String(result);
              prev = null; op = null; newNumber = true;
              updateDisplay();
            }
          }
        });
      });

      function calculate(a, b, op) {
        switch(op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return b !== 0 ? a / b : 0;
          default: return b;
        }
      }
    }
  });
}

        document.getElementById('wallpaper-import').click();
      });

      document.getElementById('wallpaper-import').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const blobUrl = URL.createObjectURL(new Blob([data], { type: file.type }));
        setWallpaper(null, blobUrl);
        await fs.writeFile('/wallpaper_' + file.name, data);
        await fs.metaStore.set('wallpaper', 'custom:' + file.name);
        showToast('自定义壁纸已设置');
        e.target.value = '';
      });

      // Navigation
      winEl.querySelectorAll('.settings-nav-item').forEach(item => {
        item.addEventListener('click', () => {
          winEl.querySelectorAll('.settings-nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          winEl.querySelectorAll('.settings-section').forEach(s => s.style.display = 'none');
          winEl.querySelector('#settings-' + item.dataset.section).style.display = 'block';
        });
      });

      // Reset
      winEl.querySelector('#reset-btn').addEventListener('click', async () => {
        if (confirm('确定要重置系统吗？所有数据将被清除。')) {
          await fs.clear();
          showToast('系统已重置');
          location.reload();
        }
      });
    }
  });
}

function setWallpaper(gradient, blobUrl) {
  const layer = document.getElementById('wallpaper-layer');
  if (blobUrl) {
    layer.innerHTML = `<div style="position:absolute;inset:0;background:url('${blobUrl}') center/cover no-repeat;"></div>`;
  } else if (gradient) {
    layer.innerHTML = `<div class="mist"></div><div class="mist"></div><div class="mist"></div><div class="ground"></div>`;
    layer.style.background = gradient;
  }
}

// ===== File Operations =====
async function createNewFolder(parentPath) {
  const name = prompt('文件夹名称:', '新建文件夹');
  if (!name) return;
  const path = parentPath === '/' ? '/' + name : parentPath + '/' + name;
  try {
    await fs.mkdir(path);
    showToast(`已创建文件夹: ${name}`);
    desktop.renderIcons();
    return path;
  } catch { showToast('创建失败', 'error'); }
}

async function createNewFile(parentPath) {
  const name = prompt('文件名:', '新建文件.txt');
  if (!name) return;
  const path = parentPath === '/' ? '/' + name : parentPath + '/' + name;
  try {
    await fs.writeFile(path, new TextEncoder().encode(''));
    showToast(`已创建文件: ${name}`);
    desktop.renderIcons();
    return path;
  } catch { showToast('创建失败', 'error'); }
}

async function renameItem(path) {
  const oldName = path.split('/').pop();
  const newName = prompt('新名称:', oldName);
  if (!newName || newName === oldName) return;
  const parentPath = path.split('/').slice(0, -1).join('/') || '/';
  const newPath = parentPath === '/' ? '/' + newName : parentPath + '/' + newName;
  try {
    await fs.rename(path, newPath);
    showToast('已重命名');
    desktop.renderIcons();
  } catch { showToast('重命名失败', 'error'); }
}

async function deleteItem(path) {
  if (!confirm(`确定要删除 ${path.split('/').pop()} 吗？`)) return;
  try {
    const stat = await fs.stat(path);
    if (stat.isDirectory) await fs.rmdir(path);
    else await fs.unlink(path);
    showToast('已删除');
    desktop.renderIcons();
  } catch { showToast('删除失败', 'error'); }
}

async function exportItem(path) {
  try {
    const stat = await fs.stat(path);
    const data = await fs.readFile(path);
    const blob = new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = stat.name;
    a.click();
    URL.revokeObjectURL(url);
    showToast(`已导出: ${stat.name}`);
  } catch { showToast('导出失败', 'error'); }
}

function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== Archive Extraction =====
async function openArchive(path) {
  const name = path.split('/').pop();
  try {
    const data = await fs.readFile(path);
    if (name.endsWith('.zip')) {
      await extractZip(data, path);
    } else if (name.endsWith('.gz')) {
      await extractGz(data, path);
    } else {
      showToast('不支持的压缩格式', 'error');
    }
  } catch (e) { showToast('解压失败: ' + e.message, 'error'); }
}

async function extractZip(data, path) {
  try {
    // Use DecompressionStream for gzip, or implement basic zip
    if (path.endsWith('.zip')) {
      const entries = await parseZip(data);
      const baseDir = path.replace(/\.zip$/, '');
      await fs.mkdir(baseDir);
      for (const entry of entries) {
        if (entry.isDirectory) {
          await fs.mkdir(baseDir + '/' + entry.name);
        } else {
          const fullPath = baseDir + '/' + entry.name;
          const parent = fullPath.split('/').slice(0, -1).join('/');
          if (parent) {
            try { await fs.mkdir(parent); } catch {}
          }
          await fs.writeFile(fullPath, entry.data);
        }
      }
      showToast(`已解压 ${entries.length} 个文件`);
    }
  } catch(e) {
    showToast('解压失败: ' + e.message, 'error');
  }
}

async function parseZip(data) {
  const entries = [];
  const view = new DataView(data);
  const uint8 = new Uint8Array(data);
  let offset = 0;

  // Find central directory
  let cdOffset = -1;
  for (let i = uint8.length - 22; i >= 0; i--) {
    if (view.getUint32(i, true) === 0x06054b50) {
      cdOffset = view.getUint32(i + 16, true);
      break;
    }
  }
  if (cdOffset === -1) return entries;

  let off = cdOffset;
  while (off < uint8.length) {
    if (view.getUint32(off, true) !== 0x02014b50) break;
    const compression = view.getUint16(off + 10, true);
    const compressedSize = view.getUint32(off + 20, true);
    const fileNameLength = view.getUint16(off + 28, true);
    const extraLength = view.getUint16(off + 30, true);
    const commentLength = view.getUint16(off + 32, true);
    const localHeaderOffset = view.getUint32(off + 42, true);
    const fileName = new TextDecoder().decode(uint8.slice(off + 46, off + 46 + fileNameLength));

    const isDir = fileName.endsWith('/');
    let fileData = null;
    if (!isDir) {
      // Read from local file header
      const lfh = localHeaderOffset;
      const lhCompression = view.getUint16(lfh + 8, true);
      const lhFileNameLength = view.getUint16(lfh + 26, true);
      const lhExtraLength = view.getUint16(lfh + 28, true);
      const lhDataOffset = lfh + 30 + lhFileNameLength + lhExtraLength;
      const compressedData = uint8.slice(lhDataOffset, lhDataOffset + compressedSize);

      if (lhCompression === 0) {
        fileData = compressedData;
      } else if (lhCompression === 8) {
        try {
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(compressedData);
          writer.close();
          const chunks = [];
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
          }
          const totalLen = chunks.reduce((a, c) => a + c.length, 0);
          fileData = new Uint8Array(totalLen);
          let pos = 0;
          for (const c of chunks) { fileData.set(c, pos); pos += c.length; }
        } catch {
          fileData = new Uint8Array(0);
        }
      }
    }

    entries.push({ name: fileName, isDirectory: isDir, data: fileData });
    off += 46 + fileNameLength + extraLength + commentLength;
  }
  return entries;
}

async function extractGz(data, path) {
  try {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    const reader = ds.readable.getReader();
    writer.write(data);
    writer.close();
    const chunks = [];
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    const totalLen = chunks.reduce((a, c) => a + c.length, 0);
    const result = new Uint8Array(totalLen);
    let pos = 0;
    for (const c of chunks) { result.set(c, pos); pos += c.length; }

    // Save as decompressed file
    const baseName = path.replace(/\.gz$/, '').replace(/\.tgz$/, '.tar');
    await fs.writeFile(baseName, result);
    showToast('已解压');
  } catch { showToast('解压失败', 'error'); }
}

// ===== Wallpaper Settings (quick access) =====
function openWallpaperSettings() {
  openSettings();
}

// ===== Start Menu =====
function setupStartMenu() {
  const startBtn = document.getElementById('start-btn');
  const startMenu = document.getElementById('start-menu');
  const appsContainer = document.getElementById('start-menu-apps');

  const apps = [
    { name: '文件管理器', icon: ICONS.explorer, action: () => openFileExplorer() },
    { name: '文本编辑器', icon: ICONS.text, action: () => openTextEditor(null, '') },
    { name: '网页浏览器', icon: ICONS.browser, action: () => openWebBrowser() },
    { name: '计算器', icon: ICONS.calc, action: openCalculator },
    { name: '系统设置', icon: ICONS.settings, action: openSettings },
    { name: '导入文件', icon: ICONS.upload, action: () => document.getElementById('file-import').click() },
  ];

  apps.forEach(app => {
    const item = document.createElement('div');
    item.className = 'start-app-item';
    item.innerHTML = `${app.icon} <span>${app.name}</span>`;
    item.addEventListener('click', () => { app.action(); startMenu.classList.remove('show'); });
    appsContainer.appendChild(item);
  });

  startBtn.addEventListener('click', e => {
    e.stopPropagation();
    startMenu.classList.toggle('show');
  });

  document.addEventListener('click', e => {
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) {
      startMenu.classList.remove('show');
    }
  });
}

setupStartMenu();

// ===== Boot Sequence =====
async function boot() {
  const bar = document.getElementById('boot-progress-bar');
  const text = document.getElementById('boot-text');
  const steps = [
    { pct: 20, msg: 'Initializing OPFS filesystem' },
    { pct: 40, msg: 'Loading storage engine' },
    { pct: 60, msg: 'Setting up virtual filesystem' },
    { pct: 80, msg: 'Configuring desktop environment' },
    { pct: 100, msg: 'Welcome to Aether OS' },
  ];

  for (const step of steps) {
    bar.style.width = step.pct + '%';
    text.textContent = step.msg;
    await new Promise(r => setTimeout(r, 400));
  }

  await new Promise(r => setTimeout(r, 600));

  // Restore wallpaper
  const savedWp = await fs.metaStore.get('wallpaper');
  if (savedWp) {
    if (savedWp.startsWith('custom:')) {
      const fname = savedWp.replace('custom:', '');
      try {
        const data = await fs.readFile('/' + fname);
        const blobUrl = URL.createObjectURL(new Blob([data]));
        setWallpaper(null, blobUrl);
      } catch {}
    } else {
      setWallpaper(savedWp, null);
    }
  }

  document.getElementById('boot-screen').classList.add('hidden');
  setTimeout(() => document.getElementById('boot-screen').remove(), 800);

  // Check for previous mounts and prompt
  const mounts = await fs.metaStore.get('mounts') || [];
  if (mounts.length > 0 && window.showDirectoryPicker) {
    setTimeout(() => {
      showToast(`有 ${mounts.length} 个本地挂载需要重新连接`, 'success');
    }, 1500);
  }
}

// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', e => {
  // Ctrl+N: New file explorer
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); openFileExplorer(); }
  // Escape: close context menu
  if (e.key === 'Escape') { ctxMenu.hide(); }
});

// ===== Initialize =====
(async () => {
  try {
    await fs.init();
    await boot();
  } catch (e) {
    console.error('Failed to initialize:', e);
    document.getElementById('boot-text').textContent = '初始化失败: ' + e.message;
    document.getElementById('boot-progress-bar').style.background = 'var(--red)';
  }
})();
