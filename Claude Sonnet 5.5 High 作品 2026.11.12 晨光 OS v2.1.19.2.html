<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>晨光 OS 98</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Zpix98';src:url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@3.1.9/website/zpix.woff2') format('woff2');font-display:swap}
:root{
 --ff:'Zpix98','DotGothic16','MS Gothic','NSimSun','SimSun','Noto Sans Mono CJK SC',monospace;
 --fs:13px;--r:0px;
 --face:#262634;--face2:#1b1b27;--hi:#6e6e92;--sh:#07070d;--mid:#3b3b52;--tx:#e8e8f2;--tx2:#9a9ab8;--bg:#05050f;--field:#0b0b16;--line:#4a4a66;
 --acc:#00b4c8;--accd:#00606e;--accl:#62eaf8;--onacc:#00141a;
 --tbi:#4a4a62;--tbit:#c4c4d8;
 --bev:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh),0 0 0 1px #000;
 --bevp:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi),0 0 0 1px #000;
 --fld:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi);
 --cw:88px;--ch:90px;--is:32px;
 --tbh:34px;
}
[data-theme=light]{
 --face:#cfcfd8;--face2:#e6e6ee;--hi:#ffffff;--sh:#4a4a62;--mid:#a6a6b8;--tx:#10101c;--tx2:#4c4c64;--bg:#8c94b0;--field:#ffffff;--line:#8888a0;
 --tbi:#9090a8;--tbit:#f4f4fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:var(--fs)/1.35 var(--ff);-webkit-font-smoothing:none;font-smooth:never;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,select,button{font:inherit;color:inherit;-webkit-font-smoothing:none}
input,textarea,[contenteditable],.sel-ok{user-select:text;-webkit-user-select:text}
svg.ic{width:16px;height:16px;fill:currentColor;flex:none;vertical-align:-3px;shape-rendering:crispEdges}
svg.ic.l{width:32px;height:32px}svg.ic.xl{width:48px;height:48px}svg.ic.s{width:12px;height:12px}
.hidden{display:none!important}
::-webkit-scrollbar{width:16px;height:16px;background:var(--face2)}
::-webkit-scrollbar-track{background:repeating-conic-gradient(var(--face2) 0 25%,var(--face) 0 50%) 0 0/2px 2px}
::-webkit-scrollbar-thumb{background:var(--face);box-shadow:var(--bev)}
::-webkit-scrollbar-corner{background:var(--face)}
::-webkit-scrollbar-button:single-button{background:var(--face);box-shadow:var(--bev);height:16px;width:16px}
*{scrollbar-color:var(--mid) var(--face2)}
/* basic widgets */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:24px;padding:2px 10px;background:var(--face);box-shadow:var(--bev);border:0;border-radius:var(--r);cursor:pointer;white-space:nowrap;color:var(--tx)}
.btn:active,.btn.on{box-shadow:var(--bevp);padding:3px 9px 1px 11px;background-image:conic-gradient(rgba(128,128,160,.14) 25%,transparent 0 50%,rgba(128,128,160,.14) 0 75%,transparent 0);background-size:2px 2px}
.btn:hover{color:var(--accl)}
[data-theme=light] .btn:hover{color:#005a68}
.btn:disabled,.btn.dis{opacity:.45;pointer-events:none}
.btn.pri{outline:2px solid var(--acc);outline-offset:1px}
.btn.sm{min-height:20px;padding:0 6px}
.btn.ib{padding:2px 5px}
.fld,input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{background:var(--field);color:var(--tx);border:0;box-shadow:var(--fld),0 0 0 1px #000;border-radius:var(--r);padding:3px 6px;min-height:24px;outline:none}
input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,textarea:focus,select:focus{box-shadow:var(--fld),0 0 0 1px var(--acc)}
select{padding-right:2px}
input[type=range]{accent-color:var(--acc);min-height:0;padding:0;box-shadow:none;background:none}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:15px;height:15px;margin:0 4px 0 0;vertical-align:-3px}
label.chk{display:flex;align-items:center;gap:2px;cursor:pointer}
.sep{width:2px;align-self:stretch;margin:2px 3px;background:var(--sh);box-shadow:1px 0 0 var(--hi)}
.hsep{height:2px;margin:3px 0;background:var(--sh);box-shadow:0 1px 0 var(--hi)}
.sunk{box-shadow:var(--fld),0 0 0 1px #000;background:var(--field)}
.raised{box-shadow:var(--bev);background:var(--face)}
.dither{background-image:conic-gradient(rgba(255,255,255,.07) 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0);background-size:2px 2px}
.spin{display:inline-block;width:46px;height:10px;box-shadow:var(--fld);background:linear-gradient(90deg,var(--acc) 0 30%,transparent 0) 0 0/46px 10px no-repeat,var(--field);animation:spin 1s steps(8) infinite}
@keyframes spin{from{background-position:-30px 0}to{background-position:46px 0}}
/* layout */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
body.tb-top #app{flex-direction:column-reverse}
#desk{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#wall{position:absolute;inset:0;background-color:#0a0a20;background-size:cover;background-position:center;image-rendering:pixelated}
#wall.tile{background-size:auto;background-repeat:repeat}
#wall.center{background-size:auto;background-repeat:no-repeat}
#wall.stretch{background-size:100% 100%}
#desktop{position:absolute;inset:0;z-index:1;touch-action:none;overflow:hidden}
#wins{position:absolute;inset:0;z-index:2;pointer-events:none}
#wins>.win{pointer-events:auto}
#snapprev{position:absolute;z-index:3000;border:2px dashed var(--accl);background:rgba(98,234,248,.10);pointer-events:none;display:none}
.mrq{position:absolute;border:1px dotted #fff;background:rgba(0,180,200,.28);pointer-events:none;z-index:50;outline:1px solid #000}
/* desktop icons */
.dicon{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;padding:6px 3px 2px;cursor:pointer;transition:left .2s cubic-bezier(.2,.9,.3,1),top .2s cubic-bezier(.2,.9,.3,1);touch-action:none}
.dicon.nt{transition:none}
.dicon .ib{width:var(--is);height:var(--is);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.dicon svg.ic{width:var(--is);height:var(--is)}
.dicon .th{width:var(--is);height:var(--is);object-fit:cover;image-rendering:auto;box-shadow:0 0 0 1px #000,0 0 0 2px #fff}
.dicon .lbl{margin-top:4px;max-width:100%;text-align:center;color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000;word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:0 2px;line-height:1.25;font-size:12px}
.dicon.sel .lbl{background:var(--acc);color:var(--onacc);text-shadow:none;outline:1px dotted #fff}
.dicon.sel .ib::after{content:"";position:absolute;inset:0;background-image:conic-gradient(rgba(0,180,200,.55) 25%,transparent 0 50%,rgba(0,180,200,.55) 0 75%,transparent 0);background-size:2px 2px;pointer-events:none}
.dicon.dropt .ib,.it.dropt,.tn.dropt,.bc.dropt{outline:2px dashed var(--accl);outline-offset:1px}
.dicon.cut{opacity:.5}
/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--face);border-radius:var(--r);box-shadow:var(--bev),3px 3px 0 rgba(0,0,0,.5);padding:3px;min-width:220px;min-height:130px;max-width:100%}
.win.opening{animation:wopen .18s steps(5)}
@keyframes wopen{from{transform:scale(.86);opacity:.2}to{transform:none;opacity:1}}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;box-shadow:var(--bev)}
.win.min{display:none}
.win .tb{height:24px;display:flex;align-items:center;gap:5px;padding:0 2px 0 4px;background-color:var(--tbi);color:var(--tbit);flex:none;cursor:default;touch-action:none;border-radius:var(--r) var(--r) 0 0;background-image:conic-gradient(rgba(255,255,255,.07) 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0);background-size:2px 2px}
.win.act .tb{background-color:var(--accd);color:#fff}
.win .tb .ti{display:flex;cursor:pointer}
.win .tb .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:normal;letter-spacing:.5px;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.win .tbs{display:flex;gap:2px}
.win .tbn{width:20px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--face);color:var(--tx);box-shadow:var(--bev);cursor:pointer;border-radius:var(--r);text-shadow:none}
.win .tbn:active{box-shadow:var(--bevp)}
.win .tbn.cl:hover{background:#b02020;color:#fff}
.win .tbn svg{width:12px;height:12px}
.win .bd{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--face);margin-top:3px;overflow:hidden}
.win .rz{position:absolute;z-index:5;touch-action:none}
.rz.n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}.rz.s{bottom:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}.rz.w{left:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.ne{right:-3px;top:-3px;width:12px;height:12px;cursor:nesw-resize}.rz.nw{left:-3px;top:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz.se{right:-3px;bottom:-3px;width:12px;height:12px;cursor:nwse-resize}.rz.sw{left:-3px;bottom:-3px;width:12px;height:12px;cursor:nesw-resize}
.win.max .rz{display:none}
.win.pfs{position:fixed!important;inset:0!important;left:0!important;top:0!important;width:auto!important;height:auto!important;z-index:99999!important;padding:0;box-shadow:none}
.win.pfs>.tb,.win.pfs>.rz{display:none}.win.pfs .bd{margin:0}
.dragging iframe,.dragging video,.resizing iframe{pointer-events:none!important}
/* Aero Peek (wireframe) */
#desk.peek .win:not(.peek-t){background:transparent!important;box-shadow:none!important;outline:2px dashed var(--accl);outline-offset:-2px}
#desk.peek .win:not(.peek-t)>*{visibility:hidden}
#desk.peek .win.min.peek-t{display:flex}
#desk.peek.peek-all .win{background:transparent!important;box-shadow:none!important;outline:2px dashed var(--accl)}
#desk.peek.peek-all .win>*{visibility:hidden}
/* taskbar */
#tb{height:var(--tbh);flex:none;display:flex;align-items:stretch;gap:3px;padding:3px;background:var(--face);box-shadow:inset 0 1px 0 var(--hi),inset 0 2px 0 #000;position:relative;z-index:6000;touch-action:manipulation}
body.tb-top #tb{box-shadow:inset 0 -1px 0 var(--sh),inset 0 -2px 0 #000}
body.tb-auto #tb{position:absolute;left:0;right:0;bottom:0;transform:translateY(calc(100% - 3px));transition:transform .15s steps(4)}
body.tb-auto.tb-top #tb{bottom:auto;top:0;transform:translateY(calc(-100% + 3px))}
body.tb-auto #tb:hover,body.tb-auto #tb.show{transform:none}
#startbtn{font-weight:bold;padding:0 10px;min-width:70px;letter-spacing:1px}
#startbtn.on{box-shadow:var(--bevp)}
#tasks{flex:1;display:flex;gap:3px;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.tk{display:flex;align-items:center;gap:6px;min-width:60px;max-width:170px;flex:1 1 150px;padding:0 4px 0 6px;background:var(--face);box-shadow:var(--bev);cursor:pointer;border-radius:var(--r);position:relative;overflow:hidden;white-space:nowrap}
.tk .tl{flex:1;overflow:hidden;text-overflow:ellipsis}
.tk .tx{opacity:0;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.tk:hover .tx{opacity:1}.tk .tx:hover{background:#b02020;color:#fff}
.tk.act{box-shadow:var(--bevp);background-image:conic-gradient(rgba(128,128,160,.2) 25%,transparent 0 50%,rgba(128,128,160,.2) 0 75%,transparent 0);background-size:2px 2px;font-weight:bold}
.tk.mn{opacity:.75;font-style:italic}
#tray{display:flex;align-items:center;gap:6px;padding:0 8px;box-shadow:var(--fld);background:var(--face2);min-width:64px;justify-content:center}
#clock{background:none;border:0;padding:2px 2px;cursor:pointer;text-align:center;line-height:1.1;font-size:12px;min-height:0}
#clock:hover{color:var(--accl)}
#showdesk{width:12px;background:var(--face);box-shadow:var(--bev);cursor:pointer;border-radius:var(--r)}
/* start menu */
#startmenu{position:fixed;left:3px;bottom:var(--tbh);width:270px;display:none;z-index:7000;background:var(--face);box-shadow:var(--bev),4px 4px 0 rgba(0,0,0,.5);padding:3px;border-radius:var(--r)}
body.tb-top #startmenu{bottom:auto;top:var(--tbh)}
#startmenu.show{display:flex;animation:wopen .12s steps(3)}
#startmenu .side{width:26px;background:linear-gradient(0deg,var(--acc),var(--accd));color:var(--onacc);writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;padding:6px 3px;font-size:17px;letter-spacing:3px;font-weight:bold;text-shadow:1px 1px 0 rgba(255,255,255,.3);flex:none;margin-right:3px}
#startmenu .lst{flex:1;display:flex;flex-direction:column;min-width:0}
.mi{display:flex;align-items:center;gap:9px;padding:5px 8px;cursor:pointer;white-space:nowrap;position:relative;color:var(--tx)}
.mi:hover,.mi.hov{background:var(--acc);color:var(--onacc)}
.mi.dis{opacity:.45;pointer-events:none}
.mi .k{margin-left:auto;opacity:.6;font-size:11px;padding-left:18px}
.mi .ar{margin-left:auto}
.mi .ck{width:14px;display:inline-block}
.mi.lg{padding:8px 10px;font-size:14px}
.subm{position:absolute;display:none;background:var(--face);box-shadow:var(--bev),4px 4px 0 rgba(0,0,0,.5);padding:2px;min-width:170px;z-index:2;max-height:70vh;overflow:auto;border-radius:var(--r)}
.mi:hover>.subm,.mi.hov>.subm{display:block}
/* context menu */
#ctx{position:fixed;z-index:8000;display:none;min-width:190px;background:var(--face);box-shadow:var(--bev),4px 4px 0 rgba(0,0,0,.5);padding:2px;border-radius:var(--r)}
#ctx .mi .subm{top:-3px;left:100%}
#ctx .mi .subm.left{left:auto;right:100%}
/* calendar */
#cal{position:fixed;right:3px;bottom:var(--tbh);width:262px;z-index:7000;background:var(--face);box-shadow:var(--bev),4px 4px 0 rgba(0,0,0,.5);padding:8px;display:none;border-radius:var(--r)}
body.tb-top #cal{bottom:auto;top:var(--tbh)}
#cal.show{display:block;animation:wopen .12s steps(3)}
#cal .big{font-size:26px;text-align:center;letter-spacing:2px;padding:6px;margin-bottom:6px}
#cal .hd{display:flex;align-items:center;gap:4px;margin-bottom:5px}
#cal .hd b{flex:1;text-align:center}
#cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
#cal .g span{padding:5px 0;cursor:pointer}
#cal .g .w{color:var(--tx2);cursor:default}
#cal .g .o{opacity:.4}
#cal .g .t{background:var(--acc);color:var(--onacc);font-weight:bold}
#cal .g .s{outline:1px dotted var(--accl);outline-offset:-2px}
#cal .g span:not(.w):hover{background:var(--mid)}
/* modal */
#modal{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;background-image:conic-gradient(rgba(0,0,0,.5) 25%,transparent 0 50%,rgba(0,0,0,.5) 0 75%,transparent 0);background-size:2px 2px;padding:10px}
#modal.show{display:flex}
.dlg{background:var(--face);box-shadow:var(--bev),5px 5px 0 rgba(0,0,0,.6);padding:3px;min-width:300px;max-width:min(94vw,640px);max-height:92vh;display:flex;flex-direction:column;border-radius:var(--r);animation:wopen .14s steps(4)}
.dlg .dt{height:24px;display:flex;align-items:center;padding:0 6px;background-color:var(--accd);color:#fff;flex:none;text-shadow:1px 1px 0 rgba(0,0,0,.6);background-image:conic-gradient(rgba(255,255,255,.07) 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0);background-size:2px 2px;gap:6px}
.dlg .dbd{padding:14px 14px 8px;display:flex;gap:14px;align-items:flex-start;overflow:auto;min-height:0}
.dlg .dbd .tx{flex:1;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.dlg .dbtn{display:flex;gap:8px;justify-content:center;padding:6px 10px 10px;flex-wrap:wrap}
.dlg .dbtn .btn{min-width:78px}
.dlg input[type=text]{width:100%;margin-top:8px}
.prog{height:16px;box-shadow:var(--fld),0 0 0 1px #000;background:var(--field);margin-top:8px;padding:2px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 10px)}
#toasts{position:fixed;right:8px;bottom:calc(var(--tbh) + 8px);z-index:9500;display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:none}
body.tb-top #toasts{bottom:8px}
.toast{background:var(--face);box-shadow:var(--bev),3px 3px 0 rgba(0,0,0,.5);padding:6px 12px;max-width:min(86vw,360px);animation:wopen .15s steps(3);display:flex;gap:8px;align-items:center;border-left:4px solid var(--acc)}
.toast.err{border-left-color:#e03030}
.loadmask{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:30;color:var(--tx2);background-image:conic-gradient(rgba(255,255,255,.04) 25%,transparent 0 50%,rgba(255,255,255,.04) 0 75%,transparent 0);background-size:2px 2px}
.loadmask.off{display:none}
.tbar{display:flex;gap:3px;align-items:center;padding:3px;flex-wrap:wrap;flex:none}
.sbar{display:flex;gap:8px;align-items:center;padding:2px 6px;box-shadow:var(--fld);margin:2px;flex:none;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;min-height:22px}
.sbar span{overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--tx2)}
.grow{flex:1;min-width:0}
/* mobile / dock */
@media (max-width:760px){
 :root{--tbh:46px;--fs:14px}
 #tb{gap:4px;padding:4px}
 #startbtn{min-width:56px;padding:0 8px}
 .tk{min-width:46px;flex:0 0 auto;max-width:130px}
 .tk .tl{display:none}.tk.act .tl{display:block;max-width:70px}
 .tk .tx{opacity:1}
 #tray{padding:0 5px;min-width:0}
 #showdesk{display:none}
 .win{min-width:0}
 #startmenu{left:0;right:0;width:auto;bottom:var(--tbh)}
 #cal{left:6px;right:6px;width:auto}
 .btn{min-height:32px}
 .mi{padding:9px 10px}
 .win .tb{height:30px}.win .tbn{width:28px;height:24px}
 .dlg{min-width:0;width:94vw}
 select,input[type=text],input[type=number],input[type=search]{min-height:32px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-folder" viewBox="0 0 16 16"><path fill="#14141e" d="M0 2h6l1 2h9v11H0z"/><path fill="#f0c830" d="M1 3h4.6l1 2H15v9H1z"/><path fill="#ffe880" d="M1 6h14v1H1z"/><path fill="#c08c10" d="M1 13h14v1H1z"/></symbol>
<symbol id="i-folder-open" viewBox="0 0 16 16"><path fill="#14141e" d="M0 2h6l1 2h8v3h1l-2 8H0z"/><path fill="#c08c10" d="M1 3h4.6l1 2H14v2H4L2 14H1z"/><path fill="#f8d850" d="M4 8h11l-2 6H2z"/></symbol>
<symbol id="i-file" viewBox="0 0 16 16"><path fill="#14141e" d="M2 0h8l4 4v12H2z"/><path fill="#f0f0f8" d="M3 1h6v4h4v10H3z"/><path fill="#9898b4" d="M9 1l4 4H9z"/></symbol>
<symbol id="i-text" viewBox="0 0 16 16"><use href="#i-file"/><path fill="#3050c0" d="M5 7h6v1H5zM5 9h6v1H5zM5 11h6v1H5zM5 13h3v1H5z"/></symbol>
<symbol id="i-image" viewBox="0 0 16 16"><path fill="#14141e" d="M0 2h16v12H0z"/><path fill="#58c4f0" d="M1 3h14v10H1z"/><path fill="#30b040" d="M1 10l4-4 4 4 2-2 4 4v1H1z"/><path fill="#fff" d="M11 4h2v2h-2z"/></symbol>

<script>
'use strict';
/* ================= 工具函数 ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const addCSS=t=>{const s=document.createElement('style');s.textContent=t;document.head.appendChild(s)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const ico=(n,c='')=>'<svg class="ic '+c+'" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const coll=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});
const natcmp=(a,b)=>coll.compare(a,b);
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=p=>{const o=[];for(const s of String(p).split('/')){if(!s||s==='.')continue;if(s==='..'){o.pop();continue}o.push(s)}return '/'+o.join('/')};
const dirName=p=>{p=norm(p);const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)};
const baseName=p=>{p=norm(p);return p.slice(p.lastIndexOf('/')+1)};
const joinPath=(a,b)=>norm(a+'/'+b);
const extOf=n=>{n=String(n).toLowerCase();const m=n.match(/\.(tar\.(gz|bz2|xz))$/);if(m)return m[1];const i=n.lastIndexOf('.');return i<=0?'':n.slice(i+1)};

   g.fillStyle='#fff';g.font='bold 120px monospace';g.fillText('第'+i+'页',90,230);g.font='32px monospace';g.fillStyle='#f4f0e4';g.fillText('晨光 OS 98 示例漫画',60,480);
   const b=await new Promise(r=>c.toBlob(r,'image/png'));await fs.writeFile(base+'/图片/示例漫画/'+pad(i)+'.png',b,{mtime:Date.now()-i*86400000*3})}
