<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>酸柠 OS · LimeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Martian+Mono:wght@400;600&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{--acc:#c6ff1a;--acc2:#fff24a;--hot:#ff4f8b;--ink:#0b0f03;--r:10px;--tb:48px;--fs:14px;--ics:76px;--fd:'ZCOOL QingKe HuangYou','Bricolage Grotesque','PingFang SC','Microsoft YaHei',sans-serif;--fb:'Bricolage Grotesque','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;--fm:'Martian Mono',Consolas,'Courier New',monospace}
html[data-theme=dark]{--bg:#090c03;--panel:#12170a;--panel2:#1a220f;--panel3:#263216;--line:#35451b;--text:#efffc4;--dim:#93a566;--acct:var(--acc);--shadow:0 20px 54px #000b,0 0 0 1px #c6ff1a1c;--glass:#11160add;color-scheme:dark}
html[data-theme=light]{--bg:#eef6c4;--panel:#fcffee;--panel2:#f1f8cc;--panel3:#e0eea2;--line:#b3c765;--text:#161d03;--dim:#5c6d2c;--acct:color-mix(in srgb,var(--acc) 40%,#1c2a00);--shadow:0 18px 44px #3a4a0040,0 0 0 1px #5f703030;--glass:#fcffeee6;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:var(--fs)/1.45 var(--fb);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--r);border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--acc)}::-webkit-scrollbar-corner{background:transparent}
::selection{background:var(--acc);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1.5px solid var(--line);background:var(--panel2);border-radius:calc(var(--r)*.7);cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .12s,background .12s,border-color .12s;flex:none}
.btn:hover{border-color:var(--acc);box-shadow:3px 3px 0 var(--acc);transform:translate(-1.5px,-1.5px)}
.btn:active{transform:none;box-shadow:none}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}.btn.pri:hover{box-shadow:3px 3px 0 var(--acc2)}
.btn.dng:hover{border-color:var(--hot);box-shadow:3px 3px 0 var(--hot)}
.btn.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn.sm{padding:3px 8px;font-size:.88em}.btn[disabled]{opacity:.4;pointer-events:none}
.inp{padding:6px 10px;background:var(--bg);border:1.5px solid var(--line);border-radius:calc(var(--r)*.7);outline:none;min-width:0}.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
select.inp{padding-right:6px}
#wall{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:opacity .4s}
#wall::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,#0003 1px,transparent 1.5px) 0 0/5px 5px;mix-blend-mode:overlay;pointer-events:none}
#desk{position:fixed;left:0;right:0;top:0;bottom:var(--tb);z-index:1;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
html[data-tb=top] #desk{top:var(--tb);bottom:0}
#dicons{position:absolute;inset:0}
.dicon{position:absolute;width:calc(var(--ics) + 14px);height:calc(var(--ics) + 34px);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 3px 2px;border-radius:calc(var(--r)*.8);cursor:pointer;border:1.5px solid transparent;transition:left .28s cubic-bezier(.2,.9,.25,1.15),top .28s cubic-bezier(.2,.9,.25,1.15),background .15s,border-color .15s;touch-action:none;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) backwards}
.dicon:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}.dicon.sel{background:color-mix(in srgb,var(--acc) 26%,transparent);border-color:var(--acc)}
.dicon.drop,.fi.drop{outline:2px dashed var(--acc2);outline-offset:-2px;background:color-mix(in srgb,var(--acc2) 22%,transparent)}
.dicon .nm{font-size:12px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;color:#f6ffd8;text-shadow:0 1px 3px #000,0 0 8px #000a;pointer-events:none}
.dicon.dragging,.fi.dragging{opacity:.35}
.tile{width:calc(var(--ics)*.62);height:calc(var(--ics)*.62);border-radius:calc(var(--r)*.9 + 2px);display:grid;place-items:center;flex:none;background:var(--acc);color:var(--ink);box-shadow:3px 3px 0 #0008,inset 0 0 0 1.5px #0003;position:relative;overflow:hidden;pointer-events:none}
.tile svg{width:58%;height:58%}.tile img{width:100%;height:100%;object-fit:cover}
.tile.k-dir{background:var(--acc2)}.tile.k-image{background:#7dffb2}.tile.k-audio{background:#ffb347}.tile.k-video{background:#ff8fb1}.tile.k-archive{background:#d4ff7a}.tile.k-text,.tile.k-bin{background:#eaffb0}.tile.k-code,.tile.k-html{background:#9dff3c}.tile.k-table{background:#5cf2c2}.tile.k-pdf{background:#ff7a59}.tile.k-app{background:linear-gradient(135deg,var(--acc),var(--acc2))}.tile.k-disk{background:#b7ff5a}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(10px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes squeeze{0%,100%{transform:scale(1,1)}40%{transform:scale(1.18,.82)}70%{transform:scale(.9,1.1)}}
#wins{position:fixed;left:0;right:0;top:0;bottom:var(--tb);z-index:2;pointer-events:none}
html[data-tb=top] #wins{top:var(--tb);bottom:0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);pointer-events:auto;min-width:240px;min-height:120px;animation:winin .26s cubic-bezier(.2,.9,.3,1.2);transition:opacity .2s}
.win.anim{transition:left .22s cubic-bezier(.2,.8,.2,1),top .22s cubic-bezier(.2,.8,.2,1),width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1),opacity .2s,transform .22s}
.win.active{border-color:var(--acc)}
.win.min{opacity:0;transform:translateY(60px) scale(.8);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .22s,visibility 0s .22s}
.win.max{border-radius:0;border-width:0}
.win.ghost{opacity:.06!important;pointer-events:none}.win.peeked{opacity:1!important;visibility:visible!important;transform:none!important}
@keyframes winin{from{opacity:0;transform:scale(.92) translateY(14px)}}
.win-t{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;border-bottom:1.5px solid var(--line);border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;cursor:default;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--panel2);position:relative;overflow:hidden}
.win.max .win-t{border-radius:0}
.win.active .win-t{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 30%,var(--panel2)),var(--panel2) 60%)}
.win.active .win-t::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(-45deg,var(--acc) 0 4px,var(--acc2) 4px 8px)}
.win-t .ti{font-family:var(--fd);font-size:15px;letter-spacing:.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.win-t .wi{color:var(--acct);display:flex;pointer-events:none}
.wc{display:flex;gap:3px}.wc button{width:30px;height:26px;display:grid;place-items:center;border:1.5px solid transparent;background:none;border-radius:calc(var(--r)*.5);cursor:pointer}
.wc button:hover{background:var(--acc);color:var(--ink);border-color:var(--ink)}.wc button.x:hover{background:var(--hot);color:#fff}
.win-b{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:0 0 calc(var(--r) - 1px) calc(var(--r) - 1px)}
.rz{position:absolute;z-index:5;touch-action:none}.rz.n,.rz.s{left:10px;right:10px;height:7px;cursor:ns-resize}.rz.e,.rz.w{top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz.n{top:-4px}.rz.s{bottom:-4px}.rz.e{right:-4px}.rz.w{left:-4px}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:14px;height:14px}.rz.ne{top:-4px;right:-4px;cursor:nesw-resize}.rz.nw{top:-4px;left:-4px;cursor:nwse-resize}.rz.se{bottom:-4px;right:-4px;cursor:nwse-resize}.rz.sw{bottom:-4px;left:-4px;cursor:nesw-resize}
.win.max .rz{display:none}
body.dragging-win iframe{pointer-events:none}
#snap{position:fixed;z-index:3;border:2px dashed var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:var(--r);pointer-events:none;opacity:0;transition:all .16s;backdrop-filter:blur(3px)}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:9000;display:flex;align-items:center;gap:6px;padding:0 6px;padding-bottom:env(safe-area-inset-bottom);background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);border-top:1.5px solid var(--line);user-select:none;-webkit-user-select:none}
html[data-tb=top] #taskbar{top:0;bottom:auto;border-top:0;border-bottom:1.5px solid var(--line)}
#taskbar::before{content:"";position:absolute;left:0;right:0;top:-4px;height:3px;background:repeating-linear-gradient(90deg,var(--acc) 0 14px,transparent 14px 20px,var(--acc2) 20px 26px,transparent 26px 32px);opacity:.75}
html[data-tb=top] #taskbar::before{top:auto;bottom:-4px}
#start{height:calc(var(--tb) - 12px);padding:0 12px 0 8px;display:flex;align-items:center;gap:6px;background:var(--acc);color:var(--ink);border:1.5px solid var(--ink);border-radius:calc(var(--r)*.8);font-family:var(--fd);font-size:17px;cursor:pointer;box-shadow:2px 2px 0 var(--acc2);flex:none}
#start:hover svg{animation:squeeze .5s}#start svg{width:22px;height:22px}
#tasks{flex:1;display:flex;gap:5px;overflow-x:auto;min-width:0;height:100%;align-items:center;scrollbar-width:none}#tasks::-webkit-scrollbar{display:none}
.task{height:calc(var(--tb) - 12px);max-width:190px;min-width:44px;display:flex;align-items:center;gap:6px;padding:0 6px 0 9px;border:1.5px solid var(--line);background:var(--panel2);border-radius:calc(var(--r)*.7);cursor:pointer;position:relative;flex:0 1 auto;animation:fadeUp .25s}
.task .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9em;flex:1}
.task.active{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--panel2))}.task.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;background:var(--acc);border-radius:3px}
.task.mini{opacity:.6}.task .tx{width:20px;height:20px;display:grid;place-items:center;border:0;background:none;border-radius:4px;cursor:pointer;flex:none}.task .tx:hover{background:var(--hot);color:#fff}
#tray{display:flex;align-items:center;gap:4px;flex:none}
#tray button{height:calc(var(--tb) - 14px);min-width:32px;padding:0 6px;border:1.5px solid transparent;background:none;border-radius:calc(var(--r)*.6);cursor:pointer;display:flex;align-items:center;gap:5px}#tray button:hover{border-color:var(--acc);background:var(--panel2)}
#clock{font-family:var(--fm);font-size:11px;line-height:1.25;text-align:right;flex-direction:column;align-items:flex-end!important;gap:0!important;justify-content:center}
#showdesk{width:9px;align-self:stretch;border-left:1.5px solid var(--line);cursor:pointer;flex:none}#showdesk:hover{background:var(--acc)}
.pop{position:fixed;z-index:9500;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);border:1.5px solid var(--acc);border-radius:var(--r);box-shadow:var(--shadow),5px 5px 0 color-mix(in srgb,var(--acc) 60%,transparent);display:none;animation:fadeUp .2s}
.pop.show{display:block}
#startmenu{left:8px;bottom:calc(var(--tb) + 10px);width:min(420px,calc(100vw - 16px));max-height:min(600px,calc(100vh - var(--tb) - 24px));overflow:auto;padding:14px}
html[data-tb=top] #startmenu,html[data-tb=top] #calpop{bottom:auto;top:calc(var(--tb) + 10px)}
#startmenu h3{font-family:var(--fd);font-size:26px;font-weight:400;line-height:1;margin-bottom:2px;color:var(--acct)}
#startmenu .sub{font:11px var(--fm);color:var(--dim);margin-bottom:10px}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:calc(var(--r)*.8);cursor:pointer;border:1.5px solid transparent;font-size:12px;text-align:center;animation:pop .35s backwards}
.sm-app:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}.sm-app .tile{width:44px;height:44px}
.sm-foot{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--line);flex-wrap:wrap}
#calpop{right:8px;bottom:calc(var(--tb) + 10px);width:300px;padding:14px}
#calpop .big{font:600 30px var(--fm);color:var(--acct);letter-spacing:-1px}
.cal-h{display:flex;align-items:center;gap:6px;margin:10px 0 6px}.cal-h b{flex:1;font-family:var(--fd);font-size:17px;font-weight:400}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font:12px var(--fm)}
.cal-g span{padding:6px 0;border-radius:calc(var(--r)*.5)}.cal-g .hd{color:var(--dim)}.cal-g .o{opacity:.3}.cal-g .td{background:var(--acc);color:var(--ink);font-weight:700}
#peek{padding:8px 12px;max-width:260px;pointer-events:none;font-size:12px}#peek b{display:block;font-family:var(--fd);font-weight:400;font-size:15px;color:var(--acct)}
#ctx,.ctx-sub{position:fixed;z-index:9900;min-width:190px;max-width:280px;padding:5px;background:var(--glass);backdrop-filter:blur(18px);border:1.5px solid var(--acc);border-radius:calc(var(--r)*.9);box-shadow:var(--shadow),4px 4px 0 color-mix(in srgb,var(--acc) 55%,transparent);display:none;max-height:calc(100vh - 16px);overflow:auto;animation:fadeUp .14s}
.ctx-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:calc(var(--r)*.5);cursor:pointer;white-space:nowrap}.ctx-i:hover{background:var(--acc);color:var(--ink)}.ctx-i.dis{opacity:.4;pointer-events:none}
.ctx-i .ar{margin-left:auto;opacity:.6}.ctx-i kbd{margin-left:auto;font:10px var(--fm);opacity:.6}.ctx-s{height:1.5px;background:var(--line);margin:4px 6px}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb) + 12px);z-index:9950;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;background:var(--panel);border:1.5px solid var(--acc);border-left-width:7px;border-radius:calc(var(--r)*.7);box-shadow:var(--shadow);max-width:min(360px,86vw);animation:fadeUp .25s;font-size:13px;transition:opacity .3s}
.toast.err{border-color:var(--hot)}.toast.warn{border-color:var(--acc2)}
#busy{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9960;padding:8px 16px 8px 10px;background:var(--panel);border:1.5px solid var(--acc);border-radius:99px;display:none;align-items:center;gap:9px;box-shadow:var(--shadow);font-size:13px}
#busy.show{display:flex;animation:fadeUp .2s}
.spin{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--acc) 0 12%,var(--acc2) 12% 25%,var(--acc) 25% 37%,var(--acc2) 37% 50%,var(--acc) 50% 62%,var(--acc2) 62% 75%,var(--acc) 75% 87%,var(--acc2) 87%);animation:spin .9s linear infinite;flex:none;position:relative;border:2px solid var(--acc)}
.spin::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--panel)}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--bg);z-index:20;color:var(--dim);font-size:13px;transition:opacity .3s}.loading .spin{width:38px;height:38px}
.modal-bg{position:fixed;inset:0;z-index:9800;background:#0008;backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;animation:fadeUp .15s}
.modal{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1.5px solid var(--acc);border-radius:var(--r);box-shadow:var(--shadow),6px 6px 0 var(--acc);padding:18px}
.modal h4{font-family:var(--fd);font-weight:400;font-size:20px;margin-bottom:10px;color:var(--acct)}.modal .mb{margin-bottom:14px;word-break:break-word;white-space:pre-wrap}.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.marq{position:absolute;pointer-events:none;border:1.5px solid var(--acc);background:color-mix(in srgb,var(--acc) 20%,transparent);z-index:50;border-radius:2px}
.tb{display:flex;align-items:center;gap:5px;padding:6px;border-bottom:1.5px solid var(--line);background:var(--panel2);flex:none;overflow-x:auto;scrollbar-width:thin}
.tb .sep{width:1.5px;align-self:stretch;background:var(--line);margin:2px 3px;flex:none}.tb .grow{flex:1}
.sbar{display:flex;gap:14px;padding:3px 10px;border-top:1.5px solid var(--line);background:var(--panel2);font:11px var(--fm);color:var(--dim);flex:none;overflow:hidden;white-space:nowrap}
.drag-ghost{position:fixed;z-index:9990;pointer-events:none;padding:6px 12px;background:var(--acc);color:var(--ink);border:1.5px solid var(--ink);border-radius:99px;font-size:12px;font-weight:700;box-shadow:3px 3px 0 #0008;transform:translate(-50%,-130%)}
@media(max-width:720px){:root{--tb:58px}#start span,.task .tn,.task .tx{display:none}.task{min-width:46px;justify-content:center;padding:0}.task svg{width:24px;height:24px}#clock .d{display:none}#showdesk{display:none}#tray .hm{display:none}.win-t{height:42px}.wc button{width:38px;height:32px}}
html.noanim *{animation:none!important;transition:none!important}
html.noblur *{backdrop-filter:none!important}
/*@@CSS@@*/
</style>

<body>
<div id="wall"></div>
<div id="desk"><div id="dicons"></div></div>
<div id="wins"></div>
<div id="snap"></div>
<div id="taskbar"><button id="start" title="开始"></button><div id="tasks"></div><div id="tray"></div><div id="showdesk" title="显示桌面"></div></div>
<div id="startmenu" class="pop"></div>
<div id="calpop" class="pop"></div>
<div id="peek" class="pop"></div>
<div id="ctx"></div>
<div id="toasts"></div>
<div id="busy"><div class="spin"></div><span></span></div>
<script>
'use strict';
/* ================= 1. 基础工具 ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;else if(k==='data')Object.assign(e.dataset,v);else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}return e}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const natCmp=(a,b)=>String(a).localeCompare(String(b),'zh-CN',{numeric:true,sensitivity:'base'});
const isTouch=()=>matchMedia('(pointer:coarse)').matches;
const isMobile=()=>innerWidth<=720;
const getClientXY=e=>{const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{x:t.clientX,y:t.clientY}};
