    }catch(e){toast('启动失败：'+e.message,'warn')}};
  $('.b-lock',win.body).onclick=()=>{const cvs=$('#vmscreen canvas',win.body);
    try{emu&&emu.lock_mouse?emu.lock_mouse():cvs.requestPointerLock()}catch(e){cvs.requestPointerLock()}
    toast('鼠标已锁定，按 Esc 释放')};
  $('.b-stop',win.body).onclick=()=>{try{emu&&emu.stop()}catch(e){}emu=null;toast('已停止')};
  win.onClose=()=>{try{emu&&emu.stop()}catch(e){}};win.opt.onClose=win.onClose;
  return win;}

/* =====================  14. 应用注册表 / 智能分派 / 启动  ===================== */
const APPS={
  explorer:{name:'文件资源管理器',icon:'explorer',open:a=>openExplorer(typeof a==='string'?a:'/Desktop')},
  editor:{name:'HTML 编辑器',icon:'editor',open:a=>typeof a==='string'?openEditorFor(a):openEditor()},
  notepad:{name:'记事本',icon:'notepad',open:a=>openNotepad(typeof a==='string'?a:null)},
  sheet:{name:'表格',icon:'table',open:a=>a?openSheet(a):toast('请从文件打开 CSV / TSV','warn')},
  viewer:{name:'图片查看器',icon:'image',open:a=>a?openViewer(a):launch('explorer','/Pictures')},
  manga:{name:'漫画阅读器',icon:'manga',open:a=>a?openManga(a):launch('explorer','/Pictures')},
  media:{name:'媒体播放器',icon:'video',open:a=>a?openMedia(a):launch('explorer','/Music')},
  browser:{name:'网页浏览器',icon:'browser',open:a=>openBrowser(typeof a==='string'?'vfs://'+a:null)},
  calculator:{name:'计算器',icon:'calculator',open:()=>openCalculator()},
  paint:{name:'画板',icon:'paint',open:()=>openPaint()},
  terminal:{name:'终端',icon:'terminal',open:()=>openTerminal()},
  archive:{name:'压缩包管理器',icon:'archive',open:a=>a?openArchive(a):toast('请选择一个压缩包','warn')},
  vm:{name:'虚拟机 V86',icon:'cpu',open:a=>openVM(typeof a==='string'?a:null)},
  pdf:{name:'PDF 阅读器',icon:'pdf',hidden:true,open:a=>openPdf(a)},
  settings:{name:'设置',icon:'settings',open:a=>openSettings(typeof a==='string'?a:null)}};
function launch(id,arg,opt){const a=APPS[id];if(!a)return toast('未知应用：'+id,'warn');
  try{return a.open(arg,opt)}catch(e){console.error(e);toast('启动失败：'+e.message,'warn')}}
window.launch=launch;

function htmlChooser(path){
  const m=modal(`<h3>打开 HTML 文档</h3><p>${esc(P.base(path))}</p>
    <div style="display:grid;gap:10px">
      <button class="btn pri" id="_hb" style="text-align:left;padding:14px 16px">在系统浏览器中打开<br>
        <span style="font-family:var(--f-mono);font-size:10px;opacity:.8">渲染完整页面 · Blob 加载</span></button>
      <button class="btn" id="_he" style="text-align:left;padding:14px 16px">编辑源代码（含实时预览）<br>
        <span style="font-family:var(--f-mono);font-size:10px;opacity:.7">CodeMirror · 保存回 OPFS</span></button>
      <button class="btn ghost" id="_hn" style="text-align:left;padding:12px 16px">以纯文本方式打开</button>
    </div>`);
  $('#_hb').onclick=()=>{m.close();openBrowser('vfs://'+path)};
  $('#_he').onclick=()=>{m.close();openEditorFor(path)};
  $('#_hn').onclick=()=>{m.close();openNotepad(path)};}

async function openPath(path,entry){
  let st=entry&&entry.type?{type:entry.type}:null;
  try{if(!st)st=await fs.stat(path)}catch(e){return toast('无法打开：'+e.message,'warn')}
  if(st.type==='dir')return launch('explorer',path);           // 智能分派：目录 → 资源管理器
  const ext=P.ext(path);
  if(ext==='app'){try{const j=JSON.parse(await fs.readText(path));return launch(j.app,j.arg)}catch(e){return toast('快捷方式已损坏','warn')}}
  if(inSet(ext,'image')){
    if(Store.get('mangaDefault',true)){try{const sib=await siblingImages(path);if(sib.length>1)return openManga(path)}catch(e){}}
    return openViewer(path);}
  if(inSet(ext,'video')||inSet(ext,'audio'))return openMedia(path);
  if(ext==='pdf')return openPdf(path);
  if(inSet(ext,'archive'))return openArchive(path);
  if(inSet(ext,'sheet'))return openSheet(path);
  if(ext==='html'||ext==='htm')return htmlChooser(path);
  if(inSet(ext,'disk'))return openVM(path);
  if(inSet(ext,'text')||inSet(ext,'code')||!ext)return openNotepad(path);
  /* 未知类型：始终提供通用打开方式 */
  const r=$('#desk').getBoundingClientRect();
  showMenu(r.width/2-100,r.height/2-120,[{title:'选择打开方式 · '+P.base(path)},...openWithMenu(path)]);}
window.openPath=openPath;

/* ---------- 全局交互 ---------- */
function wireShell(){
  $('#startBtn').onclick=e=>{e.stopPropagation();Start.toggle()};
  $('#stSearch').oninput=e=>Start.render(e.target.value.trim());
  $$('#start [data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==='settings'){Start.close();launch('settings')}
    if(a==='reload'){location.reload()}});
  addEventListener('pointerdown',e=>{if(!e.target.closest('#start')&&!e.target.closest('#startBtn'))Start.close()});
  $('#btnTheme').onclick=()=>{const cur=Store.get('theme','dark');Store.set('theme',cur==='dark'?'light':'dark');applyTheme();
    toast('已切换到'+(Store.get('theme')==='dark'?'漆夜':'和纸')+'主题')};
  $('#btnStorage').innerHTML=ico('disk');$('#btnStorage').onclick=()=>launch('settings','storage');
  $('#btnFull').innerHTML=ico('max');
  $('#btnFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
  const pb=$('#peekBar');
  pb.onpointerenter=()=>document.body.classList.add('peeking');
  pb.onpointerleave=()=>document.body.classList.remove('peeking');
  pb.onclick=()=>{document.body.classList.remove('peeking');WM.minimizeAll()};
  $('#taskbar').oncontextmenu=e=>{if(e.target.closest('.tk'))return;e.preventDefault();
    showMenu(e.clientX,e.clientY-150,[{title:'任务栏'},
      {label:'平铺所有窗口',icon:'apps',action:()=>WM.tile()},
      {label:'显示桌面',icon:'desktop',action:()=>WM.minimizeAll()},
      {label:'任务管理',icon:'cpu',action:()=>infoBox('运行中的窗口',WM.wins.map(w=>
        `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2)">
          <span>${esc(w.title)}</span><span class="mono" style="font-size:10px">${esc(w.app||'—')}</span></div>`).join('')||'无')},
      '-',{label:'设置',icon:'settings',action:()=>launch('settings')}])};
  /* 全局拖放兜底：防止浏览器直接打开文件 */
  ['dragover','drop'].forEach(t=>addEventListener(t,e=>{
    const tg=e.target;if(tg&&tg.closest&&tg.closest('#deskArea,.win'))return;
    e.preventDefault();
    if(t==='drop'&&e.dataTransfer&&(e.dataTransfer.files.length||e.dataTransfer.items.length))importDataTransfer(e.dataTransfer,'/Downloads');},false));
  /* 快捷键 */
  addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    if(e.key==='Escape'){closeMenus();Start.close()}
    if(e.key==='F5'&&!typing){e.preventDefault();Desk.render();toast('桌面已刷新')}
    if(e.key==='F2'&&!typing&&Desk.sel.size===1){e.preventDefault();
      const p=[...Desk.sel][0];promptBox('重命名','新名称',P.base(p)).then(n=>{if(n)fs.rename(p,P.join(P.dir(p),n))})}
    if(e.key==='Delete'&&!typing&&Desk.sel.size)deletePaths([...Desk.sel]);
    if(e.key==='Escape'&&e.ctrlKey){e.preventDefault();Start.toggle()}
    if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();launch('terminal')}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();launch('explorer')}
    if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&Desk.sel){
      if(!document.querySelector('.win.active')){e.preventDefault();
        $$('.dicon').forEach(n=>{n.classList.add('sel');Desk.sel.add(n.dataset.path)})}}
  });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(Store.get('theme','dark')==='auto')applyTheme()});
}

  if(mode!=='opfs')toast('OPFS 不可用，已启用 IndexedDB 降级存储','warn',5200);
  else if(!Store.get('welcomed')){Store.set('welcomed',1);
    setTimeout(()=>toast('漆 URUSHI OS 已就绪 · OPFS 持久化已启用','ok',4200),600);}
})();









</script>
