const ThumbCache=new Map();
async function thumbURL(path,size){
  const c=ThumbCache.get(path);if(c)return c.url;
  try{
    const st=await fs.stat(path);if(st.size>12*1024*1024)return null;
    const blob=await fs.read(path);const url=URL.createObjectURL(blob);
    ThumbCache.set(path,{url,size});
    if(ThumbCache.size>240){const k=ThumbCache.keys().next().value;URL.revokeObjectURL(ThumbCache.get(k).url);ThumbCache.delete(k)}
    return url;
  }catch(e){return null}
}
const lazyThumbs=new IntersectionObserver(es=>{

async function dropInto(e,destDir){

      toast(`已移动到 ${destDir||'/'}`,{type:'ok'});
    }else if(e.dataTransfer.files&&e.dataTransfer.files.length){
      const t=toast('正在导入…',{timeout:0});

    }
  }catch(err){toast('操作失败：'+err.message,{type:'bad'})}

}

function formatCode(code,mode){
  try{
    if(mode==='application/json')return JSON.stringify(JSON.parse(code),null,2);
    if(mode==='htmlmixed'||mode==='xml')return fmtMarkup(code);
    if(mode==='css')return fmtCSS(code);
    if(mode==='javascript')return fmtJS(code);
  }catch(e){toast('格式化失败：'+e.message,{type:'warn'})}
  return code;
}
function fmtMarkup(src){
  const voids=new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr','!doctype']);
  const tokens=src.replace(/>\s*</g,'>\n<').split('\n');let d=0,out=[];
  for(let t of tokens){
    t=t.trim();if(!t)continue;
    const m=t.match(/^<\/?([a-zA-Z0-9!-]+)/);const tag=m?m[1].toLowerCase():'';
    const isClose=/^<\//.test(t),isSelf=/\/>$/.test(t)||voids.has(tag);
    if(isClose)d=Math.max(0,d-1);
    out.push('  '.repeat(d)+t);
    if(!isClose&&!isSelf&&/^<[a-zA-Z]/.test(t)&&!new RegExp('</'+tag+'>$','i').test(t))d++;
  }
  return out.join('\n');
}
function fmtCSS(src){

    if(l==='}'){a.d=Math.max(0,a.d-1);a.out.push('}');return a}
    a.out.push('  '.repeat(a.d)+l);
    if(l.endsWith('{'))a.d++;
    return a;
  },{d:0,out:[]}).out.join('\n');
}
function fmtJS(src){

  const nl=()=>{out=out.replace(/[ \t]+$/,'')+'\n'+'  '.repeat(Math.max(0,d))};
  while(i<src.length){
    const c=src[i],n=src[i+1];
    if(inComment){out+=c;if(inComment==='//'&&c==='\n'){inComment=null;out+='  '.repeat(d)}else if(inComment==='/*'&&c==='/'&&src[i-1]==='*')inComment=null;i++;continue}
    if(inStr){out+=c;if(c==='\\'){out+=n;i+=2;continue}if(c===inStr)inStr=null;i++;continue}
    if(c==='/'&&n==='/'){inComment='//';out+='//';i+=2;continue}
    if(c==='/'&&n==='*'){inComment='/*';out+='/*';i+=2;continue}
    if(c==='"'||c==="'"||c==='`'){inStr=c;out+=c;i++;continue}
    if(c==='{'){d++;out+='{';nl();i++;while(src[i]===' '||src[i]==='\n'||src[i]==='\t')i++;continue}
    if(c==='}'){d=Math.max(0,d-1);nl();out+='}';i++;while(src[i]===' '||src[i]==='\t')i++;if(src[i]==='\n'){i++;nl()}continue}
    if(c===';'){out+=';';i++;while(src[i]===' '||src[i]==='\t')i++;if(src[i]!=='\n')nl();else{i++;nl()}continue}

Apps.manga={name:'漫画阅读器',icon:'manga',color:'var(--rose)',w:900,h:720,needsFile:true,async open(win,params={}){
  const path=params.path;
  const dir=fs.dirname(path);
  const root=el('div','manga-root');
  root.innerHTML=`<div class="manga-bar">
    <span class="m-title" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <span class="badge m-count">载入中</span>
    <select class="inp" data-a="fit" style="width:auto;padding:3px 24px 3px 8px;font-size:11px"><option value="width">适应宽度</option><option value="original">原始尺寸</option><option value="height">适应高度</option></select>
    <button class="btn sm" data-a="viewer">${ic('image',13)} 图片查看器</button>
    <button class="btn sm" data-a="full">${ic('full',13)} 沉浸全屏</button>
  </div>
  <div class="manga"></div>
  <button class="fs-exit" title="退出全屏">${ic('close',20)}</button>`;
  win.body.appendChild(root);
  const scroller=root.querySelector('.manga');
  const urls=[];let raf=0,vel=0,dragging=false,lastY=0,lastT=0,destroyed=false;
  let imgs=[];
  try{imgs=await listImages(dir)}catch(e){toast('目录读取失败：'+e.message,{type:'bad'});root.innerHTML=`<div class="empty">${ic('info',30)}<div>无法读取该目录</div></div>`;return}
  if(!imgs.length){scroller.innerHTML=`<div class="empty" style="color:#666">${ic('image',30)}<div>该目录没有图片</div></div>`;return}
  root.querySelector('.m-title').textContent=fs.basename(dir)||'根目录';
  win.setTitle(fs.basename(path),'漫画阅读器');
  root.querySelector('.m-count').textContent=`共 ${imgs.length} 页`;
  const wraps=[];
  imgs.forEach((im,i)=>{
    const w=el('div','m-wrap');w.dataset.idx=i;
    w.innerHTML=`<div class="m-skel"><div class="spinner"></div></div><div class="m-pageno">${i+1} / ${imgs.length}</div>`;
    const img=el('img');img.style.display='none';img.alt=im.name;img.decoding='async';
    w.appendChild(img);scroller.appendChild(w);wraps.push({w,img,im,loaded:false});

  async function loadOne(item){
    try{
      const blob=await fs.read(item.im.path);
      if(destroyed)return;
      const url=URL.createObjectURL(blob);urls.push(url);
      await new Promise(res=>{
        item.img.onload=()=>{
          const before=item.w.offsetHeight;
          const skel=item.w.querySelector('.m-skel');if(skel)skel.remove();
          item.img.style.display='block';
          const delta=item.w.offsetHeight-before;
          if(delta&&item.w.offsetTop<scroller.scrollTop)scroller.scrollTop+=delta;
          item.loaded=true;
          if(!located&&wraps.indexOf(item)<=target)locate();
          res();
        };
        item.img.onerror=()=>{const skel=item.w.querySelector('.m-skel');if(skel)skel.outerHTML=`<div class="m-err">${ic('info',22)}<div>此页加载失败</div></div>`;res()};
        item.img.src=url;
      });
    }catch(e){
      const skel=item.w.querySelector('.m-skel');if(skel)skel.outerHTML=`<div class="m-err">${ic('info',22)}<div>读取失败，已跳过</div></div>`;
    }
  }
  (async()=>{
    const queue=[...wraps];const workers=Array.from({length:4},async()=>{while(queue.length&&!destroyed){const it=queue.shift();await loadOne(it)}});
    await Promise.all(workers);
    if(!destroyed){locate();root.querySelector('.m-count').textContent=`共 ${imgs.length} 页 · 已载入`}
  })();
  setTimeout(locate,900);

    const glide=()=>{if(Math.abs(vel)<0.4){raf=0;return}scroller.scrollTop-=vel;vel*=0.96;raf=requestAnimationFrame(glide)};
    if(!raf)raf=requestAnimationFrame(glide);
  };
  scroller.addEventListener('pointerup',endDrag);scroller.addEventListener('pointercancel',endDrag);
  scroller.addEventListener('wheel',()=>stopInertia(),{passive:true});
  /* 页码 */
  scroller.addEventListener('scroll',debounce(()=>{
    const y=scroller.scrollTop+scroller.clientHeight*0.3;

  },120),{passive:true});
  /* 全屏 */
  const setImmersive=on=>{root.classList.toggle('immersive',on);win.el.classList.toggle('manga-fs',on)};
  async function enterFS(){

  }
  async function exitFS(){
    setImmersive(false);
    try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}
  }
  const onFSChange=()=>{if(!document.fullscreenElement)setImmersive(false)};
  document.addEventListener('fullscreenchange',onFSChange);
  root.querySelector('[data-a="full"]').onclick=enterFS;
  root.querySelector('.fs-exit').onclick=exitFS;
  root.querySelector('[data-a="viewer"]').onclick=()=>WM.open('viewer',{path});
  root.querySelector('[data-a="fit"]').onchange=e=>{

  const keyH=e=>{if(S.focused!==win)return;if(e.key==='Escape'&&root.classList.contains('immersive'))exitFS()};
  document.addEventListener('keydown',keyH);
  win.onClose(()=>{destroyed=true;stopInertia();document.removeEventListener('fullscreenchange',onFSChange);document.removeEventListener('keydown',keyH);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});urls.forEach(u=>URL.revokeObjectURL(u))});
}};

Apps.viewer={name:'图片查看器',icon:'image',color:'var(--rose)',w:900,h:660,needsFile:true,async open(win,params={}){
  const dir=fs.dirname(params.path);
  let list=[];try{list=await listImages(dir)}catch(e){}
  if(!list.length)list=[{path:params.path,name:fs.basename(params.path)}];
  let idx=Math.max(0,list.findIndex(i=>i.path===params.path));
  let scale=1,rot=0,tx=0,ty=0,url=null,natW=0,natH=0,fit=true;
  const root=el('div','viewer');
  root.innerHTML=`<div class="vw-stage"><img alt=""></div>
  <div class="vw-bar">
    <button class="btn sm" data-a="prev">${ic('back',13)} 上一张</button>
    <button class="btn sm" data-a="next">下一张 ${ic('fwd',13)}</button>
    <span style="width:1px;height:18px;background:var(--line)"></span>
    <button class="btn sm" data-a="out">${ic('zoomOut',13)} 缩小</button>
    <span class="v-zoom" style="font-size:11.5px;color:var(--dim);min-width:46px;text-align:center">100%</span>
    <button class="btn sm" data-a="in">${ic('zoomIn',13)} 放大</button>
    <button class="btn sm" data-a="fit">${ic('full',13)} 适应</button>
    <button class="btn sm" data-a="one">1:1</button>
    <button class="btn sm" data-a="rot">${ic('rotate',13)} 旋转</button>
    <span style="width:1px;height:18px;background:var(--line)"></span>
    <button class="btn sm" data-a="manga">${ic('manga',13)} 条漫阅读</button>
    <button class="btn sm" data-a="dl">${ic('download',13)} 下载</button>
    <span class="v-info" style="font-size:11px;color:var(--faint)"></span>
  </div>`;
  win.body.appendChild(root);
  const stage=root.querySelector('.vw-stage'),img=root.querySelector('img');
  function apply(){img.style.transform=`translate(${tx}px,${ty}px) scale(${scale}) rotate(${rot}deg)`;root.querySelector('.v-zoom').textContent=Math.round(scale*100)+'%'}
  function doFit(){
    if(!natW)return;
    const r=stage.getBoundingClientRect();
    scale=Math.min((r.width-32)/natW,(r.height-32)/natH,1);
    tx=ty=0;fit=true;apply();
  }
  async function show(i){
    idx=(i+list.length)%list.length;
    const it=list[idx];
    const v=veil(root,'载入图像…');
    try{
      const blob=await fs.read(it.path);
      if(url)URL.revokeObjectURL(url);
      url=URL.createObjectURL(blob);
      img.src=url;
      await new Promise(r=>{img.onload=r;img.onerror=r});
      natW=img.naturalWidth;natH=img.naturalHeight;rot=0;doFit();
      win.setTitle(it.name,'图片查看器');
      root.querySelector('.v-info').textContent=`${idx+1}/${list.length} · ${natW}×${natH} · ${fmt.size(blob.size)}`;
    }catch(e){toast('图片载入失败：'+e.message,{type:'bad'})}
    v.remove();
  }
  stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;scale=clamp(scale*f,0.05,16);fit=false;apply()},{passive:false});
  let drag=null;
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing'});
  stage.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);apply()});
  const up=()=>{drag=null;stage.style.cursor='grab'};
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',()=>{if(fit){scale=1;fit=false;apply()}else doFit()});
  let pinch=null;
  stage.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),s:scale}}},{passive:true});
  stage.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=clamp(pinch.s*d/pinch.d,0.05,16);apply()}},{passive:false});
  stage.addEventListener('touchend',()=>{pinch=null});
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='prev')show(idx-1);else if(a==='next')show(idx+1);
    else if(a==='in'){scale=clamp(scale*1.2,0.05,16);fit=false;apply()}
    else if(a==='out'){scale=clamp(scale/1.2,0.05,16);fit=false;apply()}
    else if(a==='fit')doFit();
    else if(a==='one'){scale=1;fit=false;tx=ty=0;apply()}
    else if(a==='rot'){rot=(rot+90)%360;apply()}
    else if(a==='manga')WM.open('manga',{path:list[idx].path});
    else if(a==='dl')fs.read(list[idx].path).then(b=>IO.download(b,list[idx].name));
  });
  const keyH=e=>{if(S.focused!==win)return;if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)};
  document.addEventListener('keydown',keyH);
  const offR=Bus.on('winresize',w=>{if(w===win&&fit)doFit()});
  win.onClose(()=>{document.removeEventListener('keydown',keyH);offR();if(url)URL.revokeObjectURL(url)});
  show(idx);
}};

Apps.media={name:'媒体播放器',icon:'play',color:'var(--ok)',w:820,h:600,needsFile:true,async open(win,params={}){

  media.addEventListener('ended',()=>{if(idx<list.length-1)load(idx+1,true)});
  const seek=root.querySelector('.seek');
  const doSeek=e=>{const r=seek.getBoundingClientRect();const {x}=getClientXY(e);media.currentTime=clamp((x-r.left)/r.width,0,1)*(media.duration||0)};
  seek.addEventListener('pointerdown',e=>{seek.setPointerCapture(e.pointerId);doSeek(e);const mv=ev=>doSeek(ev);const up=()=>{seek.removeEventListener('pointermove',mv);seek.removeEventListener('pointerup',up)};seek.addEventListener('pointermove',mv);seek.addEventListener('pointerup',up)});
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='play')media.paused?media.play():media.pause();
    else if(a==='prev')load(idx-1,true);else if(a==='next')load(idx+1,true);

  renderList();load(idx,false);
}};

Apps.browser={name:'网页浏览器',icon:'browser',color:'var(--info)',w:1040,h:680,open(win,params={}){
  const hist=[];let hi=-1,url=null;
  const root=el('div','br');
  root.innerHTML=`<div class="br-bar">
    <button class="ibtn" data-a="back">${ic('back',16)}</button><button class="ibtn" data-a="fwd">${ic('fwd',16)}</button>

    <div class="br-url">${ic('lock',13)}<input placeholder="输入网址，或搜索…"></div>
    <button class="ibtn" data-a="tab" title="在真实标签页打开">${ic('external',16)}</button>
  </div><div class="br-stage"><iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe><div class="pv-mask"><div class="spinner lg"></div><div>LOADING</div></div></div>`;
  win.body.appendChild(root);
  const f=root.querySelector('iframe'),input=root.querySelector('input'),mask=root.querySelector('.pv-mask'),stage=root.querySelector('.br-stage');
  const HOME=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#12365c,#050b16);color:#e9f2fc;font-family:'Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  h1{font-family:'Cinzel',serif;letter-spacing:.5em;color:#e3c27e;font-weight:500;margin:0}
  p{color:#8ba5c4;font-size:13px;letter-spacing:.12em;margin:0}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:640px}
  a{color:#4cc9f0;text-decoration:none;border:1px solid #4cc9f055;padding:10px 18px;border-radius:10px;font-size:13px;background:#0b142488;transition:.2s}
  a:hover{background:#4cc9f022;transform:translateY(-2px)}
  .note{font-size:11px;color:#5f7796;max-width:520px;text-align:center;line-height:1.8}
  </style></head><body><h1>FURINA</h1><p>众水之座 · 网页浏览器</p>
  <div class="links"><a href="https://example.com">example.com</a><a href="https://developer.mozilla.org/zh-CN/">MDN 文档</a><a href="https://zh.wikipedia.org">维基百科</a><a href="https://www.bing.com">必应搜索</a></div>
  <div class="note">部分网站通过 X-Frame-Options 禁止被嵌入 iframe。若页面空白，请点击右上角「在真实标签页打开」。<br>本地 HTML 文件可直接从文件管理器以浏览器打开。</div></body></html>`;
  function setMask(on){mask.classList.toggle('hide',!on)}
  function nav(src,label,noHist){
    setMask(true);
    f.srcdoc='';f.removeAttribute('srcdoc');
    if(src==='home'){f.srcdoc=HOME;input.value='furina://home'}
    else{f.src=src;input.value=label||src}
    if(!noHist){hist.splice(hi+1);hist.push({src,label});hi=hist.length-1}
    win.setTitle(label&&label!=='home'?String(label).slice(0,40):'新标签页','网页浏览器');

  }

    const v=veil(stage,'载入本地网页…');
    try{
      const b=await fs.read(path);
      if(url)URL.revokeObjectURL(url);
      url=URL.createObjectURL(new Blob([b],{type:'text/html'}));
      nav(url,fs.basename(path));
    }catch(e){toast('载入失败：'+e.message,{type:'bad'})}
    v.remove();
  }
  input.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    let v=input.value.trim();if(!v)return;
    if(v==='furina://home'||v==='home')return nav('home','home');
    if(!/^https?:\/\//i.test(v)){
      if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v))v='https://'+v;
      else v='https://www.bing.com/search?q='+encodeURIComponent(v);

  });
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;

    else if(a==='fwd'&&hi<hist.length-1){hi++;const h=hist[hi];nav(h.src,h.label,true)}
    else if(a==='reload'){if(hi>=0){const h=hist[hi];nav(h.src,h.label,true)}}
    else if(a==='home')nav('home','home');
    else if(a==='tab'){const h=hist[hi];if(h&&h.src!=='home')window.open(h.src,'_blank');else toast('当前为主页',{type:'warn'})}

Apps.archive={name:'压缩包',icon:'archive',color:'var(--warn)',w:760,h:560,needsFile:true,async open(win,params={}){
  const root=el('div','np');
  root.innerHTML=`<div class="np-tools"><span style="font-size:12px;color:var(--dim);flex:1">${esc(fs.basename(params.path))}</span><button class="btn sm primary" data-a="extract">${ic('unzip',13)} 解压到此处</button><button class="btn sm" data-a="dl">${ic('download',13)} 下载</button></div><div class="csv-wrap" style="padding:8px"></div><div class="np-status"><span class="s-n">解析中…</span></div>`;
  win.body.appendChild(root);
  const wrap=root.querySelector('.csv-wrap');
  win.setTitle(fs.basename(params.path),'压缩包');
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='extract'){const folder=await Arc.extract(params.path,fs.dirname(params.path));if(folder)WM.open('explorer',{path:folder})}
    else fs.read(params.path).then(bl=>IO.download(bl,fs.basename(params.path)));
  });
  const v=veil(root,'解析压缩包…');
  try{
    const buf=await (await fs.read(params.path)).arrayBuffer();
    const e=extOf(params.path);let rows=[];
    if(e==='zip'){
      const JSZip=await Arc.ensureZip();const zip=await JSZip.loadAsync(buf);
      rows=Object.values(zip.files).map(f=>({name:f.name,dir:f.dir,size:f._data?f._data.uncompressedSize:0,date:Arc.dosFix(f.date)}));
    }else if(e==='tar'||e==='tgz'||params.path.toLowerCase().endsWith('.tar.gz')){
      const u8=e==='tar'?new Uint8Array(buf):await Arc.gunzip(buf);
      let off=0;const dec=new TextDecoder();const str=(a,b)=>dec.decode(u8.subarray(a,b)).replace(/\0.*$/,'').trim();
      while(off+512<=u8.length){const name=str(off,off+100);if(!name)break;const size=parseInt(str(off+124,off+136)||'0',8)||0;const type=String.fromCharCode(u8[off+156]);const mt=(parseInt(str(off+136,off+148)||'0',8)||0)*1000;rows.push({name,dir:type==='5',size,date:mt});off+=512+Math.ceil(size/512)*512}
    }else if(e==='7z'){rows=[{name:'（7z 压缩包内容需解压后查看）',dir:false,size:buf.byteLength,date:Date.now()}]}
    else if(e==='gz'){rows=[{name:fs.basename(params.path).replace(/\.gz$/i,''),dir:false,size:buf.byteLength,date:Date.now()}]}
    wrap.innerHTML='';
    const t=el('table','csv-table');
    t.innerHTML='<tr><th>名称</th><th>大小</th><th>修改日期</th></tr>'+rows.map(r=>`<tr><td>${ic(r.dir?'folder':'file',13)} ${esc(r.name)}</td><td>${r.dir?'—':fmt.size(r.size)}</td><td>${fmt.date(r.date)}</td></tr>`).join('');
    wrap.appendChild(t);
    root.querySelector('.s-n').textContent=`${rows.length} 个条目 · ${fmt.size(buf.byteLength)}`;
  }catch(err){wrap.innerHTML=`<div class="empty">${ic('info',28)}<div>无法解析：${esc(err.message)}</div><div style="font-size:11px">仍可尝试「解压到此处」</div></div>`}
  v.remove();
}};

Apps.calc={name:'计算器',icon:'calc',color:'var(--gold)',w:340,h:520,open(win){
  const root=el('div','calc');
  const keys=[['C','clr'],['(','fn'],[')','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['±','fn'],['0',''],['.',''],['=','eq']];
  root.innerHTML=`<div class="calc-disp"><div class="expr"></div><div class="val">0</div></div><div class="calc-grid">${keys.map(([k,c])=>`<button class="ckey ${c}" data-k="${k}">${k}</button>`).join('')}</div><div style="display:flex;gap:6px"><button class="btn sm" data-k="back">${ic('back',13)} 退格</button><button class="btn sm" data-k="sqrt">√</button><button class="btn sm" data-k="sq">x²</button><button class="btn sm" data-k="pct">%</button><span style="flex:1"></span><span class="badge gold">键盘可输入</span></div>`;
  win.body.appendChild(root);
  let expr='';
  const disp=root.querySelector('.val'),ex=root.querySelector('.expr');
  const upd=()=>{ex.textContent=expr||' ';disp.textContent=expr?evalExpr(expr,true):'0'};
  function evalExpr(s,soft){
    try{
      let t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(\.\d+)?)%/g,'($1/100)');
      if(!/^[-+*/().\d\s]*$/.test(t))return '错误';
      const open=(t.match(/\(/g)||[]).length,close=(t.match(/\)/g)||[]).length;
      if(open>close)t+=')'.repeat(open-close);
      t=t.replace(/[+\-*/.]+$/,'');
      if(!t)return '0';
      const r=Function('"use strict";return ('+t+')')();
      if(!isFinite(r))return '错误';
      return String(Math.round(r*1e10)/1e10);
    }catch(e){return soft?'…':'错误'}
  }
  function press(k){
    if(k==='C'){expr='';upd();return}
    if(k==='back'){expr=expr.slice(0,-1);upd();return}
    if(k==='='){const r=evalExpr(expr);ex.textContent=expr+' =';expr=r==='错误'?'':r;disp.textContent=r;return}
    if(k==='±'){const m=expr.match(/(-?\d+\.?\d*)$/);if(m){const v=m[1];expr=expr.slice(0,-v.length)+(v.startsWith('-')?v.slice(1):'-'+v)}upd();return}
    if(k==='sqrt'){expr=String(Math.sqrt(parseFloat(evalExpr(expr))||0));upd();return}
    if(k==='sq'){const v=parseFloat(evalExpr(expr))||0;expr=String(v*v);upd();return}
    expr+=k;upd();
  }
  root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)});
  const kh=e=>{
    if(S.focused!==win)return;
    const k=e.key;
    if(/^[0-9.+\-*/()%]$/.test(k)){press(k==='*'?'×':k==='/'?'÷':k==='-'?'−':k);e.preventDefault()}
    else if(k==='Enter'||k==='='){press('=');e.preventDefault()}
    else if(k==='Backspace'){press('back');e.preventDefault()}
    else if(k==='Escape'){press('C');e.preventDefault()}
  };
  document.addEventListener('keydown',kh);
  win.onClose(()=>document.removeEventListener('keydown',kh));
  upd();
}};

Apps.paint={name:'画板',icon:'paint',color:'var(--rose)',w:940,h:660,open(win,params={}){
  const st={tool:'brush',color:'#4cc9f0',size:6,undo:[],drawing:false,path:null};
  const root=el('div','paint');
  root.innerHTML=`<div class="paint-tools">
    <div class="seg"><button data-t="brush" class="on">${ic('edit',13)} 画笔</button><button data-t="eraser">${ic('clear',13)} 橡皮</button><button data-t="line">${ic('min',13)} 直线</button><button data-t="rect">${ic('max',13)} 矩形</button><button data-t="circle">${ic('droplet',13)} 椭圆</button></div>
    <input type="color" class="color-inp" value="#4cc9f0" data-a="color">
    <input type="range" class="slider" min="1" max="60" value="6" data-a="size" style="width:110px">
    <span class="sz" style="font-size:11px;color:var(--dim)">6 px</span>
    <button class="btn sm" data-a="undo">${ic('undo',13)} 撤销</button>
    <button class="btn sm" data-a="clear">${ic('trash',13)} 清空</button>
    <button class="btn sm" data-a="bg">${ic('image',13)} 白底</button>
    <span style="flex:1"></span>
    <button class="btn sm" data-a="save">${ic('save',13)} 保存到图片</button>
    <button class="btn sm" data-a="dl">${ic('download',13)} 下载</button>
  </div><div class="paint-stage"><canvas width="1000" height="640"></canvas></div>`;
  win.body.appendChild(root);
  const cv=root.querySelector('canvas'),ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap='round';ctx.lineJoin='round';
  let start=null,snapshot=null;
  const push=()=>{st.undo.push(ctx.getImageData(0,0,cv.width,cv.height));if(st.undo.length>18)st.undo.shift()};
  const pos=e=>{const r=cv.getBoundingClientRect();const {x,y}=getClientXY(e);return{x:(x-r.left)*cv.width/r.width,y:(y-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();cv.setPointerCapture(e.pointerId);push();
    st.drawing=true;start=pos(e);snapshot=ctx.getImageData(0,0,cv.width,cv.height);
    ctx.strokeStyle=st.tool==='eraser'?'#ffffff':st.color;ctx.lineWidth=st.size;
    ctx.beginPath();ctx.moveTo(start.x,start.y);
    if(st.tool==='brush'||st.tool==='eraser'){ctx.lineTo(start.x+0.01,start.y);ctx.stroke()}
  });
  cv.addEventListener('pointermove',e=>{
    if(!st.drawing)return;const p=pos(e);
    if(st.tool==='brush'||st.tool==='eraser'){ctx.lineTo(p.x,p.y);ctx.stroke()}
    else{
      ctx.putImageData(snapshot,0,0);ctx.beginPath();
      if(st.tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}
      else if(st.tool==='rect')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);
      else ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);
      ctx.stroke();
    }
  });
  const end=()=>{st.drawing=false;start=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.tool=b.dataset.t;root.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b))});
  root.querySelector('[data-a="color"]').oninput=e=>st.color=e.target.value;
  root.querySelector('[data-a="size"]').oninput=e=>{st.size=parseInt(e.target.value);root.querySelector('.sz').textContent=st.size+' px';e.target.style.setProperty('--p',(st.size/60*100)+'%')};
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='undo'){const d=st.undo.pop();if(d)ctx.putImageData(d,0,0)}
    else if(a==='clear'){push();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)}
    else if(a==='bg'){push();ctx.globalCompositeOperation='destination-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.globalCompositeOperation='source-over'}
    else if(a==='dl')cv.toBlob(bl=>IO.download(bl,'画作.png'));
    else if(a==='save'){cv.toBlob(async bl=>{await fs.mkdirp('/图片');const p=await fs.uniqueName('/图片/画作_'+Date.now()+'.png');await fs.write(p,bl);toast('已保存到 '+p,{type:'ok'})})}
  });
  if(params.path){fs.read(params.path).then(async b=>{const img=new Image();const u=URL.createObjectURL(b);img.onload=()=>{cv.width=img.naturalWidth;cv.height=img.naturalHeight;ctx.drawImage(img,0,0);URL.revokeObjectURL(u);ctx.lineCap='round';ctx.lineJoin='round'};img.src=u}).catch(()=>{})}
}};

        ${row('主存储后端','桌面与文档等目录所在位置',`<select class="inp" data-backend><option value="opfs"${S.settings.backend==='opfs'?' selected':''} ${fs.backends.opfs?'':'disabled'}>OPFS（推荐 · 大容量高性能）</option><option value="idb"${S.settings.backend==='idb'?' selected':''}>IndexedDB（兼容降级）</option></select>`)}
        ${row('同时挂载两个后端','在 /mnt/opfs 与 /mnt/idb 中直接访问两套存储',sw('dual',S.settings.dualStore))}
        <div class="set-row"><button class="btn" data-act="migrate">${ic('exportIc',14)} 迁移全部数据到另一后端</button><button class="btn" data-act="persist">${ic('lock',14)} 申请持久化存储</button><button class="btn" data-act="backup">${ic('zip',14)} 备份为 ZIP</button></div>
        <div style="font-size:11.5px;color:var(--faint);line-height:1.7">OPFS 为浏览器原生私有文件系统，支持 ArrayBuffer / Blob 二进制直写；IndexedDB 作为兼容降级后端。两者可并存，文件管理器中可自由拖动文件在两套存储之间移动，修改时间始终保留。</div>
      </div>
      <div class="card"><h4>${ic('mount',15)} 本地文件夹挂载</h4>
        <div id="mount-list"></div>
        <div class="set-row"><button class="btn" data-act="mount">${ic('plus',14)} 挂载本地文件夹</button>${Mounts.pending.length?`<button class="btn" data-act="regrant">${ic('refresh',14)} 重新授权 ${Mounts.pending.length} 个</button>`:''}</div>
        <div style="font-size:11.5px;color:var(--faint)">挂载点位于 /mnt/local/，与虚拟文件享有完全相同的功能（读写、重命名、拖拽、解压、预览）。刷新后浏览器会要求重新授权。</div>
      </div>
      <div class="card" style="border-color:color-mix(in srgb,var(--bad) 40%,transparent)"><h4 style="color:var(--bad)">${ic('trash',15)} 危险操作</h4>
        <div class="set-row"><div class="sr-label">一键重置系统<small>清空 OPFS 与 IndexedDB 全部文件并恢复初始桌面</small></div><button class="btn danger" data-act="reset">${ic('power',14)} 重置文件系统</button></div>
      </div>`;
      const ml=$('#mount-list',body);
      const ms=Mounts.list();
      ml.innerHTML=ms.length?'':'<div style="font-size:12px;color:var(--faint);padding:6px 0">尚未挂载任何本地文件夹</div>';
      ms.forEach(m=>{
        const n=el('div','mount-item',`<span style="color:var(--ok)">${ic('mount',15)}</span><span class="mi-name">${esc(m.name)}</span><span style="font-size:11px;color:var(--faint)">${esc(m.path)}</span><button class="btn sm" data-open>${ic('explorer',12)} 打开</button><button class="btn sm danger" data-un>${ic('unmount',12)} 卸载</button>`);
        n.querySelector('[data-open]').onclick=()=>WM.open('explorer',{path:m.path});
        n.querySelector('[data-un]').onclick=async()=>{await Mounts.unmount(m.name);render.storage()};
        ml.appendChild(n);
      });
      $('[data-backend]',body).onchange=async e=>{
        const v=e.target.value;
        if(v===S.settings.backend)return;
        if(!await dlg.confirm('切换主存储后端后，桌面与文档目录将指向 '+(v==='opfs'?'OPFS':'IndexedDB')+' 中的内容。\n现有文件不会丢失，可使用「迁移全部数据」复制过去。','切换存储后端')){e.target.value=S.settings.backend;return}
        S.settings.backend=v;saveSettings();fs.setRoot(v);await fs.seed();Desktop.refresh();Bus.emit('fschange','');render.storage();renderTaskbar();
      };
      $$('[data-act]',body).forEach(b=>b.onclick=async()=>{
        const a=b.dataset.act;
        if(a==='mount'){await Mounts.pick();render.storage()}
        else if(a==='regrant'){await Mounts.regrant();render.storage()}
        else if(a==='persist'){const ok=await(navigator.storage&&navigator.storage.persist?navigator.storage.persist():Promise.resolve(false));toast(ok?'已获得持久化存储权限':'浏览器拒绝了持久化请求', {type:ok?'ok':'warn'})}
        else if(a==='backup'){const t=toast('正在打包全部文件…',{timeout:0});try{const blob=await Arc.makeZip(tops.map(x=>x.path));IO.download(blob,'FurinaOS_备份.zip');t.close();toast('备份已下载',{type:'ok'})}catch(e){t.close();toast('备份失败：'+e.message,{type:'bad'})}}
        else if(a==='migrate'){
          const from=fs.rootName,to=from==='opfs'?'idb':'opfs';
          if(!fs.backends[to]){toast('目标后端不可用',{type:'bad'});return}
          if(!await dlg.confirm(`将 ${from.toUpperCase()} 中的全部文件复制到 ${to.toUpperCase()}？\n（修改时间会保留，原文件不会被删除）`,'迁移数据'))return;
          const t=toast('迁移中…',{timeout:0});
          try{
            const src=fs.backends[from],dst=fs.backends[to];
            const rec=async(rel,st)=>{
              if(st.kind==='dir'){await dst.mkdir(rel).catch(()=>{});for(const c of await src.readdir(rel))await rec((rel?rel+'/':'')+c.name,await src.stat((rel?rel+'/':'')+c.name))}
              else{const b=await src.readFile(rel);const full='/'+rel;const m=Meta.get(full);await dst.writeFile(rel,b,m?m.mtime:st.mtime);if(to==='opfs')await Meta.set(full,m?m.mtime:st.mtime)}
            };
            for(const c of await src.readdir(''))await rec(c.name,await src.stat(c.name));
            t.close();toast('迁移完成，可在设置中切换主后端',{type:'ok'});
          }catch(e){t.close();toast('迁移失败：'+e.message,{type:'bad'})}
        }
        else if(a==='reset'){
          if(!await dlg.confirm('这将永久删除虚拟文件系统中的所有文件（本地挂载文件夹不受影响），并恢复初始桌面。确定继续？','重置系统',true))return;
          const t=toast('正在重置…',{timeout:0});
          await fs.resetAll();t.close();
          S.settings.wallCustom='';saveSettings();await applyWallpaper();
          Desktop.refresh();Bus.emit('fschange','');toast('系统已重置',{type:'ok'});render.storage();
        }
      });
      bindCommon();
    },
    apps(){
      const appList=Object.entries(Apps).filter(([id,a])=>!a.hidden);
      body.innerHTML=`<h3>应用与桌面</h3><div class="sub">自定义启动器、任务栏与桌面图标</div>
      <div class="card"><h4>${ic('grid',15)} 隐藏系统应用</h4><div style="font-size:11.5px;color:var(--faint);margin-bottom:8px">勾选的应用将从开始菜单与桌面中隐藏（仍可通过文件「打开方式」调用）</div>
      ${appList.map(([id,a])=>row(`${a.name}`,id,sw('hide:'+id,S.settings.hiddenApps.includes(id)))).join('')}</div>
      <div class="card"><h4>${ic('star',15)} 任务栏固定</h4>${appList.map(([id,a])=>row(a.name,'固定到任务栏',sw('pin:'+id,(S.settings.pinned||[]).includes(id)))).join('')}</div>
      <div class="card"><h4>${ic('home',15)} 桌面系统图标</h4>${Desktop.sys.map(s=>row(s.name,s.key,sw('hidesys:'+s.key,S.settings.hiddenApps.includes(s.key)))).join('')}</div>`;
      $$('[data-sw]',body).forEach(s=>s.onclick=()=>{
        const [kind,id]=s.dataset.sw.split(':');const now=!s.classList.contains('on');s.classList.toggle('on',now);
        if(kind==='hide'||kind==='hidesys'){
          if(now)S.settings.hiddenApps.push(id);else S.settings.hiddenApps=S.settings.hiddenApps.filter(x=>x!==id);
        }else if(kind==='pin'){
          S.settings.pinned=S.settings.pinned||[];
          if(now)S.settings.pinned.push(id);else S.settings.pinned=S.settings.pinned.filter(x=>x!==id);
        }
        saveSettings();Desktop.refresh();renderTaskbar();
      });
      $$('input[type=range]',body).forEach(r=>r.style.setProperty('--p','50%'));
    },
    about(){
      body.innerHTML=`<h3>关于 Furina OS</h3><div class="sub">众水之座 · 单文件网页操作系统</div>
      <div class="card" style="text-align:center;padding:26px">
        <div style="display:flex;justify-content:center;color:var(--gold);margin-bottom:12px">${ic('crest',56,1.2)}</div>
        <div style="font-family:var(--font-dp);font-size:22px;letter-spacing:.35em;color:var(--gold)">FURINA OS</div>
        <div style="font-size:12px;color:var(--faint);letter-spacing:.2em;margin-top:6px">VERSION 1.0 · 独幕剧</div>
        <p style="font-size:12.5px;color:var(--dim);max-width:520px;margin:16px auto 0;line-height:1.9">「即便舞台落幕，我也会在观众席中，继续守望枫丹。」<br>一个完全运行于浏览器中的桌面环境：零后端、单文件、原生 OPFS 持久化。</p>
      </div>
      <div class="card"><h4>${ic('info',15)} 技术构成</h4>
        <div class="props" style="font-size:12px">
          <b>文件系统</b><span>OPFS（主）+ IndexedDB（降级 / 并存）+ File System Access 本地挂载，统一 fs 路由</span>
          <b>元数据</b><span>修改时间独立元数据表，移动 / 重命名 / 解压全程保留</span>
          <b>窗口管理</b><span>拖拽 · 八向缩放 · Aero Snap · Aero Peek · 移动端全屏 Dock</span>
          <b>编辑内核</b><span>CodeMirror 5.65.16（material-darker），离线自动降级为原生编辑器</span>
          <b>压缩</b><span>JSZip 3.10.1（DOS 时区修正）· 原生 DecompressionStream（gz）· 原生 TAR 解析 · 7z-wasm</span>
          <b>虚拟机</b><span>v86 0.5.319（版本锁定，JS / WASM / BIOS 同源）</span>
          <b>字体</b><span>Cinzel · ZCOOL XiaoWei · Outfit · Noto Sans SC · JetBrains Mono</span>
        </div>
      </div>
      <div class="card"><h4>${ic('wave',15)} 运行环境</h4><div class="props" style="font-size:12px">
        <b>浏览器</b><span>${esc(navigator.userAgent)}</span>
        <b>OPFS</b><span>${fs.backends.opfs?'支持':'不支持（已降级 IndexedDB）'}</span>
        <b>本地挂载</b><span>${Mounts.supported()?'支持':'当前浏览器不支持'}</span>
        <b>屏幕</b><span>${window.innerWidth} × ${window.innerHeight} · DPR ${window.devicePixelRatio}</span>
        <b>触摸</b><span>${isTouch?'触摸设备':'指针设备'}</span>
      </div></div>`;
    }
  };
  function go(tab){
    $$('.sn-item',nav).forEach(n=>n.classList.toggle('on',n.dataset.t===tab));
    (render[tab]||render.personal)();
    if(isMobile())nav.classList.remove('open');
    body.scrollTop=0;
  }
  win._go=go;
  nav.onclick=e=>{const n=e.target.closest('[data-t]');if(!n)return;if(n.dataset.t==='__close'){win.close();return}go(n.dataset.t)};
  const offM=Bus.on('mounts',()=>{if($('.sn-item.on',nav)?.dataset.t==='storage')render.storage()});
  win.onClose(offM);
  go(params.tab||'personal');
}};
/* ================= 12. v86 虚拟机 ================= */
Apps.vm={name:'虚拟机',icon:'vm',color:'var(--warn)',w:920,h:700,open(win){
  const root=el('div','vm');
  root.innerHTML=`<div class="vm-tools">
    <button class="btn sm primary" data-a="demo">${ic('play',13)} 启动内置演示</button>
    <button class="btn sm" data-a="vfs">${ic('folderOpen',13)} 载入 VFS 镜像</button>
    <button class="btn sm" data-a="upload">${ic('upload',13)} 上传镜像</button>
    <span style="width:1px;height:18px;background:var(--line)"></span>
    <button class="btn sm" data-a="pause">${ic('pause',13)} 暂停</button>
    <button class="btn sm" data-a="restart">${ic('refresh',13)} 重启</button>
    <button class="btn sm" data-a="lock">${ic('mouse',13)} 锁定鼠标</button>
    <button class="btn sm" data-a="cad">${ic('keyboard',13)} Ctrl+Alt+Del</button>
    <button class="btn sm" data-a="full">${ic('full',13)} 全屏</button>
    <span style="flex:1"></span><span class="badge vm-state">未启动</span>
  </div>
  <div class="vm-screen">
    <div class="screen_container" style="display:none"><div style="white-space:pre;font:14px monospace;line-height:14px;color:#aaa"></div><canvas style="display:none"></canvas></div>
    <div class="vm-idle"><h3>x86 虚拟机</h3><p>基于 v86 0.5.319（版本锁定）。可启动内置的原创引导扇区演示，或从虚拟文件系统 / 本地上传 .img / .iso / .bin 镜像。<br>镜像以 ArrayBuffer 方式挂载，绝不请求外部镜像地址。</p><div style="color:var(--faint);font-size:11px">软盘镜像 → fda · 光盘镜像 → cdrom · 其他 → hda</div></div>
  </div>`;
  win.body.appendChild(root);
  const screen=root.querySelector('.vm-screen'),container=root.querySelector('.screen_container'),idle=root.querySelector('.vm-idle');
  const state=root.querySelector('.vm-state');
  let emu=null,paused=false;
  function demoFloppy(){
    const img=new Uint8Array(1474560);
    const code=[0xB8,0x03,0x00,0xCD,0x10,0xBE,0x19,0x7C,0xAC,0x08,0xC0,0x74,0x09,0xB4,0x0E,0xBB,0x07,0x00,0xCD,0x10,0xEB,0xF3,0xF4,0xEB,0xFD];
    img.set(code,0);
    const msg='Furina OS x86 - Le proces des eaux est ouvert.\r\nBonjour depuis le secteur de demarrage !\r\n\r\nThis 512-byte boot sector was generated in your browser.\r\n';
    for(let i=0;i<msg.length;i++)img[25+i]=msg.charCodeAt(i);
    img[25+msg.length]=0;img[510]=0x55;img[511]=0xAA;
    return img;
  }
  async function boot(buffer,kind,name){
    if(emu){try{emu.destroy()}catch(e){}emu=null}
    const v=veil(screen,'加载 v86 引擎…');
    try{
      await loadScript(CDN.v86js);
      const V=window.V86||window.V86Starter;
      if(!V)throw new Error('v86 未能初始化');
      idle.style.display='none';container.style.display='block';
      const cfg={
        wasm_path:CDN.v86wasm,memory_size:64*1024*1024,vga_memory_size:8*1024*1024,
        screen_container:container,bios:{url:CDN.bios},vga_bios:{url:CDN.vgabios},
        autostart:true,acpi:false
      };
      const buf=buffer.buffer?buffer:new Uint8Array(buffer);
      if(kind==='cdrom')cfg.cdrom={buffer:buf};
      else if(kind==='fda')cfg.fda={buffer:buf};
      else cfg.hda={buffer:buf};
      emu=new V(cfg);
      state.textContent='运行中 · '+(name||'镜像');
      emu.add_listener('emulator-ready',()=>{v.remove()});
      setTimeout(()=>v.remove(),6000);
    }catch(e){v.remove();idle.style.display='';container.style.display='none';state.textContent='启动失败';dlg.alert('虚拟机启动失败：'+e.message+'\n请检查网络是否可访问 CDN 资源。','v86')}
  }
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='demo')boot(demoFloppy(),'fda','内置引导演示');
    else if(a==='vfs'){const p=await pickVFSFile('选择镜像文件（.img / .iso / .bin）','/下载');if(!p)return;const t=toast('读取镜像…',{timeout:0});const buf=new Uint8Array(await (await fs.read(p)).arrayBuffer());t.close();const ex=extOf(p);boot(buf,ex==='iso'?'cdrom':(ex==='img'||ex==='fda'||ex==='bin')?'fda':'hda',fs.basename(p))}
    else if(a==='upload'){const inp=el('input');inp.type='file';inp.accept='.img,.iso,.bin,.fda,.ima';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const buf=new Uint8Array(await f.arrayBuffer());const ex=extOf(f.name);boot(buf,ex==='iso'?'cdrom':(ex==='img'||ex==='fda'||ex==='bin'||ex==='ima')?'fda':'hda',f.name)};inp.click()}
    else if(a==='pause'&&emu){paused=!paused;paused?emu.stop():emu.run();b.innerHTML=ic(paused?'play':'pause',13)+(paused?' 继续':' 暂停');state.textContent=paused?'已暂停':'运行中'}
    else if(a==='restart'&&emu){emu.restart();state.textContent='重启中'}
    else if(a==='lock'){if(emu&&emu.lock_mouse)emu.lock_mouse();else container.requestPointerLock&&container.requestPointerLock();toast('鼠标已锁定，按 Esc 释放')}
    else if(a==='cad'&&emu&&emu.keyboard_send_scancodes){emu.keyboard_send_scancodes([0x1D,0x38,0x53,0xD3,0xB8,0x9D])}
    else if(a==='full'){if(document.fullscreenElement)document.exitFullscreen();else screen.requestFullscreen&&screen.requestFullscreen()}
  });
  win.onClose(()=>{if(emu){try{emu.destroy()}catch(e){}emu=null}if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})});
}};
/* ================= 13. 启动 ================= */
window.addEventListener('error',e=>{console.error(e.error||e.message)});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){Menu.closeAll();closeStart();$('#calendar-pop').hidden=true}
  if(e.altKey&&e.key==='F4'&&S.focused){e.preventDefault();S.focused.close()}
});
window.addEventListener('resize',debounce(()=>{renderTaskbar();S.wins.forEach(w=>Bus.emit('winresize',w))},220));
(async function boot(){
  applyTheme();
  try{await fs.init()}
  catch(e){
    console.error(e);
    document.body.innerHTML=`<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b1424;color:#e9f2fc;font-family:sans-serif;padding:24px;text-align:center"><h2 style="color:#e3c27e;letter-spacing:.2em">存储初始化失败</h2><p style="max-width:520px;line-height:1.8;color:#a3b8d4">${esc(e.message)}<br>请使用支持 OPFS 或 IndexedDB 的现代浏览器，并确认未处于禁止存储的隐私模式。</p></div>`;
    return;
  }
  window.fs=fs;window.WM=WM;window.Apps=Apps;window.S=S;
  await applyWallpaper();spawnBubbles();
  Desktop.init();await Desktop.refresh();
  renderTaskbar();
  Mounts.restore();
  if(navigator.storage&&navigator.storage.persisted){try{const p=await navigator.storage.persisted();if(!p&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}}
  Bus.on('wallpaper',()=>{});
  if(!Store.get('furina.greeted',false)){
    Store.set('furina.greeted',true);
    setTimeout(()=>toast('欢迎来到 Furina OS · 单击图标即可打开，右键唤出菜单',{type:'ok',timeout:6000}),700);
  }
})();
