<style>
/* ===================== 设计系统：砚 · Inkstone ===================== */
:root{
  --bg0:#0b0d11; --bg1:#12151b; --bg2:#181c24; --bg3:#20252f; --bg4:#2a303c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --ink:#ece7dc; --ink2:#b8b2a4; --ink3:#7d786d;
  --acc:#e2a13d; --acc2:#f3c56d; --acc-ink:#1a1204;
  --jade:#57b99b; --rose:#e2646e; --sky:#5ea3d9; --plum:#b07fd6;
  --glass:rgba(16,19,25,.78); --win-bg:rgba(18,21,27,.93); --menu-bg:rgba(24,28,36,.96);
  --shadow:0 30px 60px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06);
  --r:14px; --tb-h:54px;
  --font-ui:'Bricolage Grotesque','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-display:'Fraunces','Noto Serif SC','Songti SC','SimSun',serif;
  --font-mono:'Spline Sans Mono','Cascadia Code','JetBrains Mono','Consolas','Noto Sans SC',monospace;
  --cell-w:94px; --cell-h:108px; --font-scale:1;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=light]{
  --bg0:#ebe6da; --bg1:#f6f2e9; --bg2:#fffdf8; --bg3:#ebe5d8; --bg4:#dcd4c3;
  --line:rgba(30,25,15,.08); --line2:rgba(30,25,15,.17);
  --ink:#1e1b16; --ink2:#5b564c; --ink3:#8b857a;
  --glass:rgba(246,242,233,.82); --win-bg:rgba(246,242,233,.95); --menu-bg:rgba(255,253,248,.97);
  --shadow:0 30px 60px -20px rgba(40,30,10,.35), 0 0 0 1px rgba(30,25,15,.08);
}
[data-anim=off] *{ animation:none!important; transition:none!important }
[data-blur=off] .win,[data-blur=off] #taskbar,[data-blur=off] #startmenu,[data-blur=off] .ctx{ backdrop-filter:none!important; background:var(--bg1)!important }

*{ box-sizing:border-box; margin:0; padding:0 }
html,body{ height:100%; overflow:hidden }
body{
  font-family:var(--font-ui); font-size:calc(13.5px * var(--font-scale)); color:var(--ink); background:var(--bg0);
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  line-height:1.45;
}
button,input,select,textarea{ font:inherit; color:inherit }
button{ cursor:pointer }
svg{ display:block }
.hidden{ display:none!important }
::-webkit-scrollbar{ width:10px; height:10px }
::-webkit-scrollbar-thumb{ background:var(--bg4); border-radius:8px; border:2px solid transparent; background-clip:padding-box }
::-webkit-scrollbar-thumb:hover{ background:var(--ink3); background-clip:padding-box; border:2px solid transparent }
::-webkit-scrollbar-track{ background:transparent }
::selection{ background:color-mix(in srgb,var(--acc) 40%,transparent) }

/* ---------- 通用控件 ---------- */
.btn{ padding:7px 14px; border-radius:9px; border:1px solid var(--line2); background:var(--bg3); color:var(--ink); display:inline-flex; align-items:center; gap:6px; transition:background .15s,transform .1s; white-space:nowrap; line-height:1.2 }
.btn:hover{ background:var(--bg4) } .btn:active{ transform:scale(.97) }
.btn.pri{ background:var(--acc); color:var(--acc-ink); border-color:transparent; font-weight:600 } .btn.pri:hover{ background:var(--acc2) }
.btn.danger{ background:var(--rose); color:#fff; border-color:transparent }
.btn.ghost{ background:transparent } .btn.sm{ padding:4px 10px; font-size:12px; border-radius:7px }
.btn svg{ width:16px; height:16px }
.btn:disabled{ opacity:.45; pointer-events:none }
.ibtn{ width:32px; height:32px; display:inline-grid; place-items:center; border-radius:8px; border:0; background:transparent; color:var(--ink2); flex-shrink:0; transition:.15s }
.ibtn svg{ width:18px; height:18px } .ibtn:hover{ background:var(--bg4); color:var(--ink) }
.ibtn.on{ color:var(--acc); background:color-mix(in srgb,var(--acc) 16%,transparent) }
.ibtn:disabled{ opacity:.35; pointer-events:none }
.inp,select.inp{ padding:7px 10px; border-radius:9px; border:1px solid var(--line2); background:var(--bg0); color:var(--ink); outline:none; transition:border .15s; min-width:0 }
.inp:focus{ border-color:var(--acc) } .inp.sm{ padding:4px 8px; font-size:12px; border-radius:7px }
select.inp option{ background:var(--bg1) }
textarea.inp{ resize:vertical; font-family:var(--font-mono) }
.sw{ position:relative; width:38px; height:22px; border-radius:11px; background:var(--bg4); border:1px solid var(--line2); cursor:pointer; transition:.2s; flex-shrink:0; display:inline-block }
.sw::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--ink2); transition:.2s }
.sw.on{ background:var(--acc); border-color:transparent } .sw.on::after{ left:18px; background:var(--acc-ink) }
.tb{ display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap; flex-shrink:0; background:color-mix(in srgb,var(--bg1) 60%,transparent) }
.tb .sep{ width:1px; height:20px; background:var(--line2); margin:0 4px }
.tb .grow{ flex:1 }
.status{ padding:4px 12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink3); display:flex; gap:14px; flex-shrink:0; overflow:hidden; white-space:nowrap; align-items:center; font-family:var(--font-mono) }
.status .grow{ flex:1 }
.kbd{ font-family:var(--font-mono); font-size:11px; color:var(--ink3); border:1px solid var(--line2); border-radius:4px; padding:0 5px; background:var(--bg0) }
.tag{ font-size:10.5px; padding:2px 7px; border-radius:20px; background:var(--bg3); color:var(--ink2); letter-spacing:.04em }
.muted{ color:var(--ink3) }
h1,h2,h3,h4{ font-weight:600 }
.empty-hint{ display:grid; place-items:center; height:100%; color:var(--ink3); text-align:center; padding:20px; gap:8px }
.empty-hint svg{ width:48px; height:48px; opacity:.5 }
.app-ic{ display:inline-grid; place-items:center; border-radius:26%; color:#fff; flex-shrink:0;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 90%,#fff),color-mix(in srgb,var(--c) 68%,#000));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 16px -8px color-mix(in srgb,var(--c) 70%,transparent) }
.app-ic svg{ width:56%; height:56%; stroke-width:1.8 }
.fg{ width:100%; height:100% }

/* ---------- 壁纸与桌面 ---------- */
#wallpaper{ position:fixed; inset:0; background:var(--bg0) center/cover no-repeat; transition:background-image .6s ease; z-index:0 }
#wallpaper::after{ content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 130%,rgba(0,0,0,.45),transparent 60%); pointer-events:none }
[data-theme=light] #wallpaper::after{ background:radial-gradient(ellipse at 50% 130%,rgba(60,40,10,.18),transparent 60%) }
#desktop{ position:fixed; inset:0 0 var(--tb-h) 0; z-index:1; touch-action:none; overflow:hidden }
#icons{ position:absolute; inset:0 }
.dicon{ position:absolute; width:var(--cell-w); height:var(--cell-h); display:flex; flex-direction:column; align-items:center; padding:8px 4px 4px; border-radius:12px; touch-action:none;
  transition:left .38s var(--ease), top .38s var(--ease), background .15s, box-shadow .15s, opacity .2s, transform .2s; cursor:default }
.dicon:hover{ background:rgba(255,255,255,.09) }
.dicon.sel{ background:color-mix(in srgb,var(--acc) 26%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 60%,transparent) }
.dicon.drop-hover{ background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 2px var(--acc) }
.dicon.dragging{ opacity:.35 }
.dicon.vanish{ opacity:0; transform:scale(.8) }
.dicon.reveal{ animation:iconIn .55s var(--ease) both }
.dicon-img{ width:54px; height:54px; display:grid; place-items:center; filter:drop-shadow(0 8px 12px rgba(0,0,0,.5)); flex-shrink:0 }
.dicon-img img{ width:54px; height:54px; object-fit:cover; border-radius:9px; box-shadow:0 0 0 1px rgba(255,255,255,.2) }
.dicon-img .app-ic{ width:50px; height:50px }
.dicon-label{ margin-top:6px; font-size:12px; line-height:1.25; text-align:center; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.6);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; padding:1px 3px; max-width:100% }
[data-theme=light] .dicon-label{ color:#fff }
.dicon-label input,.rename-inp{ width:100%; font-size:12px; padding:2px 4px; border-radius:5px; border:1px solid var(--acc); background:var(--bg1); color:var(--ink); outline:none; text-align:center; user-select:text }
[data-icon=sm] { --cell-w:78px; --cell-h:92px } [data-icon=sm] .dicon-img,[data-icon=sm] .dicon-img img{ width:42px; height:42px } [data-icon=sm] .dicon-img .app-ic{ width:40px; height:40px }
[data-icon=lg] { --cell-w:118px; --cell-h:134px } [data-icon=lg] .dicon-img,[data-icon=lg] .dicon-img img{ width:68px; height:68px } [data-icon=lg] .dicon-img .app-ic{ width:64px; height:64px } [data-icon=lg] .dicon-label{ font-size:13px }
.marquee{ position:absolute; border:1px solid var(--acc); background:color-mix(in srgb,var(--acc) 16%,transparent); pointer-events:none; z-index:50; border-radius:3px }
.touch-ghost{ position:fixed; left:0; top:0; z-index:1500; pointer-events:none; opacity:.9; filter:drop-shadow(0 14px 22px rgba(0,0,0,.55)); background:var(--bg2); border-radius:12px; padding:6px; transform:scale(1.05) }
.touch-ghost .dicon-label{ color:var(--ink); text-shadow:none }

/* ---------- 任务栏 ---------- */
#taskbar{ position:fixed; left:0; right:0; bottom:0; height:var(--tb-h); display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--glass);
  backdrop-filter:blur(22px) saturate(1.3); -webkit-backdrop-filter:blur(22px) saturate(1.3); border-top:1px solid var(--line2); z-index:1000; animation:tbIn .6s var(--ease) both }
#start-btn{ width:42px; height:42px; border-radius:12px; border:0; background:transparent; display:grid; place-items:center; color:var(--acc); transition:.2s; flex-shrink:0 }
#start-btn:hover,#start-btn.on{ background:color-mix(in srgb,var(--acc) 18%,transparent) }
#start-btn svg{ width:26px; height:26px }
#tb-apps{ display:flex; align-items:center; gap:4px; overflow-x:auto; flex:1; min-width:0; height:100%; scrollbar-width:none }
#tb-apps::-webkit-scrollbar{ display:none }
.tb-app{ display:flex; align-items:center; gap:8px; height:38px; padding:0 12px; border-radius:10px; color:var(--ink2); position:relative; max-width:190px; border:0; background:transparent; transition:.15s; flex-shrink:0 }
.tb-app .ic svg{ width:20px; height:20px } .tb-app .lb{ font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tb-app:hover{ background:var(--bg3) } .tb-app.active{ background:var(--bg4); color:var(--ink) }
.tb-app::after{ content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:14px; height:3px; border-radius:2px; background:var(--acc); opacity:.55; transition:.2s }
.tb-app.active::after{ width:26px; opacity:1 } .tb-app.min::after{ width:8px; opacity:.35 }
#tb-tray{ margin-left:auto; display:flex; align-items:center; gap:2px; flex-shrink:0 }
.tray-btn{ width:34px; height:34px; border-radius:9px; border:0; background:transparent; color:var(--ink2); display:grid; place-items:center; transition:.15s; position:relative }
.tray-btn:hover{ background:var(--bg3); color:var(--ink) } .tray-btn svg{ width:18px; height:18px }
#tray-storage .pct{ position:absolute; bottom:1px; right:2px; font-size:8.5px; font-family:var(--font-mono); color:var(--acc) }
#clock{ font-family:var(--font-display); font-size:16px; font-weight:500; text-align:right; line-height:1.05; padding:4px 10px 4px 12px; border-radius:9px; cursor:default; letter-spacing:.01em; font-variant-numeric:tabular-nums }
#clock:hover{ background:var(--bg3) }
#clock small{ display:block; font-family:var(--font-ui); font-size:10.5px; color:var(--ink3); letter-spacing:.08em; margin-top:2px; font-weight:400 }

/* ---------- 开始菜单 ---------- */
#startmenu{ position:fixed; left:10px; bottom:calc(var(--tb-h) + 10px); width:600px; max-width:calc(100vw - 20px); height:540px; max-height:calc(100dvh - var(--tb-h) - 20px);
  background:var(--glass); backdrop-filter:blur(26px) saturate(1.3); -webkit-backdrop-filter:blur(26px) saturate(1.3); border:1px solid var(--line2); border-radius:18px; box-shadow:var(--shadow); z-index:1100;
  display:grid; grid-template-columns:1fr 190px; grid-template-rows:auto 1fr auto; overflow:hidden; transform-origin:bottom left; animation:smIn .28s var(--ease) }
.sm-search{ grid-column:1/-1; padding:14px 16px 6px; display:flex; gap:10px; align-items:center }
.sm-search .inp{ flex:1; background:var(--bg0); padding:9px 12px 9px 36px; border-radius:11px }
.sm-search .wrap{ position:relative; flex:1 } .sm-search .wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink3) }
.sm-apps{ padding:8px 12px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:4px; align-content:start }
.sm-app{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 6px; border-radius:12px; border:0; background:transparent; color:var(--ink); font-size:12px; transition:.15s; animation:fadeUp .4s var(--ease) both }
.sm-app:hover{ background:var(--bg3) } .sm-app .app-ic{ width:46px; height:46px }
.sm-side{ border-left:1px solid var(--line); padding:10px 8px; overflow:auto }
.sm-side h4{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); margin:8px 10px 6px }
.sm-place{ display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border-radius:8px; border:0; background:transparent; color:var(--ink2); font-size:13px; text-align:left; transition:.15s }
.sm-place:hover{ background:var(--bg3); color:var(--ink) } .sm-place svg{ width:17px; height:17px; flex-shrink:0 }
.sm-foot{ grid-column:1/-1; display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--line) }
.sm-foot .brand{ display:flex; align-items:center; gap:10px; flex:1 } .sm-foot .brand b{ font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:.02em }
.sm-foot .brand span{ font-size:11px; color:var(--ink3) }
.sm-empty{ grid-column:1/-1; color:var(--ink3); text-align:center; padding:40px 0 }

/* ---------- 窗口 ---------- */
#windows{ position:fixed; inset:0 0 var(--tb-h) 0; z-index:2; pointer-events:none }
.win{ position:absolute; display:flex; flex-direction:column; background:var(--win-bg); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; min-width:240px; min-height:120px; pointer-events:auto;
  backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2); border:1px solid var(--line2); animation:winIn .3s var(--ease) }
.win.active{ border-color:color-mix(in srgb,var(--acc) 45%,var(--line2)); box-shadow:0 40px 90px -24px rgba(0,0,0,.85), 0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent) }
.win.max{ left:0!important; top:0!important; width:100%!important; height:100%!important; border-radius:0; border-color:transparent }
.win.minimizing{ animation:winMin .24s ease-in forwards } .win.restoring{ animation:winIn .28s var(--ease) } .win.closing{ animation:winOut .18s ease-in forwards }
.win.dragging{ transition:none; opacity:.92 } .win.dragging iframe{ pointer-events:none }
.win-tb{ height:42px; display:flex; align-items:center; gap:10px; padding:0 6px 0 14px; background:color-mix(in srgb,var(--bg1) 55%,transparent); border-bottom:1px solid var(--line); touch-action:none; flex-shrink:0; position:relative }
.win.active .win-tb::before{ content:''; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--acc) 70%,transparent); opacity:.8 }
.win-ic svg{ width:18px; height:18px; color:var(--acc) } .win-ic .app-ic{ width:22px; height:22px; border-radius:6px }
.win-title{ flex:1; font-weight:600; font-size:13px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink2) }
.win.active .win-title{ color:var(--ink) }
.win-ctl{ display:flex; gap:2px }

.win-ctl button svg{ width:15px; height:15px }
.win-ctl button:hover{ background:var(--bg4); color:var(--ink) } .win-ctl button.close:hover{ background:var(--rose); color:#fff }
.win-body{ flex:1; min-height:0; position:relative; display:flex; flex-direction:column; overflow:hidden }
.rs{ position:absolute; z-index:6; touch-action:none }

/* ---------- 右键菜单 ---------- */

.ctx-item.danger:hover{ background:color-mix(in srgb,var(--rose) 24%,transparent) }

.ctx-title{ padding:6px 10px 4px; font-size:11px; color:var(--ink3); letter-spacing:.08em; text-transform:uppercase }

/* ---------- 对话框 / 通知 ---------- */

#dialogs.show{ display:grid }
.dlg{ width:min(460px,calc(100vw - 28px)); max-height:calc(100dvh - 40px); overflow:auto; background:var(--bg1); border:1px solid var(--line2); border-radius:16px; box-shadow:var(--shadow); padding:22px; animation:pop .22s var(--ease); position:absolute }

.dlg .inp{ width:100%; user-select:text; -webkit-user-select:text }
.dlg-btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap }
.dlg-prog{ height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; margin-top:8px } .dlg-prog i{ display:block; height:100%; background:var(--acc); width:0; transition:width .2s }
#toasts{ position:fixed; right:16px; bottom:calc(var(--tb-h) + 16px); z-index:1400; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:min(380px,calc(100vw - 32px)) }
.toast{ pointer-events:auto; display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--bg2); border:1px solid var(--line2); border-left:3px solid var(--acc); border-radius:10px; box-shadow:var(--shadow); animation:toastIn .35s var(--ease); font-size:13px; line-height:1.4; word-break:break-word }
.toast.err{ border-left-color:var(--rose) } .toast.ok{ border-left-color:var(--jade) } .toast.warn{ border-left-color:var(--acc2) }
.toast svg{ width:18px; height:18px; flex-shrink:0 } .toast .btn{ margin-left:auto }
.toast.out{ opacity:0; transform:translateX(20px); transition:.25s }
/* 路径选择器 */
.pk{ display:flex; flex-direction:column; gap:8px; height:380px }
.pk-bar{ display:flex; gap:6px; align-items:center } .pk-bar .path{ flex:1; font-family:var(--font-mono); font-size:12px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:6px 10px; background:var(--bg0); border-radius:8px; border:1px solid var(--line) }

.pk-row{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:13px } .pk-row:hover{ background:var(--bg3) } .pk-row.sel{ background:color-mix(in srgb,var(--acc) 22%,transparent) }

.pk-row .meta{ margin-left:auto; font-size:11px; color:var(--ink3); font-family:var(--font-mono) }

/* ---------- 文件资源管理器 ---------- */
.fx{ display:flex; flex-direction:column; height:100%; position:relative }
.fx-tb{ display:flex; align-items:center; gap:4px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap }
.fx-crumb{ flex:1; min-width:160px; display:flex; align-items:center; gap:1px; height:34px; padding:0 8px; background:var(--bg0); border:1px solid var(--line2); border-radius:9px; overflow:hidden; white-space:nowrap; font-size:12.5px; cursor:text }
.fx-crumb .seg{ padding:4px 7px; border-radius:6px; cursor:pointer; color:var(--ink2); flex-shrink:0; display:flex; align-items:center; gap:4px } .fx-crumb .seg svg{ width:15px; height:15px }
.fx-crumb .seg:hover{ background:var(--bg3); color:var(--ink) } .fx-crumb .seg.last{ color:var(--ink); font-weight:600 }
.fx-crumb .seg.drop-hover{ background:color-mix(in srgb,var(--acc) 30%,transparent) }
.fx-crumb .sepc svg{ width:12px; height:12px; color:var(--ink3) } .fx-crumb input{ flex:1; background:transparent; border:0; outline:none; font-family:var(--font-mono); font-size:12.5px; user-select:text; -webkit-user-select:text }
.fx-search{ position:relative; width:190px } .fx-search .inp{ width:100%; padding-left:30px; height:34px } .fx-search svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink3) }
.fx-main{ flex:1; display:flex; min-height:0; position:relative }
.fx-side{ width:196px; border-right:1px solid var(--line); padding:10px 8px; overflow:auto; flex-shrink:0; background:color-mix(in srgb,var(--bg0) 40%,transparent) }
.fx-side h4{ margin:10px 10px 4px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); font-weight:600 }
.fx-side-item{ display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:8px; cursor:pointer; color:var(--ink2); font-size:13px; position:relative }
.fx-side-item svg{ width:17px; height:17px; flex-shrink:0 } .fx-side-item span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.fx-side-item:hover{ background:var(--bg3); color:var(--ink) } .fx-side-item.cur{ background:color-mix(in srgb,var(--acc) 18%,transparent); color:var(--ink) }
.fx-side-item.drop-hover{ box-shadow:inset 0 0 0 1px var(--acc); background:color-mix(in srgb,var(--acc) 15%,transparent) }
.fx-side-item .ibtn{ width:24px; height:24px; opacity:0 } .fx-side-item:hover .ibtn{ opacity:1 } .fx-side-item .ibtn svg{ width:14px; height:14px }
.fx-content{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; outline:none; --cw:minmax(180px,1fr) 150px 130px 90px }
.fx-head{ display:grid; grid-template-columns:var(--cw); padding:0 10px; border-bottom:1px solid var(--line); font-size:11.5px; color:var(--ink3); flex-shrink:0 }
.fx-head>div{ position:relative; padding:7px 8px; cursor:pointer; white-space:nowrap; overflow:hidden; display:flex; align-items:center; gap:4px; text-overflow:ellipsis }
.fx-head>div:hover{ color:var(--ink) } .fx-head>div.on{ color:var(--acc) } .fx-head>div svg{ width:12px; height:12px }
.fx-head .rz{ position:absolute; right:-5px; top:4px; bottom:4px; width:10px; cursor:col-resize; touch-action:none; z-index:2 }
.fx-head .rz::after{ content:''; position:absolute; left:4px; top:0; bottom:0; width:1px; background:var(--line2) } .fx-head .rz:hover::after,.fx-head .rz.on::after{ background:var(--acc); width:2px }
.fx-head .c-size{ justify-content:flex-end }
.fx-list{ flex:1; overflow:auto; padding:4px 10px 60px; position:relative; min-height:0 }
.fx-row{ display:grid; grid-template-columns:var(--cw); align-items:center; border-radius:8px; font-size:13px; height:36px; cursor:default; touch-action:pan-y }
.fx-row>div{ padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.fx-row:hover{ background:var(--bg3) } .fx-row.sel{ background:color-mix(in srgb,var(--acc) 22%,transparent) } .fx-row.cut{ opacity:.5 }
.fx-row.drop-hover{ box-shadow:inset 0 0 0 1.5px var(--acc); background:color-mix(in srgb,var(--acc) 14%,transparent) }
.fx-row .nm{ display:flex; align-items:center; gap:9px; min-width:0 } .fx-row .nm .ic{ width:22px; height:22px; flex-shrink:0; display:grid; place-items:center }
.fx-row .nm .ic img{ width:22px; height:22px; object-fit:cover; border-radius:4px } .fx-row .nm .ic .app-ic{ width:22px; height:22px; border-radius:6px }
.fx-row .nm .tx{ overflow:hidden; text-overflow:ellipsis; user-select:none } .fx-row .nm .sub{ font-size:11px; color:var(--ink3); margin-left:6px; font-family:var(--font-mono) }
.fx-row .c-date,.fx-row .c-type{ color:var(--ink2); font-size:12px } .fx-row .c-size{ text-align:right; font-family:var(--font-mono); font-size:11.5px; color:var(--ink2) }
.fx-row .chk{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--ink3); display:none; place-items:center; flex-shrink:0 } .fx-row .chk svg{ width:12px; height:12px }
.fx.selmode .fx-row .chk{ display:grid } .fx-row.sel .chk{ background:var(--acc); border-color:var(--acc); color:var(--acc-ink) }
.fx-content.narrow .c-date,.fx-content.narrow .c-type{ display:none } .fx-content.narrow .fx-head,.fx-content.narrow .fx-row{ grid-template-columns:minmax(0,1fr) 84px }
.fx-content.mid .c-type{ display:none } .fx-content.mid .fx-head,.fx-content.mid .fx-row{ grid-template-columns:minmax(0,1fr) 140px 84px }
.fx-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(106px,1fr)); gap:4px; padding:10px; align-content:start }
.fx-tile{ display:flex; flex-direction:column; align-items:center; padding:12px 6px 8px; border-radius:12px; gap:8px; text-align:center; font-size:12px; touch-action:pan-y; position:relative }
.fx-tile:hover{ background:var(--bg3) } .fx-tile.sel{ background:color-mix(in srgb,var(--acc) 22%,transparent) } .fx-tile.drop-hover{ box-shadow:inset 0 0 0 1.5px var(--acc) }
.fx-tile .ic{ width:58px; height:58px; display:grid; place-items:center } .fx-tile .ic img{ width:58px; height:58px; object-fit:cover; border-radius:9px } .fx-tile .ic .app-ic{ width:52px; height:52px }
.fx-tile .tx{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; line-height:1.25; width:100% }
.fx-tile .chk{ position:absolute; top:6px; left:6px; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--ink3); display:none; place-items:center } .fx-tile .chk svg{ width:12px;height:12px }
.fx.selmode .fx-tile .chk{ display:grid } .fx-tile.sel .chk{ background:var(--acc); border-color:var(--acc); color:var(--acc-ink) }
.fx-content.drop-hover::after{ content:''; position:absolute; inset:4px; border:2px dashed var(--acc); border-radius:10px; pointer-events:none; z-index:3 }
.fx-status{ padding:5px 12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink3); display:flex; gap:14px; flex-shrink:0; align-items:center }
.fx-status .grow{ flex:1 }
.fx-empty{ padding:60px 20px; text-align:center; color:var(--ink3) } .fx-empty svg{ width:44px; height:44px; margin:0 auto 10px; opacity:.45 }
.fx-side-toggle{ display:none }

/* ---------- 记事本 / 表格 ---------- */
.np,.sh,.ce,.iv,.mg,.mp,.br,.pt,.ar,.vm,.hx,.fv,.stg,.calc,.pdfv{ display:flex; flex-direction:column; height:100%; min-height:0 }
.np-main{ flex:1; display:flex; min-height:0 }
.np-text{ flex:1; width:100%; height:100%; resize:none; border:0; outline:none; background:transparent; color:var(--ink); font-family:var(--font-mono); font-size:14px; line-height:1.6; padding:14px 18px; tab-size:4; user-select:text; -webkit-user-select:text; white-space:pre-wrap; word-break:break-all }
.np-text.nowrap{ white-space:pre; word-break:normal }
.np-prev{ flex:1; overflow:auto; padding:20px 28px; border-left:1px solid var(--line); user-select:text; -webkit-user-select:text; min-width:0 }
.md{ line-height:1.7; font-size:14px; color:var(--ink) } .md h1,.md h2,.md h3{ font-family:var(--font-display); margin:1.2em 0 .5em; line-height:1.25 } .md h1{ font-size:26px } .md h2{ font-size:21px; border-bottom:1px solid var(--line2); padding-bottom:.25em } .md h3{ font-size:17px }

.md ul,.md ol{ padding-left:1.6em; margin:.5em 0 } .md blockquote{ border-left:3px solid var(--acc); padding:4px 14px; color:var(--ink2); margin:.8em 0; background:color-mix(in srgb,var(--acc) 6%,transparent); border-radius:0 8px 8px 0 }
.md a{ color:var(--sky) } .md hr{ border:0; border-top:1px solid var(--line2); margin:1.4em 0 } .md img{ max-width:100%; border-radius:8px } .md table{ border-collapse:collapse; margin:.8em 0 } .md th,.md td{ border:1px solid var(--line2); padding:6px 10px } .md th{ background:var(--bg3) }
.sh-wrap{ flex:1; overflow:auto; min-height:0; position:relative }

.sh-table th,.sh-table td{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; min-width:90px; max-width:360px; height:30px }
.sh-table th{ background:var(--bg2); color:var(--ink3); font-weight:500; position:sticky; top:0; z-index:2; font-size:11px; text-align:center; padding:0 8px }
.sh-table th.rn,.sh-table td.rn{ min-width:44px; width:44px; text-align:center; color:var(--ink3); background:var(--bg2); position:sticky; left:0; z-index:1; font-size:11px }
.sh-table th.rn{ z-index:3 } .sh-table td div{ padding:5px 8px; outline:none; white-space:pre; overflow:hidden; text-overflow:ellipsis; user-select:text; -webkit-user-select:text; min-height:30px }
.sh-table td div:focus{ box-shadow:inset 0 0 0 2px var(--acc); background:var(--bg0); white-space:pre-wrap } .sh-table tr.hdr td div{ font-weight:700; color:var(--acc2) }
.sh-text{ flex:1; width:100%; resize:none; border:0; outline:none; background:transparent; color:var(--ink); font-family:var(--font-mono); font-size:13px; line-height:1.6; padding:12px 16px; user-select:text; -webkit-user-select:text; white-space:pre }

/* ---------- HTML 编辑器 ---------- */
.ce-tb{ gap:2px } .ce-tb select{ padding:4px 8px } .ce-tb .ibtn{ width:30px; height:30px }
.ce-find{ display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--bg2); flex-wrap:wrap }
.ce-find .inp{ width:200px; padding:5px 9px; font-family:var(--font-mono); font-size:12.5px } .ce-find .cnt{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink3); min-width:54px }
.ce-find .cnt.bad{ color:var(--rose) } .ce-find .tg{ width:28px; height:26px; border-radius:6px; border:1px solid var(--line2); background:transparent; color:var(--ink3); font-family:var(--font-mono); font-size:11px; font-weight:700 }

.ce-split{ flex:1; display:flex; min-height:0; position:relative }

.cm-s-material-darker.CodeMirror{ background:var(--bg0)!important } .cm-s-material-darker .CodeMirror-gutters{ background:var(--bg0)!important; border-right:1px solid var(--line) }
[data-theme=light] .cm-s-material-darker.CodeMirror,[data-theme=light] .cm-s-material-darker .CodeMirror-gutters{ background:#1f2329!important }
.CodeMirror-activeline-background{ background:rgba(255,255,255,.04)!important } .cm-trailingspace{ background:color-mix(in srgb,var(--rose) 35%,transparent); border-radius:2px }
.ce-m{ background:rgba(226,161,61,.28); border-radius:2px } .ce-m-cur{ background:rgba(87,185,155,.55); outline:1px solid var(--jade); border-radius:2px }
.ce-fallback{ flex:1; width:100%; resize:none; border:0; outline:none; background:var(--bg0); color:var(--ink); font-family:var(--font-mono); font-size:13px; line-height:1.55; padding:12px; user-select:text; -webkit-user-select:text; tab-size:2; white-space:pre }
.ce-gutter{ width:6px; cursor:col-resize; background:var(--line); touch-action:none; flex-shrink:0; position:relative; transition:background .15s }
.ce-gutter:hover,.ce-gutter.on{ background:var(--acc) }
.ce-prev{ flex:1; min-width:120px; background:#fff; position:relative; display:flex; flex-direction:column }
.ce-prev iframe{ flex:1; width:100%; height:100%; border:0; background:#fff }
.ce-prev .ce-prev-bar{ height:26px; display:flex; align-items:center; gap:8px; padding:0 10px; font-size:11px; background:var(--bg2); color:var(--ink3); border-bottom:1px solid var(--line); font-family:var(--font-mono) }
.ce-notice{ padding:6px 12px; font-size:12px; background:color-mix(in srgb,var(--acc) 15%,transparent); color:var(--acc2); border-bottom:1px solid var(--line) }
.ce.no-prev .ce-prev,.ce.no-prev .ce-gutter{ display:none } .ce.no-prev .ce-edit{ width:100%!important }

/* ---------- 图片 / 漫画 / 媒体 / PDF ---------- */
.iv-stage{ flex:1; position:relative; overflow:hidden; background:radial-gradient(ellipse at center,#1a1d24,#0a0b0e); touch-action:none; cursor:grab; display:grid; place-items:center }
.iv-stage:active{ cursor:grabbing } .iv-stage img{ max-width:none; transform-origin:center; will-change:transform; user-select:none; -webkit-user-drag:none; box-shadow:0 30px 60px -20px rgba(0,0,0,.8) }

.iv-nav{ position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:0; background:rgba(0,0,0,.35); color:#fff; display:grid; place-items:center; opacity:0; transition:.2s; backdrop-filter:blur(6px) }
.iv-nav svg{ width:22px; height:22px } .iv-stage:hover .iv-nav{ opacity:1 } .iv-nav.l{ left:0; border-radius:0 12px 12px 0 } .iv-nav.r{ right:0; border-radius:12px 0 0 12px }
.iv-tb .zoom{ font-family:var(--font-mono); font-size:12px; min-width:52px; text-align:center; color:var(--ink2) }
.mg-scroll{ flex:1; overflow:auto; background:#000; position:relative; overscroll-behavior:contain }

.mg-col img.cur-target{ outline:none }

<script>

'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const natCmp=new Intl.Collator(['zh','en'],{numeric:true,sensitivity:'base'}).compare;
const isTouch=matchMedia('(pointer:coarse)').matches;

/* ---------------- 存储后端 ---------------- */
const ENOENT=p=>Object.assign(new Error(`路径不存在: ${p}`),{code:'ENOENT'});
const segsOf=p=>String(p||'').split('/').filter(Boolean);

/** OPFS 后端（同时作为 File System Access 本地目录后端的基类） */

    else { be.canWrite=false; await be._workerWrite('.__probe',new TextEncoder().encode('ok').buffer); }

  async _dir(segs,create=false){ let d=this.root; for(const s of segs){ try{ d=await d.getDirectoryHandle(s,{create}); }catch(e){ if(e.name==='NotFoundError') throw ENOENT('/'+segs.join('/')); if(e.name==='TypeMismatchError') throw new Error('不是文件夹: '+s); throw e; } } return d; }

  async readdir(p){ const d=await this._dir(segsOf(p)); const out=[]; for await (const [name,hd] of d.entries()){ if(hd.kind==='file'){ let size=0,mtime=0,type=''; try{ const f=await hd.getFile(); size=f.size; mtime=f.lastModified; type=f.type; }catch{} out.push({name,kind:'file',size,mtime,type}); } else out.push({name,kind:'dir',size:0,mtime:0}); } return out; }
  async stat(p){ const s=segsOf(p); if(!s.length) return {name:'',kind:'dir',size:0,mtime:0}; const parent=await this._dir(s.slice(0,-1)); const name=s[s.length-1];

    catch(e){ if(e.name==='TypeMismatchError'){ await parent.getDirectoryHandle(name); return {name,kind:'dir',size:0,mtime:0}; } if(e.name==='NotFoundError') throw ENOENT(p); throw e; } }

  async readFile(p){ const fh=await this._fh(segsOf(p)); return fh.getFile(); }
  async writeFile(p,data){ const segs=segsOf(p); const fh=await this._fh(segs,true);

  _workerWrite(path,buf){ if(!this.worker){ const src="self.onmessage=async e=>{const{id,path,buf}=e.data;try{let d=await navigator.storage.getDirectory();const s=path.split('/').filter(Boolean);for(let i=0;i<s.length-1;i++)d=await d.getDirectoryHandle(s[i],{create:true});const fh=await d.getFileHandle(s[s.length-1],{create:true});const ah=await fh.createSyncAccessHandle();ah.truncate(0);ah.write(new Uint8Array(buf),{at:0});ah.flush();ah.close();self.postMessage({id,ok:true})}catch(err){self.postMessage({id,ok:false,error:String(err&&err.message||err)})}}";

}
/** File System Access API 本地目录后端：与 OPFS 后端接口完全一致 */
class LocalBackend extends OPFSBackend{ constructor(handle){ super(handle,'本地文件夹 · '+handle.name); this.handle=handle; } async writeFile(p,data){ const fh=await this._fh(segsOf(p),true); if(typeof fh.createWritable!=='function') throw new Error('此浏览器不支持写入本地文件'); const w=await fh.createWritable(); await w.write(data instanceof Blob||typeof data==='string'?data:new Uint8Array(await toBuffer(data))); await w.close(); } }
/** IndexedDB 后端（OPFS 不可用时的降级） */
class IDBBackend{
  constructor(db){ this.db=db; this.label='IndexedDB'; }
  static create(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no idb')); const rq=indexedDB.open('inkstone-fs',1); rq.onupgradeneeded=()=>{ const st=rq.result.createObjectStore('files',{keyPath:'path'}); st.createIndex('parent','parent'); }; rq.onsuccess=()=>res(new IDBBackend(rq.result)); rq.onerror=()=>rej(rq.error); rq.onblocked=()=>rej(new Error('IndexedDB 被占用')); }); }
  _st(mode='readonly'){ return this.db.transaction('files',mode).objectStore('files'); }
  _rq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  _done(st){ return new Promise((res,rej)=>{ st.transaction.oncomplete=res; st.transaction.onerror=()=>rej(st.transaction.error); st.transaction.onabort=()=>rej(st.transaction.error||new Error('abort')); }); }
  _key(p){ return segsOf(p).join('/'); } _parent(k){ const i=k.lastIndexOf('/'); return i<0?'':k.slice(0,i); }
  _get(k){ return this._rq(this._st().get(k)); }
  _row(r){ return {name:r.name,kind:r.kind,size:r.size||0,mtime:r.mtime||0,type:r.type||''}; }
  async readdir(p){ const k=this._key(p); if(k){ const d=await this._get(k); if(!d) throw ENOENT(p); if(d.kind!=='dir') throw new Error('不是文件夹'); } const rows=await this._rq(this._st().index('parent').getAll(k)); return rows.map(r=>this._row(r)); }
  async stat(p){ const k=this._key(p); if(!k) return {name:'',kind:'dir',size:0,mtime:0}; const r=await this._get(k); if(!r) throw ENOENT(p); return this._row(r); }
  async _ensureDirs(k){ const segs=k.split('/').filter(Boolean); let cur=''; for(const s of segs){ const next=cur?cur+'/'+s:s; const ex=await this._get(next); if(!ex){ const st=this._st('readwrite'); st.put({path:next,parent:cur,name:s,kind:'dir',size:0,mtime:Date.now()}); await this._done(st); } else if(ex.kind!=='dir') throw new Error('路径被文件占用: '+next); cur=next; } }
  async mkdir(p){ await this._ensureDirs(this._key(p)); }
  async readFile(p){ const r=await this._get(this._key(p)); if(!r) throw ENOENT(p); if(r.kind!=='file') throw new Error('目标是文件夹'); return new File([r.data],r.name,{type:r.type||'',lastModified:r.mtime}); }
  async writeFile(p,data){ const k=this._key(p); await this._ensureDirs(this._parent(k)); const buf=await toBuffer(data); const st=this._st('readwrite'); st.put({path:k,parent:this._parent(k),name:k.slice(k.lastIndexOf('/')+1),kind:'file',size:buf.byteLength,mtime:Date.now(),type:data instanceof Blob?data.type:'',data:buf}); await this._done(st); }
  async unlink(p){ const k=this._key(p); if(!(await this._get(k))) throw ENOENT(p); const st=this._st('readwrite'); st.delete(k); await this._done(st); }
  _keysUnder(k){ return this._rq(this._st().getAllKeys(IDBKeyRange.bound(k+'/',k+'/\uffff'))); }
  async rmdir(p,recursive=true){ const k=this._key(p); const keys=k?await this._keysUnder(k):await this._rq(this._st().getAllKeys()); if(!recursive&&keys.length) throw new Error('文件夹非空'); const st=this._st('readwrite'); for(const key of keys) st.delete(key); if(k) st.delete(k); await this._done(st); }
  async rename(a,b){ const ka=this._key(a),kb=this._key(b); const r=await this._get(ka); if(!r) throw ENOENT(a); await this._ensureDirs(this._parent(kb)); const rows=[r]; if(r.kind==='dir') rows.push(...await this._rq(this._st().getAll(IDBKeyRange.bound(ka+'/',ka+'/\uffff')))); const st=this._st('readwrite'); for(const row of rows){ const np=kb+row.path.slice(ka.length); st.delete(row.path); st.put({...row,path:np,parent:this._parent(np),name:np.slice(np.lastIndexOf('/')+1)}); } await this._done(st); }
}
/** 内存后端（最终降级；文本小文件借助 localStorage 尽力保留） */
class MemBackend{
  constructor(){ this.map=new Map(); this.label='内存（会话级，localStorage 备份）'; try{ const saved=JSON.parse(localStorage.getItem('inkstone.memfs')||'null'); if(saved) for(const [k,v] of saved) this.map.set(k,{...v,data:v.data!=null?new TextEncoder().encode(v.data).buffer:new ArrayBuffer(0)}); }catch{} this.persist=debounce(()=>this._persist(),600); }
  _persist(){ try{ const out=[]; let total=0; for(const [k,v] of this.map){ if(v.kind==='dir'){ out.push([k,{...v,data:undefined}]); continue; } if(v.size>150000) continue; total+=v.size; if(total>2.5e6) break; let text; try{ text=new TextDecoder('utf-8',{fatal:true}).decode(v.data); }catch{ continue; } out.push([k,{...v,data:text}]); } localStorage.setItem('inkstone.memfs',JSON.stringify(out)); }catch{} }
  _key(p){ return segsOf(p).join('/'); } _parent(k){ const i=k.lastIndexOf('/'); return i<0?'':k.slice(0,i); }
  _row(r){ return {name:r.name,kind:r.kind,size:r.size||0,mtime:r.mtime||0,type:r.type||''}; }
  async readdir(p){ const k=this._key(p); if(k&&!this.map.has(k)) throw ENOENT(p); const out=[]; for(const [key,v] of this.map) if(this._parent(key)===k&&key!==k) out.push(this._row(v)); return out; }
  async stat(p){ const k=this._key(p); if(!k) return {name:'',kind:'dir',size:0,mtime:0}; const r=this.map.get(k); if(!r) throw ENOENT(p); return this._row(r); }
  async mkdir(p){ const segs=segsOf(p); let cur=''; for(const s of segs){ cur=cur?cur+'/'+s:s; if(!this.map.has(cur)) this.map.set(cur,{name:s,kind:'dir',size:0,mtime:Date.now()}); } this.persist(); }
  async readFile(p){ const r=this.map.get(this._key(p)); if(!r) throw ENOENT(p); return new File([r.data],r.name,{type:r.type||'',lastModified:r.mtime}); }
  async writeFile(p,data){ const k=this._key(p); await this.mkdir(this._parent(k)); const buf=await toBuffer(data); this.map.set(k,{name:k.slice(k.lastIndexOf('/')+1),kind:'file',size:buf.byteLength,mtime:Date.now(),type:data instanceof Blob?data.type:'',data:buf}); this.persist(); }
  async unlink(p){ const k=this._key(p); if(!this.map.delete(k)) throw ENOENT(p); this.persist(); }
  async rmdir(p){ const k=this._key(p); for(const key of [...this.map.keys()]) if(!k||key===k||key.startsWith(k+'/')) this.map.delete(key); this.persist(); }
  async rename(a,b){ const ka=this._key(a),kb=this._key(b); if(!this.map.has(ka)) throw ENOENT(a); await this.mkdir(this._parent(kb)); for(const key of [...this.map.keys()]) if(key===ka||key.startsWith(ka+'/')){ const v=this.map.get(key); this.map.delete(key); const np=kb+key.slice(ka.length); this.map.set(np,{...v,name:np.slice(np.lastIndexOf('/')+1)}); } this.persist(); }
}

/* ---------------- 统一虚拟文件系统 (VFS) + fs 模块 ---------------- */
const VFS={ root:null, mounts:[], em:new Emitter(), backendName:'',
  resolve(path){ const p=P.norm(path); for(const m of this.mounts){ if(p===m.path||p.startsWith(m.path+'/')) return {be:m.backend,rel:p.slice(m.path.length),mount:m}; } return {be:this.root,rel:p,mount:null}; },
  async init(){ const tried=[]; for(const [name,mk] of [['OPFS',()=>OPFSBackend.create()],['IndexedDB',()=>IDBBackend.create()],['Memory',async()=>new MemBackend()]]){ try{ this.root=await mk(); this.backendName=name; break; }catch(e){ tried.push(name+': '+(e&&e.message||e)); } } if(!this.root) throw new Error('无可用存储后端\n'+tried.join('\n')); this.fallbackLog=tried; },
  mount(handle){ const base=handle.name||'folder'; let name=base,i=2; while(this.mounts.some(m=>m.name===name)) name=`${base} (${i++})`; const m={name,path:'/mnt/local/'+name,backend:new LocalBackend(handle),handle}; this.mounts.push(m); this.mounts.sort((a,b)=>b.path.length-a.path.length); this.em.emit('change','/mnt/local'); this.em.emit('mounts'); return m; },
  unmount(path){ const i=this.mounts.findIndex(m=>m.path===path); if(i<0) return; this.mounts.splice(i,1); this.em.emit('change','/mnt/local'); this.em.emit('mounts'); }
};
/** 参数签名兼容：无论传入多少参数，末尾若为函数即视为 callback，同时始终返回 Promise */
function withCb(fn){ return function(...args){ let cb=null; if(typeof args[args.length-1]==='function') cb=args.pop(); const pr=(async()=>fn(...args))(); if(cb) pr.then(r=>cb(null,r),e=>cb(e)); return pr; }; }
const fs={
  on:(ev,fn)=>VFS.em.on(ev,fn), off:(ev,fn)=>VFS.em.off(ev,fn),
  emit(dir){ VFS.em.emit('change',P.norm(dir)); },

  move:withCb(async(a,b)=>{ a=P.norm(a); b=P.norm(b); if(a===b) return; if(P.isInside(b,a)) throw new Error('不能移动到自身内部'); if(VFS.mounts.some(m=>m.path===a)) throw new Error('挂载点不能移动'); const ra=VFS.resolve(a),rb=VFS.resolve(b);

/* ---------------- 文件操作（桌面与资源管理器共用） ---------------- */
const FileOps={
  async newFolder(dir,view){ try{ const name=await fs.uniqueName(dir,'新建文件夹'); await fs.mkdir(P.join(dir,name)); view&&view.renameLater&&view.renameLater(name); }catch(e){ UI.toast('创建失败: '+e.message,'err'); } },
  async newFile(dir,base,content='',view){ try{ const name=await fs.uniqueName(dir,base); await fs.writeFile(P.join(dir,name),content); view&&view.renameLater&&view.renameLater(name); return name; }catch(e){ UI.toast('创建失败: '+e.message,'err'); } },
  async addShortcut(app,dir='/Desktop'){ const a=APPS[app]; if(!a) return; try{ const name=await fs.uniqueName(dir,a.name+'.app'); await fs.writeFile(P.join(dir,name),JSON.stringify({app})); UI.toast(`已添加 ${a.name} 到桌面`,'ok'); }catch(e){ UI.toast(e.message,'err'); } },
  async rename(path,newName){ newName=(newName||'').trim(); if(!newName||newName===P.base(path)) return false; if(/[\/\\:*?"<>|]/.test(newName)){ UI.toast('名称不能包含 / \\ : * ? " < > |','err'); return false; } const dest=P.join(P.dir(path),newName); if(await fs.exists(dest)){ UI.toast('已存在同名项目','err'); return false; } try{ await fs.move(path,dest); return true; }catch(e){ UI.toast('重命名失败: '+e.message,'err'); return false; } },
  async renamePrompt(path){ const n=await UI.prompt('新名称',P.base(path),'重命名',{selectStem:true}); if(n!=null) await this.rename(path,n); },
  async del(paths){ if(!paths.length) return; const mounts=paths.filter(p=>VFS.mounts.some(m=>m.path===p)); if(mounts.length){ for(const p of mounts) await Mounts.unmount(p); paths=paths.filter(p=>!mounts.includes(p)); if(!paths.length) return; }
    if(Settings.get('confirmDelete')){ const ok=await UI.confirm(paths.length===1?`确定删除“${P.base(paths[0])}”吗？此操作不可撤销。`:`确定删除这 ${paths.length} 个项目吗？此操作不可撤销。`,'删除',{danger:true,okText:'删除'}); if(!ok) return; }
    let n=0; for(const p of paths){ try{ await fs.remove(p); n++; }catch(e){ UI.toast(`删除失败: ${P.base(p)} — ${e.message}`,'err'); } } if(n) UI.toast(`已删除 ${n} 个项目`,'ok',{timeout:1800}); },

  async download(paths){ if(paths.length===1){ const p=paths[0]; try{ const s=await fs.stat(p); if(s.kind==='file'){ downloadBlob(await fs.readBlob(p),P.base(p)); return; } }catch(e){ UI.toast(e.message,'err'); return; } } const prog=UI.progress('正在打包…'); try{ const blob=await Archive.zipPaths(paths,prog); downloadBlob(blob,(paths.length===1?P.base(paths[0]):'归档')+'.zip'); }catch(e){ UI.toast('打包失败: '+e.message,'err'); } prog.close(); },

  async importEntry(entry,dir,tick){ if(entry.isFile){ const file=await new Promise((res,rej)=>entry.file(res,rej)); const buf=await file.arrayBuffer(); await fs.writeFile(P.join(dir,await fs.uniqueName(dir,entry.name)),new Blob([buf],{type:file.type})); tick&&tick(entry.name); return; }

  async compress(paths,dir){ const def=(paths.length===1?P.stem(P.base(paths[0])):'归档')+'.zip'; const name=await UI.prompt('压缩包名称',def,'压缩为 ZIP',{selectStem:true}); if(!name) return; const prog=UI.progress('正在压缩…'); try{ const blob=await Archive.zipPaths(paths,prog); const fn=await fs.uniqueName(dir,/\.zip$/i.test(name)?name:name+'.zip'); await fs.writeFile(P.join(dir,fn),blob); UI.toast(`已创建 ${fn}`,'ok'); }catch(e){ UI.toast('压缩失败: '+e.message,'err'); } prog.close(); },
  async properties(paths){ try{ if(paths.length>1){ let total=0,files=0,dirs=0; for(const p of paths){ const s=await fs.stat(p); if(s.kind==='dir'){ const d=await fs.du(p); total+=d.total; files+=d.files; dirs+=d.dirs+1; } else { total+=s.size; files++; } } return UI.dialog({title:`${paths.length} 个项目`,body:`<p>文件: ${files}<br>文件夹: ${dirs}<br>总大小: ${fmtSize(total)}</p>`}); }
    const p=paths[0]; const s=await fs.stat(p); const info=FT.info(P.base(p)); let extra=''; if(s.kind==='dir'){ const d=await fs.du(p); extra=`<br>包含: ${d.files} 个文件, ${d.dirs} 个文件夹<br>大小: ${fmtSize(d.total)}`; } else extra=`<br>大小: ${fmtSize(s.size)} (${s.size.toLocaleString()} 字节)<br>MIME: ${esc(info.mime)}`; const {mount}=VFS.resolve(p);
    UI.dialog({title:P.base(p)||'/',body:`<p style="font-family:var(--font-mono);font-size:12px;line-height:1.9">路径: ${esc(p)}<br>类型: ${s.kind==='dir'?(s.mount?'本地挂载文件夹':'文件夹'):esc(info.label)}${extra}<br>修改时间: ${fmtDate(s.mtime)}<br>存储后端: ${esc(mount?mount.backend.label:VFS.root.label)}</p>`}); }catch(e){ UI.toast(e.message,'err'); } },
  showItemMenu(x,y,paths,ctx){ CTX.show(x,y,this.itemMenu(paths,ctx)); }, showBgMenu(x,y,dir,ctx){ CTX.show(x,y,this.bgMenu(dir,ctx)); },
  itemMenu(paths,ctx={}){ const single=paths.length===1,p=paths[0]; const kind=ctx.kindOf?ctx.kindOf(p):null; const isDir=kind==='dir'; const info=single&&!isDir?FT.info(P.base(p)):null; const isMount=single&&VFS.mounts.some(m=>m.path===p); const items=[];
    if(single){ items.push({label:'打开',icon:isDir?'folder':'external',kbd:'Enter',action:()=>openPath(p,{explorer:ctx.explorer})});
      if(!isDir){ items.push({label:'打开方式',icon:'apps',children:appsFor(info).map(a=>({label:a.label,icon:APPS[a.id].icon,action:()=>openWith(p,a.id)}))});
        if(info.kind==='html') items.push({label:'在浏览器中打开',icon:'globe',action:()=>openWith(p,'browser')},{label:'编辑源代码',icon:'code',action:()=>openWith(p,'editor')});
        if(info.kind==='image') items.push({label:'条漫模式阅读',icon:'book',action:()=>openWith(p,'manga')},{label:'设为桌面壁纸',icon:'wallpaper',action:()=>Settings.set('wallpaper',{path:p})});
        if(info.kind==='archive') items.push({label:'解压到当前文件夹',icon:'archive',action:()=>Archive.extractTo(p,P.dir(p))},{label:`解压到“${Archive.folderNameFor(p)}”`,icon:'archive',action:()=>Archive.extractTo(p,null)});
        if(info.kind==='disk') items.push({label:'在虚拟机中启动',icon:'vm',action:()=>openWith(p,'vm')}); }
      else items.push({label:'在新窗口打开',icon:'external',action:()=>launchApp('explorer',{path:p})}); items.push({sep:true}); }
    if(isMount){ items.push({label:'卸载此本地文件夹',icon:'unmount',danger:true,action:()=>Mounts.unmount(p)},{sep:true},{label:'属性',icon:'info',action:()=>this.properties(paths)}); return items; }
    items.push({label:'压缩为 ZIP',icon:'archive',action:()=>this.compress(paths,P.dir(p))},{label:single&&!isDir?'下载 / 导出到本机':'下载为 ZIP',icon:'download',action:()=>this.download(paths)},{sep:true},{label:'剪切',icon:'cut',kbd:'Ctrl+X',action:()=>this.cut(paths)},{label:'复制',icon:'copy',kbd:'Ctrl+C',action:()=>this.copy(paths)});
    if(single&&isDir&&CLIP.has()) items.push({label:'粘贴到此文件夹',icon:'paste',action:()=>this.paste(p)});
    if(single) items.push({label:'重命名',icon:'rename',kbd:'F2',action:()=>ctx.view&&ctx.view.startRename?ctx.view.startRename(P.base(p)):this.renamePrompt(p)});
    items.push({label:'删除',icon:'trash',kbd:'Del',danger:true,action:()=>this.del(paths)},{sep:true},{label:'属性',icon:'info',action:()=>this.properties(paths)}); return items; },
  bgMenu(dir,ctx={}){ const v=ctx.view; const items=[{label:'刷新',icon:'refresh',kbd:'F5',action:()=>v&&v.refresh&&v.refresh()},
    {label:'新建',icon:'plus',children:[{label:'文件夹',icon:'folderPlus',action:()=>this.newFolder(dir,v)},{label:'文本文档',icon:'notepad',action:()=>this.newFile(dir,'新建文本文档.txt','',v)},{label:'HTML 文档',icon:'html',action:()=>this.newFile(dir,'新建页面.html',HTML_TEMPLATE,v)},{label:'Markdown 文档',icon:'markdown',action:()=>this.newFile(dir,'新建文档.md','# 标题\n\n正文…\n',v)},{label:'CSV 表格',icon:'sheets',action:()=>this.newFile(dir,'新建表格.csv','列1,列2,列3\n,,\n,,\n',v)},{label:'JSON 文件',icon:'json',action:()=>this.newFile(dir,'新建数据.json','{\n  "name": "inkstone"\n}\n',v)},{label:'画板图像…',icon:'paint',action:()=>launchApp('paint',{saveDir:dir})}]},
    {label:'上传文件',icon:'upload',action:()=>this.upload(dir)},{label:'上传文件夹',icon:'folderPlus',action:()=>this.upload(dir,{directory:true})},{label:'粘贴',icon:'paste',kbd:'Ctrl+V',disabled:!CLIP.has(),action:()=>this.paste(dir)},{label:'全选',icon:'select',kbd:'Ctrl+A',action:()=>v&&v.selectAll&&v.selectAll()}];
    if(ctx.desktop) items.push({sep:true},{label:'排列图标',icon:'grid',action:()=>Desktop.arrange()},{label:'图标大小',icon:'fit',children:[['sm','小'],['md','中'],['lg','大']].map(([k,l])=>({label:l+(Settings.get('iconSize')===k?' ✓':''),action:()=>Settings.set('iconSize',k)}))},{label:'更换壁纸',icon:'wallpaper',children:[{label:'从本机上传图片…',icon:'upload',action:()=>Wallpaper.pickAndSet()},{sep:true},...WALLS.map(w=>({label:w.name,icon:'image',action:()=>Settings.set('wallpaper',{id:w.id})}))]},{label:document.fullscreenElement?'退出全屏':'全屏模式',icon:document.fullscreenElement?'exitFs':'fullscreen',action:()=>toggleFullscreen()},{label:'个性化 / 设置',icon:'settings',action:()=>launchApp('settings')});
    else { items.push({sep:true},{label:'在新窗口打开',icon:'external',action:()=>launchApp('explorer',{path:dir})}); if(dir==='/mnt/local'||dir==='/mnt') items.push({label:'挂载本地文件夹…',icon:'mount',action:()=>Mounts.mountNew()}); }
    return items; } };
function copyName(base){ const ext=P.ext(base); const stem=ext?base.slice(0,-(ext.length+1)):base; return `${stem} - 副本${ext?'.'+ext:''}`; }

/* ---------------- 本地文件夹挂载管理（File System Access API） ---------------- */
const Meta={ db:null, open(){ return new Promise((res,rej)=>{ if(this.db) return res(this.db); if(!window.indexedDB) return rej(new Error('no idb')); const rq=indexedDB.open('inkstone-meta',1); rq.onupgradeneeded=()=>rq.result.createObjectStore('kv'); rq.onsuccess=()=>{ this.db=rq.result; res(this.db); }; rq.onerror=()=>rej(rq.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async del(k){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async entries(){ const db=await this.open(); return new Promise((res,rej)=>{ const out=[]; const r=db.transaction('kv').objectStore('kv').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out.push([c.key,c.value]); c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); } };
const Mounts={
  supported(){ return typeof window.showDirectoryPicker==='function'; },
  async mountNew(){ if(!this.supported()){ UI.alert('当前浏览器不支持 File System Access API（需要桌面版 Chrome / Edge，且页面需在 https 或 localhost 下）。','无法挂载本地文件夹'); return; } let handle; try{ handle=await showDirectoryPicker({mode:'readwrite'}); }catch(e){ if(e.name!=='AbortError') UI.toast('挂载失败: '+e.message,'err'); return; }
    for(const m of VFS.mounts){ try{ if(await m.handle.isSameEntry(handle)){ UI.toast('该文件夹已挂载','warn'); launchApp('explorer',{path:m.path}); return; } }catch{} }
    const m=VFS.mount(handle); try{ await Meta.set('mount:'+uid(),{name:handle.name,handle,added:Date.now()}); }catch{} UI.toast(`已挂载“${handle.name}”到 ${m.path}`,'ok'); launchApp('explorer',{path:m.path}); },
  async unmount(path){ const m=VFS.mounts.find(x=>x.path===path); if(!m) return; const forget=await UI.confirm(`卸载“${m.name}”后将不再显示在 /mnt/local 中。是否同时忘记该文件夹（下次启动不再提示重新挂载）？`,'卸载本地文件夹',{okText:'卸载并忘记',cancelText:'仅卸载'}); VFS.unmount(path); if(forget){ for(const r of await this.remembered()){ try{ if(await r.handle.isSameEntry(m.handle)) await Meta.del(r.key); }catch{} } } for(const w of WM.byApp('explorer')) if(w.explorer&&P.isInside(w.explorer.cwd(),path)) w.explorer.navigate('/mnt/local'); UI.toast('已卸载','ok'); },
  async remembered(){ try{ return (await Meta.entries()).filter(([k])=>k.startsWith('mount:')).map(([k,v])=>({key:k,...v})); }catch{ return []; } },
  async forget(key){ try{ await Meta.del(key); }catch{} VFS.em.emit('mounts'); },
  async remount(rec){ try{ let perm=await rec.handle.queryPermission({mode:'readwrite'}); if(perm!=='granted') perm=await rec.handle.requestPermission({mode:'readwrite'}); if(perm!=='granted'){ UI.toast(`未授予“${rec.name}”的访问权限`,'warn'); return false; } for(const m of VFS.mounts){ if(await m.handle.isSameEntry(rec.handle)) return true; } VFS.mount(rec.handle); return true; }catch(e){ UI.toast(`重新挂载“${rec.name}”失败: ${e.message}`,'err'); return false; } },
  async bootPrompt(){ if(!this.supported()) return; const recs=await this.remembered(); if(!recs.length) return; const pending=[]; for(const r of recs){ try{ if((await r.handle.queryPermission({mode:'readwrite'}))==='granted'){ let dup=false; for(const m of VFS.mounts) if(await m.handle.isSameEntry(r.handle)) dup=true; if(!dup) VFS.mount(r.handle); } else pending.push(r); }catch{ pending.push(r); } }
    if(pending.length&&Settings.get('autoMountPrompt')) UI.toast(`检测到 ${pending.length} 个之前挂载的本地文件夹（${pending.map(r=>r.name).join('、')}），刷新后需重新授权`,'info',{timeout:20000,action:{label:'重新挂载',fn:async()=>{ let n=0; for(const r of pending) if(await this.remount(r)) n++; if(n) UI.toast(`已重新挂载 ${n} 个文件夹`,'ok'); }}}); } };

/* ---------------- 打开分派（先 stat 判断目录/文件，统一生效） ---------------- */
async function openPath(path,opts={}){ let s; try{ s=await fs.stat(path); }catch(e){ UI.toast('无法打开: '+e.message,'err'); return; } if(s.kind==='dir'){ if(opts.explorer) opts.explorer.navigate(path); else launchApp('explorer',{path}); return; } const info=FT.info(P.base(path)); if(info.kind==='app'){ try{ const o=JSON.parse(await fs.readText(path)); if(APPS[o.app]) return launchApp(o.app,o.opts||{}); }catch{} } openWith(path,defaultAppFor(info),{size:s.size}); }
function defaultAppFor(info){ switch(info.kind){ case 'image': return Settings.get('imageDefault')==='manga'?'manga':'imageviewer'; case 'audio': case 'video': return 'media'; case 'html': return Settings.get('htmlDefault')==='browser'?'browser':'editor'; case 'csv': return 'sheets'; case 'pdf': return 'pdf'; case 'archive': return 'archive'; case 'font': return 'fontview'; case 'disk': return 'vm'; case 'markdown': return Settings.get('mdDefault'); case 'code': case 'json': return Settings.get('textDefault'); case 'text': return 'notepad'; default: return 'notepad'; } }
function appsFor(info){ const list=[]; const add=(id,label)=>{ if(APPS[id]&&!list.some(x=>x.id===id)) list.push({id,label:label||APPS[id].name}); }; const k=info.kind;
  if(k==='image'){ add('imageviewer'); add('manga','漫画阅读器（条漫模式）'); add('paint','画板（编辑图像）'); add('browser'); if(info.ext==='svg'){ add('editor','HTML编辑器（SVG 源码）'); add('notepad'); } }
  else if(k==='audio'||k==='video'){ add('media'); add('browser'); }
  else if(k==='html'){ add('editor','HTML编辑器（编辑源代码 + 实时预览）'); add('browser','浏览器（渲染页面）'); }
  else if(k==='csv'){ add('sheets'); add('editor'); }
  else if(k==='pdf'){ add('pdf'); add('browser'); }
  else if(k==='archive') add('archive'); else if(k==='font') add('fontview'); else if(k==='disk') add('vm');
  else if(k==='markdown'||k==='json'||k==='code'||k==='text'){ add('notepad'); add('editor'); if(k==='markdown'||k==='json'||k==='text') add('browser'); }
  add('notepad','记事本（以纯文本打开）'); add('hex','十六进制查看器'); return list; }
function openWith(path,app,extra={}){ return launchApp(app,{path,...extra}); }
function launchApp(id,opts={}){ const a=APPS[id]; if(!a){ UI.toast('未知应用: '+id,'err'); return; } if(a.single){ const ex=WM.byApp(id)[0]; if(ex){ WM.focus(ex); if(opts.path&&ex.openFile) ex.openFile(opts.path); return ex; } } try{ return a.launch(opts||{}); }catch(e){ console.error(e); UI.toast(`启动 ${a.name} 失败: ${e.message}`,'err'); } }
</script>
<script>
/* =====================================================================
   应用：文件资源管理器

function sortItems(items,key,dir){ const rank=it=>it.kind==='dir'?0:1; return [...items].sort((a,b)=>{ const r0=rank(a)-rank(b); if(r0) return r0; let r=0; if(key==='name') r=natCmp(a.name,b.name); else if(key==='mtime') r=(a.mtime||0)-(b.mtime||0); else if(key==='size') r=(a.size||0)-(b.size||0); else if(key==='type') r=natCmp(a.kind==='dir'?'':FT.info(a.name).label,b.kind==='dir'?'':FT.info(b.name).label); if(r===0&&key!=='name') r=natCmp(a.name,b.name); return r*dir; }); }
function bindDirDrops(container){ let hover=null; container.addEventListener('dragover',e=>{ const el=e.target.closest('[data-drop="dir"]'); if(!el) return; if(DND.current&&DND.current.paths.includes(el.dataset.path)) return; e.preventDefault(); e.stopPropagation(); if(hover!==el){ hover&&hover.classList.remove('drop-hover'); hover=el; el.classList.add('drop-hover'); } e.dataTransfer.dropEffect=DND.current?'move':'copy'; }); container.addEventListener('dragleave',e=>{ if(hover&&(!e.relatedTarget||!hover.contains(e.relatedTarget))){ hover.classList.remove('drop-hover'); hover=null; } }); container.addEventListener('drop',e=>{ const el=e.target.closest('[data-drop="dir"]'); if(!el) return; e.preventDefault(); e.stopPropagation(); hover&&hover.classList.remove('drop-hover'); hover=null; Drop.handle(e,{type:'dir',path:el.dataset.path}); }); }

function ExplorerApp(opts={}){
  const win=WM.create({app:'explorer',title:'文件',icon:'folder',appIcon:true,w:980,h:620,minW:340,minH:300});
  const loadCW=()=>{ try{ return Object.assign({name:220,date:150,type:130,size:90},JSON.parse(localStorage.getItem('inkstone.fx.cw')||'{}')); }catch{ return {name:220,date:150,type:130,size:90}; } };
  const st={cwd:null,hist:[],hi:-1,sort:Settings.get('explorerSort')||'name',dir:Settings.get('explorerSortDir')||1,view:Settings.get('explorerView')||'list',items:[],shown:[],sel:new Set(),anchor:null,q:'',deep:null,selMode:false,cw:loadCW(),pending:null,hoverEl:null,_lastTap:null};
  win.body.innerHTML=`<div class="fx">
    <div class="fx-tb">
      <button class="ibtn fx-side-toggle" title="导航窗格">${icon('menu')}</button>
      <button class="ibtn" data-a="back" title="后退 (Alt+←)">${icon('back')}</button><button class="ibtn" data-a="fwd" title="前进 (Alt+→)">${icon('fwd')}</button><button class="ibtn" data-a="up" title="上级目录 (Backspace)">${icon('up')}</button><button class="ibtn" data-a="refresh" title="刷新 (F5)">${icon('refresh')}</button>
      <div class="fx-crumb" title="点击空白处可直接输入路径"></div>
      <div class="fx-search">${icon('search')}<input class="inp sm" placeholder="搜索…（回车深度搜索）" autocomplete="off"></div>
      <button class="ibtn" data-a="new" title="新建">${icon('plus')}</button><button class="ibtn" data-a="upload" title="上传文件到此处">${icon('upload')}</button><button class="ibtn" data-a="paste" title="粘贴 (Ctrl+V)">${icon('paste')}</button><button class="ibtn" data-a="view" title="切换视图">${icon('grid')}</button><button class="ibtn" data-a="sort" title="排序方式">${icon('sort')}</button><button class="ibtn" data-a="selmode" title="多选模式（触屏友好）">${icon('select')}</button><button class="ibtn" data-a="more" title="更多">${icon('more')}</button>
    </div>
    <div class="fx-main"><aside class="fx-side"></aside>
      <div class="fx-content" tabindex="0" data-drop="area">
        <div class="fx-head"><div data-k="name">名称 <span class="arr"></span><span class="rz" data-c="name"></span></div><div data-k="mtime" class="c-date">修改日期 <span class="arr"></span><span class="rz" data-c="date"></span></div><div data-k="type" class="c-type">类型 <span class="arr"></span><span class="rz" data-c="type"></span></div><div data-k="size" class="c-size">大小 <span class="arr"></span></div></div>
        <div class="fx-list"></div>
      </div></div>
    <div class="fx-status"><span class="cnt"></span><span class="selinfo"></span><span class="grow"></span><span class="be muted"></span></div></div>`;
  const E={fx:$('.fx',win.body),side:$('.fx-side',win.body),content:$('.fx-content',win.body),head:$('.fx-head',win.body),list:$('.fx-list',win.body),crumb:$('.fx-crumb',win.body),search:$('.fx-search input',win.body),status:$('.fx-status',win.body)};
  const api={navigate,refresh,cwd:()=>st.cwd,selectAll,startRename,renameLater:n=>{ st.pending=P.join(st.cwd,n); },itemOf:n=>st.items.find(i=>i.name===n),win};
  win.explorer=api; E.content._view=api;
  const keyOf=it=>it.path||P.join(st.cwd,it.name);
  const ctx=()=>({view:api,dir:st.cwd,explorer:api,kindOf:p=>{ const el=[...E.list.children].find(r=>r.dataset.path===p); return el?el.dataset.kind:null; }});
  const selPaths=()=>[...st.sel];
  function applySel(){ for(const r of E.list.children){ if(r.dataset.path) r.classList.toggle('sel',st.sel.has(r.dataset.path)); } updateStatus(); }
  function select(paths){ st.sel=new Set(paths); applySel(); } function toggleSel(p){ st.sel.has(p)?st.sel.delete(p):st.sel.add(p); applySel(); } function clearSel(){ st.sel.clear(); applySel(); }
  function selectAll(){ st.sel=new Set(st.shown.map(keyOf)); applySel(); }
  function rangeSel(p){ const keys=st.shown.map(keyOf); const a=keys.indexOf(st.anchor),b=keys.indexOf(p); if(a<0||b<0) return select([p]); st.sel=new Set(keys.slice(Math.min(a,b),Math.max(a,b)+1)); applySel(); }
  function updateStatus(){ $('.cnt',E.status).textContent=`${st.shown.length} 个项目`; let s=''; if(st.sel.size){ let bytes=0; for(const it of st.shown) if(st.sel.has(keyOf(it))&&it.kind==='file') bytes+=it.size||0; s=`已选择 ${st.sel.size} 个项目${bytes?'  '+fmtSize(bytes):''}`; } $('.selinfo',E.status).textContent=s; const {mount}=st.cwd?VFS.resolve(st.cwd):{}; $('.be',E.status).textContent=mount?mount.backend.label:(VFS.root?VFS.root.label:''); }
  function updateNav(){ $('[data-a=back]',win.body).disabled=st.hi<=0; $('[data-a=fwd]',win.body).disabled=st.hi>=st.hist.length-1; $('[data-a=up]',win.body).disabled=st.cwd==='/'; $('[data-a=paste]',win.body).disabled=!CLIP.has(); $('[data-a=view]',win.body).innerHTML=icon(st.view==='list'?'grid':'list'); $('[data-a=selmode]',win.body).classList.toggle('on',st.selMode); E.fx.classList.toggle('selmode',st.selMode); }
  function applyCW(){ E.content.style.setProperty('--cw',`minmax(${st.cw.name}px,1fr) ${st.cw.date}px ${st.cw.type}px ${st.cw.size}px`); }

function mdToHtml(src){ const lines=String(src||'').replace(/\r\n?/g,'\n').split('\n'); let out='',i=0;
  const inline=s=>{ s=esc(s); s=s.replace(/`([^`]+)`/g,'<code>$1</code>'); s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<img alt="$1" src="$2">'); s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>'); s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>'); s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>'); return s; };
  while(i<lines.length){ const l=lines[i];
    if(/^```/.test(l)){ const lang=l.slice(3).trim(); const code=[]; i++; while(i<lines.length&&!/^```/.test(lines[i])) code.push(lines[i++]); i++; out+=`<pre><code class="lang-${esc(lang)}">${esc(code.join('\n'))}</code></pre>`; continue; }
    const hm=l.match(/^(#{1,6})\s+(.*)$/); if(hm){ out+=`<h${hm[1].length}>${inline(hm[2].replace(/\s#+$/,''))}</h${hm[1].length}>`; i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ out+='<hr>'; i++; continue; }
    if(/^>\s?/.test(l)){ const q=[]; while(i<lines.length&&/^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/,'')); out+=`<blockquote>${mdToHtml(q.join('\n'))}</blockquote>`; continue; }
    if(/^\s*[-*+]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)){ const ol=/^\s*\d+\./.test(l); const re=ol?/^\s*\d+\.\s+/:/^\s*[-*+]\s+/; const items=[]; while(i<lines.length&&re.test(lines[i])){ let item=lines[i++].replace(re,''); while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!re.test(lines[i])) item+=' '+lines[i++].trim(); items.push(item); } out+=`<${ol?'ol':'ul'}>${items.map(t=>{ const m=t.match(/^\[( |x)\]\s+/i); return `<li>${m?`<input type="checkbox" disabled ${/x/i.test(m[1])?'checked':''}> ${inline(t.slice(m[0].length))}`:inline(t)}</li>`; }).join('')}</${ol?'ol':'ul'}>`; continue; }
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){ const rows=[]; while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]); const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim())); out+=`<table><thead><tr>${cells(rows[0]).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`; continue; }
    if(!l.trim()){ i++; continue; }
    const para=[]; while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|>|\s*[-*+]\s+|\s*\d+\.\s+|\s*\|)/.test(lines[i])) para.push(lines[i++]); if(!para.length) para.push(lines[i++]); out+=`<p>${para.map(inline).join('<br>')}</p>`; }
  return out; }

/* ---------------- 表格 (CSV / TSV) ---------------- */
function parseDSV(text,delim){ const rows=[]; let row=[],cell='',q=false; for(let i=0;i<text.length;i++){ const c=text[i]; if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; } else if(c==='"') q=true; else if(c===delim){ row.push(cell); cell=''; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if(c!=='\r') cell+=c; } if(cell!==''||row.length) { row.push(cell); rows.push(row); } return rows; }
function toDSV(rows,delim){ const q=v=>{ v=v==null?'':String(v); return (v.includes(delim)||v.includes('"')||/[\r\n]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v; }; return rows.map(r=>r.map(q).join(delim)).join('\n')+'\n'; }
function sniffDelim(text,ext){ if(ext==='tsv') return '\t'; const head=text.split('\n').slice(0,6).join('\n'); const cands=[',',';','\t','|']; let best=',',bn=-1; for(const c of cands){ const n=head.split(c).length-1; if(n>bn){ bn=n; best=c; } } return best; }
const colName=i=>{ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; };
function SheetsApp(opts={}){
  const win=WM.create({app:'sheets',title:'表格',icon:'sheets',appIcon:true,w:920,h:580,minW:340,minH:240});

  win.body.innerHTML=`<div class="sh"><div class="tb">

    <select class="inp sm" data-r="delim"><option value=",">逗号 ,</option><option value=";">分号 ;</option><option value="&#9;">制表符 Tab</option><option value="|">竖线 |</option></select>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-left:6px"><span class="sw on" data-r="hdr"></span>首行为表头</label><span class="sep"></span>
    <button class="ibtn" data-a="addrow" title="添加行">${icon('plus')}</button><button class="ibtn" data-a="addcol" title="添加列">${icon('sidebar')}</button><button class="ibtn" data-a="delrow" title="删除当前行">${icon('trash')}</button><span class="sep"></span>
    <button class="ibtn" data-a="open" title="打开">${icon('folder')}</button><button class="ibtn" data-a="save" title="保存 (Ctrl+S)">${icon('save')}</button><button class="ibtn" data-a="saveas" title="另存为">${icon('documents')}</button><button class="ibtn" data-a="export" title="导出到本机">${icon('download')}</button>
    <span class="grow"></span><span class="muted" style="font-size:11.5px" data-r="path"></span></div>
    <div class="sh-wrap"></div><textarea class="sh-text hidden" spellcheck="false"></textarea>
    <div class="status"><span data-r="dim"></span><span data-r="cell"></span><span class="grow"></span><span>UTF-8</span></div></div>`;
  const wrap=$('.sh-wrap',win.body),ta=$('.sh-text',win.body); const A=k=>$(`[data-a="${k}"]`,win.body),R=k=>$(`[data-r="${k}"]`,win.body);
  const updateTitle=()=>{ win.setTitle(`${st.dirty?'● ':''}${st.path?P.base(st.path):'无标题'} - 表格`); R('path').textContent=st.path||''; };
  const dims=()=>{ const cols=Math.max(0,...st.rows.map(r=>r.length)); R('dim').textContent=`${st.rows.length} 行 × ${cols} 列`; };
  function renderTable(){ const cols=Math.max(1,...st.rows.map(r=>r.length)); const MAX=3000; const rows=st.rows.slice(0,MAX); let html=`<table class="sh-table"><thead><tr><th class="rn">#</th>${Array.from({length:cols},(_,c)=>`<th>${colName(c)}</th>`).join('')}</tr></thead><tbody>`; rows.forEach((r,ri)=>{ html+=`<tr${st.header&&ri===0?' class="hdr"':''}><td class="rn">${ri+1}</td>${Array.from({length:cols},(_,c)=>`<td><div contenteditable="true" data-r="${ri}" data-c="${c}" spellcheck="false">${esc(r[c]??'')}</div></td>`).join('')}</tr>`; }); html+='</tbody></table>'; if(st.rows.length>MAX) html+=`<div class="muted" style="padding:10px 14px;font-size:12px">仅显示前 ${MAX} 行（共 ${st.rows.length} 行），可切换到文本视图编辑全部内容。</div>`; wrap.innerHTML=html; dims(); }
  wrap.addEventListener('input',e=>{ const d=e.target.closest('div[data-r]'); if(!d) return; const r=+d.dataset.r,c=+d.dataset.c; while(st.rows[r].length<=c) st.rows[r].push(''); st.rows[r][c]=d.textContent; if(!st.dirty){ st.dirty=true; updateTitle(); } });
  wrap.addEventListener('focusin',e=>{ const d=e.target.closest('div[data-r]'); if(d){ st.focus={r:+d.dataset.r,c:+d.dataset.c}; R('cell').textContent=`${colName(+d.dataset.c)}${+d.dataset.r+1}`; } });
  wrap.addEventListener('keydown',e=>{ const d=e.target.closest('div[data-r]'); if(!d) return; if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const r=+d.dataset.r+1,c=+d.dataset.c; if(r>=st.rows.length){ st.rows.push(Array(Math.max(1,...st.rows.map(x=>x.length))).fill('')); renderTable(); } const nx=wrap.querySelector(`div[data-r="${r}"][data-c="${c}"]`); nx&&nx.focus(); } else if(e.key==='Tab'){ e.preventDefault(); const c=+d.dataset.c+(e.shiftKey?-1:1),r=+d.dataset.r; const nx=wrap.querySelector(`div[data-r="${r}"][data-c="${c}"]`); nx&&nx.focus(); } });
  wrap.addEventListener('paste',e=>{ const d=e.target.closest('div[data-r]'); if(!d) return; e.preventDefault(); const text=(e.clipboardData||window.clipboardData).getData('text/plain'); if(!/[\t\n]/.test(text)){ document.execCommand('insertText',false,text); return; } const grid=parseDSV(text.replace(/\r/g,''),'\t'); const r0=+d.dataset.r,c0=+d.dataset.c; grid.forEach((gr,i)=>{ if(!st.rows[r0+i]) st.rows[r0+i]=[]; gr.forEach((v,j)=>{ st.rows[r0+i][c0+j]=v; }); }); st.dirty=true; updateTitle(); renderTable(); });
  function setView(v){ if(v===st.view) return; if(v==='text'){ ta.value=toDSV(st.rows,st.delim); } else { st.rows=parseDSV(ta.value,st.delim); if(!st.rows.length) st.rows=[['']]; renderTable(); } st.view=v; wrap.classList.toggle('hidden',v==='text'); ta.classList.toggle('hidden',v!=='text'); $$('.seg button',win.body).forEach(b=>b.classList.toggle('on',b.dataset.v===v)); }
  $$('.seg button',win.body).forEach(b=>b.onclick=()=>setView(b.dataset.v));

  R('delim').onchange=()=>{ const text=st.view==='text'?ta.value:toDSV(st.rows,st.delim); st.delim=R('delim').value; if(st.view==='text'){ /* 保持原文 */ } else { st.rows=parseDSV(text.replace(/\r/g,''),st.delim); renderTable(); } st.dirty=true; updateTitle(); };
  R('hdr').onclick=()=>{ st.header=!st.header; R('hdr').classList.toggle('on',st.header); if(st.view==='table') renderTable(); };

  A('addcol').onclick=()=>{ if(st.view!=='table') setView('table'); st.rows.forEach(r=>r.push('')); st.dirty=true; updateTitle(); renderTable(); };

  const current=()=>st.view==='text'?ta.value:toDSV(st.rows,st.delim);
  async function load(path){ try{ const text=await fs.readText(path); st.path=path; st.delim=sniffDelim(text,P.ext(path)); R('delim').value=st.delim; st.rows=parseDSV(text.replace(/\r/g,''),st.delim); if(!st.rows.length) st.rows=[['']]; ta.value=text; st.dirty=false; if(st.view==='table') renderTable(); updateTitle(); }catch(e){ UI.toast('打开失败: '+e.message,'err'); } }
  async function save(){ if(!st.path) return saveAs(); try{ await fs.writeFile(st.path,current()); st.dirty=false; updateTitle(); UI.toast('已保存','ok',{timeout:1200}); }catch(e){ UI.toast('保存失败: '+e.message,'err'); } }
  async function saveAs(){ const p=await UI.pickPath({mode:'save',start:st.path?P.dir(st.path):'/Documents',name:st.path?P.base(st.path):(st.delim==='\t'?'无标题.tsv':'无标题.csv'),title:'另存为'}); if(!p) return; st.path=p; await save(); }

  win.body.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); save(); } });
  win.opts.beforeClose=async()=>!st.dirty||await UI.confirm('表格有未保存的修改，确定放弃吗？','未保存',{danger:true,okText:'放弃修改'}); win.openFile=load;

  async function show(id){ $$('.stg-nav button',win.body).forEach(b=>b.classList.toggle('on',b.dataset.s===id)); body.scrollTop=0; await RENDER[id](body); bind(body); }
  $$('.stg-nav button',win.body).forEach(b=>b.onclick=()=>show(b.dataset.s)); show(opts.section||'appearance'); win.openFile=()=>{}; return win;
}

/* ---------------- 首次运行内容 ---------------- */
const WELCOME_MD=`# 欢迎使用 砚 OS · Inkstone

一个运行在浏览器中的 **单文件桌面操作系统**：没有后端，所有文件都保存在浏览器的 **OPFS（Origin Private File System）** 中，刷新页面后依然存在。

## 你可以试试

- 双击 **示例页面.html**，在 HTML编辑器中边改代码边看右侧实时预览；工具栏的地球图标可在内置浏览器中渲染页面
- 打开 **图片 → 示例漫画**，点击任意一页进入 *条漫式* 阅读；按 F 进入沉浸全屏
- 把电脑里的文件 **拖进桌面**，或把桌面图标 **拖回电脑**（Chrome / Edge）
- 右键桌面 → **新建 / 上传 / 更换壁纸**；图标可以在网格中自由拖放
- 在「文件」侧栏点击 **挂载本地文件夹**，把真实文件夹挂到 \`/mnt/local\`
- 右键 .zip / .tar.gz → **解压**；右键任意文件 → **压缩为 ZIP**
- 「设置 → 存储空间」查看实际占用、配额与分布

## 快捷键

| 按键 | 作用 |
| --- | --- |
| F2 / Delete | 重命名 / 删除 |
| Ctrl + C / X / V | 复制 / 剪切 / 粘贴 |
| Ctrl + S | 保存 |
| F11 | 系统全屏 |

> 提示：所有可调项都集中在「设置」中。
`;
const SAMPLE_HTML=`<!DOCTYPE html>

async function genMangaPage(i,n){ const c=document.createElement('canvas'); c.width=800; c.height=1120; const x=c.getContext('2d'); const hue=(i*47+200)%360; const g=x.createLinearGradient(0,0,800,1120); g.addColorStop(0,`hsl(${hue} 35% 20%)`); g.addColorStop(1,`hsl(${(hue+50)%360} 40% 9%)`); x.fillStyle=g; x.fillRect(0,0,800,1120); x.lineWidth=3; for(const [px,py,pw,ph] of [[40,40,720,430],[40,500,350,300],[420,500,340,300],[40,830,720,250]]){ x.fillStyle='rgba(255,255,255,.06)'; x.fillRect(px,py,pw,ph); x.strokeStyle='rgba(255,255,255,.28)'; x.strokeRect(px,py,pw,ph); } x.fillStyle='#e2a13d'; x.beginPath(); x.arc(400,255,90+i*3,0,Math.PI*2); x.fill(); x.fillStyle='rgba(255,255,255,.12)'; x.beginPath(); x.arc(560,180,40,0,Math.PI*2); x.fill(); x.fillStyle='#fff'; x.textAlign='center'; x.font='700 150px Fraunces, "Noto Serif SC", serif'; x.fillText(String(i),400,760); x.font='30px "Bricolage Grotesque", "Noto Sans SC", sans-serif'; x.fillStyle='rgba(255,255,255,.75)'; x.fillText(`示例漫画 · 第 ${i} / ${n} 页`,400,990); x.font='20px sans-serif'; x.fillStyle='rgba(255,255,255,.45)'; x.fillText('自然排序：1 → 2 → … → 10 → 11 → 12',400,1050); return new Promise(r=>c.toBlob(r,'image/png')); }
async function seedIfNeeded(){ for(const d of ['/Desktop','/Documents','/Pictures','/Music','/Videos','/Downloads','/wallpapers','/mnt/local']) try{ await fs.ensureDir(d); }catch(e){ console.warn('mkdir',d,e); } if(localStorage.getItem('inkstone.seeded')&&(await fs.readdir('/Desktop')).length) return; if(localStorage.getItem('inkstone.seeded')) return;
  try{ await fs.writeFile('/Desktop/欢迎使用.md',WELCOME_MD); await fs.writeFile('/Desktop/示例页面.html',SAMPLE_HTML); for(const [n,app] of [['文件','explorer'],['HTML编辑器','editor'],['浏览器','browser'],['画板','paint'],['设置','settings']]) await fs.writeFile(`/Desktop/${n}.app`,JSON.stringify({app}));
    await fs.writeFile('/Documents/示例数据.csv','城市,人口(万),面积(km²),区号\n北京,2189,16410,010\n上海,2487,6341,021\n广州,1868,7434,020\n深圳,1756,1997,0755\n杭州,1237,16850,0571\n成都,2119,14335,028\n'); await fs.writeFile('/Documents/读我.txt','这是一个保存在 OPFS 中的纯文本文件。\n\n用记事本打开我，修改后按 Ctrl+S 保存；刷新页面后内容依然在。\n'); await fs.writeFile('/Documents/配置.json',JSON.stringify({name:'inkstone',version:'1.0',features:['opfs','vfs','mount','drag-drop'],theme:{accent:'amber',dark:true}},null,2));
    await fs.mkdir('/Pictures/示例漫画'); for(let i=1;i<=12;i++){ const b=await genMangaPage(i,12); await fs.writeFile(`/Pictures/示例漫画/${i}.png`,b); }
    await fs.writeFile('/Pictures/砚台.svg',`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><radialGradient id="g" cx="70%" cy="20%" r="80%"><stop offset="0" stop-color="#2b303b"/><stop offset="1" stop-color="#0b0d11"/></radialGradient></defs><rect width="400" height="300" fill="url(#g)"/><ellipse cx="200" cy="200" rx="150" ry="60" fill="#1a1d24" stroke="#3a3f4a" stroke-width="3"/><ellipse cx="200" cy="190" rx="110" ry="38" fill="#05060a"/><circle cx="300" cy="70" r="30" fill="none" stroke="#e2a13d" stroke-width="2"/><circle cx="300" cy="70" r="6" fill="#e2a13d"/><text x="200" y="272" text-anchor="middle" font-size="16" fill="#9a9689" font-family="serif">砚 · Inkstone</text></svg>`);
    localStorage.setItem('inkstone.seeded','1'); }catch(e){ console.warn('seed',e); } }

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ CTX.hide(); if(!StartMenu.el.classList.contains('hidden')){ StartMenu.hide(); return; } } const t=e.target; const typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable||(t.closest&&t.closest('.CodeMirror'))); if(typing||UI.dialogOpen()) return; if(e.ctrlKey&&e.key==='Escape'){ StartMenu.toggle(); return; } if(e.key==='F11'){ e.preventDefault(); toggleFullscreen(); return; } const act=WM.active; if(act&&!act.minimized){ if(act.keyHandler) act.keyHandler(e); return; } Desktop.onKey(e); });
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#startmenu,#start-btn')) StartMenu.hide(); },true);
document.addEventListener('dragover',e=>e.preventDefault()); document.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('error',e=>{ if(e.message&&/ResizeObserver/.test(e.message)) return; console.error(e.error||e.message); });
async function boot(){
  $('#start-btn').innerHTML=icon('logo'); $('#tray-theme').innerHTML=icon(Settings.get('theme')==='dark'?'sun':'moon'); $('#tray-fs').innerHTML=icon('fullscreen'); $('#tray-storage').innerHTML=icon('storage');
  $('#start-btn').onclick=()=>StartMenu.toggle(); $('#tray-theme').onclick=()=>Settings.set('theme',Settings.get('theme')==='dark'?'light':'dark'); $('#tray-fs').onclick=toggleFullscreen; $('#tray-storage').onclick=()=>launchApp('settings',{section:'storage'}); $('#clock').onclick=()=>launchApp('settings',{section:'appearance'});
  Settings.em.on('theme',v=>{ $('#tray-theme').innerHTML=icon(v==='dark'?'sun':'moon'); }); Settings.em.on('*',k=>{ if(k==='reset'||k==='import') Desktop.render&&Desktop.render(); });
  Clock.start(); Wallpaper.apply();
  try{ await VFS.init(); }catch(e){ await UI.alert(e.message,'存储初始化失败'); }
  if(VFS.root){ await seedIfNeeded(); }
  Desktop.init(); await Desktop._refresh(); Wallpaper.apply(); Tray.update(); setInterval(()=>Tray.update(),60000);
  if(VFS.backendName&&VFS.backendName!=='OPFS') UI.toast(`OPFS 不可用，已自动降级为 ${VFS.root.label}`,'warn',{timeout:8000});
  Mounts.bootPrompt();
  if(!localStorage.getItem('inkstone.tour')){ localStorage.setItem('inkstone.tour','1'); setTimeout(()=>UI.toast('欢迎使用砚 OS。桌面上的「欢迎使用.md」介绍了主要功能。','ok',{timeout:6000,action:{label:'打开',fn:()=>openPath('/Desktop/欢迎使用.md')}}),900); }
}
