<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>砚 · YanOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Ccircle cx='32' cy='29' r='15' fill='%23d9543b'/%3E%3Cpath d='M16 50h32' stroke='%23e8e4dc' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<style>
:root{
  --bg:#0e1013;--bg2:#15181d;--panel:rgba(20,22,27,.78);--panel-solid:#171a20;--line:rgba(255,255,255,.085);
  --text:#e8e4dc;--muted:#8f8c86;--accent:#d9543b;--accent2:#4fa38a;--sel:rgba(217,84,59,.22);--scroll:rgba(255,255,255,.18);
  --file-bg:#2a2f38;--file-line:#4a5262;
  --font-ui:'LXGW WenKai','LXGW WenKai Screen','Fraunces','Noto Serif SC',serif;
  --font-display:'Fraunces','LXGW WenKai',serif;
  --font-mono:'JetBrains Mono','LXGW WenKai Mono',ui-monospace,Menlo,monospace;
  --radius:12px;--tb-h:48px;--head-h:40px;--blur:22px;
  --shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  --cell-w:92px;--cell-h:104px;--icon-s:48px;
}
[data-theme=light]{
  --bg:#f1ece2;--bg2:#e8e2d5;--panel:rgba(248,244,236,.84);--panel-solid:#f7f3eb;--line:rgba(30,25,20,.11);
  --text:#1d1b19;--muted:#6f6a62;--accent2:#2e8a70;--scroll:rgba(0,0,0,.2);
  --file-bg:#fbf8f1;--file-line:#b7ad9c;
  --shadow:0 20px 50px rgba(50,40,30,.22),0 0 0 1px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;position:fixed;inset:0;touch-action:manipulation;line-height:1.4}
body.no-anim *{animation-duration:0s!important;transition-duration:0s!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
svg{display:inline-block}
.ico{width:1em;height:1em;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.ico svg{width:100%;height:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ===== Desktop ===== */
#desktop{position:fixed;inset:0;background:var(--bg) var(--wall) center/cover no-repeat;transition:background-image .5s}
#desktop::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 115%,rgba(0,0,0,.4),transparent 60%);pointer-events:none}
#icons{position:absolute;left:0;top:0;right:0;bottom:var(--tb-h);touch-action:none;z-index:1}
.dicon{position:absolute;width:calc(var(--cell-w) - 6px);height:calc(var(--cell-h) - 6px);padding:8px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:10px;border:1px solid transparent;cursor:default;
  transition:left .34s cubic-bezier(.2,.8,.2,1),top .34s cubic-bezier(.2,.8,.2,1),background .15s,border-color .15s,transform .15s,opacity .15s;
  animation:icon-in .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*30ms)}
.dicon:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12)}
.dicon.sel{background:var(--sel);border-color:var(--accent)}
.dicon.dragging{opacity:.35;transform:scale(.94)}
.dicon.drop-target{background:var(--sel);border-color:var(--accent);transform:scale(1.07)}
.dic{width:var(--icon-s);height:var(--icon-s);flex:none;display:grid;place-items:center}
.dicon .dic{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.dic svg,.dic img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.dlb{font-size:12px;line-height:1.25;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.7);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;max-width:100%}
@keyframes icon-in{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}

/* ===== Windows ===== */
#windows{position:absolute;inset:0;bottom:var(--tb-h);pointer-events:none;z-index:2}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:300px;min-height:180px;animation:win-in .24s cubic-bezier(.2,.8,.2,1) backwards;transition:opacity .18s,transform .18s}
.win.closing{opacity:0;transform:scale(.94);pointer-events:none}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.snapping{transition:left .25s cubic-bezier(.2,.8,.2,1),top .25s cubic-bezier(.2,.8,.2,1),width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1)}
.win.peek-dim{opacity:.08;pointer-events:none}
.win.no-anim{transition:none}
.win-head{height:var(--head-h);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);flex:none;position:relative;touch-action:none;cursor:default}
.win-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .2s}
.win.active .win-head::before{opacity:1}
.win-icon{font-size:17px}
.win-title{flex:1;font-family:var(--font-display);font-size:14px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75;pointer-events:none}
.win.active .win-title{opacity:1}
.win-ctl{display:flex;gap:2px}
.win-ctl button{width:38px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:14px;opacity:.7;transition:background .15s,opacity .15s}
.win-ctl button svg{width:15px;height:15px}
.win-ctl button:hover{background:rgba(127,127,127,.18);opacity:1}
.win-ctl button.close:hover{background:var(--accent);color:#fff}
.win-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.rs{position:absolute;z-index:5;touch-action:none}
.rs-n{top:-3px;left:12px;right:12px;height:7px;cursor:ns-resize}.rs-s{bottom:-3px;left:12px;right:12px;height:7px;cursor:ns-resize}
.rs-e{right:-3px;top:12px;bottom:12px;width:7px;cursor:ew-resize}.rs-w{left:-3px;top:12px;bottom:12px;width:7px;cursor:ew-resize}
.rs-ne{top:-4px;right:-4px;width:16px;height:16px;cursor:nesw-resize}.rs-nw{top:-4px;left:-4px;width:16px;height:16px;cursor:nwse-resize}
.rs-se{bottom:-4px;right:-4px;width:16px;height:16px;cursor:nwse-resize}.rs-sw{bottom:-4px;left:-4px;width:16px;height:16px;cursor:nesw-resize}
.win.max .rs{display:none}
@keyframes win-in{from{opacity:0;transform:translateY(18px) scale(.96)}}
#snap-prev{position:absolute;border:2px solid var(--accent);background:var(--sel);border-radius:var(--radius);z-index:8000;pointer-events:none;opacity:0;transition:all .18s cubic-bezier(.2,.8,.2,1)}
#snap-prev.show{opacity:1}
.marquee{position:absolute;border:1px solid var(--accent);background:var(--sel);pointer-events:none;z-index:50}
.drag-ghost{position:fixed;left:0;top:0;z-index:99999;pointer-events:none;opacity:.85;width:84px;transform:translate(-200px,-200px);background:var(--sel);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.drag-ghost .dic{width:44px;height:44px}
.dnd-badge{position:fixed;left:-1000px;top:-1000px;background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:13px;padding:6px 12px;border-radius:20px}

/* ===== Taskbar ===== */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);border-top:1px solid var(--line);z-index:9000}
#tb-start{width:46px;height:38px;border-radius:9px;display:grid;place-items:center;transition:.2s;flex:none}
#tb-start:hover,#tb-start.on{background:var(--sel)}
#tb-start svg{width:26px;height:26px}
#tb-apps{flex:1;display:flex;gap:4px;overflow-x:auto;height:100%;align-items:center;scrollbar-width:none;min-width:0}
#tb-apps::-webkit-scrollbar{display:none}
.tb-app{height:36px;padding:0 12px 0 10px;display:flex;align-items:center;gap:8px;border-radius:8px;position:relative;max-width:190px;font-size:13px;transition:background .15s;flex:none;animation:icon-in .25s backwards}
.tb-app .ico{font-size:18px}.tb-app span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-app::after{content:'';position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--muted);transition:.2s;opacity:.7}
.tb-app:hover{background:rgba(127,127,127,.15)}
.tb-app.active{background:rgba(127,127,127,.22)}.tb-app.active::after{background:var(--accent);left:8px;right:8px;opacity:1}
.tb-app.minimized{opacity:.55}
#tray{display:flex;align-items:center;gap:2px;height:100%;flex:none}
.tray-btn{height:36px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.tray-btn:hover,.tray-btn.on{background:rgba(127,127,127,.15)}
#clock{flex-direction:column;gap:0;line-height:1.15;font-family:var(--font-mono);font-size:11px;min-width:76px}
#clock b{font-weight:500;font-size:13px}
#show-desk{width:9px;height:100%;border-left:1px solid var(--line);margin-left:4px}
#show-desk:hover{background:var(--sel)}

/* ===== Popups ===== */
.pop{position:fixed;background:var(--panel);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:9500;opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;transition:opacity .2s,transform .22s cubic-bezier(.2,.8,.2,1);transform-origin:bottom left}
.pop.open{opacity:1;transform:none;pointer-events:auto}
#start{left:8px;bottom:calc(var(--tb-h) + 8px);width:min(580px,calc(100vw - 16px));max-height:min(660px,calc(100vh - var(--tb-h) - 16px));display:flex;flex-direction:column;overflow:hidden}
#start-head{padding:18px 20px 12px;display:flex;align-items:center;gap:16px}
#start-logo{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:.04em;line-height:1;position:relative;padding-left:14px}
#start-logo::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:2px;background:var(--accent)}
#start-logo small{font-size:10px;letter-spacing:.35em;color:var(--muted);display:block;font-family:var(--font-mono);margin-top:4px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(127,127,127,.12);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px;min-width:0}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search .ico{color:var(--muted)}
#start-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px;padding:6px 14px 14px;overflow:auto}
.s-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:12px;font-size:12px;transition:.15s;animation:icon-in .4s backwards;animation-delay:calc(var(--i,0)*22ms)}
.s-app:hover{background:rgba(127,127,127,.14)}
.s-app .dic{width:46px;height:46px}
#start-res{padding:0 14px 14px;overflow:auto;display:none}
#start-res h6{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:10px 8px 4px;font-family:var(--font-mono)}
.s-file{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;cursor:default}
.s-file:hover{background:rgba(127,127,127,.14)}
.s-file .dic{width:22px;height:22px}
.s-file small{color:var(--muted);margin-left:auto;font-family:var(--font-mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#start-foot{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:6px;align-items:center}
#start-foot .spacer{flex:1}
#start-foot .sys{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
#calpop{right:8px;bottom:calc(var(--tb-h) + 8px);width:330px;padding:18px;transform-origin:bottom right}
#cal-time{font-family:var(--font-display);font-size:42px;font-weight:600;line-height:1;letter-spacing:.01em}
#cal-date{color:var(--muted);margin:6px 0 14px;font-size:13px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;font-family:var(--font-display)}
.cal-nav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}.cal-nav button:hover{background:rgba(127,127,127,.15)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.cal-grid .wd{color:var(--muted);font-size:11px;padding:4px 0;font-family:var(--font-mono)}
.cal-grid .d{height:36px;display:grid;place-items:center;border-radius:8px;cursor:default}
.cal-grid .d:hover{background:rgba(127,127,127,.15)}
.cal-grid .d.dim{opacity:.3}.cal-grid .d.today{background:var(--accent);color:#fff;font-weight:600}
.cal-grid .d.wk{color:var(--accent2)}
#peek{position:fixed;bottom:calc(var(--tb-h) + 6px);background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);z-index:9600;display:none;flex-direction:column;gap:6px;font-size:12px}
#peek.show{display:flex;animation:win-in .18s}
#peek .pk-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:224px;padding:0 2px}
#peek .pk-frame{width:224px;height:140px;overflow:hidden;border-radius:8px;position:relative;background:var(--bg)}
#peek .pk-frame .win{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;box-shadow:none;animation:none;display:flex}
#peek .pk-ph{display:grid;place-items:center;background:var(--bg2);color:var(--muted);font-size:24px}

/* ===== Menus / dialogs / toasts ===== */
.menu{position:fixed;min-width:210px;max-width:320px;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:9800;animation:menu-in .14s cubic-bezier(.2,.8,.2,1);font-size:13px;max-height:calc(100vh - 20px);overflow:auto}
@keyframes menu-in{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:default;position:relative;white-space:nowrap}
.mi .ico{font-size:16px;color:var(--muted)}
.mi:hover{background:var(--sel)}
.mi.dis{opacity:.4;pointer-events:none}
.mi .kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-left:16px}
.mi .sub-arr{margin-left:auto;opacity:.5;font-size:12px;padding-left:16px}
.msep{height:1px;background:var(--line);margin:5px 8px}
.mhead{padding:4px 10px 6px;font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.08em}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb-h) + 12px);display:flex;flex-direction:column;gap:8px;z-index:9900;pointer-events:none;max-width:min(400px,calc(100vw - 24px))}
.toast{pointer-events:auto;background:var(--panel-solid);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:13px;animation:toast-in .3s cubic-bezier(.2,.8,.2,1);transition:.25s}
.toast.out{opacity:0;transform:translateX(20px)}
.toast .btn{height:26px;padding:0 10px;font-size:12px}
.toast .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast-in{from{opacity:0;transform:translateX(24px)}}
.dlg-back{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);z-index:10000;display:grid;place-items:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(460px,calc(100vw - 32px));padding:22px;animation:win-in .2s;max-height:86vh;display:flex;flex-direction:column}
.dlg.wide{width:min(640px,calc(100vw - 32px))}
.dlg h3{font-family:var(--font-display);font-size:18px;margin-bottom:10px;font-weight:600}
.dlg p{color:var(--muted);font-size:13px;line-height:1.7;white-space:pre-wrap;user-select:text}
.dlg .inp{width:100%;margin-top:8px;height:38px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:6px}
.dlg .kv span:nth-child(odd){color:var(--muted)}
.dlg .kv span:nth-child(even){user-select:text;word-break:break-all;font-family:var(--font-mono);font-size:12px}
.picker{height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.picker .row{margin:1px 4px}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:rgba(127,127,127,.12);border:1px solid var(--line);font-size:13px;white-space:nowrap;transition:.15s;flex:none}
.btn:hover{background:rgba(127,127,127,.22)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.ic{width:32px;padding:0;justify-content:center}
.btn.on{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn .ico{font-size:16px}
.inp{height:32px;padding:0 10px;border-radius:8px;background:rgba(127,127,127,.1);border:1px solid var(--line);outline:0;min-width:0}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:auto;padding-right:4px}
select.inp option{background:var(--panel-solid);color:var(--text)}
.tool{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.tool .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tool .grow{flex:1}
.status{display:flex;gap:14px;padding:3px 12px;font-size:11px;font-family:var(--font-mono);color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap;flex:none;align-items:center}
.status .grow{flex:1}
.banner{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--sel);font-size:12px;border-bottom:1px solid var(--line);flex:none}
.banner .grow{flex:1}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tab{padding:6px 14px;border-radius:8px 8px 0 0;font-size:13px;color:var(--muted);border:1px solid transparent;border-bottom:0}
.tab.on{color:var(--text);background:rgba(127,127,127,.1);border-color:var(--line)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;background:rgba(127,127,127,.3);position:relative;transition:.2s;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}

/* ===== Explorer ===== */
.ex{display:flex;flex:1;min-height:0;position:relative}
.ex-side{width:200px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px;background:rgba(127,127,127,.04)}
.ex-side h6{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:10px 8px 4px;font-family:var(--font-mono);font-weight:500}
.side-it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:default;white-space:nowrap;overflow:hidden}
.side-it .ico{font-size:16px;color:var(--muted)}
.side-it span{overflow:hidden;text-overflow:ellipsis}
.side-it:hover{background:rgba(127,127,127,.12)}.side-it.on{background:var(--sel)}.side-it.on .ico{color:var(--accent)}
.side-it.drop-target{outline:1px solid var(--accent);background:var(--sel)}
.ex-main{flex:1;display:flex;flex-direction:column;min-width:0}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;height:32px;padding:0 6px;border-radius:8px;background:rgba(127,127,127,.1);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:120px;font-size:13px;cursor:text}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:4px 7px;border-radius:6px;white-space:nowrap;cursor:default;flex:none}
.crumb:hover{background:rgba(127,127,127,.15)}
.crumb-sep{opacity:.4;font-size:10px;flex:none}
.crumbs input{flex:1;background:none;border:0;outline:0;min-width:80px;font-family:var(--font-mono);font-size:12px}
.ex-list{flex:1;overflow:auto;position:relative;--c-name:minmax(160px,1fr);--c-mtime:170px;--c-type:120px;--c-size:96px;outline:0}
.ex-list.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
.ex-hd,.row{display:grid;grid-template-columns:var(--c-name) var(--c-mtime) var(--c-type) var(--c-size);align-items:center;min-width:0}
.ex-hd{position:sticky;top:0;background:var(--panel-solid);z-index:2;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.th{padding:8px 10px;position:relative;display:flex;align-items:center;gap:4px;cursor:default;user-select:none;white-space:nowrap;overflow:hidden}
.th:hover{color:var(--text)}
.th.on{color:var(--text)}
.th .th-rs{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none}
.th .th-rs:hover,.th .th-rs.on{background:var(--accent)}
.th .arr{font-size:10px;opacity:.8}
.fitem{cursor:default}
.row{height:36px;font-size:13px;border-radius:6px;margin:1px 4px;border:1px solid transparent}
.row>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .cname{display:flex;align-items:center;gap:8px}
.row .cname .dic{width:22px;height:22px;flex:none}
.row .cname span{overflow:hidden;text-overflow:ellipsis}
.row .cnum{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.row .ctype{color:var(--muted);font-size:12px}
.row:hover{background:rgba(127,127,127,.1)}.row.sel{background:var(--sel);border-color:var(--accent)}
.fitem.drop-target{outline:2px solid var(--accent);outline-offset:-2px}
.fitem.cut{opacity:.5}
.fitem.dragging{opacity:.4}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;padding:8px}
.gi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;font-size:12px;text-align:center;border:1px solid transparent}
.gi .dic{width:52px;height:52px}
.gi .dlb{color:var(--text);text-shadow:none}
.gi:hover{background:rgba(127,127,127,.1)}.gi.sel{background:var(--sel);border-color:var(--accent)}
.ex-status{border-top:1px solid var(--line);padding:4px 12px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex:none}

/* ===== Notepad / sheets ===== */
.np-area{flex:1;background:transparent;border:0;outline:0;resize:none;padding:14px 16px;line-height:1.65;font-family:var(--font-mono);white-space:pre-wrap;color:var(--text);tab-size:2}
.np-area.nowrap{white-space:pre;overflow:auto}
.sh-table{flex:1;overflow:auto}
.sh-table table{border-collapse:collapse;font-size:13px;font-family:var(--font-mono)}
.sh-table th,.sh-table td{border:1px solid var(--line);padding:4px 8px;min-width:90px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:30px}
.sh-table th{background:var(--panel-solid);position:sticky;top:0;font-weight:500;color:var(--muted);z-index:1}
.sh-table td[contenteditable]:focus{outline:2px solid var(--accent);background:var(--sel);text-overflow:clip}
.sh-table td:first-child,.sh-table th:first-child{position:sticky;left:0;background:var(--panel-solid);color:var(--muted);text-align:center;min-width:48px;z-index:1}
.sh-table th:first-child{z-index:2}

/* ===== Code editor ===== */
.ce{display:flex;flex-direction:column;flex:1;min-height:0}
.ce-main{flex:1;display:flex;min-height:0;position:relative}
.ce-edit{flex:1 1 58%;min-width:0;display:flex;flex-direction:column;position:relative;background:#212121}
.ce-edit .CodeMirror{flex:1;height:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55}
.ce-edit textarea.plain{flex:1;background:#212121;color:#eee;font-family:var(--font-mono);padding:10px;border:0;outline:0;resize:none;font-size:13px;tab-size:2}
.ce-split{width:6px;flex:none;background:var(--line);cursor:col-resize;touch-action:none;position:relative;transition:background .15s}
.ce-split:hover,.ce-split.on{background:var(--accent)}
.ce-prev{flex:1 1 42%;min-width:0;background:#fff;display:flex;flex-direction:column;position:relative}
.ce-prev iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.ce-find{display:none;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;background:rgba(127,127,127,.06);flex:none}
.ce-find.open{display:flex}
.ce-find .inp{height:28px;width:170px}
.ce-find .tg{height:28px;min-width:28px;padding:0 7px;font-family:var(--font-mono);font-size:12px}
.ce-find .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);min-width:56px}
.ce-find .cnt.err{color:var(--accent)}
.cm-find-match{background:rgba(217,84,59,.32)}
.cm-find-current{background:rgba(79,163,138,.7);outline:1px solid var(--accent2)}
.cm-trailingspace{background:rgba(217,84,59,.35)}
.CodeMirror-foldmarker{color:var(--accent);text-shadow:none;font-family:var(--font-mono)}
.ce-empty{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:12px;pointer-events:none;text-align:center;background:#f6f6f6}

/* ===== Manga / player / others ===== */
.mg{flex:1;display:flex;flex-direction:column;min-height:0;background:#000}
.mg-tool{background:rgba(0,0,0,.6);color:#ddd;border-color:rgba(255,255,255,.08)}
.mg-tool .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#ddd}
.mg-tool .cnt{font-family:var(--font-mono);font-size:12px;color:#bbb;padding:0 6px;white-space:nowrap}
.mg-scroll{flex:1;overflow:auto;background:#000;--mw:100%;overscroll-behavior:contain}
.mg-scroll img{display:block;margin:0 auto;width:var(--mw);max-width:100%;height:auto;min-height:80px;background:#0a0a0a}
.mg-scroll.fitw img{max-width:none}
.mg-load{color:#888;text-align:center;padding:24px;font-size:12px;font-family:var(--font-mono)}
.win.fs-mode{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border-radius:0;z-index:99999!important}
.win.fs-mode .win-head,.win.fs-mode .mg-tool{display:none}
.fs-exit{position:fixed;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center;z-index:100000;border:1px solid rgba(255,255,255,.25);opacity:.35;transition:.2s}
.fs-exit:hover{opacity:1;background:var(--accent)}
.fs-exit svg{width:18px;height:18px}
.win.fs-mode .fs-exit{display:grid}
.pl{flex:1;display:flex;flex-direction:column;min-height:0;background:#0a0a0c;color:#eee}
.pl-row{flex:1;display:flex;min-height:0}
.pl-stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;background:radial-gradient(80% 60% at 50% 40%,#1a1c22,#08080a)}
.pl-stage video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
.pl-stage canvas{width:100%;height:100%;position:absolute;inset:0}
.pl-meta{position:absolute;left:20px;bottom:16px;font-family:var(--font-display);font-size:18px;text-shadow:0 2px 8px #000;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar{padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;background:#0f1014;border-top:1px solid rgba(255,255,255,.06);flex:none}
.pl-seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.18) var(--p,0%));outline:0;cursor:pointer}
.pl-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.pl-ctl{display:flex;align-items:center;gap:4px;font-size:12px;font-family:var(--font-mono);flex-wrap:wrap}
.pl-ctl .btn{background:transparent;border-color:transparent;color:#eee;height:30px}
.pl-ctl .btn:hover{background:rgba(255,255,255,.12)}
.pl-ctl .btn.on{color:var(--accent)}
.pl-ctl select.inp{background:#1a1c22;border-color:rgba(255,255,255,.1);height:28px;color:#eee}
.pl-ctl input[type=range]{width:80px;accent-color:var(--accent)}
.pl-list{width:210px;flex:none;border-left:1px solid rgba(255,255,255,.08);overflow:auto;font-size:12px;background:#0d0e12}
.pl-list div{padding:8px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;border-left:2px solid transparent}
.pl-list div:hover{background:rgba(255,255,255,.08)}.pl-list div.on{color:var(--accent);border-left-color:var(--accent);background:rgba(255,255,255,.05)}
.br{flex:1;display:flex;flex-direction:column;min-height:0}
.br iframe{flex:1;border:0;background:#fff;width:100%}
.br-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;overflow:auto}
.br-home h1{font-family:var(--font-display);font-size:46px;font-weight:600;letter-spacing:.02em}
.br-home h1 i{color:var(--accent);font-style:normal}
.br-home .links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.br-home .search{max-width:520px;width:100%;height:44px}
.calc{flex:1;display:flex;flex-direction:column;padding:12px;gap:10px;min-height:0}
.calc-disp{flex:none;text-align:right;padding:10px 14px;border-radius:12px;background:rgba(127,127,127,.08);border:1px solid var(--line);min-height:88px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.calc-expr{font-family:var(--font-mono);font-size:13px;color:var(--muted);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-val{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:text}
.calc-hist{flex:none;max-height:72px;overflow:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.calc-hist div{padding:2px 4px;text-align:right;cursor:default}.calc-hist div:hover{color:var(--text)}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:0}
.calc-keys button{border-radius:12px;background:rgba(127,127,127,.1);border:1px solid var(--line);font-size:19px;font-family:var(--font-mono);transition:.1s;display:grid;place-items:center}
.calc-keys button:hover{background:rgba(127,127,127,.2)}.calc-keys button:active{transform:scale(.95)}
.calc-keys button.op{color:var(--accent)}.calc-keys button.eq{background:var(--accent);color:#fff;border-color:transparent}
.calc-keys button.fn{font-size:14px;color:var(--muted)}
.pt{flex:1;display:flex;flex-direction:column;min-height:0}
.pt-wrap{flex:1;overflow:auto;background:repeating-conic-gradient(rgba(127,127,127,.12) 0 25%,transparent 0 50%) 0 0/16px 16px;display:grid;place-items:start;padding:12px}
.pt-wrap canvas{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.3);touch-action:none;cursor:crosshair}
.tool input[type=color]{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:none;cursor:pointer}
.tool input[type=range]{width:90px;accent-color:var(--accent)}
.st{flex:1;display:flex;min-height:0}
.st-nav{width:180px;flex:none;border-right:1px solid var(--line);padding:10px;overflow:auto}
.st-nav .side-it{padding:9px 10px}
.st-pg{flex:1;overflow:auto;padding:22px 26px}
.st-pg h2{font-family:var(--font-display);font-size:24px;margin-bottom:16px;font-weight:600}
.st-sec{margin-bottom:24px}
.st-sec h4{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-bottom:6px;font-family:var(--font-mono);font-weight:500}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.st-row>div:first-child{min-width:0}
.st-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.wall{aspect-ratio:16/10;border-radius:10px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer;transition:.15s;position:relative;overflow:hidden;background-color:var(--bg2)}
.wall:hover{transform:translateY(-2px)}.wall.on{border-color:var(--accent)}
.wall span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.wall.add{display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.swatch:hover{transform:scale(1.1)}
.swatch.on{box-shadow:0 0 0 2px var(--panel-solid),0 0 0 4px var(--text)}
.stor-bar{height:16px;border-radius:8px;background:rgba(127,127,127,.15);overflow:hidden;display:flex;margin:12px 0 10px}
.stor-bar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1);min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}.legend b{width:10px;height:10px;border-radius:3px;flex:none}
.legend em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span{color:var(--muted);margin-left:auto;font-family:var(--font-mono);flex:none}
.big{font-family:var(--font-display);font-size:28px;font-weight:600}
.vm{flex:1;display:flex;flex-direction:column;min-height:0;background:#000}
.vm-screen{flex:1;overflow:auto;display:grid;place-items:center;position:relative}
#screen_container{display:inline-block;position:relative}
#screen_container>div{white-space:pre;font:14px/14px monospace;color:#ddd;background:#000}
#screen_container>canvas{display:block}
.vm-log{font-family:var(--font-mono);font-size:11px;color:#8c8;padding:4px 10px;max-height:64px;overflow:auto;background:#050805;border-top:1px solid #1a2a1a;white-space:pre-wrap;flex:none}
.vm-hint{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:13px;text-align:center;line-height:1.8;pointer-events:none}
.about{display:flex;flex-direction:column;gap:6px;font-size:13px}
.about .logo{font-family:var(--font-display);font-size:56px;font-weight:600;line-height:1}
.about .logo i{color:var(--accent);font-style:normal}
kbd{font-family:var(--font-mono);font-size:11px;background:rgba(127,127,127,.15);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* ===== Mobile / tablet ===== */
@media (max-width:768px){
  :root{--tb-h:60px;--cell-w:84px;--cell-h:98px}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;min-width:0;min-height:0}
  .rs{display:none}
  .win-ctl button.max{display:none}
  #taskbar{padding:0 6px;gap:2px}
  #tb-start{width:50px;height:46px}
  .tb-app{padding:0;width:46px;height:46px;justify-content:center}.tb-app span:last-child{display:none}.tb-app .ico{font-size:24px}
  .tb-app::after{left:14px;right:14px}
  #clock{font-size:11px;padding:0 6px;min-width:0}
  .hide-m,#show-desk{display:none}
  .ex-side{position:absolute;left:0;top:0;bottom:0;z-index:6;background:var(--panel-solid);transform:translateX(-100%);transition:.25s cubic-bezier(.2,.8,.2,1);width:240px;box-shadow:var(--shadow)}
  .ex-side.open{transform:none}
  .ex-list{--c-type:0px;--c-mtime:0px}
  .row .ctype,.row .cmtime,.th.ctype,.th.cmtime{display:none}
  .ce-main{flex-direction:column}
  .ce-split{height:6px;width:auto;cursor:ns-resize}
  .ce-edit{flex-basis:55%}.ce-prev{flex-basis:45%}
  .pl-list{width:150px}
  .st-nav{width:56px;padding:6px}.st-nav .side-it span{display:none}.st-nav .side-it{justify-content:center}
  .st-pg{padding:16px}
  #peek{display:none!important}
  .tool .m-hide{display:none}
}
@media (hover:none){.fs-exit{opacity:.7}}
</style>

<body>
<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="snap-prev"></div>
</div>
<div id="taskbar">
  <button id="tb-start" title="开始"></button>
  <div id="tb-apps"></div>
  <div id="tray">
    <button class="tray-btn hide-m" id="tb-theme" title="切换深浅模式"></button>
    <button class="tray-btn" id="clock"></button>
    <button id="show-desk" title="显示桌面"></button>
  </div>
</div>
<div id="start" class="pop">
  <div id="start-head">
    <div id="start-logo">砚<small>YAN OS</small></div>
    <label class="search"><span class="ico" id="start-search-ic"></span><input id="start-q" placeholder="搜索应用与文件…" autocomplete="off"></label>
  </div>
  <div id="start-grid"></div>
  <div id="start-res"></div>
  <div id="start-foot"></div>
</div>
<div id="calpop" class="pop">
  <div id="cal-time"></div><div id="cal-date"></div>
  <div class="cal-nav"><button id="cal-prev"></button><span id="cal-title"></span><button id="cal-next"></button></div>
  <div class="cal-grid" id="cal-grid"></div>
  <div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="btn" id="cal-today">回到今天</button></div>
</div>
<div id="peek"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   砚 YanOS — 单文件 Web 操作系统
   架构：OPFS (主存储) + IndexedDB (元数据/降级) + localStorage (设置/草稿) + Cookie (主题快速启动)
   ===================================================================== */

/* ---------- 基础工具 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v);}for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const extOf=n=>{const i=n.lastIndexOf('.');return i>0?n.slice(i+1).toLowerCase():'';};
const naturalCmp=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'}).compare;

const IDB={db:null,
  open(){return new Promise(res=>{try{if(!indexedDB)return res(null);const r=indexedDB.open('yanos',1);r.onupgradeneeded=()=>{const d=r.result;for(const s of['meta','handles','files'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s);};r.onsuccess=()=>{IDB.db=r.result;res(r.result);};r.onerror=()=>res(null);r.onblocked=()=>res(null);}catch{res(null);}});},
  _tx(store,mode,fn){return new Promise((res,rej)=>{if(!IDB.db)return res(undefined);try{const t=IDB.db.transaction(store,mode);const q=fn(t.objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});},
  get(s,k){return IDB._tx(s,'readonly',o=>o.get(k)).catch(()=>undefined);},
  set(s,k,v){return IDB._tx(s,'readwrite',o=>o.put(v,k)).catch(()=>{});},
  del(s,k){return IDB._tx(s,'readwrite',o=>o.delete(k)).catch(()=>{});},
  clear(s){return IDB._tx(s,'readwrite',o=>o.clear()).catch(()=>{});},
  async entries(s){const ks=await IDB._tx(s,'readonly',o=>o.getAllKeys()).catch(()=>[]);const vs=await IDB._tx(s,'readonly',o=>o.getAll()).catch(()=>[]);return(ks||[]).map((k,i)=>[k,vs[i]]);}
};

const notFound=p=>Object.assign(new Error('未找到: '+p),{name:'NotFoundError'});
let opfsWorker=null;const workerJobs=new Map();
function opfsWorkerWrite(parts,data){return new Promise(async(res,rej)=>{try{if(!opfsWorker){const src=`self.onmessage=async e=>{const{id,parts,buf}=e.data;try{let d=await navigator.storage.getDirectory();for(let i=0;i<parts.length-1;i++)d=await d.getDirectoryHandle(parts[i],{create:true});const fh=await d.getFileHandle(parts[parts.length-1],{create:true});const h=await fh.createSyncAccessHandle();h.truncate(0);h.write(new Uint8Array(buf),{at:0});h.flush();h.close();self.postMessage({id,ok:true})}catch(err){self.postMessage({id,ok:false,err:String(err)})}}`;opfsWorker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));opfsWorker.onmessage=e=>{const j=workerJobs.get(e.data.id);if(!j)return;workerJobs.delete(e.data.id);e.data.ok?j.res():j.rej(new Error(e.data.err));};}const buf=typeof data==='string'?new TextEncoder().encode(data).buffer:data instanceof Blob?await data.arrayBuffer():data instanceof ArrayBuffer?data:ArrayBuffer.isView(data)?data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength):new TextEncoder().encode(String(data)).buffer;const id=uid();workerJobs.set(id,{res,rej});opfsWorker.postMessage({id,parts,buf},[buf]);}catch(e){rej(e);}});}

class HandleBackend{
  constructor(root,opts={}){this.root=root;this.useWorker=!!opts.worker;this.label=opts.label||'';}
  async _dir(parts,create=false){let h=this.root;for(const p of parts)h=await h.getDirectoryHandle(p,{create});return h;}
  async _fh(path,create=false){const parts=P.parts(path);const name=parts.pop();if(!name)throw new Error('无效路径');const d=await this._dir(parts,create);return d.getFileHandle(name,{create});}
  async stat(path){const parts=P.parts(path);if(!parts.length)return{name:'',kind:'directory',size:0,mtime:0};const name=parts.pop();const d=await this._dir(parts);try{const fh=await d.getFileHandle(name);const f=await fh.getFile();return{name,kind:'file',size:f.size,mtime:f.lastModified,type:f.type};}catch(e){if(e&&e.name==='NotFoundError')throw notFound(path);await d.getDirectoryHandle(name);return{name,kind:'directory',size:0,mtime:0};}}
  async readdir(path){const d=await this._dir(P.parts(path));const out=[];for await(const h of d.values()){if(h.kind==='file'){let f=null;try{f=await h.getFile();}catch{}out.push({name:h.name,kind:'file',size:f?f.size:0,mtime:f?f.lastModified:0,type:f?f.type:''});}else out.push({name:h.name,kind:'directory',size:0,mtime:0});}return out;}
  async mkdir(path){await this._dir(P.parts(path),true);}
  async readFile(path){try{const fh=await this._fh(path);return fh.getFile();}catch(e){if(e&&e.name==='NotFoundError')throw notFound(path);throw e;}}
  async writeFile(path,data){const fh=await this._fh(path,true);if(fh.createWritable&&!this.useWorker){const w=await fh.createWritable();await w.write(data);await w.close();}else await opfsWorkerWrite(P.parts(path),data);}
  async remove(path,recursive){const parts=P.parts(path);const name=parts.pop();const d=await this._dir(parts);await d.removeEntry(name,{recursive:!!recursive});}
  async move(src,dst){const fh=await this._fh(src);if(typeof fh.move!=='function')throw new Error('no move');const parts=P.parts(dst);const name=parts.pop();const d=await this._dir(parts,true);await fh.move(d,name);}
}
class KVBackend{
  constructor(persist){this.map=new Map();this.persist=persist;this.label=persist?'IndexedDB':'Memory';}
  async load(){if(this.persist){for(const[k,v]of await IDB.entries('files'))this.map.set(k,v);}this.map.set('/',{kind:'directory',mtime:0});}
  _save(k){if(!this.persist)return;const v=this.map.get(k);v?IDB.set('files',k,v):IDB.del('files',k);}
  async stat(p){p=P.norm(p);const v=this.map.get(p);if(!v)throw notFound(p);return{name:P.base(p),kind:v.kind,size:v.kind==='file'?v.data.size:0,mtime:v.mtime,type:v.data?.type||''};}
  async readdir(p){p=P.norm(p);if(!this.map.has(p))throw notFound(p);const pre=p==='/'?'/':p+'/';const out=[];for(const[k,v]of this.map){if(k!==p&&k.startsWith(pre)&&!k.slice(pre.length).includes('/'))out.push({name:k.slice(pre.length),kind:v.kind,size:v.data?v.data.size:0,mtime:v.mtime,type:v.data?.type||''});}return out;}
  async mkdir(p){const parts=P.parts(p);let cur='';for(const s of parts){cur+='/'+s;if(!this.map.has(cur)){this.map.set(cur,{kind:'directory',mtime:Date.now()});this._save(cur);}}}
  async readFile(p){p=P.norm(p);const v=this.map.get(p);if(!v||v.kind!=='file')throw notFound(p);return new File([v.data],P.base(p),{type:v.data.type||mimeOf(p),lastModified:v.mtime});}
  async writeFile(p,data){p=P.norm(p);await this.mkdir(P.dir(p));const blob=data instanceof Blob?data:new Blob([data],{type:mimeOf(p)});this.map.set(p,{kind:'file',data:blob,mtime:Date.now()});this._save(p);}
  async remove(p){p=P.norm(p);if(!this.map.has(p))throw notFound(p);for(const k of[...this.map.keys()]){if(k===p||k.startsWith(p+'/')){this.map.delete(k);this._save(k);}}}
}
const VFS={
  mounts:[],backendName:'',
  mount(path,backend,label){path=P.norm(path);this.mounts=this.mounts.filter(m=>m.path!==path);this.mounts.push({path,backend,label:label||P.base(path)});this.mounts.sort((a,b)=>b.path.length-a.path.length);emit('change',{dir:P.dir(path),mounts:true});},
  unmount(path){path=P.norm(path);this.mounts=this.mounts.filter(m=>m.path!==path);emit('change',{dir:P.dir(path),mounts:true});},
  mountAt(path){path=P.norm(path);return this.mounts.find(m=>m.path===path&&m.path!=='/')||null;},
  resolve(path){path=P.norm(path);for(const m of this.mounts){if(m.path==='/')return{m,backend:m.backend,rel:path};if(path===m.path||path.startsWith(m.path+'/'))return{m,backend:m.backend,rel:path.slice(m.path.length)||'/'};}throw new Error('无后端: '+path);},
  async stat(path){path=P.norm(path);const{backend,rel}=this.resolve(path);const s=await backend.stat(rel);s.path=path;s.name=P.base(path)||'/';s.ext=s.kind==='file'?extOf(s.name):'';if(this.mountAt(path))s.mount=true;return s;},
  async exists(path){try{await this.stat(path);return true;}catch{return false;}},
  async readdir(path){path=P.norm(path);const{backend,rel}=this.resolve(path);let list=[];const childMounts=this.mounts.filter(m=>m.path!=='/'&&P.dir(m.path)===path);try{list=await backend.readdir(rel);}catch(e){if(!childMounts.length)throw e;}for(const m of childMounts){const nm=P.base(m.path);const ex=list.find(x=>x.name===nm);if(ex){ex.kind='directory';ex.mount=true;}else list.push({name:nm,kind:'directory',size:0,mtime:0,mount:true});}for(const e of list){e.path=P.join(path,e.name);e.ext=e.kind==='file'?extOf(e.name):'';}if(!S.showHidden)list=list.filter(e=>!e.name.startsWith('.'));return list;},
  async mkdir(path){path=P.norm(path);const{backend,rel}=this.resolve(path);await backend.mkdir(rel);emit('change',{dir:P.dir(path),path});},
  async readFile(path,opt){path=P.norm(path);const{backend,rel}=this.resolve(path);const f=await backend.readFile(rel);let as=typeof opt==='string'?opt:(opt&&(opt.as||opt.encoding))||'text';as=String(as).toLowerCase();if(as==='utf8'||as==='utf-8')as='text';if(as==='file'||as==='blob')return f;if(as==='arraybuffer'||as==='buffer'||as==='binary')return f.arrayBuffer();if(as==='url')return URL.createObjectURL(f);if(as==='dataurl')return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});return f.text();},
  async writeFile(path,data){path=P.norm(path);const{backend,rel}=this.resolve(path);if(data==null)data='';await backend.writeFile(rel,data);thumbCache.delete(path);dragCache.delete(path);emit('change',{dir:P.dir(path),path});},
  async remove(path){path=P.norm(path);if(this.mountAt(path)){this.unmount(path);return;}const{backend,rel}=this.resolve(path);const st=await backend.stat(rel);await backend.remove(rel,st.kind==='directory');thumbCache.delete(path);dragCache.delete(path);emit('change',{dir:P.dir(path),path,removed:true});},
  unlink(p){return this.remove(p);},rmdir(p){return this.remove(p);},
  async copy(src,dst,onItem){src=P.norm(src);dst=P.norm(dst);const st=await this.stat(src);if(st.kind==='directory'){if(dst===src||dst.startsWith(src+'/'))throw new Error('不能复制到自身内部');await this.mkdir(dst);for(const e of await this.readdir(src))await this.copy(e.path,P.join(dst,e.name),onItem);}else{const f=await this.readFile(src,'file');await this.writeFile(dst,f);onItem&&onItem(src);}},
  async move(src,dst){src=P.norm(src);dst=P.norm(dst);if(src===dst)return;if(dst.startsWith(src+'/'))throw new Error('不能移动到自身内部');const a=this.resolve(src),b=this.resolve(dst);if(a.backend===b.backend&&a.backend.move){try{const st=await a.backend.stat(a.rel);if(st.kind==='file'){await a.backend.move(a.rel,b.rel);thumbCache.delete(src);dragCache.delete(src);emit('change',{dir:P.dir(src),path:src,removed:true});emit('change',{dir:P.dir(dst),path:dst});return;}}catch(e){}}await this.copy(src,dst);await this.remove(src);},
  rename(src,dst){return this.move(src,dst);},
  async uniqueName(dir,name){let n=name,i=1;const stem=P.stem(name),ext=extOf(name);while(await this.exists(P.join(dir,n))){n=ext?`${stem} (${i}).${ext}`:`${stem} (${i})`;i++;}return n;},
  async walk(dir,fn,depth=8){let list;try{list=await this.readdir(dir);}catch{return true;}for(const e of list){if(await fn(e)===false)return false;if(e.kind==='directory'&&depth>0&&!e.mount){if(await this.walk(e.path,fn,depth-1)===false)return false;}}return true;},

/* fs 代理：支持 Promise 与 Node 风格回调，忽略多余参数（如 stat(path,isLstat)） */
const fs=new Proxy(VFS,{get(t,k){const v=t[k];if(typeof v!=='function')return v;return function(...args){let cb=null;if(typeof args[args.length-1]==='function')cb=args.pop();const p=Promise.resolve().then(()=>v.apply(t,args));if(cb){p.then(r=>cb(null,r),e=>cb(e));return;}return p;};}});

const ROOT_DIRS=['/Desktop','/Documents','/Pictures','/Music','/Videos','/Downloads','/mnt','/mnt/local','/System','/System/Wallpapers'];
async function initFS(){
  await IDB.open();let backend=null;
  try{if(navigator.storage&&navigator.storage.getDirectory){const root=await navigator.storage.getDirectory();const probe=await root.getFileHandle('.probe',{create:true});backend=new HandleBackend(root,{worker:typeof probe.createWritable!=='function',label:'OPFS'});try{await backend.writeFile('/.probe','ok');}catch(e){if(!backend.useWorker){backend.useWorker=true;await backend.writeFile('/.probe','ok');}else throw e;}VFS.backendName='OPFS'+(backend.useWorker?' (Worker)':'');}}catch(e){console.warn('OPFS 不可用，降级',e);backend=null;}
  if(!backend){backend=new KVBackend(!!IDB.db);await backend.load();VFS.backendName=IDB.db?'IndexedDB (降级)':'内存 (不持久)';}
  VFS.mount('/',backend,'本机');
  for(const d of ROOT_DIRS){try{await VFS.mkdir(d);}catch{}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch{}
}
async function seedFS(){

async function addLocalMount(h,persist){let name=h.name;const taken=VFS.mounts.map(m=>P.base(m.path));let i=1;while(taken.includes(name))name=`${h.name} (${i++})`;VFS.mount('/mnt/local/'+name,new HandleBackend(h,{label:h.name}),h.name);if(persist)await IDB.set('handles',name,h);ui.toast(`已挂载本地文件夹「${h.name}」`,{action:'打开',onAction:()=>Explorer.open({path:'/mnt/local/'+name})});return'/mnt/local/'+name;}

/* 物理桌面 → 虚拟桌面：递归遍历 FileSystemEntry，readEntries 循环直到为空 */

async function makeZip(entries){if(window.JSZip){const z=new JSZip();for(const e of entries)z.file(e.name,e.blob);return z.generateAsync({type:'blob',compression:'DEFLATE'});}
  const T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})();const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return(~c)>>>0;};
  const enc=new TextEncoder();const parts=[],cd=[];let off=0;const d=new Date();const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const e of entries){const data=new Uint8Array(await e.blob.arrayBuffer());const nm=enc.encode(e.name);const crc=crc32(data);const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);parts.push(lh.buffer,nm,data);const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);cd.push(ch.buffer,nm);off+=30+nm.length+data.length;}
  const cdSize=cd.reduce((s,b)=>s+b.byteLength,0);const eo=new DataView(new ArrayBuffer(22));eo.setUint32(0,0x06054b50,true);eo.setUint16(8,entries.length,true);eo.setUint16(10,entries.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);return new Blob([...parts,...cd,eo.buffer],{type:'application/zip'});}
/* ---------- 解压：zip / gz / tar / tgz 原生；7z rar xz bz2 等走 7z-wasm ---------- */
const Archive={
  async extract(path){const name=P.base(path),ext=extOf(name);let stem=P.stem(name);if(stem.toLowerCase().endsWith('.tar'))stem=stem.slice(0,-4);const dir=P.dir(path);const prog=ui.progress('正在解压 '+name);try{const buf=await fs.readFile(path,'arrayBuffer');const files=await this.unpack(buf,ext,name,prog);const dest=P.join(dir,await fs.uniqueName(dir,stem||'解压'));await fs.mkdir(dest);let n=0;for(const f of files){const p=P.join(dest,f.name);if(f.dir){await fs.mkdir(p);continue;}prog.set(f.name);await fs.mkdir(P.dir(p));await fs.writeFile(p,f.data instanceof Blob?f.data:new Blob([f.data],{type:mimeOf(f.name)}));n++;}prog.done();ui.toast(`已解压 ${n} 个文件到「${P.base(dest)}」`,{action:'打开',onAction:()=>Explorer.open({path:dest})});return dest;}catch(e){prog.done();console.error(e);ui.alert('解压失败：'+(e.message||e),'解压缩');}},
  async unpack(buf,ext,name,prog){const lower=name.toLowerCase();if(ext==='zip')return this.unzip(buf);if(lower.endsWith('.tar.gz')||ext==='tgz')return this.untar(await this.gunzip(buf));if(ext==='gz')return[{name:P.stem(name),data:await this.gunzip(buf)}];if(ext==='tar')return this.untar(buf);return this.seven(buf,name,prog);},
  async gunzip(buf){if(!window.DecompressionStream)throw new Error('浏览器不支持 DecompressionStream');return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();},
  async unzip(buf){if(window.JSZip){const z=await JSZip.loadAsync(buf);const out=[];for(const[n,f]of Object.entries(z.files)){if(f.dir)out.push({name:n.replace(/\/$/,''),dir:true});else out.push({name:n,data:await f.async('uint8array')});}return out;}return this.nativeUnzip(buf);},
  async nativeUnzip(buf){const dv=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}if(eocd<0)throw new Error('无效的 ZIP 文件');const n=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);const out=[];const td=new TextDecoder();
    for(let i=0;i<n;i++){if(dv.getUint32(off,true)!==0x02014b50)break;const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);const nm=td.decode(u8.subarray(off+46,off+46+nl));off+=46+nl+xl+cl;const lnl=dv.getUint16(lho+26,true),lxl=dv.getUint16(lho+28,true);const start=lho+30+lnl+lxl;const data=u8.slice(start,start+csize);if(nm.endsWith('/')){out.push({name:nm.slice(0,-1),dir:true});continue;}let raw;if(method===0)raw=data;else if(method===8)raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else throw new Error('不支持的压缩方式 '+method);out.push({name:nm,data:raw});}return out;},
  untar(buf){const u8=new Uint8Array(buf);const td=new TextDecoder();const out=[];let off=0,longName=null;const str=(s,l)=>{let e=s;while(e<s+l&&u8[e]!==0)e++;return td.decode(u8.subarray(s,e));};
    while(off+512<=u8.length){if(u8[off]===0)break;let name=str(off,100);const size=parseInt(str(off+124,12).trim()||'0',8)||0;const type=String.fromCharCode(u8[off+156]);const prefix=str(off+345,155);if(prefix&&str(off+257,5)==='ustar')name=prefix+'/'+name;if(longName){name=longName;longName=null;}const ds=off+512;if(type==='L')longName=str(ds,size);else if(type==='5')out.push({name:name.replace(/\/$/,''),dir:true});else if(type==='0'||type==='\0'||type===' '||type==='7')out.push({name,data:u8.slice(ds,ds+size)});off=ds+Math.ceil(size/512)*512;}return out;},
  async seven(buf,name,prog){if(!window.SevenZip)throw new Error('7z 引擎未加载（需要网络连接以加载 7z-wasm）');prog.set('初始化 7z 引擎…');const sz=await window.SevenZip({print:()=>{},printErr:()=>{}});const inName='/in_'+name.replace(/[^\w.\-]/g,'_');sz.FS.writeFile(inName,new Uint8Array(buf));try{sz.FS.mkdir('/out');}catch{}sz.callMain(['x',inName,'-o/out','-y']);const out=[];const walk=(d,rel)=>{for(const n of sz.FS.readdir(d)){if(n==='.'||n==='..')continue;const p=d+'/'+n,r=rel?rel+'/'+n:n;const st=sz.FS.stat(p);if(sz.FS.isDir(st.mode)){out.push({name:r,dir:true});walk(p,r);}else out.push({name:r,data:sz.FS.readFile(p)});}};walk('/out','');if(!out.length)throw new Error('未能解出任何文件（可能不支持该格式或已加密）');return out;}
};

const Desktop={
  layer:null,items:[],pos:{},cell:{w:92,h:104},pad:{x:12,y:12},sel:new Set(),ready:false,
  async init(){this.layer=$('#icons');await this.loadPos();this.measure();const L=this.layer;

    try{const p=JSON.parse(localStorage.getItem('yanos.pinned'));if(Array.isArray(p)){PINNED.length=0;PINNED.push(...p.filter(a=>APPS[a]));}}catch{}

  async loadPos(){this.pos=(await IDB.get('meta','iconpos'))||{};if(!Object.keys(this.pos).length){try{this.pos=JSON.parse(localStorage.getItem('yanos.iconpos')||'{}');}catch{}}},

  cols(){return Math.max(1,Math.floor((this.layer.clientWidth-this.pad.x)/this.cell.w));},rows(){return Math.max(1,Math.floor((this.layer.clientHeight-this.pad.y)/this.cell.h));},
  async refresh(){let entries=[];try{entries=await fs.readdir('/Desktop');}catch{}this.items=[...PINNED.map(a=>({id:'app:'+a,kind:'app',app:a,name:APPS[a].name})),...entries.map(e=>({...e,id:e.path}))];const ids=new Set(this.items.map(i=>i.id));for(const k of Object.keys(this.pos))if(!ids.has(k)&&!k.startsWith('app:'))delete this.pos[k];this.render();},
  render(){if(!this.layer)return;const rows=this.rows();const occ=new Map();for(const it of this.items){const p=this.pos[it.id];if(p&&p.r<rows&&p.c>=0&&!occ.has(p.c+','+p.r)){occ.set(p.c+','+p.r,it.id);it._p=p;}else it._p=null;}
    let c=0,r=0;for(const it of this.items){if(it._p)continue;while(occ.has(c+','+r)){r++;if(r>=rows){r=0;c++;}}it._p={c,r};occ.set(c+','+r,it.id);this.pos[it.id]=it._p;}
    const existing=new Map($$('.dicon',this.layer).map(e=>[e.dataset.id,e]));
    this.items.forEach((it,i)=>{let e=existing.get(it.id);if(!e){e=this.makeIcon(it);e.style.setProperty('--i',Math.min(i,20));this.layer.append(e);}else{existing.delete(it.id);e._item=it;const lb=e.querySelector('.dlb');if(lb.textContent!==it.name)lb.textContent=it.name;e.dataset.kind=it.kind;}e.style.left=(this.pad.x+it._p.c*this.cell.w)+'px';e.style.top=(this.pad.y+it._p.r*this.cell.h)+'px';e.classList.toggle('sel',this.sel.has(it.id));});

  makeIcon(it){const e=el('div',{class:'dicon',draggable:'true','data-id':it.id,'data-kind':it.kind,'data-path':it.path||'',title:it.name,html:`<div class="dic">${iconFor(it)}</div><div class="dlb">${esc(it.name)}</div>`});e._item=it;applyThumb(e.querySelector('.dic'),it);
    e.addEventListener('click',ev=>{ev.stopPropagation();this.click(e._item,ev);});
    e.addEventListener('dblclick',ev=>{ev.stopPropagation();if(!S.singleClick)this.openItem(e._item);});

    async function start(){const Ctor=window.V86||window.V86Starter;if(!Ctor)return ui.alert('v86 引擎未加载（需要网络连接）。','虚拟机');if(!imgPath&&!imgFile)return ui.alert('请先选择启动镜像 (.iso / .img)。','虚拟机');if(emu)stop();const name=imgFile?imgFile.name:P.base(imgPath);L('读取镜像 '+name+' …');let buf;try{buf=imgFile?await imgFile.arrayBuffer():await fs.readFile(imgPath,'arrayBuffer');}catch(e){return ui.alert('读取镜像失败：'+e.message);}const ext=extOf(name);const memMB=+mem.value;S.vmMem=memMB;
      const opts={wasm_path:VM.V86_WASM,memory_size:memMB*1024*1024,vga_memory_size:8*1024*1024,screen_container:sc,bios:{url:VM.BIOS},vga_bios:{url:VM.VGABIOS},autostart:true,disable_mouse:false,disable_keyboard:false};
      const img={buffer:buf};if(ext==='iso'){opts.cdrom=img;opts.boot_order=0x213;L('挂载为 CD-ROM');}else if(['img','fda','bin','ima'].includes(ext)&&buf.byteLength<=2949120){opts.fda=img;opts.boot_order=0x321;L('挂载为软盘 (fda)');}else{opts.hda=img;opts.boot_order=0x132;L('挂载为硬盘 (hda)');}
      try{emu=new Ctor(opts);}catch(e){return ui.alert('创建模拟器失败：'+e.message);}hint.style.display='none';running=true;bStop.disabled=false;bStart.disabled=true;
      emu.add_listener('emulator-ready',()=>L('模拟器就绪 (v86 0.5.319)'));emu.add_listener('emulator-started',()=>L('已启动 — 点击屏幕锁定鼠标，Esc 释放'));emu.add_listener('emulator-stopped',()=>L('已停止'));let serial='';emu.add_listener('serial0-output-byte',b=>{const c=String.fromCharCode(b);if(c==='\n'){if(serial.trim())L('[serial] '+serial);serial='';}else serial+=c;});}
    function stop(){if(!emu)return;try{emu.stop();}catch{}try{emu.destroy&&emu.destroy();}catch{}emu=null;running=false;bStop.disabled=true;bStart.disabled=false;if(document.pointerLockElement)document.exitPointerLock();hint.style.display='';L('虚拟机已停止');}
    function lockMouse(){if(!emu)return ui.toast('请先启动虚拟机');try{emu.lock_mouse();}catch{const c=sc.querySelector('canvas');c.requestPointerLock&&c.requestPointerLock();}}
    sc.addEventListener('click',()=>{if(running&&S.vmClickLock&&!document.pointerLockElement)lockMouse();});
    const focusWatch=e=>{if(!emu)return;const inside=win.el.contains(e.target);try{emu.keyboard_set_status(inside&&kb);}catch{}};document.addEventListener('pointerdown',focusWatch);
    return()=>{document.removeEventListener('pointerdown',focusWatch);stop();};
  }
};

/* =====================================================================
   全局事件 & 启动
   ===================================================================== */
function bindGlobal(){
  $('#tb-theme').addEventListener('click',toggleTheme);$('#show-desk').addEventListener('click',()=>WM.showDesktop());
  document.addEventListener('contextmenu',e=>{if(e.target.closest('input,textarea,.CodeMirror,[contenteditable],iframe'))return;e.preventDefault();});
  document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());
  document.addEventListener('dragend',()=>DnD.end());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){ui.closeMenus();Start.close();Calendar.close();}const inField=e.target.closest('input,textarea,select,[contenteditable],.CodeMirror');if(inField)return;if(e.target===document.body||e.target===$('#icons')||e.target.id==='desktop'){if(!WM.active||WM.wins.get(WM.active)?.min)Desktop.keys(e);}if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();toggleTheme();}if(e.key==='Meta'&&!e.repeat&&!WM.mobile()){}});
  addEventListener('keyup',e=>{if(e.key==='Meta'&&!e.ctrlKey&&!e.altKey&&!e.shiftKey&&e.target===document.body)Start.toggle();});
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.theme==='auto')applySettings();});
  matchMedia('(max-width:768px)').addEventListener('change',ev=>{WM.wins.forEach(w=>{if(ev.matches){w.max=true;w.el.classList.add('max');}else{w.max=false;w.el.classList.remove('max');w.bMax.innerHTML=I.max;}WM._notify(w);});});
  document.addEventListener('fullscreenchange',()=>{});
}
async function boot(){
  loadSettings();applySettings();
  await initFS();try{await seedFS();}catch(e){console.warn(e);}
  await Desktop.init();await Desktop.refresh();applyWallpaper();
  Start.build();Calendar.init();Clock.start();bindGlobal();
  restoreMounts();
  const focusIcons=$('#icons');focusIcons.addEventListener('pointerdown',()=>{if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();});
  console.log('%c砚 YanOS %c ready · backend: '+VFS.backendName,'color:#d9543b;font-weight:bold','color:#888');
}
boot().catch(e=>{console.error(e);ui.toast('启动异常：'+e.message,{duration:0});});
</script>
