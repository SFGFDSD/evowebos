    tb.appendChild(btn(Icons.unfold,'展开全部',()=>cm.eachLine(h=>{cm.unfoldCode(h);})));
    tb.appendChild(el('div','t-sep'));
    tb.appendChild(btn(Icons.find,'查找替换 (Ctrl+F)',()=>openFind(false)));
    tb.appendChild(btn(Icons.undo,'撤销',()=>cm.undo()));
    tb.appendChild(btn(Icons.redo,'重做',()=>cm.redo()));
    tb.appendChild(el('div','t-sep'));
    const modeSel=el('select');
    [['HTML','htmlmixed'],['CSS','css'],['JavaScript','javascript'],['Markdown','markdown'],['JSON','application/json'],['XML','xml']].forEach(([n,v])=>{const o=el('option');o.value=v;o.textContent=n;if(v===mode)o.selected=true;modeSel.appendChild(o);});
    modeSel.onchange=()=>{mode=modeSel.value;cm.setOption('mode',mode);updateStatus();};
    tb.appendChild(modeSel);
    tb.appendChild(el('div','t-sep'));
    tb.appendChild(btn(Icons.upload,'导入',()=>{const inp=el('input');inp.type='file';inp.onchange=async()=>{const f=inp.files[0];const t=await f.text();cm.setValue(t);filePath='/桌面/'+f.name;saveDir='/桌面';mode=modeForFile(f.name);modeSel.value=mode;cm.setOption('mode',mode);updateTitle();};inp.click();}));
    tb.appendChild(btn(Icons.download,'导出',exportFile));
    tb.appendChild(btn(Icons.save,'保存 (Ctrl+S)',save));
    tb.appendChild(btn(Icons.clear,'清空',()=>{if(confirm('清空所有内容？'))cm.setValue('');}));
    tb.appendChild(btn(Icons.external,'在新窗口打开',()=>{const blob=new Blob([cm.getValue()],{type:'text/html'});window.open(URL.createObjectURL(blob));}));

    // 状态栏
    function updateStatus(){
      const c=cm.getCursor();
      const sel=cm.getSelection().length;
      const lines=cm.lineCount(),chars=cm.getValue().length;
      const langName={htmlmixed:'HTML',css:'CSS',javascript:'JavaScript',markdown:'Markdown','application/json':'JSON',xml:'XML'}[mode]||mode;
      $('#ed-sb',body).innerHTML=`<span class="sb-item">行 ${c.line+1}, 列 ${c.ch+1}</span>${sel?`<span class="sb-item">已选 ${sel} 字符</span>`:''}<span class="sb-spacer"></span><span class="sb-item">总行 ${lines}</span><span class="sb-item">字符 ${chars}</span><span class="sb-item">${langName}</span><span class="sb-item">UTF-8</span>`;
    }
    cm.on('cursorActivity',updateStatus);
    cm.on('change',()=>{updateStatus();updateTitle();schedulePreview();});
    function updateTitle(){rec.titleEl.textContent='HTML编辑器 — '+(filePath?fs.basename(filePath):'未命名');}

    function modeForFile(p){
      const e=extOf(p);
      if(['html','htm'].includes(e))return 'htmlmixed';
      if(e==='css')return 'css';
      if(['js','mjs'].includes(e))return 'javascript';
      if(e==='json')return 'application/json';
      if(['md','markdown'].includes(e))return 'markdown';
      if(['xml','svg'].includes(e))return 'xml';
      return 'htmlmixed';
    }

    // 预览
    let pt=null;
    function schedulePreview(){clearTimeout(pt);pt=setTimeout(updatePreview,500);}
    function updatePreview(){
      const frame=$('#ed-preview',body);
      const code=cm.getValue();
      try{
        const doc=frame.contentDocument||frame.contentWindow.document;
        doc.open();doc.write(code);doc.close();
      }catch(e){
        const blob=new Blob([code],{type:'text/html'});
        frame.src=URL.createObjectURL(blob);
      }
    }
    function runPreview(){updatePreview();toast('已运行','ok');}

    // 格式化
    function format(){
      const code=cm.getValue();
      let out=code;
      try{
        if(mode==='htmlmixed'||mode==='xml'){out=html_beautify(code,{indent_size:2,indent_inner_html:true,wrap_line_length:120,end_with_newline:true});}
        else if(mode==='css'){out=css_beautify(code,{indent_size:2});}
        else if(mode==='javascript'){out=js_beautify(code,{indent_size:2,end_with_newline:true});}
        else if(mode==='application/json'){out=JSON.stringify(JSON.parse(code),null,2);}
        const cur=cm.getCursor();
        cm.setValue(out);
        cm.setCursor(cur);
        toast('已格式化','ok');
      }catch(e){toast('格式化失败: '+e.message,'err');}
    }

    // 保存
    async function save(){
      const p=filePath||(saveDir+'/未命名.html');
      try{
        await fs.writeFile(p,cm.getValue());
        filePath=p;saveDir=fs.dirname(p);updateTitle();
        toast('已保存到 '+p,'ok');
        refreshDirWindows(saveDir);Desktop.refresh();
      }catch(e){toast(e.message,'err');}
    }

    // 导出
    function exportFile(){
      const ext={htmlmixed:'.html',css:'.css',javascript:'.js',markdown:'.md','application/json':'.json',xml:'.xml'}[mode]||'.html';
      const name=(filePath?fs.basename(filePath).replace(/\.[^.]+$/,''):'导出')+ext;
      const blob=new Blob([cm.getValue()],{type:'text/plain'});
      const a=el('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    }

    // 查找替换
    const findBar=$('#ed-find',body);
    let findState={query:'',replace:'',case:false,word:false,re:false,marks:[],cur:0};
    function openFind(focusRep){
      findBar.classList.add('open');
      $('#ed-f-find',body).focus();
      if(focusRep)$('#ed-f-rep',body).focus();
    }
    function closeFind(){findBar.classList.remove('open');clearMarks();}
    function clearMarks(){findState.marks.forEach(m=>m.clear());findState.marks=[];}
    function doFind(){
      clearMarks();
      const q=$('#ed-f-find',body).value;
      findState.query=q;findState.replace=$('#ed-f-rep',body).value;
      if(!q){$('#ed-f-cnt',body).textContent='0/0';return;}
      let regex;
      try{
        if(findState.re)regex=new RegExp(q,'g'+(findState.case?'':'i'));
        else{const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');regex=new RegExp(findState.word?('\\b'+esc+'\\b'):esc,'g'+(findState.case?'':'i'));}
      }catch(e){$('#ed-f-cnt',body).textContent='无效正则';return;}
      const cm2=cm;findState.cur=0;let idx=0;
      cm2.eachLine(h=>{
        const line=h.text;let m;
        const lr=new RegExp(regex.source,regex.flags);
        while((m=lr.exec(line))){
          const mark=cm2.markText({line:h.lineNo(),ch:m.index},{line:h.lineNo(),ch:m.index+m[0].length},{className:'CodeMirror-search-match'});
          findState.marks.push(mark);idx++;
        }
        if(m&&m.index===lr.lastIndex)lr.lastIndex++;
      });
      $('#ed-f-cnt',body).textContent=findState.marks.length?('1/'+findState.marks.length):'0/0';
      if(findState.marks.length){findState.cur=0;gotoMark(0);}
    }
    function gotoMark(i){
      if(!findState.marks.length)return;
      findState.cur=(i+findState.marks.length)%findState.marks.length;
      findState.marks.forEach((m,k)=>{m.className=k===findState.cur?'CodeMirror-search-match-current':'CodeMirror-search-match';});
      const loc=findState.marks[findState.cur].find();
      if(loc)cm.scrollIntoView(loc,50),cm.setCursor(loc.from);
      $('#ed-f-cnt',body).textContent=(findState.cur+1)+'/'+findState.marks.length;
    }
    function findNext(){if(!findState.marks.length)doFind();gotoMark(findState.cur+1);}
    function findPrev(){gotoMark(findState.cur-1);}
    function replaceOne(){
      if(!findState.marks.length)return;
      const m=findState.marks[findState.cur];const loc=m.find();if(loc){cm.replaceRange(findState.replace,loc.from,loc.to);}
      doFind();
    }
    function replaceAll(){
      if(!findState.query)return;
      let regex;
      try{
        if(findState.re)regex=new RegExp(findState.query,'g'+(findState.case?'':'i'));
        else{const esc=findState.query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');regex=new RegExp(findState.word?('\\b'+esc+'\\b'):esc,'g'+(findState.case?'':'i'));}
      }catch(e){return;}
      const val=cm.getValue().replace(regex,findState.replace);
      cm.setValue(val);
      toast('已替换','ok');
    }
    $('#ed-f-find',body).addEventListener('input',doFind);
    $('#ed-f-rep',body).addEventListener('input',()=>findState.replace=$('#ed-f-rep',body).value);
    $('#ed-f-case',body).onclick=function(){this.classList.toggle('active');findState.case=this.classList.contains('active');doFind();};
    $('#ed-f-word',body).onclick=function(){this.classList.toggle('active');findState.word=this.classList.contains('active');doFind();};
    $('#ed-f-re',body).onclick=function(){this.classList.toggle('active');findState.re=this.classList.contains('active');doFind();};
    $('#ed-f-next',body).onclick=findNext;
    $('#ed-f-prev',body).onclick=findPrev;
    $('#ed-f-repone',body).onclick=replaceOne;
    $('#ed-f-repall',body).onclick=replaceAll;
    $('#ed-f-close',body).onclick=closeFind;
    $('#ed-f-find',body).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.shiftKey?findPrev():findNext();}if(e.key==='Escape')closeFind();});

    // 分割条拖拽
    const split=$('#ed-split',body),pane=$('#ed-pane',body),vsplit=$('#ed-vsplit',body),preview=$('#ed-preview',body).parentElement;
    let dragging=false;
    vsplit.addEventListener('mousedown',e=>{dragging=true;e.preventDefault();document.body.style.cursor='col-resize';});
    document.addEventListener('mousemove',e=>{if(!dragging)return;const r=split.getBoundingClientRect();let x=e.clientX-r.left;const w=split.offsetWidth;x=clamp(x,200,w-120);pane.style.flex='0 0 '+x+'px';preview.style.flex='1';cm.refresh();});
    document.addEventListener('mouseup',()=>{if(dragging){dragging=false;document.body.style.cursor='';cm.refresh();}});

    updateTitle();updateStatus();updatePreview();
    setTimeout(()=>cm.refresh(),100);
    return rec;
  }
});
</script>
<script>
/* ============================================================
   漫画阅读器 Manga Viewer
   ============================================================ */
Apps.register({
  id:'manga',name:'漫画阅读器',icon:Icons.manga,
  async launch(args){
    const rec=WM.create({app:'manga',title:'漫画阅读器',icon:Icons.manga,width:900,height:680,x:70,y:50});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="manga-app"><div class="manga-bar" id="mg-bar"><span id="mg-count">加载中...</span><button class="t-btn" id="mg-fs">${Icons.fullscreen}</button></div><div class="manga-scroll" id="mg-scroll"><div class="manga-loading">正在加载图片...</div></div></div>`;
    const scroll=$('#mg-scroll',body),bar=$('#mg-bar',body);
    const startPath=args.path;
    const dir=startPath?fs.dirname(startPath):'/图片';
    const startName=startPath?fs.basename(startPath):null;
    try{
      const items=await fs.readdir(dir);
      const imgs=items.filter(it=>it.type==='file'&&IMG_EXTS.includes(extOf(it.name)))
        .map(it=>it.name)
        .sort((a,b)=>a.localeCompare(b,'zh',{numeric:true,sensitivity:'base'}));
      if(!imgs.length){scroll.innerHTML='<div class="manga-loading">该目录无图片</div>';return;}
      $('#mg-count',body).textContent='0 / '+imgs.length;
      // 并行读取
      const blobs=await Promise.all(imgs.map(async n=>{try{const buf=await fs.readFile(fs.join(dir,n),{arrayBuffer:true});return {name:n,blob:new Blob([buf],{type:guessMime(n)})};}catch(e){return {name:n,blob:null};}}));
      scroll.innerHTML='';
      let loadedIdx=-1;
      blobs.forEach((b,i)=>{
        if(!b.blob)return;
        const img=el('img');img.src=URL.createObjectURL(b.blob);img.dataset.idx=i;img.alt=b.name;
        img.onload=()=>{loadedIdx++;$('#mg-count',body).textContent=(loadedIdx+1)+' / '+imgs.length;};
        scroll.appendChild(img);
      });
      // 定位到点击的图片
      if(startName){
        setTimeout(()=>{const idx=imgs.indexOf(startName);const target=scroll.querySelector(`img[data-idx="${idx}"]`);if(target)target.scrollIntoView();},300);
      }
    }catch(e){scroll.innerHTML='<div class="manga-loading">加载失败: '+e.message+'</div>';}

    // 全屏
    const exitBtn=$('#manga-exit-global');
    function enterFs(){
      body.querySelector('.manga-app').classList.add('fullscreen');
      rec.el.querySelector('.titlebar').style.display='none';
      if(rec.el.requestFullscreen)rec.el.requestFullscreen();
      else document.documentElement.requestFullscreen();
    }
    function exitFs(){
      body.querySelector('.manga-app').classList.remove('fullscreen');
      rec.el.querySelector('.titlebar').style.display='';
      if(document.fullscreenElement)document.exitFullscreen();
    }
    $('#mg-fs',body).onclick=enterFs;
    exitBtn.onclick=exitFs;
    document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){body.querySelector('.manga-app').classList.remove('fullscreen');rec.el.querySelector('.titlebar').style.display='';}});
    return rec;
  }
});

/* ============================================================
   设置 Settings
   ============================================================ */
const Settings=(function(){
  function refresh(){ WM.getWindows().filter(w=>w.config.app==='settings').forEach(w=>{if(w._render)w._render();}); }
  return {refresh};
})();
Apps.register({
  id:'settings',name:'设置',icon:Icons.settings,singleton:true,
  launch(){
    const rec=WM.create({app:'settings',title:'设置',icon:Icons.settings,width:760,height:540,x:100,y:70});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="settings-app"><div class="s-nav" id="st-nav"></div><div class="s-main" id="st-main"></div></div>`;
    let cur='storage';
    const nav=[
      {id:'storage',n:'存储',i:Icons.drive},
      {id:'appearance',n:'外观',i:Icons.palette},
      {id:'mounts',n:'挂载',i:Icons.mount},
      {id:'about',n:'关于',i:Icons.info},
    ];
    function renderNav(){
      const n=$('#st-nav',body);n.innerHTML='';
      nav.forEach(it=>{const e=el('div','s-item'+(cur===it.id?' active':''),`${it.i}<span class="nm">${it.n}</span>`);e.onclick=()=>{cur=it.id;render();};n.appendChild(e);});
    }
    rec._render=render;
    async function render(){
      renderNav();const m=$('#st-main',body);
      if(cur==='storage'){
        const u=await fs.usage();
        const pct=u.quota?(u.usage/u.quota*100):0;
        // 各目录大小
        const dirs=[['/桌面','桌面', '#e0a648'],['/文档','文档','#7baa6e'],['/图片','图片','#5b9ea8'],['/音乐','音乐','#9b6b8e'],['/视频','视频','#c96a4a'],['/下载','下载','#a87a33']];
        let sizes=[];
        for(const [p,n,c] of dirs){const s=await fs.dirSize(p);sizes.push({p,n,c,s});}
        const total=sizes.reduce((a,b)=>a+b.s,0);
        m.innerHTML=`<div class="s-section"><h3>存储用量</h3>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>已用 ${fmtSize(u.usage)} / ${fmtSize(u.quota)}</span><span style="color:var(--amber)">${pct.toFixed(1)}%</span></div>
          <div class="storage-bar"><div class="seg" style="width:${pct}%;background:var(--amber)"></div></div>
          <div class="storage-legend">${sizes.map(s=>`<div class="lg"><span class="sw" style="background:${s.c}"></span>${s.n} ${fmtSize(s.s)}</div>`).join('')}<div class="lg"><span class="sw" style="background:var(--text-mute)"></span>其他 ${fmtSize(Math.max(0,u.usage-total))}</div></div>
          <div style="margin-top:14px;font-size:12px;color:var(--text-mute)">存储后端：${fs.isOpfs()?'OPFS（持久化）':'内存（降级，刷新丢失）'}</div>
        </div>
        <div class="s-section"><h3>危险操作</h3>
          <div class="s-row"><div><div class="lbl">重置文件系统</div><div class="desc">清除所有 OPFS 数据、桌面布局与设置</div></div><button class="btn" id="st-reset" style="border-color:var(--rust);color:var(--rust)">一键重置</button></div>
        </div>`;
        $('#st-reset',body).onclick=async()=>{if(await confirmDialog('确定重置？所有文件将被删除！')){await fs.resetAll();toast('已重置','ok');Desktop.load();render();}};
      }else if(cur==='appearance'){
        const s=loadSettings();
        const wallpapers=[
          {n:'墨砚',url:''},
          {n:'琥珀',url:'linear-gradient(160deg,#2a1f10,#0a0907)'},
          {n:'青苔',url:'linear-gradient(160deg,#1a2a1f,#0a0907)'},
          {n:'深海',url:'linear-gradient(160deg,#0a1a2a,#0a0907)'},
        ];
        m.innerHTML=`<div class="s-section"><h3>壁纸</h3>
          <div class="wallpaper-grid" id="st-wp"></div>
          <button class="btn" id="st-wp-up" style="margin-top:10px">${Icons.upload} 上传自定义壁纸</button>
        </div>
        <div class="s-section"><h3>主题</h3>
          <div class="s-row"><div class="lbl">当前主题</div><span style="color:var(--amber)">墨砚 Ink & Amber（深色）</span></div>
        </div>`;
        const wp=$('#st-wp',body);
        wallpapers.forEach(w=>{
          const d=el('div','wp'+(s.wallpaper===w.url?' active':''));d.style.background=w.url||'radial-gradient(1200px 800px at 78% 12%, rgba(224,166,72,.10), transparent 60%),linear-gradient(160deg,#171410,#0b0907)';
          d.onclick=()=>{if(w.url){Desktop.setWallpaper(w.url);saveSettings({wallpaper:w.url});}else{Desktop.setWallpaper(null);saveSettings({wallpaper:''});}render();};
          wp.appendChild(d);
        });
        $('#st-wp-up',body).onclick=()=>{const inp=el('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];const buf=await f.arrayBuffer();await fs.writeFile('/系统/壁纸/custom'+extOf(f.name),buf);const url=URL.createObjectURL(new Blob([buf]));Desktop.setWallpaper(url);saveSettings({wallpaper:url});toast('已设置','ok');};inp.click();};
      }else if(cur==='mounts'){
        const mounts=fs.listMounts();
        m.innerHTML=`<div class="s-section"><h3>本地文件夹挂载</h3>
          <div style="font-size:12px;color:var(--text-mute);margin-bottom:10px">将电脑真实文件夹挂载到 /mnt/local/ 下，享有完整功能。刷新后需重新授权。</div>
          <button class="btn primary" id="st-mount">${Icons.mount} 挂载文件夹</button>
          <div style="margin-top:14px" id="st-mlist"></div>
        </div>`;
        const list=$('#st-mlist',body);
        if(!mounts.length)list.innerHTML='<div style="color:var(--text-mute);font-size:12px">暂无挂载</div>';
        mounts.forEach(mt=>{const it=el('div','mount-item');it.innerHTML=`<span>${Icons.mount} ${mt.name} <span style="color:var(--text-mute);font-family:var(--font-mono);font-size:11px">${mt.path}</span></span>`;const ub=el('button','btn','卸载');ub.onclick=async()=>{await fs.unmount(mt.path);toast('已卸载','ok');render();Desktop.refresh();};it.appendChild(ub);list.appendChild(it);});
        $('#st-mount',body).onclick=async()=>{try{const p=await fs.mountLocal();toast('已挂载: '+p,'ok');render();Desktop.refresh();}catch(e){toast(e.message,'err');}};
      }else if(cur==='about'){
        m.innerHTML=`<div class="s-section"><h3>关于 墨砚 InkOS</h3>
          <div style="text-align:center;padding:20px 0">
            <div style="width:64px;height:64px;margin:0 auto 14px;color:var(--amber)">${Icons.app}</div>
            <div style="font-family:var(--font-display);font-size:24px;font-weight:900;color:var(--amber)">墨砚 InkOS</div>
            <div style="color:var(--text-mute);font-size:12px;margin-top:4px">单文件 Web 操作系统 · v1.0</div>
          </div>
          <div class="s-row"><div class="lbl">存储引擎</div><span style="color:var(--text-dim)">${fs.isOpfs()?'OPFS':'内存降级'}</span></div>
          <div class="s-row"><div class="lbl">文件系统</div><span style="color:var(--text-dim)">OPFS + FSA 统一架构</span></div>
          <div class="s-row"><div class="lbl">编辑器内核</div><span style="color:var(--text-dim)">CodeMirror 5.65</span></div>
          <div class="s-row"><div class="lbl">解压支持</div><span style="color:var(--text-dim)">ZIP / GZ / TAR / 7Z</span></div>
          <div class="s-row"><div class="lbl">虚拟机</div><span style="color:var(--text-dim)">v86 (可选)</span></div>
          <div style="margin-top:20px;text-align:center;color:var(--text-mute);font-size:11px">所有数据存储于浏览器本地，无后端</div>
        </div>`;
      }
    }
    render();
    return rec;
  }
});
window.Settings=Settings;
</script>
<script>
/* ============================================================
   v86 终端虚拟机
   ============================================================ */
let _v86Loaded=false;
Apps.register({
  id:'vm',name:'终端虚拟机',icon:Icons.terminal,
  async launch(){
    const rec=WM.create({app:'vm',title:'v86 虚拟机',icon:Icons.terminal,width:760,height:540,x:90,y:60});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="vm-app"><div class="vm-bar"><span>v86 x86 模拟器</span><span class="sb-spacer"></span><button class="btn" id="vm-start">启动</button><button class="btn" id="vm-iso">加载ISO</button></div><div id="screen_container"><div></div><canvas></canvas></div></div>`;
    if(!_v86Loaded){
      const s=el('script');s.src='https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js';s.onload=()=>{_v86Loaded=true;};s.onerror=()=>{toast('v86 加载失败（需联网）','err');};document.head.appendChild(s);
    }
    let emulator=null;
    $('#vm-start',body).onclick=()=>{
      if(emulator){toast('已在运行');return;}
      if(!window.V86){toast('v86 未加载完成，请稍候','err');return;}
      try{
        emulator=new V86Starter({
          wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
          bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
          vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
          screen_container:$('#screen_container',body),
          autostart:true,
        });
        toast('虚拟机启动中...','ok');
      }catch(e){toast('启动失败: '+e.message,'err');}
    };
    $('#vm-iso',body).onclick=async()=>{
      const inp=el('input');inp.type='file';inp.accept='.iso,.img,.bin';
      inp.onchange=async()=>{
        const f=inp.files[0];const buf=await f.arrayBuffer();
        // 写入 VFS
        await fs.writeFile('/系统/镜像/'+f.name,buf);
        toast('已保存镜像，请重启虚拟机加载','ok');
      };
      inp.click();
    };
    rec.config.onClose=()=>{try{emulator&&emulator.destroy();}catch(e){}};
    return rec;
  }
});
</script>
<script>
/* ============================================================
   启动序列
   ============================================================ */
(async function boot(){
  // 时钟
  function tick(){const d=new Date();const p=n=>String(n).padStart(2,'0');$('#clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}`;}
  tick();setInterval(tick,1000*10);

  // 网络状态
  const updateNet=()=>{const ns=$('#net-status');if(navigator.onLine){ns.style.color='var(--jade)';}else{ns.style.color='var(--rust)';}};
  updateNet();window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);

  // 初始化文件系统
  try{
    await fs.init();
    $('#fs-status').querySelector('span').textContent=fs.isOpfs()?'OPFS':'MEM';
    $('#fs-status').style.color=fs.isOpfs()?'var(--jade)':'var(--rust)';
  }catch(e){
    $('#fs-status').style.color='var(--rust)';
    toast('文件系统初始化失败: '+e.message,'err');
  }

  // 桌面
  Desktop.load();
  Desktop.setupDesktopDrop();
  Desktop.setupSelectBox();
  Desktop.setupContextMenu();

  // 开始菜单
  StartMenu.build();
  document.addEventListener('click',e=>{ if(!e.target.closest('#start-menu')&&!e.target.closest('.tb-btn.start'))StartMenu.close(); });

  // 壁纸
  const s=loadSettings();
  if(s.wallpaper){Desktop.setWallpaper(s.wallpaper);}

  // 任务栏
  Taskbar.render();

  // 挂载权限恢复提示
  const need=await fs.verifyMounts();
  if(need.length){
    setTimeout(()=>{
      modal({title:'恢复本地挂载',body:'检测到 '+need.length+' 个已挂载的本地文件夹需要重新授权：<br>'+need.map(m=>'· '+m.name).join('<br>'),okText:'逐个授权',onOk:async()=>{
        for(const m of need){ const ok=await fs.requestMountPermission(m.path); if(!ok){toast(m.name+' 授权失败','err');} }
        toast('授权完成','ok');Desktop.refresh();
      }});
    },800);
  }

  // 创建示例文件（首次）
  try{
    if(!await fs.exists('/桌面/欢迎.txt')){
      await fs.writeFile('/桌面/欢迎.txt','欢迎使用 墨砚 InkOS\n\n这是一个基于浏览器的单文件 Web 操作系统。\n所有文件存储于 OPFS，刷新后保留。\n\n双击桌面图标开始体验。');
    }
    if(!await fs.exists('/文档/示例.html')){
      await fs.writeFile('/文档/示例.html','<!DOCTYPE html>\n<html><body style="font-family:sans-serif;background:#1a1812;color:#e0a648;padding:2rem">\n<h1>Hello from InkOS</h1>\n<p>双击此文件可用浏览器打开，点击"编辑源码"可修改。</p>\n</body></html>');
    }
  }catch(e){}

  console.log('%c墨砚 InkOS 启动完成','color:#e0a648;font-size:16px;font-weight:bold');
})();
</script>
</body>
</html>
