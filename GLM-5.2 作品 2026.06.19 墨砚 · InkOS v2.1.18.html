<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#13110d">
<title>墨砚 · InkOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Serif+SC:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   墨砚 InkOS — Ink & Amber 美学系统
   ============================================================ */
:root{
  --ink:#0a0907;
  --bg:#13110d;
  --bg-2:#1c1812;
  --surface:#221d15;
  --surface-2:#2a241a;
  --surface-3:#332b1f;
  --border:#3d3527;
  --border-light:#524735;
  --text:#ece4d3;
  --text-dim:#a89e88;
  --text-mute:#6f6755;
  --amber:#e0a648;
  --amber-bright:#f4c267;
  --amber-dim:#a87a33;
  --jade:#7baa6e;
  --rust:#c96a4a;
  --sky:#5b9ea8;
  --plum:#9b6b8e;
  --shadow:0 10px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --shadow-soft:0 4px 18px rgba(0,0,0,.4);
  --glow-amber:0 0 0 1px rgba(224,166,72,.35),0 0 22px rgba(224,166,72,.18);
  --radius:10px;
  --radius-sm:6px;
  --radius-lg:16px;
  --font-ui:"LXGW WenKai TC","Noto Serif SC",serif;
  --font-display:"Noto Serif SC",serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-light);background-clip:padding-box}
input,textarea,select{font-family:inherit}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}

/* ===== 桌面 ===== */
#desktop{
  position:fixed;inset:0;
  background:
    radial-gradient(1200px 800px at 78% 12%, rgba(224,166,72,.10), transparent 60%),
    radial-gradient(900px 700px at 12% 88%, rgba(123,170,110,.07), transparent 55%),
    radial-gradient(600px 500px at 50% 50%, rgba(91,158,168,.04), transparent 70%),
    linear-gradient(160deg,#171410 0%,#100e0a 55%,#0b0907 100%);
  overflow:hidden;
}
#desktop::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(rgba(224,166,72,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(224,166,72,.025) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%);
}
#desktop::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#wallpaper-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .6s var(--ease);z-index:0}
#desktop-grid{position:absolute;inset:0;z-index:1}

/* 桌面图标 */
.desk-icon{
  position:absolute;width:92px;height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:8px 4px 4px;border-radius:var(--radius);
  cursor:pointer;transition:background .15s,transform .18s var(--ease);
  touch-action:none;
}
.desk-icon:hover{background:rgba(224,166,72,.08)}
.desk-icon.selected{background:rgba(224,166,72,.18);outline:1px solid rgba(224,166,72,.4)}
.desk-icon .ico{width:46px;height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.desk-icon .ico svg{width:42px;height:42px}
.desk-icon .lbl{
  font-size:12px;color:var(--text);text-align:center;line-height:1.25;
  max-width:88px;word-break:break-all;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 1px rgba(0,0,0,.9);
  padding:1px 5px;border-radius:4px;
}
.desk-icon.selected .lbl{background:var(--amber);color:var(--ink)}
.desk-icon.dragging{opacity:.4}
.desk-icon[draggable="true"]{cursor:grab}

/* 框选 */
#select-box{position:absolute;border:1px solid var(--amber);background:rgba(224,166,72,.12);pointer-events:none;z-index:50;display:none}

/* ===== 顶部状态栏 ===== */
#topbar{
  position:fixed;top:0;left:0;right:0;height:30px;z-index:9000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
  background:linear-gradient(180deg,rgba(10,9,7,.85),rgba(10,9,7,.55));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text-dim);
}
#topbar .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;color:var(--amber);letter-spacing:.08em}
#topbar .brand svg{width:16px;height:16px}
#topbar .sysinfo{display:flex;align-items:center;gap:14px}
#topbar .sysinfo .item{display:flex;align-items:center;gap:5px}
#topbar .sysinfo svg{width:13px;height:13px;opacity:.85}
#clock{font-family:var(--font-mono);color:var(--text);font-size:12px}

/* ===== 任务栏 / Dock ===== */
#taskbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:10px;z-index:9000;
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;
  background:linear-gradient(180deg,rgba(34,29,21,.82),rgba(20,17,13,.9));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
  max-width:calc(100vw - 20px);
  overflow-x:auto;scrollbar-width:none;
}
#taskbar::-webkit-scrollbar{display:none}
.tb-btn{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);transition:.18s var(--ease);position:relative;flex-shrink:0;
}
.tb-btn svg{width:24px;height:24px}
.tb-btn:hover{background:var(--surface-2);color:var(--text)}
.tb-btn.start{background:linear-gradient(145deg,var(--amber),var(--amber-dim));color:var(--ink)}
.tb-btn.start:hover{filter:brightness(1.08)}
.tb-btn.start svg{width:22px;height:22px}
.tb-btn.app{position:relative}
.tb-btn.app .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:0;transition:.2s}
.tb-btn.app.active .dot{opacity:1}
.tb-btn.app.running{color:var(--text)}
.tb-btn.app.running .dot{opacity:.7;background:var(--text-dim)}
.tb-sep{width:1px;height:26px;background:var(--border);margin:0 2px;flex-shrink:0}

/* 移动端底部导航 */
@media(max-width:640px){
  #topbar{height:26px;font-size:11px;padding:0 8px}
  #topbar .sysinfo .item:not(.essential){display:none}
  #taskbar{bottom:6px;border-radius:14px;padding:5px 7px;gap:4px}
  .tb-btn{width:38px;height:38px;border-radius:10px}
  .tb-btn svg{width:22px;height:22px}
  .desk-icon{width:78px;height:84px}
  .desk-icon .ico svg{width:36px;height:36px}
}

/* ===== 开始菜单 ===== */
#start-menu{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:64px;z-index:9100;width:min(560px,92vw);max-height:70vh;
  background:linear-gradient(180deg,rgba(34,29,21,.96),rgba(20,17,13,.98));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border-light);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  display:none;flex-direction:column;overflow:hidden;
  opacity:0;transition:opacity .22s var(--ease),transform .22s var(--ease);
}
#start-menu.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#start-menu .sm-head{padding:16px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#start-menu .sm-head h2{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--amber);letter-spacing:.04em}
#start-menu .sm-search{position:relative;margin:12px 18px}
#start-menu .sm-search input{width:100%;padding:9px 12px 9px 34px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
#start-menu .sm-search input:focus{border-color:var(--amber-dim)}
#start-menu .sm-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-mute)}
#start-menu .sm-apps{padding:8px 14px 16px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border-radius:10px;cursor:pointer;transition:.15s;text-align:center}
.sm-app:hover{background:var(--surface-2)}
.sm-app .ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.sm-app .ico svg{width:36px;height:36px}
.sm-app .nm{font-size:11.5px;color:var(--text-dim);line-height:1.2}
.sm-app:hover .nm{color:var(--text)}

/* ===== 右键菜单 ===== */
.ctx-menu{
  position:fixed;z-index:9500;min-width:180px;
  background:linear-gradient(180deg,rgba(34,29,21,.98),rgba(22,19,15,.99));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-light);border-radius:10px;
  box-shadow:var(--shadow);padding:5px;font-size:13px;
  animation:ctxIn .12s var(--ease);
}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--text)}
.ctx-item:hover{background:var(--amber);color:var(--ink)}
.ctx-item svg{width:15px;height:15px;opacity:.85}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-sep{height:1px;background:var(--border);margin:4px 6px}
.ctx-item .kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;opacity:.6}

/* ===== 窗口 ===== */
.win{
  position:absolute;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--border-light);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  min-width:280px;min-height:180px;
  animation:winIn .18s var(--ease-out);
}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.win.minimizing{animation:winOut .2s var(--ease) forwards}
@keyframes winOut{to{opacity:0;transform:scale(.85) translateY(40px)}}
.win.maximized{border-radius:0}
.win .titlebar{
  height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:0 10px 0 12px;cursor:grab;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border-bottom:1px solid var(--border);
  user-select:none;
}
.win .titlebar .w-ico{width:16px;height:16px;color:var(--amber)}
.win .titlebar .w-title{font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.win .w-ctrls{display:flex;align-items:center;gap:2px}
.w-ctrl{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:.12s}
.w-ctrl svg{width:14px;height:14px}
.w-ctrl:hover{background:var(--surface-3);color:var(--text)}
.w-ctrl.close:hover{background:var(--rust);color:#fff}
.win .w-body{flex:1;overflow:hidden;position:relative;background:var(--bg-2);display:flex;flex-direction:column}
.win .w-resize{position:absolute;z-index:5}
.win .w-resize.n{top:-2px;left:8px;right:8px;height:5px;cursor:ns-resize}
.win .w-resize.s{bottom:-2px;left:8px;right:8px;height:5px;cursor:ns-resize}
.win .w-resize.e{right:-2px;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.win .w-resize.w{left:-2px;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.win .w-resize.ne{top:-2px;right:-2px;width:10px;height:10px;cursor:nesw-resize}
.win .w-resize.nw{top:-2px;left:-2px;width:10px;height:10px;cursor:nwse-resize}
.win .w-resize.se{bottom:-2px;right:-2px;width:10px;height:10px;cursor:nwse-resize}
.win .w-resize.sw{bottom:-2px;left:-2px;width:10px;height:10px;cursor:nesw-resize}
.win.maximized .w-resize{display:none}
.win.focused{box-shadow:0 14px 50px rgba(0,0,0,.6),0 0 0 1px rgba(224,166,72,.25)}
.win.focused .titlebar{background:linear-gradient(180deg,var(--surface-3),var(--surface-2))}
.win.loading .w-body::after{content:"";position:absolute;inset:0;background:rgba(20,17,13,.6);backdrop-filter:blur(2px)}

/* ===== 通用UI ===== */
.btn{padding:7px 14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:13px;transition:.14s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-3);border-color:var(--border-light)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,var(--amber),var(--amber-dim));color:var(--ink);border-color:transparent;font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn svg{width:14px;height:14px}
.input{padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;outline:none;width:100%}
.input:focus{border-color:var(--amber-dim)}
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.toolbar .t-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:.12s}
.toolbar .t-btn:hover{background:var(--surface-3);color:var(--text)}
.toolbar .t-btn svg{width:16px;height:16px}
.toolbar .t-btn.active{background:var(--amber);color:var(--ink)}
.toolbar .t-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.toolbar select{padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.statusbar{display:flex;align-items:center;gap:14px;padding:4px 12px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text-mute);font-family:var(--font-mono);flex-shrink:0}
.statusbar .sb-item{display:flex;align-items:center;gap:5px}
.statusbar .sb-spacer{flex:1}

/* ===== 文件资源管理器 ===== */
.fex{display:flex;flex:1;overflow:hidden}
.fex .nav-pane{width:180px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:8px 6px}
.fex .nav-pane .nav-group{font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.1em;padding:8px 8px 4px}
.fex .nav-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-dim);transition:.12s}
.fex .nav-item svg{width:15px;height:15px;flex-shrink:0}
.fex .nav-item:hover{background:var(--surface-2);color:var(--text)}
.fex .nav-item.active{background:rgba(224,166,72,.15);color:var(--amber)}
.fex .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.fex .breadcrumb{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.fex .crumb{padding:4px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--text-dim);transition:.12s}
.fex .crumb:hover{background:var(--surface-2);color:var(--text)}
.fex .crumb.active{color:var(--amber)}
.fex .crumb-sep{color:var(--text-mute);font-size:10px}
.fex .filelist{flex:1;overflow:auto;padding:6px}
.fex .fl-head{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:8px;padding:6px 10px;font-size:11px;color:var(--text-mute);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;text-transform:uppercase;letter-spacing:.05em}
.fex .fl-head .col{cursor:pointer;display:flex;align-items:center;gap:3px;user-select:none}
.fex .fl-head .col:hover{color:var(--text-dim)}
.fex .fl-head .col.sorted{color:var(--amber)}
.fex .fl-head .col.sorted .arr{display:inline}
.fex .fl-head .arr{display:none;font-size:9px}
.fex .frow{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;align-items:center;font-size:12.5px;transition:.1s}
.fex .frow:hover{background:var(--surface-2)}
.fex .frow.selected{background:rgba(224,166,72,.18)}
.fex .frow .fname{display:flex;align-items:center;gap:8px;overflow:hidden}
.fex .frow .fname svg{width:18px;height:18px;flex-shrink:0}
.fex .frow .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fex .frow .fmeta{color:var(--text-mute);font-size:11.5px;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fex .grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;padding:8px}
.fex .gitem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:8px;cursor:pointer;transition:.12s;text-align:center}
.fex .gitem:hover{background:var(--surface-2)}
.fex .gitem.selected{background:rgba(224,166,72,.18)}
.fex .gitem svg{width:40px;height:40px}
.fex .gitem .gnm{font-size:11.5px;color:var(--text-dim);line-height:1.2;word-break:break-all;max-width:88px}
.fex .empty{padding:40px;text-align:center;color:var(--text-mute);font-size:13px}
.fex .empty svg{width:48px;height:48px;margin:0 auto 12px;opacity:.4}
.fex .fl-search{padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
.fex .fl-search input{flex:1}
@media(max-width:640px){.fex .nav-pane{display:none}}

/* ===== 记事本 ===== */
.notepad{display:flex;flex-direction:column;flex:1;overflow:hidden}
.notepad textarea{flex:1;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;padding:14px 18px;font-family:var(--font-mono);font-size:13.5px;line-height:1.7;tab-size:2}

/* ===== 表格 ===== */
.table-app{display:flex;flex-direction:column;flex:1;overflow:hidden}
.table-app .table-wrap{flex:1;overflow:auto;background:var(--bg)}
.table-app table{border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--font-mono)}
.table-app th,.table-app td{border:1px solid var(--border);padding:5px 8px;text-align:left;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.table-app th{background:var(--surface-2);color:var(--amber);position:sticky;top:0;font-weight:500}
.table-app td{color:var(--text-dim)}
.table-app td.editable:focus{outline:1px solid var(--amber);background:var(--surface-2);color:var(--text);white-space:normal}

/* ===== HTML编辑器 ===== */
.editor-app{display:flex;flex-direction:column;flex:1;overflow:hidden}
.editor-split{display:flex;flex:1;overflow:hidden}
.editor-pane{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:200px}
.editor-pane .CodeMirror{flex:1;height:auto!important;border-radius:0}
.editor-preview{flex:1;min-width:120px;border-left:1px solid var(--border);display:flex;flex-direction:column;background:#fff}
.editor-split .vsplit{width:6px;cursor:col-resize;background:var(--border);flex-shrink:0;transition:.1s}
.editor-split .vsplit:hover{background:var(--amber-dim)}
.editor-preview iframe{flex:1;border:none;background:#fff}
.find-bar{display:none;flex-direction:column;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px}
.find-bar.open{display:flex}
.find-bar .row{display:flex;align-items:center;gap:6px}
.find-bar input{padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;outline:none;flex:1}
.find-bar .cnt{color:var(--text-mute);font-family:var(--font-mono);font-size:11px;min-width:60px}
.find-bar .tg{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;border:1px solid var(--border)}
.find-bar .tg.active{background:var(--amber);color:var(--ink);border-color:transparent}

/* ===== 漫画阅读器 ===== */
.manga-app{display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative}
.manga-app .manga-bar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(10,9,7,.8);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text-dim);transition:.3s}
.manga-app .manga-scroll{flex:1;overflow-y:auto;background:#000;display:flex;flex-direction:column;align-items:center;scroll-behavior:smooth}
.manga-app .manga-scroll img{width:100%;max-width:1000px;display:block;pointer-events:none}
.manga-app .manga-loading{padding:40px;color:var(--text-mute);font-size:13px;text-align:center}
.manga-exit{position:fixed;top:14px;right:18px;z-index:9999;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer}
.manga-exit svg{width:18px;height:18px}
.manga-app.fullscreen .manga-bar{opacity:0;pointer-events:none}
.manga-app.fullscreen .manga-exit{display:flex}

/* ===== 浏览器 ===== */
.browser-app{display:flex;flex-direction:column;flex:1;overflow:hidden}
.browser-app .addr-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
.browser-app .addr-bar input{flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:12.5px;outline:none}
.browser-app .addr-bar input:focus{border-color:var(--amber-dim)}
.browser-app iframe{flex:1;border:none;background:#fff}
.browser-app .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#1a1610,#100e0a);color:var(--text-dim)}
.browser-app .home svg{width:64px;height:64px;color:var(--amber);opacity:.7}

/* ===== 计算器 ===== */
.calc-app{display:flex;flex-direction:column;flex:1;overflow:hidden;padding:14px;gap:10px}
.calc-app .display{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:right;font-family:var(--font-mono);min-height:80px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-app .display .expr{color:var(--text-mute);font-size:13px;min-height:18px;overflow:hidden;text-overflow:ellipsis}
.calc-app .display .res{color:var(--amber);font-size:30px;font-weight:700;word-break:break-all}
.calc-app .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex:1}
.calc-app .key{border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:17px;font-family:var(--font-mono);transition:.1s;display:flex;align-items:center;justify-content:center}
.calc-app .key:hover{background:var(--surface-3)}
.calc-app .key:active{transform:scale(.95)}
.calc-app .key.op{background:var(--surface-3);color:var(--amber)}
.calc-app .key.eq{background:linear-gradient(145deg,var(--amber),var(--amber-dim));color:var(--ink);font-weight:700}
.calc-app .key.fn{color:var(--rust)}

/* ===== 设置 ===== */
.settings-app{display:flex;flex:1;overflow:hidden}
.settings-app .s-nav{width:170px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:10px 6px;overflow-y:auto}
.settings-app .s-nav .s-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-dim);transition:.12s}
.settings-app .s-nav .s-item svg{width:16px;height:16px}
.settings-app .s-nav .s-item:hover{background:var(--surface-2);color:var(--text)}
.settings-app .s-nav .s-item.active{background:rgba(224,166,72,.15);color:var(--amber)}
.settings-app .s-main{flex:1;overflow-y:auto;padding:20px 24px}
.settings-app .s-section{margin-bottom:26px}
.settings-app .s-section h3{font-family:var(--font-display);font-size:15px;color:var(--amber);margin-bottom:12px;font-weight:700}
.settings-app .s-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:14px}
.settings-app .s-row .lbl{font-size:13px;color:var(--text)}
.settings-app .s-row .desc{font-size:11.5px;color:var(--text-mute);margin-top:2px}
.storage-bar{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--border);display:flex}
.storage-bar .seg{height:100%;transition:width .5s var(--ease)}
.storage-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px}
.storage-legend .lg{display:flex;align-items:center;gap:6px;color:var(--text-dim)}
.storage-legend .sw{width:11px;height:11px;border-radius:3px}
.wallpaper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.wallpaper-grid .wp{aspect-ratio:16/10;border-radius:8px;cursor:pointer;border:2px solid transparent;background-size:cover;background-position:center;transition:.15s;overflow:hidden;position:relative}
.wallpaper-grid .wp:hover{transform:scale(1.03)}
.wallpaper-grid .wp.active{border-color:var(--amber)}
.mount-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:12.5px}
@media(max-width:640px){.settings-app .s-nav{width:54px}.settings-app .s-nav .s-item .nm{display:none}}

/* ===== 图片查看器 ===== */
.img-viewer{display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative;background:#000}
.img-viewer .iv-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:grab}
.img-viewer .iv-stage:active{cursor:grabbing}
.img-viewer .iv-stage img{max-width:100%;max-height:100%;transition:transform .2s var(--ease)}
.img-viewer .iv-tools{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(10,9,7,.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:20px;z-index:5}
.img-viewer .iv-tools .t-btn{width:32px;height:32px;color:var(--text-dim)}
.img-viewer .iv-tools .t-btn:hover{color:var(--amber)}

/* ===== 媒体播放器 ===== */
.media-app{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#000}
.media-app video,.media-app audio{width:100%;flex:1;background:#000}
.media-app .m-info{padding:10px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border);background:var(--surface)}

/* ===== PDF查看器 ===== */
.pdf-app{flex:1;overflow:hidden;display:flex}
.pdf-app iframe{flex:1;border:none}

/* ===== 终端/VM ===== */
.vm-app{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#000}
.vm-app #screen_container{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.vm-app #screen_container > div{white-space:pre;font-family:var(--font-mono);font-size:14px;line-height:1;color:#fff;position:absolute;top:0;left:0}
.vm-app #screen_container canvas{display:block}
.vm-app .vm-bar{padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);flex-shrink:0}

/* ===== Toast ===== */
#toast-wrap{position:fixed;top:42px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:9px 18px;background:linear-gradient(145deg,var(--surface-2),var(--surface));border:1px solid var(--border-light);border-radius:20px;font-size:12.5px;color:var(--text);box-shadow:var(--shadow);animation:toastIn .3s var(--ease-out);max-width:90vw}
.toast.err{border-color:var(--rust);color:#f0c4b8}
.toast.ok{border-color:var(--jade);color:#c4e0bc}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ===== 对话框 ===== */
.modal-overlay{position:fixed;inset:0;z-index:98000;background:rgba(5,4,3,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border-light);border-radius:14px;box-shadow:var(--shadow);padding:22px;min-width:320px;max-width:90vw;max-height:85vh;overflow:auto;animation:modalIn .22s var(--ease-out)}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-family:var(--font-display);font-size:16px;color:var(--amber);margin-bottom:14px;font-weight:700}
.modal .m-body{font-size:13px;color:var(--text-dim);margin-bottom:18px;line-height:1.6}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px}
.modal .m-input{width:100%;margin-bottom:14px}

/* ===== 通用动画 ===== */
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* CodeMirror 主题覆盖 */
.CodeMirror{background:var(--bg)!important;color:var(--text)!important;font-family:var(--font-mono)!important;font-size:13px!important;height:100%!important}
.CodeMirror-gutters{background:var(--bg-2)!important;border-right:1px solid var(--border)!important}
.CodeMirror-linenumber{color:var(--text-mute)!important}
.CodeMirror-cursor{border-left:1px solid var(--amber)!important}
.CodeMirror-activeline-background{background:rgba(224,166,72,.06)!important}
.cm-s-material-darker.CodeMirror{background:#1a1812!important}
.CodeMirror-selected{background:rgba(224,166,72,.22)!important}
.CodeMirror-matchingbracket{color:var(--amber-bright)!important;border-bottom:1px solid var(--amber)}
.CodeMirror-search-match{background:rgba(224,166,72,.3)}
.CodeMirror-search-match-current{background:var(--amber);color:var(--ink)}

const uid=(()=>{let i=0;return(p='id')=>p+'_'+(i++)+'_'+Math.random().toString(36).slice(2,7);})();
const fmtSize=b=>{if(b==null)return'—';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';};
const fmtDate=d=>{if(!d)return'—';const x=new Date(d);if(isNaN(x))return'—';const p=n=>String(n).padStart(2,'0');return`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`;};
const extOf=n=>{const i=n.lastIndexOf('.');return i<0?'':n.slice(i+1).toLowerCase();};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const naturalCompare=(a,b)=>a.localeCompare(b,'zh',{numeric:true,sensitivity:'base'});

function toast(msg,type=''){const w=$('#toast-wrap');const t=el('div','toast '+(type||''),msg);w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2600);}

function modal({title,body,inputs=[],okText='确定',cancelText='取消',onOk,onCancel}){
  const ov=el('div','modal-overlay');
  const m=el('div','modal');
  let html=`<h3>${title}</h3>`;
  if(body)html+=`<div class="m-body">${body}</div>`;
  m.innerHTML=html;
  const inputEls=[];
  inputs.forEach(i=>{const lab=el('div','desc',i.label);const inp=el('input','input m-input');inp.value=i.value||'';if(i.placeholder)inp.placeholder=i.placeholder;m.appendChild(lab);m.appendChild(inp);inputEls.push(inp);});
  const act=el('div','m-actions');
  const cb=el('button','btn',cancelText);cb.onclick=()=>{ov.remove();onCancel&&onCancel();};
  const ob=el('button','btn primary',okText);ob.onclick=async()=>{const vals=inputEls.map(e=>e.value);const r=onOk?await onOk(vals):true;if(r!==false)ov.remove();};
  act.appendChild(cb);act.appendChild(ob);m.appendChild(act);ov.appendChild(m);$('#modal-root').appendChild(ov);
  setTimeout(()=>{inputEls[0]?inputEls[0].focus():ob.focus();},50);
  return ov;
}
function confirmDialog(msg,okText='确定'){
  return new Promise(res=>{modal({title:'确认',body:msg,okText,onOk:()=>res(true),onCancel:()=>res(false)});});
}

/* 文件类型 -> 图标 */
function iconForFile(name,isDir){
  if(isDir) return Icons.folder;
  const e=extOf(name);
  if(['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'].includes(e))return Icons.image;
  if(['mp3','wav','ogg','flac','aac','m4a','opus'].includes(e))return Icons.audio;
  if(['mp4','webm','ogv','mov','mkv'].includes(e))return Icons.video;
  if(['html','htm','xml','svg'].includes(e))return Icons.code;
  if(['css','js','mjs','ts','json','yaml','yml','log','sh','py','rs','go','java','c','cpp','cs','rb','php'].includes(e))return Icons.code;
  if(['md','markdown'].includes(e))return Icons.text;
  if(['csv','tsv'].includes(e))return Icons.table;
  if(['zip','gz','tar','tgz','7z','rar','bz2','xz'].includes(e))return Icons.archive;
  if(['pdf'].includes(e))return Icons.pdf;
  if(['txt'].includes(e))return Icons.text;
  return Icons.file;
}
