<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
/* ============================================================
   fs 模块 — 统一虚拟文件系统
   后端：OPFS（主） / 内存+localStorage（降级） / FSA（本地挂载）
   对上层完全透明，无 isLocal 分支
   ============================================================ */
const fs = (function(){
  const SPLIT = p => String(p).split('/').filter(Boolean);
  const join = (...a) => '/' + a.flatMap(SPLIT).join('/');
  const dirname = p => { const s=SPLIT(p); s.pop(); return '/'+s.join('/'); };
  const basename = p => { const s=SPLIT(p); return s[s.length-1]||''; };
  const normalize = p => '/'+SPLIT(p).join('/');

  let opfsRoot = null;       // OPFS 根
  let memRoot = null;        // 内存降级根 {name,type,children,content,mtime,size}
  let useOPFS = false;

  /* ---------- 内存降级后端 ---------- */
  function memNode(type,name){return {type,name,children:type==='dir'?{}:null,content:null,mtime:Date.now(),size:0};}
  function memGet(path,create=false){
    if(path==='/'||path==='')return memRoot;
    const parts=SPLIT(path);let cur=memRoot;
    for(const part of parts){
      if(cur.type!=='dir')throw new Error('非目录: '+cur.name);
      if(!cur.children[part]){
        if(!create)throw new Error('不存在: '+path);
        cur.children[part]=memNode(part.endsWith('/')||true?'dir':'file',part);
      }
      cur=cur.children[part];
    }
    return cur;
  }
  function memEnsureDir(path){const s=SPLIT(path);let cur=memRoot;for(const p of s){if(!cur.children[p])cur.children[p]=memNode('dir',p);cur=cur.children[p];}return cur;}

  /* ---------- OPFS 后端 ---------- */
  async function opfsGetDir(path,create=false){
    let dir=opfsRoot;
    for(const part of SPLIT(path)){ dir=await dir.getDirectoryHandle(part,{create}); }
    return dir;
  }
  async function opfsGetFile(path,create=false){
    const dir=await opfsGetDir(dirname(path),create);
    return await dir.getFileHandle(basename(path),{create});
  }

  /* ---------- 挂载表 (FSA) ---------- */
  // mounts: { '/mnt/local/X': FileSystemDirectoryHandle }
  const mounts = {};
  async function loadMounts(){
    try{
      const raw=localStorage.getItem('inkos_mounts');
      if(!raw)return;
      const list=JSON.parse(raw);
      // 句柄存在 IndexedDB
      for(const m of list){
        const h=await idbGet('mount',m.id);
        if(h){mounts[m.path]=h;}
      }
    }catch(e){console.warn('loadMounts',e);}
  }
  async function saveMountsMeta(){
    const list=Object.entries(mounts).map(([path,h])=>({path,id:path,name:basename(path)}));
    localStorage.setItem('inkos_mounts',JSON.stringify(list));
  }
  async function addMount(name,handle){
    const path='/mnt/local/'+name;
    mounts[path]=handle;
    await idbSet('mount',path,handle);
    await saveMountsMeta();
    return path;
  }
  async function removeMount(path){
    delete mounts[path];
    await idbDel('mount',path);
    await saveMountsMeta();
  }
  function findMount(path){
    path=normalize(path);
    let best=null;
    for(const mp of Object.keys(mounts)){
      if(path===mp||path.startsWith(mp+'/')){ if(!best||mp.length>best.length)best=mp; }
    }
    return best?{mount:best,rel:path.slice(best.length),handle:mounts[best]}:null;
  }

  /* ---------- IndexedDB 句柄存储 ---------- */
  let idbDb=null;
  function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('inkos_idb',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  function idbGet(store,key){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readonly').objectStore(store).get(key);tx.onsuccess=()=>res(tx.result);tx.onerror=()=>rej(tx.error);}));}
  function idbSet(store,key,val){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite').objectStore(store).put(val,key);tx.onsuccess=()=>res();tx.onerror=()=>rej(tx.error);}));}
  function idbDel(store,key){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite').objectStore(store).delete(key);tx.onsuccess=()=>res();tx.onerror=()=>rej(tx.error);}));}

  /* ---------- 路由 ---------- */
  async function resolve(path){
    path=normalize(path);
    const m=findMount(path);
    if(m) return {backend:'fsa',...m};
    if(useOPFS) return {backend:'opfs',rel:path};
    return {backend:'mem',rel:path};
  }

  /* ---------- 公共 API ---------- */
  async function init(){
    // 内存降级根
    memRoot=memNode('dir','');
    if(navigator.storage&&navigator.storage.getDirectory){
      try{ opfsRoot=await navigator.storage.getDirectory(); useOPFS=true; }
      catch(e){ console.warn('OPFS 不可用，降级内存',e); }
    }
    if(!useOPFS){ console.warn('使用内存+localStorage 降级存储'); }
    await loadMounts();
    // 确保基础目录
    await ensureBaseDirs();
  }
  async function ensureBaseDirs(){
    const base=['/桌面','/文档','/下载','/图片','/音乐','/视频','/mnt','/mnt/local'];
    for(const d of base){ try{ await mkdir(d,true); }catch(e){} }
  }

  function isOpfs(){return useOPFS;}

  async function exists(path){
    try{ await stat(path); return true; }catch(e){ return false; }
  }

  async function stat(path){
    path=normalize(path);
    const r=await resolve(path);
    if(r.backend==='fsa'){
      const rel=r.rel||'/';
      try{
        const dir=await fsaWalk(r.handle,rel);
        return {type:'dir',size:0,mtime:Date.now(),name:basename(path)};
      }catch(e){}
      try{
        const fh=await fsaWalkFile(r.handle,rel);
        const f=await fh.getFile();
        return {type:'file',size:f.size,mtime:f.lastModified,name:f.name};
      }catch(e){}
      throw new Error('不存在: '+path);
    }
    if(r.backend==='opfs'){
      try{ const dh=await opfsGetDir(path); return {type:'dir',size:0,mtime:Date.now(),name:basename(path)}; }catch(e){}
      try{ const fh=await opfsGetFile(path); const f=await fh.getFile(); return {type:'file',size:f.size,mtime:f.lastModified,name:f.name}; }catch(e){}
      throw new Error('不存在: '+path);
    }
    // mem
    const n=memGet(path);
    return {type:n.type,size:n.size,mtime:n.mtime,name:n.name};
  }

  async function readdir(path){
    path=normalize(path);
    const r=await resolve(path);
    const out=[];
    if(r.backend==='fsa'){
      const dir= r.rel? await fsaWalk(r.handle,r.rel) : r.handle;
      for await (const [name,handle] of dir.entries()){
        if(handle.kind==='directory') out.push({name,type:'dir',size:0,mtime:0});
        else { const f=await handle.getFile(); out.push({name,type:'file',size:f.size,mtime:f.lastModified}); }
      }
    }else if(r.backend==='opfs'){
      const dir= path==='/'? opfsRoot : await opfsGetDir(path);
      for await (const [name,handle] of dir.entries()){
        if(handle.kind==='directory') out.push({name,type:'dir',size:0,mtime:0});
        else { const f=await handle.getFile(); out.push({name,type:'file',size:f.size,mtime:f.lastModified}); }
      }
    }else{
      const n=memGet(path);
      if(n.type!=='dir')throw new Error('非目录');
      for(const k in n.children){const c=n.children[k];out.push({name:k,type:c.type,size:c.size,mtime:c.mtime});}
    }
    return out;
  }

  async function mkdir(path,recursive=false){
    path=normalize(path);
    const r=await resolve(path);
    if(r.backend==='fsa'){
      await fsaWalk(r.handle,r.rel||'/',true);
    }else if(r.backend==='opfs'){
      await opfsGetDir(path,true);
    }else{
      memEnsureDir(path);
    }
  }

  async function readFile(path,opts={}){
    path=normalize(path);
    const r=await resolve(path);
    let blob;
    if(r.backend==='fsa'){
      const fh=await fsaWalkFile(r.handle,r.rel);
      const f=await fh.getFile(); blob=f;
    }else if(r.backend==='opfs'){
      const fh=await opfsGetFile(path); const f=await fh.getFile(); blob=f;
    }else{
      const n=memGet(path); if(n.type!=='file')throw new Error('非文件');
      blob=new Blob([n.content||'']);
    }
    if(opts.arrayBuffer) return await blob.arrayBuffer();
    if(opts.blob) return blob;
    return await blob.text();
  }

  async function writeFile(path,data){
    path=normalize(path);
    const r=await resolve(path);
    const isStr=typeof data==='string';
    const buf=isStr? new TextEncoder().encode(data) : data;
    if(r.backend==='fsa'){
      const dir=await fsaWalk(r.handle,dirname(r.rel)||'/',true);
      const fh=await dir.getFileHandle(basename(r.rel),{create:true});
      const w=await fh.createWritable(); await w.write(buf); await w.close();
    }else if(r.backend==='opfs'){
      const dir=await opfsGetDir(dirname(path),true);
      const fh=await dir.getFileHandle(basename(path),{create:true});
      const w=await fh.createWritable(); await w.write(buf); await w.close();
    }else{
      const dir=memEnsureDir(dirname(path));
      const name=basename(path);
      if(!dir.children[name])dir.children[name]=memNode('file',name);
      const n=dir.children[name]; n.type='file';
      n.content=isStr?data:buf;
      n.size=isStr?buf.length:(buf.byteLength||buf.size||0);
      n.mtime=Date.now();
    }
  }

  async function unlink(path){
    path=normalize(path);
    const r=await resolve(path);
    if(r.backend==='fsa'){
      const dir=await fsaWalk(r.handle,dirname(r.rel)||'/');
      await dir.removeEntry(basename(r.rel));
    }else if(r.backend==='opfs'){
      const dir=await opfsGetDir(dirname(path));
      await dir.removeEntry(basename(path));
    }else{
      const dir=memGet(dirname(path)); delete dir.children[basename(path)];
    }
  }
  async function rmdir(path){ return unlink(path); }

  async function rename(oldPath,newPath){
    oldPath=normalize(oldPath); newPath=normalize(newPath);
    // 通用：复制 + 删除（兼容所有后端）
    const s=await stat(oldPath);
    if(s.type==='dir'){ await copyDir(oldPath,newPath); await rmRecursive(oldPath); }
    else { const data=await readFile(oldPath,{arrayBuffer:true}); await writeFile(newPath,data); await unlink(oldPath); }
  }
  async function rmRecursive(path){
    path=normalize(path);
    try{ const s=await stat(path); if(s.type==='dir'){ const items=await readdir(path); for(const it of items){ await rmRecursive(join(path,it.name)); } } await unlink(path); }catch(e){}
  }
  async function copyDir(src,dst){
    await mkdir(dst,true);
    const items=await readdir(src);
    for(const it of items){
      if(it.type==='dir') await copyDir(join(src,it.name),join(dst,it.name));
      else { const data=await readFile(join(src,it.name),{arrayBuffer:true}); await writeFile(join(dst,it.name),data); }
    }
  }
  async function copy(src,dst){
    const s=await stat(src);
    if(s.type==='dir') await copyDir(src,dst);
    else { const data=await readFile(src,{arrayBuffer:true}); await writeFile(dst,data); }
  }

  /* ---------- FSA 辅助 ---------- */
  async function fsaWalk(rootHandle,relPath,create=false){
    let dir=rootHandle;
    for(const part of SPLIT(relPath)){ dir=await dir.getDirectoryHandle(part,{create}); }
    return dir;
  }
  async function fsaWalkFile(rootHandle,relPath){
    const parts=SPLIT(relPath); const fname=parts.pop();
    let dir=rootHandle;
    for(const part of parts){ dir=await dir.getDirectoryHandle(part); }
    return await dir.getFileHandle(fname);
  }

  /* ---------- 挂载操作 ---------- */
  async function mountLocal(){
    if(!window.showDirectoryPicker) throw new Error('浏览器不支持 File System Access API');
    const handle=await window.showDirectoryPicker({mode:'readwrite'});
    // 验证权限
    const perm=await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted')throw new Error('权限被拒绝');
    const path=await addMount(handle.name,handle);
    return path;
  }
  function listMounts(){ return Object.keys(mounts).map(p=>({path:p,name:basename(p)})); }
  async function unmount(path){ await removeMount(normalize(path)); }
  async function verifyMounts(){
    // 启动时检查挂载权限，返回需要重新授权的列表
    const need=[];
    for(const [path,handle] of Object.entries(mounts)){
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm!=='granted') need.push({path,name:basename(path),handle});
    }
    return need;
  }
  async function requestMountPermission(path){
    const m=mounts[normalize(path)]; if(!m)throw new Error('无此挂载');
    const perm=await m.requestPermission({mode:'readwrite'});
    return perm==='granted';
  }

  /* ---------- 存储用量 ---------- */
  async function usage(){
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      return {usage:e.usage||0,quota:e.quota||0};
    }
    return {usage:0,quota:0};
  }
  async function dirSize(path){
    let total=0;
    try{ const items=await readdir(path); for(const it of items){ if(it.type==='dir') total+=await dirSize(join(path,it.name)); else total+=it.size||0; } }catch(e){}
    return total;
  }

  /* ---------- 重置 ---------- */
  async function resetAll(){
    if(useOPFS){
      // 删除 OPFS 根下所有条目
      for await (const [name,handle] of opfsRoot.entries()){ try{ await opfsRoot.removeEntry(name,{recursive:true}); }catch(e){} }
    }
    memRoot=memNode('dir','');
    // 清挂载
    const mps=Object.keys(mounts);
    for(const p of mps){ await removeMount(p); }
    localStorage.removeItem('inkos_desktop');
    localStorage.removeItem('inkos_settings');
    localStorage.removeItem('inkos_mounts');
    await ensureBaseDirs();
  }

  return {
    init,exists,stat,readdir,mkdir,readFile,writeFile,unlink,rmdir,rename,
    copy,rmRecursive,join,dirname,basename,normalize,
    isOpfs,mountLocal,listMounts,unmount,verifyMounts,requestMountPermission,
    addMount,usage,dirSize,resetAll,
    get mounts(){return mounts;},
    _resolve:resolve
  };
})();

window.fs=fs;
</script>
<script>
/* ============================================================
   窗口管理器 (Window Manager)
   ============================================================ */
const WM = (function(){
  let zTop=100;
  const windows=new Map();   // id -> {el,config,state}
  let focusedId=null;

  function create(config){
    const id=config.id||uid('win');
    const w=el('div','win');
    w.dataset.id=id;
    w.dataset.app=config.app||'';
    const w0=config.x!=null?config.x:Math.max(40,120+ (windows.size%6)*30);
    const h0=config.y!=null?config.y:Math.max(50,80+ (windows.size%6)*28);
    const ww=config.width||640, hh=config.height||440;
    w.style.left=w0+'px';w.style.top=h0+'px';w.style.width=ww+'px';w.style.height=hh+'px';
    w.style.zIndex=++zTop;
    if(config.maxWidth)w.style.maxWidth=config.maxWidth+'px';

    // 标题栏
    const tb=el('div','titlebar');
    const ico=el('span','w-ico',config.icon||Icons.app);
    const title=el('span','w-title',config.title||'窗口');
    const ctrls=el('div','w-ctrls');
    const minB=el('button','w-ctrl',Icons.min);minB.title='最小化';
    const maxB=el('button','w-ctrl',Icons.max);maxB.title='最大化';
    const closeB=el('button','w-ctrl close',Icons.close);closeB.title='关闭';
    ctrls.append(minB,maxB,closeB);
    tb.append(ico,title,ctrls);

    const body=el('div','w-body');
    // resize handles
    ['n','s','e','w','ne','nw','se','sw'].forEach(d=>{const r=el('div','w-resize '+d);r.dataset.dir=d;w.appendChild(r);});
    w.appendChild(tb);w.appendChild(body);

    $('#desktop').appendChild(w);
    const rec={id,el:w,titleEl:title,bodyEl:body,tbEl:tb,config,state:{min:false,max:false,prev:null},onClose:config.onClose};
    windows.set(id,rec);

    // 事件
    w.addEventListener('mousedown',()=>focus(id),true);
    tb.addEventListener('mousedown',e=>startDrag(e,id));
    tb.addEventListener('touchstart',e=>startDrag(e,id),{passive:false});
    tb.addEventListener('dblclick',()=>toggleMax(id));
    minB.onclick=e=>{e.stopPropagation();minimize(id);};
    maxB.onclick=e=>{e.stopPropagation();toggleMax(id);};
    closeB.onclick=e=>{e.stopPropagation();close(id);};
    $$('.w-resize',w).forEach(r=>{r.addEventListener('mousedown',e=>startResize(e,id,r.dataset.dir));});

    focus(id);
    Taskbar.render();
    if(config.onCreate)config.onCreate(rec);
    return rec;
  }

  function focus(id){
    const rec=windows.get(id);if(!rec)return;
    if(focusedId!==id){
      windows.forEach(r=>r.el.classList.remove('focused'));
      rec.el.classList.add('focused');
      rec.el.style.zIndex=++zTop;
      focusedId=id;
    }
    Taskbar.render();
  }
  function minimize(id){
    const rec=windows.get(id);if(!rec)return;
    rec.el.classList.add('minimizing');
    setTimeout(()=>{rec.el.style.display='none';rec.el.classList.remove('minimizing');rec.state.min=true;},180);
    Taskbar.render();
    // 聚焦下一个可见
    const next=[...windows.values()].find(r=>!r.state.min);
    if(next)focus(next.id); else focusedId=null;
  }
  function restore(id){
    const rec=windows.get(id);if(!rec)return;
    rec.el.style.display='flex';rec.state.min=false;
    focus(id);
  }
  function toggleMax(id){
    const rec=windows.get(id);if(!rec)return;
    if(rec.state.max){
      const p=rec.state.prev;
      rec.el.style.left=p.l+'px';rec.el.style.top=p.t+'px';rec.el.style.width=p.w+'px';rec.el.style.height=p.h+'px';
      rec.el.classList.remove('maximized');rec.state.max=false;
    }else{
      rec.state.prev={l:parseInt(rec.el.style.left),t:parseInt(rec.el.style.top),w:rec.el.offsetWidth,h:rec.el.offsetHeight};
      const m=8;
      rec.el.style.left=m+'px';rec.el.style.top=m+'px';
      rec.el.style.width=(window.innerWidth-m*2)+'px';rec.el.style.height=(window.innerHeight-40-m*2)+'px';
      rec.el.classList.add('maximized');rec.state.max=true;
    }
    if(rec.config.onResize)rec.config.onResize(rec);
  }
  function close(id){
    const rec=windows.get(id);if(!rec)return;
    if(rec.onClose)try{rec.onClose(rec);}catch(e){}
    rec.el.classList.add('minimizing');
    setTimeout(()=>{rec.el.remove();windows.delete(id);Taskbar.render();},180);
    if(focusedId===id){const next=[...windows.values()].find(r=>!r.state.min);focusedId=next?next.id:null;if(next)focus(next.id);}
  }
  function closeByApp(app){
    [...windows.values()].filter(r=>r.config.app===app).forEach(r=>close(r.id));
  }
  function getWindows(){return [...windows.values()];}
  function getById(id){return windows.get(id);}

  // 拖拽
  function startDrag(e,id){
    const rec=windows.get(id);if(!rec||rec.state.max)return;
    if(e.target.closest('.w-ctrl'))return;
    e.preventDefault();
    const isTouch=e.type==='touchstart';
    const p=isTouch?e.touches[0]:e;
    const sx=p.clientX,sy=p.clientY;
    const sl=parseInt(rec.el.style.left),st=parseInt(rec.el.style.top);
    function move(ev){
      const pp=isTouch?ev.touches[0]:ev;
      let nx=sl+pp.clientX-sx, ny=st+pp.clientY-sy;
      nx=clamp(nx,-rec.el.offsetWidth+80,window.innerWidth-40);
      ny=clamp(ny,30,window.innerHeight-50);
      rec.el.style.left=nx+'px';rec.el.style.top=ny+'px';
    }
    function up(){document.removeEventListener(isTouch?'touchmove':'mousemove',move);document.removeEventListener(isTouch?'touchend':'mouseup',up);}
    document.addEventListener(isTouch?'touchmove':'mousemove',move,{passive:false});
    document.addEventListener(isTouch?'touchend':'mouseup',up);
  }

  // 缩放
  function startResize(e,id,dir){
    const rec=windows.get(id);if(!rec||rec.state.max)return;
    e.preventDefault();e.stopPropagation();
    const sx=e.clientX,sy=e.clientY;
    const sl=parseInt(rec.el.style.left),st=parseInt(rec.el.style.top);
    const sw=rec.el.offsetWidth,sh=rec.el.offsetHeight;
    function move(ev){
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      let nl=sl,nt=st,nw=sw,nh=sh;
      if(dir.includes('e'))nw=Math.max(280,sw+dx);
      if(dir.includes('s'))nh=Math.max(180,sh+dy);
      if(dir.includes('w')){nw=Math.max(280,sw-dx);nl=sl+(sw-nw);}
      if(dir.includes('n')){nh=Math.max(180,sh-dy);nt=st+(sh-nh);}
      rec.el.style.left=nl+'px';rec.el.style.top=nt+'px';rec.el.style.width=nw+'px';rec.el.style.height=nh+'px';
      if(rec.config.onResize)rec.config.onResize(rec);
    }
    function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);if(rec.config.onResizeEnd)rec.config.onResizeEnd(rec);}
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',up);
  }

  return {create,focus,minimize,restore,toggleMax,close,closeByApp,getWindows,getById};
})();
window.WM=WM;

/* ============================================================
   任务栏
   ============================================================ */
const Taskbar=(function(){
  const tbEl=()=>$('#taskbar');
  function render(){
    const tb=tbEl();if(!tb)return;
    const apps=Apps.list();
    const running=new Map();
    WM.getWindows().forEach(w=>{const a=w.config.app; if(a)running.set(a,(running.get(a)||0)+1);});

    tb.innerHTML='';
    // 开始按钮
    const start=el('button','tb-btn start',Icons.start);start.title='开始';
    start.onclick=e=>{e.stopPropagation();StartMenu.toggle();};
    tb.appendChild(start);
    tb.appendChild(el('div','tb-sep'));
    // 文件管理器快捷
    const ex=el('button','tb-btn app',Icons.explorer);ex.title='文件管理器';ex.dataset.app='explorer';
    ex.onclick=()=>Apps.open('explorer');
    if(running.get('explorer'))ex.classList.add('running');
    tb.appendChild(ex);
    // 运行中的应用（除explorer外）
    const shown=new Set(['explorer']);
    WM.getWindows().forEach(w=>{
      const a=w.config.app;if(!a||shown.has(a))return;shown.add(a);
      const def=Apps.get(a);
      const b=el('button','tb-btn app',def?def.icon:Icons.app);b.title=def?def.name:a;b.dataset.app=a;
      b.onclick=()=>{const wins=WM.getWindows().filter(x=>x.config.app===a);const vis=wins.find(x=>!x.state.min);if(vis){if(vis.id===WM.getById(vis.id)&&document.querySelector('.win.focused')===vis.el)WM.minimize(vis.id);else WM.focus(vis.id);}else if(wins[0])WM.restore(wins[0].id);};
      if(running.get(a))b.classList.add('running');
      if(w.id===WM.getWindows().find(x=>x.el.classList.contains('focused'))?.id)b.classList.add('active');
      tb.appendChild(b);
    });
    tb.appendChild(el('div','tb-sep'));
    // 浏览器
    const br=el('button','tb-btn app',Icons.browser);br.title='浏览器';br.dataset.app='browser';
    br.onclick=()=>Apps.open('browser');
    if(running.get('browser'))br.classList.add('running');
    tb.appendChild(br);
    // 设置
    const st=el('button','tb-btn app',Icons.settings);st.title='设置';st.dataset.app='settings';
    st.onclick=()=>Apps.open('settings');
    if(running.get('settings'))st.classList.add('running');
    tb.appendChild(st);
  }
  return {render};
})();
window.Taskbar=Taskbar;
</script>
<script>
/* ============================================================
   应用注册表 Apps
   ============================================================ */
const Apps=(function(){
  const registry=new Map();
  function register(def){ registry.set(def.id,def); }
  function get(id){ return registry.get(id); }
  function list(){ return [...registry.values()]; }
  function open(id,args={}){
    const def=registry.get(id);
    if(!def){toast('未知应用: '+id,'err');return;}
    if(def.singleton){
      const ex=WM.getWindows().find(w=>w.config.app===id);
      if(ex){WM.restore(ex.id);if(def.onFocus)def.onFocus(ex,args);return ex;}
    }
    return def.launch(args);
  }
  return {register,get,list,open};
})();
window.Apps=Apps;

/* ============================================================
   开始菜单
   ============================================================ */
const StartMenu=(function(){
  function build(){
    const m=$('#start-menu');
    m.innerHTML=`<div class="sm-head"><h2>应用</h2><span style="font-size:11px;color:var(--text-mute);font-family:var(--font-mono)">墨砚 InkOS</span></div>
      <div class="sm-search"><span>${Icons.search}</span><input id="sm-search-input" placeholder="搜索应用..."></div>
      <div class="sm-apps" id="sm-apps"></div>`;
    render('');
    $('#sm-search-input').addEventListener('input',e=>render(e.target.value));
  }
  function render(q){
    const wrap=$('#sm-apps');if(!wrap)return;
    const ql=q.toLowerCase();
    const apps=Apps.list().filter(a=>!a.hidden&&(a.name.toLowerCase().includes(ql)));
    wrap.innerHTML='';
    apps.forEach(a=>{
      const it=el('div','sm-app');
      it.innerHTML=`<div class="ico">${a.icon}</div><div class="nm">${a.name}</div>`;
      it.onclick=()=>{Apps.open(a.id);close();};
      wrap.appendChild(it);
    });
    if(!apps.length)wrap.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text-mute);padding:30px;font-size:13px">无匹配应用</div>';
  }
  function open(){ $('#start-menu').classList.add('open'); setTimeout(()=>$('#sm-search-input')?.focus(),50); }
  function close(){ $('#start-menu').classList.remove('open'); }
  function toggle(){ $('#start-menu').classList.contains('open')?close():open(); }
  return {build,open,close,toggle,render};
})();
window.StartMenu=StartMenu;

/* ============================================================
   右键菜单
   ============================================================ */
const ContextMenu=(function(){
  let cur=null;
  function show(x,y,items){
    hide();
    const m=el('div','ctx-menu');
    items.forEach(it=>{
      if(it.sep){m.appendChild(el('div','ctx-sep'));return;}
      const e=el('div','ctx-item'+(it.disabled?' disabled':''));
      e.innerHTML=`${it.icon||''}<span>${it.label}</span>${it.kbd?`<span class="kbd">${it.kbd}</span>`:''}`;
      if(!it.disabled)e.onclick=()=>{hide();it.action&&it.action();};
      m.appendChild(e);
    });
    document.body.appendChild(m);
    const r=m.getBoundingClientRect();
    let nx=x,ny=y;
    if(nx+r.width>window.innerWidth)nx=window.innerWidth-r.width-4;
    if(ny+r.height>window.innerHeight)ny=window.innerHeight-r.height-4;
    m.style.left=nx+'px';m.style.top=ny+'px';
    cur=m;
  }
  function hide(){ if(cur){cur.remove();cur=null;} }
  document.addEventListener('mousedown',e=>{ if(cur&&!cur.contains(e.target))hide(); });
  document.addEventListener('contextmenu',e=>{ if(!e.target.closest('.ctx-menu')&&!e.target.closest('[data-ctx]')){ /* allow default? no */ } });
  return {show,hide};
})();
window.ContextMenu=ContextMenu;

/* ============================================================
   桌面环境
   ============================================================ */
const Desktop=(function(){
  const grid=()=>$('#desktop-grid');
  let icons=[];   // {path,name,x,y}
  const DESK_DIR='/桌面';

  function load(){
    try{ icons=JSON.parse(localStorage.getItem('inkos_desktop')||'[]'); }catch(e){icons=[];}
    if(!icons.length) icons=defaultIcons();
    render();
  }
  function save(){ localStorage.setItem('inkos_desktop',JSON.stringify(icons)); }
  function defaultIcons(){
    return [
      {name:'文件管理器',app:'explorer',x:30,y:30},
      {name:'记事本',app:'notepad',x:30,y:140},
      {name:'HTML编辑器',app:'editor',x:30,y:250},
      {name:'网页浏览器',app:'browser',x:30,y:360},
      {name:'计算器',app:'calculator',x:140,y:30},
      {name:'设置',app:'settings',x:140,y:140},
      {name:'漫画阅读器',app:'manga',x:140,y:250},
      {name:'终端虚拟机',app:'vm',x:140,y:360},
    ];
  }

  function render(){
    const g=grid();g.innerHTML='';
    icons.forEach((ic,i)=>{
      const e=el('div','desk-icon');
      e.dataset.idx=i;
      e.draggable=true;
      e.style.left=ic.x+'px';e.style.top=ic.y+'px';
      let svg=Icons.app;
      if(ic.app){const def=Apps.get(ic.app);if(def)svg=def.icon;}
      else if(ic.path){svg=iconForFile(ic.name,false);}
      e.innerHTML=`<div class="ico">${svg}</div><div class="lbl">${ic.name}</div>`;
      // 单击选中 / 双击打开
      let clickT=0;
      e.addEventListener('click',ev=>{
        ev.stopPropagation();
        if(Date.now()-clickT<350){ openIcon(ic); }
        else { selectOnly(e); clickT=Date.now(); }
      });
      e.addEventListener('dblclick',ev=>{ev.stopPropagation();openIcon(ic);});
      // 触摸双击
      e.addEventListener('touchend',ev=>{
        ev.stopPropagation();
        if(Date.now()-clickT<350){openIcon(ic);}
        else{selectOnly(e);clickT=Date.now();}
      });
      // 拖拽（内部移动 + 拖出下载）
      setupIconDrag(e,ic,i);
      g.appendChild(e);
    });
  }

  function selectOnly(node){
    $$('.desk-icon').forEach(n=>n.classList.remove('selected'));
    if(node)node.classList.add('selected');
  }
  function clearSelection(){ $$('.desk-icon').forEach(n=>n.classList.remove('selected')); }

  function openIcon(ic){
    if(ic.app){Apps.open(ic.app);return;}
    if(ic.path){ openPath(ic.path); }
  }

  // 桌面文件拖拽缓存（避免 dragstart async 锁空 DataTransfer）
  const dragCache=new Map();
  async function preloadIcon(ic){
    if(!ic.path)return;
    try{
      const s=await fs.stat(ic.path);
      if(s.type==='file'){
        const buf=await fs.readFile(ic.path,{arrayBuffer:true});
        const blob=new Blob([buf]);
        const url=URL.createObjectURL(blob);
        dragCache.set(ic.path,{blob,url,name:ic.name,mime:guessMime(ic.name)});
      }
    }catch(e){}
  }

  function setupIconDrag(node,ic,idx){
    node.addEventListener('mouseenter',()=>preloadIcon(ic));
    node.addEventListener('mousedown',()=>preloadIcon(ic));
    node.addEventListener('dragstart',e=>{
      e.stopPropagation();
      selectOnly(node);
      // 内部移动标记
      e.dataTransfer.setData('text/inkos-icon',String(idx));
      e.dataTransfer.effectAllowed='copyMove';
      // 若是文件，准备拖出下载
      if(ic.path){
        const c=dragCache.get(ic.path);
        if(c){
          try{
            const file=new File([c.blob],c.name,{type:c.mime});
            e.dataTransfer.items.add(file);
            e.dataTransfer.setData('DownloadURL',`${c.mime}:${c.name}:${c.url}`);
          }catch(err){}
        }
      }
    });
    node.addEventListener('dragend',e=>{
      node.classList.remove('dragging');
      const c=dragCache.get(ic.path);
      if(c){ setTimeout(()=>URL.revokeObjectURL(c.url),6000); }
    });
    // 触摸拖拽（移动端重定位，原生DnD在触摸不可用）
    let touchDrag=false,tStart=null;
    node.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];touchDrag=false;
      tStart={x:t.clientX,y:t.clientY,l:parseFloat(node.style.left),tp:parseFloat(node.style.top)};
    },{passive:true});
    node.addEventListener('touchmove',e=>{
      if(!tStart||e.touches.length!==1)return;
      const t=e.touches[0];
      const dx=t.clientX-tStart.x,dy=t.clientY-tStart.y;
      if(!touchDrag&&Math.hypot(dx,dy)>8){
        touchDrag=true;node.classList.add('dragging');
        selectOnly(node);
      }
      if(touchDrag){
        e.preventDefault();
        const desk=$('#desktop').getBoundingClientRect();
        const nx=clamp(tStart.l+dx,0,desk.width-92),ny=clamp(tStart.tp+dy,0,desk.height-96);
        node.style.left=nx+'px';node.style.top=ny+'px';
      }
    },{passive:false});
    node.addEventListener('touchend',e=>{
      if(touchDrag){
        e.preventDefault();e.stopPropagation();
        icons[idx].x=parseFloat(node.style.left);icons[idx].y=parseFloat(node.style.top);save();
        node.classList.remove('dragging');touchDrag=false;tStart=null;
      }
    });
  }

  // 桌面区域接收 drop：内部移动 / 文件导入
  function setupDesktopDrop(){
    const desk=$('#desktop');
    desk.addEventListener('dragover',e=>{
      if(e.dataTransfer.types.includes('text/inkos-icon')||e.dataTransfer.types.includes('Files')||[...e.dataTransfer.types].some(t=>t.startsWith('Files'))||e.dataTransfer.types.includes('application/x-moz-file')){
        e.preventDefault();e.dataTransfer.dropEffect='copy';
      }
    });
    desk.addEventListener('drop',async e=>{
      // 内部图标移动
      const iconIdx=e.dataTransfer.getData('text/inkos-icon');
      if(iconIdx!==''){
        e.preventDefault();
        const i=parseInt(iconIdx);
        const r=desk.getBoundingClientRect();
        const nx=clamp(e.clientX-r.left-46,0,desk.offsetWidth-92);
        const ny=clamp(e.clientY-r.top-20,0,desk.offsetHeight-96);
        if(icons[i]){icons[i].x=nx;icons[i].y=ny;save();render();}
        return;
      }
      // 外部文件导入
      const items=e.dataTransfer.items;
      if(items&&items.length){
        e.preventDefault();
        const entries=[];
        for(let i=0;i<items.length;i++){
          const it=items[i];
          if(it.kind==='file'){
            const entry=it.webkitGetAsEntry?it.webkitGetAsEntry():null;
            if(entry)entries.push(entry);
            else { const f=it.getAsFile(); if(f)entries.push(f); }
          }
        }
        for(const en of entries){ await importEntry(en,DESK_DIR); }
        render();
        toast('已导入 '+entries.length+' 项','ok');
      }
    });
  }

  async function importEntry(entry,targetDir){
    if(entry.isFile){
      return new Promise(res=>{
        entry.file(async f=>{
          const buf=await f.arrayBuffer();
          const path=fs.join(targetDir,f.name);
          await fs.writeFile(path,buf);
          addFileIcon(path,f.name);
          res();
        });
      });
    }else if(entry.isDirectory){
      const newPath=fs.join(targetDir,entry.name);
      await fs.mkdir(newPath,true);
      const reader=entry.createReader();
      const readAll=()=>new Promise(async res=>{
        const batch=await new Promise(r=>reader.readEntries(r));
        if(!batch.length){res();return;}
        for(const e of batch){ await importEntry(e,newPath); }
        await readAll();res();
      });
      await readAll();
      addFileIcon(newPath,entry.name);
    }else if(entry instanceof File){
      const buf=await entry.arrayBuffer();
      const path=fs.join(targetDir,entry.name);
      await fs.writeFile(path,buf);
      addFileIcon(path,entry.name);
    }
  }
  // File 对象导入（无 entry 时）
  async function importFile(f,targetDir){
    const buf=await f.arrayBuffer();
    const path=fs.join(targetDir,f.name);
    await fs.writeFile(path,buf);
    addFileIcon(path,f.name);
  }
  function addFileIcon(path,name){
    if(!icons.find(i=>i.path===path)) icons.push({name,path,x:30+ (icons.length%5)*110, y:30+Math.floor(icons.length/5)*110});
    save();
  }

  // 框选
  function setupSelectBox(){
    const desk=$('#desktop');const box=$('#select-box');
    let start=null,sel=false;
    desk.addEventListener('mousedown',e=>{
      if(e.target!==desk&&e.target!==grid()&&e.target.id!=='wallpaper-layer')return;
      if(e.button!==0)return;
      clearSelection();
      const r=desk.getBoundingClientRect();
      start={x:e.clientX-r.left,y:e.clientY-r.top};
      sel=true;
      box.style.left=start.x+'px';box.style.top=start.y+'px';box.style.width='0px';box.style.height='0px';box.style.display='block';
      function mv(ev){
        if(!sel)return;
        const cx=ev.clientX-r.left,cy=ev.clientY-r.top;
        const x=Math.min(start.x,cx),y=Math.min(start.y,cy),w=Math.abs(cx-start.x),h=Math.abs(cy-start.y);
        box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
        $$('.desk-icon').forEach(n=>{
          const nx=parseFloat(n.style.left),ny=parseFloat(n.style.top);
          if(nx+46>x&&nx<x+w&&ny+48>y&&ny<y+h)n.classList.add('selected');else n.classList.remove('selected');
        });
      }
      function up(){sel=false;box.style.display='none';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });
  }

  // 桌面右键菜单
  function setupContextMenu(){
    const desk=$('#desktop');
    desk.addEventListener('contextmenu',e=>{
      if(e.target.closest('.win')||e.target.closest('#taskbar')||e.target.closest('#topbar')||e.target.closest('#start-menu'))return;
      e.preventDefault();
      const onIcon=e.target.closest('.desk-icon');
      if(onIcon){
        const idx=parseInt(onIcon.dataset.idx);
        const ic=icons[idx];
        ContextMenu.show(e.clientX,e.clientY,iconMenuItems(ic,idx));
      }else{
        ContextMenu.show(e.clientX,e.clientY,desktopMenuItems(e));
      }
    });
  }

  function desktopMenuItems(e){
    return [
      {label:'刷新',icon:Icons.refresh,action:()=>{render();toast('已刷新');}},
      {sep:true},
      {label:'新建文件夹',icon:Icons.newFolder,action:async()=>{const n=await promptName('新建文件夹','新文件夹');if(!n)return;const p=fs.join(DESK_DIR,n);await fs.mkdir(p,true);addFileIcon(p,n);render();}},
      {label:'新建文本文件',icon:Icons.text,action:async()=>{const n=await promptName('新建文件','新建文件.txt');if(!n)return;const p=fs.join(DESK_DIR,n);await fs.writeFile(p,'');addFileIcon(p,n);render();}},
      {sep:true},
      {label:'上传文件',icon:Icons.upload,action:()=>uploadToDesktop()},
      {label:'挂载本地文件夹',icon:Icons.mount,action:async()=>{try{const p=await fs.mountLocal();toast('已挂载: '+p,'ok');Settings.refresh&&Settings.refresh();}catch(err){toast(err.message,'err');}}},
      {sep:true},
      {label:'更换壁纸',icon:Icons.palette,action:()=>wallpaperPicker()},
      {label:'全屏模式',icon:Icons.fullscreen,action:()=>toggleFullscreen()},
    ];
  }
  function iconMenuItems(ic,idx){
    const items=[{label:'打开',icon:Icons.open,action:()=>openIcon(ic)}];
    if(ic.path){
      items.push({label:'重命名',icon:Icons.rename,action:async()=>{const n=await promptName('重命名',ic.name);if(!n||n===ic.name)return;const np=fs.join(fs.dirname(ic.path),n);await fs.rename(ic.path,np);ic.path=np;ic.name=n;save();render();}});
      items.push({label:'下载',icon:Icons.download,action:()=>downloadPath(ic.path)});
      items.push({sep:true});
      items.push({label:'删除',icon:Icons.trash,action:async()=>{if(await confirmDialog('确定删除「'+ic.name+'」？')){await fs.rmRecursive(ic.path);icons.splice(idx,1);save();render();}}});
    }else if(ic.app){
      items.push({sep:true});
      items.push({label:'从桌面移除',icon:Icons.trash,action:()=>{icons.splice(idx,1);save();render();}});
    }
    return items;
  }

  function promptName(title,val){
    return new Promise(res=>{modal({title,inputs:[{label:'名称',value:val}],okText:'确定',onOk:v=>res(v[0]),onCancel:()=>res(null)});});
  }

  function uploadToDesktop(){
    const inp=el('input');inp.type='file';inp.multiple=true;
    inp.onchange=async()=>{
      for(const f of inp.files){ await importFile(f,DESK_DIR); }
      render();toast('已上传 '+inp.files.length+' 个文件','ok');
    };
    inp.click();
  }

  async function downloadPath(path){
    try{
      const s=await fs.stat(path);
      if(s.type==='dir'){toast('暂不支持下载文件夹','err');return;}
      const buf=await fs.readFile(path,{arrayBuffer:true});
      const blob=new Blob([buf],{type:guessMime(path)});
      const a=el('a');a.href=URL.createObjectURL(blob);a.download=fs.basename(path);a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    }catch(e){toast('下载失败: '+e.message,'err');}
  }

  // 壁纸
  function wallpaperPicker(){
    const inp=el('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async()=>{
      const f=inp.files[0];if(!f)return;
      const buf=await f.arrayBuffer();
      await fs.writeFile('/系统/壁纸/custom'+extOf(f.name)||'.jpg',buf);
      const url=URL.createObjectURL(new Blob([buf]));
      setWallpaper(url,true);
      saveSettings({wallpaper:url,wallpaperCustom:true});
      toast('壁纸已设置','ok');
    };
    inp.click();
  }
  function setWallpaper(url,custom){
    const layer=$('#wallpaper-layer');
    if(url){layer.style.backgroundImage=`url("${url}")`;layer.style.opacity='1';}
    else{layer.style.opacity='0';}
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}
    else{document.exitFullscreen?.();}
  }

  function getIcons(){return icons;}
  function refresh(){render();}

  return {load,render,save,setupDesktopDrop,setupSelectBox,setupContextMenu,getIcons,refresh,setWallpaper,downloadPath,addFileIcon};
})();
window.Desktop=Desktop;
</script>
<script>
/* ============================================================
   文件类型分派 / MIME / 设置
   ============================================================ */
function guessMime(name){
  const e=extOf(name);
  const m={
    html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',
    json:'application/json',xml:'text/xml',svg:'image/svg+xml',md:'text/markdown',txt:'text/plain',
    log:'text/plain',yaml:'text/yaml',yml:'text/yaml',csv:'text/csv',tsv:'text/tab-separated-values',
    png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',
    ico:'image/x-icon',avif:'image/avif',
    mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',aac:'audio/aac',m4a:'audio/mp4',opus:'audio/opus',
    mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',mov:'video/quicktime',mkv:'video/x-matroska',
    pdf:'application/pdf',zip:'application/zip',gz:'application/gzip',tar:'application/x-tar',tgz:'application/gzip',
    '7z':'application/x-7z-compressed',rar:'application/vnd.rar',bz2:'application/x-bzip2',xz:'application/x-xz',
  };
  return m[e]||'application/octet-stream';
}
const TEXT_EXTS=['txt','html','htm','css','js','mjs','ts','json','xml','svg','md','markdown','yaml','yml','log','sh','py','rs','go','java','c','cpp','cs','rb','php','csv','tsv','ini','conf','toml','vue','jsx','tsx'];
function isTextFile(name){return TEXT_EXTS.includes(extOf(name));}
const IMG_EXTS=['png','jpg','jpeg','gif','webp','bmp','ico','avif','svg'];
function isImageFile(name){return IMG_EXTS.includes(extOf(name));}
const AUDIO_EXTS=['mp3','wav','ogg','flac','aac','m4a','opus'];
const VIDEO_EXTS=['mp4','webm','ogv','mov','mkv'];
const ARCHIVE_EXTS=['zip','gz','tar','tgz','7z','rar','bz2','xz'];

/* 设置持久化 */
function loadSettings(){
  try{return JSON.parse(localStorage.getItem('inkos_settings')||'{}');}catch(e){return {};}
}
function saveSettings(patch){
  const s=loadSettings();Object.assign(s,patch);localStorage.setItem('inkos_settings',JSON.stringify(s));
  return s;
}

/* 打开路径：目录 -> 文件管理器；文件 -> 按类型分派 */
async function openPath(path,opts={}){
  try{
    const s=await fs.stat(path);
    if(s.type==='dir'){ Apps.open('explorer',{path}); return; }
    // 文件
    const name=fs.basename(path);
    const e=extOf(name);
    // 压缩包
    if(ARCHIVE_EXTS.includes(e)){ Apps.open('explorer',{path:fs.dirname(path),extract:path}); return; }
    if(isImageFile(name)){ Apps.open('manga',{path}); return; }
    if(AUDIO_EXTS.includes(e)||VIDEO_EXTS.includes(e)){ Apps.open('media',{path}); return; }
    if(e==='pdf'){ Apps.open('pdf',{path}); return; }
    if(['csv','tsv'].includes(e)){ Apps.open('table',{path}); return; }
    if(['html','htm'].includes(e)){ Apps.open('browser',{htmlPath:path}); return; }
    if(isTextFile(name)){ if(opts.editor){Apps.open('editor',{path});}else{Apps.open('notepad',{path});} return; }
    // 未知 -> 文本编辑器兜底
    Apps.open('notepad',{path});
  }catch(err){ toast('打开失败: '+err.message,'err'); }
}
window.openPath=openPath;

/* 刷新所有指向某目录的文件管理器窗口 */
function refreshDirWindows(dir){
  WM.getWindows().forEach(w=>{
    if(w.config.app==='explorer'&&w._currentDir===dir&&w._refresh){w._refresh();}
  });
}
window.refreshDirWindows=refreshDirWindows;
</script>
<script>
/* ============================================================
   文件资源管理器 File Explorer
   ============================================================ */
Apps.register({
  id:'explorer',name:'文件管理器',icon:Icons.explorer,
  launch(args){
    const rec=WM.create({app:'explorer',title:'文件管理器',icon:Icons.explorer,width:780,height:500,x:90,y:70});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="fex">
      <div class="nav-pane" id="fex-nav"></div>
      <div class="main">
        <div class="toolbar" id="fex-toolbar"></div>
        <div class="breadcrumb" id="fex-crumb"></div>
        <div class="fl-search"><input class="input" id="fex-search" placeholder="搜索当前目录..."></div>
        <div class="filelist" id="fex-list"></div>
        <div class="statusbar" id="fex-status"><span class="sb-item">就绪</span><span class="sb-spacer"></span></div>
      </div>
    </div>`;
    const state={dir:args.path||'/桌面',history:[],future:[],view:'list',sort:{key:'name',dir:1},selected:new Set(),search:''};
    rec._currentDir=state.dir;
    rec._refresh=()=>renderList();

    // 工具栏
    const tb=$('#fex-toolbar',body);
    function tbBtn(icon,title,fn,cls){const b=el('button','t-btn '+(cls||''),icon);b.title=title;b.onclick=fn;return b;}
    tb.appendChild(tbBtn(Icons.back,'后退',()=>goBack()));
    tb.appendChild(tbBtn(Icons.fwd,'前进',()=>goFwd()));
    tb.appendChild(tbBtn(Icons.up,'上级',()=>goUp()));
    tb.appendChild(tbBtn(Icons.refresh,'刷新',()=>renderList()));
    tb.appendChild(el('div','t-sep'));
    tb.appendChild(tbBtn(Icons.newFolder,'新建文件夹',async()=>{const n=await promptName2('新建文件夹','新文件夹');if(!n)return;await fs.mkdir(fs.join(state.dir,n),true);renderList();}));
    tb.appendChild(tbBtn(Icons.upload,'上传',()=>uploadHere()));
    tb.appendChild(el('div','t-sep'));
    const viewBtn=tbBtn(Icons.list,'切换视图',()=>{state.view=state.view==='list'?'grid':'list';viewBtn.innerHTML=state.view==='list'?Icons.grid:Icons.list;renderList();});
    viewBtn.innerHTML=Icons.grid;tb.appendChild(viewBtn);
    tb.appendChild(tbBtn(Icons.sort,'排序',e=>sortMenu(e)));

    // 侧边栏
    function renderNav(){
      const nav=$('#fex-nav',body);nav.innerHTML='';
      const groups=[
        {label:'快速访问',items:[{n:'桌面',p:'/桌面',i:Icons.desktop},{n:'文档',p:'/文档',i:Icons.folder},{n:'下载',p:'/下载',i:Icons.folder},{n:'图片',p:'/图片',i:Icons.image},{n:'音乐',p:'/音乐',i:Icons.audio},{n:'视频',p:'/视频',i:Icons.video}]},
        {label:'系统',items:[{n:'根目录',p:'/',i:Icons.drive}]},
      ];
      const mounts=fs.listMounts();
      if(mounts.length)groups.push({label:'本地挂载',items:mounts.map(m=>({n:m.name,p:m.path,i:Icons.mount}))});
      groups.forEach(g=>{
        nav.appendChild(el('div','nav-group',g.label));
        g.items.forEach(it=>{
          const e=el('div','nav-item',`${it.i}<span>${it.n}</span>`);
          if(it.p===state.dir)e.classList.add('active');
          e.onclick=()=>navigate(it.p);
          nav.appendChild(e);
        });
      });
    }

    function renderCrumb(){
      const c=$('#fex-crumb',body);c.innerHTML='';
      const parts=state.dir.split('/').filter(Boolean);
      const root=el('div','crumb','根目录');root.onclick=()=>navigate('/');c.appendChild(root);
      let cur='';
      parts.forEach((p,i)=>{
        c.appendChild(el('span','crumb-sep','›'));
        cur+='/'+p;
        const cc=el('div','crumb'+(i===parts.length-1?' active':''),p);
        cc.onclick=()=>navigate(cur);
        c.appendChild(cc);
      });
    }

    async function renderList(){
      rec._currentDir=state.dir;
      renderNav();renderCrumb();
      const list=$('#fex-list',body);
      list.innerHTML='';list.className='filelist';
      try{
        let items=await fs.readdir(state.dir);
        if(state.search){const q=state.search.toLowerCase();items=items.filter(i=>i.name.toLowerCase().includes(q));}
        items.sort((a,b)=>{
          if(a.type!==b.type)return a.type==='dir'?-1:1;
          let r=0;
          if(state.sort.key==='name')r=naturalCompare(a.name,b.name);
          else if(state.sort.key==='size')r=(a.size||0)-(b.size||0);
          else if(state.sort.key==='type')r=naturalCompare(extOf(a.name),extOf(b.name));
          else if(state.sort.key==='date')r=(a.mtime||0)-(b.mtime||0);
          return r*state.sort.dir;
        });
        if(state.view==='list'){
          list.className='filelist';
          list.innerHTML=`<div class="fl-head"><div class="col${state.sort.key==='name'?' sorted':''}" data-k="name">名称<span class="arr">${state.sort.dir>0?'▲':'▼'}</span></div><div class="col${state.sort.key==='date'?' sorted':''}" data-k="date">修改日期<span class="arr">${state.sort.dir>0?'▲':'▼'}</span></div><div class="col${state.sort.key==='type'?' sorted':''}" data-k="type">类型<span class="arr">${state.sort.dir>0?'▲':'▼'}</span></div><div class="col${state.sort.key==='size'?' sorted':''}" data-k="size">大小<span class="arr">${state.sort.dir>0?'▲':'▼'}</span></div></div>`;
          $$('.col',list).forEach(c=>c.onclick=()=>{const k=c.dataset.k;if(state.sort.key===k)state.sort.dir*=-1;else{state.sort.key=k;state.sort.dir=1;}renderList();});
          items.forEach(it=>{
            const r=el('div','frow');
            r.dataset.name=it.name;r.dataset.type=it.type;
            const typeStr=it.type==='dir'?'文件夹':extOf(it.name).toUpperCase()||'文件';
            r.innerHTML=`<div class="fname">${iconForFile(it.name,it.type==='dir')}<span>${it.name}</span></div><div class="fmeta">${fmtDate(it.mtime)}</div><div class="fmeta">${typeStr}</div><div class="fmeta">${it.type==='dir'?'—':fmtSize(it.size)}</div>`;
            r.onclick=e=>{if(!e.ctrlKey)clearSel();toggleSel(r,it);};
            r.ondblclick=()=>openItem(it);
            r.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();clearSel();toggleSel(r,it);showItemMenu(e.clientX,e.clientY,it);});
            setupRowDrag(r,it);
            list.appendChild(r);
          });
        }else{
          list.className='filelist grid-view';
          items.forEach(it=>{
            const g=el('div','gitem');
            g.dataset.name=it.name;
            g.innerHTML=`${iconForFile(it.name,it.type==='dir')}<div class="gnm">${it.name}</div>`;
            g.onclick=e=>{if(!e.ctrlKey)clearSel();toggleSel(g,it);};
            g.ondblclick=()=>openItem(it);
            g.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();clearSel();toggleSel(g,it);showItemMenu(e.clientX,e.clientY,it);});
            setupRowDrag(g,it);
            list.appendChild(g);
          });
        }
        if(!items.length)list.innerHTML=`<div class="empty">${Icons.folder}<div>此文件夹为空</div></div>`;
        $('#fex-status',body).innerHTML=`<span class="sb-item">${items.length} 项</span><span class="sb-spacer"></span><span class="sb-item">${state.dir}</span>`;
      }catch(e){list.innerHTML=`<div class="empty">${Icons.info}<div>${e.message}</div></div>`;}
      // 若有待解压文件
      if(args.extract){const ex=args.extract;args.extract=null;extractArchive(ex);}
    }

    function clearSel(){$$('.frow.selected,.gitem.selected',body).forEach(n=>n.classList.remove('selected'));state.selected.clear();}
    function toggleSel(node,it){
      if(node.classList.contains('selected')){node.classList.remove('selected');state.selected.delete(it.name);}
      else{node.classList.add('selected');state.selected.add(it.name);}
    }
    function getSelected(){return [...state.selected];}

    function openItem(it){
      const p=fs.join(state.dir,it.name);
      openPath(p);
    }

    function navigate(p){
      if(p===state.dir)return;
      state.history.push(state.dir);state.future=[];
      state.dir=p;state.selected.clear();renderList();
    }
    function goBack(){if(state.history.length){state.future.push(state.dir);state.dir=state.history.pop();state.selected.clear();renderList();}}
    function goFwd(){if(state.future.length){state.history.push(state.dir);state.dir=state.future.pop();state.selected.clear();renderList();}}
    function goUp(){if(state.dir!=='/'){navigate(fs.dirname(state.dir));}}

    function sortMenu(e){
      ContextMenu.show(e.clientX,e.clientY,[
        {label:'按名称',icon:state.sort.key==='name'?Icons.pin:'',action:()=>{state.sort.key='name';renderList();}},
        {label:'按修改日期',icon:state.sort.key==='date'?Icons.pin:'',action:()=>{state.sort.key='date';renderList();}},
        {label:'按类型',icon:state.sort.key==='type'?Icons.pin:'',action:()=>{state.sort.key='type';renderList();}},
        {label:'按大小',icon:state.sort.key==='size'?Icons.pin:'',action:()=>{state.sort.key='size';renderList();}},
        {sep:true},
        {label:state.sort.dir>0?'升序':'降序',icon:Icons.sort,action:()=>{state.sort.dir*=-1;renderList();}},
      ]);
    }

    function showItemMenu(x,y,it){
      const p=fs.join(state.dir,it.name);
      const items=[
        {label:'打开',icon:Icons.open,action:()=>openItem(it)},
      ];
      if(it.type==='file'){
        if(isTextFile(it.name)||['html','htm'].includes(extOf(it.name))){
          items.push({label:'用代码编辑器打开',icon:Icons.editor,action:()=>Apps.open('editor',{path:p})});
        }
        if(ARCHIVE_EXTS.includes(extOf(it.name))){
          items.push({label:'解压到此处',icon:Icons.extract,action:()=>extractArchive(p)});
        }
        items.push({label:'下载',icon:Icons.download,action:()=>Desktop.downloadPath(p)});
      }
      items.push({sep:true});
      items.push({label:'复制',icon:Icons.copy,kbd:'Ctrl+C',action:()=>{clipboard={op:'copy',path:p};toast('已复制');}});
      items.push({label:'剪切',icon:Icons.cut,kbd:'Ctrl+X',action:()=>{clipboard={op:'cut',path:p};toast('已剪切');}});
      items.push({label:'重命名',icon:Icons.rename,action:async()=>{const n=await promptName2('重命名',it.name);if(!n||n===it.name)return;await fs.rename(p,fs.join(state.dir,n));renderList();}});
      items.push({sep:true});
      items.push({label:'删除',icon:Icons.trash,action:async()=>{if(await confirmDialog('删除「'+it.name+'」？')){await fs.rmRecursive(p);renderList();refreshDirWindows(state.dir);Desktop.refresh();}}});
      ContextMenu.show(x,y,items);
    }

    // 拖拽：拖出下载 + 拖到目录
    function setupRowDrag(node,it){
      node.draggable=true;
      const p=fs.join(state.dir,it.name);
      let cache=null;
      async function preload(){
        if(it.type==='file'){
          try{const buf=await fs.readFile(p,{arrayBuffer:true});const blob=new Blob([buf],{type:guessMime(it.name)});cache={blob,url:URL.createObjectURL(blob),name:it.name,mime:guessMime(it.name)};}catch(e){}
        }
      }
      node.addEventListener('mouseenter',preload);
      node.addEventListener('mousedown',preload);
      node.addEventListener('dragstart',e=>{
        e.stopPropagation();
        $$('.frow,.gitem',body).forEach(n=>n.classList.remove('selected'));
        node.classList.add('selected');state.selected.clear();state.selected.add(it.name);
        e.dataTransfer.setData('text/inkos-file',p);
        e.dataTransfer.effectAllowed='copyMove';
        if(cache){try{const file=new File([cache.blob],cache.name,{type:cache.mime});e.dataTransfer.items.add(file);e.dataTransfer.setData('DownloadURL',`${cache.mime}:${cache.name}:${cache.url}`);}catch(err){}}
      });
      node.addEventListener('dragend',()=>{if(cache)setTimeout(()=>URL.revokeObjectURL(cache.url),6000);});
      // 接收拖入文件夹
      if(it.type==='dir'){
        node.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/inkos-file')){e.preventDefault();e.dataTransfer.dropEffect='move';node.style.background='rgba(224,166,72,.25)';}});
        node.addEventListener('dragleave',()=>{node.style.background='';});
        node.addEventListener('drop',async e=>{
          e.preventDefault();e.stopPropagation();node.style.background='';
          const src=e.dataTransfer.getData('text/inkos-file');
          if(src&&src!==p){try{await fs.copy(src,fs.join(p,fs.basename(src)));toast('已复制到 '+it.name,'ok');}catch(err){toast(err.message,'err');}}
        });
      }
    }

    // 列表区接收外部导入 + 内部移动
    listDrop();
    function listDrop(){
      const list=$('#fex-list',body);
      list.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
      list.addEventListener('drop',async e=>{
        e.preventDefault();
        const src=e.dataTransfer.getData('text/inkos-file');
        if(src){
          // 内部移动到当前目录
          if(fs.dirname(src)!==state.dir){
            try{await fs.rename(src,fs.join(state.dir,fs.basename(src)));renderList();}catch(err){toast(err.message,'err');}
          }
          return;
        }
        const its=e.dataTransfer.items;
        if(its&&its.length){
          const entries=[];
          for(let i=0;i<its.length;i++){const it=its[i];if(it.kind==='file'){const en=it.webkitGetAsEntry?it.webkitGetAsEntry():null;if(en)entries.push(en);else{const f=it.getAsFile();if(f)entries.push(f);}}}
          for(const en of entries){ await importEntryGeneric(en,state.dir); }
          renderList();refreshDirWindows(state.dir);Desktop.refresh();
          toast('已导入 '+entries.length+' 项','ok');
        }
      });
    }

    async function uploadHere(){
      const inp=el('input');inp.type='file';inp.multiple=true;
      inp.onchange=async()=>{for(const f of inp.files){const buf=await f.arrayBuffer();await fs.writeFile(fs.join(state.dir,f.name),buf);}renderList();refreshDirWindows(state.dir);toast('已上传 '+inp.files.length+' 个文件','ok');};
      inp.click();
    }

    function promptName2(t,v){return new Promise(res=>modal({title:t,inputs:[{label:'名称',value:v}],okText:'确定',onOk:x=>res(x[0]),onCancel:()=>res(null)}));}

    // 剪贴板
    let clipboard=null;
    // 快捷键
    body.tabIndex=0;
    body.addEventListener('keydown',e=>{
      if(e.ctrlKey&&e.key==='c'){const sels=getSelected();if(sels.length){clipboard={op:'copy',path:fs.join(state.dir,sels[0])};toast('已复制');}}
      if(e.ctrlKey&&e.key==='x'){const sels=getSelected();if(sels.length){clipboard={op:'cut',path:fs.join(state.dir,sels[0])};toast('已剪切');}}
      if(e.ctrlKey&&e.key==='v'){if(clipboard){const dst=fs.join(state.dir,fs.basename(clipboard.path));(async()=>{try{await fs.copy(clipboard.path,dst);if(clipboard.op==='cut'){await fs.rmRecursive(clipboard.path);clipboard=null;}renderList();refreshDirWindows(state.dir);}catch(err){toast(err.message,'err');}})();}}
      if(e.key==='Delete'){const sels=getSelected();if(sels.length){(async()=>{if(await confirmDialog('删除选中项？')){for(const n of sels){await fs.rmRecursive(fs.join(state.dir,n));}renderList();refreshDirWindows(state.dir);}})();}}
      if(e.key==='F5'){renderList();}
    });

    $('#fex-search',body).addEventListener('input',e=>{state.search=e.target.value;renderList();});

    renderList();
    return rec;
  }
});

// 通用导入 entry（供文件管理器使用）
async function importEntryGeneric(entry,targetDir){
  if(entry.isFile){
    return new Promise(res=>{entry.file(async f=>{const buf=await f.arrayBuffer();await fs.writeFile(fs.join(targetDir,f.name),buf);res();});});
  }else if(entry.isDirectory){
    const np=fs.join(targetDir,entry.name);await fs.mkdir(np,true);
    const reader=entry.createReader();
    const readAll=()=>new Promise(async res=>{const batch=await new Promise(r=>reader.readEntries(r));if(!batch.length){res();return;}for(const e of batch){await importEntryGeneric(e,np);}await readAll();res();});
    await readAll();
  }else if(entry instanceof File){
    const buf=await entry.arrayBuffer();await fs.writeFile(fs.join(targetDir,entry.name),buf);
  }
}

<script>
/* ============================================================
   压缩包解压 (ZIP=JSZip / gz,tar,tgz=原生DecompressionStream+tar解析 / 7z=7z-wasm)
   ============================================================ */
async function extractArchive(path){
  const name=fs.basename(path);const e=extOf(name);
  const dir=fs.dirname(path);
  const outDir=fs.join(dir,name.replace(/\.(zip|gz|tar|tgz|7z|rar|bz2|xz)$/i,'')||'解压');
  toast('正在解压 '+name+' ...');
  try{
    await fs.mkdir(outDir,true);
    const buf=await fs.readFile(path,{arrayBuffer:true});
    if(e==='zip'){
      if(!window.JSZip){toast('JSZip 未加载','err');return;}
      const zip=await JSZip.loadAsync(buf);
      const entries=Object.values(zip.files);
      for(const ent of entries){
        if(ent.dir){await fs.mkdir(fs.join(outDir,ent.name),true);continue;}
        const data=await ent.async('uint8array');
        await fs.writeFile(fs.join(outDir,ent.name),data);
      }
    }else if(e==='gz'||e==='tgz'||e==='tar'){
      let tarBuf=buf;
      if(e==='gz'||e==='tgz'||name.endsWith('.gz')){
        if(typeof DecompressionStream!=='undefined'){
          const ds=new DecompressionStream('gzip');
          const decompressed=new Response(new Blob([buf]).stream().pipeThrough(ds));
          tarBuf=await decompressed.arrayBuffer();
        }else{toast('浏览器不支持原生 gzip 解压','err');return;}
      }
      if(name.endsWith('.tar')||name.endsWith('.tgz')||e==='tar'||(e==='gz'&&name.endsWith('.tar.gz'))){
        await extractTar(tarBuf,outDir);
      }else{
        // 纯 gz 单文件
        const inner=name.replace(/\.gz$/i,'');
        await fs.writeFile(fs.join(outDir,inner),tarBuf);
      }
    }else if(e==='7z'){
      await extract7z(buf,outDir);
    }else if(e==='bz2'){
      if(typeof DecompressionStream!=='undefined'&&DecompressionStream.supported?.('deflate-raw')){}
      // bz2 原生不支持，提示
      toast('bz2 需 7z-wasm，尝试中...');
      await extract7z(buf,outDir);
    }else{
      toast('不支持的格式: '+e,'err');return;
    }
    toast('解压完成 -> '+fs.basename(outDir),'ok');
    refreshDirWindows(dir);Desktop.refresh();
    Apps.open('explorer',{path:outDir});
  }catch(err){console.error(err);toast('解压失败: '+err.message,'err');}
}
window.extractArchive=extractArchive;

async function extractTar(buf,outDir){
  // tar 格式解析：512字节块，文件头+数据
  const u8=new Uint8Array(buf);
  let pos=0;
  function readStr(off,len){let s='';for(let i=0;i<len;i++){const c=u8[off+i];if(c===0)break;s+=String.fromCharCode(c);}return s;}
  function readOct(off,len){const s=readStr(off,len).trim();return s?parseInt(s,8):0;}
  while(pos+512<=u8.length){
    const name=readStr(pos,100);
    if(!name)break;
    const size=readOct(pos+124,12);
    const type=String.fromCharCode(u8[pos+156]||0);
    const prefix=readStr(pos+345,155);
    let fullName=prefix?prefix+'/'+name:name;
    if(type==='5'||fullName.endsWith('/')){await fs.mkdir(fs.join(outDir,fullName),true);}
    else if(type==='0'||type===''||type==='7'){
      if(size>0){const data=u8.slice(pos+512,pos+512+size);await fs.writeFile(fs.join(outDir,fullName),data);}
    }
    pos+=512+Math.ceil(size/512)*512;
  }
}

let _7zModule=null;
async function extract7z(buf,outDir){
  if(!_7zModule){
    const mod=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    _7zModule=await mod.default({locateFile:p=>'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/'+p});
  }
  const FS=_7zModule.FS;
  const tmpIn='/in.7z';
  FS.writeFile(tmpIn,new Uint8Array(buf));
  const tmpOut='/7zout';FS.mkdir(tmpOut);
  // 运行 7z x
  _7zModule.callMain(['x',tmpIn,'-o'+tmpOut,'-y']);
  // 递归读取 tmpOut 写入 VFS
  async function walk(fsPath,vfsPath){
    const names=FS.readdir(fsPath);
    for(const n of names){if(n==='.'||n==='..')continue;const fp=fsPath+'/'+n;const st=FS.stat(fp);const vp=fs.join(vfsPath,n);
      if(FS.isDir(st.mode)){await fs.mkdir(vp,true);await walk(fp,vp);}
      else{const data=FS.readFile(fp);await fs.writeFile(vp,data);}
    }
  }
  await walk(tmpOut,outDir);
  try{FS.unlink(tmpIn);}catch(e){}
}
</script>
<script>
/* ============================================================
   记事本 Notepad
   ============================================================ */
Apps.register({
  id:'notepad',name:'记事本',icon:Icons.notepad,
  launch(args){
    const rec=WM.create({app:'notepad',title:'记事本',icon:Icons.notepad,width:640,height:480,x:140,y:90});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="notepad"><div class="toolbar" id="np-tb"></div><textarea id="np-ta" spellcheck="false"></textarea><div class="statusbar" id="np-sb"></div></div>`;
    const ta=$('#np-ta',body);const sb=$('#np-sb',body);
    let filePath=args.path||null,orig='';
    const tb=$('#np-tb',body);
    function btn(i,t,fn){const b=el('button','t-btn',i);b.title=t;b.onclick=fn;return b;}
    tb.appendChild(btn(Icons.open,'打开',async()=>{const inp=el('input');inp.type='file';inp.onchange=async()=>{const f=inp.files[0];const buf=await f.arrayBuffer();const txt=new TextDecoder().decode(buf);ta.value=txt;filePath='/文档/'+f.name;orig=txt;updateTitle();updateStatus();};inp.click();}));
    tb.appendChild(btn(Icons.save,'保存',save));
    tb.appendChild(btn(Icons.newFolder,'另存为',saveAs));
    tb.appendChild(el('div','t-sep'));
    tb.appendChild(btn(Icons.format,'自动换行',()=>{ta.style.whiteSpace=ta.style.whiteSpace==='pre'?'pre-wrap':'pre';}));
    tb.appendChild(el('div','t-sep'));
    tb.appendChild(btn(Icons.editor,'用代码编辑器打开',()=>{if(filePath)Apps.open('editor',{path:filePath});}));

    async function load(){
      if(filePath){try{const t=await fs.readFile(filePath);ta.value=t;orig=t;updateTitle();}catch(e){toast(e.message,'err');}}
      updateStatus();
    }
    async function save(){
      if(!filePath){return saveAs();}
      try{await fs.writeFile(filePath,ta.value);orig=ta.value;updateTitle();toast('已保存','ok');refreshDirWindows(fs.dirname(filePath));Desktop.refresh();}catch(e){toast(e.message,'err');}
    }
    function saveAs(){
      modal({title:'另存为',inputs:[{label:'保存路径（如 /文档/文件.txt）',value:filePath||'/文档/未命名.txt'}],okText:'保存',onOk:async v=>{
        const p=v[0];if(!p)return false;try{await fs.writeFile(p,ta.value);filePath=p;orig=ta.value;updateTitle();toast('已保存','ok');refreshDirWindows(fs.dirname(p));Desktop.refresh();}catch(e){toast(e.message,'err');}
      }});
    }
    function updateTitle(){rec.titleEl.textContent='记事本 — '+(filePath?fs.basename(filePath):'未命名')+(ta.value!==orig?' *':'');}
    function updateStatus(){const v=ta.value;const lines=v.split('\n').length;const chars=v.length;sb.innerHTML=`<span class="sb-item">${filePath||'未命名'}</span><span class="sb-spacer"></span><span class="sb-item">行 ${lines}</span><span class="sb-item">字符 ${chars}</span><span class="sb-item">UTF-8</span>`;}
    ta.addEventListener('input',()=>{updateTitle();updateStatus();});
    ta.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();save();}if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+2;}});
    body.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();save();}});
    load();
    return rec;
  }
});

/* ============================================================
   表格 Table (CSV/TSV 双视图)
   ============================================================ */
Apps.register({
  id:'table',name:'表格',icon:Icons.table,
  launch(args){
    const rec=WM.create({app:'table',title:'表格',icon:Icons.table,width:720,height:480,x:170,y:110});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="table-app"><div class="toolbar" id="tb-tb"></div><div class="table-wrap" id="tb-wrap"></div><div class="statusbar" id="tb-sb"></div></div>`;
    let filePath=args.path||null,raw='',delim=',',view='table';
    if(filePath&&extOf(filePath)==='tsv')delim='\t';
    const tb=$('#tb-tb',body);
    function btn(i,t,fn,cls){const b=el('button','t-btn '+(cls||''),i);b.title=t;b.onclick=fn;return b;}
    const tableBtn=btn(Icons.table,'表格视图',()=>{view='table';render();},'active');
    const textBtn=btn(Icons.notepad,'文本视图',()=>{view='text';render();});
    tb.appendChild(tableBtn);tb.appendChild(textBtn);tb.appendChild(el('div','t-sep'));
    tb.appendChild(btn(Icons.save,'保存',save));
    tb.appendChild(el('div','t-sep'));
    const delimSel=el('select');['逗号(,)','制表符(\\t)','分号(;)','竖线(|)'].forEach((n,i)=>{const o=el('option');o.value=[',','\t',';','|'][i];o.textContent=n;if([',','\t',';','|'][i]===delim)o.selected=true;delimSel.appendChild(o);});
    delimSel.onchange=()=>{delim=delimSel.value;render();};tb.appendChild(delimSel);

    function parseCSV(text,d){
      const rows=[];let row=[],cur='',inQ=false;
      for(let i=0;i<text.length;i++){
        const c=text[i];
        if(inQ){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
        else{if(c==='"')inQ=true;else if(c===d){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c==='\r'){}else cur+=c;}
      }
      if(cur||row.length){row.push(cur);rows.push(row);}
      return rows.filter(r=>r.length&&!(r.length===1&&r[0]===''));
    }
    function render(){
      const wrap=$('#tb-wrap',body);
      tableBtn.classList.toggle('active',view==='table');textBtn.classList.toggle('active',view==='text');
      if(view==='text'){
        const ta=el('textarea');ta.value=raw;ta.style.cssText='width:100%;height:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;padding:14px;font-family:var(--font-mono);font-size:13px';
        ta.oninput=()=>{raw=ta.value;};
        wrap.innerHTML='';wrap.appendChild(ta);
      }else{
        const rows=parseCSV(raw,delim);
        if(!rows.length){wrap.innerHTML='<div class="empty">空表格</div>';return;}
        const t=el('table');const thead=el('tr');
        rows[0].forEach((c,i)=>{const th=el('th',null,c);thead.appendChild(th);});
        t.appendChild(thead);
        for(let r=1;r<rows.length;r++){const tr=el('tr');rows[r].forEach(c=>{const td=el('td','editable',c);td.contentEditable=true;td.onblur=()=>{rows[r][rows[r].indexOf(c)]=td.textContent;syncRaw(rows);};tr.appendChild(td);});t.appendChild(tr);}
        wrap.innerHTML='';wrap.appendChild(t);
      }
      $('#tb-sb',body).innerHTML=`<span class="sb-item">${filePath||'未命名'}</span><span class="sb-spacer"></span><span class="sb-item">分隔符: ${delim==='\t'?'Tab':delim}</span>`;
    }
    function syncRaw(rows){raw=rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(delim)).join('\n');}
    async function save(){if(!filePath){modal({title:'另存为',inputs:[{label:'路径',value:'/文档/表格.csv'}],okText:'保存',onOk:async v=>{filePath=v[0];await fs.writeFile(filePath,raw);toast('已保存','ok');}});return;}await fs.writeFile(filePath,raw);toast('已保存','ok');refreshDirWindows(fs.dirname(filePath));}
    async function load(){if(filePath){try{raw=await fs.readFile(filePath);rec.titleEl.textContent='表格 — '+fs.basename(filePath);}catch(e){toast(e.message,'err');}}render();}
    load();
    return rec;
  }
});

   计算器 Calculator

Apps.register({
  id:'calculator',name:'计算器',icon:Icons.calc,singleton:true,
  launch(){
    const rec=WM.create({app:'calculator',title:'计算器',icon:Icons.calc,width:300,height:420,x:200,y:120});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="calc-app"><div class="display"><div class="expr" id="ca-expr"></div><div class="res" id="ca-res">0</div></div><div class="keys" id="ca-keys"></div></div>`;
    const expr=$('#ca-expr',body),res=$('#ca-res',body);
    let cur='0',history='';
    const layout=[
      ['C','fn'],['(','op'],[')','op'],['/','op'],
      ['7',''],['8',''],['9',''],['*','op'],
      ['4',''],['5',''],['6',''],['-','op'],
      ['1',''],['2',''],['3',''],['+','op'],
      ['0',''],['.',''],['=','eq'],
    ];
    const keys=$('#ca-keys',body);
    layout.forEach(([k,cls])=>{
      if(k==='='){const b=el('button','key eq',k);b.style.gridColumn='span 1';b.onclick=()=>calc();keys.appendChild(b);return;}
      const b=el('button','key '+(cls||''),k);b.onclick=()=>press(k);keys.appendChild(b);
    });
    // 退格
    const bk=el('button','key fn','⌫');bk.onclick=()=>{cur=cur.length>1?cur.slice(0,-1):'0';update();};keys.appendChild(bk);
    function press(k){
      if(k==='C'){cur='0';history='';update();return;}
      if(cur==='0'&&/[0-9.]/.test(k))cur=k;else cur+=k;
      update();
    }
    function calc(){
      try{
        const e=cur.replace(/[^-()\d/*+.]/g,'');
        const r=Function('"use strict";return ('+e+')')();
        history=cur+' =';cur=String(r);update();
      }catch(e){history=cur;cur='错误';update();setTimeout(()=>{cur='0';update();},800);}
    }
    function update(){expr.textContent=history;res.textContent=cur;}
    body.addEventListener('keydown',e=>{
      if(/[0-9+\-*/.()]/.test(e.key))press(e.key);
      if(e.key==='Enter'||e.key==='=')calc();
      if(e.key==='Backspace')bk.onclick();
      if(e.key==='Escape')press('C');
    });
    update();
    return rec;
  }
});

Apps.register({
  id:'browser',name:'网页浏览器',icon:Icons.browser,
  launch(args){
    const rec=WM.create({app:'browser',title:'网页浏览器',icon:Icons.browser,width:900,height:600,x:80,y:60});
    const body=rec.bodyEl;
    body.innerHTML=`<div class="browser-app"><div class="addr-bar"><button class="t-btn" id="br-back">${Icons.back}</button><button class="t-btn" id="br-fwd">${Icons.fwd}</button><button class="t-btn" id="br-reload">${Icons.refresh}</button><input id="br-addr" placeholder="输入网址或搜索..."><button class="t-btn" id="br-go">${Icons.run}</button></div><div id="br-content" class="home">${Icons.browser}<div style="font-family:var(--font-display);font-size:22px;color:var(--text)">墨砚浏览器</div><div style="font-size:12px">输入网址开始浏览</div></div></div>`;
    const addr=$('#br-addr',body),content=$('#br-content',body);
    const hist=[],fut=[];
    async function go(url,skipHist){
      if(!url)return;
      if(!skipHist&&content.dataset.url)hist.push(content.dataset.url);
      content.className='';
      content.innerHTML='';
      const frame=el('iframe');frame.sandbox='allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox';
      let src=url;
      if(url.startsWith('http://')||url.startsWith('https://'))src=url;
      else if(url.includes('.')&&!url.includes(' '))src='https://'+url;
      else src='https://www.bing.com/search?q='+encodeURIComponent(url);
      frame.src=src;content.appendChild(frame);
      content.dataset.url=src;addr.value=src;
      rec.titleEl.textContent='网页浏览器 — '+src;
      frame.onerror=()=>toast('无法加载（可能被跨域限制）','err');
    }
    $('#br-go',body).onclick=()=>go(addr.value);
    $('#br-back',body).onclick=()=>{if(hist.length){fut.push(content.dataset.url);go(hist.pop(),true);}};
    $('#br-fwd',body).onclick=()=>{if(fut.length){hist.push(content.dataset.url);go(fut.pop(),true);}};
    $('#br-reload',body).onclick=()=>{if(content.dataset.url)go(content.dataset.url,true);};
    addr.addEventListener('keydown',e=>{if(e.key==='Enter')go(addr.value);});
    // 打开本地 HTML
    if(args.htmlPath){
      (async()=>{const buf=await fs.readFile(args.htmlPath,{arrayBuffer:true});const blob=new Blob([buf],{type:'text/html'});const url=URL.createObjectURL(blob);
        content.className='';content.innerHTML='';const frame=el('iframe');frame.sandbox='allow-scripts allow-forms allow-same-origin allow-popups allow-modals';frame.src=url;content.appendChild(frame);addr.value='file://'+args.htmlPath;rec.titleEl.textContent='浏览器 — '+fs.basename(args.htmlPath);

        const editBtn=el('button','btn',Icons.editor+' 编辑源码');editBtn.style.cssText='position:absolute;top:50px;right:14px;z-index:5';editBtn.onclick=()=>Apps.open('editor',{path:args.htmlPath});content.style.position='relative';content.appendChild(editBtn);
      })();
    }
    return rec;
  }
});

/* ============================================================
   CodeMirror 动态加载器
   ============================================================ */
let _cmReady=null;
function loadCodeMirror(){
  if(_cmReady)return _cmReady;
  _cmReady=new Promise((resolve,reject)=>{
    const base='https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/';
    const css=el('link');css.rel='stylesheet';css.href=base+'codemirror.min.css';document.head.appendChild(css);
    const theme=el('link');theme.rel='stylesheet';theme.href=base+'theme/material-darker.min.css';document.head.appendChild(theme);
    const fold=el('link');fold.rel='stylesheet';fold.href=base+'addon/fold/foldgutter.min.css';document.head.appendChild(fold);
    const dialog=el('link');dialog.rel='stylesheet';dialog.href=base+'addon/dialog/dialog.min.css';document.head.appendChild(dialog);
    const scripts=[
      'codemirror.min.js',
      'mode/xml/xml.min.js','mode/css/css.min.js','mode/javascript/javascript.min.js',
      'mode/htmlmixed/htmlmixed.min.js','mode/markdown/markdown.min.js',
      'addon/edit/matchbrackets.min.js','addon/edit/closebrackets.min.js','addon/edit/matchtags.min.js','addon/edit/closetags.min.js',
      'addon/edit/trailingspace.min.js',
      'addon/fold/foldcode.min.js','addon/fold/foldgutter.min.js','addon/fold/brace-fold.min.js','addon/fold/xml-fold.min.js','addon/fold/comment-fold.min.js','addon/fold/indent-fold.min.js',
      'addon/selection/active-line.min.js','addon/selection/mark-selection.min.js',
      'addon/search/searchcursor.min.js','addon/dialog/dialog.min.js',
      'addon/format/formatting.js',
    ];
    let i=0;
    function next(){
      if(i>=scripts.length){
        // js-beautify
        const bf=el('script');bf.src='https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js';bf.onload=()=>{const bf2=el('script');bf2.src='https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js';bf2.onload=()=>{const bf3=el('script');bf3.src='https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.min.js';bf3.onload=()=>resolve(window.CodeMirror);bf3.onerror=()=>resolve(window.CodeMirror);document.head.appendChild(bf3);};bf2.onerror=()=>resolve(window.CodeMirror);document.head.appendChild(bf2);};bf.onerror=()=>resolve(window.CodeMirror);document.head.appendChild(bf);
        return;
      }
      const s=el('script');s.src=base+scripts[i];s.onload=()=>{i++;next();};s.onerror=()=>{console.warn('CM load fail',scripts[i]);i++;next();};
      document.head.appendChild(s);
    }
    next();
  });
  return _cmReady;
}

    const ta=$('#ed-ta',body);ta.value=initialContent;

      showTrailingSpace:true,matchBrackets:true,autoCloseBrackets:true,
      matchTags:{bothTags:true},autoCloseTags:true,
      foldGutter:true,gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],

        'Ctrl-Y':()=>cm.redo(),
