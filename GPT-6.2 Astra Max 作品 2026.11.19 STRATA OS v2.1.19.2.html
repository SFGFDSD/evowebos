async function fullStorageCheck(){

  });
  window.addEventListener('offline', () => toast('已离线，本地文件仍然可用'));
  window.addEventListener('online', () => toast('网络连接已恢复'));
  document.addEventListener('contextmenu',e=>{
    const b=e.target.closest('.app-launch');if(!b)return;
    const id=Object.keys(apps).find(k=>apps[k].name===b.textContent.trim());if(!id)return;
    e.preventDefault();menu([
      ['打开应用','external',()=>launch(id)],
      ['添加到桌面','desktop',()=>{
        prefs.extraApps=[...new Set([...(prefs.extraApps||[]),id])];prefs.hiddenApps=prefs.hiddenApps.filter(k=>k!==id);
        savePrefs();renderDesktop();toast('已添加桌面快捷方式');
      }]
    ],e.clientX,e.clientY,apps[id].name);
  });
  window.addEventListener('beforeunload',e=>{
    if([...wins.values()].some(w=>w.hasUnsaved?.())){e.preventDefault();e.returnValue=''}
  });
}

async function connectPreviousMounts() {
  let waiting = 0;
  for (const name of prefs.mountNames) {
    try {
      const handle = database && await queryDB('mounts', 'readonly', s => s.get(name));
      if (handle && await handle.queryPermission({mode:'readwrite'}) === 'granted') {
        drives.set('/mnt/local/' + name, new HandleVolume(handle, 'mnt:' + name));
      } else waiting++;
    } catch (e) { waiting++; }
  }
  if (waiting) toast(`${waiting} 个本地目录等待授权，请前往“设置 / 挂载设备”重新连接。`, 5500);
}

function startDesktop() {
  $('#brand-logo').innerHTML = logo(26);
  for (const holder of $$('[data-icon]')) holder.innerHTML = I(holder.dataset.icon, holder.dataset.icon === 'down' ? 10 : 15);
  $('#workspace-num').textContent = pad(prefs.desktopSpace);
  applyPrefs();
  applyWallpaper();
  installSystemEvents();
  renderDesktop();
  updateClock();
  setInterval(updateClock, 1000);
  requestAnimationFrame(frameMonitor);
  readyPromise = initFS();
  if (innerWidth > 600) openExplorer('@home', true);
  readyPromise.then(async () => {
    await connectPreviousMounts();
    await renderDesktop();
    if (prefs.customWall) await applyWallpaper();
    await updateStorageWidget();
    notifyFS();
    document.documentElement.dataset.storage = prefs.backend;
    const selfCheck=()=>fullStorageCheck().then(report=>{
      if(report.includes('失败  '))toast('存储自检发现问题，请查看“系统设置 / 关于系统”。',6000);
    }).catch(e=>console.warn('Strata storage diagnostics:',e));
    if('requestIdleCallback' in window)requestIdleCallback(selfCheck,{timeout:4000});
    else setTimeout(selfCheck,600);
  }).catch(e => {
    $('#system-status').textContent = '存储不可用';
    $('#mon-backend').textContent = '未连接';
    $('#mon-storage').textContent = '不可用';
    toast('无法初始化持久存储，请允许站点数据并使用 HTTPS 或 localhost。' + e.message, 9000);
  });
}
startDesktop();
window.strata=Object.freeze({version:'1.0',ready:readyPromise,open:launch,fs,
  checkStorage:fullStorageCheck,get diagnostics(){return lastDiagnostics},
  get volumes(){return [...drives].map(([path,v])=>({path,name:v.label}))}
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
