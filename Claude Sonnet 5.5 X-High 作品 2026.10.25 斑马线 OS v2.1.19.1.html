 async function runScan(btn){btn.disabled=true;const res=main.querySelector('#sg-res');const data={cat:CAT.map(c=>({label:c[0],color:c[1],size:0})),be:[],big:[],top:new Map(),tree:{name:'全部存储',path:'/',size:0,kids:new Map()},files:0};const ac=new AbortController();
  for(const m of fs.mounts()){let size=0;const base=m.point;await fs.walk(base,e=>{if(e.type==='dir')return true;size+=e.size||0;data.files++;data.cat[catOf(e.name)].size+=e.size||0;
    const segs=e.path.split('/').filter(Boolean);let nd=data.tree;nd.size+=e.size||0;for(let i=0;i<Math.min(segs.length,5);i++){let c=nd.kids.get(segs[i]);if(!c){c={name:segs[i],path:'/'+segs.slice(0,i+1).join('/'),size:0,kids:new Map(),dir:i<segs.length-1};nd.kids.set(segs[i],c)}c.size+=e.size||0;if(i<segs.length-1)c.dir=true;nd=c}
    if(data.big.length<12||e.size>data.big[data.big.length-1].size){data.big.push({path:e.path,size:e.size||0});data.big.sort((a,b)=>b.size-a.size);data.big.length=Math.min(12,data.big.length)}
    if((data.files&63)===0)res.innerHTML=`<div style="margin-top:10px;color:var(--ink2);font-size:12.5px">${umbSVG(16)} 已扫描 ${data.files} 个文件，${fmtSize(data.cat.reduce((s,c)=>s+c.size,0))}…</div>`;return true},ac.signal);
   data.be.push({label:m.be.label,size,color:m.be.id==='opfs'?'#e5342b':m.be.id==='idb'?'#19b8a8':'#e0a82b'})}
  scan=data;tmPath=null;btn.disabled=false;btn.lastChild.textContent='重新分析';showScan()}
 function showScan(){const res=main.querySelector('#sg-res');if(!res||!scan)return;const d=scan;
  res.innerHTML=`<div class="sg-sub" style="margin-top:14px">按存储后端</div>${stack(d.be)}<div class="sg-sub" style="margin-top:6px">按文件类型</div>${stack(d.cat)}<div class="sg-sub" style="margin-top:6px">空间树图（点击文件夹深入）</div><div id="sg-tmb" style="font-size:12px;color:var(--ink2)"></div><div class="sg-tm" id="sg-tm"></div><div class="sg-sub">最大的文件</div><div class="sg-list">${d.big.map(b=>`<div><span>${fileIco(b.path,20)} ${esc(P.base(b.path))} <small>${esc(P.dir(b.path))}</small></span><small>${fmtSize(b.size)}</small><button class="btn sm" data-open="${esc(P.dir(b.path))}">定位</button></div>`).join('')||'<div style="color:var(--mute)">没有文件</div>'}</div>`;drawTm()}
 function findNode(p){let nd=scan.tree;if(!p||p==='/')return nd;for(const s of p.split('/').filter(Boolean)){nd=nd.kids.get(s);if(!nd)return scan.tree}return nd}
 function drawTm(){const nd=findNode(tmPath),box=main.querySelector('#sg-tm'),bar=main.querySelector('#sg-tmb');if(!box)return;const segs=(nd.path||'/').split('/').filter(Boolean);
  bar.innerHTML=`<a data-tm="/" style="color:var(--accent);cursor:pointer">全部</a>`+segs.map((s,i)=>` / <a data-tm="/${esc(segs.slice(0,i+1).join('/'))}" style="color:var(--accent);cursor:pointer">${esc(i===0?(fs.be(s)?fs.be(s).label:s):s)}</a>`).join('')+` ・ ${fmtSize(nd.size)}`;
  let items=[...nd.kids.values()].filter(k=>k.size>0).sort((a,b)=>b.size-a.size);if(items.length>36){const rest=items.slice(35);items=items.slice(0,35);items.push({name:'其他 '+rest.length+' 项',size:rest.reduce((s,k)=>s+k.size,0),kids:new Map(),other:true})}
  const out=[];const lay=(its,x,y,w,hh)=>{if(!its.length)return;if(its.length===1){out.push({it:its[0],x,y,w,h:hh});return}const tot=its.reduce((s,i)=>s+i.size,0);let acc=0,k=0;while(k<its.length-1&&acc+its[k].size<=tot/2)acc+=its[k++].size;if(k===0){acc=its[0].size;k=1}const f=acc/tot,a=its.slice(0,k),b=its.slice(k);if(w>=hh*1.6){lay(a,x,y,w*f,hh);lay(b,x+w*f,y,w*(1-f),hh)}else{lay(a,x,y,w,hh*f);lay(b,x,y+hh*f,w,hh*(1-f))}};lay(items,0,0,100,100);
  const pal=['#e5342b','#19b8a8','#efe9dd','#e0a82b','#2f5fb3','#ff6a3d','#7ec8bd','#c9c2b3'];box.innerHTML=out.map((o,i)=>`<div data-tm="${o.it.dir&&!o.it.other?esc(o.it.path):''}" style="left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;background-color:${o.it.other?'#4a4750':pal[i%pal.length]}" title="${esc(o.it.name)}：${fmtSize(o.it.size)}"><b>${esc(o.it.name)}</b>${fmtSize(o.it.size)}</div>`).join('')||'<div style="position:static;color:#8b877f;border:0;background:none;padding:12px">没有可显示的数据</div>'}
 async function resetFS(){const ok=await Dlg.prompt('一键重置文件系统',{label:'这会永久删除 OPFS 与 IndexedDB 中的所有文件、文件夹和元数据，并恢复初始状态。请输入「重置」以确认。',ok:'清空并重置',validate:v=>v==='重置'?'':'请输入「重置」二字'});if(ok!=='重置')return;
  const pt=progressToast('正在重置…');window.__resetting=true;S.flush=()=>{};Meta.flush=async()=>{};try{if(navigator.storage&&navigator.storage.getDirectory){const r=await navigator.storage.getDirectory();for await(const[n]of r.entries())await r.removeEntry(n,{recursive:true}).catch(()=>{})}}catch(e){}

  else if(k==='rset'){if(await Dlg.confirm('确定要恢复所有设置为默认值吗？文件不会受影响。',{ok:'重置设置',danger:true})){S.flush=()=>{};localStorage.removeItem('webos.settings');await KV.del('settings');document.cookie='webos_s=;max-age=0;path=/';location.reload()}}else if(k==='rfs')resetFS();
  else if(k==='persist'){try{const ok=await navigator.storage.persist();toast(ok?'已启用持久化存储':'浏览器拒绝了持久化请求（可尝试添加书签或安装为应用）',ok?'ok':'warn');renderStorage(++tok)}catch(er){errToast(er)}}else if(k==='mount'){await Mounts.add();renderStorage(++tok)}else if(k==='scan')runScan(a)});
 root.addEventListener('change',e=>{const t=e.target;if(t.dataset.k){S.set(t.dataset.k,t.checked);return}if(t.dataset.sel){S.set(t.dataset.sel,t.value);return}if(t.hasAttribute('data-acc-c')){S.set('accent',t.value);return}
  if(t.dataset.pin){const s=new Set(S.v.pinned);t.checked?s.add(t.dataset.pin):s.delete(t.dataset.pin);S.set('pinned',[...s]);return}if(t.dataset.show){const s=new Set(S.v.hiddenApps);t.checked?s.delete(t.dataset.show):s.add(t.dataset.show);S.set('hiddenApps',[...s])}});
 root.addEventListener('input',e=>{const t=e.target;if(t.dataset.r)S.set(t.dataset.r,+t.value)});
 const un=OS.on('mounts',()=>{if(page==='storage')renderStorage(++tok)});win.onClose=()=>un();render();return win}
})();
</script>
<script id="s-boot">
'use strict';
/* ============ 启动：立即进入系统，无任何假加载；文件系统在后台就绪 ============ */
(function(){
 const safe=(name,f)=>{try{const r=f();if(r&&r.catch)r.catch(e=>console.error('['+name+']',e))}catch(e){console.error('['+name+']',e)}};
 const hadLocal=!!localStorage.getItem('webos.settings');
 safe('apply',applySettings);
 OS.on('settings',()=>safe('apply',applySettings));
 safe('taskbar',()=>Taskbar.init());
 safe('desk',()=>Desk.init());
 if(!String(S.v.wall).startsWith('file:'))safe('wall',()=>Wall.apply());
 document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,[contenteditable=true]'))e.preventDefault()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){Start.close();$('#calpop').classList.add('hidden')}});
 let lastErr=0;addEventListener('unhandledrejection',e=>{const m=e.reason&&e.reason.message||String(e.reason);if(Date.now()-lastErr>2500&&!/AbortError|ResizeObserver/.test(m)){lastErr=Date.now();console.error(e.reason);toast('出错了：'+m,'err')}});
 addEventListener('beforeunload',()=>{try{Meta.flush();S.flush()}catch(e){}});
 // 桌面右键菜单在任务栏隐藏时仍可唤起开始菜单：Ctrl+K / 左下角热区
 (async()=>{
  try{await initFS()}catch(e){console.error(e);toast('文件系统初始化失败：'+e.message,'err',8000)}
  if(!hadLocal){try{if(await S.loadIDB()){safe('apply',applySettings)}}catch(e){}}
  if(S.v.wall&&String(S.v.wall).startsWith('file:'))safe('wall',()=>Wall.apply());
  safe('desk-refresh',()=>Desk.refresh());safe('mounts',()=>Mounts.restore());OS.emit('ready');
  // 首次使用提示（仅一次，非加载动画）
  try{if(!(await KV.get('tip1'))){await KV.set('tip1',1);setTimeout(()=>toast('单击图标即可打开 · 拖动窗口到屏幕边缘可贴靠 · 右键桌面可新建与个性化 · Ctrl+K 全局搜索',{ms:9000}),900)}}catch(e){}
 })();
})();
</script>
