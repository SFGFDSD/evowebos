          <div style="font-size:11px;color:var(--text-dim);line-height:1.8" id="sm-keys"></div>
        </div>
      </div>
    `;

    const ua = navigator.userAgent;
    const browser = ua.match(/(Chrome|Firefox|Safari|Edge|Opera)[\/\s](\d+)/)?.[0] || 'Unknown';
    document.getElementById('sm-browser').innerHTML = `Browser: ${browser}<br>Screen: ${screen.width}x${screen.height}<br>Lang: ${navigator.language}<br>Cookies: ${navigator.cookieEnabled?'On':'Off'}`;

    let lsKeys = 0;
    try { lsKeys = localStorage.length; } catch(e){}
    document.getElementById('sm-keys').innerHTML = `LS Keys: ${lsKeys}<br>FS Key: volt_fs_v1<br>Meta Key: volt_meta_v1`;

    self.update();
    self.interval = setInterval(() => self.update(), 1000);
  },

  countNodes(path = '/') {
    let c = 0;
    const node = FS.getNode(path);
    if (!node || node.type !== 'dir') return 1;
    c++;
    for (const child in node.children) {
      c += this.countNodes((path === '/' ? '' : path) + '/' + child);
    }
    return c;
  },

  update() {
    const info = FS.storageInfo();
    const pct = Math.round(info.usedBytes / info.total * 100);
    const el1 = document.getElementById('sm-storage');
    const el2 = document.getElementById('sm-storage-bar');
    const el3 = document.getElementById('sm-files');
    const el4 = document.getElementById('sm-wins');
    const el5 = document.getElementById('sm-uptime');
    if (el1) el1.textContent = (info.usedBytes / 1024).toFixed(1);
    if (el2) el2.style.width = pct + '%';
    if (el3) el3.textContent = this.countNodes();
    if (el4) el4.textContent = WM.getAll().length;
    if (el5) el5.textContent = Math.round(performance.now() / 1000);

    const c = document.getElementById('sm-chart');
    if (c) {
      const ctx = c.getContext('2d');
      const w = c.offsetWidth; c.width = w;
      ctx.clearRect(0, 0, w, 80);
      // Draw usage bar
      const dirs = ['/home', '/system', '/tmp'];
      const sizes = dirs.map(d => FS.du(d));
      const total = sizes.reduce((a,b) => a+b, 0) || 1;
      const colors = ['#FFD700', '#FF8800', '#4488FF'];
      let x = 0;
      sizes.forEach((s, i) => {
        const bw = (s / total) * w;
        ctx.fillStyle = colors[i];
        ctx.fillRect(x, 10, bw, 30);
        x += bw;
      });
      // Legend
      dirs.forEach((d, i) => {
        ctx.fillStyle = colors[i];
        ctx.fillRect(i * (w/3), 50, 12, 12);
        ctx.fillStyle = '#888';
        ctx.font = '10px monospace';
        ctx.fillText(`${d} (${formatSize(sizes[i])})`, i*(w/3)+16, 61);
      });
    }
  },
};

    const icon = document.getElementById('music-play-icon');

    self.interval = setInterval(() => {
      self.pos = Math.min(self.pos + 1, self.duration);
      self.updateProgress();
      if (self.pos >= self.duration) { self.next(); }
    }, 1000);

    const self = apps.music;
    self.playing = false;
    clearInterval(self.interval);
    const icon = document.getElementById('music-play-icon');
    if (icon) icon.innerHTML = `<path d="M5 3l8 5-8 5V3z" fill="currentColor"/>`;
  },

  play(idx) {
    const self = apps.music;
    clearInterval(self.interval);
    self.current = idx;
    self.pos = 0;
    self.duration = self.songs[idx].duration;
    const title = document.getElementById('music-title');
    const artist = document.getElementById('music-artist');
    const dur = document.getElementById('music-dur');
    if (title) title.textContent = self.songs[idx].title;
    if (artist) artist.textContent = self.songs[idx].artist;
    if (dur) dur.textContent = self.fmtTime(self.duration);
    self.songs.forEach((_, i) => {
      const it = document.getElementById('music-item-'+i);
      if (it) { it.style.background = i===idx?'var(--bg-active)':''; it.style.color = i===idx?'var(--yellow)':'var(--text-dim)'; }
    });
    self.updateProgress();
    if (self.playing) { clearInterval(self.interval); self.resume(); }
    WM.setTitle('music', `${self.songs[idx].title} - Music Player`);
  },

  prev() { const self = apps.music; self.play((self.current - 1 + self.songs.length) % self.songs.length); },
  next() { const self = apps.music; self.play((self.current + 1) % self.songs.length); },

  seek(e) {
    const self = apps.music;
    const bar = e.currentTarget;
    const pct = e.offsetX / bar.offsetWidth;
    self.pos = Math.round(pct * self.duration);
    self.updateProgress();
  },

  updateProgress() {
    const self = apps.music;
    const fill = document.getElementById('music-fill');
    const time = document.getElementById('music-time');
    if (fill) fill.style.width = (self.pos / self.duration * 100) + '%';
    if (time) time.textContent = self.fmtTime(self.pos);
  },

  fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },
};

let ctxTarget = null;

function showFileCtx(e, path, type) {
  ctxTarget = { path, type };
  const ctx = document.getElementById('file-ctx');
  ctx.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  ctx.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
  ctx.classList.add('show');

  document.getElementById('ctx-open').onclick = () => {
    ctx.classList.remove('show');
    if (type === 'dir') apps.fileManager.navigate(path);
    else apps.textEditor.open(path);
  };

  document.getElementById('ctx-rename').onclick = async () => {
    ctx.classList.remove('show');
    const name = path.split('/').pop();
    const newName = await modal({ title: 'Rename', input: true, inputVal: name, buttons: [{ label: 'Cancel' }, { label: 'Rename', primary: true }] });
    if (!newName || newName === 'Cancel' || newName === 'Rename') return;
    const r = FS.rename(path, newName);
    if (r.ok) { notify('Renamed', newName, 'success'); apps.fileManager.render(); }
    else notify('Error', r.err, 'error');
  };

  document.getElementById('ctx-copy').onclick = () => {
    ctx.classList.remove('show');
    apps.fileManager.clipboard = { path, op: 'copy' };
    notify('Copied', path.split('/').pop(), 'info');
  };

  document.getElementById('ctx-cut').onclick = () => {
    ctx.classList.remove('show');
    apps.fileManager.clipboard = { path, op: 'cut' };
    notify('Cut', path.split('/').pop(), 'info');
  };

  document.getElementById('ctx-delete').onclick = async () => {
    ctx.classList.remove('show');
    const name = path.split('/').pop();
    const r2 = await modal({ title: 'Delete', body: `Delete "${name}"? This cannot be undone.`, buttons: [{ label: 'Cancel' }, { label: 'Delete', danger: true }] });
    if (r2 !== 'Delete') return;
    const r = FS.rm(path);
    if (r.ok) { notify('Deleted', name, 'success'); apps.fileManager.render(); refreshDesktop(); }
    else notify('Error', r.err, 'error');
  };
}

    { name: 'About', app: 'about', icon: ICONS.about },
    { name: 'Documents', app: 'fileManager', path: '/home/Documents', icon: ICONS.folder },
    { name: 'Downloads', app: 'fileManager', path: '/home/Downloads', icon: ICONS.folder },
  ];

  defaultItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'desktop-icon';
    el.innerHTML = `${item.icon}<div class="desktop-icon-label">${item.name}</div>`;
    el.onclick = () => {
      document.querySelectorAll('.desktop-icon').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    };
    el.ondblclick = () => {
      if (item.path) apps[item.app].open(item.path);
      else apps[item.app].open();
    };
    grid.appendChild(el);
  });
}

// ============================================================
// START MENU
// ============================================================
function buildStartMenu() {
  const appList = [
    { name: 'File Manager', app: 'fileManager', icon: ICONS.fileManager },
    { name: 'Terminal', app: 'terminal', icon: ICONS.terminal },
    { name: 'Text Editor', app: 'textEditor', icon: ICONS.editor },
    { name: 'Paint', app: 'paint', icon: ICONS.paint },
    { name: 'Calculator', app: 'calculator', icon: ICONS.calculator },
    { name: 'System Monitor', app: 'sysMonitor', icon: ICONS.monitor },
    { name: 'Music Player', app: 'music', icon: ICONS.music },
    { name: 'Settings', app: 'settings', icon: ICONS.settings },
    { name: 'About', app: 'about', icon: ICONS.about },
  ];

  const startApps = document.getElementById('start-apps');
  startApps.innerHTML = '';
  appList.forEach(a => {
    const el = document.createElement('div');
    el.className = 'start-app';
    el.dataset.name = a.name.toLowerCase();
    el.innerHTML = `${a.icon}<div class="start-app-name">${a.name}</div>`;
    el.onclick = () => { apps[a.app].open(); document.getElementById('start-menu').classList.remove('open'); };
    startApps.appendChild(el);
  });

  document.getElementById('app-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.start-app').forEach(a => {
      a.style.display = (!q || a.dataset.name.includes(q)) ? '' : 'none';
    });
  });
}

// ============================================================
// CLOCK & WEATHER
// ============================================================
function startClock() {
  function update() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const clock = document.getElementById('clock');
    if (clock) clock.textContent = `${h}:${m}:${s}`;
  }
  update();
  setInterval(update, 1000);

  // Simulated weather
  const weathers = ['Sunny', 'Cloudy', 'Rainy', 'Windy', 'Clear'];
  const temps = [18, 22, 15, 25, 20];
  const idx = Math.floor(Math.random() * weathers.length);
  document.getElementById('w-temp').textContent = temps[idx] + '°C';
  document.getElementById('w-desc').textContent = weathers[idx];
}

// ============================================================
// UTILITIES
// ============================================================
function escapeHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSize(bytes) {
  if (!bytes || bytes < 0) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}

function hexToRGBA(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b, 255];
}

// ============================================================
// OS-LEVEL FUNCTIONS
// ============================================================
function showSettings() { apps.settings.open(); }

function shutdown() {
  modal({ title: 'Shutdown', body: 'Shut down VOLT OS?', buttons: [{ label: 'Cancel' }, { label: 'Shutdown', danger: true }] }).then(r => {
    if (r === 'Shutdown') {
      document.body.style.transition = 'opacity 0.5s';
      document.body.style.opacity = '0';
      setTimeout(() => { document.body.innerHTML = '<div style="background:#000;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;color:#333;font-family:monospace;font-size:14px">VOLT OS — System Halted</div>'; document.body.style.opacity='1'; }, 500);
    }
  });
}

async function newFolderOnDesktop() {
  const name = await modal({ title: 'New Folder on Desktop', input: true, inputPlaceholder: 'Folder name', buttons: [{ label: 'Cancel' }, { label: 'Create', primary: true }] });
  if (!name || name === 'Cancel' || name === 'Create') return;
  const r = FS.mkdir('/home/Desktop/' + name);
  if (r.ok) { notify('Folder Created', name, 'success'); refreshDesktop(); }
  else notify('Error', r.err, 'error');
}

async function newFileOnDesktop() {
  const name = await modal({ title: 'New File on Desktop', input: true, inputPlaceholder: 'File name', inputVal: 'untitled.txt', buttons: [{ label: 'Cancel' }, { label: 'Create', primary: true }] });
  if (!name || name === 'Cancel' || name === 'Create') return;
  const r = FS.writeFile('/home/Desktop/' + name, '');
  if (r.ok) { notify('File Created', name, 'success'); refreshDesktop(); apps.textEditor.open('/home/Desktop/' + name); }
  else notify('Error', r.err, 'error');
}

function clearData() {
  modal({ title: 'Reset Filesystem', body: 'This will delete ALL files and reset the filesystem. Are you sure?', buttons: [{ label: 'Cancel' }, { label: 'Reset', danger: true }] }).then(r => {
    if (r === 'Reset') {
      localStorage.removeItem('volt_fs_v1');
      localStorage.removeItem('volt_meta_v1');
      notify('Filesystem Reset', 'Page will reload', 'warning');
      setTimeout(() => location.reload(), 1500);
    }
  });
}

function exportFS() {
  const data = localStorage.getItem('volt_fs_v1');
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'voltfs_backup.json'; a.click();
  URL.revokeObjectURL(url);
  notify('Exported', 'voltfs_backup.json', 'success');
}

function importFS() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        JSON.parse(ev.target.result); // validate
        localStorage.setItem('volt_fs_v1', ev.target.result);
        notify('Imported', 'Reloading...', 'success');
        setTimeout(() => location.reload(), 1000);
      } catch(err) { notify('Import Error', 'Invalid filesystem file', 'error'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
function setupEvents() {
  // Start button
  document.getElementById('start-btn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('start-menu').classList.toggle('open');
  };

  // Close menus on click outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
      document.getElementById('start-menu').classList.remove('open');
    }
    document.querySelectorAll('.ctx-menu').forEach(m => m.classList.remove('show'));
    document.querySelectorAll('.desktop-icon').forEach(d => d.classList.remove('selected'));
  });

  // Desktop right click
  document.getElementById('desktop').addEventListener('contextmenu', (e) => {
    if (e.target.closest('.window') || e.target.closest('.desktop-icon') || e.target.closest('#taskbar')) return;
    e.preventDefault();
    const ctx = document.getElementById('desktop-ctx');
    ctx.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    ctx.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
    ctx.classList.add('show');
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.altKey) {
      if (e.key === 't') apps.terminal.open();
      if (e.key === 'f') apps.fileManager.open();
      if (e.key === 'e') apps.textEditor.open();
    }
    if (e.key === 'Escape') {
      document.getElementById('start-menu').classList.remove('open');
      document.querySelectorAll('.ctx-menu').forEach(m => m.classList.remove('show'));
    }
  });

  // Window focus on desktop click
  document.getElementById('desktop').addEventListener('mousedown', (e) => {
    if (!e.target.closest('.window')) {
      document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
    }
  });
}

// ============================================================
// BOOT SEQUENCE
// ============================================================
function boot() {
  setTimeout(() => {
    const boot = document.getElementById('boot-screen');
    boot.style.opacity = '0';
    setTimeout(() => {
      boot.remove();
      setupEvents();
      buildStartMenu();
      refreshDesktop();
      startClock();
      notify('Welcome to VOLT OS', 'System ready. Press Ctrl+Alt+T for terminal.', 'success');
    }, 600);
  }, 2000);
}

// Public API
return {
  FS, WM, apps, appCleanup,
  notify, modal,
  showSettings, shutdown,
  newFolderOnDesktop, newFileOnDesktop,
  clearData, exportFS, importFS,
  boot,
};

})(); // end OS

// ============================================================
// EXPOSE GLOBALLY
// ============================================================
window.OS = OS;
window.WM = OS.WM;
window.FS = OS.FS;
window.apps = OS.apps;

OS.boot();
</script>
