      const sp=el('span',{text:label});n.appendChild(sp);
      const tag=isLocalRoot?'<span class="tag local" style="margin-left:auto">掛載</span>':'';
      if(tag)n.appendChild(el('span',{html:tag,style:'display:contents'}));
      n.onclick=()=>nav(path);
      n.addEventListener('dragover',e=>{
        if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types,'application/x-liantang')>=0){
          e.preventDefault();n.classList.add('drop');
        }
      });
      n.addEventListener('dragleave',()=>n.classList.remove('drop'));
      n.addEventListener('drop',async e=>{
        n.classList.remove('drop');e.preventDefault();e.stopPropagation();
        let d=null;try{d=JSON.parse(e.dataTransfer.getData('application/x-liantang')||'null');}catch(_){}
        if(d&&d.paths){
          for(const p of d.paths){
            if(p===path||p.indexOf(path+'/')===0)continue;
            try{await fs.rename(p,await fs.unique(path,P.base(p)));}catch(err){Toast.err('挪不動',err.message);}
          }
          render();Bus.emit('fs',path);
        }
      });
      parent.appendChild(n);
      if(open&&hasKids){
        try{
          const ks=(await fs.readdir(path)).filter(x=>x.kind==='dir').sort((a,b)=>natcmp(a.name,b.name));
          for(const k of ks)await treeNode(k.path,k.name,'folder',depth+1,parent,false);
        }catch(e){}
      }
    }
    /* ---------- 排序 ---------- */
    function sortEntries(list){
      const k=S.key,d=S.dir;
      return list.slice().sort((a,b)=>{
        if(a.kind!==b.kind)return a.kind==='dir'?-1:1;
        let r=0;
        if(k==='name')r=natcmp(a.name,b.name);
        else if(k==='mtime')r=(a.mtime||0)-(b.mtime||0)||natcmp(a.name,b.name);
        else if(k==='sz')r=(a.__size!=null?a.__size:a.size)-(b.__size!=null?b.__size:b.size)||natcmp(a.name,b.name);
        else if(k==='type')r=natcmp(P.ext(a.name)||'zzz',P.ext(b.name)||'zzz')||natcmp(a.name,b.name);
        return r*d;
      });
    }
    /* ---------- 渲染 ---------- */
    async function render(){
      const tk=++S.token;
      S.loading=true;
      scroll.innerHTML='<div class="busy"><div class="in"><div class="spin"></div><p>翻檢中…</p></div></div>';
      let list=[];
      try{
        list=await fs.readdir(S.cwd);
      }catch(e){
        if(tk!==S.token)return;
        scroll.innerHTML='<div class="empty">'+ICO.warn+'<p>此處無路</p><div style="font-size:11px;font-family:var(--f-mono);max-width:80%">'+esc(e.message||e)+'</div></div>';
        foot.innerHTML='<span>不可讀</span>';
        S.loading=false;return;
      }
      if(tk!==S.token)return;
      if(S.q&&!S.globalQ){
        const q=S.q.toLowerCase();
        list=list.filter(x=>x.name.toLowerCase().indexOf(q)>=0);
      }
      S.entries=list;
      S.loading=false;
      paint();
      duFolders();
      renderFoot();
    }
    function paint(){
      urls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});urls=[];
      scroll.innerHTML='';
      if(!S.entries.length){
        scroll.innerHTML='<div class="empty">'+(S.q?ICO.search:ICO.scroll)+'<p>'+(S.q?'尋無此魂':'匣中空空')+'</p>'+
          '<div style="font-size:11.5px;color:var(--bone-3);font-family:var(--f-body)">右鍵可新建棺匣、導入陽世檔案，或直接拖入</div></div>';
        return;
      }
      const sorted=sortEntries(S.entries);
      if(S.view==='detail')paintDetail(sorted);
      else if(S.view==='list')paintList(sorted);
      else if(S.view==='grid')paintGrid(sorted);
      else paintColumns(sorted);
      attachMQ();
    }
    function attachMQ(){
      if(mq)mq.destroy();
      mq=Marquee(scroll,{
        itemSel:'.fe-row,.fe-gi,.ci',
        onSelect:(nodes,add)=>{
          if(!add)S.sel.clear();
          nodes.forEach(n=>{if(n.dataset.path)S.sel.add(n.dataset.path);});
          paintSel();renderFoot();
        },
        onEnd:()=>{}
      });
    }
    function paintSel(){
      scroll.querySelectorAll('[data-path]').forEach(n=>{
        n.classList.toggle('sel',S.sel.has(n.dataset.path));
        n.classList.toggle('cut',Sys.clip&&Sys.clip.op==='cut'&&Sys.clip.paths.indexOf(n.dataset.path)>=0);
      });
      side.querySelectorAll('.tree-n').forEach(n=>n.classList.toggle('on',n.dataset.path===S.cwd));
    }
    function renderFoot(){
      const tot=S.entries.length;
      const dirs=S.entries.filter(x=>x.kind==='dir').length;
      let bytes=0;S.entries.forEach(x=>{if(x.kind==='file')bytes+=(x.size||0);});
      foot.innerHTML='<span>'+tot+' 項（'+dirs+' 匣 · '+(tot-dirs)+' 紙）</span>'+
        (S.sel.size?'<span style="color:var(--cin-hi)">選取 '+S.sel.size+' 項</span>':'')+
        '<span>檔合計 '+fmtSize(bytes)+'</span>'+
        '<span style="margin-left:auto">'+esc(S.cwd)+'</span>'+
        '<span class="tag '+(storeInfo(storeOf(S.cwd))||{tag:'opfs'}).tag+'">'+esc((storeInfo(storeOf(S.cwd))||{zh:'—'}).zh)+'</span>';
    }
    /* ---- 詳細資訊 ---- */
    function paintDetail(sorted){
      const total=S.cols.reduce((a,c)=>a+c.w,0);
      const head=el('div',{class:'fe-head'});
      head.style.width=Math.max(total,0)+'px';
      S.cols.forEach((c,i)=>{
        const h=el('div',{class:'hc'+(S.key===c.k?' act':'')});
        h.style.width=c.w+'px';
        h.dataset.i=i;h.draggable=true;
        h.innerHTML='<span>'+esc(c.zh)+'</span>'+(S.key===c.k?(S.dir>0?ICO.sortA:ICO.sortD):'')+'<span class="rzr"></span>';
        h.onclick=e=>{
          if(e.target.classList.contains('rzr'))return;
          if(S.key===c.k)S.dir*=-1;else{S.key=c.k;S.dir=(c.k==='name'||c.k==='type')?1:-1;}
          CFG.set('sortKey',S.key);CFG.set('sortDir',S.dir);
          paint();
        };
        /* 列寬拖曳（拖曳期間禁用 th 的原生 reorder，避免互斥） */
        const rz=h.querySelector('.rzr');
        rz.addEventListener('pointerdown',e=>{
          e.preventDefault();e.stopPropagation();
          h.draggable=false;
          document.documentElement.classList.add('resizing');
          const x0=e.clientX,w0=c.w;
          const mv=ev=>{c.w=clamp(w0+(ev.clientX-x0),64,900);h.style.width=c.w+'px';
            scroll.querySelectorAll('.fe-row').forEach(r=>{const cell=r.children[i];if(cell)cell.style.width=c.w+'px';});
            head.style.width=S.cols.reduce((a,cc)=>a+cc.w,0)+'px';};
          const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
            document.documentElement.classList.remove('resizing');h.draggable=true;CFG.set('feCols',S.cols);};
          document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
        });
        /* 列序拖曳 */
        h.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/x-col',String(i));e.dataTransfer.effectAllowed='move';});
        h.addEventListener('dragover',e=>{if(e.dataTransfer.types.indexOf('text/x-col')>=0){e.preventDefault();h.style.boxShadow='inset 2px 0 0 var(--cin)';}});
        h.addEventListener('dragleave',()=>h.style.boxShadow='');
        h.addEventListener('drop',e=>{
          h.style.boxShadow='';
          const from=+e.dataTransfer.getData('text/x-col');
          if(isNaN(from)||from===i)return;
          e.preventDefault();
          const moved=S.cols.splice(from,1)[0];
          S.cols.splice(i,0,moved);
          CFG.set('feCols',S.cols);
          paint();
        });
        head.appendChild(h);
      });
      head.appendChild(el('div',{class:'filler'}));
      const rows=el('div',{class:'fe-rows'});
      rows.style.width=total+'px';
      sorted.forEach((it,idx)=>rows.appendChild(mkRow(it,idx)));
      scroll.appendChild(head);scroll.appendChild(rows);
      paintSel();
    }
    function mkRow(it,idx){
      const r=el('div',{class:'fe-row mq-item'});
      r.dataset.path=it.path;r.dataset.kind=it.kind;r.dataset.name=it.name;
      r.style.animation='popIn .22s cubic-bezier(.16,1,.3,1) both';
      r.style.animationDelay=Math.min(idx*9,180)+'ms';
      S.cols.forEach(c=>{
        const cell=el('div',{class:'fc '+({name:'nm',mtime:'dt',sz:'sz',type:'tp'})[c.k]});
        cell.style.width=c.w+'px';
        if(c.k==='name'){
          cell.innerHTML=ICO[fileIco(it.name,it.kind==='dir')];
          const nm=el('span',{class:'nm-t',text:CFG.get('showExt',true)?it.name:it.name.replace(/\.[^.]+$/,'')});
          cell.appendChild(nm);
          if(it.kind==='file'&&CFG.get('thumbOn',true)&&isImg(it.name)){
            Thumb.get(it.path,64).then(u=>{
              if(u){urls.push(u);const im=el('img',{class:'thumb',src:u});cell.insertBefore(im,cell.firstChild.nextSibling);}
            });
          }
        }else if(c.k==='mtime'){cell.textContent=it.mtime?fmtDate(it.mtime):'—';}
        else if(c.k==='type'){cell.textContent=it.kind==='dir'?'棺匣':((KIND_ZH[kindOf(it.name)]||'異物')+(P.ext(it.name)?' .'+P.ext(it.name):''));}
        else if(c.k==='sz'){
          if(it.kind==='file')cell.textContent=fmtSize(it.size);
          else{cell.textContent='…';cell.dataset.du=it.path;}
        }
        r.appendChild(cell);
      });
      wireItem(r,it);
      return r;
    }
    function duFolders(){
      const cells=scroll.querySelectorAll('[data-du]');
      let i=0;
      const step=async()=>{
        if(i>=cells.length||ctx._closed)return;
        const c=cells[i++];
        const p=c.dataset.du;
        try{const b=await fs.du(p);if(c.isConnected)c.textContent=fmtSize(b);}catch(e){if(c.isConnected)c.textContent='—';}
        setTimeout(step,12);
      };
      step();
    }
    /* ---- 清單 ---- */
    function paintList(sorted){
      const box=el('div',{class:'fe-list'});
      box.style.minWidth='100%';
      sorted.forEach(it=>{
        const r=el('div',{class:'fe-row mq-item',style:'height:24px;display:inline-flex;width:210px;vertical-align:top'});
        r.dataset.path=it.path;r.dataset.kind=it.kind;r.dataset.name=it.name;
        r.innerHTML='<div class="fc nm" style="width:210px;padding:0 8px">'+ICO[fileIco(it.name,it.kind==='dir')]+
          '<span class="nm-t">'+esc(it.name)+'</span></div>';
        wireItem(r,it);
        box.appendChild(r);
      });
      scroll.appendChild(box);
      paintSel();
    }
    /* ---- 圖標 ---- */
    function paintGrid(sorted){
      const box=el('div',{class:'fe-grid'});
      box.style.setProperty('--gic',(CFG.get('iconSize',60)+40)+'px');
      sorted.forEach((it,idx)=>{
        const n=el('div',{class:'fe-gi mq-item'});
        n.dataset.path=it.path;n.dataset.kind=it.kind;n.dataset.name=it.name;
        n.style.animation='popIn .26s cubic-bezier(.16,1,.3,1) both';
        n.style.animationDelay=Math.min(idx*12,240)+'ms';
        const g=el('div',{class:'gi'});
        g.innerHTML=ICO[fileIco(it.name,it.kind==='dir')];
        n.appendChild(g);
        n.appendChild(el('b',{text:CFG.get('showExt',true)?it.name:it.name.replace(/\.[^.]+$/,'')}));
        if(CFG.get('thumbOn',true)&&it.kind==='file'&&isImg(it.name)){
          Thumb.get(it.path,160).then(u=>{if(u){urls.push(u);g.innerHTML='<img class="thumb" src="'+u+'" draggable="false">';}});
        }
        wireItem(n,it);
        box.appendChild(n);
      });
      scroll.appendChild(box);
      paintSel();
    }
    /* ---- 分欄 ---- */
    function paintColumns(sorted){
      const wrap=el('div',{class:'fe-cols'});
      const parts=S.cwd.split('/').filter(Boolean);
      const levels=[];
      let cur='';
      parts.forEach(p=>{cur+='/'+p;levels.push(cur);});
      levels.unshift('/');
      const build=async()=>{
        for(let i=0;i<levels.length;i++){
          const col=el('div',{class:'fe-col'});
          wrap.appendChild(col);
          const path=levels[i];
          let kids=[];
          try{kids=path==='/'?await fs.readdir('/'):sortEntries(await fs.readdir(path));}catch(e){}
          if(path==='/'){kids=STORES.filter(s=>fs.backends[s.key]||s.key==='local').map(s=>({name:s.key,path:'/'+s.key,kind:'dir',zh:s.zh}));}
          kids.forEach(k=>{
            const n=el('div',{class:'ci mq-item'+(levels[i+1]===k.path?' sel':'')});
            n.dataset.path=k.path;n.dataset.kind=k.kind;n.dataset.name=k.name;
            n.innerHTML=ICO[fileIco(k.name,k.kind==='dir')]+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(k.zh||k.name)+'</span>'+
              (k.kind==='dir'?'<span class="arw">'+ICO.chevR+'</span>':'');
            n.onclick=()=>{k.kind==='dir'?nav(k.path):openItem(k.path);};
            col.appendChild(n);
          });
          if(i===levels.length-1&&S.sel.size===1){
            const p=[...S.sel][0];
            const pv=el('div',{class:'prev'});
            pv.innerHTML='<b style="color:var(--bone);font-size:12px">'+esc(P.base(p))+'</b><br><span id="pvInfo">查探中…</span>';
            col.appendChild(pv);
            fs.stat(p).then(async st=>{
              const info=pv.querySelector('#pvInfo');
              if(!info)return;
              let extra='';
              if(st.kind==='dir'){const b=await fs.du(p);extra='實際容量 '+fmtSize(b);}
              else extra=fmtSize(st.size);
              info.innerHTML=(st.kind==='dir'?'棺匣':(KIND_ZH[kindOf(p)]||'異物'))+' · '+extra+'<br>'+fmtDateFull(st.mtime);
              if(st.kind==='file'&&isImg(p)){
                const u=await Thumb.get(p,320);
                if(u){urls.push(u);pv.insertBefore(el('img',{src:u}),pv.firstChild);}
              }
            }).catch(()=>{});
          }
        }
        scroll.appendChild(wrap);
      };
      build();
    }
    /* ---------- 項目互動 ---------- */
    function wireItem(n,it){
      let last=0;
      n.addEventListener('pointerdown',e=>{
        if(e.button===2)return;
        if(e.pointerType==='mouse'){
          n.setAttribute('draggable','true');
          if(it.kind==='file')DragCache.prep(it.path);
        }else n.removeAttribute('draggable');
        if(e.ctrlKey||e.metaKey){S.sel.has(it.path)?S.sel.delete(it.path):S.sel.add(it.path);paintSel();renderFoot();e.preventDefault();}
        else if(e.shiftKey&&S.entries.length){
          const paths=sortEntries(S.entries).map(x=>x.path);
          const a=paths.indexOf(S.lastSel||it.path),b=paths.indexOf(it.path);
          const [lo,hi]=a<b?[a,b]:[b,a];
          if(a>=0){S.sel.clear();for(let i=lo;i<=hi;i++)S.sel.add(paths[i]);}
          else S.sel.add(it.path);
          paintSel();renderFoot();e.preventDefault();
        }else{
          if(!S.sel.has(it.path)){S.sel.clear();S.sel.add(it.path);paintSel();renderFoot();}
          S.lastSel=it.path;
        }
        if(e.pointerType!=='mouse')touchItemDrag(e,n,it);
      });
      n.addEventListener('pointerup',()=>n.removeAttribute('draggable'));
      n.addEventListener('pointerenter',()=>{if(it.kind==='file')DragCache.prep(it.path);});
      n.addEventListener('click',e=>{
        e.stopPropagation();
        const now=Date.now();
        if(CFG.get('singleClick',true)){if(now-last<260)return;last=now;openItem(it.path);}
        else{if(now-last<420&&last){openItem(it.path);last=0;}else last=now;}
      });
      n.addEventListener('dblclick',e=>{e.stopPropagation();if(!CFG.get('singleClick',true))openItem(it.path);});
      n.addEventListener('contextmenu',e=>{
        e.preventDefault();e.stopPropagation();
        if(!S.sel.has(it.path)){S.sel.clear();S.sel.add(it.path);paintSel();renderFoot();}
        itemMenu(e.clientX,e.clientY,[...S.sel]);
      });
      /* 原生拖曳 */
      n.addEventListener('dragstart',e=>{
        const paths=[...S.sel];
        const main=paths.indexOf(it.path)>=0?paths:[it.path];
        const dt=e.dataTransfer;
        dt.effectAllowed='copyMove';
        try{
          dt.setData('text/plain',main.map(p=>P.base(p)).join('\n'));
          dt.setData('application/x-liantang',JSON.stringify({paths:main,from:S.cwd}));
        }catch(_){}
        if(main.length===1){
          const rec=DragCache.get(main[0]);
          if(rec&&rec.file){
            try{dt.items.add(rec.file);}catch(_){}
            try{if(rec.url)dt.setData('DownloadURL',rec.file.type+':'+rec.file.name+':'+rec.url);}catch(_){}
          }
        }else main.forEach(p=>{const rec=DragCache.get(p);if(rec&&rec.file){try{dt.items.add(rec.file);}catch(_){}}});
        n.style.opacity='.4';
        try{
          const g=$('#dragGhost');g.innerHTML='';
          const c=el('div',{class:'fe-gi',style:'background:var(--panel);border:1px solid var(--cin);padding:8px 12px;border-radius:4px'});
          c.innerHTML=(ICO[it.kind==='dir'?'folder':'file'])+'<b style="margin-left:8px">'+esc(main.length>1?main.length+' 項':it.name)+'</b>';
          c.style.display='flex';c.style.alignItems='center';
          g.appendChild(c);g.style.left='-999px';g.style.top='-999px';
          dt.setDragImage(g,20,16);
        }catch(_){}
        e.stopPropagation();
      });
      n.addEventListener('dragend',()=>{
        n.style.opacity='';
        $('#dragGhost').innerHTML='';
        [...S.sel].forEach(p=>DragCache.release(p));
      });
      if(it.kind==='dir'){
        n.addEventListener('dragover',e=>{
          const t=e.dataTransfer.types;
          if(Array.prototype.indexOf.call(t,'application/x-liantang')>=0||Array.prototype.indexOf.call(t,'Files')>=0){
            e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='move';n.classList.add('drop');
          }
        });
        n.addEventListener('dragleave',()=>n.classList.remove('drop'));
        n.addEventListener('drop',async e=>{
          n.classList.remove('drop');e.preventDefault();e.stopPropagation();
          if(Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0&&!e.dataTransfer.getData('application/x-liantang')){
            await Sys.importDataTransfer(e.dataTransfer,it.path);render();return;
          }
          let d=null;try{d=JSON.parse(e.dataTransfer.getData('application/x-liantang')||'null');}catch(_){}
          if(d&&d.paths){
            for(const p of d.paths){
              if(p===it.path||p.indexOf(it.path+'/')===0)continue;
              try{await fs.rename(p,await fs.unique(it.path,P.base(p)));}catch(err){Toast.err('挪不動',P.base(p)+'：'+(err.message||err));}
            }
            render();renderTree();Bus.emit('fs',S.cwd);
          }
        });
      }
    }
    function touchItemDrag(e,n,it){
      const t0=e.touches?e.touches[0]:e;
      const sx=t0.clientX,sy=t0.clientY;
      let started=false,ghost=null,over=null;
      const mv=ev=>{
        const t=ev.touches?ev.touches[0]:ev;
        if(!started){if(Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)<10)return;started=true;
          ghost=el('div',{style:'position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);opacity:.9'});
          const c=el('div',{class:'fe-gi',style:'background:var(--panel);border:1px solid var(--cin);padding:8px 12px;display:flex;align-items:center;gap:8px;border-radius:4px'});
          c.innerHTML=(ICO[it.kind==='dir'?'folder':'file'])+'<b>'+esc(S.sel.size>1?S.sel.size+' 項':it.name)+'</b>';
          ghost.appendChild(c);document.body.appendChild(ghost);n.style.opacity='.4';
        }
        ev.preventDefault();
        ghost.style.left=t.clientX+'px';ghost.style.top=t.clientY+'px';
        const e2=document.elementFromPoint(t.clientX,t.clientY);
        if(over&&over!==e2&&over.classList)over.classList.remove('drop');
        over=e2?e2.closest('.fe-row[data-kind="dir"],.fe-gi[data-kind="dir"],.tree-n,.dicon[data-kind="dir"]'):null;
        if(over&&over!==n)over.classList.add('drop');
      };
      const up=async ev=>{
        document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);document.removeEventListener('touchcancel',up);
        if(!started)return;
        n.style.opacity='';if(ghost)ghost.remove();
        if(over)over.classList.remove('drop');
        const target=over;
        if(target&&target!==n){
          const dest=target.dataset.path;
          if(dest){
            for(const p of [...S.sel]){
              if(p===dest||p.indexOf(dest+'/')===0)continue;
              try{await fs.rename(p,await fs.unique(dest,P.base(p)));}catch(err){Toast.err('挪不動',err.message);}
            }
            render();renderTree();Bus.emit('fs',S.cwd);
          }
        }
      };
      document.addEventListener('touchmove',mv,{passive:false});
      document.addEventListener('touchend',up);
      document.addEventListener('touchcancel',up);
    }
    function openItem(path){Sys.open(path);}
    /* ---------- 選單 ---------- */
    function itemMenu(x,y,paths){
      const one=paths.length===1;
      const it=one?S.entries.find(i=>i.path===paths[0]):null;
      const m=[];
      m.push({label:'開啟',ico:'openBox',act:()=>openItem(paths[0])});
      if(one&&it&&it.kind==='file'){
        m.push({label:'開啟方式',ico:'box',sub:Sys.openCandidates(paths[0]).map(c=>({label:c.name,ico:c.icon,act:()=>Sys.openWith(paths[0],c.id)}))});
        if(P.ext(paths[0])==='html'||P.ext(paths[0])==='htm'){

        {label:'新建疏文（.txt）',ico:'ftext',act:()=>Sys.newItem(S.cwd,'file','未名疏文.txt',()=>{render();renderTree();})},

    function startRename(path){
      const n=scroll.querySelector('[data-path="'+CSS.escape(path)+'"]');
      if(!n)return;
      const nameEl=n.querySelector('.nm-t')||n.querySelector('b')||n.querySelector('.fc.nm');
      if(!nameEl)return;
      const old=P.base(path);
      const inp=el('input',{class:'ren',value:old});
      const w=nameEl.offsetWidth||140;
      inp.style.width=w+'px';
      nameEl.style.display='none';
      nameEl.parentNode.appendChild(inp);
      inp.focus();
      const dot=old.lastIndexOf('.');
      inp.setSelectionRange(0,dot>0?dot:old.length);
      let done=false;
      const fin=async ok=>{
        if(done)return;done=true;
        const nn=inp.value.trim();
        inp.remove();nameEl.style.display='';
        if(!ok||!nn||nn===old)return;
        try{
          await fs.rename(path,P.dir(path)+'/'+nn);
          S.sel.delete(path);S.sel.add(P.dir(path)+'/'+nn);
          render();renderTree();Bus.emit('fs',P.dir(path));
        }catch(e){Toast.err('改不了名',e.message||String(e));}
      };
      inp.addEventListener('keydown',e=>{
        e.stopPropagation();
        if(e.key==='Enter')fin(true);
        if(e.key==='Escape')fin(false);
      });
      inp.addEventListener('blur',()=>fin(true));
      inp.addEventListener('click',e=>e.stopPropagation());
      inp.addEventListener('pointerdown',e=>e.stopPropagation());
    }
    function setView(v){
      S.view=v;CFG.set('explorerView',v);
      $$('[data-v]',root).forEach(b=>b.classList.toggle('on',b.dataset.v===v));
      paint();
    }
    /* ---------- 工具列 ---------- */
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');
      if(!b)return;
      const a=b.dataset.a;
      if(a==='side'){side.classList.toggle('hide');CFG.set('showSidebar',!side.classList.contains('hide'));}
      else if(a==='back'){if(S.hi>0){S.hi--;nav(S.hist[S.hi],false);}}
      else if(a==='fwd'){if(S.hi<S.hist.length-1){S.hi++;nav(S.hist[S.hi],false);}}
      else if(a==='up'){const d=P.dir(S.cwd);if(d!==S.cwd)nav(d);}
      else if(a==='refresh'){render();renderTree();}
      else if(a==='new'){
        const r=b.getBoundingClientRect();
        Menu.show(r.left,r.bottom+4,[
          {label:'棺匣（資料夾）',ico:'folder',act:()=>Sys.newItem(S.cwd,'dir',()=>{render();renderTree();})},
          {label:'疏文（.txt）',ico:'ftext',act:()=>Sys.newItem(S.cwd,'file','未名疏文.txt',()=>render())},
          {label:'符籙（.html）',ico:'fcode',act:()=>Sys.newItem(S.cwd,'file','新符.html',()=>render(),Sys.HTML_SEED)},
          {label:'帳冊（.csv）',ico:'table',act:()=>Sys.newItem(S.cwd,'file','新帳.csv',()=>render(),Sys.CSV_SEED)},
          {label:'墨稿（.md）',ico:'ftext',act:()=>Sys.newItem(S.cwd,'file','新稿.md',()=>render(),Sys.MD_SEED)},
          {label:'符紙（.json）',ico:'fcode',act:()=>Sys.newItem(S.cwd,'file','新符.json',()=>render(),'{}\n')}
        ]);
      }
      else if(a==='import')Sys.pickFiles(S.cwd);
      else if(a==='mount')Sys.mountLocal();
      else if(a==='paste')Sys.paste(S.cwd).then(()=>{render();renderTree();});
      else if(a==='selall'){S.entries.forEach(x=>S.sel.add(x.path));paintSel();renderFoot();}
    });
    $$('[data-v]',root).forEach(b=>b.onclick=()=>setView(b.dataset.v));
    /* 搜尋 */
    let sTimer=null;
    searchInp.addEventListener('input',()=>{
      clearTimeout(sTimer);
      const q=searchInp.value.trim();
      sTimer=setTimeout(()=>{
        S.q=q;S.globalQ=false;
        if(q){
          const list=S.entries.filter(x=>x.name.toLowerCase().indexOf(q.toLowerCase())>=0);
          scroll.innerHTML='';
          const sorted=sortEntries(list);
          if(S.view==='detail')paintDetail(sorted);else if(S.view==='grid')paintGrid(sorted);else if(S.view==='list')paintList(sorted);else paintDetail(sorted);
          foot.innerHTML='<span>此匣中符合「'+esc(q)+'」者 '+sorted.length+' 項</span>';
        }else render();
      },190);
    });
    searchInp.addEventListener('keydown',async e=>{
      e.stopPropagation();
      if(e.key==='Enter'){
        const q=searchInp.value.trim();
        if(!q)return;
        scroll.innerHTML='<div class="busy"><div class="in"><div class="spin"></div><p>遍搜三庫…</p></div></div>';
        const res=await fs.search(q,{limit:300,content:true});
        S.entries=res;S.q=q;S.globalQ=true;
        scroll.innerHTML='';
        const sorted=sortEntries(res);
        if(S.view==='grid')paintGrid(sorted);else paintDetail(sorted);
        foot.innerHTML='<span>全庫搜「'+esc(q)+'」· 得 '+res.length+' 項 · 共掃 '+res.scanned+' 魂</span>';
      }
      if(e.key==='Escape'){searchInp.value='';S.q='';render();}
    });
    /* 空白處右鍵 / 拖入 */
    scroll.addEventListener('contextmenu',e=>{
      if(e.target.closest('.fe-row,.fe-gi,.ci'))return;
      e.preventDefault();
      emptyMenu(e.clientX,e.clientY);
    });
    scroll.addEventListener('pointerdown',e=>{
      if(e.target.closest('.fe-row,.fe-gi,.ci'))return;
      if(e.button===0&&!e.ctrlKey&&!e.metaKey){S.sel.clear();paintSel();renderFoot();}
    });
    scroll.addEventListener('dragover',e=>{
      const t=e.dataTransfer.types;
      if(Array.prototype.indexOf.call(t,'Files')>=0||Array.prototype.indexOf.call(t,'application/x-liantang')>=0){
        e.preventDefault();e.dataTransfer.dropEffect=Array.prototype.indexOf.call(t,'Files')>=0?'copy':'move';
      }
    });
    scroll.addEventListener('drop',async e=>{
      e.preventDefault();
      if(Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0&&!e.dataTransfer.getData('application/x-liantang')){
        await Sys.importDataTransfer(e.dataTransfer,S.cwd);render();renderTree();return;
      }
      let d=null;try{d=JSON.parse(e.dataTransfer.getData('application/x-liantang')||'null');}catch(_){}
      if(d&&d.paths&&d.from!==S.cwd){
        for(const p of d.paths){
          try{await fs.rename(p,await fs.unique(S.cwd,P.base(p)));}catch(err){Toast.err('挪不動',P.base(p)+'：'+(err.message||err));}
        }
        render();renderTree();Bus.emit('fs',S.cwd);
      }
    });
    /* 鍵盤 */
    const onKey=e=>{
      if(ctx._closed)return;
      const typing=(e.target.tagName||'').toLowerCase()==='input'||(e.target.tagName||'').toLowerCase()==='textarea';
      const mod=e.ctrlKey||e.metaKey;
      if(typing)return;
      if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();S.entries.forEach(x=>S.sel.add(x.path));paintSel();renderFoot();}
      else if(mod&&e.key.toLowerCase()==='c'&&S.sel.size){Sys.clip={paths:[...S.sel],op:'copy'};paintSel();Toast.ok('已記下',S.sel.size+' 項');}
      else if(mod&&e.key.toLowerCase()==='x'&&S.sel.size){Sys.clip={paths:[...S.sel],op:'cut'};paintSel();Toast.ok('已記下',S.sel.size+' 項');}
      else if(mod&&e.key.toLowerCase()==='v'&&Sys.clip){e.preventDefault();Sys.paste(S.cwd).then(()=>{render();renderTree();});}
      else if(mod&&e.key.toLowerCase()==='l'){e.preventDefault();searchInp.focus();searchInp.select();}
      else if(e.key==='F2'&&S.sel.size===1){e.preventDefault();startRename([...S.sel][0]);}
      else if(e.key==='F5'){e.preventDefault();render();renderTree();}
      else if(e.key==='Delete'&&S.sel.size){Sys.removePaths([...S.sel],()=>{render();renderTree();});}
      else if(e.key==='Enter'&&S.sel.size===1){openItem([...S.sel][0]);}
      else if(e.key==='Backspace'){const d=P.dir(S.cwd);if(d!==S.cwd)nav(d);}
      else if(e.key.indexOf('Arrow')===0&&S.entries.length){
        e.preventDefault();
        const paths=sortEntries(S.entries).map(x=>x.path);
        let i=paths.indexOf([...S.sel][0]);
        if(e.key==='ArrowDown')i=Math.min(paths.length-1,i+1);
        else if(e.key==='ArrowUp')i=Math.max(0,i<0?0:i-1);
        else if(e.key==='ArrowRight')i=Math.min(paths.length-1,i+1);
        else if(e.key==='ArrowLeft')i=Math.max(0,i-1);
        if(i<0)i=0;
        S.sel.clear();S.sel.add(paths[i]);paintSel();renderFoot();
        const n=scroll.querySelector('[data-path="'+CSS.escape(paths[i])+'"]');
        if(n&&n.scrollIntoView)n.scrollIntoView({block:'nearest'});
      }
    };
    root.addEventListener('keydown',onKey);
    root.tabIndex=0;
    /* 外部變更 */
    const off=Bus.on('fs',p=>{
      if(p===S.cwd||S.cwd.indexOf(p+'/')===0||p.indexOf(S.cwd+'/')===0){if(!S.loading&&!mqBusy())render();}
    });
    function mqBusy(){return false;}
    /* 匯入 */
    nav(S.cwd);
    if(args.search)setTimeout(()=>{searchInp.value=args.search;searchInp.dispatchEvent(new Event('keydown',{key:'Enter'}));},320);
    ctx.setStatus('<span class="st">'+ICO.folder+'</span><span class="st">'+esc(S.cwd)+'</span>');
    return {
      destroy(){ctx._closed=true;if(mq)mq.destroy();off&&off();urls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});urls=[];root.removeEventListener('keydown',onKey);},
      reuse(a){if(a&&a.path)nav(a.path);else{WM.focus(ctx.id);render();}},
      search(q){searchInp.value=q;searchInp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));},
      nav
    };
  }
};

/* ---------- CDN 懶加載 ---------- */
const Lazy={
  _p:{},
  css(href){
    const k='css:'+href;
    if(this._p[k])return this._p[k];
    this._p[k]=new Promise((res,rej)=>{
      const l=el('link',{rel:'stylesheet',href});
      l.onload=()=>res(true);l.onerror=()=>{l.remove();rej(new Error('CSS 載入失敗：'+href));};
      document.head.appendChild(l);
      setTimeout(()=>rej(new Error('CSS 逾時')),12000);
    }).catch(e=>{console.warn(e);return false;});
    return this._p[k];
  },
  js(src){
    const k='js:'+src;
    if(this._p[k])return this._p[k];
    this._p[k]=new Promise((res,rej)=>{
      const s=el('script',{src});
      s.onload=()=>res(true);s.onerror=()=>{s.remove();rej(new Error('載入失敗：'+src));};
      document.head.appendChild(s);
      setTimeout(()=>{if(!window.__ok)rej(new Error('逾時'));},15000);
    }).catch(e=>{console.warn(e);this._p[k]=null;throw e;});
    return this._p[k];
  },
  async codemirror(){
    if(window.CodeMirror)return window.CodeMirror;
    const B='https://cdn.jsdelivr.net/npm/codemirror@5.65.16';
    await Promise.all([
      this.css(B+'/lib/codemirror.min.css'),
      this.css(B+'/theme/material-darker.min.css'),
      this.css(B+'/addon/dialog/dialog.min.css'),
      this.css(B+'/addon/search/matchesonscrollbar.min.css')
    ]);
    await this.js(B+'/lib/codemirror.min.js');
    const mods=['xml','javascript','css','htmlmixed','markdown','meta'];
    const adds=['edit/matchbrackets','edit/closebrackets','selection/active-line','search/searchcursor','search/search','search/jump-to-line','dialog/dialog','comment/comment','fold/foldcode','fold/foldgutter','fold/brace-fold','fold/xml-fold'];
    await Promise.all(mods.map(m=>this.js(B+'/mode/'+m+'/'+m+'.min.js').catch(()=>{})));
    await Promise.all(adds.map(a=>this.js(B+'/addon/'+a+'.min.js').catch(()=>{})));
    if(!window.CodeMirror)throw new Error('CodeMirror 無法載入');
    return window.CodeMirror;
  },
  async jszip(){
    if(window.JSZip)return window.JSZip;
    await this.js('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
    if(!window.JSZip)throw new Error('JSZip 無法載入');
    return window.JSZip;
  },
  async sevenzip(){
    if(this._7z)return this._7z;
    const m=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    this._7z=m.default||m;
    return this._7z;
  },
  async v86(){
    if(window.V86)return window.V86;
    await this.js('https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js');
    if(!window.V86)throw new Error('libv86 無法載入');
    return window.V86;
  }
};

/* ---------- 簡易 Markdown 渲染 ---------- */
function mdToHtml(src){
  let s=esc(src);
  s=s.replace(/^```([\s\S]*?)```/gm,(m,c)=>'<pre style="background:#12100f;border:1px solid #3b2c26;padding:12px;overflow:auto;border-radius:4px"><code>'+c.replace(/^\w+\n/,'')+'</code></pre>');
  s=s.replace(/^######\s+(.*)$/gm,'<h6>$1</h6>').replace(/^#####\s+(.*)$/gm,'<h5>$1</h5>')
     .replace(/^####\s+(.*)$/gm,'<h4>$1</h4>').replace(/^###\s+(.*)$/gm,'<h3>$1</h3>')
     .replace(/^##\s+(.*)$/gm,'<h2>$1</h2>').replace(/^#\s+(.*)$/gm,'<h1>$1</h1>');
  s=s.replace(/^\s*&gt;\s?(.*)$/gm,'<blockquote style="border-left:3px solid #c22b1e;margin:8px 0;padding:4px 14px;opacity:.85">$1</blockquote>');
  s=s.replace(/^\s*[-*+]\s+(.*)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul style="padding-left:22px">$1</ul>');
  s=s.replace(/^\s*(\d+)\.\s+(.*)$/gm,'<li>$2</li>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')
     .replace(/`([^`]+)`/g,'<code style="background:#12100f;padding:1px 5px;border-radius:3px;color:#5f8f76">$1</code>')
     .replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/^\s*---\s*$/gm,'<hr style="border:0;border-top:1px solid #3b2c26;margin:18px 0">');
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">');
  s=s.split(/\n{2,}/).map(b=>/^<(h\d|ul|ol|pre|blockquote|hr|table|div)/.test(b.trim())?b:'<p style="margin:0 0 12px;line-height:1.9">'+b.replace(/\n/g,'<br>')+'</p>').join('\n');
  return s;
}

    root.querySelector('[data-fs]').textContent=S.fontSize+'px';
    root.querySelector('[data-a="wrap"]').classList.add('on');

    function markDirty(){
      S.dirty=true;
      const b=P.base(S.path||'未名疏文.txt');
      ctx.setTitle(b+(S.dirty?' ●':''),S.path?'SCRIPTORIUM':'');
      clearTimeout(S.timer);
      if(S.path)S.timer=setTimeout(save,true?700:0);
      else setStatus('未存 · 尚無歸處');
    }
    function setStatus(t){ctx.setStatus('<span class="st">'+esc(t)+'</span><span class="st" style="margin-left:auto">'+(S.path?esc(S.path):'未歸檔')+'</span>');}
    ta.addEventListener('input',()=>{S.text=ta.value;markDirty();if(S.view==='table')renderTable();});
    ta.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save(true);}
      if(e.key==='Tab'&&!e.shiftKey){
        e.preventDefault();
        const s=ta.selectionStart,en=ta.selectionEnd;
        ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);
        ta.selectionStart=ta.selectionEnd=s+2;markDirty();
      }
      e.stopPropagation();
    });
    async function save(manual){
      if(!S.path){return saveAs();}
      try{
        await fs.writeFile(S.path,ta.value);
        S.dirty=false;
        ctx.setTitle(P.base(S.path),'SCRIPTORIUM');
        setStatus('已存於 '+fmtTime(new Date())+' · '+fmtSize(ta.value.length));
        Bus.emit('fs',P.dir(S.path));
        if(manual)Toast.ok('已存',P.base(S.path));
      }catch(e){Toast.err('存不下',e.message||String(e));setStatus('存不下：'+(e.message||e));}
    }
    async function saveAs(){
      const dir=Desktop.path();
      let name=await Dlg.prompt('另存疏文','存於 '+dir,'未名疏文.txt');
      if(!name)return;
      const p=await fs.unique(dir,name);
      await fs.writeFile(p,ta.value);
      S.path=p;S.dirty=false;
      ctx.setTitle(P.base(p),'SCRIPTORIUM');
      setStatus('已存於 '+p);
      Toast.ok('已另存',p);
      Bus.emit('fs',dir);Desktop.refresh();
    }
    async function load(path){
      try{
        const t=await fs.readFile(path,'text');
        S.path=path;S.text=t;ta.value=t;S.dirty=false;
        ctx.setTitle(P.base(path),'SCRIPTORIUM');
        ctx.setIcon(kindOf(path)==='table'?'table':'aNote');
        const isTab=kindOf(path)==='table';
        views.classList.toggle('hidden',!isTab);
        if(isTab){S.sep=P.ext(path)==='tsv'?'\t':detectSep(t);}
        setStatus(fmtSize(t.length)+' · '+t.split('\n').length+' 行 · '+esc(path));
        if(isTab&&S.view==='table')renderTable();
      }catch(e){Toast.err('讀不出',e.message||String(e));}
    }
    function detectSep(t){
      const l=(t.split('\n')[0]||'');
      if(l.indexOf('\t')>=0)return '\t';
      if((l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length)return ';';
      return ',';
    }
    function renderTable(){
      const t=ta.value;
      const rows=parseDelim(t,S.sep);
      if(!rows.length){tv.innerHTML='<div class="empty">'+ICO.table+'<p>表中無字</p></div>';return;}
      const head=rows[0],body=rows.slice(1);
      let h='<table><thead><tr><th style="width:38px;color:var(--bone-3)">#</th>';
      head.forEach(c=>h+='<th>'+esc(c)+'</th>');
      h+='</tr></thead><tbody>';
      body.forEach((r,i)=>{
        h+='<tr><td style="color:var(--bone-3);font-family:var(--f-mono);font-size:10px">'+(i+1)+'</td>';
        head.forEach((c,j)=>{
          const v=r[j]==null?'':r[j];
          const num=v!==''&&!isNaN(Number(v));
          h+='<td class="'+(num?'r':'')+'">'+esc(v)+'</td>';
        });
        h+='</tr>';
      });
      h+='</tbody></table>';
      tv.innerHTML=h;
      tv.style.display=S.view==='table'?'block':'none';
    }
    function parseDelim(text,sep){
      const rows=[];let row=[],cur='',q=false;
      for(let i=0;i<text.length;i++){
        const c=text[i];
        if(q){
          if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
          else cur+=c;
        }else if(c==='"')q=true;
        else if(c===sep){row.push(cur);cur='';}
        else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
        else if(c==='\r'){}
        else cur+=c;
      }
      if(cur!==''||row.length){row.push(cur);rows.push(row);}
      return rows.filter(r=>r.length>1||(r[0]||'').trim()!=='');
    }
    function setView(v){
      S.view=v;
      $$('[data-v]',views).forEach(b=>b.classList.toggle('on',b.dataset.v===v));
      const isTab=v==='table';
      tv.classList.toggle('hidden',!isTab);
      root.querySelector('.pane').style.display=isTab?'none':'flex';
      if(isTab)renderTable();
    }
    $$('[data-v]',views).forEach(b=>b.onclick=()=>setView(b.dataset.v));
    root.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='open'){
        const p=await Dlg.prompt('開啟疏文','輸入路徑，或留空以瀏覽',S.path||Desktop.path()+'/');
        if(!p)return;
        if(p.slice(-1)==='/'){WM.open('explorer',{path:p});return;}
        load(p);
      }
      else if(a==='save')save(true);
      else if(a==='saveas')saveAs();
      else if(a==='undo'){ta.focus();document.execCommand('undo');S.text=ta.value;markDirty();}
      else if(a==='redo'){ta.focus();document.execCommand('redo');S.text=ta.value;markDirty();}
      else if(a==='f+'){S.fontSize=Math.min(30,S.fontSize+1);ta.style.fontSize=S.fontSize+'px';root.querySelector('[data-fs]').textContent=S.fontSize+'px';}
      else if(a==='f-'){S.fontSize=Math.max(9,S.fontSize-1);ta.style.fontSize=S.fontSize+'px';root.querySelector('[data-fs]').textContent=S.fontSize+'px';}
      else if(a==='wrap'){S.wrap=!S.wrap;ta.classList.toggle('wrapoff',!S.wrap);b.classList.toggle('on',S.wrap);}
      else if(a==='export'){
        const name=await Dlg.prompt('導出疏文','檔名',P.base(S.path||'疏文.txt'));
        if(name)Sys.saveBlob(new Blob([ta.value],{type:'text/plain;charset=utf-8'}),name);
      }
    });
    if(args.path)load(args.path);
    else{ctx.setTitle('未名疏文','SCRIPTORIUM');setStatus('未歸檔 · Ctrl+S 另存');ta.value=Sys.MD_SEED.replace('# 疏文','# 未名疏文');S.text=ta.value;}
    return {destroy(){clearTimeout(S.timer);},beforeClose(){
      if(!S.dirty)return true;
      Dlg.confirm('疏文未乾','「'+P.base(S.path||'未名疏文')+'」尚有未存之字，確定闔上？','棄之不存').then(ok=>{if(ok)ctx.close();});
      return false;
    },reuse(a){if(a&&a.path)load(a.path);},load,save};
  }
};

const CM_MODES={
  html:{mode:'htmlmixed',label:'HTML',ext:'html',name:'text/html'},
  htm:{mode:'htmlmixed',label:'HTML',ext:'html',name:'text/html'},
  css:{mode:'css',label:'CSS',ext:'css',name:'text/css'},
  js:{mode:'javascript',label:'JavaScript',ext:'js',name:'text/javascript'},
  mjs:{mode:'javascript',label:'JavaScript',ext:'js',name:'text/javascript'},
  json:{mode:{name:'javascript',json:true},label:'JSON',ext:'json',name:'application/json'},
  md:{mode:'markdown',label:'Markdown',ext:'md',name:'text/markdown'},
  markdown:{mode:'markdown',label:'Markdown',ext:'md',name:'text/markdown'},
  xml:{mode:'xml',label:'XML',ext:'xml',name:'application/xml'},
  svg:{mode:'xml',label:'SVG',ext:'svg',name:'image/svg+xml'},
  txt:{mode:'markdown',label:'純文本',ext:'txt',name:'text/plain'}
};
function cmModeFor(name){
  const e=P.ext(name)||'html';
  if(CM_MODES[e])return CM_MODES[e];
  if(isTextKind(name))return {mode:'markdown',label:'純文本',ext:e,name:'text/plain'};
  return {mode:'htmlmixed',label:'HTML',ext:'html',name:'text/html'};
}

    /* ---- 存檔 ---- */
    async function save(manual){
      let p=S.path;
      if(!p){
        const name=await Dlg.prompt('存符','命名（副檔名依語言自動）','新符.'+S.lang.ext);
        if(!name)return;
        p=await fs.unique(S.dir,name);
      }
      try{
        await fs.writeFile(p,val());
        S.path=p;S.dir=P.dir(p);S.dirty=false;
        ctx.setTitle(P.base(p),S.lang.label);
        updateStatus();
        Bus.emit('fs',S.dir);
        Desktop.refresh();
        if(manual)Toast.ok('符已存',p);
      }catch(e){Toast.err('存不下',e.message||String(e));}
    }
    async function saveAs(){
      const name=await Dlg.prompt('另存符','存於 '+S.dir,(P.base(S.path)||'新符')+'.'+S.lang.ext);
      if(!name)return;
      const p=await fs.unique(S.dir,name);
      await fs.writeFile(p,val());
      S.path=p;S.dir=P.dir(p);S.dirty=false;
      setLang(cmModeFor(name).mode,P.ext(name));
      ctx.setTitle(P.base(p),S.lang.label);
      Toast.ok('已另存',p);Bus.emit('fs',S.dir);Desktop.refresh();
    }
    async function load(path){
      try{
        const t=await fs.readFile(path,'text');
        setVal(t);
        S.path=path;S.dir=P.dir(path);S.dirty=false;
        const m=cmModeFor(path);
        setLang(m.mode,P.ext(path));
        ctx.setTitle(P.base(path),m.label);
        updateStatus();refreshPreview();
        if(S.cm){S.cm.clearHistory();S.cm.setCursor(0,0);}
      }catch(e){Toast.err('讀不出',e.message||String(e));}
    }
    function setLang(mode,extKey){
      S.lang=CM_MODES[extKey]||{mode,label:'純文本',ext:'txt'};
      if(S.cm)S.cm.setOption('mode',mode);
      const keys=['html','css','js','json','md','xml','svg','txt'];
      if(keys.indexOf(extKey)>=0)langSel.value=extKey;
      else if(extKey==='htm')langSel.value='html';
      else if(extKey==='markdown')langSel.value='md';
      updateStatus();schedulePreview();
    }
    /* ---- 格式化（保持光标位置） ---- */
    function format(){
      const src=val();
      if(!S.cm){setVal(fmtText(src));return;}
      const cur=S.cm.getCursor();
      const before=S.cm.getRange({line:0,ch:0},cur).length;
      let out;
      try{out=fmtText(src);}catch(e){Toast.err('排不成',e.message||String(e));return;}
      S.cm.setValue(out);
      /* 依字符索引還原光标 */
      let idx=Math.min(before,out.length),line=0,ch=0,n=0;
      const lines=out.split('\n');
      for(let i=0;i<lines.length;i++){
        if(n+lines[i].length>=idx){line=i;ch=idx-n;break;}
        n+=lines[i].length+1;
      }
      S.cm.setCursor({line,ch});
      S.cm.refresh();S.cm.clearHistory();
      schedulePreview();
      Toast.ok('已排符','格式化完成，光标原位');
    }
    function fmtText(src){
      const L=S.lang.label;
      if(L==='JSON'){try{return JSON.stringify(JSON.parse(src),null,2);}catch(e){throw new Error('JSON 不成句：'+e.message);}}
      if(L==='CSS')return fmtCSS(src);
      if(L==='HTML'||L==='XML'||L==='SVG')return fmtHTML(src);
      if(L==='JavaScript')return fmtJS(src);
      return src;
    }
    function fmtCSS(s){
      return s.replace(/\s*{\s*/g,' {\n  ').replace(/\s*}\s*/g,'\n}\n').replace(/;\s*/g,';\n  ')
        .replace(/\/\*/g,'\n/*').replace(/\*\//g,'*/\n').replace(/\n\s*\n\s*\n+/g,'\n\n')
        .replace(/^\s+$/gm,'').split('\n').map(l=>l.replace(/\s+$/,'')).join('\n').trim()+'\n';
    }
    function fmtHTML(s){
      const VOID={area:1,base:1,br:1,col:1,embed:1,hr:1,img:1,input:1,link:1,meta:1,param:1,source:1,track:1,wbr:1};
      const RAW={pre:1,textarea:1,script:1,style:1};
      let out='',ind=0,inRaw=null;
      const lines=s.replace(/>\s*</g,'>\n<').split('\n');
      lines.forEach(raw=>{
        const line=raw.trim();
        if(!line)return;
        if(inRaw){
          out+='  '.repeat(ind+1)+line+'\n';
          if(line.indexOf('</'+inRaw)>=0)inRaw=null;
          return;
        }
        const m=line.match(/^<\/?([a-zA-Z][\w:-]*)/);
        if(m){
          const tag=m[1].toLowerCase();
          const closing=line.charAt(1)==='/';
          const selfClose=/\/>$/.test(line)||VOID[tag];
          if(closing)ind=Math.max(0,ind-1);
          out+='  '.repeat(ind)+line+'\n';
          if(!closing&&!selfClose){
            if(RAW[tag])inRaw=tag;else ind++;
          }
        }else out+='  '.repeat(ind)+line+'\n';
      });
      return out.replace(/\n{3,}/g,'\n\n').trim();
    }
    function fmtJS(s){
      let out='',ind=0,str=null,prev='';
      for(let i=0;i<s.length;i++){
        const c=s[i];
        if(str){out+=c;if(c===str&&prev!=='\\')str=null;prev=c;continue;}
        if(c==='"'||c==="'"||c==='`'){str=c;out+=c;prev=c;continue;}
        if(c==='\n'){continue;}
        if(c==='{'){out+=' {\n'+'  '.repeat(++ind);prev=c;continue;}
        if(c==='}'){out='\n'+'  '.repeat(--ind)+out.slice(out.replace(/\s+$/,'').length);out+='}';prev=c;continue;}
        if(c===';'){out+=';\n'+'  '.repeat(ind);prev=c;continue;}
        if(/\s/.test(c)){if(out&&!/\n\s*$/.test(out)&&prev!=='(')out+=' ';prev=c;continue;}
        out+=c;prev=c;
      }
      return out.split('\n').map(l=>l.replace(/\s+$/,'')).filter((l,i,a)=>!(l===''&&a[i-1]==='')).join('\n').trim()+'\n';
    }
    /* ---- 查找替換 ---- */
    let curMatch=null;
    function openFind(replace){
      findBar.classList.add('on');
      setTimeout(()=>{
        const q=findBar.querySelector('[data-f="q"]');
        q.focus();
        if(S.cm){const s=S.cm.getSelection();if(s&&s.length<80)q.value=s;}
        countMatches();
      },40);
      if(replace)findBar.querySelector('[data-f="r"]').focus();
    }
    function countMatches(){
      const q=findBar.querySelector('[data-f="q"]').value;
      const cnt=findBar.querySelector('[data-f="cnt"]');
      if(!q||!S.cm){cnt.textContent='';return;}
      const cs=findBar.querySelector('[data-f="case"]').checked;
      let n=0;const cur=S.cm.getCursor();
      const c=S.cm.getSearchCursor(q,{line:0,ch:0},cs?false:null);
      while(c.findNext())n++;
      cnt.textContent=n?n+' 處':'無';
      S.cm.setCursor(cur);
    }
    function findNext(back){
      if(!S.cm)return;
      const q=findBar.querySelector('[data-f="q"]').value;
      if(!q)return;
      const cs=findBar.querySelector('[data-f="case"]').checked;
      const cur=S.cm.getSearchCursor(q,S.cm.getCursor(back?'from':'to'),cs?false:null);
      const found=back?cur.findPrevious():cur.findNext();
      if(found){S.cm.setSelection(cur.from(),cur.to());S.cm.scrollIntoView(null,80);curMatch=cur;}
      else{
        const c2=S.cm.getSearchCursor(q,back?{line:S.cm.lastLine()}:null,cs?false:null);
        if(back?c2.findPrevious():c2.findNext()){S.cm.setSelection(c2.from(),c2.to());S.cm.scrollIntoView(null,80);curMatch=c2;}
        else Toast.info('尋無','「'+q+'」不在符中');
      }
    }
    function replace(all){
      if(!S.cm||!curMatch)return;
      const r=findBar.querySelector('[data-f="r"]').value;
      if(all){
        const q=findBar.querySelector('[data-f="q"]').value;
        const cs=findBar.querySelector('[data-f="case"]').checked;
        const c=S.cm.getSearchCursor(q,{line:0,ch:0},cs?false:null);
        let n=0;
        while(c.findNext()){c.replace(r);n++;}
        Toast.ok('已替換',n+' 處');countMatches();
      }else{
        curMatch.replace(r);curMatch=null;findNext(false);countMatches();
      }
    }
    findBar.addEventListener('input',e=>{if(e.target.dataset.f==='q')countMatches();});
    findBar.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Enter'){e.preventDefault();findNext(e.shiftKey);}
      if(e.key==='Escape'){findBar.classList.remove('on');if(S.cm)S.cm.focus();}
    });
    /* ---- 分割條 ---- */
    (function(){
      let st=null;
      gut.addEventListener('pointerdown',e=>{
        st={x:e.clientX,y:e.clientY,cb:codePane.getBoundingClientRect(),pb:prevPane.getBoundingClientRect()};
        gut.classList.add('act');
        document.documentElement.classList.add('resizing');
        document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
        e.preventDefault();
      });
      const mv=e=>{
        if(!st)return;
        const r=split.getBoundingClientRect();
        if(S.split==='h'){
          const ratio=clamp((e.clientX-r.left)/r.width,.12,.88);
          codePane.style.flex='0 0 '+(ratio*100)+'%';
          prevPane.style.flex='1 1 auto';
        }else{
          const ratio=clamp((e.clientY-r.top)/r.height,.12,.88);
          codePane.style.flex='0 0 '+(ratio*100)+'%';
          prevPane.style.flex='1 1 auto';
        }
        if(S.cm)S.cm.refresh();
      };
      const up=()=>{st=null;gut.classList.remove('act');document.documentElement.classList.remove('resizing');
        document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(S.cm)S.cm.refresh();};
    })();
    /* ---- 工具列 ---- */
    root.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='open'){
        const p=await Dlg.prompt('開啟符籙','路徑（留空則開新符）',S.path||S.dir+'/');
        if(p===false||p===null)return;
        if(!p){setVal(Sys.HTML_SEED);S.path='';setLang('htmlmixed','html');ctx.setTitle('未名符','HTML');refreshPreview();return;}
        if(p.slice(-1)==='/'){WM.open('explorer',{path:p});return;}
        load(p);
      }
      else if(a==='save')save(true);
      else if(a==='saveas')saveAs();
      else if(a==='undo'){S.cm?S.cm.undo():document.execCommand('undo');}
      else if(a==='redo'){S.cm?S.cm.redo():document.execCommand('redo');}
      else if(a==='format')format();
      else if(a==='find')openFind(false);
      else if(a==='fnext')findNext(false);
      else if(a==='fprev')findNext(true);
      else if(a==='rep')replace(false);
      else if(a==='repall')replace(true);
      else if(a==='fclose'){findBar.classList.remove('on');if(S.cm)S.cm.focus();}
      else if(a==='import'){
        const inp=$('#filePicker');inp.value='';inp.multiple=false;
        inp.onchange=async()=>{
          const f=inp.files[0];if(!f)return;
          const t=await f.text();
          setVal(t);setLang(cmModeFor(f.name).mode,P.ext(f.name));
          S.path='';S.dirty=true;markDirty();refreshPreview();
          Toast.ok('已導入',f.name+' · '+fmtSize(f.size)+'（尚未存檔）');
        };
        inp.click();
      }
      else if(a==='export'){
        const def=(P.base(S.path)||'符')+'.'+S.lang.ext;
        const where=await Dlg.custom({title:'導出符籙',icon:'download',
          html:'<div style="font-size:12px;color:var(--bone-3);margin-bottom:10px">擇一去處。檔名可自訂。</div>'+
            '<input type="text" id="exName" value="'+esc(def)+'" style="width:100%;margin:0 0 12px;background:var(--ink);border:1px solid var(--line);padding:9px 10px;border-radius:4px;color:var(--bone);outline:0">'+
            '<div style="display:flex;flex-direction:column;gap:7px">'+
            '<button class="btn" id="exOs" style="justify-content:flex-start">'+ICO.download+'<span>導出至陽世（真實桌面下載）</span></button>'+
            '<button class="btn" id="exVfs" style="justify-content:flex-start">'+ICO.vault+'<span>導出至殮庫（虛擬桌面）</span></button>'+
            '<button class="btn" id="exDir" style="justify-content:flex-start">'+ICO.folder+'<span>存入指定目錄…</span></button></div>',
          buttons:[{label:'罷手',val:false}]});
        const layer=$('#dlgs');
        if(where===false){return;}
        /* Dlg 已關閉；改為先行綁定（見下） */
      }
      else if(a==='copyall'){
        const v=val();
        try{await navigator.clipboard.writeText(v);Toast.ok('已複製',v.length+' 字符入剪貼簿');}
        catch(e){
          if(S.cm){S.cm.focus();S.cm.execCommand('selectAll');}
          else{taEl.select();}
          Toast.info('請按 Ctrl+C','瀏覽器拒絕自動複製，已全選');
        }
      }
      else if(a==='newtab'){
        const doc=previewDoc();
        const url=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));
        const w=window.open(url,'_blank');
        if(!w)Toast.err('窗不開','瀏覽器阻擋了彈出窗口');
        setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},30000);
      }
      else if(a==='prevrefresh')refreshPreview();
      else if(a==='clear'){
        const ok=await Dlg.danger('清空','確定焚盡眼前所有符字？（可用撤銷救回）');
        if(ok){if(S.cm){S.cm.setValue('');}else taEl.value='';markDirty();refreshPreview();}
      }
    });
    /* 導出對話框：改採即時綁定版本 */
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-a="export"]');
      if(!b)return;
      setTimeout(()=>{
        const layer=$('#dlgs');
        const nameInp=layer.querySelector('#exName');
        if(!nameInp)return;
        layer.querySelector('#exOs').onclick=()=>{
          const n=nameInp.value.trim()||('符.'+S.lang.ext);
          Sys.saveBlob(new Blob([val()],{type:(CM_MODES[P.ext(n)]||{name:'text/plain'}).name+';charset=utf-8'}),n);
          layer.classList.remove('on');layer.innerHTML='';
          Toast.ok('已擲出',n+' → 陽世下載');
        };
        layer.querySelector('#exVfs').onclick=async()=>{
          const n=nameInp.value.trim()||('符.'+S.lang.ext);
          const p=await fs.unique(Desktop.path(),n);
          await fs.writeFile(p,val());
          layer.classList.remove('on');layer.innerHTML='';
          Toast.ok('已入靈堂',p);Desktop.refresh();Bus.emit('fs',Desktop.path());
        };
        layer.querySelector('#exDir').onclick=async()=>{
          const n=nameInp.value.trim()||('符.'+S.lang.ext);
          layer.classList.remove('on');layer.innerHTML='';
          const d=await Dlg.prompt('存入何處','輸入目錄路徑',S.dir);
          if(!d)return;
          const p=await fs.unique(d,n);
          await fs.writeFile(p,val());
          Toast.ok('已存',p);Bus.emit('fs',d);
        };
      },30);
    });
    langSel.onchange=()=>setLang((CM_MODES[langSel.value]||{mode:'htmlmixed'}).mode,langSel.value);
    inputSel.onchange=async()=>{
      S.input=inputSel.value;CFG.set('editorInput',S.input);
      const v=val(),cur=S.cm?S.cm.getCursor():null;
      if(S.cm){
        const old=S.cm.getWrapperElement();
        S.cm.toTextArea();
        old.parentNode&&old.remove();
        taEl.value=v;
        S.cm=null;
        await bootCM2(v,cur);
      }
      Toast.ok('已換輸入模式',{auto:'自動（隨瀏覽器）',textarea:'電腦（textarea）',contenteditable:'手機（contenteditable）'}[S.input]);
    };
    splitSel.onchange=()=>setSplit(splitSel.value);
    $$('[data-v]',root.querySelector('[data-a="view"]')).forEach(b=>b.onclick=()=>setViewMode(b.dataset.v));
    async function bootCM2(v,cur){
      const codePaneTa=codePane.querySelector('textarea')||taEl;
      if(!codePane.contains(codePaneTa))codePane.appendChild(codePaneTa);
      const CM=await Lazy.codemirror();
      const inputStyle=(S.input==='auto')?CM.defaults.inputStyle:S.input;
      const cm=CodeMirror.fromTextArea(codePaneTa,{
        mode:S.lang.mode,theme:'material-darker',lineNumbers:true,lineWrapping:true,styleActiveLine:true,
        matchBrackets:true,autoCloseBrackets:true,indentUnit:2,tabSize:2,inputStyle:inputStyle
      });
      cm.setValue(v);if(cur)cm.setCursor(cur);
      cm.on('change',()=>{markDirty();schedulePreview();});
      cm.on('cursorActivity',updateStatus);
      cm.getWrapperElement().addEventListener('keydown',e=>e.stopPropagation());
      if(S.cm){try{S.cm.toTextArea();}catch(e){}}
      S.cm=cm;updateStatus();refreshPreview();
      ctx.onResize(()=>cm.refresh());
    }
    /* ---- 啟動 ---- */
    bootCM();
    ctx.setTitle(P.base(S.path||'未名符'),S.lang.label);
    updateStatus();
    return {
      destroy(){
        /* 釋放編輯器實例，避免內存洩漏 */
        clearTimeout(S.timer);clearTimeout(S.prevTimer);
        try{if(S.cm){S.cm.toTextArea();S.cm=null;}}catch(e){}
        try{iframe.srcdoc='';}catch(e){}
        S.path=null;
      },
      beforeClose(){
        if(!S.dirty)return true;
        Dlg.confirm('符未乾','「'+(P.base(S.path)||'未名符')+'」有未存之字。','棄之').then(ok=>{if(ok){S.dirty=false;ctx.close();}});
        return false;
      },
      reuse(a){if(a&&a.path)load(a.path);else{WM.focus(ctx.id);if(S.cm)S.cm.refresh();}},
      load,save,setLang
    };
  }
};
/* =====================================================================
   卷十 · 照妖鏡（影像 / 連環）＋ 亡者之聲（影音）＋ 窺世鏡（瀏覽器）
   ===================================================================== */
const IMG_EXT=KINDS.img.concat(['jfif','jpe','apng','heic']);
function isImageName(n){return IMG_EXT.indexOf(P.ext(n))>=0;}

Apps.viewer={
  id:'viewer',name:'照妖鏡',en:'Revealer',icon:'aViewer',w:920,h:660,minW:320,minH:240,
  keys:'圖片 查看 image viewer 漫畫 條漫 webtoon pdf',
  mount(ctx,args){
    args=args||{};
    const S={path:args.path||'',list:[],idx:0,mode:'single',scale:1,rot:0,tx:0,ty:0,urls:[],friction:null};
    const isPdf=P.ext(S.path)==='pdf';
    ctx.body.innerHTML='<div class="iv">'+
      '<div class="abar">'+
        '<button class="abtn" data-a="prev">'+ICO.prev+'<span>上一張</span></button>'+
        '<button class="abtn" data-a="next">'+ICO.next+'<span>下一張</span></button>'+

        '<button class="abtn" data-a="zout">'+ICO.zoomOut+'<span>縮小</span></button>'+
        '<button class="abtn" data-a="fit">'+ICO.fit+'<span>貼合</span></button>'+
        '<button class="abtn" data-a="p100">'+ICO.search+'<span>1:1</span></button>'+
        '<button class="abtn" data-a="rot">'+ICO.rotate+'<span>旋轉</span></button>'+
        '<div class="asep"></div>'+
        '<button class="abtn" data-a="mode">'+ICO.columns+'<span>連環閱讀</span></button>'+
        '<button class="abtn" data-a="export">'+ICO.download+'<span>導出</span></button>'+
        '<button class="abtn" data-a="wall">'+ICO.fimg+'<span>設為壁紙</span></button>'+
        '<button class="abtn" data-a="edit">'+ICO.aEditor+'<span>編輯源碼</span></button>'+
        '<div style="flex:1"></div>'+
        '<button class="abtn" data-a="fs">'+ICO.fsOn+'<span>全屏</span></button>'+
      '</div>'+
      '<div class="iv-stage"><img alt="" draggable="false"><div class="iv-hud">'+
        '<button class="aicon" data-a="prev">'+ICO.prev+'</button>'+
        '<span class="z">100%</span>'+
        '<button class="aicon" data-a="next">'+ICO.next+'</button>'+
        '<button class="aicon" data-a="zin">'+ICO.zoomIn+'</button>'+
        '<button class="aicon" data-a="zout">'+ICO.zoomOut+'</button>'+
        '<button class="aicon" data-a="fit">'+ICO.fit+'</button>'+
      '</div></div>'+
      '<div class="wt hidden"></div>'+
    '</div>';
    const root=ctx.body.querySelector('.iv');
    const stage=root.querySelector('.iv-stage');
    const img=stage.querySelector('img');
    const wt=root.querySelector('.wt');
    const zLabel=root.querySelector('.iv-hud .z');

    async function listSiblings(){
      if(!S.path)return;
      const dir=P.dir(S.path);
      try{
        const kids=await fs.readdir(dir);
        const imgs=kids.filter(k=>k.kind==='file'&&isImageName(k.name)).sort((a,b)=>natcmp(a.name,b.name));
        S.list=imgs;
        S.idx=Math.max(0,imgs.findIndex(i=>i.path===S.path));
      }catch(e){S.list=[];}
    }
    async function showSingle(path){
      S.path=path;
      stage.style.display='grid';wt.classList.add('hidden');
      stage.innerHTML='';
      if(isPdf||P.ext(path)==='pdf'){
        const url=await fs.readFile(path,'url');S.urls.push(url);
        const f=el('iframe',{style:'width:100%;height:100%;border:0;background:#202020'});
        f.src=url;stage.appendChild(f);
        ctx.setTitle(P.base(path),'PDF · 經卷');
        return;
      }
      const im=el('img',{alt:'',draggable:'false'});
      stage.appendChild(im);
      const shade=el('div',{class:'busy',html:'<div class="in"><div class="spin"></div><p>顯影中…</p></div>'});
      stage.appendChild(shade);
      try{
        const url=await fs.readFile(path,'url');
        S.urls.push(url);
        await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url;});
        shade.remove();
      }catch(e){
        shade.innerHTML='<div class="in">'+ICO.warn+'<p>此影不顯</p></div>';
        return;
      }
      S.scale=1;S.rot=0;S.tx=0;S.ty=0;applyT(im);
      ctx.setTitle(P.base(path),'REVEALER · '+(S.list.length?(S.idx+1)+'/'+S.list.length:''));
      ctx.setStatus('<span class="st">'+esc(P.base(path))+'</span><span class="st">'+(im.naturalWidth)+'×'+(im.naturalHeight)+'</span><span class="st" style="margin-left:auto">'+esc(path)+'</span>');
      bindPanZoom(im);
    }
    function applyT(im){
      im=im||stage.querySelector('img');
      if(!im)return;
      im.style.transform='translate('+S.tx+'px,'+S.ty+'px) scale('+S.scale+') rotate('+S.rot+'deg)';
      const z=root.querySelector('.iv-hud .z');if(z)z.textContent=Math.round(S.scale*100)+'%';
    }
    function bindPanZoom(im){
      let st=null;
      im.addEventListener('pointerdown',e=>{
        st={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,id:e.pointerId};
        im.classList.add('grabbing');
        im.setPointerCapture(e.pointerId);
      });
      im.addEventListener('pointermove',e=>{
        if(!st)return;
        S.tx=st.tx+(e.clientX-st.x);S.ty=st.ty+(e.clientY-st.y);applyT(im);
      });
      const up=e=>{st=null;im.classList.remove('grabbing');};
      im.addEventListener('pointerup',up);im.addEventListener('pointercancel',up);
      im.addEventListener('wheel',e=>{
        e.preventDefault();
        const k=e.deltaY<0?1.13:1/1.13;
        S.scale=clamp(S.scale*k,.06,24);applyT(im);
      },{passive:false});
      stage.onwheel=e=>{
        if(e.target!==im)return;
        e.preventDefault();
        S.scale=clamp(S.scale*(e.deltaY<0?1.13:1/1.13),.06,24);applyT(im);
      };
      /* 雙指縮放 */
      let pinch=null;
      im.addEventListener('touchstart',e=>{
        if(e.touches.length===2){
          pinch={d:dist(e.touches),s:S.scale};
        }
      },{passive:true});
      im.addEventListener('touchmove',e=>{
        if(pinch&&e.touches.length===2){
          e.preventDefault();
          S.scale=clamp(pinch.s*(dist(e.touches)/pinch.d),.06,24);applyT(im);
        }
      },{passive:false});
      im.addEventListener('touchend',()=>{if(pinch)pinch=null;});
      function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
    }
    /* ---- 條漫模式 ---- */
    async function showStrip(){
      S.mode='strip';
      stage.style.display='none';stage.innerHTML='';
      wt.classList.remove('hidden');
      wt.innerHTML='<div class="wt-prog"><i></i></div><div class="wt-in"></div>'+
        '<div class="wt-hud"><span class="tag" data-wt-count>0 / 0</span><button class="fsx" data-a="fsx" title="退出全屏">'+ICO.close+'</button></div>';
      const inn=wt.querySelector('.wt-in');
      const prog=wt.querySelector('.wt-prog i');
      const cnt=wt.querySelector('[data-wt-count]');
      const dir=S.path?P.dir(S.path):Desktop.path();
      let imgs=[];
      try{
        const kids=await fs.readdir(dir);
        imgs=kids.filter(k=>k.kind==='file'&&isImageName(k.name)).sort((a,b)=>natcmp(a.name,b.name));
      }catch(e){
        wt.innerHTML='<div class="empty">'+ICO.warn+'<p>此匣讀不出</p><div style="font-size:11px">'+esc(e.message||'')+'</div></div>';
        return;
      }
      if(!imgs.length){wt.innerHTML='<div class="empty">'+ICO.fimg+'<p>此匣無影</p></div>';return;}
      const startIdx=Math.max(0,imgs.findIndex(i=>i.path===S.path));
      /* 骨架佔位（固有寬高比） */
      const nodes=imgs.map((it,i)=>{
        const p=el('div',{class:'wt-p'});
        p.innerHTML='<div class="sk" style="aspect-ratio:2/3"><span>點燈中 · '+esc(it.name)+'</span></div>';
        inn.appendChild(p);
        return p;
      });
      cnt.textContent='0 / '+imgs.length;
      /* 並行讀取、按序插入 */
      let loaded=0;
      await Promise.all(imgs.map(async(it,i)=>{
        try{
          const blob=await fs.readFile(it.path,'blob');
          const url=URL.createObjectURL(blob);
          S.urls.push(url);
          const node=nodes[i];
          const before=node.offsetHeight;
          const above=node.offsetTop<wt.scrollTop;
          await new Promise((res,rej)=>{
            const im=el('img',{alt:it.name,draggable:'false'});
            im.onload=()=>res(im);im.onerror=rej;
            im.src=url;
          }).then(im=>{
            node.innerHTML='';node.appendChild(im);
            const delta=node.offsetHeight-before;
            if(above&&delta)wt.scrollTop+=delta;   /* 高度增量補償，畫面絕不跳動 */
          });
          loaded++;cnt.textContent=loaded+' / '+imgs.length;
        }catch(e){
          nodes[i].className='wt-p err';
          nodes[i].textContent='此影不顯 · '+it.name;
        }
      }));
      /* 定位到使用者點擊的那張 */
      setTimeout(()=>{
        const t=nodes[startIdx];
        if(t&&startIdx>0)wt.scrollTop=Math.max(0,t.offsetTop-8);
      },60);
      /* 進度 */
      wt.addEventListener('scroll',()=>{
        const max=wt.scrollHeight-wt.clientHeight;
        prog.style.width=(max>0?(wt.scrollTop/max*100):0)+'%';
      });
      bindStripDrag();
      ctx.setTitle(P.base(dir)+' · 連環','WEBTOON · '+imgs.length+' 頁');
    }
    function bindStripDrag(){
      let st=null,v=0,raf=0,lastY=0,lastT=0;
      wt.addEventListener('pointerdown',e=>{
        if(e.pointerType!=='mouse')return;      /* 觸控走合成器原生滾動 */
        if(S.friction){cancelAnimationFrame(S.friction);S.friction=null;}
        st={y:e.clientY,scroll:wt.scrollTop};lastY=e.clientY;lastT=performance.now();v=0;
        wt.style.cursor='grabbing';
        wt.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      wt.addEventListener('pointermove',e=>{
        if(!st)return;
        const dy=e.clientY-st.y;
        wt.scrollTop=st.scroll-dy;
        const now=performance.now(),dt=Math.max(1,now-lastT);
        v=(e.clientY-lastY)/dt*16;
        lastY=e.clientY;lastT=now;
      });
      const up=()=>{
        if(!st)return;
        st=null;wt.style.cursor='';
        if(Math.abs(v)>0.6){
          const step=()=>{
            wt.scrollTop-=v;
            v*=0.96;                              /* FRICTION = 0.96 */
            if(Math.abs(v)>0.25)S.friction=requestAnimationFrame(step);
            else S.friction=null;
          };
          S.friction=requestAnimationFrame(step);
        }
      };
      wt.addEventListener('pointerup',up);
      wt.addEventListener('pointercancel',up);
    }
    async function setMode(m){
      S.mode=m;
      const btn=root.querySelector('[data-a="mode"]');
      if(m==='strip'){btn.classList.add('on');btn.querySelector('span').textContent='單張檢視';await showStrip();}
      else{btn.classList.remove('on');btn.querySelector('span').textContent='連環閱讀';if(S.path)showSingle(S.path);}
    }
    function step(d){
      if(!S.list.length)return;
      S.idx=(S.idx+d+S.list.length)%S.list.length;
      const p=S.list[S.idx].path;
      if(S.mode==='strip'){
        S.path=p;showStrip();
      }else showSingle(p);
    }
    root.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='prev')step(-1);
      else if(a==='next')step(1);
      else if(a==='zin'){S.scale=clamp(S.scale*1.25,.06,24);applyT();}
      else if(a==='zout'){S.scale=clamp(S.scale/1.25,.06,24);applyT();}
      else if(a==='fit'){S.scale=1;S.rot=0;S.tx=S.ty=0;applyT();}
      else if(a==='p100'){const im=stage.querySelector('img');if(im){S.scale=im.naturalWidth/im.clientWidth;applyT();}}
      else if(a==='rot'){S.rot=(S.rot+90)%360;applyT();}
      else if(a==='mode')setMode(S.mode==='strip'?'single':'strip');
      else if(a==='export')Sys.download(S.path);
      else if(a==='wall'){CFG.set('wallpaper','custom');CFG.set('wallpaperPath',S.path);await Wallpaper.apply();Toast.ok('已張掛',P.base(S.path));}
      else if(a==='edit'){WM.open('editor',{path:S.path});}
      else if(a==='fs'||a==='fsx'){ctx.fullscreen();b.innerHTML=(ctx.fsMode?ICO.fsOff:ICO.fsOn)+'<span>'+(ctx.fsMode?'退出全屏':'全屏')+'</span>';}
    });
    root.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft')step(-1);
      if(e.key==='ArrowRight')step(1);
      if(e.key==='+'||e.key==='='){S.scale=clamp(S.scale*1.2,.06,24);applyT();}
      if(e.key==='-'){S.scale=clamp(S.scale/1.2,.06,24);applyT();}
      if(e.key==='Escape'&&ctx.fsMode)ctx.fullscreen();
    });
    root.tabIndex=0;
    (async()=>{
      if(!S.path){
        ctx.body.innerHTML='<div class="empty">'+ICO.aViewer+'<p>無影可照</p><div style="font-size:11.5px;color:var(--bone-3)">自翻檢閣點擊任一圖影</div></div>';
        return;
      }
      await listSiblings();
      if(isPdf){await showSingle(S.path);return;}
      /* 同匣圖影多於 3 張 → 預設條漫；否則單張 */
      if(args.strip||S.list.length>=3){
        root.querySelector('[data-a="mode"]').classList.add('on');
        root.querySelector('[data-a="mode"] span').textContent='單張檢視';
        S.mode='strip';
        await showStrip();
      }else await showSingle(S.path);
    })();
    return {
      destroy(){S.urls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});S.urls=[];if(S.friction)cancelAnimationFrame(S.friction);},
      reuse(a){if(a&&a.path){S.path=a.path;listSiblings().then(()=>a.strip||S.list.length>=3?showStrip():showSingle(a.path));}}
    };
  }
};

Apps.media={
  id:'media',name:'亡者之聲',en:'Vox',icon:'aMedia',w:720,h:520,minW:320,minH:260,
  keys:'音樂 影片 播放 audio video player mp3 mp4',
  mount(ctx,args){
    args=args||{};
    const S={list:[],idx:0,url:null,vol:.85,muted:false};
    const isVid=args.path?kindOf(args.path)==='vid':false;
    ctx.body.innerHTML='<div class="mp">'+
      '<div class="mp-art">'+(isVid?'<video playsinline></video>':
        '<div class="ring">'+ICO.faud+'</div>')+'</div>'+
      '<div class="mp-ctl">'+
        '<div class="mp-title">—</div>'+
        '<div class="mp-seek"><i></i></div>'+
        '<div class="mp-row">'+
          '<span class="t cur">00:00</span>'+
          '<button class="aicon" data-a="prev">'+ICO.prev+'</button>'+
          '<button class="mp-play" data-a="play">'+ICO.play+'</button>'+
          '<button class="aicon" data-a="next">'+ICO.next+'</button>'+
          '<span class="t dur">00:00</span>'+
          '<div style="flex:1"></div>'+
          '<button class="aicon" data-a="mute">'+ICO.vol+'</button>'+
          '<div class="mp-vol"><i></i></div>'+
          '<button class="abtn" data-a="export">'+ICO.download+'<span>導出</span></button>'+
        '</div>'+
      '</div>'+
      '<div class="mp-list"></div>'+
    '</div>';
    const root=ctx.body.querySelector('.mp');
    const media=isVid?root.querySelector('video'):new Audio();
    if(!isVid){media.preload='metadata';}
    const seek=root.querySelector('.mp-seek'),seekBar=seek.querySelector('i');
    const listEl=root.querySelector('.mp-list');
    media.volume=S.vol;
    async function build(path){
      const dir=P.dir(path),k=kindOf(path);
      try{
        const kids=await fs.readdir(dir);
        S.list=kids.filter(x=>x.kind==='file'&&kindOf(x.name)===k).sort((a,b)=>natcmp(a.name,b.name));
      }catch(e){S.list=[];}
      S.idx=Math.max(0,S.list.findIndex(x=>x.path===path));
      listEl.innerHTML='';
      S.list.forEach((it,i)=>{
        const n=el('div',{class:'it'+(i===S.idx?' on':'')});
        n.innerHTML=ICO[k==='vid'?'fvid':'faud']+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.name)+'</span><span style="margin-left:auto;font-family:var(--f-mono);font-size:10px;opacity:.6">'+fmtSize(it.size)+'</span>';
        n.onclick=()=>{S.idx=i;play();};
        listEl.appendChild(n);
      });
    }
    async function play(){
      const it=S.list[S.idx];
      if(!it)return;
      if(S.url){try{URL.revokeObjectURL(S.url);}catch(e){}}
      try{
        S.url=await fs.readFile(it.path,'url');
        media.src=S.url;
        await media.play();
        root.classList.add('playing');
        root.querySelector('[data-a="play"]').innerHTML=ICO.pause;
        ctx.setTitle(it.name,'VOX');
        ctx.setIcon(kindOf(it.name)==='vid'?'fvid':'aMedia');
        $$('.mp-list .it',root).forEach((n,i)=>n.classList.toggle('on',i===S.idx));
      }catch(e){
        Toast.err('叫不醒',it.name+'：'+(e.message||e)+'（此格式瀏覽器或不支援）');
      }
    }
    media.addEventListener('timeupdate',()=>{
      if(!media.duration)return;
      seekBar.style.width=(media.currentTime/media.duration*100)+'%';
      root.querySelector('.t.cur').textContent=fmtClock(media.currentTime);
      root.querySelector('.t.dur').textContent=fmtClock(media.duration);
    });
    media.addEventListener('ended',()=>{
      if(S.idx<S.list.length-1){S.idx++;play();}
      else{root.classList.remove('playing');root.querySelector('[data-a="play"]').innerHTML=ICO.play;}
    });
    media.addEventListener('pause',()=>{root.classList.remove('playing');root.querySelector('[data-a="play"]').innerHTML=ICO.play;});
    media.addEventListener('play',()=>{root.classList.add('playing');root.querySelector('[data-a="play"]').innerHTML=ICO.pause;});
    seek.addEventListener('pointerdown',e=>{
      const set=ev=>{
        const r=seek.getBoundingClientRect();
        const p=clamp((ev.clientX-r.left)/r.width,0,1);
        if(media.duration)media.currentTime=p*media.duration;
        seekBar.style.width=(p*100)+'%';
      };
      set(e);
      const mv=ev=>set(ev),up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
    const volEl=root.querySelector('.mp-vol');
    volEl.addEventListener('pointerdown',e=>{
      const set=ev=>{const r=volEl.getBoundingClientRect();S.vol=clamp((ev.clientX-r.left)/r.width,0,1);media.volume=S.vol;media.muted=false;volEl.querySelector('i').style.width=(S.vol*100)+'%';};
      set(e);
      const mv=ev=>set(ev),up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='play'){media.paused?media.play().catch(()=>play()):media.pause();}
      else if(a==='prev'){if(S.idx>0){S.idx--;play();}}
      else if(a==='next'){if(S.idx<S.list.length-1){S.idx++;play();}}
      else if(a==='mute'){S.muted=!S.muted;media.muted=S.muted;b.innerHTML=S.muted?ICO.eyeoff:ICO.vol;}
      else if(a==='export'){const it=S.list[S.idx];if(it)Sys.download(it.path);}
    });
    root.addEventListener('keydown',e=>{
      if(e.key===' '){e.preventDefault();media.paused?media.play():media.pause();}
      if(e.key==='ArrowRight')media.currentTime=Math.min(media.duration||0,media.currentTime+5);
      if(e.key==='ArrowLeft')media.currentTime=Math.max(0,media.currentTime-5);
      e.stopPropagation();
    });
    root.tabIndex=0;
    ctx.onResize(()=>{});
    (async()=>{
      if(!args.path){
        root.querySelector('.mp-title').textContent='無聲可聽';
        listEl.innerHTML='<div class="empty" style="padding:20px">'+ICO.faud+'<p>自翻檢閣點選音訊或影片</p></div>';
        return;
      }
      root.querySelector('.mp-title').textContent=P.base(args.path);
      await build(args.path);
      play();
    })();
    return {destroy(){try{media.pause();media.src='';}catch(e){}if(S.url){try{URL.revokeObjectURL(S.url);}catch(e){}}},
      reuse(a){if(a&&a.path){build(a.path).then(play);}}};
  }
};

      clearTimeout(S.timer);
      S.timer=setTimeout(()=>{
        shade.querySelector('p').textContent='此物拒鏡 · 或仍在載入';
      },4200);
      iframe.onload=()=>{shade.classList.add('off');clearTimeout(S.timer);};
      if(u===HOME||u.indexOf('殮堂://')===0){
        iframe.srcdoc=homePage();
        setTimeout(()=>shade.classList.add('off'),60);
      }else if(u.charAt(0)==='/'||u.indexOf('/opfs/')===0||u.indexOf('/idb/')===0||u.indexOf('/local/')===0){
        try{
          const st=await fs.stat(u);
          if(st.kind==='dir'){
            iframe.srcdoc='<!DOCTYPE html><meta charset="utf-8"><body style="background:#0b0908;color:#ece2d2;font-family:monospace;padding:20px">此為棺匣，非頁面。請於翻檢閣開啟。</body>';
            shade.classList.add('off');return;
          }
          const url=await fs.readFile(u,'url');
          iframe.src=url;
          ctx.setTitle(P.base(u),'PEEPER');
        }catch(e){
          iframe.srcdoc='<!DOCTYPE html><meta charset="utf-8"><body style="background:#0b0908;color:#e8452f;font-family:monospace;padding:20px">讀不出：'+esc(e.message||e)+'</body>';
          shade.classList.add('off');
        }
      }else{
        if(!/^([a-z]+:)?\/\//i.test(u))u='https://'+u;
        iframe.src=u;
        ctx.setTitle(u.replace(/^https?:\/\//,'').split('/')[0],'PEEPER');
      }
      if(push!==false){
        S.hist=S.hist.slice(0,S.hi+1);S.hist.push(u);S.hi=S.hist.length-1;
      }
      if(S.cur>=0)S.tabs[S.cur]={title:u,url:u};
      renderTabs();
    }
    function renderTabs(){
      tabsEl.innerHTML='';
      S.tabs.forEach((t,i)=>{
        const n=el('div',{class:'br-tab'+(i===S.cur?' on':'')});
        n.innerHTML='<span>'+esc(t.title||t.url||'新籤')+'</span><span class="x">'+ICO.x+'</span>';
        n.onclick=e=>{
          if(e.target.closest('.x')){
            S.tabs.splice(i,1);
            if(!S.tabs.length)S.tabs=[{title:'首頁',url:HOME}];
            S.cur=clamp(i,0,S.tabs.length-1);
            go(S.tabs[S.cur].url,false);
            return;
          }
          S.cur=i;go(S.tabs[i].url,false);
        };
        tabsEl.appendChild(n);
      });
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='go')go(urlInp.value);
      else if(a==='back'){if(S.hi>0){S.hi--;go(S.hist[S.hi],false);}}
      else if(a==='fwd'){if(S.hi<S.hist.length-1){S.hi++;go(S.hist[S.hi],false);}}
      else if(a==='reload')go(S.url,false);
      else if(a==='home')go(HOME);
      else if(a==='new'){S.tabs.push({title:'新籤',url:HOME});S.cur=S.tabs.length-1;go(HOME);}
      else if(a==='openfs'){
        const u=S.url;
        if(u.charAt(0)==='/'){fs.readFile(u,'url').then(url=>window.open(url,'_blank'));}
        else window.open(u,'_blank');
      }
    });
    urlInp.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Enter')go(urlInp.value);
    });
    iframe.addEventListener('load',()=>shade.classList.add('off'));
    S.tabs=[{title:'首頁',url:HOME}];S.cur=0;
    if(args.path)go(args.path);
    else if(args.url)go(args.url);
    else go(HOME);
    ctx.setTitle(args.path?P.base(args.path):'窺世鏡','PEEPER');
    return {destroy(){clearTimeout(S.timer);try{iframe.src='about:blank';iframe.srcdoc='';}catch(e){}},
      reuse(a){if(a&&a.path)go(a.path);else if(a&&a.url)go(a.url);}};
  }
};
