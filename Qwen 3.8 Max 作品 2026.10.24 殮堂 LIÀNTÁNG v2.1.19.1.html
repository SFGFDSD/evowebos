Apps.calc={
  id:'calc',name:'推數',en:'Abacus',icon:'aCalc',w:330,h:520,minW:280,minH:400,noMax:true,
  keys:'計算機 計算 calculator 算',
  mount(ctx){
    const S={expr:'',out:'0',hist:[],fresh:true};
    const KEYS=[
      ['C','fn'],['±','fn'],['%','fn'],['÷','op'],
      ['7',''],['8',''],['9',''],['×','op'],
      ['4',''],['5',''],['6',''],['−','op'],
      ['1',''],['2',''],['3',''],['+','op'],
      ['0',''],['.',''],['⌫','fn'],['=','eq']
    ];
    ctx.body.innerHTML='<div class="ca">'+
      '<div class="ca-disp"><div class="ca-expr"></div><div class="ca-out">0</div></div>'+
      '<div class="ca-pad">'+KEYS.map(k=>'<button class="ca-k '+k[1]+'" data-k="'+k[0]+'">'+k[0]+'</button>').join('')+'</div>'+
      '<div class="ca-hist"></div>'+
    '</div>';
    const root=ctx.body.querySelector('.ca');
    const ex=root.querySelector('.ca-expr'),ou=root.querySelector('.ca-out'),hi=root.querySelector('.ca-hist');
    function paint(){ex.textContent=S.expr;ou.textContent=S.out;ou.style.fontSize=(S.out.length>13?20:S.out.length>9?25:32)+'px';}
    function press(k){
      if(k==='C'){S.expr='';S.out='0';S.fresh=true;}
      else if(k==='⌫'){S.expr=S.expr.slice(0,-1);if(!S.expr)S.out='0';}
      else if(k==='±'){if(S.out!=='0')S.out=String(-parseFloat(S.out)),S.expr=S.out,S.fresh=true;}
      else if(k==='='){
        if(!S.expr)return;
        try{
          const js=S.expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100').replace(/[^0-9+\-*/().\s]/g,'');
          if(!js.trim())throw new Error('空');
          /* eslint-disable no-new-func */
          const v=Function('"use strict";return ('+js+')')();
          if(typeof v!=='number'||!isFinite(v))throw new Error('不可算');
          const r=String(Math.round(v*1e12)/1e12);
          S.hist.unshift(S.expr+' = '+r);
          if(S.hist.length>40)S.hist.pop();
          hi.innerHTML=S.hist.map(h=>'<div>'+esc(h)+'</div>').join('');
          $$('.ca-hist div',root).forEach((d,i)=>d.onclick=()=>{S.expr=S.hist[i].split(' = ')[0];S.out=S.hist[i].split(' = ')[1];paint();});
          S.out=r;S.expr=r;S.fresh=true;
        }catch(e){S.out='不可算';S.expr='';S.fresh=true;}
      }
      else{
        if(S.fresh&&/[0-9.]/.test(k)){S.expr=k;S.fresh=false;}
        else S.expr+=k;
        S.out=S.expr;
      }
      paint();
    }
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k);});
    root.tabIndex=0;
    root.addEventListener('keydown',e=>{
      e.stopPropagation();
      const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','Delete':'C','%':'%'};
      if(/^[0-9.]$/.test(e.key))press(e.key);
      else if(m[e.key])press(m[e.key]);
    });
    paint();
    setTimeout(()=>root.focus(),80);
    return {destroy(){}};
  }
};

/* ---------- 描符 · 畫板 ---------- */
Apps.paint={
  id:'paint',name:'描符',en:'Talisman',icon:'aPaint',w:860,h:620,minW:340,minH:320,
  keys:'畫板 繪圖 畫 paint draw canvas 符',
  mount(ctx,args){
    args=args||{};
    const PAL=['#0b0908','#c22b1e','#d9b25e','#5f8f76','#ece2d2','#6d120d','#8b9a5b','#2b221e'];
    const S={tool:'brush',color:'#c22b1e',size:6,stack:[],drawing:false,w:900,h:600};
    ctx.body.innerHTML='<div class="pb">'+
      '<div class="pb-tools">'+
        '<button class="abtn on" data-t="brush">'+ICO.pencil+'<span>毛筆</span></button>'+
        '<button class="abtn" data-t="eraser">'+ICO.eyeoff+'<span>抹</span></button>'+
        '<button class="abtn" data-t="line">'+ICO.format+'<span>直線</span></button>'+
        '<button class="abtn" data-t="rect">'+ICO.max+'<span>方框</span></button>'+
        '<button class="abtn" data-t="circle">'+ICO.aViewer+'<span>圓</span></button>'+
        '<button class="abtn" data-t="fill">'+ICO.aPaint+'<span>填色</span></button>'+
        '<div class="asep"></div>'+
        PAL.map(c=>'<span class="pb-sw'+(c===S.color?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></span>').join('')+
        '<input type="color" class="pb-sw" data-c="custom" value="#c22b1e" title="自選朱色" style="padding:0;background:none">'+
        '<div class="asep"></div>'+
        '<span style="font-size:11px;color:var(--bone-3)">粗細</span>'+
        '<input type="range" class="pb-range" min="1" max="60" value="6" data-size>'+
        '<span class="tag" data-sz>6</span>'+
        '<div style="flex:1"></div>'+
        '<button class="abtn" data-a="undo">'+ICO.undo+'<span>撤銷</span></button>'+
        '<button class="abtn" data-a="clear">'+ICO.burn+'<span>淨紙</span></button>'+
        '<button class="abtn" data-a="open">'+ICO.openBox+'<span>開圖</span></button>'+
        '<button class="abtn pri" data-a="save">'+ICO.save+'<span>存入殮庫</span></button>'+
        '<button class="abtn" data-a="export">'+ICO.download+'<span>導出</span></button>'+
      '</div>'+
      '<div class="pb-cv"><canvas width="900" height="600"></canvas></div>'+
    '</div>';
    const root=ctx.body.querySelector('.pb');
    const cv=root.querySelector('canvas'),g=cv.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
    g.lineCap='round';g.lineJoin='round';
    let snap=null,start=null,last=null;
    function push(){
      try{
        S.stack.push(cv.toDataURL());
        if(S.stack.length>28)S.stack.shift();
      }catch(e){}
    }
    function pos(e){
      const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};
    }
    function flood(x,y,color){
      const im=g.getImageData(0,0,cv.width,cv.height),d=im.data;
      const w=cv.width,h=cv.height;
      const idx=(x,y)=>(y*w+x)*4;
      const i0=idx(x|0,y|0);
      const t=[d[i0],d[i0+1],d[i0+2]];
      const c=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)];
      if(t[0]===c[0]&&t[1]===c[1]&&t[2]===c[2])return;
      const st=[[x|0,y|0]];
      const match=i=>Math.abs(d[i]-t[0])<26&&Math.abs(d[i+1]-t[1])<26&&Math.abs(d[i+2]-t[2])<26;
      let guard=0;
      while(st.length&&guard++<400000){
        const [cx,cy]=st.pop();
        if(cx<0||cy<0||cx>=w||cy>=h)continue;
        const i=idx(cx,cy);
        if(!match(i))continue;
        d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
        st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
      }
      g.putImageData(im,0,0);
    }
    cv.addEventListener('pointerdown',e=>{
      cv.setPointerCapture(e.pointerId);
      const p=pos(e);
      S.drawing=true;start=p;last=p;
      push();
      if(S.tool==='fill'){flood(p.x,p.y,S.color);S.drawing=false;return;}
      if(S.tool==='brush'||S.tool==='eraser'){
        snap=g.getImageData(0,0,cv.width,cv.height);
        g.beginPath();g.moveTo(p.x,p.y);
        g.strokeStyle=S.tool==='eraser'?'#ffffff':S.color;
        g.lineWidth=S.tool==='eraser'?S.size*2.4:S.size;
        g.lineTo(p.x+.01,p.y+.01);g.stroke();
      }else{
        snap=g.getImageData(0,0,cv.width,cv.height);
      }
      e.preventDefault();
    });
    cv.addEventListener('pointermove',e=>{
      if(!S.drawing)return;
      const p=pos(e);
      if(S.tool==='brush'||S.tool==='eraser'){
        g.lineTo(p.x,p.y);g.stroke();
      }else{
        g.putImageData(snap,0,0);
        g.beginPath();
        g.strokeStyle=S.color;g.lineWidth=S.size;
        if(S.tool==='line'){g.moveTo(start.x,start.y);g.lineTo(p.x,p.y);}
        else if(S.tool==='rect'){g.rect(start.x,start.y,p.x-start.x,p.y-start.y);}
        else if(S.tool==='circle'){const r=Math.hypot(p.x-start.x,p.y-start.y);g.arc(start.x,start.y,r,0,Math.PI*2);}
        g.stroke();
      }
      last=p;
      e.preventDefault();
    });
    const up=()=>{S.drawing=false;snap=null;};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
    root.addEventListener('click',async e=>{
      const t=e.target.closest('[data-t]');
      if(t){S.tool=t.dataset.t;$$('[data-t]',root).forEach(b=>b.classList.toggle('on',b===t));return;}
      const sw=e.target.closest('[data-c]');
      if(sw){
        if(sw.dataset.c==='custom')return;
        S.color=sw.dataset.c;$$('[data-c]',root).forEach(b=>b.classList.toggle('on',b===sw));return;
      }
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='undo'){
        const s=S.stack.pop();
        if(s){const im=new Image();im.onload=()=>{g.clearRect(0,0,cv.width,cv.height);g.drawImage(im,0,0);};im.src=s;}
      }
      else if(a==='clear'){push();g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);}
      else if(a==='open'){
        const p=await Dlg.prompt('開圖','輸入圖影路徑',CFG.get('desktopRoot')+'/圖影/');
        if(!p)return;
        try{
          const url=await fs.readFile(p,'url');
          const im=new Image();
          im.onload=()=>{push();cv.width=im.naturalWidth;cv.height=im.naturalHeight;g.drawImage(im,0,0);URL.revokeObjectURL(url);};
          im.src=url;
        }catch(err){Toast.err('開不了',err.message);}
      }
      else if(a==='save'){
        const name=await Dlg.prompt('存符紙','存為 PNG，命名','描符.png');
        if(!name)return;
        cv.toBlob(async blob=>{
          const p=await fs.unique(CFG.get('desktopRoot')+'/圖影',name);
          await fs.writeFile(p,blob);
          Toast.ok('已存',p);Bus.emit('fs',P.dir(p));Desktop.refresh();
        },'image/png');
      }
      else if(a==='export'){cv.toBlob(b=>Sys.saveBlob(b,'描符.png'),'image/png');}
    });
    root.querySelector('[data-c="custom"]').addEventListener('input',e=>{S.color=e.target.value;});
    const rg=root.querySelector('[data-size]');
    rg.addEventListener('input',()=>{S.size=+rg.value;root.querySelector('[data-sz]').textContent=rg.value;});
    if(args.path){
      fs.readFile(args.path,'url').then(url=>{
        const im=new Image();
        im.onload=()=>{cv.width=im.naturalWidth;cv.height=im.naturalHeight;g.drawImage(im,0,0);URL.revokeObjectURL(url);};
        im.src=url;
      }).catch(()=>{});
    }
    ctx.onResize(()=>{});
    return {destroy(){S.stack=[];}};
  }
};

Apps.terminal={
  id:'terminal',name:'扶乩',en:'Planchette',icon:'aTerm',w:780,h:480,minW:320,minH:200,
  keys:'終端 terminal shell 命令 扶乩 cmd',

      '<div class="abar" style="background:#0d0b0a;border-color:#1e1a18">'+
        '<button class="abtn" data-a="clear">'+ICO.burn+'<span>淨版</span></button>'+
        '<button class="abtn" data-a="help">'+ICO.info+'<span>咒語表</span></button>'+

    const root=ctx.body.querySelector('.tm');

    const ps=root.querySelector('.tm-ps');
    function prompt(){ps.textContent=S.cwd.replace(/^\/(opfs|idb|local)/,(m,x)=>({opfs:'殮庫',idb:'紙庫',local:'陽世'})[x])+' ›';}
    function w(html,cls){

      return d;
    }
    w('<span class="big">扶 乩</span>');

    w('');
    prompt();
    const CMDS={
      help:()=>{
        const rows=[
          ['ls / dir [路徑]','列出此處所有魂'],['cd <路徑>','移駕'],['pwd','現在何處'],['cat <檔>','讀出全文'],
          ['mkdir <名>','置棺'],['touch <名>','落一張紙'],['rm <名> [-r]','焚化'],['mv <源> <的>','改名 / 搬移'],
          ['cp <源> <的>','複制'],['stat <路徑>','魂訊'],['du <路徑>','實算容量'],['tree [路徑]','樹狀圖'],
          ['find <字> [-c]','全庫搜索（-c 含內容）'],['open <路徑>','以對應應用開啟'],['edit <檔>','以符籙編輯'],
          ['export <檔>','導出到陽世'],['mount','列出陽世掛載'],['mount <名>','掛載陽世卷宗'],['umount <名>','卸載'],
          ['store [opfs|idb]','查看 / 切換預設庫'],['usage','儲量報告'],['theme [dark|light]','陰陽'],['wall <id|路徑>','換壁紙'],
          ['neofetch','堂訊'],['echo <字>','回聲'],['date','更漏'],['clear','淨版'],['焚堂','重置系統（需二次確認）']
        ];
        w('<span class="go">── 咒語表 ──</span>');
        rows.forEach(r=>w('<span class="ok">'+esc(r[0]).padEnd(24,' ')+'</span> <span class="dim">'+esc(r[1])+'</span>'));
      },
      咒語:()=>CMDS.help(),
      ls:async a=>{
        const p=a[0]?resolve(a[0]):S.cwd;
        const kids=await fs.readdir(p);
        if(!kids.length)return w('<span class="dim">（空）</span>');
        kids.sort((x,y)=>x.kind===y.kind?natcmp(x.name,y.name):(x.kind==='dir'?-1:1)).forEach(k=>{
          w((k.kind==='dir'?'<span class="go">棺 </span>':'<span class="dim">紙 </span>')+esc(k.name).padEnd(34,' ')+
            '<span class="dim">'+(k.kind==='file'?fmtSize(k.size).padStart(10,' '):'         —')+'  '+fmtDate(k.mtime)+'</span>');
        });
      },
      dir:a=>CMDS.ls(a),
      cd:a=>{
        if(!a[0]||a[0]==='~'){S.cwd=CFG.get('desktopRoot')+'/桌面';prompt();return;}
        const p=resolve(a[0]);
        return fs.stat(p).then(st=>{
          if(st.kind!=='dir')throw new Error('非棺匣');
          S.cwd=p;prompt();
        }).catch(e=>w('<span class="er">去不得：'+esc(e.message)+'</span>'));
      },
      pwd:()=>w(esc(S.cwd)),
      cat:async a=>{
        if(!a[0])return w('<span class="er">cat 需檔名</span>');
        const t=await fs.readFile(resolve(a[0]),'text');
        w('<span class="dim">── '+esc(a[0])+' ──</span>');
        w(esc(t)||'<span class="dim">（空紙）</span>');
      },
      mkdir:async a=>{if(!a[0])return w('<span class="er">需名</span>');await fs.mkdirp(resolve(a[0]));w('<span class="ok">已置棺 '+esc(a[0])+'</span>');Bus.emit('fs',S.cwd);},
      touch:async a=>{if(!a[0])return w('<span class="er">需名</span>');const p=await fs.unique(S.cwd,a[0]);await fs.writeFile(p,'');w('<span class="ok">已落紙 '+esc(p)+'</span>');Bus.emit('fs',S.cwd);},
      rm:async a=>{
        const rec=a.indexOf('-r')>=0;
        const names=a.filter(x=>x!=='-r');
        if(!names.length)return w('<span class="er">rm 需名（資料夾加 -r）</span>');
        for(const n of names){
          try{await fs.remove(resolve(n),rec);w('<span class="ok">已焚 '+esc(n)+'</span>');}
          catch(e){w('<span class="er">焚不掉 '+esc(n)+'：'+esc(e.message)+'</span>');}
        }
        Bus.emit('fs',S.cwd);Desktop.refresh();
      },

    function resolve(p){
      if(!p)return S.cwd;
      if(p==='.')return S.cwd;
      if(p==='..')return P.dir(S.cwd);
      if(p==='~')return CFG.get('desktopRoot')+'/桌面';
      if(p.charAt(0)==='/')return P.norm(p);
      return P.norm(S.cwd+'/'+p);
    }
    async function run(line){
      w('<span class="tm-ps" style="color:var(--cin)">'+esc(ps.textContent)+'</span> '+esc(line));
      const parts=line.trim().split(/\s+/);
      const cmd=parts.shift();
      if(!cmd)return;
      S.hist.push(line);S.hi=S.hist.length;
      if(!CMDS[cmd]){
        /* 允許直接以路徑開啟 */
        if(await fs.exists(resolve(cmd))){await Sys.open(resolve(cmd));return w('<span class="ok">已召 '+esc(cmd)+'</span>');}
        return w('<span class="er">乩筆不識「'+esc(cmd)+'」· 輸入 help 見咒語表</span>');
      }
      S.busy=true;
      try{await CMDS[cmd](parts);}
      catch(e){w('<span class="er">'+esc(e.message||String(e))+'</span>');}
      S.busy=false;
      out.scrollTop=out.scrollHeight;
    }
    inp.addEventListener('keydown',async e=>{
      e.stopPropagation();
      if(e.key==='Enter'){
        const v=inp.value;inp.value='';
        await run(v);
      }else if(e.key==='ArrowUp'){
        e.preventDefault();
        if(S.hi>0){S.hi--;inp.value=S.hist[S.hi]||'';}
      }else if(e.key==='ArrowDown'){
        e.preventDefault();
        if(S.hi<S.hist.length-1){S.hi++;inp.value=S.hist[S.hi]||'';}
        else{S.hi=S.hist.length;inp.value='';}
      }else if(e.key==='Tab'){
        e.preventDefault();
        const v=inp.value;
        const parts=v.split(/\s+/);
        const lastP=parts[parts.length-1];
        try{
          const kids=await fs.readdir(P.dir(resolve(lastP||'.'))||S.cwd);
          const base=P.base(resolve(lastP||'.'));
          const m=kids.filter(k=>k.name.toLowerCase().indexOf(String(lastP||'').split('/').pop().toLowerCase())===0);
          if(m.length===1){parts[parts.length-1]=(lastP.indexOf('/')>=0?lastP.slice(0,lastP.lastIndexOf('/')+1):'')+m[0].name+(m[0].kind==='dir'?'/':' ');inp.value=parts.join(' ');}
          else if(m.length>1){w('<span class="dim">'+m.map(x=>esc(x.name)).join('  ')+'</span>');}
        }catch(err){}
      }else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.innerHTML='';}
    });
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');
      if(b){
        if(b.dataset.a==='clear')out.innerHTML='';
        if(b.dataset.a==='help')CMDS.help();
        if(b.dataset.a==='neofetch')CMDS.neofetch();
      }
      if(!e.target.closest('.abar'))inp.focus();
    });
    setTimeout(()=>inp.focus(),120);
    return {destroy(){},reuse(){inp.focus();}};
  }
};

/* JSZip 把 DOS 時間以 Date.UTC 解析 → 轉回本地牆鐘時間，修正時區偏差 */
function fixZipDate(d){
  if(!d||isNaN(d))return new Date();
  return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds());
}

/* tar / tar.gz 原生解析（無依賴） */
async function gunzip(blob){
  if(!window.DecompressionStream)throw new Error('此瀏覽器無 DecompressionStream');
  const ds=new DecompressionStream('gzip');
  const stream=blob.stream().pipeThrough(ds);
  return await new Response(stream).blob();
}
async function parseTar(blob){
  const buf=new Uint8Array(await blob.arrayBuffer());
  const out=[];
  let off=0,longName=null;
  const rd=(start,len)=>{let s='';for(let i=0;i<len;i++){const c=buf[start+i];if(!c)break;s+=String.fromCharCode(c);}return s.trim();};
  const oct=(start,len)=>{const s=rd(start,len);return s?parseInt(s,8)||0:0;};
  while(off+512<=buf.length){
    const name=rd(off,100);
    if(!name){off+=512;continue;}
    const size=oct(off+124,12);
    const mtime=oct(off+136,12)*1000;
    const type=String.fromCharCode(buf[off+156]||0x30);
    const prefix=rd(off+345,155);
    let full=prefix?prefix+'/'+name:name;
    if(type==='L'){longName=rd(off+512,size);off+=512+Math.ceil(size/512)*512;continue;}
    if(longName){full=longName;longName=null;}
    if(type==='0'||type==='\0'||type==='7'){
      out.push({name:full.replace(/^\.\//,''),kind:'file',size,mtime,data:buf.slice(off+512,off+512+size)});
    }else if(type==='5'){
      out.push({name:full.replace(/^\.\//,'').replace(/\/$/,''),kind:'dir',size:0,mtime});
    }
    off+=512+Math.ceil(size/512)*512;
  }
  return out;
}

        '<button class="abtn" data-a="export">'+ICO.download+'<span>導出此封</span></button>'+
        '<div style="flex:1"></div>'+
        '<span class="tag" data-st>未开封</span>'+
      '</div>'+
      '<div class="ar-list"></div>'+
      '<div class="ar-prog">未开封 · 支援 .zip（JSZip）、.tar / .tar.gz / .tgz（原生解析）、.gz（DecompressionStream）、.7z（7z-wasm，首次使用才載入）</div>'+
    '</div>';
    const root=ctx.body.querySelector('.ar');
    const list=root.querySelector('.ar-list');
    const prog=root.querySelector('.ar-prog');
    const st=root.querySelector('[data-st]');
    function busy(msg){prog.innerHTML='<span class="pulse" style="display:inline-block;margin-right:8px"></span>'+esc(msg);st.textContent='動作中';}
    function done(msg){prog.textContent=msg;st.textContent='已解封';}
    async function loadArchive(path){
      S.path=path;S.entries=[];list.innerHTML='';
      ctx.setTitle(P.base(path),'SEALER');
      const ext=P.ext(path);
      busy('开封中 · '+P.base(path));
      try{
        if(ext==='zip'){
          const JSZip=await Lazy.jszip();
          const blob=await fs.readFile(path,'blob');
          S.zip=await JSZip.loadAsync(blob);
          S.kind='zip';
          S.zip.forEach((rel,f)=>{
            if(rel==='_lt_')return;
            S.entries.push({name:rel,kind:f.dir?'dir':'file',size:f.dir?0:(f._data&&f._data.uncompressedSize)||0,mtime:fixZipDate(f.date),ref:f});
          });
        }else if(ext==='tar'){
          S.kind='tar';
          const blob=await fs.readFile(path,'blob');
          S.entries=await parseTar(blob);
        }else if(ext==='gz'||ext==='tgz'){
          const blob=await fs.readFile(path,'blob');
          const inner=await gunzip(blob);
          if(ext==='tgz'||isTar(inner)){
            S.kind='tar.gz';
            S.entries=await parseTar(inner);
          }else{
            S.kind='gz';
            const name=path.replace(/\.gz$/i,'');
            S.entries=[{name:P.base(name),kind:'file',size:inner.size,mtime:(await fs.stat(path)).mtime,data:inner}];
          }
        }else if(ext==='7z'){
          S.kind='7z';
          busy('載入 7z-wasm 引擎…');
          const SevenZip=await Lazy.sevenzip();
          const s7=new SevenZip();
          await s7.ready;
          const buf=new Uint8Array(await fs.readFile(path,'buffer'));
          s7.FS.writeFile('/in.7z',buf);
          const r=s7.callArray(['x','-y','-o/out','/in.7z']);
          if(r.status!==0)throw new Error('7z 解壓失敗（'+r.status+'）');
          const walkDir=(d,pre)=>{
            for(const n of s7.FS.readdir(d)){
              if(n==='.'||n==='..')continue;
              const p=d+'/'+n;
              const s7st=s7.FS.stat(p);
              if(s7.FS.isDir(s7st.mode)){walkDir(p,pre+n+'/');}
              else S.entries.push({name:pre+n,kind:'file',size:s7st.size,mtime:s7st.mtime*1000,data:s7.FS.readFile(p)});
            }
          };
          walkDir('/out','');
        }else{
          throw new Error('此封不识（.'+ext+'）');
        }
        S.entries.sort((a,b)=>natcmp(a.name,b.name));
        render();
        done('已开封 · '+S.entries.length+' 項 · '+S.kind.toUpperCase()+' · '+fmtSize(S.entries.reduce((a,e)=>a+(e.size||0),0))+'（未壓縮）');
      }catch(e){
        list.innerHTML='<div class="empty">'+ICO.warn+'<p>封不開</p><div style="font-size:11.5px;max-width:80%">'+esc(e.message||String(e))+'</div></div>';
        prog.textContent='失敗：'+(e.message||e);
        st.textContent='失敗';
      }
    }
    function isTar(b){return b.size>262;} /* 粗略判定，parseTar 自會失敗 */
    function render(){
      list.innerHTML='';
      if(!S.entries.length){list.innerHTML='<div class="empty">'+ICO.openBox+'<p>此封為空</p></div>';return;}
      S.entries.forEach((e,i)=>{
        const n=el('div',{class:'ar-i mq-item'});
        n.dataset.i=i;n.dataset.path=e.name;n.dataset.kind=e.kind;
        n.innerHTML=ICO[fileIco(e.name,e.kind==='dir')]+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.name)+'</span>'+
          '<span class="dt">'+(e.mtime?fmtDate(e.mtime):'—')+'</span><span class="sz">'+(e.kind==='dir'?'—':fmtSize(e.size))+'</span>';
        n.onclick=ev=>{
          if(ev.ctrlKey||ev.metaKey)n.classList.toggle('sel');
          else{$$('.ar-i',list).forEach(x=>x.classList.remove('sel'));n.classList.add('sel');}
        };
        n.ondblclick=async()=>{
          if(e.kind==='dir')return;
          try{
            const b=await entryBlob(e);
            const tmp=P.dir(S.path)+'/_解封/'+e.name;
            await fs.mkdirp(P.dir(tmp));
            await fs.writeFile(tmp,new Blob([b]),{mtime:e.mtime||Date.now()});
            Toast.ok('已取出',tmp);
            Sys.open(tmp);
          }catch(err){Toast.err('取不出',err.message||String(err));}
        };
        list.appendChild(n);
      });
    }
    async function entryBlob(e){
      if(e.kind==='zip'||S.kind==='zip')return await e.ref.async('blob');
      if(e.data instanceof Blob)return e.data;
      if(e.data)return new Blob([e.data]);
      throw new Error('無資料');
    }
    async function extract(sel){
      if(!S.entries.length)return Toast.info('封中無物','');
      const dest=await fs.unique(P.dir(S.path),P.base(S.path).replace(/\.(zip|tar|gz|tgz|7z)$/i,'')+'·解封');
      await fs.mkdirp(dest);
      let n=0,fail=0;
      const items=sel?S.entries.filter((e,i)=>{
        const node=list.querySelector('[data-i="'+i+'"]');
        return node&&node.classList.contains('sel');
      }):S.entries;
      for(let i=0;i<items.length;i++){
        const e=items[i];
        busy('解封中 '+Math.round((i+1)/items.length*100)+'% · '+e.name);
        try{
          const p=P.norm(dest+'/'+e.name);
          if(e.kind==='dir'){await fs.mkdirp(p);Meta.set(p,{k:'dir',mt:e.mtime||Date.now(),bt:e.mtime||Date.now()});}
          else{
            const b=await entryBlob(e);
            await fs.mkdirp(P.dir(p));
            /* 保留封內原始修改時間 */
            await fs.writeFile(p,b,{mtime:e.mtime||Date.now()});
          }
          n++;
        }catch(err){fail++;console.warn(err);}
      }
      done('已解封 '+n+' 項 → '+dest+(fail?' · '+fail+' 項失敗':''));
      Toast.ok('解封完成',n+' 項落入 '+P.base(dest));
      Bus.emit('fs',P.dir(S.path));Desktop.refresh();
    }
    async function make(paths){
      if(!paths||!paths.length)paths=[S.cwd||Desktop.path()];
      try{
        const JSZip=await Lazy.jszip();
        const zip=new JSZip();
        let n=0;
        for(const p of paths){
          const st=await fs.stat(p);
          if(st.kind==='dir'){
            const walk=async(dir,base)=>{
              const kids=await fs.readdir(dir);
              for(const k of kids){
                if(k.kind==='dir'){zip.folder(base+k.name);await walk(k.path,base+k.name+'/');}
                else{
                  const b=await fs.readFile(k.path,'blob');
                  zip.file(base+k.name,b,{date:new Date(k.mtime||Date.now())});
                  n++;
                  busy('殮封中 · '+n+' 紙 · '+k.name);
                }
              }
            };
            zip.folder(st.name);
            await walk(p,st.name+'/');
          }else{
            const b=await fs.readFile(p,'blob');
            zip.file(st.name,b,{date:new Date(st.mtime||Date.now())});
            n++;
          }
        }
        const name=await Dlg.prompt('殮封','此封命名',P.base(paths[0])+'.zip');
        if(!name)return;
        const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
        const target=await fs.unique(P.dir(paths[0]),name.endsWith('.zip')?name:name+'.zip');
        await fs.writeFile(target,out);
        done('已殮封 '+n+' 紙 → '+target+'（'+fmtSize(out.size)+'）');
        Toast.ok('已殮封',P.base(target));
        Bus.emit('fs',P.dir(target));Desktop.refresh();
      }catch(e){
        prog.textContent='殮封失敗：'+(e.message||e);
        Toast.err('封不上',e.message||String(e));
      }
    }
    root.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='open'){
        const p=await Dlg.prompt('開啟殮封','輸入 .zip / .tar / .gz / .7z 路徑',S.path||CFG.get('desktopRoot')+'/殮封/');
        if(p&&p.slice(-1)!=='/')loadArchive(p);
        else if(p)WM.open('explorer',{path:p});
      }
      else if(a==='extract')extract(false);
      else if(a==='extractSel')extract(true);
      else if(a==='make')make(S.paths.length?S.paths:[P.dir(S.path)||Desktop.path()]);
      else if(a==='export')S.path&&Sys.download(S.path);
    });
    list.addEventListener('contextmenu',e=>{
      const n=e.target.closest('.ar-i');
      e.preventDefault();
      Menu.show(e.clientX,e.clientY,n?[
        {label:'取出至同目錄',ico:'download',act:async()=>{
          const i=+n.dataset.i;const ent=S.entries[i];
          const b=await entryBlob(ent);
          const tmp=await fs.unique(P.dir(S.path),ent.name);
          await fs.writeFile(tmp,new Blob([b]),{mtime:ent.mtime||Date.now()});
          Toast.ok('已取出',tmp);Bus.emit('fs',P.dir(S.path));
        }},
        {label:'開啟',ico:'openBox',act:()=>n.dispatchEvent(new MouseEvent('dblclick'))},
        {label:'導出到陽世',ico:'download',act:async()=>{
          const i=+n.dataset.i;const ent=S.entries[i];
          const b=await entryBlob(ent);
          Sys.saveBlob(new Blob([b]),P.base(ent.name));
        }}
      ]:[
        {label:'全部解封',ico:'download',act:()=>extract(false)},
        {label:'開啟殮封…',ico:'openBox',act:()=>root.querySelector('[data-a="open"]').click()}
      ]);
    });
    if(args.path)loadArchive(args.path);
    else if(args.paths&&args.paths.length){S.paths=args.paths;st.textContent='待殮封';prog.textContent='已選 '+args.paths.length+' 項，按「殮封選中／此匣」成封';}
    return {destroy(){S.zip=null;S.entries=[];},reuse(a){if(a&&a.path)loadArchive(a.path);}};
  }
};

Apps.v86={
  id:'v86',name:'附體',en:'Vessel',icon:'aVm',w:880,h:640,minW:360,minH:320,

  desc:'以 v86 於靈堂內開機：.iso / .img / .fd（僅限殮庫內的鏡像）',
  mount(ctx,args){
    args=args||{};
    const S={emu:null,locked:false,url:null};
    ctx.body.innerHTML='<div class="v86">'+
      '<div class="v86-bar">'+
        '<button class="abtn" data-a="pick">'+ICO.fdisc+'<span>選鏡像</span></button>'+
        '<select class="asel" data-a="imgs"><option value="">— 殮庫中的鏡像 —</option></select>'+

        '<div class="asep"></div>'+
        '<button class="abtn" data-a="lock">'+ICO.eye+'<span>鎖定滑鼠</span></button>'+
        '<button class="abtn" data-a="fs">'+ICO.fsOn+'<span>全屏</span></button>'+
        '<div style="flex:1"></div><span class="tag" data-st>未附體</span>'+
      '</div>'+
      '<div class="sc" id="screen_container">'+
        '<div style="white-space:pre;font:14px \'DejaVu Sans Mono\',monospace;color:#ccc"></div>'+
        '<canvas style="display:none"></canvas>'+
        '<div class="busy" data-hint style="background:rgba(6,5,4,.9)"><div class="in">'+ICO.fdisc+
          '<p>揀一面鏡像，方可附體</p>'+
          '<div style="font-size:11px;color:var(--bone-3);max-width:420px;text-align:center;line-height:1.9;font-family:var(--f-body)">'+
          '鏡像必須先存於殮庫或紙庫（.iso / .img / .fd / .bin）。本器不會自網上下載鏡像 —— 那是黑屏之源。</div></div></div>'+
      '</div>'+
    '</div>';
    const root=ctx.body.querySelector('.v86');
    const sc=root.querySelector('.sc');
    const stEl=root.querySelector('[data-st]');
    const hint=root.querySelector('[data-hint]');
    const sel=root.querySelector('[data-a="imgs"]');
    async function scanImages(){
      sel.innerHTML='<option value="">— 殮庫中的鏡像 —</option>';
      try{
        const res=await fs.search('',{limit:2000});
        const discs=res.filter(r=>r.kind==='file'&&['iso','img','fd','bin','raw','flp','vhd'].indexOf(P.ext(r.name))>=0);
        discs.forEach(d=>{
          const o=el('option',{value:d.path,text:d.name+'（'+fmtSize(d.size)+'）'});
          sel.appendChild(o);
        });
        if(!discs.length){
          const o=el('option',{value:'',text:'（殮庫中無鏡像，請先導入）',disabled:true});
          sel.appendChild(o);
        }
      }catch(e){}
    }
    async function boot(path){
      if(!path)return Toast.info('未揀鏡像','');
      hint.style.display='grid';
      hint.querySelector('p').textContent='召 v86 中…';
      stEl.textContent='載入引擎';
      let V86;
      try{V86=await Lazy.v86();}
      catch(e){
        hint.querySelector('p').textContent='v86 載入失敗';
        stEl.textContent='失敗';
        return Toast.err('附體失敗','libv86 無法自 CDN 取得：'+(e.message||e));
      }
      let buf;
      try{
        hint.querySelector('p').textContent='讀鏡像中…';
        buf=await fs.readFile(path,'buffer');
      }catch(e){
        hint.querySelector('p').textContent='鏡像讀不出';
        return Toast.err('附體失敗',e.message||String(e));
      }
      const ext=P.ext(path);
      const opt={
        wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
        memory_size:64*1024*1024,
        vga_memory_size:8*1024*1024,
        screen_container:sc,
        bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
        vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
        autostart:true,
        disable_speaker:true
      };
      /* 依副檔名正確掛載 */
      if(ext==='iso')opt.cdrom={buffer:buf};
      else if(['img','fd','bin','flp'].indexOf(ext)>=0)opt.fda={buffer:buf};
      else opt.hda={buffer:buf};
      hint.querySelector('p').textContent='附體中…';
      try{
        if(S.emu){try{S.emu.destroy();}catch(e){}}
        S.emu=new V86(opt);
        S.emu.add_listener('emulator-ready',()=>{
          hint.style.display='none';
          stEl.textContent='已附體';
          const cv=sc.querySelector('canvas');
          if(cv)cv.style.display='';
        });
        S.emu.add_listener('emulator-stopped',()=>{stEl.textContent='已離體';});
        ctx.setTitle(P.base(path),'VESSEL');
      }catch(e){
        hint.querySelector('p').textContent='附體失敗：'+(e.message||e);
        Toast.err('附體失敗',e.message||String(e));
      }
    }
    /* 滑鼠鎖定 */
    function lock(){
      if(!S.emu)return Toast.info('尚未附體','');
      const cv=sc.querySelector('canvas')||sc;
      if(document.pointerLockElement){document.exitPointerLock();return;}
      const p=cv.requestPointerLock&&cv.requestPointerLock();
      if(p&&p.catch)p.catch(()=>Toast.err('鎖不住','瀏覽器拒絕指標鎖定，請先點擊畫面一次'));
      S.locked=true;
      stEl.textContent='已附體 · 滑鼠已鎖（Esc 解）';
      Toast.info('滑鼠已鎖','移動即操縱機內指標 · 按 Esc 或再點「鎖定滑鼠」解鎖');
    }
    document.addEventListener('pointerlockchange',()=>{
      if(!document.pointerLockElement&&S.locked){S.locked=false;if(S.emu)stEl.textContent='已附體';}
    });
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='pick'){
        const inp=$('#filePicker');inp.value='';inp.multiple=false;inp.accept='.iso,.img,.fd,.bin,.raw';
        inp.onchange=async()=>{
          const f=inp.files[0];if(!f)return;
          const dir=CFG.get('desktopRoot')+'/鏡像';
          await fs.mkdirp(dir);
          const p=await fs.unique(dir,f.name);
          busyToast('存入鏡像',f.name);
          await fs.writeFile(p,f,{mtime:f.lastModified||Date.now()});
          Toast.ok('已入庫',p);
          await scanImages();sel.value=p;
          inp.accept='';
        };
        inp.click();
      }
      else if(a==='boot'){const p=sel.value;if(p)boot(p);else Toast.info('未揀鏡像','先自殮庫選一面鏡像，或按「選鏡像」導入');}
      else if(a==='stop'){if(S.emu){S.emu.stop();stEl.textContent='已離體';}}
      else if(a==='reset'){if(S.emu){S.emu.restart();stEl.textContent='已重啟';}}
      else if(a==='lock')lock();
      else if(a==='fs')ctx.fullscreen();
    });
    function busyToast(t,m){Toast.show(t,m,'',2200);}
    sc.addEventListener('click',()=>{if(S.emu&&!S.locked&&SMALL()===false){}});
    scanImages();
    if(args.path)setTimeout(()=>{sel.value=args.path;boot(args.path);},300);
    return {
      destroy(){
        try{if(S.emu){S.emu.stop();S.emu.destroy();}}catch(e){}
        S.emu=null;
        if(document.pointerLockElement)document.exitPointerLock();
      }
    };
  }
};

    async function renderViz(){
      const box=main.querySelector('#viz');
      if(!box)return;
      let u;
      try{u=await fs.usage();}catch(e){box.innerHTML='<div style="color:var(--cin-hi);font-size:12px">量不出：'+esc(e.message||e)+'</div>';return;}
      const q=u.quota||Math.max(u.usage*2,1024*1024*64);
      const po=u.opfs.bytes/q*100,pi=u.idb.bytes/q*100,pu=Math.max(0,(u.usage-u.opfs.bytes-u.idb.bytes)/q*100);
      let h='<div class="store-viz"><h4>瀏覽器配額 <span class="tag '+(u.persisted?'opfs':'local')+'">'+(u.persisted?'已獲持久化':'未持久化')+'</span></h4>'+
        '<div class="bigbar"><i style="width:'+po.toFixed(3)+'%;background:var(--jade)"></i><i style="width:'+pi.toFixed(3)+'%;background:var(--gold)"></i><i style="width:'+pu.toFixed(3)+'%;background:var(--bone-3);opacity:.5"></i></div>'+
        '<div class="bar-leg"><span><em style="background:var(--jade)"></em>殮庫 OPFS '+fmtSize(u.opfs.bytes)+'</span>'+
        '<span><em style="background:var(--gold)"></em>紙庫 IndexedDB '+fmtSize(u.idb.bytes)+'</span>'+
        '<span><em style="background:var(--bone-3)"></em>其他（快取等） '+fmtSize(Math.max(0,u.usage-u.opfs.bytes-u.idb.bytes))+'</span>'+
        '<span style="margin-left:auto">可用 '+fmtSize(Math.max(0,q-u.usage))+' / '+fmtSize(q)+'</span></div>'+
        '<table class="tbl"><tbody>'+
        '<tr><td>殮庫檔案 / 資料夾</td><td class="n">'+u.opfs.files+' / '+u.opfs.dirs+'</td></tr>'+
        '<tr><td>紙庫檔案 / 資料夾</td><td class="n">'+u.idb.files+' / '+u.idb.dirs+'</td></tr>'+
        '<tr><td>陽世掛載</td><td class="n">'+u.local.mounts+' 處</td></tr>'+
        '<tr><td>中繼資料（Meta）</td><td class="n">'+Meta.m.size+' 條</td></tr>'+
        '<tr><td>鍵值庫模式</td><td class="n">'+esc(KV.mode)+'</td></tr>'+
        '</tbody></table></div>';
      /* 各庫頂層佔用排行 */
      h+='<div class="store-viz"><h4>各匣佔用 · 實算</h4><div id="brk" style="font-size:12px;color:var(--bone-3);font-family:var(--f-mono)">推算中…</div></div>';
      box.innerHTML=h;
      const brk=main.querySelector('#brk');
      try{
        const rows=[];
        for(const s of ['opfs','idb']){
          if(!fs.backends[s])continue;
          const kids=await fs.readdir('/'+s);
          for(const k of kids){
            if(k.kind!=='dir')continue;
            const b=await fs.du(k.path);
            rows.push({name:(storeInfo(s).zh)+' / '+k.name,bytes:b,files:0,path:k.path});
          }
        }
        rows.sort((a,b)=>b.bytes-a.bytes);
        const max=rows.length?rows[0].bytes||1:1;
        brk.innerHTML=rows.length?('<table class="tbl"><thead><tr><th>匣</th><th style="width:38%">佔用</th><th style="text-align:right">實量</th></tr></thead><tbody>'+
          rows.slice(0,18).map(r=>'<tr><td>'+esc(r.name)+'</td><td><div style="height:7px;border-radius:4px;background:var(--ink);overflow:hidden"><i style="display:block;height:100%;width:'+Math.max(1,r.bytes/max*100)+'%;background:linear-gradient(90deg,var(--cin-deep),var(--cin))"></i></div></td><td class="n">'+fmtSize(r.bytes)+'</td></tr>').join('')+
          '</tbody></table>'):'<span style="color:var(--bone-3)">兩庫皆空。</span>';
      }catch(e){brk.textContent='算不出：'+(e.message||e);}
    }

    /* ---------- 事件 ---------- */
    function wire(){
      $$('[data-sw]',main).forEach(n=>n.onclick=()=>{
        const k=n.dataset.sw;
        CFG.set(k,!CFG.get(k));
        n.classList.toggle('on',CFG.get(k));
        afterChange(k);
      });
      $$('[data-seg]',main).forEach(seg=>{
        $$('button',seg).forEach(b=>b.onclick=()=>{
          if(b.disabled)return;
          $$('button',seg).forEach(x=>x.classList.remove('on'));
          b.classList.add('on');
          CFG.set(seg.dataset.seg,b.dataset.v);
          afterChange(seg.dataset.seg);
        });
      });
      $$('[data-swatches]',main).forEach(g=>{
        $$('.swatch',g).forEach(s=>s.onclick=()=>{
          $$('.swatch',g).forEach(x=>x.classList.remove('on'));
          s.classList.add('on');
          CFG.set(g.dataset.swatches,s.dataset.v);
          afterChange('accent');
        });
      });
      $$('[data-range]',main).forEach(r=>r.oninput=()=>{
        CFG.d[r.dataset.range]=+r.value;CFG.save();afterChange(r.dataset.range);
        const lab=r.closest('.st-row').querySelector('.lb span');
        if(lab)lab.textContent=lab.textContent.replace(/\d+(\.\d+)?px/,r.value+'px');
      });
      $$('[data-sel]',main).forEach(s=>s.onchange=()=>{CFG.set(s.dataset.sel,s.value);afterChange(s.dataset.sel);});
      $$('[data-inp]',main).forEach(i=>i.onchange=()=>{CFG.set(i.dataset.inp,i.value);afterChange(i.dataset.inp);});
      $$('[data-wall]',main).forEach(w=>w.onclick=async()=>{
        if(w.dataset.upload){await Sys.pickWallpaper();show('look');return;}
        CFG.set('wallpaper',w.dataset.wall);
        await Wallpaper.apply();
        $$('[data-wall]',main).forEach(x=>x.classList.remove('on'));
        w.classList.add('on');
      });
      $$('[data-hideapp]',main).forEach(c=>c.onclick=()=>{
        const k=c.dataset.hideapp;
        const list=CFG.get('hideApps',[]);
        const i=list.indexOf(k);
        if(i>=0)list.splice(i,1);else list.push(k);
        CFG.set('hideApps',list);
        c.classList.toggle('on',i<0);
        StartMenu.renderApps('');
      });
      $$('[data-defapp]',main).forEach(s=>s.onchange=()=>{
        const da=CFG.get('defaultApp',{});da[s.dataset.defapp]=s.value;CFG.set('defaultApp',da);
      });
      $$('[data-act]',main).forEach(b=>b.onclick=async()=>{
        const a=b.dataset.act;
        if(a==='arrange'){Desktop.autoArrange();Toast.ok('已排列','牌位各就各位');}
        else if(a==='mount'){await Sys.mountLocal();show('vault');}
        else if(a==='unmount'){await fs.unmountLocal(b.dataset.m);show('vault');Toast.ok('已卸載',b.dataset.m);}
        else if(a==='openm'){WM.open('explorer',{path:'/local/'+b.dataset.m});}
        else if(a==='perm'){
          const r=await LocalBE.askPerm(b.dataset.m);
          Toast[r==='granted'?'ok':'err']('權限',r==='granted'?b.dataset.m+' 已重新准許':'未獲准（'+r+'）');
          show('vault');
        }
        else if(a==='persist'){
          try{const ok=await navigator.storage.persist();Toast[ok?'ok':'err']('持久化',ok?'已獲准，殮庫不易被清':'瀏覽器未准許');show('vault');}
          catch(e){Toast.err('持久化',e.message);}
        }
        else if(a==='clearthumb'){Thumb.clear();Toast.ok('已清空','縮圖快取盡釋');show(CFG._last||'vault');}
        else if(a==='resetapp'){const da=CFG.get('defaultApp',{});delete da[b.dataset.e];CFG.set('defaultApp',da);show('tools');}
        else if(a==='resetcols'){CFG.set('feCols',null);Toast.ok('已還原','列寬列序回復原狀');show('tools');}
        else if(a==='expcfg'){Sys.saveBlob(new Blob([JSON.stringify(CFG.d,null,2)],{type:'application/json'}),'殮堂壇規.json');}
        else if(a==='closeall'){WM.closeAll();}
        else if(a==='resetvigil'){CFG.set('firstBoot',Date.now());CFG.set('boots',0);Toast.ok('重數','值夜自今夜起算');show('clock');}
        else if(a==='reset'){Sys.reset();}
      });
    }
    function afterChange(k){
      if(k==='motion'||k==='theme'||k==='accent'||k==='radius'||k==='fontSize'||k==='dock'||k==='iconSize')CFG.apply();
      if(k==='desktopRoot'||k==='showExt'||k==='iconSize'||k==='thumbOn'||k==='showHidden'){Desktop.refresh();}
      if(k==='backend'){
        (async()=>{
          const p=CFG.get('desktopRoot');
          if(!await fs.exists(p+'/桌面')){await seedStore(p);Desktop.refresh();}
          else Desktop.refresh();
        })();
      }
    }
    show('look');
    ctx.setTitle('壇規','RITES');
    return {destroy(){},reuse(){}};
  }
};

/* ---------- 初始建庫 ---------- */
async function seedStore(root){
  const dirs=['桌面','文牘','圖影','音聲','影片','殮封','鏡像','壇內','壇內/壁紙'];
  for(const d of dirs){try{await fs.mkdirp(root+'/'+d);}catch(e){}}
  const D=root+'/桌面';
  const day=Math.max(1,Math.floor((Date.now()-(CFG.get('firstBoot')||Date.now()))/86400000)+1);
  const files=[
    [D+'/第七夜.txt',
'第七夜 · 守夜人手記\n────────────────────────\n\n第六夜我發現桌面多了一個我沒有建的匣。\n名字叫「第七夜」。\n\n裡面只有一張紙。修改時間是明天。\n\n我把它刪了。\n今天早上它又在，而且裡面多了第二張紙 ——\n第一張的內容，和我昨晚夢裡念的一模一樣。\n\n────────────────────────\n規則：\n  一、燈要留一盞。\n  二、門要留一縫。\n  三、名字不要念完。\n  四、修改時間不許丟。\n\n第四條最要緊。\n前任就是弄丟了一個檔案的修改時間，\n於是那個檔案開始記得他自己都不記得的事。\n\n若你在殮庫裡看見某個檔案的「修改於」早於「初生於」，\n別存檔。闔上窗。去睡。\n\n                                —— 值夜第 '+day+' 夜\n'],
    [D+'/守夜須知.md',Sys.MD_SEED],
    [D+'/亡者名冊.csv',Sys.CSV_SEED],
    [D+'/示範符.html',Sys.HTML_SEED],
    [root+'/文牘/交接信.txt',
'給下一位守夜人：\n\n三座庫房你要認得 ——\n\n  殮庫（OPFS）  瀏覽器私有檔案系統。大容量、持久、看不見。\n  紙庫（IndexedDB）  結構化克隆。可存 Blob，可存陽世句柄。\n  陽世（掛載）  你自己電腦上的真資料夾。刷新後要重新准許。\n\n檔案在兩庫之間可以搬。搬的時候，修改時間不會丟 ——\n這是殮堂唯一保證的事。\n\n拖曳是雙向的：\n  從靈堂拖到陽世 → 下載。\n  從陽世拖進靈堂 → 入庫（資料夾會遞迴讀完，每次一百條，讀到空為止）。\n\n手機上沒有拖出浏览器這回事，所以每個檔案都有「導出」按鈕。\n\n別在半夜念檔案的全名。\n']
  ];
  for(const [p,c] of files){
    try{if(!await fs.exists(p))await fs.writeFile(p,c);}catch(e){}
  }
}

/* ---------- 異象 ---------- */
function omenLoop(){
  if(!CFG.get('omen',true))return;
  const next=180000+Math.random()*420000;
  setTimeout(()=>{
    if(CFG.get('omen',true)&&document.visibilityState==='visible'){
      const o=$('#omen');
      o.classList.remove('on');void o.offsetWidth;o.classList.add('on');
      const c=$('#clock');
      c.classList.add('omen');setTimeout(()=>c.classList.remove('omen'),700);
      if(Math.random()<0.3){
        const whispers=['別回頭。','第七夜快到了。','你數過幾張紙了？','有個檔案的修改時間是明天。','燈要留一盞。','有人在翻檢閣裡翻你。','名字不要念完。'];
        Toast.show('',whispers[Math.floor(Math.random()*whispers.length)],'',2600);
      }
    }
    omenLoop();
  },next);
}

/* ---------- 開機 ---------- */
(async function boot(){
  const t0=performance.now();
  try{await KV.init();}catch(e){}
  try{await CFG.load();}catch(e){CFG.d=Object.assign({},DEFAULTS);}
  CFG.apply();
  /* 應用敘述 */
  const DESC={explorer:'三庫巡視。詳細／清單／圖標／分欄四視，列寬列序可調，框選、拖曳、搜索、實算容量。',
    notepad:'疏文與帳冊。自動保存不失一字，CSV/TSV 可切表格與原文雙視。',
    editor:'CodeMirror 内核。多語言、即時預覽、格式化、查找替換、可拖分割、輸入模式可換。',
    viewer:'單張檢視與條漫連環。自然排序、並行讀取、高度補償不跳動、全屏只留退出鈕。',
    media:'音訊與影片。同匣成列，可續播、可拖軸、可導出。',
    browser:'地址欄、多籤、iframe。可窺殮庫內的 .html，亦可窺肯被窺的陽世頁面。',
    calc:'四則、百分比、正負、歷史。可用鍵盤。',
    paint:'毛筆、抹、線、框、圓、填色。可存為 PNG 入殮庫。',
    terminal:'ls / cd / cat / mkdir / rm / mv / cp / find / du / tree / mount / store / usage / neofetch…',
    settings:'陰陽、朱色、圓角、壁紙、香案、庫房、儲量視覺化、陽世掛載、接引之法、焚堂。',
    archive:'解封 .zip / .tar / .gz / .tgz / .7z，或把棺匣殮封成 zip。修改時間全程保留。',
    v86:'v86 於靈堂內開機：.iso / .img / .fd。支援滑鼠鎖定與全屏。',
    about:'殮堂的由來、規則、第七夜手記。'};
  Object.keys(Apps).forEach(k=>{if(!Apps[k].desc)Apps[k].desc=DESC[k]||'';});
  Apps.htmlgate.hidden=true;
  /* 檔案系統 */
  try{await fs.init();}
  catch(e){console.error(e);Toast.err('殮庫不開',e.message||String(e));}
  const status=[];
  STORES.forEach(s=>status.push(s.zh+' '+(fs.backends[s.key]?'✓':'✗')));
  /* 首航 */
  const first=!CFG.get('firstBoot');
  if(first){
    CFG.set('firstBoot',Date.now());
    CFG.set('boots',1);
  }else CFG.set('boots',CFG.get('boots',0)+1);
  let root=CFG.get('desktopRoot','/opfs');
  if(!fs.backends[root.slice(1)])root=fs.backends.opfs?'/opfs':'/idb';
  if(root!==CFG.get('desktopRoot'))CFG.set('desktopRoot',root);
  if(!CFG.get('backend')||!fs.backends[CFG.get('backend')])CFG.set('backend',root.slice(1));
  try{
    if(!await fs.exists(root+'/桌面'))await seedStore(root);
  }catch(e){console.warn(e);}
  try{await Wallpaper.apply();}catch(e){}
  try{await Desktop.init();}catch(e){console.error(e);}
  StartMenu.init();
  Clock.start();
  Dock.render();
  $('#startBtn').title='請神壇 · 開啟應用（第 '+Math.max(1,Math.floor((Date.now()-CFG.get('firstBoot'))/86400000)+1)+' 夜）';
  /* 陽世掛載提醒 */
  const mounts=fs.localMounts();
  if(mounts.length){
    for(const m of mounts){
      const p=await LocalBE.perm(m);
      if(p!=='granted'){
        const t=Toast.show('陽世卷宗待准許','「'+m+'」的權限已失效，點此重新准許。','',14000);
        t.style.cursor='pointer';
        t.onclick=async()=>{
          const r=await LocalBE.askPerm(m);
          t.remove();
          if(r==='granted'){Toast.ok('已准許',m+' 可讀可寫');Desktop.refresh();}
          else Toast.err('未獲准',m+'（'+r+'）');
        };
        break;
      }
    }
  }
  omenLoop();
  console.log('%c殮堂 LIÀNTÁNG','font:22px serif;color:#c22b1e','開機 '+Math.round(performance.now()-t0)+'ms · '+status.join(' · '));
  if(!fs.backends.opfs){
    Toast.err('殮庫不可用','OPFS 無法啟用（'+(fs.errors.opfs||'未知')+'）—— 已自動改以紙庫（IndexedDB）為主。需 https 或 localhost 環境。',12000);
  }
  if(first){
    setTimeout(()=>{
      Toast.show('你來了','值夜第 1 夜。桌面右鍵可新建、導入、掛載陽世卷宗；請神壇在左下角。','',9000);
    },900);
  }
})();
</script>
