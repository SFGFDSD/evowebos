/* ---------- 中繼資料層（mtime / birthtime / 桌面座標 / 開啟方式） ---------- */
const Meta={
  m:new Map(), dirty:new Set(), timer:null, loaded:false, mode:'idb',
  async init(){
    try{
      if(KV.mode!=='idb')throw new Error('no idb');
      const db=KV.db;
      const all=await new Promise((res,rej)=>{
        const out=[];const rq=db.transaction('meta','readonly').objectStore('meta').openCursor();
        rq.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};
        rq.onerror=()=>rej(rq.error);
      });
      all.forEach(r=>{if(r&&r.p)this.m.set(r.p,r);});
      this.mode='idb';
    }catch(e){
      this.mode=(KV.mode==='local')?'local':'memory';
      try{const j=JSON.parse(localStorage.getItem('lt.meta')||'[]');j.forEach(r=>this.m.set(r.p,r));}catch(_){}
    }
    this.loaded=true;
  },
  get(p){return this.m.get(P.norm(p));},
  mt(p){const r=this.m.get(P.norm(p));return r&&r.mt?r.mt:undefined;},
  set(p,patch){
    p=P.norm(p);
    const old=this.m.get(p)||{p};
    const rec=Object.assign({},old,patch,{p});
    this.m.set(p,rec);this.dirty.add(p);this.schedule();
    return rec;
  },
  del(p){p=P.norm(p);this.m.delete(p);this.dirty.add(p);this.schedule();},
  delTree(p){
    p=P.norm(p);const pre=p+'/';
    this.m.delete(p);this.dirty.add(p);
    this.m.forEach((v,k)=>{if(k.indexOf(pre)===0){this.m.delete(k);this.dirty.add(k);}});
    this.schedule();
  },
  move(from,to){
    from=P.norm(from);to=P.norm(to);
    const pre=from+'/';const moves=[];
    this.m.forEach((v,k)=>{if(k===from||k.indexOf(pre)===0)moves.push(k);});
    moves.forEach(k=>{
      const nk=k===from?to:to+k.slice(from.length);
      const rec=Object.assign({},this.m.get(k));this.m.delete(k);this.dirty.add(k);
      rec.p=nk;this.m.set(nk,rec);this.dirty.add(nk);
    });
    this.schedule();
  },
  schedule(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),260);},
  async flush(){
    if(!this.dirty.size)return;
    const keys=[...this.dirty];this.dirty.clear();
    try{
      if(this.mode==='idb'){
        const tx=KV.db.transaction('meta','readwrite');const st=tx.objectStore('meta');
        keys.forEach(k=>{const r=this.m.get(k);if(r)st.put(r,k);else st.delete(k);});
        await new Promise(res=>{tx.oncomplete=res;tx.onerror=res;tx.onabort=res;});
      }else{
        const arr=[];let n=0;
        this.m.forEach(v=>{if(n++<4000)arr.push(v);});
        localStorage.setItem('lt.meta',JSON.stringify(arr));
      }
    }catch(e){console.warn('[殮堂] 中繼資料寫入失敗',e);}
  }
};
window.addEventListener('pagehide',()=>{try{Meta.flush();}catch(e){}});

/* ---------- 後端一：OPFS ---------- */
const OpfsBE={
  ok:false, root:null, name:'opfs',
  async init(){
    if(!navigator.storage||!navigator.storage.getDirectory)throw new Error('此瀏覽器無 OPFS');
    this.root=await navigator.storage.getDirectory();
    const probe=await this.root.getFileHandle('.lt-probe',{create:true});
    const w=await probe.createWritable();await w.write('殮');await w.close();
    await this.root.removeEntry('.lt-probe');
    this.ok=true;
    try{if(navigator.storage.persist)navigator.storage.persist();}catch(e){}
  },
  split(sub){return String(sub||'').split('/').filter(Boolean);},
  async resolve(sub,opt){
    opt=opt||{};
    const segs=this.split(sub);
    if(!segs.length)return {h:this.root,kind:'dir'};
    let cur=this.root;
    for(let i=0;i<segs.length;i++){
      const name=segs[i],last=i===segs.length-1;
      let next=null,kind=null;
      try{
        next=await cur.getDirectoryHandle(name,{create:!!opt.create});
        kind='dir';
      }catch(e){
        if(e&&e.name==='TypeMismatchError'){
          try{next=await cur.getFileHandle(name,{create:last?!!opt.createFile:false});kind='file';}
          catch(e2){if(e2&&e2.name==='NotFoundError')throw FSerr('ENOENT',sub);throw e2;}
        }else if(e&&(e.name==='NotFoundError'||e.name==='NotAllowedError')){
          throw FSerr('ENOENT',sub);
        }else throw e;
      }
      if(!last&&kind!=='dir')throw FSerr('ENOTDIR',sub);
      cur=next;
      if(last)return {h:cur,kind};
    }
    return {h:cur,kind:'dir'};
  },
  async stat(sub){
    const {h,kind}=await this.resolve(sub);
    if(kind==='dir')return {kind:'dir',size:0};
    const f=await h.getFile();
    return {kind:'file',size:f.size,nativeMtime:f.lastModified};
  },
  async readdir(sub){
    const {h,kind}=await this.resolve(sub);
    if(kind!=='dir')throw FSerr('ENOTDIR',sub);
    const out=[];
    for await (const [name,hh] of h.entries()){
      if(name==='.lt-probe')continue;
      if(hh.kind==='file'){
        try{const f=await hh.getFile();out.push({name,kind:'file',size:f.size,nativeMtime:f.lastModified});}
        catch(e){out.push({name,kind:'file',size:0});}
      }else out.push({name,kind:'dir',size:0});
    }
    return out;
  },
  async mkdir(sub){await this.resolve(sub,{create:true});},
  async writeFile(sub,data,mtime){
    const segs=this.split(sub);const name=segs.pop();
    const parent=segs.length?await this.resolve(segs.join('/'),{create:true}):{h:this.root,kind:'dir'};
    if(parent.kind!=='dir')throw FSerr('ENOTDIR',sub);
    const fh=await parent.h.getFileHandle(name,{create:true});
    const w=await fh.createWritable({keepExistingData:false});
    await w.write(data instanceof Blob?data:new Blob([data]));
    await w.close();
    const f=await fh.getFile();
    return {size:f.size,nativeMtime:f.lastModified};
  },
  async readFile(sub){
    const {h,kind}=await this.resolve(sub);
    if(kind!=='file')throw FSerr('EISDIR',sub);
    return await h.getFile();
  },
  async unlink(sub){
    const segs=this.split(sub);const name=segs.pop();
    const parent=await this.resolve(segs.join('/'));
    await parent.h.removeEntry(name);
  },
  async rmdir(sub,recursive){
    const segs=this.split(sub);const name=segs.pop();
    if(!name)throw FSerr('EBUSY','/opfs');
    const parent=await this.resolve(segs.join('/'));
    await parent.h.removeEntry(name,!!recursive);
  },
  async walk(sub,base){
    base=base||'';const out=[];
    const items=await this.readdir(sub);
    for(const it of items){
      const p=sub?sub+'/'+it.name:it.name, rel=base+'/'+it.name;
      if(it.kind==='dir'){out.push({rel,kind:'dir',path:p});out.push.apply(out,await this.walk(p,rel));}
      else{try{out.push({rel,kind:'file',path:p,blob:await this.readFile(p),mtime:it.nativeMtime});}catch(e){}}
    }
    return out;
  },
  async rename(from,to){
    /* OPFS 無原生搬移：讀出 → 寫入 → 刪除（中繼時間由 Meta 全程保留） */
    const st=await this.stat(from);
    if(st.kind==='dir'){
      const items=await this.walk(from);
      await this.mkdir(to);
      for(const it of items){
        const dest=to+it.rel;
        if(it.kind==='dir')await this.mkdir(dest);
        else await this.writeFile(dest,it.blob);
      }
      await this.rmdir(from,true);
    }else{
      const blob=await this.readFile(from);
      await this.writeFile(to,blob);
      await this.unlink(from);
    }
  }
};

/* ---------- 後端二：IndexedDB ---------- */
const IdbBE={
  ok:false,name:'idb',
  async init(){
    if(KV.mode!=='idb')throw new Error('IndexedDB 不可用');
    this.ok=true;
    if(!await this.rec('/idb'))await this.put('/idb',{k:'dir',mt:Date.now(),bt:Date.now(),sz:0});
  },
  tx(m){return KV.db.transaction('fs',m).objectStore('fs');},
  rec(p){return new Promise(res=>{try{const r=this.tx('readonly').get(p);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null);}});},
  put(p,v){return new Promise((res,rej)=>{const r=this.tx('readwrite').put(v,p);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);});},
  rm(p){return new Promise(res=>{const r=this.tx('readwrite').delete(p);r.onsuccess=()=>res(true);r.onerror=()=>res(false);});},
  scan(prefix,cb){
    return new Promise((res,rej)=>{
      const rq=this.tx('readonly').openCursor(IDBKeyRange.bound(prefix,prefix+'\uffff',true,false));
      rq.onsuccess=e=>{const c=e.target.result;if(c){cb(c.key,c.value);c.continue();}else res();};
      rq.onerror=()=>rej(rq.error);
    });
  },
  canon(sub){return sub?P.norm('/idb/'+sub):'/idb';},
  async stat(sub){
    const r=await this.rec(this.canon(sub));
    if(!r)throw FSerr('ENOENT',sub);
    return r.k==='dir'?{kind:'dir',size:0,mtime:r.mt,birth:r.bt}:{kind:'file',size:r.sz||0,mtime:r.mt,birth:r.bt};
  },
  async readdir(sub){
    const base=this.canon(sub);const r=await this.rec(base);
    if(!r)throw FSerr('ENOENT',sub);
    if(r.k!=='dir')throw FSerr('ENOTDIR',sub);
    const out=[];const pre=base+'/';
    await this.scan(pre,(k,v)=>{
      const rest=k.slice(pre.length);
      if(!rest||rest.indexOf('/')>=0)return;
      out.push(v.k==='dir'?{name:rest,kind:'dir',size:0,mtime:v.mt,birth:v.bt}
        :{name:rest,kind:'file',size:v.sz||0,mtime:v.mt,birth:v.bt});
    });
    return out;
  },
  async mkdir(sub){
    const p=this.canon(sub);
    if(await this.rec(p))return;
    const segs=P.norm(p).split('/').filter(Boolean);
    let cur='';
    for(const s of segs){cur+='/'+s;if(!await this.rec(cur))await this.put(cur,{k:'dir',mt:Date.now(),bt:Date.now(),sz:0});}
  },
  async writeFile(sub,data,mtime){
    const p=this.canon(sub);
    const par=P.dir(p);
    if(par&&par!=='/idb')await this.mkdir(par.slice(4));
    let blob=data instanceof Blob?data:new Blob([data]);
    const old=await this.rec(p);
    const rec={k:'file',d:blob,sz:blob.size,mt:mtime||Date.now(),bt:(old&&old.bt)||Date.now()};
    await this.put(p,rec);
    const pr=await this.rec(par);
    if(pr&&pr.k==='dir'){pr.mt=Date.now();await this.put(par,pr);}
    return {size:blob.size};
  },
  async readFile(sub){
    const r=await this.rec(this.canon(sub));
    if(!r)throw FSerr('ENOENT',sub);
    if(r.k!=='file')throw FSerr('EISDIR',sub);
    if(r.d instanceof Blob)return r.d;
    if(r.d instanceof ArrayBuffer)return new Blob([r.d]);
    return new Blob([r.d==null?'':String(r.d)]);
  },
  async unlink(sub){
    const p=this.canon(sub);const r=await this.rec(p);
    if(!r)throw FSerr('ENOENT',sub);
    if(r.k==='dir')throw FSerr('EISDIR',sub);
    await this.rm(p);
  },
  async rmdir(sub,recursive){
    const p=this.canon(sub);const r=await this.rec(p);
    if(!r)throw FSerr('ENOENT',sub);
    if(r.k!=='dir')throw FSerr('ENOTDIR',sub);
    if(p==='/idb')throw FSerr('EBUSY',p);
    const kids=await this.readdir(sub);
    if(kids.length&&!recursive)throw FSerr('ENOTEMPTY',sub);
    const del=[];
    await this.scan(p+'/',k=>del.push(k));
    for(const k of del)await this.rm(k);
    await this.rm(p);
  },
  async rename(from,to){
    const fp=this.canon(from),tp=this.canon(to);
    const r=await this.rec(fp);if(!r)throw FSerr('ENOENT',from);
    const par=P.dir(tp);
    if(par&&par!=='/idb')await this.mkdir(par.slice(4));
    if(r.k!=='dir'){await this.put(tp,r);await this.rm(fp);}
    else{
      await this.put(tp,Object.assign({},r));
      const moves=[];
      await this.scan(fp+'/',(k,v)=>moves.push([k,v]));
      for(const [k,v] of moves){await this.put(tp+k.slice(fp.length),v);await this.rm(k);}
      await this.rm(fp);
    }
  },
  async usage(){
    let bytes=0,files=0,dirs=0;
    await this.scan('/idb',(k,v)=>{if(v.k==='file'){files++;bytes+=(v.sz||0);}else dirs++;});
    return {bytes,files,dirs};
  }
};

/* ---------- 後端三：陽世（File System Access API 掛載） ---------- */
const LocalBE={
  ok:false,name:'local',mounts:new Map(),
  async init(){
    this.ok=!!window.showDirectoryPicker;
    if(!this.ok)throw new Error('此瀏覽器不支援 File System Access API');
    if(KV.mode==='idb'){
      try{
        const all=await new Promise((res,rej)=>{
          const out=[];const rq=KV.db.transaction('handles','readonly').objectStore('handles').openCursor();
          rq.onsuccess=e=>{const c=e.target.result;if(c){out.push([c.key,c.value]);c.continue();}else res(out);};
          rq.onerror=()=>rej(rq.error);
        });
        for(const [name,h] of all)this.mounts.set(name,h);
      }catch(e){}
    }
  },
  async mount(name,handle){
    this.mounts.set(name,handle);
    if(KV.mode==='idb'){try{const tx=KV.db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,name);}catch(e){}}
    return '/local/'+name;
  },
  async unmount(name){
    this.mounts.delete(name);
    if(KV.mode==='idb'){try{const tx=KV.db.transaction('handles','readwrite');tx.objectStore('handles').delete(name);}catch(e){}}
  },
  async pick(){
    if(!window.showDirectoryPicker)throw new Error('此瀏覽器不支援目錄選擇器（建議 Chrome / Edge）');
    const h=await window.showDirectoryPicker({id:'liantang',mode:'readwrite',startIn:'documents'});
    return await this.mount(h.name,h);
  },
  parts(sub){
    const segs=String(sub||'').split('/').filter(Boolean);
    const name=segs.shift();
    if(!name||!this.mounts.has(name))throw FSerr('ENOENT','/local/'+(name||''),'尚未掛載或權限已失效');
    return {root:this.mounts.get(name),segs,name};
  },
  async resolve(sub,opt){
    opt=opt||{};
    const {root,segs}=this.parts(sub);
    let cur=root;
    for(let i=0;i<segs.length;i++){
      const name=segs[i],last=i===segs.length-1;
      let next=null,kind=null;
      try{next=await cur.getDirectoryHandle(name,{create:!!opt.create});kind='dir';}
      catch(e){
        if(e&&e.name==='TypeMismatchError'){
          try{next=await cur.getFileHandle(name,{create:last?!!opt.createFile:false});kind='file';}
          catch(e2){throw FSerr('ENOENT',sub);}
        }else throw FSerr('ENOENT',sub);
      }
      if(!last&&kind!=='dir')throw FSerr('ENOTDIR',sub);
      cur=next;if(last)return {h:cur,kind};
    }
    return {h:cur,kind:'dir'};
  },
  async stat(sub){
    const segs=String(sub||'').split('/').filter(Boolean);
    if(!segs.length)throw FSerr('ENOENT','/local');
    if(segs.length===1){
      if(!this.mounts.has(segs[0]))throw FSerr('ENOENT',sub);
      return {kind:'dir',size:0};
    }
    const {h,kind}=await this.resolve(sub);
    if(kind==='dir')return {kind:'dir',size:0};
    const f=await h.getFile();
    return {kind:'file',size:f.size,nativeMtime:f.lastModified};
  },
  async readdir(sub){
    const segs=String(sub||'').split('/').filter(Boolean);
    if(!segs.length)return [...this.mounts.keys()].map(n=>({name:n,kind:'dir',size:0}));
    const {h,kind}=await this.resolve(sub);
    if(kind!=='dir')throw FSerr('ENOTDIR',sub);
    const out=[];
    for await (const [name,hh] of h.entries()){
      if(hh.kind==='file'){try{const f=await hh.getFile();out.push({name,kind:'file',size:f.size,nativeMtime:f.lastModified});}catch(e){out.push({name,kind:'file',size:0});}}
      else out.push({name,kind:'dir',size:0});
    }
    return out;
  },
  async mkdir(sub){await this.resolve(sub,{create:true});},
  async writeFile(sub,data,mtime){
    const {h,kind}=await this.resolve(sub,{create:true,createFile:true});
    if(kind==='dir')throw FSerr('EISDIR',sub);
    const w=await h.createWritable({keepExistingData:false});
    await w.write(data instanceof Blob?data:new Blob([data]));await w.close();
    const f=await h.getFile();return {size:f.size,nativeMtime:f.lastModified};
  },
  async readFile(sub){
    const {h,kind}=await this.resolve(sub);
    if(kind!=='file')throw FSerr('EISDIR',sub);
    return await h.getFile();
  },
  async unlink(sub){
    const segs=String(sub).split('/').filter(Boolean);const name=segs.pop();
    const {h}=await this.resolve(segs.join('/'));await h.removeEntry(name);
  },
  async rmdir(sub,recursive){
    const segs=String(sub).split('/').filter(Boolean);const name=segs.pop();
    if(!name)throw FSerr('EBUSY','/local');
    const {h}=await this.resolve(segs.join('/'));await h.removeEntry(name,!!recursive);
  },
  async walk(sub,base){
    base=base||'';const out=[];
    const items=await this.readdir(sub);
    for(const it of items){
      const p=sub+'/'+it.name,rel=base+'/'+it.name;
      if(it.kind==='dir'){out.push({rel,kind:'dir',path:p});out.push.apply(out,await this.walk(p,rel));}
      else{try{out.push({rel,kind:'file',path:p,blob:await this.readFile(p)});}catch(e){}}
    }
    return out;
  },
  async rename(from,to){
    const st=await this.stat(from);
    if(st.kind==='file'){
      const b=await this.readFile(from);await this.writeFile(to,b);await this.unlink(from);
    }else{
      const items=await this.walk(from);
      await this.mkdir(to);
      for(const it of items){const d=to+it.rel;if(it.kind==='dir')await this.mkdir(d);else await this.writeFile(d,it.blob);}
      await this.rmdir(from,true);
    }
  },
  async perm(name){
    const h=this.mounts.get(name);if(!h||!h.queryPermission)return 'granted';
    try{return await h.queryPermission({mode:'readwrite'});}catch(e){return 'granted';}
  },
  async askPerm(name){
    const h=this.mounts.get(name);if(!h||!h.requestPermission)return 'granted';
    try{return await h.requestPermission({mode:'readwrite'});}catch(e){return 'denied';}
  }
};

/* ---------- 統一 fs ---------- */
const BE={opfs:OpfsBE,idb:IdbBE,local:LocalBE};
const duCache=new Map();
function invalidateDu(path){
  path=P.norm(path);
  let cur=path;
  while(cur){
    duCache.delete(cur);
    if(cur==='/')break;
    cur=P.dir(cur);
  }
}
const fs={
  ready:false, backends:{opfs:false,idb:false,local:false}, errors:{},
  async init(){
    for(const s of STORES){
      try{await BE[s.key].init();this.backends[s.key]=true;}
      catch(e){this.backends[s.key]=false;this.errors[s.key]=e.message||String(e);}
    }
    if(!this.backends.opfs&&this.backends.idb){
      if(CFG.get('backend')==='opfs'){CFG.set('backend','idb');CFG.set('desktopRoot','/idb');}
    }
    await Meta.init();
    this.ready=true;
  },
  be(path){
    const k=storeOf(path);
    if(!k)throw FSerr('ENOENT',path,'未知庫');
    if(!this.backends[k]&&!(k==='local'))throw FSerr('EUNAVAIL',path,(storeInfo(k).zh)+'不可用：'+(this.errors[k]||''));
    const segs=P.norm(path).split('/').filter(Boolean);segs.shift();
    return {be:BE[k],sub:segs.join('/'),store:k};
  },
  canon(path){
    path=P.norm(path||'/');
    if(path==='/'||storeOf(path))return path;
    const def=CFG.get('backend','opfs');
    return P.norm('/'+(this.backends[def]?def:(this.backends.idb?'idb':'opfs'))+path);
  },
  async exists(path){
    try{const {be,sub}=this.be(this.canon(path));await be.stat(sub);return true;}catch(e){return false;}
  },
  async stat(path){
    path=this.canon(path);
    const {be,sub,store}=this.be(path);
    let st;
    try{st=await be.stat(sub);}
    catch(e){
      if(store==='local'&&!sub)st={kind:'dir',size:0};
      else if(path==='/'||path==='/'+store)st={kind:'dir',size:0};
      else throw e;
    }
    const m=Meta.get(path)||{};
    const mt=m.mt||st.mtime||st.nativeMtime||0;
    const bt=m.bt||st.birth||mt;
    return {path,store,name:P.base(path)||(storeInfo(store)||{}).zh||store,kind:st.kind,
      size:st.kind==='file'?(m.sz!=null?m.sz:st.size):0,mtime:mt,birth:bt,pos:m.pos,openWith:m.openWith};
  },
  async readdir(path){
    path=this.canon(path);
    if(path==='/'){
      return STORES.filter(s=>this.backends[s.key]||(s.key==='local')).map(s=>({
        name:s.key,path:'/'+s.key,kind:'dir',size:0,mtime:0,store:s.key,zh:s.zh
      }));
    }
    const {be,sub,store}=this.be(path);
    let items;
    try{items=await be.readdir(sub);}
    catch(e){
      if(store==='local'&&!sub)items=[...LocalBE.mounts.keys()].map(n=>({name:n,kind:'dir',size:0}));
      else if(sub==='')items=[];
      else throw e;
    }
    const out=items.map(it=>{
      const p=path+'/'+it.name;
      const m=Meta.get(p)||{};
      const mt=m.mt||it.mtime||it.nativeMtime||0;
      return {name:it.name,path:p,kind:it.kind,size:it.kind==='file'?(m.sz!=null?m.sz:(it.size||0)):0,
        mtime:mt,birth:m.bt||mt,store,zh:it.zh,pos:m.pos,openWith:m.openWith};
    });
    if(!CFG.get('showHidden'))return out.filter(o=>o.name.charAt(0)!=='.');
    return out;
  },
  async mkdir(path,recursive){
    path=this.canon(path);
    const {be,sub}=this.be(path);
    if(recursive){
      const segs=sub.split('/').filter(Boolean);let cur='';
      for(const s of segs){
        cur+=(cur?'/':'')+s;
        try{await be.mkdir(cur);}catch(e){}
        const full=P.norm('/'+storeOf(path)+'/'+cur);
        const old=Meta.get(full)||{};
        Meta.set(full,{k:'dir',bt:old.bt||Date.now(),mt:old.mt||Date.now()});
      }
    }else{
      await be.mkdir(sub);
    }
    const now=Date.now();const old=Meta.get(path)||{};
    Meta.set(path,{k:'dir',mt:now,bt:old.bt||now});
    invalidateDu(P.dir(path));
    return path;
  },
  async mkdirp(path){
    path=this.canon(path);
    const segs=path.split('/').filter(Boolean);let cur='';
    for(const s of segs){cur+='/'+s;if(!(await this.exists(cur)))await this.mkdir(cur);}
    return path;
  },
  async writeFile(path,data,opt){
    path=this.canon(path);opt=opt||{};
    const {be,sub}=this.be(path);
    let blob;
    if(data instanceof Blob)blob=data;
    else if(typeof data==='string')blob=new Blob([data],{type:'text/plain;charset=utf-8'});
    else blob=new Blob([data]);
    await this.mkdirp(P.dir(path));
    const old=Meta.get(path)||{};
    await be.writeFile(sub,blob,opt.mtime);
    const now=Date.now();
    Meta.set(path,{k:'file',sz:blob.size,mt:opt.mtime||now,bt:old.bt||now,openWith:old.openWith,pos:old.pos});
    invalidateDu(path);
    return {size:blob.size,mtime:opt.mtime||now};
  },
  async readFile(path,as){
    path=this.canon(path);
    const {be,sub}=this.be(path);
    const blob=await be.readFile(sub);
    if(!as||as==='blob')return blob;
    if(as==='buffer')return await blob.arrayBuffer();
    if(as==='text')return await blob.text();
    if(as==='json')return JSON.parse(await blob.text());
    if(as==='url')return URL.createObjectURL(blob);
    if(as==='dataurl')return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
    return blob;
  },
  async unlink(path){
    path=this.canon(path);
    const {be,sub}=this.be(path);
    await be.unlink(sub);
    Meta.del(path);invalidateDu(path);
  },
  async rmdir(path,recursive){
    path=this.canon(path);
    if(P.depth(path)<=1)throw FSerr('EBUSY',path,'庫根不可焚');
    const {be,sub}=this.be(path);
    await be.rmdir(sub,recursive);
    if(recursive)Meta.delTree(path);else Meta.del(path);
    invalidateDu(path);
  },
  async remove(path,recursive){
    const st=await this.stat(path);
    if(st.kind==='dir')await this.rmdir(path,recursive!==false);
    else await this.unlink(path);
  },
  async rename(from,to){
    from=this.canon(from);to=this.canon(to);
    if(from===to)return from;
    if(await this.exists(to))throw FSerr('EEXIST',to,'同名之魂已在');
    await this.mkdirp(P.dir(to));
    if(storeOf(from)===storeOf(to)){
      const a=this.be(from),b=this.be(to);
      await a.be.rename(a.sub,b.sub);
    }else{
      await this.copy(from,to,{preserve:true});
      await this.remove(from,true);
    }
    Meta.move(from,to);
    invalidateDu(from);invalidateDu(to);
    return to;
  },
  async copy(from,to,opt){
    from=this.canon(from);to=this.canon(to);opt=opt||{};
    const st=await this.stat(from);
    await this.mkdirp(P.dir(to));
    if(st.kind==='dir'){
      await this.mkdirp(to);
      Meta.set(to,{k:'dir',mt:opt.preserve?st.mtime:Date.now(),bt:st.birth});
      const kids=await this.readdir(from);
      for(const k of kids)await this.copy(k.path,to+'/'+k.name,{preserve:true});
    }else{
      const blob=await this.readFile(from,'blob');
      await this.writeFile(to,blob,{mtime:opt.preserve?st.mtime:Date.now()});
      Meta.set(to,{k:'file',mt:opt.preserve?st.mtime:Date.now(),bt:st.birth,sz:st.size,openWith:st.openWith});
    }
    invalidateDu(to);
    return to;
  },
  move(from,to){return this.rename(from,to);},
  async du(path){
    path=this.canon(path);
    if(duCache.has(path))return duCache.get(path);
    let st;try{st=await this.stat(path);}catch(e){return 0;}
    if(st.kind==='file'){duCache.set(path,st.size);return st.size;}
    let total=0;const stack=[path];
    while(stack.length){
      const cur=stack.pop();
      let kids=[];try{kids=await this.readdir(cur);}catch(e){}
      for(const k of kids){if(k.kind==='dir')stack.push(k.path);else total+=(k.size||0);}
    }
    duCache.set(path,total);
    return total;
  },
  async tree(path,depth,max){
    path=this.canon(path);depth=depth||0;max=max||8;
    const out=[];
    if(depth>max)return out;
    let kids=[];try{kids=await this.readdir(path);}catch(e){return out;}
    for(const k of kids){
      out.push(Object.assign({},k,{depth}));
      if(k.kind==='dir')out.push.apply(out,await this.tree(k.path,depth+1,max));
    }
    return out;
  },
  async search(query,opt){
    opt=opt||{};
    const q=String(query).toLowerCase();
    const roots=opt.roots||STORES.filter(s=>this.backends[s.key]).map(s=>'/'+s.key);
    const res=[];const stack=roots.slice();let n=0;
    while(stack.length&&res.length<(opt.limit||500)){
      const cur=stack.pop();
      let kids=[];try{kids=await this.readdir(cur);}catch(e){continue;}
      for(const k of kids){
        n++;
        if(k.name.toLowerCase().indexOf(q)>=0)res.push(k);
        else if(opt.content&&k.kind==='file'&&isTextKind(k.name)&&k.size<2*1024*1024){
          try{const t=await this.readFile(k.path,'text');if(t.toLowerCase().indexOf(q)>=0)res.push(k);}catch(e){}
        }
        if(k.kind==='dir')stack.push(k.path);
      }
    }
    res.scanned=n;
    return res;
  },
  async mountLocal(){const p=await LocalBE.pick();invalidateDu('/local');Desktop.refresh();return p;},
  async unmountLocal(name){await LocalBE.unmount(name);invalidateDu('/local');Desktop.refresh();},
  localMounts(){return [...LocalBE.mounts.keys()];},
  async usage(){
    const out={quota:0,usage:0,persisted:false,opfs:{bytes:0,files:0,dirs:0},idb:{bytes:0,files:0,dirs:0},local:{mounts:LocalBE.mounts.size}};
    try{const e=await navigator.storage.estimate();out.quota=e.quota||0;out.usage=e.usage||0;}catch(e){}
    try{out.persisted=!!(navigator.storage.persisted&&await navigator.storage.persisted());}catch(e){}
    try{out.idb=await IdbBE.usage();}catch(e){}
    try{
      const walk=async(sub)=>{
        let items=[];try{items=await OpfsBE.readdir(sub);}catch(e){return;}
        for(const it of items){
          const p=sub?sub+'/'+it.name:it.name;
          if(it.kind==='dir'){out.opfs.dirs++;await walk(p);}
          else{out.opfs.files++;out.opfs.bytes+=(it.size||0);}
        }
      };
      await walk('');
    }catch(e){}
    return out;
  },
  async unique(dir,name){
    let p=dir+'/'+name;
    if(!await this.exists(p))return p;
    const dot=name.lastIndexOf('.');
    const base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
    let i=1;
    while(await this.exists(dir+'/'+base+'（第'+i+'份）'+ext)){i++;if(i>999)break;}
    return dir+'/'+base+'（第'+i+'份）'+ext;
  }
};

/* ---------- 縮圖快取 ---------- */
const Thumb={
  cache:new Map(),
  async get(path,size){
    size=size||96;
    const key=path+'@'+size;
    if(this.cache.has(key))return this.cache.get(key);
    try{
      const st=await fs.stat(path);
      if(st.size>30*1024*1024)return null;
      const blob=await fs.readFile(path,'blob');
      if(P.ext(path)==='svg'){
        const url=URL.createObjectURL(new Blob([blob],{type:'image/svg+xml'}));
        this.cache.set(key,url);return url;
      }
      return await this.blob(blob,size,key);
    }catch(e){return null;}
  },
  async blob(blob,size,key){
    try{
      const bmp=await createImageBitmap(blob);
      const sc=Math.min(1,(size||96)/Math.max(bmp.width,bmp.height))*2;
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      if(bmp.close)bmp.close();
      const url=await new Promise(r=>c.toBlob(b=>r(b?URL.createObjectURL(b):null),'image/jpeg',.78));
      if(!url)return null;
      if(key)this.cache.set(key,url);
      if(this.cache.size>340){const k=this.cache.keys().next().value;URL.revokeObjectURL(this.cache.get(k));this.cache.delete(k);}
      return url;
    }catch(e){return null;}
  },
  async file(file,size){
    if(P.ext(file.name)==='svg'){try{return URL.createObjectURL(file);}catch(e){return null;}}
    return await this.blob(file,size);
  },
  clear(){this.cache.forEach(u=>URL.revokeObjectURL(u));this.cache.clear();}
};

/* ---------- 通用框選（滑鼠＋觸控，邊緣自動捲動） ---------- */
function Marquee(container,opt){
  opt=opt||{};
  const itemSel=opt.itemSel||'.mq-item';
  const box=el('div',{class:'marquee'});
  container.appendChild(box);
  let active=false,sx=0,sy=0,add=false,raf=0,edge={x:0,y:0},snap=[],lp=null;
  function snapshot(){
    const r=container.getBoundingClientRect();
    snap=[];
    const nodes=container.querySelectorAll(itemSel);
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i],ir=n.getBoundingClientRect();
      if(!ir.width&&!ir.height)continue;
      snap.push({n,x:ir.left-r.left+container.scrollLeft,y:ir.top-r.top+container.scrollTop,w:ir.width,h:ir.height});
    }
  }
  const cxy=e=>{
    const t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);
    return {x:t.clientX,y:t.clientY};
  };
  function onStart(e){
    if(e.button!=null&&e.button!==0)return;
    if(opt.filter&&!opt.filter(e))return;
    if(e.target.closest(itemSel))return;
    if(e.target.closest('input,textarea,select,button,.no-mq'))return;
    const p=cxy(e);
    const r=container.getBoundingClientRect();
    active=true;
    sx=p.x-r.left+container.scrollLeft;
    sy=p.y-r.top+container.scrollTop;
    add=e.ctrlKey||e.metaKey||e.shiftKey;
    snapshot();
    box.classList.add('on');
    box.style.left=sx+'px';box.style.top=sy+'px';box.style.width='0';box.style.height='0';
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);
    document.addEventListener('touchcancel',onEnd);
    if(e.cancelable)e.preventDefault();
    loop();
  }
  function onMove(e){
    if(!active)return;
    if(e.cancelable)e.preventDefault();
    const p=cxy(e);
    const r=container.getBoundingClientRect();
    let cx=p.x-r.left+container.scrollLeft, cy=p.y-r.top+container.scrollTop;
    /* 40px 感應帶邊緣自動捲動 */
    const E=40,sp=16;
    edge.x=(p.x-r.left<E)?-sp:((r.right-p.x<E)?sp:0);
    edge.y=(p.y-r.top<E)?-sp:((r.bottom-p.y<E)?sp:0);
    lp=p;
    draw(cx,cy);
  }
  function draw(cx,cy){
    const x=Math.min(sx,cx),y=Math.min(sy,cy),w=Math.abs(cx-sx),h=Math.abs(cy-sy);
    box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
    if(opt.onRect)opt.onRect({x,y,w,h},add);
    else{
      const sel=[];
      /* AABB：使用起手時快取的內容座標（捲動不影響內容座標，故快取有效且極快） */
      for(let i=0;i<snap.length;i++){
        const s=snap[i];
        if(s.x<x+w&&s.x+s.w>x&&s.y<y+h&&s.y+s.h>y)sel.push(s.n);
      }
      opt.onSelect&&opt.onSelect(sel,add);
    }
  }
  function loop(){
    if(!active){raf=0;return;}
    if(edge.x||edge.y){
      container.scrollLeft+=edge.x;container.scrollTop+=edge.y;
      if(lp){
        const r=container.getBoundingClientRect();
        draw(lp.x-r.left+container.scrollLeft,lp.y-r.top+container.scrollTop);
      }
    }
    raf=requestAnimationFrame(loop);
  }
  function onEnd(e){
    if(!active)return;
    active=false;box.classList.remove('on');edge.x=edge.y=0;lp=null;snap=[];
    if(raf)cancelAnimationFrame(raf);raf=0;
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
    document.removeEventListener('touchcancel',onEnd);
    opt.onEnd&&opt.onEnd();
  }
  container.addEventListener('mousedown',onStart);
  container.addEventListener('touchstart',onStart,{passive:false});
  return {destroy(){onEnd();container.removeEventListener('mousedown',onStart);container.removeEventListener('touchstart',onStart);box.remove();},el:box};
}

/* ---------- 視窗管理器 ---------- */
const WM={
  wins:new Map(), z:100, seq:0, peeking:false, snapRect:null,
  bounds(){
    const dock=CFG.get('dock');
    const dh=(dock==='none')?0:(dock==='hide'?5:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-h'))||52);
    return {w:innerWidth,h:innerHeight-dh,dockH:dh};
  },
  create(app,args){

    const h=Math.min(args.h||app.h||520,Math.max(200,b.h-16));
    const n=this.wins.size;
    let x=args.x!=null?args.x:Math.max(6,Math.round((b.w-w)/2+((n%6)-2.5)*26));

      '<div class="rz nw" data-d="nw"></div><div class="rz ne" data-d="ne"></div><div class="rz sw" data-d="sw"></div><div class="rz se" data-d="se"></div>'+
      '<header class="win-bar"><span class="win-ico">'+(ICO[app.icon]||ICO.file)+'</span>'+
      '<span class="win-title">'+esc(args.title||app.name)+(app.en?'<b>'+esc(app.en)+'</b>':'')+'</span>'+
      '<span class="win-btns">'+
        (app.noMin?'':'<button class="wb min" title="收 · 最小化">'+ICO.min+'</button>')+
        (app.noMax?'':'<button class="wb mx" title="張 · 最大化">'+ICO.max+'</button>')+
        '<button class="wb close" title="焚 · 關閉">'+ICO.close+'</button>'+
      '</span></header>'+
      '<div class="win-body"></div>'+
      '<div class="win-status hidden"></div>';
    $('#winLayer').appendChild(node);
    const ctx={
      id,app,args,el:node,body:node.querySelector('.win-body'),status:node.querySelector('.win-status'),
      bar:node.querySelector('.win-bar'),
      rect:{x,y,w,h},maxed:false,minned:false,fsMode:false,
      setTitle(t,sub){const e=node.querySelector('.win-title');e.innerHTML=esc(t)+(sub?'<b>'+esc(sub)+'</b>':'');this._t=t;Dock.render();},
      setIcon(i){node.querySelector('.win-ico').innerHTML=ICO[i]||ICO.file;Dock.render();},
      setStatus(html){const s=node.querySelector('.win-status');s.classList.remove('hidden');s.innerHTML=html;},
      hideStatus(){node.querySelector('.win-status').classList.add('hidden');},
      setSize(w,h){node.style.width=w+'px';node.style.height=h+'px';ctx._resz&&ctx._resz();},
      close(){WM.close(id);},
      minimize(){WM.minimize(id);},
      maximize(){WM.toggleMax(id);},
      focus(){WM.focus(id);},
      onResize(fn){ctx._resz=fn;},
      fullscreen(){WM.toggleFs(id);}
    };
    ctx._t=ctx.el.querySelector('.win-title').textContent;
    const win={ctx,node,app,args};
    this.wins.set(id,win);
    /* 按鈕 */
    node.querySelector('.wb.close').onclick=e=>{e.stopPropagation();this.close(id);};
    const mn=node.querySelector('.wb.min');if(mn)mn.onclick=e=>{e.stopPropagation();this.minimize(id);};
    const mx=node.querySelector('.wb.mx');if(mx)mx.onclick=e=>{e.stopPropagation();this.toggleMax(id);};
    node.addEventListener('pointerdown',()=>this.focus(id),true);
    /* 標題列拖曳 + Aero Snap */

    /* 掛載應用 */
    try{
      const api=app.mount?app.mount(ctx,args):null;

    }catch(err){
      console.error(err);
      ctx.body.innerHTML='<div class="empty">'+ICO.warn+'<p>此魂不受召喚</p><div style="font-size:11px;font-family:var(--f-mono)">'+esc(err.message||err)+'</div></div>';

  },
  focus(id){

  topWin(){let t=null;this.wins.forEach(w=>{if(!w.ctx.minned&&(!t||+w.node.style.zIndex>+t.node.style.zIndex))t=w;});return t;},
  close(id){

      try{w.api&&w.api.destroy&&w.api.destroy();}catch(e){console.warn(e);}

      const t=this.topWin();if(t)this.focus(t.ctx.id);

  },
  closeAll(){[...this.wins.keys()].forEach(k=>this.close(k));},
  minimize(id){

  },
  restore(id){
    const w=this.wins.get(id);if(!w)return;
    w.ctx.minned=false;
    w.node.style.display='';
    w.node.classList.add('restoring');
    setTimeout(()=>w.node.classList.remove('restoring'),270);

  },
  toggleMax(id,force){
    const w=this.wins.get(id);if(!w)return;
    const b=this.bounds();
    const c=w.ctx;
    const want=(force===true)?true:!c.maxed;
    if(want){
      c._pre={x:c.el.offsetLeft,y:c.el.offsetTop,w:c.el.offsetWidth,h:c.el.offsetHeight};
      c.el.style.transition='all .22s cubic-bezier(.16,1,.3,1)';

      c.el.style.left=p.x+'px';c.el.style.top=p.y+'px';c.el.style.width=p.w+'px';c.el.style.height=p.h+'px';

  applyRect(id,r){
    const w=this.wins.get(id);if(!w)return;

    c._pre={x:c.el.offsetLeft,y:c.el.offsetTop,w:c.el.offsetWidth,h:c.el.offsetHeight};
    c.el.style.transition='all .2s cubic-bezier(.16,1,.3,1)';

  toggleFs(id){

  draggable(w){

      if(e.target.closest('.wb'))return;
      if(e.button!=null&&e.button!==0)return;
      if(c.fsMode)return;
      const p=ptr(e);
      st={x:p.x,y:p.y,l:node.offsetLeft,t:node.offsetTop,ow:node.offsetWidth,oh:node.offsetHeight,moved:false,id:e.pointerId};
      WM.focus(w.ctx.id);
      if(c.maxed){
        /* 自最大化拖出：還原並跟手 */
        const b=WM.bounds();
        const ratio=clamp((p.x-c.el.offsetLeft)/Math.max(1,c.el.offsetWidth),0,1);
        const pre=c._pre||{w:760,h:500};
        c.maxed=false;node.classList.remove('max');
        node.style.width=pre.w+'px';node.style.height=pre.h+'px';
        const mx=node.querySelector('.wb.mx');if(mx)mx.innerHTML=ICO.max;
        st.l=clamp(p.x-pre.w*ratio,0,b.w-pre.w);st.t=clamp(p.y-16,0,b.h-40);st.ow=pre.w;st.oh=pre.h;

      document.addEventListener('pointerup',up);

      if(!st)return;

      st.moved=true;
      document.documentElement.classList.add('dragging');
      const b=WM.bounds();
      let nl=clamp(st.l+dx,-st.ow+70,b.w-70);
      let nt=clamp(st.t+dy,0,b.h-28);
      node.style.left=nl+'px';node.style.top=nt+'px';
      /* Aero Snap 預覽 */
      if(CFG.get('snap',true)){
        const prev=$('#snapPrev');let r=null;
        if(p.y<=3)r={x:0,y:0,w:b.w,h:b.h};
        else if(p.x<=3)r={x:0,y:0,w:Math.round(b.w/2),h:b.h};
        else if(p.x>=b.w-4)r={x:Math.round(b.w/2),y:0,w:Math.round(b.w/2),h:b.h};
        else if(p.y>=b.h-6&&nl<st.ow*0.3)r={x:0,y:Math.round(b.h*0.62),w:b.w,h:Math.round(b.h*0.38)};
        if(r){prev.style.left=r.x+'px';prev.style.top=r.y+'px';prev.style.width=r.w+'px';prev.style.height=r.h+'px';prev.classList.add('on');WM.snapRect=r;}
        else{prev.classList.remove('on');WM.snapRect=null;}
      }
    };
    const up=e=>{
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      document.removeEventListener('pointercancel',up);
      document.documentElement.classList.remove('dragging');
      $('#snapPrev').classList.remove('on');
      if(WM.snapRect&&st&&st.moved){WM.applyRect(w.ctx.id,WM.snapRect);WM.snapRect=null;}
      st=null;
    };
    bar.addEventListener('pointerdown',down);

  },
  resizable(w,dir,handle){
    const node=w.ctx.el,c=w.ctx;
    let st=null;
    const down=e=>{
      if(e.button!=null&&e.button!==0)return;

      const p=ptr(e);
      st={x:p.x,y:p.y,l:node.offsetLeft,t:node.offsetTop,w:node.offsetWidth,h:node.offsetHeight};

    };
    const move=e=>{
      if(!st)return;
      const p=ptr(e),dx=p.x-st.x,dy=p.y-st.y,b=WM.bounds();
      const MINW=Math.max(230,w.app.minW||230),MINH=Math.max(140,w.app.minH||140);
      let l=st.l,t=st.t,ww=st.w,hh=st.h;
      if(dir.indexOf('e')>=0)ww=clamp(st.w+dx,MINW,b.w-st.l);
      if(dir.indexOf('s')>=0)hh=clamp(st.h+dy,MINH,b.h-st.t);
      if(dir.indexOf('w')>=0){ww=clamp(st.w-dx,MINW,st.l+st.w);l=st.l+st.w-ww;}
      if(dir.indexOf('n')>=0){hh=clamp(st.h-dy,MINH,st.t+st.h);t=st.t+st.h-hh;}
      node.style.left=l+'px';node.style.top=t+'px';node.style.width=ww+'px';node.style.height=hh+'px';
    };
    const up=()=>{
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
      document.documentElement.classList.remove('resizing');st=null;c._resz&&c._resz();
    };
    handle.addEventListener('pointerdown',down);
  },
  peek(on){
    if(!CFG.get('peek',true))return;
    this.peeking=on;
    this.wins.forEach(w=>w.node.classList.toggle('peeked',on));
    $('#dock').classList.toggle('peek',on);
  },
  open(appId,args){
    const app=Apps[appId];
    if(!app){Toast.err('無此魂','找不到應用：'+appId);return null;}
    if(app.singleton){
      let found=null;
      this.wins.forEach(w=>{if(w.app.id===appId)found=w;});
      if(found){
        this.focus(found.ctx.id);
        if(found.api&&found.api.reuse)found.api.reuse(args||{});
        return found;
      }
    }
    return this.create(app,args);
  }
};

const Clock={
  timer:null,calMonth:null,
  start(){
    this.tick();
    clearInterval(this.timer);
    this.timer=setInterval(()=>this.tick(),1000);
    $('#clock').onclick=e=>{e.stopPropagation();this.toggleCal();};
    document.addEventListener('pointerdown',e=>{
      const cp=$('#calPop');
      if(cp.classList.contains('on')&&!e.target.closest('#calPop')&&!e.target.closest('#clock'))cp.classList.remove('on');
    },true);
  },
  tick(){
    const d=new Date();
    const wd=['日','一','二','三','四','五','六'][d.getDay()];
    $('#clock .c-t').textContent=fmtTime(d);
    $('#clock .c-d').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 · 週'+wd;
    const v=$('#vigil');
    const fb=CFG.get('firstBoot')||Date.now();
    const day=Math.max(1,Math.floor((Date.now()-fb)/86400000)+1);
    v.textContent='值夜第 '+day+' 夜';
    if($('#calPop').classList.contains('on'))this.renderCal();
  },
  toggleCal(){
    const cp=$('#calPop');
    if(cp.classList.contains('on')){cp.classList.remove('on');return;}
    this.calMonth=this.calMonth||new Date();
    this.renderCal();
    cp.classList.add('on');
  },
  renderCal(){
    const cp=$('#calPop');
    const m=this.calMonth||new Date();
    const y=m.getFullYear(),mo=m.getMonth();
    const first=new Date(y,mo,1),start=first.getDay();
    const days=new Date(y,mo+1,0).getDate();
    const prevDays=new Date(y,mo,0).getDate();
    const today=new Date();
    let html='<div class="cal-h"><div><div class="big">'+y+' 年 '+pad2(mo+1)+' 月</div><div class="sub">'+
      (this.lunarLine(today))+'</div></div><div class="cal-nav">'+
      '<button data-m="-1">'+ICO.back+'</button><button data-m="0" title="回到今宵">'+ICO.clockIco+'</button><button data-m="1">'+ICO.fwd+'</button></div></div>';
    html+='<div class="cal-g">';
    ['日','一','二','三','四','五','六'].forEach(w=>html+='<div class="wd">'+w+'</div>');
    for(let i=0;i<start;i++)html+='<div class="d out">'+(prevDays-start+i+1)+'</div>';
    for(let d=1;d<=days;d++){
      const isNow=(d===today.getDate()&&mo===today.getMonth()&&y===today.getFullYear());
      html+='<div class="d'+(isNow?' now':'')+'" data-d="'+d+'">'+d+'</div>';
    }
    const tail=(7-((start+days)%7))%7;
    for(let i=1;i<=tail;i++)html+='<div class="d out">'+i+'</div>';
    html+='</div>';
    const al=this.almanac(today);
    html+='<div class="almanac"><div class="row"><b>宜</b><span>'+al.yi.join(' · ')+'</span></div>'+
      '<div class="row bad"><b>忌</b><span>'+al.ji.join(' · ')+'</span></div>'+
      '<div class="row" style="font-size:12px;color:var(--bone-3);font-family:var(--f-mono);letter-spacing:.06em">更漏 '+fmtTime(today)+' · 殮堂曆第 '+CFG.get('dayCount',1)+' 日</div></div>';
    cp.innerHTML=html;
    $$('.cal-nav button',cp).forEach(b=>b.onclick=()=>{
      const v=+b.dataset.m;
      if(v===0)this.calMonth=new Date();
      else this.calMonth=new Date(this.calMonth.getFullYear(),this.calMonth.getMonth()+v,1);
      this.renderCal();
    });
    $$('.cal-g .d[data-d]',cp).forEach(b=>b.onclick=()=>{
      Toast.info('記下此日',b.dataset.d+' 日 · '+(mo+1)+' 月 · '+y+' 年 — '+this.almanac(new Date(y,mo,+b.dataset.d)).yi[0]);
    });
  },
  lunarLine(d){
    const n=['朔','晦','既望','上弦','下弦'];
    return '值守 '+CFG.get('vigilName','守夜人')+' · '+n[d.getDate()%5]+' · '+['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][d.getDate()%10]+'日';
  },
  almanac(d){
    const YI=['焚香','守夜','點卯','誦經','封門','掃墓','裁衣','安床','納采','開壇','掘井','掛符','遷棺','祭祀','沐浴','剃頭','釀酒','補垣'];
    const JI=['動土','夜行','照鏡','呼名','回頭','開窗','應門','點燈','數階','梳頭','吹口哨','晾衣於外','夜半答話','拾路上物'];
    let h=(d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate())>>>0;
    const rnd=()=>{h=(h*1103515245+12345)&0x7fffffff;return h/0x7fffffff;};
    const pick=(arr,n)=>{const c=arr.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return o;};
    return {yi:pick(YI,3),ji:pick(JI,3)};
  }
};

/* ---- 拖出快取：mouseenter / pointerdown 時異步預載，dragstart 同步取用 ---- */
const DragCache={
  map:new Map(),
  async prep(path){
    if(this.map.has(path))return this.map.get(path);
    try{
      const st=await fs.stat(path);
      if(st.kind!=='file'){this.map.set(path,{dir:true,name:st.name});return this.map.get(path);}
      const blob=await fs.readFile(path,'blob');
      const file=new File([blob],st.name,{type:blob.type||MIME(st.name),lastModified:st.mtime||Date.now()});
      const url=URL.createObjectURL(blob);
      const rec={dir:false,name:st.name,file,url,path,size:st.size};
      this.map.set(path,rec);
      return rec;
    }catch(e){return null;}
  },
  get(path){return this.map.get(path);},
  release(path){
    const r=this.map.get(path);
    if(!r)return;
    /* 延遲至少 5 秒再 revoke */
    setTimeout(()=>{try{r.url&&URL.revokeObjectURL(r.url);}catch(e){}},6000);
    this.map.delete(path);
  },
  clear(){this.map.forEach((r)=>{if(r.url)setTimeout(()=>{try{URL.revokeObjectURL(r.url);}catch(e){}},6000);});this.map.clear();}
};

const Desktop={
  path:()=>CFG.get('desktopRoot','/opfs')+'/桌面',
  items:[], nodes:new Map(), sel:new Set(), mq:null, lastClick:0,
  async init(){
    const layer=$('#iconLayer');
    /* 全域：外部檔案拖入 */

      if(!this.isExternal(e))return;

    });

      dragDepth=Math.max(0,dragDepth-1);
      if(!dragDepth)$('#dropHint').classList.remove('on');
    });
    document.addEventListener('dragover',e=>{
      if(this.isExternal(e)){e.preventDefault();e.dataTransfer.dropEffect='copy';}
    });
    document.addEventListener('drop',async e=>{
      dragDepth=0;$('#dropHint').classList.remove('on');
      if(!this.isExternal(e))return;
      e.preventDefault();
      const target=e.target.closest('.win');
      if(target)return; /* 由應用自行處理 */

      itemSel:'.dicon',

      onSelect:(nodes,add)=>{

  isExternal(e){
    const t=(e.dataTransfer&&e.dataTransfer.types)||[];
    return Array.prototype.indexOf.call(t,'Files')>=0||Array.prototype.indexOf.call(t,'application/x-moz-file')>=0;
  },
  async refresh(){
    const p=this.path();

      if(!await fs.exists(p))await fs.mkdirp(p);

  cell(){const s=CFG.get('iconSize',60);return {w:s+16,h:s+34};},
  freeSpot(used){
    const c=this.cell();
    const W=$('#desktop').clientWidth-12,H=$('#desktop').clientHeight-12;
    const cols=Math.max(1,Math.floor(W/c.w)),rows=Math.max(1,Math.floor(H/c.h));
    for(let x=0;x<cols;x++)for(let y=0;y<rows;y++){
      const k=x+':'+y;
      if(!used.has(k))return {x,y,k};

    return {x:0,y:0,k:'0:0'};
  },
  render(){
    const layer=$('#iconLayer');
    layer.innerHTML='';this.nodes.clear();
    const c=this.cell();
    const used=new Set();
    /* 先佔用已有座標 */
    this.items.forEach(it=>{
      if(it.pos&&it.pos.x!=null){
        used.add(Math.round(it.pos.x/c.w)+':'+Math.round(it.pos.y/c.h));
      }
    });
    this.items.forEach((it,i)=>{
      let x,y;
      if(it.pos&&it.pos.x!=null){x=it.pos.x;y=it.pos.y;}
      else{const s=this.freeSpot(used);used.add(s.k);x=8+s.x*c.w;y=8+s.y*c.h;Meta.set(it.path,{pos:{x,y}});}
      const n=this.mkIcon(it,x,y);
      layer.appendChild(n);
      this.nodes.set(it.path,n);
    });
    this.paintSel();
    if(!this.items.length){
      layer.appendChild(el('div',{class:'empty',style:'position:absolute;inset:0;pointer-events:none;opacity:.5',
        html:ICO.scroll+'<p>桌面空空 · 右鍵可招魂</p>'}));
    }
  },
  mkIcon(it,x,y){
    const n=el('div',{class:'dicon mq-item'});
    n.dataset.path=it.path;n.dataset.kind=it.kind;n.dataset.name=it.name;
    n.style.left=x+'px';n.style.top=y+'px';
    const glyph=el('div',{class:'di-glyph'});
    glyph.innerHTML=ICO[fileIco(it.name,it.kind==='dir')];
    n.appendChild(glyph);
    n.appendChild(el('div',{class:'di-name',text:CFG.get('showExt',true)?it.name:it.name.replace(/\.[^.]+$/,'')}));
    /* 縮圖（僅圖片、僅需要時） */
    if(CFG.get('thumbOn',true)&&it.kind==='file'&&isImg(it.name)&&P.ext(it.name)!=='svg'){
      Thumb.get(it.path,120).then(u=>{
        if(u&&this.nodes.get(it.path)===n){
          glyph.innerHTML='<img class="thumb" src="'+u+'" alt="" draggable="false">';
        }
      });
    }
    if(it.kind==='dir'){
      const b=el('div',{class:'di-badge'});b.innerHTML=ICO.folder;n.appendChild(b);
    }
    const st=Meta.get(it.path)||{};
    if(st.openWith){const b=el('div',{class:'di-badge',style:'left:2px;right:auto'});b.innerHTML=ICO[Apps[st.openWith]?Apps[st.openWith].icon:'file'];n.appendChild(b);}
    /* --- 互動 --- */
    let downAt=0,moved=false;
    n.addEventListener('pointerenter',()=>{if(it.kind==='file')DragCache.prep(it.path);});
    n.addEventListener('pointerdown',e=>{
      downAt=Date.now();moved=false;
      if(e.pointerType==='mouse'){
        /* 僅滑鼠啟用原生拖曳，避免與觸控拖曳互斥 */
        n.setAttribute('draggable','true');
        if(it.kind==='file')DragCache.prep(it.path);
      }else{
        n.removeAttribute('draggable');
      }
      if(e.button===2)return;
      if(!(e.ctrlKey||e.metaKey||e.shiftKey)){
        if(!this.sel.has(it.path)){this.sel.clear();this.sel.add(it.path);this.paintSel();}
      }else{
        this.sel.has(it.path)?this.sel.delete(it.path):this.sel.add(it.path);
        this.paintSel();
      }
      if(e.pointerType!=='mouse')this.touchDrag(e,n,it);
    });
    n.addEventListener('pointerup',()=>n.removeAttribute('draggable'));
    n.addEventListener('click',e=>{
      e.stopPropagation();
      const now=Date.now();
      if(CFG.get('singleClick',true)){
        if(now-this.lastClick<260)return;
        this.lastClick=now;
        Sys.open(it.path);
      }else{
        if(now-this.lastClick<420&&this.lastClick){Sys.open(it.path);this.lastClick=0;}
        else this.lastClick=now;
      }
    });
    n.addEventListener('dblclick',e=>{
      e.stopPropagation();
      if(!CFG.get('singleClick',true))Sys.open(it.path);
    });
    n.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      if(!this.sel.has(it.path)){this.sel.clear();this.sel.add(it.path);this.paintSel();}
      this.iconMenu(e.clientX,e.clientY,[...this.sel]);
    });
    /* --- HTML5 原生拖曳（滑鼠） --- */
    n.addEventListener('dragstart',e=>{
      const paths=[...this.sel];
      const main=paths.indexOf(it.path)>=0?paths:[it.path];
      const dt=e.dataTransfer;
      dt.effectAllowed='copyMove';
      try{
        dt.setData('text/plain',main.map(p=>P.base(p)).join('\n'));
        dt.setData('application/x-liantang',JSON.stringify({paths:main,from:this.path()}));
      }catch(_){}
      /* 拖出到真實桌面：items.add(File) ＋ DownloadURL 雙保險 */
      if(main.length===1){
        const rec=DragCache.get(main[0]);
        if(rec&&rec.file){
          try{dt.items.add(rec.file);}catch(_){}
          try{
            if(rec.url)dt.setData('DownloadURL',rec.file.type+':'+rec.file.name+':'+rec.url);
          }catch(_){}
        }
      }else{
        main.forEach(p=>{const rec=DragCache.get(p);if(rec&&rec.file){try{dt.items.add(rec.file);}catch(_){}}});
      }
      n.classList.add('dragging');
      document.documentElement.classList.add('dragging');
      /* 自訂拖曳影像 */
      try{
        const g=$('#dragGhost');
        g.innerHTML='';
        main.slice(0,4).forEach((p,i)=>{
          const it2=this.items.find(x=>x.path===p)||{name:P.base(p),kind:'file'};
          const c2=this.mkIcon(it2,0,0);
          c2.style.position='absolute';c2.style.left=(i*10)+'px';c2.style.top=(i*10)+'px';
          g.appendChild(c2);
        });
        g.style.left='-999px';g.style.top='-999px';
        dt.setDragImage(g,28,28);
      }catch(_){}
    });
    n.addEventListener('dragend',()=>{
      n.classList.remove('dragging');
      document.documentElement.classList.remove('dragging');
      $$('.dicon.drop').forEach(x=>x.classList.remove('drop'));
      $('#dragGhost').innerHTML='';
      [...this.sel].forEach(p=>DragCache.release(p));
    });
    n.addEventListener('dragover',e=>{
      if(it.kind!=='dir')return;
      if(!e.dataTransfer.types||Array.prototype.indexOf.call(e.dataTransfer.types,'application/x-liantang')<0&&!this.isExternal(e))return;
      e.preventDefault();e.stopPropagation();
      e.dataTransfer.dropEffect='move';
      n.classList.add('drop');
    });
    n.addEventListener('dragleave',()=>n.classList.remove('drop'));
    n.addEventListener('drop',async e=>{
      n.classList.remove('drop');
      if(it.kind!=='dir')return;
      e.preventDefault();e.stopPropagation();
      const dest=it.path;
      if(this.isExternal(e)){await Sys.importDataTransfer(e.dataTransfer,dest);return;}
      let data=null;
      try{data=JSON.parse(e.dataTransfer.getData('application/x-liantang')||'null');}catch(_){}
      if(data&&data.paths){
        for(const p of data.paths){
          if(p===dest||p.indexOf(dest+'/')===0)continue;
          try{await fs.rename(p,await fs.unique(dest,P.base(p)));}
          catch(err){Toast.err('挪不動',P.base(p)+'：'+(err.message||err));}
        }
        this.refresh();
        Bus.emit('fs',dest);
      }
    });
    return n;
  },
  /* --- 觸控拖曳 --- */
  touchDrag(e,n,it){
    const t0=e.touches?e.touches[0]:e;
    const sx=t0.clientX,sy=t0.clientY;
    const paths=[...this.sel];
    const main=paths.indexOf(it.path)>=0?paths:[it.path];
    let started=false,ghost=null,over=null,startPos={x:parseFloat(n.style.left),y:parseFloat(n.style.top)};
    const mv=async(ev)=>{
      const t=ev.touches?ev.touches[0]:ev;
      if(!started){
        if(Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)<9)return;
        started=true;
        if(main.length===1&&it.kind==='file')DragCache.prep(it.path);
        ghost=el('div',{id:'dragGhostTouch',style:'position:fixed;z-index:9999;pointer-events:none;opacity:.86;transform:translate(-50%,-50%)'});
        main.slice(0,3).forEach((p,i)=>{
          const it2=this.items.find(x=>x.path===p)||{name:P.base(p),kind:'file'};
          const c2=this.mkIcon(it2,0,0);
          c2.style.position='absolute';c2.style.left=(i*9)+'px';c2.style.top=(i*9)+'px';c2.style.transform='translate(-50%,-50%)';
          ghost.appendChild(c2);
        });
        document.body.appendChild(ghost);
        n.style.opacity='.35';
      }
      ev.preventDefault();
      ghost.style.left=t.clientX+'px';ghost.style.top=t.clientY+'px';
      const el2=document.elementFromPoint(t.clientX,t.clientY);
      if(over&&over!==el2)over.classList&&over.classList.remove('drop');
      over=el2?el2.closest('.dicon,.fe-row,.fe-gi,.tree-n'):null;
      if(over&&over!==n)over.classList.add('drop');
    };
    const up=async(ev)=>{
      document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);document.removeEventListener('touchcancel',up);
      if(!started){return;}
      n.style.opacity='';
      if(ghost)ghost.remove();
      const t=(ev.changedTouches&&ev.changedTouches[0])||ev;
      const el2=document.elementFromPoint(t.clientX,t.clientY);
      if(over)over.classList.remove('drop');
      const target=el2?el2.closest('.dicon,.fe-row,.fe-gi,.tree-n'):null;
      if(target&&target!==n&&target.dataset.path&&target.dataset.kind==='dir'){
        for(const p of main){
          if(p===target.dataset.path||p.indexOf(target.dataset.path+'/')===0)continue;
          try{await fs.rename(p,await fs.unique(target.dataset.path,P.base(p)));}
          catch(err){Toast.err('挪不動',P.base(p)+'：'+(err.message||err));}
        }
        this.refresh();Bus.emit('fs',target.dataset.path);
        return;
      }
      if(target&&target.closest&&target.closest('.win')){
        /* 交給窗口處理（探測窗口自身 drop） */
        return;
      }
      /* 落在桌面 → 重新擺位 */
      const r=$('#desktop').getBoundingClientRect();
      const c=this.cell();
      let x=t.clientX-r.left-c.w/2+8, y=t.clientY-r.top-c.h/2+8;
      x=clamp(x,0,r.width-c.w);y=clamp(y,0,r.height-c.h);
      if(CFG.get('gridSnap',true)){x=Math.round(x/c.w)*c.w+8;y=Math.round((y-8)/c.h)*c.h+8;}
      for(const p of main){
        const node=this.nodes.get(p);
        if(!node)continue;
        const off={x:parseFloat(node.style.left)-startPos.x,y:parseFloat(node.style.top)-startPos.y};
        const nx=clamp(x+off.x,0,r.width-c.w),ny=clamp(y+off.y,0,r.height-c.h);
        node.style.transition='left .18s cubic-bezier(.2,1.3,.4,1),top .18s cubic-bezier(.2,1.3,.4,1)';
        node.style.left=nx+'px';node.style.top=ny+'px';
        setTimeout(()=>node.style.transition='',220);
        Meta.set(p,{pos:{x:nx,y:ny}});
      }
      Meta.flush();
    };
    document.addEventListener('touchmove',mv,{passive:false});
    document.addEventListener('touchend',up);
    document.addEventListener('touchcancel',up);
  },
  paintSel(){
    this.nodes.forEach((n,p)=>n.classList.toggle('sel',this.sel.has(p)));
  },
  layout(snap){
    const c=this.cell();
    this.nodes.forEach((n,p)=>{
      const m=Meta.get(p);
      if(!m||!m.pos)return;
      n.style.transition=snap?'left .3s cubic-bezier(.16,1,.3,1),top .3s cubic-bezier(.16,1,.3,1)':'';
      n.style.left=m.pos.x+'px';n.style.top=m.pos.y+'px';
      if(snap)setTimeout(()=>n.style.transition='',340);
    });
  },
  autoArrange(){
    const c=this.cell();
    const W=$('#desktop').clientWidth-12,H=$('#desktop').clientHeight-12;
    const cols=Math.max(1,Math.floor(W/c.w));
    const sorted=this.items.slice().sort((a,b)=>(b.kind===a.kind)?natcmp(a.name,b.name):(b.kind==='dir'?-1:1));
    sorted.forEach((it,i)=>{
      const x=8+(i%cols)*c.w, y=8+Math.floor(i/cols)*c.h;
      Meta.set(it.path,{pos:{x,y}});
      const n=this.nodes.get(it.path);
      if(n){n.style.transition='left .34s cubic-bezier(.16,1,.3,1),top .34s cubic-bezier(.16,1,.3,1)';n.style.left=x+'px';n.style.top=y+'px';setTimeout(()=>n.style.transition='',380);}
    });
    Meta.flush();
  },
  iconMenu(x,y,paths){
    const one=paths.length===1;
    const it=one?this.items.find(i=>i.path===paths[0]):null;
    const isDir=one&&it&&it.kind==='dir';
    const isFile=one&&it&&it.kind==='file';
    const m=[];
    m.push({label:'開啟',ico:'openBox',act:()=>Sys.open(paths[0])});
    if(isFile){
      const cands=Sys.openCandidates(paths[0]);
      m.push({label:'開啟方式',ico:'box',sub:cands.map(c=>({label:c.name+(Meta.get(paths[0])&&Meta.get(paths[0]).openWith===c.id?' ✓':''),ico:c.icon,act:()=>Sys.openWith(paths[0],c.id)}))});
      m.push({label:'編輯源碼',ico:'aEditor',act:()=>WM.open('editor',{path:paths[0]}),dis:!isTextKind(paths[0])&&!['svg','json','xml'].includes(P.ext(paths[0]))});
    }
    if(isDir)m.push({label:'在翻檢閣中開啟',ico:'aExplorer',act:()=>WM.open('explorer',{path:paths[0]})});
    m.push('-');
    m.push({label:'改名',ico:'pencil',act:async()=>{
      const nn=await Dlg.prompt('改名','為「'+P.base(paths[0])+'」另立新名',P.base(paths[0]));
      if(!nn||nn===P.base(paths[0]))return;
      try{await fs.rename(paths[0],P.dir(paths[0])+'/'+nn);this.refresh();Bus.emit('fs',P.dir(paths[0]));}
      catch(e){Toast.err('改不了',e.message||String(e));}
    },dis:!one});
    m.push({label:'複製',ico:'copy',key:'Ctrl+C',act:()=>{Sys.clip={paths:paths.slice(),op:'copy'};Toast.ok('已記下',paths.length+' 魂待複製');}});
    m.push({label:'剪下',ico:'cut',key:'Ctrl+X',act:()=>{Sys.clip={paths:paths.slice(),op:'cut'};Toast.ok('已記下',paths.length+' 魂待搬移');}});
    if(Sys.clip)m.push({label:'貼上',ico:'paste',key:'Ctrl+V',act:()=>Sys.paste(this.path())});
    m.push({label:'導出到陽世',ico:'download',act:async()=>{for(const p of paths)await Sys.download(p);}});
    m.push('-');
    m.push({label:'魂訊（屬性）',ico:'info',act:()=>Sys.info(paths[0])});
    m.push({label:'焚化（刪除）',ico:'burn',dgr:true,key:'Del',act:()=>Sys.removePaths(paths,()=>this.refresh())});
    return Menu.show(x,y,m);
  },
  emptyMenu(x,y,e){
    const dp=this.path();
    Menu.show(x,y,[
      {head:'靈堂 · 桌面'},
      {label:'重新整理',ico:'refresh',key:'F5',act:()=>this.refresh()},
      {label:'自動排列牌位',ico:'grid',act:()=>this.autoArrange()},
      {label:'對齊網格',ico:'check',on:CFG.get('gridSnap',true),act:()=>{CFG.set('gridSnap',!CFG.get('gridSnap'));}},
      '-',
      {label:'新建棺匣（資料夾）',ico:'folder',act:()=>Sys.newItem(dp,'dir',()=>this.refresh())},
      {label:'新建疏文（文字檔）',ico:'ftext',act:()=>Sys.newItem(dp,'file','未名疏文.txt',()=>this.refresh())},
      {label:'新建符籙（HTML）',ico:'fcode',act:()=>Sys.newItem(dp,'file','新符.html',()=>this.refresh(),Sys.HTML_SEED)},
      '-',
      {label:'自陽世導入…',ico:'upload',act:()=>Sys.pickFiles(dp)},
      {label:'掛載陽世卷宗…',ico:'mount',act:()=>Sys.mountLocal()},
      {label:'更換壁紙…',ico:'fimg',act:()=>Sys.pickWallpaper()},
      '-',
      {label:'全選',ico:'selectAll',key:'Ctrl+A',act:()=>{this.items.forEach(i=>this.sel.add(i.path));this.paintSel();}},
      {label:'貼上',ico:'paste',dis:!Sys.clip,act:()=>Sys.paste(dp)},
      '-',
      {label:'壇規（設定）',ico:'aSet',act:()=>WM.open('settings')},
      {label:'顯示全部應用',ico:'seal',act:()=>StartMenu.show()}
    ]);
  },
  selectAll(){this.items.forEach(i=>this.sel.add(i.path));this.paintSel();}
};

/* ---------- 事件匯流 ---------- */
const Bus={
  h:{},
  on(k,fn){(this.h[k]=this.h[k]||[]).push(fn);return ()=>{this.h[k]=this.h[k].filter(f=>f!==fn);};},
  emit(k,v){(this.h[k]||[]).forEach(f=>{try{f(v);}catch(e){console.warn(e);}});}
};

/* ---------- 全域調度 ---------- */
Object.assign(Sys,{
  clip:null,
  HTML_SEED:'<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>新符</title>\n<style>\n  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0908;color:#ece2d2;\n       font-family:"Noto Serif SC",serif}\n  .card{border:1px solid #c22b1e;padding:38px 46px;text-align:center;box-shadow:0 0 60px -20px #c22b1e}\n  h1{font-size:30px;letter-spacing:.3em;margin:0 0 10px;color:#d9b25e}\n  p{opacity:.7;letter-spacing:.16em;font-size:13px}\n</style>\n</head>\n<body>\n  <div class="card">\n    <h1>符 已成</h1>\n    <p>此頁由殮堂符籙编辑器所書 · 可即時預覽</p>\n  </div>\n<script>\n  document.querySelector("h1").addEventListener("click",e=>{\n    e.target.textContent = "符 已 動";\n  });\n<\/script>\n</body>\n</html>\n',
  MD_SEED:'# 疏文\n\n> 夜深了，別回頭。\n\n## 一、守夜須知\n\n1. 燈要留一盞\n2. 門要留一縫\n3. 名字不要念完\n\n---\n\n*寫於第 N 夜*\n',
  CSV_SEED:'牌位,亡者,忌日,供品,狀態\n甲字一號,無名氏,1987-07-14,白飯三碗,已安\n甲字二號,李家女,1993-11-02,桂花糕,未安\n乙字七號,過路客,2001-03-30,清水,失蹤\n',
  /* ---- 開啟調度：先 stat 判類型 ---- */
  async open(path,force){
    let st;
    try{st=await fs.stat(path);}catch(e){Toast.err('喚不出',P.base(path)+'：'+(e.message||e));return;}
    if(st.kind==='dir'){
      WM.open('explorer',{path});
      return;
    }
    const m=Meta.get(path)||{};
    const app=force||m.openWith||this.appFor(path);
    if(app){WM.open(app,{path,name:st.name});return;}
    this.openWithDialog(path);
  },
  appFor(path){
    const e=P.ext(path),k=kindOf(path);
    const da=CFG.get('defaultApp',{})[e];
    if(da&&Apps[da])return da;
    if(e==='csv'||e==='tsv')return 'notepad';
    if(k==='img')return 'viewer';
    if(k==='aud'||k==='vid')return 'media';
    if(e==='pdf')return 'viewer';
    if(k==='zip')return 'archive';
    if(k==='code'){
      if(e==='html'||e==='htm')return 'htmlgate';
      return 'editor';
    }
    if(k==='text')return 'notepad';
    if(k==='disc')return 'v86';
    if(isTextKind(path))return 'notepad';
    return 'notepad';
  },
  openCandidates(path){
    const e=P.ext(path);
    const out=[];
    const add=(id,label)=>{if(Apps[id])out.push({id,name:Apps[id].name,icon:Apps[id].icon,label});};
    if(isImg(path)){add('viewer');}
    if(e==='pdf'){add('viewer');add('browser');}
    if(isTextKind(path)||kindOf(path)==='code'){add('notepad');add('editor');}
    if(e==='html'||e==='htm'){add('htmlgate');add('browser');add('editor');add('notepad');}
    if(kindOf(path)==='aud'||kindOf(path)==='vid'){add('media');}
    if(kindOf(path)==='zip'){add('archive');}
    if(kindOf(path)==='disc'){add('v86');}
    add('viewer');add('notepad');add('editor');add('browser');add('media');
    const seen={},fin=[];
    out.forEach(o=>{if(!seen[o.id]){seen[o.id]=1;fin.push(o);}});
    return fin;
  },
  openWithDialog(path){
    const cands=this.openCandidates(path);
    const layer=$('#dlgs');
    const d=el('div',{class:'dlg'});
    d.innerHTML='<div class="dlg-h">'+ICO.openBox+'<b>開啟方式</b></div>'+
      '<div class="dlg-b"><div style="color:var(--bone-3);font-size:11.5px;margin-bottom:11px;line-height:1.7">「'+esc(P.base(path))+'」· '+esc(KIND_ZH[kindOf(path)]||'異物')+' · 擇一召之</div>'+
      '<div class="ow">'+cands.map(c=>'<button data-a="'+c.id+'">'+(ICO[c.icon]||ICO.file)+'<b>'+esc(c.name)+'</b><i>'+esc(c.id)+'</i></button>').join('')+'</div>'+
      '<label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:11.5px;color:var(--bone-3);cursor:pointer"><input type="checkbox" id="owAlways" style="width:auto;margin:0"> 此後 .'+esc(P.ext(path)||'??')+' 一律以此法開啟</label></div>'+
      '<div class="dlg-f"><button class="btn" data-x="0">罷手</button><button class="btn" data-x="text">以純文本強開</button></div>';
    layer.innerHTML='';layer.appendChild(d);layer.classList.add('on');
    const close=()=>{layer.classList.remove('on');layer.innerHTML='';document.removeEventListener('keydown',onk);layer.onclick=null;};
    const onk=e=>{if(e.key==='Escape')close();};
    document.addEventListener('keydown',onk);

  /* ---- 剪貼 ---- */
  async paste(dir){
    if(!this.clip||!this.clip.paths.length){Toast.info('手中無物','先複製或剪下些什麼');return;}
    let n=0;
    for(const p of this.clip.paths){
      try{
        const target=await fs.unique(dir,P.base(p));
        if(this.clip.op==='cut'){await fs.rename(p,target);}
        else{await fs.copy(p,target,{preserve:true});}
        n++;
      }catch(e){Toast.err('貼不上',P.base(p)+'：'+(e.message||e));}
    }

  /* ---- 導出到陽世（真實桌面） ---- */
  async download(path){
    try{
      const st=await fs.stat(path);
      if(st.kind==='dir'){
        Toast.info('正在封匣','資料夾需先殮封為 zip');
        if(!window.JSZip)await Lazy.jszip();
        if(!window.JSZip){Toast.err('無殮封術','JSZip 載入失敗');return;}
        const zip=new JSZip();
        const walk=async(p,base)=>{
          const kids=await fs.readdir(p);
          for(const k of kids){
            if(k.kind==='dir'){zip.folder(base+k.name);await walk(k.path,base+k.name+'/');}
            else{const b=await fs.readFile(k.path,'blob');zip.file(base+k.name,b,{date:new Date(k.mtime||Date.now())});}
          }
        };
        await walk(path,st.name+'/');
        const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'},null);
        this.saveBlob(blob,st.name+'.zip');
        Toast.ok('已封匣',st.name+'.zip 擲出靈堂');
        return;
      }
      const blob=await fs.readFile(path,'blob');
      const typed=blob.type?blob:new Blob([blob],{type:MIME(st.name)});
      this.saveBlob(typed,st.name);
      Toast.ok('已導出',st.name+' 已擲往陽世');
    }catch(e){Toast.err('導不出',e.message||String(e));}
  },
  saveBlob(blob,name){
    const url=URL.createObjectURL(blob);
    const a=el('a',{href:url,download:name});
    document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);},60);
  },
  /* ---- 導入（選擇器） ---- */
  pickFiles(dir){
    const inp=$('#filePicker');
    inp.value='';
    inp.onchange=async()=>{
      if(!inp.files.length)return;
      await this.importFiles([...inp.files],dir);

  },
  async importFiles(files,dir,relBase){
    let n=0,fail=0;
    const t=Toast.show('招魂中','正在寫入 '+files.length+' 魂…','',99999);
    for(const f of files){
      try{
        const rel=(relBase||'')+f.name;
        const target=await fs.unique(dir,rel);
        await fs.mkdirp(P.dir(target));
        /* 保留原始修改時間 —— 重點 */
        await fs.writeFile(target,f,{mtime:f.lastModified||Date.now()});
        n++;
      }catch(e){fail++;console.warn(e);}
    }
    t.remove();
    Toast.ok('招魂完成',n+' 魂入'+P.base(dir)+(fail?'，'+fail+' 魂未入':''));
    Bus.emit('fs',dir);
    if(dir===Desktop.path())Desktop.refresh();
    return n;
  },
  /* ---- 導入（拖曳 DataTransfer，遞迴目錄） ---- */
  async importDataTransfer(dt,dir){
    const files=[];
    const items=dt.items;
    let usedEntries=false;
    if(items&&items.length&&items[0].webkitGetAsEntry){
      const entries=[];
      for(let i=0;i<items.length;i++){
        const en=items[i].webkitGetAsEntry();
        if(en)entries.push(en);
      }
      if(entries.length){
        usedEntries=true;
        for(const en of entries)await this.walkEntry(en,files,'');
      }
    }
    if(!usedEntries&&dt.files&&dt.files.length){
      for(const f of dt.files)files.push({file:f,rel:''});
    }
    if(!files.length){Toast.info('空手','未接住任何魂');return 0;}
    let n=0;
    const t=Toast.show('招魂中','正在寫入 '+files.length+' 魂…','',99999);
    for(const rec of files){
      try{
        const f=rec.file;
        const rel=(rec.rel||'').replace(/\\/g,'/');
        const target=rel?P.norm(dir+'/'+rel):await fs.unique(dir,f.name);
        await fs.mkdirp(P.dir(target));
        /* 嚴禁 Buffer.from —— 一律 arrayBuffer() */
        const buf=await f.arrayBuffer();
        await fs.writeFile(target,new Blob([buf],{type:f.type||MIME(f.name)}),{mtime:f.lastModified||Date.now()});
        n++;
      }catch(e){console.warn('導入失敗',e);}
    }
    t.remove();
    Toast.ok('招魂完成',n+' / '+files.length+' 魂入 '+P.base(dir));
    Bus.emit('fs',dir);
    if(dir===Desktop.path())Desktop.refresh();
    return n;
  },
  async walkEntry(entry,out,base){
    if(!entry)return;
    if(entry.isFile){
      const file=await new Promise((res,rej)=>entry.file(res,rej));
      out.push({file,rel:base+entry.name});
    }else if(entry.isDirectory){
      const reader=entry.createReader();
      const all=[];
      /* readEntries 每次最多 100 條，必須循環直到空 */
      for(;;){
        const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
        if(!batch||!batch.length)break;
        all.push.apply(all,batch);
      }
      for(const kid of all)await this.walkEntry(kid,out,base+entry.name+'/');
    }
  },
  pickWallpaper(){
    const inp=$('#imgPicker');

window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  if(e.key==='Escape'){
    Menu.hide();
    if(StartMenu.open)StartMenu.hide();
    $('#calPop').classList.remove('on');
  }
  if(typing)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='a'&&!e.target.closest('.win')){e.preventDefault();Desktop.selectAll();}
  if(e.key==='Delete'&&Desktop.sel.size&&!e.target.closest('.win')){
    Sys.removePaths([...Desktop.sel],()=>Desktop.refresh());
  }
  if(mod&&e.key.toLowerCase()==='c'&&Desktop.sel.size&&!e.target.closest('.win')){
    Sys.clip={paths:[...Desktop.sel],op:'copy'};Toast.ok('已記下',Desktop.sel.size+' 魂待複製');
  }
  if(mod&&e.key.toLowerCase()==='x'&&Desktop.sel.size&&!e.target.closest('.win')){
    Sys.clip={paths:[...Desktop.sel],op:'cut'};Toast.ok('已記下',Desktop.sel.size+' 魂待搬移');
  }
  if(mod&&e.key.toLowerCase()==='v'&&Sys.clip&&!e.target.closest('.win')){
    e.preventDefault();Sys.paste(Desktop.path());
  }
  if(e.key==='F5'&&!e.target.closest('.win')){e.preventDefault();Desktop.refresh();}
  if(e.key==='F11'){e.preventDefault();const w=WM.topWin();if(w)WM.toggleFs(w.ctx.id);}
});
