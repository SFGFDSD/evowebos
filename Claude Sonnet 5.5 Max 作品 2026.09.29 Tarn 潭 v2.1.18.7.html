<style>
/* =====================================================================
   TARN · 等深绽放 (Isobath Bloom)
   设计概念：把整个桌面当作一张夜间湖泊的水深测绘图——
   等深线是纹理，刻度尺是边界，生物荧光只在需要的地方亮起。
   ===================================================================== */
:root{
  --font-ui:"Familjen Grotesk","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"Martian Mono","JetBrains Mono","Sarasa Mono SC","Noto Sans Mono CJK SC",ui-monospace,Menlo,Consolas,monospace;
  --font-disp:"Fraunces","Noto Serif SC","Songti SC",Georgia,serif;
  --tb-h:48px;--r:6px;--blur:18px;
  --ease:cubic-bezier(.22,.9,.24,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --acc:#ff6a4a;--acc-rgb:255,106,74;--acc2:#54f0c2;
  --cw:92px;--ch:104px;--isz:52px;
}
:root[data-theme=dark]{
  --bg0:#040d0d;--bg1:#081615;--bg2:#0d2120;
  --surf:rgba(8,22,21,.8);--surf2:rgba(11,27,26,.93);--surf3:rgba(22,48,45,.92);--solid:#0b1b1a;
  --ink:#ece6d3;--ink2:#a9b8ad;--ink3:#6c827e;--ink-rgb:236,230,211;
  --line:rgba(190,235,220,.12);--line2:rgba(190,235,220,.24);
  --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.03) inset;
}
:root[data-theme=light]{
  --bg0:#dfe3d2;--bg1:#e9ebdc;--bg2:#f3f2e6;
  --surf:rgba(240,240,225,.84);--surf2:rgba(248,247,238,.95);--surf3:rgba(226,229,210,.95);--solid:#f4f3e7;
  --ink:#10251f;--ink2:#41584f;--ink3:#7a8c82;--ink-rgb:16,37,31;
  --line:rgba(16,37,31,.13);--line2:rgba(16,37,31,.28);
  --shadow:0 16px 40px rgba(30,50,40,.24);--acc2:#0e7a62;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);font:400 14px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(var(--acc-rgb),.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--acc-rgb),.55);background-clip:padding-box}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
.no-anim *,.no-anim *::before,.no-anim *::after{animation-duration:.001s!important;transition-duration:.001s!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes iconIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes winIn{from{opacity:0;transform:translateY(16px) scale(.965)}to{opacity:1;transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.96) translateY(8px)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(8%,6%,0) scale(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stag{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- 通用控件 ---------- */
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:5px;border:1px solid var(--line2);background:rgba(var(--ink-rgb),.04);font-weight:500;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap;flex:none}
.btn:hover{background:rgba(var(--acc-rgb),.14);border-color:rgba(var(--acc-rgb),.55)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1b0a05;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{border-color:rgba(255,90,70,.55);color:#ff9d8b}
.btn.dng:hover{background:rgba(255,90,70,.2)}
.btn:disabled,.ibtn:disabled{opacity:.35;pointer-events:none}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:5px;color:var(--ink2);flex:none;transition:background .15s,color .15s}
.ibtn:hover{background:rgba(var(--acc-rgb),.16);color:var(--ink)}
.ibtn.on{background:rgba(var(--acc-rgb),.24);color:var(--acc)}
.inp{height:30px;padding:0 10px;border-radius:5px;border:1px solid var(--line2);background:rgba(var(--ink-rgb),.05);outline:0;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18)}
select.inp{padding-right:4px}
select option{background:var(--bg1);color:var(--ink)}
.bar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.bar>*{flex:none}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.grow{flex:1 1 auto!important;min-width:0}
.stat{display:flex;align-items:center;gap:14px;padding:3px 12px;border-top:1px solid var(--line);font:11px var(--font-mono);color:var(--ink3);flex:none;overflow:hidden;white-space:nowrap;min-height:24px}
.mut{color:var(--ink3)}.mono{font-family:var(--font-mono)}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:rgba(var(--ink-rgb),.14);transition:.2s;flex:none;cursor:pointer;border:1px solid var(--line2)}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--ink2);transition:.28s var(--ease-spring)}
.sw.on{background:rgba(var(--acc-rgb),.35);border-color:var(--acc)}.sw.on::after{left:20px;background:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;flex:none}
.seg button{padding:0 12px;height:28px;color:var(--ink2);transition:.15s;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:rgba(var(--acc-rgb),.12)}
.seg button.on{background:rgba(var(--acc-rgb),.26);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.chip.on{background:rgba(var(--acc-rgb),.22);color:var(--ink);border-color:var(--acc)}
.empty{display:grid;place-items:center;text-align:center;color:var(--ink3);padding:30px;height:100%;gap:8px}
.spin{animation:spin 1s linear infinite}
.drop-hot{outline:2px dashed var(--acc)!important;outline-offset:-2px;background:rgba(var(--acc-rgb),.14)!important}

/* ---------- 桌面 ---------- */
#os{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea,select,[contenteditable],.CodeMirror,.CodeMirror *,.allow-select,.allow-select *{user-select:text;-webkit-user-select:text}
.btn.ghost.on{background:rgba(var(--acc-rgb),.22)}
#desktop{position:absolute;inset:0;overflow:hidden;background:var(--bg0)}
#wallcv,#wallimg{position:absolute;inset:0;width:100%;height:100%}
#wallimg{background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .9s}
#wallimg.on{opacity:1}
#wallfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none;animation:drift 34s ease-in-out infinite alternate}
#wallfx i:nth-child(1){width:46vmax;height:46vmax;left:-10vmax;top:-14vmax;background:var(--acc)}
#wallfx i:nth-child(2){width:40vmax;height:40vmax;right:-12vmax;bottom:-10vmax;background:var(--acc2);animation-duration:46s;animation-direction:alternate-reverse}
.nofx #wallfx{display:none}
#icons{position:absolute;inset:0;touch-action:none}
.dicon{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;padding:7px 4px;gap:5px;border-radius:7px;cursor:default;touch-action:none;
  transition:left .34s var(--ease),top .34s var(--ease),background .15s,box-shadow .15s,opacity .3s;animation:iconIn .55s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:rgba(var(--acc-rgb),.2);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.75)}
.dicon.cut{opacity:.45}
.dicon-img{width:var(--isz);height:var(--isz);flex:none;display:grid;place-items:center;filter:drop-shadow(0 5px 9px rgba(0,0,0,.5));pointer-events:none}
.dicon-img svg{width:100%;height:100%}
.dicon-name{font-size:12.5px;line-height:1.25;text-align:center;color:#f4f0df;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 9px rgba(0,0,0,.6);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;pointer-events:none}
#desktop[data-wall=light] .dicon-name{color:#0d2119;text-shadow:0 1px 0 rgba(255,255,255,.55)}
#desktop[data-wall=light] .dicon-img{filter:drop-shadow(0 4px 6px rgba(20,40,30,.3))}
.dicon input.rn{width:100%;height:22px;font-size:12px;text-align:center;background:var(--solid);border:1px solid var(--acc);border-radius:3px;outline:0;color:var(--ink);pointer-events:auto}
.hide-icons #icons{display:none}
#cellhint{position:absolute;border:1px dashed rgba(var(--acc-rgb),.85);background:rgba(var(--acc-rgb),.1);border-radius:8px;pointer-events:none;opacity:0;transition:opacity .15s,left .1s,top .1s;z-index:2}
#rubber{position:absolute;border:1px solid var(--acc);background:rgba(var(--acc-rgb),.13);display:none;pointer-events:none;z-index:3}

/* ---------- 窗口 ---------- */
#windows{position:absolute;inset:0;z-index:10;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(1.25);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);pointer-events:auto;color:var(--ink)}
.win::before{content:"";position:absolute;inset:-7px;pointer-events:none;z-index:3;--t:var(--tick,rgba(var(--ink-rgb),.22));
  background:linear-gradient(var(--t),var(--t)) 0 0/10px 1px no-repeat,linear-gradient(var(--t),var(--t)) 0 0/1px 10px no-repeat,linear-gradient(var(--t),var(--t)) 100% 0/10px 1px no-repeat,linear-gradient(var(--t),var(--t)) 100% 0/1px 10px no-repeat,
  linear-gradient(var(--t),var(--t)) 0 100%/10px 1px no-repeat,linear-gradient(var(--t),var(--t)) 0 100%/1px 10px no-repeat,linear-gradient(var(--t),var(--t)) 100% 100%/10px 1px no-repeat,linear-gradient(var(--t),var(--t)) 100% 100%/1px 10px no-repeat;transition:.25s}
.win.active{--tick:var(--acc);border-color:rgba(var(--acc-rgb),.42)}
.win.max,.win.snapped{border-radius:0}.win.max::before,.win.snapped::before{display:none}
.win.opening{animation:winIn .3s var(--ease)}
.win.closing{animation:winOut .18s ease-in forwards;pointer-events:none}
.win.anim{transition:left .27s var(--ease),top .27s var(--ease),width .27s var(--ease),height .27s var(--ease)}
.win.minimizing{transform:translate(var(--mx,0),var(--my,300px)) scale(.12);opacity:0;transition:transform .27s var(--ease),opacity .22s;pointer-events:none}
.win.min{display:none}
.win-title{height:38px;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;flex:none;touch-action:none;cursor:default;position:relative;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(180deg,rgba(var(--ink-rgb),.05),transparent),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 8px) left bottom/100% 4px no-repeat;border-bottom:1px solid var(--line)}
.win:not(.active) .win-title{opacity:.72}
.win-ico{width:20px;height:20px;flex:none;display:grid;place-items:center}.win-ico svg{width:20px;height:20px}
.win-name{font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.win-actions{display:flex;gap:2px;margin-left:8px}
.win-drag{flex:1;height:100%}
.win-ctl{display:flex;gap:2px;margin-left:auto}
.wc{width:38px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--ink2);transition:background .15s,color .15s}
.wc svg{width:14px;height:14px}
.wc:hover{background:rgba(var(--ink-rgb),.12);color:var(--ink)}
.wc.x:hover{background:var(--acc);color:#1b0a05}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:0 0 var(--r) var(--r)}
.rz{position:absolute;z-index:4;touch-action:none}
.rz[data-d=n]{left:8px;right:8px;top:-4px;height:8px;cursor:ns-resize}.rz[data-d=s]{left:8px;right:8px;bottom:-4px;height:8px;cursor:ns-resize}
.rz[data-d=e]{top:8px;bottom:8px;right:-4px;width:8px;cursor:ew-resize}.rz[data-d=w]{top:8px;bottom:8px;left:-4px;width:8px;cursor:ew-resize}
.rz[data-d=ne]{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}.rz[data-d=nw]{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz[data-d=se]{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}.rz[data-d=sw]{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.win.max .rz{display:none}
#windows.dragging iframe,#windows.dragging video,#windows.dragging embed{pointer-events:none!important}
#windows.peeking .win:not(.peek-on){opacity:.05!important;pointer-events:none!important;transition:opacity .22s}
#windows.peeking .win.peek-on{z-index:4500!important;box-shadow:0 0 0 1px var(--acc),var(--shadow)}
.win.peek-show{display:flex!important;visibility:visible!important;transform:none!important;opacity:1!important}
#windows.deskpeek .win{opacity:.06!important;pointer-events:none!important;transition:opacity .25s}
#snap{position:fixed;z-index:5000;border:1px solid var(--acc);background:rgba(var(--acc-rgb),.14);border-radius:8px;pointer-events:none;opacity:0;transition:left .2s var(--ease),top .2s var(--ease),width .2s var(--ease),height .2s var(--ease),opacity .18s;box-shadow:inset 0 0 40px rgba(var(--acc-rgb),.18)}
#snap.on{opacity:1}

/* ---------- 任务栏 / 底部 Dock ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:6000;display:flex;align-items:center;gap:4px;padding:0 6px env(safe-area-inset-bottom);background:var(--surf);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);border-top:1px solid var(--line2);box-sizing:content-box}
#taskbar::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 8px) 0 100%/100% 3px no-repeat,repeating-linear-gradient(90deg,rgba(var(--acc-rgb),.6) 0 1px,transparent 1px 40px) 0 100%/100% 6px no-repeat;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tbtn{position:relative;min-width:44px;height:40px;display:grid;place-items:center;border-radius:6px;flex:none;transition:background .15s,transform .25s var(--ease-spring)}
.tbtn svg{width:26px;height:26px;transition:transform .25s var(--ease-spring)}
.tbtn:hover{background:rgba(var(--acc-rgb),.13)}.tbtn:hover svg{transform:translateY(-2px) scale(1.06)}
.tbtn:active svg{transform:scale(.92)}
.tbtn.run::after{content:"";position:absolute;bottom:1px;left:50%;width:5px;height:2px;margin-left:-2.5px;background:var(--ink3);transition:.3s var(--ease)}
.tbtn.act::after{width:20px;margin-left:-10px;background:var(--acc);box-shadow:0 0 9px var(--acc)}
.tbtn.act{background:rgba(var(--acc-rgb),.1)}
.tbtn.mn{opacity:.6}
#tb-start svg{width:28px;height:28px}
#tb-start.open{background:rgba(var(--acc-rgb),.2)}
#tb-mid{flex:1;min-width:0;display:flex;overflow:hidden}
#tb-tasks{display:flex;gap:2px;margin:0 auto 0 0;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#tb-tasks::-webkit-scrollbar{display:none}
[data-align=center] #tb-tasks{margin:0 auto}
#tb-tray{display:flex;align-items:center;gap:2px;flex:none}
#tb-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:2px 10px;border-radius:6px;line-height:1.15;height:40px;transition:background .15s}
#tb-clock:hover{background:rgba(var(--acc-rgb),.13)}
#tb-clock .t{font:600 13px var(--font-mono);letter-spacing:-.02em}#tb-clock .d{font-size:11px;color:var(--ink2)}
#tb-peek{width:12px;height:40px;margin-left:4px;border-left:1px solid var(--line2);transition:background .2s,width .2s;display:grid;place-items:center}
#tb-peek svg{display:none;width:20px;height:20px}
#tb-peek:hover{background:rgba(var(--acc-rgb),.22)}
.pop{position:fixed;z-index:6500;background:var(--surf2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(calc(var(--blur) + 6px)) saturate(1.3);-webkit-backdrop-filter:blur(calc(var(--blur) + 6px)) saturate(1.3);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .3s var(--ease),visibility 0s .3s}
.pop.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
#peekcard{display:flex;gap:10px;padding:10px;bottom:calc(var(--tb-h) + 14px);max-width:calc(100vw - 16px);overflow-x:auto}
.pk{width:210px;flex:none;border-radius:7px;border:1px solid var(--line2);padding:6px;cursor:pointer;background:rgba(var(--ink-rgb),.04);transition:background .15s,border-color .15s;position:relative}
.pk:hover{background:rgba(var(--acc-rgb),.16);border-color:var(--acc)}
.pk-h{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;height:22px}
.pk-h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-x{width:22px;height:22px;display:grid;place-items:center;border-radius:4px}.pk-x:hover{background:var(--acc);color:#1b0a05}.pk-x svg{width:12px;height:12px}
.thumb{position:relative;overflow:hidden;background:var(--solid);border:1px solid var(--line);border-radius:4px;pointer-events:none}
.thumb>.win{pointer-events:none;position:absolute!important;left:0!important;top:0!important;transform-origin:0 0;display:flex!important;animation:none!important;opacity:1!important;visibility:visible!important;box-shadow:none;backdrop-filter:none}
#taskview{position:fixed;inset:0;z-index:6400;background:rgba(2,9,9,.72);backdrop-filter:blur(14px);display:none;padding:28px 22px calc(var(--tb-h) + 24px);overflow:auto}
#taskview.open{display:block;animation:fade .2s}

.st-body{overflow-y:auto;padding:4px 14px 10px;flex:1}
.st-sec{font:600 11px var(--font-mono);letter-spacing:.14em;color:var(--ink3);margin:12px 2px 8px;text-transform:uppercase}

.st-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:8px;font-size:12px;text-align:center;transition:background .15s,transform .25s var(--ease-spring);animation:stag .45s var(--ease) both;animation-delay:calc(var(--i)*22ms)}
.st-app svg{width:40px;height:40px;transition:transform .3s var(--ease-spring)}
.st-app:hover{background:rgba(var(--acc-rgb),.14)}.st-app:hover svg{transform:translateY(-3px) rotate(-2deg) scale(1.08)}

.st-item svg.fi,.st-item .ic{width:24px;height:24px;flex:none}

.modal::before{content:"";position:absolute;left:0;top:0;width:44px;height:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}

.modal-b{padding:6px 20px 16px;color:var(--ink2);overflow:auto;word-break:break-word}
.modal-b .inp{width:100%;height:36px;margin-top:8px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(var(--ink-rgb),.03);flex-wrap:wrap}

.toast button.ta{margin-left:auto;color:var(--acc);font-weight:600;padding:2px 6px;border-radius:4px}.toast button.ta:hover{background:rgba(var(--acc-rgb),.16)}
