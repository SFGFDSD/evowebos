<style>
/* ================= 0. TOKENS ================= */
:root{
  --ui: "Chakra Petch", "Noto Sans SC", sans-serif;
  --mono: "Martian Mono", ui-monospace, "Noto Sans SC", monospace;
  --serif: "Instrument Serif", "Noto Sans SC", serif;
  --radius: 3px;
  --tb-h: 48px;
  --grid: 96px;
  --gap: 8px;
  --dur: 220ms;
  --ease: cubic-bezier(.22,.68,0,1);
  --scale: 1;
}
html[data-theme="dark"]{
  --bg:#0a0c0f; --bg2:#0f1216; --panel:#14181d; --panel2:#1a1f26;
  --line:#2b323b; --line2:#3a434e; --ink:#e7ecf1; --ink2:#98a4b1; --ink3:#61707e;
  --acc:#ff5f1f; --acc-ink:#0a0c0f; --acc2:#2fd6c3; --warn:#ffc857; --bad:#ff4d5e;
  --shadow: 0 24px 60px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  --glass: rgba(20,24,29,.82); --hl: rgba(255,255,255,.06);
}
html[data-theme="light"]{
  --bg:#e6e2d8; --bg2:#dcd7cb; --panel:#f6f3ec; --panel2:#eae5da;
  --line:#c3bcae; --line2:#a99f8d; --ink:#1b1a17; --ink2:#57534a; --ink3:#837c6f;
  --acc:#c2410c; --acc-ink:#fff8f2; --acc2:#0f766e; --warn:#a16207; --bad:#b91c1c;
  --shadow: 0 22px 50px -20px rgba(60,50,35,.45), 0 0 0 1px rgba(0,0,0,.06);
  --glass: rgba(246,243,236,.88); --hl: rgba(0,0,0,.04);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden}
body{
  font-family:var(--ui); background:var(--bg); color:var(--ink);
  font-size:calc(13.5px * var(--scale)); line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  user-select:none; overscroll-behavior:none;
}
button,input,select,textarea{font:inherit; color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2); border:2px solid transparent; background-clip:content-box; border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--ink3); background-clip:content-box}
.svgico{display:block; width:100%; height:100%; overflow:visible}
button.svgbtn{background:none;border:0;padding:0;cursor:pointer;color:inherit;line-height:0}

/* ================= 1. AURA / BACKDROP ================= */
#grain{position:fixed; inset:0; z-index:9000; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#scan{position:fixed; inset:0; z-index:8999; pointer-events:none; opacity:.35;
  background:repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,.09) 3px 4px)}
html[data-theme="light"] #scan{display:none}
#stage{position:fixed; inset:0; overflow:hidden}
#wall{position:absolute; inset:0; background-size:cover; background-position:center; transition:filter var(--dur), background-image .4s}
#wall.wp-1{background-image:
  radial-gradient(1200px 700px at 78% 12%, rgba(255,95,31,.30), transparent 62%),
  radial-gradient(900px 600px at 12% 88%, rgba(47,214,195,.20), transparent 60%),
  linear-gradient(160deg,#0b0d11 0%, #14181d 46%, #0a0c0f 100%)}
#wall.wp-2{background-image:
  linear-gradient(0deg, rgba(10,12,15,.92), rgba(10,12,15,.55)),
  repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 64px),
  repeating-linear-gradient(0deg, rgba(255,255,255,.055) 0 1px, transparent 1px 64px),
  radial-gradient(1000px 800px at 50% 120%, #2a1a10, #0a0c0f 70%)}
#wall.wp-3{background-image:
  conic-gradient(from 210deg at 20% 30%, #10312d, #0a0c0f 35%, #2c1a0d 65%, #0a0c0f),
  linear-gradient(#0a0c0f,#0a0c0f)}
#wall.wp-4{background-image:
  radial-gradient(closest-side at 50% 45%, rgba(255,200,87,.35), transparent 70%),
  repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,255,255,.045) 0deg 6deg, transparent 6deg 12deg),
  linear-gradient(#11151a,#08090b)}
#wall.wp-5{background-image:
  linear-gradient(115deg,#f4efe4 0%, #e6dfd0 40%, #d8cfc0 100%),
  repeating-linear-gradient(45deg, rgba(27,26,23,.035) 0 2px, transparent 2px 14px)}
#wall.wp-6{background-image:
  radial-gradient(900px 500px at 15% 20%, rgba(194,65,12,.22), transparent 65%),
  repeating-linear-gradient(0deg, rgba(27,26,23,.05) 0 1px, transparent 1px 26px),
  linear-gradient(#efeade,#ded6c6)}
#vig{position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%, transparent 40%, rgba(0,0,0,.45) 100%)}
html[data-theme="light"] #vig{background:radial-gradient(120% 100% at 50% 0%, transparent 45%, rgba(90,80,60,.18) 100%)}

/* ================= 2. DESKTOP / ICONS ================= */
#desktop{position:absolute; inset:0 0 var(--tb-h) 0}
#icons{position:absolute; inset:0; padding:14px; touch-action:manipulation}
.dicon{
  position:absolute; width:calc(var(--grid) - 14px); padding:8px 6px 7px; border-radius:var(--radius);
  display:flex; flex-direction:column; align-items:center; gap:6px; cursor:grab; touch-action:none;
  transition:left 380ms var(--ease), top 380ms var(--ease), transform 180ms var(--ease),
    background-color 150ms, box-shadow 150ms, opacity 200ms;
  will-change:left, top; border:1px solid transparent;
}
.dicon.dragging{transition:none; z-index:60; opacity:.92; transform:scale(1.06)}
.dicon .ico{width:38px;height:38px; filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.dicon .lbl{font-size:11.5px; text-align:center; line-height:1.25; max-height:2.6em; overflow:hidden;
  color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.9); word-break:break-all; font-weight:500}
html[data-theme="light"] .dicon .lbl{color:#1b1a17; text-shadow:0 1px 2px rgba(255,255,255,.7)}
.dicon:hover{background:var(--hl); border-color:var(--line); box-shadow:0 8px 22px -12px #000}
.dicon.sel{background:color-mix(in srgb, var(--acc) 26%, transparent); border-color:color-mix(in srgb, var(--acc) 70%, transparent)}
.dicon .tag{position:absolute; top:2px; right:4px; font:400 8px/1 var(--mono); color:var(--ink3)}
#selbox{position:absolute; border:1px solid var(--acc); background:color-mix(in srgb, var(--acc) 18%, transparent); display:none; z-index:40; pointer-events:none}
#ghost{position:fixed; z-index:9500; pointer-events:none; width:74px; padding:6px; border-radius:var(--radius);
  background:var(--glass); backdrop-filter:blur(8px); box-shadow:var(--shadow); border:1px solid var(--line);
  display:none; text-align:center; font-size:10px; color:var(--ink)}
#ghost .ico{width:28px;height:28px;margin:0 auto 4px}

/* ================= 3. WINDOWS ================= */
#winlayer{position:absolute; inset:0; pointer-events:none}
.win{position:absolute; pointer-events:auto; display:flex; flex-direction:column; min-width:260px; min-height:150px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; opacity:0; transform:scale(.96) translateY(8px); contain:layout paint;
  animation:winIn 240ms var(--ease) forwards}
@keyframes winIn{to{opacity:1; transform:none}}
.win.closing{animation:winOut 170ms ease forwards}
@keyframes winOut{to{opacity:0; transform:scale(.97) translateY(6px)}}
.win.minimized{animation:winMin 200ms ease forwards}
@keyframes winMin{to{opacity:0; transform:scale(.5) translateY(40%)}}
.win.snapping{transition:left 240ms var(--ease), top 240ms var(--ease), width 240ms var(--ease), height 240ms var(--ease)}
.win-head{height:34px; flex:0 0 34px; display:flex; align-items:stretch; gap:0; cursor:default;
  background:linear-gradient(180deg, var(--panel2), var(--panel)); border-bottom:1px solid var(--line)}
.win:not(.focus) .win-head{filter:saturate(.5) brightness(.86)}
.win-title{flex:1; display:flex; align-items:center; gap:8px; padding:0 10px; min-width:0; overflow:hidden}
.win-title .tico{width:15px;height:15px;flex:0 0 15px}
.win-title span{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.win-btns{display:flex; align-items:stretch}
.wbtn{width:40px; display:grid; place-items:center; border:0; background:none; cursor:pointer; color:var(--ink2);
  border-left:1px solid var(--line); transition:background .12s,color .12s}
.wbtn:hover{background:var(--hl); color:var(--ink)}
.wbtn.close:hover{background:var(--bad); color:#fff}
.wbtn svg{width:11px;height:11px}
.win-body{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; position:relative}
.rz{position:absolute; z-index:5}
.rz.n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.nw{left:-4px;top:-4px;width:14px;height:14px;cursor:nwse-resize}
.rz.ne{right:-4px;top:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz.sw{left:-4px;bottom:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz.se{right:-4px;bottom:-4px;width:14px;height:14px;cursor:nwse-resize}
#snapghost{position:absolute; z-index:70; display:none; border:1px solid var(--acc);
  background:color-mix(in srgb, var(--acc) 16%, transparent); backdrop-filter:blur(2px); border-radius:var(--radius);
  transition:all 130ms var(--ease); pointer-events:none}
.win.peek-hide{opacity:.12; filter:blur(1px) grayscale(.4)}
#peek{position:absolute; z-index:80; display:none; padding:8px; background:var(--glass); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); width:230px}
#peek .pk-t{font:500 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink2);
  margin:2px 2px 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#peek .pk-c{height:126px; overflow:hidden; background:var(--bg2); border:1px solid var(--line); position:relative}
#peek .pk-c .clone{position:absolute; top:0; left:0; transform-origin:0 0; pointer-events:none}
.win.fullscreen{inset:0!important; width:100%!important; height:100%!important; z-index:9500!important; border-radius:0}
.win.fullscreen .win-head{display:none}
#fsExit{position:fixed; top:12px; right:12px; z-index:9600; display:none; width:34px;height:34px; border-radius:50%;
  background:rgba(0,0,0,.5); color:#fff; border:1px solid rgba(255,255,255,.25); cursor:pointer; opacity:.25; transition:.2s}
#fsExit:hover{opacity:1; background:var(--bad)}

/* ================= 4. TASKBAR / DOCK ================= */
#taskbar{position:absolute; left:0; right:0; bottom:0; height:var(--tb-h); z-index:5000; display:flex; align-items:stretch;
  gap:6px; padding:0 6px; background:var(--glass); backdrop-filter:blur(18px) saturate(140%);
  border-top:1px solid var(--line); box-shadow:0 -12px 30px -20px #000}
html.tb-left #taskbar{left:0;top:0;bottom:0;right:auto;width:56px;height:auto;flex-direction:column;padding:6px 4px;border-top:0;border-right:1px solid var(--line)}
#tbStart{display:flex; align-items:center; gap:9px; padding:0 12px; border:1px solid var(--line2); border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel2),var(--panel)); cursor:pointer; font:700 11px/1 var(--mono); letter-spacing:.16em; transition:.15s}
#tbStart:hover{border-color:var(--acc); color:var(--acc)}
#tbStart .orb{width:17px;height:17px}
#tbTasks{flex:1; display:flex; align-items:stretch; gap:5px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none}
#tbTasks::-webkit-scrollbar{display:none}
.tb-task{display:flex; align-items:center; gap:7px; padding:0 11px; min-width:0; max-width:180px; border:1px solid transparent;
  border-radius:var(--radius); cursor:pointer; color:var(--ink2); position:relative; transition:.14s; font-size:11.5px}
.tb-task .tico{width:15px;height:15px;flex:0 0 15px}
.tb-task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-task:hover{background:var(--hl); color:var(--ink)}
.tb-task.on{color:var(--ink); border-color:var(--line2); background:var(--panel2)}
.tb-task.on::after{content:""; position:absolute; left:9px; right:9px; bottom:2px; height:2px; background:var(--acc)}
.tb-task.on::before{content:""; position:absolute; inset:0; border-radius:var(--radius)}
#tbTray{display:flex; align-items:center; gap:4px; padding-right:2px}
.trayb{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--radius);color:var(--ink2);cursor:pointer;transition:.14s}
.trayb:hover{background:var(--hl); color:var(--ink)}
.trayb svg{width:15px;height:15px}
#tbClock{text-align:right; padding:0 8px; font:500 10.5px/1.35 var(--mono); letter-spacing:.05em; color:var(--ink2);
  border-left:1px solid var(--line); cursor:pointer; white-space:nowrap}
#tbClock b{display:block; color:var(--ink); font-size:11.5px}
#showDesk{width:8px; border-left:1px solid var(--line); cursor:pointer}

/* ================= 5. START MENU / MENUS / TOASTS ================= */
#start{position:absolute; z-index:6000; left:6px; bottom:calc(var(--tb-h) + 6px); width:min(560px, 94vw);
  background:var(--glass); backdrop-filter:blur(22px) saturate(140%); border:1px solid var(--line);
  border-radius:6px; box-shadow:var(--shadow); padding:14px; display:none; overflow:hidden}
#start.open{display:flex; gap:14px; animation:sheetIn 200ms var(--ease)}
@keyframes sheetIn{from{opacity:0; transform:translateY(14px) scale(.985)}}
#start .sSide{width:120px; flex:0 0 120px; display:flex; flex-direction:column; gap:3px; border-right:1px solid var(--line); padding-right:12px}
#start .sMain{flex:1; min-width:0}
.srow{display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:var(--radius); cursor:pointer;
  font-size:11.5px; color:var(--ink2); transition:.13s}
.srow:hover{background:var(--hl); color:var(--ink)}
.srow .tico{width:14px;height:14px}
.sHead{font:500 9.5px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--ink3); margin:2px 4px 8px}
#startSearch{width:100%; padding:9px 11px; background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
  outline:none; font-size:12px; margin-bottom:12px}
#startSearch:focus{border-color:var(--acc)}
.sgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:6px; max-height:46vh; overflow-y:auto; padding-right:4px}
.sapp{display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 6px; border-radius:var(--radius);
  cursor:pointer; text-align:center; border:1px solid transparent; transition:.14s}
.sapp:hover{background:var(--hl); border-color:var(--line); transform:translateY(-2px)}
.sapp .ico{width:30px;height:30px}
.sapp div{font-size:10.5px; color:var(--ink2); line-height:1.2}
.sapp:hover div{color:var(--ink)}

#ctx{position:absolute; z-index:7000; min-width:196px; background:var(--glass); backdrop-filter:blur(18px);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:5px; display:none; overflow:visible}
.ctx-item{display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:2px; cursor:pointer; font-size:12px;
  color:var(--ink); transition:.1s; white-space:nowrap}
.ctx-item:hover{background:var(--acc); color:var(--acc-ink)}
.ctx-item:hover .ci{color:var(--acc-ink)}
.ctx-item .ci{width:14px;height:14px;flex:0 0 14px;color:var(--ink2)}
.ctx-item .kb{margin-left:auto; font:400 9.5px/1 var(--mono); color:var(--ink3)}
.ctx-item.dis{opacity:.36; pointer-events:none}
.ctx-sep{height:1px; background:var(--line); margin:5px 3px}
.ctx-label{font:500 9px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); padding:7px 9px 3px}

#toasts{position:absolute; z-index:8000; right:10px; bottom:calc(var(--tb-h) + 10px); display:flex; flex-direction:column;
  gap:7px; align-items:flex-end; pointer-events:none; max-width:78vw}
html.tb-left #toasts{left:66px; right:auto; align-items:flex-start}
.toast{display:flex; gap:9px; align-items:flex-start; padding:10px 13px; background:var(--glass); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-left:2px solid var(--acc); border-radius:var(--radius); box-shadow:var(--shadow);
  font-size:12px; max-width:340px; animation:tIn 260ms var(--ease); pointer-events:auto}
.toast.ok{border-left-color:var(--acc2)} .toast.err{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.toast.out{animation:tOut 220ms ease forwards}
@keyframes tIn{from{opacity:0; transform:translateX(24px)}}
@keyframes tOut{to{opacity:0; transform:translateX(24px)}}
.toast .tico{width:15px;height:15px;flex:0 0 15px;margin-top:1px}

#modalHost{position:absolute; inset:0; z-index:7500; display:none; place-items:center; background:rgba(4,5,7,.55); backdrop-filter:blur(3px); padding:16px}
#modalHost.on{display:grid}
.modal{width:min(460px,94vw); max-height:88vh; overflow:auto; background:var(--panel); border:1px solid var(--line);
  border-radius:6px; box-shadow:var(--shadow); animation:sheetIn 200ms var(--ease)}
.modal header{padding:12px 14px; border-bottom:1px solid var(--line); font:700 11.5px/1 var(--mono); letter-spacing:.16em;
  text-transform:uppercase; display:flex; justify-content:space-between; align-items:center}
.modal .mb{padding:14px}
.modal footer{padding:11px 14px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}

/* ================= 6. GENERIC UI ================= */
.btn{padding:6px 12px; border:1px solid var(--line2); background:var(--panel2); border-radius:var(--radius); cursor:pointer;
  font-size:11.5px; font-weight:500; letter-spacing:.03em; transition:.13s; white-space:nowrap}
.btn:hover{border-color:var(--acc); color:var(--acc)}
.btn.acc{background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:700}
.btn.acc:hover{filter:brightness(1.12); color:var(--acc-ink)}
.btn.sm{padding:4px 8px; font-size:10.5px}
.btn.icon{padding:5px 7px; display:grid; place-items:center}
.btn.icon svg{width:13px;height:13px}
.btn.on{background:color-mix(in srgb, var(--acc) 22%, var(--panel)); border-color:var(--acc); color:var(--acc)}
.field{padding:6px 9px; background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); outline:none; font-size:12px; min-width:0}
.field:focus{border-color:var(--acc)}
select.field{cursor:pointer}
.bar{display:flex; align-items:center; gap:6px; padding:7px 9px; border-bottom:1px solid var(--line); background:var(--panel2); flex-wrap:wrap}
.spacer{flex:1}
.hint{font:400 10px/1.4 var(--mono); color:var(--ink3)}
.kbd{font:500 9.5px/1 var(--mono); border:1px solid var(--line2); border-bottom-width:2px; border-radius:2px; padding:2px 4px; color:var(--ink2)}
.mono{font-family:var(--mono)}
.sw{width:38px;height:20px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;flex:0 0 38px;transition:.18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:.18s}
.sw.on{background:var(--acc)} .sw.on::after{left:20px;background:var(--acc-ink)}
.setrow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .si{width:16px;height:16px;flex:0 0 16px;color:var(--acc2)}
.setrow .st{flex:1; min-width:0}
.setrow .st b{display:block; font-size:12.5px; font-weight:600}
.setrow .st small{color:var(--ink3); font-size:10.5px; line-height:1.4}
.sect{font:500 9.5px/1 var(--mono); letter-spacing:.24em; text-transform:uppercase; color:var(--acc); margin:22px 0 4px; display:flex; align-items:center; gap:8px}
.sect::after{content:""; flex:1; height:1px; background:var(--line)}
.busy{position:absolute; inset:0; display:grid; place-items:center; background:color-mix(in srgb, var(--panel) 70%, transparent);
  z-index:6; font:500 10.5px/1.6 var(--mono); color:var(--ink2); text-align:center; letter-spacing:.1em}
.spin{width:26px;height:26px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;margin:0 auto 9px;animation:sp 800ms linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:6px; background:var(--bg2); border-radius:3px; overflow:hidden; border:1px solid var(--line)}
.pbar i{display:block; height:100%; background:var(--acc); transition:width .3s var(--ease)}

/* ================= 7. FILE EXPLORER ================= */
.fx{display:flex; flex:1; min-height:0}
.fx-side{width:172px; flex:0 0 172px; border-right:1px solid var(--line); background:var(--bg2); overflow-y:auto; padding:8px 6px}
.fx-side .grp{font:500 9px/1 var(--mono); letter-spacing:.2em; color:var(--ink3); text-transform:uppercase; padding:9px 8px 5px}
.fx-side .it{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--radius); cursor:pointer; font-size:11.5px;
  color:var(--ink2); transition:.12s; white-space:nowrap; overflow:hidden}
.fx-side .it:hover{background:var(--hl); color:var(--ink)}
.fx-side .it.on{background:color-mix(in srgb,var(--acc) 20%,transparent); color:var(--ink); box-shadow:inset 2px 0 0 var(--acc)}
.fx-side .it .tico{width:14px;height:14px;flex:0 0 14px}
.fx-main{flex:1; min-width:0; display:flex; flex-direction:column}
.crumb{display:flex; align-items:center; gap:2px; flex:1; min-width:0; overflow:hidden; padding:3px 6px;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius)}
.crumb span{padding:3px 7px; border-radius:2px; cursor:pointer; font-size:11.5px; color:var(--ink2); white-space:nowrap}
.crumb span:hover{background:var(--hl); color:var(--ink)}
.crumb i{color:var(--ink3); font-style:normal; font-size:10px}
.fx-list{flex:1; overflow:auto; position:relative; min-height:0}
.fx-list.grid-mode{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:4px; padding:10px; align-content:start}
.fx-list.grid-mode .frow{display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 6px; height:auto}
.fx-list.grid-mode .frow .cells{display:none}
.fx-list.grid-mode .frow .nm{flex-direction:column; gap:4px; text-align:center; justify-content:center}
.fx-list.grid-mode .frow .nm .ico{width:32px;height:32px}
.fx-list.grid-mode .frow .nm b{font-size:10.5px; line-height:1.25; word-break:break-all; font-weight:400}
.fx-list.grid-mode .frow .nm i{display:none}
.fhead{display:flex; align-items:stretch; border-bottom:1px solid var(--line); background:var(--panel2);
  position:sticky; top:0; z-index:3; font:500 9.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.fx-list.grid-mode .fhead{display:none}
.fth{position:relative; padding:9px 8px; cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden}
.fth:hover{color:var(--ink)}
.fth.on{color:var(--acc)}
.fth .ar{font-size:8px; margin-left:3px}
.fth .rgrip{position:absolute; right:-2px; top:0; bottom:0; width:5px; cursor:col-resize; z-index:2}
.fth .rgrip:hover{background:var(--acc)}
.frow{display:flex; align-items:center; gap:6px; padding:0 6px; height:30px; border-radius:2px; cursor:default; font-size:12px; position:relative}
.frow:hover{background:var(--hl)}
.frow.sel{background:color-mix(in srgb,var(--acc) 26%,transparent)}
.frow.dragover{outline:1px dashed var(--acc); outline-offset:-2px}
.frow .nm{flex:1; min-width:0; display:flex; align-items:center; gap:8px; overflow:hidden}
.frow .nm .ico{width:17px;height:17px;flex:0 0 17px}
.frow .nm b{font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.frow .nm i{font-style:normal; color:var(--acc2); font-size:9px; font-family:var(--mono); margin-left:3px}
.frow .cells{display:flex; align-items:center; flex:0 0 auto}
.fcell{padding:0 8px; color:var(--ink2); font:400 10.5px/1 var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.frow.drop-target{background:color-mix(in srgb,var(--acc2) 24%,transparent)}
.empty{padding:40px 20px; text-align:center; color:var(--ink3); font:400 11px/1.7 var(--mono)}
.fx-status{display:flex; align-items:center; gap:10px; padding:5px 10px; border-top:1px solid var(--line);
  font:400 9.5px/1 var(--mono); color:var(--ink3); letter-spacing:.06em; flex-wrap:wrap}

/* ================= 8. APPS ================= */
.ta{flex:1; width:100%; resize:none; border:0; outline:none; background:var(--bg2); color:var(--ink);
  padding:12px 14px; font-family:var(--mono); font-size:13px; line-height:1.65; tab-size:2}
.np-find{display:flex; gap:5px; padding:6px 8px; border-bottom:1px solid var(--line); background:var(--panel2); align-items:center; flex-wrap:wrap}
.tview{flex:1; overflow:auto}
table.tbl{border-collapse:collapse; font-family:var(--mono); font-size:11.5px; width:max-content; min-width:100%}
table.tbl th{position:sticky; top:0; background:var(--panel2); border:1px solid var(--line); padding:6px 9px; font-weight:600;
  text-align:left; white-space:nowrap; color:var(--ink2); letter-spacing:.06em}
table.tbl td{border:1px solid var(--line); padding:5px 9px; white-space:nowrap; max-width:340px; overflow:hidden; text-overflow:ellipsis}
table.tbl td:focus{outline:1px solid var(--acc); background:var(--hl)}
.imgview{flex:1; overflow:auto; background:
  repeating-conic-gradient(var(--bg2) 0% 25%, var(--bg) 0% 50%) 50%/22px 22px; display:grid; place-items:center}
.imgview img{max-width:100%; max-height:100%; transition:transform .16s var(--ease); pointer-events:none}
.manga{flex:1; overflow-y:auto; background:#000; display:flex; flex-direction:column; align-items:center; touch-action:pan-y}
.manga img{width:100%; max-width:1000px; display:block; pointer-events:none}
.med{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:18px; background:var(--bg2)}
.med audio,.med video{width:100%; max-width:760px}
.calc{flex:1; display:flex; flex-direction:column; padding:10px; gap:8px}
.calc .disp{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; text-align:right}
.calc .disp .ex{font:400 10.5px/1 var(--mono); color:var(--ink3); min-height:13px; word-break:break-all}
.calc .disp .val{font:500 27px/1.25 var(--mono); word-break:break-all}
.calc .keys{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.calc .keys button{border:1px solid var(--line); background:var(--panel2); border-radius:var(--radius); cursor:pointer;
  font:500 15px/1 var(--mono); transition:.1s; min-height:38px}
.calc .keys button:hover{border-color:var(--acc); color:var(--acc)}
.calc .keys button.op{background:color-mix(in srgb,var(--acc) 15%,var(--panel2))}
.calc .keys button.eq{background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-weight:700}
.canvas-wrap{flex:1; overflow:auto; background:var(--bg2); position:relative}
.canvas-wrap canvas{display:block; background:#fff; cursor:crosshair; touch-action:none; box-shadow:var(--shadow)}
.edwrap{flex:1; min-height:0; display:flex}
.edleft{display:flex; flex-direction:column; min-width:200px; flex:0 0 55%; position:relative; border-right:1px solid var(--line)}
.edright{flex:1; min-width:120px; display:flex; flex-direction:column; background:var(--bg2)}
.edright iframe{flex:1; width:100%; border:0; background:#fff}
.edsplit{flex:0 0 5px; cursor:col-resize; background:var(--line); transition:.12s}
.edsplit:hover,.edsplit.on{background:var(--acc)}
.CodeMirror{flex:1; height:auto!important; font-family:var(--mono)!important; font-size:12.5px!important; background:var(--bg2)!important}
.CodeMirror-gutters{border-right:1px solid var(--line)!important; background:var(--bg2)!important}
.findbar{display:none; gap:5px; padding:6px 8px; border-bottom:1px solid var(--line); background:var(--panel2); align-items:center; flex-wrap:wrap}
.findbar.on{display:flex}
.findbar input{width:150px}
.tog{padding:4px 7px; font:500 10px/1 var(--mono); border:1px solid var(--line2); border-radius:2px; cursor:pointer; color:var(--ink2); background:var(--bg2)}
.tog.on{background:var(--acc); color:var(--acc-ink); border-color:var(--acc)}
.statusbar{display:flex; align-items:center; gap:12px; padding:4px 9px; border-top:1px solid var(--line);
  font:400 9.5px/1 var(--mono); color:var(--ink3); letter-spacing:.06em; flex-wrap:wrap; background:var(--panel2)}
.cm-hit{background:color-mix(in srgb,var(--acc2) 35%,transparent)}
.cm-cur{background:color-mix(in srgb,var(--acc) 55%,transparent); color:#fff}
.term{flex:1; overflow:auto; background:#07090b; padding:12px; font-family:var(--mono); font-size:12px; line-height:1.6; color:#cfe3d8; user-select:text}
.term .pr{color:var(--acc)} .term .er{color:var(--bad)} .term .in{color:var(--ink3)}
.term pre{margin:0; white-space:pre-wrap; word-break:break-all}
.term-in{display:flex; gap:7px; padding:8px 12px; background:#07090b; border-top:1px solid var(--line)}
.term-in input{flex:1; background:none; border:0; outline:none; color:#e7ecf1; font-family:var(--mono); font-size:12px}
.vm{flex:1; position:relative; background:#000; overflow:hidden; display:grid; place-items:center}
.vm .sc{width:100%; height:100%; overflow:hidden; display:block; position:relative}
.vm .sc .text{white-space:pre; font:14px/1 monospace; color:#d8dee9; position:absolute; inset:0; padding:4px; display:none}
.vm .sc canvas{display:block; position:absolute; inset:0}
.vm.locked canvas{cursor:none}
.vm .vmbar{position:absolute; bottom:0; left:0; right:0; display:flex; gap:6px; padding:6px; background:rgba(0,0,0,.5); z-index:3; flex-wrap:wrap}
.usage{display:flex; flex-direction:column; gap:8px}
.ubar{display:grid; grid-template-columns:1fr 74px 62px; gap:8px; align-items:center; font-size:11px}
.ubar .n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ubar .p{font:400 9.5px/1 var(--mono); color:var(--ink3); text-align:right}

/* ================= 9. RESPONSIVE ================= */
@media (max-width: 860px){
  :root{--tb-h:58px}
  #desktop{inset:0 0 var(--tb-h) 0}
  .win{border-radius:0}
  #taskbar{padding:0 4px; gap:4px}
  #tbStart{padding:0 9px; gap:6px} #tbStart b{display:none}
  #tbClock{padding:0 4px; font-size:9px} #tbClock b{font-size:10px}
  .tb-task{max-width:52px; padding:0 10px} .tb-task span{display:none} .tb-task .tico{width:18px;height:18px}
  #start{left:0; right:0; bottom:var(--tb-h); width:auto; border-radius:0; flex-direction:column!important}
  #start .sSide{width:auto; flex:0 0 auto; flex-direction:row; border-right:0; border-bottom:1px solid var(--line); padding:0 0 8px; overflow-x:auto}
  .sgrid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); max-height:40vh}
  .fx-side{position:absolute; z-index:8; inset:0 auto 0 0; width:74%; max-width:270px; transform:translateX(-101%); transition:transform .24s var(--ease); box-shadow:var(--shadow)}
  .fx-side.open{transform:none}
  .fcell.date,.fth.date{display:none}
  .dicon{width:76px}
  #peek{display:none!important}
  .modal{width:100%}
  .edwrap{flex-direction:column}
  .edleft{flex:0 0 58%; border-right:0; border-bottom:1px solid var(--line)}
  .edsplit{flex:0 0 5px; cursor:row-resize; background:var(--line)}
}
@media (max-width: 560px){
  :root{--grid:84px}
  .fcell.size,.fth.size{display:none}
  .fx-list.grid-mode .frow{padding:8px 4px}
}
html.no-anim *{animation-duration:.001s!important; transition-duration:.001s!important}
</style>
</head>

      <div class="sHead">应用</div>

</div>

<input type="file" id="filePick" multiple style="display:none">

<div id="grain"></div><div id="scan"></div>

function el(tag, attrs, html){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (html != null) e.innerHTML = html;

}
function fmtSize(b){ if(b==null) return '—'; if(b<1024) return b+' B';
  const u=['KB','MB','GB','TB']; let i=-1; do{b/=1024;i++;}while(b>=1024&&i<3); return b.toFixed(b<10?1:0)+' '+u[i]; }
function fmtDate(t){ if(!t) return '—'; const d=new Date(t);
  const p=n=>String(n).padStart(2,'0');
  const now=new Date(); const same = d.toDateString()===now.toDateString();
  const tstr = p(d.getHours())+':'+p(d.getMinutes());
  if(same) return '今天 '+tstr;
  const y=new Date(now.getTime()-864e5); if(d.toDateString()===y.toDateString()) return '昨天 '+tstr;
  return (d.getFullYear()+'/')+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+tstr; }
function fmtRel(t){ const s=(Date.now()-t)/1000; if(s<60)return '刚刚'; if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前'; return fmtDate(t); }

const ARCH_EXT = ['zip','gz','tgz','tar','bz2','xz','7z','rar','gz2','zst'];
function extOf(name){ const i=String(name).lastIndexOf('.'); return i<0?'':name.slice(i+1).toLowerCase(); }
function mimeOf(name){ return MIME[extOf(name)] || 'application/octet-stream'; }
function kindOf(name){
  const e = extOf(name);
  if (IMG_EXT.includes(e)) return 'image';
  if (AUD_EXT.includes(e)) return 'audio';
  if (VID_EXT.includes(e)) return 'video';
  if (e==='pdf') return 'pdf';
  if (['zip','gz','tgz','tar','bz2','xz','7z','rar'].includes(e)) return 'archive';
  if (['csv','tsv'].includes(e)) return 'table';
  if (['html','htm'].includes(e)) return 'html';
  if (TXT_EXT.includes(e) || e==='') return 'text';
  return 'bin';
}
function iconOf(name, isDir){
  if (isDir) return 'folder';
  const k = kindOf(name); const e = extOf(name);
  if (k==='image') return e==='svg'?'code':'image';
  if (k==='audio') return 'audio'; if (k==='video') return 'video'; if (k==='pdf') return 'pdf';
  if (k==='archive') return 'archive'; if (k==='table') return 'table'; if (k==='html') return 'html';
  if (['js','mjs','cjs','ts','tsx','jsx','json','css','scss','less','py','rb','go','rs','c','h','cpp','java','sh','vue','php'].includes(e)) return 'code';
  if (k==='text') return 'text';
  return 'file';
}
function typeLabel(name, isDir){
  if (isDir) return '文件夹';
  const k=kindOf(name), e=extOf(name).toUpperCase();
  const map={image:'图片',audio:'音频',video:'视频',pdf:'PDF 文档',archive:'压缩包',table:'数据表',html:'HTML 文档',text:'文本',bin:'二进制文件'};
  return e? (e+' 文件 · '+map[k]) : map[k];
}
/* Blob URL 生命周期管理 */
const Blobs = {
  m: new Map(),
  make(key, blob){ const old=this.m.get(key); if(old) URL.revokeObjectURL(old); const u=URL.createObjectURL(blob); this.m.set(key,u); return u; },
  get(key){ return this.m.get(key); },
  drop(key){ const u=this.m.get(key); if(u){ URL.revokeObjectURL(u); this.m.delete(key); } },
  clear(){ this.m.forEach(u=>URL.revokeObjectURL(u)); this.m.clear(); }
};

<script>
/* ================================================================
   虚拟文件系统 (VFS)
   架构：后端抽象（OPFS / IndexedDB / 本地目录句柄 / 内存）
        → 路由层（挂载表） → 全局 fs API（Promise + callback 双兼容）
   ================================================================ */
const P = {
  norm(p){ p=String(p==null?'':p).replace(/\\/g,'/').replace(/\/+/g,'/');
    if(!p.startsWith('/')) p='/'+p; if(p.length>1) p=p.replace(/\/+$/,''); return p||'/'; },
  dir(p){ p=P.norm(p); if(p==='/') return '/'; const i=p.lastIndexOf('/'); return i<=0?'/':p.slice(0,i); },
  base(p){ p=P.norm(p); if(p==='/') return '/'; return p.slice(p.lastIndexOf('/')+1); },
  ext: extOf,
  join(...a){ return P.norm(a.filter(x=>x!=null&&x!=='').join('/')); },
  parts(p){ return P.norm(p).split('/').filter(Boolean); }
};
/* 目录时间元数据（OPFS 不暴露目录 mtime） */
const DMETA = (()=>{ try{ return JSON.parse(localStorage.getItem('orbit.dmeta')||'{}'); }catch(e){ return {}; } })();
let dmetaT=null;
function touchDir(p){ DMETA[P.norm(p)] = Date.now(); if(dmetaT) clearTimeout(dmetaT);
  dmetaT=setTimeout(()=>{ try{ localStorage.setItem('orbit.dmeta', JSON.stringify(DMETA)); }catch(e){} }, 400); }
function pathMtime(p){ return DMETA[P.norm(p)] || 0; }

/* ---------- IndexedDB 基础设施（降级后端 + 句柄持久化 + KV） ---------- */
function openIDB(){
  return new Promise((res, rej)=>{
    let rq; try{ rq = indexedDB.open('orbit-fs', 3); }catch(e){ return rej(e); }
    rq.onupgradeneeded = ()=>{ const db=rq.result;
      ['nodes','blobs','handles','kv'].forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s); }); };
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error); rq.onblocked = ()=>rej(new Error('IDB blocked'));
  });
}
const IDB = {
  db:null, ready:null, ok:true,
  init(){ if(!this.ready){ this.ready = openIDB().then(d=>{this.db=d;}).catch(e=>{ this.ok=false; throw e; }); } return this.ready; },
  tx(store, mode, fn){
    return this.init().then(()=>new Promise((res,rej)=>{
      const t=this.db.transaction(store, mode), s=t.objectStore(store); let out;
      try{ out=fn(s); }catch(e){ rej(e); return; }
      t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);
      t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('abort'));
    }));
  },
  get(s,k){ return this.tx(s,'readonly',o=>o.get(k)); },
  set(s,k,v){ return this.tx(s,'readwrite',o=>o.put(v,k)); },
  del(s,k){ return this.tx(s,'readwrite',o=>o.delete(k)); },
  keys(s){ return this.tx(s,'readonly',o=>o.getAllKeys()); },
  clear(s){ return this.tx(s,'readwrite',o=>o.clear()); }
};
async function dirEntries(dh){
  const out=[];
  if (dh.entries){ try{ for await (const e of dh.entries()) out.push(e); return out; }catch(e){} }
  if (dh.values){ try{ for await (const h of dh.values()) out.push([h.name, h]); return out; }catch(e){} }
  return out;
}
class FSError extends Error{ constructor(msg, code){ super(msg); this.code = code||'ERR'; } }
const notFound = p => new FSError('找不到路径：'+p, 'ENOENT');

/* ===================== 后端：OPFS ===================== */
class OPFSBackend {
  constructor(root){ this.root=root; this.id='opfs'; this.label='OPFS 持久存储'; this.persistent=true; }
  _parts(p){ return P.parts(p); }
  async _dir(path, create){
    let h=this.root;
    for (const seg of this._parts(path)){ try{ h = await h.getDirectoryHandle(seg, {create:!!create}); }
      catch(e){ if(create && e.name==='TypeMismatchError') throw new FSError('目标不是文件夹：'+path); throw notFound(path); } }
    return h;
  }
  async _locate(path){
    const parts=this._parts(path), name=parts.pop()||'';
    const dir=await this._dir(parts.join('/'));
    return {dir, name, parent:parts.join('/')||'/'};
  }
  async list(path){
    if(path==='/'){ path='/'; }
    const dh=await this._dir(path); const out=[];
    for (const [name,h] of await dirEntries(dh)){
      const full=P.join(path,name);
      if(h.kind==='directory') out.push({name, path:full, type:'dir', kind:'dir', size:0, mtime:pathMtime(full)});
      else{ let size=0, mtime=0; try{ const f=await h.getFile(); size=f.size; mtime=f.lastModified; }catch(e){}
        out.push({name, path:full, type:'file', kind:'file', size, mtime}); }
    }
    return out;
  }
  async stat(path){
    path=P.norm(path); if(path==='/') return {name:'/', path:'/', type:'dir', kind:'dir', size:0, mtime:pathMtime('/')};
    const {dir,name}=await this._locate(path);
    try{ const fh=await dir.getFileHandle(name); const f=await fh.getFile();
      return {name, path, type:'file', kind:'file', size:f.size, mtime:f.lastModified}; }
    catch(e){}
    try{ await dir.getDirectoryHandle(name); return {name, path, type:'dir', kind:'dir', size:0, mtime:pathMtime(path)}; }
    catch(e){ throw notFound(path); }
  }
  async read(path){ const {dir,name}=await this._locate(path);
    try{ const fh=await dir.getFileHandle(name); return await fh.getFile(); }catch(e){ throw notFound(path); } }
  async write(path, data){
    const {dir,name,parent}=await this._locate(path);
    const fh=await dir.getFileHandle(name,{create:true});
    const w=await fh.createWritable(); await w.write(data); await w.close();
    touchDir(parent); touchDir(P.dir(P.norm(path)));
    const f=await fh.getFile(); return {size:f.size, mtime:f.lastModified};
  }
  async mkdir(path){ await this._dir(path, true); touchDir(P.dir(P.norm(path))); touchDir(P.norm(path)); return true; }
  async rm(path){
    path=P.norm(path); if(path==='/') throw new FSError('不能删除根目录');
    const {dir,name,parent}=await this._locate(path);
    try{ await dir.removeEntry(name, {recursive:true}); touchDir(parent); return true; }catch(e){ throw notFound(path); }
  }
  async rename(from, to){
    from=P.norm(from); to=P.norm(to);
    const s=await this.stat(from);
    if (s.type==='file' && s.mv){ }
    try{
      const src=await this._locate(from); const st=await this.stat(from);
      const h = st.type==='file' ? await src.dir.getFileHandle(src.name) : await src.dir.getDirectoryHandle(src.name);
      if (h.move){ const dst=await this._locate(to);
        await h.move(dst.dir, dst.name); touchDir(P.dir(from)); touchDir(P.dir(to)); return true; }
    }catch(e){}
    return null; // 走通用 copy+rm
  }
}
/* ===================== 后端：IndexedDB（降级） ===================== */
class IDBBackend {
  constructor(){ this.id='idb'; this.label='IndexedDB 降级存储'; this.persistent=true; }
  _k(p){ return P.norm(p); }
  async list(path){
    path=P.norm(path); const keys=await IDB.keys('nodes'); const out=[];
    for(const k of keys){ if(k===path) continue;
      const ks=String(k);
      if(ks.startsWith(path==='/'?'/':path+'/')){
        const rest = path==='/' ? ks.slice(1) : ks.slice(path.length+1);
        if(rest && !rest.includes('/')){
          const n = await IDB.get('nodes', k);
          out.push({name:rest, path:P.norm(k), type:n.type, kind:n.type, size:n.size||0, mtime:n.mtime||0});
        }
      }
    }
    return out;
  }
  async stat(path){
    path=P.norm(path);
    if(path==='/') return {name:'/', path:'/', type:'dir', kind:'dir', size:0, mtime:pathMtime('/')};
    const n=await IDB.get('nodes', path); if(!n) throw notFound(path);
    return {name:P.base(path), path, type:n.type, kind:n.type, size:n.size||0, mtime:n.mtime||0};
  }
  async read(path){ const b=await IDB.get('blobs', this._k(path)); if(!b) throw notFound(path); return b; }
  async write(path, data){
    path=P.norm(path);
    const blob = data instanceof Blob ? data : new Blob([data]);
    const buf = await blob.arrayBuffer();
    await IDB.set('blobs', path, blob);
    await IDB.set('nodes', path, {type:'file', size:buf.byteLength, mtime:Date.now()});
    // 确保父级目录存在
    const parts=P.parts(path); parts.pop();
    let cur=''; for(const p of parts){ cur = cur? cur+'/'+p : '/'+p; const ex=await IDB.get('nodes',cur);
      if(!ex || ex.type!=='dir') await IDB.set('nodes',cur,{type:'dir', size:0, mtime:Date.now()}); }
    return {size:buf.byteLength, mtime:Date.now()};
  }
  async mkdir(path){ path=P.norm(path); const ex=await IDB.get('nodes',path);
    if(ex && ex.type==='dir') return false; await IDB.set('nodes',path,{type:'dir',size:0,mtime:Date.now()}); return true; }
  async rm(path){
    path=P.norm(path); if(path==='/') throw new FSError('不能删除根目录');
    const keys=await IDB.keys('nodes'); const targets=keys.filter(k=>k===path||String(k).startsWith(path+'/'));
    for(const k of targets){ await IDB.del('nodes',k); await IDB.del('blobs',k); }
    return true;
  }
  async rename(from,to){ from=P.norm(from); to=P.norm(to);
    const keys=await IDB.keys('nodes');
    for(const k of keys){ if(k===from || String(k).startsWith(from+'/')){
      const nk = to + String(k).slice(from.length);
      const n=await IDB.get('nodes',k); if(n.type==='file'){ const b=await IDB.get('blobs',k); if(b) await IDB.set('blobs',nk,b); }
      await IDB.set('nodes',nk,n); await IDB.del('nodes',k); await IDB.del('blobs',k);
    }}
    return true;
  }
}
/* ===================== 后端：本地真实目录（File System Access） ===================== */
class LocalBackend {
  constructor(handle, name, prefix){
    this.h=handle; this.id='local:'+name; this.label='本地目录 · '+name; this.persistent=false;
    this.name=name; this.prefix=prefix;
  }
  async ensure(){
    if(!this.h) throw new FSError('本地目录句柄丢失', 'ERR');
    let st = await this.h.queryPermission({mode:'readwrite'}).catch(()=>this.h.queryPermission());
    if(st!=='granted'){ st = await this.h.requestPermission({mode:'readwrite'}).catch(()=>st); }
    if(st!=='granted') throw new FSError('本地目录「'+this.name+'」需要授权访问', 'EACCES');
    return true;
  }
  async _dir(path, create){
    let h=this.h;
    for(const seg of P.parts(path)){ h = await h.getDirectoryHandle(seg, {create:!!create}); }
    return h;
  }
  async _locate(path){ const parts=P.parts(path), name=parts.pop()||'';
    return {dir:await this._dir(parts.join('/')), name, parent:parts.join('/')||'/'}; }
  async list(path){
    await this.ensure(); const dh=await this._dir(path); const out=[];
    for(const [name,h] of await dirEntries(dh)){
      const full=P.join(path,name);
      if(h.kind==='directory') out.push({name, path:full, type:'dir', kind:'dir', size:0, mtime:pathMtime(this.prefix+full)});
      else{ let size=0, mtime=0; try{ const f=await h.getFile(); size=f.size; mtime=f.lastModified; }catch(e){}
        out.push({name, path:full, type:'file', kind:'file', size, mtime}); }
    }
    return out;
  }
  async stat(path){
    await this.ensure();
    const {dir,name}=await this._locate(path);
    try{ const fh=await dir.getFileHandle(name); const f=await fh.getFile();
      return {name, path, type:'file', kind:'file', size:f.size, mtime:f.lastModified}; }catch(e){}
    try{ await dir.getDirectoryHandle(name); return {name, path, type:'dir', kind:'dir', size:0, mtime:pathMtime(this.prefix+path)}; }catch(e){}
    throw notFound(path);
  }
  async read(path){ await this.ensure(); const {dir,name}=await this._locate(path);
    try{ const fh=await dir.getFileHandle(name); return await fh.getFile(); }catch(e){ throw notFound(path); } }
  async write(path, data){
    await this.ensure(); const {dir,name}=await this._locate(path);
    const fh=await dir.getFileHandle(name,{create:true});
    const w=await fh.createWritable(); await w.write(data); await w.close();
    const f=await fh.getFile(); return {size:f.size, mtime:f.lastModified};
  }
  async mkdir(path){ await this.ensure(); await this._dir(path, true); return true; }
  async rm(path){ await this.ensure(); const {dir,name}=await this._locate(path);
    try{ await dir.removeEntry(name,{recursive:true}); return true; }catch(e){ throw notFound(path); } }
  async rename(){ return null; }
}

/* ===================== 路由层（统一 fs API） ===================== */
function tail(args){ const a=Array.prototype.slice.call(args); let cb=null;
  if(a.length && typeof a[a.length-1]==='function') cb=a.pop(); return {a, cb}; }
function done(p, cb){ if(cb){ p.then(v=>cb(null,v), e=>cb(e)); } return p; }

const FS = {
  backend:null, mounts:[], type:'-', ready:null,
  async init(){
    if(this.ready) return this.ready;
    this.ready = (async()=>{
      let root=null, ok=false;
      if (navigator.storage && navigator.storage.getDirectory){
        try{ root = await navigator.storage.getDirectory(); }catch(e){ console.warn('OPFS 打开失败', e); }
      }
      /* 能力探测：写入/读回/枚举/删除，全部通过才使用 OPFS 后端 */
      if (root && root.getDirectoryHandle){
        try{
          const pd = await root.getDirectoryHandle('__orbit_probe', {create:true});
          const fh = await pd.getFileHandle('probe.txt', {create:true});
          const w = await fh.createWritable(); await w.write('orbit-ok'); await w.close();
          const f = await fh.getFile();
          const txt = await f.text();
          const listed = await dirEntries(pd);
          if(txt!=='orbit-ok' || !listed.length) throw new Error('OPFS 行为校验失败');
          await root.removeEntry('__orbit_probe', {recursive:true});
          ok = true;
        }catch(e){ console.warn('OPFS 能力探测失败，降级到 IndexedDB：', e);
          try{ await root.removeEntry('__orbit_probe', {recursive:true}); }catch(x){} }
      }
      if (ok){
        this.backend = new OPFSBackend(root); this.type='OPFS';
      } else if (IDB.ok){
        try{ await IDB.init(); this.backend = new IDBBackend(); this.type='IndexedDB'; }
        catch(e){ this.backend = new IDBBackend(); this.type='IndexedDB(受限)'; }
      } else { throw new FSError('浏览器不支持任何可用存储后端（OPFS 与 IndexedDB 均不可用）'); }
      try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
      Bus.emit('fs:ready', this.type);
      return this.type;
    })();
    return this.ready;
  },
  /* 挂载点路由 —— 上层完全透明，无任何 isLocal 分支 */
  route(path){
    path = P.norm(path);
    const sorted = this.mounts.slice().sort((a,b)=>b.prefix.length-a.prefix.length);
    for(const m of sorted){
      if(path===m.prefix) return {b:m.backend, sub:'/', m};
      if(path.startsWith(m.prefix+'/')) return {b:m.backend, sub:P.norm(path.slice(m.prefix.length)), m};
    }
    return {b:this.backend, sub:path, m:null};
  },
  isMountRoot(path){ path=P.norm(path); return !!this.mounts.find(m=>m.prefix===path); },

  async exists(path){ try{ await this.stat(path); return true; }catch(e){ return false; } },
  stat(...args){ const {a,cb}=tail(args); const path=P.norm(a[0]);
    return done((async()=>{
      if(path==='/') return {name:'/', path:'/', type:'dir', kind:'dir', size:0, mtime:pathMtime('/')};
      if(path.startsWith('/mnt/local') && !this.mounts.length){ /* 允许空挂载点 */ }
      const r=this.route(path);
      try{ return await r.b.stat(r.sub); }
      catch(e){ if(e && e.code==='EACCES') throw e; throw notFound(path); }
    })(), cb);
  },
  readdir(...args){ const {a,cb}=tail(args); const path=P.norm(a[0]||'/');
    return done((async()=>{
      const r=this.route(path);
      let list=[]; try{ list = await r.b.list(r.sub); }catch(e){ if(e.code==='EACCES') throw e; throw notFound(path); }
      return list.map(x=>Object.assign(x, {mount: r.m? r.m.name : null}));
    })(), cb);
  },
  readFile(...args){ const {a,cb}=tail(args); const path=P.norm(a[0]);
    return done((async()=>{ const r=this.route(path); const b=await r.b.read(r.sub); return b; })(), cb); },
  async readText(path){ const b=await this.readFile(path); return await b.text(); },
  async readBuf(path){ const b=await this.readFile(path); return await b.arrayBuffer(); },
  writeFile(...args){ const {a,cb}=tail(args); const path=P.norm(a[0]); const data=a[1];
    return done((async()=>{
      const r=this.route(path); const res=await r.b.write(r.sub, data);
      touchDir(P.dir(path));
      Bus.emit('fs:change', {type:'write', path});
      return res;
    })(), cb); },
  async writeText(path, txt){ return this.writeFile(path, new Blob([txt], {type:mimeOf(path)})); },
  mkdir(...args){ const {a,cb}=tail(args); const path=P.norm(a[0]);
    return done((async()=>{
      const r=this.route(path); const created=await r.b.mkdir(r.sub); touchDir(path);
      Bus.emit('fs:change', {type:'mkdir', path}); return created;
    })(), cb); },
  async ensureDir(path){ if(await this.exists(path)) return false; await this.mkdir(path); return true; },
  unlink(...args){ const {a,cb}=tail(args); return this.remove(P.norm(a[0]), cb); },
  rmdir(...args){ const {a,cb}=tail(args); return this.remove(P.norm(a[0]), cb); },
  remove(path, cb){
    return done((async()=>{
      path=P.norm(path);
      if(path==='/') throw new FSError('不能删除根目录');
      if(this.isMountRoot(path)) throw new FSError('请使用「卸载」操作移除本地挂载');
      const st=await this.stat(path);
      const r=this.route(path);
      await r.b.rm(r.sub);
      touchDir(P.dir(path));
      Bus.emit('fs:change', {type:'delete', path, wasDir:st.type==='dir'});
      return true;
    })(), cb);
  },
  rename(from, to, cb){
    return done((async()=>{
      from=P.norm(from); to=P.norm(to);
      if(from===to) return true;
      const st=await this.stat(from);
      const rf=this.route(from), rt=this.route(to);
      if(rf.b===rt.b){
        const native = await rf.b.rename(rf.sub, rt.sub);
        if(native){ touchDir(P.dir(from)); touchDir(P.dir(to)); Bus.emit('fs:change',{type:'rename',from,to}); return true; }
      }
      await this.copyTree(from, to, true);
      await this.remove(from);
      Bus.emit('fs:change',{type:'rename',from,to});
      return true;
    })(), cb);
  },
  move: function(from,to,cb){ return this.rename(from,to,cb); },
  async copy(src, dst){
    src=P.norm(src); dst=P.norm(dst);
    const st=await this.stat(src);
    if(st.type==='file'){ const blob=await this.readFile(src); return this.writeFile(dst, blob); }
    await this.copyTree(src, dst, false);
    return true;
  },
  async copyTree(src, dst, exact){
    src=P.norm(src); dst=P.norm(dst);
    const st=await this.stat(src);
    if(st.type==='file'){ const b=await this.readFile(src); return this.writeFile(dst, b); }
    if(exact) await this.ensureDir(dst);
    const kids=await this.readdir(src);
    for(const k of kids){
      if(k.type==='dir') await this.copyTree(k.path, P.join(dst, k.name), true);
      else { const b=await this.readFile(k.path); await this.writeFile(P.join(dst,k.name), b); }
    }
    return true;
  },
  async unique(dir, name){
    const ex = await this.readdir(dir).catch(()=>[]);
    const taken = new Set(ex.map(x=>x.name.toLowerCase()));
    if(!taken.has(name.toLowerCase())) return P.join(dir,name);
    const dot=name.lastIndexOf('.'); const base = dot>0?name.slice(0,dot):name; const e = dot>0?name.slice(dot):'';
    for(let i=2;i<999;i++){ const n=base+' ('+i+')'+e; if(!taken.has(n.toLowerCase())) return P.join(dir,n); }
    return P.join(dir, base+'-'+Date.now()+e);
  },
  /* 磁盘占用分析 */
  async du(path='/'){
    const acc={total:0, files:0, dirs:0, top:{}};
    const walk=async (p, depth)=>{
      let kids=[]; try{ kids=await this.readdir(p); }catch(e){ return; }
      for(const k of kids){
        if(k.type==='file'){ acc.files++; acc.total+=k.size||0;
          const seg = (path==='/'? '/'+P.parts(k.path)[0] : path);
          acc.top[seg]=(acc.top[seg]||0)+(k.size||0);
        } else { acc.dirs++; if(depth<6) await walk(k.path, depth+1); }
      }
    };
    await walk(P.norm(path), 0);
    const quota = (navigator.storage && navigator.storage.estimate) ? await navigator.storage.estimate() : {};
    return Object.assign(acc, {quota});
  },
  async search(root, term, limit=400){
    term=String(term||'').toLowerCase(); const out=[];
    const walk=async p=>{
      if(out.length>=limit) return;
      let kids=[]; try{ kids=await this.readdir(p); }catch(e){ return; }
      for(const k of kids){
        if(k.name.toLowerCase().includes(term)) out.push(k);
        if(k.type==='dir' && out.length<limit) await walk(k.path);
      }
    };
    await walk(P.norm(root||'/')); return out;

  async mountLocal(handle, name){

          Bus.emit('mount',{prefix:k, name:rec.name});
        } else if(st==='prompt'){ pending.push(rec); }

    }
    if(this.mounts.length) Bus.emit('fs:change',{type:'restore'});
    return pending;

<script>
/* ================================================================
   桌面环境：图标网格自由摆放 / 双向拖拽 / 框选 / 右键 / 壁纸
   ================================================================ */
const POSKEY='orbit.iconpos';
let POS = (()=>{ try{ return JSON.parse(localStorage.getItem(POSKEY)||'{}'); }catch(e){ return {}; } })();
function savePos(){ try{ localStorage.setItem(POSKEY, JSON.stringify(POS)); }catch(e){} }
const CELL = ()=>({ w: parseInt(Cfg.d.grid)||96, h: Math.round((parseInt(Cfg.d.grid)||96)*1.14) });

const Clipboard = { mode:null, paths:[] };
/* 拖拽缓存：dragstart 必须同步，故在 mousedown / mouseenter 预读文件 */
const DragCache = {
  m: new Map(),
  async preload(path){
    try{
      const st = await FS.stat(path); if(st.type!=='file') return null;
      const blob = await FS.readFile(path);
      const url = URL.createObjectURL(blob);
      const old = this.m.get(path);
      if(old && old.url) setTimeout(()=>URL.revokeObjectURL(old.url), 6000);
      const rec = {blob, url, name:P.base(path), type:blob.type||mimeOf(path), size:blob.size};
      this.m.set(path, rec); return rec;
    }catch(e){ return null; }
  },
  get(path){ return this.m.get(path); }
};
const Desktop = {
  entries: [], sel: new Set(),
  cellFree(){
    const {w,h}=CELL(); const taken=new Set();
    Object.values(POS).forEach(p=>taken.add(Math.round(p.x/w)+':'+Math.round(p.y/h)));
    const maxCol = Math.max(1, Math.floor((window.innerWidth-24)/w));
    const maxRow = Math.max(1, Math.floor((window.innerHeight-70)/h));
    for(let c=0;c<maxCol;c++) for(let r=0;r<maxRow;r++) if(!taken.has(c+':'+r)) return {x:c*w, y:r*h};
    return {x:0, y:maxRow*h};
  },
  snapPos(px, py, ignore){
    const {w,h}=CELL(); let c=Math.round(px/w), r=Math.round(py/h);
    c=clamp(c,0,Math.max(0,Math.floor((window.innerWidth-24)/w)));
    r=clamp(r,0,Math.max(0,Math.floor((window.innerHeight-80)/h)));
    const key=(cc,rr)=>cc+':'+rr;
    const occ=(cc,rr)=>{ for(const k in POS){ if(k===ignore) continue; const p=POS[k];
      if(Math.round(p.x/w)===cc && Math.round(p.y/h)===rr) return true; } return false; };
    if(occ(c,r)){
      const maxCol=Math.max(1,Math.floor((window.innerWidth-24)/w)), maxRow=Math.max(1,Math.floor((window.innerHeight-80)/h));
      let best=null, bd=1e9;
      for(let cc=0;cc<=maxCol;cc++) for(let rr=0;rr<=maxRow;rr++){ if(occ(cc,rr)) continue;
        const d=(cc-c)*(cc-c)+(rr-r)*(rr-r); if(d<bd){bd=d;best={x:cc*w,y:rr*h};} }
      if(best) return best;
    }
    return {x:c*w, y:r*h};
  },
  autoArrange(){
    const {w,h}=CELL(); POS={};
    const dirs=this.entries.filter(e=>e.type==='dir'), files=this.entries.filter(e=>e.type!=='dir');
    const all=dirs.concat(files); let i=0;
    const maxCol=Math.max(1,Math.floor((window.innerWidth-24)/w));
    all.forEach(e=>{ POS[e.path]={x:(i%maxCol)*w, y:Math.floor(i/maxCol)*h}; i++; });
    savePos(); this.refresh();
  },
  async refresh(){
    let list=[];
    try{ list = await FS.readdir('/Desktop'); }
    catch(e){ await FS.ensureDir('/Desktop'); list=[]; }
    this.entries = list.sort((a,b)=>(a.type===b.type? natCmp(a.name,b.name) : (a.type==='dir'?-1:1)));
    const host=$('#icons');
    const keep=new Set();
    this.entries.forEach(e=>{
      if(!POS[e.path]) POS[e.path] = this.cellFree();
      keep.add(e.path);
    });
    Object.keys(POS).forEach(k=>{ if(!keep.has(k)) delete POS[k]; });
    savePos();
    host.innerHTML='';
    this.entries.forEach((e,i)=>{
      const p=POS[e.path]||{x:0,y:0};
      const d = el('button', {class:'dicon', draggable:'true', 'data-path':e.path, 'data-type':e.type,
        style:'left:'+p.x+'px;top:'+p.y+'px;animation:winIn .45s var(--ease) '+(i*36)+'ms both'},
        '<span class="ico">'+I(iconOf(e.name, e.type==='dir'), parseInt(Cfg.d.iconSize))+'</span>'+
        '<span class="lbl">'+esc(e.name)+'</span>'+
        (e.mount?'<span class="tag">本地</span>':''));
      if(this.sel.has(e.path)) d.classList.add('sel');
      host.appendChild(d);
      this.wire(d, e);
    });
    Bus.emit('desktop:refresh');
  },
  select(paths){ this.sel=new Set(paths); $$('#icons .dicon').forEach(d=>d.classList.toggle('sel', this.sel.has(d.dataset.path))); },
  wire(d, e){
    const path=e.path;
    let lastTap=0;
    d.addEventListener('mousedown', async ev=>{ DragCache.preload(path); });
    d.addEventListener('mouseenter', ()=>{ DragCache.preload(path); });
    d.addEventListener('dblclick', ev=>{ ev.preventDefault(); openEntry(path, e.type); });
    d.addEventListener('click', ev=>{
      const now=Date.now();
      if(now-lastTap<400){ lastTap=0; return; } lastTap=now;
      if(ev.ctrlKey||ev.metaKey||ev.shiftKey){ if(this.sel.has(path)) this.sel.delete(path); else this.sel.add(path); }
      else this.sel=new Set([path]);
      this.select([...this.sel]);
    });
    /* ---- HTML5 原生拖拽（鼠标）：内部移动 + 拖出浏览器 ---- */
    d.addEventListener('dragstart', ev=>{
      if(!this.sel.has(path)) this.select([path]);
      const paths=[...this.sel];
      const dt=ev.dataTransfer; if(!dt) return;
      dt.effectAllowed='all';
      try{ dt.setData('application/x-orbit', JSON.stringify({paths, src:'desktop'})); }catch(x){}
      try{ dt.setData('text/plain', paths.map(p=>P.base(p)).join('\n')); }catch(x){}
      const rec=DragCache.get(path);
      if(rec && e.type==='file'){
        try{
          const file = new File([rec.blob], rec.name, {type:rec.type});
          dt.items.add(file);
          dt.setData('DownloadURL', rec.type+':'+rec.name+':'+rec.url);
        }catch(x){}
      }
      d.classList.add('dragging');
    });
    d.addEventListener('dragend', ()=>{ d.classList.remove('dragging'); $$('#icons .dicon').forEach(x=>x.classList.remove('dragover')); });
    /* 文件夹接收 */
    if(e.type==='dir'){
      d.addEventListener('dragover', ev=>{ ev.preventDefault(); ev.stopPropagation(); ev.dataTransfer.dropEffect='move'; d.classList.add('dragover'); });
      d.addEventListener('dragleave', ()=>d.classList.remove('dragover'));
      d.addEventListener('drop', async ev=>{
        ev.preventDefault(); ev.stopPropagation(); d.classList.remove('dragover');
        const info=readOrbitDT(ev.dataTransfer);
        if(info && info.paths.length){
          for(const src of info.paths){ if(P.dir(src)===path) continue;
            try{ await FS.rename(src, await FS.unique(path, P.base(src))); }catch(err){ Toast.err(err.message); } }
          Desktop.refresh(); Bus.emit('fs:change',{type:'move'}); return;
        }
        await handleExternalDrop(ev, path);
      });
    }
    d.addEventListener('contextmenu', ev=>{ ev.preventDefault(); ev.stopPropagation();
      if(!this.sel.has(path)) this.select([path]);
      entryMenu(ev.clientX, ev.clientY, path, e.type, 'desktop'); });
    /* ---- 触摸拖拽（移动端） ---- */
    this.touchDrag(d, e);
  },
  touchDrag(d, e){
    let start=null, dragging=false, timer=null, ghost=null, target=null;
    const clear=()=>{ if(ghost){ghost.remove(); ghost=null;} d.classList.remove('dragging');
      $$('#icons .dicon').forEach(x=>x.classList.remove('dragover')); $$('.win').forEach(w=>w.classList.remove('peek-hide')); };
    d.addEventListener('touchstart', ev=>{
      if(ev.touches.length!==1) return;
      const t=ev.touches[0]; start={x:t.clientX,y:t.clientY,t:Date.now()};
      timer=setTimeout(()=>{ if(!start) return; dragging=true; DragCache.preload(e.path);
        d.classList.add('dragging');
        ghost=$('#ghost'); ghost.innerHTML='<div class="ico">'+I(iconOf(e.name,e.type==='dir'),28)+'</div><div>'+esc(e.name)+'</div>';
        ghost.style.display='block';
      }, 200);
    }, {passive:true});
    d.addEventListener('touchmove', ev=>{
      if(!start) return;
      const t=ev.touches[0];
      if(dragging){
        ev.preventDefault();
        ghost.style.left=(t.clientX-37)+'px'; ghost.style.top=(t.clientY-56)+'px';
        const el2=document.elementFromPoint(t.clientX,t.clientY);
        const di=el2 && el2.closest('.dicon');
        const win=el2 && el2.closest('.win');
        $$('#icons .dicon').forEach(x=>x.classList.remove('dragover'));
        $$('.win').forEach(w=>w.classList.remove('peek-hide'));
        if(di && di!==d && di.dataset.type==='dir'){ di.classList.add('dragover'); target={type:'icon', el:di}; }
        else if(win){ win.classList.add('peek-hide'); target={type:'win', el:win}; }
        else if(el2 && el2.closest('#desktop')) target={type:'desktop'};
        else target=null;
      } else if(Math.abs(t.clientX-start.x)+Math.abs(t.clientY-start.y)>12){ clearTimeout(timer); start=null; }
    }, {passive:false});
    d.addEventListener('touchend', async ev=>{
      clearTimeout(timer);
      if(dragging && target){
        const t=ev.changedTouches[0];
        if(target.type==='icon' && target.el.dataset.type==='dir'){
          const dir=target.el.dataset.path;
          if(P.dir(e.path)!==dir){ try{ await FS.rename(e.path, await FS.unique(dir, P.base(e.path))); Toast.ok('已移动到 '+P.base(dir)); }
            catch(err){ Toast.err(err.message); } this.refresh(); }
        } else if(target.type==='win'){
          const w=WM.wins.find(x=>x.el===target.el);
          if(w && w.dropPaths){ await w.dropPaths([e.path]); }
          else if(w && w.args && w.args.path && w.app.id==='files'){ try{ await FS.rename(e.path, await FS.unique(w.args.path, P.base(e.path))); }catch(err){Toast.err(err.message);} }
        } else if(target.type==='desktop'){
          const r=$('#icons').getBoundingClientRect();
          const np=this.snapPos(t.clientX-r.left-((parseInt(Cfg.d.grid)-14)/2), t.clientY-r.top-20, e.path);
          POS[e.path]=np; savePos(); this.refresh();
        }
      }
      clear(); dragging=false; start=null; target=null;
    });
  }
};
function readOrbitDT(dt){
  if(!dt) return null;
  const raw = dt.getData && (dt.getData('application/x-orbit') || dt.getData('text/x-orbit'));
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
/* ---------- 桌面事件：框选 / 拖放导入 / 右键 ---------- */
(function(){
  const icons=$('#icons'), box=$('#selbox'), layer=$('#desktop');
  /* 框选（鼠标 + 触摸，pointer 事件统一） */
  layer.addEventListener('pointerdown', ev=>{
    if(ev.target.closest('.dicon')) return;
    if(ev.button!==undefined && ev.button!==0) return;
    if(ev.pointerType==='touch' && ev.isPrimary===false) return;
    const r=layer.getBoundingClientRect(); const sx=ev.clientX-r.left, sy=ev.clientY-r.top;
    let active=true; layer.setPointerCapture(ev.pointerId);
    const mv=e=>{
      if(!active) return;
      const x=e.clientX-r.left, y=e.clientY-r.top;
      const l=Math.min(sx,x), t=Math.min(sy,y), w=Math.abs(x-sx), h=Math.abs(y-sy);
      if(w<4&&h<4) return;
      Object.assign(box.style,{display:'block',left:l+'px',top:t+'px',width:w+'px',height:h+'px'});
      const sel=[];
      $$('#icons .dicon').forEach(d=>{
        const dr=d.getBoundingClientRect();
        const il=dr.left-r.left, it=dr.top-r.top;
        if(il<l+w && il+dr.width>l && it<t+h && it+dr.height>t) sel.push(d.dataset.path);
      });
      Desktop.select(sel);
    };
    const up=()=>{ active=false; box.style.display='none';
      layer.removeEventListener('pointermove',mv); layer.removeEventListener('pointerup',up); layer.removeEventListener('pointercancel',up); };
    layer.addEventListener('pointermove', mv); layer.addEventListener('pointerup', up); layer.addEventListener('pointercancel', up);
    if(!ev.ctrlKey && !ev.shiftKey) Desktop.select([]);
  });
  /* 外部拖入 */
  layer.addEventListener('dragover', ev=>{ ev.preventDefault(); if(ev.dataTransfer) ev.dataTransfer.dropEffect=readOrbitDT(ev.dataTransfer)?'move':'copy'; });
  layer.addEventListener('drop', async ev=>{
    ev.preventDefault();
    const info=readOrbitDT(ev.dataTransfer);
    if(info && info.paths.length){
      /* 内部移动图标 */
      const r=layer.getBoundingClientRect();
      const paths=info.paths;
      if(paths.length===1){
        const p=paths[0];
        if(P.dir(p)==='/Desktop'){
          POS[p]=Desktop.snapPos(ev.clientX-r.left-((parseInt(Cfg.d.grid)-14)/2), ev.clientY-r.top-20, p);
          savePos(); Desktop.refresh(); return;
        } else {
          try{ await FS.rename(p, await FS.unique('/Desktop', P.base(p))); }catch(e){ Toast.err(e.message); }
          Desktop.refresh(); return;
        }
      }
      for(const p of paths){ if(P.dir(p)==='/Desktop') continue;
        try{ await FS.rename(p, await FS.unique('/Desktop', P.base(p))); }catch(e){} }
      Desktop.refresh(); return;
    }
    await handleExternalDrop(ev, '/Desktop');
  });
  layer.addEventListener('contextmenu', ev=>{
    if(ev.target.closest('.dicon')) return;
    ev.preventDefault(); Desktop.select([]);
    const x=ev.clientX, y=ev.clientY;
    showCtx(x,y,[
      {label:'刷新', icon:'refresh', onClick:()=>Desktop.refresh()},
      {label:'新建', icon:'plus', items:[

async function renameEntry(path){
  const n = await UI.prompt('重命名','输入新名称', P.base(path));
  if(!n || n===P.base(path)) return;
  try{ await FS.rename(path, P.join(P.dir(path), n)); Toast.ok('已重命名'); }
  catch(e){ Toast.err(e.message); }
}
async function deleteEntries(paths){
  if(!paths.length) return;
  const ok = await UI.confirm('删除确认','将删除 '+paths.length+' 个项目：<div class="mono" style="margin-top:8px;color:var(--acc)">'+esc(paths.map(p=>P.base(p)).join('<br>'))+'</div>');
  if(!ok) return;
  let fail=0;
  for(const p of paths){ try{ await FS.remove(p); }catch(e){ fail++; Toast.err(e.message); } }
  if(!fail) Toast.ok('已删除');
  Desktop.refresh(); Bus.emit('fs:change',{type:'delete'});
}
async function pasteInto(dir){
  if(!Clipboard.paths.length) return;
  for(const p of Clipboard.paths){
    const base=P.base(p);
    let dst=P.join(dir, base);
    if(dst!==p){ if(await FS.exists(dst)) dst = await FS.unique(dir, base); try{ await FS.copy(p, dst); }catch(e){ Toast.err(e.message); continue; } }
    if(Clipboard.mode==='cut'){ try{ await FS.remove(p); }catch(e){} }
  }
  if(Clipboard.mode==='cut'){ Clipboard.paths=[]; Clipboard.mode=null; }
  Toast.ok('粘贴完成');
  Desktop.refresh(); Bus.emit('fs:change',{type:'paste'});
}
/* ---------- 外部文件导入（含目录递归） ---------- */
async function handleExternalDrop(ev, destDir){
  ev.__orbit = true; /* 标记已处理，避免冒泡到 document 后重复导入 */
  const dt=ev.dataTransfer; if(!dt) return false;
  const items=dt.items ? Array.from(dt.items) : [];
  const entries=[];
  for(const it of items){
    if(it.kind!=='file') continue;
    const ent = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
    if(ent) entries.push(ent); else { const f=it.getAsFile(); if(f) entries.push(f); }
  }
  if(!entries.length){
    const files=Array.from(dt.files||[]);
    if(files.length){ await importFiles(files, destDir); return true; }
    return false;
  }
  const busy=UI.busy('正在导入…'); document.body.appendChild(busy);
  let count=0;
  for(const ent of entries){
    try{ count += await importEntry(ent, destDir||'/Desktop'); }catch(e){ console.warn(e); }
  }
  busy.remove();
  Toast.ok('已导入 '+count+' 个项目');
  Desktop.refresh(); Bus.emit('fs:change',{type:'import'});
  return true;
}
async function importEntry(entry, dir){
  let n=0;
  if(entry.isFile){
    const file = await new Promise((res,rej)=>entry.file(res,rej));
    const name = file.name || entry.name || 'file';
    const dst = await FS.unique(dir, name);
    await FS.writeFile(dst, file); n=1;
  } else if(entry.isDirectory){
    const name = entry.name || '文件夹';
    const target = await FS.unique(dir, name);
    await FS.ensureDir(target);
    const reader = entry.createReader();
    let batch=[];
    do{
      batch = await new Promise((res,rej)=>reader.readEntries(res,rej));
      for(const c of batch){ n += await importEntry(c, target); }
    } while(batch.length>0);
  } else if(entry instanceof File){
    const dst = await FS.unique(dir, entry.name||'file'); await FS.writeFile(dst, entry); n=1;
  }
  return n;
}
async function importFiles(files, dir){
  const b=UI.busy('正在导入 '+files.length+' 个文件…'); document.body.appendChild(b);
  for(const f of files){
    try{ await FS.writeFile(await FS.unique(dir||'/Desktop', f.name||'file'), f); }
    catch(e){ Toast.err((f.name||'文件')+'：'+e.message); }
  }
  b.remove(); Toast.ok('导入完成');
  Desktop.refresh(); Bus.emit('fs:change',{type:'import'});
}
$('#filePick').addEventListener('change', async e=>{ const f=Array.from(e.target.files||[]); e.target.value=''; if(f.length) await importFiles(f,'/Desktop'); });
$('#wallPick').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  await FS.ensureDir('/System/Wallpapers');
  const dst='/System/Wallpapers/'+f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,'_');
  await FS.writeFile(dst, f);
  setWallpaperFromPath(dst, true);
});
async function setWallpaperFromPath(path, copy){
  try{
    if(copy){ await FS.ensureDir('/System/Wallpapers');
      if(P.dir(path)!=='/System/Wallpapers'){ const dst=await FS.unique('/System/Wallpapers', P.base(path)); await FS.copy(path, dst); path=dst; } }
    const blob=await FS.readFile(path);
    const url=Blobs.make('wallpaper', blob);
    Cfg.d.wallFile=url; Cfg.d.wallName=path; Cfg.save(); Cfg.apply();
    Toast.ok('壁纸已更新');
  }catch(e){ Toast.err(e.message); }
}
async function restoreWallpaper(){
  if(Cfg.d.wallName){
    try{ const blob=await FS.readFile(Cfg.d.wallName); const url=Blobs.make('wallpaper', blob);
      Cfg.d.wallFile=url; Cfg.apply(); return; }catch(e){}
  }
  Cfg.d.wallFile=''; Cfg.apply();
}
/* ---------- 统一打开分派（文件 or 目录） ---------- */
async function openEntry(path, hintType){
  let st;
  try{ st = await FS.stat(path); }catch(e){ Toast.err(e.message); return; }
  if(st.type==='dir'){ Apps.open('files', {path}); return; }
  const k = kindOf(path), e=extOf(path);
  if(e==='zip' || ['gz','tgz','tar','bz2','xz','7z','rar'].includes(e)){
    UI.modal({title:'压缩包 — '+P.base(path), body:'<div style="font-size:12.5px;line-height:1.8">检测到压缩文件 <b>'+esc(P.base(path))+'</b>。<br>选择操作：</div>',
      actions:[{label:'解压到当前目录', cls:'acc', onClick:()=>extractArchive(path, P.dir(path))},
               {label:'查看内容列表', onClick:()=>extractArchive(path, P.dir(path), true)},
               {label:'取消'}]});
    return;
  }
  if(k==='html'){
    const m=UI.modal({title:'HTML 文档', body:'<div style="font-size:12.5px;line-height:1.9">要如何打开 <b>'+esc(P.base(path))+'</b>？<br><span class="hint">编辑器右侧提供隔离实时预览</span></div>',
      actions:[
        {label:'编辑源代码', cls:'acc', onClick:()=>Apps.open('editor',{path})},
        {label:'浏览器打开', onClick:()=>Apps.open('browser',{path})},
        {label:'新标签页', onClick:async()=>{ const b=await FS.readFile(path); window.open(URL.createObjectURL(b),'_blank'); }},
        {label:'取消'}]});
    return;
  }
  if(k==='image'){
    try{
      const sib = (await FS.readdir(P.dir(path))).filter(x=>x.type==='file'&&kindOf(x.name)==='image').sort((a,b)=>natCmp(a.name,b.name));
      if(sib.length>=3){ Apps.open('manga',{path}); return; }
    }catch(x){}
    Apps.open('image',{path}); return;
  }
  if(k==='audio'||k==='video'){ Apps.open('media',{path}); return; }
  if(k==='pdf'){ Apps.open('pdf',{path}); return; }
  if(k==='table'){ Apps.open('table',{path}); return; }
  if(k==='text'){ Apps.open('editor',{path}); return; }
  UI.modal({title:'未知格式', body:'<div style="font-size:12.5px;line-height:1.8"><b>'+esc(P.base(path))+'</b><br><span class="mono hint">'+esc(mimeOf(path))+'</span><br>该格式没有专用查看器。</div>',
    actions:[{label:'用代码编辑器打开', cls:'acc', onClick:()=>Apps.open('editor',{path})},
             {label:'以纯文本打开', onClick:()=>Apps.open('notepad',{path})},
             {label:'媒体播放器', onClick:()=>Apps.open('media',{path})}, {label:'取消'}]});
}
