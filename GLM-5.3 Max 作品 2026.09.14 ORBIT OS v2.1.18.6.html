      head.innerHTML =
        '<div class="fth" data-k="name" style="flex:1 1 auto;min-width:140px">名称'+arrow('name')+'<span class="rgrip" data-c="name"></span></div>'+
        '<div class="fth date" data-k="date" style="width:'+cw.date+'px">修改日期'+arrow('date')+'<span class="rgrip" data-c="date"></span></div>'+
        '<div class="fth" data-k="type" style="width:'+cw.type+'px">类型'+arrow('type')+'<span class="rgrip" data-c="type"></span></div>'+
        '<div class="fth size" data-k="size" style="width:'+cw.size+'px;text-align:right">大小'+arrow('size')+'<span class="rgrip" data-c="size"></span></div>';
      function arrow(k){ return S.sort===k ? '<span class="ar">'+(S.dir>0?'▲':'▼')+'</span>' : ''; }
      if(S.view!=='grid') list.appendChild(head);
      if(!entries.length){
        list.appendChild(el('div',{class:'empty'}, S.term?'没有匹配「'+esc(S.term)+'」的项目':'此文件夹为空<div class="hint" style="margin-top:6px">拖入文件即可导入</div>'));
      }
      entries.forEach((e,i)=>{
        const isMount = FS.isMountRoot(e.path);
        const row = el('div',{class:'frow'+(S.sel.has(e.path)?' sel':''), draggable:'true','data-path':e.path,'data-type':e.type,
          style:'animation:winIn .28s var(--ease) '+(Math.min(i,26)*10)+'ms both'},
          '<div class="nm"><span class="ico">'+I(iconOf(e.name, e.type==='dir'), S.view==='grid'?32:17)+'</span><b>'+esc(e.name)+'</b>'+
            (isMount?'<i>本地</i>':'')+'</div>'+
          '<div class="cells">'+
            '<div class="fcell date" style="width:'+cw.date+'px">'+fmtDate(e.mtime)+'</div>'+
            '<div class="fcell" style="width:'+cw.type+'px">'+esc(typeLabel(e.name,e.type==='dir'))+'</div>'+
            '<div class="fcell size" style="width:'+cw.size+'px;text-align:right">'+(e.type==='dir'?'':fmtSize(e.size))+'</div>'+
          '</div>');
        list.appendChild(row); wireRow(row, e);
      });
      /* 列宽拖拽 */
      $$('.fth .rgrip', list).forEach(g=>{
        g.addEventListener('pointerdown', ev=>{
          ev.preventDefault(); ev.stopPropagation(); g.setPointerCapture(ev.pointerId);
          const th=g.parentElement, k=g.dataset.c; const sw=th.getBoundingClientRect().width; const sx=ev.clientX;
          const mv=e=>{ const w=Math.max(48, sw + (e.clientX-sx)); th.style.width=w+'px';
            $$('.fcell.'+k, list).forEach(c=>c.style.width=w+'px'); };
          const up=()=>{ g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',up);
            FX_COLS[k]=parseInt(th.style.width); localStorage.setItem('orbit.fxcols', JSON.stringify(FX_COLS)); };
          g.addEventListener('pointermove',mv); g.addEventListener('pointerup',up);
        });
      });
      $$('.fth', list).forEach(th=>th.onclick=()=>{
        const k=th.dataset.k; if(!k) return;
        if(S.sort===k) S.dir*=-1; else { S.sort=k; S.dir=1; }
        Cfg.set('sortKey',S.sort); Cfg.set('sortDir',S.dir); render();
      });
      renderStatus(entries);
    }
    function renderStatus(entries){
      const s=$w('#fxStatus');
      const n=entries!=null?entries.length:'—';
      const selN=S.sel.size;
      s.innerHTML='<span>'+esc(S.cwd)+'</span><span class="spacer" style="flex:1"></span>'+
        (selN?'<span style="color:var(--acc)">已选 '+selN+' 项</span>':'')+
        '<span>项目 '+n+'</span><span>排序：'+({name:'名称',date:'日期',type:'类型',size:'大小'}[S.sort])+(S.dir>0?' ↑':' ↓')+'</span>'+
        '<span>视图：'+(S.view==='grid'?'网格':'列表')+'</span>';
    }
    function wireRow(row, e){
      const path=e.path;
      row.addEventListener('mousedown', ()=>DragCache.preload(path));
      row.addEventListener('mouseenter', ()=>DragCache.preload(path));
      let last=0;
      row.addEventListener('click', ev=>{
        const now=Date.now(); if(now-last<380){ last=0; return; } last=now;
        if(ev.ctrlKey||ev.metaKey||ev.shiftKey){ S.sel.has(path)?S.sel.delete(path):S.sel.add(path); }
        else S.sel=new Set([path]);
        $$('.frow', win.el).forEach(r=>r.classList.toggle('sel', S.sel.has(r.dataset.path)));
        renderStatus();
      });
      row.addEventListener('dblclick', ev=>{ ev.preventDefault(); openEntry(path, e.type); });
      row.addEventListener('dragstart', ev=>{
        if(!S.sel.has(path)) S.sel=new Set([path]);
        $$('.frow', win.el).forEach(r=>r.classList.toggle('sel', S.sel.has(r.dataset.path)));
        const paths=[...S.sel]; const dt=ev.dataTransfer; if(!dt) return;
        dt.effectAllowed='all';
        try{ dt.setData('application/x-orbit', JSON.stringify({paths, src:'explorer'})); }catch(x){}
        try{ dt.setData('text/plain', paths.map(p=>P.base(p)).join('\n')); }catch(x){}
        const rec=DragCache.get(path);
        if(rec && e.type==='file'){
          try{ dt.items.add(new File([rec.blob], rec.name, {type:rec.type}));
            dt.setData('DownloadURL', rec.type+':'+rec.name+':'+rec.url); }catch(x){}
        }
      });
      row.addEventListener('dragend', ()=>$$('.frow,.dicon', win.el).forEach(x=>x.classList.remove('dragover')));
      if(e.type==='dir'){
        row.addEventListener('dragover', ev=>{ ev.preventDefault(); ev.stopPropagation(); ev.dataTransfer.dropEffect='move'; row.classList.add('dragover'); });
        row.addEventListener('dragleave', ()=>row.classList.remove('dragover'));
        row.addEventListener('drop', async ev=>{
          ev.preventDefault(); ev.stopPropagation(); row.classList.remove('dragover');
          const info=readOrbitDT(ev.dataTransfer);
          if(info && info.paths.length){
            for(const src of info.paths){ if(P.dir(src)===path) continue;
              try{ await FS.rename(src, await FS.unique(path, P.base(src))); }catch(err){ Toast.err(err.message); } }
            render(); return;
          }
          await handleExternalDrop(ev, path); render();
        });
      }
      row.addEventListener('contextmenu', ev=>{ ev.preventDefault(); ev.stopPropagation();
        if(!S.sel.has(path)) S.sel=new Set([path]);
        $$('.frow', win.el).forEach(r=>r.classList.toggle('sel', S.sel.has(r.dataset.path)));
        entryMenu(ev.clientX, ev.clientY, path, e.type, 'explorer'); });
      /* 触摸拖拽（移动端） */
      let start=null, dragging=false, timer=null, ghost=null, tgt=null;
      const clr=()=>{ if(ghost){ghost.remove();ghost=null;} row.classList.remove('dragging');
        $$('.frow',win.el).forEach(x=>x.classList.remove('dragover')); $$('.win').forEach(w=>w.classList.remove('peek-hide')); };
      row.addEventListener('touchstart', ev=>{
        if(ev.touches.length!==1) return; const t=ev.touches[0]; start={x:t.clientX,y:t.clientY};
        timer=setTimeout(()=>{ if(!start) return; dragging=true; DragCache.preload(path); row.classList.add('dragging');
          ghost=el('div',{id:'ghost',style:'display:block;left:'+(t.clientX-37)+'px;top:'+(t.clientY-56)+'px'},
            '<div class="ico">'+I(iconOf(e.name,e.type==='dir'),28)+'</div><div>'+esc(e.name)+'</div>');
          document.body.appendChild(ghost); }, 220);
      }, {passive:true});
      row.addEventListener('touchmove', ev=>{
        if(!start) return; const t=ev.touches[0];
        if(dragging){ ev.preventDefault();
          if(ghost){ ghost.style.left=(t.clientX-37)+'px'; ghost.style.top=(t.clientY-56)+'px'; }
          const el2=document.elementFromPoint(t.clientX,t.clientY);
          $$('.frow',win.el).forEach(x=>x.classList.remove('dragover'));
          $$('.win').forEach(w=>w.classList.remove('peek-hide'));
          const fr=el2 && el2.closest('.frow'); const wn=el2 && el2.closest('.win');
          if(fr && fr!==row && fr.dataset.type==='dir'){ fr.classList.add('dragover'); tgt={t:'row',el:fr}; }
          else if(wn && wn!==win.el){ wn.classList.add('peek-hide'); tgt={t:'win',el:wn}; }
          else tgt=null;
        } else if(Math.abs(t.clientX-start.x)+Math.abs(t.clientY-start.y)>12){ clearTimeout(timer); start=null; }
      }, {passive:false});
      row.addEventListener('touchend', async ev=>{
        clearTimeout(timer);
        if(dragging && tgt){
          const paths=[...S.sel]; if(!paths.includes(path)) paths.push(path);
          if(tgt.t==='row'){ const dir=tgt.el.dataset.path;
            for(const p of paths){ if(P.dir(p)===dir) continue; try{ await FS.rename(p, await FS.unique(dir,P.base(p))); }catch(err){Toast.err(err.message);} } }
          else if(tgt.t==='win'){ const w=WM.wins.find(x=>x.el===tgt.el);
            if(w && w.dropPaths) await w.dropPaths(paths); }
          render();
        }
        clr(); dragging=false; start=null; tgt=null;
      });
    }
    /* ---------- 列表背景：框选 + 拖放 ---------- */
    const listEl = $w('#fxList');
    listEl.addEventListener('pointerdown', ev=>{
      if(ev.target.closest('.frow') || ev.target.closest('.fhead')) return;
      if(ev.button!==undefined && ev.button!==0) return;
      const r=listEl.getBoundingClientRect(); const sx=ev.clientX-r.left+listEl.scrollLeft, sy=ev.clientY-r.top+listEl.scrollTop;
      if(!ev.ctrlKey) { S.sel.clear(); $$('.frow',win.el).forEach(x=>x.classList.remove('sel')); }
      const sb=el('div',{style:'position:absolute;z-index:9;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);pointer-events:none'});
      listEl.appendChild(sb); let act=true;
      const mv=e=>{
        if(!act) return;
        const x=e.clientX-r.left+listEl.scrollLeft, y=e.clientY-r.top+listEl.scrollTop;
        Object.assign(sb.style,{display:'block',left:Math.min(sx,x)+'px',top:Math.min(sy,y)+'px',width:Math.abs(x-sx)+'px',height:Math.abs(y-sy)+'px'});
        $$('.frow',win.el).forEach(rw=>{ const rr=rw.getBoundingClientRect();
          const l=rr.left-r.left+listEl.scrollLeft, t=rr.top-r.top+listEl.scrollTop;
          const hit = l<Math.max(sx,x) && l+rr.width>Math.min(sx,x) && t<Math.max(sy,y) && t+rr.height>Math.min(sy,y);
          if(hit) S.sel.add(rw.dataset.path); else if(!ev.ctrlKey) S.sel.delete(rw.dataset.path);
          rw.classList.toggle('sel', S.sel.has(rw.dataset.path)); });
      };
      const up=()=>{ act=false; sb.remove(); listEl.removeEventListener('pointermove',mv); listEl.removeEventListener('pointerup',up); renderStatus(); };
      listEl.addEventListener('pointermove',mv); listEl.addEventListener('pointerup',up);
    });
    listEl.addEventListener('dragover', ev=>{ ev.preventDefault(); if(ev.dataTransfer) ev.dataTransfer.dropEffect=readOrbitDT(ev.dataTransfer)?'move':'copy'; });
    listEl.addEventListener('drop', async ev=>{
      if(ev.target.closest('.frow')) return;
      ev.preventDefault();
      const info=readOrbitDT(ev.dataTransfer);
      if(info && info.paths.length){
        for(const p of info.paths){ if(P.dir(p)===S.cwd) continue;
          try{ await FS.rename(p, await FS.unique(S.cwd, P.base(p))); }catch(e){ Toast.err(e.message); } }
        render(); return;
      }
      await handleExternalDrop(ev, S.cwd); render();
    });
    listEl.addEventListener('contextmenu', ev=>{
      if(ev.target.closest('.frow')) return;
      ev.preventDefault();
      const isRoot = S.cwd==='/';
      showCtx(ev.clientX, ev.clientY, [
        {label:'刷新', icon:'refresh', onClick:render},
        {label:'新建文件夹', icon:'folder', onClick:async()=>{ await FS.mkdir(await FS.unique(S.cwd,'新建文件夹')); render(); }},
        {label:'新建文本文件', icon:'newfile', onClick:async()=>{ await FS.writeText(await FS.unique(S.cwd,'新建文本.txt'),''); render(); }},
        {sep:1},
        {label:'粘贴', icon:'paste', disabled:!Clipboard.paths.length, onClick:()=>pasteInto(S.cwd).then(render)},
        {label:'导入文件…', icon:'upload', onClick:()=>{
          const inp=el('input',{type:'file',multiple:'',style:'display:none'}); document.body.appendChild(inp);
          inp.onchange=async()=>{ await importFiles(Array.from(inp.files||[]), S.cwd); inp.remove(); render(); }; inp.click(); }},
        {label:'深度搜索此目录', icon:'search', onClick:()=>{ $w('#fxSearch').focus(); }},
        {sep:1},
        {label:'在新窗口打开', icon:'explorer', onClick:()=>Apps.open('files',{path:S.cwd})},
        {label:'压缩当前目录', icon:'archive', disabled:isRoot, onClick:()=>zipPaths([S.cwd], P.join(P.dir(S.cwd), P.base(S.cwd)+'.zip'))},
        {label:'属性', icon:'info', onClick:()=>showProps(S.cwd)}
      ]);
    });
    /* ---------- 工具栏 ---------- */
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return;
      const a=b.dataset.a;
      if(a==='side') $w('#fxSide').classList.toggle('open');
      if(a==='back' && S.hi>0){ S.hi--; S.cwd=P.norm(S.hist[S.hi]); win.args.path=S.cwd; render(); }
      if(a==='fwd' && S.hi<S.hist.length-1){ S.hi++; S.cwd=P.norm(S.hist[S.hi]); win.args.path=S.cwd; render(); }
      if(a==='up') nav(P.dir(S.cwd));
      if(a==='ref') render();
      if(a==='newdir'){ await FS.mkdir(await FS.unique(S.cwd,'新建文件夹')); render(); }
      if(a==='newfile'){ const n=await UI.prompt('新建文件','文件名（含扩展名）','新建文件.txt'); if(!n) return;
        await FS.writeText(await FS.unique(S.cwd,n),''); render(); }
      if(a==='import'){ const inp=el('input',{type:'file',multiple:'',style:'display:none'}); document.body.appendChild(inp);
        inp.onchange=async()=>{ await importFiles(Array.from(inp.files||[]), S.cwd); inp.remove(); render(); }; inp.click(); }
      if(a==='mount'){ try{ const p=await FS.pickLocal(); Toast.ok('已挂载 '+p); render(); }catch(e){ Toast.err(e.message); } }
      if(a==='view'){ S.view = S.view==='grid'?'list':'grid'; Cfg.set('explorerMode',S.view);
        b.innerHTML=I(S.view==='grid'?'list':'grid',13); render(); }
      if(a==='sort'){ showCtx(ev.clientX, ev.clientY-140, [
        ['name','名称'],['date','修改日期'],['type','类型'],['size','大小']].map(([k,l])=>
        ({label:l+(S.sort===k?(S.dir>0?' ↑':' ↓'):''), icon:'sortAsc', onClick:()=>{ if(S.sort===k)S.dir*=-1; else S.dir=1; S.sort=k; render(); }}))
        .concat([{sep:1},{label:'切换列表 / 网格视图', icon:'grid', onClick:()=>{S.view=S.view==='grid'?'list':'grid'; render();}}])); }
    });
    $w('#fxSearch').oninput = debounce(e=>{ S.term=e.target.value.trim(); render(); }, 200);
    win.el.addEventListener('keydown', ev=>{
      if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      const k=ev.key.toLowerCase();
      if(k==='delete'){ deleteEntries([...S.sel]); }
      if(k==='f2' && S.sel.size===1){ renameEntry([...S.sel][0]); }
      if(ev.ctrlKey && k==='c'){ Clipboard.mode='copy'; Clipboard.paths=[...S.sel]; Toast.info('已复制'); }
      if(ev.ctrlKey && k==='x'){ Clipboard.mode='cut'; Clipboard.paths=[...S.sel]; Toast.info('已剪切'); }
      if(ev.ctrlKey && k==='v'){ pasteInto(S.cwd).then(render); }
      if(ev.ctrlKey && k==='a'){ ev.preventDefault(); S.sel=new Set($$('.frow',win.el).map(r=>r.dataset.path));
        $$('.frow',win.el).forEach(r=>r.classList.add('sel')); renderStatus(); }
    });
    win.el.tabIndex=0;
    render();
    const off = Bus.on('fs:change', ()=>{ if(!win.dead) render(); });
    win.onClose = ()=>off();
  }
});
</script>
<script>
/* ================================================================
   记事本（撤销/重做、字号、自动保存）
   ================================================================ */
Apps.register({
  id:'notepad', name:'记事本', icon:'notepad', w:760, h:520, tags:'文本 编辑',
  init(win, args){
    const S={path:args.path||null, dirty:false, font:Cfg.d.notepadFont||13, wrap:true, hist:[], hi:-1, lastSave:0};
    win.el.querySelector('.win-body').innerHTML =
      '<div class="bar">'+
        '<button class="btn sm" data-a="open">'+I('folderOpen',12)+' 打开</button>'+
        '<button class="btn sm" data-a="save">'+I('save',12)+' 保存</button>'+
        '<button class="btn sm" data-a="saveas">另存为</button>'+
        '<span style="width:1px;height:18px;background:var(--line)"></span>'+
        '<button class="btn sm icon" data-a="undo" title="撤销 Ctrl+Z">'+I('undo',13)+'</button>'+
        '<button class="btn sm icon" data-a="redo" title="重做 Ctrl+Y">'+I('redo',13)+'</button>'+
        '<span style="width:1px;height:18px;background:var(--line)"></span>'+
        '<button class="btn sm icon" data-a="fs-" title="减小字号">A-</button>'+
        '<button class="btn sm icon" data-a="fs+" title="增大字号">A+</button>'+
        '<button class="btn sm" data-a="wrap">'+(S.wrap?'自动换行':'不换行')+'</button>'+
        '<button class="btn sm" data-a="find">查找</button>'+
        '<span class="spacer"></span>'+
        '<button class="btn sm" data-a="export">'+I('download',12)+' 导出</button>'+
      '</div>'+
      '<div class="np-find" id="npFind" style="display:none">'+
        '<input class="field" id="npQ" placeholder="查找内容">'+
        '<button class="btn sm" data-a="fnext">下一个</button>'+
        '<button class="btn sm" data-a="fclose">关闭</button>'+
        '<span class="hint" id="npStat"></span>'+
      '</div>'+
      '<textarea class="ta" id="npTa" spellcheck="false"></textarea>'+
      '<div class="statusbar" id="npStat2"></div>';
    const ta=win.el.querySelector('#npTa'), $w=s=>win.el.querySelector(s);
    function push(force){
      const v=ta.value; const sel=[ta.selectionStart, ta.selectionEnd];
      if(S.hist.length && !force && S.hist[S.hi].v===v) return;
      S.hist = S.hist.slice(0, S.hi+1); S.hist.push({v, sel});
      if(S.hist.length>200) S.hist.shift();
      S.hi=S.hist.length-1;
    }
    function apply(v, sel){
      ta.value=v; if(sel){ ta.selectionStart=sel[0]; ta.selectionEnd=sel[1]; }
      S.dirty=true; status();
    }
    const undo=()=>{ if(S.hi>0){ S.hi--; const h=S.hist[S.hi]; apply(h.v, h.sel); } else Toast.info('没有可撤销的操作'); };
    const redo=()=>{ if(S.hi<S.hist.length-1){ S.hi++; const h=S.hist[S.hi]; apply(h.v,h.sel); } else Toast.info('没有可重做的操作'); };
    function status(){
      const lines=ta.value.split('\n').length, chars=ta.value.length;
      $w('#npStat2').innerHTML='<span>'+(S.path?esc(S.path):'未命名文档')+'</span>'+
        '<span class="spacer" style="flex:1"></span>'+
        (S.dirty?'<span style="color:var(--warn)">● 未保存</span>':'<span style="color:var(--acc2)">✓ 已保存</span>')+
        '<span>行 '+lines+'</span><span>字符 '+chars+'</span><span>UTF-8</span><span>字号 '+S.font+'</span>';
      win.setTitle((S.path?P.base(S.path):'未命名')+' — 记事本');
    }
    const autoSave = debounce(async()=>{
      if(!S.path || !Cfg.d.autoSave || !S.dirty) return;
      try{ await FS.writeText(S.path, ta.value); S.dirty=false; S.lastSave=Date.now(); status(); }catch(e){}
    }, 900);
    ta.addEventListener('input', ()=>{ S.dirty=true; push(); status(); autoSave(); });
    ta.addEventListener('keydown', e=>{
      if(e.ctrlKey && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
      else if(e.ctrlKey && (e.key.toLowerCase()==='y' || (e.shiftKey&&e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
      else if(e.ctrlKey && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); }
      else if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart;
        ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s+2; S.dirty=true; }
    });
    ta.addEventListener('wheel', e=>{ if(e.ctrlKey){ e.preventDefault(); setFont(S.font + (e.deltaY<0?1:-1)); } }, {passive:false});
    function setFont(n){ S.font=clamp(n,9,34); ta.style.fontSize=S.font+'px'; ta.style.lineHeight=(S.font*1.6)+'px'; Cfg.set('notepadFont',S.font); status(); }
    async function load(path){
      try{
        const b=await FS.readFile(path);
        const txt=await b.text();
        S.path=path; ta.value=txt; S.hist=[]; S.hi=-1; push(true); S.dirty=false;
        ta.style.fontSize=S.font+'px'; status(); win.setTitle(P.base(path)+' — 记事本');
      }catch(e){ Toast.err(e.message); }
    }
    async function save(as){
      if(!S.path || as){
        const n=await UI.prompt('保存文件','保存路径（完整路径）', S.path||'/Documents/未命名.txt');
        if(!n) return; S.path=P.norm(n);
      }
      try{ await FS.writeText(S.path, ta.value); S.dirty=false; status(); Toast.ok('已保存到 '+S.path); }
      catch(e){ Toast.err('保存失败：'+e.message); }
    }
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return;
      const a=b.dataset.a;
      if(a==='open'){ const n=await UI.prompt('打开文件','完整路径', S.path||'/Documents/笔记.md'); if(n) load(P.norm(n)); }
      if(a==='save') save(false);
      if(a==='saveas') save(true);
      if(a==='undo') undo(); if(a==='redo') redo();
      if(a==='fs-') setFont(S.font-1); if(a==='fs+') setFont(S.font+1);
      if(a==='wrap'){ S.wrap=!S.wrap; ta.wrap=S.wrap?'soft':'off'; ta.style.whiteSpace=S.wrap?'pre-wrap':'pre';
        b.textContent=S.wrap?'自动换行':'不换行'; }

/* ================================================================
   表格（CSV / TSV 双视图）
   ================================================================ */
function parseDSV(txt, delim){
  const rows=[]; let row=[], cur='', q=false, i=0;
  txt=txt.replace(/\r\n?/g,'\n').replace(/\n$/,'');
  while(i<txt.length){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){ cur+='"'; i+=2; continue; } q=false; i++; continue; }
      cur+=c; i++; continue;
    }
    if(c==='"' && cur===''){ q=true; i++; continue; }
    if(c===delim){ row.push(cur); cur=''; i++; continue; }
    if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; i++; continue; }
    cur+=c; i++;
  }
  row.push(cur); rows.push(row);
  return rows;
}
function toDSV(rows, delim){
  const escC=v=>{ v=v==null?'':String(v);
    if(v.includes(delim)||v.includes('"')||v.includes('\n')) return '"'+v.replace(/"/g,'""')+'"'; return v; };
  return rows.map(r=>r.map(escC).join(delim)).join('\n');
}

      $w('#tStat').textContent=(S.path?P.base(S.path)+' · ':'')+'分隔符 "'+(S.delim==='\t'?'\\t':S.delim)+'" · '+r+' 行 × '+c+' 列'; }
    function renderGrid(){
      const g=$w('#tGrid'); g.innerHTML='';
      const t=el('table',{class:'tbl'});
      const head=el('tr');
      head.appendChild(el('th',null,''));
      for(let c=0;c<cols();c++) head.appendChild(el('th',null,String.fromCharCode(65+c%26).repeat(Math.floor(c/26)+1)));
      t.appendChild(head);
      S.rows.forEach((row,ri)=>{
        const tr=el('tr');
        tr.appendChild(el('th',{style:'text-align:center'},String(ri+1)));
        for(let c=0;c<cols();c++){
          const td=el('td',{contenteditable:'true','data-r':ri,'data-c':c}, esc(row[c]==null?'':row[c]));
          td.oninput=()=>{ while(S.rows[ri].length<=c) S.rows[ri].push(''); S.rows[ri][c]=td.textContent; S.dirty=true; stat(); };
          tr.appendChild(td);
        }
        t.appendChild(tr);
      });
      g.appendChild(t);
      stat();
    }
    const cols=()=>Math.max.apply(null,S.rows.map(r=>r.length).concat([1]));
    function renderText(){ $w('#tTa').value = S.delim==='\t' ? S.rows.map(r=>r.join('\t')).join('\n') : toDSV(S.rows, S.delim); }

        S.path=path; S.delim = extOf(path)==='tsv' ? '\t' : (txt.split('\n')[0].includes('\t') && !txt.split('\n')[0].includes(',') ? '\t' : ',');

        await FS.writeText(p, txt); S.path=p; S.dirty=false; Toast.ok('已保存 '+p); stat();
      }
      if(a==='row'){ S.rows.push(new Array(cols()).fill('')); renderGrid(); }

      if(a==='export'){ download(S.path?P.base(S.path):'表格.csv', new Blob([serialize()],{type:'text/csv'})); }
    });
    if(args.path) load(args.path);
    else { S.rows=[['列 A','列 B','列 C'],['','','']]; renderGrid(); renderText(); }
  }
});

    lineNumbers:true, lineWrapping:true, styleActiveLine:true, showTrailingSpace:true,
    matchBrackets:true, autoCloseBrackets:true, matchTags:{bothTags:true}, autoCloseTags:true,
    foldGutter:true, gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
    indentUnit:2, tabSize:2, indentWithTabs:false, autofocus:true,
    extraKeys:{
      'Ctrl-S':()=>window.__edSave&&window.__edSave(),
      'Cmd-S':()=>window.__edSave&&window.__edSave(),
      'Ctrl-Enter':()=>window.__edRun&&window.__edRun(),
      'Cmd-Enter':()=>window.__edRun&&window.__edRun(),
      'Ctrl-Shift-F':()=>window.__edFmt&&window.__edFmt(),
      'Ctrl-F':()=>window.__edFind&&window.__edFind(),

      'Ctrl-H':()=>window.__edRep&&window.__edRep(),

      'Esc':()=>window.__edEsc&&window.__edEsc(),
      'Ctrl-Y':cmx=>cmx.redo(), 'Shift-Ctrl-Z':cmx=>cmx.redo(),

}
/* 无网络降级：纯 textarea 编辑器，API 与 CodeMirror 子集兼容 */
function fallbackAPI(ta){
  const fire=(n)=>handlers[n]&&handlers[n].forEach(f=>f());
  const handlers={};
  return {
    kind:'fallback', ta,
    on(n,f){ (handlers[n]=handlers[n]||[]).push(f); },
    getValue:()=>ta.value, setValue(v){ ta.value=v; fire('change'); },
    focus:()=>ta.focus(),
    getCursor(){ const p=ta.value.slice(0,ta.selectionStart).split('\n');
      return {line:p.length-1, ch:p[p.length-1].length}; },
    somethingSelected:()=>ta.selectionStart!==ta.selectionEnd,
    getSelection:()=>ta.value.slice(ta.selectionStart,ta.selectionEnd),
    indexFromPos(p){ const ls=ta.value.split('\n'); let i=0;
      for(let k=0;k<p.line&&k<ls.length;k++) i+=ls[k].length+1; return i+(p.ch||0); },
    posFromIndex(i){ const pre=ta.value.slice(0,i).split('\n'); return {line:pre.length-1, ch:pre[pre.length-1].length}; },
    setSelection(a,b){ const s=this.indexFromPos(a), e=this.indexFromPos(b);
      ta.focus(); ta.setSelectionRange(Math.min(s,e),Math.max(s,e)); },
    scrollIntoView(){},
    markText(){ return {clear(){}, find(){return null;}}; },
    execCommand(c){ if(c==='undo') document.execCommand('undo'); else if(c==='redo') document.execCommand('redo'); },
    foldCode(){}, foldAll(){}, unfoldAll(){}, refresh(){}, toTextArea(){ ta.remove(); },
    eachLine(){}, operation(f){ return f(); },
    getSearchCursor(q,start){ /* 简易游标 */ let from=start?start.ch+(start.line>=0?0:0):0;
      const self=this; let pos=0;
      const idx=()=>{ const s=self.indexFromPos(start||{line:0,ch:0}); return s; };
      return { findNext(){ const v=ta.value; const st=typeof this._i==='number'?this._i:idx();
        const m=v.indexOf(q.source||q, st); if(m<0) return false; this._f=m; this._t=m+(q.source?q.lastIndex||String(q).length:q.length);
        return true; }, from(){return self.posFromIndex(this._f)}, to(){return self.posFromIndex(this._t)} }; }
  };
}
const MODES = [
  ['htmlmixed','HTML'],['css','CSS'],['javascript','JavaScript'],['markdown','Markdown'],['application/json','JSON'],['xml','XML / SVG']
];
function modeForExt(name){
  const e=extOf(name);
  if(['html','htm'].includes(e)) return 'htmlmixed';
  if(e==='css') return 'css';
  if(['js','mjs','cjs'].includes(e)) return 'javascript';
  if(e==='json') return 'application/json';
  if(['md','markdown'].includes(e)) return 'markdown';
  if(['xml','svg'].includes(e)) return 'xml';
  if(['ts','tsx','jsx'].includes(e)) return 'javascript';
  return 'htmlmixed';
}
function extForMode(m){
  return {'htmlmixed':'.html','css':'.css','javascript':'.js','markdown':'.md','application/json':'.json','xml':'.xml'}[m]||'.txt';
}
Apps.register({

  init(win, args){

        '<select class="field" id="edMode">'+MODES.map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select>'+

        '<button class="btn sm" data-a="fold">折叠</button>'+

        '<button class="btn sm" data-a="import">'+I('upload',12)+' 导入</button>'+

      '</div>'+

        '<span class="hint" id="edCnt">0/0</span>'+
        '<input class="field" id="edR" placeholder="替换为">'+
        '<button class="tog" data-t="case">Aa</button>'+

        '<div class="edsplit" id="edSplit"></div>'+
        '<div class="edright">'+
          '<div class="bar" style="padding:4px 8px"><span class="hint">实时预览 · 沙箱隔离</span><span class="spacer"></span>'+
            '<button class="btn sm icon" data-a="browse" title="在浏览器中打开">'+I('browser',12)+'</button></div>'+
          '<iframe id="edFrame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox"></iframe>'+
        '</div>'+
      '</div>'+
      '<div class="statusbar" id="edStat"></div>'+
      '<input type="file" id="edFile" style="display:none">';
    const $w=s=>win.el.querySelector(s);

    else { E = fallbackAPI(built.ta); built.ta.className='ta'; built.ta.style.cssText='flex:1;width:100%;resize:none;border:0;outline:none;background:var(--bg2);color:var(--ink);padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.65';
      Toast.warn('CodeMirror 未能加载（离线？），已切换为降级编辑内核');

    window.__edSave=()=>save(false); window.__edRun=runPreview; window.__edFmt=fmt;
    window.__edFind=()=>{ const f=$w('#edFind'); f.classList.add('on'); $w('#edQ').focus(); };
    window.__edRep=()=>{ const f=$w('#edFind'); f.classList.add('on'); $w('#edQ').focus(); $w('#edR').focus(); };
    window.__edNext=nextHit; window.__edPrev=prevHit;
    window.__edEsc=()=>{ $w('#edFind').classList.remove('on'); };
    /* ---------- 分割条 ---------- */
    const split=$w('#edSplit'), left=$w('.edleft');
    split.addEventListener('pointerdown', e=>{
      e.preventDefault(); split.setPointerCapture(e.pointerId); split.classList.add('on');
      const horiz = window.innerWidth>=860;
      const wrap=win.el.querySelector('.edwrap').getBoundingClientRect();
      const mv=ev=>{
        if(horiz){ const pct=clamp((ev.clientX-wrap.left)/wrap.width, 0.18, 0.82); left.style.flex='0 0 '+(pct*100)+'%'; }
        else { const pct=clamp((ev.clientY-wrap.top)/wrap.height, 0.18, 0.82); left.style.flex='0 0 '+(pct*100)+'%'; }
      };
      const up=()=>{ split.classList.remove('on'); split.removeEventListener('pointermove',mv); split.removeEventListener('pointerup',up);
        try{ E.refresh(); }catch(e){} };
      split.addEventListener('pointermove',mv); split.addEventListener('pointerup',up);
    });
    /* ---------- 工具栏 ---------- */
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return;
      const a=b.dataset.a;
      if(a==='run'||a==='refresh') runPreview();
      if(a==='preview'){ Cfg.set('previewOn', !Cfg.d.previewOn); Toast.info('实时预览：'+(Cfg.d.previewOn?'开':'关'));
        win.el.querySelector('.edright').style.display = Cfg.d.previewOn?'flex':'none';
        try{E.refresh();}catch(e){} }
      if(a==='fmt') fmt();
      if(a==='undo') E.execCommand('undo'); if(a==='redo') E.execCommand('redo');
      if(a==='fold'){ if(E.foldAll){ E.operation(()=>{ const n=E.lineCount(); for(let i=0;i<n;i++) E.foldCode(CodeMirror.Pos(i,0), null, 'fold'); }); } else Toast.info('降级内核不支持折叠'); }
      if(a==='unfold'){ if(E.foldAll){ E.operation(()=>{ const n=E.lineCount(); for(let i=0;i<n;i++) E.foldCode(CodeMirror.Pos(i,0), null, 'unfold'); }); } }
      if(a==='find'){ window.__edFind(); }
      if(a==='prev') prevHit();
      if(a==='next') nextHit();
      if(a==='rep1'){
        const h=S.hits[S.idx]; if(!h) return;
        const r=$w('#edR').value;
        E.replaceRange ? E.replaceRange(r, h.from, h.to) : null;
        doSearch(S.idx);
      }
      if(a==='repAll'){
        const re=buildRe(); if(re==='BAD'){ Toast.err('无效正则'); return; }
        if(!re || !$w('#edQ').value){ Toast.info('请输入查找内容'); return; }
        const v=E.getValue(); const r=$w('#edR').value;
        let n=0; const out=v.replace(re, ()=>{n++; return r;});
        E.setValue(out); clearMarks(); $w('#edCnt').textContent='0/0';
        Toast.ok('已替换 '+n+' 处'); schedulePreview();
      }
      if(a==='fclose'){ $w('#edFind').classList.remove('on'); clearMarks(); }
      if(a==='open'){ const p=await UI.prompt('打开文件','完整路径', S.path||'/Documents/示例.html'); if(p) loadFile(P.norm(p)); }
      if(a==='import') $w('#edFile').click();
      if(a==='export'){ download(P.base(S.path||('未命名'+extForMode(S.mode))), new Blob([E.getValue()],{type:mimeOf(S.path||'x.html')})); }
      if(a==='save') save(false);
      if(a==='saveas') save(true);
      if(a==='clear'){ if(await UI.confirm('清空内容','确定要清空编辑器中的全部内容吗？')){ E.setValue(''); schedulePreview(); } }
      if(a==='newwin'){ const u=URL.createObjectURL(new Blob([E.getValue()],{type:'text/html'})); window.open(u,'_blank'); }
      if(a==='browse'){ Apps.open('browser',{path:S.path, html:E.getValue()}); }
    });
    $w('#edMode').onchange = e=>{ S.mode=e.target.value; applyMode(); };
    $w('#edQ').oninput = debounce(()=>doSearch(), 180);
    $w('#edR').oninput = ()=>{};
    $w('#edQ').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); e.shiftKey?prevHit():nextHit(); } };
    $w('#edR').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); nextHit(); } };
    $$('.tog', win.el).forEach(t=>t.onclick=()=>{
      const k=t.dataset.t; F[k]=!F[k]; t.classList.toggle('on', F[k]); doSearch();
    });
    $w('#edFile').onchange = async e=>{
      const f=e.target.files[0]; e.target.value=''; if(!f) return;
      const txt=await f.text(); S.path='/Desktop/'+f.name; E.setValue(txt);
      S.mode=modeForExt(f.name); $w('#edMode').value=S.mode; applyMode();
      win.setTitle(f.name+' — HTML编辑器'); stat(); runPreview();
      Toast.ok('已导入 '+f.name);
    };
    win.el.addEventListener('keydown', e=>{
      if(e.key==='F3'){ e.preventDefault(); nextHit(); }
      if(e.key==='Escape'){ $w('#edFind').classList.remove('on'); }
      if(e.ctrlKey && e.key.toLowerCase()==='s'){ e.preventDefault(); save(false); }
      if(e.ctrlKey && e.key==='Enter'){ e.preventDefault(); runPreview(); }
      if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='f'){ e.preventDefault(); fmt(); }
      if(e.ctrlKey && e.key.toLowerCase()==='f'){ e.preventDefault(); window.__edFind(); }
      if(e.ctrlKey && e.key.toLowerCase()==='h'){ e.preventDefault(); window.__edRep(); }
      if(e.ctrlKey && e.key.toLowerCase()==='y'){ e.preventDefault(); E.execCommand('redo'); }
    });
    win.onClose = ()=>{ try{ E.toTextArea(); }catch(e){} window.__edSave=null; window.__edRun=null;
      window.__edFmt=null; window.__edFind=null; window.__edRep=null; window.__edNext=null; window.__edPrev=null; window.__edEsc=null; };
    if(!Cfg.d.previewOn) win.el.querySelector('.edright').style.display='none';
    if(args.html!=null){ E.setValue(args.html); }
    if(args.path) loadFile(args.path);
    else if(args.html==null){
      E.setValue('<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<title>新文档</title>\n<style>\n  body{\n    margin:0;\n    min-height:100vh;\n    display:grid;\n    place-items:center;\n    background:#0d1117;\n    color:#e7ecf1;\n    font-family:system-ui,sans-serif;\n  }\n</style>\n</head>\n<body>\n  <h1>Hello, ORBIT</h1>\n</body>\n</html>\n');
    }
    stat(); setTimeout(runPreview, 300);
  }
});
</script>
<script>
/* ================================================================
   图片查看器 / 媒体播放器 / PDF / 漫画阅读器
   ================================================================ */
Apps.register({
  id:'image', name:'图片查看器', icon:'image', w:820, h:600, tags:'图片 照片 预览',
  init(win, args){
    const S={path:args.path, zoom:1, url:null};
    win.el.querySelector('.win-body').innerHTML =
      '<div class="bar">'+
        '<button class="btn sm icon" data-a="prev">'+I('back',13)+'</button>'+
        '<button class="btn sm icon" data-a="next">'+I('fwd',13)+'</button>'+
        '<span style="width:1px;height:18px;background:var(--line)"></span>'+
        '<button class="btn sm" data-a="zo">'+I('zoomOut',12)+' 缩小</button>'+
        '<button class="btn sm" data-a="zi">'+I('zoomIn',12)+' 放大</button>'+
        '<button class="btn sm" data-a="fit">适应</button>'+
        '<button class="btn sm" data-a="full">'+I('fullscreen',12)+' 全屏</button>'+
        '<span class="spacer"></span>'+
        '<button class="btn sm" data-a="manga">'+I('manga',12)+' 条漫模式</button>'+
        '<button class="btn sm" data-a="wall">设为壁纸</button>'+
        '<button class="btn sm" data-a="dl">'+I('download',12)+' 导出</button>'+
      '</div><div class="imgview" id="ivBox"><img id="ivImg" alt=""></div>'+
      '<div class="statusbar" id="ivStat"></div>';
    const $w=s=>win.el.querySelector(s);
    async function load(path){
      try{
        const b=await FS.readFile(path); if(S.url) Blobs.drop('img:'+S.path);
        S.path=path; S.url=Blobs.make('img:'+path, b);
        $w('#ivImg').src=S.url; S.zoom=1; $w('#ivImg').style.transform='scale(1)';
        win.setTitle(P.base(path)+' — 图片查看器');
        $w('#ivStat').innerHTML='<span>'+esc(path)+'</span><span class="spacer" style="flex:1"></span><span id="ivInfo">读取中…</span>';
        $w('#ivImg').onload=()=>{ const i=$w('#ivImg');
          $w('#ivStat').innerHTML='<span>'+esc(path)+'</span><span class="spacer" style="flex:1"></span>'+
            '<span>'+i.naturalWidth+' × '+i.naturalHeight+'</span><span id="ivInfo">'+fmtSize(b.size)+'</span>'; };
      }catch(e){ Toast.err(e.message); }
    }
    const setZ=z=>{ S.zoom=clamp(z,.08,12); $w('#ivImg').style.transform='scale('+S.zoom+')';
      $w('#ivStat').querySelector('#ivInfo').textContent=Math.round(S.zoom*100)+'%'; };
    win.el.querySelector('.imgview').addEventListener('wheel', e=>{ if(e.ctrlKey){ e.preventDefault(); setZ(S.zoom*(e.deltaY<0?1.12:.9)); } }, {passive:false});
    let pan=null;
    win.el.querySelector('.imgview').addEventListener('pointerdown', e=>{ if(e.button!==0) return;
      pan={x:e.clientX,y:e.clientY,l:win.el.querySelector('.imgview').scrollLeft,t:win.el.querySelector('.imgview').scrollTop};
      win.el.querySelector('.imgview').setPointerCapture(e.pointerId); });
    win.el.querySelector('.imgview').addEventListener('pointermove', e=>{ if(!pan) return;
      const b=win.el.querySelector('.imgview'); b.scrollLeft=pan.l-(e.clientX-pan.x); b.scrollTop=pan.t-(e.clientY-pan.y); });
    win.el.querySelector('.imgview').addEventListener('pointerup', ()=>pan=null);
    async function sibling(step){
      const dir=P.dir(S.path); const list=(await FS.readdir(dir)).filter(x=>kindOf(x.name)==='image').sort((a,b)=>natCmp(a.name,b.name));
      const i=list.findIndex(x=>x.path===S.path);
      if(i<0) return; const n=list[(i+step+list.length)%list.length]; load(n.path);
    }
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
      if(a==='prev') sibling(-1); if(a==='next') sibling(1);
      if(a==='zi') setZ(S.zoom*1.25); if(a==='zo') setZ(S.zoom/1.25);
      if(a==='fit'){ S.zoom=1; $w('#ivImg').style.transform='scale(1)'; }
      if(a==='full') toggleFullscreen(win.el);
      if(a==='manga') Apps.open('manga',{path:S.path});
      if(a==='wall') setWallpaperFromPath(S.path);
      if(a==='dl'){ const b2=await FS.readFile(S.path); download(P.base(S.path), b2); }
    });
    win.onClose=()=>Blobs.drop('img:'+S.path);
    if(args.path) load(args.path);
  }
});
Apps.register({
  id:'media', name:'媒体播放器', icon:'media', w:760, h:520, tags:'音频 视频 播放 音乐',
  init(win, args){
    const S={path:args.path||null, list:[]};
    win.el.querySelector('.win-body').innerHTML =
      '<div class="bar">'+
        '<button class="btn sm icon" data-a="prev">'+I('back',13)+'</button>'+
        '<button class="btn sm" data-a="play">'+I('play',12)+' 播放</button>'+
        '<button class="btn sm icon" data-a="next">'+I('fwd',13)+'</button>'+
        '<span class="spacer"></span>'+
        '<button class="btn sm" data-a="loop">循环</button>'+
        '<button class="btn sm" data-a="dl">'+I('download',12)+' 导出</button>'+
      '</div>'+
      '<div class="med" id="mdBox"></div>'+
      '<div class="statusbar" id="mdStat"></div>';
    const $w=s=>win.el.querySelector(s);
    async function load(path){
      try{
        const b=await FS.readFile(path);
        Blobs.drop('md:'+S.path);
        S.path=path; const url=Blobs.make('md:'+path, b);
        const k=kindOf(path);
        const box=$w('#mdBox'); box.innerHTML='';
        if(k==='video'){
          const v=el('video',{controls:'',playsinline:'',src:url}); v.style.cssText='width:100%;max-width:820px;background:#000;max-height:62vh';
          v.onerror=()=>Toast.err('视频无法解码（浏览器不支持该编码）');
          box.appendChild(v); v.play().catch(()=>{});
        } else {
          const a=el('audio',{controls:'',src:url}); a.style.cssText='width:100%';
          box.insertBefore(el('div',{class:'ico',style:'width:74px;height:74px;color:var(--acc)'},I('audio',74)), a);
          box.appendChild(a);
        }
        const dir=P.dir(path);
        S.list=(await FS.readdir(dir)).filter(x=>['audio','video'].includes(kindOf(x.name))).sort((a,b)=>natCmp(a.name,b.name));
        win.setTitle(P.base(path)+' — 媒体播放器');
        $w('#mdStat').innerHTML='<span>'+esc(path)+'</span><span class="spacer" style="flex:1"></span>'+
          '<span>'+fmtSize(b.size)+'</span><span>同目录媒体 '+S.list.length+' 个</span>'+
          '<span>'+(S.list.findIndex(x=>x.path===path)+1)+' / '+S.list.length+'</span>';
      }catch(e){ Toast.err(e.message); }
    }
    const step=(d)=>{ if(!S.list.length) return;
      const i=S.list.findIndex(x=>x.path===S.path); const n=S.list[(i+d+S.list.length)%S.list.length]; load(n.path); };
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
      if(a==='prev') step(-1); if(a==='next') step(1);
      if(a==='play'){ const m=$w('#mdBox video,#mdBox audio'); if(m){ m.paused?m.play():m.pause(); } }
      if(a==='loop'){ const m=$w('#mdBox video,#mdBox audio'); if(m){ m.loop=!m.loop; Toast.info('循环播放：'+(m.loop?'开':'关')); } }
      if(a==='dl'){ const b2=await FS.readFile(S.path); download(P.base(S.path), b2); }
    });
    if(args.path) load(args.path);
    else { $w('#mdBox').innerHTML='<div style="text-align:center;color:var(--ink3)"><div style="width:64px;height:64px;margin:0 auto 12px;color:var(--acc)">'+I('media',64)+'</div>请从文件管理器打开音频或视频文件</div>'; }
  }
});
Apps.register({
  id:'pdf', name:'PDF 查看器', icon:'pdf', w:900, h:640, tags:'pdf 文档',
  init(win, args){
    win.el.querySelector('.win-body').innerHTML =
      '<div class="bar"><span class="hint" id="pdfName">—</span><span class="spacer"></span>'+

        win.setTitle(P.base(path)+' — PDF 查看器');

/* ---------------- 漫画阅读器 ---------------- */
Apps.register({
  id:'manga', name:'漫画阅读器', icon:'manga', w:820, h:700, tags:'漫画 条漫 图片 阅读',
  init(win, args){
    const S={path:args.path, imgs:[], immersive:false};
    win.el.querySelector('.win-body').innerHTML =
      '<div class="bar" id="mgBar">'+
        '<button class="btn sm" data-a="top">'+I('up',12)+' 回到顶部</button>'+
        '<button class="btn sm" data-a="width">'+I('split',12)+' 宽度</button>'+
        '<span class="spacer"></span>'+
        '<span class="hint" id="mgInfo">准备读取…</span>'+
        '<button class="btn sm" data-a="file">'+I('folderOpen',12)+' 打开其他</button>'+
        '<button class="btn sm acc" data-a="fs">'+I('fullscreen',12)+' 沉浸全屏</button>'+
      '</div>'+
      '<div class="manga" id="mgScroll"></div>'+
      '<div class="statusbar" id="mgStat"><span id="mgCount">0 页</span><span class="spacer" style="flex:1"></span><span>滚轮 / 触控连续浏览</span></div>';
    const $w=s=>win.el.querySelector(s);
    const widths=['1000px','760px','100%','1200px']; let wi=0;
    async function load(path){
      const startDir = P.norm(String(path).slice(0, String(path).lastIndexOf('/')) || '/');
      const scroll=$w('#mgScroll'); scroll.innerHTML=''; S.imgs=[];
      let files=[];
      try{ files=(await FS.readdir(startDir)).filter(x=>x.type==='file' && kindOf(x.name)==='image'); }
      catch(e){ Toast.err('目录读取失败：'+e.message); return; }
      if(!files.length){ scroll.appendChild(el('div',{class:'empty',style:'color:#7d8894'},'该目录没有图片')); return; }
      files.sort((a,b)=>natCmp(a.name,b.name));
      $w('#mgInfo').textContent='并行读取 '+files.length+' 张图片…';
      const busy=UI.busy('加载 '+files.length+' 页…'); scroll.appendChild(busy);
      const holders = files.map(f=>{
        const d=el('div',{style:'width:100%;display:flex;justify-content:center;background:#0a0a0a;min-height:60px'});
        d.appendChild(el('div',{class:'hint',style:'padding:18px;color:#3d4652;font-family:var(--mono);font-size:11px'},esc(f.name)));
        scroll.appendChild(d); return d;
      });
      const blobs = await Promise.all(files.map(f=>FS.readFile(f.path).then(b=>({f,b})).catch(e=>({f:f,err:e}))));
      blobs.forEach((rec,i)=>{
        const h=holders[i];
        if(rec.err || !rec.b){ h.innerHTML='<div style="padding:16px;color:#5c3b3b;font-family:var(--mono);font-size:11px">读取失败 · '+esc(rec.f.name)+'</div>'; return; }
        const url=Blobs.make('manga:'+rec.f.path, rec.b);
        const img=el('img',{src:url,alt:rec.f.name,loading:'lazy',draggable:'false'});
        img.style.cssText='width:100%;max-width:'+widths[wi]+';display:block;pointer-events:none';
        h.innerHTML=''; h.appendChild(img);
        S.imgs.push({el:img, name:rec.f.name});
      });
      busy.remove();
      $w('#mgInfo').textContent='共 '+S.imgs.length+' 页 · '+startDir;
      $w('#mgCount').textContent=S.imgs.length+' 页';
      win.setTitle(P.base(startDir)+' — 漫画阅读器');
      const target = S.imgs.find(x=>x.name===P.base(path));
      if(target) setTimeout(()=>target.el.scrollIntoView({block:'start'}), 120);
      const onScroll=()=>{ const st=scroll.scrollTop+scroll.clientHeight/3;
        let idx=0; S.imgs.forEach((im,i)=>{ if(im.el.offsetTop<=st) idx=i; });
        $w('#mgCount').textContent=(idx+1)+' / '+S.imgs.length+' 页'; };
      scroll.onscroll = onScroll;
    }
    function immersive(on){
      S.immersive=on;
      win.el.classList.toggle('fullscreen', on);
      win.el.style.zIndex = on ? '9500' : '';
      if(on){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }
      else { if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
    }
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
      if(a==='top') $w('#mgScroll').scrollTo({top:0,behavior:'smooth'});
      if(a==='width'){ wi=(wi+1)%widths.length; $$('#mgScroll img', win.el).forEach(i=>i.style.maxWidth=widths[wi]); Toast.info('页面宽度：'+widths[wi]); }
      if(a==='fs') immersive(!S.immersive);
      if(a==='file'){ const p=await UI.prompt('打开图片','图片完整路径（将读取其所在目录全部图片）', S.path||'/Pictures/001.jpg'); if(p) load(P.norm(p)); }
    });
    win.el.addEventListener('keydown', e=>{
      if(e.key===' '||e.key==='PageDown'){ e.preventDefault(); $w('#mgScroll').scrollBy({top:$w('#mgScroll').clientHeight*.9,behavior:'smooth'}); }
      if(e.key==='PageUp'){ e.preventDefault(); $w('#mgScroll').scrollBy({top:-$w('#mgScroll').clientHeight*.9,behavior:'smooth'}); }
      if(e.key==='Home') $w('#mgScroll').scrollTo({top:0});
    });
    win.el.tabIndex=0;
    const off=Bus.on('fs:fullscreen', on=>{ if(!on && S.immersive) immersive(false); });
    $('#fsExit').onclick=()=>{ if(S.immersive) immersive(false); else toggleFullscreen(); };
    win.onClose=()=>{ off(); if(S.immersive) immersive(false); };
    load(args.path);
  }
});
</script>
<script>
/* ================================================================
   计算器 / 画板 / 浏览器 / 终端 / 压缩引擎 / 设置 / 关于
   ================================================================ */
Apps.register({
  id:'calc', name:'计算器', icon:'calc', w:320, h:460, tags:'计算 数学',
  init(win){
    const S={ex:'', val:'0', hist:[]};
    win.el.querySelector('.win-body').innerHTML =
      '<div class="calc"><div class="disp"><div class="ex" id="cEx"></div><div class="val" id="cVal">0</div></div>'+
      '<div class="keys" id="cKeys"></div></div>';
    const keys=[['C','warn'],['(',''],[')',''],['⌫','op'],['%','op'],
      ['7',''],['8',''],['9',''],['÷','op'],['√','op'],
      ['4',''],['5',''],['6',''],['×','op'],['x²','op'],
      ['1',''],['2',''],['3',''],['−','op'],['1/x','op'],
      ['0',''],['.',''],['±',''],['+','op'],['=','eq']];
    const box=win.el.querySelector('#cKeys');
    keys.forEach(([k,c])=>box.appendChild(el('button',{class:c||'','data-k':k}, k)));
    const $w=s=>win.el.querySelector(s);
    function calc(){
      let e=S.ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI');
      if(!/^[-+*/(). 0-9%MathPIsqrt]+$/.test(e)) return '错误';
      try{ const v=Function('"use strict";return ('+e+')')(); return (v===undefined||v===null||isNaN(v))?'错误':String(Math.round(v*1e10)/1e10); }
      catch(x){ return '错误'; }
    }
    const show=()=>{ $w('#cEx').textContent=S.ex; $w('#cVal').textContent=S.val; };
    function press(k){
      if(k==='C'){ S.ex=''; S.val='0'; }
      else if(k==='⌫'){ S.ex=S.ex.slice(0,-1); S.val=S.ex||'0'; }
      else if(k==='='){ const r=calc(); if(r!=='错误'&&S.ex){ S.hist.push(S.ex+' = '+r); } S.val=r; S.ex=r==='错误'?'':r; }
      else if(k==='√'){ S.val=String(Math.sqrt(parseFloat(S.val)||0)); }
      else if(k==='x²'){ S.val=String(Math.pow(parseFloat(S.val)||0,2)); }
      else if(k==='1/x'){ const v=parseFloat(S.val); S.val=v?String(Math.round((1/v)*1e10)/1e10):'错误'; }
      else if(k==='±'){ S.val = S.val.startsWith('-')?S.val.slice(1):'-'+S.val; }
      else { S.ex += k; S.val = S.ex; }
      show();
    }
    box.onclick=e=>{ const b=e.target.closest('[data-k]'); if(b) press(b.dataset.k); };
    win.el.tabIndex=0;
    win.el.addEventListener('keydown', e=>{
      const map={'Enter':'=','Backspace':'⌫','Escape':'C','*':'×','/':'÷','-':'−'};
      const k=map[e.key]||e.key;

  }

/* ================================================================
   压缩引擎：ZIP(JSZip) / GZ / TAR / TAR.GZ / TGZ / 7Z / RAR
   ================================================================ */
async function gunzipBuf(buf){
  if(!window.DecompressionStream) throw new FSError('浏览器不支持 DecompressionStream，无法解压 gzip');
  const ds=new DecompressionStream('gzip');
  const r = await new Response(new Blob([buf]).stream().pipeThrough(ds));
  return await r.arrayBuffer();
}
function parseTar(u8){
  const dec=new TextDecoder(); const out=[]; let off=0;
  while(off+512<=u8.length){
    const h=u8.subarray(off,off+512);
    let zero=true; for(let i=0;i<512;i++){ if(h[i]!==0){ zero=false; break; } }
    if(zero) break;
    const name=dec.decode(h.subarray(0,100)).replace(/\0+$/,'');
    const sizeStr=dec.decode(h.subarray(124,136)).replace(/[\0\s]/g,'');
    const size=parseInt(sizeStr,8)||0;
    const type=String.fromCharCode(h[156]||48);
    const prefix=dec.decode(h.subarray(345,500)).replace(/\0+$/,'');
    const full=(prefix?prefix+'/':'')+name;
    if(full) out.push({name:full, type:type==='5'?'dir':'file', size, start:off+512});
    off = off+512 + Math.ceil(size/512)*512;
  }
  return out;
}
async function ensureJSZip(){
  if(window.JSZip) return window.JSZip;
  try{ await new Promise((res,rej)=>{ const s=el('script',{src:'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'}); s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    if(window.JSZip) return window.JSZip; }catch(e){}
  throw new FSError('JSZip 未加载（网络不可用），无法处理 ZIP');
}
let __7zMod=null;
async function get7z(){
  if(__7zMod) return __7zMod;
  let factory = window.__SevenZipModule;
  if(!factory){ factory = (await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js')).default; window.__SevenZipModule=factory; }
  const wasmBinary = await (await fetch('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.wasm')).arrayBuffer();
  const logs=[];
  __7zMod = await factory({ wasmBinary, print:t=>logs.push(t), printErr:t=>logs.push(t), noInitialRun:true });
  __7zMod.__logs = logs;
  return __7zMod;
}
async function extract7z(buf, fileName, destDir, listOnly){
  const sz=await get7z();
  const FS7=sz.FS;
  const inName='__arch.'+extOf(fileName);
  try{ FS7.unlink('/'+inName); }catch(e){}
  try{ FS7.mkdir('/out'); }catch(e){}
  FS7.writeFile('/'+inName, new Uint8Array(buf));
  const rc = sz.callMain(['x', '/'+inName, '-o/out', '-y']);
  if(rc!==0 && rc!==undefined) throw new FSError('7z 退出码 '+rc+'：'+(sz.__logs.slice(-6).join(' ')||'解压失败'));
  const walk=(dir, base)=>{
    let n=0;
    FS7.readdir(dir).filter(x=>x!=='.'&&x!=='..').forEach(x=>{
      const p=dir+'/'+x, st=FS7.stat(p);
      const rel = base? base+'/'+x : x;
      if(FS7.isDir(st.mode)){ if(!listOnly) FS.mkdir(P.join(destDir, rel)).catch(()=>{}); n+=walk(p, rel); }
      else{ if(!listOnly){ const d=FS7.readFile(p);
        FS.writeFile(P.join(destDir, rel), new Blob([d])).catch(()=>{}); }
        n++; }
    });
    return n;
  };
  const n = walk('/out','');
  try{ FS7.unlink('/'+inName); }catch(e){}
  return n;
}
async function extractArchive(path, destDir, listOnly){
  const name=P.base(path), e=extOf(name);
  destDir = P.norm(destDir||P.dir(path));
  const buf = await FS.readBuf(path);
  let count=0;
  if(e==='zip'){
    const JSZipLib=await ensureJSZip();
    const zip=await JSZipLib.loadAsync(buf);
    const names=Object.keys(zip.files);
    if(listOnly){
      UI.modal({title:'压缩包内容 — '+name, body:'<div class="mono" style="font-size:11px;line-height:1.9;max-height:50vh;overflow:auto">'+
        names.map(n=>'<div>'+esc(n)+(zip.files[n].dir?'<span class="hint"> /</span>':'')+'</div>').join('')+'</div>'});
      return names.length;
    }
    for(const n of names){
      const f=zip.files[n];
      const target=P.join(destDir, n.replace(/\/+$/,''));
      if(f.dir){ await FS.ensureDir(target); continue; }
      try{ const b=await f.async('blob'); await FS.writeFile(target, b); count++; }
      catch(err){ console.warn('跳过 '+n, err); }
    }
  } else if(e==='gz' || e==='tgz' || e==='tar'){
    let u8;
    if(e==='tar'){ u8=new Uint8Array(buf); }
    else {
      const raw = await gunzipBuf(buf);
      if(e==='gz'){
        const inner = name.replace(/\.tgz$/i,'.tar').replace(/\.gz$/i,'');
        if(/\.tar$/i.test(inner)){ u8=new Uint8Array(raw); }
        else { if(!listOnly) await FS.writeFile(P.join(destDir, inner), new Blob([raw])); return 1; }
      } else u8=new Uint8Array(raw);
    }
    const entries=parseTar(u8);
    if(listOnly){
      UI.modal({title:'归档内容 — '+name, body:'<div class="mono" style="font-size:11px;line-height:1.9;max-height:50vh;overflow:auto">'+
        entries.map(x=>'<div>'+esc(x.name)+(x.type==='dir'?'<span class="hint"> /</span>':'<span class="hint"> · '+fmtSize(x.size)+'</span>')+'</div>').join('')+'</div>'});
      return entries.length;
    }
    for(const en of entries){
      if(!en.name || en.name.startsWith('.')) continue;
      const target=P.join(destDir, en.name.replace(/\/+$/,''));
      if(en.type==='dir'){ await FS.ensureDir(target); continue; }
      try{ const d=u8.subarray(en.start, en.start+en.size);
        await FS.writeFile(target, new Blob([d])); count++; }catch(err){}
    }
  } else if(['7z','rar','bz2','xz'].includes(e)){
    count = await extract7z(buf, name, destDir, listOnly);
  } else throw new FSError('不支持的压缩格式：.'+e);
  if(!listOnly){ Toast.ok('已解压 '+count+' 项到 '+destDir); Bus.emit('fs:change',{type:'extract'}); }
  return count;
}
async function zipPaths(paths, destZip){
  const JSZipLib=await ensureJSZip();
  const zip=new JSZipLib();
  const add=async(p, base)=>{
    const st=await FS.stat(p);
    if(st.type==='file'){ const b=await FS.readFile(p); zip.file((base||'')+P.base(p), b); return; }
    const kids=await FS.readdir(p);
    const folder=(base||'')+P.base(p)+'/';
    zip.folder(folder);
    for(const k of kids) await add(k.path, folder);
  };
  for(const p of paths) await add(P.norm(p), '');
  const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
  destZip=P.norm(destZip);
  await FS.writeFile(destZip, blob);
  Toast.ok('已压缩到 '+destZip);
  Bus.emit('fs:change',{type:'zip'});
  return destZip;
}

          row('net','网络','完全离线可用，CDN 仅用于可选增强库','<span class="hint mono">'+(navigator.onLine?'在线':'离线')+'</span>')+
          row('drive','硬件','<span class="mono">'+(navigator.hardwareConcurrency||'?')+' 线程 · '+fmtSize((navigator.deviceMemory||0)*1073741824||0)+'</span>','')+
          '<div class="sect">开源组件</div>'+
          '<div style="font-size:12px;line-height:2;color:var(--ink2)">CodeMirror 5.65 · js-beautify · JSZip · 7z-wasm · v86<br>以上均通过 CDN 加载，离线时自动降级。</div>';
      }
    }
    win.el.addEventListener('click', async ev=>{
      const swt=ev.target.closest('[data-sw]');
      if(swt){ Cfg.set(swt.dataset.sw, !Cfg.d[swt.dataset.sw]); render(); return; }
      const setb=ev.target.closest('[data-set]');
      if(setb){ const [k,v]=setb.dataset.set.split(':');
        Cfg.d[k]=v; if(setb.dataset.clear) Cfg.d.wallFile=''; Cfg.save(); Cfg.apply();
        if(k==='grid'||k==='iconSize') Desktop.refresh(); render(); return; }
      const acc=ev.target.closest('[data-acc]');
      if(acc){ Cfg.set('accent', acc.dataset.acc); render(); return; }
      const un=ev.target.closest('[data-un]');
      if(un){ await FS.unmount(un.dataset.un); Toast.ok('已卸载'); render(); return; }
      const b=ev.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
      if(a==='wallfile') $('#wallPick').click();
      if(a==='wallclear'){ Cfg.set('wallFile',''); Cfg.set('wallName',''); Cfg.set('wallpaper','wp-1'); render(); }
      if(a==='persist'){ const p=await (navigator.storage&&navigator.storage.persist?navigator.storage.persist():false);
        Toast[p?'ok':'warn'](p?'已获得持久化授权':'浏览器拒绝了申请（通常需要稳定使用）'); render(); }
      if(a==='blobs'){ Blobs.clear(); Toast.ok('已清理临时对象 URL'); }
      if(a==='reset'){
        const ok=await UI.confirm('重置系统','<b style="color:var(--bad)">此操作不可撤销。</b><br>将删除 OPFS 中的全部文件、清除挂载记录，并重建默认目录结构。');
        if(!ok) return;
        const bz=UI.busy('正在重置文件系统…'); win.body.appendChild(bz);
        await FS.reset(); await FS.seed(); Cfg.d.wallFile=''; Cfg.d.wallName=''; Cfg.save(); Cfg.apply();
        Blobs.clear(); bz.remove(); Toast.ok('系统已重置'); Desktop.refresh(); render();
      }
      if(a==='mountnew'){ try{ const p=await FS.pickLocal(); Toast.ok('已挂载 '+p); }catch(e){ Toast.err(e.message); } render(); }
      if(a==='clearcfg'){ localStorage.removeItem('orbit.cfg'); localStorage.removeItem('orbit.iconpos');
        Toast.ok('已清除偏好，刷新页面生效'); }
      if(a==='exportcfg') download('orbit-settings.json', new Blob([JSON.stringify(Cfg.d,null,2)],{type:'application/json'}));
    });
    win.el.addEventListener('input', ev=>{
      const r=ev.target.closest('[data-rng]');
      if(r){ const k=r.dataset.rng; let v=parseFloat(r.value);
        Cfg.d[k] = (k==='scale')? v : Math.round(v);
        if(k==='scale') document.documentElement.style.setProperty('--scale', v);
        else if(k==='grid'){ document.documentElement.style.setProperty('--grid', v+'px'); }
        Cfg.save();
        const lb=r.parentElement.querySelector('.hint'); if(lb) lb.textContent = (k==='scale'? v+'×' : Math.round(v)+(k==='notepadFont'?'px':'px'));
      }
      const s=ev.target.closest('[data-sel]');
      if(s){ Cfg.set(s.dataset.sel, s.value); }
    });
    render();
  }
});
Apps.register({
  id:'about', name:'关于', icon:'info', w:520, h:440, tags:'关于 信息',
  init(win){
    win.el.querySelector('.win-body').innerHTML =
      '<div style="padding:26px 28px;overflow:auto">'+
        '<div style="display:flex;gap:20px;align-items:center;margin-bottom:20px">'+
          '<div style="width:80px;height:80px;color:var(--acc);flex:0 0 80px">'+ORB+'</div>'+
          '<div><div style="font-family:var(--serif);font-size:34px;line-height:1.05">ORBIT OS</div>'+
          '<div class="hint" style="margin-top:6px;letter-spacing:.18em;text-transform:uppercase">Browser Desktop · Single File</div></div></div>'+
        '<div class="setrow"><span class="si">'+I('drive',16)+'</span><div class="st"><b>存储</b><small id="abFs">检测中…</small></div></div>'+
        '<div class="setrow"><span class="si">'+I('folder',16)+'</span><div class="st"><b>文件系统</b><small>OPFS 虚拟磁盘 + IndexedDB 降级 + 本地目录挂载</small></div></div>'+
        '<div class="setrow"><span class="si">'+I('grid',16)+'</span><div class="st"><b>应用</b><small>'+Apps.list.filter(a=>!a.hidden).length+' 个内置应用</small></div></div>'+
        '<div class="setrow"><span class="si">'+I('clock',16)+'</span><div class="st"><b>会话</b><small>开始于 '+new Date(BOOT_TIME).toLocaleString('zh-CN')+'</small></div></div>'+
        '<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn sm" id="abFiles">打开文件管理器</button>'+
          '<button class="btn sm" id="abSet">系统设置</button>'+
          '<button class="btn sm" id="abVm">启动虚拟机</button></div>'+
      '</div>';
    (async()=>{ const q=await (navigator.storage&&navigator.storage.estimate?navigator.storage.estimate():{});
      win.el.querySelector('#abFs').textContent = FS.type+' · 已用 '+fmtSize(q.usage||0)+' / '+fmtSize(q.quota||0); })();
    win.el.querySelector('#abFiles').onclick=()=>Apps.open('files',{path:'/'});
    win.el.querySelector('#abSet').onclick=()=>Apps.open('settings');
    win.el.querySelector('#abVm').onclick=()=>Apps.open('vm');
  }
});
</script>
<script>
/* ================================================================
   v86 虚拟机（版本锁定 0.5.319） + 启动流程
   ================================================================ */
const V86_URLS = {
  wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
  bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
  vgabios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
};
function v86Slot(name){
  const e=extOf(name);
  if(e==='iso'||e==='cue'||e==='bin') return 'cdrom';
  if(['img','fda','bin','ima','vfd','dsk'].includes(e)) return 'fda';
  if(['hdd','qcow','qcow2','raw','vhd'].includes(e)) return 'hda';
  return 'hda';
}
Apps.register({
  id:'vm', name:'虚拟机 v86', icon:'vm', w:940, h:660, tags:'虚拟机 v86 linux dos',
  init(win){
    const S={emu:null, running:false, file:null, lock:false, slot:'hda'};
    win.el.querySelector('.win-body').innerHTML =
      '<div class="bar">'+
        '<button class="btn sm acc" data-a="start">'+I('play',12)+' 启动</button>'+
        '<button class="btn sm" data-a="pause">'+I('pause',12)+' 暂停/继续</button>'+
        '<button class="btn sm" data-a="reset">'+I('refresh',12)+' 重置</button>'+
        '<span style="width:1px;height:18px;background:var(--line)"></span>'+
        '<button class="btn sm" data-a="image">'+I('upload',12)+' 加载镜像</button>'+
        '<button class="btn sm" data-a="vfsimg">'+I('folderOpen',12)+' 从文件系统加载</button>'+
        '<span style="width:1px;height:18px;background:var(--line)"></span>'+
        '<button class="btn sm" data-a="lock">'+I('lock',12)+' 锁定鼠标</button>'+
        '<button class="btn sm" data-a="full">'+I('fullscreen',12)+' 全屏</button>'+
        '<button class="btn sm" data-a="shot">截图</button>'+
        '<span class="spacer"></span><span class="hint" id="vmSt">未运行</span>'+
      '</div>'+
      '<div class="vm" id="vmBox"><div class="sc" id="vmScreen"></div>'+
        '<div class="vmbar" id="vmBar"><span class="hint" id="vmInfo">v86 · x86 模拟器</span></div></div>'+
      '<input type="file" id="vmFile" style="display:none">';
    const $w=s=>win.el.querySelector(s);
    const sc=$w('#vmScreen');
    /* v86 强制要求的结构：white-space:pre 的 monospace div + canvas，顺序不可变 */
    sc.innerHTML='<div style="white-space:pre;font:14px monospace;line-height:14px;display:block;position:absolute;left:0;top:0;padding:4px;color:#cfd8e3;z-index:2"></div>'+
      '<canvas style="display:none;position:absolute;left:0;top:0"></canvas>';
    function info(t){ $w('#vmInfo').textContent=t; }
    function stat(t){ $w('#vmSt').textContent=t; $w('#vmSt').style.color = t==='运行中'?'var(--acc2)':'var(--ink3)'; }
    async function ensureV86(){
      if(window.V86) return true;
      try{
        await new Promise((res,rej)=>{ const s=el('script',{src:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js'});
          s.onload=res; s.onerror=rej; document.head.appendChild(s); });
        return !!window.V86;
      }catch(e){ return false; }
    }
    async function start(){
      if(S.emu){ Toast.warn('虚拟机已在运行，请先重置'); return; }
      if(!await ensureV86()){ Toast.err('libv86.js 加载失败（网络不可用）'); stat('内核加载失败'); return; }
      const opts = {
        wasm_path: V86_URLS.wasm,
        memory_size: 128*1024*1024,
        vga_memory_size: 16*1024*1024,
        screen_container: sc,
        bios:{url:V86_URLS.bios},
        vga_bios:{url:V86_URLS.vgabios},
        autostart:true,
        disable_speaker:false
      };
      if(S.file){
        const slot=v86Slot(S.file.name);
        S.slot=slot;
        opts[slot] = {buffer: S.file, async: true};
        info('已挂载 '+slot+' ← '+S.file.name);
      } else {
        info('无磁盘镜像：仅启动 BIOS（可用『加载镜像』挂载 iso/img）');
      }
      try{
        S.emu = new V86(opts);
        S.running=true; stat('运行中');
        S.emu.add_listener && S.emu.add_listener('emulator-ready', ()=>info('模拟器就绪 · '+S.slot));
        S.emu.add_listener && S.emu.add_listener('emulator-stopped', ()=>{ S.running=false; stat('已停止'); });
      }catch(e){ Toast.err('虚拟机启动失败：'+e.message); stat('错误'); }
    }
    function stop(){ if(S.emu){ try{ S.emu.destroy(); }catch(e){} S.emu=null; S.running=false; stat('未运行'); } }
    win.el.addEventListener('click', async ev=>{
      const b=ev.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
      if(a==='start') start();
      if(a==='pause'){ if(!S.emu) return Toast.info('请先启动'); try{ S.running?(S.emu.stop(),stat('已暂停')):(S.emu.run(),stat('运行中')); S.running=!S.running; }catch(e){} }
      if(a==='reset'){ stop(); setTimeout(start, 300); }
      if(a==='image') $w('#vmFile').click();
      if(a==='vfsimg'){
        const p=await UI.prompt('从虚拟文件系统加载镜像','镜像文件完整路径（.iso / .img / .bin 等）','');
        if(!p) return;
        try{ const blob=await FS.readFile(P.norm(p)); S.file=new File([blob], P.base(p), {type:blob.type}); Toast.ok('已加载 '+P.base(p)); info('待挂载：'+P.base(p)); stop(); }
        catch(e){ Toast.err(e.message); }
      }
      if(a==='lock'){
        if(!S.emu) return Toast.info('请先启动虚拟机');
        const cv=sc.querySelector('canvas');
        try{ S.emu.lock_mouse(); S.lock=true; Toast.info('鼠标已锁定 · 按 Esc 释放'); }
        catch(e){ if(cv && cv.requestPointerLock) cv.requestPointerLock(); }
      }
      if(a==='full') toggleFullscreen(win.el);
      if(a==='shot'){ try{ const d=S.emu.screen_make_screenshot(); download('v86-'+Date.now()+'.png', d); }catch(e){ Toast.err('截图失败'); } }
    });
    $w('#vmFile').onchange = e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
      S.file=f; info('待挂载：'+f.name+' → '+v86Slot(f.name)); stop(); Toast.ok('镜像已就绪，点击「启动」'); };
    sc.querySelector('canvas').addEventListener('click', ()=>{ if(S.lock && S.emu && S.emu.lock_mouse){ try{S.emu.lock_mouse();}catch(e){} } });
    document.addEventListener('pointerlockchange', ()=>{ if(!document.pointerLockElement) S.lock=false; });
    win.onClose=()=>stop();
    stat('未运行');
  }
});
/* ================================================================
   启动（无假加载动画，直接进入系统）
   ================================================================ */
const BOOT_TIME = Date.now();
(async function boot(){
  Cfg.apply();
  /* 1. 文件系统 */
  let backend='?';
  try{ backend = await FS.init(); }
  catch(e){
    UI.modal({title:'存储初始化失败', body:'<div style="font-size:12.5px;line-height:1.8">'+esc(e.message)+
      '<br><br>已尝试降级到 IndexedDB 后端。你可以继续使用，但容量与性能受限。</div>',
      actions:[{label:'继续',cls:'acc'},{label:'重试', onClick:()=>location.reload()}]});
    try{ backend = await FS.init(); }catch(x){}
  }
  try{ await FS.seed(); }catch(e){ console.warn('seed', e); }
  /* 2. 壁纸 + 桌面 */
  await restoreWallpaper();
  await Desktop.refresh();
  Bus.on('fs:change', debounce(()=>{ if(!document.hidden) Desktop.refresh(); }, 260));
  /* 3. 本地挂载恢复（File System Access 权限需重新授权） */
  try{
    const pending = await FS.restoreMounts();
    if(pending && pending.length){
      UI.modal({title:'重新挂载本地目录', dismiss:false, body:
        '<div style="font-size:12.5px;line-height:1.9">检测到 '+pending.length+' 个上次会话挂载的本地目录：'+
        '<div class="mono" style="margin:8px 0;color:var(--acc)">'+pending.map(p=>esc(p.name)).join('<br>')+'</div>'+
        '浏览器安全策略要求刷新后重新授权。点击下方按钮即可一次性恢复。</div>',
        actions:[
          {label:'重新授权并挂载', cls:'acc', keep:false, onClick:async()=>{
            let ok=0;
            for(const rec of pending){
              try{ const st=await rec.handle.requestPermission({mode:'readwrite'});
                if(st==='granted'){ await FS.mountLocal(rec.handle, rec.name); ok++; } }catch(e){}
            }
            Toast.ok('已恢复 '+ok+' 个挂载'); Desktop.refresh();
          }},
          {label:'暂不挂载', onClick:()=>{ pending.forEach(p=>IDB.del('handles','/mnt/local/'+p.name).catch(()=>{})); }}]});
    }
  }catch(e){}
  /* 4. 阻止浏览器默认打开拖入的文件，统一交给系统处理 */
  ['dragover','dragenter','drop'].forEach(t=>document.addEventListener(t, e=>{
    e.preventDefault();
    if(t==='drop' && !e.__orbit && !(e.target.closest && e.target.closest('#desktop'))){
      e.__orbit=true; handleExternalDrop(e, '/Desktop');
    }
  }));
  document.addEventListener('dragleave', e=>{ if(e.clientX===0&&e.clientY===0) Toast.info('松开即可导入文件'); });
  /* 5. 状态 */
  const q = await (navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : {});
  console.log('%cORBIT OS','color:#ff5f1f;font-weight:700', '· 后端', backend, '· 已用', fmtSize(q.usage||0));
  if(backend!=='OPFS') Toast.warn('OPFS 不可用，已降级为 '+backend+' 后端');
  /* 6. 首次使用引导 */
  if(!Cookie.get('orbit.seen')){
    Cookie.set('orbit.seen','1',365);
    setTimeout(()=>Toast.show('欢迎来到 ORBIT OS · 双击图标打开文件，右键查看完整菜单，把文件拖出窗口即可导出','', 6000), 900);
  }
  /* 7. 窗口尺寸变化时重新摆放越界图标 */
  window.addEventListener('resize', debounce(()=>{
    const {w,h}=CELL(); let moved=false;
    Object.keys(POS).forEach(k=>{ const p=POS[k];
      if(p.x> window.innerWidth-40 || p.y>window.innerHeight-120){ const np=Desktop.snapPos(0,0,k); POS[k]=np; moved=true; } });
    if(moved){ savePos(); Desktop.refresh(); }
  }, 400));
})();
</script>
