APPS.archive = {
  name: '压缩包工具', icon: ICONS.zip, desc: 'ARCHIVE · ZIP / TAR / GZ / 7Z',
  hidden: true,
  launch(o = {}) { extractArchive(o.path, dirOf(o.path)); }
};
function fixZipDate(d) {
  if (!(d instanceof Date) || isNaN(d.getTime())) return new Date();
  return new Date(d.getTime() + d.getTimezoneOffset() * 60000);
}
async function extractArchive(path, dest) {
  const name = baseOf(path);
  showLoader('正在解压 ' + name + ' …');
  try {
    const buf = await fs.readFile(path);
    const lower = name.toLowerCase();
    let n = 0;
    if (lower.endsWith('.zip')) {
      const JSZip = await JSZIP_LOADER.load();
      const zip = await JSZip.loadAsync(buf);
      const entries = Object.values(zip.files);
      for (const e of entries) {
        const target = joinPath(dest, e.name.replace(/\\/g, '/'));
        if (e.dir) { await fs.mkdir(target).catch(() => { }); continue; }
        const data = await e.async('uint8array');
        await fs.writeFile(target, data, { mtime: fixZipDate(e.date).getTime() });
        n++;
      }
    } else if (lower.endsWith('.tar')) {
      n = await untar(new Uint8Array(buf), dest);
    } else if (lower.endsWith('.gz') || lower.endsWith('.tgz')) {
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([buf]).stream().pipeThrough(ds);
      const out = new Uint8Array(await new Response(stream).arrayBuffer());
      if (lower.endsWith('.tgz')) n = await untar(out, dest);
      else {
        const target = joinPath(dest, name.replace(/\.gz$/i, ''));
        await fs.writeFile(target, out, { mtime: Date.now() });
        n = 1;
      }
    } else {
      n = await try7z(buf, dest, name);
    }
    refreshAll();
    toast(`解压完成：${n} 个文件 → ${dest}`, 'ok');
  } catch (e) {
    console.error(e);
    toast('解压失败：' + e.message, 'err');
  } finally { hideLoader(); }
}
async function untar(bytes, dest) {
  const td = new TextDecoder();
  let off = 0, count = 0;
  while (off + 512 <= bytes.length) {
    const head = bytes.subarray(off, off + 512);
    if (head.every(b => b === 0)) break;
    const readStr = (start, len) => {
      const s = td.decode(head.subarray(start, start + len));
      return s.replace(/\0.*$/, '').trim();
    };
    const readOct = (start, len) => parseInt(readStr(start, len) || '0', 8) || 0;
    let fname = readStr(0, 100);
    const prefix = readStr(345, 155);
    if (prefix) fname = prefix + '/' + fname;
    const size = readOct(124, 12);
    const mtime = readOct(136, 12) * 1000;
    const type = String.fromCharCode(head[156] || 48);
    const dataStart = off + 512;
    const target = joinPath(dest, fname);
    if (type === '5') await fs.mkdir(target).catch(() => { });
    else if (type === '0' || type === '\0' || type === ' ') {
      await fs.writeFile(target, bytes.subarray(dataStart, dataStart + size), { mtime: mtime || Date.now() });
      count++;
    }
    off = dataStart + Math.ceil(size / 512) * 512;
  }

}
async function try7z(buf, dest, name) {
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    const SevenZip = mod.default || mod;
    const files = [];
    const inst = await SevenZip({
      print: () => { }, printErr: () => { },
      locateFile: p => 'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/' + p
    });
    inst.FS.writeFile('/in.bin', buf);
    inst.callMain(['x', '/in.bin', '-o/out', '-y']);
    const list = inst.FS.readdir('/out');
    for (const f of list) {
      if (f === '.' || f === '..') continue;
      const data = inst.FS.readFile('/out/' + f);
      await fs.writeFile(joinPath(dest, f), new Uint8Array(data), { mtime: Date.now() });
      files.push(f);
    }
    return files.length;
  } catch (e) {
    toast('该压缩格式需要 7z 引擎，加载失败：' + e.message, 'err');
    return 0;
  }
}

function buildContour() {
  const w = 1200, h = 800, cx = w * 0.68, cy = h * 0.42;
  let paths = '';
  for (let i = 0; i < 16; i++) {
    const r = 42 + i * 46;
    let d = '';
    for (let a = 0; a <= 360; a += 6) {
      const rad = a * Math.PI / 180;
      const wob = 1 + 0.11 * Math.sin(rad * 3 + i * 0.7) + 0.07 * Math.sin(rad * 5 - i * 0.4);
      const x = cx + Math.cos(rad) * r * wob * 1.35;
      const y = cy + Math.sin(rad) * r * wob * 0.72;
      d += (a === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    paths += `<path d="${d}Z" fill="none" stroke="#F0A63C" stroke-width="${i % 4 === 0 ? 1.5 : 0.7}" opacity="${i % 4 === 0 ? .42 : .2}"/>`;
  }
  $('#contour').innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">${paths}</svg>`;
}

      ['字体系统', 'Fraunces × Noto Serif SC × Spline Sans Mono']]
        .map(([k, v]) => el('div', {
          style: 'border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:var(--panel2)'
        }, el('div', { class: 'lbl' }, k), el('div', { style: 'margin-top:6px;font-family:var(--f-u);font-size:11px;line-height:1.8' }, v)))));
  };

  renderNav();
  renderPage();
}

/* ================= 7.12 V86 虚拟机 ================= */
APPS.vm = {
  name: '虚拟机', icon: ICONS.vm, desc: 'V86 X86 EMULATOR · 版本锁定 0.5.319',
  launch() {
    const win = Win.open({ app: 'vm', title: '虚拟机', icon: ICONS.vm, w: 860, h: 620, args: { icon: ICONS.vm } });
    const screen = el('div', {
      id: 'v86-screen', style: 'background:#000;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center'
    });
    const textOut = el('div', { style: 'white-space:pre;font:14px monospace;line-height:14px;color:#ddd' });
    const canvas = el('canvas', { style: 'max-width:100%;image-rendering:pixelated' });
    screen.append(textOut, canvas);
    const status = el('div', { class: 'lbl' }, '未启动');
    const bar = el('div', { class: 'fx-tools' },
      el('span', { class: 'lbl' }, 'V86 · JS/WASM 0.5.319 · BIOS 固定 commit'),
      el('span', { style: 'margin-left:auto' }, status),
      el('button', {
        class: 'btn', onclick: () => {
          const inp = el('input', { type: 'file', accept: '.iso,.img,.bin,.fda,.hda,.vhd,.gz' });
          inp.onchange = async () => {
            const f = inp.files[0];
            if (!f) return;
            showLoader('正在载入镜像与模拟器…');
            try {
              const buf = await f.arrayBuffer();
              const ext = f.name.split('.').pop().toLowerCase();
              if (!window.V86) await loadScript('https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js');
              const wasm = { url: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm' };
              const bios = {
                url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'
              };
              const vga = {
                url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
              };
              const cfg = {
                wasm_path: wasm.url, bios: bios, vga_bios: vga,
                screen_container: screen,
                memory_size: 128 * 1024 * 1024, vga_memory_size: 8 * 1024 * 1024,
                autostart: true
              };
              if (ext === 'iso') cfg.cdrom = { buffer: buf };
              else if (ext === 'bin' || ext === 'fda') cfg.fda = { buffer: buf };
              else cfg.hda = { buffer: buf };
              const emu = new V86.V86Starter(cfg);
              win.emu = emu;
              status.textContent = '运行中';
              emu.add_listener('emulator-ready', () => { status.textContent = '就绪'; });
              toast('虚拟机已启动', 'ok');
            } catch (e) {
              toast('虚拟机启动失败：' + e.message, 'err');
              status.textContent = '启动失败';
            } finally { hideLoader(); }
          };
          inp.click();
        }
      }, '选择镜像并启动'),
      el('button', {
        class: 'btn', onclick: () => {
          const target = screen;
          if (target.requestPointerLock) {
            target.requestPointerLock();
            if (win.emu && win.emu.lock_mouse) { try { win.emu.lock_mouse(); } catch (e) { } }
            toast('鼠标已锁定，按 Esc 释放');
          } else toast('当前浏览器不支持指针锁定', 'err');
        }
      }, '锁定鼠标')
    );
    win.body.append(bar, screen);
    win.onClose.push(() => { try { win.emu && win.emu.destroy(); } catch (e) { } });
  }
};

/* ================= §8 系统启动 ================= */
async function seed() {
  const dirs = ['/文档', '/图片', '/音乐', '/视频', '/下载', '/桌面', '/系统'];
  for (const d of dirs) await fs.mkdir(d).catch(() => { });
  const welcome = '/文档/玄曜说明.md';
  if (!(await fs.exists(welcome))) {
    await fs.writeText(welcome, `# 玄曜 OS · 使用说明

这是一台完全运行在浏览器中的桌面操作系统。

## 文件系统
- 所有数据保存在 OPFS（Origin Private File System）中，刷新后依然存在。
- 可在「设置 → 存储与后端」切换 OPFS / IndexedDB 后端。
- 支持通过 File System Access API 挂载电脑本地目录到 /mnt/local/。
- 文件的修改日期在复制、移动、重命名后都会完整保留。

## 快捷操作
- 单击桌面图标打开，拖拽图标可自由摆放位置。
- 从电脑拖入文件即可导入，把图标拖出浏览器即可导出。
- 空白处拖动可框选多个文件，支持鼠标与触摸。
- F5 刷新，F11 全屏，Del 删除，F2 重命名。

## 内置应用
文件资源管理器 / 记事本（含 CSV 表格）/ 代码编辑器（实时预览）/
漫画阅读器 / 图片查看器 / 网页浏览器 / 计算器 / 画板 / 媒体播放器 / 虚拟机。
`, { mtime: Date.now() });
  }
}
function initGlobalDnD() {
  const prevent = e => { if (e && e.preventDefault) e.preventDefault(); };
  window.addEventListener('dragover', prevent);
  window.addEventListener('drop', async e => {
    const t = e.target && e.target.closest ? e.target : null;
    if (t && t.closest('.fx-list,#iconLayer,#desktop,[data-path],.manga-scroll,.set')) return;
    e.preventDefault();
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    showLoader('正在导入到 /下载 …');
    try {
      for (const f of e.dataTransfer.files) await writeFileObject(f, joinPath('/下载', f.name));
      toast('已导入 ' + e.dataTransfer.files.length + ' 个文件到 /下载', 'ok');
      refreshAll();
    } finally { hideLoader(); }
  });
}
function initKeys() {
  document.addEventListener('keydown', e => {
    if (e.key === 'F5') { e.preventDefault(); Desktop.render(); refreshAll(); toast('已刷新'); }
    if (e.key === 'F11') {
      e.preventDefault();
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => { });
    }
    if (e.key === 'Escape') { hideCtx(); $('#start').classList.add('hide'); $('#cal').classList.add('hide'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      const top = Win.list.filter(w => !w.minimized).sort((a, b) => b.z - a.z)[0];
      if (top && top.el.querySelector('textarea, .CodeMirror')) {
        e.preventDefault();
        const saveBtn = top.el.querySelector('.btn.pri');
        if (saveBtn) saveBtn.click();
      }
    }
  });
}
function initResponsive() {
  let lastMobile = isMobile();
  addEventListener('resize', () => {
    const m = isMobile();
    if (m !== lastMobile) {
      lastMobile = m;
      for (const w of Win.list) {
        if (m) {
          w.el.style.left = '0px'; w.el.style.top = '0px';
          w.el.style.width = '100%'; w.el.style.height = `calc(100% - ${railH()}px)`;
        } else {
          w.el.style.width = Math.min(960, innerWidth - 60) + 'px';
          w.el.style.height = Math.min(640, innerHeight - 120) + 'px';
          w.el.style.left = '40px'; w.el.style.top = '30px';
        }
      }
      Desktop.render();
    }
  });
}
async function boot() {
  applyCfg();
  buildContour();
  applyWallpaper();
  tickClock();
  setInterval(tickClock, 15000);
  await OPFS.init();
  if (!OPFS.ok && CFG.data.backend === 'opfs') {
    CFG.data.backend = 'idb'; CFG.save();
    toast('OPFS 不可用，已自动降级到 IndexedDB 后端', 'err');
  }
  showLoader('正在初始化文件系统…');
  try { await seed(); } catch (e) { console.error(e); }
  hideLoader();
  Desktop.load();
  Desktop.render();
  initDesktopEvents();
  initRail();
  initGlobalDnD();
  initKeys();
  initResponsive();
  const pending = MOUNTS.pending();
  if (pending.length && window.showDirectoryPicker) {
    setTimeout(() => {
      toast(`本地目录 ${pending.join('、')} 需重新授权，请在设置中重新挂载`);
    }, 1200);
  }
  $('#startFootInfo').textContent = `XUANYAO OS · ${OPFS.ok ? 'OPFS' : 'INDEXEDDB'} · ${new Date().getFullYear()}`;
  fs.usage().then(u => {
    const pct = u.quota ? Math.min(100, u.used / u.quota * 100) : 0;
    $('#meterFill').style.width = Math.max(3, pct) + '%';
    $('#storageBtn').title = `存储占用 ${fmtSize(u.used)}${u.quota ? ' / ' + fmtSize(u.quota) : ''}`;
  }).catch(() => { });
}
boot();
