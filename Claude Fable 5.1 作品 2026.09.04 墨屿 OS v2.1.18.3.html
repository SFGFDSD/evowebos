<style>
/* ================================================================
   墨屿 OS — 设计令牌
   主题灵感：宣纸夜色 · 朱砂 · 青瓷
   ================================================================ */
:root{
  --font-ui:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-display:'Noto Serif SC','Songti SC','SimSun',serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;

  --bg:#0b0c11;
  --bg2:#12141c;
  --panel:rgba(18,20,28,.86);
  --panel-solid:#161822;
  --panel-2:#1d2030;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --text:#ebe6da;
  --text-2:#b9b4a8;
  --muted:#7f8394;
  --accent:#e2542f;     /* 朱砂 */
  --accent-soft:rgba(226,84,47,.18);
  --jade:#3fb996;       /* 青瓷 */
  --jade-soft:rgba(63,185,150,.16);
  --gold:#d8a548;
  --danger:#e0513f;
  --shadow:0 24px 60px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --radius:14px;
  --radius-sm:8px;
  --taskbar-h:52px;
  --icon-w:96px;
  --icon-h:110px;
  --ease:cubic-bezier(.22,.9,.26,1);
}
[data-theme="light"]{
  --bg:#efe9dd;
  --bg2:#f6f2ea;
  --panel:rgba(250,247,240,.9);
  --panel-solid:#faf7f0;
  --panel-2:#eee8dc;
  --line:rgba(30,25,15,.1);
  --line-strong:rgba(30,25,15,.2);
  --text:#1f1c17;
  --text-2:#4a463f;
  --muted:#7c776d;
  --accent:#c94425;
  --accent-soft:rgba(201,68,37,.14);
  --jade:#22876c;
  --jade-soft:rgba(34,135,108,.14);
  --shadow:0 20px 50px rgba(50,40,20,.25), 0 2px 6px rgba(50,40,20,.12);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(127,131,148,.35);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(127,131,148,.6);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.ic{display:inline-block;width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
#icons{touch-action:none}
#ctx-menu{overflow:visible}
[hidden]{display:none!important}

/* ================= 桌面 ================= */
#desktop{position:fixed;inset:0 0 var(--taskbar-h) 0;overflow:hidden;user-select:none;-webkit-user-select:none}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:background-image .6s var(--ease),opacity .6s;z-index:0}
#wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.45),transparent 60%);pointer-events:none}
#wallpaper.wp-anim{animation:wpIn .9s var(--ease)}
@keyframes wpIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}

#icons{position:absolute;inset:0;z-index:1;padding:10px}
.dicon{position:absolute;width:var(--icon-w);height:var(--icon-h);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 4px 4px;border-radius:12px;cursor:default;touch-action:none;
  transition:left .38s var(--ease),top .38s var(--ease),background .15s,box-shadow .15s,transform .2s var(--ease),opacity .25s;
  animation:iconIn .5s var(--ease) both;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5)}
.dicon.no-anim{transition:none}
@keyframes iconIn{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
.dicon:hover{background:rgba(255,255,255,.08)}
.dicon.selected{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.dicon.drop-hover{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);transform:scale(1.06)}
.dicon.cut{opacity:.5}
.dicon .glyph{width:54px;height:54px;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.dicon .glyph .ic{width:46px;height:46px;stroke-width:1.35}
.dicon .glyph img{width:52px;height:52px;object-fit:cover;border-radius:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.dicon .lbl{font-size:12px;line-height:1.25;text-align:center;margin-top:5px;max-height:2.6em;overflow:hidden;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;pointer-events:none;padding:0 2px}
.dicon .lbl.editing{-webkit-line-clamp:unset;max-height:none}
.dicon .rn{width:100%;font-size:12px;background:var(--panel-solid);border:1px solid var(--accent);color:var(--text);border-radius:4px;padding:2px 4px;text-align:center;outline:none;margin-top:5px;text-shadow:none}
.dicon .badge{position:absolute;right:14px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--jade);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dicon .badge .ic{width:10px;height:10px;stroke:#fff;stroke-width:2.5}

/* 文件类型着色 */
.k-folder{color:#f0b95a}.k-image{color:#66c2ff}.k-audio{color:#c58cff}.k-video{color:#ff7ea8}.k-text{color:#d6d3c8}.k-code{color:#7ee2c1}.k-html{color:#ff9058}.k-archive{color:#e5c46a}.k-pdf{color:#ff6d5e}.k-sheet{color:#6ed58c}.k-app{color:var(--accent)}.k-vm{color:#9db4ff}.k-file{color:#aeb3c2}
.dicon .glyph.app-tile{width:54px;height:54px;border-radius:15px;background:linear-gradient(145deg,var(--panel-2),var(--bg2));box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.dicon .glyph.app-tile .ic{width:30px;height:30px;stroke-width:1.6}

#rubber{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);pointer-events:none;z-index:5;display:none;border-radius:3px}
#windows{position:absolute;inset:0;z-index:10;pointer-events:none}
#desktop.drag-over::before{content:"";position:absolute;inset:8px;border:2px dashed var(--jade);border-radius:18px;z-index:4;pointer-events:none;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}

/* ================= 窗口 ================= */
.win{position:absolute;min-width:280px;min-height:160px;background:var(--panel);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;
  animation:winIn .32s var(--ease) both;transition:opacity .22s var(--ease),transform .22s var(--ease)}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.win.closing{opacity:0;transform:translateY(12px) scale(.96)}
.win.minimized{opacity:0;transform:translateY(80px) scale(.6);pointer-events:none}
.win.maximized{border-radius:0;border:0}
.win.focused{border-color:rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(226,84,47,.25)}
.win.fs-manga .win-head{display:none}
.win-head{height:40px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);cursor:default;flex:none;touch-action:none}
.win-head .wicon{color:var(--accent);display:grid;place-items:center}
.win-head .wtitle{flex:1;font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.win.focused .wtitle{color:var(--text)}
.wctl{display:flex;gap:2px}
.wctl button{width:36px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.wctl button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.wctl button.close:hover{background:var(--accent);color:#fff}
.wctl .ic{width:15px;height:15px;stroke-width:1.9}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:3}
.rz.n{top:-4px;left:8px;right:8px;height:8px;cursor:n-resize}.rz.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:s-resize}
.rz.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:e-resize}.rz.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:w-resize}
.rz.ne{top:-5px;right:-5px;width:14px;height:14px;cursor:ne-resize}.rz.nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nw-resize}
.rz.se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:se-resize}.rz.sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:sw-resize}
.win.maximized .rz{display:none}
.win-body iframe{border:0;width:100%;height:100%;background:#fff}
.win.dragging .win-body,.win.resizing .win-body{pointer-events:none}
.win .fs-exit{display:none;position:absolute;top:10px;right:10px;z-index:50;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;place-items:center;border:1px solid rgba(255,255,255,.25);opacity:.45;transition:opacity .2s}
.win .fs-exit:hover{opacity:1}
.win.fs-manga .fs-exit{display:grid}

/* ================= 任务栏 ================= */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid var(--line);z-index:1000;padding-bottom:env(safe-area-inset-bottom)}
#start-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--accent);transition:background .2s,transform .2s}
#start-btn:hover{background:var(--accent-soft)}
#start-btn.active{background:var(--accent);color:#fff}
#start-btn .ic{width:24px;height:24px;stroke-width:1.5}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;height:100%;align-items:center;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.task{height:38px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px;max-width:180px;position:relative;transition:background .2s;white-space:nowrap;flex:none}
.task span{overflow:hidden;text-overflow:ellipsis}
.task .ic{width:16px;height:16px;color:var(--accent)}
.task:hover{background:rgba(255,255,255,.07)}
.task.active{background:rgba(255,255,255,.1);color:var(--text)}
.task::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--muted);opacity:.5}
.task.active::after{background:var(--accent);opacity:1}
.task.min::after{opacity:.25}
#tray{display:flex;align-items:center;gap:4px;padding-left:8px;border-left:1px solid var(--line)}
#tray button{height:38px;padding:0 10px;border-radius:10px;color:var(--text-2);display:flex;align-items:center;gap:6px;transition:background .2s}
#tray button:hover{background:rgba(255,255,255,.07)}
#clock{font-family:var(--font-mono);font-size:12.5px;line-height:1.2;text-align:right;color:var(--text)}
#clock small{display:block;font-size:10px;color:var(--muted)}

/* ================= 开始菜单 ================= */
#start-menu{position:fixed;left:10px;bottom:calc(var(--taskbar-h) + 10px);width:560px;max-width:calc(100vw - 20px);max-height:calc(100vh - var(--taskbar-h) - 24px);background:var(--panel);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow);z-index:1100;display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom left;animation:menuIn .28s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#start-menu .sm-head{padding:18px 20px 8px;display:flex;align-items:center;gap:12px}
#start-menu .sm-head h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.08em}
#start-menu .sm-head h2 em{color:var(--accent);font-style:normal}
#start-menu .sm-head p{margin:0;color:var(--muted);font-size:12px;font-family:var(--font-mono)}
#start-menu .sm-search{margin:6px 16px 10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
#start-menu .sm-search input{flex:1;background:none;border:0;outline:none;color:var(--text)}
#start-menu .sm-search .ic{color:var(--muted)}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 14px 14px;overflow:auto}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:14px;transition:background .15s,transform .15s;color:var(--text-2);font-size:12px;animation:iconIn .45s var(--ease) both}
.sm-app:hover{background:rgba(255,255,255,.07);color:var(--text);transform:translateY(-2px)}
.sm-app .tile{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--panel-2),var(--bg2));box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.sm-app .tile .ic{width:26px;height:26px;color:var(--accent)}
.sm-app:nth-child(3n) .tile .ic{color:var(--jade)}
.sm-app:nth-child(3n+2) .tile .ic{color:var(--gold)}
.sm-foot{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.sm-foot button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;color:var(--text-2);font-size:12.5px}
.sm-foot button:hover{background:rgba(255,255,255,.07);color:var(--text)}
.sm-foot .spacer{flex:1}

/* ================= 上下文菜单 ================= */
#ctx-menu{position:fixed;min-width:200px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:5000;animation:menuIn .18s var(--ease);transform-origin:top left;max-height:80vh;overflow:auto}
.ctx-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:default;position:relative}
.ctx-item .ic{width:16px;height:16px;color:var(--muted)}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-item:hover .ic{color:#fff}
.ctx-item.danger{color:var(--danger)}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-item kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;opacity:.6}
.ctx-item .sub-arrow{margin-left:auto;opacity:.6}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
.ctx-title{padding:6px 12px 4px;font-size:11px;color:var(--muted);letter-spacing:.1em;font-family:var(--font-mono)}
.ctx-sub{position:absolute;left:100%;top:-6px;min-width:180px;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none}
.ctx-item:hover>.ctx-sub{display:block}
.ctx-sub .ctx-item{color:var(--text-2)}
.ctx-sub .ctx-item .ic{color:var(--muted)}

/* ================= 通用 UI ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text-2);font-size:12.5px;transition:background .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);color:var(--text);border-color:var(--line-strong)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:#f0623c}
.btn.jade{background:var(--jade);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.icon{width:32px;padding:0}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.sm.icon{width:26px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:transparent}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.inp{height:32px;padding:0 10px;border-radius:9px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--text);outline:none;transition:border-color .15s}
[data-theme="light"] .inp{background:rgba(255,255,255,.6)}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237f8394' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:14px}
select.inp option{background:var(--panel-solid);color:var(--text)}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.toolbar .grow{flex:1}
.statusbar{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:var(--font-mono);flex:none;overflow:hidden;white-space:nowrap}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:30px;text-align:center}
.empty .ic{width:44px;height:44px;stroke-width:1.2;opacity:.5}
.empty h3{margin:0;font-family:var(--font-display);font-weight:600;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11px;color:var(--text-2);font-family:var(--font-mono)}
.chip.jade{background:var(--jade-soft);color:var(--jade);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* 模态框 */
#modal-root{position:fixed;inset:0;z-index:6000;pointer-events:none}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;pointer-events:auto;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(420px,calc(100vw - 32px));background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 18px;animation:winIn .28s var(--ease)}
.modal h3{margin:0 0 8px;font-family:var(--font-display);font-size:17px;font-weight:600}
.modal p{margin:0 0 14px;color:var(--text-2);font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
.modal .inp{width:100%;margin-bottom:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal.wide{width:min(720px,calc(100vw - 32px))}

/* 吐司 */
#toasts{position:fixed;right:16px;bottom:calc(var(--taskbar-h) + 14px);display:flex;flex-direction:column;gap:8px;z-index:7000;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel-solid);border:1px solid var(--line-strong);border-left:3px solid var(--jade);border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:360px;animation:toastIn .3s var(--ease)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--gold)}
.toast .ic{color:var(--jade)}
.toast.err .ic{color:var(--danger)}
.toast.warn .ic{color:var(--gold)}
.toast button.act{margin-left:auto;color:var(--accent);font-weight:500;white-space:nowrap}
.toast.out{animation:toastOut .25s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
.progress{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .2s}

/* ================= 文件管理器 ================= */
.fx{display:flex;flex-direction:column;height:100%}
.fx-tb{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.fx-crumbs{flex:1;display:flex;align-items:center;gap:2px;height:32px;padding:0 6px;border-radius:9px;background:rgba(0,0,0,.2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:80px}
[data-theme="light"] .fx-crumbs{background:rgba(255,255,255,.5)}
.fx-crumbs::-webkit-scrollbar{display:none}
.crumb{padding:3px 7px;border-radius:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap;cursor:default;display:flex;align-items:center;gap:4px}
.crumb:hover{background:rgba(255,255,255,.08);color:var(--text)}
.crumb.cur{color:var(--text);font-weight:500}
.crumb-sep{color:var(--muted);opacity:.5;font-size:11px}
.fx-crumbs input{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:var(--font-mono);font-size:12.5px;min-width:100px}
.fx-search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;background:rgba(0,0,0,.2);border:1px solid var(--line);width:180px}
[data-theme="light"] .fx-search{background:rgba(255,255,255,.5)}
.fx-search input{flex:1;background:none;border:0;outline:none;color:var(--text);min-width:0;font-size:12.5px}
.fx-search .ic{color:var(--muted);width:15px;height:15px}
.fx-main{flex:1;display:flex;min-height:0;position:relative}
.fx-side{width:190px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px;background:rgba(0,0,0,.12)}
.fx-side h4{margin:8px 8px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-family:var(--font-mono);font-weight:500}
.side-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px;color:var(--text-2);cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s}
.side-item .ic{width:16px;height:16px;flex:none}
.side-item:hover{background:rgba(255,255,255,.07);color:var(--text)}
.side-item.active{background:var(--accent-soft);color:var(--text)}
.side-item.drop-hover{background:var(--jade-soft);box-shadow:inset 0 0 0 1px var(--jade)}
.side-item .eject{margin-left:auto;opacity:0;color:var(--muted)}
.side-item:hover .eject{opacity:1}
.side-item .eject:hover{color:var(--danger)}
.fx-list{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.fx-list.drag-over::after{content:"";position:absolute;inset:6px;border:2px dashed var(--jade);border-radius:12px;pointer-events:none;z-index:2}
.fx-head{display:grid;align-items:center;height:30px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);flex:none;padding-right:10px;user-select:none}
.fx-head .col{position:relative;padding:0 10px;display:flex;align-items:center;gap:4px;height:100%;cursor:default;white-space:nowrap;overflow:hidden}
.fx-head .col:hover{color:var(--text);background:rgba(255,255,255,.04)}
.fx-head .col.on{color:var(--text)}
.fx-head .col .ic{width:12px;height:12px}
.fx-head .col .rsz{position:absolute;right:0;top:4px;bottom:4px;width:8px;cursor:col-resize;border-right:1px solid var(--line);touch-action:none}
.fx-head .col .rsz:hover{border-color:var(--accent)}
.fx-rows{flex:1;overflow:auto;position:relative;padding:4px 0 40px}
.frow{display:grid;align-items:center;height:34px;font-size:13px;color:var(--text-2);cursor:default;border-radius:6px;margin:0 6px;position:relative;transition:background .1s}
.frow>div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .nm{display:flex;align-items:center;gap:9px;color:var(--text)}
.frow .nm .ic{width:18px;height:18px;flex:none;stroke-width:1.5}
.frow .nm img.thumb{width:22px;height:22px;object-fit:cover;border-radius:4px;flex:none}
.frow .dt,.frow .tp,.frow .sz{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.frow .sz{text-align:right}
.frow:hover{background:rgba(255,255,255,.06)}
.frow.selected{background:var(--accent-soft)}
.frow.selected .nm{color:var(--text)}
.frow.drop-hover{background:var(--jade-soft);box-shadow:inset 0 0 0 1px var(--jade)}
.frow.cut{opacity:.5}
.frow .rn{background:var(--panel-solid);border:1px solid var(--accent);border-radius:4px;color:var(--text);padding:2px 6px;outline:none;font-size:13px;width:100%}
.fx-rubber{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);pointer-events:none;display:none;z-index:3;border-radius:2px}
.fx-grid .frow{display:inline-flex;flex-direction:column;width:96px;height:100px;margin:4px;justify-content:center;text-align:center;vertical-align:top}
.fx-grid .frow>div{padding:0 4px}
.fx-grid .frow .nm{flex-direction:column;gap:6px;white-space:normal;font-size:12px;line-height:1.2;display:flex;align-items:center}
.fx-grid .frow .nm .ic{width:38px;height:38px;stroke-width:1.3}
.fx-grid .frow .nm img.thumb{width:44px;height:44px}
.fx-grid .frow .nm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.fx-grid .frow .dt,.fx-grid .frow .tp,.fx-grid .frow .sz{display:none}
.fx-grid .fx-head{display:none}
.fx-status{height:26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);flex:none}
.fx-side-toggle{display:none}
.fx-side-bg{display:none}

/* ================= 记事本 / 表格 ================= */
.np textarea{flex:1;width:100%;resize:none;border:0;outline:none;background:transparent;color:var(--text);padding:14px 16px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;tab-size:2}
.np textarea.wrap-off{white-space:pre;overflow:auto}
.sheet-wrap{flex:1;overflow:auto;padding:6px}
.sheet{border-collapse:separate;border-spacing:0;font-family:var(--font-mono);font-size:12px;min-width:100%}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 10px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sheet th{position:sticky;top:0;background:var(--panel-2);color:var(--gold);font-weight:500;z-index:1}
.sheet td:first-child,.sheet th:first-child{position:sticky;left:0;background:var(--panel-2);color:var(--muted);text-align:right;z-index:2}
.sheet th:first-child{z-index:3}
.sheet td[contenteditable]:focus{outline:1.5px solid var(--accent);background:var(--accent-soft)}
.sheet tr:hover td{background:rgba(255,255,255,.03)}

/* ================= 图片 / 漫画 / 媒体 ================= */
.viewer{flex:1;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1c1f2a,#07080c);position:relative;cursor:grab;touch-action:none}
.viewer img{max-width:100%;max-height:100%;transition:transform .12s ease-out;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.viewer.grabbing{cursor:grabbing}
.viewer .vinfo{position:absolute;left:12px;bottom:10px;font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.4);padding:3px 8px;border-radius:6px}
.manga{flex:1;overflow:auto;background:#000;display:flex;flex-direction:column;align-items:center;position:relative;scroll-behavior:auto;overscroll-behavior:contain}
.manga img{width:100%;max-width:1000px;display:block;pointer-events:none}
.manga .mloading{position:sticky;top:0;width:100%;text-align:center;padding:14px;color:#aaa;font-family:var(--font-mono);font-size:12px;background:linear-gradient(#000,transparent);z-index:2}
.manga .mpage{position:sticky;bottom:10px;align-self:flex-end;margin-right:10px;background:rgba(0,0,0,.6);color:#ddd;font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:6px;pointer-events:none}
.media{flex:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#181b26,#06070a);padding:20px}
.media video{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);outline:none}
.media .audio-card{width:min(420px,90%);padding:30px 26px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line-strong);text-align:center}
.media .audio-card .disc{width:130px;height:130px;margin:0 auto 20px;border-radius:50%;background:conic-gradient(from 0deg,#2a2d3a,#0c0d12,#2a2d3a,#0c0d12,#2a2d3a);display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 30px rgba(255,255,255,.02);animation:spin 6s linear infinite;animation-play-state:paused}
.media .audio-card.playing .disc{animation-play-state:running}
.media .audio-card .disc i{width:36px;height:36px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 6px #0b0c11}
@keyframes spin{to{transform:rotate(360deg)}}
.media .audio-card h3{margin:0 0 4px;font-family:var(--font-display);font-size:16px;word-break:break-all}
.media .audio-card p{margin:0 0 16px;color:var(--muted);font-family:var(--font-mono);font-size:11px}
.media audio{width:100%}

/* ================= 浏览器 ================= */
.brw-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.brw-url{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
[data-theme="light"] .brw-url{background:rgba(255,255,255,.6)}
.brw-url input{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:var(--font-mono);font-size:12.5px;min-width:0}
.brw-url .ic{color:var(--jade);width:14px;height:14px}
.brw-frame{flex:1;position:relative;background:#fff}
.brw-frame iframe{position:absolute;inset:0;width:100%;height:100%}
.brw-home{position:absolute;inset:0;overflow:auto;background:linear-gradient(160deg,#0f1118,#1a1424 60%,#0f1118);color:#ebe6da;display:flex;flex-direction:column;align-items:center;padding:60px 20px}
.brw-home h1{font-family:var(--font-display);font-size:38px;margin:0 0 6px;letter-spacing:.2em}
.brw-home h1 em{color:var(--accent);font-style:normal}
.brw-home p{color:#8b8fa0;font-family:var(--font-mono);font-size:12px;margin:0 0 30px}
.brw-home .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:min(620px,100%)}
.brw-home .links button{padding:14px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#ebe6da;font-size:13px;transition:background .15s,transform .15s}
.brw-home .links button:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.brw-home .links button small{display:block;color:#8b8fa0;font-size:10.5px;margin-top:4px;font-family:var(--font-mono)}
.brw-home .note{margin-top:30px;font-size:12px;color:#8b8fa0;max-width:520px;text-align:center;line-height:1.7}

/* ================= 计算器 ================= */
.calc{flex:1;display:flex;flex-direction:column;padding:14px;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent)}
.calc .disp{flex:none;text-align:right;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.calc .disp small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:12px;min-height:1.4em;word-break:break-all}
.calc .disp b{display:block;font-family:var(--font-mono);font-weight:500;font-size:34px;line-height:1.2;word-break:break-all;color:var(--text)}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc .keys button{border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-family:var(--font-mono);font-size:18px;color:var(--text);transition:background .12s,transform .1s;min-height:44px}
.calc .keys button:hover{background:rgba(255,255,255,.12)}
.calc .keys button:active{transform:scale(.95)}
.calc .keys button.op{color:var(--gold)}
.calc .keys button.eq{background:var(--accent);color:#fff;border-color:transparent;grid-row:span 2}
.calc .keys button.fn{color:var(--jade);font-size:14px}
.calc .hist{max-height:80px;overflow:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.6}

/* ================= 画板 ================= */
.paint{flex:1;display:flex;flex-direction:column;min-height:0}
.paint .cv-wrap{flex:1;overflow:auto;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/20px 20px,#2a2d38;display:grid;place-items:center;padding:16px}
.paint canvas{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:none;cursor:crosshair;max-width:100%}
.paint .sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.paint .sw.on{border-color:#fff;transform:scale(1.15)}
.paint input[type=color]{width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer}
.paint input[type=range]{width:100px;accent-color:var(--accent)}

/* ================= 设置 ================= */
.settings{flex:1;display:flex;min-height:0}
.set-nav{width:170px;flex:none;border-right:1px solid var(--line);padding:10px 8px;background:rgba(0,0,0,.12);overflow:auto}
.set-nav button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:9px;color:var(--text-2);font-size:13px;text-align:left}
.set-nav button:hover{background:rgba(255,255,255,.06)}
.set-nav button.on{background:var(--accent-soft);color:var(--text)}
.set-nav button .ic{color:var(--muted)}
.set-nav button.on .ic{color:var(--accent)}
.set-body{flex:1;overflow:auto;padding:22px 26px}
.set-body h2{margin:0 0 4px;font-family:var(--font-display);font-size:20px;font-weight:600}
.set-body .sub{margin:0 0 20px;color:var(--muted);font-size:12.5px}
.set-sec{margin-bottom:26px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.set-sec h3{margin:0 0 12px;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--text-2)}
.set-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{flex:1;font-size:13px}
.set-row .lbl small{display:block;color:var(--muted);font-size:11.5px}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wp-item{aspect-ratio:16/10;border-radius:10px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .15s,border-color .15s;overflow:hidden}
.wp-item:hover{transform:translateY(-2px)}
.wp-item.on{border-color:var(--accent)}
.wp-item span{position:absolute;left:6px;bottom:4px;font-size:10.5px;color:#fff;text-shadow:0 1px 3px #000;font-family:var(--font-mono)}
.wp-item.add{display:grid;place-items:center;background:rgba(255,255,255,.04);border:1.5px dashed var(--line-strong);color:var(--muted)}
.wp-item .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:none;place-items:center}
.wp-item:hover .del{display:grid}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
.swatches button.on{border-color:#fff;transform:scale(1.15)}
.usage-bar{height:14px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden;display:flex}
.usage-bar i{display:block;height:100%;transition:width .4s var(--ease)}
.usage-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:10px;font-size:12px}
.usage-legend div{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.usage-legend b{width:10px;height:10px;border-radius:3px;flex:none}
.usage-legend span{margin-left:auto;font-family:var(--font-mono);color:var(--muted);font-size:11px}
.toggle{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.toggle.on{background:var(--jade)}
.toggle.on::after{transform:translateX(18px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;font-family:var(--font-mono)}
.kv span:nth-child(odd){color:var(--muted)}

/* ================= HTML 编辑器 ================= */
.ed{flex:1;display:flex;flex-direction:column;min-height:0}
.ed-tb{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.ed-tb .btn{height:28px;padding:0 9px;font-size:12px;gap:5px}
.ed-tb .btn .ic{width:14px;height:14px}
.ed-find{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2);flex-wrap:wrap;flex:none}
.ed-find .inp{height:28px;font-size:12.5px;font-family:var(--font-mono)}
.ed-find .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);min-width:56px}
.ed-find .cnt.bad{color:var(--danger)}
.ed-find .tgl{height:28px;min-width:28px;padding:0 6px;border-radius:7px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);border:1px solid transparent}
.ed-find .tgl.on{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.ed-split{flex:1;display:flex;min-height:0;position:relative}
.ed-pane{min-width:200px;flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.ed-pane .CodeMirror{flex:1;height:auto;font-family:var(--font-mono);font-size:13px;line-height:1.6}
.ed-pane textarea.fallback{flex:1;background:#212121;color:#eee;border:0;outline:none;padding:12px;font-family:var(--font-mono);resize:none}
.ed-div{width:6px;flex:none;cursor:col-resize;background:var(--line);position:relative;touch-action:none;transition:background .15s}
.ed-div:hover,.ed-div.on{background:var(--accent)}
.ed-prev{min-width:120px;width:45%;flex:none;display:flex;flex-direction:column;min-height:0;background:#fff}
.ed-prev .ph{height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel-2);color:var(--muted);font-size:11px;font-family:var(--font-mono);border-bottom:1px solid var(--line);flex:none}
.ed-prev iframe{flex:1;border:0;width:100%;background:#fff}
.ed-split.no-prev .ed-prev,.ed-split.no-prev .ed-div{display:none}
.cm-find-match{background:rgba(216,165,72,.35)}
.cm-find-cur{background:rgba(226,84,47,.6);outline:1px solid var(--accent)}
.cm-trailingspace{background:rgba(226,84,47,.25)}

/* ================= 虚拟机 ================= */
.vm{flex:1;display:flex;flex-direction:column;min-height:0;background:#000}
.vm .vm-cfg{padding:20px;color:var(--text);overflow:auto;background:var(--panel-solid);flex:1}
.vm .vm-cfg h3{font-family:var(--font-display);margin:0 0 6px}
.vm .vm-cfg p{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.7}
.vm .vm-screen{flex:1;display:grid;place-items:center;overflow:auto;position:relative}
#screen_container,.screen_container{display:inline-block;position:relative;background:#000}
.screen_container>div{white-space:pre;font:14px monospace;line-height:14px;color:#ccc}
.screen_container>canvas{display:block}
.vm .vm-msg{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-family:var(--font-mono);font-size:11px;color:#aaa;background:rgba(0,0,0,.6)}

/* ================= 属性/关于 ================= */
.props{padding:18px;overflow:auto;flex:1}
.props .hd{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.props .hd .ic{width:44px;height:44px;stroke-width:1.3}
.props .hd h3{margin:0;font-family:var(--font-display);word-break:break-all}
.props .hd small{color:var(--muted);font-family:var(--font-mono);font-size:11px}

/* ================= PDF/其他 ================= */
.pdfwrap{flex:1;background:#333}

/* ================= 响应式 · 平板 & 手机 ================= */
@media (max-width:900px){
  .fx-side{position:absolute;left:0;top:0;bottom:0;z-index:5;width:220px;transform:translateX(-100%);transition:transform .28s var(--ease);background:var(--panel-solid);box-shadow:var(--shadow)}
  .fx-side.open{transform:none}
  .fx-side-bg{display:none;position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.35)}
  .fx-side.open~.fx-side-bg{display:block}
  .fx-side-toggle{display:inline-flex}
  .fx-search{width:120px}
  .set-nav{width:56px}
  .set-nav button span{display:none}
  .set-nav button{justify-content:center}
  .set-body{padding:16px}
  .ed-prev{width:40%}
}
@media (max-width:768px){
  :root{--taskbar-h:64px;--icon-w:78px;--icon-h:96px}
  .dicon .glyph{width:46px;height:46px}
  .dicon .glyph .ic{width:40px;height:40px}
  .dicon .glyph.app-tile{width:46px;height:46px;border-radius:13px}
  .dicon .lbl{font-size:11px}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0;min-width:0}
  .win .rz{display:none}
  .win-head{height:46px}
  .wctl button{width:42px;height:38px}
  #taskbar{padding:0 8px;gap:4px;justify-content:space-between}
  #tasks{gap:6px}
  .task{max-width:64px;padding:0;width:52px;height:46px;justify-content:center;border-radius:14px}
  .task span{display:none}
  .task .ic{width:22px;height:22px}
  .task::after{left:18px;right:18px}
  #start-btn{width:50px;height:50px;border-radius:16px}
  #tray button span{display:none}
  #clock small{display:none}
  #start-menu{left:8px;right:8px;width:auto;bottom:calc(var(--taskbar-h) + 8px);border-radius:22px}
  .sm-grid{grid-template-columns:repeat(4,1fr)}
  .fx-head{grid-template-columns:1fr 60px 70px!important}
  .frow{grid-template-columns:1fr 60px 70px!important}
  .frow .dt,.fx-head .col.c-dt{display:none}
  .frow{height:40px}
  .fx-search{width:100px}
  .ed-split{flex-direction:column}
  .ed-div{width:auto;height:6px;cursor:row-resize}
  .ed-prev{width:100%!important;height:40%;min-width:0}
  .ed-pane{min-width:0}
  .ctx-item{padding:11px 12px}
  .modal{padding:18px}
  .calc .keys button{font-size:20px}
  #toasts{right:8px;left:8px}
  .toast{max-width:none}
  .settings{flex-direction:column}
  .set-nav{width:100%;display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
  .set-nav button{width:auto;flex:none}
  .set-nav button span{display:inline}
  .props{padding:14px}
}
@media (max-width:420px){
  .sm-grid{grid-template-columns:repeat(3,1fr)}
  .fx-search{width:36px;padding:0 9px}
  .fx-search input{display:none}
}
@media (hover:none){
  .side-item .eject{opacity:1}
  .wp-item .del{display:grid}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
[data-anim="off"] *{animation-duration:0s!important;transition-duration:0s!important}

async function makeSampleImage(text, i, wdt = 800, hgt = 1100) { const c = el('canvas', { width: wdt, height: hgt }); const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, wdt, hgt); g.addColorStop(0, ['#1a1d2b', '#2b1a1a', '#1a2b25', '#2b261a'][i % 4]); g.addColorStop(1, '#0b0c11'); x.fillStyle = g; x.fillRect(0, 0, wdt, hgt); x.strokeStyle = 'rgba(255,255,255,.15)'; x.lineWidth = 6; x.strokeRect(40, 40, wdt - 80, hgt - 80); x.fillStyle = '#e2542f'; x.beginPath(); x.arc(wdt / 2, hgt / 2 - 80, 120 + (i % 3) * 20, 0, 7); x.fill(); x.fillStyle = '#ebe6da'; x.font = 'bold 120px "Noto Serif SC", serif'; x.textAlign = 'center'; x.fillText(String(i), wdt / 2, hgt / 2 + 220); x.font = '32px "IBM Plex Mono", monospace'; x.fillStyle = 'rgba(255,255,255,.55)'; x.fillText(text, wdt / 2, hgt - 100); const b = await new Promise(r => c.toBlob(r, 'image/png')); return b.arrayBuffer(); }
async function firstBoot() {
  const shortcuts = [['文件管理器', 'explorer'], ['网页浏览器', 'browser'], ['HTML编辑器', 'editor'], ['画板', 'paint'], ['计算器', 'calc'], ['V86 虚拟机', 'vm'], ['设置', 'settings']];
  for (const [n, id] of shortcuts) await fs.writeFile(`/Desktop/${n}.app`, id);
  await fs.writeFile('/Desktop/欢迎.md', `# 欢迎来到墨屿 OS\n\n这是一个运行在浏览器中的**单文件桌面操作系统**。\n\n- 所有文件保存在浏览器的 OPFS（Origin Private File System）中，刷新不丢失\n- 右键桌面可新建文件、上传、更换壁纸\n- 图标可自由拖拽摆放，支持框选多选\n- 将电脑里的文件直接拖进来即可导入；把图标拖出到电脑桌面即可导出\n- 「设置 → 本地挂载」可以把电脑上的真实文件夹挂载到 /mnt/local\n\n## 试试这些\n\n1. 打开 \`示例页面.html\` 体验 HTML 编辑器与实时预览\n2. 打开 \`/Pictures/漫画示例\` 中的任意一页进入漫画阅读器\n3. 打开 \`/Documents/示例数据.csv\` 查看表格双视图\n\n> 墨屿 · 朱砂 · 青瓷\n`);
  await fs.writeFile('/Desktop/示例页面.html', `<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>墨屿示例</title>\n  <style>\n    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, #2a1f3d, #0b0c11 60%); color: #ebe6da; font-family: 'Noto Serif SC', serif; }\n    .card { padding: 40px 50px; border: 1px solid rgba(255,255,255,.15); border-radius: 20px; backdrop-filter: blur(10px); text-align: center; }\n    h1 { letter-spacing: .4em; font-weight: 400; margin: 0 0 10px; }\n    h1 em { color: #e2542f; font-style: normal; }\n    button { background: #e2542f; color: #fff; border: 0; padding: 10px 22px; border-radius: 99px; font-size: 15px; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <div class="card">\n    <h1>墨<em>屿</em></h1>\n    <p id="t">点击按钮试试</p>\n    <button onclick="document.getElementById('t').textContent = '已点击 ' + (++n) + ' 次'">点我</button>\n  </div>\n  <script>let n = 0;<\/script>\n</body>\n</html>\n`);
  await fs.writeFile('/Documents/示例数据.csv', '城市,年份,人口(万),GDP(亿元)\n上海,2023,2487,47218\n北京,2023,2186,43761\n深圳,2023,1779,34606\n广州,2023,1883,30356\n杭州,2023,1252,20059\n成都,2023,2140,22075\n');
  await fs.writeFile('/Documents/笔记.txt', '这是一个纯文本文件。\n可以用记事本编辑并保存回 OPFS。\n');
  await fs.mkdir('/Pictures/漫画示例');
  for (let i = 1; i <= 12; i++) await fs.writeFile(`/Pictures/漫画示例/${i}.png`, await makeSampleImage('MOYU COMIC — PAGE ' + i, i));
  await fs.writeFile('/Pictures/封面.png', await makeSampleImage('COVER', 0, 1200, 750));
}
(async function boot() {
  try {
    await Meta.ready; await fs.init(); await Settings.load();
    for (const d of ['/Desktop', '/Documents', '/Pictures', '/Music', '/Videos', '/Downloads', '/System', '/System/wallpapers', '/mnt', '/mnt/local']) { try { await fs.mkdir(d); } catch { } }
    const booted = await Meta.get('booted') || Cookie.get('moyu_booted');
    if (!booted) { try { await firstBoot(); } catch (e) { console.warn(e); } await Meta.set('booted', Date.now()); Cookie.set('moyu_booted', '1'); }
    await Desktop.init();
    if (fs.backendName !== 'OPFS') UI.toast(`当前浏览器不支持 OPFS 主线程写入，已降级为 ${fs.backendName}`, 'warn', { ttl: 6000 });
    Mounts.restore();
    Bus.on('settings', k => { if (k === 'showHidden') Desktop.refresh(); });
    if (!booted) setTimeout(() => UI.toast('欢迎来到墨屿 OS — 右键桌面开始探索', 'ok', { ttl: 5000, label: '阅读指南', action: () => openPath('/Desktop/欢迎.md') }), 600);
  } catch (e) { console.error(e); UI.toast('系统初始化失败: ' + e.message, 'err', { ttl: 0 }); }
})();
