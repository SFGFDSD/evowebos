Apps.calculator = ()=>{
  const root = el('div','calc');
  const disp = el('div','calc-disp');
  const sub = el('small','','');
  const main = document.createElement('span');main.textContent='0';
  disp.append(sub,main);
  const grid = el('div','calc-grid');
  const btns = ['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
  let cur='0',prev=null,op=null,reset=false;
  btns.forEach(b=>{
    const bt = el('button','',b);
    if('÷×−+'.includes(b))bt.classList.add('op');
    if(b==='=')bt.classList.add('eq');
    if(b==='C')bt.classList.add('clr');
    bt.onclick=()=>handle(b);
    grid.appendChild(bt);
  });
  root.append(disp,grid);
  function handle(b){
    if(b==='C'){cur='0';prev=null;op=null;sub.textContent='';}
    else if(b==='⌫'){cur = cur.length>1?cur.slice(0,-1):'0';}
    else if(b==='±'){cur = cur.startsWith('-')?cur.slice(1):'-'+cur;}
    else if(b==='%'){cur = String(parseFloat(cur)/100);}
    else if('÷×−+'.includes(b)){
      if(op&&!reset){calc();}
      prev = parseFloat(cur);op=b;reset=true;
      sub.textContent = `${prev} ${b}`;
    }else if(b==='='){
      if(op){calc();op=null;sub.textContent='';}
    }else if(b==='.'){
      if(reset){cur='0';reset=false;}
      if(!cur.includes('.'))cur+='.';
    }else{
      if(reset||cur==='0'){cur=b;reset=false;}else cur+=b;
    }
    main.textContent = cur;
  }
  function calc(){
    const a=prev,b=parseFloat(cur);let r=0;
    if(op==='+')r=a+b;else if(op==='−')r=a-b;else if(op==='×')r=a*b;else if(op==='÷')r=b===0?NaN:a/b;
    cur = String(+r.toFixed(10));
    prev=r;reset=true;
  }
  WM.create({title:'计算器',app:'calc',width:280,height:400,content:root});
};

Apps.paint = ()=>{
  const root = el('div','paint');
  const tb = el('div','paint-toolbar');
  const colorInp = document.createElement('input');colorInp.type='color';colorInp.value='#141210';
  const sizeInp = document.createElement('input');sizeInp.type='range';sizeInp.min=1;sizeInp.max=50;sizeInp.value=3;
  const bClear = el('button','','清空');
  const bSave = el('button','','保存到图片');
  const bEraser = el('button','','橡皮');
  tb.append(colorInp,sizeInp,bEraser,bClear,bSave);
  const stage = el('div','paint-stage');
  const c = document.createElement('canvas');
  c.width=800;c.height=500;
  stage.appendChild(c);
  root.append(tb,stage);
  const ctx = c.getContext('2d');
  ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);
  let drawing=false, lastX=0,lastY=0, eraser=false;
  const pos = e=>{
    const r = c.getBoundingClientRect();
    const x = (e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y = (e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return {x:x*c.width/r.width, y:y*c.height/r.height};
  };
  const start = e=>{drawing=true;const p=pos(e);lastX=p.x;lastY=p.y;e.preventDefault();};
  const move = e=>{
    if(!drawing)return;
    const p = pos(e);
    ctx.strokeStyle = eraser?'white':colorInp.value;
    ctx.lineWidth = sizeInp.value;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();
    lastX=p.x;lastY=p.y;
    e.preventDefault();
  };
  const end = ()=>{drawing=false;};
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start);c.addEventListener('touchmove',move);c.addEventListener('touchend',end);
  bClear.onclick=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);};
  bEraser.onclick=()=>{eraser=!eraser;bEraser.style.background=eraser?'var(--ink)':'';bEraser.style.color=eraser?'var(--paper)':'';};
  bSave.onclick=async()=>{
    const n = await promptDialog('保存文件名','画板.png');if(!n)return;
    c.toBlob(async b=>{
      await fs.writeFile('/Pictures/'+n, b, 'image/png');
      toast('已保存到 /Pictures/'+n);
      // shortcut on desktop
      await fs.copy('/Pictures/'+n,'/Desktop/'+n);
      Desktop.render();
    });
  };
  WM.create({title:'画板',app:'paint',width:880,height:600,content:root});
};

/* ================================================================
   10.11 UNZIP
   ================================================================ */
Apps.unzip = async (path)=>{
  const name = fs.base(path);
  const target = fs.parent(path)+'/'+name.replace(/\.(zip|gz|tgz|tar)$/i,'');
  await fs.mkdir(target);
  toast('正在解压 '+name);
  try{
    const f = await fs.readFile(path);
    const buf = await f.arrayBuffer();
    if(typeof JSZip==='undefined') throw new Error('JSZip 未加载');
    const zip = await JSZip.loadAsync(buf);
    let count=0;
    for(const [rel, entry] of Object.entries(zip.files)){
      if(entry.dir){
        await fs.mkdir(target+'/'+rel);
      }else{
        const blob = await entry.async('blob');
        await fs.writeFile(target+'/'+rel, blob);
        count++;
      }
    }
    toast(`解压完成 · ${count} 个文件`);
    Apps.explorer(target);
    Desktop.render();
  }catch(e){toast('解压失败: '+e.message,'err',5000);}
};

      };

      // async usage
      fs.usage().then(u=>{

/* ================================================================
   10.13 V86
   ================================================================ */
Apps.v86 = ()=>{
  const root = el('div','v86');
  const bar = el('div','v86-bar');
  const sel = document.createElement('select');
  sel.innerHTML = `<option value="">选择系统...</option>
    <option value="freedos">FreeDOS</option>
    <option value="linux">Linux (Buildroot)</option>
    <option value="win95">Windows 95 (需下载)</option>`;
  const bStart = el('button','','启动');
  const bStop = el('button','','停止');
  const bFile = el('button','','从文件启动');
  const status = el('span');status.style.marginLeft='auto';status.style.fontFamily='var(--mono)';status.style.fontSize='10px';status.style.color='var(--ink-mute)';
  status.textContent='未启动';
  bar.append(sel,bStart,bStop,bFile,status);
  const stage = el('div','v86-stage');
  const screen = document.createElement('div');
  screen.className='screen_container';
  screen.style.display='inline-block';
  const textDiv = document.createElement('div');
  textDiv.style.cssText='white-space:pre;font:14px monospace;line-height:14px;color:#fff;background:#000;';
  const canvas = document.createElement('canvas');
  screen.append(textDiv,canvas);
  stage.appendChild(screen);
  const foot = el('div','v86-status','v86 0.5.319 · 版本锁定 · 内存 128MB');
  root.append(bar,stage,foot);

  let emulator = null;
  async function ensureLib(){
    if(window.V86) return true;
    status.textContent='正在加载 libv86.js...';
    await new Promise((res,rej)=>{
      const s = document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js';
      s.onload=res;s.onerror=rej;
      document.head.appendChild(s);
    });
    return !!window.V86;
  }

  bStart.onclick = async()=>{
    const v = sel.value;
    if(!v){toast('请选择系统','err');return;}
    try{
      await ensureLib();
      status.textContent='正在启动...';
      if(emulator){try{emulator.stop();}catch{} emulator=null;}
      const opts = {
        wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
        memory_size:128*1024*1024,
        screen_container: screen,
        bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
        vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
        autostart:true,
      };
      if(v==='freedos') opts.fda={url:'https://copy.sh/v86/images/freedos722.img'};
      else if(v==='linux') opts.hda={url:'https://copy.sh/v86/images/buildroot-bzimage.bin'};
      else if(v==='win95') opts.hda={url:'https://copy.sh/v86/images/windows95.img'};
      emulator = new V86(opts);
      status.textContent='运行中 · '+v;
    }catch(e){status.textContent='启动失败: '+e.message;toast(e.message,'err');}
  };
  bStop.onclick = ()=>{if(emulator){try{emulator.stop();}catch{}emulator=null;status.textContent='已停止';}};
  bFile.onclick = async()=>{
    const inp = document.createElement('input');inp.type='file';inp.accept='.iso,.img,.bin';
    inp.onchange = async()=>{
      const f = inp.files[0];if(!f)return;
      try{
        await ensureLib();
        status.textContent='从文件启动...';
        const ext = f.name.split('.').pop().toLowerCase();
        const mount = ext==='iso'?{cdrom:{buffer:await f.arrayBuffer()}}:(ext==='img'||ext==='bin'||ext==='fda'?{fda:{buffer:await f.arrayBuffer()}}:{hda:{buffer:await f.arrayBuffer()}});
        if(emulator){try{emulator.stop();}catch{}}
        emulator = new V86({
          wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
          memory_size:128*1024*1024,
          screen_container: screen,
          bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
          vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
          autostart:true,
          ...mount,
        });
        status.textContent='运行中 · '+f.name;
      }catch(e){toast(e.message,'err');}
    };
    inp.click();
  };

  WM.create({title:'虚拟机 · v86',app:'vm',width:760,height:540,content:root});
};

/* ================================================================
   11. WALLPAPER
   ================================================================ */
const wallpapers = [
  { name:'朱砂墨', css:`radial-gradient(circle at 30% 40%, #C8402D 0%, #8C2A1C 40%, #141210 100%)` },
  { name:'青瓷',   css:`linear-gradient(135deg, #3F5A4A 0%, #263A30 60%, #141210 100%)` },
  { name:'旧黄铜', css:`radial-gradient(ellipse at 50% 30%, #D8B872 0%, #8C6A2C 60%, #141210 100%)` },
  { name:'宣纸',   css:`linear-gradient(180deg, #EDE4D0 0%, #D8CDB0 100%)` },
  { name:'夜空',   css:`radial-gradient(ellipse at 70% 30%, #2B2A4A 0%, #0A0814 100%)` },
  { name:'墨痕',   css:`linear-gradient(120deg, #141210 0%, #2B2723 50%, #4A453B 100%)` },
];
function applyWallpaper(wp){
  const d = $('#desktop');
  if(wp.url){
    d.style.backgroundImage = `url(${wp.url})`;
  }else{
    d.style.backgroundImage = wp.css;
  }
  d.classList.add('has-wallpaper');
  try{localStorage.setItem('wallpaper',JSON.stringify(wp));}catch{}
}
$('#wallpaper-pick').addEventListener('change',async e=>{
  const f = e.target.files[0];if(!f)return;
  const buf = await f.arrayBuffer();
  await fs.writeFile('/Pictures/wallpaper_'+f.name, buf, f.type);
  // also store as base64 for wallpaper ref
  const reader = new FileReader();
  reader.onload = ()=>{
    applyWallpaper({url:reader.result});
    toast('已设为壁纸');
  };
  reader.readAsDataURL(f);
  e.target.value='';
});
function restoreWallpaper(){
  try{
    const w = JSON.parse(localStorage.getItem('wallpaper')||'null');
    if(w) applyWallpaper(w);
  }catch{}
}

(async function main(){
  try{
    await fs.init();
    await seedIfEmpty();
    restoreWallpaper();
    setupDesktopEvents();
    buildStartMenu();
    await Desktop.render();
    // hide boot
    await sleep(2000);
    const b = $('#boot');
    b.style.opacity=0;
    setTimeout(()=>b.remove(),800);

    if(!sessionStorage.getItem('welcomed')){
      setTimeout(()=>toast('硯 OS 已就绪 · 点击左下角「硯」开始'),600);
      sessionStorage.setItem('welcomed','1');
    }
  }catch(e){
    console.error(e);
    $('#boot .tagline').textContent = '启动失败：'+e.message;
  }
})();
