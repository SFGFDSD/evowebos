<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>硯 OS — Inkstone Web Desktop</title>

<!-- Fonts: 活版印刷 + 等宽 + 宋体点缀 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">

<!-- JSZip -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- CodeMirror 5 (stable CDN, simple to integrate) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/monokai.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>

<style>
/* ============================================================
   DESIGN TOKENS — 硯 · Inkstone Palette
   ============================================================ */
:root{
  --paper:#EDE4D0;
  --paper-2:#E4DAC2;
  --paper-dark:#D8CDB0;
  --ink:#141210;
  --ink-soft:#2B2723;
  --ink-mute:#6B645A;
  --vermilion:#C8402D;   /* 朱砂 */
  --vermilion-dark:#8C2A1C;
  --jade:#3F5A4A;       /* 青瓷 */
  --jade-deep:#263A30;
  --brass:#B89B5E;      /* 旧黄铜 */
  --shadow:rgba(20,18,16,.18);
  --shadow-deep:rgba(20,18,16,.38);

  --serif:'Cormorant Garamond','Noto Serif SC','Shippori Mincho',serif;
  --mono:'JetBrains Mono','Noto Serif SC',ui-monospace,monospace;
  --cn:'Noto Serif SC','Shippori Mincho',serif;

  --win-radius:2px;
  --win-chrome:34px;
  --taskbar-h:44px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--mono);font-size:13px;color:var(--ink);user-select:none;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea{font-family:inherit;color:inherit;}

/* ============================================================
   BOOT SCREEN
   ============================================================ */
#boot{
  position:fixed;inset:0;z-index:9999;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  transition:opacity .8s ease;
}
#boot .seal{
  width:120px;height:120px;border:3px solid var(--vermilion);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--cn);font-size:56px;font-weight:900;color:var(--vermilion);
  letter-spacing:-4px;
  animation:sealPulse 1.6s ease-in-out infinite;
  position:relative;
}
#boot .seal::before{
  content:'';position:absolute;inset:-10px;border:1px solid var(--vermilion);opacity:.4;
}
@keyframes sealPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
#boot .tagline{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--ink-soft);letter-spacing:1px;}
#boot .bar{width:220px;height:2px;background:var(--paper-dark);overflow:hidden;position:relative;}
#boot .bar::after{content:'';position:absolute;inset:0;background:var(--ink);animation:bootFill 2.4s ease forwards;}
@keyframes bootFill{from{transform:translateX(-100%);}to{transform:translateX(0);}}
#boot .foot{font-size:10px;color:var(--ink-mute);letter-spacing:3px;text-transform:uppercase;}

/* ============================================================
   DESKTOP
   ============================================================ */
#desktop{
  position:fixed;inset:0;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(200,64,45,.04) 0, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(63,90,74,.05) 0, transparent 50%),
    repeating-linear-gradient(45deg, transparent 0 40px, rgba(20,18,16,.012) 40px 41px);
  overflow:hidden;
}
#desktop.has-wallpaper{background-size:cover;background-position:center;background-repeat:no-repeat;}

/* Paper texture overlay */
#desktop::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(20,18,16,.025) 0, transparent 2px),
    radial-gradient(circle at 70% 80%, rgba(20,18,16,.02) 0, transparent 2px),
    radial-gradient(circle at 40% 60%, rgba(20,18,16,.015) 0, transparent 1px);
  background-size:80px 80px, 120px 120px, 50px 50px;
  mix-blend-mode:multiply;
}

/* ============================================================
   DESKTOP ICONS
   ============================================================ */
#icon-layer{position:absolute;inset:0;bottom:var(--taskbar-h);pointer-events:none;}
.dsk-icon{
  position:absolute;width:82px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;pointer-events:auto;
  border:1px dashed transparent;
  transition:transform .15s ease, background .2s ease;
  touch-action:none;
}
.dsk-icon:hover{background:rgba(255,255,255,.35);}
.dsk-icon.selected{background:rgba(200,64,45,.12);border-color:var(--vermilion);}
.dsk-icon .glyph{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);border:1px solid var(--ink-soft);
  box-shadow:2px 2px 0 var(--ink);
  position:relative;
}
.dsk-icon .glyph svg{width:26px;height:26px;}
.dsk-icon .label{
  font-family:var(--cn);font-size:11px;color:var(--ink);text-align:center;
  line-height:1.2;word-break:break-all;
  text-shadow:0 0 3px var(--paper),0 0 3px var(--paper);
  padding:0 2px;
}
.dsk-icon.dragging{opacity:.4;}
.dsk-icon.drop-target .glyph{border-color:var(--vermilion);background:rgba(200,64,45,.15);}

/* ============================================================
   SELECTION RECTANGLE
   ============================================================ */
#selrect{position:absolute;border:1px dashed var(--vermilion);background:rgba(200,64,45,.08);pointer-events:none;display:none;z-index:50;}

/* ============================================================
   TASKBAR
   ============================================================ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);
  background:var(--paper-2);border-top:1px solid var(--ink);
  display:flex;align-items:center;padding:0 10px;gap:8px;z-index:1000;
  box-shadow:0 -2px 0 var(--ink-soft);
}
#start-btn{
  width:48px;height:32px;background:var(--vermilion);color:var(--paper);
  font-family:var(--cn);font-size:18px;font-weight:900;
  border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s;
}
#start-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
#task-items{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:4px 0;}
.task-item{
  height:28px;padding:0 12px;background:var(--paper);border:1px solid var(--ink);
  display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink);
  cursor:pointer;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--cn);
}
.task-item.active{background:var(--ink);color:var(--paper);}
.task-item:hover{background:var(--paper-dark);}
.task-item svg{width:14px;height:14px;flex-shrink:0;}
#tray{display:flex;align-items:center;gap:12px;padding-left:12px;border-left:1px solid var(--ink-mute);}
#tray .clock{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.5px;}
#tray .clock small{display:block;font-size:9px;color:var(--ink-mute);font-family:var(--mono);font-weight:400;letter-spacing:2px;text-align:right;}

/* ============================================================
   START MENU
   ============================================================ */
#start-menu{
  position:fixed;bottom:calc(var(--taskbar-h) + 8px);left:10px;
  width:340px;max-height:70vh;
  background:var(--paper);border:1px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);
  display:none;flex-direction:column;z-index:1001;
  animation:menuOpen .25s cubic-bezier(.3,1.3,.5,1);
}
@keyframes menuOpen{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
#start-menu.open{display:flex;}
#start-menu .header{
  padding:14px 16px;border-bottom:1px solid var(--ink);
  font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-soft);
  display:flex;justify-content:space-between;align-items:baseline;
}
#start-menu .header small{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--vermilion);font-style:normal;}
#start-menu .list{padding:8px;overflow-y:auto;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.start-item{
  padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;
  border:1px solid transparent;transition:all .12s;
}
.start-item:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.start-item svg{width:20px;height:20px;flex-shrink:0;}
.start-item .n{font-family:var(--cn);font-size:12px;}
.start-item .d{font-size:9px;opacity:.6;font-family:var(--mono);letter-spacing:1px;}
#start-menu .footer{
  padding:8px 16px;border-top:1px solid var(--ink);
  display:flex;justify-content:space-between;font-size:10px;color:var(--ink-mute);
  letter-spacing:1px;text-transform:uppercase;
}
#start-menu .footer button{font-size:10px;color:var(--vermilion);letter-spacing:1px;text-transform:uppercase;}
#start-menu .footer button:hover{text-decoration:underline;}

/* ============================================================
   WINDOWS
   ============================================================ */
.win{
  position:absolute;min-width:280px;min-height:180px;
  background:var(--paper);border:1px solid var(--ink);
  box-shadow:6px 6px 0 var(--shadow-deep);
  display:flex;flex-direction:column;overflow:hidden;
  animation:winOpen .22s cubic-bezier(.3,1.2,.5,1);
}
@keyframes winOpen{from{transform:scale(.96) translateY(6px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.win.minimized{display:none;}
.win.maximized{border:none;box-shadow:none;}
.win-header{
  height:var(--win-chrome);background:var(--paper-2);border-bottom:1px solid var(--ink);
  display:flex;align-items:center;padding:0 6px 0 12px;gap:8px;
  cursor:move;user-select:none;flex-shrink:0;
}
.win.inactive .win-header{background:var(--paper-dark);opacity:.85;}
.win-title{flex:1;font-family:var(--cn);font-size:12px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.win-title .app-tag{font-family:var(--mono);font-size:9px;color:var(--vermilion);margin-right:6px;letter-spacing:1px;text-transform:uppercase;}
.win-ctrls{display:flex;gap:0;}
.win-ctrls button{
  width:26px;height:22px;border:1px solid var(--ink);background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink);
  margin-left:-1px;
}
.win-ctrls button:hover{background:var(--ink);color:var(--paper);}
.win-ctrls button.close:hover{background:var(--vermilion);border-color:var(--vermilion);}
.win-body{flex:1;overflow:auto;background:var(--paper);position:relative;}
.win-resize{position:absolute;z-index:5;}
.win-resize.n{top:-3px;left:6px;right:6px;height:6px;cursor:ns-resize;}
.win-resize.s{bottom:-3px;left:6px;right:6px;height:6px;cursor:ns-resize;}
.win-resize.w{left:-3px;top:6px;bottom:6px;width:6px;cursor:ew-resize;}
.win-resize.e{right:-3px;top:6px;bottom:6px;width:6px;cursor:ew-resize;}
.win-resize.nw{top:-3px;left:-3px;width:10px;height:10px;cursor:nwse-resize;}
.win-resize.ne{top:-3px;right:-3px;width:10px;height:10px;cursor:nesw-resize;}
.win-resize.sw{bottom:-3px;left:-3px;width:10px;height:10px;cursor:nesw-resize;}
.win-resize.se{bottom:-3px;right:-3px;width:10px;height:10px;cursor:nwse-resize;}

/* ============================================================
   CONTEXT MENU
   ============================================================ */
#ctx-menu{
  position:fixed;background:var(--paper);border:1px solid var(--ink);
  box-shadow:4px 4px 0 var(--shadow-deep);
  min-width:200px;z-index:10000;display:none;padding:4px;
  font-family:var(--cn);font-size:12px;
}
#ctx-menu.open{display:block;animation:menuOpen .15s ease;}
#ctx-menu .item{padding:6px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;}
#ctx-menu .item:hover{background:var(--ink);color:var(--paper);}
#ctx-menu .item.disabled{opacity:.4;pointer-events:none;}
#ctx-menu .sep{height:1px;background:var(--ink-mute);margin:4px 8px;opacity:.4;}
#ctx-menu .item .kbd{margin-left:auto;font-family:var(--mono);font-size:9px;opacity:.5;}

/* ============================================================
   APP: FILE EXPLORER
   ============================================================ */
.fe{display:flex;height:100%;font-size:12px;}
.fe-side{width:180px;border-right:1px solid var(--ink);background:var(--paper-2);overflow-y:auto;padding:8px 0;flex-shrink:0;}
.fe-side .grp{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--ink-mute);padding:6px 12px;text-transform:uppercase;}
.fe-side .node{padding:5px 12px 5px 20px;display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--cn);}
.fe-side .node:hover{background:rgba(20,18,16,.08);}
.fe-side .node.active{background:var(--ink);color:var(--paper);}
.fe-side .node svg{width:14px;height:14px;flex-shrink:0;}
.fe-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.fe-toolbar{
  padding:6px 10px;border-bottom:1px solid var(--ink);background:var(--paper-2);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.fe-toolbar button{
  padding:4px 10px;border:1px solid var(--ink);background:var(--paper);font-family:var(--cn);font-size:11px;
  display:flex;align-items:center;gap:4px;
}
.fe-toolbar button:hover{background:var(--ink);color:var(--paper);}
.fe-toolbar button:disabled{opacity:.35;}
.fe-toolbar button svg{width:12px;height:12px;}
.fe-breadcrumb{flex:1;display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:11px;min-width:150px;overflow-x:auto;white-space:nowrap;padding:0 6px;}
.fe-breadcrumb .crumb{cursor:pointer;padding:2px 4px;}
.fe-breadcrumb .crumb:hover{background:var(--ink);color:var(--paper);}
.fe-breadcrumb .sep{color:var(--ink-mute);}
.fe-search{width:140px;padding:3px 8px;border:1px solid var(--ink);background:var(--paper);font-size:11px;font-family:var(--mono);}
.fe-list{flex:1;overflow:auto;padding:6px;position:relative;}
.fe-list.view-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;align-content:start;}
.fe-list.view-list{display:block;}
.fe-item{
  padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;border:1px dashed transparent;position:relative;
}
.fe-item:hover{background:rgba(20,18,16,.05);}
.fe-item.selected{background:rgba(200,64,45,.12);border-color:var(--vermilion);}
.fe-item svg{width:32px;height:32px;}
.fe-item .n{font-family:var(--cn);font-size:11px;text-align:center;word-break:break-all;line-height:1.2;}
.fe-list.view-list .fe-item{flex-direction:row;justify-content:flex-start;gap:10px;padding:4px 10px;}
.fe-list.view-list .fe-item svg{width:18px;height:18px;}
.fe-list.view-list .fe-item .meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-mute);display:flex;gap:14px;}
.fe-list.view-grid .fe-item .meta{display:none;}
.fe-list.view-list .fe-head{
  display:flex;padding:4px 10px;border-bottom:1px solid var(--ink);font-family:var(--mono);
  font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-mute);
  background:var(--paper-2);position:sticky;top:0;
}
.fe-list.view-grid .fe-head{display:none;}
.fe-head span{cursor:pointer;}
.fe-head span:hover{color:var(--vermilion);}
.fe-head .col-name{flex:1;padding-left:28px;}
.fe-head .col-date{width:140px;}
.fe-head .col-type{width:90px;}
.fe-head .col-size{width:80px;text-align:right;}
.fe-status{padding:4px 10px;border-top:1px solid var(--ink);background:var(--paper-2);font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:1px;}

/* ============================================================
   APP: NOTEPAD / CODE EDITOR
   ============================================================ */
.np{display:flex;flex-direction:column;height:100%;}
.np-toolbar{padding:6px 10px;border-bottom:1px solid var(--ink);background:var(--paper-2);display:flex;gap:6px;align-items:center;}
.np-toolbar button{padding:3px 10px;border:1px solid var(--ink);background:var(--paper);font-family:var(--cn);font-size:11px;}
.np-toolbar button:hover{background:var(--ink);color:var(--paper);}
.np-toolbar .spacer{flex:1;}
.np-toolbar .path{font-family:var(--mono);font-size:10px;color:var(--ink-mute);}
.np-body{flex:1;position:relative;overflow:hidden;}
.np-body textarea{
  width:100%;height:100%;border:none;outline:none;resize:none;
  padding:14px;font-family:var(--mono);font-size:13px;line-height:1.6;
  background:var(--paper);color:var(--ink);
}
.np-body .CodeMirror{height:100%;font-family:var(--mono);font-size:13px;}
.np-status{padding:2px 10px;border-top:1px solid var(--ink);background:var(--paper-2);font-family:var(--mono);font-size:10px;color:var(--ink-mute);display:flex;gap:14px;}

/* HTML preview split */
.html-preview{display:flex;flex-direction:column;flex:1;min-width:0;}
.html-preview iframe{flex:1;border:none;background:white;}

/* ============================================================
   APP: IMAGE VIEWER
   ============================================================ */
.iv{display:flex;flex-direction:column;height:100%;background:var(--ink);}
.iv-toolbar{padding:6px 10px;background:var(--paper-2);border-bottom:1px solid var(--ink);display:flex;gap:6px;align-items:center;}
.iv-toolbar button{padding:3px 10px;border:1px solid var(--ink);background:var(--paper);font-family:var(--cn);font-size:11px;}
.iv-toolbar button:hover{background:var(--ink);color:var(--paper);}
.iv-toolbar .info{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-mute);}
.iv-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;}
.iv-stage img{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--paper), 4px 4px 0 var(--brass);transition:transform .2s;}

/* ============================================================
   APP: MEDIA PLAYER
   ============================================================ */
.mp{display:flex;flex-direction:column;height:100%;background:var(--ink);color:var(--paper);}
.mp-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mp-stage video,.mp-stage audio{max-width:100%;max-height:100%;}
.mp-stage audio{width:80%;}

/* ============================================================
   APP: CALCULATOR
   ============================================================ */
.calc{padding:14px;height:100%;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
.calc-disp{
  background:var(--paper-dark);border:1px solid var(--ink);padding:12px;text-align:right;
  font-family:var(--mono);font-size:28px;font-weight:700;min-height:60px;
  box-shadow:inset 2px 2px 0 rgba(0,0,0,.08);word-break:break-all;
}
.calc-disp small{display:block;font-size:11px;color:var(--ink-mute);font-weight:400;min-height:14px;}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-grid button{border:1px solid var(--ink);background:var(--paper-2);font-family:var(--serif);font-size:20px;font-weight:600;transition:transform .08s;}
.calc-grid button:hover{background:var(--ink);color:var(--paper);}
.calc-grid button:active{transform:translate(1px,1px);}
.calc-grid button.op{background:var(--brass);color:var(--paper);}
.calc-grid button.eq{background:var(--vermilion);color:var(--paper);grid-column:span 1;}
.calc-grid button.clr{background:var(--ink);color:var(--paper);}

/* ============================================================
   APP: PAINT
   ============================================================ */
.paint{display:flex;flex-direction:column;height:100%;}
.paint-toolbar{padding:6px 10px;border-bottom:1px solid var(--ink);background:var(--paper-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.paint-toolbar button,.paint-toolbar label{padding:3px 10px;border:1px solid var(--ink);background:var(--paper);font-family:var(--cn);font-size:11px;cursor:pointer;}
.paint-toolbar button:hover{background:var(--ink);color:var(--paper);}
.paint-toolbar input[type=color]{width:24px;height:22px;border:1px solid var(--ink);padding:0;background:transparent;cursor:pointer;}

.paint-stage{flex:1;overflow:auto;background:var(--paper-dark);display:flex;align-items:center;justify-content:center;padding:20px;}
.paint-stage canvas{background:white;box-shadow:4px 4px 0 var(--ink);cursor:crosshair;touch-action:none;}

/* ============================================================
   APP: SETTINGS
   ============================================================ */
.settings{display:flex;height:100%;font-size:12px;}
.set-side{width:180px;border-right:1px solid var(--ink);background:var(--paper-2);padding:8px 0;}
.set-side .item{padding:8px 14px;cursor:pointer;font-family:var(--cn);}
.set-side .item:hover{background:rgba(20,18,16,.08);}

.set-main{flex:1;overflow-y:auto;padding:20px;}
.set-main h2{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:4px;}
.set-main .sub{font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;}
.set-card{border:1px solid var(--ink);padding:14px;margin-bottom:14px;background:var(--paper-2);}
.set-card h3{font-family:var(--cn);font-size:13px;margin-bottom:10px;border-bottom:1px dashed var(--ink-mute);padding-bottom:6px;}
.set-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.set-row label{flex:0 0 120px;font-family:var(--mono);font-size:11px;color:var(--ink-mute);}

.set-btn.danger{background:var(--vermilion);color:var(--paper);border-color:var(--vermilion);}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
.wp-item{aspect-ratio:16/10;border:1px solid var(--ink);cursor:pointer;position:relative;overflow:hidden;}
.wp-item.active{border-color:var(--vermilion);box-shadow:0 0 0 2px var(--vermilion);}
.storage-bar{height:14px;background:var(--paper);border:1px solid var(--ink);position:relative;overflow:hidden;}
.storage-seg{position:absolute;top:0;bottom:0;transition:left .5s, width .5s;}
.storage-seg.app{background:var(--vermilion);}
.storage-seg.doc{background:var(--jade);}
.storage-seg.img{background:var(--brass);}
.storage-seg.other{background:var(--ink-soft);}
.storage-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10px;}
.storage-legend span::before{content:'';display:inline-block;width:10px;height:10px;margin-right:4px;border:1px solid var(--ink);vertical-align:middle;}
.storage-legend .app::before{background:var(--vermilion);}
.storage-legend .doc::before{background:var(--jade);}
.storage-legend .img::before{background:var(--brass);}
.storage-legend .other::before{background:var(--ink-soft);}

   APP: BROWSER
   ============================================================ */
.wb{display:flex;flex-direction:column;height:100%;}

.wb-bar button{padding:3px 10px;border:1px solid var(--ink);background:var(--paper);font-family:var(--cn);font-size:11px;}
.wb-bar button:hover{background:var(--ink);color:var(--paper);}
.wb-bar input{flex:1;padding:4px 10px;border:1px solid var(--ink);background:var(--paper);font-family:var(--mono);font-size:11px;}

.ss-body textarea{width:100%;height:100%;border:none;outline:none;padding:10px;font-family:var(--mono);font-size:12px;background:var(--paper);resize:none;}

/* ============================================================
   APP: V86
   ============================================================ */
.v86{display:flex;flex-direction:column;height:100%;background:#1a1a1a;}

/* ============================================================
   TOAST / DIALOG
   ============================================================ */
#toast-layer{position:fixed;top:20px;right:20px;z-index:10001;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{
  background:var(--paper);border:1px solid var(--ink);padding:10px 16px;

<script>
/* ================================================================

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;};
const escapeHtml = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b=>{if(b==null||isNaN(b))return'—';const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<u.length-1){b/=1024;i++;}return b.toFixed(b<10&&i>0?1:0)+' '+u[i];};
const fmtDate = d=>{if(!d)return'—';const dt=new Date(d);const p=n=>String(n).padStart(2,'0');return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;};
const uid = ()=>'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const sleep = ms=>new Promise(r=>setTimeout(r,ms));

function toast(msg,type='ok',ms=3000){
  const t=el('div','toast '+type,msg);
  $('#toast-layer').appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(40px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},ms);
}

function modal({title,body,buttons=['取消','确定']}){
  return new Promise(resolve=>{
    const m=$('#modal');
    m.innerHTML='';
    m.appendChild(el('div','modal-head',title));
    const b=el('div','modal-body');
    if(typeof body==='string')b.innerHTML=body;else b.appendChild(body);
    m.appendChild(b);
    const f=el('div','modal-foot');
    buttons.forEach((txt,i)=>{
      const btn=el('button',i===buttons.length-1?'primary':'',txt);
      btn.onclick=()=>{$('#modal-layer').classList.remove('open');resolve(i);};
      f.appendChild(btn);
    });
    m.appendChild(f);
    $('#modal-layer').classList.add('open');
  });
}
function promptDialog(title,def=''){
  return new Promise(resolve=>{
    const body=document.createElement('div');
    body.textContent=title;
    const inp=document.createElement('input');inp.value=def;
    body.appendChild(inp);
    modal({title:'输入',body,buttons:['取消','确定']}).then(r=>{
      resolve(r===1?inp.value:null);
    });
    setTimeout(()=>inp.focus(),50);
  });
}

function iconFor(name, isDir){
  if(isDir) return ICONS.folder;
  const ext = (name.split('.').pop()||'').toLowerCase();
  if(['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'].includes(ext)) return ICONS.image;
  if(['mp4','webm','ogv','mov','mkv'].includes(ext)) return ICONS.video;
  if(['mp3','wav','ogg','flac','aac','m4a'].includes(ext)) return ICONS.audio;
  if(['pdf'].includes(ext)) return ICONS.pdf;
  if(['zip','gz','tar','tgz','7z','rar'].includes(ext)) return ICONS.zip;
  if(['csv','tsv'].includes(ext)) return ICONS.table;
  if(['html','htm','css','js','json','xml','py','c','cpp','java','ts'].includes(ext)) return ICONS.code;
  if(['md','yaml','yml','log','txt'].includes(ext)) return ICONS.text;
  return ICONS.file;
}

/* ================================================================
   2. VIRTUAL FILESYSTEM (OPFS + IndexedDB fallback + Mounts)
   ================================================================ */
const fs = (()=>{
  let opfsRoot = null;
  let opfsAvailable = false;
  // In-memory metadata tree (also persisted via localStorage)
  // Structure: { path: { kind:'dir'|'file', size, mtime, mime } }
  let meta = {};
  const mounts = {}; // { '/mnt/local/name': { handle, name } }

  const norm = p=>{p=String(p||'/');if(!p.startsWith('/'))p='/'+p;p=p.replace(/\/+/g,'/');if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);return p;};
  const parent = p=>{p=norm(p);if(p==='/')return '/';const i=p.lastIndexOf('/');return i===0?'/':p.slice(0,i);};
  const base = p=>{p=norm(p);if(p==='/')return '/';return p.slice(p.lastIndexOf('/')+1);};

  async function init(){
    try{
      if(navigator.storage && navigator.storage.getDirectory){
        opfsRoot = await navigator.storage.getDirectory();
        opfsAvailable = true;
        console.log('[fs] OPFS available');
      }else{
        console.warn('[fs] OPFS not available, falling back to IndexedDB');
      }
    }catch(e){console.warn('[fs] OPFS init failed:',e);}
    // Load meta
    try{
      const raw = localStorage.getItem('vfs.meta');
      if(raw) meta = JSON.parse(raw);
    }catch(e){}
    if(!meta['/']) meta['/']={kind:'dir',mtime:Date.now()};
    // Seed default folders
    await ensureDir('/Desktop');
    await ensureDir('/Documents');
    await ensureDir('/Pictures');
    await ensureDir('/Music');
    await ensureDir('/mnt');
    await ensureDir('/mnt/local');
  }

  function saveMeta(){
    try{localStorage.setItem('vfs.meta',JSON.stringify(meta));}catch(e){}
  }

  // --- OPFS helpers ---
  async function walkCreate(path){
    // Returns the FileSystemHandle for the given path, creating dirs along the way
    const parts = norm(path).split('/').filter(Boolean);
    let h = opfsRoot;
    for(let i=0;i<parts.length;i++){
      const isLast = i===parts.length-1;
      const segment = parts[i];
      const entryMeta = meta[norm('/'+parts.slice(0,i+1).join('/'))];
      if(isLast){
        return h;
      }else{
        h = await h.getDirectoryHandle(segment,{create:true});
      }
    }
    return h;
  }
  async function getDirHandle(path,create=false){
    const parts = norm(path).split('/').filter(Boolean);
    let h = opfsRoot;
    for(const seg of parts){
      h = await h.getDirectoryHandle(seg,{create});
    }
    return h;
  }

  // --- Mount handling ---
  function isMountPath(path){
    const p=norm(path);
    for(const mp of Object.keys(mounts)){
      if(p===mp||p.startsWith(mp+'/')) return mp;
    }
    return null;
  }

  async function mountLocal(name, dirHandle){
    const mp = norm('/mnt/local/'+name);
    mounts[mp] = { handle:dirHandle, name };
    meta[mp] = { kind:'dir', mtime:Date.now(), mount:true };
    saveMeta();
    toast(`已挂载 ${name}`,'ok');
    return mp;
  }
  async function unmountLocal(mp){
    delete mounts[mp];
    // recursively remove meta
    Object.keys(meta).forEach(k=>{if(k===mp||k.startsWith(mp+'/'))delete meta[k];});
    saveMeta();
    toast(`已卸载 ${mp}`,'ok');
  }

  // --- Public API ---
  async function ensureDir(path){
    path=norm(path);
    if(meta[path]) return;
    // ensure parents
    const p = parent(path);
    if(p!==path) await ensureDir(p);
    if(opfsAvailable && !isMountPath(path)){
      try{await getDirHandle(path,true);}catch(e){}
    }
    meta[path] = { kind:'dir', mtime:Date.now() };
    saveMeta();
  }

  async function stat(path){
    path=norm(path);
    const mp = isMountPath(path);
    if(mp && path!==mp){
      // stat a file/dir inside mount
      const rel = path.slice(mp.length+1);
      const mnt = mounts[mp];
      const parts = rel.split('/').filter(Boolean);
      let h = mnt.handle;
      try{
        for(let i=0;i<parts.length-1;i++){
          h = await h.getDirectoryHandle(parts[i]);
        }
        const last = parts[parts.length-1];
        try{
          const fh = await h.getFileHandle(last);
          const f = await fh.getFile();
          return { path, kind:'file', size:f.size, mtime:f.lastModified, mime:f.type };
        }catch{
          const dh = await h.getDirectoryHandle(last);
          return { path, kind:'dir', mtime:Date.now() };
        }
      }catch(e){throw new Error('ENOENT: '+path);}
    }
    if(meta[path]){
      const m = {...meta[path], path};
      // refresh size for files from OPFS
      if(m.kind==='file' && opfsAvailable){
        try{
          const dh = await getDirHandle(parent(path));
          const fh = await dh.getFileHandle(base(path));
          const f = await fh.getFile();
          m.size = f.size; m.mtime = f.lastModified;
        }catch(e){}
      }
      return m;
    }
    if(path==='/')return {path:'/',kind:'dir',mtime:Date.now()};
    throw new Error('ENOENT: '+path);
  }

  async function exists(path){
    try{await stat(path);return true;}catch{return false;}
  }

  async function readdir(path){
    path=norm(path);
    const mp = isMountPath(path);
    if(mp){
      // list from mount
      const rel = path===mp ? '' : path.slice(mp.length+1);
      const mnt = mounts[mp];
      let h = mnt.handle;
      if(rel){
        const parts = rel.split('/').filter(Boolean);
        for(const seg of parts) h = await h.getDirectoryHandle(seg);
      }
      const out=[];
      for await (const [name,hh] of h.entries()){
        if(hh.kind==='file'){
          const f = await hh.getFile();
          out.push({ name, kind:'file', size:f.size, mtime:f.lastModified, mime:f.type, path:norm(path+'/'+name) });
        }else{
          const cp = norm(path+'/'+name);
          if(!meta[cp]) meta[cp]={kind:'dir',mtime:Date.now(),mount:true};
          out.push({ name, kind:'dir', mtime:Date.now(), path:cp });
        }
      }
      saveMeta();
      return out;
    }
    // OPFS / virtual
    const entries = {};
    // from meta
    for(const k of Object.keys(meta)){
      const pr = parent(k);
      if(pr===path && k!==path){
        entries[base(k)] = { ...meta[k], name:base(k), path:k };
      }
    }
    // from OPFS
    if(opfsAvailable && path!=='/mnt' && !path.startsWith('/mnt/')){
      try{
        const dh = path==='/' ? opfsRoot : await getDirHandle(path);
        for await (const [name,hh] of dh.entries()){
          if(!entries[name]){
            const cp = norm(path+'/'+name);
            if(hh.kind==='file'){
              try{
                const f = await hh.getFile();
                entries[name] = { name, kind:'file', size:f.size, mtime:f.lastModified, mime:f.type, path:cp };
                meta[cp] = { kind:'file', size:f.size, mtime:f.lastModified, mime:f.type };
              }catch(e){}
            }else{
              entries[name] = { name, kind:'dir', mtime:Date.now(), path:cp };
              meta[cp] = { kind:'dir', mtime:Date.now() };
            }
          }
        }
        saveMeta();
      }catch(e){}
    }
    return Object.values(entries);
  }

  async function readFile(path){
    path=norm(path);
    const mp = isMountPath(path);
    if(mp){
      const rel = path.slice(mp.length+1);
      const mnt = mounts[mp];
      const parts = rel.split('/').filter(Boolean);
      let h = mnt.handle;
      for(let i=0;i<parts.length-1;i++) h = await h.getDirectoryHandle(parts[i]);
      const fh = await h.getFileHandle(parts[parts.length-1]);
      return await fh.getFile();
    }
    if(!opfsAvailable) throw new Error('OPFS unavailable');
    const dh = await getDirHandle(parent(path));
    const fh = await dh.getFileHandle(base(path));
    return await fh.getFile();
  }

  async function readFileAsText(path){
    const f = await readFile(path);
    return await f.text();
  }

  async function writeFile(path, data, mime){
    path=norm(path);
    const mp = isMountPath(path);
    if(mp){
      const rel = path.slice(mp.length+1);
      const mnt = mounts[mp];
      const parts = rel.split('/').filter(Boolean);
      let h = mnt.handle;
      for(let i=0;i<parts.length-1;i++) h = await h.getDirectoryHandle(parts[i],{create:true});
      const fh = await h.getFileHandle(parts[parts.length-1],{create:true});
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
      meta[path] = { kind:'file', size:typeof data==='string'?data.length:(data.size||data.byteLength||0), mtime:Date.now(), mime };
      saveMeta();
      return;
    }
    if(!opfsAvailable){
      // fallback: store as base64 in meta
      let b64;
      if(typeof data==='string'){
        b64 = btoa(unescape(encodeURIComponent(data)));
      }else{
        const buf = data instanceof ArrayBuffer ? data : await new Blob([data]).arrayBuffer();
        const bytes = new Uint8Array(buf);
        let str='';for(let i=0;i<bytes.length;i++)str+=String.fromCharCode(bytes[i]);
        b64 = btoa(str);
      }
      await ensureDir(parent(path));
      meta[path] = { kind:'file', size:typeof data==='string'?data.length:(data.size||data.byteLength||0), mtime:Date.now(), mime, _b64:b64 };
      saveMeta();
      return;
    }
    await ensureDir(parent(path));
    const dh = await getDirHandle(parent(path));
    const fh = await dh.getFileHandle(base(path),{create:true});
    const w = await fh.createWritable();
    await w.write(data);
    await w.close();
    meta[path] = { kind:'file', size:typeof data==='string'?data.length:(data.size||data.byteLength||0), mtime:Date.now(), mime };
    saveMeta();
  }

  async function mkdir(path){
    await ensureDir(path);
  }

  async function unlink(path){
    path=norm(path);
    const mp = isMountPath(path);
    if(mp){
      const rel = path.slice(mp.length+1);
      const mnt = mounts[mp];
      const parts = rel.split('/').filter(Boolean);
      let h = mnt.handle;
      for(let i=0;i<parts.length-1;i++) h = await h.getDirectoryHandle(parts[i]);
      await h.removeEntry(parts[parts.length-1],{recursive:true});
    }else if(opfsAvailable){
      try{
        const s = await stat(path);
        if(s.kind==='dir'){
          const dh = await getDirHandle(parent(path));
          await dh.removeEntry(base(path),{recursive:true});
        }else{
          const dh = await getDirHandle(parent(path));
          await dh.removeEntry(base(path));
        }
      }catch(e){}
    }
    // remove meta subtree
    Object.keys(meta).forEach(k=>{if(k===path||k.startsWith(path+'/'))delete meta[k];});
    saveMeta();
  }

  async function rename(src, dst){
    // OPFS doesn't have native rename — copy + delete
    const s = await stat(src);
    if(s.kind==='dir'){
      await copyDir(src,dst);
      await unlink(src);
    }else{
      const data = await readFile(src);
      await writeFile(dst, data, s.mime);
      await unlink(src);
    }
  }

  async function copyDir(src, dst){
    await ensureDir(dst);
    const items = await readdir(src);
    for(const it of items){
      const sp = norm(src+'/'+it.name);
      const dp = norm(dst+'/'+it.name);
      if(it.kind==='dir') await copyDir(sp,dp);
      else{
        const data = await readFile(sp);
        await writeFile(dp, data, it.mime);
      }
    }
  }

  async function copy(src, dst){
    const s = await stat(src);
    if(s.kind==='dir') await copyDir(src,dst);
    else{
      const data = await readFile(src);
      await writeFile(dst, data, s.mime);
    }
  }

  // Storage usage
  async function usage(){
    let total=0, used=0, breakdown={app:0,doc:0,img:0,other:0};
    try{
      if(navigator.storage && navigator.storage.estimate){
        const e = await navigator.storage.estimate();
        total = e.quota||0; used = e.usage||0;
      }
    }catch(e){}
    // classify meta
    for(const k of Object.keys(meta)){
      const m = meta[k];
      if(m.kind!=='file')continue;
      const ext = (k.split('.').pop()||'').toLowerCase();
      const sz = m.size||0;
      if(['png','jpg','jpeg','gif','webp','bmp','svg','avif'].includes(ext)) breakdown.img += sz;
      else if(['html','js','css','json','py','xml'].includes(ext)) breakdown.app += sz;
      else if(['txt','md','csv','tsv'].includes(ext)) breakdown.doc += sz;
      else breakdown.other += sz;
    }
    return {total,used,breakdown};
  }

  async function reset(){
    if(opfsAvailable){
      try{
        for await (const [name] of opfsRoot.entries()){
          await opfsRoot.removeEntry(name,{recursive:true});
        }
      }catch(e){}
    }
    meta = {'/':{kind:'dir',mtime:Date.now()}};
    saveMeta();
    localStorage.removeItem('vfs.meta');
    localStorage.removeItem('wallpaper');
    await ensureDir('/Desktop');
    await ensureDir('/Documents');
    await ensureDir('/Pictures');
    await ensureDir('/Music');
    await ensureDir('/mnt/local');
  }

  return {
    init, norm, parent, base, stat, exists, readdir, readFile, readFileAsText,
    writeFile, mkdir, unlink, rename, copy, ensureDir, mountLocal, unmountLocal,
    isMountPath, getMounts:()=>({...mounts}), usage, reset,
    get opfsAvailable(){return opfsAvailable;}
  };
})();
window.fs = fs;

/* ================================================================
   3. WINDOW MANAGER
   ================================================================ */
const WM = (()=>{
  let zTop = 100;
  const wins = new Map(); // id -> {el, state, app}
  let activeId = null;

  function create({title, icon, width=560, height=400, content, app, onClose}){
    const id = uid();
    const w = el('div','win');
    w.dataset.id = id;
    // Position staggered
    const cx = Math.max(20, (window.innerWidth-width)/2 + (wins.size%6)*24);
    const cy = Math.max(20, (window.innerHeight-height-60)/2 + (wins.size%6)*24);
    w.style.left = cx+'px';
    w.style.top = cy+'px';
    w.style.width = width+'px';
    w.style.height = height+'px';
    w.style.zIndex = ++zTop;

    const header = el('div','win-header');
    const t = el('div','win-title');
    t.innerHTML = `<span class="app-tag">${app||''}</span>${escapeHtml(title)}`;
    header.appendChild(t);
    const ctrls = el('div','win-ctrls');
    const bMin = el('button','','_');bMin.title='最小化';
    const bMax = el('button','','◻');bMax.title='最大化';
    const bCls = el('button','close','✕');bCls.title='关闭';
    ctrls.append(bMin,bMax,bCls);
    header.appendChild(ctrls);
    const body = el('div','win-body');
    if(content instanceof Node) body.appendChild(content);
    else if(content) body.innerHTML = content;
    w.append(header,body);
    // resize handles
    ['n','s','w','e','nw','ne','sw','se'].forEach(d=>{
      const h = el('div','win-resize '+d);
      h.dataset.dir = d;
      w.appendChild(h);
    });
    document.body.appendChild(w);

    const state = { id, el:w, title, app, minimized:false, maximized:false, prev:null };
    wins.set(id, state);

    // focus
    const focus = ()=>{
      if(activeId===id) { w.style.zIndex = ++zTop; return; }
      wins.forEach(s=>s.el.classList.add('inactive'));
      w.classList.remove('inactive');
      w.style.zIndex = ++zTop;
      activeId = id;
      renderTaskbar();
    };
    w.addEventListener('mousedown', focus, true);
    w.addEventListener('touchstart', focus, {passive:true, capture:true});
    focus();

    // drag header
    let drag=null;
    const startDrag = (cx,cy)=>{
      if(state.maximized) return;
      const r = w.getBoundingClientRect();
      drag = { dx:cx-r.left, dy:cy-r.top };
    };
    header.addEventListener('mousedown',e=>{if(e.target===header||e.target===t||t.contains(e.target))startDrag(e.clientX,e.clientY);});
    header.addEventListener('touchstart',e=>{if(e.touches.length===1)startDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    header.addEventListener('dblclick',()=>toggleMax());

    // resize
    let resize=null;
    w.querySelectorAll('.win-resize').forEach(h=>{
      const start = (cx,cy)=>{
        if(state.maximized) return;
        const r = w.getBoundingClientRect();
        resize = { dir:h.dataset.dir, sx:cx, sy:cy, sw:r.width, sh:r.height, sl:r.left, st:r.top };
      };
      h.addEventListener('mousedown',e=>{e.stopPropagation();start(e.clientX,e.clientY);});
      h.addEventListener('touchstart',e=>{e.stopPropagation();if(e.touches.length===1)start(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    });

    const onMove = (cx,cy)=>{
      if(drag){
        let nx = cx - drag.dx, ny = cy - drag.dy;
        nx = Math.max(-w.offsetWidth+80, Math.min(window.innerWidth-40, nx));
        ny = Math.max(0, Math.min(window.innerHeight-60, ny));
        w.style.left = nx+'px';
        w.style.top = ny+'px';
      }
      if(resize){
        const dx = cx - resize.sx, dy = cy - resize.sy;
        let {sw,sh,sl,st,dir} = resize;
        let nw=sw, nh=sh, nl=sl, nt=st;
        if(dir.includes('e')) nw = Math.max(280, sw+dx);
        if(dir.includes('s')) nh = Math.max(180, sh+dy);
        if(dir.includes('w')){ nw = Math.max(280, sw-dx); nl = sl + (sw-nw); }
        if(dir.includes('n')){ nh = Math.max(180, sh-dy); nt = st + (sh-nh); }
        w.style.width=nw+'px';w.style.height=nh+'px';w.style.left=nl+'px';w.style.top=nt+'px';
      }
    };
    const onUp = ()=>{ drag=null; resize=null; };
    document.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
    document.addEventListener('touchmove',e=>{if(e.touches.length===1)onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    document.addEventListener('mouseup',onUp);
    document.addEventListener('touchend',onUp);

    // controls
    bMin.onclick = ()=>{ state.minimized = true; w.classList.add('minimized'); if(activeId===id){activeId=null;} renderTaskbar(); };
    bMax.onclick = ()=>toggleMax();
    bCls.onclick = async ()=>{
      if(onClose){ const r = await onClose(); if(r===false) return; }
      w.remove();
      wins.delete(id);
      if(activeId===id) activeId=null;
      renderTaskbar();
    };

    function toggleMax(){
      if(state.maximized){
        const p = state.prev;
        w.style.left=p.left;w.style.top=p.top;w.style.width=p.width;w.style.height=p.height;
        w.classList.remove('maximized');
        state.maximized=false;
      }else{
        state.prev = {left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height};
        w.style.left='0px';w.style.top='0px';
        w.style.width='100vw';
        w.style.height=`calc(100vh - var(--taskbar-h))`;
        w.classList.add('maximized');
        state.maximized=true;
      }
    }

    renderTaskbar();
    return { id, el:w, body, focus, close:()=>bCls.click(), setTitle:(newT)=>{state.title=newT;t.innerHTML=`<span class="app-tag">${app||''}</span>${escapeHtml(newT)}`;renderTaskbar();} };
  }

  function renderTaskbar(){
    const c = $('#task-items');
    c.innerHTML='';
    wins.forEach(s=>{
      const t = el('div','task-item'+(activeId===s.id&&!s.minimized?' active':''));
      t.innerHTML = (ICONS[s.app]||ICONS.file) + `<span class="t-text">${escapeHtml(s.title)}</span>`;
      t.onclick = ()=>{
        if(s.minimized){ s.minimized=false; s.el.classList.remove('minimized'); }
        if(activeId===s.id && !s.minimized){ s.minimized=true; s.el.classList.add('minimized'); activeId=null; renderTaskbar(); return;}
        s.el.style.zIndex = ++zTop;
        activeId = s.id;
        wins.forEach(x=>x.el.classList.add('inactive'));
        s.el.classList.remove('inactive');
        renderTaskbar();
      };
      c.appendChild(t);
    });
  }

  function all(){return [...wins.values()];}

  return { create, renderTaskbar, all };
})();

/* ================================================================
   4. CONTEXT MENU
   ================================================================ */
const CtxMenu = (()=>{
  const m = $('#ctx-menu');
  function show(x,y,items){
    m.innerHTML='';
    items.forEach(it=>{
      if(it==='-'){m.appendChild(el('div','sep'));return;}
      const d = el('div','item'+(it.disabled?' disabled':''));
      d.innerHTML = (it.icon||'') + `<span>${escapeHtml(it.label)}</span>` + (it.kbd?`<span class="kbd">${it.kbd}</span>`:'');
      if(it.icon) d.querySelector('svg')&&(d.querySelector('svg').style.width='14px', d.querySelector('svg').style.height='14px');
      d.onclick = ()=>{ hide(); it.action&&it.action(); };
      m.appendChild(d);
    });
    // position
    m.classList.add('open');
    const r = m.getBoundingClientRect();
    let nx = x, ny = y;
    if(x + r.width > window.innerWidth) nx = window.innerWidth - r.width - 4;
    if(y + r.height > window.innerHeight) ny = window.innerHeight - r.height - 4;
    m.style.left = Math.max(0,nx)+'px';
    m.style.top = Math.max(0,ny)+'px';
  }
  function hide(){ m.classList.remove('open'); }
  document.addEventListener('click',e=>{ if(!m.contains(e.target)) hide(); });
  window.addEventListener('blur',hide);
  return { show, hide };
})();

/* ================================================================
   5. DESKTOP ICONS
   ================================================================ */
const Desktop = (()=>{
  const layer = $('#icon-layer');
  const positions = {}; // name -> {x,y}
  const selected = new Set();
  // Drag cache for HTML5 drag-out
  const dragCache = new Map(); // path -> {blob, url}
  let dragSrc = null;

  function loadPositions(){
    try{const r=localStorage.getItem('dsk.pos');if(r)Object.assign(positions,JSON.parse(r));}catch{}
  }
  function savePositions(){try{localStorage.setItem('dsk.pos',JSON.stringify(positions));}catch{}}

  async function render(){
    layer.innerHTML='';
    loadPositions();
    const items = await fs.readdir('/Desktop');
    items.forEach((it,idx)=>{
      const pos = positions[it.name] || { x: 20 + (idx%Math.max(1,Math.floor((window.innerWidth-40)/92)))*92, y: 20 + Math.floor(idx/Math.max(1,Math.floor((window.innerWidth-40)/92)))*96 };
      positions[it.name] = pos;
      const d = el('div','dsk-icon');
      d.style.left = pos.x+'px';
      d.style.top = pos.y+'px';
      d.dataset.path = '/Desktop/'+it.name;
      d.dataset.name = it.name;
      d.dataset.isDir = it.kind==='dir'?'1':'0';
      d.draggable = true;
      d.innerHTML = `<div class="glyph">${iconFor(it.name, it.kind==='dir')}</div><div class="label">${escapeHtml(it.name)}</div>`;
      // click / dblclick
      let clickTimer=null, clickCount=0;
      d.addEventListener('click',e=>{
        e.stopPropagation();
        selectOnly(it.name, e.ctrlKey||e.metaKey);
        clickCount++;
        if(clickCount===1){
          clickTimer = setTimeout(()=>{clickCount=0;},300);
        }else if(clickCount>=2){
          clearTimeout(clickTimer);clickCount=0;
          openItem('/Desktop/'+it.name);
        }
      });
      // context menu
      d.addEventListener('contextmenu',e=>{
        e.preventDefault();e.stopPropagation();
        if(!selected.has(it.name)) selectOnly(it.name,false);
        showItemContext(e.clientX,e.clientY);
      });
      // drag start (HTML5 native)
      d.addEventListener('dragstart',e=>{
        dragSrc = it;
        d.classList.add('dragging');
        e.dataTransfer.effectAllowed='copyMove';
        // internal marker
        e.dataTransfer.setData('application/x-inkstone-path','/Desktop/'+it.name);
        // cache must have been pre-loaded; synchronous read
        const cached = dragCache.get('/Desktop/'+it.name);
        if(cached && cached.file){
          try{
            e.dataTransfer.items.add(cached.file);
            const url = cached.url || (cached.url = URL.createObjectURL(cached.file));
            const mt = cached.file.type || 'application/octet-stream';
            e.dataTransfer.setData('DownloadURL', `${mt}:${it.name}:${url}`);
          }catch(err){console.warn(err);}
        }
      });
      d.addEventListener('dragend',()=>{
        d.classList.remove('dragging');
        dragSrc=null;
        $$('.dsk-icon.drop-target').forEach(x=>x.classList.remove('drop-target'));
        // revoke URLs after 5s
        setTimeout(()=>{
          dragCache.forEach(v=>{ if(v.url){try{URL.revokeObjectURL(v.url);}catch{} v.url=null;} });
          dragCache.clear();
        },5000);
      });
      // dragover to allow reposition / folder drop
      d.addEventListener('dragover',e=>{
        if(it.kind==='dir' && dragSrc && dragSrc.name!==it.name){
          e.preventDefault();
          d.classList.add('drop-target');
        }
      });
      d.addEventListener('dragleave',()=>d.classList.remove('drop-target'));
      d.addEventListener('drop',async e=>{
        e.preventDefault();e.stopPropagation();
        d.classList.remove('drop-target');
        if(it.kind==='dir' && dragSrc && dragSrc.name!==it.name){
          try{
            await fs.rename('/Desktop/'+dragSrc.name, '/Desktop/'+it.name+'/'+dragSrc.name);
            toast(`移动 ${dragSrc.name}`);
            render();
          }catch(err){toast(err.message,'err');}
        }
      });
      // preload file data on hover (for drag-out)
      d.addEventListener('mouseenter', async ()=>{
        if(it.kind==='file' && !dragCache.has('/Desktop/'+it.name)){
          try{
            const f = await fs.readFile('/Desktop/'+it.name);
            dragCache.set('/Desktop/'+it.name, { file: new File([f], it.name, {type:f.type||'application/octet-stream'}) });
          }catch(e){}
        }
      });

      // Touch drag for mobile
      let touchDrag=null;
      d.addEventListener('touchstart',e=>{
        if(e.touches.length!==1)return;
        const t = e.touches[0];
        touchDrag = { startX:t.clientX, startY:t.clientY, moved:false, origX:pos.x, origY:pos.y };
      },{passive:true});
      d.addEventListener('touchmove',e=>{
        if(!touchDrag)return;
        const t = e.touches[0];
        const dx = t.clientX-touchDrag.startX, dy = t.clientY-touchDrag.startY;
        if(Math.abs(dx)>6||Math.abs(dy)>6) touchDrag.moved=true;
        if(touchDrag.moved){
          e.preventDefault();
          d.style.left=(touchDrag.origX+dx)+'px';
          d.style.top=(touchDrag.origY+dy)+'px';
        }
      },{passive:false});
      d.addEventListener('touchend',()=>{
        if(touchDrag && touchDrag.moved){
          const nx = parseInt(d.style.left), ny = parseInt(d.style.top);
          positions[it.name] = {x:nx,y:ny};
          savePositions();
        }
        touchDrag=null;
      });

      layer.appendChild(d);
    });
    savePositions();
  }

  function selectOnly(name, add){
    if(!add){
      selected.clear();
      $$('.dsk-icon.selected').forEach(x=>x.classList.remove('selected'));
    }
    selected.add(name);
    const e = $(`.dsk-icon[data-name="${CSS.escape(name)}"]`);
    if(e)e.classList.add('selected');
  }
  function clearSelection(){
    selected.clear();
    $$('.dsk-icon.selected').forEach(x=>x.classList.remove('selected'));
  }

  function showItemContext(x,y){
    const names = [...selected];
    CtxMenu.show(x,y,[
      {label:'打开',icon:ICONS.folder,action:()=>openItem('/Desktop/'+names[0])},
      {label:'在资源管理器中显示',icon:ICONS.explorer,action:()=>Apps.explorer('/Desktop')},
      '-',
      {label:'重命名',icon:ICONS.rename,action:()=>renameDesktop(names[0])},
      {label:'删除',icon:ICONS.trash,action:async()=>{
        if(await modal({title:'确认删除',body:`删除 ${names.length} 项？`,buttons:['取消','删除']})===1){
          for(const n of names){try{await fs.unlink('/Desktop/'+n);}catch{}}
          render();
        }
      }},
      '-',
      {label:'下载',icon:ICONS.download,action:()=>{names.forEach(n=>downloadFile('/Desktop/'+n));}},
    ]);
  }

  async function renameDesktop(name){
    const nn = await promptDialog('新名称',name);
    if(!nn||nn===name)return;
    try{await fs.rename('/Desktop/'+name,'/Desktop/'+nn);render();}
    catch(e){toast(e.message,'err');}
  }

  return { render, clearSelection, selectOnly, getSelected:()=>[...selected] };
})();

async function downloadFile(path){
  try{
    const f = await fs.readFile(path);
    const name = fs.base(path);
    const url = URL.createObjectURL(f);
    const a = document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){toast(e.message,'err');}
}

async function openItem(path){
  try{
    const s = await fs.stat(path);
    if(s.kind==='dir'){ Apps.explorer(path); return; }
    const ext = (path.split('.').pop()||'').toLowerCase();
    if(['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'].includes(ext)) return Apps.imageViewer(path);
    if(['mp4','webm','ogv','mov','mkv'].includes(ext)) return Apps.mediaPlayer(path);
    if(['mp3','wav','ogg','flac','aac','m4a'].includes(ext)) return Apps.mediaPlayer(path);
    if(['pdf'].includes(ext)) return Apps.pdfViewer(path);
    if(['csv','tsv'].includes(ext)) return Apps.spreadsheet(path);
    if(['html','htm'].includes(ext)) return Apps.codeEditor(path);
    if(['zip','gz','tgz','tar'].includes(ext)) return Apps.unzip(path);
    if(['txt','md','log','yaml','yml','json','xml','js','css','py','c','cpp','java','ts','ini','cfg'].includes(ext)) return Apps.notepad(path);
    // fallback
    return Apps.notepad(path);
  }catch(e){toast(e.message,'err');}
}

function setupDesktopEvents(){
  const d = $('#desktop');
  d.addEventListener('contextmenu',e=>{
    if(e.target.closest('.dsk-icon')||e.target.closest('.win'))return;
    e.preventDefault();
    CtxMenu.show(e.clientX,e.clientY,[
      {label:'刷新',icon:ICONS.refresh,action:()=>Desktop.render()},
      {label:'新建文件夹',icon:ICONS.folder,action:async()=>{
        const n = await promptDialog('文件夹名','新建文件夹');
        if(!n)return;
        await fs.mkdir('/Desktop/'+n); Desktop.render();
      }},
      {label:'新建文本文件',icon:ICONS.newfile,action:async()=>{
        const n = await promptDialog('文件名','新建文件.txt');
        if(!n)return;
        await fs.writeFile('/Desktop/'+n,'','text/plain'); Desktop.render();
      }},
      '-',
      {label:'上传文件',icon:ICONS.upload,action:()=>$('#file-import').click()},
      {label:'挂载本地文件夹',icon:ICONS.mount,action:()=>mountLocalFolder()},
      '-',
      {label:'切换全屏',icon:ICONS.fullscreen,action:()=>{
        if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();
      }},
      {label:'壁纸设置',icon:ICONS.settings,action:()=>Apps.settings('wallpaper')},
    ]);
  });

  // Click to clear selection
  d.addEventListener('click',e=>{
    if(e.target===d||e.target.id==='icon-layer') Desktop.clearSelection();
  });

  // Drop to desktop (import)
  d.addEventListener('dragover',e=>{
    if(e.target.closest('.dsk-icon'))return;
    e.preventDefault();
    e.dataTransfer.dropEffect='copy';
  });
  d.addEventListener('drop', async e=>{
    if(e.target.closest('.dsk-icon'))return;
    e.preventDefault();
    // internal move?
    const internal = e.dataTransfer.getData('application/x-inkstone-path');
    if(internal){
      // reposition icon — compute drop point
      const name = fs.base(internal);
      const pos = loadPositions();
      pos[name] = { x: e.clientX - 41, y: e.clientY - 30 };
      savePositionsLocal(pos);
      Desktop.render();
      return;
    }
    // external files
    const items = e.dataTransfer.items;
    if(items && items.length){
      const entries = [];
      for(let i=0;i<items.length;i++){
        const it = items[i];
        const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
        if(entry) entries.push(entry);
      }
      if(entries.length){
        for(const ent of entries){
          await importEntry(ent,'/Desktop');
        }
        Desktop.render();
        toast('导入完成','ok');
        return;
      }
    }
    // fallback to files
    const files = e.dataTransfer.files;
    if(files && files.length){
      for(const f of files){
        const buf = await f.arrayBuffer();
        await fs.writeFile('/Desktop/'+f.name, buf, f.type);
      }
      Desktop.render();
      toast('导入完成','ok');
    }
  });

  // Rubber-band selection
  let rb=null;
  d.addEventListener('mousedown',e=>{
    if(e.target.closest('.dsk-icon')||e.target.closest('.win')||e.target.closest('#taskbar'))return;
    rb = { x:e.clientX, y:e.clientY, moved:false };
  });
  document.addEventListener('mousemove',e=>{
    if(!rb)return;
    const dx = e.clientX-rb.x, dy = e.clientY-rb.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4) rb.moved=true;
    if(rb.moved){
      const r = $('#selrect');
      r.style.display='block';
      r.style.left = Math.min(rb.x,e.clientX)+'px';
      r.style.top = Math.min(rb.y,e.clientY)+'px';
      r.style.width = Math.abs(dx)+'px';
      r.style.height = Math.abs(dy)+'px';
      // select icons intersecting
      const sr = r.getBoundingClientRect();
      $$('.dsk-icon').forEach(ic=>{
        const ir = ic.getBoundingClientRect();
        const hit = !(ir.right<sr.left||ir.left>sr.right||ir.bottom<sr.top||ir.top>sr.bottom);
        ic.classList.toggle('selected', hit);
      });
    }
  });
  document.addEventListener('mouseup',()=>{
    if(rb){$('#selrect').style.display='none';rb=null;}
  });
}
function loadPositions(){try{return JSON.parse(localStorage.getItem('dsk.pos')||'{}');}catch{return {};}}
function savePositionsLocal(p){try{localStorage.setItem('dsk.pos',JSON.stringify(p));}catch{}}

async function importEntry(entry, target){
  if(entry.isFile){
    const file = await new Promise((res,rej)=>entry.file(res,rej));
    const buf = await file.arrayBuffer();
    await fs.mkdir(target);
    await fs.writeFile(target+'/'+entry.name, buf, file.type);
  }else if(entry.isDirectory){
    const newPath = target+'/'+entry.name;
    await fs.mkdir(newPath);
    const reader = entry.createReader();
    const all = [];
    while(true){
      const batch = await new Promise(res=>reader.readEntries(res));
      if(!batch.length)break;
      all.push(...batch);
    }
    for(const ch of all) await importEntry(ch,newPath);
  }
}

async function mountLocalFolder(){
  if(!window.showDirectoryPicker){
    toast('当前浏览器不支持 File System Access API','err');
    return;
  }
  try{
    const handle = await showDirectoryPicker({mode:'readwrite'});
    await fs.mountLocal(handle.name, handle);
    // create desktop shortcut
    const mp = '/mnt/local/'+handle.name;
    await fs.writeFile('/Desktop/'+handle.name+'.mount', mp, 'text/plain');
    Desktop.render();
    Apps.explorer(mp);
  }catch(e){if(e.name!=='AbortError')toast(e.message,'err');}
}

/* ================================================================
   10.1 FILE EXPLORER
   ================================================================ */
Apps.explorer = (startPath='/Desktop')=>{
  const root = el('div','fe');
  // sidebar
  const side = el('div','fe-side');
  const quick = [
    {label:'桌面',path:'/Desktop',icon:ICONS.home},
    {label:'文档',path:'/Documents',icon:ICONS.folder},
    {label:'图片',path:'/Pictures',icon:ICONS.image},
    {label:'音乐',path:'/Music',icon:ICONS.audio},
  ];
  side.appendChild(grp('快速访问'));
  quick.forEach(q=>{
    const n = el('div','node');
    n.innerHTML = q.icon + `<span>${q.label}</span>`;
    n.onclick = ()=>navigate(q.path);
    side.appendChild(n);
  });
  side.appendChild(grp('挂载'));
  const mountNode = el('div','node');
  mountNode.innerHTML = ICONS.mount + `<span>挂载本地目录</span>`;
  mountNode.onclick = mountLocalFolder;
  side.appendChild(mountNode);
  const mountsDiv = el('div','mounts');
  side.appendChild(mountsDiv);
  function grp(t){const g=el('div','grp',t);return g;}

  // main
  const main = el('div','fe-main');
  const tb = el('div','fe-toolbar');
  const bBack = el('button');bBack.innerHTML=ICONS.back;bBack.title='后退';
  const bFwd = el('button');bFwd.innerHTML=ICONS.fwd;bFwd.title='前进';
  const bUp = el('button');bUp.innerHTML=ICONS.up;bUp.title='上级';
  const crumb = el('div','fe-breadcrumb');
  const search = el('input','fe-search');search.placeholder='搜索...';
  const bNewFolder = el('button');bNewFolder.innerHTML=ICONS.plus+' 新建';
  const bUpload = el('button');bUpload.innerHTML=ICONS.upload;
  tb.append(bBack,bFwd,bUp,crumb,search,bNewFolder,bUpload);

  const list = el('div','fe-list view-list');
  const status = el('div','fe-status');

  main.append(tb,list,status);
  root.append(side,main);

  let cwd = startPath;
  let history = [startPath], hIdx = 0;
  let sortKey='name', sortAsc=true;
  let viewMode='list';
  let selected = new Set();
  let clipboard = null;

  async function navigate(path, pushHistory=true){
    try{
      const s = await fs.stat(path);
      if(s.kind!=='dir'){ openItem(path); return; }
      cwd = path;
      if(pushHistory){
        history = history.slice(0,hIdx+1);
        history.push(path);hIdx=history.length-1;
      }
      render();
    }catch(e){toast(e.message,'err');}
  }
  async function render(){
    // update side active
    side.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
    // mounts list
    mountsDiv.innerHTML='';
    const mnts = fs.getMounts();
    for(const [mp,m] of Object.entries(mnts)){
      const n = el('div','node');
      n.innerHTML = ICONS.folder+`<span>${m.name}</span>`;
      n.onclick = ()=>navigate(mp);
      if(cwd.startsWith(mp))n.classList.add('active');
      mountsDiv.appendChild(n);
    }
    // breadcrumb
    const parts = cwd.split('/').filter(Boolean);
    crumb.innerHTML = `<span class="crumb" data-path="/">/</span>`;
    let acc='/';
    parts.forEach((p,i)=>{
      acc += (acc==='/'?'':'/')+p;
      const sep = el('span','sep','/');
      const c = el('span','crumb',p);
      c.dataset.path=acc;
      c.onclick = ()=>navigate(acc);
      crumb.append(sep,c);
    });
    // list
    let items = await fs.readdir(cwd);
    const q = search.value.trim().toLowerCase();
    if(q) items = items.filter(i=>i.name.toLowerCase().includes(q));
    // sort: folders first, then by key
    items.sort((a,b)=>{
      if(a.kind!==b.kind) return a.kind==='dir'?-1:1;
      let av=a[sortKey], bv=b[sortKey];
      if(sortKey==='name'){av=av.toLowerCase();bv=bv.toLowerCase();}
      if(av<bv)return sortAsc?-1:1;if(av>bv)return sortAsc?1:-1;return 0;
    });
    list.innerHTML='';
    const head = el('div','fe-head');
    head.innerHTML = `<span class="col-name" data-k="name">名称 ${sortKey==='name'?(sortAsc?'▲':'▼'):''}</span><span class="col-date" data-k="mtime">修改日期 ${sortKey==='mtime'?(sortAsc?'▲':'▼'):''}</span><span class="col-type" data-k="type">类型 ${sortKey==='type'?(sortAsc?'▲':'▼'):''}</span><span class="col-size" data-k="size">大小 ${sortKey==='size'?(sortAsc?'▲':'▼'):''}</span>`;
    head.querySelectorAll('[data-k]').forEach(h=>h.onclick=()=>{
      const k = h.dataset.k;
      if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k;sortAsc=true;}
      render();
    });
    list.appendChild(head);
    items.forEach(it=>{
      const d = el('div','fe-item');
      d.dataset.path = it.path;
      d.dataset.name = it.name;
      d.dataset.isDir = it.kind==='dir'?'1':'0';
      d.draggable = true;
      const ext = (it.name.split('.').pop()||'').toLowerCase();
      const typeLabel = it.kind==='dir'?'文件夹':(ext.toUpperCase()||'—');
      d.innerHTML = iconFor(it.name,it.kind==='dir')+`<span class="n">${escapeHtml(it.name)}</span><span class="meta"><span>${fmtDate(it.mtime)}</span><span>${typeLabel}</span><span>${it.kind==='file'?fmtSize(it.size):'—'}</span></span>`;
      // double click
      d.addEventListener('dblclick',()=>{
        if(it.kind==='dir') navigate(it.path);
        else openItem(it.path);
      });
      // single click select
      d.addEventListener('click',e=>{
        e.stopPropagation();
        if(e.ctrlKey||e.metaKey){
          if(selected.has(it.name)){selected.delete(it.name);d.classList.remove('selected');}
          else{selected.add(it.name);d.classList.add('selected');}
        }else{
          selected.clear();
          list.querySelectorAll('.fe-item.selected').forEach(x=>x.classList.remove('selected'));
          selected.add(it.name);d.classList.add('selected');
        }
        updateStatus(items);
      });
      // context menu
      d.addEventListener('contextmenu',e=>{
        e.preventDefault();e.stopPropagation();
        if(!selected.has(it.name)){
          selected.clear();list.querySelectorAll('.fe-item.selected').forEach(x=>x.classList.remove('selected'));
          selected.add(it.name);d.classList.add('selected');
        }
        showFeContext(e.clientX,e.clientY,it);
      });
      // drag
      d.addEventListener('dragstart',e=>{
        e.dataTransfer.effectAllowed='copyMove';
        e.dataTransfer.setData('application/x-inkstone-path', it.path);
        // preload for drag-out (async preloaded on hover)
        const cached = feDragCache.get(it.path);
        if(cached && cached.file){
          try{
            e.dataTransfer.items.add(cached.file);
            const url = cached.url || (cached.url=URL.createObjectURL(cached.file));
            e.dataTransfer.setData('DownloadURL',`${cached.file.type||'application/octet-stream'}:${it.name}:${url}`);
          }catch{}
        }
      });
      d.addEventListener('dragover',e=>{
        if(it.kind==='dir' && feDragSrc && feDragSrc!==it.path){
          e.preventDefault();d.classList.add('drop-target');
        }
      });
      d.addEventListener('dragleave',()=>d.classList.remove('drop-target'));
      d.addEventListener('drop',async e=>{
        e.preventDefault();e.stopPropagation();d.classList.remove('drop-target');
        const src = e.dataTransfer.getData('application/x-inkstone-path');
        if(src && it.kind==='dir' && src!==it.path){
          try{await fs.rename(src,it.path+'/'+fs.base(src));render();}catch(err){toast(err.message,'err');}
        }
      });
      // hover preload
      d.addEventListener('mouseenter',async()=>{
        if(it.kind==='file' && !feDragCache.has(it.path)){
          try{
            const f = await fs.readFile(it.path);
            feDragCache.set(it.path,{file:new File([f],it.name,{type:f.type||'application/octet-stream'})});
          }catch{}
        }
      });
      list.appendChild(d);
    });
    // drop on list (move within)
    list.ondragover = e=>{
      if(!e.target.closest('.fe-item') && feDragSrc){e.preventDefault();}
    };
    list.ondrop = async e=>{
      if(e.target.closest('.fe-item'))return;
      const src = e.dataTransfer.getData('application/x-inkstone-path');
      if(src){
        const newP = cwd+'/'+fs.base(src);
        if(fs.parent(src)!==cwd){
          try{await fs.rename(src,newP);render();}catch(err){toast(err.message,'err');}
        }
        return;
      }
      // external drop
      e.preventDefault();
      const entries=[];
      if(e.dataTransfer.items){
        for(let i=0;i<e.dataTransfer.items.length;i++){
          const entry = e.dataTransfer.items[i].webkitGetAsEntry?.();
          if(entry)entries.push(entry);
        }
      }
      if(entries.length){
        for(const en of entries)await importEntry(en,cwd);
        render();toast('导入完成');
      }else if(e.dataTransfer.files?.length){
        for(const f of e.dataTransfer.files){
          const buf = await f.arrayBuffer();
          await fs.writeFile(cwd+'/'+f.name, buf, f.type);
        }
        render();toast('导入完成');
      }
    };
    list.onclick = e=>{
      if(e.target===list){selected.clear();list.querySelectorAll('.fe-item.selected').forEach(x=>x.classList.remove('selected'));updateStatus(items);}
    };
    updateStatus(items);
  }
  function updateStatus(items){
    status.textContent = `${items.length} 项${selected.size?` · 已选 ${selected.size} 项`:''} · ${cwd}`;
  }

  bBack.onclick = ()=>{if(hIdx>0){hIdx--;navigate(history[hIdx],false);}};
  bFwd.onclick = ()=>{if(hIdx<history.length-1){hIdx++;navigate(history[hIdx],false);}};
  bUp.onclick = ()=>{if(cwd!=='/')navigate(fs.parent(cwd));};
  search.oninput = ()=>render();
  bNewFolder.onclick = async()=>{
    const n = await promptDialog('新建文件夹','新建文件夹');
    if(!n)return;
    await fs.mkdir(cwd+'/'+n);render();
  };
  bUpload.onclick = ()=>{
    const inp = document.createElement('input');inp.type='file';inp.multiple=true;
    inp.onchange = async()=>{
      for(const f of inp.files){
        const buf = await f.arrayBuffer();
        await fs.writeFile(cwd+'/'+f.name, buf, f.type);
      }
      render();toast(`已上传 ${inp.files.length} 个文件`);
    };
    inp.click();
  };

  function showFeContext(x,y,it){
    const names=[...selected];
    CtxMenu.show(x,y,[
      {label:'打开',action:()=>{if(it.kind==='dir')navigate(it.path);else openItem(it.path);}},
      {label:'复制',action:()=>{clipboard={op:'copy',paths:names.map(n=>cwd+'/'+n)};}},
      {label:'剪切',action:()=>{clipboard={op:'cut',paths:names.map(n=>cwd+'/'+n)};}},
      {label:'粘贴',disabled:!clipboard,action:async()=>{
        for(const p of clipboard.paths){
          const dst = cwd+'/'+fs.base(p);
          if(clipboard.op==='copy') await fs.copy(p,dst);
          else {await fs.rename(p,dst);}
        }
        if(clipboard.op==='cut')clipboard=null;
        render();
      }},
      '-',
      {label:'重命名',action:async()=>{
        const nn = await promptDialog('重命名',it.name);
        if(!nn||nn===it.name)return;
        try{await fs.rename(it.path,cwd+'/'+nn);render();}catch(e){toast(e.message,'err');}
      }},
      {label:'删除',action:async()=>{
        if(await modal({title:'删除',body:`确定删除 ${names.length} 项？`,buttons:['取消','删除']})!==1)return;
        for(const n of names){try{await fs.unlink(cwd+'/'+n);}catch{}}

      '-',
      {label:'下载',action:()=>names.forEach(n=>downloadFile(cwd+'/'+n))},
    ]);

  WM.create({title:fs.base(startPath)||'根目录',icon:ICONS.explorer,app:'explorer',width:720,height:480,content:root});

   10.3 CODE EDITOR (CodeMirror) — HTML live preview
   ================================================================ */
Apps.codeEditor = async (path)=>{
  const root = el('div','np');
  const tb = el('div','np-toolbar');
  const pathLabel = el('span','path',path||'(未保存)');
  const bSave = el('button','','保存');
  const bOpen = el('button','','打开');
  const bPreview = el('button','','浏览器中打开');
  const spacer = el('div','spacer');
  tb.append(bOpen,bSave,bPreview,spacer,pathLabel);
  const body = el('div','np-body');
  body.style.display='flex';
  const editorHost = el('div');
  editorHost.style.flex='1';editorHost.style.minWidth='0';editorHost.style.display='flex';editorHost.style.flexDirection='column';
  body.appendChild(editorHost);

  let currentPath = path||null;
  let code = '';
  if(path){
    try{code = await fs.readFileAsText(path);}catch(e){toast(e.message,'err');}
  }
  const ext = (path||'').split('.').pop().toLowerCase();
  const modeMap = {js:'javascript',json:'javascript',html:'htmlmixed',htm:'htmlmixed',css:'css',md:'markdown',xml:'xml',py:'python'};
  const cm = CodeMirror(editorHost,{
    value:code, mode: modeMap[ext] || 'text/plain',
    theme:'monokai', lineNumbers:true, matchBrackets:true, autoCloseBrackets:true,
    indentUnit:2, tabSize:2
  });

  // HTML preview pane
  let previewPane = null;
  function ensurePreview(){
    if(previewPane) return;
    previewPane = el('div','html-preview');
    previewPane.style.borderLeft='1px solid var(--ink)';
    previewPane.style.width='50%';
    const iframe = document.createElement('iframe');
    iframe.sandbox='allow-scripts';
    previewPane.appendChild(iframe);
    body.appendChild(previewPane);
    cm.refresh();
  }
  function updatePreview(){
    if(!previewPane) return;
    const iframe = previewPane.querySelector('iframe');
    const doc = iframe.contentDocument;
    doc.open();doc.write(cm.getValue());doc.close();
  }
  const isHtml = ()=>['html','htm'].includes((currentPath||'').split('.').pop().toLowerCase());
  if(isHtml()){ensurePreview();updatePreview();}
  cm.on('change',()=>{
    if(previewPane && isHtml()) updatePreview();
  });

  bSave.onclick = async()=>{
    if(!currentPath){
      const n = await promptDialog('保存为','untitled.html');
      if(!n)return;
      currentPath = '/Documents/'+n;
    }
    await fs.writeFile(currentPath, cm.getValue(), 'text/plain');
    pathLabel.textContent = currentPath;
    toast('已保存');
    if(isHtml() && previewPane) updatePreview();
  };
  bOpen.onclick = ()=>{
    const inp = document.createElement('input');inp.type='file';
    inp.onchange = async()=>{
      const f = inp.files[0];if(!f)return;
      const buf = await f.arrayBuffer();
      await fs.writeFile('/Documents/'+f.name, buf, f.type);
      currentPath = '/Documents/'+f.name;
      cm.setValue(await fs.readFileAsText(currentPath));
      pathLabel.textContent = currentPath;
      if(isHtml()){ensurePreview();updatePreview();}
    };
    inp.click();
  };
  bPreview.onclick = ()=>{
    if(!isHtml()){ toast('仅支持 HTML 预览','err');return; }
    // open in browser app with blob
    const blob = new Blob([cm.getValue()],{type:'text/html'});
    const url = URL.createObjectURL(blob);
    Apps.browser(url);
  };

  WM.create({title:path?fs.base(path):'代码编辑器',app:'code',width:780,height:500,content:root});
};

Apps.spreadsheet = async (path)=>{
  const root = el('div','ss');
  const tabs = el('div','ss-tabs');
  const bTable = el('button','active','表格视图');
  const bText = el('button','','文本视图');
  const bSave = el('button','','保存');
  const title = el('span');title.style.marginLeft='auto';title.style.fontFamily='var(--mono)';title.style.fontSize='11px';title.style.padding='6px';title.textContent=fs.base(path);
  tabs.append(bTable,bText,bSave,title);
  const body = el('div','ss-body');
  root.append(tabs,body);

  const delim = path.endsWith('.tsv')?'\t':',';
  let raw = await fs.readFileAsText(path);

  function renderTable(){
    body.innerHTML='';
    const rows = raw.split(/\r?\n/).filter(r=>r.length);
    if(!rows.length)return;
    const tbl = document.createElement('table');
    const head = rows[0].split(delim);
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    head.forEach(h=>{const th=document.createElement('th');th.textContent=h;trh.appendChild(th);});
    thead.appendChild(trh);tbl.appendChild(thead);
    const tbody = document.createElement('tbody');
    for(let i=1;i<rows.length;i++){
      const cells = rows[i].split(delim);
      const tr = document.createElement('tr');
      for(let j=0;j<head.length;j++){
        const td = document.createElement('td');td.textContent = cells[j]||'';
        td.contentEditable='true';
        td.onblur = ()=>{
          const cs = [...tr.children].map(x=>x.textContent);
          rows[i] = cs.join(delim);
          raw = rows.join('\n');
        };
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    tbl.appendChild(tbody);
    body.appendChild(tbl);
  }
  function renderText(){
    body.innerHTML='';
    const ta = document.createElement('textarea');
    ta.value=raw;
    ta.oninput=()=>{raw=ta.value;};
    body.appendChild(ta);
  }
  renderTable();
  bTable.onclick=()=>{bTable.classList.add('active');bText.classList.remove('active');renderTable();};
  bText.onclick=()=>{bText.classList.add('active');bTable.classList.remove('active');renderText();};
  bSave.onclick=async()=>{await fs.writeFile(path, raw, 'text/plain');toast('已保存');};

  WM.create({title:fs.base(path),app:'sheet',width:680,height:460,content:root});
};
