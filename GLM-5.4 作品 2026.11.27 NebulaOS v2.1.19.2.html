<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>星壤 NebulaOS — 网页操作系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%230b0e0d%27/%3E%3Cpath d=%27M12 3l2.2 5.8 6.2.5-4.7 4 1.4 6.1L12 16l-5.1 3.4 1.4-6.1-4.7-4 6.2-.5z%27 fill=%27%23e8a33d%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
/* 字体加载失败时静默降级到本地字体栈，不阻塞系统启动 */
</script>
<script defer src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" onerror="window.__jszipFailed=true"></script>
<style>
/* ============================================================
   星壤 NebulaOS — 主题系统
   美学方向：墨玉黑 + 琥珀 + 青瓷，取意"深夜天文台与老式终端"
   ============================================================ */
:root{
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-title:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --ac:#e8a33d;            /* 主题色（可在设置中覆盖） */
  --ac2:#54d0b0;           /* 辅助青瓷 */
  --danger:#e05d4f;
  --ok:#5bbf7a;
  --win-radius:12px;
  --radius-s:8px;
  --tb-h:46px;             /* 任务栏高度 */
  --ease:cubic-bezier(.22,1,.36,1);
  --fast:.18s; --mid:.28s;
}
html[data-theme="dark"]{
  --bg:#0b0e0d; --s1:rgba(20,26,23,.78); --s2:#161d19; --s3:#1d2621;
  --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.16);
  --tx:#e9e5d9; --tx2:#9db0a3; --tx3:#5f6f65;
  --shadow:0 18px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --glass:blur(22px) saturate(1.4);
  --hover:rgba(255,255,255,.06); --active:rgba(232,163,61,.16);
  --sel:rgba(232,163,61,.22);
}
html[data-theme="light"]{
  --bg:#eee9dd; --s1:rgba(250,247,240,.82); --s2:#fbf9f3; --s3:#f1ede3;
  --bd:rgba(40,45,40,.12); --bd2:rgba(40,45,40,.22);
  --tx:#262b27; --tx2:#6b746b; --tx3:#9aa198;
  --shadow:0 18px 44px rgba(60,50,30,.18),0 2px 6px rgba(60,50,30,.1);
  --glass:blur(22px) saturate(1.3);
  --hover:rgba(40,45,40,.06); --active:rgba(190,120,30,.16);
  --sel:rgba(190,120,30,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);color:var(--tx);font-size:14px;
  background:var(--bg);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
::selection{background:var(--sel)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:disabled{opacity:.4;cursor:default}
svg{display:block;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
input,textarea{user-select:text;-webkit-user-select:text}

/* ---------- 壁纸：四张内置（纯 CSS 生成，零外部资源） ---------- */
#wallpaper{position:fixed;inset:0;z-index:0;transition:opacity .5s;overflow:hidden}
#wallpaper .wp-css{position:absolute;inset:0;opacity:0;transition:opacity .6s}
#wallpaper .wp-css.on{opacity:1}
.wp-aurora{background:
  radial-gradient(60% 50% at 12% 0%,rgba(84,208,176,.42),transparent 60%),
  radial-gradient(50% 45% at 88% 8%,rgba(232,163,61,.30),transparent 60%),
  radial-gradient(70% 60% at 55% 115%,rgba(46,120,98,.55),transparent 70%),
  radial-gradient(35% 40% at 70% 60%,rgba(84,208,176,.10),transparent 70%),
  linear-gradient(170deg,#0c1512 0%,#0e1a15 45%,#0a0e0c 100%)}
.wp-aurora::before{content:"";position:absolute;inset:-10%;opacity:.55;filter:blur(60px);background:
  conic-gradient(from 200deg at 30% 20%,transparent 0 40%,rgba(84,208,176,.28) 50%,transparent 62%,rgba(232,163,61,.16) 78%,transparent 90%)}
.wp-aurora::after{content:"";position:absolute;inset:0;opacity:.6;background-image:
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent)}
.wp-dunes{background:
  radial-gradient(80% 60% at 80% 100%,rgba(240,150,60,.45),transparent 60%),
  radial-gradient(60% 50% at 5% 100%,rgba(200,90,40,.4),transparent 60%),
  radial-gradient(40% 30% at 50% 20%,rgba(232,163,61,.14),transparent 70%),
  repeating-radial-gradient(120% 100% at 100% 120%,transparent 0 60px,rgba(255,210,150,.06) 60px 62px,transparent 62px 130px),
  linear-gradient(180deg,#15100c 0%,#24170e 55%,#3a2213 100%)}
.wp-dunes::after{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(255,220,170,.12) 1px,transparent 1px);background-size:7px 7px;mask-image:linear-gradient(transparent,#000)}
.wp-grid{background:
  linear-gradient(rgba(84,208,176,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(84,208,176,.09) 1px,transparent 1px),
  radial-gradient(60% 50% at 50% -10%,rgba(84,208,176,.22),transparent 65%),
  radial-gradient(50% 40% at 90% 100%,rgba(232,163,61,.14),transparent 60%),
  #070b0a;background-size:48px 48px,48px 48px,auto,auto,auto}
.wp-grid::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(232,163,61,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(232,163,61,.25) 1px,transparent 1px);background-size:240px 240px;mask-image:radial-gradient(60% 60% at 50% 50%,#000,transparent)}
.wp-grid::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 40% at 50% 55%,transparent 40%,rgba(0,0,0,.5))}
.wp-paper{background:
  radial-gradient(100% 80% at 100% 0%,rgba(232,163,61,.30),transparent 55%),
  radial-gradient(80% 80% at 0 100%,rgba(84,208,176,.26),transparent 60%),
  radial-gradient(40% 40% at 60% 60%,rgba(200,80,60,.08),transparent 70%),
  repeating-linear-gradient(0deg,rgba(120,100,60,.05) 0 1px,transparent 1px 28px),
  linear-gradient(160deg,#f5efe3,#e8dfcb)}
.wp-paper::after{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(80,60,30,.25) 1px,transparent 1px);background-size:5px 5px}
#wallpaper img.wp-custom{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#wallpaper img.wp-custom.on{opacity:1}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;inset:0 0 var(--tb-h) 0;z-index:1;overflow:hidden}
#desk-icons{position:absolute;inset:16px}
.dicon{
  position:absolute;width:92px;padding:10px 4px 8px;border-radius:10px;text-align:center;cursor:default;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:left .22s var(--ease),top .22s var(--ease),background var(--fast),transform var(--fast),box-shadow var(--fast);
  touch-action:none;-webkit-touch-callout:none;
}
.dicon:hover{background:var(--hover);transform:translateY(-2px)}
.dicon.selected{background:var(--sel);box-shadow:inset 0 0 0 1px var(--ac)}
.dicon .di-ico{width:46px;height:46px;display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.dicon .di-ico svg{width:42px;height:42px}
.dicon .di-ico img{max-width:44px;max-height:44px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.dicon[data-app="files"] .di-ico,.dicon .di-ico.dir{color:#e8a33d}
.dicon[data-app="viewer"] .di-ico,.dicon[data-app="manga"] .di-ico{color:#54d0b0}
.dicon[data-app="media"] .di-ico,.dicon[data-app="browser"] .di-ico{color:#7fc4ff}
.dicon[data-app="notepad"] .di-ico,.dicon[data-app="editor"] .di-ico{color:#f0c27a}
.dicon[data-app="paint"] .di-ico,.dicon[data-app="calc"] .di-ico{color:#f28b82}
.dicon .di-name{
  font-size:12.5px;line-height:1.3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6);
  word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.6em;
  padding:1px 5px;border-radius:5px;
}
html[data-theme="light"] .dicon[data-app="files"] .di-ico,.dicon .di-ico.dir{color:#e8a33d}
.dicon[data-app="viewer"] .di-ico,.dicon[data-app="manga"] .di-ico{color:#54d0b0}
.dicon[data-app="media"] .di-ico,.dicon[data-app="browser"] .di-ico{color:#7fc4ff}
.dicon[data-app="notepad"] .di-ico,.dicon[data-app="editor"] .di-ico{color:#f0c27a}
.dicon[data-app="paint"] .di-ico,.dicon[data-app="calc"] .di-ico{color:#f28b82}
.dicon .di-name{color:#fff}
.dicon.dragging{opacity:.45}
.dicon.drop-target .di-ico{transform:scale(1.1);filter:drop-shadow(0 0 10px var(--ac))}
#marquee{position:absolute;border:1px solid var(--ac);background:var(--sel);border-radius:3px;pointer-events:none;display:none;z-index:9999}
.snap-preview{position:fixed;z-index:9000;border:1.5px solid var(--ac);border-radius:var(--win-radius);background:var(--ac);opacity:.14;display:none;transition:all .12s;pointer-events:none}
#snap-preview-top{top:0;left:0;right:0;height:100%;border-radius:0}
.snap-preview.show{display:block}

/* ---------- 窗口 ---------- */
#windows{position:fixed;inset:0;z-index:100;pointer-events:none}
.win{
  position:absolute;min-width:280px;min-height:160px;border-radius:var(--win-radius);overflow:hidden;
  background:var(--s2);border:1px solid var(--bd2);box-shadow:var(--shadow);
  display:flex;flex-direction:column;pointer-events:auto;
  animation:winOpen .26s var(--ease);
}
@keyframes winOpen{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.win.closing{animation:winClose .18s ease forwards}
@keyframes winClose{to{opacity:0;transform:scale(.94) translateY(8px)}}
.win.minimizing{transition:transform .22s ease,opacity .22s ease;transform:scale(.2) translateY(60vh);opacity:0}
.win.minimized{display:none}
.win.maximized{border-radius:0!important;border:none}
.win.snapping{transition:left .2s var(--ease),top .2s var(--ease),width .2s var(--ease),height .2s var(--ease)}
.win.inactive .win-tb{opacity:.72}
.win.dragging{transition:none!important}
.win-tb{
  height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;cursor:default;
  background:linear-gradient(var(--s3),var(--s3));border-bottom:1px solid var(--bd);position:relative;
}
.win-tb .wt-ico{width:17px;height:17px;color:var(--ac)}
.win-tb .wt-ico svg{width:17px;height:17px}
.win-tb .wt-title{flex:1;font-size:13px;font-weight:500;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-tb .wt-title .wt-sub{color:var(--tx2);font-size:12px;margin-left:6px}
.wbtn{width:38px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--tx2);transition:background var(--fast),color var(--fast)}
.wbtn svg{width:14px;height:14px}
.wbtn:hover{background:var(--hover);color:var(--tx)}
.wbtn.close:hover{background:var(--danger);color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.win-body>*{min-height:0}
.win-rs{position:absolute;z-index:5}
.win-rs.n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}.win-rs.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.win-rs.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}.win-rs.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.win-rs.ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize}.win-rs.nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize}
.win-rs.se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize}.win-rs.sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize}
.win-fullhide .win-tb{display:none}

/* ---------- 通用控件 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-s);
  border:1px solid var(--bd);background:var(--s3);color:var(--tx);transition:background var(--fast),border-color var(--fast),transform var(--fast);
  white-space:nowrap;font-size:13px;
}
.btn:hover{background:var(--hover);border-color:var(--bd2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#1a1408;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:rgba(224,93,79,.4)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.btn.icon-only{padding:6px}
.btn.on{background:var(--active);border-color:var(--ac);color:var(--ac)}
.inp{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--radius-s);padding:7px 10px;color:var(--tx);outline:none;
  transition:border-color var(--fast);min-width:0;
}
.inp:focus{border-color:var(--ac)}
select.inp{padding-right:6px}
select.inp option{background:var(--s2);color:var(--tx)}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
label.row span{color:var(--tx)}
label.row small{display:block;color:var(--tx2);font-size:12px;margin-top:2px}
.switch{position:relative;width:40px;height:22px;border-radius:11px;background:var(--bd2);transition:background var(--fast);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--tx);transition:transform var(--fast)}
.switch.on{background:var(--ac)}
.switch.on::after{transform:translateX(18px);background:#1a1408}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--bd2);outline:none;flex:1;min-width:100px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);cursor:pointer;border:2px solid var(--s2)}
.tip{font-size:12px;color:var(--tx2);line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:9px;font-size:11px;background:var(--hover);color:var(--tx2);border:1px solid var(--bd)}
.badge.ac{color:var(--ac);border-color:rgba(232,163,61,.35)}
.badge.ac2{color:var(--ac2);border-color:rgba(84,208,176,.35)}

/* ---------- 右键菜单 / 菜单 ---------- */
#ctxmenu,.ctxmenu{
  position:fixed;z-index:99990;min-width:210px;padding:6px;border-radius:10px;
  background:var(--s1);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--bd2);box-shadow:var(--shadow);display:none;
  animation:ctxIn .14s var(--ease);max-height:80vh;overflow:auto;
}
@keyframes ctxIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;cursor:default;white-space:nowrap;font-size:13px}
.mi svg{width:15px;height:15px;color:var(--tx2)}
.mi:hover:not(.disabled){background:var(--ac);color:#1a1408}
.mi:hover:not(.disabled) svg{color:#1a1408}
.mi.disabled{opacity:.4;pointer-events:none}
.mi .mi-key{margin-left:auto;font-size:11px;color:var(--tx3);font-family:var(--font-mono)}
.mi:hover:not(.disabled) .mi-key{color:#1a1408}
.mi-sep{height:1px;background:var(--bd);margin:5px 6px}
.sub-wrap{position:relative}
.sub-wrap>.sub{position:absolute;left:calc(100% - 4px);top:-6px;display:none;min-width:190px;padding:6px;border-radius:10px;background:var(--s1);backdrop-filter:var(--glass);border:1px solid var(--bd2);box-shadow:var(--shadow)}
.sub-wrap:hover>.sub{display:block}
.sub-wrap>.mi::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg);flex:none}

/* ---------- 模态 ---------- */
#modal-root{position:fixed;inset:0;z-index:99980;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
#modal-root.on{display:flex;animation:ctxIn .18s var(--ease)}
.modal{width:min(420px,92vw);background:var(--s2);border:1px solid var(--bd2);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;max-height:86vh;overflow:auto}
.modal h3{font-family:var(--font-title);font-weight:400;font-size:20px;letter-spacing:1px;margin-bottom:12px;color:var(--ac)}
.modal p{color:var(--tx2);line-height:1.65;margin-bottom:12px;user-select:text}
.modal .m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.modal input.inp{width:100%}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:16px;bottom:calc(var(--tb-h) + 14px);z-index:99970;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;
  background:var(--s1);backdrop-filter:var(--glass);border:1px solid var(--bd2);box-shadow:var(--shadow);
  animation:toastIn .25s var(--ease);max-width:340px;font-size:13px;
}
.toast svg{width:17px;height:17px;color:var(--ac2)}
.toast.err svg{color:var(--danger)}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* ---------- 任务栏 ---------- */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:5000;
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--s1);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border-top:1px solid var(--bd);
}
#tb-start{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:var(--radius-s);transition:background var(--fast)}
#tb-start:hover{background:var(--hover)}
#tb-start .logo{width:24px;height:24px;color:var(--ac)}
#tb-start b{font-family:var(--font-title);font-weight:400;font-size:17px;letter-spacing:1.5px;color:var(--tx)}
#tb-search{
  display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;background:var(--hover);
  border:1px solid transparent);color:var(--tx2);width:220px;cursor:text;transition:all var(--fast);
}
#tb-search:hover{border-color:var(--bd2)}
#tb-search svg{width:15px;height:15px}
#tb-search input{background:none;border:none;outline:none;flex:1;color:var(--tx);min-width:0}
.tb-apps{display:flex;gap:4px;align-items:center;margin-left:8px}
.tb-item{
  position:relative;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--tx);
  transition:background var(--fast),transform var(--fast);
}
.tb-item svg{width:23px;height:23px}
.tb-item:hover{background:var(--hover);transform:translateY(-2px)}
.tb-item.open::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:var(--ac);transition:width var(--fast)}
.tb-item.multi.open::after{width:20px}
.tb-item.active{background:var(--active)}
.tb-item .peek{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;
  transition:opacity var(--fast),transform var(--fast);width:190px;padding:10px;border-radius:10px;background:var(--s1);
  backdrop-filter:var(--glass);border:1px solid var(--bd2);box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;z-index:10;
}
.tb-item .peek.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tb-item .peek .pk-ico{width:30px;height:30px;color:var(--ac)}
.tb-item .peek .pk-ico svg{width:30px;height:30px}
.tb-item .peek .pk-t{font-size:12.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-item .peek .pk-s{font-size:11px;color:var(--tx2)}
#tb-tray{margin-left:auto;display:flex;align-items:center;gap:2px}
.tray-btn{height:36px;padding:0 9px;border-radius:var(--radius-s);display:flex;align-items:center;gap:8px;color:var(--tx2);transition:background var(--fast)}
.tray-btn:hover{background:var(--hover);color:var(--tx)}
.tray-btn svg{width:16px;height:16px}
#tb-clock{font-family:var(--font-mono);font-size:12.5px;line-height:1.25;text-align:left;color:var(--tx);cursor:default}
#tb-clock small{display:block;color:var(--tx2);font-size:10.5px;font-family:var(--font-ui)}
#tb-peek{width:7px;height:34px;border-left:1px solid var(--bd2);margin-left:2px;cursor:default;transition:background var(--fast)}
#tb-peek:hover{background:var(--hover)}
body.peeking .win{opacity:.06!important;pointer-events:none;transition:opacity .2s}

/* ---------- 开始菜单 ---------- */
#startmenu{
  position:fixed;left:10px;bottom:calc(var(--tb-h) + 10px);z-index:6000;width:560px;max-width:calc(100vw - 20px);
  max-height:calc(100vh - var(--tb-h) - 30px);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  background:var(--s1);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--bd2);box-shadow:var(--shadow);
  transform:translateY(14px) scale(.98);opacity:0;pointer-events:none;transition:all .2s var(--ease);
}
#startmenu.on{transform:none;opacity:1;pointer-events:auto}
.sm-search{padding:14px 16px 6px}
.sm-search .inp{width:100%;height:40px;border-radius:20px}
.sm-body{flex:1;overflow:auto;padding:8px 16px 10px}
.sm-sec{font-size:11px;letter-spacing:2px;color:var(--tx3);margin:12px 2px 8px;text-transform:uppercase}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:10px;transition:background var(--fast);cursor:default}
.sm-app:hover{background:var(--hover)}
.sm-app .sa-ico{width:40px;height:40px;color:var(--ac);filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.sm-app .sa-ico svg{width:40px;height:40px}
.sm-app span{font-size:12px;text-align:center;color:var(--tx);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-res{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;cursor:default}
.sm-res:hover{background:var(--hover)}
.sm-res .sr-ico{width:30px;height:30px;color:var(--tx2)}
.sm-res .sr-ico svg{width:26px;height:26px}
.sm-res .sr-t{font-size:13px}
.sm-res .sr-p{font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:380px}
.sm-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--bd);background:var(--hover)}
.sm-foot .u{display:flex;align-items:center;gap:10px;font-size:13px}
.sm-foot .u .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#141a16;font-weight:700;font-size:13px}
.sm-foot .pw{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx2)}
.sm-foot .pw:hover{background:var(--hover);color:var(--tx)}

/* ---------- 日历弹窗 ---------- */
#calpop{
  position:fixed;right:10px;bottom:calc(var(--tb-h) + 10px);z-index:6000;width:300px;padding:16px;border-radius:14px;
  background:var(--s1);backdrop-filter:var(--glass);border:1px solid var(--bd2);box-shadow:var(--shadow);
  display:none;animation:ctxIn .18s var(--ease);
}
#calpop.on{display:block}
#calpop .cp-time{font-family:var(--font-mono);font-size:30px;color:var(--ac);letter-spacing:1px}
#calpop .cp-date{color:var(--tx2);margin:2px 0 12px;font-size:13px}
#calpop .cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#calpop .cp-head b{font-weight:500}
#calpop .cp-nav{display:flex;gap:2px}
#calpop .cp-nav button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--tx2)}
#calpop .cp-nav button:hover{background:var(--hover);color:var(--tx)}
#calpop table{width:100%;border-collapse:collapse;text-align:center;font-size:12.5px}
#calpop th{color:var(--tx3);font-weight:400;padding:4px 0;font-size:11px}
#calpop td{padding:3px 0}
#calpop td span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;cursor:default}
#calpop td.dim span{color:var(--tx3)}
#calpop td span:hover{background:var(--hover)}
#calpop td.today span{background:var(--ac);color:#1a1408;font-weight:700}

/* ---------- 文件管理器 ---------- */
.fm{display:flex;flex:1;min-height:0;position:relative}
.fm-side{width:200px;flex:none;overflow:auto;border-right:1px solid var(--bd);padding:8px 6px;background:var(--s2)}
.fm-side .fs-h{font-size:11px;letter-spacing:2px;color:var(--tx3);padding:8px 10px 4px}
.fs-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;cursor:default;font-size:13px;color:var(--tx)}
.fs-item svg{width:15px;height:15px;color:var(--tx2)}
.fs-item:hover{background:var(--hover)}
.fs-item.on{background:var(--active);color:var(--ac)}
.fs-item.on svg{color:var(--ac)}
.fs-item .tw{width:16px;height:16px;display:grid;place-items:center;color:var(--tx3);flex:none}
.fs-item .tw svg{width:12px;height:12px}
.fs-tree{margin-left:8px;border-left:1px solid var(--bd);padding-left:4px}
.fs-item .fs-x{margin-left:auto;width:20px;height:20px;display:grid;place-items:center;border-radius:4px;opacity:0;color:var(--tx2)}
.fs-item:hover .fs-x{opacity:1}
.fs-item .fs-x:hover{background:var(--hover);color:var(--danger)}
.fs-item .fs-x svg{width:12px;height:12px}
.fm-main{flex:1;display:flex;flex-direction:column;min-width:0;container-type:inline-size;container-name:fmmain}
.fm-actions{display:flex;align-items:center;gap:4px;flex:none;min-width:0}
.fm-actions .ed-bar{flex:none}
.fm-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--bd);flex-wrap:nowrap;overflow:hidden}
@container fmmain (max-width:900px){.fm-bar{flex-wrap:wrap;height:auto;padding:5px 8px;row-gap:4px}.fm-actions{flex:1 1 100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.fm-actions::-webkit-scrollbar{display:none}.fm-bar .crumbs{flex:1 1 120px}.fm-search{width:130px}.fm-search:focus-within{width:150px}}
@container fmmain (max-width:520px){.fm-bar .nav button{width:28px;height:28px}.fm-search{width:104px}.fm-search:focus-within{width:130px}.fm-actions .btn{padding:5px 8px;font-size:12px}}
.fm-bar .nav{display:flex;gap:2px}
.fm-bar .nav button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--tx2)}
.fm-bar .nav button:hover{background:var(--hover);color:var(--tx)}
.fm-bar .nav svg{width:16px;height:16px}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;min-width:60px;height:32px;padding:0 4px;border-radius:8px;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:13px;cursor:default;display:flex;align-items:center;gap:5px;color:var(--tx)}
.crumb svg{width:14px;height:14px;color:var(--tx2)}
.crumb:hover{background:var(--hover)}
.crumb.cur{color:var(--ac);background:var(--active)}
.crumb-sep{color:var(--tx3);flex:none}
.fm-search{position:relative;width:150px;flex:none;transition:width var(--fast)}
.fm-search:focus-within{width:210px}
.fm-search input{width:100%;padding-right:26px}
.fm-search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;display:grid;place-items:center;color:var(--tx2)}
.fm-view{flex:1;overflow:auto;position:relative;background:var(--bg);contain:strict}
.fm-view.mode-sel{touch-action:none}
.fm-status{flex:none;display:flex;align-items:center;gap:12px;padding:5px 12px;border-top:1px solid var(--bd);font-size:12px;color:var(--tx2);background:var(--s2);white-space:nowrap;overflow:hidden}
.fm-status .sp{flex:1}
.fm-status .badge{cursor:default}
.fm-drop-hint{position:absolute;inset:8px;border:2px dashed var(--ac);border-radius:12px;background:var(--sel);z-index:50;display:none;pointer-events:none;align-items:center;justify-content:center;color:var(--ac);font-weight:700}
.fm-main.dropping .fm-drop-hint{display:flex}
/* 列表视图 */
.flist-head,.flist-row{display:flex;width:max-content;min-width:100%}
.flist-head{position:sticky;top:0;z-index:20;background:var(--s3);border-bottom:1px solid var(--bd2);height:32px;align-items:stretch}
.flist-head.c2{background:var(--s2)}
.fl-col{display:flex;align-items:center;gap:4px;padding:0 8px;flex:none;font-size:12px;color:var(--tx2);cursor:default;position:relative;overflow:hidden;white-space:nowrap}
.fl-col.sortable:hover{background:var(--hover);color:var(--tx)}
.fl-col.sorted{color:var(--ac)}
.fl-col .arr{width:12px;height:12px}
.fl-col .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize}
.fl-col .rz:hover{background:var(--ac)}
.flist-row{height:34px;align-items:center;cursor:default;border-radius:0;position:relative}
.flist-row:hover{background:var(--hover)}
.flist-row.selected{background:var(--sel)}
.flist-row.selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.fl-c{padding:0 8px;flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;display:flex;align-items:center;gap:7px}
.fl-c .fi{width:17px;height:17px;color:var(--tx2);flex:none}
.fl-c .fi svg{width:17px;height:17px}
.fl-c .fi.dir{color:var(--ac)}
.fl-c .fi img{width:17px;height:17px;object-fit:cover;border-radius:3px}
.fl-c.dim{color:var(--tx2);font-size:12.5px}
.fl-c.mono{font-family:var(--font-mono);font-size:12px}
/* 图标视图 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:4px;padding:10px;align-content:start;min-height:100%}
.fg-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 9px;border-radius:10px;cursor:default;position:relative}
.fg-item:hover{background:var(--hover)}
.fg-item.selected{background:var(--sel);box-shadow:inset 0 0 0 1px var(--ac)}
.fg-item .fg-ico{width:56px;height:56px;display:grid;place-items:center;color:var(--tx2)}
.fg-item .fg-ico.dir{color:var(--ac)}
.fg-item .fg-ico svg{width:48px;height:48px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.3))}
.fg-item .fg-ico img{max-width:56px;max-height:56px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.35);background:repeating-conic-gradient(var(--bd) 0 25%,transparent 0 50%) 0 0/12px 12px}
.fg-item .fg-ico .th-ph{width:56px;height:56px;border-radius:6px;background:var(--hover)}
.fg-item .fg-name{font-size:12.5px;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;padding:0 4px}
.fg-item .fg-meta{font-size:11px;color:var(--tx3);font-family:var(--font-mono)}
/* 分栏视图 */
.fcols{display:flex;height:100%;overflow-x:auto;align-items:stretch}
.fc-col{width:250px;flex:none;border-right:1px solid var(--bd);overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.fc-col-title{position:sticky;top:0;padding:9px 12px;font-size:11px;letter-spacing:1.5px;color:var(--tx3);background:var(--s3);border-bottom:1px solid var(--bd);z-index:5;text-transform:uppercase}
.fc-item{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;cursor:default}
.fc-item:hover{background:var(--hover)}
.fc-item.on{background:var(--active)}
.fc-item.on .fi{color:var(--ac)}
.fc-item .fi{width:16px;height:16px;color:var(--tx2)}
.fc-item .fi svg{width:16px;height:16px}
.fc-item .fi.dir{color:var(--ac)}
.fc-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-item{touch-action:pan-x pan-y}
/* 移动端选择模式横条 */
.fm-selbar{display:none;flex:none;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--s3);overflow-x:auto}
.fm-selbar.on{display:flex}
/* 空状态 */
.empty-hint{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;color:var(--tx3);padding:40px;text-align:center}
.empty-hint svg{width:52px;height:52px;opacity:.5}

/* ---------- 记事本 ---------- */
.np{display:flex;flex-direction:column;flex:1;min-height:0}
.np-bar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--bd);flex-wrap:wrap;background:var(--s3)}
.np-bar .sp{flex:1}
.np-bar select.inp{padding:4px 6px;font-size:12px}
.np textarea{flex:1;resize:none;border:none;outline:none;background:var(--bg);color:var(--tx);padding:14px 16px;font-family:var(--font-mono);font-size:14px;line-height:1.7;tab-size:4;user-select:text;-webkit-user-select:text}
.np-status{display:flex;gap:16px;padding:4px 12px;font-size:11.5px;color:var(--tx2);border-top:1px solid var(--bd);font-family:var(--font-mono);background:var(--s3)}
/* 表格视图 */
.sv{display:flex;flex-direction:column;flex:1;min-height:0}
.sv-wrap{flex:1;overflow:auto;background:var(--bg);user-select:text;-webkit-user-select:text}
.sv table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.sv th{position:sticky;top:0;background:var(--s3);color:var(--tx2);font-weight:500;padding:7px 12px;border-bottom:1px solid var(--bd2);border-right:1px solid var(--bd);white-space:nowrap;font-family:var(--font-mono)}
.sv td{padding:6px 12px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);white-space:pre;font-family:var(--font-mono);outline:none;min-width:60px}
.sv td:focus{background:var(--active);box-shadow:inset 0 0 0 1px var(--ac)}

/* ---------- 计算器 ---------- */
.calc{display:flex;flex-direction:column;flex:1;padding:14px;gap:12px}
.calc .disp{flex:none;text-align:right;padding:10px 6px;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end}
.calc .disp .expr{font-family:var(--font-mono);font-size:14px;color:var(--tx2);min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc .disp .res{font-family:var(--font-mono);font-size:36px;color:var(--tx);word-break:break-all;line-height:1.15}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc .keys button{border-radius:12px;background:var(--s3);border:1px solid var(--bd);font-family:var(--font-mono);font-size:19px;transition:transform .08s,background var(--fast);min-height:44px}
.calc .keys button:hover{background:var(--hover)}
.calc .keys button:active{transform:scale(.95)}
.calc .keys button.op{color:var(--ac2)}
.calc .keys button.eq{background:var(--ac);color:#1a1408;font-weight:700;border-color:var(--ac)}
.calc .keys button.fn{color:var(--tx2);font-size:15px}

/* ---------- 画板 ---------- */
.paint{display:flex;flex-direction:column;flex:1;min-height:0}
.paint canvas{flex:1;touch-action:none;cursor:crosshair;background:#f6f3ec}
.paint-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--s3);flex-wrap:wrap}
.paint-bar .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.paint-bar .sw.on{border-color:var(--ac);transform:scale(1.12)}
.paint-bar .sp{flex:1}

/* ---------- 设置 ---------- */
.st{display:flex;flex:1;min-height:0}
.st-nav{width:172px;flex:none;border-right:1px solid var(--bd);padding:10px 6px;background:var(--s2);overflow:auto}
.st-nav .sn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--tx);cursor:default;font-size:13.5px;margin-bottom:2px}
.st-nav .sn svg{width:16px;height:16px;color:var(--tx2)}
.st-nav .sn:hover{background:var(--hover)}
.st-nav .sn.on{background:var(--active);color:var(--ac)}
.st-nav .sn.on svg{color:var(--ac)}
.st-body{flex:1;overflow:auto;padding:18px 22px 30px}
.st-body h2{font-family:var(--font-title);font-weight:400;font-size:22px;letter-spacing:1px;color:var(--ac);margin-bottom:4px}
.st-body .sec-t{font-size:11px;letter-spacing:2px;color:var(--tx3);margin:22px 0 4px;text-transform:uppercase}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:8px 0}
.swatches .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform var(--fast)}
.swatches .sw.on{border-color:var(--tx);transform:scale(1.15)}
.wp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:8px 0}
.wp-list .wp{aspect-ratio:16/10;border-radius:10px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;transition:transform var(--fast)}
.wp-list .wp:hover{transform:translateY(-2px)}
.wp-list .wp.on{border-color:var(--ac)}
.wp-list .wp span{position:absolute;left:6px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
.wp-list .wp.up{display:grid;place-items:center;background:var(--s3);color:var(--tx2);border:1.5px dashed var(--bd2)}
.wp-list .wp.up svg{width:22px;height:22px}
.stor-bars{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);margin:10px 0 6px;background:var(--hover)}
.stor-bars div{height:100%;transition:width .4s var(--ease);min-width:0}
.stor-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:12.5px}
.stor-legend .li{display:flex;align-items:center;gap:8px;color:var(--tx2)}
.stor-legend .li i{width:10px;height:10px;border-radius:3px;flex:none}
.stor-legend .li b{margin-left:auto;color:var(--tx);font-family:var(--font-mono);font-weight:500}
.app-toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:6px 0}
.app-toggles .at{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;cursor:default}
.app-toggles .at svg{width:18px;height:18px;color:var(--ac)}
.app-toggles .at.off{opacity:.45}
.mount-list .mt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.mount-list .mt svg{width:20px;height:20px;color:var(--ac2)}
.mount-list .mt .t{flex:1;min-width:0}
.mount-list .mt .t b{display:block;font-weight:500;line-height:1.35}
.mount-list .mt .t small{color:var(--tx2);font-size:11.5px}

/* ---------- 图片查看器 ---------- */
.iv{flex:1;position:relative;overflow:hidden;background:#0a0c0b;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.iv.dragging{cursor:grabbing}
.iv img{max-width:none;transform-origin:0 0;transition:transform .12s var(--ease);will-change:transform;pointer-events:none}
.iv-nobar .iv-tools{opacity:0;pointer-events:none}
.iv-tools{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px 8px;border-radius:12px;background:var(--s1);backdrop-filter:var(--glass);border:1px solid var(--bd2);transition:opacity .3s;z-index:5}
.iv-tools .btn{padding:5px 9px}
.iv-tools .zoom-l{font-family:var(--font-mono);font-size:12px;color:var(--tx2);display:grid;place-items:center;min-width:52px;text-align:center}

/* ---------- 漫画阅读器 ---------- */
.manga{flex:1;min-height:0;position:relative;background:#000}
.manga-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;contain:layout style;scrollbar-width:thin;cursor:grab}

.manga-col{display:flex;flex-direction:column;align-items:center;min-height:100%;padding:0 0 60px}
.mg-page{width:min(880px,96%);background:#0d0f0e;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.mg-page img{width:100%;display:block;opacity:0;transition:opacity .35s}
.mg-page img.ld{opacity:1}
.mg-page .ph{position:absolute;inset:0;display:grid;place-items:center;color:#3a423d}
.mg-page .ph svg{width:30px;height:30px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.manga-hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);transition:opacity .3s;white-space:nowrap}
.manga-hud .pg{font-family:var(--font-mono);font-size:12px;color:#cfd6cf;min-width:70px;text-align:center}

.manga-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;z-index:8;color:#9aa69d;transition:opacity .3s}
.manga-load.off{opacity:0;pointer-events:none}
.manga-load .bar{width:220px;height:3px;background:#1f2422;border-radius:2px;overflow:hidden}
.manga-load .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.spin{width:26px;height:26px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:spin .9s linear infinite}
.win.manga-full .win-tb{display:none}
.win.manga-full .win-rs{display:none}
.mg-exit{position:absolute;top:12px;right:14px;z-index:20;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);color:rgba(255,255,255,.35);display:grid;place-items:center;transition:all .25s;border:1px solid rgba(255,255,255,.08)}

.br{display:flex;flex-direction:column;flex:1;min-height:0}

.br-bar .nav button:hover{background:var(--hover);color:var(--tx)}
.br-bar .nav svg{width:15px;height:15px}
.br-url{flex:1;position:relative}
.br-url .lock{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--tx3)}
.br-url input{width:100%;padding-left:28px;font-family:var(--font-mono);font-size:12.5px}
.br-frame-wrap{flex:1;position:relative;background:var(--bg)}
.br-frame-wrap iframe{width:100%;height:100%;border:none;background:#fff}
.br-mask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:3;transition:opacity .3s;color:var(--tx2)}
.br-mask.off{opacity:0;pointer-events:none}
.br-blocked{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx2);text-align:center;padding:30px;z-index:2}
.br-blocked svg{width:40px;height:40px;color:var(--tx3)}

/* ---------- 媒体播放器 ---------- */
.mp{display:flex;flex-direction:column;flex:1;min-height:0;background:#0a0c0b}

.mp-stage video{max-width:100%;max-height:100%;outline:none}
.mp-stage audio{display:none}
.mp-visual{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(232,163,61,.35),rgba(84,208,176,.12) 60%,transparent 70%),var(--s3);display:grid;place-items:center;color:var(--ac2);border:1px solid var(--bd)}
.mp-visual svg{width:70px;height:70px;opacity:.9}
.mp-visual.playing{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,163,61,.25)}50%{box-shadow:0 0 0 22px rgba(232,163,61,0)}}
.mp-ctrl{flex:none;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;background:var(--s2);border-top:1px solid var(--bd)}
.mp-ctrl .row{display:flex;align-items:center;gap:8px}
.mp-ctrl .sp{flex:1}
.mp-ctrl .t{font-family:var(--font-mono);font-size:11.5px;color:var(--tx2);min-width:44px;text-align:center}
.mp-ctrl button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--tx)}
.mp-ctrl button:hover{background:var(--hover)}
.mp-ctrl button.pp{width:40px;height:40px;background:var(--ac);color:#1a1408;border-radius:50%}

.mp-ctrl svg{width:17px;height:17px}
.mp-title{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.4);padding:4px 12px;border-radius:8px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 代码编辑器 ---------- */
.ed{display:flex;flex-direction:column;flex:1;min-height:0}
.ed-bar{display:flex;align-items:center;gap:5px;padding:5px 8px;border-bottom:1px solid var(--bd);background:var(--s3);flex-wrap:wrap}
.ed-bar .grp{display:flex;align-items:center;gap:4px;padding-right:6px;margin-right:2px;border-right:1px solid var(--bd)}
.ed-bar select.inp{padding:4px 6px;font-size:12px}
.ed-bar .btn{padding:4px 8px;font-size:12px;gap:5px}
.ed-bar .btn svg{width:14px;height:14px}
.ed-pane iframe{flex:1;min-height:0}
.ed-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--tx2);background:var(--bg);z-index:3;font-size:13px}
.ed-main{flex:1;display:flex;min-height:0;position:relative}
.ed-main.dir-v{flex-direction:column}
.ed-pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ed-pane.only{flex:1!important}
.ed-split{flex:none;width:6px;cursor:col-resize;background:var(--bd);position:relative;z-index:5;transition:background var(--fast)}
.ed-split:hover,.ed-split.on{background:var(--ac)}
.dir-v .ed-split{width:auto;height:6px;cursor:row-resize}
.ed .CodeMirror{flex:1;height:100%!important;font-family:var(--font-mono);font-size:13px;line-height:1.65;background:var(--bg)!important;color:var(--tx)!important}
.ed .CodeMirror-gutters{background:var(--s2)!important;border-right:1px solid var(--bd)!important}
.ed .CodeMirror-linenumber{color:var(--tx3)!important}
.ed .CodeMirror-cursor{border-left:2px solid var(--ac)!important}
.ed .CodeMirror-selected{background:var(--sel)!important}
.ed .CodeMirror-activeline-background{background:var(--hover)!important}
.ed .cm-s-material-darker .cm-comment{color:#7d8b80}
.ed .cm-string{color:#c9a66b!important}
.ed .cm-keyword{color:#d98b5f!important}
.ed .cm-def,.cm-variable{color:#8fc7b0!important}
.ed .cm-number{color:#b8a5d0!important}
.ed .cm-tag{color:#d98b5f!important}
.ed .cm-attribute{color:#c9a66b!important}
.ed .cm-property{color:#8fc7b0!important}
.ed .cm-atom{color:#b8a5d0!important}
.ed .CodeMirror-matchingbracket{color:var(--ac)!important;background:var(--active)!important}
.ed-find{display:none;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--s3)}
.ed-find.on{display:flex}
.ed-find input{width:150px}
.ed-status{display:flex;align-items:center;gap:14px;padding:4px 12px;font-size:11.5px;font-family:var(--font-mono);color:var(--tx2);border-top:1px solid var(--bd);background:var(--s3);white-space:nowrap;overflow-x:auto}
.ed-status .sp{flex:1}
.ed-status .lang{color:var(--ac)}
.ed-prev{flex:1;min-width:0;min-height:0;position:relative;background:var(--bg)}
.ed-prev iframe{width:100%;height:100%;border:none;display:block;background:transparent}
.ed-loadmask{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:4;color:var(--tx2);transition:opacity .3s}
.ed-loadmask.off{opacity:0;pointer-events:none}
.CodeMirror-dialog{background:var(--s2)!important;color:var(--tx)!important;border-color:var(--bd)!important}
.CodeMirror-dialog input{background:var(--bg)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;border-radius:4px}

/* ---------- v86 ---------- */
.vm{display:flex;flex-direction:column;flex:1;min-height:0;background:#000}
.vm-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--s3);flex-wrap:wrap}
.vm-bar .sp{flex:1}
#vm-screen{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#vm-screen .screen-container{position:relative;background:#000;width:100%;height:100%}
#vm-screen canvas{max-width:100%;max-height:100%;margin:auto;image-rendering:pixelated;outline:none}
#vm-boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;color:#7d8b80;z-index:3}
#vm-boot.off{display:none}
.vm-hint{font-size:12px;color:var(--tx2)}

/* ---------- 全屏提示/其他 ---------- */
.loading-inline{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--tx2);font-size:13px}
.drag-ghost{position:fixed;z-index:99999;pointer-events:none;padding:6px 10px;border-radius:8px;background:var(--s1);border:1px solid var(--ac);box-shadow:var(--shadow);font-size:12px;display:flex;align-items:center;gap:6px;opacity:.92}
.drag-ghost svg{width:16px;height:16px;color:var(--ac)}
#file-input{display:none}
.spin-sm{width:14px;height:14px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px;margin:8px 0}
.kv b{color:var(--tx2);font-weight:400}
.kv span{font-family:var(--font-mono);font-size:12.5px;word-break:break-all;user-select:text;-webkit-user-select:text}
.progress-line{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--ac);transition:width .2s}

/* ---------- 响应式：手机 / 平板 ---------- */
@media (max-width:768px){
  :root{--tb-h:62px;--win-radius:0px}
  #desktop{inset:0 0 var(--tb-h) 0}
  #desk-icons{inset:10px}
  .dicon{width:82px}
  #taskbar{justify-content:center;gap:8px;padding:0 10px}
  #tb-start b{display:none}
  #tb-search{display:none}
  .tb-apps{margin-left:0;justify-content:center;flex:1}
  .tb-item{width:44px;height:44px}
  .tb-item svg{width:25px;height:25px}
  #tb-clock{display:none}
  .tray-btn{padding:0 7px}
  #tb-peek{display:none}
  #startmenu{left:6px;right:6px;width:auto;bottom:calc(var(--tb-h) + 8px)}
  .sm-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  #calpop{right:6px;left:6px;width:auto}
  .win{inset:0!important;width:100%!important;height:100%!important;border-radius:0!important}
  .win .win-rs{display:none}
  .win-tb{height:42px}
  .fm-side{position:absolute;left:0;top:0;bottom:0;z-index:30;width:230px;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow)}
  .fm-side.on{transform:none}
  .fm-main{width:100%}
  .fm-search{width:110px}.fm-search:focus-within{width:150px}
  .flist-head .fl-col.hide-m,.flist-row .fl-c.hide-m{display:none}
  .win-tb .wbtn:nth-last-child(2){display:none}
  .crumbs{min-width:90px}
  #toasts{left:12px;right:12px;bottom:calc(var(--tb-h) + 12px)}
  .toast{max-width:none}
  .st-nav{width:56px}
  .st-nav .sn span{display:none}
  .st-nav .sn{justify-content:center;padding:11px 0}
  .st-body{padding:14px 14px 30px}
  .iv-tools{bottom:10px}
  .manga-hud input[type=range]{width:90px}
}
@media (min-width:769px){
  .fm-side-toggle{display:none}
}
/* 平板横屏窗口也保持拖拽（768-1100 之间默认窗口较大） */
@media (min-width:769px) and (max-width:1100px){
  .win{min-width:240px}
}
@media (hover:none){
  .tb-item .peek{display:none}
}
.reduce-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}

function enableMarquee(container, itemSelector, { onSel, canStart, scroll = true } = {}) {

    if (!allowed && e.target.closest(itemSelector)) return;

const Clip = { mode: null, paths: [] }; // 虚拟剪贴板（复制/剪切）
async function importFiles(fileList, targetDir, opts = {}) {
  // 物理桌面 → 虚拟：支持文件与文件夹（webkitGetAsEntry 递归）
  const prog = opts.quiet ? null : modalProgress('正在导入…');
  const items = [...fileList];
  let done = 0, total = items.length, count = 0;
  const writeEntry = async (entry, dir) => {
    if (entry.isFile) {
      await new Promise((res, rej) => entry.file(async f => {
        try {
          const name = opts.rename || await fs.uniqueName(dir, f.name);
          await fs.writeFile(join(dir, name), await f.arrayBuffer(), { mtime: opts.keepMtime ? f.lastModified : undefined });
          count++; done++;
        } catch (e) { toast(`导入 ${f.name} 失败：${e.message}`, 'err'); }
        prog?.set(done / Math.max(total, 1), `已导入 ${done} 项…`); res();
      }, rej));
    } else if (entry.isDirectory) {
      const name = await fs.uniqueName(dir, entry.name);

      const readAll = () => new Promise((res, rej) => reader.readEntries(async es => { // readEntries 每次最多 100 条，循环到空

        total += es.length;

        readAll().then(res, rej);
      }, rej));
      await readAll();
    }
  };

    const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : (it.getAsEntry ? it.getAsEntry() : null);
    if (entry) await writeEntry(entry, targetDir); else if (it instanceof File) files.push(it);
  }
  for (const f of files) {
    try { const name = opts.rename || await fs.uniqueName(targetDir, f.name); await fs.writeFile(join(targetDir, name), await f.arrayBuffer()); count++; prog?.set(files.indexOf(f) / files.length, `已导入 ${f.name}`); } catch (e) { toast(`导入 ${f.name} 失败：${e.message}`, 'err'); }
  }

  Desk.render(); refreshFileManagers(targetDir);

}

async function exportPaths(paths) {

  }

async function untar(buffer, destDir, prog) { // 浏览器原生 tar 解析（无依赖）
  const dec = new TextDecoder(); const u8 = new Uint8Array(buffer); let off = 0, n = 0, cnt = 0;

async function openPath(path, opts = {}) {
  const st = await fs.stat(path);

  if (st.type === 'd') { if (opts.mangaDir) return openApp('manga', { dir: path }); return openApp('files', { path }); }
  if (opts.app) return openApp(opts.app, { path });
  const e = extOf(path);
  if (isImage(path)) return openApp('viewer', { path });
  if (isMedia(path)) return openApp('media', { path });
  if (['html', 'htm'].includes(e)) return openApp('editor', { path });
  if (['csv', 'tsv'].includes(e)) return openApp('notepad', { path });
  if (isArchive(path)) { if (await modalConfirm({ title: '解压压缩包', msg: `是否将「${basename(path)}」解压到当前文件夹？`, ok: '解压' })) return extractArchive(path, dirname(path)); return; }
  if (e === 'pdf') return openApp('browser', { path });
  if (opts.generic) return openApp('notepad', { path });
  return openApp('notepad', { path }); // 未知类型 → 以纯文本形式打开（兜底）
}

    const status = el('div', { class: 'vm-hint' }, '加载一个镜像文件（.iso 放入光驱，.img / .fda / .bin 放入软驱，其他作为硬盘）开始启动。镜像从你的电脑或本系统文件系统中读取，不会从外部 URL 拉取。');
    const bLocal = el('button', { class: 'btn primary', onclick: () => { const inp = $('#file-input'); inp.value = ''; inp.accept = '.iso,.img,.fda,.bin,.wasm'; inp.onchange = async () => { if (inp.files[0]) { const f = inp.files[0]; await start(f.arrayBuffer(), f.name); } inp.value = ''; }; inp.click(); } }); bLocal.innerHTML = I('upload') + '<span>从电脑选择镜像…</span>';
    const bVfs = el('button', { class: 'btn', onclick: async () => { const p = await modalPrompt({ title: '从虚拟文件系统加载镜像', label: '输入 .iso / .img 文件路径', value: '/Downloads/' }); if (p) { try { const st = await fs.stat(p); if (!st) throw new Error('文件不存在'); if (st.size > 700 * 1024 * 1024) throw new Error('文件过大（浏览器内存限制）'); await start(await fs.readFile(p, 'arraybuffer'), basename(p)); } catch (e) { toast('加载失败：' + e.message, 'err'); } } } }); bVfs.innerHTML = I('drive') + '<span>从文件系统选择</span>';
    boot.append(status, el('div', { style: { display: 'flex', gap: '10px' } }, bLocal, bVfs));
    screen.append(boot);
    const bLock = el('button', { class: 'btn sm', title: '锁定鼠标：进入后鼠标相对移动，按 Esc 退出锁定' }); bLock.innerHTML = I('lock') + '<span>鼠标锁定</span>'; bLock.disabled = true;
    bLock.addEventListener('click', () => { if (document.pointerLockElement === canvas) document.exitPointerLock(); else canvas.requestPointerLock(); });
    const bStop = el('button', { class: 'btn sm danger', onclick: async () => { if (await modalConfirm({ title: '关闭虚拟机', msg: '确定关闭虚拟机？未保存的数据将丢失。', ok: '关闭', danger: true })) stop(); } }); bStop.innerHTML = I('power') + '<span>关机</span>'; bStop.disabled = true;
    const lockState = el('span', { class: 'badge', style: { display: 'none' } }, '鼠标已锁定 · Esc 退出');
    bar.append(bLock, bStop, lockState, el('span', { class: 'sp' }), el('span', { class: 'tip' }, 'v86 0.5.319 · 固定版本资源'));
    root.append(bar, screen); win.body.append(root);
    const stop = () => { try { emu && emu.stop(); } catch (e) {} emu = null; running = false; boot.classList.remove('off'); boot.innerHTML = ''; boot.append(el('div', {}, '虚拟机已关闭')); bLock.disabled = bStop.disabled = true; };
    const start = async (buf, name) => {
      if (running) return toast('虚拟机已在运行');
      status.textContent = '正在加载 v86 引擎（首次需要下载约 3 MB）…';
      try {
        if (!window.V86) await loadScript(V86_CDNS.lib);
        status.textContent = '正在初始化（加载 WASM 与 BIOS）…';
        const ext = extOf(name);
        const drives = {};
        if (ext === 'iso') drives.cdrom = { buffer: buf }; else if (['img', 'fda', 'bin'].includes(ext)) drives.fda = { buffer: buf }; else drives.hda = { buffer: buf };
        emu = new V86({ wasm_path: V86_CDNS.wasm, bios_path: V86_CDNS.bios, vga_bios_path: V86_CDNS.vgabios, screen_container: container, memory_size: 256, vga_memory_size: 16, autostart: true, boot_order: Object.keys(drives)[0] === 'fda' ? 321 : Object.keys(drives)[0] === 'cdrom' ? 213 : 123, ...drives, uart_container: null });
        running = true; boot.classList.add('off'); canvas.style.display = ''; bLock.disabled = bStop.disabled = false;
        toast('虚拟机已启动：' + name);
      } catch (e) { status.textContent = '启动失败：' + e.message + '（请检查网络，资源必须可跨域加载）'; toast('v86 启动失败：' + e.message, 'err'); }
    };
    // 鼠标锁定：Pointer Lock 下的相对位移 → 合成绝对坐标鼠标事件转发给 v86 的 screen 元素
    let vx = 0, vy = 0;
    document.addEventListener('pointerlockchange', () => { const on = document.pointerLockElement === canvas; lockState.style.display = on ? '' : 'none'; bLock.innerHTML = I(on ? 'unlock' : 'lock') + `<span>${on ? '解除锁定' : '鼠标锁定'}</span>`; });
    document.addEventListener('mousemove', e => {
      if (document.pointerLockElement !== canvas || !running) return;
      const r = canvas.getBoundingClientRect(); vx = clamp(vx + e.movementX * (canvas.width / r.width), 0, canvas.width); vy = clamp(vy + e.movementY * (canvas.height / r.height), 0, canvas.height);
      const opts = { bubbles: true, cancelable: true, clientX: r.left + vx * (r.width / canvas.width), clientY: r.top + vy * (r.height / canvas.height), view: window };
      canvas.dispatchEvent(new MouseEvent('mousemove', opts));
    });
    canvas.addEventListener('click', () => canvas.focus());
    win.onClose = () => { try { emu && emu.stop(); } catch (e) {} if (document.pointerLockElement === canvas) document.exitPointerLock(); };
  }
};

/* ---------------- 29. 启动（无假加载动画，直接进入系统） ---------------- */
(async function boot() {
  loadSettings();
  $('#tb-start').innerHTML = `<span class="logo">${I('logo')}</span><b>星壤</b>`;
  applySettings(); Desk.init(); Taskbar.render(); renderClock(); renderPinned();
  // 立即显示桌面骨架（应用图标），文件系统就绪后再补齐用户文件
  Desk.render();
  try { await fs.init(); } catch (e) { toast('文件系统初始化失败：' + e.message, 'err'); }
  applyWallpaper(); Desk.render();
  if (location.hash.startsWith('#')) { const p = decodeURIComponent(location.hash.slice(1)); openApp('files', { path: p }); }
  const first = !(await idbGet('meta', '/.system/booted'));
  if (first) { await idbPut('meta', '/.system/booted', { t: 'f', m: Date.now(), s: 0, b: 'idb' }); openApp('notepad', { path: '/Documents/欢迎使用.txt' }); }
  else { const w = Win.list.length ? null : openApp('files', { path: '/' }); if (w && innerWidth > 1100) { w.w = 980; w.h = 620; w.apply(); } }
  window.addEventListener('resize', debounce(() => Desk.render(), 300));
  // 全局拖放：拖到任意非视图位置（任务栏除外）也导入到桌面
  document.addEventListener('dragover', e => { if (!e.target.closest('.fm-view,.dicon,#desk-icons,#desktop')) e.preventDefault(); });
  document.addEventListener('drop', e => { if (e.target.closest('.fm-view,.dicon,#desk-icons,#desktop,.modal')) return; e.preventDefault(); if (e.dataTransfer.items?.length) importFiles([...e.dataTransfer.items], '/Desktop'); });
  window.addEventListener('online', () => toast('网络已连接，在线组件可用'));
  window.addEventListener('offline', () => toast('网络已断开：在线组件（编辑器内核 / 解压库）暂不可用，文件系统不受影响', 'warn'));
})();
</script>
