async function paintApp(){const w=createWindow('paint','画板',{width:690,height:455});w.body.innerHTML=`<div class="appbar">${component('brush','画笔','pen')}${component('edit','橡皮','eraser')}<input type="color" value="#237a9d" aria-label="画笔颜色" style="width:30px;height:25px;padding:1px"><label class="hrow">粗细<input type="range" min="1" max="55" value="6" aria-label="笔刷大小" style="width:60px"></label>${component('undo','撤销','undo')}${component('redo','重做','redo')}${component('trash','清空','clear')}${component('upload','导入','import')}${component('save','保存','save')}</div><div class="paint-stage"><canvas width="1200" height="760" aria-label="绘图画布"></canvas></div><div class="statusbar"><span class="toolname">画笔</span><span class="spacer"></span>1200 × 760 px　PNG</div>`;const c=$('canvas',w.body),ctx=c.getContext('2d',{willReadFrequently:true});let erase=false,drawing=false,hist=[],hi=-1,path='';ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);const snap=()=>{hist=hist.slice(0,hi+1);hist.push(ctx.getImageData(0,0,c.width,c.height));if(hist.length>16)hist.shift();hi=hist.length-1};snap();const xy=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{if(e.button!==0)return;drawing=true;c.setPointerCapture(e.pointerId);ctx.strokeStyle=erase?'#ffffff':$('input[type=color]',w.body).value;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=+$('input[type=range]',w.body).value*(erase?3:1);ctx.lineCap='round';ctx.lineJoin='round';const [x,y]=xy(e);ctx.beginPath();ctx.arc(x,y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y)};c.onpointermove=e=>{if(!drawing)return;for(const ev of e.getCoalescedEvents?.()||[e]){ctx.lineTo(...xy(ev))}ctx.stroke()};c.onpointerup=c.onpointercancel=()=>{if(drawing){drawing=false;snap();w.dirty=true}};async function save(){if(!path){const n=await dialog('保存画稿','画稿将以 PNG 格式保存到图片目录。','我的画稿.png','保存');if(!n)return false;path=await uniquePath(home()+'/图片 <script>
const archiveLimit=512*1024*1024,archiveFileLimit=20000,zipCDN='https://unpkg.com/jszip@3.10.1/dist/jszip.min.js';

const crcTable=Uint32Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});

async function storedZip(records){let off=0,centralSize=0;const parts=[],centers=[];for(const r of records){const n=utf8.encode(r.name),comment=utf8.encode('AERO-MTIME='+r.mtime),b=new Uint8Array(await r.blob.arrayBuffer()),crc=crc32(b),dt=dosDate(r.mtime),lh=new Uint8Array(30+n.length),l=new DataView(lh.buffer);l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x800,true);l.setUint16(10,dt.time,true);l.setUint16(12,dt.date,true);l.setUint32(14,crc,true);l.setUint32(18,b.length,true);l.setUint32(22,b.length,true);l.setUint16(26,n.length,true);lh.set(n,30);parts.push(lh,b);const ch=new Uint8Array(46+n.length+comment.length),v=new DataView(ch.buffer);v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x800,true);v.setUint16(12,dt.time,true);v.setUint16(14,dt.date,true);v.setUint32(16,crc,true);v.setUint32(20,b.length,true);v.setUint32(24,b.length,true);v.setUint16(28,n.length,true);v.setUint16(32,comment.length,true);v.setUint32(38,r.dir?16:0,true);v.setUint32(42,off,true);ch.set(n,46);ch.set(comment,46+n.length);centers.push(ch);centralSize+=ch.length;off+=lh.length+b.length}const e=new Uint8Array(22),v=new DataView(e.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,records.length,true);v.setUint16(10,records.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,off,true);return new Blob([...parts,...centers,e],{type:'application/zip'})}

async function exportFiles(paths){if(!paths.length)throw Error('请先选择要导出的项目');if(paths.length===1&&(await fs.stat(paths[0])).isFile()){download(await fs.readFile(paths[0]),base(paths[0]));return}toast('正在打包选中的项目','zip');download(await makeZip(paths),(paths.length===1?base(paths[0]):'AeroOS 文件')+'.zip')}

async function tarEntries(blob){const a=new Uint8Array(await blob.arrayBuffer()),out=[];let p=0,longName='',pax={};const str=(i,l)=>decoder.decode(a.subarray(i,i+l)).split('\0')[0],oct=(i,l)=>parseInt(str(i,l).trim(),8)||0;while(p+512<=a.length){let n=str(p,100);if(!n)break;const prefix=str(p+345,155),sz=oct(p+124,12),t=String.fromCharCode(a[p+156]||48),mtime=oct(p+136,12)*1000;let check=0;for(let i=0;i<512;i++)check+=i>=148&&i<156?32:a[p+i];if(check!==oct(p+148,8))throw Error('TAR 头校验失败');if(prefix)n=prefix+'/'+n;const start=p+512,end=start+sz;if(end>a.length)throw Error('TAR 文件不完整');if(t==='L')longName=str(start,sz);else if(t==='x'||t==='g'){for(const line of str(start,sz).split('\n')){const m=line.match(/^\d+ ([^=]+)=(.*)$/);if(m)pax[m[1]]=m[2]}}else if(t==='0'||t==='5'){n=(pax.path||longName||n).replace(/^\.\//,'');if(n&&n!=='.'&&n!=='/'){archiveName(n);out.push({name:n,dir:t==='5',size:sz,mtime:pax.mtime?Number(pax.mtime)*1000:mtime,read:()=>Promise.resolve(blob.slice(start,end))})}longName='';pax={}}p=start+Math.ceil(sz/512)*512;if(out.length>archiveFileLimit)throw Error('TAR 项目数超过上限')}return out}
async function sevenArchive(blob,filename,signal){const workerSource=async function(){self.onmessage=async e=>{try{const {default:SevenZip}=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');let lines=[];const z=await SevenZip({noInitialRun:true,locateFile:p=>'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/'+p.split('/').pop(),print:s=>lines.push(s),printErr:s=>lines.push(s)}),fs=z.FS,input='input.'+e.data.ext;fs.writeFile('/'+input,new Uint8Array(e.data.buffer));z.callMain(['l','-slt','/'+input]);const total=lines.reduce((s,l)=>s+(l.startsWith('Size = ')?Number(l.slice(7))||0:0),0);if(total>536870912)throw Error('展开数据超过 512 MB');const dates=new Map();let entry='';for(const l of lines){if(l.startsWith('Path = '))entry=l.slice(7);else if(l.startsWith('Modified = '))dates.set(entry,new Date(l.slice(11).replace(' ','T')).getTime())}fs.mkdir('/output');lines=[];const code=z.callMain(['x','-y','-p-','-o/output','/'+input]);if(code)throw Error(lines.slice(-4).join(' ')||'无法解压该文件');const files=[],buffers=[];let used=0;function scan(p){for(const n of fs.readdir(p)){if(n==='.'||n==='..')continue;const path=p+'/'+n,st=fs.lstat(path),name=path.slice(8);if(fs.isLink(st.mode))continue;const dir=fs.isDir(st.mode),b=dir?null:fs.readFile(path).slice().buffer;used+=b?.byteLength||0;if(files.length>=20000||used>536870912)throw Error('超过安全解压上限');files.push({name,dir,size:b?.byteLength||0,mtime:dates.get(name)||Number(st.mtime),buffer:b});if(b)buffers.push(b);if(dir)scan(path)}}scan('/output');self.postMessage({files},buffers)}catch(err){self.postMessage({error:err.message||String(err)})}}};const url=URL.createObjectURL(new Blob(['('+workerSource.toString()+')()'],{type:'text/javascript'})),worker=new Worker(url,{type:'module'});try{return await new Promise(async(res,rej)=>{const abort=()=>rej(new DOMException('已取消','AbortError'));signal?.addEventListener('abort',abort,{once:true});worker.onerror=e=>rej(Error(e.message||'7z 引擎加载失败，请检查网络'));worker.onmessage=e=>{if(e.d async function archiveApp(path){
 const w=createWindow('archive',base(path)+' · 归档工具',{width:570,height:380});w.icon='archive';$('.titlebar>.art',w.el).outerHTML=art('archive');renderTasks();

 w.body.innerHTML=`<div class="appbar">${component('folder','解压到当前目录','extract')}${component('download','选择目标目录','choose')}${component('info','属性','info')}</div><div class="appcontent archive-list"></div><div class="statusbar"><span class="astatus">准备解压引擎</span></div>`;

   stat.textContent=`${entries.length} 个项目　|　解压后 ${bytes(entries.reduce((s,f)=>s+f.size,0))}`;$$('.appbar button',w.body).forEach(b=>b.disabled=false);
  }catch(e){if(!w.el.isConnected)return;stat.textContent='原文件未被修改';area.innerHTML=`<div class="empty">${g('info')}<h3>无法读取压缩包</h3><p>${H(e.message)}</p><div class="hrow">${component('refresh','使用 7z 重试','retry','softbtn')}${component('download','导出原文件','export','softbtn')}</div></div>`;actions(area,{retry:()=>inspect(true),export:()=>exportFiles([path])})}

 }
