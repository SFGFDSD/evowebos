<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme:dark; --accent:#d8ad6c; --accent-ink:#211a11; --ink:#e4e4d9; --muted:#a1aa9d; --quiet:#7e8b80;
  --bg:#111714; --panel:#171e1b; --raised:#1e2722; --deep:#131a17; --sidebar:#151c18; --line:#303b33; --rim:#4b584e;
  --hover:#28342b; --good:#a2b49a; --danger:#d37a6d; --shadow:#000b; --radius:9px; --head-h:56px; --dock-h:62px;
  --ui:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
[data-theme=light] {
  color-scheme:light; --ink:#222c24; --muted:#4c5d50; --quiet:#58685c; --bg:#e6e9df; --panel:#f3f4ec;
  --raised:#e7ebe0; --deep:#fcfcf6; --sidebar:#e9ece2; --line:#cbd2c4; --rim:#a4afa1; --hover:#dce4d7;
  --good:#45684b; --danger:#a23e32; --shadow:#26322a40; --accent-ink:#171b13;
}
*,*::before,*::after { box-sizing:border-box }
html,body { width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none }
body { font:13px/1.55 var(--ui);color:var(--ink);background:#0d1511 }
button,input,select,textarea { font:inherit;color:inherit }
button { cursor:pointer;user-select:none }
button,input,select,textarea { outline-offset:3px }
:focus-visible { outline:2px solid var(--accent) }
button:disabled { opacity:.38;cursor:default }
[hidden] { display:none!important }
button { border:0;background:none;padding:0 }
input,select,textarea { border:1px solid var(--line);background:var(--deep);border-radius:4px;padding:7px 9px;min-width:0 }
input[type=checkbox] { accent-color:var(--accent);width:16px;height:16px }
input[type=range] { accent-color:var(--accent) }
input[type=color] { min-width:36px;padding:2px }
::selection { background:var(--accent);color:var(--accent-ink) }
::-webkit-scrollbar { width:9px;height:9px }
::-webkit-scrollbar-thumb { background:var(--rim);border:2px solid var(--deep);border-radius:5px }
::-webkit-scrollbar-corner { background:var(--deep) }
.ico { width:17px;height:17px;display:inline-block;flex:none;vertical-align:middle }
.mono { font-family:var(--mono);font-variant-numeric:tabular-nums }
.dim { color:var(--muted) }
.quiet { color:var(--quiet) }
.sr { position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap }
.action,.icon-btn { display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:31px;padding:5px 9px;border-radius:4px;white-space:nowrap }
.icon-btn { min-width:32px;padding:5px;color:var(--muted) }
.action:hover:not(:disabled),.icon-btn:hover:not(:disabled) { background:var(--hover);color:var(--ink) }
.action.primary { background:var(--accent);color:var(--accent-ink);font-weight:700 }
.action.primary:hover:not(:disabled) { background:color-mix(in srgb,var(--accent),white 17%);color:var(--accent-ink) }
.action.soft { border:1px solid var(--rim);background:var(--raised) }
.action.on { color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--panel)) }
.action.danger { color:var(--danger) }
.rule { align-self:stretch;width:1px;min-width:1px;background:var(--line);margin:4px }
.status-dot { width:6px;height:6px;display:inline-block;flex:none;border-radius:50%;background:var(--good);box-shadow:0 0 9px color-mix(in srgb,var(--good),transparent 55%) }
.status-dot.red { background:#da7c65;box-shadow:0 0 10px #d96c565a }
.activity { display:inline-block;width:16px;height:16px;flex:none;border:1px solid var(--rim);border-top-color:var(--accent);border-radius:50%;animation:rotate 1s linear infinite }
@keyframes rotate { to { transform:rotate(1turn) } }
@keyframes materialize { from { transform:translateY(8px);opacity:0 } to { transform:translateY(0);opacity:1 } }
@keyframes breathe { 0%,100% { opacity:.55 } 50% { opacity:1 } }
@keyframes signal-scan { from { background-position:0 0 } to { background-position:0 160px } }

#shell { width:100%;height:100dvh;position:relative;isolation:isolate;overflow:hidden }
#wallpaper { position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 76% 46%,#3f4c3c,#101b17 63%);pointer-events:none }
#scene { width:100%;height:100%;object-fit:cover;object-position:63% 50%;display:block }
#wall-image { position:absolute;inset:0;background-size:cover;background-position:center }
#wall-finish { position:absolute;inset:0;background:linear-gradient(90deg,#060d0bb0 0%,#070d0b3d 50%,transparent 74%),linear-gradient(0deg,#080e0cf0 1%,transparent 35%,transparent 77%,#080d0a60); }
#wall-finish::after { content:'';position:absolute;inset:0;opacity:.28;background:repeating-linear-gradient(transparent 0 3px,#050c0938 3px 4px);animation:signal-scan 22s linear infinite }
.system-head { position:absolute;z-index:400;inset:0 0 auto;height:var(--head-h);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 26px;background:#101614f7;border-bottom:1px solid #384239;color:#e7e5d9 }
.brand { display:flex;align-items:center;gap:10px;text-align:left;min-width:max-content }
.brand svg { color:#dfb674;width:30px;height:30px;transition:transform .28s }
.brand:hover svg { transform:rotate(-18deg) }
.brand strong { font:700 18px/1 var(--serif);letter-spacing:.05em;display:block }
.brand small { display:block;font:500 8px/1 var(--mono);letter-spacing:.18em;color:#a0a494;margin-top:5px }
.head-left,.head-right,.head-status { display:flex;align-items:center;gap:15px }
.head-left .rule { height:24px;background:#364139;margin:0 2px;align-self:center }
.head-channel { font:500 11px var(--mono);letter-spacing:.1em;color:#9ca697 }
.head-channel b { color:#c8cec1;font:500 11px var(--ui);letter-spacing:.11em }
.head-status { gap:7px;font-size:11px;color:#bdc6b7;white-space:nowrap }
.head-right .icon-btn { color:#b6c0b3 }
.head-right .icon-btn:hover { background:#26332a;color:#eee }
#clock { border-left:1px solid #364139;padding-left:15px;font:500 12px var(--mono);min-height:28px;color:#e5e4d6;white-space:nowrap }
#clock small { font-size:10px;color:#a6ae9e;margin-right:10px }
[data-theme=light] .system-head,[data-theme=light] #taskbar { background:#edf0e7f7;border-color:#b2bcad;color:#29372c }
[data-theme=light] .brand svg { color:#72501f }
[data-theme=light] .brand small,[data-theme=light] .head-channel,[data-theme=light] .head-channel b,[data-theme=light] .head-status,[data-theme=light] .head-right .icon-btn,[data-theme=light] #clock,[data-theme=light] #clock small { color:#425647 }
[data-theme=light] #clock,[data-theme=light] .head-left .rule { border-color:#b2bcad }
#workspace { position:absolute;inset:var(--head-h) 0 var(--dock-h); }
#desk-scroll { position:absolute;inset:0;overflow:auto;scrollbar-width:thin }
#desk-icons { position:relative;min-width:100%;min-height:100%;touch-action:none }
.desk-tile { position:absolute;width:94px;height:82px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:3px 3px 5px;border:1px solid transparent;border-radius:5px;color:#e4e3d7;user-select:none;touch-action:none;transition:left .19s cubic-bezier(.2,.8,.2,1),top .19s cubic-bezier(.2,.8,.2,1),background .15s,border-color .15s;text-shadow:0 2px 4px #000 }
.desk-tile.enter { animation:materialize .42s both;animation-delay:var(--delay) }
.desk-tile:hover,.desk-tile:focus-visible { background:#d5ba7520;border-color:#c9b17963 }
.desk-tile.selected { background:#bfa36720;border-color:#cdb17370 }
.desk-art { width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 4px 6px #0009) }
.desk-art svg { width:43px;height:43px }
.desk-name { display:block;width:100%;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
.desk-more { display:none;position:absolute;top:1px;right:1px;min-width:24px;min-height:22px;padding:2px;color:#e2e5d5 }
.desk-tile:hover .desk-more,.desk-tile:focus-within .desk-more { display:inline-flex }
.camera-guide { position:absolute;inset:25px 25px 24px 135px;color:#ccd2be7a;pointer-events:none;user-select:none }
.camera-guide::before,.camera-guide::after { content:'';position:absolute;right:0;width:24px;height:24px;border-right:1px solid currentColor }
.camera-guide::before { top:0;border-top:1px solid currentColor }.camera-guide::after { bottom:0;border-bottom:1px solid currentColor }
.feed-id { position:absolute;right:14px;top:12px;display:flex;align-items:center;gap:9px;font:500 10px var(--mono);letter-spacing:.12em;color:#d3d6c5 }
.feed-id .status-dot { animation:breathe 3s ease-in-out infinite }
.feed-id i { font-style:normal;color:#b9c0ae80 }
.feed-caption { position:absolute;bottom:58px;right:17px;width:min(273px,24vw);color:#e1e0cf;user-select:none;animation:materialize .65s .12s both;text-shadow:0 2px 12px #030604 }
.feed-caption .eyebrow { font:500 10px var(--mono);letter-spacing:.18em;color:#d7ba86;display:flex;align-items:center;gap:10px }
.feed-caption .eyebrow::before { content:'';display:inline-block;width:24px;border-top:1px solid currentColor }
.feed-caption h1 { font:600 clamp(25px,3vw,44px)/1.2 var(--serif);letter-spacing:.075em;margin:9px 0 8px }
.feed-caption p { margin:0;color:#b2b9ab;font-size:11px;letter-spacing:.12em }
.feed-caption .feed-coord { display:flex;justify-content:space-between;border-top:1px solid #a7b19b44;margin-top:16px;padding-top:8px;font:400 9px var(--mono);color:#a5b09f;letter-spacing:.04em }
.desk-footnote { position:absolute;bottom:8px;left:0;font:400 9px var(--mono);color:#8e9b89;letter-spacing:.12em }
.desk-footnote b { font-weight:500;color:#cfb583;margin-right:10px }
#windows { position:absolute;inset:0;pointer-events:none;z-index:100 }
.win { position:absolute;pointer-events:auto;display:flex;flex-direction:column;overflow:visible;isolation:isolate;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 15px 55px var(--shadow);min-width:0;min-height:0;animation:materialize .22s ease-out both }
.win.active { border-color:var(--rim);box-shadow:0 22px 75px var(--shadow),0 0 0 1px #77887b17 }
.win.snapped { border-radius:0 }
.win-title { height:44px;flex:none;display:flex;align-items:center;gap:9px;padding-left:14px;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px solid var(--line);background:var(--raised);user-select:none;touch-action:none;min-width:0 }
.win-title > .ico { color:var(--accent) }
.win-title strong { font-weight:600;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.025em }
.win-title small { white-space:nowrap;color:var(--quiet);font:500 9px var(--mono);letter-spacing:.09em;overflow:hidden;text-overflow:ellipsis }
.win-controls { display:flex;align-items:stretch;align-self:stretch;margin-left:auto;border-top-right-radius:inherit;overflow:hidden;flex:none }
.win-controls button { width:40px;color:var(--muted);display:grid;place-items:center }
.win-controls button:hover { color:var(--ink);background:var(--hover) }
.win-controls button[data-control=close]:hover { color:white;background:#772f28 }
.win-controls .ico { width:15px;height:15px }
.win-body { flex:1;min-height:0;min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:0 0 var(--radius) var(--radius) }
.win.snapped .win-body { border-radius:0 }
.size-grip { position:absolute;z-index:4;touch-action:none }
.size-grip[data-edge=n],.size-grip[data-edge=s] { height:8px;left:10px;right:10px;cursor:ns-resize }
.size-grip[data-edge=n] { top:-4px }.size-grip[data-edge=s] { bottom:-4px }
.size-grip[data-edge=e],.size-grip[data-edge=w] { width:8px;top:10px;bottom:10px;cursor:ew-resize }
.size-grip[data-edge=e] { right:-4px }.size-grip[data-edge=w] { left:-4px }
.size-grip[data-edge^=n]:not([data-edge=n]),.size-grip[data-edge^=s]:not([data-edge=s]) { width:13px;height:13px }
.size-grip[data-edge=ne] { top:-4px;right:-4px;cursor:nesw-resize }.size-grip[data-edge=sw] { bottom:-4px;left:-4px;cursor:nesw-resize }
.size-grip[data-edge=nw] { top:-4px;left:-4px;cursor:nwse-resize }.size-grip[data-edge=se] { bottom:-4px;right:-4px;cursor:nwse-resize }
.win.snapped .size-grip { display:none }
.moving-window iframe { pointer-events:none }
#snap-hint { position:absolute;z-index:99;border:1px solid #d8ad6c75;background:#d8ad6c20;border-radius:7px;box-shadow:inset 0 0 50px #d8ad6c0c;pointer-events:none }
#shell.peek #windows { visibility:hidden }
#shell.peek .camera-guide { opacity:1 }

.nav-strip,.tools-strip,.app-tools { display:flex;align-items:center;gap:4px;min-height:43px;flex:none;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel) }
.nav-strip { min-height:48px }
.tools-strip { min-height:44px;padding-left:13px }
.app-tools { flex-wrap:wrap;gap:5px }
.app-tools select,.app-tools input { padding:5px 7px;max-width:100% }
.tools-strip .action { font-size:12px }
.tools-strip .primary { padding-inline:11px }
.spacer { flex:1;min-width:3px }
.trail { display:flex;align-items:center;flex:1;min-width:50px;height:31px;overflow:auto hidden;padding:0 6px;gap:1px;background:var(--deep);border:1px solid var(--line);border-radius:4px;scrollbar-width:none }
.trail button { flex:none;padding:3px 5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px }
.trail button:hover { background:var(--hover);color:var(--accent) }
.trail .ico { width:13px;height:13px;color:var(--quiet) }
.inline-search { display:flex;align-items:center;gap:6px;width:151px;flex:none;border:1px solid var(--line);border-radius:4px;background:var(--deep);height:31px;padding:0 7px;color:var(--quiet) }
.inline-search input { width:100%;padding:0;background:none;border:0;color:var(--ink);font-size:11px;outline-offset:2px }
.inline-search .ico { width:14px;height:14px }
.explorer-main { display:flex;position:relative;flex:1;min-height:0;min-width:0 }
.sidebar { background:var(--sidebar);width:157px;flex:none;border-right:1px solid var(--line);padding:11px 7px;overflow:auto;scrollbar-width:thin }
.sidebar h3 { margin:8px 0 7px 8px;font-size:10px;letter-spacing:.11em;font-weight:500;color:var(--quiet) }
.sidebar h3:not(:first-child) { margin-top:21px }
.side-row { display:flex;align-items:center;min-height:32px;color:var(--muted);border-radius:3px;position:relative }
.side-row.active { background:color-mix(in srgb,var(--accent) 12%,var(--sidebar));color:var(--ink) }
.side-row.active::before { content:'';width:2px;height:16px;background:var(--accent);position:absolute;left:0;top:8px }
.side-row:hover { background:var(--hover) }
.side-row button { display:flex;align-items:center;justify-content:flex-start;width:100%;min-width:0;gap:7px;padding:5px 6px 5px 8px;font-size:11px;white-space:nowrap;text-align:left }
.side-row button span { overflow:hidden;text-overflow:ellipsis }
.side-row .ico { width:14px;height:14px;color:var(--quiet) }
.side-row.active .ico { color:var(--accent) }
.side-row .tree-toggle { width:22px;flex:none;padding:4px;justify-content:center;min-height:30px }
.side-row .tree-toggle + button { padding-left:0 }
.side-row.sub { margin-left:calc(8px + var(--depth)*8px) }
.column-strip { display:flex;min-height:0;max-width:40%;overflow-x:auto;border-right:1px solid var(--line);background:var(--sidebar) }
.column-pane { flex:0 0 125px;overflow:auto;border-right:1px solid var(--line);padding:6px }
.column-pane:last-child { border:0 }
.column-pane b { display:block;font-size:10px;color:var(--quiet);margin:4px }
.file-scroll { flex:1;min-width:0;min-height:0;position:relative;overflow:auto;background:var(--panel);overscroll-behavior:contain;flex-basis:0 }
.file-scroll.select-mode { touch-action:none }
.list-head { display:block;position:sticky;top:0;z-index:3;width:max-content;min-width:100%;border-bottom:1px solid var(--line);background:var(--raised);height:34px }
.list-head-inner,.file-row { display:grid;grid-template-columns:var(--cols);width:max-content }
.col-title { text-align:left;position:relative;min-width:0;padding:0 12px;height:33px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted);user-select:none }
.col-title:hover { background:var(--hover);color:var(--ink) }
.col-title i { font:500 10px var(--mono);color:var(--accent);font-style:normal;margin-left:5px }
.col-title::after { content:'';position:absolute;right:0;top:8px;bottom:8px;width:1px;background:var(--line) }
.col-resize { width:9px;height:100%;position:absolute;right:0;top:0;z-index:1;cursor:col-resize;touch-action:none }
.file-rows { padding:3px 0 10px;min-width:max-content }
.file-item { cursor:default;user-select:none;color:var(--ink);position:relative;outline:none }
.file-row { min-height:38px;margin-bottom:3px;border:1px solid transparent;border-left:none;border-right:none;align-items:center }
.file-item:hover,.file-item:focus-visible { background:var(--hover) }
.file-item.selected { background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:color-mix(in srgb,var(--accent),transparent 76%) }
.file-item.drop-target,.desk-tile.drop-target { box-shadow:inset 0 0 0 1px var(--accent)!important;background:color-mix(in srgb,var(--accent) 21%,var(--panel))!important }
.file-cell { min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;text-align:left;color:var(--muted);font-size:11px }
.file-cell.name { color:var(--ink);display:flex;align-items:center;gap:8px;font-size:12px }
.file-cell.name span { overflow:hidden;text-overflow:ellipsis }
.file-cell.name,.file-grid .file-item { touch-action:none }
.file-cell.mono { font-size:10px }
.file-cell .ico { width:17px;height:17px }
.file-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));align-content:start;align-items:start;gap:8px;padding:11px }
.file-grid .file-item { min-width:0;display:flex;align-items:center;flex-direction:column;gap:5px;min-height:98px;padding:7px 4px;border:1px solid transparent;border-radius:5px; }
.thumb { width:72px;height:52px;display:grid;place-items:center;overflow:hidden;color:var(--muted) }
.thumb img { width:100%;height:100%;object-fit:contain;pointer-events:none }
.thumb svg { width:31px;height:31px }
.file-grid .file-label { max-width:100%;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap }
.file-folder { color:#d4a96a }.file-image { color:#a7b896 }.file-code { color:#ce9382 }.file-sheet { color:#83ad9b }.file-text { color:#b2beb9 }.file-media { color:#96aab4 }
[data-theme=light] .file-folder { color:#89601c } [data-theme=light] .file-image { color:#507049 } [data-theme=light] .file-code { color:#a4513e } [data-theme=light] .file-sheet,[data-theme=light] .file-text,[data-theme=light] .file-media { color:#446969 }
.file-kebab { display:none;position:absolute;right:2px;top:50%;transform:translateY(-50%);background:var(--raised);min-height:25px }
.file-grid .file-kebab { top:3px;transform:none }
.file-item:hover .file-kebab,.file-item:focus-within .file-kebab { display:inline-flex }
.rubber { position:absolute;pointer-events:none;z-index:6;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 17%,transparent) }
.file-state { display:flex;align-items:center;gap:9px;padding:24px;color:var(--muted);pointer-events:none }
.footer-strip { flex:none;min-height:31px;border-top:1px solid var(--line);background:var(--sidebar);display:flex;align-items:center;gap:9px;justify-content:space-between;color:var(--muted);font-size:10px;padding:5px 12px; }
.footer-strip span { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap }
.footer-strip .status-dot { margin-right:5px;width:5px;height:5px;vertical-align:middle }
.mobile-nav,.touch-select { display:none }

#taskbar { position:absolute;z-index:400;inset:auto 0 0;height:var(--dock-h);padding:0 17px 0 24px;display:flex;align-items:center;gap:12px;background:#101614f7;border-top:1px solid #384339;color:#d5dcce }
.start-button { display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border:1px solid #6b5639;border-radius:5px;background:#b58d4f22;color:#e1bc81;font-weight:600;white-space:nowrap;min-height:38px }
.start-button .ico { width:18px;height:18px }
.start-button:hover,.start-button[aria-expanded=true] { background:#c4a16732;border-color:#b28b55 }

  for(const [id,label] of Object.entries(settingTabs)){const b=btn(label,{appearance:'image',storage:'disk',interaction:'desk',diagnostics:'info'}[id],()=>w.selectTab(id));links.set(id,b);nav.append(b);}
  w.selectTab(tab);return w;
}
async function resetSystem() {
  const answer=await ask({title:'重置虚拟系统',text:'这会永久清除两个虚拟存储仓以及系统偏好。请先导出要保留的文件。输入「重置」确认。',fields:[{name:'word',label:'确认文字',required:true}],choices:[['reset','清除并重置']],danger:true});
  if(!answer)return;if(answer.values.word.trim()!=='重置')throw Error('确认文字不正确，没有清除数据。');
  if(vfs.depth)throw Error('有文件批量操作尚未结束，请稍后重试。');
  for(const w of wins.values()){w.closed=true;for(const fn of w.clean.splice(0))try{fn();}catch{}w.el.remove();}wins.clear();activeWin=null;
  clearTimeout(configTimer);await vfs.flush().catch(()=>{});
  if(opfsContainer){const entries=[];for await(const [name] of opfsContainer.entries())entries.push(name);for(const name of entries)await opfsContainer.removeEntry(name,{recursive:true});}
  if(db)await Promise.all([idTx('files','readwrite',s=>idReq(s.clear())),idTx('config','readwrite',s=>idReq(s.clear()))]);
  try {const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith('stratum.'))keys.push(k);}for(const k of keys)localStorage.removeItem(k);}catch{}
  try{document.cookie='stratum=; path=/; max-age=0';}catch{}
  location.reload();
}
async function runDiagnostics(log) {
  let fail=0,pass=0;
  const check=(condition,label)=>{if(condition){pass++;log('[通过] '+label);}else{fail++;log('[失败] '+label);}};
  const time=Date.UTC(2006,8,23,17,35,19,583),payload=new Uint8Array([0,4,9,87,242,255]);
  for(const root of [...vfs.mounts.keys()].filter(p=>parent(p)==='/')){
    const test=join(root,'.system/diagnostic-'+randomID());
    try{
      await fs.mkdir(test,{recursive:true});const a=join(test,'01.bin'),dest=join(test,'夹层'),b=join(dest,'02.bin');await fs.mkdir(dest,{mtime:time});
      await fs.writeFile(a,payload.buffer,{mtime:time});check(new Uint8Array(await fs.readFile(a,'arrayBuffer')).every((c,i)=>c===payload[i])&&(await fs.stat(a)).size===payload.length,pathLabel(root)+' 二进制往返');
      const info=await new Promise((ok,no)=>fs.stat(a,false,(err,result)=>err?no(err):ok(result)));check(info.lastModified===time&&info.isFile(),pathLabel(root)+' 时间与回调签名');
      await fs.rename(a,b);check(!await fs.exists(a)&&(await fs.stat(b)).lastModified===time,pathLabel(root)+' 搬移保留修改日期');
      check(await fs.folderSize(test)===payload.length,pathLabel(root)+' 递归目录大小');
      const zip=await buildZip([dest]), index=zipIndex(await zip.arrayBuffer()),unpacked=await readZip(zip);
      check(index.rows.find(r=>r.name.endsWith('02.bin'))?.time===time&&unpacked.find(r=>r.rel.endsWith('02.bin'))?.time===time,pathLabel(root)+' ZIP 毫秒级时间往返');
      check(unpacked.find(r=>r.rel.endsWith('02.bin'))?.file.size===payload.length,pathLabel(root)+' ZIP 解包与内容校验');
      const second=[...vfs.mounts.keys()].find(p=>p!==root&&['/opfs','/indexeddb'].includes(p));
      if(second){const y=join(second,'.system/diagnostic-copy-'+randomID());try{await fs.copy(b,y);check((await fs.stat(y)).lastModified===time,`${pathLabel(root)} → ${pathLabel(second)} 跨卷复制保留日期`);}finally{if(await fs.exists(y))await fs.delete(y);}}
    }catch(e){fail++;log('[失败] '+readable(e));}
    finally{try{if(await fs.exists(test))await fs.delete(test);}catch(e){fail++;log('[清理失败] '+readable(e));}}
  }
  check(parseDelimited('名称,值\r\n"有,逗号","含\n回行"\r\n',',')[1]?.[1]==='含\n回行','CSV 引号、逗号与多行值');
  check(arithmetic('-(2+3)^2+6/2')===-22,'计算器的括号、乘方与运算优先级');
  check(['1.jpg','10.jpg','2.jpg'].sort(collator.compare).join(',')==='1.jpg,2.jpg,10.jpg','长卷自然编号排序');
  const [width,height]=await imageDimensions(new Blob([storySVG],{type:'image/svg+xml'}))||[];
  check(width===860&&height===504,'长卷的 SVG 固有宽高占位');
  let blocked=false;try{safeArchiveParts('../越界')}catch{blocked=true;}check(blocked,'拒绝档案目录越界路径');
  log(`\n${pass} 项通过，${fail} 项失败。拖出浏览器、触摸、挂载权限、媒体编解码和镜像启动需在目标设备验证。`);
}

let systemReady=false, storageReady=null;
async function launch(id,options={}) {
  if(!APPS[id])throw Error('没有这个系统应用。');
  if(!systemReady&&storageReady)await storageReady;
  const existing=!options.newWindow&&[...wins.values()].sort((a,b)=>b.z-a.z).find(w=>w.app===id&&(['explorer','settings','calc'].includes(id)||options.path&&w.source===options.path||(!options.path&&['browser','vm'].includes(id))));
  if(existing){focusWindow(existing);if(id==='explorer'&&options.path)await existing.goto(options.path,{select:options.select});if(id==='settings'&&options.tab)existing.selectTab(options.tab);return existing;}
  const app={explorer:explorerApp,note:o=>documentApp({...o,code:false}),editor:o=>documentApp({...o,code:true}),browser:browserApp,settings:settingsApp,manga:mangaApp,image:imageApp,media:mediaApp,vm:vmApp,calc:calcApp,paint:paintApp,archive:archiveApp};
  const launched=await app[id](options);if(launched)launched.source=options.path||null;return launched;
}
async function openPath(raw,force,explorer) {
  const p=fs.canonical(raw),s=await withActivity('正在读取 '+basename(p)+'…',()=>fs.stat(p));
  if(s.kind==='directory'){if(explorer&&!explorer.closed){focusWindow(explorer);return explorer.goto(p);}return launch('explorer',{path:p});}
  if(force)return launch(force,{path:p});
  const e=ext(s.name),g=category(s)[0];
  if(htmlType(s))return launch('browser',{path:p});
  if(g==='image')return launch(prefs.imageApp,{path:p});
  if(g==='sound'||g==='media'||e==='pdf'||s.mime==='application/pdf')return launch('media',{path:p});
  if(archiveExt.has(e))return launch('archive',{path:p});
  if(diskExt.has(e))return launch('vm',{path:p});
  if(textType(s))return launch('note',{path:p});
  const a=await ask({title:'选择读取方式',text:`${s.name}\n${s.mime}  /  ${formatSize(s.size)}`,choices:[['text','以纯文本打开'],['download','下载原档案']]});
  if(a){if(a.action==='text')return launch('note',{path:p});return exportPaths([p]);}
}

const launchField=$('#launch-search'),launchBody=$('#launch-body');let launcherReq=0,launcherTimer=0,launcherAbort=null,calendarMonth=new Date();
function setLauncher(on) {
  $('#launcher').hidden=!on;for(const b of [$('#brand'),$('#start')])b.setAttribute('aria-expanded',String(on));
  if(!on){launcherAbort?.abort();clearTimeout(launcherTimer);launcherReq++;}
}
function showLauncher(search=false) {
  $('#calendar').hidden=true;$('#clock').setAttribute('aria-expanded','false');setLauncher(true);launchField.value='';renderLauncher('');if(search)launchField.focus();
}
async function renderLauncher(query) {
  launcherAbort?.abort();const seq=++launcherReq;launcherAbort=new AbortController();const {signal}=launcherAbort;
  launchBody.replaceChildren();const apps=Object.entries(APPS).filter(([id,[label,,eng]])=>!prefs.hidden.includes(id)&&(!query||`${label} ${eng} ${id}`.toLowerCase().includes(query.toLowerCase())));
  if(apps.length){const grid=node('div','launch-grid');for(const [id,[label,glyph]] of apps)grid.append(btn(label,glyph,()=>{setLauncher(false);return launch(id);},'launch-app'));launchBody.append(grid);}
  if(!query){
    const row=node('div','setting-options');row.style.marginTop='7px';row.style.borderTop='1px solid var(--line)';row.append(btn('上传到桌面','upload',()=>{setLauncher(false);return pickImport(desktop());}),btn('桌面菜单','more',e=>{const r=e.currentTarget.getBoundingClientRect();setLauncher(false);desktopMenu(r.left,r.top);}),btn('设置','settings',()=>{setLauncher(false);return launch('settings');}));launchBody.append(row);return;
  }
  const results=node('div');launchBody.append(results);setBusy(results,'正在搜索所有可访问档案…');
  try{
    if(!systemReady&&storageReady)await storageReady;const files=await fs.search(query,{signal,limit:110});if(seq!==launcherReq||signal.aborted)return;results.replaceChildren();
    results.append(node('div','menu-label',files.length?`档案 / ${files.length} 项`:'没有匹配的档案'));
    for(const s of files){const b=btn(s.name,category(s)[0],()=>{setLauncher(false);return openPath(s.path);},'menu-entry launch-result');$('span',b).append(node('small','',s.path));results.append(b);}
  }catch(e){if(seq===launcherReq)results.replaceChildren(node('div','menu-label',readable(e)));}
}
function tickClock() {
  const d=new Date(),clock=$('#clock');clock.replaceChildren(node('small','',`${d.getMonth()+1}月${d.getDate()}日`));
  const h=d.getHours();clock.append(document.createTextNode(`${pad(prefs.hour12?h%12||12:h)}:${pad(d.getMinutes())}${prefs.hour12?(h<12?' AM':' PM'):''}`));clock.title=new Intl.DateTimeFormat('zh-CN',{dateStyle:'full',timeStyle:'short'}).format(d);
}
function calendarRender() {
  const host=$('#calendar'),head=node('div','float-head'),today=new Date(),yr=calendarMonth.getFullYear(),month=calendarMonth.getMonth();
  head.append(node('strong','',`${yr} 年 ${month+1} 月`));const arrows=node('div','setting-options');
  arrows.append(btn('上个月','left',()=>{calendarMonth=new Date(yr,month-1,1);calendarRender();},'icon-btn'),btn('下个月','right',()=>{calendarMonth=new Date(yr,month+1,1);calendarRender();},'icon-btn'));head.append(arrows);
  const grid=node('div','cal-grid');for(const text of ['一','二','三','四','五','六','日'])grid.append(node('span','calendar-day quiet',text));const start=(new Date(yr,month,1).getDay()+6)%7;
  for(let i=0;i<42;i++){const d=new Date(yr,month,1+i-start);grid.append(node('span','calendar-day'+(d.toDateString()===today.toDateString()?' today':d.getMonth()!==month?' else':''),String(d.getDate())));}
  host.replaceChildren(head,grid,btn('返回今天','clock',()=>{calendarMonth=new Date();calendarRender();}));
}
function layoutWorkspace() {
  placeDesk();for(const w of wins.values()){if(!w.snap&&!w.el.classList.contains('manga-immersive')&&!isNarrow())w.geo=fitGeo(w.geo);drawWindow(w);w.resize?.();}
}
function bindShell() {
  $('#brand-glyph').innerHTML=$('#start-glyph').innerHTML=icon('mark');$('#global-search').innerHTML=icon('search');
  for(const b of [$('#brand'),$('#start')])b.onclick=()=>$('#launcher').hidden?showLauncher():setLauncher(false);
  $('#global-search').onclick=()=>showLauncher(true);
  $('#dock-store').onclick=()=>launch('settings',{tab:'storage'}).catch(report);
  launchField.oninput=()=>{clearTimeout(launcherTimer);launcherTimer=setTimeout(()=>renderLauncher(launchField.value.trim()),160);};
  launchField.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();launchBody.querySelector('button')?.click();}};
  $('#clock').onclick=()=>{const c=$('#calendar');if(c.hidden){setLauncher(false);calendarMonth=new Date();calendarRender();}c.hidden=!c.hidden;$('#clock').setAttribute('aria-expanded',String(!c.hidden));};
  $('#peek').onmouseenter=()=>{if(prefs.peek&&!peekLocked)setPeek(true);};$('#peek').onmouseleave=()=>{if(!peekLocked)setPeek(false);};$('#peek').onclick=()=>setPeek(!peekLocked,true);
  deskScroll.oncontextmenu=e=>{e.preventDefault();desktopMenu(e.clientX,e.clientY);};deskScroll.tabIndex=-1;
  deskScroll.addEventListener('pointerdown',e=>{if(e.button===0){activeWin?.el.classList.remove('active');activeWin=null;renderTasks();if(!e.target.closest('.desk-tile'))deskScroll.focus({preventScroll:true});}});
  deskBox=wireRubber(deskScroll,'.desk-tile',{selected:()=>deskSelection,apply:applyDeskSelection});wireTouchDrag(deskScroll,'.desk-tile',()=>deskSelection,applyDeskSelection,{desk:true});bindDrops();
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('#menu'))$('#menu').hidden=true;
    if(!e.target.closest('#launcher,#start,#brand,#global-search'))setLauncher(false);
    if(!e.target.closest('#calendar,#clock')){$('#calendar').hidden=true;$('#clock').setAttribute('aria-expanded','false');}
  });
  document.addEventListener('keydown',e=>{
    if(e.defaultPrevented||$('#dialog').open)return;
    const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
    if(ctrl&&e.shiftKey&&k==='f'){e.preventDefault();showLauncher(true);return;}
    if(e.key==='Escape'){if(!$('#menu').hidden){$('#menu').hidden=true;return;}if(!$('#launcher').hidden){setLauncher(false);return;}if(!$('#calendar').hidden){$('#calendar').hidden=true;$('#clock').setAttribute('aria-expanded','false');return;}if(peekLocked){setPeek(false,true);return;}}
    if(activeWin&&!peekLocked){
      if(ctrl&&e.altKey&&!isNarrow()&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();snapWindow(activeWin,{ArrowLeft:'left',ArrowRight:'right',ArrowUp:'max',ArrowDown:null}[e.key]);return;}
      if(activeWin.onKey?.(e))return;
    }else if(e.target===document.body||deskScroll.contains(e.target)){
      const selected=[...deskSelection].filter(k=>k.startsWith('/'));
      if(ctrl&&k==='a'){e.preventDefault();applyDeskSelection(new Set(deskIndex.keys()));}
      else if(ctrl&&k==='v'){e.preventDefault();pasteFiles(desktop()).catch(report);}
      else if(ctrl&&['c','x'].includes(k)&&selected.length){e.preventDefault();holdFiles(selected,k==='x');}
      else if(e.key==='Delete'&&selected.length){e.preventDefault();removeItems(selected).catch(report);}
      else if(e.key==='F2'&&selected.length===1){e.preventDefault();renameItem(selected[0]).catch(report);}
      else if(e.key==='Escape')applyDeskSelection(new Set());
    }
  });
  if('ResizeObserver' in window)new ResizeObserver(layoutWorkspace).observe(workspace);else window.addEventListener('resize',layoutWorkspace);
  setInterval(tickClock,5000);tickClock();
}
async function boot() {
  applyPrefs();bindShell();renderTasks();renderDesk().catch(report);
  storageReady=initStorage().then(()=>{systemReady=true;}).catch(e=>{bootWarnings.push('初始化未完成：'+readable(e));systemReady=true;});
  const first=explorerApp({startup:true,waiting:true});
  await storageReady;renderTasks();tickClock();
  await Promise.all([renderDesk(),first.closed?null:first.goto(archive(),{select:join(archive(),'01_交接通告.txt')})]);
  if(prefs.customWall)try{await setWallpaper(prefs.customWall);}catch{bootWarnings.push('已恢复内置壁纸：找不到自定义图片。');}
  for(const warning of bootWarnings)toast(warning,true);
  const waiting=[...mountRecords.values()].filter(r=>!vfs.mounts.has(r.path));if(waiting.length)toast(`${waiting.length} 个本地目录待接入。请在存储设置中重新授权。`);
  let deskTimer=0;fs.subscribe(paths=>{
    for(const k of [...dragCache.keys()])if(paths.some(p=>descendant(k,p)||descendant(p,k)))dragCache.delete(k);
    if(paths.some(p=>descendant(p,desktop())||descendant(desktop(),p))){clearTimeout(deskTimer);deskTimer=setTimeout(()=>renderDesk().catch(report),80);}
  });
  if(new URLSearchParams(location.search).has('selftest')){const w=await launch('settings',{tab:'diagnostics'});w.runTests?.();}
}
boot().catch(report);
