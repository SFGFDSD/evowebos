<style>
/* ============ ROOT VARIABLES ============ */
:root{
  --bg-0:#0f1411;
  --bg-1:#171d18;
  --bg-2:#1e2620;
  --bg-3:#263028;
  --ink-0:#f2e9d4;
  --ink-1:#d4c9a8;
  --ink-2:#9a9078;
  --ink-3:#6a6250;
  --amber:#d97706;
  --amber-glow:#f59e0b;
  --vermilion:#c2410c;
  --sage:#78866b;
  --sage-deep:#4d5a43;
  --moss:#6b8e3d;
  --line:rgba(212,201,168,0.14);
  --line-strong:rgba(212,201,168,0.28);
  --glass:rgba(23,29,24,0.82);
  --glass-strong:rgba(15,20,17,0.94);
  --shadow-1:0 2px 8px rgba(0,0,0,0.35);
  --shadow-2:0 12px 40px rgba(0,0,0,0.55);
  --shadow-3:0 30px 80px rgba(0,0,0,0.7);
  --font-display:"Fraunces",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --font-ui:"Instrument Sans",system-ui,sans-serif;
  --r-sm:3px;
  --r-md:6px;
  --r-lg:10px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-ui);color:var(--ink-0);background:var(--bg-0);font-size:14px;line-height:1.5;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit;outline:none}
::selection{background:var(--amber);color:var(--bg-0)}

/* ============ DESKTOP ============ */
#desktop{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(217,119,6,0.08), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(107,142,61,0.06), transparent 50%),
    linear-gradient(135deg,#0f1411 0%,#141a15 50%,#0f1411 100%);
  background-size:cover;background-position:center;
  overflow:hidden;
}
#desktop::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(212,201,168,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,201,168,0.02) 1px, transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
}
#wallpaper-layer{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;pointer-events:none}
#icon-layer{position:absolute;inset:0;z-index:1}
#selection-box{position:absolute;border:1px solid var(--amber);background:rgba(217,119,6,0.12);z-index:5;pointer-events:none;display:none}

/* ============ DESKTOP ICONS ============ */
.dsk-icon{
  position:absolute;width:84px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 4px;border-radius:var(--r-md);
  cursor:pointer;text-align:center;
  transition:background 0.15s;
  z-index:2;
}
.dsk-icon:hover{background:rgba(212,201,168,0.06)}
.dsk-icon.selected{background:rgba(217,119,6,0.18);box-shadow:inset 0 0 0 1px rgba(217,119,6,0.4)}
.dsk-icon.dragging{opacity:0.5}
.dsk-icon-img{
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bg-2),var(--bg-3));
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:8px;
  box-shadow:var(--shadow-1);
}
.dsk-icon-img svg{width:100%;height:100%}
.dsk-icon-label{
  font-size:11px;color:var(--ink-0);
  font-weight:500;letter-spacing:0.02em;
  text-shadow:0 1px 3px rgba(0,0,0,0.9);
  max-width:80px;word-wrap:break-word;line-height:1.25;
  padding:1px 3px;border-radius:2px;
}
.dsk-icon.selected .dsk-icon-label{background:rgba(217,119,6,0.3)}

/* ============ TASKBAR ============ */
#taskbar{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  height:54px;padding:0 10px;
  display:flex;align-items:center;gap:6px;
  background:var(--glass-strong);
  backdrop-filter:blur(24px) saturate(1.2);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid var(--line-strong);
  border-radius:14px;
  box-shadow:var(--shadow-2);
  z-index:1000;
  max-width:calc(100vw - 24px);
}
#start-btn{
  width:40px;height:40px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--amber),var(--vermilion));
  color:var(--bg-0);
  transition:transform 0.15s, box-shadow 0.15s;
}
#start-btn:hover{transform:scale(1.06);box-shadow:0 4px 16px rgba(217,119,6,0.4)}
#start-btn svg{width:22px;height:22px}
#tb-sep{width:1px;height:28px;background:var(--line-strong);margin:0 4px}
#task-list{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:60vw}
#task-list::-webkit-scrollbar{display:none}
.tb-item{
  height:40px;padding:0 12px;
  display:flex;align-items:center;gap:8px;
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:8px;font-size:12px;color:var(--ink-1);
  white-space:nowrap;
  transition:all 0.15s;
}
.tb-item:hover{background:var(--bg-3);color:var(--ink-0)}
.tb-item.active{background:var(--amber);color:var(--bg-0);border-color:var(--amber)}
.tb-item svg{width:16px;height:16px}
#tb-clock{
  padding:0 12px;font-family:var(--font-mono);font-size:12px;
  color:var(--ink-1);display:flex;flex-direction:column;align-items:flex-end;
  line-height:1.2;font-variant-numeric:tabular-nums;
}
#tb-clock .date{font-size:10px;color:var(--ink-2)}

/* ============ START MENU ============ */
#start-menu{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(10px);
  width:480px;max-width:calc(100vw - 24px);max-height:60vh;
  background:var(--glass-strong);
  backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid var(--line-strong);
  border-radius:14px;
  box-shadow:var(--shadow-3);
  padding:14px;
  display:none;z-index:999;
  opacity:0;transition:opacity 0.18s, transform 0.18s;
}
#start-menu.open{display:flex;flex-direction:column;opacity:1;transform:translateX(-50%) translateY(0)}
#start-menu h3{
  font-family:var(--font-display);font-weight:400;font-style:italic;
  font-size:22px;color:var(--amber);letter-spacing:-0.01em;
  margin-bottom:4px;
}
#start-menu .subtitle{font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:14px}
#start-search{
  width:100%;padding:10px 14px;
  background:var(--bg-1);border:1px solid var(--line);
  border-radius:var(--r-md);color:var(--ink-0);font-size:13px;
  margin-bottom:12px;
}
#start-search:focus{border-color:var(--amber)}
#app-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:8px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent;
}
.app-tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 6px;border-radius:var(--r-md);
  cursor:pointer;text-align:center;
  transition:background 0.15s;
}
.app-tile:hover{background:rgba(217,119,6,0.14)}
.app-tile-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--amber)}
.app-tile-icon svg{width:100%;height:100%}
.app-tile-name{font-size:11px;color:var(--ink-1);line-height:1.2}

/* ============ WINDOWS ============ */
.win{
  position:absolute;min-width:280px;min-height:180px;
  background:var(--bg-1);
  border:1px solid var(--line-strong);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);
  display:flex;flex-direction:column;overflow:hidden;
  color:var(--ink-0);
  animation:winOpen 0.18s ease-out;
}
@keyframes winOpen{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.win.minimized{display:none}
.win.maximized{border-radius:0}
.win-titlebar{
  height:38px;padding:0 10px 0 14px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border-bottom:1px solid var(--line);
  cursor:grab;flex-shrink:0;
}
.win-titlebar.dragging{cursor:grabbing}
.win-title-icon{width:18px;height:18px;color:var(--amber);flex-shrink:0}
.win-title-icon svg{width:100%;height:100%}
.win-title-text{
  font-family:var(--font-display);font-weight:500;font-size:14px;
  color:var(--ink-0);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:-0.005em;
}
.win-controls{display:flex;gap:4px}
.win-btn{
  width:26px;height:26px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);
  transition:background 0.12s, color 0.12s;
}
.win-btn:hover{background:var(--bg-3);color:var(--ink-0)}
.win-btn.close:hover{background:var(--vermilion);color:var(--ink-0)}
.win-btn svg{width:12px;height:12px}
.win-body{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg-0);position:relative}
.win-resize-handle{position:absolute;z-index:10}
.win-resize-handle.n{top:-3px;left:8px;right:8px;height:6px;cursor:n-resize}
.win-resize-handle.s{bottom:-3px;left:8px;right:8px;height:6px;cursor:s-resize}
.win-resize-handle.e{right:-3px;top:8px;bottom:8px;width:6px;cursor:e-resize}
.win-resize-handle.w{left:-3px;top:8px;bottom:8px;width:6px;cursor:w-resize}
.win-resize-handle.ne{top:-3px;right:-3px;width:12px;height:12px;cursor:ne-resize}
.win-resize-handle.nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nw-resize}
.win-resize-handle.se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:se-resize}
.win-resize-handle.sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:sw-resize}

/* ============ CONTEXT MENU ============ */
.ctx-menu{
  position:fixed;
  background:var(--glass-strong);
  backdrop-filter:blur(20px);
  border:1px solid var(--line-strong);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-2);
  padding:4px;min-width:200px;
  z-index:2000;display:none;
  font-size:12px;
}
.ctx-menu.open{display:block}
.ctx-item{
  padding:7px 14px;border-radius:3px;
  display:flex;align-items:center;gap:10px;
  color:var(--ink-1);cursor:pointer;
  transition:background 0.1s;
}
.ctx-item:hover{background:var(--amber);color:var(--bg-0)}
.ctx-item.disabled{opacity:0.4;pointer-events:none}
.ctx-item svg{width:14px;height:14px;flex-shrink:0}
.ctx-item .kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-2)}
.ctx-item:hover .kbd{color:var(--bg-0)}
.ctx-sep{height:1px;background:var(--line);margin:4px 0}

/* ============ FILE EXPLORER ============ */
.fe{display:flex;flex:1;overflow:hidden}
.fe-side{
  width:200px;background:var(--bg-1);
  border-right:1px solid var(--line);
  overflow-y:auto;flex-shrink:0;
  padding:10px 6px;font-size:12px;
}
.fe-side h4{font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:var(--ink-2);padding:6px 8px;font-weight:600}
.fe-side-item{
  padding:6px 8px;border-radius:4px;
  display:flex;align-items:center;gap:8px;
  color:var(--ink-1);cursor:pointer;
  transition:background 0.1s;
}
.fe-side-item:hover{background:var(--bg-2);color:var(--ink-0)}
.fe-side-item.active{background:var(--amber);color:var(--bg-0)}
.fe-side-item svg{width:14px;height:14px;flex-shrink:0}
.fe-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-0)}
.fe-toolbar{
  height:42px;padding:0 10px;
  display:flex;align-items:center;gap:6px;
  border-bottom:1px solid var(--line);
  background:var(--bg-1);flex-shrink:0;
}
.fe-tb-btn{
  height:28px;padding:0 10px;
  display:flex;align-items:center;gap:6px;
  border-radius:4px;font-size:12px;color:var(--ink-1);
  transition:background 0.12s;
}
.fe-tb-btn:hover{background:var(--bg-3);color:var(--ink-0)}
.fe-tb-btn.disabled{opacity:0.4;pointer-events:none}
.fe-tb-btn svg{width:14px;height:14px}
.fe-breadcrumb{
  flex:1;display:flex;align-items:center;gap:2px;
  padding:0 8px;height:28px;
  background:var(--bg-0);border:1px solid var(--line);
  border-radius:4px;font-family:var(--font-mono);font-size:11px;
  color:var(--ink-1);overflow-x:auto;white-space:nowrap;
  scrollbar-width:none;
}
.fe-breadcrumb::-webkit-scrollbar{display:none}
.fe-crumb{color:var(--ink-2);cursor:pointer;padding:2px 4px;border-radius:2px}
.fe-crumb:hover{background:var(--bg-2);color:var(--ink-0)}
.fe-crumb.current{color:var(--amber)}
.fe-crumb-sep{color:var(--ink-3);margin:0 2px}
.fe-search{
  width:160px;height:28px;padding:0 10px;
  background:var(--bg-0);border:1px solid var(--line);
  border-radius:4px;font-size:12px;color:var(--ink-0);
}
.fe-search:focus{border-color:var(--amber);width:200px}
.fe-list-header{
  display:grid;
  grid-template-columns:1fr 100px 100px 140px;
  padding:6px 14px;font-size:11px;color:var(--ink-2);
  border-bottom:1px solid var(--line);
  background:var(--bg-1);font-weight:500;
  text-transform:uppercase;letter-spacing:0.08em;
  cursor:pointer;user-select:none;
}
.fe-list-header > div:hover{color:var(--amber)}
.fe-list-header .sorted{color:var(--amber)}
.fe-list{flex:1;overflow-y:auto;padding:4px}
.fe-item{
  display:grid;
  grid-template-columns:1fr 100px 100px 140px;
  padding:7px 14px;font-size:12px;
  border-radius:3px;
  color:var(--ink-1);cursor:pointer;
  align-items:center;
  transition:background 0.08s;
}
.fe-item:hover{background:var(--bg-2)}
.fe-item.selected{background:rgba(217,119,6,0.18);color:var(--ink-0)}
.fe-item-name{display:flex;align-items:center;gap:10px;overflow:hidden}
.fe-item-name svg{width:18px;height:18px;flex-shrink:0;color:var(--amber)}
.fe-item-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fe-item .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.fe-empty{padding:40px;text-align:center;color:var(--ink-2);font-style:italic;font-family:var(--font-display);font-size:16px}
.fe-status{
  height:24px;padding:0 14px;
  display:flex;align-items:center;gap:16px;
  font-size:10px;color:var(--ink-2);
  border-top:1px solid var(--line);
  background:var(--bg-1);font-family:var(--font-mono);
  flex-shrink:0;
}

/* ============ NOTEPAD ============ */
.np{display:flex;flex-direction:column;flex:1;overflow:hidden}
.np-toolbar{
  height:36px;padding:0 10px;
  display:flex;align-items:center;gap:4px;
  border-bottom:1px solid var(--line);background:var(--bg-1);flex-shrink:0;
}
.np-btn{
  height:26px;padding:0 10px;font-size:11px;
  border-radius:3px;color:var(--ink-1);
  display:flex;align-items:center;gap:6px;
  transition:background 0.1s;
}
.np-btn:hover{background:var(--bg-3);color:var(--ink-0)}
.np-btn.primary{background:var(--amber);color:var(--bg-0)}
.np-btn.primary:hover{background:var(--amber-glow)}
.np-btn svg{width:12px;height:12px}
.np-area{
  flex:1;width:100%;padding:16px 20px;
  background:var(--bg-0);color:var(--ink-0);
  border:none;resize:none;
  font-family:var(--font-mono);font-size:13px;line-height:1.6;
}
.np-area:focus{outline:none}
.np-status{
  height:22px;padding:0 12px;
  display:flex;align-items:center;gap:16px;
  font-size:10px;color:var(--ink-2);
  border-top:1px solid var(--line);background:var(--bg-1);
  font-family:var(--font-mono);flex-shrink:0;
}

/* ============ TABLE VIEW ============ */
.tbl-wrap{flex:1;overflow:auto;background:var(--bg-0)}
table.tbl{border-collapse:collapse;width:100%;font-size:12px;font-family:var(--font-mono)}
.tbl th,.tbl td{padding:6px 12px;border:1px solid var(--line);text-align:left}
.tbl th{background:var(--bg-1);color:var(--amber);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;position:sticky;top:0}
.tbl td{color:var(--ink-1)}
.tbl tr:hover td{background:var(--bg-2)}

/* ============ HTML EDITOR ============ */
.he{display:flex;flex-direction:column;flex:1;overflow:hidden}
.he-toolbar{
  padding:6px 8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--bg-1);flex-shrink:0;
}
.he-btn{
  height:26px;padding:0 10px;font-size:11px;
  border-radius:3px;color:var(--ink-1);
  display:flex;align-items:center;gap:5px;
  transition:background 0.1s;border:1px solid transparent;
}
.he-btn:hover{background:var(--bg-3);color:var(--ink-0)}
.he-btn.run{background:var(--moss);color:var(--bg-0)}
.he-btn.run:hover{background:#7ea24a}
.he-sep{width:1px;height:20px;background:var(--line-strong);margin:0 2px}
.he-select{
  height:26px;padding:0 8px;
  background:var(--bg-0);border:1px solid var(--line);
  border-radius:3px;color:var(--ink-0);font-size:11px;
}
.he-split{flex:1;display:flex;overflow:hidden;position:relative}
.he-editor{flex:1;min-width:200px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.he-divider{
  width:5px;background:var(--bg-2);cursor:col-resize;
  position:relative;flex-shrink:0;
}
.he-divider:hover,.he-divider.active{background:var(--amber)}
.he-preview{flex:1;min-width:120px;background:white;position:relative;overflow:hidden}
.he-preview iframe{width:100%;height:100%;border:none;background:white}
.he-findbar{
  display:none;padding:8px 12px;
  background:var(--bg-1);border-bottom:1px solid var(--line);
  gap:6px;align-items:center;font-size:11px;flex-shrink:0;
}
.he-findbar.open{display:flex;flex-wrap:wrap}
.he-findbar input{
  height:24px;padding:0 8px;
  background:var(--bg-0);border:1px solid var(--line);
  border-radius:3px;color:var(--ink-0);font-size:11px;width:180px;
  font-family:var(--font-mono);
}
.he-findbar input:focus{border-color:var(--amber)}
.he-findbar .matches{color:var(--ink-2);font-family:var(--font-mono);padding:0 4px}
.he-findbar .toggle{
  padding:2px 6px;border-radius:3px;font-family:var(--font-mono);
  border:1px solid var(--line);color:var(--ink-2);font-size:10px;
}
.he-findbar .toggle.on{background:var(--amber);color:var(--bg-0);border-color:var(--amber)}
.he-status{
  height:22px;padding:0 12px;
  display:flex;align-items:center;gap:14px;
  font-size:10px;color:var(--ink-2);
  border-top:1px solid var(--line);background:var(--bg-1);
  font-family:var(--font-mono);flex-shrink:0;
}
.CodeMirror{flex:1;height:100% !important;font-family:var(--font-mono) !important;font-size:13px}
.CodeMirror .cm-matchhighlight{background:rgba(217,119,6,0.25)}
.CodeMirror .CodeMirror-selected{background:rgba(217,119,6,0.3) !important}
.cm-searching{background:rgba(217,119,6,0.3) !important}
.cm-current-searching{background:var(--amber) !important;color:var(--bg-0) !important}

/* ============ MANGA VIEWER ============ */
.mv{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#000}
.mv-toolbar{
  height:36px;padding:0 10px;
  display:flex;align-items:center;gap:6px;
  background:var(--bg-1);border-bottom:1px solid var(--line);flex-shrink:0;
}
.mv-title{flex:1;font-family:var(--font-display);font-size:13px;color:var(--ink-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  background:#000;display:flex;flex-direction:column;align-items:center;
  scrollbar-width:thin;scrollbar-color:var(--ink-3) #000;
}
.mv-scroll::-webkit-scrollbar{width:8px}
.mv-scroll::-webkit-scrollbar-track{background:#000}
.mv-scroll::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:4px}
.mv-scroll img{
  width:100%;max-width:1000px;display:block;
  pointer-events:none;user-select:none;
}
.mv-loading{color:var(--ink-2);font-style:italic;font-family:var(--font-display);padding:40px;text-align:center}
.win.fullscreen-manga .win-titlebar{display:none}
.win.fullscreen-manga{border-radius:0}
.mv-exit-fs{
  position:fixed;top:16px;right:16px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,0.7);color:white;
  display:none;align-items:center;justify-content:center;
  z-index:9999;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.2);
}
.win.fullscreen-manga ~ .mv-exit-fs,.mv-exit-fs.visible{display:flex}

/* ============ BROWSER ============ */
.br{display:flex;flex-direction:column;flex:1;overflow:hidden}
.br-bar{
  height:40px;padding:0 8px;
  display:flex;align-items:center;gap:4px;
  background:var(--bg-1);border-bottom:1px solid var(--line);flex-shrink:0;
}
.br-btn{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink-1);transition:background 0.1s}
.br-btn:hover{background:var(--bg-3)}
.br-btn svg{width:14px;height:14px}
.br-url{
  flex:1;height:28px;padding:0 12px;
  background:var(--bg-0);border:1px solid var(--line);
  border-radius:4px;color:var(--ink-0);
  font-family:var(--font-mono);font-size:11px;
}
.br-url:focus{border-color:var(--amber)}
.br-view{flex:1;background:white}
.br-view iframe{width:100%;height:100%;border:none}

/* ============ CALCULATOR ============ */
.calc{display:flex;flex-direction:column;padding:14px;background:var(--bg-0);flex:1}
.calc-disp{
  padding:16px 18px;background:var(--bg-1);
  border:1px solid var(--line);border-radius:var(--r-md);
  text-align:right;font-family:var(--font-mono);font-size:28px;
  color:var(--amber);margin-bottom:12px;min-height:70px;
  word-break:break-all;overflow-wrap:break-word;
  font-variant-numeric:tabular-nums;
}
.calc-disp .prev{font-size:13px;color:var(--ink-3);min-height:16px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.calc-btn{
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-md);font-size:16px;color:var(--ink-0);
  font-family:var(--font-mono);font-weight:500;
  transition:all 0.1s;min-height:40px;
}
.calc-btn:hover{background:var(--bg-3);border-color:var(--line-strong)}
.calc-btn.op{color:var(--amber)}
.calc-btn.eq{background:var(--amber);color:var(--bg-0);border-color:var(--amber)}
.calc-btn.eq:hover{background:var(--amber-glow)}
.calc-btn.clr{color:var(--vermilion)}

/* ============ PAINT ============ */
.pt{display:flex;flex-direction:column;flex:1;overflow:hidden}
.pt-toolbar{
  height:44px;padding:0 10px;
  display:flex;align-items:center;gap:8px;
  background:var(--bg-1);border-bottom:1px solid var(--line);flex-shrink:0;
}
.pt-tool{
  width:30px;height:30px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-1);border:1px solid transparent;
}
.pt-tool.active{background:var(--amber);color:var(--bg-0);border-color:var(--amber)}
.pt-tool svg{width:16px;height:16px}
.pt-colors{display:flex;gap:3px;margin:0 4px}
.pt-color{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);cursor:pointer}
.pt-color.active{box-shadow:0 0 0 2px var(--amber)}
.pt-canvas-wrap{flex:1;overflow:auto;background:repeating-conic-gradient(#1a1a1a 0% 25%,#222 0% 50%) 50%/16px 16px;display:flex;align-items:center;justify-content:center;padding:20px}
.pt-canvas{background:white;cursor:crosshair;box-shadow:var(--shadow-2)}

/* ============ SETTINGS ============ */
.st{display:flex;flex:1;overflow:hidden}
.st-side{width:180px;background:var(--bg-1);border-right:1px solid var(--line);padding:10px 6px}
.st-side-item{
  padding:8px 12px;border-radius:4px;font-size:12px;
  color:var(--ink-1);cursor:pointer;display:flex;align-items:center;gap:10px;
}
.st-side-item:hover{background:var(--bg-2)}
.st-side-item.active{background:var(--amber);color:var(--bg-0)}
.st-side-item svg{width:14px;height:14px}
.st-main{flex:1;padding:20px 26px;overflow-y:auto}
.st-main h2{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--amber);margin-bottom:4px}
.st-main .lead{color:var(--ink-2);font-size:12px;margin-bottom:20px;font-style:italic}
.st-section{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.st-section:last-child{border-bottom:none}
.st-section h3{font-size:13px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-1);margin-bottom:12px;font-weight:600}
.st-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.st-label{font-size:12px;color:var(--ink-1);min-width:120px}
.st-btn{
  padding:8px 16px;background:var(--bg-2);border:1px solid var(--line-strong);
  border-radius:4px;font-size:12px;color:var(--ink-0);
  transition:all 0.12s;
}
.st-btn:hover{background:var(--bg-3);border-color:var(--amber)}
.st-btn.danger{background:var(--vermilion);border-color:var(--vermilion);color:var(--ink-0)}
.st-btn.primary{background:var(--amber);color:var(--bg-0);border-color:var(--amber)}
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-tile{
  aspect-ratio:16/10;border-radius:var(--r-md);
  border:2px solid transparent;cursor:pointer;
  background-size:cover;background-position:center;
  transition:border-color 0.15s;
}
.wp-tile:hover{border-color:var(--ink-2)}
.wp-tile.active{border-color:var(--amber)}
.storage-bar{height:22px;background:var(--bg-2);border-radius:4px;overflow:hidden;display:flex;margin:8px 0}
.storage-seg{height:100%;transition:width 0.3s}
.storage-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--ink-1);margin-top:8px}
.storage-legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:middle}

/* ============ IMAGE VIEWER ============ */
.iv{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#0a0a0a}
.iv-toolbar{height:38px;padding:0 10px;display:flex;align-items:center;gap:4px;background:var(--bg-1);border-bottom:1px solid var(--line);flex-shrink:0}
.iv-view{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
.iv-view img{max-width:100%;max-height:100%;object-fit:contain}

/* ============ MEDIA PLAYER ============ */
.mp{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#000}
.mp-view{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.mp-view video,.mp-view audio{max-width:100%;max-height:100%}

/* ============ PDF VIEWER ============ */
.pv{flex:1;display:flex;overflow:hidden}
.pv iframe{flex:1;border:none;background:white}

/* ============ DIALOG ============ */
.dialog-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center;
  z-index:3000;backdrop-filter:blur(4px);
}
.dialog{
  background:var(--bg-1);border:1px solid var(--line-strong);
  border-radius:var(--r-lg);padding:20px;min-width:320px;max-width:500px;
  box-shadow:var(--shadow-3);
}
.dialog h3{font-family:var(--font-display);font-size:18px;color:var(--amber);margin-bottom:8px}
.dialog p{font-size:13px;color:var(--ink-1);margin-bottom:16px;line-height:1.5}
.dialog input{
  width:100%;padding:8px 12px;
  background:var(--bg-0);border:1px solid var(--line);
  border-radius:4px;color:var(--ink-0);font-size:13px;margin-bottom:14px;
}
.dialog input:focus{border-color:var(--amber);outline:none}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}

/* ============ TOAST ============ */
#toast-container{position:fixed;top:20px;right:20px;z-index:5000;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:10px 16px;background:var(--glass-strong);
  border:1px solid var(--line-strong);border-left:3px solid var(--amber);
  border-radius:4px;font-size:12px;color:var(--ink-0);
  box-shadow:var(--shadow-2);backdrop-filter:blur(12px);
  animation:toastIn 0.2s ease-out;max-width:320px;
}
.toast.err{border-left-color:var(--vermilion)}
.toast.ok{border-left-color:var(--moss)}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============ MOBILE ============ */
@media (max-width:768px){
  #taskbar{bottom:6px;height:48px;padding:0 6px;gap:4px;width:calc(100vw - 12px)}
  #tb-clock{display:none}
  .dsk-icon{width:72px}
  .dsk-icon-img{width:42px;height:42px}
  .dsk-icon-label{font-size:10px}
  #start-menu{width:calc(100vw - 12px);bottom:60px}
  .fe-side{width:140px}
  .fe-list-header,.fe-item{grid-template-columns:1fr 80px 90px;font-size:11px}
  .fe-list-header > div:nth-child(3),.fe-item > div:nth-child(3){display:none}
  .win{border-radius:0}
}
@media (max-width:480px){
  .fe-side{display:none}
  .fe-list-header,.fe-item{grid-template-columns:1fr 80px}
  .fe-list-header > div:nth-child(4),.fe-item > div:nth-child(4){display:none}
}

<script>
/* =========================================================================
   SAGE OS — Single-file browser desktop
   ========================================================================= */

'use strict';

/* ============ UTIL ============ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = ()=> 'u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg,type=''){
  const c=$('#toast-container');
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(120%)';t.style.transition='all 0.25s';setTimeout(()=>t.remove(),260)},3500);
}

function formatBytes(n){
  if(n==null||isNaN(n))return '—';
  if(n<1024)return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++}while(n>=1024&&i<u.length-1);
  return n.toFixed(n<10?1:0)+' '+u[i];
}
function formatDate(d){
  if(!d)return '—';
  const dt=d instanceof Date?d:new Date(d);
  const pad=n=>String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function extOf(name){
  const m=/\.([^.\\/]*)$/.exec(name||'');
  return m?m[1].toLowerCase():'';
}
function mimeOf(name){
  const e=extOf(name);
  const map={
    png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',ico:'image/x-icon',svg:'image/svg+xml',
    mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',aac:'audio/aac',m4a:'audio/mp4',
    mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',mov:'video/quicktime',mkv:'video/x-matroska',
    pdf:'application/pdf',
    html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',
    json:'application/json',xml:'application/xml',svg2:'image/svg+xml',md:'text/markdown',txt:'text/plain',
    csv:'text/csv',tsv:'text/tab-separated-values',yaml:'text/yaml',yml:'text/yaml',log:'text/plain',
    zip:'application/zip',gz:'application/gzip',tar:'application/x-tar',
  };
  return map[e]||'application/octet-stream';
}
function categoryOf(name){
  const e=extOf(name);
  const img=['png','jpg','jpeg','gif','webp','bmp','ico','svg'];
  const aud=['mp3','wav','ogg','flac','aac','m4a'];
  const vid=['mp4','webm','ogv','mov','mkv'];
  const txt=['txt','html','htm','css','js','mjs','json','xml','md','yaml','yml','log','csv','tsv','svg'];
  const zip=['zip','gz','tar','tgz'];
  if(img.includes(e))return 'image';
  if(aud.includes(e))return 'audio';
  if(vid.includes(e))return 'video';
  if(e==='pdf')return 'pdf';
  if(zip.includes(e))return 'archive';
  if(txt.includes(e))return 'text';
  return 'unknown';
}
function naturalSort(a,b){
  return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
}

/* ============ ICONS (SVG set) ============ */
const ICONS = {

  image:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8.5" cy="10" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg>`,

  audio:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg>`,
  archive:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M10 4v16M10 8h4M10 12h4M10 16h4"/></svg>`,

/* ============ OPFS WRAPPER — fs MODULE ============ */
const fs = (function(){
  let root=null;
  let fallback=null; // IndexedDB fallback
  const useFallback = !('storage' in navigator) || !navigator.storage?.getDirectory;

  // IndexedDB fallback implementation
  const IDB = {
    db:null,
    async init(){
      return new Promise((res,rej)=>{
        const r=indexedDB.open('sageos-vfs',1);
        r.onupgradeneeded=()=>{
          const db=r.result;
          if(!db.objectStoreNames.contains('nodes'))db.createObjectStore('nodes',{keyPath:'path'});
          if(!db.objectStoreNames.contains('data'))db.createObjectStore('data',{keyPath:'path'});
        };
        r.onsuccess=()=>{this.db=r.result;res()};
        r.onerror=()=>rej(r.error);
      });
    },
    tx(store,mode='readonly'){return this.db.transaction(store,mode).objectStore(store)},
    async get(path){
      return new Promise((res,rej)=>{
        const r=this.tx('nodes').get(path);
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
      });
    },
    async put(node){
      return new Promise((res,rej)=>{
        const r=this.tx('nodes','readwrite').put(node);
        r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
      });
    },
    async del(path){
      return new Promise((res,rej)=>{
        const r=this.tx('nodes','readwrite').delete(path);
        r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
      });
    },
    async setData(path,blob){
      return new Promise((res,rej)=>{
        const r=this.tx('data','readwrite').put({path,blob});
        r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
      });
    },
    async getData(path){
      return new Promise((res,rej)=>{
        const r=this.tx('data').get(path);
        r.onsuccess=()=>res(r.result?.blob);r.onerror=()=>rej(r.error);
      });
    },
    async delData(path){
      return new Promise((res,rej)=>{
        const r=this.tx('data','readwrite').delete(path);
        r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
      });
    },
  };

  function normPath(p){
    if(!p)return '/';
    let s=p.replace(/\\/g,'/');
    if(!s.startsWith('/'))s='/'+s;
    s=s.replace(/\/+$/,'')||'/';
    return s;
  }
  function parentPath(p){
    p=normPath(p);if(p==='/')return '/';
    const i=p.lastIndexOf('/');
    return i===0?'/':p.slice(0,i);
  }
  function baseName(p){
    p=normPath(p);if(p==='/')return '';
    return p.slice(p.lastIndexOf('/')+1);
  }

  async function getNode(path){
    path=normPath(path);
    if(path==='/')return {path:'/',type:'directory',name:'',mtime:Date.now(),ctime:Date.now()};
    if(useFallback){
      const n=await IDB.get(path);
      if(!n)throw new Error('ENOENT: '+path);
      return n;
    }
    const parts=path.split('/').filter(Boolean);
    let cur=await root.getDirectoryHandle(parts[0]);
    for(let i=1;i<parts.length;i++){
      const n=parts[i];
      const isLast=i===parts.length-1;
      try{
        cur=isLast?
          (await cur.getFileHandle(n).catch(()=>cur.getDirectoryHandle(n))):
          await cur.getDirectoryHandle(n);
      }catch(e){throw new Error('ENOENT: '+path)}
    }
    const meta=await readMeta(path);
    return {path,type:cur.kind==='file'?'file':'directory',name:baseName(path),mtime:meta.mtime||Date.now(),ctime:meta.ctime||Date.now(),size:meta.size||0};
  }

  // Metadata stored in a sidecar JSON inside the same directory (OPFS)
  const META_FILE='.sageos-meta.json';
  async function readMetaMap(dirPath){
    if(useFallback)return {};
    dirPath=normPath(dirPath);
    try{
      const dirH=await resolveDir(dirPath);
      const fh=await dirH.getFileHandle(META_FILE);
      const f=await fh.getFile();
      const t=await f.text();
      return JSON.parse(t||'{}');
    }catch(e){return {}}
  }
  async function writeMetaMap(dirPath,map){
    if(useFallback)return;
    const dirH=await resolveDir(dirPath);
    const fh=await dirH.getFileHandle(META_FILE,{create:true});
    const w=await fh.createWritable();
    await w.write(JSON.stringify(map));
    await w.close();
  }
  async function readMeta(path){
    const p=parentPath(path);
    const n=baseName(path);
    const map=await readMetaMap(p);
    const e=map[n]||{};
    if(!e.size&&useFallback===false){
      try{
        const dirH=await resolveDir(p);
        const fh=await dirH.getFileHandle(n);
        const f=await fh.getFile();
        e.size=f.size;if(!e.mtime)e.mtime=f.lastModified;
      }catch(_){}
    }
    return e;
  }
  async function updateMeta(path,patch){
    const p=parentPath(path);
    const n=baseName(path);
    const map=await readMetaMap(p);
    map[n]=Object.assign(map[n]||{ctime:Date.now()},patch,{mtime:Date.now()});
    await writeMetaMap(p,map);
  }
  async function removeMeta(path){
    const p=parentPath(path);
    const n=baseName(path);
    const map=await readMetaMap(p);
    delete map[n];
    await writeMetaMap(p,map);
  }

  async function resolveDir(dirPath){
    dirPath=normPath(dirPath);
    if(dirPath==='/')return root;
    const parts=dirPath.split('/').filter(Boolean);
    let cur=root;
    for(const p of parts)cur=await cur.getDirectoryHandle(p);
    return cur;
  }

  // Mount points (local folder mounts)
  const mounts=new Map(); // mountPath -> backend

  async function resolveBackend(path){
    path=normPath(path);
    // Check if path falls under a mount
    for(const [mp,backend] of mounts){
      if(path===mp||path.startsWith(mp+'/')){
        const sub=path===mp?'/':path.slice(mp.length);
        return {backend,subPath:sub};
      }
    }
    return {backend:null,subPath:path};
  }

  return {
    get ready(){return !!root||useFallback},
    async init(){
      if(useFallback){
        await IDB.init();
        // Ensure root directory exists
        const r=await IDB.get('/');
        if(!r)await IDB.put({path:'/',type:'directory',name:'',mtime:Date.now(),ctime:Date.now()});
        fallback=IDB;
        return;
      }
      try{
        root=await navigator.storage.getDirectory();
      }catch(e){
        // Fallback to IndexedDB
        await IDB.init();fallback=IDB;
      }
    },
    normPath,parentPath,baseName,
    registerMount(mp,backend){mounts.set(normPath(mp),backend)},
    unregisterMount(mp){mounts.delete(normPath(mp))},
    listMounts(){return Array.from(mounts.entries()).map(([p,b])=>({path:p,backend:b}))},

    async stat(path){
      const {backend,subPath}=await resolveBackend(path);
      if(backend)return backend.stat(subPath);
      if(useFallback){
        const n=await IDB.get(normPath(path));
        if(!n){const err=new Error('ENOENT');err.code='ENOENT';throw err}
        return n;
      }
      return getNode(path);
    },

    async exists(path){try{await this.stat(path);return true}catch{return false}},

    async readdir(dirPath){
      dirPath=normPath(dirPath);
      const {backend,subPath}=await resolveBackend(dirPath);
      if(backend){
        const list=await backend.readdir(subPath);
        return list.map(n=>({...n,path:n.path.startsWith('/')?n.path:dirPath+'/'+n.name}));
      }
      // Include mount point children if dirPath is a parent of mounts
      const mountChildren=[];
      for(const [mp] of mounts){
        const parent=normPath(mp.slice(0,mp.lastIndexOf('/'))||'/');
        if(parent===dirPath){
          mountChildren.push({path:mp,name:baseName(mp),type:'directory',mtime:Date.now(),ctime:Date.now(),size:0,_mount:true});
        }
      }
      if(useFallback){
        const pref=dirPath==='/'?'/':dirPath+'/';
        const all=await new Promise(res=>{
          const out=[];const tx=IDB.db.transaction('nodes');const st=tx.objectStore('nodes');
          const r=st.openCursor();
          r.onsuccess=e=>{const c=e.target.result;if(!c)return res(out);
            const p=c.value.path;
            if(p!==dirPath&&p.startsWith(pref)&&p.indexOf('/',pref.length)===-1&&c.value.name!==META_FILE)out.push(c.value);
            c.continue();
          };
          r.onerror=()=>res(out);
        });
        return all.filter(n=>n.name!==META_FILE).concat(mountChildren);
      }
      let out=[];
      try{
        const dirH=await resolveDir(dirPath);
        const meta=await readMetaMap(dirPath);
        for await(const [name,handle] of dirH.entries()){
          if(name===META_FILE)continue;
          const kind=handle.kind;
          const m=meta[name]||{};
          let size=0,mtime=m.mtime||Date.now();
          if(kind==='file'){
            try{const f=await handle.getFile();size=f.size;if(!m.mtime)mtime=f.lastModified}catch{}
          }
          out.push({
            path:dirPath==='/'?'/'+name:dirPath+'/'+name,
            name,type:kind==='file'?'file':'directory',
            size,mtime,ctime:m.ctime||mtime
          });
        }
      }catch(e){
        // Directory may not exist in OPFS but may have mount children
        if(!mountChildren.length)throw e;
      }
      // Dedupe against mounts (mount takes precedence)
      const mountNames=new Set(mountChildren.map(c=>c.name));
      out=out.filter(o=>!mountNames.has(o.name));
      return out.concat(mountChildren);
    },

    async mkdir(path){
      path=normPath(path);
      const {backend,subPath}=await resolveBackend(path);
      if(backend)return backend.mkdir(subPath);
      if(useFallback){
        if(await IDB.get(path))return;
        await IDB.put({path,type:'directory',name:baseName(path),mtime:Date.now(),ctime:Date.now()});
        return;
      }
      const parts=path.split('/').filter(Boolean);
      let cur=root;
      for(const p of parts)cur=await cur.getDirectoryHandle(p,{create:true});
    },

    async mkdirp(path){
      path=normPath(path);
      const parts=path.split('/').filter(Boolean);
      let cur='/';
      for(const p of parts){cur=cur==='/'?'/'+p:cur+'/'+p;
        try{await this.mkdir(cur)}catch{}
      }
    },

    async readFile(path){
      path=normPath(path);
      const {backend,subPath}=await resolveBackend(path);
      if(backend)return backend.readFile(subPath);
      if(useFallback){
        const b=await IDB.getData(path);
        if(!b){const err=new Error('ENOENT');err.code='ENOENT';throw err}
        return b;
      }
      const dirH=await resolveDir(parentPath(path));
      const fh=await dirH.getFileHandle(baseName(path));
      return await fh.getFile();
    },
    async readFileText(path){
      const blob=await this.readFile(path);
      return await blob.text();
    },
    async readFileBuffer(path){
      const blob=await this.readFile(path);
      return await blob.arrayBuffer();
    },

    async writeFile(path,content){
      path=normPath(path);
      const {backend,subPath}=await resolveBackend(path);
      if(backend)return backend.writeFile(subPath,content);
      let blob;
      if(content instanceof Blob)blob=content;
      else if(content instanceof ArrayBuffer||ArrayBuffer.isView(content))blob=new Blob([content]);
      else blob=new Blob([String(content)],{type:'text/plain'});
      if(useFallback){
        const existing=await IDB.get(path);
        await IDB.put({path,type:'file',name:baseName(path),mtime:Date.now(),ctime:existing?.ctime||Date.now(),size:blob.size});
        await IDB.setData(path,blob);
        return;
      }
      await this.mkdirp(parentPath(path));
      const dirH=await resolveDir(parentPath(path));
      const fh=await dirH.getFileHandle(baseName(path),{create:true});
      const w=await fh.createWritable();
      await w.write(blob);
      await w.close();
      await updateMeta(path,{size:blob.size});
    },

    async rename(oldPath,newPath){
      oldPath=normPath(oldPath);newPath=normPath(newPath);
      const {backend:b1}=await resolveBackend(oldPath);
      const {backend:b2}=await resolveBackend(newPath);
      if(b1&&b1===b2)return b1.rename(oldPath.replace(/^.*?(?=\/mnt\/local\/|$)/,''),newPath.replace(/^.*?(?=\/mnt\/local\/|$)/,''));
      // cross-backend or OPFS: copy + delete
      await this.copy(oldPath,newPath);
      await this.rm(oldPath);
    },

    async copy(src,dst){
      src=normPath(src);dst=normPath(dst);
      const st=await this.stat(src);
      if(st.type==='file'){
        const data=await this.readFile(src);
        await this.writeFile(dst,data);
      }else{
        await this.mkdirp(dst);
        const entries=await this.readdir(src);
        for(const e of entries){
          await this.copy(e.path,dst+'/'+e.name);
        }
      }
    },

    async rm(path){
      path=normPath(path);
      const {backend,subPath}=await resolveBackend(path);
      if(backend)return backend.rm(subPath);
      if(path==='/')throw new Error('Cannot remove root');
      if(useFallback){
        // Remove subtree
        const pref=path+'/';
        await new Promise(res=>{
          const tx=IDB.db.transaction(['nodes','data'],'readwrite');
          const nst=tx.objectStore('nodes');const dst=tx.objectStore('data');
          const r=nst.openCursor();
          r.onsuccess=e=>{const c=e.target.result;if(!c)return res();
            const p=c.value.path;
            if(p===path||p.startsWith(pref)){nst.delete(p);dst.delete(p)}
            c.continue();
          };
        });
        return;
      }
      const parent=parentPath(path);
      const name=baseName(path);
      const dirH=await resolveDir(parent);
      try{await dirH.removeEntry(name,{recursive:true})}catch{}
      await removeMeta(path);
    },

    async reset(){
      if(useFallback){
        await new Promise((res,rej)=>{
          const r=indexedDB.deleteDatabase('sageos-vfs');
          r.onsuccess=res;r.onerror=rej;
        });
        await IDB.init();
        await IDB.put({path:'/',type:'directory',name:'',mtime:Date.now(),ctime:Date.now()});
        return;
      }
      for await(const [name] of root.entries()){
        try{await root.removeEntry(name,{recursive:true})}catch{}
      }
    },

    async estimate(){
      if(navigator.storage?.estimate){
        return await navigator.storage.estimate();
      }
      return {usage:0,quota:0};
    },

    async sizeOfDir(path){
      let total=0;
      const walk=async p=>{
        const entries=await this.readdir(p);
        for(const e of entries){
          if(e.type==='file')total+=(e.size||0);
          else total+=await walk(e.path);
        }
        return total;
      };
      return await walk(path);
    },
  };
})();

/* ============ LOCAL FOLDER BACKEND (File System Access API) ============ */
function createLocalBackend(dirHandle,mountName){
  async function resolve(p){
    p=p||'/';p=p.replace(/\\/g,'/');
    if(!p.startsWith('/'))p='/'+p;
    const parts=p.split('/').filter(Boolean);
    let cur=dirHandle;
    for(let i=0;i<parts.length-1;i++){
      cur=await cur.getDirectoryHandle(parts[i]);
    }
    return {parent:cur,name:parts[parts.length-1]||''};
  }
  async function resolveHandle(p){
    p=p||'/';
    const parts=p.split('/').filter(Boolean);
    let cur=dirHandle;
    for(let i=0;i<parts.length;i++){
      const isLast=i===parts.length-1;
      try{
        if(isLast){
          try{return await cur.getFileHandle(parts[i])}catch{return await cur.getDirectoryHandle(parts[i])}
        }else cur=await cur.getDirectoryHandle(parts[i]);
      }catch(e){const err=new Error('ENOENT: '+p);err.code='ENOENT';throw err}
    }
    return cur;
  }
  const prefix='/mnt/local/'+mountName;
  return {
    type:'local',
    name:mountName,
    dirHandle,
    async stat(p){
      p=p||'/';
      if(p==='/'){return {path:prefix,type:'directory',name:mountName,mtime:Date.now(),ctime:Date.now()}}
      const h=await resolveHandle(p);
      if(h.kind==='file'){const f=await h.getFile();return {path:prefix+p,name:h.name,type:'file',size:f.size,mtime:f.lastModified,ctime:f.lastModified}}
      return {path:prefix+p,name:h.name,type:'directory',mtime:Date.now(),ctime:Date.now()};
    },
    async readdir(p){
      p=p||'/';
      const h=p==='/'?dirHandle:await resolveHandle(p);
      const out=[];
      for await(const [name,handle] of h.entries()){
        if(handle.kind==='file'){
          try{const f=await handle.getFile();out.push({path:prefix+(p==='/'?'/':p+'/')+name,name,type:'file',size:f.size,mtime:f.lastModified,ctime:f.lastModified})}catch{}
        }else{
          out.push({path:prefix+(p==='/'?'/':p+'/')+name,name,type:'directory',mtime:Date.now(),ctime:Date.now()});
        }
      }
      return out;
    },
    async readFile(p){
      const h=await resolveHandle(p);
      if(h.kind!=='file')throw new Error('EISDIR');
      return await h.getFile();
    },
    async writeFile(p,content){
      const parts=(p||'/').split('/').filter(Boolean);
      const name=parts.pop();
      let cur=dirHandle;
      for(const part of parts)cur=await cur.getDirectoryHandle(part,{create:true});
      const fh=await cur.getFileHandle(name,{create:true});
      const w=await fh.createWritable();
      let blob=content instanceof Blob?content:
        content instanceof ArrayBuffer||ArrayBuffer.isView(content)?new Blob([content]):
        new Blob([String(content)],{type:'text/plain'});
      await w.write(blob);await w.close();
    },
    async mkdir(p){
      const parts=(p||'/').split('/').filter(Boolean);
      let cur=dirHandle;
      for(const part of parts)cur=await cur.getDirectoryHandle(part,{create:true});
    },
    async mkdirp(p){return this.mkdir(p)},
    async rm(p){
      const parts=(p||'/').split('/').filter(Boolean);
      const name=parts.pop();
      let cur=dirHandle;
      for(const part of parts)cur=await cur.getDirectoryHandle(part);
      await cur.removeEntry(name,{recursive:true});
    },
    async rename(from,to){
      // Cross-folder rename not supported; fall back to copy+delete handled by fs
      throw new Error('EXDEV');
    },
    async copy(){throw new Error('EXDEV')},
    async exists(p){try{await this.stat(p);return true}catch{return false}},
  };
}

/* ============ WINDOW MANAGER ============ */
const WM = (()=>{
  const windows=new Map();
  let topZ=100;
  let activeId=null;
  const container=$('#windows-layer');

  function isMobile(){return window.innerWidth<768}

  function focus(id){
    const w=windows.get(id);if(!w)return;
    if(w.minimized){w.minimized=false;w.el.classList.remove('minimized')}
    topZ++;w.el.style.zIndex=topZ;
    activeId=id;
    updateTaskbar();
  }

  function create({title='Window',icon='file',width=640,height=440,x,y,content='',onClose,type='generic'}={}){
    const id=uid();
    const el=document.createElement('div');
    el.className='win';
    el.dataset.id=id;
    if(isMobile()){
      width=Math.min(window.innerWidth-8,640);
      height=Math.min(window.innerHeight-80,520);
      x=4;y=4;
    }else{
      x=x??(Math.max(40,(window.innerWidth-width)/2+((windows.size%5)*24)));
      y=y??(Math.max(40,(window.innerHeight-height)/2-40+((windows.size%5)*24)));
    }
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.width=width+'px';el.style.height=height+'px';
    el.style.zIndex=++topZ;
    el.innerHTML=`
      <div class="win-titlebar">
        <div class="win-title-icon">${ICONS[icon]||ICONS.file}</div>
        <div class="win-title-text">${esc(title)}</div>
        <div class="win-controls">
          <button class="win-btn min" title="最小化">${ICONS.min}</button>
          <button class="win-btn max" title="最大化">${ICONS.max}</button>
          <button class="win-btn close" title="关闭">${ICONS.close}</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-resize-handle n"></div><div class="win-resize-handle s"></div>
      <div class="win-resize-handle e"></div><div class="win-resize-handle w"></div>
      <div class="win-resize-handle ne"></div><div class="win-resize-handle nw"></div>
      <div class="win-resize-handle se"></div><div class="win-resize-handle sw"></div>
    `;
    const body=el.querySelector('.win-body');
    if(typeof content==='string')body.innerHTML=content;
    else if(content instanceof Node)body.appendChild(content);
    container.appendChild(el);

    const w={id,el,body,title,icon,type,minimized:false,maximized:false,onClose,prev:null};
    windows.set(id,w);

    // Drag
    const tb=el.querySelector('.win-titlebar');
    tb.addEventListener('pointerdown',e=>{
      if(e.target.closest('.win-btn'))return;
      focus(id);
      if(w.maximized)return;
      const sx=e.clientX,sy=e.clientY;
      const ox=parseFloat(el.style.left),oy=parseFloat(el.style.top);
      tb.classList.add('dragging');
      tb.setPointerCapture(e.pointerId);
      const mv=ev=>{
        let nx=ox+ev.clientX-sx,ny=oy+ev.clientY-sy;
        nx=Math.max(-el.offsetWidth+80,Math.min(window.innerWidth-80,nx));
        ny=Math.max(0,Math.min(window.innerHeight-60,ny));
        el.style.left=nx+'px';el.style.top=ny+'px';
      };
      const up=()=>{tb.classList.remove('dragging');tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};
      tb.addEventListener('pointermove',mv);
      tb.addEventListener('pointerup',up);
    });
    tb.addEventListener('dblclick',e=>{if(!e.target.closest('.win-btn'))toggleMax(id)});

    // Resize handles
    $$('.win-resize-handle',el).forEach(h=>{
      h.addEventListener('pointerdown',e=>{
        if(w.maximized)return;
        e.stopPropagation();focus(id);
        const dir=h.className.split(' ')[1];
        const sx=e.clientX,sy=e.clientY;
        const ow=el.offsetWidth,oh=el.offsetHeight,ox=parseFloat(el.style.left),oy=parseFloat(el.style.top);
        h.setPointerCapture(e.pointerId);
        const mv=ev=>{
          const dx=ev.clientX-sx,dy=ev.clientY-sy;
          let nw=ow,nh=oh,nx=ox,ny=oy;
          if(dir.includes('e'))nw=Math.max(280,ow+dx);
          if(dir.includes('s'))nh=Math.max(180,oh+dy);
          if(dir.includes('w')){nw=Math.max(280,ow-dx);nx=ox+ow-nw}
          if(dir.includes('n')){nh=Math.max(180,oh-dy);ny=oy+oh-nh}
          el.style.width=nw+'px';el.style.height=nh+'px';
          el.style.left=nx+'px';el.style.top=ny+'px';
        };
        const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};
        h.addEventListener('pointermove',mv);
        h.addEventListener('pointerup',up);
      });
    });

    // Controls
    el.querySelector('.win-btn.close').addEventListener('click',()=>close(id));
    el.querySelector('.win-btn.min').addEventListener('click',()=>minimize(id));
    el.querySelector('.win-btn.max').addEventListener('click',()=>toggleMax(id));

    el.addEventListener('pointerdown',()=>focus(id));
    activeId=id;
    updateTaskbar();
    return w;
  }

  function close(id){
    const w=windows.get(id);if(!w)return;
    if(w.onClose){try{w.onClose()}catch(e){console.warn(e)}}
    w.el.style.transition='opacity 0.15s, transform 0.15s';
    w.el.style.opacity='0';w.el.style.transform='scale(0.96)';
    setTimeout(()=>{w.el.remove();windows.delete(id);updateTaskbar()},160);
  }
  function minimize(id){
    const w=windows.get(id);if(!w)return;
    w.minimized=true;w.el.classList.add('minimized');
    updateTaskbar();
  }
  function toggleMax(id){
    const w=windows.get(id);if(!w)return;
    if(w.maximized){
      w.maximized=false;w.el.classList.remove('maximized');
      if(w.prev){Object.assign(w.el.style,w.prev);w.prev=null}
    }else{
      w.prev={left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height};
      w.maximized=true;w.el.classList.add('maximized');
      w.el.style.left='0px';w.el.style.top='0px';
      w.el.style.width=window.innerWidth+'px';
      w.el.style.height=(window.innerHeight-70)+'px';
    }
  }

  function updateTaskbar(){
    const tl=$('#task-list');tl.innerHTML='';
    for(const w of windows.values()){
      const b=document.createElement('button');
      b.className='tb-item'+(activeId===w.id&&!w.minimized?' active':'');
      b.innerHTML=`<span>${ICONS[w.icon]||ICONS.file}</span><span>${esc(w.title)}</span>`;
      b.onclick=()=>{
        if(activeId===w.id&&!w.minimized)minimize(w.id);
        else focus(w.id);
      };
      tl.appendChild(b);
    }
  }

  function refreshAll(){updateTaskbar()}

  return {create,close,minimize,focus,toggleMax,get: id=>windows.get(id),all:()=>windows,refreshAll,updateTaskbar};
})();

/* ============ DIALOG ============ */
function dialog({title='Confirm',message='',value='',placeholder='',buttons=['OK','Cancel'],input=false}={}){
  return new Promise(res=>{
    const ov=document.createElement('div');
    ov.className='dialog-overlay';
    ov.innerHTML=`
      <div class="dialog">
        <h3>${esc(title)}</h3>
        ${message?`<p>${esc(message)}</p>`:''}
        ${input?`<input type="text" value="${esc(value)}" placeholder="${esc(placeholder||'')}" autofocus>`:''}
        <div class="dialog-actions">
          ${buttons.map((b,i)=>`<button class="st-btn ${i===0?'primary':''}" data-i="${i}">${esc(b)}</button>`).join('')}
        </div>
      </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('input');
    if(inp){inp.focus();inp.select();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){done(0)}});}
    function done(i){res({index:i,value:inp?inp.value:null});ov.remove()}
    ov.querySelectorAll('.st-btn').forEach(b=>b.onclick=()=>done(+b.dataset.i));
    ov.addEventListener('click',e=>{if(e.target===ov)done(-1)});
  });
}

/* ============ CONTEXT MENU ============ */
const CTX = (()=>{
  const el=$('#ctx-menu');
  function show(x,y,items){
    el.innerHTML=items.map(it=>{
      if(it==='-')return '<div class="ctx-sep"></div>';
      if(it.disabled)return `<div class="ctx-item disabled">${it.icon||''}<span>${esc(it.label)}</span>${it.kbd?`<span class="kbd">${it.kbd}</span>`:''}</div>`;
      return `<div class="ctx-item" data-id="${it.id}">${it.icon||''}<span>${esc(it.label)}</span>${it.kbd?`<span class="kbd">${it.kbd}</span>`:''}</div>`;
    }).join('');
    el.classList.add('open');
    // position
    const rect=el.getBoundingClientRect();
    const vw=window.innerWidth,vh=window.innerHeight;
    let px=x,py=y;
    if(px+220>vw)px=vw-220;
    if(py+rect.height>vh)py=vh-rect.height-8;
    el.style.left=px+'px';el.style.top=py+'px';
    el.querySelectorAll('.ctx-item').forEach((node,i)=>{
      const it=items.filter(x=>x!=='-')[i];
      if(it?.action)node.onclick=()=>{hide();it.action()};
    });
  }
  function hide(){el.classList.remove('open')}
  document.addEventListener('click',e=>{if(!el.contains(e.target))hide()});
  document.addEventListener('scroll',hide,true);
  return {show,hide};
})();

const APPS={};
function registerApp(id,cfg){APPS[id]=Object.assign({id},cfg)}

/* ============ DESKTOP MANAGER ============ */
const Desktop = (()=>{
  const DESKTOP_PATH='/Desktop';
  const layer=$('#icon-layer');
  const icons=new Map(); // path -> {el, meta}
  let selected=new Set();

  async function init(){
    await fs.mkdirp(DESKTOP_PATH);
    await render();
    // Seed with some defaults if empty
    const entries=await fs.readdir(DESKTOP_PATH);
    if(entries.length===0){
      await fs.mkdirp('/Documents');await fs.mkdirp('/Pictures');await fs.mkdirp('/Music');await fs.mkdirp('/Videos');
      await fs.writeFile('/Documents/readme.md',`# Welcome to SageOS\n\nA quiet, single-file operating system running entirely in your browser.\n\n## Features\n- OPFS-backed persistent file system\n- Real-time HTML editor with preview\n- Manga viewer with natural ordering\n- Local folder mounting via File System Access API\n- Bidirectional drag & drop with your real desktop\n\nTry right-clicking the desktop, or open the file explorer to begin.\n`);
      await render();
    }
  }

  async function render(){
    layer.querySelectorAll('.dsk-icon').forEach(n=>n.remove());
    icons.clear();
    const entries=await fs.readdir(DESKTOP_PATH);
    // Layout positions
    const saved=await loadIconPositions();
    const startX=24,startY=24,gapX=96,gapY=96;
    let row=0,col=0;
    const maxRows=Math.floor((window.innerHeight-120)/gapY)||6;
    const sorted=entries.slice().sort((a,b)=>naturalSort(a.name,b.name));
    for(const entry of sorted){
      let pos=saved[entry.name];
      if(!pos){
        pos={x:startX+col*gapX,y:startY+row*gapY};
        row++;if(row>=maxRows){row=0;col++}
      }
      createIconEl(entry,pos.x,pos.y);
    }
  }

  async function loadIconPositions(){
    try{return JSON.parse(localStorage.getItem('sageos-icon-pos')||'{}')}catch{return {}}
  }
  async function saveIconPos(name,pos){
    const all=await loadIconPositions();
    all[name]=pos;
    localStorage.setItem('sageos-icon-pos',JSON.stringify(all));
  }

  function iconFor(entry){
    if(entry.type==='directory')return ICONS.folder;
    const c=categoryOf(entry.name);
    return ICONS[c]||ICONS.file;
  }

  function createIconEl(entry,x,y){
    const el=document.createElement('div');
    el.className='dsk-icon';
    el.dataset.path=entry.path;
    el.dataset.name=entry.name;
    el.dataset.type=entry.type;
    el.draggable=true;
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.touchAction='none';
    el.innerHTML=`<div class="dsk-icon-img">${iconFor(entry)}</div><div class="dsk-icon-label">${esc(entry.name)}</div>`;
    layer.appendChild(el);
    icons.set(entry.path,{el,entry});

    // Click select
    el.addEventListener('click',e=>{
      e.stopPropagation();
      if(!e.ctrlKey&&!e.metaKey){selected.forEach(p=>{const i=icons.get(p);if(i)i.el.classList.remove('selected')});selected.clear()}
      if(selected.has(entry.path)){selected.delete(entry.path);el.classList.remove('selected')}
      else{selected.add(entry.path);el.classList.add('selected')}
    });
    // Double click / tap
    let tapT=null;
    el.addEventListener('pointerup',e=>{
      if(tapT){clearTimeout(tapT);tapT=null;openEntry(entry)}
      else tapT=setTimeout(()=>tapT=null,300);
    });

    // Right-click
    el.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      if(!selected.has(entry.path)){selected.forEach(p=>{const i=icons.get(p);if(i)i.el.classList.remove('selected')});selected.clear();selected.add(entry.path);el.classList.add('selected')}
      showIconCtx(e.clientX,e.clientY,entry);
    });

    // Drag: native DnD for reordering & moving into folders & export
    el.addEventListener('dragstart',e=>{
      el.classList.add('dragging');
      // synchronous: read from cache
      const cached=dragCache.get(entry.path);
      if(cached&&entry.type==='file'){
        try{
          const file=new File([cached.blob],entry.name,{type:cached.blob.type||mimeOf(entry.name)});
          e.dataTransfer.items.add(file);
          const url=URL.createObjectURL(file);
          e.dataTransfer.setData('DownloadURL',`${file.type||'application/octet-stream'}:${file.name}:${url}`);
          setTimeout(()=>URL.revokeObjectURL(url),5000);
        }catch(_){}
      }
      e.dataTransfer.setData('application/x-sageos-path',entry.path);
      e.dataTransfer.effectAllowed='copyMove';
    });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));

    // Drag over (for dropping files INTO folder)
    if(entry.type==='directory'){
      el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';el.style.background='rgba(217,119,6,0.25)'});
      el.addEventListener('dragleave',()=>{el.style.background=''});
      el.addEventListener('drop',async e=>{
        e.preventDefault();e.stopPropagation();el.style.background='';
        const srcPath=e.dataTransfer.getData('application/x-sageos-path');
        if(srcPath&&srcPath!==entry.path){
          try{
            const newPath=entry.path+'/'+fs.baseName(srcPath);
            await fs.rename(srcPath,newPath);
            toast('Moved to '+entry.name,'ok');
            render();
          }catch(err){toast('Move failed: '+err.message,'err')}
        }
      });
    }

    // Pre-cache file data for drag-out (must happen before dragstart)
    if(entry.type==='file'){
      const preload=async()=>{
        if(dragCache.has(entry.path))return;
        try{
          const blob=await fs.readFile(entry.path);
          dragCache.set(entry.path,{blob,t:Date.now()});
          // Keep cache small
          if(dragCache.size>20){const first=dragCache.keys().next().value;dragCache.delete(first)}
        }catch(_){}
      };
      el.addEventListener('mouseenter',preload);
      el.addEventListener('pointerdown',preload,{once:true});
    }

    // Touch move for mobile (no native drag)
    let tState=null;
    el.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      tState={sx:t.clientX,sy:t.clientY,ox:x,oy:y,moved:false};
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!tState)return;
      const t=e.touches[0];
      const dx=t.clientX-tState.sx,dy=t.clientY-tState.sy;
      if(Math.abs(dx)+Math.abs(dy)>6){tState.moved=true;e.preventDefault();
        el.style.left=(tState.ox+dx)+'px';el.style.top=(tState.oy+dy)+'px';
      }
    },{passive:false});
    el.addEventListener('touchend',async ()=>{
      if(tState?.moved){
        const nx=parseFloat(el.style.left),ny=parseFloat(el.style.top);
        await saveIconPos(entry.name,{x:nx,y:ny});
      }
      tState=null;
    });
  }

  const dragCache=new Map();

  function showIconCtx(x,y,entry){
    const items=[
      {id:'open',label:'打开',icon:ICONS.folder,action:()=>openEntry(entry)},
      '-',
      {id:'rename',label:'重命名',icon:ICONS.rename,action:()=>renameEntry(entry)},
      {id:'copy',label:'复制',icon:ICONS.copy,action:()=>clipboard.copy([entry])},
      {id:'delete',label:'删除',icon:ICONS.trash,action:()=>deleteEntries([entry])},
    ];
    if(entry.type==='file'){
      items.splice(1,0,{id:'dl',label:'导出下载',icon:ICONS.download,action:()=>exportEntry(entry)});
      const cat=categoryOf(entry.name);
      if(cat==='text'||cat==='archive'){
        items.splice(2,0,'-');
        items.splice(3,0,{id:'openwith',label:'打开方式 ▸',icon:ICONS.code,action:()=>openWithMenu(entry,x,y)});
      }
    }
    CTX.show(x,y,items);
  }

  function openWithMenu(entry,x,y){
    const items=[
      {label:'记事本',icon:ICONS.notepad,action:()=>APPS.notepad.open({path:entry.path})},
      {label:'HTML 编辑器',icon:ICONS.editor,action:()=>APPS.editor.open({path:entry.path})},
    ];
    CTX.show(x+10,y+10,items);
  }

  async function openEntry(entry){
    if(entry.type==='directory'){APPS.explorer.open({path:entry.path});return}
    const cat=categoryOf(entry.name);
    if(cat==='image'){APPS.image.open({path:entry.path});return}
    if(cat==='audio'||cat==='video'){APPS.media.open({path:entry.path});return}
    if(cat==='pdf'){APPS.pdf.open({path:entry.path});return}
    if(cat==='archive'){
      (async()=>{
        const r=await dialog({title:'压缩文件',message:`解压 "${entry.name}" 到同级目录？`,buttons:['解压','用浏览器查看','取消']});
        if(r.index===0){
          try{
            if(typeof JSZip==='undefined'){toast('JSZip 未加载','err');return}
            const ext=extOf(entry.name);
            if(ext!=='zip'){toast('目前仅支持 .zip 格式','err');return}
            const blob=await fs.readFile(entry.path);
            const zip=await JSZip.loadAsync(blob);
            const base=entry.name.replace(/\.zip$/i,'');
            const target=fs.parentPath(entry.path)+'/'+base;
            await fs.mkdirp(target);
            let count=0;
            for(const name of Object.keys(zip.files)){
              const f=zip.files[name];
              if(f.dir)await fs.mkdirp(target+'/'+name);
              else{const buf=await f.async('arraybuffer');await fs.writeFile(target+'/'+name,new Blob([buf]));count++}
            }
            toast(`解压完成: ${count} 个文件`,'ok');
            Desktop.render();
            APPS.explorer.open({path:target});
          }catch(e){toast('解压失败: '+e.message,'err')}
        }else if(r.index===1){
          Desktop.exportEntry(entry);
        }
      })();
      return;
    }
    if(entry.name.endsWith('.csv')||entry.name.endsWith('.tsv')){APPS.notepad.open({path:entry.path,tableView:true});return}
    if(entry.name.endsWith('.html')||entry.name.endsWith('.htm')){
      const r=await dialog({title:'打开 HTML 文件',message:'选择打开方式',buttons:['预览','编辑源码','取消']});
      if(r.index===0)APPS.browser.open({url:'sageos://'+entry.path});
      else if(r.index===1)APPS.editor.open({path:entry.path});
      return;
    }
    if(cat==='text'){APPS.notepad.open({path:entry.path});return}
    // Unknown: offer as text
    const r=await dialog({title:'打开文件',message:`无法识别 "${entry.name}" 的类型。以纯文本方式打开？`,buttons:['以文本打开','导出下载','取消']});
    if(r.index===0)APPS.notepad.open({path:entry.path});
    else if(r.index===1)exportEntry(entry);
  }

  async function exportEntry(entry){
    try{
      const blob=await fs.readFile(entry.path);
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=entry.name;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }catch(e){toast('导出失败: '+e.message,'err')}
  }

  async function renameEntry(entry){
    const r=await dialog({title:'重命名',message:`为 "${entry.name}" 输入新名称：`,value:entry.name,buttons:['确定','取消'],input:true});
    if(r.index!==0||!r.value||r.value===entry.name)return;
    try{
      const newPath=fs.parentPath(entry.path)+'/'+r.value;
      await fs.rename(entry.path,newPath);
      render();toast('已重命名','ok');
    }catch(e){toast('重命名失败: '+e.message,'err')}
  }

  async function deleteEntries(entries){
    const r=await dialog({title:'删除',message:`确定删除 ${entries.length} 个项目？此操作不可撤销。`,buttons:['删除','取消']});
    if(r.index!==0)return;
    for(const e of entries){try{await fs.rm(e.path)}catch(err){toast('删除失败: '+err.message,'err')}}
    render();
  }

  // Desktop context menu
  layer.addEventListener('contextmenu',e=>{
    if(e.target!==layer&&!e.target.closest('#desktop'))return;
    e.preventDefault();
    CTX.show(e.clientX,e.clientY,[
      {label:'刷新',icon:ICONS.refresh,action:()=>render()},
      {label:'新建文件夹',icon:ICONS.plus,action:()=>createFolder()},
      {label:'新建文本文件',icon:ICONS.text,action:()=>createFile('txt')},
      '-',
      {label:'导入文件',icon:ICONS.upload,action:()=>importFilesTo(DESKTOP_PATH)},
      {label:'挂载本地文件夹',icon:ICONS.mount,action:()=>mountLocal()},
      '-',
      {label:'全屏',icon:ICONS.fullscreen,action:()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()},
      {label:'设置',icon:ICONS.settings,action:()=>APPS.settings.open()},
    ]);
  });
  layer.addEventListener('click',e=>{
    if(e.target===layer||e.target.closest('#desktop')===e.target){
      selected.forEach(p=>{const i=icons.get(p);if(i)i.el.classList.remove('selected')});selected.clear();
    }
  });

  async function createFolder(){
    const r=await dialog({title:'新建文件夹',value:'新建文件夹',buttons:['创建','取消'],input:true});
    if(r.index!==0||!r.value)return;
    try{await fs.mkdirp(DESKTOP_PATH+'/'+r.value);render();toast('已创建','ok')}
    catch(e){toast(e.message,'err')}
  }
  async function createFile(ext='txt'){
    const r=await dialog({title:'新建文件',value:'untitled.'+ext,buttons:['创建','取消'],input:true});
    if(r.index!==0||!r.value)return;
    try{await fs.writeFile(DESKTOP_PATH+'/'+r.value,'');render();toast('已创建','ok')}
    catch(e){toast(e.message,'err')}
  }

  // Drag-over desktop (move icons + accept external drops)
  let dropTarget=null;
  layer.addEventListener('dragover',e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect='copy';
  });
  layer.addEventListener('drop',async e=>{
    e.preventDefault();
    const srcPath=e.dataTransfer.getData('application/x-sageos-path');
    if(srcPath){
      // Internal reorder
      const icon=icons.get(srcPath);
      if(icon){
        const rect=layer.getBoundingClientRect();
        const nx=e.clientX-rect.left-40,ny=e.clientY-rect.top-40;
        icon.el.style.left=nx+'px';icon.el.style.top=ny+'px';
        await saveIconPos(icon.entry.name,{x:nx,y:ny});
      }
      return;
    }
    // External file drop
    const items=e.dataTransfer.items;
    if(!items||items.length===0)return;
    try{
      await handleExternalDrop(items,DESKTOP_PATH);
      render();toast('导入完成','ok');
    }catch(err){toast('导入失败: '+err.message,'err')}
  });

  async function handleExternalDrop(items,targetDir){
    const entries=[];
    for(let i=0;i<items.length;i++){
      const it=items[i];
      let entry=null;
      if(it.getAsEntry)entry=it.getAsEntry();
      else if(it.webkitGetAsEntry)entry=it.webkitGetAsEntry();
      if(entry)entries.push(entry);
    }
    for(const entry of entries){
      await walkEntry(entry,targetDir);
    }
  }
  async function walkEntry(entry,targetDir){
    if(entry.isFile){
      await new Promise((res,rej)=>entry.file(async f=>{
        try{
          const buf=await f.arrayBuffer();
          await fs.writeFile(targetDir+'/'+f.name,new Blob([buf],{type:f.type}));
          res();
        }catch(e){rej(e)}
      },rej));
    }else if(entry.isDirectory){
      await fs.mkdirp(targetDir+'/'+entry.name);
      const reader=entry.createReader();
      let all=[];
      while(true){
        const batch=await new Promise(res=>reader.readEntries(res,()=>res([])));
        if(!batch.length)break;
        all=all.concat(batch);
      }
      for(const ch of all)await walkEntry(ch,targetDir+'/'+entry.name);
    }
  }

  // Selection box
  const selBox=$('#selection-box');
  let dragSel=null;
  document.addEventListener('pointerdown',e=>{
    if(e.target!==layer&&!e.target.closest('#desktop'))return;
    if(e.button!==0)return;
    dragSel={sx:e.clientX,sy:e.clientY};
    selBox.style.display='block';selBox.style.left=e.clientX+'px';selBox.style.top=e.clientY+'px';selBox.style.width='0';selBox.style.height='0';
  });
  document.addEventListener('pointermove',e=>{
    if(!dragSel)return;
    const x=Math.min(dragSel.sx,e.clientX),y=Math.min(dragSel.sy,e.clientY);
    const w=Math.abs(e.clientX-dragSel.sx),h=Math.abs(e.clientY-dragSel.sy);
    selBox.style.left=x+'px';selBox.style.top=y+'px';selBox.style.width=w+'px';selBox.style.height=h+'px';
    // hit test
    const box={l:x,r:x+w,t:y,b:y+h};
    selected.clear();
    for(const [path,{el}] of icons){
      const r=el.getBoundingClientRect();
      const hit=!(r.right<box.l||r.left>box.r||r.bottom<box.t||r.top>box.b);
      el.classList.toggle('selected',hit);
      if(hit)selected.add(path);
    }
  });
  document.addEventListener('pointerup',()=>{if(dragSel){dragSel=null;selBox.style.display='none'}});

  return {init,render,openEntry,exportEntry,selected:()=>selected,DESKTOP_PATH,importFilesTo:async (dir)=>importFilesTo(dir),createFolder,createFile};
})();

async function importFilesTo(dir){
  const inp=document.createElement('input');
  inp.type='file';inp.multiple=true;
  inp.onchange=async()=>{
    for(const f of inp.files){
      try{
        const buf=await f.arrayBuffer();
        await fs.writeFile(dir+'/'+f.name,new Blob([buf],{type:f.type||mimeOf(f.name)}));
      }catch(e){toast('导入失败 '+f.name+': '+e.message,'err')}
    }
    toast('已导入 '+inp.files.length+' 个文件','ok');
    Desktop.render();
  };
  inp.click();
}

async function mountLocal(){
  if(!window.showDirectoryPicker){toast('此浏览器不支持 File System Access API','err');return}
  try{
    const dirH=await showDirectoryPicker({mode:'readwrite'});
    const name=(dirH.name||'local').replace(/[\\/:*?"<>|]/g,'_');
    const mountPath='/mnt/local/'+name;
    await fs.mkdirp('/mnt/local');
    const backend=createLocalBackend(dirH,name);
    fs.registerMount(mountPath,backend);
    toast('已挂载: '+name,'ok');
    Desktop.render();
    // Remember mount in localStorage for prompt
    try{const list=JSON.parse(localStorage.getItem('sageos-mounts')||'[]');if(!list.find(m=>m.name===name)){list.push({name});localStorage.setItem('sageos-mounts',JSON.stringify(list))}}catch{}
  }catch(e){if(e.name!=='AbortError')toast('挂载失败: '+e.message,'err')}
}

/* ============ CLIPBOARD ============ */
const clipboard={
  _items:null,_cut:false,
  copy(items){this._items=items;this._cut=false;toast('已复制 '+items.length+' 项')},
  cut(items){this._items=items;this._cut=true;toast('已剪切 '+items.length+' 项')},
  async paste(dir){
    if(!this._items||!this._items.length){toast('剪贴板为空');return}
    for(const it of this._items){
      const dst=dir+'/'+it.name;
      try{
        await fs.copy(it.path,dst);
        if(this._cut)await fs.rm(it.path);
      }catch(e){toast('粘贴失败: '+e.message,'err')}
    }
    if(this._cut)this._items=null;
    Desktop.render();
    toast('已粘贴','ok');
  },
  has(){return !!(this._items&&this._items.length)}
};
