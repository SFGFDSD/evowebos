registerApp('explorer',{
  title:'文件资源管理器',icon:'explorer',
  open({path='/'}={}){
    let curPath=fs.normPath(path);
    const history=[curPath];let histIdx=0;
    let sortKey='name',sortAsc=true;
    let view='list';
    const w=WM.create({
      title:'文件资源管理器',icon:'explorer',width:820,height:520,type:'explorer',
      content:`<div class="fe">
        <div class="fe-side">
          <h4>快速访问</h4>
          <div class="fe-side-item" data-go="/"><span>${ICONS.home}</span>根目录</div>
          <div class="fe-side-item" data-go="/Desktop"><span>${ICONS.desktop}</span>桌面</div>
          <div class="fe-side-item" data-go="/Documents"><span>${ICONS.text}</span>文档</div>
          <div class="fe-side-item" data-go="/Pictures"><span>${ICONS.image}</span>图片</div>
          <div class="fe-side-item" data-go="/Music"><span>${ICONS.audio}</span>音乐</div>
          <div class="fe-side-item" data-go="/Videos"><span>${ICONS.video}</span>视频</div>
          <h4 style="margin-top:8px">挂载</h4>
          <div class="fe-side-item" id="fe-mount-btn"><span>${ICONS.mount}</span>挂载本地文件夹</div>
          <div id="fe-mount-list"></div>
        </div>
        <div class="fe-main">
          <div class="fe-toolbar">
            <button class="fe-tb-btn" id="fe-back">${ICONS.back}</button>
            <button class="fe-tb-btn" id="fe-fwd">${ICONS.fwd}</button>
            <button class="fe-tb-btn" id="fe-up">${ICONS.up}</button>
            <button class="fe-tb-btn" id="fe-refresh">${ICONS.refresh}</button>
            <div class="fe-breadcrumb" id="fe-bc"></div>
            <input class="fe-search" id="fe-search" placeholder="搜索…">
            <button class="fe-tb-btn" id="fe-new-folder" title="新建文件夹">${ICONS.plus} 文件夹</button>
            <button class="fe-tb-btn" id="fe-upload" title="导入文件">${ICONS.upload}</button>
          </div>
          <div class="fe-list-header" id="fe-hdr">
            <div data-k="name">名称</div>
            <div data-k="type">类型</div>
            <div data-k="size">大小</div>
            <div data-k="mtime">修改日期</div>
          </div>
          <div class="fe-list" id="fe-list"></div>
          <div class="fe-status" id="fe-status"></div>
        </div>
      </div>`,
      onClose(){},
    });
    const el=w.body;

    const renderBreadcrumb=()=>{
      const bc=el.querySelector('#fe-bc');bc.innerHTML='';
      const parts=curPath.split('/').filter(Boolean);
      const crumb=(label,p,isCur)=>{
        const d=document.createElement('span');d.className='fe-crumb'+(isCur?' current':'');d.textContent=label;
        d.onclick=()=>nav(p);bc.appendChild(d);
      };
      crumb('/', '/', parts.length===0);
      parts.forEach((p,i)=>{
        const s=document.createElement('span');s.className='fe-crumb-sep';s.textContent='›';bc.appendChild(s);
        crumb(p,'/'+parts.slice(0,i+1).join('/'),i===parts.length-1);
      });
    };

    const renderList=async()=>{
      const list=el.querySelector('#fe-list');list.innerHTML='';
      try{
        let entries=await fs.readdir(curPath);
        const q=(el.querySelector('#fe-search').value||'').toLowerCase();
        if(q)entries=entries.filter(e=>e.name.toLowerCase().includes(q));
        entries.sort((a,b)=>{
          if(a.type!==b.type)return a.type==='directory'?-1:1;
          let va=a[sortKey],vb=b[sortKey];
          if(sortKey==='name'||sortKey==='type'){va=va||'';vb=vb||'';return sortAsc?naturalSort(va,vb):-naturalSort(va,vb)}
          return sortAsc?((va||0)-(vb||0)):((vb||0)-(va||0));
        });
        if(!entries.length){list.innerHTML='<div class="fe-empty">此文件夹为空</div>';el.querySelector('#fe-status').textContent='0 项';return}
        for(const entry of entries){
          const it=document.createElement('div');
          it.className='fe-item';it.dataset.path=entry.path;it.dataset.type=entry.type;
          const icon=entry.type==='directory'?ICONS.folder:(ICONS[categoryOf(entry.name)]||ICONS.file);
          it.innerHTML=`
            <div class="fe-item-name">${icon}<span>${esc(entry.name)}</span></div>
            <div class="meta">${entry.type==='directory'?'文件夹':extOf(entry.name).toUpperCase()||'FILE'}</div>
            <div class="meta">${entry.type==='file'?formatBytes(entry.size):'—'}</div>
            <div class="meta">${formatDate(entry.mtime)}</div>
          `;
          it.addEventListener('click',ev=>{
            if(!ev.ctrlKey&&!ev.metaKey){list.querySelectorAll('.fe-item.selected').forEach(x=>x.classList.remove('selected'))}
            it.classList.toggle('selected');
          });
          it.addEventListener('dblclick',()=>openItem(entry));
          it.addEventListener('contextmenu',ev=>{ev.preventDefault();showItemCtx(ev.clientX,ev.clientY,entry)});
          list.appendChild(it);
        }
        el.querySelector('#fe-status').textContent=`${entries.length} 项 · ${entries.filter(e=>e.type==='file').reduce((s,e)=>s+(e.size||0),0)|0} 字节`;
      }catch(e){
        list.innerHTML=`<div class="fe-empty">无法读取: ${esc(e.message)}</div>`;
      }
    };

    const refreshMountList=()=>{
      const ml=el.querySelector('#fe-mount-list');ml.innerHTML='';
      for(const m of fs.listMounts()){
        const d=document.createElement('div');d.className='fe-side-item';d.dataset.go=m.path;
        d.innerHTML=`<span>${ICONS.disk}</span>${esc(fs.baseName(m.path))}`;
        ml.appendChild(d);
      }
    };

    const nav=(p,addHist=true)=>{
      p=fs.normPath(p);curPath=p;
      if(addHist){history.splice(histIdx+1);history.push(p);histIdx=history.length-1}
      renderBreadcrumb();renderList();
      el.querySelectorAll('.fe-side-item').forEach(i=>i.classList.toggle('active',i.dataset.go===p));
      w.el.querySelector('.win-title-text').textContent='文件资源管理器 — '+p;
    };

    async function openItem(entry){
      if(entry.type==='directory'){nav(entry.path);return}
      Desktop.openEntry(entry);
    }

    function showItemCtx(x,y,entry){
      const items=[
        {label:entry.type==='directory'?'打开':'打开',icon:ICONS.folder,action:()=>openItem(entry)},
      ];
      if(entry.type==='file'){
        items.push({label:'导出下载',icon:ICONS.download,action:()=>Desktop.exportEntry(entry)});
      }
      items.push('-');
      items.push({label:'复制',icon:ICONS.copy,action:()=>clipboard.copy([entry])});
      items.push({label:'剪切',icon:ICONS.copy,action:()=>clipboard.cut([entry])});
      if(entry.type==='directory')items.push({label:'粘贴',icon:ICONS.paste,action:()=>clipboard.paste(entry.path).then(()=>renderList()),disabled:!clipboard.has()});
      items.push({label:'重命名',icon:ICONS.rename,action:async()=>{
        const r=await dialog({title:'重命名',value:entry.name,buttons:['确定','取消'],input:true});
        if(r.index===0&&r.value&&r.value!==entry.name){
          try{await fs.rename(entry.path,fs.parentPath(entry.path)+'/'+r.value);renderList();Desktop.render()}catch(e){toast(e.message,'err')}
        }
      }});
      items.push({label:'删除',icon:ICONS.trash,action:async()=>{
        const r=await dialog({title:'删除',message:`删除 "${entry.name}"？`,buttons:['删除','取消']});
        if(r.index===0){try{await fs.rm(entry.path);renderList();Desktop.render()}catch(e){toast(e.message,'err')}}
      }});
      if(entry.type==='file'&&categoryOf(entry.name)==='archive'){
        items.push('-');items.push({label:'解压到当前文件夹',icon:ICONS.archive,action:()=>extractArchive(entry)});
      }
      CTX.show(x,y,items);
    }

    async function extractArchive(entry){
      try{
        const ext=extOf(entry.name);
        if(ext==='zip'){
          if(typeof JSZip==='undefined'){toast('JSZip 未加载','err');return}
          const blob=await fs.readFile(entry.path);
          const zip=await JSZip.loadAsync(blob);
          const base=entry.name.replace(/\.zip$/i,'');
          const target=curPath+'/'+base;await fs.mkdirp(target);
          let count=0;
          for(const name of Object.keys(zip.files)){
            const f=zip.files[name];
            if(f.dir)await fs.mkdirp(target+'/'+name);
            else{
              const buf=await f.async('arraybuffer');
              await fs.writeFile(target+'/'+name,new Blob([buf]));count++;
            }
          }
          toast(`解压完成: ${count} 个文件`,'ok');renderList();Desktop.render();
        }else if(ext==='gz'||ext==='tgz'||ext==='tar'){
          toast('请使用 .zip 格式，或尝试用记事本查看','err');
        }else{
          toast('不支持的压缩格式','err');
        }
      }catch(e){toast('解压失败: '+e.message,'err')}
    }

    el.querySelector('#fe-back').onclick=()=>{if(histIdx>0){histIdx--;nav(history[histIdx],false)}};
    el.querySelector('#fe-fwd').onclick=()=>{if(histIdx<history.length-1){histIdx++;nav(history[histIdx],false)}};
    el.querySelector('#fe-up').onclick=()=>nav(fs.parentPath(curPath));
    el.querySelector('#fe-refresh').onclick=renderList;
    el.querySelector('#fe-search').oninput=renderList;
    el.querySelector('#fe-new-folder').onclick=async()=>{
      const r=await dialog({title:'新建文件夹',value:'新建文件夹',buttons:['创建','取消'],input:true});
      if(r.index===0&&r.value){try{await fs.mkdirp(curPath+'/'+r.value);renderList();Desktop.render()}catch(e){toast(e.message,'err')}}
    };
    el.querySelector('#fe-upload').onclick=()=>importFilesTo(curPath).then(()=>{renderList();Desktop.render()});
    el.querySelector('#fe-mount-btn').onclick=()=>mountLocal().then(()=>{refreshMountList();renderList()});

    el.querySelectorAll('.fe-side-item[data-go]').forEach(i=>i.onclick=()=>nav(i.dataset.go));
    el.querySelectorAll('#fe-hdr > div').forEach(h=>{
      h.onclick=()=>{
        const k=h.dataset.k;
        if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true}
        el.querySelectorAll('#fe-hdr > div').forEach(x=>x.classList.remove('sorted'));
        h.classList.add('sorted');h.textContent=h.textContent.replace(/ [▲▼]$/,'')+(sortAsc?' ▲':' ▼');
        renderList();
      };
    });

    // List drag & drop (move files into folders)
    const listEl=el.querySelector('#fe-list');
    listEl.addEventListener('dragover',e=>{
      const it=e.target.closest('.fe-item');
      if(it&&it.dataset.type==='directory'){e.preventDefault();e.dataTransfer.dropEffect='move';it.style.background='rgba(217,119,6,0.25)'}
    });
    listEl.addEventListener('dragleave',e=>{const it=e.target.closest('.fe-item');if(it)it.style.background=''});
    listEl.addEventListener('drop',async e=>{
      const it=e.target.closest('.fe-item');
      if(!it||it.dataset.type!=='directory')return;
      e.preventDefault();it.style.background='';
      const srcPath=e.dataTransfer.getData('application/x-sageos-path');
      if(srcPath){
        try{await fs.rename(srcPath,it.dataset.path+'/'+fs.baseName(srcPath));renderList();Desktop.render();toast('已移动','ok')}
        catch(err){toast(err.message,'err')}
      }
    });

    // Paste via keyboard
    w.el.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='v'){clipboard.paste(curPath).then(()=>{renderList();Desktop.render()})}
    });

    renderBreadcrumb();renderList();refreshMountList();
    return w;
  }
});

        <textarea class="np-area" id="np-area" spellcheck="false" placeholder="在此输入…"></textarea>
        <div class="tbl-wrap" id="np-tbl-wrap" style="display:none"></div>
        <div class="np-status"><span id="np-pos">行 1, 列 1</span><span id="np-len">0 字符</span><span id="np-file">未保存</span></div>
      </div>`
    });
    const el=w.body;
    const area=el.querySelector('#np-area');
    const tblWrap=el.querySelector('#np-tbl-wrap');
    const tblBtn=el.querySelector('#np-tbl');
    let tableViewOn=false;

    async function load(path){
      try{
        content=await fs.readFileText(path);
        curFile=path;area.value=content;
        w.el.querySelector('.win-title-text').textContent='记事本 — '+fs.baseName(path);
        el.querySelector('#np-file').textContent=path;
        isCSV=/\.(csv|tsv)$/i.test(path);
        tblBtn.style.display=isCSV?'flex':'none';
        updateStatus();
      }catch(e){toast('打开失败: '+e.message,'err')}
    }
    async function save(to){
      const target=to||curFile;
      if(!target){return saveAs()}
      try{await fs.writeFile(target,area.value);curFile=target;content=area.value;toast('已保存','ok');Desktop.render();el.querySelector('#np-file').textContent=target}
      catch(e){toast('保存失败: '+e.message,'err')}
    }
    async function saveAs(){
      const r=await dialog({title:'另存为',value:curFile?fs.baseName(curFile):'untitled.txt',buttons:['保存','取消'],input:true});
      if(r.index!==0||!r.value)return;
      const dir=curFile?fs.parentPath(curFile):'/Documents';
      await fs.mkdirp(dir);
      save(dir+'/'+r.value);
    }
    function updateStatus(){
      const v=area.value;
      const pos=area.selectionStart;
      const before=v.slice(0,pos);
      const line=(before.match(/\n/g)||[]).length+1;
      const col=pos-before.lastIndexOf('\n');
      el.querySelector('#np-pos').textContent=`行 ${line}, 列 ${col}`;
      el.querySelector('#np-len').textContent=v.length+' 字符';
    }
    function renderTable(){
      const sep=isCSV&&curFile&&/\.csv$/i.test(curFile)?',':'\t';
      const lines=area.value.split(/\r?\n/).filter(l=>l.length);
      if(!lines.length){tblWrap.innerHTML='<div class="fe-empty">无数据</div>';return}
      const rows=lines.map(l=>{
        if(sep===','){return l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim())}
        return l.split(sep);
      });
      const hdr=rows[0];
      let html='<table class="tbl"><thead><tr>'+hdr.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>';
      for(let i=1;i<rows.length;i++){
        html+='<tr>'+hdr.map((_,j)=>`<td>${esc(rows[i][j]||'')}</td>`).join('')+'</tr>';
      }
      html+='</tbody></table>';
      tblWrap.innerHTML=html;
    }

    area.addEventListener('input',()=>{content=area.value;updateStatus();if(tableViewOn)renderTable()});
    area.addEventListener('keyup',updateStatus);area.addEventListener('click',updateStatus);
    el.querySelector('#np-new').onclick=()=>{curFile=null;area.value='';content='';w.el.querySelector('.win-title-text').textContent='记事本';el.querySelector('#np-file').textContent='未保存'};
    el.querySelector('#np-open').onclick=async()=>{
      const inp=document.createElement('input');inp.type='file';
      inp.onchange=async()=>{
        const f=inp.files[0];if(!f)return;
        const path='/Documents/'+f.name;
        const buf=await f.arrayBuffer();
        await fs.writeFile(path,new Blob([buf],{type:f.type}));
        await load(path);
      };
      inp.click();
    };
    el.querySelector('#np-save').onclick=()=>save();
    el.querySelector('#np-saveas').onclick=saveAs;
    tblBtn.onclick=()=>{
      tableViewOn=!tableViewOn;
      area.style.display=tableViewOn?'none':'block';
      tblWrap.style.display=tableViewOn?'block':'none';
      tblBtn.textContent=tableViewOn?'切换文本视图':'切换表格视图';
      if(tableViewOn)renderTable();
    };
    w.el.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});

    if(path)load(path);
    if(tableView&&/\.(csv|tsv)$/i.test(path||''))setTimeout(()=>tblBtn.click(),100);
    updateStatus();
    return w;
  }
});

registerApp('editor',{

        </div>
        <div class="he-split">
          <div class="he-editor"><textarea id="he-ta"></textarea></div>
          <div class="he-divider" id="he-div"></div>
          <div class="he-preview"><iframe id="he-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox"></iframe></div>
        </div>
        <div class="he-status">
          <span id="he-pos">行 1, 列 1</span>
          <span id="he-sel"></span>
          <span id="he-total">0 行 · 0 字符</span>

          <span>UTF-8</span>
        </div>
      </div>`,
      onClose(){try{if(cm)cm.toTextArea()}catch{}}
    });
    const el=w.body;
    const ta=el.querySelector('#he-ta');
    const iframe=el.querySelector('#he-frame');
    const modeSelect=el.querySelector('#he-mode');

    // Init CodeMirror
    if(typeof CodeMirror!=='undefined'){
      cm=CodeMirror.fromTextArea(ta,{
        mode:currentMode,theme:'material-darker',
        lineNumbers:true,lineWrapping:true,
        styleActiveLine:true,matchBrackets:true,autoCloseBrackets:true,
        matchTags:{bothTags:true},autoCloseTags:true,
        foldGutter:true,gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
        extraKeys:{
          'Ctrl-S':()=>save(),'Cmd-S':()=>save(),
          'Ctrl-F':()=>openFind(false),'Cmd-F':()=>openFind(false),
          'Ctrl-H':()=>openFind(true),'Cmd-H':()=>openFind(true),
          'Ctrl-Shift-F':()=>doFormat(),'Cmd-Shift-F':()=>doFormat(),
          'Ctrl-Enter':()=>refreshPreview(),'Cmd-Enter':()=>refreshPreview(),
          'Ctrl-Z':'undo','Cmd-Z':'undo',
          'Ctrl-Y':'redo','Cmd-Y':'redo','Shift-Cmd-Z':'redo',
          'F3':()=>findNext(false),'Shift-F3':()=>findNext(true),
          'Esc':()=>closeFind(),
        }
      });
      cm.on('cursorActivity',updateStatus);
      cm.on('change',()=>{updateStatus();autoRefresh()});
    }else{
      ta.style.display='block';ta.style.width='100%';ta.style.height='100%';
    }

    function modeForExt(ext){
      const map={html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',mjs:'javascript',json:'application/json',md:'markdown',markdown:'markdown',xml:'xml',svg:'xml'};
      return map[ext]||'htmlmixed';
    }
    function extForMode(m){
      const map={'htmlmixed':'html','css':'css','javascript':'js','markdown':'md','application/json':'json','xml':'xml'};
      return map[m]||'txt';
    }
    function labelForMode(m){return {'htmlmixed':'HTML','css':'CSS','javascript':'JavaScript','markdown':'Markdown','application/json':'JSON','xml':'XML'}[m]||m}

    if(path){
      fs.readFileText(path).then(t=>{
        if(cm){cm.setValue(t);cm.clearHistory()}else ta.value=t;
        const m=modeForExt(extOf(path));
        currentMode=m;if(cm)cm.setOption('mode',m);
        modeSelect.value=m;
        refreshPreview();
      }).catch(e=>toast('加载失败: '+e.message,'err'));
    }else{
      const init=content||'<!DOCTYPE html>\n<html>\n<head><title>Hello</title></head>\n<body>\n  <h1>Hello, SageOS</h1>\n</body>\n</html>';
      if(cm)cm.setValue(init);else ta.value=init;
      refreshPreview();
    }

    function getVal(){return cm?cm.getValue():ta.value}
    function setVal(v){if(cm)cm.setValue(v);else ta.value=v}

    function updateStatus(){
      if(!cm)return;
      const cur=cm.getCursor();
      el.querySelector('#he-pos').textContent=`行 ${cur.line+1}, 列 ${cur.ch+1}`;
      const sel=cm.getSelection();
      el.querySelector('#he-sel').textContent=sel?`已选 ${sel.length} 字符`:'';
      const v=cm.getValue();
      el.querySelector('#he-total').textContent=`${cm.lineCount()} 行 · ${v.length} 字符`;
      el.querySelector('#he-lang').textContent=labelForMode(currentMode);
    }

    let refreshTimer=null;
    function autoRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(refreshPreview,400)}

    function refreshPreview(){
      const v=getVal();
      if(currentMode!=='htmlmixed'){
        // Wrap non-html modes for preview
        let html=v;
        if(currentMode==='css')html=`<html><head><style>${v}</style></head><body><h2>CSS 预览</h2><p>此页面应用了你的样式。</p></body></html>`;
        else if(currentMode==='markdown')html=`<html><body style="font-family:serif;max-width:720px;margin:40px auto;padding:20px"><pre style="white-space:pre-wrap">${esc(v)}</pre></body></html>`;
        else if(currentMode==='javascript')html=`<html><body><pre id="out"></pre><script>try{const __log=()=>{document.getElementById('out').textContent=Array.from(arguments).join(' ')};const __oldLog=console.log;console.log=function(){__log.apply(null,arguments);__oldLog.apply(console,arguments)};${v}}catch(e){document.body.innerHTML='<pre style=color:red>'+e.message+'</pre>'}<\/script></body></html>`;
        else if(currentMode==='application/json')html=`<html><body style="font-family:monospace;padding:20px"><pre>${esc(v)}</pre></body></html>`;
        else html=`<html><body><pre>${esc(v)}</pre></body></html>`;
        writePreview(html);return;
      }
      writePreview(v);
    }
    function writePreview(html){
      try{
        const doc=iframe.contentDocument;
        doc.open();doc.write(html);doc.close();
      }catch(e){
        const blob=new Blob([html],{type:'text/html'});
        iframe.src=URL.createObjectURL(blob);
      }
    }

    async function save(){
      if(!curFile){
        const r=await dialog({title:'保存',value:'untitled.'+extForMode(currentMode),buttons:['保存','取消'],input:true});
        if(r.index!==0)return;
        curFile='/Documents/'+r.value;
      }
      try{
        await fs.writeFile(curFile,getVal());
        w.el.querySelector('.win-title-text').textContent='HTML 编辑器 — '+fs.baseName(curFile);
        toast('已保存','ok');Desktop.render();
        // Refresh any explorer windows on same dir
      }catch(e){toast('保存失败: '+e.message,'err')}
    }

    function doFormat(){
      if(typeof beautify==='undefined'&&typeof html_beautify==='undefined'){toast('格式化库未加载','err');return}
      const v=getVal();let out=v;
      try{
        const opts={indent_size:2,max_preserve_newlines:2,end_with_newline:true};
        if(currentMode==='htmlmixed')out=html_beautify(v,Object.assign(opts,{indent_inner_html:true,wrap_line_length:120}));
        else if(currentMode==='css')out=css_beautify(v,opts);
        else if(currentMode==='javascript')out=js_beautify(v,opts);
        else if(currentMode==='application/json')out=js_beautify(v,opts);
        else return;
        if(cm){const cur=cm.getCursor();cm.setValue(out);cm.setCursor(cur)}
        else setVal(out);
      }catch(e){toast('格式化失败: '+e.message,'err')}
    }

    // Find & replace
    let findCursor=null;let findMatches=[];let findMarkers=[];
    function openFind(withReplace){
      const fb=el.querySelector('#he-findbar');fb.classList.add('open');
      el.querySelector('#he-replace-input').style.display=withReplace?'block':'none';
      el.querySelector('#he-rep-one').style.display=withReplace?'flex':'none';
      el.querySelector('#he-rep-all').style.display=withReplace?'flex':'none';
      (withReplace?el.querySelector('#he-replace-input'):el.querySelector('#he-find-input')).focus();
      doFind();
    }
    function closeFind(){el.querySelector('#he-findbar').classList.remove('open');clearMarkers()}
    function clearMarkers(){if(cm)findMarkers.forEach(m=>m.remove());findMarkers=[]}
    function doFind(){
      if(!cm)return;clearMarkers();
      const q=el.querySelector('#he-find-input').value;
      if(!q){el.querySelector('#he-find-matches').textContent='0/0';findMatches=[];return}
      const caseI=!el.querySelector('#he-case').classList.contains('on');
      const whole=el.querySelector('#he-word').classList.contains('on');
      const re=el.querySelector('#he-regex').classList.contains('on');
      let regex;
      try{
        const flags='g'+(caseI?'i':'');
        regex=re?new RegExp(q,flags):new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags);
      }catch(e){el.querySelector('#he-find-matches').textContent='无效正则';return}
      const text=cm.getValue();findMatches=[];let m;
      while((m=regex.exec(text))!==null){
        if(m[0].length===0){regex.lastIndex++;continue}
        const from=cm.posFromIndex(m.index);const to=cm.posFromIndex(m.index+m[0].length);
        findMatches.push({from,to});
      }
      findMatches.forEach((mt,i)=>{
        findMarkers.push(cm.markText(mt.from,mt.to,{className:i===0?'cm-current-searching':'cm-searching'}));
      });
      findCursor=0;
      el.querySelector('#he-find-matches').textContent=findMatches.length?`${findCursor+1}/${findMatches.length}`:'0/0';
      if(findMatches[0])cm.scrollIntoView(findMatches[0].from,100);
    }
    function findNext(prev){
      if(!findMatches.length)return;
      findCursor=(findCursor+(prev?-1:1)+findMatches.length)%findMatches.length;
      clearMarkers();
      findMatches.forEach((mt,i)=>{
        findMarkers.push(cm.markText(mt.from,mt.to,{className:i===findCursor?'cm-current-searching':'cm-searching'}));
      });
      cm.scrollIntoView(findMatches[findCursor].from,100);
      el.querySelector('#he-find-matches').textContent=`${findCursor+1}/${findMatches.length}`;
    }
    function replaceOne(){
      if(!findMatches.length||findCursor==null)return;
      const m=findMatches[findCursor];
      const repl=el.querySelector('#he-replace-input').value;
      cm.replaceRange(repl,m.from,m.to);
      doFind();
    }
    function replaceAll(){
      const q=el.querySelector('#he-find-input').value;const repl=el.querySelector('#he-replace-input').value;
      if(!q)return;
      const caseI=!el.querySelector('#he-case').classList.contains('on');
      const re=el.querySelector('#he-regex').classList.contains('on');
      try{
        const flags='g'+(caseI?'i':'');
        const regex=re?new RegExp(q,flags):new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags);
        setVal(cm.getValue().replace(regex,repl));
        doFind();
      }catch(e){toast('无效正则','err')}
    }

    // Divider drag
    const div=el.querySelector('#he-div');const split=el.querySelector('.he-split');
    const edPane=el.querySelector('.he-editor');const pvPane=el.querySelector('.he-preview');
    div.addEventListener('pointerdown',e=>{
      div.classList.add('active');div.setPointerCapture(e.pointerId);
      const sx=e.clientX;const sw=split.offsetWidth;
      const ew0=edPane.offsetWidth,pw0=pvPane.offsetWidth;
      const mv=ev=>{
        const dx=ev.clientX-sx;let nw=ew0+dx;
        nw=Math.max(200,Math.min(sw-125,nw));
        edPane.style.flex='0 0 '+nw+'px';pvPane.style.flex='1';
      };
      const up=()=>{div.classList.remove('active');div.removeEventListener('pointermove',mv);div.removeEventListener('pointerup',up);if(cm)cm.refresh()};
      div.addEventListener('pointermove',mv);div.addEventListener('pointerup',up);
    });

    // Wire buttons
    modeSelect.onchange=()=>{currentMode=modeSelect.value;if(cm)cm.setOption('mode',currentMode);updateStatus();refreshPreview()};
    el.querySelector('#he-run').onclick=refreshPreview;
    el.querySelector('#he-refresh').onclick=refreshPreview;
    el.querySelector('#he-save').onclick=save;
    el.querySelector('#he-new').onclick=()=>{if(cm)cm.setValue('');else ta.value='';curFile=null;w.el.querySelector('.win-title-text').textContent='HTML 编辑器'};
    el.querySelector('#he-open').onclick=()=>{
      const inp=document.createElement('input');inp.type='file';
      inp.onchange=async()=>{
        const f=inp.files[0];if(!f)return;
        const t=await f.text();setVal(t);
        const m=modeForExt(extOf(f.name));currentMode=m;if(cm)cm.setOption('mode',m);modeSelect.value=m;
        refreshPreview();
      };
      inp.click();
    };
    el.querySelector('#he-export').onclick=()=>{
      const blob=new Blob([getVal()],{type:'text/plain'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='export.'+extForMode(currentMode);a.click();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    };
    el.querySelector('#he-undo').onclick=()=>{if(cm)cm.undo();else document.execCommand('undo')};
    el.querySelector('#he-redo').onclick=()=>{if(cm)cm.redo();else document.execCommand('redo')};
    el.querySelector('#he-format').onclick=doFormat;
    el.querySelector('#he-clear').onclick=()=>setVal('');
    el.querySelector('#he-newtab').onclick=()=>{
      const blob=new Blob([getVal()],{type:'text/html'});
      window.open(URL.createObjectURL(blob),'_blank');
    };
    el.querySelector('#he-fold').onclick=()=>{if(!cm)return;for(let i=0;i<cm.lineCount();i++)try{cm.foldCode({line:i,ch:0})}catch{}};
    el.querySelector('#he-unfold').onclick=()=>{
      if(!cm)return;
      // Unfold all: iterate and unfold where folded
      for(let i=0;i<cm.lineCount();i++){
        try{
          // foldCode toggles; pass range to force unfold
          const info=cm.lineInfo(i);
          if(info&&info.gutterMarkers&&info.gutterMarkers['CodeMirror-foldgutter']){
            cm.foldCode({line:i,ch:0},{range:{from:{line:i,ch:0},to:{line:i,ch:0}}});
          }
        }catch{}
      }
    };
    el.querySelector('#he-find').onclick=()=>openFind(false);
    el.querySelector('#he-replace').onclick=()=>openFind(true);
    el.querySelector('#he-find-input').oninput=doFind;
    el.querySelector('#he-find-prev').onclick=()=>findNext(true);
    el.querySelector('#he-find-next').onclick=()=>findNext(false);
    el.querySelector('#he-find-input').addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();findNext(e.shiftKey)}
      if(e.key==='Escape')closeFind();
    });
    el.querySelector('#he-rep-one').onclick=replaceOne;
    el.querySelector('#he-rep-all').onclick=replaceAll;
    el.querySelector('#he-find-close').onclick=closeFind;
    ['#he-case','#he-word','#he-regex'].forEach(s=>el.querySelector(s).onclick=e=>{e.target.classList.toggle('on');doFind()});

    updateStatus();
    return w;
  }
});

/* ============ MANGA VIEWER ============ */
registerApp('manga',{
  title:'漫画阅读器',icon:'manga',
  async open({path}={}){
    if(!path){toast('未指定文件','err');return}
    const dir=fs.parentPath(path);
    const fname=fs.baseName(path);
    const w=WM.create({
      title:'漫画阅读器',icon:'manga',width:820,height:680,type:'manga',
      content:`<div class="mv">
        <div class="mv-toolbar">
          <span class="mv-title" id="mv-title">${esc(fname)}</span>
          <button class="he-btn" id="mv-fs">${ICONS.fullscreen} 全屏</button>
        </div>
        <div class="mv-scroll" id="mv-scroll"><div class="mv-loading">加载中…</div></div>
      </div>
      <button class="mv-exit-fs" id="mv-exit">${ICONS.close}</button>`
    });
    const el=w.body;
    const scroll=el.querySelector('#mv-scroll');
    try{
      const entries=await fs.readdir(dir);
      const imgs=entries.filter(e=>e.type==='file'&&/^(jpg|jpeg|png|webp|gif)$/i.test(extOf(e.name)));
      imgs.sort((a,b)=>naturalSort(a.name,b.name));
      if(!imgs.length){scroll.innerHTML='<div class="mv-empty fe-empty">该目录下没有图片</div>';return}
      // Parallel read
      const blobs=await Promise.all(imgs.map(async im=>{
        try{const b=await fs.readFile(im.path);return {im,blob:b}}catch{return {im,blob:null}}
      }));
      scroll.innerHTML='';
      let targetEl=null;
      for(const {im,blob} of blobs){
        if(!blob){const d=document.createElement('div');d.className='mv-loading';d.textContent='加载失败: '+im.name;scroll.appendChild(d);continue}
        const img=document.createElement('img');
        img.src=URL.createObjectURL(blob);
        img.alt=im.name;img.title=im.name;
        img.loading='lazy';
        scroll.appendChild(img);
        if(im.name===fname)targetEl=img;
      }
      w.el.querySelector('.win-title-text').textContent='漫画阅读器 — '+imgs.length+' 页';
      if(targetEl)setTimeout(()=>targetEl.scrollIntoView({behavior:'auto',block:'start'}),50);
    }catch(e){scroll.innerHTML='<div class="fe-empty">读取失败: '+esc(e.message)+'</div>'}

    const fsBtn=el.querySelector('#mv-fs');
    const exitBtn=el.querySelector('#mv-exit');
    async function toggleFs(){
      if(!document.fullscreenElement){
        try{await w.el.requestFullscreen();w.el.classList.add('fullscreen-manga');exitBtn.classList.add('visible')}catch{}
      }else{
        await document.exitFullscreen();
      }
    }
    fsBtn.onclick=toggleFs;
    exitBtn.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen()};
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement){w.el.classList.remove('fullscreen-manga');exitBtn.classList.remove('visible')}
    });
    return w;
  }
});

registerApp('calc',{
  title:'计算器',icon:'calc',
  open(){
    const w=WM.create({
      title:'计算器',icon:'calc',width:280,height:400,type:'calc',
      content:`<div class="calc">
        <div class="calc-disp"><div class="prev" id="c-prev"></div><div id="c-cur">0</div></div>
        <div class="calc-grid" id="c-grid"></div>
      </div>`
    });
    const el=w.body;const grid=el.querySelector('#c-grid');
    const cur=el.querySelector('#c-cur');const prev=el.querySelector('#c-prev');
    let state={val:'0',prev:null,op:null,reset:false};
    const buttons=[
      ['C','clr'],['±','op'],['%','op'],['÷','op'],
      ['7',''],['8',''],['9',''],['×','op'],
      ['4',''],['5',''],['6',''],['−','op'],
      ['1',''],['2',''],['3',''],['＋','op'],
      ['0',''],['.',''],['⌫',''],['=','eq'],
    ];
    buttons.forEach(([l,cls])=>{
      const b=document.createElement('button');b.className='calc-btn '+cls;b.textContent=l;
      b.onclick=()=>press(l);grid.appendChild(b);
    });
    function press(k){
      if('0123456789'.includes(k)){
        if(state.val==='0'||state.reset){state.val=k;state.reset=false}
        else state.val+=k;
      }else if(k==='.'){if(!state.val.includes('.'))state.val+='.'}
      else if(k==='C'){state={val:'0',prev:null,op:null,reset:false};prev.textContent=''}
      else if(k==='⌫'){state.val=state.val.length>1?state.val.slice(0,-1):'0'}
      else if(k==='±'){state.val=String(-parseFloat(state.val))}
      else if(k==='%'){state.val=String(parseFloat(state.val)/100)}
      else if('＋−×÷'.includes(k)){
        if(state.prev!=null&&state.op&&!state.reset)compute();
        state.prev=parseFloat(state.val);state.op=k;state.reset=true;
        prev.textContent=state.prev+' '+k;
      }else if(k==='='){compute();prev.textContent='';state.op=null}
      cur.textContent=state.val;
    }
    function compute(){
      if(state.prev==null||!state.op)return;
      const a=state.prev,b=parseFloat(state.val);let r=0;
      if(state.op==='＋')r=a+b;else if(state.op==='−')r=a-b;else if(state.op==='×')r=a*b;else if(state.op==='÷')r=b===0?0:a/b;
      state.val=String(+r.toFixed(10));state.prev=r;state.reset=true;
    }
    return w;
  }
});

    let last=null;
    cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y)});
    cv.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const p=pos(e);
      ctx.strokeStyle=curTool==='eraser'?'white':curColor;
      ctx.lineWidth=curSize;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
    });
    cv.addEventListener('pointerup',()=>drawing=false);
    cv.addEventListener('pointerleave',()=>drawing=false);
    return w;
  }
});

/* ============ VIRTUAL MACHINE (v86) ============ */
let v86Loaded=false;let v86Loading=false;
function loadV86(){
  if(window.V86)return Promise.resolve();
  if(v86Loading)return new Promise(r=>{const c=setInterval(()=>{if(window.V86){clearInterval(c);r()}},100)});
  v86Loading=true;
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js';
    s.onload=()=>{v86Loaded=true;v86Loading=false;res()};
    s.onerror=()=>{v86Loading=false;rej(new Error('v86 加载失败'))};
    document.head.appendChild(s);
  });
}

          </div>
        </div>

    });

        try{
          isoBuffer=await f.arrayBuffer();
          isoName=f.name;
          el.querySelector('#vm-status').textContent='已加载: '+f.name+' ('+formatBytes(f.size)+')';
          el.querySelector('#vm-start').disabled=false;

      el.querySelector('#vm-placeholder').style.display='none';

      el.querySelector('#vm-status').textContent='正在启动…';

        wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
        memory_size:256*1024*1024,
        vga_memory_size:16*1024*1024,
        screen_container:scr,
        bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},

        autostart:true,
      };
      if(ext==='iso')cfg.cdrom={buffer:isoBuffer};
      else if(ext==='fda'||ext==='img'||ext==='bin')cfg.fda={buffer:isoBuffer};
      else cfg.hda={buffer:isoBuffer};
      try{
        w._emu=new V86(cfg);
        el.querySelector('#vm-start').disabled=true;
        el.querySelector('#vm-stop').disabled=false;
        el.querySelector('#vm-status').textContent='运行中';
      }catch(e){toast('启动失败: '+e.message,'err')}
    };

      el.querySelector('#vm-screen').style.display='none';
      el.querySelector('#vm-placeholder').style.display='block';
      el.querySelector('#vm-start').disabled=false;
      el.querySelector('#vm-stop').disabled=true;
      el.querySelector('#vm-status').textContent='已停止';
    };

  }
});

        main.querySelector('#st-wp-clear').onclick=()=>{wl.style.backgroundImage='';localStorage.removeItem('sageos-wp');localStorage.removeItem('sageos-wp-img');main.querySelectorAll('.wp-tile').forEach(x=>x.classList.remove('active'))};
      }else if(t==='storage'){
        main.innerHTML=`<h2>存储</h2><div class="lead">OPFS 用量与文件分布</div><div id="st-st-body">加载中…</div>`;
        const body=main.querySelector('#st-st-body');
        (async()=>{
          const est=await fs.estimate();
          const usage=est.usage||0;const quota=est.quota||0;
          const pct=quota?((usage/quota)*100).toFixed(1):0;
          // Walk root
          const categories={documents:{c:0,s:0,col:'#d97706'},images:{c:0,s:0,col:'#c2410c'},media:{c:0,s:0,col:'#7c3aed'},archives:{c:0,s:0,col:'#16a34a'},other:{c:0,s:0,col:'#78866b'}};
          async function walk(p){
            try{
              const entries=await fs.readdir(p);
              for(const e of entries){
                if(e.type==='file'){
                  const cat=categoryOf(e.name);const sz=e.size||0;
                  if(cat==='image'){categories.images.c++;categories.images.s+=sz}
                  else if(cat==='audio'||cat==='video'||cat==='pdf'){categories.media.c++;categories.media.s+=sz}
                  else if(cat==='archive'){categories.archives.c++;categories.archives.s+=sz}
                  else if(cat==='text'){categories.documents.c++;categories.documents.s+=sz}
                  else{categories.other.c++;categories.other.s+=sz}
                }else{await walk(e.path)}
              }
            }catch{}
          }
          await walk('/');
          const total=Object.values(categories).reduce((s,c)=>s+c.s,0)||1;
          body.innerHTML=`
            <div class="st-section">
              <h3>OPFS 配额</h3>
              <div class="storage-bar">
                <div class="storage-seg" style="width:${pct}%;background:var(--amber)"></div>
                <div class="storage-seg" style="width:${100-pct}%;background:var(--bg-2)"></div>
              </div>
              <div style="font-size:12px;color:var(--ink-1)">已用 <b>${formatBytes(usage)}</b> / 可用 <b>${formatBytes(quota)}</b> (${pct}%)</div>
            </div>
            <div class="st-section">
              <h3>文件类型分布</h3>
              <div class="storage-bar">
                ${Object.entries(categories).map(([k,v])=>`<div class="storage-seg" style="width:${(v.s/total*100)||0.2}%;background:${v.col}" title="${k}: ${formatBytes(v.s)}"></div>`).join('')}
              </div>
              <div class="storage-legend">
                ${Object.entries(categories).map(([k,v])=>`<span style="--c:${v.col}"><span style="background:${v.col};display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px"></span>${k}: ${v.c} 个文件, ${formatBytes(v.s)}</span>`).join('')}
              </div>
            </div>`;
        })();
      }else{
        main.innerHTML=`
          <h2>关于 SageOS</h2>
          <div class="lead">一个完全运行于浏览器中的单文件桌面操作系统</div>
          <div class="st-section">
            <h3>技术栈</h3>
            <div style="font-size:12px;color:var(--ink-1);line-height:1.8">
              • <b>OPFS</b>（Origin Private File System）持久化虚拟文件系统<br>
              • <b>IndexedDB</b> 降级方案<br>
              • <b>File System Access API</b> 本地文件夹挂载<br>
              • <b>CodeMirror 5</b> 代码编辑器内核<br>
              • <b>js-beautify</b> 代码格式化<br>
              • <b>JSZip</b> ZIP 解压<br>
              • 原生 HTML5 Drag &amp; Drop + Pointer Events 双向拖拽
            </div>
          </div>
          <div class="st-section">
            <h3>版本</h3>
            <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">SageOS v1.0 · single-file build · ${new Date().toLocaleDateString()}</div>
          </div>`;
      }
    }
    renderTab('general');
    return w;
  }
});

/* ============ START MENU ============ */
function initStartMenu(){
  const menu=$('#start-menu');
  const grid=$('#app-grid');
  const apps=[
    {id:'explorer',name:'文件资源管理器',icon:'explorer'},
    {id:'notepad',name:'记事本',icon:'notepad'},
    {id:'editor',name:'HTML 编辑器',icon:'editor'},
    {id:'browser',name:'浏览器',icon:'browser'},
    {id:'calc',name:'计算器',icon:'calc'},
    {id:'paint',name:'画板',icon:'paint'},
    {id:'manga',name:'漫画阅读器',icon:'manga'},
    {id:'vm',name:'虚拟机',icon:'desktop'},
    {id:'settings',name:'设置',icon:'settings'},
  ];
  function render(filter=''){
    grid.innerHTML=apps.filter(a=>a.name.toLowerCase().includes(filter.toLowerCase())).map(a=>`
      <div class="app-tile" data-id="${a.id}">
        <div class="app-tile-icon">${ICONS[a.icon]}</div>
        <div class="app-tile-name">${esc(a.name)}</div>
      </div>`).join('');
    grid.querySelectorAll('.app-tile').forEach(t=>t.onclick=()=>{
      const app=APPS[t.dataset.id];if(app)app.open();
      menu.classList.remove('open');
    });
  }
  render();
  $('#start-search').oninput=e=>render(e.target.value);
  $('#start-btn').onclick=e=>{e.stopPropagation();menu.classList.toggle('open');if(menu.classList.contains('open'))$('#start-search').focus()};
  document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!$('#start-btn').contains(e.target))menu.classList.remove('open')});
}

/* ============ CLOCK ============ */
function updateClock(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  $('#tb-clock .time').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  $('#tb-clock .date').textContent=(d.getMonth()+1)+'/'+d.getDate();
}

/* ============ WALLPAPER INIT ============ */
function initWallpaper(){
  const wl=$('#wallpaper-layer');
  const css=localStorage.getItem('sageos-wp');
  const img=localStorage.getItem('sageos-wp-img');
  if(img){wl.style.backgroundImage=`url(${img})`;wl.style.backgroundSize='cover'}
  else if(css){wl.style.background=css}
}

/* ============ BOOT ============ */
(async function boot(){
  try{
    await fs.init();
  }catch(e){
    toast('文件系统初始化失败: '+e.message,'err');
    return;
  }
  // Ensure default dirs
  for(const p of ['/Desktop','/Documents','/Pictures','/Music','/Videos','/mnt'])await fs.mkdirp(p);
  initWallpaper();
  initStartMenu();
  updateClock();setInterval(updateClock,30000);
  await Desktop.init();

  // Global keyboard shortcuts
  document.addEventListener('keydown',e=>{
    if(e.key==='Delete'&&Desktop.selected().size){
      const entries=[...Desktop.selected()].map(p=>({path:p,name:fs.baseName(p)}));
      (async()=>{
        const r=await dialog({title:'删除',message:`删除 ${entries.length} 个项目？`,buttons:['删除','取消']});
        if(r.index===0){for(const en of entries)try{await fs.rm(en.path)}catch{}Desktop.render()}
      })();
    }
  });

  // Prompt for remounts
  try{
    const saved=JSON.parse(localStorage.getItem('sageos-mounts')||'[]');
    if(saved.length){
      toast(`有 ${saved.length} 个本地挂载需要重新授权（点击桌面右键 → 挂载本地文件夹）`);
    }
  }catch{}

  // Prevent browser default drop
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>e.preventDefault());
})();
</script>
