<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-icon="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0d13">
<title>墨岚 OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#0a0d13;--panel:rgba(17,21,29,.88);--panel-solid:#11151d;--panel2:#181d28;--panel3:#202733;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--hover:rgba(255,255,255,.07);--hover2:rgba(255,255,255,.12);--inset:rgba(0,0,0,.22);
  --text:#e7e9ef;--muted:#8b94a7;--dim:#5d6678;
  --accent:#ffb454;--accent-ink:#1a1204;--accent2:#5ccfe6;--danger:#ff6b6b;--ok:#8fd694;
  --sel:rgba(255,180,84,.16);--sel-line:rgba(255,180,84,.55);
  --shadow:0 24px 60px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --r:12px;--r-sm:8px;--taskbar-h:52px;
  --font:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;
  --display:'Syne','IBM Plex Sans','Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono','Noto Sans SC',ui-monospace,Menlo,monospace;
  --cell-w:92px;--cell-h:106px;--tile:52px;--tile-ic:30px;
}
html[data-theme=light]{
  --bg:#efe9dd;--panel:rgba(252,249,243,.9);--panel-solid:#fbf8f1;--panel2:#f1ece2;--panel3:#e7e1d4;
  --line:rgba(30,25,15,.1);--line2:rgba(30,25,15,.2);--hover:rgba(30,25,15,.06);--hover2:rgba(30,25,15,.12);--inset:rgba(30,25,15,.05);
  --text:#1e2029;--muted:#6b6f7c;--dim:#9a9ea9;--shadow:0 24px 60px rgba(60,40,10,.22),0 2px 6px rgba(0,0,0,.1);
}
html[data-icon=sm]{--cell-w:78px;--cell-h:92px;--tile:42px;--tile-ic:24px}
html[data-icon=lg]{--cell-w:112px;--cell-h:126px;--tile:66px;--tile-ic:38px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(128,136,150,.35);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.spin{animation:spin 1s linear infinite}
body.reduce-motion *{animation:none!important;transition:none!important}
body.dragging iframe,.win.moving iframe,.win.moving .CodeMirror{pointer-events:none}
.k-folder{color:var(--accent)}.k-image{color:#7fd6a0}.k-audio{color:#c98bf0}.k-video{color:#ff8a80}.k-text{color:#9fb3c8}.k-code{color:#5ccfe6}.k-html{color:#ff9f43}.k-table{color:#8fd694}.k-pdf{color:#ff6b6b}.k-archive{color:#e0b64a}.k-font{color:#d7a3ff}.k-disk{color:#9aa5b5}.k-unknown{color:var(--muted)}.k-mount{color:var(--accent2)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes winin{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
@keyframes winout{to{opacity:0;transform:scale(.96) translateY(8px)}}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateX(30px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes iconin{from{opacity:0;transform:var(--tf) scale(.6)}to{opacity:1;transform:var(--tf) scale(1)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;inset:0 0 var(--taskbar-h) 0;overflow:hidden;user-select:none;-webkit-user-select:none}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
#wallpaper::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 115%,rgba(0,0,0,.35),transparent 60%);pointer-events:none}
#icons{position:absolute;inset:0;touch-action:none;padding:8px}
#windows{position:absolute;inset:0;pointer-events:none}
.dicon{position:absolute;left:8px;top:8px;width:var(--cell-w);height:var(--cell-h);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:7px;border-radius:10px;cursor:default;border:1px solid transparent;transform:var(--tf);transition:transform .38s cubic-bezier(.2,.8,.2,1),background .15s,border-color .15s;will-change:transform;animation:iconin .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:var(--sel);border-color:var(--sel-line)}
.dicon.dragging{transition:none;opacity:.55}
.dicon.drop-hover{background:var(--sel);border-color:var(--accent);border-style:dashed}
.dicon .tile{width:var(--tile);height:var(--tile);border-radius:26%;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 20px rgba(0,0,0,.35);overflow:hidden;transition:transform .2s}
.dicon:hover .tile{transform:translateY(-2px)}
.dicon .tile .ic{width:var(--tile-ic);height:var(--tile-ic);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.dicon .tile img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.dicon .tile.app{background:linear-gradient(145deg,rgba(255,180,84,.22),rgba(92,207,230,.08));border-color:rgba(255,180,84,.3)}
.dicon .lbl{font-size:12px;line-height:1.25;text-align:center;max-width:100%;padding:0 4px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
#desktop.light-wp .dicon .lbl{color:#1c1a14;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.rb{position:absolute;border:1px solid var(--sel-line);background:var(--sel);pointer-events:none;z-index:50;border-radius:3px;display:none}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.85;transform:translate(-50%,-50%) scale(1.05);filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.drag-ghost .badge{position:absolute;right:-6px;top:-6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}

/* ---------- 窗口 ---------- */
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);min-width:300px;min-height:180px;overflow:hidden;animation:winin .28s cubic-bezier(.2,.8,.2,1)}
.win.focus{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.min{display:none}
.win.closing{animation:winout .18s forwards}
.win.moving{transition:none;user-select:none}
.win.fs{position:fixed!important;inset:0!important;width:auto!important;height:auto!important;z-index:5000!important;border-radius:0;border:0}
.win.fs .wtitle,.win.fs .rs{display:none}
.win.fs .fs-exit{display:grid}
.fs-exit{display:none;position:fixed;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;place-items:center;z-index:6000;opacity:.25;transition:opacity .2s;backdrop-filter:blur(6px)}
.fs-exit:hover{opacity:1;background:var(--danger)}
.fs-exit .ic{width:18px;height:18px}
.wtitle{height:40px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);cursor:default;flex:none;touch-action:none;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.wtitle>.ic{width:16px;height:16px;color:var(--accent)}
.wtitle .t{flex:1;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle .t small{font-family:var(--font);font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.wbtn{width:36px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.wbtn .ic{width:15px;height:15px}
.wbtn:hover{background:var(--hover2);color:var(--text)}
.wbtn.x:hover{background:var(--danger);color:#fff}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rs{position:absolute;z-index:4}
.rs.n{top:0;left:12px;right:12px;height:5px;cursor:ns-resize}.rs.s{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rs.e{right:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}.rs.w{left:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rs.ne{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}.rs.nw{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rs.se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}.rs.sw{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}
.win.max .rs{display:none}
.err-view{padding:30px;color:var(--danger);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px;background:var(--panel-solid);z-index:20}
.loading .ldr{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:spin .9s linear infinite}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border-top:1px solid var(--line);z-index:1000}
.tb-start{width:42px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--accent);transition:background .15s,transform .15s}
.tb-start .ic{width:24px;height:24px;stroke-width:1.6}
.tb-start:hover,.tb-start.on{background:var(--hover2)}.tb-start:active{transform:scale(.94)}
.tb-pins{display:flex;gap:2px;padding-right:6px;border-right:1px solid var(--line);margin-right:4px}
.tb-pin{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.tb-pin .ic{width:20px;height:20px}
.tb-pin:hover{background:var(--hover);color:var(--text)}
.tb-apps{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;height:100%;align-items:center}
.tb-apps::-webkit-scrollbar{display:none}
.tb-item{height:38px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:8px;position:relative;max-width:190px;font-size:12.5px;color:var(--muted);flex:none;transition:background .15s;animation:pop .2s}
.tb-item .ic{width:17px;height:17px;color:var(--accent)}
.tb-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-item:hover{background:var(--hover)}
.tb-item.active{background:var(--hover2);color:var(--text)}
.tb-item::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:var(--accent);opacity:.45;transition:all .2s}
.tb-item.active::after{opacity:1;width:26px}
.tb-item.min::after{opacity:.3;width:8px}
.tb-tray{display:flex;align-items:center;gap:4px;padding-left:8px;border-left:1px solid var(--line)}
.tb-tray button{height:40px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.tb-tray button:hover{background:var(--hover);color:var(--text)}
.tb-tray .ic{width:16px;height:16px}
.tb-clock{font-family:var(--mono);text-align:right;line-height:1.25;flex-direction:column;align-items:flex-end!important;gap:0!important}
.tb-clock b{font-weight:500;color:var(--text);font-size:13px}
.tb-clock small{font-size:10px;color:var(--dim)}

/* ---------- 开始菜单 ---------- */
#startmenu{position:fixed;left:10px;bottom:calc(var(--taskbar-h) + 10px);width:560px;max-width:calc(100vw - 20px);max-height:calc(100vh - var(--taskbar-h) - 20px);background:var(--panel);backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);z-index:1100;display:none;flex-direction:column;overflow:hidden;transform-origin:bottom left}
#startmenu.open{display:flex;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.sm-head{display:flex;align-items:center;gap:14px;padding:16px 18px 8px}
.sm-logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em}
.sm-logo .ic{width:26px;height:26px;color:var(--accent);stroke-width:1.6}
.sm-search{flex:1;position:relative}
.sm-search .ic{position:absolute;left:11px;top:10px;width:15px;height:15px;color:var(--dim)}
.sm-search .inp{padding-left:32px;height:36px;border-radius:18px}
.sm-sec{font-family:var(--display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:10px 22px 2px}
.sm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 14px 10px;overflow-y:auto}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px 12px;border-radius:14px;font-size:12px;color:var(--text);transition:background .15s,transform .15s}
.sm-app:hover{background:var(--hover);transform:translateY(-2px)}
.sm-app .tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,180,84,.22),rgba(92,207,230,.08));border:1px solid rgba(255,180,84,.25)}
.sm-app .tile .ic{width:24px;height:24px;color:var(--accent)}
.sm-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);background:var(--inset)}
.sm-user{display:flex;align-items:center;gap:10px;font-size:13px}
.sm-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--accent),#ff7e5f);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:800}
.sm-user small{display:block;color:var(--dim);font-size:11px;font-family:var(--mono)}
.sm-acts{display:flex;gap:2px}
.sm-acts button{width:38px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.sm-acts button:hover{background:var(--hover);color:var(--text)}
.sm-acts .ic{width:17px;height:17px}

/* ---------- 右键菜单 ---------- */
#ctxmenu{position:fixed;z-index:8000;min-width:210px;max-width:300px;max-height:calc(100vh - 16px);overflow:auto;background:var(--panel);backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;animation:pop .15s cubic-bezier(.2,.8,.2,1)}
#ctxmenu.open{display:block}
.cm-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;cursor:default;position:relative;white-space:nowrap}
.cm-item:hover{background:var(--hover2)}
.cm-item.dis{opacity:.4;pointer-events:none}
.cm-item.dng{color:var(--danger)}
.cm-item .ic{width:16px;height:16px;color:var(--muted)}
.cm-item.dng .ic{color:var(--danger)}
.cm-item .kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);padding-left:16px}
.cm-item .arr{margin-left:auto;width:14px;height:14px;padding-left:0}
.cm-sep{height:1px;background:var(--line);margin:5px 8px}
.cm-title{font-size:11px;color:var(--dim);padding:4px 10px 6px;font-family:var(--display);letter-spacing:.08em}
.cm-back{color:var(--accent)}

/* ---------- 通知 / 对话框 ---------- */
#toasts{position:fixed;right:16px;top:16px;z-index:9000;display:flex;flex-direction:column;gap:8px;width:350px;max-width:calc(100vw - 32px);pointer-events:none}
.toast{pointer-events:auto;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;animation:slidein .3s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:flex-start}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--ok)}
.toast>.ic{width:18px;height:18px;flex:none;margin-top:1px;color:var(--accent)}
.toast.err>.ic{color:var(--danger)}.toast.ok>.ic{color:var(--ok)}
.toast .tt{font-weight:600;margin-bottom:2px}
.toast .tx{color:var(--muted);line-height:1.5;word-break:break-word}
.toast .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.toast.out{animation:slideout .25s forwards}
.toast .prog{height:3px;background:var(--hover2);border-radius:2px;margin-top:9px;overflow:hidden}
.toast .prog i{display:block;height:100%;background:var(--accent);transition:width .2s;width:0}
.toast .bd{flex:1;min-width:0}
.modal{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.45);display:grid;place-items:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .15s}
.mbox{width:460px;max-width:calc(100vw - 32px);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line2);border-radius:16px;padding:22px;box-shadow:var(--shadow);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.mbox h3{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mbox h3 .ic{width:18px;height:18px;color:var(--accent)}
.mbox p{color:var(--muted);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mbox .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.mbox .inp{margin-top:12px}
.picker{max-height:min(320px,50vh);overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.picker .pi{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;cursor:default}
.picker .pi:hover{background:var(--hover)}.picker .pi.on{background:var(--sel)}
.picker .pi .ic{width:16px;height:16px}
.picker .pi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.openwith{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.ow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:13px;text-align:left;transition:background .15s}
.ow:hover{background:var(--hover);border-color:var(--line2)}
.ow .ic{width:20px;height:20px;color:var(--accent)}
.props{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;margin-top:12px}
.props b{color:var(--muted);font-weight:500;white-space:nowrap}
.props span{word-break:break-all;font-family:var(--mono);font-size:12px}

/* ---------- 通用控件 ---------- */
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--hover);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--hover2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:rgba(255,107,107,.4)}
.btn.dng:hover{background:rgba(255,107,107,.12)}
.btn .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{height:26px;padding:0 10px;font-size:11.5px}
.inp{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--inset);color:var(--text);font-size:13px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
.sel-inp{height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:12.5px;outline:none}
.sel-inp option{background:var(--panel-solid);color:var(--text)}
.tb{display:flex;align-items:center;gap:3px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;background:var(--inset)}
.tb .sp{width:1px;height:20px;background:var(--line2);margin:0 5px}
.tb .grow{flex:1}
.tb .lb{font-size:12px;color:var(--muted);padding:0 4px;white-space:nowrap}
.tbtn{height:30px;min-width:32px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);flex:none;font-size:12px;white-space:nowrap;transition:background .15s,color .15s}
.tbtn:hover{background:var(--hover2);color:var(--text)}
.tbtn.on{background:var(--sel);color:var(--accent)}
.tbtn:disabled{opacity:.35;pointer-events:none}
.tbtn .ic{width:17px;height:17px}
.status{height:24px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);flex:none;font-family:var(--mono);overflow:hidden;white-space:nowrap}
.status .grow{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px 20px;color:var(--dim);font-size:13px;text-align:center}
.empty .ic{width:44px;height:44px;opacity:.5}
.switch{width:40px;height:22px;border-radius:11px;background:var(--hover2);position:relative;transition:background .2s;flex:none;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12px;color:var(--muted);transition:background .15s}
.seg button.on{background:var(--sel);color:var(--accent)}
input[type=range]{accent-color:var(--accent)}

/* ---------- 文件管理器 ---------- */
.ex-tb{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;background:var(--inset)}
.crumb{flex:1;display:flex;align-items:center;gap:1px;height:30px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--inset);overflow-x:auto;white-space:nowrap;min-width:60px;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb button{padding:3px 7px;border-radius:5px;font-size:12.5px;color:var(--text);display:inline-flex;align-items:center;gap:5px}
.crumb button .ic{width:14px;height:14px;color:var(--accent)}
.crumb button:hover{background:var(--hover2)}
.crumb button:last-child{color:var(--accent)}
.crumb .sep{color:var(--dim);width:12px;height:12px}
.ex-search{position:relative;flex:none;width:210px}
.ex-search .inp{padding-left:30px;height:30px;font-size:12.5px;border-radius:8px}
.ex-search>.ic{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--dim)}
.ex-main{flex:1;display:flex;min-height:0;position:relative}
.ex-side{width:196px;flex:none;border-right:1px solid var(--line);padding:8px;overflow-y:auto;font-size:12.5px;background:var(--inset)}
.ex-side h6{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:10px 8px 4px;font-weight:700}
.side-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;color:var(--text);cursor:default;white-space:nowrap;overflow:hidden;width:100%;text-align:left}
.side-item span{flex:1;overflow:hidden;text-overflow:ellipsis}
.side-item:hover{background:var(--hover)}
.side-item.active{background:var(--sel);color:var(--accent)}
.side-item .ic{width:16px;height:16px;color:var(--muted)}
.side-item.active .ic{color:var(--accent)}
.side-item .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:0}
.side-item:hover .x{opacity:1}
.side-item.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px}
.ex-list{flex:1;display:flex;flex-direction:column;min-width:0;--c-name:minmax(160px,1fr);--c-mtime:150px;--c-type:120px;--c-size:90px}
.ex-head{display:grid;grid-template-columns:var(--c-name) var(--c-mtime) var(--c-type) var(--c-size);padding:0 8px;border-bottom:1px solid var(--line);flex:none;font-size:11.5px;color:var(--muted);user-select:none}
.hc{position:relative;padding:7px 8px;display:flex;align-items:center;gap:4px;cursor:default;white-space:nowrap;overflow:hidden}
.hc:hover{color:var(--text)}.hc.on{color:var(--accent)}
.hc .ic{width:12px;height:12px}
.col-rs{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:col-resize;touch-action:none}
.col-rs::after{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.col-rs:hover::after,.col-rs.on::after{background:var(--accent);width:2px}
.ex-rows{flex:1;overflow:auto;position:relative;padding:4px 8px 40px;outline:none}
.ex-rows.drop-hover{box-shadow:inset 0 0 0 2px var(--accent)}
.row{display:grid;grid-template-columns:var(--c-name) var(--c-mtime) var(--c-type) var(--c-size);align-items:center;height:34px;border-radius:7px;font-size:13px;cursor:default;border:1px solid transparent;touch-action:pan-y;position:relative}
.row>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .nm{display:flex;align-items:center;gap:9px}
.row .nm .ic{width:18px;height:18px}
.row .nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--dim);font-size:11px;margin-left:6px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);border-color:var(--sel-line)}
.row.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px}
.row .dim{color:var(--muted);font-size:12px}
.row.cut{opacity:.5}
.ex-status{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden}
.ex-status .grow{flex:1}
.ex-status .qa{display:flex;gap:4px}
.ex-status .qa button{color:var(--accent);padding:2px 6px;border-radius:5px;font-size:11.5px}
.ex-status .qa button:hover{background:var(--hover)}
.side-scrim{display:none}

/* ---------- 记事本 / 表格 ---------- */
.np-ta{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:14px 18px;font-family:var(--mono);font-size:13.5px;line-height:1.65;tab-size:4;min-height:0}
.np-ta.nowrap{white-space:pre;overflow-wrap:normal;overflow-x:auto}
.tbl-wrap{flex:1;overflow:auto;min-height:0}
table.dgrid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%;display:table}
.dgrid th,.dgrid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap;text-align:left;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.dgrid th{position:sticky;top:0;background:var(--panel2);font-weight:600;color:var(--accent);z-index:2}
.dgrid td[contenteditable]:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sel);white-space:normal}
.dgrid td.idx,.dgrid th.idx{color:var(--dim);background:var(--panel2);text-align:right;font-family:var(--mono);font-size:11px;position:sticky;left:0;z-index:1}
.dgrid th.idx{z-index:3}
.sm-grid{flex:1;min-height:0}
textarea,input,[contenteditable],.CodeMirror,.font-prev,.mbox p,.props span,.kv span,.calc-hist,.err-view{user-select:text;-webkit-user-select:text}

/* ---------- HTML 编辑器 ---------- */
.ed-main{flex:1;display:flex;min-height:0;position:relative}
.ed-left{width:55%;min-width:200px;display:flex;flex-direction:column;min-height:0;position:relative}
.ed-left .CodeMirror{flex:1;height:auto;font-family:var(--mono);font-size:var(--ed-font,13px);line-height:1.55;min-height:0}
.ed-left .CodeMirror-gutters{border-right:1px solid rgba(255,255,255,.06)}
.ed-split{width:6px;cursor:col-resize;background:var(--line);flex:none;touch-action:none;position:relative;transition:background .15s}
.ed-split::after{content:'';position:absolute;left:1.5px;top:50%;width:3px;height:36px;margin-top:-18px;border-radius:2px;background:var(--dim)}
.ed-split:hover,.ed-split.on{background:var(--accent)}
.ed-right{flex:1;min-width:120px;background:#fff;position:relative;display:flex;flex-direction:column}
.ed-right iframe{width:100%;height:100%;border:0;display:block;background:#fff;flex:1}
.ed-right.off{display:none}
.ed-find{display:none;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2)}
.ed-find.open{display:flex}
.ed-find .inp{height:28px;width:190px;font-size:12.5px}
.ed-find .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:64px}
.ed-find .cnt.bad{color:var(--danger)}
.tog{height:26px;min-width:28px;padding:0 6px;border-radius:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line2)}
.tog.on{background:var(--sel);color:var(--accent);border-color:var(--sel-line)}
.cm-find-match{background:rgba(92,207,230,.28);outline:1px solid rgba(92,207,230,.5)}
.cm-find-cur{background:rgba(255,180,84,.5)!important;outline:1px solid var(--accent)}
.ed-plain{flex:1;resize:none;border:0;outline:0;background:#151515;color:#e6e8ee;padding:12px;font-family:var(--mono);font-size:13px;line-height:1.55;tab-size:2;min-height:0}
.CodeMirror-foldmarker{color:var(--accent);text-shadow:none;font-family:var(--mono)}
.cm-trailingspace{background:rgba(255,107,107,.25)}

/* ---------- 图片 / 漫画 / 媒体 / 浏览器 ---------- */
.mg{background:#000}
.mg .tb{background:rgba(10,13,19,.92);border-bottom-color:#1c212b;color:#cfd3dc}
.mg .status{background:#000;border-top-color:#1c212b}
.mg-scroll{flex:1;overflow-y:auto;overflow-x:hidden;background:#000;display:flex;flex-direction:column;align-items:center;position:relative;min-height:0;overscroll-behavior:contain}
.mg-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#aab;font-size:13px;pointer-events:none;background:rgba(0,0,0,.75);z-index:2}
.mg-load .ldr{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:var(--accent);animation:spin .9s linear infinite}
.iv-stage{flex:1;overflow:hidden;position:relative;display:grid;place-items:center;cursor:grab;touch-action:none;background:radial-gradient(circle at 50% 40%,#1a1f2b,#07090d);min-height:0}
.iv-stage img{max-width:none;max-height:none;transform-origin:center;user-select:none;-webkit-user-drag:none;transition:transform .12s ease-out;box-shadow:0 20px 60px rgba(0,0,0,.6);position:absolute}
.iv-stage.pan{cursor:grabbing}.iv-stage.pan img{transition:none}
.iv-stage .chk{background-image:linear-gradient(45deg,#2a2f3a 25%,transparent 25%),linear-gradient(-45deg,#2a2f3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2f3a 75%),linear-gradient(-45deg,transparent 75%,#2a2f3a 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.md-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px;gap:18px;background:#05070a}
.md-stage video{max-width:100%;max-height:100%;border-radius:8px;background:#000;outline:none}
.md-stage audio{width:min(560px,100%)}
.md-art{width:170px;height:170px;border-radius:28px;background:linear-gradient(145deg,var(--accent),#ff7e5f);display:grid;place-items:center;color:#1a1204;box-shadow:0 24px 70px rgba(255,180,84,.28);animation:float 4s ease-in-out infinite}
.md-art .ic{width:70px;height:70px;stroke-width:1.4}
.md-title{color:#e7e9ef;font-family:var(--display);font-weight:700;font-size:15px;text-align:center;word-break:break-all;padding:0 20px}
.md-sub{color:#8b94a7;font-size:12px;font-family:var(--mono)}
.br-url{flex:1;height:32px;border-radius:16px;border:1px solid var(--line2);background:var(--inset);padding:0 14px;font-family:var(--mono);font-size:12.5px;outline:none;min-width:60px;color:var(--text)}
.br-url:focus{border-color:var(--accent)}
.br-frame{flex:1;border:0;background:#fff;width:100%;min-height:0}
.pdf-frame{flex:1;border:0;width:100%;background:#333;min-height:0}
.font-prev{flex:1;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.font-prev .s{line-height:1.3;word-break:break-word}
.font-prev small{display:block;color:var(--dim);font-family:var(--mono);font-size:10px;margin-bottom:4px}

/* ---------- 计算器 / 画板 ---------- */
.calc{padding:14px;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.calc-disp{flex:none;text-align:right;padding:14px 16px;border-radius:14px;background:var(--inset);border:1px solid var(--line);min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.calc-expr{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.calc-val{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:0}
.calc-keys button{border-radius:12px;font-size:19px;font-family:var(--display);font-weight:500;background:var(--hover);border:1px solid var(--line);transition:transform .08s,background .15s;min-height:0}
.calc-keys button:hover{background:var(--hover2)}
.calc-keys button:active{transform:scale(.93)}
.calc-keys .op{color:var(--accent2)}
.calc-keys .eq{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.calc-keys .fn{color:var(--muted);font-size:15px}
.calc-hist{max-height:72px;overflow:auto;font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;text-align:right;line-height:1.7}
.pt-stage{flex:1;position:relative;overflow:auto;background:#20242c;min-height:0;display:grid;place-items:center}
.pt-stage canvas{touch-action:none;cursor:crosshair;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:none}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.pt input[type=color]{width:30px;height:28px;border:0;background:none;padding:0;cursor:pointer;border-radius:6px}
.pt input[type=range]{width:90px}

/* ---------- 设置 ---------- */
.st{flex-direction:row}
.st-nav{width:186px;flex:none;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--inset);overflow-y:auto}
.st-nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13px;color:var(--muted);text-align:left;transition:background .15s}
.st-nav button:hover{background:var(--hover);color:var(--text)}
.st-nav button.on{background:var(--sel);color:var(--accent)}
.st-nav .ic{width:17px;height:17px}
.st-body{flex:1;overflow:auto;padding:22px 26px;min-width:0}
.st-body h2{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.st-body .desc{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.card{background:var(--hover);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:15px;height:15px;color:var(--accent)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.opt:first-of-type{border-top:0}
.opt .d{color:var(--muted);font-size:11.5px;margin-top:2px}
.opt>div:first-child{flex:1;min-width:140px}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wp{aspect-ratio:16/10;border-radius:10px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;display:grid;place-items:center}
.wp:hover{transform:translateY(-2px)}
.wp.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--sel)}
.wp span{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
.wp .ic{width:26px;height:26px;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.swatch:hover{transform:scale(1.1)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.bar{height:16px;border-radius:8px;background:var(--hover2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1);min-width:0}
.legend{display:grid;grid-template-columns:1fr auto auto;gap:7px 14px;font-size:12px;margin-top:12px;align-items:center}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.legend .n{font-family:var(--mono);color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font-family:var(--mono);font-size:12px}
.big{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.big small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--font);margin-left:6px}
.cap{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--line2);color:var(--muted)}
.cap.ok{color:var(--ok);border-color:rgba(143,214,148,.4)}.cap.no{color:var(--danger);border-color:rgba(255,107,107,.4)}
.cap .ic{width:12px;height:12px}

/* ---------- 虚拟机 ---------- */
.vm-setup{flex:1;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
.vm-screen{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#000;position:relative;min-height:0}
.vm-sc{display:inline-block;position:relative}
.vm-sc>div{white-space:pre;font:14px/14px 'JetBrains Mono',monospace;color:#ccc}
.vm-sc>canvas{display:none;image-rendering:pixelated}
.vm-hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:#8b94a7;font-family:var(--mono);background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px;pointer-events:none}
.vm .tb{background:#0b0e13;border-bottom-color:#1c212b}
.file-pick{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px;font-size:12.5px;color:var(--muted);min-height:44px}
.file-pick b{color:var(--text);font-weight:500;font-family:var(--mono);font-size:12px;word-break:break-all}

/* ---------- 移动端 ---------- */
@media (max-width:760px){
  :root{--taskbar-h:64px}
  .win{inset:0 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;border:0;min-width:0;min-height:0}
  .win .rs,.wbtn.mx{display:none}
  .wtitle{height:46px}
  .wbtn{width:42px;height:38px}
  #startmenu{left:0;right:0;bottom:var(--taskbar-h);width:auto;max-width:none;border-radius:22px 22px 0 0;transform-origin:bottom center}
  .sm-grid{grid-template-columns:repeat(4,1fr)}
  .tb-pins{display:none}
  .tb-item{padding:0 10px}
  .tb-item span{display:none}
  .tb-clock small{display:none}
  .tb-start{width:46px;height:46px}
  .ex-side{position:absolute;left:0;top:0;bottom:0;width:230px;z-index:6;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);background:var(--panel-solid);box-shadow:var(--shadow)}
  .side-open .ex-side{transform:none}
  .side-scrim{display:none;position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.4)}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v; else if(k==='style') el.style.cssText=v; else if(k==='html') el.innerHTML=v; else if(k==='text') el.textContent=v;
    else if(k==='dataset') Object.assign(el.dataset,v); else if(k[0]==='o'&&k[1]==='n') el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k, v===true?'':v); }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node? c : String(c)); }
  return el;
}

const fsErr=(code,msg)=>Object.assign(new Error(msg),{code});
async function toBlob(data,mime){
  if(data instanceof Blob) return data;
  if(typeof data==='string') return new Blob([data],{type:mime||'text/plain;charset=utf-8'});
  if(data instanceof ArrayBuffer||ArrayBuffer.isView(data)) return new Blob([data],{type:mime||'application/octet-stream'});
  return new Blob([String(data)],{type:mime||'text/plain'});
}
/* 目录 mtime 记录（localStorage） */
const dirMeta={
  m:store.get('molan.dirmeta',{}),
  get(p){ return this.m[p]||0; },
  touch(p){ if(!p) return; this.m[p]=Date.now(); this.save(); },
  del(p){ for(const k of Object.keys(this.m)) if(k===p||k.startsWith(p+'/')) delete this.m[k]; this.save(); },
  move(a,b){ for(const k of Object.keys(this.m)){ if(k===a||k.startsWith(a+'/')){ this.m[b+k.slice(a.length)]=this.m[k]; delete this.m[k]; } } this.touch(b); },
  save:debounce(function(){ const ks=Object.keys(this.m); if(ks.length>1500){ ks.sort((x,y)=>this.m[x]-this.m[y]).slice(0,ks.length-1500).forEach(k=>delete this.m[k]); } store.set('molan.dirmeta',this.m); },300)
};

/* --- 后端 1：FileSystemDirectoryHandle（OPFS 与 File System Access 共用同一实现） --- */
class HandleBackend{
  constructor(root,label){ this.root=root; this.label=label||'OPFS'; this.kind='handle'; }
  segs(p){ return String(p||'').split('/').filter(Boolean); }
  async dir(p,create=false){ let d=this.root; for(const s of this.segs(p)) d=await d.getDirectoryHandle(s,{create}); return d; }
  async parentOf(p){ const s=this.segs(p); const name=s.pop(); return {dir:await this.dir(s.join('/')),name}; }
  async stat(p){
    const s=this.segs(p); if(!s.length) return {name:this.label,isDirectory:true,isFile:false,size:0,mtime:0};
    const {dir,name}=await this.parentOf(p);
    try{ const fh=await dir.getFileHandle(name); const f=await fh.getFile(); return {name,isDirectory:false,isFile:true,size:f.size,mtime:f.lastModified}; }
    catch(e){ if(e.name!=='TypeMismatchError'&&e.name!=='NotFoundError') throw e; }
    try{ await dir.getDirectoryHandle(name); }catch(e){ if(e.name==='NotFoundError') throw fsErr('ENOENT','找不到 '+p); throw e; }
    return {name,isDirectory:true,isFile:false,size:0,mtime:0};
  }
  async readdir(p){
    let d; try{ d=await this.dir(p); }catch(e){ if(e.name==='NotFoundError') throw fsErr('ENOENT','找不到目录 '+p); if(e.name==='TypeMismatchError') throw fsErr('ENOTDIR','不是目录 '+p); throw e; }
    const out=[];
    for await (const [name,hd] of d.entries()){
      if(hd.kind==='file'){ let f; try{ f=await hd.getFile(); }catch{ out.push({name,isDirectory:false,isFile:true,size:0,mtime:0}); continue; } out.push({name,isDirectory:false,isFile:true,size:f.size,mtime:f.lastModified}); }
      else out.push({name,isDirectory:true,isFile:false,size:0,mtime:0});
    }
    return out;
  }
  async mkdir(p){ await this.dir(p,true); }
  async readFile(p){ const {dir,name}=await this.parentOf(p); try{ const fh=await dir.getFileHandle(name); return await fh.getFile(); }catch(e){ if(e.name==='NotFoundError') throw fsErr('ENOENT','找不到文件 '+p); throw e; } }
  async writeFile(p,data){
    const s=this.segs(p); const name=s.pop(); const dir=await this.dir(s.join('/'),true);
    const fh=await dir.getFileHandle(name,{create:true}); const blob=await toBlob(data);
    if(!fh.createWritable) throw fsErr('ENOSYS','当前浏览器不支持 createWritable');
    const w=await fh.createWritable(); try{ await w.write(blob); }finally{ await w.close(); }
  }
  async unlink(p){ const {dir,name}=await this.parentOf(p); await dir.removeEntry(name); }
  async rmdir(p,recursive){ const {dir,name}=await this.parentOf(p); await dir.removeEntry(name,{recursive:!!recursive}); }
  async rename(a,b){
    const A=this.segs(a),B=this.segs(b); const an=A.pop(),bn=B.pop();
    if(A.join('/')!==B.join('/')) return false;
    const dir=await this.dir(A.join('/')); let hd=null; try{ hd=await dir.getFileHandle(an); }catch{ hd=null; }
    if(hd&&typeof hd.move==='function'){ try{ await hd.move(bn); return true; }catch{ return false; } }
    return false;
  }
}
/* --- 后端 2：IndexedDB --- */
class IDBBackend{
  constructor(dbName='molan-fs'){ this.dbName=dbName; this.label='IndexedDB'; this.kind='idb'; this.db=null; }
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ const r=indexedDB.open(this.dbName,1);
    r.onupgradeneeded=()=>{ const st=r.result.createObjectStore('files',{keyPath:'path'}); st.createIndex('parent','parent'); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); }
  norm(p){ return '/'+String(p||'').split('/').filter(Boolean).join('/'); }
  req(mode,fn){ return this.open().then(db=>new Promise((res,rej)=>{ const r=fn(db.transaction('files',mode).objectStore('files')); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
  get(p){ return this.req('readonly',st=>st.get(this.norm(p))); }
  put(rec){ return this.req('readwrite',st=>st.put(rec)); }
  async stat(p){ p=this.norm(p); if(p==='/') return {name:'',isDirectory:true,isFile:false,size:0,mtime:0}; const r=await this.get(p); if(!r) throw fsErr('ENOENT','找不到 '+p); return {name:r.name,isDirectory:!!r.isDirectory,isFile:!r.isDirectory,size:r.size||0,mtime:r.mtime||0}; }
  async readdir(p){ p=this.norm(p); if(p!=='/'){ const d=await this.get(p); if(!d) throw fsErr('ENOENT','找不到目录 '+p); if(!d.isDirectory) throw fsErr('ENOTDIR','不是目录'); }
    const rows=await this.req('readonly',st=>st.index('parent').getAll(p)); return rows.map(r=>({name:r.name,isDirectory:!!r.isDirectory,isFile:!r.isDirectory,size:r.size||0,mtime:r.mtime||0})); }
  async mkdir(p){ const segs=this.norm(p).split('/').filter(Boolean); let cur=''; for(const s of segs){ const parent=cur||'/'; cur+='/'+s; const ex=await this.get(cur); if(ex){ if(!ex.isDirectory) throw fsErr('EEXIST','已存在同名文件'); continue; } await this.put({path:cur,parent,name:s,isDirectory:true,mtime:Date.now()}); } }
  async readFile(p){ const r=await this.get(p); if(!r||r.isDirectory) throw fsErr('ENOENT','找不到文件 '+p); return new File([r.data],r.name,{type:r.type||'',lastModified:r.mtime||Date.now()}); }
  async writeFile(p,data){ p=this.norm(p); const segs=p.split('/').filter(Boolean); const name=segs.pop(); const parent='/'+segs.join('/'); if(parent!=='/') await this.mkdir(parent);
    const blob=await toBlob(data); const buf=await blob.arrayBuffer(); await this.put({path:p,parent,name,isDirectory:false,size:buf.byteLength,mtime:Date.now(),type:blob.type,data:buf}); }
  async unlink(p){ await this.req('readwrite',st=>st.delete(this.norm(p))); }
  async rmdir(p,recursive){ p=this.norm(p); const kids=await this.readdir(p); if(kids.length&&!recursive) throw fsErr('ENOTEMPTY','目录非空'); for(const k of kids){ if(k.isDirectory) await this.rmdir(p+'/'+k.name,true); else await this.unlink(p+'/'+k.name); } await this.unlink(p); }
  async rename(){ return false; }
  async wipe(){ await this.req('readwrite',st=>st.clear()); }
}
/* --- 后端 3：内存（小文本镜像到 localStorage） --- */
class MemBackend{
  constructor(){ this.label='内存'; this.kind='mem'; this.map=new Map(); this.map.set('/',{isDirectory:true,mtime:Date.now()});
    try{ const j=store.get('molan.memfs',null); if(j) for(const [p,r] of Object.entries(j)) this.map.set(p,{isDirectory:!!r.d,mtime:r.m||0,data:r.d?null:new Blob([r.c||''],{type:r.t||'text/plain'})}); }catch{} }
  norm(p){ return '/'+String(p||'').split('/').filter(Boolean).join('/'); }
  persist=debounce(async function(){ const out={}; let total=0; for(const [p,r] of this.map){ if(p==='/') continue; if(r.isDirectory){ out[p]={d:1,m:r.mtime}; continue; } if(!r.data||r.data.size>65536||!(r.data.type||'').startsWith('text')) continue; total+=r.data.size; if(total>2.5e6) break; out[p]={m:r.mtime,t:r.data.type,c:await r.data.text()}; } store.set('molan.memfs',out); },500);
  async stat(p){ p=this.norm(p); const r=this.map.get(p); if(!r) throw fsErr('ENOENT','找不到 '+p); return {name:baseName(p),isDirectory:!!r.isDirectory,isFile:!r.isDirectory,size:r.data?r.data.size:0,mtime:r.mtime||0}; }
  async readdir(p){ p=this.norm(p); const d=this.map.get(p); if(!d) throw fsErr('ENOENT','找不到目录'); if(!d.isDirectory) throw fsErr('ENOTDIR','不是目录'); const out=[]; const pre=p==='/'?'/':p+'/';
    for(const [k,r] of this.map){ if(k===p||!k.startsWith(pre)) continue; const rest=k.slice(pre.length); if(rest.includes('/')) continue; out.push({name:rest,isDirectory:!!r.isDirectory,isFile:!r.isDirectory,size:r.data?r.data.size:0,mtime:r.mtime||0}); } return out; }
  async mkdir(p){ const segs=this.norm(p).split('/').filter(Boolean); let cur=''; for(const s of segs){ cur+='/'+s; const ex=this.map.get(cur); if(ex){ if(!ex.isDirectory) throw fsErr('EEXIST','已存在同名文件'); continue; } this.map.set(cur,{isDirectory:true,mtime:Date.now()}); } this.persist(); }
  async readFile(p){ p=this.norm(p); const r=this.map.get(p); if(!r||r.isDirectory) throw fsErr('ENOENT','找不到文件 '+p); return new File([r.data],baseName(p),{type:r.data.type,lastModified:r.mtime}); }
  async writeFile(p,data){ p=this.norm(p); const parent=dirName(p); if(parent!=='/') await this.mkdir(parent); this.map.set(p,{isDirectory:false,mtime:Date.now(),data:await toBlob(data)}); this.persist(); }
  async unlink(p){ this.map.delete(this.norm(p)); this.persist(); }
  async rmdir(p,recursive){ p=this.norm(p); const kids=await this.readdir(p); if(kids.length&&!recursive) throw fsErr('ENOTEMPTY','目录非空'); for(const k of [...this.map.keys()]) if(k===p||k.startsWith(p+'/')) this.map.delete(k); this.persist(); }
  async rename(a,b){ a=this.norm(a); b=this.norm(b); for(const k of [...this.map.keys()]){ if(k===a||k.startsWith(a+'/')){ this.map.set(b+k.slice(a.length),this.map.get(k)); this.map.delete(k); } } this.persist(); return true; }
}
/* 兼容性包装：后端所有方法都支持任意多余参数 + 末尾回调 */
function callbackCompat(proto,methods){
  for(const k of methods){ const orig=proto[k]; if(typeof orig!=='function') continue;
    proto[k]=function(...args){ let cb=null; if(args.length&&typeof args[args.length-1]==='function') cb=args.pop();
      let pr; try{ pr=Promise.resolve(orig.apply(this,args)); }catch(e){ pr=Promise.reject(e); }
      if(cb){ pr.then(r=>cb(null,r),e=>cb(e)); } return pr; }; }
}
const BACKEND_METHODS=['stat','readdir','mkdir','readFile','writeFile','unlink','rmdir','rename'];
[HandleBackend,IDBBackend,MemBackend].forEach(C=>callbackCompat(C.prototype,BACKEND_METHODS));

/* --- 统一 VFS：挂载表 + 路由 --- */
class VFS{
  constructor(){ this.mounts=[]; this.listeners=new Set(); this.backendName='—'; }
  norm(p){ if(!p) return '/'; const segs=[]; for(const s of String(p).replace(/\\/g,'/').split('/')){ if(!s||s==='.') continue; if(s==='..'){ segs.pop(); continue; } segs.push(s); } return '/'+segs.join('/'); }
  mount(path,backend){ path=this.norm(path); this.mounts=this.mounts.filter(m=>m.path!==path); this.mounts.push({path,backend}); this.mounts.sort((a,b)=>b.path.length-a.path.length); this.emit('mount',path); }
  unmount(path){ path=this.norm(path); if(path==='/') return; this.mounts=this.mounts.filter(m=>m.path!==path); this.emit('unmount',path); this.emit('change',dirName(path)); }
  mountOf(path){ path=this.norm(path); return this.mounts.find(m=>m.path!=='/'&&(path===m.path||path.startsWith(m.path+'/'))); }
  resolve(p){ const path=this.norm(p); for(const m of this.mounts){ if(m.path==='/'||path===m.path||path.startsWith(m.path+'/')) return {m,path,rel:m.path==='/'?path:(path.slice(m.path.length)||'/')}; } throw fsErr('ENOMOUNT','根文件系统未挂载'); }
  decorate(e,path){ e.path=path; e.type=e.isDirectory?'folder':fileKind(e.name); if(e.isDirectory&&!e.mtime) e.mtime=dirMeta.get(path); return e; }

  const plH=()=>$('.b-lock',tb).classList.toggle('on',!!document.pointerLockElement); document.addEventListener('pointerlockchange',plH);
  $('.b-lock',tb).onclick=()=>{ if(!emulator) return; try{ emulator.lock_mouse(); toast('鼠标已锁定，按 Esc 释放'); }catch(e){ toast('鼠标锁定失败：'+e.message,'err'); } };
  $('.b-pause',tb).onclick=e=>{ if(!emulator) return; paused=!paused; if(paused){ emulator.stop(); e.currentTarget.innerHTML=icon('play')+'<span>继续</span>'; $('.st',tb).textContent='已暂停'; } else { emulator.run(); e.currentTarget.innerHTML=icon('pause')+'<span>暂停</span>'; $('.st',tb).textContent='运行中'; } };
  $('.b-reset',tb).onclick=()=>emulator&&emulator.restart(); $('.b-cad',tb).onclick=()=>emulator&&emulator.keyboard_send_scancodes([0x1D,0x38,0x53,0xD3,0xB8,0x9D]);
  $('.b-scale',tb).onclick=e=>{ if(!emulator) return; scale=scale>=3?1:scale+1; emulator.screen_set_scale(scale,scale); e.currentTarget.textContent=scale+'×'; };
  $('.b-fs',tb).onclick=()=>{ if(emulator&&emulator.screen_go_fullscreen) emulator.screen_go_fullscreen(); else win.toggleFullscreen(); };
  $('.b-save',tb).onclick=async()=>{ if(!emulator) return; try{ const st=await emulator.save_state(); const p=joinPath('/文档',await fs.uniqueName('/文档','vm-state.bin')); await fs.writeFile(p,new Blob([st])); toast('运行状态已保存到 '+p,'ok'); }catch(e){ toast('保存失败：'+e.message,'err'); } };
  $('.b-restore',tb).onclick=async()=>{ if(!emulator) return; const p=await pickPath({title:'选择状态文件',dir:'/文档',filter:e=>/\.bin$/i.test(e.name)}); if(!p) return; try{ await emulator.restore_state(await fs.readFile(p)); toast('运行状态已恢复','ok'); }catch(e){ toast('恢复失败：'+e.message,'err'); } };
  $('.b-stop',tb).onclick=()=>{ stopVM(); tb.classList.add('hidden'); screenWrap.classList.add('hidden'); setup.classList.remove('hidden'); $('.st',tb).textContent='已停止'; win.setTitle('虚拟机'); };
  win.beforeClose=async()=>emulator?confirmBox('虚拟机正在运行，关闭窗口将直接断电。确定吗？','关闭虚拟机',{danger:true,okText:'断电关闭'}):true;
  win.onClose=()=>{ stopVM(); document.removeEventListener('pointerdown',focusH,true); document.removeEventListener('pointerlockchange',plH); };
}});

===================================================================== */
const WELCOME_MD=`# 欢迎使用墨岚 OS

一个完全运行在浏览器中的单文件桌面系统。所有数据都保存在浏览器的 **OPFS（Origin Private File System）** 中，刷新页面不会丢失。

## 可以试试

- 双击「示例.html」预览网页，右键选择「编辑源代码」进入 HTML 编辑器（CodeMirror 内核，实时预览 / 格式化 / 查找替换）
- 打开 /图片/示例画册，点击任意一页进入条漫式阅读器（自然排序：1 → 2 → 3 → 10 → 11）
- 把电脑上的文件直接拖到桌面或文件管理器里导入；也可以把文件从这里拖到电脑桌面导出
- 在文件管理器左侧「挂载本地文件夹」，把真实文件夹挂到 /mnt/local/
- 右键 → 新建 / 上传 / 粘贴 / 全屏模式；Ctrl 或框选可多选
- 设置 → 存储：查看每个目录的占用与浏览器配额；设置 → 外观：更换壁纸与主题

## 支持的文件

图片、音频、视频、PDF、文本 / 代码、CSV / TSV 表格、字体、ZIP / TAR / GZ / 7Z / RAR 压缩包，以及 x86 磁盘镜像（虚拟机）。
`;
const SAMPLE_HTML=`<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>墨岚 · 示例页面</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Noto Sans SC", sans-serif; background: radial-gradient(circle at 30% 20%, #1e2535, #0b0e14); color: #e7e9ef; }
    .card { padding: 40px 48px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(255,255,255,.04); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: .04em; color: #ffb454; }
    p { color: #8b94a7; margin: 0 0 22px; }
    button { padding: 10px 22px; border-radius: 10px; border: 0; background: #ffb454; color: #1a1204; font-weight: 700; cursor: pointer; font-size: 14px; }
    #n { font-family: ui-monospace, monospace; font-size: 32px; margin-top: 18px; color: #5ccfe6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，墨岚</h1>
    <p>这是一个保存在 OPFS 里的 HTML 文件，你可以在 HTML 编辑器中修改它。</p>
    <button onclick="count++; document.getElementById('n').textContent = count">点我计数</button>
    <div id="n">0</div>
  </div>
  <script>let count = 0;<\/script>
</body>
</html>
`;
function makePagePng(n){ return new Promise(res=>{ try{ const c=document.createElement('canvas'); c.width=800; c.height=1120; const g=c.getContext('2d'); const hues=[[255,180,84],[92,207,230],[143,214,148],[201,139,240],[255,138,128]]; const [r,gg,b]=hues[n%hues.length];
  const grad=g.createLinearGradient(0,0,800,1120); grad.addColorStop(0,`rgb(${r},${gg},${b})`); grad.addColorStop(1,'#11151d'); g.fillStyle=grad; g.fillRect(0,0,800,1120);
  g.fillStyle='rgba(255,255,255,.08)'; for(let i=0;i<14;i++){ g.beginPath(); g.arc(Math.random()*800,Math.random()*1120,40+Math.random()*170,0,Math.PI*2); g.fill(); }
  g.fillStyle='#fff'; g.textAlign='center'; g.font='700 260px Syne, "IBM Plex Sans", sans-serif'; g.fillText(String(n),400,640); g.font='500 36px "IBM Plex Sans", "Noto Sans SC", sans-serif'; g.fillText(`示例画册 · 第 ${n} 页`,400,760); g.font='24px "JetBrains Mono", monospace'; g.fillStyle='rgba(255,255,255,.7)'; g.fillText('自然排序：1 → 2 → 3 → 10 → 11',400,1040);
  c.toBlob(res,'image/png'); }catch{ res(null); } }); }
async function firstRun(){
  await fs.writeFile('/桌面/欢迎使用.md',WELCOME_MD); await fs.writeFile('/桌面/示例.html',SAMPLE_HTML);
  await fs.writeFile('/文档/数据示例.csv','城市,人口(万),面积(km²),GDP(亿元)\n上海,2487,6341,47219\n北京,2184,16410,43761\n深圳,1779,1997,34606\n广州,1873,7434,30356\n杭州,1252,16850,20059\n成都,2140,14335,22075\n');
  await fs.writeFile('/文档/笔记.txt','这是一个纯文本文件。\n\n墨岚 OS 的记事本支持自动换行、字号调整、Ctrl+S 保存与另存为。\n');
  await fs.ensureDir('/图片/示例画册'); for(const n of [1,2,3,10,11]){ const blob=await makePagePng(n); if(blob) await fs.writeFile(`/图片/示例画册/${n}.png`,blob); }
}
async function initFS(){
  let backend=null,name='';
  try{ if(navigator.storage&&navigator.storage.getDirectory){ const root=await navigator.storage.getDirectory(); const t=await root.getFileHandle('.probe',{create:true}); if(!t.createWritable) throw new Error('createWritable 不可用'); const w=await t.createWritable(); await w.write('ok'); await w.close(); await root.removeEntry('.probe'); backend=new HandleBackend(root,'OPFS'); name='OPFS'; } }catch(e){ console.warn('OPFS 不可用，尝试降级：',e); }
  if(!backend){ try{ const b=new IDBBackend(); await b.open(); backend=b; name='IndexedDB'; }catch(e){ console.warn('IndexedDB 不可用，尝试降级：',e); } }
  if(!backend){ backend=new MemBackend(); name='内存'; }
  fs.mount('/',backend); fs.backendName=name; cookie.set('molan_backend',name);
  for(const d of ['/桌面','/文档','/图片','/音乐','/视频','/下载','/mnt/local','/.system']) await fs.ensureDir(d);
  let first=false; if(!(await fs.exists('/.system/initialized'))){ first=true; try{ await firstRun(); }catch(e){ console.warn(e); } await fs.writeFile('/.system/initialized',String(Date.now())); }
  return first;
}
async function boot(){
  cookie.set('molan_visits',String((+cookie.get('molan_visits')||0)+1));
  document.head.append(h('style',{text:'.dicon.cut{opacity:.55}.sort-i{width:12px;height:12px;color:var(--accent)}'}));
  let first=false; try{ first=await initFS(); }catch(e){ console.error(e); toast('文件系统初始化失败：'+e.message,'err',{sticky:true}); }
  if(fs.backendName!=='OPFS') toast(`当前浏览器不支持 OPFS 写入，已自动降级到 ${fs.backendName} 存储。`,'info',{title:'存储降级',ms:6000});
  await loadCustomWallpaper(); applyWallpaper();
  await desktop.loadLayout(); desktop.init(); taskbar.init(); startMenu.init(); await desktop.refresh();
  $('#sm-backend').textContent=`存储后端 · ${fs.backendName}`;
  window.addEventListener('resize',debounce(()=>{ desktop.relayout(); WM.wins.forEach(w=>w.onResize&&w.onResize()); },150));
  document.addEventListener('contextmenu',e=>{ if(!e.target.closest('input,textarea,[contenteditable],.CodeMirror,iframe,video,audio')) e.preventDefault(); });
  window.addEventListener('dragover',e=>e.preventDefault()); window.addEventListener('drop',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&startMenu.open) startMenu.hide(); });
  restoreMountsPrompt();
  if(first) setTimeout(()=>launch('notepad',{path:'/桌面/欢迎使用.md'}),300);
}
boot();
})();
