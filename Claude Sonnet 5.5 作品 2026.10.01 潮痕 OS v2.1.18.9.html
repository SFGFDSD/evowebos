<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>潮痕 OS · TIDEMARK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Martian+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script>
// 极早期主题恢复（localStorage -> Cookie），避免闪烁
(function(){try{var s=JSON.parse(localStorage.getItem('tm.settings')||'null');var t=s&&s.theme;if(!t){var m=document.cookie.match(/tm_theme=(\w+)/);t=m&&m[1]}document.documentElement.dataset.theme=t||'dark'}catch(e){}})();
</script>
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" async></script>
<!-- V86 虚拟机模拟器 -->
<script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js" async></script>
<!-- 7z-wasm 解压引擎 -->
<script type="module">
try{const m=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');window.SevenZip=m.default}catch(e){window.SevenZip=null;console.warn('7z-wasm 加载失败',e)}
</script>
<style>
:root{--tb:52px;--accent:#f2b544;--accent-ink:#1a1204;--a2:#4fe3c1;--blur:18px;--op:.88;--cw:96px;--ch:108px;
--font-d:'Big Shoulders Display','Noto Sans SC',sans-serif;--font-b:'Noto Sans SC',system-ui,sans-serif;--font-m:'Martian Mono',ui-monospace,Menlo,monospace;--rad:2px 14px 2px 14px}
[data-theme=dark]{--bg:#060a10;--s0:#0a111c;--s1:#0d1521;--s2:#131d2c;--s3:#1c2a3d;--line:rgba(127,214,205,.14);--line2:rgba(127,214,205,.3);--tx:#dde8ec;--mu:#7f93a3;--hl:rgba(79,227,193,.12);--shadow:0 20px 56px rgba(0,0,0,.6);--danger:#ff6f61;color-scheme:dark}
[data-theme=light]{--bg:#e8e3d4;--s0:#f6f3e9;--s1:#f6f3e9;--s2:#ece7d8;--s3:#ddd6c1;--line:rgba(30,50,60,.15);--line2:rgba(30,50,60,.32);--tx:#14212b;--mu:#5a6a79;--hl:rgba(11,143,122,.13);--shadow:0 16px 44px rgba(40,50,40,.3);--danger:#c8392b;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:400 13px/1.45 var(--font-b);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable=true],.selectable{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
svg.ic{display:block;flex:none}.ic .a{stroke:var(--accent)}.ic .f{fill:var(--accent);stroke:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-corner{background:transparent}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .6s}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:overlay}
#desk{position:fixed;left:0;right:0;top:0;bottom:var(--tb);overflow:hidden}
body.tb-top #desk{top:var(--tb);bottom:0}
#desktop{position:absolute;inset:0;touch-action:none}
#wins{position:absolute;inset:0;pointer-events:none}
#cellHint{position:absolute;border:1px dashed var(--accent);background:var(--hl);border-radius:4px 14px 4px 14px;pointer-events:none;opacity:0;transition:all .12s ease-out;z-index:2}
#snapPrev{position:absolute;pointer-events:none;border:1px solid var(--a2);background:color-mix(in srgb,var(--a2) 14%,transparent);border-radius:6px;opacity:0;transition:all .18s cubic-bezier(.2,.8,.2,1);z-index:7000;backdrop-filter:blur(4px)}
#snapPrev.show{opacity:1}
/* 桌面图标 */
.dicon{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;padding:6px 4px;cursor:pointer;transition:left .28s cubic-bezier(.2,.9,.25,1),top .28s cubic-bezier(.2,.9,.25,1),opacity .2s,transform .2s;touch-action:none;animation:iconIn .5s both cubic-bezier(.2,.9,.25,1)}
.dicon.nodelay{animation:none}
@keyframes iconIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.dicon .pl{width:54px;height:54px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--s3) 90%,transparent),color-mix(in srgb,var(--s1) 85%,transparent));border:1px solid var(--line);border-radius:3px 15px 3px 15px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:.18s;position:relative;overflow:hidden}
.dicon .pl::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);opacity:.0;transition:.2s}
.dicon:hover .pl{transform:translateY(-2px);border-color:var(--line2)}
.dicon:hover .pl::after,.dicon.sel .pl::after{opacity:.9}
.dicon .pl img{width:100%;height:100%;object-fit:cover}
.dicon .lb{margin-top:6px;font-size:12px;line-height:1.25;text-align:center;max-width:100%;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#f1f6f8;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7);padding:1px 5px;border-radius:3px}
[data-theme=light] .dicon .lb{color:#10202c;text-shadow:0 0 6px rgba(255,255,255,.9)}
.dicon.sel .lb{background:var(--accent);color:var(--accent-ink);text-shadow:none}
.dicon.sel .pl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 22px rgba(0,0,0,.4)}
.dicon.dt .pl{border-color:var(--a2);box-shadow:0 0 0 2px var(--a2)}
.dicon.dragging{opacity:.35}
.marq{position:absolute;pointer-events:none;border:1px solid var(--a2);background:color-mix(in srgb,var(--a2) 16%,transparent);z-index:5;border-radius:2px}
/* 窗口 */
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:color-mix(in srgb,var(--s1) calc(var(--op)*100%),transparent);backdrop-filter:blur(var(--blur)) saturate(1.2);border:1px solid var(--line2);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.win::before{content:'';position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--line2);border-top:2px solid var(--line2);z-index:5;pointer-events:none;border-top-left-radius:2px;transition:border-color .2s}
.win.focused{border-color:color-mix(in srgb,var(--a2) 50%,var(--line2));box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--a2) 18%,transparent)}
.win.focused::before{border-color:var(--accent)}
.win.max{border-radius:0;border-width:0}
.win.opening{animation:winIn .3s cubic-bezier(.2,.9,.25,1)}
.win.closing{animation:winOut .18s ease-in forwards;pointer-events:none}
.win.minimizing{animation:winMin .22s ease-in forwards;pointer-events:none}
.win.restoring{animation:winIn .24s cubic-bezier(.2,.9,.25,1)}
.win.hid{display:none}
.no-anim .win,.no-anim .dicon{animation:none!important}
@keyframes winIn{from{opacity:0;transform:scale(.95) translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes winOut{to{opacity:0;transform:scale(.96)}}
@keyframes winMin{to{opacity:0;transform:translateY(60px) scale(.8)}}
.wt{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding-left:10px;position:relative;touch-action:none;background:linear-gradient(90deg,color-mix(in srgb,var(--s3) 70%,transparent),transparent 70%);cursor:default}
.wt::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 8px);opacity:.55;-webkit-mask:linear-gradient(90deg,#000,transparent 75%);mask:linear-gradient(90deg,#000,transparent 75%);pointer-events:none}
.wi{color:var(--tx);display:grid}
.wtitle{flex:1;font:700 14px var(--font-d);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);opacity:.88}
.win.focused .wtitle{opacity:1}
.wbtns{display:flex;height:100%}
.wb{width:42px;display:grid;place-items:center;color:var(--mu);transition:.15s}
.wb:hover{background:var(--hl);color:var(--tx)}.wb.cls:hover{background:var(--danger);color:#fff}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:6;touch-action:none}
.rz-n{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}.rz-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rz-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rz-ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}.rz-nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz-se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}.rz-sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}
.win.max .rz{display:none}
#wins.peek-desk .win{opacity:.07;outline:1px solid var(--a2);transition:opacity .2s}
#wins.peeking .win{opacity:.04;transition:opacity .15s;pointer-events:none}
#wins.peeking .win.peek-top{opacity:1;display:flex;z-index:7500!important;outline:2px solid var(--a2)}
/* 任务栏 */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);display:flex;align-items:stretch;background:color-mix(in srgb,var(--s0) 90%,transparent);backdrop-filter:blur(24px) saturate(1.3);border-top:1px solid var(--line2);z-index:9000}
body.tb-top #taskbar{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line2)}
#taskbar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:4px;background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 12px);opacity:.5;pointer-events:none;-webkit-mask:linear-gradient(90deg,#000,transparent);mask:linear-gradient(90deg,#000,transparent)}
#startBtn{width:64px;display:grid;place-items:center;color:var(--accent);position:relative;transition:.2s}
#startBtn:hover,#startBtn.on{background:var(--hl)}
#startBtn svg{transition:transform .5s cubic-bezier(.2,.9,.25,1)}#startBtn.on svg{transform:rotate(90deg) scale(1.1)}
#tasks{flex:1;display:flex;align-items:stretch;gap:2px;padding:0 6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tk{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;min-width:44px;max-width:180px;color:var(--tx);transition:.18s;animation:tkIn .3s both}
@keyframes tkIn{from{opacity:0;transform:translateY(10px)}}
.tk:hover{background:var(--hl)}
.tk::after{content:'';position:absolute;left:30%;right:30%;bottom:0;height:3px;background:var(--mu);border-radius:3px 3px 0 0;transition:.2s}
.tk.act{background:linear-gradient(0deg,var(--hl),transparent)}.tk.act::after{left:10%;right:10%;background:var(--accent)}
.tk.mn{opacity:.6}.tk.mn::after{left:42%;right:42%}
.tkt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkx{display:none;width:18px;height:18px;place-items:center;border-radius:50%;margin-right:-6px}.tkx:hover{background:var(--danger);color:#fff}
.tk:hover .tkx{display:grid}
#tray{display:flex;align-items:stretch;gap:2px;padding-left:4px}
#tray>button{padding:0 12px;display:flex;align-items:center;gap:6px;transition:.15s;color:var(--tx)}#tray>button:hover{background:var(--hl)}
#clock{flex-direction:column;justify-content:center;align-items:flex-end!important;line-height:1.15;gap:0!important;font-family:var(--font-m);min-width:96px}
#clock b{font-weight:500;font-size:13px}#clock small{font-size:10px;color:var(--mu)}
#showDesk{width:14px;padding:0!important;border-left:1px solid var(--line2)}
/* 开始菜单 / 日历 / 窥视 */
.pop{position:fixed;z-index:9100;background:color-mix(in srgb,var(--s0) 94%,transparent);backdrop-filter:blur(28px) saturate(1.3);border:1px solid var(--line2);border-radius:var(--rad);box-shadow:var(--shadow);animation:popIn .22s cubic-bezier(.2,.9,.25,1)}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
#start{left:8px;bottom:calc(var(--tb) + 8px);width:min(640px,calc(100vw - 16px));height:min(560px,calc(100vh - var(--tb) - 24px));display:flex;overflow:hidden}
body.tb-top #start{bottom:auto;top:calc(var(--tb) + 8px)}
.st-l{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px}
.st-r{width:180px;border-left:1px solid var(--line);background:color-mix(in srgb,var(--s2) 60%,transparent);padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.st-r::before{content:'TIDE\AMARK';white-space:pre;position:absolute;left:12px;bottom:46px;font:800 64px/.85 var(--font-d);color:var(--accent);opacity:.1;letter-spacing:.02em;pointer-events:none}
.st-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;align-content:start;margin-top:12px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:3px 12px 3px 12px;transition:.15s;border:1px solid transparent;animation:tkIn .35s both}
.st-app:hover{background:var(--hl);border-color:var(--line)}
.st-app .pl{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px 12px 3px 12px;background:var(--s2)}
.st-app span{font-size:12px;text-align:center}
.st-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:3px 10px 3px 10px;transition:.15s;text-align:left;width:100%}.st-btn:hover{background:var(--hl)}
#cal{right:8px;bottom:calc(var(--tb) + 8px);width:min(320px,calc(100vw - 16px));padding:16px}
body.tb-top #cal{bottom:auto;top:calc(var(--tb) + 8px)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-big{font:800 44px/1 var(--font-d);letter-spacing:.02em;color:var(--accent)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g div{padding:7px 0;border-radius:3px;font-family:var(--font-m);font-size:12px}
.cal-g .wd{color:var(--mu);font-size:11px}.cal-g .o{color:var(--mu);opacity:.45}
.cal-g .d{cursor:pointer}.cal-g .d:hover{background:var(--hl)}.cal-g .today{background:var(--accent);color:var(--accent-ink);font-weight:700}
#peekCard{position:fixed;z-index:9050;width:230px;padding:8px;animation:popIn .18s both}
#peekCard .pv{height:130px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--s1);margin-top:6px;pointer-events:none}
#peekCard .pv>div{transform-origin:0 0;position:absolute;left:0;top:0}
/* 通用控件 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;min-height:28px;background:var(--s2);border:1px solid var(--line);border-radius:2px 8px 2px 8px;font-size:12.5px;transition:.15s;white-space:nowrap;color:var(--tx)}
.btn:hover{border-color:var(--accent);background:var(--s3)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}.btn.pri:hover{filter:brightness(1.1)}
.btn.dng:hover{border-color:var(--danger);color:var(--danger)}
.btn.on{background:var(--hl);border-color:var(--a2);color:var(--tx)}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.inp,.sel{background:var(--s0);color:var(--tx);border:1px solid var(--line);border-radius:2px 8px 2px 8px;padding:5px 10px;min-height:28px;font:inherit;outline:none;transition:.15s;min-width:0}
.inp:focus,.sel:focus{border-color:var(--a2);box-shadow:0 0 0 2px color-mix(in srgb,var(--a2) 20%,transparent)}
.sel option{background:var(--s1);color:var(--tx)}
.tbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.tbar.nw{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.mono{font-family:var(--font-m)}.mut{color:var(--mu)}
.grow{flex:1;min-width:0}
.sbar{display:flex;gap:16px;padding:4px 12px;border-top:1px solid var(--line);font:11px var(--font-m);color:var(--mu);flex:none;overflow:hidden;white-space:nowrap;background:color-mix(in srgb,var(--s2) 50%,transparent)}
/* 右键菜单 */
#ctx{position:fixed;inset:0;z-index:9500;display:none}#ctx.on{display:block}
.cm{position:fixed;min-width:190px;max-width:86vw;padding:5px;background:color-mix(in srgb,var(--s1) 95%,transparent);backdrop-filter:blur(22px);border:1px solid var(--line2);border-radius:2px 12px 2px 12px;box-shadow:var(--shadow);animation:popIn .14s both;max-height:90vh;overflow:auto}
.cm .mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:2px 8px 2px 8px;cursor:pointer;white-space:nowrap;position:relative}
.cm .mi:hover,.cm .mi.open{background:var(--hl)}.cm .mi.dis{opacity:.4;pointer-events:none}.cm .mi.dg{color:var(--danger)}
.cm .mi .k{margin-left:auto;font:10px var(--font-m);color:var(--mu);padding-left:18px}
.cm .ms{height:1px;background:var(--line);margin:4px 6px}
.cm .mi .ar{margin-left:auto}
/* 对话框与提示 */
.mw{position:fixed;inset:0;z-index:9600;background:rgba(2,6,10,.55);backdrop-filter:blur(3px);display:grid;place-items:center;animation:fade .15s;padding:12px}
@keyframes fade{from{opacity:0}}
.md{width:min(420px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line2);border-radius:2px 16px 2px 16px;box-shadow:var(--shadow);animation:popIn .2s both;position:relative}
.md::before{content:'';position:absolute;left:-1px;top:-1px;width:16px;height:16px;border-left:2px solid var(--accent);border-top:2px solid var(--accent)}
.md h3{margin:0;padding:16px 18px 6px;font:700 20px var(--font-d);letter-spacing:.08em;text-transform:uppercase}
.md .mb{padding:6px 18px 12px;overflow:auto;word-break:break-all;line-height:1.6}
.md .mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px;flex-wrap:wrap}
.md .opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px 10px 2px 10px;margin-bottom:6px;text-align:left}.md .opt:hover{border-color:var(--accent);background:var(--hl)}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb) + 12px);z-index:9700;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
body.tb-top #toasts{bottom:12px;top:calc(var(--tb) + 12px);justify-content:flex-start}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:min(380px,92vw);padding:10px 14px;background:var(--s1);border:1px solid var(--line2);border-left:3px solid var(--a2);border-radius:2px 12px 2px 12px;box-shadow:var(--shadow);animation:toastIn .3s cubic-bezier(.2,.9,.25,1)}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}
.toast.out{opacity:0;transform:translateX(40px);transition:.25s}
.drag-ghost{position:fixed;z-index:9800;pointer-events:none;padding:6px 10px;background:var(--accent);color:var(--accent-ink);border-radius:2px 10px 2px 10px;font-weight:700;font-size:12px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.droptarget{outline:2px dashed var(--a2)!important;outline-offset:-2px;background:var(--hl)!important}
body.mobile{--tb:58px}
body.mobile .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0}
body.mobile .rz,body.mobile .wb[data-w=max]{display:none}
body.mobile .tkt{display:none}body.mobile .tk{padding:0 14px}body.mobile .tkx{display:none!important}
body.mobile #start{left:0;right:0;bottom:var(--tb);width:100%;height:78vh;border-radius:16px 16px 0 0}
body.mobile .st-r{width:120px}
body.mobile #clock{min-width:0}body.mobile #clock small{display:none}
body.mobile #tray>button:not(#clock){display:none}body.mobile #showDesk{display:none!important}
body.mobile .wb{width:48px}
body.mobile .wt{height:42px}
body.mobile .dicon{--cw:84px}
body.mobile .tbar{gap:5px}
</style>
<!--@STYLES-->

 get(s,k){return this.tx(s,'readonly',o=>o.get(k))},set(s,k,v){return this.tx(s,'readwrite',o=>o.put(v,k))},del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))},clear(s){return this.tx(s,'readwrite',o=>o.clear())},

const duCache=new Map();
const ferr=(code,p)=>Object.assign(new Error(code+': '+p),{code,path:p});
const mkStat=(name,isDir,size,mtime)=>({name,isDir,isFile:!isDir,size:size||0,mtime:mtime||0});
class HandleBackend{ // 同时服务 OPFS 与 File System Access(本地文件夹)，二者接口一致
 constructor(root,name){this.root=root;this.name=name}
 async _p(p,create){const a=p.split('/').filter(Boolean);const n=a.pop();let d=this.root;for(const s of a)d=await d.getDirectoryHandle(s,{create});return [d,n]}
 async _dir(p,create){let d=this.root;for(const s of p.split('/').filter(Boolean))d=await d.getDirectoryHandle(s,{create});return d}
 async stat(p){if(p==='/')return mkStat('',true,0,0);let d,n;try{[d,n]=await this._p(p,false)}catch(e){throw ferr('ENOENT',p)}
  try{const f=await(await d.getFileHandle(n)).getFile();return mkStat(n,false,f.size,f.lastModified)}catch(e){}
  try{await d.getDirectoryHandle(n);return mkStat(n,true,0,0)}catch(e){}throw ferr('ENOENT',p)}
 async readdirStat(p){let d;try{d=await this._dir(p,false)}catch(e){throw ferr('ENOENT',p)}const out=[],jobs=[];
  for await(const [name,h] of d.entries()){if(h.kind==='directory')out.push(mkStat(name,true,0,0));else jobs.push(h.getFile().then(f=>out.push(mkStat(name,false,f.size,f.lastModified))).catch(()=>out.push(mkStat(name,false,0,0))))}
  await Promise.all(jobs);return out}
 async readFileBlob(p){let d,n;try{[d,n]=await this._p(p,false);return await(await d.getFileHandle(n)).getFile()}catch(e){throw ferr('ENOENT',p)}}
 async writeFile(p,data){const [d,n]=await this._p(p,true);const fh=await d.getFileHandle(n,{create:true});const w=await fh.createWritable();try{await w.write(data);await w.close()}catch(e){try{await w.abort()}catch(_){}throw e}}
 async mkdir(p){await this._dir(p,true)}
 async rmdir(p){const [d,n]=await this._p(p,false);await d.removeEntry(n,{recursive:true})}
 async unlink(p){const [d,n]=await this._p(p,false);await d.removeEntry(n)}
 async rename(a,b){const [da,na]=await this._p(a,false);let h;try{h=await da.getFileHandle(na)}catch(e){h=await da.getDirectoryHandle(na)}if(!h.move)throw ferr('ENOSYS',a);const [db,nb]=await this._p(b,true);await h.move(db,nb)}
 async wipe(){for await(const [n] of this.root.entries())await this.root.removeEntry(n,{recursive:true})}
}
class IDBBackend{ // OPFS 不可用时的降级后端（IndexedDB 存 Blob）
 constructor(){this.name='idb';this.ix=new Map()}
 async init(){(await idb.entries('idx')).forEach(([k,v])=>this.ix.set(k,v))}
 async stat(p){if(p==='/')return mkStat('',true,0,0);const v=this.ix.get(p);if(!v)throw ferr('ENOENT',p);return mkStat(basename(p),v.isDir,v.size,v.mtime)}
 async readdirStat(p){if(p!=='/'&&!this.ix.get(p))throw ferr('ENOENT',p);const pre=p==='/'?'/':p+'/';const o=[];for(const [k,v] of this.ix)if(k.length>pre.length&&k.startsWith(pre)&&!k.slice(pre.length).includes('/'))o.push(mkStat(k.slice(pre.length),v.isDir,v.size,v.mtime));return o}
 async readFileBlob(p){const v=this.ix.get(p);const b=v&&await idb.get('blob',p);if(!b)throw ferr('ENOENT',p);return new File([b],basename(p),{lastModified:v.mtime,type:b.type})}
 async _anc(p){let c=dirname(p);const l=[];while(c!=='/'&&!this.ix.has(c)){l.push(c);c=dirname(c)}for(const d of l.reverse()){const m={isDir:true,size:0,mtime:Date.now()};this.ix.set(d,m);await idb.set('idx',d,m)}}
 async writeFile(p,data){await this._anc(p);const b=data instanceof Blob?data:new Blob([data]);await idb.set('blob',p,b);const m={isDir:false,size:b.size,mtime:Date.now()};this.ix.set(p,m);await idb.set('idx',p,m)}
 async mkdir(p){await this._anc(p+'/x');if(!this.ix.has(p)){const m={isDir:true,size:0,mtime:Date.now()};this.ix.set(p,m);await idb.set('idx',p,m)}}
 async _del(p,rec){for(const k of [...this.ix.keys()])if(k===p||(rec&&k.startsWith(p+'/'))){this.ix.delete(k);await idb.del('idx',k);await idb.del('blob',k).catch(()=>{})}}
 async rmdir(p){await this._del(p,true)}async unlink(p){await this._del(p,false)}
 async rename(a,b){await this._anc(b);for(const k of [...this.ix.keys()])if(k===a||k.startsWith(a+'/')){const nk=b+k.slice(a.length);const v=this.ix.get(k);if(!v.isDir)await idb.set('blob',nk,await idb.get('blob',k));this.ix.set(nk,v);await idb.set('idx',nk,v);this.ix.delete(k);await idb.del('idx',k);await idb.del('blob',k).catch(()=>{})}}
 async wipe(){this.ix.clear();await idb.clear('idx');await idb.clear('blob')}
}
/* ---- 统一 fs 路由：/mnt/local/<名称>/... 自动路由到对应后端，调用方完全透明 ---- */
const fs=(()=>{
 const mounts=new Map(),ov=new Map(),listeners=new Set();let root=null,pend=new Set(),tm=0,svt=0;
 const compat=fn=>function(...a){const i=a.findIndex(x=>typeof x==='function');if(i>=0){const cb=a.splice(i,1)[0];fn.apply(this,a).then(r=>cb(null,r),e=>cb(e));return}return fn.apply(this,a)};
 const R=p=>{p=norm(p);if(p.startsWith('/mnt/local/')){const rest=p.slice(11),i=rest.indexOf('/'),name=i<0?rest:rest.slice(0,i),b=mounts.get(name);if(!b)throw ferr('ENOENT',p);return [b,i<0?'/':rest.slice(i),p]}return [root,p,p]};
 const virt=p=>p==='/mnt'||p==='/mnt/local';
 const saveOv=()=>{clearTimeout(svt);svt=setTimeout(()=>kv.set('ov',Object.fromEntries(ov)),500)};
 const ovApply=(b,p,st)=>{if(b===root&&ov.has(p)&&(st.isDir||!st._n))st.mtime=ov.get(p);return st};
 const api={
  get kind(){return root?root.name:''},mounts,
  on(fn){listeners.add(fn);return()=>listeners.delete(fn)},
  emit(...dirs){dirs.forEach(d=>pend.add(norm(d)));clearTimeout(tm);tm=setTimeout(()=>{const s=[...pend];pend.clear();duCache.clear();listeners.forEach(f=>{try{f(s)}catch(e){console.error(e)}})},40)},
  async init(){let b;try{if(!navigator.storage||!navigator.storage.getDirectory)throw 0;const r=await navigator.storage.getDirectory();const fh=await r.getFileHandle('.probe',{create:true});const w=await fh.createWritable();await w.write('1');await w.close();await r.removeEntry('.probe');b=new HandleBackend(r,'opfs')}catch(e){console.warn('OPFS 不可用，降级到 IndexedDB',e);try{b=new IDBBackend();await b.init()}catch(e2){throw new Error('无可用存储后端')}}
   root=b;const o=await kv.get('ov');if(o)Object.entries(o).forEach(([k,v])=>ov.set(k,v))},
  async stat(p,isLstat){p=norm(p);if(virt(p))return Object.assign(mkStat(basename(p),true,0,0),{path:p});const [b,r]=R(p);const st=await b.stat(r);if(r==='/'&&b!==root)st.name=basename(p);st.path=p;return ovApply(b,p,st)},
  async exists(p){try{await api.stat(p);return true}catch(e){return false}},
  async readdirStat(p){p=norm(p);let out;if(p==='/mnt')out=[mkStat('local',true,0,0)];else if(p==='/mnt/local')out=[...mounts.keys()].map(n=>mkStat(n,true,0,0));else{const [b,r]=R(p);out=await b.readdirStat(r);if(p==='/'&&!out.some(x=>x.name==='mnt'))out.push(mkStat('mnt',true,0,0));out.forEach(s=>ovApply(b,join(p,s.name),s))}out.forEach(s=>s.path=join(p,s.name));return out},
  async readdir(p){return (await api.readdirStat(p)).map(s=>s.name)},
  async readBlob(p){const [b,r]=R(p);return b.readFileBlob(r)},
  async readFile(p,flag){const f=await api.readBlob(p);if(flag&&(typeof flag==='string'||flag.encoding))return f.text();return new Uint8Array(await f.arrayBuffer())},
  async readText(p){return (await api.readBlob(p)).text()},
  async writeFile(p,data,opts){p=norm(p);if(virt(p))throw ferr('EPERM',p);const [b,r]=R(p);if(typeof data==='object'&&data&&!(data instanceof Blob)&&!ArrayBuffer.isView(data)&&!(data instanceof ArrayBuffer))data=JSON.stringify(data);await b.writeFile(r,data);if(b===root){if(opts&&opts.mtime)ov.set(p,opts.mtime);else ov.delete(p);saveOv()}api.emit(dirname(p))},
  async mkdir(p){p=norm(p);if(virt(p))throw ferr('EPERM',p);const [b,r]=R(p);await b.mkdir(r);if(b===root){ov.set(p,Date.now());saveOv()}api.emit(dirname(p),p)},
  async rmdir(p){return api.rm(p)},async unlink(p){return api.rm(p)},
  async rm(p){p=norm(p);const [b,r]=R(p);if(virt(p)||(r==='/'&&b!==root))throw ferr('EPERM',p);const st=await b.stat(r);if(st.isDir)await b.rmdir(r);else await b.unlink(r);if(b===root){for(const k of [...ov.keys()])if(k===p||k.startsWith(p+'/'))ov.delete(k);saveOv()}api.emit(dirname(p))},
  async rename(a,b2){a=norm(a);b2=norm(b2);if(a===b2)return;const [ba,ra]=R(a),[bb,rb]=R(b2);let done=false;if(ba===bb&&ra!=='/'){try{await ba.rename(ra,rb);done=true}catch(e){if(e.code==='ENOENT')throw e}}
   if(!done){await api.copy(a,b2);await api.rm(a)}
   for(const [k,v] of [...ov]){if(k===a||k.startsWith(a+'/')){ov.delete(k);ov.set(b2+k.slice(a.length),v)}}saveOv();api.emit(dirname(a),dirname(b2))},
  async copy(a,b2){const st=await api.stat(a);if(st.isDir){await api.mkdir(b2);for(const c of await api.readdirStat(a))await api.copy(join(a,c.name),join(b2,c.name))}else{const f=await api.readBlob(a);await api.writeFile(b2,f,{mtime:st.mtime})}api.emit(dirname(b2))},
  async du(p){const st=await api.stat(p);if(!st.isDir)return st.size;if(duCache.has(p))return duCache.get(p);let t=0;const kids=await api.readdirStat(p);for(let i=0;i<kids.length;i+=8){const part=await Promise.all(kids.slice(i,i+8).map(k=>k.isDir?api.du(join(p,k.name)):k.size));t+=part.reduce((x,y)=>x+y,0)}duCache.set(p,t);return t},
  async open(p,flag='r'){const f=flag;return {path:p,flag:f,read:()=>api.readFile(p),write:d=>api.writeFile(p,d),close:async()=>{}}},
  async unique(dir,name){let n=name,i=2;const e=extOf(name),st=e?name.slice(0,name.length-e.length-1):name;while(await api.exists(join(dir,n)))n=e?`${st} (${i++}).${e}`:`${st} (${i++})`;return n},
  async mount(name,handle){let n=name,i=2;while(mounts.has(n))n=name+'-'+i++;mounts.set(n,new HandleBackend(handle,'local'));try{await idb.set('handles',n,handle)}catch(e){}api.emit('/mnt/local');return n},
  async unmount(name){mounts.delete(name);try{await idb.del('handles',name)}catch(e){}api.emit('/mnt/local')},
  async reset(){await root.wipe();ov.clear();for(const [k] of await idb.entries('handles').catch(()=>[]))await idb.del('handles',k).catch(()=>{});await idb.clear('kv').catch(()=>{});Object.keys(localStorage).filter(k=>k.startsWith('tm.')).forEach(k=>localStorage.removeItem(k));['tm_theme','tm_h12'].forEach(k=>document.cookie=k+'=;max-age=0;path=/')}
 };
 for(const k of ['stat','exists','readdirStat','readdir','readBlob','readFile','readText','writeFile','mkdir','rmdir','unlink','rm','rename','copy','du','open','unique'])api[k]=compat(api[k]);
 return api;
})();
