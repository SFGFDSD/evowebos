      const resetSystem = async () => {
        if (!confirm('确定重置系统？\n\n这将删除 IndexedDB 中的 BrowserFS 数据（所有文件都会消失）。')) return;

        // Attempt to delete BrowserFS DB (name is typically "browserfs")
        const del = (name) => new Promise((res) => {
          try {
            const req = indexedDB.deleteDatabase(name);
            req.onsuccess = () => res(true);
            req.onerror = () => res(false);
            req.onblocked = () => res(false);
          } catch(e){ res(false); }
        });

        const ok1 = await del('browserfs');
        const ok2 = await del('kintsugi-os-vfs');
        toast('重置请求已发送', (ok1||ok2) ? 'IndexedDB 已删除（或将被删除）。正在刷新…' : '无法确认删除结果，仍将刷新尝试重建。', 'info', 2600);
        setTimeout(() => location.reload(), 900);
      };

      shell.addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'reload') { await applyWallpaperFromConfig(); await renderWalls(); toast('已重新加载', '配置已刷新。', 'ok'); }
        if (act === 'upload') uploadWallpaper();
        if (act === 'useCustom') useCustomWallpaper();
        if (act === 'reset') resetSystem();
        if (act === 'openSystem') openExplorer(VFS.system);
      });

      renderLibInfo();
      renderWalls();
    };

    /**********************
     * App: Image Preview (small utility)
     **********************/

    const openPreview = (filePath) => {
      const p = pathMod.normalize(filePath);
      const w = createWindow({
        appId: 'preview',
        title: `Preview — ${pathMod.basename(p)}`,
        icon: svgIcon('image'),
        w: 820,
        h: 560,
        mount: (root, win) => mountPreview(root, win, p)
      });
      return w;
    };

    const mountPreview = (root, win, filePath) => {
      root.innerHTML = '';
      const shell = document.createElement('div');
      shell.className = 'appShell';
      shell.innerHTML = `
        <div class="appToolbar">
          <button class="btn" data-act="openInExplorer">${svgIcon('folder')} 定位</button>
          <button class="btn" data-act="setWallpaper">${svgIcon('image')} 设为壁纸</button>
          <div class="flex-1"></div>
          <div class="text-xs text-[rgba(168,161,154,.86)] truncate">${escapeHtml(filePath)}</div>
        </div>
        <div class="p-3 flex-1 min-h-0 overflow-auto">
          <div class="rounded-2xl border border-[rgba(255,255,255,.10)] bg-[rgba(0,0,0,.22)] p-3">
            <img data-role="img" class="w-full rounded-xl" style="max-height: 70vh; object-fit: contain;" />
          </div>
        </div>
      `;
      root.appendChild(shell);

      const img = $('[data-role="img"]', shell);
      let url = null;

      const load = async () => {
        try{
          const buf = await pfs.readFile(filePath);
          const blob = new Blob([buf], {type: guessMime(filePath)});
          url = URL.createObjectURL(blob);
          img.src = url;
        }catch(e){
          toast('预览失败', String(e.message||e), 'danger');
        }
      };

      shell.addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'openInExplorer') openExplorer(pathMod.dirname(filePath));
        if (act === 'setWallpaper') {
          const cfg = await readJSON(VFS.config, {});
          cfg.wallpaper = { type: 'file', value: filePath };
          await writeJSON(VFS.config, cfg);
          await applyWallpaperFromConfig();
          toast('已设为壁纸', filePath, 'ok');
        }
      });

      load();
      win.onClose = () => { if (url) URL.revokeObjectURL(url); };
    };

    /**********************
     * Icons (inline SVG)
     **********************/

    function svgIcon(name){
      const common = 'width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"';
      const stroke = 'stroke="rgba(233,228,218,.92)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
      const gold = 'stroke="rgba(215,179,106,.95)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
      switch(name){
        case 'spark':
          return `<svg ${common}><path ${gold} d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/><path ${stroke} d="M5 19l2 1"/><path ${stroke} d="M17 20l2-1"/></svg>`;
        case 'folder':
          return `<svg ${common}><path ${gold} d="M3.5 7.5h6l2 2H20a2 2 0 0 1 2 2v6.5a2 2 0 0 1-2 2H4.5a2 2 0 0 1-2-2V9.5a2 2 0 0 1 1-2z"/></svg>`;
        case 'file':
          return `<svg ${common}><path ${gold} d="M7 3h7l3 3v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path ${stroke} d="M14 3v4a2 2 0 0 0 2 2h4"/></svg>`;
        case 'code':
          return `<svg ${common}><path ${gold} d="M9 18L3 12l6-6"/><path ${gold} d="M15 6l6 6-6 6"/><path ${stroke} d="M11 20l2-16"/></svg>`;
        case 'globe':
          return `<svg ${common}><circle ${gold} cx="12" cy="12" r="9"/><path ${stroke} d="M3 12h18"/><path ${stroke} d="M12 3c2.6 2.3 4.2 5.6 4.2 9S14.6 18.7 12 21c-2.6-2.3-4.2-5.6-4.2-9S9.4 5.3 12 3z"/></svg>`;
        case 'pen':
          return `<svg ${common}><path ${gold} d="M12 20h9"/><path ${gold} d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;
        case 'play':
          return `<svg ${common}><path ${gold} d="M9 7l10 5-10 5V7z"/><rect ${stroke} x="3" y="5" width="18" height="14" rx="3"/></svg>`;
        case 'calc':
          return `<svg ${common}><rect ${gold} x="5" y="3" width="14" height="18" rx="3"/><path ${stroke} d="M8 7h8"/><path ${stroke} d="M8 12h2"/><path ${stroke} d="M8 16h2"/><path ${stroke} d="M14 12h2"/><path ${stroke} d="M14 16h2"/></svg>`;
        case 'gear':
          return `<svg ${common}><path ${gold} d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path ${stroke} d="M19.4 15a7.8 7.8 0 0 0 .1-2l2-1.2-2-3.4-2.2 1a8.5 8.5 0 0 0-1.7-1L15.2 3H8.8L8 6.4c-.6.3-1.2.6-1.7 1l-2.2-1-2 3.4 2 1.2a7.8 7.8 0 0 0 0 2l-2 1.2 2 3.4 2.2-1c.5.4 1.1.7 1.7 1L8.8 21h6.4l.8-3.4c.6-.3 1.2-.6 1.7-1l2.2 1 2-3.4-2-1.2z"/></svg>`;
        case 'min':
          return `<svg ${common}><path ${stroke} d="M6 15h12"/></svg>`;
        case 'max':
          return `<svg ${common}><rect ${stroke} x="6" y="6" width="12" height="12" rx="2"/></svg>`;
        case 'close':
          return `<svg ${common}><path ${stroke} d="M7 7l10 10"/><path ${stroke} d="M17 7L7 17"/></svg>`;
        case 'up':
          return `<svg ${common}><path ${gold} d="M12 5l-7 7h4v7h6v-7h4l-7-7z"/></svg>`;
        case 'home':
          return `<svg ${common}><path ${gold} d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2V11z"/></svg>`;
        case 'plus':
          return `<svg ${common}><path ${gold} d="M12 5v14"/><path ${gold} d="M5 12h14"/></svg>`;
        case 'upload':
          return `<svg ${common}><path ${gold} d="M12 16V4"/><path ${gold} d="M7 9l5-5 5 5"/><path ${stroke} d="M4 20h16"/></svg>`;
        case 'paste':
          return `<svg ${common}><path ${gold} d="M9 3h6l1 2h3v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5h3l1-2z"/><path ${stroke} d="M9 7h6"/></svg>`;
        case 'refresh':
          return `<svg ${common}><path ${gold} d="M20 12a8 8 0 1 1-2.3-5.7"/><path ${gold} d="M20 4v6h-6"/></svg>`;
        case 'open':
          return `<svg ${common}><path ${gold} d="M14 3h7v7"/><path ${gold} d="M21 3l-9 9"/><path ${stroke} d="M10 7H6a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"/></svg>`;
        case 'edit':
          return `<svg ${common}><path ${gold} d="M12 20h9"/><path ${gold} d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;
        case 'copy':
          return `<svg ${common}><rect ${gold} x="8" y="8" width="12" height="12" rx="3"/><rect ${stroke} x="4" y="4" width="12" height="12" rx="3"/></svg>`;
        case 'scissors':
          return `<svg ${common}><path ${gold} d="M4 4l8 8"/><path ${gold} d="M4 20l8-8"/><path ${stroke} d="M14 6l6-2"/><path ${stroke} d="M14 18l6 2"/><circle ${stroke} cx="6" cy="6" r="2"/><circle ${stroke} cx="6" cy="18" r="2"/></svg>`;
        case 'trash':
          return `<svg ${common}><path ${gold} d="M4 7h16"/><path ${gold} d="M10 11v6"/><path ${gold} d="M14 11v6"/><path ${stroke} d="M6 7l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/><path ${stroke} d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>`;
        case 'save':
          return `<svg ${common}><path ${gold} d="M5 4h12l2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path ${stroke} d="M7 4v6h10V4"/><path ${stroke} d="M8 20v-6h8v6"/></svg>`;
        case 'enter':
          return `<svg ${common}><path ${gold} d="M10 8l4 4-4 4"/><path ${gold} d="M14 12H3"/><path ${stroke} d="M21 3v8a2 2 0 0 1-2 2h-3"/></svg>`;
        case 'back':
          return `<svg ${common}><path ${gold} d="M14 7l-5 5 5 5"/><path ${stroke} d="M20 12H9"/></svg>`;
        case 'forward':
          return `<svg ${common}><path ${gold} d="M10 7l5 5-5 5"/><path ${stroke} d="M4 12h11"/></svg>`;
        case 'image':
          return `<svg ${common}><rect ${gold} x="4" y="5" width="16" height="14" rx="3"/><path ${stroke} d="M8 13l2-2 3 3 2-2 3 3"/><circle ${stroke} cx="9" cy="10" r="1.2"/></svg>`;
        default:
          return `<svg ${common}><circle ${stroke} cx="12" cy="12" r="8"/></svg>`;
      }
    }

    /**********************
     * Global keyboard shortcuts
     **********************/

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        toggleStart(false);
        hideContextMenu();
      }
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        openExplorer(VFS.home);
      }
    });

    /**********************
     * Boot
     **********************/

    const bootDone = () => {
      boot.style.opacity = '0';
      boot.style.transition = 'opacity .32s ease';
      setTimeout(() => boot.remove(), 360);

      // staggered reveal
      const icons = $$('.icon', desktopEl);
      icons.forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px) scale(.98)';
        el.style.transition = 'opacity .35s ease, transform .35s ease';
        setTimeout(() => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0) scale(1)';
        }, 60 + i*40);
      });
    };

    (async () => {
      try{
        renderDesktopIcons();
        renderStartMenu('');
        logBoot('Starting…');
        await initVFS();
        setLibChip();

        // Quick launch Explorer if first-time? Keep calm.
        toast('Kintsugi OS 已启动', '所有文件将持久化在 IndexedDB 中。', 'ok', 3600);

        bootDone();
      } catch (e) {
        setLibChip();
        logBoot('Fatal: ' + (e.message||e));
        toast('启动失败', (e.message||e) + '（请检查网络/CDN）', 'danger', 8000);
      }
    })();
  </script>
</body>
</html>
