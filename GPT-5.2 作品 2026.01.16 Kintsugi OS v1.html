<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Kintsugi OS — Single‑File Web OS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Distinctive typography (avoid default/Inter/Roboto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Recursive:wght@300..1000&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ink: #07070b;
      --ink2:#0b0b12;
      --panel:#0d0f16cc;
      --panel2:#0c0e14e6;
      --stroke:#23263a;
      --stroke2:#2a2f48;
      --text:#e9e4da;
      --muted:#a8a19a;
      --gold:#d7b36a;
      --gold2:#b78b3f;
      --cyan:#4fd1ff;
      --magenta:#ff4fd6;
      --danger:#ff496a;
      --ok:#7af7c9;
      --shadow: 0 18px 70px rgba(0,0,0,.55);
      --shadow2: 0 10px 28px rgba(0,0,0,.38);
      --radius: 18px;
      --radius2: 14px;
      --glass: blur(14px) saturate(130%);
      --grid: rgba(255,255,255,.06);
      --wm-blur: blur(10px);
      --wallpaper-css: radial-gradient(1200px 800px at 15% 15%, rgba(215,179,106,.22), transparent 60%),
                       radial-gradient(900px 700px at 90% 35%, rgba(79,209,255,.16), transparent 55%),
                       radial-gradient(700px 700px at 45% 95%, rgba(255,79,214,.10), transparent 55%),
                       linear-gradient(180deg, #07070b 0%, #06070a 55%, #05060a 100%);
    }

    html, body { height: 100%; }
    body {
      font-family: "Recursive", ui-sans-serif, system-ui;
      background: var(--ink);
      color: var(--text);
      overflow: hidden;
    }

    /* Wallpaper layers */
    #wallpaper {
      position: fixed;
      inset: 0;
      background: var(--wallpaper-css);
      transform: translateZ(0);
    }
    #wallpaper::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 64px);
      opacity:.22;
      mix-blend-mode: overlay;
      pointer-events:none;
    }
    #wallpaper::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(1200px 800px at 60% 30%, rgba(0,0,0,.25), transparent 55%),
        radial-gradient(900px 700px at 20% 70%, rgba(0,0,0,.35), transparent 60%);
      pointer-events:none;
    }

    /* subtle noise */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .09;
      mix-blend-mode: overlay;
      background-image:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="180" height="180" filter="url(%23n)" opacity="0.85"/></svg>');
      background-size: 220px 220px;
    }

    /* Desktop layout */
    #osRoot { position: fixed; inset: 0; }
    #desktop {
      position: absolute;
      inset: 0;
      padding: 18px;
      padding-bottom: 84px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 14px;
      align-content: start;
      user-select: none;
    }

    .icon {
      width: 96px;
      border-radius: 16px;
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      cursor: default;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
      background: rgba(9,10,16,.06);
      border: 1px solid rgba(255,255,255,.06);
      backdrop-filter: var(--glass);
    }
    .icon:hover{ background: rgba(255,255,255,.06); box-shadow: 0 8px 24px rgba(0,0,0,.25); transform: translateY(-1px); }
    .icon:active{ transform: translateY(0px) scale(.99); }

    .iconGlyph {
      width: 46px; height: 46px;
      border-radius: 16px;
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(135deg, rgba(215,179,106,.25), rgba(79,209,255,.18));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.32);
      display:flex; align-items:center; justify-content:center;
    }
    .iconLabel{ font-size: 12px; line-height: 1.2; text-align: center; color: rgba(233,228,218,.92); text-shadow: 0 1px 0 rgba(0,0,0,.55); }

    /* Taskbar / Dock */
    #taskbar {
      position: fixed;
      left: 14px; right: 14px; bottom: 12px;
      height: 58px;
      border-radius: 20px;
      background: rgba(10, 12, 18, .62);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow2);
      display:flex;
      align-items:center;
      padding: 10px;
      gap: 10px;
      z-index: 9999;
    }
    .tbBtn{
      height: 38px;
      padding: 0 12px;
      border-radius: 14px;
      display:flex; align-items:center; gap:10px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      transition: transform .15s ease, background .15s ease;
      user-select:none;
    }
    .tbBtn:hover{ background: rgba(255,255,255,.10); transform: translateY(-1px); }
    .tbBtn:active{ transform: translateY(0px) scale(.99); }

    .tbDot{ width:10px; height:10px; border-radius:999px; background: linear-gradient(135deg, var(--gold), var(--cyan)); box-shadow: 0 0 0 3px rgba(215,179,106,.12); }

    #taskList{ flex: 1; display:flex; gap:8px; overflow:auto; scrollbar-width: none; }
    #taskList::-webkit-scrollbar{ display:none; }

    .taskPill{
      height: 38px;
      min-width: 120px;
      max-width: 240px;
      padding: 0 12px;
      border-radius: 14px;
      display:flex; align-items:center; gap: 10px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      transition: background .15s ease, transform .15s ease;
    }
    .taskPill:hover{ background: rgba(255,255,255,.08); transform: translateY(-1px); }
    .taskPill.active{ background: rgba(215,179,106,.10); border-color: rgba(215,179,106,.30); }
    .taskPill .title{ overflow:hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: rgba(233,228,218,.94);}    

    #tray{ display:flex; align-items:center; gap:10px; }
    #clock{ font-size: 12px; color: rgba(233,228,218,.86); padding: 0 10px; }
    .trayChip{ height: 38px; padding: 0 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10); display:flex; align-items:center; gap:10px; }

    /* Start Menu */
    #startMenu{
      position: fixed;
      left: 14px;
      bottom: 78px;
      width: min(520px, calc(100vw - 28px));
      border-radius: 22px;
      background: rgba(11, 13, 20, .72);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(20px) saturate(140%);
      box-shadow: var(--shadow);
      transform-origin: bottom left;
      transform: translateY(10px) scale(.98);
      opacity: 0;
      pointer-events: none;
      transition: transform .18s ease, opacity .18s ease;
      z-index: 9998;
    }
    #startMenu.open{ transform: translateY(0px) scale(1); opacity: 1; pointer-events: auto; }

    .startHeader{
      padding: 14px 16px 10px;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand{
      font-family: "Fraunces", serif;
      letter-spacing: .2px;
      font-weight: 650;
      font-size: 16px;
      background: linear-gradient(135deg, rgba(215,179,106,.95), rgba(79,209,255,.85));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .search{
      width: 220px;
      max-width: 46vw;
      height: 36px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      color: rgba(233,228,218,.95);
    }
    .search::placeholder{ color: rgba(168,161,154,.70); }

    .startBody{ padding: 12px; display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .appCard{
      border-radius: 18px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      padding: 12px;
      display:flex; align-items:center; gap: 12px;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .appCard:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); border-color: rgba(215,179,106,.25); }
    .appCard:active{ transform: translateY(0px) scale(.99); }
    .appCard .name{ font-size: 13px; font-weight: 640; color: rgba(233,228,218,.94); }
    .appCard .desc{ font-size: 12px; color: rgba(168,161,154,.82); }

    /* Windows */
    #wm { position: absolute; inset: 0; }

    .win{
      position: absolute;
      border-radius: var(--radius);
      background: rgba(12, 14, 20, .66);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      backdrop-filter: var(--wm-blur) saturate(140%);
      overflow: hidden;
      transform: translateZ(0);
    }

    .win.focused{ border-color: rgba(215,179,106,.28); box-shadow: 0 24px 90px rgba(0,0,0,.62); }

    .titlebar{
      height: 46px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border-bottom: 1px solid rgba(255,255,255,.10);
      user-select: none;
    }

    .titleLeft{ display:flex; align-items:center; gap: 10px; min-width: 0; }
    .winIcon{
      width: 26px; height: 26px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(135deg, rgba(215,179,106,.26), rgba(79,209,255,.18));
      display:flex; align-items:center; justify-content:center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      flex: 0 0 auto;
    }
    .winTitle{ font-size: 12px; color: rgba(233,228,218,.92); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }

    .titleBtns{ display:flex; gap: 6px; }
    .wbtn{
      width: 34px; height: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      display:flex; align-items:center; justify-content:center;
      transition: background .12s ease, transform .12s ease, border-color .12s ease;
    }
    .wbtn:hover{ background: rgba(255,255,255,.09); transform: translateY(-1px); }
    .wbtn:active{ transform: translateY(0px) scale(.99); }
    .wbtn.close:hover{ background: rgba(255,73,106,.16); border-color: rgba(255,73,106,.28); }

    .winContent{ height: calc(100% - 46px); background: rgba(9,10,16,.18); }

    /* Resize handles */
    .rh{ position:absolute; z-index: 50; }
    .rh.n{ top:-4px; left: 10px; right:10px; height: 8px; cursor: ns-resize; }
    .rh.s{ bottom:-4px; left: 10px; right:10px; height: 8px; cursor: ns-resize; }
    .rh.e{ right:-4px; top: 10px; bottom:10px; width: 8px; cursor: ew-resize; }
    .rh.w{ left:-4px; top: 10px; bottom:10px; width: 8px; cursor: ew-resize; }
    .rh.ne{ right:-4px; top:-4px; width: 14px; height: 14px; cursor: nesw-resize; }
    .rh.nw{ left:-4px; top:-4px; width: 14px; height: 14px; cursor: nwse-resize; }
    .rh.se{ right:-4px; bottom:-4px; width: 14px; height: 14px; cursor: nwse-resize; }
    .rh.sw{ left:-4px; bottom:-4px; width: 14px; height: 14px; cursor: nesw-resize; }

    /* Desktop context menu */
    #ctxMenu{
      position: fixed;
      min-width: 220px;
      border-radius: 18px;
      background: rgba(11,13,20,.76);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(18px) saturate(140%);
      padding: 8px;
      z-index: 99999;
      display:none;
    }
    .ctxItem{ padding: 10px 10px; border-radius: 14px; display:flex; justify-content:space-between; gap:12px; font-size: 13px; color: rgba(233,228,218,.92); }
    .ctxItem:hover{ background: rgba(255,255,255,.07); }
    .ctxItem .hint{ color: rgba(168,161,154,.78); font-size: 12px; }

    /* Toasts */
    #toasts{ position: fixed; top: 14px; right: 14px; display:flex; flex-direction:column; gap: 10px; z-index: 999999; }
    .toast{
      width: min(420px, calc(100vw - 28px));
      border-radius: 18px;
      background: rgba(10, 12, 18, .74);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px) saturate(130%);
      box-shadow: var(--shadow2);
      padding: 12px 12px;
      display:flex; gap: 10px;
      align-items:flex-start;
      animation: toastIn .28s ease both;
    }
    @keyframes toastIn{ from{ transform: translateY(-8px); opacity:0 } to{ transform: translateY(0); opacity:1 } }
    .toast .tTitle{ font-size: 13px; font-weight: 650; }
    .toast .tBody{ font-size: 12px; color: rgba(168,161,154,.88); margin-top: 2px; }

    /* Boot overlay */
    #boot{
      position: fixed;
      inset: 0;
      z-index: 1000000;
      background:
        radial-gradient(1200px 900px at 30% 20%, rgba(215,179,106,.10), transparent 55%),
        radial-gradient(900px 700px at 80% 40%, rgba(79,209,255,.10), transparent 55%),
        linear-gradient(180deg, #07070b 0%, #06070a 100%);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .bootCard{
      width: min(520px, calc(100vw - 36px));
      border-radius: 26px;
      background: rgba(12,14,20,.55);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(22px) saturate(150%);
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .bootBrand{ font-family: "Fraunces", serif; font-size: 26px; letter-spacing: .2px; }
    .bootBrand span{ background: linear-gradient(135deg, rgba(215,179,106,.92), rgba(79,209,255,.82)); -webkit-background-clip:text; background-clip:text; color: transparent; }
    .bootLine{ height: 1px; background: rgba(255,255,255,.10); margin: 14px 0; }
    .bootLog{ font-size: 12px; color: rgba(168,161,154,.92); line-height: 1.5; max-height: 180px; overflow:auto; }
    .bootBar{
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
      margin-top: 14px;
    }
    .bootBar > div{ height:100%; width: 38%; background: linear-gradient(90deg, rgba(215,179,106,.85), rgba(79,209,255,.70)); border-radius: 999px; animation: bootMove 1.2s ease-in-out infinite alternate; }
    @keyframes bootMove{ from{ transform: translateX(-10%); width: 30% } to{ transform: translateX(60%); width: 45% } }

    /* App common */
    .appShell{ height: 100%; display:flex; flex-direction:column; }
    .appToolbar{ padding: 10px; display:flex; gap: 8px; align-items:center; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(9,10,16,.16); }
    .btn{
      height: 34px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      font-size: 12px;
      color: rgba(233,228,218,.92);
      display:flex; align-items:center; gap: 8px;
      user-select:none;
      transition: background .12s ease, transform .12s ease, border-color .12s ease;
    }
    .btn:hover{ background: rgba(255,255,255,.08); transform: translateY(-1px); }
    .btn:active{ transform: translateY(0px) scale(.99); }
    .btn.primary{ border-color: rgba(215,179,106,.26); background: rgba(215,179,106,.10); }
    .btn.danger{ border-color: rgba(255,73,106,.24); background: rgba(255,73,106,.10); }

    .pillInput{
      height: 34px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      padding: 0 10px;
      font-size: 12px;
      outline: none;
      color: rgba(233,228,218,.94);
      width: 100%;
    }

    /* Explorer */
    .split{ flex:1; display:grid; grid-template-columns: 1.1fr .9fr; min-height:0; }
    .pane{ min-height:0; overflow:auto; }
    .listRow{ display:grid; grid-template-columns: 28px 1fr 120px 110px; gap: 10px; align-items:center; padding: 8px 10px; border-radius: 12px; border: 1px solid transparent; }
    .listRow:hover{ background: rgba(255,255,255,.05); }
    .listRow.selected{ background: rgba(215,179,106,.10); border-color: rgba(215,179,106,.22); }
    .meta{ font-size: 12px; color: rgba(168,161,154,.86); }
    .fname{ font-size: 13px; color: rgba(233,228,218,.92); overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag{ font-size: 11px; color: rgba(233,228,218,.84); border: 1px solid rgba(255,255,255,.10); border-radius: 999px; padding: 3px 8px; width: fit-content; background: rgba(255,255,255,.03); }

    /* Editor */
    .editorWrap{ flex:1; min-height:0; display:grid; grid-template-columns: 62px 1fr; }
    .gutter{ overflow:hidden; border-right: 1px solid rgba(255,255,255,.08); background: rgba(9,10,16,.22); padding: 10px 0; font-size: 12px; color: rgba(168,161,154,.76); text-align:right; }
    .gutter pre{ margin:0; padding: 0 10px; line-height: 1.55; }
    .codeArea{
      width: 100%; height: 100%;
      padding: 10px 12px;
      background: rgba(6,7,10,.10);
      outline:none;
      resize:none;
      border: 0;
      font-size: 13px;
      line-height: 1.55;
      color: rgba(233,228,218,.95);
      font-family: "Recursive", ui-monospace;
      font-variation-settings: "MONO" 1, "slnt" 0, "CASL" 0.2;
      caret-color: var(--gold);
    }

    /* Browser app */
    .addr{ display:flex; gap:8px; align-items:center; width: 100%; }
    .iframeWrap{ flex:1; min-height:0; background: rgba(0,0,0,.18); }
    .iframeWrap iframe{ width:100%; height:100%; border: 0; background: #fff; border-top: 1px solid rgba(255,255,255,.08); }

    /* Drawing */
    .canvasWrap{ flex:1; min-height:0; display:grid; grid-template-columns: 220px 1fr; }
    .toolPane{ padding: 10px; border-right: 1px solid rgba(255,255,255,.08); background: rgba(9,10,16,.18); }
    .toolPane label{ font-size: 12px; color: rgba(168,161,154,.90); display:block; margin: 10px 0 6px; }
    .toolPane input[type="range"], .toolPane input[type="color"]{ width:100%; }
    .canvasStage{ position: relative; }
    canvas{ width:100%; height:100%; display:block; background: rgba(255,255,255,.04); }

    /* Media */
    .mediaStage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding: 12px; }
    .mediaStage video, .mediaStage audio{ width: 100%; max-height: 100%; }

    /* Settings */
    .settingsGrid{ padding: 12px; display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .setCard{ border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10); padding: 12px; }
    .setCard h3{ font-family: "Fraunces", serif; font-size: 14px; margin-bottom: 6px; }
    .setCard p{ font-size: 12px; color: rgba(168,161,154,.88); }
    .wallGrid{ margin-top: 10px; display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .wallThumb{ height: 70px; border-radius: 14px; border: 1px solid rgba(255,255,255,.10); overflow:hidden; cursor:pointer; position:relative; }
    .wallThumb::after{ content:""; position:absolute; inset:0; border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
    .wallThumb.active{ outline: 2px solid rgba(215,179,106,.55); outline-offset: 2px; }

    /* Mobile adaptations */
    @media (max-width: 768px){
      #desktop{ grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); padding: 14px; padding-bottom: 92px; }
      #taskbar{ left: 10px; right: 10px; bottom: 10px; height: 62px; border-radius: 22px; }
      #startMenu{ left: 10px; bottom: 84px; }
      .taskPill{ min-width: 92px; }
      .split{ grid-template-columns: 1fr; }
      .canvasWrap{ grid-template-columns: 1fr; }
      .toolPane{ border-right:0; border-bottom: 1px solid rgba(255,255,255,.08); display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .settingsGrid{ grid-template-columns: 1fr; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      *{ transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <div id="osRoot">
    <div id="wm"></div>
    <div id="desktop" aria-label="Desktop"></div>

    <div id="startMenu" role="dialog" aria-label="Start menu">
      <div class="startHeader">
        <div class="brand">Kintsugi <span class="opacity-80">OS</span></div>
        <input id="startSearch" class="search" placeholder="搜索应用或命令… (e.g. /home)" />
      </div>
      <div id="startBody" class="startBody"></div>
      <div class="px-4 pb-4 pt-1 text-xs text-[rgba(168,161,154,.80)]">
        提示：在搜索框输入路径如 <span class="text-[rgba(233,228,218,.85)]">/home/user</span> 可直接打开资源管理器。
      </div>
    </div>

    <div id="taskbar" role="navigation" aria-label="Taskbar">
      <div id="startBtn" class="tbBtn" title="Start">
        <div class="tbDot"></div>
        <div class="text-xs font-semibold tracking-wide text-[rgba(233,228,218,.92)]">Start</div>
      </div>
      <div id="taskList"></div>
      <div id="tray" class="ml-auto">
        <div id="netChip" class="trayChip" title="Library status">
          <div class="w-2 h-2 rounded-full bg-[rgba(168,161,154,.60)]" id="libDot"></div>
          <div class="text-xs text-[rgba(233,228,218,.84)]" id="libText">Loading…</div>
        </div>
        <div id="clock"></div>
      </div>
    </div>

    <div id="ctxMenu" role="menu" aria-label="Context menu"></div>
    <div id="toasts" aria-live="polite"></div>

    <input id="filePicker" type="file" class="hidden" />

    <div id="boot">
      <div class="bootCard">
        <div class="bootBrand"><span>Kintsugi OS</span></div>
        <div class="text-xs text-[rgba(168,161,154,.88)] mt-1">Single‑File Web OS · BrowserFS + IndexedDB VFS</div>
        <div class="bootLine"></div>
        <div id="bootLog" class="bootLog"></div>
        <div class="bootBar"><div></div></div>
        <div class="text-xs text-[rgba(168,161,154,.84)] mt-3">如果你离线，BrowserFS/JSZip CDN 可能加载失败。</div>
      </div>
    </div>
  </div>

  <!-- Buffer polyfill (must be before BrowserFS) -->
  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js" crossorigin="anonymous"></script>
  <!-- BrowserFS -->
  <script src="https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js" crossorigin="anonymous"></script>
  <!-- JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" crossorigin="anonymous"></script>

  <script>
    /**********************
     * Kintsugi OS — Single file Web OS
     * - Window manager
     * - BrowserFS (IndexedDB) virtual file system
     * - Built-in apps all use fs
     **********************/

    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

    const bootLogEl = $('#bootLog');
    const boot = $('#boot');

    const logBoot = (msg) => {
      const line = document.createElement('div');
      line.textContent = msg;
      bootLogEl.appendChild(line);
      bootLogEl.scrollTop = bootLogEl.scrollHeight;
    };

    const toast = (title, body, kind='info', ttl=3200) => {
      const host = $('#toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      const color = kind==='danger' ? 'rgba(255,73,106,.95)' : kind==='ok' ? 'rgba(122,247,201,.95)' : 'rgba(215,179,106,.95)';
      el.innerHTML = `
        <div style="width:10px;height:10px;border-radius:999px;background:${color};margin-top:3px;box-shadow:0 0 0 4px rgba(255,255,255,.06)"></div>
        <div class="min-w-0">
          <div class="tTitle">${escapeHtml(title)}</div>
          <div class="tBody">${escapeHtml(body||'')}</div>
        </div>
      `;
      host.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'opacity .18s ease, transform .18s ease';
        setTimeout(() => el.remove(), 220);
      }, ttl);
    };

    const escapeHtml = (s) => (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const fmtBytes = (bytes) => {
      if (bytes == null || isNaN(bytes)) return '-';
      const units = ['B','KB','MB','GB'];
      let i = 0; let v = bytes;
      while (v >= 1024 && i < units.length-1){ v/=1024; i++; }
      return `${v.toFixed(i?1:0)} ${units[i]}`;
    };

    const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

    /**********************
     * Libraries & VFS init
     **********************/

    // Buffer polyfill
    try {
      if (window.buffer && window.buffer.Buffer) window.Buffer = window.buffer.Buffer;
    } catch (e) {}

    const libStatus = {
      buffer: !!window.Buffer,
      browserfs: !!window.BrowserFS,
      jszip: !!window.JSZip,
    };

    const setLibChip = () => {
      const ok = libStatus.buffer && libStatus.browserfs && libStatus.jszip;
      $('#libDot').style.background = ok ? 'rgba(122,247,201,.95)' : 'rgba(255,73,106,.95)';
      $('#libText').textContent = ok ? 'VFS Ready' : 'Lib Missing';
    };

    setLibChip();

    let fsRaw = null;
    let pathMod = null;
    let fs = null; // promisified

    const pfs = {
      readdir: (p, opt) => new Promise((res, rej) => fsRaw.readdir(p, opt, (e, d) => e?rej(e):res(d))),
      stat: (p) => new Promise((res, rej) => fsRaw.stat(p, (e, d) => e?rej(e):res(d))),
      mkdir: (p, opt) => new Promise((res, rej) => fsRaw.mkdir(p, opt, (e) => e?rej(e):res())),
      readFile: (p, opt) => new Promise((res, rej) => fsRaw.readFile(p, opt, (e, d) => e?rej(e):res(d))),
      writeFile: (p, data, opt) => new Promise((res, rej) => fsRaw.writeFile(p, data, opt, (e) => e?rej(e):res())),
      unlink: (p) => new Promise((res, rej) => fsRaw.unlink(p, (e) => e?rej(e):res())),
      rename: (a,b) => new Promise((res, rej) => fsRaw.rename(a,b,(e)=>e?rej(e):res())),
      rmdir: (p) => new Promise((res, rej) => fsRaw.rmdir(p, (e)=>e?rej(e):res())),
      exists: (p) => new Promise((res) => fsRaw.exists(p, (ok)=>res(!!ok))),
      copyFile: async (src, dst) => {
        // BrowserFS may not support fs.copyFile; do manual.
        const buf = await pfs.readFile(src);
        await pfs.writeFile(dst, buf);
      },
    };

    const ensureDir = async (dir) => {
      if (await pfs.exists(dir)) return;
      const parts = dir.split('/').filter(Boolean);
      let cur = '';
      for (const part of parts){
        cur += '/' + part;
        if (!await pfs.exists(cur)) {
          try { await pfs.mkdir(cur); } catch(e) {}
        }
      }
    };

    const writeJSON = async (p, obj) => {
      await ensureDir(pathMod.dirname(p));
      await pfs.writeFile(p, JSON.stringify(obj, null, 2), 'utf8');
    };
    const readJSON = async (p, fallback=null) => {
      try{
        const s = await pfs.readFile(p, 'utf8');
        return JSON.parse(s);
      }catch(e){ return fallback; }
    };

    const VFS = {
      home: '/home/user',
      desktop: '/home/user/Desktop',
      docs: '/home/user/Documents',
      downloads: '/home/user/Downloads',
      pictures: '/home/user/Pictures',
      music: '/home/user/Music',
      videos: '/home/user/Videos',
      system: '/system',
      config: '/system/config.json',
      wallpapers: '/system/wallpapers',
      customWall: '/system/wallpapers/custom',
    };

    const BUILTIN_WALLPAPERS = [
      {
        id: 'lacquer-archipelago',
        name: 'Lacquer Archipelago',
        css: `radial-gradient(1100px 760px at 10% 18%, rgba(215,179,106,.26), transparent 60%),
              radial-gradient(900px 720px at 88% 35%, rgba(79,209,255,.18), transparent 58%),
              radial-gradient(900px 700px at 45% 105%, rgba(255,79,214,.12), transparent 55%),
              linear-gradient(180deg, #07070b 0%, #06070a 60%, #05060a 100%)`
      },
      {
        id: 'embers',
        name: 'Ash & Embers',
        css: `radial-gradient(900px 700px at 18% 22%, rgba(255,73,106,.18), transparent 60%),
              radial-gradient(900px 700px at 70% 40%, rgba(215,179,106,.16), transparent 58%),
              radial-gradient(900px 700px at 50% 110%, rgba(122,247,201,.08), transparent 55%),
              linear-gradient(180deg, #07070b 0%, #07060a 62%, #05060a 100%)`
      },
      {
        id: 'blueprint-night',
        name: 'Blueprint Night',
        css: `radial-gradient(1100px 700px at 18% 24%, rgba(79,209,255,.20), transparent 62%),
              radial-gradient(900px 700px at 85% 22%, rgba(79,209,255,.10), transparent 58%),
              linear-gradient(180deg, #05070c 0%, #05060a 60%, #04060a 100%),
              repeating-linear-gradient(90deg, rgba(79,209,255,.06) 0 1px, transparent 1px 70px)`
      },
      {
        id: 'kintsugi-seam',
        name: 'Kintsugi Seam',
        css: `radial-gradient(1200px 850px at 30% 25%, rgba(215,179,106,.22), transparent 60%),
              linear-gradient(120deg, rgba(215,179,106,.18), transparent 55%),
              linear-gradient(180deg, #07070b 0%, #05060a 100%),
              repeating-linear-gradient(120deg, rgba(215,179,106,.10) 0 2px, transparent 2px 140px)`
      }
    ];

    const applyWallpaperFromConfig = async () => {
      const cfg = await readJSON(VFS.config, null);
      if (!cfg) return;

      if (cfg.wallpaper?.type === 'builtin') {
        const w = BUILTIN_WALLPAPERS.find(x => x.id === cfg.wallpaper.value) || BUILTIN_WALLPAPERS[0];
        document.documentElement.style.setProperty('--wallpaper-css', w.css);
        return;
      }

      if (cfg.wallpaper?.type === 'file') {
        const p = cfg.wallpaper.value;
        try{
          const buf = await pfs.readFile(p);
          const blob = new Blob([buf], {type: guessMime(p) || 'image/jpeg'});
          const url = URL.createObjectURL(blob);
          document.documentElement.style.setProperty('--wallpaper-css', `url(${url})`);
          // make it look like wallpaper (cover)
          $('#wallpaper').style.backgroundSize = 'cover';
          $('#wallpaper').style.backgroundPosition = 'center';
          $('#wallpaper').style.backgroundRepeat = 'no-repeat';
        }catch(e){
          toast('壁纸加载失败', String(e.message||e), 'danger');
        }
        return;
      }
    };

    const seedVFS = async () => {
      await ensureDir(VFS.desktop);
      await ensureDir(VFS.docs);
      await ensureDir(VFS.downloads);
      await ensureDir(VFS.pictures);
      await ensureDir(VFS.music);
      await ensureDir(VFS.videos);
      await ensureDir(VFS.wallpapers);

      const hasCfg = await pfs.exists(VFS.config);
      if (!hasCfg) {
        await writeJSON(VFS.config, {
          version: 1,
          wallpaper: { type: 'builtin', value: BUILTIN_WALLPAPERS[0].id },
          desktop: { iconLayout: {} }
        });
      }

      const welcome = pathMod.join(VFS.docs, 'Welcome.txt');
      if (!await pfs.exists(welcome)) {
        await pfs.writeFile(welcome,
`Kintsugi OS (Single-File Web OS)\n\n- VFS: BrowserFS + IndexedDB\n- Apps: Explorer / Editor / Browser / Draw / Media / Calculator / Settings\n\nTips:\n- Desktop 右键：新建文件夹 / 全屏 / 刷新\n- Explorer 可导入本地文件到 VFS，并支持解压 ZIP\n\nEnjoy.\n`, 'utf8');
      }

      const demo = pathMod.join(VFS.docs, 'notes.md');
      if (!await pfs.exists(demo)) {
        await pfs.writeFile(demo,
`# Notes\n\n这里是一个存储在 IndexedDB 的文件。\n\n- 资源管理器：复制/粘贴/重命名/删除\n- 文本编辑器：编辑并保存回 VFS\n`, 'utf8');
      }
    };

    const initVFS = async () => {
      logBoot('Checking libraries…');
      if (!window.Buffer) {
        libStatus.buffer = false;
        setLibChip();
        throw new Error('Buffer polyfill missing.');
      }
      if (!window.BrowserFS) {
        libStatus.browserfs = false;
        setLibChip();
        throw new Error('BrowserFS missing (CDN failed?).');
      }
      if (!window.JSZip) {
        libStatus.jszip = false;
        setLibChip();
        throw new Error('JSZip missing (CDN failed?).');
      }

      libStatus.buffer = libStatus.browserfs = libStatus.jszip = true;
      setLibChip();

      logBoot('Configuring BrowserFS with IndexedDB backend…');

      // BrowserFS uses a global indexedDB DB named "browserfs". StoreName ensures separate object store.
      await new Promise((resolve, reject) => {
        try{
          BrowserFS.configure({
            fs: 'IndexedDB',
            options: { storeName: 'kintsugi-os-vfs' }
          }, (e) => e ? reject(e) : resolve());
        } catch (err) { reject(err); }
      });

      fsRaw = BrowserFS.BFSRequire('fs');
      pathMod = BrowserFS.BFSRequire('path');
      fs = pfs;
      window.fsRaw = fsRaw;
      window.fs = fs;           // requirement: global mount
      window.path = pathMod;
      logBoot('Mounted global fs + path.');

      logBoot('Seeding VFS directories and starter files…');
      await seedVFS();
      logBoot('Applying wallpaper from /system/config.json …');
      await applyWallpaperFromConfig();

      logBoot('VFS ready.');
    };

    /**********************
     * Window manager
     **********************/

    const WM = {
      z: 20,
      windows: new Map(),
      tasks: new Map(),
      focusedId: null,
    };

    const wmEl = $('#wm');
    const taskList = $('#taskList');

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    const focusWindow = (id) => {
      const w = WM.windows.get(id);
      if (!w) return;
      WM.z += 1;
      w.el.style.zIndex = WM.z;
      WM.focusedId = id;
      for (const [wid, ww] of WM.windows){
        ww.el.classList.toggle('focused', wid === id);
      }
      renderTaskbar();
    };

    const minimizeWindow = (id) => {
      const w = WM.windows.get(id);
      if (!w) return;
      w.state.minimized = true;
      w.el.style.display = 'none';
      renderTaskbar();
    };

    const restoreWindow = (id) => {
      const w = WM.windows.get(id);
      if (!w) return;
      w.state.minimized = false;
      w.el.style.display = 'block';
      if (isMobile()) maximizeWindow(id, true);
      focusWindow(id);
      renderTaskbar();
    };

    const closeWindow = (id) => {
      const w = WM.windows.get(id);
      if (!w) return;
      try{ w.onClose?.(); } catch(e) {}
      w.el.remove();
      WM.windows.delete(id);
      WM.tasks.delete(id);
      if (WM.focusedId === id) WM.focusedId = null;
      renderTaskbar();
    };

    const maximizeWindow = (id, force=false) => {
      const w = WM.windows.get(id);
      if (!w) return;
      if (isMobile()) force = true;

      if (!w.state.maximized) {
        w.state.prevRect = {...w.state.rect};
        w.state.maximized = true;
        const pad = isMobile() ? 0 : 16;
        w.state.rect = {
          x: pad,
          y: pad,
          w: window.innerWidth - pad*2,
          h: window.innerHeight - pad*2 - 78
        };
      } else if (!force) {
        w.state.maximized = false;
        if (w.state.prevRect) w.state.rect = {...w.state.prevRect};
      }
      applyRect(w);
      renderTaskbar();
    };

    const applyRect = (w) => {
      const r = w.state.rect;
      w.el.style.left = r.x + 'px';
      w.el.style.top = r.y + 'px';
      w.el.style.width = r.w + 'px';
      w.el.style.height = r.h + 'px';

      const mobile = isMobile();
      w.el.dataset.mobile = mobile ? '1' : '0';

      // Hide resize handles and dragging on mobile (force-max)
      const titlebar = w.el.querySelector('.titlebar');
      if (titlebar) titlebar.style.cursor = (mobile ? 'default' : 'grab');
      $$('.rh', w.el).forEach(h => h.style.display = mobile ? 'none' : 'block');
    };

    const createWindow = (opts) => {
      const id = opts.id || ('w_' + Math.random().toString(16).slice(2));

      const rect = {
        x: opts.x ?? Math.round(70 + Math.random()*120),
        y: opts.y ?? Math.round(60 + Math.random()*90),
        w: opts.w ?? 860,
        h: opts.h ?? 520,
      };

      const el = document.createElement('div');
      el.className = 'win';
      el.style.zIndex = (++WM.z);
      el.dataset.wid = id;

      el.innerHTML = `
        <div class="titlebar">
          <div class="titleLeft" title="${escapeHtml(opts.title||'Window')}">
            <div class="winIcon">${opts.icon || svgIcon('spark')}</div>
            <div class="winTitle">${escapeHtml(opts.title || 'Untitled')}</div>
          </div>
          <div class="titleBtns">
            <button class="wbtn" data-act="min" title="Minimize">${svgIcon('min')}</button>
            <button class="wbtn" data-act="max" title="Maximize">${svgIcon('max')}</button>
            <button class="wbtn close" data-act="close" title="Close">${svgIcon('close')}</button>
          </div>
        </div>
        <div class="winContent"></div>
        <div class="rh n" data-r="n"></div>
        <div class="rh s" data-r="s"></div>
        <div class="rh e" data-r="e"></div>
        <div class="rh w" data-r="w"></div>
        <div class="rh ne" data-r="ne"></div>
        <div class="rh nw" data-r="nw"></div>
        <div class="rh se" data-r="se"></div>
        <div class="rh sw" data-r="sw"></div>
      `;

      wmEl.appendChild(el);

      const w = {
        id,
        el,
        state: {
          minimized: false,
          maximized: false,
          rect,
          prevRect: null,
        },
        title: opts.title || 'Untitled',
        icon: opts.icon || svgIcon('spark'),
        appId: opts.appId || 'app',
        onClose: opts.onClose,
        api: {},
      };

      WM.windows.set(id, w);
      WM.tasks.set(id, { id, title: w.title, icon: w.icon, minimized: false });

      applyRect(w);

      // content render
      const contentEl = $('.winContent', el);
      if (opts.mount) opts.mount(contentEl, w);

      // focus behavior
      el.addEventListener('pointerdown', () => focusWindow(id));

      // titlebar actions
      el.querySelectorAll('.wbtn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const act = btn.dataset.act;
          if (act === 'min') minimizeWindow(id);
          if (act === 'max') maximizeWindow(id);
          if (act === 'close') closeWindow(id);
        });
      });

      // dragging
      const titlebar = $('.titlebar', el);
      let drag = null;
      titlebar.addEventListener('pointerdown', (e) => {
        if (isMobile()) return;
        if (e.target.closest('.wbtn')) return;
        if (w.state.maximized) return;
        focusWindow(id);
        titlebar.setPointerCapture(e.pointerId);
        drag = {
          sx: e.clientX,
          sy: e.clientY,
          ox: w.state.rect.x,
          oy: w.state.rect.y,
        };
      });
      titlebar.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.sx;
        const dy = e.clientY - drag.sy;
        w.state.rect.x = clamp(drag.ox + dx, -40, window.innerWidth - 120);
        w.state.rect.y = clamp(drag.oy + dy, 0, window.innerHeight - 120);
        applyRect(w);
      });
      titlebar.addEventListener('pointerup', () => drag = null);

      // resizing
      let rs = null;
      $$('.rh', el).forEach(h => {
        h.addEventListener('pointerdown', (e) => {
          if (isMobile()) return;
          focusWindow(id);
          if (w.state.maximized) return;
          const dir = h.dataset.r;
          h.setPointerCapture(e.pointerId);
          rs = {
            dir,
            sx: e.clientX,
            sy: e.clientY,
            rect: {...w.state.rect},
          };
          e.preventDefault();
          e.stopPropagation();
        });
        h.addEventListener('pointermove', (e) => {
          if (!rs) return;
          const dx = e.clientX - rs.sx;
          const dy = e.clientY - rs.sy;
          const r0 = rs.rect;
          let r = {...r0};

          const minW = 360, minH = 220;

          const applyH = (d) => {
            if (d.includes('e')) { r.w = clamp(r0.w + dx, minW, window.innerWidth); }
            if (d.includes('s')) { r.h = clamp(r0.h + dy, minH, window.innerHeight); }
            if (d.includes('w')) { r.x = clamp(r0.x + dx, -40, r0.x + r0.w - minW); r.w = clamp(r0.w - dx, minW, window.innerWidth); }
            if (d.includes('n')) { r.y = clamp(r0.y + dy, 0, r0.y + r0.h - minH); r.h = clamp(r0.h - dy, minH, window.innerHeight); }
          };

          applyH(rs.dir);

          w.state.rect = r;
          applyRect(w);
        });
        h.addEventListener('pointerup', () => rs = null);
      });

      // double click titlebar to maximize
      titlebar.addEventListener('dblclick', (e) => {
        if (e.target.closest('.wbtn')) return;
        maximizeWindow(id);
      });

      // mobile auto maximize
      if (isMobile()) {
        w.state.rect = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight - 78 };
        w.state.maximized = true;
        applyRect(w);
      }

      focusWindow(id);
      renderTaskbar();
      return w;
    };

    const renderTaskbar = () => {
      taskList.innerHTML = '';
      for (const [id, t] of WM.tasks) {
        const w = WM.windows.get(id);
        if (!w) continue;
        const pill = document.createElement('button');
        pill.className = 'taskPill ' + (WM.focusedId === id && !w.state.minimized ? 'active' : '');
        pill.title = w.title;
        pill.innerHTML = `
          <div class="winIcon" style="width:22px;height:22px;border-radius:10px">${w.icon}</div>
          <div class="title">${escapeHtml(w.title)}</div>
        `;
        pill.addEventListener('click', () => {
          if (w.state.minimized) restoreWindow(id);
          else minimizeWindow(id);
        });
        taskList.appendChild(pill);
      }
    };

    window.addEventListener('resize', () => {
      for (const w of WM.windows.values()){
        if (isMobile()) {
          w.state.maximized = true;
          w.state.rect = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight - 78 };
          applyRect(w);
        } else if (w.state.maximized) {
          maximizeWindow(w.id, true);
        }
      }
    });

    /**********************
     * Desktop UI: icons, start menu, context menu
     **********************/

    const desktopEl = $('#desktop');
    const startMenu = $('#startMenu');
    const startBtn = $('#startBtn');

    const APPS = {
      explorer: {
        id: 'explorer',
        name: '文件资源管理器',
        desc: '浏览 / 复制粘贴 / 导入 / ZIP 解压',
        icon: svgIcon('folder'),
        launch: (args={}) => openExplorer(args.path || VFS.home),
      },
      editor: {
        id: 'editor',
        name: '文本编辑器',
        desc: '深色代码质感 · 行号 · 保存到 VFS',
        icon: svgIcon('code'),
        launch: (args={}) => openEditor(args.path || pathMod.join(VFS.docs, 'notes.md')),
      },
      browser: {
        id: 'browser',
        name: '网页浏览器',
        desc: '地址栏 + iframe 模拟',
        icon: svgIcon('globe'),
        launch: (args={}) => openBrowser(args.url || 'https://example.com'),
      },
      draw: {
        id: 'draw',
        name: '画板',
        desc: 'Canvas · 保存 PNG 到 VFS',
        icon: svgIcon('pen'),
        launch: (args={}) => openDrawing(args.path),
      },
      media: {
        id: 'media',
        name: '媒体播放器',
        desc: '从 VFS 读取 MP3/MP4',
        icon: svgIcon('play'),
        launch: (args={}) => openMedia(args.path),
      },
      calc: {
        id: 'calc',
        name: '计算器',
        desc: '基础计算 · 离线可用',
        icon: svgIcon('calc'),
        launch: () => openCalculator(),
      },
      settings: {
        id: 'settings',
        name: '设置',
        desc: '壁纸 / 重置 VFS (IndexedDB)',
        icon: svgIcon('gear'),
        launch: () => openSettings(),
      },
    };

    const DESKTOP_ICONS = [
      { app: 'explorer', label: 'Explorer' },
      { app: 'editor', label: 'Editor' },
      { app: 'browser', label: 'Browser' },
      { app: 'draw', label: 'Draw' },
      { app: 'media', label: 'Media' },
      { app: 'calc', label: 'Calc' },
      { app: 'settings', label: 'Settings' },
    ];

    const renderDesktopIcons = () => {
      desktopEl.innerHTML = '';
      for (const item of DESKTOP_ICONS) {
        const app = APPS[item.app];
        if (!app) continue;
        const el = document.createElement('div');
        el.className = 'icon';
        el.tabIndex = 0;
        el.dataset.app = app.id;
        el.innerHTML = `
          <div class="iconGlyph">${app.icon}</div>
          <div class="iconLabel">${escapeHtml(item.label)}</div>
        `;
        // Double click on desktop
        let clickTimer = null;
        el.addEventListener('click', () => {
          if (isMobile()) {
            app.launch();
            return;
          }
          if (clickTimer) {
            clearTimeout(clickTimer);
            clickTimer = null;
            app.launch();
          } else {
            clickTimer = setTimeout(() => clickTimer = null, 240);
          }
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') app.launch();
        });
        desktopEl.appendChild(el);
      }
    };

    const renderStartMenu = (filter='') => {
      const host = $('#startBody');
      host.innerHTML = '';
      const q = (filter||'').trim().toLowerCase();
      const apps = Object.values(APPS)
        .filter(a => !q || (a.name + ' ' + a.desc + ' ' + a.id).toLowerCase().includes(q));

      for (const app of apps) {
        const card = document.createElement('div');
        card.className = 'appCard';
        card.innerHTML = `
          <div class="winIcon" style="width:34px;height:34px;border-radius:14px">${app.icon}</div>
          <div class="min-w-0">
            <div class="name">${escapeHtml(app.name)}</div>
            <div class="desc">${escapeHtml(app.desc)}</div>
          </div>
        `;
        card.addEventListener('click', () => {
          toggleStart(false);
          app.launch();
        });
        host.appendChild(card);
      }
    };

    const toggleStart = (open) => {
      const shouldOpen = open ?? !startMenu.classList.contains('open');
      startMenu.classList.toggle('open', shouldOpen);
      if (shouldOpen) {
        $('#startSearch').value = '';
        renderStartMenu('');
        setTimeout(() => $('#startSearch').focus(), 0);
      }
    };

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleStart();
    });

    $('#startSearch').addEventListener('input', (e) => {
      const v = e.target.value;
      // if it looks like a path, keep apps list but allow Enter to open explorer
      renderStartMenu(v);
    });

    $('#startSearch').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const v = e.target.value.trim();
        if (v.startsWith('/')) {
          toggleStart(false);
          openExplorer(v);
        }
      }
    });

    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) {
        toggleStart(false);
      }
      if (!e.target.closest('#ctxMenu')) hideContextMenu();
    });

    // Clock
    const tickClock = () => {
      const d = new Date();
      const s = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      $('#clock').textContent = s;
    };
    setInterval(tickClock, 1000);
    tickClock();

    /**********************
     * Context menu
     **********************/

    const ctxMenu = $('#ctxMenu');

    const showContextMenu = (x, y, items=[]) => {
      ctxMenu.innerHTML = '';
      for (const it of items) {
        const row = document.createElement('div');
        row.className = 'ctxItem';
        row.innerHTML = `<div>${escapeHtml(it.label)}</div><div class="hint">${escapeHtml(it.hint||'')}</div>`;
        row.addEventListener('click', async () => {
          hideContextMenu();
          try{ await it.onClick?.(); } catch(e){ toast('操作失败', String(e.message||e), 'danger'); }
        });
        ctxMenu.appendChild(row);
      }

      ctxMenu.style.display = 'block';
      const pad = 12;
      const rect = ctxMenu.getBoundingClientRect();
      const xx = clamp(x, pad, window.innerWidth - rect.width - pad);
      const yy = clamp(y, pad, window.innerHeight - rect.height - pad);
      ctxMenu.style.left = xx + 'px';
      ctxMenu.style.top = yy + 'px';
    };

    const hideContextMenu = () => {
      ctxMenu.style.display = 'none';
    };

    desktopEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: '刷新桌面', hint: 'R', onClick: () => renderDesktopIcons() },
        { label: '新建文件夹', hint: 'Desktop', onClick: () => createFolder(VFS.desktop) },
        { label: '切换全屏', hint: 'F11', onClick: () => toggleFullscreen() },
        { label: '设置', hint: 'Wallpaper', onClick: () => openSettings() },
      ]);
    });

    const toggleFullscreen = async () => {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    };

    /**********************
     * File helpers
     **********************/

    const guessMime = (p) => {
      const ext = (p.split('.').pop()||'').toLowerCase();
      const map = {
        'png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp','svg':'image/svg+xml',
        'txt':'text/plain','md':'text/markdown','js':'text/javascript','html':'text/html','css':'text/css','json':'application/json',
        'mp3':'audio/mpeg','wav':'audio/wav','ogg':'audio/ogg','m4a':'audio/mp4',
        'mp4':'video/mp4','webm':'video/webm','mov':'video/quicktime'
      };
      return map[ext] || 'application/octet-stream';
    };

    const isTextFile = (p) => {
      const ext = (p.split('.').pop()||'').toLowerCase();
      return ['txt','md','js','ts','jsx','tsx','html','css','json','yml','yaml','xml','csv','log'].includes(ext);
    };

    const isZipFile = (p) => (p.toLowerCase().endsWith('.zip'));
    const isAudioFile = (p) => ['mp3','wav','ogg','m4a'].includes((p.split('.').pop()||'').toLowerCase());
    const isVideoFile = (p) => ['mp4','webm','mov'].includes((p.split('.').pop()||'').toLowerCase());
    const isImageFile = (p) => ['png','jpg','jpeg','gif','webp','svg'].includes((p.split('.').pop()||'').toLowerCase());

    const safeJoin = (...parts) => pathMod.normalize(pathMod.join(...parts));

    const listDirDetailed = async (dir) => {
      const names = await pfs.readdir(dir);
      const rows = [];
      for (const name of names) {
        const full = safeJoin(dir, name);
        let st = null;
        try{ st = await pfs.stat(full); } catch(e) { continue; }
        rows.push({
          name,
          path: full,
          isDir: st.isDirectory(),
          size: st.isFile() ? st.size : null,
          mtime: st.mtime ? new Date(st.mtime) : null,
        });
      }
      rows.sort((a,b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
      return rows;
    };

    const createFolder = async (dir) => {
      const base = 'New Folder';
      let name = base;
      let i = 1;
      while (await pfs.exists(safeJoin(dir, name))) { i++; name = `${base} (${i})`; }
      await pfs.mkdir(safeJoin(dir, name));
      toast('已创建文件夹', safeJoin(dir, name), 'ok');
    };

    const deletePath = async (p) => {
      const st = await pfs.stat(p);
      if (st.isFile()) {
        await pfs.unlink(p);
        return;
      }
      // dir: manual recursive
      const children = await pfs.readdir(p);
      for (const c of children) await deletePath(safeJoin(p, c));
      try{ await pfs.rmdir(p); }catch(e){}
    };

    const readAsText = async (p) => {
      const buf = await pfs.readFile(p);
      const dec = new TextDecoder('utf-8');
      return dec.decode(buf);
    };

    const writeText = async (p, txt) => {
      const enc = new TextEncoder();
      await ensureDir(pathMod.dirname(p));
      await pfs.writeFile(p, enc.encode(txt));
    };

    /**********************
     * App: File Explorer
     **********************/

    const clipboard = { mode: null, path: null }; // mode: 'copy' | 'cut'

    const openExplorer = (initialPath) => {
      const startPath = pathMod.normalize(initialPath || VFS.home);

      const w = createWindow({
        appId: 'explorer',
        title: `Explorer — ${startPath}`,
        icon: svgIcon('folder'),
        w: 940,
        h: 560,
        mount: (root, win) => mountExplorer(root, win, startPath)
      });

      return w;
    };

    const mountExplorer = (root, win, startPath) => {
      root.innerHTML = '';
      const shell = document.createElement('div');
      shell.className = 'appShell';
      shell.innerHTML = `
        <div class="appToolbar">
          <button class="btn" data-act="up">${svgIcon('up')} 上级</button>
          <button class="btn" data-act="home">${svgIcon('home')} Home</button>
          <button class="btn" data-act="newFolder">${svgIcon('plus')} 新建文件夹</button>
          <button class="btn" data-act="import">${svgIcon('upload')} 导入</button>
          <button class="btn" data-act="paste">${svgIcon('paste')} 粘贴</button>
          <button class="btn" data-act="refresh">${svgIcon('refresh')} 刷新</button>
          <div class="flex-1"></div>
          <input class="pillInput" data-role="path" spellcheck="false" />
        </div>
        <div class="split">
          <div class="pane" data-role="list"></div>
          <div class="pane" data-role="preview" style="border-left:1px solid rgba(255,255,255,.08); background: rgba(9,10,16,.18)"></div>
        </div>
      `;
      root.appendChild(shell);

      const pathInput = $('[data-role="path"]', shell);
      const listEl = $('[data-role="list"]', shell);
      const prevEl = $('[data-role="preview"]', shell);

      const state = {
        cwd: startPath,
        rows: [],
        selected: null,
      };

      const renderBreadcrumb = (p) => {
        win.title = `Explorer — ${p}`;
        $('.winTitle', win.el).textContent = win.title;
        pathInput.value = p;
      };

      const renderPreview = async (row) => {
        prevEl.innerHTML = '';
        if (!row) {
          prevEl.innerHTML = `<div class="p-3 text-xs text-[rgba(168,161,154,.85)]">选择一个文件或文件夹查看详情。</div>`;
          return;
        }

        const header = document.createElement('div');
        header.className = 'p-3 border-b border-[rgba(255,255,255,.08)]';
        header.innerHTML = `
          <div class="flex items-center gap-2">
            <div class="winIcon" style="width:30px;height:30px;border-radius:14px">${row.isDir ? svgIcon('folder') : svgIcon('file')}</div>
            <div class="min-w-0">
              <div class="text-sm font-semibold truncate">${escapeHtml(row.name)}</div>
              <div class="text-xs text-[rgba(168,161,154,.88)] truncate">${escapeHtml(row.path)}</div>
            </div>
          </div>
        `;
        prevEl.appendChild(header);

        const body = document.createElement('div');
        body.className = 'p-3 text-xs text-[rgba(168,161,154,.88)] space-y-2';
        body.innerHTML = `
          <div class="flex justify-between"><span>类型</span><span class="text-[rgba(233,228,218,.88)]">${row.isDir ? 'Folder' : 'File'}</span></div>
          <div class="flex justify-between"><span>大小</span><span class="text-[rgba(233,228,218,.88)]">${row.isDir ? '-' : fmtBytes(row.size)}</span></div>
          <div class="flex justify-between"><span>修改</span><span class="text-[rgba(233,228,218,.88)]">${row.mtime ? row.mtime.toLocaleString('zh-CN') : '-'}</span></div>
        `;
        prevEl.appendChild(body);

        if (!row.isDir && isImageFile(row.path)) {
          try{
            const buf = await pfs.readFile(row.path);
            const blob = new Blob([buf], {type: guessMime(row.path)});
            const url = URL.createObjectURL(blob);
            const img = document.createElement('img');
            img.src = url;
            img.className = 'mx-3 mb-3 rounded-xl border border-[rgba(255,255,255,.10)]';
            img.style.maxHeight = '240px';
            img.style.objectFit = 'cover';
            prevEl.appendChild(img);
          }catch(e){}
        }

        const actions = document.createElement('div');
        actions.className = 'p-3 pt-0 flex flex-wrap gap-2';
        actions.innerHTML = `
          <button class="btn" data-act="open">${svgIcon('open')} 打开</button>
          <button class="btn" data-act="rename">${svgIcon('edit')} 重命名</button>
          <button class="btn" data-act="copy">${svgIcon('copy')} 复制</button>
          <button class="btn" data-act="cut">${svgIcon('scissors')} 剪切</button>
          <button class="btn danger" data-act="delete">${svgIcon('trash')} 删除</button>
        `;
        prevEl.appendChild(actions);

        actions.addEventListener('click', async (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const act = btn.dataset.act;
          if (act === 'open') return openRow(row);
          if (act === 'rename') return renameRow(row);
          if (act === 'copy') { clipboard.mode='copy'; clipboard.path=row.path; toast('已复制', row.path, 'ok'); return; }
          if (act === 'cut') { clipboard.mode='cut'; clipboard.path=row.path; toast('已剪切', row.path, 'ok'); return; }
          if (act === 'delete') {
            if (!confirm(`确定删除：\n${row.path}\n\n(此操作不可撤销)`)) return;
            await deletePath(row.path);
            toast('已删除', row.path, 'ok');
            await refresh();
          }
        });
      };

      const openRow = async (row) => {
        if (row.isDir) {
          state.cwd = row.path;
          await refresh();
          return;
        }
        // file
        if (isTextFile(row.path)) return openEditor(row.path);
        if (isZipFile(row.path)) return unzipToFolder(row.path, pathMod.dirname(row.path));
        if (isAudioFile(row.path) || isVideoFile(row.path)) return openMedia(row.path);
        if (isImageFile(row.path)) return openPreview(row.path);
        // unknown: open in editor as binary hex? keep simple
        toast('无法打开', '未知文件类型，尝试用编辑器打开。', 'info');
        return openEditor(row.path);
      };

      const renameRow = async (row) => {
        const next = prompt('重命名为：', row.name);
        if (!next || !next.trim()) return;
        const dst = safeJoin(pathMod.dirname(row.path), next.trim());
        if (await pfs.exists(dst)) {
          toast('重命名失败', '目标名称已存在。', 'danger');
          return;
        }
        await pfs.rename(row.path, dst);
        toast('已重命名', `${row.name} → ${next.trim()}`, 'ok');
        await refresh();
      };

      const renderList = () => {
        listEl.innerHTML = '';
        const header = document.createElement('div');
        header.className = 'px-3 pt-3 pb-2 flex items-center justify-between';
        header.innerHTML = `
          <div class="text-xs text-[rgba(168,161,154,.88)]">${escapeHtml(state.cwd)}</div>
          <div class="text-xs text-[rgba(168,161,154,.88)]">${state.rows.length} items</div>
        `;
        listEl.appendChild(header);

        const table = document.createElement('div');
        table.className = 'px-2 pb-3';

        const head = document.createElement('div');
        head.className = 'listRow';
        head.style.opacity = '0.75';
        head.innerHTML = `
          <div></div>
          <div class="meta">名称</div>
          <div class="meta">大小</div>
          <div class="meta">修改</div>
        `;
        table.appendChild(head);

        for (const row of state.rows) {
          const r = document.createElement('div');
          r.className = 'listRow';
          r.dataset.path = row.path;
          r.innerHTML = `
            <div class="winIcon" style="width:24px;height:24px;border-radius:12px">${row.isDir ? svgIcon('folder') : svgIcon('file')}</div>
            <div class="fname">${escapeHtml(row.name)}</div>
            <div class="meta">${row.isDir ? '<span class="tag">DIR</span>' : fmtBytes(row.size)}</div>
            <div class="meta">${row.mtime ? row.mtime.toLocaleDateString('zh-CN') : '-'}</div>
          `;

          const select = async () => {
            state.selected = row;
            $$('.listRow', table).forEach(x => x.classList.toggle('selected', x === r));
            await renderPreview(row);
          };

          r.addEventListener('click', select);

          let clickTimer = null;
          r.addEventListener('dblclick', async () => openRow(row));
          // mobile: use single tap to open
          if (isMobile()) {
            r.addEventListener('click', async () => {
              if (clickTimer) return;
              clickTimer = setTimeout(async () => { clickTimer=null; }, 250);
            });
            r.addEventListener('pointerup', async (e) => {
              if (e.detail === 2) return;
            });
          }

          r.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            select();
            showContextMenu(e.clientX, e.clientY, [
              { label: '打开', hint: 'Enter', onClick: () => openRow(row) },
              { label: '复制', hint: 'Ctrl+C', onClick: () => { clipboard.mode='copy'; clipboard.path=row.path; toast('已复制', row.path, 'ok'); } },
              { label: '剪切', hint: 'Ctrl+X', onClick: () => { clipboard.mode='cut'; clipboard.path=row.path; toast('已剪切', row.path, 'ok'); } },
              { label: '重命名', hint: 'F2', onClick: () => renameRow(row) },
              { label: '删除', hint: 'Del', onClick: async () => { if(confirm(`确定删除：\n${row.path}`)){ await deletePath(row.path); await refresh(); } } },
              ...(isZipFile(row.path) ? [{ label:'解压 ZIP', hint:'JSZip', onClick: () => unzipToFolder(row.path, pathMod.dirname(row.path)) }] : [])
            ]);
          });

          table.appendChild(r);
        }

        listEl.appendChild(table);
      };

      const refresh = async () => {
        try{
          state.cwd = pathMod.normalize(state.cwd);
          if (!await pfs.exists(state.cwd)) {
            toast('路径不存在', state.cwd, 'danger');
            state.cwd = VFS.home;
          }
          renderBreadcrumb(state.cwd);
          state.rows = await listDirDetailed(state.cwd);
          state.selected = null;
          renderList();
          await renderPreview(null);
        } catch (e) {
          toast('Explorer 读取失败', String(e.message||e), 'danger');
        }
      };

      const goUp = async () => {
        if (state.cwd === '/') return;
        state.cwd = pathMod.dirname(state.cwd);
        await refresh();
      };

      const pasteInto = async () => {
        if (!clipboard.path || !clipboard.mode) {
          toast('剪贴板为空', '先复制/剪切一个文件或文件夹。', 'info');
          return;
        }
        const src = clipboard.path;
        const name = pathMod.basename(src);
        const dst = safeJoin(state.cwd, name);
        if (dst === src) return;
        if (await pfs.exists(dst)) {
          toast('粘贴失败', '目标已存在同名项目。', 'danger');
          return;
        }

        const st = await pfs.stat(src);
        if (st.isDirectory()) {
          // recursive copy
          await copyDir(src, dst);
          if (clipboard.mode === 'cut') await deletePath(src);
        } else {
          await pfs.copyFile(src, dst);
          if (clipboard.mode === 'cut') await pfs.unlink(src);
        }

        toast('已粘贴', dst, 'ok');
        clipboard.mode = null; clipboard.path = null;
        await refresh();
      };

      const copyDir = async (src, dst) => {
        await ensureDir(dst);
        const names = await pfs.readdir(src);
        for (const n of names) {
          const sp = safeJoin(src, n);
          const dp = safeJoin(dst, n);
          const st = await pfs.stat(sp);
          if (st.isDirectory()) await copyDir(sp, dp);
          else {
            const buf = await pfs.readFile(sp);
            await pfs.writeFile(dp, buf);
          }
        }
      };

      const importFiles = async () => {
        const picker = $('#filePicker');
        picker.value = '';
        picker.multiple = true;
        picker.accept = '';
        picker.onchange = async () => {
          const files = Array.from(picker.files || []);
          if (!files.length) return;
          for (const f of files) {
            try{
              const ab = await f.arrayBuffer();
              const dst = safeJoin(state.cwd, f.name);
              await pfs.writeFile(dst, new Uint8Array(ab));
            }catch(e){
              toast('导入失败', f.name + ': ' + (e.message||e), 'danger');
            }
          }
          toast('导入完成', `${files.length} 个文件已写入 VFS`, 'ok');
          await refresh();
        };
        picker.click();
      };

      const unzipToFolder = async (zipPath, targetDir) => {
        if (!window.JSZip) {
          toast('JSZip 不可用', '无法解压 ZIP。', 'danger');
          return;
        }
        const baseName = pathMod.basename(zipPath).replace(/\.zip$/i,'');
        let outDir = safeJoin(targetDir, baseName);
        let i = 1;
        while (await pfs.exists(outDir)) { i++; outDir = safeJoin(targetDir, `${baseName} (${i})`); }

        try{
          toast('解压中…', zipPath, 'info', 2200);
          await ensureDir(outDir);
          const buf = await pfs.readFile(zipPath);
          const zip = await JSZip.loadAsync(buf);
          const entries = Object.values(zip.files);
          for (const ent of entries) {
            const rel = ent.name;
            const dest = safeJoin(outDir, rel);
            if (ent.dir) {
              await ensureDir(dest);
            } else {
              await ensureDir(pathMod.dirname(dest));
              const data = await ent.async('uint8array');
              await pfs.writeFile(dest, data);
            }
          }
          toast('解压完成', outDir, 'ok');
          state.cwd = outDir;
          await refresh();
        } catch(e){
          toast('解压失败', String(e.message||e), 'danger');
        }
      };

      shell.addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'up') return goUp();
        if (act === 'home') { state.cwd = VFS.home; return refresh(); }
        if (act === 'newFolder') { await createFolder(state.cwd); return refresh(); }
        if (act === 'import') return importFiles();
        if (act === 'paste') return pasteInto();
        if (act === 'refresh') return refresh();
      });

      pathInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
          state.cwd = pathInput.value.trim() || state.cwd;
          await refresh();
        }
      });

      refresh();
    };

    /**********************
     * App: Text Editor
     **********************/

    const openEditor = (filePath) => {
      const p = pathMod.normalize(filePath);
      const w = createWindow({
        appId: 'editor',
        title: `Editor — ${pathMod.basename(p)}`,
        icon: svgIcon('code'),
        w: 920,
        h: 580,

      const pathEl = $('[data-role="path"]', shell);

      const updateGutter = () => {
        const lines = code.value.split('\n').length;

        gutter.textContent = s;
      };

      const load = async () => {
        try{
          if (!await pfs.exists(state.path)) {
            await writeText(state.path, '');
          }
          // prefer text; but allow binary open too
          let txt = '';
          try {
            txt = await readAsText(state.path);
          } catch(e) {
            const buf = await pfs.readFile(state.path);
            txt = `/* Binary file (${buf.byteLength} bytes) opened as hex preview */\n\n` + toHexPreview(buf);

          code.value = txt;
          state.dirty = false;
          updateGutter();
          toast('已打开', state.path, 'ok');

          toast('打开失败', String(e.message||e), 'danger');

          toast('保存失败', String(e.message||e), 'danger');

        $('.gutter', shell).scrollTop = code.scrollTop;
      });

      // Save on Ctrl/Cmd+S
      code.addEventListener('keydown', (e) => {

          e.preventDefault();
          save();
        }
      });

      load();

    const toHexPreview = (buf) => {
      const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
      const lines = [];
      const max = Math.min(u8.length, 1024);
      for (let i=0;i<max;i+=16) {
        const chunk = u8.slice(i, i+16);
        const hex = Array.from(chunk).map(b => b.toString(16).padStart(2,'0')).join(' ');
        lines.push(hex);
      }
      if (u8.length > max) lines.push('…');
      return lines.join('\n');
    };

      const size = $('[data-role="size"]', shell);
      const bg = $('[data-role="bg"]', shell);
      const pathEl = $('[data-role="path"]', shell);

      const state = {
        savingPath: savePath || safeJoin(VFS.pictures, `drawing-${new Date().toISOString().replace(/[:.]/g,'-')}.png`),
        down: false,
        last: null,
      };
      pathEl.textContent = state.savingPath;

      const ctx = canvas.getContext('2d');

      const resizeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(320, Math.floor(rect.width * dpr));
        const h = Math.max(240, Math.floor(rect.height * dpr));
        // keep drawing by snapshot
        const img = ctx.getImageData(0,0,canvas.width||1,canvas.height||1);
        canvas.width = w;
        canvas.height = h;
        ctx.putImageData(img, 0, 0);
      };

      const fillBg = () => {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = bg.value;
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.restore();
      };

      const getPt = (e) => {
        const r = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        return {
          x: (e.clientX - r.left) * dpr,
          y: (e.clientY - r.top) * dpr,
        };
      };

      const stroke = (a, b) => {
        ctx.strokeStyle = color.value;
        ctx.lineWidth = Number(size.value);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      };

      const pointerDown = (e) => {
        canvas.setPointerCapture(e.pointerId);
        state.down = true;
        state.last = getPt(e);
      };
      const pointerMove = (e) => {
        if (!state.down) return;
        const p = getPt(e);
        stroke(state.last, p);
        state.last = p;
      };
      const pointerUp = () => {
        state.down = false;
        state.last = null;
      };

      canvas.addEventListener('pointerdown', pointerDown);
      canvas.addEventListener('pointermove', pointerMove);
      canvas.addEventListener('pointerup', pointerUp);
      canvas.addEventListener('pointercancel', pointerUp);

      const savePNG = async () => {
        try{
          fillBg();
          const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const ab = await blob.arrayBuffer();
          await ensureDir(pathMod.dirname(state.savingPath));
          await pfs.writeFile(state.savingPath, new Uint8Array(ab));
          toast('已保存 PNG', state.savingPath, 'ok');
        }catch(e){
          toast('保存失败', String(e.message||e), 'danger');
        }
      };

      const clear = () => {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      };

      const newCanvas = () => {
        clear();
        fillBg();
      };

      shell.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'save') savePNG();
        if (act === 'clear') clear();
        if (act === 'new') newCanvas();
      });

      // initial
      setTimeout(() => { resizeCanvas(); newCanvas(); }, 50);
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(canvas);
      win.onClose = () => ro.disconnect();
    };

      const keys = [
        '7','8','9','/',
        '4','5','6','*',
        '1','2','3','-',
        '0','.','(',')',
        'C','⌫','=', '+'
      ];

      const btnFor = (k) => {
        const b = document.createElement('button');

        if (k === 'C') b.classList.add('danger');

        // Very small parser gate: only digits/operators/parentheses/dot/spaces
        if (!/^[0-9+\-*/().\s]+$/.test(s)) throw new Error('包含非法字符');
        // Prevent consecutive operators like **
        // Use Function to avoid access to scope; still not perfectly safe but gated.
        // eslint-disable-next-line no-new-func
        return Function(`"use strict"; return (${s});`)();
      };

        }

        expr.value += k;
