    /* ==========================================================================
       第十部分：全格式归档压缩与解压引擎 (JSZip 时区修正 + 原生 GZIP/TAR + 7z-wasm)
       ========================================================================== */
    const ArchiveEngine = {
      /* 修正 JSZip 将 DOS 本地时间误作 UTC 解析导致的时区偏移 */
      fixJSZipEntryDateToLocalTimestamp(zipDate) {
        if (!(zipDate instanceof Date) || Number.isNaN(zipDate.getTime())) return Date.now();
        return new Date(
          zipDate.getUTCFullYear(),
          zipDate.getUTCMonth(),
          zipDate.getUTCDate(),
          zipDate.getUTCHours(),
          zipDate.getUTCMinutes(),
          zipDate.getUTCSeconds()
        ).getTime();
      },

      /* 压缩写入 JSZip 前，将真实本地时间戳补偿为 JSZip 期望的伪 UTC Date，确保压缩包内 DOS 时间分秒不差 */
      localTimestampToJSZipDate(mtime) {
        const d = new Date(typeof mtime === 'number' ? mtime : Date.now());
        return new Date(Date.UTC(
          d.getFullYear(),
          d.getMonth(),
          d.getDate(),
          d.getHours(),
          d.getMinutes(),
          d.getSeconds()
        ));
      },

      /* 将 VFS 路径列表打包为保留原始修改时间的 .zip Blob */
      async compressPathsToZipBlob(vfsPaths) {
        const JSZip = await CDNLoader.ensureJSZip();
        const zip = new JSZip();

        const addEntryRecursive = async (fullPath, relPrefix) => {
          const st = await window.fs.stat(fullPath);
          const zipDate = this.localTimestampToJSZipDate(st.mtime);
          if (st.isDirectory()) {
            zip.folder(relPrefix);
            const children = await window.fs.readdir(fullPath);
            for (const c of children) {
              await addEntryRecursive(PathUtils.join(fullPath, c), `${relPrefix}/${c}`);
            }
          } else {
            const bytes = await window.fs.readFile(fullPath);
            zip.file(relPrefix, bytes, { date: zipDate });
          }
        };

        for (const p of vfsPaths) {
          const base = PathUtils.basename(p) || 'root';
          await addEntryRecursive(p, base);
        }

        return await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
      },

      async compressPathsToVFS(vfsPaths, targetDir) {
        if (!vfsPaths || vfsPaths.length === 0) return;
        const defaultStem = vfsPaths.length === 1
          ? PathUtils.basename(vfsPaths[0]).replace(/\.[^.]+$/, '') || '归档'
          : '归档合集';
        const outName = await Modal.prompt('创建 ZIP 压缩包', `${defaultStem}.zip`, '请输入压缩包文件名（将完整保留所有文件的原始修改日期）：');
        if (!outName) return;
        IOBusy.show('正在压缩并写入持久化存储...');
        try {
          const blob = await this.compressPathsToZipBlob(vfsPaths);
          const outPath = await getUniqueDestPath(targetDir, outName.endsWith('.zip') ? outName : `${outName}.zip`);
          await window.fs.writeFile(outPath, blob, { mtime: Date.now() });
          Toast.show(`已创建压缩包: ${PathUtils.basename(outPath)}`);
        } catch (err) {
          Toast.show(`压缩失败: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
      },

      /* 浏览器原生零依赖 GZIP 解压 (DecompressionStream) */
      async gunzipNative(uint8Bytes) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('当前浏览器不支持原生 DecompressionStream');
        }
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([uint8Bytes]).stream().pipeThrough(ds);
        const ab = await new Response(stream).arrayBuffer();
        return new Uint8Array(ab);
      },

      /* 浏览器原生零依赖 POSIX TAR 归档解析器（保留 TAR 头部八进制 mtime！） */
      parseTarArchive(tarBytes) {
        const entries = [];
        const decoder = new TextDecoder('utf-8');
        let offset = 0;
        const readStr = (start, len) => {
          let end = start;
          const max = Math.min(tarBytes.length, start + len);
          while (end < max && tarBytes[end] !== 0) end++;
          return decoder.decode(tarBytes.subarray(start, end)).trim();
        };

        while (offset + 512 <= tarBytes.length) {
          let allZero = true;
          for (let i = 0; i < 512; i++) {
            if (tarBytes[offset + i] !== 0) { allZero = false; break; }
          }
          if (allZero) break;

          const name = readStr(offset, 100);
          const sizeOct = readStr(offset + 124, 12);
          const mtimeOct = readStr(offset + 136, 12);
          const typeFlag = tarBytes[offset + 156];
          const prefix = readStr(offset + 345, 155);
          const fullName = (prefix ? `${prefix}/${name}` : name).replace(/^\/+/, '');

          const size = parseInt(sizeOct, 8) || 0;
          const mtimeSec = parseInt(mtimeOct, 8);
          const mtime = mtimeSec ? mtimeSec * 1000 : Date.now();
          const isDir = typeFlag === 53 || fullName.endsWith('/'); // '5' === 53

          const dataStart = offset + 512;
          const fileData = isDir ? new Uint8Array(0) : tarBytes.slice(dataStart, dataStart + size);
          if (fullName && typeFlag !== 120 && typeFlag !== 103) { // skip pax extended headers 'x'/'g'
            entries.push({ path: fullName.replace(/\/$/, ''), isDir, size, mtime, data: fileData });
          }
          offset = dataStart + Math.ceil(size / 512) * 512;
        }
        return entries;
      },

      /* 列出归档包内容以供预览 */
      async inspectArchive(archivePath) {
        const ext = PathUtils.extname(archivePath);
        const bytes = await window.fs.readFile(archivePath);

        if (ext === '.zip') {
          const JSZip = await CDNLoader.ensureJSZip();
          const zip = await JSZip.loadAsync(bytes);
          const list = [];
          for (const [relPath, entry] of Object.entries(zip.files)) {
            list.push({
              path: relPath.replace(/\/$/, ''),
              isDir: entry.dir,
              size: entry._data && typeof entry._data.uncompressedSize === 'number' ? entry._data.uncompressedSize : 0,
              mtime: this.fixJSZipEntryDateToLocalTimestamp(entry.date)
            });
          }
          return list;
        }

        if (ext === '.tar') {
          return this.parseTarArchive(bytes);
        }

        if (ext === '.tar.gz' || ext === '.tgz') {
          const tarBytes = await this.gunzipNative(bytes);
          return this.parseTarArchive(tarBytes);
        }

        if (ext === '.gz') {
          const raw = await this.gunzipNative(bytes);
          const baseName = PathUtils.basename(archivePath).replace(/\.gz$/i, '') || 'extracted.bin';
          const st = await window.fs.stat(archivePath);
          return [{ path: baseName, isDir: false, size: raw.byteLength, mtime: st.mtime, data: raw }];
        }

        // 其他格式（.7z, .xz, .bz2, .rar 等）调用 7z-wasm@1.2.0
        return await this._extractOrListWith7z(archivePath, bytes, false, null);
      },

      /* 解压任意支持格式到目标目录，完整保留各条目修改时间 */
      async extractArchiveToDir(archivePath, destBaseDir) {
        const ext = PathUtils.extname(archivePath);
        IOBusy.show(`正在解压 ${PathUtils.basename(archivePath)}...`);
        try {
          const bytes = await window.fs.readFile(archivePath);
          let extractedCount = 0;

          if (ext === '.zip') {
            const JSZip = await CDNLoader.ensureJSZip();
            const zip = await JSZip.loadAsync(bytes);
            for (const [relPath, entry] of Object.entries(zip.files)) {
              const cleanRel = relPath.replace(/^\/+/, '').replace(/\/$/, '');
              if (!cleanRel) continue;
              const outPath = PathUtils.join(destBaseDir, cleanRel);
              const fixedMtime = this.fixJSZipEntryDateToLocalTimestamp(entry.date);
              if (entry.dir) {
                await window.fs.mkdir(outPath, { mtime: fixedMtime });
              } else {
                const content = await entry.async('uint8array');
                await window.fs.writeFile(outPath, content, { mtime: fixedMtime, ctime: fixedMtime });
                extractedCount++;
              }
            }
          } else if (ext === '.tar' || ext === '.tar.gz' || ext === '.tgz') {
            const tarBytes = ext === '.tar' ? bytes : await this.gunzipNative(bytes);
            const entries = this.parseTarArchive(tarBytes);
            for (const item of entries) {
              const outPath = PathUtils.join(destBaseDir, item.path);
              if (item.isDir) {
                await window.fs.mkdir(outPath, { mtime: item.mtime });
              } else {
                await window.fs.writeFile(outPath, item.data, { mtime: item.mtime, ctime: item.mtime });
                extractedCount++;
              }
            }
          } else if (ext === '.gz') {
            const raw = await this.gunzipNative(bytes);
            const st = await window.fs.stat(archivePath);
            const baseName = PathUtils.basename(archivePath).replace(/\.gz$/i, '') || 'extracted_file';
            const outPath = await getUniqueDestPath(destBaseDir, baseName);
            await window.fs.writeFile(outPath, raw, { mtime: st.mtime, ctime: st.mtime });
            extractedCount = 1;
          } else {
            extractedCount = await this._extractOrListWith7z(archivePath, bytes, true, destBaseDir);
          }

          Toast.show(`解压完成：共释放 ${extractedCount} 个文件至 ${destBaseDir}`);
        } catch (err) {
          Toast.show(`解压失败: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
      },

      async _extractOrListWith7z(archivePath, bytes, writeToVfs, destBaseDir) {
        const SevenZipFactory = await CDNLoader.ensureSevenZip();
        const logs = [];
        const sz = await SevenZipFactory({
          print: (line) => logs.push(line),
          printErr: (line) => logs.push(line)
        });

        const workArchive = '/in_' + PathUtils.basename(archivePath).replace(/[^a-zA-Z0-9._-]/g, '_');
        const outRoot = '/out_extract';
        sz.FS.mkdir(outRoot);
        const stream = sz.FS.open(workArchive, 'w+');
        sz.FS.write(stream, bytes, 0, bytes.length);
        sz.FS.close(stream);

        sz.callMain(['x', workArchive, `-o${outRoot}`, '-y']);

        const collected = [];
        const walkMemFs = (memDir, relPrefix) => {
          const names = sz.FS.readdir(memDir).filter(n => n !== '.' && n !== '..');
          for (const n of names) {
            const fullMem = `${memDir}/${n}`;
            const rel = relPrefix ? `${relPrefix}/${n}` : n;
            const st = sz.FS.stat(fullMem);
            const isDir = sz.FS.isDir(st.mode);
            const mtime = st.mtime instanceof Date ? st.mtime.getTime() : Date.now();
            if (isDir) {
              collected.push({ path: rel, isDir: true, size: 0, mtime });
              walkMemFs(fullMem, rel);
            } else {
              const data = sz.FS.readFile(fullMem);
              collected.push({ path: rel, isDir: false, size: data.byteLength, mtime, data });
            }
          }
        };
        walkMemFs(outRoot, '');

        if (!writeToVfs) return collected;

        let count = 0;
        for (const item of collected) {
          const target = PathUtils.join(destBaseDir, item.path);
          if (item.isDir) {
            await window.fs.mkdir(target, { mtime: item.mtime });
          } else {
            await window.fs.writeFile(target, item.data, { mtime: item.mtime, ctime: item.mtime });
            count++;
          }
        }
        return count;
      }
    };

                  out += `

                      <div class="flex items-center gap-1 py-1 px-1.5 rounded cursor-pointer text-xs ${isActive ? 'bg-[var(--accent-soft)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}"
                           style="padding-left: ${6 + depth * 12}px;" data-tree-nav="${escapeHtml(full)}">
                        <span class="w-3.5 h-3.5 flex items-center justify-center opacity-70" data-tree-toggle="${escapeHtml(full)}">
                          ${isExp ? Icons.chevDown : Icons.chevRight}
                        </span>
                        <span class="w-4 h-4 shrink-0">${FileTypes.getIconSvg(d.name, true, full)}</span>
                        <span class="truncate">${escapeHtml(d.name)}</span>
                      </div>
                      ${isExp ? await buildTreeHtml(full, depth + 1) : ''}
                    </div>
                  `;
                }
                return out;
              };

              const treeHtml = await buildTreeHtml('/', 0);

              sidebarEl.innerHTML = `
                <div>
                  <div class="px-2 mb-1 text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted);">快速访问</div>
                  <div class="flex flex-col gap-0.5">
                    ${quickItems.map(q => `
                      <button class="flex items-center gap-2 px-2 py-1.5 rounded text-xs text-left cursor-pointer ${cwd === q.path ? 'bg-[var(--accent-soft)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}" data-side-nav="${q.path}">
                        <span class="w-4 h-4 shrink-0" style="color: var(--accent);">${q.icon}</span>
                        <span class="truncate">${q.label}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>

                ${SysConfig.data.showDualVolumes ? `
                <div>
                  <div class="px-2 mb-1 text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted);">双存储后端卷</div>
                  <div class="flex flex-col gap-0.5">
                    ${window.fs._core.opfsSupported ? `
                    <button class="flex items-center justify-between px-2 py-1.5 rounded text-xs text-left cursor-pointer ${cwd.startsWith('/storage/opfs') ? 'bg-[var(--accent-soft)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}" data-side-nav="/storage/opfs">
                      <span class="flex items-center gap-2 min-w-0">
                        <span class="w-4 h-4 shrink-0" style="color:var(--accent)">${Icons.drive}</span>
                        <span class="truncate">OPFS 原生卷</span>
                      </span>
                      ${window.fs._core.primaryBackend === 'opfs' ? `<span class="text-[10px] px-1 rounded" style="background:var(--accent-soft);color:var(--accent)">主卷</span>` : ''}
                    </button>` : ''}
                    <button class="flex items-center justify-between px-2 py-1.5 rounded text-xs text-left cursor-pointer ${cwd.startsWith('/storage/idb') ? 'bg-[var(--accent-soft)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}" data-side-nav="/storage/idb">
                      <span class="flex items-center gap-2 min-w-0">
                        <span class="w-4 h-4 shrink-0" style="color:var(--amber)">${Icons.drive}</span>
                        <span class="truncate">IndexedDB 卷</span>
                      </span>
                      ${window.fs._core.primaryBackend === 'idb' ? `<span class="text-[10px] px-1 rounded" style="background:var(--amber-soft);color:var(--amber)">主卷</span>` : ''}
                    </button>
                  </div>
                </div>` : ''}

                <div>
                  <div class="px-2 mb-1 flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted);">
                    <span>本地挂载 (/mnt/local)</span>
                    <button id="side-add-mount" class="hover:text-[var(--accent)] cursor-pointer" title="挂载新本地文件夹">${Icons.plus}</button>
                  </div>
                  <div class="flex flex-col gap-0.5">
                    ${mountedLocals.length === 0 ? `<div class="px-2 py-1 text-[11px]" style="color:var(--text-muted)">暂无挂载目录</div>` : mountedLocals.map(m => `
                      <div class="flex items-center justify-between px-2 py-1 rounded text-xs ${cwd.startsWith(m.path) ? 'bg-[var(--accent-soft)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}">
                        <button class="flex items-center gap-1.5 min-w-0 flex-1 text-left cursor-pointer" data-side-nav="${escapeHtml(m.path)}">
                          <span class="w-4 h-4 shrink-0">${Icons.folderMount}</span>
                          <span class="truncate">${escapeHtml(m.name)}</span>
                        </button>
                        <button class="win-ctl-btn ctl-close !w-5 !h-5 shrink-0" title="卸载此本地文件夹" data-unmount-path="${escapeHtml(m.path)}">${Icons.close}</button>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <div class="px-2 mb-1 text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted);">目录树导航</div>
                  <div class="flex flex-col gap-0.5">${treeHtml}</div>
                </div>
              `;

              sidebarEl.querySelectorAll('[data-side-nav]').forEach(btn => {
                btn.onclick = () => navigateTo(btn.dataset.sideNav);
              });
              sidebarEl.querySelector('#side-add-mount')?.addEventListener('click', () => triggerMountLocalFolder());
              sidebarEl.querySelectorAll('[data-unmount-path]').forEach(btn => {
                btn.onclick = async (e) => {
                  e.stopPropagation();
                  const mp = btn.dataset.unmountPath;
                  await window.fs.unmountLocalDirectory(mp, true);
                  Taskbar.updateMountBadge();
                  Toast.show(`已卸载本地目录: ${mp}`);
                  if (cwd.startsWith(mp)) navigateTo('/Desktop');
                };
              });
              sidebarEl.querySelectorAll('[data-tree-nav]').forEach(row => {
                row.onclick = (e) => {
                  const toggleTarget = e.target.closest('[data-tree-toggle]');
                  const p = row.dataset.treeNav;
                  if (toggleTarget) {
                    e.stopPropagation();
                    if (expandedTreeDirs.has(p)) expandedTreeDirs.delete(p);
                    else expandedTreeDirs.add(p);
                    renderSidebar();
                    return;
                  }
                  expandedTreeDirs.add(p);
                  navigateTo(p);
                };
              });
            }

            // 读取当前目录（或全局递归搜索）并计算精确文件夹大小（统一无分支路径加载与超时视觉反馈）
            async function loadDirectoryEntries() {
              let busyShown = false;
              const busyTimer = setTimeout(() => {
                busyShown = true;
                IOBusy.show(`正在读取目录 ${cwd}...`);
              }, 35);
              try {
                let rawList = [];
                if (searchQuery.trim() && globalSearch) {
                  const q = searchQuery.trim().toLowerCase();
                  const walkSearch = async (dir, depth = 0) => {
                    if (depth > 8) return;
                    let list = [];
                    try { list = await window.fs.readdir(dir, { withDetails: true }); } catch (_) { return; }
                    for (const item of list) {
                      if (dir === '/' && item.name === 'storage') continue;
                      const fp = PathUtils.join(dir, item.name);
                      if (item.name.toLowerCase().includes(q)) {
                        rawList.push({ ...item, fullPath: fp });
                      }
                      if (item.isDirectory()) await walkSearch(fp, depth + 1);
                    }
                  };
                  await walkSearch('/');
                } else {
                  const list = await window.fs.readdir(cwd, { withDetails: true });
                  const q = searchQuery.trim().toLowerCase();
                  rawList = list
                    .filter(it => !q || it.name.toLowerCase().includes(q))
                    .map(it => ({ ...it, fullPath: PathUtils.join(cwd, it.name) }));
                }

                // 精确计算所有子文件夹的实际递归大小
                await Promise.all(rawList.map(async (entry) => {
                  entry.typeLabel = FileTypes.getTypeLabel(entry.name, entry.isDirectory());
                  if (entry.isDirectory()) {
                    entry.actualSize = await window.fs.getDirectorySize(entry.fullPath);
                  } else {
                    entry.actualSize = entry.size || 0;
                  }
                }));

                // 排序逻辑
                rawList.sort((a, b) => {
                  if (a.isDirectory() !== b.isDirectory()) return a.isDirectory() ? -1 : 1;
                  let cmp = 0;
                  if (sortField === 'name') cmp = naturalCompare(a.name, b.name);
                  else if (sortField === 'mtime') cmp = (a.mtime || 0) - (b.mtime || 0);
                  else if (sortField === 'type') cmp = naturalCompare(a.typeLabel, b.typeLabel);
                  else if (sortField === 'size') cmp = (a.actualSize || 0) - (b.actualSize || 0);
                  return sortAsc ? cmp : -cmp;
                });

                currentEntries = rawList;
              } catch (err) {
                Toast.show(`读取目录失败: ${err.message}`, 'error');
                currentEntries = [];
              } finally {
                clearTimeout(busyTimer);
                if (busyShown) IOBusy.hide();
              }
            }

            // 绑定单个文件/目录项的点击、右键、拖拽
            function bindExplorerItemEvents(el, entry) {
              el.dataset.path = entry.fullPath;
              el.dataset.isdir = entry.isDirectory() ? 'true' : 'false';

              el.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.ctrlKey || e.metaKey) {
                  if (selectedPaths.has(entry.fullPath)) selectedPaths.delete(entry.fullPath);
                  else selectedPaths.add(entry.fullPath);
                  syncItemSelectionUI();
                  return;
                }
                if (e.shiftKey && selectedPaths.size > 0) {
                  const last = Array.from(selectedPaths).pop();
                  const idx1 = currentEntries.findIndex(x => x.fullPath === last);
                  const idx2 = currentEntries.findIndex(x => x.fullPath === entry.fullPath);
                  if (idx1 > -1 && idx2 > -1) {
                    const [lo, hi] = [Math.min(idx1, idx2), Math.max(idx1, idx2)];
                    for (let i = lo; i <= hi; i++) selectedPaths.add(currentEntries[i].fullPath);
                    syncItemSelectionUI();
                    return;
                  }
                }
                selectedPaths = new Set([entry.fullPath]);
                syncItemSelectionUI();
                if (SysConfig.data.singleClickOpen) {
                  activateEntry(entry);
                }
              });

              el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (!SysConfig.data.singleClickOpen) {
                  activateEntry(entry);
                }
              });

              el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!selectedPaths.has(entry.fullPath)) {
                  selectedPaths = new Set([entry.fullPath]);
                  syncItemSelectionUI();
                }
                showExplorerItemMenu(e.clientX, e.clientY, entry);
              });

              VFSDragEngine.bindDraggableItem(el, {
                path: entry.fullPath,
                isDir: entry.isDirectory(),
                sourceZone: 'explorer',
                getSelectedPaths: () => Array.from(selectedPaths)
              });
            }

            function activateEntry(entry) {
              if (entry.isDirectory()) navigateTo(entry.fullPath);
              else openVFSPath(entry.fullPath);
            }

            // 渲染主内容区（详细信息左对齐连续列视图 / 图标懒加载缩略图视图 / 分栏视图）
            async function renderMainView() {
              // 清理旧缩略图观察器
              if (thumbObserver) { thumbObserver.disconnect(); thumbObserver = null; }
              thumbUrls.forEach(u => URL.revokeObjectURL(u));
              thumbUrls = [];

              body.querySelectorAll('[data-view-btn]').forEach(btn => {
                btn.classList.toggle('primary', btn.dataset.viewBtn === viewMode);
              });

              if (viewMode === 'details') {
                renderDetailsView();
              } else if (viewMode === 'grid') {
                renderGridView();
              } else {
                await renderColumnsView();
              }
              updateStatusBar();
            }

            /* 1. Windows 资源管理器标准详细信息视图（左对齐连续列，每行只占各列总宽，右侧空白可框选） */
            function renderDetailsView() {
              const headerHtml = `
                <div class="fe-detail-header">
                  ${columnsConfig.map((col, colIdx) => {
                    const isSorted = sortField === col.key;
                    const arrowSvg = isSorted ? (sortAsc ? Icons.chevUp : Icons.chevDown) : '';
                    return `
                      <div class="fe-col-th" draggable="true" data-col-key="${col.key}" data-col-idx="${colIdx}" style="width: ${col.width}px;">
                        <span class="truncate">${escapeHtml(col.label)}</span>
                        <span class="w-3 h-3 flex items-center justify-center opacity-80">${arrowSvg}</span>
                        <div class="fe-col-resizer" data-resize-col="${colIdx}"></div>
                      </div>
                    `;
                  }).join('')}
                </div>
                <div class="fe-detail-body" id="fe-detail-rows"></div>
              `;
              contentHost.innerHTML = headerHtml;

              // 列点击排序、拖拽交换列顺序与拖拽调整列宽
              let draggedColIdx = null;
              contentHost.querySelectorAll('.fe-col-th').forEach(th => {
                th.addEventListener('click', (e) => {
                  if (e.target.closest('.fe-col-resizer')) return;
                  const key = th.dataset.colKey;
                  if (sortField === key) sortAsc = !sortAsc;
                  else { sortField = key; sortAsc = true; }
                  refreshEntriesOnly();
                });

                th.addEventListener('dragstart', (e) => {
                  if (e.target.closest('.fe-col-resizer')) { e.preventDefault(); return; }
                  draggedColIdx = Number(th.dataset.colIdx);
                  e.dataTransfer.effectAllowed = 'move';
                });
                th.addEventListener('dragover', (e) => {
                  if (draggedColIdx === null) return;
                  e.preventDefault();
                  th.classList.add('drag-over-col');
                });
                th.addEventListener('dragleave', () => th.classList.remove('drag-over-col'));
                th.addEventListener('drop', (e) => {
                  e.preventDefault();
                  th.classList.remove('drag-over-col');
                  const targetIdx = Number(th.dataset.colIdx);
                  if (draggedColIdx !== null && draggedColIdx !== targetIdx) {
                    const [moved] = columnsConfig.splice(draggedColIdx, 1);
                    columnsConfig.splice(targetIdx, 0, moved);
                    saveCols();
                    renderDetailsView();
                  }
                  draggedColIdx = null;
                });
              });

              // 列宽拖拽调整（支持鼠标与移动端触摸 Pointer Events）
              contentHost.querySelectorAll('.fe-col-resizer').forEach(resizer => {
                let resizing = false;
                let colIdx = 0;
                let startX = 0;
                let startW = 0;

                resizer.addEventListener('pointerdown', (e) => {
                  e.stopPropagation();
                  e.preventDefault();
                  resizing = true;
                  resizer.classList.add('resizing');
                  resizer.setPointerCapture(e.pointerId);
                  colIdx = Number(resizer.dataset.resizeCol);
                  startX = e.clientX;
                  startW = columnsConfig[colIdx].width;
                });

                resizer.addEventListener('pointermove', (e) => {
                  if (!resizing) return;
                  const newW = Math.max(columnsConfig[colIdx].minWidth, Math.round(startW + (e.clientX - startX)));
                  columnsConfig[colIdx].width = newW;
                  const th = contentHost.querySelector(`.fe-col-th[data-col-idx="${colIdx}"]`);
                  if (th) th.style.width = `${newW}px`;
                  contentHost.querySelectorAll(`.fe-detail-cell[data-cell-col="${colIdx}"]`).forEach(cell => {
                    cell.style.width = `${newW}px`;
                  });
                });

                const finishColResize = () => {
                  if (!resizing) return;
                  resizing = false;
                  resizer.classList.remove('resizing');
                  saveCols();
                };
                resizer.addEventListener('pointerup', finishColResize);
                resizer.addEventListener('pointercancel', finishColResize);
              });

              const rowsContainer = contentHost.querySelector('#fe-detail-rows');
              if (currentEntries.length === 0) {
                rowsContainer.innerHTML = `<div class="py-12 px-4 text-xs pointer-events-none" style="color: var(--text-muted);">此文件夹为空（可直接将电脑本地文件或文件夹拖放到此处导入）</div>`;
                return;
              }

              const frag = document.createDocumentFragment();
              for (const entry of currentEntries) {
                const row = document.createElement('div');
                row.className = 'fe-detail-row fe-selectable-item' + (selectedPaths.has(entry.fullPath) ? ' selected' : '');

                row.innerHTML = columnsConfig.map((col, colIdx) => {
                  let inner = '';
                  if (col.key === 'name') {
                    const dispName = globalSearch && searchQuery.trim() ? entry.fullPath : entry.name;
                    inner = `<span class="w-4 h-4 shrink-0 flex items-center justify-center">${FileTypes.getIconSvg(entry.name, entry.isDirectory(), entry.fullPath)}</span><span class="truncate">${escapeHtml(dispName)}</span>`;
                  } else if (col.key === 'mtime') {
                    inner = `<span class="truncate" style="color:var(--text-secondary)">${formatDateTime(entry.mtime)}</span>`;
                  } else if (col.key === 'type') {
                    inner = `<span class="truncate" style="color:var(--text-secondary)">${escapeHtml(entry.typeLabel)}</span>`;
                  } else if (col.key === 'size') {
                    inner = `<span class="truncate font-mono-code text-xs" style="color:var(--text-secondary)">${formatBytes(entry.actualSize)}</span>`;
                  }
                  return `<div class="fe-detail-cell" data-cell-col="${colIdx}" style="width: ${col.width}px;">${inner}</div>`;
                }).join('');

                bindExplorerItemEvents(row, entry);
                frag.appendChild(row);
              }
              rowsContainer.appendChild(frag);
            }

            /* 2. 图标视图（Section 8.7：图片缩略图仅在此视图按需通过 IntersectionObserver 懒加载） */
            function renderGridView() {
              contentHost.innerHTML = `<div class="fe-grid-body" id="fe-grid-cards"></div>`;
              const grid = contentHost.querySelector('#fe-grid-cards');
              if (currentEntries.length === 0) {
                grid.innerHTML = `<div class="py-12 px-4 text-xs pointer-events-none" style="color: var(--text-muted);">此文件夹为空</div>`;
                return;
              }

              thumbObserver = new IntersectionObserver((obsEntries) => {
                for (const oe of obsEntries) {
                  if (!oe.isIntersecting) continue;
                  const card = oe.target;
                  thumbObserver.unobserve(card);
                  const imgPath = card.dataset.lazyThumb;
                  if (imgPath) {
                    window.fs.readFile(imgPath, { asBlob: true }).then(blob => {
                      const url = URL.createObjectURL(blob);
                      thumbUrls.push(url);
                      const holder = card.querySelector('.fe-thumb-slot');
                      if (holder) {
                        holder.innerHTML = `<img src="${url}" class="w-12 h-12 object-cover rounded border border-white/15" alt="" />`;
                      }
                    }).catch(() => {});
                  }
                }
              }, { root: viewportEl, rootMargin: '80px' });

              const frag = document.createDocumentFragment();
              for (const entry of currentEntries) {
                const card = document.createElement('div');
                card.className = 'fe-grid-card fe-selectable-item' + (selectedPaths.has(entry.fullPath) ? ' selected' : '');
                const isImg = !entry.isDirectory() && FileTypes.getCategory(entry.name, false) === 'image';
                if (isImg) card.dataset.lazyThumb = entry.fullPath;

                card.innerHTML = `
                  <div class="fe-thumb-slot w-12 h-12 flex items-center justify-center">
                    <span class="w-10 h-10 flex">${FileTypes.getIconSvg(entry.name, entry.isDirectory(), entry.fullPath)}</span>
                  </div>
                  <div class="w-full text-center text-xs leading-tight break-all line-clamp-2" title="${escapeHtml(entry.name)}">${escapeHtml(entry.name)}</div>
                  <div class="text-[10px] font-mono-code" style="color: var(--text-muted);">${formatBytes(entry.actualSize)}</div>
                `;

                bindExplorerItemEvents(card, entry);
                frag.appendChild(card);
                if (isImg) thumbObserver.observe(card);
              }
              grid.appendChild(frag);
            }

            /* 3. 分栏视图 (Miller Columns) */
            async function renderColumnsView() {
              const segs = cwd === '/' ? [] : cwd.slice(1).split('/');
              const chain = ['/'];
              let built = '';
              for (const s of segs) {
                built += '/' + s;
                chain.push(built);
              }

              contentHost.innerHTML = `<div class="fe-columns-wrap" id="fe-miller-host"></div>`;
              const host = contentHost.querySelector('#fe-miller-host');

              for (let i = 0; i < chain.length; i++) {
                const colDir = chain[i];
                const nextInChain = chain[i + 1] || null;
                const colEl = document.createElement('div');
                colEl.className = 'fe-miller-col';

                let list = [];
                try {
                  list = await window.fs.readdir(colDir, { withDetails: true });
                  list.sort((a, b) => {
                    if (a.isDirectory() !== b.isDirectory()) return a.isDirectory() ? -1 : 1;
                    return naturalCompare(a.name, b.name);
                  });
                } catch (_) {}

                for (const it of list) {
                  const fp = PathUtils.join(colDir, it.name);
                  const entry = { ...it, fullPath: fp, typeLabel: FileTypes.getTypeLabel(it.name, it.isDirectory()), actualSize: it.size || 0 };
                  const row = document.createElement('div');
                  const isActiveChain = fp === nextInChain || selectedPaths.has(fp);
                  row.className = `fe-selectable-item flex items-center justify-between gap-2 px-2 py-1.5 rounded cursor-pointer text-xs ${isActiveChain ? 'selected bg-[var(--accent-soft)]' : 'hover:bg-[var(--bg-hover)]'}`;
                  row.innerHTML = `
                    <span class="flex items-center gap-2 min-w-0">
                      <span class="w-4 h-4 shrink-0">${FileTypes.getIconSvg(it.name, it.isDirectory(), fp)}</span>
                      <span class="truncate">${escapeHtml(it.name)}</span>
                    </span>
                    ${it.isDirectory() ? `<span class="opacity-50">${Icons.chevRight}</span>` : ''}
                  `;
                  bindExplorerItemEvents(row, entry);
                  colEl.appendChild(row);
                }
                host.appendChild(colEl);
              }
              host.scrollLeft = host.scrollWidth;
            }

            // 右键上下文菜单（列表项 & 视口空白区）
            function showExplorerItemMenu(x, y, entry) {
              const targets = selectedPaths.size > 0 ? Array.from(selectedPaths) : [entry.fullPath];
              const isDir = entry.isDirectory();
              const cat = FileTypes.getCategory(entry.name, isDir);
              const items = [
                { label: isDir ? '打开文件夹' : '打开', icon: Icons.external, action: () => activateEntry(entry) }
              ];

              if (!isDir) {
                if (cat === 'html') {
                  items.push(
                    { label: '在系统浏览器中打开', icon: Icons.browser, action: () => AppRegistry.launch('browser', { filePath: entry.fullPath }) },
                    { label: '编辑源代码 (HTML 编辑器)', icon: Icons.code, action: () => AppRegistry.launch('code', { filePath: entry.fullPath }) }
                  );
                } else if (cat === 'image') {
                  items.push(
                    { label: '使用漫画阅读器打开', icon: Icons.manga, action: () => AppRegistry.launch('manga', { filePath: entry.fullPath }) },
                    { label: '使用图片查看器打开', icon: Icons.image, action: () => AppRegistry.launch('imageviewer', { filePath: entry.fullPath }) },
                    {
                      label: '设为桌面壁纸',
                      icon: Icons.paint,
                      action: () => {
                        SysConfig.update({ wallpaperId: 'custom', customWallpaperPath: entry.fullPath });
                        Toast.show('壁纸已更新');
                      }
                    }
                  );
                }
                items.push(
                  { label: '打开方式 → 代码编辑器', icon: Icons.code, action: () => AppRegistry.launch('code', { filePath: entry.fullPath }) },
                  { label: '以纯文本形式打开 (记事本)', icon: Icons.notepad, action: () => AppRegistry.launch('notepad', { filePath: entry.fullPath }) }
                );
              }

              if (cat === 'archive') {
                items.push({
                  label: '解压到当前文件夹',
                  icon: Icons.archive,
                  action: () => ArchiveEngine.extractArchiveToDir(entry.fullPath, cwd)
                });
              }

              items.push(
                { separator: true },
                { label: '压缩为 .ZIP 归档', icon: Icons.archive, action: () => ArchiveEngine.compressPathsToVFS(targets, cwd) },
                { label: '导出 / 下载到物理设备', icon: Icons.download, action: () => VFSDragEngine.exportToPhysicalDesktop(entry.fullPath) },
                { separator: true },
                { label: '复制', icon: Icons.copy, action: () => VFSClipboard.set('copy', targets) },
                { label: '剪切', icon: Icons.edit, action: () => VFSClipboard.set('cut', targets) },
                {
                  label: '重命名',
                  icon: Icons.edit,
                  action: async () => {
                    const newName = await Modal.prompt('重命名', entry.name);
                    if (!newName || newName === entry.name) return;
                    await window.fs.rename(entry.fullPath, PathUtils.join(PathUtils.dirname(entry.fullPath), newName));
                  }
                },
                {
                  label: `删除 (${targets.length} 项)`,
                  icon: Icons.trash,
                  danger: true,
                  action: () => deleteTargets(targets)
                }
              );

              ContextMenu.show(x, y, items);
            }

            async function deleteTargets(targets) {
              if (!targets.length) return;
              const ok = await Modal.confirm('确认删除', `确定要删除选中的 ${targets.length} 个项目吗？`);
              if (!ok) return;
              IOBusy.show('正在删除...');
              try {
                for (const p of targets) await window.fs.remove(p);
                selectedPaths.clear();
              } catch (err) {
                Toast.show(`删除失败: ${err.message}`, 'error');
              } finally {
                IOBusy.hide();
              }
            }

            // 视口空白处拖放接收与右键菜单
            viewportEl.addEventListener('dragover', (e) => {
              e.preventDefault();
              e.dataTransfer.dropEffect = 'copyMove';
            });
            viewportEl.addEventListener('drop', async (e) => {
              e.preventDefault();
              await VFSDragEngine.handleDropIntoDirectory(e, cwd);
            });
            viewportEl.addEventListener('contextmenu', (e) => {
              if (e.target.closest('.fe-selectable-item')) return;
              e.preventDefault();
              ContextMenu.show(e.clientX, e.clientY, [
                { label: '刷新', icon: Icons.refresh, action: () => refreshAll() },
                { separator: true },
                { label: '新建文件夹', icon: Icons.folder, action: () => body.querySelector('#fe-new-folder').click() },
                { label: '新建文本文件', icon: Icons.notepad, action: () => body.querySelector('#fe-new-file').click() },
                { label: '导入本地文件', icon: Icons.upload, action: () => triggerGlobalFileUpload(cwd) },
                { label: '挂载本地文件夹 (/mnt/local)', icon: Icons.drive, action: () => triggerMountLocalFolder() },
                ...(VFSClipboard.paths.length > 0 ? [{ label: `粘贴 (${VFSClipboard.paths.length} 项)`, icon: Icons.paste, action: () => VFSClipboard.pasteInto(cwd) }] : []),
                { separator: true },
                {
                  label: document.fullscreenElement ? '退出全屏模式' : '全屏模式',
                  icon: Icons.fullscreen,
                  action: () => {
                    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                    else document.documentElement.requestFullscreen().catch(() => {});
                  }
                }
              ]);
            });

            // 顶部与工具栏按钮事件绑定
            body.querySelector('#fe-back').onclick = () => {
              if (historyIdx > 0) { historyIdx--; navigateTo(history[historyIdx], false); }
            };
            body.querySelector('#fe-fwd').onclick = () => {
              if (historyIdx < history.length - 1) { historyIdx++; navigateTo(history[historyIdx], false); }
            };
            body.querySelector('#fe-up').onclick = () => {
              if (cwd !== '/') navigateTo(PathUtils.dirname(cwd));
            };
            body.querySelector('#fe-reload').onclick = () => refreshAll();

            const searchInp = body.querySelector('#fe-search-input');
            let searchTimer = null;
            searchInp.oninput = () => {
              searchQuery = searchInp.value;
              clearTimeout(searchTimer);
              searchTimer = setTimeout(() => refreshEntriesOnly(), 180);
            };
            const globalBtn = body.querySelector('#fe-global-toggle');
            globalBtn.onclick = () => {
              globalSearch = !globalSearch;
              globalBtn.textContent = globalSearch ? '全局搜索' : '当前目录';
              globalBtn.classList.toggle('primary', globalSearch);
              if (searchQuery.trim()) refreshEntriesOnly();
            };

            body.querySelector('#fe-new-folder').onclick = async () => {
              const name = await Modal.prompt('新建文件夹', '新建文件夹');
              if (!name) return;
              const p = await getUniqueDestPath(cwd, name);
              await window.fs.mkdir(p);
            };
            body.querySelector('#fe-new-file').onclick = async () => {
              const name = await Modal.prompt('新建文件', '未命名文档.txt', '支持任意扩展名（如 .txt / .html / .csv / .md / .js）：');
              if (!name) return;
              const p = await getUniqueDestPath(cwd, name);
              await window.fs.writeFile(p, '');
            };
            body.querySelector('#fe-import').onclick = () => triggerGlobalFileUpload(cwd);
            body.querySelector('#fe-mount-local').onclick = () => triggerMountLocalFolder();
            body.querySelector('#fe-paste').onclick = () => VFSClipboard.pasteInto(cwd);
            body.querySelector('#fe-zip').onclick = () => {
              if (selectedPaths.size === 0) { Toast.show('请先框选或点击选择要压缩的文件', 'warn'); return; }
              ArchiveEngine.compressPathsToVFS(Array.from(selectedPaths), cwd);
            };
            body.querySelector('#fe-export').onclick = () => {
              if (selectedPaths.size === 0) { Toast.show('请先选择要导出下载的文件或文件夹', 'warn'); return; }
              const first = Array.from(selectedPaths)[0];
              VFSDragEngine.exportToPhysicalDesktop(first);
            };
            body.querySelector('#fe-delete').onclick = () => {
              if (selectedPaths.size === 0) { Toast.show('请先选择要删除的项目', 'warn'); return; }
              deleteTargets(Array.from(selectedPaths));
            };

            const touchModeBtn = body.querySelector('#fe-touch-mode-btn');
            touchModeBtn.onclick = () => {
              mobileTouchScrollMode = !mobileTouchScrollMode;
              touchModeBtn.textContent = mobileTouchScrollMode ? '触控：滚动' : '触控：框选';
              touchModeBtn.classList.toggle('primary', mobileTouchScrollMode);
            };

            body.querySelectorAll('[data-view-btn]').forEach(btn => {
              btn.onclick = () => {
                viewMode = btn.dataset.viewBtn;
                localStorage.setItem('guishu_fe_view', viewMode);
                renderMainView();
              };
            });

            async function refreshEntriesOnly() {
              await loadDirectoryEntries();
              await renderMainView();
            }

            async function refreshAll() {
              renderBreadcrumbs();
              await Promise.all([renderSidebar(), loadDirectoryEntries()]);
              await renderMainView();
            }

            unsubFs = window.fs.onChange(() => {
              refreshAll();
            });

            refreshAll();
          }
        });
      }
    });

    /* ==========================================================================
       第十二部分：记事本 (Notepad) — 撤销/恢复、字号调节、防丢失自动保存、全类型纯文本兜底
       ========================================================================== */
    AppRegistry.register({
      id: 'notepad',
      name: '记事本',
      desc: '轻量纯文本编辑器，支持撤销恢复、字号调节与自动持久化保存',
      icon: Icons.notepad,
      color: '#98a9b9',
      launch({ filePath = '' } = {}) {
        let currentPath = filePath ? PathUtils.normalize(filePath) : '';
        let fontSize = Number(localStorage.getItem('guishu_notepad_fs')) || 14;
        let autoSave = localStorage.getItem('guishu_notepad_autosave') !== '0';
        const draftKey = () => `guishu_notepad_draft:${currentPath || '__untitled__'}`;

        let undoStack = [''];
        let undoPtr = 0;
        let autoSaveTimer = null;

        WM.createWindow({
          appId: 'notepad',
          title: currentPath ? `记事本 — ${PathUtils.basename(currentPath)}` : '记事本 — 未命名草稿',
          iconSvg: Icons.notepad,
          width: 720,
          height: 500,
          onClose: () => {
            clearTimeout(autoSaveTimer);
          },
          onMount: async (body, winRec) => {
            body.innerHTML = `
              <div class="px-2.5 py-1.5 flex flex-wrap items-center gap-1.5" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline);">
                <button class="ui-btn !h-7" id="np-save">${Icons.save}<span>保存</span></button>
                <button class="ui-btn !h-7" id="np-saveas">${Icons.folder}<span>另存为</span></button>
                <button class="ui-btn !h-7" id="np-undo">${Icons.undo}<span>撤销</span></button>
                <button class="ui-btn !h-7" id="np-redo">${Icons.redo}<span>恢复</span></button>
                <div class="flex items-center gap-1 ml-1">
                  <button class="ui-btn !h-7 !px-2" id="np-fs-dec">字号 -</button>
                  <span id="np-fs-label" class="text-xs font-mono-code px-1">${fontSize}px</span>
                  <button class="ui-btn !h-7 !px-2" id="np-fs-inc">字号 +</button>
                </div>
                <label class="flex items-center gap-1.5 text-xs ml-auto cursor-pointer select-none">
                  <input type="checkbox" id="np-autosave-chk" ${autoSave ? 'checked' : ''} />
                  <span>自动保存</span>
                </label>
              </div>
              <textarea id="np-textarea" class="flex-1 w-full p-3.5 resize-none outline-none font-mono-code leading-relaxed"
                style="background: var(--bg-surface-solid); color: var(--text-primary); font-size: ${fontSize}px;"
                spellcheck="false" placeholder="在此输入文本内容...（已开启实时防丢失自动保存）"></textarea>
              <footer class="h-6 px-3 flex items-center justify-between text-[11px]" style="background: var(--bg-panel); border-top: 1px solid var(--border-hairline); color: var(--text-secondary);">
                <span id="np-save-state">已就绪</span>
                <span id="np-stats" class="font-mono-code">0 行 · 0 字符 · UTF-8</span>
              </footer>
            `;

            const ta = body.querySelector('#np-textarea');
            const stateEl = body.querySelector('#np-save-state');
            const statsEl = body.querySelector('#np-stats');
            const fsLabel = body.querySelector('#np-fs-label');

            // 初始载入文件或恢复未命名自动保存草稿
            if (currentPath) {
              try {
                const rawBytes = await window.fs.readFile(currentPath);
                const text = new TextDecoder('utf-8', { fatal: false }).decode(rawBytes);
                ta.value = text;
                stateEl.textContent = `已加载: ${currentPath}`;
              } catch (err) {
                Toast.show(`读取文件失败: ${err.message}`, 'error');
              }
            } else {
              const savedDraft = localStorage.getItem(draftKey());
              if (savedDraft) {
                ta.value = savedDraft;
                stateEl.textContent = '已恢复上次未关闭的自动保存草稿';
              }
            }

            undoStack = [ta.value];
            undoPtr = 0;

            const updateStats = () => {
              const val = ta.value;
              const lines = val.split('\n').length;
              statsEl.textContent = `${lines} 行 · ${val.length} 字符 · UTF-8`;
            };
            updateStats();

            const pushHistory = (val) => {
              if (undoStack[undoPtr] === val) return;
              undoStack = undoStack.slice(0, undoPtr + 1);
              undoStack.push(val);
              if (undoStack.length > 120) undoStack.shift();
              undoPtr = undoStack.length - 1;
            };

            const saveToVfs = async (forcePrompt = false) => {
              let target = currentPath;
              if (!target || forcePrompt) {
                const def = target || '/Desktop/未命名笔记.txt';
                const inputPath = await Modal.prompt('保存文本文件到虚拟文件系统', def, '请输入保存完整路径：');
                if (!inputPath) return;
                target = PathUtils.normalize(inputPath.startsWith('/') ? inputPath : PathUtils.join('/Desktop', inputPath));
              }
              try {
                await window.fs.writeFile(target, ta.value);
                currentPath = target;
                localStorage.removeItem('guishu_notepad_draft:__untitled__');
                winRec.setTitle(`记事本 — ${PathUtils.basename(currentPath)}`);
                stateEl.textContent = `已保存至 ${currentPath} (${new Date().toLocaleTimeString()})`;
              } catch (err) {
                Toast.show(`保存失败: ${err.message}`, 'error');
              }
            };

            ta.addEventListener('input', () => {
              updateStats();
              pushHistory(ta.value);
              stateEl.textContent = '正在编辑...';
              // 始终同步写入草稿缓存确保刷新绝不丢字
              try { localStorage.setItem(draftKey(), ta.value); } catch (_) {}

              if (autoSave) {
                clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(async () => {
                  if (currentPath) {
                    try {
                      await window.fs.writeFile(currentPath, ta.value);
                      stateEl.textContent = `已自动保存至 ${currentPath}`;
                    } catch (_) {}
                  } else {
                    stateEl.textContent = '草稿已自动备份';
                  }
                }, 480);
              }
            });

            ta.addEventListener('keydown', (e) => {
              if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveToVfs(false);
              }
            });

            body.querySelector('#np-save').onclick = () => saveToVfs(false);
            body.querySelector('#np-saveas').onclick = () => saveToVfs(true);
            body.querySelector('#np-undo').onclick = () => {
              if (undoPtr > 0) {
                undoPtr--;
                ta.value = undoStack[undoPtr];
                updateStats();
                ta.dispatchEvent(new Event('input'));
              }
            };
            body.querySelector('#np-redo').onclick = () => {
              if (undoPtr < undoStack.length - 1) {
                undoPtr++;
                ta.value = undoStack[undoPtr];
                updateStats();
                ta.dispatchEvent(new Event('input'));
              }
            };

            const applyFontSize = (nextFs) => {
              fontSize = Math.max(11, Math.min(30, nextFs));
              ta.style.fontSize = `${fontSize}px`;
              fsLabel.textContent = `${fontSize}px`;
              localStorage.setItem('guishu_notepad_fs', String(fontSize));
            };
            body.querySelector('#np-fs-dec').onclick = () => applyFontSize(fontSize - 1);
            body.querySelector('#np-fs-inc').onclick = () => applyFontSize(fontSize + 1);
            body.querySelector('#np-autosave-chk').onchange = (e) => {
              autoSave = e.target.checked;
              localStorage.setItem('guishu_notepad_autosave', autoSave ? '1' : '0');
            };
          }
        });
      }
    });

    /* ==========================================================================
       第十三部分：结构化表格 (Spreadsheet — CSV / TSV 双视图编辑器)
       支持：表格视图（按分隔符解析为可滚动、可直接编辑单元格的数据表） <-> 文本视图（原始文本编辑）
       ========================================================================== */
    const DSVParser = {
      parse(text, delimiter = ',') {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        const src = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        for (let i = 0; i < src.length; i++) {
          const ch = src[i];
          if (inQuotes) {
            if (ch === '"') {
              if (src[i + 1] === '"') { field += '"'; i++; }
              else inQuotes = false;
            } else {
              field += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === delimiter) {
              row.push(field);
              field = '';
            } else if (ch === '\n') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            } else {
              field += ch;
            }
          }
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        if (rows.length === 0) return [['列 A', '列 B', '列 C'], ['', '', '']];
        const maxCols = Math.max(1, ...rows.map(r => r.length));
        return rows.map(r => {
          const copy = [...r];
          while (copy.length < maxCols) copy.push('');
          return copy;
        });
      },

      stringify(matrix, delimiter = ',') {
        return matrix.map(row =>
          row.map(cell => {
            const s = String(cell ?? '');
            if (s.includes('"') || s.includes('\n') || s.includes(delimiter)) {
              return `"${s.replace(/"/g, '""')}"`;
            }
            return s;
          }).join(delimiter)
        ).join('\n');
      }
    };

    AppRegistry.register({
      id: 'spreadsheet',
      name: '结构化表格',
      desc: 'CSV / TSV 结构化数据处理器，支持表格视图与原始文本双视图同步编辑',
      icon: Icons.table,
      color: '#52b788',
      launch({ filePath = '' } = {}) {
        let currentPath = filePath ? PathUtils.normalize(filePath) : '';
        let delimiter = PathUtils.extname(currentPath) === '.tsv' ? '\t' : ',';
        let mode = 'table'; // 'table' | 'text'
        let rawText = '项目名称,所属模块,响应耗时(ms),状态\nOPFS存储内核,文件系统,1.2,稳定运行\nIndexedDB事务卷,文件系统,2.8,双活就绪\nAero贴靠引擎,窗口管理器,0.4,已启用';
        let matrix = DSVParser.parse(rawText, delimiter);

        WM.createWindow({
          appId: 'spreadsheet',
          title: currentPath ? `结构化表格 — ${PathUtils.basename(currentPath)}` : '结构化表格 — 新建数据表.csv',
          iconSvg: Icons.table,
          width: 840,
          height: 540,
          onMount: async (body, winRec) => {
            if (currentPath) {
              try {
                rawText = await window.fs.readFile(currentPath, 'utf8');
                delimiter = PathUtils.extname(currentPath) === '.tsv' ? '\t' : ',';
                matrix = DSVParser.parse(rawText, delimiter);
              } catch (err) {
                Toast.show(`读取表格文件失败: ${err.message}`, 'error');
              }
            }

            body.innerHTML = `
              <div class="px-2.5 py-1.5 flex flex-wrap items-center gap-1.5" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline);">
                <div class="flex items-center gap-1 p-0.5 rounded" style="background: var(--bg-input); border: 1px solid var(--border-hairline);">
                  <button class="ui-btn !h-6 !border-0 primary" id="ss-mode-table">${Icons.table}<span>表格视图</span></button>
                  <button class="ui-btn !h-6 !border-0" id="ss-mode-text">${Icons.notepad}<span>文本视图</span></button>
                </div>
                <select id="ss-delim-sel" class="ui-select !h-7 text-xs">
                  <option value="," ${delimiter === ',' ? 'selected' : ''}>CSV 逗号分隔 (,)</option>
                  <option value="tab" ${delimiter === '\t' ? 'selected' : ''}>TSV 制表符分隔 (Tab)</option>
                </select>
                <button class="ui-btn !h-7" id="ss-add-row">${Icons.plus}<span>新增行</span></button>
                <button class="ui-btn !h-7" id="ss-add-col">${Icons.plus}<span>新增列</span></button>
                <button class="ui-btn primary !h-7 ml-auto" id="ss-save">${Icons.save}<span>保存到 VFS</span></button>
                <button class="ui-btn !h-7" id="ss-export">${Icons.download}<span>导出下载</span></button>
              </div>
              <div id="ss-stage" class="flex-1 overflow-auto"></div>
              <footer class="h-6 px-3 flex items-center justify-between text-[11px]" style="background: var(--bg-panel); border-top: 1px solid var(--border-hairline); color: var(--text-secondary);">
                <span id="ss-info"></span>
                <span class="font-mono-code">双视图实时双向解析</span>
              </footer>
            `;

            const stage = body.querySelector('#ss-stage');
            const infoEl = body.querySelector('#ss-info');
            const btnTable = body.querySelector('#ss-mode-table');
            const btnText = body.querySelector('#ss-mode-text');

            const renderStage = () => {
              btnTable.classList.toggle('primary', mode === 'table');
              btnText.classList.toggle('primary', mode === 'text');
              const rows = matrix.length;
              const cols = matrix[0] ? matrix[0].length : 0;
              infoEl.textContent = `${currentPath || '未保存表格'} · ${rows} 行 × ${cols} 列 · 分隔符: ${delimiter === '\t' ? 'TSV (Tab)' : 'CSV (,)'}`;

              if (mode === 'table') {
                const colHeaders = Array.from({ length: cols }, (_, idx) => {
                  let label = '';
                  let n = idx;
                  while (n >= 0) {
                    label = String.fromCharCode((n % 26) + 65) + label;
                    n = Math.floor(n / 26) - 1;
                  }
                  return label;
                });

                stage.innerHTML = `
                  <div class="min-w-max">
                    <table class="border-collapse text-xs">
                      <thead>
                        <tr style="background: var(--bg-panel); position: sticky; top: 0; z-index: 4;">
                          <th class="w-11 px-2 py-1.5 text-center font-mono-code" style="border: 1px solid var(--border-hairline); color: var(--text-muted);">#</th>
                          ${colHeaders.map(ch => `<th class="min-w-[140px] px-2.5 py-1.5 text-left font-mono-code" style="border: 1px solid var(--border-hairline); color: var(--accent);">${ch}</th>`).join('')}
                        </tr>
                      </thead>
                      <tbody>
                        ${matrix.map((r, rIdx) => `
                          <tr style="${rIdx === 0 ? 'background: rgba(46,196,182,0.06); font-weight: 600;' : ''}">
                            <td class="px-2 py-1 text-center font-mono-code" style="border: 1px solid var(--border-hairline); background: var(--bg-panel); color: var(--text-muted);">${rIdx + 1}</td>
                            ${r.map((val, cIdx) => `
                              <td class="p-0" style="border: 1px solid var(--border-hairline);">
                                <input type="text" data-r="${rIdx}" data-c="${cIdx}" value="${escapeHtml(val)}"
                                  class="w-full min-w-[140px] px-2.5 py-1.5 bg-transparent outline-none focus:bg-[var(--accent-soft)]" />
                              </td>
                            `).join('')}
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                `;

                stage.querySelectorAll('input[data-r]').forEach(inp => {
                  inp.addEventListener('input', () => {
                    const r = Number(inp.dataset.r);
                    const c = Number(inp.dataset.c);
                    matrix[r][c] = inp.value;
                    rawText = DSVParser.stringify(matrix, delimiter);
                  });
                });
              } else {
                rawText = DSVParser.stringify(matrix, delimiter);
                stage.innerHTML = `
                  <textarea id="ss-raw-ta" class="w-full h-full p-3.5 resize-none outline-none font-mono-code text-xs leading-relaxed"
                    style="background: var(--bg-surface-solid); color: var(--text-primary);" spellcheck="false"></textarea>
                `;
                const ta = stage.querySelector('#ss-raw-ta');
                ta.value = rawText;
                ta.addEventListener('input', () => {
                  rawText = ta.value;
                  matrix = DSVParser.parse(rawText, delimiter);
                });
              }
            };

            btnTable.onclick = () => {
              if (mode === 'text') matrix = DSVParser.parse(rawText, delimiter);
              mode = 'table';
              renderStage();
            };
            btnText.onclick = () => {
              if (mode === 'table') rawText = DSVParser.stringify(matrix, delimiter);
              mode = 'text';
              renderStage();
            };

            body.querySelector('#ss-delim-sel').onchange = (e) => {
              delimiter = e.target.value === 'tab' ? '\t' : ',';
              if (mode === 'text') matrix = DSVParser.parse(rawText, delimiter);
              else rawText = DSVParser.stringify(matrix, delimiter);

    /* ==========================================================================
       第十四部分：专业代码与 HTML 编辑器 (HTML Editor — CodeMirror 5.65 内核)
       逐项满足 Section 4.3 全部技术细节：
       1. CodeMirror 5.65.16 内核（行号、自动换行、活动行高亮、默认 material-darker 主题）

       5. 查找与替换工具栏
       6. 撤销 / 重做 / 复制全部 / 清空 / 在新窗口打开 / 在系统浏览器打开

       9. 可拖拽分割条 + 分屏方向（左右 / 上下）+ 视图切换（分屏 / 只看代码 / 只看预览）
       10. 输入模式开关（模式: 自动 / 电脑 / 手机 contenteditable + 手机模式系统全选自动补全全文！）
       11. 所有工具栏按钮均具备「图标 + 中文文字说明」，关闭窗口彻底销毁实例防内存泄漏
       ========================================================================== */
    const CodeFormatter = {
      format(code, mode) {
        const src = String(code ?? '');
        if (!src.trim()) return src;

        if (mode === 'application/json') {
          try {
            return JSON.stringify(JSON.parse(src), null, 2);
          } catch (_) {
            return src;
          }
        }

        if (mode === 'htmlmixed' || mode === 'xml') {
          return this.formatMarkup(src);
        }

        if (mode === 'css' || mode === 'javascript') {
          return this.formatBraces(src);
        }

        // Markdown 规范化多余空行
        return src.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n');
      },

      formatMarkup(html) {
        const voidTags = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
        const tokens = html
          .replace(/>\s+</g, '>\n<')
          .split('\n')
          .map(l => l.trim())
          .filter(Boolean);
        let indent = 0;
        const out = [];
        for (const line of tokens) {
          const isClosing = /^<\//.test(line);
          const tagMatch = line.match(/^<([a-zA-Z0-9:-]+)/);
          const tagName = tagMatch ? tagMatch[1].toLowerCase() : '';
          const isSelfClosing = /\/>$/.test(line) || /^<!/.test(line) || /^<\?/.test(line) || voidTags.has(tagName);
          const hasInlineClose = new RegExp(`</${tagName}>$`, 'i').test(line);

          if (isClosing) indent = Math.max(0, indent - 1);
          out.push('  '.repeat(indent) + line);
          if (!isClosing && !isSelfClosing && !hasInlineClose && tagName) {
            indent++;
          }
        }
        return out.join('\n');
      },

      formatBraces(code) {
        let indent = 0;
        const lines = code
          .replace(/\{\s*/g, ' {\n')
          .replace(/;\s*/g, ';\n')
          .replace(/\}\s*/g, '\n}\n')
          .split('\n');
        const out = [];
        for (const raw of lines) {
          const line = raw.trim();
          if (!line) continue;
          if (line.startsWith('}') || line.startsWith(']')) indent = Math.max(0, indent - 1);
          out.push('  '.repeat(indent) + line);
          if (line.endsWith('{') || line.endsWith('[')) indent++;
        }
        return out.join('\n');
      }
    };

    const LANG_MODES = [
      { mode: 'htmlmixed', label: 'HTML', ext: '.html' },
      { mode: 'css', label: 'CSS', ext: '.css' },

      { mode: 'application/json', label: 'JSON', ext: '.json' },
      { mode: 'markdown', label: 'Markdown', ext: '.md' },
      { mode: 'xml', label: 'XML / SVG', ext: '.svg' }
    ];

    function detectCodeModeByFilename(filename) {
      const ext = PathUtils.extname(filename);
      if (ext === '.html' || ext === '.htm') return 'htmlmixed';
      if (ext === '.css') return 'css';
      if (ext === '.js' || ext === '.mjs') return 'javascript';
      if (ext === '.json') return 'application/json';
      if (ext === '.md' || ext === '.markdown') return 'markdown';
      if (ext === '.xml' || ext === '.svg') return 'xml';
      return 'htmlmixed';
    }

    function renderSimpleMarkdownToHtml(md) {
      let h = escapeHtml(md);
      h = h.replace(/^### (.*)$/gm, '<h3>$1</h3>');
      h = h.replace(/^## (.*)$/gm, '<h2>$1</h2>');
      h = h.replace(/^# (.*)$/gm, '<h1>$1</h1>');
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/^- (.*)$/gm, '<li>$1</li>');
      h = h.replace(/\n\n/g, '</p><p>');
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
        body{background:#0e1318;color:#e7eef4;font-family:'Noto Sans SC',sans-serif;padding:24px;line-height:1.75;max-width:760px;margin:0 auto;}

        li{margin:4px 0;}
      </style></head><body><p>${h}</p></body></html>`;
    }
