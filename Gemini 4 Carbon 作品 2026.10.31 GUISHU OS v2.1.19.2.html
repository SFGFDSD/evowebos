            <div class="w-full max-w-[440px] overflow-hidden shadow-2xl" style="background: var(--bg-elevated-solid); border: 1px solid var(--border-strong); border-radius: var(--win-radius); animation: popUp 0.16s ease;">
              <div class="px-4 py-3 flex items-center justify-between" style="border-bottom: 1px solid var(--border-hairline);">
                <div class="font-semibold text-sm">${title}</div>
                <button class="win-ctl-btn ctl-close" data-modal-close>${Icons.close}</button>
              </div>
              <div class="p-4 text-xs leading-relaxed" id="modal-dynamic-body">${bodyHtml}</div>
              ${hideFooter ? '' : `
              <div class="px-4 py-2.5 flex items-center justify-end gap-2" style="border-top: 1px solid var(--border-hairline); background: var(--bg-subtle);">
                ${cancelText ? `<button class="ui-btn" data-modal-cancel>${cancelText}</button>` : ''}
                <button class="ui-btn primary" data-modal-ok>${confirmText}</button>
              </div>`}
            </div>
          `;
          host.classList.remove('hidden');
          host.classList.add('flex');

          const close = (val) => {
            host.classList.add('hidden');
            host.classList.remove('flex');
            host.innerHTML = '';
            resolve(val);
          };

          const bodyEl = host.querySelector('#modal-dynamic-body');
          let getResult = () => true;
          if (typeof onMount === 'function') {
            const customGetter = onMount(bodyEl, close);
            if (typeof customGetter === 'function') getResult = customGetter;
          }

          host.querySelector('[data-modal-close]')?.addEventListener('click', () => close(null));
          host.querySelector('[data-modal-cancel]')?.addEventListener('click', () => close(null));
          host.querySelector('[data-modal-ok]')?.addEventListener('click', () => close(getResult()));
        });
      },

      prompt(title, defaultValue = '', label = '请输入名称：') {
        return this.show({
          title,
          bodyHtml: `
            <label class="block mb-2" style="color: var(--text-secondary);">${escapeHtml(label)}</label>
            <input id="modal-prompt-input" type="text" class="ui-input w-full" value="${escapeHtml(defaultValue)}" />
          `,
          onMount: (body, close) => {
            const inp = body.querySelector('#modal-prompt-input');
            setTimeout(() => {
              inp.focus();
              const dot = defaultValue.lastIndexOf('.');
              if (dot > 0) inp.setSelectionRange(0, dot);
              else inp.select();
            }, 20);
            inp.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') close(inp.value.trim());
              if (e.key === 'Escape') close(null);
            });
            return () => inp.value.trim();
          }
        });
      },

      confirm(title, message, confirmText = '确认执行') {
        return this.show({
          title,
          bodyHtml: `<p class="text-xs leading-relaxed" style="color: var(--text-primary);">${escapeHtml(message)}</p>`,
          confirmText
        });
      }
    };

    const ContextMenu = {
      show(clientX, clientY, items) {
        const menu = document.getElementById('context-menu');
        menu.innerHTML = '';
        for (const item of items) {
          if (item.separator) {
            const sep = document.createElement('div');
            sep.className = 'ctx-sep';
            menu.appendChild(sep);
            continue;
          }
          const row = document.createElement('div');
          row.className = 'ctx-item' + (item.danger ? ' danger' : '');
          row.innerHTML = `
            <span class="flex items-center gap-2.5">
              <span class="w-4 h-4 flex items-center justify-center opacity-85">${item.icon || ''}</span>
              <span>${escapeHtml(item.label)}</span>
            </span>
            ${item.shortcut ? `<span class="text-[11px] opacity-55 font-mono-code">${escapeHtml(item.shortcut)}</span>` : ''}
          `;
          row.addEventListener('click', (e) => {
            e.stopPropagation();
            this.hide();
            if (typeof item.action === 'function') item.action();
          });
          menu.appendChild(row);
        }
        menu.style.display = 'block';
        const rect = menu.getBoundingClientRect();
        const maxX = window.innerWidth - rect.width - 8;
        const maxY = window.innerHeight - rect.height - 8;
        menu.style.left = `${Math.max(6, Math.min(clientX, maxX))}px`;
        menu.style.top = `${Math.max(6, Math.min(clientY, maxY))}px`;
      },
      hide() {
        const menu = document.getElementById('context-menu');
        if (menu) menu.style.display = 'none';
      }
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatBytes(bytes) {
      const b = Number(bytes) || 0;
      if (b === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(units.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
      return (i === 0 ? b : (b / Math.pow(1024, i)).toFixed(i >= 2 ? 2 : 1)) + ' ' + units[i];
    }

    function formatDateTime(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '-';
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      let hh = d.getHours();
      const min = String(d.getMinutes()).padStart(2, '0');
      if (SysConfig.data.clock12Hour) {
        const period = hh < 12 ? '上午' : '下午';
        hh = hh % 12 || 12;
        return `${yyyy}/${mm}/${dd} ${period}${String(hh).padStart(2, '0')}:${min}`;
      }
      return `${yyyy}/${mm}/${dd} ${String(hh).padStart(2, '0')}:${min}`;
    }

    /* ==========================================================================
       第四部分：通用自适应框选架构 (Web + 移动端触控双兼容)
       严格满足：
       1. getClientXY(e) 抹平 MouseEvent 与 TouchEvent
       2. 选框 pointer-events: none + position: absolute，累加 scrollLeft 与 scrollTop
       3. 检查 e.target.closest(itemSelector)，仅在空白处立即启动框选（无需长按）
       4. document 级注册 move/end，touchmove { passive: false } 阻止原生滚动干扰
       5. 40px 边缘自动滚动感应带 + AABB 碰撞检测
       6. 标准 destroy() 销毁清理函数
       ========================================================================== */
    function getClientXY(e) {
      if (e.touches && e.touches.length > 0) {
        return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
      }
      if (e.changedTouches && e.changedTouches.length > 0) {
        return { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY };
      }
      return { clientX: e.clientX, clientY: e.clientY };
    }

    function createMarqueeController({
      container,
      marqueeEl,
      itemSelector,
      isEnabled = () => true,
      onSelectionChange
    }) {
      let active = false;
      let startX = 0;
      let startY = 0;
      let lastClientX = 0;
      let lastClientY = 0;
      let additive = false;
      let baseSelected = new Set();
      let autoScrollRaf = null;

      function updateBoxAndHitTest() {
        if (!active) return;
        const rect = container.getBoundingClientRect();
        const maxScrollW = Math.max(container.scrollWidth, container.clientWidth);
        const maxScrollH = Math.max(container.scrollHeight, container.clientHeight);

        const curX = Math.max(0, Math.min(maxScrollW, lastClientX - rect.left + container.scrollLeft));
        const curY = Math.max(0, Math.min(maxScrollH, lastClientY - rect.top + container.scrollTop));

        const left = Math.min(startX, curX);
        const top = Math.min(startY, curY);
        const width = Math.abs(curX - startX);
        const height = Math.abs(curY - startY);

        if (width > 3 || height > 3) {
          marqueeEl.style.display = 'block';
          marqueeEl.style.left = `${left}px`;
          marqueeEl.style.top = `${top}px`;
          marqueeEl.style.width = `${width}px`;
          marqueeEl.style.height = `${height}px`;
        }

        // AABB 碰撞判定（基于元素在可滚动容器内的相对几何位置）
        const selected = new Set(additive ? baseSelected : []);
        const items = container.querySelectorAll(itemSelector);
        for (const el of items) {
          const itemRect = el.getBoundingClientRect();
          const ix = itemRect.left - rect.left + container.scrollLeft;
          const iy = itemRect.top - rect.top + container.scrollTop;
          const iw = itemRect.width;
          const ih = itemRect.height;

          const hit = !(ix + iw < left || ix > left + width || iy + ih < top || iy > top + height);
          const id = el.dataset.path;
          if (hit && id) selected.add(id);
        }
        onSelectionChange(selected);
      }

      function autoScrollTick() {
        if (!active) return;
        const rect = container.getBoundingClientRect();
        const ZONE = 40;
        const MAX_SPEED = 14;
        let dx = 0;
        let dy = 0;

        if (lastClientY < rect.top + ZONE) {
          dy = -Math.ceil(((rect.top + ZONE - lastClientY) / ZONE) * MAX_SPEED);
        } else if (lastClientY > rect.bottom - ZONE) {
          dy = Math.ceil(((lastClientY - (rect.bottom - ZONE)) / ZONE) * MAX_SPEED);
        }

        if (lastClientX < rect.left + ZONE) {
          dx = -Math.ceil(((rect.left + ZONE - lastClientX) / ZONE) * MAX_SPEED);
        } else if (lastClientX > rect.right - ZONE) {
          dx = Math.ceil(((lastClientX - (rect.right - ZONE)) / ZONE) * MAX_SPEED);
        }

        if (dx !== 0 || dy !== 0) {
          const prevL = container.scrollLeft;
          const prevT = container.scrollTop;
          container.scrollLeft += dx;
          container.scrollTop += dy;
          if (container.scrollLeft !== prevL || container.scrollTop !== prevT) {
            updateBoxAndHitTest();
          }
        }
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function handleStart(e) {
        if (!isEnabled()) return;
        if (e.type === 'mousedown' && e.button !== 0) return;
        // 忽略窗口、滚动条区域或列表头与已有条目自身
        if (e.target.closest(itemSelector)) return;
        if (e.target.closest('.os-window') && !container.closest('.os-window')) return;
        if (e.target.closest('.fe-detail-header') || e.target.closest('button') || e.target.closest('input')) return;

        const rect = container.getBoundingClientRect();
        const { clientX, clientY } = getClientXY(e);
        // 若点击在容器原生滚动条轨道上则放行原生滚动条拖动
        if (clientX > rect.left + container.clientWidth || clientY > rect.top + container.clientHeight) return;

        ContextMenu.hide();
        StartMenu.hide();
        CalendarPopover.hide();

        active = true;
        additive = Boolean(e.ctrlKey || e.metaKey || e.shiftKey);
        baseSelected = new Set();
        if (additive) {
          container.querySelectorAll(`${itemSelector}.selected`).forEach(el => {
            if (el.dataset.path) baseSelected.add(el.dataset.path);
          });
        } else {
          onSelectionChange(new Set());
        }

        startX = clientX - rect.left + container.scrollLeft;
        startY = clientY - rect.top + container.scrollTop;
        lastClientX = clientX;
        lastClientY = clientY;

        marqueeEl.style.display = 'none';
        marqueeEl.style.width = '0px';
        marqueeEl.style.height = '0px';

        if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function handleMove(e) {
        if (!active) return;
        if (e.cancelable) e.preventDefault();
        const { clientX, clientY } = getClientXY(e);
        lastClientX = clientX;
        lastClientY = clientY;
        updateBoxAndHitTest();
      }

      function handleEnd() {
        if (!active) return;
        active = false;
        if (autoScrollRaf) {
          cancelAnimationFrame(autoScrollRaf);
          autoScrollRaf = null;
        }
        marqueeEl.style.display = 'none';
      }

      container.addEventListener('mousedown', handleStart);
      container.addEventListener('touchstart', handleStart, { passive: true });
      document.addEventListener('mousemove', handleMove);
      document.addEventListener('touchmove', handleMove, { passive: false });
      document.addEventListener('mouseup', handleEnd);
      document.addEventListener('touchend', handleEnd);
      document.addEventListener('touchcancel', handleEnd);

      return {
        destroy() {
          handleEnd();
          container.removeEventListener('mousedown', handleStart);
          container.removeEventListener('touchstart', handleStart);
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('touchmove', handleMove);
          document.removeEventListener('mouseup', handleEnd);
          document.removeEventListener('touchend', handleEnd);
          document.removeEventListener('touchcancel', handleEnd);
        }
      };
    }

    /* ==========================================================================
       第五部分：HTML5 原生双向拖拽引擎 + 异步预加载缓存 + 移动端触摸拖拽
       严格遵循 Section 3.3：
       - 严禁在 dragstart 中使用 async/await！mouseenter/mousedown 异步预热至 Map
       - dragstart 同步同时写入 dataTransfer.items.add(file) 与 DownloadURL (mime:filename:url)
       - dragend 后延迟 6 秒再 revokeObjectURL
       - 外部拖入采用 webkitGetAsEntry 递归循环 readEntries() 直至空数组，使用 file.arrayBuffer()
       ========================================================================== */
    const VFSDragEngine = {
      preloadCache: new Map(), // path -> { file, blob, mime, safeName, mtime }
      activeBlobUrls: [],
      internalPayload: null,

      /* 在 mouseenter / mousedown 时非阻塞预加载文件二进制数据 */
      async preloadFile(fullPath) {
        if (!fullPath || String(fullPath).startsWith('app:')) return;
        try {
          const norm = PathUtils.normalize(fullPath);
          const st = await window.fs.stat(norm);
          if (st.isDirectory()) return;
          // 超过 80MB 的超大镜像不预热进拖拽内存，防止卡顿
          if (st.size > 80 * 1024 * 1024) return;
          const prev = this.preloadCache.get(norm);
          if (prev && prev.mtime === st.mtime && prev.size === st.size) return;

          const bytes = await window.fs.readFile(norm);
          const mime = st.mime || FileTypes.getMime(norm) || 'application/octet-stream';
          // DownloadURL 格式要求文件名不含冒号
          const safeName = PathUtils.basename(norm).replace(/:/g, '_');
          const blob = new Blob([bytes], { type: mime });
          const file = new File([blob], safeName, { type: mime, lastModified: st.mtime });
          this.preloadCache.set(norm, { file, blob, mime, safeName, mtime: st.mtime, size: st.size });
        } catch (_) {}
      },

      /* 绑定条目拖拽源（HTML5 原生 draggable="true" + 移动端 touch 拖拽双栈） */
      bindDraggableItem(el, { path, isDir, getSelectedPaths, sourceZone, onTouchDrop }) {
        el.setAttribute('draggable', 'true');

        // 预热缓存
        el.addEventListener('mouseenter', () => { if (!isDir) this.preloadFile(path); }, { passive: true });
        el.addEventListener('mousedown', () => { if (!isDir) this.preloadFile(path); }, { passive: true });

        // 100% 同步 dragstart —— 绝对禁止 async/await
        el.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          ContextMenu.hide();
          const sel = getSelectedPaths();
          const paths = sel.includes(path) ? sel : [path];
          const rect = el.getBoundingClientRect();
          const payload = {
            paths,
            primaryPath: path,
            sourceZone,
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top
          };
          this.internalPayload = payload;

          e.dataTransfer.effectAllowed = 'copyMove';
          e.dataTransfer.setData('application/x-guishu-vfs', JSON.stringify(payload));

          // 同步读取预加载缓存以支持直接拖出浏览器到物理桌面
          const cached = this.preloadCache.get(PathUtils.normalize(path));
          if (cached && !isDir) {
            const blobUrl = URL.createObjectURL(cached.blob);
            this.activeBlobUrls.push(blobUrl);
            try {
              e.dataTransfer.items.add(cached.file);
            } catch (_) {}
            try {
              e.dataTransfer.setData('DownloadURL', `${cached.mime}:${cached.safeName}:${blobUrl}`);
            } catch (_) {}
          }
        });

        el.addEventListener('dragend', () => {
          this.internalPayload = null;
          const urlsToClean = [...this.activeBlobUrls];
          this.activeBlobUrls = [];
          // 延迟 6 秒（>= 5 秒规范）后释放 Blob URL
          setTimeout(() => {
            for (const u of urlsToClean) {
              try { URL.revokeObjectURL(u); } catch (_) {}
            }
          }, 6000);
        });

        // 若该条目是文件夹，支持将其他文件直接拖放到该文件夹图标上移入
        if (isDir) {
          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.add('drop-target-hover');
          });
          el.addEventListener('dragleave', () => {
            el.classList.remove('drop-target-hover');
          });
          el.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.remove('drop-target-hover');
            await this.handleDropIntoDirectory(e, path);
          });
        }

        // 移动端触屏专属拖拽移动（不影响桌面鼠标 HTML5 原生拖拽）
        let touchTimer = null;
        let touchDragging = false;
        let ghostEl = null;
        let startTX = 0;
        let startTY = 0;
        let offsetTX = 0;
        let offsetTY = 0;

        el.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          const t = e.touches[0];
          startTX = t.clientX;
          startTY = t.clientY;
          const r = el.getBoundingClientRect();
          offsetTX = t.clientX - r.left;
          offsetTY = t.clientY - r.top;

          touchTimer = setTimeout(() => {
            touchDragging = true;
            ghostEl = el.cloneNode(true);
            ghostEl.style.cssText = `position:fixed; left:${t.clientX - offsetTX}px; top:${t.clientY - offsetTY}px; width:${r.width}px; pointer-events:none; z-index:99999; opacity:0.86; transform:scale(1.05);`;
            document.body.appendChild(ghostEl);
          }, 220);
        }, { passive: true });

        el.addEventListener('touchmove', (e) => {
          if (!touchDragging) {
            const t = e.touches[0];
            if (Math.hypot(t.clientX - startTX, t.clientY - startTY) > 10) {
              clearTimeout(touchTimer);
            }
            return;
          }
          if (e.cancelable) e.preventDefault();
          const t = e.touches[0];
          if (ghostEl) {
            ghostEl.style.left = `${t.clientX - offsetTX}px`;
            ghostEl.style.top = `${t.clientY - offsetTY}px`;
          }
        }, { passive: false });

        const finishTouch = async (e) => {
          clearTimeout(touchTimer);
          if (!touchDragging) return;
          touchDragging = false;
          if (ghostEl) {
            ghostEl.remove();
            ghostEl = null;
          }
          const t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
          if (!t) return;

          // 检测手指落点下的目标元素（文件夹图标或窗口目录）
          const hitEl = document.elementFromPoint(t.clientX, t.clientY);
          const folderEl = hitEl?.closest('[data-isdir="true"]');
          if (folderEl && folderEl.dataset.path && folderEl.dataset.path !== path) {
            const sel = getSelectedPaths();
            const paths = sel.includes(path) ? sel : [path];
            await this.movePathsToDirectory(paths, folderEl.dataset.path);
            return;
          }
          const explorerDrop = hitEl?.closest('[data-explorer-cwd]');
          if (explorerDrop && explorerDrop.dataset.explorerCwd) {
            const targetDir = explorerDrop.dataset.explorerCwd;
            if (PathUtils.dirname(path) !== targetDir) {
              const sel = getSelectedPaths();
              const paths = sel.includes(path) ? sel : [path];
              await this.movePathsToDirectory(paths, targetDir);
              return;
            }
          }
          if (typeof onTouchDrop === 'function') {
            onTouchDrop(t.clientX - offsetTX, t.clientY - offsetTY);
          }
        };

        el.addEventListener('touchend', finishTouch);
        el.addEventListener('touchcancel', finishTouch);
      },

      /* 将内部文件列表移动到目标文件夹（保留 mtime） */
      async movePathsToDirectory(paths, targetDir) {
        const destDir = PathUtils.normalize(targetDir);
        let movedCount = 0;
        IOBusy.show('正在移动文件...');
        try {
          for (const src of paths) {
            if (!src || String(src).startsWith('app:')) continue;
            const normSrc = PathUtils.normalize(src);
            if (normSrc === destDir || destDir.startsWith(normSrc + '/')) continue;
            if (PathUtils.dirname(normSrc) === destDir) continue;
            const destPath = await getUniqueDestPath(destDir, PathUtils.basename(normSrc));
            await window.fs.rename(normSrc, destPath);
            Desktop.transferIconPosition(normSrc, destPath);
            movedCount++;
          }
          if (movedCount > 0) Toast.show(`已移动 ${movedCount} 个项目至 ${destDir}`);
        } catch (err) {
          Toast.show(`移动失败: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
        return movedCount;
      },

      /* 处理拖放到某个目标目录（自动区分系统内部移动 vs 物理桌面反向导入） */
      async handleDropIntoDirectory(e, targetDir, dropDesktopCoords = null) {
        const rawInternal = e.dataTransfer.getData('application/x-guishu-vfs');
        if (rawInternal || this.internalPayload) {
          const payload = rawInternal ? JSON.parse(rawInternal) : this.internalPayload;
          if (!payload || !Array.isArray(payload.paths)) return;

          // 如果是从桌面拖到桌面空白（含桌面系统图标与桌面 VFS 文件）：仅更新图标自由坐标！
          if (targetDir === '/Desktop' && dropDesktopCoords && payload.paths.every(p => String(p).startsWith('app:') || PathUtils.dirname(p) === '/Desktop')) {
            Desktop.repositionIconsOnDrop(payload, dropDesktopCoords.x, dropDesktopCoords.y);
            return;
          }

          // 从其他目录拖入目标目录或桌面：移动文件并定位在释放坐标
          IOBusy.show('正在移动项目...');
          try {
            let idx = 0;
            for (const src of payload.paths) {
              if (!src || String(src).startsWith('app:')) continue;
              const normSrc = PathUtils.normalize(src);
              if (PathUtils.dirname(normSrc) === targetDir) continue;
              const destPath = await getUniqueDestPath(targetDir, PathUtils.basename(normSrc));
              await window.fs.rename(normSrc, destPath);
              if (targetDir === '/Desktop' && dropDesktopCoords) {
                Desktop.setIconCoord(destPath, dropDesktopCoords.x + idx * 24, dropDesktopCoords.y + idx * 24);
              } else {
                delete Desktop.positions[normSrc];
                Desktop.savePositions();
              }
              idx++;
            }
          } catch (err) {
            Toast.show(`移动操作失败: ${err.message}`, 'error');
          } finally {
            IOBusy.hide();
          }
          return;
        }

        // 反向导入：物理电脑桌面 -> 虚拟文件系统（支持多文件与深层嵌套文件夹！）
        const items = e.dataTransfer.items;
        if (items && items.length > 0) {
          const entries = [];
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.kind === 'file') {
              const entry = typeof item.webkitGetAsEntry === 'function' ? item.webkitGetAsEntry() : null;
              if (entry) entries.push(entry);
              else {
                const f = item.getAsFile();
                if (f) entries.push({ isFile: true, isDirectory: false, name: f.name, _rawFile: f });
              }
            }
          }
          if (entries.length > 0) {
            await this.importFileSystemEntries(entries, targetDir, dropDesktopCoords);
            return;
          }
        }

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          await this.importFileList(e.dataTransfer.files, targetDir, dropDesktopCoords);
        }
      },

      /* 递归遍历 webkitGetAsEntry（readEntries 循环读取直至空数组，使用 file.arrayBuffer 获取二进制数据） */
      async importFileSystemEntries(entries, targetDir, dropDesktopCoords = null) {
        IOBusy.show('正在导入本地文件与目录树...');
        let count = 0;
        const readAllDirEntries = async (dirReader) => {
          const all = [];
          while (true) {
            const batch = await new Promise((resolve, reject) => {
              dirReader.readEntries(resolve, reject);
            });
            if (!batch || batch.length === 0) break;
            all.push(...batch);
          }
          return all;
        };

        const processEntry = async (entry, parentPath, rootIdx) => {
          const destPath = PathUtils.join(parentPath, entry.name);
          if (entry.isDirectory) {
            await window.fs.mkdir(destPath);
            if (parentPath === '/Desktop' && dropDesktopCoords) {
              Desktop.setIconCoord(destPath, dropDesktopCoords.x + rootIdx * 92, dropDesktopCoords.y);
            }
            const reader = entry.createReader();
            const children = await readAllDirEntries(reader);
            for (const child of children) {
              await processEntry(child, destPath, 0);
            }
          } else if (entry.isFile) {
            const file = entry._rawFile || await new Promise((resolve, reject) => entry.file(resolve, reject));
            const ab = await file.arrayBuffer();
            await window.fs.writeFile(destPath, new Uint8Array(ab), {
              mtime: file.lastModified || Date.now(),
              ctime: file.lastModified || Date.now()
            });
            if (parentPath === '/Desktop' && dropDesktopCoords) {
              Desktop.setIconCoord(destPath, dropDesktopCoords.x + rootIdx * 92, dropDesktopCoords.y);
            }
            count++;
          }
        };

        try {
          for (let i = 0; i < entries.length; i++) {
            await processEntry(entries[i], targetDir, i);
          }
          Toast.show(`已成功导入 ${count} 个文件至 ${targetDir}`);
        } catch (err) {
          Toast.show(`导入过程出错: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
      },

      async importFileList(fileList, targetDir, dropDesktopCoords = null) {
        IOBusy.show('正在写入文件到持久化存储...');
        let count = 0;
        try {
          for (let i = 0; i < fileList.length; i++) {
            const file = fileList[i];
            const rel = file.webkitRelativePath || file.name;
            const destPath = PathUtils.join(targetDir, rel);
            await window.fs.mkdir(PathUtils.dirname(destPath));
            const ab = await file.arrayBuffer();
            await window.fs.writeFile(destPath, new Uint8Array(ab), {
              mtime: file.lastModified || Date.now(),
              ctime: file.lastModified || Date.now()
            });
            if (targetDir === '/Desktop' && dropDesktopCoords && !rel.includes('/')) {
              Desktop.setIconCoord(destPath, dropDesktopCoords.x + i * 92, dropDesktopCoords.y);
            }
            count++;
          }
          Toast.show(`已导入 ${count} 个文件至 ${targetDir}`);
        } catch (err) {
          Toast.show(`导入失败: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
      },

      /* 移动端与通用替代导出方案（单文件直接下载，文件夹自动打包为保真时间戳 .zip 下载） */
      async exportToPhysicalDesktop(vfsPath) {
        try {
          const st = await window.fs.stat(vfsPath);
          if (st.isDirectory()) {
            IOBusy.show('正在打包文件夹以供下载...');
            const zipBlob = await ArchiveEngine.compressPathsToZipBlob([vfsPath]);
            triggerBrowserDownload(zipBlob, `${PathUtils.basename(vfsPath) || 'archive'}.zip`);
            Toast.show(`文件夹已打包导出为 ${PathUtils.basename(vfsPath)}.zip`);
          } else {
            const blob = await window.fs.readFile(vfsPath, { asBlob: true });
            triggerBrowserDownload(blob, PathUtils.basename(vfsPath));
            Toast.show(`已导出下载 ${PathUtils.basename(vfsPath)}`);
          }
        } catch (err) {
          Toast.show(`导出失败: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
      }
    };

    function triggerBrowserDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 6000);
    }

    async function getUniqueDestPath(dirPath, baseName) {
      let candidate = PathUtils.join(dirPath, baseName);
      if (!(await window.fs.exists(candidate))) return candidate;
      const ext = PathUtils.extname(baseName);
      const stem = ext ? baseName.slice(0, -ext.length) : baseName;
      let idx = 1;
      while (await window.fs.exists(candidate)) {
        candidate = PathUtils.join(dirPath, `${stem} (${idx++})${ext}`);
      }
      return candidate;
    }

    /* 全局剪贴板（复制 / 剪切 VFS 文件） */
    const VFSClipboard = {
      mode: null, // 'copy' | 'cut'
      paths: [],
      set(mode, paths) {
        this.mode = mode;
        this.paths = [...paths];
        Toast.show(mode === 'cut' ? `已剪切 ${paths.length} 个项目` : `已复制 ${paths.length} 个项目`);
      },
      async pasteInto(targetDir) {
        if (!this.paths.length) return;
        IOBusy.show('正在粘贴文件...');
        try {
          for (const src of this.paths) {
            if (!(await window.fs.exists(src))) continue;
            const dest = await getUniqueDestPath(targetDir, PathUtils.basename(src));
            if (this.mode === 'cut') {
              await window.fs.rename(src, dest);
            } else {
              await window.fs.copy(src, dest);
            }
          }
          if (this.mode === 'cut') {
            this.paths = [];
            this.mode = null;
          }
          Toast.show('粘贴完成');
        } catch (err) {
          Toast.show(`粘贴失败: ${err.message}`, 'error');
        } finally {
          IOBusy.hide();
        }
      }
    };

    /* ==========================================================================
       第六部分：窗口管理器 (Window Manager) + Aero Snap + Aero Peek
       支持：拖拽、八向缩放、最大化/还原、最小化、自动置顶、Aero Snap 边缘/四角贴靠、移动端自适应
       ========================================================================== */
    const WM = {
      windows: new Map(), // id -> winRecord
      topZ: 200,
      seq: 1,
      allMinimizedSnapshot: null,

      createWindow({
        appId,
        title,
        iconSvg,
        width = 860,
        height = 560,
        minWidth = 300,
        minHeight = 200,
        singletonKey = null,
        onMount,
        onClose,
        onResize
      }) {
        if (singletonKey) {
          for (const w of this.windows.values()) {
            if (w.singletonKey === singletonKey) {
              if (w.minimized) this.restoreWindow(w.id);
              this.focusWindow(w.id);
              return w;
            }
          }
        }

        const stage = document.getElementById('desktop-stage');
        const stageW = stage.clientWidth || window.innerWidth;
        const stageH = stage.clientHeight || (window.innerHeight - 48);
        const isMobile = window.innerWidth <= 768;

        const id = `win_${this.seq++}`;
        const finalW = isMobile ? stageW : Math.min(width, stageW - 16);
        const finalH = isMobile ? stageH : Math.min(height, stageH - 16);
        const cascade = ((this.seq - 2) % 7) * 24;
        const left = isMobile ? 0 : Math.max(8, Math.min(stageW - finalW - 8, Math.round((stageW - finalW) / 2) + cascade - 40));
        const top = isMobile ? 0 : Math.max(8, Math.min(stageH - finalH - 8, Math.round((stageH - finalH) / 2) + cascade - 30));

        const el = document.createElement('section');
        el.className = 'os-window focused';
        el.dataset.winId = id;
        el.style.left = `${left}px`;
        el.style.top = `${top}px`;
        el.style.width = `${finalW}px`;
        el.style.height = `${finalH}px`;
        el.style.minWidth = `${Math.min(minWidth, stageW)}px`;
        el.style.minHeight = `${Math.min(minHeight, stageH)}px`;
        el.style.zIndex = String(++this.topZ);

        el.innerHTML = `
          <header class="win-titlebar">
            <div class="win-title-group">
              <span class="win-title-icon">${iconSvg || Icons.sundial}</span>
              <span class="win-title-text">${escapeHtml(title)}</span>
            </div>
            <div class="win-controls">
              <button class="win-ctl-btn ctl-min" title="最小化">${Icons.min}</button>
              <button class="win-ctl-btn ctl-max" title="最大化 / 还原">${Icons.max}</button>
              <button class="win-ctl-btn ctl-close" title="关闭">${Icons.close}</button>
            </div>
          </header>
          <div class="win-body"></div>
          <div class="win-resizer resizer-n" data-dir="n"></div>
          <div class="win-resizer resizer-s" data-dir="s"></div>
          <div class="win-resizer resizer-e" data-dir="e"></div>
          <div class="win-resizer resizer-w" data-dir="w"></div>
          <div class="win-resizer resizer-ne" data-dir="ne"></div>
          <div class="win-resizer resizer-nw" data-dir="nw"></div>
          <div class="win-resizer resizer-se" data-dir="se"></div>
          <div class="win-resizer resizer-sw" data-dir="sw"></div>
        `;

        document.getElementById('windows-layer').appendChild(el);

        const rec = {
          id,
          appId,
          title,
          iconSvg: iconSvg || Icons.sundial,
          singletonKey,
          el,
          bodyEl: el.querySelector('.win-body'),
          titleTextEl: el.querySelector('.win-title-text'),
          maxBtnEl: el.querySelector('.ctl-max'),
          minimized: false,
          maximized: isMobile,
          snapped: false,
          restoreRect: { left, top, width: finalW, height: finalH },
          onClose,
          onResize,
          setTitle(newTitle) {
            this.title = newTitle;
            this.titleTextEl.textContent = newTitle;
            Taskbar.renderTasks();
          }
        };

        if (isMobile) {
          el.classList.add('maximized');
          rec.maxBtnEl.innerHTML = Icons.restore;
        }

        this.windows.set(id, rec);
        this._bindWindowInteractions(rec);
        this.focusWindow(id);
        Taskbar.renderTasks();

        if (typeof onMount === 'function') {
          onMount(rec.bodyEl, rec);
        }

        return rec;
      },

      _bindWindowInteractions(rec) {
        const { el, id } = rec;
        const titlebar = el.querySelector('.win-titlebar');

        el.addEventListener('pointerdown', () => {
          this.focusWindow(id);
        });

        el.querySelector('.ctl-min').addEventListener('click', (e) => {
          e.stopPropagation();
          this.minimizeWindow(id);
        });
        el.querySelector('.ctl-max').addEventListener('click', (e) => {
          e.stopPropagation();
          this.toggleMaximize(id);
        });
        el.querySelector('.ctl-close').addEventListener('click', (e) => {
          e.stopPropagation();
          this.closeWindow(id);
        });
        titlebar.addEventListener('dblclick', (e) => {
          if (e.target.closest('.win-controls')) return;
          this.toggleMaximize(id);
        });

        // 标题栏拖拽 + Aero Snap 边缘与四角自动贴靠
        let dragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let pendingSnapZone = null;
        const snapPreview = document.getElementById('aero-snap-preview');

        titlebar.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          if (e.target.closest('.win-controls')) return;
          this.focusWindow(id);
          dragging = true;
          pendingSnapZone = null;
          titlebar.setPointerCapture(e.pointerId);

          // 若当前为最大化或贴靠状态，拖拽移动时平滑恢复原始尺寸并居中跟随指针
          if (rec.maximized || rec.snapped) {
            const ratio = Math.min(0.85, Math.max(0.15, (e.clientX - el.getBoundingClientRect().left) / el.offsetWidth));
            rec.maximized = false;
            rec.snapped = false;
            el.classList.remove('maximized');
            rec.maxBtnEl.innerHTML = Icons.max;
            const rw = rec.restoreRect.width;
            const rh = rec.restoreRect.height;
            el.style.width = `${rw}px`;
            el.style.height = `${rh}px`;
            const stageRect = document.getElementById('desktop-stage').getBoundingClientRect();
            const nx = Math.max(0, e.clientX - stageRect.left - rw * ratio);
            const ny = Math.max(0, e.clientY - stageRect.top - 16);
            el.style.left = `${nx}px`;
            el.style.top = `${ny}px`;
          }

          const rect = el.getBoundingClientRect();
          dragOffsetX = e.clientX - rect.left;
          dragOffsetY = e.clientY - rect.top;
          this._toggleIframeShieldDuringDrag(true);
        });

        titlebar.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const stage = document.getElementById('desktop-stage');
          const sRect = stage.getBoundingClientRect();
          const newLeft = Math.max(-el.offsetWidth + 80, Math.min(sRect.width - 80, e.clientX - sRect.left - dragOffsetX));
          const newTop = Math.max(0, Math.min(sRect.height - 34, e.clientY - sRect.top - dragOffsetY));
          el.style.left = `${newLeft}px`;
          el.style.top = `${newTop}px`;
          rec.restoreRect.left = newLeft;
          rec.restoreRect.top = newTop;

          // Aero Snap 感应计算
          if (SysConfig.data.aeroSnap && window.innerWidth > 768) {
            const relX = e.clientX - sRect.left;
            const relY = e.clientY - sRect.top;
            const EDGE = 18;
            const CORNER = 44;
            let zone = null;

            if (relX <= CORNER && relY <= CORNER) zone = { left: 0, top: 0, width: sRect.width / 2, height: sRect.height / 2, type: 'nw' };
            else if (relX >= sRect.width - CORNER && relY <= CORNER) zone = { left: sRect.width / 2, top: 0, width: sRect.width / 2, height: sRect.height / 2, type: 'ne' };
            else if (relX <= CORNER && relY >= sRect.height - CORNER) zone = { left: 0, top: sRect.height / 2, width: sRect.width / 2, height: sRect.height / 2, type: 'sw' };
            else if (relX >= sRect.width - CORNER && relY >= sRect.height - CORNER) zone = { left: sRect.width / 2, top: sRect.height / 2, width: sRect.width / 2, height: sRect.height / 2, type: 'se' };
            else if (relY <= EDGE) zone = { left: 0, top: 0, width: sRect.width, height: sRect.height, type: 'max' };
            else if (relX <= EDGE) zone = { left: 0, top: 0, width: sRect.width / 2, height: sRect.height, type: 'left' };
            else if (relX >= sRect.width - EDGE) zone = { left: sRect.width / 2, top: 0, width: sRect.width / 2, height: sRect.height, type: 'right' };

            pendingSnapZone = zone;
            if (zone) {
              snapPreview.style.left = `${zone.left + 4}px`;
              snapPreview.style.top = `${zone.top + 4}px`;
              snapPreview.style.width = `${zone.width - 8}px`;
              snapPreview.style.height = `${zone.height - 8}px`;
              snapPreview.classList.add('visible');
            } else {
              snapPreview.classList.remove('visible');
            }
          }
        });

        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          this._toggleIframeShieldDuringDrag(false);
          snapPreview.classList.remove('visible');
          if (pendingSnapZone) {
            if (pendingSnapZone.type === 'max') {
              this.toggleMaximize(id, true);
            } else {
              rec.snapped = true;
              el.style.left = `${pendingSnapZone.left}px`;
              el.style.top = `${pendingSnapZone.top}px`;
              el.style.width = `${pendingSnapZone.width}px`;
              el.style.height = `${pendingSnapZone.height}px`;
              if (typeof rec.onResize === 'function') rec.onResize();
            }
            pendingSnapZone = null;
          }
        };
        titlebar.addEventListener('pointerup', endDrag);
        titlebar.addEventListener('pointercancel', endDrag);

        // 八向边缘调整大小 (8-Direction Resize)
        el.querySelectorAll('.win-resizer').forEach((handle) => {
          let resizing = false;
          let dir = '';
          let startX = 0, startY = 0;
          let startL = 0, startT = 0, startW = 0, startH = 0;

          handle.addEventListener('pointerdown', (e) => {
            if (rec.maximized) return;
            e.stopPropagation();
            this.focusWindow(id);
            resizing = true;
            dir = handle.dataset.dir;
            handle.setPointerCapture(e.pointerId);
            startX = e.clientX;
            startY = e.clientY;
            startL = el.offsetLeft;
            startT = el.offsetTop;
            startW = el.offsetWidth;
            startH = el.offsetHeight;
            rec.snapped = false;
            this._toggleIframeShieldDuringDrag(true);
          });

          handle.addEventListener('pointermove', (e) => {
            if (!resizing) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const minW = parseInt(el.style.minWidth, 10) || 280;
            const minH = parseInt(el.style.minHeight, 10) || 180;

            let newL = startL, newT = startT, newW = startW, newH = startH;
            if (dir.includes('e')) newW = Math.max(minW, startW + dx);
            if (dir.includes('s')) newH = Math.max(minH, startH + dy);
            if (dir.includes('w')) {
              const wCandidate = startW - dx;
              if (wCandidate >= minW) {
                newW = wCandidate;
                newL = startL + dx;
              }
            }
            if (dir.includes('n')) {
              const hCandidate = startH - dy;
              if (hCandidate >= minH && startT + dy >= 0) {
                newH = hCandidate;
                newT = startT + dy;
              }
            }

            el.style.left = `${newL}px`;
            el.style.top = `${newT}px`;
            el.style.width = `${newW}px`;
            el.style.height = `${newH}px`;
            rec.restoreRect = { left: newL, top: newT, width: newW, height: newH };
            if (typeof rec.onResize === 'function') rec.onResize();
          });

          const endResize = () => {
            if (!resizing) return;
            resizing = false;
            this._toggleIframeShieldDuringDrag(false);
          };
          handle.addEventListener('pointerup', endResize);
          handle.addEventListener('pointercancel', endResize);
        });
      },

      _toggleIframeShieldDuringDrag(enable) {
        document.querySelectorAll('iframe').forEach(ifr => {
          ifr.style.pointerEvents = enable ? 'none' : '';
        });
      },

      focusWindow(id) {
        const target = this.windows.get(id);
        if (!target) return;
        for (const w of this.windows.values()) {
          w.el.classList.remove('focused');
        }
        target.el.classList.add('focused');
        target.el.style.zIndex = String(++this.topZ);
        Taskbar.renderTasks();
      },

      minimizeWindow(id) {
        const rec = this.windows.get(id);
        if (!rec) return;
        rec.minimized = true;
        rec.el.classList.add('minimized');
        rec.el.classList.remove('focused');
        Taskbar.renderTasks();
      },

      restoreWindow(id) {
        const rec = this.windows.get(id);
        if (!rec) return;
        rec.minimized = false;
        rec.el.classList.remove('minimized');
        this.focusWindow(id);
        if (typeof rec.onResize === 'function') rec.onResize();
      },

      toggleMaximize(id, forceMax = null) {
        const rec = this.windows.get(id);
        if (!rec) return;
        const shouldMax = forceMax !== null ? forceMax : !rec.maximized;
        if (shouldMax) {
          if (!rec.maximized && !rec.snapped) {
            rec.restoreRect = {
              left: rec.el.offsetLeft,
              top: rec.el.offsetTop,
              width: rec.el.offsetWidth,
              height: rec.el.offsetHeight
            };
          }
          rec.maximized = true;
          rec.snapped = false;
          rec.el.classList.add('maximized');
          rec.maxBtnEl.innerHTML = Icons.restore;
        } else {
          rec.maximized = false;
          rec.el.classList.remove('maximized');
          rec.maxBtnEl.innerHTML = Icons.max;
          rec.el.style.left = `${rec.restoreRect.left}px`;
          rec.el.style.top = `${rec.restoreRect.top}px`;
          rec.el.style.width = `${rec.restoreRect.width}px`;
          rec.el.style.height = `${rec.restoreRect.height}px`;
        }
        if (typeof rec.onResize === 'function') rec.onResize();
      },

      closeWindow(id) {
        const rec = this.windows.get(id);
        if (!rec) return;
        if (typeof rec.onClose === 'function') {
          try { rec.onClose(); } catch (_) {}
        }
        rec.el.remove();
        this.windows.delete(id);
        Taskbar.renderTasks();
      },

      toggleShowDesktop() {
        const visibleWins = Array.from(this.windows.values()).filter(w => !w.minimized);
        if (visibleWins.length > 0) {
          this.allMinimizedSnapshot = visibleWins.map(w => w.id);
          for (const w of visibleWins) this.minimizeWindow(w.id);
        } else if (this.allMinimizedSnapshot && this.allMinimizedSnapshot.length > 0) {
          for (const wid of this.allMinimizedSnapshot) {
            if (this.windows.has(wid)) this.restoreWindow(wid);
          }
          this.allMinimizedSnapshot = null;
        }
      },

      getTopFocusedId() {
        let best = null;
        let maxZ = -1;
        for (const w of this.windows.values()) {
          if (!w.minimized) {
            const z = parseInt(w.el.style.zIndex, 10) || 0;
            if (z > maxZ) {
              maxZ = z;
              best = w.id;
            }
          }
        }
        return best;
      }
    };

    /* ==========================================================================
       第七部分：应用注册中心与智能文件/目录分派器 (Section 8.5)
       ========================================================================== */
    const AppRegistry = {
      apps: new Map(),
      register(appDef) {
        this.apps.set(appDef.id, appDef);
      },
      launch(appId, args = {}) {
        const app = this.apps.get(appId);
        if (!app) {
          Toast.show(`未找到应用: ${appId}`, 'error');
          return;
        }
        StartMenu.hide();
        return app.launch(args);
      },
      getAll() {
        return Array.from(this.apps.values());
      }
    };

    /* 统一架构下的智能文件/目录打开分派（无论虚拟路径还是 /mnt/local/* 统一先 stat 判断） */
    async function openVFSPath(targetPath, preferredAppId = null) {
      const norm = PathUtils.normalize(targetPath);
      try {
        const st = await window.fs.stat(norm);
        if (st.isDirectory()) {
          AppRegistry.launch('explorer', { path: norm });
          return;
        }
        if (preferredAppId) {
          AppRegistry.launch(preferredAppId, { filePath: norm });
          return;
        }
        const cat = FileTypes.getCategory(norm, false);
        switch (cat) {
          case 'html':
            showHtmlFileActionHub(norm);
            break;
          case 'image':
            // 默认使用漫画阅读器打开同目录图片流，内部及右键也可一键切换图片查看器
            AppRegistry.launch('manga', { filePath: norm });
            break;
          case 'table':
            AppRegistry.launch('spreadsheet', { filePath: norm });
            break;
          case 'code':
            AppRegistry.launch('code', { filePath: norm });
            break;
          case 'text':
            AppRegistry.launch('notepad', { filePath: norm });
            break;
          case 'audio':
          case 'video':
            AppRegistry.launch('media', { filePath: norm });
            break;
          case 'pdf':
            AppRegistry.launch('pdf', { filePath: norm });
            break;
          case 'archive':
            AppRegistry.launch('archive', { filePath: norm });
            break;
          case 'vm':
            AppRegistry.launch('vm', { filePath: norm });
            break;
          default:
            // 任何未知类型至少提供“以纯文本形式打开”的通用能力
            AppRegistry.launch('notepad', { filePath: norm });
            break;
        }
      } catch (err) {
        Toast.show(`无法打开 ${norm}: ${err.message}`, 'error');
      }
    }

    /* ==========================================================================
       第八部分：桌面环境 (Desktop) — 自由网格摆放、丝滑动画、缩略图、框选与右键菜单
       ========================================================================== */
    const Desktop = {
      GRID_W: 92,
      GRID_H: 96,
      PAD_X: 14,
      PAD_Y: 14,
      positions: {}, // key ('app:id' 或 '/Desktop/xxx') -> { x, y }
      selectedPaths: new Set(),
      thumbUrls: [],
      marqueeCtrl: null,

      init() {
        try {
          this.positions = JSON.parse(localStorage.getItem('guishu_desktop_coords') || '{}');
        } catch (_) {
          this.positions = {};
        }

        const stage = document.getElementById('desktop-stage');
        const iconsLayer = document.getElementById('desktop-icons-layer');
        const marqueeEl = document.getElementById('desktop-marquee');

        // 桌面自适应框选控制器
        this.marqueeCtrl = createMarqueeController({
          container: stage,
          marqueeEl,
          itemSelector: '.desktop-icon',
          onSelectionChange: (selSet) => {
            this.selectedPaths = selSet;
            this.syncSelectionClasses();
          }
        });

        // 桌面拖放监听（内部移动坐标 + 外部拖入文件/目录）
        stage.addEventListener('dragover', (e) => {
          if (e.target.closest('.os-window')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        stage.addEventListener('drop', async (e) => {
          if (e.target.closest('.os-window')) return;
          e.preventDefault();
          const rect = iconsLayer.getBoundingClientRect();
          const dropX = e.clientX - rect.left;
          const dropY = e.clientY - rect.top;
          await VFSDragEngine.handleDropIntoDirectory(e, '/Desktop', { x: dropX, y: dropY });
        });

        // 桌面右键上下文菜单
        stage.addEventListener('contextmenu', (e) => {
          if (e.target.closest('.os-window')) return;
          e.preventDefault();
          const iconEl = e.target.closest('.desktop-icon');
          if (iconEl) {
            const p = iconEl.dataset.path;
            if (!this.selectedPaths.has(p)) {
              this.selectedPaths = new Set([p]);
              this.syncSelectionClasses();
            }
            this.showItemContextMenu(e.clientX, e.clientY, iconEl);
          } else {
            this.showBlankContextMenu(e.clientX, e.clientY);
          }
        });

        window.fs.onChange((changedPath) => {
          if (changedPath === '/' || changedPath === '/Desktop' || changedPath.startsWith('/Desktop/')) {
            this.render();
          }
        });
      },

      savePositions() {
        try {
          localStorage.setItem('guishu_desktop_coords', JSON.stringify(this.positions));
        } catch (_) {}
      },

      snapCoord(rawX, rawY) {
        const stage = document.getElementById('desktop-stage');
        const maxW = Math.max(200, (stage.clientWidth || window.innerWidth) - this.GRID_W - 6);
        const maxH = Math.max(160, (stage.clientHeight || (window.innerHeight - 50)) - this.GRID_H - 6);
        let x = Math.max(this.PAD_X, Math.min(maxW, rawX));
        let y = Math.max(this.PAD_Y, Math.min(maxH, rawY));
        if (SysConfig.data.desktopSnapGrid) {
          const col = Math.max(0, Math.round((x - this.PAD_X) / this.GRID_W));
          const row = Math.max(0, Math.round((y - this.PAD_Y) / this.GRID_H));
          x = Math.min(maxW, this.PAD_X + col * this.GRID_W);
          y = Math.min(maxH, this.PAD_Y + row * this.GRID_H);
        }
        return { x, y };
      },

      findNextFreeSlot(occupiedList) {
        const stage = document.getElementById('desktop-stage');
        const maxRows = Math.max(3, Math.floor(((stage.clientHeight || 600) - this.PAD_Y * 2) / this.GRID_H));
        for (let col = 0; col < 30; col++) {
          for (let row = 0; row < maxRows; row++) {
            const cx = this.PAD_X + col * this.GRID_W;
            const cy = this.PAD_Y + row * this.GRID_H;
            const taken = occupiedList.some(pos => Math.abs(pos.x - cx) < 38 && Math.abs(pos.y - cy) < 38);
            if (!taken) return { x: cx, y: cy };
          }
        }
        return { x: this.PAD_X, y: this.PAD_Y };
      },

      setIconCoord(key, rawX, rawY) {
        this.positions[key] = this.snapCoord(rawX, rawY);
        this.savePositions();
      },

      transferIconPosition(oldKey, newKey) {
        if (this.positions[oldKey]) {
          this.positions[newKey] = { ...this.positions[oldKey] };
          delete this.positions[oldKey];
          this.savePositions();
        }
      },

      repositionIconsOnDrop(payload, dropClientRelX, dropClientRelY) {
        const baseIconPos = this.positions[payload.primaryPath] || { x: dropClientRelX, y: dropClientRelY };
        const targetPrimary = this.snapCoord(dropClientRelX - (payload.offsetX || 36), dropClientRelY - (payload.offsetY || 36));
        const dx = targetPrimary.x - baseIconPos.x;
        const dy = targetPrimary.y - baseIconPos.y;

        for (const key of payload.paths) {
          const cur = this.positions[key] || baseIconPos;
          const next = this.snapCoord(cur.x + dx, cur.y + dy);
          this.positions[key] = next;
          const dom = document.querySelector(`.desktop-icon[data-path="${CSS.escape(key)}"]`);
          if (dom) {
            dom.style.left = `${next.x}px`;
            dom.style.top = `${next.y}px`;
          }
        }
        this.savePositions();
      },

      autoArrangeGrid() {
        const icons = Array.from(document.querySelectorAll('#desktop-icons-layer .desktop-icon'));
        const stage = document.getElementById('desktop-stage');
        const maxRows = Math.max(3, Math.floor(((stage.clientHeight || 600) - this.PAD_Y * 2) / this.GRID_H));
        icons.forEach((el, idx) => {
          const col = Math.floor(idx / maxRows);
          const row = idx % maxRows;
          const x = this.PAD_X + col * this.GRID_W;
          const y = this.PAD_Y + row * this.GRID_H;
          this.positions[el.dataset.path] = { x, y };
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
        });
        this.savePositions();
      },

      syncSelectionClasses() {
        document.querySelectorAll('#desktop-icons-layer .desktop-icon').forEach(el => {
          el.classList.toggle('selected', this.selectedPaths.has(el.dataset.path));
        });
      },

      async render() {
        const layer = document.getElementById('desktop-icons-layer');
        if (!layer) return;

        // 清理上一次缩略图 URL
        for (const u of this.thumbUrls) URL.revokeObjectURL(u);
        this.thumbUrls = [];

        const items = [];
        // 1. 系统应用快捷图标（可在设置中自由隐藏）
        for (const app of AppRegistry.getAll()) {
          if (app.showOnDesktop === false) continue;
          if ((SysConfig.data.hiddenDesktopApps || []).includes(app.id)) continue;
          items.push({
            key: `app:${app.id}`,
            kind: 'app',
            appId: app.id,
            name: app.name,
            iconHtml: `<span style="color: ${app.color || 'var(--accent)'}; width:36px; height:36px; display:flex;">${app.icon}</span>`,
            isDir: false
          });
        }

        // 2. /Desktop 目录下的真实 VFS 文件与文件夹
        try {
          const entries = await window.fs.readdir('/Desktop', { withDetails: true });
          entries.sort((a, b) => {
            if (a.isDirectory() !== b.isDirectory()) return a.isDirectory() ? -1 : 1;
            return naturalCompare(a.name, b.name);
          });
          for (const entry of entries) {
            const fullPath = PathUtils.join('/Desktop', entry.name);
            const isDir = entry.isDirectory();
            items.push({
              key: fullPath,
              kind: 'vfs',
              path: fullPath,
              name: entry.name,
              isDir,
              cat: FileTypes.getCategory(entry.name, isDir),
              iconHtml: `<span style="width:38px; height:38px; display:flex;">${FileTypes.getIconSvg(entry.name, isDir, fullPath)}</span>`
            });
          }
        } catch (_) {}

        layer.innerHTML = '';
        const occupied = [];

        items.forEach((item, index) => {
          let coord = this.positions[item.key];
          if (!coord) {
            coord = this.findNextFreeSlot(occupied);
            this.positions[item.key] = coord;
          }
          occupied.push(coord);

          const el = document.createElement('div');
          el.className = 'desktop-icon' + (this.selectedPaths.has(item.key) ? ' selected' : '');
          el.dataset.path = item.key;
          el.dataset.kind = item.kind;
          el.dataset.isdir = item.isDir ? 'true' : 'false';
          el.style.left = `${coord.x}px`;
          el.style.top = `${coord.y}px`;
          el.style.animationDelay = `${Math.min(index * 18, 220)}ms`;

          el.innerHTML = `
            <div class="icon-glyph">${item.iconHtml}</div>
            <div class="icon-label" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
          `;

          // 图片文件异步加载缩略图，同时预热小文件以支持零延迟拖出浏览器
          if (item.kind === 'vfs' && !item.isDir) {
            if (item.cat === 'image') {
              window.fs.readFile(item.path, { asBlob: true }).then(blob => {
                const url = URL.createObjectURL(blob);
                this.thumbUrls.push(url);
                const glyph = el.querySelector('.icon-glyph');
                if (glyph) glyph.innerHTML = `<img class="thumb-img" src="${url}" alt="" />`;
              }).catch(() => {});
            }
            VFSDragEngine.preloadFile(item.path);
          }

          // 点击选中与打开（默认单击打开，设置中可切换为双击打开）
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) {
              if (this.selectedPaths.has(item.key)) this.selectedPaths.delete(item.key);
              else this.selectedPaths.add(item.key);
              this.syncSelectionClasses();
              return;
            }
            this.selectedPaths = new Set([item.key]);
            this.syncSelectionClasses();
            if (SysConfig.data.singleClickOpen) {
              this.activateItem(item);
            }
          });

          el.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (!SysConfig.data.singleClickOpen) {
              this.activateItem(item);
            }
          });

          // 统一绑定 HTML5 原生拖拽与移动端触控拖拽（支持桌面自由摆放、移入文件夹、拖出浏览器）
          VFSDragEngine.bindDraggableItem(el, {
            path: item.key,
            isDir: item.isDir,
            sourceZone: 'desktop',
            getSelectedPaths: () => Array.from(this.selectedPaths),
            onTouchDrop: (nx, ny) => {
              this.setIconCoord(item.key, nx, ny);
              el.style.left = `${this.positions[item.key].x}px`;
              el.style.top = `${this.positions[item.key].y}px`;
            }
          });

          layer.appendChild(el);
        });

        this.savePositions();
      },

      activateItem(item) {
        if (item.kind === 'app') {
          AppRegistry.launch(item.appId);
        } else {
          openVFSPath(item.path);
        }
      },

      showBlankContextMenu(x, y) {
        const stageRect = document.getElementById('desktop-icons-layer').getBoundingClientRect();
        const dropCoord = { x: x - stageRect.left, y: y - stageRect.top };
        ContextMenu.show(x, y, [
          { label: '刷新桌面', icon: Icons.refresh, action: () => this.render() },
          { label: '自动对齐排列图标', icon: Icons.grid, action: () => this.autoArrangeGrid() },
          { separator: true },
          {
            label: '新建文件夹',
            icon: Icons.folder,
            action: async () => {
              const name = await Modal.prompt('新建桌面文件夹', '新建文件夹');
              if (!name) return;
              const p = await getUniqueDestPath('/Desktop', name);
              this.setIconCoord(p, dropCoord.x, dropCoord.y);
              await window.fs.mkdir(p);
            }
          },
          {
            label: '新建文本文档 (.txt)',
            icon: Icons.notepad,
            action: async () => {
              const name = await Modal.prompt('新建文本文档', '未命名笔记.txt');
              if (!name) return;
              const p = await getUniqueDestPath('/Desktop', name);
              this.setIconCoord(p, dropCoord.x, dropCoord.y);
              await window.fs.writeFile(p, '');
            }
          },
          {
            label: '新建 HTML 网页 (.html)',
            icon: Icons.code,
            action: async () => {
              const name = await Modal.prompt('新建 HTML 文档', '未命名页面.html');
              if (!name) return;
              const p = await getUniqueDestPath('/Desktop', name);
              this.setIconCoord(p, dropCoord.x, dropCoord.y);
              await window.fs.writeFile(p, '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>新页面</title>\n</head>\n<body>\n  <h1>你好，晷枢系统</h1>\n</body>\n</html>');
            }
          },
          ...(VFSClipboard.paths.length > 0 ? [{
            label: `粘贴 (${VFSClipboard.paths.length} 项)`,
            icon: Icons.paste,
            action: () => VFSClipboard.pasteInto('/Desktop')
          }] : []),
          { separator: true },
          {
            label: '上传本地文件到桌面',
            icon: Icons.upload,
            action: () => triggerGlobalFileUpload('/Desktop', dropCoord)
          },
          {
            label: '挂载本地真实文件夹 (/mnt/local)',
            icon: Icons.drive,
            action: () => triggerMountLocalFolder()
          },
          { separator: true },
          {
            label: document.fullscreenElement ? '退出全屏模式' : '切换全屏模式',
            icon: Icons.fullscreen,
            action: () => {
              if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
              else document.documentElement.requestFullscreen().catch(() => {});
            }
          },
          {
            label: '更换壁纸与个性化设置',
            icon: Icons.settings,
            action: () => AppRegistry.launch('settings', { tab: 'appearance' })
          }
        ]);
      },

      showItemContextMenu(x, y, iconEl) {
        const key = iconEl.dataset.path;
        if (key.startsWith('app:')) {
          const appId = key.slice(4);
          ContextMenu.show(x, y, [
            { label: '打开应用', icon: Icons.external, action: () => AppRegistry.launch(appId) },
            {
              label: '从桌面隐藏此系统图标',
              icon: Icons.close,
              action: () => {
                const hidden = Array.from(new Set([...(SysConfig.data.hiddenDesktopApps || []), appId]));
                SysConfig.update({ hiddenDesktopApps: hidden });
                this.render();
                Toast.show('已隐藏桌面图标，可随时在「设置 → 桌面与任务栏」恢复');
              }
            }
          ]);
          return;
        }

        const vfsSelection = Array.from(this.selectedPaths).filter(p => !p.startsWith('app:'));
        const targets = vfsSelection.length > 0 ? vfsSelection : [key];
        const isDir = iconEl.dataset.isdir === 'true';
        const cat = FileTypes.getCategory(key, isDir);

        const menuItems = [
          { label: '打开', icon: Icons.external, action: () => openVFSPath(key) }
        ];

        if (!isDir) {
          if (cat === 'html') {
            menuItems.push(
              { label: '在系统浏览器中打开', icon: Icons.browser, action: () => AppRegistry.launch('browser', { filePath: key }) },
              { label: '编辑源代码 (HTML 编辑器)', icon: Icons.code, action: () => AppRegistry.launch('code', { filePath: key }) }
            );
          } else if (cat === 'image') {
            menuItems.push(
              { label: '使用漫画阅读器打开', icon: Icons.manga, action: () => AppRegistry.launch('manga', { filePath: key }) },
              { label: '使用图片查看器打开', icon: Icons.image, action: () => AppRegistry.launch('imageviewer', { filePath: key }) },
              {
                label: '设为桌面壁纸',
                icon: Icons.paint,
                action: async () => {
                  SysConfig.update({ wallpaperId: 'custom', customWallpaperPath: key });
                  Toast.show('已将该图片设为系统壁纸');
                }
              }
            );
          }
          menuItems.push(
            { label: '打开方式 → 代码编辑器', icon: Icons.code, action: () => AppRegistry.launch('code', { filePath: key }) },
            { label: '以纯文本形式打开 (记事本)', icon: Icons.notepad, action: () => AppRegistry.launch('notepad', { filePath: key }) }
          );
        }

        if (cat === 'archive') {
          menuItems.push({
            label: '解压到当前目录',
            icon: Icons.archive,
            action: () => ArchiveEngine.extractArchiveToDir(key, '/Desktop')
          });
        }

        menuItems.push(
          { separator: true },
          { label: '压缩为 .ZIP 归档', icon: Icons.archive, action: () => ArchiveEngine.compressPathsToVFS(targets, '/Desktop') },
          { label: '导出 / 下载到物理设备', icon: Icons.download, action: () => VFSDragEngine.exportToPhysicalDesktop(key) },
          { separator: true },
          { label: '复制', icon: Icons.copy, action: () => VFSClipboard.set('copy', targets) },
          { label: '剪切', icon: Icons.edit, action: () => VFSClipboard.set('cut', targets) },
          {
            label: '重命名',
            icon: Icons.edit,
            action: async () => {
              const oldName = PathUtils.basename(key);
              const newName = await Modal.prompt('重命名', oldName);
              if (!newName || newName === oldName) return;
              const newPath = PathUtils.join('/Desktop', newName);
              this.transferIconPosition(key, newPath);
              await window.fs.rename(key, newPath);
            }
          },
          {
            label: `删除 (${targets.length} 项)`,
            icon: Icons.trash,
            danger: true,
            action: async () => {
              const ok = await Modal.confirm('确认删除', `确定要永久删除选中的 ${targets.length} 个项目吗？`);
              if (!ok) return;
              for (const p of targets) {
                await window.fs.remove(p);
                delete this.positions[p];
              }
              this.selectedPaths.clear();
              this.savePositions();
            }
          }
        );

        ContextMenu.show(x, y, menuItems);
      }
    };

    /* 交互式月历面板（支持上个月、下个月、回到今天、12/24小时制一键切换） */
    const CalendarPopover = {
      visible: false,
      viewYear: new Date().getFullYear(),
      viewMonth: new Date().getMonth(),

      toggle() {
        if (this.visible) this.hide();
        else this.show();
      },
      show() {
        this.visible = true;
        const now = new Date();
        this.viewYear = now.getFullYear();
        this.viewMonth = now.getMonth();
        const el = document.getElementById('calendar-popover');
        el.style.display = 'block';
        this.render();
      },
      hide() {
        this.visible = false;
        const el = document.getElementById('calendar-popover');
        if (el) el.style.display = 'none';
      },
      shiftMonth(delta) {
        const d = new Date(this.viewYear, this.viewMonth + delta, 1);
        this.viewYear = d.getFullYear();
        this.viewMonth = d.getMonth();
        this.render();
      },
      render() {
        const el = document.getElementById('calendar-popover');
        const today = new Date();
        const firstDay = new Date(this.viewYear, this.viewMonth, 1).getDay();
        const daysInMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
        const prevMonthDays = new Date(this.viewYear, this.viewMonth, 0).getDate();

        const cells = [];
        for (let i = firstDay - 1; i >= 0; i--) {
          cells.push({ day: prevMonthDays - i, muted: true });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const isToday = d === today.getDate() && this.viewMonth === today.getMonth() && this.viewYear === today.getFullYear();
          cells.push({ day: d, muted: false, isToday });
        }
        while (cells.length % 7 !== 0) {
          cells.push({ day: cells.length - (firstDay + daysInMonth) + 1, muted: true });
        }

        el.innerHTML = `
          <div class="flex items-center justify-between pb-3 mb-3" style="border-bottom: 1px solid var(--border-hairline);">
            <div>
              <div class="text-sm font-bold">${this.viewYear} 年 ${this.viewMonth + 1} 月</div>

          </div>
          <div class="grid grid-cols-7 gap-1 text-center text-xs">
            ${cells.map(c => `
              <div class="h-8 flex items-center justify-center rounded ${c.isToday ? 'font-bold' : ''}"
                   style="${c.isToday ? 'background: var(--accent); color: var(--text-on-accent);' : (c.muted ? 'color: var(--text-muted); opacity:0.45;' : 'color: var(--text-primary);')}">

        el.querySelector('#cal-prev-m').onclick = (e) => { e.stopPropagation(); this.shiftMonth(-1); };
