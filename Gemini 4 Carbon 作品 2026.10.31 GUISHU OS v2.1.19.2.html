<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>晷枢系统 GUISHU OS — 曜刻青珉桌面架构</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    外部核心引擎固定版本声明（支持按需首次懒加载以保证零等待极速入场，同时严格锁定版本）：
    - JSZip: https://unpkg.com/jszip@3.10.1/dist/jszip.min.js
    - 7z-wasm: https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js
    - V86 JS: https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js
    - V86 WASM: https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm
    - SeaBIOS: https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin
    - VGABIOS: https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin
    - CodeMirror: https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js
  -->

  <style>
    /* ==========================================================================
       曜刻青珉 (Litho-Celadon Tectonics) 原创桌面视觉规范
       灵感源自精密天文日晷、玄武曜石解理面、青珉玉磷光与黄铜游标刻度
       ========================================================================== */
    :root,
    html[data-theme="dark"] {
      --bg-void: #090c10;
      --bg-surface: rgba(16, 21, 27, 0.88);
      --bg-surface-solid: #10151b;
      --bg-elevated: rgba(23, 30, 38, 0.94);
      --bg-elevated-solid: #171e26;
      --bg-panel: #131920;
      --bg-subtle: rgba(255, 255, 255, 0.038);
      --bg-hover: rgba(46, 196, 182, 0.11);
      --bg-active: rgba(46, 196, 182, 0.20);
      --bg-input: rgba(8, 11, 15, 0.72);

      --text-primary: #e7eef4;
      --text-secondary: #98a9b9;
      --text-muted: #5d7082;
      --text-on-accent: #061312;

      --accent: #2ec4b6;
      --accent-strong: #46e0d1;
      --accent-soft: rgba(46, 196, 182, 0.16);
      --accent-glow: rgba(46, 196, 182, 0.34);
      --amber: #d9a05b;
      --amber-soft: rgba(217, 160, 91, 0.16);
      --danger: #e5534b;
      --danger-soft: rgba(229, 83, 75, 0.18);
      --success: #3ccf91;

      --border-hairline: rgba(210, 230, 245, 0.085);
      --border-strong: rgba(46, 196, 182, 0.34);
      --border-window: rgba(215, 235, 245, 0.13);

      --win-radius: 8px;
      --ctl-radius: 5px;
      --win-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.76), 0 0 0 1px var(--border-window);
      --win-shadow-focused: 0 28px 76px -10px rgba(0, 0, 0, 0.85), 0 0 0 1px var(--border-strong), 0 0 28px -8px var(--accent-glow);
      --taskbar-h: 48px;
      --glass-blur: blur(18px) saturate(140%);

      --desktop-icon-text: #eef5fa;
      --desktop-icon-shadow: 0 1px 4px rgba(0, 0, 0, 0.92);
      --scrollbar-thumb: rgba(152, 169, 185, 0.25);
      --scrollbar-thumb-hover: rgba(46, 196, 182, 0.55);
    }

    html[data-theme="light"] {
      --bg-void: #e6e1d6;
      --bg-surface: rgba(247, 244, 237, 0.90);
      --bg-surface-solid: #f7f4ed;
      --bg-elevated: rgba(253, 251, 247, 0.96);
      --bg-elevated-solid: #fdfbf7;
      --bg-panel: #efeae0;
      --bg-subtle: rgba(22, 32, 42, 0.045);
      --bg-hover: rgba(15, 139, 125, 0.10);
      --bg-active: rgba(15, 139, 125, 0.18);
      --bg-input: rgba(255, 255, 255, 0.88);

      --text-primary: #172129;
      --text-secondary: #4a5b68;
      --text-muted: #7c8c99;
      --text-on-accent: #ffffff;

      --accent: #0f8b7d;
      --accent-strong: #0a6e63;
      --accent-soft: rgba(15, 139, 125, 0.13);
      --accent-glow: rgba(15, 139, 125, 0.24);
      --amber: #b57624;
      --amber-soft: rgba(181, 118, 36, 0.14);
      --danger: #cf3d35;
      --danger-soft: rgba(207, 61, 53, 0.14);
      --success: #1d9a66;

      --border-hairline: rgba(23, 33, 41, 0.11);
      --border-strong: rgba(15, 139, 125, 0.42);
      --border-window: rgba(23, 33, 41, 0.16);

      --win-shadow: 0 18px 48px -12px rgba(24, 33, 42, 0.22), 0 0 0 1px var(--border-window);
      --win-shadow-focused: 0 24px 60px -10px rgba(24, 33, 42, 0.30), 0 0 0 1.5px var(--border-strong);

      --desktop-icon-text: #f6f9fc;
      --desktop-icon-shadow: 0 1px 5px rgba(0, 0, 0, 0.88);
      --scrollbar-thumb: rgba(74, 91, 104, 0.28);
      --scrollbar-thumb-hover: rgba(15, 139, 125, 0.55);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: 'Chakra Petch', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
    }

    /* 自定义精密滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    /* 桌面根容器与分层曜石星轨壁纸 */
    #os-root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #wallpaper-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 晷枢刻度暗纹叠加层 */
    #wallpaper-reticle {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 78% 22%, rgba(46, 196, 182, 0.08) 0%, transparent 45%),
        linear-gradient(to right, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
    }

    /* 桌面工作区 */
    #desktop-stage {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      height: calc(100% - var(--taskbar-h));
      overflow: hidden;
    }

    #desktop-icons-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* 桌面图标：支持自由坐标摆放 + 丝滑弹簧过渡动画 */
    .desktop-icon {
      position: absolute;
      width: 86px;
      padding: 8px 6px 6px;
      border-radius: var(--ctl-radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition:
        left 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.14s ease,
        border-color 0.14s ease,
        transform 0.14s ease;
      animation: iconReveal 0.36s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .desktop-icon.dragging-touch {
      transition: none !important;
      z-index: 9999;
      opacity: 0.86;
      transform: scale(1.05);
    }
    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .desktop-icon.selected {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      box-shadow: inset 0 0 0 1px rgba(46, 196, 182, 0.18);
    }
    .desktop-icon.drop-target-hover {
      background: rgba(217, 160, 91, 0.25);
      border-color: var(--amber);
      transform: scale(1.06);
    }
    .desktop-icon .icon-glyph {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.38));
    }
    .desktop-icon .icon-glyph img.thumb-img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.22);
    }
    .desktop-icon .icon-label {
      width: 100%;
      text-align: center;
      font-size: 12px;
      line-height: 1.3;
      color: var(--desktop-icon-text);
      text-shadow: var(--desktop-icon-shadow);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      pointer-events: none;
    }

    @keyframes iconReveal {
      from { opacity: 0; transform: translateY(8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 通用框选矩形 (Desktop & File Explorer) */
    .marquee-box {
      position: absolute;
      pointer-events: none !important;
      z-index: 900;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 12px rgba(46, 196, 182, 0.15);
      display: none;
    }

    /* Aero Snap 贴靠指示预览层 */
    #aero-snap-preview {
      position: absolute;
      z-index: 9500;
      pointer-events: none;
      border: 1.5px solid var(--accent);
      background: linear-gradient(135deg, rgba(46, 196, 182, 0.20), rgba(217, 160, 91, 0.08));
      backdrop-filter: blur(6px);
      border-radius: var(--win-radius);
      box-shadow: 0 0 32px var(--accent-glow), inset 0 0 24px rgba(46, 196, 182, 0.14);
      opacity: 0;
      transform: scale(0.97);
      transition: all 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #aero-snap-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 窗口系统 & Aero Peek 透视模式 */
    #windows-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .os-window {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--win-radius);
      box-shadow: var(--win-shadow);
      overflow: hidden;
      min-width: 280px;
      min-height: 180px;
      transition:
        box-shadow 0.18s ease,
        opacity 0.2s ease,
        border-radius 0.18s ease;
      animation: winOpen 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .os-window.focused {
      box-shadow: var(--win-shadow-focused);
    }
    .os-window.maximized {
      border-radius: 0 !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    .os-window.minimized {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(24px) scale(0.94);
    }
    /* Aero Peek 激活时，所有窗口化为晶格线框透视桌面 */
    body.aero-peek-active .os-window:not(.minimized) {
      opacity: 0.08 !important;
      backdrop-filter: none !important;
      outline: 1.5px solid var(--accent) !important;
      pointer-events: none !important;
    }

    @keyframes winOpen {
      from { opacity: 0; transform: translateY(10px) scale(0.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 窗口标题栏（绝不模仿苹果红绿灯，采用右侧精密几何曜刻按钮） */
    .win-titlebar {
      height: 38px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 12px;
      background: linear-gradient(90deg, rgba(46, 196, 182, 0.07) 0%, transparent 55%);
      border-bottom: 1px solid var(--border-hairline);
      cursor: default;
      touch-action: none;
    }
    .os-window.focused .win-titlebar {
      background: linear-gradient(90deg, rgba(46, 196, 182, 0.13) 0%, rgba(217, 160, 91, 0.04) 60%, transparent 100%);
    }
    .win-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .win-title-icon {
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }
    .win-title-text {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .win-ctl-btn {
      width: 32px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--ctl-radius);
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background-color 0.14s ease, color 0.14s ease;
    }
    .win-ctl-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .win-ctl-btn.ctl-close:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .win-body {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-surface-solid);
    }

    /* 八向缩放热区 */
    .win-resizer {
      position: absolute;
      z-index: 30;
      touch-action: none;
    }
    .os-window.maximized .win-resizer { display: none; }
    .resizer-n  { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .resizer-s  { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .resizer-e  { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .resizer-w  { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .resizer-ne { top: -4px; right: -4px; width: 13px; height: 13px; cursor: nesw-resize; }
    .resizer-nw { top: -4px; left: -4px; width: 13px; height: 13px; cursor: nwse-resize; }
    .resizer-se { bottom: -4px; right: -4px; width: 13px; height: 13px; cursor: nwse-resize; }
    .resizer-sw { bottom: -4px; left: -4px; width: 13px; height: 13px; cursor: nesw-resize; }

    /* ==========================================================================
       任务栏 / 底部 Dock 与 Aero Peek 透视条
       ========================================================================== */
    #taskbar {
      position: relative;
      z-index: 9600;
      height: var(--taskbar-h);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 8px;
      background: var(--bg-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--border-window);
    }

    .tb-left, .tb-right {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
    }
    .tb-tasks {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      padding: 0 8px;
      height: 100%;
      scrollbar-width: none;
    }
    .tb-tasks::-webkit-scrollbar { display: none; }

    #start-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: var(--ctl-radius);
      border: 1px solid var(--border-strong);
      background: linear-gradient(135deg, var(--accent-soft), rgba(217, 160, 91, 0.08));
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.16s ease;
      flex-shrink: 0;
    }
    #start-btn:hover, #start-btn.active {
      background: var(--accent);
      color: var(--text-on-accent);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .tb-app-pill {
      position: relative;
      height: 36px;
      max-width: 185px;
      min-width: 42px;
      padding: 0 10px;
      border-radius: var(--ctl-radius);
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .tb-app-pill:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .tb-app-pill.active-win {
      background: var(--accent-soft);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .tb-app-pill.active-win::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }
    .tb-app-pill.minimized-win {
      opacity: 0.72;
      border-style: dashed;
    }
    .tb-pill-close {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      transition: all 0.12s;
    }
    .tb-app-pill:hover .tb-pill-close { opacity: 1; }
    .tb-pill-close:hover {
      background: var(--danger);
      color: #fff;
    }

    #clock-widget {
      height: 38px;
      padding: 0 10px;
      border-radius: var(--ctl-radius);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      line-height: 1.18;
      transition: background-color 0.14s;
    }
    #clock-widget:hover {
      background: var(--bg-hover);
    }
    #AeroPeekStrip {
      width: 12px;
      height: 100%;
      border-left: 1px solid var(--border-window);
      background: linear-gradient(180deg, transparent, rgba(46, 196, 182, 0.12));
      cursor: pointer;
      transition: background-color 0.15s;
      flex-shrink: 0;
    }
    #AeroPeekStrip:hover {
      background: var(--accent);
    }

    /* ==========================================================================
       文件资源管理器：严格 Windows 详细信息左对齐连续列规范
       右侧留白与行间留白均为框选背景，绝不把最后一列拉伸贴边
       ========================================================================== */
    .fe-viewport {
      position: relative;
      flex: 1;
      overflow: auto;
      background: var(--bg-surface-solid);
      user-select: none;
    }

    .fe-detail-header {
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      align-items: center;
      min-width: 100%;
      width: max-content;
      height: 32px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-hairline);
    }

    .fe-col-th {
      position: relative;
      height: 100%;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: left;
      flex-shrink: 0;
      cursor: pointer;
      border-right: 1px solid var(--border-hairline);
      transition: background-color 0.12s, color 0.12s;
    }
    .fe-col-th:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .fe-col-th.drag-over-col {
      background: var(--accent-soft);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .fe-col-resizer {
      position: absolute;
      right: -4px;
      top: 0;
      bottom: 0;
      width: 9px;
      cursor: col-resize;
      z-index: 4;
      touch-action: none;
    }
    .fe-col-resizer:hover::after,
    .fe-col-resizer.resizing::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--accent);
    }

    /* 详细信息列表体：align-items: flex-start 确保每行只占各列总宽，右侧空白可框选 */
    .fe-detail-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 4px 6px 36px 6px;
      min-height: calc(100% - 34px);
    }
    .fe-detail-row {
      display: inline-flex;
      align-items: center;
      width: max-content;
      height: 30px;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .fe-detail-row:hover {
      background: var(--bg-hover);
    }
    .fe-detail-row.selected {
      background: var(--accent-soft);
      border-color: var(--border-strong);
    }
    .fe-detail-row.drop-target-hover {
      background: var(--amber-soft);
      border-color: var(--amber);
    }
    .fe-detail-cell {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      height: 100%;
      flex-shrink: 0;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
    }

    /* 图标缩略图网格视图 */
    .fe-grid-body {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      padding: 12px 12px 42px 12px;
      min-height: 100%;
    }
    .fe-grid-card {
      width: 104px;
      padding: 10px 8px 8px;
      border-radius: var(--ctl-radius);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color 0.12s, border-color 0.12s;
    }
    .fe-grid-card:hover { background: var(--bg-hover); }
    .fe-grid-card.selected {
      background: var(--accent-soft);
      border-color: var(--border-strong);
    }
    .fe-grid-card.drop-target-hover {
      background: var(--amber-soft);
      border-color: var(--amber);
    }

    /* 分栏视图 (Miller Columns) */
    .fe-columns-wrap {
      display: flex;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .fe-miller-col {
      width: 220px;
      min-width: 200px;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid var(--border-hairline);
      padding: 6px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       条漫阅读器（Manga Webtoon Viewer）物理阻尼与沉浸全屏架构
       ========================================================================== */
    .manga-root {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      overscroll-behavior-y: none;
      contain: layout style;
    }
    .manga-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      contain: layout style;
      cursor: grab;
    }
    .manga-viewport.grabbing {
      cursor: grabbing;
    }
    .manga-stream {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000000;
    }
    .manga-slot {
      width: 100%;
      background: #07090b;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .manga-slot.skeleton {
      aspect-ratio: 800 / 1130;
      background: linear-gradient(110deg, #06080a 25%, #10151b 45%, #06080a 65%);
      background-size: 220% 100%;
      animation: skeletonPulse 1.5s linear infinite;
    }
    .manga-slot img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    @keyframes skeletonPulse {
      from { background-position: 200% 0; }
      to { background-position: -20% 0; }
    }

    /* 漫画沉浸式全屏：隐藏窗口标题栏与一切外围控件，仅留右上角隐蔽退出按钮 */
    .os-window.manga-immersive-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 99999 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: #000 !important;
    }
    .os-window.manga-immersive-fullscreen .win-titlebar,
    .os-window.manga-immersive-fullscreen .manga-toolbar,
    .os-window.manga-immersive-fullscreen .win-resizer,
    .manga-root:fullscreen .manga-toolbar {
      display: none !important;
    }
    .manga-fs-exit-btn {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 100001;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 18, 22, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s, background-color 0.2s, color 0.2s;
    }
    .manga-fs-exit-btn:hover {
      background: rgba(229, 83, 75, 0.85);
      color: #fff;
    }
    .os-window.manga-immersive-fullscreen .manga-fs-exit-btn,
    .manga-root:fullscreen .manga-fs-exit-btn {
      display: flex !important;
    }

    /* ==========================================================================
       通用按钮、菜单、弹窗与暗色加载遮罩（杜绝 iframe 白屏闪烁）
       ========================================================================== */
    .ui-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 29px;
      padding: 0 10px;
      border-radius: var(--ctl-radius);
      border: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }
    .ui-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }
    .ui-btn.primary {
      background: var(--accent);
      color: var(--text-on-accent);
      border-color: transparent;
      font-weight: 600;
    }
    .ui-btn.primary:hover {
      background: var(--accent-strong);
      box-shadow: 0 0 14px var(--accent-glow);
    }
    .ui-btn.danger:hover {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .ui-input, .ui-select {
      height: 29px;
      padding: 0 9px;
      border-radius: var(--ctl-radius);
      border: 1px solid var(--border-hairline);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.14s;
    }
    .ui-input:focus, .ui-select:focus {
      border-color: var(--accent);
    }

    /* iframe 暗色系统遮罩与星晷旋转动画 */
    .iframe-dark-shield {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: #0d1117;
      color: #98a9b9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.24s ease;
    }
    .iframe-dark-shield.hidden-shield {
      opacity: 0;
      pointer-events: none;
    }
    .astrolabe-spinner {
      width: 34px;
      height: 34px;
      animation: spinAstrolabe 1.15s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite;
      color: var(--accent);
    }
    @keyframes spinAstrolabe {
      to { transform: rotate(360deg); }
    }

    /* 上下文右键菜单 */
    #context-menu {
      position: fixed;
      z-index: 99500;
      min-width: 196px;
      padding: 5px;
      border-radius: var(--win-radius);
      background: var(--bg-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-window);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      display: none;
    }
    .ctx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: var(--ctl-radius);
      font-size: 12.5px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .ctx-item:hover {
      background: var(--bg-hover);
      color: var(--accent-strong);
    }
    .ctx-item.danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .ctx-sep {
      height: 1px;
      margin: 4px 6px;
      background: var(--border-hairline);
    }

    /* 开始菜单与日历浮层 */
    #start-menu-panel, #calendar-popover {
      position: fixed;
      z-index: 9800;
      background: var(--bg-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-window);
      border-radius: var(--win-radius);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
      display: none;
      animation: popUp 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes popUp {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* CodeMirror 容器自适应填满 */
    .cm-host-wrap .CodeMirror {
      height: 100% !important;
      font-family: 'JetBrains Mono', 'Noto Sans SC', monospace !important;
      font-size: 13.5px;
      line-height: 1.58;
    }

    /* 移动端与平板响应式适配 (底部悬浮 Dock 导航栏模式) */
    @media (max-width: 768px) {
      :root {
        --taskbar-h: 58px;
      }
      #taskbar {
        padding: 0 6px;
        border-top: 1px solid var(--border-strong);
      }
      #start-btn .start-label-text {
        display: none;
      }
      .tb-app-pill {
        max-width: 46px;
        padding: 0 11px;
        justify-content: center;
      }
      .tb-app-pill .tb-pill-title,
      .tb-app-pill .tb-pill-close {
        display: none;
      }
      .win-titlebar {
        height: 44px;
        min-height: 44px;
      }
      .win-ctl-btn {
        width: 38px;
        height: 34px;
      }
      .desktop-icon {
        width: 78px;
      }
      #start-menu-panel {
        left: 8px !important;
        right: 8px !important;
        width: auto !important;
        bottom: calc(var(--taskbar-h) + 8px) !important;
      }
      #calendar-popover {
        right: 8px !important;
        left: 8px !important;
        width: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="os-root">
    <!-- 壁纸与曜刻星轨网格层 -->
    <div id="wallpaper-layer"></div>
    <div id="wallpaper-reticle"></div>

    <!-- 桌面主舞台 -->
    <main id="desktop-stage">
      <div id="desktop-icons-layer"></div>
      <div id="desktop-marquee" class="marquee-box"></div>
      <div id="aero-snap-preview"></div>
      <div id="windows-layer"></div>
    </main>

    <!-- 开始菜单浮层 -->
    <section id="start-menu-panel" class="w-[460px] max-h-[80vh] flex flex-col overflow-hidden" style="left: 10px; bottom: calc(var(--taskbar-h) + 8px);"></section>

    <!-- 交互式日历浮层 -->
    <section id="calendar-popover" class="w-[310px] p-4" style="right: 12px; bottom: calc(var(--taskbar-h) + 8px);"></section>

    <!-- 任务栏 Aero Peek 悬停预览卡 -->
    <div id="taskbar-peek-card" class="fixed z-[9850] hidden p-2.5 w-[210px]" style="background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--win-radius); box-shadow: 0 14px 36px rgba(0,0,0,0.55); bottom: calc(var(--taskbar-h) + 8px);"></div>

    <!-- 底部任务栏 / 移动端自适应 Dock -->
    <footer id="taskbar">
      <div class="tb-left">
        <button id="start-btn" title="晷枢启动器">
          <span id="start-btn-icon" class="w-4 h-4 flex items-center justify-center"></span>
          <span class="start-label-text">晷枢</span>
        </button>
        <div id="tb-pinned-bar" class="flex items-center gap-1"></div>
      </div>

      <div id="tb-running-tasks" class="tb-tasks"></div>

      <div class="tb-right">

    <!-- 全局右键菜单 -->
    <div id="context-menu"></div>

      <span id="global-io-spinner" class="w-4 h-4 flex items-center justify-center"></span>
      <span id="global-io-text">正在访问文件系统...</span>

    <!-- 隐藏的全局文件选择器 -->

    /* ==========================================================================
       第二部分：Cookie + localStorage + IndexedDB + OPFS 四级协同与统一 VFS 架构
       核心原则：
       1. 所有路径（虚拟卷、双存储卷、/mnt/local/* 本地挂载目录）统一经由挂载路由表分发，
          上层代码透明调用同一套 window.fs API，无任何特殊路径分支判断。
       2. 严格保留文件与目录的修改日期（mtime），移动、拖拽、解压、跨卷复制均不丢失原始时间戳。
       3. 所有方法同时支持 Promise (async/await) 与多参数兼容 Node 风格 callback。
       ========================================================================== */

    const CookieStore = {
      set(key, val, days = 365) {
        try {
          const exp = new Date(Date.now() + days * 864e5).toUTCString();
          document.cookie = `${encodeURIComponent(key)}=${encodeURIComponent(String(val))}; expires=${exp}; path=/; SameSite=Lax`;
        } catch (_) {}
      },
      get(key) {
        try {
          const prefix = encodeURIComponent(key) + '=';
          const parts = document.cookie ? document.cookie.split('; ') : [];
          for (const p of parts) {
            if (p.startsWith(prefix)) return decodeURIComponent(p.slice(prefix.length));
          }
        } catch (_) {}
        return null;
      },
      clearAll() {
        try {
          const parts = document.cookie ? document.cookie.split('; ') : [];
          for (const p of parts) {
            const eq = p.indexOf('=');
            const name = eq > -1 ? p.slice(0, eq) : p;
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
          }
        } catch (_) {}
      }
    };

    const PathUtils = {
      normalize(p) {
        if (!p || typeof p !== 'string') return '/';
        const cleaned = p.replace(/\\/g, '/').trim();
        const segs = [];
        for (const part of cleaned.split('/')) {
          if (!part || part === '.') continue;
          if (part === '..') segs.pop();
          else segs.push(part);
        }
        return '/' + segs.join('/');
      },
      dirname(p) {
        const n = this.normalize(p);
        if (n === '/') return '/';
        const idx = n.lastIndexOf('/');
        return idx <= 0 ? '/' : n.slice(0, idx);
      },
      basename(p) {
        const n = this.normalize(p);
        if (n === '/') return '';
        return n.slice(n.lastIndexOf('/') + 1);
      },
      extname(p) {
        const b = this.basename(p);
        const lower = b.toLowerCase();
        if (lower.endsWith('.tar.gz')) return '.tar.gz';
        const dot = b.lastIndexOf('.');
        return dot > 0 ? b.slice(dot).toLowerCase() : '';
      },
      join(...parts) {
        return this.normalize(parts.filter(Boolean).join('/'));
      }
    };

    /* MIME 与文件类型描述表（覆盖浏览器全原生格式） */
    const FileTypes = {
      mimeMap: {
        '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.gif': 'image/gif',
        '.webp': 'image/webp', '.svg': 'image/svg+xml', '.bmp': 'image/bmp', '.ico': 'image/x-icon', '.avif': 'image/avif',
        '.mp3': 'audio/mpeg', '.wav': 'audio/wav', '.ogg': 'audio/ogg', '.flac': 'audio/flac', '.aac': 'audio/aac', '.m4a': 'audio/mp4',
        '.mp4': 'video/mp4', '.webm': 'video/webm', '.ogv': 'video/ogg', '.mov': 'video/quicktime',
        '.html': 'text/html', '.htm': 'text/html', '.css': 'text/css', '.js': 'text/javascript', '.mjs': 'text/javascript',
        '.json': 'application/json', '.xml': 'application/xml', '.md': 'text/markdown', '.markdown': 'text/markdown',
        '.yaml': 'text/yaml', '.yml': 'text/yaml', '.txt': 'text/plain', '.log': 'text/plain', '.ini': 'text/plain', '.sh': 'text/plain',
        '.csv': 'text/csv', '.tsv': 'text/tab-separated-values',
        '.pdf': 'application/pdf',
        '.zip': 'application/zip', '.gz': 'application/gzip', '.tar': 'application/x-tar',
        '.tgz': 'application/gzip', '.tar.gz': 'application/gzip', '.7z': 'application/x-7z-compressed',
        '.iso': 'application/x-iso9660-image', '.img': 'application/octet-stream', '.fda': 'application/octet-stream', '.bin': 'application/octet-stream'
      },
      getMime(filename) {
        const ext = PathUtils.extname(filename);
        return this.mimeMap[ext] || 'application/octet-stream';
      },
      getCategory(filename, isDir = false) {
        if (isDir) return 'folder';
        const ext = PathUtils.extname(filename);
        if (['.png','.jpg','.jpeg','.gif','.webp','.svg','.bmp','.ico','.avif'].includes(ext)) return 'image';
        if (['.mp3','.wav','.ogg','.flac','.aac','.m4a'].includes(ext)) return 'audio';
        if (['.mp4','.webm','.ogv','.mov'].includes(ext)) return 'video';
        if (['.csv','.tsv'].includes(ext)) return 'table';
        if (['.html','.htm'].includes(ext)) return 'html';
        if (['.css','.js','.mjs','.json','.xml','.md','.markdown','.yaml','.yml'].includes(ext)) return 'code';
        if (['.txt','.log','.ini','.sh'].includes(ext)) return 'text';
        if (ext === '.pdf') return 'pdf';
        if (['.zip','.gz','.tar','.tgz','.tar.gz','.7z','.rar','.xz','.bz2'].includes(ext)) return 'archive';
        if (['.iso','.img','.fda','.bin','.hda'].includes(ext)) return 'vm';
        return 'other';
      },
      getTypeLabel(filename, isDir = false) {
        if (isDir) return '文件夹';
        const ext = PathUtils.extname(filename);
        const labels = {
          '.png': 'PNG 图像', '.jpg': 'JPEG 图像', '.jpeg': 'JPEG 图像', '.gif': 'GIF 动图',
          '.webp': 'WebP 图像', '.svg': 'SVG 矢量图', '.bmp': 'BMP 位图', '.ico': '图标文件', '.avif': 'AVIF 图像',
          '.mp3': 'MP3 音频', '.wav': 'WAV 无损音频', '.ogg': 'OGG 音频', '.flac': 'FLAC 无损音频', '.aac': 'AAC 音频',
          '.mp4': 'MP4 视频', '.webm': 'WebM 视频', '.ogv': 'OGV 视频',
          '.html': 'HTML 网页文档', '.htm': 'HTML 网页文档', '.css': 'CSS 样式表',
          '.js': 'JavaScript 脚本', '.mjs': 'ES 模块脚本', '.json': 'JSON 数据',
          '.md': 'Markdown 文档', '.markdown': 'Markdown 文档', '.xml': 'XML 文档',
          '.yaml': 'YAML 配置', '.yml': 'YAML 配置', '.txt': '文本文档', '.log': '日志文件',
          '.csv': 'CSV 表格文件', '.tsv': 'TSV 制表文件', '.pdf': 'PDF 文档',
          '.zip': 'ZIP 压缩归档', '.7z': '7-Zip 压缩归档', '.tar': 'TAR 归档',
          '.gz': 'GZIP 压缩包', '.tgz': 'TGZ 压缩归档', '.tar.gz': 'TAR.GZ 归档',
          '.iso': 'ISO 光盘镜像', '.img': '磁盘软盘镜像', '.fda': '软盘镜像', '.bin': '二进制镜像'
        };
        return labels[ext] || (ext ? `${ext.slice(1).toUpperCase()} 文件` : '通用数据文件');
      },
      getIconSvg(filename, isDir = false, fullPath = '') {
        if (isDir) {
          if (fullPath && fullPath.startsWith('/mnt/local')) return Icons.folderMount;
          return Icons.folder;
        }
        const cat = this.getCategory(filename, false);
        switch (cat) {
          case 'image': return `<span style="color:#48cae4">${Icons.image}</span>`;
          case 'audio':
          case 'video': return `<span style="color:#f4a261">${Icons.media}</span>`;
          case 'table': return `<span style="color:#52b788">${Icons.table}</span>`;
          case 'html':
          case 'code': return `<span style="color:#2ec4b6">${Icons.code}</span>`;
          case 'pdf': return `<span style="color:#e5534b">${Icons.pdf}</span>`;
          case 'archive': return `<span style="color:#d9a05b">${Icons.archive}</span>`;
          case 'vm': return `<span style="color:#9d8df1">${Icons.vm}</span>`;
          default: return `<span style="color:#98a9b9">${Icons.notepad}</span>`;
        }
      }
    };

    /* 自然数字比较器 (1.jpg -> 2.jpg -> 10.jpg) */
    const naturalCollator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
    function naturalCompare(a, b) {
      return naturalCollator.compare(String(a), String(b));
    }

    /* 二进制与文本辅助转换（统一采用浏览器原生 Uint8Array / ArrayBuffer） */
    function toUint8Array(data) {
      if (data instanceof Uint8Array) return data;
      if (data instanceof ArrayBuffer) return new Uint8Array(data);
      if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      if (typeof data === 'string') return new TextEncoder().encode(data);
      return new Uint8Array(0);
    }

    async function normalizeWritePayload(data) {
      if (data instanceof Blob) {
        const ab = await data.arrayBuffer();
        return new Uint8Array(ab);
      }
      return toUint8Array(data);
    }

    /* ==========================================================================
       IndexedDB 核心数据库（同时承担：
       1. VFS 元数据时间戳日志 meta_journal —— 保证 OPFS/挂载移动不丢 mtime
       2. IndexedDB VFS 完整文件系统存储后端 idb_nodes
       3. 本地挂载句柄持久化表 mount_handles）
       ========================================================================== */
    class CoreIDB {
      constructor() {
        this.dbName = 'GuishuOS_CoreStorage_v1';
        this.dbPromise = null;
      }
      open() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('meta_journal')) {
              db.createObjectStore('meta_journal', { keyPath: 'key' });
            }
            if (!db.objectStoreNames.contains('idb_nodes')) {
              const store = db.createObjectStore('idb_nodes', { keyPath: 'path' });
              store.createIndex('by_parent', 'parent', { unique: false });
            }
            if (!db.objectStoreNames.contains('mount_handles')) {
              db.createObjectStore('mount_handles', { keyPath: 'name' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return this.dbPromise;
      }
      async tx(storeName, mode, fn) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(storeName, mode);
          const store = transaction.objectStore(storeName);
          let res;
          try {
            res = fn(store, transaction);
          } catch (err) {
            reject(err);
            return;
          }
          if (res && typeof res.onsuccess !== 'undefined') {
            res.onsuccess = () => resolve(res.result);
            res.onerror = () => reject(res.error);
          } else {
            transaction.oncomplete = () => resolve(res);
            transaction.onerror = () => reject(transaction.error);
          }
        });
      }
      async getMeta(key) {
        try { return await this.tx('meta_journal', 'readonly', s => s.get(key)); }
        catch (_) { return null; }
      }
      async setMeta(key, mtime, ctime) {
        const now = Date.now();
        try {
          await this.tx('meta_journal', 'readwrite', s => s.put({
            key,
            mtime: typeof mtime === 'number' && !Number.isNaN(mtime) ? mtime : now,
            ctime: typeof ctime === 'number' && !Number.isNaN(ctime) ? ctime : (mtime || now)
          }));
        } catch (_) {}
      }
      async deleteMetaPrefix(prefix) {
        try {
          const db = await this.open();
          await new Promise((resolve) => {
            const tx = db.transaction('meta_journal', 'readwrite');
            const store = tx.objectStore('meta_journal');
            const req = store.openCursor();
            req.onsuccess = (ev) => {
              const cursor = ev.target.result;
              if (cursor) {
                if (cursor.key === prefix || String(cursor.key).startsWith(prefix + '/')) {
                  cursor.delete();
                }
                cursor.continue();
              }
            };
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch (_) {}
      }
    }

    const coreIDB = new CoreIDB();

    /* ==========================================================================
       统一目录句柄后端驱动（同时服务于 OPFS 原生根目录 与 File System Access API 本地挂载目录！）
       注意：OPFS 的 FileSystemDirectoryHandle 与 showDirectoryPicker 返回的
       FileSystemDirectoryHandle 遵循完全一致的 W3C File System 标准接口！
       因此同一个 HandleFSDriver 无缝驱动 OPFS 与 /mnt/local/*，天然实现 100% 架构同构！
       ========================================================================== */
    class HandleFSDriver {
      constructor(rootHandle, driverNamespace) {
        this.root = rootHandle;
        this.ns = driverNamespace; // 例如 'opfs' 或 'mnt:FolderName'
      }

      metaKey(relPath) {
        return `${this.ns}:${PathUtils.normalize(relPath)}`;
      }

      async _resolveParentAndName(relPath, createParents = false) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return { parent: null, name: '', norm: '/' };
        const segs = norm.slice(1).split('/');
        const name = segs.pop();
        let dir = this.root;
        for (const seg of segs) {
          dir = await dir.getDirectoryHandle(seg, { create: createParents });
        }
        return { parent: dir, name, norm };
      }

      async _getHandle(relPath) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return { kind: 'directory', handle: this.root };
        const { parent, name } = await this._resolveParentAndName(norm, false);
        try {
          const fh = await parent.getFileHandle(name, { create: false });
          return { kind: 'file', handle: fh };
        } catch (fileErr) {
          const dh = await parent.getDirectoryHandle(name, { create: false });
          return { kind: 'directory', handle: dh };
        }
      }

      async exists(relPath) {
        try {
          await this._getHandle(relPath);
          return true;
        } catch (_) {
          return false;
        }
      }

      async stat(relPath) {
        const norm = PathUtils.normalize(relPath);
        const entry = await this._getHandle(norm);
        const savedMeta = await coreIDB.getMeta(this.metaKey(norm));
        if (entry.kind === 'directory') {
          const mtime = savedMeta ? savedMeta.mtime : Date.now();
          if (!savedMeta) coreIDB.setMeta(this.metaKey(norm), mtime, mtime);
          return {
            name: PathUtils.basename(norm) || '/',
            isDirectory: () => true,
            isFile: () => false,
            kind: 'directory',
            size: 0,
            mtime,
            ctime: savedMeta ? savedMeta.ctime : mtime
          };
        } else {
          const file = await entry.handle.getFile();
          const mtime = savedMeta ? savedMeta.mtime : file.lastModified;
          return {
            name: file.name,
            isDirectory: () => false,
            isFile: () => true,
            kind: 'file',
            size: file.size,
            mime: file.type || FileTypes.getMime(file.name),
            mtime,
            ctime: savedMeta ? savedMeta.ctime : file.lastModified
          };
        }
      }

      async readdir(relPath, withDetails = false) {
        const norm = PathUtils.normalize(relPath);
        const entry = await this._getHandle(norm);
        if (entry.kind !== 'directory') throw new Error(`ENOTDIR: 非目录路径 ${norm}`);
        const names = [];
        const detailed = [];
        for await (const [name, handle] of entry.handle.entries()) {
          if (name === '.guishu_keep') continue;
          names.push(name);
          if (withDetails) {
            const childRel = PathUtils.join(norm, name);
            const savedMeta = await coreIDB.getMeta(this.metaKey(childRel));
            if (handle.kind === 'directory') {
              const mtime = savedMeta ? savedMeta.mtime : Date.now();
              detailed.push({
                name,
                kind: 'directory',
                isDirectory: () => true,
                isFile: () => false,
                size: 0,
                mtime
              });
            } else {
              try {
                const f = await handle.getFile();
                const mtime = savedMeta ? savedMeta.mtime : f.lastModified;
                detailed.push({
                  name,
                  kind: 'file',
                  isDirectory: () => false,
                  isFile: () => true,
                  size: f.size,
                  mime: f.type || FileTypes.getMime(name),
                  mtime
                });
              } catch (_) {
                detailed.push({
                  name,
                  kind: 'file',
                  isDirectory: () => false,
                  isFile: () => true,
                  size: 0,
                  mtime: Date.now()
                });
              }
            }
          }
        }
        return withDetails ? detailed : names;
      }

      async readFile(relPath, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const entry = await this._getHandle(norm);
        if (entry.kind !== 'file') throw new Error(`EISDIR: 无法作为文件读取目录 ${norm}`);
        const file = await entry.handle.getFile();
        const encoding = typeof options === 'string' ? options : (options && options.encoding);
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return await file.text();
        }
        if (options && options.asBlob) {
          return file;
        }
        const ab = await file.arrayBuffer();
        return new Uint8Array(ab);
      }

      async writeFile(relPath, data, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const { parent, name } = await this._resolveParentAndName(norm, true);
        if (!parent || !name) throw new Error('EINVAL: 无效文件路径');
        const bytes = await normalizeWritePayload(data);
        const fh = await parent.getFileHandle(name, { create: true });
        const writable = await fh.createWritable();
        await writable.write(bytes);
        await writable.close();
        const mtime = (options && typeof options.mtime === 'number') ? options.mtime : Date.now();
        const ctime = (options && typeof options.ctime === 'number') ? options.ctime : mtime;
        await coreIDB.setMeta(this.metaKey(norm), mtime, ctime);
        return true;
      }

      async mkdir(relPath, options = {}) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return true;
        const segs = norm.slice(1).split('/');
        let dir = this.root;
        let built = '';
        for (const seg of segs) {
          built += '/' + seg;
          dir = await dir.getDirectoryHandle(seg, { create: true });
          const existing = await coreIDB.getMeta(this.metaKey(built));
          if (!existing) {
            const mtime = (options && typeof options.mtime === 'number') ? options.mtime : Date.now();
            await coreIDB.setMeta(this.metaKey(built), mtime, mtime);
          }
        }
        return true;
      }

      async unlink(relPath) {
        const norm = PathUtils.normalize(relPath);
        const { parent, name } = await this._resolveParentAndName(norm, false);
        if (!parent || !name) throw new Error('EPERM: 无法删除根目录');
        await parent.removeEntry(name, { recursive: false });
        await coreIDB.deleteMetaPrefix(this.metaKey(norm));
        return true;
      }

      async rmdir(relPath, options = { recursive: true }) {
        const norm = PathUtils.normalize(relPath);
        const { parent, name } = await this._resolveParentAndName(norm, false);
        if (!parent || !name) throw new Error('EPERM: 无法删除挂载根目录');
        const rec = options && typeof options.recursive === 'boolean' ? options.recursive : true;
        await parent.removeEntry(name, { recursive: rec });
        await coreIDB.deleteMetaPrefix(this.metaKey(norm));
        return true;
      }

      async utimes(relPath, atime, mtime) {
        const norm = PathUtils.normalize(relPath);
        const ts = typeof mtime === 'number' ? mtime : (mtime instanceof Date ? mtime.getTime() : Date.now());
        await coreIDB.setMeta(this.metaKey(norm), ts, ts);
        return true;
      }
    }

    /* ==========================================================================
       IndexedDB 完整文件系统驱动后端（与 HandleFSDriver 方法签名 100% 对等）
       ========================================================================== */
    class IndexedDBFSDriver {
      constructor() {
        this.ns = 'idb';
        this.readyPromise = this._ensureRoot();
      }

      async _ensureRoot() {
        const root = await coreIDB.tx('idb_nodes', 'readonly', s => s.get('/'));
        if (!root) {
          const now = Date.now();
          await coreIDB.tx('idb_nodes', 'readwrite', s => s.put({
            path: '/',
            parent: '',
            name: '',
            kind: 'directory',
            size: 0,
            mtime: now,
            ctime: now
          }));
        }
      }

      async _getNode(relPath) {
        await this.readyPromise;
        const norm = PathUtils.normalize(relPath);
        return await coreIDB.tx('idb_nodes', 'readonly', s => s.get(norm));
      }

      async exists(relPath) {
        const node = await this._getNode(relPath);
        return !!node;
      }

      async stat(relPath) {
        const norm = PathUtils.normalize(relPath);
        const node = await this._getNode(norm);
        if (!node) throw new Error(`ENOENT: 路径不存在 ${norm}`);
        const isDir = node.kind === 'directory';
        return {
          name: node.name || '/',
          kind: node.kind,
          isDirectory: () => isDir,
          isFile: () => !isDir,
          size: isDir ? 0 : (node.size || 0),
          mime: isDir ? '' : (node.mime || FileTypes.getMime(node.name)),
          mtime: node.mtime || Date.now(),
          ctime: node.ctime || node.mtime || Date.now()
        };
      }

      async readdir(relPath, withDetails = false) {
        const norm = PathUtils.normalize(relPath);
        const node = await this._getNode(norm);
        if (!node) throw new Error(`ENOENT: 目录不存在 ${norm}`);
        if (node.kind !== 'directory') throw new Error(`ENOTDIR: 非目录 ${norm}`);

        const db = await coreIDB.open();
        const children = await new Promise((resolve, reject) => {
          const tx = db.transaction('idb_nodes', 'readonly');
          const idx = tx.objectStore('idb_nodes').index('by_parent');
          const req = idx.getAll(IDBKeyRange.only(norm));
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });

        if (!withDetails) return children.map(c => c.name);
        return children.map(c => {
          const isDir = c.kind === 'directory';
          return {
            name: c.name,
            kind: c.kind,
            isDirectory: () => isDir,
            isFile: () => !isDir,
            size: isDir ? 0 : (c.size || 0),
            mime: isDir ? '' : (c.mime || FileTypes.getMime(c.name)),
            mtime: c.mtime || Date.now()
          };
        });
      }

      async mkdir(relPath, options = {}) {
        await this.readyPromise;
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return true;
        const segs = norm.slice(1).split('/');
        let curr = '';
        for (const seg of segs) {
          const parent = curr || '/';
          curr += '/' + seg;
          const existing = await this._getNode(curr);
          if (!existing) {
            const mtime = (options && typeof options.mtime === 'number') ? options.mtime : Date.now();
            await coreIDB.tx('idb_nodes', 'readwrite', s => s.put({
              path: curr,
              parent,
              name: seg,
              kind: 'directory',
              size: 0,
              mtime,
              ctime: mtime
            }));
          }
        }
        return true;
      }

      async readFile(relPath, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const node = await this._getNode(norm);
        if (!node) throw new Error(`ENOENT: 文件不存在 ${norm}`);
        if (node.kind !== 'file') throw new Error(`EISDIR: 目标是目录 ${norm}`);
        const bytes = toUint8Array(node.data || new Uint8Array(0));
        const encoding = typeof options === 'string' ? options : (options && options.encoding);
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return new TextDecoder().decode(bytes);
        }
        if (options && options.asBlob) {
          return new Blob([bytes], { type: node.mime || FileTypes.getMime(node.name) });
        }
        return bytes;
      }

      async writeFile(relPath, data, options = {}) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') throw new Error('EISDIR: 无法写入根目录');
        const parent = PathUtils.dirname(norm);
        await this.mkdir(parent);
        const bytes = await normalizeWritePayload(data);
        const existing = await this._getNode(norm);
        const now = Date.now();
        const mtime = (options && typeof options.mtime === 'number') ? options.mtime : now;
        const ctime = existing ? existing.ctime : ((options && typeof options.ctime === 'number') ? options.ctime : mtime);
        const name = PathUtils.basename(norm);
        await coreIDB.tx('idb_nodes', 'readwrite', s => s.put({
          path: norm,
          parent,
          name,
          kind: 'file',
          data: bytes,
          size: bytes.byteLength,
          mime: FileTypes.getMime(name),
          mtime,
          ctime
        }));
        return true;
      }

      async unlink(relPath) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') throw new Error('EPERM');
        await coreIDB.tx('idb_nodes', 'readwrite', s => s.delete(norm));
        return true;
      }

      async rmdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') throw new Error('EPERM');
        const db = await coreIDB.open();
        await new Promise((resolve, reject) => {
          const tx = db.transaction('idb_nodes', 'readwrite');
          const store = tx.objectStore('idb_nodes');
          const req = store.openCursor();
          req.onsuccess = (e) => {
            const cur = e.target.result;
            if (cur) {
              if (cur.key === norm || String(cur.key).startsWith(norm + '/')) {
                cur.delete();
              }
              cur.continue();
            }
          };
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
        return true;
      }

      async utimes(relPath, atime, mtime) {
        const norm = PathUtils.normalize(relPath);
        const node = await this._getNode(norm);
        if (!node) throw new Error(`ENOENT: ${norm}`);
        node.mtime = typeof mtime === 'number' ? mtime : Date.now();
        await coreIDB.tx('idb_nodes', 'readwrite', s => s.put(node));
        return true;
      }
    }

    /* ==========================================================================
       统一虚拟文件系统路由器 (Unified VFS Router -> window.fs)
       支持：
       - 主根 `/` 动态绑定 OPFS 或 IndexedDB（设置页随时无缝切换，异常自动降级）
       - `/storage/opfs` 与 `/storage/idb` 双后端同时直通访问
       - `/mnt/local/<目录名>` 多本地目录动态挂载与卸载
       - 全方法多参数签名兼容（Promise + 可选中间参数 + callback 自动识别）
       - 跨卷/目录移动与复制 100% 保留原始修改时间戳 mtime
       - 目录实际递归大小缓存与变更事件广播
       ========================================================================== */
    class UnifiedVFS {
      constructor() {
        this.drivers = new Map(); // mountPoint -> driver
        this.opfsDriver = null;
        this.idbDriver = new IndexedDBFSDriver();
        this.opfsSupported = false;
        this.primaryBackend = CookieStore.get('guishu_backend') || localStorage.getItem('guishu_backend') || 'opfs';
        this.listeners = new Set();
        this.dirSizeCache = new Map();
        this.pendingMounts = []; // 刷新后等待一键恢复授权的本地目录句柄
      }

      async init() {
        // 1. 初始化 OPFS 原生私有文件系统（带健壮降级）
        if (navigator.storage && typeof navigator.storage.getDirectory === 'function') {
          try {
            const opfsRoot = await navigator.storage.getDirectory();
            this.opfsDriver = new HandleFSDriver(opfsRoot, 'opfs');
            this.opfsSupported = true;
          } catch (err) {
            console.warn('OPFS 不可用，自动降级至 IndexedDB 存储引擎:', err);
            this.opfsSupported = false;
          }
        }
        if (!this.opfsSupported) {
          this.primaryBackend = 'idb';
        }

        this._rebuildStaticMounts();

        // 2. 确保标准系统目录在两个后端均已就绪
        const stdDirs = ['/Desktop', '/Documents', '/Pictures', '/Pictures/Wallpapers', '/Music', '/Videos', '/Downloads', '/mnt', '/mnt/local'];
        for (const d of stdDirs) {
          if (this.opfsDriver) await this.opfsDriver.mkdir(d).catch(() => {});
          await this.idbDriver.mkdir(d).catch(() => {});
        }

        // 3. 检查此前持久化的本地挂载目录句柄（用于启动后提示用户重新授权恢复挂载）
        try {
          const savedHandles = await coreIDB.tx('mount_handles', 'readonly', s => s.getAll());
          if (Array.isArray(savedHandles) && savedHandles.length > 0) {
            this.pendingMounts = savedHandles;
          }
        } catch (_) {}
      }

      _rebuildStaticMounts() {
        // 保留已挂载的 /mnt/local/*
        const dynamicMounts = [];
        for (const [mp, drv] of this.drivers.entries()) {
          if (mp.startsWith('/mnt/local/')) dynamicMounts.push([mp, drv]);
        }
        this.drivers.clear();

        const primaryDrv = (this.primaryBackend === 'opfs' && this.opfsDriver) ? this.opfsDriver : this.idbDriver;
        this.drivers.set('/', primaryDrv);
        if (this.opfsDriver) this.drivers.set('/storage/opfs', this.opfsDriver);
        this.drivers.set('/storage/idb', this.idbDriver);

        for (const [mp, drv] of dynamicMounts) {
          this.drivers.set(mp, drv);
        }
      }

      setPrimaryBackend(mode) {
        if (mode === 'opfs' && !this.opfsSupported) {
          throw new Error('当前浏览器环境不支持 OPFS，已保持 IndexedDB 引擎');
        }
        this.primaryBackend = mode;
        localStorage.setItem('guishu_backend', mode);
        CookieStore.set('guishu_backend', mode);
        this._rebuildStaticMounts();
        this.invalidateCache();
        this.emitChange('/');
      }

      /* 最长前缀挂载点路由解析 */
      resolve(fullPath) {
        const norm = PathUtils.normalize(fullPath);
        let bestMount = '/';
        for (const mp of this.drivers.keys()) {
          if (mp === '/') continue;
          if (norm === mp || norm.startsWith(mp + '/')) {
            if (mp.length > bestMount.length) bestMount = mp;
          }
        }
        const driver = this.drivers.get(bestMount);
        const relPath = bestMount === '/' ? norm : (norm.slice(bestMount.length) || '/');
        return { norm, mountPoint: bestMount, driver, relPath };
      }

      /* 挂载本地真实目录到 /mnt/local/<文件夹名> */
      async mountLocalDirectory(existingHandle = null) {
        if (!existingHandle && typeof window.showDirectoryPicker !== 'function') {
          throw new Error('当前浏览器不支持 File System Access API (showDirectoryPicker)');
        }
        const dirHandle = existingHandle || await window.showDirectoryPicker({ mode: 'readwrite' });
        if (existingHandle && typeof dirHandle.requestPermission === 'function') {
          const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
          if (perm !== 'granted') throw new Error('未获得本地文件夹读写授权');
        }
        let mountName = dirHandle.name.replace(/[\\/]/g, '_');
        let mountPath = PathUtils.join('/mnt/local', mountName);
        let suffix = 2;
        while (!existingHandle && this.drivers.has(mountPath)) {
          mountPath = PathUtils.join('/mnt/local', `${mountName}_${suffix++}`);
        }
        const finalFolderName = PathUtils.basename(mountPath);

        // 在主卷创建挂载点空壳目录以便父目录 /mnt/local 枚举可见
        const rootDrv = this.drivers.get('/');
        await rootDrv.mkdir(mountPath).catch(() => {});

        const localDriver = new HandleFSDriver(dirHandle, `mnt:${finalFolderName}`);
        this.drivers.set(mountPath, localDriver);

        // 记录句柄到 IndexedDB 以便页面刷新后提醒一键恢复
        await coreIDB.tx('mount_handles', 'readwrite', s => s.put({
          name: finalFolderName,
          mountPath,
          handle: dirHandle,
          mountedAt: Date.now()
        })).catch(() => {});

        this.pendingMounts = this.pendingMounts.filter(m => m.name !== finalFolderName);
        this.invalidateCache();
        this.emitChange('/mnt/local');
        return mountPath;
      }

      async unmountLocalDirectory(mountPath, removeSavedRecord = true) {
        const norm = PathUtils.normalize(mountPath);
        if (!this.drivers.has(norm) || !norm.startsWith('/mnt/local/')) return false;
        this.drivers.delete(norm);
        const rootDrv = this.drivers.get('/');
        await rootDrv.rmdir(norm).catch(() => {});
        const name = PathUtils.basename(norm);
        if (removeSavedRecord) {
          await coreIDB.tx('mount_handles', 'readwrite', s => s.delete(name)).catch(() => {});
        }
        this.invalidateCache();
        this.emitChange('/mnt/local');
        return true;
      }

      getMountedLocalList() {
        const list = [];
        for (const mp of this.drivers.keys()) {
          if (mp.startsWith('/mnt/local/')) {
            list.push({ name: PathUtils.basename(mp), path: mp });
          }
        }
        return list;
      }

      onChange(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }
      emitChange(changedPath = '/') {
        this.invalidateCache();
        for (const fn of this.listeners) {
          try { fn(changedPath); } catch (_) {}
        }
      }
      invalidateCache() {
        this.dirSizeCache.clear();
      }

      /* 内部核心操作（无 callback 包装版） */
      async _stat(p) {
        const norm = PathUtils.normalize(p);
        if (norm === '/storage') {
          return { name: 'storage', kind: 'directory', isDirectory: () => true, isFile: () => false, size: 0, mtime: Date.now(), ctime: Date.now() };
        }
        const { driver, relPath } = this.resolve(norm);
        return await driver.stat(relPath);
      }

      async _exists(p) {
        const norm = PathUtils.normalize(p);
        if (norm === '/storage') return true;
        const { driver, relPath } = this.resolve(norm);
        return await driver.exists(relPath);
      }

      async _readdir(p, options = {}) {
        const norm = PathUtils.normalize(p);
        const withDetails = Boolean(options && (options.withFileTypes || options.withDetails));
        if (norm === '/storage') {
          const vols = [];
          if (this.opfsSupported) vols.push('opfs');
          vols.push('idb');
          if (!withDetails) return vols;
          return vols.map(v => ({
            name: v, kind: 'directory', isDirectory: () => true, isFile: () => false, size: 0, mtime: Date.now()
          }));
        }

        const { driver, relPath } = this.resolve(norm);
        const items = await driver.readdir(relPath, withDetails);

        // 若读取 /mnt/local，确保所有动态挂载点均合并出现
        if (norm === '/mnt/local') {
          const mountedNames = this.getMountedLocalList().map(m => m.name);
          if (!withDetails) {
            return Array.from(new Set([...items, ...mountedNames]));
          } else {
            const map = new Map(items.map(it => [it.name, it]));
            for (const mn of mountedNames) {
              if (!map.has(mn)) {
                map.set(mn, { name: mn, kind: 'directory', isDirectory: () => true, isFile: () => false, size: 0, mtime: Date.now() });
              }
            }
            return Array.from(map.values());
          }
        }
        return items;
      }

      async _readFile(p, options = {}) {
        const { driver, relPath } = this.resolve(p);
        return await driver.readFile(relPath, options);
      }

      async _writeFile(p, data, options = {}) {
        const { norm, driver, relPath } = this.resolve(p);
        const res = await driver.writeFile(relPath, data, options);
        this.emitChange(PathUtils.dirname(norm));
        return res;
      }

      async _mkdir(p, options = {}) {
        const { norm, driver, relPath } = this.resolve(p);
        const res = await driver.mkdir(relPath, options);
        this.emitChange(PathUtils.dirname(norm));
        return res;
      }

      async _unlink(p) {
        const { norm, driver, relPath } = this.resolve(p);
        const res = await driver.unlink(relPath);
        this.emitChange(PathUtils.dirname(norm));
        return res;
      }

      async _rmdir(p, options = { recursive: true }) {
        const { norm, driver, relPath } = this.resolve(p);
        if (norm.startsWith('/mnt/local/') && PathUtils.dirname(norm) === '/mnt/local' && this.drivers.has(norm)) {
          return await this.unmountLocalDirectory(norm, true);
        }
        const res = await driver.rmdir(relPath, options);
        this.emitChange(PathUtils.dirname(norm));
        return res;
      }

      /* 递归删除任意文件或文件夹 */
      async _remove(p) {
        const st = await this._stat(p);
        if (st.isDirectory()) return await this._rmdir(p, { recursive: true });
        return await this._unlink(p);
      }

      /* 递归复制（严格保留每一个文件和子目录的原始 mtime！） */
      async _copy(srcPath, destPath) {
        const srcNorm = PathUtils.normalize(srcPath);
        const destNorm = PathUtils.normalize(destPath);
        if (destNorm === srcNorm || destNorm.startsWith(srcNorm + '/')) {
          throw new Error('EINVAL: 不能将目录复制到其自身或子目录中');
        }
        const st = await this._stat(srcNorm);
        if (st.isDirectory()) {
          await this._mkdir(destNorm, { mtime: st.mtime });
          const children = await this._readdir(srcNorm);
          for (const child of children) {
            await this._copy(PathUtils.join(srcNorm, child), PathUtils.join(destNorm, child));
          }
          await this._utimes(destNorm, st.mtime, st.mtime);
        } else {
          const bytes = await this._readFile(srcNorm);
          const { driver, relPath } = this.resolve(destNorm);
          await driver.writeFile(relPath, bytes, { mtime: st.mtime, ctime: st.ctime });
        }
        this.emitChange(PathUtils.dirname(destNorm));
        return true;
      }

      /* 移动 / 重命名（跨目录、跨后端、跨本地挂载均严格保留原始 mtime！） */
      async _rename(oldPath, newPath) {
        const oldNorm = PathUtils.normalize(oldPath);
        const newNorm = PathUtils.normalize(newPath);
        if (oldNorm === newNorm) return true;
        await this._copy(oldNorm, newNorm);
        await this._remove(oldNorm);
        this.emitChange(PathUtils.dirname(oldNorm));
        this.emitChange(PathUtils.dirname(newNorm));
        return true;
      }

      async _utimes(p, atime, mtime) {
        const { driver, relPath } = this.resolve(p);
        return await driver.utimes(relPath, atime, mtime);
      }

      async _open(p, flags = 'r') {
        const norm = PathUtils.normalize(p);
        if (String(flags).includes('w') && !(await this._exists(norm))) {
          await this._writeFile(norm, new Uint8Array(0));
        }
        const st = await this._stat(norm);
        return { path: norm, flags, stat: st };
      }

      /* 精确计算文件夹递归实际大小（带缓存加速） */
      async getDirectorySize(dirPath) {
        const norm = PathUtils.normalize(dirPath);
        if (this.dirSizeCache.has(norm)) return this.dirSizeCache.get(norm);
        let total = 0;
        try {
          const entries = await this._readdir(norm, { withDetails: true });
          const subPromises = [];
          for (const item of entries) {
            if (item.isDirectory()) {
              subPromises.push(this.getDirectorySize(PathUtils.join(norm, item.name)));
            } else {
              total += (item.size || 0);
            }
          }
          if (subPromises.length > 0) {
            const subSizes = await Promise.all(subPromises);
            for (const sz of subSizes) total += sz;
          }
        } catch (_) {}
        this.dirSizeCache.set(norm, total);
        return total;
      }
    }

    /* 参数签名自适应包装器（Section 8.6：无论传入多少额外参数如 isLstat / flag / mode，均自动提取末尾 callback 并同时返回 Promise） */
    function wrapCompatMethod(fn, isExistsMethod = false) {
      return function (...rawArgs) {
        let cb = null;
        const args = [...rawArgs];
        if (args.length > 0 && typeof args[args.length - 1] === 'function') {
          cb = args.pop();
        }
        const promise = Promise.resolve().then(() => fn(...args));
        if (cb) {
          promise.then(
            (res) => {
              // Node fs.exists 的历史单参数回调与双参数回调兼容
              if (isExistsMethod && cb.length <= 1) cb(res);
              else cb(null, res);
            },
            (err) => {
              if (isExistsMethod && cb.length <= 1) cb(false);
              else cb(err);
            }
          );
        }
        return promise;
      };
    }

    const vfsCore = new UnifiedVFS();

    /* 全局挂载 window.fs 模块 */
    window.fs = {
      _core: vfsCore,
      init: () => vfsCore.init(),
      stat: wrapCompatMethod((p, _isLstat) => vfsCore._stat(p)),
      lstat: wrapCompatMethod((p) => vfsCore._stat(p)),
      exists: wrapCompatMethod((p) => vfsCore._exists(p), true),
      readdir: wrapCompatMethod((p, opts) => {
        const cleanOpts = (opts && typeof opts === 'object') ? opts : {};
        return vfsCore._readdir(p, cleanOpts);
      }),
      readFile: wrapCompatMethod((p, optsOrFlag) => {
        if (typeof optsOrFlag === 'string') {
          if (optsOrFlag === 'utf8' || optsOrFlag === 'utf-8' || optsOrFlag === 'text') {
            return vfsCore._readFile(p, { encoding: 'utf8' });
          }
          return vfsCore._readFile(p, {});
        }
        return vfsCore._readFile(p, optsOrFlag || {});
      }),
      writeFile: wrapCompatMethod((p, data, opts) => {
        const cleanOpts = (opts && typeof opts === 'object') ? opts : {};
        return vfsCore._writeFile(p, data, cleanOpts);
      }),
      mkdir: wrapCompatMethod((p, opts) => {
        const cleanOpts = (opts && typeof opts === 'object') ? opts : {};
        return vfsCore._mkdir(p, cleanOpts);
      }),
      unlink: wrapCompatMethod((p) => vfsCore._unlink(p)),
      rmdir: wrapCompatMethod((p, opts) => {
        const cleanOpts = (opts && typeof opts === 'object') ? opts : { recursive: true };
        return vfsCore._rmdir(p, cleanOpts);
      }),
      remove: wrapCompatMethod((p) => vfsCore._remove(p)),
      copy: wrapCompatMethod((src, dst) => vfsCore._copy(src, dst)),
      rename: wrapCompatMethod((oldP, newP) => vfsCore._rename(oldP, newP)),
      utimes: wrapCompatMethod((p, atime, mtime) => vfsCore._utimes(p, atime, mtime)),
      open: wrapCompatMethod((p, flags, _mode) => vfsCore._open(p, flags)),
      getDirectorySize: (p) => vfsCore.getDirectorySize(p),
      mountLocalDirectory: (h) => vfsCore.mountLocalDirectory(h),
      unmountLocalDirectory: (mp, rm) => vfsCore.unmountLocalDirectory(mp, rm),

    const CDNLoader = {
      _promises: new Map(),

      loadScript(url) {
        if (this._promises.has(url)) return this._promises.get(url);
        const p = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.onload = () => resolve(true);
          s.onerror = () => {
            this._promises.delete(url);
            reject(new Error(`加载脚本失败: ${url}`));
          };
          document.head.appendChild(s);
        });
        this._promises.set(url, p);
        return p;
      },

      loadStyle(url) {
        if (this._promises.has(url)) return this._promises.get(url);
        const p = new Promise((resolve) => {
          const l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = url;
          l.onload = () => resolve(true);
          l.onerror = () => resolve(false);
          document.head.appendChild(l);
        });
        this._promises.set(url, p);
        return p;
      },

      async ensureJSZip() {
        if (window.JSZip) return window.JSZip;
        IOBusy.show('正在载入 JSZip 压缩引擎...');
        try {
          await this.loadScript(CDN_URLS.jszip);
          return window.JSZip;
        } finally {
          IOBusy.hide();
        }
      },

      async ensureSevenZip() {
        if (this._sevenZipFactory) return this._sevenZipFactory;
        IOBusy.show('正在载入 7z-wasm 解压引擎...');
        try {
          const mod = await import(CDN_URLS.sevenZipModule);

          return this._sevenZipFactory;
        } finally {
          IOBusy.hide();
        }
      },

      async ensureV86() {
        if (window.V86 || window.V86Starter) return window.V86 || window.V86Starter;

          await this.loadScript(CDN_URLS.v86Js);

        } finally {
          IOBusy.hide();
        }
      },

      async ensureCodeMirror() {
        if (window.CodeMirror) return window.CodeMirror;
        IOBusy.show('正在初始化 CodeMirror 5.65 编辑内核...');
        try {
          const base = CDN_URLS.cmBase;

        el.style.cssText = `background: var(--bg-elevated); border: 1px solid ${borderColor}; border-left: 3px solid ${borderColor}; border-radius: var(--ctl-radius); color: var(--text-primary); animation: popUp 0.18s ease;`;

        const span = document.createElement('div');
        span.className = 'leading-relaxed break-all';

        if (action && action.label && typeof action.onClick === 'function') {

          btn.className = 'ui-btn primary !h-6 !px-2 text-[11px] shrink-0';
          btn.textContent = action.label;
          btn.onclick = () => {
            action.onClick();
            el.remove();
          };
          el.appendChild(btn);
        }

        stack.appendChild(el);
        if (duration > 0) {
          setTimeout(() => {
