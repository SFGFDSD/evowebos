                { key: 'media', label: '音频与视频', color: '#f4a261', bytes: activeStats.byCat.media },
                { key: 'archive', label: '压缩包与虚拟机镜像', color: '#9d8df1', bytes: activeStats.byCat.archive },
                { key: 'other', label: '其他二进制数据', color: '#98a9b9', bytes: activeStats.byCat.other }
              ];

              const quotaPct = quota > 0 ? Math.min(100, (usage / quota) * 100) : 0;
              const mountedLocals = window.fs.getMountedLocalList();
              const pendingMounts = window.fs._core.pendingMounts || [];

              pane.innerHTML = `
                <!-- 1. 浏览器全局存储配额总览 -->
                <section class="p-4 rounded space-y-3" style="background: var(--bg-panel); border: 1px solid var(--border-hairline);">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div class="text-sm font-bold">物理浏览器存储配额与实际占用</div>
                      <div class="text-xs" style="color: var(--text-secondary);">
                        已用 <span class="font-mono-code font-semibold" style="color:var(--accent)">${formatBytes(usage)}</span>
                        / 可用总配额 <span class="font-mono-code">${quota ? formatBytes(quota) : '无限制'}</span>
                        (可用剩余 ${quota ? formatBytes(Math.max(0, quota - usage)) : '-'})
                      </div>
                    </div>

                  <div class="w-full h-3 rounded-full overflow-hidden" style="background: var(--bg-input);">
                    <div class="h-full transition-all" style="width: ${Math.max(1.5, quotaPct).toFixed(2)}%; background: linear-gradient(90deg, var(--accent), var(--amber));"></div>
                  </div>

                  <!-- 当前主卷分类占用细分可视化条 -->
                  <div class="pt-1">
                    <div class="text-xs mb-1.5 font-medium">当前主存储卷 (${window.fs._core.primaryBackend.toUpperCase()}) 数据构成分析 — VFS 文件净总计 ${formatBytes(activeStats.totalBytes)}</div>
                    <div class="w-full h-4 rounded overflow-hidden flex" style="background: var(--bg-input);">
                      ${catMeta.map(c => c.bytes > 0 ? `<div title="${c.label}: ${formatBytes(c.bytes)}" style="width:${((c.bytes / catTotal) * 100).toFixed(2)}%; background:${c.color};"></div>` : '').join('')}
                    </div>

                          <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${c.color}"></span>
                          <span class="truncate" style="color:var(--text-secondary)">${c.label}:</span>

                  </div>
                </section>

                <!-- 2. 四级存储协同面板（OPFS + IndexedDB + localStorage + Cookie） -->
                <section class="p-4 rounded space-y-3" style="background: var(--bg-panel); border: 1px solid var(--border-hairline);">
                  <div class="text-sm font-bold">双后端引擎切换与四级存储状态</div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="p-3 rounded space-y-2" style="background: var(--bg-surface-solid); border: 1px solid ${window.fs._core.primaryBackend === 'opfs' ? 'var(--border-strong)' : 'var(--border-hairline)'};">
                      <div class="flex items-center justify-between">
                        <span class="font-semibold text-xs">OPFS (Origin Private File System)</span>

                          ${window.fs._core.opfsSupported ? (window.fs._core.primaryBackend === 'opfs' ? '当前主后端' : '就绪') : '环境不支持'}
                        </span>
                      </div>
                      <div class="text-xs font-mono-code" style="color:var(--text-secondary)">
                        ${opfsStats.fileCount} 个文件 · ${opfsStats.dirCount} 个目录 · 净大小 ${formatBytes(opfsStats.totalBytes)}

    /* ==========================================================================
       第二十二部分：首次运行初始化示例文件（合成真实音频、条漫图集、x86引导扇区、HTML与CSV）
       注意：仅在首次空白系统时写入持久化 OPFS/IndexedDB，用户删除或修改后刷新永久保持用户状态！
       零虚假开机加载画面，直接呈现可交互桌面！
       ========================================================================== */
    function synthesizeAmbientWavBytes() {
      // 合成一段 2.2 秒的立体声和弦共鸣 WAV 音频以便影音中心开箱即测频谱
      const sampleRate = 22050;
      const seconds = 2.2;
      const numSamples = Math.floor(sampleRate * seconds);
      const dataSize = numSamples * 2;
      const buf = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buf);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      const freqs = [261.63, 329.63, 392.00, 523.25];
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const env = Math.min(1, t * 8) * Math.exp(-t * 1.45);
        let sample = 0;
        for (const f of freqs) sample += Math.sin(2 * Math.PI * f * t);
        sample = (sample / freqs.length) * env * 0.65;
        view.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.floor(sample * 32767))), true);
      }
      return new Uint8Array(buf);
    }

    function generateMangaPageSvg(pageLabel, subtitle, accentColor) {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0f15"/>
            <stop offset="55%" stop-color="#111d26"/>
            <stop offset="100%" stop-color="#070a0e"/>
          </linearGradient>
