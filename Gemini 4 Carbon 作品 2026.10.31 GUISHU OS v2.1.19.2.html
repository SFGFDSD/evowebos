              body.querySelector('#ce-st-dir').textContent = `保存目录: ${sourceDir}`;
            }

            // 构建各语言对应的隔离预览文档
            function buildPreviewDocument(rawCode) {
              if (currentMode === 'htmlmixed') return rawCode;
              if (currentMode === 'xml') {
                return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e7eef4;padding:16px;}</style></head><body>${rawCode}</body></html>`;
              }
              if (currentMode === 'markdown') {
                return renderSimpleMarkdownToHtml(rawCode);
              }
              if (currentMode === 'css') {
                return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{background:#0d1117;color:#e7eef4;font-family:sans-serif;padding:24px;}${rawCode}</style></head><body><div class="preview-box"><h2>CSS 实时样式预览沙箱</h2><p>在此处观察当前 CSS 规则渲染效果。</p><button>示例按钮</button></div></body></html>`;
              }
              if (currentMode === 'application/json') {
                let pretty = rawCode;
                let valid = true;
                try { pretty = JSON.stringify(JSON.parse(rawCode), null, 2); } catch (e) { valid = false; pretty = e.message + '\n\n' + rawCode; }
                return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;padding:18px;background:#0d1117;color:${valid ? '#46e0d1' : '#e5534b'};font-family:monospace;white-space:pre-wrap;font-size:13px;}</style></head><body>${escapeHtml(pretty)}</body></html>`;
              }
              if (currentMode === 'javascript') {
                return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;padding:18px;background:#0d1117;color:#e7eef4;font-family:monospace;font-size:13px;} .log{padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.07);}</style></head><body><div style="color:#2ec4b6;margin-bottom:10px;">// JavaScript 控制台实时输出</div><div id="out"></div><script>
                  const out = document.getElementById('out');
                  const print = (type, args) => {
                    const d = document.createElement('div');
                    d.className = 'log';
                    d.style.color = type === 'err' ? '#e5534b' : '#e7eef4';
                    d.textContent = Array.from(args).map(x => typeof x === 'object' ? JSON.stringify(x, null, 2) : String(x)).join(' ');
                    out.appendChild(d);
                  };
                  console.log = function(){ print('log', arguments); };
                  console.error = function(){ print('err', arguments); };
                  window.onerror = function(msg){ print('err', [msg]); };
                  try { ${rawCode} } catch(e) { console.error(e.message); }
                <\/script></body></html>`;
              }
              return rawCode;
            }

            function renderPreviewNow(showSpinner = false) {
              if (layoutView === 'code') return;
              if (showSpinner) iframeShield.classList.remove('hidden-shield');
              const htmlDoc = buildPreviewDocument(getValue());
              const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8' });
              const nextUrl = URL.createObjectURL(blob);
              const oldUrl = activePreviewBlobUrl;
              activePreviewBlobUrl = nextUrl;
              previewIframe.src = nextUrl;
              if (oldUrl) setTimeout(() => URL.revokeObjectURL(oldUrl), 2000);
            }

            function schedulePreviewUpdate() {
              clearTimeout(previewTimer);
              previewTimer = setTimeout(() => renderPreviewNow(false), 260);
            }

            // 保存回虚拟文件系统（保持原文件来源目录，无来源回退 /Desktop 并自动刷新桌面）
            async function saveBackToVFS() {
              const langObj = LANG_MODES.find(m => m.mode === currentMode) || LANG_MODES[0];
              if (!currentFilePath) {
                const suggested = PathUtils.join(sourceDir, `未命名代码${langObj.ext}`);
                const chosen = await Modal.prompt('保存代码到虚拟文件系统', suggested, '请输入保存完整路径（默认保存在来源目录 / 桌面）：');
                if (!chosen) return;
                currentFilePath = PathUtils.normalize(chosen.startsWith('/') ? chosen : PathUtils.join(sourceDir, chosen));
                sourceDir = PathUtils.dirname(currentFilePath);
              }
              try {
                await window.fs.writeFile(currentFilePath, getValue());
                winRec.setTitle(`HTML 编辑器 — ${PathUtils.basename(currentFilePath)}`);
                updateStatusBar();
                Desktop.render();
                Toast.show(`已保存至 ${currentFilePath}`);
              } catch (err) {
                Toast.show(`保存失败: ${err.message}`, 'error');
              }
            }

            // 查找与替换功能实现
            let lastSearchQuery = '';
            let lastSearchPos = null;

            function toggleFindBar(forceOpen = null) {
              const bar = body.querySelector('#ce-find-bar');
              const open = forceOpen !== null ? forceOpen : bar.classList.contains('hidden');
              bar.classList.toggle('hidden', !open);
              bar.classList.toggle('flex', open);
              if (open) body.querySelector('#ce-find-inp').focus();
            }

            function findStep(reverse = false) {
              const query = body.querySelector('#ce-find-inp').value;
              if (!query || !cmInstance) return;
              const caseFold = !body.querySelector('#ce-find-case').checked;
              if (query !== lastSearchQuery) {
                lastSearchPos = null;
                lastSearchQuery = query;
              }
              const startPos = reverse
                ? cmInstance.getCursor('from')
                : cmInstance.getCursor('to');
              let cursor = cmInstance.getSearchCursor(query, startPos, { caseFold });
              if (!cursor.find(reverse)) {
                cursor = cmInstance.getSearchCursor(query, reverse ? { line: cmInstance.lastLine(), ch: null } : { line: 0, ch: 0 }, { caseFold });
                if (!cursor.find(reverse)) {
                  Toast.show('未找到匹配项', 'warn');
                  return;
                }
              }
              cmInstance.setSelection(cursor.from(), cursor.to());
              cmInstance.scrollIntoView({ from: cursor.from(), to: cursor.to() }, 40);
            }

            // 分屏布局与可拖拽分割条控制
            function applyWorkspaceLayout() {
              body.querySelectorAll('[data-ce-view]').forEach(b => {
                b.classList.toggle('primary', b.dataset.ceView === layoutView);
              });
              const dirBtn = body.querySelector('#ce-split-dir');
              if (splitDirection === 'horizontal') {
                workspace.style.flexDirection = 'row';
                splitter.style.width = '6px';
                splitter.style.height = '100%';
                splitter.style.cursor = 'col-resize';
                dirBtn.innerHTML = `${Icons.splitV}<span>切换上下分屏</span>`;
              } else {
                workspace.style.flexDirection = 'column';
                splitter.style.width = '100%';
                splitter.style.height = '6px';
                splitter.style.cursor = 'row-resize';
                dirBtn.innerHTML = `${Icons.splitH}<span>切换左右分屏</span>`;
              }

              if (layoutView === 'code') {
                editorPane.style.display = 'block';
                editorPane.style.width = '100%';
                editorPane.style.height = '100%';
                splitter.style.display = 'none';
                previewPane.style.display = 'none';
              } else if (layoutView === 'preview') {
                editorPane.style.display = 'none';
                splitter.style.display = 'none';
                previewPane.style.display = 'block';
                previewPane.style.width = '100%';
                previewPane.style.height = '100%';
                renderPreviewNow(true);
              } else {
                editorPane.style.display = 'block';
                splitter.style.display = 'flex';
                previewPane.style.display = 'block';
                if (splitDirection === 'horizontal') {
                  editorPane.style.width = `${splitRatio}%`;
                  editorPane.style.height = '100%';
                } else {
                  editorPane.style.width = '100%';
                  editorPane.style.height = `${splitRatio}%`;
                }
                renderPreviewNow(false);
              }
              if (cmInstance) setTimeout(() => cmInstance.refresh(), 20);
            }

            // 可拖拽分割条事件
            let draggingSplit = false;
            splitter.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              draggingSplit = true;
              splitter.setPointerCapture(e.pointerId);
              previewIframe.style.pointerEvents = 'none';
            });
            splitter.addEventListener('pointermove', (e) => {
              if (!draggingSplit) return;
              const rect = workspace.getBoundingClientRect();
              if (splitDirection === 'horizontal') {
                splitRatio = Math.max(15, Math.min(85, ((e.clientX - rect.left) / rect.width) * 100));
                editorPane.style.width = `${splitRatio}%`;
              } else {
                splitRatio = Math.max(15, Math.min(85, ((e.clientY - rect.top) / rect.height) * 100));
                editorPane.style.height = `${splitRatio}%`;
              }
              if (cmInstance) cmInstance.refresh();
            });
            const endSplitDrag = () => {
              if (!draggingSplit) return;
              draggingSplit = false;
              previewIframe.style.pointerEvents = '';
            };
            splitter.addEventListener('pointerup', endSplitDrag);
            splitter.addEventListener('pointercancel', endSplitDrag);

            // 绑定工具栏全部按钮逻辑
            const langSelect = body.querySelector('#ce-lang-select');
            langSelect.onchange = () => {
              currentMode = langSelect.value;
              if (cmInstance) cmInstance.setOption('mode', currentMode);
              updateStatusBar();
              renderPreviewNow(true);
            };

            const inputStyleSelect = body.querySelector('#ce-inputstyle-select');
            inputStyleSelect.onchange = async () => {
              inputStyleChoice = inputStyleSelect.value;
              const snapVal = getValue();
              const snapCur = cmInstance ? cmInstance.getCursor() : null;
              await mountEditorKernel(snapVal, snapCur);
              Toast.show(`编辑器输入模式已切换为：${inputStyleSelect.options[inputStyleSelect.selectedIndex].text}`);
            };

            body.querySelector('#ce-save').onclick = saveBackToVFS;

            // 代码格式化：严格保持光标位置不变！
            body.querySelector('#ce-format').onclick = () => {
              const cur = cmInstance ? cmInstance.getCursor() : null;
              const scrollInfo = cmInstance ? cmInstance.getScrollInfo() : null;
              const formatted = CodeFormatter.format(getValue(), currentMode);
              if (cmInstance) {
                cmInstance.operation(() => {
                  cmInstance.setValue(formatted);
                  if (cur) {
                    const safeLine = Math.min(cur.line, cmInstance.lineCount() - 1);
                    const lineLen = (cmInstance.getLine(safeLine) || '').length;
                    cmInstance.setCursor({ line: safeLine, ch: Math.min(cur.ch, lineLen) });
                  }
                  if (scrollInfo) cmInstance.scrollTo(scrollInfo.left, scrollInfo.top);
                });
                cmInstance.focus();
              } else {
                setValue(formatted);
              }
              Toast.show('代码格式化完成（已保持光标位置）');
            };

            body.querySelector('#ce-find-toggle').onclick = () => toggleFindBar();
            body.querySelector('#ce-find-close').onclick = () => toggleFindBar(false);
            body.querySelector('#ce-find-next').onclick = () => findStep(false);
            body.querySelector('#ce-find-prev').onclick = () => findStep(true);
            body.querySelector('#ce-find-inp').onkeydown = (e) => {
              if (e.key === 'Enter') findStep(e.shiftKey);
            };
            body.querySelector('#ce-replace-one').onclick = () => {
              if (!cmInstance) return;
              const rep = body.querySelector('#ce-replace-inp').value;
              if (cmInstance.somethingSelected()) {
                cmInstance.replaceSelection(rep);
              }
              findStep(false);
            };
            body.querySelector('#ce-replace-all').onclick = () => {
              if (!cmInstance) return;
              const q = body.querySelector('#ce-find-inp').value;
              const rep = body.querySelector('#ce-replace-inp').value;
              if (!q) return;
              const caseFold = !body.querySelector('#ce-find-case').checked;
              let count = 0;
              cmInstance.operation(() => {
                const cursor = cmInstance.getSearchCursor(q, { line: 0, ch: 0 }, { caseFold });
                while (cursor.findNext()) {
                  cursor.replace(rep);
                  count++;
                }
              });
              Toast.show(`已完成全部替换：共替换 ${count} 处`);
            };

            body.querySelector('#ce-undo').onclick = () => cmInstance && cmInstance.undo();
            body.querySelector('#ce-redo').onclick = () => cmInstance && cmInstance.redo();

            body.querySelector('#ce-copyall').onclick = async () => {
              try {
                await navigator.clipboard.writeText(getValue());
                Toast.show('已复制全部代码到系统剪贴板');
              } catch (_) {
                if (cmInstance) cmInstance.execCommand('selectAll');
                document.execCommand('copy');
                Toast.show('已复制全部内容');
              }
            };

            body.querySelector('#ce-clear').onclick = () => {
              setValue('');
              if (cmInstance) cmInstance.focus();
            };

            // 导入本地文件并根据扩展名自动切换语言模式
            const localImp = body.querySelector('#ce-local-import-inp');
            body.querySelector('#ce-import').onclick = () => {
              localImp.value = '';
              localImp.click();
            };
            localImp.onchange = async () => {
              const file = localImp.files && localImp.files[0];
              if (!file) return;
              const text = await file.text();
              currentMode = detectCodeModeByFilename(file.name);
              langSelect.value = currentMode;
              if (cmInstance) cmInstance.setOption('mode', currentMode);
              setValue(text);
              winRec.setTitle(`HTML 编辑器 — ${file.name} (已导入)`);
              Toast.show(`已载入本地文件 ${file.name}，自动切换至 ${langSelect.options[langSelect.selectedIndex].text} 模式`);
            };

            // 导出文件弹窗：支持现实桌面下载 & 虚拟桌面/指定目录导出，支持默认命名与自定义命名
            body.querySelector('#ce-export').onclick = () => {
              const langObj = LANG_MODES.find(m => m.mode === currentMode) || LANG_MODES[0];
              const baseStem = currentFilePath
                ? PathUtils.basename(currentFilePath).replace(/\.[^.]+$/, '')
                : '晷枢代码导出';
              const defaultName = `${baseStem}${langObj.ext}`;

              Modal.show({
                title: '导出代码文档（现实桌面 / 虚拟文件系统）',
                hideFooter: true,
                bodyHtml: `
                  <div class="space-y-3">
                    <div>
                      <label class="block mb-1" style="color:var(--text-secondary)">导出文件名（扩展名已根据当前 ${langObj.label} 模式匹配，可自由修改）：</label>
                      <input id="exp-filename" type="text" class="ui-input w-full" value="${escapeHtml(defaultName)}" />
                    </div>
                    <div>
                      <label class="block mb-1" style="color:var(--text-secondary)">虚拟系统目标目录（用于导出到虚拟桌面或任意文件夹）：</label>
                      <input id="exp-vfs-dir" type="text" class="ui-input w-full font-mono-code" value="/Desktop" />
                    </div>
                    <div class="pt-2 grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <button id="exp-to-physical" class="ui-btn primary !h-9">${Icons.download}<span>导出下载到现实桌面</span></button>
                      <button id="exp-to-virtual" class="ui-btn !h-9" style="border-color:var(--border-strong)">${Icons.folder}<span>导出到虚拟桌面/目录</span></button>
                    </div>
                  </div>
                `,
                onMount: (mBody, close) => {
                  const fnInp = mBody.querySelector('#exp-filename');
                  const dirInp = mBody.querySelector('#exp-vfs-dir');
                  mBody.querySelector('#exp-to-physical').onclick = () => {
                    const fname = fnInp.value.trim() || defaultName;
                    const mime = FileTypes.getMime(fname) || 'text/plain;charset=utf-8';
                    triggerBrowserDownload(new Blob([getValue()], { type: mime }), fname);
                    Toast.show(`已导出到现实桌面: ${fname}`);
                    close(true);
                  };
                  mBody.querySelector('#exp-to-virtual').onclick = async () => {
                    const fname = fnInp.value.trim() || defaultName;
                    const vdir = PathUtils.normalize(dirInp.value.trim() || '/Desktop');
                    const full = PathUtils.join(vdir, fname);
                    try {
                      await window.fs.mkdir(vdir);
                      await window.fs.writeFile(full, getValue());
                      Desktop.render();
                      Toast.show(`已导出至虚拟路径: ${full}`);
                      close(true);
                    } catch (err) {
                      Toast.show(`导出虚拟文件失败: ${err.message}`, 'error');
                    }
                  };
                }
              });
            };

            body.querySelector('#ce-refresh-preview').onclick = () => renderPreviewNow(true);

            body.querySelector('#ce-open-newtab').onclick = () => {
              const doc = buildPreviewDocument(getValue());
              const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              window.open(url, '_blank');
            };

            body.querySelector('#ce-open-sysbrowser').onclick = async () => {
              if (currentFilePath && (currentFilePath.endsWith('.html') || currentFilePath.endsWith('.htm'))) {
                await window.fs.writeFile(currentFilePath, getValue());
                AppRegistry.launch('browser', { filePath: currentFilePath });
              } else {
                const doc = buildPreviewDocument(getValue());
                AppRegistry.launch('browser', { rawHtml: doc, titleHint: '编辑器实时预览页' });
              }
            };

            body.querySelectorAll('[data-ce-view]').forEach(btn => {
              btn.onclick = () => {
                layoutView = btn.dataset.ceView;
                applyWorkspaceLayout();
              };
            });

            body.querySelector('#ce-split-dir').onclick = () => {
              splitDirection = splitDirection === 'horizontal' ? 'vertical' : 'horizontal';
              applyWorkspaceLayout();
            };

            await mountEditorKernel(initialContent);
            updateStatusBar();
            renderPreviewNow(true);
          }
        });
      }
    });

    /* ==========================================================================
       第十五部分：网页浏览器模拟器 (Web Browser)
       支持：地址栏、前进/后退/刷新/主页、加载 VFS 本地 HTML/PDF 文件、与代码编辑器无缝互跳、暗色加载遮罩防白屏闪烁
       ========================================================================== */
    AppRegistry.register({
      id: 'browser',
      name: '网页浏览器',
      desc: '内置沙箱浏览器，支持外部网页访问与虚拟文件系统本地 HTML 渲染',
      icon: Icons.browser,
      color: '#48cae4',
      launch({ url = '', filePath = '', rawHtml = '', titleHint = '' } = {}) {
        let navStack = [];
        let navIdx = -1;
        let currentVfsPath = filePath ? PathUtils.normalize(filePath) : '';
        let blobUrls = [];

        const HOME_SPEC = 'guishu://home';

        const buildHomeHtml = () => `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 20%,rgba(46,196,182,0.18),transparent 55%),#0b0f14;color:#e7eef4;font-family:'Noto Sans SC',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .logo{font-size:26px;font-weight:700;letter-spacing:0.08em;color:#2ec4b6;margin-bottom:8px;}
  .sub{font-size:13px;color:#98a9b9;margin-bottom:28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%;max-width:680px;}
  a{text-decoration:none;color:#e7eef4;padding:14px 16px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);transition:all .16s;}
  a:hover{border-color:#2ec4b6;background:rgba(46,196,182,0.12);transform:translateY(-2px);}
  .t{font-weight:600;font-size:13.5px;margin-bottom:4px;color:#46e0d1;}
  .d{font-size:11.5px;color:#98a9b9;}
</style></head><body>
  <div class="logo">晷枢万象浏览器</div>
  <div class="sub">支持 HTTPS 网页与 vfs:/// 本地持久化 HTML 实时渲染</div>
  <div class="grid">
    <a href="https://zh.wikipedia.org/wiki/操作系统" target="_self"><div class="t">维基百科 · 操作系统</div><div class="d">开放百科知识库</div></a>
    <a href="https://www.openstreetmap.org/export/embed.html" target="_self"><div class="t">OpenStreetMap</div><div class="d">全球开源矢量地图</div></a>
    <a href="https://example.com" target="_self"><div class="t">IANA Example</div><div class="d">标准连通性测试页</div></a>
  </div>
</body></html>`;

        WM.createWindow({
          appId: 'browser',
          title: currentVfsPath ? `网页浏览器 — ${PathUtils.basename(currentVfsPath)}` : (titleHint || '网页浏览器'),
          iconSvg: Icons.browser,
          width: 960,
          height: 620,
          onClose: () => {
            blobUrls.forEach(u => URL.revokeObjectURL(u));
          },
          onMount: (body, winRec) => {
            body.innerHTML = `
              <div class="p-2 flex flex-wrap items-center gap-1.5" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline);">
                <button class="win-ctl-btn !w-7 !h-7" id="br-back" title="后退">${Icons.chevLeft}</button>
                <button class="win-ctl-btn !w-7 !h-7" id="br-fwd" title="前进">${Icons.chevRight}</button>
                <button class="win-ctl-btn !w-7 !h-7" id="br-reload" title="刷新">${Icons.refresh}</button>
                <button class="ui-btn !h-7 !px-2 text-xs" id="br-home">主页</button>
                <input id="br-addr" type="text" class="ui-input flex-1 min-w-[180px] !h-7 font-mono-code text-xs" placeholder="输入 https:// 网址 或 vfs:///Desktop/页面.html" />
                <button class="ui-btn primary !h-7" id="br-go">前往</button>
                <button class="ui-btn !h-7 hidden" id="br-edit-source" style="border-color:var(--border-strong)">${Icons.code}<span>编辑源代码</span></button>
                <button class="ui-btn !h-7" id="br-ext" title="在新浏览器标签页打开">${Icons.external}<span>外部打开</span></button>
              </div>
              <div class="flex-1 relative bg-[#0d1117] overflow-hidden">
                <div id="br-shield" class="iframe-dark-shield">
                  ${Icons.spinner}
                  <span class="text-xs">正在载入页面内容...</span>
                </div>
                <iframe id="br-iframe" class="w-full h-full border-0" referrerpolicy="no-referrer"></iframe>
              </div>
            `;

            const addrInp = body.querySelector('#br-addr');
            const ifr = body.querySelector('#br-iframe');
            const shield = body.querySelector('#br-shield');
            const editBtn = body.querySelector('#br-edit-source');

            ifr.addEventListener('load', () => {
              shield.classList.add('hidden-shield');
            });

            async function loadTarget(spec, pushHistory = true) {
              shield.classList.remove('hidden-shield');
              let clean = String(spec || '').trim() || HOME_SPEC;

              if (clean.startsWith('/') && (await window.fs.exists(clean))) {
                clean = `vfs://${clean}`;
              }

              if (pushHistory && navStack[navIdx] !== clean) {
                navStack = navStack.slice(0, navIdx + 1);
                navStack.push(clean);
                navIdx = navStack.length - 1;
              }

              addrInp.value = clean;

              if (clean === HOME_SPEC) {
                currentVfsPath = '';
                editBtn.classList.add('hidden');
                const b = new Blob([buildHomeHtml()], { type: 'text/html;charset=utf-8' });
                const u = URL.createObjectURL(b);
                blobUrls.push(u);
                ifr.src = u;
                winRec.setTitle('网页浏览器 — 晷枢起始页');
                return;
              }

              if (clean.startsWith('vfs://')) {
                const vfsP = PathUtils.normalize(clean.slice('vfs://'.length));
                currentVfsPath = vfsP;
                editBtn.classList.remove('hidden');
                try {
                  const mime = FileTypes.getMime(vfsP);
                  if (mime === 'text/html') {
                    let html = await window.fs.readFile(vfsP, 'utf8');
                    const b = new Blob([html], { type: 'text/html;charset=utf-8' });
                    const u = URL.createObjectURL(b);
                    blobUrls.push(u);
                    ifr.src = u;
                  } else {
                    const b = await window.fs.readFile(vfsP, { asBlob: true });
                    const u = URL.createObjectURL(b);
                    blobUrls.push(u);
                    ifr.src = u;
                  }
                  winRec.setTitle(`网页浏览器 — ${PathUtils.basename(vfsP)}`);
                } catch (err) {
                  shield.classList.add('hidden-shield');
                  Toast.show(`加载本地 VFS 页面失败: ${err.message}`, 'error');
                }
                return;
              }

              currentVfsPath = '';
              editBtn.classList.add('hidden');
              if (!/^https?:\/\//i.test(clean)) {
                if (clean.includes('.') && !clean.includes(' ')) clean = 'https://' + clean;
                else clean = `https://zh.wikipedia.org/w/index.php?search=${encodeURIComponent(clean)}`;
                addrInp.value = clean;
              }
              ifr.src = clean;
              winRec.setTitle(`网页浏览器 — ${clean}`);
              // 部分外部站点禁止 iframe 嵌入时超时收起遮罩避免常驻
              setTimeout(() => shield.classList.add('hidden-shield'), 2800);
            }

            body.querySelector('#br-back').onclick = () => {
              if (navIdx > 0) { navIdx--; loadTarget(navStack[navIdx], false); }
            };
            body.querySelector('#br-fwd').onclick = () => {
              if (navIdx < navStack.length - 1) { navIdx++; loadTarget(navStack[navIdx], false); }
            };
            body.querySelector('#br-reload').onclick = () => loadTarget(addrInp.value, false);
            body.querySelector('#br-home').onclick = () => loadTarget(HOME_SPEC, true);
            body.querySelector('#br-go').onclick = () => loadTarget(addrInp.value, true);
            addrInp.onkeydown = (e) => { if (e.key === 'Enter') loadTarget(addrInp.value, true); };

            editBtn.onclick = () => {
              if (currentVfsPath) AppRegistry.launch('code', { filePath: currentVfsPath });
            };

            body.querySelector('#br-ext').onclick = async () => {
              if (currentVfsPath) {
                const b = await window.fs.readFile(currentVfsPath, { asBlob: true });
                window.open(URL.createObjectURL(b), '_blank');
              } else if (addrInp.value && !addrInp.value.startsWith('guishu://')) {
                window.open(addrInp.value, '_blank');
              }
            };

            if (rawHtml) {
              const b = new Blob([rawHtml], { type: 'text/html;charset=utf-8' });
              const u = URL.createObjectURL(b);
              blobUrls.push(u);
              addrInp.value = 'blob://live-preview';
              ifr.src = u;
            } else if (currentVfsPath) {
              loadTarget(`vfs://${currentVfsPath}`, true);
            } else if (url) {
              loadTarget(url, true);
            } else {
              loadTarget(HOME_SPEC, true);
            }
          }
        });
      }
    });

    /* ==========================================================================
       第十六部分：漫画阅读器 (Manga Viewer — 条漫无缝垂直流 + 物理阻尼 + 纯粹沉浸全屏)
       严格满足 Section 4.3.1 全部技术规范：
       1. 同目录全部图片自动识别（大小写无关匹配 jpg/jpeg/png/webp/gif/bmp/svg/ico/avif）
       2. 自然数字排序 (1.jpg -> 2.jpg -> 10.jpg)
       3. 纯黑 (#000) 纵向居中无限条漫流
       4. 并行读取二进制数据、按排序顺序固定槽位插入 + 固有宽高比骨架占位
       5. 上方图片异步撑开高度时自动补偿 scrollTop += deltaH，画面绝不跳动；自动定位到用户点击的那张图片
       6. 单张读取失败容错跳过，不中断整体阅读
       7. 双模滚动：移动端 pan-y + -webkit-overflow-scrolling: touch 120fps 原生滚动；
          PC 端鼠标 setPointerCapture 手抓上下拖拽 + 单例 rAF FRICTION = 0.96 物理惯性滑行
       8. 沉浸式全屏：兼容原生 Fullscreen API 进出双路径，自动隐藏窗口标题栏与一切控件，仅留右上角隐蔽退出按钮 (×)
       ========================================================================== */
    const IMAGE_EXT_SET = new Set(['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp', '.svg', '.ico', '.avif']);

    AppRegistry.register({
      id: 'manga',
      name: '漫画阅读器',
      desc: '条漫式无限垂直流阅读器，支持自然排序、物理阻尼滑行与纯黑沉浸全屏',
      icon: Icons.manga,
      color: '#46e0d1',
      launch({ filePath = '' } = {}) {
        let currentTargetFile = filePath ? PathUtils.normalize(filePath) : '';
        let currentDir = currentTargetFile ? PathUtils.dirname(currentTargetFile) : '/Desktop/星图条漫集';
        let blobUrls = [];
        let inertiaRaf = null;
        let disposed = false;
        let fsChangeHandler = null;

        WM.createWindow({
          appId: 'manga',
          title: currentTargetFile ? `漫画阅读器 — ${PathUtils.basename(currentDir)} / ${PathUtils.basename(currentTargetFile)}` : '漫画阅读器',
          iconSvg: Icons.manga,
          width: 880,
          height: 660,
          onClose: () => {
            disposed = true;
            if (inertiaRaf) cancelAnimationFrame(inertiaRaf);
            if (fsChangeHandler) document.removeEventListener('fullscreenchange', fsChangeHandler);
            blobUrls.forEach(u => URL.revokeObjectURL(u));
          },
          onMount: async (body, winRec) => {
            body.innerHTML = `
              <div class="manga-root" id="mg-root">
                <!-- 顶部工具栏（进入漫画全屏模式时完全隐藏） -->
                <div class="manga-toolbar px-3 py-1.5 flex flex-wrap items-center justify-between gap-2" style="background: #0c1015; border-bottom: 1px solid rgba(255,255,255,0.09); color: #e7eef4;">
                  <div class="flex items-center gap-2 min-w-0">
                    <button class="ui-btn !h-7" id="mg-pick-dir">${Icons.folder}<span>选择漫画目录</span></button>
                    <span id="mg-progress-text" class="text-xs truncate" style="color: #98a9b9;">正在扫描目录序列...</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button class="ui-btn !h-7" id="mg-switch-single" title="在单图缩放查看器中打开当前图片">${Icons.image}<span>图片查看器</span></button>
                    <button class="ui-btn primary !h-7" id="mg-enter-fs">${Icons.fullscreen}<span>沉浸全屏</span></button>
                  </div>
                </div>

                <!-- 沉浸全屏模式下唯一可见的右上角隐蔽悬浮退出按钮 (×) -->
                <button class="manga-fs-exit-btn" id="mg-exit-fs" title="退出全屏 (Esc)">${Icons.close}</button>

                <!-- 条漫核心滚动视窗 -->
                <div class="manga-viewport" id="mg-viewport">
                  <div class="manga-stream" id="mg-stream"></div>
                </div>
              </div>
            `;

            const mangaRoot = body.querySelector('#mg-root');
            const viewport = body.querySelector('#mg-viewport');
            const stream = body.querySelector('#mg-stream');
            const progressText = body.querySelector('#mg-progress-text');

            // 全屏进出双路径同步（兼容浏览器原生 Fullscreen API 与移动端 CSS 全屏回退）
            const setImmersiveState = (active) => {
              winRec.el.classList.toggle('manga-immersive-fullscreen', active);
            };

            const enterImmersiveFullscreen = async () => {
              setImmersiveState(true);
              if (!document.fullscreenElement && typeof mangaRoot.requestFullscreen === 'function') {
                try {
                  await mangaRoot.requestFullscreen();
                } catch (_) {
                  // iOS Safari 等不支持普通 div requestFullscreen 时保留 CSS 固定全屏且不锁死 pan-y 触控滚动
                }
              }
            };

            const exitImmersiveFullscreen = async () => {
              setImmersiveState(false);
              if (document.fullscreenElement) {
                try { await document.exitFullscreen(); } catch (_) {}
              }
            };

            fsChangeHandler = () => {
              if (!document.fullscreenElement) {
                setImmersiveState(false);
              }
            };
            document.addEventListener('fullscreenchange', fsChangeHandler);

            body.querySelector('#mg-enter-fs').onclick = enterImmersiveFullscreen;
            body.querySelector('#mg-exit-fs').onclick = exitImmersiveFullscreen;

            body.querySelector('#mg-switch-single').onclick = () => {
              const target = currentTargetFile || '';
              AppRegistry.launch('imageviewer', { filePath: target });
            };

            body.querySelector('#mg-pick-dir').onclick = async () => {
              const chosen = await Modal.prompt('输入要阅读的图片目录路径', currentDir, '将自动按自然数字顺序连续加载该目录下所有图片：');
              if (!chosen) return;
              currentDir = PathUtils.normalize(chosen);
              currentTargetFile = '';
              await loadDirectorySequence(currentDir, '');
            };

            // PC 端鼠标手抓上下拖拽 + 单例 rAF FRICTION = 0.96 物理阻尼滑行（触屏直接放行走原生 120fps 合成器滚动！）
            const FRICTION = 0.96;
            let isMouseGrabbing = false;
            let lastY = 0;
            let lastTime = 0;
            let velocityY = 0;

            const stopInertia = () => {
              if (inertiaRaf) {
                cancelAnimationFrame(inertiaRaf);
                inertiaRaf = null;
              }
            };

            const startInertia = () => {
              stopInertia();
              const step = () => {
                if (disposed || Math.abs(velocityY) < 0.35) {
                  velocityY = 0;
                  inertiaRaf = null;
                  return;
                }
                viewport.scrollTop -= velocityY;
                velocityY *= FRICTION;
                inertiaRaf = requestAnimationFrame(step);
              };
              inertiaRaf = requestAnimationFrame(step);
            };

            viewport.addEventListener('pointerdown', (e) => {
              // 严格仅对 PC 鼠标启用手抓指针捕获，绝不劫持移动端 touch 合成器原生 pan-y 滚动
              if (e.pointerType !== 'mouse' || e.button !== 0) return;
              stopInertia();
              isMouseGrabbing = true;
              lastY = e.clientY;
              lastTime = performance.now();
              velocityY = 0;
              viewport.classList.add('grabbing');
              viewport.setPointerCapture(e.pointerId);
            });

            viewport.addEventListener('pointermove', (e) => {
              if (!isMouseGrabbing || e.pointerType !== 'mouse') return;
              const now = performance.now();
              const dy = e.clientY - lastY;
              const dt = Math.max(1, now - lastTime);
              viewport.scrollTop -= dy;
              // 指数平滑采样瞬时速度（转换为每 16.6ms 帧位移）
              const instantVel = (dy / dt) * 16.67;
              velocityY = velocityY * 0.55 + instantVel * 0.45;
              lastY = e.clientY;
              lastTime = now;
            });

            const finishMouseGrab = (e) => {
              if (!isMouseGrabbing) return;
              isMouseGrabbing = false;
              viewport.classList.remove('grabbing');
              try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
              if (Math.abs(velocityY) > 0.8) {
                startInertia();
              }
            };
            viewport.addEventListener('pointerup', finishMouseGrab);
            viewport.addEventListener('pointercancel', finishMouseGrab);
            viewport.addEventListener('wheel', () => stopInertia(), { passive: true });

            // 加载指定目录下全部图片序列（并行读取、按序插入、骨架高度增量补偿、定位到点击图片）
            async function loadDirectorySequence(dirPath, focusFilePath) {
              stopInertia();
              blobUrls.forEach(u => URL.revokeObjectURL(u));
              blobUrls = [];
              stream.innerHTML = '';

              let rawEntries = [];
              try {
                if (!(await window.fs.exists(dirPath))) {
                  throw new Error(`目录不存在: ${dirPath}`);
                }
                rawEntries = await window.fs.readdir(dirPath, { withDetails: true });
              } catch (err) {
                Toast.show(`漫画目录读取失败: ${err.message}`, 'error');
                progressText.textContent = `目录读取失败: ${err.message}`;
                Modal.confirm('目录读取错误', `无法读取目录 ${dirPath}：${err.message}`, '知道了');
                return;
              }

              // 1. 过滤全部可识别图片扩展名（不区分大小写）并进行自然数字排序
              const imageNames = rawEntries
                .filter(it => !it.isDirectory() && IMAGE_EXT_SET.has(PathUtils.extname(it.name).toLowerCase()))
                .map(it => it.name)
                .sort(naturalCompare);

              if (imageNames.length === 0) {
                progressText.textContent = `${dirPath} 下未找到图片文件`;
                stream.innerHTML = `<div class="py-24 text-xs text-center" style="color:#7c8c99">当前目录 (${escapeHtml(dirPath)}) 中没有可识别的图片文件。</div>`;
                return;
              }

              const targetBaseName = focusFilePath ? PathUtils.basename(focusFilePath) : imageNames[0];
              const targetIndex = Math.max(0, imageNames.findIndex(n => n === targetBaseName));
              currentTargetFile = PathUtils.join(dirPath, imageNames[targetIndex]);
              winRec.setTitle(`漫画阅读器 — ${PathUtils.basename(dirPath) || '/'} (${imageNames.length} 页)`);

              // 2. 按自然排序顺序预先创建固定顺序的固有宽高比骨架占位槽位（避免并行回调导致插页顺序错乱！）
              const slots = imageNames.map((name, idx) => {
                const slot = document.createElement('div');
                slot.className = 'manga-slot skeleton';
                slot.dataset.index = String(idx);
                slot.dataset.filename = name;
                stream.appendChild(slot);
                return slot;
              });

              // 先立即将视口滚动定位至目标图片骨架槽位
              let hasUserScrolledAway = false;
              let targetDecoded = false;
              requestAnimationFrame(() => {
                if (slots[targetIndex]) {
                  viewport.scrollTop = slots[targetIndex].offsetTop;
                }
              });

              const markUserInteraction = () => {
                if (targetDecoded) hasUserScrolledAway = true;
              };
              viewport.addEventListener('wheel', markUserInteraction, { once: true, passive: true });
              viewport.addEventListener('touchmove', markUserInteraction, { once: true, passive: true });
              viewport.addEventListener('pointerdown', markUserInteraction, { once: true, passive: true });

              let loadedCount = 0;
              let failedCount = 0;
              const updateProgress = () => {
                progressText.textContent = `${PathUtils.basename(dirPath) || '/'} · 共 ${imageNames.length} 页 · 已载入 ${loadedCount}/${imageNames.length}${failedCount ? ` (跳过损坏 ${failedCount})` : ''}`;
              };
              updateProgress();

              // 3. 并行读取所有图片二进制数据，按各自预先锁定的槽位插入，并对视口上方高度增量做 scrollTop += deltaH 精确补偿！
              await Promise.allSettled(imageNames.map(async (imgName, idx) => {
                const fullImgPath = PathUtils.join(dirPath, imgName);
                const slot = slots[idx];
                try {
                  const blob = await window.fs.readFile(fullImgPath, { asBlob: true });
                  if (disposed) return;
                  const url = URL.createObjectURL(blob);
                  blobUrls.push(url);

                  const img = new Image();
                  img.decoding = 'async';
                  await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = url;
                  });
                  if (disposed) return;

                  // 记录插入替换前该骨架槽位的实际渲染高度与是否在当前阅读视线上方
                  const oldH = slot.offsetHeight;
                  const slotTopBefore = slot.offsetTop;
                  const wasAboveViewport = slotTopBefore < viewport.scrollTop - 2;

                  slot.classList.remove('skeleton');
                  slot.innerHTML = '';
                  slot.appendChild(img);

                  const newH = slot.offsetHeight;
                  const deltaH = newH - oldH;

                  if (idx === targetIndex && !hasUserScrolledAway) {
                    // 目标起始页加载完成：精准锚定到用户点击的那一页顶部
                    targetDecoded = true;
                    viewport.scrollTop = slot.offsetTop;
                  } else if (!targetDecoded && idx < targetIndex && !hasUserScrolledAway) {
                    // 目标页尚未完成或刚刚锚定时，位于目标页上方的图片加载导致高度变化：始终紧锁目标页
                    viewport.scrollTop = slots[targetIndex].offsetTop;
                  } else if (wasAboveViewport && deltaH !== 0) {
                    // 阅读过程中上方异步图片撑开/收缩高度：严格补偿 scrollTop += deltaH，画面零跳动！
                    viewport.scrollTop += deltaH;
                  }

                  loadedCount++;
                  updateProgress();
                } catch (err) {
                  // 单张读取或解码失败容错：跳过失败项，绝不中断其余图片加载
                  failedCount++;
                  if (!disposed) {
                    const oldH = slot.offsetHeight;
                    const wasAbove = slot.offsetTop < viewport.scrollTop - 2;
                    slot.classList.remove('skeleton');
                    slot.style.height = '76px';
                    slot.innerHTML = `<div class="text-xs px-4 py-3 rounded" style="background:#141920;color:#98a9b9;border:1px solid rgba(229,83,75,0.35);">跳过无法读取的图片：${escapeHtml(imgName)}</div>`;
                    const deltaH = slot.offsetHeight - oldH;
                    if (wasAbove && deltaH !== 0) viewport.scrollTop += deltaH;
                  }
                  updateProgress();
                }
              }));
            }

            await loadDirectorySequence(currentDir, currentTargetFile);
          }
        });
      }
    });

    /* ==========================================================================
       第十七部分：独立图片查看器 (Image Viewer — 缩放、拖拽平移、旋转、翻转、设壁纸)
       ========================================================================== */
    AppRegistry.register({
      id: 'imageviewer',
      name: '图片查看器',
      desc: '单图高精度预览器，支持无级缩放、旋转、镜像、同目录翻页与一键设壁纸',
      icon: Icons.image,
      color: '#48cae4',
      showOnDesktop: false,
      launch({ filePath = '' } = {}) {
        let currentFile = filePath ? PathUtils.normalize(filePath) : '';
        let siblings = [];
        let curIdx = 0;
        let scale = 1;
        let rotate = 0;
        let flipX = 1;
        let panX = 0, panY = 0;
        let activeUrl = null;

        WM.createWindow({
          appId: 'imageviewer',
          title: currentFile ? `图片查看器 — ${PathUtils.basename(currentFile)}` : '图片查看器',
          iconSvg: Icons.image,
          width: 820,
          height: 580,
          onClose: () => {
            if (activeUrl) URL.revokeObjectURL(activeUrl);
          },
          onMount: async (body, winRec) => {
            body.innerHTML = `
              <div class="px-2.5 py-1.5 flex flex-wrap items-center gap-1.5" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline);">
                <button class="ui-btn !h-7" id="iv-prev">${Icons.chevLeft}<span>上一张</span></button>
                <button class="ui-btn !h-7" id="iv-next"><span>下一张</span>${Icons.chevRight}</button>
                <button class="ui-btn !h-7" id="iv-zout">缩小 -</button>
                <span id="iv-zoom-txt" class="text-xs font-mono-code px-1">100%</span>
                <button class="ui-btn !h-7" id="iv-zin">放大 +</button>
                <button class="ui-btn !h-7" id="iv-reset">适应窗口</button>
                <button class="ui-btn !h-7" id="iv-rot">${Icons.refresh}<span>旋转 90°</span></button>
                <button class="ui-btn !h-7" id="iv-flip">水平翻转</button>
                <button class="ui-btn !h-7 ml-auto" id="iv-to-manga">${Icons.manga}<span>条漫模式</span></button>
                <button class="ui-btn primary !h-7" id="iv-set-wp">${Icons.paint}<span>设为壁纸</span></button>
              </div>
              <div id="iv-canvas-stage" class="flex-1 relative overflow-hidden flex items-center justify-center bg-[#090c10] cursor-grab">
                <img id="iv-img" class="max-w-full max-h-full object-contain select-none transition-transform duration-75" draggable="false" alt="" />
              </div>
            `;

            const imgEl = body.querySelector('#iv-img');
            const stage = body.querySelector('#iv-canvas-stage');
            const zoomTxt = body.querySelector('#iv-zoom-txt');

            const applyTransform = () => {
              imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale * flipX}, ${scale}) rotate(${rotate}deg)`;
              zoomTxt.textContent = `${Math.round(scale * 100)}%`;
            };

            const loadSiblingsAndShow = async (targetPath) => {
              if (!targetPath) return;
              currentFile = PathUtils.normalize(targetPath);
              const dir = PathUtils.dirname(currentFile);
              try {
                const entries = await window.fs.readdir(dir, { withDetails: true });
                siblings = entries
                  .filter(e => !e.isDirectory() && IMAGE_EXT_SET.has(PathUtils.extname(e.name).toLowerCase()))
                  .map(e => PathUtils.join(dir, e.name))
                  .sort(naturalCompare);
                curIdx = Math.max(0, siblings.indexOf(currentFile));
              } catch (_) {
                siblings = [currentFile];
                curIdx = 0;
              }
              await showCurrent();
            };

            const showCurrent = async () => {
              if (!siblings.length) return;
              currentFile = siblings[curIdx];
              scale = 1; rotate = 0; flipX = 1; panX = 0; panY = 0;
              applyTransform();
              try {
                const blob = await window.fs.readFile(currentFile, { asBlob: true });
                if (activeUrl) URL.revokeObjectURL(activeUrl);
                activeUrl = URL.createObjectURL(blob);
                imgEl.src = activeUrl;
                winRec.setTitle(`图片查看器 — ${PathUtils.basename(currentFile)} (${curIdx + 1}/${siblings.length})`);
              } catch (err) {
                Toast.show(`加载图片失败: ${err.message}`, 'error');
              }
            };

            stage.addEventListener('wheel', (e) => {
              e.preventDefault();
              const factor = e.deltaY < 0 ? 1.14 : 0.88;
              scale = Math.max(0.1, Math.min(8, scale * factor));
              applyTransform();
            }, { passive: false });

            let panning = false, startPX = 0, startPY = 0;
            stage.addEventListener('pointerdown', (e) => {
              panning = true;
              startPX = e.clientX - panX;
              startPY = e.clientY - panY;
              stage.setPointerCapture(e.pointerId);
            });
            stage.addEventListener('pointermove', (e) => {
              if (!panning) return;
              panX = e.clientX - startPX;
              panY = e.clientY - startPY;
              applyTransform();
            });
            stage.addEventListener('pointerup', () => { panning = false; });

            body.querySelector('#iv-prev').onclick = () => { if (siblings.length) { curIdx = (curIdx - 1 + siblings.length) % siblings.length; showCurrent(); } };
            body.querySelector('#iv-next').onclick = () => { if (siblings.length) { curIdx = (curIdx + 1) % siblings.length; showCurrent(); } };
            body.querySelector('#iv-zin').onclick = () => { scale = Math.min(8, scale * 1.25); applyTransform(); };
            body.querySelector('#iv-zout').onclick = () => { scale = Math.max(0.1, scale * 0.8); applyTransform(); };

                    <audio id="md-el" src="${mediaUrl}" controls autoplay class="w-full"></audio>
                  </div>
                `;
                const aud = stage.querySelector('#md-el');
                aud.playbackRate = Number(rateSel.value);
                rateSel.onchange = () => { aud.playbackRate = Number(rateSel.value); };

                // Web Audio 实时频谱渲染
                try {
                  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  const srcNode = audioCtx.createMediaElementSource(aud);
                  const analyser = audioCtx.createAnalyser();
                  analyser.fftSize = 128;
                  srcNode.connect(analyser);
                  analyser.connect(audioCtx.destination);

                  const cvs = stage.querySelector('#md-spec-canvas');
                  const ctx = cvs.getContext('2d');
                  const bufLen = analyser.frequencyBinCount;
                  const dataArr = new Uint8Array(bufLen);

                  const draw = () => {
                    analyser.getByteFrequencyData(dataArr);
                    ctx.fillStyle = '#0c1117';
                    ctx.fillRect(0, 0, cvs.width, cvs.height);
                    const barW = (cvs.width / bufLen) * 0.78;
                    const gap = (cvs.width / bufLen) * 0.22;
                    for (let i = 0; i < bufLen; i++) {
                      const h = (dataArr[i] / 255) * (cvs.height - 16);
                      const x = i * (barW + gap) + 4;
                      const grad = ctx.createLinearGradient(0, cvs.height, 0, cvs.height - h);
                      grad.addColorStop(0, '#2ec4b6');
                      grad.addColorStop(1, '#d9a05b');
                      ctx.fillStyle = grad;
                      ctx.fillRect(x, cvs.height - h - 4, barW, Math.max(2, h));
                    }
                    animRaf = requestAnimationFrame(draw);
                  };
                  aud.onplay = () => { if (audioCtx.state === 'suspended') audioCtx.resume(); };
                  draw();
                } catch (_) {}
              }
            };

    AppRegistry.register({
      id: 'calc',
      name: '计算器',
      desc: '支持科学函数、表达式求值、历史纸带与键盘快捷输入',
      icon: Icons.calc,
      color: '#d9a05b',
      launch() {
        WM.createWindow({
          appId: 'calc',
          title: '晷枢科学计算器',
          iconSvg: Icons.calc,
          width: 350,
          height: 490,
          minWidth: 300,
          minHeight: 420,
          onMount: (body) => {
            let expr = '';
            let result = '0';
            let historyList = [];

            const keys = [
              ['C', '(', ')', '退格'],
              ['sin', 'cos', 'sqrt', '÷'],
              ['7', '8', '9', '×'],
              ['4', '5', '6', '-'],
              ['1', '2', '3', '+'],
              ['±', '0', '.', '=']
            ];

            body.innerHTML = `
              <div class="p-3.5 flex flex-col h-full gap-2.5" style="background: var(--bg-surface-solid);">
                <div class="p-3 rounded flex flex-col items-end justify-end min-h-[86px]" style="background: var(--bg-input); border: 1px solid var(--border-hairline);">
                  <div id="calc-hist" class="text-[11px] font-mono-code w-full text-right truncate" style="color: var(--text-muted);">就绪</div>
                  <div id="calc-expr" class="text-xs font-mono-code w-full text-right break-all mt-1" style="color: var(--text-secondary);"></div>
                  <div id="calc-res" class="text-2xl font-bold font-mono-code w-full text-right truncate mt-0.5" style="color: var(--accent);">0</div>
                </div>
                <div class="grid grid-cols-4 gap-1.5 flex-1" id="calc-grid">
                  ${keys.flat().map(k => `
                    <button data-ckey="${k}" class="rounded font-semibold text-sm cursor-pointer transition-all hover:brightness-110"
                      style="background: ${k === '=' ? 'var(--accent)' : (['÷','×','-','+'].includes(k) ? 'var(--accent-soft)' : 'var(--bg-panel)')};
                             color: ${k === '=' ? 'var(--text-on-accent)' : 'var(--text-primary)'};
                             border: 1px solid var(--border-hairline);">${k}</button>
                  `).join('')}
                </div>
              </div>
            `;

            const exprEl = body.querySelector('#calc-expr');
            const resEl = body.querySelector('#calc-res');
            const histEl = body.querySelector('#calc-hist');

            const evaluateExpr = () => {
              if (!expr.trim()) return;
              try {
                const sanitized = expr
                  .replace(/×/g, '*')
                  .replace(/÷/g, '/')
                  .replace(/\bsin\(/g, 'Math.sin(')
                  .replace(/\bcos\(/g, 'Math.cos(')
                  .replace(/\bsqrt\(/g, 'Math.sqrt(');
                if (!/^[0-9+\-*/().,\sMath.sincosqrt]+$/.test(sanitized)) throw new Error('非法表达式');
                const val = Function(`"use strict"; return (${sanitized});`)();
                const formatted = Number.isFinite(val) ? String(Number(val.toPrecision(12))) : '错误';
                historyList.push(`${expr} = ${formatted}`);
                histEl.textContent = historyList[historyList.length - 1];
                result = formatted;
                expr = formatted === '错误' ? '' : formatted;
              } catch (_) {
                result = '表达式错误';
              }
              renderScreen();
            };

            const renderScreen = () => {
              exprEl.textContent = expr || '0';
              resEl.textContent = result;
            };

            const pressKey = (k) => {
              if (k === 'C') { expr = ''; result = '0'; }
              else if (k === '退格') { expr = expr.slice(0, -1); }
              else if (k === '=') { evaluateExpr(); return; }
              else if (k === '±') {
                if (expr.startsWith('-')) expr = expr.slice(1);
                else expr = '-' + expr;
              } else if (['sin', 'cos', 'sqrt'].includes(k)) {
                expr += `${k}(`;
              } else {
                expr += k;
              }
              renderScreen();
            };

            body.querySelectorAll('[data-ckey]').forEach(btn => {
              btn.onclick = () => pressKey(btn.dataset.ckey);
            });

            body.tabIndex = 0;
            body.addEventListener('keydown', (e) => {
              if (/^[0-9.()+\-]$/.test(e.key)) pressKey(e.key);
              else if (e.key === '*') pressKey('×');
              else if (e.key === '/') { e.preventDefault(); pressKey('÷'); }
              else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); pressKey('='); }
              else if (e.key === 'Backspace') pressKey('退格');
              else if (e.key === 'Escape') pressKey('C');
            });
          }
        });
      }
    });

    /* 曜刻画板 (Paint / Canvas Studio) — 直接读写 VFS 图片并支持一键设为桌面壁纸 */
    AppRegistry.register({
      id: 'paint',
      name: '画板',
      desc: '矢量几何与自由笔刷创作室，支持打开/保存 VFS 图像与设为桌面壁纸',
      icon: Icons.paint,
      color: '#e5534b',
      launch({ filePath = '' } = {}) {
        let currentPath = filePath ? PathUtils.normalize(filePath) : '';
        WM.createWindow({
          appId: 'paint',
          title: currentPath ? `画板 — ${PathUtils.basename(currentPath)}` : '画板 — 未命名画布.png',
          iconSvg: Icons.paint,
          width: 920,
          height: 620,
          onMount: async (body, winRec) => {
            let tool = 'brush'; // 'brush' | 'line' | 'rect' | 'circle' | 'eraser'
            let strokeColor = '#2ec4b6';
            let lineWidth = 4;
            let history = [];
            let historyPtr = -1;

            const palette = ['#2ec4b6', '#d9a05b', '#e5534b', '#48cae4', '#52b788', '#f4a261', '#9d8df1', '#ffffff', '#10151b'];

            body.innerHTML = `
              <div class="px-2.5 py-1.5 flex flex-wrap items-center gap-1.5" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline);">
                <button class="ui-btn !h-7 primary" data-ptool="brush">画笔</button>
                <button class="ui-btn !h-7" data-ptool="line">直线</button>
                <button class="ui-btn !h-7" data-ptool="rect">矩形</button>
                <button class="ui-btn !h-7" data-ptool="circle">圆形</button>
                <button class="ui-btn !h-7" data-ptool="eraser">橡皮擦</button>
                <div class="flex items-center gap-1 mx-1">
                  ${palette.map(c => `<button data-pcolor="${c}" class="w-5 h-5 rounded-full border border-white/25 cursor-pointer" style="background:${c}"></button>`).join('')}
                  <input type="color" id="pt-color-picker" value="${strokeColor}" class="w-6 h-6 bg-transparent border-0 cursor-pointer" />
                </div>
                <label class="flex items-center gap-1 text-xs">
                  <span>笔触</span>
                  <input type="range" id="pt-size" min="1" max="40" value="4" class="w-20" />
                </label>
                <button class="ui-btn !h-7" id="pt-undo">${Icons.undo}<span>撤销</span></button>
                <button class="ui-btn !h-7" id="pt-clear">${Icons.trash}<span>清空</span></button>
                <button class="ui-btn !h-7 ml-auto" id="pt-open">${Icons.folder}<span>打开 VFS</span></button>
                <button class="ui-btn primary !h-7" id="pt-save">${Icons.save}<span>保存到 VFS</span></button>
                <button class="ui-btn !h-7" id="pt-wallpaper">${Icons.paint}<span>设为壁纸</span></button>
              </div>
              <div class="flex-1 overflow-auto flex items-center justify-center p-4 bg-[#0b0e12]">
                <canvas id="pt-canvas" width="840" height="500" class="rounded shadow-2xl bg-[#121820]" style="touch-action: none; cursor: crosshair;"></canvas>
              </div>
            `;

            const cvs = body.querySelector('#pt-canvas');
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#121820';
            ctx.fillRect(0, 0, cvs.width, cvs.height);

            const pushSnapshot = () => {
              history = history.slice(0, historyPtr + 1);
              history.push(ctx.getImageData(0, 0, cvs.width, cvs.height));
              if (history.length > 30) history.shift();
              historyPtr = history.length - 1;
            };
            pushSnapshot();

            const loadFromVfs = async (p) => {
              try {
                const blob = await window.fs.readFile(p, { asBlob: true });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
                URL.revokeObjectURL(url);
                ctx.fillStyle = '#121820';
                ctx.fillRect(0, 0, cvs.width, cvs.height);
                const ratio = Math.min(cvs.width / img.width, cvs.height / img.height, 1);
                const dw = img.width * ratio;
                const dh = img.height * ratio;
                ctx.drawImage(img, (cvs.width - dw) / 2, (cvs.height - dh) / 2, dw, dh);
                pushSnapshot();
              } catch (err) {
                Toast.show(`加载画布图片失败: ${err.message}`, 'error');
              }
            };
            if (currentPath) await loadFromVfs(currentPath);

            let drawing = false;
            let startX = 0, startY = 0;
            let baseImage = null;

            const getCanvasCoords = (e) => {
              const r = cvs.getBoundingClientRect();
              return {
                x: ((e.clientX - r.left) / r.width) * cvs.width,
                y: ((e.clientY - r.top) / r.height) * cvs.height
              };
            };

            cvs.addEventListener('pointerdown', (e) => {
              drawing = true;
              cvs.setPointerCapture(e.pointerId);
              const pt = getCanvasCoords(e);
              startX = pt.x;
              startY = pt.y;
              baseImage = ctx.getImageData(0, 0, cvs.width, cvs.height);
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.lineWidth = lineWidth;
              ctx.strokeStyle = tool === 'eraser' ? '#121820' : strokeColor;
              if (tool === 'brush' || tool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
              }
            });

            cvs.addEventListener('pointermove', (e) => {
              if (!drawing) return;
              const pt = getCanvasCoords(e);
              if (tool === 'brush' || tool === 'eraser') {
                ctx.lineTo(pt.x, pt.y);
                ctx.stroke();
              } else {
                ctx.putImageData(baseImage, 0, 0);
                ctx.beginPath();
                if (tool === 'line') {
                  ctx.moveTo(startX, startY);
                  ctx.lineTo(pt.x, pt.y);
                } else if (tool === 'rect') {
                  ctx.strokeRect(startX, startY, pt.x - startX, pt.y - startY);
                } else if (tool === 'circle') {
                  const rad = Math.hypot(pt.x - startX, pt.y - startY);
                  ctx.arc(startX, startY, rad, 0, Math.PI * 2);
                }
                ctx.stroke();
              }
            });

            const finishDraw = () => {
              if (!drawing) return;
              drawing = false;
              pushSnapshot();
            };
            cvs.addEventListener('pointerup', finishDraw);
            cvs.addEventListener('pointercancel', finishDraw);

            body.querySelectorAll('[data-ptool]').forEach(btn => {
              btn.onclick = () => {
                tool = btn.dataset.ptool;
                body.querySelectorAll('[data-ptool]').forEach(b => b.classList.toggle('primary', b === btn));
              };
            });
            body.querySelectorAll('[data-pcolor]').forEach(btn => {
              btn.onclick = () => {
                strokeColor = btn.dataset.pcolor;
                body.querySelector('#pt-color-picker').value = strokeColor;
              };
            });
            body.querySelector('#pt-color-picker').oninput = (e) => { strokeColor = e.target.value; };
            body.querySelector('#pt-size').oninput = (e) => { lineWidth = Number(e.target.value); };
            body.querySelector('#pt-undo').onclick = () => {
              if (historyPtr > 0) {
                historyPtr--;
                ctx.putImageData(history[historyPtr], 0, 0);
              }
            };
            body.querySelector('#pt-clear').onclick = () => {
              ctx.fillStyle = '#121820';
              ctx.fillRect(0, 0, cvs.width, cvs.height);
              pushSnapshot();
            };
            body.querySelector('#pt-open').onclick = async () => {
              const p = await Modal.prompt('输入要打开的图片 VFS 路径', currentPath || '/Desktop/');
              if (p) { currentPath = PathUtils.normalize(p); await loadFromVfs(currentPath); }
            };

            const saveCanvasToVfs = async (targetOverride = null) => {
              let dest = targetOverride || currentPath;
              if (!dest) {
                const p = await Modal.prompt('保存画板作品到虚拟文件系统', '/Desktop/曜刻画作.png');
                if (!p) return null;
                dest = PathUtils.normalize(p.startsWith('/') ? p : PathUtils.join('/Desktop', p));
              }
              const blob = await new Promise(res => cvs.toBlob(res, 'image/png'));
              await window.fs.writeFile(dest, blob);
              currentPath = dest;
              winRec.setTitle(`画板 — ${PathUtils.basename(dest)}`);
              Desktop.render();
              Toast.show(`作品已保存至 ${dest}`);
              return dest;
            };

            body.querySelector('#pt-save').onclick = () => saveCanvasToVfs();
            body.querySelector('#pt-wallpaper').onclick = async () => {
              const wpPath = `/Pictures/Wallpapers/画板壁纸_${Date.now()}.png`;
              const saved = await saveCanvasToVfs(wpPath);
              if (saved) {
                SysConfig.update({ wallpaperId: 'custom', customWallpaperPath: saved });
                Toast.show('已将当前画作设为系统壁纸');
              }
            };
          }
        });
      }
    });

    /* ==========================================================================
       第二十部分：V86 x86 虚拟机模拟器 (严格锁定 v86@0.5.319 与对应 commit BIOS)
       规范核验：
       - libv86.js -> https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js
       - v86.wasm  -> https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm
       - seabios   -> https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin
       - vgabios   -> https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin
       - 强制标准 screen_container 结构（一个 white-space:pre 的 monospace div + 一个 canvas 且顺序不变）
       - 根据后缀正确挂载：iso -> cdrom，img/fda/bin -> fda，否则 -> hda（全部使用内存 buffer，严禁虚构外部镜像 URL！）

    /* 纯 JS 机器码合成的真实可引导 512 字节 x86 16位实模式 MBR 软盘镜像（零外部 URL，SeaBIOS 直接引导并支持键盘回显交互！） */
    function synthesizeBootableX86Image() {
      const sector = new Uint8Array(512);
      const code = [
        0x31, 0xC0,             // xor ax, ax
        0x8E, 0xD8,             // mov ds, ax
        0x8E, 0xC0,             // mov es, ax
        0xB8, 0x03, 0x00,       // mov ax, 0x0003 (80x25 VGA color text mode)
        0xCD, 0x10,             // int 0x10
        0xBE, 0x34, 0x7C,       // mov si, 0x7C34 (message offset)
        // print_loop (0x7C0E):
        0xAC,                   // lodsb
        0x08, 0xC0,             // or al, al
        0x74, 0x06,             // jz key_loop
        0xB4, 0x0E,             // mov ah, 0x0E
        0xCD, 0x10,             // int 0x10
        0xEB, 0xF5,             // jmp print_loop
        // key_loop (0x7C1A):
        0xB4, 0x00,             // mov ah, 0x00 (read keystroke)
        0xCD, 0x16,             // int 0x16
        0x3C, 0x0D,             // cmp al, 0x0D (Enter?)
        0x75, 0x0A,             // jne echo_char
        0xB4, 0x0E, 0xB0, 0x0D, 0xCD, 0x10,
        0xB0, 0x0A, 0xCD, 0x10,
        0xB0, 0x3E,             // '>' prompt
        // echo_char:
        0xB4, 0x0E,
        0xCD, 0x10,
        0xEB, 0xEA              // jmp key_loop
      ];
      sector.set(code, 0);
      const banner =
        "========================================================\r\n" +
        "  GUISHU OS // V86 (0.5.319) x86 REAL-MODE MICROKERNEL  \r\n" +
        "========================================================\r\n" +
        "SeaBIOS & VGABIOS Handshake OK.\r\n" +
        "Click screen or [Lock Mouse] and type on your keyboard:\r\n\r\n> ";
      const bannerBytes = new TextEncoder().encode(banner);
      sector.set(bannerBytes, 0x34);
      sector[510] = 0x55;
      sector[511] = 0xAA;
      return sector;
    }

    AppRegistry.register({
      id: 'vm',
      name: 'V86 虚拟机',
      desc: 'WebAssembly x86 硬件虚拟化模拟器 (v86@0.5.319)，支持 ISO/IMG/HDA 与鼠标锁定',
      icon: Icons.vm,
      color: '#9d8df1',
      launch({ filePath = '/Desktop/x86微内核演示.img' } = {}) {
        let emulator = null;
        let currentImagePath = filePath ? PathUtils.normalize(filePath) : '';

        WM.createWindow({
          appId: 'vm',
          title: 'V86 x86 虚拟机模拟器 (v0.5.319)',
          iconSvg: Icons.vm,
          width: 820,
          height: 560,
          onClose: () => {
            if (emulator) {
              try { emulator.destroy(); } catch (_) {
                try { emulator.stop(); } catch (_) {}
              }
              emulator = null;
            }
          },
          onMount: async (body, winRec) => {
            body.innerHTML = `
              <div class="px-2.5 py-1.5 flex flex-wrap items-center gap-1.5" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline);">
                <button class="ui-btn primary !h-7" id="vm-boot-vfs">${Icons.vm}<span>选择 VFS 镜像启动</span></button>
                <button class="ui-btn !h-7" id="vm-upload-local">${Icons.upload}<span>载入本地 ISO/IMG</span></button>
                <button class="ui-btn !h-7" id="vm-boot-demo">${Icons.refresh}<span>启动内置 x86 微内核</span></button>
                <select id="vm-ram-sel" class="ui-select !h-7 text-xs" title="虚拟机内存大小">
                  <option value="32">32 MB RAM</option>
                  <option value="64">64 MB RAM</option>
                  <option value="128" selected>128 MB RAM</option>

                </select>
                <button class="ui-btn !h-7" id="vm-lock-mouse" style="border-color: var(--accent);">${Icons.mouseLock}<span>锁定鼠标 (Esc 退出)</span></button>
                <button class="ui-btn !h-7" id="vm-cad">Ctrl+Alt+Del</button>

              </div>

              <div class="flex-1 bg-black flex flex-col items-center justify-center overflow-auto p-2 relative">
                <div id="vm-status-overlay" class="text-xs mb-2 font-mono-code" style="color: #98a9b9;">等待镜像挂载引导...</div>
                <!-- V86 强制要求的标准 screen_container 结构：第一个 white-space:pre monospace div + 第二个 canvas，顺序严禁变动 -->
                <div id="v86-screen-container" class="bg-black border border-white/10 shadow-2xl p-1">
                  <div style="white-space: pre; font: 14px monospace; line-height: 14px; color: #e7eef4;"></div>
                  <canvas style="display: none"></canvas>
                </div>
              </div>
            `;

            const screenContainer = body.querySelector('#v86-screen-container');
            const statusOverlay = body.querySelector('#vm-status-overlay');
            const ramSel = body.querySelector('#vm-ram-sel');

            const bootFromBuffer = async (arrayBuffer, filenameLabel) => {
              try {
                const V86Constructor = await CDNLoader.ensureV86();
                if (!V86Constructor) throw new Error('V86 构造函数未能初始化');

                if (emulator) {
                  try { emulator.destroy(); } catch (_) { try { emulator.stop(); } catch (_) {} }
                  emulator = null;
                }

                // 重置 screen_container 内部两个子元素初始状态，确保结构严格匹配 V86 ScreenAdapter
                screenContainer.innerHTML = `<div style="white-space: pre; font: 14px monospace; line-height: 14px; color: #e7eef4;"></div><canvas style="display: none"></canvas>`;

                const ext = PathUtils.extname(filenameLabel).toLowerCase();
                const ramMB = Number(ramSel.value) || 128;

                const v86Config = {
                  wasm_path: CDN_URLS.v86Wasm,
                  memory_size: ramMB * 1024 * 1024,
                  vga_memory_size: 8 * 1024 * 1024,
                  screen_container: screenContainer,
                  bios: { url: CDN_URLS.v86SeaBios },
                  vga_bios: { url: CDN_URLS.v86VgaBios },
                  autostart: true
                };

                // 严格按文件后缀挂载对应设备槽位：iso -> cdrom，img/fda/bin -> fda，否则 -> hda
                let mountSlotName = 'hda';
                if (ext === '.iso') {
                  v86Config.cdrom = { buffer: arrayBuffer };
                  mountSlotName = 'cdrom';
                } else if (ext === '.img' || ext === '.fda' || ext === '.bin') {
                  v86Config.fda = { buffer: arrayBuffer };
                  mountSlotName = 'fda';
                } else {
                  v86Config.hda = { buffer: arrayBuffer };
                  mountSlotName = 'hda';
                }

                statusOverlay.textContent = `正在启动 [${filenameLabel}] -> 挂载槽位 ${mountSlotName.toUpperCase()} (${ramMB}MB RAM)...`;
                emulator = new V86Constructor(v86Config);
                winRec.setTitle(`V86 虚拟机 — ${filenameLabel} [${mountSlotName.toUpperCase()}]`);

                setTimeout(() => {
                  statusOverlay.textContent = `运行中: ${filenameLabel} (${mountSlotName.toUpperCase()}) · 点击「锁定鼠标」可捕获指针输入`;
                }, 900);
              } catch (err) {
                statusOverlay.textContent = `虚拟机启动异常: ${err.message}`;
                Toast.show(`V86 启动失败: ${err.message}`, 'error');
              }
            };

            const bootFromVfsPath = async (vfsPath) => {
              if (!vfsPath || !(await window.fs.exists(vfsPath))) {
                const raw = synthesizeBootableX86Image();
                await bootFromBuffer(raw.buffer, '内置x86微内核.img');
                return;
              }
              IOBusy.show(`正在读取镜像 ${PathUtils.basename(vfsPath)}...`);
              try {
                const bytes = await window.fs.readFile(vfsPath);
                const exactBuffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
                await bootFromBuffer(exactBuffer, PathUtils.basename(vfsPath));
              } finally {
                IOBusy.hide();
              }
            };

            // 鼠标锁定功能（支持调用 V86 原生 lock_mouse() 及 Pointer Lock API 双保险）
            body.querySelector('#vm-lock-mouse').onclick = () => {
              if (emulator && typeof emulator.lock_mouse === 'function') {
                emulator.lock_mouse();
                Toast.show('已请求锁定鼠标到虚拟机（按 Esc 键可释放鼠标）');
              } else if (screenContainer.requestPointerLock) {
                screenContainer.requestPointerLock();
              }
            };

            body.querySelector('#vm-cad').onclick = () => {
              if (emulator && typeof emulator.keyboard_send_scancodes === 'function') {
                emulator.keyboard_send_scancodes([0x1d, 0x38, 0x53, 0x53 | 0x80, 0x38 | 0x80, 0x1d | 0x80]);
              }
            };

            body.querySelector('#vm-boot-demo').onclick = () => {
              const raw = synthesizeBootableX86Image();
              bootFromBuffer(raw.buffer, 'x86微内核演示.img');
            };

            body.querySelector('#vm-boot-vfs').onclick = async () => {
              const p = await Modal.prompt('输入 VFS 中的镜像路径 (.iso / .img / .fda / .bin / .hda)', currentImagePath || '/Desktop/x86微内核演示.img');
              if (p) {
                currentImagePath = PathUtils.normalize(p);
                await bootFromVfsPath(currentImagePath);
              }
            };

            const localInp = body.querySelector('#vm-local-file');
            body.querySelector('#vm-upload-local').onclick = () => { localInp.value = ''; localInp.click(); };
            localInp.onchange = async () => {
              const f = localInp.files && localInp.files[0];
              if (!f) return;
              const ab = await f.arrayBuffer();
              // 同步保存到 VFS /Downloads 以便持久化复用
              const saveP = PathUtils.join('/Downloads', f.name);
              window.fs.writeFile(saveP, new Uint8Array(ab), { mtime: f.lastModified }).catch(() => {});
              await bootFromBuffer(ab, f.name);
            };

            await bootFromVfsPath(currentImagePath);
          }
        });
      }
    });

    AppRegistry.register({

            const renderShell = () => {

              body.querySelectorAll('[data-stab]').forEach(btn => {
                btn.onclick = () => {
                  activeTab = btn.dataset.stab;
                  renderShell();
                };

              const pane = body.querySelector('#st-main-pane');
              if (activeTab === 'storage') renderStorageTab(pane);
              else if (activeTab === 'appearance') renderAppearanceTab(pane);
              else renderDesktopTab(pane);
            };

            // 递归扫描指定驱动器的实际占用与分类占比
            async function scanDriverStats(driver) {
              const stats = { totalBytes: 0, fileCount: 0, dirCount: 0, byCat: { image: 0, code: 0, doc: 0, media: 0, archive: 0, other: 0 }, topFiles: [] };
              if (!driver) return stats;
              const walk = async (rel) => {
                let list = [];
                try { list = await driver.readdir(rel, true); } catch (_) { return; }
                for (const it of list) {
                  const p = PathUtils.join(rel, it.name);
                  if (it.isDirectory()) {
                    stats.dirCount++;
                    await walk(p);
                  } else {
                    const sz = it.size || 0;
                    stats.fileCount++;
                    stats.totalBytes += sz;
                    stats.topFiles.push({ path: p, size: sz, mtime: it.mtime });
                    const cat = FileTypes.getCategory(it.name, false);
                    if (cat === 'image') stats.byCat.image += sz;
                    else if (cat === 'html' || cat === 'code') stats.byCat.code += sz;
                    else if (cat === 'text' || cat === 'table' || cat === 'pdf') stats.byCat.doc += sz;
                    else if (cat === 'audio' || cat === 'video') stats.byCat.media += sz;
                    else if (cat === 'archive' || cat === 'vm') stats.byCat.archive += sz;
                    else stats.byCat.other += sz;
                  }
                }
              };
              await walk('/');
              stats.topFiles.sort((a, b) => b.size - a.size);
              stats.topFiles = stats.topFiles.slice(0, 8);
              return stats;
            }

            async function renderStorageTab(pane) {

              let quota = 0, usage = 0;

                  usage = est.usage || 0;

              let lsBytes = 0;
