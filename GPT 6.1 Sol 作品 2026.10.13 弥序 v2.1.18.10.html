    $('.settings-nav',win.body).onclick=e=>{const b=e.target.closest('[data-tab]');if(b)run(()=>render(b.dataset.tab));};page.onchange=e=>{const key=e.target.dataset.pref;if(!key)return;prefs[key]=['scale','grid','fontSize','saveDelay'].includes(key)?Number(e.target.value):e.target.value;applyPrefs();savePrefs();if(key==='grid')arrangeDesktop();if(key==='fontSize')$$('.note-text').forEach(el=>el.style.fontSize=prefs.fontSize+'px');if(key==='editorInput')toast('默认输入模式已更新，将在下次打开编辑器时使用。');};page.onclick=e=>{const wallpaper=e.target.closest('[data-wallpaper]');if(wallpaper){prefs.wallpaper=Number(wallpaper.dataset.wallpaper);savePrefs();run(setWallpaper);$$('[data-wallpaper]',page).forEach(b=>b.classList.toggle('active',b===wallpaper));return;}const toggle=e.target.closest('[data-toggle]');if(toggle){const key=toggle.dataset.toggle;prefs[key]=!prefs[key];toggle.classList.toggle('on',prefs[key]);toggle.setAttribute('aria-checked',prefs[key]);applyPrefs();savePrefs();return;}const mount=e.target.closest('[data-mount-action]');if(mount){run(async()=>{const name=mount.dataset.mountName,path=join('/mnt/local',name);switch(mount.dataset.mountAction){case'open':openExplorer(path);break;case'reconnect':{const handle=await db.get('mounts',name);if(handle?.getDirectoryHandle)await fs.mount(handle);else await mountFolder();await render();break;}case'unmount':await fs.unmount(path);toast('已卸载，真实文件未被更改。');await render();break;}});return;}const b=e.target.closest('[data-setting]');if(!b)return;run(async()=>{switch(b.dataset.setting){case'upload-wallpaper':$('#wallpaper-input').click();break;case'fullscreen':await toggleSystemFullscreen();break;case'desktop':showDesktop();break;case'refresh-storage':await render('storage');break;case'mount':await mountFolder();await render('mounts');break;case'persist':{if(!navigator.storage?.persist)return toast('当前浏览器不提供存储保护接口。');const granted=await navigator.storage.persist();toast(granted?'浏览器已授予持久化存储保护。':'浏览器暂未授予保护。请定期导出重要文件。',granted?'info':'err   async function resetSystem(){const answer=await ask('重置整个工作空间？',{message:'这会永久删除本站私有文件、草稿和设置。\n真实挂载文件夹不会被删除。建议先导出备份。\n输入「重置」以继续。',placeholder:'输入 重置',confirm:'永久重置',danger:true});if(answer!=='重置')return;for(const win of [...windows.values()]){await win.close();if(windows.has(win.id)){toast('有文档未能保存，已中止重置。','error');return;}}savePrefs.cancel();await Promise.allSettled([...fs.locks.values()]);fs.mounts.clear();for(const entry of await fs.backend.readdir('/'))await fs.backend.delete('/'+entry.name,{recursive:true});for(const store of ['nodes','meta','mounts'])await db.clear(store);try{for(const key of Object.keys(localStorage))if(key.startsWith('miova.'))localStorage.removeItem(key);document.cookie='miova-theme=;max-age=0;path=/;SameSite=Lax';}catch{}location.reload();}
  async function runDiagnostics(){
    const report=[],testId=uid(),root='/.system/test-'+testId,mountPoint='/mnt/local/.diagnostic-'+testId;
    const assert=(condition,message)=>{if(!condition)throw Error(message);};
    const test=async(name,fn)=>{try{await fn();report.push('通过  '+name);}catch(e){report.push('失败  '+name+'：'+e.message);}};
    await fs.mkdir(root);
    try{
      await test('原生二进制写入与读取',async()=>{
        const bytes=new Uint8Array([0,1,127,128,255,0,18]);await fs.writeFile(root+'/binary.bin',bytes);
        const read=new Uint8Array(await fs.readFile(root+'/binary.bin'));
        assert(read.length===bytes.length&&read.every((b,i)=>b===bytes[i]),'二进制内容不一致');
      });
      await test('UTF-8 文本与 callback / 额外参数兼容',async()=>{
        await fs.writeFile(root+'/文本.txt','弥序\nMIOVA');
        const text=await new Promise((resolve,reject)=>fs.readFile(root+'/文本.txt','utf8','r',(error,value)=>error?reject(error):resolve(value)));
        assert(text==='弥序\nMIOVA','UTF-8 内容不一致');
        const stat=await new Promise((resolve,reject)=>fs.stat(root+'/文本.txt',false,'compat',(error,value)=>error?reject(error):resolve(value)));
        assert(stat.isFile(),'stat 类型错误');
        const handle=await fs.open(root+'/文本.txt','r');assert(await handle.readFile('utf8')===text,'open 句柄内容不一致');await handle.close();
      });
      await test('目录复制、移动与准确递归大小',async()=>{
        await fs.mkdir(root+'/folder');await fs.writeFile(root+'/folder/a.bin',new Uint8Array([1,2,3]));await fs.writeFile(root+'/folder/b.bin',new Uint8Array([1,2]));
        assert((await fs.stat(root+'/folder')).size===5,'目录实际大小不正确');
        await fs.copy(root+'/folder',root+'/copy');await fs.rename(root+'/copy',root+'/moved');
        assert(await fs.exists(root+'/moved/a.bin')&&!await fs.exists(root+'/copy'),'移动未完成');
        assert((await fs.stat(root+'/moved')).size===5,'复制后大小错误');
      });
      await test('源修改日期与 Blob MIME 保留',async()=>{
        const date=new Date(2024,5,13,15,16,18).getTime();
        await fs.writeFile(root+'/typed',new Blob(['<svg xmlns="http://www.w3.org/2000/svg"/>'],{type:'image/svg+xml'}),{mtime:date});
        assert((await fs.stat(root+'/typed')).mtime===date,'修改日期没有保留');
        assert((await fs.readBlob(root+'/typed')).type==='image/svg+xml','Blob MIME 丢失');
      });
      if(typeof fs.backend.directory==='function'){
        await test('统一挂载路由与跨后端移动',async()=>{
          await fs.mkdir(root+'/mounted-root');const handle=await fs.backend.directory(root+'/mounted-root');
          fs.mounts.set(mountPoint,new HandleBackend(handle,'test:'+testId+':'));fs.sizeCache.clear();
          await fs.writeFile(mountPoint+'/routed.txt','同一套 fs API');
          assert(await fs.readFile(root+'/mounted-root/routed.txt','utf8')==='同一套 fs API','挂载路由内容不一致');
          await fs.rename(mountPoint+'/routed.txt',root+'/cross-backend.txt');
          assert(await fs.exists(root+'/cross-backend.txt')&&!await fs.exists(mountPoint+'/routed.txt'),'跨后端移动失败');
        });
      }else report.push('跳过  原生句柄挂载路由（当前后端未提供原生目录句柄）');
      await test('自然数字排序 1, 2, 10',()=>{
        assert(['10.jpg','2.jpg','1.jpg'].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true})).join(',')==='1.jpg,2.jpg,10.jpg','自然排序错误');
      });
      await test('CSV / TSV 引号与多行文本往返',()=>{
        const rows=[['一,二','含"引号"','多\n行'],['a','b\tc','c']];
        for(const delimiter of [',','\t'])assert(JSON.stringify(parseDelimited(serializeDelimited(rows,delimiter),delimiter))===JSON.stringify(rows),'结构化文本往返错误');
      });
      await test('ZIP DOS 日期的本地时区往返',()=>{
        const date=new Date(2024,5,13,15,16,18).getTime();assert(fromZipDate(toZipDate(date))===date,'时区偏移');
      });
      await test('归档路径穿越防护',()=>{
        for(const path of ['../../outside.txt','/absolute','C:/absolute','folder/../outside']){let blocked=false;try{safeArchivePath(path);}catch{blocked=true;}assert(blocked,'未拒绝不安全路径：'+path);}
      });
      await test('计算器运算优先级与百分数',()=>{
        assert(calculateExpression('2+3*(4-1)')===11,'优先级错误');assert(calculateExpression('200*10%')===20,'百分比错误');
      });
    }finally{
      fs.mounts.delete(mountPoint);fs.sizeCache.clear();await fs.delete(root).catch(()=>{});
      for(const key of await db.keys('meta'))if(key.startsWith('test:'+testId+':'))await db.delete('meta',key);
    }
    report.push('','后端：'+fs.label+' · 独立测试目录已清理','窗口手势、真实文件夹授权、CDN 与 VM 启动仍需实际设备验证。');
    return report;
  }

  /* 20. App launcher, global file search, calendar, and quick controls. */
  function toggleLauncher(focusSearch=false){if(activePopup?.classList.contains('launcher')){closePopup();return;}closePopup();const popup=document.createElement('section');popup.className='popup launcher';popup.innerHTML='<div class="launcher-head">'+icon('mark')+'<h2>你的空间，无限可能。</h2><span>MIOVA</span></div><label class="launcher-search">'+icon('search')+'<input placeholder="搜索应用、文件与灵感…" aria-label="全局搜索"><kbd class="shortcut-key">Ctrl K</kbd></label><div class="launcher-grid">'+apps.map(a=>`<button class="launcher-app" data-app="${a.id}">${appIcon(a.icon)}<span>${a.name}</span></button>`).join('')+'</div><div class="global-results" hidden></div><div class="launcher-bottom"><i class="status-dot"></i><span>所有文件，安心留在此设备。</span><span class="spacer"></span><button class="icon-btn" data-settings title="系统设置" aria-label="系统设置">'+icon('settings')+'</button></div>';document.body.append(popup);activePopup=popup;const input=$('input',popup),results=$('.global-results',popup),grid=$('.launcher-grid',popup);let searchId=0,controller=null;const search=debounce(async()=>{const q=input.value.trim().toLocaleLowerCase(),id=++searchId;controller?.abort();controller=new AbortController();if(!q){results.hidden=true;grid.hidden=false;return;}grid.hidden=true;results.hidden=false;results.innerHTML='<p class="muted tiny" style="padding:12px">正在搜索本地文件…</p>';await fsReady;const foundApps=apps.filter(a=>a.name.toLowerCase().includes(q)||a.id.includes(q));let foundFiles=[];try{foundFiles=(await fs.walk('/',{hidden:false,signal:controller.signal})).filter(e=>e.name.toLocaleLowerCase().includes(q)).slice(0,60);}catch(e){if(e.name==='AbortError')return;}if(id!==searchId||!popup.isConnected)return;results.replaceChildren();for(const app of foundApps){const b=document.createElement('button');b.className='search-result';b.innerHTML=appIcon(app.icon)+'<div>'+app.name+'<small>应用程序</small></div>';b.onclick=()=>launchApp(app.id);results.append(b);}for(const entry of foundFiles){const b=document.createElement('button');b.className='search-result';b.innerHTML=appIcon(iconFor(entry.path,entry.kind))+'<div>'+escapeHTML(entry.name)+'<small>'+escapeHTML(entry.path)+'</small></div>';b.onclick=()=>{closePopup();run(()=>openPath(entry.path));};results.append(b);}if(!foundApps.length&&!foundFiles.length)results.innerHTML='<div class="empty-state" style="min-height:155px">'+icon('search')+'<p>没有找到「'+escapeHTML(input.value)+'」<br>试试文件名的一部分。</p></div>';},180);input.oninput=search;popup.onclick=e=>{const app=e.target.closest('[data-app]');if(app)launchApp(app.dataset.app);if(e.target.closest('[data-settings]')){closePopup();openSettings();}};popup._dispose=()=>{searchId++;controller?.abort();search.cancel();};input.onkeydown=e=>{if(e.key==='Enter')$('.search-result',popup)?.click();};if(focusSearch||innerWidth>700)setTimeout(()=>input.focus(),50);}
  let calendarDate=new Date(),pickedDate=new Date();
  function updateClock(){if(!prefs)return;const now=new Date();const date=now.toLocaleDateString('zh-CN',{month:'long',day:'numeric'}),time=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:!prefs.clock24});const clock=$('#clock-button');if(clock)clock.textContent=date+'  '+time;const popupClock=$('.calendar-clock');if(popupClock)popupClock.textContent=time;}
  function toggleCalendar(){if(activePopup?.classList.contains('calendar'))return closePopup();closePopup();calendarDate=new Date();pickedDate=new Date();const popup=document.createElement('section');popup.className='popup calendar';document.body.append(popup);activePopup=popup;function render(){const now=new Date(),year=calendarDate.getFullYear(),month=calendarDate.getMonth(),first=new Date(year,month,1),start=new Date(year,month,1-((first.getDay()+6)%7));popup.innerHTML='<div class="calendar-clock"></div><div class="calendar-full-date">'+now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'</div><div class="calendar-nav"><span>'+year+' 年 '+(month+1)+' 月</span><span class="spacer"></span><button class="icon-btn" data-month="-1" aria-label="上个月">'+icon('back')+'</button><button class="icon-btn" data-month="1" aria-label="下个月">'+icon('forward')+'</button></div><div class="calendar-grid">'+'一二三四五六日'.split('').map(day=>'<span class="calendar-day weekday">'+day+'</span>').join('')+Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const same=(a,b)=>a.toDateString()===b.toDateString();return `<button class="calendar-day ${d.getMonth()!==month?'outside':''} ${same(d,now)?'today':''} ${same(d,pickedDate)?'picked':''}" data-date="${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}">${d.getDate()}</button>`;}).join('')+'</div><div class="calendar-foot row"><span>'+pickedDate.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+'</span><span class="spacer"></span><button class="btn tiny" data-today>回到今天</button></div>';updateClock();}popup.onclick=e=>{const month=e.target.closest('[data-month]'),date=e.target.closest('[data-date]');if(month){calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+Number(month.dataset.month),1);render();}else if(date){const [y,m,d]=date.dataset.date.split('-').map(Number);pickedDate=new Date(y,m-1,d);render();}else if(e.target.closest('[data-today]')){calendarDate=new Date();pickedDate=new Date();render();}};render();}
  function quickSettings(){if(activePopup?.classList.contains('quick-controls'))return closePopup();closePopup();const popup=document.createElement('div');popup.className='popup quick-controls';popup.style.cssText='right:24px;top:52px;width:290px;padding:23px';popup.innerHTML='<div class="row" style="margin-bottom:21px">'+icon(navigator.onLine?'wifi':'warning')+'<span>'+ (navigator.onLine?'网络接口已连接':'当前网络离线')+'</span></div><div class="setting-row" style="padding-top:0"><span class="spacer">深色外观</span><button class="toggle '+(prefs.theme==='dark'?'on':'')+'" data-dark aria-label="切换外观"></button></div><label class="setting-row"><span class="spacer">应用媒体音量</span><input data-volume type="range" min="0" max="1" step=".05" value="'+(prefs.volume??.8)+'" style="width:110px"></label><label class="setting-row"><span class="spacer">壁纸亮度</span><input data-brightness type="range" min=".3" max="1.2" step=".05" value="'+(prefs.brightness??1)+'" style="width:110px"></label><button class="btn subtle" data-open-settings style="width:100%;margin-top:19px">'+icon('settings')+'全部设置</button>';document.body.append(popup);activePopup=popup;$('[data-dark]',popup).onclick=e=>{prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();savePrefs();e.currentTarget.classList.toggle('on',prefs.theme==='dark');};$('[data-volume]',popup).oninput=e=>{prefs.volume=Number(e.target.value);$$('audio,video').forEach(m=>m.volume=prefs.volume);savePrefs();};$('[data-brightness]',popup).oninput=e=>{prefs.brightness=Number(e.target.value);$('#wallpaper').style.filter='brightness('+prefs.brightness+')';savePrefs();};$('[data-open-settings]',popup).onclick=()=>{closePopup();openSettings();};}
  async function recoverDrafts(){const snapshots=new Map();try{for(const key of Object.keys(localStorage)){if(key.startsWith('miova.recovery:')){const doc=JSON.parse(localStorage.getItem(key));snapshots.set(key.slice(15),{...doc,key});}}}catch{}for(const entry of await fs.readdir('/.system/drafts')){if(extname(entry.name)!=='json')continue;try{const doc=JSON.parse(await fs.readFile(entry.path,'utf8')),id=entry.name.slice(0,-5),old=snapshots.get(id);if(!old||old.time<doc.time)snapshots.set(id,{...doc,draft:entry.path,key:old?.key});else old.draft=entry.path;}catch{}}if(!snapshots.size)return;toast(`发现 ${snapshots.size} 份未完成保存的草稿。`,'info',{label:'恢复草稿',run:async()=>{let count=0;for(const doc of snapshots.values()){const name=doc.path?basename(doc.path):doc.name||'恢复的文档.txt';const dest=await uniquePath('/Desktop','恢复-'+name);await fs.writeFile(dest,doc.text);if(doc.key)safeStore.remove(doc.key);if(doc.draft)await fs.delete(doc.draft);count++;}toast('已恢复 '+count+' 份草稿到桌面，未覆盖源文件。');openExplorer('/Desktop');}});}

  /* 21. Start immediately. Initialization is real I/O, never a decorative boot screen. */
  $('#brand-symbol').innerHTML=icon('mark');$('#quick-settings').innerHTML=icon('wifi')+icon('sound');$('#wallpaper').innerHTML=makeWallpaper(Number(prefs.wallpaper)||0);$('#wallpaper').style.filter='brightness('+(prefs.brightness??1)+')';applyPrefs();renderDock();updateClock();setInterval(updateClock,15000);
  $('#brand-button').onclick=()=>toggleLauncher();$('#clock-button').onclick=toggleCalendar;$('#top-desktop').onclick=showDesktop;$('#top-files').onclick=()=>launchApp('explorer');$('#quick-settings').onclick=quickSettings;$('#profile-button').onclick=()=>{if(fs)openSettings('about');};$('#top-view').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();showMenu(r.left,r.bottom+12,[{label:'显示桌面',icon:'desktop',run:showDesktop},{label:'打开应用启动器',icon:'grid',key:'Ctrl+Space',run:toggleLauncher},{label:'全局搜索',icon:'search',key:'Ctrl+K',run:()=>toggleLauncher(true)},{label:'全屏模式',icon:'full',run:toggleSystemFullscreen},{label:'外观与壁纸',icon:'settings',run:()=>openSettings('appearance')}]);};
  $('#peek-button').onmouseenter=()=>{for(const win of windows.values())win.el.classList.add('peek');};$('#peek-button').onmouseleave=()=>{for(const win of windows.values())win.el.classList.remove('peek');};$('#peek-button').onclick=showDesktop;$('#desktop').oncontextmenu=desktopMenu;wireDropZone($('#desktop'),()=>'/Desktop');installMarquee($('#desktop'),'.desktop-icon',{selected:desktopSelection});
  $('#wallpaper-input').onchange=e=>run(async()=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))throw Error('请选择浏览器支持的图片。');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();}finally{URL.revokeObjectURL(url);}await fs.writeFile('/.system/wallpaper',new Blob([await file.arrayBuffer()],{type:file.type}));await db.put('meta','wallpaper-mime',file.type);prefs.wallpaper='custom';savePrefs();await setWallpaper();toast('你的壁纸已保存到本地。');e.target.value='';});
  document.addEventListener('keydown',e=>{if(e.defaultPrevented)return;if(e.key==='Escape'){closePopup();return;}const typing=e.target.closest('input,textarea,[contenteditable=true],.CodeMirror');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!typing){e.preventDefault();toggleLauncher(true);}else if(e.ctrlKey&&e.code==='Space'){e.preventDefault();toggleLauncher();}else if(e.altKey&&e.key==='F4'&&focusedWindow){e.preventDefault();run(()=>focusedWindow.close());}else if(!typing&&!e.target.closest('.window')){const paths=[...desktopSelection].filter(p=>!p.startsWith('app:'));if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();$$('.desktop-icon').forEach(el=>{desktopSelection.add(el.dataset.key);el.classList.add('selected');});}else if((e.ctrlKey||e.metaKey)&&['c','x'].includes(e.key.toLowerCase())){e.preventDefault();clipboard={paths,cut:e.key.toLowerCase()==='x'};toast(paths.length+' 个项目已加入剪贴板');}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){e.preventDefault();run(()=>pasteFiles('/Desktop'));}else if(e.key==='Delete'&&paths.length)run(()=>trashPaths(paths));}});
  const resizeDesktop=debounce(()=>{renderDesktopPositions();if(innerWidth<=700)return;for(const win of windows.values()){if(win.el.classList.contains('immersive'))continue;if(win.maximized)Object.assign(win.el.style,{width:(innerWidth-16)+'px',height:(innerHeight-143)+'px'});else{const r=win.el.getBoundingClientRect(),width=Math.min(r.width,innerWidth-20),height=Math.min(r.height,innerHeight-145);Object.assign(win.el.style,{width:width+'px',height:height+'px',left:clamp(r.left,10,innerWidth-width-10)+'px',top:clamp(r.top,51,innerHeight-height-93)+'px'});}}},150);window.addEventListener('resize',resizeDesktop);
  fsReady=window.fsReady=initializeStorage();fsReady.then(async()=>{
    await renderDesktop();openExplorer('home');
    const refreshDesktop=debounce(()=>run(renderDesktop),180);
    document.addEventListener('fschange',e=>{
      if(e.detail.some(p=>p==='/Desktop'||dirname(p)==='/Desktop'))refreshDesktop();
      for(const [path,entry]of dragCache)if(!nativeDragPaths.includes(path)&&e.detail.some(p=>p===path||p.startsWith(path+'/'))){if(entry.url)URL.revokeObjectURL(entry.url);dragCache.delete(path);}
    });
    if(prefs.mountedNames.length)setTimeout(()=>toast('已记住本地文件夹，请重新授权连接。','info',{label:'管理挂载',run:()=>openSettings('mounts')}),900);
    run(recoverDrafts);window.miova={fs,windows,openPath,openExplorer,openEditor,openReader,runDiagnostics,calculateExpression,parseDelimited,serializeDelimited};
    if(new URLSearchParams(location.search).has('selftest')){const results=await runDiagnostics();console.info('MIOVA diagnostics\n'+results.join('\n'));const report=createWindow({type:'settings',title:'系统诊断结果',icon:'check',width:650,height:470});const pre=document.createElement('pre');pre.className='diagnostic-list';pre.style.padding='25px';pre.style.overflow='auto';pre.textContent=results.join('\n');report.body.append(pre);}
  }).catch(e=>{console.error('MIOVA initialization failed',e);toast('工作空间初始化失败：'+e.message+'。请确认浏览器允许本站存储。','error');});
