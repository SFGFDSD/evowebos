async function posterBlob(index){let palettes=[['#244e58','#9bbab0','#e9c894'],['#577577','#c7cdb4','#e8b67e'],['#193c48','#698f92','#d5c399']],p=palettes[index%3],titles=['离 岸','漂 流','归 岸'],sub=['DEPARTURE','DRIFTING','HOMEWARD'];let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="800" height="1100" fill="${p[0]}"/><rect x="35" y="35" width="730" height="1030" fill="url(#g)"/><circle cx="${index===1?540:400}" cy="380" r="155" fill="${p[2]}"/><g fill="none" stroke="${p[2]}" opacity=".3"><circle cx="400" cy="380" r="195"/><circle cx="400" cy="380" r="245"/></g><path d="M35 590Q240 ${470+index*70} 420 610T765 580V1065H35Z" fill="${p[0]}" opacity=".65"/><path d="M35 720Q290 ${570+index*50} 500 745T765 700V1065H35Z" fill="${p[0]}"/><g fill="none" stroke="${p[1]}" opacity=".4">${Array.from({length:10},(_,i)=>`<path d="M80 ${770+i*18}Q350 ${690+i*20} 710 ${780+i*18}"/>`).join('')}</g><text x="85" y="135" fill="${p[2]}" font-family="monospace" font-size="14" letter-spacing="5">TIDE VISUAL JOURNAL</text><text x="85" y="935" fill="#e5e9d9" font-family="sans-serif" font-size="49" letter-spacing="10">${titles[index]}</text><text x="88" y="978" fill="${p[1]}" font-family="monospace" font-size="12" letter-spacing="5">${sub[index]}</text><text x="88" y="1025" fill="${p[2]}" font-family="monospace" font-size="12">0${index+1} / 03</text></svg>`;let url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));try{let img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let canvas=document.createElement('canvas');canvas.width=800;canvas.height=1100;canvas.getContext('2d').drawImage(img,0,0);return await new Promise(resolve=>canvas.toBlob(resolve,'image/png'))}finally{URL.revokeObjectURL(url)}}
async function seedFiles(){if(await db.get('kv','seed'))return;const now=Date.now(),day=86400000,home=fs.home,docs=(config.backend==='idb'?'/idb':'')+'/文档';let welcome=`<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>欢迎来到潮间</title>\n<style>\n*{box-sizing:border-box}body{margin:0;background:#183c44;color:#e1ece4;font-family:system-ui,sans-serif;min-height:100vh;padding:clamp(28px,6vw,75px);background-image:radial-gradient(ellipse at 100% 0,#729b7544,transparent 70%)}small{font-size:10px;letter-spacing:4px;color:#aacdbd}h1{font-size:clamp(34px,6vw,65px);font-weight:400;line-height:1.4;margin:32px 0 22px}p{font-size:14px;line-height:2;color:#a8c4bd;max-width:530px}.line{width:45px;height:2px;background:#e6bd84;margin:32px 0}button{margin-top:25px;background:#e6bd84;color:#25433a;border:0;border-radius:6px;padding:14px 24px;font-size:13px;cursor:pointer;transition:transform .2s}button:hover{transform:translateY(-3px)}footer{margin-top:60px;font-size:10px;color:#769f96;letter-spacing:2px}.number{font-size:80px;color:#e6bd84;font-weight:300;margin-top:25px;display:none}\n</style>\n</head>\n<body>\n<small>WELCOME TO YOUR LITTLE SPACE</small>\n<h1>欢迎回到，<br>自己的世界。</h1>\n<div class="line"></div>\n<p>这里是潮间。一个安静、完整、只属于你的浏览器桌面。</p>\n<p>放下一个文件，写下一段代码，或者翻开一本漫画。<br>你创造的一切，都会留在这台设备上。</p>\n<button id="hello">给今天，留一个小小的回应</button>\n<div class="number" id="count"></div>\n<footer>TIDE PERSONAL OS · 本地优先，始终如此。</footer>\n<script>\nlet count=0;document.getElementById('hello').onclick=function(){count++;document.getElementById('count').style.display='block';document.getElementById('count').textContent=String(count).padStart(2,'0');this.textContent=count===1?'很高兴，与你相遇。':'再留下一个小小的回应';document.body.style.background=count%2?'#31594f':'#183c44'};\n<\/script>\n</body>\n</html>`;let guide=`# 欢迎来到潮间\n\n不必时刻在线，只需回到自己的世界。\n\n## 从这里开始\n\n- 单击桌面上的图标，打开文件或应用。\n- 拖动图标，自由布置自己的桌面。\n- 在桌面或文件列表的空白处拖动，即可框选。\n- 右键文件，查看打开方式、导出、重命名与属性。\n- 将电脑中的文件或整个文件夹拖进来，即可导入。\n\n## 你的文件，真的存在\n\n默认使用 OPFS 原生私有文件系统，另有独立 IndexedDB 空间。\n两者同时显示在资源管理器中。新文件的默认位置可以在设置里更改。\n\n移动、重命名、复制与 ZIP 解压会保留修改日期。\n文件夹大小从真实子文件递归计算，不是占位数字。\n\n> 清理浏览器站点数据会删除虚拟文件。请定期在设置中导出完整备份。\n\n## 一些顺手的快捷键\n\n- Ctrl Space：应用启动器\n- Ctrl S：保存当前作品\n- Ctrl A：全选文件\n- Ctrl C / Ctrl V：复制与粘贴\n- F2：重命名\n- Delete：移至回收站\n- Esc：关闭菜单或退出沉浸阅读\n\n## 不止是文件\n\n代码编辑器支持实时预览、格式化、查找替换和多种语言。\n图片可以连续阅读，CSV 可以变成表格，画作可以保存。\n你还可以挂载真实本地文件夹，或载入自己的 x86 启动镜像。\n\n## 触屏也一样顺手\n\n底部应用坞可以横向滑动。拖动文件名可以移动文件。\n空白处直接框选，无需长按；「框选」按钮可切换触摸多选。\n触摸设备不能将文件直接拖出浏览器，请使用「导出 / 下载」。\n\n---\n\n留一片，自留地。\n`;let csv='日期,观测地点,潮高(m),水温(°C),海风,心情\r\n2026-05-12,东岸灯塔,1.82,19.4,东南 3 级,平静\r\n2026-05-13,浅水湾,1.36,20.1,南风 2 级,轻盈\r\n2026-05-14,旧码头,2.14,19.8,东风 3 级,专注\r\n2026-05-15,礁石小径,1.75,20.6,东南 2 级,自在\r\n2026-05-16,北岬海滩,2.32,20.3,东风 4 级,开阔\r\n2026-05-17,归航港湾,1.58,21.0,南风 2 级,满足';let files=[['欢迎.html',welcome,now-7200000],['阅读指南.md',guide,now-day],['海岸观测.csv',csv,now-day*2],['静海.svg',wallpaperSVG('stillwater'),now-day*3],['灵感清单.txt','一些想做的事\n\n[ ] 整理喜欢的照片\n[ ] 写一个只属于自己的网页\n[ ] 给未来的自己留一封信\n[x] 拥有一片安静的数字空间\n\n不着急，一件一件来。',now-day*4]];await concurrent(files,3,async([name,content,mtime])=>fs.writeFile(join(home,name),content,{mtime,ctime:mtime}));let visual=join(home,'视觉日记');await fs.mkdir(visual,{mtime:now-day*2});await concurrent([0,1,2],3,async i=>{let blob=await posterBlob(i);await fs.writeFile(join(visual,`${i+1}-${['离岸','漂流','归岸'][i]}.png`),blob,{mtime:now-day*(5-i),ctime:now-day*(5-i)})});let snippets=join(docs,'创作片段');await fs.mkdir(snippets);await fs.writeFile(join(snippets,'海岸配色.css'),'/* 潮间 · 海岸配色 */\n:root {\n  --sea: #183c44;\n  --foam: #78c8bd;\n  --sun: #efb46b;\n  --paper: #e1ece4;\n}\n\nbody {\n  background: var(--sea);\n  color: var(--paper);\n  font-family: sans-serif;\n}\n\nbutton {\n  background: var(--sun);\n  border: 0;\n  padding: 12px 24px;\n  border-radius: 6px;\n}',{mtime:now-day*3});await fs.writeFile(join(snippets,'呼吸.js'),`// 一段可以直接运行的小实验\nconst messages = ['吸气，留一点空白。', '呼气，放下一些忙碌。'];\nlet i = 0;\nconsole.log(messages[i]);\nsetInterval(() => {\n  i = (i + 1) % messages.length;\n  console.log(messages[i]);\n}, 2400);`,{mtime:now-day*3});await fs.writeFile(join(snippets,'关于这片海.json'),JSON.stringify({名称:'潮间',版本:'1.0',配色:['深海蓝','海沫绿','日光金'],本地优先:true,值得记住:'你的文件，只属于你。'},null,2),{mtime:now-day*3});await db.put('kv',{version:1,date:now},'seed');config.initialized=true;saveConfig()}
async function boot(){applyConfig();updateClock();setInterval(updateClock,1000);try{await fs.init();if(!fs.opfsAvailable)$('#top-backend').textContent=db.db?'IndexedDB':'临时模式';applyConfig();await seedFiles();await renderDesktop();updateStorageWidget();if(innerWidth>760)wm.open('files',{path:fs.home});for(let [p,m] of fs.mounts){try{m.granted=await m.handle.queryPermission({mode:'readwrite'})==='granted'}catch{}if(!m.granted)toast('本地文件夹「'+basename(p)+'」需要重新授权','info',{label:'恢复连接',run:()=>fs.reconnect(p)},12000)}if(!db.db)$('#desktop-status-text').textContent='TEMPORARY MODE · EXPORT YOUR FILES';document.addEventListener('fs:change',()=>{renderDesktop();updateStorageWidget()});if(!isSecureContext)toast('当前不是安全上下文，浏览器可能限制持久存储。请使用 HTTPS 或 localhost。','error',null,10000)}catch(e){report(e);$('#desktop-status-text').textContent='STORAGE WARNING · CHECK SETTINGS';$('#desktop-icons').innerHTML='';let b=document.createElement('button');b.className='btn';b.style.cssText='position:absolute;left:25px;top:25px;pointer-events:auto';b.textContent='打开存储设置';b.onclick=()=>wm.open('settings',{tab:'storage'});$('#desktop-icons').append(b)}}
/* Short-lived crash-recovery drafts complement, rather than replace, OPFS. */
for(const app of ['note','editor','sheet']){const build=appBuilders[app];appBuilders[app]=async(w,options)=>{let draftKey=options.draftKey||null,draft=null;if(draftKey)draft=await db.get('kv','draft:'+draftKey);else if(options.path){draft=await db.get('kv','draft:'+options.path);if(draft){let s=await fs.stat(options.path).catch(()=>null);if(!s||draft.time<=s.mtime||draft.text===await fs.text(options.path).catch(()=>null)){await db.delete('kv','draft:'+options.path);draft=null}}}if(draft){options={...options,content:draft.text,path:draft.path||options.path};toast('已找回上次未保存的草稿','info')}await build(w,options);if(w.dead)return;let key=draftKey||options.path||'new:'+w.id,timer,pending=false;function text(){if(app==='editor')return $('.CodeMirror',w.body)?.CodeMirror?.getValue()??$('.code-fallback',w.body)?.value??'';if(app==='note')return $('.note-body',w.body)?.value??'';let raw=$('.note-body',w.body);if(raw&&!raw.classList.contains('hidden'))return raw.value;let rows=$$('tr',$('.sheet-table',w.body)).slice(1).map(tr=>$$('input',tr).map(i=>i.value));return serializeDelimited(rows,ext(w.key||'csv')==='tsv'?'\t':',')}async function writeDraft(){if(w.dead)return;let value=text();if(w.key&&key.startsWith('new:')){await db.delete('kv','draft:'+key);key=w.key}await db.put('kv',{draft:true,key,path:w.key||null,app,text:value,time:Date.now()},'draft:'+key);pending=false}function schedule(){pending=true;clearTimeout(timer);timer=setTimeout(()=>writeDraft().catch(()=>{}),160)}w.body.addEventListener('input',schedule);$('.CodeMirror',w.body)?.CodeMirror?.on('change',schedule);const save=w.save;w.save=async()=>{let result=await save?.();clearTimeout(timer);pending=false;await db.delete('kv','draft:'+key).catch(()=>{});if(w.key)key=w.key;return result};w.isDirty=()=>pending||/正在编辑|保存失败/.test($('.note-save-status,.code-save-state,.sheet-status',w.body)?.textContent||'');w.cleanup.push(()=>{clearTimeout(timer);w.body.removeEventListener('input',schedule)});if(draft)await w.save?.()}}
async function recoverDrafts(){if(!db.db)return;let drafts=(await db.all('kv')).filter(v=>v?.draft);let shown=0;for(let d of drafts){try{if(d.path&&await fs.exists(d.path)){let s=await fs.stat(d.path);if(d.time<=s.mtime||d.text===await fs.text(d.path)){await db.delete('kv','draft:'+d.key);continue}}if(shown++<3)toast('发现一份未保存的'+appDefs[d.app].name+'草稿','info',{label:'恢复草稿',run:()=>wm.open(d.app,{draftKey:d.key,new:true})},14000)}catch{}}}
const initialBoot=boot;
boot=async function(){try{await initialBoot()}finally{fs._resolveReady?.()}await recoverDrafts().catch(()=>{})};
boot();
