  async function resetSystem(){const r=await dialog({title:'重置整个虚拟空间',message:'这会永久删除 OPFS、IndexedDB 中的所有虚拟文件、草稿与个性化设置。真实本地文件夹不会被删除。\n\n输入“重置”继续。',placeholder:'重置',confirm:'清除并重新开始',danger:true});if(!r)return;if(r.value!=='重置')throw new Error('输入内容不匹配，未删除任何文件。');savePrefs.cancel();fs.resetting=true;const t=toast('正在清除虚拟空间…','loading',0);try{await Promise.allSettled([...fs.locks.values()]);for(const w of [...windows.values()]){w.controller.abort();for(const dispose of w.cleanup)try{await dispose()}catch{}w.el.remove()}windows.clear();initialized=false;for(const root of ['/opfs','/idb']){const backend=fs.mounts.get(root)?.backend;if(!backend)continue;backend.persist?.cancel();if(backend.metaQueue)await backend.metaQueue.catch(()=>{});if(backend.root){for await(const [name]of backend.root.entries())await backend.root.removeEntry(name,{recursive:true});backend.meta={}}backend.memory?.clear();backend.cache?.clear()}if(DB.available){await DB.clear('nodes');await DB.clear('kv');await DB.clear('mounts')}try{localStorage.removeItem('huixi:preferences');document.cookie='huixi_theme=; SameSite=Strict; path=/; max-age=0'}catch{}location.reload()}catch(e){fs.resetting=false;t.close();throw e}}

  /* 13. No boot overlay: the desktop is interactive while storage connects. */
  let systemReady;
  $('#brand-icon').innerHTML=icon('mark','brand-mark');$('#top-fullscreen').innerHTML=icon('fullscreen');$('#top-notices').innerHTML=icon('bell');$('#brand-button').onclick=toggleLauncher;$('#top-storage').onclick=()=>initialized?openSettings('storage'):systemReady.then(()=>openSettings('storage'));$('#top-fullscreen').onclick=toggleSystemFullscreen;$('#top-notices').onclick=()=>launch('history');$('#clock-button').onclick=()=>{const cal=$('#calendar');if(!cal.hidden){cal.hidden=true;return}hidePopups();calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);renderCalendar();cal.hidden=false};
  clockTick();setInterval(clockTick,1000);renderDock();renderDesktop();$('#desktop-origin').innerHTML=icon('lock')+'<span>正在连接你的私有空间</span>';
  const resizeDesktop=debounce(()=>{layoutDesktop();for(const w of windows.values()){if(w.maximized)setBounds(w,workArea());else if(innerWidth>700){const b=bounds(w);if(b.x>innerWidth-100||b.y>innerHeight-100)setBounds(w,{...b,x:Math.max(15,innerWidth-b.w-25),y:65})}w.el.dispatchEvent(new Event('windowresize'))}},160);window.addEventListener('resize',resizeDesktop);
  const shell=$('#dock-shell');let dockHideTimer;shell.addEventListener('touchstart',e=>{if(prefs.dockAutoHide&&!shell.classList.contains('revealed')){e.preventDefault();shell.classList.add('revealed');clearTimeout(dockHideTimer);dockHideTimer=setTimeout(()=>shell.classList.remove('revealed'),5000)}},{passive:false});
  document.addEventListener('mousedown',event=>{if(event.button!==0)return;const item=event.target.closest('.file-item,.desktop-icon');if(!item)return;const path=item.dataset.path;if(!path)return;const selection=item.closest('#desktop')?[...desktopSelected].filter(p=>desktopItems.get(p)?.path):activeWindow?.getSelection?.()||[];if(selection.includes(path))selection.slice(0,24).forEach(prepareDrag)});
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files')&&!e.target.closest('#desktop,.file-viewport'))e.preventDefault()});document.addEventListener('drop',e=>{if(e.dataTransfer?.types.includes('Files')&&!e.target.closest('#desktop,.file-viewport')){e.preventDefault();toast('请将文件放到桌面或文件管理器中。','info')}});
  window.addEventListener('error',e=>{if(e.message&&initialized)console.error('HUIXI:',e.message)});window.addEventListener('unhandledrejection',e=>{if(e.reason?.name==='AbortError'){e.preventDefault();return}console.error('Unhandled operation',e.reason);if(initialized){e.preventDefault();report(e.reason)}});
  systemReady=(async()=>{
    try{
      await DB.open().catch(()=>{});let stored;
      try{stored=(await DB.get('kv','preferences'))?.value;recent=(await DB.get('kv','recent'))?.value||[];activity=(await DB.get('kv','activity'))?.value||[]}catch{}
      let hasLocal=false;try{hasLocal=!!localStorage.getItem('huixi:preferences')}catch{}
      if(stored&&!hasLocal)prefs={...DEFAULT_PREFS,...stored};
      if(!stored&&!hasLocal)try{const match=document.cookie.match(/(?:^|; )huixi_theme=(dark|light)/);if(match)prefs.theme=match[1]}catch{}
      await fs.init();
      if(!stored&&!hasLocal){let backup=null,modified=-1;for(const root of ['/opfs','/idb']){if(!fs.mounts.has(root))continue;try{const p=join(root,'系统/偏好设置.json'),s=await fs.stat(p);if(s.lastModified>modified){backup=JSON.parse(await fs.readFile(p,'utf8'));modified=s.lastModified}}catch{}}if(backup)prefs={...DEFAULT_PREFS,...backup}}
      prefs.columnWidths={...DEFAULT_PREFS.columnWidths,...prefs.columnWidths};prefs.columnOrder=Array.isArray(prefs.columnOrder)&&prefs.columnOrder.length===4&&new Set(prefs.columnOrder).size===4&&prefs.columnOrder.every(k=>['name','modified','type','size'].includes(k))?prefs.columnOrder:[...DEFAULT_PREFS.columnOrder];
      prefs.positions=prefs.positions||{};prefs.desktopApps=(Array.isArray(prefs.desktopApps)?prefs.desktopApps:DEFAULT_PREFS.desktopApps).filter(a=>APPS[a]);prefs.dockApps=(Array.isArray(prefs.dockApps)?prefs.dockApps:DEFAULT_PREFS.dockApps).filter(a=>APPS[a]);
      if(!fs.mounts.has('/'+prefs.defaultBackend))prefs.defaultBackend=fs.mounts.has('/opfs')?'opfs':'idb';if(!/^#[a-f0-9]{6}$/i.test(prefs.accent))prefs.accent=DEFAULT_PREFS.accent;
      await prepareRoots();await seedWorkspace();initialized=true;applyPrefs();
      $('#wallpaper').style.filter=`brightness(${(prefs.wallBrightness||100)/100})`;$('.desktop-clock').hidden=prefs.clockWidget===false;$('.wall-grain').hidden=prefs.grain===false;$('#dock-shell').classList.toggle('auto-hide',!!prefs.dockAutoHide);
      await restoreWallpaper();await renderDesktop();renderDock();clockTick();updateStorageSignal();
      fs.onChange(debounce(paths=>{if(!fs.resetting&&paths.some(p=>parent(p)===desktopPath()||p===desktopPath()))renderDesktop()},160));
      if(fs.pendingMounts.length)toast(fs.pendingMounts.length+' 个本地文件夹需要重新授权','info',9000,{label:'连接文件夹',run:()=>openSettings('storage')});
      const params=new URLSearchParams(location.search);if(params.has('app')&&APPS[params.get('app')])launch(params.get('app'),params.get('path')||undefined);else openExplorer(desktopPath());savePrefs();
      if(window.requestIdleCallback)window.requestIdleCallback(()=>runDiagnostics().catch(console.error));else setTimeout(()=>runDiagnostics().catch(console.error),1200);return fs;
    }catch(error){report(error);$('#desktop-origin').innerHTML=icon('warning')+'<span>存储连接失败 · 请检查浏览器存储权限</span>';throw error}
  })();
  function updateStorageSignal(){const mount=fs.mounts.get(home()),persistent=mount?.persistent;$('#top-storage-label').textContent=persistent?mount.label+' 已连接':'临时会话';$('#desktop-origin').innerHTML=icon(persistent?'lock':'warning')+'<span>'+esc(persistent?'文件仅保存在此设备 · '+mount.label:'临时模式 · 请及时导出文件')+'</span>'}
  document.addEventListener('preferenceschange',event=>{if(event.detail==='defaultBackend')updateStorageSignal()});
  window.addEventListener('beforeunload',event=>{if(!fs.resetting&&[...windows.values()].some(w=>w.isDirty?.())){event.preventDefault();event.returnValue=''}});
  window.HUIXI={fs,apps:APPS,launch,settings:()=>openSettings(),diagnostics:runDiagnostics,get preferences(){return structuredClone(prefs)}};
  </script>
