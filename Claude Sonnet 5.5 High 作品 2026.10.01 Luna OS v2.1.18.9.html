<style>
:root{--h:219;--s:80%;--tbh:40px;--cw:88px;--ch:98px;

--tfont:"Trebuchet MS","Fira Sans","Noto Sans SC",sans-serif;
--mono:"Fira Code","Cascadia Mono",Consolas,"Noto Sans SC",monospace;
--ease:cubic-bezier(.2,.9,.3,1.08)}
[data-scheme=blue]{--h:219;--s:80%}
[data-scheme=olive]{--h:84;--s:38%}
[data-scheme=silver]{--h:228;--s:14%}
[data-theme=dark]{--bg:#1b2130;--bg2:#232b3d;--bg3:#2d374d;--fg:#e7ecf6;--fg2:#98a5c0;--bd:#3b4763;--menu:#232b3f;--hl:hsl(var(--h) 75% 58%);--hl2:hsl(var(--h) 55% 32%);--selbg:hsl(var(--h) 60% 36% / .65);--input:#151a26;
--tl1:hsl(var(--h) var(--s) 44%);--tl2:hsl(var(--h) var(--s) 31%);--tl3:hsl(var(--h) var(--s) 21%);--frame:hsl(var(--h) var(--s) 26%);
--ia1:#4a526a;--ia2:#353c52;--ia3:#272d40;--iaf:#323a50;
--tb1:hsl(var(--h) calc(var(--s) - 8%) 27%);--tb2:hsl(var(--h) var(--s) 19%);--tb3:hsl(var(--h) var(--s) 13%);--sh:rgba(0,0,0,.55);color-scheme:dark}
[data-theme=light]{--bg:#ffffff;--bg2:#f2f0e4;--bg3:#e3dfcb;--fg:#141b2b;--fg2:#5d6579;--bd:#b7b199;--menu:#fbfaf3;--hl:hsl(var(--h) 85% 45%);--hl2:hsl(var(--h) 80% 90%);--selbg:hsl(var(--h) 80% 55% / .38);--input:#fff;
--tl1:hsl(var(--h) calc(var(--s) + 10%) 58%);--tl2:hsl(var(--h) calc(var(--s) + 10%) 46%);--tl3:hsl(var(--h) calc(var(--s) + 10%) 38%);--frame:hsl(var(--h) calc(var(--s) + 10%) 42%);
--ia1:#9ca9c8;--ia2:#8795b8;--ia3:#7a89ad;--iaf:#8795b8;
--tb1:hsl(var(--h) calc(var(--s) + 6%) 50%);--tb2:hsl(var(--h) calc(var(--s) + 10%) 44%);--tb3:hsl(var(--h) calc(var(--s) + 10%) 36%);--sh:rgba(10,20,50,.4);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--hl2) transparent}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--hl);background-clip:content-box;border:3px solid transparent}::-webkit-scrollbar-corner{background:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1020;font:13px/1.35 var(--font);color:var(--fg);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{cursor:pointer}
.hide{display:none!important}
.ic{display:inline-block;vertical-align:middle;flex:none;pointer-events:none}
.ic.g{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:4px;border:1px solid var(--bd);background:linear-gradient(var(--bg3),var(--bg2));color:var(--fg);white-space:nowrap;transition:filter .12s,transform .08s}
.btn:hover{filter:brightness(1.15);border-color:var(--hl)}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(hsl(var(--h) 75% 55%),hsl(var(--h) 75% 40%));border-color:hsl(var(--h) 70% 30%);color:#fff;text-shadow:0 1px 1px #0006}
.btn.danger{background:linear-gradient(#e8604a,#b72d1c);border-color:#7d1b10;color:#fff}
.btn.on{background:linear-gradient(var(--hl2),var(--bg3));border-color:var(--hl)}
.btn:disabled{opacity:.45;pointer-events:none}
.inp{background:var(--input);border:1px solid var(--bd);border-radius:3px;padding:4px 7px;color:var(--fg);outline:none;min-width:0}
.inp:focus{border-color:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 30%,transparent)}
select.inp{padding:3px 5px}
#desktop{position:fixed;left:0;right:0;top:0;bottom:var(--tbh);overflow:hidden}
#wall{position:absolute;inset:0;background:#123 center/cover no-repeat;transition:opacity .5s}
#wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,transparent 40%,#0006 100%)}
#icons{position:absolute;inset:0;touch-action:none;overflow:hidden}
#winlayer{position:absolute;inset:0;pointer-events:none}
#winlayer>*{pointer-events:auto}
.dicon{position:absolute;width:calc(var(--cw) - 8px);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 4px;border-radius:4px;color:#fff;text-align:center;cursor:pointer;touch-action:none;text-shadow:0 1px 2px #000,0 0 4px #000b;transition:left .32s var(--ease),top .32s var(--ease),background .12s,opacity .15s;border:1px solid transparent;word-break:break-all}
.dicon svg.f{filter:drop-shadow(0 2px 3px #0007);width:calc(var(--cw) * .48);height:calc(var(--cw) * .48)}
.dicon span{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.dicon:hover{background:hsl(var(--h) 80% 60% / .22);border-color:hsl(var(--h) 80% 70% / .35)}
.dicon:hover span{text-decoration:underline}
.dicon.sel{background:hsl(var(--h) 75% 45% / .6);border-color:hsl(var(--h) 90% 75% / .7)}
.dicon.sel span{-webkit-line-clamp:4}
.dicon.dragging{opacity:.35}.dicon.dropt{background:hsl(var(--h) 80% 60% / .5);outline:2px dashed #fff9}
.dicon.fresh{animation:pop .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.75)}}
.band{position:absolute;pointer-events:none;border:1px solid var(--hl);background:color-mix(in srgb,var(--hl) 28%,transparent);z-index:5;border-radius:2px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--frame);border-radius:9px 9px 2px 2px;padding:0 4px 4px;box-shadow:0 10px 36px var(--sh),0 0 0 1px #0009,inset 0 0 0 1px #fff3;min-width:220px;min-height:120px;contain:layout style}
.win .tb{height:31px;margin:0 -4px;padding:0 4px 0 7px;display:flex;align-items:center;gap:7px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--tl1) 0,var(--tl2) 10%,var(--tl2) 74%,var(--tl3) 100%);box-shadow:inset 0 1px 0 #fff6,inset 0 -1px 0 #0004;touch-action:none;cursor:default}
.win .tb .ti{width:16px;height:16px}
.win .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:italic 800 13px var(--tfont);color:#fff;text-shadow:1px 1px 1px #000a;letter-spacing:.2px}
.win .wb{display:flex;gap:2px}
.wbn{width:23px;height:23px;display:grid;place-items:center;padding:0;border-radius:4px;border:1px solid #fffd;color:#fff;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 90% 72%),hsl(var(--h) 80% 48%) 60%,hsl(var(--h) 80% 38%));box-shadow:inset 0 0 2px #fff8,0 1px 1px #0005;transition:filter .12s}
.wbn:hover{filter:brightness(1.25)}.wbn.x{background:radial-gradient(circle at 30% 25%,#ffa58f,#e0482c 60%,#b83217)}
.wbn svg{width:13px;height:13px;stroke-width:2.2;filter:drop-shadow(0 1px 0 #0006)}
.win.inactive .tb{background:linear-gradient(180deg,var(--ia1) 0,var(--ia2) 10%,var(--ia2) 74%,var(--ia3) 100%)}
.win.inactive{background:var(--iaf)}.win.inactive .tt{opacity:.8}.win.inactive .wbn{filter:saturate(.3) brightness(.9)}
.win .wbody{flex:1;min-height:0;background:var(--bg);position:relative;overflow:hidden;color:var(--fg);display:flex;flex-direction:column;user-select:none}
.win.max{border-radius:0;padding:0}.win.max .tb{border-radius:0;margin:0}
.win.fs .tb,.win.fs .rz{display:none}.win.fs{padding:0}
.rz{position:absolute;z-index:3;touch-action:none}
.rz.n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}.rz.s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.w{left:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}.rz.e{right:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.nw{left:-3px;top:-3px;width:11px;height:11px;cursor:nwse-resize}.rz.ne{right:-3px;top:-3px;width:11px;height:11px;cursor:nesw-resize}
.rz.sw{left:-3px;bottom:-3px;width:11px;height:11px;cursor:nesw-resize}.rz.se{right:-3px;bottom:-3px;width:13px;height:13px;cursor:nwse-resize}
.win.max .rz{display:none}
body.dragwin iframe,body.dragwin video,body.resizing iframe{pointer-events:none}
body.peek-all .win{opacity:.0;pointer-events:none;transition:opacity .22s}
body.peek-one .win:not(.peek-target){opacity:.05;pointer-events:none;transition:opacity .22s}
body.peek-one .win.peek-target{display:flex!important;opacity:1!important;z-index:4900!important;transition:opacity .22s}
body.peek-all #icons,body.peek-all #wall{filter:none}
#snapPrev{position:absolute;border:2px solid hsl(var(--h) 90% 75%);background:hsl(var(--h) 80% 60% / .28);border-radius:8px;z-index:4800;opacity:0;pointer-events:none;transition:all .16s var(--ease);backdrop-filter:blur(4px)}
#snapPrev.on{opacity:1}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);display:flex;align-items:stretch;background:linear-gradient(180deg,var(--tb1) 0,var(--tb2) 8%,var(--tb2) 85%,var(--tb3) 100%);box-shadow:inset 0 1px 0 #fff5,0 -2px 10px #0006;z-index:6000;padding-bottom:env(safe-area-inset-bottom)}
#startBtn{display:flex;align-items:center;gap:6px;padding:0 22px 0 10px;border:0;border-radius:0 16px 16px 0;color:#fff;font:italic 800 19px var(--tfont);text-shadow:1px 1px 2px #0008;background:linear-gradient(180deg,#6fd36f 0,#3fa83f 18%,#2f8e2f 70%,#26772a 100%);box-shadow:inset 0 1px 0 #fff9,inset -2px 0 3px #0004,2px 0 6px #0005;transition:filter .15s,transform .12s;letter-spacing:.5px}
#startBtn:hover{filter:brightness(1.12)}#startBtn:active,#startBtn.open{filter:brightness(.88);transform:translateX(1px)}
#startBtn svg{width:24px;height:24px;filter:drop-shadow(1px 1px 1px #0007)}
#quick{display:flex;align-items:center;gap:2px;padding:0 6px 0 8px;margin-left:4px;border-right:1px solid #0004;box-shadow:1px 0 0 #fff2}
#quick button,.tray-b{background:none;border:0;border-radius:4px;padding:4px;color:#fff;display:grid;place-items:center;transition:background .12s}
#quick button:hover,.tray-b:hover{background:#fff3}
#tasks{flex:1;display:flex;gap:3px;padding:3px 4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.task{flex:0 1 172px;min-width:44px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:4px;border:1px solid #0005;color:#fff;background:linear-gradient(180deg,hsl(var(--h) var(--s) 52% /.9),hsl(var(--h) var(--s) 40% /.9));box-shadow:inset 0 1px 0 #fff6;text-align:left;position:relative;transition:background .15s,transform .1s;animation:taskin .3s var(--ease)}
@keyframes taskin{from{opacity:0;transform:translateY(12px) scaleX(.6)}}
.task{cursor:pointer;user-select:none}.task:hover{filter:brightness(1.15)}
.task.active{background:linear-gradient(180deg,hsl(var(--h) var(--s) 26%),hsl(var(--h) var(--s) 33%));box-shadow:inset 1px 1px 3px #0009}
.task.min{opacity:.72}
.task .tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;text-shadow:0 1px 1px #0007}
.task .tx{display:none;width:16px;height:16px;border-radius:3px;border:0;background:#0004;color:#fff;padding:0;place-items:center}
.task:hover .tx{display:grid}.task .tx:hover{background:#d8402a}.task .tx svg{width:10px;height:10px;stroke-width:2.5}
#tray{display:flex;align-items:center;gap:2px;padding:0 4px 0 10px;background:linear-gradient(180deg,hsl(var(--h) var(--s) 40%),hsl(var(--h) var(--s) 30%));border-left:1px solid #0006;box-shadow:inset 1px 0 0 #fff3,inset 0 1px 0 #fff3;color:#fff}
#clock{padding:0 8px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;background:none;border:0;color:#fff;font-size:12px;line-height:1.15;text-shadow:0 1px 1px #0006;border-radius:3px}
#clock:hover{background:#fff2}
#showDesk{width:14px;border:0;border-left:1px solid #0006;background:linear-gradient(180deg,hsl(var(--h) 70% 55% /.6),hsl(var(--h) 70% 38%/.8));margin-left:2px;padding:0;transition:filter .15s}
#showDesk:hover{filter:brightness(1.4)}
.menu{position:fixed;z-index:9000;min-width:196px;max-width:92vw;background:var(--menu);border:1px solid var(--bd);border-radius:5px;padding:3px;box-shadow:0 8px 28px var(--sh),inset 0 0 0 1px #ffffff12;animation:menuin .13s var(--ease);max-height:calc(100dvh - 12px);overflow:auto}
@keyframes menuin{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.mi{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;position:relative}
.mi:hover,.mi.hov{background:var(--hl);color:#fff}
.mi.dis{opacity:.4;pointer-events:none}.mi .sc{margin-left:auto;padding-left:22px;opacity:.6;font-size:11px}.mi .ar{margin-left:auto;padding-left:14px}
.mi .mic{width:16px;height:16px;display:grid;place-items:center}
.msep{height:1px;background:var(--bd);margin:3px 4px;opacity:.8}
.menu.sub{animation:none}
.ovl{position:fixed;inset:0;z-index:8000;background:#0007;display:grid;place-items:center;animation:fade .15s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
@media (max-width:760px){
:root{--tbh:58px;--cw:84px}
.win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;padding:0}
.win .tb{border-radius:0;margin:0;height:38px}.win .rz{display:none}.wbn{width:30px;height:28px}
.wbn.mx{display:none}
#startBtn{padding:0 14px 0 8px;font-size:0}#startBtn svg{width:30px;height:30px}
.task{flex:0 0 48px;justify-content:center}.task .tl{display:none}.task .tx{display:none!important}
#quick{display:none}#showDesk{width:22px}
}
</style>

/* =====================================================================

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,sz=16,cls='')=>`<svg class="ic ${n[0]==='g'?'g':'f'} ${cls}" width="${sz}" height="${sz}"><use href="#${n}"/></svg>`;

async function seed(){if(localStorage.getItem('webos.seeded'))return;try{const ex=await fs.list('/Documents');if(ex.length){localStorage.setItem('webos.seeded','1');return}}catch{}localStorage.setItem('webos.seeded','1');const W=(p,d)=>fs.writeFile(p,d).catch(()=>{});
 await W('/Desktop/欢迎使用.txt','欢迎使用 Luna OS！\n\n· 这是一个运行在浏览器里的桌面系统，所有文件都保存在浏览器的 OPFS 私有文件系统中，刷新后依然存在。\n· 桌面图标可在网格内自由拖动；单击即可打开；在空白处拖动可框选。\n· 把电脑上的文件直接拖进窗口即可导入；也可以把桌面文件拖出到电脑桌面。\n· 右键桌面或文件夹空白处，可新建、上传、挂载本地文件夹。\n· 打开“设置”可切换深/浅色、Luna 配色、壁纸，并查看存储占用。\n\n祝你使用愉快！\n');
 await W('/Desktop/示例网页.html',ED_TPL);
 await W('/Documents/示例表格.csv','姓名,部门,入职日期,薪资\n张三,研发部,2021-03-15,18000\n李四,市场部,2020-07-01,15000\n王五,设计部,2022-01-10,16500\n赵六,研发部,2019-11-20,21000\n');
 await W('/Documents/说明.md','# Luna OS 使用说明\n\n## 功能一览\n\n- **文件资源管理器**：图标 / 列表 / 分栏三种视图，支持框选与拖拽\n- **HTML 编辑器**：CodeMirror 内核，实时预览\n- **漫画阅读器**：点击任意图片，同目录自动连续阅读\n- **虚拟机**：基于 v86，可加载 ISO / IMG 镜像\n\n> 提示：按 `Ctrl+S` 保存，`Ctrl+Enter` 运行预览。\n');
 await W('/Pictures/示例图形.svg','<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7bd5"/><stop offset="1" stop-color="#00d2ff"/></linearGradient></defs><rect width="400" height="300" fill="url(#a)"/><circle cx="300" cy="80" r="40" fill="#ffe27a"/><path d="M0 300V210C80 150 160 220 240 170S360 160 400 200V300z" fill="#2f8e2f"/></svg>');
 for(const n of [1,2,3,10])await W(`/Pictures/漫画示例/${n}.svg`,svgPage(n))}
(async function boot(){
 applyTheme();
 bus.on('settings',k=>{if(['theme','scheme','iconScale','anim'].includes(k))applyTheme();if(k==='wallpaper'||k==='fit')applyWallpaper();if(k==='clock12'||k==='seconds')Clock.tick();if(k==='cmInput'||k==='cmFont'){}});
 Clock.init();Start.init();
 addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());
 $('#desktop').addEventListener('pointerdown',e=>{if(e.target.closest('#icons'))Menu.close()});
 try{await fs.init()}catch(e){console.error(e);toast('文件系统初始化失败：'+e.message,{icon:'g-info'})}
 if(!localStorage.getItem('webos.settings')){try{const s=await kv.get('settings');if(s){Object.assign(S.d,s);S.save();applyTheme()}}catch{}}
 if(!localStorage.getItem('webos.layout')){try{const l=await kv.get('layout');if(l)localStorage.setItem('webos.layout',JSON.stringify(l))}catch{}}
 await seed();applyWallpaper();Desk.init();await Desk.refresh();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
 try{const ml=await kv.get('mounts');if(ml&&ml.length)toast(`发现 ${ml.length} 个之前挂载的本地文件夹（${ml.map(m=>m.name).join('、')}）。浏览器刷新后会撤销授权，点击此处重新授权并挂载。`,{title:'本地文件夹挂载',icon:'g-mountf',dur:14000,click:async()=>{for(const m of ml){try{if((await m.handle.requestPermission({mode:'readwrite'}))==='granted'&&!fs.mounts.has('/mnt/local/'+m.name))fs.mount(m.name,m.handle)}catch(e){console.warn(e)}}Apps.explorer('/mnt/local')}})}catch{}
 toast(`欢迎回来！存储后端：${fs.mode.split('（')[0]}。右键桌面可新建文件，点击“开始”打开程序。`,{title:'Luna OS',icon:'g-check',dur:3800});
 document.addEventListener('mousedown',e=>{const d=e.target.closest&&e.target.closest('.dicon[draggable=false],.fitem[draggable=false]');if(d)d.draggable=true},true);
 addCSS('@media (max-width:760px){.win.dlg{width:calc(100% - 16px)!important;height:auto!important;border-radius:9px 9px 2px 2px;padding:0 4px 4px}.win.dlg .tb{border-radius:8px 8px 0 0;margin:0 -4px;height:32px}.win.dlg .dl-btns .btn{min-width:64px}}');
 window.fs=fs;window.WM=WM;window.openPath=openPath;
})();
