.ed-sb{display:flex;gap:16px;padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);font:.82rem var(--f-mono);color:var(--tx2);flex:none;white-space:nowrap;overflow:hidden}
.ed-sb .sp{flex:1}.ed-sb b{color:var(--ac-t);font-weight:600}
.np-ta{flex:1;width:100%;border:0;outline:0;resize:none;background:var(--bg);color:var(--tx);padding:12px 16px;font-family:var(--f-mono);line-height:1.65;tab-size:4;min-height:0}
.sh-wrap{flex:1;overflow:auto;position:relative;background:var(--bg)}
.sh-t{border-collapse:separate;border-spacing:0;font-size:.95rem}
.sh-t th{position:sticky;top:0;background:var(--panel);color:var(--tx3);font:500 .8rem var(--f-mono);padding:4px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line2);z-index:2;min-width:90px}
.sh-t th.rn,.sh-t td.rn{position:sticky;left:0;background:var(--panel);color:var(--tx3);font:500 .8rem var(--f-mono);text-align:center;min-width:42px;z-index:1;border-right:1px solid var(--line2)}
.sh-t th.rn{z-index:3}
.sh-t td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 10px;min-width:90px;max-width:420px;outline:none;white-space:pre-wrap;word-break:break-word}
.sh-t td:focus{outline:2px solid var(--accent);outline-offset:-2px;background:rgba(var(--accent-rgb),.1)}
.sh-t tr.hdr td{background:rgba(var(--accent-rgb),.12);font-weight:600}
.ce-main{flex:1;display:flex;min-height:0;position:relative}.ce-main.v{flex-direction:column}
.ce-code{flex:0 0 var(--sp,50%);min-width:80px;min-height:60px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#212121}
.ce-code .CodeMirror{flex:1;height:100%;font:13.5px/1.6 var(--f-mono)}
.ce-code textarea.plain{flex:1;border:0;outline:0;resize:none;background:#212121;color:#eee;padding:10px;font:13.5px/1.6 var(--f-mono);white-space:pre;tab-size:2}
.ce-prev{flex:1;position:relative;min-width:80px;min-height:60px;background:var(--bg);overflow:hidden}
.ce-prev iframe{width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .3s}.ce-prev iframe.on{opacity:1}
.ce-split{flex:none;width:7px;background:var(--panel2);cursor:col-resize;position:relative;touch-action:none;z-index:2}
.ce-main.v .ce-split{width:auto;height:7px;cursor:row-resize}
.ce-split::after{content:'';position:absolute;left:2px;top:50%;width:3px;height:36px;margin-top:-18px;border-radius:3px;background:var(--tx3);opacity:.6}
.ce-main.v .ce-split::after{left:50%;top:2px;margin:0 0 0 -18px;width:36px;height:3px}
.ce-split:hover::after{background:var(--accent);opacity:1}
.ce-main.only-code .ce-prev,.ce-main.only-code .ce-split{display:none}.ce-main.only-code .ce-code{flex:1}
.ce-main.only-prev .ce-code,.ce-main.only-prev .ce-split{display:none}
.ce-find{display:none;gap:5px;flex-wrap:wrap;padding:6px 8px;background:var(--panel2);border-bottom:1px solid var(--line);align-items:center}.ce-find.on{display:flex}
.ce-find .inp{height:26px;width:170px}.ce-find .btn{height:26px;padding:0 8px}
.cm-mk{background:rgba(233,196,106,.28);border-bottom:1px solid #e9c46a}
</style>
<script>
/* =====================================================================
   P6 · 编辑器：记事本 / 表格(CSV·TSV) / 代码编辑器(CodeMirror 5.65 + 实时预览)
   ===================================================================== */
const DRAFT='webos.draft.';
function looksBinary(t){const n=Math.min(t.length,8000);let z=0;for(let i=0;i<n;i++){if(t.charCodeAt(i)===0)z++}return z>0||t.slice(0,n).split('\uFFFD').length>n*0.02+3}
async function loadTextDoc(path){const st=await fs.stat(path);
  if(st.size>3e6&&!await Dialog.confirm(`“${P.base(path)}”大小为 ${fmtSize(st.size)}，以文本方式打开可能较慢。继续吗？`,{ok:'继续打开'}))return null;
  const r=await fs.readText(path);if(looksBinary(r.text)&&!await Dialog.confirm(`“${P.base(path)}”看起来是二进制文件，以纯文本打开可能显示乱码。仍要打开吗？`,{ok:'仍要打开'}))return null;return{...r,st}}
function guardClose(win,isDirty,save){win.beforeClose=async()=>{if(!isDirty())return true;const v=await Dialog.modal({title:'尚未保存',body:`<div>“${esc(win.title.replace(/ •$/,''))}”有未保存的更改，是否保存？</div>`,buttons:[{label:'取消',value:'c'},{label:'不保存',value:'n',danger:true},{label:'保存',value:'s',pri:true}],cancelValue:'c'});
  if(v==='c'||v==null)return false;if(v==='s')return await save();return true}}

/* ---------- 记事本 ---------- */
function NotepadApp(win,args){
  const R=win.body,S={path:null,name:'无标题',dirty:false,enc:'UTF-8',hist:[],hi:-1,font:Settings.get('npFont')||14,wrap:Settings.get('npWrap')!==false,auto:Settings.get('autosave')!==false,dk:null,saved:'',savedAt:0};
  R.innerHTML=`<div class="ed-col"><div class="ed-tb">
    <button class="btn" data-a="new" title="新建">${ic('newfile')}新建</button><button class="btn" data-a="open" title="打开">${ic('folder')}打开</button><button class="btn pri" data-a="save" title="保存 (Ctrl+S)">${ic('save')}保存</button><button class="btn" data-a="saveas" title="另存为">${ic('save')}另存为</button><span class="sep"></span>
    <button class="btn" data-a="undo" title="撤销 (Ctrl+Z)">${ic('undo')}撤销</button><button class="btn" data-a="redo" title="恢复 (Ctrl+Y)">${ic('redo')}恢复</button><span class="sep"></span>
    <button class="btn" data-a="fm" title="减小字号">A−</button><span class="kbd np-fs" style="min-width:34px;text-align:center"></span><button class="btn" data-a="fp" title="增大字号">A+</button><button class="btn" data-a="wrap" title="自动换行">${ic('rows')}自动换行</button>
    <button class="btn" data-a="auto" title="自动保存">${ic('flash')}自动保存</button><span class="sp"></span><button class="btn" data-a="dl" title="下载到电脑">${ic('download')}下载</button></div>
    <textarea class="np-ta" spellcheck="false" placeholder="在这里输入文字……"></textarea><div class="ed-sb"><span class="s-pos"></span><span class="s-len"></span><span class="s-enc"></span><span class="sp"></span><span class="s-save"></span></div></div>`;
  const ta=$('.np-ta',R);
  const title=()=>win.setTitle((S.dirty?'• ':'')+S.name+' - 记事本');
  const status=()=>{const v=ta.value,p=ta.selectionStart,before=v.slice(0,p),ln=before.split('\n').length,col=p-before.lastIndexOf('\n');
    $('.s-pos',R).textContent=`行 ${ln}，列 ${col}`+(ta.selectionEnd>p?`（已选 ${ta.selectionEnd-p}）`:'');$('.s-len',R).textContent=`${v.length} 字符 · ${v.split('\n').length} 行`;$('.s-enc',R).textContent=S.enc;
    $('.np-fs',R).textContent=S.font+'px';$('[data-a=wrap]',R).classList.toggle('on',S.wrap);$('[data-a=auto]',R).classList.toggle('on',S.auto);
    ta.style.fontSize=S.font+'px';ta.style.whiteSpace=S.wrap?'pre-wrap':'pre';ta.style.overflowX=S.wrap?'hidden':'auto'};
  const snap=(force)=>{const cur={v:ta.value,s:ta.selectionStart,e:ta.selectionEnd};const last=S.hist[S.hi];if(last&&last.v===cur.v&&!force)return;S.hist=S.hist.slice(0,S.hi+1);S.hist.push(cur);if(S.hist.length>400)S.hist.shift();S.hi=S.hist.length-1};
  const applyH=i=>{const h2=S.hist[i];if(!h2)return;S.hi=i;ta.value=h2.v;ta.setSelectionRange(h2.s,h2.e);markDirty();status()};
  const undo=()=>{snap();if(S.hi>0)applyH(S.hi-1)},redo=()=>{if(S.hi<S.hist.length-1)applyH(S.hi+1)};
  const snapD=debounce(snap,350);
  const draftW=debounce(()=>{try{if(S.dirty)localStorage.setItem(DRAFT+S.dk,JSON.stringify({text:ta.value,t:Date.now(),path:S.path,name:S.name}));else localStorage.removeItem(DRAFT+S.dk)}catch{}},500);
  const autoW=debounce(async()=>{if(S.auto&&S.path&&S.dirty)await save(true)},1600);
  function markDirty(){const d=ta.value!==S.saved;if(d!==S.dirty){S.dirty=d;title()}draftW();if(S.dirty){$('.s-save',R).textContent=S.auto&&S.path?'编辑中…将自动保存':'有未保存的更改'}}
  async function save(silent){if(!S.path)return saveAs();try{await fs.writeFile(S.path,ta.value);S.saved=ta.value;S.dirty=false;S.enc='UTF-8';title();localStorage.removeItem(DRAFT+S.dk);$('.s-save',R).textContent='已保存 '+fmtClock(new Date(),true);if(!silent)toast('已保存 '+S.name);status();return true}catch(e){toast('保存失败：'+errMsg(e),{type:'err'});return false}}
  async function saveAs(){const p=await Picker.pick({mode:'save',name:S.name==='无标题'?'未命名.txt':S.name,start:S.path?P.dirname(S.path):Sys.dir('docs'),title:'另存为'});if(!p)return false;
    if(await fs.exists(p)&&!await Dialog.confirm(`“${P.base(p)}”已存在，要覆盖吗？`,{ok:'覆盖'}))return false;
    const old=S.dk;S.path=p;S.name=P.base(p);try{localStorage.removeItem(DRAFT+old)}catch{}S.dk=p;return save()}
  async function openPath(p){try{const r=await loadTextDoc(p);if(!r)return false;S.path=p;S.name=P.base(p);ta.value=r.text;S.enc=r.enc;S.saved=r.text;S.dirty=false;S.dk=p;S.hist=[];S.hi=-1;snap(true);
      let dr=null;try{dr=JSON.parse(localStorage.getItem(DRAFT+p)||'null')}catch{}
      if(dr&&dr.text!==r.text&&dr.t>r.st.mtime){ta.value=dr.text;markDirty();toast('已恢复上次未保存的编辑',{actions:[{label:'放弃恢复',fn:()=>{ta.value=r.text;markDirty();snap(true);status()}}]})}
      title();status();return true}catch(e){toast('打开失败：'+errMsg(e),{type:'err'});return false}}
  ta.addEventListener('input',()=>{snapD();markDirty();status();autoW()});
  ta.addEventListener('keyup',status);ta.addEventListener('click',status);ta.addEventListener('select',status);
  ta.addEventListener('keydown',e=>{const c=e.ctrlKey||e.metaKey;
    if(c&&e.key.toLowerCase()==='s'){e.preventDefault();e.shiftKey?saveAs():save()}else if(c&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(c&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){e.preventDefault();redo()}
    else if(e.key==='Tab'){e.preventDefault();snap();ta.setRangeText('\t',ta.selectionStart,ta.selectionEnd,'end');snap(true);markDirty();status()}});
  R.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='new'){if(S.dirty&&!await Dialog.confirm('当前内容尚未保存，新建将放弃更改。继续吗？'))return;Object.assign(S,{path:null,name:'无标题',dirty:false,saved:'',hist:[],hi:-1,dk:'untitled:'+uid('n'),enc:'UTF-8'});ta.value='';snap(true);title();status()}
    else if(a==='open'){const p=await Picker.pick({mode:'open',start:S.path?P.dirname(S.path):Sys.dir('docs'),title:'打开文件'});if(p){if(S.dirty&&!await Dialog.confirm('当前内容尚未保存，打开其他文件将放弃更改。继续吗？'))return;openPath(p)}}
    else if(a==='save')save();else if(a==='saveas')saveAs();else if(a==='undo')undo();else if(a==='redo')redo();
    else if(a==='fm'){S.font=Math.max(9,S.font-1);Settings.set('npFont',S.font);status()}else if(a==='fp'){S.font=Math.min(48,S.font+1);Settings.set('npFont',S.font);status()}
    else if(a==='wrap'){S.wrap=!S.wrap;Settings.set('npWrap',S.wrap);status()}else if(a==='auto'){S.auto=!S.auto;Settings.set('autosave',S.auto);status();toast(S.auto?'自动保存已开启（已有路径的文件将在停止输入后保存）':'自动保存已关闭；未保存内容仍会保存为本地草稿')}
    else if(a==='dl')downloadBlob(new Blob([ta.value],{type:'text/plain;charset=utf-8'}),S.name==='无标题'?'未命名.txt':S.name)});
  guardClose(win,()=>S.dirty,save);win.onCleanup(()=>{snapD.flush();autoW.flush();draftW.flush();if(!S.dirty)try{localStorage.removeItem(DRAFT+S.dk)}catch{}});
  addEventListener('beforeunload',()=>{if(S.dirty)try{localStorage.setItem(DRAFT+S.dk,JSON.stringify({text:ta.value,t:Date.now(),path:S.path,name:S.name}))}catch{}});
  S.dk=args.draft||('untitled:'+uid('n'));title();snap(true);status();
  if(args.path)openPath(args.path).then(()=>ta.focus());
  else if(args.draft){try{const dr=JSON.parse(localStorage.getItem(DRAFT+args.draft)||'null');if(dr){ta.value=dr.text;S.name=dr.name||'无标题';markDirty();snap(true);title();status()}}catch{}}
  else setTimeout(()=>ta.focus(),60);
}
Apps.add({id:'notepad',name:'记事本',desc:'文本与代码，自动保存草稿',color:'#e9c46a',icon:'text',open(a){const w=WM.create({app:'notepad',title:'记事本',icon:'text',color:'#e9c46a',w:760,h:540,minW:360,minH:260});NotepadApp(w,a);return w}});

/* ---------- 表格 (CSV / TSV) ---------- */
function parseCSV(t,d){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function toCSV(rows,d){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return(/["\n\r]/.test(v)||v.includes(d))?'"'+v.replace(/"/g,'""')+'"':v}).join(d)).join('\n')+'\n'}
function SheetApp(win,args){
  const R=win.body,S={path:null,name:'新建表格.csv',delim:',',rows:[],view:'table',dirty:false,hdr:true,cell:[0,0],limit:1500};
  R.innerHTML=`<div class="ed-col"><div class="ed-tb"><button class="btn pri" data-a="save" title="保存 (Ctrl+S)">${ic('save')}保存</button><button class="btn" data-a="saveas">${ic('save')}另存为</button><span class="sep"></span>
    <button class="btn on" data-a="vt">${ic('sheet')}表格视图</button><button class="btn" data-a="vx">${ic('text')}文本视图</button><span class="sep"></span>
    <button class="btn" data-a="ar" title="在选中行下方插入行">${ic('plus')}加行</button><button class="btn" data-a="ac">${ic('plus')}加列</button><button class="btn danger" data-a="dr">${ic('trash')}删行</button><button class="btn danger" data-a="dc">${ic('trash')}删列</button><span class="sep"></span>
    <label>分隔符<select class="inp" data-a="dl"><option value=",">逗号 ,</option><option value="\t">制表符 Tab</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select></label><button class="btn" data-a="hd" title="将第一行作为表头样式">首行表头</button><span class="sp"></span><button class="btn" data-a="dw">${ic('download')}下载</button></div>
    <div class="sh-wrap"></div><textarea class="np-ta" hidden spellcheck="false"></textarea><div class="ed-sb"><span class="s-pos"></span><span class="s-len"></span><span class="sp"></span><span class="s-st"></span></div></div>`;
  const wrap=$('.sh-wrap',R),ta=$('.np-ta',R);
  const title=()=>win.setTitle((S.dirty?'• ':'')+S.name+' - 表格');
  const colN=i=>{let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26)}return s};
  const dirty=()=>{if(!S.dirty){S.dirty=true;title()}};
  function drawTable(){const cols=Math.max(1,...S.rows.map(r=>r.length));const n=Math.min(S.rows.length,S.limit);
    let h2=`<table class="sh-t"><thead><tr><th class="rn"></th>${Array.from({length:cols},(_,i)=>`<th>${colN(i)}</th>`).join('')}</tr></thead><tbody>`;
    for(let r=0;r<n;r++){h2+=`<tr${S.hdr&&r===0?' class="hdr"':''}><td class="rn">${r+1}</td>`;for(let c=0;c<cols;c++)h2+=`<td contenteditable="plaintext-only" data-r="${r}" data-c="${c}">${esc(S.rows[r][c]==null?'':S.rows[r][c])}</td>`;h2+='</tr>'}
    h2+='</tbody></table>';if(S.rows.length>n)h2+=`<div style="padding:12px"><button class="btn" data-a="more">显示更多（还有 ${S.rows.length-n} 行）</button></div>`;wrap.innerHTML=h2;
    $('.s-len',R).textContent=`${S.rows.length} 行 × ${cols} 列`}
  wrap.addEventListener('input',e=>{const td=e.target.closest('td[data-r]');if(!td)return;const r=+td.dataset.r,c=+td.dataset.c;while(S.rows[r].length<=c)S.rows[r].push('');S.rows[r][c]=td.textContent;dirty()});
  wrap.addEventListener('focusin',e=>{const td=e.target.closest('td[data-r]');if(td){S.cell=[+td.dataset.r,+td.dataset.c];$('.s-pos',R).textContent=`${colN(S.cell[1])}${S.cell[0]+1}`}});
  wrap.addEventListener('keydown',e=>{const td=e.target.closest('td[data-r]');if(!td)return;const r=+td.dataset.r,c=+td.dataset.c,go=(rr,cc)=>{const t=wrap.querySelector(`td[data-r="${rr}"][data-c="${cc}"]`);if(t){e.preventDefault();t.focus()}};
    if(e.key==='Enter'&&!e.shiftKey)go(r+1,c);else if(e.key==='ArrowDown'&&!e.altKey)go(r+1,c);else if(e.key==='ArrowUp')go(r-1,c);else if(e.key==='Tab')go(r,c+(e.shiftKey?-1:1))});
  wrap.addEventListener('click',e=>{if(e.target.closest('[data-a=more]')){S.limit+=2000;drawTable()}});
  const text=()=>S.view==='text'?ta.value:toCSV(S.rows,S.delim);
  function setView(v){if(v===S.view)return;if(v==='text'){ta.value=toCSV(S.rows,S.delim);ta.hidden=false;wrap.hidden=true}else{S.rows=parseCSV(ta.value,S.delim);if(!S.rows.length)S.rows=[['']];ta.hidden=true;wrap.hidden=false;drawTable()}S.view=v;$('[data-a=vt]',R).classList.toggle('on',v==='table');$('[data-a=vx]',R).classList.toggle('on',v==='text')}
  ta.addEventListener('input',()=>{dirty();$('.s-len',R).textContent=`${ta.value.length} 字符`});
  ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});wrap.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
  async function save(){if(!S.path)return saveAs();try{await fs.writeFile(S.path,text());S.dirty=false;title();$('.s-st',R).textContent='已保存 '+fmtClock(new Date(),true);toast('已保存 '+S.name);return true}catch(e){toast('保存失败：'+errMsg(e),{type:'err'});return false}}
  async function saveAs(){const p=await Picker.pick({mode:'save',name:S.name,start:S.path?P.dirname(S.path):Sys.dir('docs'),title:'另存为'});if(!p)return false;if(await fs.exists(p)&&!await Dialog.confirm('文件已存在，要覆盖吗？',{ok:'覆盖'}))return false;S.path=p;S.name=P.base(p);return save()}
  R.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,[r,c]=S.cell;
    if(a==='save')save();else if(a==='saveas')saveAs();else if(a==='vt')setView('table');else if(a==='vx')setView('text');
    else if(a==='ar'&&S.view==='table'){S.rows.splice(r+1,0,new Array(Math.max(1,...S.rows.map(x=>x.length))).fill(''));dirty();drawTable()}
    else if(a==='ac'&&S.view==='table'){S.rows.forEach(x=>{while(x.length<=c)x.push('');x.splice(c+1,0,'')});dirty();drawTable()}
    else if(a==='dr'&&S.view==='table'&&S.rows.length>1){S.rows.splice(r,1);dirty();drawTable()}else if(a==='dc'&&S.view==='table'){S.rows.forEach(x=>x.splice(c,1));if(S.rows.every(x=>!x.length))S.rows=[['']];dirty();drawTable()}
    else if(a==='hd'){S.hdr=!S.hdr;b.classList.toggle('on',S.hdr);if(S.view==='table')drawTable()}
    else if(a==='dw')downloadBlob(new Blob([text()],{type:'text/csv;charset=utf-8'}),S.name)});
  $('select[data-a=dl]',R).onchange=e=>{const nd=e.target.value;const raw=text();const rows=S.view==='text'?parseCSV(raw,S.delim):S.rows;S.delim=nd;S.rows=rows;if(S.view==='text')ta.value=toCSV(rows,nd);else drawTable();dirty()};
  guardClose(win,()=>S.dirty,save);

<script>

function calcEval(expr,deg){
  const src=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/\s+/g,'');let i=0;
  const rad=x=>deg?x*Math.PI/180:x,unrad=x=>deg?x*180/Math.PI:x;
  const F={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>unrad(Math.asin(x)),acos:x=>unrad(Math.acos(x)),atan:x=>unrad(Math.atan(x)),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp,cbrt:Math.cbrt};
  const fact=n=>{if(n<0||n>170||Math.floor(n)!==n)return NaN;let r=1;for(let k=2;k<=n;k++)r*=k;return r};
  function expr1(){let v=term();while(src[i]==='+'||src[i]==='-'){const o=src[i++],r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=pow();while(src[i]==='*'||src[i]==='/'){const o=src[i++],r=pow();v=o==='*'?v*r:v/r}return v}
  function pow(){const b=unary();if(src[i]==='^'){i++;return Math.pow(b,pow())}return b}
  function unary(){if(src[i]==='-'){i++;return -unary()}if(src[i]==='+'){i++;return unary()}return post()}
  function post(){let v=prim();while(src[i]==='!'||src[i]==='%'){v=src[i++]==='!'?fact(v):v/100}return v}
  function prim(){const c=src[i];if(c==='('){i++;const v=expr1();if(src[i]!==')')throw new Error('括号不匹配');i++;return v}
    if(/[0-9.]/.test(c)){let j=i;while(/[0-9.]/.test(src[j]||''))j++;if(/e[+-]?\d/i.test(src.slice(j,j+3))){j++;if(/[+-]/.test(src[j]))j++;while(/\d/.test(src[j]||''))j++}const n=parseFloat(src.slice(i,j));i=j;return n}

    throw new Error('表达式错误')}
  const v=expr1();if(i<src.length)throw new Error('表达式错误');return v}
Apps.add({id:'calc',name:'计算器',desc:'标准 / 科学计算，历史记录',color:'#ff6b9a',icon:'calc',open(){

  R.innerHTML=`<div class="ca"><div class="ca-m"><div class="ed-tb" style="padding:4px 8px"><button class="btn" data-a="sci">${ic('flash')}科学</button><button class="btn" data-a="his">${ic('clock')}历史</button><span class="sp"></span><span class="kbd cd"></span></div><div class="ca-d"><div class="ca-e"></div><div class="ca-r">0</div></div><div class="ca-k">${keys.map(k=>`<button class="k ${k[1]||''}" data-k="${esc(k[2]||k[0])}">${k[0]}</button>`).join('')}</div></div><div class="ca-s">${sci.map(k=>`<button class="k fn" data-k="${esc(k)}">${k.replace('(','')}</button>`).join('')}</div><div class="ca-h"></div></div>`;

Apps.add({id:'terminal',name:'终端',desc:'命令行访问虚拟文件系统',color:'#5df2c0',icon:'terminal',open(){
  const w=WM.create({app:'terminal',title:'终端',icon:'terminal',color:'#5df2c0',w:760,h:480,minW:320,minH:200}),R=w.body;let cwd=Sys.dir('desktop'),hist=[],hi=0;
  R.innerHTML=`<div class="tm"><div class="out"></div><div class="in"><span class="pr"></span><input spellcheck="false" autocapitalize="off" autocomplete="off"></div></div>`;

    help(){echo('可用命令：help ls cd pwd cat echo mkdir touch rm cp mv tree du stat open clear date whoami df neofetch history\n支持 > 与 >> 重定向（echo 内容 > 文件），Tab 补全，↑↓ 翻阅历史。')},

    async ls(a){const long=a.includes('-l'),p=abs(a.find(x=>!x.startsWith('-'))||'.');for(const e of (await fs.readdir(p)).sort((x,y)=>(x.type===y.type?0:x.type==='dir'?-1:1)||natCmp(x.name,y.name))){if(e.name.startsWith('.')&&!a.includes('-a'))continue;echo(long?`${e.type==='dir'?'d':'-'}  ${fmtSize(e.size).padStart(9)}  ${fmtDate(e.mtime)}  ${e.name}${e.type==='dir'?'/':''}`:e.name+(e.type==='dir'?'/':''),e.type==='dir'?'dr':'')}},
    async cd(a){const p=abs(a[0]||Sys.dir('desktop'));const s=await fs.stat(p);if(s.type!=='dir')throw new Error('不是文件夹');cwd=p;prompt()},

    async mv(a){const d=abs(a[1]);const to=(await fs.exists(d)&&(await fs.stat(d)).type==='dir')?P.join(d,P.base(a[0])):d;await fs.move(abs(a[0]),to)},
    async tree(a){const walk=async(p,pre)=>{const l=(await fs.readdir(p)).filter(e=>!e.name.startsWith('.')).sort((x,y)=>natCmp(x.name,y.name));for(let i=0;i<l.length;i++){const e=l[i],last=i===l.length-1;echo(pre+(last?'└─ ':'├─ ')+e.name+(e.type==='dir'?'/':''),e.type==='dir'?'dr':'');if(e.type==='dir')await walk(e.path,pre+(last?'   ':'│  '))}};const p=abs(a[0]||'.');echo(p,'dr');await walk(p,'')},

    async open(a){await Open.path(abs(a[0]||'.'))},
    async df(){for(const m of ['/opfs','/idb']){echo(`${m.padEnd(8)} ${fmtSize(await fs.du(m)).padStart(10)}  ${Sys.display(m)}`)}for(const m of fs.mounts.keys())if(m.startsWith('/mnt/local/'))echo(`${m}  ${fmtSize(await fs.du(m))}`)},

  async function run(line){const l=line.trim();if(!l)return;hist.push(l);hi=hist.length;echo(pr.textContent+' '+l,'dm');

  inp.addEventListener('keydown',async e=>{if(e.key==='Enter'){const v=inp.value;inp.value='';await run(v)}else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi]}else if(e.key==='ArrowDown'){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'')}

  async function start(){if(emu)await stop();st.textContent='正在加载 v86 引擎…';note.innerHTML='<span class="spinner"></span><span>加载模拟器引擎（首次使用）…</span>';
    try{await Lazy.script(V86CDN.js,()=>window.V86||window.V86Starter)}catch(e){st.textContent='引擎加载失败';note.innerHTML=`<div style="color:var(--danger)">v86 引擎加载失败，请检查网络后重试</div>`;return}
    const Ctor=window.V86||window.V86Starter,cfg={wasm_path:V86CDN.wasm,memory_size:mem*1024*1024,vga_memory_size:8*1024*1024,screen_container:scr,bios:{url:V86CDN.bios},vga_bios:{url:V86CDN.vga},autostart:true};
    if(img){st.textContent='正在读取镜像…';try{const buf=await fs.readFile(img),ext=P.ext(img);cfg[ext==='iso'?'cdrom':['img','fda','bin','vfd'].includes(ext)?'fda':'hda']={buffer:buf}}catch(e){toast('读取镜像失败：'+errMsg(e),{type:'err'});st.textContent='读取镜像失败';return}}
    try{note.style.display='none';emu=new Ctor(cfg);emu.add_listener('emulator-ready',()=>{st.textContent='运行中'});emu.add_listener('emulator-started',()=>{st.textContent='运行中'});st.textContent='启动中…';w.el.classList.contains('active')&&emu.keyboard_set_status&&emu.keyboard_set_status(true)}catch(e){st.textContent='启动失败';toast('虚拟机启动失败：'+errMsg(e),{type:'err'})}}
  async function stop(){if(!emu)return;try{await emu.destroy()}catch{}emu=null;st.textContent='已关机';scr.querySelector('canvas').style.display='none';note.style.display='';note.innerHTML=`<div>${ic('cpu',44)}</div><b>虚拟机已关机</b>`}
  R.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a;
    if(k==='pick'){const p=await Picker.pick({mode:'open',start:Sys.dir('downloads'),title:'选择磁盘镜像',filter:x=>['disk','archive','other'].includes(kindOf(x.name).cat)||/\.(iso|img|bin|fda|vhd)$/i.test(x.name)});if(p){img=p;setImg()}}
    else if(k==='start')start();else if(k==='stop')stop();else if(k==='restart'){emu?emu.restart():start()}else if(k==='pause'&&emu){emu.is_running()?(emu.stop(),st.textContent='已暂停'):(emu.run(),st.textContent='运行中')}
    else if(k==='lock'){if(emu&&emu.lock_mouse)emu.lock_mouse();else toast('请先启动虚拟机',{type:'warn'})}else if(k==='autolock'){lockClick=!lockClick;b.classList.toggle('on',lockClick)}
    else if(k==='cad'&&emu)emu.keyboard_send_scancodes([0x1D,0x38,0xE0,0x53,0xE0,0xD3,0xB8,0x9D]);else if(k==='fs'){const f=scr.requestFullscreen||scr.webkitRequestFullscreen;if(f)f.call(scr)}});
  scr.addEventListener('click',()=>{if(emu&&lockClick&&emu.lock_mouse)emu.lock_mouse()});
  const onFocus=()=>{if(emu&&emu.keyboard_set_status){emu.keyboard_set_status(WM.active===w);if(emu.mouse_set_status)emu.mouse_set_status(WM.active===w)}};const un=bus.on('win:focus',onFocus);
  w.onCleanup(()=>{un();if(emu){try{emu.destroy()}catch{}emu=null}});
  if(img)setTimeout(()=>{note.querySelector('b').textContent='已选择镜像：'+P.base(img)},0);return w}});
</script>

<script>

const SWATCHES=['#5df2c0','#27c9a0','#5cc8ff','#4aa3ff','#8b6cff','#c05cff','#ff6b9a','#ff7a59','#ff9f43','#e9c46a','#b6f06a'];
function squarify(items,W,H){const tot=items.reduce((s,i)=>s+i.v,0);if(!tot)return[];const k=W*H/tot;items.forEach(i=>i.a=i.v*k);const out=[];let row=[],rest=items.slice(),x=0,y=0,w=W,h=H;
  const worst=(r,s)=>{const sum=r.reduce((a,i)=>a+i.a,0),mx=Math.max(...r.map(i=>i.a)),mn=Math.min(...r.map(i=>i.a));return Math.max(s*s*mx/(sum*sum),sum*sum/(s*s*mn))};
  const lay=()=>{const s=row.reduce((a,i)=>a+i.a,0);if(w>=h){const cw=s/h;let cy=y;row.forEach(i=>{const ch=i.a/cw;out.push({...i,x,y:cy,w:cw,h:ch});cy+=ch});x+=cw;w-=cw}else{const rh=s/w;let cx=x;row.forEach(i=>{const cw=i.a/rh;out.push({...i,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}row=[]};
  while(rest.length){const side=Math.min(w,h),it=rest[0],nr=row.concat([it]);if(!row.length||worst(nr,side)<=worst(row,side)){row=nr;rest.shift()}else lay()}if(row.length)lay();return out}
async function factoryReset(){
  try{const root=await navigator.storage.getDirectory(),names=[];for await(const[n]of root.entries())names.push(n);for(const n of names)await root.removeEntry(n,{recursive:true})}catch(e){console.warn(e)}
  try{if(Meta.db)Meta.db.close();const m=fs.mounts.get('/idb');if(m&&m.s&&m.s.db)m.s.db.close();const o=fs.mounts.get('/opfs');if(o&&o.s&&o.s.db)o.s.db.close()}catch{}
  let dbs=['webos-idb','webos-opfs-fallback','webos-meta'];try{if(indexedDB.databases)dbs=[...new Set([...dbs,...(await indexedDB.databases()).map(d=>d.name)])]}catch{}
  await Promise.all(dbs.map(n=>new Promise(res=>{try{const r=indexedDB.deleteDatabase(n);r.onsuccess=r.onerror=r.onblocked=()=>res()}catch{res()}})));

  const P_={
    personal(){const wl=S.get('wall')||{id:'auto'},cur=wl.path?'custom':(wl.id||'auto');

        <div class="wcard up" data-act="wup">${ic('upload',22)}<div>上传图片<br><small class="kbd">保存到文件系统</small></div></div><div class="wcard up" data-act="wpick">${ic('folder',22)}<div>从文件系统选择…</div></div></div><div id="mywalls" class="walls" style="padding-top:0"></div>
      ${row('填充方式','自定义壁纸的显示方式',seg('wallFit',[['cover','填充'],['contain','适应'],['stretch','拉伸'],['center','居中'],['tile','平铺']]))}</div>`},
    desktop(){return`<h2>桌面与图标</h2><div class="sub">图标布局、打开方式与桌面来源</div>

      ${row('图标对齐到网格','关闭后图标可在桌面任意位置自由摆放',sw('snapGrid'))}${row('整理图标','按名称重新排列桌面图标（带动画）','<button class="btn" data-act="arr">'+ic('sort',16)+'整理图标</button>')}</div>

      ${row('同时显示两个存储后端的“桌面”','把 OPFS 与 IndexedDB 的桌面文件夹合并显示在同一桌面上',sw('desktopBoth'))}</div>`},
    taskbar(){return`<h2>任务栏与时间</h2><div class="sub">任务栏、时钟与窗口预览</div>
      <div class="st-card"><h4>任务栏</h4>${row('任务栏模式','手机模式下始终以底部 Dock 显示',seg('tbMode',[['show','始终显示'],['auto','自动隐藏'],['hidden','隐藏（左下角圆钮）']]))}${row('显示通知区','主题 / 存储 / 全屏按钮',sw('showTray'))}${row('显示时钟','',sw('showClock'))}
      <div style="padding:8px 0 2px;color:var(--tx3)">固定在任务栏的应用</div>${appChecks('pinned',a=>!a.hidden)}</div>
      <div class="st-card"><h4>时间</h4>${row('24 小时制','默认 12 小时制（上午/下午）',sw('clock24'))}${row('显示秒','任务栏时钟显示秒',sw('showSeconds'))}</div>
      <div class="st-card"><h4>隐藏系统应用</h4><div style="padding:8px 0 0;color:var(--tx3)">被勾选的应用将从开始菜单、任务栏与桌面中隐藏</div>${appChecks('hiddenApps')}</div>`},
    window(){return`<h2>窗口与交互</h2><div class="sub">窗口形态、贴靠与动画</div>
      <div class="st-card"><h4>窗口形态</h4>${row('窗口圆角','0 为直角，数值越大越圆润',`<span style="display:flex;gap:10px;align-items:center"><span class="seg"><button data-rad="0" class="${S.get('radius')==0?'on':''}">直角</button><button data-rad="6" class="${S.get('radius')==6?'on':''}">微圆</button><button data-rad="10" class="${S.get('radius')==10?'on':''}">默认</button><button data-rad="18" class="${S.get('radius')==18?'on':''}">圆润</button></span>${rng('radius',0,24,1)}</span>`)}
      ${row('界面透明度','任务栏与菜单的毛玻璃浓度',rng('uiAlpha',.45,1,.01))}${row('界面字号','',seg('fontSize',[[12,'小'],[13,'标准'],[15,'大'],[17,'特大']]))}${row('动画效果','关闭后所有过渡与动画将被禁用（省电 / 无障碍）',sw('anim'))}</div>
      <div class="st-card"><h4>窗口行为</h4>${row('Aero Snap 贴靠','拖动窗口到屏幕边缘：左 / 右半屏、顶部最大化、四角 1/4 屏',sw('snap'))}${row('Aero Peek 预览','悬停任务栏图标预览窗口、悬停右下角显示桌面',sw('peek'))}${row('重置窗口记忆的尺寸','清除各应用上次关闭时的窗口大小','<button class="btn" data-act="winreset">重置</button>')}</div>`},
    storage(){return`<h2>存储与文件系统</h2><div class="sub">OPFS 与 IndexedDB 双后端 · 占用可视化 · 本地文件夹挂载</div><div id="st-q"></div>

  function render(){$$('.st-nav button',R).forEach(b=>b.classList.toggle('on',b.dataset.p===page));scanTok++;main.innerHTML=P_[page]();if(page==='personal')myWalls();if(page==='storage')storagePage()}
  async function myWalls(){const box=$('#mywalls',R);if(!box)return;try{const l=(await fs.readdir(Sys.sysDir()+'/wallpapers')).filter(e=>e.type==='file'&&kindOf(e.name).cat==='image'),cur=(S.get('wall')||{}).path;
      box.innerHTML=l.map(e=>`<div class="wcard ${cur===e.path?'on':''}" data-wallf="${esc(e.path)}" title="${esc(e.name)}"><div class="xthumb" data-th="${esc(e.path)}" data-mt="${e.mtime}"></div><span>${esc(e.name)}</span></div>`).join('');$$('[data-th]',box).forEach(el=>Thumbs.watch(el))}catch{}}
  /* ----- 存储页：配额 / 占用扫描 / 树图 / 挂载 ----- */
  async function storagePage(){const my=scanTok;
    (async()=>{const q=$('#st-q',R);if(!q)return;let est={},per=false;try{est=await navigator.storage.estimate()}catch{}try{per=await navigator.storage.persisted()}catch{}if(my!==scanTok)return;const u=est.usage||0,qt=est.quota||0;

    const mounts=$('#st-mounts',R),mps=[...fs.mounts.keys()].filter(m=>m.startsWith('/mnt/local/'));

  const CATN={image:'图片',audio:'音频',video:'视频',pdf:'PDF',sheet:'表格',archive:'压缩包',disk:'镜像',html:'网页',code:'代码',text:'文本',other:'其他'};
  async function scan(root,my){const box=$('#st-scan',R);if(!box)return;$$('#st-tabs button',R).forEach(b=>b.classList.toggle('on',b.dataset.sv===root));
    box.innerHTML=`<div style="padding:16px 0;color:var(--tx3);display:flex;gap:12px;align-items:center"><span class="spinner" style="width:22px;height:22px"></span><span class="sc-n">正在扫描 ${esc(Sys.display(root))}…</span></div>`;

  async function treemap(path,my,root){const el=$('#tmap',R);if(!el)return;$('#tm-path',R).textContent=Sys.display(path)+(path!==root?'（点击空白处返回上级）':'');el.innerHTML='<div style="position:static;padding:14px;color:var(--tx3);border:0">计算中…</div>';

    for(let i=0;i<l.length;i+=6){const part=await Promise.all(l.slice(i,i+6).map(async e=>({name:e.name,path:e.path,dir:e.type==='dir',v:e.type==='dir'?await fs.du(e.path).catch(()=>0):(e.size||0)})));items.push(...part);if(my!==scanTok)return}

  /* ----- 事件 ----- */
  R.addEventListener('click',async e=>{const t=e.target;let b;

      else if(a==='reset'){const v=await Dialog.prompt({title:'一键重置',label:'这将永久删除虚拟文件系统中的所有文件并重置全部设置。请输入“重置”以确认：',placeholder:'重置',ok:'确认重置'});if(v==='重置'){const pr=Progress.start('正在重置…');await factoryReset()}else if(v!=null)toast('确认文字不匹配，已取消',{type:'warn'})}}});
  R.addEventListener('change',e=>{const t=e.target;

<script>

  if(fs.ready&&((Settings.get('wall')||{}).path))Wall.apply();
  if(fs.ready){
    try{const pend=await LocalFS.restore();if(pend.length)toast('检测到上次挂载的本地文件夹：'+pend.map(p=>p.name).join('、')+'。浏览器要求每次打开页面后重新授权才能访问。',{timeout:0,actions:[...pend.map(p=>({label:'重新挂载 '+p.name,pri:true,keep:false,fn:async()=>{try{await LocalFS.reauth(p);toast('已重新挂载 '+p.name)}catch(e){toast(errMsg(e),{type:'err'})}}})),{label:'忽略'}]})}catch(e){console.warn(e)}
    try{const keys=Object.keys(localStorage).filter(k=>k.startsWith(DRAFT+'untitled:'));const ok=[];for(const k of keys){try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.text&&d.text.trim())ok.push(k.slice(DRAFT.length));else localStorage.removeItem(k)}catch{localStorage.removeItem(k)}}
      if(ok.length)toast(`发现 ${ok.length} 份未保存的文本草稿`,{timeout:0,actions:[{label:'恢复',pri:true,fn:()=>ok.forEach(d=>Apps.launch('notepad',{draft:d}))},{label:'丢弃',fn:()=>ok.forEach(d=>localStorage.removeItem(DRAFT+d))}]})}catch{}}
})();
</script>
</body>
</html>
