<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06131a">
<title>汐图 OS · 潮线制图桌面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Martian+Mono:wght@300..700&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" rel="stylesheet">
<script>
/* 首帧主题：避免闪烁（localStorage -> Cookie 降级） */
(function(){try{var s=null;try{s=JSON.parse(localStorage.getItem('webos.settings.v1')||'null')}catch(e){}
if(!s){var m=document.cookie.match(/(?:^|; )webos_boot=([^;]*)/);if(m)s=JSON.parse(decodeURIComponent(m[1]))}
if(s){var t=s.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):(s.theme||'dark');document.documentElement.dataset.theme=t;
if(s.accent){var h=s.accent.replace('#','');var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);var st=document.documentElement.style;st.setProperty('--accent',s.accent);st.setProperty('--accent-rgb',r+','+g+','+b)}}}catch(e){}})();
</script>
<style>
/* ==========================================================
   汐图 OS · 潮线制图美学 (Tideline Cartography)
   深墨海面 + 等高潮线 + 标尺刻度 + 套准角标 + 切角
   ========================================================== */
:root{
  --f-ui:'Schibsted Grotesk','Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei UI','Microsoft YaHei',sans-serif;
  --f-display:'Bricolage Grotesque','LXGW WenKai Screen','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-mono:'Martian Mono','Sarasa Mono SC','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-brush:'LXGW WenKai Screen','Bricolage Grotesque','Noto Serif SC',serif;
  --accent:#5df2c0; --accent-rgb:93,242,192; --on-accent:#032019;
  --r:10px; --tb-h:52px; --tb-space:52px; --isz:48px; --cw:96px; --ch:104px;
  --coral:#ff7a59; --gold:#e9c46a; --sky:#5cc8ff; --lime:#b6f06a; --danger:#ff5d6c; --ok:#57e39a;
  --ease:cubic-bezier(.2,.9,.25,1.15); --ease2:cubic-bezier(.22,.8,.28,1);
}
html[data-theme=dark]{
  --bg:#06131a; --bg2:#0a1d26; --panel:#0d232d; --panel2:#133240; --raise:#1a4252;
  --line:rgba(140,230,210,.13); --line2:rgba(140,230,210,.26); --tx:#dcf2ec; --tx2:#92b6ae; --tx3:#5f857e;
  --shadow:0 22px 60px rgba(0,8,12,.6),0 2px 0 rgba(140,230,210,.05) inset; --glass-rgb:7,26,34; --glass-a:.82;
  --tick:rgba(140,230,210,.3); --ac-t:var(--accent); --desk-tx:#eafaf5; --desk-sh:0 1px 3px rgba(0,10,14,.9),0 0 8px rgba(0,10,14,.7);
  --page:#16313c; --scrim:rgba(2,10,14,.58); color-scheme:dark;
}
html[data-theme=light]{
  --bg:#e6e1cf; --bg2:#f0ecdf; --panel:#f8f5ea; --panel2:#ece8d8; --raise:#e0dbc7;
  --line:rgba(20,48,52,.14); --line2:rgba(20,48,52,.3); --tx:#10272b; --tx2:#476462; --tx3:#7c9490;
  --shadow:0 18px 46px rgba(48,56,40,.28),0 1px 0 #fff inset; --glass-rgb:247,244,232; --glass-a:.84;
  --tick:rgba(16,39,43,.38); --ac-t:color-mix(in oklab,var(--accent) 55%,#06201f); --desk-tx:#10272b; --desk-sh:0 1px 0 rgba(255,255,255,.6);
  --page:#fffdf5; --scrim:rgba(40,50,40,.35); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px}
html,body{margin:0;height:100%;overflow:hidden;background:#06131a;color:var(--tx);font:1rem/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac-t)}
svg.ic{width:1.35em;height:1.35em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle;overflow:visible}
svg.ic .a{fill:var(--accent);fill-opacity:.32;stroke:none}
svg.ic .f{fill:currentColor;stroke:none}
::selection{background:rgba(var(--accent-rgb),.35)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono)}
.noanim *,.noanim *::before,.noanim *::after{animation-duration:.001s!important;transition-duration:.001s!important}

/* ---------- 画布层 ---------- */
#os{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#wall,.wall-l{position:absolute;inset:0;background:#06131a center/cover no-repeat}
.wall-l{animation:wallIn .9s var(--ease2) both}
@keyframes wallIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#wall-fx{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(110% 80% at 8% -10%,rgba(var(--accent-rgb),.14),transparent 55%),
  radial-gradient(90% 70% at 105% 110%,rgba(255,122,89,.10),transparent 60%),
  radial-gradient(150% 120% at 50% 50%,transparent 55%,rgba(0,6,10,.35))}
html[data-theme=light] #wall-fx{background:radial-gradient(110% 80% at 8% -10%,rgba(255,255,255,.5),transparent 55%),radial-gradient(150% 120% at 50% 50%,transparent 60%,rgba(70,60,30,.14))}
#desktop{position:absolute;left:0;top:0;right:0;bottom:var(--tb-space);overflow:hidden;touch-action:none}
#icons{position:absolute;inset:0}
#windows{position:absolute;inset:0;pointer-events:none}
#windows>*{pointer-events:auto}

/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:calc(var(--r)*.7);background:var(--panel2);border:1px solid var(--line);color:var(--tx);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,filter .15s;flex:none;position:relative}
.btn:hover{background:var(--raise);border-color:var(--line2)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:650}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(var(--accent-rgb),.12)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:rgba(255,93,108,.14);border-color:rgba(255,93,108,.4)}
.btn.on{background:rgba(var(--accent-rgb),.2);border-color:rgba(var(--accent-rgb),.55);color:var(--ac-t)}
.btn[disabled],.btn.dis{opacity:.38;pointer-events:none}
.btn.sm{height:26px;padding:0 9px}
.btn.sq{width:30px;padding:0}
.inp{height:30px;padding:0 10px;background:var(--bg2);border:1px solid var(--line);border-radius:calc(var(--r)*.7);outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
select.inp{padding-right:4px;cursor:pointer}
textarea.inp{height:auto;padding:8px 10px}
.sep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line2);flex:none}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:rgba(var(--accent-rgb),.14);color:var(--ac-t);font-size:.9rem}
.spinner{width:34px;height:34px;display:inline-block;position:relative}
.spinner::before,.spinner::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:spin 1s linear infinite}
.spinner::after{inset:6px;border-top-color:var(--coral);border-right-color:transparent;border-left-color:var(--coral);animation-duration:1.5s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mask{position:absolute;inset:0;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:12px;color:var(--tx2);z-index:20;transition:opacity .35s;font-size:.95rem}
.mask.out{opacity:0;pointer-events:none}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px;transition:width .4s var(--ease2)}
.indet{position:relative;overflow:hidden}
.indet::after{content:'';position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:indet 1.1s ease-in-out infinite}
@keyframes indet{from{left:-40%}to{left:105%}}
.tile{--c:var(--accent);width:44px;height:44px;display:grid;place-items:center;flex:none;position:relative;color:#fff;
  background:linear-gradient(150deg,color-mix(in oklab,var(--c) 92%,#fff 8%),color-mix(in oklab,var(--c) 55%,#000));
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tile::after{content:'';position:absolute;left:5px;top:5px;width:6px;height:6px;border-left:1.5px solid rgba(255,255,255,.55);border-top:1.5px solid rgba(255,255,255,.55)}
.tile svg.ic{width:56%;height:56%;stroke-width:1.7;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.tile svg.ic .a{fill:#fff;fill-opacity:.28}
.kbd{font-family:var(--f-mono);font-size:.78rem;color:var(--tx3)}

/* ---------- 窗口 ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);min-width:260px;min-height:140px;animation:winIn .3s var(--ease) backwards;transform-origin:50% 100%;
  transition:opacity .22s,transform .26s var(--ease2),visibility 0s,box-shadow .2s}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.95)}}
.win.tween{transition:left .28s var(--ease2),top .28s var(--ease2),width .28s var(--ease2),height .28s var(--ease2),opacity .22s,transform .26s var(--ease2),border-radius .2s}
.win.closing{opacity:0;transform:scale(.94) translateY(10px);pointer-events:none}
.win.min{opacity:0;transform:translateY(40px) scale(.9);visibility:hidden;pointer-events:none;transition:opacity .2s,transform .26s var(--ease2),visibility 0s .26s}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tb-space))!important;border-radius:0;border-width:0}
.win:not(.active){box-shadow:0 10px 30px rgba(0,8,12,.35)}
.win::after{content:'';position:absolute;inset:-5px;pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(var(--accent),var(--accent)) left top/11px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) left top/1.5px 11px no-repeat,
  linear-gradient(var(--accent),var(--accent)) right top/11px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) right top/1.5px 11px no-repeat,
  linear-gradient(var(--accent),var(--accent)) left bottom/11px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) left bottom/1.5px 11px no-repeat,
  linear-gradient(var(--accent),var(--accent)) right bottom/11px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) right bottom/1.5px 11px no-repeat}
.win.active::after{opacity:.85}
.win.max::after{opacity:0}
.win-title{position:relative;height:38px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--r) var(--r) 0 0;flex:none;touch-action:none;cursor:default}
.win.max .win-title{border-radius:0}
.win-title::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;pointer-events:none;opacity:.8;
  background:linear-gradient(90deg,var(--tick) 1px,transparent 1px) 0 100%/6px 3px repeat-x,linear-gradient(90deg,var(--tick) 1px,transparent 1px) 0 100%/30px 6px repeat-x}
.win.active .win-title::after{background:linear-gradient(90deg,rgba(var(--accent-rgb),.55) 1px,transparent 1px) 0 100%/6px 3px repeat-x,linear-gradient(90deg,rgba(var(--accent-rgb),.9) 1px,transparent 1px) 0 100%/30px 6px repeat-x}
.win-ico{width:20px;height:20px;display:grid;place-items:center;color:var(--ac-t)}
.win-ico svg{width:18px;height:18px}
.win-name{font:600 .95rem/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--tx2)}
.win.active .win-name{color:var(--tx)}
.win-drag{flex:1;align-self:stretch;min-width:20px}
.win-x{display:flex;align-items:center;height:100%}
.wbtn{width:40px;height:100%;display:grid;place-items:center;color:var(--tx2);transition:background .15s,color .15s;position:relative}
.wbtn svg{width:15px;height:15px}
.wbtn:hover{background:rgba(var(--accent-rgb),.16);color:var(--tx)}
.wbtn.cls:hover{background:var(--danger);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:0 0 var(--r) var(--r);background:var(--bg2)}
.win.max .win-body{border-radius:0}
.rz{position:absolute;z-index:5;touch-action:none}
.rz.n,.rz.s{left:8px;right:8px;height:8px;cursor:ns-resize}.rz.e,.rz.w{top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz.n{top:-4px}.rz.s{bottom:-4px}.rz.e{right:-4px}.rz.w{left:-4px}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:16px;height:16px}
.rz.ne{top:-5px;right:-5px;cursor:nesw-resize}.rz.nw{top:-5px;left:-5px;cursor:nwse-resize}.rz.se{bottom:-5px;right:-5px;cursor:nwse-resize}.rz.sw{bottom:-5px;left:-5px;cursor:nesw-resize}
.win.max .rz{display:none}
.win.dragging{transition:none!important;box-shadow:0 30px 80px rgba(0,8,12,.7)}
.win.dragging .win-body{pointer-events:none}
.peeking .win:not(.peek-target){opacity:.07!important;pointer-events:none}
.win.peek-target{visibility:visible!important;opacity:1!important;transform:none!important;z-index:8990!important;outline:2px solid var(--accent)}
.peek-desk .win{opacity:.05!important;pointer-events:none}
#snap-preview{position:absolute;pointer-events:none;border:2px solid var(--accent);background:rgba(var(--accent-rgb),.14);border-radius:var(--r);opacity:0;z-index:8000;transition:all .22s var(--ease2);backdrop-filter:blur(3px)}
#snap-preview.on{opacity:1}
body.resizing,body.resizing *{user-select:none!important}

/* ---------- 桌面图标 ---------- */
.dicon{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;padding:7px 4px;border-radius:calc(var(--r)*.7);cursor:pointer;touch-action:none;
  transition:left .34s var(--ease),top .34s var(--ease),background .15s,opacity .25s,transform .25s var(--ease)}
.dicon:hover{background:rgba(var(--accent-rgb),.11)}
.dicon.sel{background:rgba(var(--accent-rgb),.22)}
.dicon.sel::before{content:'';position:absolute;inset:2px;pointer-events:none;
  background:linear-gradient(var(--accent),var(--accent)) left top/8px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) left top/1.5px 8px no-repeat,
  linear-gradient(var(--accent),var(--accent)) right top/8px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) right top/1.5px 8px no-repeat,
  linear-gradient(var(--accent),var(--accent)) left bottom/8px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) left bottom/1.5px 8px no-repeat,
  linear-gradient(var(--accent),var(--accent)) right bottom/8px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) right bottom/1.5px 8px no-repeat}
.dicon.cut{opacity:.45}
.dicon.new{animation:iconIn .55s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes iconIn{from{opacity:0;transform:translateY(12px) scale(.8)}}
.dicon.drop-hot,.row.drop-hot,.tile.drop-hot,.mrow.drop-hot,.tn.drop-hot>.tl,.crumb.drop-hot,.xtile.drop-hot{background:rgba(var(--accent-rgb),.38)!important;outline:1px dashed var(--accent)}
.dicon.drop-hot{transform:scale(1.07)}
.di-ico{width:var(--isz);height:var(--isz);display:grid;place-items:center;position:relative;flex:none}
.di-ico>svg,.di-ico>img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,8,12,.45))}
.di-ico>img.th{border-radius:4px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4);object-fit:cover}
.di-name{margin-top:5px;font-size:.92rem;text-align:center;line-height:1.25;max-height:2.55em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;color:var(--desk-tx);text-shadow:var(--desk-sh);padding:0 2px}
.marq{position:absolute;pointer-events:none;border:1px solid var(--accent);background:rgba(var(--accent-rgb),.15);z-index:30;border-radius:2px;will-change:transform,width,height;left:0;top:0}
.dragghost{position:fixed;z-index:99999;pointer-events:none;left:0;top:0;padding:6px 12px 6px 8px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:99px;box-shadow:var(--shadow);font-size:.95rem;transform:translate(-50%,-120%)}

/* ---------- 任务栏 ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:stretch;background:rgba(var(--glass-rgb),var(--glass-a));backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line2);z-index:9000;transition:transform .35s var(--ease2)}
#taskbar::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;pointer-events:none;
  background:linear-gradient(90deg,var(--tick) 1px,transparent 1px) 0 0/8px 3px repeat-x,linear-gradient(90deg,var(--tick) 1px,transparent 1px) 0 0/40px 6px repeat-x;opacity:.8}
html.tb-auto #taskbar,html.tb-hidden #taskbar{transform:translateY(calc(100% - 3px))}
html.tb-auto #taskbar:hover,html.tb-auto #taskbar.reveal{transform:none}
html.tb-hidden #taskbar{display:none}
.tb-start{width:60px;display:grid;place-items:center;position:relative;color:var(--ac-t);transition:background .2s}
.tb-start:hover,.tb-start.on{background:rgba(var(--accent-rgb),.14)}
.tb-start svg{width:30px;height:30px;transition:transform .5s var(--ease)}
.tb-start:hover svg{transform:rotate(90deg) scale(1.08)}
.tb-start .ring2{transform-origin:12px 12px;animation:breath 5s ease-in-out infinite}
@keyframes breath{50%{transform:scale(.82)}}
#tb-apps{flex:1;display:flex;align-items:stretch;gap:2px;padding:0 6px;min-width:0;overflow:hidden}
.tb-app{position:relative;min-width:48px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx2);transition:background .2s,color .2s;max-width:180px}
.tb-app:hover{background:rgba(var(--accent-rgb),.12);color:var(--tx)}
.tb-app .tile{width:28px;height:28px;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
.tb-app .tile::after{display:none}
.tb-app .lv{position:absolute;left:10px;right:10px;bottom:5px;height:3px;background:var(--line);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .2s}
.tb-app .lv::after{content:'';position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--tx3);border-radius:3px;transition:width .35s var(--ease2),background .2s}
.tb-app.run .lv{opacity:1}
.tb-app.act .lv::after{width:100%;background:var(--accent)}
.tb-app.act{background:rgba(var(--accent-rgb),.1);color:var(--tx)}
.tb-app .cnt{position:absolute;right:5px;top:6px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:700 .7rem/15px var(--f-mono);text-align:center;padding:0 3px}
#tb-tray{display:flex;align-items:center;gap:2px;padding:0 4px}
.tray-btn{width:36px;height:36px;border-radius:calc(var(--r)*.6);display:grid;place-items:center;color:var(--tx2);transition:background .15s,color .15s}
.tray-btn:hover{background:rgba(var(--accent-rgb),.14);color:var(--tx)}
.tray-clock{padding:0 12px;text-align:right;line-height:1.2;height:100%;transition:background .15s;display:flex;flex-direction:column;justify-content:center;font-family:var(--f-mono)}

<script>
/* =====================================================================
   P2 · 虚拟文件系统 (VFS)
   后端：OPFS(原生句柄) / IndexedDB(节点库) / 本地文件夹(File System Access)
   元数据：IndexedDB(Meta) -> localStorage 降级，保证“修改日期”在移动/复制/重命名后不丢失
   统一入口：fs.*（Promise + 尾部 callback 兼容），挂载路由对上层完全透明
   ===================================================================== */
class FSError extends Error{constructor(code,msg,path){super(msg||code);this.code=code;this.path=path}}
const ERRMSG={ENOENT:'文件或文件夹不存在',EEXIST:'已存在同名项目',ENOTDIR:'路径不是文件夹',EISDIR:'目标是文件夹',EACCES:'没有权限或该位置不可写',ENOTEMPTY:'文件夹不为空',EINVAL:'无效的操作或名称',EXDEV:'需要跨位置操作',EQUOTA:'存储空间不足'};
const mkErr=(c,p,x)=>new FSError(c,(ERRMSG[c]||c)+(p?'：'+p:'')+(x?' ('+x+')':''),p);
function mapErr(e,path){if(e instanceof FSError)return e;const n=e&&e.name;
  if(n==='NotFoundError')return mkErr('ENOENT',path);if(n==='TypeMismatchError')return mkErr('ENOTDIR',path);
  if(n==='NotAllowedError'||n==='SecurityError'||n==='NoModificationAllowedError')return mkErr('EACCES',path,n);
  if(n==='QuotaExceededError')return mkErr('EQUOTA',path);if(n==='InvalidModificationError')return mkErr('ENOTEMPTY',path);
  if(n==='InvalidCharacterError'||n==='TypeError')return mkErr('EINVAL',path,e.message);return new FSError('EIO',(e&&e.message)||String(e),path)}
const errMsg=e=>(e&&e.message)||String(e);
const P={
  norm(p){const o=[];for(const s of String(p||'/').split('/')){if(!s||s==='.')continue;if(s==='..'){o.pop();continue}o.push(s)}return '/'+o.join('/')},
  join(...a){return P.norm(a.join('/'))},
  dirname(p){p=P.norm(p);const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)},
  base(p){p=P.norm(p);return p.slice(p.lastIndexOf('/')+1)},
  ext(p){return extOf(P.base(p))},
  split(p){return P.norm(p).split('/').filter(Boolean)},
  isUnder(p,root){p=P.norm(p);root=P.norm(root);return p===root||p.startsWith(root==='/'?'/':root+'/')},
  stem(n){const i=n.lastIndexOf('.');return i>0?n.slice(0,i):n}};
const badName=n=>!n||n==='.'||n==='..'||/[\\/:*?"<>|\u0000-\u001f]/.test(n)||n.length>200;
const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbTx=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('事务中止'))});
function idbOpen(name,ver,up){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB 不可用'));let r;try{r=indexedDB.open(name,ver)}catch(e){return rej(e)}r.onupgradeneeded=()=>up(r.result,r.transaction);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('数据库被占用'))})}
function compat(obj,names){for(const n of names){const f=obj[n];obj[n]=function(...a){let cb=null;while(a.length&&typeof a[a.length-1]==='function')cb=a.pop();const p=f.apply(this,a);if(cb){p.then(r=>cb(null,r),e=>cb(e));return}return p}}}

/* ---------- 元数据（逻辑修改时间 mtime / 创建时间 ctime） ---------- */
const Meta={map:new Map(),db:null,q:new Map(),t:0,
  async init(){try{this.db=await idbOpen('webos-meta',1,db=>{db.createObjectStore('m');db.createObjectStore('handles')});
      const st=this.db.transaction('m').objectStore('m');const[ks,vs]=await Promise.all([idbReq(st.getAllKeys()),idbReq(st.getAll())]);ks.forEach((k,i)=>this.map.set(k,vs[i]))}
    catch(e){this.db=null;try{const j=JSON.parse(localStorage.getItem('webos.meta')||'{}');for(const k in j)this.map.set(k,j[k])}catch{}}},
  get(k){return this.map.get(k)},
  set(k,v){this.map.set(k,v);this.q.set(k,v);this.soon()},
  del(k){this.map.delete(k);this.q.set(k,null);this.soon()},
  delTree(k){const pre=k+'/';for(const key of [...this.map.keys()])if(key===k||key.startsWith(pre))this.del(key)},
  moveTree(a,b){const pre=a+'/';for(const[key,v]of [...this.map]){if(key===a||key.startsWith(pre)){this.del(key);this.set(b+key.slice(a.length),v)}}},
  soon(){clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),120)},
  async flush(){if(!this.q.size)return;const q=this.q;this.q=new Map();
    if(this.db){try{const tx=this.db.transaction('m','readwrite'),s=tx.objectStore('m');q.forEach((v,k)=>v===null?s.delete(k):s.put(v,k));await idbTx(tx);return}catch(e){}}
    try{localStorage.setItem('webos.meta',JSON.stringify(Object.fromEntries(this.map)))}catch{}}};
addEventListener('pagehide',()=>Meta.flush());document.addEventListener('visibilitychange',()=>{if(document.hidden)Meta.flush()});

/* ---------- 后端 A：目录句柄（OPFS 与 本地文件夹 共用同一实现） ---------- */
class HandleBackend{
  constructor(root,mid){this.root=root;this.mid=mid;this.dc=new Map()}
  k(p){return this.mid+':'+p}
  _inv(p){const pre=p+'/';for(const k of [...this.dc.keys()])if(k===p||k.startsWith(pre))this.dc.delete(k)}
  touch(dp,t){if(dp==='/')return;const k=this.k(dp),o=Meta.get(k),now=t||Date.now();Meta.set(k,{m:now,c:o?o.c:now})}
  async dir(path,create){path=P.norm(path);if(path==='/')return this.root;const c=this.dc.get(path);if(c)return c;let cur=this.root,acc='';
    for(const s of P.split(path)){acc+='/'+s;const cc=this.dc.get(acc);if(cc){cur=cc;continue}
      try{cur=await cur.getDirectoryHandle(s,{create:!!create})}catch(e){throw mapErr(e,path)}this.dc.set(acc,cur)}return cur}
  async handle(path){path=P.norm(path);if(path==='/')return{kind:'directory',h:this.root};const dir=await this.dir(P.dirname(path)),name=P.base(path);
    try{return{kind:'file',h:await dir.getFileHandle(name)}}catch(e){if(e.name!=='NotFoundError'&&e.name!=='TypeMismatchError')throw mapErr(e,path)}
    try{return{kind:'directory',h:await dir.getDirectoryHandle(name)}}catch(e){throw mapErr(e,path)}}
  _fs(path,f){const m=Meta.get(this.k(path)),mt=(m&&m.r===f.lastModified)?m.m:f.lastModified;return{type:'file',name:P.base(path),size:f.size,mtime:mt,ctime:(m&&m.c)||mt}}
  _ds(path){const k=this.k(path);let m=Meta.get(k);if(!m){const t=Date.now();m={m:t,c:t};Meta.set(k,m)}return{type:'dir',name:P.base(path)||'/',size:0,mtime:m.m,ctime:m.c||m.m}}
  async stat(path,isLstat){const{kind,h}=await this.handle(path);path=P.norm(path);return kind==='directory'?this._ds(path):this._fs(path,await h.getFile())}
  async readdir(path,o){path=P.norm(path);const d=await this.dir(path),dirs=[],files=[];
    try{for await(const[n,hh]of d.entries()){if(hh.kind==='directory')dirs.push(n);else files.push([n,hh])}}catch(e){throw mapErr(e,path)}
    const out=dirs.map(n=>this._ds(P.join(path,n)));
    if(o&&o.stat===false){files.forEach(([n])=>out.push({type:'file',name:n}));return out}
    for(let i=0;i<files.length;i+=64){const res=await Promise.all(files.slice(i,i+64).map(async([n,hh])=>{try{return this._fs(P.join(path,n),await hh.getFile())}catch{return null}}));res.forEach(r=>r&&out.push(r))}
    return out}
  async getBlob(path){const{kind,h}=await this.handle(path);if(kind!=='file')throw mkErr('EISDIR',path);try{return await h.getFile()}catch(e){throw mapErr(e,path)}}
  async readFile(path,flag){return(await this.getBlob(path)).arrayBuffer()}
  async writeFile(path,data,o={}){path=P.norm(path);const dir=await this.dir(P.dirname(path)),name=P.base(path);let existed=true;
    try{await dir.getFileHandle(name)}catch(e){existed=false;if(e.name==='TypeMismatchError')throw mkErr('EISDIR',path)}
    let fh,w;try{fh=await dir.getFileHandle(name,{create:true});w=await fh.createWritable()}catch(e){throw mapErr(e,path)}
    try{await w.write(data instanceof Blob||data instanceof ArrayBuffer||ArrayBuffer.isView(data)?data:String(data));await w.close()}catch(e){try{await w.abort()}catch{}throw mapErr(e,path)}
    const f=await fh.getFile(),now=Date.now(),old=Meta.get(this.k(path));
    Meta.set(this.k(path),{m:o.mtime!=null?o.mtime:now,c:o.ctime!=null?o.ctime:(old&&old.c)||now,r:f.lastModified});
    if(!existed)this.touch(P.dirname(path))}
  async mkdir(path,o={}){path=P.norm(path);if(path==='/')return;const segs=P.split(path);let cur=this.root,acc='';
    for(let i=0;i<segs.length;i++){const s=segs[i],last=i===segs.length-1;acc+='/'+s;let next=this.dc.get(acc),created=false;
      if(!next){try{next=await cur.getDirectoryHandle(s)}catch(e){
        if(e.name==='NotFoundError'){if(!last&&!o.recursive)throw mkErr('ENOENT',acc);try{next=await cur.getDirectoryHandle(s,{create:true});created=true}catch(e2){throw mapErr(e2,acc)}}
        else if(e.name==='TypeMismatchError')throw mkErr(last?'EEXIST':'ENOTDIR',acc);else throw mapErr(e,acc)}this.dc.set(acc,next)}
      if(created){const now=Date.now();Meta.set(this.k(acc),{m:(last&&o.mtime!=null)?o.mtime:now,c:now});if(i>0)this.touch(P.dirname(acc))}
      else if(last&&!o.recursive)throw mkErr('EEXIST',acc);
      cur=next}}
  async rm(path,o){path=P.norm(path);if(path==='/')throw mkErr('EACCES',path);const dir=await this.dir(P.dirname(path)),name=P.base(path);
    try{await dir.removeEntry(name,{recursive:true})}catch(e){throw mapErr(e,path)}this._inv(path);Meta.delTree(this.k(path));this.touch(P.dirname(path))}
  async rename(from,to){from=P.norm(from);to=P.norm(to);const src=await this.handle(from);let ex=false;try{await this.handle(to);ex=true}catch{}if(ex)throw mkErr('EEXIST',to);
    const ddir=await this.dir(P.dirname(to));if(typeof src.h.move!=='function')throw mkErr('EXDEV',from);

  async utimes(path,mt){path=P.norm(path);const{kind,h}=await this.handle(path),k=this.k(path),o=Meta.get(k)||{};
    if(kind==='file'){const f=await h.getFile();Meta.set(k,{m:mt,c:o.c||mt,r:f.lastModified})}else Meta.set(k,{m:mt,c:o.c||mt})}
  async exists(path){try{await this.handle(path);return true}catch{return false}}
  async dirSize(path){const d=await this.dir(path),subs=[],files=[];let n=0;for await(const[nm,hh]of d.entries()){hh.kind==='directory'?subs.push(nm):files.push(hh)}
    for(let i=0;i<files.length;i+=64){const r=await Promise.all(files.slice(i,i+64).map(f=>f.getFile().then(x=>x.size,()=>0)));for(const s of r)n+=s}

/* ---------- 后端 B：节点库（IndexedDB / 内存降级） ---------- */
class IDBStore{
  constructor(name){this.name=name}
  async open(){this.db=await idbOpen(this.name,1,db=>{const n=db.createObjectStore('nodes',{keyPath:'p'});n.createIndex('parent','parent');db.createObjectStore('blobs')});
    if(!await this.get('/')){const t=Date.now();await this.put({p:'/',parent:null,name:'/',type:'dir',size:0,mtime:t,ctime:t})}}
  get(p){return idbReq(this.db.transaction('nodes').objectStore('nodes').get(p))}
  children(p){return idbReq(this.db.transaction('nodes').objectStore('nodes').index('parent').getAll(IDBKeyRange.only(p)))}
  async sub(p){const pre=p==='/'?'/':p+'/';return(await idbReq(this.db.transaction('nodes').objectStore('nodes').getAll(IDBKeyRange.bound(pre,pre+'\uffff')))).filter(n=>n.p!=='/')}
  put(node,blob){const tx=this.db.transaction(blob!==undefined?['nodes','blobs']:['nodes'],'readwrite');tx.objectStore('nodes').put(node);if(blob!==undefined)tx.objectStore('blobs').put(blob,node.p);return idbTx(tx)}
  getBlob(p){return idbReq(this.db.transaction('blobs').objectStore('blobs').get(p))}
  del(ps){const tx=this.db.transaction(['nodes','blobs'],'readwrite'),n=tx.objectStore('nodes'),b=tx.objectStore('blobs');ps.forEach(p=>{n.delete(p);b.delete(p)});return idbTx(tx)}
  delTree(p){const pre=p+'/',rg=IDBKeyRange.bound(pre,pre+'\uffff'),tx=this.db.transaction(['nodes','blobs'],'readwrite'),n=tx.objectStore('nodes'),b=tx.objectStore('blobs');n.delete(p);b.delete(p);n.delete(rg);b.delete(rg);return idbTx(tx)}
  async renameTree(a,b){const pre=a+'/',rg=IDBKeyRange.bound(pre,pre+'\uffff'),t0=this.db.transaction(['nodes','blobs']),ns=t0.objectStore('nodes'),bs=t0.objectStore('blobs');
    const[self,selfB,nodes,bk,bv]=await Promise.all([idbReq(ns.get(a)),idbReq(bs.get(a)),idbReq(ns.getAll(rg)),idbReq(bs.getAllKeys(rg)),idbReq(bs.getAll(rg))]);
    const tx=this.db.transaction(['nodes','blobs'],'readwrite'),n=tx.objectStore('nodes'),bl=tx.objectStore('blobs');
    n.delete(a);bl.delete(a);n.delete(rg);bl.delete(rg);
    const re=x=>{const np=b+x.p.slice(a.length);return{...x,p:np,parent:P.dirname(np),name:P.base(np)}};
    if(self){n.put(re(self));if(selfB!==undefined)bl.put(selfB,b)}
    nodes.forEach(x=>n.put(re(x)));bk.forEach((k,i)=>bl.put(bv[i],b+k.slice(a.length)));return idbTx(tx)}}
class MemStore{
  constructor(){this.n=new Map();this.b=new Map()}
  async open(){const t=Date.now();this.n.set('/',{p:'/',parent:null,name:'/',type:'dir',size:0,mtime:t,ctime:t})}
  async get(p){const n=this.n.get(p);return n?{...n}:undefined}
  async children(p){return[...this.n.values()].filter(n=>n.parent===p).map(n=>({...n}))}
  async sub(p){const pre=p==='/'?'/':p+'/';return[...this.n.values()].filter(n=>n.p!=='/'&&n.p.startsWith(pre))}

<script>
/* =====================================================================

/* ---------- 通用框选（鼠标 + 触摸；AABB；40px 边缘自动滚动；可销毁） ---------- */
function attachMarquee(c,o){
  const itemSel=o.itemSel,keyOf=o.keyOf||(el=>el.dataset.p),mk=document.createElement('div');mk.className='marq';let st=null;

  const activate=()=>{st.active=true;st.base=st.add?new Set(o.getSel()):new Set();
    st.items=Array.from(c.querySelectorAll(itemSel)).map(el=>({k:keyOf(el),x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight,on:st.base.has(keyOf(el))}));
    if(!st.add)o.onChange(new Set());c.appendChild(mk)};
  const move=e=>{if(!st)return;const{x,y}=getXY(e);st.cx=x;st.cy=y;if(st.touch&&e.cancelable)e.preventDefault();
    if(!st.active){if(Math.hypot(x-st.x0,y-st.y0)<4)return;activate()}if(!st.raf)st.raf=requestAnimationFrame(tick)};
  const tick=()=>{st.raf=0;if(!st||!st.active)return;const r=c.getBoundingClientRect(),E=40;let dx=0,dy=0;
    if(st.cy<r.top+E)dy=-Math.ceil((E-(st.cy-r.top))/3);else if(st.cy>r.bottom-E)dy=Math.ceil((E-(r.bottom-st.cy))/3);
    if(st.cx<r.left+E)dx=-Math.ceil((E-(st.cx-r.left))/3);else if(st.cx>r.right-E)dx=Math.ceil((E-(r.right-st.cx))/3);
    if(dx||dy){c.scrollLeft+=dx;c.scrollTop+=dy;st.raf=requestAnimationFrame(tick)}
    const x=clamp(st.cx-r.left+c.scrollLeft-c.clientLeft,0,c.scrollWidth),y=clamp(st.cy-r.top+c.scrollTop-c.clientTop,0,c.scrollHeight);
    const L=Math.min(st.sx,x),T=Math.min(st.sy,y),W=Math.abs(x-st.sx),H=Math.abs(y-st.sy),R=L+W,B=T+H;

    for(const it of st.items){const hit=!(it.x>R||it.x+it.w<L||it.y>B||it.y+it.h<T),on=hit||st.base.has(it.k);if(on)sel.add(it.k);if(on!==it.on){it.on=on;changed=true}}
    if(changed)o.onChange(sel)};
  const end=e=>{if(!st)return;const s=st;st=null;cleanup();if(s.raf)cancelAnimationFrame(s.raf);mk.remove();
    if(!s.active&&e.type!=='touchcancel'&&o.onBlank)o.onBlank(s.ev);if(s.active&&o.onEnd)o.onEnd()};

/* ---------- 长按菜单（触屏）与去重 ---------- */
const Ctx={t:0,ok(){const n=Date.now();if(n-this.t<120)return false;this.t=n;return true}};
function onLongPress(c,cb){let t=null,sx=0,sy=0;const cancel=()=>{clearTimeout(t);t=null};
  c.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;const target=e.target;clearTimeout(t);t=setTimeout(()=>{t=null;if(Ctx.ok())cb({target,clientX:sx,clientY:sy})},520)},{passive:true});
  c.addEventListener('touchmove',e=>{const x=e.touches[0].clientX,y=e.touches[0].clientY;if(Math.hypot(x-sx,y-sy)>10)cancel()},{passive:true});c.addEventListener('touchend',cancel);c.addEventListener('touchcancel',cancel)}

/* ---------- 缩略图（仅在可见时加载；LRU） ---------- */
const Thumbs={cache:new Map(),q:[],run:0,io:null,
  init(){if(this.io)return;this.io=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting){this.io.unobserve(e.target);this.q.push(e.target);this.pump()}}},{rootMargin:'120px'})},
  watch(el){this.init();const k=el.dataset.th+'|'+el.dataset.mt,c=this.cache.get(k);if(c){this.put(el,c);return}this.io.observe(el)},
  put(el,url){if(!el.isConnected)return;const img=new Image();img.className='th';img.decoding='async';img.onload=()=>{const svgEl=el.firstElementChild;el.replaceChildren(img)};img.src=url},
  pump(){while(this.run<4&&this.q.length){const el=this.q.shift();if(!el.isConnected)continue;this.run++;const k=el.dataset.th+'|'+el.dataset.mt;
    this.make(el.dataset.th).then(u=>{this.cache.set(k,u);if(this.cache.size>500){const f=this.cache.keys().next().value;URL.revokeObjectURL(this.cache.get(f));this.cache.delete(f)}this.put(el,u)}).catch(()=>{}).finally(()=>{this.run--;this.pump()})}},
  async make(path){const f=await fs.getBlob(path);if(f.size>60e6)throw 0;
    try{const bmp=await createImageBitmap(f,{resizeWidth:200,resizeQuality:'medium'});const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;cv.getContext('2d').drawImage(bmp,0,0);bmp.close&&bmp.close();
      const b=await new Promise(r=>cv.toBlob(r,'image/webp',.82));if(b)return URL.createObjectURL(b)}catch{}
    if(f.size<8e6)return URL.createObjectURL(f);throw 0}};

/* ---------- 拖拽：统一走原生 DnD（鼠标）+ 触摸自定义拖拽 ---------- */
const DnD={st:null,cache:new Map(),touching:false,lastTouchDrag:0,_hot:null,
  prime(p){if(p.startsWith('app:')||this.cache.has(p))return;const en={file:null,url:null};this.cache.set(p,en);
    fs.stat(p).then(s=>{if(s.type!=='file'||s.size>2e9)return;return fs.getFile(p).then(f=>{en.file=f;en.url=URL.createObjectURL(f)})}).catch(()=>{});
    if(this.cache.size>80){const k=this.cache.keys().next().value;this.release(k)}},
  release(k){const en=this.cache.get(k);this.cache.delete(k);if(en&&en.url)setTimeout(()=>URL.revokeObjectURL(en.url),6000)},
  start(e,paths,ctx){this.st={paths,src:ctx.src,sx:e.clientX,sy:e.clientY};const dt=e.dataTransfer;dt.effectAllowed='copyMove';
    dt.setData('application/x-webos-paths',JSON.stringify(paths));
    const real=paths.filter(p=>!p.startsWith('app:'));let single=null;
    for(const p of real){const c=this.cache.get(p);if(c&&c.file){try{dt.items.add(c.file)}catch{}if(real.length===1)single=c}}
    if(single)dt.setData('DownloadURL',`${single.file.type||'application/octet-stream'}:${single.file.name}:${single.url}`);
    if(paths.length>1){const g=h('div',{class:'dragghost',style:{left:'-999px',top:'-999px',transform:'none'}},h('span',{html:ic('copy',16)}),paths.length+' 项');document.body.append(g);dt.setDragImage(g,12,12);setTimeout(()=>g.remove(),0)}},
  end(){const st=this.st;this.st=null;this.hot(null);if(st)for(const p of st.paths)if(this.cache.has(p))this.release(p)},
  hot(el){if(this._hot===el)return;if(this._hot)this._hot.classList.remove('drop-hot');this._hot=el;if(el)el.classList.add('drop-hot')},
  async finish({paths,x,y,dir,copy,st}){
    if(dir==='@desktop'){const dd=Sys.desktopDirs(),fromDesk=paths.every(p=>p.startsWith('app:')||dd.includes(P.dirname(p)));
      if(fromDesk&&st){Desktop.moveIcons(paths,x,y,st);return}
      const moved=await Ops.transfer(paths,Sys.dir('desktop'),{copy});if(moved&&moved.length)Desktop.dropPlace(moved.map(m=>m[1]),x,y);return}
    await Ops.transfer(paths,dir,{copy})}};
(function(){
  const tgt=e=>e.target&&e.target.closest?e.target.closest('[data-dropdir]'):null,hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
  document.addEventListener('dragover',e=>{const files=hasFiles(e);if(!DnD.st&&!files)return;e.preventDefault();const t=tgt(e);
    if(!t){DnD.hot(null);e.dataTransfer.dropEffect='none';return}e.dataTransfer.dropEffect=(DnD.st&&!e.ctrlKey&&!e.altKey)?'move':'copy';DnD.hot(t.dataset.dropkind==='folder'?t:null)});
  document.addEventListener('dragleave',e=>{if(!e.relatedTarget)DnD.hot(null)});
  document.addEventListener('drop',e=>{const files=hasFiles(e);if(!DnD.st&&!files)return;e.preventDefault();DnD.hot(null);const t=tgt(e);if(!t)return;const dir=t.dataset.dropdir;
    if(DnD.st){const st=DnD.st;DnD.finish({paths:st.paths,x:e.clientX,y:e.clientY,dir,copy:e.ctrlKey||e.altKey,st})}
    else{const list=Import.collect(e.dataTransfer);Import.run(list,dir==='@desktop'?Sys.dir('desktop'):dir,{x:e.clientX,y:e.clientY,desktop:dir==='@desktop'})}});
})();
function attachDragSource(c,o){ // 鼠标原生拖拽（dragstart 同步读取缓存，严禁 async）
  const item=e=>e.target.closest&&e.target.closest(o.itemSel);
  const prime=e=>{const el=item(e);if(el&&c.contains(el))o.paths(el,true).forEach(p=>DnD.prime(p))};
  c.addEventListener('mouseover',prime);c.addEventListener('mousedown',e=>{if(e.button===0)prime(e)});
  c.addEventListener('dragstart',e=>{const el=item(e);if(!el||!c.contains(el))return;if(DnD.touching){e.preventDefault();return}
    const paths=o.paths(el,false);if(!paths.length){e.preventDefault();return}DnD.start(e,paths,o)});
  c.addEventListener('dragend',()=>DnD.end())}
function attachTouchDrag(c,o){ // 触摸拖拽（touchstart/move/end；移动时 preventDefault 锁滚动）
  const onStart=e=>{if(e.touches.length!==1)return;const el=e.target.closest(o.itemSel);if(!el||!c.contains(el)||(o.canStart&&!o.canStart(el)))return;
    DnD.touching=true;const t0=e.touches[0],s={x0:t0.clientX,y0:t0.clientY,on:false,ghost:null,paths:null,last:null};
    const move=ev=>{const t=ev.touches[0];if(!t)return;if(ev.cancelable)ev.preventDefault();
      if(!s.on){if(Math.hypot(t.clientX-s.x0,t.clientY-s.y0)<8)return;s.on=true;s.paths=o.paths(el,false);
        s.ghost=h('div',{class:'dragghost'},h('span',{html:ic(s.paths.length>1?'copy':'file',16)}),s.paths.length>1?s.paths.length+' 项':P.base(s.paths[0]).replace(/^app:/,''));document.body.append(s.ghost);DnD.st={paths:s.paths,src:o.src,sx:s.x0,sy:s.y0}}
      s.ghost.style.left=t.clientX+'px';s.ghost.style.top=t.clientY+'px';s.ghost.style.display='none';const under=document.elementFromPoint(t.clientX,t.clientY);s.ghost.style.display='';
      const tg=under&&under.closest('[data-dropdir]');DnD.hot(tg&&tg.dataset.dropkind==='folder'?tg:null);s.last=[t.clientX,t.clientY,tg]};
    const end=ev=>{document.removeEventListener('touchmove',move);document.removeEventListener('touchend',end);document.removeEventListener('touchcancel',end);setTimeout(()=>{DnD.touching=false},500);
      if(!s.on)return;DnD.hot(null);s.ghost.remove();DnD.lastTouchDrag=Date.now();const st=DnD.st;DnD.st=null;
      if(ev.type==='touchend'&&s.last&&s.last[2])DnD.finish({paths:s.paths,x:s.last[0],y:s.last[1],dir:s.last[2].dataset.dropdir,copy:false,st})};
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',end);document.addEventListener('touchcancel',end)};
  c.addEventListener('touchstart',onStart,{passive:true});return{destroy(){c.removeEventListener('touchstart',onStart)}}}

/* ---------- 导入（物理桌面 → 虚拟桌面）---------- */
const cleanName=n=>String(n).replace(/[\\/\u0000]/g,'_');
const Import={
  collect(dt){const out=[];const items=dt.items;
    if(items&&items.length&&items[0].webkitGetAsEntry){for(let i=0;i<items.length;i++){const it=items[i];if(it.kind!=='file')continue;const en=it.webkitGetAsEntry();if(en)out.push(en);else{const f=it.getAsFile();if(f)out.push(f)}}}
    else for(const f of dt.files)out.push(f);return out},
  async readAll(reader){const out=[];while(true){const b=await new Promise((res,rej)=>reader.readEntries(res,rej));if(!b.length)break;out.push(...b)}return out},
  async writeOne(f,dir,name,ctx,top){const nm=top?await fs.uniqueName(dir,cleanName(name)):cleanName(name),dst=P.join(dir,nm);await fs.writeFile(dst,f,{mtime:f.lastModified||Date.now()});ctx.n++;ctx.pr.set(null,`已导入 ${ctx.n} 个文件…`);if(top)ctx.created.push(dst)},
  async entry(en,dir,ctx,top){
    if(en.isFile){const f=await new Promise((res,rej)=>en.file(res,rej));await this.writeOne(f,dir,en.name,ctx,top)}
    else if(en.isDirectory){const nm=top?await fs.uniqueName(dir,cleanName(en.name)):cleanName(en.name),dst=P.join(dir,nm);await fs.mkdir(dst,{recursive:true});if(top)ctx.created.push(dst);
      for(const c of await this.readAll(en.createReader()))await this.entry(c,dst,ctx,false)}},
  async run(list,dir,o={}){if(!list.length)return;const pr=Progress.start('正在导入…'),ctx={n:0,pr,created:[]};
    try{for(const it of list){if(it instanceof File)await this.writeOne(it,dir,it.name,ctx,true);else await this.entry(it,dir,ctx,true)}
      pr.done(`已导入 ${ctx.n} 个文件`);if(o.desktop&&ctx.created.length)Desktop.dropPlace(ctx.created,o.x,o.y)}catch(e){pr.fail('导入失败：'+errMsg(e))}},
  async fromInput(files,dir){const pr=Progress.start('正在导入…'),ctx={n:0,pr,created:[]};
    try{for(const f of files){const rel=f.webkitRelativePath;if(rel){const parts=rel.split('/'),top=parts[0];let d=dir;
          if(!ctx.map)ctx.map={};if(!ctx.map[top]){ctx.map[top]=await fs.uniqueName(dir,cleanName(top));ctx.created.push(P.join(dir,ctx.map[top]))}
          d=P.join(dir,ctx.map[top],...parts.slice(1,-1).map(cleanName));await fs.mkdir(d,{recursive:true});await this.writeOne(f,d,f.name,ctx,false)}
        else await this.writeOne(f,dir,f.name,ctx,true)}pr.done(`已导入 ${ctx.n} 个文件`);return ctx.created}catch(e){pr.fail('导入失败：'+errMsg(e));return[]}}};

/* ---------- 文件操作 ---------- */
const NEWFILES=[
  {label:'文本文档',ext:'txt',name:'新建文本文档',icon:'text',content:''},
  {label:'HTML 网页',ext:'html',name:'新建网页',icon:'code',content:'<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>新页面</title>\n  <style>\n    body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0b1e26;color:#d8f3ec}\n  </style>\n</head>\n<body>\n  <h1>你好，汐图 OS</h1>\n</body>\n</html>\n'},

.xp.narrow .xp-side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-102%);box-shadow:var(--shadow);width:min(80%,280px)}
.xp.narrow.side-open .xp-side{transform:none}
.xp .only-narrow{display:none}.xp.narrow .only-narrow{display:inline-flex}
.xp.narrow .xp-search{width:130px}.xp.narrow .cb span{display:none}.xp.narrow .cb.keep span{display:inline}
.xp.narrow .xp-search .gs{display:none}
.xp-scrim{position:absolute;inset:0;background:var(--scrim);z-index:7;display:none}.xp.narrow.side-open .xp-scrim{display:block}
</style>
<script>
/* =====================================================================
   P5 · 文件管理器（详细信息 / 图标 / 分栏；树形导航；面包屑；全局搜索；框选；拖拽）
   ===================================================================== */
const COLLAB={name:'名称',mtime:'修改日期',type:'类型',size:'大小'};
function getCols(){let c=(Settings.get('xpCols')||[]).filter(x=>COLLAB[x.k]);for(const k of Object.keys(COLLAB))if(!c.some(x=>x.k===k))c.push({k,w:k==='name'?300:140});return c.map(x=>({k:x.k,w:clamp(x.w||140,60,900)}))}
function entryIcon(e){if(e.virtual&&e.mount)return driveSVG(e.path.startsWith('/mnt/local')?'local':e.path==='/idb'?'idb':'opfs');if(e.virtual)return folderSVG();return iconFor(e.name,e.type==='dir',e.path)}
const dispName=e=>e.virtual?Sys.display(e.path):e.name;
function entryType(e){if(e.virtual)return e.mount?(e.path.startsWith('/mnt/local/')?'本地文件夹':'存储'):'系统文件夹';return kindOf(e.name,e.type==='dir').label}

function ExplorerApp(win,args){
  const R=win.body;
  R.innerHTML=`<div class="xp" tabindex="0"><div class="xp-top">
    <button class="btn ghost sq only-narrow" data-a="side" title="导航窗格">${ic('panel',17)}</button>
    <button class="btn ghost sq" data-a="back" title="后退 (Alt+←)">${ic('back',17)}</button><button class="btn ghost sq" data-a="fwd" title="前进 (Alt+→)">${ic('fwd',17)}</button>
    <button class="btn ghost sq" data-a="up" title="上一级">${ic('up',17)}</button><button class="btn ghost sq" data-a="refresh" title="刷新 (F5)">${ic('refresh',17)}</button>
    <div class="xp-addr" data-a="addr"><div class="crumbs"></div><input class="addr-in" hidden spellcheck="false"></div>
    <div class="xp-search">${ic('search')}<input class="inp" placeholder="搜索当前文件夹" spellcheck="false"><button class="gs" title="切换为全局搜索（所有存储位置）">全局</button></div></div>
    <div class="xp-cmd">
      <button class="btn ghost cb keep" data-a="new" title="新建">${ic('plus')}<span>新建</span>${ic('chevD',12)}</button>
      <button class="btn ghost cb" data-a="upload" title="上传文件">${ic('upload')}<span>上传</span></button><span class="sep"></span>
      <button class="btn ghost cb" data-a="cut" title="剪切">${ic('cut')}<span>剪切</span></button><button class="btn ghost cb" data-a="copy" title="复制">${ic('copy')}<span>复制</span></button>
      <button class="btn ghost cb" data-a="paste" title="粘贴">${ic('paste')}<span>粘贴</span></button><button class="btn ghost cb" data-a="rename" title="重命名">${ic('rename')}<span>重命名</span></button>
      <button class="btn ghost cb danger" data-a="del" title="删除">${ic('trash')}<span>删除</span></button><span class="sep"></span>
      <button class="btn ghost cb" data-a="sort" title="排序方式">${ic('sort')}<span>排序</span></button>
      <button class="btn ghost sq" data-v="icons" title="图标视图">${ic('grid')}</button><button class="btn ghost sq" data-v="details" title="详细信息（列表）视图">${ic('list')}</button><button class="btn ghost sq" data-v="columns" title="分栏视图">${ic('columns')}</button>
      <input type="range" min="64" max="190" class="tile-range" title="图标大小"><span class="sep touch-only"></span>
      <button class="btn ghost cb touch-only" data-a="selmode" title="多选模式：点按项目即可勾选">${ic('multi')}<span>多选</span></button>
      <button class="btn ghost cb touch-only" data-a="boxmode" title="框选模式：在空白处拖动框选；关闭后可正常滚动">${ic('select')}<span>框选</span></button>
      <button class="btn ghost cb touch-only" data-a="dl" title="下载 / 导出所选项目到本机">${ic('download')}<span>下载</span></button></div>
    <div class="xp-main"><aside class="xp-side"></aside><div class="xp-scrim"></div><section class="xp-content"><div class="xp-lbar indet"></div><div class="xp-banner" hidden></div><div class="xp-scroll" data-dropkind="area"></div><div class="xp-load" hidden><span class="spinner"></span><span class="xl-t">正在读取…</span></div></section></div>
    <div class="xp-status"><span class="s-count"></span><span class="s-sel"></span><span class="sp"></span><span class="s-extra"></span></div></div>`;
  const root=$('.xp',R),scroll=$('.xp-scroll',R),side=$('.xp-side',R),crumbs=$('.crumbs',R),addrIn=$('.addr-in',R),fInp=$('.xp-search input',R),gsBtn=$('.gs',R),loadEl=$('.xp-load',R),lbar=$('.xp-lbar',R),banner=$('.xp-banner',R);
  const x={path:'/',hist:[],hi:-1,all:[],entries:[],sel:new Set(),anchor:null,view:Settings.get('xpView'),sort:{k:'name',d:1},filter:'',global:false,search:null,selMode:false,boxMode:false,seq:0,cols:getCols(),marqs:[],colCache:new Map(),expanded:new Set(['/','/opfs','/idb','/mnt','/mnt/local']),pending:null,err:null,tile:Settings.get('xpTile')||104,mounts:null};
  win.data.x=x;
  const canWrite=()=>x.path!=='/'&&!!fs.resolve(x.path)&&!x.search;
  const vis=e=>Settings.get('showHidden')||!e.name.startsWith('.');

  /* ---------- 加载 / 导航 ---------- */
  function showLoad(on,imm){clearTimeout(x.lt);if(on){x.lt=setTimeout(()=>{loadEl.hidden=false;lbar.classList.add('on')},imm?0:130)}else{loadEl.hidden=true;lbar.classList.remove('on')}}
  async function load(){const my=++x.seq;x.err=null;showLoad(true,x.path.startsWith('/mnt/local/'));
    try{if(x.path==='/')x.all=[];else x.all=(await fs.readdir(x.path)).filter(vis);}catch(e){if(my!==x.seq)return;x.all=[];x.err=errMsg(e)}
    if(my!==x.seq)return;showLoad(false);x.colCache.clear();refilter();
    const keep=new Set();for(const p of x.sel)if(x.all.some(e=>e.path===p))keep.add(p);x.sel=keep;
    if(x.pending){const p=x.all.find(e=>e.path===x.pending);if(p)x.sel=new Set([p.path]);x.scrollTo=x.pending;x.pending=null}
    render();renderCrumbs();updBar();syncTree()}
  async function go(path,o={}){path=P.norm(path);showLoad(true,path.startsWith('/mnt/local/'));let st;
    try{st=await fs.stat(path)}catch(e){showLoad(false);toast(errMsg(e),{type:'err'});return}
    if(st.type!=='dir'){showLoad(false);return Open.file(path)}
    if(o.push!==false){x.hist=x.hist.slice(0,x.hi+1);if(x.hist[x.hist.length-1]!==path)x.hist.push(path);x.hi=x.hist.length-1}
    x.path=path;x.search=null;banner.hidden=true;x.filter='';fInp.value='';x.sel=new Set();x.pending=o.select||null;win.setTitle(Sys.display(path));win.iconName='folder';
    root.classList.remove('side-open');await load()}
  const refilter=()=>{let l=x.all;if(x.filter){const q=x.filter.toLowerCase();l=l.filter(e=>e.name.toLowerCase().includes(q))}x.entries=sortList(l.slice())};
  const sizeOf=e=>e.type==='dir'?(Sizes.get(e.path)==null?-1:Sizes.get(e.path)):(e.size||0);
  const SORTS={name:(a,b)=>natCmp(dispName(a),dispName(b)),mtime:(a,b)=>(a.mtime||0)-(b.mtime||0),type:(a,b)=>natCmp(entryType(a),entryType(b))||natCmp(a.name,b.name),size:(a,b)=>sizeOf(a)-sizeOf(b)};
  function sortList(l){const f=SORTS[x.sort.k];return l.sort((a,b)=>{if(a.type!==b.type)return a.type==='dir'?-1:1;return f(a,b)*x.sort.d||natCmp(a.name,b.name)})}
  function setSort(k){x.sort=x.sort.k===k?{k,d:-x.sort.d}:{k,d:1};refilter();render()}

  /* ---------- 渲染 ---------- */
  function clearMarqs(){x.marqs.forEach(m=>m.destroy());x.marqs=[]}
  function render(){clearMarqs();scroll.classList.toggle('cols',x.view==='columns'&&x.path!=='/'&&!x.search);scroll.scrollTop===0;
    $$('[data-v]',R).forEach(b=>b.classList.toggle('on',b.dataset.v===x.view));$('.tile-range',R).style.display=x.view==='icons'?'':'none';
    if(canWrite())scroll.dataset.dropdir=x.path;else scroll.removeAttribute('data-dropdir');
    if(x.path==='/'&&!x.search)return renderDrives();
    if(x.err){scroll.innerHTML=`<div class="xp-empty">${ic('info')}<div style="color:var(--danger)">${esc(x.err)}</div></div>`;return}
    if(x.view==='columns'&&!x.search)return renderColumns();
    if(x.view==='icons')renderIcons();else renderDetails();
    attachMarq(scroll);
    if(x.scrollTo){const el=scroll.querySelector(`[data-p="${CSS.escape(x.scrollTo)}"]`);if(el)el.scrollIntoView({block:'nearest'});x.scrollTo=null}}
  function emptyHTML(){return x.entries.length?'':`<div class="xp-empty">${ic(x.search?'search':'folder')}<div>${x.search?'没有找到匹配的项目':(x.filter?'没有匹配的项目':'此文件夹为空')}</div><div style="font-size:.88rem">${canWrite()?'拖放文件到此处，或右键新建 / 点击“上传”':''}</div></div>`}
  function rowHTML(e){const dir=e.type==='dir',drag=!e.virtual||e.mount,dd=(dir&&fs.resolve(e.path))?` data-dropdir="${esc(e.path)}" data-dropkind="folder"`:'';
    const cells=x.cols.map(c=>{switch(c.k){
      case'name':return`<div class="c c-name" style="width:var(--w-name)"><i class="chk"></i><span class="ico">${entryIcon(e)}</span><span class="nm">${esc(dispName(e))}</span>${x.search?`<span class="sub">${esc(Sys.display(P.dirname(e.path)))}</span>`:''}</div>`;
      case'mtime':return`<div class="c" style="width:var(--w-mtime)">${e.virtual?'':fmtDate(e.mtime)}</div>`;
      case'type':return`<div class="c" style="width:var(--w-type)">${esc(entryType(e))}</div>`;
      case'size':{let t='';if(dir){if(!e.virtual||e.mount){const s=Sizes.get(e.path);t=`<span class="dsz" data-p="${esc(e.path)}">${s==null?'…':fmtSize(s)}</span>`}}else t=fmtSize(e.size);return`<div class="c" style="width:var(--w-size)">${t}</div>`}}}).join('');
    return`<div class="row${x.sel.has(e.path)?' sel':''}${Ops.isCut(e.path)?' cut':''}" data-p="${esc(e.path)}"${drag?' draggable="true"':''}${dd}>${cells}</div>`}
  function setWidths(){x.cols.forEach(c=>scroll.style.setProperty('--w-'+c.k,c.w+'px'));scroll.style.setProperty('--tw',x.cols.reduce((s,c)=>s+c.w,0)+'px')}
  function renderDetails(){setWidths();const head=x.cols.map(c=>`<div class="hc${x.sort.k===c.k?' sorted':''}" data-k="${c.k}" style="width:var(--w-${c.k})"><span>${COLLAB[c.k]}</span>${x.sort.k===c.k?ic(x.sort.d>0?'chevU':'chevD'):''}<i class="hz"></i></div>`).join('');
    scroll.innerHTML=`<div class="xp-head">${head}</div><div class="xp-rows">${x.entries.map(rowHTML).join('')}${emptyHTML()}</div>`;fillSizes()}
  function renderIcons(){scroll.style.setProperty('--tile',x.tile+'px');
    scroll.innerHTML=`<div class="xp-icons">${x.entries.map(e=>{const dir=e.type==='dir',k=kindOf(e.name,dir),drag=!e.virtual||e.mount,dd=(dir&&fs.resolve(e.path))?` data-dropdir="${esc(e.path)}" data-dropkind="folder"`:'';
      return`<div class="xtile${x.sel.has(e.path)?' sel':''}${Ops.isCut(e.path)?' cut':''}" data-p="${esc(e.path)}" title="${esc(dispName(e))}"${drag?' draggable="true"':''}${dd}><i class="chk"></i><div class="xthumb"${k.cat==='image'?` data-th="${esc(e.path)}" data-mt="${e.mtime}"`:''}>${entryIcon(e)}</div><div class="xnm">${esc(dispName(e))}</div></div>`}).join('')}${emptyHTML()}</div>`;
    $$('.xthumb[data-th]',scroll).forEach(el=>Thumbs.watch(el))}
  const sizeQ=[];let sizeRun=0;
  function fillSizes(){const my=x.seq;$$('.dsz',scroll).forEach(sp=>{if(sp.textContent!=='…')return;sizeQ.push([sp,my])});pumpSizes()}
  function pumpSizes(){while(sizeRun<2&&sizeQ.length){const[sp,my]=sizeQ.shift();if(my!==x.seq||!sp.isConnected)continue;sizeRun++;fs.du(sp.dataset.p).then(n=>{if(sp.isConnected)sp.textContent=fmtSize(n);if(x.sort.k==='size'&&my===x.seq&&!x._rs){x._rs=setTimeout(()=>{x._rs=0;if(my===x.seq){refilter();render()}},800)}}).catch(()=>{if(sp.isConnected)sp.textContent='—'}).finally(()=>{sizeRun--;pumpSizes()})}}
  async function renderDrives(){const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate().catch(()=>({})):{},quota=est.quota||0;
    const mk=(p,kind,name,desc)=>`<div class="xdrive" data-p="${p}" data-dropdir="${esc(p)}" data-dropkind="folder"><div class="xd-ico">${driveSVG(kind)}</div><div class="xd-info"><b>${esc(name)}</b><span class="kbd">${esc(desc)}</span><div class="bar"><i style="width:0%"></i></div><span class="xd-use" data-u="${esc(p)}">正在统计占用…</span></div></div>`;
    const loc=[...fs.mounts.keys()].filter(m=>m.startsWith('/mnt/local/'));
    scroll.innerHTML=`<div class="xp-drives">${mk('/opfs','opfs','OPFS 存储',fs.info.opfs&&fs.info.opfs.native?'原生私有文件系统 · 高性能':'已降级为 IndexedDB 模拟')}${mk('/idb','idb','IndexedDB 存储','节点数据库 · 兼容性最佳')}${loc.map(m=>mk(m,'local',Sys.display(m),'本地文件夹 · '+m)).join('')}
      <div class="xdrive add" data-a="mount"><div class="xd-ico">${driveSVG('local')}</div><div class="xd-info"><b>挂载本地文件夹…</b><span class="kbd">${LocalFS.supported?'将电脑上的真实文件夹挂载到 /mnt/local':'当前浏览器不支持，可改用上传文件夹'}</span></div></div></div>`;
    $$('.xdrive[data-p]',scroll).forEach(d=>{const p=d.dataset.p;fs.du(p).then(n=>{const u=d.querySelector('.xd-use'),b=d.querySelector('.bar i');if(!u)return;u.textContent='已用 '+fmtSize(n)+(quota&&p!=='/mnt'&&!p.startsWith('/mnt/')?'（浏览器配额 '+fmtSize(quota)+'）':'');if(b)b.style.width=Math.max(2,Math.min(100,quota&&!p.startsWith('/mnt/')?n/quota*100*8:30))+'%'}).catch(()=>{const u=d.querySelector('.xd-use');if(u)u.textContent='无法统计'})});
    updBar()}
  /* 分栏视图 */
  async function colList(p){if(x.colCache.has(p))return x.colCache.get(p);let l=p===x.path?x.all:(await fs.readdir(p)).filter(vis);l=sortList(l.slice());x.colCache.set(p,l);return l}
  async function renderColumns(){const chain=['/'];let acc='';for(const s of P.split(x.path)){acc+='/'+s;chain.push(acc)}
    const my=x.seq;showLoad(true,x.path.startsWith('/mnt/local/'));let lists;try{lists=await Promise.all(chain.map(colList))}catch(e){showLoad(false);scroll.innerHTML=`<div class="xp-empty">${ic('info')}<div style="color:var(--danger)">${esc(errMsg(e))}</div></div>`;return}
    if(my!==x.seq||x.view!=='columns')return;showLoad(false);clearMarqs();
    const rowH=(e,trail)=>{const dir=e.type==='dir',dd=(dir&&fs.resolve(e.path))?` data-dropdir="${esc(e.path)}" data-dropkind="folder"`:'';return`<div class="mrow${x.sel.has(e.path)?' sel':''}${trail?' trail':''}${Ops.isCut(e.path)?' cut':''}" data-p="${esc(e.path)}" draggable="true"${dd}><span class="ico">${entryIcon(e)}</span><span class="nm">${esc(dispName(e))}</span>${dir?`<span class="ar">${ic('chevR',13)}</span>`:''}</div>`};
    let html='<div class="mcols">';chain.forEach((p,i)=>{html+=`<div class="mcol" data-col="${esc(p)}"${(fs.resolve(p)&&p!=='/')?` data-dropdir="${esc(p)}" data-dropkind="area"`:''}>${lists[i].map(e=>rowH(e,chain[i+1]===e.path)).join('')||'<div class="kbd" style="padding:12px">（空）</div>'}</div>`});
    const selOne=x.sel.size===1?lists[chain.length-1].find(e=>e.path===[...x.sel][0]):null;if(selOne&&selOne.type==='file')html+=`<div class="mprev" data-prev="${esc(selOne.path)}"></div>`;html+='</div>';
    scroll.innerHTML=html;const mc=$('.mcols',scroll);mc.scrollLeft=mc.scrollWidth;$$('.mcol',scroll).forEach(c=>attachMarq(c));if(selOne&&selOne.type==='file')fillPreview(selOne)}
  async function fillPreview(e){const pv=$('.mprev',scroll);if(!pv)return;const k=kindOf(e.name);
    pv.innerHTML=`<div class="pi">${iconFor(e.name,false,e.path)}</div><h4>${esc(e.name)}</h4><div class="kbd">${esc(k.label)}</div><dl><dt>大小</dt><dd>${fmtSize(e.size)}</dd><dt>修改日期</dt><dd>${fmtDate(e.mtime)}</dd><dt>创建日期</dt><dd>${fmtDate(e.ctime)}</dd></dl><div style="display:flex;gap:8px;justify-content:center"><button class="btn pri" data-pa="open">${ic('eye',16)}打开</button><button class="btn" data-pa="dl">${ic('download',16)}下载</button></div><div class="pxt" style="margin-top:14px"></div>`;
    pv.querySelector('[data-pa=open]').onclick=()=>Open.file(e.path);pv.querySelector('[data-pa=dl]').onclick=()=>Ops.download([e.path]);
    try{if(k.cat==='image'){const b=await fs.getBlob(e.path),u=URL.createObjectURL(b);win.onCleanup(()=>URL.revokeObjectURL(u));const pi=pv.querySelector('.pi');if(pi&&pi.isConnected)pi.innerHTML=`<img src="${u}" alt="">`}
      else if(k.cat==='text'||k.cat==='code'||k.cat==='html'||k.cat==='sheet'){const b=await fs.getBlob(e.path),t=await b.slice(0,1800).text(),bx=pv.querySelector('.pxt');if(bx)bx.innerHTML=`<pre>${esc(t)}</pre>`}}catch{}}
  /* ---------- 选择 / 状态栏 ---------- */
  function setSel(s){x.sel=new Set(s);$$('.row,.xtile,.mrow',scroll).forEach(el=>el.classList.toggle('sel',x.sel.has(el.dataset.p)));updBar();if(x.view==='columns'&&!x.search)renderColumns()}
  function updBar(){const n=x.entries.length;$('.s-count',R).textContent=x.path==='/'&&!x.search?`${fs.mounts.size>2?fs.mounts.size:2} 个存储位置`:`${n} 个项目${x.filter&&x.all.length!==n?`（共 ${x.all.length}）`:''}`;
    let sz=0,f=0;for(const p of x.sel){const e=x.entries.find(v=>v.path===p)||x.all.find(v=>v.path===p);if(e&&e.type==='file'){sz+=e.size||0;f++}}
    $('.s-sel',R).textContent=x.sel.size?`已选择 ${x.sel.size} 项${f?' · '+fmtSize(sz):''}`:'';
    $('.s-extra',R).textContent=Sys.mountKind(x.path)==='local'?'本地文件夹':(x.path==='/'?'':(Sys.mountKind(x.path)==='idb'?'IndexedDB':Sys.mountKind(x.path)==='virtual'?'':'OPFS'));
    const has=x.sel.size>0,w=canWrite();$$('[data-a=cut],[data-a=copy],[data-a=rename],[data-a=del],[data-a=dl]',R).forEach(b=>b.classList.toggle('dis',!has||(b.dataset.a==='rename'&&x.sel.size!==1)));
    $('[data-a=paste]',R).classList.toggle('dis',!w||!Ops.clip.paths.length);$('[data-a=new]',R).classList.toggle('dis',!w);$('[data-a=upload]',R).classList.toggle('dis',!w);
    $('[data-a=back]',R).classList.toggle('dis',x.hi<=0);$('[data-a=fwd]',R).classList.toggle('dis',x.hi>=x.hist.length-1);$('[data-a=up]',R).classList.toggle('dis',x.path==='/')}
  /* ---------- 面包屑 / 地址栏 ---------- */
  function renderCrumbs(){const segs=[{p:'/',n:'此电脑'}];let acc='';for(const s of P.split(x.path)){acc+='/'+s;segs.push({p:acc,n:Sys.display(acc)})}
    crumbs.innerHTML=(x.search?`<span class="crumb" data-p="${esc(x.path)}">${esc(Sys.display(x.path))}</span><span class="crumb-sep">${ic('chevR',13)}</span><span class="crumb" style="cursor:default">搜索结果</span>`:segs.map((s,i)=>`${i?`<span class="crumb-sep">${ic('chevR',13)}</span>`:''}<span class="crumb" data-p="${esc(s.p)}"${fs.resolve(s.p)?` data-dropdir="${esc(s.p)}" data-dropkind="folder"`:''}>${esc(s.n)}</span>`).join(''));
    crumbs.scrollLeft=crumbs.scrollWidth}
  $('.xp-addr',R).addEventListener('click',e=>{const c=e.target.closest('.crumb');if(c&&c.dataset.p){go(c.dataset.p);return}addrIn.hidden=false;addrIn.value=x.path;addrIn.focus();addrIn.select()});

  /* ---------- 侧边栏树 ---------- */
