<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>土俵 OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--acc:#d9432e;--rad:10px;--cell:92px;--bar:52px;--fz:14px;--fd:'Ma Shan Zheng','Noto Serif SC','Songti SC',serif;--fb:'Noto Serif SC','Songti SC','SimSun',serif;--fm:'DM Mono',ui-monospace,Menlo,Consolas,monospace;--dur:.22s}
[data-theme=dark]{--bg:#0f0c0a;--p1:#1a1512;--p2:#241d18;--p3:#32281f;--line:#46382c;--ink:#f1e8d9;--ink2:#a8997f;--gold:#cfa568;--shadow:0 18px 50px rgba(0,0,0,.62);--glass:rgba(22,17,14,.84);--selbg:color-mix(in srgb,var(--acc) 26%,transparent);--rope1:#e9dcc0;--rope2:#b39a6c}
[data-theme=light]{--bg:#e9dfc9;--p1:#f8f1e1;--p2:#efe5cf;--p3:#e3d6ba;--line:#c8b78e;--ink:#231a13;--ink2:#6e5d49;--gold:#8a6424;--shadow:0 18px 44px rgba(70,45,20,.28);--glass:rgba(248,241,225,.9);--selbg:color-mix(in srgb,var(--acc) 20%,transparent);--rope1:#fff8e6;--rope2:#b89c62}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:var(--fz)/1.5 var(--fb);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body.noanim *{transition:none!important;animation:none!important}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--ink2)}::-webkit-scrollbar-corner{background:transparent}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
#wall::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.38));pointer-events:none}
#desk{position:fixed;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden;touch-action:none}
body.bar-top #desk{top:var(--bar);bottom:0}
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:var(--cell);height:calc(var(--cell) + 8px);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 3px;border-radius:calc(var(--rad)*.7);border:1px solid transparent;cursor:pointer;transition:left var(--dur) cubic-bezier(.2,.9,.3,1.15),top var(--dur) cubic-bezier(.2,.9,.3,1.15),background .15s,transform .15s;touch-action:none;animation:pop .35s both}
.dicon:hover{background:rgba(255,255,255,.09)}.dicon.sel{background:var(--selbg);border-color:var(--acc)}.dicon.dragging{opacity:.45}.dicon.over{background:var(--selbg);transform:scale(1.07)}
.dicon .di{width:calc(var(--cell)*.52);height:calc(var(--cell)*.52);pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}.dicon .di svg,.dicon .di img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.dicon span{font-size:12px;line-height:1.25;text-align:center;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes stomp{0%{transform:scale(.92) translateY(18px);opacity:0}60%{transform:scale(1.012) translateY(-2px);opacity:1}100%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.marq{position:absolute;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent);pointer-events:none;z-index:50;border-radius:2px}
#wins{position:fixed;left:0;right:0;top:0;bottom:var(--bar);pointer-events:none;overflow:hidden}
body.bar-top #wins{top:var(--bar);bottom:0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--p1);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);pointer-events:auto;overflow:hidden;animation:stomp .32s cubic-bezier(.2,.8,.3,1) both;transition:opacity .2s,transform .22s,filter .2s;min-width:260px;min-height:160px}
.win.anim{transition:left .2s,top .2s,width .2s,height .2s,opacity .2s,transform .22s}
.win.max{border-radius:0;border:none}.win.min{opacity:0;transform:scale(.6) translateY(60vh);pointer-events:none}
.win.peek-ghost{opacity:.06}.win.peek-on{outline:2px solid var(--acc)}
.win.active{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.wt{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding-left:12px;background:linear-gradient(90deg,var(--p3),var(--p2));border-bottom:1px solid var(--line);position:relative;touch-action:none;cursor:default}
.wt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}.win.active .wt::before{background:var(--acc)}
.wt::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:repeating-linear-gradient(115deg,var(--rope1) 0 5px,var(--rope2) 5px 7px);opacity:.0}.win.active .wt::after{opacity:.55}
.wt-ic{width:20px;height:20px;display:flex}.wt-ic svg{width:100%;height:100%}
.wt-tt{flex:1;font:19px/1 var(--fd);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);padding-top:2px}.win.active .wt-tt{color:var(--ink)}
.wc{display:flex;height:100%}.wb{width:44px;height:100%;border:none;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink2);border-left:1px solid var(--line);transition:background .12s,color .12s}
.wb:hover{background:var(--p3);color:var(--ink)}.wb.x:hover{background:var(--acc);color:#fff}.wb svg{width:14px;height:14px}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:5;touch-action:none}.rz-n{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}.rz-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}.rz-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz-nw{left:-3px;top:-3px;width:13px;height:13px;cursor:nwse-resize}.rz-se{right:-3px;bottom:-3px;width:15px;height:15px;cursor:nwse-resize}.rz-ne{right:-3px;top:-3px;width:13px;height:13px;cursor:nesw-resize}.rz-sw{left:-3px;bottom:-3px;width:13px;height:13px;cursor:nesw-resize}
.win.max .rz{display:none}
#snap{position:fixed;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:var(--rad);pointer-events:none;z-index:9000;transition:all .16s;display:none;backdrop-filter:blur(3px)}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:var(--glass);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9500;transition:transform .25s}
body.blur #bar,body.blur #start,body.blur .menu,body.blur #cal{backdrop-filter:blur(16px) saturate(1.3)}
body.bar-top #bar{bottom:auto;top:0;border-top:none;border-bottom:1px solid var(--line)}
#bar::before{content:'';position:absolute;left:0;right:0;top:-4px;height:6px;background:repeating-linear-gradient(115deg,var(--rope1) 0 6px,var(--rope2) 6px 8px);box-shadow:0 1px 3px rgba(0,0,0,.5);border-radius:3px}
body.bar-top #bar::before{top:auto;bottom:-4px}
body.bar-hide #bar{transform:translateY(calc(100% - 4px))}body.bar-hide #bar:hover,body.bar-hide.bar-show #bar{transform:none}body.bar-hide #desk,body.bar-hide #wins{bottom:4px}
#start-btn{height:40px;padding:0 12px 0 8px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--acc);color:#fff;border-radius:calc(var(--rad)*.7);cursor:pointer;font:20px/1 var(--fd);transition:transform .15s,filter .15s}
#start-btn:hover{filter:brightness(1.12)}#start-btn:active{transform:scale(.94)}#start-btn svg{width:24px;height:24px}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto;height:100%;align-items:center;scrollbar-width:none}#tasks::-webkit-scrollbar{display:none}
.task{height:38px;max-width:190px;min-width:44px;display:flex;align-items:center;gap:7px;padding:0 6px 0 9px;border-radius:calc(var(--rad)*.6);border:1px solid transparent;cursor:pointer;position:relative;flex:none;transition:background .12s}
.task:hover{background:var(--p3)}.task.active{background:var(--p3);border-color:var(--line)}.task::after{content:'';position:absolute;left:30%;right:30%;bottom:1px;height:3px;border-radius:2px;background:var(--ink2);transition:all .2s}.task.active::after{left:12%;right:12%;background:var(--acc)}.task.min::after{left:44%;right:44%}
.task svg.ti{width:22px;height:22px;flex:none}.task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.task .tx{width:20px;height:20px;border:none;background:none;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}.task .tx:hover{background:var(--acc);color:#fff}.task .tx svg{width:10px;height:10px}
#tray{display:flex;align-items:center;gap:2px;height:100%}
.trb{height:38px;min-width:34px;padding:0 7px;border:none;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center}.trb:hover{background:var(--p3)}
#clock{text-align:right;font:12px/1.3 var(--fm);padding:0 8px;white-space:nowrap}
#peekbtn{width:10px;height:100%;border-left:1px solid var(--line);margin-left:4px;cursor:pointer}#peekbtn:hover{background:var(--acc)}
#start{position:fixed;left:8px;bottom:calc(var(--bar) + 10px);width:min(560px,calc(100vw - 16px));max-height:min(640px,calc(100vh - var(--bar) - 24px));background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);z-index:9600;display:none;flex-direction:column;overflow:hidden}
body.bar-top #start{bottom:auto;top:calc(var(--bar) + 10px)}
#start.on{display:flex;animation:stomp .28s both}
.st-head{padding:16px 18px 10px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%)}
.st-head h1{font:38px/1 var(--fd);letter-spacing:3px}.st-head small{color:var(--ink2);font-size:12px;padding-bottom:4px}
.st-s{margin:10px 14px 4px}.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;padding:8px 10px;overflow:auto}
.st-app{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:8px;cursor:pointer;font-size:12.5px;text-align:center;animation:rise .3s both}.st-app:hover{background:var(--p3)}.st-app svg{width:38px;height:38px}
.st-foot{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);justify-content:flex-end}
#cal{position:fixed;right:8px;bottom:calc(var(--bar) + 10px);width:300px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);z-index:9600;padding:14px;display:none}
body.bar-top #cal{bottom:auto;top:calc(var(--bar) + 10px)}#cal.on{display:block;animation:stomp .25s both}
.cal-t{font:30px/1.1 var(--fm)}.cal-h{display:flex;align-items:center;gap:6px;margin:10px 0 6px}.cal-h b{flex:1;font:20px var(--fd)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font:12px var(--fm)}.cal-g i{font-style:normal;color:var(--ink2);padding:4px 0}.cal-g span{padding:6px 0;border-radius:50%;aspect-ratio:1;display:grid;place-items:center}.cal-g span.o{color:var(--ink2);opacity:.45}.cal-g span.t{background:var(--acc);color:#fff;font-weight:700}
.menu{position:fixed;min-width:190px;max-width:280px;background:var(--glass);border:1px solid var(--line);border-radius:calc(var(--rad)*.8);box-shadow:var(--shadow);z-index:99000;padding:5px;animation:rise .14s both;max-height:90vh;overflow:auto}
.mi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13.5px;white-space:nowrap}.mi:hover{background:var(--acc);color:#fff}.mi.dis{opacity:.4;pointer-events:none}.mi kbd{margin-left:auto;font:11px var(--fm);opacity:.6}.msep{height:1px;background:var(--line);margin:4px 6px}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--p2);border-radius:calc(var(--rad)*.6);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;transition:background .12s,border-color .12s,transform .1s;flex:none}
.btn:hover{background:var(--p3);border-color:var(--ink2)}.btn:active{transform:scale(.96)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.on{border-color:var(--acc);color:var(--acc)}.btn.sm{height:27px;padding:0 8px;font-size:12px}.btn[disabled]{opacity:.4;pointer-events:none}
.inp{height:32px;padding:0 10px;border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--rad)*.6);outline:none;min-width:0;user-select:text;-webkit-user-select:text}.inp:focus{border-color:var(--acc)}
select.inp{padding-right:4px}textarea.inp{height:auto;padding:8px}
.tb{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--p2);flex-wrap:wrap;flex:none}.tb.scroll{flex-wrap:nowrap;overflow-x:auto}.tb .sp{flex:1}.tb .vs{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
.sbar{display:flex;gap:14px;padding:3px 10px;border-top:1px solid var(--line);background:var(--p2);font:11.5px var(--fm);color:var(--ink2);flex:none;white-space:nowrap;overflow:hidden}
#toasts{position:fixed;right:12px;bottom:calc(var(--bar) + 14px);z-index:99500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:min(380px,90vw);padding:10px 14px 10px 16px;background:var(--p1);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;box-shadow:var(--shadow);font-size:13px;animation:rise .25s both;display:flex;gap:10px;align-items:center}.toast.err{border-left-color:var(--acc)}.toast.ok{border-left-color:#5c9a5a}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98000;display:grid;place-items:center;animation:rise .15s both}
.dlg{width:min(420px,92vw);background:var(--p1);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:18px;border-top:5px solid var(--acc)}.dlg h3{font:24px var(--fd);margin-bottom:10px}.dlg p{color:var(--ink2);margin-bottom:12px;white-space:pre-wrap;word-break:break-all;user-select:text}.dlg .inp{width:100%}.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.load{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:30;color:var(--ink2);font-size:13px;animation:rise .15s both}
.dohyo-spin{width:46px;height:46px;border-radius:50%;border:5px solid transparent;background:repeating-conic-gradient(var(--rope1) 0 14deg,var(--rope2) 14deg 20deg) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.1s linear infinite}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);pointer-events:none;text-align:center}
.ghost{position:fixed;z-index:99900;pointer-events:none;padding:6px 12px;background:var(--acc);color:#fff;border-radius:6px;font-size:12px;box-shadow:var(--shadow);transform:translate(-50%,-130%)}
#peek{position:fixed;z-index:9700;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:var(--shadow);display:none;font-size:12px;max-width:230px;animation:rise .15s both}
#peek .pv{width:210px;height:124px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px;position:relative;border:1px solid var(--line)}#peek .pv>div{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
/* ===== 文件管理器 ===== */
.fx{flex:1;display:flex;min-height:0}.fx-side{width:200px;flex:none;border-right:1px solid var(--line);background:var(--p2);overflow:auto;padding:6px 4px;font-size:13px}
.fx-sh{font:17px var(--fd);color:var(--gold);padding:8px 8px 2px;letter-spacing:1px}
.tn{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}.tn:hover{background:var(--p3)}.tn.cur{background:var(--selbg);box-shadow:inset 3px 0 var(--acc)}.tn.over{outline:1px dashed var(--acc)}.tn svg{width:17px;height:17px;flex:none}.tn .tw{width:14px;height:14px;display:grid;place-items:center;transition:transform .15s;color:var(--ink2);flex:none}.tn .tw.o{transform:rotate(90deg)}.tn .tw svg{width:9px;height:9px}.tn span{overflow:hidden;text-overflow:ellipsis}
.fx-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.fx-crumb{flex:1;min-width:80px;height:32px;display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:calc(var(--rad)*.6);padding:0 6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}.fx-crumb::-webkit-scrollbar{display:none}
.fx-crumb a{padding:2px 6px;border-radius:4px;cursor:pointer}.fx-crumb a:hover{background:var(--p3)}.fx-crumb i{color:var(--ink2);font-style:normal;font-size:11px}
.fx-list{flex:1;overflow:auto;position:relative;min-height:0;outline:none;background:var(--p1)}
.fx-head{display:flex;position:sticky;top:0;z-index:6;background:var(--p2);border-bottom:1px solid var(--line);min-width:100%;width:max-content;font-size:12.5px;color:var(--ink2)}
.fx-hc{position:relative;padding:5px 10px;flex:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}.fx-hc:hover{color:var(--ink);background:var(--p3)}.fx-hc b{position:absolute;right:-4px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:2;touch-action:none}.fx-hc em{font-style:normal;color:var(--acc);margin-left:4px}
.fx-rows{width:max-content;padding-bottom:40px}.fx-head{padding-left:4px}.win:focus{outline:none}
body.bar-top.bar-hide:not(.bar-show) #bar:not(:hover){transform:translateY(calc(-100% + 4px))}body.bar-top.bar-hide #desk,body.bar-top.bar-hide #wins{top:4px;bottom:0}
.fx-row{display:flex;width:max-content;height:30px;align-items:center;border-radius:4px;cursor:pointer;margin:1px 0 1px 4px}.fx-row:hover{background:var(--p2)}.fx-row.sel{background:var(--selbg);box-shadow:inset 3px 0 var(--acc)}.fx-row.over{outline:1px dashed var(--acc)}.fx-row.cut{opacity:.45}
.fx-c{flex:none;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--ink2)}.fx-c.n{color:var(--ink);display:flex;align-items:center;gap:7px}.fx-c.n svg,.fx-c.n img{width:20px;height:20px;flex:none;object-fit:cover;border-radius:2px}.fx-c.n span{overflow:hidden;text-overflow:ellipsis}.fx-c.m,.fx-c.s{font-family:var(--fm);font-size:12px}
.fx-grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:8px 8px 50px}
.fx-tile{width:104px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:7px;border:1px solid transparent;cursor:pointer}.fx-tile:hover{background:var(--p2)}.fx-tile.sel{background:var(--selbg);border-color:var(--acc)}.fx-tile.over{outline:1px dashed var(--acc)}.fx-tile.cut{opacity:.45}
.fx-tile .th{width:60px;height:60px;display:grid;place-items:center;pointer-events:none}.fx-tile .th svg{width:52px;height:52px}.fx-tile .th img{max-width:60px;max-height:60px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.fx-tile span{font-size:12px;line-height:1.25;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
