        case'pwd':print(esc(dir));break;
        case'ls':{const list=await fs.readdir(resolveP(args[0]));
          print(list.map(x=>x.dir?`<span class="t-dir">${esc(x.name)}/</span>`:esc(x.name)).join('  ')||'(空)');break}
        case'cd':{const p=resolveP(args[0]||'/');const st=await fs.stat(p);
          if(!st.dir)print('不是目录: '+esc(p),'t-err');else dir=p;break}
        case'cat':{if(!args[0])throw new Error('用法: cat <文件>');print(esc(await fs.readText(resolveP(args[0]))));break}
        case'mkdir':{if(!args[0])throw new Error('用法: mkdir <名>');await fs.mkdir(resolveP(args[0]));print('已创建');break}
        case'touch':{if(!args[0])throw new Error('用法: touch <名>');await fs.writeText(resolveP(args[0]),'');print('已创建');break}
        case'rm':{if(!args[0])throw new Error('用法: rm <路径>');await fs.remove(resolveP(args[0]));print('已删除');break}
        case'mv':{if(args.length<2)throw new Error('用法: mv <源> <目标目录>');
          const src=resolveP(args[0]);await fs.move(src,await fs.uniquePath(resolveP(args[1]),baseName(src)));print('已移动');break}
        case'cp':{if(args.length<2)throw new Error('用法: cp <源> <目标目录>');
          const src=resolveP(args[0]);await fs.copy(src,await fs.uniquePath(resolveP(args[1]),baseName(src)));print('已复制');break}
        case'echo':{const gt=args.indexOf('>');
          if(gt>=0){await fs.writeText(resolveP(args[gt+1]),args.slice(0,gt).join(' '));print('已写入')}
          else print(esc(args.join(' ')));break}
        case'du':{const p=resolveP(args[0]);print(fmtSize(await fs.du(p)));break}
        case'stat':{const p=resolveP(args[0]);const st=await fs.stat(p);
          print(`${esc(p)}\n类型: ${st.dir?'目录':'文件'}  大小: ${fmtSize(st.dir?await fs.du(p):st.size)}\n修改: ${fmtDate(st.mtime)}  创建: ${fmtDate(st.ctime)}`);break}
        case'open':{if(!args[0])throw new Error('用法: open <路径>');openPath(resolveP(args[0]));break}
        case'zip':{if(!args[0])throw new Error('用法: zip <路径>');await compressPaths([resolveP(args[0])],dir);print('已压缩');break}
        case'clear':$$('.t-line',root).forEach(x=>x!==inputLine&&x.remove());break;
        case'date':print(new Date().toLocaleString('zh-CN'));break;
        case'neofetch':print(`<span class="t-prompt">      /\\      </span>  琥珀 OS v1.0\n<span class="t-prompt">     /  \\     </span>  内核: WebKit/Blink\n<span class="t-prompt">    / /\\ \\    </span>  存储: ${esc(fs.default?.label||'—')}\n<span class="t-prompt">   / ____ \\   </span>  分辨率: ${innerWidth}×${innerHeight}\n<span class="t-prompt">  /_/    \\_\\  </span>  主题: ${Settings.get('theme')}`);break;
        default:print(`未知命令: ${esc(cmd)}（输入 help 查看帮助）`,'t-err');
      }
    }catch(e){print(esc(e.message),'t-err')}
  }
  root.appendChild(inputLine);
  print(`<span class="t-prompt">琥珀 OS 终端</span> — 输入 help 查看命令`);
  prompt();
  root.addEventListener('click',e=>{if(!e.target.closest('input'))$('input',inputLine)?.focus()});
  return W;
}

let _jszip=null;
async function ensureJSZip(){if(_jszip)return _jszip;
  await loadScript('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
  if(!window.JSZip)throw new Error('JSZip 加载失败');_jszip=window.JSZip;return _jszip}
// JSZip 把 DOS 时间按 UTC 解析 → 转回本地时间
function zipDateFix(d){return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()).getTime()}
// 压缩时反向偏移，保证 zip 内记录的是原始本地修改时间
function zipDatePack(t){const d=new Date(t);return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds()))}
function parseTar(buf){
  const u=new Uint8Array(buf);const out=[];let off=0,longName=null;
  const str=(a,b)=>{let s='';for(let i=a;i<b&&u[i];i++)s+=String.fromCharCode(u[i]);return s};
  while(off+512<=u.length){
    const name=str(off,off+100);if(!name){off+=512;continue}
    const size=parseInt(str(off+124,off+136).trim()||'0',8)||0;
    const type=String.fromCharCode(u[off+156]||48);
    const prefix=str(off+345,off+500);
    const dataStart=off+512;
    if(type==='L'){longName=str(dataStart,dataStart+size).replace(/\0+$/,'')}
    else{
      const full=(longName||((prefix?prefix+'/':'')+name)).replace(/\/+$/,'');longName=null;
      if(type==='5'||name.endsWith('/'))out.push({name:full,dir:true,data:null,mtime:parseInt(str(off+136,off+148).trim()||'0',8)*1000||Date.now()});
      else if(type==='0'||type==='\0'||type==='7')out.push({name:full,dir:false,data:u.slice(dataStart,dataStart+size),mtime:parseInt(str(off+136,off+148).trim()||'0',8)*1000||Date.now()});
    }
    off=dataStart+Math.ceil(size/512)*512;
  }
  return out;
}
async function gunzip(buf){

  return new Response(stream).arrayBuffer();
}
async function readArchiveEntries(path){
  const e=extOf(path);const blob=await fs.read(path);const buf=await blob.arrayBuffer();
  if(ARCH_EXTS.has(e)){
    const JSZip=await ensureJSZip();const zip=await JSZip.loadAsync(buf);
    return Object.values(zip.files).map(f=>({name:f.name.replace(/\/+$/,''),dir:f.dir,size:f._data?.uncompressedSize||0,mtime:zipDateFix(f.date),_z:f}));
  }
  if(e==='tar')return parseTar(buf).map(x=>({...x,size:x.data?.length||0,_raw:x.data}));
  if(e==='gz'||e==='tgz'){
    const raw=await gunzip(buf);
    if(e==='tgz'||path.toLowerCase().endsWith('.tar.gz'))return parseTar(raw).map(x=>({...x,size:x.data?.length||0,_raw:x.data}));
    const name=baseName(path).replace(/\.gz$/i,'');
    return[{name,dir:false,size:raw.byteLength,mtime:Date.now(),_raw:raw}];

let _7z=null;
async function ensure7z(){
  if(_7z)return _7z;
  let mod,base;
  for(const m of ['https://cdn.jsdelivr.net','https://fastly.jsdelivr.net','https://gcore.jsdelivr.net']){
    try{base=m;mod=await import(m+'/npm/7z-wasm@1.2.0/7zz.es6.min.js');break}catch(e){mod=null}
  }
  if(!mod)throw new Error('7z-wasm CDN 加载失败');
  _7z=await mod.default({locateFile:f=>base+'/npm/7z-wasm@1.2.0/'+f});
  return _7z;
}
async function sevenZExtractBuf(buf){
  const z=await ensure7z();
  try{z.FS.unlink('a.7z')}catch(e){}
  z.FS.writeFile('a.7z',new Uint8Array(buf));
  try{z.FS.mkdir('/out')}catch(e){}
  z.callMain(['x','a.7z','-o/out','-y']);
  const out=[];
  const walk=(dir,rel)=>{for(const n of z.FS.readdir(dir)){if(n==='.'||n==='..')continue;
    const full=dir+'/'+n;const st=z.FS.stat(full);const rp=rel?rel+'/'+n:n;
    if(z.FS.isDir(st.mode))out.push({name:rp,dir:true,size:0,mtime:st.mtime||Date.now()});
    else out.push({name:rp,dir:false,size:st.size,mtime:st.mtime||Date.now(),_raw:z.FS.readFile(full)})}};
  walk('/out','');
  return out;
}
async function sevenZList(buf){return sevenZExtractBuf(buf)}
async function extractArchive(path,destDir){
  const t=toast('正在解压 '+baseName(path)+' …','',120000);
  try{
    const e=extOf(path);let entries;
    if(e==='7z'){const blob=await fs.read(path);entries=await sevenZExtractBuf(await blob.arrayBuffer())}
    else entries=await readArchiveEntries(path);
    const folderName=baseName(path).replace(/\.(zip|jar|apk|epub|cbz|docx|xlsx|pptx|tar\.gz|tgz|tar|gz|7z)$/i,'');
    const target=await fs.uniquePath(destDir,folderName);
    await fs.mkdir(target);
    // 先建目录再写文件
    for(const en of entries){if(en.dir)await fs.mkdir(joinPath(target,en.name)).catch(()=>{})}
    let n=0;
    for(const en of entries){
      if(en.dir)continue;
      const p=joinPath(target,en.name);
      await fs.mkdir(dirName(p)).catch(()=>{});
      let data;
      if(en._z)data=await en._z.async('blob');
      else if(en._raw)data=new Blob([en._raw]);
      else continue;
      await fs.write(p,data,en.mtime||Date.now());n++;
    }
    t.remove();toast(`解压完成：${n} 个文件 → ${target}`,'ok');fs.bump();
  }catch(err){t.remove();toast('解压失败: '+err.message,'err',6000)}
}
async function compressPaths(paths,destDir){
  const t=toast('正在压缩…','',120000);
  try{
    const JSZip=await ensureJSZip();const zip=new JSZip();
    const add=async(p,rel)=>{
      const st=await fs.stat(p);
      if(st.dir){const kids=await fs.readdir(p);for(const k of kids)await add(joinPath(p,k.name),rel+'/'+k.name)}
      else{const blob=await fs.read(p);zip.file(rel,blob,{date:zipDatePack(st.mtime)})}
    };
    for(const p of paths)await add(p,baseName(p));
    const out=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    const name=(paths.length===1?baseName(paths[0]):'归档')+'.zip';
    const target=await fs.uniquePath(destDir,name);
    await fs.write(target,out);
    t.remove();toast('已压缩 → '+target,'ok');fs.bump();
  }catch(err){t.remove();toast('压缩失败: '+err.message,'err',6000)}
}

    const blob=await fs.read(p);const buffer=await blob.arrayBuffer();

  };
  $('[data-a=local]',root).onclick=async()=>{
    const files=await pickFiles('.iso,.img,.bin,.fda');if(!files[0])return;
    boot({name:files[0].name,buffer:await files[0].arrayBuffer()});
  };
  $('[data-a=restart]',root).onclick=()=>{if(emu){try{emu.restart()}catch(e){boot(bootOpts)}}else boot(null)};
  $('[data-a=lock]',root).onclick=()=>{
    const cv=$('canvas',holder);
    try{if(emu&&emu.lock_mouse)emu.lock_mouse();else if(cv&&cv.requestPointerLock)cv.requestPointerLock();
      toast('鼠标已锁定，按 Esc 释放','ok')}catch(e){toast('鼠标锁定失败','err')}
  };
  holder.addEventListener('click',()=>{const cv=$('canvas',holder);
    if(cv&&cv.style.display!=='none'&&document.pointerLockElement!==cv){try{cv.requestPointerLock()}catch(e){}}});
  $('[data-a=fs]',root).onclick=()=>{if(W.el.classList.contains('fullscreen-app'))W.exitFullscreenApp();else W.enterFullscreenApp()};
  W.onClose=()=>{if(emu){try{emu.stop()}catch(e){}emu=null}};
  boot(null);
  return W;
}
// 从 VFS 选择镜像（浏览目录对话框，过滤镜像扩展名）
function pickVfsImage(){
  return new Promise(res=>{
    const ov=el('div','modal-overlay');const box=el('div','modal-box');box.style.width='460px';
    box.innerHTML=`<div class="mb-title">选择镜像文件</div><div class="mb-body" style="max-height:55vh"></div><div class="mb-actions"><button class="btn" data-a="c">取消</button></div>`;
    const body=$('.mb-body',box);let cur='/';
    const draw=async()=>{
      body.innerHTML=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><button class="btn sm" data-up>${ICONS.up}</button><b style="font-size:12px;word-break:break-all">${esc(cur)}</b></div><div style="display:flex;flex-direction:column;gap:3px" class="md-list"></div>`;
      $('[data-up]',body).onclick=()=>{cur=dirName(cur);draw()};
      const list=$('.md-list',body);
      try{const kids=await fs.readdir(cur);
        for(const k of kids){const p=joinPath(cur,k.name);
          if(k.dir){const b=el('button','btn sm',`${ICONS.folder}<span>${esc(k.name)}</span>`);b.style.justifyContent='flex-start';
            b.onclick=()=>{cur=p;draw()};list.appendChild(b)}
          else if(['iso','img','bin','fda'].includes(extOf(k.name))){
            const b=el('button','btn sm',`${ICONS.disk}<span>${esc(k.name)}</span><span style="margin-left:auto;color:var(--text-3);font-size:11px">${fmtSize(k.size)}</span>`);
            b.style.justifyContent='flex-start';b.onclick=()=>{ov.remove();res(p)};list.appendChild(b)}}
        if(!list.children.length)list.innerHTML='<div style="color:var(--text-3);font-size:12px;padding:8px">此目录没有镜像或子文件夹</div>';
      }catch(e){list.innerHTML=`<div style="color:var(--danger)">${esc(e.message)}</div>`}
    };
    $('[data-a=c]',box).onclick=()=>{ov.remove();res(null)};
    ov.appendChild(box);$('#modal-root').appendChild(ov);draw();
  });
}
// ============ 设置 ============
function openSettings(section){
  const root=el('div','settings');
  root.innerHTML=`<div class="set-nav"></div><div class="set-body"></div>`;
  const W=WM.create({app:'settings',title:'设置',icon:ICONS.settings,w:820,h:580,content:root});
  const nav=$('.set-nav',root),body=$('.set-body',root);
  const sections=[['外观',ICONS.wallpaper],['桌面与任务栏',ICONS.grid],['存储',ICONS.disk],['系统',ICONS.settings]];
  let cur=section&&sections.some(s=>s[0]===section)?section:'外观';
  function drawNav(){nav.innerHTML='';for(const[n,ic]of sections){
    const b=el('button','set-nav-item'+(cur===n?' active':''),`${ic}<span>${n}</span>`);
    b.onclick=()=>{cur=n;drawNav();draw()};nav.appendChild(b)}}
  const row=(label,sub,ctrl)=>{const r=el('div','set-row');
    r.innerHTML=`<div><div class="sr-label">${label}</div>${sub?`<div class="sr-sub">${sub}</div>`:''}</div>`;
    r.appendChild(ctrl);return r};
  const sw=(key,cb)=>{const s=el('button','switch'+(Settings.get(key)?' on':''));
    s.onclick=()=>{Settings.set(key,!Settings.get(key));s.classList.toggle('on',Settings.get(key));cb&&cb()};return s};
  const range=(key,min,max,unit,cb)=>{const w=el('div','range-row');
    w.innerHTML=`<input type="range" min="${min}" max="${max}" value="${Settings.get(key)}"><span class="rv">${Settings.get(key)}${unit}</span>`;
    const inp=$('input',w);inp.oninput=()=>{Settings.set(key,+inp.value);$('.rv',w).textContent=inp.value+unit;cb&&cb()};return w};
  function draw(){
    body.innerHTML='';
    if(cur==='外观'){
      body.innerHTML=`<h3>外观</h3><div class="set-desc">主题、强调色与视觉风格</div>`;
      const c1=el('div','set-card');
      const themeSel=el('select','app-select');themeSel.innerHTML='<option value="dark">深色（默认）</option><option value="light">浅色</option>';
      themeSel.value=Settings.get('theme');themeSel.onchange=()=>Settings.set('theme',themeSel.value);
      c1.appendChild(row('主题模式','深色为琥珀暗夜，浅色为暖纸',themeSel));
      const dots=el('div','color-dots');
      ['#f5a623','#ff7847','#7dd87d','#6db3f2','#c678dd','#e06c9f','#56b6c2','#e5c07b'].forEach(c=>{
        const d=el('button','color-dot'+(Settings.get('accent')===c?' active':''));d.style.background=c;
        d.onclick=()=>{Settings.set('accent',c);$$('.color-dot',dots).forEach(x=>x.classList.remove('active'));d.classList.add('active')};
        dots.appendChild(d)});
      c1.appendChild(row('主题色','',dots));
      c1.appendChild(row('窗口圆角','0 为直角',range('radius',0,20,'px')));
      c1.appendChild(row('界面字号','',range('fontSize',12,18,'px')));
      c1.appendChild(row('毛玻璃效果','关闭可提升低端设备性能',sw('glass')));
      body.appendChild(c1);
      const c2=el('div','set-card');
      c2.innerHTML=`<div class="sr-label" style="margin-bottom:10px">壁纸</div>`;
      const grid=el('div','wp-grid');
      for(const wp of WALLPAPERS){
        const t=el('div','wp-thumb'+(Settings.get('wallpaper')===wp.id?' active':''));
        t.style.backgroundImage=`url("${wp.url}")`;t.title=wp.name;
        t.onclick=()=>{Settings.set('wallpaper',wp.id);applyWallpaper();$$('.wp-thumb',grid).forEach(x=>x.classList.remove('active'));t.classList.add('active')};
        grid.appendChild(t);
      }
      const up=el('div','wp-thumb');up.style.cssText='display:flex;align-items:center;justify-content:center;background:var(--bg-4);border:1px dashed var(--border-2)';
      up.innerHTML=`<div style="text-align:center;color:var(--text-3);font-size:11px">${ICONS.upload}<div>上传壁纸</div></div>`;
      up.onclick=()=>$('#hidden-wallpaper').click();
      grid.appendChild(up);c2.appendChild(grid);body.appendChild(c2);
    }
    else if(cur==='桌面与任务栏'){
      body.innerHTML=`<h3>桌面与任务栏</h3><div class="set-desc">控制桌面元素的可见性</div>`;
      const c=el('div','set-card');
      c.appendChild(row('显示系统应用图标','关闭后桌面仅显示个人文件',sw('showSysApps',refreshDesktop)));
      c.appendChild(row('显示任务栏','隐藏后仍可通过右键桌面进入设置',sw('showTaskbar')));
      c.appendChild(row('显示桌面图标','',sw('showDesktopIcons')));
      c.appendChild(row('12 小时制时钟','关闭则使用 24 小时制',sw('h12',tickClock)));
      body.appendChild(c);
      const c2=el('div','set-card');c2.innerHTML='<div class="sr-label" style="margin-bottom:6px">隐藏指定应用</div><div class="set-desc" style="margin-bottom:8px">被隐藏的应用不会出现在桌面与开始菜单</div>';
      for(const a of Object.values(APPS)){
        const s=el('button','switch'+(Settings.get('hidden_'+a.id)?' on':''));
        s.onclick=()=>{Settings.set('hidden_'+a.id,!Settings.get('hidden_'+a.id));s.classList.toggle('on');refreshDesktop()};
        c2.appendChild(row(a.name,'',s));
      }
      body.appendChild(c2);
    }
    else if(cur==='存储'){
      body.innerHTML=`<h3>存储</h3><div class="set-desc">双后端虚拟文件系统 · 数据保存在浏览器本地</div>`;
      const c=el('div','set-card');
      const sel=el('select','app-select');
      sel.innerHTML=Object.entries(fs.backends).map(([id,b])=>`<option value="${id}">${b.label}</option>`).join('');
      sel.value=fs.default.id;
      sel.onchange=async()=>{Settings.set('backend',sel.value);fs.pickDefault();fs.bump();
        await seedDefaults();refreshDesktop();toast('默认存储已切换为 '+fs.default.label,'ok');draw()};
      c.appendChild(row('默认存储后端','新文件默认写入的位置；两个后端都可在文件管理器中访问',sel));
      body.appendChild(c);
      const c2=el('div','set-card');c2.innerHTML='<div class="sr-label">容量占用</div><div class="storage-usage"><div class="loading-pane" style="position:static;padding:20px"><div class="spinner"></div>统计中…</div></div>';
      body.appendChild(c2);
      (async()=>{
        const u=await fs.usage();
        const wrap=$('.storage-usage',c2);
        const colors=['#f5a623','#6db3f2','#7dd87d','#c678dd','#e06c9f'];
        const entries=Object.entries(u.backends);
        let totalFs=entries.reduce((s,[,v])=>s+v.size,0);
        const other=Math.max(0,u.usage-totalFs);
        const denom=Math.max(u.quota,totalFs+other,1);
        let bar='<div class="storage-bar">',legend='<div class="storage-legend">';
        entries.forEach(([id,v],i)=>{const pct=v.size/denom*100;
          bar+=`<i style="width:${pct}%;background:${colors[i%5]}" title="${v.label}"></i>`;
          legend+=`<span><b style="background:${colors[i%5]}"></b>${v.label} ${fmtSize(v.size)}</span>`});
        bar+=`<i style="width:${other/denom*100}%;background:var(--border-2)" title="浏览器其他数据"></i></div>`;
        legend+=`<span><b style="background:var(--border-2)"></b>其他 ${fmtSize(other)}</span><span style="margin-left:auto">总配额 ${fmtSize(u.quota)} · 已用 ${fmtSize(u.usage)}（${(u.usage/denom*100).toFixed(1)}%）</span></div>`;
        // 默认后端顶层目录明细
        let detail='<div style="margin-top:14px;font-size:12px;color:var(--text-2)">默认后端目录明细：</div><div class="dir-detail" style="font-size:12px;font-family:var(--font-mono);color:var(--text-2);margin-top:6px">计算中…</div>';
        wrap.innerHTML=bar+legend+detail;
        try{
          const kids=(await fs.readdir('/')).filter(x=>x.dir&&!x.virtual);
          const rows=[];
          for(const k of kids){const s=await fs.du(joinPath('/',k.name));rows.push([k.name,s])}
          rows.sort((a,b)=>b[1]-a[1]);
          const mx=Math.max(...rows.map(r=>r[1]),1);
          $('.dir-detail',wrap).innerHTML=rows.map(([n,s],i)=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0"><span style="width:90px;overflow:hidden;text-overflow:ellipsis">${esc(n)}</span><span style="flex:1;height:8px;background:var(--bg-4);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${s/mx*100}%;background:${colors[i%5]}"></i></span><span style="width:70px;text-align:right">${fmtSize(s)}</span></div>`).join('')||'（空）';
        }catch(e){$('.dir-detail',wrap).textContent='统计失败'}
      })();
      const c3=el('div','set-card');
      c3.innerHTML='<div class="sr-label" style="margin-bottom:8px">本地挂载</div>';
      if(fs.mounts.size||fs.pendingMounts.length){
        for(const[n]of fs.mounts)c3.appendChild(row(n,'已挂载',(()=>{const b=el('button','btn sm','卸载');b.onclick=async()=>{await fs.unmount(n);draw()};return b})()));
        for(const pm of fs.pendingMounts)c3.appendChild(row(pm.name,'待重新授权',(()=>{const b=el('button','btn sm','授权');b.onclick=async()=>{await fs.regrant(pm.name);draw()};return b})()));
      }else c3.appendChild(el('div','set-desc','尚未挂载本地文件夹（文件管理器 → 挂载本地文件夹）'));
      body.appendChild(c3);
      const c4=el('div','set-card');
      const rb=el('button','btn danger','一键重置系统');
      rb.onclick=async()=>{
        if(await confirmBox('一键重置','将清空所有虚拟文件、挂载记录与桌面布局，并恢复出厂状态。此操作不可恢复！',true)){
          await fs.resetAll();Settings.set('iconPos',{});await seedDefaults();refreshDesktop();applyWallpaper();toast('系统已重置','ok');draw()}};
      c4.appendChild(row('重置虚拟文件系统','清除 OPFS 与 IndexedDB 中的全部文件',rb));
      body.appendChild(c4);
    }
    else{
      body.innerHTML=`<h3>系统</h3><div class="set-desc">关于琥珀 OS</div>`;
      const c=el('div','set-card');
      c.appendChild(row('系统版本','琥珀 OS · AMBER v1.0（单文件 Web OS）',el('span','', '')));
      c.appendChild(row('存储引擎',Object.values(fs.backends).map(b=>b.label).join(' + ')||'—',el('span','','')));
      c.appendChild(row('屏幕',`${innerWidth} × ${innerHeight} · ${isTouch?'触摸':'指针'}设备`,el('span','','')));
      const fsb=el('button','btn sm','切换全屏');fsb.onclick=toggleFullscreen;
      c.appendChild(row('全屏模式','',fsb));
      const eip=el('select','app-select');eip.innerHTML='<option value="auto">自动</option><option value="textarea">电脑</option><option value="contenteditable">手机</option>';
      eip.value=Settings.get('editorInput');eip.onchange=()=>Settings.set('editorInput',eip.value);
      c.appendChild(row('编辑器默认输入模式','影响 HTML 编辑器的文本选择与输入法体验',eip));
      body.appendChild(c);
      const c2=el('div','set-card');
      const sb=el('button','btn sm','持久化存储授权');
      sb.onclick=async()=>{try{const ok=await navigator.storage.persist();toast(ok?'已获得持久化存储授权，数据不会被浏览器自动清理':'浏览器未授予持久化（数据仍会保留，但极端情况下可能被清理）',ok?'ok':'')}catch(e){toast('请求失败','err')}};
      c2.appendChild(row('申请持久化存储','防止浏览器在空间不足时自动清理本站数据',sb));
      body.appendChild(c2);
    }
  }
  drawNav();draw();
  return W;
}

async function boot(){
  try{
    Settings.applyAll();
    setupTaskbar();tickClock();
    await fs.init();
    await seedDefaults();
    await applyWallpaper();
    setupDesktopCtx();setupDesktopImport();
    await refreshDesktop();
    fsEvents.on(debounce(()=>refreshDesktop(),400));
    // 首次提示持久化
    if(navigator.storage?.persist&&!Settings.get('persistAsked')){
      Settings.set('persistAsked',true);
      navigator.storage.persist().catch(()=>{});
    }
  }catch(e){
    console.error(e);
    const be=$('#boot-error');be.hidden=false;
    be.innerHTML=`<div><b>系统启动失败</b><br>${esc(e.message)}<br><br>请使用较新版本的 Chrome / Edge / Firefox / Safari 打开本页面。</div>`;
  }
}
boot();
