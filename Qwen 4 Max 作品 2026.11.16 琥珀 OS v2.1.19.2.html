<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>琥珀 OS · AMBER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#f5a623; --accent-2:#ff7847; --accent-dim:rgba(245,166,35,.16);
  --bg:#101014; --bg-2:#16161c; --bg-3:#1d1d25; --bg-4:#26262f;
  --surface:rgba(22,22,28,.86); --surface-solid:#16161c;
  --border:#2c2c36; --border-2:#3a3a46;
  --text:#e8e4da; --text-2:#a8a49a; --text-3:#6d6a62;
  --danger:#ff5c5c; --ok:#7dd87d; --info:#6db3f2;
  --radius:10px; --win-radius:var(--radius);
  --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4);
  --font-ui:'Chakra Petch','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,'PingFang SC',monospace;
  --tb-h:46px; --title-h:38px;
  --glass-blur:18px;
}
[data-theme="light"]{
  --bg:#ece7dd; --bg-2:#f4f0e8; --bg-3:#fbf8f2; --bg-4:#ffffff;
  --surface:rgba(250,247,240,.88); --surface-solid:#f7f3eb;
  --border:#d8d2c4; --border-2:#c4bdae;
  --text:#26231c; --text-2:#5d584c; --text-3:#948d7d;
  --accent:#c47b12; --accent-2:#d95f2b; --accent-dim:rgba(196,123,18,.14);
  --shadow:0 18px 44px rgba(60,50,30,.22),0 2px 8px rgba(60,50,30,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:14px;user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable],.cm-editor,.CodeMirror,.selectable{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
svg.ic{width:18px;height:18px;flex:none;display:block}
#boot-error{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--danger);font-size:16px;line-height:1.8}
#boot-error[hidden]{display:none}
/* desktop */
#desktop{position:fixed;inset:0;bottom:var(--tb-h);overflow:hidden}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s}
#wallpaper::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,transparent 40%,rgba(0,0,0,.25));pointer-events:none}
[data-theme="light"] #wallpaper::after{background:radial-gradient(ellipse at 50% 120%,transparent 40%,rgba(255,255,255,.15))}
#icon-layer{position:absolute;inset:0}
.dicon{position:absolute;width:88px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s,box-shadow .12s;touch-action:none}
.dicon:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.09)}
[data-theme="light"] .dicon:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.08)}
.dicon.selected{background:var(--accent-dim);border-color:var(--accent)}
.dicon.dragging{opacity:.35}
.dicon .di-img{width:46px;height:46px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.dicon .di-img svg{width:44px;height:44px}
.dicon .di-img img{width:46px;height:46px;object-fit:cover;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.dicon .di-label{font-size:12px;line-height:1.3;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.dicon.drop-target{background:var(--accent-dim);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-dim);pointer-events:none;z-index:50;border-radius:2px}
/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:9000;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--surface);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-top:1px solid var(--border)}
.tb-btn{height:38px;min-width:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .12s}
.tb-btn:hover{background:var(--bg-4)}
#start-btn svg{width:22px;height:22px}
#start-btn.active{background:var(--accent-dim)}
#tb-apps{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;height:100%;align-items:center}
#tb-apps::-webkit-scrollbar{display:none}
.tb-app{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:8px;background:var(--bg-3);border:1px solid var(--border);position:relative;max-width:170px;flex:none;transition:background .12s}
.tb-app:hover{background:var(--bg-4)}
.tb-app .tba-label{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-app::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:2.5px;border-radius:2px;background:var(--text-3);transition:all .2s}
.tb-app.focused::after{background:var(--accent);width:22px}
.tb-app.minimized{opacity:.6}
.tb-app.minimized::after{width:6px}
#tb-tray{display:flex;align-items:center;gap:2px;height:100%}
#peek-strip{width:8px;height:100%;border-left:1px solid var(--border);border-radius:0}
#peek-strip:hover{background:var(--accent-dim)}
#clock-btn{height:38px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 10px;border-radius:8px;line-height:1.25}
#clock-btn:hover{background:var(--bg-4)}
#clock-time{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#clock-date{font-size:10.5px;color:var(--text-2)}
/* start menu */
#start-menu{position:fixed;left:8px;bottom:calc(var(--tb-h) + 8px);width:460px;max-width:calc(100vw - 16px);max-height:min(600px,calc(100vh - var(--tb-h) - 20px));z-index:9500;background:var(--surface);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border-2);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pop-in .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#start-menu .sm-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
#start-menu .sm-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
#start-menu .sm-search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13px}
#start-menu .sm-grid{flex:1;overflow-y:auto;padding:6px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:10px;transition:background .12s;text-align:center}
.sm-app:hover{background:var(--bg-4)}
.sm-app svg{width:34px;height:34px}
.sm-app span{font-size:12px;color:var(--text-2)}
#start-menu .sm-foot{border-top:1px solid var(--border);padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
#start-menu .sm-foot .sm-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.sm-icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.sm-icon-btn:hover{background:var(--bg-4)}
/* calendar */
#calendar-pop{position:fixed;right:8px;bottom:calc(var(--tb-h) + 8px);width:300px;z-index:9500;background:var(--surface);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border-2);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow);padding:16px;animation:pop-in .18s cubic-bezier(.2,.9,.3,1.2)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:14px}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--bg-4)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .cal-dow{font-size:11px;color:var(--text-3);padding:4px 0}
.cal-grid .cal-day{font-size:12.5px;padding:7px 0;border-radius:6px;font-variant-numeric:tabular-nums}
.cal-grid .cal-day.other{color:var(--text-3);opacity:.5}
.cal-grid .cal-day.today{background:var(--accent);color:#14100a;font-weight:700}
.cal-grid .cal-day:not(.today):hover{background:var(--bg-4)}
/* context menu */
#ctx-menu{position:fixed;z-index:9800;min-width:200px;max-width:280px;background:var(--surface);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;animation:ctx-in .12s ease-out}
@keyframes ctx-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:6px;font-size:13px;text-align:left;color:var(--text)}
.ctx-item:hover{background:var(--accent-dim)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-item .ctx-hint{margin-left:auto;font-size:11px;color:var(--text-3)}
.ctx-sep{height:1px;background:var(--border);margin:5px 8px}
.ctx-label{font-size:11px;color:var(--text-3);padding:6px 12px 3px}
/* modal */
.modal-overlay{position:fixed;inset:0;z-index:9700;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade-in .15s}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface-solid);border:1px solid var(--border-2);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow);width:400px;max-width:100%;max-height:85vh;display:flex;flex-direction:column;animation:pop-in .18s cubic-bezier(.2,.9,.3,1.15)}
.modal-box .mb-title{padding:16px 18px 0;font-size:15px;font-weight:600}
.modal-box .mb-body{padding:14px 18px;font-size:13.5px;color:var(--text-2);line-height:1.6;overflow-y:auto}
.modal-box .mb-body input[type=text]{width:100%;background:var(--bg-3);border:1px solid var(--border-2);border-radius:8px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-top:8px}
.modal-box .mb-body input[type=text]:focus{border-color:var(--accent)}
.modal-box .mb-actions{padding:0 18px 16px;display:flex;justify-content:flex-end;gap:8px}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;background:var(--bg-4);border:1px solid var(--border-2);transition:filter .12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#14100a;border-color:transparent;font-weight:600}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
/* toast */
#toast-root{position:fixed;bottom:calc(var(--tb-h) + 14px);right:14px;z-index:9900;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border-2);border-left:3px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 16px;font-size:13px;max-width:340px;display:flex;gap:10px;align-items:flex-start;animation:toast-in .25s cubic-bezier(.2,.9,.3,1.2)}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast.out{animation:toast-out .25s forwards}
@keyframes toast-in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateX(30px)}}
#drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
/* generic app chrome */
.app-toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--bg-2);flex-wrap:wrap}
.tool-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--text-2);border:1px solid transparent;white-space:nowrap}
.tool-btn:hover{background:var(--bg-4);color:var(--text)}
.tool-btn.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.tool-btn svg.ic{width:15px;height:15px}
.tool-sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex:none}
.app-select{background:var(--bg-3);border:1px solid var(--border-2);color:var(--text);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:12.5px;outline:none}
.app-status{border-top:1px solid var(--border);background:var(--bg-2);padding:4px 12px;font-size:11.5px;color:var(--text-3);display:flex;gap:14px;flex-wrap:wrap;font-family:var(--font-mono)}
.spinner{width:18px;height:18px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-pane{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--bg);color:var(--text-2);font-size:13px;z-index:5}
.empty-hint{padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-hint svg{width:40px;height:40px;opacity:.4}
@media (max-width:760px){
  :root{--tb-h:56px}
  #taskbar{padding:0 4px;gap:2px}
  .tb-app{max-width:52px;padding:0 10px}
  .tb-app .tba-label{display:none}
  #clock-date{display:none}
  #clock-btn{padding:0 6px}
  #start-menu{left:4px;right:4px;width:auto}
  .dicon{width:80px}
  #toast-root{right:8px;left:8px;align-items:stretch}
  .toast{max-width:none}
}
#windows{position:fixed;inset:0;bottom:var(--tb-h);pointer-events:none;z-index:100}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--surface-solid);border:1px solid var(--border-2);border-radius:var(--win-radius);box-shadow:var(--shadow);overflow:hidden;min-width:260px;min-height:160px;animation:win-in .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes win-in{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.window.closing{animation:win-out .16s forwards}
@keyframes win-out{to{opacity:0;transform:scale(.94)}}
.window.minimizing{animation:win-min .22s forwards}
@keyframes win-min{to{opacity:0;transform:translateY(60px) scale(.7)}}
.window.focused{border-color:color-mix(in srgb,var(--accent) 45%,var(--border-2))}
.window.snapped{border-radius:0}
.window.maximized{border-radius:0;border:none}
.window.peek-hidden{opacity:0;pointer-events:none;transition:opacity .15s}
.window.dragging,.window.resizing{transition:none;will-change:left,top,width,height}
.win-title{height:var(--title-h);flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--bg-2);border-bottom:1px solid var(--border);cursor:default;touch-action:none}
.window.focused .win-title{background:var(--bg-3)}
.win-title .wt-icon{display:flex}
.win-title .wt-icon svg{width:16px;height:16px}
.win-title .wt-text{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.win-title .wt-btns{display:flex;gap:2px}
.wt-btn{width:34px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-2)}
.wt-btn:hover{background:var(--bg-4);color:var(--text)}
.wt-btn.close:hover{background:var(--danger);color:#fff}
.wt-btn svg{width:13px;height:13px}
.win-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.win-resize{position:absolute;z-index:10}
.wr-n{top:-3px;left:8px;right:8px;height:7px;cursor:n-resize}
.wr-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:s-resize}
.wr-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:e-resize}
.wr-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:w-resize}
.wr-ne{top:-3px;right:-3px;width:12px;height:12px;cursor:ne-resize}
.wr-nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nw-resize}
.wr-se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:se-resize}
.wr-sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:sw-resize}
.window.maximized .win-resize{display:none}
#snap-preview{position:fixed;z-index:90;background:var(--accent-dim);border:2px solid var(--accent);border-radius:var(--radius);pointer-events:none;transition:all .15s ease-out;backdrop-filter:blur(2px)}
.window.mobile-full{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:none}
.window.mobile-full .win-resize{display:none}
.window.fullscreen-app{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;border:none;z-index:99999!important}
.window.fullscreen-app .win-title{display:none}
.window.fullscreen-app .app-toolbar,.window.fullscreen-app .app-status{display:none}
.fs-exit{position:absolute;top:10px;right:10px;z-index:99;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.25;transition:opacity .2s;border:1px solid rgba(255,255,255,.2)}
.fs-exit:hover{opacity:1}
/* iframe dark shield */
.iframe-shield{position:absolute;inset:0;background:var(--bg);z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text-3);font-size:12px;transition:opacity .3s}
.iframe-shield.gone{opacity:0;pointer-events:none}
/* explorer */
.explorer{display:flex;flex-direction:column;height:100%}
.exp-nav{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg-2);border-bottom:1px solid var(--border)}
.exp-nav .nav-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.exp-nav .nav-btn:hover{background:var(--bg-4);color:var(--text)}
.exp-nav .nav-btn.disabled{opacity:.3;pointer-events:none}
.exp-crumbs{flex:1;display:flex;align-items:center;gap:2px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;overflow-x:auto;scrollbar-width:none;min-width:60px;font-size:12.5px}
.exp-crumbs::-webkit-scrollbar{display:none}
.crumb{padding:2px 6px;border-radius:5px;white-space:nowrap;color:var(--text-2)}
.crumb:hover{background:var(--bg-4);color:var(--text)}
.crumb.current{color:var(--text);font-weight:600}
.crumb-sep{color:var(--text-3);font-size:10px}
.exp-search{display:flex;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;width:170px;flex:none}
.exp-search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-family:inherit;font-size:12.5px}
.exp-main{flex:1;display:flex;overflow:hidden}
.exp-side{width:200px;flex:none;border-right:1px solid var(--border);background:var(--bg-2);overflow-y:auto;padding:8px 6px;font-size:13px}
.side-sec{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;padding:10px 10px 4px}
.side-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--text-2);cursor:pointer;white-space:nowrap;overflow:hidden}
.side-item:hover{background:var(--bg-4);color:var(--text)}
.side-item.active{background:var(--accent-dim);color:var(--accent)}
.side-item svg{width:15px;height:15px;flex:none}
.side-item .si-label{overflow:hidden;text-overflow:ellipsis}
.side-tree-kids{margin-left:14px;border-left:1px solid var(--border);padding-left:4px}
.side-caret{width:14px;height:14px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-3);transition:transform .15s}
.side-caret.open{transform:rotate(90deg)}
.side-caret.leaf{visibility:hidden}
.exp-content{flex:1;position:relative;overflow:auto;background:var(--bg)}
.exp-list-wrap{position:relative;min-height:100%;min-width:100%}
/* details view */
.exp-cols-head{display:flex;position:sticky;top:0;z-index:6;background:var(--bg-2);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-2);width:max-content;min-width:100%}
.exp-col-h{position:relative;padding:7px 10px;display:flex;align-items:center;gap:4px;cursor:pointer;flex:none;overflow:hidden;white-space:nowrap}
.exp-col-h:hover{color:var(--text)}
.exp-col-h .sort-arrow{font-size:9px;color:var(--accent)}
.col-grip{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.col-grip:hover::after,.col-grip.active::after{content:'';position:absolute;left:3px;top:15%;bottom:15%;width:2px;background:var(--accent);border-radius:1px}
.exp-row{display:flex;align-items:center;font-size:13px;border-radius:6px;cursor:default;width:max-content}
.exp-row:hover{background:var(--bg-3)}
.exp-row.selected{background:var(--accent-dim)}
.exp-row.selected:hover{background:color-mix(in srgb,var(--accent-dim) 80%,var(--bg-3))}
.exp-row.drop-target{outline:2px solid var(--accent);outline-offset:-2px}
.exp-row.cut{opacity:.45}
.exp-cell{padding:6px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:none;display:flex;align-items:center;gap:8px}
.exp-cell.c-name{font-weight:500}
.exp-cell.c-name svg{width:18px;height:18px;flex:none}
.exp-cell.c-name img.thumb{width:22px;height:22px;object-fit:cover;border-radius:4px;flex:none}
.exp-cell.c-date,.exp-cell.c-type,.exp-cell.c-size{color:var(--text-2);font-size:12px;font-family:var(--font-mono)}
/* icon view */
.exp-icons{display:flex;flex-wrap:wrap;gap:6px;padding:12px;align-content:flex-start}
.exp-icon-item{width:96px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:9px;border:1px solid transparent;cursor:default}
.exp-icon-item:hover{background:var(--bg-3)}
.exp-icon-item.selected{background:var(--accent-dim);border-color:var(--accent)}
.exp-icon-item.drop-target{outline:2px solid var(--accent)}
.exp-icon-item.cut{opacity:.45}
.exp-icon-item .eii-img{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.exp-icon-item .eii-img svg{width:44px;height:44px}
.exp-icon-item .eii-img img{width:48px;height:48px;object-fit:cover;border-radius:7px}
.exp-icon-item .eii-label{font-size:11.5px;text-align:center;line-height:1.3;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* column view */
.exp-columns{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.exp-column{width:220px;flex:none;border-right:1px solid var(--border);overflow-y:auto;padding:6px 4px}
.exp-col-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;font-size:12.5px;cursor:default;white-space:nowrap}
.exp-col-item:hover{background:var(--bg-3)}
.exp-col-item.selected{background:var(--accent-dim)}
.exp-col-item svg{width:16px;height:16px;flex:none}
.exp-col-item .eci-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.exp-col-item .eci-arrow{color:var(--text-3);font-size:10px}
.exp-status{border-top:1px solid var(--border);background:var(--bg-2);padding:4px 12px;font-size:11.5px;color:var(--text-3);display:flex;gap:14px;align-items:center}
.exp-mobile-bar{display:none}
@media (max-width:760px){
  .exp-side{position:absolute;left:0;top:0;bottom:0;z-index:20;width:230px;box-shadow:var(--shadow);transform:translateX(-100%);transition:transform .2s}
  .exp-side.open{transform:none}
  .exp-search{width:110px}
  .exp-mobile-bar{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);background:var(--bg-2);overflow-x:auto;scrollbar-width:none}
  .exp-cell.c-type{display:none}
}
/* notepad */
.notepad-area{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;padding:14px 16px;font-family:var(--font-mono);line-height:1.65;tab-size:4}
/* sheets */
.sheets-wrap{flex:1;overflow:auto;position:relative}
.sheets-table{border-collapse:collapse;font-size:12.5px;font-family:var(--font-mono)}
.sheets-table td,.sheets-table th{border:1px solid var(--border);padding:5px 10px;min-width:70px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheets-table th{background:var(--bg-3);position:sticky;top:0;z-index:2;color:var(--text-2);font-weight:600}
.sheets-table td:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg-3)}
.sheets-table .rownum{background:var(--bg-2);color:var(--text-3);position:sticky;left:0;text-align:center;min-width:44px}
/* editor */
.editor-split{flex:1;display:flex;overflow:hidden;position:relative}
.editor-split.vertical{flex-direction:column}
.editor-pane{flex:1;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.editor-pane .CodeMirror{flex:1;height:100%!important;font-family:var(--font-mono);font-size:13.5px;line-height:1.6}
.editor-divider{flex:none;background:var(--border);position:relative;z-index:5}
.editor-split:not(.vertical) .editor-divider{width:6px;cursor:col-resize}
.editor-split.vertical .editor-divider{height:6px;cursor:row-resize}
.editor-divider:hover,.editor-divider.active{background:var(--accent)}
.editor-preview{flex:1;border:none;width:100%;height:100%;background:#fff}
.editor-fallback{flex:1;width:100%;background:#1e1e24;color:#e8e4da;border:none;outline:none;resize:none;padding:12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.6}
.cm-findbar{display:flex;gap:6px;padding:6px 10px;background:var(--bg-3);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.cm-findbar input{background:var(--bg);border:1px solid var(--border-2);border-radius:6px;padding:5px 9px;color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none;width:150px}
.cm-findbar input:focus{border-color:var(--accent)}
/* image viewer */
.imgview{flex:1;position:relative;overflow:hidden;background:repeating-conic-gradient(var(--bg-2) 0% 25%,var(--bg) 0% 50%) 0 0/24px 24px;display:flex;align-items:center;justify-content:center;touch-action:none}
.imgview img{max-width:none;transform-origin:center;pointer-events:none;image-rendering:auto}
.imgview-bar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border-2);border-radius:12px;padding:5px;z-index:5;box-shadow:var(--shadow)}
/* manga */
.manga-scroll{flex:1;overflow-y:auto;overflow-x:hidden;background:#000;overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;position:relative;cursor:grab}
.manga-scroll.grabbing{cursor:grabbing}
.manga-inner{display:flex;flex-direction:column;align-items:center;max-width:860px;margin:0 auto;width:100%}
.manga-page{width:100%;display:block;position:relative;background:#0a0a0a}
.manga-page img{width:100%;display:block}
.manga-page .mp-skel{width:100%;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;background:#0a0a0a}
.manga-page .mp-num{position:absolute;top:6px;left:8px;font-size:10px;color:rgba(255,255,255,.35);font-family:var(--font-mono);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px}
.manga-progress{position:absolute;right:4px;top:0;bottom:0;width:3px;z-index:6;pointer-events:none}
.manga-progress i{position:absolute;right:0;width:3px;background:var(--accent);border-radius:2px;opacity:.7}
/* media */
.media-app{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px;padding:20px;position:relative}
.media-app video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
.media-art{width:150px;height:150px;border-radius:16px;background:linear-gradient(135deg,var(--bg-3),var(--bg-4));display:flex;align-items:center;justify-content:center;border:1px solid var(--border-2);box-shadow:var(--shadow)}
.media-art svg{width:64px;height:64px;color:var(--accent)}
.media-art.playing{animation:pulse-art 2s ease-in-out infinite}
@keyframes pulse-art{0%,100%{box-shadow:0 0 0 0 var(--accent-dim)}50%{box-shadow:0 0 0 18px transparent}}
.media-title{font-size:15px;font-weight:600;text-align:center;word-break:break-all}
.media-controls{display:flex;align-items:center;gap:12px;width:100%;max-width:480px}
.media-controls input[type=range]{flex:1;accent-color:var(--accent)}
.media-time{font-size:11px;font-family:var(--font-mono);color:var(--text-2);min-width:86px;text-align:center}
.media-play{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#14100a;display:flex;align-items:center;justify-content:center;flex:none}
.media-play svg{width:22px;height:22px}
/* browser */
.browser-bar{display:flex;gap:5px;padding:6px 8px;background:var(--bg-2);border-bottom:1px solid var(--border);align-items:center}
.browser-url{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid var(--border);border-radius:999px;padding:7px 14px}
.browser-url input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font-mono);font-size:12.5px}
.browser-frame{flex:1;border:none;width:100%;background:#fff}
.browser-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);padding:20px}
.browser-home h2{font-size:22px;letter-spacing:2px;color:var(--accent)}
.browser-home .bh-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bh-link{padding:10px 18px;background:var(--bg-3);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--text-2)}
.bh-link:hover{border-color:var(--accent);color:var(--text)}
/* calculator */
.calc{flex:1;display:flex;flex-direction:column;background:var(--bg);padding:12px;gap:10px}
.calc-display{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:right;min-height:88px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.calc-expr{font-size:13px;color:var(--text-3);font-family:var(--font-mono);min-height:17px;word-break:break-all}
.calc-val{font-size:34px;font-weight:600;font-family:var(--font-mono);word-break:break-all;line-height:1.1}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-key{border-radius:12px;background:var(--bg-3);border:1px solid var(--border);font-size:19px;font-family:var(--font-mono);transition:filter .1s,transform .05s;min-height:44px}
.calc-key:hover{filter:brightness(1.2)}
.calc-key:active{transform:scale(.95)}
.calc-key.op{color:var(--accent);background:var(--bg-2)}
.calc-key.eq{background:var(--accent);color:#14100a;font-weight:700}
.calc-key.fn{color:var(--text-2);font-size:15px}
/* paint */
.paint-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg-2);display:flex;align-items:center;justify-content:center}
.paint-canvas{background:#fff;box-shadow:var(--shadow);touch-action:none;cursor:crosshair}
.paint-colors{display:flex;gap:5px;align-items:center}
.paint-swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;flex:none}
.paint-swatch.active{border-color:var(--text);transform:scale(1.12)}
/* terminal */
.term{flex:1;background:#0c0c10;color:#d8d4c8;font-family:var(--font-mono);font-size:13px;padding:12px;overflow-y:auto;line-height:1.6;cursor:text}
.term .t-line{white-space:pre-wrap;word-break:break-all}
.term .t-prompt{color:var(--accent)}
.term .t-err{color:var(--danger)}
.term .t-dir{color:var(--info)}
.term-input{background:none;border:none;outline:none;color:inherit;font:inherit;width:70%}
/* settings */
.settings{flex:1;display:flex;overflow:hidden}
.set-nav{width:180px;flex:none;border-right:1px solid var(--border);background:var(--bg-2);padding:10px 6px;overflow-y:auto}
.set-nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text-2);width:100%;text-align:left}
.set-nav-item:hover{background:var(--bg-4)}
.set-nav-item.active{background:var(--accent-dim);color:var(--accent)}
.set-body{flex:1;overflow-y:auto;padding:20px 24px}
.set-body h3{font-size:16px;margin-bottom:4px}
.set-body .set-desc{font-size:12.5px;color:var(--text-3);margin-bottom:18px}
.set-card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row .sr-label{font-size:13.5px}
.set-row .sr-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.switch{width:42px;height:24px;border-radius:999px;background:var(--bg-4);border:1px solid var(--border-2);position:relative;transition:background .15s;flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-2);transition:all .15s}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{left:20px;background:#14100a}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{accent-color:var(--accent);width:130px}
.range-row .rv{font-size:12px;font-family:var(--font-mono);color:var(--text-2);min-width:38px;text-align:right}
.color-dots{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;transition:transform .1s}
.color-dot.active{border-color:var(--text);transform:scale(1.15)}
.storage-bar{height:22px;border-radius:7px;overflow:hidden;display:flex;background:var(--bg-4);margin:10px 0 6px}
.storage-bar i{height:100%;transition:width .4s}
.storage-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--text-2)}
.storage-legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wp-thumb{aspect-ratio:16/10;border-radius:9px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.wp-thumb.active{border-color:var(--accent)}
.wp-thumb:hover{filter:brightness(1.1)}
@media (max-width:760px){
  .settings{flex-direction:column}
  .set-nav{width:100%;display:flex;overflow-x:auto;padding:6px;border-right:none;border-bottom:1px solid var(--border);flex:none}
  .set-nav-item{white-space:nowrap;width:auto;padding:8px 12px}
  .set-body{padding:14px}
}
/* v86 */
.v86-screen{flex:1;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.v86-screen>div{white-space:pre;font:14px monospace;line-height:14px;color:#aaa}
.v86-screen canvas{display:block}
/* archive */
.arch-list{flex:1;overflow-y:auto;padding:8px}
.arch-item{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:7px;font-size:12.5px;font-family:var(--font-mono)}
.arch-item:hover{background:var(--bg-3)}
.arch-item .ai-size{margin-left:auto;color:var(--text-3);font-size:11px}
/* pdf */
.pdf-frame{flex:1;border:none;width:100%;background:#333}
/* generic preview text */
.raw-text{flex:1;overflow:auto;padding:14px;font-family:var(--font-mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;color:var(--text-2);user-select:text}
</style>

<body>
<div id="boot-error" hidden></div>
<div id="desktop">
  <div id="wallpaper"></div>
  <div id="icon-layer"></div>
  <div id="marquee-desktop" class="marquee" hidden></div>
</div>
<div id="snap-preview" hidden></div>
<div id="windows"></div>
<div id="taskbar">
  <button id="start-btn" class="tb-btn" title="开始"></button>
  <div id="tb-apps"></div>
  <div id="tb-tray">
    <button id="peek-strip" title="显示桌面"></button>
    <button id="clock-btn"><span id="clock-time"></span><span id="clock-date"></span></button>
  </div>
</div>
<div id="start-menu" hidden></div>
<div id="calendar-pop" hidden></div>
<div id="ctx-menu" hidden></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="drag-ghost" hidden></div>
<input type="file" id="hidden-upload" multiple hidden>
<input type="file" id="hidden-wallpaper" accept="image/*" hidden>
<script>
'use strict';
// ============ 工具 ============
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const isTouch=matchMedia('(pointer:coarse)').matches;
const isMobile=()=>innerWidth<=760;
const natCmp=(a,b)=>a.localeCompare(b,'zh-CN',{numeric:true,sensitivity:'base'});
const fmtSize=n=>{if(n==null)return'—';if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n>=100?0:1)+' '+u[i]};
const fmtDate=t=>{if(!t)return'—';const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const extOf=n=>{const i=n.lastIndexOf('.');return i>0?n.slice(i+1).toLowerCase():''};
const baseName=p=>p.replace(/\/+$/,'').split('/').pop()||'/';
const dirName=p=>{const q=p.replace(/\/+$/,'');const i=q.lastIndexOf('/');return i<=0?'/':q.slice(0,i)};
const joinPath=(a,b)=>(a==='/'?'':a.replace(/\/+$/,''))+'/'+b;
const normPath=p=>{const parts=[];for(const s of String(p).split('/')){if(!s||s==='.')continue;if(s==='..')parts.pop();else parts.push(s)}return'/'+parts.join('/')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fmtTime12(d,h12){let h=d.getHours();const p=n=>String(n).padStart(2,'0');if(!h12)return`${p(h)}:${p(d.getMinutes())}`;const ap=h<12?'上午':'下午';h=h%12||12;return`${ap} ${h}:${p(d.getMinutes())}`}
// 惰性 CDN 加载器（带降级）
const _cdnCache={};
function loadScript(url){if(_cdnCache[url])return _cdnCache[url];_cdnCache[url]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>{delete _cdnCache[url];rej(new Error('CDN 加载失败: '+url))};document.head.appendChild(s)});return _cdnCache[url]}
function loadCSS(url){if($(`link[href="${url}"]`))return;const l=document.createElement('link');l.rel='stylesheet';l.href=url;document.head.appendChild(l)}
// ============ 原创 SVG 图标 ============
const IC=(body,vb='0 0 24 24')=>`<svg class="ic" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;

function fileIcon(name,isDir){
  if(isDir)return ICONS.folder;
  const e=extOf(name);
  if(IMG_EXTS.has(e))return ICONS.fileImage;
  if(AUD_EXTS.has(e))return ICONS.fileAudio;
  if(VID_EXTS.has(e))return ICONS.fileVideo;
  if(ARCH_EXTS.has(e)||e==='gz'||e==='7z'||e==='tar')return ICONS.fileZip;
  if(e==='pdf')return ICONS.filePdf;
  if(e==='csv'||e==='tsv')return ICONS.fileTable;
  if(CODE_EXTS.has(e))return ICONS.fileCode;
  if(TEXT_EXTS.has(e))return ICONS.fileText;
  return ICONS.fileBin;
}

const Settings={
  data:{},
  defaults:{theme:'dark',accent:'#f5a623',radius:10,h12:true,backend:'opfs',showSysApps:true,showTaskbar:true,showDesktopIcons:true,wallpaper:'wp0',iconPos:{},fontSize:14,editorInput:'auto',explorerView:'details',colWidths:{name:260,date:160,type:130,size:100},sortKey:'name',sortAsc:true,animations:true,glass:true},
  load(){
    let raw=null;
    try{raw=localStorage.getItem('amber.settings')}catch(e){}
    if(!raw){const m=document.cookie.match(/(?:^|;\s*)amber_settings=([^;]+)/);if(m)try{raw=decodeURIComponent(m[1])}catch(e){}}
    try{this.data={...this.defaults,...(raw?JSON.parse(raw):{})}}catch(e){this.data={...this.defaults}}
  },
  save(){
    const raw=JSON.stringify(this.data);
    try{localStorage.setItem('amber.settings',raw)}catch(e){}
    try{document.cookie='amber_settings='+encodeURIComponent(raw)+';max-age=31536000;path=/;SameSite=Lax'}catch(e){}
  },
  get(k){return this.data[k]},
  set(k,v){this.data[k]=v;this.save();this.apply(k)},
  apply(k){
    const d=this.data,r=document.documentElement;
    if(!k||k==='theme')r.dataset.theme=d.theme;
    if(!k||k==='accent'){r.style.setProperty('--accent',d.accent);r.style.setProperty('--accent-dim',d.accent+'29')}
    if(!k||k==='radius')r.style.setProperty('--radius',d.radius+'px');
    if(!k||k==='fontSize')r.style.setProperty('font-size',d.fontSize+'px');
    if(!k||k==='glass')r.style.setProperty('--glass-blur',d.glass?'18px':'0px');
    if(!k||k==='showTaskbar')$('#taskbar').style.display=d.showTaskbar?'':'none';
    if(!k||k==='showTaskbar'){document.documentElement.style.setProperty('--tb-h',d.showTaskbar?(isMobile()?'56px':'46px'):'0px')}
    if(!k||k==='animations')r.style.setProperty('--anim',d.animations?'1':'0');
    if(!k||k==='showDesktopIcons')$('#icon-layer').style.display=d.showDesktopIcons?'':'none';
  },
  applyAll(){for(const k of Object.keys(this.defaults))this.apply(k)}
};
Settings.load();

const fsEvents={ls:[],on(f){this.ls.push(f)},emit(){this.ls.forEach(f=>{try{f()}catch(e){}})}};
const MetaDB={
  db:null,
  open(){return new Promise((res,rej)=>{const rq=indexedDB.open('amber-os',1);
    rq.onupgradeneeded=()=>{const db=rq.result;
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');
      if(!db.objectStoreNames.contains('handles'))db.createObjectStore('handles');
      if(!db.objectStoreNames.contains('idbfs')){const s=db.createObjectStore('idbfs',{keyPath:'path'});s.createIndex('parent','parent',{unique:false})}};
    rq.onsuccess=()=>{this.db=rq.result;res()};rq.onerror=()=>rej(rq.error)})},
  tx(store,mode){return this.db.transaction(store,mode).objectStore(store)},
  get(store,key){return new Promise((res,rej)=>{const r=this.tx(store,'readonly').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(store,val,key){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').put(val,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  del(store,key){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  keys(store){return new Promise((res,rej)=>{const r=this.tx(store,'readonly').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  all(store){return new Promise((res,rej)=>{const r=this.tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  byIndex(store,idx,val){return new Promise((res,rej)=>{const r=this.tx(store,'readonly').index(idx).getAll(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  clear(store){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
};
// 元数据（修改日期在移动/重命名后必须保留）
const Meta={
  cache:new Map(),
  key(b,p){return b+':'+p},
  async load(){if(!MetaDB.db)return;const ks=await MetaDB.keys('meta');const vs=await MetaDB.all('meta');ks.forEach((k,i)=>this.cache.set(k,vs[i]))},
  get(b,p){return this.cache.get(this.key(b,p))},
  async set(b,p,m){this.cache.set(this.key(b,p),m);if(MetaDB.db)await MetaDB.put('meta',m,this.key(b,p))},
  async del(b,p){this.cache.delete(this.key(b,p));if(MetaDB.db)await MetaDB.del('meta',this.key(b,p))},
  async moveTree(b,from,to){
    const pre=this.key(b,from),preTo=this.key(b,to);const ops=[];
    for(const[k,v]of this.cache){if(k===pre||k.startsWith(pre+'/')){const nk=preTo+k.slice(pre.length);ops.push([k,nk,v])}}
    for(const[k,nk,v]of ops){this.cache.delete(k);this.cache.set(nk,v);if(MetaDB.db){await MetaDB.del('meta',k);await MetaDB.put('meta',v,nk)}}
  },
  async delTree(b,p){const pre=this.key(b,p);const ks=[...this.cache.keys()].filter(k=>k===pre||k.startsWith(pre+'/'));for(const k of ks){this.cache.delete(k);if(MetaDB.db)await MetaDB.del('meta',k)}}
};
const segs=p=>normPath(p).split('/').filter(Boolean);
// ---- OPFS 后端 ----
class OPFSBackend{
  constructor(){this.id='opfs';this.label='OPFS 存储';this.root=null}
  async init(){this.root=await navigator.storage.getDirectory()}
  async dir(p,create=false){let h=this.root;for(const s of segs(p)){h=await h.getDirectoryHandle(s,{create})}return h}
  async fh(p,create=false){const ss=segs(p);const name=ss.pop();if(!name)throw new Error('路径是目录');const d=await this.dir(ss.join('/'),create);return d.getFileHandle(name,{create})}
  async exists(p){try{await this.stat(p);return true}catch(e){return false}}
  async stat(p){
    if(segs(p).length===0){const m=Meta.get(this.id,'/');return{dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now(),name:'/'}}
    try{const fh=await this.fh(p);const f=await fh.getFile();const m=Meta.get(this.id,normPath(p));
      return{dir:false,size:f.size,mtime:m?.mtime||f.lastModified,ctime:m?.ctime||f.lastModified,name:baseName(p)}}
    catch(e){const d=await this.dir(p);const m=Meta.get(this.id,normPath(p));return{dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now(),name:baseName(p)}}
  }
  async readdir(p){
    const d=await this.dir(p);const out=[];
    for await(const[name,h]of d.entries()){
      const full=joinPath(normPath(p),name);const m=Meta.get(this.id,full);
      if(h.kind==='directory')out.push({name,dir:true,size:0,mtime:m?.mtime||0,ctime:m?.ctime||0});
      else{const f=await h.getFile();out.push({name,dir:false,size:f.size,mtime:m?.mtime||f.lastModified,ctime:m?.ctime||f.lastModified})}
    }
    return out;
  }
  async read(p){const fh=await this.fh(p);return fh.getFile()}
  async write(p,data,mtime){
    const fh=await this.fh(p,true);const w=await fh.createWritable();
    await w.write(data instanceof Blob?data:new Blob([data]));await w.close();
    const np=normPath(p);const old=Meta.get(this.id,np);const f=await fh.getFile();
    await Meta.set(this.id,np,{mtime:mtime||Date.now(),ctime:old?.ctime||Date.now()});return f.size;
  }
  async mkdir(p){await this.dir(p,true);const np=normPath(p);if(!Meta.get(this.id,np))await Meta.set(this.id,np,{mtime:Date.now(),ctime:Date.now()})}
  async remove(p){
    const st=await this.stat(p);const ss=segs(p);const name=ss.pop();const d=await this.dir(ss.join('/'));
    await d.removeEntry(name,{recursive:st.dir});await Meta.delTree(this.id,normPath(p));
  }
  async move(src,dst){ // 同后端内原生 move（保留 File.lastModified），失败回退复制
    const ss=segs(src),name=ss.pop();const d=await this.dir(ss.join('/'));const h=await d.getFileHandle(name).catch(()=>d.getDirectoryHandle(name));
    const dd=segs(dst),dn=dd.pop();const td=await this.dir(dd.join('/'),true);
    if(h.move){await h.move(td,dn)}else{await fs._copyRaw(this,src,this,dst);await this.remove(src)}
    await Meta.moveTree(this.id,normPath(src),normPath(dst));
  }
}
// ---- IndexedDB 后端 ----
class IDBBackend{
  constructor(){this.id='idb';this.label='IndexedDB 存储'}
  async init(){if(!MetaDB.db)throw new Error('IndexedDB 不可用')}
  rec(p){return MetaDB.get('idbfs',normPath(p))}
  async exists(p){if(normPath(p)==='/')return true;return!!(await this.rec(p))}
  async stat(p){const np=normPath(p);if(np==='/')return{dir:true,size:0,mtime:Date.now(),ctime:Date.now(),name:'/'};
    const r=await this.rec(np);if(!r)throw new Error('不存在: '+p);
    return{dir:r.dir,size:r.dir?0:(r.data?.size||0),mtime:r.mtime,ctime:r.ctime,name:r.name}}
  async readdir(p){const rows=await MetaDB.byIndex('idbfs','parent',normPath(p));
    return rows.map(r=>({name:r.name,dir:r.dir,size:r.dir?0:(r.data?.size||0),mtime:r.mtime,ctime:r.ctime}))}
  async read(p){const r=await this.rec(p);if(!r||r.dir)throw new Error('无法读取: '+p);return r.data}
  async write(p,data,mtime){
    const np=normPath(p);const old=await this.rec(np);
    const blob=data instanceof Blob?data:new Blob([data]);
    const now=Date.now();
    await MetaDB.put('idbfs',{path:np,parent:dirName(np),name:baseName(np),dir:false,data:blob,mtime:mtime||now,ctime:old?.ctime||now});
    return blob.size;
  }
  async mkdir(p){const np=normPath(p);if(await this.rec(np))return;
    // 确保父目录存在
    const parts=segs(np);let cur='';for(let i=0;i<parts.length;i++){cur+='/'+parts[i];
      if(!(await this.rec(cur)))await MetaDB.put('idbfs',{path:cur,parent:dirName(cur),name:parts[i],dir:true,data:null,mtime:Date.now(),ctime:Date.now()})}}
  async remove(p){const np=normPath(p);const r=await this.rec(np);if(!r)throw new Error('不存在: '+p);
    const ks=await MetaDB.keys('idbfs');for(const k of ks){if(k===np||k.startsWith(np+'/'))await MetaDB.del('idbfs',k)}}
  async move(src,dst){
    const a=normPath(src),b=normPath(dst);const ks=await MetaDB.keys('idbfs');const all=await MetaDB.all('idbfs');
    const map=new Map(ks.map((k,i)=>[k,all[i]]));
    for(const[k,r]of map){if(k===a||k.startsWith(a+'/')){
      const nk=b+k.slice(a.length);await MetaDB.del('idbfs',k);
      await MetaDB.put('idbfs',{...r,path:nk,parent:dirName(nk),name:baseName(nk)})}}
  }
}
// ---- 内存降级后端 ----
class MemBackend{
  constructor(){this.id='mem';this.label='内存存储（临时）';this.m=new Map()}
  async init(){}
  async exists(p){return p==='/'||this.m.has(normPath(p))}
  async stat(p){const np=normPath(p);if(np==='/')return{dir:true,size:0,mtime:Date.now(),ctime:Date.now(),name:'/'};
    const r=this.m.get(np);if(!r)throw new Error('不存在');return{dir:r.dir,size:r.data?.size||0,mtime:r.mtime,ctime:r.ctime,name:baseName(np)}}
  async readdir(p){const np=normPath(p);return[...this.m.entries()].filter(([k])=>dirName(k)===np).map(([k,r])=>({name:baseName(k),dir:r.dir,size:r.data?.size||0,mtime:r.mtime,ctime:r.ctime}))}
  async read(p){const r=this.m.get(normPath(p));if(!r||r.dir)throw new Error('无法读取');return r.data}
  async write(p,data,mtime){const np=normPath(p);const old=this.m.get(np);const blob=data instanceof Blob?data:new Blob([data]);this.m.set(np,{dir:false,data:blob,mtime:mtime||Date.now(),ctime:old?.ctime||Date.now()});return blob.size}
  async mkdir(p){const parts=segs(p);let cur='';for(const s of parts){cur+='/'+s;if(!this.m.has(cur))this.m.set(cur,{dir:true,data:null,mtime:Date.now(),ctime:Date.now()})}}
  async remove(p){const np=normPath(p);for(const k of[...this.m.keys()])if(k===np||k.startsWith(np+'/'))this.m.delete(k)}
  async move(src,dst){const a=normPath(src),b=normPath(dst);for(const[k,r]of[...this.m]){if(k===a||k.startsWith(a+'/')){this.m.delete(k);this.m.set(b+k.slice(a.length),r)}}}
}
// ---- 本地挂载后端（File System Access API，接口与 VFS 完全一致） ----
class LocalBackend{
  constructor(handle,name){this.id='local:'+name;this.label=name;this.rootHandle=handle;this.mountName=name}
  async dir(p,create=false){let h=this.rootHandle;for(const s of segs(p))h=await h.getDirectoryHandle(s,{create});return h}
  async fh(p,create=false){const ss=segs(p);const name=ss.pop();if(!name)throw new Error('路径是目录');const d=await this.dir(ss.join('/'),create);return d.getFileHandle(name,{create})}
  async exists(p){try{await this.stat(p);return true}catch(e){return false}}
  async stat(p){
    const m=Meta.get(this.id,normPath(p));
    if(segs(p).length===0)return{dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now(),name:this.mountName};
    try{const fh=await this.fh(p);const f=await fh.getFile();
      return{dir:false,size:f.size,mtime:m?.mtime||f.lastModified,ctime:m?.ctime||f.lastModified,name:baseName(p)}}
    catch(e){await this.dir(p);return{dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now(),name:baseName(p)}}
  }
  async readdir(p){const d=await this.dir(p);const out=[];
    for await(const[name,h]of d.entries()){const full=joinPath(normPath(p),name);const m=Meta.get(this.id,full);
      if(h.kind==='directory')out.push({name,dir:true,size:0,mtime:m?.mtime||0,ctime:m?.ctime||0});
      else{const f=await h.getFile();out.push({name,dir:false,size:f.size,mtime:m?.mtime||f.lastModified,ctime:m?.ctime||f.lastModified})}}
    return out}
  async read(p){return(await this.fh(p)).getFile()}
  async write(p,data,mtime){const fh=await this.fh(p,true);const w=await fh.createWritable();
    await w.write(data instanceof Blob?data:new Blob([data]));await w.close();
    const np=normPath(p);const old=Meta.get(this.id,np);
    await Meta.set(this.id,np,{mtime:mtime||Date.now(),ctime:old?.ctime||Date.now()});
    return(await fh.getFile()).size}
  async mkdir(p){await this.dir(p,true);const np=normPath(p);if(!Meta.get(this.id,np))await Meta.set(this.id,np,{mtime:Date.now(),ctime:Date.now()})}
  async remove(p){const st=await this.stat(p);const ss=segs(p);const name=ss.pop();const d=await this.dir(ss.join('/'));
    await d.removeEntry(name,{recursive:st.dir});await Meta.delTree(this.id,normPath(p))}
  async move(src,dst){
    const ss=segs(src),name=ss.pop();const d=await this.dir(ss.join('/'));
    let h;try{h=await d.getFileHandle(name)}catch(e){h=await d.getDirectoryHandle(name)}
    const dd=segs(dst),dn=dd.pop();const td=await this.dir(dd.join('/'),true);
    const st=await this.stat(src);
    if(h.move){await h.move(td,dn)}
    else{await fs._copyRaw(this,src,this,dst);await this.remove(src)}
    await Meta.set(this.id,normPath(dst),{mtime:st.mtime,ctime:st.ctime});
    await Meta.moveTree(this.id,normPath(src),normPath(dst));
  }
}
// ---- 统一 fs 门面 ----
const fs={
  backends:{},mounts:new Map(),pendingMounts:[],ver:0,default:null,
  async init(){
    try{await MetaDB.open();await Meta.load()}catch(e){console.warn('IDB 不可用',e)}
    if(navigator.storage?.getDirectory){try{const b=new OPFSBackend();await b.init();this.backends.opfs=b}catch(e){console.warn('OPFS 不可用',e)}}
    if(MetaDB.db){const b=new IDBBackend();await b.init();this.backends.idb=b}
    if(!this.backends.opfs&&!this.backends.idb){const b=new MemBackend();await b.init();this.backends.mem=b;toast('OPFS 与 IndexedDB 均不可用，已降级为内存存储（数据不持久）','err',8000)}
    this.pickDefault();
    await this.restoreMounts();
  },
  pickDefault(){const want=Settings.get('backend');this.default=this.backends[want]||this.backends.opfs||this.backends.idb||this.backends.mem},
  resolve(path){
    const np=normPath(path);
    if(np.startsWith('/mnt/local/')){const rest=np.slice('/mnt/local/'.length);const i=rest.indexOf('/');const name=i<0?rest:rest.slice(0,i);
      const b=this.mounts.get(name);if(!b)throw new Error('挂载点不存在: '+name);return{b,rel:i<0?'/':rest.slice(i),full:np}}
    if(np==='/mnt/local')return{b:null,rel:'/',full:np,virtual:'mounts'};
    if(np.startsWith('/@opfs')){if(!this.backends.opfs)throw new Error('OPFS 不可用');return{b:this.backends.opfs,rel:np.slice(6)||'/',full:np}}
    if(np.startsWith('/@idb')){if(!this.backends.idb)throw new Error('IndexedDB 不可用');return{b:this.backends.idb,rel:np.slice(5)||'/',full:np}}
    if(np==='/mnt')return{b:null,rel:'/',full:np,virtual:'mnt'};
    return{b:this.default,rel:np,full:np};
  },
  bump(){this.ver++;this._duCache.clear();fsEvents.emit()},
  _duCache:new Map(),
  async stat(p){const{b,rel,virtual}=this.resolve(p);if(virtual)return{dir:true,size:0,mtime:Date.now(),ctime:Date.now(),name:baseName(p)};return b.stat(rel)},
  async exists(p){try{const{b,rel,virtual}=this.resolve(p);if(virtual)return true;return b.exists(rel)}catch(e){return false}},
  async readdir(p){
    const{b,rel,virtual,full}=this.resolve(p);
    if(virtual==='mnt'){const out=[{name:'local',dir:true,size:0,mtime:0,ctime:0}];return out}
    if(virtual==='mounts'){return[...this.mounts.keys()].map(n=>({name:n,dir:true,size:0,mtime:0,ctime:0}))}
    const list=await b.readdir(rel);
    // 根目录注入虚拟入口（仅默认根，避免递归）
    if(full==='/'&&b===this.default){
      if(!list.some(x=>x.name==='mnt'))list.push({name:'mnt',dir:true,size:0,mtime:0,ctime:0,virtual:true});
      for(const[id,bb]of Object.entries(this.backends)){if(bb!==b&&id!=='mem'&&!list.some(x=>x.name==='@'+id))list.push({name:'@'+id,dir:true,size:0,mtime:0,ctime:0,virtual:true})}
    }
    return list.map(x=>({...x,path:joinPath(full==='/'?full:full,x.name)}));
  },
  async read(p){const{b,rel}=this.resolve(p);return b.read(rel)},
  async readText(p){return(await this.read(p)).text()},
  async write(p,data,mtime){const{b,rel}=this.resolve(p);const r=await b.write(rel,data,mtime);this.bump();return r},
  async writeText(p,text,mtime){return this.write(p,new Blob([text],{type:mimeOf(p)}),mtime)},
  async mkdir(p){const{b,rel,virtual}=this.resolve(p);if(virtual)throw new Error('虚拟目录不可写');await b.mkdir(rel);this.bump()},
  async remove(p){const{b,rel}=this.resolve(p);await b.remove(rel);this.bump()},
  async _copyRaw(sb,sp,db,dp){ // 递归复制，保留 mtime
    const st=await sb.stat(sp);
    if(st.dir){await db.mkdir(dp);const kids=await sb.readdir(sp);for(const k of kids)await this._copyRaw(sb,joinPath(sp,k.name),db,joinPath(dp,k.name));
      const m=Meta.get(sb.id,normPath(sp));if(m)await Meta.set(db.id,normPath(dp),{...m})}
    else{const blob=await sb.read(sp);await db.write(dp,blob,st.mtime)}
  },
  async copy(src,dst){
    const s=this.resolve(src),d=this.resolve(dst);
    if(normPath(dst).startsWith(normPath(src)+'/'))throw new Error('不能复制到自身内部');
    await this._copyRaw(s.b,s.rel,d.b,d.rel);this.bump();
  },
  async move(src,dst){
    const s=this.resolve(src),d=this.resolve(dst);
    if(normPath(src)===normPath(dst))return;
    if(normPath(dst).startsWith(normPath(src)+'/'))throw new Error('不能移动到自身内部');
    if(s.b===d.b&&s.b.move){await s.b.move(s.rel,d.rel)}
    else{await this._copyRaw(s.b,s.rel,d.b,d.rel);await s.b.remove(s.rel)}
    this.bump();
  },
  async rename(p,newName){return this.move(p,joinPath(dirName(p),newName))},
  async uniquePath(dir,name){
    let target=joinPath(dir,name),i=1;const dot=name.lastIndexOf('.');
    const stem=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';
    while(await this.exists(target)){target=joinPath(dir,`${stem} (${i++})${ext}`)}
    return target;
  },
  async du(p){ // 实际递归大小
    const key=normPath(p)+':'+this.ver;
    if(this._duCache.has(key))return this._duCache.get(key);
    const walk=async path=>{let sum=0;const st=await this.stat(path);if(!st.dir)return st.size;
      const kids=await this.readdir(path);for(const k of kids){if(k.virtual)continue;sum+=await walk(joinPath(path,k.name))}return sum};
    const v=await walk(p);this._duCache.set(key,v);return v;
  },
  async search(root,q,limit=200){
    const out=[];const ql=q.toLowerCase();
    const walk=async path=>{if(out.length>=limit)return;let kids;try{kids=await this.readdir(path)}catch(e){return}
      for(const k of kids){if(out.length>=limit)return;const full=joinPath(path,k.name);
        if(k.name.toLowerCase().includes(ql))out.push({...k,path:full});
        if(k.dir&&!k.virtual)await walk(full)}};
    await walk(root);return out;
  },
  // ---- 本地挂载 ----
  async mountLocal(handle){
    let name=handle.name,i=1;while(this.mounts.has(name))name=handle.name+'_'+(i++);
    const b=new LocalBackend(handle,name);this.mounts.set(name,b);
    if(MetaDB.db)try{await MetaDB.put('handles',handle,name)}catch(e){}
    this.bump();return name;
  },
  async unmount(name){this.mounts.delete(name);if(MetaDB.db)await MetaDB.del('handles',name);this.bump()},
  async restoreMounts(){
    if(!MetaDB.db)return;
    let names=[];try{names=await MetaDB.keys('handles')}catch(e){return}
    for(const n of names){try{const h=await MetaDB.get('handles',n);if(!h)continue;
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm==='granted'){this.mounts.set(n,new LocalBackend(h,n))}
      else this.pendingMounts.push({name:n,handle:h});
    }catch(e){}}
    if(this.pendingMounts.length)setTimeout(()=>toast(`有 ${this.pendingMounts.length} 个本地文件夹需要重新授权，请在文件管理器侧栏点击恢复`,'',7000),1200);
  },
  async regrant(name){
    const p=this.pendingMounts.find(x=>x.name===name);if(!p)return false;
    const perm=await p.handle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){this.mounts.set(name,new LocalBackend(p.handle,name));this.pendingMounts=this.pendingMounts.filter(x=>x.name!==name);this.bump();return true}
    return false;
  },
  async usage(){
    const out={};
    for(const[id,b]of Object.entries(this.backends)){try{out[id]={label:b.label,size:await this.du(id===this.default.id?'/':(id==='opfs'?'/@opfs':'/@idb'))}}catch(e){out[id]={label:b.label,size:0}}}
    let quota=0,usage=0;try{const est=await navigator.storage.estimate();quota=est.quota||0;usage=est.usage||0}catch(e){}
    return{backends:out,quota,usage};
  },
  async resetAll(){
    for(const[id,b]of Object.entries(this.backends)){
      if(id==='idb'){await MetaDB.clear('idbfs')}
      else if(id==='opfs'){for await(const[n]of b.root.entries())await b.root.removeEntry(n,{recursive:true})}
      else if(b.m)b.m.clear();
    }
    if(MetaDB.db){await MetaDB.clear('meta');await MetaDB.clear('handles')}
    Meta.cache.clear();this.mounts.clear();this.pendingMounts=[];
    try{localStorage.removeItem('amber.iconpos')}catch(e){}
    this.bump();
  }
};

function toast(msg,type='',ms=3200){
  const t=el('div','toast '+type,`${type==='err'?ICONS.warn:type==='ok'?ICONS.check:ICONS.info}<span>${esc(msg)}</span>`);
  $('#toast-root').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)},ms);
  t.onclick=()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)};
  return t;
}
function ctxMenu(items,x,y){

  async importFiles(files,destDir){
    let count=0;
    for(const file of files){const buf=await file.arrayBuffer();
      const target=await fs.uniquePath(destDir,file.name);
      await fs.write(target,new Blob([buf],{type:file.type||mimeOf(file.name)}),file.lastModified||Date.now());count++}
    return count;
  },
  // 触摸拖拽（移动端内部移动）
  touchDrag(elm,{onStart,onMove,onEnd,threshold=9}={}){
    let sx,sy,active=false,pid=null;
    const ghost=$('#drag-ghost');
    elm.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;active=false;pid=t.identifier;
      const move=ev=>{
        const tt=[...ev.touches].find(x=>x.identifier===pid);if(!tt)return;
        const dx=tt.clientX-sx,dy=tt.clientY-sy;
        if(!active&&Math.hypot(dx,dy)>threshold){active=true;
          ghost.innerHTML=elm.querySelector('.di-label,.eii-label,.eci-name')?.textContent||'移动';
          ghost.hidden=false;onStart&&onStart()}
        if(active){ev.preventDefault();
          ghost.style.left=(tt.clientX+12)+'px';ghost.style.top=(tt.clientY+12)+'px';
          onMove&&onMove(tt.clientX,tt.clientY)}
      };
      const end=ev=>{
        elm.removeEventListener('touchmove',move);elm.removeEventListener('touchend',end);elm.removeEventListener('touchcancel',end);
        ghost.hidden=true;
        if(active){const tt=ev.changedTouches[0];onEnd&&onEnd(tt.clientX,tt.clientY)}
        active=false;
      };
      elm.addEventListener('touchmove',move,{passive:false});
      elm.addEventListener('touchend',end);elm.addEventListener('touchcancel',end);
    },{passive:true});
  }
};

function lazyThumb(host,path,imgWrap){
  host._loadThumb=async()=>{
    try{let url=_thumbCache.get(path);
      if(!url){const blob=await fs.read(path);
        if(blob.size>12*1024*1024)return;
        url=URL.createObjectURL(blob);_thumbCache.set(path,url);
        if(_thumbCache.size>200){const k=_thumbCache.keys().next().value;URL.revokeObjectURL(_thumbCache.get(k));_thumbCache.delete(k)}}
      if(!host.isConnected)return;
      const img=new Image();img.src=url;img.className=imgWrap.classList.contains('di-img')?'':'thumb';
      imgWrap.innerHTML='';imgWrap.appendChild(img);
    }catch(e){}
  };
  _thumbObs.observe(host);
}

function renderCalendar(){
  const pop=$('#calendar-pop');const now=new Date();
  if(calY==null){calY=now.getFullYear();calM=now.getMonth()}
  const first=new Date(calY,calM,1);const startDow=first.getDay();
  const days=new Date(calY,calM+1,0).getDate();const prevDays=new Date(calY,calM,0).getDate();
  let cells='';
  ['日','一','二','三','四','五','六'].forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<42;i++){
    let dn,other=false;
    if(i<startDow){dn=prevDays-startDow+i+1;other=true}
    else if(i-startDow>=days){dn=i-startDow-days+1;other=true}
    else dn=i-startDow+1;
    const today=!other&&dn===now.getDate()&&calM===now.getMonth()&&calY===now.getFullYear();
    cells+=`<div class="cal-day${other?' other':''}${today?' today':''}">${dn}</div>`;
  }
  pop.innerHTML=`<div class="cal-head"><b>${calY} 年 ${calM+1} 月</b>
    <div class="cal-nav"><button data-n="-1">${ICONS.chevL}</button><button data-n="0" title="回到今天">${ICONS.clock}</button><button data-n="1">${ICONS.chevR}</button></div></div>
    <div class="cal-grid">${cells}</div>`;
  $$('.cal-nav button',pop).forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n;
    if(n===0){calY=now.getFullYear();calM=now.getMonth()}
    else{calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}}
    renderCalendar()});
}

// 智能分派：先 stat 判类型，目录→管理器，文件→对应应用（对所有后端统一）
async function openPath(p,hint){
  let st;try{st=await fs.stat(p)}catch(e){return toast('无法打开: '+e.message,'err')}
  if(st.dir)return launchApp('explorer',p);
  if(hint)return launchApp(hint,p);
  const e=extOf(p);
  if(IMG_EXTS.has(e))return launchApp('image',p);
  if(AUD_EXTS.has(e)||VID_EXTS.has(e))return launchApp('media',p);
  if(e==='pdf')return openPdf(p);
  if(e==='csv'||e==='tsv')return launchApp('sheets',p);
  if(e==='html'||e==='htm'||e==='svg')return launchApp('editor',p);
  if(ARCH_EXTS.has(e)||['gz','tar','tgz','7z'].includes(e))return launchApp('archive',p);
  if(CODE_EXTS.has(e))return launchApp('editor',p);
  if(TEXT_EXTS.has(e))return launchApp('notepad',p);
  // 未知类型：至少提供纯文本打开
  return launchApp('notepad',p);
}
async function openWithDialog(p){
  const st=await fs.stat(p);
  const opts=[
    {label:'默认方式打开',icon:ICONS.external,value:'__default__'},
    {label:'代码编辑器',icon:ICONS.editor,value:'editor'},
    {label:'记事本（纯文本）',icon:ICONS.notepad,value:'notepad'},
  ];
  if(!st.dir){
    if(IMG_EXTS.has(extOf(p))){opts.push({label:'图片查看器',icon:ICONS.image,value:'image'});opts.push({label:'漫画阅读器（同目录序列）',icon:ICONS.manga,value:'manga'})}
    opts.push({label:'网页浏览器渲染',icon:ICONS.browser,value:'__browser__'});
    if(ARCH_EXTS.has(extOf(p))||['gz','tar','tgz','7z'].includes(extOf(p)))opts.push({label:'压缩工具',icon:ICONS.archive,value:'archive'});
    opts.push({label:'导出到本机',icon:ICONS.download,value:'__export__'});
  }
  const v=await pickFromList('打开方式 · '+baseName(p),opts);
  if(!v)return;
  if(v==='__default__')return openPath(p);
  if(v==='__export__')return exportPath(p);
  if(v==='__browser__'){const blob=await fs.read(p);const url=URL.createObjectURL(new Blob([blob],{type:mimeOf(p)}));return launchApp('browser',url)}
  launchApp(v,p);
}
// 带暗色遮罩的 iframe 加载（避免白屏闪烁）
function shieldedIframe(parent,src,sandbox){
  const shield=el('div','iframe-shield',`<div class="spinner"></div><span>载入中…</span>`);
  const f=el('iframe');f.style.cssText='flex:1;border:none;width:100%;height:100%;background:transparent';
  if(sandbox)f.setAttribute('sandbox',sandbox);
  parent.appendChild(f);parent.appendChild(shield);
  f.addEventListener('load',()=>setTimeout(()=>shield.classList.add('gone'),120));
  setTimeout(()=>shield.classList.add('gone'),6000); // 兜底
  if(src)f.src=src;
  return{frame:f,shield,show(){shield.classList.remove('gone')},hide(){shield.classList.add('gone')}};
}

function parseDelimited(text,delim){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=c}
    else if(c==='"')inQ=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r')cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function toDelimited(rows,delim){return rows.map(r=>r.map(c=>/[",\n\t]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(delim)).join('\n')}

const MODE_BY_EXT={html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',mjs:'javascript',json:'application/json',md:'markdown',markdown:'markdown',xml:'xml',svg:'xml'};
const MODE_LABEL={'htmlmixed':'HTML','css':'CSS','javascript':'JavaScript','application/json':'JSON','markdown':'Markdown','xml':'XML/SVG'};

function modeForFile(p){return MODE_BY_EXT[extOf(p)]||'htmlmixed'}
// 轻量格式化（保持光标）
function formatCode(text,mode){
  try{
    if(mode==='application/json')return JSON.stringify(JSON.parse(text),null,2);
    if(mode==='css')return text.replace(/\s*{\s*/g,' {\n  ').replace(/;\s*/g,';\n  ').replace(/\s*}\s*/g,'\n}\n').replace(/\n\s*\n/g,'\n').replace(/  }/g,'}').trim();
    if(mode==='htmlmixed'||mode==='xml'){
      const tokens=text.replace(/>\s*</g,'>\n<').split('\n');let depth=0,out=[];
      const voidRe=/^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr|!)/i;
      for(let t of tokens){t=t.trim();if(!t)continue;
        if(/^<\//.test(t))depth=Math.max(0,depth-1);
        out.push('  '.repeat(depth)+t);
        if(/^<[^/!]/.test(t)&&!voidRe.test(t)&&!/<\/[^>]+>$/.test(t)&&!/^<.*\/>$/.test(t))depth++;
      }
      return out.join('\n');
    }
    if(mode==='javascript'){
      let depth=0,out=[];
      for(let line of text.split('\n')){let t=line.trim();if(!t){out.push('');continue}
        const open=(t.match(/{/g)||[]).length,close=(t.match(/}/g)||[]).length;
        if(/^[}\])]/.test(t))depth=Math.max(0,depth-1);
        out.push('  '.repeat(depth)+t);
        depth=Math.max(0,depth+open-close+(/^[}\])]/.test(t)?1:0));
      }
      return out.join('\n');
    }
  }catch(e){toast('格式化失败: '+e.message,'err')}

}
function previewDoc(code,mode){

  if(mode==='javascript')return`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:monospace;padding:16px;background:#14141a;color:#e8e4da"><div id="out"></div><script>const _log=(...a)=>{document.getElementById('out').innerHTML+=a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')+'<br>'};console.log=_log;console.error=_log;try{${code}}catch(e){_log('[错误] '+e.message)}<\/script></body></html>`;

  $('[data-a=zin]',root).onclick=()=>{scale*=1.25;apply()};

  view.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;scale=clamp(scale*f,.05,20);apply()},{passive:false});
  // 拖拽平移 + 双指缩放

  view.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag={x:e.clientX,y:e.clientY,tx,ty};view.setPointerCapture(e.pointerId)}});
  view.addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()}});
  view.addEventListener('pointerup',()=>drag=null);

  load(path);

}

async function openManga(path){

  const root=el('div');root.style.cssText='display:flex;flex-direction:column;height:100%;background:#000';

    <button class="tool-btn" data-a="fs">${ICONS.fullscreen}<span>沉浸全屏</span></button>

  </div>
  <div class="manga-scroll"><div class="manga-inner"></div><div class="manga-progress"><i></i></div></div>
  <div class="app-status" style="background:#101014"><span class="mg-page">第 0 / 0 页</span><span>${esc(dirName(path))}</span></div>`;
  const W=WM.create({app:'manga',title:'漫画 · '+baseName(path),icon:ICONS.manga,w:860,h:640,content:root});
  const sc=$('.manga-scroll',root),inner=$('.manga-inner',root),prog=$('.manga-progress i',root);
  const dir=dirName(path);
  let pages=[],urls=[];
  const info=$('.mg-info',root);
  info.textContent='读取目录…';
  let list;
  try{list=(await fs.readdir(dir)).filter(x=>!x.dir&&IMG_EXTS.has(extOf(x.name)))}
  catch(e){inner.innerHTML=`<div class="empty-hint" style="color:#888">${ICONS.warn}<span>目录读取失败：${esc(e.message)}</span></div>`;return W}
  list.sort((a,b)=>natCmp(a.name,b.name)); // 自然数字排序
  if(!list.length){inner.innerHTML='<div class="empty-hint" style="color:#888">该目录没有图片</div>';return W}
  const clickedIdx=list.findIndex(x=>x.name===baseName(path));
  info.textContent=`并行读取 ${list.length} 页…`;
  // 并行读取二进制，按序插入
  const blobs=await Promise.all(list.map(async it=>{try{return await fs.read(joinPath(dir,it.name))}catch(e){return null}}));
  let loaded=0;
  for(let i=0;i<list.length;i++){
    const blob=blobs[i];
    const page=el('div','manga-page');page.dataset.idx=i;
    if(!blob){page.innerHTML=`<div class="mp-skel" style="aspect-ratio:3/4">第 ${i+1} 页读取失败，已跳过</div>`;inner.appendChild(page);continue}
    const url=URL.createObjectURL(blob);urls.push(url);
    const skel=el('div','mp-skel','<div class="spinner"></div>');skel.style.aspectRatio='3/4';
    page.appendChild(skel);page.insertAdjacentHTML('beforeend',`<span class="mp-num">${i+1} / ${list.length}</span>`);
    inner.appendChild(page);
    const im=new Image();im.src=url;im.draggable=false;
    try{await im.decode();
      const oldH=page.offsetHeight;
      im.style.aspectRatio=im.naturalWidth+' / '+im.naturalHeight;
      skel.replaceWith(im);
      const deltaH=page.offsetHeight-oldH;
      // 上方图片撑开高度时补偿滚动，避免画面跳动
      if(page.offsetTop<sc.scrollTop)sc.scrollTop+=deltaH;
    }catch(e){skel.textContent='解码失败'}
    loaded++;info.textContent=`${loaded} / ${list.length} 页`;
    if(i===clickedIdx)page.scrollIntoView({block:'start'});
  }
  info.textContent=`共 ${list.length} 页`;
  // 定位到点击图片
  setTimeout(()=>{const t=inner.querySelector(`[data-idx="${clickedIdx}"]`);t&&t.scrollIntoView({block:'start'})},80);
  // 页码 & 进度
  function updPage(){
    const st=sc.scrollTop,h=sc.scrollHeight-sc.clientHeight;
    prog.style.height=Math.max(8,h>0?sc.clientHeight*sc.clientHeight/sc.scrollHeight:sc.clientHeight)+'px';
    prog.style.top=(h>0?st/h*(sc.clientHeight-parseFloat(prog.style.height)):0)+'px';
    let cur=0;for(const p of inner.children){if(p.offsetTop<=st+sc.clientHeight*.3)cur=+p.dataset.idx}
    $('.mg-page',root).textContent=`第 ${cur+1} / ${list.length} 页`;
  }
  sc.addEventListener('scroll',updPage,{passive:true});updPage();
  // PC 手抓拖拽 + 物理惯性（FRICTION 0.96）
  let grab=null,vel=0,inertiaRaf=0,lastY=0,lastT=0;
  sc.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse')return;
    cancelAnimationFrame(inertiaRaf);
    grab={y:e.clientY,st:sc.scrollTop};lastY=e.clientY;lastT=performance.now();vel=0;
    sc.classList.add('grabbing');sc.setPointerCapture(e.pointerId);
  });
  sc.addEventListener('pointermove',e=>{
    if(!grab)return;
    sc.scrollTop=grab.st-(e.clientY-grab.y);
    const now=performance.now(),dt=now-lastT;
    if(dt>0)vel=(lastY-e.clientY)/dt*16;
    lastY=e.clientY;lastT=now;
  });
  const release=()=>{if(!grab)return;grab=null;sc.classList.remove('grabbing');
    const glide=()=>{if(Math.abs(vel)<.4)return;sc.scrollTop+=vel;vel*=0.96;inertiaRaf=requestAnimationFrame(glide)};
    inertiaRaf=requestAnimationFrame(glide)};
  sc.addEventListener('pointerup',release);sc.addEventListener('pointercancel',release);
  $('[data-a=top]',root).onclick=()=>sc.scrollTo({top:0,behavior:'smooth'});
  // 全屏沉浸
  const onFSChange=()=>{if(!document.fullscreenElement&&W.el.classList.contains('fullscreen-app'))W.exitFullscreenApp()};
  document.addEventListener('fullscreenchange',onFSChange);
  $('[data-a=fs]',root).onclick=()=>W.enterFullscreenApp();
  W.onExitFS=()=>{};
  W.onClose=()=>{urls.forEach(u=>URL.revokeObjectURL(u));cancelAnimationFrame(inertiaRaf);
    document.removeEventListener('fullscreenchange',onFSChange)};
  return W;
}

// ============ 计算器 ============
function calcEval(expr){
  // 递归下降解析，安全无 eval
  let i=0;const s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
  function num(){let m=/^-?\d*\.?\d+(e-?\d+)?/i.exec(s.slice(i));if(!m)throw new Error('语法错误');i+=m[0].length;return parseFloat(m[0])}
  function factor(){if(s[i]==='('){i++;const v=addsub();if(s[i]!==')')throw new Error('缺少 )');i++;return post(v)}
    if(s.slice(i,i+3)==='√('){i+=2;const v=factor();return post(Math.sqrt(v))}
    return post(num())}
  function post(v){while(s[i]==='²'){v=v*v;i++}if(s[i]==='!'){let r=1;for(let k=2;k<=v;k++)r*=k;i++;return r}return v}
  function pow(){let v=factor();if(s[i]==='^'){i++;v=Math.pow(v,pow())}return v}
  function muldiv(){let v=pow();while(s[i]==='*'||s[i]==='/'||s[i]==='%'){const op=s[i++];const r=pow();
    v=op==='*'?v*r:op==='/'?v/r:v%r}return v}
  function addsub(){let v=muldiv();while(s[i]==='+'||s[i]==='-'){const op=s[i++];const r=muldiv();v=op==='+'?v+r:v-r}return v}
  const v=addsub();if(i<s.length)throw new Error('语法错误');
  if(!isFinite(v))throw new Error('数学错误');return v;
}
function openCalc(){
  const root=el('div','calc');
  root.innerHTML=`<div class="calc-display"><div class="calc-expr"></div><div class="calc-val">0</div></div><div class="calc-grid"></div>`;
  const W=WM.create({app:'calc',title:'计算器',icon:ICONS.calc,w:340,h:480,content:root,minW:280,minH:380});
  const grid=$('.calc-grid',root),val=$('.calc-val',root),expr=$('.calc-expr',root);
  let cur='0',done=false;
  const keys=[['C','fn'],['DEL','fn'],['%','op'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['±','fn'],['0',''],['.',''],['=','eq']];
  function show(){val.textContent=cur}
  function press(k){
    if(k==='C'){cur='0';expr.textContent=''}
    else if(k==='DEL'){cur=cur.length>1?cur.slice(0,-1):'0'}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):'-'+cur}
    else if(k==='='){try{const r=calcEval(cur);expr.textContent=cur+' =';
        cur=String(Math.round(r*1e10)/1e10);done=true}catch(e){expr.textContent=e.message}}
    else{if(done&&/[\d.]/.test(k)){cur='0';done=false}done=false;
      if(cur==='0'&&/[\d]/.test(k))cur=k;else cur+=k}
    show();
  }
  for(const[k,cls]of keys){const b=el('button','calc-key '+cls,k);b.onclick=()=>press(k);grid.appendChild(b)}
  W.el.addEventListener('keydown',e=>{
    const map={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'DEL','Escape':'C','%':'%'};
    const k=map[e.key]||e.key;
    if(/^[0-9.+×÷−=%]$/.test(k)||['DEL','C'].includes(k)){e.preventDefault();press(k)}
  });
  W.el.tabIndex=0;setTimeout(()=>W.el.focus(),100);
  return W;
}

  const inputLine=el('div','t-line');

        inputLine.innerHTML=`<span class="t-prompt">amber:${esc(dir)}$</span> ${esc(cmd)}`;
        if(cmd.trim()){hist.push(cmd);hi=hist.length}

      else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){hi--;inp.value=hist[hi]||''}}
      else if(e.key==='ArrowDown'){e.preventDefault();if(hi<hist.length){hi++;inp.value=hist[hi]||''}}

    });

  async function run(line){
    const parts=line.trim().match(/(?:[^\s"]+|"[^"]*")+/g)||[];
    const cmd=parts[0],args=parts.slice(1).map(a=>a.replace(/^"|"$/g,''));
    if(!cmd)return;

      switch(cmd){
