<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青丝 OS · QuadCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:#06101c;
    --ink:#0c1a2c;
    --ink-2:#142940;
    --teal:#1a3a52;
    --mist:#6b8aa8;
    --mist-soft:#9ab3cb;
    --paper:#e8e2d3;
    --paper-warm:#d8cdb6;
    --copper:#c4926a;
    --copper-glow:#e0a878;
    --vermilion:#a04030;
    --line:rgba(232,226,211,0.14);
    --line-strong:rgba(232,226,211,0.28);
    --glass:rgba(10,22,38,0.42);
    --glass-2:rgba(10,22,38,0.62);
    --glass-pane:rgba(20,40,64,0.34);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Cormorant Garamond','Noto Serif SC',serif;color:var(--paper);background:#000;-webkit-font-smoothing:antialiased;cursor:default}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
  ::selection{background:rgba(196,146,106,0.35);color:var(--paper)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(232,226,211,0.18);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(232,226,211,0.32)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ========== WALLPAPER & RAIN ========== */
  #wallpaper{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, #2a4a6a 0%, transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 100%, #050a14 0%, transparent 70%),
      linear-gradient(180deg,#1f3a58 0%, #142940 35%, #0a1628 65%, #060d18 100%);
  }
  #wallpaper svg.scene{
    position:absolute;bottom:0;left:0;width:100%;height:55%;
    filter:drop-shadow(0 -10px 40px rgba(0,0,0,0.4));
  }
  #wallpaper .stars{
    position:absolute;inset:0 0 40% 0;
    background-image:
      radial-gradient(1px 1px at 20% 20%, rgba(255,255,255,0.55), transparent 50%),
      radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,0.4), transparent 50%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.5), transparent 50%),
      radial-gradient(1px 1px at 35% 45%, rgba(255,255,255,0.35), transparent 50%),
      radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.4), transparent 50%),
      radial-gradient(1px 1px at 5% 60%, rgba(255,255,255,0.3), transparent 50%);
  }
  #rain-canvas{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    mix-blend-mode:screen;opacity:0.85;
  }
  #grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0.06;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ========== TOP BAR ========== */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:34px;z-index:1000;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;
    background:linear-gradient(180deg,rgba(6,16,28,0.7),rgba(6,16,28,0.2));
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--line);
    font-size:12.5px;letter-spacing:0.04em;
  }
  #topbar .left{display:flex;align-items:center;gap:18px}
  #topbar .brand{font-family:'Ma Shan Zheng',cursive;font-size:17px;color:var(--copper-glow);letter-spacing:0.1em}
  #topbar .right{display:flex;align-items:center;gap:18px;color:var(--mist-soft)}
  #topbar .stat{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.12em}
  #topbar .dot{width:5px;height:5px;border-radius:50%;background:var(--copper-glow);box-shadow:0 0 8px var(--copper-glow)}
  #topbar .dot.idle{background:var(--mist);box-shadow:none}
  #clock{font-family:'Fraunces',serif;font-weight:300;font-size:13px;color:var(--paper)}

  /* ========== DESKTOP ========== */
  #desktop{
    position:fixed;inset:34px 0 90px 0;z-index:10;
    padding:32px 44px;
    display:grid;grid-template-columns:repeat(auto-fill,98px);grid-auto-rows:108px;
    gap:8px;align-content:start;
  }
  .desk-icon{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:10px 4px;border-radius:8px;cursor:pointer;
    transition:background .25s ease, transform .25s ease;
    user-select:none;
  }
  .desk-icon:hover{background:rgba(232,226,211,0.08);transform:translateY(-2px)}
  .desk-icon .ic{
    width:54px;height:54px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,rgba(40,70,100,0.55),rgba(10,22,38,0.7));
    border:1px solid var(--line-strong);border-radius:13px;
    backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .desk-icon .ic svg{width:26px;height:26px;stroke:var(--paper);fill:none;stroke-width:1.2}
  .desk-icon .lbl{font-size:12px;color:var(--paper);text-shadow:0 1px 4px rgba(0,0,0,0.6);letter-spacing:0.05em}

  /* ========== DOCK ========== */
  #dock{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;
    display:flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:18px;
    background:var(--glass);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--line-strong);
    box-shadow:0 14px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .dock-item{
    width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    border-radius:12px;cursor:pointer;position:relative;
    transition:all .3s cubic-bezier(.2,.7,.2,1);
  }
  .dock-item:hover{background:rgba(232,226,211,0.1);transform:translateY(-6px) scale(1.08)}
  .dock-item svg{width:24px;height:24px;stroke:var(--paper);fill:none;stroke-width:1.3;transition:stroke .3s}
  .dock-item:hover svg{stroke:var(--copper-glow)}
  .dock-item .tip{
    position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
    padding:4px 10px;background:rgba(6,16,28,0.95);border:1px solid var(--line-strong);
    border-radius:6px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .2s;letter-spacing:0.06em;color:var(--paper-warm);
  }
  .dock-item:hover .tip{opacity:1}
  .dock-item.active::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--copper-glow);
    box-shadow:0 0 8px var(--copper-glow);
  }
  .dock-divider{width:1px;height:28px;background:var(--line-strong);margin:0 4px}

  /* ========== WINDOWS ========== */
  .window{
    position:absolute;z-index:100;
    background:linear-gradient(160deg,rgba(20,40,64,0.78),rgba(10,22,38,0.85));
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--line-strong);
    border-radius:14px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      0 10px 30px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.08);
    display:flex;flex-direction:column;overflow:hidden;
    min-width:380px;min-height:280px;
    transition:opacity .2s, transform .2s;
  }
  .window.minimized{opacity:0;transform:scale(0.85) translateY(40px);pointer-events:none}
  .window-titlebar{
    height:38px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;cursor:move;user-select:none;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,0.04),transparent);
  }
  .window-controls{display:flex;gap:8px;align-items:center}
  .wc{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,0.2);transition:transform .15s}
  .wc:hover{transform:scale(1.1)}
  .wc.close{background:#d96868}
  .wc.min{background:#d4a574}
  .wc.max{background:#7ab09d}
  .window-title{
    position:absolute;left:50%;transform:translateX(-50%);
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:14px;letter-spacing:0.08em;color:var(--paper-warm);
    pointer-events:none;
  }
  .window-title .cn{font-family:'Ma Shan Zheng',cursive;font-style:normal;color:var(--copper-glow);margin-right:8px}
  .window-body{flex:1;overflow:hidden;display:flex;flex-direction:column}

  /* ========== FILE MANAGER ========== */
  .fm-root{display:flex;height:100%}
  .fm-side{
    width:200px;border-right:1px solid var(--line);padding:18px 14px;
    display:flex;flex-direction:column;gap:18px;
    background:rgba(0,0,0,0.15);
  }
  .fm-side h4{
    font-family:'Fraunces',serif;font-weight:400;font-style:italic;
    font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--mist);
    margin-bottom:8px;
  }
  .fm-side .item{
    display:flex;align-items:center;gap:10px;padding:7px 10px;
    border-radius:7px;cursor:pointer;font-size:13px;color:var(--paper-warm);
    transition:background .2s;letter-spacing:0.04em;
  }
  .fm-side .item:hover{background:rgba(232,226,211,0.07)}
  .fm-side .item.active{background:rgba(196,146,106,0.15);color:var(--copper-glow)}
  .fm-side .item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;flex-shrink:0}
  .fm-side .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .fm-main{flex:1;display:flex;flex-direction:column;min-width:0}
  .fm-toolbar{
    height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;
    border-bottom:1px solid var(--line);
  }
  .fm-tb-btn{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border-radius:7px;cursor:pointer;color:var(--mist-soft);transition:all .2s;
  }
  .fm-tb-btn:hover{background:rgba(232,226,211,0.08);color:var(--paper)}
  .fm-tb-btn.disabled{opacity:0.35;pointer-events:none}
  .fm-tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
  .fm-path{
    flex:1;display:flex;align-items:center;gap:6px;padding:6px 12px;
    background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:7px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--paper-warm);
    overflow:hidden;
  }
  .fm-path .seg{cursor:pointer;color:var(--mist-soft);transition:color .2s}
  .fm-path .seg:hover{color:var(--copper-glow)}
  .fm-path .sep{color:var(--mist);opacity:0.5}
  .fm-search{
    width:180px;padding:6px 10px;background:rgba(0,0,0,0.25);
    border:1px solid var(--line);border-radius:7px;
    font-size:12px;color:var(--paper);font-family:inherit;
  }
  .fm-search:focus{border-color:var(--copper)}

  .fm-content{
    flex:1;overflow:auto;padding:18px;position:relative;
  }
  .fm-content.dragover{background:rgba(196,146,106,0.08)}
  .fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .fm-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 4px;border-radius:8px;cursor:pointer;
    transition:background .2s;user-select:none;
  }
  .fm-item:hover{background:rgba(232,226,211,0.06)}
  .fm-item.selected{background:rgba(196,146,106,0.18)}
  .fm-item .icon{
    width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    color:var(--mist-soft);
  }
  .fm-item .icon svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1}
  .fm-item.folder .icon{color:var(--copper-glow)}
  .fm-item.text .icon{color:var(--mist-soft)}
  .fm-item.image .icon{color:#9bc1a8}
  .fm-item .name{
    font-size:11.5px;text-align:center;color:var(--paper);
    word-break:break-all;line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    max-width:90px;letter-spacing:0.02em;
  }
  .fm-empty{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;color:var(--mist);
    pointer-events:none;
  }
  .fm-empty .quote{font-family:'Fraunces',serif;font-style:italic;font-size:15px}
  .fm-empty .hint{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--mist);opacity:0.6}

  .fm-status{
    height:28px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--mist);letter-spacing:0.08em;
  }

  /* ========== EDITOR ========== */
  .ed-root{display:flex;flex-direction:column;height:100%}
  .ed-toolbar{
    height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;
    border-bottom:1px solid var(--line);
  }
  .ed-toolbar .filename{
    flex:1;font-family:'Fraunces',serif;font-style:italic;font-size:14px;
    color:var(--paper-warm);letter-spacing:0.06em;
  }
  .ed-toolbar .saved{font-size:10.5px;font-family:'JetBrains Mono',monospace;color:var(--mist);letter-spacing:0.1em}
  .ed-toolbar .saved.dirty{color:var(--copper-glow)}
  .ed-btn{
    padding:5px 12px;border:1px solid var(--line-strong);border-radius:6px;
    font-size:11.5px;letter-spacing:0.1em;color:var(--paper-warm);
    transition:all .2s;
  }
  .ed-btn:hover{background:rgba(196,146,106,0.15);border-color:var(--copper);color:var(--copper-glow)}
  .ed-textarea{
    flex:1;width:100%;padding:28px 40px;resize:none;
    font-family:'Cormorant Garamond','Noto Serif SC',serif;
    font-size:17px;line-height:1.8;color:var(--paper);
    background:transparent;letter-spacing:0.03em;
  }
  .ed-status{
    height:24px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--mist);letter-spacing:0.1em;
  }

  /* ========== TERMINAL ========== */
  .term-root{
    height:100%;display:flex;flex-direction:column;
    background:rgba(3,8,16,0.55);
    font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .term-output{
    flex:1;overflow:auto;padding:18px 20px;line-height:1.55;
    color:var(--paper);
  }
  .term-output .line{white-space:pre-wrap;word-break:break-all}
  .term-output .prompt{color:var(--copper-glow)}
  .term-output .err{color:#d98080}
  .term-output .info{color:var(--mist-soft)}
  .term-output .ok{color:#9bc1a8}
  .term-output .dim{color:var(--mist);opacity:0.7}
  .term-input-line{
    display:flex;align-items:center;gap:8px;padding:8px 20px 14px;
    border-top:1px solid var(--line);
  }
  .term-input-line .pmt{color:var(--copper-glow);white-space:nowrap}
  .term-input{flex:1;color:var(--paper);font-family:inherit;font-size:13px}

  /* ========== IMAGE VIEWER ========== */
  .iv-root{
    height:100%;display:flex;align-items:center;justify-content:center;
    padding:30px;background:rgba(0,0,0,0.4);
  }
  .iv-root img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,0.5)}

  /* ========== STORAGE STATS ========== */
  .ss-root{padding:30px 36px;overflow:auto;height:100%}
  .ss-root h2{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:26px;letter-spacing:0.04em;color:var(--paper);margin-bottom:4px;
  }
  .ss-root .sub{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--mist);margin-bottom:30px}
  .ss-quad{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px}
  .ss-card{
    padding:18px 20px;border:1px solid var(--line-strong);border-radius:10px;
    background:linear-gradient(155deg,rgba(40,70,100,0.3),rgba(10,22,38,0.4));
    position:relative;overflow:hidden;
  }
  .ss-card .badge{
    display:inline-block;padding:2px 8px;border-radius:4px;
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.15em;
    background:rgba(196,146,106,0.18);color:var(--copper-glow);
    margin-bottom:8px;
  }
  .ss-card .badge.off{background:rgba(232,226,211,0.08);color:var(--mist)}
  .ss-card .name{
    font-family:'Fraunces',serif;font-size:18px;color:var(--paper);
    margin-bottom:2px;font-weight:500;
  }
  .ss-card .role{font-size:11px;color:var(--mist-soft);letter-spacing:0.08em;margin-bottom:14px}
  .ss-card .num{
    font-family:'Fraunces',serif;font-size:24px;color:var(--copper-glow);
    font-weight:300;
  }
  .ss-card .num small{font-size:12px;color:var(--mist);margin-left:4px}
  .ss-bar{
    height:6px;background:rgba(232,226,211,0.08);border-radius:3px;overflow:hidden;
    margin-top:12px;
  }
  .ss-bar > div{
    height:100%;background:linear-gradient(90deg,var(--copper),var(--copper-glow));
    border-radius:3px;transition:width .6s;
  }
  .ss-section{margin-top:18px}
  .ss-section h3{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:15px;color:var(--paper-warm);margin-bottom:12px;letter-spacing:0.06em;
  }
  .ss-row{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:12.5px;
  }
  .ss-row .k{color:var(--mist-soft);letter-spacing:0.04em}
  .ss-row .v{font-family:'JetBrains Mono',monospace;color:var(--paper);font-size:11.5px}

  /* ========== SETTINGS ========== */
  .set-root{padding:32px 38px;height:100%;overflow:auto}
  .set-section{margin-bottom:30px}
  .set-section h3{
    font-family:'Fraunces',serif;font-style:italic;font-size:16px;
    color:var(--paper);margin-bottom:14px;letter-spacing:0.06em;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .set-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
  .set-item .lab{font-size:13px;color:var(--paper-warm)}
  .set-item .desc{font-size:11px;color:var(--mist);margin-top:2px}
  .toggle{width:38px;height:20px;background:rgba(232,226,211,0.15);border-radius:10px;position:relative;cursor:pointer;transition:background .25s}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:left .25s}
  .toggle.on{background:var(--copper)}
  .toggle.on::after{left:20px}
  .danger-btn{padding:7px 16px;border:1px solid #d96868;color:#d96868;border-radius:6px;font-size:11.5px;letter-spacing:0.1em;transition:all .2s}
  .danger-btn:hover{background:rgba(217,104,104,0.12)}

  /* ========== CONTEXT MENU ========== */
  .ctx-menu{
    position:fixed;z-index:5000;min-width:170px;
    background:rgba(10,22,38,0.95);
    backdrop-filter:blur(20px);
    border:1px solid var(--line-strong);border-radius:8px;
    padding:6px;box-shadow:0 16px 40px rgba(0,0,0,0.6);
    font-size:12.5px;
  }
  .ctx-item{
    padding:7px 12px;border-radius:5px;cursor:pointer;
    display:flex;align-items:center;gap:10px;color:var(--paper-warm);
    letter-spacing:0.04em;
  }
  .ctx-item:hover{background:rgba(196,146,106,0.18);color:var(--copper-glow)}

<script>
/* =========================================================
   COOKIE HELPERS
   ========================================================= */
const Cookie = {
  set(k,v,days=365){
    const d=new Date();d.setTime(d.getTime()+days*86400000);
    document.cookie=`${k}=${encodeURIComponent(v)}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
  },
  get(k){
    const m=document.cookie.match(new RegExp('(^|;\\s*)'+k+'=([^;]*)'));
    return m?decodeURIComponent(m[2]):null;
  },
  del(k){document.cookie=`${k}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;}
};

/* =========================================================
   LOCAL STORAGE WRAPPER (with prefix + JSON)
   ========================================================= */
const LS = {
  set(k,v){try{localStorage.setItem('qs:'+k,JSON.stringify(v));}catch(e){}},
  get(k,def=null){try{const v=localStorage.getItem('qs:'+k);return v===null?def:JSON.parse(v);}catch(e){return def;}},
  del(k){localStorage.removeItem('qs:'+k);},
  // event broadcast across tabs
  emit(type,data){
    LS.set('event',{type,data,ts:Date.now(),id:Math.random()});
  }
};

/* =========================================================
   HYBRID FILE SYSTEM (OPFS + IndexedDB)
   ========================================================= */
class HybridFS {
  constructor(){
    this.dbName='qingsi_fs';
    this.dbVer=1;
    this.db=null;
    this.opfsRoot=null;
    this.useOPFS=false;
  }
  async init(){
    this.db = await this._openDB();
    await this._tryOPFS();
    const root = await this.getNode('/');
    if(!root){
      await this._putNode({path:'/',name:'',type:'folder',parent:null,created:Date.now(),modified:Date.now(),size:0});
      await this._seed();
    }
  }
  _openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(this.dbName, this.dbVer);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('nodes')){
          const s = db.createObjectStore('nodes',{keyPath:'path'});
          s.createIndex('parent','parent',{unique:false});
          s.createIndex('name','name',{unique:false});
        }
        if(!db.objectStoreNames.contains('blobs')){
          db.createObjectStore('blobs',{keyPath:'path'});
        }
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async _tryOPFS(){
    try{
      if('storage' in navigator && 'getDirectory' in navigator.storage){
        this.opfsRoot = await navigator.storage.getDirectory();
        this.useOPFS = true;
      }
    }catch(e){this.useOPFS=false;}
  }
  _parent(p){if(p==='/')return null;const i=p.lastIndexOf('/');return i===0?'/':p.substring(0,i);}
  _name(p){if(p==='/')return '';return p.substring(p.lastIndexOf('/')+1);}
  _join(parent,name){return parent==='/'?'/'+name:parent+'/'+name;}
  _norm(p){return p.replace(/\/+/g,'/').replace(/\/$/,'')||'/';}
  _detectType(name,blob){
    const ext = name.toLowerCase().split('.').pop();
    if(['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext))return 'image';
    if(['txt','md','json','js','css','html','xml','log','csv','yml','yaml'].includes(ext))return 'text';
    return 'binary';
  }
  _mime(name){
    const ext = name.toLowerCase().split('.').pop();
    const map = {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',txt:'text/plain',md:'text/markdown',json:'application/json',js:'text/javascript',css:'text/css',html:'text/html'};
    return map[ext]||'application/octet-stream';
  }

  /* ---------- low-level IDB ---------- */
  _tx(stores,mode='readonly'){return this.db.transaction(stores,mode);}
  _putNode(node){
    return new Promise((res,rej)=>{
      const r = this._tx(['nodes'],'readwrite').objectStore('nodes').put(node);
      r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
    });
  }
  _delNodeMeta(path){
    return new Promise((res,rej)=>{
      const r = this._tx(['nodes'],'readwrite').objectStore('nodes').delete(path);
      r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
    });
  }
  getNode(path){
    return new Promise((res,rej)=>{
      const r = this._tx(['nodes']).objectStore('nodes').get(this._norm(path));
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    });
  }
  getAllNodes(){
    return new Promise((res,rej)=>{
      const r = this._tx(['nodes']).objectStore('nodes').getAll();
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    });
  }
  listChildren(parent){
    parent=this._norm(parent);
    return new Promise((res,rej)=>{
      const r = this._tx(['nodes']).objectStore('nodes').index('parent').getAll(parent);
      r.onsuccess=()=>res(r.result.sort((a,b)=>{
        if(a.type!==b.type)return a.type==='folder'?-1:1;
        return a.name.localeCompare(b.name,'zh');
      }));
      r.onerror=()=>rej(r.error);
    });
  }
  exists(path){return this.getNode(path).then(n=>!!n);}

  /* ---------- blob storage ---------- */
  async _writeBlob(path,blob){
    if(this.useOPFS){
      try{
        const safe = 'f_' + btoa(unescape(encodeURIComponent(path))).replace(/[^a-zA-Z0-9]/g,'');
        const fh = await this.opfsRoot.getFileHandle(safe,{create:true});
        const w = await fh.createWritable();
        await w.write(blob);await w.close();
        return;
      }catch(e){console.warn('OPFS write fail, fallback IDB',e);}
    }
    return new Promise((res,rej)=>{
      const r = this._tx(['blobs'],'readwrite').objectStore('blobs').put({path,blob});
      r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
    });
  }
  async _readBlob(path){
    if(this.useOPFS){
      try{
        const safe = 'f_' + btoa(unescape(encodeURIComponent(path))).replace(/[^a-zA-Z0-9]/g,'');
        const fh = await this.opfsRoot.getFileHandle(safe);
        return await fh.getFile();
      }catch(e){/* fall through */}
    }
    return new Promise((res,rej)=>{
      const r = this._tx(['blobs']).objectStore('blobs').get(path);
      r.onsuccess=()=>res(r.result?r.result.blob:null);r.onerror=()=>rej(r.error);
    });
  }
  async _delBlob(path){
    if(this.useOPFS){
      try{
        const safe = 'f_' + btoa(unescape(encodeURIComponent(path))).replace(/[^a-zA-Z0-9]/g,'');
        await this.opfsRoot.removeEntry(safe);
      }catch(e){}
    }
    return new Promise((res)=>{
      const r = this._tx(['blobs'],'readwrite').objectStore('blobs').delete(path);
      r.onsuccess=()=>res();r.onerror=()=>res();
    });
  }

  /* ---------- high-level API ---------- */
  async mkdir(path){
    path=this._norm(path);
    if(await this.exists(path))throw new Error('已存在');
    const parent=this._parent(path);
    if(parent && !(await this.exists(parent))) await this.mkdir(parent);
    await this._putNode({path,name:this._name(path),type:'folder',parent,created:Date.now(),modified:Date.now(),size:0});
    LS.emit('fs:change',{path});
  }
  async writeFile(path,data){
    path=this._norm(path);
    let blob;
    if(data instanceof Blob)blob=data;
    else if(typeof data==='string')blob=new Blob([data],{type:'text/plain;charset=utf-8'});
    else blob=new Blob([data]);
    const parent=this._parent(path);
    if(parent && !(await this.exists(parent))) await this.mkdir(parent);
    const name=this._name(path);
    await this._writeBlob(path,blob);
    await this._putNode({
      path,name,type:this._detectType(name,blob),parent,
      created: (await this.getNode(path))?.created || Date.now(),
      modified:Date.now(),size:blob.size,mime:blob.type||this._mime(name)
    });
    LS.emit('fs:change',{path});
  }
  async readFile(path,asText=false){
    const blob = await this._readBlob(this._norm(path));
    if(!blob)return null;
    return asText?await blob.text():blob;
  }
  async delete(path){
    path=this._norm(path);
    const node = await this.getNode(path);
    if(!node)return;
    if(node.type==='folder'){
      const ch = await this.listChildren(path);
      for(const c of ch) await this.delete(c.path);
    }else{
      await this._delBlob(path);
    }
    await this._delNodeMeta(path);
    LS.emit('fs:change',{path,deleted:true});
  }
  async rename(path,newName){
    const node=await this.getNode(path);
    if(!node)throw new Error('未找到');
    const parent=node.parent;
    const newPath=this._join(parent,newName);
    if(await this.exists(newPath))throw new Error('同名已存在');
    await this.move(path,newPath);
  }
  async move(from,to){
    from=this._norm(from);to=this._norm(to);
    const node=await this.getNode(from);
    if(!node)throw new Error('源未找到');
    if(node.type==='folder'){
      const ch=await this.listChildren(from);
      await this._putNode({...node,path:to,name:this._name(to),parent:this._parent(to),modified:Date.now()});
      for(const c of ch){
        const newChildPath = to + c.path.substring(from.length);
        await this.move(c.path,newChildPath);
      }
      await this._delNodeMeta(from);
    }else{
      const blob = await this._readBlob(from);
      if(blob) await this._writeBlob(to,blob);
      await this._delBlob(from);
      await this._putNode({...node,path:to,name:this._name(to),parent:this._parent(to),modified:Date.now()});
      await this._delNodeMeta(from);
    }
    LS.emit('fs:change',{path:from});
  }
  async copy(from,to){
    from=this._norm(from);to=this._norm(to);
    const node=await this.getNode(from);
    if(!node)throw new Error('源未找到');
    if(node.type==='folder'){
      await this.mkdir(to);
      const ch=await this.listChildren(from);
      for(const c of ch){
        await this.copy(c.path, to + c.path.substring(from.length));
      }
    }else{
      const blob = await this._readBlob(from);
      await this.writeFile(to,blob);
    }
  }
  async search(q){
    const all = await this.getAllNodes();
    const ql = q.toLowerCase();
    return all.filter(n=>n.path!=='/' && n.name.toLowerCase().includes(ql));
  }
  async stats(){
    const all = await this.getAllNodes();
    let totalSize=0,fileCount=0,folderCount=0,typeCount={text:0,image:0,binary:0,folder:0};
    for(const n of all){
      if(n.path==='/')continue;
      typeCount[n.type]=(typeCount[n.type]||0)+1;
      if(n.type==='folder')folderCount++;
      else{fileCount++;totalSize+=n.size||0;}
    }
    let quota=null;
    try{
      if(navigator.storage && navigator.storage.estimate){
        quota = await navigator.storage.estimate();
      }
    }catch(e){}
    return {totalSize,fileCount,folderCount,typeCount,quota,useOPFS:this.useOPFS};
  }
  async _seed(){
    await this.mkdir('/诗稿');
    await this.mkdir('/图画');
    await this.mkdir('/笔记');
    await this.writeFile('/诗稿/江城子·乙卯正月二十日夜记梦.txt',
`十年生死两茫茫,
不思量,自难忘。
千里孤坟,无处话凄凉。
纵使相逢应不识,
尘满面,鬓如霜。

夜来幽梦忽还乡,
小轩窗,正梳妆。
相顾无言,惟有泪千行。
料得年年肠断处,
明月夜,短松冈。

—— 苏轼`);
    await this.writeFile('/诗稿/黄鹤楼.txt',
`昔人已乘黄鹤去,此地空余黄鹤楼。
黄鹤一去不复返,白云千载空悠悠。
晴川历历汉阳树,芳草萋萋鹦鹉洲。
日暮乡关何处是?烟波江上使人愁。

—— 崔颢`);
    await this.writeFile('/笔记/欢迎.md',
`# 欢迎来到 青絲 OS

这是一座以四种存储为骨架的网页操作系统。

## 四核架构
- **OPFS** — 真实文件落盘,大容量
- **IndexedDB** — 结构化元数据
- **localStorage** — 热缓存与跨标签同步
- **Cookie** — 身份与过期机制

## 应用
- 书阁 · 文件管理
- 笔砚 · 文本编辑
- 画轩 · 图像查看
- 终端 · 命令行
- 仓廪 · 存储统计
- 设置 · 偏好

将文件拖入书阁即可上传。所有数据真实留存于本机。`);
    await this.writeFile('/笔记/便笺.txt','落花人独立\n微雨燕双飞');
  }
}

/* =========================================================
   SVG ICON LIBRARY
   ========================================================= */
const ICON = {
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',
  file:'<path d="M14 3v4a1 1 0 0 0 1 1h4M5 3h9l5 5v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>',
  fileText:'<path d="M14 3v4a1 1 0 0 0 1 1h4M5 3h9l5 5v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM8 13h7M8 17h5M8 9h2"/>',
  fileImage:'<path d="M14 3v4a1 1 0 0 0 1 1h4M5 3h9l5 5v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM9 12.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM5 19l4-4 3 3 5-5"/>',
  fileBin:'<path d="M14 3v4a1 1 0 0 0 1 1h4M5 3h9l5 5v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM7 13h2M7 17h2M11 13h2M11 17h2M15 13h2M15 17h2"/>',
  home:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',

/* =========================================================
   RAIN ON GLASS CANVAS EFFECT
   ========================================================= */
class RainFX {
  constructor(canvas){
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.drops = [];
    this.trails = [];
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    this.spawn();
    this.loop();
  }
  resize(){
    this.c.width = window.innerWidth;
    this.c.height = window.innerHeight;
    this.W = this.c.width; this.H = this.c.height;
  }
  spawn(){
    // initial static droplets
    for(let i=0;i<60;i++){
      this.drops.push(this.makeDrop(true));
    }
  }
  makeDrop(isStatic=false){
    const r = isStatic ? Math.random()*5+2 : Math.random()*10+6;
    return {
      x: Math.random()*this.W,
      y: Math.random()*this.H,
      r,
      vy: isStatic ? 0 : 0,
      static: isStatic,
      life: 1,
      sliding: false,
      slideAccel: 0.04 + Math.random()*0.05,
    };
  }
  drawDrop(d){
    const ctx = this.ctx;
    const grd = ctx.createRadialGradient(d.x-d.r*0.3,d.y-d.r*0.3,d.r*0.1, d.x,d.y,d.r);
    grd.addColorStop(0,`rgba(180,210,235,${0.55*d.life})`);
    grd.addColorStop(0.4,`rgba(120,160,200,${0.32*d.life})`);
    grd.addColorStop(0.85,`rgba(40,80,120,${0.18*d.life})`);
    grd.addColorStop(1,`rgba(20,40,70,${0.08*d.life})`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fill();
    // highlight
    ctx.fillStyle = `rgba(255,255,255,${0.4*d.life})`;
    ctx.beginPath();
    ctx.arc(d.x-d.r*0.35, d.y-d.r*0.4, d.r*0.18, 0, Math.PI*2);
    ctx.fill();
  }
  loop(){
    const ctx = this.ctx;
    ctx.clearRect(0,0,this.W,this.H);

    // occasionally spawn a sliding drop
    if(Math.random()<0.03 && this.drops.filter(d=>d.sliding).length<8){
      const d = this.makeDrop(false);
      d.sliding = true;
      this.drops.push(d);
    }
    // occasionally spawn a static droplet
    if(Math.random()<0.05 && this.drops.length<120){
      this.drops.push(this.makeDrop(true));
    }

    for(let i=this.drops.length-1;i>=0;i--){
      const d = this.drops[i];
      if(d.sliding){
        d.vy += d.slideAccel;
        d.y += d.vy;
        // leave trail
        if(Math.random()<0.4){
          this.drops.push({
            x: d.x + (Math.random()-0.5)*d.r*0.4,
            y: d.y - d.r*0.6,
            r: d.r * (0.25 + Math.random()*0.25),
            static: true,
            life: 0.7,
            sliding: false,
          });
        }
        // absorb static drops in path
        for(let j=this.drops.length-1;j>=0;j--){
          if(j===i)continue;
          const o = this.drops[j];
          if(!o.static)continue;
          const dx = o.x-d.x, dy = o.y-d.y;
          if(Math.abs(dx)<d.r*1.2 && dy>-d.r && dy<d.r*1.5){
            d.r = Math.min(d.r+o.r*0.15, 18);
            this.drops.splice(j,1);
            if(j<i)i--;
          }
        }
        if(d.y > this.H + 20){this.drops.splice(i,1);continue;}
      }else{
        // static fade slowly
        d.life -= 0.0008;
        if(d.life <= 0){this.drops.splice(i,1);continue;}
      }
      this.drawDrop(d);
    }

    requestAnimationFrame(()=>this.loop());
  }
}

/* =========================================================
   WINDOW MANAGER
   ========================================================= */
const WM = {
  windows: new Map(),
  zIndex: 100,
  open(id, opts){
    if(this.windows.has(id)){
      this.focus(id);
      return this.windows.get(id);
    }
    const w = document.createElement('div');
    w.className = 'window';
    w.dataset.id = id;
    const W = opts.width||720, H = opts.height||480;
    w.style.width = W+'px';
    w.style.height = H+'px';
    const x = opts.x ?? (window.innerWidth/2 - W/2 + (Math.random()*60-30));
    const y = opts.y ?? (window.innerHeight/2 - H/2 + (Math.random()*40-20));
    w.style.left = Math.max(20,x)+'px';
    w.style.top = Math.max(40,y)+'px';
    w.style.zIndex = ++this.zIndex;

    w.innerHTML = `
      <div class="window-titlebar">
        <div class="window-controls">
          <div class="wc close" data-act="close"></div>
          <div class="wc min" data-act="min"></div>
          <div class="wc max" data-act="max"></div>
        </div>
        <div class="window-title"><span class="cn">${opts.titleCN||''}</span><span>${opts.title||''}</span></div>
      </div>
      <div class="window-body"></div>
    `;
    document.getElementById('windows').appendChild(w);
    const body = w.querySelector('.window-body');
    if(opts.html)body.innerHTML = opts.html;
    if(opts.onMount)opts.onMount(body, w);

    // controls
    w.querySelector('[data-act="close"]').onclick = (e)=>{e.stopPropagation();this.close(id);};
    w.querySelector('[data-act="min"]').onclick = (e)=>{e.stopPropagation();this.minimize(id);};
    w.querySelector('[data-act="max"]').onclick = (e)=>{e.stopPropagation();this.maximize(id);};

    // drag
    const tb = w.querySelector('.window-titlebar');
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    tb.onmousedown = (e)=>{
      if(e.target.classList.contains('wc'))return;
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = parseInt(w.style.left); oy = parseInt(w.style.top);
      this.focus(id);
      document.body.style.userSelect='none';
    };
    document.addEventListener('mousemove',(e)=>{
      if(!dragging)return;
      w.style.left = (ox + e.clientX - sx)+'px';
      w.style.top = Math.max(34, oy + e.clientY - sy)+'px';
    });
    document.addEventListener('mouseup',()=>{dragging=false;document.body.style.userSelect='';});

    w.onmousedown = ()=>this.focus(id);
    this.windows.set(id, {el:w, opts});
    this.updateDock();
    return w;
  },
  focus(id){
    const w = this.windows.get(id);
    if(!w)return;
    w.el.style.zIndex = ++this.zIndex;
    w.el.classList.remove('minimized');
  },
  close(id){
    const w = this.windows.get(id);
    if(!w)return;
    if(w.opts.onClose)w.opts.onClose();
    w.el.remove();
    this.windows.delete(id);
    this.updateDock();
  },
  minimize(id){
    const w = this.windows.get(id);
    if(!w)return;
    w.el.classList.add('minimized');
  },
  maximize(id){
    const w = this.windows.get(id);
    if(!w)return;
    if(w.maxed){
      Object.assign(w.el.style, w.prevState);
      w.maxed = false;
    }else{
      w.prevState = {left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height};
      Object.assign(w.el.style,{left:'10px',top:'44px',width:(window.innerWidth-20)+'px',height:(window.innerHeight-120)+'px'});
      w.maxed = true;
    }
  },
  updateDock(){
    document.querySelectorAll('.dock-item').forEach(i=>{
      const id = i.dataset.appid;
      i.classList.toggle('active', this.windows.has(id));
    });
  }
};

/* =========================================================
   TOAST + MODAL
   ========================================================= */
function toast(title, msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  el.innerHTML = `<div class="t">${title}</div><div>${msg||''}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),300);},3000);
}
function modal(opts){
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className='modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <h3>${opts.title}</h3>
        <p>${opts.message||''}</p>
        ${opts.input!==undefined?`<input type="text" value="${opts.input||''}" placeholder="${opts.placeholder||''}" />`:''}
        <div class="modal-actions">
          ${opts.cancel!==false?`<button class="secondary">${opts.cancelText||'取消'}</button>`:''}
          <button class="primary">${opts.confirmText||'确定'}</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    const input = bg.querySelector('input');
    if(input){input.focus();input.select();}
    const close = (val)=>{bg.remove();resolve(val);};
    const buttons = bg.querySelectorAll('button');
    if(opts.cancel!==false){
      buttons[0].onclick = ()=>close(null);
      buttons[1].onclick = ()=>close(input?input.value:true);
    }else{
      buttons[0].onclick = ()=>close(input?input.value:true);
    }
    bg.onkeydown = (e)=>{
      if(e.key==='Enter')close(input?input.value:true);
      if(e.key==='Escape')close(null);
    };
    if(input)input.onkeydown = bg.onkeydown;
  });
}

/* =========================================================
   CONTEXT MENU
   ========================================================= */
function ctxMenu(x,y,items){
  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  const m = document.createElement('div');
  m.className = 'ctx-menu';
  m.innerHTML = items.map(it=>{
    if(it.divider)return '<div class="ctx-divider"></div>';
    return `<div class="ctx-item" data-key="${it.key}">${svg(it.icon||'file',13)}<span>${it.label}</span></div>`;
  }).join('');
  m.style.left = x+'px';
  m.style.top = y+'px';
  document.body.appendChild(m);
  // adjust position
  const rect = m.getBoundingClientRect();
  if(rect.right > window.innerWidth) m.style.left = (window.innerWidth-rect.width-8)+'px';
  if(rect.bottom > window.innerHeight) m.style.top = (window.innerHeight-rect.height-8)+'px';
  m.querySelectorAll('.ctx-item').forEach(el=>{
    el.onclick = ()=>{
      const it = items.find(i=>i.key===el.dataset.key);
      m.remove();
      if(it && it.action)it.action();
    };
  });
  setTimeout(()=>{
    document.addEventListener('click',function rm(){m.remove();document.removeEventListener('click',rm);},{once:true});
  },10);
}

      for(const f of files){
        await this.handleFile(f);
      }
      this.refresh();
      toast('入库','已收 '+files.length+' 笺','ok');
    };
    content.oncontextmenu = (e)=>{
      if(e.target===content || e.target.id==='fm-content'){
        e.preventDefault();
        ctxMenu(e.clientX,e.clientY,[
          {key:'newfolder',icon:'newFolder',label:'新建文件夹',action:()=>this.newFolder()},
          {key:'newfile',icon:'newFile',label:'新建文件',action:()=>this.newFile()},
          {divider:true},
          {key:'paste',icon:'copy',label:'粘贴',action:()=>this.paste()},
          {key:'refresh',icon:'refresh',label:'刷新',action:()=>this.refresh()}
        ]);
      }
    };
  },
  async handleFile(file){
    const dest = QingSi.fs._join(this.state.path, file.name);
    let target = dest;
    let i = 1;
    while(await QingSi.fs.exists(target)){
      const dot = file.name.lastIndexOf('.');
      const base = dot>0?file.name.substring(0,dot):file.name;
      const ext = dot>0?file.name.substring(dot):'';
      target = QingSi.fs._join(this.state.path, `${base} (${i})${ext}`);
      i++;
    }
    await QingSi.fs.writeFile(target, file);
  },

    const win = WM.windows.get('filemanager');
    if(!win)return;
    const body = win.el.querySelector('.window-body');
    const content = body.querySelector('#fm-content');
    const status = body.querySelector('#fm-status');

    }).join('');
    pathEl.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{this.state.path=s.dataset.p;this.refresh();});

    // sidebar active
    body.querySelectorAll('.fm-side .item').forEach(i=>{
      i.classList.toggle('active', i.dataset.path === this.state.path);
    });

    let items;
    if(this.state.query){
      items = await QingSi.fs.search(this.state.query);

      items = await QingSi.fs.listChildren(this.state.path);
    }

    if(items.length === 0){
      content.innerHTML = `

      const grid = content.querySelector('.fm-grid');

        const el = document.createElement('div');
        el.className = 'fm-item ' + node.type;

            this.state.selected.clear();
          }
          el.classList.add('selected');
          this.state.selected.add(node.path);
        };
        el.oncontextmenu = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          el.classList.add('selected');
          this.state.selected.clear();
          this.state.selected.add(node.path);
          ctxMenu(e.clientX,e.clientY,[
            {key:'open',icon:'forward',label:'打开',action:()=>this.openItem(node)},
            {key:'rename',icon:'edit',label:'重命名',action:()=>this.rename(node)},
            {divider:true},
            {key:'copy',icon:'copy',label:'复制',action:()=>{this.state.clipboard={op:'copy',path:node.path};toast('已复制',node.name);}},
            {key:'cut',icon:'cut',label:'剪切',action:()=>{this.state.clipboard={op:'cut',path:node.path};toast('已剪切',node.name);}},
            {key:'paste',icon:'copy',label:'粘贴',action:()=>this.paste()},
            {divider:true},
            {key:'download',icon:'download',label:'下载',action:()=>this.download(node)},
            {key:'delete',icon:'trash',label:'删除',action:()=>this.delete(node)}
          ]);
        };
        grid.appendChild(el);
      });
    }
    const totalSize = items.reduce((a,b)=>a+(b.size||0),0);
    status.textContent = `${items.length} ITEM${items.length!==1?'S':''} · ${fmtBytes(totalSize)} · ${QingSi.fs.useOPFS?'OPFS':'IDB'}`;
  },
  async refreshRecent(){
    const recentBox = document.querySelector('#fm-recent');
    if(!recentBox)return;
    const recent = LS.get('recent',[]);
    recentBox.innerHTML = recent.slice(0,5).map(p=>{
      const name = p.substring(p.lastIndexOf('/')+1)||'/';
      return `<div class="item" data-path="${p}">${svg('fileText',14)}<span class="truncate">${name}</span></div>`;
    }).join('') || `<div style="font-size:11px;color:var(--mist);padding:4px 10px;opacity:0.6">尚无</div>`;
    recentBox.querySelectorAll('.item').forEach(i=>{
      i.onclick = async ()=>{
        const node = await QingSi.fs.getNode(i.dataset.path);
        if(node)this.openItem(node);
      };
    });
  },
  async openItem(node){
    if(node.type==='folder'){
      this.state.path = node.path;
      this.refresh();
    }else{
      // record recent
      const recent = LS.get('recent',[]).filter(p=>p!==node.path);
      recent.unshift(node.path);
      LS.set('recent',recent.slice(0,10));
      this.refreshRecent();
      if(node.type==='text'){
        Editor.open(node.path);
      }else if(node.type==='image'){
        ImageViewer.open(node.path);
      }else{
        this.download(node);
      }
    }
  },
  goUp(){
    if(this.state.path==='/')return;
    const parent = QingSi.fs._parent(this.state.path);
    this.state.path = parent || '/';
    this.refresh();
  },
  async newFolder(){
    const name = await modal({title:'新建文件夹',message:'为这间小阁起个名字',input:'',placeholder:'未命名'});
    if(!name)return;
    try{
      await QingSi.fs.mkdir(QingSi.fs._join(this.state.path,name));
      this.refresh();
    }catch(e){toast('创建失败',e.message,'err');}
  },
  async newFile(){
    const name = await modal({title:'新建文件',message:'起个雅致的名字,带 .txt 后缀以便编辑',input:'未命名.txt'});
    if(!name)return;
    try{
      const path = QingSi.fs._join(this.state.path,name);
      if(await QingSi.fs.exists(path))throw new Error('同名已存在');
      await QingSi.fs.writeFile(path,'');
      this.refresh();
      const node = await QingSi.fs.getNode(path);
      this.openItem(node);
    }catch(e){toast('创建失败',e.message,'err');}
  },
  upload(){
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.onchange = async ()=>{
      for(const f of input.files){await this.handleFile(f);}
      this.refresh();
      toast('入库','已收 '+input.files.length+' 笺','ok');
    };
    input.click();
  },
  async paste(){
    if(!this.state.clipboard){toast('剪贴板为空','','err');return;}
    const {op,path} = this.state.clipboard;
    const name = QingSi.fs._name(path);
    let dest = QingSi.fs._join(this.state.path, name);
    let i = 1;
    while(await QingSi.fs.exists(dest)){
      const dot = name.lastIndexOf('.');
      const base = dot>0?name.substring(0,dot):name;
      const ext = dot>0?name.substring(dot):'';
      dest = QingSi.fs._join(this.state.path, `${base} (${i})${ext}`);
      i++;
    }
    try{
      if(op==='copy'){await QingSi.fs.copy(path,dest);}
      else{await QingSi.fs.move(path,dest);this.state.clipboard=null;}
      this.refresh();
    }catch(e){toast('粘贴失败',e.message,'err');}
  },
  async rename(node){
    const newName = await modal({title:'重命名',message:'起个新名字',input:node.name});
    if(!newName || newName===node.name)return;
    try{
      await QingSi.fs.rename(node.path,newName);
      this.refresh();
    }catch(e){toast('重命名失败',e.message,'err');}
  },
  async delete(node){
    const ok = await modal({title:'付之一炬?',message:`确定删除「${node.name}」?这一动便再难寻回。`,confirmText:'删除'});
    if(!ok)return;
    try{
      await QingSi.fs.delete(node.path);
      this.refresh();
      toast('已删除',node.name);
    }catch(e){toast('删除失败',e.message,'err');}
  },
  async download(node){
    if(node.type==='folder'){toast('提示','文件夹暂不支持下载','err');return;}
    const blob = await QingSi.fs.readFile(node.path);
    if(!blob)return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = node.name; a.click();
    URL.revokeObjectURL(url);
  }
};

/* =========================================================
   EDITOR APP
   ========================================================= */
const Editor = {
  async open(path){
    const id = 'editor:'+path;
    if(WM.windows.has(id)){WM.focus(id);return;}
    const node = await QingSi.fs.getNode(path);
    if(!node)return;
    let content = await QingSi.fs.readFile(path,true) || '';
    const draft = LS.get('draft:'+path);
    if(draft && draft.content && draft.content !== content){
      const restore = await modal({title:'发现未存草稿',message:`上次有未保存的字句,是否恢复?`,confirmText:'恢复',cancelText:'丢弃'});
      if(restore){content = draft.content;}
      else{LS.del('draft:'+path);}
    }

    let dirty = false;
    let saveTimer = null;

    WM.open(id,{
      title:'Brush Inkstone', titleCN:'筆硯',
      width:680, height:520,
      onMount:(body,win)=>{
        body.innerHTML = `
          <div class="ed-root">
            <div class="ed-toolbar">
              <div class="filename">${node.name}</div>
              <div class="saved" id="ed-saved">已藏</div>
              <button class="ed-btn" data-act="save">藏</button>
            </div>
            <textarea class="ed-textarea" spellcheck="false">${content.replace(/</g,'&lt;')}</textarea>
            <div class="ed-status"><span id="ed-stats">—</span><span>${path}</span></div>
          </div>
        `;
        const ta = body.querySelector('textarea');
        const savedEl = body.querySelector('#ed-saved');
        const statsEl = body.querySelector('#ed-stats');
        const updateStats = ()=>{
          const v = ta.value;
          statsEl.textContent = `${v.length} CHARS · ${v.split('\n').length} LINES`;
        };
        updateStats();
        ta.focus();
        ta.oninput = ()=>{
          dirty = true;
          savedEl.textContent='未藏';savedEl.classList.add('dirty');
          updateStats();
          // draft auto-save to localStorage
          clearTimeout(saveTimer);
          saveTimer = setTimeout(()=>{
            LS.set('draft:'+path,{content:ta.value,ts:Date.now()});
          },400);
        };
        const doSave = async ()=>{
          await QingSi.fs.writeFile(path, ta.value);
          dirty = false;
          savedEl.textContent='已藏';savedEl.classList.remove('dirty');
          LS.del('draft:'+path);
          toast('收墨入纸',node.name,'ok');
        };
        body.querySelector('[data-act="save"]').onclick = doSave;
        ta.onkeydown = (e)=>{
          if((e.ctrlKey||e.metaKey) && e.key==='s'){e.preventDefault();doSave();}
        };
      },
      onClose: async ()=>{
        if(dirty){
          // keep draft for next time
        }
      }
    });
  }
};

/* =========================================================
   TERMINAL APP
   ========================================================= */
const Terminal = {
  open(){
    const id = 'terminal';
    if(WM.windows.has(id)){WM.focus(id);return;}
    let cwd = '/';
    let history = [];
    let histIdx = -1;

    WM.open(id,{
      title:'Terminal', titleCN:'終端',
      width:680, height:440,
      onMount:(body)=>{
        body.innerHTML = `
          <div class="term-root">
            <div class="term-output" id="term-out"></div>
            <div class="term-input-line">
              <span class="pmt" id="term-pmt">青絲 ~/></span>
              <input class="term-input" id="term-in" autofocus />
            </div>
          </div>
        `;
        const out = body.querySelector('#term-out');
        const inp = body.querySelector('#term-in');
        const pmt = body.querySelector('#term-pmt');
        const print = (text, cls='') => {
          const div = document.createElement('div');
          div.className = 'line '+cls;
          div.textContent = text;
          out.appendChild(div);
          out.scrollTop = out.scrollHeight;
        };
        const updatePrompt = () => {pmt.textContent = `青絲 ${cwd}>`;};
        updatePrompt();

        print('青絲 OS · 終端 · v1.0', 'info');
        print('type "help" for commands', 'dim');
        print('');

        const resolve = (p) => {
          if(!p)return cwd;
          if(p.startsWith('/'))return QingSi.fs._norm(p);
          if(p==='..')return QingSi.fs._parent(cwd) || '/';
          if(p==='.')return cwd;
          // handle ../foo
          let parts = p.split('/');
          let path = cwd;
          for(const part of parts){
            if(part==='..')path = QingSi.fs._parent(path) || '/';
            else if(part==='.' || part==='') continue;
            else path = QingSi.fs._join(path, part);
          }
          return path;
        };

        const commands = {
          async help(){
            print('available commands:', 'info');
            print('  ls [path]            list contents');
            print('  cd <path>            change directory');
            print('  pwd                  current path');
            print('  cat <file>           print file contents');
            print('  touch <file>         create empty file');
            print('  echo "text" > file   write text to file');
            print('  mkdir <path>         create directory');
            print('  rm <path>            remove file or folder');
            print('  mv <src> <dst>       move/rename');
            print('  cp <src> <dst>       copy');
            print('  tree                 directory tree');
            print('  find <query>         search by name');
            print('  stat                 storage statistics');
            print('  clear                clear screen');
          },
          async ls(args){
            const p = resolve(args[0]||'');
            const items = await QingSi.fs.listChildren(p);
            if(items.length===0){print('(empty)','dim');return;}
            const max = Math.max(...items.map(i=>i.name.length));
            items.forEach(i=>{
              const tag = i.type==='folder'?'/':' ';
              const size = i.type==='folder'?'    -':String(i.size||0).padStart(5);
              print(`${i.name.padEnd(max+2)}${tag} ${size}  ${new Date(i.modified).toLocaleString('zh-CN')}`);
            });
          },
          async cd(args){
            const p = resolve(args[0]||'/');
            const node = await QingSi.fs.getNode(p);
            if(!node || node.type!=='folder'){print('not a directory: '+p,'err');return;}
            cwd = p;
            updatePrompt();
          },
          async pwd(){print(cwd);},
          async cat(args){
            if(!args[0]){print('usage: cat <file>','err');return;}
            const p = resolve(args[0]);
            const text = await QingSi.fs.readFile(p,true);
            if(text===null){print('not found: '+p,'err');return;}
            print(text);
          },
          async touch(args){
            if(!args[0]){print('usage: touch <file>','err');return;}
            const p = resolve(args[0]);
            await QingSi.fs.writeFile(p,'');
            print('created: '+p,'ok');
          },
          async mkdir(args){
            if(!args[0]){print('usage: mkdir <path>','err');return;}
            const p = resolve(args[0]);
            try{await QingSi.fs.mkdir(p);print('created: '+p,'ok');}
            catch(e){print(e.message,'err');}
          },
          async rm(args){
            if(!args[0]){print('usage: rm <path>','err');return;}
            const p = resolve(args[0]);
            await QingSi.fs.delete(p);
            print('removed: '+p,'ok');
          },
          async mv(args){
            if(args.length<2){print('usage: mv <src> <dst>','err');return;}
            try{await QingSi.fs.move(resolve(args[0]),resolve(args[1]));print('moved','ok');}
            catch(e){print(e.message,'err');}
          },
          async cp(args){
            if(args.length<2){print('usage: cp <src> <dst>','err');return;}
            try{await QingSi.fs.copy(resolve(args[0]),resolve(args[1]));print('copied','ok');}
            catch(e){print(e.message,'err');}
          },
          async tree(args){
            const root = resolve(args[0]||cwd);
            const walk = async (p, prefix='')=>{
              const items = await QingSi.fs.listChildren(p);
              for(let i=0;i<items.length;i++){
                const last = i===items.length-1;
                const branch = last?'└── ':'├── ';
                print(prefix + branch + items[i].name + (items[i].type==='folder'?'/':''));
                if(items[i].type==='folder'){
                  await walk(items[i].path, prefix + (last?'    ':'│   '));
                }
              }
            };
            print(root);
            await walk(root);
          },
          async find(args){
            if(!args[0]){print('usage: find <query>','err');return;}
            const results = await QingSi.fs.search(args[0]);
            if(results.length===0){print('no matches','dim');return;}
            results.forEach(r=>print(r.path));
          },
          async stat(){
            const s = await QingSi.fs.stats();
            print(`files:    ${s.fileCount}`,'info');
            print(`folders:  ${s.folderCount}`,'info');
            print(`size:     ${fmtBytes(s.totalSize)}`,'info');
            print(`kernel:   ${s.useOPFS?'OPFS + IDB':'IDB only'}`,'info');
            if(s.quota){
              print(`browser:  ${fmtBytes(s.quota.usage||0)} / ${fmtBytes(s.quota.quota||0)}`,'info');
            }
          },
          async clear(){out.innerHTML='';},
          async echo(args, raw){
            // handle echo "text" > file
            const m = raw.match(/^echo\s+(.+?)\s*>\s*(\S+)$/);
            if(m){
              let text = m[1];
              if((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))){
                text = text.substring(1,text.length-1);
              }
              const p = resolve(m[2]);
              await QingSi.fs.writeFile(p, text);
              print('written: '+p,'ok');
            }else{
              print(args.join(' '));
            }
          }
        };

        const exec = async (line)=>{
          if(!line.trim())return;
          print(`${pmt.textContent} ${line}`,'prompt');
          history.push(line); histIdx = history.length;
          const parts = line.trim().split(/\s+/);
          const cmd = parts[0];
          const args = parts.slice(1);
          if(commands[cmd]){
            try{await commands[cmd](args, line);}
            catch(e){print(e.message,'err');}
          }else{
            print('unknown command: '+cmd, 'err');
          }
        };

        inp.onkeydown = async (e)=>{
          if(e.key==='Enter'){
            const line = inp.value;
            inp.value = '';
            await exec(line);
          }else if(e.key==='ArrowUp'){
            e.preventDefault();
            if(histIdx>0){histIdx--;inp.value=history[histIdx];}
          }else if(e.key==='ArrowDown'){
            e.preventDefault();
            if(histIdx<history.length-1){histIdx++;inp.value=history[histIdx];}
            else{histIdx=history.length;inp.value='';}
          }
        };
        body.onclick = ()=>inp.focus();
      }
    });
  }
};

                <div><div class="lab">清空所有文件</div><div class="desc">一动便难寻回</div></div>
                <button class="danger-btn" data-act="clear-all">清空</button>
              </div>
            </div>
            <div class="set-section">
              <h3>About</h3>
              <p style="font-size:12.5px;color:var(--mist-soft);line-height:1.7;font-family:'Cormorant Garamond','Noto Serif SC',serif;">
                青絲 OS · QuadCore Edition<br>
                <span style="font-style:italic;color:var(--mist)">"任凭浏览器风云变幻,我自岿然不动。"</span>
              </p>
            </div>
          </div>
        `;
        body.querySelectorAll('.toggle').forEach(t=>{
          t.onclick = ()=>{
            t.classList.toggle('on');
            const on = t.classList.contains('on');
            const key = t.dataset.key;
            LS.set('pref:'+key, on);
            if(key==='rain'){document.getElementById('rain-canvas').style.display = on?'':'none';}
            if(key==='grain'){document.getElementById('grain').style.display = on?'':'none';}
          };
        });
        body.querySelector('#usercookie').onchange = (e)=>{
          Cookie.set('qs_user', e.target.value);
          toast('已记住','身份已存入 Cookie','ok');
        };
        body.querySelector('[data-act="clear-ls"]').onclick = async ()=>{
          const ok = await modal({title:'清空缓存?',message:'localStorage 中的偏好、草稿、最近列表会被清除。',confirmText:'清空'});
          if(!ok)return;
          for(let i=localStorage.length-1;i>=0;i--){
            const k = localStorage.key(i);
            if(k && k.startsWith('qs:'))localStorage.removeItem(k);
          }
          toast('已清空','localStorage 已清空','ok');
        };
        body.querySelector('[data-act="clear-all"]').onclick = async ()=>{
          const ok = await modal({title:'付之一炬?',message:'所有文件、所有元数据都将消失。',confirmText:'确定清空'});
          if(!ok)return;
          const all = await QingSi.fs.getAllNodes();
          for(const n of all){if(n.path!=='/')await QingSi.fs.delete(n.path);}
          toast('清空','文件系统已重置','ok');
        };
      }
    });
  }
};

/* =========================================================
   UTILITIES
   ========================================================= */
function fmtBytes(b){
  if(b<1024)return b+' B';
  if(b<1024*1024)return (b/1024).toFixed(1)+' KB';
  if(b<1024*1024*1024)return (b/1024/1024).toFixed(1)+' MB';
  return (b/1024/1024/1024).toFixed(2)+' GB';
}

/* =========================================================
   DESKTOP & DOCK
   ========================================================= */
const APPS = [
  {id:'filemanager', name:'书阁', icon:'archive', open:()=>FileManager.open()},
  {id:'editor-launch', name:'笔砚', icon:'pen', open:async ()=>{
    // open a quick scratch file
    const p = '/笔记/便笺.txt';
    if(!(await QingSi.fs.exists(p))) await QingSi.fs.writeFile(p,'');
    Editor.open(p);
  }},
  {id:'image-launch', name:'画轩', icon:'image', open:()=>{
    FileManager.open();
    setTimeout(()=>{FileManager.state.path='/图画';FileManager.refresh();},100);
  }},
  {id:'terminal', name:'终端', icon:'terminal', open:()=>Terminal.open()},
  {id:'stats', name:'仓廪', icon:'database', open:()=>StatsApp.open()},
  {id:'settings', name:'设置', icon:'settings', open:()=>SettingsApp.open()}
];

function renderDesktop(){
  const desk = document.getElementById('desktop');
  desk.innerHTML = APPS.map(app=>`
    <div class="desk-icon" data-id="${app.id}">
      <div class="ic">${svg(app.icon,26)}</div>
      <div class="lbl">${app.name}</div>
    </div>
  `).join('');
  desk.querySelectorAll('.desk-icon').forEach(el=>{
    el.ondblclick = ()=>{
      const app = APPS.find(a=>a.id===el.dataset.id);
      if(app)app.open();
    };
    el.onclick = (e)=>{e.stopPropagation();};
  });
}
function renderDock(){
  const dock = document.getElementById('dock');
  dock.innerHTML = APPS.map(app=>`
    <div class="dock-item" data-appid="${app.id==='filemanager'?'filemanager':app.id==='terminal'?'terminal':app.id==='stats'?'stats':app.id==='settings'?'settings':app.id}">
      ${svg(app.icon,24)}
      <div class="tip">${app.name}</div>
    </div>
  `).join('');
  dock.querySelectorAll('.dock-item').forEach((el,i)=>{
    el.onclick = ()=>APPS[i].open();
  });
}

/* =========================================================
   MAIN
   ========================================================= */
const QingSi = {fs:null};

async function main(){
  // Init FS
  QingSi.fs = new HybridFS();
  await QingSi.fs.init();

  // Topbar OPFS dot
  if(!QingSi.fs.useOPFS) document.getElementById('opfs-dot').classList.add('idle');

  // Render desktop & dock
  renderDesktop();
  renderDock();

  // Rain effect
  const rainPref = LS.get('pref:rain', true);
  if(rainPref) new RainFX(document.getElementById('rain-canvas'));
  else document.getElementById('rain-canvas').style.display='none';
  if(!LS.get('pref:grain', true))document.getElementById('grain').style.display='none';

  // Clock
  const clockEl = document.getElementById('clock');
  const updateClock = ()=>{
    const d = new Date();
    const t = d.toTimeString().substring(0,5);
    const ds = (d.getMonth()+1)+'.'+d.getDate();
    clockEl.textContent = ds + ' · ' + t;
  };
  updateClock();
  setInterval(updateClock,30000);

  // Storage stat update
  const updateStorage = async ()=>{
    try{
      const s = await navigator.storage.estimate();
      const used = fmtBytes(s.usage||0);
      const total = fmtBytes(s.quota||0);
      document.getElementById('storage-info').textContent = used + ' / ' + total;
    }catch(e){}
  };
  updateStorage();
  setInterval(updateStorage,15000);

  // Cross-tab sync
  window.addEventListener('storage',(e)=>{
    if(e.key==='qs:event'){
      try{
        const evt = JSON.parse(e.newValue);
        if(evt.type==='fs:change'){
          if(WM.windows.has('filemanager')) FileManager.refresh();
          toast('远方信','它处亦动笔','info');
        }
      }catch(err){}
    }
  });

  // Welcome (first time, via cookie)
  if(!Cookie.get('qs_welcomed')){
    Cookie.set('qs_welcomed','1',365);
    setTimeout(()=>{
      WM.open('welcome',{
        title:'Welcome', titleCN:'初見',
        width:460, height:340,
        onMount:(body)=>{
          body.innerHTML = `
            <div class="welcome-poem">
              青絲一縷<br>
              四劍合璧<br>
              <span class="small">OPFS · IndexedDB · localStorage · Cookie</span>
              <span class="small" style="margin-top:24px;color:var(--paper-warm);font-family:'Cormorant Garamond','Noto Serif SC',serif;font-style:normal;font-size:13px;letter-spacing:0.06em">
                双击桌面图标启程<br>
                拖拽文件入「书阁」即藏
              </span>
            </div>
          `;
        }
      });
    },800);
  }

  // hide boot screen
  setTimeout(()=>{
    const boot = document.getElementById('boot');
    boot.style.opacity='0';
    setTimeout(()=>boot.remove(),800);
  },1200);
}

main().catch(err=>{
  console.error(err);
  document.getElementById('boot').innerHTML = '<div style="color:#d96868;font-family:JetBrains Mono">INIT FAILED: '+err.message+'</div>';
});
</script>
</body>
</html>
