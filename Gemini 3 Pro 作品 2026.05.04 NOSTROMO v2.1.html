<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOSTROMO Tactical System | Web OS</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- JSZip for archive extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-primary: #06080a;
            --bg-secondary: #0c1014;
            --bg-panel: #11161d;
            --border-glow: #0df5e3;
            --accent-cyan: #0df5e3;
            --accent-amber: #f59e0b;
            --text-muted: #64748b;
            --text-main: #e2e8f0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
        }

        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace;
        }

        .font-code {
            font-family: 'Fira Code', monospace;
        }

        /* Cyberpunk Grid Background */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(13, 245, 227, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(13, 245, 227, 0.03) 1px, transparent 1px);
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .cyber-vignette {
            background: radial-gradient(circle, transparent 40%, rgba(6, 8, 10, 0.9) 100%);
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* CRT Scanlines Overlay Toggle */
        .crt-active::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            animation: crt-flicker 0.15s infinite;
        }

        @keyframes crt-flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(17, 22, 29, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(13, 245, 227, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(13, 245, 227, 0.6);
        }

        /* Drag Selection Box */
        .selection-box {
            position: absolute;
            border: 1px dashed var(--accent-cyan);
            background: rgba(13, 245, 227, 0.08);
            pointer-events: none;
            z-index: 1000;
        }

        /* Window Styling */
        .tactical-window {
            position: absolute;
            background-color: var(--bg-panel);
            border: 1px solid rgba(13, 245, 227, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(13, 245, 227, 0.02);
            backdrop-filter: blur(8px);
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .tactical-window.focused {
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 35px rgba(13, 245, 227, 0.15), inset 0 0 20px rgba(13, 245, 227, 0.05);
        }

        /* Custom glow text */
        .cyan-glow {
            text-shadow: 0 0 8px rgba(13, 245, 227, 0.4);
        }
        .amber-glow {
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        /* Custom dock hover */
        .dock-item {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dock-item:hover {
            transform: translateY(-8px) scale(1.1);
        }
    </style>
</head>

    <!-- JAVASCRIPT SYSTEM LOGIC -->
    <script>
        // Global State Manager
        const state = {
            windows: [],
            zIndexCounter: 100,
            activeWindowId: null,
            mountedHandles: {}, // Maps name -> DirectoryHandle
            desktopIcons: [],
            clipboard: { path: null, action: 'copy' },
            currentExplorerPath: '/Desktop',
            wallpapers: {
                current: 'cyber-grid',
                list: [
                    { id: 'cyber-grid', name: 'Tactical Grid' },
                    { id: 'slate-plain', name: 'Nostromo Command (Dark)' },
                    { id: 'aurora', name: 'Exoplanet Green' }
                ]
            }
        };

        // IndexedDB Fallback / Mount Storage Wrapper
        const dbHelper = {
            dbName: 'NostromoWebOS_Store',
            dbVersion: 1,
            getDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('mounts')) {
                            db.createObjectStore('mounts');
                        }
                        if (!db.objectStoreNames.contains('virtual_files')) {
                            db.createObjectStore('virtual_files');
                        }
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            },
            async saveMount(name, handle) {
                const db = await this.getDB();
                return new Promise((resolve) => {

                    const list = {};
                    request.onsuccess = (e) => {
                        const cursor = e.target.result;
                        if (cursor) {
                            list[cursor.key] = cursor.value;
                            cursor.continue();
                        } else {

                    };
                    request.onerror = () => resolve({});

                    req.onsuccess = () => resolve(req.result || []);

            async resolvePath(path) {
                const parts = path.split('/').filter(Boolean);
                if (parts.length === 0) {
                    return { root: this.useFallback ? 'fallback' : this.opfsRoot, parts: [], isLocal: false };
                }

                if (parts[0] === 'mnt' && parts[1] === 'local') {
                    if (parts.length === 2) {
                        return { root: 'VIRTUAL_MNT_ROOT', parts: [], isLocal: true };
                    }
                    const mountName = parts[2];
                    const handle = state.mountedHandles[mountName];
                    if (!handle) {
                        throw new Error(`Mount target "${mountName}" not loaded`);
                    }
                    return { root: handle, parts: parts.slice(3), isLocal: true, mountName };
                }

                return { root: this.useFallback ? 'fallback' : this.opfsRoot, parts, isLocal: false };
            },

            async readdir(path) {
                const { root, parts, isLocal, mountName } = await this.resolvePath(path);

                if (root === 'VIRTUAL_MNT_ROOT') {
                    return Object.keys(state.mountedHandles).map(name => ({
                        name,
                        isDirectory: true,
                        size: 0,
                        mtime: new Date(),
                        type: 'directory',
                        isMount: true,
                        needsAuth: false
                    }));
                }

                if (this.useFallback && !isLocal) {
                    return this.fallbackReaddir(path);
                }

                let currentDir = root;
                // Try and authorize local handle if permissions are deauthorized
                if (isLocal) {
                    const status = await checkPermission(currentDir);
                    if (!status) {
                        return [{
                            name: mountName,
                            isDirectory: true,
                            size: 0,
                            mtime: new Date(),
                            type: 'directory',
                            isMount: true,
                            needsAuth: true
                        }];
                    }
                }

                // Traverse path
                for (const segment of parts) {
                    currentDir = await currentDir.getDirectoryHandle(segment, { create: false });
                }

                const entries = [];
                for await (const [name, entry] of currentDir.entries()) {
                    let fileType = entry.kind === 'directory' ? 'directory' : name.split('.').pop().toLowerCase();
                    let size = 0;
                    let mtime = new Date();
                    
                    if (entry.kind === 'file') {
                        try {
                            const f = await entry.getFile();
                            size = f.size;
                            mtime = new Date(f.lastModified);
                        } catch (e) {}
                    }
                    entries.push({
                        name,
                        isDirectory: entry.kind === 'directory',
                        size,
                        mtime,
                        type: fileType
                    });
                }
                return entries;
            },

            async readFile(path, mode = 'text') {
                const { root, parts, isLocal } = await this.resolvePath(path);

                if (this.useFallback && !isLocal) {
                    const data = this.fallbackFiles[path] || '';
                    if (mode === 'blob') return new Blob([data]);
                    if (mode === 'arraybuffer') return new TextEncoder().encode(data).buffer;
                    return data;
                }

                let currentDir = root;
                if (parts.length === 0) throw new Error("Target is directory");
                
                const filename = parts[parts.length - 1];
                const subdirectories = parts.slice(0, -1);

                for (const segment of subdirectories) {
                    currentDir = await currentDir.getDirectoryHandle(segment, { create: false });
                }

                const fileHandle = await currentDir.getFileHandle(filename, { create: false });
                const file = await fileHandle.getFile();

                if (mode === 'blob') {
                    return file;
                } else if (mode === 'arraybuffer') {
                    return await file.arrayBuffer();
                } else {
                    return await file.text();
                }
            },

            async writeFile(path, content) {
                const { root, parts, isLocal } = await this.resolvePath(path);

                if (this.useFallback && !isLocal) {
                    this.fallbackFiles[path] = content;
                    return;
                }

                let currentDir = root;
                if (parts.length === 0) throw new Error("Cannot overwrite root mount");

                const filename = parts[parts.length - 1];
                const subdirectories = parts.slice(0, -1);

                for (const segment of subdirectories) {
                    currentDir = await currentDir.getDirectoryHandle(segment, { create: true });
                }

                const fileHandle = await currentDir.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();
            },

            async mkdir(path) {
                const { root, parts, isLocal } = await this.resolvePath(path);

                if (this.useFallback && !isLocal) {
                    this.fallbackFiles[path + '/.keep'] = '';
                    return;
                }

                let currentDir = root;
                for (const segment of parts) {
                    currentDir = await currentDir.getDirectoryHandle(segment, { create: true });
                }
            },

            async unlink(path) {
                const { root, parts, isLocal } = await this.resolvePath(path);

                if (this.useFallback && !isLocal) {
                    delete this.fallbackFiles[path];
                    return;
                }

                let currentDir = root;
                const target = parts[parts.length - 1];
                for (let i = 0; i < parts.length - 1; i++) {
                    currentDir = await currentDir.getDirectoryHandle(parts[i], { create: false });
                }
                await currentDir.removeEntry(target);
            },

            async rmdir(path) {
                const { root, parts, isLocal } = await this.resolvePath(path);

                if (this.useFallback && !isLocal) {
                    Object.keys(this.fallbackFiles).forEach(key => {
                        if (key.startsWith(path)) delete this.fallbackFiles[key];
                    });
                    return;
                }

                let currentDir = root;
                const target = parts[parts.length - 1];
                for (let i = 0; i < parts.length - 1; i++) {
                    currentDir = await currentDir.getDirectoryHandle(parts[i], { create: false });
                }
                await currentDir.removeEntry(target, { recursive: true });
            },

            async stat(path) {
                const { root, parts, isLocal } = await this.resolvePath(path);
                if (parts.length === 0) {
                    return { name: 'root', isDirectory: true, size: 0, mtime: new Date(), type: 'directory' };
                }

                if (this.useFallback && !isLocal) {
                    const match = Object.keys(this.fallbackFiles).find(k => k === path);
                    if (match) {
                        return { name: path.split('/').pop(), isDirectory: false, size: this.fallbackFiles[path].length, mtime: new Date(), type: path.split('.').pop() };
                    }
                    return { name: path.split('/').pop(), isDirectory: true, size: 0, mtime: new Date(), type: 'directory' };
                }

                let currentDir = root;
                const target = parts[parts.length - 1];
                for (let i = 0; i < parts.length - 1; i++) {
                    currentDir = await currentDir.getDirectoryHandle(parts[i]);
                }

                try {
                    const fileHandle = await currentDir.getFileHandle(target);
                    const file = await fileHandle.getFile();
                    return {
                        name: target,
                        isDirectory: false,
                        size: file.size,
                        mtime: new Date(file.lastModified),
                        type: target.split('.').pop().toLowerCase()
                    };
                } catch (e) {
                    const dirHandle = await currentDir.getDirectoryHandle(target);
                    return {
                        name: target,
                        isDirectory: true,
                        size: 0,
                        mtime: new Date(),
                        type: 'directory'
                    };
                }
            },

            async exists(path) {
                try {
                    await this.stat(path);
                    return true;
                } catch (e) {
                    return false;
                }
            },

            async rename(oldPath, newPath) {
                const info = await this.stat(oldPath);
                if (info.isDirectory) {
                    await this.mkdir(newPath);
                    const items = await this.readdir(oldPath);
                    for (const item of items) {
                        await this.rename(`${oldPath}/${item.name}`, `${newPath}/${item.name}`);
                    }
                    await this.rmdir(oldPath);
                } else {
                    const blob = await this.readFile(oldPath, 'blob');
                    await this.writeFile(newPath, blob);
                    await this.unlink(oldPath);
                }
            },

            // Fallback Helpers
            fallbackReaddir(dirPath) {
                const matches = new Set();
                const cleanDir = dirPath.endsWith('/') ? dirPath : dirPath + '/';
                
                Object.keys(this.fallbackFiles).forEach(p => {
                    if (p.startsWith(cleanDir)) {
                        const relative = p.slice(cleanDir.length);
                        const parts = relative.split('/');
                        if (parts[0]) matches.add(parts[0]);
                    }
                });

                return Array.from(matches).map(name => {
                    const isDir = !name.includes('.');
                    return {
                        name,
                        isDirectory: isDir,
                        size: isDir ? 0 : (this.fallbackFiles[cleanDir + name] || '').length,
                        mtime: new Date(),
                        type: isDir ? 'directory' : name.split('.').pop()
                    };
                });
            }
        };

            }
            if (withRequest) {
                return (await handle.requestPermission(opts)) === 'granted';
            }
            return false;
        }

            if (action === 'newfolder') {
                const name = prompt("Enter folder name:");
                if (name) {
                    await fs.mkdir(`/Desktop/${name}`);
                    refreshDesktop();
                }
            } else if (action === 'newfile') {
                const name = prompt("Enter text file name (e.g. log.txt):");
                if (name) {
                    await fs.writeFile(`/Desktop/${name}`, " ");
                    refreshDesktop();
                }
            } else if (action === 'mount') {
                promptMountFolder();
            } else if (action === 'refresh') {
                refreshDesktop();
            } else if (action === 'fullscreen') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function toggleStartMenu(e) {

        // DESKTOP BOX SELECTION
        let selectionBox = { x: 0, y: 0, active: false };
        function onDesktopMouseDown(e) {
            // Check if clicking inside another element or window
            if (e.target.closest('.tactical-window') || e.target.closest('button') || e.target.closest('footer') || e.target.closest('header')) {
                return;
            }
            selectionBox.active = true;
            selectionBox.x = e.clientX;
            selectionBox.y = e.clientY;
            
            const el = document.getElementById('selection-box-element');
            el.style.left = `${selectionBox.x}px`;
            el.style.top = `${selectionBox.y}px`;
            el.style.width = '0px';
            el.style.height = '0px';
            el.classList.remove('hidden');

            window.addEventListener('mousemove', onDesktopMouseMove);
            window.addEventListener('mouseup', onDesktopMouseUp);
        }

        function onDesktopMouseMove(e) {
            if (!selectionBox.active) return;
            const el = document.getElementById('selection-box-element');
            const currentX = e.clientX;
            const currentY = e.clientY;

            const left = Math.min(selectionBox.x, currentX);
            const top = Math.min(selectionBox.y, currentY);
            const width = Math.abs(selectionBox.x - currentX);
            const height = Math.abs(selectionBox.y - currentY);

            el.style.left = `${left}px`;
            el.style.top = `${top}px`;
            el.style.width = `${width}px`;
            el.style.height = `${height}px`;

            // Identify inside targets
            const rect = el.getBoundingClientRect();
            document.querySelectorAll('#desktop-icons > div').forEach(node => {
                const nodeRect = node.getBoundingClientRect();
                const overlap = !(rect.right < nodeRect.left || 
                                  rect.left > nodeRect.right || 
                                  rect.bottom < nodeRect.top || 
                                  rect.top > nodeRect.bottom);
                if (overlap) {
                    node.classList.add('bg-[#0df5e3]/20', 'border-[#0df5e3]/50');
                } else {
                    node.classList.remove('bg-[#0df5e3]/20', 'border-[#0df5e3]/50');
                }
            });
        }

        function onDesktopMouseUp() {
            selectionBox.active = false;
            document.getElementById('selection-box-element').classList.add('hidden');
            window.removeEventListener('mousemove', onDesktopMouseMove);
            window.removeEventListener('mouseup', onDesktopMouseUp);
        }

        // WINDOW MANAGER SYSTEM
        function launchApp(appId, params = {}) {
            // Uniquely identify multiple instances
            const winId = `${appId}_${Date.now()}`;
            const meta = getAppMetadata(appId, params);
            
            const win = {
                id: winId,
                appId,
                title: meta.title,
                width: meta.width || 640,
                height: meta.height || 480,
                x: Math.max(50, 100 + (state.windows.length * 20) % 300),
                y: Math.max(50, 80 + (state.windows.length * 20) % 200),
                minimized: false,
                maximized: false,
                zIndex: ++state.zIndexCounter,
                params
            };

            state.windows.push(win);
            renderWindow(win);
            focusWindow(winId);
            updateDock();
        }

        function getAppMetadata(appId, params) {
            switch(appId) {
                case 'explorer':

                    return { title: `Tactical Code Editor ${params.path ? `[${params.path}]` : ''}`, width: 850, height: 500 };

                case 'archive':
                    return { title: 'Package Extraction System', width: 450, height: 350 };

        function focusWindow(winId) {
            state.activeWindowId = winId;
            state.windows.forEach(win => {
                const el = document.getElementById(win.id);
                if (el) {
                    if (win.id === winId) {
                        win.zIndex = ++state.zIndexCounter;
                        el.style.zIndex = win.zIndex;
                        el.classList.add('focused');
                    } else {
                        el.classList.remove('focused');
                    }
                }
            });
        }

        function closeWindow(e, winId) {
            if (e) e.stopPropagation();
            const idx = state.windows.findIndex(w => w.id === winId);
            if (idx !== -1) {
                state.windows.splice(idx, 1);
                const el = document.getElementById(winId);
                if (el) el.remove();
                updateDock();
            }
        }

        function minimizeWindow(e, winId) {
            if (e) e.stopPropagation();
            const win = state.windows.find(w => w.id === winId);
            if (win) {
                win.minimized = true;
                const el = document.getElementById(winId);
                if (el) el.classList.add('hidden');
                updateDock();
            }
        }

        function toggleMinimize(winId) {
            const win = state.windows.find(w => w.id === winId);
            if (win) {
                const el = document.getElementById(winId);
                if (win.minimized) {
                    win.minimized = false;
                    el.classList.remove('hidden');
                    focusWindow(winId);
                } else {
                    win.minimized = true;
                    el.classList.add('hidden');
                }
                updateDock();
            }
        }

        function maximizeWindow(e, winId) {
            if (e) e.stopPropagation();
            const win = state.windows.find(w => w.id === winId);
            if (win) {
                const el = document.getElementById(winId);
                if (win.maximized) {
                    win.maximized = false;
                    el.style.left = `${win.x}px`;
                    el.style.top = `${win.y}px`;
                    el.style.width = `${win.width}px`;
                    el.style.height = `${win.height}px`;
                } else {
                    win.maximized = true;
                    el.style.left = '0px';
                    el.style.top = '40px'; // Telemetry bar offset
                    el.style.width = '100vw';
                    el.style.height = 'calc(100vh - 104px)'; // Dock & Telemetry offsets

        // DRAG & RESIZE ENGINE
        let windowDragOffset = { x: 0, y: 0 };
        function onWindowDragStart(e, winId) {
            if (e.target.closest('button')) return; // Ignore drag if button is clicked
            const win = state.windows.find(w => w.id === winId);
            if (!win || win.maximized) return;

            focusWindow(winId);
            const el = document.getElementById(winId);
            windowDragOffset.x = e.clientX - el.offsetLeft;
            windowDragOffset.y = e.clientY - el.offsetTop;

            const onMouseMove = (ev) => {
                const newX = ev.clientX - windowDragOffset.x;
                const newY = ev.clientY - windowDragOffset.y;
                win.x = newX;
                win.y = newY;
                el.style.left = `${newX}px`;
                el.style.top = `${newY}px`;
            };

            const onMouseUp = () => {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        function onWindowResizeStart(e, winId) {
            e.stopPropagation();
            e.preventDefault();
            const win = state.windows.find(w => w.id === winId);
            if (!win || win.maximized) return;

            const el = document.getElementById(winId);
            const startWidth = el.offsetWidth;
            const startHeight = el.offsetHeight;
            const startX = e.clientX;
            const startY = e.clientY;

            const onMouseMove = (ev) => {
                const newWidth = Math.max(300, startWidth + (ev.clientX - startX));
                const newHeight = Math.max(250, startHeight + (ev.clientY - startY));
                win.width = newWidth;
                win.height = newHeight;
                el.style.width = `${newWidth}px`;
                el.style.height = `${newHeight}px`;

                // Fire custom resize hooks if any
                const resizeHook = document.getElementById(`${winId}-content`).dispatchEvent(new CustomEvent('app-resize'));
            };

            const onMouseUp = () => {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        // FILE DISPATCH ASSISTANCE
        async function handleFileOpen(path) {
            const stat = await fs.stat(path);
            const ext = path.split('.').pop().toLowerCase();

            if (stat.isDirectory) {
                state.currentExplorerPath = path;
                updateExplorer();
                // Find existing explorer window or launch a new one
                const openExplorer = state.windows.find(w => w.appId === 'explorer');
                if (openExplorer) {
                    focusWindow(openExplorer.id);
                    document.getElementById(`${openExplorer.id}-title-text`).innerText = `Sector File Explorer [${path}]`;
                } else {
                    launchApp('explorer');
                }
                return;
            }

            // Route files to appropriate application
            const textExtensions = ['txt', 'css', 'js', 'json', 'xml', 'csv', 'tsv', 'md', 'yaml', 'log'];
            const imgExtensions = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico'];
            const mediaExtensions = ['mp3', 'wav', 'ogg', 'flac', 'aac', 'mp4', 'webm', 'ogv'];
            const zipExtensions = ['zip', 'gz', 'tar', 'tgz'];

            if (ext === 'html') {
                launchApp('editor', { path, mode: 'html' });
            } else if (textExtensions.includes(ext)) {
                launchApp('editor', { path });
            } else if (imgExtensions.includes(ext) || mediaExtensions.includes(ext)) {
                launchApp('viewer', { path });
            } else if (zipExtensions.includes(ext)) {
                launchApp('archive', { path });
            } else if (ext === 'pdf') {
                // PDF fallback inside WebOS Viewer
                launchApp('viewer', { path, forcePdf: true });
            } else {
                // Fallback text view
                launchApp('editor', { path, fallback: true });
            }
        }

                                <span class="truncate">${k}</span>
                            </div>
                            ${badge}
                        `;
                        item.onclick = () => {
                            if (!status) {
                                triggerAuth(k);
                            } else {
                                navigateExplorer(winId, `/mnt/local/${k}`);
                            }
                        };
                        mountList.appendChild(item);
                    }
                }
            }

            try {
                let files = await fs.readdir(state.currentExplorerPath);
                // Filter keep file
                files = files.filter(f => f.name !== '.keep');

                // Apply Sorting rules
                files.sort((a, b) => {
                    let fieldA = a[explorerSort.col];
                    let fieldB = b[explorerSort.col];

                    if (explorerSort.col === 'name') {
                        return explorerSort.asc ? fieldA.localeCompare(fieldB) : fieldB.localeCompare(fieldA);
                    } else if (explorerSort.col === 'size') {
                        return explorerSort.asc ? fieldA - fieldB : fieldB - fieldA;
                    } else if (explorerSort.col === 'type') {
                        return explorerSort.asc ? fieldA.localeCompare(fieldB) : fieldB.localeCompare(fieldA);
                    } else {
                        return explorerSort.asc ? new Date(fieldA) - new Date(fieldB) : new Date(fieldB) - new Date(fieldA);
                    }
                });

                // Clear sort arrows
                ['name', 'size', 'type', 'mtime'].forEach(col => {
                    const el = document.getElementById(`${winId}-sort-${col}`);
                    if (el) el.innerText = '';

                const activeArrow = document.getElementById(`${winId}-sort-${explorerSort.col}`);

        }

        function formatBytes(bytes, decimals = 1) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function updateExplorer() {
            state.windows.forEach(win => {
                if (win.appId === 'explorer') {
                    document.getElementById(`${win.id}-title-text`).innerText = `Sector File Explorer [${state.currentExplorerPath}]`;
                    updateExplorerWindow(win.id);
                }
            });
        }

        function navigateExplorer(winId, path) {
            state.currentExplorerPath = path;
            updateExplorer();
        }

        function navigateExplorerUp(winId) {
            if (state.currentExplorerPath === '/' || state.currentExplorerPath === '') return;
            const parts = state.currentExplorerPath.split('/').filter(Boolean);
            parts.pop();
            state.currentExplorerPath = '/' + parts.join('/');
            updateExplorer();
        }

        function onExplorerPathEnter(e, winId) {
            if (e.key === 'Enter') {
                const path = e.target.value.trim();
                navigateExplorer(winId, path);
            }
        }

        function sortExplorerColumn(winId, colName) {
            if (explorerSort.col === colName) {
                explorerSort.asc = !explorerSort.asc;
            } else {
                explorerSort.col = colName;
                explorerSort.asc = true;
            }
            updateExplorerWindow(winId);
        }

        async function triggerNewFolder(winId) {
            const name = prompt("Enter folder name:");
            if (name) {
                const target = state.currentExplorerPath === '/' ? `/${name}` : `${state.currentExplorerPath}/${name}`;
                await fs.mkdir(target);
                updateExplorer();
                if (state.currentExplorerPath.startsWith('/Desktop')) refreshDesktop();
            }
        }

        async function triggerNewFile(winId) {
            const name = prompt("Enter file name (e.g., source.txt):");
            if (name) {
                const target = state.currentExplorerPath === '/' ? `/${name}` : `${state.currentExplorerPath}/${name}`;
                await fs.writeFile(target, " ");
                updateExplorer();
                if (state.currentExplorerPath.startsWith('/Desktop')) refreshDesktop();
            }
        }

        function triggerLocalImport(winId) {
            document.getElementById(`${winId}-native-import`).click();
        }

        async function onNativeImportSelected(e, winId) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const arrBuf = await file.arrayBuffer();
                const targetPath = state.currentExplorerPath === '/' ? `/${file.name}` : `${state.currentExplorerPath}/${file.name}`;
                await fs.writeFile(targetPath, arrBuf);
                alert(`File imported successfully to ${targetPath}`);
                updateExplorer();
                if (state.currentExplorerPath.startsWith('/Desktop')) refreshDesktop();
            } catch (err) {
                alert(`Import failed: ${err.message}`);
            }
        }

        // Drop file native operations
        function onExplorerDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        }

        async function onExplorerDrop(e, winId) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length === 0) return;
            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const arrBuf = await file.arrayBuffer();
                    const targetPath = state.currentExplorerPath === '/' ? `/${file.name}` : `${state.currentExplorerPath}/${file.name}`;
                    await fs.writeFile(targetPath, arrBuf);
                }
                alert(`Processed ${files.length} drop assets!`);
                updateExplorer();
                if (state.currentExplorerPath.startsWith('/Desktop')) refreshDesktop();
            } catch (err) {
                alert(`Drop Import failed: ${err.message}`);
            }
        }

        // Copy / Cut Paste functions
        async function copyPasteAction(path, action) {
            state.clipboard.path = path;
            state.clipboard.action = action;
        }

        async function triggerPaste(destPath) {
            if (!state.clipboard.path) {
                alert("Nothing in system buffer.");
                return;
            }
            const name = state.clipboard.path.split('/').pop();
            const fullDest = state.currentExplorerPath === '/' ? `/${name}` : `${state.currentExplorerPath}/${name}`;
            
            try {
                if (state.clipboard.action === 'copy') {
                    const data = await fs.readFile(state.clipboard.path, 'blob');
                    await fs.writeFile(fullDest, data);
                } else {
                    const stat = await fs.stat(state.clipboard.path);
                    if (stat.isDirectory) {
                        alert("Moving folders with system buffer requires manual merge.");
                        return;
                    }
                    const data = await fs.readFile(state.clipboard.path, 'blob');
                    await fs.writeFile(fullDest, data);
                    await fs.unlink(state.clipboard.path);
                }
                alert("Buffer committed!");
                updateExplorer();
                refreshDesktop();
            } catch (err) {
                alert(`Buffer commit failed: ${err.message}`);
            }
        }

        async function triggerRename(path) {
            const name = prompt("Enter new name:");
            if (!name) return;
            const parts = path.split('/').filter(Boolean);
            parts.pop();
            const parent = '/' + parts.join('/');
            const newPath = parent === '/' ? `/${name}` : `${parent}/${name}`;
            
            try {
                await fs.rename(path, newPath);
                updateExplorer();
                refreshDesktop();
            } catch (e) {
                alert(`Rename error: ${e.message}`);
            }
        }

        async function triggerDelete(path) {
            if (!confirm(`Confirm absolute deletion of ${path}?`)) return;
            try {
                const info = await fs.stat(path);
                if (info.isDirectory) {
                    await fs.rmdir(path);
                } else {
                    await fs.unlink(path);
                }
                updateExplorer();
                refreshDesktop();
            } catch (e) {
                alert(`Deletion failed: ${e.message}`);
            }
        }

        async function triggerDownloadExport(path) {
            try {
                const name = path.split('/').pop();
                const blob = await fs.readFile(path, 'blob');
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert(`Export failed: ${e.message}`);
            }
        }

                                1
                            </div>
                            <textarea id="${win.id}-textarea" class="flex-1 bg-transparent p-3 font-code text-slate-300 text-xs leading-relaxed focus:outline-none resize-none overflow-auto" oninput="syncLineNumbers('${win.id}')" onscroll="syncLineScroll('${win.id}')">${initialContent}</textarea>

                        <!-- Live Interactive preview (if HTML) -->

        // Line numbering calculations
        function syncLineNumbers(winId) {
            const ta = document.getElementById(`${winId}-textarea`);
            const numArea = document.getElementById(`${winId}-line-numbers`);
            if (!ta || !numArea) return;
            const lines = ta.value.split('\n').length;
            let numStr = '';
            for (let i = 1; i <= lines; i++) {
                numStr += `${i}<br>`;
            }
            numArea.innerHTML = numStr;
        }

        function syncLineScroll(winId) {
            const ta = document.getElementById(`${winId}-textarea`);
            const numArea = document.getElementById(`${winId}-line-numbers`);
            if (ta && numArea) {
                numArea.scrollTop = ta.scrollTop;
            }
        }

        function debounce(func, delay) {
            let timer;
            return function() {
                const ctx = this, args = arguments;
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(ctx, args), delay);
            };
        }

        function triggerLivePreviewRefresh(winId) {
            const ta = document.getElementById(`${winId}-textarea`);
            const iframe = document.getElementById(`${winId}-iframe`);
            if (ta && iframe) {
                iframe.srcdoc = ta.value;
            }
        }

        async function openInBrowserSim(winId) {
            const ta = document.getElementById(`${winId}-textarea`);
            if (!ta) return;
            const blob = new Blob([ta.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            launchApp('browser', { initialUrl: url, title: "HTML VFS Preview" });
        }

        // CSV Tabular Processor
        let spreadsheetState = {}; // Keeps rows matrix
        function loadSpreadsheetData(winId, rawText, separator) {
            const lines = rawText.trim().split('\n');
            const table = document.getElementById(`${winId}-spreadsheet-table`);
            if (!table) return;
            table.innerHTML = '';

            const parsedRows = lines.map(line => {
                // simple split - ignoring escaping for sample complexity
                return line.split(separator);
            });

            spreadsheetState[winId] = { rows: parsedRows, separator };
            renderSpreadsheet(winId);
        }

        function renderSpreadsheet(winId) {
            const table = document.getElementById(`${winId}-spreadsheet-table`);
            const data = spreadsheetState[winId];
            if (!table || !data) return;
            table.innerHTML = '';

            data.rows.forEach((row, rIdx) => {
                const tr = document.createElement('tr');
                tr.className = rIdx === 0 ? 'bg-[#090d12] border-b-2 border-slate-800' : 'border-b border-slate-900';
                
                row.forEach((cell, cIdx) => {
                    const cellEl = document.createElement(rIdx === 0 ? 'th' : 'td');
                    cellEl.className = 'p-1.5';
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = rIdx === 0 ? 'w-full bg-transparent font-bold text-cyan-400 focus:outline-none focus:bg-slate-900' : 'w-full bg-transparent text-slate-300 focus:outline-none focus:bg-slate-900';
                    input.value = cell;
                    input.onchange = (e) => {
                        spreadsheetState[winId].rows[rIdx][cIdx] = e.target.value;
                        syncSpreadsheetToTextarea(winId);
                    };
                    
                    cellEl.appendChild(input);
                    tr.appendChild(cellEl);
                });
                table.appendChild(tr);
            });
        }

        function syncSpreadsheetToTextarea(winId) {
            const data = spreadsheetState[winId];
            const ta = document.getElementById(`${winId}-textarea`);
            if (data && ta) {
                const text = data.rows.map(row => row.join(data.separator)).join('\n');
                ta.value = text;
                syncLineNumbers(winId);
            }
        }

        function toggleEditorView(winId, mode) {
            const code = document.getElementById(`${winId}-code-view`);
            const tbl = document.getElementById(`${winId}-table-view`);
            if (mode === 'table') {
                code.classList.add('hidden');
                tbl.classList.remove('hidden');
            } else {
                tbl.classList.add('hidden');
                code.classList.remove('hidden');
            }
        }

            const ta = document.getElementById(`${winId}-textarea`);
            if (!ta || !path) {
                alert("Cannot write empty payload or unregistered source.");

                updateExplorer();
                if (path.startsWith('/Desktop')) refreshDesktop();
            } catch (err) {
                alert(`Disk Write Failed: ${err.message}`);
            }
        }

        let imgScales = {};

        // Tactically styled Canvas visualizer for Audio
        function initAudioVisualizer(winId) {
            const canvas = document.getElementById(`${winId}-audio-canvas`);
            const audio = document.getElementById(`${winId}-audio`);
            if (!canvas || !audio) return;

            const ctx = canvas.getContext('2d');
            let animId;

            function render() {
                if (!canvas) return;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw cool mathematical matrix line structures
                ctx.strokeStyle = '#0df5e3';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                
                const waveCount = 20;
                const progress = audio.currentTime / (audio.duration || 1);
                
                for (let i = 0; i < canvas.width; i++) {
                    const sinVal = Math.sin(i * 0.05 + Date.now() * 0.005) * 20;
                    const audioAmp = audio.paused ? 1 : Math.sin(Date.now() * 0.05) * 5 + 15;
                    const y = (canvas.height / 2) + (sinVal * (audioAmp / 20) * Math.sin(i / canvas.width * Math.PI));
                    
                    if (i === 0) ctx.moveTo(i, y);
                    else ctx.lineTo(i, y);
                }
                ctx.stroke();

                // Draw secondary timeline trackers
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(canvas.width * progress - 1, 0, 2, canvas.height);

                animId = requestAnimationFrame(render);
            }
            render();

            // Hook close window to kill render loop
            document.getElementById(winId).addEventListener('DOMNodeRemoved', () => {
                cancelAnimationFrame(animId);
            });
        }

        async function unpackSelectedArchive(winId, path) {
            const logEl = document.getElementById(`${winId}-log`);
            if (!logEl) return;
            logEl.innerHTML = '';

            try {
                if (!window.JSZip) {
                    throw new Error("Package system dependency (JSZip) not loaded.");
                }

                logEl.innerHTML += `Initializing decompression stream...<br>`;
                const fileBlob = await fs.readFile(path, 'blob');
                
                const zip = await JSZip.loadAsync(fileBlob);
                const files = Object.keys(zip.files);
                
                logEl.innerHTML += `Found ${files.length} packaged entries.<br>`;

                // Get current directory path to write back to
                const parts = path.split('/').filter(Boolean);
                parts.pop();
                const currentFolder = '/' + parts.join('/');

                for (const filename of files) {
                    const zipFile = zip.files[filename];
                    if (zipFile.dir) {
                        await fs.mkdir(`${currentFolder}/${filename}`);
                        logEl.innerHTML += `<span class="text-amber-400">Created Directory: ${filename}</span><br>`;
                    } else {
                        const content = await zipFile.async('arraybuffer');
                        await fs.writeFile(`${currentFolder}/${filename}`, content);
                        logEl.innerHTML += `<span class="text-emerald-400">Extracted file: ${filename}</span><br>`;
                    }
                }

                logEl.innerHTML += `Decompression operations completed successfully.`;
                updateExplorer();
                refreshDesktop();
            } catch (err) {
                logEl.innerHTML += `<span class="text-rose-400">Decompression failed: ${err.message}</span>`;
            }
        }

        let calcBuffers = {};
        function calcPress(winId, value) {
            const screen = document.getElementById(`${winId}-calc-screen`);
            if (!screen) return;
            if (!calcBuffers[winId]) calcBuffers[winId] = '';

            if (value === 'C') {
                calcBuffers[winId] = '';
                screen.innerText = '0';
            } else if (value === '=') {
                try {
                    // Safe basic arithmetic eval
                    const cleanExpr = calcBuffers[winId].replace(/[^0-9+\-*/.]/g, '');
                    const result = new Function(`return ${cleanExpr}`)();
                    screen.innerText = result;
                    calcBuffers[winId] = String(result);
                } catch (e) {
                    screen.innerText = 'ERROR';
                    calcBuffers[winId] = '';
                }
            } else if (value === 'sqrt') {
                try {
                    const val = parseFloat(screen.innerText);
                    const result = Math.sqrt(val);
                    screen.innerText = result;
                    calcBuffers[winId] = String(result);
                } catch (e) {
                    screen.innerText = 'ERROR';
                }
            } else {
                calcBuffers[winId] += value;
                screen.innerText = calcBuffers[winId];
            }
        }

        async function loadDiskUtilization(winId) {
            let usedBytes = 0;
            try {
                // Sum desktop files size recursively to mock total disk occupation
                const items = await fs.readdir('/Desktop');
                items.forEach(i => usedBytes += i.size || 0);
            } catch(e) {}

            const formattedUsed = formatBytes(usedBytes);
            const percentage = Math.min(100, Math.round((usedBytes / 50000) * 100)) || 1; // Mocks total allocated threshold scale

            const spaceUsedEl = document.getElementById(`${winId}-space-used`);
            const ring = document.getElementById(`${winId}-storage-ring`);
            const percentageEl = document.getElementById(`${winId}-storage-percentage`);

            if (spaceUsedEl) spaceUsedEl.innerText = formattedUsed;
            if (percentageEl) percentageEl.innerText = `${percentage}%`;
            if (ring) {
                const dashArray = 282.7;
                const offset = dashArray - (dashArray * percentage) / 100;
                ring.style.strokeDashoffset = offset;
            }
        }

                document.querySelector('.cyber-grid').classList.add('hidden');

            try {

                desktop.style.backgroundImage = `url(${url})`;
                desktop.style.backgroundSize = 'cover';

                alert("Custom Wallpaper Applied!");
            } catch (err) {

            }
        }

        async function triggerSystemPurge() {
            if (!confirm("Are you sure you want to format your virtual drive? All files inside OPFS will be permanently deleted.")) return;
            try {
                if (navigator.storage && navigator.storage.getDirectory) {
                    const root = await navigator.storage.getDirectory();
                    for await (const [name, entry] of root.entries()) {
                        await root.removeEntry(name, { recursive: true });
                    }
                }
                alert("Format operation complete. Rebooting...");
                window.location.reload();
            } catch (e) {
                alert("Reset failure: " + e.message);
            }
        }
