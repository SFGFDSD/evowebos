    }, { passive: true });
    row.addEventListener('touchmove', e => {
      const t = Array.from(e.changedTouches).find(x => x.identifier === pid); if (!t) return;
      if (!dragging) { if (Math.hypot(t.clientX - sx, t.clientY - sy) > 10) clearTimeout(lp); return; }
      e.preventDefault();
      ghost.style.left = t.clientX + 'px'; ghost.style.top = t.clientY + 'px';
      ghost.style.display = 'none';
      st._under = document.elementFromPoint(t.clientX, t.clientY);
      ghost.style.display = '';
      $$('.drop-hi', content).forEach(x => x.classList.remove('drop-hi'));
      const folder = st._under && st._under.closest && st._under.closest('[data-drop-path]');
      if (folder && folder.dataset.dropPath && folder.dataset.dropPath !== it.path) folder.classList.add('drop-hi');
    }, { passive: false });
    row.addEventListener('touchend', async e => {
      clearTimeout(lp);
      if (!dragging) return;
      e.preventDefault();
      ghost && ghost.remove();
      $$('.drop-hi', content).forEach(x => x.classList.remove('drop-hi'));
      const under = st._under;
      const folder = under && under.closest && under.closest('[data-drop-path]');
      if (folder && folder.dataset.dropPath) {
        const dest = folder.dataset.dropPath;
        for (const p of Array.from(st.sel)) if (p !== dest) await fs.rename(p, joinPath(dest, await fs.uniqueName(dest, baseName(p)))).catch(() => { });
      }
      dragging = false; st._under = null;
    }, { passive: false });
  }

  async function openEntry(it) {
    if (st.searchQ != null && !it.dir) { await openPath(it.path); return; }
    if (it.dir) navTo(it.path);
    else await openPath(it.path);
  }

  function itemMenu(x, y, it) {
    const paths = Array.from(st.sel);
    const single = paths.length === 1 ? it : null;
    const menu = [
      { label: '打开', icon: 'run', action: () => { if (paths.length <= 1) openEntry(it); else paths.forEach(p => openPath(p)); } },
      { label: '打开方式', icon: 'more', children: openWithMenu(it.path, it.dir) },

    if (single && EXT.arch.includes(getExt(it.name))) menu.push({ label: '解压到当前目录', icon: 'zip', action: () => extractArchive(it.path) });

    menu.push({ label: '剪切', icon: 'cut', action: () => { Clip.paths = paths; Clip.op = 'cut'; } });
    if (single) menu.push({
      label: '重命名', icon: 'pencil', action: async () => {

        if (nn && nn !== it.name) try { await fs.rename(it.path, joinPath(dirName(it.path), nn)); } catch (e) { toast('重命名失败: ' + e.message, 'err'); }
      }

      label: '删除', icon: 'trash', danger: true, action: async () => {

      }

    if (single) menu.push({ label: '属性', icon: 'info', action: () => showProps(it.path) });
    openMenu(x, y, menu);
  }

  // 内容区背景：框选 / 右键 / 放置（触摸横向拖动为框选，纵向为滚动）
  content.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('[data-path]') || e.target.closest('th') || e.target.closest('.col-res')) return;
    st.sel.clear(); refreshSel();
    const sx = e.clientX, sy = e.clientY;
    const band = el('div', 'rubber'); document.body.appendChild(band);
    const mv = ev => {
      const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY), bw = Math.abs(ev.clientX - sx), bh = Math.abs(ev.clientY - sy);
      Object.assign(band.style, { left: x + 'px', top: y + 'px', width: bw + 'px', height: bh + 'px' });
      $$('[data-path]', content).forEach(r => {
        const rc = r.getBoundingClientRect();
        const hit = rc.left < x + bw && rc.right > x && rc.top < y + bh && rc.bottom > y;
        if (hit) st.sel.add(r.dataset.path); else st.sel.delete(r.dataset.path);
        r.classList.toggle('sel', hit);
      });
    };
    const up = () => { band.remove(); refreshSel(); document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up); };
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
  content.addEventListener('contextmenu', e => {
    if (e.target.closest('[data-path]')) return;
    e.preventDefault();
    openMenu(e.clientX, e.clientY, [
      { label: '新建文件夹', icon: 'folderPlus', action: () => $('[data-act="newfolder"]', body).click() },
      { label: '新建文本文档', icon: 'filePlus', action: () => $('[data-act="newfile"]', body).click() },
      { label: '粘贴', icon: 'paste', disabled: !Clip.paths.length, action: () => pasteInto(st.cwd) },
      { sep: true },
      { label: '上传文件到此', icon: 'upload', action: () => $('[data-act="upload"]', body).click() },
      { label: '刷新', icon: 'refresh', action: () => render() },
      { sep: true },
      {
        label: '排序方式', icon: 'list', children: [
          { label: '名称', icon: 'chevR', action: () => { st.sortKey = 'name'; render(); } },
          { label: '修改日期', icon: 'clock', action: () => { st.sortKey = 'mtime'; render(); } },
          { label: '类型', icon: 'list', action: () => { st.sortKey = 'type'; render(); } },
          { label: '大小', icon: 'download', action: () => { st.sortKey = 'size'; render(); } }
        ]
      },
      { label: '属性', icon: 'info', action: () => showProps(st.cwd) }
    ]);
  });
  content.addEventListener('dragover', e => { e.preventDefault(); content.classList.add('drop-hi'); });
  content.addEventListener('dragleave', e => { if (e.target === content) content.classList.remove('drop-hi'); });
  content.addEventListener('drop', async e => {
    e.preventDefault(); content.classList.remove('drop-hi');
    const raw = e.dataTransfer.getData('application/x-inkisle');
    if (raw) { const data = JSON.parse(raw); const items = data.items || data; for (const m of items) if (m.path && dirName(m.path) !== st.cwd) await fs.rename(m.path, joinPath(st.cwd, await fs.uniqueName(st.cwd, baseName(m.path)))).catch(err => toast('移动失败: ' + err.message, 'err')); return; }
    await importDataTransfer(e.dataTransfer, st.cwd);
  });
  // 键盘
  content.addEventListener('keydown', async e => {
    if (e.key === 'Delete' && st.sel.size) {
      if (await confirmBox(`删除 ${st.sel.size} 个项目？`, { danger: true, okText: '删除' }))
        for (const p of Array.from(st.sel)) await fs.remove(p).catch(() => { });
    }
    if (e.key === 'Enter' && st.sel.size === 1) { const it = (await getItems()).find(x => st.sel.has(x.path)); if (it) openEntry(it); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); (await getItems()).forEach(x => st.sel.add(x.path)); refreshSel(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { Clip.paths = Array.from(st.sel); Clip.op = 'copy'; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') { Clip.paths = Array.from(st.sel); Clip.op = 'cut'; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') { pasteInto(st.cwd); }
  });
  // 搜索（递归）
  let searching = false;
  searchInp.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const q = searchInp.value.trim();
    if (!q) { st.searchQ = null; st.results = null; render(); return; }
    if (searching) return;
    searching = true; st.searchQ = q; st.results = [];
    status.innerHTML = `<span>正在搜索「${esc(q)}」…</span>`;
    const lq = q.toLowerCase();
    try {
      const walk = async (dir, depth) => {
        if (st.results.length >= 200 || depth > 10) return;
        let items; try { items = await fs.readdir(dir); } catch (e2) { return; }
        for (const it of items) {
          if (st.results.length >= 200) return;
          if (it.name.toLowerCase().includes(lq)) st.results.push(it);
          if (it.dir) await walk(it.path, depth + 1);
        }
      };
      await walk(st.cwd, 0);
    } catch (e2) { }
    searching = false;
    st.sel.clear();
    render();
  });
  // fs 变更自动刷新
  const un = fs.on(changed => {
    const d = normPath(changed);
    if (d === st.cwd || d === dirName(st.cwd) || st.cwd === '/' || (st.searchQ != null)) render();
    if (d === '/mnt/local') renderSide();
  });
  w.onClose = () => { un(); };
  render();
  return w;
}

async function openNotepad(path, forceText) {
  let text = '', filePath = path || null;
  if (path) { try { text = await fs.readText(path); } catch (e) { toast('读取失败: ' + e.message, 'err'); return; } }
  const w = WM.create({ title: (path ? baseName(path) : '未命名') + ' — 记事本', icon: 'notepad', width: 720, height: 520, app: 'notepad' });
  const body = w.body;
  body.innerHTML = `<div class="pad">
    <div class="pad-bar">
      <button class="btn sm" data-a="save">${icon('save')}保存</button>
      <button class="btn sm" data-a="saveas">${icon('filePlus')}另存为</button>
      <span class="sp"></span>
      <button class="tbtn" data-a="wrap" title="自动换行">${icon('list')}</button>
      <button class="tbtn" data-a="dl" title="导出">${icon('download')}</button>
    </div>
    <div class="pad-body"><textarea class="pad-ta" spellcheck="false" placeholder="在此输入…"></textarea></div>
    <div class="pad-status"><span data-s="pos">行 1, 列 1</span><span data-s="len">0 字符</span><span data-s="enc">UTF-8</span><span data-s="path" style="margin-left:auto;overflow:hidden;text-overflow:ellipsis">${esc(filePath || '未保存')}</span></div>
  </div>`;
  const ta = $('.pad-ta', body);
  ta.value = text;
  let dirty = false;
  const upd = () => {
    const pos = ta.selectionStart, upto = ta.value.slice(0, pos);
    const line = upto.split('\n').length, col = pos - upto.lastIndexOf('\n');
    $('[data-s="pos"]', body).textContent = `行 ${line}, 列 ${col}`;
    $('[data-s="len"]', body).textContent = `${ta.value.length} 字符 · ${ta.value.split('\n').length} 行`;
  };
  ta.addEventListener('input', () => { dirty = true; upd(); });
  ta.addEventListener('click', upd); ta.addEventListener('keyup', upd);
  ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
  const save = async () => {
    if (!filePath) { filePath = joinPath('/Desktop', await fs.uniqueName('/Desktop', '未命名.txt')); }
    try {
      await fs.writeFile(filePath, ta.value);
      dirty = false;
      $('[data-s="path"]', body).textContent = filePath;
      WM.setTitle(w.id, baseName(filePath) + ' — 记事本');
      toast('已保存到 ' + filePath, 'ok');
      fs.emit(dirName(filePath));
    } catch (e) { toast('保存失败: ' + e.message, 'err'); }
  };
  $('[data-a="save"]', body).onclick = save;
  $('[data-a="saveas"]', body).onclick = async () => {
    const n = await promptBox('另存为（文件名）', filePath ? baseName(filePath) : '未命名.txt');
    if (!n) return;
    filePath = joinPath(filePath ? dirName(filePath) : '/Desktop', n);
    filePath = joinPath(dirName(filePath), await fs.uniqueName(dirName(filePath), baseName(filePath)));
    save();
  };
  $('[data-a="wrap"]', body).onclick = e => { ta.wrap = ta.wrap === 'off' ? 'soft' : 'off'; e.currentTarget.classList.toggle('on', ta.wrap !== 'off'); };
  $('[data-a="dl"]', body).onclick = () => {
    const b = new Blob([ta.value], { type: 'text/plain' });
    const a = el('a'); a.href = URL.createObjectURL(b); a.download = filePath ? baseName(filePath) : '未命名.txt'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  upd();
  return w;
}

   表格 (CSV / TSV 双视图)
   ================================================================== */
function parseDelimited(text, delim) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function serializeDelimited(rows, delim) {
  return rows.map(r => r.map(c => (c.includes(delim) || c.includes('"') || c.includes('\n') ? '"' + c.replace(/"/g, '""') + '"' : c)).join(delim)).join('\n');
}
async function openSheet(path) {
  let text = '';
  try { text = await fs.readText(path); } catch (e) { toast('读取失败: ' + e.message, 'err'); return; }
  const delim = getExt(path) === 'tsv' ? '\t' : ',';
  let rows = parseDelimited(text, delim);
  let view = 'table', dirty = false;
  const w = WM.create({ title: baseName(path) + ' — 表格', icon: 'sheet', width: 840, height: 560, app: 'sheet' });
  const body = w.body;
  body.innerHTML = `<div class="pad">
    <div class="pad-bar">
      <button class="btn sm acc" data-v="table">${icon('sheet')}表格视图</button>
      <button class="btn sm" data-v="text">${icon('txt')}文本视图</button>
      <span class="sp"></span>
      <span style="font-size:11px;color:var(--muted)" data-info></span>
      <button class="btn sm" data-a="save">${icon('save')}保存</button>
    </div>
    <div class="pad-body"></div>
  </div>`;
  const host = $('.pad-body', body);
  const info = () => { $('[data-info]', body).textContent = `${rows.length} 行 × ${Math.max(0, ...rows.map(r => r.length))} 列 · 分隔符 ${delim === '\t' ? 'Tab' : '逗号'}${dirty ? ' · 未保存' : ''}`; };
  const renderTable = () => {
    host.innerHTML = '';
    const wrap = el('div', 'sheet-wrap');
    const t = el('table', 'sheet');
    const cap = 800; let shown = 0;
    rows.forEach((r, ri) => {
      if (ri > cap) return;
      shown++;
      const tr = el('tr');
      tr.appendChild(el('td', '', String(ri + 1)));
      const maxC = Math.max(...rows.map(x => x.length));
      for (let ci = 0; ci < Math.max(r.length, 1); ci++) {
        const td = el('td'); td.contentEditable = true; td.textContent = r[ci] || '';
        td.addEventListener('input', () => { r[ci] = td.textContent; dirty = true; info(); });
        tr.appendChild(td);
      }
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    if (rows.length > cap) wrap.appendChild(el('div', '', `<div style="padding:10px;font-size:11.5px;color:var(--muted)">已截断显示前 ${cap} 行（共 ${rows.length} 行），完整内容请切换到文本视图</div>`));
    host.appendChild(wrap);
    info();
  };
  const renderText = () => {
    host.innerHTML = '';
    const ta = el('textarea', 'pad-ta'); ta.spellcheck = false;
    ta.value = serializeDelimited(rows, delim);
    ta.addEventListener('input', () => { rows = parseDelimited(ta.value, delim); dirty = true; info(); });

/* ==================================================================

async function openViewer(startPath, forceMode) {

  const startName = baseName(startPath);

    const all = await fs.readdir(dir);

  } catch (e) { toast('无法读取目录: ' + e.message, 'err'); return; }
  if (!items.length) { toast('该目录下没有图片', 'warn'); return; }
  let idx = Math.max(0, items.findIndex(f => f.name === startName));
  const urls = new Map(); const blobs = [];
  const w = WM.create({ title: `漫画阅读器 — ${dir}`, icon: 'book', width: 860, height: 640, app: 'viewer' });
  const body = w.body;
  body.innerHTML = `<div class="vwr">
    <div class="vwr-bar">
      <button class="tbtn" data-a="mode" title="切换 条漫/单图">${icon('book')}</button>
      <button class="tbtn" data-a="prev">${icon('chevL')}</button>
      <span class="cnt" data-cnt></span>
      <button class="tbtn" data-a="next">${icon('chevR')}</button>

      <button class="tbtn" data-a="zoomin">${icon('zoomIn')}</button>
      <button class="tbtn" data-a="dl" title="导出当前图片">${icon('download')}</button>

    <div class="vwr-single" style="display:none"><img alt=""></div>

  </div>`;
  const strip = $('.vwr-strip', body), single = $('.vwr-single', body), img = $('img', single), load = $('.vwr-load', body);
  let mode = forceMode || 'strip', scale = 1, tx = 0, ty = 0;
  const setCnt = () => { $('[data-cnt]', body).textContent = `${idx + 1} / ${items.length}`; WM.setTitle(w.id, `${items[idx] ? items[idx].name : ''} — ${mode === 'strip' ? '漫画阅读器' : '图片查看器'}`); };
  const getURL = async i => {
    if (urls.has(i)) return urls.get(i);
    const f = await fs.file(items[i].path);
    const u = URL.createObjectURL(f);
    urls.set(i, u); blobs.push(u);

  };
  // —— 条漫模式：并行读取，按序插入 ——
  const renderStrip = async () => {
    strip.innerHTML = ''; load.style.display = 'grid';
    const results = await Promise.all(items.map(async (it, i) => {
      try { const f = await fs.file(it.path); $('[data-lp]', body).textContent = `正在加载 ${i + 1}/${items.length}…`; return f; }
      catch (e) { return null; } // 单张失败跳过
    }));
    strip.innerHTML = '';
    results.forEach((f, i) => { // 按排序后顺序依次插入
      if (!f) return;
      const u = URL.createObjectURL(f);
      urls.set(i, u); blobs.push(u);
      const im = el('img'); im.src = u; im.dataset.i = i; im.alt = items[i].name;
      strip.appendChild(im);
    });
    load.style.display = 'none';
    setCnt();
    const target = strip.querySelector(`img[data-i="${idx}"]`);
    if (target) setTimeout(() => target.scrollIntoView({ block: 'start' }), 60); // 定位到点击的图片
  };
  // —— 单图模式：缩放/平移 ——
  const applyT = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  const renderSingle = async () => {
    load.style.display = 'grid'; $('[data-lp]', body).textContent = '正在加载…';
    try { img.src = await getURL(idx); } catch (e) { toast('图片读取失败', 'err'); }
    scale = 1; tx = 0; ty = 0; applyT();
    img.onload = () => load.style.display = 'none';
    setCnt();
  };
  const setMode = m => {
    mode = m;
    strip.style.display = m === 'strip' ? 'flex' : 'none';
    single.style.display = m === 'single' ? 'grid' : 'none';

    if (m === 'strip') renderStrip(); else renderSingle();
  };
  $('[data-a="mode"]', body).onclick = () => setMode(mode === 'strip' ? 'single' : 'strip');
  const step = d => {
    idx = (idx + d + items.length) % items.length;
    if (mode === 'single') renderSingle();
    else { const t = strip.querySelector(`img[data-i="${idx}"]`); t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    setCnt();
  };
  $('[data-a="prev"]', body).onclick = () => step(-1);
  $('[data-a="next"]', body).onclick = () => step(1);
  $('[data-a="zoomin"]', body).onclick = () => { if (mode !== 'single') setMode('single'); scale = clamp(scale * 1.25, .1, 8); applyT(); };
  $('[data-a="zoomout"]', body).onclick = () => { if (mode !== 'single') setMode('single'); scale = clamp(scale / 1.25, .1, 8); applyT(); };
  $('[data-a="fit"]', body).onclick = () => { if (mode !== 'single') setMode('single'); scale = 1; tx = 0; ty = 0; applyT(); };
  $('[data-a="dl"]', body).onclick = () => downloadPath(items[idx].path);
  single.addEventListener('wheel', e => { e.preventDefault(); scale = clamp(scale * (e.deltaY < 0 ? 1.12 : .89), .1, 8); applyT(); }, { passive: false });
  single.addEventListener('pointerdown', e => {
    single.setPointerCapture(e.pointerId);
    const sx = e.clientX - tx, sy = e.clientY - ty;
    const mv = ev => { tx = ev.clientX - sx; ty = ev.clientY - sy; applyT(); };
    const up = () => { single.removeEventListener('pointermove', mv); single.removeEventListener('pointerup', up); };
    single.addEventListener('pointermove', mv); single.addEventListener('pointerup', up);
  });
  w.el.tabIndex = 0;
  w.el.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') step(-1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') step(1);
    if (e.key === 'f' || e.key === 'F') toggleFull();
  });
  // —— 全屏沉浸：隐藏标题栏，仅留右上角退出按钮 ——
  const exitBtn = el('button', 'manga-exit', icon('x'));
  exitBtn.title = '退出全屏';
  w.el.appendChild(exitBtn);
  const toggleFull = async () => {
    if (w.el.classList.contains('manga-full')) {
      w.el.classList.remove('manga-full');
      if (document.fullscreenElement) await document.exitFullscreen().catch(() => { });
    } else {
      w.el.classList.add('manga-full');
      await w.el.requestFullscreen().catch(() => toast('浏览器拒绝了全屏', 'warn'));
    }
  };
  exitBtn.onclick = e => { e.stopPropagation(); toggleFull(); };
  $('[data-a="full"]', body).onclick = toggleFull;
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && w.el.classList.contains('manga-full')) w.el.classList.remove('manga-full');
  });
  w.onClose = () => { blobs.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { } }); if (document.fullscreenElement === w.el) document.exitFullscreen().catch(() => { }); };
  setMode(mode);
  return w;
}

/* ==================================================================
   计算器
   ================================================================== */
function calcEval(expr) {
  const tokens = expr.match(/(\d+\.?\d*)|(\.\d+)|[+\-*/%^()]/g);
  if (!tokens) throw new Error('无效表达式');
  const out = [], ops = [];
  const prec = { '+': 1, '-': 1, '*': 2, '/': 2, '%': 2, '^': 3, 'u-': 4 };
  const apply = () => {
    const op = ops.pop(), b = out.pop(), a = op === 'u-' ? 0 : out.pop();
    if (a === undefined || b === undefined) throw new Error('表达式不完整');
    out.push(op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : op === '/' ? (b === 0 ? NaN : a / b) : op === '%' ? a % b : op === '^' ? Math.pow(a, b) : -b);
  };
  let prev = null;
  for (const t of tokens) {
    if (/^\d|^\./.test(t)) { out.push(parseFloat(t)); prev = 'n'; }
    else if (t === '(') { ops.push(t); prev = '('; }
    else if (t === ')') { while (ops.length && ops[ops.length - 1] !== '(') apply(); if (!ops.length) throw new Error('括号不匹配'); ops.pop(); prev = 'n'; }
    else {
      let op = t;
      if (t === '-' && (prev === null || prev === '(' || prev === 'op')) op = 'u-';
      while (ops.length && ops[ops.length - 1] !== '(' && prec[ops[ops.length - 1]] >= prec[op] && op !== '^') apply();
      ops.push(op); prev = 'op';
    }
  }
  while (ops.length) { if (ops[ops.length - 1] === '(') throw new Error('括号不匹配'); apply(); }
  if (out.length !== 1 || !isFinite(out[0])) throw new Error('计算错误');
  return Math.round(out[0] * 1e12) / 1e12;
}
function openCalc() {
  const w = WM.create({ title: '计算器', icon: 'calc', width: 330, height: 500, app: 'calc', single: true });
  const body = w.body;
  body.innerHTML = `<div class="calc">
    <div class="calc-disp"><div class="calc-hist"></div><div class="calc-out">0</div></div>
    <div class="calc-grid">
      <button class="cl" data-k="C">C</button><button class="op" data-k="(">(</button><button class="op" data-k=")">)</button><button class="op" data-k="/">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
      <button data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="^">xʸ</button><button class="eq" data-k="=">=</button>
    </div>
  </div>`;
  const out = $('.calc-out', body), histEl = $('.calc-hist', body);
  let expr = '';
  const upd = () => { out.textContent = expr || '0'; };
  const press = k => {
    if (k === 'C') { expr = ''; histEl.textContent = ''; }
    else if (k === '=') {
      try { const r = calcEval(expr); histEl.textContent = expr + ' ='; expr = String(r); }
      catch (e) { histEl.textContent = '错误'; }
    }
    else if (k === 'back') expr = expr.slice(0, -1);
    else expr += k;
    upd();
  };
  $$('.calc-grid button', body).forEach(b => b.onclick = () => press(b.dataset.k));
  w.el.tabIndex = 0;
  w.el.addEventListener('keydown', e => {
    if (/^[0-9+\-*/%^().]$/.test(e.key)) press(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); press('='); }
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Escape') press('C');
  });
  setTimeout(() => w.el.focus(), 50);
  return w;
}

    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#fdfbf5'; ctx.fillRect(0, 0, r.width, r.height);
    if (img) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = img; }
    ctx.lineCap = ctx.lineJoin = 'round';
  };
  setTimeout(fit, 30);
  w.el.addEventListener('win-resize', debounce(fit, 200));
  const pushUndo = () => { undoStack.push(cv.toDataURL()); if (undoStack.length > 30) undoStack.shift(); };
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); pushUndo();
    drawing = true; last = pos(e);
    cv.setPointerCapture(e.pointerId);
    ctx.strokeStyle = tool === 'eraser' ? '#fdfbf5' : color;
    ctx.lineWidth = tool === 'eraser' ? size * 2.4 : size;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .01, last.y + .01); ctx.stroke();
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const stop = () => drawing = false;
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  $$('.paint-bar [data-t]', body).forEach(b => b.onclick = () => { tool = b.dataset.t; $$('.paint-bar [data-t]', body).forEach(x => x.classList.toggle('on', x === b)); });
  $('input[type=color]', body).oninput = e => color = e.target.value;
  $('input[type=range]', body).oninput = e => { size = +e.target.value; $('.paint-size', body).textContent = size + 'px'; };
  $('[data-a="undo"]', body).onclick = () => {
    if (!undoStack.length) return;
    const im = new Image();
    im.onload = () => { const r = cv.getBoundingClientRect(); ctx.fillStyle = '#fdfbf5'; ctx.fillRect(0, 0, r.width, r.height); ctx.drawImage(im, 0, 0, r.width, r.height); };
    im.src = undoStack.pop();
  };
  $('[data-a="clear"]', body).onclick = () => { pushUndo(); const r = cv.getBoundingClientRect(); ctx.fillStyle = '#fdfbf5'; ctx.fillRect(0, 0, r.width, r.height); };
  $('[data-a="save"]', body).onclick = async () => {
    cv.toBlob(async b => {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const name = await fs.uniqueName('/Pictures', `画板-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`);
      await fs.writeFile(joinPath('/Pictures', name), b);
      toast('已保存到 /Pictures/' + name, 'ok');
    }, 'image/png');
  };
  return w;
}

/* ==================================================================
   压缩包解压 —— zip(JSZip) / gz(DecompressionStream) / tar / tar.gz / 7z(7z-wasm)
   ================================================================== */
async function gunzip(buf) {
  if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持 DecompressionStream');
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([buf]).stream().pipeThrough(ds);
  return await new Response(stream).arrayBuffer();
}
function untar(buf) {
  const u8 = new Uint8Array(buf); const files = [];
  let off = 0, longName = null;
  const dec = new TextDecoder();
  const readStr = (o, len) => { let s = dec.decode(u8.subarray(o, o + len)); const z = s.indexOf('\0'); return z >= 0 ? s.slice(0, z) : s; };
  while (off + 512 <= u8.length) {
    if (u8[off] === 0 && u8[off + 1] === 0) break;
    const name = longName || readStr(off, 100);
    longName = null;
    const size = parseInt(readStr(off + 124, 12).trim(), 8) || 0;
    const type = String.fromCharCode(u8[off + 156]);
    const prefix = u8[off + 257] === 'u' && readStr(off + 257, 6).startsWith('ustar') ? readStr(off + 345, 155) : '';
    const full = prefix ? prefix + '/' + name : name;
    off += 512;
    if (type === 'L') { longName = dec.decode(u8.subarray(off, off + size)).replace(/\0.*$/, ''); }
    else if (type === '5' || full.endsWith('/')) files.push({ name: full.replace(/\/$/, ''), dir: true });
    else if (type === '0' || type === '\0' || type === '') files.push({ name: full, dir: false, data: buf.slice(off, off + size) });
    off += Math.ceil(size / 512) * 512;
  }
  return files;
}
async function extractZip(buf, destDir, progress) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip 未加载（需要网络），请尝试 7z 引擎');
  const zip = await JSZip.loadAsync(buf);
  const entries = Object.values(zip.files);
  let n = 0;
  for (const en of entries) {
    const p = joinPath(destDir, en.name);
    if (en.dir) { await fs.mkdir(p); continue; }
    const data = await en.async('arraybuffer');
    await fs.writeFile(p, data);
    progress && progress(++n, entries.length);
  }
  return n;
}
async function extract7z(buf, destDir, fname) {
  // 7z-wasm 引擎（按需动态加载，模块见文档 7z-wasm@1.2.0）
  const mod = await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
  const SevenZip = mod.default;
  const sz = await SevenZip();
  const inName = '/input.' + (getExt(fname) || '7z');
  sz.FS.writeFile(inName, new Uint8Array(buf));
  sz.FS.mkdir('/out');
  const code = sz.callMain(['x', inName, '-o/out', '-y']);
  if (code !== 0) throw new Error('7z 解压失败 (code ' + code + ')');
  let n = 0;
  const walkNode = async (vp, tp) => {
    for (const name of sz.FS.readdir(vp)) {
      if (name === '.' || name === '..') continue;
      const cp = vp + '/' + name, target = tp ? tp + '/' + name : name;
      const st = sz.FS.stat(cp);
      if (sz.FS.isDir(st.mode)) { await fs.mkdir(joinPath(destDir, target)); await walkNode(cp, target); }
      else { n++; await fs.writeFile(joinPath(destDir, target), sz.FS.readFile(cp)); }
    }
  };
  await walkNode('/out', '');
  return n;
}
async function extractArchive(path) {
  const ext = getExt(path);
  const name = baseName(path);
  const ok = await confirmBox(`将「${name}」解压到当前目录下的同名文件夹？`, { title: '解压压缩包', okText: '解压', icon: 'zip' });
  if (!ok) return;
  const t = toast('正在解压 ' + name + '…', 'info', 60000);
  try {
    const buf = await fs.readFile(path);
    const destDir = joinPath(dirName(path), await fs.uniqueName(dirName(path), stripExt(name)));
    await fs.mkdir(destDir);
    let n = 0;
    if (ext === 'zip') n = await extractZip(buf, destDir);
    else if (ext === 'tar') { for (const f of untar(buf)) { if (f.dir) await fs.mkdir(joinPath(destDir, f.name)); else { await fs.writeFile(joinPath(destDir, f.name), f.data); n++; } } }
    else if (ext === 'tgz' || ext === 'tar.gz') { const tbuf = await gunzip(buf); for (const f of untar(tbuf)) { if (f.dir) await fs.mkdir(joinPath(destDir, f.name)); else { await fs.writeFile(joinPath(destDir, f.name), f.data); n++; } } }
    else if (ext === 'gz') { const d = await gunzip(buf); await fs.writeFile(joinPath(destDir, stripExt(name)), d); n = 1; }
    else if (['7z', 'rar', 'bz2', 'xz'].includes(ext)) n = await extract7z(buf, destDir, name);
    else throw new Error('不支持的压缩格式: ' + ext);
    t.remove();
    toast(`解压完成：${n} 个文件 → ${destDir}`, 'ok', 4200);
    openExplorer(destDir);
  } catch (e) {
    t.remove();
    console.error(e);
    // zip 失败时尝试 7z 引擎兜底
    if (ext === 'zip') {
      try {
        const buf = await fs.readFile(path);
        const destDir = joinPath(dirName(path), await fs.uniqueName(dirName(path), stripExt(baseName(path))));
        await fs.mkdir(destDir);
        const n = await extract7z(buf, destDir, baseName(path));
        toast(`解压完成：${n} 个文件 → ${destDir}`, 'ok');
        openExplorer(destDir);
        return;
      } catch (e2) { }
    }
    toast('解压失败: ' + e.message, 'err', 4200);
  }
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = el('script'); s.src = src;
    s.onload = () => res(); s.onerror = () => rej(new Error('脚本加载失败: ' + src));
    document.head.appendChild(s);
  });
}

function mdToHtml(md) {

    if (inCode) { out.push(escH(line)); continue; }

      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="background:#eee;padding:1px 5px;border-radius:4px">$1</code>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');

    if (line.trim() === '') { out.push(''); continue; }
    if (/^>\s?/.test(line)) { out.push('<blockquote style="border-left:3px solid #ccc;margin:0;padding-left:12px;color:#666">' + l.replace(/^&gt;\s?/, '') + '</blockquote>'); continue; }
    out.push('<p>' + l + '</p>');
  }
  if (inList) out.push('</ul>');
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:Georgia,"Songti SC",serif;max-width:760px;margin:24px auto;padding:0 18px;line-height:1.75;color:#222}h1,h2{border-bottom:1px solid #eee;padding-bottom:.3em}pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto}</style></head><body>' + out.join('\n') + '</body></html>';

  };
  $('[data-a="browser"]', body).onclick = async () => {
    if (sourcePath) { await fs.writeFile(sourcePath, cm.getValue()).catch(() => { }); openBrowser({ vfsPath: sourcePath }); }
    else {
      try {
        await fs.mkdir('/Documents/.cache');
        const p = '/Documents/.cache/preview-' + Date.now() + '.html';
        await fs.writeFile(p, buildDoc());
        openBrowser({ vfsPath: p });
      } catch (e) { toast('无法打开预览: ' + e.message, 'err'); }
    }
  };
  $('[data-a="import"]', body).onclick = async () => {
    const files = await pickFiles(false, '.html,.htm,.css,.js,.mjs,.json,.md,.markdown,.xml,.svg,.txt');
    if (!files.length) return;
    const f = files[0];
    cm.setValue(await f.text());
    const m = modeFromExt(getExt(f.name));
    cm.setOption('mode', m); modeSel.value = m;
    toast('已导入 ' + f.name, 'ok');
  };
  $('[data-a="prev"]', body).onclick = () => {
    prevPane.classList.toggle('hidden');
    split.style.display = prevPane.classList.contains('hidden') ? 'none' : '';
    codePane.style.flex = '1 1 100%';
    if (!prevPane.classList.contains('hidden')) { prevPane.style.flex = '1 1 45%'; codePane.style.flex = '1 1 55%'; runPreview(); }
    cm.refresh();
  };
  modeSel.onchange = () => { cm.setOption('mode', modeSel.value); updStatus(); runPreview(); };

  /* ---- 可拖拽分割条 ---- */
  split.addEventListener('pointerdown', e => {
    e.preventDefault();
    split.classList.add('on');
    split.setPointerCapture(e.pointerId);
    const main = $('.edt-main', body);
    const mv = ev => {
      const r = main.getBoundingClientRect();
      let px = ev.clientX - r.left;
      px = clamp(px, 200, r.width - 120); // 编辑区最小 200 / 预览区最小 120
      codePane.style.flex = 'none'; codePane.style.width = px + 'px';
      prevPane.style.flex = '1 1 auto';
    };
    const up = () => { split.classList.remove('on'); split.removeEventListener('pointermove', mv); split.removeEventListener('pointerup', up); cm.refresh(); };
    split.addEventListener('pointermove', mv);
    split.addEventListener('pointerup', up);
  });
  w.el.addEventListener('win-resize', () => cm.refresh());
  w.onClose = () => { try { cm.toTextArea(); } catch (e) { } if (iframe._blob) URL.revokeObjectURL(iframe._blob); };
  if (sourcePath) WM.setTitle(w.id, baseName(sourcePath) + ' — HTML编辑器');
  setTimeout(() => { cm.refresh(); runPreview(); }, 60);
  return w;
}

/* ==================================================================
   系统启动（无加载动画，直接进入）
   ================================================================== */
(async function boot() {
  Store.load();
  try { await IDB.open(); } catch (e) { console.warn('IndexedDB 不可用', e); }
  try { await fs.init(); } catch (e) { toast('文件系统初始化失败: ' + e.message, 'err', 5000); }
  try { await seedDefaults(); } catch (e) { console.warn(e); }
  try { await applyWallpaper(); } catch (e) { }
  Desktop.bindSurface();
  await Desktop.render();
  Dock.init();
  try { await fs.restoreMounts(); } catch (e) { }
  Dock.updateRemount();
  // 桌面目录变化 → 重绘桌面
  fs.on(p => { if (normPath(p) === '/Desktop') Desktop.render(); });
  // 记录会话（Cookie）
  setCookie('inkisle_last', String(Date.now()));
  // 窗口尺寸变化 → 桌面图标重新收拢
  let _rsz;
  window.addEventListener('resize', () => { clearTimeout(_rsz); _rsz = setTimeout(() => Desktop.render(), 260); });
})();
</script>
</body>
</html>
