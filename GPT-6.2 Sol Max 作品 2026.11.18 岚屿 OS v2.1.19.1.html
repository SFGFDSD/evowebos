const guideText=`岚屿 OS / 使用指南
==================

工作区
单击打开文件与应用。右键可使用“打开方式”、重命名、导出或删除。桌面图标可在网格内拖动，布局自动保留。
从资源管理器的空白处拖出选框，或者用 Ctrl / Shift 选取多个项目。手机可从空白处框选，也可以先切到多选模式。
电脑可将文件和目录拖入窗口；在支持的浏览器里也可以拖出文件。若本机不接受拖出，请使用“导出 / 下载”。

存储
所有应用使用同一套 fs API。OPFS 和 IndexedDB 都可在设置中启用显示，并能在两者之间复制文件。
挂载的本机文件夹不需要先导入。授权和原生拖出取决于浏览器能力；桌面 Chrome 或 Edge 通常功能最完整。
浏览器配额不是硬盘剩余空间。重要文件建议定期导出备份。

快捷键
Alt + Space：打开应用启动器
Alt + Shift + F：全局搜索
Alt + Shift + D：显示桌面
Alt + Shift + 方向键：贴靠窗口或还原
Ctrl / Command + A：选择全部文件
Ctrl / Command + C / X / V：复制、剪切、粘贴
Ctrl / Command + S：保存文档；编辑器支持自动保存
F2：重命名；F5：刷新文件；Delete：移至回收站

岚屿的浏览器来自本地。你可以放心地慢慢整理。
