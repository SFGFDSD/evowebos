<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<title>Mothgrid · 蛾光测绘</title>
<script>
/* 首帧主题：Cookie 与 localStorage 共同决定，防止闪烁 */
(function(){try{var m=document.cookie.match(/(?:^|; )mg_theme=(\w+)/);var t=m?m[1]:null;var s=JSON.parse(localStorage.getItem('mg_settings')||'{}');if(s.theme)t=s.theme;document.documentElement.setAttribute('data-theme',t||'dark');if(s.accent)document.documentElement.style.setProperty('--accent',s.accent);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" onerror="window.__jszipFailed=true"></script>
<!-- V86 虚拟机模拟器（异步，不阻塞启动） -->
<script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js" async onerror="window.__v86Failed=true"></script>
<!-- ========== 7z-wasm 解压引擎 ========== -->

import SevenZip from 'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js';
window.SevenZip = SevenZip;

<style>
/* ============================================================
   MOTHGRID 设计系统 — 「蛾光测绘」
   钠灯琥珀 × 墨黑测绘纸 × 等高线 × 套准标记 × 朱砂航线
   ============================================================ */
:root{
  --font:'LXGW WenKai Screen','LXGW WenKai','Noto Serif SC','Songti SC',serif;
  --mono:'Martian Mono','Sarasa Mono SC',ui-monospace,Menlo,monospace;
  --r:2px; --ease:cubic-bezier(.2,.8,.2,1); --tb-h:50px;
  --cw:92px; --ch:100px;
}
[data-theme=dark]{
  --bg0:#0c0a09; --bg1:#14110e; --bg2:#1d1915; --bg3:#26201a;
  --panel:rgba(19,16,13,.88); --panel2:rgba(28,23,19,.97); --glass:rgba(16,13,11,.74);
  --line:rgba(255,184,82,.13); --line2:rgba(255,184,82,.32);
  --text:#efe4d0; --dim:#a3947e; --faint:#6e6254;
  --accent:#ffb347; --accent-ink:#1a1206; --accent-soft:rgba(255,179,71,.12);
  --hot:#ff5a36; --ok:#a6d16e; --sel:rgba(255,179,71,.2);
  --card:#1d1915; --tile:#17130f;
  --shadow:0 30px 80px -24px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.6);
}
[data-theme=light]{
  --bg0:#ebe2cf; --bg1:#f4eee2; --bg2:#e4d9c4; --bg3:#d9ccb3;
  --panel:rgba(247,242,232,.92); --panel2:rgba(244,238,226,.98); --glass:rgba(246,240,228,.8);
  --line:rgba(36,42,66,.14); --line2:rgba(36,42,66,.32);
  --text:#1e2232; --dim:#5b5850; --faint:#8b8478;
  --accent:#b4530c; --accent-ink:#fff8ec; --accent-soft:rgba(180,83,12,.1);
  --hot:#c8321c; --ok:#4f7d22; --sel:rgba(180,83,12,.16);
  --card:#fbf7ef; --tile:#f2ebdd;
  --shadow:0 24px 60px -22px rgba(60,40,10,.38),0 0 0 1px rgba(60,40,10,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--text);font-family:var(--font);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex:none}
::selection{background:var(--accent);color:var(--accent-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}
body.noanim *{animation:none!important;transition:none!important}

/* ---------- 壁纸 ---------- */
#wallpaper{position:fixed;inset:0;background:var(--bg0) center/cover no-repeat;transition:background-image .6s}
#wp-veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45));mix-blend-mode:multiply}
[data-theme=light] #wp-veil{background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(80,50,10,.12))}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h);overflow:hidden;user-select:none;-webkit-user-select:none}
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px 4px;border:1px solid transparent;border-radius:var(--r);transition:left .34s var(--ease),top .34s var(--ease),background .15s;touch-action:none;cursor:default;animation:iconIn .5s var(--ease) both;animation-delay:calc(var(--i,0) * 28ms)}
.dicon .art{width:calc(var(--cw) * .56);height:calc(var(--cw) * .56);display:grid;place-items:center;position:relative;pointer-events:none}
.dicon .art svg,.dicon .art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.dicon .art img{border:1px solid var(--line2);background:var(--card)}
.dicon .lbl{font-size:12px;line-height:1.3;text-align:center;color:#f6eddc;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;pointer-events:none;padding:0 2px}
[data-theme=light] .dicon .lbl{color:#1e2232;text-shadow:0 0 6px rgba(255,250,240,.95),0 0 2px #fff}
.dicon:hover{background:rgba(255,179,71,.09)}
.dicon.sel{background:var(--sel);border-color:var(--line2)}
.dicon.sel::before,.dicon.sel::after{content:'';position:absolute;width:7px;height:7px;border:1px solid var(--accent)}
.dicon.sel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.dicon.sel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.dicon.cut{opacity:.45}
.drop-hover{outline:1px dashed var(--accent)!important;outline-offset:-2px;background:var(--accent-soft)!important}
@keyframes iconIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.marquee{position:absolute;pointer-events:none;border:1px solid var(--accent);background:rgba(255,179,71,.1);z-index:50;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
.marquee::after{content:attr(data-n);position:absolute;right:2px;bottom:1px;font:9px var(--mono);color:var(--accent)}

/* ---------- 窗口 ---------- */
#windows{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h);pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;pointer-events:auto;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);min-width:260px;min-height:160px;border-radius:var(--r);animation:winIn .3s var(--ease);transition:opacity .2s,transform .25s var(--ease),filter .2s}
body.blur .win{backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25)}
.win::before,.win::after{content:'';position:absolute;width:12px;height:12px;pointer-events:none;z-index:4;border:1px solid var(--faint);transition:border-color .2s}
.win::before{left:-5px;top:-5px;border-right:0;border-bottom:0}.win::after{right:-5px;bottom:-5px;border-left:0;border-top:0}
.win.active{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.win.active::before,.win.active::after{border-color:var(--accent)}
.win.anim{transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease),opacity .2s,transform .25s var(--ease)}
.win.min{opacity:0;transform:translateY(60px) scale(.86);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .25s var(--ease),visibility 0s .25s}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.max::before,.win.max::after{display:none}
.win.closing{opacity:0;transform:scale(.96);pointer-events:none}
@keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tb{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 3px 0 10px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none;position:relative}
.win.active .tb{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.tb-ic{display:grid;place-items:center;color:var(--accent)}
.tb-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-coord{font:9px var(--mono);color:var(--faint);letter-spacing:.06em;white-space:nowrap;margin-left:auto;padding-right:4px}
.tb-extra{display:flex;gap:4px}
.ctrls{display:flex;gap:2px}
.ctrls button{width:36px;height:28px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--dim);border-radius:var(--r);transition:all .15s}
.ctrls button:hover{border-color:var(--line2);color:var(--text);background:var(--accent-soft)}
.ctrls button.cl:hover{background:var(--hot);border-color:var(--hot);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:5;touch-action:none}
.rz.n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}.rz.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.rz.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}.rz.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz.ne{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}.rz.sw{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.rz.nw{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}.rz.se{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
.win.max .rz{display:none}
#snap-preview{position:fixed;pointer-events:none;z-index:8000;border:1px solid var(--accent);background:repeating-linear-gradient(135deg,rgba(255,179,71,.08) 0 8px,rgba(255,179,71,.03) 8px 16px);opacity:0;transition:all .18s var(--ease);border-radius:var(--r)}
#snap-preview.show{opacity:1}
/* Aero Peek */
body.peeking .win:not(.peek-target){opacity:.05;filter:blur(1px)}
body.peeking .win.peek-target{opacity:1!important;visibility:visible!important;transform:none!important;z-index:7999!important}
body.peek-desktop .win{background:transparent!important;backdrop-filter:none!important;box-shadow:none;border-color:var(--line2)}
body.peek-desktop .win>*{opacity:0}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:center;gap:6px;padding:0 0 0 8px;background:var(--glass);border-top:1px solid var(--line);z-index:9000;backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3)}
#taskbar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 20%,transparent 50%);opacity:.5}
#start-btn{width:42px;height:38px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--accent);border-radius:var(--r);transition:all .2s;position:relative}
#start-btn:hover,#start-btn.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 24px rgba(255,179,71,.45)}
#tasks{flex:1;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;min-width:0;height:100%;align-items:center}
#tasks::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 10px;max-width:210px;min-width:44px;border:1px solid transparent;background:none;position:relative;border-radius:var(--r);flex:none;transition:background .15s;animation:winIn .3s var(--ease)}
.task:hover{background:var(--accent-soft);border-color:var(--line)}
.task::after{content:'';position:absolute;left:50%;bottom:2px;width:6px;height:2px;background:var(--dim);transform:translateX(-50%);transition:width .25s var(--ease),background .2s}
.task.active{background:var(--accent-soft);border-color:var(--line2)}
.task.active::after{width:60%;background:var(--accent)}
.task.min{opacity:.6}
.task .tt{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.task .tx{width:20px;height:20px;display:grid;place-items:center;border-radius:var(--r);opacity:0;color:var(--dim);border:0;background:none;padding:0}
.task:hover .tx{opacity:1}.task .tx:hover{background:var(--hot);color:#fff}
#tray{display:flex;align-items:center;gap:2px;height:100%}
.tray-btn{height:38px;min-width:36px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--dim);border-radius:var(--r);padding:0 6px}
.tray-btn:hover{color:var(--text);background:var(--accent-soft);border-color:var(--line)}
#clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.25;padding:0 10px}
#clock .t{font:500 12px var(--mono);color:var(--text);letter-spacing:.02em}
#clock .d{font:9.5px var(--mono);color:var(--dim)}
#show-desktop{width:10px;height:100%;border-left:1px solid var(--line);cursor:pointer;transition:background .2s}
#show-desktop:hover{background:var(--accent-soft)}

/* ---------- 开始菜单 ---------- */
#start{position:fixed;left:8px;bottom:calc(var(--tb-h) + 8px);width:min(600px,calc(100vw - 16px));height:min(640px,calc(100dvh - var(--tb-h) - 16px));background:var(--panel2);border:1px solid var(--line2);box-shadow:var(--shadow);z-index:9500;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .2s,transform .28s var(--ease);border-radius:var(--r);overflow:hidden}
body.blur #start{backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
#start.open{opacity:1;transform:none;pointer-events:auto}
.st-head{padding:18px 18px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.st-brand{display:flex;align-items:baseline;gap:10px}
.st-brand b{font:600 15px var(--mono);letter-spacing:.24em;color:var(--accent)}
.st-brand span{color:var(--dim);font-size:12px}
.st-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:0 10px;height:38px;background:var(--bg1);border-radius:var(--r)}
.st-search input{flex:1;border:0;background:none;color:var(--text);font:inherit;outline:none;min-width:0}
.st-body{flex:1;overflow:auto;padding:14px 18px}
.st-h{font:9.5px var(--mono);letter-spacing:.2em;color:var(--faint);margin:6px 0 10px;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.st-h::after{content:'';flex:1;height:1px;background:var(--line)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:16px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid transparent;background:none;border-radius:var(--r);font-size:12px;text-align:center;opacity:0;transform:translateY(8px)}
#start.open .st-app{animation:iconIn .4s var(--ease) forwards;animation-delay:calc(var(--i) * 22ms)}
.st-app:hover{border-color:var(--line2);background:var(--accent-soft)}
.st-app svg{width:40px;height:40px}
.st-list .st-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r);cursor:pointer;font-size:13px;border:1px solid transparent}
.st-row:hover,.st-row.kb{background:var(--accent-soft);border-color:var(--line)}
.st-row .p{margin-left:auto;font:10px var(--mono);color:var(--faint);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-foot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--accent-soft)}
.st-user{display:flex;align-items:center;gap:10px;margin-right:auto;font-size:12.5px}
.st-avatar{width:30px;height:30px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent)}

/* ---------- 菜单 / 对话框 / 提示 ---------- */
.ctx{position:fixed;min-width:220px;max-width:320px;background:var(--panel2);border:1px solid var(--line2);box-shadow:var(--shadow);padding:4px;z-index:10000;font-size:13px;border-radius:var(--r);animation:ctxIn .14s var(--ease);max-height:calc(100dvh - 16px);overflow:auto}
body.blur .ctx{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@keyframes ctxIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.ctx .it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);cursor:default;white-space:nowrap;position:relative}
.ctx .it .k{margin-left:auto;padding-left:18px;font:10px var(--mono);color:var(--faint)}
.ctx .it:hover,.ctx .it.open{background:var(--accent);color:var(--accent-ink)}
.ctx .it:hover .k{color:var(--accent-ink)}
.ctx .it.dis{opacity:.4;pointer-events:none}
.ctx .it.bold{font-weight:700}
.ctx .it .ico{width:16px;display:grid;place-items:center;opacity:.85}
.ctx .sep{height:1px;background:var(--line);margin:4px 6px}
.ctx .hdr{font:9.5px var(--mono);color:var(--faint);letter-spacing:.14em;padding:6px 10px 2px}
.modal-mask{position:fixed;inset:0;background:rgba(5,4,3,.5);z-index:11000;display:grid;place-items:center;animation:fadeIn .15s;padding:12px}
@keyframes fadeIn{from{opacity:0}}
.dialog{background:var(--panel2);border:1px solid var(--line2);box-shadow:var(--shadow);width:min(440px,100%);max-height:90dvh;display:flex;flex-direction:column;border-radius:var(--r);animation:winIn .22s var(--ease);position:relative}
.dialog::before{content:'';position:absolute;left:0;top:0;width:40px;height:2px;background:var(--accent)}
.dlg-title{padding:16px 18px 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.dlg-body{padding:6px 18px 14px;color:var(--dim);font-size:13.5px;overflow:auto;line-height:1.6}
.dlg-body .inp{width:100%;margin-top:6px}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.kv b{font-weight:400;color:var(--faint)}.kv span{color:var(--text);word-break:break-all}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb-h) + 12px);z-index:12000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;box-shadow:var(--shadow);max-width:min(380px,calc(100vw - 24px));display:flex;gap:12px;align-items:center;animation:toastIn .3s var(--ease);border-radius:var(--r)}
.toast.err{border-left-color:var(--hot)}.toast.ok{border-left-color:var(--ok)}
.toast.out{opacity:0;transform:translateX(20px);transition:all .25s}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}}
.touch-ghost{position:fixed;left:0;top:0;z-index:13000;pointer-events:none;width:64px;height:64px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--accent);opacity:.92;box-shadow:var(--shadow)}
.touch-ghost svg,.touch-ghost img{width:44px;height:44px;object-fit:contain}
.touch-ghost b{position:absolute;right:-8px;top:-8px;background:var(--accent);color:var(--accent-ink);font:600 10px var(--mono);padding:2px 6px}

/* 日历 */
.cal{position:fixed;right:8px;bottom:calc(var(--tb-h) + 8px);width:316px;background:var(--panel2);border:1px solid var(--line2);box-shadow:var(--shadow);z-index:9500;padding:16px;border-radius:var(--r);animation:winIn .22s var(--ease)}
body.blur .cal{backdrop-filter:blur(24px)}
.cal-time{font:300 30px var(--mono);letter-spacing:.02em}
.cal-date{color:var(--accent);font-size:13px;margin:2px 0 14px}
.cal-head{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.cal-head b{flex:1;font-weight:400}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .wd{font:9.5px var(--mono);color:var(--faint);padding:4px 0}
.cal-grid .d{padding:7px 0;font:12px var(--mono);border:1px solid transparent;cursor:pointer;border-radius:var(--r)}
.cal-grid .d:hover{border-color:var(--line2)}
.cal-grid .d.o{color:var(--faint)}
.cal-grid .d.t{background:var(--accent);color:var(--accent-ink)}
.cal-grid .d.s{border-color:var(--accent)}

/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:var(--r);font-size:12.5px;white-space:nowrap;transition:all .14s;flex:none}
.btn:hover{border-color:var(--line2);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:color-mix(in srgb,var(--hot) 60%,transparent);color:var(--hot)}
.btn.danger:hover{background:var(--hot);color:#fff}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:15px;height:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.toolbar.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.toolbar.scroll::-webkit-scrollbar{display:none}
.tsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.spacer{flex:1}
.inp{height:30px;background:var(--bg1);border:1px solid var(--line);color:var(--text);padding:0 8px;font:inherit;font-size:13px;border-radius:var(--r);outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
select.inp{padding-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{height:28px;border:0;background:none;padding:0 9px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.coarse-only{display:none!important}
@media (pointer:coarse){.coarse-only{display:inline-flex!important}}
.status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 10px;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden}
.status .r{margin-left:auto}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px;pointer-events:none;text-align:center;padding:20px}
.loading-line{position:absolute;left:0;top:0;height:2px;width:40%;background:var(--accent);animation:loadline 1s linear infinite}
@keyframes loadline{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.switch{position:relative;width:38px;height:20px;border:1px solid var(--line2);border-radius:20px;background:var(--bg1);flex:none;cursor:pointer;transition:all .2s}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:all .2s var(--ease)}
.switch.on{background:var(--accent);border-color:var(--accent)}.switch.on::after{left:20px;background:var(--accent-ink)}

/* ---------- 文件资源管理器 ---------- */
.ex{display:flex;flex-direction:column;height:100%;outline:none}
.ex-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.ex-bar .btn{padding:0 7px}
.crumbs{flex:1;min-width:0;height:30px;display:flex;align-items:center;border:1px solid var(--line);background:var(--bg1);border-radius:var(--r);overflow-x:auto;scrollbar-width:none;padding:0 4px;cursor:text}
.crumbs::-webkit-scrollbar{display:none}
.crumb{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;font-size:12.5px;white-space:nowrap;cursor:pointer;border-radius:var(--r);border:1px solid transparent}
.crumb:hover{background:var(--accent-soft);border-color:var(--line)}
.crumb-sep{color:var(--faint);display:grid;place-items:center}
.crumbs input{flex:1;border:0;background:none;color:var(--text);font:12.5px var(--mono);outline:none;height:100%}
.ex-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg1);padding:0 4px 0 8px;height:30px;width:240px;border-radius:var(--r);color:var(--dim)}
.ex-search input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:12.5px;outline:none}
.ex-search .glob{height:22px;font-size:11px;padding:0 6px;border:1px solid var(--line);background:none;border-radius:var(--r);color:var(--dim)}
.ex-search .glob.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ex-main{flex:1;display:flex;min-height:0;position:relative}
.ex-side{width:198px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:6px 4px 20px;background:color-mix(in srgb,var(--bg1) 40%,transparent)}
.side-h{font:9px var(--mono);letter-spacing:.18em;color:var(--faint);padding:12px 10px 4px;display:flex;align-items:center;gap:6px}
.side-it{display:flex;align-items:center;gap:9px;padding:6px 10px;cursor:pointer;font-size:13px;border-radius:var(--r);border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-it svg{color:var(--accent);opacity:.8}
.side-it:hover{background:var(--accent-soft)}
.side-it.on{background:var(--sel);border-color:var(--line2)}
.side-it .ej{margin-left:auto;opacity:.5;border:0;background:none;padding:2px;display:grid}
.side-it .ej:hover{opacity:1;color:var(--hot)}
.ex-view{flex:1;position:relative;overflow:auto;min-width:0;outline:none;user-select:none;-webkit-user-select:none}
.dv-head{position:sticky;top:0;z-index:3;display:flex;min-width:100%;width:max-content;background:var(--panel2);border-bottom:1px solid var(--line)}
.hc{flex:none;position:relative;height:30px;padding:0 10px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
.hc:hover{background:var(--accent-soft);color:var(--text)}
.hc.sorted{color:var(--accent)}
.hc .grip{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize;z-index:2;touch-action:none}
.hc .grip::after{content:'';position:absolute;right:4px;top:7px;bottom:7px;width:1px;background:var(--line2)}
.hc.dragover{box-shadow:inset 2px 0 0 var(--accent)}
.dv-rows{padding:3px 0 60px}
.row{display:flex;width:max-content;height:28px;margin:2px 0;align-items:center;border:1px solid transparent;border-radius:var(--r);cursor:default}
.row:hover{background:var(--accent-soft)}
.row.sel,.tile.sel,.cv-it.sel{background:var(--sel);border-color:var(--line2)}
.it.cut{opacity:.45}
.row .c{flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px;font-size:12.5px;color:var(--dim);text-align:left}
.row .c-name{display:flex;align-items:center;gap:8px;color:var(--text)}
.c-name .nm{overflow:hidden;text-overflow:ellipsis}
.c-name .loc{font:10px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.ic svg,.ic img{width:20px;height:20px;object-fit:cover}
.chk{width:15px;height:15px;border:1px solid var(--line2);flex:none;display:none;place-items:center;border-radius:2px}
.ex.multi .chk{display:grid}
.it.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.iv-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 60px;align-content:flex-start}
.tile{width:108px;height:124px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid transparent;border-radius:var(--r);position:relative}
.tile:hover{background:var(--accent-soft)}
.tile .th{width:72px;height:72px;display:grid;place-items:center}
.tile .th svg{width:64px;height:64px}
.tile .th img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--line2);background:var(--card)}
.tile .tl{font-size:12px;text-align:center;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.tile .chk{position:absolute;left:6px;top:6px}
.cv{display:flex;height:100%;overflow-x:auto}
.cv-pane{width:230px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:4px}
.cv-it{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px;border:1px solid transparent;border-radius:var(--r);white-space:nowrap;cursor:default}
.cv-it .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.cv-it:hover{background:var(--accent-soft)}
.cv-it.open{background:var(--accent-soft);border-color:var(--line)}
.cv-prev{min-width:280px;flex:1;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow:auto}
.cv-prev .pv{width:200px;height:200px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg1)}
.cv-prev .pv img{max-width:100%;max-height:100%}
.cv-prev .pv svg{width:110px;height:110px}
.ex-status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 10px;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--dim)}
.ex-status .r{margin-left:auto;display:flex;gap:10px;align-items:center}
@media (max-width:760px){
  .ex-side{position:absolute;left:0;top:0;bottom:0;z-index:20;background:var(--panel2);transform:translateX(-102%);transition:transform .25s var(--ease);box-shadow:var(--shadow);width:230px}
  .ex-side.open{transform:none}
  .ex-search{width:130px}
  .ex-bar .crumbs{min-width:80px}
}

/* ---------- 记事本 / 表格 ---------- */
.np{display:flex;flex-direction:column;height:100%}
.np-area{flex:1;width:100%;border:0;resize:none;outline:none;background:var(--bg1);color:var(--text);padding:16px 20px;font-family:var(--mono);line-height:1.7;tab-size:2}
.np-area.wrap{white-space:pre-wrap}.np-area:not(.wrap){white-space:pre;overflow-x:auto}
.np-banner{padding:6px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line2);font-size:12.5px;display:flex;align-items:center;gap:10px}
.np-find{display:flex;gap:4px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}
.sh{display:flex;flex-direction:column;height:100%}
.sh-wrap{flex:1;overflow:auto;background:var(--bg1);position:relative}
.sh-t{border-collapse:collapse;font-size:12.5px;font-family:var(--mono)}
.sh-t th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-weight:400;font-size:10.5px;padding:4px 8px;border:1px solid var(--line);z-index:2;min-width:90px}
.sh-t th:first-child{left:0;z-index:3;min-width:44px}
.sh-t td{border:1px solid var(--line);padding:4px 8px;min-width:90px;max-width:360px;white-space:pre-wrap;word-break:break-word;outline:none;vertical-align:top}
.sh-t td:focus{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.sh-t td.rn{position:sticky;left:0;background:var(--panel2);color:var(--faint);font-size:10.5px;text-align:right;min-width:44px;z-index:1}
.sh-t tr:first-child td:not(.rn){color:var(--accent)}

/* ---------- HTML 编辑器 ---------- */
.he{display:flex;flex-direction:column;height:100%;background:#212121}
.he .toolbar{background:var(--panel2)}
.he-tools .btn{height:28px;padding:0 8px;font-size:12px}
.he-tools select.inp{height:28px;font-size:12px}
.he-find{display:none;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.he-find.open{display:flex}
.he-find .inp{height:28px;width:180px}
.he-find .cnt{font:10.5px var(--mono);color:var(--dim);min-width:70px}
.he-find .cnt.bad{color:var(--hot)}
.he-find .opt{width:30px;height:28px;padding:0;justify-content:center;font-family:var(--mono);font-size:11px}
.he-main{flex:1;display:flex;min-height:0;position:relative}
.he-code{flex:1 1 50%;min-width:200px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.he-code .CodeMirror{flex:1;height:100%;font-family:var(--mono);font-size:var(--he-fs,13px);line-height:1.6}
.he-split{width:7px;flex:none;cursor:col-resize;background:var(--panel2);border-left:1px solid var(--line);border-right:1px solid var(--line);touch-action:none;position:relative}
.he-split::after{content:'';position:absolute;left:2px;top:50%;width:1px;height:30px;margin-top:-15px;background:var(--accent);box-shadow:2px 0 0 var(--accent)}
.he-prev{flex:1 1 50%;min-width:120px;display:flex;flex-direction:column;background:var(--bg1)}
.he-prev-head{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);font:10.5px var(--mono);color:var(--dim)}
.he-frame-wrap{flex:1;position:relative;background:#fff;min-height:0}
.he-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.he-console{height:130px;flex:none;border-top:1px solid var(--line);overflow:auto;font:11px/1.6 var(--mono);background:var(--bg0);display:none}
.he-console.open{display:block}
.he-console div{padding:2px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.he-console .warn{color:#ffcf6b}.he-console .error{color:var(--hot)}.he-console .info{color:#8fc9ff}
.he.dragging iframe{pointer-events:none}
.he.nopreview .he-prev,.he.nopreview .he-split{display:none}
.he-status{background:var(--panel2)}
.cm-find-hit{background:rgba(255,179,71,.28);border-bottom:1px solid #ffb347}
.cm-find-cur{background:#ffb347!important;color:#140c02!important}
.cm-find-cur span{color:#140c02!important}
.CodeMirror-hints{z-index:20000!important;font-family:var(--mono)!important;font-size:12px!important}
.he-main.stack{flex-direction:column}.he-main.stack .he-split{width:auto;height:7px;cursor:row-resize;border-left:0;border-right:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.he-main.stack .he-split::after{left:50%;top:2px;width:30px;height:1px;margin:0 0 0 -15px;box-shadow:0 2px 0 var(--accent)}.he-main.stack .he-code{min-width:0;min-height:120px}.he-main.stack .he-prev{min-width:0;min-height:100px}

/* ---------- 漫画阅读器 ---------- */
.mg-root{position:relative;flex:1;min-height:0;background:#000;overscroll-behavior-y:none;overflow:hidden;contain:layout style}
.mg-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;background:#000;overflow-anchor:none;cursor:grab;scrollbar-color:#333 #000}
.mg-scroll.grabbing{cursor:grabbing}
.mg-col{display:flex;flex-direction:column;align-items:center;width:100%;padding-bottom:40px}
.mg-item{width:var(--mgw,100%);max-width:100%;aspect-ratio:var(--ar,.7);background:#070707;position:relative;flex:none}
.mg-item img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.mg-item .ph{position:absolute;inset:0;display:grid;place-items:center;color:#3a3530;font:11px var(--mono);letter-spacing:.2em;background:linear-gradient(110deg,#080808 30%,#111 50%,#080808 70%) 0/200% 100%;animation:shimmer 1.4s linear infinite}
.mg-item.ok .ph{display:none}
@keyframes shimmer{to{background-position:-200% 0}}
.mg-hud{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(10,8,6,.82);border:1px solid rgba(255,179,71,.3);padding:5px;z-index:5;border-radius:var(--r);transition:opacity .3s;backdrop-filter:blur(10px);max-width:calc(100% - 20px);overflow-x:auto}
.mg-hud .btn{color:#efe4d0;border-color:rgba(255,179,71,.2);height:28px}
.mg-hud .pg{font:11px var(--mono);color:#ffb347;padding:0 8px;white-space:nowrap}
.mg-root.idle .mg-hud{opacity:0}
.mg-root.idle .mg-hud:hover{opacity:1}
.mg-loading{position:absolute;top:10px;left:50%;transform:translateX(-50%);font:11px var(--mono);color:#ffb347;background:rgba(0,0,0,.75);padding:6px 12px;border:1px solid rgba(255,179,71,.3);z-index:6;pointer-events:none;transition:opacity .4s}
.mg-exit{display:none;position:absolute;top:12px;right:12px;width:34px;height:34px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:rgba(255,255,255,.45);z-index:20;place-items:center;border-radius:50%;transition:all .2s}
.mg-exit:hover{color:#fff;background:rgba(0,0,0,.7)}
.win.mg-fs .mg-exit{display:grid}
.win.mg-fs .tb,.win.mg-fs .mg-hud,.win.mg-fs .mg-loading,.win.mg-fs .rz{display:none!important}
.win.mg-fs{border:0!important;border-radius:0!important}
.win.mg-fs::before,.win.mg-fs::after{display:none}
.win.pseudo-fs{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:99999!important}

/* ---------- 图片查看 / 媒体 / 浏览器 ---------- */
.ivw{display:flex;flex-direction:column;height:100%}
.iv-stage{flex:1;position:relative;overflow:hidden;background:repeating-conic-gradient(var(--bg1) 0 25%,var(--bg2) 0 50%) 0 0/22px 22px;touch-action:none;cursor:grab}
.iv-stage img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;image-rendering:auto}
.md{display:flex;flex-direction:column;height:100%;background:var(--bg0)}
.md video{flex:1;min-height:0;width:100%;background:#000;outline:none}
.md-audio{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.md-audio canvas{position:absolute;inset:0;width:100%;height:100%}
.md-title{position:relative;font-size:18px;text-align:center;padding:0 20px;z-index:1}
.md-sub{position:relative;font:10.5px var(--mono);color:var(--dim);z-index:1}
.md-ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.md-ctrl input[type=range]{accent-color:var(--accent)}
.md-ctrl .seek{flex:1;min-width:120px}
.md-ctrl .tm{font:11px var(--mono);color:var(--dim);white-space:nowrap}
.md-list{max-height:140px;overflow:auto;border-top:1px solid var(--line)}
.md-list div{padding:5px 14px;font-size:12.5px;cursor:pointer;display:flex;gap:10px}
.md-list div:hover{background:var(--accent-soft)}.md-list div.on{color:var(--accent)}
.br{display:flex;flex-direction:column;height:100%}
.br-bar{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.br-addr{flex:1;font-family:var(--mono);font-size:12px}
.br-frame{flex:1;position:relative;background:#fff}
.br-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.br-note{font-size:11.5px;color:var(--dim);padding:4px 10px;border-bottom:1px solid var(--line);background:var(--accent-soft);display:flex;gap:8px;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:400;color:var(--dim);font-size:11px;padding:6px 10px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel2)}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.tbl tr:hover td{background:var(--accent-soft)}

/* ---------- 计算器 / 画板 ---------- */
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px;background:var(--bg1)}
.calc-disp{border:1px solid var(--line2);padding:12px 14px;text-align:right;background:var(--bg0);position:relative;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-disp::before{content:'Σ · 'attr(data-mode);position:absolute;left:10px;top:8px;font:9px var(--mono);color:var(--faint);letter-spacing:.2em}
.calc-expr{font:13px var(--mono);color:var(--dim);min-height:20px;word-break:break-all}
.calc-res{font:300 34px var(--mono);color:var(--text);word-break:break-all;line-height:1.2}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:5px}
.ck{border:1px solid var(--line);background:var(--bg2);font:15px var(--mono);border-radius:var(--r);transition:all .1s;min-height:40px}
.ck:hover{border-color:var(--line2);background:var(--bg3)}
.ck:active{transform:scale(.97)}
.ck.op{color:var(--accent)}.ck.fn{font-size:12px;color:var(--dim)}
.ck.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.calc-hist{max-height:80px;overflow:auto;font:11px var(--mono);color:var(--faint)}
.calc-hist div{cursor:pointer;padding:1px 0;text-align:right}.calc-hist div:hover{color:var(--accent)}
.pt{display:flex;flex-direction:column;height:100%}
.pt-stage{flex:1;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,var(--bg1) 0 23px,var(--line) 23px 24px),var(--bg1);touch-action:none}
.pt-stage canvas{position:absolute;left:0;top:0;cursor:crosshair;touch-action:none}
.pt input[type=color]{width:34px;height:30px;border:1px solid var(--line);background:none;padding:2px;border-radius:var(--r)}
.pt .sw{width:20px;height:20px;border:1px solid var(--line2);cursor:pointer;flex:none}

/* ---------- 设置 ---------- */
.set{display:flex;height:100%}
.set-nav{width:200px;flex:none;border-right:1px solid var(--line);padding:14px 6px;overflow:auto}
.set-nav-it{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13.5px;border-radius:var(--r);border:1px solid transparent;margin-bottom:2px}
.set-nav-it:hover{background:var(--accent-soft)}
.set-nav-it.on{border-color:var(--line2);background:var(--sel);color:var(--accent)}
.set-body{flex:1;overflow:auto;padding:22px 26px 40px}
.set-body h2{font-weight:400;font-size:22px;margin:0 0 4px}
.set-body .sub{font:10px var(--mono);color:var(--faint);letter-spacing:.2em;margin-bottom:22px}
.set-sec{border:1px solid var(--line);margin-bottom:16px;border-radius:var(--r);background:color-mix(in srgb,var(--bg1) 50%,transparent)}
.set-sec>h3{margin:0;font-weight:400;font-size:12px;font-family:var(--mono);letter-spacing:.14em;color:var(--accent);padding:10px 14px;border-bottom:1px solid var(--line)}
.set-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-lbl{flex:1;min-width:0}
.set-lbl div:first-child{font-size:13.5px}
.set-lbl div+div{font-size:11.5px;color:var(--faint);margin-top:2px}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:14px}
.wp-card{aspect-ratio:16/10;border:1px solid var(--line);background:var(--bg2) center/cover;cursor:pointer;position:relative;border-radius:var(--r);overflow:hidden;transition:transform .2s var(--ease)}
.wp-card:hover{transform:translateY(-2px)}
.wp-card.on{outline:2px solid var(--accent);outline-offset:2px}
.wp-card span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.wp-card.up{display:grid;place-items:center;color:var(--dim);border-style:dashed;font-size:12px;text-align:center}
.bar-stack{display:flex;height:22px;border:1px solid var(--line2);overflow:hidden;border-radius:var(--r);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.bar-stack div{height:100%;transition:width .6s var(--ease);min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;margin-top:12px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;flex:none}
.legend span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;padding:0}
.swatches button.on{outline:2px solid var(--text);outline-offset:2px}
@media (max-width:760px){.set{flex-direction:column}.set-nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.set-nav-it{white-space:nowrap;margin:0}.set-body{padding:16px}}

/* ---------- 虚拟机 ---------- */
.vm{display:flex;flex-direction:column;height:100%;background:#000}
.vm .toolbar{background:var(--panel2)}
.vm-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#000;position:relative;min-height:0}
.vm-screen{position:relative}
.vm-screen>div{white-space:pre;font:14px monospace;line-height:14px;color:#ddd}
.vm-screen canvas{display:block;image-rendering:pixelated}
.vm-msg{position:absolute;inset:0;display:grid;place-items:center;color:#a3947e;font-size:13px;text-align:center;padding:30px;line-height:1.8}

/* ---------- 移动端 / 平板 ---------- */
@media (max-width:760px){
  :root{--tb-h:62px}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0;min-width:0}
  .win::before,.win::after,.rz,.ctrls button[data-a=max]{display:none!important}
  .tb{height:42px}
  .tb-coord{display:none}
  .ctrls button{width:42px;height:34px}
  #taskbar{justify-content:space-between;padding:0 6px calc(env(safe-area-inset-bottom) * .5);gap:4px}
  #tasks{justify-content:flex-start}
  .task{width:48px;min-width:48px;padding:0;justify-content:center;height:46px}
  .task .tt{display:none}
  .task .tx{position:absolute;right:-2px;top:-2px;opacity:1;width:16px;height:16px;background:var(--panel2);border:1px solid var(--line2)}
  .task:not(.active) .tx{display:none}
  #start-btn{width:50px;height:46px}
  #clock .d{display:none}
  #show-desktop,.tray-btn.hide-m{display:none}
  #start{left:6px;right:6px;width:auto}
  .cal{left:6px;right:6px;width:auto}
  .ctx .it{padding:11px 12px;font-size:14px}
  .btn{height:34px}
  .ex-bar .btn .lbl-t{display:none}
}
@media (min-width:761px) and (max-width:1180px) and (pointer:coarse){
  .tb{height:42px}.ctrls button{width:44px;height:34px}.btn{height:34px}.row{height:36px}.ctx .it{padding:10px 12px}
}
</style>

async function pumpThumbs() {

    const j = _thumbQ.shift(); _thumbActive++;

      <div class="side-h">${svg('mount', 10)}本地挂载</div>${mounts.map(m => it(basename(m.path), m.path, 'link', `<button class="ej" data-mp="${esc(m.path)}" title="卸载">${svg('eject', 13)}</button>`)).join('')}
      <div class="side-it" data-a="mount" style="color:var(--dim)">${svg('plus', 16)}<span>挂载本地文件夹</span></div>`;
  }
  renderCrumbs() {
    if (this.editing) return;
    const segs = this.path === '/' ? [] : this.path.slice(1).split('/'); let acc = '';
    this.crumbs.innerHTML = `<span class="crumb" data-go="/" data-dropdir="/">${svg('storage', 13)}此设备</span>` + segs.map(s => { acc += '/' + s; return `<span class="crumb-sep">${svg('chev', 11)}</span><span class="crumb" data-go="${esc(acc)}" data-dropdir="${esc(acc)}">${esc(s)}</span>`; }).join('');
    this.crumbs.scrollLeft = this.crumbs.scrollWidth;
  }
  editPath() {
    this.editing = true; this.crumbs.innerHTML = '<input spellcheck="false">';
    const i = this.crumbs.querySelector('input'); i.value = this.path; i.focus(); i.select();
    const done = go => { if (!this.editing) return; this.editing = false; const v = i.value.trim(); this.renderCrumbs(); if (go && v) this.go(v); };
    i.addEventListener('keydown', e => { if (e.key === 'Enter') done(true); else if (e.key === 'Escape') done(false); e.stopPropagation(); });
    i.addEventListener('blur', () => done(false));
  }
  async doSearch(q) {
    this.ac && this.ac.abort();
    if (!q) { if (this.searching) { this.searching = false; this.renderCrumbs(); this.load(); } return; }
    this.searching = true; const tok = ++this.token; const ac = this.ac = new AbortController();
    const root = this.global ? '/' : this.path, ql = q.toLowerCase();
    this.crumbs.innerHTML = `<span class="crumb">${svg('search', 13)}「${esc(q)}」的搜索结果 · ${esc(this.global ? '整个文件系统' : root)}</span>`;
    this.items = []; this.sel.clear(); await this.render();
    const ll = h('<div class="loading-line"></div>'); this.root.querySelector('.ex-main').append(ll);
    let last = performance.now();
    for await (const e of fs.walk(root, ac.signal)) {
      if (tok !== this.token) { ll.remove(); return; }
      if (!Settings.get('showHidden') && e.name.startsWith('.')) continue;
      if (e.name.toLowerCase().includes(ql)) { this.items.push(e); if (performance.now() - last > 200) { last = performance.now(); this.sortItems(); await this.render(); } }
    }
    ll.remove(); if (tok !== this.token) return;
    this.sortItems(); await this.render(); this.calcSizes(tok);
  }
  blankMenu() {
    const dir = this.path;
    return [
      { label: '刷新', icon: 'refresh', key: 'F5', action: () => this.load(true) },
      { label: '查看', icon: 'grid', sub: [{ label: '详细信息（列表）', icon: 'list', action: () => this.setView('details') }, { label: '大图标', icon: 'grid', action: () => this.setView('icons') }, { label: '分栏', icon: 'columns', action: () => this.setView('columns') }] },
      { label: '排序方式', icon: 'sort', sub: this.sortMenu() },
      { sep: 1 },
      { label: '新建', icon: 'plus', sub: newMenu(dir, p => { this.sel = new Set([p]); }) },
      { label: '粘贴', icon: 'paste', key: 'Ctrl+V', disabled: !Clip.paths.length, action: () => pasteInto(dir) },
      { sep: 1 },
      { label: '上传文件', icon: 'upload', action: () => this.act('upload') },
      { label: '上传文件夹', icon: 'folder', action: () => this.act('uploaddir') },
      { label: '挂载本地文件夹', icon: 'mount', action: () => this.act('mount') },
      { label: '将此文件夹导出为 ZIP', icon: 'download', action: () => exportPaths([dir]) },
      { sep: 1 },
      { label: document.fullscreenElement ? '退出全屏模式' : '全屏模式', icon: 'fullscreen', action: toggleFullscreen },
      { label: '在新窗口中打开', icon: 'window', action: () => Apps.launch('explorer', { path: dir }) },
      { label: '属性', icon: 'info', action: () => showProperties([dir]) }
    ];
  }
  sortMenu() { return Object.keys(COL_DEF).map(k => ({ label: COL_DEF[k].label + (this.sort.key === k ? (this.sort.dir > 0 ? '  ↑' : '  ↓') : ''), action: () => this.setSort(k) })); }
  async act(a, ev) {
    if (!a) return;
    const paths = this.selPaths(), dir = this.path;
    switch (a) {
      case 'side': if (WM.mobile()) this.side.classList.toggle('open'); else this.side.style.display = this.side.style.display === 'none' ? '' : 'none'; break;
      case 'back': if (this.hi > 0) this.go(this.hist[--this.hi], false); break;
      case 'fwd': if (this.hi < this.hist.length - 1) this.go(this.hist[++this.hi], false); break;
      case 'up': if (this.path !== '/') this.go(dirname(this.path)); break;
      case 'refresh': this.sizes.clear(); this.searching ? this.doSearch(this.sInp.value.trim()) : this.load(true); break;
      case 'newfolder': { const p = await createNew(dir, 'folder'); if (p) { this.sel = new Set([p]); } break; }
      case 'new': { const r = ev.target.closest('button').getBoundingClientRect(); Menu.show(r.left, r.bottom + 4, newMenu(dir, p => { this.sel = new Set([p]); })); break; }
      case 'upload': { const f = await pickFiles(); if (f.length) await importFiles(f, dir); break; }
      case 'uploaddir': { const f = await pickFiles({ dir: true }); if (f.length) await importFiles(f, dir); break; }
      case 'cut': if (paths.length) Clip.set('cut', paths); break;
      case 'copy': if (paths.length) Clip.set('copy', paths); break;
      case 'paste': pasteInto(dir); break;
      case 'rename': if (paths.length === 1) { const p = await renameItem(paths[0]); if (p) this.sel = new Set([p]); } else toast('请选择一个项目'); break;
      case 'delete': deleteItems(paths); break;
      case 'export': if (paths.length) exportPaths(paths); else toast('请先选择要导出的项目'); break;
      case 'extract': if (paths.length === 1) Archive.extractHere(paths[0], true); break;
      case 'mount': { const mp = await Mounts.add(); if (mp) this.go(mp); break; }
      case 'multi': this.multi = !this.multi; this.root.classList.toggle('multi', this.multi); ev.target.closest('button').classList.toggle('on', this.multi); break;
      case 'mq': this.mq = !this.mq; ev.target.closest('button').classList.toggle('on', this.mq); this.v.style.touchAction = this.mq ? 'none' : ''; toast(this.mq ? '框选模式已开启：在文件上拖动也会框选（再次点击关闭以恢复滑动）' : '框选模式已关闭'); break;
      case 'selall': this.sel = new Set(this.items.map(x => x.path)); this.paintSel(); break;
      case 'sort': { const r = ev.target.closest('button').getBoundingClientRect(); Menu.show(r.left, r.bottom + 4, this.sortMenu()); break; }
    }
  }
  keydown(e) {
    if (e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase(), c = e.ctrlKey || e.metaKey, paths = this.selPaths();
    if (c && k === 'a') { e.preventDefault(); this.act('selall'); }
    else if (c && k === 'c') this.act('copy');
    else if (c && k === 'x') this.act('cut');
    else if (c && k === 'v') this.act('paste');
    else if (c && k === 'f') { e.preventDefault(); this.sInp.focus(); }
    else if (e.key === 'Delete') this.act('delete');
    else if (e.key === 'F2') this.act('rename');
    else if (e.key === 'F5') { e.preventDefault(); this.act('refresh'); }
    else if (e.key === 'Enter' && paths.length) paths.forEach(p => this.openItem(p));
    else if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowUp')) { e.preventDefault(); this.act('up'); }
    else if (e.altKey && e.key === 'ArrowLeft') this.act('back');
    else if (e.altKey && e.key === 'ArrowRight') this.act('fwd');
    else if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key) && this.items.length) {
      e.preventDefault(); let i = this.anchorIdx;
      const perRow = this.view === 'icons' ? Math.max(1, Math.floor(this.v.clientWidth / 114)) : 1;
      const d = { ArrowDown: perRow, ArrowUp: -perRow, ArrowRight: this.view === 'icons' ? 1 : 0, ArrowLeft: this.view === 'icons' ? -1 : 0 }[e.key];
      i = clamp(i < 0 ? 0 : i + d, 0, this.items.length - 1); this.anchorIdx = i;
      const p = this.items[i].path; this.sel = e.shiftKey ? new Set([...this.sel, p]) : new Set([p]); this.paintSel();
      const el = this.elMap.get(p); el && el.scrollIntoView({ block: 'nearest' });
    }
  }
  async onFs(ch) {
    if ([...ch].some(p => p === '/mnt' || p.startsWith('/mnt/') || p === '/')) this.renderSide();
    if (this.searching) return;
    let hit = ch.has(this.path);
    for (const p of ch) if (this.path === p || this.path.startsWith(p + '/')) hit = true;
    if (!hit) return;
    if (!(await fs.exists(this.path))) { let p = dirname(this.path); while (p !== '/' && !(await fs.exists(p))) p = dirname(p); return this.go(p); }
    for (const p of [...this.sizes.keys()]) if ([...ch].some(c => c === p || c.startsWith(p + '/'))) this.sizes.delete(p);
    const keep = new Set(this.sel); await this.load(true);
    this.sel = new Set([...keep].filter(p => this.byPath.has(p))); this.paintSel();
  }
}
</script>
<script>
/* ============================================================
   EDITORS · VFS 选择器 / 记事本 / 表格 / HTML 编辑器
   ============================================================ */
const VfsPicker = {
  open({ title = '选择文件', mode = 'file', start = DESKTOP, filter = null, name = '' } = {}) {
    return new Promise(async res => {
      let cur = start, chosen = null;
      try { if ((await fs.stat(cur)).kind !== 'directory') cur = DESKTOP; } catch (e) { cur = '/'; }
      const body = h(`<div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:6px"><button class="btn" data-up>${svg('up')}上一级</button><input class="inp pth" style="flex:1;font-family:var(--mono);font-size:11px" readonly></div><div class="lst st-list" style="height:min(300px,45dvh);overflow:auto;border:1px solid var(--line);background:var(--bg1);padding:4px"></div>${mode === 'save' ? '<input class="inp fn" placeholder="文件名">' : ''}</div>`);
      const lst = body.querySelector('.lst'); if (mode === 'save') body.querySelector('.fn').value = name;
      const draw = async () => {
        body.querySelector('.pth').value = cur; let ents = [];
        try { ents = await fs.list(cur); } catch (e) {}
        ents = ents.filter(e => !e.name.startsWith('.')).sort((a, b) => (b.kind === 'directory') - (a.kind === 'directory') || natCompare(a.name, b.name));
        lst.innerHTML = ents.map(e => `<div class="st-row" data-p="${esc(e.path)}" data-d="${e.kind === 'directory' ? 1 : 0}" ${e.kind === 'file' && (mode === 'dir' || (filter && !filter(e.name))) ? 'style="opacity:.4"' : ''}><span class="ic">${entryArt(e, 20)}</span><span>${esc(e.name)}</span><span class="p">${e.kind === 'file' ? fmtSize(e.size) : ''}</span></div>`).join('') || '<div style="padding:20px;color:var(--faint)">空文件夹</div>';
      };
      lst.onclick = e => { const r = e.target.closest('[data-p]'); if (!r) return; if (r.dataset.d === '1') { cur = r.dataset.p; chosen = null; draw(); } else { lst.querySelectorAll('.kb').forEach(x => x.classList.remove('kb')); r.classList.add('kb'); chosen = r.dataset.p; if (mode === 'save') body.querySelector('.fn').value = basename(chosen); } };
      lst.ondblclick = e => { const r = e.target.closest('[data-p]'); if (r && r.dataset.d === '0' && mode !== 'dir') { chosen = r.dataset.p; body.closest('.dialog').querySelector('.btn.primary').click(); } };
      body.querySelector('[data-up]').onclick = () => { cur = dirname(cur); draw(); };
      draw();
      res(await Dialog.open({ title, icon: 'folder', body, wide: true, buttons: [{ label: '取消', value: null }, { label: mode === 'save' ? '保存' : mode === 'dir' ? '选择此文件夹' : '打开', primary: true, value: () => mode === 'dir' ? cur : mode === 'save' ? (body.querySelector('.fn').value.trim() ? joinPath(cur, body.querySelector('.fn').value.trim()) : null) : chosen }] }));
    });
  }
};

/* ============================================================
   记事本
   ============================================================ */
async function openNotepad(o = {}) {
  const win = WM.create({ title: '记事本', app: 'notepad', icon: 'text', width: 780, height: 540 });
  const S = { path: o.path || null, saved: '', wrap: true, fsz: Settings.get('notepadFont'), hist: [], hi: -1, auto: Settings.get('notepadAutosave') };
  win.body.innerHTML = `<div class="np"><div class="toolbar scroll">
    <button class="btn" data-a="new">${svg('plus')}新建</button><button class="btn" data-a="open">${svg('folder')}打开</button>
    <button class="btn" data-a="save" title="Ctrl+S">${svg('save')}保存</button><button class="btn" data-a="saveas">${svg('save')}另存为</button><span class="tsep"></span>
    <button class="btn" data-a="undo" title="Ctrl+Z">${svg('undo')}撤销</button><button class="btn" data-a="redo" title="Ctrl+Y">${svg('redo')}恢复</button><span class="tsep"></span>
    <button class="btn" data-a="fsm" title="减小字号">${svg('fontsize')}A−</button><span class="mono fsv" style="font-size:11px;min-width:38px;text-align:center"></span><button class="btn" data-a="fsp" title="增大字号">${svg('fontsize')}A+</button>
    <button class="btn on" data-a="wrap">${svg('wrap')}自动换行</button><button class="btn" data-a="find" title="Ctrl+F">${svg('search')}查找替换</button>
    <button class="btn ${S.auto ? 'on' : ''}" data-a="auto" title="停止输入后自动写回文件">${svg('clock')}自动保存</button>
    <button class="btn" data-a="code">${svg('code')}用 HTML 编辑器打开</button></div>
    <div class="np-banner" style="display:none"></div>
    <div class="np-find" style="display:none"><input class="inp" data-q placeholder="查找"><input class="inp" data-r placeholder="替换为"><button class="btn" data-f="next">下一个</button><button class="btn" data-f="rep">替换</button><button class="btn" data-f="all">全部替换</button><span class="mono fc" style="font-size:11px;color:var(--dim)"></span><button class="btn" data-f="close">${svg('close')}关闭</button></div>
    <textarea class="np-area wrap" spellcheck="false" placeholder="开始输入…"></textarea>
    <div class="status"><span class="pos">行 1, 列 1</span><span class="cnt"></span><span class="sv"></span><span class="r">UTF-8 · <span class="ft"></span></span></div></div>`;
  const B = win.body, ta = B.querySelector('textarea'), sv = B.querySelector('.sv');
  const draftKey = () => 'np-draft:' + (S.path || win.id);
  const setFs = () => { ta.style.fontSize = S.fsz + 'px'; B.querySelector('.fsv').textContent = S.fsz + 'px'; };
  const title = () => win.setTitle((ta.value !== S.saved ? '● ' : '') + (S.path ? basename(S.path) : '无标题') + ' — 记事本');
  const upd = () => {
    const v = ta.value, pre = v.slice(0, ta.selectionStart), ln = pre.split('\n').length, col = pre.length - pre.lastIndexOf('\n');
    B.querySelector('.pos').textContent = `行 ${ln}, 列 ${col}`;
    B.querySelector('.cnt').textContent = `${v.split('\n').length} 行 · ${v.length} 字符` + (ta.selectionEnd > ta.selectionStart ? ` · 已选 ${ta.selectionEnd - ta.selectionStart}` : '');
    B.querySelector('.ft').textContent = S.path ? typeLabel({ name: basename(S.path), kind: 'file' }) : '纯文本'; title();
  };
  const snap = () => { const cur = { v: ta.value, s: ta.selectionStart, e: ta.selectionEnd }; if (S.hi >= 0 && S.hist[S.hi].v === cur.v) return; S.hist = S.hist.slice(0, S.hi + 1); S.hist.push(cur); if (S.hist.length > 300) S.hist.shift(); S.hi = S.hist.length - 1; };
  const restore = st => { ta.value = st.v; ta.setSelectionRange(st.s, st.e); upd(); onChange(true); };
  const undo = () => { snap(); if (S.hi > 0) restore(S.hist[--S.hi]); };
  const redo = () => { if (S.hi < S.hist.length - 1) restore(S.hist[++S.hi]); };
  const snapLater = debounce(snap, 380);
  const draftLater = debounce(() => { if (ta.value !== S.saved) idb.set('kv', draftKey(), { text: ta.value, t: Date.now() }).catch(() => {}); else idb.del('kv', draftKey()).catch(() => {}); }, 300);
  const autoLater = debounce(() => { if (S.auto && S.path && ta.value !== S.saved) save(true); }, 1500);
  function onChange(fromHist) { if (!fromHist) snapLater(); draftLater(); autoLater(); upd(); }
  async function save(silent) {
    if (!S.path) return saveAs();
    try { const v = ta.value; await fs.writeFile(S.path, v); S.saved = v; idb.del('kv', draftKey()).catch(() => {}); sv.textContent = (silent ? '已自动保存 ' : '已保存 ') + fmtTime(new Date(), true); upd(); }
    catch (e) { toast('保存失败：' + e.message, { type: 'err' }); }
  }
  async function saveAs() {
    const p = await VfsPicker.open({ title: '另存为', mode: 'save', start: S.path ? dirname(S.path) : DESKTOP, name: S.path ? basename(S.path) : '新建文本文档.txt' });
    if (!p) return; const old = draftKey(); S.path = p; idb.del('kv', old).catch(() => {}); await save();
  }
  async function load(p) {
    S.path = p; let text = '';
    if (p) { try { text = await fs.readText(p); } catch (e) { toast('打开失败：' + e.message, { type: 'err' }); } }
    S.saved = text; ta.value = text; S.hist = []; S.hi = -1; snap();
    const d = await idb.get('kv', draftKey()).catch(() => null);
    const bn = B.querySelector('.np-banner');
    if (d && d.text !== text) {
      ta.value = d.text; snap(); bn.style.display = 'flex';
      bn.innerHTML = `${svg('info', 14)}<span>已恢复 ${fmtDate(d.t)} 未保存的编辑内容。</span><button class="btn" data-b="discard">放弃草稿</button><button class="btn primary" data-b="save">立即保存</button>`;
      bn.onclick = e => { const a = e.target.closest('[data-b]')?.dataset.b; if (a === 'discard') { ta.value = S.saved; snap(); idb.del('kv', draftKey()); bn.style.display = 'none'; upd(); } else if (a === 'save') { save(); bn.style.display = 'none'; } };
    } else bn.style.display = 'none';
    upd(); ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  }
  /* 查找替换 */
  const fb = B.querySelector('.np-find'), fq = fb.querySelector('[data-q]'), fr = fb.querySelector('[data-r]');
  const findNext = () => { const q = fq.value; if (!q) return; let i = ta.value.indexOf(q, ta.selectionEnd); if (i < 0) i = ta.value.indexOf(q); if (i < 0) { fb.querySelector('.fc').textContent = '未找到'; return; } ta.focus(); ta.setSelectionRange(i, i + q.length); const lines = ta.value.slice(0, i).split('\n').length; ta.scrollTop = Math.max(0, (lines - 5) * S.fsz * 1.7); fb.querySelector('.fc').textContent = `共 ${ta.value.split(q).length - 1} 处`; };
  fb.onclick = e => { const a = e.target.closest('[data-f]')?.dataset.f; if (a === 'next') findNext(); else if (a === 'rep') { if (ta.value.slice(ta.selectionStart, ta.selectionEnd) === fq.value && fq.value) { snap(); ta.setRangeText(fr.value, ta.selectionStart, ta.selectionEnd, 'end'); onChange(); } findNext(); } else if (a === 'all') { if (!fq.value) return; snap(); const n = ta.value.split(fq.value).length - 1; ta.value = ta.value.split(fq.value).join(fr.value); onChange(); snap(); fb.querySelector('.fc').textContent = `已替换 ${n} 处`; } else if (a === 'close') fb.style.display = 'none'; };
  fq.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); findNext(); } if (e.key === 'Escape') fb.style.display = 'none'; });
  B.querySelector('.toolbar').onclick = async e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return; const btn = e.target.closest('[data-a]');
    if (a === 'new') openNotepad();
    else if (a === 'open') { const p = await VfsPicker.open({ title: '打开文本文件', start: S.path ? dirname(S.path) : DESKTOP }); if (p) load(p); }
    else if (a === 'save') save(); else if (a === 'saveas') saveAs(); else if (a === 'undo') undo(); else if (a === 'redo') redo();
    else if (a === 'fsm' || a === 'fsp') { S.fsz = clamp(S.fsz + (a === 'fsp' ? 1 : -1), 9, 40); Settings.set('notepadFont', S.fsz); setFs(); }
    else if (a === 'wrap') { S.wrap = !S.wrap; ta.classList.toggle('wrap', S.wrap); btn.classList.toggle('on', S.wrap); }
    else if (a === 'find') { fb.style.display = 'flex'; fq.value = ta.value.slice(ta.selectionStart, ta.selectionEnd) || fq.value; fq.focus(); fq.select(); }
    else if (a === 'auto') { S.auto = !S.auto; btn.classList.toggle('on', S.auto); Settings.set('notepadAutosave', S.auto); if (S.auto) autoLater(); }
    else if (a === 'code') Apps.launch('editor', S.path ? { path: S.path } : { text: ta.value });
  };
  ta.addEventListener('input', () => onChange());
  ta.addEventListener('keyup', upd); ta.addEventListener('click', upd); ta.addEventListener('select', upd);
  ta.addEventListener('keydown', e => {
    const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (c && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (c && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (c && k === 's') { e.preventDefault(); save(); }
    else if (c && k === 'f') { e.preventDefault(); B.querySelector('[data-a=find]').click(); }
    else if (c && (k === '=' || k === '+')) { e.preventDefault(); B.querySelector('[data-a=fsp]').click(); }
    else if (c && k === '-') { e.preventDefault(); B.querySelector('[data-a=fsm]').click(); }
    else if (e.key === 'Tab') { e.preventDefault(); snap(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); onChange(); }
  });
  win.on('before', async () => {

      case 'preview': root.classList.toggle('nopreview'); btn.classList.toggle('on', !root.classList.contains('nopreview')); cm.refresh(); if (!root.classList.contains('nopreview')) refreshPreview(); break;
      case 'console': consoleEl.classList.toggle('open'); B.querySelectorAll('[data-a=console]').forEach(b => { b.classList.toggle('on', consoleEl.classList.contains('open')); b.classList.remove('danger'); }); break;
      case 'wrap': S.wrap = !S.wrap; cm.setOption('lineWrapping', S.wrap); btn.classList.toggle('on', S.wrap); break;
      case 'fold': cm.operation(() => { for (let l = cm.lastLine(); l >= 0; l--) cm.foldCode({ line: l, ch: 0 }, null, 'fold'); }); break;
      case 'unfold': cm.operation(() => { for (let l = 0; l <= cm.lastLine(); l++) cm.foldCode({ line: l, ch: 0 }, null, 'unfold'); }); break;
      case 'comment': cm.toggleComment(); cm.focus(); break;
      case 'hint': cm.focus(); hint(cm); break;
      case 'fsm': case 'fsp': S.fsz = clamp(S.fsz + (a === 'fsp' ? 1 : -1), 9, 32); root.style.setProperty('--he-fs', S.fsz + 'px'); Settings.set('editorFont', S.fsz); cm.refresh(); break;
      case 'tpl': cm.replaceSelection(S.mode === 'htmlmixed' ? HE_DEFAULT : S.mode === 'css' ? ':root {\n  --accent: #ffb347;\n}\n\nbody {\n  margin: 0;\n  font-family: serif;\n}\n' : S.mode === 'markdown' ? '# 标题\n\n- 列表\n- 列表\n\n| 列 | 列 |\n| --- | --- |\n| 值 | 值 |\n' : S.mode === 'javascript' ? "document.addEventListener('DOMContentLoaded', () => {\n  console.log('就绪');\n});\n" : '{\n  "name": "value"\n}\n'); cm.focus(); break;
    }
  });
  B.querySelector('[data-s=lang]').onchange = e => setMode(e.target.value);
  B.querySelector('[data-s=input]').onchange = e => { S.input = e.target.value; localStorage.setItem('mg_he_input', S.input); rebuild(); toast('输入模式：' + ({ auto: '自动（跟随浏览器）', pc: '电脑（textarea）', mobile: '手机（contenteditable，可长按拖选）' })[S.input]); };
  /* 窗口级快捷键（焦点在查找栏等非 CodeMirror 区域时也可用） */
  B.addEventListener('keydown', e => {
    if (e.target.closest('.CodeMirror')) return;
    const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (c && k === 's') { e.preventDefault(); save(); }
    else if (c && e.key === 'Enter') { e.preventDefault(); refreshPreview(true); }
    else if (c && e.shiftKey && k === 'f') { e.preventDefault(); format(); }
    else if (c && k === 'h') { e.preventDefault(); openFind(true); }
    else if (c && k === 'f') { e.preventDefault(); openFind(false); }
  });
  /* ---------- 分割条 ---------- */
  const split = B.querySelector('.he-split');
  split.addEventListener('pointerdown', e => {
    e.preventDefault(); split.setPointerCapture(e.pointerId); root.classList.add('dragging');
    const stack = main.classList.contains('stack'), r = main.getBoundingClientRect();
    const mv = ev => {
      if (stack) { const hgt = clamp(ev.clientY - r.top, 120, r.height - 100 - 7); codeEl.style.flex = `0 0 ${hgt}px`; }
      else { const w = clamp(ev.clientX - r.left, 200, r.width - 120 - 7); codeEl.style.flex = `0 0 ${w}px`; }
    };
    const up = () => { split.removeEventListener('pointermove', mv); split.removeEventListener('pointerup', up); split.removeEventListener('pointercancel', up); root.classList.remove('dragging'); cm && cm.refresh(); };
    split.addEventListener('pointermove', mv); split.addEventListener('pointerup', up); split.addEventListener('pointercancel', up);
  });
  win.on('resize', () => { const st = B.clientWidth < 640; if (st !== main.classList.contains('stack')) { main.classList.toggle('stack', st); codeEl.style.flex = ''; } cm && cm.refresh(); });
  win.on('before', async () => { if (!cm || cm.getValue() === S.saved || cm.getValue() === '') return true; const r = await Dialog.open({ title: 'HTML编辑器', icon: 'save', body: '内容尚未保存（草稿已自动保留，下次打开可恢复）。是否保存？', buttons: [{ label: '取消', value: 'c' }, { label: '不保存', value: 'n' }, { label: '保存', value: 's', primary: true }] }); if (r === 's') { await save(); return cm.getValue() === S.saved; } return r === 'n'; });
  win.on('close', () => { document.removeEventListener('selectionchange', onSelChange); removeEventListener('message', onMsg); if (prevUrl) URL.revokeObjectURL(prevUrl); if (cm) { cm.getWrapperElement().removeEventListener('copy', onCopy, true); cm.toTextArea(); cm = null; } });
  createEditor();
  main.classList.toggle('stack', B.clientWidth < 640);
  refreshPreview(true); cm.focus();
  return win;
}
