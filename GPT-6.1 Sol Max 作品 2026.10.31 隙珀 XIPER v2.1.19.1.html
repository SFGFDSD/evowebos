    if(!e.target.closest('#desktop')&&!WM.desktopHidden&&WM.active)return;
    const list=[...desktopSelection].map(k=>desktopItems.get(k)?.path).filter(Boolean);let action=null;
    if(ctrl&&e.key.toLowerCase()==='a')action=()=>setDesktopSelection(new Set(desktopItems.keys()));
    else if(ctrl&&e.key.toLowerCase()==='c'&&list.length)action=()=>copyPaths(list);
    else if(ctrl&&e.key.toLowerCase()==='x'&&list.length)action=()=>copyPaths(list,true);
    else if(ctrl&&e.key.toLowerCase()==='v')action=()=>pastePaths(paths.desktop);
    else if(e.key==='Delete'&&list.length)action=()=>trashPaths(list);
    else if(e.key==='F2'&&list.length===1)action=()=>renamePath(list[0]);
    if(action){e.preventDefault();Promise.resolve().then(action).catch(report);}
  });
  let desktopSignature='';
  async function desktopFingerprint(){const entries=await fs.readdir(paths.desktop);return JSON.stringify([prefs.backend,prefs.hiddenApps,prefs.iconPositions,prefs.iconSize,$('#desktop').clientWidth,$('#desktop').clientHeight,entries.map(e=>[e.name,e.kind]).sort((a,b)=>natural.compare(a[0],b[0]))]);}
  const desktopRefresh=debounce(async()=>{if(!fsReady)return;try{const signature=await desktopFingerprint();if(signature!==desktopSignature){desktopSignature=signature;await renderDesktop();}}catch(e){console.warn(e);}},160);
  fs.addEventListener('change',desktopRefresh);
  window.addEventListener('resize',debounce(()=>{applyPrefs();renderDesktop();for(const w of WM.windows.values())w.el.dispatchEvent(new Event('windowresize'));},160));
  window.addEventListener('online',()=>toast('网络已恢复','在线组件可以继续加载；你的文件始终保存在本地。'));
  let lastReportedError='',lastReportedAt=0;
  window.addEventListener('unhandledrejection',e=>{const message=e.reason?.message||String(e.reason);if(message!==lastReportedError||Date.now()-lastReportedAt>3000){lastReportedError=message;lastReportedAt=Date.now();report(e.reason);}e.preventDefault();});
  window.addEventListener('beforeunload',e=>{if([...WM.windows.values()].some(w=>w.hasUnsaved?.())){e.preventDefault();e.returnValue='';}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')for(const w of WM.windows.values())w.flush?.().catch(console.warn);});
  (async()=>{
    try{await fs.init();await restoreWallpaper();await renderDesktop();desktopSignature=await desktopFingerprint();if(prefs.startExplorer)await openExplorer(paths.home);document.documentElement.dataset.ready='true';const params=new URLSearchParams(location.search);if(params.has('selftest')){const results=await selfTest(console.log,{libraries:params.get('selftest')==='full'});document.documentElement.dataset.selftest=results.every(r=>r.passed)?'passed':'failed';}}
    catch(e){document.documentElement.dataset.ready='error';report(e);const n=toast('文件系统连接遇到问题','已保存的数据不会被清除。可打开磁盘目录检查，或刷新重试。',true,true);const b=el('button','btn','查看已保存的磁盘');b.style.marginTop='8px';b.onclick=()=>openExplorer('/vol').catch(report);$('.toast-content',n.node).append(b);}
  })();
  </script>
</body>
