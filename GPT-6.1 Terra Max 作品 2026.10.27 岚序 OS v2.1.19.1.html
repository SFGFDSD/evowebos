  function openManga(path){
    const win=createWindow('manga',basename(dirname(path)),{width:900,height:700,subtitle:'MANGA / CONTINUOUS READING'});const urls=[];let observer=null,animation=0;
    win.body.innerHTML=`<div class="manga-root"><div class="app-toolbar manga-toolbar"><span>同文件夹图片 · 自然顺序</span><span class="spacer"></span><button class="btn small" data-manga="image">图片查看</button><button class="btn small" data-manga="download">导出当前图片</button><button class="btn small" data-manga="full">全屏阅读</button></div><div class="manga-scroll"><div class="manga-pages"><div class="manga-message"><span class="busy-inline"><i class="spinner"></i> 正在读取图片...</span></div></div></div><button class="manga-exit" title="退出全屏" aria-label="退出全屏">×</button></div>`;
    const root=$('.manga-root',win.body),scroll=$('.manga-scroll',root),pages=$('.manga-pages',root);
    root.addEventListener('click',async event=>{const action=event.target.closest('[data-manga]')?.dataset.manga;try{if(action==='image')openImage(path);if(action==='download')await downloadPath(path);if(action==='full'){if(document.fullscreenElement===root)await document.exitFullscreen();else if(root.requestFullscreen)await root.requestFullscreen();else root.classList.add('sim-full');}if(event.target.closest('.manga-exit')){if(document.fullscreenElement===root)await document.exitFullscreen();root.classList.remove('sim-full');}}catch(error){report(error);}});
    let drag=null;scroll.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0)return;cancelAnimationFrame(animation);drag={last:event.clientY,velocity:0,time:performance.now()};scroll.classList.add('grabbing');scroll.setPointerCapture(event.pointerId);event.preventDefault();});
    scroll.addEventListener('pointermove',event=>{if(!drag)return;const now=performance.now(),dy=event.clientY-drag.last,dt=Math.max(8,now-drag.time);scroll.scrollTop-=dy;drag.velocity=(-dy/dt)*16;drag.last=event.clientY;drag.time=now;});
    const endDrag=()=>{if(!drag)return;let velocity=drag.velocity;drag=null;scroll.classList.remove('grabbing');const glide=()=>{if(Math.abs(velocity)<.1)return;scroll.scrollTop+=velocity;velocity*=.96;animation=requestAnimationFrame(glide);};cancelAnimationFrame(animation);animation=requestAnimationFrame(glide);};scroll.addEventListener('pointerup',endDrag);scroll.addEventListener('pointercancel',endDrag);scroll.addEventListener('dragstart',event=>event.preventDefault());
    win.addCleanup(()=>{cancelAnimationFrame(animation);if(observer)observer.disconnect();urls.forEach(url=>URL.revokeObjectURL(url));if(document.fullscreenElement===root)document.exitFullscreen().catch(()=>{});});
    (async()=>{try{const dir=dirname(path);const items=(await fs.readdir(dir)).filter(item=>item.type==='file'&&imageExt.has(extension(item.name))).sort((a,b)=>natural.compare(a.name,b.name));if(!items.length){pages.innerHTML='<div class="manga-message">此文件夹中没有可读取的图片。</div>';return;}
      const results=await Promise.all(items.map(async item=>{try{const file=await fs.readFile(join(dir,item.name));const url=URL.createObjectURL(new Blob([file],{type:file.type||mimeFor(item.name)}));urls.push(url);const image=new Image();image.decoding='async';await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url;});return {item,image,width:image.naturalWidth,height:image.naturalHeight};}catch(error){console.warn('Image skipped',item.name,error);return null;}}));
      if(!win.node.isConnected){urls.forEach(url=>URL.revokeObjectURL(url));return;}pages.innerHTML='';const heights=new WeakMap();let selected=null;
      for(const result of results){if(!result)continue;const page=el('div','manga-page');page.dataset.path=join(dir,result.item.name);if(result.width&&result.height)page.style.aspectRatio=`${result.width} / ${result.height}`;result.image.alt=result.item.name;result.image.draggable=false;page.append(result.image);pages.append(page);if(page.dataset.path===path)selected=page;}
      if(!pages.children.length){pages.innerHTML='<div class="manga-message">没有可解码的图片。</div>';return;}
      if('ResizeObserver'in window){observer=new ResizeObserver(entries=>{for(const entry of entries){const old=heights.get(entry.target),height=entry.contentRect.height;heights.set(entry.target,height);if(old!=null&&old!==height&&entry.target.offsetTop+old<scroll.scrollTop)scroll.scrollTop+=height-old;}});$$('.manga-page',pages).forEach(page=>observer.observe(page));}

    }catch(error){pages.innerHTML='<div class="manga-message">无法读取此目录。</div>';report(error);}})();return win;
  }

      if(action==='persist'){if(!navigator.storage?.persist)throw new Error('此浏览器不支持持久化权限');const granted=await navigator.storage.persist();toast(granted?'浏览器已授予持久化存储。':'浏览器未授予持久化，请定期导出备份。',!granted);}
      if(action==='open-storage')openExplorer('/'+prefs.backend);if(action==='mount')await mountFolder();if(action==='diagnose'){toast('正在检查存储...');await runStorageDiagnostics();}if(mountOpen){await ensureMountPermission(mountOpen);openExplorer(mountOpen);}if(unmount){await unmountFolder(unmount);render();}
      if(action==='reset'&&await confirmAction('重置整个岚序？','这会删除本应用保存的所有虚拟文件与设置，无法撤销。本地挂载文件不会被删除。',true)){
        for(const other of [...windows.values()])if(other!==win&&!await other.close())return;const backend=fs.mounts.get('/opfs');if(backend){const names=[];for await(const handle of backend.root.values())names.push(handle.name);for(const name of names)await backend.root.removeEntry(name,{recursive:true});}if(database.ready){await database.clear('entries');await database.clear('kv');}safeStorage.remove('lansu.preferences');try{document.cookie='lansu_theme=; max-age=0; path=/; SameSite=Lax';}catch{}location.reload();
      }
    }catch(error){report(error);}});
    win.body.addEventListener('change',event=>{const name=event.target.dataset.pref,id=event.target.dataset.appVisible;if(name){prefs[name]=event.target.type==='checkbox'?event.target.checked:event.target.value;savePrefs();applyPrefs();updateClock();renderDesktop();renderTaskbar();fsChanged();}if(id){prefs.hiddenApps=prefs.hiddenApps.filter(x=>x!==id);if(!event.target.checked)prefs.hiddenApps.push(id);savePrefs();renderDesktop();renderTaskbar();renderStart();}});
    render();return win;
  }
  function calculate(expression){const tokens=expression.match(/(?:\d*\.)?\d+|[()+\-*/%]/g)||[];let i=0;function factor(){if(tokens[i]==='+'){i++;return factor();}if(tokens[i]==='-'){i++;return -factor();}if(tokens[i]==='('){i++;const n=sum();if(tokens[i++]!==')')throw new Error('括号不匹配');return n;}const n=Number(tokens[i++]);if(!Number.isFinite(n))throw new Error('表达式无效');return n;}function term(){let n=factor();while(['*','/','%'].includes(tokens[i])){const op=tokens[i++],b=factor();n=op==='*'?n*b:op==='/'?n/b:n%b;}return n;}function sum(){let n=term();while(['+','-'].includes(tokens[i])){const op=tokens[i++],b=term();n=op==='+'?n+b:n-b;}return n;}const result=sum();if(i!==tokens.length||!Number.isFinite(result))throw new Error('无法计算');return Number(result.toPrecision(12));}
  function openCalculator(){
    const win=createWindow('calc','计算器',{width:360,height:490,subtitle:'CALCULATOR'});let expression='';win.body.innerHTML=`<div class="calc"><div class="calc-display"><small>计算器 / CALCULATOR</small><strong>0</strong></div><div class="calc-grid">${['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(key=>`<button class="${key==='='?'accent':''}" data-calc="${key}">${key}</button>`).join('')}</div></div>`;
    win.body.addEventListener('click',event=>{const key=event.target.closest('[data-calc]')?.dataset.calc;if(!key)return;if(key==='C')expression='';else if(key==='⌫')expression=expression.slice(0,-1);else if(key==='='){try{expression=String(calculate(expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')));}catch{toast('表达式无效。',true);}}else expression+=key;$('.calc-display strong',win.body).textContent=expression||'0';});return win;
  }
  function openPaint(){
    const win=createWindow('paint','画板',{width:900,height:650,subtitle:'CANVAS / PAINT'});win.body.innerHTML=`<div class="app-surface"><div class="app-toolbar"><label>颜色 <input type="color" value="#284b38" class="paint-color"></label><label>粗细 <input type="range" min="1" max="40" value="4" class="paint-size" style="width:90px"></label><button class="btn small" data-paint="clear">清空</button><span class="spacer"></span><button class="btn small" data-paint="save">保存到桌面</button><button class="btn small" data-paint="download">导出 PNG</button></div><div class="paint-stage"><canvas class="paint-canvas" width="1000" height="700"></canvas></div></div>`;
    const canvas=$('canvas',win.body),ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);let drawing=false;
    function point(event){const rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left)*canvas.width/rect.width,y:(event.clientY-rect.top)*canvas.height/rect.height};}
    canvas.addEventListener('pointerdown',event=>{event.preventDefault();drawing=true;canvas.setPointerCapture(event.pointerId);const p=point(event);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.strokeStyle=$('.paint-color',win.body).value;ctx.lineWidth=Number($('.paint-size',win.body).value);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();});canvas.addEventListener('pointermove',event=>{if(!drawing)return;const p=point(event);ctx.lineTo(p.x,p.y);ctx.stroke();});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
    const blob=()=>new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    win.body.addEventListener('click',async event=>{const action=event.target.closest('[data-paint]')?.dataset.paint;try{if(action==='clear'&&await confirmAction('清空画布？','当前画面将被清除。')){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}if(action==='save'||action==='download'){const name=await ask('保存画作','我的画作.png');if(!name)return;const result=await blob();if(action==='download')downloadBlob(result,name);else{await fs.writeFile(await uniquePath(desktopPath(),name),result,{type:'image/png'});toast('画作已保存到桌面。');}}}catch(error){report(error);}});return win;
  }
  function openVM(){
    const win=createWindow('vm','虚拟机',{width:940,height:660,subtitle:'V86 / X86'});let emulator=null;
    win.body.innerHTML=`<div class="app-surface"><div class="app-toolbar"><button class="btn small" data-vm="local">选择本地镜像</button><button class="btn small" data-vm="virtual">打开虚拟文件</button><button class="btn small" data-vm="lock">锁定鼠标</button><button class="btn small" data-vm="stop">停止</button><span class="spacer"></span><span class="vm-status">请选择 ISO / IMG 镜像</span><input class="vm-input hidden" type="file" accept=".iso,.img,.fda,.bin,.hda,.vhd"></div><div style="flex:1;overflow:auto;background:#000;display:grid;place-items:center"><div class="vm-screen"><div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas></div></div><div class="editor-status">镜像仅从本地文件或虚拟文件读取；BIOS 和引擎需要网络。</div></div>`;
    const screen=$('.vm-screen',win.body),status=$('.vm-status',win.body);
    async function start(file,name){status.textContent='正在加载虚拟机引擎...';await loadScript('https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js');const Constructor=window.V86||window.V86Starter;if(!Constructor)throw new Error('v86 引擎不可用');const buffer=await file.arrayBuffer();if(emulator){emulator.destroy();emulator=null;}screen.innerHTML='<div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas>';const ext=extension(name),slot=ext==='iso'?'cdrom':['img','fda','bin'].includes(ext)?'fda':'hda';const config={wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',memory_size:128*1024*1024,vga_memory_size:8*1024*1024,screen_container:screen,bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},autostart:true};config[slot]={buffer};emulator=new Constructor(config);status.textContent='正在启动：'+name;if(emulator.add_listener)emulator.add_listener('emulator-ready',()=>status.textContent='运行中：'+name);}
    win.body.addEventListener('click',async event=>{const action=event.target.closest('[data-vm]')?.dataset.vm;try{if(action==='local')$('.vm-input',win.body).click();if(action==='virtual'){const path=await ask('打开虚拟磁盘镜像',desktopPath()+'/','输入镜像的完整虚拟路径。');if(path){status.textContent='正在读取镜像...';await start(await fs.readFile(path),basename(path));}}if(action==='lock'){if(!emulator)throw new Error('请先启动虚拟机');if(emulator.lock_mouse)emulator.lock_mouse();else if(screen.requestPointerLock)screen.requestPointerLock();}if(action==='stop'&&emulator){emulator.destroy();emulator=null;status.textContent='已停止';}}catch(error){status.textContent='启动失败';report(error);}});
    $('.vm-input',win.body).addEventListener('change',event=>{const file=event.target.files?.[0];if(file)start(file,file.name).catch(error=>{status.textContent='启动失败';report(error);});});win.addCleanup(()=>{if(emulator)emulator.destroy();});return win;
  }

  /* Start immediately; only actual storage and file operations show loading states. */
  applyPrefs();renderTaskbar();renderStart();
  fsEvents.addEventListener('change',()=>renderDesktop());
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key===','){event.preventDefault();openSettings();}});
  window.addEventListener('beforeunload',event=>{if([...windows.values()].some(win=>win.isDirty?.())){event.preventDefault();event.returnValue='';}});
  window.fsReady=(async()=>{try{
    await initFS();applyPrefs();await applyWallpaper();await renderDesktop();renderTaskbar();openExplorer(desktopPath());
    const mounts=[...fs.mounts.keys()].filter(path=>path.startsWith('/mnt/local/'));if(mounts.length)toast('检测到以前挂载的文件夹，请在访问时重新授权。');
    if(!fs.idbPersistent&&fs.opfsAvailable)toast('IndexedDB 不可用，其存储区仅在本次会话有效。',true);
  }catch(error){report(error);try{await renderDesktop();if(fs.mounts.has('/'+prefs.backend))openExplorer(desktopPath());}catch(inner){console.error(inner);}}})();
  </script>
