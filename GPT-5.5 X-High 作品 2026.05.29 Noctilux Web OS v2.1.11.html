<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101013">
  <title>Noctilux Web OS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" onerror="window.__codemirrorCssError=true">
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" onerror="window.__jszipError=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js" onerror="window.__v86Error=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" onerror="window.__codemirrorError=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js" onerror="window.__codemirrorModeError=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js" onerror="window.__codemirrorModeError=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js" onerror="window.__codemirrorModeError=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js" onerror="window.__codemirrorModeError=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js" onerror="window.__codemirrorModeError=true"></script>
  <script type="module">
    import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js')
      .then((m) => { window.SevenZip = m.default || m.SevenZip || m; })
      .catch(() => { window.SevenZip = null; window.__sevenZipError = true; });
  </script>
  <style>
    :root {
      --ink: #e7dfca;
      --ink-dim: #b7ac91;
      --charcoal: #101013;
      --charcoal-2: #17171a;
      --panel: rgba(22, 22, 25, 0.82);
      --panel-strong: rgba(11, 11, 14, 0.92);
      --grid: rgba(231, 223, 202, 0.13);
      --line: rgba(231, 223, 202, 0.22);
      --line-strong: rgba(231, 223, 202, 0.4);
      --accent: #d8ff4f;
      --accent-2: #ff5c2b;
      --accent-3: #63cdda;
      --danger: #ff4d6d;
      --ok: #8bd450;
      --mono: "IBM Plex Mono", "Courier New", monospace;
      --display: "Fraunces", Georgia, serif;
      --taskbar: 58px;
      --radius: 18px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.46), 0 2px 0 rgba(255,255,255,0.06) inset;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--charcoal);
      font-family: var(--mono);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    textarea, input { user-select: text; }

    #os {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #101013;
    }

    #wallpaper {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 12%, rgba(216,255,79,0.18), transparent 26%),
        radial-gradient(circle at 86% 18%, rgba(99,205,218,0.14), transparent 28%),
        linear-gradient(135deg, #131314 0%, #252016 48%, #121217 100%);
      transition: filter 700ms ease, transform 1100ms cubic-bezier(.2,.8,.2,1), background 500ms ease;
    }
    #wallpaper::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(231,223,202,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(231,223,202,0.04) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 58%, rgba(0,0,0,0.54) 100%);
      background-size: 48px 48px, 48px 48px, 100% 100%;
      mix-blend-mode: screen;
      opacity: .72;
      pointer-events: none;
    }
    #wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025), rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px);
      opacity: .55;
      pointer-events: none;
    }

    #desktop {
      position: absolute;
      inset: 0 0 var(--taskbar) 0;
      overflow: hidden;
      padding: 18px;
      touch-action: none;
    }

    .brand-mark {
      position: absolute;
      right: 26px;
      top: 22px;
      width: min(38vw, 440px);
      pointer-events: none;
      opacity: .36;
      animation: driftMark 14s ease-in-out infinite alternate;
    }
    .brand-mark h1 {
      font-family: var(--display);
      font-size: clamp(44px, 8vw, 126px);
      line-height: .82;
      letter-spacing: -.07em;
      margin: 0;
      text-align: right;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(0,0,0,.5);
    }
    .brand-mark p {
      margin: 12px 0 0;
      text-align: right;
      color: var(--accent);
      letter-spacing: .26em;
      font-size: 11px;
      text-transform: uppercase;
    }

    @keyframes driftMark {
      from { transform: translate3d(0, 0, 0); filter: blur(0); }
      to { transform: translate3d(-12px, 10px, 0); filter: blur(.15px); }
    }
    @keyframes bootIn {
      0% { opacity: 0; transform: translateY(18px) scale(.98); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseLine {
      0%, 100% { opacity: .28; transform: scaleX(.45); }
      50% { opacity: 1; transform: scaleX(1); }
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 36% 20%, rgba(216,255,79,.14), transparent 24%),
        radial-gradient(circle at 60% 74%, rgba(255,92,43,.11), transparent 25%),
        #0c0c0e;
      transition: opacity 480ms ease, visibility 480ms ease;
    }
    #boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-card { width: min(520px, calc(100vw - 40px)); animation: bootIn 900ms cubic-bezier(.16, 1, .3, 1) both; }
    .boot-title { font-family: var(--display); font-size: clamp(42px, 11vw, 86px); line-height: .86; letter-spacing: -.07em; }
    .boot-sub { color: var(--ink-dim); margin-top: 18px; line-height: 1.65; }
    .boot-line { height: 2px; background: var(--accent); transform-origin: left; margin-top: 28px; animation: pulseLine 1.45s ease-in-out infinite; }
    .boot-log { color: var(--accent-3); margin-top: 16px; font-size: 12px; min-height: 20px; }

    .desktop-icon {
      position: absolute;
      width: 88px;
      min-height: 104px;
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 8px;
      padding: 8px 6px;
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 16px;
      outline: none;
      cursor: default;
      touch-action: none;
      transition: transform 190ms cubic-bezier(.2,.8,.2,1), border-color 170ms ease, background 170ms ease, left 240ms cubic-bezier(.2,.8,.2,1), top 240ms cubic-bezier(.2,.8,.2,1);
      animation: revealUp 540ms cubic-bezier(.2,.8,.2,1) both;
    }
    .desktop-icon:hover, .desktop-icon:focus-visible {
      background: rgba(231,223,202,0.08);
      border-color: rgba(231,223,202,0.18);
      transform: translateY(-2px);
    }
    .desktop-icon.selected {
      background: rgba(216,255,79,0.12);
      border-color: rgba(216,255,79,0.55);
    }
    .desktop-icon.dragging { opacity: .55; transform: scale(.96); }
    .icon-glyph {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.28));
    }
    .icon-glyph svg { width: 100%; height: 100%; }
    .icon-label {
      width: 100%;
      text-align: center;
      font-size: 12px;
      line-height: 1.24;
      text-shadow: 0 1px 7px rgba(0,0,0,.95);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .icon-mini-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 160ms ease;
    }
    .desktop-icon:hover .icon-mini-actions, .desktop-icon:focus-within .icon-mini-actions { opacity: 1; }
    .mini-action {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(231,223,202,.22);
      background: rgba(0,0,0,.42);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .mini-action svg { width: 15px; height: 15px; }

    #selectionBox, .lasso {
      position: absolute;
      border: 1px solid rgba(216,255,79,.82);
      background: rgba(216,255,79,.12);
      pointer-events: none;
      z-index: 50;
      display: none;
    }

    #windowLayer { position: absolute; inset: 0 0 var(--taskbar) 0; pointer-events: none; }
    .window {
      position: absolute;
      min-width: 300px;
      min-height: 220px;
      background: linear-gradient(180deg, rgba(28,28,31,.92), rgba(13,13,16,.93));
      border: 1px solid rgba(231,223,202,.25);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      pointer-events: auto;
      backdrop-filter: blur(24px) saturate(120%);
      transform-origin: top left;
      animation: windowIn 260ms cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes windowIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .window.minimized { display: none; }
    .window.maximized { border-radius: 0; }
    .titlebar {
      height: 43px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 0 14px;
      background: linear-gradient(90deg, rgba(216,255,79,.13), rgba(255,92,43,.06), rgba(99,205,218,.08));
      border-bottom: 1px solid rgba(231,223,202,.18);
      cursor: grab;
    }
    .titlebar:active { cursor: grabbing; }
    .title-icon { width: 22px; height: 22px; display: grid; place-items: center; }
    .title-icon svg { width: 20px; height: 20px; }
    .title-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; letter-spacing: .02em; }
    .win-controls { display: flex; gap: 6px; }
    .win-btn {
      width: 30px;
      height: 28px;
      border: 1px solid rgba(231,223,202,.22);
      background: rgba(12,12,14,.48);
      clip-path: polygon(11% 0, 100% 0, 89% 100%, 0 100%);
      display: grid;
      place-items: center;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .win-btn:hover { background: rgba(216,255,79,.16); border-color: rgba(216,255,79,.55); transform: translateY(-1px); }
    .win-btn[data-action="close"]:hover { background: rgba(255,77,109,.18); border-color: rgba(255,77,109,.7); }
    .win-btn svg { width: 14px; height: 14px; }
    .window-body { height: calc(100% - 43px); overflow: hidden; }
    .resize-handle { position: absolute; z-index: 4; }
    .resize-e { right: 0; top: 46px; width: 10px; bottom: 12px; cursor: ew-resize; }
    .resize-s { left: 12px; right: 12px; bottom: 0; height: 10px; cursor: ns-resize; }
    .resize-se { right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; }
    .resize-se::after { content: ""; position: absolute; right: 6px; bottom: 5px; width: 9px; height: 9px; border-right: 2px solid rgba(231,223,202,.35); border-bottom: 2px solid rgba(231,223,202,.35); }

    #taskbar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: max(10px, env(safe-area-inset-bottom));
      height: 48px;
      z-index: 7000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border: 1px solid rgba(231,223,202,.24);
      border-radius: 18px;
      background: rgba(9,9,11,.72);
      backdrop-filter: blur(22px) saturate(150%);
      box-shadow: 0 15px 48px rgba(0,0,0,.45);
      animation: revealUp 550ms cubic-bezier(.2,.8,.2,1) 210ms both;
    }
    .start-button, .task-button, .dock-button {
      height: 36px;
      border: 1px solid rgba(231,223,202,.18);
      border-radius: 12px;
      background: rgba(231,223,202,.07);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      white-space: nowrap;
    }
    .start-button { background: rgba(216,255,79,.14); color: var(--accent); border-color: rgba(216,255,79,.45); font-weight: 600; }
    .start-button:hover, .task-button:hover, .dock-button:hover { transform: translateY(-2px); background: rgba(231,223,202,.11); border-color: rgba(231,223,202,.35); }
    .start-button svg, .task-button svg, .dock-button svg { width: 18px; height: 18px; flex: 0 0 auto; }
    #taskButtons { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    #taskButtons::-webkit-scrollbar { display: none; }
    .task-button.active { border-color: rgba(216,255,79,.5); background: rgba(216,255,79,.13); }
    #clock { font-size: 12px; color: var(--ink-dim); padding: 0 8px; white-space: nowrap; }

    #startMenu {
      position: absolute;
      left: 20px;
      bottom: 72px;
      width: min(420px, calc(100vw - 28px));
      max-height: min(72vh, 640px);
      z-index: 7600;
      border: 1px solid rgba(231,223,202,.24);
      border-radius: 24px;
      background: rgba(12,12,15,.86);
      backdrop-filter: blur(26px) saturate(140%);
      box-shadow: var(--shadow);
      padding: 18px;
      transform: translateY(18px) scale(.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity 190ms ease, transform 190ms cubic-bezier(.2,.8,.2,1);
    }
    #startMenu.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .start-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .start-head h2 { font-family: var(--display); font-size: 38px; line-height: .9; letter-spacing: -.05em; margin: 0; }
    .start-head p { color: var(--accent); margin: 0; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
    .launcher-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .launcher-item {
      min-height: 74px;
      border: 1px solid rgba(231,223,202,.16);
      background: rgba(231,223,202,.055);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      text-align: left;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }
    .launcher-item:hover { transform: translateY(-2px); background: rgba(216,255,79,.1); border-color: rgba(216,255,79,.34); }
    .launcher-icon { width: 34px; height: 34px; flex: 0 0 auto; }
    .launcher-title { font-size: 13px; font-weight: 600; }
    .launcher-desc { color: var(--ink-dim); font-size: 11px; margin-top: 4px; }

    #contextMenu {
      position: fixed;
      z-index: 9000;
      width: 230px;
      padding: 8px;
      border: 1px solid rgba(231,223,202,.24);
      border-radius: 16px;
      background: rgba(9,9,11,.92);
      backdrop-filter: blur(22px);
      box-shadow: 0 18px 52px rgba(0,0,0,.5);
      display: none;
    }
    .ctx-item {
      width: 100%;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      border-radius: 10px;
      padding: 7px 9px;
      font-size: 12px;
    }
    .ctx-item:hover { background: rgba(216,255,79,.12); color: var(--accent); }
    .ctx-item[disabled] { opacity: .42; pointer-events: none; }
    .ctx-sep { height: 1px; background: rgba(231,223,202,.12); margin: 6px; }
    .ctx-item svg { width: 16px; height: 16px; }

    .app-shell { height: 100%; display: flex; min-height: 0; background: rgba(11,11,13,.35); }
    .sidebar {
      width: 188px;
      border-right: 1px solid rgba(231,223,202,.14);
      padding: 12px;
      overflow: auto;
      background: rgba(0,0,0,.12);
    }
    .side-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 9px;
      border-radius: 12px;
      color: var(--ink-dim);
      border: 1px solid transparent;
      text-align: left;
    }
    .side-button:hover, .side-button.active { background: rgba(216,255,79,.09); border-color: rgba(216,255,79,.22); color: var(--ink); }
    .side-button svg { width: 17px; height: 17px; }
    .main-pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .toolbar {
      min-height: 49px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border-bottom: 1px solid rgba(231,223,202,.14);
      flex-wrap: wrap;
    }
    .tool-button, .field, .select-field {
      min-height: 32px;
      border: 1px solid rgba(231,223,202,.18);
      background: rgba(231,223,202,.06);
      color: var(--ink);
      border-radius: 11px;
      padding: 7px 10px;
      font-size: 12px;
    }
    .tool-button { display: inline-flex; align-items: center; gap: 7px; }
    .tool-button:hover { border-color: rgba(216,255,79,.42); background: rgba(216,255,79,.11); }
    .tool-button svg { width: 15px; height: 15px; }
    .field { outline: none; user-select: text; }
    .field:focus, textarea:focus { border-color: rgba(216,255,79,.55); box-shadow: 0 0 0 3px rgba(216,255,79,.09); }
    .breadcrumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .breadcrumbs::-webkit-scrollbar { display: none; }
    .crumb { border: 0; background: transparent; color: var(--ink-dim); padding: 6px 5px; border-radius: 9px; white-space: nowrap; }
    .crumb:hover { color: var(--accent); background: rgba(216,255,79,.09); }
    .file-table-wrap { flex: 1; min-height: 0; overflow: auto; position: relative; }
    table.file-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    .file-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(15,15,18,.92);
      color: var(--ink-dim);
      text-align: left;
      font-weight: 500;
      border-bottom: 1px solid rgba(231,223,202,.14);
      padding: 9px 10px;
      cursor: pointer;
    }
    .file-table td { padding: 9px 10px; border-bottom: 1px solid rgba(231,223,202,.07); vertical-align: middle; }
    .file-row { transition: background 120ms ease; }
    .file-row:hover { background: rgba(231,223,202,.06); }
    .file-row.selected { background: rgba(216,255,79,.11); outline: 1px solid rgba(216,255,79,.32); outline-offset: -1px; }
    .name-cell { display: flex; align-items: center; gap: 9px; min-width: 170px; overflow-wrap: anywhere; }
    .name-cell svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .muted { color: var(--ink-dim); }
    .kbd { color: var(--accent); border: 1px solid rgba(216,255,79,.27); border-radius: 7px; padding: 1px 5px; font-size: 11px; }

    .editor-layout { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    .editor-body { min-height: 0; display: grid; grid-template-columns: 1fr; }
    .editor-body.split { grid-template-columns: minmax(260px, .9fr) minmax(260px, 1.1fr); }
    .editor-area, .preview-area { min-width: 0; min-height: 0; position: relative; }
    .editor-textarea {
      width: 100%; height: 100%; resize: none; border: 0; outline: none;
      padding: 15px; background: #101014; color: var(--ink); line-height: 1.62;
      font-size: 13px; font-family: var(--mono); user-select: text;
    }
    .preview-area { border-left: 1px solid rgba(231,223,202,.14); background: #f6f1de; }
    .preview-area iframe { width: 100%; height: 100%; border: 0; background: white; }
    .CodeMirror { height: 100%; font-family: var(--mono); font-size: 13px; background: #101014; color: var(--ink); }
    .CodeMirror-gutters { background: #0b0b0d; border-right: 1px solid rgba(231,223,202,.13); }
    .CodeMirror-linenumber { color: #6f684f; }

    .table-preview { width: 100%; height: 100%; overflow: auto; background: #101014; }
    .data-grid { border-collapse: collapse; width: 100%; font-size: 12px; }
    .data-grid th, .data-grid td { border: 1px solid rgba(231,223,202,.13); padding: 6px 8px; text-align: left; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .data-grid th { position: sticky; top: 0; background: rgba(216,255,79,.12); color: var(--accent); }

    .browser { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    .browser-frame { width: 100%; height: 100%; border: 0; background: #f8f6ea; }
    .viewer { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; background: #0a0a0d; }
    .viewer-stage { min-height: 0; display: grid; place-items: center; overflow: auto; }

  <script>
  (() => {

    const fileImportInput = $('#fileImportInput');
    const wallpaperInput = $('#wallpaperInput');
    const selectionBox = $('#selectionBox');

      windows: new Map(),

      prefs: loadJSON('noctilux.prefs', { wallpaper: { type: 'builtin', id: 'meteor' } }),

    };

    const WALLPAPERS = [
      { id: 'meteor', name: 'Meteor Ink', css: 'radial-gradient(circle at 18% 14%, rgba(216,255,79,.22), transparent 23%), radial-gradient(circle at 80% 18%, rgba(255,92,43,.16), transparent 27%), linear-gradient(135deg, #111114 0%, #292216 48%, #121217 100%)' },
      { id: 'cobalt', name: 'Cobalt Plot', css: 'radial-gradient(circle at 78% 24%, rgba(99,205,218,.28), transparent 28%), linear-gradient(120deg, #08151f, #151824 46%, #0d0c10)' },
      { id: 'rice', name: 'Rice Signal', css: 'radial-gradient(circle at 14% 80%, rgba(94,72,42,.22), transparent 25%), linear-gradient(135deg, #efe7cf, #c7b98f 50%, #6f684f)' },
      { id: 'oxide', name: 'Oxide Tape', css: 'linear-gradient(120deg, rgba(255,92,43,.38), transparent 28%), radial-gradient(circle at 70% 35%, rgba(216,255,79,.18), transparent 28%), linear-gradient(145deg, #1b120f, #302017, #0c0c0e)' }
    ];

    const APP_DEFS = [
      { id: 'explorer', name: '文件资源管理器', short: '档案库', desc: 'OPFS 与挂载目录', icon: 'explorer', launch: () => openExplorer('/Desktop') },
      { id: 'notepad', name: '记事本', short: '文本台', desc: '文本与代码编辑', icon: 'notepad', launch: () => newTextFileThenOpen() },
      { id: 'browser', name: '网页浏览器', short: '浏览器', desc: 'iframe 页面预览', icon: 'browser', launch: () => openBrowser('about:blank') },
      { id: 'vm', name: 'V86 虚拟机', short: '虚拟机', desc: '浏览器内 x86 实验台', icon: 'vm', launch: () => openVmLab() },
      { id: 'calculator', name: '计算器', short: '计算器', desc: '精简表达式计算', icon: 'calculator', launch: () => openCalculator() },
      { id: 'paint', name: '画板', short: '画板', desc: '触摸与鼠标绘图', icon: 'paint', launch: () => openPaint() },
      { id: 'settings', name: '设置', short: '设置', desc: '存储、挂载、壁纸', icon: 'settings', launch: () => openSettings() }
    ];

    const desktopApps = [
      { kind: 'app', app: 'explorer', name: '文件资源管理器', id: 'app:explorer' },
      { kind: 'app', app: 'browser', name: '网页浏览器', id: 'app:browser' },
      { kind: 'app', app: 'vm', name: 'V86 虚拟机', id: 'app:vm' },
      { kind: 'app', app: 'settings', name: '设置', id: 'app:settings' },
      { kind: 'app', app: 'paint', name: '画板', id: 'app:paint' }
    ];

    const Path = {
      normalize(input = '/') {
        let p = String(input || '/').replace(/\\/g, '/');
        if (!p.startsWith('/')) p = '/' + p;
        const parts = [];
        for (const seg of p.split('/')) {

      },
      join(...parts) { return Path.normalize(parts.join('/')); },
      basename(p) { p = Path.normalize(p); return p === '/' ? '/' : p.split('/').pop(); },
      dirname(p) { p = Path.normalize(p); if (p === '/') return '/'; const parts = p.split('/'); parts.pop(); return parts.join('/') || '/'; },

    };

    const MIME = {
      '.txt': 'text/plain;charset=utf-8', '.md': 'text/markdown;charset=utf-8', '.log': 'text/plain;charset=utf-8',
      '.html': 'text/html;charset=utf-8', '.htm': 'text/html;charset=utf-8', '.css': 'text/css;charset=utf-8', '.js': 'text/javascript;charset=utf-8',
      '.json': 'application/json;charset=utf-8', '.xml': 'application/xml;charset=utf-8', '.yaml': 'text/yaml;charset=utf-8', '.yml': 'text/yaml;charset=utf-8',
      '.csv': 'text/csv;charset=utf-8', '.tsv': 'text/tab-separated-values;charset=utf-8',
      '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.gif': 'image/gif', '.svg': 'image/svg+xml', '.webp': 'image/webp', '.bmp': 'image/bmp', '.ico': 'image/x-icon',
      '.mp3': 'audio/mpeg', '.wav': 'audio/wav', '.ogg': 'audio/ogg', '.flac': 'audio/flac', '.aac': 'audio/aac', '.m4a': 'audio/mp4',
      '.mp4': 'video/mp4', '.webm': 'video/webm', '.ogv': 'video/ogg', '.mov': 'video/quicktime',
      '.pdf': 'application/pdf', '.zip': 'application/zip', '.gz': 'application/gzip', '.tar': 'application/x-tar', '.tgz': 'application/gzip', '.7z': 'application/x-7z-compressed'
    };
    const textExts = new Set(['.txt','.md','.log','.html','.htm','.css','.js','.json','.xml','.yaml','.yml','.csv','.tsv','.ini','.conf','.sh','.bat','.sql','.py','.java','.c','.cpp','.h','.rs','.go','.php']);
    const imageExts = new Set(['.png','.jpg','.jpeg','.gif','.svg','.webp','.bmp','.ico']);
    const audioExts = new Set(['.mp3','.wav','.ogg','.flac','.aac','.m4a']);
    const videoExts = new Set(['.mp4','.webm','.ogv','.mov']);
    const archiveExts = new Set(['.zip','.gz','.tar','.tgz','.7z']);

    function mimeFromName(name) { return MIME[Path.ext(name)] || 'application/octet-stream'; }
    function formatBytes(bytes = 0) {
      if (!bytes) return '0 B';
      const units = ['B','KB','MB','GB','TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
    }
    function formatDate(ms) { return ms ? new Date(ms).toLocaleString('zh-CN', { hour12: false }) : '目录'; }
    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
    function loadJSON(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || '') || fallback; } catch { return fallback; } }
    function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    function compatDone(promise, args) {
      const cb = [...args].find((x) => typeof x === 'function');
      if (cb) { promise.then((r) => cb(null, r)).catch((e) => cb(e)); return undefined; }
      return promise;
    }
    async function toArrayBuffer(data) {
      if (data instanceof ArrayBuffer) return data;
      if (ArrayBuffer.isView(data)) return data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
      if (data instanceof Blob) return data.arrayBuffer();
      return new TextEncoder().encode(String(data ?? '')).buffer;
    }
    function decodeText(buffer) { return new TextDecoder('utf-8', { fatal: false }).decode(buffer); }

    class OPFSBackend {
      constructor(root) { this.root = root; }
      async init() {}
      _segments(path) { return Path.normalize(path).split('/').filter(Boolean); }
      async _dir(path, create = false) {
        let dir = this.root;
        for (const seg of this._segments(path)) dir = await dir.getDirectoryHandle(seg, { create });
        return dir;
      }
      async _parent(path, create = false) { return this._dir(Path.dirname(path), create); }
      async _handle(path) {
        path = Path.normalize(path);
        if (path === '/') return this.root;
        const parent = await this._parent(path, false);
        const name = Path.basename(path);
        try { return await parent.getDirectoryHandle(name); } catch {}
        return parent.getFileHandle(name);
      }
      stat(path, ...args) { return compatDone(this._stat(path), args); }
      async _stat(path) {
        path = Path.normalize(path);
        const handle = await this._handle(path);
        if (handle.kind === 'directory') return { path, name: Path.basename(path), kind: 'directory', type: 'directory', size: 0, mtime: 0, mime: 'inode/directory' };
        const file = await handle.getFile();
        return { path, name: Path.basename(path), kind: 'file', type: 'file', size: file.size, mtime: file.lastModified, mime: file.type || mimeFromName(path) };
      }
      readdir(path, ...args) { return compatDone(this._readdir(path), args); }
      async _readdir(path) {
        path = Path.normalize(path);
        const dir = await this._dir(path, false);
        const rows = [];
        for await (const [name, handle] of dir.entries()) {
          const p = Path.join(path, name);
          if (handle.kind === 'directory') rows.push({ path: p, name, kind: 'directory', type: 'directory', size: 0, mtime: 0, mime: 'inode/directory' });
          else {
            const file = await handle.getFile();
            rows.push({ path: p, name, kind: 'file', type: 'file', size: file.size, mtime: file.lastModified, mime: file.type || mimeFromName(name) });
          }
        }
        return rows.sort((a,b) => (a.kind === b.kind ? a.name.localeCompare(b.name, 'zh-CN') : a.kind === 'directory' ? -1 : 1));
      }
      readFile(path, options = {}, ...args) { return compatDone(this._readFile(path, options), args); }
      async _readFile(path, options = {}) {
        const handle = await this._handle(path);
        if (handle.kind !== 'file') throw new Error('目标不是文件');
        const file = await handle.getFile();
        const as = typeof options === 'string' ? options : options.as;
        if (as === 'text' || as === 'utf8') return file.text();
        if (as === 'blob') return file;
        return file.arrayBuffer();
      }
      writeFile(path, data, options = {}, ...args) { return compatDone(this._writeFile(path, data, options), args); }
      async _writeFile(path, data, options = {}) {
        path = Path.normalize(path);
        const parent = await this._parent(path, true);
        const fileHandle = await parent.getFileHandle(Path.basename(path), { create: true });
        const writable = await fileHandle.createWritable();
        if (data instanceof Blob && options.mime && data.type !== options.mime) data = new Blob([data], { type: options.mime });
        await writable.write(data);
        await writable.close();
        return this._stat(path);
      }
      mkdir(path, options = {}, ...args) { return compatDone(this._mkdir(path, options), args); }
      async _mkdir(path) { await this._dir(path, true); return this._stat(path); }
      unlink(path, ...args) { return compatDone(this._unlink(path), args); }
      async _unlink(path) { const parent = await this._parent(path, false); await parent.removeEntry(Path.basename(path)); return true; }
      rmdir(path, options = {}, ...args) { return compatDone(this._rmdir(path, options), args); }
      async _rmdir(path) { const parent = await this._parent(path, false); await parent.removeEntry(Path.basename(path), { recursive: true }); return true; }
      delete(path, ...args) { return compatDone(this._delete(path), args); }
      async _delete(path) { const s = await this._stat(path); return s.kind === 'directory' ? this._rmdir(path) : this._unlink(path); }
      exists(path, ...args) { return compatDone(this._exists(path), args); }
      async _exists(path) { try { await this._stat(path); return true; } catch { return false; } }
      rename(from, to, ...args) { return compatDone(this._rename(from, to), args); }
      async _rename(from, to) { await copyInsideBackend(this, from, to); await this._delete(from); return this._stat(to); }
    }

    class NativeBackend extends OPFSBackend {
      constructor(handle) { super(handle); this.nativeName = handle.name || 'folder'; }
      async _permission(write = false) {
        if (!this.root.queryPermission) return;
        const opts = { mode: write ? 'readwrite' : 'read' };
        let status = await this.root.queryPermission(opts);
        if (status !== 'granted') status = await this.root.requestPermission(opts);
        if (status !== 'granted') throw new Error('未获得本地文件夹权限');
      }
      async _dir(path, create = false) { await this._permission(create); return super._dir(path, create); }
      async _readFile(path, options = {}) { await this._permission(false); return super._readFile(path, options); }
      async _writeFile(path, data, options = {}) { await this._permission(true); return super._writeFile(path, data, options); }
      async _unlink(path) { await this._permission(true); return super._unlink(path); }
      async _rmdir(path) { await this._permission(true); return super._rmdir(path); }
    }

    class IDBBackend {
      constructor() { this.db = null; }
      async init() {
        this.db = await new Promise((resolve, reject) => {
          const req = indexedDB.open('noctilux-vfs', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('nodes', { keyPath: 'path' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        if (!await this._exists('/')) await this._put({ path: '/', name: '/', kind: 'directory', type: 'directory', size: 0, mtime: Date.now(), mime: 'inode/directory' });
      }
      _tx(mode, fn) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('nodes', mode);
          const store = tx.objectStore('nodes');
          let request;
          try { request = fn(store); } catch (e) { reject(e); return; }
          tx.oncomplete = () => resolve(request && 'result' in request ? request.result : undefined);
          tx.onerror = () => reject(tx.error);
        });
      }
      _get(path) { return this._tx('readonly', (s) => s.get(Path.normalize(path))); }
      _put(node) { return this._tx('readwrite', (s) => s.put(node)); }
      _del(path) { return this._tx('readwrite', (s) => s.delete(Path.normalize(path))); }
      _all() { return this._tx('readonly', (s) => s.getAll()); }
      async _ensureParents(path) {
        const parts = Path.dirname(path).split('/').filter(Boolean);
        let cur = '';
        for (const part of parts) {
          cur += '/' + part;
          if (!await this._exists(cur)) await this._put({ path: cur, name: part, kind: 'directory', type: 'directory', size: 0, mtime: Date.now(), mime: 'inode/directory' });
        }
      }
      stat(path, ...args) { return compatDone(this._stat(path), args); }
      async _stat(path) { const node = await this._get(path); if (!node) throw new Error('路径不存在'); const { data, ...stat } = node; return stat; }
      readdir(path, ...args) { return compatDone(this._readdir(path), args); }
      async _readdir(path) {
        path = Path.normalize(path);
        const prefix = path === '/' ? '/' : path + '/';
        const rows = (await this._all()).filter((n) => n.path !== path && n.path.startsWith(prefix) && !n.path.slice(prefix.length).includes('/'));
        return rows.map(({ data, ...n }) => n).sort((a,b) => (a.kind === b.kind ? a.name.localeCompare(b.name, 'zh-CN') : a.kind === 'directory' ? -1 : 1));
      }
      readFile(path, options = {}, ...args) { return compatDone(this._readFile(path, options), args); }
      async _readFile(path, options = {}) {
        const node = await this._get(path);
        if (!node || node.kind !== 'file') throw new Error('目标不是文件');
        const as = typeof options === 'string' ? options : options.as;
        if (as === 'blob') return new Blob([node.data], { type: node.mime || mimeFromName(path) });
        if (as === 'text' || as === 'utf8') return decodeText(node.data);
        return node.data;

    function attachTouchRowDrag(row, entry, getCurrent, refresh) {

      }, { passive: true });
      row.addEventListener('touchmove', (e) => {
        if (!drag) return;

        const dx = t.clientX - drag.x, dy = t.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) < 12) return;
        e.preventDefault();
        drag.moved = true;
        if (!drag.ghost) {
          drag.ghost = document.createElement('div');
          drag.ghost.className = 'toast';

      }, { passive: false });
      row.addEventListener('touchend', async (e) => {
        if (!drag) return;

    function attachExplorerLasso(wrap, selected, render) {

        lasso.style.display = 'block';
        const move = (ev) => {
          const cur = { x: ev.clientX - rect.left + wrap.scrollLeft, y: ev.clientY - rect.top + wrap.scrollTop };
          const box = { left: Math.min(start.x, cur.x), top: Math.min(start.y, cur.y), width: Math.abs(start.x - cur.x), height: Math.abs(start.y - cur.y) };
          Object.assign(lasso.style, { left: box.left + 'px', top: box.top + 'px', width: box.width + 'px', height: box.height + 'px' });
          selected.clear();

            if (rr.left < box.left + box.width && rr.right > box.left && rr.top < box.top + box.height && rr.bottom > box.top) selected.add(row.dataset.path);

    function parseDelimited(text, delimiter) {
      const rows = []; let row = [], cell = '', quote = false;
      for (let i = 0; i < text.length; i++) {

        if (ch === '"') { if (quote && next === '"') { cell += '"'; i++; } else quote = !quote; }
        else if (ch === delimiter && !quote) { row.push(cell); cell = ''; }
        else if ((ch === '\n' || ch === '\r') && !quote) { if (ch === '\r' && next === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
        else cell += ch;
      }
      row.push(cell); rows.push(row);
      return rows;

    async function archiveBuffer(path) {
      let buf = await fs.readFile(path);
      if ((Path.ext(path) === '.tgz' || path.endsWith('.tar.gz') || Path.ext(path) === '.gz') && window.DecompressionStream) {

    function parseTar(buffer) {

        const flag = String.fromCharCode(bytes[off + 156] || 48);
        rows.push({ name, size, kind: flag === '5' || name.endsWith('/') ? 'directory' : 'file', dataOffset: off + 512 });

    }
    function readTarString(bytes, off, len) { let s = ''; for (let i = 0; i < len && bytes[off+i]; i++) s += String.fromCharCode(bytes[off+i]); return s; }
    async function extractArchive(path) {

        toast(`<strong>解压完成</strong><br>${target}`); refreshAll(); openExplorer(target);
      } catch (err) { toast(`<strong>解压失败</strong><br>${err.message}`); }
    }

    function openPaint() {
      WM.create({ title: '画板', icon: 'paint', width: 820, height: 620, render(container) {
        container.innerHTML = `<div class="paint"><div class="toolbar"><input type="color" value="#101013"><input class="field size" type="range" min="1" max="40" value="7"><button class="tool-button clear"><span>清空</span></button><button class="tool-button save">${iconSvg('disk')}<span>保存 PNG</span></button></div><div class="canvas-wrap"><canvas class="paint-canvas" width="1280" height="820"></canvas></div></div>`;
        const canvas = $('canvas', container), ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f6f1df'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        let drawing = false;
        const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height }; };
        canvas.addEventListener('pointerdown', (e) => { drawing = true; canvas.setPointerCapture(e.pointerId); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
        canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = $('input[type="color"]', container).value; ctx.lineWidth = $('.size', container).value; ctx.lineTo(p.x,p.y); ctx.stroke(); });
        canvas.addEventListener('pointerup', () => drawing = false);
        $('.clear', container).onclick = () => { ctx.fillStyle = '#f6f1df'; ctx.fillRect(0,0,canvas.width,canvas.height); };
        $('.save', container).onclick = () => canvas.toBlob(async (blob) => { const name = `drawing-${new Date().toISOString().replace(/[:.]/g,'-')}.png`; await fs.writeFile('/Pictures/' + name, blob, { mime: 'image/png' }); toast('画作已保存到 /Pictures'); refreshAll(); }, 'image/png');
      }});
    }

    async function openSettings() {
      WM.create({ title: '设置', icon: 'settings', width: 780, height: 620, render(container) {
        async function render() {
          const estimate = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : { usage: await fs.du('/'), quota: 0 };
          const usage = estimate.usage || await fs.du('/'); const quota = estimate.quota || usage;
          const dirs = ['/Desktop','/Documents','/Pictures','/Music','/Videos','/Downloads','/Wallpapers','/mnt/local'];
          const sizes = [];
          for (const d of dirs) sizes.push([d, await fs.du(d).catch(() => 0)]);
          container.innerHTML = `<div class="settings"><h2>Settings</h2><p class="muted">统一文件系统后端：${fs.backendLabel}。OPFS 文件、IndexedDB 降级、localStorage 偏好与 Cookie 状态共同维护当前系统。</p><h3>存储占用</h3><div class="meter"><span style="width:${Math.min(100, usage / quota * 100 || 0)}%"></span></div><div class="info-row"><span>已用</span><strong>${formatBytes(usage)}</strong></div><div class="info-row"><span>可用配额</span><strong>${quota ? formatBytes(quota) : '未知'}</strong></div><div class="info-list">${sizes.map(([d,s]) => `<div class="info-row"><span>${d}</span><strong>${formatBytes(s)}</strong></div>`).join('')}</div><h3>壁纸系统</h3><div class="wallpaper-grid"></div><div class="toolbar" style="padding-left:0"><button class="tool-button upload-wall">${iconSvg('image')}<span>上传自定义壁纸</span></button></div><h3>本地文件夹挂载</h3><div class="toolbar" style="padding-left:0"><button class="tool-button mount">${iconSvg('mount')}<span>挂载本地文件夹</span></button></div><div class="info-list mounts"></div><h3>系统维护</h3><div class="toolbar" style="padding-left:0"><button class="tool-button reset">${iconSvg('trash')}<span>一键重置 OPFS 根文件系统</span></button></div></div>`;
          const grid = $('.wallpaper-grid', container);
          WALLPAPERS.forEach((w) => { const b = document.createElement('button'); b.className = 'wallpaper-choice'; b.style.backgroundImage = w.css; b.innerHTML = `<span>${w.name}</span>`; b.onclick = () => { state.prefs.wallpaper = { type: 'builtin', id: w.id }; saveJSON('noctilux.prefs', state.prefs); applyWallpaper(); }; grid.appendChild(b); });
          $('.upload-wall', container).onclick = () => wallpaperInput.click();
          $('.mount', container).onclick = async () => { await mountFolderFlow(); render(); };
          const mounts = $('.mounts', container);
          if (!fs.mounts.size) mounts.innerHTML = '<div class="muted">当前没有已挂载的本地文件夹。</div>';
          fs.mounts.forEach((backend, prefix) => { const row = document.createElement('div'); row.className = 'info-row'; row.innerHTML = `<span>${prefix}</span><button class="tool-button">卸载</button>`; $('button', row).onclick = async () => { await fs.unmount(prefix); refreshAll(); render(); }; mounts.appendChild(row); });
          $('.reset', container).onclick = async () => { if (!confirm('重置会清空 OPFS 根文件系统中的虚拟文件。继续？')) return; await fs.reset(); state.iconPositions = {}; state.selectedIcons.clear(); saveIconPositions(); await seedFiles(); refreshAll(); render(); toast('系统已重置'); };
        }
        render();
      }});
    }

    async function exportPath(path) {
      const stat = await fs.stat(path);
      if (stat.kind === 'file') {
        const blob = await fs.readFile(path, { as: 'blob' });
        downloadBlob(blob, Path.basename(path));
      } else if (window.JSZip) {
        const zip = new JSZip();
        await addToZip(zip, path, Path.basename(path));
        const blob = await zip.generateAsync({ type: 'blob' });
        downloadBlob(blob, Path.basename(path) + '.zip');
      } else toast('目录导出需要 JSZip CDN 成功加载');
    }
    async function addToZip(zip, path, rel) {
      const stat = await fs.stat(path);
      if (stat.kind === 'directory') { const folder = zip.folder(rel); for (const child of await fs.readdir(path)) await addToZip(folder, child.path, child.name); }
      else zip.file(rel, await fs.readFile(path));
    }
    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5200);
    }

    function updateClock() { $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }); }
    function wireShell() {
      $('#startButton').innerHTML = `${iconSvg('menu')}<span>开始</span>`;
      $('#startButton').onclick = () => { const open = !startMenu.classList.contains('open'); startMenu.classList.toggle('open', open); $('#startButton').setAttribute('aria-expanded', String(open)); };
      $('#quickExplorer').innerHTML = iconSvg('explorer'); $('#quickExplorer').onclick = () => openExplorer('/Desktop');
      $('#quickSettings').innerHTML = iconSvg('settings'); $('#quickSettings').onclick = () => openSettings();
      updateClock(); setInterval(updateClock, 1000 * 20);
      document.addEventListener('keydown', (e) => {
        if (isEditableTarget(e.target)) return;
        if (e.key === 'F5') { e.preventDefault(); refreshAll(); }
        if (e.key === 'Delete') { const paths = [...state.selectedIcons].map((id) => id.startsWith('file:') ? id.slice(5) : null).filter(Boolean); if (paths.length) deletePaths(paths); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); openExplorer('/Desktop'); }
      });
    }
    async function boot() {
      try {
        setBoot('initializing storage'); await vfs.init();
        setBoot('seeding desktop files'); await seedFiles();
        setBoot('applying wallpaper'); applyWallpaper();
        setBoot('rendering desktop'); wireShell(); renderStartMenu(); await renderDesktop();
        const reminders = loadJSON('noctilux.mount.reminders', []);
        if (reminders.length) setTimeout(() => toast(`<strong>本地挂载提醒</strong><br>刷新后浏览器需要重新授权：${reminders.join(', ')}`), 900);
        await sleep(500);
        $('#boot').classList.add('hidden');
        state.ready = true;
      } catch (err) {
        console.error(err);
        setBoot('boot failed: ' + err.message);
        toast(`<strong>启动失败</strong><br>${err.message}`, 8000);
      }
    }
    boot();
  })();
  </script>
</body>
</html>
