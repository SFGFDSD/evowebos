  const size = el('input',{type:'range',min:'1',max:'40',value:'4'});
  const eraser = el('button',{},'Eraser');
  const clear = el('button',{},'Clear');
  const save = el('button',{},'Save to Desktop');
  bar.append(el('span',{style:'font-family:var(--mono);font-size:11px'},'Color'), color, el('span',{style:'font-family:var(--mono);font-size:11px'},'Size'), size, eraser, clear, el('span',{style:'flex:1'}), save);
  const wrap = el('div',{class:'pt-canvas-wrap'});
  const canvas = el('canvas',{width:'900',height:'600'});
  wrap.append(canvas);
  root.append(bar, wrap);
  createWindow({title:'Paint',icon:'paint',width:760,height:560,content:root});
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  let drawing=false, last=null, isEraser=false;
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches?e.touches[0]:e;
    const sx = canvas.width / r.width;
    const sy = canvas.height / r.height;
    return {x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy};
  }
  const start = (e)=>{ drawing=true; last=getPos(e); e.preventDefault();};
  const move = (e)=>{
    if(!drawing) return;
    const p = getPos(e);
    ctx.strokeStyle = isEraser?'#ffffff':color.value;
    ctx.lineWidth = +size.value;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p;
  };
  const end = ()=>{ drawing=false; last=null; };
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
  eraser.addEventListener('click',()=>{isEraser=!isEraser; eraser.style.background = isEraser?'var(--oxblood)':'';eraser.style.color = isEraser?'var(--paper)':'';});
  clear.addEventListener('click',()=>{ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); });
  save.addEventListener('click', async ()=>{
    canvas.toBlob(async (blob)=>{
      const buf = await blob.arrayBuffer();
      const name = 'painting-'+Date.now()+'.png';
      await fs.writeFile('/Desktop/'+name, buf);
      toast('Saved to Desktop');
      refreshDesktop();
    },'image/png');
  });
}

async function dirSize(path){
  let total = 0;
  try{
    const entries = await fs.readdir(path);
    for(const e of entries){
      if(e.isDir) total += await dirSize(joinPath(path,e.name));
      else total += e.size||0;
    }
  }catch(e){}
  return total;
}

—  Crafted as a single HTML file.`);
    await fs.writeText('/Desktop/notes.txt','Atelier scratchpad\n\nWrite anything here. Saved to OPFS.');
    await fs.writeText('/Documents/sample.csv','name,role,year\nAda,Engineer,1843\nGrace,Compiler,1952\nAlan,Theorist,1936\nKaren,Designer,2024');
    await fs.writeText('/Documents/index.html',`<!DOCTYPE html><html><head><style>
body{margin:0;font-family:Georgia,serif;background:#f1e7d0;color:#1a1814;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{padding:48px;text-align:center}
h1{font-style:italic;font-size:48px;font-weight:300;letter-spacing:-2px}
.dot{display:inline-block;width:10px;height:10px;background:#8b2a1f;border-radius:50%;margin:0 8px;vertical-align:middle}
p{font-style:italic;color:#7a6f5c}
</style></head><body><div class="card"><h1>Hello<span class="dot"></span>World</h1><p>edit me in HTML Studio</p></div></body></html>`);
    localStorage.setItem('atelier.seeded','1');
  }

  // Restore wallpaper
  const wp = localStorage.getItem('atelier.wallpaper');
  if(wp==='wp-custom'){
    const cp = localStorage.getItem('atelier.wallpaper.custom');
    if(cp && await fs.exists(cp)){
      const f = await fs.readFileAsFile(cp);
      const desk = $('#desktop');
      desk.className='wp-custom';
      desk.style.backgroundImage=`url(${URL.createObjectURL(f)})`;
      desk.style.backgroundSize='cover';
      desk.style.backgroundPosition='center';
      STATE.wallpaper='wp-custom';
    }
  } else if(wp){ setWallpaper(wp); }

  buildDock();
  buildStartMenu();
  await refreshDesktop();
  await updateStorageInfo();

  // Hide boot
  setTimeout(()=>{ $('#boot').classList.add('hidden'); setTimeout(()=>$('#boot').remove(), 800); }, 900);
}

// Topbar menu launchers
$$('#topbar .menu span').forEach(s=>{
  s.addEventListener('click',()=>{ const a=APPS[s.dataset.app]; a&&a.launch(); });
});

window.addEventListener('beforeunload', (e)=>{
  // Ask only if there's a dirty editor
  const dirty = $$('.te-bar .name.dirty').length;
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});

boot();
</script>
</body>
</html>
