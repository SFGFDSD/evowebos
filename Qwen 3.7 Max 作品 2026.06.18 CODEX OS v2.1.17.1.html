<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>CODEX OS · 典籍桌面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400&family=Newsreader:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- CodeMirror 代码编辑器 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/base16-light.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
<!-- v86 虚拟机模拟器 -->
<script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js"></script>

<style>
/* ============== 全局变量：古董印刷品美学 ============== */
:root{
  --paper:        #efe6cf;
  --paper-warm:   #e8dcc0;
  --paper-deep:   #d8c9a6;
  --ink:          #1f1a14;
  --ink-soft:     #3a322a;
  --ink-mute:     #6b5f50;
  --ink-faint:    #a8997e;
  --vermillion:   #c84a2b;
  --vermillion-d: #9a351d;
  --moss:         #5a6f3a;
  --moss-d:       #3f4f26;
  --gold:         #b8893c;
  --cyan-deep:    #2a5560;
  --line:         rgba(31,26,20,0.14);
  --line-hard:    rgba(31,26,20,0.28);
  --shadow-sm:    0 1px 0 rgba(31,26,20,0.06), 0 2px 6px rgba(31,26,20,0.08);
  --shadow-md:    0 2px 0 rgba(31,26,20,0.08), 0 10px 30px rgba(31,26,20,0.18);
  --shadow-lg:    0 30px 60px rgba(31,26,20,0.35), 0 0 0 1px rgba(31,26,20,0.1);
  --r-sm: 3px;
  --r-md: 6px;
  --r-lg: 10px;
  --font-d: "Fraunces", "Times New Roman", serif;
  --font-b: "Newsreader", Georgia, serif;
  --font-m: "IBM Plex Mono", ui-monospace, monospace;
  --task-h: 44px;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
html,body{ width:100%; height:100%; overflow:hidden; font-family:var(--font-b); color:var(--ink); background:var(--paper); font-size:14px; line-height:1.5; }
button,input,select,textarea{ font-family:inherit; color:inherit; background:none; border:none; outline:none; }
button{ cursor:pointer; }
::selection{ background:var(--vermillion); color:var(--paper); }

/* 纸张纹理 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(200,74,43,0.06), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(90,111,58,0.05), transparent 50%),
    repeating-linear-gradient(0deg, rgba(31,26,20,0.012) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(31,26,20,0.012) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}

/* ============== 启动屏 ============== */
#boot{
  position:fixed; inset:0; z-index:10000; background:var(--ink); color:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-m); gap:18px;
  transition: opacity .6s ease;
}
#boot .logo{ font-family:var(--font-d); font-weight:900; font-size:64px; letter-spacing:-.02em; font-variation-settings:"opsz" 144, "SOFT" 100; }
#boot .logo span{ color:var(--vermillion); font-style:italic; }
#boot .sub{ font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); }
#boot .bar{ width:280px; height:2px; background:rgba(239,230,207,0.12); overflow:hidden; }
#boot .bar i{ display:block; height:100%; width:0; background:var(--vermillion); animation: bootprog 2.2s ease-out forwards; }
@keyframes bootprog{ 0%{width:0} 60%{width:80%} 100%{width:100%} }

/* ============== 桌面 ============== */
#desktop{
  position:fixed; inset:0; z-index:1;
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(200,74,43,0.08), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(90,111,58,0.07), transparent 45%),
    linear-gradient(135deg, var(--paper) 0%, var(--paper-warm) 100%);
  background-size: cover;
  background-position:center;
}
#desktop.has-wallpaper{ background-size:cover; background-position:center; }

/* 装饰边框 */
#desktop::after{
  content:""; position:absolute; inset:12px; pointer-events:none;
  border:1px solid var(--line); z-index:1;
}
#desktop::before{
  content:"CODEX · MMXXVI"; position:absolute; top:16px; left:50%; transform:translateX(-50%);
  font-family:var(--font-m); font-size:10px; letter-spacing:.4em; color:var(--ink-faint);
  z-index:2; pointer-events:none;
}

/* 桌面图标 */
#icon-layer{
  position:absolute; inset:24px; z-index:3;
  pointer-events:none;
}
.desktop-icon{
  position:absolute; width:88px; padding:6px 4px; display:flex; flex-direction:column;
  align-items:center; gap:4px; cursor:pointer; border-radius:var(--r-sm);
  user-select:none; touch-action:none;
  pointer-events:auto;
  transition: background .15s ease, transform .2s ease;
}
.desktop-icon:hover{ background: rgba(31,26,20,0.05); }
.desktop-icon.selected{ background: rgba(200,74,43,0.12); box-shadow: inset 0 0 0 1px var(--vermillion); }
.desktop-icon .ic{
  width:52px; height:52px; display:flex; align-items:center; justify-content:center;
  background: var(--paper-warm); border:1px solid var(--line-hard);
  box-shadow: var(--shadow-sm);
  border-radius: var(--r-sm);
}
.desktop-icon .ic svg{ width:32px; height:32px; }
.desktop-icon .lbl{
  font-family:var(--font-m); font-size:10px; text-align:center;
  color: var(--ink); padding: 1px 3px; border-radius:2px;
  word-break: break-word; line-height:1.2;
  max-width: 100%;
  text-shadow: 0 0 4px var(--paper);
}
.desktop-icon.dragging{ opacity:0.5; }
.desktop-icon.drop-target .ic{ box-shadow: 0 0 0 2px var(--vermillion), var(--shadow-sm); }

/* 框选 */
#sel-box{ position:absolute; border:1px dashed var(--vermillion); background:rgba(200,74,43,0.08); z-index:4; pointer-events:none; display:none; }

/* ============== 任务栏 ============== */
#taskbar{
  position:fixed; left:12px; right:12px; bottom:12px; height:var(--task-h);
  background: var(--paper-warm); border:1px solid var(--line-hard);
  box-shadow: var(--shadow-md);
  border-radius: var(--r-md); z-index:500;
  display:flex; align-items:center; padding: 4px; gap:4px;
}
#start-btn{
  height:36px; padding: 0 14px; display:flex; align-items:center; gap:8px;
  background: var(--ink); color: var(--paper);
  border-radius: var(--r-sm); font-family:var(--font-d); font-weight:700; font-size:14px;
  transition: transform .1s, background .15s;
}
#start-btn:hover{ background: var(--vermillion); }
#start-btn:active{ transform: translateY(1px); }
#start-btn svg{ width:16px; height:16px; }

#task-list{ flex:1; display:flex; gap:3px; overflow-x:auto; overflow-y:hidden; padding: 0 4px; }
#task-list::-webkit-scrollbar{ height: 4px; }
#task-list::-webkit-scrollbar-thumb{ background: var(--ink-faint); border-radius:2px; }
.task-item{
  height:32px; min-width:140px; max-width:200px; padding: 0 10px;
  display:flex; align-items:center; gap:8px;
  border-radius: var(--r-sm); background: transparent;
  border-bottom: 2px solid transparent;
  font-family:var(--font-m); font-size:11px; color:var(--ink-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition: background .15s;
}
.task-item:hover{ background: rgba(31,26,20,0.05); }
.task-item.active{ background: var(--paper); border-bottom-color: var(--vermillion); }
.task-item .ti-ic{ width:16px; height:16px; flex-shrink:0; }
.task-item .ti-ic svg{ width:100%; height:100%; }

#tray{
  display:flex; align-items:center; gap:10px; padding: 0 12px;
  font-family:var(--font-m); font-size:11px; color:var(--ink-soft);
  border-left: 1px solid var(--line);
  height: 100%;
}
#tray .clock{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.1; }
#tray .clock .t{ font-size:13px; font-weight:500; color:var(--ink); }
#tray .clock .d{ font-size:9px; letter-spacing:.1em; text-transform:uppercase; }

/* ============== 窗口 ============== */
.window{
  position:absolute; min-width: 320px; min-height: 200px;
  background: var(--paper-warm);
  border: 1px solid var(--line-hard);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  display:flex; flex-direction:column;
  overflow:hidden;
  transform-origin: center center;
  animation: winOpen .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes winOpen{
  from{ opacity:0; transform: scale(.94) translateY(8px); }
  to{ opacity:1; transform: scale(1) translateY(0); }
}
.window.focused{ box-shadow: var(--shadow-lg); }
.window.focused .win-title{ background: var(--ink); color:var(--paper); }
.window.focused .win-title .wt-btns button:hover{ color: var(--vermillion); }
.window.maximized{ border-radius: 0; }
.window.minimized{ display:none; }

.win-title{
  height:34px; display:flex; align-items:center;
  background: var(--paper-deep);
  border-bottom: 1px solid var(--line);
  padding: 0 4px 0 10px;
  font-family:var(--font-d); font-weight:500; font-size:13px; color:var(--ink);
  user-select:none; touch-action:none;
  cursor: move;
  transition: background .15s, color .15s;
}
.win-title .wt-icon{ width:14px; height:14px; margin-right:8px; flex-shrink:0; }
.win-title .wt-icon svg{ width:100%; height:100%; }
.win-title .wt-text{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variation-settings:"opsz" 14; }
.win-title .wt-btns{ display:flex; gap:2px; }
.win-title .wt-btns button{
  width:26px; height:24px; display:flex; align-items:center; justify-content:center;
  border-radius: var(--r-sm); color: currentColor;
  transition: background .15s;
}
.win-title .wt-btns button:hover{ background: rgba(239,230,207,0.15); }
.win-title .wt-btns svg{ width:11px; height:11px; stroke: currentColor; fill:none; stroke-width:1.5; }

.win-body{
  flex:1; overflow:auto; position:relative; background: var(--paper);
}

/* resize 把手 */
.win-handle{ position:absolute; z-index:10; }
.win-handle.n{ top:-3px; left:6px; right:6px; height:6px; cursor:ns-resize; }
.win-handle.s{ bottom:-3px; left:6px; right:6px; height:6px; cursor:ns-resize; }
.win-handle.e{ right:-3px; top:6px; bottom:6px; width:6px; cursor:ew-resize; }
.win-handle.w{ left:-3px; top:6px; bottom:6px; width:6px; cursor:ew-resize; }
.win-handle.ne{ top:-3px; right:-3px; width:10px; height:10px; cursor:nesw-resize; }
.win-handle.nw{ top:-3px; left:-3px; width:10px; height:10px; cursor:nwse-resize; }
.win-handle.se{ bottom:-3px; right:-3px; width:10px; height:10px; cursor:nwse-resize; }
.win-handle.sw{ bottom:-3px; left:-3px; width:10px; height:10px; cursor:nesw-resize; }

/* ============== 开始菜单 ============== */
#start-menu{
  position:fixed; bottom: calc(var(--task-h) + 24px); left:12px;
  width: 380px; max-width: calc(100vw - 24px);
  background: var(--paper-warm); border: 1px solid var(--line-hard);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  z-index:600; padding: 14px;
  display:none;
  animation: menuOpen .18s ease-out;
}
@keyframes menuOpen{ from{ opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }
#start-menu.open{ display:block; }
#start-menu .sm-head{
  font-family:var(--font-d); font-size:22px; font-weight:700; letter-spacing:-.01em;
  padding-bottom: 8px; border-bottom:1px solid var(--line); margin-bottom: 10px;
  display:flex; justify-content:space-between; align-items:baseline;
}
#start-menu .sm-head small{ font-family:var(--font-m); font-size:9px; letter-spacing:.3em; color:var(--ink-faint); font-weight:400; text-transform:uppercase; }
#start-menu .sm-grid{
  display:grid; grid-template-columns: repeat(4, 1fr); gap:4px;
}
.sm-app{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px;
  border-radius:var(--r-sm); cursor:pointer; transition: background .12s;
}
.sm-app:hover{ background: rgba(200,74,43,0.1); }
.sm-app .ic{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.sm-app .ic svg{ width:32px; height:32px; }
.sm-app .lbl{ font-family:var(--font-m); font-size:10px; text-align:center; }

#start-menu .sm-foot{
  margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--font-m); font-size:10px; color:var(--ink-faint); letter-spacing:.1em;
}
.sm-foot button{
  padding: 4px 10px; border-radius: var(--r-sm); border:1px solid var(--line-hard);
  font-family:var(--font-m); font-size:10px;
}
.sm-foot button:hover{ background: var(--ink); color: var(--paper); }

/* ============== 右键菜单 ============== */
.ctx-menu{
  position:fixed; min-width: 220px;
  background: var(--paper-warm); border:1px solid var(--line-hard);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  z-index:9000; padding:4px; font-family:var(--font-m); font-size:12px;
  animation: menuOpen .12s ease-out;
}
.ctx-item{
  padding: 7px 12px; border-radius: var(--r-sm); cursor:pointer;
  display:flex; align-items:center; gap:10px;
  transition: background .1s;
}
.ctx-item:hover{ background: var(--ink); color:var(--paper); }
.ctx-item.danger:hover{ background: var(--vermillion); color:var(--paper); }
.ctx-item .ci-ic{ width:14px; height:14px; }
.ctx-item .ci-ic svg{ width:100%; height:100%; }
.ctx-item .ci-k{ margin-left:auto; font-size:10px; opacity:.5; }
.ctx-sep{ height:1px; background:var(--line); margin: 4px 8px; }

/* ============== 通用组件 ============== */
.btn{
  padding: 6px 14px; background: var(--ink); color:var(--paper);
  border-radius: var(--r-sm); font-family:var(--font-m); font-size:11px; letter-spacing:.05em;
  transition: background .12s, transform .1s;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{ background: var(--vermillion); }
.btn:active{ transform: translateY(1px); }
.btn.ghost{ background: transparent; color: var(--ink); border:1px solid var(--line-hard); }
.btn.ghost:hover{ background: var(--ink); color: var(--paper); }
.btn.danger{ background: var(--vermillion); }
.btn svg{ width:12px; height:12px; }

.inp{
  padding: 6px 10px; background: var(--paper);
  border: 1px solid var(--line-hard); border-radius: var(--r-sm);
  font-family:var(--font-m); font-size:12px;
}
.inp:focus{ border-color: var(--vermillion); box-shadow: 0 0 0 2px rgba(200,74,43,0.15); }

/* ============== 文件资源管理器 ============== */
.fe{ display:flex; height:100%; background: var(--paper); }
.fe-side{
  width:200px; background: var(--paper-warm); border-right:1px solid var(--line);
  padding: 10px 6px; overflow:auto;
}
.fe-side h4{
  font-family:var(--font-m); font-size:9px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-faint); padding: 8px 8px 4px; font-weight:500;
}
.fe-side-item{
  padding: 5px 10px; border-radius: var(--r-sm); font-size:12px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-m);
  transition: background .1s;
}
.fe-side-item:hover{ background: rgba(31,26,20,0.05); }
.fe-side-item.active{ background: var(--ink); color: var(--paper); }
.fe-side-item svg{ width:14px; height:14px; flex-shrink:0; }

.fe-main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.fe-toolbar{
  height:38px; display:flex; align-items:center; gap:6px; padding: 0 8px;
  border-bottom:1px solid var(--line); background: var(--paper-warm);
}
.fe-toolbar button{
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  border-radius: var(--r-sm);
}
.fe-toolbar button:hover{ background: rgba(31,26,20,0.08); }
.fe-toolbar button:disabled{ opacity:.3; cursor:default; }
.fe-toolbar svg{ width:14px; height:14px; }
.fe-bc{
  flex:1; display:flex; align-items:center; font-family:var(--font-m); font-size:11px;
  background: var(--paper); padding: 3px 8px; border-radius:var(--r-sm);
  border:1px solid var(--line);
  min-width:0; overflow:hidden;
}
.fe-bc span{ cursor:pointer; white-space:nowrap; }
.fe-bc span:hover{ color: var(--vermillion); }
.fe-bc .sep{ color:var(--ink-faint); margin: 0 4px; }
.fe-search{ width:140px; padding: 3px 8px; font-size:11px; font-family:var(--font-m);
  background: var(--paper); border:1px solid var(--line); border-radius: var(--r-sm);
}

.fe-view{ flex:1; overflow:auto; padding: 8px; position:relative; }
.fe-list{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 6px;
}
.fe-list.list-view{ display:flex; flex-direction:column; gap: 0; }

.fe-item{
  padding: 10px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;
  border-radius: var(--r-sm); cursor:pointer; user-select:none;
  transition: background .1s;
}
.fe-item:hover{ background: rgba(31,26,20,0.05); }
.fe-item.selected{ background: rgba(200,74,43,0.12); box-shadow: inset 0 0 0 1px var(--vermillion); }
.fe-item .ic{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.fe-item .ic svg{ width:32px; height:32px; }
.fe-item .lbl{
  font-size:11px; text-align:center; word-break:break-word; line-height:1.2;
  max-width: 100%;
}
.fe-list.list-view .fe-item{
  flex-direction:row; padding: 4px 8px; gap:10px; align-items:center;
  border-bottom: 1px solid rgba(31,26,20,0.05);
  border-radius: 0;
}
.fe-list.list-view .fe-item .ic{ width:18px; height:18px; }
.fe-list.list-view .fe-item .ic svg{ width:16px; height:16px; }
.fe-item .meta{ display:none; }
.fe-list.list-view .fe-item .lbl{ text-align:left; flex:1; font-family:var(--font-m); font-size:11px; }
.fe-list.list-view .fe-item .meta{ display:flex; gap:8px; font-family:var(--font-m); font-size:10px; color:var(--ink-mute); }
.fe-list.list-view .fe-item .meta span{ display:inline-block; min-width:100px; }

.fe-header{
  display:none; padding: 4px 8px; gap:10px;
  background: var(--paper-warm); border-bottom:1px solid var(--line);
  font-family:var(--font-m); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color: var(--ink-mute);
  user-select:none;
}
.fe-list.list-view ~ .fe-header{ display:none; }
.fe-view.list-mode .fe-header{ display:flex; }
.fe-view.list-mode .fe-header .fh-name{ flex:1; padding-left: 36px; }
.fe-view.list-mode .fe-header .fh-col{ min-width:100px; cursor:pointer; }
.fe-view.list-mode .fe-header .fh-col:hover{ color: var(--vermillion); }

.fe-empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color: var(--ink-faint); font-family:var(--font-d); font-style:italic;
  gap: 10px;
}

/* 状态栏 */
.fe-status{
  height:24px; padding: 0 12px; display:flex; align-items:center; gap:16px;
  border-top:1px solid var(--line); background: var(--paper-warm);
  font-family:var(--font-m); font-size:10px; color: var(--ink-mute);
}

/* ============== 编辑器 ============== */
.np{ display:flex; flex-direction:column; height:100%; }
.np-toolbar{
  padding: 6px 8px; display:flex; gap:6px; border-bottom:1px solid var(--line);
  background: var(--paper-warm); align-items:center; flex-wrap:wrap;
}
.np-toolbar .file-name{
  flex:1; font-family:var(--font-m); font-size:11px; color: var(--ink-mute);
  padding: 0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.np-body{ flex:1; overflow:auto; }
.np-body textarea{
  width:100%; height:100%; padding: 12px; border:none; resize:none;
  font-family:var(--font-m); font-size:13px; line-height:1.6;
  background: var(--paper);
}
.np .CodeMirror{ height: 100%; font-family: var(--font-m); font-size:13px; background: var(--paper); }
.np .CodeMirror-gutters{ background: var(--paper-warm); border-right:1px solid var(--line); }

/* HTML 预览分屏 */
.html-editor{ display:flex; flex-direction:column; height:100%; }
.html-editor .he-toolbar{ padding:6px 8px; display:flex; gap:6px; border-bottom:1px solid var(--line); background: var(--paper-warm); align-items:center; }
.html-editor .he-split{ display:flex; flex:1; min-height:0; }
.html-editor .he-code, .html-editor .he-preview{ flex:1; min-width:0; display:flex; flex-direction:column; }
.html-editor .he-preview{ border-left:1px solid var(--line); background: #fff; }
.html-editor .he-preview-head{ padding:4px 10px; font-family:var(--font-m); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color: var(--ink-faint); background: var(--paper-warm); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.html-editor .he-preview iframe{ flex:1; width:100%; border:none; background:#fff; }
.html-editor .he-code .CodeMirror{ flex:1; height:auto; }

/* ============== 表格 ============== */
.ss{ display:flex; flex-direction:column; height:100%; }
.ss-toolbar{ padding:6px 8px; display:flex; gap:6px; border-bottom:1px solid var(--line); background: var(--paper-warm); align-items:center; }
.ss-tabs{ display:flex; gap:4px; }
.ss-tabs button{
  padding: 3px 10px; border:1px solid var(--line-hard); border-radius:var(--r-sm);
  font-family:var(--font-m); font-size:10px;
}
.ss-tabs button.active{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ss-body{ flex:1; overflow:auto; }
.ss-table{ border-collapse:collapse; font-family:var(--font-m); font-size:12px; }
.ss-table th, .ss-table td{
  border:1px solid var(--line); padding: 3px 8px; text-align:left; min-width:80px;
  white-space: nowrap;
}
.ss-table th{ background: var(--paper-warm); font-weight:500; position:sticky; top:0; z-index:1; }
.ss-table td[contenteditable="true"]:focus{ background: rgba(200,74,43,0.08); outline: 1px solid var(--vermillion); }
.ss-text{ width:100%; height:100%; padding:12px; font-family:var(--font-m); font-size:12px; border:none; resize:none; background: var(--paper); }

/* ============== 浏览器 ============== */
.br{ display:flex; flex-direction:column; height:100%; }
.br-bar{ padding:6px; display:flex; gap:6px; border-bottom:1px solid var(--line); background: var(--paper-warm); align-items:center; }
.br-bar button{ width:28px; height:28px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; }
.br-bar button:hover{ background: rgba(31,26,20,0.08); }
.br-bar input{ flex:1; padding:5px 10px; background: var(--paper); border:1px solid var(--line-hard); border-radius: var(--r-sm); font-family:var(--font-m); font-size:11px; }
.br-bar input:focus{ border-color: var(--vermillion); }
.br-frame{ flex:1; width:100%; border:none; background:#fff; }

/* ============== 计算器 ============== */
.calc{ display:flex; flex-direction:column; height:100%; padding:12px; background: var(--paper-warm); }
.calc-disp{
  background: var(--ink); color: var(--paper); padding: 14px; border-radius: var(--r-sm);
  font-family:var(--font-m); text-align:right; margin-bottom:10px;
  min-height: 70px; display:flex; flex-direction:column; justify-content:flex-end;
}
.calc-disp .prev{ font-size:11px; color: var(--ink-faint); min-height:14px; }
.calc-disp .cur{ font-size:26px; font-variation-settings:"opsz" 24; font-family: var(--font-d); font-weight:300; overflow-x:auto; }
.calc-keys{ flex:1; display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; }
.calc-keys button{
  background: var(--paper); border:1px solid var(--line-hard); border-radius: var(--r-sm);
  font-family:var(--font-m); font-size:16px; font-weight:500;
  transition: background .1s, transform .05s;
}
.calc-keys button:hover{ background: var(--ink); color: var(--paper); }
.calc-keys button:active{ transform: scale(.96); }
.calc-keys button.op{ background: var(--vermillion); color: var(--paper); border-color: var(--vermillion-d); }
.calc-keys button.op:hover{ background: var(--vermillion-d); }
.calc-keys button.fn{ background: var(--paper-deep); }
.calc-keys button.span2{ grid-column: span 2; }

/* ============== 画板 ============== */
.pt{ display:flex; flex-direction:column; height:100%; }
.pt-toolbar{ padding:6px 8px; display:flex; gap:6px; border-bottom:1px solid var(--line); background: var(--paper-warm); align-items:center; flex-wrap:wrap; }
.pt-toolbar .tool{
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line-hard); border-radius: var(--r-sm);
}
.pt-toolbar .tool.active{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pt-toolbar svg{ width:14px; height:14px; }
.pt-canvas-wrap{ flex:1; overflow:auto; background:
  repeating-conic-gradient(#e8dcc0 0% 25%, #efe6cf 0% 50%) 50% / 20px 20px;
  display:flex; align-items:center; justify-content:center; padding: 20px;
}
.pt-canvas{ background:#fff; box-shadow: var(--shadow-md); cursor: crosshair; touch-action:none; }

/* ============== 图片/媒体查看器 ============== */
.vwr{ display:flex; flex-direction:column; height:100%; background: var(--ink); color:var(--paper); }
.vwr-bar{ padding:6px 8px; display:flex; gap:6px; border-bottom:1px solid rgba(239,230,207,0.1); align-items:center; background: rgba(31,26,20,0.9); }
.vwr-bar button{ width:30px; height:30px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; color:var(--paper); }
.vwr-bar button:hover{ background: rgba(239,230,207,0.1); }
.vwr-bar .fn{ flex:1; font-family:var(--font-m); font-size:11px; padding: 0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vwr-stage{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding: 20px; }
.vwr-stage img{ max-width:100%; max-height:100%; box-shadow: var(--shadow-lg); transition: transform .2s; }
.vwr-stage video, .vwr-stage audio{ max-width:100%; max-height:100%; }
.vwr-stage iframe{ width:100%; height:100%; background:#fff; border:none; }

/* ============== 设置 ============== */
.st{ display:flex; height:100%; }
.st-side{ width:180px; background: var(--paper-warm); border-right:1px solid var(--line); padding: 10px 6px; }
.st-side-item{
  padding: 7px 12px; border-radius:var(--r-sm); cursor:pointer; font-family:var(--font-m); font-size:12px;
  display:flex; align-items:center; gap:8px; margin-bottom:2px;
}
.st-side-item:hover{ background: rgba(31,26,20,0.05); }
.st-side-item.active{ background: var(--ink); color:var(--paper); }
.st-side-item svg{ width:14px; height:14px; }
.st-main{ flex:1; overflow:auto; padding: 20px; }
.st-main h2{ font-family:var(--font-d); font-size:24px; font-weight:700; margin-bottom:4px; font-variation-settings:"opsz" 96; }
.st-main .sub{ font-family:var(--font-m); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:20px; }
.st-section{ margin-bottom: 24px; }
.st-section h3{ font-family:var(--font-d); font-size:16px; margin-bottom:10px; padding-bottom:4px; border-bottom:1px solid var(--line); }
.wp-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
.wp-item{
  aspect-ratio: 16/10; border-radius:var(--r-sm); cursor:pointer; position:relative;
  border:2px solid transparent; overflow:hidden;
  background-size:cover; background-position:center;
  transition: border-color .15s, transform .1s;
}
.wp-item:hover{ transform: translateY(-2px); }
.wp-item.active{ border-color: var(--vermillion); }
.wp-item .wpl{ position:absolute; bottom:0; left:0; right:0; background: rgba(31,26,20,0.7); color: var(--paper); padding: 3px 6px; font-family:var(--font-m); font-size:10px; }

.usage-bar{
  height:10px; background: var(--paper-deep); border-radius: 5px; overflow:hidden; margin: 8px 0;
}
.usage-bar i{ display:block; height:100%; background: linear-gradient(90deg, var(--moss), var(--vermillion)); transition: width .4s; }

/* ============== 对话框 ============== */
.dlg-backdrop{
  position:fixed; inset:0; background: rgba(31,26,20,0.4); z-index:8000;
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation: fade .2s ease;
}
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.dlg{
  background: var(--paper-warm); border:1px solid var(--line-hard); border-radius: var(--r-md);
  box-shadow: var(--shadow-lg); min-width: 320px; max-width: 90vw; max-height: 80vh;
  display:flex; flex-direction:column; overflow:hidden;
  animation: menuOpen .2s ease-out;
}
.dlg-head{ padding: 14px 18px; border-bottom:1px solid var(--line); font-family:var(--font-d); font-size:18px; font-weight:700; }
.dlg-body{ padding: 16px 18px; overflow:auto; flex:1; }
.dlg-body p{ margin-bottom: 12px; font-family:var(--font-b); }
.dlg-body input{ width:100%; }
.dlg-foot{ padding: 12px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

/* 通知 */
#notify{ position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast{
  background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius:var(--r-sm);
  font-family:var(--font-m); font-size:12px; box-shadow: var(--shadow-md);
  pointer-events: auto; max-width: 320px;
  border-left: 3px solid var(--vermillion);
  animation: toastIn .3s ease-out;
}
@keyframes toastIn{ from{ transform: translateX(20px); opacity:0;} to{transform:none; opacity:1;} }

/* ============== 移动端适配 ============== */
@media (max-width: 720px){
  :root{ --task-h: 56px; }
  #desktop::before{ display:none; }
  #desktop::after{ inset:6px; }
  #taskbar{ left:6px; right:6px; bottom:6px; border-radius: 14px; padding: 6px; }
  #start-btn{ padding: 0 10px; height:44px; }
  #start-btn .lbl{ display:none; }
  #task-list{ gap: 4px; }
  .task-item{ min-width: 44px; max-width: 44px; padding:0; justify-content:center; }
  .task-item .ti-txt{ display:none; }
  #tray{ padding: 0 8px; }
  #tray .clock .d{ display:none; }
  #start-menu{ left:6px; right:6px; width:auto; }
  #start-menu .sm-grid{ grid-template-columns: repeat(4, 1fr); }
  .desktop-icon{ width:72px; }
  .desktop-icon .ic{ width:44px; height:44px; }
  .window{ min-width: 260px; }
  .fe-side{ width:140px; }
  .st-side{ width:120px; }
  .html-editor .he-split{ flex-direction: column; }
  .html-editor .he-preview{ border-left:none; border-top:1px solid var(--line); }
}
@media (max-width: 480px){
  .fe-side{ display:none; }
  .fe-view.list-mode .fe-header .fh-col.size, .fe-view.list-mode .fe-header .fh-col.type{ display:none; }
  .fe-list.list-view .fe-item .meta .size, .fe-list.list-view .fe-item .meta .type{ display:none; }
}
