/* ========== 2. FS — 统一文件系统 ========== */
/*
   OPFS 作为主后端，挂载点 /mnt/local/* 路由到 File System Access API。
   对外暴露统一接口：stat, readdir, readFile, writeFile, mkdir, rmdir, unlink, rename, exists, listRecursive。
   本地挂载后端的每个方法签名与 OPFS 后端兼容（接受 callback 作为最后一个参数）。
*/
const FS = (() => {
  let opfsRoot = null;
  const mounts = new Map(); // name -> { handle, dirHandle }
  const MOUNT_ROOT = '/mnt/local';

  /* --- 工具 --- */
  function splitPath(p){
    p = p.replace(/\/+/g,'/').replace(/\/$/,'') || '/';
    if (p === '/') return [];
    return p.split('/').filter(Boolean);
  }
  function joinPath(parts){ return '/' + parts.join('/'); }
  function parentPath(p){ const s = splitPath(p); s.pop(); return joinPath(s) || '/'; }
  function baseName(p){ const s = splitPath(p); return s[s.length-1] || ''; }

  async function walkOPFS(parts){
    let h = opfsRoot;
    for (const seg of parts){
      h = await h.getDirectoryHandle(seg, { create:false });
    }
    return h;
  }

  /* --- 是否路由到挂载 --- */
  function routeMount(path){
    const parts = splitPath(path);
    if (parts[0] === 'mnt' && parts[1] === 'local' && parts[2]){
      const name = parts[2];
      const m = mounts.get(name);
      if (m){
        return { mount: m, rest: parts.slice(3), mountName: name };
      }
    }
    return null;
  }

  /* --- OPFS 后端 --- */
  const opfsBackend = {
    async stat(path){
      const parts = splitPath(path);
      if (parts.length === 0) return { name:'', kind:'directory', size:0, mtime:Date.now(), path:'/' };
      // 虚拟节点
      if (parts.length === 1 && parts[0] === 'mnt') return { name:'mnt', kind:'directory', size:0, mtime:Date.now(), virtual:true };
      if (parts.length === 2 && parts[0] === 'mnt' && parts[1] === 'local') return { name:'local', kind:'directory', size:0, mtime:Date.now(), virtual:true };
      const parent = parts.slice(0,-1);
      const name = parts[parts.length-1];
      const parentH = await walkOPFS(parent);
      // 先尝试目录
      try{
        const dh = await parentH.getDirectoryHandle(name);
        return { name, kind:'directory', size:0, mtime:Date.now(), path };
      }catch(e){}
      // 再尝试文件
      const fh = await parentH.getFileHandle(name);
      const f = await fh.getFile();
      return { name, kind:'file', size:f.size, mtime:f.lastModified, path };
    },
    async readdir(path){
      const parts = splitPath(path);
      // 根目录特殊处理：注入 /mnt
      if (parts.length === 0){
        const items = [];
        const seen = new Set();
        for await (const [name, h] of opfsRoot.entries()){
          seen.add(name);
          if (h.kind === 'directory'){
            items.push({ name, kind:'directory', size:0, mtime:Date.now() });
          } else {
            const f = await h.getFile();
            items.push({ name, kind:'file', size:f.size, mtime:f.lastModified });
          }
        }
        if (!seen.has('mnt')){
          items.push({ name:'mnt', kind:'directory', size:0, mtime:Date.now(), virtual:true });
        }
        return items;
      }
      if (parts[0]==='mnt' && parts.length===1){
        return [{ name:'local', kind:'directory', size:0, mtime:Date.now(), virtual:true }];
      }
      if (parts[0]==='mnt' && parts[1]==='local' && parts.length===2){
        const items = [];
        for (const [name] of mounts){
          items.push({ name, kind:'directory', size:0, mtime:Date.now(), mounted:true });
        }
        return items;
      }
      const h = await walkOPFS(parts);
      const items = [];
      for await (const [name, handle] of h.entries()){
        if (handle.kind === 'directory'){
          items.push({ name, kind:'directory', size:0, mtime:Date.now() });
        } else {
          const f = await handle.getFile();
          items.push({ name, kind:'file', size:f.size, mtime:f.lastModified });
        }
      }
      return items;
    },
    async readFile(path){
      const parts = splitPath(path);
      const parent = parts.slice(0,-1);
      const name = parts[parts.length-1];
      const parentH = await walkOPFS(parent);
      const fh = await parentH.getFileHandle(name);
      return await fh.getFile();
    },
    async writeFile(path, data){
      const parts = splitPath(path);
      const parent = parts.slice(0,-1);
      const name = parts[parts.length-1];
      let parentH = opfsRoot;
      for (const seg of parent){
        parentH = await parentH.getDirectoryHandle(seg, { create:true });
      }
      const fh = await parentH.getFileHandle(name, { create:true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
    },
    async mkdir(path){
      const parts = splitPath(path);
      let h = opfsRoot;
      for (const seg of parts){
        h = await h.getDirectoryHandle(seg, { create:true });
      }
    },
    async unlink(path){
      const parts = splitPath(path);
      const parent = parts.slice(0,-1);
      const name = parts[parts.length-1];
      const parentH = await walkOPFS(parent);
      try { await parentH.removeEntry(name); } catch(e){ await parentH.removeEntry(name, {recursive:true}); }
    },
    async rmdir(path){
      const parts = splitPath(path);
      const parent = parts.slice(0,-1);
      const name = parts[parts.length-1];
      const parentH = await walkOPFS(parent);
      await parentH.removeEntry(name, { recursive:true });
    },
    async rename(oldPath, newPath){
      const file = await opfsBackend.readFile(oldPath);
      const buf = await file.arrayBuffer();
      await opfsBackend.writeFile(newPath, buf);
      await opfsBackend.unlink(oldPath);
    },
    async exists(path){
      try { await opfsBackend.stat(path); return true; } catch(e){ return false; }
    },
  };

  /* --- 本地文件夹挂载后端 --- */
  function localBackend(mount){
    async function walkLocal(parts){
      let h = mount.dirHandle;
      for (const seg of parts){
        h = await h.getDirectoryHandle(seg);
      }
      return h;
    }
    return {
      async stat(path, _isLstat, cb){
        try{
          const parts = splitPath(path);
          if (parts.length === 0) return { name:mount.name, kind:'directory', size:0, mtime:Date.now() };
          const parent = parts.slice(0,-1);
          const name = parts[parts.length-1];
          const parentH = await walkLocal(parent);
          try{
            const dh = await parentH.getDirectoryHandle(name);
            return { name, kind:'directory', size:0, mtime:Date.now(), mounted:true };
          }catch(e){}
          const fh = await parentH.getFileHandle(name);
          const f = await fh.getFile();
          return { name, kind:'file', size:f.size, mtime:f.lastModified, mounted:true };
        }catch(e){ throw e; }
      },
      async readdir(path){
        const parts = splitPath(path);
        const h = await walkLocal(parts);
        const items = [];
        for await (const [name, handle] of h.entries()){
          if (handle.kind === 'directory'){
            items.push({ name, kind:'directory', size:0, mtime:Date.now(), mounted:true });
          } else {
            const fh = await handle.getFile();
            items.push({ name, kind:'file', size:fh.size, mtime:fh.lastModified, mounted:true });
          }
        }
        return items;
      },
      async readFile(path){
        const parts = splitPath(path);
        const parent = parts.slice(0,-1);
        const name = parts[parts.length-1];
        const parentH = await walkLocal(parent);
        const fh = await parentH.getFileHandle(name);
        return await fh.getFile();
      },
      async writeFile(path, data){
        const parts = splitPath(path);
        const parent = parts.slice(0,-1);
        const name = parts[parts.length-1];
        let h = mount.dirHandle;
        for (const seg of parent){
          h = await h.getDirectoryHandle(seg, { create:true });
        }
        const fh = await h.getFileHandle(name, { create:true });
        const w = await fh.createWritable();
        await w.write(data);
        await w.close();
      },
      async mkdir(path){
        const parts = splitPath(path);
        let h = mount.dirHandle;
        for (const seg of parts){
          h = await h.getDirectoryHandle(seg, { create:true });
        }
      },
      async unlink(path){
        const parts = splitPath(path);
        const parent = parts.slice(0,-1);
        const name = parts[parts.length-1];
        const parentH = await walkLocal(parent);
        try { await parentH.removeEntry(name); } catch(e){ await parentH.removeEntry(name, {recursive:true}); }
      },
      async rmdir(path){
        const parts = splitPath(path);
        const parent = parts.slice(0,-1);
        const name = parts[parts.length-1];
        const parentH = await walkLocal(parent);
        await parentH.removeEntry(name, { recursive:true });
      },
      async rename(oldPath, newPath){
        const file = await this.readFile(oldPath);
        const buf = await file.arrayBuffer();
        await this.writeFile(newPath, buf);
        await this.unlink(oldPath);
      },
      async exists(path){
        try { await this.stat(path); return true; } catch(e){ return false; }
      },
    };
  }

  /* --- 路由器：根据路径选择后端 --- */
  function backendFor(path){
    const r = routeMount(path);
    if (r){
      // 如果 rest 为空，返回挂载点本身的信息（视为目录）
      const lb = localBackend(r.mount);
      // 重写：路径相对挂载根
      return { backend: lb, relPath: '/' + r.rest.join('/') || '/' };
    }
    // 如果是 /mnt 或 /mnt/local 本身，使用 OPFS 后端（虚拟节点）
    return { backend: opfsBackend, relPath: path };
  }

  /* --- 公共 API --- */
  const api = {
    async init(){
      try{
        opfsRoot = await navigator.storage.getDirectory();
        // 确保基础目录存在
        await opfsRoot.getDirectoryHandle('Documents', { create:true });
        await opfsRoot.getDirectoryHandle('Pictures', { create:true });
        await opfsRoot.getDirectoryHandle('Music', { create:true });
        return true;
      } catch(e){
        console.warn('OPFS 不可用，降级到内存文件系统', e);
        return false;
      }
    },
    async stat(path){
      const { backend, relPath } = backendFor(path);
      return backend.stat(relPath);
    },
    async readdir(path){
      const { backend, relPath } = backendFor(path);
      return backend.readdir(relPath);
    },
    async readFile(path){
      const { backend, relPath } = backendFor(path);
      return backend.readFile(relPath);
    },
    async writeFile(path, data){
      // 不能写入虚拟节点
      if (path === '/' || path === '/mnt' || path === '/mnt/local') throw new Error('Cannot write to virtual path');
      const { backend, relPath } = backendFor(path);
      return backend.writeFile(relPath, data);
    },
    async mkdir(path){
      const { backend, relPath } = backendFor(path);
      return backend.mkdir(relPath);
    },
    async unlink(path){
      const { backend, relPath } = backendFor(path);
      return backend.unlink(relPath);
    },
    async rmdir(path){
      const { backend, relPath } = backendFor(path);
      return backend.rmdir(relPath);
    },
    async rename(oldPath, newPath){
      // 跨后端 rename：复制+删除
      const a = backendFor(oldPath), b = backendFor(newPath);
      if (a.backend === b.backend){
        return a.backend.rename(a.relPath, b.relPath);
      }
      const file = await api.readFile(oldPath);
      const buf = await file.arrayBuffer();
      await api.writeFile(newPath, buf);
      await api.unlink(oldPath);
    },
    async exists(path){
      try { await api.stat(path); return true; } catch(e){ return false; }
    },
    async mountLocal(dirHandle){
      const name = (dirHandle.name || 'local').replace(/[^a-zA-Z0-9_\-\u4e00-\u9fa5]/g,'_');
      let finalName = name;
      let i = 1;
      while (mounts.has(finalName)) finalName = name + '_' + (i++);
      mounts.set(finalName, { name: finalName, dirHandle });
      // 持久化挂载信息（不含 handle，刷新后需重新授权）
      STORE.push('mounts', { name: finalName, displayName: dirHandle.name });
      return finalName;
    },
    unmountLocal(name){
      mounts.delete(name);
      STORE.removeWhere('mounts', m => m.name === name);
    },
    listMounts(){
      return [...mounts.values()].map(m => ({ name: m.name, active:true }));
    },
    getSavedMounts(){
      return STORE.all('mounts') || [];
    },
    async reset(){
      mounts.clear();
      STORE.clear();
      // 清空 OPFS
      for await (const [name] of opfsRoot.entries()){
        await opfsRoot.removeEntry(name, { recursive:true });
      }
      await opfsRoot.getDirectoryHandle('Documents', { create:true });
      await opfsRoot.getDirectoryHandle('Pictures', { create:true });
      await opfsRoot.getDirectoryHandle('Music', { create:true });
    },
    splitPath, joinPath, parentPath, baseName, MOUNT_ROOT,
  };
  return api;
})();

/* ========== 3. STORE — IndexedDB + localStorage 降级 ========== */
const STORE = (() => {
  let db = null;
  const DB_NAME = 'codex-os';
  const STORES = ['meta','icons','wallpaper','settings','mounts','clipboard'];
  const mem = {}; // 内存降级

  async function init(){
    if (!('indexedDB' in window)) return false;
    return new Promise((resolve) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id', autoIncrement:true }); });
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(true); };
      req.onerror = () => resolve(false);
    });
  }

  function tx(store, mode='readonly'){
    return db.transaction(store, mode).objectStore(store);
  }

  return {
    async init(){ return init(); },
    all(store){
      if (!db){ return mem[store] || []; }
      return new Promise((resolve) => {
        const r = tx(store).getAll();
        r.onsuccess = () => resolve(r.result || []);
        r.onerror = () => resolve([]);
      });
    },
    push(store, item){
      if (!db){ (mem[store]=mem[store]||[]).push({...item, id: Date.now()+Math.random()}); return Promise.resolve(); }
      return new Promise((resolve) => {
        const r = tx(store,'readwrite').add(item);
        r.onsuccess = () => resolve();
        r.onerror = () => resolve();
      });
    },
    put(store, item){
      if (!db){
        const arr = mem[store] = mem[store] || [];
        const i = arr.findIndex(x => x.id === item.id);
        if (i >= 0) arr[i] = item; else arr.push(item);
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        const r = tx(store,'readwrite').put(item);
        r.onsuccess = () => resolve();
        r.onerror = () => resolve();
      });
    },
    removeWhere(store, predicate){
      return this.all(store).then(items => {
        items.filter(predicate).forEach(it => this.remove(store, it.id));
      });
    },
    remove(store, id){
      if (!db){ if (mem[store]) mem[store] = mem[store].filter(x=>x.id!==id); return Promise.resolve(); }
      return new Promise((resolve) => {
        const r = tx(store,'readwrite').delete(id);
        r.onsuccess = () => resolve();
        r.onerror = () => resolve();
      });
    },
    clear(){
      if (!db){ Object.keys(mem).forEach(k=>delete mem[k]); return Promise.resolve(); }
      return new Promise((resolve) => {
        const t = db.transaction(STORES,'readwrite');
        STORES.forEach(s => t.objectStore(s).clear());
        t.oncomplete = () => resolve();
        t.onerror = () => resolve();
      });
    },
    getOne(store, predicate){
      return this.all(store).then(items => items.find(predicate));
    },
  };
})();

/* ========== 4. WM — 窗口管理器 ========== */
const WM = (() => {
  let zTop = 100;
  let activeId = null;
  const wins = new Map();
  const container = document.createElement('div');
  container.id = 'win-container';
  container.style.cssText = 'position:fixed; inset:0; z-index:100; pointer-events:none;';
  container.style.pointerEvents = 'none';
  document.body.appendChild(container);

  function focus(id){
    const w = wins.get(id); if (!w) return;
    zTop += 2;
    w.el.style.zIndex = zTop;
    wins.forEach((v,k) => v.el.classList.toggle('focused', k===id));
    activeId = id;
    renderTaskbar();
  }

  function createWindow({ title, icon, body, w=640, h=420, x, y, onclose, appKey, singleton }){
    if (singleton){
      for (const [id, w2] of wins){
        if (w2.appKey === singleton){
          focus(id);
          if (w2.minimized){ restore(id); }
          return w2;
        }
      }
    }
    const id = 'w_' + Math.random().toString(36).slice(2);
    const vw = window.innerWidth, vh = window.innerHeight;
    if (x == null) x = Math.max(20, Math.floor((vw - w)/2 + (wins.size*20)%120 - 60));
    if (y == null) y = Math.max(20, Math.floor((vh - h)/2 - 40 + (wins.size*20)%100 - 50));
    x = Math.min(x, vw - 120);
    y = Math.min(y, vh - 120);
    // 移动端最大化
    const isMobile = vw < 720;
    if (isMobile){ x = 4; y = 4; w = vw - 8; h = vh - 70; }

    const el = document.createElement('div');
    el.className = 'window';
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px; pointer-events:auto;`;
    el.innerHTML = `
      <div class="win-title">
        <span class="wt-icon">${icon || ICONS.file}</span>
        <span class="wt-text"></span>
        <div class="wt-btns">
          <button class="wb-min" title="最小化">${ICONS.minimize}</button>
          <button class="wb-max" title="最大化">${ICONS.maximize}</button>
          <button class="wb-close" title="关闭">${ICONS.close}</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-handle n"></div><div class="win-handle s"></div>
      <div class="win-handle e"></div><div class="win-handle w"></div>
      <div class="win-handle ne"></div><div class="win-handle nw"></div>
      <div class="win-handle se"></div><div class="win-handle sw"></div>
    `;
    el.querySelector('.wt-text').textContent = title;
    el.querySelector('.win-body').appendChild(body);

    container.appendChild(el);
    const win = { id, el, title, icon, minimized:false, maximized:false, appKey, prev:null, onclose };
    wins.set(id, win);

    // 事件
    el.addEventListener('pointerdown', () => focus(id));
    el.querySelector('.wb-close').addEventListener('click', () => closeWindow(id));
    el.querySelector('.wb-min').addEventListener('click', () => minimize(id));
    el.querySelector('.wb-max').addEventListener('click', () => toggleMax(id));

    // 双击标题栏最大化
    const titleEl = el.querySelector('.win-title');
    titleEl.addEventListener('dblclick', (e) => {
      if (e.target.closest('.wt-btns')) return;
      toggleMax(id);
    });

    // 拖拽
    enableDrag(id, titleEl);
    // 调整大小
    el.querySelectorAll('.win-handle').forEach(h => enableResize(id, h));

    focus(id);
    renderTaskbar();
    return win;
  }

  function enableDrag(id, handle){
    let sx, sy, ox, oy, dragging=false;
    const onDown = (e) => {
      if (e.target.closest('.wt-btns')) return;
      const w = wins.get(id); if (w.maximized) return;
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(w.el.style.left); oy = parseFloat(w.el.style.top);
      e.preventDefault();
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };
    const onMove = (e) => {
      if (!dragging) return;
      const w = wins.get(id);
      const dx = e.clientX - sx, dy = e.clientY - sy;
      w.el.style.left = (ox + dx) + 'px';
      w.el.style.top = Math.max(0, oy + dy) + 'px';
    };
    const onUp = () => {
      dragging = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    };
    handle.addEventListener('pointerdown', onDown);
  }

  function enableResize(id, handle){
    const dir = [...handle.classList].find(c => c !== 'win-handle');
    let sx, sy, sw, sh, sl, st, active=false;
    const onDown = (e) => {
      const w = wins.get(id); if (w.maximized) return;
      active = true;
      sx = e.clientX; sy = e.clientY;
      sw = w.el.offsetWidth; sh = w.el.offsetHeight;
      sl = parseFloat(w.el.style.left); st = parseFloat(w.el.style.top);
      e.preventDefault(); e.stopPropagation();
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };
    const onMove = (e) => {
      if (!active) return;
      const w = wins.get(id);
      const dx = e.clientX - sx, dy = e.clientY - sy;
      let nw = sw, nh = sh, nl = sl, nt = st;
      if (dir.includes('e')) nw = Math.max(260, sw + dx);
      if (dir.includes('s')) nh = Math.max(180, sh + dy);
      if (dir.includes('w')){ nw = Math.max(260, sw - dx); nl = sl + (sw - nw); }
      if (dir.includes('n')){ nh = Math.max(180, sh - dy); nt = st + (sh - nh); }
      w.el.style.width = nw+'px'; w.el.style.height = nh+'px';
      w.el.style.left = nl+'px'; w.el.style.top = Math.max(0, nt)+'px';
    };
    const onUp = () => {
      active = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    };
    handle.addEventListener('pointerdown', onDown);
  }

  function minimize(id){
    const w = wins.get(id); if (!w) return;
    w.minimized = true;
    w.el.classList.add('minimized');
    renderTaskbar();
  }
  function restore(id){
    const w = wins.get(id); if (!w) return;
    w.minimized = false;
    w.el.classList.remove('minimized');
    focus(id);
  }
  function toggleMax(id){
    const w = wins.get(id); if (!w) return;
    if (w.maximized){
      w.maximized = false;
      w.el.classList.remove('maximized');
      if (w.prev){
        w.el.style.left = w.prev.l; w.el.style.top = w.prev.t;
        w.el.style.width = w.prev.w; w.el.style.height = w.prev.h;
      }
    } else {
      w.prev = { l:w.el.style.left, t:w.el.style.top, w:w.el.style.width, h:w.el.style.height };
      w.maximized = true;
      w.el.classList.add('maximized');
      w.el.style.left = '0px'; w.el.style.top = '0px';
      w.el.style.width = '100vw'; w.el.style.height = 'calc(100vh - 60px)';
    }
  }
  function closeWindow(id){
    const w = wins.get(id); if (!w) return;
    if (w.onclose) try { w.onclose(); } catch(e){}
    w.el.remove();
    wins.delete(id);
    renderTaskbar();
  }

  function setTitle(id, title){
    const w = wins.get(id); if (!w) return;
    w.title = title;
    w.el.querySelector('.wt-text').textContent = title;
    renderTaskbar();
  }

  function renderTaskbar(){
    const tl = document.getElementById('task-list');
    tl.innerHTML = '';
    for (const [id, w] of wins){
      const b = document.createElement('button');
      b.className = 'task-item' + (id===activeId && !w.minimized ? ' active' : '');
      b.innerHTML = `<span class="ti-ic">${w.icon || ICONS.file}</span><span class="ti-txt">${w.title}</span>`;
      b.addEventListener('click', () => {
        if (w.minimized) restore(id);
        else if (id === activeId) minimize(id);
        else focus(id);
      });
      tl.appendChild(b);
    }
  }

  return { createWindow, closeWindow, focus, minimize, restore, toggleMax, setTitle, all:() => wins };
})();

/* ========== 5. 通知 ========== */
function notify(msg, timeout=3000){
  const n = document.getElementById('notify');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  n.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, timeout);
}

/* ========== 6. 对话框 ========== */
function dialog({ title, body, buttons }){
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'dlg-backdrop';
    back.innerHTML = `
      <div class="dlg">
        <div class="dlg-head"></div>
        <div class="dlg-body"></div>
        <div class="dlg-foot"></div>
      </div>`;
    back.querySelector('.dlg-head').textContent = title;
    const bodyEl = back.querySelector('.dlg-body');
    if (typeof body === 'string') bodyEl.innerHTML = body;
    else bodyEl.appendChild(body);
    const foot = back.querySelector('.dlg-foot');
    (buttons || [{ label:'确定', val:true }]).forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.primary ? '' : ' ghost') + (b.danger ? ' danger' : '');
      btn.textContent = b.label;
      btn.addEventListener('click', () => { close(b.val); });
      foot.appendChild(btn);
    });
    function close(val){
      back.remove();
      resolve(val);
    }
    back.addEventListener('click', (e) => { if (e.target === back) close(null); });
    document.body.appendChild(back);
  });
}

function promptDialog(title, defaultVal=''){
  const b = document.createElement('div');
  b.innerHTML = `<p style="margin-bottom:8px">${title}</p><input class="inp" style="width:100%" value="${defaultVal.replace(/"/g,'&quot;')}" />`;
  const inp = b.querySelector('input');
  setTimeout(()=>{ inp.focus(); inp.select(); }, 50);
  return dialog({
    title: 'Codex 提示',
    body: b,
    buttons: [
      { label:'取消', val:null },
      { label:'确定', val:'__ok__', primary:true },
    ]
  }).then(r => r === '__ok__' ? inp.value : null);
}

function confirmDialog(title, msg){
  return dialog({
    title,
    body: `<p>${msg}</p>`,
    buttons: [
      { label:'取消', val:false },
      { label:'确定', val:true, primary:true, danger:true },
    ]
  });
}

/* ========== 7. 右键菜单 ========== */
let activeMenu = null;
function ctxMenu(x, y, items){
  if (activeMenu) activeMenu.remove();
  const m = document.createElement('div');
  m.className = 'ctx-menu';
  items.forEach(it => {
    if (it.sep){ const s = document.createElement('div'); s.className='ctx-sep'; m.appendChild(s); return; }
    const el = document.createElement('div');
    el.className = 'ctx-item' + (it.danger ? ' danger' : '');
    el.innerHTML = `<span class="ci-ic">${it.icon || ''}</span><span>${it.label}</span>${it.kbd?`<span class="ci-k">${it.kbd}</span>`:''}`;
    if (it.disabled){ el.style.opacity = '.4'; el.style.pointerEvents='none'; }
    else el.addEventListener('click', () => { m.remove(); activeMenu=null; it.action && it.action(); });
    m.appendChild(el);
  });
  document.body.appendChild(m);
  // 位置修正
  const vw = window.innerWidth, vh = window.innerHeight;
  const r = m.getBoundingClientRect();
  if (x + r.width > vw) x = vw - r.width - 8;
  if (y + r.height > vh) y = vh - r.height - 8;
  m.style.left = Math.max(4, x) + 'px';
  m.style.top = Math.max(4, y) + 'px';
  activeMenu = m;
}
document.addEventListener('click', () => { if (activeMenu){ activeMenu.remove(); activeMenu=null; } });

/* ========== 8. 桌面 ========== */
const DESKTOP = (() => {
  const iconLayer = document.getElementById('icon-layer');
  const desktop = document.getElementById('desktop');
  const selBox = document.getElementById('sel-box');
  const dragCache = new Map(); // path -> { blob, url }
  let icons = []; // { id, path, name, kind, x, y }
  let selected = new Set();
  let lastTouchTap = 0;

  const GRID = 92;

  async function loadIcons(){
    const saved = await STORE.all('icons');
    icons = saved.map(s => ({ ...s }));
  }

  async function saveIcon(ic){
    await STORE.put('icons', ic);
  }

  async function refreshIcons(){
    // 从根目录读取实际文件，与保存的位置合并
    const rootItems = await FS.readdir('/').catch(()=>[]);
    const existing = new Map(icons.map(i => [i.path, i]));
    // 添加新项（在根目录但不在图标列表中的）
    for (const it of rootItems){
      const path = '/' + it.name;
      if (!existing.has(path)){
        // 找一个空位
        const pos = findFreeSlot();
        const ic = { id: 'ic_'+Math.random().toString(36).slice(2), path, name: it.name, kind: it.kind, x: pos.x, y: pos.y };
        icons.push(ic);
        await saveIcon(ic);
      }
    }
    // 移除不存在的
    const rootNames = new Set(rootItems.map(i => '/' + i.name));
    const toRemove = icons.filter(i => i.path !== '/' && !rootNames.has(i.path) && !i.path.startsWith('/mnt'));
    for (const ic of toRemove){
      await STORE.remove('icons', ic.id);
      icons = icons.filter(i => i.id !== ic.id);
    }
    renderIcons();
  }

  function findFreeSlot(){
    const W = iconLayer.clientWidth, H = iconLayer.clientHeight;
    const cols = Math.max(1, Math.floor(W / GRID));
    const rows = Math.max(1, Math.floor(H / GRID));
    const used = new Set(icons.map(i => `${Math.round(i.x/GRID)},${Math.round(i.y/GRID)}`));
    for (let c = 0; c < cols; c++){
      for (let r = 0; r < rows; r++){
        if (!used.has(`${c},${r}`)) return { x: c * GRID, y: r * GRID };
      }
    }
    return { x: 0, y: 0 };
  }

  function renderIcons(){
    iconLayer.innerHTML = '';
    icons.forEach(ic => {
      const el = document.createElement('div');
      el.className = 'desktop-icon' + (selected.has(ic.id) ? ' selected' : '');
      el.style.left = ic.x + 'px';
      el.style.top = ic.y + 'px';
      el.dataset.id = ic.id;
      el.dataset.path = ic.path;
      el.draggable = true;
      el.style.touchAction = 'none';
      const iconSvg = ic.kind === 'directory' ? ICONS.folder : iconForName(ic.name);
      el.innerHTML = `<div class="ic">${iconSvg}</div><div class="lbl"></div>`;
      el.querySelector('.lbl').textContent = ic.name;
      attachIconEvents(el, ic);
      iconLayer.appendChild(el);
    });
  }

  function attachIconEvents(el, ic){
    // 单击选择（只在选择时，不干扰拖拽）
    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return; // 触摸走专门的触摸逻辑
      if (!e.shiftKey && !e.ctrlKey && !e.metaKey){
        selected.clear();
      }
      selected.add(ic.id);
      renderIcons();
    });
    // 预加载拖拽缓存（mouseenter 时异步加载，确保 dragstart 同步读取）
    el.addEventListener('mouseenter', () => {
      if (ic.kind === 'file' && !dragCache.has(ic.path)){
        FS.readFile(ic.path).then(blob => {
          const url = URL.createObjectURL(blob);
          dragCache.set(ic.path, { blob, url, t:Date.now() });
        }).catch(()=>{});
      }
    });
    // 双击打开
    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      openItem(ic.path, ic.kind);
    });
    // 触摸支持：单击选择 + 双击打开 + 长按拖拽
    let touchStart = 0, touchMoved = false, touchX = 0, touchY = 0;
    let longPressTimer = null, touchDragging = false, ghostEl = null;
    el.addEventListener('touchstart', (e) => {
      touchStart = Date.now();
      touchMoved = false;
      touchDragging = false;
      const t = e.touches[0];
      touchX = t.clientX; touchY = t.clientY;
      // 长按触发拖拽
      longPressTimer = setTimeout(() => {
        touchDragging = true;
        if (!selected.has(ic.id)){ selected.clear(); selected.add(ic.id); renderIcons(); }
        ghostEl = el.cloneNode(true);
        ghostEl.style.cssText = `position:fixed; pointer-events:none; opacity:0.7; z-index:10000; left:${t.clientX-40}px; top:${t.clientY-40}px; width:80px;`;
        document.body.appendChild(ghostEl);
        el.classList.add('dragging');
      }, 400);
    }, { passive:true });
    el.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      const dx = t.clientX - touchX, dy = t.clientY - touchY;
      if (Math.hypot(dx, dy) > 6) touchMoved = true;
      if (touchDragging && ghostEl){
        ghostEl.style.left = (t.clientX - 40) + 'px';
        ghostEl.style.top = (t.clientY - 40) + 'px';
        e.preventDefault();
      } else if (touchMoved && !touchDragging){
        clearTimeout(longPressTimer);
      }
    }, { passive:false });
    el.addEventListener('touchend', async (e) => {
      clearTimeout(longPressTimer);
      if (touchDragging){
        el.classList.remove('dragging');
        // 检查放下位置（先隐藏 ghost 避免干扰）
        const t = e.changedTouches[0];
        if (ghostEl) ghostEl.style.display = 'none';
        const target = document.elementFromPoint(t.clientX, t.clientY);
        if (ghostEl){ ghostEl.remove(); ghostEl = null; }
        if (target){
          const folderEl = target.closest('.desktop-icon');
          if (folderEl && folderEl !== el){
            const targetPath = folderEl.dataset.path;
            const targetIc = icons.find(i => i.path === targetPath);
            if (targetIc && targetIc.kind === 'directory'){
              try{
                await FS.rename(ic.path, targetPath + '/' + ic.name);
                await refreshIcons();
              }catch(err){ notify(err.message); }
              return;
            }
          }
          // 否则移动到新位置
          const rect = iconLayer.getBoundingClientRect();
          const nx = t.clientX - rect.left;
          const ny = t.clientY - rect.top;
          ic.x = Math.max(0, Math.round(nx/GRID - 0.5) * GRID);
          ic.y = Math.max(0, Math.round(ny/GRID - 0.5) * GRID);
          await saveIcon(ic);
          renderIcons();
        }
        return;
      }
      const now = Date.now();
      if (!touchMoved && now - lastTouchTap < 300){
        lastTouchTap = 0;
        openItem(ic.path, ic.kind);
      } else if (!touchMoved){
        lastTouchTap = now;
        selected.clear();
        selected.add(ic.id);
        renderIcons();
      }
    });
    // 右键菜单
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!selected.has(ic.id)){
        selected.clear();
        selected.add(ic.id);
        renderIcons();
      }
      ctxMenu(e.clientX, e.clientY, [
        { label:'打开', icon: ICONS.open, action:() => openItem(ic.path, ic.kind) },
        { sep:true },
        { label:'重命名', icon: ICONS.rename, action: async () => {
          const newName = await promptDialog('请输入新名称', ic.name);
          if (newName && newName !== ic.name){
            try {
              await FS.rename(ic.path, FS.parentPath(ic.path) + '/' + newName);
              ic.name = newName;
              ic.path = FS.parentPath(ic.path) + '/' + newName;
              await saveIcon(ic);
              renderIcons();
            } catch(e){ notify('重命名失败: ' + e.message); }
          }
        } },
        { label:'删除', icon: ICONS.trash, danger:true, action: async () => {
          const ok = await confirmDialog('删除确认', `确定删除 "${ic.name}" 吗？`);
          if (ok){
            try {
              const s = await FS.stat(ic.path);
              if (s.kind === 'directory') await FS.rmdir(ic.path);
              else await FS.unlink(ic.path);
              await STORE.remove('icons', ic.id);
              icons = icons.filter(i => i.id !== ic.id);
              renderIcons();
            } catch(e){ notify('删除失败: ' + e.message); }
          }
        } },
        { sep:true },
        { label:'导出到本地', icon: ICONS.download, action:() => downloadItem(ic.path) },
        { label:'文件信息', icon: ICONS.info, action: async () => {
          const s = await FS.stat(ic.path);
          dialog({
            title:'文件信息',
            body: `<p><b>名称：</b>${ic.name}</p><p><b>路径：</b>${ic.path}</p><p><b>类型：</b>${s.kind}</p><p><b>大小：</b>${formatSize(s.size)}</p><p><b>修改时间：</b>${new Date(s.mtime).toLocaleString()}</p>`,
            buttons:[{ label:'确定', val:true, primary:true }]
          });
        } },
      ]);
    });

    // 原生拖拽（内部移动 + 拖出浏览器）。严格同步：dragstart 禁止 async/await。
    el.addEventListener('dragstart', (e) => {
      el.classList.add('dragging');
      e.dataTransfer.setData('application/x-codex-path', ic.path);
      e.dataTransfer.setData('application/x-codex-kind', ic.kind);
      e.dataTransfer.effectAllowed = 'copyMove';
      const cached = dragCache.get(ic.path);
      if (cached && ic.kind === 'file'){
        try{
          const file = new File([cached.blob], ic.name, { type: mimeOf(ic.name) });
          e.dataTransfer.items.add(file);
          e.dataTransfer.setData('DownloadURL', `${mimeOf(ic.name)}:${ic.name}:${cached.url}`);
        }catch(err){}
      } else if (ic.kind === 'file'){
        // 同步触发一次异步加载，但 setData 已完成不会锁空
        FS.readFile(ic.path).then(blob => {
          const url = URL.createObjectURL(blob);
          dragCache.set(ic.path, { blob, url, t:Date.now() });
        }).catch(()=>{});
      }
      setTimeout(() => {
        for (const [k, v] of dragCache){
          if (Date.now() - v.t > 6000){ URL.revokeObjectURL(v.url); dragCache.delete(k); }
        }
      }, 6000);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); });
    // 拖入文件夹图标
    if (ic.kind === 'directory'){
      el.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('application/x-codex-path') || e.dataTransfer.types.includes('Files')){
          e.preventDefault();
          e.stopPropagation();
          el.classList.add('drop-target');
        }
      });
      el.addEventListener('dragleave', () => { el.classList.remove('drop-target'); });
      el.addEventListener('drop', async (e) => {
        e.preventDefault(); e.stopPropagation();
        el.classList.remove('drop-target');
        const srcPath = e.dataTransfer.getData('application/x-codex-path');
        if (srcPath && srcPath !== ic.path){
          // 移动文件到目标目录
          try{
            const newName = FS.baseName(srcPath);
            const newPath = ic.path + '/' + newName;
            await FS.rename(srcPath, newPath);
            notify(`已移动 ${newName}`);
            await refreshIcons();
          }catch(err){ notify('移动失败: ' + err.message); }
        } else if (e.dataTransfer.files.length){
          // 拖入外部文件到文件夹
          await importFilesTo(e.dataTransfer.files, ic.path);
          notify('导入完成');
        }
      });
    }
  }

  // 桌面空白区域：点击取消选择、框选、拖放定位、右键菜单
  let isSelBox = false, sbx0, sby0, sbxDragging=false;
  let dragInternal = null; // { el, ic, sx, sy, ox, oy }

  desktop.addEventListener('click', (e) => {
    if (e.target === desktop){
      selected.clear();
      renderIcons();
    }
  });

  desktop.addEventListener('contextmenu', (e) => {
    if (e.target !== desktop) return;
    e.preventDefault();
    ctxMenu(e.clientX, e.clientY, [
      { label:'刷新桌面', icon: ICONS.refresh, action: () => refreshIcons() },
      { sep:true },
      { label:'新建文件夹', icon: ICONS.folderNew, action: async () => {
        const name = await promptDialog('文件夹名称', '新建文件夹');
        if (name){
          try{
            await FS.mkdir('/' + name);
            await refreshIcons();
          }catch(err){ notify('创建失败: ' + err.message); }
        }
      } },
      { label:'新建文本文档', icon: ICONS.fileText, action: async () => {
        const name = await promptDialog('文件名', '新文档.txt');
        if (name){
          try{
            await FS.writeFile('/' + name, '');
            await refreshIcons();
          }catch(err){ notify('创建失败: ' + err.message); }
        }
      } },
      { label:'上传文件…', icon: ICONS.upload, action: () => uploadFilesToRoot() },
      { label:'挂载本地文件夹…', icon: ICONS.mount, action: mountLocalFolder },
      { sep:true },
      { label:'更换壁纸…', icon: ICONS.wallpaper, action: () => APPS.settings() },
      { label: document.fullscreenElement ? '退出全屏' : '进入全屏', icon: ICONS.fullscreen, action: toggleFullscreen },
      { sep:true },
      { label:'系统设置', icon: ICONS.appSettings, action: () => APPS.settings() },
    ]);
  });

  // 桌面 drop：放置图标到新位置 / 放置外部文件
  desktop.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  desktop.addEventListener('drop', async (e) => {
    e.preventDefault();
    const srcPath = e.dataTransfer.getData('application/x-codex-path');
    const rect = iconLayer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if (srcPath){
      // 内部移动：更新坐标
      const ic = icons.find(i => i.path === srcPath);
      if (ic){
        ic.x = Math.max(0, Math.round(x/GRID - 0.5) * GRID);
        ic.y = Math.max(0, Math.round(y/GRID - 0.5) * GRID);
        await saveIcon(ic);
        renderIcons();
      }
    } else if (e.dataTransfer.items && e.dataTransfer.items.length){
      // 外部文件导入
      const entries = [];
      for (let i = 0; i < e.dataTransfer.items.length; i++){
        const item = e.dataTransfer.items[i];
        const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
        if (entry) entries.push(entry);
      }
      if (entries.length){
        for (const ent of entries){
          await importEntry(ent, '/');
        }
        notify('导入完成');
        await refreshIcons();
      } else if (e.dataTransfer.files.length){
        await importFilesTo(e.dataTransfer.files, '/');
        notify('导入完成');
        await refreshIcons();
      }
    }
  });

  // 框选
  desktop.addEventListener('pointerdown', (e) => {
    if (e.target !== desktop) return;
    isSelBox = true;
    sbx0 = e.clientX; sby0 = e.clientY;
    sbxDragging = false;
    document.addEventListener('pointermove', sbMove);
    document.addEventListener('pointerup', sbUp);
  });
  function sbMove(e){
    if (!isSelBox) return;
    const dx = e.clientX - sbx0, dy = e.clientY - sby0;
    if (!sbxDragging && Math.hypot(dx,dy) < 4) return;
    sbxDragging = true;
    const x = Math.min(sbx0, e.clientX), y = Math.min(sby0, e.clientY);
    const w = Math.abs(dx), h = Math.abs(dy);
    selBox.style.display = 'block';
    selBox.style.left = x+'px'; selBox.style.top = y+'px';
    selBox.style.width = w+'px'; selBox.style.height = h+'px';
    // 选择被框住的图标
    selected.clear();
    const r1 = { x, y, w, h };
    icons.forEach(ic => {
      const rect = iconLayer.getBoundingClientRect();
      const ix = rect.left + ic.x + 44;
      const iy = rect.top + ic.y + 44;
      if (ix > r1.x && ix < r1.x + r1.w && iy > r1.y && iy < r1.y + r1.h){
        selected.add(ic.id);
      }
    });
    renderIcons();
  }
  function sbUp(){
    isSelBox = false;
    selBox.style.display = 'none';
    document.removeEventListener('pointermove', sbMove);
    document.removeEventListener('pointerup', sbUp);
  }

  /* --- 导入文件 --- */
  async function importEntry(entry, targetDir){
    if (entry.isFile){
      await new Promise((res) => {
        entry.file(async (f) => {
          try{
            const buf = await f.arrayBuffer();
            await FS.writeFile(targetDir + '/' + f.name, buf);
          }catch(e){ notify('导入失败: ' + f.name); }
          res();
        });
      });
    } else if (entry.isDirectory){
      await FS.mkdir(targetDir + '/' + entry.name);
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => new Promise(res => reader.readEntries(entries => res(entries)));
      let batch = await readBatch();
      while (batch.length){
        all.push(...batch);
        batch = await readBatch();
      }
      for (const ch of all){
        await importEntry(ch, targetDir + '/' + entry.name);
      }
    }
  }

  async function importFilesTo(files, targetDir){
    for (const f of files){
      const buf = await f.arrayBuffer();
      await FS.writeFile(targetDir + '/' + f.name, buf);
    }
  }

  function uploadFilesToRoot(){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.multiple = true;
    inp.addEventListener('change', async () => {
      await importFilesTo(inp.files, '/');
      notify('导入完成');
      await refreshIcons();
    });
    inp.click();
  }

  async function mountLocalFolder(){
    if (!('showDirectoryPicker' in window)){
      notify('此浏览器不支持 File System Access API');
      return;
    }
    try{
      const dirHandle = await window.showDirectoryPicker({ mode:'readwrite' });
      const name = await FS.mountLocal(dirHandle);
      notify(`已挂载：${name}`);
      await refreshIcons();
    }catch(e){
      if (e.name !== 'AbortError') notify('挂载失败: ' + e.message);
    }
  }

  function toggleFullscreen(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }

  return {
    async init(){
      await loadIcons();
      await refreshIcons();
      // 重新挂载提醒
      const savedMounts = FS.getSavedMounts();
      if (savedMounts.length){
        setTimeout(() => {
          dialog({
            title:'重新挂载本地文件夹',
            body: `<p>检测到上次使用的 ${savedMounts.length} 个本地文件夹挂载点。由于浏览器安全策略，刷新后需要重新授权。</p><p>是否现在重新挂载？</p>`,
            buttons:[
              { label:'稍后', val:false },
              { label:'重新挂载', val:true, primary:true },
            ]
          }).then(async (ok) => {
            if (!ok) return;
            for (const m of savedMounts){
              try{
                const h = await window.showDirectoryPicker({ mode:'readwrite' });
                await FS.mountLocal(h);
              }catch(e){}
            }
            await refreshIcons();
          });
        }, 1500);
      }
    },
    refresh: refreshIcons,
    uploadFilesToRoot,
    mountLocalFolder,
    toggleFullscreen,
  };
})();

/* ========== 9. 打开项目调度 ========== */
async function openItem(path, kind){
  if (kind === undefined){
    try{
      const s = await FS.stat(path);
      kind = s.kind;
    }catch(e){ notify('无法打开: ' + path); return; }
  }
  if (kind === 'directory'){
    APPS.explorer(path);
    return;
  }
  // 文件：按 MIME 分派
  const name = FS.baseName(path);
  const mime = mimeOf(name);
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (isImageMime(mime)) APPS.viewer(path, 'image');
  else if (isAudioMime(mime)) APPS.viewer(path, 'audio');
  else if (isVideoMime(mime)) APPS.viewer(path, 'video');
  else if (mime === 'application/pdf') APPS.viewer(path, 'pdf');
  else if (ext === 'html' || ext === 'htm') APPS.htmlEditor(path);
  else if (ext === 'csv' || ext === 'tsv') APPS.spreadsheet(path);
  else if (ext === 'zip' || ext === 'gz' || ext === 'tgz') APPS.zipHandler(path);
  else if (isTextMime(mime) || ['py','c','cpp','java','sh','ts','tsx','jsx','yaml','yml','ini','cfg','log','md','txt','json','xml','css','js','mjs'].includes(ext)){
    APPS.notepad(path);
  } else {
    // 未知：提供选择
    dialog({
      title: '打开方式',
      body: `<p>文件 <b>${name}</b> 的类型未识别 (${mime})。</p><p>请选择操作：</p>`,
      buttons:[
        { label:'取消', val:null },
        { label:'以文本打开', val:'text' },
        { label:'导出到本地', val:'export' },
      ]
    }).then(v => {
      if (v === 'text') APPS.notepad(path);
      else if (v === 'export') downloadItem(path);
    });
  }
}

async function downloadItem(path){
  try{
    const blob = await FS.readFile(path);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = FS.baseName(path);
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(e){ notify('下载失败: ' + e.message); }
}

function formatSize(bytes){
  if (bytes == null) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}

/* ========== 10. APPS ========== */
const APPS = {};

/* ---------- 文件资源管理器 ---------- */
APPS.explorer = (startPath = '/') => {
  const body = document.createElement('div');
  body.className = 'fe';
  body.innerHTML = `
    <div class="fe-side">
      <h4>快速访问</h4>
      <div class="fe-side-item" data-path="/">${ICONS.home}<span>根目录</span></div>
      <div class="fe-side-item" data-path="/Documents">${ICONS.folder}<span>Documents</span></div>
      <div class="fe-side-item" data-path="/Pictures">${ICONS.folder}<span>Pictures</span></div>
      <div class="fe-side-item" data-path="/Music">${ICONS.folder}<span>Music</span></div>
      <h4>挂载</h4>
      <div class="fe-side-item" data-path="/mnt/local">${ICONS.mount}<span>本地文件夹</span></div>
      <div class="fe-mount-btn" style="padding:4px 10px">
        <button class="btn ghost" style="width:100%; font-size:10px">${ICONS.plus} 挂载</button>
      </div>
    </div>
    <div class="fe-main">
      <div class="fe-toolbar">
        <button class="fe-back" title="后退">${ICONS.arrowLeft}</button>
        <button class="fe-fwd" title="前进">${ICONS.arrowRight}</button>
        <button class="fe-up" title="上级">${ICONS.arrowUp}</button>
        <button class="fe-home" title="根">${ICONS.home}</button>
        <button class="fe-refresh" title="刷新">${ICONS.refresh}</button>
        <div class="fe-bc"></div>
        <input class="fe-search" placeholder="搜索…" />
        <button class="fe-view-mode" title="切换视图">${ICONS.grid}</button>
      </div>
      <div class="fe-view">
        <div class="fe-header">
          <span class="fh-col fh-name">名称</span>
          <span class="fh-col type">类型</span>
          <span class="fh-col size">大小</span>
          <span class="fh-col date">修改日期</span>
        </div>
        <div class="fe-list"></div>
      </div>
      <div class="fe-status"><span class="st-count"></span><span class="st-sel"></span></div>
    </div>`;

  let currentPath = startPath;
  const history = [startPath];
  let histIdx = 0;
  let sortKey = 'name', sortDir = 1;
  let viewMode = 'grid';
  let selected = new Set();

  const list = body.querySelector('.fe-list');
  const bc = body.querySelector('.fe-bc');
  const status = body.querySelector('.st-count');
  const statusSel = body.querySelector('.st-sel');

  async function navigate(p, pushHist=true){
    currentPath = p;
    if (pushHist){
      history.splice(histIdx+1);
      history.push(p);
      histIdx = history.length - 1;
    }
    await render();
  }

  async function render(){
    list.innerHTML = '';
    bc.innerHTML = '';
    const parts = FS.splitPath(currentPath);
    const crumbRoot = document.createElement('span');
    crumbRoot.textContent = '⌂ 根';
    crumbRoot.addEventListener('click', () => navigate('/'));
    bc.appendChild(crumbRoot);
    let acc = '';
    parts.forEach((p, i) => {
      acc += '/' + p;
      const sep = document.createElement('span'); sep.className='sep'; sep.textContent=' › ';
      bc.appendChild(sep);
      const sp = document.createElement('span');
      sp.textContent = p;
      const target = acc;
      sp.addEventListener('click', () => navigate(target));
      bc.appendChild(sp);
    });

    try{
      let items = await FS.readdir(currentPath);
      // 搜索过滤
      const q = body.querySelector('.fe-search').value.toLowerCase().trim();
      if (q) items = items.filter(i => i.name.toLowerCase().includes(q));
      // 排序
      items.sort((a,b) => {
        if (a.kind !== b.kind) return a.kind === 'directory' ? -1 : 1;
        let va, vb;
        if (sortKey === 'name'){ va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
        else if (sortKey === 'type'){ va = (a.name.split('.').pop()||'').toLowerCase(); vb = (b.name.split('.').pop()||'').toLowerCase(); }
        else if (sortKey === 'size'){ va = a.size || 0; vb = b.size || 0; }
        else if (sortKey === 'date'){ va = a.mtime || 0; vb = b.mtime || 0; }
        if (va < vb) return -1 * sortDir;
        if (va > vb) return 1 * sortDir;
        return 0;
      });

      if (items.length === 0){
        list.innerHTML = `<div class="fe-empty"><div style="font-size:48px; opacity:.3">${ICONS.folder}</div><div>此文件夹为空</div></div>`;
      } else {
        items.forEach(it => {
          const full = currentPath === '/' ? '/' + it.name : currentPath + '/' + it.name;
          const el = document.createElement('div');
          el.className = 'fe-item';
          el.dataset.path = full;
          el.dataset.kind = it.kind;
          const icon = it.kind === 'directory' ? ICONS.folder : iconForName(it.name);
          const typeStr = it.kind === 'directory' ? '文件夹' : (it.name.split('.').pop()||'').toUpperCase();
          el.innerHTML = `
            <div class="ic">${icon}</div>
            <div class="lbl"></div>
            <div class="meta">
              <span class="type">${typeStr}</span>
              <span class="size">${it.kind==='directory' ? '—' : formatSize(it.size)}</span>
              <span class="date">${new Date(it.mtime).toLocaleDateString()}</span>
            </div>`;
          el.querySelector('.lbl').textContent = it.name;
          el.addEventListener('click', (e) => {
            if (!e.shiftKey && !e.ctrlKey && !e.metaKey) selected.clear();
            selected.add(full);
            updateSel();
          });
          el.addEventListener('dblclick', () => openItem(full, it.kind));
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (!selected.has(full)){ selected.clear(); selected.add(full); updateSel(); }
            ctxMenu(e.clientX, e.clientY, [
              { label:'打开', icon:ICONS.open, action:() => openItem(full, it.kind) },
              { sep:true },
              { label:'重命名', icon:ICONS.rename, action: async () => {
                const nn = await promptDialog('新名称', it.name);
                if (nn && nn !== it.name){
                  try{
                    await FS.rename(full, currentPath + '/' + nn);
                    await render();
                  }catch(err){ notify('失败: '+err.message); }
                }
              } },
              { label:'删除', icon:ICONS.trash, danger:true, action: async () => {
                const ok = await confirmDialog('删除', `删除 ${it.name}？`);
                if (ok){
                  try{
                    if (it.kind === 'directory') await FS.rmdir(full);
                    else await FS.unlink(full);
                    await render();
                  }catch(err){ notify('失败: '+err.message); }
                }
              } },
              { sep:true },
              { label:'导出到本地', icon:ICONS.download, action: () => downloadItem(full) },
            ]);
          });
          list.appendChild(el);
        });
      }
      status.textContent = `${items.length} 项`;
      updateSel();
    }catch(e){
      list.innerHTML = `<div class="fe-empty">无法访问此位置<br><small style="font-family:var(--font-m)">${e.message}</small></div>`;
    }
  }

  function updateSel(){
    list.querySelectorAll('.fe-item').forEach(el => {
      el.classList.toggle('selected', selected.has(el.dataset.path));
    });
    statusSel.textContent = selected.size ? ` · 已选 ${selected.size} 项` : '';
  }

  // 工具栏事件
  body.querySelector('.fe-back').addEventListener('click', () => {
    if (histIdx > 0){ histIdx--; navigate(history[histIdx], false); }
  });
  body.querySelector('.fe-fwd').addEventListener('click', () => {
    if (histIdx < history.length-1){ histIdx++; navigate(history[histIdx], false); }
  });
  body.querySelector('.fe-up').addEventListener('click', () => {
    if (currentPath !== '/') navigate(FS.parentPath(currentPath));
  });
  body.querySelector('.fe-home').addEventListener('click', () => navigate('/'));
  body.querySelector('.fe-refresh').addEventListener('click', render);
  body.querySelector('.fe-search').addEventListener('input', render);
  body.querySelector('.fe-view-mode').addEventListener('click', () => {
    viewMode = viewMode === 'grid' ? 'list' : 'grid';
    list.classList.toggle('list-view', viewMode === 'list');
    body.querySelector('.fe-view').classList.toggle('list-mode', viewMode === 'list');
    body.querySelector('.fe-view-mode').innerHTML = viewMode === 'grid' ? ICONS.grid : ICONS.list;
  });
  // 列头排序
  body.querySelectorAll('.fh-col').forEach(col => {
    col.addEventListener('click', () => {
      const k = col.classList.contains('type') ? 'type' : col.classList.contains('size') ? 'size' : col.classList.contains('date') ? 'date' : 'name';
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = 1; }
      render();
    });
  });

  // 侧边栏
  body.querySelectorAll('.fe-side-item').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.path));
  });
  body.querySelector('.fe-mount-btn button').addEventListener('click', DESKTOP.mountLocalFolder);

  // 视图区空白右键 / drop
  const view = body.querySelector('.fe-view');
  view.addEventListener('contextmenu', async (e) => {
    if (e.target.closest('.fe-item')) return;
    e.preventDefault();
    ctxMenu(e.clientX, e.clientY, [
      { label:'新建文件夹', icon:ICONS.folderNew, action: async () => {
        const n = await promptDialog('文件夹名', '新建文件夹');
        if (n){ try{ await FS.mkdir(currentPath + '/' + n); await render(); }catch(e){ notify(e.message); } }
      } },
      { label:'新建文本文档', icon:ICONS.fileText, action: async () => {
        const n = await promptDialog('文件名', '新文档.txt');
        if (n){ try{ await FS.writeFile(currentPath + '/' + n, ''); await render(); }catch(e){ notify(e.message); } }
      } },
      { label:'上传文件…', icon:ICONS.upload, action: () => {
        const inp = document.createElement('input'); inp.type='file'; inp.multiple=true;
        inp.addEventListener('change', async () => {
          for (const f of inp.files){
            const buf = await f.arrayBuffer();
            await FS.writeFile(currentPath + '/' + f.name, buf);
          }
          await render();
        });
        inp.click();
      } },
      { sep:true },
      { label:'粘贴', icon:ICONS.paste, action: () => pasteFromClipboard(currentPath).then(render) },
    ]);
  });
  view.addEventListener('dragover', (e) => { e.preventDefault(); });
  view.addEventListener('drop', async (e) => {
    e.preventDefault();
    const src = e.dataTransfer.getData('application/x-codex-path');
    if (src){
      try{
        await FS.rename(src, currentPath + '/' + FS.baseName(src));
        await render();
        await DESKTOP.refresh();
      }catch(err){ notify(err.message); }
    } else if (e.dataTransfer.files.length){
      for (const f of e.dataTransfer.files){
        const buf = await f.arrayBuffer();
        await FS.writeFile(currentPath + '/' + f.name, buf);
      }
      await render();
    }
  });

  WM.createWindow({ title: '文件资源管理器', icon: ICONS.appExplorer, body, w:780, h:480, appKey:'explorer' });
  render();
};

/* ---------- 剪贴板 ---------- */
const clipboard = { op:null, paths:[] };
async function pasteFromClipboard(targetDir){
  if (!clipboard.paths.length) return;
  for (const p of clipboard.paths){
    try{
      const newPath = targetDir + '/' + FS.baseName(p);
      if (clipboard.op === 'cut') await FS.rename(p, newPath);
      else {
        const blob = await FS.readFile(p);
        const buf = await blob.arrayBuffer();
        await FS.writeFile(newPath, buf);
      }
    }catch(e){}
  }
  if (clipboard.op === 'cut') clipboard.paths = [];
  notify('粘贴完成');
}

APPS.spreadsheet = async (path) => {
  const body = document.createElement('div');
  body.className = 'ss';
  body.innerHTML = `
    <div class="ss-toolbar">
      <div class="ss-tabs">
        <button class="active" data-v="table">表格视图</button>
        <button data-v="text">文本视图</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn ghost" data-act="save">${ICONS.save} 保存</button>
      <span style="font-family:var(--font-m); font-size:11px; color:var(--ink-mute)"></span>
    </div>
    <div class="ss-body"></div>`;
  const ssbody = body.querySelector('.ss-body');
  const blob = await FS.readFile(path);
  const text = await blob.text();
  const ext = (path.split('.').pop() || '').toLowerCase();
  const sep = ext === 'tsv' ? '\t' : ',';
  let data = parseCSV(text, sep);
  let view = 'table';

  function parseCSV(t, s){
    const rows = [];
    t.split(/\r?\n/).forEach(line => {
      if (!line && rows.length === 0) return;
      // 简单 CSV 解析（支持引号）
      const cells = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++){
        const c = line[i];
        if (c === '"'){
          if (inQ && line[i+1] === '"'){ cur+='"'; i++; }
          else inQ = !inQ;
        } else if (c === s && !inQ){
          cells.push(cur); cur = '';
        } else cur += c;
      }
      cells.push(cur);
      if (cells.length > 1 || cells[0] !== '') rows.push(cells);
    });
    return rows;
  }
  function stringifyCSV(d){
    return d.map(r => r.map(c => {
      if (c == null) return '';
      const s = String(c);
      if (s.includes(sep) || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"';
      return s;
    }).join(sep)).join('\n');
  }

  function renderTable(){
    ssbody.innerHTML = '';
    const tbl = document.createElement('table');
    tbl.className = 'ss-table';
    data.forEach((row, ri) => {
      const tr = document.createElement('tr');
      row.forEach((cell, ci) => {
        const td = document.createElement(ri === 0 ? 'th' : 'td');
        td.textContent = cell;
        if (ri > 0){
          td.contentEditable = 'true';
          td.addEventListener('input', () => {
            data[ri][ci] = td.textContent;
          });
        }
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    ssbody.appendChild(tbl);
  }
  function renderText(){
    ssbody.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'ss-text';
    ta.value = stringifyCSV(data);
    ta.addEventListener('input', () => {
      data = parseCSV(ta.value, sep);
    });
    ssbody.appendChild(ta);
  }

  body.querySelectorAll('.ss-tabs button').forEach(b => {
    b.addEventListener('click', () => {
      body.querySelectorAll('.ss-tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      view = b.dataset.v;
      if (view === 'table') renderTable(); else renderText();
    });
  });
  body.querySelector('[data-act=save]').addEventListener('click', async () => {
    try{
      await FS.writeFile(path, stringifyCSV(data));
      notify('已保存');
    }catch(e){ notify(e.message); }
  });

  WM.createWindow({ title: FS.baseName(path) + ' — 表格', icon: ICONS.fileTable, body, w:700, h:460, appKey:'ss_'+path, singleton:'ss_'+path });
  renderTable();
};

APPS.calc = () => {
  const body = document.createElement('div');
  body.className = 'calc';
  body.innerHTML = `
    <div class="calc-disp">

      <div class="cur">0</div>
    </div>
    <div class="calc-keys">
      <button class="fn" data-k="C">C</button>
      <button class="fn" data-k="CE">CE</button>
      <button class="fn" data-k="back">⌫</button>
      <button class="op" data-k="/">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="op" data-k="*">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button class="op" data-k="-">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button class="op" data-k="+">+</button>
      <button class="span2" data-k="0">0</button>
      <button data-k=".">.</button>
      <button class="op" data-k="=">=</button>
    </div>`;
  let cur = '0', prev = '', op = null, fresh = true;
  const curEl = body.querySelector('.cur'), prevEl = body.querySelector('.prev');
  function update(){ curEl.textContent = cur; prevEl.textContent = prev + (op?` ${op}`:''); }
  function press(k){
    if (/[0-9]/.test(k)){
      if (cur === '0' || fresh){ cur = k; fresh = false; }
      else cur += k;
    } else if (k === '.'){
      if (!cur.includes('.')) cur += '.';
      fresh = false;
    } else if (k === 'C'){
      cur = '0'; prev = ''; op = null; fresh = true;
    } else if (k === 'CE'){
      cur = '0'; fresh = true;
    } else if (k === 'back'){
      cur = cur.length > 1 ? cur.slice(0,-1) : '0';
    } else if ('+-*/'.includes(k)){
      if (op && !fresh){
        cur = String(calc(parseFloat(prev), parseFloat(cur), op));
      }
      prev = cur; op = k; fresh = true;
    } else if (k === '='){
      if (op){
        cur = String(calc(parseFloat(prev), parseFloat(cur), op));
        op = null; prev = ''; fresh = true;
      }
    }
    update();
  }
  function calc(a,b,o){
    switch(o){ case '+': return a+b; case '-': return a-b; case '*': return a*b; case '/': return b===0?0:a/b; }
  }
  body.querySelectorAll('.calc-keys button').forEach(b => b.addEventListener('click', () => press(b.dataset.k)));
  WM.createWindow({ title:'计算器', icon: ICONS.appCalc, body, w:300, h:420, appKey:'calc' });
};

APPS.paint = () => {
  const body = document.createElement('div');
  body.className = 'pt';
  body.innerHTML = `
    <div class="pt-toolbar">
      <button class="tool active" data-t="brush" title="画笔">${ICONS.brush}</button>
      <button class="tool" data-t="line" title="直线">${ICONS.line}</button>
      <button class="tool" data-t="rect" title="矩形">${ICONS.rect}</button>
      <button class="tool" data-t="circle" title="圆">${ICONS.circle}</button>
      <button class="tool" data-t="eraser" title="橡皮">${ICONS.eraser}</button>
      <input type="color" class="inp" value="#1f1a14" style="width:30px; height:30px; padding:2px" />
      <input type="range" min="1" max="40" value="3" style="width:80px" />
      <span class="pt-size" style="font-family:var(--font-m); font-size:11px">3px</span>
      <span style="flex:1"></span>
      <button class="btn ghost" data-act="clear">清空</button>
      <button class="btn" data-act="save">${ICONS.save} 保存</button>
    </div>
    <div class="pt-canvas-wrap"><canvas class="pt-canvas" width="800" height="500"></canvas></div>`;
  const canvas = body.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let tool = 'brush', color = '#1f1a14', size = 3;
  let drawing = false, sx = 0, sy = 0, snapshot = null;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (canvas.width / r.width);
    const y = (e.clientY - r.top) * (canvas.height / r.height);
    return { x, y };
  }
  const down = (e) => {
    e.preventDefault();
    drawing = true;
    const p = pos(e.touches ? e.touches[0] : e);
    sx = p.x; sy = p.y;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
    ctx.lineWidth = tool === 'eraser' ? size*3 : size;
    if (tool === 'brush' || tool === 'eraser'){
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy); ctx.stroke();
    } else {
      snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);
    }
  };
  const move = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e.touches ? e.touches[0] : e);
    if (tool === 'brush' || tool === 'eraser'){
      ctx.lineTo(p.x, p.y); ctx.stroke();
    } else if (tool === 'line'){
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); ctx.stroke();
    } else if (tool === 'rect'){
      ctx.putImageData(snapshot, 0, 0);
      ctx.strokeRect(sx, sy, p.x-sx, p.y-sy);
    } else if (tool === 'circle'){
      ctx.putImageData(snapshot, 0, 0);
      const r = Math.hypot(p.x-sx, p.y-sy);
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.stroke();
    }
  };
  const up = () => { drawing = false; };
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointerleave', up);

  body.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => {
    body.querySelectorAll('.tool').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    tool = b.dataset.t;
  }));
  body.querySelector('input[type=color]').addEventListener('input', e => color = e.target.value);
  const sizeInput = body.querySelector('input[type=range]');
  sizeInput.addEventListener('input', e => { size = +e.target.value; body.querySelector('.pt-size').textContent = size+'px'; });
  body.querySelector('[data-act=clear]').addEventListener('click', () => {
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  });
  body.querySelector('[data-act=save]').addEventListener('click', async () => {
    const name = await promptDialog('文件名', `画板_${Date.now()}.png`);
    if (!name) return;
    canvas.toBlob(async (blob) => {
      const buf = await blob.arrayBuffer();
      await FS.writeFile('/' + name, buf);
      await DESKTOP.refresh();
      notify('已保存');
    });
  });
  WM.createWindow({ title:'画板', icon: ICONS.appPaint, body, w:880, h:600, appKey:'paint' });
};

/* ---------- ZIP 处理 ---------- */
APPS.zipHandler = async (path) => {
  const name = FS.baseName(path);
  const ext = (name.split('.').pop()||'').toLowerCase();
  if (ext === 'zip' && typeof JSZip !== 'undefined'){
    const blob = await FS.readFile(path);
    const buf = await blob.arrayBuffer();
    try{
      const zip = await JSZip.loadAsync(buf);
      const targetDir = FS.parentPath(path) + '/' + name.replace(/\.zip$/i, '');
      try{ await FS.mkdir(targetDir); }catch(e){}
      let count = 0;
      const promises = [];
      zip.forEach((relPath, entry) => {
        if (entry.dir){
          promises.push(FS.mkdir(targetDir + '/' + relPath.replace(/\/$/,'')).catch(()=>{}));
        } else {
          promises.push(entry.async('arraybuffer').then(async (ab) => {
            await FS.writeFile(targetDir + '/' + relPath, ab);
            count++;
          }));
        }
      });
      await Promise.all(promises);
      notify(`解压完成：${count} 个文件`);
      await DESKTOP.refresh();
      APPS.explorer(targetDir);
    }catch(e){ notify('解压失败: '+e.message); }
  } else if (ext === 'gz' || ext === 'tgz'){
    // 使用浏览器原生 DecompressionStream（.gz 单文件）
    const blob = await FS.readFile(path);
    try{
      const ds = new DecompressionStream('gzip');
      const stream = blob.stream().pipeThrough(ds);
      const decomp = await new Response(stream).blob();
      const outName = name.replace(/\.gz$/i,'').replace(/\.tgz$/i,'.tar');
      const buf = await decomp.arrayBuffer();
      await FS.writeFile(FS.parentPath(path) + '/' + outName, buf);
      notify('解压完成');
      await DESKTOP.refresh();
    }catch(e){ notify('解压失败: '+e.message); }
  } else {
    notify('暂不支持此压缩格式: ' + ext);
  }
};

  async function renderStorage(){
    main.innerHTML = `
      <h2>存储</h2>
      <div class="sub">— 空间使用 · Storage Usage —</div>
      <div class="st-section">
        <h3>OPFS 使用情况</h3>

    // 查询存储
    let quota = null;
    try{
      if (navigator.storage && navigator.storage.estimate){
        quota = await navigator.storage.estimate();
      }
    }catch(e){}
    const info = main.querySelector('#st-info');
    const bar = main.querySelector('#st-bar');
    const detail = main.querySelector('#st-detail');
    if (quota){
      const used = quota.usage || 0, total = quota.quota || 0;
      const pct = total ? (used / total * 100) : 0;
      info.innerHTML = `已用 <b>${formatSize(used)}</b> / 可用 <b>${formatSize(total)}</b>`;
      bar.style.width = pct + '%';
      detail.textContent = `占比 ${pct.toFixed(4)}%`;
    } else {
      info.textContent = '无法获取存储配额信息';
    }
    // 遍历 OPFS 文件
    const files = [];
    async function walk(path){
      try{
        const items = await FS.readdir(path);
        for (const it of items){
          const fp = path === '/' ? '/' + it.name : path + '/' + it.name;
          if (it.kind === 'file'){
            files.push({ path:fp, size:it.size||0 });
          } else if (!it.virtual && !it.mounted && path.split('/').length < 4){
            await walk(fp);
          }
        }
      }catch(e){}
    }
    await walk('/');
    files.sort((a,b) => b.size - a.size);
    const fl = main.querySelector('#st-files');
    if (files.length === 0) fl.innerHTML = '<i>暂无文件</i>';
    else fl.innerHTML = files.slice(0,30).map(f => `<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--line)"><span>${f.path}</span><span>${formatSize(f.size)}</span></div>`).join('');

    main.querySelector('#st-reset').addEventListener('click', async () => {
      const ok = await confirmDialog('危险操作', '确定清除所有数据并重置系统吗？此操作不可撤销！');
      if (ok){
        await FS.reset();
        localStorage.clear();
        location.reload();
      }
    });
  }

/* ---------- v86 虚拟机 ---------- */
APPS.vm = () => {
  const body = document.createElement('div');
  body.style.cssText = 'display:flex; flex-direction:column; height:100%; background:#111';
  body.innerHTML = `
    <div style="padding:6px 8px; background:var(--paper-warm); border-bottom:1px solid var(--line); font-family:var(--font-m); font-size:11px; display:flex; gap:6px; align-items:center">
      <b>v86 模拟器</b>
      <span style="color:var(--ink-faint); margin-left:8px">请在下方输入公开可用的 ISO 镜像 URL（本地镜像请选择文件）</span>
      <span style="flex:1"></span>
      <input class="inp" placeholder="https://...iso" style="width:240px" />
      <button class="btn" data-act="load-url">启动</button>
      <button class="btn ghost" data-act="load-file">选择本地 ISO</button>
      <button class="btn danger" data-act="stop">停止</button>
    </div>
    <div style="flex:1; overflow:auto; padding:10px; display:flex; align-items:center; justify-content:center">
      <div id="v86-screen" style="background:#000; color:#ccc; font-family:monospace; padding:10px; min-width:720px; min-height:400px; white-space:pre">
        <div style="white-space:pre; font-family:monospace; font-size:14px"></div>
        <canvas style="display:block"></canvas>
      </div>
    </div>
    <div style="padding:4px 8px; background:var(--paper-warm); border-top:1px solid var(--line); font-family:var(--font-m); font-size:10px; color:var(--ink-mute)">
      提示：出于安全限制，不允许直接通过代码 URL 加载外部 ISO。请选择本地文件或使用同源 URL。
    </div>`;
  const screen = body.querySelector('#v86-screen');
  let emulator = null;

  function start(cfg){
    if (typeof V86 === 'undefined' && typeof V86Starter === 'undefined'){
      notify('v86 库未加载');
      return;
    }
    screen.innerHTML = '<div style="white-space:pre; font-family:monospace; font-size:14px"></div><canvas style="display:block"></canvas>';
    const Starter = (typeof V86Starter !== 'undefined') ? V86Starter : V86;
    emulator = new Starter({
      wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
      bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin' },
      vga_bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin' },
      screen_container: screen,
      memory_size: 128,
      vga_memory_size: 8,
      autostart: true,
      ...cfg,
    });
  }
  body.querySelector('[data-act=load-url]').addEventListener('click', () => {
    const u = body.querySelector('input').value.trim();
    if (!u){ notify('请输入 URL'); return; }
    const ext = (u.split('.').pop()||'').toLowerCase();
    const cfg = {};
    if (ext === 'iso') cfg.cdrom = { url: u };
    else if (['img','fda','bin'].includes(ext)) cfg.fda = { url: u };
    else cfg.hda = { url: u };
    start(cfg);
  });
  body.querySelector('[data-act=load-file]').addEventListener('click', () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.iso,.img,.bin,.fda';
    inp.addEventListener('change', () => {
      const f = inp.files[0]; if (!f) return;
      const ext = (f.name.split('.').pop()||'').toLowerCase();
      const cfg = {};
      if (ext === 'iso') cfg.cdrom = { buffer: f };
      else if (['img','fda','bin'].includes(ext)) cfg.fda = { buffer: f };
      else cfg.hda = { buffer: f };
      // 注意：v86 期望 ArrayBuffer，File 也可
      const reader = new FileReader();
      reader.onload = () => {
        const ab = reader.result;
        if (ext === 'iso') cfg.cdrom = { buffer: ab };
        else if (['img','fda','bin'].includes(ext)) cfg.fda = { buffer: ab };
        else cfg.hda = { buffer: ab };
        start(cfg);
      };
      reader.readAsArrayBuffer(f);
    });
    inp.click();
  });
  body.querySelector('[data-act=stop]').addEventListener('click', () => {
    if (emulator){ try { emulator.stop(); emulator.destroy(); } catch(e){} emulator = null; }
    screen.innerHTML = '<div style="white-space:pre; font-family:monospace; font-size:14px"></div><canvas style="display:block"></canvas>';
  });
  WM.createWindow({ title:'v86 虚拟机', icon: ICONS.appTerminal, body, w:820, h:560, appKey:'vm', onclose: () => { if (emulator) try{emulator.stop();emulator.destroy();}catch(e){} } });
};

/* ---------- 壁纸应用 ---------- */
function applyWallpaper(idx){
  const d = document.getElementById('desktop');
  if (typeof idx === 'string' && idx.startsWith('custom:')){
    const path = idx.slice(7);
    FS.readFile(path).then(blob => {
      const url = URL.createObjectURL(blob);
      d.style.backgroundImage = `url(${url})`;
      d.classList.add('has-wallpaper');
    }).catch(()=>{});
    return;
  }
  const wps = [
    { css:'linear-gradient(135deg, #efe6cf 0%, #e8dcc0 100%)' },
    { css:'linear-gradient(135deg, #c84a2b 0%, #9a351d 60%, #1f1a14 100%)' },
    { css:'linear-gradient(135deg, #5a6f3a 0%, #3f4f26 70%, #1f1a14 100%)' },
    { css:'linear-gradient(135deg, #1f1a14 0%, #3a322a 50%, #1f1a14 100%)' },
    { css:'linear-gradient(135deg, #2a5560 0%, #1f1a14 100%)' },
    { css:'linear-gradient(135deg, #b8893c 0%, #efe6cf 100%)' },
  ];
  const w = wps[idx] || wps[0];
  d.style.backgroundImage = w.css;
  d.classList.remove('has-wallpaper');
}

/* ========== 12. 时钟 ========== */
function tickClock(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock-time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const wd = ['日','一','二','三','四','五','六'][now.getDay()];
  document.getElementById('clock-date').textContent = `${d} · 周${wd}`;
}
