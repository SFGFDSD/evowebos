const VM_CDN={wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',vga:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'};
function buildVM(){
  const st={emu:null,locked:false};
  const root=el('div','vm');
  root.innerHTML=`
  <div class="tb" style="background:#151b20;border-color:#232a31">
    <button class="tbtn" data-a="pick" style="color:#cfd6cd">${ICONS.disk}<span>选择镜像</span></button>
    <span class="img-n" style="font-size:12px;color:#9aa39b;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <span class="tsp"></span>
    <button class="tbtn" data-a="boot" style="color:#cfd6cd">${ICONS.power}<span>启动</span></button>
    <button class="tbtn" data-a="stop" style="color:#cfd6cd" disabled>${ICONS.close}<span>停止</span></button>
    <button class="tbtn" data-a="lock" style="color:#cfd6cd">${ICONS.lockM}<span>锁定鼠标</span></button>
    <button class="tbtn" data-a="cad" style="color:#cfd6cd">Ctrl+Alt+Del</button>
    <button class="tbtn" data-a="fs" style="color:#cfd6cd">${ICONS.expand}</button>
  </div>
  <div class="vm-screen">
    <div id="vmsc_${uid()}" style="white-space: pre; font: 14px monospace; background:#0c0f12"><canvas style="display: none"></canvas></div>
    <div class="vm-idle" style="position:absolute;inset:0;display:grid;place-items:center;color:#5f6b64;font-size:13px;pointer-events:none;text-align:center;padding:20px">
      <div><div style="margin-bottom:10px;display:flex;justify-content:center;color:#39424b"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>选择 .iso / .img / .bin 镜像后点击启动<br><span style="font-size:11px;color:#48524b">镜像需来自本地或虚拟文件系统，系统不会加载任何外部镜像地址</span></div>
    </div>
  </div>
  <div class="vm-note">规则：.iso 挂载为光驱 · .img/.bin 挂载为软驱 · 其余挂载为硬盘。按 Esc 可解除鼠标锁定。</div>`;
  const sc=$('[id^=vmsc_]',root);
  const inp=el('input');inp.type='file';inp.className='hidden';inp.accept='.iso,.img,.bin,.fda';root.appendChild(inp);
  let imgBuf=null,imgName='';
  inp.addEventListener('change',async()=>{
    const f=inp.files[0];if(!f)return;
    imgName=f.name;$('.img-n',root).textContent=f.name+' ('+fmtSize(f.size)+')';
    imgBuf=await f.arrayBuffer();
    ui.toast('镜像已载入，可以启动','ok');
  });
  function devFor(name){
    const e=extOf(name);
    if(e==='iso')return{cdrom:{buffer:imgBuf}};
    if(e==='img'||e==='fda'||e==='bin')return{fda:{buffer:imgBuf}};
    return{hda:{buffer:imgBuf}};
  }
  $$('[data-a]',root).forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==='pick')inp.click();
    if(a==='boot'){
      if(!imgBuf){ui.toast('请先选择镜像文件','warn');return}
      if(!window.V86){ui.toast('V86 引擎尚未加载完成（或加载失败），请稍候重试','err');return}
      if(st.emu){try{st.emu.destroy()}catch(e){} st.emu=null}
      $('.vm-idle',root).style.display='none';
      try{
        st.emu=new V86Starter({
          wasm_path:VM_CDN.wasm,
          memory_size:64*1024*1024,
          vga_memory_size:8*1024*1024,
          screen_container:sc,
          bios:{url:VM_CDN.bios},
          vga_bios:{url:VM_CDN.vga},
          autostart:true,
          ...devFor(imgName)
        });
        $$('[data-a=stop]',root).forEach(x=>x.disabled=false);
        ui.toast('虚拟机已启动','ok');
      }catch(e){ui.toast('启动失败：'+e.message,'err');$('.vm-idle',root).style.display='grid'}
    }
    if(a==='stop'&&st.emu){try{st.emu.stop()}catch(e){} ui.toast('已停止','ok')}
    if(a==='lock'&&st.emu){
      if(!st.locked){try{st.emu.lock_mouse()}catch(e){} st.locked=true;ui.toast('鼠标已锁定，按 Esc 释放','ok',2200)}
      else{try{st.emu.mouse_unlock()}catch(e){} st.locked=false}
    }
    if(a==='cad'&&st.emu){try{st.emu.keyboard_send_scancodes([0x1d,0x38,0x53,0xd3,0xb8,0x9d])}catch(e){}}
    if(a==='fs')root._win&&root._win.fullEl();
  });
  document.addEventListener('pointerlockchange',st._pl=()=>{if(!document.pointerLockElement)st.locked=false});
  return{el:root,cleanup(){document.removeEventListener('pointerlockchange',st._pl);if(st.emu){try{st.emu.destroy()}catch(e){}}}};
}

const SET_SECS=[['look','外观'],['desk','桌面'],['storage','存储'],['mounts','挂载'],['system','系统'],['about','关于']];
function buildSettings(sec){
  const root=el('div','set');
  root.innerHTML=`<nav class="set-nav">${SET_SECS.map(([id,n])=>`<div class="side-it${id===(sec||'look')?' on':''}" data-s="${id}"><span style="display:contents">${ICONS[{look:'theme',desk:'grid',storage:'disk',mounts:'mount',system:'appSettings',about:'info'}[id]]}</span><span>${n}</span></div>`).join('')}</nav><div class="set-sec"></div>`;
  const pane=$('.set-sec',root);
  function card(t,d,body){return`<div class="set-card"><h4>${t}</h4>${d?`<div class="d">${d}</div>`:''}${body||''}</div>`}
  function render(s){
    $$('.side-it',root).forEach(b=>b.classList.toggle('on',b.dataset.s===s));
    if(s==='look'){
      const t=document.documentElement.dataset.theme;
      pane.innerHTML=
        card('主题模式','白墙柠檬（浅色）与爱琴夜（深色）。',`<div class="set-row"><span class="lb">深色模式</span><span class="switch${t==='dark'?' on':''}" data-sw="theme"></span></div>`)+
        card('壁纸','内置四款手工壁纸，或上传自己的图片（保存到 /图片 并持久化）。',`<div class="wp-card">${WALLS.map(w=>`<div class="wp-th ${w.cls}" data-wp="${w.id}"><span>${w.name}</span></div>`).join('')}<button class="btn" data-a="wpup" style="height:68px">${ICONS.upload}<span>上传图片</span></button></div>`);
      bind();
    }
    if(s==='desk'){
      pane.innerHTML=
        card('图标布局',`桌面图标可自由拖放，开启对齐后会丝滑吸附到网格。`,
          `<div class="set-row"><span class="lb">网格对齐</span><span class="switch${store.get('snap',true)?' on':''}" data-sw="snap"></span></div>
           <div class="set-row"><span class="lb">图标尺寸<small>调整桌面图标大小</small></span><input type="range" min="70" max="120" value="${store.get('icsz',88)}" data-r="icsz" style="width:140px"></div>`)+
        card('显示',`控制文件系统中是否显示以 . 开头的隐藏条目。`,
          `<div class="set-row"><span class="lb">显示隐藏文件</span><span class="switch${store.get('showHidden',false)?' on':''}" data-sw="showHidden"></span></div>`);
      bind();
    }
    if(s==='storage'){
      pane.innerHTML=card('存储空间','浏览器为该站点分配的真实持久化配额（OPFS）。',
        `<div class="set-row"><span class="lb">已用 / 配额</span><span class="mono" style="font-family:var(--font-m);font-size:13px" id="stNum">…</span></div>
         <div class="sbar"><i id="stBar" style="width:0;background:var(--acc)"></i></div>
         <div class="set-row"><button class="btn" data-a="persist">${ICONS.disk}<span>请求持久化授权</span></button><button class="btn" data-a="zipbak">${ICONS.appZip}<span>备份为 Zip</span></button></div>`)+
        card('占用分布','按根目录统计的真实数据构成。',`<div id="stTree" class="d">统计中…</div><div class="slegend" id="stLeg"></div>`)+
        card('危险区','一键清空 OPFS 虚拟文件系统并恢复出厂设置。',`<button class="btn danger" data-a="reset">${ICONS.trash}<span>一键重置系统</span></button>`);
      bind();fillStorage();
    }
    if(s==='mounts'){
      const list=[...fs.mounts.entries()].map(([p,m])=>`<div class="set-row"><span class="lb">${ICONS.mount} /mnt/local/${esc(m.name)}<small>本地文件夹 · 与虚拟文件同等能力</small></span><button class="btn sm danger" data-un="${esc(p)}">卸载</button></div>`).join('')||'<div class="d">暂无挂载。挂载后，本地文件夹出现在 /mnt/local/ 下，享有与虚拟文件完全相同的能力。</div>';
      const pend=(window._pendMounts||[]).map((p,i)=>`<div class="set-row"><span class="lb">${ICONS.warn} ${esc(p.path.split('/').pop())}<small>刷新后需要重新授权</small></span><button class="btn sm pri" data-re="${i}">重新授权</button></div>`).join('');
      pane.innerHTML=card('本地文件夹挂载','通过 File System Access API 将电脑上的真实文件夹挂载进柠屿，与 OPFS 虚拟文件统一读写。',list+pend+`<div class="set-row" style="margin-top:6px"><button class="btn pri" data-a="mnt">${ICONS.mount}<span>挂载文件夹…</span></button></div>`);
      bind();
      $$('[data-un]',pane).forEach(b=>b.onclick=()=>fs.unmount(b.dataset.un).then(()=>render('mounts')));
      $$('[data-re]',pane).forEach(b=>b.onclick=async()=>{const p=window._pendMounts[+b.dataset.re];if(await fs.reauth(p.handle)){window._pendMounts.splice(+b.dataset.re,1);render('mounts')}});
    }
    if(s==='system'){
      const ck=document.cookie.match(/lemonisle_session=(\d+)/);
      pane.innerHTML=
        card('文件系统后端',`当前主后端与降级链路状态。`,
          `<div class="d">主后端：<b>${fs.backend()==='opfs'?'OPFS（Origin Private File System）':'内存 + IndexedDB（降级）'}</b><br>降级链路：OPFS → IndexedDB → 内存<br>会话 Cookie：${ck?new Date(+ck[1]).toLocaleString():'无'}</div>`)+
        card('行为',`一些影响全局交互的开关。`,
          `<div class="set-row"><span class="lb">触摸设备优先<small>触屏上禁用原生拖拽、改用触摸拖动</small></span><span class="switch${isTouch()?' on':''}" style="opacity:.6;pointer-events:none"></span></div>`);
      bind();
    }
    if(s==='about'){
      pane.innerHTML=card('关于柠屿',``,
        `<div style="display:flex;gap:14px;align-items:center"><span style="width:52px;height:52px;border-radius:14px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:0 0 auto">${ICONS.lemon.replace('<svg','<svg style="width:30px;height:30px"')}</span><div class="d"><b style="font-family:var(--font-d);font-size:16px;color:var(--ink)">柠屿 OS · Lemon Isle</b><br>版本 1.0 · 单文件 Web 桌面<br>存储：OPFS + IndexedDB + LocalStorage + Cookie<br>字体：Bricolage Grotesque / 站酷庆科黄油体 / 思源黑体 / JetBrains Mono<br>引擎：CodeMirror 5.65 · JSZip · js-beautify · V86 0.5.319</div></div>`);
      bind();
    }
    function bind(){
      $$('[data-sw]',pane).forEach(sw=>sw.onclick=async()=>{
        const k=sw.dataset.sw;
        if(k==='theme'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
        else{store.set(k,!store.get(k,false));if(k==='snap'||k==='showHidden'){desk.render();bus.emit('fs-change','/')}}
        render(s);
      });
      $$('[data-r]',pane).forEach(r=>r.oninput=()=>{store.set(r.dataset.r,+r.value);document.documentElement.style.setProperty('--icsz',r.value+'px');document.documentElement.style.setProperty('--icico',Math.round(r.value*0.59)+'px')});
      $$('[data-wp]',pane).forEach(w=>w.onclick=()=>{setWallpaper({t:'css',id:w.dataset.wp});render(s)});
      $$('[data-a]',pane).forEach(b=>b.onclick=async()=>{
        const a=b.dataset.a;
        if(a==='wpup')uploadWallpaper();
        if(a==='mnt')mountLocalFolder();
        if(a==='persist'){const ok=await fs.persist();ui.toast(ok?'已获得持久化授权':'浏览器拒绝了持久化请求','ok')}
        if(a==='zipbak'){try{ui.toast('正在打包备份…','info',20000);const b=await fs.exportZip();const u=URL.createObjectURL(b);const an=el('a');an.href=u;an.download='柠屿备份.zip';an.click();setTimeout(()=>URL.revokeObjectURL(u),8000)}catch(e){ui.toast('备份失败：'+e.message,'err')}}
        if(a==='reset'){
          if(!await ui.confirm('将清空 OPFS 中的全部文件、桌面布局与设置，恢复到出厂状态。确定继续吗？','一键重置'))return;
          try{await fs.resetAll()}catch(e){}
          location.reload();
        }
      });
    }
  }
  async function fillStorage(){
    try{
      const es=await fs.estimate();
      $('#stNum').textContent=`${fmtSize(es.usage)} / ${fmtSize(es.quota)}`;
      $('#stBar').style.width=(es.quota?Math.min(100,es.usage/es.quota*100):0).toFixed(2)+'%';
      const list=await fs.readdir('/');
      const rows=[];
      for(const it of list){if(it.isDirectory){const t=await fs.treeSize('/'+it.name);rows.push({n:it.name+'/',s:t.size})}else rows.push({n:it.name,s:it.size})}
      rows.sort((a,b)=>b.s-a.s);
      const total=rows.reduce((a,b)=>a+b.s,0)||1;
      const colors=['var(--acc)','var(--sea)','var(--olive)','var(--coral)','var(--slate)','var(--line2)'];
      $('#stTree').innerHTML=rows.slice(0,6).map((r,i)=>`${esc(r.n)} — ${fmtSize(r.s)}（${(r.s/total*100).toFixed(1)}%）<br>`).join('')||'空';
      $('#stLeg').innerHTML=rows.slice(0,6).map((r,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(r.n)}</span>`).join('');
    }catch(e){}
  }
  $$('.side-it',root).forEach(b=>b.onclick=()=>render(b.dataset.s));
  render(sec||'look');
  return{el:root};
}

/* ================= 启动 ================= */
(async function boot(){
  setTheme(store.get('theme','light'));
  const icsz=store.get('icsz',88);
  document.documentElement.style.setProperty('--icsz',icsz+'px');
  document.documentElement.style.setProperty('--icico',Math.round(icsz*0.59)+'px');
  await fs.ready;
  await seedFS();
  desk.load();
  await desk.ensureDefaults();
  await desk.render();
  await applyWallpaper();
  refreshStoragePill();
  try{
    const pending=await fs.restoreMounts();
    window._pendMounts=pending||[];
    if(window._pendMounts.length){
      bus.emit('mounts-change');
      setTimeout(async()=>{
        const r=await ui.dialog({title:'本地挂载待授权',text:`检测到 ${window._pendMounts.length} 个之前挂载的本地文件夹。浏览器刷新后需要重新授权，是否现在处理？（也可稍后在 设置 → 挂载 中操作）`,buttons:[{t:'稍后',v:false},{t:'现在授权',v:true,pri:true}]});
        if(r){for(const p of window._pendMounts){await fs.reauth(p.handle)}window._pendMounts=[]}
      },800);
    }
  }catch(e){}
  bus.on('fs-change',debounce(p=>{if(p==='/'||p==='')desk.render()},400));
})();
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('input,textarea,[contenteditable]'))return;
  if(!e.target.closest('#desk')&&!e.target.closest('.ex-list')&&!e.target.closest('.lrow'))e.preventDefault();
});
