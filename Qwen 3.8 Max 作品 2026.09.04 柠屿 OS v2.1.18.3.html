<style>
/* ========== 柠屿 OS 设计系统：爱琴白墙 × 柠檬 ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
--font-d:"Bricolage Grotesque","ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
--font-b:"Noto Sans SC","Bricolage Grotesque",sans-serif;
--font-m:"JetBrains Mono","Noto Sans SC",monospace;
--bg:#F4F2EA;--wall:#EDEAE0;--surface:#FFFFFF;--surface2:#F7F5EE;--field:#FBFAF5;
--ink:#212B22;--mut:#71806F;--faint:#A7B2A2;
--line:#E2DECF;--line2:#D3CEBA;
--acc:#E9BE00;--acc-ink:#241F04;--acc-soft:rgba(233,190,0,.16);
--sea:#2B6E9E;--sea-soft:rgba(43,110,158,.12);--olive:#7C9A3D;--coral:#D96B4A;--slate:#7C8794;
--danger:#C6473E;--ok:#4E9B62;
--hov:rgba(33,43,34,.055);--selbg:rgba(233,190,0,.20);
--sh-s:0 1px 2px rgba(30,35,25,.06),0 2px 8px rgba(30,35,25,.05);
--sh-m:0 4px 10px rgba(30,35,25,.08),0 12px 32px rgba(30,35,25,.10);
--sh-l:0 10px 24px rgba(25,30,20,.12),0 28px 70px rgba(25,30,20,.18);
--r-s:7px;--r-m:11px;--r-l:15px;
--taskh:52px;--icsz:88px;--icico:52px;
}
[data-theme="dark"]{
--bg:#12161A;--wall:#0E1216;--surface:#1A2026;--surface2:#151B20;--field:#12181D;
--ink:#EDEBE0;--mut:#96A29A;--faint:#5F6B64;
--line:#2A323A;--line2:#39434D;
--acc:#F0C400;--acc-ink:#241F04;--acc-soft:rgba(240,196,0,.15);
--sea:#5B9CC9;--sea-soft:rgba(91,156,201,.14);--olive:#9AB95F;--coral:#E08263;--slate:#8E99A6;
--danger:#D65A50;--ok:#63B078;
--hov:rgba(237,235,224,.07);--selbg:rgba(240,196,0,.20);
--sh-s:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
--sh-m:0 4px 10px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35);
--sh-l:0 10px 24px rgba(0,0,0,.45),0 28px 70px rgba(0,0,0,.5);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-b);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit;outline:none}
::selection{background:var(--acc-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hidden{display:none!important}
svg{display:block}
/* ---------- 壁纸层 ---------- */
#wall{position:fixed;inset:0;z-index:0;background:var(--wall);transition:opacity .4s}
#wall::after{content:"";position:absolute;inset:0;pointer-events:none}
.wp-santorini{background:
linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(43,110,158,.10) 56%,rgba(43,110,158,.30) 100%),
radial-gradient(120% 90% at 85% -10%,rgba(233,190,0,.20),rgba(233,190,0,0) 45%),
repeating-linear-gradient(90deg,rgba(43,110,158,.05) 0 2px,rgba(43,110,158,0) 2px 90px),
linear-gradient(180deg,#EAF1F4 0%,#F6F3E9 55%,#E7EEE9 100%)}
.wp-santorini::after{background:
linear-gradient(180deg,rgba(255,255,255,0) 55.5%,rgba(255,255,255,.25) 56%,rgba(255,255,255,0) 57%),
radial-gradient(140px 60px at 22% 62%,rgba(255,255,255,.85) 40%,rgba(255,255,255,0) 70%),
radial-gradient(180px 70px at 70% 58%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 72%)}
.wp-lemon{background:
radial-gradient(circle at 20px 20px,rgba(233,190,0,.18) 8px,rgba(233,190,0,0) 9px),
radial-gradient(circle at 70px 60px,rgba(124,154,61,.16) 6px,rgba(124,154,61,0) 7px),
radial-gradient(circle at 45px 95px,rgba(233,190,0,.12) 5px,rgba(233,190,0,0) 6px),
radial-gradient(circle at 95px 25px,rgba(43,110,158,.08) 4px,rgba(43,110,158,0) 5px),
linear-gradient(160deg,#F8F6EC,#EFEEE2 60%,#F3EFDD);background-size:120px 120px,120px 120px,120px 120px,120px 120px,100% 100%}
.wp-aegean{background:
radial-gradient(90% 60% at 78% 8%,rgba(240,196,0,.35),rgba(240,196,0,0) 55%),
repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 1px,rgba(255,255,255,0) 1px 26px),
linear-gradient(180deg,#F2EFE3 0%,#CFE0E6 34%,#5E93B8 62%,#2B6E9E 100%)}
[data-theme="dark"] .wp-aegean{background:
radial-gradient(90% 60% at 78% 8%,rgba(240,196,0,.14),rgba(240,196,0,0) 55%),
repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,rgba(255,255,255,0) 1px 26px),
linear-gradient(180deg,#171D24 0%,#1C2B36 34%,#1E4460 62%,#122C40 100%)}
.wp-terrazzo{background:
conic-gradient(from 20deg at 30% 30%,rgba(233,190,0,.10) 0 25%,rgba(43,110,158,.08) 0 50%,rgba(124,154,61,.10) 0 75%,rgba(217,107,74,.08) 0 100%),
radial-gradient(circle at 60px 40px,rgba(255,255,255,.5) 2px,rgba(255,255,255,0) 3px),
radial-gradient(circle at 20px 90px,rgba(33,43,34,.08) 2px,rgba(33,43,34,0) 3px),
linear-gradient(150deg,#F6F4EC,#ECE9DC);background-size:100% 100%,110px 110px,110px 110px,100% 100%}
#wallImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* ---------- 桌面 ---------- */
#desk{position:fixed;inset:0 0 var(--taskh) 0;z-index:1;overflow:hidden;touch-action:none}
#icons{position:absolute;inset:0}
.dicon{position:absolute;left:0;top:0;width:var(--icsz);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:10px;cursor:default;transition:transform .28s cubic-bezier(.22,1,.36,1),left .28s cubic-bezier(.22,1,.36,1),top .28s cubic-bezier(.22,1,.36,1),background .12s;will-change:left,top}
.dicon.noanim{transition:none}
.dicon:hover{background:rgba(255,255,255,.28)}
[data-theme="dark"] .dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:var(--selbg);box-shadow:inset 0 0 0 1px var(--acc)}
.dicon.droptarget{box-shadow:inset 0 0 0 2px var(--acc);background:var(--acc-soft)}
.dicon.cut .dico,.dicon.cut .dname{opacity:.45}
.dico{width:var(--icico);height:var(--icico);display:grid;place-items:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-s);color:var(--sea);position:relative;transition:transform .15s}
.dicon:hover .dico{transform:translateY(-2px)}
.dico svg{width:62%;height:62%}
.dico.thumb{background-size:cover;background-position:center;background-color:#fff}
.dname{max-width:100%;font-size:12px;line-height:1.35;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(20,26,20,.65),0 0 8px rgba(20,26,20,.35);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;padding:0 2px;border-radius:4px}
.dicon.sel .dname{background:var(--acc);color:var(--acc-ink);text-shadow:none}
.dbadge{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:6px;background:var(--sea);color:#fff;display:grid;place-items:center;box-shadow:var(--sh-s)}
.dbadge svg{width:12px;height:12px}
#band,#lband{position:fixed;border:1px solid var(--acc);background:rgba(233,190,0,.16);border-radius:4px;pointer-events:none;z-index:60}
/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskh);z-index:1000;display:flex;align-items:center;gap:8px;padding:0 10px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px) saturate(1.2);border-top:1px solid var(--line)}
#tbStart{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.02em;border:1px solid var(--line);background:var(--surface2)}
#tbStart:hover{border-color:var(--acc);box-shadow:var(--sh-s)}
#tbStart .mark{width:22px;height:22px;border-radius:7px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
#tbStart .mark svg{width:14px;height:14px}
#tbApps{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
#tbApps::-webkit-scrollbar{display:none}
.titem{position:relative;width:42px;height:42px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;color:var(--mut);transition:background .12s,transform .12s}
.titem:hover{background:var(--hov);transform:translateY(-2px)}
.titem.on{color:var(--ink);background:var(--surface2)}
.titem.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:3px;border-radius:2px;background:var(--acc);transform:translateX(-50%)}
.titem.min::after{background:var(--faint)}
.titem svg{width:22px;height:22px}
.titem .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.titem:hover .tip{opacity:1}
#tray{display:flex;align-items:center;gap:6px}
.traybtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.traybtn:hover{background:var(--hov);color:var(--ink)}
.traybtn svg{width:18px;height:18px}
#trayStore{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:11.5px;color:var(--mut);font-family:var(--font-m)}
#trayStore:hover{background:var(--hov)}
#trayStore .dot{width:8px;height:8px;border-radius:50%;background:var(--olive)}
#clock{text-align:right;line-height:1.2;padding:0 6px;cursor:default}
#clock b{font-family:var(--font-d);font-size:16px;font-weight:700;display:block}
#clock span{font-size:10.5px;color:var(--mut)}
/* ---------- 开始菜单 ---------- */
#startmenu{position:fixed;left:10px;bottom:calc(var(--taskh) + 10px);z-index:1200;width:330px;max-height:min(560px,calc(100vh - var(--taskh) - 30px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-l);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom left;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
#smSearch{margin:12px 12px 6px;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#smSearch:focus-within{border-color:var(--acc)}
#smSearch svg{width:16px;height:16px;color:var(--mut);flex:0 0 auto}
#smSearch input{flex:1;border:none;background:none;font-size:13px}
#smApps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px;overflow:auto}
.smapp{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:12px;font-size:12px;transition:background .12s,transform .12s}
.smapp:hover{background:var(--acc-soft);transform:translateY(-2px)}
.smapp .ai{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:var(--sh-s)}
.smapp .ai svg{width:24px;height:24px}
#smFoot{border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}
#smFoot .qk{display:flex;gap:4px}
/* ---------- 右键菜单 ---------- */
#ctx{position:fixed;z-index:1300;min-width:210px;max-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-l);padding:5px;animation:pop .13s ease-out;max-height:70vh;overflow:auto}
.menu-it{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13px;cursor:default;white-space:nowrap}
.menu-it:hover{background:var(--acc-soft)}
.menu-it:active{transform:scale(.98)}
.menu-it svg{width:16px;height:16px;color:var(--mut);flex:0 0 auto}
.menu-it:hover svg{color:var(--ink)}
.menu-it .k{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--font-m)}
.menu-it.dis{opacity:.4;pointer-events:none}
.menu-it.danger{color:var(--danger)}
.menu-it.danger svg{color:var(--danger)}
.menu-sep{height:1px;background:var(--line);margin:5px 8px}
.menu-head{padding:5px 9px 3px;font-size:11px;color:var(--faint);letter-spacing:.05em}
#ctxSub{position:fixed;z-index:1301;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-l);padding:5px;animation:pop .13s ease-out}
/* ---------- 窗口 ---------- */
#wins{position:fixed;inset:0;z-index:10;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:300px;min-height:180px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-m);overflow:hidden;animation:winin .2s cubic-bezier(.22,1,.36,1)}
@keyframes winin{from{opacity:0;transform:scale(.96) translateY(10px)}}
.win.closing{animation:winout .15s ease-in forwards}
@keyframes winout{to{opacity:0;transform:scale(.96) translateY(8px)}}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--taskh))!important;border-radius:0;border-left:none;border-right:none;border-top:none}
.win.focused{box-shadow:var(--sh-l);border-color:var(--line2)}
.win:not(.focused){opacity:.985}
.win:not(.focused) .win-hd{background:var(--surface)}
.win-hd{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;background:var(--surface2);border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.win-hd:active{cursor:grabbing}
.win-ic{width:20px;height:20px;color:var(--sea);flex:0 0 auto}
.win-ic svg{width:100%;height:100%}
.win-tt{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.win-btns{display:flex;gap:4px}
.wbtn{width:28px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--mut);transition:background .1s,color .1s,transform .1s}
.wbtn:hover{background:var(--hov);color:var(--ink)}
.wbtn:active{transform:scale(.9)}
.wbtn svg{width:13px;height:13px}
.wbtn.cls:hover{background:var(--danger);color:#fff}
.win-bd{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--surface)}
.rh{position:absolute;z-index:6}
.rh[data-d="n"]{left:10px;right:10px;top:-3px;height:7px;cursor:n-resize}
.rh[data-d="s"]{left:10px;right:10px;bottom:-3px;height:7px;cursor:s-resize}
.rh[data-d="e"]{top:10px;bottom:10px;right:-3px;width:7px;cursor:e-resize}
.rh[data-d="w"]{top:10px;bottom:10px;left:-3px;width:7px;cursor:w-resize}
.rh[data-d="ne"]{top:-3px;right:-3px;width:14px;height:14px;cursor:ne-resize}
.rh[data-d="nw"]{top:-3px;left:-3px;width:14px;height:14px;cursor:nw-resize}
.rh[data-d="se"]{bottom:-3px;right:-3px;width:16px;height:16px;cursor:se-resize}
.rh[data-d="sw"]{bottom:-3px;left:-3px;width:16px;height:16px;cursor:sw-resize}
.win.fs-mode{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0;border:none;z-index:2000}
.win.fs-mode .win-hd{display:none}
/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--surface);transition:all .12s;font-weight:500}
.btn:hover{border-color:var(--line2);background:var(--surface2);box-shadow:var(--sh-s)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.05);box-shadow:0 3px 10px rgba(233,190,0,.35)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn svg{width:15px;height:15px}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.inp{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;transition:border-color .12s;width:100%}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.inp{user-select:text;-webkit-user-select:text;resize:none;line-height:1.6}
select.inp{cursor:pointer}
.tb{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}

.tbtn{height:30px;min-width:30px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink);border:1px solid transparent;flex:0 0 auto;transition:all .1s}

/* ---------- 对话框 / Toast ---------- */
#mask{position:fixed;inset:0;z-index:9000;background:rgba(16,20,14,.45);display:grid;place-items:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{width:min(430px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-l);padding:20px;animation:pop .18s cubic-bezier(.22,1,.36,1);max-height:86vh;overflow:auto}

.dlg .inp{margin-top:12px}
#toasts{position:fixed;right:14px;bottom:calc(var(--taskh) + 12px);z-index:9500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sea);border-radius:10px;box-shadow:var(--sh-m);padding:10px 14px;font-size:13px;max-width:min(340px,86vw);animation:tin .25s cubic-bezier(.22,1,.36,1);pointer-events:auto}

.toast.warn{border-left-color:var(--acc)}

/* ---------- 文件资源管理器 ---------- */
.ex{display:grid;grid-template-columns:185px 1fr;grid-template-rows:auto 1fr auto;height:100%;--cols:minmax(0,1fr) 84px 92px 128px;position:relative}

.side-it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ex-list{flex:1;overflow:auto;position:relative;user-select:none}
.lhd,.lrow{display:grid;grid-template-columns:var(--cols);align-items:center;gap:8px;padding:0 12px}
.lhd{position:sticky;top:0;z-index:3;height:34px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);font-weight:700}

.lhd .hc svg{width:11px;height:11px}

.lrow{height:38px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-size:13px;cursor:default;position:relative}

.mv{height:100%;display:flex;flex-direction:column;background:#000}

.ck{border-radius:11px;background:var(--surface2);border:1px solid var(--line);font-family:var(--font-d);font-size:19px;font-weight:600;transition:all .08s;min-height:44px}

.pt{display:flex;flex-direction:column;height:100%}

.wp-card{display:flex;gap:10px;flex-wrap:wrap}

.wp-th.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.wp-th span{position:absolute;left:0;right:0;bottom:0;background:rgba(20,24,18,.55);color:#fff;font-size:10.5px;padding:2px 6px}
/* ---------- 浏览器 ---------- */
.br{display:flex;flex-direction:column;height:100%}

.deskbrand{position:absolute;right:18px;bottom:14px;font-family:var(--font-d);font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none;display:flex;align-items:center;gap:7px}

function fileIconName(name,isDir){
  if(isDir)return'folder';
  const e=extOf(name);
  if(['png','jpg','jpeg','gif','webp','svg','bmp','ico'].includes(e))return'fileImage';
  if(['mp3','wav','ogg','flac','aac','m4a'].includes(e))return'fileAudio';
  if(['mp4','webm','ogv','mov','mkv'].includes(e))return'fileVideo';
  if(['zip','gz','tar','tgz','7z','rar'].includes(e))return'fileZip';
  if(e==='pdf')return'filePdf';
  if(['csv','tsv','xls','xlsx'].includes(e))return'fileSheet';
  if(['html','htm','css','js','mjs','json','xml','svg','py','c','cpp','java','sh','yaml','yml','ini','toml'].includes(e))return'fileCode';
  if(['txt','md','log','markdown'].includes(e))return'fileText';
  return'file';
}

dialog(opts){return new Promise(res=>{
  const mask=el('div','',``);mask.id='mask';
  const d=el('div','dlg');
  d.innerHTML=`<h3>${esc(opts.title||'柠屿')}</h3>${opts.html?`<div>${opts.html}</div>`:`<p>${esc(opts.text||'')}</p>`}`;
  const row=el('div','row');
  (opts.buttons||[{t:'确定',v:true,pri:true}]).forEach(b=>{
    const btn=el('button','btn '+(b.pri?'pri':b.danger?'danger':''),esc(b.t));
    btn.onclick=()=>{if(opts.input){const inp=$('.inp',d);res(b.v?(inp?inp.value:null):null)}else{res(b.v===undefined?true:b.v)}mask.remove()};
    row.appendChild(btn);
  });
  d.appendChild(row);mask.appendChild(d);document.body.appendChild(mask);
  const inp=$('.inp',d);if(inp){setTimeout(()=>{inp.focus();if(inp.select)inp.select()},60);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const pri=(opts.buttons||[{t:'确定',v:true}]).find(x=>x.pri!==false);res(inp.value);mask.remove()}});}
  mask.addEventListener('pointerdown',e=>{if(e.target===mask&&!opts.modal){res(opts.cancelVal!==undefined?opts.cancelVal:null);mask.remove()}});
})},
confirm(text,title){return this.dialog({title:title||'请确认',text,buttons:[{t:'取消',v:false},{t:'确定',v:true,pri:true}]})},
prompt(text,val,title){return this.dialog({title:title||'输入',text,html:`<p>${esc(text)}</p><input class="inp" value="${esc(val||'')}">`,buttons:[{t:'取消',v:false},{t:'确定',v:true,pri:true}],cancelVal:null})},
alert(text,title){return this.dialog({title:title||'提示',text,buttons:[{t:'好的',v:true,pri:true}]})}
};

  open(){if(this._db)return this._db;this._db=new Promise((res,rej)=>{const r=indexedDB.open('lemonisle',1);r.onupgradeneeded=()=>{const d=r.result;['kv','mounts','fs'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this._db},
  async tx(s,m){const d=await this.open();return d.transaction(s,m).objectStore(s)},
  async get(s,k){try{const t=await this.tx(s,'readonly');return await new Promise((res,rej)=>{const q=t.get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return undefined}},
  async set(s,k,v){try{const t=await this.tx(s,'readwrite');return await new Promise((res,rej)=>{const q=t.put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}},
  async del(s,k){try{const t=await this.tx(s,'readwrite');return await new Promise(res=>{const q=t.delete(k);q.onsuccess=()=>res();q.onerror=()=>res()})}catch(e){}},
  async keys(s){try{const t=await this.tx(s,'readonly');return await new Promise(res=>{const q=t.getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}catch(e){return[]}},
  async clear(s){try{const t=await this.tx(s,'readwrite');await new Promise(res=>{const q=t.clear();q.onsuccess=()=>res();q.onerror=()=>res()})}catch(e){}}
};
/* ================= 虚拟文件系统 fs（OPFS 主后端 + 本地挂载 + 降级） ================= */
const fs=(()=>{
  let root=null,backend='opfs';
  const mounts=new Map();          // '/mnt/local/名字' -> {handle,name}
  const dirMeta=new Map();         // 目录修改时间
  let metaTimer=null;
  /* ---- 内存降级后端 ---- */
  const mem={dirs:new Set(['/']),files:new Map(),
    async load(){const snap=await idb.get('kv','memfs');if(snap){snap.dirs.forEach(d=>mem.dirs.add(d));snap.files.forEach(f=>mem.files.set(f.p,{blob:f.b,mtime:f.m}))}},
    save:debounce(async()=>{await idb.set('kv','memfs',{dirs:[...mem.dirs],files:[...mem.files.values()].map((v,k)=>({p:k,b:v.blob,m:v.mtime}))})},600)};
  const norm=p=>{const s='/'+String(p==null?'':p).split('/').filter(Boolean).join('/');return s};
  const parts=p=>norm(p).split('/').filter(Boolean);
  const isHidden=n=>n.startsWith('.');
  function baseFor(pts){
    if(pts[0]==='mnt'&&pts[1]==='local'){
      if(pts.length<3)return{virtual:true,rest:pts};
      const mp='/mnt/local/'+pts[2];const m=mounts.get(mp);
      if(!m){const e=new Error('挂载点不存在: '+mp);e.code='ENOENT';throw e}
      return{handle:m.handle,rest:pts.slice(3),mount:mp};
    }
    if(backend!=='opfs'){return{mem:true,rest:pts}}
    return{handle:root,rest:pts};
  }
  async function dirHandle(path,create){
    const pts=parts(path);const b=baseFor(pts);
    if(b.virtual){const e=new Error('无效路径 '+path);e.code='EINVAL';throw e}
    if(b.mem){const p=norm(path);if(!mem.dirs.has(p)){if(!create){const e=new Error('目录不存在 '+path);e.code='ENOENT';throw e}let cur='/';for(const s of pts){cur=joinPath(cur,s);mem.dirs.add(cur)}}return{__mem:p}}
    let h=b.handle;
    for(const s of b.rest)h=await h.getDirectoryHandle(s,{create});
    return h;
  }
  function touchDir(p){if(p.startsWith('/mnt/local'))return;dirMeta.set(norm(p)||'/',Date.now());saveMeta()}
  function saveMeta(){clearTimeout(metaTimer);metaTimer=setTimeout(async()=>{if(backend!=='opfs')return;try{const obj={};dirMeta.forEach((v,k)=>obj[k]=v);const f=await root.getFileHandle('.lemonisle.meta',{create:true});const w=await f.createWritable();await w.write(JSON.stringify(obj));await w.close()}catch(e){}},400)}
  async function loadMeta(){try{const f=await root.getFileHandle('.lemonisle.meta');const j=JSON.parse(await (await f.getFile()).text());Object.entries(j).forEach(([k,v])=>dirMeta.set(k,v))}catch(e){}}
  const toBlob=d=>d instanceof Blob?d:new Blob([d],{type:'application/octet-stream'});
  /* ---- 统一 API（Promise 化，同时兼容 callback 传参签名） ---- */
  function wrap(fn){return function(...args){let cb=null;const rest=args.filter(a=>{if(typeof a==='function'){cb=a;return false}return true});const p=fn.apply(this,rest);if(cb){p.then(r=>cb(null,r),e=>cb(e));return undefined}return p}}
  const api={
    backend:()=>backend,
    mounts,
    ready:(async()=>{
      try{
        if(navigator.storage&&navigator.storage.getDirectory){root=await navigator.storage.getDirectory();backend='opfs';await loadMeta()}
        else{backend='mem';await mem.load();ui.toast('当前浏览器不支持 OPFS，已降级到 IndexedDB 存储','warn',5000)}
      }catch(e){console.error(e);backend='mem';await mem.load();ui.toast('OPFS 初始化失败，已降级到内存+IndexedDB 存储','warn',5000)}
      return true;
    })(),
    norm,
    async exists(p){try{await api.stat(p);return true}catch(e){return false}},
    async stat(p,isLstat,cb){
      p=norm(p);
      if(p==='/')return{name:'/',isDirectory:true,size:0,mtime:Date.now()};
      if(p==='/mnt'||p==='/mnt/local')return{name:baseName(p),isDirectory:true,size:0,mtime:Date.now()};
      const pts=parts(p);const b=baseFor(pts);
      if(b.virtual){if(p==='/mnt/local/'+pts[2]&&mounts.has(p))return{name:pts[2],isDirectory:true,size:0,mtime:Date.now()};const e=new Error('不存在 '+p);e.code='ENOENT';throw e}
      if(b.mem){if(mem.dirs.has(p))return{name:baseName(p),isDirectory:true,size:0,mtime:dirMeta.get(p)||Date.now()};const f=mem.files.get(p);if(f)return{name:baseName(p),isDirectory:false,size:f.blob.size,mtime:f.mtime};const e=new Error('不存在 '+p);e.code='ENOENT';throw e}
      const parent=await dirHandle(dirName(p));
      const name=pts[pts.length-1];
      try{const dh=await parent.getDirectoryHandle(name);return{name,isDirectory:true,size:0,mtime:dirMeta.get(p)||Date.now()}}catch(e){}
      try{const fh=await parent.getFileHandle(name);const file=await fh.getFile();return{name,isDirectory:false,size:file.size,mtime:file.lastModified}}catch(e){const er=new Error('不存在 '+p);er.code='ENOENT';throw er}
    },
    async readdir(p){
      p=norm(p);
      if(p==='/mnt')return[{name:'local',isDirectory:true,size:0,mtime:Date.now()}];
      if(p==='/mnt/local')return[...mounts.values()].map(m=>({name:m.name,isDirectory:true,size:0,mtime:Date.now()}));
      const b=baseFor(parts(p));
      if(b.virtual)return[];
      if(b.mem){const out=[];const pre=p==='/'?'/':p+'/';
        mem.dirs.forEach(d=>{if(d.startsWith(pre)&&d!==p&&!d.slice(pre.length).includes('/')&&d.slice(pre.length))out.push({name:d.slice(pre.length),isDirectory:true,size:0,mtime:dirMeta.get(d)||Date.now()})});
        mem.files.forEach((f,k)=>{if(k.startsWith(pre)&&!k.slice(pre.length).includes('/'))out.push({name:k.slice(pre.length),isDirectory:false,size:f.blob.size,mtime:f.mtime})});
        return out.filter(e=>store.get('showHidden',false)||!isHidden(e.name)).sort((a,b2)=>(b2.isDirectory-a.isDirectory)||natCmp(a.name,b2.name))}
      const dh=await dirHandle(p);const out=[];const jobs=[];
      for await(const ent of dh.values()){
        if(isHidden(ent.name)&&!store.get('showHidden',false))continue;
        if(ent.kind==='directory')out.push({name:ent.name,isDirectory:true,size:0,mtime:dirMeta.get(joinPath(p,ent.name))||Date.now()});
        else jobs.push(ent.getFile().then(f=>out.push({name:ent.name,isDirectory:false,size:f.size,mtime:f.lastModified})).catch(()=>{}));
      }
      await Promise.all(jobs);
      return out.sort((a,b2)=>(b2.isDirectory-a.isDirectory)||natCmp(a.name,b2.name));
    },
    async mkdir(p,opts){
      p=norm(p);const b=baseFor(parts(p));
      if(b.virtual)throw new Error('无法在该位置创建');
      if(b.mem){let cur='/';for(const s of parts(p)){cur=joinPath(cur,s);mem.dirs.add(cur)}touchDir(dirName(p));mem.save();bus.emit('fs-change',dirName(p));return}
      await dirHandle(p,true);touchDir(p);touchDir(dirName(p));bus.emit('fs-change',dirName(p));
    },
    async readFile(p,flag){
      p=norm(p);const b=baseFor(parts(p));
      if(b.mem){const f=mem.files.get(p);if(!f){const e=new Error('文件不存在 '+p);e.code='ENOENT';throw e}return f.blob}
      const dh=await dirHandle(dirName(p));
      const fh=await dh.getFileHandle(parts(p).pop());
      return await fh.getFile();
    },
    async writeFile(p,data){
      p=norm(p);const blob=toBlob(data);const b=baseFor(parts(p));
      if(b.mem){mem.dirs.add(dirName(p)==='/'?'/':dirName(p));mem.files.set(p,{blob,mtime:Date.now()});touchDir(dirName(p));mem.save();bus.emit('fs-change',dirName(p));return}
      const dh=await dirHandle(dirName(p),true);
      const fh=await dh.getFileHandle(baseName(p),{create:true});
      const w=await fh.createWritable();await w.write(blob);await w.close();
      touchDir(dirName(p));bus.emit('fs-change',dirName(p));
    },
    async remove(p){
      p=norm(p);if(p==='/'||p==='/mnt'||p==='/mnt/local'||mounts.has(p))throw new Error('该位置受保护，无法删除');
      const b=baseFor(parts(p));
      if(b.mem){const pre=p+'/';[...mem.files.keys()].forEach(k=>{if(k===p||k.startsWith(pre))mem.files.delete(k)});[...mem.dirs].forEach(d=>{if(d===p||d.startsWith(pre))mem.dirs.delete(d)});touchDir(dirName(p));mem.save();bus.emit('fs-change',dirName(p));return}
      const dh=await dirHandle(dirName(p));const name=baseName(p);
      await dh.removeEntry(name,{recursive:true});
      touchDir(dirName(p));bus.emit('fs-change',dirName(p));
    },
    async rename(from,to){
      from=norm(from);to=norm(to);
      if(await api.exists(to))throw new Error('目标已存在：'+to);
      const bf=baseFor(parts(from)),bt=baseFor(parts(to));
      if(bf.mem||bt.mem){
        if(bf.mem!==bt.mem)throw new Error('不支持跨存储移动');
        const st=await api.stat(from);
        if(st.isDirectory){const pre=from+'/';const moving=[...mem.dirs].filter(d=>d===from||d.startsWith(pre));const mf=[...mem.files.keys()].filter(k=>k.startsWith(pre));
          moving.forEach(d=>{mem.dirs.delete(d);mem.dirs.add(to+d.slice(from.length))});
          mf.forEach(k=>{const f=mem.files.get(k);mem.files.delete(k);mem.files.set(to+k.slice(from.length),f)});
        }else{const f=mem.files.get(from);mem.files.delete(from);mem.files.set(to,f)}
        touchDir(dirName(from));touchDir(dirName(to));mem.save();bus.emit('fs-change',dirName(from));bus.emit('fs-change',dirName(to));return;
      }
      const srcDh=await dirHandle(dirName(from)),dstDh=await dirHandle(dirName(to),true);
      const srcName=baseName(from),dstName=baseName(to);
      let moved=false;
      try{
        let h;try{h=await srcDh.getDirectoryHandle(srcName)}catch(e){h=await srcDh.getFileHandle(srcName)}
        if(typeof h.move==='function'){await h.move(dstDh,dstName);moved=true}
      }catch(e){moved=false}
      if(!moved){await api.copy(from,to);await api.remove(from)}
      touchDir(dirName(from));touchDir(dirName(to));
      bus.emit('fs-change',dirName(from));bus.emit('fs-change',dirName(to));
    },
    async copy(from,to){
      from=norm(from);to=norm(to);
      const st=await api.stat(from);
      if(st.isDirectory){
        await api.mkdir(to).catch(()=>{});
        const list=await api.readdir(from);
        for(const it of list)await api.copy(joinPath(from,it.name),joinPath(to,it.name));
      }else{const blob=await api.readFile(from);await api.writeFile(to,blob)}
    },
    async treeSize(p){
      const st=await api.stat(p);
      if(!st.isDirectory)return{size:st.size,count:1,dirs:0};
      let size=0,count=0,dirs=0;const list=await api.readdir(p);
      for(const it of list){if(it.isDirectory){dirs++;const r=await api.treeSize(joinPath(p,it.name));size+=r.size;count+=r.count;dirs+=r.dirs}else{size+=it.size;count++}}
      return{size,count,dirs};
    },
    async estimate(){try{return await navigator.storage.estimate()}catch(e){return{quota:0,usage:0}}},
    async persist(){try{return await navigator.storage.persist()}catch(e){return false}},
    async readText(p){return await(await api.readFile(p)).text()},
    async readBuffer(p){return await(await api.readFile(p)).arrayBuffer()},
    /* ---- 本地文件夹挂载（File System Access API → 统一后端） ---- */
    async mountLocal(handle){
      const path='/mnt/local/'+handle.name;
      if(mounts.has(path)){ui.toast('该文件夹已挂载','warn');return path}
      try{
        let perm=await handle.queryPermission({mode:'readwrite'});
        if(perm!=='granted')perm=await handle.requestPermission({mode:'readwrite'});
        if(perm!=='granted'){ui.toast('未获得文件夹访问权限','err');return null}
      }catch(e){/* 某些实现不支持 queryPermission，直接尝试使用 */}
      mounts.set(path,{handle,name:handle.name});
      try{await idb.set('mounts',path,handle)}catch(e){}
      bus.emit('fs-change','/mnt');bus.emit('fs-change','/');bus.emit('mounts-change');
      ui.toast(`已挂载本地文件夹「${handle.name}」`,'ok');
      return path;
    },
    async restoreMounts(){
      const keys=await idb.keys('mounts');const pending=[];
      for(const k of keys){
        try{const h=await idb.get('mounts',k);if(!h)continue;
          let perm='granted';
          try{perm=await h.queryPermission({mode:'readwrite'})}catch(e){}
          if(perm==='granted'){mounts.set(k,{handle:h,name:h.name})}
          else pending.push({path:k,handle:h});
        }catch(e){}
      }
      return pending;
    },
    async reauth(handle){
      try{const p=await handle.requestPermission({mode:'readwrite'});if(p==='granted'){await api.mountLocal(handle);return true}}catch(e){}
      ui.toast('授权失败','err');return false;
    },
    async unmount(path){
      mounts.delete(path);await idb.del('mounts',path);
      bus.emit('fs-change','/mnt');bus.emit('fs-change','/');bus.emit('mounts-change');
      ui.toast('已卸载','ok');
    },
    async resetAll(){
      if(backend==='opfs'&&root){
        const kill=dh=>dh.removeEntry?Promise.resolve():Promise.resolve();
        for await(const ent of root.values()){try{await root.removeEntry(ent.name,{recursive:true})}catch(e){}}
      }else{mem.dirs=new Set(['/']);mem.files.clear();await idb.del('kv','memfs')}
      dirMeta.clear();saveMeta();
      ['icons','wall','seeded','cols'].forEach(k=>store.del(k));
    },
    async exportZip(){
      if(typeof JSZip==='undefined')throw new Error('JSZip 未加载');
      const zip=new JSZip();
      const add=async(p,zp)=>{const list=await api.readdir(p);for(const it of list){const fp=joinPath(p,it.name);if(it.isDirectory)await add(fp,zp.folder(it.name));else zp.file(it.name,await api.readFile(fp))}};
      await add('/',zip);
      return await zip.generateAsync({type:'blob'});
    }
  };
  return api;
})();

const wm={
  wins:new Map(),z:100,seq:0,focusedId:null,
  create(opts){
    if(opts.single){for(const[id,w]of this.wins){if(w.app===opts.app){w.restore();w.focus();if(opts.onReuse)opts.onReuse(w);return w}}}
    const id='w'+(++this.seq);
    const n=this.wins.size;
    const win=el('div','win');win.dataset.id=id;
    const W=Math.min(opts.w||640,innerWidth-24),H=Math.min(opts.h||440,innerHeight-80);
    const x=opts.x!=null?opts.x:clamp(40+(n%6)*34,8,Math.max(8,innerWidth-W-12));
    const y=opts.y!=null?opts.y:clamp(30+(n%6)*28,8,Math.max(8,innerHeight-H-70));
    win.style.cssText+=`;width:${W}px;height:${H}px;left:${x}px;top:${y}px;z-index:${++this.z}`;
    const color=opts.color||APP_COLORS[opts.app]||'#2B6E9E';
    win.innerHTML=`<div class="win-hd"><span class="win-ic" style="color:${color}">${ICONS[opts.icon]||ICONS.file}</span><span class="win-tt">${esc(opts.title||'窗口')}</span><span class="win-btns"><button class="wbtn mn" title="最小化">${ICONS.mini}</button><button class="wbtn mx" title="最大化">${ICONS.maxi}</button><button class="wbtn cls" title="关闭">${ICONS.close}</button></span></div><div class="win-bd"></div>${(opts.noResize?'':'<i class="rh" data-d="n"></i><i class="rh" data-d="s"></i><i class="rh" data-d="e"></i><i class="rh" data-d="w"></i><i class="rh" data-d="ne"></i><i class="rh" data-d="nw"></i><i class="rh" data-d="se"></i><i class="rh" data-d="sw"></i>')}`;
    const body=$('.win-bd',win);
    if(opts.content)body.appendChild(typeof opts.content==='string'?el('div','',opts.content):opts.content);
    const api={id,app:opts.app,type:opts.type||opts.app,el:win,body,
      setTitle(t){$('.win-tt',win).textContent=t},
      focus(){wm.focus(id)},
      close(){wm.close(id)},
      minimize(){wm.minimize(id)},
      maximize(){wm.toggleMax(id)},
      isMax:()=>win.classList.contains('max'),
      onClose:opts.onClose||null,
      fullEl(){win.classList.toggle('fs-mode');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else win.requestFullscreen&&win.requestFullscreen().catch(()=>{});bus.emit('resize',id)},
    };
    win.addEventListener('pointerdown',()=>this.focus(id),true);
    /* 标题栏拖拽 */
    const hd=$('.win-hd',win);let dr=null;
    hd.addEventListener('pointerdown',e=>{
      if(e.target.closest('.wbtn'))return;
      if(e.pointerType==='mouse'&&e.button!==0)return;
      const wasMax=win.classList.contains('max');
      dr={px:e.clientX,py:e.clientY,l:win.offsetLeft,t:win.offsetTop,w:win.offsetWidth,wasMax,moved:false};
      hd.setPointerCapture(e.pointerId);
    });
    hd.addEventListener('pointermove',e=>{
      if(!dr)return;
      const dx=e.clientX-dr.px,dy=e.clientY-dr.py;
      if(!dr.moved&&Math.hypot(dx,dy)<4)return;
      dr.moved=true;
      if(dr.wasMax){
        if(dy<14&&dx===0&&dy===0)return;
        win.classList.remove('max');$('.mx',win).innerHTML=ICONS.maxi;
        const ratio=dr.px/dr.w;
        dr.l=dr.px-win.offsetWidth*ratio;dr.t=0;dr.wasMax=false;dr.px=e.clientX;dr.py=e.clientY;
        win.style.left=dr.l+'px';win.style.top='0px';
      }
      win.style.left=clamp(dr.l+dx,-win.offsetWidth+90,innerWidth-60)+'px';
      win.style.top=clamp(dr.t+dy,0,innerHeight-90)+'px';
    });
    const endDr=()=>{if(dr&&dr.moved){win.classList.add('noanim');setTimeout(()=>win.classList.remove('noanim'),50)}dr=null};
    hd.addEventListener('pointerup',endDr);hd.addEventListener('pointercancel',endDr);
    hd.addEventListener('dblclick',e=>{if(!e.target.closest('.wbtn'))this.toggleMax(id)});
    /* 八向缩放 */
    $$('.rh',win).forEach(h=>{
      let rz=null;
      h.addEventListener('pointerdown',e=>{e.stopPropagation();rz={d:h.dataset.d,px:e.clientX,py:e.clientY,r:win.getBoundingClientRect()};h.setPointerCapture(e.pointerId);h.classList.add('on')});
      h.addEventListener('pointermove',e=>{
        if(!rz)return;
        const dx=e.clientX-rz.px,dy=e.clientY-rz.py,r=rz.r,minW=opts.minW||300,minH=opts.minH||180;
        let L=r.left,T=r.top,Wd=r.width,Ht=r.height;
        if(rz.d.includes('e'))Wd=Math.max(minW,r.width+dx);
        if(rz.d.includes('s'))Ht=Math.max(minH,r.height+dy);
        if(rz.d.includes('w')){Wd=Math.max(minW,r.width-dx);L=r.left+(r.width-Wd)}
        if(rz.d.includes('n')){Ht=Math.max(minH,r.height-dy);T=r.top+(r.height-Ht)}
        win.style.left=L+'px';win.style.top=Math.max(0,T)+'px';win.style.width=Wd+'px';win.style.height=Ht+'px';
      });
      const endRz=()=>{rz=null;h.classList.remove('on');bus.emit('resize',id)};
      h.addEventListener('pointerup',endRz);h.addEventListener('pointercancel',endRz);
    });
    $('.mn',win).onclick=()=>this.minimize(id);
    $('.mx',win).onclick=()=>this.toggleMax(id);
    $('.cls',win).onclick=()=>this.close(id);
    $('#wins').appendChild(win);
    this.wins.set(id,api);
    this.focus(id);this.renderTaskbar();
    if(isMobile())win.classList.add('max');
    return api;
  },
  focus(id){const w=this.wins.get(id);if(!w)return;
    if(w.el.classList.contains('min'))w.el.classList.remove('min');
    w.el.style.zIndex=++this.z;
    this.wins.forEach(o=>o.el.classList.toggle('focused',o===w));
    this.focusedId=id;this.renderTaskbar();
  },
  minimize(id){const w=this.wins.get(id);if(!w)return;w.el.classList.add('min');if(this.focusedId===id)this.focusedId=null;this.renderTaskbar()},
  toggleMax(id){const w=this.wins.get(id);if(!w)return;w.el.classList.toggle('max');$('.mx',w.el).innerHTML=w.el.classList.contains('max')?ICONS.restor:ICONS.maxi;bus.emit('resize',id)},
  close(id){const w=this.wins.get(id);if(!w)return;
    try{w.onClose&&w.onClose()}catch(e){console.error(e)}
    w.el.classList.add('closing');setTimeout(()=>w.el.remove(),160);
    this.wins.delete(id);if(this.focusedId===id)this.focusedId=null;
    this.renderTaskbar();
  },
  restore(id){const w=this.wins.get(id);if(!w)return;w.el.classList.remove('min');this.focus(id)},
  renderTaskbar(){
    const box=$('#tbApps');box.innerHTML='';
    this.wins.forEach(w=>{
      const meta=APPS[w.app]||{name:w.app,icon:'file'};
      const b=el('button','titem on'+(w.el.classList.contains('min')?' min':''));
      b.innerHTML=`<span style="display:contents;color:${APP_COLORS[w.app]||'var(--sea)'}">${ICONS[meta.icon]||ICONS.file}</span><span class="tip">${esc(meta.name)}</span>`;
      b.onclick=()=>{
        if(w.el.classList.contains('min'))this.restore(w.id);
        else if(this.focusedId===w.id)this.minimize(w.id);
        else this.focus(w.id);
      };
      box.appendChild(b);
    });
  }
};

  hide(){if(this.node)this.node.classList.add('hidden');this.open=false},

/* ================= 框选工具 ================= */
function rubberband(startEvt,container,getItems,onSel){
  const band=el('div');band.id='band';document.body.appendChild(band);
  const sx=startEvt.clientX,sy=startEvt.clientY;
  const move=e=>{
    const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);
    band.style.left=x+'px';band.style.top=y+'px';band.style.width=w+'px';band.style.height=h+'px';
    const r={x,y,w,h};
    const sel=getItems().filter(it=>{const ir=it.el.getBoundingClientRect();return ir.x<r.x+r.w&&ir.x+ir.width>r.x&&ir.y<r.y+r.h&&ir.y+ir.height>r.y});
    onSel(sel,e);
  };
  const up=e=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);band.remove();onSel(null,e,true)};
  addEventListener('pointermove',move);addEventListener('pointerup',up);
}

function launchApp(id,arg){const a=APPS[id];if(!a){ui.toast('应用不存在：'+id,'err');return}try{a.launch(arg)}catch(e){console.error(e);ui.toast('应用启动失败：'+e.message,'err')}}
/* ================= 文件打开分派（stat 先行，目录/文件智能分流） ================= */
const IMG_EXT=['png','jpg','jpeg','gif','webp','bmp','ico','svg'];
const AV_EXT=['mp3','wav','ogg','flac','aac','m4a','mp4','webm','ogv','mov','mkv'];
const CODE_EXT=['html','htm','css','js','mjs','json','md','markdown','xml','yaml','yml','ini','toml','py','c','cpp','h','java','sh','ts','log'];
const ZIP_EXT=['zip','gz','tar','tgz','7z'];
async function openPath(path){
  let st;try{st=await fs.stat(path)}catch(e){ui.toast('无法打开：文件不存在','err');return}
  if(st.isDirectory){launchApp('explorer',path);return}
  const e=extOf(path);
  if(IMG_EXT.includes(e))return launchApp('viewer',path);
  if(AV_EXT.includes(e))return launchApp('media',path);
  if(e==='pdf')return launchApp('pdf',path);
  if(e==='csv'||e==='tsv')return launchApp('sheet',path);
  if(ZIP_EXT.includes(e))return launchApp('zip',path);
  if(CODE_EXT.includes(e))return launchApp('code',path);
  if(e==='txt'||st.size<512*1024){
    const r=await ui.dialog({title:'未知格式 .'+(e||'?'),text:`「${baseName(path)}」没有专属应用，选择打开方式：`,buttons:[{t:'以文本打开',v:'txt',pri:true},{t:'下载',v:'dl'},{t:'取消',v:null}]});
    if(r==='txt')launchApp('note',path);
    if(r==='dl')downloadPath(path);
    return;
  }
  const r=await ui.dialog({title:'大文件',text:`「${baseName(path)}」较大且格式未知，建议下载到本地查看。`,buttons:[{t:'下载',v:'dl',pri:true},{t:'以文本打开',v:'txt'},{t:'取消',v:null}]});
  if(r==='dl')downloadPath(path);if(r==='txt')launchApp('note',path);
}
async function downloadPath(path){
  try{const blob=await fs.readFile(path);const u=URL.createObjectURL(blob);const a=el('a');a.href=u;a.download=baseName(path);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);ui.toast('已开始下载 '+baseName(path),'ok')}catch(e){ui.toast('导出失败：'+e.message,'err')}
}
async function uniqueName(dir,name){
  let n=name,i=1;const dot=name.lastIndexOf('.');const stem=dot>0?name.slice(0,dot):name;const ext=dot>0?name.slice(dot):'';
  while(await fs.exists(joinPath(dir,n))){n=`${stem} (${++i})${ext}`}
  return n;
}
/* ================= 拖出缓存（dragstart 严禁异步 → 提前预载） ================= */
const dragCache=new Map();
async function preloadDrag(path){
  if(dragCache.has(path))return;
  try{const st=await fs.stat(path);if(st.isDirectory)return;
    const blob=await fs.readFile(path);
    const file=new File([blob],baseName(path),{type:mimeOf(path)});
    dragCache.set(path,{file,url:URL.createObjectURL(blob)});
  }catch(e){}
}
function armDragOut(e,paths){
  const primary=paths[0];const c=dragCache.get(primary);
  e.dataTransfer.setData('application/x-lemonisle',JSON.stringify({paths}));
  e.dataTransfer.effectAllowed='copyMove';
  if(c){
    try{e.dataTransfer.items.add(c.file)}catch(err){}
    try{e.dataTransfer.setData('DownloadURL',`${c.file.type||'application/octet-stream'}:${c.file.name}:${c.url}`)}catch(err){}
  }
  setTimeout(()=>{paths.forEach(p=>{const cc=dragCache.get(p);if(cc){setTimeout(()=>URL.revokeObjectURL(cc.url),6000);dragCache.delete(p)}})},300);
}
/* ================= 桌面图标 ================= */
const desk={
  items:[],sel:new Set(),GRID:98,
  load(){this.items=store.get('icons',null);},
  save(){store.set('icons',this.items.map(i=>({path:i.path,x:i.x,y:i.y})))},
  async ensureDefaults(){
    if(this.items)return;
    this.items=[];
    const seeds=['/文档','/图片','/音乐','/视频','/下载','/欢迎使用.md','/示例页面.html','/货品清单.csv'];
    for(const p of seeds){if(await fs.exists(p))this.items.push({path:p,x:0,y:0})}
    this.autoArrange(false);this.save();
  },
  autoArrange(saveIt=true){
    const perCol=Math.max(1,Math.floor(($('#desk').clientHeight-20)/100));
    [...this.items].sort((a,b)=>{const ad=a.path.split('/').pop(),bd=b.path.split('/').pop();return natCmp(ad,bd)}).forEach((it,i)=>{
      it.x=14+Math.floor(i/perCol)*this.GRID;it.y=14+(i%perCol)*100;
    });
    if(saveIt)this.save();
  },
  snap(v,cell){return store.get('snap',true)?Math.round(v/cell)*cell:v},
  async render(){
    const box=$('#icons');box.innerHTML='';this.sel.clear();
    const fine=matchMedia('(pointer:fine)').matches;
    for(const it of this.items){
      let st;try{st=await fs.stat(it.path)}catch(e){continue}
      const name=baseName(it.path);
      const d=el('div','dicon');d.dataset.path=it.path;
      d.style.left=it.x+'px';d.style.top=it.y+'px';
      const isImg=!st.isDirectory&&IMG_EXT.includes(extOf(name));
      let inner='';
      if(isImg){const u=await thumbs.url(it.path);if(u)inner=`<span class="dico thumb" style="background-image:url('${u}')"></span>`}
      if(!inner)inner=`<span class="dico" style="color:${st.isDirectory?'#C79A00':(APP_COLORS[fileIconName(name)]?'':'var(--sea)')}">${ICONS[fileIconName(name,st.isDirectory)]}</span>`;
      d.innerHTML=inner+`<span class="dname">${esc(name)}</span>`;
      if(st.isDirectory&&name==='下载')d.querySelector('.dico').insertAdjacentHTML('beforeend',`<span class="dbadge">${ICONS.download}</span>`);
      if(fine)d.draggable=true;
      /* 选择与单击打开 */
      let pd=null;
      d.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse'&&e.button===2)return;
        pd={x:e.clientX,y:e.clientY,moved:false};
        if(e.ctrlKey||e.metaKey){this.sel.has(it.path)?this.sel.delete(it.path):this.sel.add(it.path)}
        else if(!this.sel.has(it.path)){this.sel.clear();this.sel.add(it.path)}
        this.paintSel();
        if(e.pointerType!=='mouse'&&!isTouch())return;
      });
      d.addEventListener('pointermove',e=>{if(pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>6)pd.moved=true});
      d.addEventListener('pointerup',e=>{
        if(pd&&!pd.moved&&!e.ctrlKey&&!e.metaKey&&e.pointerType!=='mouse'){openPath(it.path)}
        pd=null;
      });
      d.addEventListener('click',e=>{
        if(e.pointerType==='touch')return;
        if(desk._wasDrag)return;
        if(pd&&pd.moved)return;
        if(!e.ctrlKey&&!e.metaKey)openPath(it.path);
      });

/* ================= 导入（物理 → 虚拟，递归目录） ================= */
async function importDataTransfer(dt,targetDir){
  const entries=[];
  for(const it of dt.items){const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(en)entries.push(en)}
  let count=0,fails=0;
  const toast=ui.toast('正在导入文件…','info',60000);
  const writeOne=async(file,dir)=>{
    try{const name=await uniqueName(dir,file.name);const buf=await file.arrayBuffer();await fs.writeFile(joinPath(dir,name),buf);count++}
    catch(e){fails++;console.error(e)}
  };
  const walk=async(entry,dir)=>{
    if(entry.isFile){const f=await new Promise((res,rej)=>entry.file(res,rej));await writeOne(f,dir)}
    else if(entry.isDirectory){
      const dname=await uniqueName(dir,entry.name);await fs.mkdir(joinPath(dir,dname)).catch(()=>{});
      const rd=entry.createReader();
      while(true){
        const batch=await new Promise((res,rej)=>rd.readEntries(res,rej));
        if(!batch.length)break;
        for(const sub of batch)await walk(sub,joinPath(dir,dname));
      }
    }
  };
  try{
    if(entries.length){for(const en of entries)await walk(en,targetDir)}
    else{for(const f of dt.files)await writeOne(f,targetDir)}
  }catch(e){fails++}
  toast.remove();
  if(count)ui.toast(`导入完成：成功 ${count} 个${fails?'，失败 '+fails+' 个':''}`,'ok');
  else ui.toast('没有可导入的文件','warn');
  bus.emit('fs-change',targetDir);
}
async function pickFiles(targetDir){

      ui.toast(`已导入 ${n} 个文件`,'ok');bus.emit('fs-change',targetDir);res(n);
    };

  });
}

function buildNotepad(path,text){
  const st={path:path||null,dirty:false};
  const root=el('div','');root.style.cssText='display:flex;flex-direction:column;height:100%';
  root.innerHTML=`
  <div class="tb">
    <button class="tbtn" data-a="save" title="保存 Ctrl+S">${ICONS.save}<span>保存</span></button>
    <button class="tbtn" data-a="saveas" title="另存为">${ICONS.export}<span>另存</span></button>
    <button class="tbtn" data-a="wrap">${ICONS.text}<span>换行</span></button>
    <span class="tsep"></span>
    <button class="tbtn" data-a="f-">A-</button>
    <button class="tbtn" data-a="f+">A+</button>
    <span class="tsp"></span>
    <span class="enc" style="font-size:11px;color:var(--faint);font-family:var(--font-m)">UTF-8</span>
  </div>
  <textarea class="inp" spellcheck="false" style="flex:1;border:none;border-radius:0;font-family:var(--font-m);font-size:13.5px;padding:14px 16px;background:var(--surface)"></textarea>
  <div class="sb"><span class="pos"></span><span class="tsp"></span><span class="wc"></span></div>`;
  const ta=$('textarea',root);ta.value=text||'';
  let fsz=13.5,wrap=true;
  const mark=()=>{st.dirty=true};
  ta.addEventListener('input',()=>{mark();upd()});
  ta.addEventListener('keyup',upd);ta.addEventListener('click',upd);
  function upd(){
    const v=ta.value,p=ta.selectionStart;
    const line=v.slice(0,p).split('\n').length,col=p-v.lastIndexOf('\n',p-1);
    $('.pos',root).textContent=`行 ${line}, 列 ${col}`;
    $('.wc',root).textContent=`${v.length} 字符 · ${v.split('\n').length} 行`;
  }
  async function save(as){
    let p=st.path;
    if(as||!p){
      const n=await ui.prompt('保存路径（含文件名）',p||'/文档/未命名.txt','另存为');if(!n)return;
      p=fs.norm(n);
    }
    try{await fs.writeFile(p,ta.value);st.path=p;st.dirty=false;setTitle();ui.toast('已保存到 '+p,'ok')}catch(e){ui.toast('保存失败：'+e.message,'err')}
  }
  function setTitle(){root._setTitle&&root._setTitle((st.path?baseName(st.path):'未命名')+(st.dirty?' •':'')+' — 记事本')}
  $$('[data-a]',root).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='save')save(false);
    if(a==='saveas')save(true);
    if(a==='wrap'){wrap=!wrap;ta.style.whiteSpace=wrap?'pre-wrap':'pre';ta.style.overflowX=wrap?'hidden':'auto';b.classList.toggle('on',wrap)}
    if(a==='f-'){fsz=Math.max(10,fsz-1);ta.style.fontSize=fsz+'px'}
    if(a==='f+'){fsz=Math.min(24,fsz+1);ta.style.fontSize=fsz+'px'}
  });
  root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save(false)}});
  upd();setTitle();
  return{el:root,setTitle:setTitleRaw=>root._setTitle=setTitleRaw,setPath:p=>{st.path=p;setTitle()},getPath:()=>st.path,setText:t=>{ta.value=t;upd()}};
}

/* ================= 表格（CSV / TSV 双视图） ================= */
function parseDelim(text,delim){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else{
      if(c==='"')q=true;
      else if(c===delim){row.push(cur);cur=''}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(c==='\r'){if(text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
      else cur+=c;
    }}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>!(r.length===1&&r[0]===''));
}
function toDelim(rows,delim){
  return rows.map(r=>r.map(c=>{c=String(c);return(c.includes('"')||c.includes(delim)||c.includes('\n'))?'"'+c.replace(/"/g,'""')+'"':c}).join(delim)).join('\n')+'\n';
}

function buildViewer(path){

  </div>
  <div class="mv-bd"><div class="mv-load"><span class="spin"></span><span class="lt">正在加载同目录图片序列…</span></div></div>
  <button class="mv-exit" data-a="fsx">${ICONS.close}</button>`;
  const bd=$('.mv-bd',root);
  const setZoom=()=>{bd.style.setProperty('--mvw',st.zooms[st.zi]+'px');$('.zl',root).textContent=Math.round(st.zooms[st.zi]/10)+'%'};
  function updCount(){
    const top=bd.scrollTop+bd.clientHeight/2;let cur=0;
    bd.querySelectorAll('img').forEach((im,i)=>{if(im.offsetTop<=top)cur=i});
    st.idx=cur;$('.ct',root).textContent=st.imgs.length?`${cur+1} / ${st.imgs.length} · ${st.imgs[cur]||''}`:'';
  }
  bd.addEventListener('scroll',debounce(updCount,120));
  $$('[data-a]',root).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='prev'||a==='next'){const i=clamp(st.idx+(a==='prev'?-1:1),0,st.imgs.length-1);const im=bd.querySelectorAll('img')[i];im&&im.scrollIntoView({behavior:'smooth'})}
    if(a==='zo')st.zi=Math.max(0,st.zi-1);
    if(a==='zi')st.zi=Math.min(st.zooms.length-1,st.zi+1);
    if(a==='zo'||a==='zi')setZoom();
    if(a==='dl')downloadPath(joinPath(dirName(st.path),st.imgs[st.idx]));
    if(a==='fs'||a==='fsx')root._win&&root._win.fullEl();
  });
  (async()=>{
    const dir=dirName(path);
    let list;
    try{list=await fs.readdir(dir)}catch(e){$('.mv-load',root).innerHTML=ICONS.err+'<span>目录读取失败：'+esc(e.message)+'</span>';return}
    st.imgs=list.filter(f=>!f.isDirectory&&IMG_EXT.includes(extOf(f.name))).map(f=>f.name).sort((a,b)=>natCmp(a,b));
    if(!st.imgs.length){$('.mv-load',root).innerHTML='该目录下没有可显示的图片';return}
    const target=baseName(path);
    const blobs=await Promise.all(st.imgs.map(async n=>{try{return{url:URL.createObjectURL(await fs.readFile(joinPath(dir,n))),n}}catch(e){return null}}));
    $('.mv-load',root).remove();
    blobs.forEach(b=>{if(!b)return;const im=el('img');im.src=b.url;im.alt=b.n;im.dataset.n=b.n;if(b.n===target)im.dataset.target='1';bd.appendChild(im);st.urls.push(b.url)});
    const t=$('img[data-target]',bd);if(t)t.scrollIntoView();
    setZoom();updCount();
  })();
  return{el:root,cleanup(){st.urls.forEach(u=>URL.revokeObjectURL(u))}};
}

function buildMedia(path){
  const st={path,list:[],idx:0};
  const isVideo=AV_EXT.slice(6).includes(extOf(path));
  const root=el('div','mp');
  root.innerHTML=`
  <div class="mp-stage"></div>
  <div class="mp-ctl">
    <div class="mp-row"><span class="mp-time t0">0:00</span><input type="range" class="seek" min="0" max="1000" value="0"><span class="mp-time t1">0:00</span></div>
    <div class="mp-row">
      <button class="pbtn" data-a="prev">${ICONS.prevT}</button>
      <button class="pbtn big" data-a="pp">${ICONS.play}</button>
      <button class="pbtn" data-a="next">${ICONS.nextT}</button>
      <span class="mp-tt"></span>
      ${ICONS.fileAudio.replace('<svg','<svg style="width:16px;height:16px;color:var(--mut)"')}
      <input type="range" class="vol" min="0" max="100" value="85" style="max-width:90px">
    </div>
  </div>`;
  const stage=$('.mp-stage',root);let media=null,url=null;
  const tfmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  async function load(i){
    st.idx=clamp(i,0,st.list.length-1);
    const name=st.list[st.idx];const p=joinPath(dirName(st.path),name);
    if(url)URL.revokeObjectURL(url);
    stage.innerHTML='';
    try{url=URL.createObjectURL(await fs.readFile(p))}catch(e){ui.toast('读取失败：'+e.message,'err');return}
    const video=AV_EXT.slice(6).includes(extOf(name));
    media=el(video?'video':'audio');media.src=url;media.volume=$('.vol',root).value/100;
    if(video){stage.appendChild(media)}
    else{stage.innerHTML=`<div class="mp-cover"><div class="mp-disc">${ICONS.fileAudio}</div><div style="font-size:13px;max-width:80%;text-align:center">${esc(name)}</div></div>`;stage.appendChild(media)}
    media.addEventListener('timeupdate',()=>{$('.seek',root).value=(media.currentTime/media.duration||0)*1000;$('.t0',root).textContent=tfmt(media.currentTime);$('.t1',root).textContent=tfmt(media.duration)});
    media.addEventListener('play',()=>{$('[data-a=pp]',root).innerHTML=ICONS.pause;const d=$('.mp-disc',root);d&&d.classList.add('playing')});
    media.addEventListener('pause',()=>{$('[data-a=pp]',root).innerHTML=ICONS.play;const d=$('.mp-disc',root);d&&d.classList.remove('playing')});
    media.addEventListener('ended',()=>{if(st.idx<st.list.length-1)load(st.idx+1)});
    $('.mp-tt',root).textContent=`${st.idx+1}/${st.list.length} ${name}`;
    media.play().catch(()=>{});
  }
  $$('[data-a]',root).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='pp'){if(!media)return;media.paused?media.play():media.pause()}
    if(a==='prev')load(st.idx-1);
    if(a==='next')load(st.idx+1);
  });
  $('.seek',root).addEventListener('input',e=>{if(media&&media.duration)media.currentTime=e.target.value/1000*media.duration});
  $('.vol',root).addEventListener('input',e=>{if(media)media.volume=e.target.value/100});
  (async()=>{
    try{const list=await fs.readdir(dirName(st.path));st.list=list.filter(f=>!f.isDirectory&&AV_EXT.includes(extOf(f.name))).map(f=>f.name).sort((a,b)=>natCmp(a,b));
      load(Math.max(0,st.list.indexOf(baseName(st.path))));
    }catch(e){ui.toast(e.message,'err')}
  })();
  return{el:root,cleanup(){if(url)URL.revokeObjectURL(url)}};
}

function buildBrowser(homeUrl){
  const st={hist:[],hi:-1,blobs:[]};
  const root=el('div','br');
  root.innerHTML=`
  <div class="tb">
    <button class="tbtn" data-a="back">${ICONS.back}</button>
    <button class="tbtn" data-a="fwd">${ICONS.fwd}</button>
    <button class="tbtn" data-a="re">${ICONS.refresh}</button>
    <button class="tbtn" data-a="home">${ICONS.home}</button>
    <input class="inp addr" placeholder="输入地址，或 /路径 打开虚拟文件" style="height:30px;padding:0 10px">
    <button class="tbtn" data-a="go">${ICONS.chevR}</button>
  </div>
  <iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals" referrerpolicy="no-referrer"></iframe>`;
  const frame=$('iframe',root),addr=$('.addr',root);
  const HOME=`data:text/html;charset=utf-8,${encodeURIComponent(`<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:linear-gradient(160deg,#f6f3e9,#e3ece6)} .c{text-align:center;max-width:420px;padding:20px} h1{font-size:26px;color:#22301f} p{color:#6b7a68;font-size:13px;line-height:1.8} .t{margin:16px auto;display:block;padding:10px 14px;border-radius:9px;border:1px solid #ddd8c6;width:300px;font-size:14px;outline:none} .t:focus{border-color:#e9be00} a{display:inline-block;margin:6px;color:#2b6e9e;font-size:13px}</style></head><body><div class="c"><h1>柠屿 · 启航</h1><input class="t" placeholder="搜索或输入网址" onkeydown="if(event.key==='Enter')parent.postMessage({liosNav:this.value})"><p>提示：许多网站禁止被嵌入浏览，若页面空白属正常现象。<br>在地址栏输入 /开头路径 可直接打开虚拟文件系统中的网页。</p><a href="https://zh.wikipedia.org" target="_top">维基百科</a><a href="https://example.com" target="_top">Example</a><a href="https://www.bing.com" target="_top">Bing</a></div></body></html>`)}`;
  function setNav(){addr.value=st.hist[st.hi]||''}
  async function go(raw,push=true){
    let u=(raw||'').trim();
    if(!u||u==='about:home'){u=HOME}
    else if(u.startsWith('file://')){u=await vfsUrl(u.slice(7))}
    else if(u.startsWith('/')){u=await vfsUrl(u)}
    else if(!/^[a-z]+:\/\//i.test(u)){
      if(await fs.exists('/'+u)){u=await vfsUrl('/'+u)}
      else if(u.includes('.')&&!u.includes(' ')){u='https://'+u}
      else{u='https://www.bing.com/search?q='+encodeURIComponent(u)}
    }
    if(!u)return;
    if(push){st.hist=st.hist.slice(0,st.hi+1);st.hist.push(u.startsWith('data:')?'about:home':u);st.hi++}
    frame.src=u;setNav();
  }
  async function vfsUrl(p){
    try{const b=await fs.readFile(fs.norm(p));const u=URL.createObjectURL(b);st.blobs.push(u);return u}catch(e){ui.toast('文件不存在：'+p,'err');return HOME}
  }
  addEventListener('message',st._mh=e=>{if(e.data&&e.data.liosNav)go(e.data.liosNav)});
  $$('[data-a]',root).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='back'&&st.hi>0){st.hi--;frame.src=st.hist[st.hi];setNav()}
    if(a==='fwd'&&st.hi<st.hist.length-1){st.hi++;frame.src=st.hist[st.hi];setNav()}
    if(a==='re')frame.src=frame.src;
    if(a==='home')go('about:home');
    if(a==='go')go(addr.value);
  });
  addr.addEventListener('keydown',e=>{if(e.key==='Enter')go(addr.value)});
  go(homeUrl||'about:home');
  return{el:root,go,cleanup(){removeEventListener('message',st._mh);st.blobs.forEach(u=>URL.revokeObjectURL(u))}};
}

  </div>
  <div class="findbar">

  </div>
  <div class="ed-main">

    <div class="ed-split" title="拖动调整"></div>
    <div class="ed-prev">
      <div class="ed-prev-hd"><span style="display:contents">${ICONS.eye}</span><span>实时预览</span><span style="flex:1"></span><span class="pv-st" style="font-family:var(--font-m);font-size:10.5px"></span></div>
      <iframe sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox"></iframe>

  <div class="ed-status"><span class="s-pos">行 1, 列 1</span><span class="s-sel"></span><span class="s-lines"></span><span class="s-chars"></span><span class="tsp"></span><span class="s-mode">HTML</span><span>UTF-8</span></div>`;
  const ta=$('.ed-ta',root),frame=$('iframe',root),modeSel=$('.mode',root);

  }else{

    ta.addEventListener('input',onEdit);

    });

  }
  const getVal=()=>cm?cm.getValue():ta.value;
  const setVal=v=>{if(cm)cm.setValue(v);else ta.value=v};
  function curMode(){return modeSel.value}
  function setMode(m){modeSel.value=m;if(cm){cm.setOption('mode',m)}updStatus();$('.br-open',root).classList.toggle('hidden',m!=='htmlmixed')}
  modeSel.addEventListener('change',()=>setMode(modeSel.value));
  /* ---- 预览 ---- */
  function wrapForPrev(code,mode){

    return`<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:system-ui;padding:20px;line-height:1.8;max-width:720px;margin:auto}</style></head><body>${esc(code).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</body></html>`;
  }

  const debPrev=debounce(()=>{if(st.auto)refreshPrev()},600);

  /* ---- 格式化 ---- */

    }catch(e){ui.toast('格式化失败：'+e.message,'err');return}

  $$('[data-a]',root).forEach(b=>b.onclick=async()=>{

    if(a==='find')openFind(false);

    if(a==='redo')cm?cm.redo():document.execCommand('redo');
    if(a==='import')impInp.click();
    if(a==='export'){
      const ext=edExtFor(curMode());
      const u=URL.createObjectURL(new Blob([getVal()],{type:'text/plain'}));
      const an=el('a');an.href=u;an.download='code.'+ext;an.click();setTimeout(()=>URL.revokeObjectURL(u),6000);
    }
    if(a==='save')save();
    if(a==='clear'){if(await ui.confirm('清空全部编辑器内容？')){setVal('');refreshPrev()}}
    if(a==='tab'){const u=URL.createObjectURL(new Blob([wrapForPrev(getVal(),curMode())],{type:'text/html'}));window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
    if(a==='browser'){const u=URL.createObjectURL(new Blob([getVal()],{type:'text/html'}));prevBlobs.push(u);launchApp('browser',u)}
  });
  impInp.addEventListener('change',async()=>{
    const f=impInp.files[0];if(!f)return;
    setVal(await f.text());setMode(edModeFor(extOf(f.name)));refreshPrev();
    ui.toast('已导入 '+f.name,'ok');
  });
  /* ---- 分割条 ---- */
  const split=$('.ed-split',root),codeEl=$('.ed-code',root),mainEl=$('.ed-main',root);
  split.addEventListener('pointerdown',e=>{

    };
    const up=()=>{split.classList.remove('on');split.removeEventListener('pointermove',mv);split.removeEventListener('pointerup',up);cm&&cm.refresh()};
    split.addEventListener('pointermove',mv);split.addEventListener('pointerup',up);
  });
  bus.on('resize',root._rz=()=>{cm&&cm.refresh()});
  /* ---- 载入文件 ---- */
  (async()=>{
    if(st.path){
      try{const t=await fs.readText(st.path);setVal(t);setMode(edModeFor(extOf(st.path)));if(extOf(st.path)==='html'||extOf(st.path)==='htm')$('.br-open',root).classList.remove('hidden')}

/* ================= 归档 / 压缩工具 ================= */
async function gunzip(buf){
  const ds=new DecompressionStream('gzip');
  return await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
}
async function parseTar(buf){
  const u8=new Uint8Array(buf),dec=new TextDecoder(),files=[];let off=0;
  while(off+512<=u8.length){
    const h=u8.subarray(off,off+512);
    if(h.every(b=>b===0))break;
    let name=dec.decode(h.subarray(0,100)).replace(/\0.*$/,'');
    const prefix=dec.decode(h.subarray(345,500)).replace(/\0.*$/,'');
    const sizeStr=dec.decode(h.subarray(124,136)).replace(/[^\d]/g,'');
    const size=parseInt(sizeStr||'0',8);
    const type=String.fromCharCode(h[156]);
    off+=512;
    const full=(prefix?prefix+'/':'')+name;
    if(type==='L'&&size>0){name=dec.decode(u8.subarray(off,off+size)).replace(/\0.*$/,'')}
    else if(type==='0'||type==='\0'){files.push({name:full.replace(/^\.\//,''),size,data:u8.slice(off,off+size).buffer})}
    else if(type==='5'){files.push({name:full.replace(/\/$/,'').replace(/^\.\//,''),dir:true})}
    off+=Math.ceil(size/512)*512;
  }
  return files;
}
function buildArchiver(path){
  const st={path,entries:[]};
  const root=el('div','zp');
  root.innerHTML=`
  <div class="tb">
    <span style="font-size:12.5px;color:var(--mut);padding:0 6px" class="cnt"></span>
    <span class="tsp"></span>
    <button class="tbtn" data-a="here">${ICONS.export}<span>解压到当前目录</span></button>
    <button class="tbtn" data-a="folder">${ICONS.folderOpen}<span>解压到文件夹</span></button>
  </div>
  <div class="prog" style="margin:8px 12px 0"><i></i></div>
  <div class="zp-list"></div>
  <div class="sb"><span class="hint">支持 zip / gz / tar / tar.gz / tgz / 7z（7z 需在线引擎）</span></div>`;
  const listEl=$('.zp-list',root),bar=$('.prog i',root);
  const kind=extOf(path);
  function renderList(){
    listEl.innerHTML='';
    st.entries.slice(0,800).forEach(en=>{
      const r=el('div','zp-it');
      r.innerHTML=`<span style="display:contents">${ICONS[en.dir?'folder':fileIconName(en.name)]}</span><span class="p">${esc(en.name||'/')}</span><span class="s">${en.dir?'目录':fmtSize(en.size)}</span>`;
      listEl.appendChild(r);
    });
    if(st.entries.length>800)listEl.appendChild(el('div','zp-it','<span class="p">… 其余 '+(st.entries.length-800)+' 项未显示</span>'));
    $('.cnt',root).textContent=`${st.entries.length} 个条目 · ${kind.toUpperCase()}`;
  }
  async function load(){
    try{
      if(kind==='zip'){
        if(typeof JSZip==='undefined')throw new Error('JSZip 未加载，请检查网络后刷新');
        const zip=await JSZip.loadAsync(await fs.readFile(path));
        zip.forEach((rel,f)=>st.entries.push({name:rel,dir:f.dir,size:f.dir?0:(f._data&&f._data.uncompressedSize)||0,zip:f}));
      }else if(kind==='gz'&&!/\.tar\.gz$/.test(path)&&kind!=='tgz'){
        const out=await gunzip(await fs.readBuffer(path));
        st.entries.push({name:baseName(path).replace(/\.gz$/i,''),size:out.byteLength,gzData:out});
      }else if(kind==='tar'||kind==='tgz'||/\.tar\.gz$/.test(path)){
        let buf=await fs.readBuffer(path);
        if(kind!=='tar')buf=await gunzip(buf);
        st.entries=await parseTar(buf);
      }else if(kind==='7z'){
        st.entries=await load7z();
      }else throw new Error('不支持的压缩格式 .'+kind);
      renderList();
    }catch(e){listEl.innerHTML=`<div style="padding:24px;color:var(--danger);font-size:13px">${ICONS.err} 读取失败：${esc(e.message)}</div>`}
  }
  async function load7z(){
    const mod=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    const S=mod.default||mod;
    await S.loadFS();
    const fn='arc_'+Date.now()+'.7z';
    S.FS.writeFile('/'+fn,new Uint8Array(await fs.readBuffer(path)));
    S.callMain(['x','-y','/'+fn,'-o/out']);
    const out=[];
    const walk=d=>{
      const node=S.FS.lookupPath(d).node;
      const ents=S.FS.readdir(d);
      for(const en of ents){if(en==='.'||en==='..')continue;const p=d==='/'?'/'+en:d+'/'+en;const stt=S.FS.stat(p);
        if(S.FS.isDir(stt.mode))walk(p);else out.push({name:p.replace(/^\//,''),size:stt.size,memPath:p})}
    };
    walk('/out');
    out._S=S;
    st._S=S;st._out=out;
    return out;
  }
  const setP=v=>bar.style.width=(v*100)+'%';
  async function extract(toFolder){
    const base=dirName(st.path);
    const stem=baseName(st.path).replace(/\.(zip|gz|tar|tgz|7z)$/i,'').replace(/\.tar$/i,'');
    const target=toFolder?joinPath(base,await uniqueName(base,stem)):base;
    if(toFolder)await fs.mkdir(target).catch(()=>{});
    let n=0;const total=st.entries.length||1;
    const tick=ui.toast('正在解压…','info',120000);
    try{
      for(const en of st.entries){
        if(en.dir){await fs.mkdir(joinPath(target,en.name)).catch(()=>{});continue}
        const clean=en.name.replace(/^[\\/]+/,'');if(!clean||clean.includes('..'))continue;
        let data;
        if(en.zip)data=await en.zip.async('arraybuffer');
        else if(en.gzData)data=en.gzData;
        else if(en.memPath)data=Sread(st._S,en.memPath);
        else if(en.data)data=en.data;
        else continue;
        await fs.writeFile(joinPath(target,clean),data);
        n++;setP(n/total);
      }
      ui.toast(`解压完成：${n} 个文件 → ${target}`,'ok');
    }catch(e){ui.toast('解压失败：'+e.message,'err')}
    tick.remove();
  }
  function Sread(S,p){const buf=S.FS.readFile(p);return buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength)}
  $$('[data-a]',root).forEach(b=>b.onclick=()=>extract(b.dataset.a==='folder'));
  load();
  return{el:root};
}

  wm.create({app:'zip',title:baseName(path)+' — 归档',icon:'appZip',w:620,h:460,content:z.el,minW:380});

function buildCalc(){
  const st={expr:'',last:null,tape:[]};
  const root=el('div','calc');
  root.innerHTML=`
  <div class="calc-main">
    <div class="c-disp"><div class="c-expr"></div><div class="c-num">0</div></div>
    <div class="c-grid">
      <button class="ck fn" data-k="C">C</button><button class="ck fn" data-k="(">(</button><button class="ck fn" data-k=")">)</button><button class="ck op" data-k="÷">÷</button>
      <button class="ck" data-k="7">7</button><button class="ck" data-k="8">8</button><button class="ck" data-k="9">9</button><button class="ck op" data-k="×">×</button>
      <button class="ck" data-k="4">4</button><button class="ck" data-k="5">5</button><button class="ck" data-k="6">6</button><button class="ck op" data-k="−">−</button>
      <button class="ck" data-k="1">1</button><button class="ck" data-k="2">2</button><button class="ck" data-k="3">3</button><button class="ck op" data-k="+">+</button>
      <button class="ck" data-k="0">0</button><button class="ck" data-k=".">.</button><button class="ck fn" data-k="%">%</button><button class="ck eq" data-k="=">=</button>
    </div>
  </div>
  <div class="c-tape"><h4>计算带</h4><div class="tlist" style="display:flex;flex-direction:column;gap:4px"></div></div>`;
  const numEl=$('.c-num',root),exprEl=$('.c-expr',root);
  function paint(){numEl.textContent=st.expr||'0';exprEl.textContent=st.last||''}
  function evalIt(){
    const src=st.expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
    if(!/^[\d+\-*/()./\s]*$/.test(src))return'表达式有误';
    try{const v=Function('"use strict";return('+src+')')();
      if(typeof v!=='number'||!isFinite(v))return'无法计算';
      const r=Math.round(v*1e12)/1e12;
      st.tape.unshift({e:st.expr+' =',r});st.tape=st.tape.slice(0,30);
      paintTape();st.last=st.expr+' =';st.expr=String(r);return null;
    }catch(e){return'表达式有误'}
  }
  function paintTape(){const t=$('.tlist',root);t.innerHTML='';st.tape.forEach(it=>{const d=el('div','tp-it');d.innerHTML=`<span>${esc(it.e)}</span><b>${esc(String(it.r))}</b>`;d.onclick=()=>{st.expr=String(it.r);paint()};t.appendChild(d)})}
  function press(k){
    if(k==='C'){st.expr='';st.last='';paint();return}
    if(k==='='){const err=evalIt();if(err){st.last=err}paint();return}
    if(st.expr==='0'&&/\d/.test(k))st.expr='';
    st.expr+=k;paint();
  }
  $$('.ck',root).forEach(b=>b.onclick=()=>{press(b.dataset.k);b.blur()});
  root.tabIndex=0;
  root.addEventListener('keydown',e=>{
    const m={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'BS','Escape':'C'};
    const k=m[e.key]||e.key;
    if(k==='BS'){st.expr=st.expr.slice(0,-1);paint();e.preventDefault();return}
    if(/^[\d+\-×÷().%]$/.test(k)||k==='='||k==='C'){press(k);e.preventDefault()}
  });
  paint();
  return{el:root,focus:()=>root.focus()};
}

  const colorsEl=$('.pt-colors',root);
  palette.forEach(c=>{
    const b=el('span','swb'+(c===st.color?' on':''));b.style.background=c;
    b.onclick=()=>{st.color=c;st.tool='brush';$$('.swb',colorsEl).forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('[data-t]',root).forEach(x=>x.classList.toggle('on',x.dataset.t==='brush'))};
    colorsEl.appendChild(b);
  });
  $('.cc',root).addEventListener('input',e=>{st.color=e.target.value;st.tool='brush'});
  $('.sz',root).addEventListener('input',e=>{st.size=+e.target.value;$('.szv',root).textContent=st.size;$('.tl',root).textContent=`${st.tool==='brush'?'画笔':'橡皮'} · ${st.size}px`});
  $$('[data-t]',root).forEach(b=>b.onclick=()=>{st.tool=b.dataset.t;$$('[data-t]',root).forEach(x=>x.classList.toggle('on',x===b));$('.tl',root).textContent=`${st.tool==='brush'?'画笔':'橡皮'} · ${st.size}px`});
  function push(){st.stack.push(cv.toDataURL());if(st.stack.length>15)st.stack.shift()}
  let drawing=null;
  cv.addEventListener('pointerdown',e=>{
    push();cv.setPointerCapture(e.pointerId);
    const r=cv.getBoundingClientRect();
    drawing={x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
    cx.beginPath();cx.moveTo(drawing.x,drawing.y);
    cx.strokeStyle=st.tool==='eraser'?'#fff':st.color;
    cx.lineWidth=st.tool==='eraser'?st.size*2.2:st.size;
    cx.lineTo(drawing.x+0.01,drawing.y+0.01);cx.stroke();
  });
  cv.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
    cx.lineTo(x,y);cx.stroke();
  });
  const end=()=>drawing=null;
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $$('[data-a]',root).forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==='undo'&&st.stack.length){const img=new Image();img.onload=()=>{cx.clearRect(0,0,W,H);cx.drawImage(img,0,0)};img.src=st.stack.pop()}
    if(a==='clear'){push();cx.fillStyle='#fff';cx.fillRect(0,0,W,H)}
    if(a==='save'){cv.toBlob(async bl=>{const n=await uniqueName('/图片','画作_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.png');await fs.writeFile(joinPath('/图片',n),bl);ui.toast('已保存到 /图片/'+n,'ok')},'image/png')}
    if(a==='dl'){cv.toBlob(bl=>{const u=URL.createObjectURL(bl);const an=el('a');an.href=u;an.download='画作.png';an.click();setTimeout(()=>URL.revokeObjectURL(u),6000)},'image/png')}
  });
  return{el:root};
}
