<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>砾光 OS · Gravelight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Martian+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" defer></script>
<style>
:root{--r:10px;--acc:#ff6b3d;--acc-ink:#1b0b04;--tbh:56px;--ti:0px;--bi:0px;--ease:cubic-bezier(.2,.9,.25,1);
--ui:'Schibsted Grotesk','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
--disp:'Unbounded','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
--mono:'Martian Mono','JetBrains Mono',ui-monospace,Consolas,monospace;--fs:14px}
[data-theme=dark]{--bg0:#090c0b;--bg1:#101513;--bg2:#171e1b;--bg3:#202925;--bg4:#2b3631;--line:rgba(200,235,215,.11);--line2:rgba(200,235,215,.22);--txt:#e6ede8;--txt2:#97a89e;--txt3:#64756c;--glass:rgba(12,17,15,.76);--shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 1px rgba(200,235,215,.05);--hov:rgba(200,235,215,.07);--sel:color-mix(in srgb,var(--acc) 24%,transparent);color-scheme:dark}
[data-theme=light]{--bg0:#d9d3c2;--bg1:#f3efe4;--bg2:#faf7ee;--bg3:#e8e2d2;--bg4:#d8d1be;--line:rgba(50,40,15,.14);--line2:rgba(50,40,15,.28);--txt:#1d231e;--txt2:#566057;--txt3:#8a9187;--glass:rgba(243,239,228,.82);--shadow:0 18px 44px rgba(60,45,10,.25),0 0 0 1px rgba(50,40,15,.08);--hov:rgba(50,40,15,.07);--sel:color-mix(in srgb,var(--acc) 20%,transparent);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0);color:var(--txt);font:400 var(--fs)/1.45 var(--ui);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,[contenteditable],.sel-ok,.sel-ok *{user-select:text;-webkit-user-select:text}
button{background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--txt3);background-clip:content-box;border:2px solid transparent}::-webkit-scrollbar-corner{background:transparent}
.ic{flex:none;display:inline-block;vertical-align:middle}
.no-anim *{animation:none!important;transition:none!important}
.noblur *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.noblur{--glass:var(--bg1)}
/* ===== 桌面 ===== */
#desk{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1s ease}
#wallB{opacity:0}
#icons{position:absolute;left:0;right:0;top:var(--ti);bottom:var(--bi);touch-action:none;overflow:hidden}
#wins{position:absolute;inset:0;pointer-events:none}
#wins>*{pointer-events:auto}
.dicon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;border-radius:calc(var(--r)*.8);cursor:pointer;transition:left .38s var(--ease),top .38s var(--ease),background .15s;touch-action:none;border:1px solid transparent;text-align:center}
.dicon.dragging{opacity:.45}
.dicon:hover{background:color-mix(in srgb,var(--bg1) 35%,transparent);border-color:var(--line)}
.dicon.sel{background:var(--sel);border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.dicon .nm{font-size:12.5px;line-height:1.25;color:#fff;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.8);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;padding:0 2px}
.dicon .tb{position:relative;display:grid;place-items:center}
.dicon .tb img.th{position:absolute;inset:6px 10px;width:calc(100% - 20px);height:calc(100% - 12px);object-fit:cover;border-radius:4px;box-shadow:0 2px 8px #0008;border:2px solid #fff3}
.drop-hl{outline:2px dashed var(--acc)!important;outline-offset:-2px;background:var(--sel)!important}
.rb{position:absolute;pointer-events:none;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent);z-index:50;border-radius:2px}
.ghost{position:fixed;z-index:99999;pointer-events:none;padding:6px 12px;border-radius:var(--r);background:var(--acc);color:var(--acc-ink);font-weight:600;box-shadow:0 10px 30px #0008;transform:translate(-50%,-120%)}
/* ===== 窗口 ===== */
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:winIn .34s var(--ease) both;transition:opacity .2s,transform .28s var(--ease),filter .2s}
.win.anim{transition:left .28s var(--ease),top .28s var(--ease),width .28s var(--ease),height .28s var(--ease),opacity .2s,transform .28s var(--ease)}
.win.closing{animation:winOut .2s ease both;pointer-events:none}
.win.mini{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none}
.win.hidden{display:none}
.win.peek-hide{opacity:.06!important;pointer-events:none!important}
.win.peek-show{display:flex!important;opacity:1!important;transform:none!important;z-index:9998!important}
.win.max{border-radius:0}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.965)}}
@keyframes winOut{to{opacity:0;transform:scale(.95) translateY(8px)}}
.wt{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:linear-gradient(var(--bg3),var(--bg2));border-bottom:1px solid var(--line);position:relative;touch-action:none;cursor:default}
.wt::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--acc) 0 14%,transparent 14% 15.5%,color-mix(in srgb,var(--acc) 55%,transparent) 15.5% 26%,transparent 26% 27.5%,color-mix(in srgb,var(--acc) 25%,transparent) 27.5% 36%,transparent 36%);opacity:.35;transition:opacity .2s}
.win.focus .wt::before{opacity:1;filter:drop-shadow(0 0 6px var(--acc))}
.wt .wi{color:var(--acc);display:grid;place-items:center}
.wt .wx{flex:1;min-width:0;font:600 12.5px var(--disp);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt2)}
.win.focus .wx{color:var(--txt)}
.wc{display:flex;gap:3px}
.wc button{width:34px;height:26px;display:grid;place-items:center;border-radius:calc(var(--r)*.5);color:var(--txt2);transition:background .15s,color .15s}
.wc button:hover{background:var(--hov);color:var(--txt)}
.wc button.cl:hover{background:#e5484d;color:#fff}
.wb{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:20;touch-action:none}
.rz[data-d=n]{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}.rz[data-d=s]{bottom:0;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz[data-d=e]{right:0;top:10px;bottom:10px;width:6px;cursor:ew-resize}.rz[data-d=w]{left:0;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz[data-d=ne]{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}.rz[data-d=nw]{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz[data-d=se]{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}.rz[data-d=sw]{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.win.max .rz{display:none}
#snap{position:absolute;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:var(--r);z-index:9990;pointer-events:none;opacity:0;transition:all .18s var(--ease);box-shadow:0 0 40px color-mix(in srgb,var(--acc) 35%,transparent) inset}
#snap.on{opacity:1}
#assist{position:absolute;z-index:9991;display:none;flex-wrap:wrap;gap:12px;align-content:center;justify-content:center;padding:20px;background:var(--glass);backdrop-filter:blur(18px);border-radius:var(--r);border:1px solid var(--line2)}
#assist.on{display:flex}
#assist .ac{width:170px;height:110px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:8px;text-align:center;transition:.15s}
#assist .ac:hover{border-color:var(--acc);transform:translateY(-3px)}
/* ===== 任务栏 ===== */
#tb{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);height:var(--tbh);max-width:calc(100% - 16px);display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:calc(var(--r) + 8px);background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border:1px solid var(--line2);box-shadow:var(--shadow);z-index:9000;transition:transform .4s var(--ease),opacity .3s}
#tb.top{bottom:auto;top:10px}
#tb.hide{display:none}
#tb.auto{transform:translateX(-50%) translateY(calc(100% + 24px))}
#tb.top.auto{transform:translateX(-50%) translateY(calc(-100% - 24px))}
#tb.auto:hover,#tb.auto.show{transform:translateX(-50%)}
#tbHot{position:fixed;left:0;right:0;height:8px;z-index:8999;bottom:0;display:none}
#tbHot.on{display:block}#tbHot.top{top:0;bottom:auto}
.tbb{position:relative;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:calc(var(--r)*.9);color:var(--txt);transition:background .15s,transform .2s var(--ease);padding:0 8px;flex:none}
.tbb:hover{background:var(--hov);transform:translateY(-2px)}
.tbb:active{transform:scale(.94)}
.tbb .lb{font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
.tb-labels .tbb.app .lb{display:block}
.tbb.app::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:3px;border-radius:2px;background:var(--acc);transform:translateX(-50%);transition:width .25s var(--ease);box-shadow:0 0 8px var(--acc)}
.tbb.app.run::after{width:12px;opacity:.6}
.tbb.app.act{background:var(--hov)}
.tbb.app.act::after{width:24px;opacity:1}
.tbb .x{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#e5484d;color:#fff;display:none;place-items:center}
.tbb.app:hover .x{display:grid}
.tbsep{width:1px;height:26px;background:var(--line2);margin:0 4px;flex:none}
#tbApps{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
#tbApps::-webkit-scrollbar{display:none}
#clock{flex-direction:column;gap:0;font-family:var(--mono);font-size:12px;line-height:1.2;min-width:78px;padding:0 10px}
#clock b{font-weight:600;font-size:13px;letter-spacing:-.02em}#clock span{color:var(--txt2);font-size:10.5px}
#showdesk{width:8px;height:36px;border-radius:4px;border-left:1px solid var(--line2);margin-left:2px;flex:none;transition:background .2s}
#showdesk:hover{background:var(--acc)}
.logo{width:26px;height:26px;display:block}
#peekcard{position:fixed;z-index:9100;display:none;width:210px;padding:10px;border-radius:calc(var(--r) + 2px);background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:var(--shadow);pointer-events:none;animation:pop .2s var(--ease)}
#peekcard .pv{height:84px;border-radius:calc(var(--r)*.7);background:repeating-linear-gradient(135deg,var(--bg3) 0 8px,var(--bg2) 8px 16px);display:grid;place-items:center;color:var(--acc);margin-bottom:8px;border:1px solid var(--line)}
#peekcard .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
/* ===== 开始菜单 / 日历 ===== */
.pane{position:fixed;z-index:9050;background:var(--glass);backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--line2);border-radius:calc(var(--r) + 8px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(24px) scale(.97);transition:opacity .22s,transform .3s var(--ease)}
.pane.on{opacity:1;pointer-events:auto;transform:none}
#start{left:50%;margin-left:-300px;width:600px;bottom:calc(var(--tbh) + 22px);height:min(640px,calc(100% - var(--tbh) - 50px));display:flex;flex-direction:column;overflow:hidden}
#start.top{bottom:auto;top:calc(var(--tbh) + 22px)}
.st-s{margin:16px 18px 6px;position:relative}
.st-s input{width:100%;height:42px;border-radius:calc(var(--r)*1.2);background:var(--bg2);border:1px solid var(--line2);padding:0 14px 0 42px;outline:0;transition:.2s}
.st-s input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.st-s .ic{position:absolute;left:14px;top:12px;color:var(--txt2)}
.st-b{flex:1;overflow:auto;padding:6px 18px 10px}
.st-h{font:600 11px var(--mono);letter-spacing:.14em;color:var(--txt3);margin:14px 4px 8px;text-transform:uppercase}
.st-g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.st-a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:var(--r);font-size:12px;transition:.15s;animation:rise .4s var(--ease) both;cursor:pointer;text-align:center}
.st-a:hover{background:var(--hov);transform:translateY(-2px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.st-r{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r);cursor:pointer;min-width:0}
.st-r:hover{background:var(--hov)}
.st-r .t{min-width:0;flex:1}.st-r .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-r .t i{display:block;font-style:normal;font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-f{height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg0) 40%,transparent)}
.st-f .u{display:flex;align-items:center;gap:10px;flex:1;font:600 12px var(--disp)}
.st-f .av{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 200deg,var(--acc),#19c28a,var(--acc));display:grid;place-items:center;color:var(--acc-ink)}
.ibtn{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:var(--txt2);transition:.15s}
.ibtn:hover{background:var(--hov);color:var(--txt)}
#cal{right:12px;bottom:calc(var(--tbh) + 22px);width:330px;padding:16px}
#cal.top{bottom:auto;top:calc(var(--tbh) + 22px)}
#cal .big{font:600 34px var(--mono);letter-spacing:-.04em}
#cal .dt{color:var(--txt2);margin-bottom:12px}
.cal-h{display:flex;align-items:center;gap:4px;margin:10px 0 6px}.cal-h b{flex:1;font:600 13px var(--disp)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g i{font-style:normal;font-size:11px;color:var(--txt3);padding:4px 0}
.cal-g button{height:36px;border-radius:calc(var(--r)*.7);font-family:var(--mono);font-size:12px;transition:.12s}
.cal-g button:hover{background:var(--hov)}.cal-g button.o{color:var(--txt3)}
.cal-g button.sel{outline:1px solid var(--acc)}.cal-g button.td{background:var(--acc);color:var(--acc-ink);font-weight:700}
/* ===== 菜单 / 对话框 / 提示 ===== */
.menu{position:fixed;z-index:99990;min-width:210px;padding:5px;border-radius:calc(var(--r) + 2px);background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--line2);box-shadow:var(--shadow);animation:pop .16s var(--ease);max-height:calc(100vh - 16px);overflow:auto}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:calc(var(--r)*.6);cursor:pointer;position:relative;white-space:nowrap}
.mi:hover,.mi.o{background:var(--hov)}.mi.dis{opacity:.4;pointer-events:none}
.mi .ic{color:var(--txt2)}.mi .k{margin-left:auto;padding-left:20px;font:11px var(--mono);color:var(--txt3)}
.mi.danger{color:#ff6b6b}.mi.on .ic{color:var(--acc)}
.mi .sub{position:absolute;left:100%;top:-6px;display:none;margin-left:4px;cursor:default}
.mi.o>.sub{display:block}
.msep{height:1px;background:var(--line);margin:4px 6px}
.mhd{font:600 10px var(--mono);letter-spacing:.12em;color:var(--txt3);padding:6px 10px 2px}
#modal{position:fixed;inset:0;z-index:99000;display:none;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);padding:12px}
#modal.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:min(460px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);animation:pop .25s var(--ease);overflow:hidden}
.dlg>h3{margin:0;padding:16px 20px 4px;font:600 15px var(--disp)}
.dlg .bd{padding:10px 20px 14px;overflow:auto;color:var(--txt2)}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg2)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:calc(var(--r)*.7);background:var(--bg3);border:1px solid var(--line);color:var(--txt);white-space:nowrap;transition:.15s;flex:none;font-size:13px}
.btn:hover{background:var(--bg4);border-color:var(--line2)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{background:#e5484d;color:#fff;border-color:transparent}
.btn.on{background:color-mix(in srgb,var(--acc) 26%,var(--bg3));border-color:var(--acc)}
.btn.dis,.btn:disabled{opacity:.4;pointer-events:none}
.btn.ic1{width:32px;padding:0;justify-content:center}
.in{height:34px;border-radius:calc(var(--r)*.7);background:var(--bg2);border:1px solid var(--line2);padding:0 10px;outline:0;min-width:0;transition:.15s;color:var(--txt)}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
select.in{padding-right:6px}
#toasts{position:fixed;right:14px;bottom:calc(var(--tbh) + 28px);z-index:99500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:340px;padding:10px 14px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line2);border-left:3px solid var(--acc);box-shadow:var(--shadow);animation:pop .3s var(--ease);display:flex;gap:10px;align-items:center}
.toast.err{border-left-color:#e5484d}.toast.ok{border-left-color:#3dd68c}
.toast .bar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:6px}.toast .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--bg4);border-top-color:var(--acc);animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.loadbar{position:absolute;left:0;right:0;top:0;height:2px;overflow:hidden;z-index:30;display:none}
.loadbar.on{display:block}.loadbar::after{content:"";position:absolute;top:0;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{left:-35%}to{left:100%}}
.loadmask{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg1) 70%,transparent);z-index:25;flex-direction:column;gap:10px;color:var(--txt2)}
.loadmask.on{display:flex}.loadmask .spin{width:30px;height:30px;border-width:3px}
.darkmask{position:absolute;inset:0;background:var(--bg0);display:grid;place-items:center;z-index:5;transition:opacity .35s;gap:10px}
.darkmask.off{opacity:0;pointer-events:none}
/* ===== 通用工具条 ===== */
.tbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none;overflow-x:auto;scrollbar-width:thin}
.tbar .sp{flex:1}.tbar .vs{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.sbar{flex:none;height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);background:var(--bg2);font:11px var(--mono);color:var(--txt2);overflow:hidden;white-space:nowrap}
.sbar .sp{flex:1}
