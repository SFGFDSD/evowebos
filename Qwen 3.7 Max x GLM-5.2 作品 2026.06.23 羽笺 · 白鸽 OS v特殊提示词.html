<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>羽笺 · 白鸽 OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;700&family=Ma+Shan+Zheng&family=LXGW+WenKai&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/matchesonscrollbar.min.css">
<style>
/* ============ 羽笺 · 白鸽 美学 ============ */
:root{
  --paper:          #f2ebd9;
  --paper-soft:     #ebe2cb;
  --paper-deep:     #e0d4b3;
  --paper-edge:     #c9b98e;
  --ink:            #2a2622;
  --ink-soft:       #4a443c;
  --ink-faint:      #857c6b;
  --ink-line:       #b8ad8f;
  --cinnabar:       #a94a34;
  --cinnabar-soft:  #c8725a;
  --jade:           #5d7a6d;
  --jade-soft:      #8aa599;
  --indigo:         #2f3a55;
  --seal:           #8a2b1e;
  --shadow:         rgba(42, 38, 34, .18);
  --shadow-deep:    rgba(42, 38, 34, .35);
  --font-display:   'ZCOOL XiaoWei','Ma Shan Zheng',serif;
  --font-body:      'LXGW WenKai','Noto Serif SC',serif;
  --font-mono:      'LXGW WenKai Mono','Noto Serif SC',ui-monospace,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:var(--font-body);color:var(--ink);user-select:none;-webkit-user-select:none}
body{
  background:
    radial-gradient(1200px 800px at 20% 30%, rgba(255,250,235,.9), transparent 60%),
    radial-gradient(900px 600px at 80% 70%, rgba(230,220,195,.8), transparent 60%),
    linear-gradient(135deg,#efe6cf 0%, #e5d9b8 50%, #dccba2 100%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.14 0 0 0 0 0.11 0 0 0 0.10 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  opacity:.55;mix-blend-mode:multiply;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(90,80,60,.025) 3px 4px),
    repeating-linear-gradient(90deg, transparent 0 4px, rgba(90,80,60,.02) 4px 5px);
}

/* 桌面 */
#desktop{
  position:fixed;inset:0;z-index:1;overflow:hidden;
}
#wallpaper{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  transition:opacity .6s ease;
}
.wp-xuan{
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,252,240,.9), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(200,180,140,.6), transparent 60%),
    linear-gradient(135deg,#f5eed9,#e8dcc0);
}
.wp-mountain{
  background:
    linear-gradient(180deg, transparent 40%, rgba(93,122,109,.35) 40%, rgba(93,122,109,.55) 70%, rgba(47,58,85,.7) 100%),
    radial-gradient(ellipse at 50% 30%, rgba(255,250,235,.8), transparent 60%),
    linear-gradient(180deg,#e8dcc0 0%, #d4c198 100%);
}
.wp-dove{
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.4), transparent 30%),
    radial-gradient(circle at 75% 60%, rgba(255,255,255,.3), transparent 25%),
    linear-gradient(180deg,#c9d4d1 0%, #97a8a5 60%, #6b7d7a 100%);
}
.wp-cinnabar{
  background:
    radial-gradient(circle at 80% 20%, rgba(200,114,90,.35), transparent 50%),
    linear-gradient(135deg,#f2e8d0 0%, #e8c9a8 50%, #c88a6b 100%);
}

/* 桌面图标 */
#icon-layer{position:absolute;inset:0;z-index:2}
.desk-icon{
  position:absolute;width:86px;text-align:center;cursor:pointer;
  padding:6px 4px;border-radius:6px;
  transition:background .15s;
  touch-action:none;
}
.desk-icon:hover{background:rgba(42,38,34,.08)}
.desk-icon.selected{background:rgba(169,74,52,.18);outline:1px dashed var(--cinnabar)}
.desk-icon .ic{
  width:52px;height:52px;margin:0 auto 4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);
  filter:drop-shadow(0 1px 0 rgba(255,252,240,.6));
}
.desk-icon .ic svg{width:100%;height:100%}
.desk-icon .name{
  font-size:12px;color:var(--ink);
  background:rgba(242,235,217,.7);
  padding:2px 4px;border-radius:3px;
  word-wrap:break-word;line-height:1.2;
  text-shadow:0 0 2px rgba(242,235,217,.9);
}

/* 选择框 */
#selbox{position:absolute;border:1px dashed var(--cinnabar);background:rgba(169,74,52,.12);pointer-events:none;z-index:3;display:none}

/* Dock */
#dock{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
  z-index:500;
  display:flex;gap:6px;padding:8px 12px;
  background:rgba(242,235,217,.85);
  backdrop-filter:blur(12px) saturate(1.1);
  -webkit-backdrop-filter:blur(12px) saturate(1.1);
  border:1px solid var(--paper-edge);
  border-radius:16px;
  box-shadow:0 6px 24px var(--shadow), inset 0 1px 0 rgba(255,252,240,.7);
}
.dock-item{
  width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  color:var(--ink-soft);
  transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s;
}
.dock-item:hover{transform:translateY(-6px) scale(1.08);background:rgba(255,250,235,.6)}
.dock-item svg{width:28px;height:28px}
.dock-item.running::after{
  content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--cinnabar);
}
.dock-item .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  font-size:11px;padding:3px 8px;background:var(--ink);color:var(--paper);
  border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .2s;font-family:var(--font-body);
}
.dock-item:hover .tip{opacity:1}

/* 开始按钮 */
#start-btn{
  position:fixed;left:10px;bottom:10px;z-index:501;
  width:54px;height:54px;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,#f5eed9,#dccba2);
  border:1px solid var(--paper-edge);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px var(--shadow);
  color:var(--cinnabar);
  transition:transform .3s;
}
#start-btn:hover{transform:rotate(-15deg) scale(1.05)}
#start-btn svg{width:32px;height:32px}

/* 开始菜单 */
#start-menu{
  position:fixed;left:10px;bottom:74px;z-index:502;
  width:320px;max-height:480px;
  background:rgba(242,235,217,.95);
  backdrop-filter:blur(14px);
  border:1px solid var(--paper-edge);
  border-radius:14px;
  padding:14px;
  box-shadow:0 12px 40px var(--shadow-deep);
  display:none;
  animation:popUp .28s cubic-bezier(.3,1.4,.5,1);
}
#start-menu.show{display:block}
@keyframes popUp{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
#start-menu h3{
  font-family:var(--font-display);font-size:20px;margin:0 0 10px;
  color:var(--cinnabar);border-bottom:1px solid var(--ink-line);padding-bottom:6px;
  font-weight:normal;letter-spacing:2px;
}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.app-tile{
  padding:10px 4px;text-align:center;cursor:pointer;border-radius:8px;
  transition:background .15s;
}
.app-tile:hover{background:rgba(169,74,52,.12)}
.app-tile svg{width:32px;height:32px;color:var(--ink-soft);display:block;margin:0 auto 4px}
.app-tile .tn{font-size:11px;color:var(--ink);line-height:1.2}

/* 右键菜单 */
#ctx-menu{
  position:fixed;z-index:9000;
  min-width:180px;
  background:rgba(242,235,217,.97);
  backdrop-filter:blur(12px);
  border:1px solid var(--paper-edge);
  border-radius:8px;padding:4px;
  box-shadow:0 6px 20px var(--shadow-deep);
  display:none;
}
#ctx-menu.show{display:block}
.ctx-item{
  padding:7px 14px;cursor:pointer;border-radius:4px;
  font-size:13px;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.ctx-item:hover{background:rgba(169,74,52,.15);color:var(--cinnabar)}
.ctx-item svg{width:14px;height:14px}
.ctx-sep{height:1px;background:var(--ink-line);margin:4px 6px;opacity:.5}
.ctx-item.disabled{opacity:.4;cursor:not-allowed}

/* 窗口 */
.window{
  position:absolute;z-index:10;
  background:var(--paper);
  border:1px solid var(--ink-line);
  border-radius:8px;
  box-shadow:0 10px 40px var(--shadow-deep), 0 2px 6px var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
  min-width:260px;min-height:160px;
  animation:winOpen .22s cubic-bezier(.3,1.4,.5,1);
}
@keyframes winOpen{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.window.minimized{display:none}
.window.maximized{border-radius:0;border:none}
.window.focused{box-shadow:0 14px 50px var(--shadow-deep), 0 2px 6px var(--shadow), 0 0 0 1px var(--cinnabar-soft)}

.titlebar{
  height:36px;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 10px;
  background:linear-gradient(180deg,#f5eed9,#ebe2cb);
  border-bottom:1px solid var(--ink-line);
  cursor:move;
  position:relative;
}
.titlebar::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,252,240,.9),transparent);
}
.win-title{
  font-family:var(--font-display);font-size:15px;letter-spacing:1.5px;
  color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win-ctrls{display:flex;gap:6px;align-items:center}
.win-btn{
  width:22px;height:22px;border-radius:50%;border:1px solid var(--ink-line);
  background:var(--paper-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);transition:all .15s;
}
.win-btn:hover{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar)}
.win-btn svg{width:12px;height:12px}
.win-body{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;background:var(--paper)}

/* 调整大小手柄 */
.rz{position:absolute;z-index:5}
.rz-n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz-s{bottom:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz-e{right:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz-w{left:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz-ne{top:-3px;right:-3px;width:12px;height:12px;cursor:nesw-resize}
.rz-nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz-se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz-sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:nesw-resize}

/* 对话框 */
#dialog-layer{position:fixed;inset:0;z-index:8000;display:none;align-items:center;justify-content:center;background:rgba(42,38,34,.3)}
#dialog-layer.show{display:flex}
.dlg{
  background:var(--paper);border:1px solid var(--ink-line);border-radius:10px;
  padding:20px;min-width:300px;max-width:90vw;
  box-shadow:0 20px 60px var(--shadow-deep);
  animation:popUp .22s;
}
.dlg h3{font-family:var(--font-display);margin:0 0 12px;color:var(--cinnabar);font-weight:normal;letter-spacing:1px}
.dlg p{margin:0 0 14px;line-height:1.6;color:var(--ink-soft);font-size:14px}
.dlg input[type=text],.dlg input[type=password]{
  width:100%;padding:8px 10px;border:1px solid var(--ink-line);border-radius:5px;
  background:var(--paper-soft);font-family:var(--font-body);font-size:14px;color:var(--ink);
  margin-bottom:14px;outline:none;
}
.dlg input:focus{border-color:var(--cinnabar)}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end}
.btn{
  padding:7px 16px;border:1px solid var(--ink-line);border-radius:5px;cursor:pointer;
  background:var(--paper-soft);color:var(--ink);font-family:var(--font-body);font-size:13px;
  transition:all .15s;
}
.btn:hover{background:var(--paper-deep)}
.btn.primary{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar)}
.btn.primary:hover{background:var(--seal)}

/* 文件管理器 */
.fe{display:flex;flex-direction:column;height:100%}
.fe-toolbar{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  background:var(--paper-soft);border-bottom:1px solid var(--ink-line);
  flex-shrink:0;flex-wrap:wrap;
}
.fe-btn{
  width:28px;height:28px;border:1px solid var(--ink-line);border-radius:5px;
  background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.fe-btn:hover{background:var(--paper-deep);color:var(--cinnabar)}
.fe-btn:disabled{opacity:.4;cursor:not-allowed}
.fe-btn svg{width:14px;height:14px}
.fe-crumb{
  flex:1;display:flex;align-items:center;gap:2px;
  padding:4px 8px;background:var(--paper);border:1px solid var(--ink-line);border-radius:5px;
  font-size:12px;min-width:0;overflow-x:auto;white-space:nowrap;
  font-family:var(--font-mono);
}
.fe-crumb span{cursor:pointer;padding:2px 4px;border-radius:3px}
.fe-crumb span:hover{background:var(--paper-deep);color:var(--cinnabar)}
.fe-search{
  padding:4px 8px;border:1px solid var(--ink-line);border-radius:5px;background:var(--paper);
  font-family:var(--font-body);font-size:12px;width:140px;outline:none;
}
.fe-search:focus{border-color:var(--cinnabar)}

.fe-main{display:flex;flex:1;min-height:0}
.fe-side{
  width:160px;background:var(--paper-soft);border-right:1px solid var(--ink-line);
  overflow-y:auto;flex-shrink:0;padding:6px;
}
.fe-side-item{
  display:flex;align-items:center;gap:6px;padding:5px 6px;cursor:pointer;
  border-radius:4px;font-size:12px;color:var(--ink);
}
.fe-side-item:hover{background:var(--paper-deep)}
.fe-side-item.active{background:rgba(169,74,52,.15);color:var(--cinnabar)}
.fe-side-item svg{width:14px;height:14px;flex-shrink:0}

.fe-list-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.fe-header{
  display:flex;padding:6px 10px;background:var(--paper-soft);
  border-bottom:1px solid var(--ink-line);font-size:12px;color:var(--ink-faint);
  flex-shrink:0;
}
.fe-header>div{cursor:pointer;display:flex;align-items:center;gap:4px}
.fe-header>div:hover{color:var(--cinnabar)}
.fe-col-name{flex:1;min-width:0}
.fe-col-type{width:90px}
.fe-col-size{width:80px;text-align:right}
.fe-col-date{width:140px}

.fe-list{flex:1;overflow-y:auto;padding:4px}
.fe-item{
  display:flex;align-items:center;padding:5px 10px;cursor:pointer;
  border-radius:4px;font-size:12px;gap:8px;
}
.fe-item:hover{background:var(--paper-deep)}
.fe-item.selected{background:rgba(169,74,52,.15);color:var(--cinnabar)}
.fe-item .fi-ic{width:22px;height:22px;flex-shrink:0;color:var(--ink-soft)}
.fe-item .fi-ic svg{width:100%;height:100%}
.fe-item .fi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fe-item .fi-type{width:90px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis}
.fe-item .fi-size{width:80px;text-align:right;color:var(--ink-faint)}
.fe-item .fi-date{width:140px;color:var(--ink-faint)}

.fe-empty{padding:40px;text-align:center;color:var(--ink-faint);font-size:13px}

/* 记事本 */
.np{display:flex;flex-direction:column;height:100%}
.np-bar{
  display:flex;gap:4px;padding:5px 8px;background:var(--paper-soft);
  border-bottom:1px solid var(--ink-line);flex-shrink:0;flex-wrap:wrap;
}
.np-bar .btn{padding:3px 10px;font-size:12px}
.np-ta{
  flex:1;width:100%;border:none;outline:none;resize:none;
  padding:14px 18px;font-family:var(--font-mono);font-size:14px;line-height:1.7;
  background:var(--paper);color:var(--ink);
}
.np-status{
  padding:3px 10px;background:var(--paper-soft);border-top:1px solid var(--ink-line);
  font-size:11px;color:var(--ink-faint);display:flex;gap:14px;flex-shrink:0;
}

/* CSV 表格 */
.csv-view{display:flex;flex-direction:column;height:100%}
.csv-bar{padding:5px 8px;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);display:flex;gap:6px;flex-shrink:0}
.csv-tabs{display:flex;gap:2px}
.csv-tab{padding:3px 10px;font-size:12px;cursor:pointer;border:1px solid var(--ink-line);border-radius:4px;background:var(--paper)}
.csv-tab.active{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar)}
.csv-table-wrap{flex:1;overflow:auto;background:var(--paper)}
.csv-table{border-collapse:collapse;font-size:12px;font-family:var(--font-mono)}
.csv-table th,.csv-table td{border:1px solid var(--ink-line);padding:4px 8px;white-space:nowrap}
.csv-table th{background:var(--paper-soft);position:sticky;top:0;z-index:1}

/* HTML 编辑器 */
.he{display:flex;flex-direction:column;height:100%}
.he-bar{
  display:flex;gap:4px;padding:5px 8px;background:var(--paper-soft);
  border-bottom:1px solid var(--ink-line);flex-shrink:0;flex-wrap:wrap;align-items:center;
}
.he-bar .btn{padding:3px 10px;font-size:12px}
.he-bar select{padding:3px 6px;border:1px solid var(--ink-line);border-radius:4px;background:var(--paper);font-family:var(--font-body);font-size:12px}
.he-split{display:flex;flex:1;min-height:0}
.he-edit{flex:1;display:flex;min-width:200px;overflow:hidden}
.he-edit .CodeMirror{flex:1;height:100%;font-family:var(--font-mono);font-size:13px}
.he-divider{width:5px;background:var(--ink-line);cursor:ew-resize;flex-shrink:0}
.he-prev{flex:1;background:#fff;min-width:120px;display:flex}
.he-prev iframe{flex:1;width:100%;height:100%;border:none;background:#fff}
.he-status{
  padding:3px 10px;background:var(--paper-soft);border-top:1px solid var(--ink-line);
  font-size:11px;color:var(--ink-faint);display:flex;gap:14px;flex-shrink:0;flex-wrap:wrap;
}
.he-findbar{
  display:none;padding:6px 8px;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);
  gap:6px;flex-wrap:wrap;align-items:center;
}
.he-findbar.show{display:flex}
.he-findbar input{padding:3px 6px;border:1px solid var(--ink-line);border-radius:4px;background:var(--paper);font-family:var(--font-mono);font-size:12px;outline:none;width:140px}
.he-findbar .count{font-size:11px;color:var(--ink-faint);min-width:60px}
.he-findbar .sw{
  width:24px;height:24px;border:1px solid var(--ink-line);border-radius:4px;background:var(--paper);
  cursor:pointer;font-size:11px;font-family:var(--font-mono);
}
.he-findbar .sw.on{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar)}
.cm-hl-match{background:rgba(255,200,50,.45) !important}
.cm-hl-cur{background:rgba(200,114,90,.55) !important}

/* 图片查看器 */
.imgv{display:flex;flex-direction:column;height:100%;background:#1a1714}
.imgv-bar{padding:5px 8px;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.imgv-bar .btn{padding:3px 10px;font-size:12px}
.imgv-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:
  repeating-conic-gradient(#2a2622 0 25%, #1a1714 0 50%) 0 0 / 20px 20px}
.imgv-stage img{max-width:100%;max-height:100%;transition:transform .15s}

/* 漫画阅读器 */
.mg{display:flex;flex-direction:column;height:100%;background:#000}
.mg-bar{padding:5px 8px;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.mg-bar .btn{padding:3px 10px;font-size:12px}
.mg-scroll{flex:1;overflow-y:auto;background:#000;display:flex;flex-direction:column;align-items:center}
.mg-scroll img{width:100%;max-width:1000px;display:block;pointer-events:none}
.mg-loading{color:#888;padding:40px;font-size:13px;text-align:center}
.mg.fullscreen{position:fixed;inset:0;z-index:9999;border-radius:0}
.mg.fullscreen .titlebar{display:none}
.mg-fs-exit{
  position:fixed;top:12px;right:12px;z-index:10000;
  width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
  border:1px solid rgba(255,255,255,.3);cursor:pointer;
  display:none;align-items:center;justify-content:center;font-size:18px;
}
.mg.fullscreen .mg-fs-exit{display:flex}

/* 浏览器 */
.br{display:flex;flex-direction:column;height:100%}
.br-bar{padding:6px 8px;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);display:flex;gap:6px;align-items:center;flex-shrink:0}
.br-bar input{flex:1;padding:5px 10px;border:1px solid var(--ink-line);border-radius:16px;background:var(--paper);font-family:var(--font-mono);font-size:12px;outline:none}
.br-bar input:focus{border-color:var(--cinnabar)}
.br-frame{flex:1;background:#fff}
.br-frame iframe{width:100%;height:100%;border:none}

/* 计算器 */
.calc{display:flex;flex-direction:column;height:100%;padding:10px;background:var(--paper-soft)}
.calc-disp{
  background:var(--paper);border:1px solid var(--ink-line);border-radius:6px;
  padding:12px;text-align:right;font-family:var(--font-mono);font-size:22px;
  margin-bottom:10px;min-height:70px;overflow-wrap:break-word;
}
.calc-disp .cv{font-size:26px;color:var(--ink);font-weight:500}
.calc-disp .ce{font-size:11px;color:var(--ink-faint);min-height:14px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.calc-key{
  border:1px solid var(--ink-line);border-radius:6px;background:var(--paper);
  font-family:var(--font-mono);font-size:16px;cursor:pointer;color:var(--ink);
  transition:all .1s;
}
.calc-key:hover{background:var(--paper-deep)}
.calc-key:active{transform:scale(.96)}
.calc-key.op{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar)}
.calc-key.eq{background:var(--jade);color:var(--paper);border-color:var(--jade)}

/* 画板 */
.paint{display:flex;flex-direction:column;height:100%}
.paint-bar{padding:5px 8px;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.paint-bar .btn{padding:3px 10px;font-size:12px}
.paint-bar input[type=color]{width:28px;height:26px;border:1px solid var(--ink-line);border-radius:4px;background:var(--paper);cursor:pointer;padding:0}
.paint-bar input[type=range]{width:80px}
.paint-canvas-wrap{flex:1;overflow:auto;background:#ddd;display:flex;align-items:center;justify-content:center;padding:10px}
.paint-canvas-wrap canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:crosshair;touch-action:none}

/* 音视频 */
.av{display:flex;flex-direction:column;height:100%;background:#0a0806}
.av-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av-stage video,.av-stage audio{max-width:100%;max-height:100%}

/* PDF */
.pdfv{height:100%}
.pdfv iframe{width:100%;height:100%;border:none}

/* 设置 */
.set{display:flex;flex-direction:column;height:100%}
.set-tabs{display:flex;background:var(--paper-soft);border-bottom:1px solid var(--ink-line);flex-shrink:0}
.set-tab{padding:8px 16px;cursor:pointer;font-size:13px;border-right:1px solid var(--ink-line)}
.set-tab.active{background:var(--paper);color:var(--cinnabar);font-weight:500}
.set-body{flex:1;overflow-y:auto;padding:16px}
.set-section{margin-bottom:24px}
.set-section h4{font-family:var(--font-display);margin:0 0 10px;color:var(--cinnabar);font-weight:normal;letter-spacing:1px;font-size:16px;border-bottom:1px dashed var(--ink-line);padding-bottom:4px}
.set-row{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:13px;flex-wrap:wrap}
.set-row label{min-width:100px;color:var(--ink-soft)}

/* 存储可视化 */
.storage-bar{height:22px;border:1px solid var(--ink-line);border-radius:5px;overflow:hidden;display:flex;background:var(--paper-soft);position:relative;margin:6px 0}
.storage-seg{height:100%;position:relative;transition:width .4s}
.storage-seg.seg-txt{background:var(--jade)}
.storage-seg.seg-bin{background:var(--cinnabar)}
.storage-seg.seg-sys{background:var(--indigo)}
.storage-seg.seg-free{background:transparent}
.storage-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin-top:6px;color:var(--ink-soft)}
.storage-legend span{display:flex;align-items:center;gap:4px}
.storage-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--ink-line)}

/* 逐片可视化网格 */
.chunk-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;margin:10px 0;padding:8px;background:var(--paper-soft);border:1px solid var(--ink-line);border-radius:6px}
.chunk-cell{
  aspect-ratio:1;border-radius:2px;cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .15s;
  border:1px solid rgba(0,0,0,.1);
}
.chunk-cell:hover{transform:scale(1.4);z-index:10;box-shadow:0 2px 8px var(--shadow-deep)}
.chunk-cell.used{background:var(--jade)}
.chunk-cell.used-last{background:var(--cinnabar)}
.chunk-cell.free{background:var(--paper-deep);opacity:.4}
.chunk-cell.corrupted{background:var(--seal) !important;animation:pulse 1s infinite}
.chunk-cell.missing{background:transparent;border:1px dashed var(--seal)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.chunk-tip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:5px;
  font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;
  transition:opacity .15s;z-index:100;line-height:1.5;
}
.chunk-cell:hover .chunk-tip{opacity:1}

/* 环境检测警告 */
.env-warning{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  background:linear-gradient(135deg,#8a2b1e,#a94a34);
  color:#f5eed9;padding:16px 20px;font-size:13px;line-height:1.7;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  animation:slideDown .4s cubic-bezier(.3,1.4,.5,1);
}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
.env-warning h3{margin:0 0 6px;font-family:var(--font-display);font-size:16px;letter-spacing:1px}
.env-warning .env-actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.env-warning .env-btn{
  background:rgba(245,238,217,.15);border:1px solid rgba(245,238,217,.4);
  color:#f5eed9;padding:6px 14px;border-radius:5px;cursor:pointer;
  font-size:12px;font-family:var(--font-body);transition:background .2s;
}
.env-warning .env-btn:hover{background:rgba(245,238,217,.25)}
.env-warning .env-dismiss{
  position:absolute;top:10px;right:14px;cursor:pointer;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  opacity:.7;font-size:18px;
}
.env-warning .env-dismiss:hover{opacity:1}

/* 存储统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat-card{
  background:var(--paper-soft);border:1px solid var(--ink-line);
  border-radius:6px;padding:8px 10px;text-align:center;
}
.stat-card .val{font-size:18px;font-family:var(--font-display);color:var(--cinnabar)}
.stat-card .lbl{font-size:10px;color:var(--ink-faint);margin-top:2px}
.stat-card .val.good{color:var(--jade)}
.stat-card .val.warn{color:var(--cinnabar)}
.stat-card .val.bad{color:var(--seal)}

.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp-tile{
  aspect-ratio:16/10;border:1px solid var(--ink-line);border-radius:6px;cursor:pointer;
  position:relative;overflow:hidden;
}
.wp-tile.active{outline:2px solid var(--cinnabar)}
.wp-tile:hover{transform:scale(1.03)}

/* 通知 */
#toasts{position:fixed;top:16px;right:16px;z-index:9500;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--paper);border:1px solid var(--ink-line);border-left:3px solid var(--cinnabar);
  padding:10px 14px;border-radius:6px;font-size:13px;color:var(--ink);
  box-shadow:0 6px 20px var(--shadow);min-width:200px;max-width:320px;
  animation:toastIn .3s cubic-bezier(.3,1.4,.5,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.success{border-left-color:var(--jade)}
.toast.error{border-left-color:var(--seal)}

/* 移动端 */
@media (max-width:720px){
  #dock{bottom:6px;padding:6px 8px;gap:4px}
  .dock-item{width:38px;height:38px}
  .dock-item svg{width:24px;height:24px}
  #start-btn{width:44px;height:44px;left:6px;bottom:6px}
  #start-menu{width:calc(100vw - 20px);left:10px}
  .fe-side{width:110px}
  .fe-col-type,.fe-col-date{display:none}
  .window{left:2vw !important;top:2vw !important;width:96vw !important;height:calc(100vh - 80px) !important}
  .desk-icon{width:70px}
  .desk-icon .ic{width:42px;height:42px}
}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-line);border-radius:5px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

/* SVG 图标库 */
.ic{display:inline-block;vertical-align:middle}

/* 拖拽占位 */
.dragging{opacity:.4}
.drop-hint{outline:2px dashed var(--cinnabar);outline-offset:-2px}

/* 进度 */
.progress{height:4px;background:var(--paper-deep);border-radius:2px;overflow:hidden}
.progress .bar{height:100%;background:var(--cinnabar);transition:width .3s}
</style>

const $=(s,r=document)=>r.querySelector(s);

const el=(tag,props={},children=[])=>{
  const e=document.createElement(tag);
  for(const k in props){
    if(k==='class')e.className=props[k];
    else if(k==='style')Object.assign(e.style,props[k]);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),props[k]);
    else if(k==='html')e.innerHTML=props[k];
    else e.setAttribute(k,props[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null)return;
    if(typeof c==='string')e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
};
const fmtSize=(b)=>{
  if(b==null)return '—';
  if(b<1024)return b+' B';
  if(b<1048576)return (b/1024).toFixed(1)+' KB';
  if(b<1073741824)return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
};
const fmtDate=(t)=>{
  if(!t)return '—';
  const d=new Date(t);
  const p=(n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

  const parts=p.split('/').filter(Boolean);
  const out=[];
  for(const p of parts){
    if(p==='.')continue;
    if(p==='..'){out.pop();continue}
    out.push(p);
  }
  return '/'+out.join('/');
};

    /* fflate/zlib9：CDN 可选，JSON/代码类数据显著优于 LZ */
    try{
      if(window.fflate&&fflate.zlibSync){
        const z=fflate.zlibSync(BIN.strToU8(str),{level:9});
        choices.push({codec:'fflate-zlib9',payload:'d1'+BIN.u8ToB64Url(z)});
      }
    }catch(e){console.warn('fflate pack failed',e)}
    /* Brotli/WASM：CDN 可选，极限压缩 */
    try{
      const br=BROTLI.encode(BIN.strToU8(str));
      if(br)choices.push({codec:'brotli-q11',payload:'br'+BIN.u8ToB64Url(br instanceof Uint8Array?br:new Uint8Array(br))});
    }catch(e){console.warn('Brotli pack failed',e)}
    /* zstd：CDN 可选，压缩率和解压速度均优 */
    try{
      const zs=ZSTD.compress(BIN.strToU8(str));
      if(zs)choices.push({codec:'zstd',payload:'zs'+BIN.u8ToB64Url(zs instanceof Uint8Array?zs:new Uint8Array(zs))});
    }catch(e){console.warn('zstd pack failed',e)}
    /* 字典辅助 fflate：对 >300 字符内容，用共享字典提供压缩上下文 */
    try{
      if(window.fflate&&fflate.zlibSync&&str.length>300){
        const combined=DICT+'\x00'+str;
        const z=fflate.zlibSync(BIN.strToU8(combined),{level:9});
        const payload='df'+BIN.u8ToB64Url(z);
        /* 仅当字典辅助比无字典 fflate 更优时才加入竞赛 */
        choices.push({codec:'dict-fflate',payload});
      }
    }catch(e){console.warn('dict-fflate pack failed',e)}
    if(!choices.length)return {codec:'plain',payload:'p1'+encodeURIComponent(str)};
    choices.sort((a,b)=>a.payload.length-b.payload.length);
    return choices[0];
  },
  unpack(payload){
    if(payload.startsWith('z1'))return LZString.decompressFromEncodedURIComponent(payload.slice(2));
    if(payload.startsWith('d1')){
      if(!(window.fflate&&fflate.unzlibSync))throw new Error('fflate CDN 未加载，无法解压此镜像');
      return BIN.u8ToStr(fflate.unzlibSync(BIN.b64UrlToU8(payload.slice(2))));
    }
    if(payload.startsWith('br'))return BIN.u8ToStr(BROTLI.decode(BIN.b64UrlToU8(payload.slice(2))));
    if(payload.startsWith('zs'))return BIN.u8ToStr(ZSTD.decompress(BIN.b64UrlToU8(payload.slice(2))));
    if(payload.startsWith('df')){
      if(!(window.fflate&&fflate.unzlibSync))throw new Error('fflate CDN 未加载，无法解压此镜像');
      const full=BIN.u8ToStr(fflate.unzlibSync(BIN.b64UrlToU8(payload.slice(2))));
      const idx=full.indexOf('\x00');
      return idx>=0?full.slice(idx+1):full;
    }
    if(payload.startsWith('p1'))return decodeURIComponent(payload.slice(2));
    return payload;
  },
  /* 当前可用的编解码器列表 */
  available(){
    const list=['lz-uri'];
    if(window.fflate&&fflate.zlibSync){list.push('fflate-zlib9');list.push('dict-fflate')}
    if(BROTLI.enc())list.push('brotli-q11');
    if(ZSTD.enc())list.push('zstd');
    return list;
  }
};

/* =====================================================================
   Cookie 分片存储 v3 — 五codec竞赛 · CRC32校验 · 环境检测
   ─ 每片 3800 字符安全值，最大 150 片（safe 模式）
   ─ CODEC 五codec竞赛：LZ-URI / fflate-zlib9 / Brotli / zstd / 字典辅助fflate，取最短
   ─ CRC32 逐片校验 + 写入后回读验证
   ─ 环境检测：file:// 协议、Cookie 禁用、隐私模式
   ─ 向后兼容 v2（LZ-Base64）和 v1（无压缩）格式
   ===================================================================== */
const CK = {
  MAX_CHUNK_VALUE: 3800,
  MAX_CHUNKS: 150,
  profile:'safe',
  env: null,
  _chunkInfo: null,
  _crc32Table: null,

  /* ---- 容量模式配置 ---- */
  PROFILES:{
    safe:    {name:'安全模式',  chunks:150, chunkSize:3800, note:'最稳定，保留 Cookie 数量余量，适合所有浏览器'},
    balanced:{name:'均衡模式',  chunks:170, chunkSize:3800, note:'适度扩展容量，适合 Chrome/Edge/Firefox'},
    extreme: {name:'极限模式',  chunks:178, chunkSize:3900, note:'接近 Chromium 单域 Cookie 上限，可能触发逐出'},
    safari:  {name:'Safari 极限',chunks:400, chunkSize:3900, note:'仅建议 Safari/WebKit，其它浏览器可能失败'},
  },
  applyProfile(id){
    id=id||this._rawGet('storage_profile')||this.profile||'safe';
    const p=this.PROFILES[id]||this.PROFILES.safe;
    this.profile=id;
    this.MAX_CHUNKS=p.chunks;
    this.MAX_CHUNK_VALUE=p.chunkSize;
    return p;
  },
  setProfile(id){
    const p=this.PROFILES[id];if(!p)return false;
    this._rawSet('storage_profile',id,3650);
    this.applyProfile(id);
    return true;
  },

  /* ---- CRC32 校验 ---- */
  _getCrc32Table(){
    if(this._crc32Table)return this._crc32Table;
    const t=new Uint32Array(256);
    for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c}
    this._crc32Table=t;return t;
  },
  _crc32(str){
    const t=this._getCrc32Table();let crc=0xFFFFFFFF;
    for(let i=0;i<str.length;i++)crc=t[(crc^str.charCodeAt(i))&0xFF]^(crc>>>8);
    return((crc^0xFFFFFFFF)>>>0).toString(16).padStart(8,'0');
  },

  /* ---- 环境检测 ---- */
  detectEnv(){
    if(location.protocol==='file:')
      return{available:false,reason:'本地文件(file://)模式下 Cookie 无法持久化。\n请通过 Web 服务器访问（如 http://localhost），\n或部署到线上后使用。',type:'file'};
    if(typeof navigator!=='undefined'&&navigator.cookieEnabled===false)
      return{available:false,reason:'浏览器已禁用 Cookie。\n请在浏览器设置中启用 Cookie 后刷新页面。',type:'disabled'};
    try{
      const tv='_ck_test_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      document.cookie=`_ck_envtest=${tv}; path=/; SameSite=Lax`;
      if(!document.cookie.includes(tv))
        return{available:false,reason:'Cookie 写入测试失败。\n浏览器可能处于隐私模式，\n或限制了第三方 Cookie。\n数据将无法持久保存。',type:'blocked'};
      document.cookie='_ck_envtest=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
    }catch(e){
      return{available:false,reason:'Cookie 访问异常：'+e.message,type:'error'};
    }
    return{available:true,reason:'Cookie 存储正常，数据可持久保存',type:'ok'};
  },

  /* ---- 底层 Cookie 读写（兼容旧格式） ---- */
  _rawSet(k,v,days){
    const exp=new Date(Date.now()+days*864e5).toUTCString();
    document.cookie=`${k}=${encodeURIComponent(v)}; expires=${exp}; path=/; SameSite=Lax`;
  },
  /* 底层逐次写入回读校验：每次写入后立即回读，捕获静默截断 */
  _writeRaw(k,v,days){
    this._rawSet(k,v,days);
    const got=this._rawGet(k);
    if(got!==v){
      this.lastError=`Cookie ${k} 写入后回读不一致（浏览器可能静默截断或拒绝写入）`;
      console.error(this.lastError);
      return false;
    }
    return true;
  },
  _rawGet(k){
    const m=document.cookie.match(new RegExp('(?:^|; )'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=([^;]*)'));
    if(!m)return null;
    const v=m[1];
    try{return decodeURIComponent(v)}catch{
      try{return decodeURIComponent(escape(atob(v)))}catch{return v}
    }
  },
  _rawDel(k){document.cookie=`${k}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`},

  /* ---- Bank A/B 双 bank 原子提交 ---- */
  _chunkKey(key,i,bank){return bank?`${key}_${bank}${i}`:`${key}_${i}`},
  _otherBank(b){return b==='a'?'b':'a'},
  allCookieBytes(){return document.cookie.length},

  /* ---- 大数据分片存储（双Bank原子提交 + CODEC竞赛 + CRC + 回读校验） ---- */
  setBig(key,data){
    const str=typeof data==='string'?data:JSON.stringify(data);
    const packed=CODEC.pack(str);
    const payload=packed.payload;
    const chunks=[];
    for(let i=0;i<payload.length;i+=this.MAX_CHUNK_VALUE){
      chunks.push(payload.slice(i,i+this.MAX_CHUNK_VALUE));
    }
    if(chunks.length>this.MAX_CHUNKS){
      toast(`存储已满（需 ${chunks.length} 片，上限 ${this.MAX_CHUNKS} 片）。请删除一些文件。`,'error',5000);
      return false;
    }
    const oldIdx=this._readIndex(key);
    const oldCount=oldIdx?oldIdx.count:0;
    const oldBank=oldIdx&&oldIdx.bank?oldIdx.bank:null;
    /* 判断是否可以双 bank 提交：旧分片 + 新分片 + 6 片余量 <= MAX_CHUNKS */
    const canBank=oldCount+chunks.length+6<=this.MAX_CHUNKS;
    if(canBank){
      /* === 双 Bank 原子提交 === */
      const newBank=this._otherBank(oldBank||'a');
      /* 写入新 bank */
      for(let i=0;i<chunks.length;i++){
        const crc=this._crc32(chunks[i]);
        const ck=this._chunkKey(key,i,newBank);
        if(!this._writeRaw(ck,crc+chunks[i],3650)){
          this.lastError=`第 ${i} 片写入失败或被浏览器截断`;
          toast(this.lastError,'error',6000);
          /* 清理已写入的新 bank 片 */
          for(let j=0;j<=i;j++)this._rawDel(this._chunkKey(key,j,newBank));
          return false;
        }
      }
      /* 写入 v4 索引：翻转 bank 指针 */
      const meta={v:4,bank:newBank,count:chunks.length,codec:packed.codec,
        raw:str.length,packed:payload.length,
        crc:chunks.map(c=>this._crc32(c)),time:Date.now(),commit:(oldIdx?oldIdx.commit||0:0)+1};
      if(!this._writeRaw(key+'_idx',JSON.stringify(meta),3650)){
        this.lastError='索引写入失败（双 bank 模式），新数据已写入但索引未翻转';
        toast(this.lastError,'error',6000);
        return false;
      }
      /* 索引翻转成功，清理旧 bank */
      if(oldBank){
        for(let i=0;i<oldCount;i++)this._rawDel(this._chunkKey(key,i,oldBank));
      }else{
        /* 旧格式无 bank，清理旧 key */
        for(let i=0;i<oldCount;i++)this._rawDel(`${key}_${i}`);
      }
    }else{
      /* === 空间紧张：同 bank 覆写 + 逐片回读 === */
      /* 先清理非活动 bank 的孤儿片 */
      if(oldBank){
        const inactive=this._otherBank(oldBank);
        for(let i=0;i<oldCount+10;i++)this._rawDel(this._chunkKey(key,i,inactive));
      }
      const bank=oldBank||'a';
      for(let i=0;i<chunks.length;i++){
        const crc=this._crc32(chunks[i]);
        const ck=this._chunkKey(key,i,bank);
        if(!this._writeRaw(ck,crc+chunks[i],3650)){
          this.lastError=`第 ${i} 片写入失败或被浏览器截断（高容量覆写模式）`;
          toast(this.lastError,'error',6000);
          return false;
        }
      }
      /* 清理多余旧片 */
      for(let i=chunks.length;i<oldCount;i++)this._rawDel(this._chunkKey(key,i,bank));
      /* 写入索引 */
      const meta={v:4,bank,count:chunks.length,codec:packed.codec,
        raw:str.length,packed:payload.length,
        crc:chunks.map(c=>this._crc32(c)),time:Date.now(),commit:(oldIdx?oldIdx.commit||0:0)+1};
      if(!this._writeRaw(key+'_idx',JSON.stringify(meta),3650)){
        this.lastError='索引写入失败（高容量覆写模式）';
        toast(this.lastError,'error',6000);
        return false;
      }
    }
    this._chunkInfo=null;
    return true;
  },
  /* 读取索引（兼容 v1纯数字 / v2:count / v3 JSON / v4 JSON+bank） */
  _readIndex(key){
    const idx=this._rawGet(key+'_idx');
    if(!idx)return null;
    if(/^\d+$/.test(idx))return {v:1,count:parseInt(idx,10)};
    if(idx.startsWith('v2:'))return {v:2,count:parseInt(idx.slice(3),10)};
    try{return JSON.parse(idx)}catch{return null}
  },
  getBig(key){
    const meta=this._readIndex(key);
    if(!meta)return null;
    const bank=meta.bank||null;
    let s='';
    for(let i=0;i<meta.count;i++){
      const raw=this._rawGet(this._chunkKey(key,i,bank));
      if(raw==null)return null;
      if(meta.v>=2&&raw.length>=8){
        const crc=raw.slice(0,8);const data=raw.slice(8);
        if(this._crc32(data)!==crc)console.warn(`片 ${key}_${bank||''}${i} CRC 校验失败`);
        s+=data;
      }else{
        s+=raw;
      }
    }
    /* v3/v4：CODEC 解压（根据前缀自动路由） */
    if(meta.v>=3){
      try{return CODEC.unpack(s)}catch(e){
        console.warn('CODEC unpack failed:',e.message);
        if(s.startsWith('d1')||s.startsWith('br')){
          this.lastError='数据使用 '+(s.startsWith('d1')?'fflate':'Brotli')+' 压缩，但 CDN 未加载：'+e.message;
          return null;
        }
        if(s.startsWith('z1')){
          try{return LZString.decompressFromEncodedURIComponent(s.slice(2))}catch{}
        }
        return null;
      }
    }
    /* v2：LZ-Base64 解压 */
    if(meta.v===2){
      const dec=LZString.decompressFromBase64(s);
      if(dec!=null)return dec;
      return s;
    }
    /* v1：无压缩 */
    return s;
  },
  delBig(key){
    const meta=this._readIndex(key);
    if(!meta)return;
    const bank=meta.bank||null;
    /* 清理活动 bank */
    for(let i=0;i<meta.count;i++)this._rawDel(this._chunkKey(key,i,bank));
    /* 清理非活动 bank（孤儿片） */
    if(bank){
      const other=this._otherBank(bank);
      for(let i=0;i<meta.count+10;i++)this._rawDel(this._chunkKey(key,i,other));
    }else{
      /* 旧格式无 bank，清理到 MAX_CHUNKS 上限 */
      for(let i=0;i<this.MAX_CHUNKS;i++)this._rawDel(`${key}_${i}`);
    }
    this._rawDel(key+'_idx');
    this._chunkInfo=null;
  },

  /* ---- 块设备可视化映射 ---- */
  chunkMap(){
    const meta=this._readIndex('vfs');
    const map=[];
    const activeBank=meta?meta.bank:null;
    if(meta){
      /* 活动 bank 数据片 */
      for(let i=0;i<meta.count;i++){
        const ck=this._chunkKey('vfs',i,activeBank);
        const raw=this._rawGet(ck);
        if(raw){
          let crcOk=true,dataSize=raw.length;
          if(meta.v>=2&&raw.length>=8){
            const crc=raw.slice(0,8);const data=raw.slice(8);
            dataSize=data.length;
            crcOk=(this._crc32(data)===crc);
          }
          map.push({index:i,role:i===0?'super':(i===meta.count-1?'tail':'data'),
            bank:activeBank||'legacy',status:crcOk?'ok':'corrupted',
            rawSize:raw.length,dataSize,used:true,isLast:i===meta.count-1});
        }else{
          map.push({index:i,role:i===0?'super':'data',bank:activeBank||'legacy',
            status:'missing',rawSize:0,dataSize:0,used:true,isLast:i===meta.count-1});
        }
      }
      /* 检测非活动 bank 孤儿片 */
      if(activeBank){
        const other=this._otherBank(activeBank);
        for(let i=0;i<meta.count+5;i++){
          const raw=this._rawGet(this._chunkKey('vfs',i,other));
          if(raw){
            map.push({index:i,role:'orphan',bank:other,status:'orphan',
              rawSize:raw.length,dataSize:raw.length,used:false});
          }
        }
      }
    }
    /* 空闲片 */
    const usedCount=map.filter(m=>m.used).length;
    for(let i=usedCount;i<this.MAX_CHUNKS;i++){
      map.push({index:i,role:'free',bank:'-',status:'free',rawSize:0,dataSize:0,used:false});
    }
    return {map,meta,activeBank,totalChunks:this.MAX_CHUNKS,
      usedChunks:usedCount,freeChunks:this.MAX_CHUNKS-usedCount,
      cookieBytes:this.allCookieBytes()};
  },

  /* ---- 容量统计（含逐片详情） ---- */
  capacity(){
    let used=0,total=this.MAX_CHUNKS*this.MAX_CHUNK_VALUE;
    let chunks=0,corrupted=0;
    const details=[];
    const meta=this._readIndex('vfs');
    if(meta){
      const bank=meta.bank||null;
      chunks=meta.count;
      for(let i=0;i<meta.count;i++){
        const raw=this._rawGet(this._chunkKey('vfs',i,bank));
        if(raw){
          let crcOk=true,dataSize=raw.length;
          if(meta.v>=2&&raw.length>=8){
            const crc=raw.slice(0,8);const data=raw.slice(8);
            dataSize=data.length;
            crcOk=(this._crc32(data)===crc);
            if(!crcOk)corrupted++;
          }
          used+=raw.length;
          details.push({index:i,rawSize:raw.length,dataSize,crcOk,isLast:i===meta.count-1,used:true});
        }else{
          details.push({index:i,rawSize:0,dataSize:0,crcOk:false,isLast:i===meta.count-1,used:false,missing:true});
          corrupted++;
        }
      }
    }
    return{used,total,free:total-used,chunks,corrupted,details,
      maxChunks:this.MAX_CHUNKS,chunkSize:this.MAX_CHUNK_VALUE,
      usage:total>0?(used/total*100):0};
  },

  /* ---- 估算压缩率（使用 VFS_PACK cos3 + CODEC 竞赛） ---- */
  compressionStats(){
    if(!VFS.root)return{rawSize:0,compressedSize:0,ratio:0,saved:0,codec:'none',codecs:CODEC.available()};
    const cos3Str=VFS_PACK.pack(VFS.root);
    const packed=CODEC.pack(cos3Str);
    const jsonStr=JSON.stringify({tree:VFS.root,blobs:VFS.blobs||{}});
    return{
      rawSize:jsonStr.length,
      cos3Size:cos3Str.length,
      compressedSize:packed.payload.length,
      ratio:jsonStr.length>0?(1-packed.payload.length/jsonStr.length):0,
      cos3Ratio:jsonStr.length>0?(1-cos3Str.length/jsonStr.length):0,
      saved:jsonStr.length-packed.payload.length,
      codec:packed.codec,
      codecs:CODEC.available()
    };
  },

  clearAll(){
    /* 清理 vfs（含双 bank） */
    const vfsMeta=this._readIndex('vfs');
    if(vfsMeta){
      const bank=vfsMeta.bank;
      if(bank){
        for(const b of ['a','b'])for(let i=0;i<(vfsMeta.count+10);i++)this._rawDel(this._chunkKey('vfs',i,b));
      }else{
        for(let i=0;i<this.MAX_CHUNKS;i++)this._rawDel(`vfs_${i}`);
      }
    }
    this._rawDel('vfs_idx');
    /* 清理 sys_settings（含双 bank） */
    ['sys_settings'].forEach(k=>{
      const meta=this._readIndex(k);
      if(meta){
        const bank=meta.bank;
        if(bank){
          for(const b of ['a','b'])for(let i=0;i<(meta.count+10);i++)this._rawDel(this._chunkKey(k,i,b));
        }else{
          for(let i=0;i<this.MAX_CHUNKS;i++)this._rawDel(`${k}_${i}`);
        }
      }
      this._rawDel(k+'_idx');
    });
    ['icon_pos','wallpaper','storage_profile'].forEach(k=>this._rawDel(k));
    this._chunkInfo=null;
  }
};

/* =====================================================================
   VFS_PACK — cos3 紧凑序列化 + 文件级压缩 + 内容池去重 + MIME枚举 + 时间戳差值
   ─ cos3 格式：短数组替代字段名，显著减小 JSON 体积
   ─ 内容池去重：相同内容只存一份，引用索引
   ─ 文件级压缩：对 >96 字符内容尝试 CODEC 压缩，已压缩文件跳过
   ─ MIME 枚举：常见 MIME 类型用短索引替代长字符串
   ─ 时间戳差值：相对基准时间的偏移量，减少数字位数
   ─ fc:1 = 旧格式（MIME字符串+绝对时间戳），fc:2 = 新格式（MIME枚举+差值时间戳）
   ===================================================================== */
const VFS_PACK = {
  /* MIME 枚举表：索引 ↔ MIME 类型 */
  MIME_ENUM:['','text/plain','text/markdown','text/html','application/json','text/css','text/javascript','image/png','image/jpeg','image/svg+xml','application/octet-stream','text/csv','text/xml','application/pdf','image/gif','text/rtf','application/zip','image/webp','audio/mpeg','video/mp4'],
  MIME_REV:null, /* 反向查找表，懒初始化 */
  _mimeToIdx(mime){
    if(!this.MIME_REV){
      this.MIME_REV={};
      for(let i=0;i<this.MIME_ENUM.length;i++)this.MIME_REV[this.MIME_ENUM[i]]=i;
    }
    const idx=this.MIME_REV[mime];
    if(idx!==undefined)return idx;
    /* 未知 MIME 用 's'+字符串 存储 */
    return 's'+mime;
  },
  _idxToMime(v){
    if(typeof v==='number')return this.MIME_ENUM[v]||'';
    if(typeof v==='string'&&v.startsWith('s'))return v.slice(1);
    return '';
  },
  /* 检测已压缩文件类型，跳过文件级压缩避免负收益 */
  isAlreadyCompressedFile(mime){
    if(!mime)return false;
    if(/^(image|audio|video)\//.test(mime))return true;
    if(/(zip|gzip|pdf|rar|7z|octet-stream)/.test(mime))return true;
    return false;
  },
  /* 文件级压缩：对内容尝试 CODEC 压缩，仅当明显变小才启用 */
  packContent(content,mime){
    if(!content||content.length<=96)return {c:content};
    if(this.isAlreadyCompressedFile(mime))return {c:content};
    try{
      const pk=CODEC.pack(content);
      /* 仅当压缩后 + 18 字节元数据开销仍小于原始大小才启用 */
      if(pk.payload.length+18<content.length){
        return {c:{codec:pk.codec,p:pk.payload,l:content.length}};
      }
    }catch(e){console.warn('packContent failed',e)}
    return {c:content};
  },
  /* 解压文件级压缩内容 */
  unpackContent(c){
    if(typeof c==='object'&&c.codec&&c.p&&c.l){
      try{return CODEC.unpack(c.p)}catch(e){
        console.warn('unpackContent failed',e);return ''
      }
    }
    return c;
  },
  /* cos3 紧凑序列化（fc:2 = MIME枚举 + 时间戳差值） */
  pack(root){
    const pool=[];const seen=new Map();
    /* 基准时间戳：使用 root 的 mtime，所有子节点存差值 */
    const baseTime=root.mtime||Date.now();
    /* 内容入池去重 */
    const put=(content)=>{
      const key=typeof content==='string'?content:JSON.stringify(content);
      if(seen.has(key))return seen.get(key);
      const idx=pool.length;pool.push(content);seen.set(key,idx);return idx;
    };
    /* 递归序列化节点 */
    const ser=(node)=>{
      if(node.type==='dir'){
        const ch={};
        if(node.children)for(const [k,v] of Object.entries(node.children))ch[k]=ser(v);
        /* 目录存 mtime 差值 */
        return ['d',(node.mtime||0)-baseTime,ch];
      }
      /* 文件：内容入池 + 文件级压缩 + MIME枚举 + 时间戳差值 */
      const content=VFS._getContent(node);
      const packed=this.packContent(content,node.mime);
      const ref=put(packed);
      return ['f',this._mimeToIdx(node.mime||''),ref,node.size||0,(node.mtime||0)-baseTime];
    };
    return JSON.stringify({$:'cos3',p:pool,r:ser(root),fc:2,t:baseTime});
  },
  /* cos3 反序列化（兼容 fc:1 旧格式和 fc:2 新格式） */
  unpack(str){
    let obj;
    try{obj=JSON.parse(str)}catch(e){throw new Error('cos3 JSON 解析失败: '+e.message)}
    if(!obj||obj.$!=='cos3'||!obj.p||!obj.r)throw new Error('非 cos3 格式');
    const pool=obj.p;
    const fc=obj.fc||1; /* 格式版本：1=旧，2=新 */
    const baseTime=obj.t||0; /* 基准时间戳（仅 fc:2 有） */
    /* 递归反序列化节点 */
    const deser=(arr)=>{
      if(!Array.isArray(arr))return null;
      if(arr[0]==='d'){
        const mtime=fc>=2?(baseTime+(arr[1]||0)):(arr[1]||0);
        const node={type:'dir',children:{},mtime};
        if(arr[2])for(const [k,v] of Object.entries(arr[2]))node.children[k]=deser(v);
        return node;
      }
      if(arr[0]==='f'){
        const packed=pool[arr[2]];
        const content=this.unpackContent(packed.c);
        const mime=fc>=2?this._idxToMime(arr[1]):(arr[1]||'');
        const mtime=fc>=2?(baseTime+(arr[4]||0)):(arr[4]||0);
        return {type:'file',mime,content,size:arr[3]||0,mtime};
      }
      return null;
    };
    return deser(obj.r);
  }
};

/* =====================================================================
   虚拟文件系统 (VFS) v2 — 内容去重 · 分离存储
   ─ 树形结构：{type:'dir'|'file', children, hash, size, mtime, mime}
   ─ 内容池 blobs：{hash: {data, refs}} — 相同内容只存一份
   ─ 文本文件以 't:' 前缀存；二进制以 'b64:' 前缀存
   ─ 兼容旧格式（content 内联），自动迁移
   ─ 支持 cos3 紧凑序列化格式
   ===================================================================== */
const VFS = {
  root:null,
  blobs:{},
  recovery:false,
  dirty:false,
  _hash(str){
    let h=0x811c9dc5;
    for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
    return(h>>>0).toString(36);
  },
  /* 快照/回滚：保证原子操作 */
  _snapshot(){return JSON.parse(JSON.stringify({root:this.root,blobs:this.blobs}))},
  _restore(snap){this.root=snap.root;this.blobs=snap.blobs},
  init(){
    const hadDisk=!!CK._rawGet('vfs_idx');
    const raw=CK.getBig('vfs');
    if(raw){
      try{
        /* 尝试 cos3 紧凑格式 */
        if(raw.startsWith('{"$":"cos3"')){
          const root=VFS_PACK.unpack(raw);
          if(root){
            this.root=root;this.blobs={};
            this._migrateInline();this.recovery=false;return;
          }
        }
        /* 尝试 JSON 格式（v2: {tree,blobs} 或旧版内联） */
        const parsed=JSON.parse(raw);
        if(parsed.tree&&parsed.blobs){
          this.root=parsed.tree;this.blobs=parsed.blobs;
          this._gcBlobs();this.recovery=false;return;
        }
        // 旧格式：整个对象就是 tree，content 内联
        this.root=parsed;this.blobs={};
        this._migrateInline();this.flush();this.recovery=false;return;
      }catch(e){console.warn('VFS parse failed',e)}
      /* 有磁盘索引但读不出：进入恢复模式，不覆盖原数据 */
      if(hadDisk){
        this.root={type:'dir',children:{
          '桌面':{type:'dir',children:{
            '恢复说明.txt':this._mkFile('text/plain',
              '检测到已有 Cookie 磁盘，但当前无法读取。\n\n'+
              '原因可能是：LZ-String 库未加载、Cookie 分片被浏览器清理、CRC 校验失败，或旧数据损坏。\n\n'+
              '为了保护原数据，系统没有覆盖现有 Cookie。\n'+
              '请刷新页面重试，或在 设置 → 存储 中导出/重置。\n\n'+
              '错误：'+(e.message||e))
          },mtime:Date.now()}
        },mtime:Date.now()};
        this.dirty=true;this.recovery=true;
        setTimeout(()=>toast('Cookie 磁盘读取失败，已进入恢复模式，未覆盖原数据','error',8000),500);
        return;
      }
    }
    this.root={type:'dir',children:{
      '桌面':{type:'dir',children:{
        '欢迎.txt':this._mkFile('text/plain','欢迎来到 羽笺·白鸽 OS\n\n这是一封写在宣纸上的操作系统。\n所有文件都栖身于浏览器的 Cookie 之中——\n每一片笺纸都很珍贵，请以温柔相待。\n\n右键桌面可新建文件/文件夹、上传文件。\n拖拽图标可自由摆放；拖出窗口可下载到本机。\n\n—— 白鸽 敬上'),
        '诗笺.md':this._mkFile('text/markdown','# 白鸽笺\n\n> 羽落为笺，墨化白鸽。\n\n- 轻盈\n- 脆弱\n- 永恒\n')
      }},
      '文档':{type:'dir',children:{}},
      '图片':{type:'dir',children:{}},
      '音乐':{type:'dir',children:{}},
      '下载':{type:'dir',children:{}}
    },mtime:Date.now()};
    this.recovery=false;
    this.flush();
  },
  /* 迁移旧格式：将内联 content 转为 hash 引用 */
  _migrateInline(){
    const walk=(n)=>{
      if(n.type==='file'&&n.content){
        const h=this._hash(n.content);
        if(!this.blobs[h])this.blobs[h]={data:n.content,refs:0};
        this.blobs[h].refs++;
        n.hash=h;delete n.content;
      }
      if(n.children)Object.values(n.children).forEach(walk);
    };
    if(this.root)walk(this.root);
  },
  /* 清理无引用的 blob */
  _gcBlobs(){
    const used=new Set();
    const walk=(n)=>{
      if(n.type==='file'&&n.hash)used.add(n.hash);
      if(n.children)Object.values(n.children).forEach(walk);
    };
    if(this.root)walk(this.root);
    for(const h of Object.keys(this.blobs)){
      if(!used.has(h))delete this.blobs[h];
    }
  },
  _mkFile(mime,content){
    const isBin=content instanceof Uint8Array||content instanceof ArrayBuffer;
    let stored;
    if(isBin){
      const bytes=content instanceof Uint8Array?content:new Uint8Array(content);
      stored='b64:'+this._b64(bytes);
    }else{
      stored='t:'+content;
    }
    const h=this._hash(stored);
    if(!this.blobs[h])this.blobs[h]={data:stored,refs:0};
    this.blobs[h].refs++;
    return{type:'file',mime,hash:h,size:isBin?(content instanceof Uint8Array?content.length:content.byteLength):new TextEncoder().encode(content).length,mtime:Date.now()};
  },
  _b64(bytes){
    let s='';const CHUNK=0x8000;
    for(let i=0;i<bytes.length;i+=CHUNK){
      s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CHUNK));
    }
    return btoa(s);
  },
  _fromB64(b64){
    const bin=atob(b64);
    const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return u;
  },
  _getContent(n){
    if(n.hash&&this.blobs[n.hash])return this.blobs[n.hash].data;
    if(n.content)return n.content;
    return'';
  },
  flush(){
    if(this.recovery){
      CK.lastError='当前处于 Cookie 磁盘恢复模式：为避免覆盖原数据，写入已被阻止。请刷新页面、导入备份或一键重置。';
      this.dirty=true;
      return false;
    }
    /* 使用 cos3 紧凑序列化 + 文件级压缩 */
    const str=VFS_PACK.pack(this.root);
    const ok=CK.setBig('vfs',str);
    this.dirty=!ok;
    return ok;
  },
  _node(path){
    path=normPath(path);
    if(path==='/')return this.root;
    const parts=path.split('/').filter(Boolean);
    let cur=this.root;
    for(const p of parts){
      if(!cur||cur.type!=='dir'||!cur.children[p])return null;
      cur=cur.children[p];
    }
    return cur;
  },
  exists(path){return !!this._node(path)},
  stat(path){
    const n=this._node(path);
    if(!n)return null;
    return{
      type:n.type,name:baseOf(path),size:n.size||0,mtime:n.mtime||Date.now(),
      mime:n.mime||(n.type==='dir'?'inode/directory':'application/octet-stream'),
      isDir:n.type==='dir',isFile:n.type==='file'
    };
  },
  readdir(path){
    const n=this._node(path);
    if(!n||n.type!=='dir')return[];
    return Object.keys(n.children).map(name=>{
      const c=n.children[name];
      return{name,type:c.type,size:c.size||0,mtime:c.mtime||Date.now(),mime:c.mime};
    }).sort((a,b)=>{
      if(a.type!==b.type)return a.type==='dir'?-1:1;
      return a.name.localeCompare(b.name,'zh');
    });
  },
  mkdir(path){
    path=normPath(path);
    const snap=this._snapshot();
    const parent=this._node(dirOf(path));
    if(!parent||parent.type!=='dir'){this._restore(snap);return false}
    const name=baseOf(path);
    if(parent.children[name]){this._restore(snap);return false}
    parent.children[name]={type:'dir',children:{},mtime:Date.now()};
    if(!this.flush()){this._restore(snap);return false}
    return true;
  },
  writeFile(path,content,mime){
    path=normPath(path);
    const snap=this._snapshot();
    const parent=this._node(dirOf(path));
    if(!parent||parent.type!=='dir'){this._restore(snap);return false}
    const name=baseOf(path);
    /* 单文件大小安全检查 */
    if(typeof IMPORT_GUARD!=='undefined'){
      const sz=(content instanceof Uint8Array)?content.length:(content instanceof ArrayBuffer)?content.byteLength:(typeof content==='string'?new TextEncoder().encode(content).length:0);
      if(sz>IMPORT_GUARD.HARD_SINGLE){
        toast(`文件 ${name} 大小 ${fmtSize(sz)} 超过单文件安全上限 ${fmtSize(IMPORT_GUARD.HARD_SINGLE)}`,'error',5000);
        this._restore(snap);return false;
      }
    }
    /* 释放旧文件引用 */
    if(parent.children[name]&&parent.children[name].hash){
      const oldHash=parent.children[name].hash;
      if(this.blobs[oldHash]){this.blobs[oldHash].refs--;if(this.blobs[oldHash].refs<=0)delete this.blobs[oldHash]}
    }
    const node=this._mkFile(mime||'application/octet-stream',content);
    parent.children[name]=node;
    if(!this.flush()){this._restore(snap);return false}
    return true;
  },
  readFile(path,encoding){
    const n=this._node(path);
    if(!n||n.type!=='file')return null;
    const c=this._getContent(n);
    if(c.startsWith('b64:')){
      const u=this._fromB64(c.slice(4));
      if(encoding==='utf8'||encoding==='text')return new TextDecoder().decode(u);
      return u;
    }else if(c.startsWith('t:')){
      const txt=c.slice(2);
      if(encoding==='binary'||encoding==='arraybuffer')return new TextEncoder().encode(txt);
      return txt;
    }
    return c;
  },
  readAsBlob(path){
    const n=this._node(path);
    if(!n||n.type!=='file')return null;
    const c=this._getContent(n);
    let bytes;
    if(c.startsWith('b64:'))bytes=this._fromB64(c.slice(4));
    else if(c.startsWith('t:'))bytes=new TextEncoder().encode(c.slice(2));
    else bytes=new TextEncoder().encode(c);
    return new Blob([bytes],{type:n.mime||'application/octet-stream'});
  },
  unlink(path){
    path=normPath(path);
    const snap=this._snapshot();
    const parent=this._node(dirOf(path));
    if(!parent||parent.type!=='dir'){this._restore(snap);return false}
    const name=baseOf(path);
    if(!parent.children[name]){this._restore(snap);return false}
    /* 释放 blob 引用 */
    const node=parent.children[name];
    if(node.hash&&this.blobs[node.hash]){
      this.blobs[node.hash].refs--;
      if(this.blobs[node.hash].refs<=0)delete this.blobs[node.hash];
    }
    delete parent.children[name];
    if(!this.flush()){this._restore(snap);return false}
    return true;
  },
  rename(from,to){
    from=normPath(from);to=normPath(to);
    if(from==='/'||from===to||to.startsWith(from+'/'))return false;
    const snap=this._snapshot();
    const src=this._node(from);
    if(!src){this._restore(snap);return false}
    const parentDst=this._node(dirOf(to));
    if(!parentDst||parentDst.type!=='dir'){this._restore(snap);return false}
    const nameDst=baseOf(to);
    if(parentDst.children[nameDst]){this._restore(snap);return false}
    parentDst.children[nameDst]=src;
    src.mtime=Date.now();
    const parentSrc=this._node(dirOf(from));
    if(parentSrc&&parentSrc.children)delete parentSrc.children[baseOf(from)];
    if(!this.flush()){this._restore(snap);return false}
    return true;
  },
  copy(from,to){
    from=normPath(from);to=normPath(to);
    const snap=this._snapshot();
    const src=this._node(from);
    if(!src){this._restore(snap);return false}
    const parentDst=this._node(dirOf(to));
    if(!parentDst||parentDst.type!=='dir'){this._restore(snap);return false}
    /* 深拷贝节点，增加 blob 引用计数 */
    const cloned=JSON.parse(JSON.stringify(src));
    cloned.mtime=Date.now();
    if(cloned.hash&&this.blobs[cloned.hash])this.blobs[cloned.hash].refs++;
    parentDst.children[baseOf(to)]=cloned;
    if(!this.flush()){this._restore(snap);return false}
    return true;
  },
  uniqueName(dir,name){
    const n=this._node(dir);
    if(!n||n.type!=='dir')return name;
    if(!n.children[name])return name;
    const dot=name.lastIndexOf('.');
    const base=dot>0?name.slice(0,dot):name;
    const ext=dot>0?name.slice(dot):'';
    let i=2;
    while(n.children[`${base} ${i}${ext}`])i++;
    return`${base} ${i}${ext}`;
  },
  totalBytes(){
    let b=0;
    const walk=(n)=>{
      if(n.type==='file')b+=n.size||0;
      if(n.children)Object.values(n.children).forEach(walk);
    };
    walk(this.root);return b;
  },
  categoryBytes(){
    const cat={txt:0,bin:0,sys:0};
    const walk=(n,path='')=>{
      if(n.type==='file'){
        const c=this._getContent(n);
        const isBin=c.startsWith('b64:');
        const sz=n.size||0;
        if(path.startsWith('/桌面')||path.startsWith('/文档')||path.startsWith('/图片')||path.startsWith('/音乐')||path.startsWith('/下载')){
          if(isBin)cat.bin+=sz;else cat.txt+=sz;
        }else cat.sys+=sz;
      }
      if(n.children)Object.entries(n.children).forEach(([k,c])=>walk(c,path+'/'+k));
    };
    walk(this.root);return cat;
  },
  /* 统计去重节省的空间 */
  dedupStats(){
    let totalContent=0,uniqueContent=0;
    for(const h in this.blobs){
      const b=this.blobs[h];
      const sz=b.data.startsWith('b64:')?b.data.length-4:b.data.startsWith('t:')?b.data.length-2:b.data.length;
      uniqueContent+=sz;
      totalContent+=sz*b.refs;
    }
    return{totalContent,uniqueContent,saved:totalContent-uniqueContent,blobCount:Object.keys(this.blobs).length};
  }
};

/* =====================================================================
   窗口管理器
   ===================================================================== */
const WM = {
  windows:new Map(),
  zTop:100,
  MAX_Z:450,
  nextId(){return 'w'+(++this._idc)},
  _idc:0,
  create(opts){
    const id=this.nextId();
    const w=el('div',{class:'window',id,'data-id':id,style:{
      width:(opts.w||420)+'px',height:(opts.h||320)+'px',
      left:(opts.x||(40+this.windows.size*24))+'px',
      top:(opts.y||(40+this.windows.size*24))+'px'
    }});
    if(opts.cls)w.classList.add(opts.cls);
    const tb=el('div',{class:'titlebar'},[
      el('div',{class:'win-title'},opts.title||'窗口'),
      el('div',{class:'win-ctrls'},[
        el('div',{class:'win-btn',title:'最小化',html:ICON.min,onClick:(e)=>{e.stopPropagation();this.minimize(id)}}),
        el('div',{class:'win-btn',title:'最大化',html:ICON.max,onClick:(e)=>{e.stopPropagation();this.toggleMax(id)}}),
        el('div',{class:'win-btn',title:'关闭',html:ICON.close,onClick:(e)=>{e.stopPropagation();this.close(id)}}),
      ])
    ]);
    const body=el('div',{class:'win-body'});
    w.appendChild(tb);w.appendChild(body);
    // 8向调整大小
    ['n','s','e','w','ne','nw','se','sw'].forEach(d=>{
      w.appendChild(el('div',{class:'rz rz-'+d,'data-rz':d}));
    });
    document.body.appendChild(w);
    const rec={id,el:w,title:opts.title,app:opts.app,minimized:false,maximized:false,onClose:opts.onClose,
      prev:{left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height},
      _listeners:[]};
    this.windows.set(id,rec);
    this.focus(id);
    this._attachDrag(id,tb);
    this._attachResize(id);
    w.addEventListener('mousedown',()=>this.focus(id),true);
    w.addEventListener('touchstart',()=>this.focus(id),{passive:true});
    if(opts.body)body.appendChild(opts.body);
    this._refreshDock();
    return {id,body,win:w,rec};
  },
  focus(id){
    const r=this.windows.get(id);if(!r)return;
    this.zTop++;if(this.zTop>this.MAX_Z){
      // 重新分配 z-index
      const sorted=[...this.windows.values()].sort((a,b)=>parseInt(a.el.style.zIndex)-parseInt(b.el.style.zIndex));
      sorted.forEach((w,i)=>w.el.style.zIndex=100+i);
      this.zTop=100+sorted.length;
    }
    r.el.style.zIndex=this.zTop;
    this.windows.forEach(x=>x.el.classList.remove('focused'));
    r.el.classList.add('focused');
  },
  close(id){
    const r=this.windows.get(id);if(!r)return;
    try{r.onClose&&r.onClose()}catch(e){console.warn(e)}
    /* 清理 window 上的事件监听器，防止内存泄漏 */
    if(r._listeners){r._listeners.forEach(({type,fn,opts})=>window.removeEventListener(type,fn,opts))}
    r.el.remove();
    this.windows.delete(id);
    this._refreshDock();
  },
  minimize(id){
    const r=this.windows.get(id);if(!r)return;
    r.minimized=true;r.el.classList.add('minimized');
    this._refreshDock();
  },
  restore(id){
    const r=this.windows.get(id);if(!r)return;
    r.minimized=false;r.el.classList.remove('minimized');
    this.focus(id);
    this._refreshDock();
  },
  toggleMax(id){
    const r=this.windows.get(id);if(!r)return;
    if(r.maximized){
      Object.assign(r.el.style,r.prev);
      r.el.classList.remove('maximized');r.maximized=false;
    }else{
      r.prev={left:r.el.style.left,top:r.el.style.top,width:r.el.style.width,height:r.el.style.height};
      Object.assign(r.el.style,{left:'0px',top:'0px',width:'100vw',height:'calc(100vh - 64px)'});
      r.el.classList.add('maximized');r.maximized=true;
    }
  },
  _attachDrag(id,tb){
    const r=this.windows.get(id);
    let sx,sy,ox,oy,drag=false;
    const down=(e)=>{
      if(e.target.closest('.win-btn'))return;
      if(r.maximized)return;
      const t=e.touches?e.touches[0]:e;
      sx=t.clientX;sy=t.clientY;
      ox=r.el.offsetLeft;oy=r.el.offsetTop;
      drag=true;
      if(e.cancelable)e.preventDefault();
    };
    const move=(e)=>{
      if(!drag)return;
      const t=e.touches?e.touches[0]:e;
      const nx=Math.max(0,Math.min(window.innerWidth-80,ox+t.clientX-sx));
      const ny=Math.max(0,Math.min(window.innerHeight-80,oy+t.clientY-sy));
      r.el.style.left=nx+'px';r.el.style.top=ny+'px';
    };
    const up=()=>{drag=false};
    tb.addEventListener('mousedown',down);
    tb.addEventListener('touchstart',down,{passive:false});
    window.addEventListener('mousemove',move);
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('mouseup',up);
    window.addEventListener('touchend',up);
    r._listeners.push({type:'mousemove',fn:move},{type:'touchmove',fn:move,opts:{passive:false}},{type:'mouseup',fn:up},{type:'touchend',fn:up});
  },
  _attachResize(id){
    const r=this.windows.get(id);
    r.el.querySelectorAll('[data-rz]').forEach(h=>{
      let sx,sy,sw,sh,sl,st,dir,drag=false;
      const down=(e)=>{
        const t=e.touches?e.touches[0]:e;
        dir=h.dataset.rz;sx=t.clientX;sy=t.clientY;
        sw=r.el.offsetWidth;sh=r.el.offsetHeight;sl=r.el.offsetLeft;st=r.el.offsetTop;
        drag=true;if(e.cancelable)e.preventDefault();e.stopPropagation();
      };
      const move=(e)=>{
        if(!drag)return;
        const t=e.touches?e.touches[0]:e;
        const dx=t.clientX-sx,dy=t.clientY-sy;
        let nw=sw,nh=sh,nl=sl,nt=st;
        if(dir.includes('e'))nw=Math.max(260,sw+dx);
        if(dir.includes('s'))nh=Math.max(160,sh+dy);
        if(dir.includes('w')){nw=Math.max(260,sw-dx);nl=sl+(sw-nw)}
        if(dir.includes('n')){nh=Math.max(160,sh-dy);nt=st+(sh-nh)}
        r.el.style.width=nw+'px';r.el.style.height=nh+'px';
        r.el.style.left=nl+'px';r.el.style.top=nt+'px';
      };
      const up=()=>{drag=false};
      h.addEventListener('mousedown',down);
      h.addEventListener('touchstart',down,{passive:false});
      window.addEventListener('mousemove',move);
      window.addEventListener('touchmove',move,{passive:false});
      window.addEventListener('mouseup',up);
      window.addEventListener('touchend',up);
      r._listeners.push({type:'mousemove',fn:move},{type:'touchmove',fn:move,opts:{passive:false}},{type:'mouseup',fn:up},{type:'touchend',fn:up});
    });
  },
  _refreshDock(){
    // 由 APP.refreshDock 接管
    APP.refreshDock&&APP.refreshDock();
  }
};
