/* =====================================================================
   MIME 识别 & 文件图标
   ===================================================================== */
const MIME = {
  image: new Set(['png','jpg','jpeg','gif','webp','bmp','ico','svg','avif']),
  audio: new Set(['mp3','wav','ogg','oga','flac','aac','m4a','opus','weba']),
  video: new Set(['mp4','webm','ogv','mov','m4v','mkv']),
  text:  new Set(['txt','log','md','markdown','yaml','yml','ini','conf','cfg','sh','bash','py','rb','rs','go','java','c','cpp','h','hpp','cs','php','pl','swift','kt','ts','tsx','jsx','vue','svelte','toml','env','gitignore','dockerfile']),
  code:  new Set(['html','htm','css','js','mjs','json','xml','svg']),
  csv:   new Set(['csv','tsv']),
  pdf:   new Set(['pdf']),
  zip:   new Set(['zip','gz','tgz','tar']),
  guess(name){
    const e=extOf(name);
    if(this.image.has(e))return 'image/'+(e==='jpg'?'jpeg':e==='svg'?'svg+xml':e);
    if(this.audio.has(e))return 'audio/'+(e==='mp3'?'mpeg':e);
    if(this.video.has(e))return 'video/'+(e==='mov'?'quicktime':e);
    if(this.code.has(e)){
      if(e==='html'||e==='htm')return 'text/html';
      if(e==='css')return 'text/css';
      if(e==='js'||e==='mjs')return 'text/javascript';
      if(e==='json')return 'application/json';
      if(e==='xml')return 'application/xml';
      if(e==='svg')return 'image/svg+xml';
    }
    if(this.text.has(e))return 'text/plain';
    if(this.csv.has(e))return 'text/csv';
    if(this.pdf.has(e))return 'application/pdf';
    if(this.zip.has(e))return 'application/zip';
    return 'application/octet-stream';
  },
  iconFor(name,type){
    if(type==='dir')return ICON.folder;
    const e=extOf(name);
    if(this.image.has(e))return ICON.image;
    if(this.audio.has(e))return ICON.audio;
    if(this.video.has(e))return ICON.video;
    if(this.pdf.has(e))return ICON.pdf;
    if(this.zip.has(e))return ICON.zip;
    if(this.csv.has(e))return ICON.csv;
    if(this.code.has(e))return ICON.code;
    if(this.text.has(e))return ICON.text;
    return ICON.file;
  }
};

/* =====================================================================
   桌面图标管理
   ===================================================================== */
const DESK = {
  DESKTOP_PATH:'/桌面',
  selected:new Set(),
  iconLayer:$('#icon-layer'),
  positions:{}, // name -> {x,y}
  init(){
    // 载入位置
    const pos=CK._rawGet('icon_pos');
    if(pos){try{this.positions=JSON.parse(pos)}catch{}}
    this.render();
    this._setupDrag();
    this._setupSel();
  },
  savePos(){CK._rawSet('icon_pos',JSON.stringify(this.positions),3650)},
  render(){
    this.iconLayer.innerHTML='';
    const items=VFS.readdir(this.DESKTOP_PATH);
    items.forEach(it=>{
      const p=this.positions[it.name];
      let x,y;
      if(p){x=p.x;y=p.y}
      else{
        // 自动布局
        const idx=items.indexOf(it);
        const cols=Math.max(1,Math.floor((window.innerWidth-20)/96));
        const col=idx%cols,row=Math.floor(idx/cols);
        x=10+col*96;y=10+row*96;
      }
      const ic=el('div',{class:'desk-icon',draggable:'true','data-name':it.name,'data-path':join(this.DESKTOP_PATH,it.name),style:{left:x+'px',top:y+'px'}},[
        el('div',{class:'ic',html:MIME.iconFor(it.name,it.type)}),
        el('div',{class:'name'},it.name)
      ]);
      ic.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(!e.ctrlKey&&!e.metaKey){this.selected.forEach(n=>{const e=this.iconLayer.querySelector(`[data-name="${n}"]`);if(e)e.classList.remove('selected')});this.selected.clear()}
        this.selected.add(it.name);ic.classList.add('selected');
      });
      ic.addEventListener('dblclick',(e)=>{
        e.stopPropagation();
        openPath(join(this.DESKTOP_PATH,it.name));
      });
      // 移动端：单击选择，双击打开，长按右键菜单，拖拽移动
      let lastTap=0,longPressTimer=null,touchDrag=null;
      const DRAG_THRESHOLD=10;
      ic.addEventListener('touchstart',(e)=>{
        const t=e.touches[0];
        const rect=ic.getBoundingClientRect();
        const layerRect=this.iconLayer.getBoundingClientRect();
        touchDrag={
          startX:t.clientX,startY:t.clientY,
          offsetX:t.clientX-rect.left,offsetY:t.clientY-rect.top,
          layerX:layerRect.left,layerY:layerRect.top,
          moved:false,icon:ic,name:it.name
        };
        longPressTimer=setTimeout(()=>{
          if(!touchDrag.moved){
            e.preventDefault();
            if(!this.selected.has(it.name)){
              this.selected.forEach(n=>{const el=this.iconLayer.querySelector(`[data-name="${n}"]`);if(el)el.classList.remove('selected')});
              this.selected.clear();this.selected.add(it.name);ic.classList.add('selected');
            }
            CTX.showItemMenu(t.clientX,t.clientY,join(this.DESKTOP_PATH,it.name));
          }
        },500);
      },{passive:false});
      ic.addEventListener('touchmove',(e)=>{
        if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}
        if(!touchDrag)return;
        const t=e.touches[0];
        const dx=t.clientX-touchDrag.startX;
        const dy=t.clientY-touchDrag.startY;
        if(!touchDrag.moved&&Math.abs(dx)<DRAG_THRESHOLD&&Math.abs(dy)<DRAG_THRESHOLD)return;
        if(!touchDrag.moved){
          touchDrag.moved=true;
          ic.classList.add('dragging');
          ic.style.zIndex='9999';
          ic.style.transition='none';
        }
        e.preventDefault();
        const nx=t.clientX-touchDrag.layerX-touchDrag.offsetX;
        const ny=t.clientY-touchDrag.layerY-touchDrag.offsetY;
        ic.style.left=Math.max(0,nx)+'px';
        ic.style.top=Math.max(0,ny)+'px';
      },{passive:false});
      ic.addEventListener('touchend',(e)=>{
        if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}
        if(touchDrag&&touchDrag.moved){
          e.preventDefault();
          ic.classList.remove('dragging');
          ic.style.zIndex='';
          ic.style.transition='';
          const left=parseInt(ic.style.left)||0;
          const top=parseInt(ic.style.top)||0;
          this.positions[touchDrag.name]={x:left,y:top};
          this.savePos();
          touchDrag=null;
          return;
        }
        touchDrag=null;
        const now=Date.now();
        if(now-lastTap<350){e.preventDefault();openPath(join(this.DESKTOP_PATH,it.name))}
        else{
          if(!e.defaultPrevented){
            if(!e.ctrlKey&&!e.metaKey){this.selected.forEach(n=>{const el=this.iconLayer.querySelector(`[data-name="${n}"]`);if(el)el.classList.remove('selected')});this.selected.clear()}
            this.selected.add(it.name);ic.classList.add('selected');
          }
        }
        lastTap=now;
      });
      ic.addEventListener('contextmenu',(e)=>{
        e.preventDefault();e.stopPropagation();
        if(!this.selected.has(it.name)){
          this.selected.forEach(n=>{const e=this.iconLayer.querySelector(`[data-name="${n}"]`);if(e)e.classList.remove('selected')});
          this.selected.clear();this.selected.add(it.name);ic.classList.add('selected');
        }
        CTX.showItemMenu(e.clientX,e.clientY,join(this.DESKTOP_PATH,it.name));
      });
      // 拖出/拖拽
      ic.addEventListener('dragstart',(e)=>{
        e.stopPropagation();
        const path=join(this.DESKTOP_PATH,it.name);
        const stat=VFS.stat(path);
        e.dataTransfer.effectAllowed='copyMove';
        e.dataTransfer.setData('text/x-vfs-path',path);
        e.dataTransfer.setData('text/plain',baseOf(path));
        // 文件：提供DownloadURL（异步数据从缓存取，但这里同步构建blob）
        if(stat&&stat.isFile){
          try{
            const blob=VFS.readAsBlob(path);
            if(blob){
              const url=URL.createObjectURL(blob);
              e.dataTransfer.setData('DownloadURL',`${blob.type}:${baseOf(path)}:${url}`);
              try{e.dataTransfer.items.add(new File([blob],baseOf(path),{type:blob.type}))}catch{}
              setTimeout(()=>URL.revokeObjectURL(url),6000);
            }
          }catch{}
        }
        ic.classList.add('dragging');
      });
      ic.addEventListener('dragend',()=>ic.classList.remove('dragging'));
      this.iconLayer.appendChild(ic);
    });
  },
  _setupDrag(){
    // 桌面 drop：支持内部位置移动 + 外部文件导入
    this.iconLayer.addEventListener('dragover',(e)=>{
      // 总是允许 drop（无论是内部还是外部）
      e.preventDefault();
      e.dataTransfer.dropEffect=e.dataTransfer.types.includes('Files')?'copy':'move';
    });
    this.iconLayer.addEventListener('drop',async(e)=>{
      e.preventDefault();
      // 外部文件：导入到桌面
      if(e.dataTransfer.files&&e.dataTransfer.files.length){
        await importDroppedItems(e.dataTransfer.items,this.DESKTOP_PATH);
        this.render();
        return;
      }
      // 内部移动：更新图标位置
      const path=e.dataTransfer.getData('text/x-vfs-path');
      if(!path)return;
      // 若来自桌面图标 → 重定位
      if(path.startsWith(this.DESKTOP_PATH+'/')){
        const name=baseOf(path);
        const rect=this.iconLayer.getBoundingClientRect();
        const x=e.clientX-rect.left-43;
        const y=e.clientY-rect.top-40;
        this.positions[name]={x:Math.max(0,x),y:Math.max(0,y)};
        this.savePos();this.render();
      }else{
        // 其他路径的文件拖到桌面 → 移动到 /桌面
        const name=VFS.uniqueName(this.DESKTOP_PATH,baseOf(path));
        VFS.rename(path,join(this.DESKTOP_PATH,name));
        APP.notifyChange&&APP.notifyChange(dirOf(path));
        this.render();
      }
    });
  },
  _setupSel(){
    let sx,sy,drag=false;
    const box=$('#selbox');
    const desktop=$('#desktop');
    desktop.addEventListener('mousedown',(e)=>{
      if(e.target.closest('.desk-icon,.window,#dock,#start-btn,#start-menu,#ctx-menu'))return;
      sx=e.clientX;sy=e.clientY;drag=true;
      box.style.left=sx+'px';box.style.top=sy+'px';box.style.width='0';box.style.height='0';
      box.style.display='block';
      if(!e.ctrlKey){this.selected.forEach(n=>{const e=this.iconLayer.querySelector(`[data-name="${n}"]`);if(e)e.classList.remove('selected')});this.selected.clear()}
    });
    window.addEventListener('mousemove',(e)=>{
      if(!drag)return;
      const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY);
      const w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);
      box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
      // 命中检测
      const r={x,y,w,h};
      $$('.desk-icon',this.iconLayer).forEach(ic=>{
        const ir=ic.getBoundingClientRect();
        const hit=!(ir.right<r.x||ir.left>r.x+r.w||ir.bottom<r.y||ir.top>r.y+r.h);
        ic.classList.toggle('selected',hit);
        if(hit)this.selected.add(ic.dataset.name);
        else if(!e.ctrlKey)this.selected.delete(ic.dataset.name);
      });
    });
    window.addEventListener('mouseup',()=>{if(drag){drag=false;box.style.display='none'}});
    // 触摸
    desktop.addEventListener('touchstart',(e)=>{
      if(e.target.closest('.desk-icon,.window,#dock,#start-btn,#start-menu,#ctx-menu'))return;
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;drag=true;
      box.style.left=sx+'px';box.style.top=sy+'px';box.style.width='0';box.style.height='0';
      box.style.display='block';
    },{passive:true});
    desktop.addEventListener('touchmove',(e)=>{
      if(!drag)return;
      const t=e.touches[0];
      const x=Math.min(sx,t.clientX),y=Math.min(sy,t.clientY);
      const w=Math.abs(t.clientX-sx),h=Math.abs(t.clientY-sy);
      box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
      const r={x,y,w,h};
      $$('.desk-icon',this.iconLayer).forEach(ic=>{
        const ir=ic.getBoundingClientRect();
        const hit=!(ir.right<r.x||ir.left>r.x+r.w||ir.bottom<r.y||ir.top>r.y+r.h);
        ic.classList.toggle('selected',hit);
        if(hit)this.selected.add(ic.dataset.name);
      });
    },{passive:true});
    desktop.addEventListener('touchend',()=>{if(drag){drag=false;box.style.display='none'}});
  },
};

/* =====================================================================
   导入安全阀 IMPORT_GUARD — 防止大文件 OOM 崩溃
   ===================================================================== */
const IMPORT_GUARD = {
  HARD_SINGLE: 4 * 1024 * 1024,      // 单文件 4MB 上限
  HARD_BATCH:  8 * 1024 * 1024,      // 单次拖拽 8MB 上限
  MAX_FILES: 200,
  compressedExt: new Set(['png','jpg','jpeg','gif','webp','bmp','ico','avif','mp3','aac','flac','ogg','opus','mp4','webm','mkv','zip','gz','tgz','tar','7z','rar','pdf','woff','woff2','ttf','otf']),
  isCompressedFile(file){
    const e=extOf(file.name);
    if(this.compressedExt.has(e))return true;
    const mt=file.type||'';
    if(/^(image|audio|video)\//.test(mt))return true;
    if(/(zip|gzip|pdf|rar|7z|octet-stream)/.test(mt))return true;
    return false;
  },
  estimateCookieChars(file){
    const size=file.size;
    if(this.isCompressedFile(file))return Math.ceil(size*1.42)+512;
    return Math.ceil(size*0.75)+512;
  },
  maxStorableChars(){
    if(CK.applyProfile)CK.applyProfile();
    const cap=CK.capacity();
    return Math.max(0,cap.total-12000);
  },
  ctx(){return{files:0,bytes:0,rejected:[],stopped:false}},
  accept(file,ctx){
    if(!file)return false;
    if(ctx.files>=this.MAX_FILES){ctx.rejected.push(`${file.name} — 超过文件数上限 ${this.MAX_FILES}`);ctx.stopped=true;return false}
    if(file.size>this.HARD_SINGLE){ctx.rejected.push(`${file.name} (${fmtSize(file.size)}) — 超过单文件上限 ${fmtSize(this.HARD_SINGLE)}`);return false}
    if(ctx.bytes+file.size>this.HARD_BATCH){ctx.rejected.push(`${file.name} — 超过批量上限 ${fmtSize(this.HARD_BATCH)}`);ctx.stopped=true;return false}
    const est=this.estimateCookieChars(file);
    const max=this.maxStorableChars();
    if(est>max){ctx.rejected.push(`${file.name} — 预估需 ${fmtSize(est)} Cookie 空间，超出剩余容量`);return false}
    ctx.bytes+=file.size;ctx.files++;
    return true;
  },
  summary(ctx,ok){
    if(ctx.rejected.length){
      DIALOG.alert(
        `已导入 ${ok||0} 项。以下项目未读取，因此不会导致页面崩溃：\n\n`+
        ctx.rejected.slice(0,12).join('\n')+
        (ctx.rejected.length>12?`\n…等共 ${ctx.rejected.length} 项`:''),
        '导入被安全阀拦截'
      );
    }
  }
};

/* 流式读取解压数据，超过上限时阻止以避免 zip bomb */
async function streamToU8Limited(stream,limit){
  const reader=stream.getReader();
  const chunks=[];let total=0;
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    total+=value.length;
    if(total>limit){try{await reader.cancel()}catch{};throw new Error('解压后数据超过安全上限 '+fmtSize(limit)+'，已阻止以避免内存崩溃')}
    chunks.push(value);
  }
  let len=0;chunks.forEach(c=>len+=c.length);
  const u=new Uint8Array(len);let off=0;
  chunks.forEach(c=>{u.set(c,off);off+=c.length});
  return u;
}

/* =====================================================================
   导入拖放项（支持目录 webkitGetAsEntry）
   ===================================================================== */
async function importDroppedItems(items,targetDir){
  let count=0;
  const ctx=IMPORT_GUARD.ctx();
  const entries=[];
  for(const it of items){
    if(it.webkitGetAsEntry){
      const en=it.webkitGetAsEntry();
      if(en)entries.push(en);
    }
  }
  if(!entries.length){
    // fallback files
    for(const f of items){
      const file=f.getAsFile();if(!file)continue;
      if(!IMPORT_GUARD.accept(file,ctx))continue;
      if(ctx.stopped)break;
      const name=VFS.uniqueName(targetDir,file.name);
      const buf=new Uint8Array(await file.arrayBuffer());
      if(!VFS.writeFile(join(targetDir,name),buf,file.type||MIME.guess(file.name))){toast('导入中止：Cookie 空间不足','error');break}
      count++;
    }
  }else{
    for(const en of entries){
      if(ctx.stopped)break;
      count+=await traverseEntry(en,targetDir,ctx);
    }
  }
  VFS.flush();
  IMPORT_GUARD.summary(ctx,count);
  if(count>0)toast(`已导入 ${count} 项到 ${targetDir}`,'success');
}
async function traverseEntry(entry,parentPath,ctx=IMPORT_GUARD.ctx()){
  let c=0;
  if(entry.isFile){
    await new Promise(res=>{
      entry.file(async file=>{
        if(!file){res();return}
        try{
          if(!IMPORT_GUARD.accept(file,ctx)){res();return}
          const name=VFS.uniqueName(parentPath,file.name);
          const buf=new Uint8Array(await file.arrayBuffer());
          if(!VFS.writeFile(join(parentPath,name),buf,file.type||MIME.guess(file.name))){toast('导入中止：Cookie 空间不足','error',5000);res();return}
          c++;
        }catch(e){toast('读取文件失败：'+(e.message||e),'error',5000);console.warn(e)}
        res();
      },err=>{console.warn(err);res()});
    });
  }else if(entry.isDirectory){
    const dirName=VFS.uniqueName(parentPath,entry.name);
    VFS.mkdir(join(parentPath,dirName));
    const reader=entry.createReader();
    const all=[];
    const readBatch=()=>new Promise(res=>{
      reader.readEntries((batch)=>{
        if(batch.length===0){res()}
        else{all.push(...batch);readBatch().then(res)}
      },err=>{console.warn(err);res()});
    });
    await readBatch();
    for(const ch of all){
      if(ctx.stopped)break;
      c+=await traverseEntry(ch,join(parentPath,dirName),ctx);
    }
  }
  return c;
}

function pickFilesTo(dir){

  inp.onchange=async()=>{

      const name=VFS.uniqueName(dir,f.name);

}

/* =====================================================================
   VFS 备份导出/导入 — JSZip ZIP 格式 + JSON 兼容
   ─ 导出：ZIP 内含 manifest.json + vfs-backup.json + files/ 目录（人类可浏览）
   ─ 导入：自动识别 .zip 和 .json 格式
   ===================================================================== */
async function exportVFSBackupZip(){
  if(!window.JSZip)throw new Error('JSZip 未加载，无法导出 ZIP 备份');
  const zip=new JSZip();
  const exportDate=new Date().toISOString();
  /* 1. manifest.json — 元数据 */
  const manifest={app:'羽笺·白鸽 OS',version:3,format:'zip-backup-v1',exportDate,fileCount:0,totalSize:0};
  /* 2. vfs-backup.json — 完整备份数据（用于恢复） */
  const backup={tree:VFS.root,blobs:VFS.blobs,version:2,exportDate};
  zip.file('vfs-backup.json',JSON.stringify(backup));
  /* 3. files/ 目录 — 遍历 VFS 树提取实际文件（人类可浏览，JSZip 独有优势） */
  let fileCount=0,totalSize=0;
  const walk=(node,path)=>{
    if(node.type==='dir'){
      if(node.children)for(const [name,child] of Object.entries(node.children))
        walk(child,path?path+'/'+name:name);
    }else if(node.type==='file'){
      fileCount++;totalSize+=node.size||0;
      try{
        const blob=VFS.readAsBlob('/'+path);
        if(blob)zip.file('files/'+path,blob);
      }catch(e){console.warn('跳过文件 '+path,e)}
    }
  };
  if(VFS.root)walk(VFS.root,'');
  manifest.fileCount=fileCount;
  manifest.totalSize=totalSize;
  zip.file('manifest.json',JSON.stringify(manifest,null,2));
  /* 生成 ZIP（DEFLATE 最大压缩）并下载 */
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:9}});
  const dateStr=exportDate.slice(0,10);
  downloadBlob(blob,`baige-os-backup-${dateStr}.zip`);
  return fileCount;
}
async function importVFSBackup(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.zip')){
    if(!window.JSZip)throw new Error('JSZip 未加载，无法导入 ZIP 备份');
    const zip=await JSZip.loadAsync(file);
    /* 优先从 vfs-backup.json 恢复完整数据 */
    const backupFile=zip.file('vfs-backup.json');
    if(backupFile){
      const t=await backupFile.async('text');
      return _restoreFromBackupText(t);
    }
    /* 如果没有 vfs-backup.json，尝试从 files/ 目录重建 */
    const fileEntries=Object.entries(zip.files).filter(([n,f])=>!f.dir&&n.startsWith('files/'));
    if(fileEntries.length===0)throw new Error('ZIP 中未找到可恢复的备份数据');
    /* 重建 VFS 树 */
    const newRoot={type:'dir',children:{},mtime:Date.now()};
    for(const [entryName,f] of fileEntries){
      const relPath=entryName.slice(6); /* 去掉 'files/' 前缀 */
      const parts=relPath.split('/').filter(Boolean);
      let acc=newRoot;
      for(let i=0;i<parts.length-1;i++){
        if(!acc.children[parts[i]])acc.children[parts[i]]={type:'dir',children:{},mtime:Date.now()};
        acc=acc.children[parts[i]];
      }
      const buf=new Uint8Array(await f.async('uint8array'));
      const fileName=parts[parts.length-1];
      acc.children[fileName]=VFS._mkFile(MIME.guess(fileName),buf);
    }
    VFS.root=newRoot;VFS.blobs={};VFS._migrateInline();
    VFS.recovery=false;VFS.flush();
    return fileEntries.length;
  }
  /* JSON 格式导入 */
  const t=await file.text();
  return _restoreFromBackupText(t);
}
function _restoreFromBackupText(t){
  let parsed;
  try{parsed=JSON.parse(t)}catch{throw new Error('备份文件格式无法解析')}
  if(parsed.tree&&parsed.blobs){VFS.root=parsed.tree;VFS.blobs=parsed.blobs}
  else if(parsed.$==='cos3'&&parsed.r){VFS.root=VFS_PACK.unpack(t);VFS.blobs={};VFS._migrateInline()}
  else{VFS.root=parsed;VFS.blobs={};VFS._migrateInline()}
  VFS.recovery=false;VFS.flush();
  return true;
}

function openPath(path,opts={}){
  const s=VFS.stat(path);
  if(!s){toast('不存在：'+path,'error');return}
  if(s.isDir){APP.launch('explorer',{path});return}
  // 文件
  const ext=extOf(path);
  if(opts.forceApp){APP.launch(opts.forceApp,{path});return}
  if(MIME.image.has(ext))APP.launch('manga',{path});
  else if(MIME.audio.has(ext))APP.launch('media',{path,kind:'audio'});
  else if(MIME.video.has(ext))APP.launch('media',{path,kind:'video'});
  else if(MIME.pdf.has(ext))APP.launch('pdf',{path});
  else if(MIME.zip.has(ext))APP.launch('zip',{path});
  else if(MIME.csv.has(ext))APP.launch('csv',{path});
  else if(MIME.code.has(ext))APP.launch('editor',{path});
  else if(MIME.text.has(ext)||s.mime.startsWith('text/'))APP.launch('notepad',{path});
  else{
    // 通用：以文本打开 或 下载
    showGenericOpen(path);
  }
}

/* =====================================================================
   文件属性对话框 — 含存储分析
   ===================================================================== */
function nodeStorageStats(n){
  const st={files:0,dirs:0,rawBytes:0,declaredBytes:0,contentChars:0,b64Chars:0,textChars:0};
  const walk=(node)=>{
    if(node.type==='file'){
      st.files++;
      const sz=node.size||0;
      st.declaredBytes+=sz;
      const c=VFS._getContent(node);
      if(c){
        st.contentChars+=c.length;
        if(c.startsWith('b64:')){st.b64Chars+=c.length-4;st.rawBytes+=Math.floor((c.length-4)*0.75)}
        else if(c.startsWith('t:')){st.textChars+=c.length-2;st.rawBytes+=c.length-2}
        else{st.rawBytes+=c.length}
      }
    }else{st.dirs++}
    if(node.children)Object.values(node.children).forEach(walk);
  };
  walk(n);return st;
}
function showProperties(path){
  const stat=VFS.stat(path);if(!stat)return;
  const node=VFS._node(path);if(!node)return;
  const st=nodeStorageStats(node);
  const comp=CK.compressionStats();
  const dedup=VFS.dedupStats();
  const layer=$('#dialog-layer');layer.innerHTML='';
  const fmtDate=(ts)=>new Date(ts).toLocaleString('zh-CN');
  const rows=[
    ['名称',stat.name],
    ['路径',path],
    ['类型',stat.isDir?'文件夹':'文件'],
    ['MIME',stat.mime||'—'],
    ['大小',fmtSize(stat.size)],
    ['修改时间',fmtDate(stat.mtime)],
  ];
  if(stat.isFile){
    rows.push(['内容编码',st.b64Chars>0?'Base64（二进制）':'文本']);
    rows.push(['原始字节',fmtSize(st.rawBytes)]);
    rows.push(['存储字符',st.contentChars.toLocaleString()+' 字符']);
  }
  if(stat.isDir){
    rows.push(['包含文件',st.files+' 个']);
    rows.push(['包含文件夹',st.dirs+' 个']);
    rows.push(['总大小',fmtSize(st.rawBytes)]);
  }
  /* 边际 Cookie 占用估算（使用 VFS_PACK cos3 + CODEC） */
  const fullStr=VFS_PACK.pack(VFS.root);
  const fullCompressed=CODEC.pack(fullStr).payload.length;
  /* 克隆并删除该节点 */
  const clone=JSON.parse(JSON.stringify(VFS.root));
  const parts=path.split('/').filter(Boolean);
  let cur=clone;
  for(let i=0;i<parts.length-1;i++){if(!cur||!cur.children||!cur.children[parts[i]]){cur=null;break}cur=cur.children[parts[i]]}
  if(cur&&cur.children)delete cur.children[parts[parts.length-1]];
  const withoutStr=VFS_PACK.pack(clone);
  const withoutCompressed=CODEC.pack(withoutStr).payload.length;
  const marginalCookie=Math.max(0,fullCompressed-withoutCompressed);
  rows.push(['边际 Cookie 占用','≈ '+fmtSize(marginalCookie)]);
  rows.push(['全盘压缩后',fmtSize(fullCompressed)]);
  rows.push(['压缩率',(comp.ratio*100).toFixed(0)+'%']);
  rows.push(['去重节省',fmtSize(dedup.saved)]);

  const d=el('div',{class:'dlg',style:{minWidth:'420px',maxWidth:'90vw'}},[
    el('h3',{},'属性 — '+stat.name),
    el('div',{style:{fontSize:'12px',lineHeight:'2',color:'var(--ink-soft)',marginTop:'8px'}},
      rows.map(([k,v])=>el('div',{style:{display:'flex',justifyContent:'space-between',borderBottom:'1px solid var(--ink-line)',padding:'2px 0'}},[
        el('span',{style:{color:'var(--ink-faint)'}},k),
        el('span',{style:{textAlign:'right',maxWidth:'260px',wordBreak:'break-all'}},String(v))
      ]))
    ),
    el('div',{class:'dlg-btns',style:{marginTop:'12px'}},[
      el('button',{class:'btn',onClick:()=>{
        const info={path,name:stat.name,type:stat.type,mime:stat.mime,size:stat.size,mtime:stat.mtime,
          storage:{rawBytes:st.rawBytes,contentChars:st.contentChars,marginalCookie,
          compressionRatio:comp.ratio,dedupSaved:dedup.saved}};
        downloadBlob(new Blob([JSON.stringify(info,null,2)],{type:'application/json'}),stat.name+'.props.json');
      }},'导出属性'),
      el('button',{class:'btn primary',onClick:()=>layer.classList.remove('show')},'关闭')
    ])
  ]);
  layer.appendChild(d);layer.classList.add('show');
}

const APP={
  registry:{},
  running:{},
  register(id,spec){this.registry[id]=spec},
  launch(id,args){
    const spec=this.registry[id];
    if(!spec){toast('未知应用：'+id,'error');return}
    return spec.launch(args||{});
  },
  refreshDock(){
    const dock=$('#dock');dock.innerHTML='';
    const running=new Map();
    for(const [wid,rec] of WM.windows){
      if(!running.has(rec.app))running.set(rec.app,[]);
      running.get(rec.app).push({wid,rec});
    }
    const order=['explorer','notepad','editor','browser','calc','paint','vm','settings'];
    order.forEach(id=>{
      const spec=this.registry[id];if(!spec)return;
      const list=running.get(id)||[];
      const item=el('div',{class:'dock-item'+(list.length?' running':''),onClick:()=>{
        if(list.length===0){this.launch(id)}
        else if(list.length===1){
          const r=list[0];
          if(r.rec.minimized)WM.restore(r.wid);
          else WM.focus(r.wid);
        }else{
          // 列表切换：聚焦下一个
          const next=list.find(x=>x.rec.minimized)||list[0];
          if(next.rec.minimized)WM.restore(next.wid);else WM.focus(next.wid);
        }
      }},[
        el('span',{html:spec.icon}),
        el('span',{class:'tip'},spec.name)
      ]);
      dock.appendChild(item);
    });
  },
  notifyChange(dir){
    // 通知所有文件资源管理器刷新
    for(const [wid,rec] of WM.windows){
      if(rec.app==='explorer'&&rec.refreshIfDir&&rec.refreshIfDir(dir)){}
    }
    DESK.render();
  }
};

    function toggleSort(k){
      if(sortKey===k)sortDir=-sortDir;
      else{sortKey=k;sortDir=1}
      refresh();
    }

    function navigate(p){
      p=normPath(p);
      if(p===curPath)return;
      curPath=p;
      history=history.slice(0,hi+1);history.push(p);hi=history.length-1;
      selected.clear();
      refresh();
    }
    function refresh(){
      rec.el.querySelector('.win-title').textContent='资源管理器 — '+curPath;
      // 面包屑
      crumb.innerHTML='';
      const parts=curPath.split('/').filter(Boolean);
      crumb.appendChild(el('span',{onClick:()=>navigate('/')},'/'));
      let acc='';
      parts.forEach(p=>{
        acc+='/'+p;
        const pp=acc;
        crumb.appendChild(el('span',{},' › '));
        crumb.appendChild(el('span',{onClick:()=>navigate(pp)},p));
      });
      // 侧栏高亮
      $$('.fe-side-item',side).forEach(el0=>el0.classList.remove('active'));
      const si=sideItems.find(s=>s.path===curPath);
      if(si){const i=sideItems.indexOf(si);side.children[i]&&side.children[i].classList.add('active')}

      // 列表
      list.innerHTML='';
      let items=VFS.readdir(curPath);
      if(search){
        const q=search.toLowerCase();
        items=items.filter(it=>it.name.toLowerCase().includes(q));
      }
      items.sort((a,b)=>{
        if(a.type!==b.type)return a.type==='dir'?-1:1;
        let va,vb;
        if(sortKey==='name'){va=a.name;vb=b.name;return va.localeCompare(vb,'zh')*sortDir}
        if(sortKey==='type'){va=extOf(a.name);vb=extOf(b.name);return va.localeCompare(vb)*sortDir}
        if(sortKey==='size'){return (a.size-b.size)*sortDir}
        if(sortKey==='mtime'){return (a.mtime-b.mtime)*sortDir}
        return 0;
      });
      if(!items.length){list.appendChild(el('div',{class:'fe-empty'},'此文件夹为空'));return}
      items.forEach(it=>{
        const ip=join(curPath,it.name);
        const row=el('div',{class:'fe-item','data-path':ip},[
          el('div',{class:'fi-ic',html:MIME.iconFor(it.name,it.type)}),
          el('div',{class:'fi-name'},it.name),
          el('div',{class:'fi-type'},it.type==='dir'?'文件夹':(extOf(it.name).toUpperCase()||'文件')),
          el('div',{class:'fi-size'},it.type==='dir'?'—':fmtSize(it.size)),
          el('div',{class:'fi-date'},fmtDate(it.mtime))
        ]);
        row.addEventListener('click',(e)=>{
          if(!e.ctrlKey&&!e.metaKey){selected.clear();$$('.fe-item',list).forEach(r=>r.classList.remove('selected'))}
          selected.add(ip);row.classList.add('selected');
        });
        row.addEventListener('dblclick',()=>openPath(ip));
        row.addEventListener('contextmenu',(e)=>{e.preventDefault();CTX.showItemMenu(e.clientX,e.clientY,ip)});
        // 拖拽
        row.draggable=true;
        row.addEventListener('dragstart',(e)=>{
          e.dataTransfer.effectAllowed='copyMove';
          e.dataTransfer.setData('text/x-vfs-path',ip);
          e.dataTransfer.setData('text/plain',it.name);
          if(it.type==='file'){
            try{
              const blob=VFS.readAsBlob(ip);
              if(blob){
                const url=URL.createObjectURL(blob);
                e.dataTransfer.setData('DownloadURL',`${blob.type}:${it.name}:${url}`);
                try{e.dataTransfer.items.add(new File([blob],it.name,{type:blob.type}))}catch{}
                setTimeout(()=>URL.revokeObjectURL(url),6000);
              }
            }catch{}
          }
        });
        // 文件夹可作为 drop target
        if(it.type==='dir'){
          row.addEventListener('dragover',(e)=>{
            if(e.dataTransfer.types.includes('text/x-vfs-path')||e.dataTransfer.types.includes('Files')){
              e.preventDefault();row.classList.add('drop-hint');
            }
          });
          row.addEventListener('dragleave',()=>row.classList.remove('drop-hint'));
          row.addEventListener('drop',async(e)=>{
            e.preventDefault();row.classList.remove('drop-hint');e.stopPropagation();
            if(e.dataTransfer.files&&e.dataTransfer.files.length){
              await importDroppedItems(e.dataTransfer.items,ip);
            }else{
              const src=e.dataTransfer.getData('text/x-vfs-path');
              if(!src)return;
              const target=join(ip,baseOf(src));
              if(src===target)return;
              VFS.rename(src,target);
              APP.notifyChange(curPath);APP.notifyChange(ip);
            }
            refresh();
          });
        }
        list.appendChild(row);
      });
      // 空白区域 drop
      list.ondragover=(e)=>{
        if(e.dataTransfer.types.includes('text/x-vfs-path')||e.dataTransfer.types.includes('Files')){
          e.preventDefault();
        }
      };
      list.ondrop=async(e)=>{
        e.preventDefault();
        if(e.dataTransfer.files&&e.dataTransfer.files.length){
          await importDroppedItems(e.dataTransfer.items,curPath);refresh();
        }else{
          const src=e.dataTransfer.getData('text/x-vfs-path');
          if(!src||dirOf(src)===curPath)return;
          const name=VFS.uniqueName(curPath,baseOf(src));
          VFS.rename(src,join(curPath,name));
          APP.notifyChange(dirOf(src));
          refresh();
        }
      };
      list.oncontextmenu=(e)=>{
        if(e.target.closest('.fe-item'))return;
        e.preventDefault();
        CTX.show(e.clientX,e.clientY,[
          {label:'新建文件夹',icon:ICON.newfolder,action:async()=>{
            const n=await DIALOG.prompt('文件夹名：','新建文件夹');if(!n)return;
            VFS.mkdir(join(curPath,VFS.uniqueName(curPath,n)));refresh();
          }},
          {label:'新建文本',icon:ICON.newfile,action:async()=>{
            const n=await DIALOG.prompt('文件名：','新建文本.txt');if(!n)return;
            VFS.writeFile(join(curPath,VFS.uniqueName(curPath,n)),'','text/plain');refresh();
          }},
          {label:'上传文件',icon:ICON.upload,action:()=>pickFilesTo(curPath)},
          {label:'粘贴',icon:ICON.paste,disabled:!CLIP.data,action:()=>{CLIP.pasteTo(curPath);refresh()}},
          {label:'挂载本地文件夹',icon:ICON.mount,action:()=>mountLocal()},
          {sep:true},
          {label:'刷新',icon:ICON.refresh,action:refresh},
        ]);
      };
    }
    refresh();
  }
});

/* 本地文件夹挂载（File System Access API 包装为 VFS 后端） */
async function mountLocal(){
  if(!window.showDirectoryPicker){toast('当前浏览器不支持 File System Access API','error');return}
  try{
    const handle=await window.showDirectoryPicker();
    const mountPath='/mnt/local/'+handle.name;
    if(VFS.exists(mountPath)){toast('该文件夹已挂载','error');return}
    // 创建挂载点
    if(!VFS.exists('/mnt'))VFS.mkdir('/mnt');
    if(!VFS.exists('/mnt/local'))VFS.mkdir('/mnt/local');
    VFS.mkdir(mountPath);
    // 注册一个轻量代理：覆盖 VFS 的相关方法，将操作路由到 handle
    // 为简化，此处采用一次性快照导入：将本地目录读取并复制到 VFS（读取权限）。
    // 写入时，尝试通过 handle 回写。
    await syncLocalToVfs(handle,mountPath);
    VFS.flush();
    toast(`已挂载 ${handle.name} 到 ${mountPath}`,'success');
    DESK.render();APP.notifyChange&&APP.notifyChange('/mnt/local');
  }catch(e){
    console.warn(e);
    if(e.name!=='AbortError')toast('挂载失败：'+e.message,'error');
  }
}
async function syncLocalToVfs(handle,parentPath){
  for await(const [name,entry] of handle.entries()){
    const p=join(parentPath,name);
    if(entry.kind==='file'){
      try{
        const f=await entry.getFile();
        const buf=new Uint8Array(await f.arrayBuffer());
        VFS.writeFile(p,buf,f.type||MIME.guess(name));
      }catch(e){console.warn('sync file fail',name,e)}
    }else{
      VFS.mkdir(p);
      await syncLocalToVfs(entry,p);
    }
  }
}

APP.register('csv',{
  name:'表格',icon:ICON.csv,
  launch(args){
    const path=args.path||null;
    let content='',sep=',';
    if(path){
      content=VFS.readFile(path,'text')||'';
      if(extOf(path)==='tsv')sep='\t';
    }
    const body=el('div',{class:'csv-view'});
    const {id,rec}=WM.create({title:path?baseOf(path)+' — 表格':'表格',w:680,h:440,app:'csv',body});
    let mode='table';
    const bar=el('div',{class:'csv-bar'});
    const tabs=el('div',{class:'csv-tabs'});
    const tTab=el('div',{class:'csv-tab active'},'表格');
    const tTxt=el('div',{class:'csv-tab'},'文本');
    tabs.append(tTab,tTxt);
    const btnSave=el('button',{class:'btn primary',onClick:()=>save()},'保存');
    bar.append(tabs,btnSave);
    const tableWrap=el('div',{class:'csv-table-wrap'});
    const ta=el('textarea',{class:'np-ta',style:{display:'none'}});
    ta.value=content;
    body.append(bar,tableWrap,ta);
    function render(){
      if(mode==='table'){
        const rows=parseCSV(content,sep);
        if(!rows.length){tableWrap.innerHTML='<div class="fe-empty">无内容</div>';return}
        const tbl=el('table',{class:'csv-table'});
        const thead=el('thead');const trh=el('tr');
        rows[0].forEach(c=>trh.appendChild(el('th',{},c)));thead.appendChild(trh);tbl.appendChild(thead);
        const tbody=el('tbody');
        for(let i=1;i<rows.length;i++){
          const tr=el('tr');
          rows[i].forEach(c=>tr.appendChild(el('td',{},c)));
          tbody.appendChild(tr);
        }
        tbl.appendChild(tbody);
        tableWrap.innerHTML='';tableWrap.appendChild(tbl);
      }else{
        tableWrap.innerHTML='';tableWrap.style.display='none';
        ta.style.display='block';ta.value=content;
      }
    }
    function parseCSV(str,sep){
      const rows=[];let row=[],cell='',q=false;
      for(let i=0;i<str.length;i++){
        const c=str[i];
        if(q){
          if(c==='"'&&str[i+1]==='"'){cell+='"';i++}
          else if(c==='"')q=false;
          else cell+=c;
        }else{
          if(c==='"')q=true;
          else if(c===sep){row.push(cell);cell=''}
          else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
          else if(c==='\r'){}
          else cell+=c;
        }
      }
      if(cell!==''||row.length)row.push(cell);
      if(row.length)rows.push(row);
      return rows;
    }
    function save(){
      if(!path){toast('无文件路径，请另存为','error');return}
      const v=mode==='text'?ta.value:content;
      if(!VFS.writeFile(path,v,path.endsWith('.tsv')?'text/tab-separated-values':'text/csv')){toast('保存失败：'+(CK.lastError||'Cookie 空间不足'),'error',5000);return}
      toast('已保存','success');APP.notifyChange(dirOf(path));
    }
    tTab.onclick=()=>{if(mode==='text'){content=ta.value}mode='table';tTab.classList.add('active');tTxt.classList.remove('active');ta.style.display='none';tableWrap.style.display='';render()};
    tTxt.onclick=()=>{mode='text';tTxt.classList.add('active');tTab.classList.remove('active');render()};
    render();
  }
});

          'F3':()=>navMatch(1),'Esc':()=>{if(findbar.classList.contains('show'))toggleFind()}
        }
      });
      editor.on('cursorActivity',updateStatus);
      editor.on('change',updateStatus);
      setTimeout(()=>editor.refresh(),50);
    }else{
      editPane.innerHTML='';editPane.appendChild(ta0);
      ta0.style.width='100%';ta0.style.height='100%';
    }

    // 分割拖拽
    {
      let dragging=false,sx,ew,pw;
      divider.addEventListener('mousedown',(e)=>{dragging=true;sx=e.clientX;ew=editPane.offsetWidth;pw=prevPane.offsetWidth;e.preventDefault()});
      window.addEventListener('mousemove',(e)=>{
        if(!dragging)return;
        const dx=e.clientX-sx;
        const nw=Math.max(200,ew+dx),npw=Math.max(120,pw-dx);
        editPane.style.flex='0 0 '+nw+'px';prevPane.style.flex='0 0 '+npw+'px';
      });
      window.addEventListener('mouseup',()=>{if(dragging){dragging=false;editor&&editor.refresh()}});
    }

    function updateStatus(){
      if(!editor){status.innerHTML='';return}
      const c=editor.getCursor();
      const sel=editor.getSelection();
      const v=editor.getValue();
      const lines=v.split('\n').length;
      status.innerHTML=`<span>行 ${c.line+1}，列 ${c.ch+1}</span>`+
        (sel?`<span>已选 ${sel.length} 字符</span>`:'')+
        `<span>${lines} 行</span><span>${v.length} 字符</span><span>${mode}</span><span>UTF-8</span>`;
    }
    function modeByExt(p){
      const e=extOf(p);
      if(e==='html'||e==='htm')return 'htmlmixed';
      if(e==='css')return 'css';
      if(e==='js'||e==='mjs')return 'javascript';
      if(e==='json')return 'application/json';
      if(e==='md'||e==='markdown')return 'markdown';
      if(e==='xml'||e==='svg')return 'xml';
      return 'htmlmixed';
    }
    function setModeByExt(name){
      const m=modeByExt(name);
      mode=m;modeSel.value=m;
      editor&&editor.setOption('mode',m);
    }
    modeSel.addEventListener('change',()=>{mode=modeSel.value;editor&&editor.setOption('mode',mode);updateStatus()});

    function runPreview(){
      if(!editor)return;
      const v=editor.getValue();
      try{
        const doc=iframe.contentDocument;
        doc.open();doc.write(v);doc.close();
      }catch(e){
        const blob=new Blob([v],{type:'text/html'});
        iframe.src=URL.createObjectURL(blob);
      }
    }
    function format(){
      if(!editor||!window.js_beautify)return;
      const cur=editor.getCursor();
      const v=editor.getValue();
      let out=v;
      try{
        if(mode==='htmlmixed')out=html_beautify(v,{indent_size:2,indent_inner_html:true,wrap_line_length:120,max_preserve_newlines:3,end_with_newline:true});
        else if(mode==='css')out=css_beautify(v,{indent_size:2,end_with_newline:true});
        else if(mode==='javascript'||mode==='application/json')out=js_beautify(v,{indent_size:2,end_with_newline:true});
        else out=v;
      }catch(e){toast('格式化失败：'+e.message,'error')}
      editor.setValue(out);editor.setCursor(cur);
    }
    function foldAll(){
      editor.eachLine(l=>{editor.foldCode(l.line)});
    }
    function unfoldAll(){
      editor.eachLine(l=>{try{editor.foldCode(l.line,{range:{from:CodeMirror.Pos(l.line,0),to:CodeMirror.Pos(l.line)},unfold:true})}catch{}});
    }
    let marks=[];let matches=[];let mi=0;
    function toggleFind(){findbar.classList.toggle('show');if(findbar.classList.contains('show')){fFind.focus();doFind()}}
    function getSearchOpts(){return {caseFold:!swCase.classList.contains('on')?'smart':'sensitive'}}
    function buildQuery(){
      let q=fFind.value;
      const re=swRe.classList.contains('on');
      const word=swWord.classList.contains('on');
      if(!q)return null;
      if(re){try{return new RegExp(q,swCase.classList.contains('on')?'g':'gi')}catch{toast('无效正则','error');return null}}
      if(word)q='\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b';
      return q;
    }
    function doFind(){
      marks.forEach(m=>m.clear());marks=[];matches=[];mi=0;
      const q=buildQuery();
      if(!q){fCount.textContent='0/0';return}
      const cs=swCase.classList.contains('on');
      const cur=editor.getSearchCursor(q,null,{caseFold:!cs});
      while(cur.findNext()){
        const from=cur.from(),to=cur.to();
        marks.push(editor.markText(from,to,{className:'cm-hl-match'}));
        matches.push({from,to});
      }
      fCount.textContent=matches.length?`0/${matches.length}`:'0/0';
    }
    function navMatch(dir){
      if(!matches.length){doFind();if(!matches.length)return}
      mi=(mi+dir+matches.length)%matches.length;
      const m=matches[mi];
      editor.setSelection(m.from,m.to);editor.scrollIntoView(m.from);
      // 重绘当前高亮
      marks.forEach((mk,i)=>{mk.className=i===mi?'cm-hl-cur':'cm-hl-match';});
      fCount.textContent=`${mi+1}/${matches.length}`;
    }
    function repOne(){
      if(!matches.length)return;
      const m=matches[mi];
      editor.replaceRange(fRep.value,m.from,m.to);
      doFind();
    }
    function repAll(){
      const q=buildQuery();if(!q)return;
      const v=editor.getValue();
      let flags='g';if(!swCase.classList.contains('on'))flags+='i';
      let rx;
      try{
        if(swRe.classList.contains('on'))rx=new RegExp(q.source||q,flags);
        else rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags);
      }catch{return}
      editor.setValue(v.replace(rx,fRep.value));
      doFind();
    }
    [swCase,swWord,swRe].forEach(s=>s.onclick=()=>{s.classList.toggle('on');doFind()});
    fFind.addEventListener('input',doFind);
    fFind.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){e.preventDefault();navMatch(e.shiftKey?-1:1)}
      if(e.key==='Escape')toggleFind();
    });

    let curPath=path;
    function saveCur(){
      if(!editor)return;
      if(!curPath){
        DIALOG.prompt('保存到：','/桌面/未命名.html','另存为').then(p=>{
          if(!p)return;curPath=normPath(p);
          if(!VFS.writeFile(curPath,editor.getValue(),MIME.guess(baseOf(curPath)))){toast('保存失败：'+(CK.lastError||'Cookie 空间不足'),'error',5000);return}
          rec.el.querySelector('.win-title').textContent=baseOf(curPath)+' — 代码编辑器';
          toast('已保存','success');APP.notifyChange&&APP.notifyChange(dirOf(curPath));
        });return;
      }
      if(!VFS.writeFile(curPath,editor.getValue(),MIME.guess(baseOf(curPath)))){toast('保存失败：'+(CK.lastError||'Cookie 空间不足'),'error',5000);return}
      toast('已保存','success');APP.notifyChange&&APP.notifyChange(dirOf(curPath));
    }

    setTimeout(runPreview,200);
    updateStatus();
  }
});

APP.register('manga',{
  name:'漫画阅读器',icon:ICON.image,
  launch(args){
    const path=args.path;
    const dir=dirOf(path);
    const items=VFS.readdir(dir).filter(it=>{
      if(it.type!=='file')return false;
      const e=extOf(it.name);
      return ['jpg','jpeg','png','webp','gif'].includes(e);
    });
    items.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
    const body=el('div',{class:'mg'});
    const {rec,win}=WM.create({title:'漫画 — '+baseOf(path),w:700,h:600,app:'manga',body});
    const bar=el('div',{class:'mg-bar'});
    const bFs=el('button',{class:'btn',onClick:toggleFs},'全屏');
    const bDown=el('button',{class:'btn',onClick:()=>downloadVFS(path)},'下载当前');
    const info=el('span',{style:{fontSize:'12px',color:'var(--ink-faint)',marginLeft:'auto'}},`${items.length} 张`);
    bar.append(bFs,bDown,info);
    const scroll=el('div',{class:'mg-scroll'});
    scroll.appendChild(el('div',{class:'mg-loading'},'加载中…'));
    const exitFs=el('div',{class:'mg-fs-exit',onClick:()=>{
      if(document.fullscreenElement)document.exitFullscreen();
      body.classList.remove('fullscreen');
    }},'×');
    body.append(bar,scroll,exitFs);

    let targetIdx=0;
    async function load(){
      const paths=items.map(i=>join(dir,i.name));
      const blobs=await Promise.all(paths.map(p=>{
        try{return Promise.resolve(VFS.readAsBlob(p))}catch{return Promise.resolve(null)}
      }));
      scroll.innerHTML='';
      blobs.forEach((b,i)=>{
        if(!b){scroll.appendChild(el('div',{class:'mg-loading'},'读取失败：'+items[i].name));return}
        const u=URL.createObjectURL(b);
        const im=el('img',{src:u});
        if(items[i].name===baseOf(path))targetIdx=i;
        scroll.appendChild(im);
      });
      // 定位
      setTimeout(()=>{
        const imgs=scroll.querySelectorAll('img');
        if(imgs[targetIdx])imgs[targetIdx].scrollIntoView({block:'start'});
      },100);
    }
    function toggleFs(){
      if(!document.fullscreenElement){
        (win.requestFullscreen?win:document.documentElement).requestFullscreen().catch(()=>{});
        body.classList.add('fullscreen');
      }else{
        document.exitFullscreen();body.classList.remove('fullscreen');
      }
    }
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement)body.classList.remove('fullscreen');
    });
    load();
  }
});

/* =====================================================================
   应用：Zip 解压（支持 zip/gz/tar）
   ===================================================================== */
APP.register('zip',{
  name:'压缩包',icon:ICON.zip,
  launch:async (args)=>{
    const path=args.path;
    const blob=VFS.readAsBlob(path);if(!blob){toast('无法读取','error');return}
    const body=el('div',{class:'fe'});
    const {rec}=WM.create({title:baseOf(path)+' — 解压',w:560,h:400,app:'zip',body});
    body.innerHTML='<div class="fe-empty">正在解压…</div>';
    const ext=extOf(path);
    const target=join(dirOf(path),baseOf(path).replace(/\.(zip|gz|tgz|tar)$/i,''));
    try{
      if(ext==='zip'){
        if(!window.JSZip)throw new Error('JSZip 未加载');
        const zip=await JSZip.loadAsync(blob);
        /* 解压前安全检查：预防 zip bomb */
        let totalUnzip=0;
        for(const [name,file] of Object.entries(zip.files)){
          if(file.dir)continue;
          const us=(file._data&&file._data.uncompressedSize)||0;
          totalUnzip+=us;
          if(us>IMPORT_GUARD.HARD_SINGLE||totalUnzip>IMPORT_GUARD.HARD_BATCH)
            throw new Error('压缩包解压后预计超过安全上限，已阻止以避免内存崩溃');
        }
        if(!VFS.exists(target))VFS.mkdir(target);
        let c=0;
        for(const [name,file] of Object.entries(zip.files)){
          if(file.dir){VFS.mkdir(join(target,name));continue}
          const buf=new Uint8Array(await file.async('uint8array'));
          if(buf.length>IMPORT_GUARD.HARD_SINGLE)throw new Error(`文件 ${name} 解压后大小超过安全上限`);
          const parts=name.split('/').filter(Boolean);
          let acc=target;
          for(let i=0;i<parts.length-1;i++){acc=join(acc,parts[i]);if(!VFS.exists(acc))VFS.mkdir(acc)}
          VFS.writeFile(join(target,name),buf,MIME.guess(name));
          c++;
        }
        VFS.flush();
        body.innerHTML='';body.appendChild(el('div',{class:'fe-empty'},`已解压 ${c} 个文件到 ${target}`));
        toast('解压完成','success');
        APP.notifyChange&&APP.notifyChange(dirOf(target));
        return;
      }
      // .gz / .tgz：使用原生 DecompressionStream
      if(ext==='gz'||ext==='tgz'){
        if(!window.DecompressionStream)throw new Error('浏览器不支持 DecompressionStream');
        const ds=new DecompressionStream('gzip');
        const decompressed=blob.stream().pipeThrough(ds);
        /* 流式读取，防止 zip bomb */
        const buf=await streamToU8Limited(decompressed,IMPORT_GUARD.HARD_BATCH);
        if(ext==='tgz'){
          // tar 文件解析
          const files=parseTar(buf);
          if(!VFS.exists(target))VFS.mkdir(target);
          let c=0;
          for(const f of files){
            if(f.type==='directory'){VFS.mkdir(join(target,f.name));continue}
            if(!f.name)continue;
            const parts=f.name.split('/').filter(Boolean);
            let acc=target;
            for(let i=0;i<parts.length-1;i++){acc=join(acc,parts[i]);if(!VFS.exists(acc))VFS.mkdir(acc)}
            if(f.data&&f.data.length>IMPORT_GUARD.HARD_SINGLE)throw new Error(`文件 ${f.name} 解压后大小超过安全上限`);
            VFS.writeFile(join(target,f.name),f.data,MIME.guess(f.name));
            c++;
          }
          VFS.flush();
          body.innerHTML='';body.appendChild(el('div',{class:'fe-empty'},`已解压 ${c} 个文件`));
          toast('解压完成','success');
          APP.notifyChange&&APP.notifyChange(dirOf(target));
        }else{
          // 普通 .gz → 保存为单文件
          const outName=baseOf(path).replace(/\.gz$/i,'');
          VFS.writeFile(join(dirOf(path),outName),buf,MIME.guess(outName));
          VFS.flush();
          body.innerHTML='';body.appendChild(el('div',{class:'fe-empty'},`已解压为 ${outName}`));
          toast('解压完成','success');
          APP.notifyChange&&APP.notifyChange(dirOf(path));
        }
        return;
      }
      if(ext==='tar'){
        const buf=new Uint8Array(await blob.arrayBuffer());
        const files=parseTar(buf);
        if(!VFS.exists(target))VFS.mkdir(target);
        let c=0;
        for(const f of files){
          if(f.type==='directory'){VFS.mkdir(join(target,f.name));continue}
          if(!f.name)continue;
          const parts=f.name.split('/').filter(Boolean);
          let acc=target;
          for(let i=0;i<parts.length-1;i++){acc=join(acc,parts[i]);if(!VFS.exists(acc))VFS.mkdir(acc)}
          if(f.data&&f.data.length>IMPORT_GUARD.HARD_SINGLE)throw new Error(`文件 ${f.name} 解压后大小超过安全上限`);
          VFS.writeFile(join(target,f.name),f.data,MIME.guess(f.name));
          c++;
        }
        VFS.flush();
        body.innerHTML='';body.appendChild(el('div',{class:'fe-empty'},`已解压 ${c} 个文件`));
        toast('解压完成','success');
        APP.notifyChange&&APP.notifyChange(dirOf(target));
        return;
      }
      throw new Error('不支持的压缩格式：'+ext);
    }catch(e){
      body.innerHTML='';
      body.appendChild(el('div',{class:'fe-empty'},'解压失败：'+e.message));
    }
  }
});

/* TAR 解析（极简：USTAR 格式） */
function parseTar(buf){
  const files=[];
  let off=0;
  const dec=new TextDecoder('utf-8');
  while(off+512<=buf.length){
    const header=buf.subarray(off,off+512);
    // 全零表示结束
    if(header.every(b=>b===0))break;
    let name=dec.decode(header.subarray(0,100)).replace(/\0+$/,'');
    const sizeStr=dec.decode(header.subarray(124,136)).replace(/\0+$/,'').trim();
    const size=parseInt(sizeStr,8)||0;
    const typeFlag=String.fromCharCode(header[156]);
    const prefix=dec.decode(header.subarray(345,500)).replace(/\0+$/,'');
    if(prefix)name=prefix+'/'+name;
    off+=512;
    const data=buf.subarray(off,off+size);
    const type=typeFlag==='5'?'directory':'file';
    files.push({name,type,data:new Uint8Array(data)});
    off+=Math.ceil(size/512)*512;
  }
  return files;
}

APP.register('calc',{
  name:'计算器',icon:ICON.appCalc,
  launch(){
    const body=el('div',{class:'calc'});
    const {rec}=WM.create({title:'计算器',w:280,h:400,app:'calc',body});
    const disp=el('div',{class:'calc-disp'},[el('div',{class:'ce'},''),el('div',{class:'cv'},'0')]);
    const grid=el('div',{class:'calc-grid'});
    body.append(disp,grid);
    let cur='0',prev=null,op=null,reset=false;
    const ce=disp.querySelector('.ce'),cv=disp.querySelector('.cv');
    const upd=()=>{cv.textContent=cur;ce.textContent=(prev!=null?prev+' '+(op||'')+' ':'')+cur};
    const keys=[
      ['C','op'],['±','op'],['%','op'],['÷','op'],
      ['7',''],['8',''],['9',''],['×','op'],
      ['4',''],['5',''],['6',''],['−','op'],
      ['1',''],['2',''],['3',''],['＋','op'],
      ['0',''],['.',''],['⌫',''],['＝','eq']
    ];
    keys.forEach(([k,cls])=>{
      const b=el('button',{class:'calc-key '+cls,onClick:()=>press(k)},k);
      grid.appendChild(b);
    });
    function press(k){
      if(k==='C'){cur='0';prev=null;op=null;reset=false}
      else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0'}
      else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):'-'+cur}
      else if(k==='%'){cur=String(parseFloat(cur)/100)}
      else if('＋−×÷'.includes(k)){
        if(prev!=null&&op&&!reset){compute()}
        prev=cur;op=k;reset=true;
      }else if(k==='＝'){
        compute();op=null;prev=null;reset=true;
      }else if(k==='.'){
        if(reset){cur='0';reset=false}
        if(!cur.includes('.'))cur+='.';
      }else{
        if(reset){cur='';reset=false}
        if(cur==='0')cur=k;else cur+=k;
      }
      upd();
    }
    function compute(){
      const a=parseFloat(prev),b=parseFloat(cur);
      let r=0;
      if(op==='＋')r=a+b;else if(op==='−')r=a-b;else if(op==='×')r=a*b;else if(op==='÷')r=b===0?NaN:a/b;
      cur=String(r);
    }
    upd();
  }
});

APP.register('paint',{
  name:'画板',icon:ICON.appPaint,
  launch(){
    const body=el('div',{class:'paint'});
    const {rec}=WM.create({title:'画板',w:640,h:520,app:'paint',body});
    const bar=el('div',{class:'paint-bar'});
    const col=el('input',{type:'color',value:'#2a2622'});
    const sz=el('input',{type:'range',min:'1',max:'50',value:'3'});
    const bEraser=el('button',{class:'btn',onClick:()=>eraser=!eraser},'橡皮');
    const bClear=el('button',{class:'btn',onClick:()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cnv.width,cnv.height)}},'清空');
    const bSave=el('button',{class:'btn primary',onClick:()=>savePaint()},'保存到桌面');
    let eraser=false;
    bar.append(el('span',{},'颜色'),col,el('span',{},'粗细'),sz,bEraser,bClear,bSave);
    const wrap=el('div',{class:'paint-canvas-wrap'});
    const cnv=el('canvas',{width:'800',height:'600'});
    wrap.appendChild(cnv);body.append(bar,wrap);
    const ctx=cnv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cnv.width,cnv.height);
    ctx.lineCap='round';ctx.lineJoin='round';
    let drawing=false,lx=0,ly=0;
    const pos=(e)=>{
      const r=cnv.getBoundingClientRect();
      const t=e.touches?e.touches[0]:e;
      return {x:(t.clientX-r.left)*cnv.width/r.width,y:(t.clientY-r.top)*cnv.height/r.height};
    };
    const down=(e)=>{drawing=true;const p=pos(e);lx=p.x;ly=p.y;if(e.cancelable)e.preventDefault()};
    const move=(e)=>{
      if(!drawing)return;
      const p=pos(e);
      ctx.strokeStyle=eraser?'#fff':col.value;
      ctx.lineWidth=parseInt(sz.value);
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();
      lx=p.x;ly=p.y;if(e.cancelable)e.preventDefault();
    };
    const up=()=>drawing=false;
    cnv.addEventListener('mousedown',down);cnv.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
    cnv.addEventListener('touchstart',down,{passive:false});cnv.addEventListener('touchmove',move,{passive:false});cnv.addEventListener('touchend',up);
    async function savePaint(){
      const name=await DIALOG.prompt('保存为：','画作.png','保存');
      if(!name)return;
      cnv.toBlob(async b=>{
        const buf=new Uint8Array(await b.arrayBuffer());
        if(!VFS.writeFile(join('/桌面',VFS.uniqueName('/桌面',name)),buf,'image/png')){toast('保存失败：'+(CK.lastError||'Cookie 空间不足'),'error',5000);return}
        toast('已保存','success');DESK.render();
      });
    }
  }
});

          transition:'border-color .2s,background .2s'
        },onClick:async()=>{
          if(id===cur)return;
          const warnings={
            safe:null,
            balanced:'均衡模式增加了分片数，适合 Chrome/Edge/Firefox。建议先导出备份。确定切换？',
            extreme:'极限模式接近 Chromium 单域 Cookie 数量上限，可能触发浏览器逐出旧 Cookie。建议先导出备份。确定切换？',
            safari:'Safari 极限模式仅建议 Safari/WebKit 测试，Chrome/Edge/Firefox 可能直接失败或逐出 Cookie。建议先导出备份。确定切换？',
          };
          if(warnings[id]&&!await DIALOG.confirm(warnings[id],'切换'+p.name))return;
          CK.setProfile(id);
          const ok=VFS.flush();
          if(ok){
            toast('已切换至'+p.name,'success');
            renderCapacity();
          }else{
            toast('切换后持久化失败，请检查存储空间','error');
          }
        }});
        card.appendChild(el('div',{style:{fontWeight:'500',fontSize:'14px',color:isCur?'var(--cinnabar)':'var(--ink)',marginBottom:'4px'}},p.name+(isCur?' ✓':'')));
        card.appendChild(el('div',{style:{fontSize:'11px',color:'var(--ink-faint)',marginBottom:'6px'}},`${p.chunks} 片 × ${p.chunkSize} 字符 = ${fmtSize(p.chunks*p.chunkSize)}`));
        card.appendChild(el('div',{style:{fontSize:'11px',color:'var(--ink-soft)',lineHeight:'1.5'}},p.note));
        grid.appendChild(card);
      });
      s.appendChild(grid);

      /* 浏览器适配建议 */
      s.appendChild(el('div',{style:{marginTop:'16px',padding:'10px 14px',borderRadius:'6px',fontSize:'12px',background:'var(--paper-soft)',border:'1px solid var(--ink-line)',lineHeight:'1.8'}},[
        el('div',{style:{fontWeight:'500',marginBottom:'6px',color:'var(--ink)'}},'浏览器适配建议'),
        el('div',{style:{color:'var(--ink-soft)'}},'Chrome / Edge / Firefox：推荐「均衡模式」或「安全模式」'),
        el('div',{style:{color:'var(--ink-soft)'}},'Safari / WebKit：可尝试「Safari 极限」获得更大容量'),
        el('div',{style:{color:'var(--ink-soft)'}},'不确定：使用「安全模式」，最稳定'),
        el('div',{style:{color:'var(--cinnabar)',marginTop:'4px'}},'⚠ 切换前建议先导出备份，以防数据丢失'),
      ]));

      pane.appendChild(s);
    }
    /* === 块设备可视化表格 === */
    function renderChunks(){
      pane.innerHTML='';
      const s=el('div',{class:'set-section'});
      const cm=CK.chunkMap();
      /* 概览信息 */
      s.appendChild(el('h4',{},'块设备映射 · Cookie 分片详情'));
      const infoBox=el('div',{style:{padding:'10px 14px',borderRadius:'6px',marginBottom:'12px',fontSize:'12px',
        background:'var(--paper-soft)',border:'1px solid var(--ink-line)',lineHeight:'1.8'}});
      const meta=cm.meta;
      if(meta){
        infoBox.appendChild(el('div',{},[
          el('span',{style:{color:'var(--ink-faint)'}},'索引版本: '),
          el('strong',{},'v'+meta.v),
          el('span',{style:{marginLeft:'12px',color:'var(--ink-faint)'}},'活动 Bank: '),
          el('strong',{style:{color:meta.bank?'var(--cinnabar)':'var(--ink-faint)'}},meta.bank||'legacy(无bank)'),
          el('span',{style:{marginLeft:'12px',color:'var(--ink-faint)'}},'提交次数: '),
          el('strong',{},String(meta.commit||0)),
          el('span',{style:{marginLeft:'12px',color:'var(--ink-faint)'}},'编解码器: '),
          el('strong',{},meta.codec||'?'),
        ]));
        if(meta.time){
          infoBox.appendChild(el('div',{style:{color:'var(--ink-faint)',marginTop:'4px'}},
            '上次写入: '+new Date(meta.time).toLocaleString('zh-CN')));
        }
      }
      infoBox.appendChild(el('div',{style:{marginTop:'6px'}},[
        el('span',{style:{color:'var(--ink-faint)'}},'已用: '),
        el('strong',{style:{color:cm.usedChunks>0?'var(--cinnabar)':'var(--ink)'}},String(cm.usedChunks)),
        el('span',{style:{color:'var(--ink-faint)'}},' / '+cm.totalChunks+' 片'),
        el('span',{style:{marginLeft:'12px',color:'var(--ink-faint)'}},'空闲: '),
        el('strong',{},String(cm.freeChunks)),
        el('span',{style:{marginLeft:'12px',color:'var(--ink-faint)'}},'Cookie 总字节: '),
        el('strong',{},String(cm.cookieBytes)),
      ]));
      s.appendChild(infoBox);

      /* 分片表格 */
      const wrap=el('div',{style:{overflowX:'auto',maxHeight:'350px',overflowY:'auto',border:'1px solid var(--ink-line)',borderRadius:'6px'}});
      const tbl=el('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'11px'}});
      tbl.appendChild(el('thead',{},el('tr',{},[
        el('th',{style:{padding:'5px 8px',textAlign:'left',background:'var(--paper-soft)',borderBottom:'2px solid var(--ink-line)',position:'sticky',top:0,zIndex:1}},'片号'),
        el('th',{style:{padding:'5px 8px',textAlign:'left',background:'var(--paper-soft)',borderBottom:'2px solid var(--ink-line)',position:'sticky',top:0,zIndex:1}},'用途'),
        el('th',{style:{padding:'5px 8px',textAlign:'left',background:'var(--paper-soft)',borderBottom:'2px solid var(--ink-line)',position:'sticky',top:0,zIndex:1}},'Bank'),
        el('th',{style:{padding:'5px 8px',textAlign:'left',background:'var(--paper-soft)',borderBottom:'2px solid var(--ink-line)',position:'sticky',top:0,zIndex:1}},'状态'),
        el('th',{style:{padding:'5px 8px',textAlign:'right',background:'var(--paper-soft)',borderBottom:'2px solid var(--ink-line)',position:'sticky',top:0,zIndex:1}},'占用'),
        el('th',{style:{padding:'5px 8px',textAlign:'right',background:'var(--paper-soft)',borderBottom:'2px solid var(--ink-line)',position:'sticky',top:0,zIndex:1}},'填充率'),
      ])));
      const tbody=el('tbody',{});
      /* 只显示已用 + 孤儿片 + 前10个空闲片 */
      const showMap=cm.map.filter(m=>m.used||m.role==='orphan');
      /* 添加前10个空闲片作为示例 */
      const freeShown=cm.map.filter(m=>!m.used&&m.role==='free').slice(0,10);
      [...showMap,...freeShown].forEach(m=>{
        const roleText={super:'索引区',data:'数据',tail:'末片',orphan:'孤儿旧片',free:'空闲'}[m.role]||m.role;
        const statusText={ok:'正常',corrupted:'损坏',missing:'缺失',orphan:'残留',free:'空闲'}[m.status]||m.status;
        const statusColor={ok:'var(--jade)',corrupted:'var(--seal)',missing:'var(--seal)',orphan:'var(--cinnabar)',free:'var(--ink-faint)'}[m.status]||'var(--ink)';
        const fillPct=m.dataSize>0?Math.round(m.dataSize/CK.MAX_CHUNK_VALUE*100):0;
        const tr=el('tr',{style:{borderBottom:'1px solid var(--ink-line)'}});
        tr.appendChild(el('td',{style:{padding:'4px 8px',fontFamily:'monospace'}},String(m.index)));
        tr.appendChild(el('td',{style:{padding:'4px 8px'}},roleText));
        tr.appendChild(el('td',{style:{padding:'4px 8px',fontFamily:'monospace',color:m.bank==='-'?'var(--ink-faint)':'var(--ink)'}},m.bank));
        tr.appendChild(el('td',{style:{padding:'4px 8px',color:statusColor,fontWeight:'500'}},statusText));
        tr.appendChild(el('td',{style:{padding:'4px 8px',textAlign:'right',fontFamily:'monospace'}},m.rawSize>0?fmtSize(m.rawSize):'—'));
        /* 填充率条 */
        const fillCell=el('td',{style:{padding:'4px 8px',textAlign:'right'}});
        if(fillPct>0){
          const bar=el('div',{style:{display:'inline-block',width:'50px',height:'8px',background:'var(--paper-soft)',borderRadius:'4px',overflow:'hidden',verticalAlign:'middle'}});
          bar.appendChild(el('div',{style:{width:fillPct+'%',height:'100%',background:fillPct>80?'var(--seal)':fillPct>50?'var(--cinnabar)':'var(--jade)',borderRadius:'4px'}}));
          fillCell.appendChild(bar);
          fillCell.appendChild(el('span',{style:{marginLeft:'4px',fontSize:'10px',color:'var(--ink-faint)'}},fillPct+'%'));
        }else{
          fillCell.appendChild(el('span',{style:{color:'var(--ink-faint)'}},'—'));
        }
        tr.appendChild(fillCell);
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      s.appendChild(wrap);

      /* 图例 */
      const legend=el('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',marginTop:'10px',fontSize:'11px',color:'var(--ink-faint)'}});
      [['super','索引区'],['data','数据片'],['tail','末片'],['orphan','孤儿旧片'],['free','空闲']].forEach(([role,label])=>{
        const dot=el('span',{style:{display:'inline-block',width:'8px',height:'8px',borderRadius:'50%',marginRight:'4px',
          background:{super:'var(--accent2)',data:'var(--jade)',tail:'var(--cinnabar)',orphan:'var(--seal)',free:'var(--ink-line)'}[role]}});
        legend.appendChild(el('span',{},[dot,label]));
      });
      s.appendChild(legend);

      /* 操作按钮 */
      s.appendChild(el('div',{style:{marginTop:'12px',display:'flex',gap:'8px'}},[
        el('button',{class:'btn',onClick:()=>{renderChunks()}},'刷新映射'),
        el('button',{class:'btn',onClick:async()=>{
          if(!await DIALOG.confirm('确定清理孤儿片？这将删除非活动 Bank 的残留数据。'))return;
          const m=CK._readIndex('vfs');
          if(m&&m.bank){
            const other=CK._otherBank(m.bank);
            let cleaned=0;
            for(let i=0;i<m.count+10;i++){
              const ck=CK._chunkKey('vfs',i,other);
              if(CK._rawGet(ck)){CK._rawDel(ck);cleaned++}
            }
            toast(cleaned>0?`已清理 ${cleaned} 个孤儿片`:'无孤儿片需要清理','success');
            renderChunks();
          }else{
            toast('当前格式无 Bank 系统','info');
          }
        }},'清理孤儿片'),
      ]));

      pane.appendChild(s);
    }
    tStorage.onclick=()=>{$$('.set-tab',tabs).forEach(t=>t.classList.remove('active'));tStorage.classList.add('active');renderStorage()};
    tCapacity.onclick=()=>{$$('.set-tab',tabs).forEach(t=>t.classList.remove('active'));tCapacity.classList.add('active');renderCapacity()};
    tPerson.onclick=()=>{$$('.set-tab',tabs).forEach(t=>t.classList.remove('active'));tPerson.classList.add('active');renderPerson()};
    tChunks.onclick=()=>{$$('.set-tab',tabs).forEach(t=>t.classList.remove('active'));tChunks.classList.add('active');renderChunks()};
    tAbout.onclick=()=>{$$('.set-tab',tabs).forEach(t=>t.classList.remove('active'));tAbout.classList.add('active');renderAbout()};
    renderStorage();
  }
});

/* =====================================================================
   壁纸系统
   ===================================================================== */
function setWallpaper(id){
  const wp=$('#wallpaper');
  /* 释放上一次自定义壁纸的 Object URL */
  const oldUrl=wp.style.backgroundImage;
  if(oldUrl&&oldUrl.startsWith('url("blob:')||oldUrl.startsWith('url(blob:')){
    const m=oldUrl.match(/blob:([^")]+)/);
    if(m)try{URL.revokeObjectURL(m[0].replace(/url\(["']?/,'').replace(/["']?\)/,''))}catch{}
  }
  if(id==='custom'){
    const blob=VFS.readAsBlob('/sys_wp.png');
    if(blob){
      const url=URL.createObjectURL(blob);
      wp.style.backgroundImage='url('+url+')';wp.className='';wp.style.backgroundSize='cover';wp.style.backgroundPosition='center';
    }
  }else{
    wp.className='wp-'+id;wp.style.backgroundImage='';
  }
  CK._rawSet('wallpaper',id,3650);
}
function loadWallpaper(){
  const id=CK._rawGet('wallpaper')||'xuan';
  setWallpaper(id);
}

/* =====================================================================
   启动
   ===================================================================== */
function boot(){
  /* 应用存储容量模式 */
  CK.applyProfile();
  /* 环境检测 */
  CK.env=CK.detectEnv();

  /* 初始化 VFS（无论环境是否可用，都初始化内存数据） */
  VFS.init();
  loadWallpaper();
  DESK.init();
  buildStartMenu();
  APP.refreshDock();

  /* 环境不可用时显示警告 */
  if(!CK.env.available){
    showEnvWarning(CK.env);
  }

  /* 全局键盘 */
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){$('#start-menu').classList.remove('show');CTX.hide()}
    if((e.ctrlKey||e.metaKey)&&e.key==='v'){/* 留空，浏览器默认 */}
  });
  /* 桌面双击空白打开资源管理器 */
  $('#desktop').addEventListener('dblclick',(e)=>{
    if(!e.target.closest('.desk-icon,.window,#dock,#start-btn,#start-menu,#ctx-menu')){
      APP.launch('explorer',{path:'/桌面'});
    }
  });
  toast(CK.env.available?'羽笺已启，白鸽在望':'羽笺已启（只读模式）',CK.env.available?'success':'error',3000);
}

/* 环境警告横幅 */
function showEnvWarning(env){
  const warn=el('div',{class:'env-warning'},[
    el('div',{class:'env-dismiss',onClick:(e)=>{e.target.parentElement.remove()},html:'×'}),
    el('h4',{},env.type==='file'?'本地文件模式 — Cookie 不可用':env.type==='disabled'?'Cookie 已禁用':env.type==='blocked'?'Cookie 写入被阻止':'存储环境异常'),
    el('div',{style:{whiteSpace:'pre-line'}},env.reason),
    el('div',{class:'env-actions'},[
      el('div',{class:'env-btn',onClick:()=>location.reload()},'重新检测'),
      el('div',{class:'env-btn',onClick:async()=>{
        try{await exportVFSBackupZip()}catch(e){
          /* JSZip 不可用时降级为 JSON */
          const data=JSON.stringify({tree:VFS.root,blobs:VFS.blobs,version:2,exportDate:new Date().toISOString()});
          downloadBlob(new Blob([data],{type:'application/json'}),'vfs-backup.json');
        }
      }},'导出数据'),
      el('div',{class:'env-btn',onClick:(e)=>{
        e.target.closest('.env-warning').remove();
      }},'我知道了（只读模式）'),
    ]),
  ]);
  document.body.appendChild(warn);
  /* 下移桌面内容避免遮挡 */
  const desktop=$('#desktop');
  if(desktop)desktop.style.top='0';
}
boot();

</script>
