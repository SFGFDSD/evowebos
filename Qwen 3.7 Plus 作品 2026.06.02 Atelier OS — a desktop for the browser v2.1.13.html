const Wallpaper = (() => {
  const KEY = 'atelier_wp';
  const BUILTINS = [
    { name:'Atelier dusk', css:`radial-gradient(1200px 700px at 75% -10%, rgba(209,74,31,.25), transparent 60%),radial-gradient(900px 600px at -10% 110%, rgba(106,122,58,.28), transparent 60%),linear-gradient(180deg,#2a1a12 0%,#15110d 60%,#0b0906 100%)` },
    { name:'Cream paper', css:`linear-gradient(135deg,#ece0c8,#d9c89e)` },
    { name:'Night ink', css:`radial-gradient(900px 600px at 20% 20%, rgba(196,145,50,.15), transparent 60%),linear-gradient(180deg,#0a0907,#14110d)` },
    { name:'Moss study', css:`radial-gradient(900px 600px at 80% 90%, rgba(106,122,58,.35), transparent 60%),linear-gradient(180deg,#1e2416,#0e120a)` },
    { name:'Rust field', css:`radial-gradient(800px 500px at 50% 50%, rgba(209,74,31,.35), transparent 60%),linear-gradient(180deg,#2b1208,#150804)` },
    { name:'Graphite', css:`linear-gradient(180deg,#2a2622,#16130f)` },
  ];
  async function init(){
    const data = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (data.type === 'builtin'){ applyCSS(BUILTINS[data.index||0].css); }
    else if (data.type === 'custom'){
      try {
        const buf = await FS.readFile('/tmp/wallpaper.bin', false);
        const blob = new Blob([buf], { type: data.mime || 'image/jpeg' });
        applyBlob(blob);
      } catch(e){ applyCSS(BUILTINS[0].css); }
    } else {
      applyCSS(BUILTINS[0].css);
    }
  }
  function applyCSS(css){
    const d = $('#desktop');
    d.style.backgroundImage = css;
    d.classList.remove('custom-bg');
  }
  function applyBlob(blob){
    const url = URL.createObjectURL(blob);
    const d = $('#desktop');
    d.style.backgroundImage = `url("${url}")`;
    d.classList.add('custom-bg');
  }
  function prompt(){
    WallpaperUI.open();
  }
  async function setCustom(file){
    const buf = await file.arrayBuffer();
    await FS.writeFile('/tmp/wallpaper.bin', buf);
    localStorage.setItem(KEY, JSON.stringify({ type:'custom', mime: file.type }));
    applyBlob(new Blob([buf], { type: file.type }));
  }
  function setBuiltin(i){
    localStorage.setItem(KEY, JSON.stringify({ type:'builtin', index:i }));
    applyCSS(BUILTINS[i].css);
  }
  return { init, prompt, setCustom, setBuiltin, BUILTINS };
})();

      p = normPath(p);

      if (s.type === 'file'){ openFile(p); return; }

        listEl.querySelectorAll('th').forEach(th => {
          if (th.dataset.k === state.sort.key) th.classList.add('sorted');
          const arr = th.querySelector('.arr');
          if (th.dataset.k === state.sort.key) arr.textContent = state.sort.dir>0?'▲':'▼';
          th.onclick = () => {
            if (state.sort.key === th.dataset.k) state.sort.dir *= -1;
            else { state.sort.key = th.dataset.k; state.sort.dir = 1; }
            refresh();
          };
        });
      }
    }

    function bindFxRow(el, entry, view){
      el.addEventListener('click', e => {
        if (e.shiftKey){
          if (state.selected.has(el.dataset.path)) state.selected.delete(el.dataset.path);
          else state.selected.add(el.dataset.path);
        } else {
          state.selected.clear();
          state.selected.add(el.dataset.path);
        }
        [...listEl.querySelectorAll('.fx-row,.fx-g-item')].forEach(r => r.classList.toggle('selected', state.selected.has(r.dataset.path)));
      });
      el.addEventListener('dblclick', () => {
        const p = el.dataset.path;
        if (el.dataset.type === 'dir') go(p);
        else openFile(p);
      });
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (!state.selected.has(el.dataset.path)){ state.selected.clear(); state.selected.add(el.dataset.path); [...listEl.querySelectorAll('.fx-row,.fx-g-item')].forEach(r => r.classList.toggle('selected', state.selected.has(r.dataset.path))); }
        Context.show(e.clientX, e.clientY, fxContextFor(el, state));
      });
      // drag within
      el.draggable = true;
      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('application/x-atelier-path', el.dataset.path);
        e.dataTransfer.setData('application/x-atelier-name', entry.name);
        e.dataTransfer.setData('application/x-atelier-type', el.dataset.type);
      });
      // allow drop on folder rows
      if (el.dataset.type === 'dir'){
        el.addEventListener('dragover', e => {
          if (e.dataTransfer.types.includes('application/x-atelier-path') || e.dataTransfer.types.includes('Files')){
            e.preventDefault(); el.style.outline = '2px dashed var(--rust)';
          }
        });
        el.addEventListener('dragleave', () => { el.style.outline = ''; });
        el.addEventListener('drop', async e => {
          e.preventDefault(); el.style.outline = '';
          const sp = e.dataTransfer.getData('application/x-atelier-path');
          if (sp){
            const sn = e.dataTransfer.getData('application/x-atelier-name');
            if (dirname(sp) !== el.dataset.path){
              try { await FS.rename(sp, joinPath(el.dataset.path, sn)); refresh(); }
              catch(err){ toast('Move failed', err.message, true); }
            }
            return;
          }
          if (e.dataTransfer.files?.length){
            await importFiles([...e.dataTransfer.files], el.dataset.path);
            refresh();
          }
        });
      }
    }

    function fxContextFor(el, st){
      const paths = [...st.selected];
      const isDir = el.dataset.type === 'dir';
      return [
        { label: isDir?'Open folder':'Open', icon:I.open, action: () => { if (isDir) go(el.dataset.path); else openFile(el.dataset.path); } },
        ...(!isDir && paths.length===1 ? [{label:'Download', icon:I.down, action:()=>downloadFile(el.dataset.path)}] : []),
        '-',
        { label:'Rename', icon:I.rename, action:()=>DesktopActions.rename(el.dataset.path) },
        { label:'Copy', icon:I.copy, action:()=>DesktopActions.copy(paths) },
        { label:'Cut', icon:I.cut, action:()=>DesktopActions.cut(paths) },
        { label:'Paste', icon:I.paste, disabled:!Clipboard.has(), action:async()=>{
            for (const p of Clipboard.paths){
              try {
                if (Clipboard.op==='cut') await FS.rename(p, joinPath(st.path, basename(p)));
                else await FS.copy(p, joinPath(st.path, basename(p)));
              } catch(err){ toast('Paste failed', err.message, true); }
            }
            if (Clipboard.op==='cut') Clipboard.paths=[];
            refresh();
          }},
        '-',
        { label:'New folder', icon:I.folderPlus, action:()=>DesktopActions.newFolder(st.path).then(refresh) },
        { label:'New file', icon:I.filePlus, action:()=>DesktopActions.newFile(st.path).then(refresh) },
        '-',
        { label:'Delete', icon:I.trash, action:()=>DesktopActions.del(paths).then(refresh) },
        { label:'Get info', icon:I.info, action:()=>DesktopActions.info(el.dataset.path) },
      ];
    }

    // side clicks
    body.querySelectorAll('.fx-tree-item').forEach(t => t.onclick = () => go(t.dataset.p));

    // toolbar
    body.querySelector('[data-act=up]').onclick = () => { if (state.path !== '/') go(dirname(state.path)); };
    body.querySelector('[data-act=back]').onclick = () => { if (state.hIndex>0){ state.hIndex--; const p=state.history[state.hIndex]; state.path=p; WM.setTitle(win.id, `Files <span class="path">${esc(p)}</span>`); refresh(); } };
    body.querySelector('[data-act=fwd]').onclick = () => { if (state.hIndex<state.history.length-1){ state.hIndex++; const p=state.history[state.hIndex]; state.path=p; WM.setTitle(win.id, `Files <span class="path">${esc(p)}</span>`); refresh(); } };
    body.querySelector('[data-act=view]').onclick = () => { state.view = state.view==='list'?'grid':'list'; body.querySelector('[data-act=view]').innerHTML = state.view==='list'?I.grid:I.list; refresh(); };
    body.querySelector('[data-act=upload]').onclick = () => DesktopActions.uploadTo(state.path).then(refresh);
    body.querySelector('[data-act=newfolder]').onclick = () => DesktopActions.newFolder(state.path).then(refresh);
    body.querySelector('[data-act=newfile]').onclick = () => DesktopActions.newFile(state.path).then(refresh);
    body.querySelector('.fx-search input').oninput = e => { state.query = e.target.value; refresh(); };

    // blank-area drop for upload
    listEl.addEventListener('dragover', e => {
      if (e.dataTransfer.types.includes('Files') || e.dataTransfer.types.includes('application/x-atelier-path')) e.preventDefault();
    });
    listEl.addEventListener('drop', async e => {
      e.preventDefault();
      if (e.dataTransfer.files?.length){
        await importFiles([...e.dataTransfer.files], state.path);
        refresh();
      }
    });

    // right-click on blank
    listEl.addEventListener('contextmenu', e => {
      if (e.target.closest('.fx-row,.fx-g-item')) return;
      e.preventDefault();
      Context.show(e.clientX, e.clientY, [
        { label:'New folder', icon:I.folderPlus, action:()=>DesktopActions.newFolder(state.path).then(refresh) },
        { label:'New file', icon:I.filePlus, action:()=>DesktopActions.newFile(state.path).then(refresh) },
        '-',
        { label:'Upload files…', icon:I.upload, action:()=>DesktopActions.uploadTo(state.path).then(refresh) },
        '-',
        { label:'Paste', icon:I.paste, disabled:!Clipboard.paths.length, action: async () => {
            for (const p of Clipboard.paths){
              try {
                if (Clipboard.op==='cut') await FS.rename(p, joinPath(state.path, basename(p)));
                else await FS.copy(p, joinPath(state.path, basename(p)));
              } catch(err){ toast('Paste failed', err.message, true); }
            }
            if (Clipboard.op==='cut') Clipboard.paths=[];
            refresh();
        }},
        '-',
        { label:'Refresh', icon:I.refresh, action: refresh },
      ]);
    });

    go(state.path, false);
  }
};

    `;
    const win = WM.create({ title:'Notepad', icon:I.notepad, width:720, height:520, body, app:'notepad' });
    const ta = body.querySelector('textarea');
    const ePath = { val: opts.path || null };
    const origText = { val: '' };

    async function load(p){
      try {
        const txt = await FS.readFile(p, true);
        ta.value = txt; origText.val = txt;
        ePath.val = p;
        body.querySelector('#et').textContent = p;
        body.querySelector('#es-saved').textContent = 'saved';
        WM.setTitle(win.id, `Notepad <span class="path">${esc(basename(p))}</span>`);
      } catch(e){ toast('Open failed', e.message, true); }
    }
    function markDirty(){
      body.querySelector('#es-saved').textContent = ta.value !== origText.val ? 'modified' : 'saved';
    }
    function updStatus(){
      const v = ta.value;
      const pos = ta.selectionStart;
      const pre = v.slice(0, pos);
      const ln = pre.split('\n').length;
      const col = pre.length - pre.lastIndexOf('\n');
      body.querySelector('#es-pos').textContent = `Ln ${ln}, Col ${col}`;
      body.querySelector('#es-len').textContent = `${v.length} chars`;
    }
    ta.addEventListener('input', () => { markDirty(); updStatus(); });
    ta.addEventListener('keyup', updStatus);
    ta.addEventListener('click', updStatus);
    ta.addEventListener('keydown', e => {
      if ((e.ctrlKey||e.metaKey) && e.key === 's'){ e.preventDefault(); save(); }
    });

    async function save(){
      if (!ePath.val){ return saveAs(); }
      try {
        await FS.writeFile(ePath.val, ta.value);
        origText.val = ta.value;
        markDirty();
        toast('Saved', ePath.val);
      } catch(err){ toast('Save failed', err.message, true); }
    }
    async function saveAs(){
      const n = await promptDlg('Save as', 'untitled.txt', 'File name (saved to /home/user/Documents):');
      if (!n) return;
      const p = '/home/user/Documents/'+n;
      try {
        await FS.writeFile(p, ta.value);
        ePath.val = p; origText.val = ta.value;
        body.querySelector('#et').textContent = p;
        body.querySelector('#es-saved').textContent = 'saved';
        WM.setTitle(win.id, `Notepad <span class="path">${esc(n)}</span>`);
        Desktop.render();
      } catch(err){ toast('Save failed', err.message, true); }
    }

    body.querySelector('[data-act=save]').onclick = save;
    body.querySelector('[data-act=saveas]').onclick = saveAs;
    body.querySelector('[data-act=open]').onclick = () => FilePicker.open('text').then(p => { if (p) load(p); });

    if (opts.path) load(opts.path);
    else updStatus();
  }
};

/* ---------- CALCULATOR ---------- */
APPS.calc = {
  open(){
    const body = document.createElement('div');
    body.className = 'calc';
    body.innerHTML = `
      <div class="calc-disp"><div class="expr" id="ce">&nbsp;</div><div id="cd">0</div></div>
      <div class="calc-grid">
        <button class="calc-key fn" data-k="AC">AC</button>
        <button class="calc-key fn" data-k="±">±</button>
        <button class="calc-key fn" data-k="%">%</button>
        <button class="calc-key op" data-k="÷">÷</button>
        <button class="calc-key" data-k="7">7</button>
        <button class="calc-key" data-k="8">8</button>
        <button class="calc-key" data-k="9">9</button>
        <button class="calc-key op" data-k="×">×</button>
        <button class="calc-key" data-k="4">4</button>
        <button class="calc-key" data-k="5">5</button>
        <button class="calc-key" data-k="6">6</button>
        <button class="calc-key op" data-k="-">−</button>
        <button class="calc-key" data-k="1">1</button>
        <button class="calc-key" data-k="2">2</button>
        <button class="calc-key" data-k="3">3</button>
        <button class="calc-key op" data-k="+">+</button>
        <button class="calc-key zero" data-k="0">0</button>
        <button class="calc-key" data-k=".">.</button>
        <button class="calc-key op" data-k="=">=</button>
      </div>
    `;
    WM.create({ title:'Calculator', icon:I.calc, width:320, height:480, body, app:'calc' });
    const disp = body.querySelector('#cd');
    const expr = body.querySelector('#ce');
    let cur = '0', prev = null, op = null, justEq = false;
    function render(){ disp.textContent = cur.length>12?parseFloat(cur).toExponential(6):cur; }
    function input(k){
      if (k === 'AC'){ cur='0'; prev=null; op=null; expr.innerHTML='&nbsp;'; }
      else if (k === '±'){ cur = cur.startsWith('-')?cur.slice(1):'-'+cur; }
      else if (k === '%'){ cur = String(parseFloat(cur)/100); }
      else if ('0123456789'.includes(k)){ cur = (cur==='0'||justEq)?k:cur+k; justEq=false; }
      else if (k === '.'){ if (!cur.includes('.')) cur += '.'; }
      else if (['+','-','×','÷'].includes(k)){
        if (prev!=null && op && !justEq){ compute(); }
        prev = parseFloat(cur); op = k; justEq = true;
        expr.textContent = `${prev} ${op}`;
      }
      else if (k === '='){ compute(); expr.textContent = `${prev ?? ''} ${op ?? ''} =`; prev=null; op=null; justEq=true; }
      render();
    }
    function compute(){
      if (prev == null || !op) return;
      const b = parseFloat(cur);
      let r = prev;
      if (op === '+') r = prev + b;
      if (op === '-') r = prev - b;
      if (op === '×') r = prev * b;
      if (op === '÷') r = b === 0 ? NaN : prev / b;
      cur = String(+r.toFixed(10));
    }
    body.querySelectorAll('.calc-key').forEach(b => b.onclick = () => input(b.dataset.k));
    window.addEventListener('keydown', e => {
      if (!document.contains(body)) return;
      const k = e.key;
      if ('0123456789.'.includes(k)) input(k);
      else if (k === '+') input('+');
      else if (k === '-') input('-');
      else if (k === '*') input('×');
      else if (k === '/') { e.preventDefault(); input('÷'); }
      else if (k === 'Enter' || k === '=') input('=');
      else if (k === 'Escape') input('AC');
      else if (k === 'Backspace'){ cur = cur.length>1?cur.slice(0,-1):'0'; render(); }
    });
  }
};

  open(){

          <input type="range" min="1" max="40" value="3" id="psz" style="width:90px"/>
        </label>
        <span style="flex:1"></span>
        <button data-act="clear">Clear</button>
        <button data-act="save">Save to Files</button>
      </div>
      <div class="paint-canvas-wrap"><canvas width="1200" height="800"></canvas></div>
    `;
    WM.create({ title:'Paint', icon:I.paint, width:880, height:620, body, app:'paint' });
    const cvs = body.querySelector('canvas');
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cvs.width,cvs.height);
    ctx.lineCap='round'; ctx.lineJoin='round';
    let tool='pen', color='#15110d', size=3, drawing=false, startPt=null, snap=null;

    function pos(e){
      const r = cvs.getBoundingClientRect();
      return { x:(e.clientX-r.left)*(cvs.width/r.width), y:(e.clientY-r.top)*(cvs.height/r.height) };
    }
    cvs.addEventListener('pointerdown', e => {
      cvs.setPointerCapture(e.pointerId);
      drawing = true;
      startPt = pos(e);
      if (tool === 'pen' || tool === 'eraser'){
        ctx.beginPath();
        ctx.strokeStyle = tool==='eraser'?'#fff':color;
        ctx.lineWidth = size;
        ctx.moveTo(startPt.x, startPt.y);
      } else {
        snap = ctx.getImageData(0,0,cvs.width,cvs.height);
      }
    });
    cvs.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = pos(e);
      if (tool === 'pen' || tool === 'eraser'){
        ctx.lineTo(p.x, p.y); ctx.stroke();
      } else {
        ctx.putImageData(snap, 0, 0);
        ctx.strokeStyle = color; ctx.lineWidth = size;
        ctx.beginPath();
        if (tool === 'line'){ ctx.moveTo(startPt.x,startPt.y); ctx.lineTo(p.x,p.y); }
        if (tool === 'rect'){ ctx.rect(startPt.x,startPt.y,p.x-startPt.x,p.y-startPt.y); }
        if (tool === 'circle'){ const r = Math.hypot(p.x-startPt.x,p.y-startPt.y); ctx.arc(startPt.x,startPt.y,r,0,Math.PI*2); }
        ctx.stroke();
      }
    });
    cvs.addEventListener('pointerup', () => drawing = false);
    body.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      tool = b.dataset.t;
      body.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x===b));
    });
    body.querySelectorAll('.swatch').forEach(s => s.onclick = () => {
      color = s.dataset.c;
      body.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x===s));
    });
    body.querySelector('#psz').oninput = e => size = +e.target.value;
    body.querySelector('[data-act=clear]').onclick = () => { ctx.fillStyle='#fff'; ctx.fillRect(0,0,cvs.width,cvs.height); };
    body.querySelector('[data-act=save]').onclick = async () => {
      const n = await promptDlg('Save painting', 'painting.png', 'File name (saved to /home/user/Pictures):');
      if (!n) return;

/* ---------- ARCHIVE (zip at minimum) ---------- */
APPS.archive = {
  async open(opts){
    const body = document.createElement('div');
    body.style.cssText = 'padding:18px;overflow:auto;height:100%';
    body.innerHTML = `<div style="font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:4px">Archive</div>
      <h3 style="font-family:var(--serif);font-style:italic;font-size:28px;margin-bottom:10px">${esc(basename(opts.path))}</h3>
      <p style="font-size:13px;color:var(--ink-mid);margin-bottom:14px">Choose a destination folder and extract.</p>
      <div id="alist" style="font-family:var(--mono);font-size:12px;background:rgba(21,17,13,.04);padding:10px;border-radius:8px;max-height:320px;overflow:auto;margin-bottom:14px">Loading…</div>
      <div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px">Extract to:</span><input class="input" id="adest" style="max-width:260px" value="/home/user/Downloads"/>
      <button class="btn rust" id="ago">Extract</button></div>`;
    const win = WM.create({ title:'Archive — '+basename(opts.path), icon:I.zip, width:640, height:480, body, app:'archive' });
    const list = body.querySelector('#alist');
    const e = ext(opts.path);
    let entries = [];
    if (e === 'zip' && window.JSZip){
      try {
        const buf = await FS.readFile(opts.path, false);
        const z = await JSZip.loadAsync(buf);
        for (const [name, f] of Object.entries(z.files)){
          entries.push({ name, dir: f.dir, size: f._data?.uncompressedSize || 0 });
        }
        list.innerHTML = entries.slice(0,400).map(x => `<div style="padding:3px 0">${x.dir?'▸ ':'· '}${esc(x.name)}</div>`).join('') || '<div>Empty archive.</div>';
        body.querySelector('#ago').onclick = async () => {
          const dest = body.querySelector('#adest').value.trim();
          if (!dest) return;
          await FS.ensureDir(dest);
          for (const x of entries){
            const full = joinPath(dest, x.name);
            if (x.dir){ await FS.ensureDir(full); continue; }
            const f = z.file(x.name);
            if (!f) continue;
            const ab = await f.async('arraybuffer');
            await FS.writeFile(full, ab);
          }
          toast('Extracted', `${entries.length} items → ${dest}`);
          Desktop.render();
          WM.close(win.id);
        };
      } catch(err){ list.innerHTML = `Failed: ${esc(err.message)}`; }
    } else if (e === 'gz' || e === 'tgz' || e === 'tar'){
      list.innerHTML = `<div>This browser build supports <b>.zip</b> natively (via JSZip). For .gz/.tar/.7z, a WASM extractor is required. Use the in-browser file manager to download and extract externally, or upload a .zip.</div>`;
    } else {
      list.innerHTML = 'Unsupported archive format.';
    }
  }
};

/* ---------- TABLE (CSV/TSV) ---------- */
APPS.table = {
  async open(opts){
    const body = document.createElement('div');
    body.className = 'tbl-wrap';
    body.innerHTML = `
      <div class="tbl-tabs">
        <div class="tbl-tab active" data-v="grid">Table</div>
        <div class="tbl-tab" data-v="text">Text</div>
        <span style="flex:1"></span>
        <button class="btn ghost" data-act="save" style="padding:4px 10px;font-size:11.5px">${I.save} Save</button>
      </div>
      <div class="tbl-scroll" id="tg"></div>
      <textarea class="ed-ta" id="tt" style="display:none"></textarea>
    `;
    const win = WM.create({ title:basename(opts.path), icon:I.list, width:820, height:560, body, app:'table' });
    const tg = body.querySelector('#tg');
    const tt = body.querySelector('#tt');
    let text = '', sep = opts.path.endsWith('.tsv')?'\t':',';
    try { text = await FS.readFile(opts.path, true); tt.value = text; }
    catch(e){ toast('Open failed', e.message, true); }
    function parse(t){
      const lines = t.replace(/\r/g,'').split('\n');
      return lines.filter(l => l.length).map(l => {
        const out = []; let cur = '', q = false;
        for (let i=0;i<l.length;i++){
          const c = l[i];
          if (c === '"'){ if (q && l[i+1] === '"'){ cur+='"'; i++; } else q = !q; }
          else if (c === sep && !q){ out.push(cur); cur=''; }
          else cur += c;
        }
        out.push(cur);
        return out;
      });
    }
    function drawGrid(){
      const rows = parse(text);
      if (!rows.length){ tg.innerHTML = '<div class="fx-empty">Empty</div>'; return; }
      let h = '<table><thead><tr>';
      rows[0].forEach((c,i) => h += `<th>${esc(c)||'#'+(i+1)}</th>`);
      h += '</tr></thead><tbody>';
      for (let r=1;r<rows.length;r++){
        h += '<tr>';
        rows[r].forEach(c => h += `<td>${esc(c)}</td>`);
        h += '</tr>';
      }
      h += '</tbody></table>';
      tg.innerHTML = h;
    }
    body.querySelectorAll('.tbl-tab').forEach(t => t.onclick = () => {
      body.querySelectorAll('.tbl-tab').forEach(x => x.classList.toggle('active', x===t));
      if (t.dataset.v === 'grid'){ tg.style.display=''; tt.style.display='none'; drawGrid(); }
      else { tg.style.display='none'; tt.style.display=''; text = tt.value; }
    });
    tt.addEventListener('input', () => text = tt.value);
    body.querySelector('[data-act=save]').onclick = async () => {
      if (tt.style.display !== 'none') text = tt.value;
      try { await FS.writeFile(opts.path, text); toast('Saved', opts.path); }
      catch(e){ toast('Save failed', e.message, true); }
    };
    drawGrid();
  }
};

      </div>
      <iframe sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
    `;
    const win = WM.create({ title:'Browser', icon:I.browser, width:900, height:640, body, app:'browser', dark:true });
    const url = body.querySelector('.url');
    const frame = body.querySelector('iframe');
    const hist = [opts.url || 'https://example.com'];
    let idx = 0;
    function go(u, push=true){
      u = u.trim();
      if (!/^([a-z]+:)?\/\//i.test(u) && !u.startsWith('blob:')) u = 'https://' + u;
      url.value = u;
      frame.src = u;
      if (push){ hist.splice(idx+1); hist.push(u); idx = hist.length-1; }
    }
    body.querySelector('[data-act=go]').onclick = () => go(url.value);
    url.addEventListener('keydown', e => { if (e.key==='Enter') go(url.value); });
    body.querySelector('[data-act=back]').onclick = () => { if (idx>0){ idx--; go(hist[idx], false); } };
    body.querySelector('[data-act=fwd]').onclick = () => { if (idx<hist.length-1){ idx++; go(hist[idx], false); } };
    body.querySelector('[data-act=reload]').onclick = () => { frame.src = frame.src; };
    go(hist[0], false);
  }
};

/* ==========================================================================

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 'k'){ e.preventDefault(); /* could add spotlight */ }
  if (e.key === 'F5'){ e.preventDefault(); Desktop.render(); }

/* ==========================================================================
   BOOT
   ========================================================================== */
(async function boot(){
  try {
    await FS.init();
    await Wallpaper.init();
    await Desktop.render();
    Dock.render();
    // Recent mounts reminder
    try {
      const arr = JSON.parse(localStorage.getItem('atelier_recent_mounts')||'[]');
      if (arr.length){
        toast('Local folders', `${arr.length} mounted folder(s) need re-mount after reload.`);
      }
    } catch(e){}
  } catch(e){
    console.error(e);
    toast('Boot failed', e.message, true);
  }
  setTimeout(() => $('#boot').classList.add('off'), 650);
})();
