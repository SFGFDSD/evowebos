<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>琥珀 OS · AMBER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- CodeMirror 代码编辑器 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" onerror="window.__noCMcss=1">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" defer onerror="window.__noCM=1"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js" defer></script>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js" defer></script>
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" defer onerror="window.__noJSZip=1"></script>
<!-- V86 虚拟机模拟器 -->
<script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js" defer onerror="window.__noV86=1"></script>
<style>
/* ============================================================
   琥珀 OS  ·  设计系统 —— 玄墨底色 × 琥珀金 × 青瓷
   ============================================================ */
:root{
  --bg0:#0a0c11; --bg1:#10131b; --bg2:#161a25; --bg3:#1d2230;
  --line:#262d3e; --line2:#333c52;
  --ink:#ece5d3; --dim:#8b93a8; --faint:#5a6275;
  --amber:#ffb454; --amber-d:#d98e2b; --amber-glow:rgba(255,180,84,.16);
  --teal:#46d4c4; --red:#f0717d; --green:#9ecf6a;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --ui:'Bai Jamjuree','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
  --rad:8px;
  --tb-h:52px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ui);color:var(--ink);background:var(--bg0);font-size:14px;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3447;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3d4763;background-clip:content-box;border:2px solid transparent}
input,textarea,button,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
svg{display:block}
[hidden]{display:none!important}

/* ---------- 开机画面 ---------- */
#boot{position:fixed;inset:0;z-index:99999;background:
  radial-gradient(1200px 700px at 50% 110%, #241a10 0%, transparent 60%),
  radial-gradient(900px 500px at 80% -10%, #101826 0%, transparent 55%), var(--bg0);
  display:grid;place-items:center;transition:opacity .7s var(--ease), visibility .7s}
#boot.off{opacity:0;visibility:hidden}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:26px}
.bootlogo{color:var(--amber);filter:drop-shadow(0 0 24px rgba(255,180,84,.35));animation:bootpulse 2.4s ease-in-out infinite}
@keyframes bootpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.85}}
.bootname{font-size:30px;font-weight:700;letter-spacing:.42em;text-indent:.42em}
.bootsub{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.bootbar{width:220px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bootbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:bootslide 1.1s linear infinite}
@keyframes bootslide{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
#bootMsg{font-family:var(--mono);font-size:11px;color:var(--faint);min-height:16px}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:background-image .5s ease, opacity .5s}
#wall::after{content:'';position:absolute;inset:0;background:radial-gradient(140% 90% at 50% 0%,transparent 55%,rgba(5,6,9,.55) 100%);pointer-events:none}
#icons{position:absolute;inset:0 0 var(--tb-h) 0}
.dicon{position:absolute;width:88px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:7px;
  border-radius:8px;border:1px solid transparent;cursor:default;
  transition:left .3s var(--ease), top .3s var(--ease), background .15s, border-color .15s, transform .15s}
.dicon .tile{width:54px;height:54px;display:grid;place-items:center;border-radius:13px;
  background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 6px 16px -6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .18s var(--ease), box-shadow .18s}
.dicon:hover .tile{transform:translateY(-2px);box-shadow:0 10px 22px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1)}
.dicon .lbl{font-size:11.5px;line-height:1.25;text-align:center;max-width:86px;color:#f2edde;
  text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.dicon.sel{background:var(--amber-glow);border-color:rgba(255,180,84,.45)}
.dicon.dragging{opacity:.35}
.dicon.drophint .tile{outline:2px dashed var(--amber);outline-offset:3px;transform:scale(1.06)}
.dicon.tdragging{opacity:.85;z-index:500;transition:none;transform:scale(1.08);pointer-events:none}
#marquee{position:absolute;z-index:400;border:1px solid rgba(255,180,84,.7);background:rgba(255,180,84,.1);border-radius:2px;pointer-events:none}
#desktop.dropping::before{content:'';position:absolute;inset:8px;border:2px dashed rgba(255,180,84,.55);border-radius:16px;z-index:300;pointer-events:none;animation:dashpulse 1s linear infinite}
@keyframes dashpulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;height:calc(var(--tb-h) - 10px);max-width:calc(100vw - 16px);
  display:flex;align-items:center;gap:5px;padding:0 7px;z-index:9000;
  background:rgba(13,16,24,.82);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 36px -10px rgba(0,0,0,.7)}
#startBtn{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--amber);transition:background .15s,transform .1s}
#startBtn:hover{background:rgba(255,180,84,.13)}
#startBtn:active{transform:scale(.92)}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 2px;flex:none}
#tasks{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:54vw}
#tasks::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:9px;color:var(--dim);
  font-size:12px;white-space:nowrap;position:relative;transition:background .15s,color .15s;flex:none}
.task:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.task.active{background:rgba(255,180,84,.12);color:var(--ink)}
.task .tdot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:2px;border-radius:2px;background:var(--faint)}
.task.active .tdot{background:var(--amber)}
.task.minz{opacity:.55}
.task span{max-width:110px;overflow:hidden;text-overflow:ellipsis}
#tray{display:flex;align-items:center;gap:3px;margin-left:auto}
#clock{font-family:var(--mono);font-size:11px;line-height:1.35;text-align:center;color:var(--dim);padding:0 9px;cursor:default}
#clock b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
.traybtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--dim)}
.traybtn:hover{background:rgba(255,255,255,.07);color:var(--amber)}

/* ---------- 开始菜单 ---------- */
#startMenu{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(var(--tb-h) + 8px);width:430px;max-width:calc(100vw - 20px);
  z-index:9500;background:rgba(15,18,27,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -16px rgba(0,0,0,.8);
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease), transform .22s var(--ease);overflow:hidden}
#startMenu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.sm-head{display:flex;align-items:center;gap:11px;padding:16px 18px 10px}
.sm-head .smlogo{color:var(--amber)}
.sm-head b{font-size:15px;letter-spacing:.18em}
.sm-head small{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.2em}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 12px 12px}
.sm-it{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 4px 10px;border-radius:12px;color:var(--ink);transition:background .15s}
.sm-it:hover{background:rgba(255,255,255,.06)}
.sm-it:active{transform:scale(.95)}
.sm-it .tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(155deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1)}
.sm-it span{font-size:11.5px;color:#d8d2c2}
.sm-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
.sm-foot .fsmode{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em}
.sm-foot .acts{display:flex;gap:4px}

/* ---------- 窗口 ---------- */
.win{position:fixed;display:flex;flex-direction:column;min-width:320px;min-height:220px;z-index:100;
  background:rgba(16,19,28,.93);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;
  box-shadow:0 22px 60px -14px rgba(0,0,0,.7);
  animation:winin .26s var(--ease)}
@keyframes winin{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
.win.focus{border-color:var(--line2);box-shadow:0 28px 80px -14px rgba(0,0,0,.85),0 0 0 1px rgba(255,180,84,.22)}
.win.minz{display:none}
.win.max{left:6px!important;top:6px!important;width:calc(100vw - 12px)!important;height:calc(100vh - var(--tb-h) - 10px)!important;border-radius:11px;transition:all .22s var(--ease)}
.win.closing{animation:winout .2s var(--ease) forwards}
@keyframes winout{to{opacity:0;transform:scale(.95) translateY(10px)}}
.win-tb{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px 0 13px;flex:none;cursor:default;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent);border-bottom:1px solid var(--line);touch-action:none}
.win-ico{color:var(--amber);flex:none}
.win-ttl{font-size:12.5px;font-weight:600;letter-spacing:.05em;color:#d9d3c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.wbtns{display:flex;gap:3px;flex:none}
.wbtn{width:34px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--dim);transition:background .13s,color .13s}
.wbtn:hover{background:rgba(255,255,255,.09);color:var(--ink)}
.wbtn.close:hover{background:rgba(240,113,125,.18);color:var(--red)}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rs{position:absolute;z-index:20;touch-action:none}
.rs-n{top:-4px;left:8px;right:8px;height:8px;cursor:n-resize}
.rs-s{bottom:-4px;left:8px;right:8px;height:8px;cursor:s-resize}
.rs-e{right:-4px;top:8px;bottom:8px;width:8px;cursor:e-resize}
.rs-w{left:-4px;top:8px;bottom:8px;width:8px;cursor:w-resize}
.rs-ne{top:-5px;right:-5px;width:14px;height:14px;cursor:ne-resize}
.rs-nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nw-resize}
.rs-se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:se-resize}
.rs-sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:sw-resize}

/* ---------- 右键菜单 ---------- */
.menu{position:fixed;z-index:99000;min-width:208px;padding:5px;border-radius:11px;
  background:rgba(19,22,32,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line2);box-shadow:0 18px 50px -10px rgba(0,0,0,.8);
  animation:menuin .14s var(--ease)}
@keyframes menuin{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:7px;font-size:12.5px;cursor:default;color:#d9d3c4}
.mi:hover{background:rgba(255,180,84,.13);color:var(--ink)}
.mi .mico{color:var(--dim);flex:none}
.mi:hover .mico{color:var(--amber)}
.mi.danger{color:var(--red)} .mi.danger .mico{color:var(--red)}
.mi.danger:hover{background:rgba(240,113,125,.13)}
.mi.dis{opacity:.38;pointer-events:none}
.msep{height:1px;background:var(--line);margin:5px 8px}
.mi .mhint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ---------- 对话框 / 提示 ---------- */
#modalRoot{position:fixed;inset:0;z-index:99500;display:none;place-items:center;background:rgba(5,7,11,.55);backdrop-filter:blur(3px)}
#modalRoot.open{display:grid}
.dlg{width:380px;max-width:calc(100vw - 32px);background:var(--bg2);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 30px 70px -14px rgba(0,0,0,.85);padding:20px;animation:winin .22s var(--ease)}
.dlg-t{font-size:14.5px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.dlg-t svg{color:var(--amber)}
.dlg-m{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:14px;word-break:break-all}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:500;background:var(--bg3);border:1px solid var(--line2);color:var(--ink);transition:all .14s}
.btn:hover{border-color:var(--faint);background:#242b3d}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1c1206;font-weight:600}
.btn.pri:hover{background:#ffc575}
.btn.danger{background:rgba(240,113,125,.13);border-color:rgba(240,113,125,.45);color:var(--red)}
.btn.danger:hover{background:rgba(240,113,125,.24)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.4;pointer-events:none}
.inp{width:100%;padding:9px 12px;border-radius:8px;background:var(--bg0);border:1px solid var(--line2);font-size:13px;outline:none;transition:border-color .15s;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--amber)}
#toasts{position:fixed;top:14px;right:14px;z-index:99800;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:11px;max-width:320px;
  background:rgba(20,24,34,.96);border:1px solid var(--line2);box-shadow:0 14px 36px -8px rgba(0,0,0,.7);
  font-size:12.5px;animation:toastin .3s var(--ease);pointer-events:auto}
.toast svg{flex:none;color:var(--amber)}
.toast.ok svg{color:var(--green)} .toast.err svg{color:var(--red)}
.toast .tact{margin-left:6px;color:var(--amber);font-weight:600;cursor:pointer;white-space:nowrap}
.toast.out{animation:toastout .25s var(--ease) forwards}
@keyframes toastin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}

/* ---------- 通用工具条 ---------- */
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;border-radius:8px;color:var(--dim);font-size:12px;transition:background .14s,color .14s;flex:none}
.ibtn:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.ibtn.on{background:rgba(255,180,84,.14);color:var(--amber)}
.ibtn[disabled]{opacity:.35;pointer-events:none}

/* ---------- 文件管理器 ---------- */
.fx{flex:1;display:flex;min-height:0}
.fx-side{width:182px;flex:none;border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto;background:rgba(0,0,0,.16);display:flex;flex-direction:column;gap:2px}
.side-cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);padding:10px 9px 5px;text-transform:uppercase}
.side-it{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:#c9c3b4;cursor:default;transition:background .13s}
.side-it svg{color:var(--dim);flex:none}
.side-it:hover{background:rgba(255,255,255,.06)}
.side-it.on{background:rgba(255,180,84,.13);color:var(--ink)}
.side-it.on svg{color:var(--amber)}
.side-it .sx{margin-left:auto;color:var(--faint);border-radius:5px;padding:2px;display:none}
.side-it:hover .sx{display:block}
.side-it .sx:hover{color:var(--red);background:rgba(240,113,125,.15)}
.fx-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fx-bar{display:flex;align-items:center;gap:4px;padding:7px 9px;border-bottom:1px solid var(--line);flex:none;flex-wrap:nowrap}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--bg0);border:1px solid var(--line);border-radius:8px;height:30px;padding:0 7px;margin:0 4px;min-width:60px}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font-size:12px;color:var(--dim);padding:3px 6px;border-radius:6px;white-space:nowrap;cursor:default}
.crumb:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.crumb:last-child{color:var(--amber)}
.crumb-sep{color:var(--faint);font-size:10px}
.fx-search{width:150px;height:30px;padding:0 10px;border-radius:8px;background:var(--bg0);border:1px solid var(--line);font-size:12px;outline:none;-webkit-user-select:text;user-select:text;transition:width .2s var(--ease),border-color .15s}
.fx-search:focus{border-color:var(--amber);width:200px}
.fx-cols{display:grid;grid-template-columns:minmax(150px,1fr) 148px 104px 86px;gap:0;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.fcol{display:flex;align-items:center;gap:5px;padding:7px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;cursor:default;border-radius:6px}
.fcol:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.fcol .sortar{color:var(--amber)}
.fx-list{flex:1;overflow-y:auto;padding:5px 10px 14px;position:relative}
.frow{display:grid;grid-template-columns:minmax(150px,1fr) 148px 104px 86px;align-items:center;border-radius:8px;cursor:default;border:1px solid transparent}
.frow:hover{background:rgba(255,255,255,.05)}
.frow.sel{background:var(--amber-glow);border-color:rgba(255,180,84,.4)}
.frow.cuted{opacity:.45}
.frow.drophint{outline:2px dashed var(--amber);outline-offset:-2px}
.fcell{padding:7px 8px;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.fname{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--ui);font-size:12.8px;min-width:0}
.fname .fico{flex:none}
.fname i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-status{display:flex;align-items:center;gap:14px;padding:6px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.fx-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--faint);font-size:12.5px}
.fx-empty svg{opacity:.4}
.fxmarq{position:absolute;z-index:50;border:1px solid rgba(255,180,84,.7);background:rgba(255,180,84,.09);border-radius:2px;pointer-events:none}
.fx-side-toggle{display:none}

/* 文件类型色 */
.c-folder{color:var(--amber)} .c-img{color:var(--teal)} .c-audio{color:#c792ea} .c-video{color:#82aaff}
.c-code{color:var(--green)} .c-html{color:#ff8f66} .c-zip{color:#e6c07b} .c-pdf{color:var(--red)}
.c-table{color:#7fd962} .c-text{color:#aab4cc} .c-iso{color:#6fc3df} .c-file{color:var(--dim)}

/* ---------- 记事本 / 表格 ---------- */
.np{flex:1;display:flex;flex-direction:column;min-height:0}
.np-bar{display:flex;align-items:center;gap:4px;padding:6px 9px;border-bottom:1px solid var(--line);flex:none}
.np-ta{flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--ink);padding:14px 16px;
  font-family:var(--mono);font-size:13px;line-height:1.7;-webkit-user-select:text;user-select:text;tab-size:4}
.np-status{display:flex;gap:16px;padding:5px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.np-status .dirty{color:var(--amber)}
.tb-wrap{flex:1;overflow:auto;-webkit-user-select:text;user-select:text}
table.tbv{border-collapse:collapse;font-family:var(--mono);font-size:12px;min-width:100%}
table.tbv th{position:sticky;top:0;background:var(--bg3);color:var(--amber);font-weight:600;z-index:2}
table.tbv th,table.tbv td{border:1px solid var(--line);padding:6px 11px;white-space:nowrap;min-width:70px;text-align:left}
table.tbv td{color:#cfc9ba}
table.tbv td:focus{outline:2px solid var(--amber);outline-offset:-2px;background:rgba(255,180,84,.07)}
table.tbv tr:nth-child(even) td{background:rgba(255,255,255,.018)}
table.tbv th.rownum,table.tbv td.rownum{background:var(--bg2);color:var(--faint);min-width:36px;text-align:center;position:sticky;left:0}

/* ---------- 代码编辑器 ---------- */
.ed{flex:1;display:flex;flex-direction:column;min-height:0}
.ed-main{flex:1;display:flex;min-height:0}
.ed-code{flex:1;min-width:0;position:relative}
.ed-code .CodeMirror{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.65}
.ed-code .np-ta{position:absolute;inset:0;width:100%;height:100%}
.CodeMirror-gutters{background:rgba(0,0,0,.22)!important;border-right:1px solid var(--line)!important}
.CodeMirror-linenumber{color:var(--faint)!important}
.CodeMirror-cursor{border-left:2px solid var(--amber)!important}
.CodeMirror-selected{background:rgba(255,180,84,.16)!important}
.cm-tag{color:#ff8f66!important}.cm-attribute{color:var(--amber)!important}.cm-string{color:#9ecf6a!important}
.cm-keyword{color:#c792ea!important}.cm-comment{color:#5a6275!important}.cm-number{color:#e6c07b!important}
.cm-property{color:#82aaff!important}.cm-def{color:#46d4c4!important}.cm-variable{color:#ece5d3!important}
.cm-qualifier{color:var(--teal)!important}.cm-builtin{color:#82aaff!important}.cm-atom{color:#e6c07b!important}
.ed-prev{width:46%;flex:none;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.ed-prev iframe{flex:1;border:none;width:100%}
.ed-prev .pv-cap{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint);background:var(--bg2);padding:5px 12px;border-bottom:1px solid var(--line)}

/* ---------- 浏览器 ---------- */
.br{flex:1;display:flex;flex-direction:column;min-height:0}
.br-bar{display:flex;align-items:center;gap:4px;padding:7px 9px;border-bottom:1px solid var(--line);flex:none}
.br-addr{flex:1;height:31px;padding:0 13px;border-radius:16px;background:var(--bg0);border:1px solid var(--line);font-family:var(--mono);font-size:12px;outline:none;-webkit-user-select:text;user-select:text;min-width:50px}
.br-addr:focus{border-color:var(--amber)}
.br-frame{flex:1;border:none;background:#fff;width:100%}

/* ---------- 计算器 ---------- */
.calc{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px;background:radial-gradient(120% 80% at 50% -10%,rgba(255,180,84,.06),transparent)}
.calc-d{flex:none;text-align:right;padding:14px 16px;border-radius:12px;background:var(--bg0);border:1px solid var(--line);overflow:hidden}
.calc-d .expr{font-family:var(--mono);font-size:12px;color:var(--faint);min-height:17px;word-break:break-all}
.calc-d .res{font-family:var(--mono);font-size:31px;font-weight:600;color:var(--ink);word-break:break-all;line-height:1.25}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{border-radius:11px;font-family:var(--mono);font-size:17px;background:var(--bg3);border:1px solid var(--line);color:var(--ink);transition:all .1s;min-height:44px}
.ck:hover{background:#27304a}.ck:active{transform:scale(.94)}
.ck.fn{background:var(--bg2);color:var(--teal);font-size:14px}
.ck.op{color:var(--amber);font-size:19px}
.ck.eq{background:var(--amber);border-color:var(--amber);color:#1c1206;font-weight:700}
.ck.eq:hover{background:#ffc575}

/* ---------- 画板 ---------- */
.pt{flex:1;display:flex;flex-direction:column;min-height:0}
.pt-bar{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.pt-stage{flex:1;min-height:0;position:relative;background:
  repeating-conic-gradient(#161a25 0 25%, #12151e 0 50%) 0 0/22px 22px;overflow:hidden}
.pt-stage canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.swatch{width:24px;height:24px;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none;transition:transform .12s}
.swatch:hover{transform:scale(1.15)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg0),0 0 0 3.5px var(--amber)}
.pt-size{width:84px;accent-color:var(--amber)}

/* ---------- 设置 ---------- */
.st{flex:1;display:flex;min-height:0}
.st-tabs{width:150px;flex:none;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.16)}
.st-tab{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:12.5px;color:#c9c3b4}
.st-tab svg{color:var(--dim)}
.st-tab:hover{background:rgba(255,255,255,.06)}
.st-tab.on{background:rgba(255,180,84,.13);color:var(--ink)}
.st-tab.on svg{color:var(--amber)}
.st-body{flex:1;overflow-y:auto;padding:20px 22px}
.st-sec{margin-bottom:26px}
.st-sec h3{font-size:13.5px;font-weight:600;letter-spacing:.06em;margin-bottom:4px}
.st-sec .desc{font-size:11.5px;color:var(--dim);margin-bottom:13px;line-height:1.6}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wall-it{aspect-ratio:16/9;border-radius:10px;background-size:cover;background-position:center;border:2px solid var(--line);cursor:pointer;position:relative;transition:transform .15s,border-color .15s;display:grid;place-items:center;color:var(--dim);overflow:hidden}
.wall-it:hover{transform:scale(1.04)}
.wall-it.on{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
.wall-it .wname{position:absolute;bottom:0;left:0;right:0;padding:4px 8px;font-size:10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.bar{height:9px;border-radius:5px;background:var(--bg0);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{height:100%;transition:width .6s var(--ease)}
.urow{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:12px}
.urow .udot{width:9px;height:9px;border-radius:3px;flex:none}
.urow .un{flex:1;color:#cfc9ba}
.urow .uv{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---------- 图片查看器 / 播放器 ---------- */
.iv{flex:1;display:flex;flex-direction:column;min-height:0}
.iv-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:
  repeating-conic-gradient(#10131b 0 25%, #0c0f15 0 50%) 0 0/24px 24px;position:relative}
.iv-stage img{max-width:none;transition:transform .18s var(--ease);transform-origin:center;cursor:grab}
.iv-zl{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:48px;text-align:center}
.av{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;
  background:radial-gradient(100% 90% at 50% 0%,rgba(255,180,84,.07),transparent)}
.av video{max-width:100%;max-height:100%;border-radius:10px;background:#000}
.av audio{width:100%;max-width:420px}
.av .avico{color:var(--amber);opacity:.85;animation:bootpulse 3s ease-in-out infinite}
.av .avname{font-size:13px;color:#cfc9ba;max-width:90%;text-align:center;word-break:break-all}
.pdf-frame{flex:1;border:none;width:100%}

/* ---------- 虚拟机 ---------- */
.vmw{flex:1;display:flex;flex-direction:column;min-height:0}
.vm-bar{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;font-size:12px}
.vm-stage{flex:1;min-height:0;overflow:auto;background:#000;display:grid;place-items:center;padding:8px}
#screen_container{position:relative}
#screen_container div{white-space:pre;font:14px monospace;line-height:14px;color:#ddd}
.vm-hint{color:var(--faint);font-size:12px;text-align:center;line-height:1.9;padding:30px}
.vm-hint svg{margin:0 auto 12px;color:var(--amber);opacity:.6}

/* ---------- 移动端适配 ---------- */
@media (max-width:768px){
  :root{--tb-h:62px}
  .win{left:0!important;top:0!important;width:100vw!important;height:calc(100vh - var(--tb-h))!important;border-radius:0;min-width:0;border:none}
  .rs{display:none}
  .win-tb{height:46px}
  .wbtn{width:42px;height:36px}
  #taskbar{left:0;right:0;bottom:0;transform:none;max-width:100vw;border-radius:0;border-left:none;border-right:none;border-bottom:none;height:var(--tb-h);padding:0 10px env(safe-area-inset-bottom)}
  #startBtn{width:46px;height:42px}
  .task{height:42px;padding:0 12px}
  .task span{display:none}
  #clock b{font-size:12px}
  #startMenu{bottom:calc(var(--tb-h) + 6px)}
  .fx-side{position:absolute;left:0;top:0;bottom:0;z-index:30;width:210px;background:rgba(13,16,24,.97);transform:translateX(-102%);transition:transform .25s var(--ease);box-shadow:10px 0 30px rgba(0,0,0,.5)}
  .fx.show-side .fx-side{transform:none}
  .fx-side-toggle{display:inline-flex}
  .fx-cols{grid-template-columns:minmax(120px,1fr) 86px}
  .frow{grid-template-columns:minmax(120px,1fr) 86px}
  .fcol:nth-child(2),.fcol:nth-child(3),.fcell:nth-child(2),.fcell:nth-child(3){display:none}
  .fx-search{width:90px}
  .fx-search:focus{width:120px}
  .ed-main{flex-direction:column}
  .ed-prev{width:100%;height:45%;border-left:none;border-top:1px solid var(--line)}
  .st-tabs{width:54px}
  .st-tab span{display:none}
  .st-tab{justify-content:center}
  .dicon{width:80px}
  .dicon .tile{width:56px;height:56px}
  .sm-grid{grid-template-columns:repeat(3,1fr)}
}
@media (display-mode:fullscreen){ #taskbar{bottom:4px} }

/* ════════════════════════════════════════════════════════════
   § 2. IndexedDB KV（保存挂载句柄 / 降级状态）
   ════════════════════════════════════════════════════════════ */
const kv=(()=>{
  let db=null;
  async function open(){
    if(db)return db;
    db=await new Promise((res,rej)=>{const r=indexedDB.open('amberos-kv',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    return db;
  }
  return{
    async get(k){try{const d=await open();return await new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return undefined;}},
    async set(k,v){try{const d=await open();return await new Promise((res,rej)=>{const r=d.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}catch(e){}},
    async del(k){try{const d=await open();return await new Promise((res,rej)=>{const r=d.transaction('kv','readwrite').objectStore('kv').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}catch(e){}}
  };
})();

/* ════════════════════════════════════════════════════════════
   § 3. 文件系统核心 fs —— OPFS 主干 + IndexedDB 降级 + 本地挂载
   统一路径式 API，所有内置 App 一律经由 fs 读写。
   ════════════════════════════════════════════════════════════ */
function normParts(p){
  const out=[];
  for(const s of String(p==null?'/':p).split('/')){
    if(!s||s==='.')continue;
    if(s==='..'){out.pop();continue;}
    out.push(s);
  }
  return out;
}
const joinParts=parts=>'/'+parts.join('/');
function normPath(p){return joinParts(normParts(p));}

/* —— 基于 FileSystemDirectoryHandle 的后端（OPFS 与本地挂载共用，零分支统一架构）—— */
class HandleBackend{
  constructor(root){this.root=root;}
  async dir(parts,create){let d=this.root;for(const p of parts){d=await d.getDirectoryHandle(p,{create:!!create});}return d;}
  async parent(parts,create){return this.dir(parts.slice(0,-1),create);}
  async stat(parts){
    if(!parts.length)return{kind:'dir',size:0,mtime:0};
    const dir=await this.parent(parts),name=parts[parts.length-1];
    try{const fh=await dir.getFileHandle(name);const f=await fh.getFile();return{kind:'file',size:f.size,mtime:f.lastModified,type:f.type};}
    catch(e){await dir.getDirectoryHandle(name);return{kind:'dir',size:0,mtime:0};}
  }
  async readdir(parts){
    const d=await this.dir(parts),out=[];
    for await(const[name,h]of d.entries()){
      if(h.kind==='file'){let s=0,m=0;try{const f=await h.getFile();s=f.size;m=f.lastModified;}catch(e){}out.push({name,kind:'file',size:s,mtime:m});}
      else out.push({name,kind:'dir',size:0,mtime:0});
    }
    return out;
  }
  async readFile(parts){const dir=await this.parent(parts);const fh=await dir.getFileHandle(parts[parts.length-1]);return fh.getFile();}
  async writeFile(parts,data){
    const dir=await this.parent(parts,true);
    const fh=await dir.getFileHandle(parts[parts.length-1],{create:true});
    const w=await fh.createWritable();
    await w.write(data instanceof Blob||typeof data==='string'||data instanceof ArrayBuffer||ArrayBuffer.isView(data)?data:String(data));
    await w.close();
  }
  async mkdir(parts){await this.dir(parts,true);}
  async rm(parts){const dir=await this.parent(parts);await dir.removeEntry(parts[parts.length-1],{recursive:true});}
}

/* —— IndexedDB 降级后端（OPFS 不可用时自动切换，接口完全一致）—— */
class IDBBackend{
  constructor(db){this.db=db;}
  static async create(){
    const db=await new Promise((res,rej)=>{const r=indexedDB.open('amberos-fs',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('f');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    return new IDBBackend(db);
  }
  st(m){return this.db.transaction('f',m||'readonly').objectStore('f');}
  rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  key(parts){return '/'+parts.join('/');}
  async stat(parts){
    if(!parts.length)return{kind:'dir',size:0,mtime:0};
    const v=await this.rq(this.st().get(this.key(parts)));
    if(!v)throw new Error('NotFound: '+this.key(parts));
    return v.kind==='dir'?{kind:'dir',size:0,mtime:v.mtime||0}:{kind:'file',size:v.size||0,mtime:v.mtime||0,type:v.type||''};
  }
  async readdir(parts){
    const base=parts.length?this.key(parts):'';
    const keys=await this.rq(this.st().getAllKeys());
    const seen=new Map();
    for(const k of keys){
      if(!k.startsWith(base+'/'))continue;
      const rest=k.slice(base.length+1);if(!rest)continue;
      const seg=rest.split('/')[0];
      if(rest.includes('/')){if(!seen.has(seg))seen.set(seg,{name:seg,kind:'dir',size:0,mtime:0});}
      else{const v=await this.rq(this.st().get(k));
        seen.set(seg,v&&v.kind==='file'?{name:seg,kind:'file',size:v.size||0,mtime:v.mtime||0}:{name:seg,kind:'dir',size:0,mtime:(v&&v.mtime)||0});}
    }
    return[...seen.values()];
  }
  async readFile(parts){
    const v=await this.rq(this.st().get(this.key(parts)));
    if(!v||v.kind!=='file')throw new Error('NotFound: '+this.key(parts));
    return new File([v.data],parts[parts.length-1]||'file',{type:v.type||'',lastModified:v.mtime||Date.now()});
  }
  async writeFile(parts,data){
    const blob=data instanceof Blob?data:new Blob([data]);
    const buf=await blob.arrayBuffer();
    if(parts.length>1)await this.mkdir(parts.slice(0,-1));
    await this.rq(this.st('readwrite').put({kind:'file',data:buf,size:buf.byteLength,mtime:Date.now(),type:blob.type},this.key(parts)));
  }
  async mkdir(parts){
    for(let i=1;i<=parts.length;i++){
      const k=this.key(parts.slice(0,i));
      const v=await this.rq(this.st().get(k));
      if(!v)await this.rq(this.st('readwrite').put({kind:'dir',mtime:Date.now()},k));
    }
  }
  async rm(parts){
    const k=this.key(parts);
    const keys=await this.rq(this.st().getAllKeys());
    const s=this.st('readwrite');
    for(const kk of keys)if(kk===k||kk.startsWith(k+'/'))s.delete(kk);
    return new Promise((res,rej)=>{s.transaction.oncomplete=()=>res();s.transaction.onerror=()=>rej(s.transaction.error);});
  }
}

/* —— fs 门面：路径路由 + 挂载表 + callback 兼容签名 —— */
const fs=(()=>{
  let rootBackend=null,mode='—';
  const mounts=[]; // {path:'/mnt/local/xxx', backend, handle, name}

  function route(path){
    const parts=normParts(path);
    const full=joinParts(parts);
    for(const m of mounts){
      if(full===m.path||full.startsWith(m.path+'/'))
        return{b:m.backend,parts:normParts(full.slice(m.path.length)),mount:m};
    }
    return{b:rootBackend,parts};
  }
  /* 兼容性包装：无论调用方传入多少额外参数，自动识别末位 callback */
  function api(fn){
    return function(...args){
      let cb=null;
      while(args.length&&typeof args[args.length-1]==='function')cb=args.pop();
      const p=Promise.resolve().then(()=>fn(...args));
      if(cb){p.then(r=>{try{cb(null,r);}catch(e){}},e=>{try{cb(e);}catch(_){}});return p.catch(()=>{});}
      return p;
    };
  }
  async function _stat(path){const{b,parts}=route(path);return b.stat(parts);}
  async function _readdir(path){
    const full=normPath(path);
    const{b,parts}=route(full);
    let list=[];
    try{list=await b.readdir(parts);}catch(e){if(full!=='/mnt/local')throw e;}
    if(full==='/mnt/local'){
      for(const m of mounts)if(!list.some(x=>x.name===m.name))list.push({name:m.name,kind:'dir',size:0,mtime:0,mounted:true});
      list.forEach(x=>{if(mounts.some(m=>m.name===x.name))x.mounted=true;});
    }
    return list;
  }
  async function _copy(src,dst){
    const st=await _stat(src);
    if(st.kind==='dir'){
      const{b,parts}=route(dst);await b.mkdir(parts);
      const list=await _readdir(src);
      for(const e of list)await _copy(src+'/'+e.name,dst+'/'+e.name);
    }else{
      const f=await(route(src).b.readFile(route(src).parts));
      const{b,parts}=route(dst);await b.writeFile(parts,f);
    }
  }
  async function _rm(path){const{b,parts}=route(path);if(!parts.length)throw new Error('不能删除根目录');await b.rm(parts);}
  async function _move(src,dst){
    src=normPath(src);dst=normPath(dst);
    if(src===dst||dst.startsWith(src+'/'))return;
    await _copy(src,dst);await _rm(src);
  }
  const F={
    mounts,
    get mode(){return mode;},
    async init(){
      /* 优先 OPFS，写入探针验证 createWritable 可用性；失败降级 IndexedDB */
      try{
        if(!navigator.storage||!navigator.storage.getDirectory)throw new Error('no OPFS');
        const root=await navigator.storage.getDirectory();
        const probe=await root.getFileHandle('.amber-probe',{create:true});
        const w=await probe.createWritable();await w.write('ok');await w.close();
        await root.removeEntry('.amber-probe').catch(()=>{});
        rootBackend=new HandleBackend(root);mode='OPFS';
      }catch(e1){
        try{rootBackend=await IDBBackend.create();mode='IndexedDB';}
        catch(e2){
          /* 终极降级：内存 Map（不持久） */
          const mem=new Map();
          rootBackend={
            async stat(parts){if(!parts.length)return{kind:'dir',size:0,mtime:0};const v=mem.get(joinParts(parts));if(!v)throw new Error('NotFound');return v.kind==='file'?{kind:'file',size:v.data.size,mtime:v.mtime}:{kind:'dir',size:0,mtime:0};},
            async readdir(parts){const base=parts.length?joinParts(parts):'';const seen=new Map();for(const k of mem.keys()){if(!k.startsWith(base+'/'))continue;const rest=k.slice(base.length+1);const seg=rest.split('/')[0];const v=mem.get(k);if(rest.includes('/')){if(!seen.has(seg))seen.set(seg,{name:seg,kind:'dir',size:0,mtime:0});}else seen.set(seg,v.kind==='file'?{name:seg,kind:'file',size:v.data.size,mtime:v.mtime}:{name:seg,kind:'dir',size:0,mtime:0});}return[...seen.values()];},
            async readFile(parts){const v=mem.get(joinParts(parts));if(!v||v.kind!=='file')throw new Error('NotFound');return new File([v.data],parts[parts.length-1],{type:v.data.type,lastModified:v.mtime});},
            async writeFile(parts,data){const blob=data instanceof Blob?data:new Blob([data]);for(let i=1;i<parts.length;i++){const k=joinParts(parts.slice(0,i));if(!mem.has(k))mem.set(k,{kind:'dir'});}mem.set(joinParts(parts),{kind:'file',data:blob,mtime:Date.now()});},
            async mkdir(parts){for(let i=1;i<=parts.length;i++){const k=joinParts(parts.slice(0,i));if(!mem.has(k))mem.set(k,{kind:'dir'});}},
            async rm(parts){const k=joinParts(parts);for(const kk of[...mem.keys()])if(kk===k||kk.startsWith(k+'/'))mem.delete(kk);}
          };
          mode='Memory(易失)';
        }
      }
      setCookie('amber_fs_mode',mode);
      return mode;
    },
    stat:api(_stat),
    readdir:api(_readdir),
    readFile:api(async p=>{const{b,parts}=route(p);return b.readFile(parts);}),
    open:api(async p=>{const{b,parts}=route(p);return b.readFile(parts);}),
    readText:api(async p=>{const{b,parts}=route(p);const f=await b.readFile(parts);return f.text();}),
    writeFile:api(async(p,data)=>{const{b,parts}=route(p);return b.writeFile(parts,data);}),
    mkdir:api(async p=>{const{b,parts}=route(p);return b.mkdir(parts);}),
    rm:api(_rm),unlink:api(_rm),rmdir:api(_rm),
    copy:api(_copy),move:api(_move),
    rename:api(async(src,newName)=>{
      const parts=normParts(src);const dst=joinParts(parts.slice(0,-1))+'/'+newName;
      if(normPath(src)===normPath(dst))return dst;
      await _move(src,dst);return dst;
    }),
    exists:api(async p=>{try{await _stat(p);return true;}catch(e){return false;}}),
    /* 防重名：返回可用名称 */
    uniquePath:api(async(dir,name)=>{
      let cand=name,i=2;
      const dot=name.lastIndexOf('.');
      const stem=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';
      while(await F.exists(dir.replace(/\/$/,'')+'/'+cand)){cand=`${stem} (${i})${ext}`;i++;}
      return dir.replace(/\/$/,'')+'/'+cand;
    }),
    /* 递归体积统计 */
    usage:api(async function du(p){
      let total=0;
      let list;try{list=await _readdir(p);}catch(e){return 0;}
      for(const e of list){
        if(e.kind==='dir')total+=await du(p.replace(/\/$/,'')+'/'+e.name);
        else total+=e.size||0;
      }
      return total;
    }),
    /* —— 本地文件夹挂载（File System Access API → 同一 HandleBackend，对上层完全透明）—— */
    async mountLocal(handle){
      let name=handle.name||'本地文件夹';
      let path='/mnt/local/'+name,i=2;
      while(mounts.some(m=>m.path===path)){path='/mnt/local/'+name+' ('+i+')';i++;}
      mounts.push({path,name:basename(path),backend:new HandleBackend(handle),handle});
      const saved=(await kv.get('mounts'))||[];
      saved.push({name:basename(path),handle});
      try{await kv.set('mounts',saved);}catch(e){}
      bus.emit('fs',{path:'/mnt/local'});
      return path;
    },
    async unmount(path){
      const i=mounts.findIndex(m=>m.path===path);
      if(i<0)return;
      const m=mounts.splice(i,1)[0];
      const saved=((await kv.get('mounts'))||[]).filter(x=>x.name!==m.name);
      await kv.set('mounts',saved);
      bus.emit('fs',{path:'/mnt/local'});
    },
    isMountRoot(p){p=normPath(p);return mounts.some(m=>m.path===p);},
    inMount(p){p=normPath(p);return mounts.some(m=>p===m.path||p.startsWith(m.path+'/'));}
  };
  return F;
})();

function toast(msg,type='info',action){
  const t=el(`<div class="toast ${type==='ok'?'ok':type==='err'?'err':''}">${ic(type==='ok'?'check':type==='err'?'warn':'info',17)}<span>${esc(msg)}</span>${action?`<span class="tact">${esc(action.label)}</span>`:''}</div>`);
  if(action)t.querySelector('.tact').onclick=()=>{action.fn();dismiss();};
  $('#toasts').appendChild(t);
  let gone=false;
  const dismiss=()=>{if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>t.remove(),260);};
  setTimeout(dismiss,action?8000:3600);
  t.addEventListener('click',e=>{if(!e.target.classList.contains('tact'))dismiss();});
  return dismiss;
}
function dialog({title,icon='info',msg='',input=null,okText='确定',cancelText='取消',danger=false,noCancel=false}){
  return new Promise(res=>{
    const root=$('#modalRoot');
    root.innerHTML='';root.classList.add('open');
    const d=el(`<div class="dlg">
      <div class="dlg-t">${ic(icon,19)}<span>${esc(title)}</span></div>
      ${msg?`<div class="dlg-m">${esc(msg)}</div>`:''}
      ${input!==null?`<input class="inp" value="${esc(input.value||'')}" placeholder="${esc(input.placeholder||'')}" spellcheck="false">`:''}
      <div class="dlg-acts">
        ${noCancel?'':`<button class="btn" data-a="c">${esc(cancelText)}</button>`}
        <button class="btn ${danger?'danger':'pri'}" data-a="ok">${esc(okText)}</button>
      </div></div>`);
    root.appendChild(d);
    const inp=d.querySelector('.inp');
    const done=v=>{root.classList.remove('open');root.innerHTML='';res(v);};
    d.querySelector('[data-a=ok]').onclick=()=>done(input!==null?inp.value.trim():true);
    const c=d.querySelector('[data-a=c]');if(c)c.onclick=()=>done(null);
    root.onmousedown=e=>{if(e.target===root)done(null);};
    if(inp){inp.focus();const dot=inp.value.lastIndexOf('.');inp.setSelectionRange(0,dot>0?dot:inp.value.length);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')done(inp.value.trim());if(e.key==='Escape')done(null);});}
    document.addEventListener('keydown',function esc1(e){if(e.key==='Escape'){done(null);document.removeEventListener('keydown',esc1);}});
  });
}

const WM={wins:new Map(),zTop:100,active:null,cascade:0};
function createWindow(opt){
  const id=uid();
  const W=innerWidth,H=innerHeight;
  const w=clamp(opt.width||720,320,W-20),h=clamp(opt.height||500,220,H-70);
  const cas=(WM.cascade++%8)*26;
  const x=opt.x!=null?opt.x:clamp((W-w)/2+cas-80,8,W-w-8);
  const y=opt.y!=null?opt.y:clamp((H-h)/2+cas-60,8,Math.max(8,H-h-60));
  const win=el(`<div class="win" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="win-tb">
      <span class="win-ico">${ic(opt.icon||'logo',17)}</span>
      <span class="win-ttl">${esc(opt.title||'窗口')}</span>
      <div class="wbtns">
        <button class="wbtn" data-w="min" title="最小化">${ic('minim',15)}</button>
        <button class="wbtn" data-w="max" title="最大化">${ic('maxim',13)}</button>
        <button class="wbtn close" data-w="close" title="关闭">${ic('close',15)}</button>
      </div>
    </div>
    <div class="win-body"></div>
    ${['n','s','e','w','ne','nw','se','sw'].map(d=>`<div class="rs rs-${d}" data-rs="${d}"></div>`).join('')}
  </div>`);
  document.body.appendChild(win);
  const o={
    id,el:win,body:win.querySelector('.win-body'),app:opt.app||'app',
    title:opt.title||'窗口',icon:opt.icon||'logo',min:false,max:false,
    prev:null,onClose:opt.onClose||null,
    setTitle(t){o.title=t;win.querySelector('.win-ttl').textContent=t;renderTasks();},
    focus(){
      if(o.min){o.min=false;win.classList.remove('minz');}
      win.style.zIndex=++WM.zTop;
      if(WM.active&&WM.active!==o&&WM.active.el)WM.active.el.classList.remove('focus');
      win.classList.add('focus');WM.active=o;renderTasks();
    },
    minimize(){o.min=true;win.classList.add('minz');if(WM.active===o)WM.active=null;renderTasks();},
    toggleMax(){
      if(isMobile())return;
      o.max=!o.max;
      const btn=win.querySelector('[data-w=max]');
      if(o.max){o.prev={l:win.style.left,t:win.style.top,w:win.style.width,h:win.style.height};win.classList.add('max');btn.innerHTML=ic('restore',13);}
      else{win.classList.remove('max');if(o.prev){win.style.left=o.prev.l;win.style.top=o.prev.t;win.style.width=o.prev.w;win.style.height=o.prev.h;}btn.innerHTML=ic('maxim',13);}
    },
    close(){
      if(o.onClose)try{o.onClose();}catch(e){}
      win.classList.add('closing');
      setTimeout(()=>{win.remove();},190);
      WM.wins.delete(id);
      if(WM.active===o)WM.active=null;
      renderTasks();
    }
  };
  WM.wins.set(id,o);
  win.addEventListener('pointerdown',()=>o.focus());
  win.querySelector('[data-w=min]').addEventListener('click',e=>{e.stopPropagation();o.minimize();});
  win.querySelector('[data-w=max]').addEventListener('click',e=>{e.stopPropagation();o.toggleMax();});
  win.querySelector('[data-w=close]').addEventListener('click',e=>{e.stopPropagation();o.close();});

  /* 标题栏拖动（Pointer Events，鼠标+触摸通吃） */
  const tb=win.querySelector('.win-tb');
  tb.addEventListener('dblclick',e=>{if(!e.target.closest('.wbtn'))o.toggleMax();});
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.wbtn')||o.max||isMobile())return;
    e.preventDefault();
    const sx=e.clientX-win.offsetLeft,sy=e.clientY-win.offsetTop;
    const mv=ev=>{
      win.style.left=clamp(ev.clientX-sx,-win.offsetWidth+90,innerWidth-60)+'px';
      win.style.top=clamp(ev.clientY-sy,0,innerHeight-44)+'px';
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  /* 八向调整大小 */
  win.querySelectorAll('.rs').forEach(hd=>{
    hd.addEventListener('pointerdown',e=>{
      if(o.max||isMobile())return;
      e.preventDefault();e.stopPropagation();o.focus();
      const dir=hd.dataset.rs;
      const r={l:win.offsetLeft,t:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight};
      const sx=e.clientX,sy=e.clientY,minW=320,minH=220;
      const mv=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        let{l,t,w,h}=r;
        if(dir.includes('e'))w=Math.max(minW,r.w+dx);
        if(dir.includes('s'))h=Math.max(minH,r.h+dy);
        if(dir.includes('w')){w=Math.max(minW,r.w-dx);l=r.l+r.w-w;}
        if(dir.includes('n')){h=Math.max(minH,r.h-dy);t=Math.max(0,r.t+r.h-h);h=r.t+r.h-t;}
        win.style.left=l+'px';win.style.top=t+'px';win.style.width=w+'px';win.style.height=h+'px';
      };
      const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
    });
  });
  o.focus();
  renderTasks();
  return o;
}

/* ---------- 任务栏 ---------- */
function renderTasks(){
  const t=$('#tasks');t.innerHTML='';
  for(const[,w]of WM.wins){
    const b=el(`<button class="task ${WM.active===w?'active':''} ${w.min?'minz':''}" title="${esc(w.title)}">${ic(w.icon,17)}<span>${esc(w.title)}</span><i class="tdot"></i></button>`);
    b.addEventListener('click',()=>{
      if(w.min){w.focus();}
      else if(WM.active===w){w.minimize();}
      else w.focus();
    });
    t.appendChild(b);
  }
}

/* ════════════════════════════════════════════════════════════
   § 9. 拖拽基础设施：Blob 预载缓存（DownloadURL 必须同步可得）
   ════════════════════════════════════════════════════════════ */
const blobCache=new Map();
async function preloadBlob(path){
  if(blobCache.has(path))return blobCache.get(path);
  try{
    const st=await fs.stat(path);
    if(st.kind!=='file'||st.size>200*1024*1024)return null;
    const f=await fs.readFile(path);
    const name=basename(path),mime=f.type||mimeOf(name);
    const file=new File([f],name,{type:mime});
    const url=URL.createObjectURL(file);
    blobCache.set(path,{file,url,mime,name});
    if(blobCache.size>30){const k=blobCache.keys().next().value;const v=blobCache.get(k);setTimeout(()=>URL.revokeObjectURL(v.url),5000);blobCache.delete(k);}
    return blobCache.get(path);
  }catch(e){return null;}
}
function invalidateBlob(path){const v=blobCache.get(path);if(v){setTimeout(()=>URL.revokeObjectURL(v.url),5000);blobCache.delete(path);}}

/* 内部拖拽上下文（dragover 阶段读不到 DataTransfer 数据，靠它） */
let dragCtx=null;

/* 物理桌面 → 虚拟：递归导入 FileSystemEntry（readEntries 100 条限制循环处理） */
async function importEntry(entry,destDir){
  if(entry.isFile){
    const file=await new Promise((res,rej)=>entry.file(res,rej));
    const p=await fs.uniquePath(destDir,file.name);
    await fs.writeFile(p,file);
    return 1;
  }
  let n=0;
  const nd=await fs.uniquePath(destDir,entry.name);
  await fs.mkdir(nd);
  const reader=entry.createReader();
  while(true){
    const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
    if(!batch.length)break;
    for(const en of batch)n+=await importEntry(en,nd);
  }
  return n;
}
async function importDataTransfer(dt,destDir){
  let n=0;
  const items=dt.items?[...dt.items]:[];
  const entries=[];
  for(const it of items){
    if(it.kind!=='file')continue;
    const en=it.webkitGetAsEntry?it.webkitGetAsEntry():null;
    if(en)entries.push(en);
  }
  if(entries.length){
    for(const en of entries)n+=await importEntry(en,destDir);
  }else{
    for(const f of[...dt.files]){
      const p=await fs.uniquePath(destDir,f.name);
      await fs.writeFile(p,f);n++;
    }
  }
  return n;
}
async function importPicked(files,destDir){
  let n=0;
  for(const f of files){const p=await fs.uniquePath(destDir,f.name);await fs.writeFile(p,f);n++;}
  if(n){toast(`已导入 ${n} 个文件`,'ok');notifyFs(destDir);}
}
/* 导出（触摸端"拖出浏览器"的替代方案）：文件直接下载，文件夹打包 zip */
async function exportPath(path){
  try{
    const st=await fs.stat(path);
    let blob,name=basename(path);
    if(st.kind==='dir'){
      if(!window.JSZip){toast('JSZip 未加载，无法打包文件夹','err');return;}
      const zip=new JSZip();
      async function walk(p,zf){
        for(const e of await fs.readdir(p)){
          if(e.kind==='dir')await walk(p+'/'+e.name,zf.folder(e.name));
          else zf.file(e.name,await fs.readFile(p+'/'+e.name));
        }
      }
      const d=toast('正在打包…');
      await walk(path,zip);
      blob=await zip.generateAsync({type:'blob'});
      d();name+='.zip';
    }else blob=await fs.readFile(path);
    const url=URL.createObjectURL(blob);
    const a=el(`<a href="${url}" download="${esc(name)}" hidden></a>`);
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},6000);
    toast('已导出 '+name,'ok');
  }catch(e){toast('导出失败：'+e.message,'err');}
}

/* 剪贴板 */
const clip={op:null,paths:[]};
function clipSet(op,paths){clip.op=op;clip.paths=[...paths];toast(`${op==='copy'?'已复制':'已剪切'} ${paths.length} 项`);bus.emit('clip');}
async function clipPaste(destDir){
  if(!clip.paths.length)return;
  const op=clip.op,paths=[...clip.paths];
  if(op==='cut'){clip.op=null;clip.paths=[];bus.emit('clip');}
  let n=0;
  for(const p of paths){
    try{
      if(normPath(destDir)===dirname(p)&&op==='cut')continue;
      const dst=await fs.uniquePath(destDir,basename(p));
      if(op==='cut')await fs.move(p,dst);else await fs.copy(p,dst);
      if(op==='cut'){invalidateBlob(p);notifyFs(dirname(p));}
      n++;
    }catch(e){toast(basename(p)+'：'+e.message,'err');}
  }
  if(n){notifyFs(destDir);toast(`已粘贴 ${n} 项`,'ok');}
}

/* ════════════════════════════════════════════════════════════
   § 10. 桌面图标（网格自由摆放 + 框选 + 双向拖拽 + 触摸）
   ════════════════════════════════════════════════════════════ */
const DESK='/Desktop';
const GRID={w:94,h:112,pad:10};
const deskIcons=new Map();   // key -> {el,item}
const deskSel=new Set();
const DESK_APPS=['files','browser','notepad','paint','calc','vm','settings'];

function gridDims(){
  const r=$('#icons').getBoundingClientRect();
  return{cols:Math.max(1,Math.floor((r.width-GRID.pad)/GRID.w)),rows:Math.max(1,Math.floor((r.height-GRID.pad)/GRID.h))};
}
const cellXY=(c,r)=>({x:GRID.pad+c*GRID.w,y:GRID.pad+r*GRID.h});
function xyCell(x,y){
  const{cols,rows}=gridDims();
  return{c:clamp(Math.round((x-GRID.pad)/GRID.w),0,cols-1),r:clamp(Math.round((y-GRID.pad)/GRID.h),0,rows-1)};
}
function deskClearSel(){deskSel.clear();deskIcons.forEach(v=>v.el.classList.remove('sel'));}
function deskSelect(key,additive){
  if(!additive)deskClearSel();
  if(deskSel.has(key)&&additive){deskSel.delete(key);deskIcons.get(key)?.el.classList.remove('sel');}
  else{deskSel.add(key);deskIcons.get(key)?.el.classList.add('sel');}
}
async function renderDesktop(){
  const cont=$('#icons');
  cont.innerHTML='';deskIcons.clear();deskSel.clear();
  const items=[];
  for(const id of DESK_APPS){const a=APP_LIST.find(x=>x.id===id);if(a)items.push({key:'app:'+id,type:'app',app:a,name:a.name});}
  let list=[];
  try{list=await fs.readdir(DESK);}catch(e){}
  list.sort((a,b)=>(a.kind===b.kind?a.name.localeCompare(b.name,'zh'):a.kind==='dir'?-1:1));
  for(const e of list)items.push({key:'f:'+e.name,type:'file',entry:e,name:e.name,path:DESK+'/'+e.name});
  /* 布局：保存位优先，冲突/越界则寻找空位（列优先） */
  const{cols,rows}=gridDims();
  const occ=new Map();
  const free=()=>{for(let c=0;c<cols;c++)for(let r=0;r<rows;r++)if(!occ.has(c+','+r))return{c,r};return{c:cols-1,r:rows-1};};
  for(const it of items){
    let pos=OS.state.iconPos[it.key];
    if(!pos||pos.c>=cols||pos.r>=rows||occ.has(pos.c+','+pos.r))pos=null;
    if(!pos){pos=free();OS.state.iconPos[it.key]=pos;}
    occ.set(pos.c+','+pos.r,it.key);
    cont.appendChild(buildIcon(it,pos));
  }
  saveState();
}
function buildIcon(it,pos){
  const{x,y}=cellXY(pos.c,pos.r);
  let iconSvg,cls;
  if(it.type==='app'){iconSvg=ic(it.app.icon,30);cls=it.app.color;}
  else{const f=iconForFile(it.name,it.entry.kind);iconSvg=ic(f.n,30);cls=f.c;}
  const d=el(`<div class="dicon" style="left:${x}px;top:${y}px" draggable="true" data-key="${esc(it.key)}">
    <span class="tile"><span class="${cls}" style="display:grid">${iconSvg}</span></span>
    <span class="lbl">${esc(it.name)}</span></div>`);
  deskIcons.set(it.key,{el:d,item:it});
  const isDir=it.type==='file'&&it.entry.kind==='dir';

  d.addEventListener('pointerdown',e=>{
    if(e.button===2)return;
    if(e.ctrlKey||e.metaKey)deskSelect(it.key,true);
    else if(!deskSel.has(it.key))deskSelect(it.key,false);
    if(it.type==='file'&&it.entry.kind==='file')preloadBlob(it.path);
  });
  d.addEventListener('mouseenter',()=>{if(it.type==='file'&&it.entry.kind==='file')preloadBlob(it.path);});
  d.addEventListener('click',e=>{
    e.stopPropagation();
    if(e.ctrlKey||e.metaKey)return;
    if(isCoarse)openIcon(it);else deskSelect(it.key,false);
  });
  d.addEventListener('dblclick',e=>{e.stopPropagation();openIcon(it);});
  d.addEventListener('contextmenu',e=>{
    e.preventDefault();e.stopPropagation();
    if(!deskSel.has(it.key))deskSelect(it.key,false);
    iconMenu(it,e.clientX,e.clientY);
  });

  /* —— HTML5 原生拖拽（严格同步 dragstart）—— */
  d.addEventListener('dragstart',e=>{
    if(!deskSel.has(it.key))deskSelect(it.key,false);
    const keys=[...deskSel];
    const paths=keys.map(k=>deskIcons.get(k)?.item.path).filter(Boolean);
    const rect=d.getBoundingClientRect();
    dragCtx={src:'desktop',keys,paths,grabX:e.clientX-rect.left,grabY:e.clientY-rect.top,anchor:it.key};
    e.dataTransfer.setData('application/x-amberos',JSON.stringify({src:'desktop',paths}));
    e.dataTransfer.setData('text/plain',it.name);
    e.dataTransfer.effectAllowed='copyMove';
    if(it.type==='file'&&it.entry.kind==='file'){
      const c=blobCache.get(it.path);
      if(c){
        try{e.dataTransfer.items.add(c.file);}catch(err){}
        e.dataTransfer.setData('DownloadURL',`${c.mime}:${c.name}:${c.url}`);
      }
    }
    keys.forEach(k=>deskIcons.get(k)?.el.classList.add('dragging'));
  });
  d.addEventListener('dragend',()=>{
    deskIcons.forEach(v=>v.el.classList.remove('dragging'));
    dragCtx=null;
  });
  if(isDir){
    d.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();d.classList.add('drophint');});
    d.addEventListener('dragleave',()=>d.classList.remove('drophint'));
    d.addEventListener('drop',async e=>{
      e.preventDefault();e.stopPropagation();d.classList.remove('drophint');
      $('#desktop').classList.remove('dropping');
      await dropIntoDir(e,it.path);
    });
  }
  /* —— 触摸长按拖拽 —— */
  attachTouchDrag(d,it);
  return d;
}
function openIcon(it){
  if(it.type==='app')Apps[it.app.id].launch();
  else openPath(it.path);
}
async function dropIntoDir(e,dirPath){
  const raw=e.dataTransfer.getData('application/x-amberos');
  if(raw){
    try{
      const pl=JSON.parse(raw);
      let n=0;
      for(const p of pl.paths||[]){
        if(normPath(p)===normPath(dirPath)||normPath(dirPath).startsWith(normPath(p)+'/'))continue;
        const dst=await fs.uniquePath(dirPath,basename(p));
        await fs.move(p,dst);invalidateBlob(p);n++;
        notifyFs(dirname(p));
      }
      if(n){notifyFs(dirPath);toast(`已移动 ${n} 项到 ${basename(dirPath)}`,'ok');}
    }catch(err){toast('移动失败：'+err.message,'err');}
  }else if(e.dataTransfer.files.length||e.dataTransfer.items.length){
    const d=toast('正在导入…');
    try{const n=await importDataTransfer(e.dataTransfer,dirPath);d();if(n){toast(`已导入 ${n} 个文件`,'ok');notifyFs(dirPath);}}
    catch(err){d();toast('导入失败：'+err.message,'err');}
  }
}
function iconMenu(it,x,y){
  const multi=deskSel.size>1;
  const filePaths=[...deskSel].map(k=>deskIcons.get(k)?.item.path).filter(Boolean);
  const items=[];
  if(it.type==='app'){
    items.push({label:'打开',icon:'play',fn:()=>Apps[it.app.id].launch()});
  }else{
    const k=it.entry.kind==='dir'?'dir':kindOf(it.name);
    items.push({label:'打开',icon:'play',fn:()=>openPath(it.path)});
    if(k!=='dir')openWithItems(it.path,items);
    items.push({sep:1});
    items.push({label:'复制',icon:'copy',fn:()=>clipSet('copy',filePaths)});
    items.push({label:'剪切',icon:'cut',fn:()=>clipSet('cut',filePaths)});
    if(!multi)items.push({label:'重命名',icon:'rename',fn:async()=>{
      const nn=await askText('重命名',it.name);
      if(nn&&nn!==it.name){try{await fs.rename(it.path,nn);invalidateBlob(it.path);notifyFs(DESK);}catch(e){toast(e.message,'err');}}
    }});
    items.push({label:'导出 / 下载',icon:'download',fn:()=>filePaths.forEach(exportPath)});
    if(['zip','gz','tar','sz'].includes(k))items.push({label:'解压到当前文件夹',icon:'fileZip',fn:()=>extractArchive(it.path,DESK)});
    items.push({sep:1});
    items.push({label:multi?`删除 ${deskSel.size} 项`:'删除',icon:'trash',danger:true,fn:async()=>{
      const ok=await askConfirm('删除确认',`确定删除选中的 ${filePaths.length} 项吗？此操作不可恢复。`,true,'删除');
      if(!ok)return;
      for(const p of filePaths){try{await fs.rm(p);invalidateBlob(p);}catch(e){toast(e.message,'err');}}
      notifyFs(DESK);
    }});
  }
  showMenu(x,y,items);
}
function openWithItems(path,items){
  const k=kindOf(basename(path));
  if(k==='html'){
    items.push({label:'在浏览器中打开',icon:'globe',fn:()=>Apps.browser.launch(path)});
    items.push({label:'编辑源代码',icon:'code',fn:()=>Apps.editor.launch(path)});
  }else if(k==='code'||k==='table'){
    items.push({label:'用代码编辑器打开',icon:'code',fn:()=>Apps.editor.launch(path)});
  }
  items.push({label:'以纯文本打开',icon:'notepad',fn:()=>Apps.notepad.launch(path)});
}

/* 桌面空白区交互：框选 / 右键 / 接收拖放 */
function setupDesktop(){
  const icons=$('#icons'),desk=$('#desktop'),marq=$('#marquee');
  icons.addEventListener('pointerdown',e=>{
    if(e.target!==icons||e.button!==0)return;
    if(e.pointerType!=='mouse'){deskClearSel();return;}
    deskClearSel();
    const sx=e.clientX,sy=e.clientY;
    const ir=icons.getBoundingClientRect();
    marq.hidden=false;
    const mv=ev=>{
      const x=Math.min(sx,ev.clientX)-ir.left,y=Math.min(sy,ev.clientY)-ir.top;
      const w=Math.abs(ev.clientX-sx),h=Math.abs(ev.clientY-sy);
      Object.assign(marq.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
      deskIcons.forEach((v,k)=>{
        const r=v.el.getBoundingClientRect();
        const hit=!(r.right<Math.min(sx,ev.clientX)||r.left>Math.max(sx,ev.clientX)||r.bottom<Math.min(sy,ev.clientY)||r.top>Math.max(sy,ev.clientY));
        v.el.classList.toggle('sel',hit);
        if(hit)deskSel.add(k);else deskSel.delete(k);
      });
    };
    const up=()=>{marq.hidden=true;marq.style.width=marq.style.height='0px';removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  icons.addEventListener('contextmenu',e=>{
    if(e.target!==icons)return;
    e.preventDefault();
    showMenu(e.clientX,e.clientY,[
      {label:'刷新',icon:'refresh',fn:()=>{renderDesktop();toast('桌面已刷新','ok');}},
      {sep:1},
      {label:'新建文件夹',icon:'folder',fn:async()=>{
        const n=await askText('新建文件夹','新建文件夹');
        if(n){try{await fs.mkdir(await fs.uniquePath(DESK,n));notifyFs(DESK);}catch(err){toast(err.message,'err');}}
      }},
      {label:'新建文本文档',icon:'fileText',fn:async()=>{
        const n=await askText('新建文本文档','新建文档.txt');
        if(n){try{await fs.writeFile(await fs.uniquePath(DESK,n),'');notifyFs(DESK);}catch(err){toast(err.message,'err');}}
      }},
      {label:'上传文件到桌面',icon:'upload',fn:()=>{
        const inp=$('#fileImport');
        inp.onchange=()=>{importPicked([...inp.files],DESK);inp.value='';};
        inp.click();
      }},
      {label:'粘贴',icon:'paste',dis:!clip.paths.length,fn:()=>clipPaste(DESK)},
      {sep:1},
      {label:'更换壁纸',icon:'pic',fn:()=>Apps.settings.launch('appearance')},
      {label:document.fullscreenElement?'退出全屏':'全屏模式',icon:'full',fn:toggleFullscreen},
      {label:'显示设置',icon:'gear',fn:()=>Apps.settings.launch()}
    ]);
  });
  /* 桌面接收拖放：内部移动 / 外部导入 */
  desk.addEventListener('dragover',e=>{
    e.preventDefault();
    if(!dragCtx&&[...(e.dataTransfer.types||[])].includes('Files'))desk.classList.add('dropping');
  });
  desk.addEventListener('dragleave',e=>{if(e.target===desk||e.target===icons)desk.classList.remove('dropping');});
  desk.addEventListener('drop',async e=>{
    e.preventDefault();desk.classList.remove('dropping');
    const ir=$('#icons').getBoundingClientRect();
    const raw=e.dataTransfer.getData('application/x-amberos');
    if(raw&&dragCtx&&dragCtx.src==='desktop'){
      /* 桌面内部：重新摆放图标 */
      moveIconsTo(e.clientX-ir.left,e.clientY-ir.top);
      return;
    }
    if(raw){
      /* 来自文件管理器：移动到桌面 */
      try{
        const pl=JSON.parse(raw);let n=0;
        for(const p of pl.paths||[]){
          if(dirname(p)===DESK)continue;
          const dst=await fs.uniquePath(DESK,basename(p));
          await fs.move(p,dst);invalidateBlob(p);notifyFs(dirname(p));n++;
        }
        if(n){notifyFs(DESK);toast(`已移动 ${n} 项到桌面`,'ok');}
      }catch(err){toast('移动失败：'+err.message,'err');}
      return;
    }
    if(e.dataTransfer.items.length||e.dataTransfer.files.length){
      const d=toast('正在导入到桌面…');
      try{
        const n=await importDataTransfer(e.dataTransfer,DESK);
        d();if(n){toast(`已导入 ${n} 个文件`,'ok');notifyFs(DESK);}
      }catch(err){d();toast('导入失败：'+err.message,'err');}
    }
  });
  addEventListener('keydown',e=>{
    if(e.key==='Delete'&&deskSel.size&&!e.target.closest('input,textarea,.CodeMirror,[contenteditable]')){
      const paths=[...deskSel].map(k=>deskIcons.get(k)?.item.path).filter(Boolean);
      if(!paths.length)return;
      askConfirm('删除确认',`确定删除选中的 ${paths.length} 项吗？`,true,'删除').then(async ok=>{
        if(!ok)return;
        for(const p of paths){try{await fs.rm(p);invalidateBlob(p);}catch(err){}}
        notifyFs(DESK);
      });
    }
  });
  bus.on('fs',d=>{if(d.path===DESK||d.path===normPath(DESK))renderDesktop();});
  addEventListener('resize',debounce(()=>renderDesktop(),300));
}
/* 把选中图标移动到指定坐标（带网格吸附与避让，CSS 过渡保证丝滑） */
function moveIconsTo(px,py){
  if(!dragCtx)return;
  const keys=dragCtx.keys.filter(k=>deskIcons.has(k));
  if(!keys.length)return;
  const anchor=deskIcons.get(dragCtx.anchor)||deskIcons.get(keys[0]);
  const aPos=OS.state.iconPos[dragCtx.anchor]||{c:0,r:0};
  const target=xyCell(px-(dragCtx.grabX||40)+44,py-(dragCtx.grabY||40)+50);
  const dc=target.c-aPos.c,dr=target.r-aPos.r;
  const{cols,rows}=gridDims();
  const occ=new Map();
  deskIcons.forEach((v,k)=>{if(!keys.includes(k)){const p=OS.state.iconPos[k];if(p)occ.set(p.c+','+p.r,k);}});
  for(const k of keys){
    const old=OS.state.iconPos[k]||{c:0,r:0};
    let c=clamp(old.c+dc,0,cols-1),r=clamp(old.r+dr,0,rows-1);
    if(occ.has(c+','+r)){
      let found=false;
      outer:for(let dist=1;dist<cols+rows&&!found;dist++)
        for(let cc=Math.max(0,c-dist);cc<=Math.min(cols-1,c+dist);cc++)
          for(let rr=Math.max(0,r-dist);rr<=Math.min(rows-1,r+dist);rr++)
            if(!occ.has(cc+','+rr)){c=cc;r=rr;found=true;break outer;}
    }
    occ.set(c+','+r,k);
    OS.state.iconPos[k]={c,r};
    const{x,y}=cellXY(c,r);
    const v=deskIcons.get(k);
    v.el.style.left=x+'px';v.el.style.top=y+'px';
  }
  saveState();
}
/* 触摸长按拖拽（HTML5 DnD 在触摸端不可用的替代实现） */
function attachTouchDrag(d,it){
  let timer=null,active=false,sx=0,sy=0,moved=false;
  d.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;
    timer=setTimeout(()=>{
      active=true;d.classList.add('tdragging');
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(err){}
    },320);
  },{passive:true});
  d.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(!active){
      if(Math.hypot(t.clientX-sx,t.clientY-sy)>10){clearTimeout(timer);}
      return;
    }
    e.preventDefault();moved=true;
    d.style.transform=`translate(${t.clientX-sx}px,${t.clientY-sy}px) scale(1.08)`;
  },{passive:false});
  d.addEventListener('touchend',e=>{
    clearTimeout(timer);
    if(!active)return;
    d.classList.remove('tdragging');d.style.transform='';
    const t=e.changedTouches[0];
    if(moved){
      d.style.visibility='hidden';
      const under=document.elementFromPoint(t.clientX,t.clientY);
      d.style.visibility='';
      const targetIcon=under&&under.closest?under.closest('.dicon'):null;
      const tk=targetIcon?targetIcon.dataset.key:null;
      const tv=tk?deskIcons.get(tk):null;
      if(tv&&tv.item.type==='file'&&tv.item.entry.kind==='dir'&&it.path&&tv.item.path!==it.path){
        fs.uniquePath(tv.item.path,basename(it.path)).then(dst=>fs.move(it.path,dst)).then(()=>{invalidateBlob(it.path);notifyFs(DESK);notifyFs(tv.item.path);toast('已移动到 '+tv.item.name,'ok');}).catch(err=>toast(err.message,'err'));
      }else{
        if(!deskSel.has(it.key))deskSelect(it.key,false);
        const ir=$('#icons').getBoundingClientRect();
        dragCtx={src:'desktop',keys:[...deskSel],anchor:it.key,grabX:44,grabY:50};
        moveIconsTo(t.clientX-ir.left,t.clientY-ir.top);
        dragCtx=null;
      }
    }else if(!moved){
      if(!menuEl)iconMenu(it,t.clientX,t.clientY);
    }
    active=false;
  });
  d.addEventListener('touchcancel',()=>{clearTimeout(timer);active=false;d.classList.remove('tdragging');d.style.transform='';});
}

/* ════════════════════════════════════════════════════════════
   § 11. 统一打开分派器（先 stat 判类型：目录→导航，文件→对应 App）
   ════════════════════════════════════════════════════════════ */
async function openPath(path,opt={}){
  path=normPath(path);
  let st;
  try{st=await fs.stat(path);}
  catch(e){toast('无法访问：'+basename(path),'err');return;}
  if(st.kind==='dir'){
    if(opt.explorer)opt.explorer.nav(path);
    else Apps.files.launch(path);
    return;
  }
  const k=kindOf(basename(path));
  switch(k){
    case 'img':Apps.viewer.launch(path);break;
    case 'audio':case 'video':Apps.player.launch(path);break;
    case 'pdf':Apps.pdf.launch(path);break;
    case 'html':Apps.editor.launch(path);break;
    case 'table':Apps.sheet.launch(path);break;
    case 'code':Apps.editor.launch(path);break;
    case 'zip':case 'gz':case 'tar':case 'sz':{
      const dest=dirname(path);
      const ok=await dialog({title:'压缩包',msg:`解压「${basename(path)}」到当前文件夹？`,icon:'fileZip',okText:'解压'});
      if(ok)extractArchive(path,dest);
      break;
    }
    case 'iso':{
      const ok=await dialog({title:'光盘镜像',msg:'使用 V86 虚拟机启动该镜像？',icon:'chip',okText:'启动虚拟机'});
      if(ok)Apps.vm.launch(path);
      break;
    }
    case 'text':default:Apps.notepad.launch(path);
  }
}
/* ════════════════════════════════════════════════════════════
   § 12. 压缩包引擎：ZIP(JSZip) / GZ(DecompressionStream) / TAR(原生解析) / 7Z(7z-wasm)
   ════════════════════════════════════════════════════════════ */
async function gunzip(buf){
  if(!window.DecompressionStream)throw new Error('浏览器不支持 DecompressionStream');
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([buf]).stream().pipeThrough(ds);
  return await new Response(stream).arrayBuffer();
}
function parseTar(buf){
  const u8=new Uint8Array(buf),dec=new TextDecoder(),files=[];
  let off=0,longName=null;
  const str=(s,l)=>{const a=u8.subarray(s,s+l);let e=a.indexOf(0);return dec.decode(e<0?a:a.subarray(0,e)).trim();};
  while(off+512<=u8.length){
    const name0=str(off,100);
    if(!name0&&!str(off+124,12))break;
    const size=parseInt(str(off+124,12),8)||0;
    const type=String.fromCharCode(u8[off+156]||48);
    const prefix=str(off+345,155);
    let name=longName||(prefix?prefix+'/'+name0:name0);
    longName=null;
    const dataStart=off+512;
    if(type==='L'){longName=dec.decode(u8.subarray(dataStart,dataStart+size)).replace(/\0+$/,'');}
    else if(type==='0'||type===''||type==='\0'||type==='7'){files.push({name,kind:'file',data:u8.slice(dataStart,dataStart+size)});}
    else if(type==='5'){files.push({name:name.replace(/\/$/,''),kind:'dir'});}
    off=dataStart+Math.ceil(size/512)*512;
  }
  return files;
}
async function writeEntries(list,destDir){
  let n=0;
  for(const f of list){
    const parts=f.name.split('/').filter(s=>s&&s!=='.'&&s!=='..');
    if(!parts.length)continue;
    const p=destDir+'/'+parts.join('/');
    if(f.kind==='dir')await fs.mkdir(p);
    else{if(parts.length>1)await fs.mkdir(destDir+'/'+parts.slice(0,-1).join('/'));await fs.writeFile(p,f.data);n++;}
  }
  return n;
}
async function extractArchive(path,destDir){
  const name=basename(path),e=extOf(name);
  const dismiss=toast('正在解压 '+name+' …');
  try{
    const file=await fs.readFile(path);
    const buf=await file.arrayBuffer();   /* 浏览器无 Buffer，统一 arrayBuffer */
    const stem=name.replace(/\.(zip|tar|gz|tgz|7z)+$/i,'')||'解压';
    const out=await fs.uniquePath(destDir,stem);
    await fs.mkdir(out);
    let n=0;
    if(e==='zip'){
      if(!window.JSZip)throw new Error('JSZip 库未能从 CDN 加载');
      const zip=await JSZip.loadAsync(buf);
      const entries=Object.values(zip.files);
      for(const en of entries){
        if(en.dir){await fs.mkdir(out+'/'+en.name.replace(/\/$/,''));continue;}
        const data=await en.async('blob');
        const parts=en.name.split('/').filter(Boolean);
        if(parts.length>1)await fs.mkdir(out+'/'+parts.slice(0,-1).join('/'));
        await fs.writeFile(out+'/'+parts.join('/'),data);n++;
      }
    }else if(e==='tar'){
      n=await writeEntries(parseTar(buf),out);
    }else if(e==='tgz'||(e==='gz'&&/\.tar\.gz$/i.test(name))){
      n=await writeEntries(parseTar(await gunzip(buf)),out);
    }else if(e==='gz'){
      const inner=name.replace(/\.gz$/i,'')||'解压文件';
      await fs.writeFile(out+'/'+inner,await gunzip(buf));n=1;
    }else if(e==='7z'){
      const mod=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
      const sz=await mod.default({print:()=>{},printErr:()=>{}});
      sz.FS.writeFile('/in.7z',new Uint8Array(buf));
      sz.FS.mkdir('/out');
      sz.callMain(['x','/in.7z','-o/out','-y','-bso0']);
      async function walk7(p,vp){
        for(const nm of sz.FS.readdir(p)){
          if(nm==='.'||nm==='..')continue;
          const fp=p+'/'+nm,st=sz.FS.stat(fp);
          if(sz.FS.isDir(st.mode)){await fs.mkdir(vp+'/'+nm);await walk7(fp,vp+'/'+nm);}
          else{await fs.writeFile(vp+'/'+nm,sz.FS.readFile(fp));n++;}
        }
      }
      await walk7('/out',out);
    }else throw new Error('不支持的压缩格式 .'+e);
    dismiss();
    toast(`解压完成：${n} 个文件 → ${basename(out)}`,'ok');
    notifyFs(destDir);
  }catch(err){dismiss();toast('解压失败：'+err.message,'err');console.warn(err);}
}
async function compressToZip(paths,destDir){
  if(!window.JSZip){toast('JSZip 未加载','err');return;}
  const dismiss=toast('正在压缩…');
  try{
    const zip=new JSZip();
    async function add(p,zf){
      const st=await fs.stat(p);
      if(st.kind==='dir'){const f=zf.folder(basename(p));for(const e of await fs.readdir(p))await add(p+'/'+e.name,f);}
      else zf.file(basename(p),await fs.readFile(p));
    }
    for(const p of paths)await add(p,zip);
    const blob=await zip.generateAsync({type:'blob'});
    const out=await fs.uniquePath(destDir,(paths.length===1?basename(paths[0]).replace(/\.[^.]+$/,''):'归档')+'.zip');
    await fs.writeFile(out,blob);
    dismiss();toast('已创建 '+basename(out),'ok');notifyFs(destDir);
  }catch(e){dismiss();toast('压缩失败：'+e.message,'err');}
}
