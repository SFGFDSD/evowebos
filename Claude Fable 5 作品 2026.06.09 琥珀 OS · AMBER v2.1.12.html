    function nav(p,noHist){
      p=normPath(p);
      if(!noHist){S.hist=S.hist.slice(0,S.hi+1);S.hist.push(p);S.hi=S.hist.length-1;}
      S.cwd=p;S.sel.clear();S.searching=false;search.value='';
      win.setTitle(p==='/'?'文件 · 根目录':'文件 · '+basename(p));
      btn('back').disabled=S.hi<=0;btn('fwd').disabled=S.hi>=S.hist.length-1;
      renderSide();renderCrumbs();refresh();
    }
    const EX={nav};
    async function deepSearch(q){
      const results=[];
      async function walk(p,depth){
        if(depth>6||results.length>=300)return;
        let l;try{l=await fs.readdir(p);}catch(e){return;}
        for(const e of l){
          const fp=p.replace(/\/$/,'')+'/'+e.name;
          if(e.name.toLowerCase().includes(q))results.push({...e,_path:fp});
          if(e.kind==='dir')await walk(fp,depth+1);
        }
      }
      const d=toast('正在搜索…');
      await walk(S.cwd,0);d();
      S.searching=true;S.entries=results;S.sel.clear();
      list.innerHTML='';
      const arr=sorted(results);
      if(!arr.length)list.appendChild(el(`<div class="fx-empty">${ic('search',44)}<span>未找到「${esc(q)}」</span></div>`));
      for(const e of arr)list.appendChild(rowFor(e,e._path));
      renderStatus();
    }
    function rowMenu(e,fullPath,x,y){
      const selPaths=[...S.sel].map(n=>{
        const en=S.entries.find(o=>o.name===n);
        return en&&en._path?en._path:S.cwd.replace(/\/$/,'')+'/'+n;
      });
      const k=e.kind==='dir'?'dir':kindOf(e.name);
      const items=[{label:'打开',icon:'play',fn:()=>openPath(fullPath,{explorer:EX})}];
      if(e.kind==='file')openWithItems(fullPath,items);
      items.push({sep:1},
        {label:'复制',icon:'copy',hint:'Ctrl+C',fn:()=>clipSet('copy',selPaths)},
        {label:'剪切',icon:'cut',hint:'Ctrl+X',fn:()=>clipSet('cut',selPaths)},
        {label:'重命名',icon:'rename',dis:S.sel.size>1,fn:async()=>{
          const nn=await askText('重命名',e.name);
          if(nn&&nn!==e.name){try{await fs.rename(fullPath,nn);invalidateBlob(fullPath);notifyFs(dirname(fullPath));refresh();}catch(err){toast(err.message,'err');}}
        }},
        {label:'导出 / 下载',icon:'download',fn:()=>selPaths.forEach(exportPath)});
      if(['zip','gz','tar','sz'].includes(k))items.push({label:'解压到当前文件夹',icon:'fileZip',fn:()=>extractArchive(fullPath,S.cwd)});
      items.push({label:'压缩为 ZIP',icon:'fileZip',fn:()=>compressToZip(selPaths,S.cwd)});
      if(fs.isMountRoot(fullPath))items.push({label:'卸载',icon:'eject',fn:async()=>{await fs.unmount(fullPath);refresh();renderSide();}});
      items.push({sep:1},{label:S.sel.size>1?`删除 ${S.sel.size} 项`:'删除',icon:'trash',danger:true,fn:async()=>{
        const ok=await askConfirm('删除确认',`确定删除选中的 ${selPaths.length} 项吗？`,true,'删除');
        if(!ok)return;
        for(const p of selPaths){try{await fs.rm(p);invalidateBlob(p);}catch(err){toast(err.message,'err');}}
        notifyFs(S.cwd);refresh();
      }});
      showMenu(x,y,items);
    }
    /* 空白区右键 */
    list.addEventListener('contextmenu',e=>{
      if(e.target.closest('.frow'))return;
      e.preventDefault();
      showMenu(e.clientX,e.clientY,[
        {label:'刷新',icon:'refresh',fn:refresh},
        {sep:1},
        {label:'新建文件夹',icon:'folder',fn:newFolder},
        {label:'新建文本文档',icon:'fileText',fn:async()=>{
          const n=await askText('新建文件','新建文档.txt');
          if(n){try{await fs.writeFile(await fs.uniquePath(S.cwd,n),'');refresh();notifyFs(S.cwd);}catch(err){toast(err.message,'err');}}
        }},
        {label:'导入文件',icon:'upload',fn:doUpload},
        {label:'粘贴',icon:'paste',dis:!clip.paths.length,fn:async()=>{await clipPaste(S.cwd);refresh();}},
        {sep:1},
        {label:'挂载本地文件夹',icon:'mount',fn:pickMountFolder}
      ]);
    });
    /* 列表框选（鼠标） */
    list.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('.frow'))return;
      S.sel.clear();paintSel();
      const lr=list.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;
      const mq=el('<div class="fxmarq"></div>');list.appendChild(mq);
      const mv=ev=>{
        const x1=Math.min(sx,ev.clientX),x2=Math.max(sx,ev.clientX),y1=Math.min(sy,ev.clientY),y2=Math.max(sy,ev.clientY);
        Object.assign(mq.style,{left:x1-lr.left+'px',top:y1-lr.top+list.scrollTop+'px',width:x2-x1+'px',height:y2-y1+'px'});
        list.querySelectorAll('.frow').forEach(r=>{
          const rr=r.getBoundingClientRect();
          const hit=!(rr.right<x1||rr.left>x2||rr.bottom<y1||rr.top>y2);
          if(hit)S.sel.add(r.dataset.name);else S.sel.delete(r.dataset.name);
          r.classList.toggle('sel',hit);
        });
      };
      const up=()=>{mq.remove();renderStatus();removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);
    });
    list.addEventListener('click',e=>{if(e.target===list||e.target.closest('.fx-empty')){S.sel.clear();paintSel();}});
    /* 接收拖放（内部移动 / 物理桌面导入） */
    list.addEventListener('dragover',e=>{e.preventDefault();});
    list.addEventListener('drop',async e=>{
      if(e.target.closest('.frow[data-dirdrop]'))return;
      e.preventDefault();
      const raw=e.dataTransfer.getData('application/x-amberos');
      if(raw){
        try{
          const pl=JSON.parse(raw);let n=0;
          for(const p of pl.paths||[]){
            if(dirname(p)===normPath(S.cwd))continue;
            if(normPath(S.cwd).startsWith(normPath(p)+'/'))continue;
            const dst=await fs.uniquePath(S.cwd,basename(p));
            await fs.move(p,dst);invalidateBlob(p);notifyFs(dirname(p));n++;
          }
          if(n){notifyFs(S.cwd);refresh();toast(`已移动 ${n} 项`,'ok');}
        }catch(err){toast(err.message,'err');}
      }else if(e.dataTransfer.items.length||e.dataTransfer.files.length){
        const d=toast('正在导入…');
        try{const n=await importDataTransfer(e.dataTransfer,S.cwd);d();if(n){toast(`已导入 ${n} 个文件`,'ok');notifyFs(S.cwd);refresh();}}
        catch(err){d();toast('导入失败：'+err.message,'err');}
      }
    });
    /* 工具栏 */
    async function newFolder(){
      const n=await askText('新建文件夹','新建文件夹');
      if(n){try{await fs.mkdir(await fs.uniquePath(S.cwd,n));refresh();notifyFs(S.cwd);}catch(err){toast(err.message,'err');}}
    }
    function doUpload(){
      const inp=$('#fileImport');
      inp.onchange=async()=>{await importPicked([...inp.files],S.cwd);inp.value='';refresh();};
      inp.click();
    }
    btn('side').addEventListener('click',()=>fx.classList.toggle('show-side'));
    btn('back').addEventListener('click',()=>{if(S.hi>0){S.hi--;nav(S.hist[S.hi],true);}});
    btn('fwd').addEventListener('click',()=>{if(S.hi<S.hist.length-1){S.hi++;nav(S.hist[S.hi],true);}});
    btn('up').addEventListener('click',()=>{if(S.cwd!=='/')nav(dirname(S.cwd));});
    btn('refresh').addEventListener('click',refresh);
    btn('newf').addEventListener('click',newFolder);
    btn('upload').addEventListener('click',doUpload);
    btn('mount').addEventListener('click',pickMountFolder);
    win.body.querySelectorAll('.fcol').forEach(c=>c.addEventListener('click',()=>{
      const k=c.dataset.k;
      if(S.sort.key===k)S.sort.asc=!S.sort.asc;else S.sort={key:k,asc:true};
      refresh();
    }));
    search.addEventListener('input',debounce(()=>{S.searching=false;refresh();},200));
    search.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&search.value.trim())deepSearch(search.value.trim().toLowerCase());
    });
    win.body.addEventListener('keydown',e=>{
      if(e.target.closest('input,textarea'))return;
      const selPaths=[...S.sel].map(n=>S.cwd.replace(/\/$/,'')+'/'+n);
      if((e.ctrlKey||e.metaKey)&&e.key==='c'&&selPaths.length)clipSet('copy',selPaths);
      if((e.ctrlKey||e.metaKey)&&e.key==='x'&&selPaths.length)clipSet('cut',selPaths);
      if((e.ctrlKey||e.metaKey)&&e.key==='v')clipPaste(S.cwd).then(refresh);
      if((e.ctrlKey||e.metaKey)&&e.key==='a'){e.preventDefault();S.entries.forEach(x=>S.sel.add(x.name));paintSel();}
      if(e.key==='Delete'&&selPaths.length){
        askConfirm('删除确认',`确定删除 ${selPaths.length} 项？`,true,'删除').then(async ok=>{
          if(!ok)return;
          for(const p of selPaths){try{await fs.rm(p);}catch(err){}}
          notifyFs(S.cwd);refresh();
        });
      }
    });
    win.body.tabIndex=-1;
    const off1=bus.on('fs',d=>{if(d.path===normPath(S.cwd)||d.path==='/mnt/local')refresh();});
    const off2=bus.on('clip',()=>refresh());
    win.onClose=()=>{off1();off2();};
    nav(startPath&&typeof startPath==='string'?startPath:'/Desktop');
    return win;
  }
};

/* ════════════════════════════════════════════════════════════
   § 16. 表格（CSV / TSV 双视图）
   ════════════════════════════════════════════════════════════ */
function parseDSV(text,sep){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(c!=='\r')cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const toDSV=(rows,sep)=>rows.map(r=>r.map(c=>new RegExp(`["\n${sep==='\t'?'\\t':sep}]`).test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(sep)).join('\n');
Apps.sheet={
  launch(path){
    const win=createWindow({title:'表格',icon:'fileTable',app:'sheet',width:780,height:520});
    const sep=path&&extOf(path)==='tsv'?'\t':',';
    let text='',mode='table',dirty=false,cur=path||null;
    win.body.innerHTML=`<div class="np">
      <div class="np-bar">
        <button class="ibtn" data-a="save">${ic('save',15)}<span>保存</span></button>
        <button class="ibtn on" data-a="vt">${ic('table2',15)}<span>表格视图</span></button>
        <button class="ibtn" data-a="vx">${ic('txtview',15)}<span>文本视图</span></button>
        <span style="margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)" class="sh-info"></span>
      </div>
      <div class="tb-wrap"></div>
      <textarea class="np-ta" spellcheck="false" hidden></textarea>
      <div class="np-status"><span class="np-path">${esc(cur||'未命名.csv')}</span><span class="dirty"></span></div></div>`;
    const wrap=win.body.querySelector('.tb-wrap'),ta=win.body.querySelector('.np-ta'),
      bt=win.body.querySelector('[data-a=vt]'),bx=win.body.querySelector('[data-a=vx]'),
      info=win.body.querySelector('.sh-info'),stD=win.body.querySelector('.dirty');
    const setDirty=v=>{dirty=v;stD.textContent=v?'● 未保存':'';};
    function renderTable(){
      const rows=parseDSV(text,sep);
      const t=el('<table class="tbv"></table>');
      if(rows.length){
        const thr=el('<tr><th class="rownum">#</th></tr>');
        rows[0].forEach(h=>thr.appendChild(el(`<th>${esc(h)||'&nbsp;'}</th>`)));
        t.appendChild(thr);
        for(let r=1;r<rows.length;r++){
          const tr=el(`<tr><td class="rownum">${r}</td></tr>`);
          for(let c=0;c<rows[0].length;c++){
            const td=el(`<td contenteditable="true" data-r="${r}" data-c="${c}"></td>`);
            td.textContent=rows[r][c]??'';
            td.addEventListener('input',()=>{
              const rr=parseDSV(text,sep);
              while(rr.length<=r)rr.push([]);
              rr[r][c]=td.textContent;
              text=toDSV(rr,sep);setDirty(true);
            });
            tr.appendChild(td);
          }
          t.appendChild(tr);
        }
      }
      wrap.innerHTML='';wrap.appendChild(t);
      info.textContent=`${Math.max(0,rows.length-1)} 行 × ${rows[0]?rows[0].length:0} 列 · ${sep==='\t'?'TSV':'CSV'}`;
    }
    function setMode(m){
      if(m===mode)return;
      if(mode==='text')text=ta.value;
      mode=m;
      bt.classList.toggle('on',m==='table');bx.classList.toggle('on',m==='text');
      wrap.hidden=m!=='table';ta.hidden=m!=='text';
      if(m==='table')renderTable();else ta.value=text;
    }
    bt.addEventListener('click',()=>setMode('table'));
    bx.addEventListener('click',()=>setMode('text'));
    ta.addEventListener('input',()=>{text=ta.value;setDirty(true);});
    async function save(){
      if(mode==='text')text=ta.value;
      if(!cur){const n=await askText('保存为','数据.csv');if(!n)return;cur=await fs.uniquePath('/Documents',n);}
      try{await fs.writeFile(cur,text);setDirty(false);invalidateBlob(cur);notifyFs(dirname(cur));toast('已保存','ok');}
      catch(e){toast('保存失败：'+e.message,'err');}
    }
    win.body.querySelector('[data-a=save]').addEventListener('click',save);
    win.body.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();}});
    (async()=>{
      if(path){try{text=await fs.readText(path);win.setTitle('表格 · '+basename(path));}catch(e){toast(e.message,'err');}}
      else text='列A,列B,列C\n,,\n,,';
      renderTable();
    })();
    return win;
  }
};

      <div class="h">琥 珀</div><div class="s">AMBER BROWSER</div>
      <div class="tip">在上方地址栏输入网址或 VFS 中 HTML 文件的路径。<br>
      注意：部分网站设置了 X-Frame-Options，会拒绝在 iframe 中展示。<br><br>
      <a href="https://example.com">example.com</a>
      <a href="https://developer.mozilla.org">MDN</a>
      <a href="https://www.wikipedia.org">Wikipedia</a></div></div></body></html>`;
    async function show(v,noHist){
      v=(v||'').trim();
      if(!noHist){hist.splice(hi+1);hist.push(v||'~home');hi=hist.length-1;}
      btnState();
      if(curBlob){setTimeout(()=>URL.revokeObjectURL(curBlob),5000);curBlob=null;}
      if(!v||v==='~home'){frame.removeAttribute('src');frame.srcdoc=HOME;addr.value='';return;}
      if(v.startsWith('/')){
        try{
          const f=await fs.readFile(v);
          curBlob=URL.createObjectURL(new Blob([f],{type:f.type||mimeOf(v)||'text/html'}));
          frame.removeAttribute('srcdoc');frame.src=curBlob;
          addr.value=v;win.setTitle('浏览器 · '+basename(v));
        }catch(e){toast('无法打开 '+v+'：'+e.message,'err');}
        return;
      }
      let url=v;
      if(!/^https?:\/\//i.test(url)){
        url=/^[\w-]+(\.[\w-]+)+(\/|$)/.test(url)?'https://'+url:'https://www.bing.com/search?q='+encodeURIComponent(url);
      }
      frame.removeAttribute('srcdoc');frame.src=url;
      addr.value=url;win.setTitle('浏览器 · '+url.replace(/^https?:\/\//,'').split('/')[0]);
    }
    function btnState(){
      win.body.querySelector('[data-a=back]').disabled=hi<=0;
      win.body.querySelector('[data-a=fwd]').disabled=hi>=hist.length-1;
    }
    addr.addEventListener('keydown',e=>{if(e.key==='Enter')show(addr.value);});
    win.body.querySelector('[data-a=back]').addEventListener('click',()=>{if(hi>0){hi--;show(hist[hi],true);}});
    win.body.querySelector('[data-a=fwd]').addEventListener('click',()=>{if(hi<hist.length-1){hi++;show(hist[hi],true);}});
    win.body.querySelector('[data-a=reload]').addEventListener('click',()=>show(hist[hi]||'',true));
    win.body.querySelector('[data-a=home]').addEventListener('click',()=>show(''));
    show(typeof target==='string'?target:'');
    return win;
  }
};

Apps.viewer={
  launch(path){
    const win=createWindow({title:'图片 · '+basename(path),icon:'fileImg',app:'viewer',width:760,height:560});
    let scale=1,tx=0,ty=0,url=null;
    win.body.innerHTML=`<div class="iv">
      <div class="np-bar">
        <button class="ibtn" data-a="zo">${ic('zoomOut',16)}</button>
        <span class="iv-zl">100%</span>
        <button class="ibtn" data-a="zi">${ic('zoomIn',16)}</button>
        <button class="ibtn" data-a="fit">${ic('fit',16)}<span>适应</span></button>
        <button class="ibtn" data-a="dl" style="margin-left:auto">${ic('download',15)}<span>导出</span></button>
      </div>
      <div class="iv-stage"><img alt="" draggable="false"></div></div>`;
    const img=win.body.querySelector('img'),stage=win.body.querySelector('.iv-stage'),zl=win.body.querySelector('.iv-zl');
    const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;zl.textContent=Math.round(scale*100)+'%';};
    const fit=()=>{
      if(!img.naturalWidth)return;
      const r=stage.getBoundingClientRect();
      scale=Math.min(1,(r.width-30)/img.naturalWidth,(r.height-30)/img.naturalHeight);
      tx=ty=0;apply();
    };
    win.body.querySelector('[data-a=zi]').addEventListener('click',()=>{scale=Math.min(12,scale*1.25);apply();});
    win.body.querySelector('[data-a=zo]').addEventListener('click',()=>{scale=Math.max(.05,scale/1.25);apply();});
    win.body.querySelector('[data-a=fit]').addEventListener('click',fit);
    win.body.querySelector('[data-a=dl]').addEventListener('click',()=>exportPath(path));
    stage.addEventListener('wheel',e=>{e.preventDefault();scale=clamp(scale*(e.deltaY<0?1.13:0.885),.05,12);apply();},{passive:false});
    img.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const sx=e.clientX-tx,sy=e.clientY-ty;
      const mv=ev=>{tx=ev.clientX-sx;ty=ev.clientY-sy;apply();};
      const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);
    });
    (async()=>{
      try{
        const f=await fs.readFile(path);
        url=URL.createObjectURL(new Blob([f],{type:f.type||mimeOf(path)}));
        img.onload=fit;img.src=url;
      }catch(e){toast('打开失败：'+e.message,'err');}
    })();
    win.onClose=()=>{if(url)URL.revokeObjectURL(url);};
    return win;
  }
};

/* ════════════════════════════════════════════════════════════
   § 20. 计算器
   ════════════════════════════════════════════════════════════ */
Apps.calc={
  launch(){
    const win=createWindow({title:'计算器',icon:'calc',app:'calc',width:330,height:480});
    let expr='';
    win.body.innerHTML=`<div class="calc">
      <div class="calc-d"><div class="expr">&nbsp;</div><div class="res">0</div></div>
      <div class="calc-grid"></div></div>`;
    const ed=win.body.querySelector('.expr'),rd=win.body.querySelector('.res'),grid=win.body.querySelector('.calc-grid');
    const keys=[['C','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['(',''],['0',''],[')',''],['.',''],['=','eq']];
    function evaluate(silent){
      const js=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
      if(!js.trim())return null;
      if(!/^[0-9+\-*/().%\s]+$/.test(js))return null;
      try{
        const v=Function('"use strict";return('+js.replace(/%/g,'/100')+')')();
        if(typeof v!=='number'||!isFinite(v))return null;
        return Math.round(v*1e10)/1e10;
      }catch(e){if(!silent)toast('表达式有误','err');return null;}
    }
    function upd(){
      ed.innerHTML=esc(expr)||'&nbsp;';
      const v=evaluate(true);
      if(v!=null&&expr)rd.textContent=String(v);
      else if(!expr)rd.textContent='0';
    }
    function press(k){
      if(k==='C'){expr='';rd.textContent='0';}
      else if(k==='⌫')expr=expr.slice(0,-1);
      else if(k==='='){const v=evaluate(false);if(v!=null){expr=String(v);}}
      else expr+=k;
      upd();
    }
    /* 最后一行布局：= 占满 */
    keys.forEach(([k,cls])=>{
      const b=el(`<button class="ck ${cls}">${k}</button>`);
      if(k==='=')b.style.gridColumn='1 / -1';
      b.addEventListener('click',()=>press(k));
      grid.appendChild(b);
    });
    grid.style.gridTemplateRows='repeat(5,1fr) 1.1fr';
    win.body.tabIndex=0;
    win.body.addEventListener('keydown',e=>{
      const map={'/':'÷','*':'×','-':'−','Enter':'=','=':'=','Backspace':'⌫','Escape':'C'};
      const k=map[e.key]||((/^[0-9+().%]$/.test(e.key))?e.key:null);
      if(k){e.preventDefault();press(k);}
    });
    return win;
  }
};

/* ════════════════════════════════════════════════════════════
   § 21. 画板
   ════════════════════════════════════════════════════════════ */
Apps.paint={
  launch(){
    const win=createWindow({title:'画板',icon:'paint',app:'paint',width:760,height:540});
    const COLORS=['#ece5d3','#ffb454','#f0717d','#9ecf6a','#46d4c4','#82aaff','#c792ea','#10131b'];
    let color=COLORS[1],size=5,erasing=false;
    win.body.innerHTML=`<div class="pt">
      <div class="pt-bar">
        <span class="pt-colors" style="display:flex;gap:6px"></span>
        <span class="tb-sep"></span>
        <input type="range" class="pt-size" min="1" max="42" value="5" title="笔刷大小">
        <button class="ibtn" data-a="pen">${ic('paint',15)}<span>画笔</span></button>
        <button class="ibtn" data-a="erase">${ic('erase',15)}<span>橡皮</span></button>
        <button class="ibtn" data-a="clear">${ic('trash',15)}<span>清空</span></button>
        <button class="ibtn" data-a="save" style="margin-left:auto">${ic('save',15)}<span>保存到图片</span></button>
      </div>
      <div class="pt-stage"><canvas></canvas></div></div>`;
    const stage=win.body.querySelector('.pt-stage'),cv=win.body.querySelector('canvas'),ctx=cv.getContext('2d');
    const colorsEl=win.body.querySelector('.pt-colors');
    COLORS.forEach(c=>{
      const s=el(`<span class="swatch ${c===color?'on':''}" style="background:${c}"></span>`);
      s.addEventListener('click',()=>{color=c;erasing=false;syncBtns();colorsEl.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));s.classList.add('on');});
      colorsEl.appendChild(s);
    });
    const bp=win.body.querySelector('[data-a=pen]'),be=win.body.querySelector('[data-a=erase]');
    const syncBtns=()=>{bp.classList.toggle('on',!erasing);be.classList.toggle('on',erasing);};
    syncBtns();
    bp.addEventListener('click',()=>{erasing=false;syncBtns();});
    be.addEventListener('click',()=>{erasing=true;syncBtns();});
    win.body.querySelector('.pt-size').addEventListener('input',e=>size=+e.target.value);
    win.body.querySelector('[data-a=clear]').addEventListener('click',()=>ctx.clearRect(0,0,cv.width,cv.height));
    function resize(){
      const r=stage.getBoundingClientRect();
      if(r.width<2)return;
      const old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;
      if(cv.width)old.getContext('2d').drawImage(cv,0,0);
      cv.width=Math.round(r.width*devicePixelRatio);cv.height=Math.round(r.height*devicePixelRatio);
      cv.style.width=r.width+'px';cv.style.height=r.height+'px';
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      ctx.lineCap=ctx.lineJoin='round';
      if(old.width)ctx.drawImage(old,0,0,old.width/devicePixelRatio,old.height/devicePixelRatio);
    }
    const ro=new ResizeObserver(debounce(resize,120));ro.observe(stage);
    setTimeout(resize,80);
    let drawing=false,lx=0,ly=0;
    cv.addEventListener('pointerdown',e=>{
      drawing=true;cv.setPointerCapture(e.pointerId);
      const r=cv.getBoundingClientRect();lx=e.clientX-r.left;ly=e.clientY-r.top;
      ctx.beginPath();ctx.fillStyle=color;
      ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
      ctx.arc(lx,ly,size/2,0,7);ctx.fill();
    });
    cv.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
      ctx.strokeStyle=color;ctx.lineWidth=size;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
      lx=x;ly=y;
    });
    const stop=()=>drawing=false;
    cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
    win.body.querySelector('[data-a=save]').addEventListener('click',()=>{
      cv.toBlob(async blob=>{
        if(!blob)return;
        const d=new Date(),p=n=>String(n).padStart(2,'0');
        const name=`绘图-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
        try{
          const out=await fs.uniquePath('/Pictures',name);
          await fs.writeFile(out,blob);
          toast('已保存到 '+out,'ok');notifyFs('/Pictures');
        }catch(e){toast('保存失败：'+e.message,'err');}
      },'image/png');
    });
    win.onClose=()=>ro.disconnect();
    return win;
  }
};

          <div class="bar" style="margin-bottom:8px"><i style="width:0;background:var(--amber)"></i></div>

          <button class="btn" data-a="persist" style="margin-left:auto">申请持久化</button></div></div>
          <div class="st-sec"><h3>占用分布</h3><div class="desc">各顶层目录的实际体积（递归统计，不含本地挂载）。</div>
          <div class="bar ubar" style="margin-bottom:10px"></div><div class="ulist"></div></div>
          <div class="st-sec"><h3>危险区</h3><div class="desc">清空 OPFS / IndexedDB 中的全部虚拟文件并恢复出厂状态。本地挂载的真实文件不受影响。</div>
          <button class="btn danger" data-a="reset">${ic('warn',14)} 一键重置系统</button></div>`;
        body.querySelector('[data-a=persist]').addEventListener('click',async()=>{
          if(navigator.storage&&navigator.storage.persist){
            const ok=await navigator.storage.persist();
            toast(ok?'已获得持久化存储授权':'浏览器未授予持久化','ok');
          }else toast('当前环境不支持','err');
        });
        body.querySelector('[data-a=reset]').addEventListener('click',async()=>{
          const ok=await askConfirm('一键重置','将删除全部虚拟文件、壁纸与系统设置，且不可恢复。确认重置？',true,'全部清除');
          if(!ok)return;
          const d=toast('正在清除…');
          try{
            for(const e of await fs.readdir('/')){try{await fs.rm('/'+e.name);}catch(err){}}
            try{localStorage.clear();}catch(err){}
            try{indexedDB.deleteDatabase('amberos-fs');}catch(err){}
            try{indexedDB.deleteDatabase('amberos-kv');}catch(err){}
            document.cookie='amber_seeded=;max-age=0;path=/';
            d();location.reload();
          }catch(e){d();toast('重置失败：'+e.message,'err');}
        });
        (async()=>{
          if(navigator.storage&&navigator.storage.estimate){
            try{
              const est=await navigator.storage.estimate();
              const pct=est.quota?Math.min(100,est.usage/est.quota*100):0;
              const fill=body.querySelector('.bar i');if(fill)fill.style.width=Math.max(.5,pct)+'%';
              const lb=body.querySelector('.est-label');
              if(lb)lb.textContent=`已用 ${fmtSize(est.usage)} / 配额 ${fmtSize(est.quota)}（${pct.toFixed(2)}%）`;
            }catch(e){}
          }else{const lb=body.querySelector('.est-label');if(lb)lb.textContent='当前环境不支持 storage.estimate()';}
          /* 目录分布 */
          let tops=[];try{tops=(await fs.readdir('/')).filter(e=>e.kind==='dir'&&e.name!=='mnt');}catch(e){}
          const sizes=[];let total=0;
          for(const e of tops){const s=await fs.usage('/'+e.name);sizes.push({name:e.name,size:s});total+=s;}
          sizes.sort((a,b)=>b.size-a.size);
          const ubar=body.querySelector('.ubar'),ul=body.querySelector('.ulist');

            ul.appendChild(el(`<div class="urow"><span class="udot" style="background:${c}"></span><span class="un">/${esc(s.name)}</span><span class="uv">${fmtSize(s.size)}${total?` · ${(total?s.size/total*100:0).toFixed(1)}%`:''}</span></div>`));
          });
          if(!sizes.length)ul.appendChild(el('<div class="urow"><span class="un" style="color:var(--faint)">暂无数据</span></div>'));
        })();
      }
      else{
        body.innerHTML=`<div class="st-sec" style="text-align:center;padding-top:26px">

          <div class="urow"><span class="un">CodeMirror</span><span class="uv">${window.CodeMirror?'已加载':'未加载（已降级纯文本）'}</span></div>
          <div class="urow"><span class="un">V86 虚拟机</span><span class="uv">${window.V86?'已加载':'未加载'}</span></div>
          <div class="urow"><span class="un">分辨率</span><span class="uv">${innerWidth}×${innerHeight}</span></div></div>
          <div class="st-sec"><h3>架构</h3><div class="desc">单文件 Web OS · 零后端 · OPFS 持久化主存 + IndexedDB 降级 + localStorage 状态镜像 + Cookie 引导标记。本地文件夹通过 File System Access API 以统一 fs 接口挂载于 /mnt/local。</div></div>`;
      }
    }
    win.body.querySelectorAll('.st-tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
    show(typeof tab==='string'?tab:'appearance');
    return win;
  }
};

    const win=createWindow({title:'虚拟机',icon:'chip',app:'vm',width:820,height:600});
    vmWin=win;
    let emulator=null,pendingFile=null;
    win.body.innerHTML=`<div class="vmw">
      <div class="vm-bar">
        <button class="btn" data-a="pick">${ic('upload',14)} 选择镜像 (.iso / .img)</button>
        <span class="vm-file" style="font-family:var(--mono);font-size:11px;color:var(--dim)">未选择</span>
        <select class="inp" data-a="mem" style="width:auto;padding:5px 8px;font-size:12px">
          <option value="33554432">内存 32 MB</option>
          <option value="67108864" selected>内存 64 MB</option>
          <option value="134217728">内存 128 MB</option>
        </select>
        <button class="btn pri" data-a="start" disabled>${ic('play',13)} 启动</button>
        <button class="btn" data-a="stop" disabled>停止</button>
        <input type="file" id="os_image" accept=".iso,.img,.bin" hidden>
      </div>
      <div class="vm-stage">
        <div class="vm-hint">${ic('chip',46,1.2)}通过 V86 (x86 模拟器) 在浏览器中启动真实操作系统。<br>
        请选择本地的 .iso 光盘镜像或 .img 软盘/硬盘镜像（如 FreeDOS、TinyCore Linux）。<br>
        镜像不会上传，全部在本地内存中运行。</div>
        <div id="screen_container" hidden>
          <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
          <canvas style="display: none"></canvas>
        </div>
      </div></div>`;
    const fileLb=win.body.querySelector('.vm-file'),bStart=win.body.querySelector('[data-a=start]'),
      bStop=win.body.querySelector('[data-a=stop]'),hint=win.body.querySelector('.vm-hint'),
      scr=win.body.querySelector('#screen_container'),inp=win.body.querySelector('#os_image');
    win.body.querySelector('[data-a=pick]').addEventListener('click',()=>inp.click());
    inp.addEventListener('change',e=>{
      const file=e.target.files[0];
      if(!file)return;
      pendingFile=file;
      fileLb.textContent=file.name+' ('+fmtSize(file.size)+')';
      bStart.disabled=false;
    });
    function start(){
      if(!pendingFile)return;
      const VC=window.V86||window.V86Starter;
      if(!VC){toast('V86 引擎未能从 CDN 加载，请检查网络','err');return;}
      hint.hidden=true;scr.hidden=false;
      const mem=+win.body.querySelector('[data-a=mem]').value;
      const cfg={
        wasm_path:"https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
        memory_size:mem,
        vga_memory_size:2*1024*1024,
        screen_container:scr,
        bios:{url:"https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin"},
        vga_bios:{url:"https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin"},
        autostart:true
      };
      if(/\.iso$/i.test(pendingFile.name))cfg.cdrom={buffer:pendingFile};
      else if(pendingFile.size<=2949120)cfg.fda={buffer:pendingFile};
      else cfg.hda={buffer:pendingFile};
      try{
        emulator=new VC(cfg);
        bStart.disabled=true;bStop.disabled=false;
        toast('虚拟机启动中…','ok');
      }catch(e){toast('启动失败：'+e.message,'err');hint.hidden=false;scr.hidden=true;}
    }
    bStart.addEventListener('click',start);
    bStop.addEventListener('click',()=>{
      if(emulator){try{emulator.destroy();}catch(e){}emulator=null;}
      bStop.disabled=true;bStart.disabled=!pendingFile;
      scr.hidden=true;hint.hidden=false;
    });
    win.onClose=()=>{if(emulator){try{emulator.destroy();}catch(e){}}vmWin=null;};
    /* 从 VFS 中的镜像启动 */
    if(typeof vfsPath==='string'){
      (async()=>{
        try{
          const f=await fs.readFile(vfsPath);
          pendingFile=new File([f],basename(vfsPath));
          fileLb.textContent=basename(vfsPath)+' ('+fmtSize(f.size)+')';
          bStart.disabled=false;
        }catch(e){toast(e.message,'err');}
      })();
    }
    return win;
  }
};

  if(seeded)return;
  try{
    if(!(await fs.exists('/Desktop/欢迎.md'))){
      await fs.writeFile('/Desktop/欢迎.md',
`# 欢迎使用 琥珀 OS

这是一个完全运行在浏览器里的桌面操作系统。

## 你可以尝试：
- 把电脑里的文件直接 **拖进桌面** —— 它们会被写入 OPFS 持久化保存
- 把桌面上的文件 **拖出浏览器** 到物理桌面（反向导出）
- 右键桌面 → 新建文件夹 / 上传文件 / 更换壁纸
- 双击「示例页面.html」体验 代码编辑 + 实时预览 + 浏览器联动
- 在「文件」中挂载本地真实文件夹（/mnt/local）
- 拖入 .zip / .tar.gz / .7z 压缩包并右键解压

所有数据刷新后仍在 —— 这就是 OPFS 的力量。`);
    }
    if(!(await fs.exists('/Desktop/示例页面.html'))){
      await fs.writeFile('/Desktop/示例页面.html',
`<!DOCTYPE html>

    if(!(await fs.exists('/Documents/示例数据.csv'))){
      await fs.writeFile('/Documents/示例数据.csv',
'名称,类别,数量,单价\n琥珀原石,矿物,12,380\n青瓷茶盏,器物,4,1200\n竹简,文献,33,90\n墨锭,文房,8,210\n绢本设色,书画,2,8800');
    }
    setCookie('amber_seeded','1');
    try{localStorage.setItem('amber_seeded','1');}catch(e){}

async function boot(){
  const msg=t=>{const m=$('#bootMsg');if(m)m.textContent=t;};
  try{
    msg('正在初始化文件系统…');
    const mode=await fs.init();
    msg('文件系统就绪：'+mode);
    await ensureDefaults();
    await loadState();
    await applyWallpaper();
    buildShell();
    setupDesktop();
    await renderDesktop();
    msg('就绪');
    await sleep(420);
  }catch(e){
    console.error(e);
    msg('启动出错：'+e.message+'（已尽力降级）');
    try{buildShell();setupDesktop();}catch(e2){}
    await sleep(900);
  }
  $('#boot').classList.add('off');
  if(fs.mode!=='OPFS')toast('OPFS 不可用，已降级到 '+fs.mode,'err');
  /* 提示重新挂载上次的本地文件夹（FSA 权限刷新后失效） */
  try{
    const saved=await kv.get('mounts');
    if(saved&&saved.length&&window.showDirectoryPicker){
      toast(`上次挂载了 ${saved.length} 个本地文件夹，需要重新授权`,'info',{label:'重新挂载',fn:async()=>{
        await kv.set('mounts',[]);
        let n=0;
        for(const m of saved){
          try{
            if(m.handle&&m.handle.requestPermission){
              const p=await m.handle.requestPermission({mode:'readwrite'});
              if(p==='granted'){await fs.mountLocal(m.handle);n++;}
            }
          }catch(e){}
        }
        toast(n?`已重新挂载 ${n} 个文件夹`:'未获得授权',n?'ok':'err');
      }});
    }
  }catch(e){}
}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',boot);
else boot();

</script>
