<style>
/* ============================================================
   REFRACTA · 折光系统  设计语言："棱镜断层 / Prismatic Strata"
   基材 = 黑曜石，光学 = 折射青 + 虹粉 + 琥珀；无 emoji，全 SVG。
   ============================================================ */
:root{
  --f-display:'Syne','Noto Sans SC',sans-serif;
  --f-ui:'Noto Sans SC','Syne',sans-serif;
  --f-mono:'Martian Mono','Noto Sans SC',monospace;
  --bg-0:#06070d; --bg-1:#0b0d16; --bg-2:#111524; --bg-3:#182036;
  --glass:rgba(14,17,29,.74); --glass-2:rgba(20,25,42,.62); --glass-3:rgba(28,34,56,.5);
  --ink:#e9edff; --ink-2:#b9c2e6; --dim:#7f89b3; --dim-2:#5b6488;
  --line:rgba(150,170,255,.14); --line-2:rgba(150,170,255,.28); --line-3:rgba(255,255,255,.06);
  --a1:#46f0c0; --a1-d:#12b892; --a1-g:rgba(70,240,192,.22);
  --a2:#ff4f7e; --a2-g:rgba(255,79,126,.2);
  --a3:#ffd24a; --a3-g:rgba(255,210,74,.18);
  --a4:#8f6bff;
  --ok:#5ce8a8; --warn:#ffcf5c; --err:#ff6b81;
  --sh-1:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 50px -18px rgba(0,0,0,.85);
  --sh-2:0 0 0 1px rgba(255,255,255,.04) inset, 0 30px 70px -20px rgba(0,0,0,.9);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --tb-h:54px; --tbar:34px;
  --sp:clamp(10px,1.4vw,18px);
  --fs:14px;
  --ease:cubic-bezier(.22,.78,.24,1);
  --ease-2:cubic-bezier(.6,-0.28,.34,1.28);
}
html[data-theme="light"]{
  --bg-0:#e9ecf6; --bg-1:#f4f6fd; --bg-2:#ffffff; --bg-3:#e6eaf7;
  --glass:rgba(252,253,255,.78); --glass-2:rgba(255,255,255,.66); --glass-3:rgba(233,238,252,.6);
  --ink:#131728; --ink-2:#3b4260; --dim:#656e91; --dim-2:#8b93b3;
  --line:rgba(30,40,90,.14); --line-2:rgba(30,40,90,.26); --line-3:rgba(0,0,0,.05);
  --a1:#0aa885; --a1-d:#087a61; --a1-g:rgba(10,168,133,.14);
  --a2:#e0335f; --a3:#c98a00;
  --sh-1:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -20px rgba(30,40,90,.45);
  --sh-2:0 0 0 1px rgba(255,255,255,.6) inset, 0 30px 60px -24px rgba(30,40,90,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg-0);color:var(--ink);
  font-family:var(--f-ui);font-size:var(--fs);line-height:1.45;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation:none!important;transition:none!important}
::selection{background:var(--a1);color:#04120e}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--a1)}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.ic.fill{fill:currentColor;stroke:none}
svg.ic.big{width:26px;height:26px}
svg.ic.xl{width:38px;height:38px;stroke-width:1.2}
svg.ic.sm{width:14px;height:14px}
.mono{font-family:var(--f-mono);letter-spacing:-.02em}
.disp{font-family:var(--f-display);letter-spacing:.02em}
.hud{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.nowrap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden{display:none!important}
.flex{display:flex;align-items:center;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.wrap{flex-wrap:wrap}

/* ---------- 壁纸 / 环境 ---------- */
#wallpaper{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
  transition:opacity .6s var(--ease), filter .6s var(--ease);}
#wallpaper::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 0%,transparent 30%,rgba(0,0,0,.45) 100%);
  pointer-events:none}
.wp-w{position:absolute;inset:0}
.wp-strata{background:
  radial-gradient(60% 45% at 12% 8%,rgba(70,240,192,.30),transparent 60%),
  radial-gradient(50% 40% at 88% 12%,rgba(255,79,126,.26),transparent 62%),
  radial-gradient(70% 60% at 50% 110%,rgba(143,107,255,.30),transparent 60%),
  linear-gradient(160deg,#070810 0%,#0d1024 45%,#05060c 100%)}
.wp-tide{background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 34px),
  radial-gradient(80% 60% at 20% 20%,rgba(70,240,192,.22),transparent 65%),
  radial-gradient(60% 50% at 80% 80%,rgba(255,210,74,.18),transparent 60%),
  linear-gradient(200deg,#04100f,#071026 60%,#05070e)}
.wp-amber{background:
  conic-gradient(from 210deg at 70% 12%,rgba(255,210,74,.20),transparent 25%,rgba(255,79,126,.18) 55%,transparent 80%),
  radial-gradient(90% 70% at 10% 90%,rgba(143,107,255,.26),transparent 62%),
  linear-gradient(150deg,#0a0710,#150c18 55%,#07060b)}
.wp-slate{background:
  linear-gradient(0deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/100% 46px,
  linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/46px 100%,
  radial-gradient(70% 60% at 80% 10%,rgba(70,240,192,.16),transparent 60%),
  linear-gradient(170deg,#080a12,#0c1420 60%,#06070d)}
.wp-paper{background:linear-gradient(150deg,#eef1fa,#dfe4f4 55%,#eef1fa)}
html[data-theme="light"] .wp-strata{filter:invert(.92) hue-rotate(150deg) saturate(.9)}
html[data-theme="light"] .wp-tide{filter:invert(.93) hue-rotate(140deg)}
html[data-theme="light"] .wp-amber{filter:invert(.93) hue-rotate(300deg)}
html[data-theme="light"] .wp-slate{filter:invert(.94) saturate(.7)}
#wallpaper > img{width:100%;height:100%;object-fit:cover;display:block}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.32;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.35) .5px,transparent .5px);background-size:3px 3px}

/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:var(--r-s);
  background:var(--glass-2);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
  font-size:12.5px;position:relative;overflow:hidden;transition:.18s var(--ease);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--line-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14),transparent 65%);
  transform:translateX(-120%);transition:transform .55s var(--ease)}
.btn:hover::after{transform:translateX(120%)}
.btn.primary{background:linear-gradient(180deg,rgba(70,240,192,.22),rgba(70,240,192,.08));border-color:var(--a1);color:#dffff6}
html[data-theme="light"] .btn.primary{color:#064a3c;background:linear-gradient(180deg,rgba(10,168,133,.18),rgba(10,168,133,.06))}
.btn.danger{border-color:rgba(255,107,129,.5);color:#ffd8df}
.btn.danger:hover{border-color:var(--err);background:rgba(255,107,129,.14)}
.btn.on{background:linear-gradient(180deg,rgba(70,240,192,.2),rgba(70,240,192,.05));border-color:var(--a1);color:#dffff6}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.icbtn{padding:6px 8px}
.btn.tiny{padding:3px 7px;font-size:11.5px;gap:5px;border-radius:5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--glass-3);border-color:var(--line)}
.seg{display:inline-flex;background:var(--glass-2);border:1px solid var(--line);border-radius:var(--r-s);padding:2px}
.seg button{background:transparent;border:0;padding:4px 9px;border-radius:4px;cursor:pointer;color:var(--dim);font-size:12px;display:flex;gap:5px;align-items:center}
.seg button.on{background:var(--glass-3);color:var(--ink);box-shadow:0 0 0 1px var(--line-2) inset}
.field{background:var(--glass-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 9px;color:var(--ink);outline:none;min-width:0;transition:.18s}
.field:focus{border-color:var(--a1);box-shadow:0 0 0 3px var(--a1-g)}
select.field{padding-right:6px;cursor:pointer}
select.field option{background:var(--bg-2);color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--a1),var(--a4))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--bg-1);border:2px solid var(--a1);box-shadow:0 0 10px var(--a1-g)}
input[type=checkbox]{appearance:none;width:32px;height:18px;border-radius:10px;background:var(--glass-3);border:1px solid var(--line-2);position:relative;cursor:pointer;transition:.2s}
input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--dim);transition:.2s var(--ease-2)}
input[type=checkbox]:checked{background:var(--a1-g);border-color:var(--a1)}
input[type=checkbox]:checked::after{left:16px;background:var(--a1)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;background:var(--glass-3);border:1px solid var(--line);font-size:11px;color:var(--ink-2)}
.tag-k{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--glass-3);border:1px solid var(--line);color:var(--dim)}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--a1);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:6px;border-radius:4px;background:var(--glass-3);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a4));transition:width .3s var(--ease)}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;inset:0 0 var(--tb-h) 0;z-index:2;overflow:hidden;touch-action:manipulation}
#iconLayer{position:absolute;inset:0}
.dicon{position:absolute;width:86px;padding:7px 4px 6px;border-radius:var(--r-m);display:flex;flex-direction:column;
  align-items:center;gap:4px;cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none;
  transition:left .2s var(--ease),top .2s var(--ease),transform .22s var(--ease),opacity .3s var(--ease),background .18s,box-shadow .18s;}
.dicon .gl{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(0,0,0,.9)}
.dicon .gl::after{content:'';position:absolute;inset:0;border-radius:12px;background:conic-gradient(from 140deg,transparent,rgba(70,240,192,.25),transparent 55%);opacity:0;transition:.3s}
.dicon:hover .gl::after{opacity:1}
.dicon .nm{font-size:11.5px;line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;text-shadow:0 1px 3px rgba(0,0,0,.8)}
html[data-theme="light"] .dicon .nm{text-shadow:0 1px 2px rgba(255,255,255,.9)}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:linear-gradient(180deg,var(--a1-g),rgba(70,240,192,.05));box-shadow:0 0 0 1px var(--a1) inset}
.dicon.sel .nm{color:#dffff6}
html[data-theme="light"] .dicon.sel .nm{color:#054a3a}
.dicon.dragging{opacity:.4}
.dicon.landing{animation:land .34s var(--ease-2)}
@keyframes land{0%{transform:scale(1.14)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.dicon .gl img{width:100%;height:100%;object-fit:cover;border-radius:11px}
#iconLayer .stagger{animation:iconIn .5s var(--ease) both}
@keyframes iconIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
#dtCtxHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3}
.dropglow{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:.25s;
  box-shadow:0 0 0 2px var(--a1) inset, 0 0 60px -10px var(--a1) inset}
#desktop.overdrop .dropglow{opacity:1}

/* ---------- 窗口 ---------- */
#windows{position:fixed;inset:0 0 var(--tb-h) 0;z-index:6;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:280px;min-height:180px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-1);
  animation:winIn .26s var(--ease) both;will-change:transform}
@keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.975);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.win.closing{animation:winOut .18s var(--ease) both}
@keyframes winOut{to{opacity:0;transform:translateY(8px) scale(.97);filter:blur(5px)}}
.win.active{border-color:var(--line-2);box-shadow:var(--sh-2)}
.win.active::before{content:'';position:absolute;inset:0;border-radius:var(--r-l);padding:1px;pointer-events:none;
  background:conic-gradient(from 200deg,rgba(70,240,192,.55),rgba(255,79,126,.35),rgba(143,107,255,.5),rgba(70,240,192,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.win.drag,.win.rzding{transition:none}
.win.mini{transition:transform .24s var(--ease),opacity .24s var(--ease);opacity:0;transform:scale(.4) translateY(46vh)}
.win.max{border-radius:0}
.win.full{border-radius:0;z-index:9999!important}
.win-cap{height:var(--tbar);flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 8px 0 11px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  border-bottom:1px solid var(--line);cursor:default;user-select:none;touch-action:none}
.win-cap .ttl{font-family:var(--f-display);font-size:12.5px;font-weight:700;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-cap .sub{font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
.wbtns{display:flex;gap:4px;align-items:center;margin-left:4px}
.wbtn{width:26px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;transition:.16s}
.wbtn:hover{background:var(--glass-3);border-color:var(--line);color:var(--ink)}
.wbtn.close:hover{background:rgba(255,79,126,.22);border-color:var(--a2);color:#fff}
.win-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rz{position:absolute;z-index:5;touch-action:none}
.rz.n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz.ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}
.rz.sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}
.rz.se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
.win.max .rz,.win.full .rz{display:none}
#snapPrev{position:fixed;z-index:5;pointer-events:none;border:1px solid var(--a1);border-radius:var(--r-l);
  background:linear-gradient(180deg,var(--a1-g),rgba(70,240,192,.04));opacity:0;transition:all .16s var(--ease);backdrop-filter:blur(2px)}
#snapPrev.on{opacity:1}
.mask-load{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 40%,rgba(8,10,18,.86),rgba(4,5,10,.95));
  backdrop-filter:blur(4px)}
.mask-load .lg{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{width:44px;height:44px;border-radius:50%;position:relative;background:conic-gradient(var(--a1),var(--a4),var(--a2),var(--a1));
  animation:spin 1.4s linear infinite;display:grid;place-items:center}
.ring::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--bg-1)}
.ring i{position:relative;z-index:2;font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--a1)}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:900;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:linear-gradient(180deg,rgba(10,12,20,.62),rgba(6,8,14,.86));
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  border-top:1px solid var(--line);}
html[data-theme="light"] #taskbar{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(240,243,252,.9))}
#taskbar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--a1),var(--a4),var(--a2),transparent);opacity:.55}
#startBtn{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;border-radius:11px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(70,240,192,.16),rgba(143,107,255,.12));cursor:pointer;transition:.2s var(--ease)}
#startBtn:hover{transform:translateY(-1px);border-color:var(--a1);box-shadow:0 10px 24px -14px var(--a1)}
#startBtn.on{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1) inset}
#startBtn .lo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--bg-0);border:1px solid var(--line-2);
  position:relative;overflow:hidden}
#startBtn .lo svg{width:16px;height:16px;stroke:var(--a1)}
#startBtn .lo::after{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--a1-g),transparent 40%);animation:spin 6s linear infinite}
#startBtn b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em;font-weight:800}
#tasks{display:flex;gap:6px;flex:1 1 auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:100%;align-items:center}
#tasks::-webkit-scrollbar{height:0}
.tbtn{display:flex;align-items:center;gap:7px;padding:0 10px;height:36px;max-width:190px;border-radius:9px;border:1px solid transparent;
  background:var(--glass-3);color:var(--ink-2);cursor:pointer;position:relative;transition:.18s var(--ease);flex:0 0 auto}
.tbtn span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn:hover{background:var(--glass-2);border-color:var(--line);color:var(--ink)}
.tbtn.active{border-color:var(--line-2);background:linear-gradient(180deg,var(--a1-g),transparent);color:var(--ink)}
.tbtn.active::after{content:'';position:absolute;left:20%;right:20%;bottom:-1px;height:2px;border-radius:2px;background:var(--a1);box-shadow:0 0 8px var(--a1)}
.tbtn.mini{opacity:.62}
.tbtn svg{width:16px;height:16px}
.tclose{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:5px;display:none;place-items:center;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.tbtn:hover .tclose{display:grid}
#tray{display:flex;align-items:center;gap:6px}
.tray-btn{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.tray-btn:hover{background:var(--glass-2);border-color:var(--line)}
#clock{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em;line-height:1.15;text-align:right;color:var(--ink)}
#clock small{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.08em}
#peek{position:fixed;z-index:899;pointer-events:none;opacity:0;transform:translateY(8px);transition:.2s var(--ease);
  background:var(--glass);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-2);padding:8px;min-width:190px}
#peek.on{opacity:1;transform:none}
#peek .ph{font-size:11.5px;color:var(--ink);margin-bottom:6px;display:flex;gap:7px;align-items:center}
#peek .pv{height:96px;border-radius:8px;background:linear-gradient(140deg,var(--bg-2),var(--bg-0));display:grid;place-items:center;border:1px solid var(--line);position:relative;overflow:hidden}
#peek .pv::after{content:'';position:absolute;inset:-50%;background:conic-gradient(from 90deg,transparent,rgba(70,240,192,.16),transparent 45%);animation:spin 8s linear infinite}

/* ---------- 开始菜单 ---------- */
#startMenu{position:fixed;left:10px;bottom:calc(var(--tb-h) + 10px);width:min(660px,calc(100vw - 20px));max-height:min(74vh,620px);z-index:905;
  background:var(--glass);backdrop-filter:blur(28px);border:1px solid var(--line-2);border-radius:var(--r-l);
  box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;
  transform:translateY(16px) scale(.98);transition:.24s var(--ease);transform-origin:bottom left}
#startMenu.on{opacity:1;pointer-events:auto;transform:none}
.sm-hd{padding:12px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line)}
.sm-bd{overflow:auto;padding:12px;flex:1 1 auto}
.sm-sec{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--dim);margin:4px 4px 9px;display:flex;justify-content:space-between}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ap-tile{padding:11px 6px;border-radius:11px;border:1px solid transparent;background:var(--glass-3);cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:.18s var(--ease)}
.ap-tile:hover{transform:translateY(-2px);border-color:var(--line-2);background:var(--glass-2)}
.ap-tile .gl{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--line)}
.ap-tile i{font-style:normal;font-size:11.5px;line-height:1.2}
.sm-ft{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sm-anim{animation:fadeUp .34s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- 右键菜单 ---------- */
.ctx{position:fixed;z-index:1000;min-width:196px;padding:5px;background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--sh-2);animation:ctxIn .16s var(--ease) both;max-height:82vh;overflow:auto}
@keyframes ctxIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.ctx .ci{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink-2);position:relative}
.ctx .ci:hover{background:linear-gradient(90deg,var(--a1-g),rgba(70,240,192,.04));color:var(--ink)}
.ctx .ci.dgr:hover{background:rgba(255,107,129,.16);color:#fff}
.ctx .ci>span.k{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.ctx .sep{height:1px;margin:5px 6px;background:var(--line)}
.ctx .hd{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim-2);padding:6px 9px 4px}
.ctx .ci .sub{position:absolute;left:100%;top:-6px;margin-left:4px;display:none;background:var(--glass);border:1px solid var(--line-2);
  border-radius:11px;padding:5px;min-width:180px;box-shadow:var(--sh-2);max-height:60vh;overflow:auto;z-index:2}
.ctx .ci:hover .sub{display:block}
.ctx .ci.hasSub::after{content:'';border:4px solid transparent;border-left-color:var(--dim);margin-left:auto}

/* ---------- 对话框 / 提示 ---------- */
#ovl{position:fixed;inset:0;z-index:1100;pointer-events:none;display:grid;place-items:center}
.dlg{pointer-events:auto;width:min(460px,92vw);background:var(--glass);backdrop-filter:blur(26px);border:1px solid var(--line-2);
  border-radius:var(--r-l);box-shadow:var(--sh-2);overflow:hidden;animation:winIn .22s var(--ease) both}
.dlg .dh{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:13.5px}
.dlg .db{padding:15px;display:flex;flex-direction:column;gap:11px;max-height:66vh;overflow:auto}
.dlg .df{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toastRoot{position:fixed;right:12px;bottom:calc(var(--tb-h) + 12px);z-index:1200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:9px;align-items:flex-start;max-width:min(360px,86vw);padding:10px 12px;border-radius:11px;
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line-2);box-shadow:var(--sh-1);animation:fadeUp .26s var(--ease) both}
.toast.err{border-color:rgba(255,107,129,.5)}
.toast.ok{border-color:var(--a1)}
.toast .t{font-size:12.5px;line-height:1.4}
.toast .d{font-size:11.5px;color:var(--dim);margin-top:2px;word-break:break-all}

/* ---------- 启动遮罩（真实初始化，无假动画） ---------- */
#boot{position:fixed;inset:0;z-index:2000;background:radial-gradient(60% 50% at 50% 42%,#0b0f1c,#04050a 75%);
  display:grid;place-items:center;transition:opacity .35s var(--ease)}
#boot.gone{opacity:0;pointer-events:none}
#boot .bx{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#boot h1{font-family:var(--f-display);font-size:clamp(24px,6vw,40px);margin:0;letter-spacing:.16em;font-weight:800;
  background:linear-gradient(100deg,#fff,var(--a1) 40%,var(--a4) 70%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .st{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.12em;height:16px}
#boot .er{max-width:min(560px,88vw);font-size:11.5px;color:var(--warn);line-height:1.5}

/* ---------- 应用通用框架 ---------- */
.pane{display:flex;flex-direction:column;height:100%;min-height:0;background:linear-gradient(180deg,rgba(8,10,18,.5),rgba(8,10,18,.72))}
html[data-theme="light"] .pane{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(246,248,255,.8))}
.abar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.astatus{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:4px 10px;border-top:1px solid var(--line);
  font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em;flex-wrap:wrap}
.abody{flex:1 1 auto;min-height:0;display:flex;position:relative;overflow:hidden}
.scroll{overflow:auto;overscroll-behavior:contain}
.empty-note{padding:40px 20px;text-align:center;color:var(--dim);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- 文件管理器 ---------- */
.fm{display:flex;height:100%;min-height:0;width:100%;position:relative}
.fm-side{width:214px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.fm-side .sh{padding:9px 11px 6px;display:flex;align-items:center;justify-content:space-between}
.snav{overflow:auto;padding:4px 6px 12px;flex:1 1 auto}
.sitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2);position:relative}
.sitem:hover{background:var(--glass-3);color:var(--ink)}
.sitem.on{background:linear-gradient(90deg,var(--a1-g),transparent);color:var(--ink);box-shadow:inset 2px 0 0 var(--a1)}
.sitem .size{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.sitem .ej{opacity:0}
.sitem:hover .ej{opacity:1}
.fm-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative}
.fm-path{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--glass-3)}
.crumb{display:flex;align-items:center;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.crumb::-webkit-scrollbar{height:0}
.crumb button{background:transparent;border:0;color:var(--ink-2);cursor:pointer;padding:4px 7px;border-radius:6px;font-size:12px;white-space:nowrap}
.crumb button:hover{background:var(--glass-2);color:var(--ink)}
.crumb b{color:var(--dim);font-weight:400}
.fm-vp{flex:1 1 auto;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.fm-inner{position:relative;min-height:100%}
.fm-head{position:sticky;top:0;z-index:6;display:grid;align-items:center;height:28px;background:linear-gradient(180deg,var(--bg-1),rgba(11,13,22,.92));
  border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--dim);cursor:default;user-select:none}
html[data-theme="light"] .fm-head{background:linear-gradient(180deg,#eef1fa,rgba(238,241,250,.94))}
.fm-head .hc{padding:0 8px;height:100%;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative}
.fm-head .hc:hover{color:var(--ink);background:var(--glass-3)}
.fm-head .hc .rs{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:3}
.fm-head .hc .rs:hover::after{content:'';position:absolute;left:3px;top:2px;bottom:2px;width:1px;background:var(--a1);box-shadow:0 0 6px var(--a1)}
.fm-head .hc.sortasc .ar::after{content:'▲'} .fm-head .hc.sortdesc .ar::after{content:'▼'}
.fm-head .hc .ar{font-size:8px;color:var(--a1)}
.fm-headspacer,.fm-newspacer{grid-column:span 99;background:transparent}
.fm-rows{position:relative}
.frow{display:grid;align-items:center;height:30px;position:relative;cursor:default;user-select:none;-webkit-user-select:none;transition:background .12s}
.frow .fc{padding:0 8px;height:100%;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px}
.frow .fc.nm{gap:9px}
.frow .fc.nm i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.frow .fc .sub{font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.frow:hover{background:rgba(255,255,255,.045)}
html[data-theme="light"] .frow:hover{background:rgba(20,30,70,.045)}
.frow.sel{background:linear-gradient(90deg,var(--a1-g),rgba(70,240,192,.03))}
.frow.sel .fc{color:var(--ink)}
.frow.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--a1)}
.frow.drop-on{background:var(--a2-g);box-shadow:inset 0 0 0 1px var(--a2)}
.frow .thumb{width:20px;height:20px;border-radius:4px;object-fit:cover;border:1px solid var(--line)}
.frow .ico{width:19px;height:19px;display:grid;place-items:center}
.frow input.rn{width:100%;background:var(--bg-2);border:1px solid var(--a1);color:var(--ink);padding:1px 5px;border-radius:4px;font-size:12.5px}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,104px),1fr));gap:8px;padding:12px}
.tile{border-radius:11px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  border:1px solid transparent;transition:.16s var(--ease);text-align:center;user-select:none;position:relative}
.tile:hover{background:var(--glass-3);border-color:var(--line)}
.tile.sel{background:linear-gradient(180deg,var(--a1-g),transparent);border-color:var(--a1)}
.tile .pv{width:100%;aspect-ratio:1/1;border-radius:9px;background:var(--glass-3);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.tile .pv img{width:100%;height:100%;object-fit:cover}
.tile i{font-style:normal;font-size:11.5px;line-height:1.3;max-height:2.6em;overflow:hidden;word-break:break-all}
.tile .sz{font-family:var(--f-mono);font-size:9.5px;color:var(--dim)}
.viewCols{display:flex;height:100%;overflow-x:auto}
.vcol{min-width:212px;max-width:300px;flex:0 0 auto;border-right:1px solid var(--line);overflow:auto;overscroll-behavior:contain}
.vcol .vh{padding:6px 10px;font-family:var(--f-mono);font-size:10px;color:var(--dim);position:sticky;top:0;background:var(--bg-1);z-index:2;letter-spacing:.1em}
.vrow{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.vrow:hover{background:var(--glass-3)}
.vrow.on{background:linear-gradient(90deg,var(--a1-g),transparent);color:var(--ink)}
.vrow .sz{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.rb{position:absolute;z-index:40;pointer-events:none;border:1px solid var(--a1);background:var(--a1-g);border-radius:3px;display:none;box-shadow:0 0 14px rgba(70,240,192,.3)}
#fmTips{padding:7px 11px;font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.props-k{display:grid;grid-template-columns:88px 1fr;gap:7px 10px;font-size:12.5px}
.props-k b{color:var(--dim);font-weight:400;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding-top:2px}
.dropzone{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:16px;text-align:center;color:var(--dim);font-size:12px}
.dropzone.hot{border-color:var(--a1);background:var(--a1-g);color:var(--ink)}

/* ---------- 编辑器 ---------- */
.edWrap{display:flex;height:100%;min-height:0;width:100%}
.edLeft{display:flex;flex-direction:column;min-width:200px;flex:1 1 60%;min-height:0}
.edSplit{width:7px;flex:0 0 auto;cursor:col-resize;background:linear-gradient(180deg,transparent,var(--line-2),transparent);position:relative}
.edSplit:hover::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:var(--a1);box-shadow:0 0 8px var(--a1)}
.edRight{display:flex;flex-direction:column;min-width:120px;flex:1 1 40%;border-left:1px solid var(--line);min-height:0;background:#05070c;position:relative}
.edRight iframe{flex:1 1 auto;width:100%;border:0;background:#fff}
.CodeMirror{height:100%!important;font-family:var(--f-mono)!important;font-size:13px;line-height:1.55}
.CodeMirror-gutters{border-right:1px solid var(--line)}
.cm-trailingspace{background-image:linear-gradient(45deg,rgba(255,79,126,.35) 25%,transparent 25%,transparent 75%,rgba(255,79,126,.35) 75%)!important;background-size:6px 6px!important;border-bottom:1px dotted var(--err)}
.cm-find-match{background:rgba(255,210,74,.28);outline:1px solid rgba(255,210,74,.6)}
.cm-find-cur{background:var(--a1);color:#04130f;outline:1px solid #fff}
.findbar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,79,126,.09),transparent);flex-wrap:wrap}
.findbar input.field{flex:1 1 130px;min-width:90px;font-family:var(--f-mono);font-size:11.5px;padding:4px 8px}
.langdot{width:7px;height:7px;border-radius:50%;background:var(--a1);box-shadow:0 0 7px var(--a1)}
.edta{width:100%;height:100%;border:0;resize:none;background:transparent;color:var(--ink);padding:12px;outline:none;
  font-family:var(--f-mono);font-size:13px;line-height:1.6;tab-size:2}
.monobtn{border-radius:4px!important;padding:2px 8px!important;font-size:11.5px!important}
.cm-s-material-darker.CodeMirror{background:rgba(6,8,14,.55)!important}

/* ---------- 记事本 / 表格 ---------- */
.np-ta{flex:1 1 auto;min-height:0;width:100%;border:0;resize:none;background:transparent;color:var(--ink);outline:none;padding:14px;
  font-size:14px;line-height:1.7}
.np-ta.num{background-image:linear-gradient(90deg,rgba(150,170,255,.07) 42px,transparent 42px);background-attachment:local}
.ta-table{border-collapse:separate;border-spacing:0;font-size:12.5px;font-family:var(--f-mono)}
.ta-table th,.ta-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;min-width:80px;position:relative;vertical-align:top}
.ta-table th{position:sticky;top:0;background:var(--bg-1);z-index:3;color:var(--dim);font-weight:400;letter-spacing:.08em;font-size:10px;text-align:left}
.ta-table th.rh{left:0;z-index:4}
.ta-table td.rh{position:sticky;left:0;background:var(--bg-1);color:var(--dim);text-align:right;min-width:44px;font-size:10.5px}
.ta-table td[contenteditable]{outline:none}
.ta-table td[contenteditable]:focus{background:var(--a1-g);box-shadow:inset 0 0 0 1px var(--a1)}
.ta-table tr:nth-child(even) td:not(.rh){background:rgba(255,255,255,.016)}

/* ---------- 图片 / 媒体 / 漫画 ---------- */
.iv{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden;background:
  linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%) 0 0/22px 22px,
  linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%) 11px 11px/22px 22px,var(--bg-0)}
.iv img{max-width:100%;max-height:100%;transition:transform .16s var(--ease);transform-origin:center;border-radius:4px;box-shadow:0 24px 60px -30px #000}
.thumbstrip{flex:0 0 auto;display:flex;gap:8px;padding:8px;overflow-x:auto;border-top:1px solid var(--line)}
.thumbstrip .ts{width:64px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:pointer;flex:0 0 auto;background:var(--bg-2)}
.thumbstrip .ts.on{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1)}
.thumbstrip img{width:100%;height:100%;object-fit:cover}
.pl-vis{height:150px;flex:0 0 auto;border-bottom:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg-2),var(--bg-0))}
.pl-vis canvas{width:100%;height:100%;display:block}
.pl-cover{position:absolute;inset:0;display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(90deg,var(--glass),rgba(10,12,20,.6))}
.pl-cover .cv{width:82px;height:82px;border-radius:12px;background:var(--glass-3);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.pl-cover .cv img{width:100%;height:100%;object-fit:cover}
.pl-cover .ti{font-family:var(--f-display);font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis}
video.pl{width:100%;height:100%;background:#000;outline:none}
.pl-list{overflow:auto;flex:1 1 auto;min-height:0}
.plr{display:flex;align-items:center;gap:9px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.plr:hover{background:var(--glass-3)}
.plr.on{background:linear-gradient(90deg,var(--a1-g),transparent);color:var(--ink)}
.plr .t{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.manga-root{flex:1 1 auto;min-height:0;background:#000;overflow-y:auto;overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;
  -webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;position:relative}
.manga-root.grabbing{cursor:grabbing}
.manga-img{display:block;width:100%;max-width:min(100%,900px);height:auto;margin:0 auto;background:#0a0a0a;flex:0 0 auto}
.manga-ph{background:#0d0d0d;width:100%;max-width:min(100%,900px);margin:0 auto;display:grid;place-items:center;color:#666;flex:0 0 auto}
.manga-hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:20px;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14);color:#ddd;font-family:var(--f-mono);font-size:11px;z-index:6;transition:opacity .3s}
.manga-exit{position:fixed;top:12px;right:14px;z-index:10050;width:40px;height:40px;border-radius:50%;display:none;place-items:center;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;opacity:.28;transition:.25s}
.manga-exit:hover{opacity:1;background:rgba(255,79,126,.5)}
body.manga-fs .manga-exit{display:grid}
.win.fs .win-cap{display:none!important}
.manga-fsbar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:5px 9px;background:rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.08);color:#ccc}
body.manga-fs .manga-fsbar{display:none!important}

/* ---------- 计算器 / 画板 / 终端 ---------- */
.calc{padding:12px;display:flex;flex-direction:column;gap:10px;height:100%}
.calc .out{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:right;overflow:hidden}
.calc .out .ex{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);min-height:16px;word-break:break-all}
.calc .out .rs{font-family:var(--f-display);font-size:clamp(24px,5vw,38px);font-weight:800;word-break:break-all;line-height:1.1}
.calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;flex:1 1 auto;min-height:0}
.calc .keys button{border-radius:10px;border:1px solid var(--line);background:var(--glass-3);color:var(--ink);cursor:pointer;
  font-family:var(--f-mono);font-size:15px;transition:.14s var(--ease);min-height:38px}
.calc .keys button:hover{background:var(--glass-2);border-color:var(--line-2);transform:translateY(-1px)}
.calc .keys button.op{color:var(--a3)} .calc .keys button.eq{background:linear-gradient(180deg,var(--a1-g),transparent);border-color:var(--a1);color:#dffff6}
.calc .keys button.fn{font-size:11.5px;color:var(--dim)}
.calc .hist{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);max-height:74px;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
.paint-wrap{position:relative;flex:1 1 auto;min-height:0;display:grid;place-items:center;background:#0a0c14;overflow:auto;padding:10px}
.paint-wrap canvas{background:#fff;box-shadow:0 20px 50px -22px #000;border-radius:6px;touch-action:none;max-width:100%}
.term{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:rgba(3,5,10,.8);color:#cfe6ff;white-space:pre-wrap;word-break:break-all}
.term .in{color:var(--a1)} .term .er{color:var(--err)} .term .ok{color:var(--ok)} .term .dm{color:var(--dim)}
.term-in{display:flex;gap:7px;align-items:center;border-top:1px solid var(--line);padding:7px 10px;font-family:var(--f-mono);font-size:12.5px}
.term-in input{flex:1 1 auto;background:transparent;border:0;outline:none;color:var(--a1);font-family:var(--f-mono);font-size:12.5px}

/* ---------- 浏览器 / 设置 / VM ---------- */
.br-frame{flex:1 1 auto;min-height:0;width:100%;border:0;background:#fff}
#vmscreen{position:relative;background:#000;overflow:hidden;flex:1 1 auto;min-height:0;display:grid;place-items:center}
.v86scr{white-space:pre;font-family:var(--f-mono),monospace;line-height:1;font-size:14px;color:#ddd;margin:0}
#vmscreen canvas{display:block;max-width:100%}
.set-layout{display:flex;height:100%;min-height:0}
.set-nav{width:186px;flex:0 0 auto;border-right:1px solid var(--line);overflow:auto;padding:8px 6px}
.set-nav .si{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.set-nav .si:hover{background:var(--glass-3);color:var(--ink)}
.set-nav .si.on{background:linear-gradient(90deg,var(--a1-g),transparent);color:var(--ink);box-shadow:inset 2px 0 0 var(--a1)}
.set-body{flex:1 1 auto;min-width:0;overflow:auto;padding:16px 18px 40px}
.set-sec{margin-bottom:22px;animation:fadeUp .3s var(--ease) both}
.set-sec h3{font-family:var(--f-display);font-size:14px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.set-sec .hint{color:var(--dim);font-size:11.5px;margin-bottom:11px}
.set-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-3)}
.set-row .lb{width:150px;flex:0 0 auto;font-size:12.5px;color:var(--ink-2)}
.set-row .vl{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wp-choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.wpc{aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative}
.wpc.on{border-color:var(--a1);box-shadow:0 0 0 2px var(--a1-g)}
.wpc span{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.bar-item{margin-bottom:11px}
.bar-item .bi{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);margin-bottom:4px}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch b{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.swatch b.on{border-color:#fff;box-shadow:0 0 0 2px var(--a1)}
.app-toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.atg{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--glass-3)}
.mnt-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--glass-3);margin-bottom:7px}

/* ---------- 移动端 / 触摸 ---------- */
#mobileBar{display:none;position:fixed;top:0;left:0;right:0;height:30px;z-index:940;align-items:center;gap:9px;padding:0 12px;
  background:linear-gradient(180deg,rgba(6,8,14,.9),rgba(6,8,14,.5));backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em}
#mobileBar .g{flex:1}
.dockgrid{display:flex;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none}
body.selMode .frow{cursor:pointer}
.shortcutSheet{pointer-events:auto;width:min(520px,94vw);background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r-l);padding:14px;max-height:70vh;overflow:auto}
body.fs-active{background:#000}
@media (max-width:860px){
  :root{--tb-h:62px}
  #desktop{inset:30px 0 var(--tb-h) 0}
  #windows{inset:30px 0 var(--tb-h) 0}
  #mobileBar{display:flex}
  #taskbar{padding:0 6px;gap:6px}
  #startBtn b{display:none}
  #tasks{flex:1 1 auto}
  .tbtn{max-width:46px;padding:0 8px} .tbtn span{display:none} .tbtn{height:42px}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-left:0;border-right:0}
  .win.max,.win{animation:winUp .24s var(--ease) both}
  @keyframes winUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .fm-side{position:absolute;left:0;top:0;bottom:0;z-index:30;width:230px;transform:translateX(-101%);transition:.24s var(--ease);background:var(--bg-1)}
  .fm.sideOpen .fm-side{transform:none;box-shadow:20px 0 60px -20px #000}
  .set-layout{flex-direction:column} .set-nav{width:100%;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:6px}
  .set-nav .si{white-space:nowrap}
  .edWrap{flex-direction:column} .edSplit{width:auto;height:7px;cursor:row-resize}
  .rz{display:none} .rz.s{display:block}
  .wbtn{width:34px;height:30px}
  .calc .keys button{min-height:46px;font-size:16px}
  #peek{display:none}
  .ap-tile .gl{width:34px;height:34px}
}
@media (max-width:560px){
  .appgrid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
  .dicon{width:74px}
  .props-k{grid-template-columns:74px 1fr}
  .fm-path{padding:5px 7px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.06s!important}}
</style>

/* 3.1 OPFS（源生成文件系统）—— 系统主存储 */
function OPFSBackend(rootHandle) {
  const split = p => normalizePath(p).split('/').filter(Boolean);
  async function dirOf(segs, create) {
    let h = rootHandle;
    for (const s of segs) h = await h.getDirectoryHandle(s, { create: !!create });
    return h;
  }
  async function sizeOf(handle, rec) {
    let total = 0, items = 0;
    for await (const [name, h] of handle.entries()) {
      if (h.kind === 'file') { const f = await h.getFile(); total += f.size; items++; }
      else { const r = await sizeOf(h, rec); total += r.size; items += r.items + 1; }
      if (rec && rec.cancelled) break;
    }
    return { size: total, items };
  }
  return {
    kind: 'opfs', label: '棱镜层', tag: 'OPFS', icon: 'prism-o', writable: true,
    supports: { size: true, mtime: true },
    async list(rel) {
      const h = await dirOf(split(rel), false);
      const out = [];
      for await (const [name, handle] of h.entries()) {
        if (handle.kind === 'directory') out.push({ name, type: 'dir', size: null, mtime: 0 });
        else { const f = await handle.getFile(); out.push({ name, type: 'file', size: f.size, mtime: f.lastModified }); }
      }
      return out;
    },
    async stat(rel) {
      const segs = split(rel); const name = segs.pop();
      const parent = await dirOf(segs, false);
      if (!name) return { name: '/', type: 'dir', size: null, mtime: 0 };
      try { const fh = await parent.getFileHandle(name); const f = await fh.getFile(); return { name, type: 'file', size: f.size, mtime: f.lastModified }; }
      catch (e) { await parent.getDirectoryHandle(name); return { name, type: 'dir', size: null, mtime: 0 }; }
    },
    async read(rel) { const f = await this.fileHandle(rel); return f.getFile(); },
    async fileHandle(rel) {
      const segs = split(rel); const name = segs.pop();
      const parent = await dirOf(segs, false);
      return await parent.getFileHandle(name);
    },
    async write(rel, data) {
      const segs = split(rel); const name = segs.pop();
      const parent = await dirOf(segs, true);
      const fh = await parent.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data instanceof Blob ? data : new Blob([data]));
      await w.close();
    },
    async mkdir(rel) { await dirOf(split(rel), true); },
    async ensureDir(rel) { await dirOf(split(rel), true); },
    async readDirHandle(rel) { return dirOf(split(rel), false); },
    async remove(rel, recursive) {
      const segs = split(rel); const name = segs.pop();
      const parent = await dirOf(segs, false);
      await parent.removeEntry(name, { recursive: !!recursive });
    },
    async rename(oldRel, newRel) {
      // OPFS 原生无 rename：使用 「读取→写入→删除」 保证同后端语义一致
      const st = await this.stat(oldRel);
      const { name: newName } = { name: split(newRel).pop() };
      if (st.type === 'file') {
        const f = await this.read(oldRel);
        await this.write(newRel, f);
        await this.remove(oldRel, false);
      } else {
        const copyDir = async (src, dst) => {
          await this.mkdir(dst);
          for (const e of await this.list(src)) {
            if (e.type === 'dir') await copyDir(src.replace(/\/+$/, '') + '/' + e.name, dst.replace(/\/+$/, '') + '/' + e.name);
            else await this.write(dst.replace(/\/+$/, '') + '/' + e.name, await this.read(src.replace(/\/+$/, '') + '/' + e.name));
          }

        await copyDir(oldRel, newRel);
        await this.remove(oldRel, true);
      }
    },
    async used() { const r = await sizeOf(rootHandle, null); return r.size; },
    async scan(rec) { return sizeOf(rootHandle, rec); }
  };
}

/* 3.2 IndexedDB 后端 —— 结构化封存层 */
function IDBBackend() {
  const DB = 'refracta_fs', ST = 'nodes';
  let dbp = null;
  function open() {
    return new Promise((res, rej) => {
      if (dbp) return res(dbp);
      if (!window.indexedDB) return rej(new Error('IndexedDB 不可用'));
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains(ST)) { const s = d.createObjectStore(ST, { keyPath: 'p' }); s.createIndex('p', 'p'); }
      };
      r.onsuccess = () => { dbp = r.result; res(dbp); };
      r.onerror = () => rej(r.error);
    });
  }
  async function tx(mode, fn) { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(ST, mode); const s = t.objectStore(ST); let out; try { out = fn(s); } catch (e) { rej(e); return; } t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); }
  async function get(rel) { return tx('readonly', s => s.get(normalizePath(rel))); }
  async function put(node) { return tx('readwrite', s => s.put(node)); }
  async function del(rel) { return tx('readwrite', s => s.delete(normalizePath(rel))); }
  async function children(rel) {
    const base = normalizePath(rel) === '/' ? '' : normalizePath(rel);
    const prefix = base + '/';
    return tx('readonly', s => {
      const out = [];
      const rg = IDBKeyRange.bound(prefix, prefix + '\uffff');
      s.openCursor(rg).onsuccess = e => { const c = e.target.result; if (!c) return; const k = c.value.p; const rest = k.slice(prefix.length); if (rest && rest.indexOf('/') < 0) out.push(c.value); c.continue(); };
      return out;
    });
  }
  async function ensureParents(rel) {
    const segs = normalizePath(rel).split('/').filter(Boolean); segs.pop();
    let cur = '';
    for (const s of segs) { cur += '/' + s; const n = await get(cur); if (!n) await put({ p: cur, t: 'dir', m: Date.now() }); }
  }
  async function rmTree(rel) {
    const base = normalizePath(rel);
    await del(base);
    const kids = await children(base);
    for (const k of kids) { if (k.t === 'dir') await rmTree(k.p); else await del(k.p); }
  }
  return {
    kind: 'idb', label: '封存层', tag: 'IndexedDB', icon: 'database', writable: true,
    supports: { size: true, mtime: true },
    async list(rel) { const c = await children(rel); return c.map(n => ({ name: baseName(n.p), type: n.t, size: n.t === 'dir' ? null : (n.sz || 0), mtime: n.m || 0 })); },
    async stat(rel) {
      const n = await get(rel);
      if (!n) { if (normalizePath(rel) === '/') return { name: '/', type: 'dir', size: null, mtime: 0 }; throw new Error('不存在：' + rel); }
      return { name: baseName(n.p), type: n.t, size: n.t === 'dir' ? null : (n.sz || 0), mtime: n.m || 0 };
    },
    async read(rel) { const n = await get(rel); if (!n || n.t !== 'file') throw new Error('文件不存在：' + rel); return n.b instanceof Blob ? n.b : new Blob([n.b]); },
    async write(rel, data) {
      await ensureParents(rel);
      const blob = data instanceof Blob ? data : new Blob([data]);
      await put({ p: normalizePath(rel), t: 'file', m: Date.now(), sz: blob.size, b: blob });
    },
    async mkdir(rel) { await ensureParents(rel); await put({ p: normalizePath(rel), t: 'dir', m: Date.now() }); },
    async ensureDir(rel) { await ensureParents(rel); await put({ p: normalizePath(rel), t: 'dir', m: Date.now() }); },
    async remove(rel, recursive) {
      const st = await this.stat(rel);
      if (st.type === 'dir' && !recursive) { const kids = await children(rel); if (kids.length) throw new Error('目录非空'); }
      await rmTree(rel);
    },
    async rename(oldRel, newRel) {
      const st = await this.stat(oldRel);
      if (st.type === 'file') { await this.write(newRel, await this.read(oldRel)); await del(oldRel); return; }
      await this.mkdir(newRel);
      for (const e of await this.list(oldRel)) await this.rename(joinPath(oldRel, e.name), joinPath(newRel, e.name));
      await rmTree(oldRel);
    },
    async used() { const c = await tx('readonly', s => { let t = 0; s.openCursor().onsuccess = e => { const x = e.target.result; if (!x) return; t += (x.value.sz || 0); x.continue(); }; return t; }); return c; },
    async scan() { return { size: await this.used(), items: (await tx('readonly', s => { let n = 0; s.openCursor().onsuccess = e => { const x = e.target.result; if (!x) return; n++; x.continue(); }; return n; })) }; }
  };
}

/* 3.3 本地文件夹后端 —— File System Access API 包装成同接口 */
function LocalBackend(rootHandle, label) {
  const split = p => normalizePath(p).split('/').filter(Boolean);

    kind: 'local', label: label || rootHandle.name, tag: '本地挂载', icon: 'mount', writable: true, handle: rootHandle,
    supports: { size: true, mtime: true },
    async list(rel) {
      const h = await dirOf(split(rel), false); const out = [];
      for await (const [name, handle] of h.entries()) {
        if (handle.kind === 'directory') out.push({ name, type: 'dir', size: null, mtime: 0 });
        else { try { const f = await handle.getFile(); out.push({ name, type: 'file', size: f.size, mtime: f.lastModified }); } catch (e) { out.push({ name, type: 'file', size: null, mtime: 0 }); } }
      }
      return out;
    },
    async stat(rel) {
      const segs = split(rel); const name = segs.pop(); const parent = await dirOf(segs, false);
      if (!name) return { name: rootHandle.name, type: 'dir', size: null, mtime: 0 };
      try { const fh = await parent.getFileHandle(name); const f = await fh.getFile(); return { name, type: 'file', size: f.size, mtime: f.lastModified }; }
      catch (e) { await parent.getDirectoryHandle(name); return { name, type: 'dir', size: null, mtime: 0 }; }
    },
    async read(rel) { const f = await this.fileHandle(rel); return f.getFile(); },
    async fileHandle(rel) { const segs = split(rel); const name = segs.pop(); const parent = await dirOf(segs, false); return await parent.getFileHandle(name); },
    async write(rel, data) {
      const segs = split(rel); const name = segs.pop(); const parent = await dirOf(segs, true);
      const fh = await parent.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data instanceof Blob ? data : new Blob([data]));
      await w.close();
    },
    async mkdir(rel) { await dirOf(split(rel), true); },
    async ensureDir(rel) { await dirOf(split(rel), true); },
    async remove(rel, recursive) { const segs = split(rel); const name = segs.pop(); const parent = await dirOf(segs, false); await parent.removeEntry(name, { recursive: !!recursive }); },
    async rename(oldRel, newRel) {
      const st = await this.stat(oldRel);
      const nn = split(newRel).pop();
      if (st.type === 'file') {
        const blob = await this.read(oldRel);
        await this.write(newRel, blob); await this.remove(oldRel, false);
      } else {
        const walk = async (s, d) => { await this.mkdir(d); for (const e of await this.list(s)) { if (e.type === 'dir') await walk(joinPath(s, e.name), joinPath(d, e.name)); else await this.write(joinPath(d, e.name), await this.read(joinPath(s, e.name))); } };
        await walk(oldRel, newRel); await this.remove(oldRel, true);
      }
    },
    async used() {
      let total = 0;
      const walk = async h => { for await (const [, hh] of h.entries()) { if (hh.kind === 'file') { try { total += (await hh.getFile()).size; } catch (e) { } } else await walk(hh); } };
      await walk(rootHandle); return total;
    },
    async scan() { return { size: await this.used(), items: 0 }; },
    async queryPermission() { if (!rootHandle.queryPermission) return 'granted'; return await rootHandle.queryPermission({ mode: 'readwrite' }); },
    async requestPermission() { if (!rootHandle.requestPermission) return 'granted'; return await rootHandle.requestPermission({ mode: 'readwrite' }); }
  };
}

      b.style.top = (pos[e.key] ? pos[e.key].y : 8) + 'px';
      const gl = el('div', { class: 'gl' });
      if (e.type === 'file' && isImg(e.name)) { const im = el('img', { alt: '' }); gl.append(im); thumb(e.path, im); }
      else gl.append(icon(e.icon, 'big'));
      b.append(gl, el('div', { class: 'nm', text: e.name }));
      layer.append(b);
      bindIcon(b, e);
    });
    SYSSTAT.note('桌面已就绪');
  }
  async function thumb(path, img) {
    try { const url = await Thumbs.get(path); if (url) img.src = url; }
    catch (e) { }
  }
  function bindIcon(b, e) {
    b.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      if (ev.button === 2) { if (!sel.has(e.key)) { sel.clear(); sel.add(e.key); render(); } return; }
      if (ev.shiftKey && sel.size) { /* 区间选择 */
        const idx = entries.map(x => x.key), a = idx.indexOf(Array.from(sel)[sel.size - 1]), c = idx.indexOf(e.key);
        sel.clear(); for (let i = Math.min(a, c); i <= Math.max(a, c); i++) sel.add(idx[i]);
      } else if (ev.ctrlKey || ev.metaKey) { sel.has(e.key) ? sel.delete(e.key) : sel.add(e.key); }
      else if (!sel.has(e.key)) { sel.clear(); sel.add(e.key); }
      $$('.dicon', layer).forEach(n => n.classList.toggle('sel', sel.has(n.dataset.key)));
    });
    b.addEventListener('dblclick', () => open(e));
    b.addEventListener('click', ev => { if (!ev.shiftKey && !ev.ctrlKey) { } });
    b.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); iconMenu(e, ev.clientX, ev.clientY); });
    /* HTML5 原生拖拽：出浏览器 + 内部移动统一走 DnD */
    b.addEventListener('mouseenter', () => { if (e.path && e.type === 'file') DRAG.prep(e.path); });
    b.addEventListener('dragstart', ev => {
      if (!sel.has(e.key)) { sel.clear(); sel.add(e.key); $$('.dicon', layer).forEach(n => n.classList.toggle('sel', sel.has(n.dataset.key))); }
      const paths = entries.filter(x => sel.has(x.key) && x.path).map(x => x.path);
      const r = b.getBoundingClientRect();
      DRAG.fill(ev.dataTransfer, { kind: 'desktop', paths, offset: { x: ev.clientX - r.left, y: ev.clientY - r.top }, from: 'desktop', app: !!e.app, appId: e.app }, paths);
      b.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'copyMove';
    });
    b.addEventListener('dragend', () => { b.classList.remove('dragging'); DRAG.end(); DRAG.sweep(); });
    /* 触摸拖拽（移动端：原生 DnD 不可用 → 自定义 touch 拖拽，与桌面框选互不干扰） */
    b.addEventListener('touchstart', ev => touchStart(ev, b, e), { passive: true });
  }

  /* 触摸拖拽：长按 200ms 后跟随手指，落点决定 移动/入文件夹 */
  let touch = null;
  function touchStart(ev, b, e) {
    if (!ev.touches || ev.touches.length !== 1) return;
    const t = ev.touches[0];
    b.dataset.tx = t.clientX; b.dataset.ty = t.clientY;
    b.dataset.moved = '';
    const move = mv => {
      const t2 = mv.touches[0];
      const dx = t2.clientX - (+b.dataset.tx), dy = t2.clientY - (+b.dataset.ty);
      if (!b.dataset.moved && Math.abs(dx) + Math.abs(dy) < 10) return;
      if (mv.cancelable) mv.preventDefault();
      b.dataset.moved = '1';
      b.classList.add('dragging');
      b.style.transform = `translate(${dx}px,${dy}px) scale(1.06)`;
      hintTarget(t2.clientX, t2.clientY);
      b.__t = t2;
    };
    const end = () => {
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', end);
      document.removeEventListener('touchcancel', end);
      hintTarget(null);
      b.classList.remove('dragging');
      b.style.transform = '';
      if (!b.dataset.moved) { touch = null; return; }
      const t2 = b.__t;
      if (t2) {
        const target = document.elementFromPoint(t2.clientX, t2.clientY);
        const folderEl = target && target.closest('.dicon');
        if (folderEl && folderEl.dataset.key !== e.key) {
          const fe = entries.find(x => x.key === folderEl.dataset.key);
          if (fe && fe.type === 'dir') { dropMove([e], fe.path); return; }
        }
        const r = layer.getBoundingClientRect();
        const nx = t2.clientX - r.left - CW() / 2, ny = t2.clientY - r.top - 30;
        dropPos([e], nx, ny);
      }
    };
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);
    document.addEventListener('touchcancel', end);
  }
  function hintTarget(x, y) {
    $$('.dicon', layer).forEach(n => n.classList.remove('drop-on'));
    if (x == null) return;
    const t = document.elementFromPoint(x, y);
    const f = t && t.closest('.dicon');
    if (f) { const fe = entries.find(e => e.key === f.dataset.key); if (fe && fe.type === 'dir') f.classList.add('drop-on'); }
  }

  async function open(e) {
    sel.clear(); $$('.dicon', layer).forEach(n => n.classList.remove('sel'));
    if (e.app) { Apps[e.app].launch({}); return; }
    openPath(e.path);
  }
  async function dropMove(list, dir) {
    try {
      for (const e of list) if (e.path) await fs.move(e.path, dir);
      toast('已移动 ' + list.length + ' 个项目', dir, 'ok');
      await load(); FM.refreshAll();
    } catch (err) { errToast(err, '移动'); }
    refresh();
  }
  function dropPos(list, x, y, ev) {
    const W = CW(), H = CH();
    const maxCols = Math.max(1, Math.floor((layer.clientWidth - PAD) / W) - 1);
    const maxRows = Math.max(1, Math.floor((layer.clientHeight - PAD) / H) - 1);
    list.forEach((e, i) => {
      let cx = x + i * 4, cy = y + i * 4;
      if (SET.get('snapIcons')) {
        let col = Math.max(0, Math.min(maxCols, Math.round((cx - PAD) / W)));
        let row = Math.max(0, Math.min(maxRows, Math.round((cy - PAD) / H)));
        /* 占用冲突则向下顺延 */
        const taken = new Set(entries.filter(x2 => !list.includes(x2)).map(x2 => { const p = pos[x2.key]; return p ? Math.round((p.x - PAD) / W) + ',' + Math.round((p.y - PAD) / H) : ''; }));
        while (taken.has(col + ',' + row)) { row++; if (row > maxRows) { row = 0; col = Math.min(maxCols, col + 1); } }
        cx = PAD + col * W; cy = PAD + row * H;
      }
      LAYOUT.set(e.key, { x: cx, y: cy });
      if (e.path) LAYOUT.set(fs.expand(e.path), { x: cx, y: cy });
    });
    render();
    $$('.dicon', layer).forEach(n => { if (sel.has(n.dataset.key)) n.classList.add('landing'); });
  }
  function refresh() { const keep = new Set(sel); load().then(() => { sel.clear(); keep.forEach(k => sel.add(k)); $$('.dicon', layer).forEach(n => n.classList.toggle('sel', sel.has(n.dataset.key))); }); }
  function autoArrange() { LAYOUT.all(); const all = LAYOUT.all(); Object.keys(all).forEach(k => LAYOUT.del(k)); render(); toast('图标已整理', '按网格重新排列', 'ok'); }

  /* 桌面空白：右键菜单 + 框选 + 外部拖入 */
  host.addEventListener('contextmenu', ev => {
    if (ev.target.closest('.dicon')) return;
    ev.preventDefault(); desktopMenu(ev.clientX, ev.clientY);
  });
  host.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.dicon') || ev.target.closest('.ctx')) return;
    if (ev.button === 2) return;
    startRubber(ev);
  });
  function startRubber(ev) {
    const r0 = host.getBoundingClientRect();
    const sx = ev.clientX, sy = ev.clientY;
    const box = el('div', { class: 'rb', style: { display: 'block' } });
    host.append(box);
    let touched = false;
    const move = mv => {
      const cx = mv.clientX, cy = mv.clientY;
      if (!touched && Math.abs(cx - sx) + Math.abs(cy - sy) < 5) return;
      touched = true;
      if (mv.cancelable) mv.preventDefault();
      const x1 = Math.min(sx, cx) - r0.left, y1 = Math.min(sy, cy) - r0.top, x2 = Math.max(sx, cx) - r0.left, y2 = Math.max(sy, cy) - r0.top;
      Object.assign(box.style, { left: x1 + 'px', top: y1 + 'px', width: (x2 - x1) + 'px', height: (y2 - y1) + 'px' });
      const keepCtrl = mv.ctrlKey || mv.metaKey;
      if (!keepCtrl) sel.clear();
      $$('.dicon', layer).forEach(n => {
        const nx = parseFloat(n.style.left), ny = parseFloat(n.style.top);
        const hit = nx < x2 && nx + CW() > x1 && ny < y2 && ny + CH() > y1;
        if (hit) sel.add(n.dataset.key);
        n.classList.toggle('sel', sel.has(n.dataset.key));
      });
    };
    const end = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('touchmove', tmove);
      document.removeEventListener('touchend', end);
      box.remove();
    };
    const tmove = tm => { if (tm.touches[0]) move({ clientX: tm.touches[0].clientX, clientY: tm.touches[0].clientY, cancelable: tm.cancelable, preventDefault: () => tm.preventDefault() }); };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', end);
    document.addEventListener('touchmove', tmove, { passive: false });
    document.addEventListener('touchend', end);
  }
  /* 外部拖入（物理系统 → 虚拟桌面） */
  host.addEventListener('dragover', ev => {
    ev.preventDefault();
    if (hasExternal(ev.dataTransfer)) { host.classList.add('overdrop'); ev.dataTransfer.dropEffect = 'copy'; }
    else { const c = DRAG.current(); if (c && c.from === 'desktop') { } ev.dataTransfer.dropEffect = 'move'; }
  });
  host.addEventListener('dragleave', ev => { if (ev.target === host) host.classList.remove('overdrop'); });
  host.addEventListener('drop', async ev => {
    ev.preventDefault(); host.classList.remove('overdrop');
    const internal = DRAG.current();
    if (internal && internal.from !== 'app' && internal.paths && internal.paths.length) {
      const list = entries.filter(e => internal.paths.includes(e.path));
      if (!list.length) return;
      const targetEl = document.elementFromPoint(ev.clientX, ev.clientY);
      const folderEl = targetEl && targetEl.closest('.dicon');
      if (folderEl) {
        const fe = entries.find(x => x.key === folderEl.dataset.key);
        if (fe && fe.type === 'dir') { await dropMove(list, fe.path); return; }
      }
      const r = layer.getBoundingClientRect();
      const off = internal.offset || { x: CW() / 2, y: 40 };
      dropPos(list, ev.clientX - r.left - off.x, ev.clientY - r.top - off.y, ev);
      return;
    }
    if (hasExternal(ev.dataTransfer)) {
      const d = desktopDir();
      const t = toast('正在导入…', '准备接收文件', 'ok', 60000);
      try {
        const n = await fs.importEntries(ev.dataTransfer, d, (c, name) => { const el3 = t.querySelector('.d'); if (el3) el3.textContent = '已写入 ' + c + ' 项 · ' + name; });
        t.remove(); toast('导入完成', n + ' 个项目已写入桌面（OPFS 持久化）', 'ok');
        refresh(); FM.refreshAll();
      } catch (err) { t.remove(); errToast(err, '导入文件'); }
    }
  });

  return {
    load, refresh, render, entries: () => entries, sel,
    deselect() { sel.clear(); $$('.dicon', layer).forEach(n => n.classList.remove('sel')); },
    dropPos, autoArrange, desktopDir, pos: () => pos, keyOf
  };
})();

/* ============ 开始菜单 ============ */
const START = (function () {
  const menu = $('#startMenu'), body = $('#smBody'), search = $('#smSearch');
  let open = false;
  function visibleApps() { return Object.keys(Apps).map(k => Apps[k]).filter(a => !(SET.get('hiddenApps') || []).includes(a.id)); }
  function render(q) {
    body.replaceChildren();
    const kind = q ? q.trim() : '';
    const apps = visibleApps().filter(a => !kind || a.name.toLowerCase().includes(kind.toLowerCase()) || (a.id || '').includes(kind.toLowerCase()));
    body.append(el('div', { class: 'sm-sec' }, [el('span', { text: kind ? '匹配结果' : '全部应用' }), el('span', { text: apps.length + ' 项' })]));
    const g = el('div', { class: 'appgrid' });
    apps.forEach((a, i) => {
      const t = el('div', { class: 'ap-tile sm-anim', style: { animationDelay: Math.min(i * 18, 320) + 'ms' } }, [
        el('div', { class: 'gl' }, [icon(a.icon, 'big')]), el('i', { text: a.name })
      ]);
      t.addEventListener('click', () => { closeMenu(); a.launch(q && q[0] === '/' ? { path: q } : {}); });
      g.append(t);
    });
    body.append(g);
    if (kind && kind.length > 1) {
      const sec = el('div', { class: 'sm-sec', style: { marginTop: '14px' } }, [el('span', { text: '文件与文件夹搜索' }), el('span', { text: '按名称' })]);
      const host = el('div', {});
      body.append(sec, host);
      (async () => {
        host.append(el('div', { class: 'empty-note' }, [el('div', { class: 'spin' }), el('span', { text: '正在检索棱镜层…' })]));
        const rec = { cancelled: false };
        const root = kind[0] === '/' ? '/' : '/';
        const hits = await fs.search(root, kind, { limit: 60, rec, max: 20000 });
        host.replaceChildren();
        if (!hits.length) { host.append(el('div', { class: 'empty-note', text: '未找到匹配项' })); return; }
        const list = el('div', {});
        hits.slice(0, 40).forEach(h => {
          const r = el('div', { class: 'sitem', style: { padding: '6px 9px' } }, [icon(fileIcon(h.name, h.type), 'sm'), el('span', { class: 'nowrap', text: h.name }), el('span', { class: 'size', text: dirName(h.path) })]);
          r.addEventListener('click', () => { closeMenu(); openPath(h.path); });
          list.append(r);
        });
        host.append(list);
      })();
    }
  }
  function openMenu() { open = true; menu.classList.add('on'); $('#startBtn').classList.add('on'); render(search.value); setTimeout(() => { if (!isMobile()) search.focus(); }, 60); }
  function closeMenu() { open = false; menu.classList.remove('on'); $('#startBtn').classList.remove('on'); search.value = ''; }
  function toggle() { open ? closeMenu() : openMenu(); }
  search.addEventListener('input', debounce(() => render(search.value), 180));
  search.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); if (e.key === 'Enter') { const first = body.querySelector('.ap-tile'); if (first) first.click(); } });
  document.addEventListener('pointerdown', e => { if (open && !menu.contains(e.target) && !$('#startBtn').contains(e.target)) closeMenu(); });
  return { open: openMenu, close: closeMenu, toggle, isOpen: () => open };
})();

/* ============ 时钟 / 日历 / 快速设置 ============ */
const CLOCK = (function () {
  function tick() {
    const d = new Date();
    const t = fmtDate(d.getTime(), 'clock');
    let txt = t.time;
    if (SET.get('showSeconds')) txt += ':' + t.sec;

/* ---- 缩略图服务（按需加载 + LRU 回收） ---- */
const Thumbs = (function () {
  const cache = new Map(), MAX = 90;
  async function get(path) {
    if (cache.has(path)) { const v = cache.get(path); cache.delete(path); cache.set(path, v); return v; }
    try {
      const st = await fs.stat(path);
      if (st.type !== 'file' || !isImg(st.name)) return null;
      const blob = await fs.readFile(path);
      const url = URL.createObjectURL(blob);
      cache.set(path, url);
      while (cache.size > MAX) { const k = cache.keys().next().value; try { URL.revokeObjectURL(cache.get(k)); } catch (e) { } cache.delete(k); }
      return url;
    } catch (e) { return null; }
  }
  return { get, clear: () => { cache.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { } }); cache.clear(); } };
})();
/* 观察器：仅在可见时加载缩略图 */
const ThumbObserver = (function () {
  let io = null;
  function ensure() {
    if (io) return io;
    io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const n = e.target; io.unobserve(n);
      const p = n.dataset.thumb;
      if (p) Thumbs.get(p).then(u => { if (u && n.isConnected) { const img = n.querySelector('img') || n; img.src = u; } });
    }), { rootMargin: '220px' });
    return io;
  }
  return { observe: n => ensure().observe(n), unobserve: n => io && io.unobserve(n) };
})();

        /* 详细信息：列头 + 行（列左对齐、右侧留白即框选区） */

        /* ---------- 搜索 ---------- */
        searchBox.addEventListener('input', debounce(() => { state.q = searchBox.value.trim(); if (state.q) { reload(); } else { state.q = ''; reload(); } }, 200));
        async function runGlobal(root) {

          const rows = el('div', { class: 'fm-rows' });
          (state.results || []).forEach((e, i) => {
            const r = el('div', { class: 'frow', draggable: 'true', 'data-path': e.path, style: { gridTemplateColumns: '1fr 300px' } });
            r.append(el('div', { class: 'fc nm' }, [icon(fileIcon(e.name, e.type), 'sm'), el('i', { text: e.name })]), el('div', { class: 'fc' }, [el('span', { class: 'sub', text: dirName(e.path) })]));
            r.addEventListener('dblclick', () => openPath(e.path));

        const sInput = searchBox;
        sInput.addEventListener('keydown', e => { if (e.key === 'Enter') runGlobal(state.path); if (e.key === 'Escape') { sInput.value = ''; state.q = ''; state.global = false; reload(); } });

        /* ---------- 框选（鼠标 + 触摸，AABB + 边缘自动滚动） ---------- */
        (function bindRubber() {
          let drag = null, raf = null;
          const RB = () => { let n = vp.querySelector('.rb'); if (!n) { n = el('div', { class: 'rb' }); vp.append(n); } return n; };
          function point(ev) {
            if (ev.touches && ev.touches[0]) return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
            return { x: ev.clientX, y: ev.clientY };
          }
          vp.addEventListener('pointerdown', ev => {
            if (ev.button === 2) return;
            if (ev.target.closest('.frow,.tile,.vrow,.fm-head,.crumb,.rb')) return;
            start(ev);
          });
          vp.addEventListener('touchstart', ev => {
            if (ev.target.closest('.frow,.tile,.vrow,.fm-head')) return;
            if (ev.touches.length !== 1) return;
            start(ev);
          }, { passive: true });
          function start(ev) {
            const p = point(ev);
            const rect = vp.getBoundingClientRect();
            drag = { sx: p.x, sy: p.y, rect, sl: vp.scrollLeft, st: vp.scrollTop, active: false, auto: null, additive: ev.ctrlKey || ev.metaKey };
            if (!drag.additive) { state.sel.clear(); markSel(); }
            const move = mv => { if (!mv.cancelable) { } update(point(mv), mv); };
            const up = () => { finish(); };
            drag.move = move; drag.up = up;
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
            document.addEventListener('touchmove', touchMove, { passive: false });
            document.addEventListener('touchend', up);
            document.addEventListener('touchcancel', up);
          }
          function touchMove(tm) { if (tm.touches.length !== 1) return; update({ x: tm.touches[0].clientX, y: tm.touches[0].clientY }, tm); }
          function update(p, ev) {
            if (!drag) return;
            drag.last = p;
            const dx = Math.abs(p.x - drag.sx), dy = Math.abs(p.y - drag.sy);
            if (!drag.active && dx + dy < 6) return;
            drag.active = true;
            if (ev && ev.preventDefault) {
              if (ev.cancelable) ev.preventDefault();
              else if (ev.touches) ev.preventDefault();
            }
            const x1 = p.x - drag.rect.left + vp.scrollLeft, y1 = p.y - drag.rect.top + vp.scrollTop;
            const x0 = drag.sx - drag.rect.left + drag.sl, y0 = drag.sy - drag.rect.top + drag.st;
            const ax = Math.min(x0, x1), ay = Math.min(y0, y1), bx = Math.max(x0, x1), by = Math.max(y0, y1);
            const box = RB();
            box.style.display = 'block';
            box.style.left = ax + 'px'; box.style.top = ay + 'px'; box.style.width = (bx - ax) + 'px'; box.style.height = (by - ay) + 'px';
            /* AABB 命中（使用 offsetLeft/Top 判定，性能优先） */
            const rowsHost = inner.querySelector('.fm-rows') || inner.querySelector('.fm-grid');
            const nodes = rowsHost ? rowsHost.children : [];
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              if (!n.dataset || !n.dataset.path) continue;
              const nx = n.offsetLeft, ny = n.offsetTop, nw = n.offsetWidth, nh = n.offsetHeight;
              if (nx < bx && nx + nw > ax && ny < by && ny + nh > ay) { if (!drag.additive) state.sel.add(n.dataset.path); else state.sel.add(n.dataset.path); }
              else if (!drag.additive) state.sel.delete(n.dataset.path);
            }
            markSel();
            /* 边缘自动滚动 40px 感应带 */
            autoScroll(p);
          }
          function autoScroll(p) {
            const r = drag.rect, band = 40;
            const cur = { x: p.x - r.left, y: p.y - r.top };
            let vx = 0, vy = 0;
            if (cur.y < band) vy = -(band - cur.y) / band * 14;
            else if (cur.y > r.height - band) vy = (cur.y - (r.height - band)) / band * 14;
            if (cur.x < band) vx = -(band - cur.x) / band * 14;
            else if (cur.x > r.width - band) vx = (cur.x - (r.width - band)) / band * 14;

            if (raf) return;
            const step = () => {
              if (!drag || !drag.auto) { raf = null; return; }
              vp.scrollLeft += drag.auto.vx; vp.scrollTop += drag.auto.vy;
              const p2 = drag.last || null;
              if (p2) update(p2, null);
              raf = requestAnimationFrame(step);
            };
            raf = requestAnimationFrame(step);

            '-',

            '-',

            { label: '排序方式', icon: 'sort', sub: COLS.map(c => ({ label: c.label + (state.sort.key === c.k ? (state.sort.dir === 'asc' ? '（升序）' : '（降序）') : ''), icon: 'sort', onClick: () => { state.sort = { key: c.k, dir: state.sort.key === c.k && state.sort.dir === 'asc' ? 'desc' : 'asc' }; reload(); } })) },
            { label: '在此目录全局搜索', icon: 'search', onClick: () => runGlobal(state.path) },
            '-',

            } catch (e) { t.remove(); errToast(e, '导入'); }

            for (const p of c.paths) { try { await fs.move(p, state.path); } catch (e) { errToast(e, '移动'); } }
            reload(true); DESKTOP.refresh();
          }
        });
        vp.addEventListener('dragover', ev => { ev.dataTransfer.dropEffect = hasExternal(ev.dataTransfer) ? 'copy' : 'move'; });

        /* ---------- 键盘 ---------- */
        w.el.addEventListener('keydown', e => {
          const tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea') return;
          if (e.key === 'Delete') { e.preventDefault(); Lib.del(Array.from(state.sel)).then(() => reload(true)); }
