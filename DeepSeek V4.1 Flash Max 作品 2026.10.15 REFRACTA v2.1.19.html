          else if (e.key === 'Enter' && state.sel.size) { Array.from(state.sel).forEach(p => openPath(p)); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { doClip('copy'); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') { doClip('cut'); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') { Lib.paste(state.path).then(() => reload(true)); }
          else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n') { newFolder(); }
          else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); searchBox.focus(); }

          else if (e.altKey && e.key === 'ArrowUp') go(dirName(state.path));

        api.path = () => state.path;
        api.go = go; api.reload = () => reload(true);
        api.state = state; api.openPath = openPath;

        FM.register({ win: w, api });
        (async () => {
          state.hist = [state.path]; state.hi = 0;
          await reload();
          if (isMobile()) FM.openSuggestion && 0;
        })();
        w.opts.onClose = () => FM.unregister({ win: w });
      }
    });
    return win;
  }

          btn('另存为…', 'save', () => saveAs()),
          '-',
          icBtn('undo', '撤销 (Ctrl+Z)', () => doUndo()),
          icBtn('redo', '重做 (Ctrl+Y)', () => doRedo()),
          icBtn('font', '减小字号', () => setFont(-1)),
          icBtn('font', '增大字号', () => setFont(1)),
          btn('查找替换', 'search', () => toggleFind()),
          btn('自动换行', 'list', () => { ta.wrap = ta.wrap === 'off' ? 'soft' : 'off'; SET.set('npWrap', ta.wrap !== 'off'); }),
          btn('行号行距', 'layers', () => { ta.classList.toggle('num'); SET.set('npNums', ta.classList.contains('num')); }),
          el('span', { class: 'grow' }),
          btn('下载', 'download', () => triggerDownload(new Blob([ta.value], { type: mimeOf(st.path || 'a.txt', 'text/plain') }), st.path ? baseName(st.path) : '未命名.txt'), '', '导出到本机')
        );
        findBar.append(findInput, repInput,
          btn('上一个', 'up', () => find(-1), 'tiny'),
          btn('下一个', 'down', () => find(1), 'tiny'),
          btn('替换', 'rename', () => repOne(), 'tiny'),
          btn('全部替换', 'check', () => repAll(), 'tiny'),
          findInfo,
          icBtn('close', '关闭查找', () => toggleFind(false), 'tiny'));
        pane.append(bar, findBar, ta);
        const abody = el('div', { class: 'abody' }); abody.append(ta); pane.append(abody);
        const status = el('div', { class: 'astatus' });
        pane.append(status);

        function setFont(d) { st.fontSize = Math.max(9, Math.min(34, st.fontSize + d)); ta.style.fontSize = st.fontSize + 'px'; SET.set('npFont', st.fontSize); paint(); }
        function paint() {
          const v = ta.value, pos = ta.selectionStart;
          const before = v.slice(0, pos);
          const line = before.split('\n').length, col = pos - before.lastIndexOf('\n');
          const sel = ta.selectionEnd - ta.selectionStart;
          status.replaceChildren(
            el('span', { text: '行 ' + line + ', 列 ' + col }),
            sel > 0 ? el('span', { text: '已选 ' + sel + ' 字符' }) : el('span', { text: '共 ' + v.split('\n').length + ' 行' }),
            el('span', { text: v.length + ' 字符' }),
            el('span', { text: '字号 ' + st.fontSize + 'px' }),
            el('span', { text: '编码 UTF-8' }),
            el('span', { class: 'grow' }),
            el('span', { text: st.path ? fs.storageLabel(st.path) : '未保存到文件系统' }),
            el('span', { class: 'mono', text: st.dirty ? '● 未保存' : '已同步' })
          );
        }
        let snapshotT = null;
        function snapshot() {
          clearTimeout(snapshotT);
          snapshotT = setTimeout(() => {
            undo.push({ v: ta.value, s: ta.selectionStart, e: ta.selectionEnd });
            if (undo.length > 220) undo.shift(); redo.length = 0;
            waitLocal();
          }, 320);
        }
        function doUndo() { const p = undo.pop(); if (!p) return; redo.push({ v: ta.value, s: ta.selectionStart, e: ta.selectionEnd }); ta.value = p.v; ta.setSelectionRange(p.s, p.e); st.dirty = true; markDirty(true); waitLocal(); }
        function doRedo() { const p = redo.pop(); if (!p) return; undo.push({ v: ta.value, s: ta.selectionStart, e: ta.selectionEnd }); ta.value = p.v; ta.selectionRange(p.s, p.e); ta.setSelectionRange(p.s, p.e); st.dirty = true; markDirty(true); waitLocal(); }
        const LOCALKEY = () => LS_BASENAME + 'np:' + (st.path || 'untitled');
        const waitLocal = debounce(() => {
          if (!SET.get('editorAutosave')) return;
          try { localStorage.setItem(LOCALKEY(), JSON.stringify({ v: ta.value, t: Date.now(), path: st.path })); } catch (e) { }
          if (st.dirty) {
            const all = (() => { try { return JSON.parse(localStorage.getItem(LS_BASENAME + 'npindex') || '[]'); } catch (e) { return []; } })();
            const key = st.path || 'untitled'; if (!all.includes(key)) { all.push(key); try { localStorage.setItem(LS_BASENAME + 'npindex', JSON.stringify(all.slice(-40))); } catch (e) { } }
          }
        }, 900);
        let fileTimer = null;
        function markDirty(d) {
          st.dirty = d; paint();
          if (d && st.path && SET.get('editorAutosave')) {
            clearTimeout(fileTimer);
            fileTimer = setTimeout(async () => { try { await VPSSave.draft(st.path, ta.value); } catch (e) { } }, 2500);
          }
        }
        ta.addEventListener('input', () => { st.dirty = true; snapshot(); paint(); });
        ta.addEventListener('keyup', paint); ta.addEventListener('click', paint); ta.addEventListener('select', paint);
        ta.addEventListener('keydown', e => {
          if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
          if (e.ctrlKey && e.key.toLowerCase() === 'z' && !e.shiftKey) { }
          if (e.ctrlKey && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFind(true); }
          if (e.ctrlKey && e.key.toLowerCase() === 'h') { e.preventDefault(); toggleFind(true); repInput.focus(); }
          if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('\t', s, ta.selectionEnd, 'end'); snapshot(); }
        });
        function toggleFind(show) { const on = show === undefined ? findBar.style.display === 'none' : show; findBar.style.display = on ? 'flex' : 'none'; if (on) findInput.focus(); }
        function find(dir) {
          const q = findInput.value; if (!q) return;
          const from = fIndex + (dir > 0 ? 1 : -1);
          let i = ta.value.indexOf(q, dir > 0 ? Math.max(0, ta.selectionEnd) : 0);
          if (dir < 0) { const b = ta.value.lastIndexOf(q, Math.max(0, ta.selectionStart - 1)); i = b; }
          if (i < 0) i = ta.value.indexOf(q);
          if (i < 0) { findInfo.textContent = '无匹配'; return; }
          fIndex = i;
          ta.focus(); ta.setSelectionRange(i, i + q.length);
          const before = ta.value.slice(0, i).split('\n').length;
          ta.scrollTop = Math.max(0, (before - 6) * st.fontSize * 1.7);
          const total = ta.value.split(q).length - 1;
          findInfo.textContent = (total) + ' 处匹配';
          paint();
        }
        function repOne() { const q = findInput.value; if (!q) return; const s = ta.selectionStart, e = ta.selectionEnd; if (ta.value.slice(s, e) === q) { ta.setRangeText(repInput.value, s, e, 'end'); st.dirty = true; markDirty(true); } find(1); }
        function repAll() { const q = findInput.value; if (!q) return; const n = ta.value.split(q).length - 1; ta.value = ta.value.split(q).join(repInput.value); st.dirty = true; markDirty(true); snapshot(); toast('已替换 ' + n + ' 处', '', 'ok'); }
        async function openDlg() {
          const inp = el('input', { class: 'field', placeholder: '/桌面/说明.txt 或点击浏览', value: st.path || '' });
          const body = el('div', { class: 'flex', style: { flexDirection: 'column', alignItems: 'stretch', gap: '9px' } }, [
            el('div', { class: 'hud', text: '输入文件路径（虚拟文件系统可跨挂载点）' }), inp,
            el('div', { class: 'hud', text: '常用：/桌面 · /文档 · /opfs/文档 · /idb · /mnt/local/…' }),
            btn('使用系统文件选择器导入本机文件', 'upload', async () => { const f = (await pickFiles({}))[0]; if (f) { ta.value = await f.text(); st.path = null; w.setTitle('记事本 — ' + f.name + '（未保存）'); st.dirty = true; markDirty(true); snapshot(); inp.value = ''; } }, 'tiny')
          ]);
          inp.addEventListener('keydown', async e => { if (e.key === 'Enter') { const p = inp.value.trim(); if (p) { await loadPath(p); inp.closest('dialog').querySelector('.btn.primary').click(); } } });
          const r = await dialog({ title: '打开文件', icon: 'open', body, buttons: [{ label: '取消', value: null }, { label: '打开', kind: 'primary', value: 'go' }] });
          if (r === 'go') { const p = inp.value.trim(); if (p) await loadPath(p); }
        }
        async function loadPath(p) {
          try {
            const t = await fs.readText(p);
            ta.value = t; st.path = p; st.dirty = false; markDirty(false); snapshot();
            w.setTitle('记事本 — ' + baseName(p)); w.api && w.setTitle('记事本 — ' + baseName(p));
            api.setSub && api.setSub(fs.storageLabel(p));
            paint(); toast('已打开', p, 'ok');
          } catch (e) { errToast(e, '打开'); }
        }
        async function save() {
          if (!st.path) return saveAs();
          try { await fs.writeText(st.path, ta.value); markDirty(false); toast('已保存', st.path, 'ok'); FM.refreshAll(); DESKTOP.refresh(); }
          catch (e) { errToast(e, '保存'); }
        }
        async function saveAs() {
          const name = await askText({ title: '另存为', message: '保存目录：' + dirName(st.path || fs.expand(SET.get('desktopDir'))), value: st.path ? baseName(st.path) : '未命名.txt' });
          if (!name) return;
          const dir = st.path ? dirName(st.path) : fs.expand(SET.get('desktopDir'));
          const p = joinPath(dir, name);
          try { await fs.writeText(p, ta.value); st.path = p; markDirty(false); w.setTitle('记事本 — ' + name); toast('已保存', p, 'ok'); FM.refreshAll(); DESKTOP.refresh(); }
          catch (e) { errToast(e, '另存为'); }
        }
        /* 恢复草稿 */
        (async () => {
          if (args.path) await loadPath(args.path);
          else {
            try {
              const back = JSON.parse(localStorage.getItem(LOCALKEY()) || 'null');
              if (back && back.v) {
                const r = await dialog({ title: '恢复未保存的内容', icon: 'layers', body: el('div', { style: { fontSize: '12.5px' }, text: '发现 ' + new Date(back.t).toLocaleString('zh-CN') + ' 的自动恢复草稿，是否载入？' }), buttons: [{ label: '丢弃', value: false }, { label: '恢复', kind: 'primary', value: true }] });
                if (r) { ta.value = back.v; st.dirty = true; markDirty(true); }
              }
            } catch (e) { }
          }
          paint();
        })();
        window.addEventListener('beforeunload', () => { waitLocal(); });
        ta.focus(); paint();
      }
    });
    return win;
  }
};

      build(api, w) {

          btn('清理空行', 'trash', () => { st.rows = st.rows.filter(r => r.some(c => c !== '')); drawTable(); }, 'tiny'),
          el('span', { class: 'grow' }),

        );
        const body = el('div', { class: 'abody' });

        const ta = el('textarea', { class: 'np-ta mono', style: { display: 'none', fontSize: '13px' } });
        body.append(wrap, ta);

        function paintStatus() {
          status.replaceChildren(
            el('span', { text: (st.rows.length) + ' 行 × ' + (st.rows[0] ? st.rows[0].length : 0) + ' 列' }),
            el('span', { text: '分隔符 ' + (st.delim === '\t' ? 'TAB' : st.delim) }),
            el('span', { text: '视图 ' + (st.mode === 'table' ? '表格' : '文本') }),
            el('span', { class: 'grow' }),
            el('span', { text: st.path ? st.path + ' · ' + fs.storageLabel(st.path) : '未保存' })
          );
        }
        function parse(text, d) {
          const rows = [];
          let row = [], cell = '', q = false;
          for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (q) {
              if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
              else if (c === '"') q = false;
              else cell += c;
            } else {
              if (c === '"') q = true;
              else if (c === d) { row.push(cell); cell = ''; }
              else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
              else if (c === '\r') { }
              else cell += c;
            }
          }
          if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
          return rows.filter(r => !(r.length === 1 && r[0] === ''));
        }
        function serialize() {
          if (st.mode === 'text') return ta.value;
          const d = st.delim;
          return st.rows.map(r => r.map(c => {
            const v = c == null ? '' : String(c);
            return v.indexOf(d) >= 0 || v.indexOf('"') >= 0 || v.indexOf('\n') >= 0 ? '"' + v.replace(/"/g, '""') + '"' : v;

          for (let c = 0; c < cols; c++) hr.append(el('th', { text: String.fromCharCode(65 + (c % 26)) + (c >= 26 ? Math.floor(c / 26) : '') }));
          thead.append(hr); table.append(thead);

          st.rows.forEach((row, ri) => {
            const tr = el('tr');
            tr.append(el('td', { class: 'rh', text: String(ri + 1) }));
            for (let c = 0; c < cols; c++) {
              const td = el('td', { contenteditable: 'true', text: row[c] == null ? '' : row[c] });
              td.addEventListener('input', () => { while (row.length <= c) row.push(''); row[c] = td.textContent; paintStatus(); });
              td.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); const nx = tr.nextElementSibling && tr.nextElementSibling.children[c + 1]; if (nx) nx.focus(); }
              });
              tr.append(td);
            }
            tb.append(tr);
          });
          table.append(tb); wrap.append(table);
          paintStatus();
        }
        function setMode(m) {
          if (m === st.mode) return;
          if (m === 'text') { ta.value = serialize(); st.raw = ta.value; }
          else { st.rows = parse(ta.value, st.delim); }

          wrap.style.display = m === 'table' ? 'block' : 'none';
          ta.style.display = m === 'text' ? 'block' : 'none';
          if (m === 'table') drawTable(); else paintStatus();
        }
        bTable.addEventListener('click', () => setMode('table'));
        bText.addEventListener('click', () => setMode('text'));
        delimSel.addEventListener('change', () => { st.delim = delimSel.value; if (st.mode === 'text') st.rows = parse(ta.value, st.delim); else { st.raw = serialize(); st.rows = parse(st.raw, st.delim); } drawTable(); });

          setMode('table'); drawTable(); toast('已打开', p, 'ok');
        }
        async function save() {

        }
        async function saveAs() {

  id: 'browser', name: '网页浏览器', icon: 'browser', showOnDesktop: true,
  launch(args) {
    args = args || {};
    const st = { hist: [], hi: -1, blobUrls: [] };
    const win = WM.create({
      title: '网页浏览器', icon: 'browser', w: 1000, h: 640,
      build(api, w) {
        const pane = paneBase(api);
        const bar = el('div', { class: 'abar' });
        const addr = el('input', { class: 'field', placeholder: '输入网址或路径：https://… · /桌面/页面.html · about', style: { flex: '1 1 260px', fontFamily: 'var(--f-mono)', fontSize: '11.5px' } });
        const fr = el('iframe', { sandbox: 'allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-popups-to-escape-sandbox', referrerpolicy: 'no-referrer' });
        fr.className = 'br-frame';
        const mask = el('div', { class: 'mask-load', style: { display: 'none' } }, [el('div', { class: 'lg' }, [el('div', { class: 'ring' }, [el('i', { text: '◈' })]), el('div', { class: 'hud', text: '正在载入页面…' })])]);
        const stage = el('div', { class: 'abody' }, [fr, mask]);
        const status = el('div', { class: 'astatus' });
        bar.append(icBtn('back', '后退', () => jump(-1)), icBtn('fwd', '前进', () => jump(1)), icBtn('refresh', '刷新', () => load(st.hist[st.hi], true)), addr,
          btn('访问', 'globe', () => load(addr.value), 'primary'), btn('主页', 'prism', () => home()), btn('打开 VFS 文件…', 'folder-open', () => pickVFS()), btn('新标签页打开', 'expand', () => { const u = st.hist[st.hi]; if (u) window.open(u, '_blank'); }, ''),
          el('span', { class: 'grow' }), el('span', { class: 'hud', text: '受目标站点 X-Frame-Options 限制时可能拒绝显示' }));
        pane.append(bar, stage, status);
        function paint() {
          status.replaceChildren(
            el('span', { text: st.hist[st.hi] || 'about:home' }),
            el('span', { class: 'grow' }),
            el('span', { text: (st.hi + 1) + ' / ' + st.hist.length })
          );
        }
        function invalidate(url) { }
        async function load(url, force) {
          if (!url) return;
          const histIdx = st.hist.indexOf(url);
          if (histIdx >= 0 && !force) { st.hi = histIdx; }
          else { st.hist = st.hist.slice(0, st.hi + 1); st.hist.push(url); st.hi = st.hist.length - 1; }
          addr.value = url;
          mask.style.display = 'grid';
          let finalUrl = url;
          try {
            if (url === 'about' || url === 'about:home') { finalUrl = homeDoc(); }
            else if (url[0] === '/' || url.startsWith('vfs:')) {
              const p = url.replace(/^vfs:/, '');
              const st2 = await fs.stat(p);
              if (st2.type === 'dir') { FM.open(p); mask.style.display = 'none'; return; }
              const blob = await fs.readFile(p);
              const u = URL.createObjectURL(new Blob([blob], { type: blob.type || mimeOf(st2.name, 'text/html') }));
              st.blobUrls.push(u);
              finalUrl = u;
            } else if (!/^[a-z]+:/i.test(url)) { finalUrl = 'https://' + url; }
          } catch (e) { errToast(e, '载入'); mask.style.display = 'none'; return; }
          fr.src = finalUrl;
          w.setTitle('网页浏览器 — ' + (baseName(url) || url));
          setTimeout(() => { mask.style.display = 'none'; }, 900);
          paint();
        }
        function homeDoc() {
          const u = URL.createObjectURL(new Blob(['<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 50% at 40% 20%,#0d1526,#05060c);color:#dfe6ff;font-family:system-ui}div{text-align:center}h1{font-size:30px;letter-spacing:.2em;background:linear-gradient(90deg,#46f0c0,#8f6bff,#ff4f7e);-webkit-background-clip:text;color:transparent}p{color:#8b93b8;font-size:13px;line-height:1.9}code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:4px}</style></head><body><div><h1>REFRACTA</h1><p>折叠光线的浏览器沙箱。<br>在地址栏输入网址，或打开虚拟文件系统中的 HTML 文件。</p><p><code>/桌面/页面.html</code> · <code>https://example.com</code></p></div></body></html>'], { type: 'text/html' }));
          st.blobUrls.push(u);
          return u;
        }
        function home() { load('about'); }
        function jump(d) { const n = st.hi + d; if (n < 0 || n >= st.hist.length) return; st.hi = n; load(st.hist[n], true); }
        async function pickVFS() {
          const inp = el('input', { class: 'field', placeholder: '/桌面/index.html', value: args.path || '' });
          const r = await dialog({ title: '打开虚拟文件系统中的文件', icon: 'folder-open', body: el('div', { class: 'flex', style: { flexDirection: 'column', alignItems: 'stretch', gap: '8px' } }, [el('div', { class: 'hud', text: '支持 HTML / SVG / PDF / 图片 等浏览器原生可渲染格式' }), inp, el('div', { class: 'flex', style: { flexWrap: 'wrap' } }, ['/桌面', '/文档', '/opfs', '/idb'].map(p => btn(p, 'folder', () => inp.value = p, 'tiny')))]), buttons: [{ label: '取消', value: null }, { label: '打开', kind: 'primary', value: 1 }] });
          if (r && inp.value.trim()) load(inp.value.trim());
        }
        addr.addEventListener('keydown', e => { if (e.key === 'Enter') load(addr.value); });
        fr.addEventListener('load', () => { mask.style.display = 'none'; });
        w.opts.onClose = () => { st.blobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { } }); };
        if (args.path) load(args.path);
        else if (args.blobUrl) { fr.src = args.blobUrl; addr.value = args.name || args.blobUrl; }
        else home();
        paint();
      }
    });
    return win;
  }
};

/* ---------------- v86 虚拟机 ---------------- */
Apps.vm = {
  id: 'vm', name: '虚拟机 (v86)', icon: 'vm', showOnDesktop: true,
  launch(args) {
    args = args || {};
    /* 版本锁定：JS 与 wasm 必须同为 0.5.319；BIOS 来自固定 commit */
    const CDN = 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/';
    const BIOS = 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin';
    const VGA = 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin';
    let emu = null, mouseLocked = false;
    const win = WM.create({
      title: '虚拟机', icon: 'vm', w: 900, h: 640,
      build(api, w) {
        const pane = paneBase(api);
        const bar = el('div', { class: 'abar' });
        const scrHost = el('div', { id: 'vmscreen' });
        /* v86 强制结构：white-space:pre 的等宽 div + canvas（顺序不可变） */
        const textDiv = el('div', { class: 'v86scr' });
        const canvas = el('canvas');
        scrHost.append(textDiv, canvas);
        const info = el('div', { class: 'astatus' });
        let state = 'stopped', chosen = args.path || null;
        const imgLabel = el('span', { class: 'hud', text: chosen ? '镜像: ' + baseName(chosen) : '镜像: 未选择' });
        bar.append(
          btn('选择镜像', 'open', () => pickImage()),
          btn('启动', 'play', () => start(), 'primary'),
          btn('暂停 / 继续', 'pause', () => { if (!emu) return; if (state === 'running') { emu.stop(); state = 'paused'; } else { emu.run(); state = 'running'; } paint(); }),
          btn('重启', 'refresh', () => { if (emu) { emu.restart(); state = 'running'; paint(); } }),
          btn('停止', 'stop', () => { if (emu) { emu.stop(); state = 'stopped'; paint(); } }),
          btn('鼠标锁定', 'mouse', () => lockMouse(!mouseLocked)),
          btn('软盘/硬盘', 'drive', () => cycleDrive(), '', '按扩展名自动挂载：iso→光盘 img/bin→软盘 其他→硬盘'),
          imgLabel, el('span', { class: 'grow' }),
          btn('v86 说明', 'info', () => helpDialog())
        );
        pane.append(bar, scrHost, info);
        function paint() {
          info.replaceChildren(
            el('span', { text: '状态 ' + state }),
            el('span', { text: '鼠标 ' + (mouseLocked ? '已锁定（点击画面锁定 · Esc 解除）' : '自由') }),
            el('span', { class: 'grow' }),
            el('span', { text: 'v86 0.5.319 · wasm 与 JS 同版本 · BIOS 固定 commit' })
          );
        }
        async function biosBytes(url) {
          const r = await fetch(url, { mode: 'cors', cache: 'force-cache' });
          if (!r.ok) throw new Error('BIOS 下载失败 ' + r.status);
          return await r.arrayBuffer();
        }
        async function pickImage() {
          const inp = el('input', { class: 'field', placeholder: '/系统/os.img · /桌面/linux.iso', value: chosen || '' });
          const body = el('div', { class: 'flex', style: { flexDirection: 'column', alignItems: 'stretch', gap: '9px' } }, [
            el('div', { class: 'hud', text: 'v86 需要一个镜像文件。系统不会从互联网下载镜像（外链镜像会被 CORS 拒绝或 404），请先把镜像导入虚拟文件系统。' }),
            inp,
            el('div', { class: 'flex', style: { flexWrap: 'wrap' } }, ['/系统', '/下载', '/opfs', '/idb'].map(p => btn(p, 'folder', () => inp.value = p, 'tiny'))),
            btn('从本机导入镜像（写入 /系统）', 'upload', async () => {
              const f = (await pickFiles({ accept: '.iso,.img,.bin,.fda' }))[0];
              if (!f) return;
              const t = toast('正在导入镜像…', f.name + ' · ' + fmtSize(f.size), 'ok', 300000);
              const p = joinPath('/系统', f.name);
              await fs.writeFile(p, f);
              t.remove(); inp.value = p; chosen = p; imgLabel.textContent = '镜像: ' + f.name; toast('镜像已导入', p, 'ok');
            }, 'tiny')
          ]);
          const r = await dialog({ title: '选择启动镜像', icon: 'drive', body, buttons: [{ label: '取消', value: null }, { label: '使用此镜像', kind: 'primary', value: 1 }] });
          if (r && inp.value.trim()) { chosen = inp.value.trim(); imgLabel.textContent = '镜像: ' + baseName(chosen); toast('已选择镜像', chosen + '（点击「启动」开始）', 'ok'); }
        }
        function cycleDrive() { toast('挂载规则', 'iso → 光盘(cdrom)\nimg / fda / bin → 软盘(fda)\n其他 → 硬盘(hda)', 'ok', 5000); }
        function driveOf(name) {
          const e = extOf(name);
          if (e === 'iso') return 'cdrom';
          if (e === 'img' || e === 'fda' || e === 'bin' || e === 'flp') return 'fda';
          return 'hda';
        }
        async function start() {
          if (typeof window.V86 === 'undefined' && typeof window.V86Starter === 'undefined') { toast('v86 未载入', 'CDN 脚本未就绪，请检查网络后重试', 'err'); return; }
          if (!chosen) { toast('尚未选择镜像', '点击「选择镜像」从虚拟文件系统载入 iso/img 文件', 'err'); return; }
          try {
            state = 'loading'; paint();
            w.setMask(true, '下载 BIOS 与 wasm…');
            const [bios, vga] = await Promise.all([biosBytes(BIOS), biosBytes(VGA)]);
            const blob = await fs.readFile(chosen);
            const buf = await blob.arrayBuffer();
            const drive = driveOf(baseName(chosen));
            const cfg = {
              wasm_path: CDN + 'v86.wasm',
              memory_size: 64 * 1024 * 1024, vga_memory_size: 8 * 1024 * 1024,
              screen_container: scrHost,
              bios: { buffer: bios }, vga_bios: { buffer: vga },
              autostart: true, disable_speaker: true
            };
            cfg[drive] = { buffer: buf, size: buf.byteLength };
            state = 'running';
            const Ctor = window.V86 || window.V86Starter;
            emu = new Ctor(cfg);
            state = 'running';
            w.setMask(false);
            toast('虚拟机已启动', '驱动器 ' + drive + ' ← ' + baseName(chosen), 'ok');
            if (typeof emu.add_listener === 'function') {
              emu.add_listener('emulator-ready', () => { toast('模拟器就绪', '按 Esc 释放鼠标锁定', 'ok'); });
            }
            paint();
          } catch (e) {
            state = 'stopped'; w.setMask(false); paint(); errToast(e, '启动虚拟机');
          }
        }
        function lockMouse(on) {
          if (!emu) { toast('请先启动虚拟机', '', 'err'); return; }
          mouseLocked = on;
          try {
            if (on && typeof emu.lock_mouse === 'function') emu.lock_mouse();
            else if (!on && typeof emu.unlock_mouse === 'function') emu.unlock_mouse();
          } catch (e) { }
          if (!on && document.exitPointerLock) document.exitPointerLock();
          paint();
        }
        canvas.addEventListener('click', () => { if (emu && !mouseLocked) lockMouse(true); });
        scrHost.addEventListener('mousemove', e => {
          if (!emu || !mouseLocked) return;
          if (typeof emu.mouse_motion === 'function') { emu.mouse_motion(Math.round(e.clientX / 2), Math.round(e.clientY / 2)); }
        });
        scrHost.addEventListener('mousedown', e => { if (emu && mouseLocked && typeof emu.mouse_down === 'function') emu.mouse_down(e.button); });
        scrHost.addEventListener('mouseup', e => { if (emu && mouseLocked && typeof emu.mouse_up === 'function') emu.mouse_up(e.button); });
        document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement) { mouseLocked = false; paint(); } });
        scrHost.addEventListener('dblclick', () => scrHost.style.zoom = scrHost.style.zoom === '1.4' ? '1' : '1.4');
        pane.addEventListener('keydown', e => {
          if (!emu) return;
          if (['Tab', 'F1', 'F2', 'F5', 'F11', 'F12'].includes(e.key)) e.preventDefault();
          try {
            if (typeof emu.keyboard_send_scancodes === 'function') {
              const code = KEYMAP[e.key] || KEYMAP[e.code];
              if (code) { emu.keyboard_send_scancodes(e.type === 'keydown' ? [code] : [0x80 | code]); }
            }
          } catch (er) { }
        });
        pane.tabIndex = 0;
        function helpDialog() {
          dialog({
            title: '关于 v86 虚拟机', icon: 'vm', body: el('div', { style: { fontSize: '12.5px', lineHeight: '1.8', color: 'var(--ink-2)' }, html: '<b>版本策略（黑屏防护）</b><br>· JS 与 wasm 同为 <span class="mono">v86@0.5.319</span>，严禁 @latest<br>· BIOS / VGA BIOS 指向固定 commit <span class="mono">bbb2a5b</span><br><br><b>镜像挂载</b><br>· <span class="mono">.iso</span> → 光盘<br>· <span class="mono">.img / .fda / .bin</span> → 软盘<br>· 其他 → 硬盘<br>镜像文件必须来自虚拟文件系统（外部直链会被 CORS 拦截或 404）。<br><br><b>鼠标锁定</b><br>点击画面锁定鼠标，虚拟机内可正常使用指针；按 <span class="mono">Esc</span> 或按钮解除。<br>双击画面切换缩放。' })
          });
        }
        const KEYMAP = { Escape: 0x01, Digit1: 0x02, Tab: 0x0f, KeyQ: 0x10, KeyW: 0x11, KeyE: 0x12, KeyR: 0x13, KeyT: 0x14, KeyY: 0x15, KeyU: 0x16, KeyI: 0x17, KeyO: 0x18, KeyP: 0x19, Enter: 0x1c, ControlLeft: 0x1d, KeyA: 0x1e, KeyS: 0x1f, KeyD: 0x20, KeyF: 0x21, KeyG: 0x22, KeyH: 0x23, KeyJ: 0x24, KeyK: 0x25, KeyL: 0x26, ShiftLeft: 0x2a, KeyZ: 0x2c, KeyX: 0x2d, KeyC: 0x2e, KeyV: 0x2f, KeyB: 0x30, KeyN: 0x31, KeyM: 0x32, Space: 0x39, Backspace: 0x0e, ArrowUp: 0x48, ArrowLeft: 0x4b, ArrowRight: 0x4d, ArrowDown: 0x50 };
        w.opts.onClose = () => { try { emu && emu.stop(); } catch (e) { } };
        paint();
        if (args.path) { chosen = args.path; imgLabel.textContent = '镜像: ' + baseName(args.path); setTimeout(() => start().catch(() => { }), 400); }
      }
    });
    return win;
  }
};

/* ---------------- 系统功能 ---------------- */
const SYS = (function () {
  function applyTheme(t) {
    SET.set('theme', t);
    document.documentElement.dataset.theme = t;
    document.body.className = document.body.className.replace(/theme-\w+/, '') + ' theme-' + t;
    /* 编辑器跟随主题 */
    try { $$('.CodeMirror').forEach(n => n.classList.toggle('cm-s-material-darker', t === 'dark')); } catch (e) { }
  }
  function applyAccent() {
    const MAP = { a1: ['#46f0c0', '#12b892', 'rgba(70,240,192,.22)'], a2: ['#ff4f7e', '#c62f5b', 'rgba(255,79,126,.2)'], a3: ['#ffd24a', '#c99a00', 'rgba(255,210,74,.18)'], a4: ['#8f6bff', '#5f3ed6', 'rgba(143,107,255,.2)'], a5: ['#5ac8ff', '#1d8fd0', 'rgba(90,200,255,.2)'], a6: ['#ff8a3d', '#d1611a', 'rgba(255,138,61,.2)'] };
    const [c, d, g] = MAP[SET.get('accent')] || MAP.a1;
    const s = document.documentElement.style;
    s.setProperty('--a1', c); s.setProperty('--a1-d', d); s.setProperty('--a1-g', g);
  }
  function applyFontScale() { document.documentElement.style.setProperty('--fs', (SET.get('fontScale') || 100) / 100 * 14 + 'px'); document.body.style.fontSize = (SET.get('fontScale') || 100) / 100 * 14 + 'px'; }
  function applyWallpaper(k) {
    SET.set('wallpaper', { type: 'builtin', value: k });
    const layer = $('#wallpaper');
    layer.replaceChildren(el('div', { class: 'wp-w ' + k }));
    layer.querySelectorAll('img').forEach(i => { });
    layer.firstChild.style.opacity = '0';
    requestAnimationFrame(() => { layer.firstChild.style.transition = 'opacity .5s'; layer.firstChild.style.opacity = '1'; });
  }
  async function uploadWallpaper() {
    const f = (await pickFiles({ accept: 'image/*' }))[0];
    if (!f) return;
    try {
      await fs.ensureDir('/opfs/系统/壁纸');
      const p = joinPath('/opfs/系统/壁纸', f.name);
      await fs.writeFile(p, f);
      setWallpaperFromPath(p);
      toast('壁纸已保存到 OPFS', p, 'ok');
    } catch (e) { errToast(e, '设置壁纸'); }
  }
  async function setWallpaperFromPath(p) {
    try {
      const blob = await fs.readFile(p);
      const url = URL.createObjectURL(blob);
      const layer = $('#wallpaper');
      const img = el('img', { src: url, alt: '壁纸', style: { opacity: '0', transition: 'opacity .6s' } });
      layer.replaceChildren(img);
      requestAnimationFrame(() => img.style.opacity = '1');
      SET.set('wallpaper', { type: 'file', value: p });
      toast('已应用壁纸', baseName(p), 'ok');
    } catch (e) { errToast(e, '设置壁纸'); }
  }
  async function wallpaperFromVFS() {
    const inp = el('input', { class: 'field', placeholder: '/图片/壁纸.png', value: '' });
    const list = el('div', { class: 'flex', style: { flexWrap: 'wrap' } });
    const r = await dialog({
      title: '从文件系统选择壁纸', icon: 'image', body: el('div', { class: 'flex', style: { flexDirection: 'column', alignItems: 'stretch', gap: '9px' } }, [inp, list]),
      buttons: [{ label: '取消', value: null }, { label: '应用', kind: 'primary', value: 1 }]
    });
    if (r && inp.value.trim()) setWallpaperFromPath(inp.value.trim());
    try {
      for (const e of (await fs.readdir('/opfs/图片')).filter(x => x.type === 'file' && isImg(x.name)).slice(0, 24)) {
        const t = el('div', { class: 'ts', style: { width: '58px', height: '44px' }, title: e.name });
        list.append(t);
        Thumbs.get(e.path).then(u => { if (u) t.append(el('img', { src: u, style: { width: '100%', height: '100%', objectFit: 'cover' } })); });
        t.addEventListener('click', () => inp.value = e.path);
      }
    } catch (e) { }
  }
  function toggleFullscreen() {
    const d = document.documentElement;
    if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).then(() => toast('已进入全屏', 'F11 或 Esc 退出', 'ok')).catch(() => toast('全屏被拒绝', '浏览器策略限制', 'err')); }
    else document.exitFullscreen().catch(() => { });
  }
  async function propsDialog(path, st) {
    const body = el('div', { class: 'props-k' });
    const put = (k, v) => { const s = el('span', { text: v, style: { wordBreak: 'break-all' } }); body.append(el('b', { text: k }), s); return s; };
    put('名称', st.name);
    put('路径', path);
    put('类型', kindName(st.name, st.type));
    put('位置', fs.storageLabel(path));
    const sizeSpan = put('大小', st.type === 'file' ? fmtSize(st.size) : '计算中…');
    put('修改时间', st.mtime ? fmtDate(st.mtime) : '—');
    put('可读', '是');
    put('可写', fs.backendOf(path) && fs.backendOf(path).writable ? '是' : '否');
    const btns = [{ label: '复制路径', icon: 'copy', onClick: () => { try { navigator.clipboard && navigator.clipboard.writeText(path); } catch (e) { } toast('已复制路径', path, 'ok'); return false; } }];
    if (st.type === 'file' && isImg(st.name)) btns.push({ label: '设为壁纸', icon: 'wall', onClick: () => { SYS.setWallpaperFromPath(path); return false; } });
    if (st.type === 'file') btns.push({ label: '导出到本机', icon: 'download', onClick: () => { fs.download(path); return false; } });
    btns.push({ label: '关闭', kind: 'primary', value: null });
    dialog({ title: '属性', icon: 'info', width: 520, body, buttons: btns });
    if (st.type === 'dir') {
      const d = await fs.du(path).catch(() => ({ size: 0, items: 0 }));
      if (sizeSpan.isConnected) sizeSpan.textContent = fmtSize(d.size) + (d.items ? ' · ' + d.items + ' 个项目' : '');
    }
  }
  async function resetOPFS() {
    try {
      const root = await navigator.storage.getDirectory();
      const names = [];
      for await (const [n] of root.entries()) names.push(n);
      for (const n of names) await root.removeEntry(n, { recursive: true });
      toast('OPFS 已清空', '重新建立目录结构…', 'ok');
      await fs.init();
      await fs.ensureDir(SET.get('desktopDir'));
      DESKTOP.refresh(); FM.refreshAll();
    } catch (e) { errToast(e, '清除 OPFS'); }
  }
  function apply() {
    applyTheme(SET.get('theme'));
    applyAccent(); applyFontScale();
    const wp = SET.get('wallpaper');
    if (wp.type === 'builtin') applyWallpaper(wp.value); else setWallpaperFromPath(wp.value);
    document.body.classList.toggle('no-anim', SET.get('anim') === false);
    document.documentElement.style.setProperty('--glass', SET.get('reduceBlur') ? 'rgba(9,11,19,.96)' : 'rgba(14,17,29,.74)');
  }
  return { applyTheme, applyAccent, applyFontScale, applyWallpaper, uploadWallpaper, setWallpaperFromPath, wallpaperFromVFS, toggleFullscreen, propsDialog, resetOPFS, apply };
})();

/* 状态提示（启动与桌面就绪） */
const SYSSTAT = { note(t) { const st = $('#bootSt'); if (st) st.textContent = t; const mb = $('#mbStore'); if (mb && t) { } } };

/* ---------------- 全局快捷键 ---------------- */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if (e.key === 'F11') { e.preventDefault(); SYS.toggleFullscreen(); return; }
  if (mod && e.key === 'Escape') { e.preventDefault(); START.toggle(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); Apps.fm.launch({ path: fs.expand(SET.get('desktopDir')) }); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 't') { e.preventDefault(); Apps.term.launch({}); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'w') { e.preventDefault(); const w = WM.list().filter(x => x.el.classList.contains('active')).pop(); if (w) w.close(); return; }
  if (e.altKey && e.key === 'Tab') {
    e.preventDefault();
    const list = WM.list();
    if (list.length < 2) return;
    const topIdx = list.findIndex(x => x.el.classList.contains('active'));
    const next = list[(topIdx + 1 + list.length) % list.length];
    next.el.style.visibility = ''; next.restore(); next.focus();
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'n' && !typing) { e.preventDefault(); desktopMenu(innerWidth * .4, 160); return; }
  if (e.key === 'Escape') { $$('.ctx').forEach(c => c.remove()); }
}, true);

/* ---------------- 任务栏与启动 ---------------- */
$('#startBtn').addEventListener('click', () => START.toggle());
$('#smSettings').addEventListener('click', () => { START.close(); Apps.settings.launch({}); });
$('#smTerminal').addEventListener('click', () => { START.close(); Apps.term.launch({ cwd: fs.expand(SET.get('desktopDir')) }); });

$('#smGlobal').addEventListener('click', () => { const q = $('#smSearch').value.trim(); if (!q) return toast('请输入关键词', '将进行文件名递归搜索', 'err'); Apps.fm.launch({ path: '/' }); });
$('#btnFullscreen').addEventListener('click', () => SYS.toggleFullscreen());
$('#btnWall').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); desktopMenu(r.left - 120, r.top - 300, true); });
$('#btnMount').addEventListener('click', () => Lib.mountUI());
$('#btnQuick').addEventListener('click', e => QUICK.show(innerWidth - 300, innerHeight - 360));
$('#clockBtn').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); CLOCK.calendar(innerWidth - 300, Math.max(60, r.top - 330)); });

function lockScreen() {
  const o = el('div', { style: { position: 'fixed', inset: '0', zIndex: 3000, background: 'radial-gradient(60% 50% at 50% 35%,#0b0f1c,#04050a 75%)', display: 'grid', placeItems: 'center', opacity: '0', transition: 'opacity .3s' } });
  const box = el('div', { style: { textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '14px' } }, [
    el('div', { class: 'disp', style: { fontSize: '34px', letterSpacing: '.2em', background: 'linear-gradient(100deg,#fff,var(--a1),var(--a4))', WebkitBackgroundClip: 'text', color: 'transparent' }, text: 'REFRACTA' }),
    el('div', { class: 'hud', text: new Date().toLocaleString('zh-CN', { hour12: SET.get('timeFormat') === '12' }) }),
    el('div', { class: 'hud', text: '输入任意内容或直接点击解锁' }),
    (() => { const i = el('input', { class: 'field', placeholder: '会话口令', style: { textAlign: 'center' } }); return i; })(),
    btn('解锁', 'lock', () => { o.style.opacity = '0'; setTimeout(() => o.remove(), 320); }, 'primary')
  ]);
  o.append(box);
  document.body.append(o);
  requestAnimationFrame(() => o.style.opacity = '1');
  o.querySelector('input').addEventListener('keydown', e => { if (e.key === 'Enter') box.querySelector('.btn').click(); });
}

/* ---------------- 启动流程 ---------------- */
(async function boot() {
  const t0 = performance.now();
  try {
    SET.init();                                   /* 读取 localStorage / Cookie */
    SYS.apply();                                  /* 主题 / 强调色 / 壁纸 */
    SYSSTAT.note('初始化棱镜层…');
    const res = await fs.init();
    const store = fs.mounts().map(m => m.tag).join(' + ') || 'LocalStorage';
    SYSSTAT.note('已挂载存储：' + store);
    document.cookie = 'refracta_session=' + Date.now() + ';path=/;max-age=31536000;SameSite=Lax';
    SET.set('bootCount', (SET.get('bootCount') || 0) + 1);
    /* 桌面与默认应用 */
    SYSSTAT.note('载入桌面…');
    await DESKTOP.load();
    CLOCK.tick();
    await STORE.scan().catch(() => { });
    /* 首次启动：建立示例文件 */
    if (!localStorage.getItem(LS_BASE_READY)) {
      await seedFiles();
      try { localStorage.setItem(LS_BASE_READY, '1'); } catch (e) { }
    }
    /* 未挂载的本地文件夹提醒 */
    try {
      const remembered = JSON.parse(localStorage.getItem(LS_BASENAME + 'mounts') || '[]');
      if (remembered.length && !fs.mounts().some(m => m.kind === 'local')) {
        setTimeout(async () => {
          const r = await dialog({
            title: '重新挂载本地文件夹', icon: 'mount',
            body: el('div', { style: { fontSize: '12.5px', lineHeight: '1.7' } }, [el('div', { text: '检测到上次会话挂载过 ' + remembered.length + ' 个本地文件夹（由于浏览器安全策略，刷新后需要重新授权）：' }), el('div', { class: 'mono', style: { marginTop: '6px', color: 'var(--dim)' }, text: remembered.join('\n') })]),
            buttons: [{ label: '稍后', value: null }, { label: '现在挂载…', kind: 'primary', onClick: () => { Lib.mountUI(); } }]
          });
        }, 1200);
      }
    } catch (e) { }
    $('#boot').classList.add('gone');
    setTimeout(() => $('#boot').remove(), 420);
    if (isMobile()) { $('#mbStore').textContent = store; }
    /* 首个窗口：欢迎提示（可关闭） */
    setTimeout(() => {
      toast('欢迎使用折光系统', '桌面右键可新建 / 上传 / 更换壁纸；拖动图标即可自由摆放（可直接拖出到本机桌面）', 'ok', 9000);
    }, 500);
    setTimeout(() => { if (SET.get('bootCount') <= 2) FM.open(fs.expand(SET.get('desktopDir')), { reuse: false }); }, 900);
    console.log('[REFRACTA] 启动完成，用时 ' + Math.round(performance.now() - t0) + ' ms');
  } catch (e) {
    console.error(e);
    $('#bootEr').textContent = '初始化异常：' + (e.message || e) + '（系统会以降级模式继续运行）';
    SET.init && SET.init();
    setTimeout(() => $('#boot').classList.add('gone'), 2600);
    errToast(e, '启动');
  }
})();
const LS_BASE_READY = LS_BASENAME + 'seeded';

  try {

    await fs.ensureDir(d);
    const readme = '# REFRACTA · 折光系统\n\n欢迎来到棱镜断层。\n\n- 桌面图标可以在网格内自由摆放\n- 把文件从电脑拖进来即可导入 OPFS\n- 右侧「存储后端」可把文件放到 OPFS 或 IndexedDB\n- 试试右键菜单：新建 / 上传 / 压缩 / 解压 / 属性\n';
    await fs.writeText(joinPath(d, '欢迎.txt'), readme);
    const html = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>折光示例页面</title>\n  <style>\n    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 50% at 40% 20%,#0d1526,#05060c);color:#e9edff;font-family:system-ui}\n    .card{padding:36px 44px;border-radius:18px;border:1px solid rgba(150,170,255,.2);background:rgba(255,255,255,.04);text-align:center}\n    h1{margin:0 0 10px;background:linear-gradient(90deg,#46f0c0,#8f6bff,#ff4f7e);-webkit-background-clip:text;color:transparent}\n  </style>\n</head>\n<body>\n  <div class="card">\n    <h1>REFRACTA</h1>\n    <p>双击此文件会用内置编辑器打开，并实时预览右侧成果。</p>\n    <button onclick="alert(\'沙箱内的脚本正在运行\')">点我测试脚本</button>\n  </div>\n</body>\n</html>\n';
    await fs.writeText(joinPath(d, '示例页面.html'), html);
    await fs.ensureDir('/opfs/文档');
    await fs.writeText('/opfs/文档/数据.csv', '名称,类型,大小\n棱镜层,OPFS,大容量\n封存层,IndexedDB,结构化\n微光层,LocalStorage,兜底\n');
    const zipTest = null;
    await fs.ensureDir('/opfs/系统');
    console.log('[REFRACTA] 已生成示例文件');
  } catch (e) { console.warn('seed 失败', e); }
}
