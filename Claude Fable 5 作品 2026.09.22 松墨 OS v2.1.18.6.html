async function openManga(path){
  const win=WM.create({title:'漫画阅读器',icon:I.manga,width:900,height:640,app:'manga'});
  win.body.innerHTML=`<div class="appbar" style="background:rgba(0,0,0,.25)">
    <span style="font-size:12.5px;color:var(--txt2)" class="mg-title">加载中…</span>
    <span class="sp" style="flex:1"></span>
    <button class="abtn" data-a="fs">${I.expand}<span class="bl">全屏沉浸</span></button>
   </div>
   <div class="manga-scroll"><div class="manga-load">正在扫描目录并加载图片…</div></div>
   <button class="manga-exit" title="退出全屏">×</button>`;
  const scroll=$('.manga-scroll',win.body);
  const urls=[];
  win.onClose=()=>urls.forEach(u=>URL.revokeObjectURL(u));
  /* 全屏沉浸 */
  const fsBtn=$('[data-a=fs]',win.body), exitBtn=$('.manga-exit',win.body);
  fsBtn.onclick=async()=>{ win.el.classList.add('fullscreen-manga');
    try{ await win.el.requestFullscreen(); }catch(_){} };
  exitBtn.onclick=async()=>{ win.el.classList.remove('fullscreen-manga');
    if(document.fullscreenElement===win.el){ try{ await document.exitFullscreen(); }catch(_){} } };
  document.addEventListener('fullscreenchange',function fc(){
    if(!document.fullscreenElement) win.el.classList.remove('fullscreen-manga');
    if(!document.body.contains(win.el)) document.removeEventListener('fullscreenchange',fc); });
  /* 目录扫描（路径截取到最后一个 / 之前） */
  const dir=path.slice(0,path.lastIndexOf('/'))||'/';
  let ls;
  try{ ls=await fs.readdir(dir); }
  catch(e){ toast('目录读取失败：'+e.message,'error'); WM.close(win); return; }
  const IMG_RE=/\.(jpe?g|png|webp|gif|bmp|svg|avif|ico)$/i;
  const imgs=ls.filter(e=>e.kind==='file'&&IMG_RE.test(e.name)).map(e=>e.name);
  /* 自然数字排序：1.jpg → 2.jpg → 10.jpg */
  imgs.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  if(!imgs.length){ scroll.innerHTML='<div class="manga-load">该目录中没有可显示的图片。</div>'; return; }
  $('.mg-title',win.body).textContent=`${baseOf(dir)||'根目录'} · ${imgs.length} 页`;
  win.setTitle(`漫画阅读器 - ${baseOf(dir)||'根目录'}`);
  /* 并行读取、按序插入、单张失败跳过 */
  const results=await Promise.all(imgs.map(async n=>{
    try{ return {name:n,blob:await fs.readBlob(dir+'/'+n)}; }catch(e){ return {name:n,blob:null}; } }));
  scroll.innerHTML='';
  let targetEl=null;
  for(const r of results){
    if(!r.blob) continue;
    const u=URL.createObjectURL(r.blob); urls.push(u);
    const im=document.createElement('img');
    im.src=u; im.loading='lazy'; im.alt=r.name;
    im.style.cssText='width:100%;max-width:1000px;display:block;pointer-events:none';
    scroll.appendChild(im);
    if(dir+'/'+r.name===norm(path)) targetEl=im;
  }
  if(!scroll.children.length) scroll.innerHTML='<div class="manga-load">所有图片加载失败。</div>';
  if(targetEl) setTimeout(()=>targetEl.scrollIntoView({block:'start'}),80);
}

  }

    lineNumbers:true,lineWrapping:true,styleActiveLine:true,showTrailingSpace:true,
    matchBrackets:true,autoCloseBrackets:true,matchTags:{bothTags:true},autoCloseTags:true,

  const frame=$('.ed-preview',win.body);

  if(path&&EXT_MODE[extOf(path)]) setMode(EXT_MODE[extOf(path)]); else setMode('htmlmixed');
  /* ---- 实时预览（sandbox 隔离；写入异常回退 Blob URL）---- */
  let blobUrl=null;
  function previewDoc(){
    const v=cm.getValue(), m=curMode();
    if(m==='htmlmixed'||m==='xml') return v;
    if(m==='css') return `<!DOCTYPE html><html><head><style>${v}</style></head><body><h1>CSS 预览</h1><p>段落示例文本 paragraph</p><button>按钮</button><a href="#">链接</a><ul><li>列表项 1</li><li>列表项 2</li></ul></body></html>`;
    if(m==='javascript') return `<!DOCTYPE html><html><body style="font-family:monospace;background:#111;color:#9f9;padding:10px;font-size:13px"><div id="out">JS 控制台输出：<br></div><scr`+`ipt>const o=document.getElementById('out');const log=(...a)=>o.innerHTML+=a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')+'<br>';console.log=log;console.error=(...a)=>{o.innerHTML+='<span style="color:#f77">'+a.join(' ')+'</span><br>'};window.onerror=(m)=>console.error(m);try{${''}eval(${JSON.stringify(v)})}catch(e){console.error(e.message)}</scr`+`ipt></body></html>`;
    return `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre style="white-space:pre-wrap;font-family:monospace;padding:12px">${esc(v)}</pre></body></html>`;
  }
  function refreshPreview(){
    const doc=previewDoc();
    try{ const d=frame.contentDocument; d.open(); d.write(doc); d.close(); }
    catch(e){ if(blobUrl)URL.revokeObjectURL(blobUrl);
      blobUrl=URL.createObjectURL(new Blob([doc],{type:'text/html'})); frame.src=blobUrl; }
  }

  /* ---- 状态栏 ---- */
  function status(){
    const c=cm.getCursor(); $('.s-pos',win.body).textContent=`行 ${c.line+1}, 列 ${c.ch+1}`;

  }
  cm.on('cursorActivity',status);
  /* ---- 格式化 ---- */
  function format(){
    const opts={indent_size:2,indent_inner_html:true,wrap_line_length:120,preserve_newlines:true,max_preserve_newlines:2,end_with_newline:true};
    const m=curMode(); let out=null,v=cm.getValue();

    }catch(e){ toast('格式化失败：'+e.message,'error'); return; }
    if(out==null){ toast('格式化库未加载','error'); return; }
    const cur=cm.getCursor(); cm.setValue(out); cm.setCursor(cur); toast('已格式化','ok');

  /* ---- 查找替换 ---- */
  const fb=$('.ed-findbar',win.body);
  const F={q:'',marks:[],pos:[],cur:-1,cs:false,word:false,re:false};
  const fq=$('.f-q',fb),fr=$('.f-r',fb),fcount=$('.fcount',fb);
  function findClear(){ F.marks.forEach(m=>m.clear()); F.marks=[]; F.pos=[]; }
  function findUpdate(keepCur){
    findClear(); F.q=fq.value;
    if(!F.q){ fcount.textContent='0/0'; return; }
    let re;
    try{ let src=F.re?F.q:F.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      if(F.word) src='\\b(?:'+src+')\\b';
      re=new RegExp(src,'g'+(F.cs?'':'i'));
    }catch(e){ fcount.textContent='无效正则'; return; }
    const v=cm.getValue(); let m,guard=0;
    while((m=re.exec(v))&&guard++<20000){
      if(m[0]==='') { re.lastIndex++; continue; }
      F.pos.push([m.index,m.index+m[0].length]); }
    if(!keepCur||F.cur>=F.pos.length) F.cur=F.pos.length?0:-1;
    F.pos.forEach(([a,b],i)=>{
      F.marks.push(cm.markText(cm.posFromIndex(a),cm.posFromIndex(b),{className:i===F.cur?'cm-matchhighlight-cur':'cm-matchhighlight-all'})); });
    fcount.textContent=F.pos.length?`${F.cur+1}/${F.pos.length}`:'0/0';
    if(F.cur>=0) cm.scrollIntoView({from:cm.posFromIndex(F.pos[F.cur][0]),to:cm.posFromIndex(F.pos[F.cur][1])},60);
  }
  function findStep(d){ if(!F.pos.length) return; F.cur=(F.cur+d+F.pos.length)%F.pos.length; findUpdate(true); }
  function openFind(replace){ fb.classList.add('open'); (replace?fr:fq).focus(); fq.select(); findUpdate(); }
  function closeFind(){ fb.classList.remove('open'); findClear(); fcount.textContent='0/0'; cm.focus(); }
  fq.oninput=()=>findUpdate();
  fq.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); findStep(e.shiftKey?-1:1); } if(e.key==='Escape') closeFind(); };
  fr.onkeydown=e=>{ if(e.key==='Escape') closeFind(); };
  $('.f-case',fb).onclick=e=>{ F.cs=!F.cs; e.currentTarget.classList.toggle('on',F.cs); findUpdate(); };
  $('.f-word',fb).onclick=e=>{ F.word=!F.word; e.currentTarget.classList.toggle('on',F.word); findUpdate(); };
  $('.f-re',fb).onclick=e=>{ F.re=!F.re; e.currentTarget.classList.toggle('on',F.re); findUpdate(); };
  $('.f-prev',fb).onclick=()=>findStep(-1);
  $('.f-next',fb).onclick=()=>findStep(1);
  $('.f-rep1',fb).onclick=()=>{ if(F.cur<0)return; const [a,b]=F.pos[F.cur];
    cm.replaceRange(fr.value,cm.posFromIndex(a),cm.posFromIndex(b)); findUpdate(true); };
  $('.f-repall',fb).onclick=()=>{ if(!F.pos.length)return; const n=F.pos.length;
    for(let i=F.pos.length-1;i>=0;i--){ const [a,b]=F.pos[i]; cm.replaceRange(fr.value,cm.posFromIndex(a),cm.posFromIndex(b)); }
    findUpdate(); toast(`已替换 ${n} 处`,'ok'); };
  $('.f-close',fb).onclick=closeFind;
  /* ---- 保存 ---- */
  async function save(){
    if(!name){ const n=await uiPrompt('保存为',(MODE_EXT[curMode()]||'.html').replace('.','页面.'),'将保存到 '+saveDir); if(!n) return; name=n; }
    try{ await fs.writeFile(saveDir+'/'+name,cm.getValue());
      win.setTitle(name+' - HTML编辑器'); toast('已保存 '+name,'ok');
      touchDir(saveDir); // 刷新桌面与相关文件夹窗口
    }catch(e){ toast('保存失败：'+e.message,'error'); }
  }
  /* ---- 工具栏 ---- */
  const A=(a,f)=>$(`[data-a=${a}]`,win.body).onclick=f;
  A('run',refreshPreview); A('reload',refreshPreview); A('fmt',format);
  A('undo',()=>cm.undo()); A('redo',()=>cm.redo());
  A('foldall',()=>{ for(let i=0;i<cm.lineCount();i++) cm.foldCode(CodeMirror.Pos(i,0),null,'fold'); });
  A('unfoldall',()=>{ for(let i=0;i<cm.lineCount();i++) cm.foldCode(CodeMirror.Pos(i,0),null,'unfold'); });
  A('findbtn',()=>openFind(false));
  A('save',save);
  A('clear',async()=>{ if(await uiConfirm('清空内容','确定清空编辑器全部内容？')) cm.setValue(''); });
  A('newwin',()=>{ const u=URL.createObjectURL(new Blob([previewDoc()],{type:'text/html'})); open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),10000); });
  A('import',()=>{ const inp=$('#pickOne'); inp.accept=''; inp.value='';
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return;
      cm.setValue(await f.text());
      const m=EXT_MODE[extOf(f.name)]; if(m) setMode(m);
      name=name||f.name; toast('已导入 '+f.name,'ok'); refreshPreview(); };
    inp.click(); });
  A('export',()=>{ const ext=MODE_EXT[curMode()]||'.txt';
    dlFile(new Blob([cm.getValue()]),name||('导出'+ext)); });
  modeSel.onchange=()=>setMode(modeSel.value);
  /* ---- 快捷键 ---- */
  cm.setOption('extraKeys',{
    'Ctrl-S':save,'Cmd-S':save,
    'Ctrl-Enter':refreshPreview,
    'Ctrl-Shift-F':format,
    'Ctrl-F':()=>openFind(false),'Cmd-F':()=>openFind(false),
    'Ctrl-H':()=>openFind(true),
    'F3':()=>findStep(1),
    'Esc':closeFind });
  /* ---- 可拖拽分割条 ---- */
  { const div=$('.ed-divider',win.body), editPane=$('.ed-pane.edit',win.body), split=$('.ed-split',win.body);
    let on=false;
    div.addEventListener('pointerdown',e=>{ on=true; div.classList.add('on'); div.setPointerCapture(e.pointerId); });
    div.addEventListener('pointermove',e=>{ if(!on)return;
      const r=split.getBoundingClientRect();
      const w=clamp(e.clientX-r.left,200,r.width-120-7);
      editPane.style.width=w+'px'; });
    const up=()=>{ if(on){ on=false; div.classList.remove('on'); cm.refresh(); } };
    div.addEventListener('pointerup',up); div.addEventListener('pointercancel',up); }
  const onRs=e=>{ if(e.detail===win.id) cm.refresh(); };
  bus.addEventListener('winresize',onRs);
  win.onClose=()=>{ cm.toTextArea(); bus.removeEventListener('winresize',onRs); if(blobUrl)URL.revokeObjectURL(blobUrl); };
  if(path) win.setTitle(name+' - HTML编辑器');
  setTimeout(()=>{ cm.refresh(); refreshPreview(); status(); },60);
  return win;
}

function openCalc(){
  const win=WM.create({title:'计算器',icon:I.calc,width:320,height:460,app:'calc'});
  win.body.innerHTML=`<div class="calc">
    <div class="calc-disp"><div class="expr"></div><div class="val">0</div></div>
    <div class="calc-keys"></div></div>`;
  const keys=[['C','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['±','fn'],['0',''],['.',''],['=','eq']];
  const kb=$('.calc-keys',win.body), exprEl=$('.expr',win.body), valEl=$('.val',win.body);
  let expr='', cur='0', done=false;
  function upd(){ exprEl.textContent=expr; valEl.textContent=cur;
    valEl.style.fontSize=cur.length>12?'22px':'34px'; }
  function press(k){
    if(/\d/.test(k)){ if(done){cur='0';expr='';done=false;} cur=cur==='0'?k:cur+k; }
    else if(k==='.'){ if(done){cur='0';expr='';done=false;} if(!cur.includes('.')) cur+='.'; }
    else if(k==='C'){ cur='0'; expr=''; done=false; }
    else if(k==='⌫'){ cur=cur.length>1?cur.slice(0,-1):'0'; }
    else if(k==='±'){ cur=cur.startsWith('-')?cur.slice(1):(cur!=='0'?'-'+cur:cur); }
    else if(k==='%'){ cur=String(parseFloat(cur)/100); }
    else if(k==='='){ calc(); }
    else{ // 运算符
      if(done){ expr=''; done=false; }
      expr+=cur+' '+k+' '; cur='0'; }
    upd();
  }
  function calc(){
    const full=(expr+cur).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    if(!/^[\d+\-*/(). %]+$/.test(full)) return;
    try{ let r=Function('"use strict";return('+full+')')();
      if(!isFinite(r)){ cur='错误'; } else { r=Math.round(r*1e10)/1e10; expr=expr+cur+' ='; cur=String(r); }
      done=true;
    }catch(_){ cur='错误'; done=true; }
  }
  for(const [k,cls] of keys){ const b=document.createElement('button');
    b.className='ckey '+cls; b.textContent=k; b.onclick=()=>press(k); kb.appendChild(b); }
  win.body.tabIndex=0;
  win.body.addEventListener('keydown',e=>{
    const map={'*':'×','/':'÷','-':'−','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','+':'+','%':'%','.':'.'};
    if(/^\d$/.test(e.key)) press(e.key);
    else if(map[e.key]!==undefined){ e.preventDefault(); press(map[e.key]); } });
  upd();
}

<script>
/* ================================================================
   压缩包引擎：ZIP(JSZip) / GZ(DecompressionStream) / TAR / TAR.GZ / 7Z(wasm)
================================================================ */
function untar(buf){
  const u8=new Uint8Array(buf), files=[]; let off=0;
  const str=(s,l)=>{ let out=''; for(let i=s;i<s+l&&u8[i];i++) out+=String.fromCharCode(u8[i]); return out; };
  while(off+512<=u8.length){
    const name=str(off,100); if(!name) break;
    const size=parseInt(str(off+124,12).trim(),8)||0;
    const type=String.fromCharCode(u8[off+156]||48);
    const prefix=str(off+345,155);
    const full=(prefix?prefix+'/':'')+name;
    if(type==='0'||type==='\0'||type==='') files.push({name:full,buf:u8.slice(off+512,off+512+size),dir:false});
    else if(type==='5') files.push({name:full,dir:true});
    off+=512+Math.ceil(size/512)*512;
  }
  return files;
}
async function gunzip(buf){
  if(!window.DecompressionStream) throw new Error('浏览器不支持 DecompressionStream');
  const ds=new DecompressionStream('gzip');
  return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
}
async function extractArchive(path){
  const e=extOf(path), nm=baseOf(path), dir=parentOf(path);
  toast('正在解压 '+nm+' …');
  try{
    const destName=await fs.uniqueName(dir,stem(nm.replace(/\.tar$/i,''))+'_解压');
    const dest=dir+'/'+destName;
    let count=0;
    const writeEntry=async(rel,data)=>{ rel=rel.replace(/\\/g,'/').split('/').filter(s=>s&&s!=='..').join('/');
      if(!rel) return; await fs.writeFile(dest+'/'+rel,new Blob([data])); count++; };
    const buf=await fs.readFile(path);
    if(e==='zip'){
      if(!window.JSZip) throw new Error('JSZip 未加载');
      const zip=await JSZip.loadAsync(buf);
      await fs.mkdir(dest);
      for(const [rel,f] of Object.entries(zip.files)){
        if(f.dir){ await fs.mkdir(dest+'/'+rel.replace(/\/$/,'')); continue; }
        await writeEntry(rel,await f.async('arraybuffer')); }
    }else if(e==='tar'){
      await fs.mkdir(dest);
      for(const f of untar(buf)){ if(f.dir) await fs.mkdir(dest+'/'+f.name); else await writeEntry(f.name,f.buf); }
    }else if(e==='tgz'||(e==='gz'&&/\.tar\.gz$/i.test(nm))){
      const tarBuf=await gunzip(buf); await fs.mkdir(dest);
      for(const f of untar(tarBuf)){ if(f.dir) await fs.mkdir(dest+'/'+f.name); else await writeEntry(f.name,f.buf); }
    }else if(e==='gz'){
      const out=await gunzip(buf);
      const outName=await fs.uniqueName(dir,stem(nm));
      await fs.writeFile(dir+'/'+outName,new Blob([out])); count=1;
    }else if(e==='7z'){
      if(!window.SevenZipFactory) throw new Error('7z-wasm 未加载（需网络）');
      const sz=await SevenZipFactory({locateFile:f=>'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/'+f,print:()=>{},printErr:()=>{}});
      sz.FS.writeFile('/in.7z',new Uint8Array(buf));
      sz.FS.mkdir('/out');
      sz.callMain(['x','/in.7z','-o/out','-y','-bso0','-bsp0']);
      await fs.mkdir(dest);
      const walk=async(p,rel)=>{
        for(const n of sz.FS.readdir(p)){ if(n==='.'||n==='..') continue;
          const fp=p+'/'+n, s=sz.FS.stat(fp);
          if(sz.FS.isDir(s.mode)){ await fs.mkdir(dest+'/'+(rel?rel+'/':'')+n); await walk(fp,(rel?rel+'/':'')+n); }
          else await writeEntry((rel?rel+'/':'')+n,sz.FS.readFile(fp)); } };
      await walk('/out','');
    }else throw new Error('不支持的压缩格式：'+e);
    touchDir(dir); toast(`解压完成，共 ${count} 个文件`,'ok');
  }catch(err){ toast('解压失败：'+err.message,'error'); }
}

    <button class="abtn" data-a="reset" disabled>${I.refresh}<span class="bl">重启</span></button>
    <button class="abtn" data-a="lock" disabled>${I.mouse}<span class="bl">锁定鼠标</span></button>
    <span class="sp" style="flex:1"></span><span class="vm-st" style="font-size:11.5px;color:var(--txt2);font-family:var(--font-mono)">未启动</span>
   </div>
   <div class="vm-screen"><div id="${scId}">
     <div id="vmtext" style="white-space:pre;font:14px monospace;line-height:14px"></div>
     <canvas style="display:none"></canvas>
   </div></div>
   <div class="statusbar"><span>v86 0.5.319 · JS/WASM 同版本 · BIOS 固定 commit</span><span class="sp"></span><span>Esc 释放鼠标</span></div>`;
  let emulator=null,paused=false;
  const stEl=$('.vm-st',win.body);
  function boot(buf,fname){
    if(!window.V86){ toast('libv86 未加载（需网络）','error'); return; }
    if(emulator){ try{emulator.destroy();}catch(_){} emulator=null; }
    const e=extOf(fname);
    const media={};
    if(e==='iso') media.cdrom={buffer:buf};
    else if(e==='img'||e==='fda'||e==='bin') media.fda={buffer:buf};
    else media.hda={buffer:buf};
    stEl.textContent='启动中… '+fname;
    emulator=new V86({
      wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
      screen_container:document.getElementById(scId),
      bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
      vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
      memory_size:128*1024*1024, vga_memory_size:8*1024*1024,
      autostart:true, ...media });
    emulator.add_listener('emulator-ready',()=>{ stEl.textContent='运行中 · '+fname;
      ['pause','reset','lock'].forEach(a=>$(`[data-a=${a}]`,win.body).disabled=false); });
  }
  $('[data-a=pickvfs]',win.body).onclick=async()=>{
    const p=await pickPathDialog('选择磁盘镜像 (.iso / .img …)',null); if(!p) return;
    try{ toast('正在载入镜像…'); boot(await fs.readFile(p),baseOf(p)); }catch(e){ toast(e.message,'error'); } };
  $('[data-a=picklocal]',win.body).onclick=()=>{ const inp=$('#pickOne'); inp.accept='.iso,.img,.bin,.fda,.hda'; inp.value='';
    inp.onchange=async()=>{ const f=inp.files[0]; if(f) boot(await f.arrayBuffer(),f.name); };
    inp.click(); };
  $('[data-a=pause]',win.body).onclick=e=>{ if(!emulator)return;
    paused=!paused; paused?emulator.stop():emulator.run();
    e.currentTarget.innerHTML=paused?I.play:I.pause; stEl.textContent=paused?'已暂停':'运行中'; };
  $('[data-a=reset]',win.body).onclick=()=>{ if(emulator){ emulator.restart(); stEl.textContent='重启中…'; } };
  $('[data-a=lock]',win.body).onclick=()=>{ if(emulator){ try{ emulator.lock_mouse(); toast('鼠标已锁定，按 Esc 释放'); }catch(e){ toast('鼠标锁定失败：'+e.message,'error'); } } };
  win.onClose=()=>{ if(emulator){ try{emulator.destroy();}catch(_){}} };
  if(imagePath) (async()=>{ try{ boot(await fs.readFile(imagePath),baseOf(imagePath)); }catch(e){ toast(e.message,'error'); } })();
}

/* ================================================================
   设置
================================================================ */
function openSettings(section='appearance'){
  const win=WM.create({title:'设置',icon:I.settings,width:760,height:560,app:'settings'});
  win.body.innerHTML=`<div class="st-root"><div class="st-nav"></div><div class="st-main"></div></div>`;
  const nav=$('.st-nav',win.body), main=$('.st-main',win.body);
  const SECTIONS=[['appearance','外观与个性化',I.wall],['storage','存储空间',I.hdd],['mounts','本地挂载',I.upload],['system','系统与重置',I.settings],['about','关于',I.info]];
  function renderNav(cur){
    nav.innerHTML='';
    for(const [id,label,ic] of SECTIONS){ const d=document.createElement('div');
      d.className='fx-si'+(id===cur?' cur':''); d.innerHTML=`${ic}<span>${esc(label)}</span>`;
      d.onclick=()=>render(id); nav.appendChild(d); }
  }
  async function render(sec){
    renderNav(sec);
    if(sec==='appearance'){
      const curWall=Conf.get('wall',{type:'preset',i:0});
      main.innerHTML=`<h2>外观与个性化</h2><div class="desc">主题、壁纸与桌面布局</div>
       <div class="st-card"><h3>${I.theme}主题模式</h3>
        <div class="st-row"><div>深色模式<div class="hint">墨松绿黑 / 暖纸浅色</div></div><div class="toggle ${Conf.get('theme','dark')==='dark'?'on':''}" id="stTheme"></div></div></div>
       <div class="st-card"><h3>${I.wall}壁纸</h3>
        <div class="wp-grid">${WALLS.map((w,i)=>`<div class="wp-item ${curWall.type==='preset'&&curWall.i===i?'cur':''}" data-i="${i}" style="background:${w.css.replace(/"/g,'&quot;')}" title="${w.name}"></div>`).join('')}
         <div class="wp-item ${curWall.type==='file'?'cur':''}" id="stWallUp" style="display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line2);color:var(--txt2);font-size:12px">上传壁纸</div></div></div>
       <div class="st-card"><h3>${I.grid}桌面图标大小</h3>
        <div class="st-row"><input type="range" min="80" max="130" value="${Conf.get('cellW',96)}" id="stCell" style="flex:1"><span class="hint" id="stCellV">${Conf.get('cellW',96)}px</span></div>
        <div class="st-row"><div>重排桌面图标<div class="hint">清除保存的图标位置</div></div><button class="dlgbtn" id="stIconReset">重排</button></div></div>`;
      $('#stTheme').onclick=e=>{ const on=!e.currentTarget.classList.contains('on');
        e.currentTarget.classList.toggle('on',on); Conf.set('theme',on?'dark':'light'); applyTheme(); };
      $$('.wp-item[data-i]',main).forEach(el=>el.onclick=()=>{ Conf.set('wall',{type:'preset',i:+el.dataset.i}); applyWallpaper(); render('appearance'); });
      $('#stWallUp').onclick=()=>$('#pickWall').click();
      $('#stCell').oninput=e=>{ const v=+e.target.value; $('#stCellV').textContent=v+'px';
        Conf.set('cellW',v); document.documentElement.style.setProperty('--cell-w',v+'px');
        document.documentElement.style.setProperty('--cell-h',(v+10)+'px'); refreshDesktop(); };
      $('#stIconReset').onclick=()=>{ desk.pos={}; desk.savePos(); refreshDesktop(); toast('已重排','ok'); };
    }
    if(sec==='storage'){
      main.innerHTML=`<h2>存储空间</h2><div class="desc">后端：${FS_MODE} · OPFS + IndexedDB + localStorage + Cookie 协同</div>
        <div class="st-card"><h3>${I.hdd}浏览器配额</h3><div id="stQuota">计算中…</div></div>
        <div class="st-card"><h3>${I.folder}目录占用分布</h3><div id="stDirs">扫描中…</div></div>`;
      try{ const est=await navigator.storage.estimate();
        const pct=est.quota?Math.min(100,est.usage/est.quota*100):0;
        $('#stQuota').innerHTML=`<div class="stbar"><i style="width:${Math.max(pct,0.5)}%;background:var(--acc)"></i></div>
          <div class="stlegend"><span>已用 <b>${fmtSize(est.usage)}</b></span><span>可用配额 <b>${fmtSize(est.quota)}</b></span><span>占用率 <b>${pct.toFixed(2)}%</b></span>
          <span>持久化：<b>${await (navigator.storage.persisted?navigator.storage.persisted():false)?'已授予':'未授予'}</b></span></div>`;
      }catch(_){ $('#stQuota').textContent='当前环境无法获取配额信息'; }
      (async()=>{
        const tops=await fs.readdir('/');
        const palette=['#e6ac48','#54d6a4','#5db3e8','#b48ce0','#e2604c','#6fcf7c','#c9a15a','#8fa3e8'];
        const rows=[];
        for(const t of tops){ if(t.mount) continue;
          const p='/'+t.name;
          rows.push({name:t.name,size:t.kind==='dir'?await fs.dirSize(p):(await fs.stat(p)).size||0}); }
        rows.sort((a,b)=>b.size-a.size);
        const total=rows.reduce((s,r)=>s+r.size,0)||1;
        $('#stDirs').innerHTML=`<div class="stbar">${rows.map((r,i)=>`<i style="width:${Math.max(r.size/total*100,0.4)}%;background:${palette[i%palette.length]}"></i>`).join('')}</div>
          <div class="stlegend">${rows.map((r,i)=>`<span><span class="dot" style="background:${palette[i%palette.length]}"></span>${esc(r.name)} · ${fmtSize(r.size)}（${(r.size/total*100).toFixed(1)}%）</span>`).join('')}
          <span>合计 <b>${fmtSize(total)}</b></span></div>`;
      })();
    }
    if(sec==='mounts'){
      const locals=mounts.filter(m=>m.local);
      const remembered=JSON.parse(localStorage.getItem('pineink.mounts')||'[]');
      main.innerHTML=`<h2>本地文件夹挂载</h2><div class="desc">File System Access API · 挂载到 /mnt/local/ · 与虚拟文件完全同权</div>
        <div class="st-card"><h3>${I.hdd}已挂载</h3>
        ${locals.length?locals.map(m=>`<div class="st-row"><div>${esc(m.label)}<div class="hint">${esc(m.prefix)}</div></div><button class="dlgbtn" data-un="${esc(m.prefix)}">卸载</button></div>`).join(''):'<div class="hint" style="padding:6px 0">暂无挂载</div>'}
        <div class="st-row"><div>挂载新的本地文件夹</div><button class="dlgbtn pri" id="stMount">选择文件夹…</button></div></div>
        ${remembered.length?`<div class="st-card"><h3>${I.info}权限提醒</h3><div class="hint">浏览器安全策略要求刷新后重新授权。上次曾挂载：${remembered.map(esc).join('、')}</div></div>`:''}`;
      $$('[data-un]',main).forEach(b=>b.onclick=()=>{ unmountLocal(b.dataset.un); render('mounts'); });
      $('#stMount').onclick=async()=>{ await mountLocalFolder(); render('mounts'); };
    }
    if(sec==='system'){
      main.innerHTML=`<h2>系统与重置</h2><div class="desc">危险区域，请谨慎操作</div>
        <div class="st-card"><h3>${I.refresh}维护</h3>
          <div class="st-row"><div>重新载入系统<div class="hint">文件不受影响</div></div><button class="dlgbtn" id="stReload">重新载入</button></div>
          <div class="st-row"><div>清除界面偏好<div class="hint">主题 / 壁纸 / 图标位置（保留文件）</div></div><button class="dlgbtn" id="stPrefs">清除</button></div></div>
        <div class="st-card" style="border-color:var(--danger)"><h3 style="color:var(--danger)">${I.warn}一键重置</h3>
          <div class="st-row"><div>抹掉全部数据<div class="hint">清空 OPFS 文件系统、IndexedDB、localStorage 并重建初始环境</div></div>
          <button class="dlgbtn dng" id="stReset">重置系统</button></div></div>`;
      $('#stReload').onclick=()=>location.reload();
      $('#stPrefs').onclick=()=>{ localStorage.removeItem('pineink.conf'); localStorage.removeItem('pineink.iconpos'); location.reload(); };
      $('#stReset').onclick=async()=>{
        if(!await uiConfirm('重置系统','将永久删除虚拟文件系统中的所有文件与设置，且无法恢复。确定继续？',true)) return;
        try{ const root=await navigator.storage.getDirectory();
          for await(const h of root.values()) await root.removeEntry(h.name,{recursive:true}); }catch(_){}
        try{ indexedDB.deleteDatabase('pineink-fs'); }catch(_){}
        localStorage.clear(); document.cookie='pineink_boot=;max-age=0;path=/';
        location.reload(); };
    }
    if(sec==='about'){
      main.innerHTML=`<h2>关于 松墨 OS</h2><div class="desc">PineInk WebOS · 单文件浏览器桌面系统</div>
        <div class="st-card"><h3>${I.logo}系统信息</h3>
          <div class="st-row"><span>存储后端</span><b>${FS_MODE}</b></div>
          <div class="st-row"><span>窗口管理</span><b>八向缩放 · Aero Snap / Peek</b></div>
          <div class="st-row"><span>内置应用</span><b>${APPS.length} 个</b></div>
          <div class="st-row"><span>解压引擎</span><b>ZIP / GZ / TAR / TGZ / 7Z</b></div>
          <div class="st-row"><span>虚拟机</span><b>v86 0.5.319</b></div></div>
        <div class="st-card"><h3>${I.info}技术栈</h3><div class="hint" style="line-height:2">OPFS（源私有文件系统）持久化 · IndexedDB 降级 · File System Access API 本地挂载<br>CodeMirror 5 编辑内核 · JSZip / 7z-wasm · 原生 Drag & Drop 双向拖拽</div></div>`;
    }
  }
  render(section);
}

/* ================================================================
   启动（直接进入系统，无假加载动画）
================================================================ */
(async function boot(){
  try{ await fsInit(); }catch(e){ toast('文件系统初始化异常：'+e.message,'error'); }
  const cw=Conf.get('cellW',96);
  document.documentElement.style.setProperty('--cell-w',cw+'px');
  document.documentElement.style.setProperty('--cell-h',(cw+10)+'px');
  applyTheme(); applyWallpaper(); renderStartMenu();
  await refreshDesktop();
  const remembered=JSON.parse(localStorage.getItem('pineink.mounts')||'[]');
  if(remembered.length&&window.showDirectoryPicker)
    setTimeout(()=>toast(`上次挂载过本地文件夹（${remembered.join('、')}），浏览器要求重新授权，可在设置 → 本地挂载中恢复`),1500);
})();
</script>
