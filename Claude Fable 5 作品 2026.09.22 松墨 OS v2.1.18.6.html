<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>松墨 OS · PineInk WebOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<style>
/* ============ 主题变量 ============ */
:root{
  --font-ui:'Noto Sans SC','Bricolage Grotesque',sans-serif;
  --font-disp:'Bricolage Grotesque','Noto Sans SC',sans-serif;
  --font-mono:'IBM Plex Mono','Noto Sans SC',monospace;
  --tb-h:52px; --radius:14px; --cell-w:96px; --cell-h:106px;
}
:root[data-theme="dark"]{
  --bg0:#0a100d; --bg1:#101915; --bg2:#16221d;
  --panel:rgba(15,24,20,.82); --panel-hd:rgba(22,34,28,.9); --panel-solid:#121c17;
  --line:rgba(214,238,225,.09); --line2:rgba(214,238,225,.16);
  --txt:#e8f0ea; --txt2:#8ba396; --txt3:#5b6f64;
  --acc:#e6ac48; --acc-soft:rgba(230,172,72,.16); --acc-txt:#1d1607;
  --acc2:#54d6a4; --danger:#e2604c;
  --shadow:0 22px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.4);
  --sel:rgba(230,172,72,.22);
  --glass-blur:blur(22px) saturate(1.35);
}
:root[data-theme="light"]{
  --bg0:#ece5d3; --bg1:#f4efe3; --bg2:#fbf8ef;
  --panel:rgba(252,249,240,.84); --panel-hd:rgba(255,253,246,.92); --panel-solid:#f8f4e9;
  --line:rgba(58,66,48,.13); --line2:rgba(58,66,48,.22);
  --txt:#28322b; --txt2:#63705f; --txt3:#98a190;
  --acc:#a8730f; --acc-soft:rgba(168,115,15,.14); --acc-txt:#fff8ea;
  --acc2:#177a56; --danger:#bb4430;
  --shadow:0 18px 50px rgba(70,60,30,.28),0 4px 12px rgba(70,60,30,.18);
  --sel:rgba(168,115,15,.18);
  --glass-blur:blur(22px) saturate(1.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);color:var(--txt);background:var(--bg0);font-size:14px;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--txt3);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font-ui);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font-ui);color:var(--txt)}
svg{display:block}
.ico{width:1em;height:1em;flex:none}

/* ============ 壁纸 ============ */
#wallpaper{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:background .6s ease, filter .4s}
#wallpaper::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(0,0,0,.28));pointer-events:none}
:root[data-theme="light"] #wallpaper::after{background:radial-gradient(120% 90% at 50% 0%,transparent 60%,rgba(80,60,20,.14))}

/* ============ 桌面 ============ */
#desktop{position:fixed;inset:0 0 var(--tb-h) 0;z-index:1;overflow:hidden;touch-action:none}
#icons{position:absolute;inset:0}
.dicon{position:absolute;width:var(--cell-w);height:var(--cell-h);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding-top:10px;border-radius:12px;cursor:default;user-select:none;-webkit-user-select:none;transition:left .28s cubic-bezier(.22,1,.36,1),top .28s cubic-bezier(.22,1,.36,1),background .15s,box-shadow .15s;border:1px solid transparent}
.dicon:hover{background:rgba(255,255,255,.07)}
:root[data-theme="light"] .dicon:hover{background:rgba(255,255,255,.4)}
.dicon.sel{background:var(--sel);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc-soft)}
.dicon.dragging{opacity:.35;transition:none}
.dicon.droptarget{background:var(--acc-soft);border-color:var(--acc)}
.dicon .dic{width:52px;height:52px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.dicon .dic svg{width:100%;height:100%}
.dicon .dlabel{font-size:12px;line-height:1.25;text-align:center;max-width:92px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.5);padding:1px 4px;border-radius:5px}
:root[data-theme="light"] .dicon .dlabel{color:#fff}
.dicon.appear{animation:iconIn .4s cubic-bezier(.22,1,.36,1) backwards}
@keyframes iconIn{from{opacity:0;transform:scale(.6) translateY(12px)}to{opacity:1;transform:none}}
#marquee{position:absolute;display:none;border:1.5px solid var(--acc);background:var(--acc-soft);border-radius:4px;z-index:50;pointer-events:none}
#snapGhost{position:fixed;display:none;z-index:9998;border:2px solid var(--acc);background:var(--acc-soft);border-radius:var(--radius);backdrop-filter:blur(2px);transition:all .18s cubic-bezier(.22,1,.36,1);pointer-events:none}
#dropHint{position:fixed;inset:14px;z-index:9999;display:none;border:2.5px dashed var(--acc);border-radius:20px;background:var(--acc-soft);pointer-events:none;align-items:center;justify-content:center;font-size:20px;font-family:var(--font-disp);color:var(--acc);letter-spacing:.1em}
.touchGhost{position:fixed;z-index:10001;pointer-events:none;opacity:.85;transform:translate(-50%,-50%) scale(1.05);filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}

/* ============ 窗口 ============ */
#windows{position:fixed;inset:0;z-index:2;pointer-events:none}
.win{position:absolute;min-width:280px;min-height:160px;background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;animation:winIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes winIn{from{opacity:0;transform:scale(.92) translateY(18px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .22s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.92) translateY(14px)}}
.win.maxed{border-radius:0;border:none}
.win.focused{border-color:var(--acc);box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px var(--acc-soft)}
:root[data-theme="light"] .win.focused{box-shadow:0 20px 56px rgba(70,60,30,.3),0 0 0 1px var(--acc-soft)}
body.peeking .win{opacity:.12;transition:opacity .2s}
body.peeking .win.peek-target{opacity:1}
.win.snapAnim{transition:left .22s cubic-bezier(.22,1,.36,1),top .22s cubic-bezier(.22,1,.36,1),width .22s cubic-bezier(.22,1,.36,1),height .22s cubic-bezier(.22,1,.36,1)}
.win-tb{height:42px;flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 0 14px;background:var(--panel-hd);border-bottom:1px solid var(--line);cursor:default;user-select:none;-webkit-user-select:none;touch-action:none}
.win-tb .wico{width:17px;height:17px;color:var(--acc)}
.win-tb .wico svg{width:100%;height:100%}
.win-tb .wtitle{flex:1;font-size:13px;font-weight:500;letter-spacing:.02em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--font-disp)}
.win-btns{display:flex;gap:2px}
.wbtn{width:38px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--txt2);transition:background .12s,color .12s}
.wbtn:hover{background:var(--line);color:var(--txt)}
.wbtn.wclose:hover{background:var(--danger);color:#fff}
.wbtn svg{width:13px;height:13px}
.win-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.rz{position:absolute;z-index:5;touch-action:none}
.rz-n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}.rz-s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.rz-e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}.rz-w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz-ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize}.rz-nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz-se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize}.rz-sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize}
.win.maxed .rz{display:none}
.win.fullscreen-manga .win-tb{display:none}
.win.fullscreen-manga .appbar{display:none}
.win.fullscreen-manga{border-radius:0;border:none}

/* ============ 任务栏 ============ */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:9000;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-top:1px solid var(--line)}
#startBtn{width:42px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--acc);transition:background .15s,transform .15s}
#startBtn:hover{background:var(--acc-soft)}
#startBtn:active{transform:scale(.92)}
#startBtn svg{width:24px;height:24px}
#tasks{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#tasks::-webkit-scrollbar{display:none}
.task{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;font-size:12.5px;color:var(--txt2);border:1px solid transparent;transition:all .15s;max-width:180px;white-space:nowrap;position:relative;flex:none}
.task .tic{width:16px;height:16px;color:var(--acc)}
.task .tic svg{width:100%;height:100%}
.task span.tl{overflow:hidden;text-overflow:ellipsis}
.task:hover{background:var(--line);color:var(--txt)}
.task.active{background:var(--acc-soft);color:var(--txt);border-color:var(--line2)}
.task.active::after{content:'';position:absolute;bottom:2px;left:12px;right:12px;height:2.5px;border-radius:2px;background:var(--acc)}
.task.min{opacity:.55}
#tray{display:flex;align-items:center;gap:4px}
.traybtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:all .15s}
.traybtn:hover{background:var(--line);color:var(--txt)}
.traybtn svg{width:17px;height:17px}
#clock{padding:4px 12px;text-align:center;line-height:1.3;border-radius:9px;cursor:default}
#clock:hover{background:var(--line)}
#clock .t{font-family:var(--font-mono);font-size:13.5px;font-weight:600;letter-spacing:.03em}
#clock .d{font-size:10px;color:var(--txt2)}
#showDesk{width:12px;height:40px;border-left:1px solid var(--line2);margin-left:2px;border-radius:0 8px 8px 0}
#showDesk:hover{background:var(--acc-soft)}

/* Aero Peek 预览卡 */
#peekCard{position:fixed;z-index:9500;display:none;flex-direction:column;gap:7px;padding:11px 13px;background:var(--panel);backdrop-filter:var(--glass-blur);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);animation:menuIn .18s ease;pointer-events:none;max-width:240px}
#peekCard .pk-t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
#peekCard .pk-t svg{width:15px;height:15px;color:var(--acc)}
#peekCard .pk-shot{width:200px;height:120px;border-radius:8px;border:1px solid var(--line);background:var(--bg1);overflow:hidden;position:relative}
#peekCard .pk-shot>div{transform:scale(.2);transform-origin:top left;width:1000px;height:600px;pointer-events:none}

/* ============ 开始菜单 ============ */
#startMenu{position:fixed;left:10px;bottom:calc(var(--tb-h) + 10px);width:420px;max-width:calc(100vw - 20px);max-height:min(600px,calc(100vh - var(--tb-h) - 24px));z-index:9100;background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden;transform-origin:bottom left}
#startMenu.open{display:flex;animation:smIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes smIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:none}}
#startMenu .sm-head{padding:20px 22px 10px;display:flex;align-items:baseline;gap:10px}
#startMenu .sm-head .logo{font-family:var(--font-disp);font-size:22px;font-weight:700;letter-spacing:.02em}
#startMenu .sm-head .logo em{color:var(--acc);font-style:normal}
#startMenu .sm-head .sub{font-size:11px;color:var(--txt3);font-family:var(--font-mono)}
#smApps{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 16px 14px;align-content:start}
.smapp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 11px;border-radius:13px;transition:background .14s,transform .14s;animation:smAppIn .4s cubic-bezier(.22,1,.36,1) backwards}
@keyframes smAppIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.smapp:hover{background:var(--line);transform:translateY(-2px)}
.smapp:active{transform:scale(.94)}
.smapp .ic{width:40px;height:40px}
.smapp .ic svg{width:100%;height:100%}
.smapp .nm{font-size:11.5px;color:var(--txt2);text-align:center}
.smapp:hover .nm{color:var(--txt)}
#startMenu .sm-foot{border-top:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
#startMenu .sm-foot .u{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt2)}
#startMenu .sm-foot .u .av{width:28px;height:28px;border-radius:9px;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;color:var(--acc)}
#startMenu .sm-foot .u .av svg{width:15px;height:15px}
.sm-fbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.sm-fbtn:hover{background:var(--line);color:var(--txt)}
.sm-fbtn svg{width:16px;height:16px}

/* ============ 右键菜单 ============ */
#ctxMenu{position:fixed;z-index:9600;min-width:200px;background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:5px;display:none}
#ctxMenu.open{display:block;animation:menuIn .16s ease}
@keyframes menuIn{from{opacity:0;transform:scale(.95) translateY(-4px)}to{opacity:1;transform:none}}
.cmi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;cursor:default;position:relative;color:var(--txt)}
.cmi:hover{background:var(--acc-soft)}
.cmi.danger{color:var(--danger)}
.cmi svg{width:15px;height:15px;color:var(--txt2);flex:none}
.cmi:hover svg{color:var(--acc)}
.cmi.danger svg{color:var(--danger)}
.cmi .arrow{margin-left:auto;width:11px;height:11px}
.cmi .sub{display:none;position:absolute;left:calc(100% - 4px);top:-6px;min-width:170px;background:var(--panel);backdrop-filter:var(--glass-blur);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:5px}
.cmi:hover>.sub{display:block;animation:menuIn .14s ease}
.cm-sep{height:1px;background:var(--line);margin:4px 8px}
#ctxMenu.subleft .cmi .sub{left:auto;right:calc(100% - 4px)}

/* ============ 通用应用 UI ============ */
.appbar{flex:none;display:flex;align-items:center;gap:5px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.abtn{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--txt2);transition:all .13s;border:1px solid transparent;white-space:nowrap}
.abtn:hover{background:var(--line);color:var(--txt)}
.abtn.on{background:var(--acc-soft);color:var(--acc);border-color:var(--line2)}
.abtn.primary{background:var(--acc);color:var(--acc-txt);font-weight:600}
.abtn.primary:hover{filter:brightness(1.1)}
.abtn svg{width:14px;height:14px}
.abtn:disabled{opacity:.35;pointer-events:none}
.asep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.ainput{height:30px;background:var(--bg1);border:1px solid var(--line2);border-radius:8px;padding:0 10px;font-size:12.5px;outline:none;transition:border .15s}
.ainput:focus{border-color:var(--acc)}
select.ainput{cursor:pointer}
.statusbar{flex:none;display:flex;align-items:center;gap:14px;padding:5px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt2);font-family:var(--font-mono);flex-wrap:wrap}
.statusbar .sp{flex:1}

/* ============ 资源管理器 ============ */
.fx{display:flex;flex:1;overflow:hidden}
.fx-side{width:190px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
.fx-side h4{font-size:10.5px;color:var(--txt3);letter-spacing:.14em;padding:8px 10px 5px;font-weight:600}
.fx-si{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--txt2);cursor:default;transition:all .12s}
.fx-si:hover{background:var(--line);color:var(--txt)}
.fx-si.cur{background:var(--acc-soft);color:var(--txt)}
.fx-si svg{width:15px;height:15px;color:var(--acc);flex:none}
.fx-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.fx-crumbs{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;background:var(--bg1);border:1px solid var(--line2);border-radius:8px;height:30px;padding:0 6px;min-width:120px}
.fx-crumbs::-webkit-scrollbar{display:none}
.crumb{padding:3px 8px;border-radius:6px;font-size:12.5px;color:var(--txt2);white-space:nowrap;cursor:default}
.crumb:hover{background:var(--line);color:var(--txt)}
.crumb.last{color:var(--txt);font-weight:500}
.crumb-sep{color:var(--txt3);font-size:11px}
.fx-list{flex:1;overflow:auto;position:relative}
.fx-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:480px}
.fx-table th{position:sticky;top:0;z-index:2;background:var(--panel-hd);backdrop-filter:var(--glass-blur);text-align:left;font-size:11.5px;font-weight:500;color:var(--txt2);padding:8px 12px;border-bottom:1px solid var(--line);cursor:default;user-select:none;white-space:nowrap;overflow:hidden}
.fx-table th:hover{color:var(--txt)}
.fx-table th .colrz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none}
.fx-table th .colrz:hover{background:var(--acc-soft)}
.fx-table td{padding:7px 12px;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.fx-row{user-select:none;-webkit-user-select:none}
.fx-row td:first-child{display:flex;align-items:center;gap:9px}
.fx-row .fic{width:19px;height:19px;flex:none}
.fx-row .fic svg{width:100%;height:100%}
.fx-row:hover td{background:var(--line)}
.fx-row.sel td{background:var(--sel)}
.fx-row.cutrow{opacity:.45}
.fx-row td.dim{color:var(--txt2);font-family:var(--font-mono);font-size:11.5px}
.fx-empty{padding:60px 20px;text-align:center;color:var(--txt3);font-size:13px}
.fx-empty svg{width:44px;height:44px;margin:0 auto 12px;opacity:.5}
.fx-marquee{position:absolute;border:1.5px solid var(--acc);background:var(--acc-soft);border-radius:3px;z-index:30;display:none;pointer-events:none}

/* ============ 记事本/表格 ============ */
.np-text{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;padding:16px 18px;font-family:var(--font-mono);line-height:1.7;color:var(--txt);tab-size:2}
.tbl-wrap{flex:1;overflow:auto}
.tbl-grid{border-collapse:collapse;font-size:12.5px;min-width:100%}
.tbl-grid th{background:var(--panel-hd);position:sticky;top:0;padding:7px 12px;border:1px solid var(--line);font-weight:600;color:var(--acc);font-family:var(--font-mono);white-space:nowrap;text-align:left}
.tbl-grid td{padding:6px 12px;border:1px solid var(--line);white-space:nowrap}
.tbl-grid tr:nth-child(even) td{background:rgba(255,255,255,.02)}
:root[data-theme="light"] .tbl-grid tr:nth-child(even) td{background:rgba(0,0,0,.025)}

/* ============ 图片查看器/漫画 ============ */
.iv-stage{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--bg1) 0 25%,var(--bg0) 0 50%) 0 0/22px 22px;cursor:grab;touch-action:none}
.iv-stage:active{cursor:grabbing}
.iv-stage img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transition:transform .12s ease-out}
.manga-scroll{flex:1;overflow-y:auto;background:#000;display:flex;flex-direction:column;align-items:center}
.manga-scroll img{width:100%;max-width:1000px;display:block;pointer-events:none}
.manga-load{color:#c9b57e;font-family:var(--font-mono);font-size:13px;padding:40px;text-align:center}
.manga-exit{position:absolute;top:10px;right:12px;z-index:40;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:none;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2)}
.win.fullscreen-manga .manga-exit{display:flex}

/* ============ 编辑器 ============ */
.ed-root{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ed-split{flex:1;display:flex;overflow:hidden;position:relative}
.ed-pane{display:flex;flex-direction:column;overflow:hidden;min-width:120px}
.ed-pane.edit{min-width:200px}
.ed-pane .CodeMirror{flex:1;height:auto;font-family:var(--font-mono);font-size:13px;line-height:1.6}
:root[data-theme="light"] .ed-pane .cm-s-material-darker.CodeMirror{filter:none}
.ed-divider{width:7px;flex:none;cursor:col-resize;background:var(--line);transition:background .15s;touch-action:none}
.ed-divider:hover,.ed-divider.on{background:var(--acc)}
.ed-preview{flex:1;background:#fff;border:none;width:100%}
.ed-findbar{display:none;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg1);flex-wrap:wrap}
.ed-findbar.open{display:flex}
.ed-findbar .fmini{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--txt2);border:1px solid transparent}
.ed-findbar .fmini:hover{background:var(--line);color:var(--txt)}
.ed-findbar .fmini.on{background:var(--acc-soft);color:var(--acc);border-color:var(--line2)}
.ed-findbar .fcount{font-family:var(--font-mono);font-size:11px;color:var(--txt2);min-width:52px;text-align:center}
.cm-matchhighlight-all{background:rgba(230,172,72,.25);border-radius:2px}
.cm-matchhighlight-cur{background:rgba(84,214,164,.45);border-radius:2px;outline:1px solid var(--acc2)}
.cm-trailingspace{background:rgba(226,96,76,.3)}

/* ============ 浏览器 ============ */
.br-frame{flex:1;border:none;width:100%;background:#fff}

/* ============ 计算器 ============ */
.calc{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px}
.calc-disp{background:var(--bg1);border:1px solid var(--line2);border-radius:14px;padding:14px 18px;text-align:right;overflow:hidden}
.calc-disp .expr{font-size:12px;color:var(--txt3);font-family:var(--font-mono);height:16px;white-space:nowrap}
.calc-disp .val{font-size:34px;font-weight:600;font-family:var(--font-disp);letter-spacing:.02em;white-space:nowrap}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ckey{border-radius:12px;font-size:17px;font-family:var(--font-disp);font-weight:500;background:var(--line);transition:all .1s;display:flex;align-items:center;justify-content:center;min-height:44px}
.ckey:hover{background:var(--line2)}
.ckey:active{transform:scale(.94)}
.ckey.op{color:var(--acc);font-weight:700}
.ckey.eq{background:var(--acc);color:var(--acc-txt);font-weight:700}
.ckey.fn{color:var(--txt2);font-size:14px}

/* ============ 画板 ============ */
.pb-stage{flex:1;overflow:hidden;position:relative;background:repeating-conic-gradient(var(--bg1) 0 25%,var(--bg0) 0 50%) 0 0/20px 20px;touch-action:none}
.pb-stage canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:crosshair;touch-action:none;max-width:96%;max-height:96%}
.swatch{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:transform .12s;flex:none}
.swatch:hover{transform:scale(1.15)}
.swatch.on{border-color:var(--txt);transform:scale(1.12)}

/* ============ 设置 ============ */
.st-root{flex:1;display:flex;overflow:hidden}
.st-nav{width:170px;flex:none;border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto}
.st-main{flex:1;overflow-y:auto;padding:22px 26px}
.st-main h2{font-family:var(--font-disp);font-size:19px;margin-bottom:4px}
.st-main .desc{font-size:12px;color:var(--txt2);margin-bottom:18px}
.st-card{background:var(--bg1);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}
.st-card h3{font-size:13.5px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.st-card h3 svg{width:15px;height:15px;color:var(--acc)}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}
.st-row .hint{font-size:11.5px;color:var(--txt3)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wp-item{aspect-ratio:16/10;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative;overflow:hidden}
.wp-item:hover{transform:scale(1.04)}
.wp-item.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.stbar{height:14px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.stbar>i{height:100%;display:block}
.stlegend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:11.5px;color:var(--txt2)}
.stlegend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.toggle{width:42px;height:23px;border-radius:20px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle::after{content:'';position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s cubic-bezier(.22,1,.36,1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on{background:var(--acc)}
.toggle.on::after{left:22px}

/* ============ V86 ============ */
.vm-screen{flex:1;overflow:auto;background:#000;display:flex;align-items:center;justify-content:center}
#vmtext{white-space:pre;font:14px monospace;line-height:14px;color:#ddd}
.vm-screen canvas{display:block}

/* ============ 对话框 / Toast ============ */
#dlgMask{position:fixed;inset:0;z-index:9700;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#dlgMask.open{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}}
#dlgBox{width:min(400px,calc(100vw - 40px));background:var(--panel-solid);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:22px;animation:winIn .25s cubic-bezier(.22,1,.36,1)}
#dlgBox h3{font-family:var(--font-disp);font-size:16px;margin-bottom:8px}
#dlgBox .msg{font-size:13px;color:var(--txt2);margin-bottom:14px;line-height:1.6;word-break:break-all}
#dlgBox input{width:100%;height:36px;background:var(--bg1);border:1px solid var(--line2);border-radius:9px;padding:0 12px;outline:none;font-size:13.5px;margin-bottom:16px}
#dlgBox input:focus{border-color:var(--acc)}
#dlgBox .btns{display:flex;justify-content:flex-end;gap:8px}
.dlgbtn{height:34px;padding:0 18px;border-radius:9px;font-size:13px;background:var(--line);transition:all .13s}
.dlgbtn:hover{background:var(--line2)}
.dlgbtn.pri{background:var(--acc);color:var(--acc-txt);font-weight:600}
.dlgbtn.pri:hover{filter:brightness(1.1)}
.dlgbtn.dng{background:var(--danger);color:#fff;font-weight:600}
#toasts{position:fixed;right:16px;bottom:calc(var(--tb-h) + 14px);z-index:9800;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--panel-solid);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:11px;padding:11px 16px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .3s cubic-bezier(.22,1,.36,1);max-width:min(340px,calc(100vw - 32px))}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--acc2)}
.toast svg{width:16px;height:16px;flex:none;color:var(--acc)}
.toast.err svg{color:var(--danger)}.toast.ok svg{color:var(--acc2)}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* ============ 移动端 ============ */
@media (max-width:768px){
  :root{--tb-h:58px;--cell-w:82px;--cell-h:96px}
  .win{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tb-h))!important;border-radius:0;border:none}
  .rz{display:none!important}
  .fx-side{position:absolute;z-index:20;left:0;top:0;bottom:0;background:var(--panel-solid);transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .fx-side.open{transform:none}
  .st-nav{width:52px}
  .st-nav .fx-si span{display:none}
  .st-main{padding:16px}
  #startMenu{left:8px;right:8px;width:auto;bottom:calc(var(--tb-h) + 8px)}
  #smApps{grid-template-columns:repeat(4,1fr)}
  .task span.tl{display:none}
  .task{padding:0 11px}
  #clock .d{display:none}
  .dicon .dic{width:44px;height:44px}
  #showDesk{display:none}
  .appbar{gap:4px;padding:6px}
  .abtn{padding:0 8px}
  .abtn .bl{display:none}
}
.hide{display:none!important}

function fileIcon(name,kind,mount){
  if(kind==='dir') return {svg:mount?I.hdd:I.folder,color:mount?'#54d6a4':'#e6ac48'};
  const c=catOf(name);
  const map={image:['#54d6a4',I.fileImg],audio:['#b48ce0',I.fileAudio],video:['#e2604c',I.fileVideo],html:['#e8884a',I.fileHtml],code:['#5db3e8',I.fileCode],text:['#9db3a8',I.fileText],table:['#6fcf7c',I.fileTable],pdf:['#e05b6d',I.filePdf],zip:['#c9a15a',I.fileZip],vm:['#8fa3e8',I.fileVm]};

}

/* ---- Toast & 对话框 ---- */
function toast(msg,type='info'){
  const el=document.createElement('div'); el.className='toast '+(type==='error'?'err':type==='ok'?'ok':'');
  el.innerHTML=(type==='error'?I.warn:type==='ok'?I.check:I.info)+`<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out'); setTimeout(()=>el.remove(),260)},3200);
}
function dlg(opts){ // {title,msg,input,def,danger,okText}
  return new Promise(res=>{
    const mask=$('#dlgMask'),box=$('#dlgBox');
    box.innerHTML=`<h3>${esc(opts.title||'提示')}</h3>${opts.msg?`<div class="msg">${esc(opts.msg)}</div>`:''}
      ${opts.input!==undefined?`<input id="dlgIn" value="${esc(opts.def||'')}" spellcheck="false">`:''}
      <div class="btns"><button class="dlgbtn" id="dlgNo">取消</button><button class="dlgbtn ${opts.danger?'dng':'pri'}" id="dlgOk">${esc(opts.okText||'确定')}</button></div>`;
    mask.classList.add('open');
    const inp=$('#dlgIn');
    const done=v=>{mask.classList.remove('open'); res(v);};
    $('#dlgNo').onclick=()=>done(null);
    $('#dlgOk').onclick=()=>done(opts.input!==undefined?inp.value.trim():true);
    mask.onmousedown=e=>{if(e.target===mask)done(null)};
    if(inp){ inp.focus(); const i=inp.value.lastIndexOf('.'); inp.setSelectionRange(0,i>0?i:inp.value.length); inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value.trim()); if(e.key==='Escape')done(null);}; }
  });
}
const uiPrompt=(title,def='',msg='')=>dlg({title,def,msg,input:true});
const uiConfirm=(title,msg='',danger=false)=>dlg({title,msg,danger,okText:danger?'删除':'确定'});

/* ================================================================
   虚拟文件系统 VFS —— OPFS 主后端 + IndexedDB 降级 + 本地挂载路由
================================================================ */
const bus=new EventTarget();
const touchDir=d=>{ bus.dispatchEvent(new CustomEvent('fs',{detail:{dir:norm(d)}})); };

/* FileSystemHandle 后端（OPFS 根 与 本地挂载文件夹 共用同一实现 → 统一架构，无 isLocal 分支） */
class HandleBackend{
  constructor(root){this.root=root;}
  async _dir(p,create){ let d=this.root; for(const s of segs(p)) d=await d.getDirectoryHandle(s,{create:!!create}); return d; }
  async list(p){ const d=await this._dir(p); const out=[]; for await(const h of d.values()) out.push({name:h.name,kind:h.kind==='directory'?'dir':'file'}); return out; }
  async stat(p){ if(!segs(p).length) return {kind:'dir',size:0,mtime:0};
    const d=await this._dir(parentOf(p)); const n=baseOf(p);
    try{ const fh=await d.getFileHandle(n); const f=await fh.getFile(); return {kind:'file',size:f.size,mtime:f.lastModified,mime:f.type}; }
    catch(_){ await d.getDirectoryHandle(n); return {kind:'dir',size:0,mtime:0}; } }
  async readBlob(p){ const d=await this._dir(parentOf(p)); return (await d.getFileHandle(baseOf(p))).getFile(); }
  async write(p,blob){ const d=await this._dir(parentOf(p),true); const fh=await d.getFileHandle(baseOf(p),{create:true});
    const w=await fh.createWritable(); await w.write(blob); await w.close(); }
  async mkdir(p){ await this._dir(p,true); }
  async rm(p){ const d=await this._dir(parentOf(p)); await d.removeEntry(baseOf(p),{recursive:true}); }
}
/* IndexedDB 降级后端（OPFS 不可用时） */
class IDBBackend{
  constructor(db){this.db=db;}
  static open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('pineink-fs',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'p'});
    r.onsuccess=()=>res(new IDBBackend(r.result)); r.onerror=()=>rej(r.error); }); }
  _req(fn,mode='readonly'){ return new Promise((res,rej)=>{ const st=this.db.transaction('f',mode).objectStore('f'); const q=fn(st); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
  async list(p){ p=norm(p); const all=await this._req(s=>s.getAll()); const out=[];
    for(const r of all){ if(parentOf(r.p)===p && r.p!=='/') out.push({name:baseOf(r.p),kind:r.kind}); } return out; }
  async stat(p){ p=norm(p); if(p==='/')return{kind:'dir',size:0,mtime:0}; const r=await this._req(s=>s.get(p)); if(!r) throw new Error('不存在: '+p);
    return {kind:r.kind,size:r.data?r.data.size:0,mtime:r.mtime||0}; }
  async readBlob(p){ const r=await this._req(s=>s.get(norm(p))); if(!r||r.kind!=='file') throw new Error('不存在: '+p); return r.data; }
  async write(p,blob){ p=norm(p); let pp=parentOf(p); const dirs=[]; while(pp!=='/'){dirs.unshift(pp); pp=parentOf(pp);}
    for(const d of dirs){ const ex=await this._req(s=>s.get(d)); if(!ex) await this._req(s=>s.put({p:d,kind:'dir',mtime:Date.now()}),'readwrite'); }
    await this._req(s=>s.put({p,kind:'file',data:blob,mtime:Date.now()}),'readwrite'); }
  async mkdir(p){ p=norm(p); const parts=segs(p); let cur='';
    for(const s of parts){ cur+='/'+s; const ex=await this._req(x=>x.get(cur)); if(!ex) await this._req(x=>x.put({p:cur,kind:'dir',mtime:Date.now()}),'readwrite'); } }
  async rm(p){ p=norm(p); const all=await this._req(s=>s.getAll());
    for(const r of all){ if(r.p===p||r.p.startsWith(p+'/')) await this._req(s=>s.delete(r.p),'readwrite'); } }
}

const mounts=[]; // {prefix:'' 为根, backend, label, local?}
function route(p){ p=norm(p); let best=null;
  for(const m of mounts){ if(m.prefix===''||p===m.prefix||p.startsWith(m.prefix+'/')){ if(!best||m.prefix.length>best.prefix.length) best=m; } }
  if(!best) throw new Error('文件系统未初始化');
  return {b:best.backend, rel:p.slice(best.prefix.length)||'/', m:best};
}
let FS_MODE='OPFS';
const fs={
  async readdir(p,...a){ p=norm(p); let out=[];
    try{ const {b,rel}=route(p); out=await b.list(rel); }catch(e){ out=[]; }
    for(const m of mounts){ if(!m.prefix||m.prefix===p) continue; // 合成挂载点的中间目录（/mnt、/mnt/local）
      const pre=(p==='/'?'/':p+'/');
      if(m.prefix.startsWith(pre)){ const seg=m.prefix.slice(pre.length).split('/')[0];
        if(seg&&!out.find(x=>x.name===seg)) out.push({name:seg,kind:'dir',mount:m.prefix===pre+seg}); } }
    return out; },
  async stat(p,...a){ p=norm(p);
    for(const m of mounts){ if(m.prefix&&(m.prefix===p||m.prefix.startsWith(p+'/'))) return {kind:'dir',size:0,mtime:0,mount:m.prefix===p}; }
    const {b,rel}=route(p); return b.stat(rel); },
  async exists(p,...a){ try{ await this.stat(p); return true; }catch(_){ return false; } },
  async readBlob(p,...a){ const {b,rel}=route(norm(p)); return b.readBlob(rel); },
  async readFile(p,...a){ return (await this.readBlob(p)).arrayBuffer(); },
  async readText(p,...a){ return (await this.readBlob(p)).text(); },
  async writeFile(p,data,...a){ p=norm(p); const {b,rel}=route(p);
    const blob=(data instanceof Blob)?data:new Blob([data],{type:mimeOf(p)});
    await b.write(rel,blob); touchDir(parentOf(p)); },
  async mkdir(p,...a){ p=norm(p); const {b,rel}=route(p); await b.mkdir(rel); touchDir(parentOf(p)); },
  async rm(p,...a){ p=norm(p); const {b,rel}=route(p); await b.rm(rel); touchDir(parentOf(p)); },
  unlink(p,...a){ return this.rm(p); }, rmdir(p,...a){ return this.rm(p); },
  async copy(src,dst,...a){ src=norm(src); dst=norm(dst); if(src===dst) return;
    const st=await this.stat(src);
    if(st.kind==='dir'){ if(dst.startsWith(src+'/')) throw new Error('不能复制到自身内部');
      await this.mkdir(dst); const ls=await this.readdir(src);
      for(const e of ls) await this.copy(src+'/'+e.name,dst+'/'+e.name); }
    else{ const blob=await this.readBlob(src); const {b,rel}=route(dst); await b.write(rel,blob); }
    touchDir(parentOf(dst)); },
  async move(src,dst,...a){ src=norm(src); dst=norm(dst); if(src===dst) return;
    if(dst.startsWith(src+'/')) throw new Error('不能移动到自身内部');
    await this.copy(src,dst); await this.rm(src); touchDir(parentOf(src)); touchDir(parentOf(dst)); },
  rename(src,dst,...a){ return this.move(src,dst); },
  async uniqueName(dir,name){ if(!await this.exists(norm(dir)+'/'+name)) return name;
    const e=extOf(name), s=stem(name); let i=2;
    while(await this.exists(norm(dir)+'/'+s+` (${i})`+(e?'.'+e:''))) i++;
    return s+` (${i})`+(e?'.'+e:''); },
  async dirSize(p){ let total=0; try{ const ls=await this.readdir(p);
    for(const e of ls){ if(e.kind==='dir'){ if(e.mount) continue; total+=await this.dirSize(norm(p)+'/'+e.name); } else { try{ const st=await this.stat(norm(p)+'/'+e.name); total+=st.size||0; }catch(_){}} } }catch(_){}
    return total; },
};
window.fs=fs;

/* ---- 初始化 + 种子文件 ---- */
async function fsInit(){
  try{
    const root=await navigator.storage.getDirectory();
    const t=await root.getFileHandle('.probe',{create:true});
    const w=await t.createWritable(); await w.write('ok'); await w.close();
    await root.removeEntry('.probe');
    mounts.push({prefix:'',backend:new HandleBackend(root),label:'OPFS'});
    FS_MODE='OPFS';
  }catch(e){
    console.warn('OPFS 不可用，降级 IndexedDB',e);

/* 内存兜底后端 */
class IDBMem{ constructor(){this.map=new Map([['/',{kind:'dir'}]]);}
  async list(p){ p=norm(p); const out=[]; for(const [k,v] of this.map){ if(k!=='/'&&parentOf(k)===p) out.push({name:baseOf(k),kind:v.kind}); } return out; }
  async stat(p){ p=norm(p); const r=this.map.get(p); if(!r)throw new Error('不存在'); return {kind:r.kind,size:r.data?r.data.size:0,mtime:r.mtime||0}; }
  async readBlob(p){ const r=this.map.get(norm(p)); if(!r||r.kind!=='file')throw new Error('不存在'); return r.data; }
  async write(p,b){ p=norm(p); let d=parentOf(p); while(d!=='/'){ this.map.set(d,{kind:'dir'}); d=parentOf(d);} this.map.set(p,{kind:'file',data:b,mtime:Date.now()}); }
  async mkdir(p){ p=norm(p); let cur=''; for(const s of segs(p)){cur+='/'+s; if(!this.map.has(cur)) this.map.set(cur,{kind:'dir',mtime:Date.now()});} }
  async rm(p){ p=norm(p); for(const k of [...this.map.keys()]){ if(k===p||k.startsWith(p+'/')) this.map.delete(k);} }
}

/* ---- 本地文件夹挂载（File System Access API） ---- */
async function mountLocalFolder(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持 File System Access API','error'); return; }
  try{
    const handle=await showDirectoryPicker({mode:'readwrite'});
    let name=handle.name||'本地文件夹';
    let prefix='/mnt/local/'+name, i=2;
    while(mounts.find(m=>m.prefix===prefix)) prefix='/mnt/local/'+name+'-'+(i++);
    mounts.push({prefix,backend:new HandleBackend(handle),label:name,local:true});
    const saved=JSON.parse(localStorage.getItem('pineink.mounts')||'[]');
    if(!saved.includes(name)){ saved.push(name); localStorage.setItem('pineink.mounts',JSON.stringify(saved)); }
    touchDir('/mnt/local'); touchDir('/');
    toast(`已挂载本地文件夹「${name}」→ ${prefix}`,'ok');
    return prefix;
  }catch(e){ if(e.name!=='AbortError') toast('挂载失败：'+e.message,'error'); }
}
function unmountLocal(prefix){
  const i=mounts.findIndex(m=>m.prefix===prefix);
  if(i>=0){ const name=mounts[i].label; mounts.splice(i,1);
    const saved=JSON.parse(localStorage.getItem('pineink.mounts')||'[]').filter(n=>n!==name);
    localStorage.setItem('pineink.mounts',JSON.stringify(saved));
    touchDir('/mnt/local'); toast(`已卸载「${name}」`,'ok'); }
}

/* ---- 外部文件导入（物理桌面 → 虚拟系统） ---- */
async function importDataTransfer(dt,destDir){
  const entries=[];
  if(dt.items){ for(const it of dt.items){ if(it.kind==='file'){ const en=it.webkitGetAsEntry&&it.webkitGetAsEntry(); if(en) entries.push(en); else { const f=it.getAsFile(); if(f) entries.push(f); } } } }
  let count=0;
  async function walkEntry(entry,dir){
    if(entry instanceof File){ const nm=await fs.uniqueName(dir,entry.name); await fs.writeFile(dir+'/'+nm,entry); count++; return; }
    if(entry.isFile){ const file=await new Promise((res,rej)=>entry.file(res,rej));
      const nm=await fs.uniqueName(dir,file.name); await fs.writeFile(dir+'/'+nm,file); count++; }
    else if(entry.isDirectory){ const nm=await fs.uniqueName(dir,entry.name); const nd=dir+'/'+nm; await fs.mkdir(nd);
      const reader=entry.createReader();
      while(true){ const batch=await new Promise((res,rej)=>reader.readEntries(res,rej)); // readEntries 每批最多 100 条
        if(!batch.length) break;
        for(const e of batch) await walkEntry(e,nd); } }
  }
  if(entries.length){ for(const e of entries) await walkEntry(e,destDir); }
  else if(dt.files&&dt.files.length){ for(const f of dt.files){ const nm=await fs.uniqueName(destDir,f.name); await fs.writeFile(destDir+'/'+nm,f); count++; } }
  if(count) { toast(`已导入 ${count} 个文件到 ${destDir==='/Desktop'?'桌面':destDir}`,'ok'); touchDir(destDir); }
  return count;
}
/* 导出（移动端替代拖出方案 & 菜单） */
async function exportPath(p){
  try{ const st=await fs.stat(p);
    if(st.kind==='dir'){ // 打包为 zip 下载
      if(!window.JSZip){ toast('JSZip 未加载，无法导出文件夹','error'); return; }
      const zip=new JSZip();
      async function add(dir,zf){ const ls=await fs.readdir(dir);
        for(const e of ls){ const fp=dir+'/'+e.name;
          if(e.kind==='dir') await add(fp,zf.folder(e.name));
          else zf.file(e.name,await fs.readFile(fp)); } }
      await add(p,zip);
      const blob=await zip.generateAsync({type:'blob'});
      dlFile(blob,baseOf(p)+'.zip');
    }else{ dlFile(await fs.readBlob(p),baseOf(p)); }
    toast('已开始下载','ok');
  }catch(e){ toast('导出失败：'+e.message,'error'); }
}
function dlFile(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),8000); }

  if(w.type==='file'){ try{ const blob=await fs.readBlob(w.path); if(el._u) URL.revokeObjectURL(el._u);
      el._u=URL.createObjectURL(blob); el.style.background=`url("${el._u}") center/cover`; return; }catch(e){ toast('壁纸文件读取失败，已恢复默认','error'); } }
  el.style.background=WALLS[(w.i||0)%WALLS.length].css;
}
async function setWallpaperFile(file){
  await fs.mkdir('/System/Wallpapers');
  const nm=await fs.uniqueName('/System/Wallpapers',file.name||('wall-'+uid()+'.png'));
  const p='/System/Wallpapers/'+nm;
  await fs.writeFile(p,file);
  Conf.set('wall',{type:'file',path:p}); applyWallpaper(); toast('壁纸已更新','ok');
}

/* ================================================================
   桌面图标 —— 网格自由摆放 / 原生 DnD 双向拖拽 / 触摸拖拽 / 框选
================================================================ */
const DESK='/Desktop';
const desk={
  sel:new Set(), pos:JSON.parse(localStorage.getItem('pineink.iconpos')||'{}'),
  cellW:()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-w')),
  cellH:()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-h')),
  grid(){ const r=$('#desktop').getBoundingClientRect();
    return {cols:Math.max(1,Math.floor((r.width-12)/this.cellW())),rows:Math.max(1,Math.floor((r.height-8)/this.cellH()))}; },
  savePos(){ localStorage.setItem('pineink.iconpos',JSON.stringify(this.pos)); },
  cellAt(x,y){ const g=this.grid();
    return {c:clamp(Math.round((x-8)/this.cellW()),0,g.cols-1),r:clamp(Math.round((y-8)/this.cellH()),0,g.rows-1)}; },
};
const dragCache=new Map(); // path -> {file,url}
async function preloadDrag(path){
  if(dragCache.has(path)) return;
  try{ const st=await fs.stat(path); if(st.kind!=='file'||st.size>120*1024*1024) return;
    const blob=await fs.readBlob(path);
    const file=new File([blob],baseOf(path),{type:blob.type||mimeOf(path)});
    dragCache.set(path,{file,url:URL.createObjectURL(file)});
  }catch(_){}
}
function releaseDrag(path){ const c=dragCache.get(path); if(c){ setTimeout(()=>URL.revokeObjectURL(c.url),6000); dragCache.delete(path); } }

async function refreshDesktop(){
  const box=$('#icons');
  let entries=[];
  try{ entries=await fs.readdir(DESK); }catch(_){}
  entries.sort((a,b)=>(a.kind===b.kind?natCmp(a.name,b.name):a.kind==='dir'?-1:1));
  const items=[{name:'此电脑',sys:'computer'},{name:'资源管理器',sys:'explorer'},...entries];
  const g=desk.grid(); const occupied=new Set();
  for(const it of items){ const key=it.sys?('sys:'+it.sys):it.name; const p=desk.pos[key];
    if(p&&p.c<g.cols&&p.r<g.rows) occupied.add(p.c+','+p.r); }
  let scan=0;
  const nextFree=()=>{ while(true){ const c=Math.floor(scan/g.rows), r=scan%g.rows; scan++;
      if(!occupied.has(c+','+r)){ occupied.add(c+','+r); return {c,r}; } } };
  box.innerHTML='';
  items.forEach((it,idx)=>{
    const key=it.sys?('sys:'+it.sys):it.name;
    let p=desk.pos[key];
    if(!p||p.c>=g.cols||p.r>=g.rows){ p=nextFree(); desk.pos[key]=p; }
    const path=it.sys?null:DESK+'/'+it.name;
    const el=document.createElement('div');
    el.className='dicon appear'; el.style.animationDelay=(idx*0.02)+'s';
    el.style.left=(8+p.c*desk.cellW())+'px'; el.style.top=(8+p.r*desk.cellH())+'px';
    el.dataset.key=key; if(path){ el.dataset.path=path; el.dataset.kind=it.kind; }
    const ic=it.sys==='computer'?{svg:I.computer,color:'#54d6a4'}:it.sys==='explorer'?{svg:I.explorer,color:'#e6ac48'}:fileIcon(it.name,it.kind,it.mount);
    el.innerHTML=`<span class="dic" style="color:${ic.color}">${ic.svg}</span><span class="dlabel">${esc(it.name)}</span>`;
    el.draggable=!isTouch;
    bindIcon(el,it,path);
    box.appendChild(el);
  });
  desk.savePos();
}
function iconOpen(it,path){
  if(it.sys==='computer') return openExplorer('/');
  if(it.sys==='explorer') return openExplorer(DESK);
  openPath(path);
}
function bindIcon(el,it,path){
  el.addEventListener('click',e=>{ e.stopPropagation();
    if(e.ctrlKey||e.metaKey){ el.classList.toggle('sel'); el.classList.contains('sel')?desk.sel.add(el.dataset.key):desk.sel.delete(el.dataset.key); }
    else{ clearDeskSel(); el.classList.add('sel'); desk.sel.add(el.dataset.key); if(isTouch) iconOpen(it,path); } });
  el.addEventListener('dblclick',e=>{ e.stopPropagation(); iconOpen(it,path); });
  el.addEventListener('contextmenu',e=>{ e.preventDefault(); e.stopPropagation();
    if(!el.classList.contains('sel')){ clearDeskSel(); el.classList.add('sel'); desk.sel.add(el.dataset.key); }
    if(!path){ showMenu(e.clientX,e.clientY,[{label:'打开',icon:I.eye,action:()=>iconOpen(it,path)}]); return; }
    showMenu(e.clientX,e.clientY,fileMenuItems(path,it.kind,{onDone:refreshDesktop}));
  });
  if(path&&it.kind==='file'){ el.addEventListener('pointerenter',()=>preloadDrag(path)); el.addEventListener('pointerdown',()=>preloadDrag(path)); }
  /* —— 原生 HTML5 拖拽（内部移动 + 拖出到物理桌面）—— */
  el.addEventListener('dragstart',e=>{ // 严禁 async！
    if(!el.classList.contains('sel')){ clearDeskSel(); el.classList.add('sel'); desk.sel.add(el.dataset.key); }
    const keys=[...desk.sel];
    const paths=keys.map(k=>{ const n=$(`.dicon[data-key="${CSS.escape(k)}"]`); return n&&n.dataset.path; }).filter(Boolean);
    e.dataTransfer.setData('application/x-pineink',JSON.stringify({paths,keys,src:'desktop',primary:el.dataset.key,
      offX:e.offsetX,offY:e.offsetY}));
    e.dataTransfer.effectAllowed='copyMove';
    if(path){ const c=dragCache.get(path);
      if(c){ try{ e.dataTransfer.items.add(c.file); }catch(_){}
        try{ e.dataTransfer.setData('DownloadURL',`${c.file.type||'application/octet-stream'}:${c.file.name}:${c.url}`); }catch(_){} } }
    el.classList.add('dragging');
  });
  el.addEventListener('dragend',()=>{ el.classList.add('dragging'); el.classList.remove('dragging');
    if(path) releaseDrag(path); $$('.dicon.droptarget').forEach(n=>n.classList.remove('droptarget')); });
  if(it.kind==='dir'||it.sys){ // 作为放置目标
    el.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('droptarget'); e.dataTransfer.dropEffect='move'; });
    el.addEventListener('dragleave',()=>el.classList.remove('droptarget'));
    el.addEventListener('drop',async e=>{ e.preventDefault(); e.stopPropagation(); el.classList.remove('droptarget');
      const dest=it.sys?'/':path;
      const raw=e.dataTransfer.getData('application/x-pineink');
      if(raw){ const d=JSON.parse(raw);
        for(const p of d.paths){ if(p===dest||dest.startsWith(p+'/'))continue;
          try{ await fs.move(p,dest+'/'+await fs.uniqueName(dest,baseOf(p))); }catch(err){ toast(err.message,'error'); } }
        touchDir(DESK);
      } else await importDataTransfer(e.dataTransfer,dest);
    });
  }
  /* —— 触摸长按拖拽 —— */
  if(isTouch) bindTouchDrag(el,it,path);
}
function clearDeskSel(){ desk.sel.clear(); $$('.dicon.sel').forEach(n=>n.classList.remove('sel')); }

function bindTouchDrag(el,it,path){
  let timer=null,ghost=null,active=false,lx=0,ly=0;
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; lx=t.clientX; ly=t.clientY;
    timer=setTimeout(()=>{ active=true;
      ghost=el.cloneNode(true); ghost.className='dicon touchGhost'; ghost.style.left=lx+'px'; ghost.style.top=ly+'px';
      document.body.appendChild(ghost); if(navigator.vibrate)navigator.vibrate(20); },380); },{passive:true});
  el.addEventListener('touchmove',e=>{ const t=e.touches[0];
    if(!active){ if(Math.hypot(t.clientX-lx,t.clientY-ly)>12){ clearTimeout(timer); } return; }
    e.preventDefault();
    ghost.style.left=t.clientX+'px'; ghost.style.top=t.clientY+'px';
    $$('.dicon.droptarget').forEach(n=>n.classList.remove('droptarget'));
    ghost.style.display='none';
    const under=document.elementFromPoint(t.clientX,t.clientY);
    ghost.style.display='';
    const di=under&&under.closest('.dicon');
    if(di&&di!==el&&(di.dataset.kind==='dir'||!di.dataset.path)) di.classList.add('droptarget');
  },{passive:false});
  el.addEventListener('touchend',async e=>{ clearTimeout(timer);
    if(!active) return; active=false;
    const t=e.changedTouches[0]; ghost.remove(); ghost=null;
    const tgt=$$('.dicon.droptarget')[0];
    $$('.dicon.droptarget').forEach(n=>n.classList.remove('droptarget'));
    if(tgt&&path){ const dest=tgt.dataset.path||'/';
      try{ await fs.move(path,dest+'/'+await fs.uniqueName(dest,baseOf(path))); toast('已移动','ok'); }catch(err){ toast(err.message,'error'); }
      touchDir(DESK);
    }else{ const dr=$('#desktop').getBoundingClientRect();
      const cell=desk.cellAt(t.clientX-dr.left-desk.cellW()/2,t.clientY-dr.top-desk.cellH()/2);
      desk.pos[el.dataset.key]=cell; desk.savePos();
      el.style.left=(8+cell.c*desk.cellW())+'px'; el.style.top=(8+cell.r*desk.cellH())+'px'; }
  });
}

/* —— 桌面放置：图标重排 / 从窗口移入 / 物理文件导入 —— */
const desktopEl=$('#desktop');
desktopEl.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect=e.dataTransfer.types.includes('application/x-pineink')?'move':'copy'; });
desktopEl.addEventListener('drop',async e=>{
  e.preventDefault(); $('#dropHint').style.display='none';
  const raw=e.dataTransfer.getData('application/x-pineink');
  const dr=desktopEl.getBoundingClientRect();
  if(raw){
    const d=JSON.parse(raw);
    if(d.src==='desktop'){ // 内部重排：主图标到落点，其余顺延空格
      const cell=desk.cellAt(e.clientX-dr.left-(d.offX||40),e.clientY-dr.top-(d.offY||40));
      const g=desk.grid(); const taken=new Set(Object.entries(desk.pos).filter(([k])=>!d.keys.includes(k)).map(([,v])=>v.c+','+v.r));
      let queue=[...d.keys.filter(k=>k!==d.primary)];
      const place=(key,c0,r0)=>{ let c=c0,r=r0;
        while(taken.has(c+','+r)){ r++; if(r>=g.rows){r=0;c++;} if(c>=g.cols){c=0;} }
        taken.add(c+','+r); desk.pos[key]={c,r};
        const n=$(`.dicon[data-key="${CSS.escape(key)}"]`); if(n){ n.style.left=(8+c*desk.cellW())+'px'; n.style.top=(8+r*desk.cellH())+'px'; } };
      place(d.primary,cell.c,cell.r);
      queue.forEach((k,i)=>place(k,cell.c,cell.r+i+1));
      desk.savePos();
    } else { // 从资源管理器等移动到桌面
      for(const p of d.paths){ if(parentOf(p)===DESK) continue;
        try{ await fs.move(p,DESK+'/'+await fs.uniqueName(DESK,baseOf(p))); }catch(err){ toast(err.message,'error'); } }
      touchDir(DESK);
    }
  } else await importDataTransfer(e.dataTransfer,DESK);
});
/* 外部文件拖入提示 */
let dragDepth=0;
addEventListener('dragenter',e=>{ if([...e.dataTransfer.types].includes('Files')&&![...e.dataTransfer.types].includes('application/x-pineink')){ dragDepth++; $('#dropHint').style.display='flex'; } });
addEventListener('dragleave',()=>{ if(dragDepth>0&&--dragDepth===0) $('#dropHint').style.display='none'; });
addEventListener('drop',e=>{ e.preventDefault(); dragDepth=0; $('#dropHint').style.display='none'; });
addEventListener('dragover',e=>e.preventDefault());

/* —— 框选 —— */
{ let sx,sy,on=false; const mq=$('#marquee');
  desktopEl.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.dicon')) return;
    on=true; sx=e.clientX; sy=e.clientY; if(!(e.ctrlKey||e.metaKey)) clearDeskSel();
  });
  addEventListener('pointermove',e=>{ if(!on) return;
    const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);
    if(w+h<6) return;
    const dr=desktopEl.getBoundingClientRect();

    $$('.dicon').forEach(n=>{ const r=n.getBoundingClientRect();
      const hit=!(r.right<x||r.left>x+w||r.bottom<y||r.top>y+h);
      n.classList.toggle('sel',hit); hit?desk.sel.add(n.dataset.key):desk.sel.delete(n.dataset.key); });
  });
  addEventListener('pointerup',()=>{ on=false; mq.style.display='none'; });
}

/* —— 通用文件操作 —— */
const clipboard={mode:null,paths:[]};
function fileMenuItems(path,kind,ctx={}){
  const done=ctx.onDone||(()=>{});
  const items=[
    {label:'打开',icon:I.eye,action:()=>openPath(path)},
    {label:'打开方式',icon:I.chevR,sub:openWithItems(path)},
  ];
  if(kind==='file'&&CAT.zip.includes(extOf(path))) items.push({label:'解压到当前目录',icon:I.fileZip,action:()=>extractArchive(path)});
  items.push({sep:true},
    {label:'复制',icon:I.copy,action:()=>{clipboard.mode='copy';clipboard.paths=ctx.paths||[path];toast('已复制到剪贴板');}},
    {label:'剪切',icon:I.cut,action:()=>{clipboard.mode='cut';clipboard.paths=ctx.paths||[path];toast('已剪切');}},
    {label:'重命名',icon:I.rename,action:async()=>{
      const nn=await uiPrompt('重命名',baseOf(path)); if(!nn||nn===baseOf(path))return;
      try{ await fs.move(path,parentOf(path)+'/'+nn); done(); }catch(e){toast(e.message,'error');} }},
    {label:'导出 / 下载',icon:I.download,action:()=>exportPath(path)},
    {sep:true},
    {label:'删除',icon:I.trash,danger:true,action:async()=>{
      const targets=ctx.paths&&ctx.paths.length>1?ctx.paths:[path];
      if(!await uiConfirm('删除确认',`确定删除 ${targets.length>1?targets.length+' 个项目':'「'+baseOf(path)+'」'}？此操作不可恢复。`,true)) return;
      for(const p of targets){ try{ await fs.rm(p); }catch(e){ toast(e.message,'error'); } }
      done(); }});
  return items;
}
async function pasteTo(dir){
  if(!clipboard.paths.length){ toast('剪贴板为空'); return; }
  for(const p of clipboard.paths){
    try{ const nm=await fs.uniqueName(dir,baseOf(p));
      if(clipboard.mode==='cut') await fs.move(p,dir+'/'+nm); else await fs.copy(p,dir+'/'+nm);
    }catch(e){ toast(e.message,'error'); } }
  if(clipboard.mode==='cut'){ clipboard.paths=[]; clipboard.mode=null; }
  touchDir(dir); toast('粘贴完成','ok');
}
async function newFolder(dir){ const n=await uiPrompt('新建文件夹','新建文件夹'); if(!n)return;
  try{ await fs.mkdir(dir+'/'+await fs.uniqueName(dir,n)); }catch(e){toast(e.message,'error');} }
async function newTextFile(dir){ const n=await uiPrompt('新建文本文档','新建文档.txt'); if(!n)return;
  try{ const nm=await fs.uniqueName(dir,n.includes('.')?n:n+'.txt'); await fs.writeFile(dir+'/'+nm,''); openNotepad(dir+'/'+nm); }catch(e){toast(e.message,'error');} }
async function newHtmlFile(dir){ const n=await uiPrompt('新建 HTML 页面','页面.html'); if(!n)return;
  try{ const nm=await fs.uniqueName(dir,n.endsWith('.html')?n:n+'.html');
    await fs.writeFile(dir+'/'+nm,'<!DOCTYPE html>\n<html lang="zh">\n<head>\n  <meta charset="UTF-8">\n  <title>新页面</title>\n</head>\n<body>\n  <h1>你好，松墨 OS</h1>\n</body>\n</html>');
    openEditor(dir+'/'+nm); }catch(e){toast(e.message,'error');} }
function pickAndImport(dir){
  const inp=$('#pickFiles'); inp.value='';
  inp.onchange=async()=>{ let c=0;
    for(const f of inp.files){ try{ await fs.writeFile(dir+'/'+await fs.uniqueName(dir,f.name),f); c++; }catch(e){ toast(e.message,'error'); } }
    if(c) toast(`已上传 ${c} 个文件`,'ok'); touchDir(dir); };
  inp.click();
}

<script>
/* ================================================================
   智能分派：打开任意路径（目录→导航；文件→按类型选 App）
================================================================ */
async function openPath(path){
  path=norm(path);
  let st; try{ st=await fs.stat(path); }catch(e){ toast('无法访问：'+e.message,'error'); return; }
  if(st.kind==='dir') return openExplorer(path);
  const c=catOf(path);
  if(c==='image') return openImageViewer(path);
  if(c==='audio'||c==='video') return openMedia(path);
  if(c==='html') return htmlChooser(path);
  if(c==='table') return openTable(path);
  if(c==='pdf') return openPdf(path);
  if(c==='zip'){ if(await uiConfirm('解压压缩包',`将「${baseOf(path)}」解压到当前目录？`)) extractArchive(path); return; }
  if(c==='vm') return openVM(path);
  if(c==='code') return openEditor(path);
  if(st.size>3*1024*1024 && c==='other'){ if(!await uiConfirm('以文本打开','该文件较大且类型未知，仍以纯文本方式打开？')) return; }
  return openNotepad(path);
}
function openWithItems(path){

/* ---- 迷你文件选择对话框 ---- */
function pickPathDialog(title,filter){
  return new Promise(res=>{
    const filters={image:CAT.image,table:CAT.table,media:[...CAT.audio,...CAT.video],vm:CAT.vm};
    const exts=filters[filter]||null;
    const win=WM.create({title,icon:I.search,width:460,height:420,app:'pick'});
    let cwd='/', chosen=null;
    win.body.innerHTML=`<div class="appbar"><button class="abtn" data-a="up">${I.up}</button><div class="fx-crumbs" style="flex:1"></div></div>
      <div style="flex:1;overflow:auto" class="pk-list"></div>
      <div class="appbar" style="border-top:1px solid var(--line);border-bottom:none;justify-content:flex-end">
      <button class="abtn" data-a="cancel">取消</button><button class="abtn primary" data-a="ok" disabled>选择</button></div>`;
    const okBtn=$('[data-a=ok]',win.body);
    async function render(){
      $('.fx-crumbs',win.body).innerHTML=`<span class="crumb last">${esc(cwd)}</span>`;
      let ls=[]; try{ ls=await fs.readdir(cwd); }catch(_){}
      ls.sort((a,b)=>a.kind===b.kind?natCmp(a.name,b.name):a.kind==='dir'?-1:1);
      const box=$('.pk-list',win.body); box.innerHTML='';
      for(const e of ls){
        if(e.kind==='file'&&exts&&!exts.includes(extOf(e.name))) continue;
        const p=(cwd==='/'?'':cwd)+'/'+e.name;
        const ic=fileIcon(e.name,e.kind,e.mount);
        const r=document.createElement('div');
        r.className='fx-si'; r.style.margin='2px 8px';
        r.innerHTML=`<span style="color:${ic.color};width:16px;height:16px">${ic.svg}</span><span>${esc(e.name)}</span>`;
        r.onclick=()=>{ if(e.kind==='dir'){ cwd=p; render(); } else { chosen=p; okBtn.disabled=false;
          $$('.fx-si.cur',box).forEach(n=>n.classList.remove('cur')); r.classList.add('cur'); } };
        r.ondblclick=()=>{ if(e.kind==='file'){ WM.close(win); res(p); } };
        box.appendChild(r);
      }
    }
    $('[data-a=up]',win.body).onclick=()=>{ if(cwd!=='/'){ cwd=parentOf(cwd); render(); } };
    $('[data-a=cancel]',win.body).onclick=()=>{ WM.close(win); res(null); };
    okBtn.onclick=()=>{ WM.close(win); res(chosen); };
    render();
  });
}

/* ================================================================
   资源管理器
================================================================ */
const QUICK=[['桌面','/Desktop',I.home],['文档','/Documents',I.fileText],['图片','/Pictures',I.fileImg],['音乐','/Music',I.fileAudio],['下载','/Downloads',I.download],['根目录','/',I.hdd]];
function openExplorer(startPath='/'){
  const win=WM.create({title:'资源管理器',icon:I.explorer,width:860,height:560,app:'explorer'});
  const st={cwd:norm(startPath),hist:[norm(startPath)],hi:0,sort:{key:'name',asc:true},sel:new Set(),
    colW:{name:0,date:150,type:110,size:88},entries:[],search:''};
  win.body.innerHTML=`
   <div class="appbar">
    <button class="abtn" data-a="side" title="侧栏">${I.sidebar}</button>
    <button class="abtn" data-a="back" title="后退">${I.back}</button>
    <button class="abtn" data-a="fwd" title="前进">${I.fwd}</button>
    <button class="abtn" data-a="up" title="上级">${I.up}</button>
    <button class="abtn" data-a="refresh" title="刷新">${I.refresh}</button>
    <div class="fx-crumbs"></div>
    <input class="ainput fx-search" placeholder="搜索当前目录…" style="width:150px">
   </div>
   <div class="fx">
    <div class="fx-side"></div>
    <div class="fx-main"><div class="fx-list"><table class="fx-table"><thead></thead><tbody></tbody></table><div class="fx-marquee"></div></div></div>
   </div>
   <div class="statusbar"><span class="st-count"></span><span class="sp"></span><span class="st-mode">${FS_MODE}</span></div>`;
  const listEl=$('.fx-list',win.body), tbody=$('tbody',win.body), thead=$('thead',win.body);
  const cols=[['name','名称'],['date','修改日期'],['type','类型'],['size','大小']];

  function crumbs(){
    const box=$('.fx-crumbs',win.body); box.innerHTML='';
    const parts=segs(st.cwd); let acc='';
    const rootC=document.createElement('span'); rootC.className='crumb'+(parts.length?'':' last'); rootC.textContent='根目录';
    rootC.onclick=()=>nav('/'); box.appendChild(rootC);
    parts.forEach((s,i)=>{ acc+='/'+s;
      const sep=document.createElement('span'); sep.className='crumb-sep'; sep.textContent='›'; box.appendChild(sep);
      const c=document.createElement('span'); c.className='crumb'+(i===parts.length-1?' last':''); c.textContent=s;
      const p=acc; c.onclick=()=>nav(p); box.appendChild(c); });
    box.scrollLeft=box.scrollWidth;
  }
  function sidebar(){
    const sb=$('.fx-side',win.body); sb.innerHTML='<h4>快速访问</h4>';
    for(const [n,p,ic] of QUICK){ const d=document.createElement('div');
      d.className='fx-si'+(st.cwd===p?' cur':''); d.innerHTML=`${ic}<span>${esc(n)}</span>`;
      d.onclick=()=>{nav(p); if(isMobile())sb.classList.remove('open');}; sb.appendChild(d); }
    sb.insertAdjacentHTML('beforeend','<h4>本地挂载</h4>');
    const locals=mounts.filter(m=>m.local);
    if(!locals.length){ const d=document.createElement('div'); d.className='fx-si'; d.innerHTML=`${I.plus}<span>挂载本地文件夹…</span>`;
      d.onclick=async()=>{ const p=await mountLocalFolder(); if(p){nav(p);} }; sb.appendChild(d); }
    for(const m of locals){ const d=document.createElement('div');
      d.className='fx-si'+(st.cwd.startsWith(m.prefix)?' cur':'');
      d.innerHTML=`${I.hdd}<span style="flex:1">${esc(m.label)}</span><span style="width:13px;height:13px;color:var(--txt3)" title="卸载">${I.eject}</span>`;
      $('span:last-child',d).onclick=e=>{ e.stopPropagation(); unmountLocal(m.prefix); sidebar(); if(st.cwd.startsWith(m.prefix)) nav('/'); };
      d.onclick=()=>nav(m.prefix); sb.appendChild(d); }
    if(locals.length){ const d=document.createElement('div'); d.className='fx-si'; d.innerHTML=`${I.plus}<span>挂载更多…</span>`;
      d.onclick=async()=>{ const p=await mountLocalFolder(); if(p) nav(p); }; sb.appendChild(d); }
  }
  function header(){
    const narrow=win.body.clientWidth<560;
    const tr=document.createElement('tr');
    for(const [k,label] of cols){
      if(narrow&&(k==='date'||k==='type')) continue;
      const th=document.createElement('th'); th.style.position='sticky';
      if(k!=='name') th.style.width=st.colW[k]+'px';
      th.innerHTML=`${label} ${st.sort.key===k?(st.sort.asc?'↑':'↓'):''}<span class="colrz"></span>`;
      th.onclick=e=>{ if(e.target.classList.contains('colrz'))return;
        if(st.sort.key===k) st.sort.asc=!st.sort.asc; else {st.sort.key=k;st.sort.asc=true;} render(); };
      const rz=$('.colrz',th); let sx,sw;
      rz.addEventListener('pointerdown',e=>{ e.stopPropagation(); sx=e.clientX; sw=th.offsetWidth; rz.setPointerCapture(e.pointerId);
        rz.onpointermove=ev=>{ const w=Math.max(56,sw+ev.clientX-sx); st.colW[k]=w; th.style.width=w+'px'; };
        rz.onpointerup=()=>{ rz.onpointermove=null; }; });
      tr.appendChild(th);
    }
    thead.innerHTML=''; thead.appendChild(tr);
  }
  async function load(){
    let ls=[];
    try{ ls=await fs.readdir(st.cwd); }catch(e){ toast(e.message,'error'); }
    const out=[];
    for(const e of ls){ const p=(st.cwd==='/'?'':st.cwd)+'/'+e.name;
      let s={kind:e.kind,size:e.kind==='dir'?null:0,mtime:0};
      try{ s=await fs.stat(p); }catch(_){}
      out.push({name:e.name,kind:e.kind,mount:e.mount,path:p,size:e.kind==='dir'?null:s.size,mtime:s.mtime||0,type:typeLabel(e.name,e.kind)}); }
    st.entries=out;
  }
  async function searchLoad(q){
    const out=[]; q=q.toLowerCase();
    async function walk(dir,depth){ if(depth>6||out.length>400) return;
      let ls=[]; try{ ls=await fs.readdir(dir); }catch(_){ return; }
      for(const e of ls){ const p=(dir==='/'?'':dir)+'/'+e.name;
        if(e.name.toLowerCase().includes(q)){ let s={size:0,mtime:0}; try{ s=await fs.stat(p); }catch(_){}
          out.push({name:e.name,kind:e.kind,path:p,size:e.kind==='dir'?null:s.size,mtime:s.mtime||0,type:typeLabel(e.name,e.kind),hint:p}); }
        if(e.kind==='dir'&&!e.mount) await walk(p,depth+1); } }
    await walk(st.cwd,0); st.entries=out;
  }
  function sortEntries(){
    const {key,asc}=st.sort, f=asc?1:-1;
    st.entries.sort((a,b)=>{
      if(a.kind!==b.kind) return a.kind==='dir'?-1:1;
      if(key==='name') return f*natCmp(a.name,b.name);
      if(key==='date') return f*((a.mtime||0)-(b.mtime||0));
      if(key==='type') return f*natCmp(a.type,b.type)||natCmp(a.name,b.name);
      if(key==='size') return f*((a.size||0)-(b.size||0));
      return 0; });
  }
  function render(){
    header(); sortEntries(); crumbs(); sidebar();
    const narrow=win.body.clientWidth<560;
    tbody.innerHTML='';
    if(!st.entries.length){ tbody.innerHTML=`<tr><td colspan="4"><div class="fx-empty">${I.folderOpen}${st.search?'未找到匹配项':'此文件夹为空'}</div></td></tr>`; }
    for(const en of st.entries){
      const tr=document.createElement('tr'); tr.className='fx-row'; tr.dataset.path=en.path; tr.dataset.kind=en.kind;
      if(clipboard.mode==='cut'&&clipboard.paths.includes(en.path)) tr.classList.add('cutrow');
      const ic=fileIcon(en.name,en.kind,en.mount);
      tr.innerHTML=`<td title="${esc(en.hint||en.name)}"><span class="fic" style="color:${ic.color}">${ic.svg}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(en.name)}</span></td>
        ${narrow?'':`<td class="dim">${fmtDate(en.mtime)}</td><td class="dim">${esc(en.type)}</td>`}
        <td class="dim">${en.size==null?'—':fmtSize(en.size)}</td>`;
      bindRow(tr,en);
      tbody.appendChild(tr);
    }
    $('.st-count',win.body).textContent=`${st.entries.length} 个项目${st.sel.size?` · 已选 ${st.sel.size}`:''}`;
    win.setTitle(st.search?`搜索「${st.search}」`:(baseOf(st.cwd)||'根目录')+' - 资源管理器');
  }
  function bindRow(tr,en){
    tr.addEventListener('click',e=>{
      if(e.ctrlKey||e.metaKey){ tr.classList.toggle('sel'); tr.classList.contains('sel')?st.sel.add(en.path):st.sel.delete(en.path); }
      else{ st.sel.clear(); $$('.fx-row.sel',tbody).forEach(n=>n.classList.remove('sel')); tr.classList.add('sel'); st.sel.add(en.path);
        if(isTouch){ smartOpen(en); } }
      $('.st-count',win.body).textContent=`${st.entries.length} 个项目 · 已选 ${st.sel.size}`; });
    tr.addEventListener('dblclick',()=>smartOpen(en));
    tr.addEventListener('contextmenu',e=>{ e.preventDefault();
      if(!st.sel.has(en.path)){ st.sel.clear(); $$('.fx-row.sel',tbody).forEach(n=>n.classList.remove('sel')); tr.classList.add('sel'); st.sel.add(en.path); }
      showMenu(e.clientX,e.clientY,fileMenuItems(en.path,en.kind,{paths:[...st.sel],onDone:refresh})); });
    tr.draggable=!isTouch;
    if(en.kind==='file'){ tr.addEventListener('pointerenter',()=>preloadDrag(en.path)); tr.addEventListener('pointerdown',()=>preloadDrag(en.path)); }
    tr.addEventListener('dragstart',e=>{
      if(!st.sel.has(en.path)){ st.sel.clear(); $$('.fx-row.sel',tbody).forEach(n=>n.classList.remove('sel')); tr.classList.add('sel'); st.sel.add(en.path); }
      e.dataTransfer.setData('application/x-pineink',JSON.stringify({paths:[...st.sel],src:'explorer'}));
      e.dataTransfer.effectAllowed='copyMove';
      const c=dragCache.get(en.path);
      if(c){ try{ e.dataTransfer.items.add(c.file); }catch(_){}
        try{ e.dataTransfer.setData('DownloadURL',`${c.file.type||'application/octet-stream'}:${c.file.name}:${c.url}`); }catch(_){} } });
    tr.addEventListener('dragend',()=>releaseDrag(en.path));
    if(en.kind==='dir'){
      tr.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); tr.classList.add('sel'); });
      tr.addEventListener('dragleave',()=>{ if(!st.sel.has(en.path)) tr.classList.remove('sel'); });
      tr.addEventListener('drop',async e=>{ e.preventDefault(); e.stopPropagation();
        const raw=e.dataTransfer.getData('application/x-pineink');
        if(raw){ const d=JSON.parse(raw);
          for(const p of d.paths){ if(p===en.path||en.path.startsWith(p+'/'))continue;
            try{ await fs.move(p,en.path+'/'+await fs.uniqueName(en.path,baseOf(p))); }catch(err){ toast(err.message,'error'); } }
          refresh(); touchDir(DESK);
        } else await importDataTransfer(e.dataTransfer,en.path); });
    }
  }
  function smartOpen(en){ // 智能分派：目录→导航，文件→对应 App
    if(en.kind==='dir') nav(en.path); else openPath(en.path);
  }
  function nav(p){ p=norm(p); st.hist=st.hist.slice(0,st.hi+1); st.hist.push(p); st.hi++;
    st.cwd=p; st.search=''; $('.fx-search',win.body).value=''; st.sel.clear(); refresh(); }
  async function refresh(){ if(st.search) await searchLoad(st.search); else await load(); render(); }
  /* 工具栏 */
  $('[data-a=back]',win.body).onclick=()=>{ if(st.hi>0){ st.hi--; st.cwd=st.hist[st.hi]; st.search=''; refresh(); } };
  $('[data-a=fwd]',win.body).onclick=()=>{ if(st.hi<st.hist.length-1){ st.hi++; st.cwd=st.hist[st.hi]; refresh(); } };
  $('[data-a=up]',win.body).onclick=()=>{ if(st.cwd!=='/') nav(parentOf(st.cwd)); };
  $('[data-a=refresh]',win.body).onclick=refresh;
  $('[data-a=side]',win.body).onclick=()=>$('.fx-side',win.body).classList.toggle('open');
  let sT; $('.fx-search',win.body).oninput=e=>{ clearTimeout(sT);
    sT=setTimeout(async()=>{ st.search=e.target.value.trim(); refresh(); },300); };
  /* 空白右键 */
  listEl.addEventListener('contextmenu',e=>{
    if(e.target.closest('.fx-row')) return; e.preventDefault();
    showMenu(e.clientX,e.clientY,[
      {label:'刷新',icon:I.refresh,action:refresh},
      {sep:true},
      {label:'新建文件夹',icon:I.folderPlus,action:async()=>{await newFolder(st.cwd);refresh();}},
      {label:'新建文本文档',icon:I.filePlus,action:async()=>{await newTextFile(st.cwd);refresh();}},
      {label:'新建 HTML 页面',icon:I.fileHtml,action:async()=>{await newHtmlFile(st.cwd);refresh();}},
      {sep:true},
      {label:'上传文件',icon:I.upload,action:()=>pickAndImport(st.cwd)},
      {label:'粘贴',icon:I.paste,action:async()=>{await pasteTo(st.cwd);refresh();}},
      {label:'挂载本地文件夹',icon:I.hdd,action:async()=>{const p=await mountLocalFolder(); if(p)nav(p);}},
    ]); });
  /* 列表放置（移入当前目录 / 导入物理文件） */
  listEl.addEventListener('dragover',e=>{ e.preventDefault(); });
  listEl.addEventListener('drop',async e=>{
    if(e.target.closest('.fx-row[data-kind=dir]')) return;
    e.preventDefault();
    const raw=e.dataTransfer.getData('application/x-pineink');
    if(raw){ const d=JSON.parse(raw);
      for(const p of d.paths){ if(parentOf(p)===st.cwd||p===st.cwd)continue;
        try{ await fs.move(p,st.cwd+'/'+await fs.uniqueName(st.cwd,baseOf(p))); }catch(err){ toast(err.message,'error'); } }
      refresh(); touchDir(DESK);
    } else await importDataTransfer(e.dataTransfer,st.cwd); });
  /* 框选 */
  { let sx,sy,on=false; const mq=$('.fx-marquee',win.body);
    listEl.addEventListener('mousedown',e=>{ if(e.button!==0||e.target.closest('.fx-row')||e.target.closest('th')) return;
      on=true; sx=e.clientX; sy=e.clientY; if(!e.ctrlKey){ st.sel.clear(); $$('.fx-row.sel',tbody).forEach(n=>n.classList.remove('sel')); } });
    addEventListener('mousemove',e=>{ if(!on) return;
      const lr=listEl.getBoundingClientRect();
      const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);
      if(w+h<6)return;
      mq.style.display='block'; mq.style.left=(x-lr.left+listEl.scrollLeft)+'px'; mq.style.top=(y-lr.top+listEl.scrollTop)+'px';
      mq.style.width=w+'px'; mq.style.height=h+'px';
      $$('.fx-row',tbody).forEach(r=>{ const rr=r.getBoundingClientRect();
        const hit=!(rr.right<x||rr.left>x+w||rr.bottom<y||rr.top>y+h);
        r.classList.toggle('sel',hit); hit?st.sel.add(r.dataset.path):st.sel.delete(r.dataset.path); }); });
    addEventListener('mouseup',()=>{ if(on){ on=false; mq.style.display='none';
      $('.st-count',win.body).textContent=`${st.entries.length} 个项目 · 已选 ${st.sel.size}`; } }); }
  const onFs=e=>{ if(e.detail.dir===st.cwd) refresh(); };
  bus.addEventListener('fs',onFs);
  const onRs=e=>{ if(e.detail===win.id) render(); };
  bus.addEventListener('winresize',onRs);
  win.onClose=()=>{ bus.removeEventListener('fs',onFs); bus.removeEventListener('winresize',onRs); };
  refresh();
  return win;
}

/* ================================================================
   记事本（撤销/恢复、字号、自动保存草稿）
================================================================ */
function openNotepad(path){
  const win=WM.create({title:path?baseOf(path):'无标题 - 记事本',icon:I.notepad,width:640,height:480,app:'notepad'});
  let fontSize=Conf.get('npFont',14), dirty=false, saveDir=path?parentOf(path):DESK, name=path?baseOf(path):null;
  win.body.innerHTML=`<div class="appbar">
    <button class="abtn" data-a="save" title="保存 Ctrl+S">${I.save}<span class="bl">保存</span></button>
    <span class="asep"></span>
    <button class="abtn" data-a="undo" title="撤销 Ctrl+Z">${I.undo}</button>
    <button class="abtn" data-a="redo" title="恢复 Ctrl+Y">${I.redo}</button>
    <span class="asep"></span>
    <button class="abtn" data-a="dec">A−</button>
    <button class="abtn" data-a="inc">A+</button>
    <button class="abtn" data-a="wrap" title="自动换行">换行</button>
    <span class="sp" style="flex:1"></span>
    <button class="abtn" data-a="export">${I.download}<span class="bl">导出</span></button>
   </div>
   <textarea class="np-text" spellcheck="false" placeholder="在此输入…"></textarea>
   <div class="statusbar"><span class="np-info"></span><span class="sp"></span><span class="np-dirty"></span></div>`;
  const ta=$('.np-text',win.body);
  ta.style.fontSize=fontSize+'px';
  const draftKey='pineink.draft:'+(path||'untitled');
  const info=()=>{ $('.np-info',win.body).textContent=`${ta.value.length} 字符 · ${ta.value.split('\n').length} 行 · ${fontSize}px`;
    $('.np-dirty',win.body).textContent=dirty?'未保存 ●':'已保存'; };
  (async()=>{
    let text='';
    if(path){ try{ text=await fs.readText(path); }catch(e){ toast('读取失败：'+e.message,'error'); } }
    const draft=localStorage.getItem(draftKey);
    if(draft!==null&&draft!==text){ text=draft; dirty=true; toast('已恢复未保存的草稿'); }
    ta.value=text; info();
  })();
  let dT; ta.addEventListener('input',()=>{ dirty=true; info();
    clearTimeout(dT); dT=setTimeout(()=>{ try{ localStorage.setItem(draftKey,ta.value); }catch(_){} },400); });
  async function save(){
    if(!name){ const n=await uiPrompt('保存为','无标题.txt','将保存到 '+saveDir); if(!n) return; name=n; path=saveDir+'/'+name; }

/* ================================================================
   表格（CSV/TSV 双视图）
================================================================ */
function parseCSV(text,delim){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell.replace(/\r$/,'')); rows.push(row); row=[]; cell=''; }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell.replace(/\r$/,'')); rows.push(row); }
  return rows;
}

  stage.addEventListener('wheel',e=>{ e.preventDefault();

  { let dragging=false,sx,sy;
    stage.addEventListener('pointerdown',e=>{ dragging=true;sx=e.clientX-tx;sy=e.clientY-ty; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove',e=>{ if(dragging){ tx=e.clientX-sx; ty=e.clientY-sy; apply(); } });

  const A=(a,f)=>$(`[data-a=${a}]`,win.body).onclick=f;
  A('zi',()=>{scale=Math.min(20,scale*1.25);apply();}); A('zo',()=>{scale=Math.max(.05,scale*.8);apply();});
