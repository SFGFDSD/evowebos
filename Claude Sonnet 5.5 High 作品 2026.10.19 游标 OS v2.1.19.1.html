<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1116">
<title>游标 · VERNIER OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Martian+Mono:wght@400;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===================== 游标 · VERNIER — 刻线夜航美学 ===================== */
:root{--tbh:52px;--r:6px;--fs:1;--dur:1;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.1,.3,1.15);
--f-ui:'Bricolage Grotesque','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--f-ser:'Noto Serif SC','Songti SC','SimSun',serif;--f-mono:'Martian Mono','JetBrains Mono',Consolas,monospace;--ac:#e8b04b;--on-ac:#1a1304}
[data-theme=dark]{color-scheme:dark;--bg0:#06090c;--bg1:#0b1116;--bg2:#101921;--bg3:#16222c;--bg4:#1f2f3c;--ln:#1f2e3a;--ln2:#2e4352;--tx:#dbe6ea;--tx2:#8ea4af;--tx3:#5b707b;--glass:rgba(9,15,20,.84);--shadow:0 26px 60px -14px rgba(0,0,0,.7),0 0 0 1px rgba(120,170,190,.07);--hov:rgba(150,200,225,.08);--ok:#5fd3a0;--bad:#ff6b57;--act:var(--ac);--gl:rgba(150,200,220,.045)}
[data-theme=light]{color-scheme:light;--bg0:#d6cfb8;--bg1:#efe9d8;--bg2:#f7f3e6;--bg3:#e9e2cd;--bg4:#ddd5bb;--ln:#d3caae;--ln2:#b5ab8c;--tx:#1b2328;--tx2:#4c5a60;--tx3:#7f887d;--glass:rgba(244,239,225,.88);--shadow:0 22px 50px -16px rgba(70,52,16,.45),0 0 0 1px rgba(80,60,20,.14);--hov:rgba(60,45,10,.07);--ok:#1f8a5b;--bad:#c4361f;--act:color-mix(in srgb,var(--ac) 58%,#000);--gl:rgba(70,55,20,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--tx);font:calc(13px*var(--fs))/1.45 var(--f-ui);user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}
body.noanim *{animation-duration:.001s!important;transition-duration:.001s!important}
button{font:inherit;color:inherit;cursor:pointer}
svg.ic{flex:none;display:block}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg1);border:1px solid var(--ln2);border-radius:var(--r);padding:6px 9px;outline:0;user-select:text;-webkit-user-select:text;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 25%,transparent)}
input[type=checkbox]{accent-color:var(--ac)}input[type=range]{accent-color:var(--ac);padding:0}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--ln2);border:3px solid transparent;background-clip:padding-box;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:padding-box;border:3px solid transparent}::-webkit-scrollbar-corner{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--ln2) transparent}
.mono{font-family:var(--f-mono);font-size:.92em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;background:var(--bg3);border:1px solid var(--ln2);border-radius:var(--r);color:var(--tx);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--bg4);border-color:var(--ac)}.btn:active:not(:disabled){transform:translateY(1px)}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:600}.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.bad{border-color:var(--bad);color:var(--bad)}.btn.bad:hover{background:var(--bad);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.on{background:color-mix(in srgb,var(--ac) 22%,var(--bg3));border-color:var(--ac);color:var(--act)}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:var(--r);overflow:hidden}.seg button{border:0;background:var(--bg3);padding:5px 10px;display:inline-flex;gap:5px;align-items:center;border-right:1px solid var(--ln2)}.seg button:last-child{border-right:0}.seg button.on{background:var(--ac);color:var(--on-ac)}.seg button:hover:not(.on){background:var(--bg4)}
.sw{appearance:none;width:38px;height:20px;border-radius:20px;background:var(--bg4);border:1px solid var(--ln2);position:relative;cursor:pointer;padding:0;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tx2);transition:.25s var(--spring)}
.sw:checked{background:var(--ac);border-color:var(--ac)}.sw:checked::after{left:20px;background:var(--on-ac)}
.spin{width:22px;height:22px;border:2px solid var(--ln2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes unfold{from{opacity:0;clip-path:inset(0 0 96% 0);transform:translateY(8px) scale(.985)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes pulse{50%{opacity:.35}}

/* ---------- 桌面 ---------- */
#wall{position:fixed;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .5s}
#grat{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px),radial-gradient(circle,var(--gl) 1px,transparent 1.5px);background-size:96px 96px,96px 96px,24px 24px}
body[data-grat="0"] #grat{display:none}
#walldim{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0}
#work{position:fixed;inset:0 0 var(--tbh) 0}
body[data-tb=top] #work{inset:var(--tbh) 0 0 0}body[data-tbhide="1"] #work{inset:0}
#icons{position:absolute;inset:0;overflow:hidden;touch-action:none}
#icons.dropping{box-shadow:inset 0 0 0 2px var(--ac),inset 0 0 60px color-mix(in srgb,var(--ac) 25%,transparent)}
.dicon{position:absolute;width:var(--cw,92px);height:var(--ch,102px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border-radius:var(--r);cursor:pointer;touch-action:none;border:1px solid transparent;animation:rise .4s var(--ease) both}
.dicon.settle{transition:left .34s var(--spring),top .34s var(--spring)}
.dicon:hover{background:rgba(160,200,225,.12);border-color:rgba(160,200,225,.2)}
.dicon.sel{background:color-mix(in srgb,var(--ac) 28%,transparent);border-color:var(--ac)}
.dicon.drop-hover{background:color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
.dicon .dic{width:var(--is,52px);height:var(--is,52px);display:grid;place-items:center;pointer-events:none}
.dicon .dic svg,.dicon .dic img{width:100%;height:100%;object-fit:contain}
.dicon .dic img.th{border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.dlb{font-size:12px;text-align:center;line-height:1.25;overflow:hidden;color:#f2f7f9;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.6);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;pointer-events:none;max-width:100%}
body[data-tone=light] .dlb{color:#1b2328;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.tile{display:inline-grid;place-items:center;width:100%;height:100%;border-radius:calc(var(--r)*1.3);position:relative;background:linear-gradient(150deg,hsl(var(--h) 40% 24%),hsl(var(--h) 45% 11%));border:1px solid hsl(var(--h) 55% 42%);color:hsl(var(--h) 90% 74%);box-shadow:inset 0 0 0 3px hsl(var(--h) 40% 8% / .6)}
.tile::before{content:'';position:absolute;left:4px;top:4px;width:7px;height:7px;border-left:1.5px solid currentColor;border-top:1.5px solid currentColor;opacity:.6}
[data-theme=light] .tile{background:linear-gradient(150deg,hsl(var(--h) 50% 90%),hsl(var(--h) 45% 78%));color:hsl(var(--h) 65% 24%);border-color:hsl(var(--h) 45% 48%);box-shadow:inset 0 0 0 3px hsl(var(--h) 60% 96% / .6)}
.marquee{position:absolute;pointer-events:none;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);z-index:20;display:none}
#snap{position:absolute;pointer-events:none;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:var(--r);z-index:8000;opacity:0;transition:all .18s var(--ease)}
#snap.on{opacity:1}
#windows{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* ---------- 窗口 ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--ln2);border-radius:var(--r);box-shadow:var(--shadow);pointer-events:auto;animation:unfold calc(.36s*var(--dur)) var(--ease) both;transition:opacity .2s,filter .2s}
.win.anim{transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease),opacity .2s,transform .26s var(--ease)}
.win.focus{border-color:color-mix(in srgb,var(--ac) 50%,var(--ln2))}
.win::before,.win::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;z-index:6;border:2px solid var(--ac);opacity:0;transition:opacity .2s}
.win::before{left:-3px;top:-3px;border-right:0;border-bottom:0}.win::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.win.focus::before,.win.focus::after{opacity:.95}.win.max::before,.win.max::after{display:none}
.win.min{opacity:0;pointer-events:none!important;transform:translateY(40px) scale(.94)}
.win.max{border-radius:0}
.wt{height:38px;display:flex;align-items:center;gap:9px;padding-left:12px;background:linear-gradient(180deg,var(--bg3),var(--bg2));border-bottom:1px solid var(--ln);position:relative;flex:none;touch-action:none;border-radius:var(--r) var(--r) 0 0;cursor:default}
.wt::after{content:'';position:absolute;left:0;right:0;bottom:0;height:9px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--tick,var(--ln2)) 0 1px,transparent 1px 8px) bottom/100% 4px no-repeat,repeating-linear-gradient(90deg,var(--tick,var(--ln2)) 0 1px,transparent 1px 40px) bottom/100% 9px no-repeat}
.win.focus .wt{--tick:var(--ac)}
.wi{color:var(--act);display:grid;place-items:center}
.wn{font-family:var(--f-ser);font-weight:700;letter-spacing:.05em;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.wx{display:flex;align-items:center;gap:4px}
.wc{display:flex;height:100%}.wc button{width:44px;border:0;background:transparent;color:var(--tx2);display:grid;place-items:center;transition:background .15s,color .15s}
.wc button:hover{background:var(--hov);color:var(--tx)}.wc button.cl:hover{background:var(--bad);color:#fff}
.wc button:last-child{border-radius:0 var(--r) 0 0}
.wb{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:0 0 var(--r) var(--r);background:var(--bg1)}
.win.max .wb{border-radius:0}.win.max .wc button:last-child{border-radius:0}
.rz{position:absolute;z-index:7;touch-action:none}
.rz.n{top:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}.rz.s{bottom:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rz.e{right:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}.rz.w{left:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rz.ne{top:-5px;right:-5px;width:16px;height:16px;cursor:nesw-resize}.rz.nw{top:-5px;left:-5px;width:16px;height:16px;cursor:nwse-resize}
.rz.se{bottom:-5px;right:-5px;width:16px;height:16px;cursor:nwse-resize}.rz.sw{bottom:-5px;left:-5px;width:16px;height:16px;cursor:nesw-resize}
.win.max .rz,.win.immersive .rz{display:none}
body.dragging iframe,body.dragging video,body.dragging embed{pointer-events:none}body.dragging{cursor:grabbing}
body.peeking .win:not(.peek){opacity:.07!important;pointer-events:none!important}
body.peek-desk .win{opacity:.06!important;pointer-events:none!important}
.win.immersive{position:fixed!important;inset:0!important;left:0!important;top:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;border-radius:0!important;border:0;z-index:99999!important;transform:none!important}
.win.immersive .wt{display:none}.win.immersive .wb{border-radius:0}
.exitfs{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;z-index:100000;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#fff;opacity:.28;display:none;place-items:center;font-size:20px;line-height:1;padding:0}
.exitfs:hover,.exitfs:active{opacity:.95}.win.immersive .exitfs{display:grid}
/* ---------- 任务栏 ---------- */
#tb{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);display:flex;align-items:stretch;background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border-top:1px solid var(--ln2);z-index:9000;transition:transform .3s var(--ease)}
#tb::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--ln2) 0 1px,transparent 1px 10px) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--ac) 0 1px,transparent 1px 100px) top/100% 6px no-repeat;opacity:.7}
body[data-tb=top] #tb{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--ln2)}body[data-tb=top] #tb::before{top:auto;bottom:0;transform:scaleY(-1)}
body[data-tbhide="1"] #tb{transform:translateY(calc(100% - 3px))}body[data-tbhide="1"][data-tb=top] #tb{transform:translateY(calc(-100% + 3px))}
body[data-tbhide="1"] #tb:hover,#tb.show{transform:none!important}
#tb-start{width:54px;border:0;background:transparent;display:grid;place-items:center;color:var(--act);position:relative;flex:none}
#tb-start:hover,#tb-start.on{background:var(--hov)}#tb-start svg{transition:transform .5s var(--spring)}#tb-start.on svg{transform:rotate(90deg)}
#tb-search{margin:8px 6px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--ln2);border-radius:var(--r);background:var(--bg1);color:var(--tx3);width:170px;flex:none}
#tb-search:hover{border-color:var(--ac);color:var(--tx2)}
#tb-apps{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;padding-top:4px}
body[data-tbc="1"] #tb-apps{justify-content:center}
.tbb{min-width:48px;max-width:178px;display:flex;align-items:center;gap:8px;padding:0 13px;border:0;background:transparent;position:relative;flex:none;color:var(--tx);animation:rise .3s var(--ease) both}
.tbb:hover{background:var(--hov)}.tbb .wi{color:var(--act)}
.tbb span.t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbb::after{content:'';position:absolute;bottom:3px;left:38%;right:38%;height:2px;background:var(--ac);opacity:.55;transition:all .25s var(--spring)}
.tbb.focus::after{left:14%;right:14%;height:3px;opacity:1}.tbb.min::after{opacity:.25}
.tbb.focus{background:var(--hov)}
#tb-tray{display:flex;align-items:center;flex:none;gap:2px;padding-right:2px}
.tray{height:36px;min-width:36px;padding:0 8px;border:0;background:transparent;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r)}.tray:hover{background:var(--hov);color:var(--tx)}
#tb-clock{flex-direction:column;gap:0;line-height:1.2;padding:0 12px;color:var(--tx);text-align:center}#tb-clock b{font-family:var(--f-mono);font-size:12px;font-weight:600}#tb-clock small{font-size:10.5px;color:var(--tx2)}
#tb-show{width:12px;border:0;border-left:1px solid var(--ln2);background:transparent;padding:0;margin-left:4px;flex:none}#tb-show:hover{background:var(--ac)}
#peekcard{position:fixed;z-index:9100;background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;width:210px;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .15s,transform .2s var(--ease)}
#peekcard.on{opacity:1;pointer-events:auto;transform:none}
#peekcard .ph{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px}#peekcard .ph span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#peekcard .pv{height:92px;border:1px dashed var(--ln2);border-radius:3px;display:grid;place-items:center;color:var(--act);background:repeating-linear-gradient(0deg,transparent 0 11px,var(--gl) 11px 12px),repeating-linear-gradient(90deg,transparent 0 11px,var(--gl) 11px 12px)}
#peekcard .pv i{display:block;border:1.5px solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
/* ---------- 开始菜单 / 时钟面板 ---------- */
.panel{position:fixed;z-index:9500;background:var(--glass);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--ln2);border-radius:calc(var(--r)*1.4);box-shadow:var(--shadow);transition:opacity .22s,transform .3s var(--ease),visibility .22s;transform-origin:bottom left}
.panel.hide{opacity:0;visibility:hidden;transform:translateY(16px) scale(.97);pointer-events:none}
#start{left:8px;bottom:calc(var(--tbh) + 8px);width:min(660px,calc(100vw - 16px));height:min(640px,calc(100dvh - var(--tbh) - 22px));display:flex;flex-direction:column}
body[data-tb=top] #start{bottom:auto;top:calc(var(--tbh) + 8px);transform-origin:top left}
.st-h{padding:14px 14px 10px;display:flex;gap:8px}.st-h .sbox{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--ln2);background:var(--bg1);border-radius:var(--r);padding:0 12px}
.st-h input{border:0;background:transparent;box-shadow:none!important;flex:1;height:38px;padding:0}
.st-b{flex:1;display:flex;min-height:0}
.st-l{flex:1;overflow:auto;padding:0 14px 14px;min-width:0}.st-r{width:190px;border-left:1px solid var(--ln);padding:6px;overflow:auto;display:flex;flex-direction:column;gap:2px;flex:none}
.st-t{font-family:var(--f-ser);font-size:11.5px;letter-spacing:.2em;color:var(--tx3);margin:12px 4px 8px;display:flex;align-items:center;gap:8px}.st-t::after{content:'';flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--ln2) 0 1px,transparent 1px 5px)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.sapp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid transparent;border-radius:var(--r);background:transparent;animation:rise .35s var(--ease) both}
.sapp:hover{background:var(--hov);border-color:var(--ln2)}.sapp .tl{width:42px;height:42px}.sapp span{font-size:12px;text-align:center}
.srow{display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;background:transparent;border-radius:var(--r);width:100%;text-align:left}.srow:hover{background:var(--hov)}
.srow .tl{width:26px;height:26px;flex:none}.srow .sub{font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clockp{right:8px;bottom:calc(var(--tbh) + 8px);width:min(340px,calc(100vw - 16px));transform-origin:bottom right;padding:16px}
body[data-tb=top] #clockp{bottom:auto;top:calc(var(--tbh) + 8px);transform-origin:top right}
.bigclock{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.02em}.bigdate{color:var(--tx2);margin-bottom:12px}
.cal-h{display:flex;align-items:center;gap:4px;margin-bottom:6px}.cal-h b{flex:1;font-family:var(--f-ser);font-size:14px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal-g i{font-style:normal;font-size:11px;color:var(--tx3);padding:4px 0}
.cal-g button{border:1px solid transparent;background:transparent;height:34px;border-radius:var(--r);font-family:var(--f-mono);font-size:12px}.cal-g button:hover{background:var(--hov);border-color:var(--ln2)}
.cal-g button.o{color:var(--tx3)}.cal-g button.today{background:var(--ac);color:var(--on-ac);font-weight:700}

/* ---------- 菜单 / 提示 / 对话框 ---------- */

const SysDB={p:null,open(){if(this.p)return this.p;this.p=new Promise(res=>{try{if(!window.indexedDB)return res(null);const rq=indexedDB.open('vernier-sys',1);rq.onupgradeneeded=()=>{const d=rq.result;d.createObjectStore('m',{keyPath:'k'});d.createObjectStore('h',{keyPath:'name'});d.createObjectStore('kv',{keyPath:'k'});d.createObjectStore('nodes',{keyPath:'path'});d.createObjectStore('blobs')};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch{res(null)}});return this.p}};
async function tx(stores,mode,fn){const db=await SysDB.open();if(!db)throw new Error('IndexedDB 不可用');return new Promise((res,rej)=>{const t=db.transaction(stores,mode);let r;try{r=fn(...[].concat(stores).map(s=>t.objectStore(s)))}catch(e){rej(e);return}t.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

const Meta={m:new Map(),q:new Map(),t:null,

 get(k){return this.m.get(k)},set(k,m,r){const v={m,r};this.m.set(k,v);this.q.set(k,v);this.soon()},del(k){if(!this.m.has(k))return;this.m.delete(k);this.q.set(k,null);this.soon()},
 delPrefix(p){for(const k of[...this.m.keys()])if(k===p||k.startsWith(p+'/'))this.del(k)},
 movePrefix(a,b){for(const[k,v]of[...this.m])if(k===a||k.startsWith(a+'/')){this.del(k);this.set(b+k.slice(a.length),v.m,v.r)}},
 soon(){clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),250)},
 async flush(){if(window.__resetting||!this.q.size)return;const q=[...this.q];this.q.clear();try{await tx('m','readwrite',s=>{for(const[k,v]of q){if(v)s.put({k,m:v.m,r:v.r});else s.delete(k)}})}catch{try{localStorage.setItem('vernier.meta',JSON.stringify(Object.fromEntries(this.m)))}catch{}}}};

const cbify=(proto,names)=>{for(const n of names){const f=proto[n];if(!f)continue;proto[n]=function(...a){let cb=null;while(a.length&&(typeof a[a.length-1]==='function'||a[a.length-1]===undefined)){const x=a.pop();if(x)cb=x}const p=f.apply(this,a);if(cb){p.then(r=>cb(null,r),e=>cb(e));return}return p}}};
/* 4.1 IndexedDB 后端：节点内存索引 + 元数据/二进制分库，读取同步级速度 */
class NodeFS{
 constructor(){this.nodes=new Map();this.kids=new Map();this.persist=true;this.mem=new Map();this.caps={mtime:true};this.label='IndexedDB 存储';this.bt=Date.now()}
 async init(){try{const all=await tx('nodes','readonly',s=>s.getAll());for(const n of all)this._idx(n)}catch(e){this.persist=false;console.warn('IndexedDB 不可用，降级为内存存储',e)}}
 _idx(n){this.nodes.set(n.path,n);let s=this.kids.get(n.parent);if(!s)this.kids.set(n.parent,s=new Set());s.add(n.name)}
 _un(p){const n=this.nodes.get(p);if(!n)return;this.nodes.delete(p);const s=this.kids.get(n.parent);if(s)s.delete(n.name);this.kids.delete(p)}
 _get(p){p=P.norm(p);const n=this.nodes.get(p);if(!n)throw new FSError('ENOENT',p);return n}
 _st(n){return{name:n.name,type:n.type,size:n.size||0,mtime:n.mtime,ctime:n.ctime,mime:n.mime||''}}
 _sub(p){const pre=p==='/'?'/':p+'/',o=[];for(const[k,n]of this.nodes)if(k===p||k.startsWith(pre))o.push(n);return o}
 async _commit({put=[],del=[],blobs=[],delBlobs=[]}){
  if(this.persist){try{await tx(['nodes','blobs'],'readwrite',(n,b)=>{for(const[id,bl]of blobs)b.put(bl,id);for(const p of del)n.delete(p);for(const x of put)n.put(x);for(const id of delBlobs)b.delete(id)})}catch(e){throw mapErr(e)}}
  else{for(const[id,bl]of blobs)this.mem.set(id,bl);for(const id of delBlobs)this.mem.delete(id)}
  for(const p of del)this._un(p);for(const x of put)this._idx(x)}
 async stat(p){p=P.norm(p);if(p==='/')return{name:'',type:'dir',size:0,mtime:this.bt};return this._st(this._get(p))}
 async readdir(p){p=P.norm(p);if(p!=='/'){const n=this._get(p);if(n.type!=='dir')throw new FSError('ENOTDIR',p)}const o=[];const s=this.kids.get(p);if(s)for(const nm of s){const n=this.nodes.get(P.join(p,nm));if(n)o.push(this._st(n))}return o}
 async readFile(p,flag){const n=this._get(p);if(n.type!=='file')throw new FSError('EISDIR',p);let b=this.persist?await tx('blobs','readonly',s=>s.get(n.id)).catch(e=>{throw mapErr(e,p)}):this.mem.get(n.id);if(b==null)b=new Blob([]);if(!(b instanceof Blob))b=new Blob([b]);b=b.type?b:new Blob([b],{type:n.mime||mimeOf(n.name)});return conv(b,flag)}
 async writeFile(p,data,o={}){p=P.norm(p);const par=P.dirname(p);if(par!=='/'){const pn=this.nodes.get(par);if(!pn)throw new FSError('ENOENT',par);if(pn.type!=='dir')throw new FSError('ENOTDIR',par)}const old=this.nodes.get(p);if(old&&old.type==='dir')throw new FSError('EISDIR',p);
  const blob=toBlob(data,P.base(p)),now=Date.now(),id=uid();const node={path:p,parent:par,name:P.base(p),type:'file',size:blob.size,mtime:o.mtime||now,ctime:old?old.ctime:now,id,mime:blob.type};
  const job={put:[node],blobs:[[id,blob]],delBlobs:old?[old.id]:[]};
  try{await this._commit(job)}catch(e){if(e&&(e.name==='DataCloneError'||/clone/i.test(e.message||''))){job.blobs=[[id,await blob.arrayBuffer()]];await this._commit(job)}else throw e}}
 async mkdir(p,o={}){p=P.norm(p);if(p==='/')return;const ex=this.nodes.get(p);if(ex){if(ex.type==='dir')return;throw new FSError('EEXIST',p)}const par=P.dirname(p);if(par!=='/'){const pn=this.nodes.get(par);if(!pn)throw new FSError('ENOENT',par);if(pn.type!=='dir')throw new FSError('ENOTDIR',par)}const now=Date.now();await this._commit({put:[{path:p,parent:par,name:P.base(p),type:'dir',size:0,mtime:o.mtime||now,ctime:now}]})}
 async unlink(p){const n=this._get(p);if(n.type!=='file')throw new FSError('EISDIR',p);await this._commit({del:[n.path],delBlobs:[n.id]})}
 async rmdir(p,o={}){p=P.norm(p);const n=this._get(p);if(n.type!=='dir')throw new FSError('ENOTDIR',p);const all=this._sub(p);if(!o.recursive&&all.length>1)throw new FSError('ENOTEMPTY',p);await this._commit({del:all.map(x=>x.path),delBlobs:all.filter(x=>x.id).map(x=>x.id)})}
 async rename(a,b){a=P.norm(a);b=P.norm(b);this._get(a);const pb=P.dirname(b);if(pb!=='/'&&!this.nodes.has(pb))throw new FSError('ENOENT',pb);const all=this._sub(a);await this._commit({del:all.map(x=>x.path),put:all.map(x=>{const np=b+x.path.slice(a.length);return{...x,path:np,parent:P.dirname(np),name:P.base(np)}})})}
 async exists(p){p=P.norm(p);return p==='/'||this.nodes.has(p)}
 async du(p){let size=0,files=0,dirs=0;for(const n of this._sub(P.norm(p))){if(n.type==='file'){size+=n.size||0;files++}else if(n.path!==P.norm(p))dirs++}return{size,files,dirs}}
}
cbify(NodeFS.prototype,['stat','readdir','readFile','writeFile','mkdir','unlink','rmdir','rename','exists']);
/* 4.2 句柄后端：同时服务 OPFS 与 File System Access（本地文件夹）——两者共用同一套 FileSystemDirectoryHandle 接口 */
class HandleBackend{
 constructor(root,label){this.root=root;this.label=label;this.dc=new Map();this.caps={mtime:false}}
 forget(p){for(const k of[...this.dc.keys()])if(k===p||k.startsWith(p+'/'))this.dc.delete(k)}
 async dir(p,create){p=P.norm(p);if(p==='/')return this.root;let h=this.dc.get(p);if(h)return h;const par=await this.dir(P.dirname(p),create);try{h=await par.getDirectoryHandle(P.base(p),{create:!!create})}catch(e){throw mapErr(e,p)}this.dc.set(p,h);return h}
 async node(p){p=P.norm(p);if(p==='/')return{kind:'directory',h:this.root};const par=await this.dir(P.dirname(p));const name=P.base(p);
  try{return{kind:'file',h:await par.getFileHandle(name)}}catch(e){if(e.name!=='TypeMismatchError'&&e.name!=='NotFoundError')throw mapErr(e,p)}
  try{const h=await par.getDirectoryHandle(name);this.dc.set(p,h);return{kind:'directory',h}}catch(e){throw mapErr(e,p)}}
 async stat(p){const n=await this.node(p);if(n.kind==='directory')return{name:P.base(p),type:'dir',size:0,mtime:0};try{const f=await n.h.getFile();return{name:f.name,type:'file',size:f.size,mtime:f.lastModified,mime:f.type}}catch(e){throw mapErr(e,p)}}
 async readdir(p){const d=await this.dir(p);const out=[],files=[];try{for await(const[name,h]of d.entries()){if(h.kind==='directory')out.push({name,type:'dir',size:0,mtime:0});else files.push([name,h])}}catch(e){throw mapErr(e,p)}
  for(let i=0;i<files.length;i+=32){const part=await Promise.all(files.slice(i,i+32).map(async([name,h])=>{try{const f=await h.getFile();return{name,type:'file',size:f.size,mtime:f.lastModified,mime:f.type}}catch{return{name,type:'file',size:0,mtime:0}}}));out.push(...part)}return out}
 async readFile(p,flag){const n=await this.node(p);if(n.kind!=='file')throw new FSError('EISDIR',p);let f;try{f=await n.h.getFile()}catch(e){throw mapErr(e,p)}return conv(f,flag)}
 async writeFile(p,data){const par=await this.dir(P.dirname(p));let fh;try{fh=await par.getFileHandle(P.base(p),{create:true})}catch(e){if(e.name==='TypeMismatchError')throw new FSError('EISDIR',p);throw mapErr(e,p)}
  if(!fh.createWritable)throw new FSError('EIO',p,'浏览器不支持写入');let w;try{w=await fh.createWritable();await w.write(data instanceof Blob||typeof data==='string'||ArrayBuffer.isView(data)||data instanceof ArrayBuffer?data:String(data));await w.close()}catch(e){try{await w.abort()}catch{}throw mapErr(e,p)}}
 async mkdir(p){p=P.norm(p);if(p==='/')return;const par=await this.dir(P.dirname(p));try{this.dc.set(p,await par.getDirectoryHandle(P.base(p),{create:true}))}catch(e){throw mapErr(e,p)}}
 async unlink(p){const par=await this.dir(P.dirname(p));try{await par.removeEntry(P.base(p))}catch(e){throw mapErr(e,p)}}
 async rmdir(p,o={}){const par=await this.dir(P.dirname(p));try{await par.removeEntry(P.base(p),{recursive:!!o.recursive})}catch(e){throw mapErr(e,p)}this.forget(P.norm(p))}
 async rename(a,b){const n=await this.node(a);if(typeof n.h.move!=='function')throw new FSError('ENOSYS',a);const dp=await this.dir(P.dirname(b));try{await n.h.move(dp,P.base(b))}catch(e){throw new FSError('ENOSYS',a,e.message)}this.forget(P.norm(a))}
 async exists(p){try{await this.node(p);return true}catch(e){if(e.code==='ENOENT'||e.code==='ENOTDIR')return false;throw e}}
}
cbify(HandleBackend.prototype,['stat','readdir','readFile','writeFile','mkdir','unlink','rmdir','rename','exists']);

/* ============ 5. 统一虚拟文件系统 fs（挂载点路由，上层无任何 isLocal 分支） ============ */
const fs=(()=>{
 const mounts=new Map(),subs=new Set(),duCache=new Map();let pend=new Set(),pt=null;
 const mountFor=p=>{let b=null;for(const m of mounts.values())if(p===m.path||p.startsWith(m.path+'/'))if(!b||m.path.length>b.path.length)b=m;return b};
 const resolve=p=>{const m=mountFor(p);return m?{m,b:m.backend,rel:p.slice(m.path.length)||'/'}:null};
 const need=p=>{const r=resolve(p);if(!r)throw new FSError('EACCES',p,'该位置是只读的虚拟目录');return r};
 const vseg=p=>{const base=p==='/'?'':p;const s=new Set();for(const k of mounts.keys())if(k.startsWith(base+'/')){s.add(k.slice(base.length+1).split('/')[0])}if(p==='/')s.add('mnt');if(p==='/mnt')s.add('local');return s};
 const isV=p=>!mountFor(p)&&(p==='/'||p==='/mnt'||p==='/mnt/local'||[...mounts.keys()].some(k=>k.startsWith(p+'/')));
 const meta=(path,st)=>{const m=Meta.get(path);if(m&&(st.type==='dir'||m.r===st.mtime))st.mtime=m.m;return st};
 const emit=path=>{path=P.norm(path);pend.add(path);pend.add(P.dirname(path));for(const k of[...duCache.keys()])if(P.isUnder(path,k)||P.isUnder(k,path))duCache.delete(k);clearTimeout(pt);pt=setTimeout(()=>{const s=pend;pend=new Set();subs.forEach(f=>{try{f(s)}catch(e){console.error(e)}})},40)};
 const api={
  mounts,info:{},
  on(f){subs.add(f);return()=>subs.delete(f)},emit,isVirtual:isV,mountFor,resolve,
  async stat(path){path=P.norm(path);if(isV(path))return{name:P.base(path),path,type:'dir',size:0,mtime:0,virtual:true};const r=need(path);const st=await r.b.stat(r.rel,false);st.path=path;st.name=r.rel==='/'?r.m.label:P.base(path);if(r.rel==='/'){st.drive=true;st.label=r.m.label}return meta(path,st)},
  async readdir(path){path=P.norm(path);if(isV(path)){return[...vseg(path)].map(n=>{const f=P.join(path,n),m=mounts.get(f);return{name:m?m.label:n,path:f,type:'dir',size:0,mtime:0,drive:!!m,label:m&&m.label,virtual:!m,mount:!!m}})}
   const r=need(path);const l=await r.b.readdir(r.rel,false);return l.map(st=>{st.path=P.join(path,st.name);return meta(st.path,st)})},
  async readFile(path,flag){path=P.norm(path);const r=need(path);return r.b.readFile(r.rel,flag)},
  async writeFile(path,data,o={}){path=P.norm(path);const r=need(path);if(r.rel==='/')throw new FSError('EISDIR',path);const mtime=o.mtime||Date.now();
   try{await r.b.writeFile(r.rel,data,{mtime})}catch(e){if(e.code==='ENOENT'){await api.mkdir(P.dirname(path),{recursive:true});await r.b.writeFile(r.rel,data,{mtime})}else throw e}
   if(!r.b.caps.mtime){try{const st=await r.b.stat(r.rel);Meta.set(path,mtime,st.mtime)}catch{}}emit(path)},
  async mkdir(path,o={}){path=P.norm(path);if(isV(path))return;const r=need(path);const mtime=o.mtime||Date.now();
   const chain=[];let c=r.rel;while(c!=='/'){chain.unshift(c);c=P.dirname(c)}
   for(let i=0;i<chain.length;i++){const sub=chain[i],full=r.m.path+sub;const last=i===chain.length-1;if(await r.b.exists(sub)){if(last&&!o.recursive){const st=await r.b.stat(sub);if(st.type!=='dir')throw new FSError('EEXIST',path)}if(last&&o.mtime&&!r.b.caps.mtime)Meta.set(full,mtime,0);continue}
    if(!last&&!o.recursive)throw new FSError('ENOENT',full);await r.b.mkdir(sub,{mtime});if(!r.b.caps.mtime)Meta.set(full,mtime,0)}emit(path)},
  async remove(path,o={}){path=P.norm(path);const r=need(path);if(r.rel==='/')throw new FSError('EACCES',path,'不能删除根位置，请使用卸载');const st=await r.b.stat(r.rel);if(st.type==='dir')await r.b.rmdir(r.rel,{recursive:true});else await r.b.unlink(r.rel);Meta.delPrefix(path);emit(path)},
  async rmdir(path,o){return api.remove(path,o)},async unlink(path){return api.remove(path)},
  async exists(path){path=P.norm(path);if(isV(path))return true;const r=resolve(path);if(!r)return false;try{return await r.b.exists(r.rel)}catch{return false}},
  async copy(src,dst,_st){src=P.norm(src);dst=P.norm(dst);if(P.isUnder(dst,src))throw new FSError('EINVAL',dst,'不能复制到自身内部');const st=_st||await api.stat(src);
   if(st.type==='dir'){await api.mkdir(dst,{recursive:true,mtime:st.mtime});const rr=need(dst);if(!rr.b.caps.mtime)Meta.set(dst,st.mtime,0);for(const c of await api.readdir(src))await api.copy(c.path,P.join(dst,c.name),c)}
   else{const b=await api.readFile(src,'blob');await api.writeFile(dst,b,{mtime:st.mtime})}emit(dst)},
  async move(src,dst){src=P.norm(src);dst=P.norm(dst);if(src===dst)return;if(P.isUnder(dst,src))throw new FSError('EINVAL',dst,'不能移动到自身内部');const a=need(src),b=need(dst);if(a.rel==='/')throw new FSError('EACCES',src);
   if(await api.exists(dst))throw new FSError('EEXIST',dst);const st0=await api.stat(src);
   if(a.m===b.m){try{await a.b.rename(a.rel,b.rel);Meta.movePrefix(src,dst);if(!a.b.caps.mtime){const st=await b.b.stat(b.rel);if(st.type==='file')Meta.set(dst,st0.mtime,st.mtime);else Meta.set(dst,st0.mtime,0)}emit(src);emit(dst);return}catch(e){if(e.code!=='ENOSYS')throw e}}
   await api.copy(src,dst,st0);await api.remove(src);emit(dst)},
  async rename(a,b){return api.move(a,b)},
  async uniqueName(dir,name,isDir){let names;try{names=new Set((await api.readdir(dir)).map(x=>x.name.toLowerCase()))}catch{names=new Set()}if(!names.has(name.toLowerCase()))return name;const m=!isDir&&/^(.*?)(\.[^.]+)?$/.exec(name);const stem=isDir?name:m[1],ext=isDir?'':(m[2]||'');for(let i=2;;i++){const n=`${stem} (${i})${ext}`;if(!names.has(n.toLowerCase()))return n}},
  async *walk(root,o={}){const q=[P.norm(root)];while(q.length){if(o.signal&&o.signal.aborted)return;const d=q.shift();let l;try{l=await api.readdir(d)}catch{continue}for(const it of l){yield it;if(it.type==='dir')q.push(it.path)}}},
  async du(path,o={}){path=P.norm(path);const c=duCache.get(path);if(c)return c;if(o.signal&&o.signal.aborted)throw new DOMException('abort','AbortError');const r=resolve(path);let res;
   if(r&&r.b.du)res=await r.b.du(r.rel);else{res={size:0,files:0,dirs:0};const l=await api.readdir(path);const subs=[];for(const it of l){if(it.type==='file'){res.size+=it.size;res.files++}else{subs.push(it.path);res.dirs++}}
    await pool(subs,4,async s=>{const x=await api.du(s,o);res.size+=x.size;res.files+=x.files;res.dirs+=x.dirs})}
   duCache.set(path,res);return res},
  async blob(path){const b=await api.readFile(path,'blob');return b.type&&b.type!=='application/octet-stream'?b:new Blob([b],{type:mimeOf(path)})},
  async url(path){return URL.createObjectURL(await api.blob(path))},
  mountList(){return[...mounts.values()]},
  addMount(path,backend,label,kind,extra){mounts.set(path,{path,backend,label,kind,...extra});emit(P.dirname(path))},
  async mountLocal(handle){for(const m of mounts.values())if(m.handle){try{if(await m.handle.isSameEntry(handle))return m.path}catch{}}
   const name=handle.name.replace(/[\\/]/g,'_');let path='/mnt/local/'+name,i=2;while(mounts.has(path))path='/mnt/local/'+name+' ('+i+++')';
   api.addMount(path,new HandleBackend(handle,handle.name),handle.name,'local',{handle});tx('h','readwrite',s=>s.put({name:handle.name,handle})).catch(()=>{});return path},
  async unmount(path){const m=mounts.get(path);if(!m)return;mounts.delete(path);if(m.handle)tx('h','readwrite',s=>s.delete(m.handle.name)).catch(()=>{});emit(P.dirname(path))},
  async savedHandles(){try{return await tx('h','readonly',s=>s.getAll())}catch{return[]}},
  async init(){await Meta.load();let opfs=false;
   try{if(navigator.storage&&navigator.storage.getDirectory){const root=await navigator.storage.getDirectory();const vfs=await root.getDirectoryHandle('vernier-vfs',{create:true});const fh=await vfs.getFileHandle('.probe',{create:true});if(!fh.createWritable)throw 0;const w=await fh.createWritable();await w.write('ok');await w.close();opfs=true;api.opfsRoot=root;mounts.set('/opfs',{path:'/opfs',backend:new HandleBackend(vfs,'OPFS 存储'),label:'OPFS 存储',kind:'opfs'})}}catch(e){console.warn('OPFS 不可用，降级到 IndexedDB',e)}
   const nf=new NodeFS();await nf.init();mounts.set('/idb',{path:'/idb',backend:nf,label:'IndexedDB 存储',kind:'idb'});api.info={opfs,idbPersist:nf.persist};
   if(!opfs&&CFG.backend==='opfs')CFG.backend='idb';
   for(const base of['/opfs','/idb'])if(mounts.has(base))for(const d of HOME)await api.mkdir(base+'/'+d,{recursive:true}).catch(()=>{});
   if(!CFG.desktopPath||!mountFor(CFG.desktopPath))CFG.desktopPath='/'+CFG.backend+'/Desktop';
   try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}}
 };
 cbify(api,['stat','readdir','readFile','writeFile','mkdir','remove','rmdir','unlink','exists','copy','move','rename']);
 return api})();

/* ============ 6. 库懒加载（首次使用才请求 CDN，多源降级） ============ */
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('加载失败 '+u))};document.head.appendChild(s)})}
function loadCSS(u){return new Promise((res,rej)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=u;l.onload=res;l.onerror=()=>{l.remove();rej(new Error('css'))};document.head.appendChild(l)})}
const cmSet=(base,min)=>{const j=(p)=>base+p;const m=['xml/xml','javascript/javascript','css/css','htmlmixed/htmlmixed','markdown/markdown'].map(x=>j('mode/'+x+(min?'.min.js':'.js')));const a=['selection/active-line','edit/matchbrackets','edit/closebrackets'].map(x=>j('addon/'+x+(min?'.min.js':'.js')));return{css:j(min?'codemirror.min.css':'lib/codemirror.css'),core:j(min?'codemirror.min.js':'lib/codemirror.js'),rest:[...m,...a]}};
const LIBS={
 jszip:{sets:[{core:'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'},{core:'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'}],test:()=>window.JSZip},
 cm:{sets:[cmSet('https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/',true),cmSet('https://cdn.jsdelivr.net/npm/codemirror@5.65.16/',false)],test:()=>window.CodeMirror},
 beautify:{sets:[{core:'https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js',rest:['https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.min.js','https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js']},{core:'https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.js',rest:['https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-css.js','https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-html.js']}],test:()=>window.html_beautify&&window.js_beautify}

 function card(m,r){const tot=r.total||0,segs=Object.entries(r.cats).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]);return`<div class="sc"><div class="sc-h">${ic(m.kind==='idb'?'db':m.kind==='opfs'?'hdd':'mount',20)}<b>${esc(m.label)}</b><span class="mono" style="color:var(--tx3)">${esc(m.path)}</span><span style="flex:1"></span><b class="sc-t">${fmtSize(tot)}</b></div><div class="sbar">${tot?segs.map(([k,v])=>`<i style="width:${v/tot*100}%;background:${CATCOL(k)}" title="${CATNAME(k)} ${fmtSize(v)}"></i>`).join(''):''}</div><div class="slg">${segs.map(([k,v])=>`<span><i style="background:${CATCOL(k)}"></i>${CATNAME(k)} <b class="mono">${fmtSize(v)}</b> <em>${(v/tot*100).toFixed(1)}%</em></span>`).join('')||'<span style="color:var(--tx3)">空</span>'}</div><div class="sm">${r.files} 个文件 · ${r.dirs} 个文件夹</div>${r.big.length?`<details><summary>最大的文件（Top ${r.big.length}）</summary><table class="art"><tbody>${r.big.map(f=>`<tr><td>${fileIcon(f,18)}<span title="${esc(f.path)}">${esc(f.path.slice(m.path.length))}</span></td><td>${fmtSize(f.size)}</td><td><button class="btn sm" data-open="${esc(P.dirname(f.path))}">定位</button></td></tr>`).join('')}</tbody></table></details>`:''}</div>`}
 win.body.addEventListener('click',async e=>{const t=e.target.closest('[data-tab]');if(t){cur=t.dataset.tab;render();return}

  if(a==='wup'){const inp=$('#wallpick');inp.value='';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=homeDir('System')+'/Wallpapers',n=await fs.uniqueName(d,f.name);await fs.mkdir(d,{recursive:true});await fs.writeFile(P.join(d,n),f,{mtime:f.lastModified||Date.now()});setCfg('wall','file:'+P.join(d,n));toast('壁纸已保存到系统并应用','ok');render()}catch(er){toast(errMsg(er),'err')}};inp.click()}
  else if(a==='wpick'){const r=await Dialog.browse({mode:'file',start:homeDir('Pictures'),title:'选择壁纸图片'});if(r){setCfg('wall','file:'+r);render()}}
  else if(a==='arr')Desktop.arrange();else if(a==='dpath'){const r=await Dialog.browse({mode:'dir',start:P.dirname(CFG.desktopPath),title:'选择桌面文件夹'});if(r){setCfg('desktopPath',r);Desktop.refresh();render()}}
