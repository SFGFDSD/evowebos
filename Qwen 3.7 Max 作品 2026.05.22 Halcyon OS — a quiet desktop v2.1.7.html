<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Halcyon OS — a quiet desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@300;400;500;600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========================================================================
   HALCYON OS — single-file web desktop
   Aesthetic: Midnight Amber (warm retro-computing, editorial)
   ======================================================================== */

:root {
  --bg-0: #0f0c09;
  --bg-1: #15120e;
  --bg-2: #1c1813;
  --bg-3: #252018;
  --bg-4: #2f281e;
  --line: #3a3124;
  --line-2: #4a3f2e;
  --ink: #ede0c4;
  --ink-dim: #b8a884;
  --ink-mute: #7d6f54;
  --amber: #ff7a2e;
  --amber-soft: #ff9a5c;
  --amber-deep: #c24a0a;
  --teal: #4fd1a8;
  --teal-deep: #1f7a5e;
  --rose: #e85a5a;
  --cream: #f5e9cc;
  --shadow: 0 20px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --shadow-soft: 0 8px 24px rgba(0,0,0,.4);
  --radius: 3px;
  --radius-lg: 6px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-sans: 'Archivo', system-ui, sans-serif;
  --taskbar-h: 44px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg-0);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}
button { cursor: pointer; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); background-clip: content-box; border: 2px solid transparent; }

/* ========== BOOT ========== */
#boot {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg-0);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity .6s ease;
  font-family: var(--font-mono);
}
#boot .logo {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 48px;
  letter-spacing: -0.02em;
  color: var(--cream);
  margin-bottom: 4px;
}
#boot .logo em { font-style: italic; color: var(--amber); font-weight: 400; }
#boot .sub {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 48px;
}
#boot .bar {
  width: 240px; height: 2px;
  background: var(--line);
  position: relative; overflow: hidden;
}
#boot .bar::after {
  content: ''; position: absolute; left: 0; top: 0; height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--amber), var(--amber-soft));
  animation: bootfill 1.6s ease forwards;
}
#boot .status {
  margin-top: 16px; font-size: 10px; color: var(--ink-mute);
  letter-spacing: 0.15em; text-transform: uppercase;
}
@keyframes bootfill { to { width: 100%; } }
#boot.fade { opacity: 0; pointer-events: none; }

/* ========== DESKTOP ========== */
#desktop {
  position: fixed; inset: 0;
  overflow: hidden;
  background: var(--bg-1);
}
#wallpaper {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity .4s ease;
}
#wallpaper::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,122,46,.08), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(79,209,168,.06), transparent 50%),
    linear-gradient(180deg, rgba(15,12,9,.3), rgba(15,12,9,.6));
  pointer-events: none;
}

/* default wallpaper (pure CSS) */
.wp-halcyon {
  background:
    radial-gradient(ellipse 60% 40% at 30% 30%, #3a2414 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 75% 70%, #1a3a32 0%, transparent 70%),
    radial-gradient(ellipse 100% 80% at 50% 50%, #2a1f14 0%, #0f0c09 100%);
}
.wp-grid {
  background:
    linear-gradient(rgba(255,122,46,.06) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(255,122,46,.06) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(135deg, #1c1813 0%, #0f0c09 100%);
}
.wp-sunset {
  background:
    radial-gradient(circle at 50% 100%, #ff7a2e 0%, #c24a0a 30%, #3a1f0a 60%, #0f0c09 100%);
}
.wp-mono {
  background:
    radial-gradient(ellipse at 50% 50%, #2a2520 0%, #0f0c09 80%);
}
.wp-field {
  background:
    linear-gradient(180deg, #1a2028 0%, #2a241c 50%, #3a2f1a 100%);
}

/* selection rectangle */
#selrect {
  position: absolute;
  border: 1px solid var(--amber);
  background: rgba(255,122,46,.12);
  pointer-events: none;
  display: none;
  z-index: 5;
}

/* desktop icons */
#iconlayer {
  position: absolute; inset: 0;
  padding: 16px;
  z-index: 2;
}
.dicon {
  position: absolute;
  width: 84px;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 8px 4px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background .15s ease, transform .15s ease;
  touch-action: none;
}
.dicon:hover { background: rgba(237,224,196,.06); }
.dicon.selected { background: rgba(255,122,46,.18); outline: 1px solid rgba(255,122,46,.5); }
.dicon.dragging { opacity: .6; z-index: 1000; }
.dicon .ico {
  width: 44px; height: 44px;
  margin-bottom: 6px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
.dicon .label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cream);
  text-align: center;
  text-shadow: 0 1px 2px rgba(0,0,0,.8);
  word-break: break-word;
  line-height: 1.25;
  max-width: 80px;
}
.dicon.selected .label { color: var(--amber-soft); }

/* ========== TASKBAR ========== */
#taskbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: var(--taskbar-h);
  background: linear-gradient(180deg, rgba(28,24,19,.92), rgba(15,12,9,.96));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 8px;
  z-index: 10000;
  gap: 4px;
}
.tb-start {
  height: 32px; width: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius);
  color: var(--amber);
  transition: background .15s;
}
.tb-start:hover { background: var(--bg-3); }
.tb-start.active { background: var(--bg-4); color: var(--amber-soft); }

.tb-apps {
  display: flex; gap: 2px;
  flex: 1; overflow-x: auto; overflow-y: hidden;
  padding: 0 4px;
}
.tb-apps::-webkit-scrollbar { display: none; }
.tb-item {
  height: 32px;
  padding: 0 10px;
  display: flex; align-items: center; gap: 6px;
  border-radius: var(--radius);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  min-width: 0;
  max-width: 180px;
}
.tb-item:hover { background: var(--bg-3); color: var(--ink); }
.tb-item.active { color: var(--amber); border-bottom-color: var(--amber); }
.tb-item .ico { width: 14px; height: 14px; flex-shrink: 0; }
.tb-item .title { overflow: hidden; text-overflow: ellipsis; }

.tb-tray {
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
}
.tb-clock { font-variant-numeric: tabular-nums; }

/* ========== START MENU ========== */
#startmenu {
  position: fixed;
  left: 8px; bottom: calc(var(--taskbar-h) + 8px);
  width: 360px;
  max-width: calc(100vw - 16px);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 14px;
  z-index: 9998;
  display: none;
  animation: menuIn .18s ease;
}
@keyframes menuIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
#startmenu.show { display: block; }
.sm-header {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.sm-header .brand {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 22px;
  color: var(--cream);
  letter-spacing: -0.01em;
}
.sm-header .brand em { color: var(--amber); font-style: italic; }
.sm-header .tag {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-mute);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.sm-search {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  margin-bottom: 12px;
}
.sm-search:focus { border-color: var(--amber); }
.sm-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  max-height: 340px;
  overflow-y: auto;
}
.sm-app {
  padding: 10px 8px;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background .12s;
}
.sm-app:hover { background: var(--bg-3); }
.sm-app .ico { width: 28px; height: 28px; color: var(--amber); }
.sm-app .name {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-dim);
  text-align: center;
  letter-spacing: 0.02em;
}
.sm-footer {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
}
.sm-footer button { color: var(--ink-dim); font-family: inherit; font-size: inherit; padding: 4px 8px; border-radius: var(--radius); }
.sm-footer button:hover { background: var(--bg-3); color: var(--amber); }

/* ========== CONTEXT MENU ========== */
#ctxmenu {
  position: fixed;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  padding: 4px;
  z-index: 20000;
  display: none;
  min-width: 180px;
  animation: menuIn .12s ease;
  font-family: var(--font-mono);
  font-size: 12px;
}
#ctxmenu.show { display: block; }
.ctx-item {
  padding: 6px 12px;
  display: flex; align-items: center; gap: 10px;
  border-radius: 2px;
  cursor: pointer;
  color: var(--ink);
}
.ctx-item:hover { background: var(--amber); color: var(--bg-0); }
.ctx-item:hover .ico { color: var(--bg-0); }
.ctx-item .ico { width: 12px; height: 12px; color: var(--ink-mute); }
.ctx-item.disabled { opacity: .4; pointer-events: none; }
.ctx-sep { height: 1px; background: var(--line); margin: 4px 2px; }
.ctx-item .kbd { margin-left: auto; font-size: 10px; color: var(--ink-mute); }
.ctx-item:hover .kbd { color: var(--bg-0); opacity: .7; }

/* ========== WINDOWS ========== */
.win {
  position: absolute;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  overflow: hidden;
  min-width: 280px;
  min-height: 180px;
  animation: winIn .2s cubic-bezier(.2,.8,.2,1);
}
@keyframes winIn {
  from { opacity: 0; transform: scale(.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.win.max { border-radius: 0; }
.win.focused { border-color: var(--line-2); }
.win.focused .win-title { background: var(--bg-2); }
.win.min { display: none; }

.win-title {
  height: 36px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 8px 0 12px;
  gap: 8px;
  cursor: move;
  touch-action: none;
  flex-shrink: 0;
}
.win-title .ico { width: 14px; height: 14px; color: var(--amber); flex-shrink: 0; }
.win-title .title {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink);
  letter-spacing: 0.03em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1;
}
.win.focused .win-title .title { color: var(--cream); }
.win-controls { display: flex; gap: 2px; }
.win-ctrl {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px;
  color: var(--ink-mute);
  transition: all .12s;
}
.win-ctrl:hover { background: var(--bg-4); color: var(--ink); }
.win-ctrl.close:hover { background: var(--rose); color: var(--bg-0); }
.win-ctrl .ico { width: 11px; height: 11px; }

.win-body {
  flex: 1;
  overflow: auto;
  position: relative;
  background: var(--bg-1);
}
.win-status {
  height: 22px;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  padding: 0 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}

/* resize handles */
.rh { position: absolute; z-index: 10; }
.rh.n { top: -3px; left: 6px; right: 6px; height: 6px; cursor: n-resize; }
.rh.s { bottom: -3px; left: 6px; right: 6px; height: 6px; cursor: s-resize; }
.rh.e { right: -3px; top: 6px; bottom: 6px; width: 6px; cursor: e-resize; }
.rh.w { left: -3px; top: 6px; bottom: 6px; width: 6px; cursor: w-resize; }
.rh.ne { top: -3px; right: -3px; width: 10px; height: 10px; cursor: ne-resize; }
.rh.nw { top: -3px; left: -3px; width: 10px; height: 10px; cursor: nw-resize; }
.rh.se { bottom: -3px; right: -3px; width: 10px; height: 10px; cursor: se-resize; }
.rh.sw { bottom: -3px; left: -3px; width: 10px; height: 10px; cursor: sw-resize; }

/* ========== APP: EXPLORER ========== */
.explorer { display: flex; height: 100%; }
.ex-side {
  width: 200px;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  padding: 10px 6px;
  overflow-y: auto;
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 11px;
}
.ex-side .group {
  font-size: 9px;
  color: var(--ink-mute);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 10px 8px 4px;
}
.ex-side .item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px;
  border-radius: 2px;
  cursor: pointer;
  color: var(--ink-dim);
}
.ex-side .item:hover { background: var(--bg-3); color: var(--ink); }
.ex-side .item.active { background: var(--bg-4); color: var(--amber); }
.ex-side .item .ico { width: 12px; height: 12px; }

.ex-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ex-toolbar {
  height: 36px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 8px; gap: 4px;
  flex-shrink: 0;
}
.ex-toolbar button {
  height: 26px; width: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px;
  color: var(--ink-dim);
}
.ex-toolbar button:hover { background: var(--bg-3); color: var(--ink); }
.ex-toolbar button:disabled { opacity: .3; }
.ex-toolbar .ico { width: 12px; height: 12px; }
.ex-bread {
  flex: 1;
  padding: 0 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ex-bread span { cursor: pointer; }
.ex-bread span:hover { color: var(--amber); }
.ex-bread .sep { color: var(--ink-mute); margin: 0 4px; }

.ex-search {
  width: 180px;
  height: 26px;
  padding: 0 8px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
}

.ex-list {
  flex: 1;
  overflow: auto;
  padding: 4px;
  position: relative;
}
.ex-list-head {
  display: grid;
  grid-template-columns: 1fr 120px 80px 100px;
  padding: 6px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0;
  background: var(--bg-1);
  z-index: 2;
}
.ex-list-head > div { cursor: pointer; user-select: none; }
.ex-list-head > div:hover { color: var(--amber); }
.ex-list-head .arr { color: var(--amber); margin-left: 2px; }
.ex-row {
  display: grid;
  grid-template-columns: 1fr 120px 80px 100px;
  padding: 5px 10px;
  align-items: center;
  border-radius: 2px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
}
.ex-row:hover { background: var(--bg-3); color: var(--ink); }
.ex-row.selected { background: rgba(255,122,46,.18); color: var(--amber-soft); }
.ex-row .name { display: flex; align-items: center; gap: 8px; overflow: hidden; }
.ex-row .name .ico { width: 14px; height: 14px; flex-shrink: 0; color: var(--amber); }
.ex-row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========== APP: NOTEPAD ========== */
.notepad { display: flex; flex-direction: column; height: 100%; }
.np-toolbar {
  height: 32px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 4px;
  padding: 0 8px;
  flex-shrink: 0;
}
.np-toolbar button {
  height: 22px;
  padding: 0 10px;
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.np-toolbar button:hover { background: var(--bg-3); color: var(--ink); }
.np-toolbar .path {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  max-width: 280px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.np-editor {
  flex: 1;
  width: 100%;
  padding: 16px 20px;
  background: var(--bg-1);
  color: var(--cream);
  border: none;
  resize: none;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  tab-size: 2;
  user-select: text;
  -webkit-user-select: text;
}
.np-editor:focus { outline: none; }

/* ========== APP: TABLE ========== */
.table-app { display: flex; flex-direction: column; height: 100%; }
.tbl-toolbar {
  height: 34px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 4px;
  padding: 0 8px;
  flex-shrink: 0;
}
.tbl-toolbar button {
  height: 24px; padding: 0 12px;
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.tbl-toolbar button:hover { background: var(--bg-3); color: var(--ink); }
.tbl-toolbar button.active { background: var(--amber); color: var(--bg-0); }
.tbl-view { flex: 1; overflow: auto; }
.tbl-grid {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
}
.tbl-grid th, .tbl-grid td {
  border: 1px solid var(--line);
  padding: 5px 8px;
  text-align: left;
  white-space: nowrap;
}
.tbl-grid th {
  background: var(--bg-2);
  color: var(--ink-dim);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;

/* ========== APP: IMAGE VIEWER ========== */

}

/* ========== APP: MEDIA PLAYER ========== */

/* ========== APP: PDF ========== */
.pdfv { display: flex; flex-direction: column; height: 100%; }
.pdfv iframe { flex: 1; border: none; width: 100%; }

/* ========== APP: SETTINGS ========== */
.settings { display: flex; height: 100%; }
.set-side {
  width: 180px;

}
.set-side .item {

}
.wp-grid {
  display: grid;

  gap: 10px;
}
.wp-opt {
  aspect-ratio: 16/10;

}
.wp-opt:hover { transform: translateY(-2px); }
.wp-opt.active { border-color: var(--amber); }

}
.set-btn {

}

.dialog {

}

<script>
/* ========================================================================
   HALCYON OS — script
   ======================================================================== */

/* ---------- Utilities ---------- */
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
const svg = (name, cls = 'ico') => `<svg class="${cls}"><use href="#${name}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtSize = (b) => {
  if (b == null || isNaN(b)) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
  return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
};
const fmtDate = (d) => {
  if (!d) return '—';
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return '—';
  const pad = (n) => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
};
const extOf = (name) => {
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(i + 1).toLowerCase() : '';
};
const baseOf = (name) => {
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(0, i) : name;
};
const joinPath = (...parts) => {
  return '/' + parts.filter(Boolean).join('/').split('/').filter(Boolean).join('/');
};
const parentOf = (p) => {
  const parts = p.split('/').filter(Boolean);
  parts.pop();
  return '/' + parts.join('/');
};
const nameOf = (p) => p.split('/').filter(Boolean).pop() || '/';
const escHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type = 'info', ms = 2800) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'error' ? 'err' : type === 'ok' ? 'ok' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, ms - 300);
  setTimeout(() => el.remove(), ms);
}

/* ========================================================================
   FILE SYSTEM — unified interface over OPFS + File System Access API mounts
   All apps use `fs.*`. Local mounts wrap FSAA to match the same signatures.
   ======================================================================== */

const fs = (() => {
  let root = null;         // FileSystemDirectoryHandle (OPFS root)
  let mounts = {};         // path -> { handle, name }  (FSAA handles)
  const MOUNT_PREFIX = '/mnt/local';

  async function init() {
    root = await navigator.storage.getDirectory();
    // ensure core dirs
    await mkdir('/desktop');
    await mkdir('/documents');
    await mkdir('/pictures');
    await mkdir('/system');
    await mkdir('/mnt');
    await mkdir(MOUNT_PREFIX);
    // load persisted mount metadata (names only — handles must be re-granted)
    try {
      const saved = localStorage.getItem('halcyon.mounts');
      if (saved) {
        const arr = JSON.parse(saved);
        arr.forEach(m => { mounts[m.path] = { name: m.name, handle: null, stale: true }; });
      }
    } catch (e) {}
  }

  function saveMountMeta() {
    const arr = Object.entries(mounts).map(([p, m]) => ({ path: p, name: m.name }));
    localStorage.setItem('halcyon.mounts', JSON.stringify(arr));
  }

  /* Resolve path → determine if in mount or OPFS */
  function resolve(path) {
    path = joinPath(path);
    // check mounts (longest prefix match)
    let best = null, bestLen = 0;
    for (const mp of Object.keys(mounts)) {
      if (path === mp || path.startsWith(mp + '/')) {
        if (mp.length > bestLen) { best = mp; bestLen = mp.length; }
      }
    }
    if (best) {
      const rest = path.slice(best.length) || '/';
      return { kind: 'mount', mount: best, rest, handle: mounts[best].handle, stale: !!mounts[best].stale };
    }
    return { kind: 'opfs', rest: path };
  }

  /* walk an OPFS path, creating dirs as needed */
  async function walkOPFS(path, create = false) {
    const parts = path.split('/').filter(Boolean);
    let dir = root;
    for (let i = 0; i < parts.length - 1; i++) {
      dir = await dir.getDirectoryHandle(parts[i], { create });
    }
    return { parent: dir, name: parts[parts.length - 1] || '' };
  }

  async function getOPFSHandle(path) {
    path = joinPath(path);
    if (path === '/') return root;
    const parts = path.split('/').filter(Boolean);
    let h = root;
    for (const p of parts) {
      try {
        h = await h.getDirectoryHandle(p);
      } catch {
        h = await h.getFileHandle(p);
      }
    }
    return h;
  }

  /* walk a mount rest-path to its handle */
  async function walkMount(handle, rest) {
    if (!handle) throw new Error('mount unavailable (re-mount required)');
    const parts = rest.split('/').filter(Boolean);
    let h = handle;
    for (const p of parts) {
      try { h = await h.getDirectoryHandle(p); }
      catch { h = await h.getFileHandle(p); }
    }
    return h;
  }

  async function getHandle(path) {
    const r = resolve(path);
    if (r.kind === 'mount') {
      if (r.rest === '/') return r.handle;
      return walkMount(r.handle, r.rest);
    }
    return getOPFSHandle(r.rest);
  }

  async function stat(path /*, isLstat */) {
    path = joinPath(path);
    const r = resolve(path);
    try {
      if (r.kind === 'mount') {
        if (r.stale) throw new Error('stale');
        if (r.rest === '/') {
          return { name: nameOf(r.mount), path, isDirectory: true, size: 0, mtime: Date.now(), kind: 'mount' };
        }
        const h = await walkMount(r.handle, r.rest);
        if (h.kind === 'directory') {
          return { name: h.name, path, isDirectory: true, size: 0, mtime: Date.now() };
        } else {
          const f = await h.getFile();
          return { name: h.name, path, isDirectory: false, size: f.size, mtime: f.lastModified };
        }
      }
      if (r.rest === '/') return { name: '/', path: '/', isDirectory: true, size: 0, mtime: Date.now() };
      const { parent, name } = await walkOPFS(r.rest);
      try {
        const fh = await parent.getFileHandle(name);
        const f = await fh.getFile();
        return { name, path, isDirectory: false, size: f.size, mtime: f.lastModified };
      } catch {
        await parent.getDirectoryHandle(name);
        return { name, path, isDirectory: true, size: 0, mtime: Date.now() };
      }
    } catch (e) {
      const err = new Error('ENOENT: ' + path); err.code = 'ENOENT'; throw err;
    }
  }

  async function exists(path) {
    try { await stat(path); return true; } catch { return false; }
  }

  async function readdir(path) {
    path = joinPath(path);
    const r = resolve(path);
    const out = [];
    if (r.kind === 'mount') {
      if (r.stale) throw new Error('mount unavailable');
      const dir = r.rest === '/' ? r.handle : await walkMount(r.handle, r.rest);
      for await (const [name, h] of dir.entries()) {
        const childPath = joinPath(path, name);
        if (h.kind === 'directory') {
          out.push({ name, path: childPath, isDirectory: true, size: 0, mtime: Date.now() });
        } else {
          try {
            const f = await h.getFile();
            out.push({ name, path: childPath, isDirectory: false, size: f.size, mtime: f.lastModified });
          } catch {
            out.push({ name, path: childPath, isDirectory: false, size: 0, mtime: 0 });
          }
        }
      }
      return out;
    }
    // OPFS
    let dir;
    if (r.rest === '/') dir = root;
    else {
      const { parent, name } = await walkOPFS(r.rest);
      dir = await parent.getDirectoryHandle(name);
    }
    for await (const [name, h] of dir.entries()) {
      const childPath = joinPath(path, name);
      if (h.kind === 'directory') {
        out.push({ name, path: childPath, isDirectory: true, size: 0, mtime: Date.now() });
      } else {
        try {
          const f = await h.getFile();
          out.push({ name, path: childPath, isDirectory: false, size: f.size, mtime: f.lastModified });
        } catch {
          out.push({ name, path: childPath, isDirectory: false, size: 0, mtime: 0 });
        }
      }
    }
    // Inject mounts into /mnt/local
    if (path === MOUNT_PREFIX) {
      for (const [mp, m] of Object.entries(mounts)) {
        const name = nameOf(mp);
        if (!out.find(o => o.name === name)) {
          out.push({ name, path: mp, isDirectory: true, size: 0, mtime: Date.now(), isMount: true, stale: m.stale });
        }
      }
    }
    return out;
  }

  async function mkdir(path) {
    path = joinPath(path);
    const r = resolve(path);
    if (r.kind === 'mount') {
      if (r.stale) throw new Error('mount unavailable');
      const parts = r.rest.split('/').filter(Boolean);
      let dir = r.handle;
      for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
      return dir;
    }
    const parts = r.rest.split('/').filter(Boolean);
    let dir = root;
    for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
    return dir;
  }

  async function readFile(path /*, flag */) {
    path = joinPath(path);
    const r = resolve(path);
    if (r.kind === 'mount') {
      if (r.stale) throw new Error('mount unavailable');
      const h = await walkMount(r.handle, r.rest);
      const f = await h.getFile();
      return f;
    }
    const { parent, name } = await walkOPFS(r.rest);
    const h = await parent.getFileHandle(name);
    return await h.getFile();
  }

  async function readFileBytes(path) {
    const f = await readFile(path);
    return await f.arrayBuffer();
  }

  async function readFileText(path) {
    const f = await readFile(path);
    return await f.text();
  }

  async function writeFile(path, data) {
    // data: string | ArrayBuffer | Blob | Uint8Array
    path = joinPath(path);
    const r = resolve(path);
    if (r.kind === 'mount') {
      if (r.stale) throw new Error('mount unavailable');
      const parts = r.rest.split('/').filter(Boolean);
      const fname = parts.pop();
      let dir = r.handle;
      for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
      const h = await dir.getFileHandle(fname, { create: true });
      const w = await h.createWritable();
      await w.write(data);
      await w.close();
      return;
    }
    const parts = r.rest.split('/').filter(Boolean);
    const fname = parts.pop();
    let dir = root;
    for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
    const h = await dir.getFileHandle(fname, { create: true });
    const w = await h.createWritable();
    await w.write(data);
    await w.close();
  }

  async function unlink(path) {
    path = joinPath(path);
    const r = resolve(path);
    if (r.kind === 'mount') {
      if (r.stale) throw new Error('mount unavailable');
      const parts = r.rest.split('/').filter(Boolean);
      const fname = parts.pop();
      let dir = r.handle;
      for (const p of parts) dir = await dir.getDirectoryHandle(p);
      await dir.removeEntry(fname);
      return;
    }
    const { parent, name } = await walkOPFS(r.rest);
    await parent.removeEntry(name);
  }

  async function rmdir(path, recursive = true) {
    path = joinPath(path);
    const r = resolve(path);
    if (r.kind === 'mount') {
      if (r.stale) throw new Error('mount unavailable');
      const parts = r.rest.split('/').filter(Boolean);
      const dname = parts.pop();
      let dir = r.handle;
      for (const p of parts) dir = await dir.getDirectoryHandle(p);
      await dir.removeEntry(dname, { recursive });
      return;
    }
    const { parent, name } = await walkOPFS(r.rest);
    await parent.removeEntry(name, { recursive });
  }

  async function remove(path) {
    const s = await stat(path);
    if (s.isDirectory) await rmdir(path, true);
    else await unlink(path);
  }

  async function rename(from, to) {
    // OPFS has no native rename — copy + delete
    const srcStat = await stat(from);
    await copyTree(from, to);
    await remove(from);
  }

  async function copyTree(src, dst) {
    const s = await stat(src);
    if (s.isDirectory) {
      await mkdir(dst);
      const kids = await readdir(src);
      for (const k of kids) {
        await copyTree(k.path, joinPath(dst, k.name));
      }
    } else {
      const f = await readFile(src);
      const buf = await f.arrayBuffer();
      await writeFile(dst, buf);
    }
  }

  /* Mount management */
  function listMounts() {
    return Object.entries(mounts).map(([p, m]) => ({ path: p, name: m.name, stale: m.stale, available: !m.stale }));
  }

  async function mountLocal(handle) {
    if (!handle || handle.kind !== 'directory') throw new Error('not a directory');
    const name = handle.name || 'local-' + uid();
    const path = joinPath(MOUNT_PREFIX, name);
    if (mounts[path]) { // name conflict
      const alt = name + '-' + uid().slice(0, 4);
      return mountLocalWithName(handle, alt);
    }
    return mountLocalWithName(handle, name);
  }
  async function mountLocalWithName(handle, name) {
    const path = joinPath(MOUNT_PREFIX, name);
    mounts[path] = { handle, name, stale: false };
    saveMountMeta();
    return path;
  }

  async function unmount(path) {
    if (!mounts[path]) return;
    delete mounts[path];
    saveMountMeta();
  }

  async function remount(path, handle) {
    if (!mounts[path]) throw new Error('unknown mount');
    mounts[path].handle = handle;
    mounts[path].stale = false;
  }

  async function estimate() {
    if (navigator.storage && navigator.storage.estimate) {
      return await navigator.storage.estimate();
    }
    return { usage: 0, quota: 0 };
  }

  async function resetAll() {
    // Clear OPFS
    for await (const [name] of root.entries()) {
      try { await root.removeEntry(name, { recursive: true }); } catch {}
    }
    mounts = {};
    saveMountMeta();
    localStorage.removeItem('halcyon.settings');
    localStorage.removeItem('halcyon.clipboard');
    localStorage.removeItem('halcyon.icons');
  }

  return {
    init, stat, exists, readdir, mkdir, readFile, readFileBytes, readFileText,
    writeFile, unlink, rmdir, remove, rename, copyTree,
    mountLocal, unmount, remount, listMounts,
    estimate, resetAll, resolve, getHandle,
    joinPath, parentOf, nameOf, MOUNT_PREFIX
  };
})();

/* ========================================================================
   MIME / ICON helpers
   ======================================================================== */
function iconForFile(entry) {
  if (entry.isDirectory) {
    if (entry.isMount) return 'i-mount';
    return 'i-folder';
  }
  const ext = extOf(entry.name);
  if (['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'].includes(ext)) return 'i-image';
  if (['mp3','wav','ogg','flac','aac','m4a','opus'].includes(ext)) return 'i-audio';
  if (['mp4','webm','ogv','mov','mkv'].includes(ext)) return 'i-video';
  if (['html','htm','css','js','json','xml','md','yaml','yml','log','ts','tsx','jsx','sh','py','c','cpp','h','rs','go','java','kt','swift'].includes(ext)) return 'i-code';
  if (['txt','rtf'].includes(ext)) return 'i-text';
  if (['csv','tsv'].includes(ext)) return 'i-sheet';
  if (['zip','gz','tar','tgz','rar','7z','bz2','xz'].includes(ext)) return 'i-archive';
  if (ext === 'pdf') return 'i-pdf';
  return 'i-file';
}

function mimeFor(ext) {
  const m = {
    'html':'text/html','htm':'text/html','css':'text/css','js':'text/javascript','json':'application/json',
    'xml':'application/xml','md':'text/markdown','txt':'text/plain','log':'text/plain',
    'csv':'text/csv','tsv':'text/tab-separated-values',
    'png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','svg':'image/svg+xml',
    'webp':'image/webp','bmp':'image/bmp','ico':'image/x-icon','avif':'image/avif',
    'mp3':'audio/mpeg','wav':'audio/wav','ogg':'audio/ogg','flac':'audio/flac','aac':'audio/aac','m4a':'audio/mp4','opus':'audio/opus',
    'mp4':'video/mp4','webm':'video/webm','ogv':'video/ogg','mov':'video/quicktime','mkv':'video/x-matroska',
    'pdf':'application/pdf',
    'zip':'application/zip','gz':'application/gzip','tar':'application/x-tar','tgz':'application/gzip',
  };
  return m[ext] || 'application/octet-stream';
}

/* ========================================================================
   WINDOW MANAGER
   ======================================================================== */
const WM = (() => {
  let wins = {};
  let zTop = 100;
  let focused = null;

  function create(opts) {
    const id = opts.id || uid();
    const w = opts.width || 640;
    const h = opts.height || 440;
    const vw = window.innerWidth, vh = window.innerHeight - 44;
    const x = opts.x ?? Math.max(16, Math.floor((vw - w) / 2 + (Object.keys(wins).length * 24) % 80));
    const y = opts.y ?? Math.max(16, Math.floor((vh - h) / 2 + (Object.keys(wins).length * 24) % 80));

    const el = document.createElement('div');
    el.className = 'win';
    el.dataset.id = id;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.zIndex = ++zTop;

    el.innerHTML = `
      <div class="win-title">
        ${svg(opts.icon || 'i-file')}
        <div class="title">${escHtml(opts.title || 'Window')}</div>
        <div class="win-controls">
          <button class="win-ctrl min" title="Minimize">${svg('i-min')}</button>
          <button class="win-ctrl max" title="Maximize">${svg('i-max')}</button>
          <button class="win-ctrl close" title="Close">${svg('i-close')}</button>
        </div>
      </div>
      <div class="win-body"></div>
      ${opts.statusbar ? `<div class="win-status"></div>` : ''}
      <div class="rh n"></div><div class="rh s"></div><div class="rh e"></div><div class="rh w"></div>
      <div class="rh ne"></div><div class="rh nw"></div><div class="rh se"></div><div class="rh sw"></div>
    `;
    $('#winlayer').appendChild(el);

    const body = el.querySelector('.win-body');
    if (typeof opts.content === 'string') body.innerHTML = opts.content;
    else if (opts.content instanceof Node) body.appendChild(opts.content);

    const win = {
      id, el, body, opts,
      title: opts.title, icon: opts.icon || 'i-file',
      min: false, max: false, prevRect: null,
      onClose: opts.onClose,
      setStatus(s) {
        const sb = el.querySelector('.win-status');
        if (sb) sb.textContent = s;
      },
      setTitle(t) {
        win.title = t;
        el.querySelector('.win-title .title').textContent = t;
        updateTaskbar();
      },
    };
    wins[id] = win;

    // events
    const titleEl = el.querySelector('.win-title');
    makeDraggable(el, titleEl, win);
    el.querySelectorAll('.rh').forEach(rh => makeResizable(el, rh, win));
    el.querySelector('.win-ctrl.min').addEventListener('click', (e) => { e.stopPropagation(); minimize(id); });
    el.querySelector('.win-ctrl.max').addEventListener('click', (e) => { e.stopPropagation(); toggleMax(id); });
    el.querySelector('.win-ctrl.close').addEventListener('click', (e) => { e.stopPropagation(); close(id); });
    titleEl.addEventListener('dblclick', () => toggleMax(id));
    el.addEventListener('mousedown', () => focus(id));
    el.addEventListener('touchstart', () => focus(id), { passive: true });

    focus(id);
    updateTaskbar();
    return win;
  }

  function focus(id) {
    if (!wins[id]) return;
    if (wins[id].min) restore(id);
    Object.values(wins).forEach(w => w.el.classList.remove('focused'));
    wins[id].el.style.zIndex = ++zTop;
    wins[id].el.classList.add('focused');
    focused = id;
    updateTaskbar();
  }

  function minimize(id) {
    if (!wins[id]) return;
    wins[id].min = true;
    wins[id].el.classList.add('min');
    if (focused === id) focused = null;
    updateTaskbar();
  }
  function restore(id) {
    if (!wins[id]) return;
    wins[id].min = false;
    wins[id].el.classList.remove('min');
    focus(id);
  }
  function toggleMax(id) {
    const w = wins[id]; if (!w) return;
    if (w.max) {
      if (w.prevRect) {
        w.el.style.left = w.prevRect.left;
        w.el.style.top = w.prevRect.top;
        w.el.style.width = w.prevRect.width;
        w.el.style.height = w.prevRect.height;
      }
      w.max = false; w.el.classList.remove('max');
      w.el.querySelector('.win-ctrl.max').innerHTML = svg('i-max');
    } else {
      w.prevRect = {
        left: w.el.style.left, top: w.el.style.top,
        width: w.el.style.width, height: w.el.style.height
      };
      w.el.style.left = '0px';
      w.el.style.top = '0px';
      w.el.style.width = window.innerWidth + 'px';
      w.el.style.height = (window.innerHeight - 44) + 'px';
      w.max = true; w.el.classList.add('max');
      w.el.querySelector('.win-ctrl.max').innerHTML = svg('i-restore');
    }
  }
  function close(id) {
    const w = wins[id]; if (!w) return;
    if (w.onClose) { try { w.onClose(); } catch {} }
    w.el.remove();
    delete wins[id];
    if (focused === id) focused = null;
    updateTaskbar();
  }
  function list() { return Object.values(wins); }

  function makeDraggable(winEl, handle, winObj) {
    let sx, sy, ox, oy, dragging = false;
    const down = (e) => {
      if (e.target.closest('.win-controls')) return;
      if (winObj.max) return;
      const pt = e.touches ? e.touches[0] : e;
      sx = pt.clientX; sy = pt.clientY;
      ox = winEl.offsetLeft; oy = winEl.offsetTop;
      dragging = true;
      e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      let nx = ox + pt.clientX - sx;
      let ny = oy + pt.clientY - sy;
      ny = Math.max(0, ny);
      nx = Math.max(-winEl.offsetWidth + 80, Math.min(window.innerWidth - 80, nx));
      winEl.style.left = nx + 'px';
      winEl.style.top = ny + 'px';
    };
    const up = () => { dragging = false; };
    handle.addEventListener('mousedown', down);
    handle.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  }
  function makeResizable(winEl, handle, winObj) {
    const dir = [...handle.classList].find(c => c !== 'rh');
    let sx, sy, sw, sh, sl, st, dragging = false;
    const down = (e) => {
      if (winObj.max) return;
      const pt = e.touches ? e.touches[0] : e;
      sx = pt.clientX; sy = pt.clientY;
      sw = winEl.offsetWidth; sh = winEl.offsetHeight;
      sl = winEl.offsetLeft; st = winEl.offsetTop;
      dragging = true;
      e.preventDefault(); e.stopPropagation();
    };
    const move = (e) => {
      if (!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const dx = pt.clientX - sx, dy = pt.clientY - sy;
      let nw = sw, nh = sh, nl = sl, nt = st;
      if (dir.includes('e')) nw = Math.max(260, sw + dx);
      if (dir.includes('s')) nh = Math.max(160, sh + dy);
      if (dir.includes('w')) { nw = Math.max(260, sw - dx); nl = sl + sw - nw; }
      if (dir.includes('n')) { nh = Math.max(160, sh - dy); nt = st + sh - nh; }
      winEl.style.width = nw + 'px';
      winEl.style.height = nh + 'px';
      winEl.style.left = nl + 'px';
      winEl.style.top = nt + 'px';
    };
    const up = () => { dragging = false; };
    handle.addEventListener('mousedown', down);
    handle.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  }

  return { create, focus, minimize, restore, toggleMax, close, list, get: (id) => wins[id] };
})();

/* ========================================================================
   TASKBAR
   ======================================================================== */
function updateTaskbar() {
  const apps = $('#tbApps');
  const dock = $('#tbDock');
  apps.innerHTML = '';
  dock.innerHTML = '';
  WM.list().forEach(w => {
    // desktop bar item
    const item = document.createElement('button');
    item.className = 'tb-item' + (!w.min && w.el.classList.contains('focused') ? ' active' : '');
    item.innerHTML = `${svg(w.icon)}<span class="title">${escHtml(w.title)}</span>`;
    item.onclick = () => {
      if (w.min) WM.restore(w.id);
      else if (w.el.classList.contains('focused')) WM.minimize(w.id);
      else WM.focus(w.id);
    };
    apps.appendChild(item);
    // mobile dock
    const d = document.createElement('button');
    d.className = 'tb-dock-item' + (!w.min && w.el.classList.contains('focused') ? ' active' : '');
    d.innerHTML = svg(w.icon);
    d.title = w.title;
    d.onclick = item.onclick;
    dock.appendChild(d);
  });
}

        else await fs.writeFile(d.path, d.content);

    }
    // seed desktop icons if empty
    if (icons.length === 0) {
      const base = [
        { name: 'Documents', path: '/documents', icon: 'i-folder' },
        { name: 'Pictures', path: '/pictures', icon: 'i-folder' },
        { name: 'Readme.txt', path: '/documents/Readme.txt', icon: 'i-text' },
        { name: 'hello.html', path: '/documents/hello.html', icon: 'i-code' },
        { name: 'data.csv', path: '/documents/data.csv', icon: 'i-sheet' },
      ];
      const isMobile = window.innerWidth < 768;
      const cols = isMobile ? 4 : 6;
      base.forEach((b, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        icons.push({ id: uid(), name: b.name, path: b.path, icon: b.icon, x: 20 + col * 100, y: 20 + row * 100 });
      });
      save();
    }
  }

  function render() {
    const layer = $('#iconlayer');
    layer.innerHTML = '';
    icons.forEach(ic => {
      const el = document.createElement('div');
      el.className = 'dicon' + (selected.has(ic.id) ? ' selected' : '');
      el.style.left = ic.x + 'px';
      el.style.top = ic.y + 'px';
      el.dataset.id = ic.id;
      el.innerHTML = `${svg(ic.icon)}<div class="label">${escHtml(ic.name)}</div>`;
      layer.appendChild(el);
      attachIcon(el, ic);
    });
  }

  function attachIcon(el, ic) {
    let downX, downY, startX, startY, dragging = false, moved = false, downTime;
    const down = (e) => {
      const pt = e.touches ? e.touches[0] : e;
      downX = pt.clientX; downY = pt.clientY;
      startX = ic.x; startY = ic.y;
      dragging = true; moved = false; downTime = Date.now();
      if (!e.shiftKey && !selected.has(ic.id)) {
        selected.clear();
      }
      selected.add(ic.id);
      el.classList.add('selected');
      // deselect others if not shift
      if (!e.shiftKey) {
        $$('#iconlayer .dicon').forEach(d => {
          if (d !== el) { d.classList.remove('selected'); selected.delete(d.dataset.id); }
        });
      }
      e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const dx = pt.clientX - downX, dy = pt.clientY - downY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (moved) {
        el.classList.add('dragging');
        const nx = Math.max(0, Math.min(window.innerWidth - 90, startX + dx));
        const ny = Math.max(0, Math.min(window.innerHeight - 120, startY + dy));
        el.style.left = nx + 'px';
        el.style.top = ny + 'px';
      }
    };
    const up = async (e) => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if (moved) {
        ic.x = parseInt(el.style.left);
        ic.y = parseInt(el.style.top);
        save();
      } else {
        // click
        const now = Date.now();
        if (el._lastClick && now - el._lastClick < 380) {
          // double click
          await openIcon(ic);
          el._lastClick = 0;
        } else {
          el._lastClick = now;
        }
      }
    };
    el.addEventListener('mousedown', down);
    el.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);

    el.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!selected.has(ic.id)) { selected.clear(); selected.add(ic.id); render(); }
      showIconContext(e.clientX, e.clientY, [...selected].map(id => icons.find(i => i.id === id)).filter(Boolean));
    });
  }

  async function openIcon(ic) {
    try {
      const s = await fs.stat(ic.path);
      if (s.isDirectory) AppExplorer.open(ic.path);
      else AppOpen.open(ic.path);
    } catch (e) {
      toast('Cannot open: ' + ic.name, 'error');
    }
  }

  function addIcon(path, icon) {
    // place in next free grid slot
    const isMobile = window.innerWidth < 768;
    const cols = isMobile ? 4 : 6;
    const col = icons.length % cols, row = Math.floor(icons.length / cols);
    const ic = {
      id: uid(),
      name: nameOf(path),
      path,
      icon: icon || 'i-file',
      x: 20 + col * 100,
      y: 20 + row * 100,
    };
    icons.push(ic);
    save();
    render();
  }

  function removeIcon(id) {
    icons = icons.filter(i => i.id !== id);
    selected.delete(id);
    save();
    render();
  }

  function clearSelection() { selected.clear(); render(); }
  function getSelected() { return [...selected].map(id => icons.find(i => i.id === id)).filter(Boolean); }

  async function refreshFromDesktop() {
    // Sync icons with /desktop contents (optional — kept simple)
  }

  return { load, save, seedDefaults, render, addIcon, removeIcon, clearSelection, getSelected, get icons() { return icons; } };
})();

const Ctx = (() => {
  const el = $('#ctxmenu');
  function show(x, y, items) {
    el.innerHTML = '';
    items.forEach(it => {
      if (it.sep) {
        const s = document.createElement('div'); s.className = 'ctx-sep'; el.appendChild(s);
        return;
      }
      const d = document.createElement('div');
      d.className = 'ctx-item' + (it.disabled ? ' disabled' : '');
      d.innerHTML = `${svg(it.icon || 'i-file')}<span>${escHtml(it.label)}</span>${it.kbd ? `<span class="kbd">${it.kbd}</span>` : ''}`;
      d.onclick = () => { hide(); it.onClick && it.onClick(); };
      el.appendChild(d);
    });
    el.classList.add('show');
    const rect = el.getBoundingClientRect();
    let fx = x, fy = y;
    if (fx + rect.width > window.innerWidth) fx = window.innerWidth - rect.width - 8;
    if (fy + rect.height > window.innerHeight - 50) fy = window.innerHeight - rect.height - 50;
    el.style.left = fx + 'px';
    el.style.top = fy + 'px';
  }
  function hide() { el.classList.remove('show'); }
  document.addEventListener('click', hide);
  document.addEventListener('scroll', hide, true);
  window.addEventListener('blur', hide);
  return { show, hide };
})();

/* ========================================================================
   DIALOG
   ======================================================================== */
function dialog({ title, message, prompt, defaultValue = '', okText = 'OK', cancelText = 'Cancel', danger = false }) {
  return new Promise((resolve) => {
    const bd = document.createElement('div');
    bd.className = 'dialog-backdrop';
    bd.innerHTML = `
      <div class="dialog">
        <h3>${escHtml(title)}</h3>
        ${message ? `<p>${escHtml(message)}</p>` : ''}
        ${prompt !== undefined ? `<input type="text" value="${escHtml(defaultValue)}" />` : ''}
        <div class="dialog-actions">
          <button class="set-btn" data-a="cancel">${escHtml(cancelText)}</button>
          <button class="set-btn ${danger ? 'danger' : 'primary'}" data-a="ok">${escHtml(okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(bd);
    const input = bd.querySelector('input');
    if (input) { setTimeout(() => { input.focus(); input.select(); }, 50); }
    const done = (v) => { bd.remove(); resolve(v); };
    bd.querySelector('[data-a="cancel"]').onclick = () => done(null);
    bd.querySelector('[data-a="ok"]').onclick = () => done(prompt !== undefined ? (input ? input.value : true) : true);
    if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') done(input.value); if (e.key === 'Escape') done(null); });
    bd.addEventListener('keydown', e => { if (e.key === 'Escape') done(null); });
  });
}

/* ========================================================================
   APP: OPEN (dispatcher)
   ======================================================================== */
const AppOpen = (() => {
  async function open(path) {
    let s;
    try { s = await fs.stat(path); } catch { toast('File not found: ' + path, 'error'); return; }
    if (s.isDirectory) { AppExplorer.open(path); return; }
    const ext = extOf(s.name);
    // images
    if (['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'].includes(ext)) return AppImageViewer.open(path);
    // audio
    if (['mp3','wav','ogg','flac','aac','m4a','opus'].includes(ext)) return AppMedia.open(path, 'audio');
    // video
    if (['mp4','webm','ogv','mov','mkv'].includes(ext)) return AppMedia.open(path, 'video');
    // pdf
    if (ext === 'pdf') return AppPDF.open(path);
    // html
    if (ext === 'html' || ext === 'htm') return AppHtmlView.open(path);
    // csv / tsv
    if (ext === 'csv' || ext === 'tsv') return AppTable.open(path);
    // archives
    if (['zip','gz','tar','tgz','bz2','xz'].includes(ext)) return AppArchive.open(path);
    // text / code
    if (['txt','md','log','json','xml','yaml','yml','css','js','ts','tsx','jsx','sh','py','c','cpp','h','rs','go','java','kt','swift','rtf'].includes(ext)) {
      return AppNotepad.open(path);
    }
    // fallback: try as text
    try {
      const txt = await fs.readFileText(path);
      // if it looks text-ish, open in notepad
      if (/[\x00-\x08\x0E-\x1F]/.test(txt.slice(0, 512)) === false) {
        return AppNotepad.open(path);
      }
    } catch {}
    toast('No app can open: ' + s.name, 'error');
  }
  return { open };
})();

/* ========================================================================
   APP: EXPLORER
   ======================================================================== */
const AppExplorer = (() => {
  function open(startPath = '/documents') {
    const state = {
      path: startPath,
      history: [startPath], hIdx: 0,
      sort: { key: 'name', dir: 1 },
      search: '',
      selected: new Set(),
      view: 'list',
    };
    const root = document.createElement('div');
    root.className = 'explorer';
    root.innerHTML = `
      <div class="ex-side">
        <div class="group">Quick</div>
        <div class="item" data-go="/"><svg class="ico"><use href="#i-home"/></svg>Home</div>
        <div class="item" data-go="/desktop"><svg class="ico"><use href="#i-desktop"/></svg>Desktop</div>
        <div class="item" data-go="/documents"><svg class="ico"><use href="#i-file"/></svg>Documents</div>
        <div class="item" data-go="/pictures"><svg class="ico"><use href="#i-image"/></svg>Pictures</div>
        <div class="group">Mounts</div>
        <div class="mounts"></div>
        <div class="group">System</div>
        <div class="item" data-go="/mnt/local"><svg class="ico"><use href="#i-mount"/></svg>/mnt/local</div>
      </div>
      <div class="ex-main">
        <div class="ex-toolbar">
          <button class="b-back" title="Back">${svg('i-back')}</button>
          <button class="b-fwd" title="Forward">${svg('i-fwd')}</button>
          <button class="b-up" title="Up">${svg('i-up')}</button>
          <button class="b-reload" title="Reload">${svg('i-reload')}</button>
          <div class="ex-bread"></div>
          <input class="ex-search" placeholder="search…" />
        </div>
        <div class="ex-list">
          <div class="ex-list-head">
            <div data-k="name">Name</div>
            <div data-k="mtime">Modified</div>
            <div data-k="ext">Type</div>
            <div data-k="size">Size</div>
          </div>
          <div class="ex-rows"></div>
        </div>
        <div class="win-status"></div>
      </div>
    `;
    const win = WM.create({
      title: 'Explorer — ' + nameOf(startPath),
      icon: 'i-explorer',
      width: 780, height: 500,
      content: root,
      statusbar: true,
    });
    const side = root.querySelector('.ex-side');
    const rowsEl = root.querySelector('.ex-rows');
    const breadEl = root.querySelector('.ex-bread');
    const headEl = root.querySelector('.ex-list-head');
    const searchEl = root.querySelector('.ex-search');
    const mountsEl = side.querySelector('.mounts');
    const statusEl = root.querySelector('.win-status');

    const refreshMounts = () => {
      mountsEl.innerHTML = '';
      fs.listMounts().forEach(m => {
        const d = document.createElement('div');
        d.className = 'item' + (state.path === m.path ? ' active' : '');
        d.innerHTML = `<svg class="ico"><use href="#i-mount"/></svg>${escHtml(m.name)}${m.stale ? ' ⚠' : ''}`;
        d.onclick = () => nav(m.path);
        mountsEl.appendChild(d);
      });
    };

    async function nav(path) {
      try {
        const s = await fs.stat(path);
        if (!s.isDirectory) { AppOpen.open(path); return; }
      } catch { toast('Not found: ' + path, 'error'); return; }
      state.path = path;
      state.selected.clear();
      if (state.hIdx < state.history.length - 1) state.history = state.history.slice(0, state.hIdx + 1);
      state.history.push(path); state.hIdx = state.history.length - 1;
      await render();
    }
    async function render() {
      win.setTitle('Explorer — ' + (state.path === '/' ? 'Home' : nameOf(state.path)));
      breadEl.innerHTML = '';
      const parts = state.path.split('/').filter(Boolean);
      const rootCrumb = document.createElement('span');
      rootCrumb.textContent = '/';
      rootCrumb.onclick = () => nav('/');
      breadEl.appendChild(rootCrumb);
      let acc = '';
      parts.forEach((p, i) => {
        const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '/'; breadEl.appendChild(sep);
        acc += '/' + p;
        const s = document.createElement('span'); s.textContent = p;
        const pp = acc;
        s.onclick = () => nav(pp);
        breadEl.appendChild(s);
      });

      let items;
      try { items = await fs.readdir(state.path); } catch (e) { toast('Cannot read: ' + e.message, 'error'); return; }
      if (state.search) {
        const q = state.search.toLowerCase();
        items = items.filter(i => i.name.toLowerCase().includes(q));
      }
      items.sort((a, b) => {
        // folders first
        if (a.isDirectory !== b.isDirectory) return a.isDirectory ? -1 : 1;
        let av, bv;
        if (state.sort.key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
        else if (state.sort.key === 'mtime') { av = a.mtime || 0; bv = b.mtime || 0; }
        else if (state.sort.key === 'size') { av = a.size || 0; bv = b.size || 0; }
        else if (state.sort.key === 'ext') { av = extOf(a.name); bv = extOf(b.name); }
        if (av < bv) return -1 * state.sort.dir;
        if (av > bv) return 1 * state.sort.dir;
        return 0;
      });

      rowsEl.innerHTML = '';
      items.forEach(it => {
        const r = document.createElement('div');
        r.className = 'ex-row' + (state.selected.has(it.path) ? ' selected' : '');
        r.dataset.path = it.path;
        r.innerHTML = `
          <div class="name">${svg(iconForFile(it))}<span>${escHtml(it.name)}</span></div>
          <div>${fmtDate(it.mtime)}</div>
          <div>${it.isDirectory ? 'Folder' : (extOf(it.name).toUpperCase() || '—')}</div>
          <div>${it.isDirectory ? '—' : fmtSize(it.size)}</div>
        `;
        r.addEventListener('click', (e) => {
          if (!e.ctrlKey && !e.metaKey && !e.shiftKey) state.selected.clear();
          if (state.selected.has(it.path)) state.selected.delete(it.path);
          else state.selected.add(it.path);
          render();
        });
        r.addEventListener('dblclick', async () => {
          const s = await fs.stat(it.path);
          if (s.isDirectory) nav(it.path);
          else AppOpen.open(it.path);
        });
        r.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (!state.selected.has(it.path)) { state.selected.clear(); state.selected.add(it.path); render(); }
          showExplorerContext(e.clientX, e.clientY, state, [...state.selected], nav);
        });
        rowsEl.appendChild(r);
      });

      // head arrows
      headEl.querySelectorAll('[data-k]').forEach(h => {
        const k = h.dataset.k;
        let arr = '';
        if (state.sort.key === k) arr = `<span class="arr">${state.sort.dir > 0 ? '▲' : '▼'}</span>`;
        h.innerHTML = ({ name: 'Name', mtime: 'Modified', ext: 'Type', size: 'Size' })[k] + arr;
        h.onclick = () => {
          if (state.sort.key === k) state.sort.dir = -state.sort.dir;
          else { state.sort.key = k; state.sort.dir = 1; }
          render();
        };
      });

      side.querySelectorAll('.item[data-go]').forEach(i => {
        i.classList.toggle('active', i.dataset.go === state.path);
        i.onclick = () => nav(i.dataset.go);
      });

      statusEl.textContent = `${items.length} items · ${state.selected.size} selected · ${state.path}`;
      refreshMounts();
    }

    root.querySelector('.b-back').onclick = () => { if (state.hIdx > 0) { state.hIdx--; state.path = state.history[state.hIdx]; render(); } };
    root.querySelector('.b-fwd').onclick = () => { if (state.hIdx < state.history.length - 1) { state.hIdx++; state.path = state.history[state.hIdx]; render(); } };
    root.querySelector('.b-up').onclick = () => { if (state.path !== '/') nav(parentOf(state.path)); };
    root.querySelector('.b-reload').onclick = () => render();
    searchEl.addEventListener('input', (e) => { state.search = e.target.value; render(); });

    root.querySelector('.ex-list').addEventListener('contextmenu', (e) => {
      if (e.target.closest('.ex-row')) return;
      e.preventDefault();
      showExplorerBgContext(e.clientX, e.clientY, state, nav);
    });

    // drop files
    root.addEventListener('dragover', (e) => { e.preventDefault(); });
    root.addEventListener('drop', async (e) => {
      e.preventDefault();
      const files = [...(e.dataTransfer.files || [])];
      for (const f of files) {
        const p = joinPath(state.path, f.name);
        await fs.writeFile(p, f);
      }
      toast(`Imported ${files.length} file(s)`, 'ok');
      render();
    });

    nav(startPath);
    return win;
  }
  return { open };
})();

function showExplorerContext(x, y, state, selectedPaths, nav) {
  const items = [];
  if (selectedPaths.length === 1) {
    items.push({ icon: 'i-open', label: 'Open', onClick: async () => {
      const s = await fs.stat(selectedPaths[0]);
      if (s.isDirectory) nav(selectedPaths[0]); else AppOpen.open(selectedPaths[0]);
    }});
    items.push({ icon: 'i-rename', label: 'Rename', onClick: async () => {
      const p = selectedPaths[0]; const n = nameOf(p);
      const newName = await dialog({ title: 'Rename', prompt: true, defaultValue: n });
      if (!newName || newName === n) return;
      await fs.rename(p, joinPath(parentOf(p), newName));
      state.selected.clear();
      await AppExplorer.open(state.path); // refresh via reopen; simple
    }});
  }
  items.push({ icon: 'i-copy', label: 'Copy', kbd: '⌘C', onClick: () => { Clipboard.set('copy', selectedPaths); toast('Copied to clipboard', 'ok'); }});
  items.push({ icon: 'i-cut', label: 'Cut', kbd: '⌘X', onClick: () => { Clipboard.set('cut', selectedPaths); toast('Cut to clipboard', 'ok'); }});
  items.push({ icon: 'i-download', label: 'Export to computer', onClick: async () => {
    for (const p of selectedPaths) {
      const s = await fs.stat(p);
      if (!s.isDirectory) {
        const f = await fs.readFile(p);
        const url = URL.createObjectURL(f);
        const a = document.createElement('a'); a.href = url; a.download = s.name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }
  }});
  items.push({ sep: true });
  items.push({ icon: 'i-trash', label: 'Delete', onClick: async () => {
    const ok = await dialog({ title: 'Delete ' + selectedPaths.length + ' item(s)?', message: 'This cannot be undone.', okText: 'Delete', danger: true });
    if (!ok) return;
    for (const p of selectedPaths) {
      try { await fs.remove(p); } catch (e) { toast('Cannot delete ' + nameOf(p), 'error'); }
    }
    // re-open current folder
    AppExplorer.open(state.path);
  }});
  Ctx.show(x, y, items);
}

function showExplorerBgContext(x, y, state, nav) {
  const clip = Clipboard.get();
  const items = [
    { icon: 'i-newfolder', label: 'New folder', onClick: async () => {
      const n = await dialog({ title: 'New folder', prompt: true, defaultValue: 'New Folder' });
      if (!n) return;
      await fs.mkdir(joinPath(state.path, n));
      AppExplorer.open(state.path);
    }},
    { icon: 'i-newfile', label: 'New text file', onClick: async () => {
      const n = await dialog({ title: 'New file', prompt: true, defaultValue: 'untitled.txt' });
      if (!n) return;
      await fs.writeFile(joinPath(state.path, n), '');
      AppExplorer.open(state.path);
    }},
    { icon: 'i-upload', label: 'Import files…', onClick: () => pickFilesAndImport(state.path) },
    { sep: true },
    { icon: 'i-paste', label: 'Paste', disabled: !clip, onClick: async () => {
      if (!clip) return;
      for (const p of clip.paths) {
        const dest = joinPath(state.path, nameOf(p));
        await fs.copyTree(p, dest);
        if (clip.op === 'cut') { try { await fs.remove(p); } catch {} }
      }
      if (clip.op === 'cut') Clipboard.clear();
      AppExplorer.open(state.path);
    }},
    { sep: true },
    { icon: 'i-refresh', label: 'Refresh', onClick: () => AppExplorer.open(state.path) },
  ];
  Ctx.show(x, y, items);
}

async function pickFilesAndImport(destPath) {
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = true;
  input.onchange = async () => {
    for (const f of input.files) {
      await fs.writeFile(joinPath(destPath, f.name), f);
    }
    toast(`Imported ${input.files.length} file(s)`, 'ok');
    AppExplorer.open(destPath);
  };
  input.click();
}

/* ========================================================================
   APP: TABLE (CSV/TSV)
   ======================================================================== */
const AppTable = (() => {
  function parseCSV(text, sep = ',') {
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') q = false;
        else field += c;
      } else {
        if (c === '"') q = true;
        else if (c === sep) { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r') {}
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
  }
  function toCSV(rows, sep = ',') {
    return rows.map(r => r.map(c => {
      c = String(c == null ? '' : c);
      if (c.includes(sep) || c.includes('"') || c.includes('\n')) return '"' + c.replace(/"/g, '""') + '"';
      return c;
    }).join(sep)).join('\n');
  }

  async function open(path) {
    const file = await fs.readFile(path);
    const text = await file.text();
    const ext = extOf(path);
    const sep = ext === 'tsv' ? '\t' : ',';
    let rows = parseCSV(text, sep);

    const root = document.createElement('div');
    root.className = 'table-app';
    root.innerHTML = `
      <div class="tbl-toolbar">
        <button data-view="table" class="active">Table</button>
        <button data-view="text">Text</button>
        <button data-act="addrow">+ Row</button>
        <button data-act="addcol">+ Col</button>
        <button data-act="save">${svg('i-save')} Save</button>
        <span style="margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-mute)">${escHtml(path)}</span>
      </div>
      <div class="tbl-view"></div>
    `;
    const view = root.querySelector('.tbl-view');
    let mode = 'table';

    function renderTable() {
      view.innerHTML = '';
      const tbl = document.createElement('table'); tbl.className = 'tbl-grid';
      rows.forEach((r, ri) => {
        const tr = document.createElement('tr');
        r.forEach((c, ci) => {
          const cell = document.createElement(ri === 0 ? 'th' : 'td');
          if (ri !== 0) {
            cell.contentEditable = 'true';
            cell.addEventListener('blur', () => { rows[ri][ci] = cell.textContent; });
          }
          cell.textContent = c;
          tr.appendChild(cell);
        });
        tbl.appendChild(tr);
      });
      view.appendChild(tbl);
    }
    function renderText() {
      view.innerHTML = '';
      const ta = document.createElement('textarea');
      ta.className = 'tbl-text';
      ta.value = toCSV(rows, sep);
      ta.addEventListener('input', () => { rows = parseCSV(ta.value, sep); });
      view.appendChild(ta);
    }

    root.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
      root.querySelectorAll('[data-view]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      mode = b.dataset.view;
      if (mode === 'table') renderTable(); else renderText();
    });
    root.querySelector('[data-act="addrow"]').onclick = () => {
      const w = (rows[0] || ['']).length;
      rows.push(new Array(w).fill(''));
      renderTable();
    };
    root.querySelector('[data-act="addcol"]').onclick = () => {
      rows.forEach(r => r.push(''));
      renderTable();
    };
    root.querySelector('[data-act="save"]').onclick = async () => {
      await fs.writeFile(path, toCSV(rows, sep));
      toast('Saved', 'ok');
    };

    renderTable();
    WM.create({ title: nameOf(path) + ' — Table', icon: 'i-sheet', width: 720, height: 480, content: root });
  }
  return { open };
})();

/* ========================================================================
   APP: HTML VIEWER
   ======================================================================== */
const AppHtmlView = (() => {
  async function open(path) {
    const file = await fs.readFile(path);
    const text = await file.text();

const AppCalc = (() => {
  function open() {
    const root = document.createElement('div');
    root.className = 'calc';
    root.innerHTML = `
      <div class="calc-display">
        <div class="calc-expr"></div>
        <div class="calc-val">0</div>
      </div>
      <div class="calc-grid">
        <button class="calc-btn fn" data-k="C">C</button>
        <button class="calc-btn fn" data-k="±">±</button>
        <button class="calc-btn fn" data-k="%">%</button>
        <button class="calc-btn op" data-k="/">÷</button>
        <button class="calc-btn" data-k="7">7</button>
        <button class="calc-btn" data-k="8">8</button>
        <button class="calc-btn" data-k="9">9</button>
        <button class="calc-btn op" data-k="*">×</button>
        <button class="calc-btn" data-k="4">4</button>
        <button class="calc-btn" data-k="5">5</button>
        <button class="calc-btn" data-k="6">6</button>
        <button class="calc-btn op" data-k="-">−</button>
        <button class="calc-btn" data-k="1">1</button>
        <button class="calc-btn" data-k="2">2</button>
        <button class="calc-btn" data-k="3">3</button>
        <button class="calc-btn op" data-k="+">+</button>
        <button class="calc-btn" data-k="0" style="grid-column:span 2">0</button>
        <button class="calc-btn" data-k=".">.</button>
        <button class="calc-btn eq" data-k="=">=</button>
      </div>
    `;
    let a = '0', b = null, op = null, justEval = false;
    const exprEl = root.querySelector('.calc-expr');
    const valEl = root.querySelector('.calc-val');
    const render = () => { valEl.textContent = a; exprEl.textContent = (op ? `${b} ${op} ` : ''); };
    const calc = (x, y, o) => {
      x = parseFloat(x); y = parseFloat(y);
      switch (o) { case '+': return x+y; case '-': return x-y; case '*': return x*y; case '/': return y===0?'∞':x/y; }
    };
    root.querySelectorAll('.calc-btn').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.k;
        if (/[0-9]/.test(k)) {
          if (a === '0' || justEval) { a = k; justEval = false; } else a += k;
        } else if (k === '.') {
          if (!a.includes('.')) a += '.';
        } else if (k === 'C') { a = '0'; b = null; op = null; justEval = false; }
        else if (k === '±') { a = String(-parseFloat(a)); }
        else if (k === '%') { a = String(parseFloat(a) / 100); }
        else if (['+','-','*','/'].includes(k)) {
          if (op && b !== null && !justEval) { a = String(calc(b, a, op)); }
          b = a; op = k; a = '0'; justEval = false;
        } else if (k === '=') {
          if (op && b !== null) { a = String(calc(b, a, op)); op = null; b = null; justEval = true; }
        }
        render();
      };
    });
    render();
    WM.create({ title: 'Calculator', icon: 'i-calc', width: 280, height: 400, content: root });
  }
  return { open };
})();

/* ========================================================================

   ======================================================================== */
const AppPaint = (() => {
  function open() {
    const root = document.createElement('div');
    root.className = 'paint';
    root.innerHTML = `
      <div class="paint-toolbar">
        <button data-tool="pen" class="active">Pen</button>
        <button data-tool="eraser">Eraser</button>
        <button data-tool="line">Line</button>
        <button data-tool="rect">Rect</button>
        <input type="color" value="#ff7a2e" />
        <span class="size-lbl">Size</span>
        <input type="range" min="1" max="40" value="4" />
        <button data-act="clear">Clear</button>
        <button data-act="save">${svg('i-save')} Save PNG</button>
      </div>
      <div class="paint-canvas-wrap">
        <canvas class="paint-canvas" width="800" height="500"></canvas>
      </div>
    `;
    const canvas = root.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
    let tool = 'pen', color = '#ff7a2e', size = 4;
    let drawing = false, sx = 0, sy = 0, snap = null;

    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      return { x: (pt.clientX - r.left) * (canvas.width / r.width), y: (pt.clientY - r.top) * (canvas.height / r.height) };
    };
    const down = (e) => {
      const p = pos(e); sx = p.x; sy = p.y; drawing = true;
      if (tool === 'pen' || tool === 'eraser') {
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
      } else {
        snap = ctx.getImageData(0,0,canvas.width,canvas.height);
      }
      e.preventDefault();
    };
    const move = (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (tool === 'pen') {
        ctx.strokeStyle = color; ctx.lineWidth = size;
        ctx.lineTo(p.x, p.y); ctx.stroke();
      } else if (tool === 'eraser') {
        ctx.strokeStyle = 'white'; ctx.lineWidth = size * 2;
        ctx.lineTo(p.x, p.y); ctx.stroke();
      } else if (tool === 'line') {
        ctx.putImageData(snap, 0, 0);
        ctx.strokeStyle = color; ctx.lineWidth = size;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); ctx.stroke();
      } else if (tool === 'rect') {
        ctx.putImageData(snap, 0, 0);
        ctx.strokeStyle = color; ctx.lineWidth = size;
        ctx.strokeRect(sx, sy, p.x - sx, p.y - sy);
      }
      e.preventDefault();
    };
    const up = () => { drawing = false; };
    canvas.addEventListener('mousedown', down); canvas.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move); window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
    root.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
      root.querySelectorAll('[data-tool]').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); tool = b.dataset.tool;
    });
    root.querySelector('input[type="color"]').oninput = (e) => color = e.target.value;
    root.querySelector('input[type="range"]').oninput = (e) => size = parseInt(e.target.value);
    root.querySelector('[data-act="clear"]').onclick = () => { ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height); };
    root.querySelector('[data-act="save"]').onclick = async () => {
      const name = await dialog({ title: 'Save drawing', prompt: true, defaultValue: 'drawing.png' });
      if (!name) return;
      canvas.toBlob(async (blob) => {
        await fs.writeFile(joinPath('/pictures', name), blob);
        toast('Saved to /pictures/' + name, 'ok');
      });
    };
    WM.create({ title: 'Paint', icon: 'i-paint', width: 880, height: 600, content: root });
  }
  return { open };
})();
