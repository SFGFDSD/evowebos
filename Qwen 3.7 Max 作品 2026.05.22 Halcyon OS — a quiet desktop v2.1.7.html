/* ========================================================================
   APP: ARCHIVE (native browser decompression where possible)
   Supports: .gz (native DecompressionStream), .zip (manual reader for stored/deflate), .tar (basic ustar reader)
   ======================================================================== */
const AppArchive = (() => {
  /* ---------- GZIP / DEFLATE (native) ---------- */
  async function inflateGzip(arrayBuffer) {
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([arrayBuffer]).stream().pipeThrough(ds);
    return await new Response(stream).arrayBuffer();
  }
  async function inflateDeflateRaw(arrayBuffer) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([arrayBuffer]).stream().pipeThrough(ds);
    return await new Response(stream).arrayBuffer();
  }

  /* ---------- TAR (ustar) reader ---------- */
  function parseTar(buf) {
    const bytes = new Uint8Array(buf);
    const files = [];
    let i = 0;
    const td = new TextDecoder();
    while (i + 512 <= bytes.length) {
      const header = bytes.subarray(i, i + 512);
      if (header.every(b => b === 0)) break;
      const nameA = td.decode(header.subarray(0, 100)).replace(/\0+$/, '');
      const prefix = td.decode(header.subarray(345, 500)).replace(/\0+$/, '');
      const sizeOct = td.decode(header.subarray(124, 136)).replace(/\0+$/, '').trim();
      const type = header[156];
      const size = parseInt(sizeOct, 8) || 0;
      const fullName = (prefix ? prefix + '/' : '') + nameA;
      i += 512;
      if (type === 53 || (fullName.endsWith('/') && size === 0)) {
        files.push({ name: fullName.replace(/\/$/, ''), isDirectory: true });
      } else {
        const data = bytes.slice(i, i + size);
        files.push({ name: fullName, isDirectory: false, data: data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength) });
      }
      i += Math.ceil(size / 512) * 512;
    }
    return files;
  }

  /* ---------- ZIP reader (stored + deflate) ---------- */
  async function parseZip(buf) {
    const view = new DataView(buf);
    const bytes = new Uint8Array(buf);
    const td = new TextDecoder();
    const files = [];
    // find End of Central Directory
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('invalid zip');
    const cdOff = view.getUint32(eocd + 16, true);
    const cdCount = view.getUint16(eocd + 10, true);
    let p = cdOff;
    for (let i = 0; i < cdCount; i++) {
      if (view.getUint32(p, true) !== 0x02014b50) break;
      const method = view.getUint16(p + 10, true);
      const compSize = view.getUint32(p + 20, true);
      const uncompSize = view.getUint32(p + 24, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOff = view.getUint32(p + 42, true);
      const name = td.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      // read local file header
      const lnhdr = localOff;
      if (view.getUint32(lnhdr, true) !== 0x04034b50) continue;
      const lNameLen = view.getUint16(lnhdr + 26, true);
      const lExtraLen = view.getUint16(lnhdr + 28, true);
      const dataStart = lnhdr + 30 + lNameLen + lExtraLen;
      const comp = bytes.subarray(dataStart, dataStart + compSize);
      if (name.endsWith('/')) {
        files.push({ name: name.replace(/\/$/, ''), isDirectory: true });
      } else {
        let out;
        try {
          if (method === 0) out = comp.buffer.slice(comp.byteOffset, comp.byteOffset + comp.byteLength);
          else if (method === 8) out = await inflateDeflateRaw(comp.buffer.slice(comp.byteOffset, comp.byteOffset + comp.byteLength));
          else throw new Error('unsupported method ' + method);
        } catch (e) {
          out = comp.buffer.slice(comp.byteOffset, comp.byteOffset + comp.byteLength);
        }
        files.push({ name, isDirectory: false, data: out });
      }
    }
    return files;
  }

  async function open(path) {
    const file = await fs.readFile(path);
    const buf = await file.arrayBuffer();
    const name = nameOf(path);
    const ext = extOf(path);
    let entries = [];
    try {
      if (ext === 'gz' && !name.endsWith('.tar.gz')) {
        const out = await inflateGzip(buf);
        entries = [{ name: baseOf(name), isDirectory: false, data: out }];
      } else if (ext === 'tgz' || name.endsWith('.tar.gz')) {
        const out = await inflateGzip(buf);
        entries = parseTar(out);
      } else if (ext === 'tar') {
        entries = parseTar(buf);
      } else if (ext === 'zip') {
        entries = await parseZip(buf);
      } else {
        throw new Error('Unsupported archive: ' + ext);
      }
    } catch (e) {
      toast('Cannot read archive: ' + e.message, 'error');
      return;
    }

    const outDir = await dialog({
      title: 'Extract "' + name + '"',
      message: `Found ${entries.length} entries. Extract to folder:`,
      prompt: true,
      defaultValue: baseOf(name).replace(/\.tar$/, ''),
    });
    if (!outDir) return;
    const base = joinPath(parentOf(path), outDir);
    await fs.mkdir(base);
    let written = 0;
    for (const e of entries) {
      const p = joinPath(base, e.name);
      try {
        if (e.isDirectory) await fs.mkdir(p);
        else {
          await fs.mkdir(parentOf(p));
          await fs.writeFile(p, e.data);
        }
        written++;
      } catch (err) {
        // ignore
      }
    }
    toast(`Extracted ${written} items → ${base}`, 'ok');
    AppExplorer.open(base);
  }
  return { open };
})();

      `;

          <h3>Breakdown</h3>
          <div id="storBreak">Scanning…</div>
        </div>
        <div class="set-section">
          <h3>Danger Zone</h3>
          <button class="set-btn danger" id="resetBtn">${svg('i-trash')} Reset everything</button>
        </div>
      `;
      const est = await fs.estimate();
      const used = est.usage || 0;
      const quota = est.quota || 1;
      const pct = (used / quota * 100).toFixed(2);
      main.querySelector('#storSec').innerHTML = `
        <div class="stor-total">${fmtSize(used)} <em>/ ${fmtSize(quota)}</em></div>
        <div class="stor-bar"><div style="width:${Math.min(100,pct)}%;background:var(--amber)"></div></div>
        <div class="stor-legend"><span><span class="dot" style="background:var(--amber)"></span>Used (${pct}%)</span><span><span class="dot" style="background:var(--line-2)"></span>Free</span></div>
      `;
      // breakdown: scan a few root dirs
      const dirs = ['/documents', '/pictures', '/desktop', '/system'];
      const sizes = {};
      for (const d of dirs) {
        sizes[d] = await dirSize(d);
      }
      const total = Object.values(sizes).reduce((a,b) => a+b, 0) || 1;
      const colors = { '/documents': 'var(--amber)', '/pictures': 'var(--teal)', '/desktop': 'var(--amber-soft)', '/system': 'var(--ink-mute)' };
      main.querySelector('#storBreak').innerHTML = `
        <div class="stor-bar">${Object.entries(sizes).map(([k,v]) => `<div style="width:${v/total*100}%;background:${colors[k]}"></div>`).join('')}</div>
        <div class="stor-legend">
          ${Object.entries(sizes).map(([k,v]) => `<span><span class="dot" style="background:${colors[k]}"></span>${k} · ${fmtSize(v)}</span>`).join('')}
        </div>
      `;
      main.querySelector('#resetBtn').onclick = async () => {
        const ok = await dialog({ title: 'Reset everything?', message: 'All files, settings, and mounted folders will be erased. This cannot be undone.', okText: 'Reset', danger: true });
        if (!ok) return;
        await fs.resetAll();
        location.reload();
      };
    }

    async function renderMounts() {
      const list = fs.listMounts();
      main.innerHTML = `
        <h2>Mounts<em>.</em></h2>
        <div class="sub">local folder integration · /mnt/local</div>
        <div class="set-section">
          <h3>Attach a Local Folder</h3>
          <p style="color:var(--ink-dim);margin-bottom:12px;max-width:520px">
            Grant Halcyon access to a real folder on your computer.
            It will appear under <span style="color:var(--amber);font-family:var(--font-mono)">/mnt/local/</span> and behave exactly like a virtual folder.
            Permissions are revoked when you reload — you'll be asked to re-grant them on next boot.
          </p>
          <button class="set-btn primary" id="mountBtn">${svg('i-mount')} Mount local folder…</button>
          <div class="mount-list" id="mountList"></div>
        </div>
      `;
      const render = () => {
        const ml = main.querySelector('#mountList');
        const cur = fs.listMounts();
        if (cur.length === 0) {
          ml.innerHTML = `<div style="color:var(--ink-mute);font-family:var(--font-mono);font-size:11px;padding:8px 0">No folders mounted.</div>`;
          return;
        }
        ml.innerHTML = cur.map(m => `
          <div class="mount-item" data-p="${escHtml(m.path)}">
            ${svg('i-mount')}
            <span class="path"><em>${escHtml(m.path)}</em>${m.stale ? ' · <span style="color:var(--rose)">needs re-grant</span>' : ''}</span>
            ${m.stale ? `<button class="set-btn" data-a="regrant">Re-grant</button>` : ''}
            <button class="set-btn danger" data-a="unmount">Unmount</button>
          </div>
        `).join('');
        ml.querySelectorAll('.mount-item').forEach(it => {
          const p = it.dataset.p;
          it.querySelector('[data-a="unmount"]')?.addEventListener('click', async () => {
            await fs.unmount(p); render(); toast('Unmounted', 'ok');
          });
          it.querySelector('[data-a="regrant"]')?.addEventListener('click', async () => {
            try {
              const h = await window.showDirectoryPicker({ mode: 'readwrite' });
              await fs.remount(p, h);
              toast('Re-granted: ' + nameOf(p), 'ok');
              render();
            } catch (e) { /* cancelled */ }
          });
        });
      };
      render();
      main.querySelector('#mountBtn').onclick = async () => {
        if (!window.showDirectoryPicker) { toast('File System Access API not supported in this browser', 'error'); return; }
        try {
          const h = await window.showDirectoryPicker({ mode: 'readwrite' });
          const p = await fs.mountLocal(h);
          toast('Mounted: ' + p, 'ok');
          render();
          $('#smMounts').textContent = fs.listMounts().length;
        } catch (e) {}
      };
    }

    function renderAbout() {
      main.innerHTML = `
        <h2>About<em>.</em></h2>
        <div class="sub">halcyon os · single-file desktop</div>
        <div class="set-section">
          <p style="color:var(--ink-dim);max-width:540px;line-height:1.7">
            Halcyon is a quiet, self-contained desktop environment that lives in a single HTML file.
            All files persist in your browser's <span style="color:var(--amber);font-family:var(--font-mono)">Origin Private File System</span> — they survive reloads, but stay private to this origin.
          </p>
          <p style="color:var(--ink-dim);max-width:540px;line-height:1.7;margin-top:12px">
            Local folders can be mounted at <span style="color:var(--amber);font-family:var(--font-mono)">/mnt/local/</span> using the File System Access API, giving you a unified view of virtual and physical files.
          </p>
        </div>
        <div class="set-section">
          <h3>Stack</h3>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);line-height:1.9">
            · OPFS (storage.getDirectory)<br>
            · File System Access API (showDirectoryPicker)<br>
            · DecompressionStream (gzip / deflate-raw)<br>
            · Native canvas · native media · native PDF via iframe<br>
            · Zero dependencies
          </div>
        </div>
        <div class="set-section">
          <h3>Version</h3>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-dim)">
            Halcyon/OS 1.0 — "a quiet desktop"
          </div>
        </div>
      `;
    }

    root.querySelectorAll('.set-side .item').forEach(i => i.onclick = () => renderTab(i.dataset.tab));
    renderTab('desktop');
    WM.create({ title: 'Settings', icon: 'i-settings', width: 760, height: 540, content: root });
  }

  async function dirSize(path) {
    try {
      const s = await fs.stat(path);
      if (!s.isDirectory) return s.size || 0;
      const kids = await fs.readdir(path);
      let t = 0;
      for (const k of kids) {
        if (k.isDirectory) t += await dirSize(k.path);
        else t += k.size || 0;
      }
      return t;
    } catch { return 0; }
  }

  return { open };
})();

/* ========================================================================
   WALLPAPER APPLICATION
   ======================================================================== */
function applyWallpaper() {
  const wp = $('#wallpaper');
  const cur = Settings.get('wallpaper');
  const custom = Settings.get('wallpaperCustom');
  wp.removeAttribute('style');
  wp.className = '';
  if (cur === 'custom' && custom) {
    wp.style.backgroundImage = `url(${custom})`;
    wp.style.backgroundSize = 'cover';
    wp.style.backgroundPosition = 'center';
  } else {
    const w = { halcyon: 'wp-halcyon', grid: 'wp-grid', sunset: 'wp-sunset', mono: 'wp-mono', field: 'wp-field' }[cur] || 'wp-halcyon';
    wp.className = w;
  }
}

/* ========================================================================
   START MENU
   ======================================================================== */
const StartMenu = (() => {
  const apps = [
    { id: 'explorer', name: 'Explorer', icon: 'i-explorer', open: () => AppExplorer.open('/documents') },
    { id: 'notepad', name: 'Notepad', icon: 'i-notepad', open: () => AppNotepad.open('/documents/Readme.txt').catch(() => toast('Open a text file from Explorer', 'info')) },
    { id: 'paint', name: 'Paint', icon: 'i-paint', open: AppPaint.open },
    { id: 'calc', name: 'Calculator', icon: 'i-calc', open: AppCalc.open },
    { id: 'browser', name: 'Browser', icon: 'i-browser', open: () => AppBrowser.open('about:blank') },
    { id: 'settings', name: 'Settings', icon: 'i-settings', open: AppSettings.open },
    { id: 'html', name: 'HTML Editor', icon: 'i-code', open: () => AppHtmlView.open('/documents/hello.html').catch(() => toast('Open an .html file from Explorer', 'info')) },
    { id: 'table', name: 'Table', icon: 'i-sheet', open: () => AppTable.open('/documents/data.csv').catch(() => toast('Open a .csv/.tsv file from Explorer', 'info')) },
    { id: 'home', name: 'Home Folder', icon: 'i-home', open: () => AppExplorer.open('/') },
  ];

  function render(filter = '') {
    const grid = $('#smGrid');
    grid.innerHTML = '';
    const f = filter.toLowerCase();
    apps.filter(a => !f || a.name.toLowerCase().includes(f)).forEach(a => {
      const el = document.createElement('div');
      el.className = 'sm-app';
      el.innerHTML = `${svg(a.icon)}<span class="name">${escHtml(a.name)}</span>`;
      el.onclick = () => { hide(); a.open(); };
      grid.appendChild(el);
    });
  }
  function show() {
    $('#startmenu').classList.add('show');
    $('#startBtn').classList.add('active');
    render();
    $('#smSearch').value = '';
    setTimeout(() => $('#smSearch').focus(), 50);
  }
  function hide() {
    $('#startmenu').classList.remove('show');
    $('#startBtn').classList.remove('active');
  }
  function toggle() { if ($('#startmenu').classList.contains('show')) hide(); else show(); }

  $('#startBtn').onclick = (e) => { e.stopPropagation(); toggle(); };
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#startmenu') && !e.target.closest('#startBtn')) hide();
  });
  $('#smSearch').addEventListener('input', (e) => render(e.target.value));
  $('#smMount').onclick = async () => {
    if (!window.showDirectoryPicker) { toast('File System Access API not supported', 'error'); return; }
    try {
      const h = await window.showDirectoryPicker({ mode: 'readwrite' });
      const p = await fs.mountLocal(h);
      toast('Mounted: ' + p, 'ok');
      $('#smMounts').textContent = fs.listMounts().length;
    } catch {}
  };
  return { show, hide, toggle, render };
})();

/* ========================================================================
   DESKTOP CONTEXT
   ======================================================================== */
function showDesktopContext(x, y) {
  const items = [
    { icon: 'i-refresh', label: 'Refresh', onClick: () => Desktop.render() },
    { icon: 'i-newfolder', label: 'New folder on Desktop', onClick: async () => {
      const n = await dialog({ title: 'New folder', prompt: true, defaultValue: 'New Folder' });
      if (!n) return;
      const p = joinPath('/desktop', n);
      await fs.mkdir(p);
      Desktop.addIcon(p, 'i-folder');
    }},
    { icon: 'i-upload', label: 'Import files…', onClick: () => pickFilesAndImport('/desktop').then(() => refreshDesktopIcons()) },
    { sep: true },
    { icon: 'i-palette', label: 'Change wallpaper', onClick: AppSettings.open },
    { icon: 'i-full', label: 'Fullscreen', onClick: () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }},
  ];
  Ctx.show(x, y, items);
}

function showIconContext(x, y, selectedIcons) {
  const items = [
    { icon: 'i-open', label: 'Open', onClick: async () => {
      for (const ic of selectedIcons) {
        try { const s = await fs.stat(ic.path); if (s.isDirectory) AppExplorer.open(ic.path); else AppOpen.open(ic.path); } catch {}
      }
    }},
    { icon: 'i-rename', label: 'Rename (icon only)', disabled: selectedIcons.length !== 1, onClick: async () => {
      const ic = selectedIcons[0];
      const n = await dialog({ title: 'Rename icon', prompt: true, defaultValue: ic.name });
      if (!n) return;
      ic.name = n;
      Desktop.save(); Desktop.render();
    }},
    { sep: true },
    { icon: 'i-trash', label: 'Remove from Desktop', onClick: () => {
      selectedIcons.forEach(i => Desktop.removeIcon(i.id));
    }},
  ];
  Ctx.show(x, y, items);
}

async function refreshDesktopIcons() {
  // add any /desktop items that are missing
  try {
    const kids = await fs.readdir('/desktop');
    const existing = new Set(Desktop.icons.map(i => i.path));
    for (const k of kids) {
      if (!existing.has(k.path)) {
        Desktop.addIcon(k.path, iconForFile(k));
      }
    }
  } catch {}
  Desktop.render();
}

/* ========================================================================
   DESKTOP BACKGROUND EVENTS
   ======================================================================== */
(function setupDesktopBg() {
  const layer = $('#iconlayer');
  const desktop = $('#desktop');

  desktop.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.dicon')) return;
    e.preventDefault();
    Desktop.clearSelection();
    showDesktopContext(e.clientX, e.clientY);
  });

  // selection rectangle
  const rect = $('#selrect');
  let selecting = false, sx, sy;
  desktop.addEventListener('mousedown', (e) => {
    if (e.target !== desktop && e.target.id !== 'wallpaper' && e.target.id !== 'iconlayer') return;
    if (e.button !== 0) return;
    selecting = true;
    sx = e.clientX; sy = e.clientY;
    rect.style.left = sx + 'px'; rect.style.top = sy + 'px';
    rect.style.width = '0px'; rect.style.height = '0px';
    rect.style.display = 'block';
    if (!e.shiftKey) Desktop.clearSelection();
  });
  window.addEventListener('mousemove', (e) => {
    if (!selecting) return;
    const x = Math.min(sx, e.clientX), y = Math.min(sy, e.clientY);
    const w = Math.abs(e.clientX - sx), h = Math.abs(e.clientY - sy);
    rect.style.left = x + 'px'; rect.style.top = y + 'px';
    rect.style.width = w + 'px'; rect.style.height = h + 'px';
    // highlight icons inside
    const r = { x, y, w, h };
    $$('#iconlayer .dicon').forEach(el => {
      const ir = el.getBoundingClientRect();
      const inside = !(ir.right < r.x || ir.left > r.x + r.w || ir.bottom < r.y || ir.top > r.y + r.h);
      if (inside) el.classList.add('selected');
      else if (!window.event?.shiftKey) el.classList.remove('selected');
    });
  });
  window.addEventListener('mouseup', () => {
    if (!selecting) return;
    selecting = false;
    rect.style.display = 'none';
  });

  // global drop on desktop → import to /desktop
  desktop.addEventListener('dragover', (e) => { e.preventDefault(); });
  desktop.addEventListener('drop', async (e) => {
    e.preventDefault();
    const files = [...(e.dataTransfer.files || [])];
    for (const f of files) {
      const p = joinPath('/desktop', f.name);
      await fs.writeFile(p, f);
      Desktop.addIcon(p, iconForFile({ name: f.name, isDirectory: false }));
    }
    if (files.length) toast(`Imported ${files.length} file(s)`, 'ok');
  });

  // click on empty desktop to clear selection
  desktop.addEventListener('click', (e) => {
    if (e.target === desktop || e.target.id === 'wallpaper' || e.target.id === 'iconlayer') {
      Desktop.clearSelection();
    }
  });
})();

/* ========================================================================
   KEYBOARD SHORTCUTS
   ======================================================================== */
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, [contenteditable="true"]')) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
    const sel = Desktop.getSelected();
    if (sel.length) { Clipboard.set('copy', sel.map(s => s.path)); toast('Copied', 'ok'); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'x') {
    const sel = Desktop.getSelected();
    if (sel.length) { Clipboard.set('cut', sel.map(s => s.path)); toast('Cut', 'ok'); }
  }
  if (e.key === 'Delete') {
    const sel = Desktop.getSelected();
    sel.forEach(s => Desktop.removeIcon(s.id));
  }
  if (e.key === 'Escape') {
    Ctx.hide();
    StartMenu.hide();
  }
});

/* ========================================================================
   BOOT
   ======================================================================== */
(async function boot() {
  const status = $('#bootStatus');
  try {
    status.textContent = 'initializing file system…';
    await fs.init();
    status.textContent = 'loading settings…';
    Settings.load();
    applyWallpaper();
    status.textContent = 'seeding defaults…';
    await Desktop.seedDefaults();
    Desktop.load();
    Desktop.render();
    startClock();
    $('#smMounts').textContent = fs.listMounts().length;

    // prompt re-mount if there are stale mounts
    const stale = fs.listMounts().filter(m => m.stale);
    if (stale.length) {
      setTimeout(async () => {
        const ok = await dialog({
          title: 'Re-mount folders?',
          message: `${stale.length} local folder(s) need permission again after reload: ${stale.map(s => s.name).join(', ')}. Grant access now?`,
          okText: 'Grant access',
          cancelText: 'Later',
        });
        if (ok) {
          for (const m of stale) {
            try {
              const h = await window.showDirectoryPicker({ mode: 'readwrite' });
              await fs.remount(m.path, h);
            } catch { /* user cancelled */ }
          }
          toast('Mounts restored', 'ok');
        }
      }, 400);
    }

    status.textContent = 'ready.';
    setTimeout(() => {
      $('#boot').classList.add('fade');
      setTimeout(() => $('#boot').remove(), 700);
    }, 900);
  } catch (e) {
    console.error(e);
    status.textContent = 'boot failed: ' + e.message;
    // Fallback: continue without OPFS?
    setTimeout(() => { $('#boot').classList.add('fade'); setTimeout(() => $('#boot').remove(), 700); }, 2000);
  }
})();

/* expose for debugging */
window.fs = fs;
window.WM = WM;
window.Settings = Settings;
window.Desktop = Desktop;

</script>
