<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>丹青云境 · Danqing WebOS</title>

  <!-- 典雅中文衬线字体与等宽代码字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- CodeMirror 5.65.16 专业代码编辑内核 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

  <style>
    /* =========================================================================
       一、 中国古代山水壁画美学变量体系（深色夜宴青绿 / 浅色宋画绢本）
       ========================================================================= */
    :root {
      --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', 'STSong', Georgia, serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;

      /* 用户可动态定制的系统级变量 */
      --accent: #2E8B99;          /* 默认主题色：石青 */
      --accent-hover: #3AA3B3;
      --accent-soft: rgba(46, 139, 153, 0.22);
      --accent-glow: rgba(46, 139, 153, 0.42);
      --cinnabar: #D94E41;        /* 朱砂印章红 */
      --cinnabar-hover: #E66053;
      --gold: #D4A349;            /* 泥金箔色 */
      --malachite: #2D9D78;       /* 石绿 */

      --win-radius: 10px;         /* 可调窗口圆角 (0px ~ 18px) */
      --glass-opacity: 0.86;
      --taskbar-height: 48px;
      --ease-silk: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 深色模式：黑漆描金屏风 · 夜宴青绿壁画质感 */
    :root[data-theme="dark"] {
      --bg-canvas: #0B1114;
      --bg-surface: rgba(16, 25, 30, 0.88);
      --bg-surface-solid: #111B20;
      --bg-elevated: rgba(23, 35, 42, 0.94);
      --bg-elevated-solid: #17232A;
      --bg-hover: rgba(212, 163, 73, 0.12);
      --bg-active: rgba(46, 139, 153, 0.26);
      --bg-input: rgba(9, 15, 18, 0.72);
      --bg-taskbar: rgba(11, 18, 22, 0.84);

      --text-primary: #EDE6D6;    /* 温润宣纸白 */
      --text-secondary: #A9B5B8;  /* 远山青灰 */
      --text-muted: #6C7D82;      /* 淡墨 */
      --text-on-accent: #F7F4EC;

      --border-subtle: rgba(212, 163, 73, 0.18);
      --border-strong: rgba(212, 163, 73, 0.38);
      --border-window: rgba(212, 163, 73, 0.28);

      --shadow-window: 0 22px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(212, 163, 73, 0.16), inset 0 1px 0 rgba(255, 245, 220, 0.08);
      --shadow-popover: 0 14px 40px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(212, 163, 73, 0.24);
      --desktop-icon-text: #F5EFE0;
      --desktop-icon-shadow: 0 2px 6px rgba(0, 0, 0, 0.92), 0 0 12px rgba(0, 0, 0, 0.65);
      --scrollbar-thumb: rgba(212, 163, 73, 0.28);
      --scrollbar-thumb-hover: rgba(212, 163, 73, 0.48);
    }

    /* 浅色模式：宋代青绿山水绢本 · 敦煌矿物浅底（绝非简单反色，专为高对比阅读调校） */
    :root[data-theme="light"] {
      --bg-canvas: #EAE2D0;
      --bg-surface: rgba(246, 241, 229, 0.90);
      --bg-surface-solid: #F6F1E5;
      --bg-elevated: rgba(252, 249, 242, 0.96);
      --bg-elevated-solid: #FCF9F2;
      --bg-hover: rgba(46, 139, 153, 0.10);
      --bg-active: rgba(46, 139, 153, 0.20);
      --bg-input: rgba(255, 253, 248, 0.88);
      --bg-taskbar: rgba(242, 235, 219, 0.88);

      --text-primary: #1F2421;    /* 徽墨浓黑 */
      --text-secondary: #4D5954;  /* 松烟灰 */
      --text-muted: #7D8782;      /* 浅黛 */
      --text-on-accent: #FCF9F2;

      --border-subtle: rgba(120, 95, 55, 0.18);
      --border-strong: rgba(120, 95, 55, 0.36);
      --border-window: rgba(138, 106, 56, 0.30);

      --shadow-window: 0 18px 48px rgba(42, 34, 20, 0.22), 0 0 0 1px rgba(138, 106, 56, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      --shadow-popover: 0 12px 34px rgba(42, 34, 20, 0.24), 0 0 0 1px rgba(138, 106, 56, 0.28);
      --desktop-icon-text: #FBF7EE;
      --desktop-icon-shadow: 0 1px 5px rgba(18, 22, 20, 0.95), 0 0 10px rgba(18, 22, 20, 0.78);
      --scrollbar-thumb: rgba(120, 95, 55, 0.26);
      --scrollbar-thumb-hover: rgba(120, 95, 55, 0.46);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-serif);
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      overscroll-behavior: none;
    }

    input, textarea, select, [contenteditable="true"] {
      user-select: text;
      font-family: inherit;
    }

    /* 自定义滚动条：细金卷轴风 */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    /* =========================================================================
       二、 桌面环境与壁画图层
       ========================================================================= */
    #os-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #wallpaper-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: var(--bg-canvas);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: background-image 0.45s ease, filter 0.3s ease;
    }

    /* 古画绢本微妙纹理叠加 */
    #wallpaper-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(212, 163, 73, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.7;
    }

    /* 桌面工作区（扣除任务栏高度） */
    #desktop-workspace {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--taskbar-height);
      z-index: 1;
      overflow: hidden;
    }

    #desktop-icons {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: auto;
    }

    /* 桌面图标：支持自由坐标拖拽、丝滑位移动画、单击打开 */
    .desktop-icon {
      position: absolute;
      width: 86px;
      padding: 8px 6px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: left 0.24s var(--ease-silk), top 0.24s var(--ease-silk), background-color 0.16s ease, border-color 0.16s ease, transform 0.15s ease;
      z-index: 2;
      touch-action: none;
    }

    .desktop-icon.dragging-touch {
      transition: none !important;
      z-index: 50;
      transform: scale(1.06);
      opacity: 0.9;
    }

    .desktop-icon:hover {
      background: rgba(20, 32, 38, 0.42);
      border-color: rgba(212, 163, 73, 0.35);
      backdrop-filter: blur(6px);
    }

    .desktop-icon.selected {
      background: rgba(46, 139, 153, 0.38);
      border-color: var(--gold);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .desktop-icon-glyph {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.55));
      pointer-events: none;
    }

    .desktop-icon-glyph img.thumb-preview {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(212, 163, 73, 0.5);
    }

    .desktop-icon-label {
      width: 100%;
      text-align: center;
      font-size: 12px;
      line-height: 1.3;
      color: var(--desktop-icon-text);
      text-shadow: var(--desktop-icon-shadow);
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      pointer-events: none;
    }

    /* =========================================================================
       三、 通用高性能框选矩形 (Marquee Selection Box)
       ========================================================================= */
    .marquee-box {
      position: absolute;
      pointer-events: none;
      z-index: 9999;
      background: rgba(46, 139, 153, 0.22);
      border: 1.5px solid var(--gold);
      box-shadow: inset 0 0 12px rgba(212, 163, 73, 0.22), 0 2px 10px rgba(0, 0, 0, 0.25);
      border-radius: 2px;
      display: none;
    }

    /* =========================================================================
       四、 Aero Snap 吸附预览 & Aero Peek 透视桌面
       ========================================================================= */
    #aero-snap-preview {
      position: fixed;
      z-index: 4999;
      pointer-events: none;
      background: rgba(46, 139, 153, 0.18);
      border: 2px solid var(--gold);
      border-radius: var(--win-radius);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(46, 139, 153, 0.35), inset 0 0 20px rgba(212, 163, 73, 0.18);
      opacity: 0;
      transform: scale(0.97);
      transition: all 0.18s var(--ease-silk);
      display: none;
    }
    #aero-snap-preview.visible {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    /* Aero Peek 激活状态：所有窗口化为半透明描金玻璃轮廓 */
    body.aero-peeking .os-window {
      opacity: 0.14 !important;
      filter: blur(2px);
      pointer-events: none !important;
      box-shadow: 0 0 0 2px var(--gold) !important;
    }

    /* =========================================================================
       五、 窗口管理器 (Window Manager) - 东方窗棂/印章控件（非红绿灯）
       ========================================================================= */
    #windows-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--taskbar-height);
      z-index: 10;
      pointer-events: none;
    }

    .os-window {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      border: 1px solid var(--border-window);
      border-radius: var(--win-radius);
      box-shadow: var(--shadow-window);
      overflow: hidden;
      min-width: 280px;
      min-height: 200px;
      animation: windowOpen 0.22s var(--ease-silk);
      transition: opacity 0.2s ease, transform 0.2s var(--ease-silk), border-radius 0.2s ease;
    }

    @keyframes windowOpen {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .os-window.active {
      border-color: var(--gold);
    }

    .os-window.minimized {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88) translateY(30px);
    }

    .os-window.maximized {
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
    }

    .os-window.snapped {
      transition: left 0.18s var(--ease-silk), top 0.18s var(--ease-silk), width 0.18s var(--ease-silk), height 0.18s var(--ease-silk);
    }

    /* 窗口标题栏：中式画卷轴头与窗棂装饰 */
    .win-titlebar {
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      background: linear-gradient(90deg, rgba(212, 163, 73, 0.10) 0%, rgba(46, 139, 153, 0.08) 50%, rgba(212, 163, 73, 0.06) 100%);
      border-bottom: 1px solid var(--border-subtle);
      cursor: default;
      touch-action: none;
    }

    .os-window.active .win-titlebar {
      background: linear-gradient(90deg, rgba(212, 163, 73, 0.18) 0%, var(--accent-soft) 55%, rgba(212, 163, 73, 0.10) 100%);
    }

    .win-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .win-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .win-title-text {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    /* 东方印章/窗棂风格窗口控制按钮（非苹果红绿灯） */
    .win-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .win-ctrl-btn {
      width: 28px;
      height: 26px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }

    .win-ctrl-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .win-ctrl-btn.close-btn:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #FFF8F0;
    }

    .win-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 八向边缘调整大小手柄 (Resize Handles) */
    .resize-handle {
      position: absolute;
      z-index: 20;
      touch-action: none;
    }
    .resize-n { top: -3px; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
    .resize-s { bottom: -3px; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
    .resize-e { right: -3px; top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
    .resize-w { left: -3px; top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
    .resize-nw { top: -4px; left: -4px; width: 10px; height: 10px; cursor: nwse-resize; }
    .resize-ne { top: -4px; right: -4px; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-sw { bottom: -4px; left: -4px; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-se { bottom: -4px; right: -4px; width: 10px; height: 10px; cursor: nwse-resize; }

    .os-window.maximized .resize-handle {
      display: none;
    }

    /* =========================================================================
       六、 任务栏 (Taskbar)、开始菜单 (Start Menu)、日历 (Calendar)
       ========================================================================= */
    #taskbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-height);
      z-index: 5000;
      background: var(--bg-taskbar);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border-top: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 8px;
      gap: 6px;
    }

    .taskbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .taskbar-left::-webkit-scrollbar {
      display: none;
    }

    /* 朱砂印章风开始按钮 */
    #start-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid rgba(217, 78, 65, 0.55);
      background: linear-gradient(135deg, rgba(217, 78, 65, 0.88), rgba(176, 52, 42, 0.92));
      color: #FDF8F0;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(217, 78, 65, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.16s ease;
    }

    #start-btn:hover, #start-btn.active {
      background: linear-gradient(135deg, #E35A4D, #C43D32);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(217, 78, 65, 0.48);
    }

    .taskbar-divider {
      width: 1px;
      height: 22px;
      background: var(--border-subtle);
      flex-shrink: 0;
      margin: 0 2px;
    }

    #taskbar-apps {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .taskbar-item {
      height: 34px;
      max-width: 185px;
      min-width: 42px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: rgba(128, 128, 128, 0.08);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .taskbar-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .taskbar-item.active {
      background: var(--bg-active);
      color: var(--text-primary);
      border-color: var(--border-strong);
      font-weight: 600;
    }

    .taskbar-item::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 2.5px;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.18s ease;
    }

    .taskbar-item.active::after {
      width: 26px;
      background: var(--gold);
    }

    .taskbar-item.minimized::after {
      width: 6px;
      opacity: 0.55;
    }

    .taskbar-item-title {
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .taskbar-item-close {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      color: var(--text-muted);
    }

    .taskbar-item:hover .taskbar-item-close {
      display: flex;
    }

    .taskbar-item-close:hover {
      background: var(--cinnabar);
      color: #fff;
    }

    /* 系统托盘与 Aero Peek 观山按钮 */
    .taskbar-tray {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tray-btn {
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s ease;
    }

    .tray-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    #tray-clock-btn {
      height: 36px;
      padding: 2px 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      line-height: 1.2;
      transition: all 0.15s ease;
    }

    #tray-clock-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
    }

    #tray-time {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #tray-date {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* 任务栏最右侧 Aero Peek 观山透视条 */
    #aero-peek-btn {
      width: 14px;
      height: 36px;
      margin-left: 2px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      background: rgba(212, 163, 73, 0.10);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
    }

    #aero-peek-btn:hover {
      background: var(--accent-soft);
      border-color: var(--gold);
      width: 18px;
    }

    /* =========================================================================
       七、 开始菜单与日历弹出层
       ========================================================================= */
    #start-menu {
      position: fixed;
      left: 10px;
      bottom: calc(var(--taskbar-height) + 10px);
      width: 440px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - var(--taskbar-height) - 24px);
      z-index: 6000;
      background: var(--bg-elevated);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: var(--shadow-popover);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.18s var(--ease-silk);
    }

    #start-menu.open {
      display: flex;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .start-header {
      padding: 14px 16px;
      background: linear-gradient(120deg, rgba(212, 163, 73, 0.14), rgba(46, 139, 153, 0.12));
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .start-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-seal {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--cinnabar);
      color: #FFF9F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(217, 78, 65, 0.4);
      border: 1px solid rgba(255, 235, 200, 0.35);
    }

    .start-search-wrap {
      padding: 10px 14px 6px;
    }

    .os-input {
      width: 100%;
      height: 34px;
      padding: 0 11px;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .os-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .start-apps-grid {
      padding: 10px 14px 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      overflow-y: auto;
      max-height: 340px;
    }

    .start-app-item {
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .start-app-item:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
      transform: translateY(-2px);
    }

    .start-app-name {
      font-size: 12px;
      line-height: 1.25;
      color: var(--text-primary);
    }

    .start-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* 月历弹出面板 */
    #calendar-popover {
      position: fixed;
      right: 10px;
      bottom: calc(var(--taskbar-height) + 10px);
      width: 316px;
      z-index: 6000;
      background: var(--bg-elevated);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: var(--shadow-popover);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: popUp 0.18s var(--ease-silk);
    }

    #calendar-popover.open {
      display: flex;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }

    .cal-weekday {
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 4px 0;
      font-weight: 600;
    }

    .cal-day {
      height: 34px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s ease;
    }

    .cal-day:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
    }

    .cal-day.other-month {
      color: var(--text-muted);
      opacity: 0.48;
    }

    .cal-day.today {
      background: var(--cinnabar);
      color: #FFF9F0;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(217, 78, 65, 0.4);
    }

    .cal-day.selected-day:not(.today) {
      background: var(--accent-soft);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* =========================================================================
       八、 自定义右键上下文菜单 & 模态对话框 & 通知吐司
       ========================================================================= */
    #context-menu {
      position: fixed;
      z-index: 8000;
      min-width: 196px;
      background: var(--bg-elevated);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      box-shadow: var(--shadow-popover);
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    #context-menu.open {
      display: flex;
    }

    .ctx-item {
      padding: 7px 11px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      position: relative;
      transition: background 0.12s ease;
    }

    .ctx-item:hover {
      background: var(--bg-active);
    }

    .ctx-item.danger:hover {
      background: rgba(217, 78, 65, 0.22);
      color: #FF7B6E;
    }

    .ctx-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctx-shortcut {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .ctx-sep {
      height: 1px;
      background: var(--border-subtle);
      margin: 3px 6px;
    }

    .ctx-submenu {
      position: absolute;
      left: 100%;
      top: -4px;
      min-width: 175px;
      background: var(--bg-elevated-solid);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      box-shadow: var(--shadow-popover);
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 8005;
    }

    .ctx-item:hover > .ctx-submenu {
      display: flex;
    }

    /* 通用按钮样式 */
    .os-btn {
      height: 31px;
      padding: 0 11px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: rgba(128, 128, 128, 0.10);
      color: var(--text-primary);
      font-family: var(--font-serif);
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .os-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .os-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .os-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text-on-accent);
    }

    .os-btn.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .os-btn.danger {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #FFF8F0;
    }

    .os-btn.danger:hover:not(:disabled) {
      background: var(--cinnabar-hover);
    }

    .os-btn.active-toggle {
      background: var(--bg-active);
      border-color: var(--gold);
      color: var(--text-primary);
    }

    .os-select {
      height: 31px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: var(--font-serif);
      font-size: 12.5px;
      outline: none;
      cursor: pointer;
    }

    /* 模态对话框 */
    #modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(6, 10, 12, 0.62);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #modal-backdrop.open {
      display: flex;
    }

    .os-modal {
      width: 440px;
      max-width: 100%;
      max-height: 88vh;
      background: var(--bg-elevated-solid);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: var(--shadow-window);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: windowOpen 0.18s var(--ease-silk);
    }

    .os-modal-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 14.5px;
      background: linear-gradient(90deg, rgba(212, 163, 73, 0.12), transparent);
    }

    .os-modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13.5px;
    }

    .os-modal-footer {
      padding: 11px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      background: rgba(0, 0, 0, 0.08);
    }

    /* 通知吐司 */
    #toast-container {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: calc(100vw - 28px);
    }

    .os-toast {
      pointer-events: auto;
      min-width: 240px;
      max-width: 360px;
      padding: 10px 14px;
      border-radius: 9px;
      background: var(--bg-elevated-solid);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--accent);
      box-shadow: var(--shadow-popover);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      animation: toastIn 0.22s var(--ease-silk);
    }

    .os-toast.success { border-left-color: var(--malachite); }
    .os-toast.error { border-left-color: var(--cinnabar); }
    .os-toast.warn { border-left-color: var(--gold); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* =========================================================================
       九、 文件资源管理器 (File Explorer) - 严格左对齐不拉伸列 + 框选区 + 分栏
       ========================================================================= */
    .fe-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .fe-toolbar {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .fe-nav-bar {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .fe-breadcrumbs {
      flex: 1;
      height: 30px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      gap: 3px;
      overflow-x: auto;
      scrollbar-width: none;
      cursor: text;
    }
    .fe-breadcrumbs::-webkit-scrollbar { display: none; }

    .fe-crumb {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-secondary);
    }
    .fe-crumb:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .fe-crumb.current {
      color: var(--text-primary);
      font-weight: 600;
    }

    .fe-main {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .fe-sidebar {
      width: 205px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.08);
      overflow-y: auto;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .fe-tree-group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 8px 8px 4px;
      letter-spacing: 0.05em;
    }

    .fe-tree-item {
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.12s ease;
    }

    .fe-tree-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .fe-tree-item.active {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 600;
    }

    .fe-content-wrap {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 可滚动视图容器：必须 position: relative 以支撑绝对定位选框 */
    .fe-scroll-viewport {
      flex: 1;
      position: relative;
      overflow: auto;
      min-height: 0;
    }

    /* 详细信息视图：严格左对齐连续列，不撑满行宽，右侧保留大片空白作为框选区 */
    .fe-details-table {
      display: inline-block;
      min-width: 100%;
      vertical-align: top;
    }

    /* 列头背景铺满整行，但列本身按精确像素宽度左对齐排列 */
    .fe-details-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      width: 100%;
      min-width: max-content;
      height: 32px;
      background: var(--bg-elevated-solid);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .fe-col-header {
      position: relative;
      height: 100%;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
      flex-shrink: 0;
      flex-grow: 0;
      cursor: pointer;
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
      white-space: nowrap;
    }

    .fe-col-header:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .fe-col-resizer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 2;
    }
    .fe-col-resizer:hover {
      background: var(--gold);
    }

    .fe-details-rows {
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* 关键：每行只占各列总宽，绝不撑满整行！右侧留白归属列表背景框选区 */
      padding: 4px 0 36px;
    }

    .fe-detail-row {
      display: inline-flex;
      align-items: center;
      height: 34px;
      border-radius: 5px;
      margin: 1px 4px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .fe-detail-row:hover {
      background: var(--bg-hover);
    }

    .fe-detail-row.selected {
      background: var(--bg-active);
      border-color: var(--gold);
    }

    .fe-detail-row.drag-over-dir {
      background: rgba(212, 163, 73, 0.25);
      border: 1px dashed var(--gold);
    }

    .fe-detail-cell {
      padding: 0 10px;
      flex-shrink: 0;
      flex-grow: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
    }

    .fe-detail-cell .cell-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 图标网格视图 */
    .fe-grid-view {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px;
      padding: 12px 12px 42px;
      min-height: 100%;
    }

    .fe-grid-item {
      width: 104px;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .fe-grid-item:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
    }

    .fe-grid-item.selected {
      background: var(--bg-active);
      border-color: var(--gold);
    }

    .fe-grid-item.drag-over-dir {
      background: rgba(212, 163, 73, 0.25);
      border: 1px dashed var(--gold);
    }

    .fe-grid-thumb {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fe-grid-thumb img {
      max-width: 50px;
      max-height: 50px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-subtle);
    }

    .fe-grid-name {
      width: 100%;
      font-size: 12px;
      line-height: 1.3;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 分栏视图 (Miller Columns) */
    .fe-columns-view {
      display: flex;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .fe-miller-col {
      width: 220px;
      min-width: 190px;
      height: 100%;
      border-right: 1px solid var(--border-subtle);
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .fe-miller-item {
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12.5px;
      cursor: pointer;
    }

    .fe-miller-item:hover {
      background: var(--bg-hover);
    }

    .fe-miller-item.active {
      background: var(--bg-active);
      border: 1px solid var(--gold);
    }

    .fe-statusbar {
      height: 28px;
      padding: 0 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    /* 挂载目录读取加载流光指示器 */
    .fe-loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 30;
      overflow: hidden;
      display: none;
    }
    .fe-loading-bar.active {
      display: block;
    }
    .fe-loading-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold), var(--accent), transparent);
      animation: loadingSlide 1s infinite ease-in-out;
    }
    @keyframes loadingSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }

    /* =========================================================================
       十、 HTML / 代码编辑器 (CodeMirror 5.65.x)
       ========================================================================= */
    .ce-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .ce-toolbar {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .ce-find-bar {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-elevated-solid);
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .ce-find-bar.open {
      display: flex;
    }

    .ce-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .ce-workspace.layout-vertical {
      flex-direction: column;
    }

    .ce-editor-pane {
      flex: 1;
      min-width: 120px;
      min-height: 100px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ce-editor-pane .CodeMirror {
      height: 100% !important;
      width: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .ce-resizer {
      width: 6px;
      background: var(--border-subtle);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s ease;
      touch-action: none;
    }
    .ce-resizer:hover {
      background: var(--gold);
    }
    .ce-workspace.layout-vertical > .ce-resizer {
      width: 100%;
      height: 6px;
      cursor: row-resize;
    }

    .ce-preview-pane {
      flex: 1;
      min-width: 120px;
      min-height: 100px;
      position: relative;
      background: #0D1418;
      display: flex;
      flex-direction: column;
    }

    .ce-preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* 暗色水墨载入遮罩，防止 iframe 初始化白屏闪烁 */
    .dark-iframe-veil {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #0B1216;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #EDE6D6;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .dark-iframe-veil.hidden {
      opacity: 0;
    }

    .ink-spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2.5px solid rgba(212, 163, 73, 0.22);
      border-top-color: var(--gold);
      border-right-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ce-statusbar {
      height: 26px;
      padding: 0 10px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      flex-shrink: 0;
      overflow-x: auto;
      gap: 12px;
    }

    /* =========================================================================
       十一、 漫画阅读器 (Manga Viewer) - 纯黑沉浸、无抖动、物理阻尼、全屏隐蔽按钮
       ========================================================================= */
    .manga-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #000000;
      color: #EDE6D6;
      position: relative;
    }

    .manga-toolbar {
      height: 40px;
      padding: 0 10px;
      background: rgba(14, 20, 24, 0.92);
      border-bottom: 1px solid rgba(212, 163, 73, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 严格条漫滚动视窗规范 */
    .manga-viewport {
      flex: 1;
      width: 100%;
      background: #000000;
      overscroll-behavior-y: none;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: pan-y;
      contain: layout style;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      position: relative;
    }

    .manga-viewport.grabbing {
      cursor: grabbing;
    }

    .manga-stream {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0 auto;
    }

    /* 固有宽高比骨架占位，加载完成自动释放 */
    .manga-page-item {
      width: 100%;
      position: relative;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .manga-page-item.skeleton {
      aspect-ratio: 2 / 3;
      min-height: 360px;
      background: linear-gradient(180deg, #090C0E 0%, #10171B 50%, #090C0E 100%);
    }

    .manga-page-item img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* 全屏沉浸模式：彻底隐藏窗口标题栏、调整手柄与工具栏，仅留纯黑漫画与右上角隐蔽退出按钮 */
    .os-window.manga-window-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      z-index: 99999 !important;
      border: none !important;
      border-radius: 0 !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: #000000 !important;
      box-shadow: none !important;
    }

    .os-window.manga-window-fullscreen > .win-titlebar,
    .os-window.manga-window-fullscreen > .resize-handle {
      display: none !important;
    }

    .manga-root.is-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 99999 !important;
      background: #000000 !important;
    }

    .manga-root.is-fullscreen .manga-toolbar {
      display: none !important;
    }

    /* 移动端专属按钮在桌面端隐藏，不干扰桌面体验 */
    @media (min-width: 769px) {
      .mobile-only-btn {
        display: none !important;
      }
    }

    .touch-drag-ghost {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--bg-elevated-solid);
      border: 1px solid var(--gold);
      color: var(--text-primary);
      font-size: 12.5px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transform: translate(-50%, -120%);
    }

    .manga-fs-exit {
      display: none;
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100000;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.36);
      color: rgba(255, 255, 255, 0.65);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.42;
      transition: opacity 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .manga-fs-exit:hover {
      opacity: 0.95;
      background: rgba(217, 78, 65, 0.85);
      color: #ffffff;
      transform: scale(1.08);
    }

    .manga-root.is-fullscreen .manga-fs-exit {
      display: flex;
    }

    /* =========================================================================
       十二、 V86 虚拟机、记事本/CSV表格、设置中心、画板等专属样式
       ========================================================================= */
    .v86-screen-container {
      background: #000;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      flex: 1;
      position: relative;
      cursor: crosshair;
    }

    .csv-table-wrap {
      flex: 1;
      overflow: auto;
      background: var(--bg-input);
    }

    .csv-table {
      border-collapse: collapse;
      min-width: 100%;
      font-size: 12.5px;
    }

    .csv-table th, .csv-table td {
      border: 1px solid var(--border-subtle);
      padding: 5px 8px;
      text-align: left;
      min-width: 90px;
    }

    .csv-table th {
      background: var(--bg-elevated-solid);
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
    }

    .csv-table td input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      outline: none;
      font-size: 12.5px;
    }

    /* 设置中心布局 */
    .settings-layout {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    .settings-nav {
      width: 185px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-subtle);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0, 0, 0, 0.08);
      overflow-y: auto;
    }

    .settings-content {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(128, 128, 128, 0.05);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 开关控件 */
    .os-switch {
      position: relative;
      width: 42px;
      height: 22px;
      border-radius: 12px;
      background: rgba(128, 128, 128, 0.35);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .os-switch.on {
      background: var(--accent);
      border-color: var(--accent);
    }
    .os-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #FDF8F0;
      transition: transform 0.2s var(--ease-silk);
    }
    .os-switch.on::after {
      transform: translateX(20px);
    }

    /* =========================================================================
       十三、 手机与平板响应式适配 (Mobile & Tablet Responsive)
       ========================================================================= */
    @media (max-width: 768px) {
      :root {
        --taskbar-height: 54px;
      }

      .os-window:not(.minimized) {
        min-width: 100vw !important;
        max-width: 100vw !important;
      }

      .win-titlebar {
        height: 44px;
      }

      .win-ctrl-btn {
        width: 34px;
        height: 32px;
      }

      .taskbar-item {
        max-width: 46px;
        padding: 0 8px;
        justify-content: center;
      }

      .taskbar-item-title, .taskbar-item-close {
        display: none !important;
      }

      #start-btn span {
        display: none;
      }

      #aero-peek-btn {
        display: none;
      }

      .start-apps-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .fe-sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 25;
        background: var(--bg-elevated-solid);
        box-shadow: 6px 0 24px rgba(0, 0, 0, 0.45);
        transform: translateX(-100%);
        transition: transform 0.22s var(--ease-silk);
      }

      .fe-sidebar.mobile-open {
        transform: translateX(0);
      }

      .settings-layout {
        flex-direction: column;
      }

      .settings-nav {
        width: 100%;
        flex-direction: row;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <div id="os-root">
    <!-- 壁画背景层 -->
    <div id="wallpaper-layer"></div>

    <!-- 桌面工作区 -->
    <div id="desktop-workspace">
      <div id="desktop-icons"></div>
    </div>

    <!-- Aero Snap 吸附预览框 -->
    <div id="aero-snap-preview"></div>

    <!-- 窗口层 -->
    <div id="windows-layer"></div>

    <!-- 底部任务栏 / 移动端 Dock -->
    <footer id="taskbar">
      <div class="taskbar-left">
        <button id="start-btn" title="开始菜单 (丹青云境)">
          <span id="start-btn-icon"></span>
          <span>云境</span>
        </button>
        <div class="taskbar-divider"></div>
        <div id="taskbar-apps"></div>
      </div>

      <div class="taskbar-tray">
        <button class="tray-btn" id="tray-mount-btn" title="本地文件夹挂载管理"></button>
        <button class="tray-btn" id="tray-theme-btn" title="切换深色/浅色画境"></button>
        <button class="tray-btn" id="tray-fullscreen-btn" title="系统全屏"></button>
        <button id="tray-clock-btn" title="查看月历与时制设置">
          <span id="tray-time">上午 12:00</span>
          <span id="tray-date">2026/05/01</span>
        </button>
        <div id="aero-peek-btn" title="悬停透视桌面 (Aero Peek) / 点击显示桌面"></div>
      </div>
    </footer>

    <!-- 开始菜单 -->
    <div id="start-menu">
      <div class="start-header">
        <div class="start-brand">
          <div class="start-seal">印</div>
          <div>
            <div style="font-weight: 700; font-size: 15px;">丹青云境 WebOS</div>
            <div style="font-size: 11.5px; color: var(--text-secondary);" id="start-vfs-badge">OPFS 磐石存储已就绪</div>
          </div>
        </div>
        <button class="os-btn" id="start-settings-quick">设置</button>
      </div>
      <div class="start-search-wrap">
        <input type="text" class="os-input" id="start-search-input" placeholder="检索系统应用或文件..." />
      </div>
      <div class="start-apps-grid" id="start-apps-grid"></div>
      <div class="start-footer">
        <button class="os-btn" id="start-mount-local-btn">挂载本地文件夹</button>
        <button class="os-btn" id="start-show-desktop-btn">显示桌面</button>
      </div>
    </div>

    <!-- 月历弹出层 -->
    <div id="calendar-popover">
      <div class="cal-header">
        <button class="os-btn" id="cal-prev-btn" style="height:26px;padding:0 8px;">上月</button>
        <div id="cal-month-label" style="font-weight:700;font-size:14px;">2026年 5月</div>
        <button class="os-btn" id="cal-next-btn" style="height:26px;padding:0 8px;">下月</button>
      </div>
      <div class="cal-grid" id="cal-weekdays"></div>
      <div class="cal-grid" id="cal-days"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid var(--border-subtle);font-size:12px;">
        <button class="os-btn" id="cal-today-btn" style="height:26px;">回到今日</button>
        <button class="os-btn" id="cal-hour-toggle-btn" style="height:26px;">切换 12/24 小时制</button>
      </div>
    </div>

    <!-- 自定义右键菜单 -->
    <div id="context-menu"></div>

    <!-- 模态对话框 -->
    <div id="modal-backdrop">
      <div class="os-modal" id="os-modal">
        <div class="os-modal-header">
          <span id="modal-title">提示</span>
          <button class="win-ctrl-btn" id="modal-close-x"></button>
        </div>
        <div class="os-modal-body" id="modal-body"></div>
        <div class="os-modal-footer" id="modal-footer"></div>
      </div>
    </div>

    <!-- 通知吐司容器 -->
    <div id="toast-container"></div>
  </div>

  <!-- 核心应用脚本注入点 -->
  <script>
  'use strict';

  /* =========================================================================
     MODULE 1: 原创中国风矢量图标库 (SVGIcons) - 严禁任何 Emoji

    getFileIcon(entry) {
      if (entry.type === 'dir') {
        if (entry.path === '/mnt/local' || entry.path.startsWith('/mnt/local/')) return this.get('mount', 36);
        if (entry.path === '/mnt/opfs' || entry.path === '/mnt/idb') return this.get('drive', 36);
        return this.get('folder', 36);
      }
      const ext = Utils.getExt(entry.name);
      if (Utils.isImageExt(ext)) return this.get('image', 36);
      if (['html', 'htm', 'css', 'js', 'mjs', 'json', 'xml', 'svg', 'ts'].includes(ext)) return this.get('code', 36);
      if (['csv', 'tsv'].includes(ext)) return this.get('table', 36);
      if (['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a'].includes(ext)) return this.get('audio', 36);
      if (['mp4', 'webm', 'ogv', 'mkv'].includes(ext)) return this.get('video', 36);
      if (ext === 'pdf') return this.get('pdf', 36);
      if (['zip', 'gz', 'tar', 'tgz', '7z', 'rar'].includes(ext)) return this.get('archive', 36);
      if (['iso', 'img', 'fda', 'bin'].includes(ext)) return this.get('vm', 36);
      if (['txt', 'md', 'markdown', 'yaml', 'yml', 'log', 'ini', 'conf'].includes(ext)) return this.get('text', 36);
