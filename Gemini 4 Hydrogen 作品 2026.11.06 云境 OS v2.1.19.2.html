      this.currClientX = 0;
      this.currClientY = 0;
      this.rafId = null;
      this.baseSelected = new Set();

      this._onMouseDown = this._handleStart.bind(this, false);
      this._onTouchStart = this._handleStart.bind(this, true);
      this._onMove = this._handleMove.bind(this);
      this._onEnd = this._handleEnd.bind(this);

      this.container.addEventListener('mousedown', this._onMouseDown);
      this.container.addEventListener('touchstart', this._onTouchStart, { passive: true });
    }

    _handleStart(isTouch, e) {
      if (!isTouch && e.button !== 0) return;
      if (e.target.closest(this.ignoreSelector)) return;
      if (e.target.closest(this.itemSelector)) return;

      // 在触摸模式下，如果是可左右滑动的分栏视图且未开启强制框选，让位于原生滑动
      if (isTouch && this.container.querySelector('.fe-columns-view') && !this.forceTouchMarquee()) {
        return;
      }

      const { x, y } = Utils.getClientXY(e);
      const rect = this.container.getBoundingClientRect();
      // 忽略点击在滚动条轨道上的情况
      if (x > rect.left + this.container.clientWidth || y > rect.top + this.container.clientHeight) {
        return;
      }

      this.active = true;
      this.isTouch = isTouch;
      this.currClientX = x;
      this.currClientY = y;
      this.startX = x - rect.left + this.container.scrollLeft;
      this.startY = y - rect.top + this.container.scrollTop;

      this.baseSelected.clear();
      if (e.ctrlKey || e.metaKey || e.shiftKey) {
        this.container.querySelectorAll(`${this.itemSelector}.selected`).forEach(el => {
          if (el.dataset.path) this.baseSelected.add(el.dataset.path);
        });
      } else {
        this._applySelection(new Set());
      }

      this.boxEl.style.left = `${this.startX}px`;
      this.boxEl.style.top = `${this.startY}px`;
      this.boxEl.style.width = '0px';
      this.boxEl.style.height = '0px';
      this.boxEl.style.display = 'block';

      document.addEventListener('mousemove', this._onMove);
      document.addEventListener('mouseup', this._onEnd);
      document.addEventListener('touchmove', this._onMove, { passive: false });
      document.addEventListener('touchend', this._onEnd);
      document.addEventListener('touchcancel', this._onEnd);

      this._startAutoScrollLoop();
    }

    _handleMove(e) {
      if (!this.active) return;
      if (e.type === 'touchmove') {
        e.preventDefault(); // 框选过程中锁死页面原生滚动
      }
      const { x, y } = Utils.getClientXY(e);
      this.currClientX = x;
      this.currClientY = y;
      this._updateMarqueeRect();
    }

    _startAutoScrollLoop() {
      const tick = () => {
        if (!this.active) return;
        const rect = this.container.getBoundingClientRect();
        const edgeBand = 40;
        const maxSpeed = 14;
        let dx = 0;
        let dy = 0;

        if (this.currClientY < rect.top + edgeBand) {
          dy = -Math.ceil(((rect.top + edgeBand - this.currClientY) / edgeBand) * maxSpeed);
        } else if (this.currClientY > rect.bottom - edgeBand) {
          dy = Math.ceil(((this.currClientY - (rect.bottom - edgeBand)) / edgeBand) * maxSpeed);
        }

        if (this.currClientX < rect.left + edgeBand) {
          dx = -Math.ceil(((rect.left + edgeBand - this.currClientX) / edgeBand) * maxSpeed);
        } else if (this.currClientX > rect.right - edgeBand) {
          dx = Math.ceil(((this.currClientX - (rect.right - edgeBand)) / edgeBand) * maxSpeed);
        }

        if (dx !== 0 || dy !== 0) {
          const prevTop = this.container.scrollTop;
          const prevLeft = this.container.scrollLeft;
          this.container.scrollTop += dy;
          this.container.scrollLeft += dx;
          if (this.container.scrollTop !== prevTop || this.container.scrollLeft !== prevLeft) {
            this._updateMarqueeRect();
          }
        }
        this.rafId = requestAnimationFrame(tick);
      };
      this.rafId = requestAnimationFrame(tick);
    }

    _updateMarqueeRect() {
      const rect = this.container.getBoundingClientRect();
      const curX = Math.max(0, Math.min(this.container.scrollWidth, this.currClientX - rect.left + this.container.scrollLeft));
      const curY = Math.max(0, Math.min(this.container.scrollHeight, this.currClientY - rect.top + this.container.scrollTop));

      const left = Math.min(this.startX, curX);
      const top = Math.min(this.startY, curY);
      const width = Math.abs(curX - this.startX);
      const height = Math.abs(curY - this.startY);

      this.boxEl.style.left = `${left}px`;
      this.boxEl.style.top = `${top}px`;
      this.boxEl.style.width = `${width}px`;
      this.boxEl.style.height = `${height}px`;

      if (width < 3 && height < 3) return;

      // AABB 碰撞检测（转换子元素相对于滚动容器内容区的坐标）
      const selBox = { left, top, right: left + width, bottom: top + height };
      const hitPaths = new Set(this.baseSelected);
      const items = this.container.querySelectorAll(this.itemSelector);

      for (const item of items) {
        const itemRect = item.getBoundingClientRect();
        const itemLeft = itemRect.left - rect.left + this.container.scrollLeft;
        const itemTop = itemRect.top - rect.top + this.container.scrollTop;
        const itemRight = itemLeft + itemRect.width;
        const itemBottom = itemTop + itemRect.height;

        const overlap = !(
          selBox.right < itemLeft ||
          selBox.left > itemRight ||
          selBox.bottom < itemTop ||
          selBox.top > itemBottom
        );

        if (overlap && item.dataset.path) {
          hitPaths.add(item.dataset.path);
        }
      }

      this._applySelection(hitPaths);
    }

    _applySelection(pathSet) {
      const items = this.container.querySelectorAll(this.itemSelector);
      for (const item of items) {
        const p = item.dataset.path;
        if (p && pathSet.has(p)) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      }
      if (this.onSelectionChange) {
        this.onSelectionChange(Array.from(pathSet));
      }
    }

    _handleEnd() {
      if (!this.active) return;
      this.active = false;
      this.boxEl.style.display = 'none';
      cancelAnimationFrame(this.rafId);
      document.removeEventListener('mousemove', this._onMove);
      document.removeEventListener('mouseup', this._onEnd);
      document.removeEventListener('touchmove', this._onMove);
      document.removeEventListener('touchend', this._onEnd);
      document.removeEventListener('touchcancel', this._onEnd);
    }

    destroy() {
      this._handleEnd();
      this.container.removeEventListener('mousedown', this._onMouseDown);
      this.container.removeEventListener('touchstart', this._onTouchStart);
      if (this.boxEl && this.boxEl.parentNode) {
        this.boxEl.remove();
      }
    }
  }

  /* =========================================================================
     MODULE 7: 双向拖拽与导入导出引擎 (DragDropManager)
     1. 严禁在 draggable="true" 元素上混用自定义 pointerdown/pointermove
     2. mouseenter/mousedown 时异步预加载 File + BlobURL 到缓存 Map
     3. dragstart 严格同步读取缓存，同时写入 items.add(file) 与 DownloadURL
     4. dragend 延迟 6000ms (>5秒) 再 revokeObjectURL
     5. 外部拖入递归遍历 webkitGetAsEntry()，循环 readEntries() 直到空数组，
        严禁 Buffer.from，使用 await file.arrayBuffer() 并保留 file.lastModified
     ========================================================================= */
  const DragDropManager = {
    preloadCache: new Map(), // vfsPath -> { file, blobUrl, name, mime }
    internalDragState: null, // 同步保存当前内部拖拽状态作为备份

    /**
     * 预加载单个文件以便同步拖出到物理桌面
     */
    async preloadFileForOutDrag(vfsPath, filename) {
      try {
        if (this.preloadCache.has(vfsPath)) return;
        const st = await fs.stat(vfsPath);
        if (st.type !== 'file') return;
        // 限制预加载单文件上限 80MB 避免内存瞬时峰值
        if (st.size > 80 * 1024 * 1024) return;
        const buf = await fs.readFile(vfsPath);
        const mime = Utils.getMimeType(filename);
        const file = new File([buf], filename, { type: mime, lastModified: st.mtime });
        const blobUrl = URL.createObjectURL(file);
        this.preloadCache.set(vfsPath, { file, blobUrl, name: filename, mime });
      } catch (_) {}
    },

    /**
     * 为支持双向拖拽的图标/行绑定标准 HTML5 拖拽事件（绝不使用 pointermove）
     */
    bindDraggableElement(el, { getDragPaths, onClickSelect }) {
      el.setAttribute('draggable', 'true');

      const triggerPreload = () => {
        const path = el.dataset.path;
        const type = el.dataset.type;
        if (path && type === 'file') {
          this.preloadFileForOutDrag(path, Utils.basename(path));
        }
      };

      el.addEventListener('mouseenter', triggerPreload);
      el.addEventListener('mousedown', triggerPreload);

      el.addEventListener('dragstart', (e) => {
        // 严禁在 dragstart 中使用 async/await！全部同步完成
        if (onClickSelect) onClickSelect();
        const paths = getDragPaths ? getDragPaths() : [el.dataset.path].filter(Boolean);
        if (paths.length === 0) return;

        const rect = el.getBoundingClientRect();
        const payload = {
          paths,
          sourceDir: Utils.dirname(paths[0]),
          grabOffsetX: e.clientX - rect.left,
          grabOffsetY: e.clientY - rect.top
        };

        this.internalDragState = payload;
        e.dataTransfer.effectAllowed = 'copyMove';
        e.dataTransfer.setData('application/x-danqing-drag', JSON.stringify(payload));
        e.dataTransfer.setData('text/plain', paths.join('\n'));

        // 若单文件已预加载，注入原生文件与 DownloadURL 以支持直接拖出到物理桌面
        if (paths.length === 1) {
          const cached = this.preloadCache.get(paths[0]);
          if (cached) {
            try {
              e.dataTransfer.items.add(cached.file);
            } catch (_) {}
            try {
              e.dataTransfer.setData(
                'DownloadURL',
                `${cached.mime || 'application/octet-stream'}:${cached.name}:${cached.blobUrl}`
              );
            } catch (_) {}
          }
        }
      });

      el.addEventListener('dragend', () => {
        const dragged = this.internalDragState;
        this.internalDragState = null;
        if (dragged && dragged.paths) {
          for (const p of dragged.paths) {
            const cached = this.preloadCache.get(p);
            if (cached) {
              this.preloadCache.delete(p);
              // 严格延迟 > 5 秒再释放 Blob URL，确保浏览器后台下载完成
              setTimeout(() => {
                URL.revokeObjectURL(cached.blobUrl);
              }, 6500);
            }
          }
        }
      });
    },

    /**
     * 绑定文件夹目标接收（拖入文件夹移动）
     */
    bindFolderDropTarget(el, getTargetDirPath, onAfterDrop) {
      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drag-over-dir');
      });

      el.addEventListener('dragleave', (e) => {
        e.stopPropagation();
        el.classList.remove('drag-over-dir');
      });

      el.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        el.classList.remove('drag-over-dir');
        const targetDir = getTargetDirPath();
        if (!targetDir) return;
        await this.handleDropIntoDirectory(e, targetDir);
        if (onAfterDrop) onAfterDrop();
      });
    },

    /**
     * 统一处理 Drop 到指定目录（支持内部移动/复制 + 外部物理桌面递归导入）
     */
    async handleDropIntoDirectory(e, targetDir) {
      const rawInternal = e.dataTransfer.getData('application/x-danqing-drag');
      let internal = null;
      if (rawInternal) {
        try { internal = JSON.parse(rawInternal); } catch (_) {}
      } else if (this.internalDragState) {
        internal = this.internalDragState;
      }

      if (internal && Array.isArray(internal.paths) && internal.paths.length > 0) {
        let moved = 0;
        for (const srcPath of internal.paths) {
          if (Utils.dirname(srcPath) === Utils.normalizePath(targetDir)) continue;
          if (targetDir === srcPath || targetDir.startsWith(srcPath + '/')) {
            Utils.toast('不能将文件夹移动到自身内部', 'warn');
            continue;
          }
          const destPath = await this.getUniqueDestPath(targetDir, Utils.basename(srcPath));
          if (e.ctrlKey) {
            await fs.copy(srcPath, destPath);
          } else {
            await fs.rename(srcPath, destPath);
          }
          moved++;
        }
        if (moved > 0) {
          Utils.toast(e.ctrlKey ? `已复制 ${moved} 项到 ${targetDir}` : `已移动 ${moved} 项到 ${targetDir}`, 'success');
        }
        return { kind: 'internal', count: moved };
      }

      // 外部物理桌面拖入：递归解析 webkitGetAsEntry
      const importedCount = await this.importDataTransferItems(e.dataTransfer, targetDir);
      if (importedCount > 0) {
        Utils.toast(`已从本地导入 ${importedCount} 个文件到 ${targetDir}`, 'success');
      }
      return { kind: 'external', count: importedCount };
    },

    async getUniqueDestPath(dirPath, filename) {
      let candidate = Utils.joinPath(dirPath, filename);
      if (!(await fs.exists(candidate))) return candidate;
      const dot = filename.lastIndexOf('.');
      const stem = dot > 0 ? filename.slice(0, dot) : filename;
      const ext = dot > 0 ? filename.slice(dot) : '';
      let idx = 2;
      while (await fs.exists(candidate)) {
        candidate = Utils.joinPath(dirPath, `${stem} (${idx++})${ext}`);
      }
      return candidate;
    },

    /**
     * 递归导入物理文件/目录：readEntries() 必须循环调用直到返回空数组
     * 严禁 Buffer.from()，使用 await file.arrayBuffer() 并保留 file.lastModified
     */
    async importDataTransferItems(dataTransfer, targetDir) {
      let count = 0;
      const items = dataTransfer.items;

      const readAllDirectoryEntries = async (dirReader) => {
        const all = [];
        while (true) {
          const batch = await new Promise((resolve, reject) => {
            dirReader.readEntries(resolve, reject);
          });
          if (!batch || batch.length === 0) break;
          all.push(...batch);
        }
        return all;
      };

      const processEntry = async (entry, currentVfsDir) => {
        if (!entry) return;
        if (entry.isFile) {
          const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
          const buf = await file.arrayBuffer();
          const mtime = file.lastModified || Date.now();
          const dest = await this.getUniqueDestPath(currentVfsDir, file.name);
          await fs.writeFile(dest, buf, { mtime, ctime: mtime });
          count++;
        } else if (entry.isDirectory) {
          const subDir = await this.getUniqueDestPath(currentVfsDir, entry.name);
          await fs.mkdir(subDir, { recursive: true });
          const reader = entry.createReader();
          const subEntries = await readAllDirectoryEntries(reader);
          for (const sub of subEntries) {
            await processEntry(sub, subDir);
          }
        }
      };

      if (items && items.length > 0) {
        const entries = [];
        for (let i = 0; i < items.length; i++) {
          const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
          if (entry) entries.push(entry);
        }
        if (entries.length > 0) {
          for (const entry of entries) {
            await processEntry(entry, targetDir);
          }
          return count;
        }
      }

      // 回退读取 dataTransfer.files
      if (dataTransfer.files && dataTransfer.files.length > 0) {
        for (const file of dataTransfer.files) {
          const buf = await file.arrayBuffer();
          const mtime = file.lastModified || Date.now();
          const dest = await this.getUniqueDestPath(targetDir, file.name);
          await fs.writeFile(dest, buf, { mtime, ctime: mtime });
          count++;
        }
      }
      return count;
    },

    /**
     * 通过 <input type="file"> 上传文件到指定 VFS 目录
     */
    pickAndImportFiles(targetDir, multiple = true) {
      return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = multiple;
        input.onchange = async () => {
          const files = Array.from(input.files || []);
          let count = 0;
          for (const file of files) {
            const buf = await file.arrayBuffer();
            const mtime = file.lastModified || Date.now();
            const dest = await this.getUniqueDestPath(targetDir, file.name);
            await fs.writeFile(dest, buf, { mtime, ctime: mtime });
            count++;
          }
          if (count > 0) {
            Utils.toast(`已导入 ${count} 个文件`, 'success');
          }
          resolve(count);
        };
        input.click();
      });
    },

    /**
     * 导出/下载 VFS 中的文件或文件夹到本地电脑（移动端与通用导出方案）
     */
    async exportPathsToLocal(paths) {
      if (!paths || paths.length === 0) return;
      if (paths.length === 1) {
        const p = paths[0];
        const st = await fs.stat(p);
        if (st.type === 'file') {
          const buf = await fs.readFile(p);
          const blob = new Blob([buf], { type: Utils.getMimeType(st.name) });
          Utils.triggerBrowserDownload(blob, st.name);
          Utils.toast(`正在导出 ${st.name}`, 'info');
          return;
        }
      }
      // 多文件或文件夹自动打包为 ZIP 下载
      Utils.toast('正在打包准备导出...', 'info');
      const tmpZip = `/Downloads/.export_${Date.now()}.zip`;
      await ArchiveEngine.createZipFromPaths(paths, tmpZip);
      const buf = await fs.readFile(tmpZip);
      await fs.unlink(tmpZip);
      const zipName = paths.length === 1 ? `${Utils.basename(paths[0])}.zip` : `丹青云境导出_${Date.now()}.zip`;
      Utils.triggerBrowserDownload(new Blob([buf], { type: 'application/zip' }), zipName);
    }
  };

  /* =========================================================================
     MODULE 8: 窗口管理器 (WindowManager)
     支持拖拽移动、八向边缘调整大小 (Mouse & Touch)、Aero Snap、Aero Peek、任务栏联动
     ========================================================================= */
  const WindowManager = {
    windows: new Map(), // winId -> winObj
    zCounter: 100,
    activeWinId: null,
    cascadeOffset: 0,
    allMinimizedSnapshot: null,

    init() {
      const peekBtn = document.getElementById('aero-peek-btn');
      if (peekBtn) {
        peekBtn.addEventListener('mouseenter', () => {
          if (window.OSConfig?.aeroPeek !== false) {
            document.body.classList.add('aero-peeking');
          }
        });
        peekBtn.addEventListener('mouseleave', () => {
          document.body.classList.remove('aero-peeking');
        });
        peekBtn.addEventListener('click', () => {
          document.body.classList.remove('aero-peeking');
          this.toggleShowDesktop();
        });
      }

      window.addEventListener('resize', () => {
        this.windows.forEach(w => {
          if (!w.maximized && !w.minimized) {
            this._clampWindowToViewport(w);
          }
        });
      });
    },

    getWorkspaceBounds() {
      const layer = document.getElementById('windows-layer');
      return {
        width: layer.clientWidth || window.innerWidth,
        height: layer.clientHeight || (window.innerHeight - 48)
      };
    },

    createWindow({
      id = Utils.uid('win'),
      title = '窗口',
      icon = 'seal',
      width = 820,
      height = 560,
      minWidth = 300,
      minHeight = 220,
      maximized = false,
      onClose = null,
      render = null
    }) {
      if (this.windows.has(id)) {
        const existing = this.windows.get(id);
        this.focusWindow(id);
        return existing;
      }

      const bounds = this.getWorkspaceBounds();
      const isMobile = window.innerWidth <= 768;

      let w = Math.min(width, bounds.width - 16);
      let h = Math.min(height, bounds.height - 16);
      if (isMobile) {
        w = bounds.width;
        h = bounds.height;
      }

      this.cascadeOffset = (this.cascadeOffset + 28) % 168;
      let left = isMobile ? 0 : Math.max(12, Math.round((bounds.width - w) / 2) + this.cascadeOffset - 70);
      let top = isMobile ? 0 : Math.max(10, Math.round((bounds.height - h) / 2) + this.cascadeOffset - 70);
      left = Math.min(left, Math.max(0, bounds.width - w));
      top = Math.min(top, Math.max(0, bounds.height - h));

      const winEl = document.createElement('div');
      winEl.className = 'os-window';
      winEl.dataset.winId = id;
      winEl.style.width = `${w}px`;
      winEl.style.height = `${h}px`;
      winEl.style.left = `${left}px`;
      winEl.style.top = `${top}px`;
      winEl.style.minWidth = `${minWidth}px`;
      winEl.style.minHeight = `${minHeight}px`;

      winEl.innerHTML = `
        <div class="win-titlebar">
          <div class="win-title-left">
            <div class="win-icon">${SVGIcons.get(icon, 18)}</div>
            <div class="win-title-text">${Utils.escapeHtml(title)}</div>
          </div>
          <div class="win-controls">
            <button class="win-ctrl-btn min-btn" title="最小化">${SVGIcons.get('winMin', 14)}</button>
            <button class="win-ctrl-btn max-btn" title="最大化">${SVGIcons.get('winMax', 14)}</button>
            <button class="win-ctrl-btn close-btn" title="关闭">${SVGIcons.get('winClose', 14)}</button>
          </div>
        </div>
        <div class="win-body"></div>
        <div class="resize-handle resize-n" data-dir="n"></div>
        <div class="resize-handle resize-s" data-dir="s"></div>
        <div class="resize-handle resize-e" data-dir="e"></div>
        <div class="resize-handle resize-w" data-dir="w"></div>
        <div class="resize-handle resize-nw" data-dir="nw"></div>
        <div class="resize-handle resize-ne" data-dir="ne"></div>
        <div class="resize-handle resize-sw" data-dir="sw"></div>
        <div class="resize-handle resize-se" data-dir="se"></div>
      `;

      const winObj = {
        id,
        title,
        icon,
        el: winEl,
        bodyEl: winEl.querySelector('.win-body'),
        titleTextEl: winEl.querySelector('.win-title-text'),
        maxBtnEl: winEl.querySelector('.max-btn'),
        minimized: false,
        maximized: Boolean(maximized || isMobile),
        snapped: false,
        restoreRect: { left, top, width: w, height: h },
        onClose
      };

      if (winObj.maximized) {
        winEl.classList.add('maximized');
        winObj.maxBtnEl.innerHTML = SVGIcons.get('winRestore', 14);
      }

      document.getElementById('windows-layer').appendChild(winEl);
      this.windows.set(id, winObj);

      this._bindWindowEvents(winObj);
      this.focusWindow(id);
      this.renderTaskbar();

      if (render) {
        render(winObj.bodyEl, winObj);
      }
      return winObj;
    },

    setWindowTitle(id, newTitle) {
      const w = this.windows.get(id);
      if (!w) return;
      w.title = newTitle;
      w.titleTextEl.textContent = newTitle;
      this.renderTaskbar();
    },

    focusWindow(id) {
      const w = this.windows.get(id);
      if (!w) return;
      if (w.minimized) {
        w.minimized = false;
        w.el.classList.remove('minimized');
      }
      this.zCounter++;
      w.el.style.zIndex = this.zCounter;
      this.windows.forEach(item => item.el.classList.remove('active'));
      w.el.classList.add('active');
      this.activeWinId = id;
      this.renderTaskbar();
    },

    minimizeWindow(id) {
      const w = this.windows.get(id);
      if (!w) return;
      w.minimized = true;
      w.el.classList.add('minimized');
      w.el.classList.remove('active');
      if (this.activeWinId === id) {
        this.activeWinId = null;
        // 激活下一个最高 z-index 的非最小化窗口
        let topWin = null;
        this.windows.forEach(item => {
          if (!item.minimized && (!topWin || Number(item.el.style.zIndex) > Number(topWin.el.style.zIndex))) {
            topWin = item;
          }
        });
        if (topWin) this.focusWindow(topWin.id);
      }
      this.renderTaskbar();
    },

    toggleMaximize(id) {
      const w = this.windows.get(id);
      if (!w) return;
      if (w.maximized) {
        w.maximized = false;
        w.snapped = false;
        w.el.classList.remove('maximized', 'snapped');
        w.el.style.left = `${w.restoreRect.left}px`;
        w.el.style.top = `${w.restoreRect.top}px`;
        w.el.style.width = `${w.restoreRect.width}px`;
        w.el.style.height = `${w.restoreRect.height}px`;
        w.maxBtnEl.innerHTML = SVGIcons.get('winMax', 14);
        w.maxBtnEl.title = '最大化';
      } else {
        if (!w.snapped) {
          w.restoreRect = {
            left: parseFloat(w.el.style.left) || 0,
            top: parseFloat(w.el.style.top) || 0,
            width: w.el.offsetWidth,
            height: w.el.offsetHeight
          };
        }
        w.maximized = true;
        w.snapped = false;
        w.el.classList.add('maximized');
        w.maxBtnEl.innerHTML = SVGIcons.get('winRestore', 14);
        w.maxBtnEl.title = '还原';
      }
      this.focusWindow(id);
    },

    closeWindow(id) {
      const w = this.windows.get(id);
      if (!w) return;
      if (w.onClose) {
        try { w.onClose(w); } catch (e) { console.error(e); }
      }
      w.el.remove();
      this.windows.delete(id);
      if (this.activeWinId === id) {
        this.activeWinId = null;
      }
      this.renderTaskbar();
    },

    toggleShowDesktop() {
      const visibleWins = Array.from(this.windows.values()).filter(w => !w.minimized);
      if (visibleWins.length > 0) {
        this.allMinimizedSnapshot = visibleWins.map(w => w.id);
        visibleWins.forEach(w => this.minimizeWindow(w.id));
      } else if (this.allMinimizedSnapshot && this.allMinimizedSnapshot.length > 0) {
        const toRestore = this.allMinimizedSnapshot;
        this.allMinimizedSnapshot = null;
        toRestore.forEach(id => {
          if (this.windows.has(id)) this.focusWindow(id);
        });
      }
    },

    _clampWindowToViewport(w) {
      const bounds = this.getWorkspaceBounds();
      let left = parseFloat(w.el.style.left) || 0;
      let top = parseFloat(w.el.style.top) || 0;
      left = Math.max(-w.el.offsetWidth + 80, Math.min(bounds.width - 80, left));
      top = Math.max(0, Math.min(bounds.height - 40, top));
      w.el.style.left = `${left}px`;
      w.el.style.top = `${top}px`;
    },

    _bindWindowEvents(winObj) {
      const { id, el } = winObj;
      const titlebar = el.querySelector('.win-titlebar');
      const minBtn = el.querySelector('.min-btn');
      const maxBtn = el.querySelector('.max-btn');
      const closeBtn = el.querySelector('.close-btn');

      el.addEventListener('mousedown', () => this.focusWindow(id));
      el.addEventListener('touchstart', () => this.focusWindow(id), { passive: true });

      minBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.minimizeWindow(id);
      });
      maxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.toggleMaximize(id);
      });
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.closeWindow(id);
      });

      titlebar.addEventListener('dblclick', (e) => {
        if (!e.target.closest('.win-controls')) {
          this.toggleMaximize(id);
        }
      });

      // 标题栏拖拽移动 + Aero Snap 边缘吸附
      const startMove = (e) => {
        if (e.target.closest('.win-controls')) return;
        if (e.button !== undefined && e.button !== 0) return;

        const { x: startX, y: startY } = Utils.getClientXY(e);
        let initLeft = parseFloat(el.style.left) || 0;
        let initTop = parseFloat(el.style.top) || 0;
        let initW = el.offsetWidth;
        let initH = el.offsetHeight;
        let snapZone = null;
        let moved = false;

        const previewEl = document.getElementById('aero-snap-preview');

        const detectSnap = (cx, cy) => {
          if (window.OSConfig?.aeroSnap === false || window.innerWidth <= 768) return null;
          const bounds = this.getWorkspaceBounds();
          const edge = 16;
          const corner = 64;

          if (cx <= edge && cy <= corner) return { type: 'tl', left: 0, top: 0, width: bounds.width / 2, height: bounds.height / 2 };
          if (cx >= bounds.width - edge && cy <= corner) return { type: 'tr', left: bounds.width / 2, top: 0, width: bounds.width / 2, height: bounds.height / 2 };
          if (cx <= edge && cy >= bounds.height - corner) return { type: 'bl', left: 0, top: bounds.height / 2, width: bounds.width / 2, height: bounds.height / 2 };
          if (cx >= bounds.width - edge && cy >= bounds.height - corner) return { type: 'br', left: bounds.width / 2, top: bounds.height / 2, width: bounds.width / 2, height: bounds.height / 2 };
          if (cy <= 10) return { type: 'max', left: 0, top: 0, width: bounds.width, height: bounds.height };
          if (cx <= edge) return { type: 'left', left: 0, top: 0, width: bounds.width / 2, height: bounds.height };
          if (cx >= bounds.width - edge) return { type: 'right', left: bounds.width / 2, top: 0, width: bounds.width / 2, height: bounds.height };
          return null;
        };

        const onMove = (ev) => {
          const { x: cx, y: cy } = Utils.getClientXY(ev);
          const dx = cx - startX;
          const dy = cy - startY;
          if (!moved && Math.hypot(dx, dy) < 4) return;
          moved = true;
          if (ev.cancelable) ev.preventDefault();

          // 如果当前处于最大化或分屏状态，拖离时自动恢复正常尺寸
          if (winObj.maximized || winObj.snapped) {
            const ratioX = cx / (el.offsetWidth || 1);
            winObj.maximized = false;
            winObj.snapped = false;
            el.classList.remove('maximized', 'snapped');
            winObj.maxBtnEl.innerHTML = SVGIcons.get('winMax', 14);
            initW = winObj.restoreRect.width;
            initH = winObj.restoreRect.height;
            el.style.width = `${initW}px`;
            el.style.height = `${initH}px`;
            initLeft = cx - initW * ratioX - dx;
            initTop = Math.max(0, cy - 18 - dy);
          }

          const bounds = this.getWorkspaceBounds();
          const newLeft = Math.max(-initW + 80, Math.min(bounds.width - 80, initLeft + dx));
          const newTop = Math.max(0, Math.min(bounds.height - 36, initTop + dy));
          el.style.left = `${newLeft}px`;
          el.style.top = `${newTop}px`;

          snapZone = detectSnap(cx, cy);
          if (snapZone) {
            previewEl.style.left = `${snapZone.left + 4}px`;
            previewEl.style.top = `${snapZone.top + 4}px`;
            previewEl.style.width = `${snapZone.width - 8}px`;
            previewEl.style.height = `${snapZone.height - 8}px`;
            previewEl.classList.add('visible');
          } else {
            previewEl.classList.remove('visible');
          }
        };

        const onEnd = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          previewEl.classList.remove('visible');

          if (moved && snapZone) {
            winObj.restoreRect = {
              left: parseFloat(el.style.left) || 40,
              top: parseFloat(el.style.top) || 40,
              width: el.offsetWidth,
              height: el.offsetHeight
            };
            if (snapZone.type === 'max') {
              this.toggleMaximize(id);
            } else {
              winObj.snapped = true;
              el.classList.add('snapped');
              el.style.left = `${snapZone.left}px`;
              el.style.top = `${snapZone.top}px`;
              el.style.width = `${snapZone.width}px`;
              el.style.height = `${snapZone.height}px`;
            }
          }
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      };

      titlebar.addEventListener('mousedown', startMove);
      titlebar.addEventListener('touchstart', startMove, { passive: true });

      // 八向边缘调整大小 (Resize)
      el.querySelectorAll('.resize-handle').forEach(handle => {
        const dir = handle.dataset.dir;
        const startResize = (e) => {
          if (winObj.maximized) return;
          e.stopPropagation();
          if (e.button !== undefined && e.button !== 0) return;

          const { x: startX, y: startY } = Utils.getClientXY(e);
          const startRect = {
            left: parseFloat(el.style.left) || 0,
            top: parseFloat(el.style.top) || 0,
            width: el.offsetWidth,
            height: el.offsetHeight
          };
          const minW = parseInt(el.style.minWidth, 10) || 280;
          const minH = parseInt(el.style.minHeight, 10) || 200;
          const bounds = this.getWorkspaceBounds();

          winObj.snapped = false;
          el.classList.remove('snapped');

          const onResizeMove = (ev) => {
            if (ev.cancelable) ev.preventDefault();
            const { x: cx, y: cy } = Utils.getClientXY(ev);
            const dx = cx - startX;
            const dy = cy - startY;

            let newLeft = startRect.left;
            let newTop = startRect.top;
            let newW = startRect.width;
            let newH = startRect.height;

            if (dir.includes('e')) {
              newW = Math.max(minW, Math.min(bounds.width - startRect.left, startRect.width + dx));
            }
            if (dir.includes('s')) {
              newH = Math.max(minH, Math.min(bounds.height - startRect.top, startRect.height + dy));
            }
            if (dir.includes('w')) {
              const maxDx = startRect.width - minW;
              const clampedDx = Math.max(-startRect.left, Math.min(maxDx, dx));
              newLeft = startRect.left + clampedDx;
              newW = startRect.width - clampedDx;
            }
            if (dir.includes('n')) {
              const maxDy = startRect.height - minH;
              const clampedDy = Math.max(-startRect.top, Math.min(maxDy, dy));
              newTop = startRect.top + clampedDy;
              newH = startRect.height - clampedDy;
            }

            el.style.left = `${newLeft}px`;
            el.style.top = `${newTop}px`;
            el.style.width = `${newW}px`;
            el.style.height = `${newH}px`;
          };

          const onResizeEnd = () => {
            document.removeEventListener('mousemove', onResizeMove);
            document.removeEventListener('mouseup', onResizeEnd);
            document.removeEventListener('touchmove', onResizeMove);
            document.removeEventListener('touchend', onResizeEnd);
          };

          document.addEventListener('mousemove', onResizeMove);
          document.addEventListener('mouseup', onResizeEnd);
          document.addEventListener('touchmove', onResizeMove, { passive: false });
          document.addEventListener('touchend', onResizeEnd);
        };

        handle.addEventListener('mousedown', startResize);
        handle.addEventListener('touchstart', startResize, { passive: true });
      });
    },

    renderTaskbar() {
      const container = document.getElementById('taskbar-apps');
      if (!container) return;
      container.innerHTML = '';

      this.windows.forEach((w) => {
        const btn = document.createElement('div');
        btn.className = `taskbar-item ${this.activeWinId === w.id && !w.minimized ? 'active' : ''} ${w.minimized ? 'minimized' : ''}`;
        btn.title = w.title;
        btn.innerHTML = `
          <span style="display:flex;flex-shrink:0;">${SVGIcons.get(w.icon, 16)}</span>
          <span class="taskbar-item-title">${Utils.escapeHtml(w.title)}</span>
          <span class="taskbar-item-close" title="关闭窗口">${SVGIcons.get('winClose', 11)}</span>
        `;

        btn.addEventListener('click', (e) => {
          if (e.target.closest('.taskbar-item-close')) {
            e.stopPropagation();
            this.closeWindow(w.id);
            return;
          }
          if (this.activeWinId === w.id && !w.minimized) {
            this.minimizeWindow(w.id);
          } else {
            this.focusWindow(w.id);
          }
        });

        btn.addEventListener('auxclick', (e) => {
          if (e.button === 1) {
            e.preventDefault();
            this.closeWindow(w.id);
          }
        });

        container.appendChild(btn);
      });
    }
  };

  /* =========================================================================
     MODULE 9: 智能文件/文件夹分派器 (AppDispatcher)
     打开任何路径前先通过 fs.stat 检查类型：目录则导航进入，文件则按类型调度
     ========================================================================= */
  const AppDispatcher = {
    async openPath(path, options = {}) {
      const norm = Utils.normalizePath(path);
      let st;
      try {
        st = await fs.stat(norm);
      } catch (err) {
        Utils.toast(`无法打开 "${norm}": ${err.message}`, 'error');
        return;
      }

      if (st.type === 'dir') {
        if (options.explorerNavigate) {
          options.explorerNavigate(norm);
        } else {
          FileExplorerApp.open(norm);
        }
        return;
      }

      const ext = Utils.getExt(st.name);

      // .html / .htm 专用交互：提供在系统浏览器打开或编辑源代码（实时分屏预览）的主要入口
      if ((ext === 'html' || ext === 'htm') && !options.mode) {
        const choice = await this._promptHtmlOpenAction(norm, st.name);
        if (choice === 'browser') {
          BrowserApp.openVfsHtml(norm);
        } else if (choice === 'editor') {
          CodeEditorApp.open(norm);
        }
        return;
      }

      if (options.mode === 'code') {
        CodeEditorApp.open(norm);
        return;
      }
      if (options.mode === 'text') {
        NotepadApp.open(norm, { forceText: true });
        return;
      }
      if (options.mode === 'browser') {
        BrowserApp.openVfsHtml(norm);
        return;
      }
      if (options.mode === 'image') {
        ImageViewerApp.open(norm);
        return;
      }
      if (options.mode === 'manga') {
        MangaViewerApp.open(norm);
        return;
      }

      // 默认智能识别
      if (Utils.isImageExt(ext)) {
        // 默认以漫画阅读器打开（加载同目录全部图片按自然序排列并定位到此图），内部可一键切换图片查看器
        MangaViewerApp.open(norm);
      } else if (['csv', 'tsv'].includes(ext)) {
        NotepadApp.open(norm);
      } else if (['css', 'js', 'mjs', 'json', 'xml', 'md', 'markdown'].includes(ext)) {
        CodeEditorApp.open(norm);
      } else if (Utils.isTextOrCodeExt(ext)) {
        NotepadApp.open(norm);
      } else if (Utils.isAudioExt(ext) || Utils.isVideoExt(ext)) {
        MediaPlayerApp.open(norm);
      } else if (ext === 'pdf') {
        PdfViewerApp.open(norm);
      } else if (Utils.isArchiveExt(ext) || Utils.isTarGzName(st.name)) {
        this.promptAndExtractArchive(norm);
      } else if (['iso', 'img', 'fda', 'bin'].includes(ext)) {
        V86App.openWithImage(norm);
      } else {
        // 任何未知 MIME 类型提供“以纯文本形式打开”的通用选项
        const openAsText = await Utils.confirmDialog(
          '未知文件格式',
          `文件 "${st.name}" (${Utils.getMimeType(st.name)}) 没有关联的专用应用。是否以纯文本形式在记事本中打开以查看原始内容？`
        );
        if (openAsText) {
          NotepadApp.open(norm, { forceText: true });
        }
      }
    },

    async _promptHtmlOpenAction(path, name) {
      return new Promise((resolve) => {
        const box = document.createElement('div');
        box.style.display = 'flex';
        box.style.flexDirection = 'column';
        box.style.gap = '10px';
        box.innerHTML = `
          <div style="color:var(--text-secondary);line-height:1.6;">
            您正在打开网页文件 <strong style="color:var(--gold);">${Utils.escapeHtml(name)}</strong>，请选择打开方式：
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;">
            <button class="os-btn primary" id="html-act-editor" style="height:64px;flex-direction:column;gap:4px;">
              <span style="font-weight:700;">编辑源代码 (含实时预览)</span>
              <span style="font-size:11px;opacity:0.85;">CodeMirror 内核 · 双栏分屏</span>
            </button>
            <button class="os-btn" id="html-act-browser" style="height:64px;flex-direction:column;gap:4px;border-color:var(--gold);">
              <span style="font-weight:700;">在系统浏览器中打开</span>
              <span style="font-size:11px;color:var(--text-secondary);">独立渲染完整网页</span>
            </button>
          </div>
        `;
        const backdrop = document.getElementById('modal-backdrop');
        box.querySelector('#html-act-editor').onclick = () => {
          backdrop.classList.remove('open');
          resolve('editor');
        };
        box.querySelector('#html-act-browser').onclick = () => {
          backdrop.classList.remove('open');
          resolve('browser');
        };
        Utils.showModal({
          title: 'HTML 网页交互选择',
          content: box,
          buttons: [{ label: '取消', value: null }]
        }).then(resolve);
      });
    },

    async promptAndExtractArchive(archivePath) {
      const parentDir = Utils.dirname(archivePath);
      const base = Utils.basename(archivePath).replace(/\.(tar\.gz|tgz|zip|gz|tar|7z|rar)$/i, '') || '解压输出';
      const defaultDest = Utils.joinPath(parentDir, base);
      const dest = await Utils.promptInput('解压压缩包', '请输入解压目标文件夹路径（将自动保留原始修改日期）：', defaultDest);
      if (!dest) return;
      try {
        Utils.toast(`正在解压 ${Utils.basename(archivePath)}...`, 'info');
        const count = await ArchiveEngine.extractArchive(archivePath, dest);
        Utils.toast(`解压完成，共提取 ${count} 个文件到 ${dest}`, 'success');
      } catch (err) {
        Utils.toast(`解压失败: ${err.message}`, 'error', 4500);
      }
    }
  };

  /* =========================================================================
     MODULE 10: 文件资源管理器 (FileExplorerApp)
     严格 Windows 详细信息视图（列左对齐不拉伸、右侧留白可框选、列宽可调、列序可调）
     树形导航窗格、面包屑、图标缩略图懒加载、分栏视图、全局搜索、本地挂载
     ========================================================================= */
  const FileExplorerApp = {
    clipboard: { mode: null, paths: [] }, // mode: 'copy' | 'cut'
    thumbCache: new Map(), // vfsPath -> objectURL

    open(initialPath = '/Desktop') {
      const winId = Utils.uid('explorer');
      const state = {
        currentPath: Utils.normalizePath(initialPath),
        history: [Utils.normalizePath(initialPath)],
        historyIndex: 0,
        viewMode: 'details', // 'details' | 'icons' | 'columns'
        sortBy: 'name',      // 'name' | 'mtime' | 'type' | 'size'
        sortAsc: true,
        selectedPaths: new Set(),
        searchQuery: '',
        globalSearch: false,
        searchResults: null,
        touchMarqueeMode: false,
        columns: [
          { key: 'name', label: '名称', width: 250 },
          { key: 'mtime', label: '修改日期', width: 175 },
          { key: 'type', label: '类型', width: 120 },
          { key: 'size', label: '大小', width: 105 }
        ],
        millerChain: [] // 分栏视图路径链
      };

      let marquee = null;
      let thumbObserver = null;
      let unsubLoading = null;
      let unsubFsChange = null;

      WindowManager.createWindow({
        id: winId,
        title: `文件资源管理器 - ${state.currentPath}`,
        icon: 'folder',
        width: 900,
        height: 580,
        onClose: () => {
          if (marquee) marquee.destroy();
          if (thumbObserver) thumbObserver.disconnect();
          if (unsubLoading) unsubLoading();
          if (unsubFsChange) unsubFsChange();
        },
        render: (bodyEl) => {
          bodyEl.innerHTML = `
            <div class="fe-container" tabindex="0">
              <div class="fe-toolbar">
                <button class="os-btn" data-act="back" title="后退">后退</button>
                <button class="os-btn" data-act="forward" title="前进">前进</button>
                <button class="os-btn" data-act="up" title="向上一级">向上</button>
                <button class="os-btn" data-act="refresh" title="刷新目录">刷新</button>
                <div class="taskbar-divider"></div>
                <button class="os-btn" data-act="new-folder">新建文件夹</button>
                <button class="os-btn" data-act="new-file">新建文件</button>
                <button class="os-btn" data-act="upload">导入文件</button>
                <button class="os-btn" data-act="mount-local" title="挂载电脑真实文件夹到 /mnt/local">挂载本地目录</button>
                <div class="taskbar-divider"></div>
                <select class="os-select" data-act="view-mode" title="切换视图">
                  <option value="details">详细信息视图</option>
                  <option value="icons">图标缩略图视图</option>
                  <option value="columns">分栏视图</option>
                </select>
                <button class="os-btn mobile-only-btn" data-act="toggle-marquee" title="移动端可点击开启随时框选模式">框选模式</button>
                <button class="os-btn" data-act="export-selected" title="将选中文件导出下载到本地">导出本地</button>
              </div>

              <div class="fe-nav-bar">
                <button class="os-btn" data-act="toggle-sidebar" style="padding:0 8px;">导航</button>
                <div class="fe-breadcrumbs" data-role="breadcrumbs" title="点击路径跳转，双击右侧空白输入路径"></div>
                <div style="display:flex;align-items:center;gap:5px;width:240px;max-width:42%;flex-shrink:0;">
                  <input type="text" class="os-input" data-role="search-input" placeholder="搜索当前目录..." style="height:30px;font-size:12px;" />
                  <button class="os-btn" data-act="toggle-global-search" style="height:30px;padding:0 8px;font-size:11.5px;" title="切换当前目录搜索 / 全局递归搜索">全局</button>
                </div>
              </div>

              <div class="fe-main">
                <aside class="fe-sidebar" data-role="sidebar"></aside>
                <div class="fe-content-wrap">
                  <div class="fe-loading-bar" data-role="loading-bar"></div>
                  <div class="fe-scroll-viewport" data-role="viewport"></div>
                </div>
              </div>

              <div class="fe-statusbar" data-role="statusbar">
                <span>就绪</span>
                <span>0 个项目</span>
              </div>
            </div>
          `;

          const root = bodyEl.querySelector('.fe-container');
          const sidebarEl = root.querySelector('[data-role="sidebar"]');
          const breadcrumbsEl = root.querySelector('[data-role="breadcrumbs"]');
          const viewportEl = root.querySelector('[data-role="viewport"]');
          const statusbarEl = root.querySelector('[data-role="statusbar"]');
          const loadingBarEl = root.querySelector('[data-role="loading-bar"]');
          const searchInput = root.querySelector('[data-role="search-input"]');
          const viewSelect = root.querySelector('[data-act="view-mode"]');
          const marqueeToggleBtn = root.querySelector('[data-act="toggle-marquee"]');
          const globalSearchBtn = root.querySelector('[data-act="toggle-global-search"]');

          unsubLoading = fs.onLoadingChange((active) => {
            loadingBarEl.classList.toggle('active', active);
          });

          unsubFsChange = fs.onChange((changedDir) => {
            if (
              changedDir === state.currentPath ||
              changedDir === '/mnt/local' ||
              changedDir === '/' ||
              state.viewMode === 'columns'
            ) {
              renderSidebar();
              loadCurrentDirectory(false);
            }
          });

          // 缩略图懒加载观察器：仅在图标视图且元素进入视口时加载图片二进制
          thumbObserver = new IntersectionObserver((entries) => {
            entries.forEach(async (obsEntry) => {
              if (!obsEntry.isIntersecting) return;
              const imgEl = obsEntry.target;
              thumbObserver.unobserve(imgEl);
              const p = imgEl.dataset.thumbPath;
              if (!p) return;
              try {
                let url = this.thumbCache.get(p);
                if (!url) {
                  const buf = await fs.readFile(p);
                  const blob = new Blob([buf], { type: Utils.getMimeType(p) });
                  url = URL.createObjectURL(blob);
                  this.thumbCache.set(p, url);
                }
                imgEl.src = url;
                imgEl.style.opacity = '1';
              } catch (_) {}
            });
          }, { root: viewportEl, rootMargin: '80px' });

          // 初始化高性能框选器
          marquee = new MarqueeSelector({
            container: viewportEl,
            itemSelector: '.fe-selectable-item',
            ignoreSelector: '.fe-details-header, .fe-col-resizer, input, button, select',
            forceTouchMarquee: () => state.touchMarqueeMode,
            onSelectionChange: (paths) => {
              state.selectedPaths = new Set(paths);
              updateStatusBar();
            }
          });

          // 视口作为拖拽放置目标（支持内部移动和外部物理文件/目录拖入）
          viewportEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
          });
          viewportEl.addEventListener('drop', async (e) => {
            if (e.target.closest('.drag-over-dir')) return;
            e.preventDefault();
            const res = await DragDropManager.handleDropIntoDirectory(e, state.currentPath);
            if (res && res.count > 0) {
              await loadCurrentDirectory(false);
            }
          });

          // 视口空白处右键菜单
          viewportEl.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.fe-selectable-item')) return;
            e.preventDefault();
            e.stopPropagation();
            showDirectoryContextMenu(e.clientX, e.clientY, state.currentPath);
          });

          // 键盘快捷键支持
          root.addEventListener('keydown', async (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
              e.preventDefault();
              viewportEl.querySelectorAll('.fe-selectable-item').forEach(el => {
                el.classList.add('selected');
                if (el.dataset.path) state.selectedPaths.add(el.dataset.path);
              });
              updateStatusBar();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
              e.preventDefault();
              if (state.selectedPaths.size > 0) {
                this.clipboard = { mode: 'copy', paths: Array.from(state.selectedPaths) };
                Utils.toast(`已复制 ${this.clipboard.paths.length} 项`, 'info');
              }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
              e.preventDefault();
              if (state.selectedPaths.size > 0) {
                this.clipboard = { mode: 'cut', paths: Array.from(state.selectedPaths) };
                Utils.toast(`已剪切 ${this.clipboard.paths.length} 项`, 'info');
              }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
              e.preventDefault();
              await pasteInto(state.currentPath);
            } else if (e.key === 'Delete') {
              e.preventDefault();
              await deleteSelected();
            } else if (e.key === 'F2' && state.selectedPaths.size === 1) {
              e.preventDefault();
              await renameItem(Array.from(state.selectedPaths)[0]);
            }
          });

          const navigateTo = async (targetPath, pushHistory = true) => {
            const norm = Utils.normalizePath(targetPath);
            state.currentPath = norm;
            state.searchQuery = '';
            state.searchResults = null;
            searchInput.value = '';
            state.selectedPaths.clear();

            if (pushHistory) {
              state.history = state.history.slice(0, state.historyIndex + 1);
              if (state.history[state.history.length - 1] !== norm) {
                state.history.push(norm);
                state.historyIndex = state.history.length - 1;
              }
            }

            // 构建分栏视图路径链
            const parts = norm === '/' ? [] : norm.split('/').filter(Boolean);
            state.millerChain = ['/'];
            let acc = '';
            for (const p of parts) {
              acc += '/' + p;
              state.millerChain.push(acc);
            }

            WindowManager.setWindowTitle(winId, `文件资源管理器 - ${norm}`);
            renderBreadcrumbs();
            renderSidebar();
            await loadCurrentDirectory(true);
          };

          const renderBreadcrumbs = () => {
            breadcrumbsEl.innerHTML = '';
            const parts = state.currentPath === '/' ? [] : state.currentPath.split('/').filter(Boolean);

            const addCrumb = (label, path, isLast) => {
              const span = document.createElement('span');
              span.className = `fe-crumb ${isLast ? 'current' : ''}`;
              span.textContent = label;
              span.onclick = (e) => {
                e.stopPropagation();
                navigateTo(path);
              };
              breadcrumbsEl.appendChild(span);
            };

            addCrumb('根目录 (/)', '/', parts.length === 0);
            let acc = '';
            parts.forEach((part, idx) => {
              acc += '/' + part;
              const sep = document.createElement('span');
              sep.textContent = '›';
              sep.style.color = 'var(--text-muted)';
              breadcrumbsEl.appendChild(sep);
              addCrumb(part, acc, idx === parts.length - 1);
            });
          };

          // 双击面包屑空白处直接输入路径
          breadcrumbsEl.addEventListener('dblclick', (e) => {
            if (e.target !== breadcrumbsEl) return;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'os-input';
            input.style.height = '24px';
            input.value = state.currentPath;
            breadcrumbsEl.innerHTML = '';
            breadcrumbsEl.appendChild(input);
            input.focus();
            input.select();

            const commit = () => {
              const val = input.value.trim();
              if (val) navigateTo(val);
              else renderBreadcrumbs();
            };
            input.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') commit();
              else if (ev.key === 'Escape') renderBreadcrumbs();
            });
            input.addEventListener('blur', renderBreadcrumbs);
          });

          const renderSidebar = () => {
            sidebarEl.innerHTML = '';
            const addGroup = (title, items) => {
              const header = document.createElement('div');
              header.className = 'fe-tree-group-title';
              header.textContent = title;
              sidebarEl.appendChild(header);

              items.forEach(item => {
                const el = document.createElement('div');
                el.className = `fe-tree-item ${state.currentPath === item.path ? 'active' : ''}`;
                el.dataset.path = item.path;
                el.innerHTML = `
                  <span style="display:flex;flex-shrink:0;">${SVGIcons.get(item.icon, 16)}</span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Utils.escapeHtml(item.label)}</span>
                `;
                el.onclick = () => {
                  navigateTo(item.path);
                  sidebarEl.classList.remove('mobile-open');
                };
                DragDropManager.bindFolderDropTarget(el, () => item.path, () => loadCurrentDirectory(false));
                sidebarEl.appendChild(el);
              });
            };

            addGroup('快捷访问', [
              { label: '桌面 (Desktop)', path: '/Desktop', icon: 'folder' },
              { label: '文房 (Documents)', path: '/Documents', icon: 'text' },
              { label: '画廊 (Pictures)', path: '/Pictures', icon: 'image' },
              { label: '行囊 (Downloads)', path: '/Downloads', icon: 'archive' }
            ]);

            const storageItems = [
              { label: `主空间 (${fs.primaryBackendId.toUpperCase()})`, path: '/', icon: 'drive' }
            ];
            if (window.OSConfig?.showDualBackends !== false) {
              if (fs.mounts.has('/mnt/opfs')) {
                storageItems.push({ label: '磐石存储 (OPFS)', path: '/mnt/opfs', icon: 'drive' });
              }
              if (fs.mounts.has('/mnt/idb')) {
                storageItems.push({ label: '灵枢存储 (IndexedDB)', path: '/mnt/idb', icon: 'drive' });
              }
            }
            addGroup('存储后端', storageItems);

            const localMounts = fs.getMountedLocalFolders();
            const mountItems = [
              { label: '全部本地挂载', path: '/mnt/local', icon: 'mount' },
              ...localMounts.map(m => ({ label: m.name, path: m.path, icon: 'folderOpen' }))
            ];
            addGroup('本地文件夹挂载', mountItems);
          };

          let currentEntries = [];

          const sortEntries = (entries) => {
            const list = [...entries];
            list.sort((a, b) => {
              // 文件夹始终优先排在前面
              if (a.type !== b.type) {
                return a.type === 'dir' ? -1 : 1;
              }
              let cmp = 0;
              if (state.sortBy === 'name') {
                cmp = Utils.naturalCompare(a.name, b.name);
              } else if (state.sortBy === 'mtime') {
                cmp = (a.mtime || 0) - (b.mtime || 0);
              } else if (state.sortBy === 'type') {
                cmp = Utils.naturalCompare(Utils.getFileTypeLabel(a), Utils.getFileTypeLabel(b));
              } else if (state.sortBy === 'size') {
                cmp = (a.size || 0) - (b.size || 0);
              }
              return state.sortAsc ? cmp : -cmp;
            });
            return list;
          };

          const updateStatusBar = () => {
            const total = currentEntries.length;
            const selCount = state.selectedPaths.size;
            let selBytes = 0;
            if (selCount > 0) {
              currentEntries.forEach(item => {
                if (state.selectedPaths.has(item.path)) selBytes += item.size || 0;
              });
            }
            const leftText = state.searchResults
              ? `搜索 "${state.searchQuery}" 找到 ${total} 项`
              : `共 ${total} 个项目` + (selCount > 0 ? ` · 已选中 ${selCount} 项 (${Utils.formatSize(selBytes)})` : '');
            const rightText = `当前后端: ${fs.resolveMount(state.currentPath).backend.label}`;
            statusbarEl.innerHTML = `<span>${Utils.escapeHtml(leftText)}</span><span>${Utils.escapeHtml(rightText)}</span>`;
          };

          const loadCurrentDirectory = async (clearSel = true) => {
            if (clearSel) state.selectedPaths.clear();
            try {
              let raw = [];
              if (state.searchResults !== null) {
                raw = state.searchResults;
              } else {
                raw = await fs.readdir(state.currentPath);
                if (state.searchQuery.trim()) {
                  const q = state.searchQuery.trim().toLowerCase();
                  raw = raw.filter(item => item.name.toLowerCase().includes(q));
                }
              }
              currentEntries = sortEntries(raw);
              renderViewport();
              updateStatusBar();
            } catch (err) {
              viewportEl.innerHTML = `
                <div style="padding:36px;text-align:center;color:var(--text-secondary);">
                  <div style="margin-bottom:10px;color:var(--cinnabar);font-weight:600;">无法读取目录: ${Utils.escapeHtml(err.message)}</div>
                  <button class="os-btn primary" id="fe-retry-btn">重试或重新授权</button>
                </div>
              `;
              const retryBtn = viewportEl.querySelector('#fe-retry-btn');
              if (retryBtn) retryBtn.onclick = () => loadCurrentDirectory(true);
            }
          };

          const attachItemInteractions = (el, entry) => {
            el.classList.add('fe-selectable-item');
            el.dataset.path = entry.path;
            el.dataset.type = entry.type;
            if (state.selectedPaths.has(entry.path)) {
              el.classList.add('selected');
            }

            el.addEventListener('click', (e) => {
              e.stopPropagation();
              if (e.ctrlKey || e.metaKey) {
                if (state.selectedPaths.has(entry.path)) {
                  state.selectedPaths.delete(entry.path);
                  el.classList.remove('selected');
                } else {
                  state.selectedPaths.add(entry.path);
                  el.classList.add('selected');
                }
                updateStatusBar();
                return;
              }

              // 默认单击打开（可在设置中改为双击打开）
              if (window.OSConfig?.singleClickOpen !== false) {
                openEntry(entry);
              } else {
                viewportEl.querySelectorAll('.fe-selectable-item').forEach(node => node.classList.remove('selected'));
                state.selectedPaths = new Set([entry.path]);
                el.classList.add('selected');
                updateStatusBar();
              }
            });

            el.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              if (window.OSConfig?.singleClickOpen === false) {
                openEntry(entry);
              }
            });

            el.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              e.stopPropagation();
              if (!state.selectedPaths.has(entry.path)) {
                viewportEl.querySelectorAll('.fe-selectable-item').forEach(node => node.classList.remove('selected'));
                state.selectedPaths = new Set([entry.path]);
                el.classList.add('selected');
                updateStatusBar();
              }
              showItemContextMenu(e.clientX, e.clientY, entry);
            });

            DragDropManager.bindDraggableElement(el, {
              getDragPaths: () => {
                if (state.selectedPaths.has(entry.path) && state.selectedPaths.size > 0) {
                  return Array.from(state.selectedPaths);
                }
                return [entry.path];
              },
              onClickSelect: () => {
                if (!state.selectedPaths.has(entry.path)) {
                  viewportEl.querySelectorAll('.fe-selectable-item').forEach(node => node.classList.remove('selected'));
                  state.selectedPaths = new Set([entry.path]);
                  el.classList.add('selected');
                }
              }
            });

            if (entry.type === 'dir') {
              DragDropManager.bindFolderDropTarget(el, () => entry.path, () => loadCurrentDirectory(false));
            }

            // 移动端触摸长按拖拽移动文件到文件夹（与桌面端 HTML5 draggable 完全互补零冲突）
            let touchTimer = null;
            let touchDragging = false;
            let touchGhost = null;
            let tStartX = 0;
            let tStartY = 0;
            let hoveredDropEl = null;

            el.addEventListener('touchstart', (e) => {
              if (e.touches.length !== 1) return;
              tStartX = e.touches[0].clientX;
              tStartY = e.touches[0].clientY;
              touchDragging = false;

              touchTimer = setTimeout(() => {
                touchDragging = true;
                if (!state.selectedPaths.has(entry.path)) {
                  viewportEl.querySelectorAll('.fe-selectable-item').forEach(node => node.classList.remove('selected'));
                  state.selectedPaths = new Set([entry.path]);
                  el.classList.add('selected');
                  updateStatusBar();
                }
                touchGhost = document.createElement('div');
                touchGhost.className = 'touch-drag-ghost';
                touchGhost.textContent = `移动 ${state.selectedPaths.size} 个项目`;
                touchGhost.style.left = `${tStartX}px`;
                touchGhost.style.top = `${tStartY}px`;
                document.body.appendChild(touchGhost);
              }, 340);
            }, { passive: true });

            el.addEventListener('touchmove', (e) => {
              if (!touchDragging) {
                const dx = e.touches[0].clientX - tStartX;
                const dy = e.touches[0].clientY - tStartY;
                if (Math.hypot(dx, dy) > 8) {
                  clearTimeout(touchTimer);
                }
                return;
              }
              e.preventDefault();
              const cx = e.touches[0].clientX;
              const cy = e.touches[0].clientY;
              if (touchGhost) {
                touchGhost.style.left = `${cx}px`;
                touchGhost.style.top = `${cy}px`;
              }
              const under = document.elementFromPoint(cx, cy);
              const folderEl = under ? under.closest('.fe-selectable-item[data-type="dir"], .fe-tree-item') : null;
              if (hoveredDropEl && hoveredDropEl !== folderEl) {
                hoveredDropEl.classList.remove('drag-over-dir');
              }
              hoveredDropEl = folderEl;
              if (hoveredDropEl && hoveredDropEl.dataset.path !== entry.path) {
                hoveredDropEl.classList.add('drag-over-dir');
              }
            }, { passive: false });

            const finishTouchDrag = async () => {
              clearTimeout(touchTimer);
              if (touchGhost) {
                touchGhost.remove();
                touchGhost = null;
              }
              if (hoveredDropEl) {
                hoveredDropEl.classList.remove('drag-over-dir');
              }
              if (touchDragging && hoveredDropEl) {
                const targetDir = hoveredDropEl.dataset.path;
                if (targetDir && targetDir !== entry.path) {
                  const moving = Array.from(state.selectedPaths);
                  for (const src of moving) {
                    if (src !== targetDir && !targetDir.startsWith(src + '/')) {
                      const dest = await DragDropManager.getUniqueDestPath(targetDir, Utils.basename(src));
                      await fs.rename(src, dest);
                    }
                  }
                  Utils.toast(`已移动 ${moving.length} 项到 ${Utils.basename(targetDir)}`, 'success');
                  await loadCurrentDirectory(true);
                }
              }
              hoveredDropEl = null;
              touchDragging = false;
            };

            el.addEventListener('touchend', finishTouchDrag);
            el.addEventListener('touchcancel', finishTouchDrag);
          };

          const openEntry = (entry) => {
            AppDispatcher.openPath(entry.path, {
              explorerNavigate: (dirPath) => navigateTo(dirPath)
            });
          };

          const renderViewport = () => {
            // 保留选框元素，仅更新内容区
            const box = marquee.boxEl;
            viewportEl.innerHTML = '';
            viewportEl.appendChild(box);

            if (state.viewMode === 'details') {
              renderDetailsView();
            } else if (state.viewMode === 'icons') {
              renderIconsView();
            } else if (state.viewMode === 'columns') {
              renderColumnsView();
            }
          };

          /**
           * 严格按 Windows 资源管理器详细信息视图正常逻辑渲染：
           * 1. 列顺序可调整，每列左对齐，列宽可拖拽
           * 2. 绝不把最后一列贴到最右边，右侧保留大片空白供框选
           * 3. 每行只占各列宽度之和，绝不用 width:100% 撑满
           */
          const renderDetailsView = () => {
            const table = document.createElement('div');
            table.className = 'fe-details-table';

            const header = document.createElement('div');
            header.className = 'fe-details-header';

            state.columns.forEach((col, colIdx) => {
              const hCell = document.createElement('div');
              hCell.className = 'fe-col-header';
              hCell.style.width = `${col.width}px`;
              hCell.draggable = true;

              const arrow = state.sortBy === col.key ? (state.sortAsc ? ' ▲' : ' ▼') : '';
              hCell.innerHTML = `<span>${col.label}${arrow}</span><div class="fe-col-resizer"></div>`;

              // 点击列头切换排序
              hCell.addEventListener('click', (e) => {
                if (e.target.classList.contains('fe-col-resizer')) return;
                if (state.sortBy === col.key) {
                  state.sortAsc = !state.sortAsc;
                } else {
                  state.sortBy = col.key;
                  state.sortAsc = true;
                }
                currentEntries = sortEntries(currentEntries);
                renderViewport();
              });

              // 列顺序拖拽调整
              hCell.addEventListener('dragstart', (e) => {
                e.stopPropagation();
                e.dataTransfer.setData('application/x-fe-col', String(colIdx));
              });
              hCell.addEventListener('dragover', (e) => {
                if (e.dataTransfer.types.includes('application/x-fe-col')) {
                  e.preventDefault();
                }
              });
              hCell.addEventListener('drop', (e) => {
                const fromIdxStr = e.dataTransfer.getData('application/x-fe-col');
                if (fromIdxStr !== '') {
                  e.preventDefault();
                  e.stopPropagation();
                  const fromIdx = Number(fromIdxStr);
                  if (fromIdx !== colIdx) {
                    const [movedCol] = state.columns.splice(fromIdx, 1);
                    state.columns.splice(colIdx, 0, movedCol);
                    renderViewport();
                  }
                }
              });

              // 列宽拖拽调整（支持 Mouse & Touch）
              const resizer = hCell.querySelector('.fe-col-resizer');
              const startColResize = (e) => {
                e.stopPropagation();
                e.preventDefault();
                const { x: startX } = Utils.getClientXY(e);
                const startW = col.width;

                const onMove = (ev) => {
                  const { x: cx } = Utils.getClientXY(ev);
                  const nextW = Math.max(65, Math.min(600, startW + (cx - startX)));
                  col.width = nextW;
                  hCell.style.width = `${nextW}px`;
                  table.querySelectorAll(`.fe-detail-cell[data-col="${col.key}"]`).forEach(cell => {
                    cell.style.width = `${nextW}px`;
                  });
                };

                const onEnd = () => {
                  document.removeEventListener('mousemove', onMove);
                  document.removeEventListener('mouseup', onEnd);
                  document.removeEventListener('touchmove', onMove);
                  document.removeEventListener('touchend', onEnd);
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
              };

              resizer.addEventListener('mousedown', startColResize);
              resizer.addEventListener('touchstart', startColResize, { passive: false });

              header.appendChild(hCell);
            });

            table.appendChild(header);

            const rowsWrap = document.createElement('div');
            rowsWrap.className = 'fe-details-rows';

            if (currentEntries.length === 0) {
              const empty = document.createElement('div');
              empty.style.padding = '32px 24px';
              empty.style.color = 'var(--text-muted)';
              empty.textContent = '此文件夹为空（可直接拖入本地文件，或右键新建文件/文件夹）';
              rowsWrap.appendChild(empty);
            } else {
              const use12h = window.OSConfig?.use12Hour !== false;
              currentEntries.forEach(entry => {
                const row = document.createElement('div');
                row.className = 'fe-detail-row';

                state.columns.forEach(col => {
                  const cell = document.createElement('div');
                  cell.className = 'fe-detail-cell';
                  cell.dataset.col = col.key;
                  cell.style.width = `${col.width}px`;

                  if (col.key === 'name') {
                    const iconHtml = entry.type === 'dir'
                      ? SVGIcons.get('folder', 18)
                      : SVGIcons.get(Utils.isImageExt(Utils.getExt(entry.name)) ? 'image' : 'fileGeneric', 18);
                    cell.innerHTML = `<span style="display:flex;flex-shrink:0;">${iconHtml}</span><span class="cell-text">${Utils.escapeHtml(entry.name)}</span>`;
                  } else if (col.key === 'mtime') {
                    cell.innerHTML = `<span class="cell-text" style="color:var(--text-secondary);">${Utils.formatDate(entry.mtime, use12h)}</span>`;
                  } else if (col.key === 'type') {
                    cell.innerHTML = `<span class="cell-text" style="color:var(--text-secondary);">${Utils.escapeHtml(Utils.getFileTypeLabel(entry))}</span>`;
                  } else if (col.key === 'size') {
                    cell.innerHTML = `<span class="cell-text" style="color:var(--text-secondary);font-family:var(--font-mono);font-size:12px;">${Utils.formatSize(entry.size)}</span>`;
                  }
                  row.appendChild(cell);
                });

                attachItemInteractions(row, entry);
                rowsWrap.appendChild(row);
              });
            }

            table.appendChild(rowsWrap);
            viewportEl.appendChild(table);
          };

          const renderIconsView = () => {
            const grid = document.createElement('div');
            grid.className = 'fe-grid-view';

            if (currentEntries.length === 0) {
              grid.innerHTML = `<div style="padding:32px;color:var(--text-muted);width:100%;">此文件夹为空</div>`;
            } else {
              currentEntries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'fe-grid-item';
                const ext = Utils.getExt(entry.name);
                const isImg = entry.type === 'file' && Utils.isImageExt(ext);

                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'fe-grid-thumb';
                if (isImg) {
                  const img = document.createElement('img');
                  img.dataset.thumbPath = entry.path;
                  img.alt = entry.name;
                  img.style.opacity = '0.2';
                  img.style.transition = 'opacity 0.2s ease';
                  thumbDiv.appendChild(img);
                  thumbObserver.observe(img);
                } else {
                  thumbDiv.innerHTML = SVGIcons.getFileIcon(entry);
                }

                const nameDiv = document.createElement('div');
                nameDiv.className = 'fe-grid-name';
                nameDiv.textContent = entry.name;

                card.appendChild(thumbDiv);
                card.appendChild(nameDiv);
                attachItemInteractions(card, entry);
                grid.appendChild(card);
              });
            }

            viewportEl.appendChild(grid);
          };

          const renderColumnsView = async () => {
            const wrap = document.createElement('div');
            wrap.className = 'fe-columns-view';
            viewportEl.appendChild(wrap);

            for (let i = 0; i < state.millerChain.length; i++) {
              const colDir = state.millerChain[i];
              const nextSelected = state.millerChain[i + 1] || null;
              const colEl = document.createElement('div');
              colEl.className = 'fe-miller-col';

              try {
                const list = sortEntries(await fs.readdir(colDir));
                list.forEach(item => {
                  const row = document.createElement('div');
                  row.className = `fe-miller-item ${nextSelected === item.path ? 'active' : ''}`;
                  row.innerHTML = `
                    <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                      <span style="display:flex;flex-shrink:0;">${SVGIcons.get(item.type === 'dir' ? 'folder' : 'fileGeneric', 15)}</span>
                      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Utils.escapeHtml(item.name)}</span>
                    </div>
                    ${item.type === 'dir' ? '<span style="color:var(--text-muted);font-size:11px;">›</span>' : ''}
                  `;
                  row.onclick = () => {
                    if (item.type === 'dir') {
                      navigateTo(item.path);
                    } else {
                      AppDispatcher.openPath(item.path);
                    }
                  };
                  colEl.appendChild(row);
                });
              } catch (_) {}

              wrap.appendChild(colEl);
            }
            wrap.scrollLeft = wrap.scrollWidth;
          };

          // 常用操作函数
          const createNewFolder = async () => {
            const name = await Utils.promptInput('新建文件夹', '请输入文件夹名称：', '新建文件夹');
            if (!name || !name.trim()) return;
            const target = await DragDropManager.getUniqueDestPath(state.currentPath, name.trim());
            await fs.mkdir(target, { recursive: true });
            await loadCurrentDirectory(false);
          };

          const createNewFile = async () => {
            const name = await Utils.promptInput('新建文本文档', '请输入文件名（支持 .txt / .html / .md / .csv / .js）：', '未命名文稿.txt');
            if (!name || !name.trim()) return;
            const target = await DragDropManager.getUniqueDestPath(state.currentPath, name.trim());
            await fs.writeFile(target, '', { mtime: Date.now() });
            await loadCurrentDirectory(false);
          };

          const renameItem = async (path) => {
            const oldName = Utils.basename(path);
            const newName = await Utils.promptInput('重命名', '请输入新的名称：', oldName);
            if (!newName || !newName.trim() || newName.trim() === oldName) return;
            const newPath = Utils.joinPath(Utils.dirname(path), newName.trim());
            await fs.rename(path, newPath);
            await loadCurrentDirectory(false);
          };

          const deleteSelected = async (explicitPaths = null) => {
            const targets = explicitPaths || Array.from(state.selectedPaths);
            if (targets.length === 0) return;
            const ok = await Utils.confirmDialog('确认删除', `确定要永久删除选中的 ${targets.length} 个项目吗？`, true);
            if (!ok) return;
            for (const p of targets) {
              await fs.remove(p);
            }
            state.selectedPaths.clear();
            await loadCurrentDirectory(true);
            Utils.toast(`已删除 ${targets.length} 项`, 'info');
          };

          const pasteInto = async (destDir) => {
            if (!this.clipboard.paths || this.clipboard.paths.length === 0) return;
            let count = 0;
            for (const src of this.clipboard.paths) {
              if (!(await fs.exists(src))) continue;
              const dest = await DragDropManager.getUniqueDestPath(destDir, Utils.basename(src));
              if (this.clipboard.mode === 'cut') {
                await fs.rename(src, dest);
              } else {
                await fs.copy(src, dest);
              }
              count++;
            }
            if (this.clipboard.mode === 'cut') {
