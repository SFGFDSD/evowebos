  /* =========================================================================
     MODULE 2: 中国古代山水壁画渲染引擎 (WallpaperEngine)
     ========================================================================= */
  const WallpaperEngine = {
    cache: new Map(),

    presets: [
      { id: 'qinglv', name: '千里江山 · 青绿重峦', seal: '千里江山' },
      { id: 'ink', name: '溪山行旅 · 水墨云岚', seal: '溪山行旅' },
      { id: 'dunhuang', name: '敦煌飞天 · 金碧丹霞', seal: '敦煌丹霞' },
      { id: 'moonlight', name: '寒江独钓 · 月夜松风', seal: '寒江松风' }
    ],

    generateMuralDataURL(presetId) {
      if (this.cache.has(presetId)) return this.cache.get(presetId);

      const w = 1920;
      const h = 1080;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      const palettes = {
        qinglv: {
          skyTop: '#0B161C',
          skyMid: '#132730',
          skyBot: '#1E3B42',
          sunColor: 'rgba(229, 189, 112, 0.28)',
          sunCore: '#E8C57B',
          layers: [
            { yBase: 0.44, amp: 150, freq: 0.0022, seed: 1.1, fillTop: '#1A3A44', fillBot: '#0F2229', ridge: 'rgba(212, 163, 73, 0.32)' },
            { yBase: 0.54, amp: 165, freq: 0.0028, seed: 2.7, fillTop: '#1F535C', fillBot: '#122C33', ridge: 'rgba(212, 163, 73, 0.48)' },
            { yBase: 0.65, amp: 145, freq: 0.0035, seed: 4.3, fillTop: '#266E68', fillBot: '#112A2B', ridge: 'rgba(229, 189, 112, 0.62)' },
            { yBase: 0.77, amp: 115, freq: 0.0044, seed: 6.1, fillTop: '#1C4B47', fillBot: '#0B181A', ridge: 'rgba(212, 163, 73, 0.52)' },
            { yBase: 0.88, amp: 70,  freq: 0.0055, seed: 8.4, fillTop: '#0E2124', fillBot: '#070E10', ridge: 'rgba(180, 140, 70, 0.35)' }
          ],
          mist: 'rgba(214, 228, 220, 0.09)'
        },
        ink: {
          skyTop: '#181C1E',
          skyMid: '#262C2E',
          skyBot: '#3A4244',
          sunColor: 'rgba(240, 234, 218, 0.22)',
          sunCore: '#EDE6D4',
          layers: [
            { yBase: 0.42, amp: 170, freq: 0.0020, seed: 3.1, fillTop: '#333B3D', fillBot: '#1E2325', ridge: 'rgba(235, 228, 212, 0.24)' },
            { yBase: 0.55, amp: 155, freq: 0.0029, seed: 5.4, fillTop: '#282F31', fillBot: '#161A1C', ridge: 'rgba(235, 228, 212, 0.30)' },
            { yBase: 0.68, amp: 135, freq: 0.0038, seed: 7.2, fillTop: '#1D2224', fillBot: '#101314', ridge: 'rgba(212, 163, 73, 0.25)' },
            { yBase: 0.82, amp: 95,  freq: 0.0048, seed: 9.8, fillTop: '#131718', fillBot: '#090B0C', ridge: 'rgba(200, 195, 180, 0.2)' }
          ],
          mist: 'rgba(238, 234, 224, 0.12)'
        },
        dunhuang: {
          skyTop: '#1D1211',
          skyMid: '#361E1A',
          skyBot: '#593024',
          sunColor: 'rgba(242, 178, 92, 0.34)',
          sunCore: '#F2B863',
          layers: [
            { yBase: 0.46, amp: 140, freq: 0.0023, seed: 2.2, fillTop: '#6B3829', fillBot: '#331A14', ridge: 'rgba(242, 195, 112, 0.45)' },
            { yBase: 0.58, amp: 150, freq: 0.0031, seed: 4.8, fillTop: '#8C4832', fillBot: '#3D1E16', ridge: 'rgba(242, 195, 112, 0.60)' },
            { yBase: 0.70, amp: 125, freq: 0.0039, seed: 6.9, fillTop: '#2E6B62', fillBot: '#183330', ridge: 'rgba(232, 185, 102, 0.55)' },
            { yBase: 0.84, amp: 85,  freq: 0.0050, seed: 9.1, fillTop: '#241410', fillBot: '#110907', ridge: 'rgba(212, 163, 73, 0.38)' }
          ],
          mist: 'rgba(245, 206, 148, 0.10)'
        },
        moonlight: {
          skyTop: '#070C14',
          skyMid: '#0E1929',
          skyBot: '#16283D',
          sunColor: 'rgba(210, 228, 245, 0.26)',
          sunCore: '#EAF2F8',
          layers: [
            { yBase: 0.48, amp: 135, freq: 0.0021, seed: 1.9, fillTop: '#192E45', fillBot: '#0D1926', ridge: 'rgba(195, 218, 240, 0.32)' },
            { yBase: 0.61, amp: 140, freq: 0.0029, seed: 3.8, fillTop: '#142638', fillBot: '#0A131D', ridge: 'rgba(195, 218, 240, 0.40)' },
            { yBase: 0.74, amp: 110, freq: 0.0038, seed: 5.7, fillTop: '#0E1B29', fillBot: '#070E16', ridge: 'rgba(212, 163, 73, 0.32)' },
            { yBase: 0.87, amp: 65,  freq: 0.0052, seed: 8.0, fillTop: '#081018', fillBot: '#04080C', ridge: 'rgba(160, 185, 210, 0.25)' }
          ],
          mist: 'rgba(185, 212, 235, 0.09)'
        }
      };

      const p = palettes[presetId] || palettes.qinglv;

      // 1. 天幕渐变
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, p.skyTop);
      skyGrad.addColorStop(0.55, p.skyMid);
      skyGrad.addColorStop(1, p.skyBot);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. 日月光晕
      const sunX = w * 0.74;
      const sunY = h * 0.24;
      const halo = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 320);
      halo.addColorStop(0, p.sunColor);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 320, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = p.sunCore;
      ctx.globalAlpha = 0.82;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // 3. 多层谐波山峦与金边描线 + 云海留白
      p.layers.forEach((layer, idx) => {
        ctx.beginPath();
        ctx.moveTo(0, h);
        const pts = [];
        for (let x = 0; x <= w; x += 8) {
          const n1 = Math.sin(x * layer.freq + layer.seed) * layer.amp;
          const n2 = Math.sin(x * layer.freq * 2.3 + layer.seed * 1.7) * (layer.amp * 0.42);
          const n3 = Math.cos(x * layer.freq * 4.7 + layer.seed * 0.6) * (layer.amp * 0.16);
          const y = h * layer.yBase - Math.abs(n1 + n2 * 0.6) + n3;
          pts.push([x, y]);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.closePath();

        const mGrad = ctx.createLinearGradient(0, h * (layer.yBase - 0.25), 0, h);
        mGrad.addColorStop(0, layer.fillTop);
        mGrad.addColorStop(1, layer.fillBot);
        ctx.fillStyle = mGrad;
        ctx.fill();

        // 矿物金线勾勒山脊
        ctx.beginPath();
        pts.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
        ctx.strokeStyle = layer.ridge;
        ctx.lineWidth = 2.2;
        ctx.stroke();

        // 山腰云雾留白带
        if (idx < p.layers.length - 1) {
          const mistY = h * (layer.yBase + 0.06);
          const mistGrad = ctx.createLinearGradient(0, mistY - 55, 0, mistY + 65);
          mistGrad.addColorStop(0, 'rgba(0,0,0,0)');
          mistGrad.addColorStop(0.5, p.mist);
          mistGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = mistGrad;
          ctx.fillRect(0, mistY - 55, w, 120);
        }
      });

      // 4. 远飞孤雁剪影
      ctx.strokeStyle = 'rgba(235, 225, 200, 0.45)';
      ctx.lineWidth = 2;
      const birds = [[w * 0.56, h * 0.28, 12], [w * 0.59, h * 0.26, 9], [w * 0.615, h * 0.295, 8]];
      birds.forEach(([bx, by, bs]) => {
        ctx.beginPath();
        ctx.moveTo(bx - bs, by + bs * 0.35);
        ctx.quadraticCurveTo(bx - bs * 0.4, by - bs * 0.35, bx, by);
        ctx.quadraticCurveTo(bx + bs * 0.4, by - bs * 0.35, bx + bs, by + bs * 0.35);
        ctx.stroke();
      });

      // 5. 右上角朱砂闲章落款
      const sealMeta = this.presets.find(item => item.id === presetId) || this.presets[0];
      const sx = w - 126;
      const sy = 64;
      ctx.save();
      ctx.fillStyle = 'rgba(217, 78, 65, 0.84)';
      ctx.strokeStyle = 'rgba(245, 223, 181, 0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(sx, sy, 48, 92, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#FDF6EA';
      ctx.font = 'bold 18px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      const chars = sealMeta.seal.split('');
      chars.forEach((ch, idx) => {
        ctx.fillText(ch, sx + 24, sy + 24 + idx * 20);
      });
      ctx.restore();

      const dataURL = canvas.toDataURL('image/jpeg', 0.9);
      this.cache.set(presetId, dataURL);
      return dataURL;
    },

    /**
     * 同步生成一张真实的青绿山水样例画作 PNG Blob（用于初始化桌面样例文件）
     */
    async generateSamplePaintingBlob() {
      const dataUrl = this.generateMuralDataURL('qinglv');
      const res = await fetch(dataUrl);
      return await res.blob();
    }
  };

  /* =========================================================================
     MODULE 3: 通用核心工具集 (Utils)
     ========================================================================= */
  const Utils = {
    uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    },

    /**
     * 自然数字排序比较器：确保 1.jpg -> 2.jpg -> 10.jpg 顺序严格正确
     */
    naturalCompare(a, b) {
      const strA = String(a || '');
      const strB = String(b || '');
      const re = /(\d+)|(\D+)/g;
      const tokensA = strA.match(re) || [];
      const tokensB = strB.match(re) || [];
      const len = Math.min(tokensA.length, tokensB.length);

      for (let i = 0; i < len; i++) {
        const tA = tokensA[i];
        const tB = tokensB[i];
        const numA = Number(tA);
        const numB = Number(tB);
        if (!Number.isNaN(numA) && !Number.isNaN(numB)) {
          if (numA !== numB) return numA - numB;
          if (tA.length !== tB.length) return tA.length - tB.length;
        } else {
          const cmp = tA.localeCompare(tB, 'zh-CN', { sensitivity: 'base' });
          if (cmp !== 0) return cmp;
        }
      }
      return tokensA.length - tokensB.length;
    },

    normalizePath(p) {
      if (!p) return '/';
      let clean = String(p).replace(/\\/g, '/').replace(/\/+/g, '/');
      if (!clean.startsWith('/')) clean = '/' + clean;
      if (clean.length > 1 && clean.endsWith('/')) clean = clean.slice(0, -1);
      return clean;
    },

    dirname(p) {
      const norm = this.normalizePath(p);
      if (norm === '/') return '/';
      const idx = norm.lastIndexOf('/');
      return idx <= 0 ? '/' : norm.slice(0, idx);
    },

    basename(p) {
      const norm = this.normalizePath(p);
      if (norm === '/') return '/';
      const idx = norm.lastIndexOf('/');
      return norm.slice(idx + 1);
    },

    joinPath(...parts) {
      return this.normalizePath(parts.join('/'));
    },

    getExt(filename) {
      const base = this.basename(filename);
      const idx = base.lastIndexOf('.');
      if (idx <= 0) return '';
      return base.slice(idx + 1).toLowerCase();
    },

    isImageExt(ext) {
      return ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'ico', 'avif'].includes(String(ext).toLowerCase());
    },

    isAudioExt(ext) {
      return ['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a', 'opus'].includes(String(ext).toLowerCase());
    },

    isVideoExt(ext) {
      return ['mp4', 'webm', 'ogv', 'mkv', 'mov'].includes(String(ext).toLowerCase());
    },

    isArchiveExt(ext) {
      const low = String(ext).toLowerCase();
      return ['zip', 'gz', 'tar', 'tgz', '7z', 'rar'].includes(low);
    },

    isTarGzName(name) {
      const low = String(name).toLowerCase();
      return low.endsWith('.tar.gz') || low.endsWith('.tgz');
    },

    isTextOrCodeExt(ext) {
      return [
        'txt', 'html', 'htm', 'css', 'js', 'mjs', 'cjs', 'ts', 'tsx', 'jsx',
        'json', 'xml', 'svg', 'md', 'markdown', 'yaml', 'yml', 'log', 'ini',
        'conf', 'sh', 'bash', 'py', 'java', 'c', 'cpp', 'h', 'rs', 'go', 'sql', 'csv', 'tsv'
      ].includes(String(ext).toLowerCase());
    },

    getMimeType(filename) {
      const ext = this.getExt(filename);
      const mimes = {
        html: 'text/html;charset=utf-8',
        htm: 'text/html;charset=utf-8',
        css: 'text/css;charset=utf-8',
        js: 'application/javascript;charset=utf-8',
        mjs: 'application/javascript;charset=utf-8',
        json: 'application/json;charset=utf-8',
        xml: 'application/xml;charset=utf-8',
        svg: 'image/svg+xml',
        txt: 'text/plain;charset=utf-8',
        md: 'text/markdown;charset=utf-8',
        csv: 'text/csv;charset=utf-8',
        tsv: 'text/tab-separated-values;charset=utf-8',
        png: 'image/png',
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        gif: 'image/gif',
        webp: 'image/webp',
        bmp: 'image/bmp',
        ico: 'image/x-icon',
        avif: 'image/avif',
        mp3: 'audio/mpeg',
        wav: 'audio/wav',
        ogg: 'audio/ogg',
        flac: 'audio/flac',
        aac: 'audio/aac',
        mp4: 'video/mp4',
        webm: 'video/webm',
        ogv: 'video/ogg',
        pdf: 'application/pdf',
        zip: 'application/zip',
        gz: 'application/gzip',
        tar: 'application/x-tar',
        '7z': 'application/x-7z-compressed'
      };
      return mimes[ext] || 'application/octet-stream';
    },

    getFileTypeLabel(entry) {
      if (entry.type === 'dir') return '文件夹';
      const ext = this.getExt(entry.name);
      if (!ext) return '文件';
      const labels = {
        png: 'PNG 图像', jpg: 'JPEG 图像', jpeg: 'JPEG 图像', gif: 'GIF 动图',
        webp: 'WebP 图像', svg: 'SVG 矢量图', bmp: 'BMP 位图', ico: '图标文件',
        html: 'HTML 网页', htm: 'HTML 网页', css: 'CSS 样式表', js: 'JavaScript 脚本',
        json: 'JSON 数据', md: 'Markdown 文档', txt: '文本文档', xml: 'XML 文档',
        csv: 'CSV 逗号分隔表', tsv: 'TSV 制表符表', pdf: 'PDF 典籍文档',
        mp3: 'MP3 音频', wav: 'WAV 音频', ogg: 'OGG 音频', flac: 'FLAC 无损音频',
        mp4: 'MP4 视频', webm: 'WebM 视频', zip: 'ZIP 压缩包', gz: 'GZIP 压缩包',
        tar: 'TAR 归档包', tgz: 'TGZ 压缩包', '7z': '7Z 压缩包', iso: 'ISO 光盘镜像',
        img: '磁盘镜像', fda: '软盘镜像', bin: '二进制镜像'
      };
      return labels[ext] || `${ext.toUpperCase()} 文件`;
    },

    formatSize(bytes) {
      if (bytes === undefined || bytes === null || Number.isNaN(bytes)) return '0 B';
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      const val = bytes / Math.pow(1024, i);
      return `${i === 0 ? val : val.toFixed(val >= 100 ? 0 : 1)} ${units[i]}`;
    },

    formatDate(ms, use12Hour = true) {
      if (!ms) return '-';
      const d = new Date(ms);
      if (Number.isNaN(d.getTime())) return '-';
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      let hr = d.getHours();
      if (use12Hour) {
        const period = hr < 12 ? '上午' : '下午';
        hr = hr % 12 || 12;
        return `${yyyy}/${mm}/${dd} ${period} ${String(hr).padStart(2, '0')}:${min}`;
      }
      return `${yyyy}/${mm}/${dd} ${String(hr).padStart(2, '0')}:${min}`;
    },

    getClientXY(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      if (e.changedTouches && e.changedTouches.length > 0) {
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    },

    debounce(fn, delay = 250) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    },

    escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    },

    toast(message, type = 'info', duration = 3200) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `os-toast ${type}`;
      el.innerHTML = `
        <span style="flex-shrink:0;display:flex;">${SVGIcons.get(type === 'error' ? 'winClose' : 'seal', 18)}</span>
        <span style="flex:1;word-break:break-word;">${this.escapeHtml(message)}</span>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, duration);
    },

    /**
     * 统一样式模态弹窗（替代原生 prompt/confirm/alert）
     */
    showModal({ title = '提示', content = '', buttons = [] }) {
      return new Promise((resolve) => {
        const backdrop = document.getElementById('modal-backdrop');
        const titleEl = document.getElementById('modal-title');
        const bodyEl = document.getElementById('modal-body');
        const footerEl = document.getElementById('modal-footer');
        const closeX = document.getElementById('modal-close-x');

        titleEl.textContent = title;
        bodyEl.innerHTML = '';
        if (typeof content === 'string') {
          bodyEl.innerHTML = content;
        } else if (content instanceof HTMLElement) {
          bodyEl.appendChild(content);
        }

        footerEl.innerHTML = '';
        const cleanup = (val) => {
          backdrop.classList.remove('open');
          closeX.onclick = null;
          backdrop.onclick = null;
          resolve(val);
        };

        closeX.innerHTML = SVGIcons.get('winClose', 14);
        closeX.onclick = () => cleanup(null);
        backdrop.onclick = (e) => {
          if (e.target === backdrop) cleanup(null);
        };

        if (buttons.length === 0) {
          buttons = [{ label: '确定', primary: true, value: true }];
        }

        buttons.forEach((btnCfg) => {
          const btn = document.createElement('button');
          btn.className = `os-btn ${btnCfg.primary ? 'primary' : ''} ${btnCfg.danger ? 'danger' : ''}`;
          btn.textContent = btnCfg.label;
          btn.onclick = () => {
            if (btnCfg.onClick) {
              const res = btnCfg.onClick();
              if (res === false) return;
              cleanup(res !== undefined ? res : btnCfg.value);
            } else {
              cleanup(btnCfg.value);
            }
          };
          footerEl.appendChild(btn);
        });

        backdrop.classList.add('open');
        const firstInput = bodyEl.querySelector('input, select, textarea');
        if (firstInput) setTimeout(() => firstInput.focus(), 30);
      });
    },

    async promptInput(title, label, defaultValue = '') {
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.gap = '8px';
      wrap.innerHTML = `<label style="font-size:13px;color:var(--text-secondary);">${this.escapeHtml(label)}</label>`;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'os-input';
      input.value = defaultValue;
      wrap.appendChild(input);

      return new Promise((resolve) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            document.getElementById('modal-backdrop').classList.remove('open');
            resolve(input.value);
          } else if (e.key === 'Escape') {
            document.getElementById('modal-backdrop').classList.remove('open');
            resolve(null);
          }
        });

        this.showModal({
          title,
          content: wrap,
          buttons: [
            { label: '取消', value: null },
            { label: '确定', primary: true, onClick: () => input.value }
          ]
        }).then(resolve);
      });
    },

    async confirmDialog(title, message, danger = false) {
      const p = document.createElement('div');
      p.style.lineHeight = '1.6';
      p.textContent = message;
      const res = await this.showModal({
        title,
        content: p,
        buttons: [
          { label: '取消', value: false },
          { label: '确认', primary: !danger, danger, value: true }
        ]
      });
      return Boolean(res);
    },

    triggerBrowserDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 5000);
    },

    dynamicLoadScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          if (existing.dataset.loaded === '1') return resolve();
          existing.addEventListener('load', () => resolve());
          existing.addEventListener('error', reject);
          return;
        }
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = () => {
          s.dataset.loaded = '1';
          resolve();
        };
        s.onerror = () => reject(new Error(`脚本加载失败: ${src}`));
        document.head.appendChild(s);
      });
    }
  };

  /* =========================================================================
     MODULE 4: 统一虚拟文件系统 (VFS: OPFS + IndexedDB + File System Access API)
     严禁任何 isLocal 分支，所有后端实现完全一致的标准接口并严格保留 mtime
     ========================================================================= */

  /**
   * 统一参数解析辅助：兼容 (path, cb) / (path, opts, cb) / Promise 调用
   */
  function normalizeCallbackArgs(args, defaultOpt = {}) {
    const arr = Array.from(args);
    let cb = null;
    if (arr.length > 0 && typeof arr[arr.length - 1] === 'function') {
      cb = arr.pop();
    }
    const opt = arr.length > 0 ? arr[0] : defaultOpt;
    return { opt, cb };
  }

  function wrapAsyncMethod(asyncFn) {
    return function (...args) {
      const last = args[args.length - 1];
      if (typeof last === 'function') {
        const cb = args.pop();
        asyncFn.apply(this, args).then(
          (res) => cb(null, res),
          (err) => cb(err)
        );
        return;
      }
      return asyncFn.apply(this, args);
    };
  }

  function toUint8Array(data) {
    if (data instanceof Uint8Array) return data;
    if (data instanceof ArrayBuffer) return new Uint8Array(data);
    if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
    if (typeof data === 'string') return new TextEncoder().encode(data);
    return new Uint8Array(0);
  }

  async function dataToBuffer(data) {
    if (data instanceof Blob) return await data.arrayBuffer();
    if (data instanceof ArrayBuffer) return data;
    if (ArrayBuffer.isView(data)) return data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
    if (typeof data === 'string') return new TextEncoder().encode(data).buffer;
    return new ArrayBuffer(0);
  }

  /**
   * 后端 1: 原生 OPFS (Origin Private File System) 后端
   * 结合根目录高速元数据索引 (.danqing_vfs_meta.json) 精确保留 mtime 与计算目录真实大小
   */
  class OPFSBackend {
    constructor() {
      this.id = 'opfs';
      this.label = '磐石存储 (OPFS)';
      this.rootHandle = null;
      this.metaFileName = '.danqing_vfs_meta.json';
      this.metaMap = new Map(); // relPath -> { type, mtime, ctime, size }
      this.initialized = false;
      this.saveTimer = null;
    }

    async init() {
      if (this.initialized) return true;
      if (!navigator.storage || !navigator.storage.getDirectory) {
        throw new Error('当前浏览器环境不支持 OPFS');
      }
      this.rootHandle = await navigator.storage.getDirectory();
      this.metaMap.set('/', { type: 'dir', mtime: Date.now(), ctime: Date.now(), size: 0 });
      await this._loadMeta();
      await this._syncTreeFromDisk(this.rootHandle, '/');
      this.initialized = true;
      return true;
    }

    async _loadMeta() {
      try {
        const fh = await this.rootHandle.getFileHandle(this.metaFileName);
        const file = await fh.getFile();
        const text = await file.text();
        const obj = JSON.parse(text);
        if (obj && typeof obj === 'object') {
          for (const [k, v] of Object.entries(obj)) {
            this.metaMap.set(Utils.normalizePath(k), v);
          }
        }
      } catch (_) {
        // 首次初始化尚无元数据文件
      }
    }

    _scheduleSaveMeta() {
      clearTimeout(this.saveTimer);
      this.saveTimer = setTimeout(() => this.flushMeta(), 120);
    }

    async flushMeta() {
      if (!this.rootHandle) return;
      try {
        const obj = {};
        for (const [k, v] of this.metaMap.entries()) {
          obj[k] = v;
        }
        const fh = await this.rootHandle.getFileHandle(this.metaFileName, { create: true });
        const writable = await fh.createWritable();
        await writable.write(JSON.stringify(obj));
        await writable.close();
      } catch (e) {
        console.warn('[OPFSBackend] 元数据刷盘警告:', e);
      }
    }

    async _syncTreeFromDisk(dirHandle, basePath) {
      const seen = new Set([this.metaFileName]);
      for await (const [name, handle] of dirHandle.entries()) {
        if (basePath === '/' && name === this.metaFileName) continue;
        seen.add(name);
        const full = Utils.joinPath(basePath, name);
        const existing = this.metaMap.get(full);
        if (handle.kind === 'directory') {
          if (!existing || existing.type !== 'dir') {
            const now = Date.now();
            this.metaMap.set(full, { type: 'dir', mtime: now, ctime: now, size: 0 });
          }
          await this._syncTreeFromDisk(handle, full);
        } else {
          const file = await handle.getFile();
          if (!existing || existing.type !== 'file') {
            this.metaMap.set(full, {
              type: 'file',
              mtime: file.lastModified || Date.now(),
              ctime: file.lastModified || Date.now(),
              size: file.size
            });
          } else {
            existing.size = file.size;
          }
        }
      }
    }

    async _getDirHandle(relPath, create = false) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') return this.rootHandle;
      const parts = norm.split('/').filter(Boolean);
      let curr = this.rootHandle;
      let acc = '';
      for (const part of parts) {
        acc += '/' + part;
        curr = await curr.getDirectoryHandle(part, { create });
        if (create && !this.metaMap.has(acc)) {
          const now = Date.now();
          this.metaMap.set(acc, { type: 'dir', mtime: now, ctime: now, size: 0 });
        }
      }
      return curr;
    }

    async _getParentAndName(relPath, createParents = false) {
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') throw new Error('根目录无父目录');
      const parentPath = Utils.dirname(norm);
      const name = Utils.basename(norm);
      const parentHandle = await this._getDirHandle(parentPath, createParents);
      return { parentHandle, parentPath, name, norm };
    }

    _calcDirSize(dirPath) {
      const prefix = dirPath === '/' ? '/' : dirPath + '/';
      let total = 0;
      for (const [p, meta] of this.metaMap.entries()) {
        if (meta.type === 'file' && (dirPath === '/' || p.startsWith(prefix))) {
          total += meta.size || 0;
        }
      }
      return total;
    }

    async _statAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') {
        const m = this.metaMap.get('/') || { type: 'dir', mtime: Date.now(), ctime: Date.now() };
        return {
          name: '/',
          path: '/',
          type: 'dir',
          size: this._calcDirSize('/'),
          mtime: m.mtime,
          ctime: m.ctime,
          isFile: () => false,
          isDirectory: () => true
        };
      }

      const { parentHandle, name } = await this._getParentAndName(norm, false);
      try {
        await parentHandle.getDirectoryHandle(name);
        const m = this.metaMap.get(norm) || { type: 'dir', mtime: Date.now(), ctime: Date.now() };
        return {
          name,
          path: norm,
          type: 'dir',
          size: this._calcDirSize(norm),
          mtime: m.mtime,
          ctime: m.ctime,
          isFile: () => false,
          isDirectory: () => true
        };
      } catch (_) {
        const fh = await parentHandle.getFileHandle(name);
        const file = await fh.getFile();
        let m = this.metaMap.get(norm);
        if (!m) {
          m = { type: 'file', mtime: file.lastModified || Date.now(), ctime: file.lastModified || Date.now(), size: file.size };
          this.metaMap.set(norm, m);
          this._scheduleSaveMeta();
        } else {
          m.size = file.size;
        }
        return {
          name,
          path: norm,
          type: 'file',
          size: file.size,
          mtime: m.mtime,
          ctime: m.ctime,
          isFile: () => true,
          isDirectory: () => false
        };
      }
    }

    async _readdirAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const dirHandle = await this._getDirHandle(norm, false);
      const items = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (norm === '/' && name === this.metaFileName) continue;
        const childPath = Utils.joinPath(norm, name);
        if (handle.kind === 'directory') {
          let m = this.metaMap.get(childPath);
          if (!m) {
            m = { type: 'dir', mtime: Date.now(), ctime: Date.now(), size: 0 };
            this.metaMap.set(childPath, m);
          }
          items.push({
            name,
            path: childPath,
            type: 'dir',
            size: this._calcDirSize(childPath),
            mtime: m.mtime,
            ctime: m.ctime
          });
        } else {
          const file = await handle.getFile();
          let m = this.metaMap.get(childPath);
          if (!m) {
            m = { type: 'file', mtime: file.lastModified || Date.now(), ctime: file.lastModified || Date.now(), size: file.size };
            this.metaMap.set(childPath, m);
          } else {
            m.size = file.size;
          }
          items.push({
            name,
            path: childPath,
            type: 'file',
            size: file.size,
            mtime: m.mtime,
            ctime: m.ctime
          });
        }
      }
      this._scheduleSaveMeta();
      return items;
    }

    async _readFileAsync(relPath, options = {}) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, name } = await this._getParentAndName(norm, false);
      const fh = await parentHandle.getFileHandle(name);
      const file = await fh.getFile();
      const encoding = typeof options === 'string' ? options : options?.encoding;
      if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
        return await file.text();
      }
      if (encoding === 'blob') {
        return file;
      }
      return await file.arrayBuffer();
    }

    async _writeFileAsync(relPath, data, options = {}) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, parentPath, name } = await this._getParentAndName(norm, true);
      const buf = await dataToBuffer(data);
      const fh = await parentHandle.getFileHandle(name, { create: true });
      const writable = await fh.createWritable();
      await writable.write(buf);
      await writable.close();

      const prev = this.metaMap.get(norm);
      const now = Date.now();
      const mtime = (options && typeof options === 'object' && options.mtime !== undefined) ? Number(options.mtime) : now;
      const ctime = (options && typeof options === 'object' && options.ctime !== undefined)
        ? Number(options.ctime)
        : (prev ? prev.ctime : mtime);

      this.metaMap.set(norm, {
        type: 'file',
        mtime,
        ctime,
        size: buf.byteLength
      });
      await this.flushMeta();
      return true;
    }

    async _mkdirAsync(relPath, options = {}) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') return true;
      const recursive = typeof options === 'object' ? (options.recursive !== false) : true;
      const mtime = (options && typeof options === 'object' && options.mtime !== undefined) ? Number(options.mtime) : Date.now();

      if (recursive) {
        const parts = norm.split('/').filter(Boolean);
        let curr = this.rootHandle;
        let acc = '';
        for (let i = 0; i < parts.length; i++) {
          acc += '/' + parts[i];
          curr = await curr.getDirectoryHandle(parts[i], { create: true });
          if (!this.metaMap.has(acc)) {
            this.metaMap.set(acc, { type: 'dir', mtime, ctime: mtime, size: 0 });
          }
        }
      } else {
        const { parentHandle, name } = await this._getParentAndName(norm, false);
        await parentHandle.getDirectoryHandle(name, { create: true });
        if (!this.metaMap.has(norm)) {
          this.metaMap.set(norm, { type: 'dir', mtime, ctime: mtime, size: 0 });
        }
      }
      await this.flushMeta();
      return true;
    }

    async _unlinkAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, name } = await this._getParentAndName(norm, false);
      await parentHandle.removeEntry(name, { recursive: false });
      this.metaMap.delete(norm);
      await this.flushMeta();
      return true;
    }

    async _rmdirAsync(relPath, options = { recursive: true }) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') throw new Error('禁止删除根目录');
      const { parentHandle, name } = await this._getParentAndName(norm, false);
      const recursive = options?.recursive !== false;
      await parentHandle.removeEntry(name, { recursive });
      const prefix = norm + '/';
      for (const k of Array.from(this.metaMap.keys())) {
        if (k === norm || k.startsWith(prefix)) {
          this.metaMap.delete(k);
        }
      }
      await this.flushMeta();
      return true;
    }

    async _renameAsync(oldRelPath, newRelPath) {
      await this.init();
      const oldNorm = Utils.normalizePath(oldRelPath);
      const newNorm = Utils.normalizePath(newRelPath);
      if (oldNorm === newNorm) return true;
      if (newNorm.startsWith(oldNorm + '/')) throw new Error('不能将目录移动到其自身子目录中');

      const st = await this._statAsync(oldNorm);
      if (st.type === 'file') {
        const buf = await this._readFileAsync(oldNorm);
        await this._writeFileAsync(newNorm, buf, { mtime: st.mtime, ctime: st.ctime });
        await this._unlinkAsync(oldNorm);
      } else {
        await this._mkdirAsync(newNorm, { recursive: true, mtime: st.mtime });
        const children = await this._readdirAsync(oldNorm);
        for (const child of children) {
          await this._renameAsync(child.path, Utils.joinPath(newNorm, child.name));
        }
        await this._rmdirAsync(oldNorm, { recursive: true });
      }
      await this.flushMeta();
      return true;
    }

    async _existsAsync(relPath) {
      try {
        await this._statAsync(relPath);
        return true;
      } catch (_) {
        return false;
      }
    }

    async _utimesAsync(relPath, atime, mtime) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const st = await this._statAsync(norm);
      const m = this.metaMap.get(norm) || { type: st.type, size: st.size, ctime: st.ctime };
      m.mtime = Number(mtime);
      this.metaMap.set(norm, m);
      await this.flushMeta();
      return true;
    }

    async getUsageStats() {
      await this.init();
      let usedBytes = 0;
      let fileCount = 0;
      let dirCount = 0;
      const byCategory = { image: 0, media: 0, code: 0, archive: 0, other: 0 };

      for (const [p, meta] of this.metaMap.entries()) {
        if (p === '/') continue;
        if (meta.type === 'dir') {
          dirCount++;
        } else {
          fileCount++;
          const sz = meta.size || 0;
          usedBytes += sz;
          const ext = Utils.getExt(p);
          if (Utils.isImageExt(ext)) byCategory.image += sz;
          else if (Utils.isAudioExt(ext) || Utils.isVideoExt(ext)) byCategory.media += sz;
          else if (Utils.isTextOrCodeExt(ext)) byCategory.code += sz;
          else if (Utils.isArchiveExt(ext)) byCategory.archive += sz;
          else byCategory.other += sz;
        }
      }
      return { usedBytes, fileCount, dirCount, byCategory };
    }

    async clearAll() {
      await this.init();
      for await (const [name] of this.rootHandle.entries()) {
        await this.rootHandle.removeEntry(name, { recursive: true });
      }
      this.metaMap.clear();
      this.metaMap.set('/', { type: 'dir', mtime: Date.now(), ctime: Date.now(), size: 0 });
      await this.flushMeta();
    }
  }

  /**
   * 后端 2: IndexedDB 持久化存储后端 (灵枢存储)
   * 同时作为 OPFS 不可用时的健壮降级方案，以及独立的第二存储空间
   */
  class IndexedDBBackend {
    constructor(dbName = 'DanqingWebOS_IDB_V1') {
      this.id = 'idb';
      this.label = '灵枢存储 (IndexedDB)';
      this.dbName = dbName;
      this.storeName = 'vfs_nodes';
      this.db = null;
    }

    async init() {
      if (this.db) return this.db;
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(this.dbName, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(this.storeName)) {
            const store = db.createObjectStore(this.storeName, { keyPath: 'path' });
            store.createIndex('parent', 'parent', { unique: false });
          }
        };
        req.onsuccess = async (e) => {
          this.db = e.target.result;
          const root = await this._getNode('/');
          if (!root) {
            const now = Date.now();
            await this._putNode({ path: '/', parent: null, name: '/', type: 'dir', mtime: now, ctime: now, size: 0, buffer: null });
          }
          resolve(this.db);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async _getNode(path) {
      await this.init();
      const norm = Utils.normalizePath(path);
      return new Promise((resolve, reject) => {
        const tx = this.db.transaction(this.storeName, 'readonly');
        const req = tx.objectStore(this.storeName).get(norm);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async _putNode(node) {
      await this.init();
      return new Promise((resolve, reject) => {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        const req = tx.objectStore(this.storeName).put(node);
        req.onsuccess = () => resolve(true);
        req.onerror = () => reject(req.error);
      });
    }

    async _deleteNode(path) {
      await this.init();
      const norm = Utils.normalizePath(path);
      return new Promise((resolve, reject) => {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        const req = tx.objectStore(this.storeName).delete(norm);
        req.onsuccess = () => resolve(true);
        req.onerror = () => reject(req.error);
      });
    }

    async _getAllNodes() {
      await this.init();
      return new Promise((resolve, reject) => {
        const tx = this.db.transaction(this.storeName, 'readonly');
        const req = tx.objectStore(this.storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async _calcDirSize(dirPath) {
      const all = await this._getAllNodes();
      const prefix = dirPath === '/' ? '/' : dirPath + '/';
      let sum = 0;
      for (const n of all) {
        if (n.type === 'file' && (dirPath === '/' || n.path.startsWith(prefix))) {
          sum += n.size || 0;
        }
      }
      return sum;
    }

    async _statAsync(relPath) {
      const norm = Utils.normalizePath(relPath);
      const node = await this._getNode(norm);
      if (!node) throw new Error(`ENOENT: 找不到路径 ${norm}`);
      const size = node.type === 'dir' ? await this._calcDirSize(norm) : (node.size || 0);
      return {
        name: node.name,
        path: node.path,
        type: node.type,
        size,
        mtime: node.mtime,
        ctime: node.ctime,
        isFile: () => node.type === 'file',
        isDirectory: () => node.type === 'dir'
      };
    }

    async _readdirAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const dirNode = await this._getNode(norm);
      if (!dirNode || dirNode.type !== 'dir') throw new Error(`ENOTDIR: 非目录 ${norm}`);

      const all = await this._getAllNodes();
      const children = all.filter(n => n.parent === norm);
      const results = [];
      for (const c of children) {
        let sz = c.size || 0;
        if (c.type === 'dir') {
          const prefix = c.path === '/' ? '/' : c.path + '/';
          sz = all.reduce((acc, item) => (item.type === 'file' && item.path.startsWith(prefix) ? acc + (item.size || 0) : acc), 0);
        }
        results.push({
          name: c.name,
          path: c.path,
          type: c.type,
          size: sz,
          mtime: c.mtime,
          ctime: c.ctime
        });
      }
      return results;
    }

    async _readFileAsync(relPath, options = {}) {
      const norm = Utils.normalizePath(relPath);
      const node = await this._getNode(norm);
      if (!node || node.type !== 'file') throw new Error(`ENOENT: 文件不存在 ${norm}`);
      const buf = node.buffer || new ArrayBuffer(0);
      const encoding = typeof options === 'string' ? options : options?.encoding;
      if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
        return new TextDecoder().decode(buf);
      }
      if (encoding === 'blob') {
        return new Blob([buf], { type: Utils.getMimeType(node.name) });
      }
      return buf.slice(0);
    }

    async _writeFileAsync(relPath, data, options = {}) {
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') throw new Error('不能覆盖根目录');
      const parentPath = Utils.dirname(norm);
      await this._mkdirAsync(parentPath, { recursive: true });

      const buf = await dataToBuffer(data);
      const prev = await this._getNode(norm);
      const now = Date.now();
      const mtime = (options && typeof options === 'object' && options.mtime !== undefined) ? Number(options.mtime) : now;
      const ctime = (options && typeof options === 'object' && options.ctime !== undefined)
        ? Number(options.ctime)
        : (prev ? prev.ctime : mtime);

      await this._putNode({
        path: norm,
        parent: parentPath,
        name: Utils.basename(norm),
        type: 'file',
        mtime,
        ctime,
        size: buf.byteLength,
        buffer: buf
      });
      return true;
    }

    async _mkdirAsync(relPath, options = {}) {
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') return true;
      const parts = norm.split('/').filter(Boolean);
      const mtime = (options && typeof options === 'object' && options.mtime !== undefined) ? Number(options.mtime) : Date.now();
      let acc = '';
      for (const part of parts) {
        const parent = acc || '/';
        acc += '/' + part;
        const existing = await this._getNode(acc);
        if (!existing) {
          await this._putNode({
            path: acc,
            parent,
            name: part,
            type: 'dir',
            mtime,
            ctime: mtime,
            size: 0,
            buffer: null
          });
        }
      }
      return true;
    }

    async _unlinkAsync(relPath) {
      const norm = Utils.normalizePath(relPath);
      await this._deleteNode(norm);
      return true;
    }

    async _rmdirAsync(relPath) {
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') throw new Error('禁止删除根目录');
      const all = await this._getAllNodes();
      const prefix = norm + '/';
      for (const n of all) {
        if (n.path === norm || n.path.startsWith(prefix)) {
          await this._deleteNode(n.path);
        }
      }
      return true;
    }

    async _renameAsync(oldRelPath, newRelPath) {
      const oldNorm = Utils.normalizePath(oldRelPath);
      const newNorm = Utils.normalizePath(newRelPath);
      if (oldNorm === newNorm) return true;
      if (newNorm.startsWith(oldNorm + '/')) throw new Error('不能将目录移动到自身内部');

      const st = await this._statAsync(oldNorm);
      if (st.type === 'file') {
        const buf = await this._readFileAsync(oldNorm);
        await this._writeFileAsync(newNorm, buf, { mtime: st.mtime, ctime: st.ctime });
        await this._unlinkAsync(oldNorm);
      } else {
        await this._mkdirAsync(newNorm, { recursive: true, mtime: st.mtime });
        const children = await this._readdirAsync(oldNorm);
        for (const c of children) {
          await this._renameAsync(c.path, Utils.joinPath(newNorm, c.name));
        }
        await this._rmdirAsync(oldNorm);
      }
      return true;
    }

    async _existsAsync(relPath) {
      const n = await this._getNode(relPath);
      return Boolean(n);
    }

    async _utimesAsync(relPath, atime, mtime) {
      const norm = Utils.normalizePath(relPath);
      const n = await this._getNode(norm);
      if (!n) throw new Error(`ENOENT: ${norm}`);
      n.mtime = Number(mtime);
      await this._putNode(n);
      return true;
    }

    async getUsageStats() {
      const all = await this._getAllNodes();
      let usedBytes = 0;
      let fileCount = 0;
      let dirCount = 0;
      const byCategory = { image: 0, media: 0, code: 0, archive: 0, other: 0 };

      for (const n of all) {
        if (n.path === '/') continue;
        if (n.type === 'dir') {
          dirCount++;
        } else {
          fileCount++;
          const sz = n.size || 0;
          usedBytes += sz;
          const ext = Utils.getExt(n.name);
          if (Utils.isImageExt(ext)) byCategory.image += sz;
          else if (Utils.isAudioExt(ext) || Utils.isVideoExt(ext)) byCategory.media += sz;
          else if (Utils.isTextOrCodeExt(ext)) byCategory.code += sz;
          else if (Utils.isArchiveExt(ext)) byCategory.archive += sz;
          else byCategory.other += sz;
        }
      }
      return { usedBytes, fileCount, dirCount, byCategory };
    }

    async clearAll() {
      await this.init();
      return new Promise((resolve, reject) => {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        const store = tx.objectStore(this.storeName);
        const req = store.clear();
        req.onsuccess = async () => {
          const now = Date.now();
          await this._putNode({ path: '/', parent: null, name: '/', type: 'dir', mtime: now, ctime: now, size: 0, buffer: null });
          resolve(true);
        };
        req.onerror = () => reject(req.error);
      });
    }
  }

  /**
   * 后端 3: File System Access API 本地文件夹统一包装后端 (LocalFSBackend)
   * 对上层完全透明，接口与 OPFSBackend / IndexedDBBackend 100% 对等，严禁上层出现任何特殊判断
   */
  class LocalFSBackend {
    constructor(dirHandle, mountName) {
      this.id = `local_${mountName}`;
      this.label = mountName;
      this.rootHandle = dirHandle;
      this.mtimeOverrides = new Map(); // 保留移动/写入时的精确 mtime
      this.dirSizeCache = new Map();
    }

    async init() {
      if (!this.rootHandle) throw new Error('无效的本地文件夹句柄');
      const perm = await this.rootHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        const req = await this.rootHandle.requestPermission({ mode: 'readwrite' });
        if (req !== 'granted') throw new Error('未获得本地文件夹读写权限');
      }
      return true;
    }

    async _resolveDir(relPath, create = false) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') return this.rootHandle;
      const parts = norm.split('/').filter(Boolean);
      let curr = this.rootHandle;
      for (const p of parts) {
        curr = await curr.getDirectoryHandle(p, { create });
      }
      return curr;
    }

    async _resolveParent(relPath, createParents = false) {
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') throw new Error('根目录无父目录');
      const parentPath = Utils.dirname(norm);
      const name = Utils.basename(norm);
      const parentHandle = await this._resolveDir(parentPath, createParents);
      return { parentHandle, parentPath, name, norm };
    }

    async _calcRecursiveDirSize(dirHandle) {
      let total = 0;
      try {
        for await (const [, handle] of dirHandle.entries()) {
          if (handle.kind === 'file') {
            const f = await handle.getFile();
            total += f.size;
          } else {
            total += await this._calcRecursiveDirSize(handle);
          }
        }
      } catch (_) {}
      return total;
    }

    async _statAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      if (norm === '/') {
        const sz = await this._calcRecursiveDirSize(this.rootHandle);
        return {
          name: this.label,
          path: '/',
          type: 'dir',
          size: sz,
          mtime: Date.now(),
          ctime: Date.now(),
          isFile: () => false,
          isDirectory: () => true
        };
      }
      const { parentHandle, name } = await this._resolveParent(norm, false);
      try {
        const dh = await parentHandle.getDirectoryHandle(name);
        const sz = await this._calcRecursiveDirSize(dh);
        const mtime = this.mtimeOverrides.get(norm) || Date.now();
        return {
          name,
          path: norm,
          type: 'dir',
          size: sz,
          mtime,
          ctime: mtime,
          isFile: () => false,
          isDirectory: () => true
        };
      } catch (_) {
        const fh = await parentHandle.getFileHandle(name);
        const file = await fh.getFile();
        const mtime = this.mtimeOverrides.get(norm) || file.lastModified || Date.now();
        return {
          name,
          path: norm,
          type: 'file',
          size: file.size,
          mtime,
          ctime: file.lastModified || mtime,
          isFile: () => true,
          isDirectory: () => false
        };
      }
    }

    async _readdirAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const dirHandle = await this._resolveDir(norm, false);
      const entries = [];
      for await (const [name, handle] of dirHandle.entries()) {
        const childPath = Utils.joinPath(norm, name);
        if (handle.kind === 'directory') {
          const sz = await this._calcRecursiveDirSize(handle);
          const mtime = this.mtimeOverrides.get(childPath) || Date.now();
          entries.push({
            name,
            path: childPath,
            type: 'dir',
            size: sz,
            mtime,
            ctime: mtime
          });
        } else {
          const file = await handle.getFile();
          const mtime = this.mtimeOverrides.get(childPath) || file.lastModified || Date.now();
          entries.push({
            name,
            path: childPath,
            type: 'file',
            size: file.size,
            mtime,
            ctime: file.lastModified || mtime
          });
        }
      }
      return entries;
    }

    async _readFileAsync(relPath, options = {}) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, name } = await this._resolveParent(norm, false);
      const fh = await parentHandle.getFileHandle(name);
      const file = await fh.getFile();
      const encoding = typeof options === 'string' ? options : options?.encoding;
      if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
        return await file.text();
      }
      if (encoding === 'blob') {
        return file;
      }
      return await file.arrayBuffer();
    }

    async _writeFileAsync(relPath, data, options = {}) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, name } = await this._resolveParent(norm, true);
      const buf = await dataToBuffer(data);
      const fh = await parentHandle.getFileHandle(name, { create: true });
      const writable = await fh.createWritable();
      await writable.write(buf);
      await writable.close();

      if (options && typeof options === 'object' && options.mtime !== undefined) {
        this.mtimeOverrides.set(norm, Number(options.mtime));
      } else {
        const f = await fh.getFile();
        this.mtimeOverrides.set(norm, f.lastModified || Date.now());
      }
      return true;
    }

    async _mkdirAsync(relPath, options = {}) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      await this._resolveDir(norm, true);
      if (options && typeof options === 'object' && options.mtime !== undefined) {
        this.mtimeOverrides.set(norm, Number(options.mtime));
      }
      return true;
    }

    async _unlinkAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, name } = await this._resolveParent(norm, false);
      await parentHandle.removeEntry(name, { recursive: false });
      this.mtimeOverrides.delete(norm);
      return true;
    }

    async _rmdirAsync(relPath) {
      await this.init();
      const norm = Utils.normalizePath(relPath);
      const { parentHandle, name } = await this._resolveParent(norm, false);
      await parentHandle.removeEntry(name, { recursive: true });
      this.mtimeOverrides.delete(norm);
      return true;
    }

    async _renameAsync(oldRelPath, newRelPath) {
      await this.init();
      const oldNorm = Utils.normalizePath(oldRelPath);
      const newNorm = Utils.normalizePath(newRelPath);
      if (oldNorm === newNorm) return true;

      const st = await this._statAsync(oldNorm);
      if (st.type === 'file') {
        const { parentHandle: oldParent, name: oldName } = await this._resolveParent(oldNorm, false);
        const fh = await oldParent.getFileHandle(oldName);
        if (typeof fh.move === 'function') {
          const { parentHandle: newParent, name: newName } = await this._resolveParent(newNorm, true);
          await fh.move(newParent, newName);
          this.mtimeOverrides.set(newNorm, st.mtime);
          this.mtimeOverrides.delete(oldNorm);
          return true;
        }
        const buf = await this._readFileAsync(oldNorm);
        await this._writeFileAsync(newNorm, buf, { mtime: st.mtime, ctime: st.ctime });
        await this._unlinkAsync(oldNorm);
      } else {
        await this._mkdirAsync(newNorm, { recursive: true, mtime: st.mtime });
        const children = await this._readdirAsync(oldNorm);
        for (const c of children) {
          await this._renameAsync(c.path, Utils.joinPath(newNorm, c.name));
        }
        await this._rmdirAsync(oldNorm);
      }
      return true;
    }

    async _existsAsync(relPath) {
      try {
        await this._statAsync(relPath);
        return true;
      } catch (_) {
        return false;
      }
    }

    async _utimesAsync(relPath, atime, mtime) {
      const norm = Utils.normalizePath(relPath);
      this.mtimeOverrides.set(norm, Number(mtime));
      return true;
    }
  }

  /**
   * 统一虚拟文件系统路由器 (VirtualFileSystem)
   * 统一管理主根目录 (OPFS/IDB)、独立双存储视图 (/mnt/opfs, /mnt/idb) 及本地挂载 (/mnt/local/*)
   * 严格保证任何路径操作接口完全统一，跨挂载点操作完整保留 mtime
   */
  class VirtualFileSystem {
    constructor() {
      this.opfsBackend = new OPFSBackend();
      this.idbBackend = new IndexedDBBackend();
      this.primaryBackendId = 'opfs';
      this.mounts = new Map(); // mountPoint -> backendInstance
      this.localHandleStoreDB = 'DanqingWebOS_LocalHandles';
      this.loadingCount = 0;
      this.loadingListeners = new Set();
      this.changeListeners = new Set();

      // 绑定兼容 Promise 与 Node 回调的所有标准方法
      this.stat = wrapAsyncMethod(this._stat.bind(this));
      this.lstat = wrapAsyncMethod(this._stat.bind(this));
      this.readdir = wrapAsyncMethod(this._readdir.bind(this));
      this.readFile = wrapAsyncMethod(this._readFile.bind(this));
      this.writeFile = wrapAsyncMethod(this._writeFile.bind(this));
      this.mkdir = wrapAsyncMethod(this._mkdir.bind(this));
      this.rmdir = wrapAsyncMethod(this._rmdir.bind(this));
      this.unlink = wrapAsyncMethod(this._unlink.bind(this));
      this.rename = wrapAsyncMethod(this._rename.bind(this));
      this.copy = wrapAsyncMethod(this._copy.bind(this));
      this.exists = wrapAsyncMethod(this._exists.bind(this));
      this.utimes = wrapAsyncMethod(this._utimes.bind(this));
      this.open = wrapAsyncMethod(this._open.bind(this));
    }

    onLoadingChange(fn) {
      this.loadingListeners.add(fn);
      return () => this.loadingListeners.delete(fn);
    }

    onChange(fn) {
      this.changeListeners.add(fn);
      return () => this.changeListeners.delete(fn);
    }

    _notifyChange(path) {
      for (const fn of this.changeListeners) {
        try { fn(path); } catch (_) {}
      }
    }

    async _withLoading(path, fn) {
      this.loadingCount++;
      for (const fnListener of this.loadingListeners) {
        try { fnListener(true, path); } catch (_) {}
      }
      try {
        return await fn();
      } finally {
        this.loadingCount = Math.max(0, this.loadingCount - 1);
        if (this.loadingCount === 0) {
          for (const fnListener of this.loadingListeners) {
            try { fnListener(false, path); } catch (_) {}
          }
        }
      }
    }

    async init(preferredBackend = 'opfs') {
      let opfsOk = false;
      try {
        await this.opfsBackend.init();
        opfsOk = true;
      } catch (e) {
        console.warn('[VFS] OPFS 不可用，降级为 IndexedDB:', e);
      }
      await this.idbBackend.init();

      if (preferredBackend === 'opfs' && opfsOk) {
        this.primaryBackendId = 'opfs';
      } else {
        this.primaryBackendId = 'idb';
      }

      this._rebuildBaseMounts(opfsOk);
      await this._ensureDefaultDirectories();
      return { primary: this.primaryBackendId, opfsSupported: opfsOk };
    }

    _rebuildBaseMounts(opfsOk = true) {
      // 保留已有的 /mnt/local/* 挂载
      const localMounts = [];
      for (const [mp, bk] of this.mounts.entries()) {
        if (mp.startsWith('/mnt/local/')) {
          localMounts.push([mp, bk]);
        }
      }
      this.mounts.clear();
      const primary = this.primaryBackendId === 'opfs' ? this.opfsBackend : this.idbBackend;
      this.mounts.set('/', primary);
      if (opfsOk) {
        this.mounts.set('/mnt/opfs', this.opfsBackend);
      }
      this.mounts.set('/mnt/idb', this.idbBackend);
      for (const [mp, bk] of localMounts) {
        this.mounts.set(mp, bk);
      }
    }

    async switchPrimaryBackend(backendId) {
      if (backendId === 'opfs') {
        await this.opfsBackend.init();
        this.primaryBackendId = 'opfs';
      } else {
        await this.idbBackend.init();
        this.primaryBackendId = 'idb';
      }
      this._rebuildBaseMounts(true);
      await this._ensureDefaultDirectories();
      this._notifyChange('/');
    }

    /**
     * 最长前缀匹配挂载点路由：对所有后端完全一视同仁，无任何类型判断分支
     */
    resolveMount(fullPath) {
      const norm = Utils.normalizePath(fullPath);
      let bestMount = '/';
      let bestBackend = this.mounts.get('/');

      for (const [mountPoint, backend] of this.mounts.entries()) {
        if (mountPoint === '/') continue;
        if (norm === mountPoint || norm.startsWith(mountPoint + '/')) {
          if (mountPoint.length > bestMount.length) {
            bestMount = mountPoint;
            bestBackend = backend;
          }
        }
      }

      let relPath = norm === bestMount ? '/' : norm.slice(bestMount.length);
      if (!relPath.startsWith('/')) relPath = '/' + relPath;
      return { mountPoint: bestMount, backend: bestBackend, relPath, fullPath: norm };
    }

    /**
     * 判断是否为虚拟挂载容器目录本身（如 /mnt 或 /mnt/local）
     */
    _getVirtualMountSubentries(normPath) {
      const subs = new Map();
      const prefix = normPath === '/' ? '/' : normPath + '/';
      for (const [mp, bk] of this.mounts.entries()) {
        if (mp === '/' || mp === normPath) continue;
        if (mp.startsWith(prefix)) {
          const rest = mp.slice(prefix.length);
          const firstSeg = rest.split('/')[0];
          if (firstSeg) {
            const subFull = Utils.joinPath(normPath, firstSeg);
            if (!subs.has(subFull)) {
              subs.set(subFull, {
                name: firstSeg,
                path: subFull,
                type: 'dir',
                size: 0,
                mtime: Date.now(),
                ctime: Date.now()
              });
            }
          }
        }
      }
      return Array.from(subs.values());
    }

    async _stat(path, isLstat) {
      const norm = Utils.normalizePath(path);
      if (norm === '/mnt' || norm === '/mnt/local') {
        return {
          name: Utils.basename(norm),
          path: norm,
          type: 'dir',
          size: 0,
          mtime: Date.now(),
          ctime: Date.now(),
          isFile: () => false,
          isDirectory: () => true
        };
      }
      const { mountPoint, backend, relPath } = this.resolveMount(norm);
      return await this._withLoading(norm, async () => {
        const st = await backend._statAsync(relPath);
        return {
          ...st,
          name: norm === mountPoint && mountPoint !== '/' ? Utils.basename(mountPoint) : st.name,
          path: norm
        };
      });
    }

    async _readdir(path) {
      const norm = Utils.normalizePath(path);
      if (norm === '/mnt' || norm === '/mnt/local') {
        return this._getVirtualMountSubentries(norm);
      }
      const { mountPoint, backend, relPath } = this.resolveMount(norm);
      return await this._withLoading(norm, async () => {
        const list = await backend._readdirAsync(relPath);
        const mapped = list.map(item => ({
          ...item,
          path: mountPoint === '/' ? item.path : Utils.joinPath(mountPoint, item.path)
        }));
        if (norm === '/') {
          // 根目录下不强行混入 /mnt，/mnt 作为虚拟挂载点保留在侧边栏及路径访问中
          return mapped.filter(item => item.name !== 'mnt');
        }
        return mapped;
      });
    }

    async _readFile(path, options) {
      const { backend, relPath, fullPath } = this.resolveMount(path);
      return await this._withLoading(fullPath, () => backend._readFileAsync(relPath, options));
    }

    async _writeFile(path, data, options) {
      const { backend, relPath, fullPath } = this.resolveMount(path);
      const res = await this._withLoading(fullPath, () => backend._writeFileAsync(relPath, data, options));
      this._notifyChange(Utils.dirname(fullPath));
      return res;
    }

    async _mkdir(path, options) {
      const norm = Utils.normalizePath(path);
      if (norm === '/mnt' || norm === '/mnt/local') return true;
      const { backend, relPath, fullPath } = this.resolveMount(norm);
      const res = await this._withLoading(fullPath, () => backend._mkdirAsync(relPath, options));
      this._notifyChange(Utils.dirname(fullPath));
      return res;
    }

    async _unlink(path) {
      const { backend, relPath, fullPath } = this.resolveMount(path);
      const res = await this._withLoading(fullPath, () => backend._unlinkAsync(relPath));
      this._notifyChange(Utils.dirname(fullPath));
      return res;
    }

    async _rmdir(path, options) {
      const { backend, relPath, fullPath } = this.resolveMount(path);
      const res = await this._withLoading(fullPath, () => backend._rmdirAsync(relPath, options));
      this._notifyChange(Utils.dirname(fullPath));
      return res;
    }

    async remove(path) {
      const st = await this._stat(path);
      if (st.type === 'dir') {
        return await this._rmdir(path, { recursive: true });
      }
      return await this._unlink(path);
    }

    async _rename(oldPath, newPath) {
      const src = this.resolveMount(oldPath);
      const dst = this.resolveMount(newPath);
      if (src.fullPath === dst.fullPath) return true;

      return await this._withLoading(dst.fullPath, async () => {
        if (src.backend === dst.backend) {
          await src.backend._renameAsync(src.relPath, dst.relPath);
        } else {
          // 跨挂载点移动：完整保留 mtime
          await this._copy(src.fullPath, dst.fullPath);
          await this.remove(src.fullPath);
        }
        this._notifyChange(Utils.dirname(src.fullPath));
        this._notifyChange(Utils.dirname(dst.fullPath));
        return true;
      });
    }

    async _copy(srcPath, dstPath) {
      const srcNorm = Utils.normalizePath(srcPath);
      const dstNorm = Utils.normalizePath(dstPath);
      if (srcNorm === dstNorm) return true;
      if (dstNorm.startsWith(srcNorm + '/')) throw new Error('不能复制到自身子目录中');

      const st = await this._stat(srcNorm);
      if (st.type === 'file') {
        const buf = await this._readFile(srcNorm);
        await this._writeFile(dstNorm, buf, { mtime: st.mtime, ctime: st.ctime });
      } else {
        await this._mkdir(dstNorm, { recursive: true, mtime: st.mtime });
        const children = await this._readdir(srcNorm);
        for (const c of children) {
          await this._copy(c.path, Utils.joinPath(dstNorm, c.name));
        }
      }
      this._notifyChange(Utils.dirname(dstNorm));
      return true;
    }

    async _exists(path) {
      const norm = Utils.normalizePath(path);
      if (norm === '/' || norm === '/mnt' || norm === '/mnt/local') return true;
      if (this.mounts.has(norm)) return true;
      const { backend, relPath } = this.resolveMount(norm);
      return await backend._existsAsync(relPath);
    }

    async _utimes(path, atime, mtime) {
      const { backend, relPath, fullPath } = this.resolveMount(path);
      const res = await backend._utimesAsync(relPath, atime, mtime);
      this._notifyChange(Utils.dirname(fullPath));
      return res;
    }

    async _open(path, flags = 'r') {
      const exists = await this._exists(path);
      if (!exists && String(flags).includes('w')) {
        await this._writeFile(path, new ArrayBuffer(0));
      }
      return { path: Utils.normalizePath(path), flags };
    }

    /**
     * 递归搜索文件/目录
     */
    async search(rootPath, query, maxResults = 150) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return [];
      const results = [];
      const visited = new Set();

      const walk = async (dir) => {
        if (results.length >= maxResults || visited.has(dir)) return;
        visited.add(dir);
        let items = [];
        try {
          items = await this._readdir(dir);
        } catch (_) {
          return;
        }
        for (const item of items) {
          if (results.length >= maxResults) break;
          if (item.name.toLowerCase().includes(q)) {
            results.push(item);
          }
          if (item.type === 'dir') {
            await walk(item.path);
          }
        }
      };

      await walk(Utils.normalizePath(rootPath));
      return results;
    }

    /**
     * 挂载电脑真实本地文件夹 (File System Access API)
     */
    async mountLocalFolder() {
      if (!window.showDirectoryPicker) {
        throw new Error('当前浏览器不支持 File System Access API (showDirectoryPicker)');
      }
      const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      let mountName = dirHandle.name || '本地文件夹';
      let mountPath = `/mnt/local/${mountName}`;
      let suffix = 2;
      while (this.mounts.has(mountPath) && this.mounts.get(mountPath).rootHandle !== dirHandle) {
        mountPath = `/mnt/local/${mountName}_${suffix++}`;
      }

      const backend = new LocalFSBackend(dirHandle, Utils.basename(mountPath));
      await backend.init();
      this.mounts.set(mountPath, backend);
      await this._saveLocalMountHandle(mountPath, dirHandle);
      this._notifyChange('/mnt/local');
      return mountPath;
    }

    async unmountLocalFolder(mountPath) {
      const norm = Utils.normalizePath(mountPath);
      if (this.mounts.has(norm) && norm.startsWith('/mnt/local/')) {
        this.mounts.delete(norm);
        await this._removeLocalMountHandle(norm);
        this._notifyChange('/mnt/local');
        return true;
      }
      return false;
    }

    getMountedLocalFolders() {
      const list = [];
      for (const [mp, bk] of this.mounts.entries()) {
        if (mp.startsWith('/mnt/local/')) {
          list.push({ path: mp, name: bk.label });
        }
      }
      return list;
    }

    async _openHandleDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(this.localHandleStoreDB, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('handles')) {
            db.createObjectStore('handles', { keyPath: 'path' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async _saveLocalMountHandle(path, handle) {
      try {
        const db = await this._openHandleDB();
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put({ path, name: handle.name, handle });
        this._syncMountNamesToStorage();
      } catch (_) {}
    }

    async _removeLocalMountHandle(path) {
      try {
        const db = await this._openHandleDB();
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').delete(path);
        this._syncMountNamesToStorage();
      } catch (_) {}
    }

    _syncMountNamesToStorage() {
      const names = this.getMountedLocalFolders().map(x => x.path);
      try {
        localStorage.setItem('danqing_saved_local_mounts', JSON.stringify(names));
      } catch (_) {}
    }

    async getSavedLocalMountRecords() {
      try {
        const db = await this._openHandleDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (_) {
        return [];
      }
    }

    async reconnectSavedMount(record) {
      const perm = await record.handle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') throw new Error('用户未授予文件夹读写权限');
      const backend = new LocalFSBackend(record.handle, Utils.basename(record.path));
      await backend.init();
      this.mounts.set(record.path, backend);
      this._notifyChange('/mnt/local');
      return record.path;
    }

  /* =========================================================================
     MODULE 5: 压缩与解压引擎 (ArchiveEngine)
     1. JSZip 完整修复 DOS 本地时间与 UTC 时区偏差，压缩解压均保留原始 mtime
     2. 原生浏览器 DecompressionStream('gzip') + POSIX USTAR TAR 解析器
     3. 按需动态加载 7z-wasm 1.2.0 解压引擎
     ========================================================================= */
  const ArchiveEngine = {
    sevenZipPromise: null,

    async getSevenZip() {
      if (!this.sevenZipPromise) {
        this.sevenZipPromise = import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js')
          .then(mod => mod.default());
      }
      return await this.sevenZipPromise;
    },

    /**
     * 解压任意支持格式的压缩包到指定目录，严格保留原始修改时间 mtime
     */
    async extractArchive(archivePath, targetDir) {
      const name = Utils.basename(archivePath).toLowerCase();
      const buf = await fs.readFile(archivePath);
      await fs.mkdir(targetDir, { recursive: true });

      if (name.endsWith('.zip')) {
        return await this._extractZip(buf, targetDir);
      }
      if (name.endsWith('.tar.gz') || name.endsWith('.tgz')) {
        const tarBuf = await this._gunzip(buf);
        return await this._extractTar(tarBuf, targetDir);
      }
      if (name.endsWith('.tar')) {
        return await this._extractTar(buf, targetDir);
      }
      if (name.endsWith('.gz')) {
        const outBuf = await this._gunzip(buf);
        const st = await fs.stat(archivePath);
        const outName = Utils.basename(archivePath).replace(/\.gz$/i, '') || 'extracted_file';
        await fs.writeFile(Utils.joinPath(targetDir, outName), outBuf, { mtime: st.mtime });
        return 1;
      }
      // 其余格式 (.7z, .rar, .iso, .tar.bz2 等) 调用 7z-wasm
      return await this._extractWith7zWasm(buf, Utils.basename(archivePath), targetDir);
    },

    async _extractZip(arrayBuffer, targetDir) {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip 库尚未加载完成，请检查网络连接');
      }
      const zip = await JSZip.loadAsync(arrayBuffer);
      // 修复 JSZip 把 DOS 本地时间按 UTC 解析导致的时区偏差
      const tzOffsetMs = new Date().getTimezoneOffset() * 60000;
      let count = 0;

      const entries = Object.values(zip.files);
      for (const entry of entries) {
        const cleanName = entry.name.replace(/^\/+/, '');
        if (!cleanName || cleanName.includes('..')) continue;
        const destPath = Utils.joinPath(targetDir, cleanName);
        const realMtime = entry.date ? (entry.date.getTime() + tzOffsetMs) : Date.now();

        if (entry.dir) {
          await fs.mkdir(destPath, { recursive: true, mtime: realMtime });
        } else {
          const data = await entry.async('arraybuffer');
          await fs.writeFile(destPath, data, { mtime: realMtime });
          count++;
        }
      }
      return count;
    },

    async _gunzip(arrayBuffer) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('当前浏览器不支持原生 DecompressionStream');
      }
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(new Uint8Array(arrayBuffer));
      writer.close();
      return await new Response(ds.readable).arrayBuffer();
    },

    /**
     * 原生 POSIX USTAR TAR 解析器：零依赖提取文件并保留原始 mtime
     */
    async _extractTar(arrayBuffer, targetDir) {
      const bytes = new Uint8Array(arrayBuffer);
      const decoder = new TextDecoder('utf-8');
      let offset = 0;
      let count = 0;

      const readStr = (start, len) => {
        let end = start;
        while (end < start + len && bytes[end] !== 0) end++;
        return decoder.decode(bytes.subarray(start, end)).trim();
      };

      const readOctal = (start, len) => {
        const s = readStr(start, len).replace(/\0/g, '').trim();
        return s ? parseInt(s, 8) : 0;
      };

      while (offset + 512 <= bytes.length) {
        const header = bytes.subarray(offset, offset + 512);
        let allZero = true;
        for (let i = 0; i < 512; i++) {
          if (header[i] !== 0) { allZero = false; break; }
        }
        if (allZero) break;

        const name = readStr(offset, 100);
        const size = readOctal(offset + 124, 12);
        const mtimeSec = readOctal(offset + 136, 12);
        const typeFlag = String.fromCharCode(bytes[offset + 156]);
        const prefix = readStr(offset + 345, 155);
        offset += 512;

        const fullName = (prefix ? `${prefix}/${name}` : name).replace(/^\.\//, '').replace(/^\/+/, '');
        const mtimeMs = mtimeSec ? mtimeSec * 1000 : Date.now();

        if (fullName && !fullName.includes('..')) {
          const destPath = Utils.joinPath(targetDir, fullName);
          if (typeFlag === '5' || fullName.endsWith('/')) {
            await fs.mkdir(destPath, { recursive: true, mtime: mtimeMs });
          } else if (typeFlag === '0' || typeFlag === '\0' || typeFlag === '') {
            const fileSlice = bytes.slice(offset, offset + size).buffer;
            await fs.writeFile(destPath, fileSlice, { mtime: mtimeMs });
            count++;
          }
        }

        const blocks = Math.ceil(size / 512);
        offset += blocks * 512;
      }
      return count;
    },

    async _extractWith7zWasm(arrayBuffer, filename, targetDir) {
      const sz = await this.getSevenZip();
      const workDir = `/tmp_7z_${Date.now()}`;
      const inPath = `${workDir}/${filename}`;
      const outDir = `${workDir}/out`;
      sz.FS.mkdir(workDir);
      sz.FS.mkdir(outDir);
      sz.FS.writeFile(inPath, new Uint8Array(arrayBuffer));
      sz.callMain(['x', inPath, `-o${outDir}`, '-y']);

      let count = 0;
      const walkWasmFS = async (currWasmDir, currVfsDir) => {
        const items = sz.FS.readdir(currWasmDir);
        for (const item of items) {
          if (item === '.' || item === '..') continue;
          const wPath = `${currWasmDir}/${item}`;
          const vPath = Utils.joinPath(currVfsDir, item);
          const stat = sz.FS.stat(wPath);
          const mtime = stat.mtime ? new Date(stat.mtime).getTime() : Date.now();
          if (sz.FS.isDir(stat.mode)) {
            await fs.mkdir(vPath, { recursive: true, mtime });
            await walkWasmFS(wPath, vPath);
          } else {
            const data = sz.FS.readFile(wPath);
            await fs.writeFile(vPath, data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength), { mtime });
            count++;
          }
        }
      };

      await walkWasmFS(outDir, targetDir);
      return count;
    },

    /**
     * 打包选中的文件/文件夹为 ZIP，严格保留原始修改时间（修正 JSZip UTC 写入时区偏差）
     */
    async createZipFromPaths(paths, outZipPath) {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip 库未加载');
      }
      const zip = new JSZip();

      const addEntryToZip = async (vfsPath, zipRelPath) => {
        const st = await fs.stat(vfsPath);
        // 反向补偿 JSZip 将 Date 按 UTC 写入 DOS 头的时间偏差，确保保留原始修改时间
        const tzOffsetMs = new Date(st.mtime).getTimezoneOffset() * 60000;
        const dosDate = new Date(st.mtime - tzOffsetMs);

        if (st.type === 'dir') {
          zip.folder(zipRelPath);
          const children = await fs.readdir(vfsPath);
          for (const c of children) {
            await addEntryToZip(c.path, `${zipRelPath}/${c.name}`);
          }
        } else {
          const buf = await fs.readFile(vfsPath);
          zip.file(zipRelPath, buf, { date: dosDate });
        }
      };

      for (const p of paths) {
        await addEntryToZip(p, Utils.basename(p));
      }

      const zipBuf = await zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
      await fs.writeFile(outZipPath, zipBuf, { mtime: Date.now() });
      return outZipPath;
    }
  };

  // 全局挂载 fs 实例
  window.fs = new VirtualFileSystem();

  /* =========================================================================
     MODULE 6: 高性能跨端框选引擎 (MarqueeSelector)
     1. 兼容 MouseEvent 与 TouchEvent，统一 getClientXY
     2. 选框 pointer-events: none, position: absolute 累加 scrollLeft/scrollTop
     3. 仅在容器空白处启动框选（不需长按，随时一拖即框选）
     4. handleMove / handleEnd 绑定于 document，touchmove 锁死页面滚动
     5. 40px 边缘感应带自动滚动 + AABB 碰撞检测 + 完整 destroy() 销毁
     ========================================================================= */
  class MarqueeSelector {
    constructor({
      container,
      itemSelector,
      ignoreSelector = '.fe-details-header, .resize-handle, button, input, select, .os-window',
      onSelectionChange,
      forceTouchMarquee = () => false
    }) {
      this.container = container;
      this.itemSelector = itemSelector;
      this.ignoreSelector = ignoreSelector;
      this.onSelectionChange = onSelectionChange;
      this.forceTouchMarquee = forceTouchMarquee;

      // 确保滚动容器具备 relative 定位
      const computedPos = getComputedStyle(this.container).position;
      if (computedPos === 'static') {
        this.container.style.position = 'relative';
      }

      this.boxEl = document.createElement('div');
      this.boxEl.className = 'marquee-box';
      this.container.appendChild(this.boxEl);

      this.active = false;
      this.isTouch = false;
      this.startX = 0; // 相对于容器内容区（含 scrollLeft）
      this.startY = 0;
