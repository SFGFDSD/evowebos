        { name: '朱砂', color: '#D94E41' },
        { name: '泥金', color: '#D4A349' },
        { name: '花青', color: '#1F4E78' },
        { name: '赭石', color: '#8C4A32' },
        { name: '月白', color: '#EDE6D6' },
        { name: '徽墨', color: '#14191C' }
      ];

      WindowManager.createWindow({
        id: winId,
        title: '丹青画板 · 笔墨工坊',
        icon: 'paint',
        width: 860,
        height: 600,
        render: (bodyEl) => {
          bodyEl.innerHTML = `
            <div style="display:flex;flex-direction:column;height:100%;">
              <div class="fe-toolbar">
                <select class="os-select" data-role="tool">
                  <option value="brush">笔刷: 狼毫毛笔</option>
                  <option value="ink">笔刷: 水墨晕染</option>
                  <option value="line">图形: 直线</option>
                  <option value="rect">图形: 矩形</option>
                  <option value="circle">图形: 圆形</option>
                  <option value="eraser">橡皮擦</option>
                </select>
                <div style="display:flex;align-items:center;gap:4px;" data-role="swatches"></div>
                <input type="color" data-role="color-picker" value="#2E8B99" style="width:28px;height:28px;border:none;background:none;cursor:pointer;" title="自定义颜色" />
                <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
                  粗细 <input type="range" data-role="size" min="1" max="36" value="5" style="width:75px;" />
                </label>
                <div class="taskbar-divider"></div>
                <button class="os-btn" data-act="undo">撤销</button>
                <button class="os-btn" data-act="clear">清空宣纸</button>
                <button class="os-btn primary" data-act="save-vfs">保存到画廊</button>
                <button class="os-btn" data-act="set-wp">设为壁纸</button>
              </div>
              <div style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,0.22);">
                <canvas data-role="canvas" width="960" height="600" style="background:#F5EFE0;border-radius:6px;box-shadow:0 12px 36px rgba(0,0,0,0.45);cursor:crosshair;touch-action:none;max-width:100%;max-height:100%;"></canvas>
              </div>
            </div>
          `;

          const canvas = bodyEl.querySelector('[data-role="canvas"]');
          const ctx = canvas.getContext('2d');
          const toolSel = bodyEl.querySelector('[data-role="tool"]');
          const colorPicker = bodyEl.querySelector('[data-role="color-picker"]');
          const sizeRange = bodyEl.querySelector('[data-role="size"]');
          const swatchesEl = bodyEl.querySelector('[data-role="swatches"]');

          // 初始化宣纸底色
          ctx.fillStyle = '#F5EFE0';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const undoStack = [canvas.toDataURL()];
          const pushUndo = () => {
            undoStack.push(canvas.toDataURL());
            if (undoStack.length > 25) undoStack.shift();
          };

          chinesePalette.forEach(item => {
            const dot = document.createElement('button');
            dot.title = item.name;
            dot.style.cssText = `width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.4);background:${item.color};cursor:pointer;padding:0;`;
            dot.onclick = () => { colorPicker.value = item.color; };
            swatchesEl.appendChild(dot);
          });

          let drawing = false;
          let startX = 0;
          let startY = 0;
          let snapshotImg = null;

          const getCanvasXY = (e) => {
            const rect = canvas.getBoundingClientRect();
            const { x, y } = Utils.getClientXY(e);
            return {
              x: (x - rect.left) * (canvas.width / rect.width),
              y: (y - rect.top) * (canvas.height / rect.height)
            };
          };

          const onStart = (e) => {
            e.preventDefault();
            drawing = true;
            const pt = getCanvasXY(e);
            startX = pt.x;
            startY = pt.y;
            snapshotImg = ctx.getImageData(0, 0, canvas.width, canvas.height);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = Number(sizeRange.value);
            ctx.strokeStyle = toolSel.value === 'eraser' ? '#F5EFE0' : colorPicker.value;
            ctx.shadowBlur = toolSel.value === 'ink' ? Number(sizeRange.value) * 1.2 : 0;
            ctx.shadowColor = colorPicker.value;

            if (toolSel.value === 'brush' || toolSel.value === 'ink' || toolSel.value === 'eraser') {
              ctx.beginPath();
              ctx.moveTo(startX, startY);
              ctx.lineTo(startX + 0.1, startY + 0.1);
              ctx.stroke();
            }
          };

          const onMove = (e) => {
            if (!drawing) return;
            e.preventDefault();
            const pt = getCanvasXY(e);
            const t = toolSel.value;

            if (t === 'brush' || t === 'ink' || t === 'eraser') {
              ctx.lineTo(pt.x, pt.y);
              ctx.stroke();
            } else {
              ctx.putImageData(snapshotImg, 0, 0);
              ctx.beginPath();
              if (t === 'line') {
                ctx.moveTo(startX, startY);
                ctx.lineTo(pt.x, pt.y);
              } else if (t === 'rect') {
                ctx.rect(startX, startY, pt.x - startX, pt.y - startY);
              } else if (t === 'circle') {
                const r = Math.hypot(pt.x - startX, pt.y - startY);
                ctx.arc(startX, startY, r, 0, Math.PI * 2);
              }
              ctx.stroke();
            }
          };

          const onEnd = () => {
            if (!drawing) return;
            drawing = false;
            ctx.shadowBlur = 0;
            pushUndo();
          };

          canvas.addEventListener('mousedown', onStart);
          canvas.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onEnd);
          canvas.addEventListener('touchstart', onStart, { passive: false });
          canvas.addEventListener('touchmove', onMove, { passive: false });
          window.addEventListener('touchend', onEnd);

          bodyEl.querySelector('[data-act="undo"]').onclick = () => {
            if (undoStack.length > 1) {
              undoStack.pop();
              const img = new Image();
              img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
              };
              img.src = undoStack[undoStack.length - 1];
            }
          };

          bodyEl.querySelector('[data-act="clear"]').onclick = () => {
            ctx.fillStyle = '#F5EFE0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            pushUndo();
          };

          bodyEl.querySelector('[data-act="save-vfs"]').onclick = async () => {
            const name = await Utils.promptInput('保存画作', '请输入画作文件名：', `丹青新作_${Date.now()}.png`);
            if (!name) return;
            canvas.toBlob(async (blob) => {
              const dest = Utils.joinPath('/Pictures', name);
              await fs.writeFile(dest, blob, { mtime: Date.now() });
              Utils.toast(`画作已保存至 ${dest}`, 'success');
            }, 'image/png');
          };

          bodyEl.querySelector('[data-act="set-wp"]').onclick = () => {
            canvas.toBlob(async (blob) => {
              const dest = `/Pictures/.custom_wallpaper_${Date.now()}.png`;
              await fs.writeFile(dest, blob, { mtime: Date.now() });
              await DesktopOS.setCustomWallpaperFromVfs(dest);
            }, 'image/png');
          };
        }
      });
    }
  };

  /* =========================================================================
     MODULE 17: V86 x86 虚拟机模拟器 (V86App)
     严格版本锁定 0.5.319，按需加载，规范 screen_container 结构，
     严禁虚构外部 URL，支持 VFS/本地镜像挂载与 Pointer Lock 鼠标锁定
     ========================================================================= */
  const V86App = {
    LIB_URL: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',
    WASM_URL: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
    SEABIOS_URL: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
    VGABIOS_URL: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin',

    open() {
      this._createVmWindow(null);
    },

    openWithImage(vfsImagePath) {
      this._createVmWindow(Utils.normalizePath(vfsImagePath));
    },

    _createVmWindow(initialVfsPath) {
      const winId = Utils.uid('v86');
      let emulator = null;

      WindowManager.createWindow({
        id: winId,
        title: '太虚算机 · V86 x86 虚拟机 (v0.5.319)',
        icon: 'vm',
        width: 820,
        height: 600,
        onClose: () => {
          if (document.pointerLockElement) {
            document.exitPointerLock();
          }
          if (emulator) {
            try { emulator.destroy(); } catch (_) {}
            emulator = null;
          }
        },
        render: (bodyEl) => {
          bodyEl.innerHTML = `
            <div style="display:flex;flex-direction:column;height:100%;background:#000;">
              <div class="fe-toolbar" style="background:rgba(16,25,30,0.95);border-bottom:1px solid var(--border-subtle);">
                <button class="os-btn primary" data-act="load-local-img">选择本地镜像 (.iso/.img/.fda)</button>
                <button class="os-btn" data-act="load-vfs-img">从 VFS 选择镜像</button>
                <div class="taskbar-divider"></div>
                <button class="os-btn" data-act="lock-mouse" title="锁定鼠标到虚拟机内，按 ESC 键释放">锁定鼠标</button>
                <button class="os-btn" data-act="cad">发送 Ctrl+Alt+Del</button>
                <button class="os-btn" data-act="restart">重启虚拟机</button>
                <span data-role="vm-status" style="margin-left:auto;font-size:12px;color:var(--gold);">等待加载镜像...</span>
              </div>

              <!-- 严格遵守 V86 强制要求的 screen_container 结构：先 monospace div，后 canvas，顺序绝不变 -->
              <div class="v86-screen-container" data-role="screen-container" title="点击屏幕可锁定鼠标">
                <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
                <canvas style="display: none"></canvas>
              </div>
            </div>
          `;

          const screenContainer = bodyEl.querySelector('[data-role="screen-container"]');
          const statusEl = bodyEl.querySelector('[data-role="vm-status"]');
          const lockMouseBtn = bodyEl.querySelector('[data-act="lock-mouse"]');

          const onPointerLockChange = () => {
            const locked = document.pointerLockElement === screenContainer;
            lockMouseBtn.classList.toggle('active-toggle', locked);
            lockMouseBtn.textContent = locked ? '鼠标已锁定 (ESC释放)' : '锁定鼠标';
          };
          document.addEventListener('pointerlockchange', onPointerLockChange);

          const lockMouse = () => {
            if (screenContainer.requestPointerLock) {
              screenContainer.requestPointerLock();
            }
          };

          screenContainer.addEventListener('click', () => {
            if (emulator) lockMouse();
          });
          lockMouseBtn.onclick = lockMouse;

          const startVmWithBuffer = async (arrayBuffer, filename) => {
            statusEl.textContent = '正在按需加载 V86 引擎 (v0.5.319)...';
            try {
              await Utils.dynamicLoadScript(this.LIB_URL);
              if (typeof window.V86 === 'undefined' && typeof window.V86Starter === 'undefined') {
                throw new Error('V86 构造函数未就绪');
              }

              if (emulator) {
                try { emulator.destroy(); } catch (_) {}
                emulator = null;
              }

              const ext = Utils.getExt(filename);
              const cfg = {
                wasm_path: this.WASM_URL,
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: screenContainer,
                bios: { url: this.SEABIOS_URL },
                vga_bios: { url: this.VGABIOS_URL },
                autostart: true
              };

              // 严格按后缀挂载：iso->cdrom, img/fda/bin->fda, 其余->hda
              if (ext === 'iso') {
                cfg.cdrom = { buffer: arrayBuffer };
              } else if (['img', 'fda', 'bin'].includes(ext)) {
                cfg.fda = { buffer: arrayBuffer };
              } else {
                cfg.hda = { buffer: arrayBuffer };
              }

              const V86Ctor = window.V86 || window.V86Starter;
              emulator = new V86Ctor(cfg);
              statusEl.textContent = `运行中: ${filename} (点击屏幕锁定鼠标)`;
              Utils.toast(`虚拟机已启动镜像: ${filename}`, 'success');
            } catch (err) {
              statusEl.textContent = `启动失败: ${err.message}`;
              Utils.toast(`V86 启动失败: ${err.message}`, 'error', 4500);
            }
          };

          bodyEl.querySelector('[data-act="load-local-img"]').onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = '.iso,.img,.fda,.bin';
            inp.onchange = async () => {
              const f = inp.files?.[0];
              if (!f) return;
              statusEl.textContent = `正在读取 ${f.name}...`;
              const buf = await f.arrayBuffer();
              await startVmWithBuffer(buf, f.name);
            };
            inp.click();
          };

          bodyEl.querySelector('[data-act="load-vfs-img"]').onclick = async () => {
            const p = await Utils.promptInput('从 VFS 加载镜像', '请输入虚拟文件系统中的镜像路径（支持 .iso / .img / .fda / .bin）：', '/Downloads/');
            if (!p) return;
            try {
              const buf = await fs.readFile(p);
              await startVmWithBuffer(buf, Utils.basename(p));
            } catch (err) {
              Utils.toast(`读取镜像失败: ${err.message}`, 'error');
            }
          };

          bodyEl.querySelector('[data-act="cad"]').onclick = () => {
            if (emulator && emulator.keyboard_send_scancodes) {
              emulator.keyboard_send_scancodes([0x1d, 0x38, 0x53, 0xd3, 0xb8, 0x9d]);
            }
          };

          bodyEl.querySelector('[data-act="restart"]').onclick = () => {
            if (emulator && emulator.restart) emulator.restart();
          };

          if (initialVfsPath) {
            fs.readFile(initialVfsPath).then(buf => {
              startVmWithBuffer(buf, Utils.basename(initialVfsPath));
            }).catch(err => {
              statusEl.textContent = `镜像读取失败: ${err.message}`;
            });
          }
        }
      });
    }
  };

  /* =========================================================================
     MODULE 18: 系统设置中心 (SettingsApp)
     OPFS/IndexedDB 空间与文件占用可视化、主后端选择、双显控制、本地挂载管理、
     深浅模式、主题色、窗口圆角、壁纸管理、应用隐藏、单击/双击、12/24小时制、一键重置
     ========================================================================= */
  const SettingsApp = {
    open(defaultTab = 'storage') {
      const winId = 'app_settings';
      let activeTab = defaultTab;

      WindowManager.createWindow({
        id: winId,
        title: '天工阁 · 系统设置与存储总览',
        icon: 'settings',
        width: 880,
        height: 600,
        render: (bodyEl) => {
          bodyEl.innerHTML = `
            <div class="settings-layout">
              <nav class="settings-nav" data-role="nav">
                <div class="fe-tree-item active" data-tab="storage">存储空间与双后端</div>
                <div class="fe-tree-item" data-tab="appearance">画境主题与外观</div>
                <div class="fe-tree-item" data-tab="desktop">桌面图标与交互</div>
                <div class="fe-tree-item" data-tab="mounts">本地文件夹挂载</div>
                <div class="fe-tree-item" data-tab="system">系统能力与重置</div>
              </nav>
              <div class="settings-content" data-role="content"></div>
            </div>
          `;

          const navEl = bodyEl.querySelector('[data-role="nav"]');
          const contentEl = bodyEl.querySelector('[data-role="content"]');

          const switchTab = (tab) => {
            activeTab = tab;
            navEl.querySelectorAll('.fe-tree-item').forEach(el => {
              el.classList.toggle('active', el.dataset.tab === tab);
            });
            renderTab();
          };

          navEl.querySelectorAll('.fe-tree-item').forEach(el => {
            el.onclick = () => switchTab(el.dataset.tab);
          });

          const renderTab = async () => {
            contentEl.innerHTML = '';
            if (activeTab === 'storage') await renderStorageTab();
            else if (activeTab === 'appearance') renderAppearanceTab();
            else if (activeTab === 'desktop') renderDesktopTab();
            else if (activeTab === 'mounts') renderMountsTab();
            else if (activeTab === 'system') renderSystemTab();
          };

          const renderStorageTab = async () => {
            let quotaInfo = { usage: 0, quota: 0 };
            if (navigator.storage && navigator.storage.estimate) {
              try { quotaInfo = await navigator.storage.estimate(); } catch (_) {}
            }

            let opfsStats = { usedBytes: 0, fileCount: 0, dirCount: 0, byCategory: { image: 0, media: 0, code: 0, archive: 0, other: 0 }, ok: false };
            try {
              const st = await fs.opfsBackend.getUsageStats();
              opfsStats = { ...st, ok: true };
            } catch (_) {}

            let idbStats = { usedBytes: 0, fileCount: 0, dirCount: 0, byCategory: { image: 0, media: 0, code: 0, archive: 0, other: 0 }, ok: false };
            try {
              const st = await fs.idbBackend.getUsageStats();
              idbStats = { ...st, ok: true };
            } catch (_) {}

            const totalVfsUsed = opfsStats.usedBytes + idbStats.usedBytes;
            const browserQuota = quotaInfo.quota || 1024 * 1024 * 1024;
            const browserUsage = quotaInfo.usage || totalVfsUsed;
            const availBytes = Math.max(0, browserQuota - browserUsage);
            const pct = Math.min(100, ((browserUsage / browserQuota) * 100)).toFixed(2);

            const catTotals = {
              image: opfsStats.byCategory.image + idbStats.byCategory.image,
              media: opfsStats.byCategory.media + idbStats.byCategory.media,
              code: opfsStats.byCategory.code + idbStats.byCategory.code,
              archive: opfsStats.byCategory.archive + idbStats.byCategory.archive,
              other: opfsStats.byCategory.other + idbStats.byCategory.other
            };

            const makeBarSegment = (bytes, color, label) => {
              if (!totalVfsUsed || !bytes) return '';
              const w = Math.max(2, (bytes / totalVfsUsed) * 100);
              return `<div title="${label}: ${Utils.formatSize(bytes)}" style="width:${w}%;height:100%;background:${color};"></div>`;
            };

            const card1 = document.createElement('div');
            card1.className = 'settings-card';
            card1.innerHTML = `
              <div style="font-weight:700;font-size:15px;color:var(--gold);">浏览器原生存储配额与实际占用</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
                <div style="padding:10px;border-radius:8px;background:var(--bg-input);border:1px solid var(--border-subtle);">
                  <div style="font-size:11.5px;color:var(--text-muted);">总配额容量</div>
                  <div style="font-size:16px;font-weight:700;margin-top:3px;">${Utils.formatSize(browserQuota)}</div>
                </div>
                <div style="padding:10px;border-radius:8px;background:var(--bg-input);border:1px solid var(--border-subtle);">
                  <div style="font-size:11.5px;color:var(--text-muted);">当前已用空间</div>
                  <div style="font-size:16px;font-weight:700;color:var(--accent);margin-top:3px;">${Utils.formatSize(browserUsage)} (${pct}%)</div>
                </div>
                <div style="padding:10px;border-radius:8px;background:var(--bg-input);border:1px solid var(--border-subtle);">
                  <div style="font-size:11.5px;color:var(--text-muted);">剩余可用空间</div>
                  <div style="font-size:16px;font-weight:700;color:var(--malachite);margin-top:3px;">${Utils.formatSize(availBytes)}</div>
                </div>
                <div style="padding:10px;border-radius:8px;background:var(--bg-input);border:1px solid var(--border-subtle);">
                  <div style="font-size:11.5px;color:var(--text-muted);">VFS 文件总计</div>
                  <div style="font-size:16px;font-weight:700;margin-top:3px;">${opfsStats.fileCount + idbStats.fileCount} 文件 / ${opfsStats.dirCount + idbStats.dirCount} 目录</div>
                </div>
              </div>

              <div style="margin-top:4px;">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;">
                  <span>分类占用分布（VFS 实际数据: ${Utils.formatSize(totalVfsUsed)}）</span>
                  <span>占用率 ${pct}%</span>
                </div>

                '确定要清空 OPFS 与 IndexedDB 中的全部文件并重置整个丹青云境虚拟文件系统吗？此操作不可撤销！',
                true
              );
              if (!ok) return;
              await fs.resetEntireFileSystem();
              DesktopOS.refreshDesktop();
              Utils.toast('虚拟文件系统已完全重置并重建默认环境', 'success');
              renderTab();
            };

            contentEl.appendChild(card2);
          };

          renderTab();
        }
      });
    }
  };

  /* =========================================================================
     MODULE 19: 桌面环境与系统主控制器 (DesktopOS)
     默认深色、默认单击打开、默认12小时制、无开头假加载动画直接进入系统
     ========================================================================= */
  const DesktopOS = {
    defaultConfig: {
      theme: 'dark',                 // 默认深色模式
      accent: '#2E8B99',             // 默认石青主题色
      winRadius: 10,                 // 默认窗口圆角
      wallpaperType: 'preset',       // 'preset' | 'vfs'
      wallpaperValue: 'qinglv',      // 默认千里江山青绿重峦
      singleClickOpen: true,         // 默认单击打开
      use12Hour: true,               // 默认12小时制
      primaryBackend: 'opfs',        // 默认 OPFS 主存储
      showDualBackends: true,        // 文件管理器同时显示 OPFS 与 IndexedDB
      aeroSnap: true,
      aeroPeek: true,
      hiddenApps: []
    },

    builtinApps: [
      { id: 'explorer', name: '文件资源管理器', icon: 'folder', launch: () => FileExplorerApp.open('/Desktop') },
      { id: 'code', name: 'HTML 代码编辑器', icon: 'code', launch: () => CodeEditorApp.open() },
      { id: 'notepad', name: '文房记事本', icon: 'text', launch: () => NotepadApp.open() },
      { id: 'browser', name: '司南浏览器', icon: 'browser', launch: () => BrowserApp.open() },
      { id: 'paint', name: '丹青画板', icon: 'paint', launch: () => PaintApp.open() },
      { id: 'calc', name: '金算盘计算器', icon: 'calc', launch: () => CalculatorApp.open() },
      { id: 'v86', name: '太虚 V86 虚拟机', icon: 'vm', launch: () => V86App.open() },
      { id: 'settings', name: '天工阁设置', icon: 'settings', launch: () => SettingsApp.open() }
    ],

    iconPositions: {}, // iconKey -> { col, row }
    selectedDesktopKeys: new Set(),
    desktopMarquee: null,
    customWallpaperUrl: null,
    calendarViewDate: new Date(),
    calendarSelectedDate: new Date(),

    async boot() {
      // 1. 读取配置（结合 localStorage 与 Cookie 双备份）
      this.loadConfig();
      this.applyVisualConfig();
      this.applyWallpaper();

      // 2. 初始化静默图标、任务栏与时钟（零开头假加载动画，直接进入系统）
      this._initStaticIcons();
      WindowManager.init();
      this._initStartMenu();
      this._initCalendar();
      this._initGlobalListeners();
      this.updateClock();
      setInterval(() => this.updateClock(), 1000);

      // 3. 初始化统一虚拟文件系统 (OPFS + IndexedDB + Cookie/LocalStorage 降级)
      try {
        const res = await fs.init(window.OSConfig.primaryBackend);
        if (res.primary !== window.OSConfig.primaryBackend) {
          this.saveConfig({ primaryBackend: res.primary });
        }
        const badge = document.getElementById('start-vfs-badge');
        if (badge) {
          badge.textContent = res.primary === 'opfs'
            ? 'OPFS 磐石存储 + IDB 双引擎就绪'
            : 'IndexedDB 灵枢存储引擎就绪';
        }
      } catch (err) {
        Utils.toast(`存储引擎初始化提示: ${err.message}`, 'warn');
      }

      // 4. 渲染桌面图标与壁纸（若为自定义 VFS 壁纸则异步加载）
      this._loadIconPositions();
      await this.refreshDesktop();
      if (window.OSConfig.wallpaperType === 'vfs') {
        this.applyWallpaper();
      }

      // 5. 监听 VFS 变更实时刷新桌面
      fs.onChange((changedPath) => {
        if (changedPath === '/Desktop' || changedPath === '/') {
          this.refreshDesktop();
        }
      });

      // 6. 检查是否有上次挂载的本地文件夹需要重新授权提示
      this._checkSavedLocalMounts();
    },

    loadConfig() {
      let parsed = null;
      try {
        const rawLS = localStorage.getItem('danqing_os_config');
        if (rawLS) parsed = JSON.parse(rawLS);
      } catch (_) {}

      if (!parsed) {
        try {
          const match = document.cookie.match(/(?:^|;\s*)danqing_cfg=([^;]+)/);
          if (match) parsed = JSON.parse(decodeURIComponent(match[1]));
        } catch (_) {}
      }

      window.OSConfig = { ...this.defaultConfig, ...(parsed || {}) };
    },

    saveConfig(patch) {
      window.OSConfig = { ...window.OSConfig, ...patch };
      const str = JSON.stringify(window.OSConfig);
      try {
        localStorage.setItem('danqing_os_config', str);
      } catch (_) {}
      try {
        document.cookie = `danqing_cfg=${encodeURIComponent(str)}; path=/; max-age=31536000; SameSite=Lax`;
      } catch (_) {}
    },

    applyVisualConfig() {
      const cfg = window.OSConfig;
      document.documentElement.setAttribute('data-theme', cfg.theme || 'dark');
      document.documentElement.style.setProperty('--accent', cfg.accent || '#2E8B99');
      document.documentElement.style.setProperty('--accent-hover', cfg.accent || '#3AA3B3');
      document.documentElement.style.setProperty('--accent-soft', `${cfg.accent || '#2E8B99'}38`);
      document.documentElement.style.setProperty('--win-radius', `${cfg.winRadius ?? 10}px`);
    },

    async applyWallpaper() {
      const layer = document.getElementById('wallpaper-layer');
      const cfg = window.OSConfig;

      if (cfg.wallpaperType === 'vfs' && cfg.wallpaperValue) {
        try {
          if (await fs.exists(cfg.wallpaperValue)) {
            const buf = await fs.readFile(cfg.wallpaperValue);
            const blob = new Blob([buf], { type: Utils.getMimeType(cfg.wallpaperValue) });
            if (this.customWallpaperUrl) URL.revokeObjectURL(this.customWallpaperUrl);
            this.customWallpaperUrl = URL.createObjectURL(blob);
            layer.style.backgroundImage = `url("${this.customWallpaperUrl}")`;
            return;
          }
        } catch (_) {}
      }

      const dataUrl = WallpaperEngine.generateMuralDataURL(cfg.wallpaperValue || 'qinglv');
      layer.style.backgroundImage = `url("${dataUrl}")`;
    },

    async setCustomWallpaperFromVfs(vfsPath) {
      this.saveConfig({ wallpaperType: 'vfs', wallpaperValue: Utils.normalizePath(vfsPath) });
      await this.applyWallpaper();
      Utils.toast('已更换为自定义桌面壁纸', 'success');
    },

    pickAndSetCustomWallpaper() {
      return new Promise((resolve) => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.onchange = async () => {
          const f = inp.files?.[0];
          if (!f) return resolve(false);
          const buf = await f.arrayBuffer();
          const ext = Utils.getExt(f.name) || 'png';
          const dest = `/Pictures/.wallpaper_${Date.now()}.${ext}`;
          await fs.writeFile(dest, buf, { mtime: f.lastModified || Date.now() });
          await this.setCustomWallpaperFromVfs(dest);
          resolve(true);
        };
        inp.click();
      });
    },

    _initStaticIcons() {
      document.getElementById('start-btn-icon').innerHTML = SVGIcons.get('seal', 18);
      document.getElementById('tray-mount-btn').innerHTML = `${SVGIcons.get('mount', 16)}<span class="hide-sm">挂载</span>`;
      document.getElementById('tray-theme-btn').innerHTML = SVGIcons.get('theme', 16);
      document.getElementById('tray-fullscreen-btn').innerHTML = SVGIcons.get('fullscreen', 16);
      document.getElementById('aero-peek-btn').innerHTML = SVGIcons.get('peek', 12);

      document.getElementById('tray-mount-btn').onclick = () => SettingsApp.open('mounts');
      document.getElementById('tray-theme-btn').onclick = () => {
        const next = window.OSConfig.theme === 'dark' ? 'light' : 'dark';
        this.saveConfig({ theme: next });
        this.applyVisualConfig();
        Utils.toast(next === 'dark' ? '已切换为深色夜宴画境' : '已切换为浅色宋画绢本', 'info');
      };
      document.getElementById('tray-fullscreen-btn').onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      };
    },

    /* -----------------------------------------------------------------------
       桌面图标自由网格管理、拖拽换位、双向拖拽、框选与右键菜单
       ----------------------------------------------------------------------- */
    _loadIconPositions() {
      try {
        const raw = localStorage.getItem('danqing_desktop_positions');
        if (raw) this.iconPositions = JSON.parse(raw);
      } catch (_) {
        this.iconPositions = {};
      }
    },

    _saveIconPositions() {
      try {
        localStorage.setItem('danqing_desktop_positions', JSON.stringify(this.iconPositions));
      } catch (_) {}
    },

    _getGridMetrics() {
      const container = document.getElementById('desktop-icons');
      const cellW = 96;
      const cellH = 104;
      const padX = 14;
      const padY = 14;
      const maxRows = Math.max(1, Math.floor((container.clientHeight - padY * 2) / cellH));
      const maxCols = Math.max(1, Math.floor((container.clientWidth - padX * 2) / cellW));
      return { cellW, cellH, padX, padY, maxRows, maxCols };
    },

    _findNextFreeGridSlot(occupiedSet) {
      const { maxRows } = this._getGridMetrics();
      for (let col = 0; col < 50; col++) {
        for (let row = 0; row < maxRows; row++) {
          const key = `${col},${row}`;
          if (!occupiedSet.has(key)) {
            occupiedSet.add(key);
            return { col, row };
          }
        }
      }
      return { col: 0, row: 0 };
    },

    async refreshDesktop() {
      const container = document.getElementById('desktop-icons');
      if (!container) return;

      if (this.desktopMarquee) {
        this.desktopMarquee.destroy();
        this.desktopMarquee = null;
      }

      const hiddenSet = new Set(window.OSConfig.hiddenApps || []);
      const items = [];

      // 1. 系统内置应用图标
      this.builtinApps.forEach(app => {
        if (!hiddenSet.has(app.id)) {
          items.push({
            iconKey: `app:${app.id}`,
            kind: 'app',
            name: app.name,
            icon: app.icon,
            app
          });
        }
      });

      // 2. /Desktop 目录真实 VFS 文件与文件夹
      let vfsEntries = [];
      try {
        vfsEntries = await fs.readdir('/Desktop');
        vfsEntries.sort((a, b) => {
          if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
          return Utils.naturalCompare(a.name, b.name);
        });
      } catch (_) {}

      vfsEntries.forEach(entry => {
        items.push({
          iconKey: `vfs:${entry.path}`,
          kind: 'vfs',
          name: entry.name,
          path: entry.path,
          type: entry.type,
          entry
        });
      });

      // 分配并校验网格坐标
      const occupied = new Set();
      items.forEach(it => {
        const pos = this.iconPositions[it.iconKey];
        if (pos && Number.isInteger(pos.col) && Number.isInteger(pos.row) && pos.col >= 0 && pos.row >= 0) {
          const k = `${pos.col},${pos.row}`;
          if (!occupied.has(k)) {
            occupied.add(k);
            it.pos = pos;
            return;
          }
        }
        it.pos = null;
      });

      items.forEach(it => {
        if (!it.pos) {
          it.pos = this._findNextFreeGridSlot(occupied);
          this.iconPositions[it.iconKey] = it.pos;
        }
      });
      this._saveIconPositions();

      // 渲染图标 DOM
      container.innerHTML = '';
      const { cellW, cellH, padX, padY } = this._getGridMetrics();

      items.forEach(it => {
        const el = document.createElement('div');
        el.className = `desktop-icon ${this.selectedDesktopKeys.has(it.iconKey) ? 'selected' : ''}`;
        el.dataset.iconKey = it.iconKey;
        if (it.path) {
          el.dataset.path = it.path;
          el.dataset.type = it.type;
        }

        el.style.left = `${padX + it.pos.col * cellW}px`;
        el.style.top = `${padY + it.pos.row * cellH}px`;

        const glyphDiv = document.createElement('div');
        glyphDiv.className = 'desktop-icon-glyph';
        if (it.kind === 'app') {
          glyphDiv.innerHTML = SVGIcons.get(it.icon, 40);
        } else if (it.type === 'file' && Utils.isImageExt(Utils.getExt(it.name))) {
          glyphDiv.innerHTML = SVGIcons.get('image', 40);
          // 异步懒加载图片缩略图
          fs.readFile(it.path).then(buf => {
            const url = URL.createObjectURL(new Blob([buf], { type: Utils.getMimeType(it.name) }));
            glyphDiv.innerHTML = `<img class="thumb-preview" src="${url}" alt="${Utils.escapeHtml(it.name)}" />`;
          }).catch(() => {});
        } else {
          glyphDiv.innerHTML = SVGIcons.getFileIcon(it.entry);
        }

        const labelDiv = document.createElement('div');
        labelDiv.className = 'desktop-icon-label';
        labelDiv.textContent = it.name;

        el.appendChild(glyphDiv);
        el.appendChild(labelDiv);

        // 点击与打开逻辑（默认单击打开）
        let touchMoved = false;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (touchMoved) {
            touchMoved = false;
            return;
          }
          if (e.ctrlKey || e.metaKey) {
            if (this.selectedDesktopKeys.has(it.iconKey)) {
              this.selectedDesktopKeys.delete(it.iconKey);
              el.classList.remove('selected');
            } else {
              this.selectedDesktopKeys.add(it.iconKey);
              el.classList.add('selected');
            }
            return;
          }

          if (window.OSConfig.singleClickOpen !== false) {
            this._openDesktopItem(it);
          } else {
            container.querySelectorAll('.desktop-icon').forEach(node => node.classList.remove('selected'));
            this.selectedDesktopKeys = new Set([it.iconKey]);
            el.classList.add('selected');
          }
        });

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (window.OSConfig.singleClickOpen === false) {
            this._openDesktopItem(it);
          }
        });

        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!this.selectedDesktopKeys.has(it.iconKey)) {
            container.querySelectorAll('.desktop-icon').forEach(node => node.classList.remove('selected'));
            this.selectedDesktopKeys = new Set([it.iconKey]);
            el.classList.add('selected');
          }
          this._showDesktopItemContextMenu(e.clientX, e.clientY, it);
        });

        // 统一使用 HTML5 原生拖拽 (draggable="true")，严禁在鼠标端混用 pointerdown/pointermove
        if (it.kind === 'vfs') {
          DragDropManager.bindDraggableElement(el, {
            getDragPaths: () => {
              const selectedVfs = Array.from(this.selectedDesktopKeys)
                .filter(k => k.startsWith('vfs:'))
                .map(k => k.slice(4));
              return selectedVfs.includes(it.path) && selectedVfs.length > 0 ? selectedVfs : [it.path];
            },
            onClickSelect: () => {
              if (!this.selectedDesktopKeys.has(it.iconKey)) {
                container.querySelectorAll('.desktop-icon').forEach(node => node.classList.remove('selected'));
                this.selectedDesktopKeys = new Set([it.iconKey]);
                el.classList.add('selected');
              }
            }
          });
          if (it.type === 'dir') {
            DragDropManager.bindFolderDropTarget(el, () => it.path, () => this.refreshDesktop());
          }
        } else {
          // 系统内置应用图标也使用 HTML5 draggable="true" 实现桌面网格自由调整位置
          el.setAttribute('draggable', 'true');
          el.addEventListener('dragstart', (e) => {
            const rect = el.getBoundingClientRect();
            const payload = {
              desktopIconKeys: [it.iconKey],
              paths: [],
              grabOffsetX: e.clientX - rect.left,
              grabOffsetY: e.clientY - rect.top
            };
            DragDropManager.internalDragState = payload;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('application/x-danqing-drag', JSON.stringify(payload));
          });
          el.addEventListener('dragend', () => {
            DragDropManager.internalDragState = null;
          });
        }

        // 移动端纯触摸拖拽调整桌面图标位置（触摸屏不触发 HTML5 draggable，二者完全互补不冲突）
        let tStartX = 0;
        let tStartY = 0;
        let origLeft = 0;
        let origTop = 0;

        el.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          touchMoved = false;
          tStartX = e.touches[0].clientX;
          tStartY = e.touches[0].clientY;
          origLeft = parseFloat(el.style.left) || 0;
          origTop = parseFloat(el.style.top) || 0;
        }, { passive: true });

        el.addEventListener('touchmove', (e) => {
          if (e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - tStartX;
          const dy = e.touches[0].clientY - tStartY;
          if (!touchMoved && Math.hypot(dx, dy) < 10) return;
          touchMoved = true;
          e.preventDefault();
          el.classList.add('dragging-touch');
          el.style.left = `${Math.max(0, origLeft + dx)}px`;
          el.style.top = `${Math.max(0, origTop + dy)}px`;
        }, { passive: false });

        el.addEventListener('touchend', () => {
          if (!touchMoved) return;
          el.classList.remove('dragging-touch');
          const curLeft = parseFloat(el.style.left) || 0;
          const curTop = parseFloat(el.style.top) || 0;
          this._snapDesktopIconToNearestGrid(it.iconKey, curLeft, curTop);
        });

        container.appendChild(el);
      });

      // 初始化桌面框选器（空白处任意拖动框选）
      this.desktopMarquee = new MarqueeSelector({
        container,
        itemSelector: '.desktop-icon',
        onSelectionChange: (paths) => {
          this.selectedDesktopKeys.clear();
          container.querySelectorAll('.desktop-icon.selected').forEach(el => {
            if (el.dataset.iconKey) this.selectedDesktopKeys.add(el.dataset.iconKey);
          });
        }
      });
    },

    _snapDesktopIconToNearestGrid(iconKey, pixelLeft, pixelTop) {
      const { cellW, cellH, padX, padY, maxRows, maxCols } = this._getGridMetrics();
      const targetCol = Math.max(0, Math.min(maxCols - 1, Math.round((pixelLeft - padX) / cellW)));
      const targetRow = Math.max(0, Math.min(maxRows - 1, Math.round((pixelTop - padY) / cellH)));

      // 检查目标格是否被其他图标占用，若占用则交换位置，体验丝滑
      let occupantKey = null;
      for (const [k, pos] of Object.entries(this.iconPositions)) {
        if (k !== iconKey && pos.col === targetCol && pos.row === targetRow) {
          occupantKey = k;
          break;
        }
      }

      const oldPos = this.iconPositions[iconKey] || { col: 0, row: 0 };
      this.iconPositions[iconKey] = { col: targetCol, row: targetRow };
      if (occupantKey) {
        this.iconPositions[occupantKey] = oldPos;
      }

      this._saveIconPositions();

      // 立即更新 DOM 位置触发 CSS transition 丝滑吸附动画
      const container = document.getElementById('desktop-icons');
      container.querySelectorAll('.desktop-icon').forEach(el => {
        const k = el.dataset.iconKey;
        const p = this.iconPositions[k];
        if (p) {
          el.style.left = `${padX + p.col * cellW}px`;
          el.style.top = `${padY + p.row * cellH}px`;
        }
      });
    },

    _openDesktopItem(item) {
      if (item.kind === 'app') {
        item.app.launch();
      } else {
        AppDispatcher.openPath(item.path);
      }
    },

    _showDesktopItemContextMenu(x, y, item) {
      if (item.kind === 'app') {
        this.showContextMenu(x, y, [
          { label: `打开 ${item.name}`, onClick: () => item.app.launch() },
          {
            label: '从桌面隐藏此图标',
            onClick: () => {
              const hidden = new Set(window.OSConfig.hiddenApps || []);
              hidden.add(item.app.id);
              this.saveConfig({ hiddenApps: Array.from(hidden) });
              this.refreshDesktop();
              Utils.toast(`已隐藏 ${item.name}（可在设置中恢复）`, 'info');
            }
          }
        ]);
        return;
      }

      const selectedVfs = Array.from(this.selectedDesktopKeys)
        .filter(k => k.startsWith('vfs:'))
        .map(k => k.slice(4));
      const targets = selectedVfs.includes(item.path) && selectedVfs.length > 0 ? selectedVfs : [item.path];

      const ext = Utils.getExt(item.name);
      const items = [
        { label: '打开', onClick: () => AppDispatcher.openPath(item.path) }
      ];

      if (item.type === 'file') {
        const sub = [
          { label: '记事本 (纯文本)', onClick: () => AppDispatcher.openPath(item.path, { mode: 'text' }) },
          { label: 'HTML 网页代码编辑器', onClick: () => AppDispatcher.openPath(item.path, { mode: 'code' }) }
        ];
        if (ext === 'html' || ext === 'htm') {
          sub.unshift({ label: '系统浏览器打开', onClick: () => AppDispatcher.openPath(item.path, { mode: 'browser' }) });
        }
        if (Utils.isImageExt(ext)) {
          sub.unshift(
            { label: '漫画阅读器', onClick: () => AppDispatcher.openPath(item.path, { mode: 'manga' }) },
            { label: '图片查看器', onClick: () => AppDispatcher.openPath(item.path, { mode: 'image' }) }
          );
        }
        items.push({ label: '打开方式', submenu: sub });

        if (Utils.isImageExt(ext)) {
          items.push({ label: '设为桌面壁纸', onClick: () => this.setCustomWallpaperFromVfs(item.path) });
        }
        if (Utils.isArchiveExt(ext) || Utils.isTarGzName(item.name)) {
          items.push({ label: '解压到桌面...', onClick: () => AppDispatcher.promptAndExtractArchive(item.path) });
        }
      }

      items.push(
        { sep: true },
        {
          label: '打包压缩为 ZIP',
          onClick: async () => {
            const outZip = await DragDropManager.getUniqueDestPath('/Desktop', `${Utils.basename(targets[0])}.zip`);
            await ArchiveEngine.createZipFromPaths(targets, outZip);
            Utils.toast(`已打包 ${Utils.basename(outZip)}`, 'success');
          }
        },
        {
          label: '导出 / 下载到本地电脑',
          onClick: () => DragDropManager.exportPathsToLocal(targets)
        },
        { sep: true },
        {
          label: '复制',
          onClick: () => {
            FileExplorerApp.clipboard = { mode: 'copy', paths: targets };
            Utils.toast(`已复制 ${targets.length} 项`, 'info');
          }
        },
        {
          label: '剪切',
          onClick: () => {
            FileExplorerApp.clipboard = { mode: 'cut', paths: targets };
            Utils.toast(`已剪切 ${targets.length} 项`, 'info');
          }
        }
      );

      if (targets.length === 1) {
        items.push({
          label: '重命名',
          onClick: async () => {
            const newName = await Utils.promptInput('重命名', '请输入新的名称：', item.name);
            if (!newName || !newName.trim() || newName.trim() === item.name) return;
            await fs.rename(item.path, Utils.joinPath('/Desktop', newName.trim()));
          }
        });
      }

      items.push({
        label: '删除',
        danger: true,
        onClick: async () => {
          const ok = await Utils.confirmDialog('删除确认', `确定要删除选中的 ${targets.length} 个项目吗？`, true);
          if (!ok) return;
          for (const p of targets) await fs.remove(p);
          this.selectedDesktopKeys.clear();
        }
      });

      this.showContextMenu(x, y, items);
    },

    _showDesktopBlankContextMenu(x, y) {
      const items = [
        { label: '刷新桌面', onClick: () => this.refreshDesktop() },
        {
          label: '自动对齐排列图标',
          onClick: () => {
            this.iconPositions = {};
            this._saveIconPositions();
            this.refreshDesktop();
            Utils.toast('已重新对齐桌面图标网格', 'info');
          }
        },
        { sep: true },
        {
          label: '新建文件夹',
          onClick: async () => {
            const name = await Utils.promptInput('新建桌面文件夹', '请输入文件夹名称：', '新建文件夹');
            if (name && name.trim()) {
              const p = await DragDropManager.getUniqueDestPath('/Desktop', name.trim());
              await fs.mkdir(p, { recursive: true });
            }
          }
        },
        {
          label: '新建文本文档',
          onClick: async () => {
            const name = await Utils.promptInput('新建文本文档', '请输入文件名：', '随笔.txt');
            if (name && name.trim()) {
              const p = await DragDropManager.getUniqueDestPath('/Desktop', name.trim());
              await fs.writeFile(p, '', { mtime: Date.now() });
            }
          }
        },
        {
          label: '新建 HTML 网页',
          onClick: () => CodeEditorApp.open()
        },
        {
          label: '上传 / 导入本地文件到桌面',
          onClick: () => DragDropManager.pickAndImportFiles('/Desktop')
        },
        {
          label: '挂载电脑本地文件夹',
          onClick: async () => {
            try {
              const mp = await fs.mountLocalFolder();
              Utils.toast(`已挂载至 ${mp}`, 'success');
              FileExplorerApp.open(mp);
            } catch (e) {
              if (e.name !== 'AbortError') Utils.toast(e.message, 'error');
            }
          }
        }
      ];

      if (FileExplorerApp.clipboard.paths.length > 0) {
        items.push({
          label: `粘贴到桌面 (${FileExplorerApp.clipboard.paths.length} 项)`,
          onClick: async () => {
            for (const src of FileExplorerApp.clipboard.paths) {
              const dest = await DragDropManager.getUniqueDestPath('/Desktop', Utils.basename(src));
              if (FileExplorerApp.clipboard.mode === 'cut') await fs.rename(src, dest);
              else await fs.copy(src, dest);
            }
            if (FileExplorerApp.clipboard.mode === 'cut') FileExplorerApp.clipboard = { mode: null, paths: [] };
          }
        });
      }

      items.push(
        { sep: true },
        {
          label: '切换下一幅山水壁画',
          onClick: () => {
            const list = WallpaperEngine.presets;
            const idx = list.findIndex(p => p.id === window.OSConfig.wallpaperValue);
            const next = list[(idx + 1) % list.length];
            this.saveConfig({ wallpaperType: 'preset', wallpaperValue: next.id });
            this.applyWallpaper();
            Utils.toast(`壁画已切换为《${next.name}》`, 'info');
          }
        },
        {
          label: '上传本地图片设为壁纸...',
          onClick: () => this.pickAndSetCustomWallpaper()
        },
        {
          label: '切换全屏模式',
          onClick: () => document.getElementById('tray-fullscreen-btn').click()
        },
        { sep: true },
        {
          label: '个性化与系统设置',
          onClick: () => SettingsApp.open('appearance')
        }
      );

      this.showContextMenu(x, y, items);
    },

    /* -----------------------------------------------------------------------
       全局上下文菜单、开始菜单、12小时制时钟与互动月历
       ----------------------------------------------------------------------- */
    showContextMenu(x, y, items) {
      const menu = document.getElementById('context-menu');
      menu.innerHTML = '';

      items.forEach(item => {
        if (item.sep) {
          const sep = document.createElement('div');
          sep.className = 'ctx-sep';
          menu.appendChild(sep);
          return;
        }

        const el = document.createElement('div');
        el.className = `ctx-item ${item.danger ? 'danger' : ''}`;
        el.innerHTML = `
          <div class="ctx-item-left">
            <span>${Utils.escapeHtml(item.label)}</span>
          </div>
          ${item.shortcut ? `<span class="ctx-shortcut">${item.shortcut}</span>` : ''}
          ${item.submenu ? `<span style="font-size:11px;color:var(--text-muted);">›</span>` : ''}
        `;

        if (item.submenu) {
          const subEl = document.createElement('div');
          subEl.className = 'ctx-submenu';
          item.submenu.forEach(subItem => {
            const sRow = document.createElement('div');
            sRow.className = 'ctx-item';
            sRow.textContent = subItem.label;
            sRow.onclick = (e) => {
              e.stopPropagation();
              this.hideContextMenu();
              subItem.onClick();
            };
            subEl.appendChild(sRow);
          });
          el.appendChild(subEl);
        } else if (item.onClick) {
          el.onclick = (e) => {
            e.stopPropagation();
            this.hideContextMenu();
            item.onClick();
          };
        }

        menu.appendChild(el);
      });

      menu.classList.add('open');
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const mw = menu.offsetWidth || 200;
      const mh = menu.offsetHeight || 260;

      menu.style.left = `${Math.min(x, vw - mw - 8)}px`;
      menu.style.top = `${Math.min(y, vh - mh - 8)}px`;
    },

    hideContextMenu() {
      document.getElementById('context-menu').classList.remove('open');
    },

    _initStartMenu() {
      const startBtn = document.getElementById('start-btn');
      const startMenu = document.getElementById('start-menu');
      const searchInput = document.getElementById('start-search-input');

      startBtn.onclick = (e) => {
        e.stopPropagation();
        document.getElementById('calendar-popover').classList.remove('open');
        const opening = !startMenu.classList.contains('open');
        startMenu.classList.toggle('open', opening);
        startBtn.classList.toggle('active', opening);
        if (opening) {
          searchInput.value = '';
          this.renderStartMenu('');
          setTimeout(() => searchInput.focus(), 40);
        }
      };

      searchInput.addEventListener('input', () => {
        this.renderStartMenu(searchInput.value);
      });

      document.getElementById('start-settings-quick').onclick = () => {
        startMenu.classList.remove('open');
        startBtn.classList.remove('active');
        SettingsApp.open();
      };

      document.getElementById('start-mount-local-btn').onclick = async () => {
        startMenu.classList.remove('open');
        startBtn.classList.remove('active');
        try {
          const mp = await fs.mountLocalFolder();
          Utils.toast(`已挂载本地文件夹至 ${mp}`, 'success');
          FileExplorerApp.open(mp);
        } catch (err) {
          if (err.name !== 'AbortError') Utils.toast(err.message, 'error');
        }
      };

      document.getElementById('start-show-desktop-btn').onclick = () => {
        startMenu.classList.remove('open');
        startBtn.classList.remove('active');
        WindowManager.toggleShowDesktop();
      };

      this.renderStartMenu('');
    },

    renderStartMenu(filter = '') {
      const grid = document.getElementById('start-apps-grid');
      if (!grid) return;
      grid.innerHTML = '';
      const q = filter.trim().toLowerCase();

      this.builtinApps
        .filter(app => !q || app.name.toLowerCase().includes(q))
        .forEach(app => {
          const item = document.createElement('button');
          item.className = 'start-app-item';
          item.innerHTML = `
            <div>${SVGIcons.get(app.icon, 32)}</div>
            <span class="start-app-name">${app.name}</span>
          `;
          item.onclick = () => {
            document.getElementById('start-menu').classList.remove('open');
            document.getElementById('start-btn').classList.remove('active');
            app.launch();
          };
          grid.appendChild(item);
        });
    },

    updateClock() {
      const now = new Date();
      const use12 = window.OSConfig?.use12Hour !== false;
      const min = String(now.getMinutes()).padStart(2, '0');
      let hr = now.getHours();
      let timeStr = '';

      if (use12) {
        const period = hr < 12 ? '上午' : '下午';
        hr = hr % 12 || 12;
        timeStr = `${period} ${hr}:${min}`;
      } else {
        timeStr = `${String(hr).padStart(2, '0')}:${min}`;
      }

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');

      const timeEl = document.getElementById('tray-time');
      const dateEl = document.getElementById('tray-date');
      if (timeEl) timeEl.textContent = timeStr;
      if (dateEl) dateEl.textContent = `${yyyy}/${mm}/${dd}`;
    },

    _initCalendar() {
      const clockBtn = document.getElementById('tray-clock-btn');
      const calPop = document.getElementById('calendar-popover');
      const weekdaysEl = document.getElementById('cal-weekdays');

      weekdaysEl.innerHTML = ['日', '一', '二', '三', '四', '五', '六']
        .map(w => `<div class="cal-weekday">${w}</div>`)
        .join('');

      clockBtn.onclick = (e) => {
        e.stopPropagation();
        document.getElementById('start-menu').classList.remove('open');
        document.getElementById('start-btn').classList.remove('active');
        const open = !calPop.classList.contains('open');
        calPop.classList.toggle('open', open);
        if (open) {
          this.renderCalendar();
        }
      };

      document.getElementById('cal-prev-btn').onclick = (e) => {
        e.stopPropagation();
        this.calendarViewDate = new Date(this.calendarViewDate.getFullYear(), this.calendarViewDate.getMonth() - 1, 1);
        this.renderCalendar();
      };

      document.getElementById('cal-next-btn').onclick = (e) => {
        e.stopPropagation();
        this.calendarViewDate = new Date(this.calendarViewDate.getFullYear(), this.calendarViewDate.getMonth() + 1, 1);
        this.renderCalendar();
      };

      document.getElementById('cal-today-btn').onclick = (e) => {
        e.stopPropagation();
        this.calendarViewDate = new Date();
        this.calendarSelectedDate = new Date();
        this.renderCalendar();
      };

      document.getElementById('cal-hour-toggle-btn').onclick = (e) => {
        e.stopPropagation();
        const next = !window.OSConfig.use12Hour;
        this.saveConfig({ use12Hour: next });
        this.updateClock();
        Utils.toast(next ? '已切换为 12 小时制' : '已切换为 24 小时制', 'info');
      };
    },

    renderCalendar() {
      const year = this.calendarViewDate.getFullYear();
      const month = this.calendarViewDate.getMonth();
      document.getElementById('cal-month-label').textContent = `${year}年 ${month + 1}月`;

      const daysEl = document.getElementById('cal-days');
      daysEl.innerHTML = '';

      const firstDayWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const today = new Date();

      const addCell = (dObj, isOther) => {
        const cell = document.createElement('div');
        const isToday = dObj.toDateString() === today.toDateString();
        const isSel = dObj.toDateString() === this.calendarSelectedDate.toDateString();
        cell.className = `cal-day ${isOther ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSel ? 'selected-day' : ''}`;
        cell.textContent = dObj.getDate();
        cell.onclick = (e) => {
          e.stopPropagation();
          this.calendarSelectedDate = dObj;
          this.calendarViewDate = new Date(dObj.getFullYear(), dObj.getMonth(), 1);
          this.renderCalendar();
        };
        daysEl.appendChild(cell);
      };

      for (let i = firstDayWeek - 1; i >= 0; i--) {
        addCell(new Date(year, month - 1, prevMonthDays - i), true);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        addCell(new Date(year, month, d), false);
      }
      const totalCells = firstDayWeek + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let d = 1; d <= remaining; d++) {
        addCell(new Date(year, month + 1, d), true);
      }
    },

    _initGlobalListeners() {
      const desktopContainer = document.getElementById('desktop-icons');

      // 桌面区域双向拖拽接收：支持内部调整图标坐标、从文件管理器拖到桌面、从电脑物理桌面拖入文件/文件夹
      desktopContainer.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      desktopContainer.addEventListener('drop', async (e) => {
        if (e.target.closest('.drag-over-dir')) return;
        e.preventDefault();

        const rawInternal = e.dataTransfer.getData('application/x-danqing-drag');
        let internal = null;
        if (rawInternal) {
          try { internal = JSON.parse(rawInternal); } catch (_) {}
        } else if (DragDropManager.internalDragState) {
          internal = DragDropManager.internalDragState;
        }

        const rect = desktopContainer.getBoundingClientRect();
        const dropX = e.clientX - rect.left + desktopContainer.scrollLeft - (internal?.grabOffsetX || 40);
        const dropY = e.clientY - rect.top + desktopContainer.scrollTop - (internal?.grabOffsetY || 40);

        if (internal) {
          // 情况 A: 桌面已有图标调整自由网格位置
          if (internal.desktopIconKeys && internal.desktopIconKeys.length > 0) {
            this._snapDesktopIconToNearestGrid(internal.desktopIconKeys[0], dropX, dropY);
            return;
          }

          if (Array.isArray(internal.paths) && internal.paths.length > 0) {
            // 情况 B: 桌面 VFS 图标自身在桌面内拖动调整坐标
            if (internal.paths.length === 1 && Utils.dirname(internal.paths[0]) === '/Desktop') {
              this._snapDesktopIconToNearestGrid(`vfs:${internal.paths[0]}`, dropX, dropY);
              return;
            }

            // 情况 C: 从文件管理器其他目录拖放到桌面 -> 移动/复制到 /Desktop 并摆放在落点网格
            for (const src of internal.paths) {
              if (Utils.dirname(src) === '/Desktop') continue;
              const dest = await DragDropManager.getUniqueDestPath('/Desktop', Utils.basename(src));
              if (e.ctrlKey) await fs.copy(src, dest);
              else await fs.rename(src, dest);

              const { cellW, cellH, padX, padY, maxRows, maxCols } = this._getGridMetrics();
              const col = Math.max(0, Math.min(maxCols - 1, Math.round((dropX - padX) / cellW)));
              const row = Math.max(0, Math.min(maxRows - 1, Math.round((dropY - padY) / cellH)));
              this.iconPositions[`vfs:${dest}`] = { col, row };
            }
            this._saveIconPositions();
            await this.refreshDesktop();
            return;
          }
        }

        // 情况 D: 从电脑物理桌面拖入文件或文件夹到虚拟桌面
        const count = await DragDropManager.importDataTransferItems(e.dataTransfer, '/Desktop');
        if (count > 0) {
          Utils.toast(`已从本地导入 ${count} 个文件到桌面`, 'success');
          await this.refreshDesktop();
        }
      });

      // 桌面空白处右键菜单
      desktopContainer.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.desktop-icon')) return;
        e.preventDefault();
        this._showDesktopBlankContextMenu(e.clientX, e.clientY);
      });

      // 点击空白处关闭开始菜单、日历与右键菜单
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#context-menu')) {
          this.hideContextMenu();
        }
        if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
          document.getElementById('start-menu').classList.remove('open');
          document.getElementById('start-btn').classList.remove('active');
        }
        if (!e.target.closest('#calendar-popover') && !e.target.closest('#tray-clock-btn')) {
          document.getElementById('calendar-popover').classList.remove('open');
        }
      });
    },

    async _checkSavedLocalMounts() {
      const records = await fs.getSavedLocalMountRecords();
      if (!records || records.length === 0) return;

      // 尝试静默检查是否已有权限，未授权则弹出温和的恢复提示条
      const needAuth = [];
      for (const rec of records) {
        try {
          const perm = await rec.handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            await fs.reconnectSavedMount(rec);
          } else {
            needAuth.push(rec);
          }
        } catch (_) {}
      }

      if (needAuth.length > 0) {
        const container = document.getElementById('toast-container');
        const banner = document.createElement('div');
        banner.className = 'os-toast warn';
        banner.style.flexDirection = 'column';
        banner.style.alignItems = 'flex-start';
        banner.innerHTML = `
          <div style="font-weight:600;">检测到 ${needAuth.length} 个历史本地挂载文件夹</div>
          <div style="font-size:12px;color:var(--text-secondary);">由于浏览器安全策略，刷新页面后需点击重新授权以恢复访问（${needAuth.map(r => Utils.escapeHtml(r.name)).join('、')}）。</div>
          <div style="display:flex;gap:8px;margin-top:4px;">
            <button class="os-btn primary" data-act="reauth" style="height:26px;">一键恢复挂载权限</button>
            <button class="os-btn" data-act="dismiss" style="height:26px;">暂不恢复</button>
          </div>
        `;
        banner.querySelector('[data-act="reauth"]').onclick = async () => {
          for (const rec of needAuth) {
            try {
              await fs.reconnectSavedMount(rec);
            } catch (_) {}
          }
          banner.remove();
          Utils.toast('已恢复本地文件夹挂载访问', 'success');
        };
        banner.querySelector('[data-act="dismiss"]').onclick = () => banner.remove();
        container.appendChild(banner);
      }
    }
  };

  // 启动丹青云境 WebOS
  window.addEventListener('DOMContentLoaded', () => {
    DesktopOS.boot();
  });
