              this.clipboard = { mode: null, paths: [] };
            }
            if (count > 0) {
              await loadCurrentDirectory(false);
              Utils.toast(`已粘贴 ${count} 项`, 'success');
            }
          };

          const showProperties = async (entry) => {
            const st = await fs.stat(entry.path);
            const use12h = window.OSConfig?.use12Hour !== false;
            const html = `
              <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;">
                <div><strong>名称：</strong>${Utils.escapeHtml(st.name)}</div>
                <div><strong>路径：</strong><code style="font-family:var(--font-mono);">${Utils.escapeHtml(st.path)}</code></div>
                <div><strong>类型：</strong>${Utils.escapeHtml(Utils.getFileTypeLabel(entry))}</div>
                <div><strong>实际大小：</strong>${Utils.formatSize(st.size)} (${st.size.toLocaleString()} 字节)</div>
                <div><strong>修改日期：</strong>${Utils.formatDate(st.mtime, use12h)}</div>
                <div><strong>创建时间：</strong>${Utils.formatDate(st.ctime, use12h)}</div>
              </div>
            `;
            Utils.showModal({ title: '属性详情', content: html });
          };

          const showDirectoryContextMenu = (x, y, dirPath) => {
            const items = [
              { label: '刷新', onClick: () => loadCurrentDirectory(false) },
              { sep: true },
              { label: '新建文件夹', onClick: createNewFolder },
              { label: '新建文本文档', onClick: createNewFile },
              { label: '上传/导入本地文件', onClick: () => DragDropManager.pickAndImportFiles(dirPath).then(() => loadCurrentDirectory(false)) },
              { label: '挂载本地文件夹', onClick: () => mountLocalHandler() }
            ];
            if (this.clipboard.paths.length > 0) {
              items.push({ sep: true }, { label: `粘贴 (${this.clipboard.paths.length} 项)`, shortcut: 'Ctrl+V', onClick: () => pasteInto(dirPath) });
            }
            DesktopOS.showContextMenu(x, y, items);
          };

          const showItemContextMenu = (x, y, entry) => {
            const selList = state.selectedPaths.size > 0 ? Array.from(state.selectedPaths) : [entry.path];
            const items = [
              { label: '打开', onClick: () => openEntry(entry) }
            ];

            if (entry.type === 'file') {
              const ext = Utils.getExt(entry.name);
              const sub = [
                { label: '记事本 (纯文本)', onClick: () => AppDispatcher.openPath(entry.path, { mode: 'text' }) },
                { label: '网页代码编辑器', onClick: () => AppDispatcher.openPath(entry.path, { mode: 'code' }) }
              ];
              if (ext === 'html' || ext === 'htm') {
                sub.unshift({ label: '系统网页浏览器', onClick: () => AppDispatcher.openPath(entry.path, { mode: 'browser' }) });
              }
              if (Utils.isImageExt(ext)) {
                sub.unshift(
                  { label: '漫画阅读器 (条漫)', onClick: () => AppDispatcher.openPath(entry.path, { mode: 'manga' }) },
                  { label: '图片查看器 (缩放旋转)', onClick: () => AppDispatcher.openPath(entry.path, { mode: 'image' }) }
                );
              }
              items.push({ label: '打开方式', submenu: sub });
            }

            if (entry.type === 'file' && Utils.isImageExt(Utils.getExt(entry.name))) {
              items.push({ label: '设为桌面壁纸', onClick: () => DesktopOS.setCustomWallpaperFromVfs(entry.path) });
            }

            if (entry.type === 'file' && (Utils.isArchiveExt(Utils.getExt(entry.name)) || Utils.isTarGzName(entry.name))) {
              items.push({ label: '解压到当前目录...', onClick: () => AppDispatcher.promptAndExtractArchive(entry.path) });
            }

            items.push(
              { sep: true },
              {
                label: '打包压缩为 ZIP',
                onClick: async () => {
                  const outZip = await DragDropManager.getUniqueDestPath(state.currentPath, `${Utils.basename(selList[0])}.zip`);
                  await ArchiveEngine.createZipFromPaths(selList, outZip);
                  Utils.toast(`已打包至 ${Utils.basename(outZip)}`, 'success');
                  loadCurrentDirectory(false);
                }
              },
              {
                label: '导出 / 下载到本地电脑',
                onClick: () => DragDropManager.exportPathsToLocal(selList)
              },
              { sep: true },
              {
                label: '复制',
                shortcut: 'Ctrl+C',
                onClick: () => {
                  this.clipboard = { mode: 'copy', paths: selList };
                  Utils.toast(`已复制 ${selList.length} 项`, 'info');
                }
              },
              {
                label: '剪切',
                shortcut: 'Ctrl+X',
                onClick: () => {
                  this.clipboard = { mode: 'cut', paths: selList };
                  Utils.toast(`已剪切 ${selList.length} 项`, 'info');
                }
              }
            );

            if (selList.length === 1) {
              items.push({ label: '重命名', shortcut: 'F2', onClick: () => renameItem(entry.path) });
            }

            if (entry.path.startsWith('/mnt/local/') && entry.path.split('/').length === 4) {
              items.push({
                label: '卸载此本地文件夹',
                onClick: async () => {
                  await fs.unmountLocalFolder(entry.path);
                  navigateTo('/mnt/local');
                }
              });
            }

            items.push(
              { label: '删除', shortcut: 'Del', danger: true, onClick: () => deleteSelected(selList) },
              { sep: true },
              { label: '属性', onClick: () => showProperties(entry) }
            );

            DesktopOS.showContextMenu(x, y, items);
          };

          const mountLocalHandler = async () => {
            try {
              const mp = await fs.mountLocalFolder();
              Utils.toast(`已成功挂载本地文件夹至 ${mp}`, 'success');
              navigateTo(mp);
            } catch (err) {
              if (err.name !== 'AbortError') {
                Utils.toast(err.message, 'error');
              }
            }
          };

          // 绑定工具栏动作
          root.querySelector('[data-act="back"]').onclick = () => {
            if (state.historyIndex > 0) {
              state.historyIndex--;
              navigateTo(state.history[state.historyIndex], false);
            }
          };
          root.querySelector('[data-act="forward"]').onclick = () => {
            if (state.historyIndex < state.history.length - 1) {
              state.historyIndex++;
              navigateTo(state.history[state.historyIndex], false);
            }
          };
          root.querySelector('[data-act="up"]').onclick = () => {
            if (state.currentPath !== '/') {
              navigateTo(Utils.dirname(state.currentPath));
            }
          };
          root.querySelector('[data-act="refresh"]').onclick = () => loadCurrentDirectory(false);
          root.querySelector('[data-act="new-folder"]').onclick = createNewFolder;
          root.querySelector('[data-act="new-file"]').onclick = createNewFile;
          root.querySelector('[data-act="upload"]').onclick = () =>
            DragDropManager.pickAndImportFiles(state.currentPath).then(() => loadCurrentDirectory(false));
          root.querySelector('[data-act="mount-local"]').onclick = mountLocalHandler;

          viewSelect.onchange = () => {
            state.viewMode = viewSelect.value;
            renderViewport();
          };

          marqueeToggleBtn.onclick = () => {
            state.touchMarqueeMode = !state.touchMarqueeMode;
            marqueeToggleBtn.classList.toggle('active-toggle', state.touchMarqueeMode);
            Utils.toast(state.touchMarqueeMode ? '已开启触控强制框选模式' : '已恢复默认浏览/框选模式', 'info');
          };

          root.querySelector('[data-act="export-selected"]').onclick = () => {
            if (state.selectedPaths.size === 0) {
              Utils.toast('请先选中要导出的文件或文件夹', 'warn');
              return;
            }
            DragDropManager.exportPathsToLocal(Array.from(state.selectedPaths));
          };

          root.querySelector('[data-act="toggle-sidebar"]').onclick = () => {
            sidebarEl.classList.toggle('mobile-open');
          };

          globalSearchBtn.onclick = () => {
            state.globalSearch = !state.globalSearch;
            globalSearchBtn.classList.toggle('active-toggle', state.globalSearch);
            searchInput.placeholder = state.globalSearch ? '全局递归搜索全盘文件...' : '搜索当前目录...';
            triggerSearch();
          };

          const triggerSearch = Utils.debounce(async () => {
            const q = searchInput.value.trim();
            state.searchQuery = q;
            if (!q) {
              state.searchResults = null;
              await loadCurrentDirectory(false);
              return;
            }
            if (state.globalSearch) {
              state.searchResults = await fs.search(state.currentPath === '/' ? '/' : state.currentPath, q);
              await loadCurrentDirectory(false);
            } else {
              state.searchResults = null;
              await loadCurrentDirectory(false);
            }
          }, 260);

          searchInput.addEventListener('input', triggerSearch);

          // 初始化加载
          navigateTo(state.currentPath, false);
        }
      });
    }
  };

  /* =========================================================================
     MODULE 11: 记事本 & CSV/TSV 双视图表格编辑器 (NotepadApp)
     支持撤销重做、字体大小更改、自动保存回 OPFS/IDB、CSV/TSV 表格与文本双视图切换
     ========================================================================= */
  const NotepadApp = {
    async open(filePath = null, options = {}) {
      let currentPath = filePath ? Utils.normalizePath(filePath) : null;
      let content = '';
      if (currentPath) {
        try {
          content = await fs.readFile(currentPath, 'utf8');
        } catch (err) {
          Utils.toast(`读取文件失败: ${err.message}`, 'error');
          return;
        }
      }

      const ext = currentPath ? Utils.getExt(currentPath) : 'txt';
      const isStructuredTable = !options.forceText && (ext === 'csv' || ext === 'tsv');
      const delimiter = ext === 'tsv' ? '\t' : ',';

      const winId = Utils.uid('notepad');
      const state = {
        path: currentPath,
        content,
        fontSize: 14,
        wordWrap: true,
        viewMode: isStructuredTable ? 'table' : 'text', // 'table' | 'text'
        undoStack: [content],
        redoStack: [],
        dirty: false
      };

      WindowManager.createWindow({
        id: winId,
        title: `记事本 - ${currentPath ? Utils.basename(currentPath) : '未命名文稿'}`,
        icon: isStructuredTable ? 'table' : 'text',
        width: 780,
        height: 540,
        render: (bodyEl) => {
          bodyEl.innerHTML = `
            <div style="display:flex;flex-direction:column;height:100%;width:100%;">
              <div class="fe-toolbar">
                <button class="os-btn primary" data-act="save">保存 (Ctrl+S)</button>
                <button class="os-btn" data-act="save-as">另存为</button>
                <div class="taskbar-divider"></div>
                <button class="os-btn" data-act="undo">撤销</button>
                <button class="os-btn" data-act="redo">重做</button>
                <div class="taskbar-divider"></div>
                <button class="os-btn" data-act="font-dec">字号 A-</button>
                <button class="os-btn" data-act="font-inc">字号 A+</button>
                <button class="os-btn active-toggle" data-act="wrap">自动换行</button>
                ${isStructuredTable ? `
                  <div class="taskbar-divider"></div>
                  <button class="os-btn active-toggle" data-act="mode-table">表格视图</button>
                  <button class="os-btn" data-act="mode-text">文本视图</button>
                  <button class="os-btn" data-act="add-row">+ 添加行</button>
                ` : ''}
                <span data-role="save-status" style="margin-left:auto;font-size:11.5px;color:var(--text-secondary);">已就绪</span>
              </div>
              <div data-role="editor-stage" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;"></div>
              <div class="fe-statusbar" data-role="statusbar"></div>
            </div>
          `;

          const stageEl = bodyEl.querySelector('[data-role="editor-stage"]');
          const saveStatusEl = bodyEl.querySelector('[data-role="save-status"]');
          const statusbarEl = bodyEl.querySelector('[data-role="statusbar"]');

          // CSV/TSV 解析器（完整支持引号与转义）
          const parseDelimited = (text, sep) => {
            const rows = [];
            let row = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
              const ch = text[i];
              const next = text[i + 1];
              if (inQuotes) {
                if (ch === '"' && next === '"') {
                  cur += '"';
                  i++;
                } else if (ch === '"') {
                  inQuotes = false;
                } else {
                  cur += ch;
                }
              } else {
                if (ch === '"') {
                  inQuotes = true;
                } else if (ch === sep) {
                  row.push(cur);
                  cur = '';
                } else if (ch === '\r' && next === '\n') {
                  row.push(cur);
                  rows.push(row);
                  row = [];
                  cur = '';
                  i++;
                } else if (ch === '\n' || ch === '\r') {
                  row.push(cur);
                  rows.push(row);
                  row = [];
                  cur = '';
                } else {
                  cur += ch;
                }
              }
            }
            row.push(cur);
            if (row.length > 1 || row[0] !== '' || rows.length === 0) {
              rows.push(row);
            }
            return rows;
          };

          const serializeDelimited = (rows, sep) => {
            return rows.map(r =>
              r.map(cell => {
                const s = String(cell ?? '');
                if (s.includes(sep) || s.includes('"') || s.includes('\n')) {
                  return `"${s.replace(/"/g, '""')}"`;
                }
                return s;
              }).join(sep)
            ).join('\n');
          };

          const pushHistory = (newVal) => {
            if (state.undoStack[state.undoStack.length - 1] !== newVal) {
              state.undoStack.push(newVal);
              if (state.undoStack.length > 80) state.undoStack.shift();
              state.redoStack = [];
            }
          };

          const saveToFile = async (silent = false) => {
            if (!state.path) {
              if (!silent) await saveAsFile();
              return;
            }
            try {
              await fs.writeFile(state.path, state.content, { mtime: Date.now() });
              state.dirty = false;
              saveStatusEl.textContent = `已自动保存 (${Utils.formatDate(Date.now(), window.OSConfig?.use12Hour !== false)})`;
              if (!silent) Utils.toast(`已保存 ${Utils.basename(state.path)}`, 'success');
            } catch (err) {
              saveStatusEl.textContent = '保存失败';
              if (!silent) Utils.toast(`保存失败: ${err.message}`, 'error');
            }
          };

          const saveAsFile = async () => {
            const defaultPath = state.path || `/Desktop/新文稿.${ext}`;
            const target = await Utils.promptInput('另存为', '请输入保存路径：', defaultPath);
            if (!target || !target.trim()) return;
            state.path = Utils.normalizePath(target.trim());
            WindowManager.setWindowTitle(winId, `记事本 - ${Utils.basename(state.path)}`);
            await saveToFile(false);
          };

          const autoSave = Utils.debounce(() => {
            if (state.path) {
              saveToFile(true);
            }
          }, 600);

          const updateStats = () => {
            const lines = state.content.split('\n').length;
            const chars = state.content.length;
            statusbarEl.innerHTML = `
              <span>视图: ${state.viewMode === 'table' ? '结构化表格' : '纯文本'} | 字号: ${state.fontSize}px</span>
              <span>${lines} 行 · ${chars} 字符</span>
            `;
          };

          const renderStage = () => {
            stageEl.innerHTML = '';
            if (state.viewMode === 'table' && isStructuredTable) {
              const wrap = document.createElement('div');
              wrap.className = 'csv-table-wrap';
              const rows = parseDelimited(state.content, delimiter);
              const colCount = Math.max(1, ...rows.map(r => r.length));

              const table = document.createElement('table');
              table.className = 'csv-table';
              table.style.fontSize = `${state.fontSize}px`;

              const thead = document.createElement('thead');
              const headRow = document.createElement('tr');
              const headers = rows[0] || [];
              for (let c = 0; c < colCount; c++) {
                const th = document.createElement('th');
                const inp = document.createElement('input');
                inp.value = headers[c] ?? `列 ${c + 1}`;
                inp.style.fontWeight = '700';
                inp.oninput = () => {
                  rows[0][c] = inp.value;
                  state.content = serializeDelimited(rows, delimiter);
                  state.dirty = true;
                  saveStatusEl.textContent = '编辑中...';
                  autoSave();
                  updateStats();
                };
                th.appendChild(inp);
                headRow.appendChild(th);
              }
              thead.appendChild(headRow);
              table.appendChild(thead);

              const tbody = document.createElement('tbody');
              for (let r = 1; r < rows.length; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < colCount; c++) {
                  const td = document.createElement('td');
                  const inp = document.createElement('input');
                  inp.value = rows[r][c] ?? '';
                  inp.oninput = () => {
                    while (rows[r].length <= c) rows[r].push('');
                    rows[r][c] = inp.value;
                    state.content = serializeDelimited(rows, delimiter);
                    state.dirty = true;
                    saveStatusEl.textContent = '编辑中...';
                    autoSave();
                    updateStats();
                  };
                  td.appendChild(inp);
                  tr.appendChild(td);
                }
                tbody.appendChild(tr);
              }
              table.appendChild(tbody);
              wrap.appendChild(table);
              stageEl.appendChild(wrap);
            } else {
              const ta = document.createElement('textarea');
              ta.style.cssText = `
                flex: 1; width: 100%; height: 100%; resize: none; border: none; outline: none;
                padding: 14px 16px; background: var(--bg-input); color: var(--text-primary);
                font-family: var(--font-mono); font-size: ${state.fontSize}px; line-height: 1.65;
                white-space: ${state.wordWrap ? 'pre-wrap' : 'pre'}; overflow: auto;
              `;
              ta.value = state.content;
              ta.addEventListener('input', () => {
                state.content = ta.value;
                state.dirty = true;
                saveStatusEl.textContent = '编辑中...';
                pushHistory(state.content);
                autoSave();
                updateStats();
              });
              ta.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                  e.preventDefault();
                  saveToFile(false);
                }
              });
              stageEl.appendChild(ta);
            }
            updateStats();
          };

          bodyEl.querySelector('[data-act="save"]').onclick = () => saveToFile(false);
          bodyEl.querySelector('[data-act="save-as"]').onclick = saveAsFile;

          bodyEl.querySelector('[data-act="undo"]').onclick = () => {
            if (state.undoStack.length > 1) {
              const cur = state.undoStack.pop();
              state.redoStack.push(cur);
              state.content = state.undoStack[state.undoStack.length - 1];
              renderStage();
              autoSave();
            }
          };

          bodyEl.querySelector('[data-act="redo"]').onclick = () => {
            if (state.redoStack.length > 0) {
              const next = state.redoStack.pop();
              state.undoStack.push(next);
              state.content = next;
              renderStage();
              autoSave();
            }
          };

          bodyEl.querySelector('[data-act="font-dec"]').onclick = () => {
            state.fontSize = Math.max(11, state.fontSize - 2);
            renderStage();
          };
          bodyEl.querySelector('[data-act="font-inc"]').onclick = () => {
            state.fontSize = Math.min(28, state.fontSize + 2);
            renderStage();
          };

          const wrapBtn = bodyEl.querySelector('[data-act="wrap"]');
          wrapBtn.onclick = () => {
            state.wordWrap = !state.wordWrap;
            wrapBtn.classList.toggle('active-toggle', state.wordWrap);
            renderStage();
          };

          if (isStructuredTable) {
            const btnTable = bodyEl.querySelector('[data-act="mode-table"]');
            const btnText = bodyEl.querySelector('[data-act="mode-text"]');
            btnTable.onclick = () => {
              state.viewMode = 'table';
              btnTable.classList.add('active-toggle');
              btnText.classList.remove('active-toggle');
              renderStage();
            };
            btnText.onclick = () => {
              state.viewMode = 'text';
              btnText.classList.add('active-toggle');
              btnTable.classList.remove('active-toggle');
              renderStage();
            };
            bodyEl.querySelector('[data-act="add-row"]').onclick = () => {
              const rows = parseDelimited(state.content, delimiter);
              const cols = Math.max(1, rows[0]?.length || 1);
              rows.push(new Array(cols).fill(''));
              state.content = serializeDelimited(rows, delimiter);
              pushHistory(state.content);
              renderStage();
              autoSave();
            };
          }

          renderStage();
        }
      });
    }
  };

  /* =========================================================================
     MODULE 12: 专业 HTML / 多语言代码编辑器 (CodeEditorApp)
     基于 CodeMirror 5.65.16，支持多语言高亮、实时预览、保持光标格式化、查找替换、
     输入模式开关 (自动/电脑/手机)、左右/上下/单栏视图切换、双向导出与 Ctrl+S 保存
     ========================================================================= */
  const CodeEditorApp = {
    extToMode(ext) {
      const e = String(ext || '').toLowerCase();
      if (e === 'html' || e === 'htm') return 'htmlmixed';
      if (e === 'css') return 'css';
      if (e === 'js' || e === 'mjs' || e === 'cjs') return 'javascript';
      if (e === 'json') return 'application/json';
      if (e === 'md' || e === 'markdown') return 'markdown';
      if (e === 'xml' || e === 'svg') return 'xml';
      return 'null';
    },

    modeToLabel(mode) {
      const map = {
        htmlmixed: 'HTML',
        css: 'CSS',
        javascript: 'JavaScript',
        'application/json': 'JSON',
        markdown: 'Markdown',
        xml: 'XML / SVG',
        'null': '纯文本'
      };
      return map[mode] || 'HTML';
    },

    modeToExt(mode) {
      const map = {
        htmlmixed: 'html',
        css: 'css',
        javascript: 'js',
        'application/json': 'json',
        markdown: 'md',
        xml: 'xml',
        'null': 'txt'
      };
      return map[mode] || 'html';
    },

    /**
     * 智能代码格式化（支持 JSON / HTML / XML / SVG / CSS / JS）
     */
    formatCode(code, mode) {
      if (mode === 'application/json') {
        try {
          return JSON.stringify(JSON.parse(code), null, 2);
        } catch (_) {
          return code;
        }
      }

      if (mode === 'htmlmixed' || mode === 'xml') {
        const voidTags = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'param', 'source', 'track', 'wbr']);
        const tokens = code
          .replace(/>\s+</g, '><')
          .replace(/</g, '\n<')
          .replace(/>/g, '>\n')
          .split('\n')
          .map(s => s.trim())
          .filter(Boolean);

        let indent = 0;
        const out = [];
        for (const tok of tokens) {
          if (tok.startsWith('</')) {
            indent = Math.max(0, indent - 1);
            out.push('  '.repeat(indent) + tok);
          } else if (tok.startsWith('<') && !tok.startsWith('<!') && !tok.startsWith('<?')) {
            out.push('  '.repeat(indent) + tok);
            const tagMatch = tok.match(/^<([a-zA-Z0-9-]+)/);
            const tagName = tagMatch ? tagMatch[1].toLowerCase() : '';
            if (!tok.endsWith('/>') && !voidTags.has(tagName) && !tok.includes('</')) {
              indent++;
            }
          } else {
            out.push('  '.repeat(indent) + tok);
          }
        }
        return out.join('\n');
      }

      if (mode === 'css' || mode === 'javascript') {
        const raw = code
          .replace(/\r\n/g, '\n')
          .replace(/\{\s*/g, ' {\n')
          .replace(/;\s*/g, ';\n')
          .replace(/\s*\}\s*/g, '\n}\n');
        const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
        let indent = 0;
        const out = [];
        for (const line of lines) {
          if (line.startsWith('}')) indent = Math.max(0, indent - 1);
          out.push('  '.repeat(indent) + line);
          if (line.endsWith('{')) indent++;
        }
        return out.join('\n');
      }

      return code;
    },

      let initialMode = 'htmlmixed';

            </div>
          `;

          const workspaceEl = bodyEl.querySelector('[data-role="workspace"]');
          const editorPane = bodyEl.querySelector('[data-role="editor-pane"]');
          const resizerEl = bodyEl.querySelector('[data-role="resizer"]');
          const previewPane = bodyEl.querySelector('[data-role="preview-pane"]');

          const modeSelect = bodyEl.querySelector('[data-role="mode-select"]');

          const findBar = bodyEl.querySelector('[data-role="find-bar"]');

          const findCountEl = bodyEl.querySelector('[data-role="find-count"]');

          const stCursor = bodyEl.querySelector('[data-role="st-cursor"]');
          const stSelection = bodyEl.querySelector('[data-role="st-selection"]');
          const stCounts = bodyEl.querySelector('[data-role="st-counts"]');
          const stLang = bodyEl.querySelector('[data-role="st-lang"]');

          modeSelect.value = state.mode;
          layoutSelect.value = state.viewLayout;

          const getInputStyleOption = (modeKey) => {

          const updateStatusBar = () => {
            if (!cm) return;
            const cur = cm.getCursor();
            const sel = cm.getSelection();
            const val = cm.getValue();
            const lineCount = cm.lineCount();

            stCursor.textContent = `行 ${cur.line + 1}, 列 ${cur.ch + 1}`;
            stSelection.textContent = sel && sel.length > 0 ? `已选 ${sel.length} 字符` : '';
            stCounts.textContent = `总行数 ${lineCount} · 总字符 ${val.length}`;
            stLang.textContent = `语言: ${this.modeToLabel(state.mode)} | 编码: UTF-8`;
          };

          const buildPreviewHtml = (code, mode) => {
            if (mode === 'htmlmixed' || mode === 'xml') {
              if (mode === 'xml' && !code.toLowerCase().includes('<html')) {
                return `<!DOCTYPE html><html><body style="margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#111;color:#eee;">${code}</body></html>`;
              }
              return code;
            }
            if (mode === 'css') {
              return `<!DOCTYPE html><html><head><style>${code}</style></head><body><div class="preview-box"><h3>CSS 样式预览</h3><p>当前样式表已注入此预览沙盒文档。</p><button>示例按钮</button></div></body></html>`;
            }
            if (mode === 'javascript') {
              return `<!DOCTYPE html><html><body style="font-family:monospace;padding:16px;background:#111;color:#d6e0dc;"><h3>JavaScript 控制台输出</h3><pre id="out"></pre><script>const out=document.getElementById('out');const log=(...a)=>{out.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'\\n';};console.log=log;console.error=(...a)=>log('[ERR]',...a);try{${code}}catch(e){console.error(e.message)}<\/script></body></html>`;
            }
            if (mode === 'markdown') {

                .replace(/^### (.*$)/gim, '<h3>$1</h3>')

                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                .replace(/`([^`]+)`/gim, '<code style="background:#233;padding:2px 5px;border-radius:4px;">$1</code>')

          const refreshPreview = () => {
            if (!cm || state.viewLayout === 'code-only') return;

          const debouncedRefreshPreview = Utils.debounce(refreshPreview, 280);

          const saveToVfs = async () => {
            if (!cm) return;

            if (!targetPath) {

              const inputName = await Utils.promptInput('保存到虚拟文件系统', `将保存至 ${state.saveDir} 目录，请输入文件名：`, defaultName);
              if (!inputName || !inputName.trim()) return;

          const initCodeMirror = (valueText, cursorPos = null) => {

                lineNumbers: true,
                lineWrapping: true,
                styleActiveLine: true,
                inputStyle,
                tabSize: 2,
                indentUnit: 2,
                extraKeys: {
                  'Ctrl-S': () => saveToVfs(),
                  'Cmd-S': () => saveToVfs(),
                  'Ctrl-F': () => openFindBar(),
                  'Cmd-F': () => openFindBar(),
                  // 手机 contenteditable 模式下补全 Ctrl-A 为全选整个文档全文
                  'Ctrl-A': (instance) => instance.execCommand('selectAll'),

              });

              // 手机模式下若触发原生全选或长按全选辅助，确保选中全文
              const wrapper = cm.getWrapperElement();
              wrapper.addEventListener('keydown', (ev) => {

              cm.on('change', () => {

              setTimeout(() => cm && cm.refresh(), 50);
            } else {
              // 离线优雅降级内核
              textareaEl.style.cssText = 'width:100%;height:100%;background:#1A1E24;color:#E6EDF3;font-family:var(--font-mono);font-size:13.5px;padding:12px;border:none;outline:none;resize:none;';
              textareaEl.value = valueText;
              cm = {

                scrollIntoView: () => {},

              };
              textareaEl.addEventListener('input', () => { updateStatusBar(); debouncedRefreshPreview(); });
              textareaEl.addEventListener('keyup', updateStatusBar);
              textareaEl.addEventListener('click', updateStatusBar);
            }

            updateStatusBar();
            refreshPreview();
          };

          // 视图布局切换（左右分屏 / 上下分屏 / 仅代码 / 仅预览）
          const applyViewLayout = (layout) => {

            } else if (layout === 'code-only') {
              resizerEl.style.display = 'none';
              previewPane.style.display = 'none';
            } else if (layout === 'preview-only') {
              editorPane.style.display = 'none';
              resizerEl.style.display = 'none';
              refreshPreview();
            }
            if (cm && typeof cm.refresh === 'function') {
              setTimeout(() => cm.refresh(), 30);
            }
          };

          // 可拖拽分割条（Mouse & Touch）
          const startSplitDrag = (e) => {
            e.preventDefault();
            const isVert = state.viewLayout === 'vertical';
            const wsRect = workspaceEl.getBoundingClientRect();

            const onMove = (ev) => {
              const { x, y } = Utils.getClientXY(ev);
              let ratio = isVert
                ? (y - wsRect.top) / wsRect.height
                : (x - wsRect.left) / wsRect.width;
              ratio = Math.max(0.15, Math.min(0.85, ratio));
              editorPane.style.flex = `0 0 ${ratio * 100}%`;
              previewPane.style.flex = `1 1 0%`;
            };

            const onEnd = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onEnd);
              document.removeEventListener('touchmove', onMove);
              document.removeEventListener('touchend', onEnd);
              if (cm && typeof cm.refresh === 'function') cm.refresh();
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
          };

          resizerEl.addEventListener('mousedown', startSplitDrag);
          resizerEl.addEventListener('touchstart', startSplitDrag, { passive: false });

          // 语言切换
          modeSelect.onchange = () => {
            state.mode = modeSelect.value;
            if (cm) cm.setOption('mode', state.mode === 'null' ? null : state.mode);
            updateStatusBar();
            refreshPreview();
          };

          // 输入模式切换（自动 / 电脑 / 手机）
          inputModeSelect.onchange = () => {
            state.inputMode = inputModeSelect.value;
            const val = cm ? cm.getValue() : initialContent;
            const cur = cm ? cm.getCursor() : { line: 0, ch: 0 };
            initCodeMirror(val, cur);
            Utils.toast(`已切换输入模式为：${inputModeSelect.options[inputModeSelect.selectedIndex].text}`, 'info');
          };

          layoutSelect.onchange = () => applyViewLayout(layoutSelect.value);

          // 格式化代码并保持光标位置不变
          bodyEl.querySelector('[data-act="format"]').onclick = () => {
            if (!cm) return;
            const oldText = cm.getValue();
            const cur = cm.getCursor();
            const lines = oldText.split('\n');
            let offset = 0;
            for (let i = 0; i < cur.line; i++) offset += lines[i].length + 1;
            offset += cur.ch;

            // 计算光标前非空白字符锚点数量
            let nonWsAnchor = 0;
            for (let i = 0; i < offset; i++) {
              if (!/\s/.test(oldText[i])) nonWsAnchor++;
            }

            const formatted = this.formatCode(oldText, state.mode);
            if (formatted === oldText) return;

            // 在新文本中重新定位到第 nonWsAnchor 个非空白字符处
            let seen = 0;
            let newOffset = 0;
            while (newOffset < formatted.length && seen < nonWsAnchor) {
              if (!/\s/.test(formatted[newOffset])) seen++;
              newOffset++;
            }

            const beforeNew = formatted.slice(0, newOffset);
            const newLines = beforeNew.split('\n');
            const newCursor = {
              line: newLines.length - 1,
              ch: newLines[newLines.length - 1].length
            };

            cm.setValue(formatted);
            cm.setCursor(newCursor);
            cm.scrollIntoView(newCursor, 80);
            cm.focus();
            Utils.toast('代码已格式化并保持光标位置', 'success');
          };

          // 查找与替换逻辑
          const openFindBar = () => {
            findBar.classList.add('open');
            findInput.focus();
            findInput.select();
          };

          const computeMatches = () => {
            const q = findInput.value;
            state.findMatches = [];
            if (!q || !cm) {
              findCountEl.textContent = '';
              return;
            }
            const text = cm.getValue();
            const lowText = text.toLowerCase();
            const lowQ = q.toLowerCase();
            let idx = 0;
            while ((idx = lowText.indexOf(lowQ, idx)) !== -1) {
              state.findMatches.push({ start: idx, end: idx + q.length });
              idx += q.length;
            }
            findCountEl.textContent = state.findMatches.length > 0 ? `共 ${state.findMatches.length} 处匹配` : '无匹配';
          };

          const selectMatchAt = (index) => {
            if (!cm || state.findMatches.length === 0) return;
            state.findIndex = (index + state.findMatches.length) % state.findMatches.length;
            const m = state.findMatches[state.findIndex];
            const text = cm.getValue();
            const posFromIdx = (offset) => {
              const sub = text.slice(0, offset).split('\n');
              return { line: sub.length - 1, ch: sub[sub.length - 1].length };
            };
            const from = posFromIdx(m.start);
            const to = posFromIdx(m.end);
            if (typeof cm.setSelection === 'function') {
              cm.setSelection(from, to);
            } else {
              cm.setCursor(from);
            }
            cm.scrollIntoView(from, 80);
            findCountEl.textContent = `第 ${state.findIndex + 1} / ${state.findMatches.length} 处`;
          };

          findInput.addEventListener('input', () => {
            computeMatches();
            if (state.findMatches.length > 0) selectMatchAt(0);
          });

          bodyEl.querySelector('[data-act="find"]').onclick = openFindBar;
          bodyEl.querySelector('[data-act="find-close"]').onclick = () => findBar.classList.remove('open');
          bodyEl.querySelector('[data-act="find-next"]').onclick = () => {
            computeMatches();
            selectMatchAt(state.findIndex + 1);
          };
          bodyEl.querySelector('[data-act="find-prev"]').onclick = () => {
            computeMatches();
            selectMatchAt(state.findIndex - 1);
          };
          bodyEl.querySelector('[data-act="replace-one"]').onclick = () => {
            if (!cm) return;
            const sel = cm.getSelection();
            if (sel && sel.toLowerCase() === findInput.value.toLowerCase()) {
              cm.replaceSelection(replaceInput.value);
              computeMatches();
              if (state.findMatches.length > 0) selectMatchAt(state.findIndex);
            } else {
              computeMatches();
              selectMatchAt(0);
            }
          };
          bodyEl.querySelector('[data-act="replace-all"]').onclick = () => {
            if (!cm || !findInput.value) return;
            const q = findInput.value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const newText = cm.getValue().replace(new RegExp(q, 'gi'), replaceInput.value);
            cm.setValue(newText);
            computeMatches();
            Utils.toast('已完成全部替换', 'success');
          };

          // 导入本地文件
          bodyEl.querySelector('[data-act="import"]').onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.onchange = async () => {
              const f = inp.files?.[0];
              if (!f) return;
              const text = await f.text();
              const ext = Utils.getExt(f.name);
              const detectedMode = this.extToMode(ext);
              state.mode = detectedMode;
              state.filename = f.name;
              state.sourcePath = null;
              modeSelect.value = detectedMode;
              if (cm) {
                cm.setOption('mode', detectedMode === 'null' ? null : detectedMode);
                cm.setValue(text);
              }
              WindowManager.setWindowTitle(winId, `HTML 网页代码编辑器 - ${f.name}`);
              updateStatusBar();
              refreshPreview();
              Utils.toast(`已导入 ${f.name}`, 'success');
            };
            inp.click();
          };

          // 导出文件（支持自定义命名 + 导出到现实桌面或虚拟桌面）
          bodyEl.querySelector('[data-act="export"]').onclick = async () => {
            if (!cm) return;
            const defaultExt = this.modeToExt(state.mode);
            const stem = state.filename.replace(/\.[^.]+$/, '') || '网页作品';
            const suggestedName = `${stem}.${defaultExt}`;

            const box = document.createElement('div');
            box.style.display = 'flex';
            box.style.flexDirection = 'column';
            box.style.gap = '10px';
            box.innerHTML = `
              <div>
                <label style="display:block;margin-bottom:5px;color:var(--text-secondary);">导出文件名（已根据当前语言匹配扩展名）：</label>
                <input type="text" class="os-input" id="ce-export-name" value="${Utils.escapeHtml(suggestedName)}" />
              </div>
              <div>
                <label style="display:block;margin-bottom:5px;color:var(--text-secondary);">选择导出目标位置：</label>
                <select class="os-select" id="ce-export-target" style="width:100%;">
                  <option value="real">导出到现实桌面 (浏览器下载文件)</option>
                  <option value="vfs">导出到虚拟桌面 (/Desktop)</option>
                  <option value="both">同时导出到现实桌面与虚拟桌面</option>
                </select>
              </div>
            `;

            const confirmed = await Utils.showModal({
              title: '导出代码文件',
              content: box,
              buttons: [
                { label: '取消', value: false },
                {
                  label: '确认导出',
                  primary: true,
                  onClick: () => ({
                    filename: box.querySelector('#ce-export-name').value.trim() || suggestedName,
                    target: box.querySelector('#ce-export-target').value
                  })
                }
              ]
            });

            if (!confirmed) return;
            const codeText = cm.getValue();
            if (confirmed.target === 'real' || confirmed.target === 'both') {
              const blob = new Blob([codeText], { type: Utils.getMimeType(confirmed.filename) });
              Utils.triggerBrowserDownload(blob, confirmed.filename);
            }
            if (confirmed.target === 'vfs' || confirmed.target === 'both') {
              const dest = Utils.joinPath('/Desktop', confirmed.filename);
              await fs.writeFile(dest, codeText, { mtime: Date.now() });
              DesktopOS.refreshDesktop();
            }
            Utils.toast(`已成功导出 ${confirmed.filename}`, 'success');
          };

          bodyEl.querySelector('[data-act="new"]').onclick = async () => {
            state.sourcePath = null;
            state.filename = `新建文档.${this.modeToExt(state.mode)}`;
            if (cm) cm.setValue('');
            WindowManager.setWindowTitle(winId, `HTML 网页代码编辑器 - ${state.filename}`);
          };

          bodyEl.querySelector('[data-act="save"]').onclick = saveToVfs;
          bodyEl.querySelector('[data-act="undo"]').onclick = () => cm && cm.undo();
          bodyEl.querySelector('[data-act="redo"]').onclick = () => cm && cm.redo();
          bodyEl.querySelector('[data-act="select-all"]').onclick = () => {
            if (!cm) return;
            cm.execCommand('selectAll');
            cm.focus();
          };
          bodyEl.querySelector('[data-act="copy-all"]').onclick = async () => {
            if (!cm) return;
            try {
              await navigator.clipboard.writeText(cm.getValue());
              Utils.toast('已复制全部代码内容', 'success');
            } catch (_) {
              cm.execCommand('selectAll');
              document.execCommand('copy');
              Utils.toast('已复制全部代码内容', 'success');
            }
          };
          bodyEl.querySelector('[data-act="clear"]').onclick = () => {
            if (cm) cm.setValue('');
          };
          bodyEl.querySelector('[data-act="refresh-preview"]').onclick = refreshPreview;
          bodyEl.querySelector('[data-act="open-new-tab"]').onclick = () => {
            if (!cm) return;
            const html = buildPreviewHtml(cm.getValue(), state.mode);
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 15000);
          };

          applyViewLayout(state.viewLayout);
          initCodeMirror(initialContent);
        }
      });
    }
  };

  /* =========================================================================
     MODULE 13: 漫画阅读器 (MangaViewerApp) & 图片查看器 (ImageViewerApp)
     严格条漫无缝滚动、自然数字排序、并行读取按序插入、向上高度增量补偿防抖动、
     PC Pointer Events 手抓阻尼滑行 (FRICTION=0.96)、真全屏隐蔽退出按钮
     ========================================================================= */
  const MangaViewerApp = {
    async open(imagePath) {
      const targetNorm = Utils.normalizePath(imagePath);
      const dirPath = Utils.dirname(targetNorm);

      let dirEntries = [];
      try {
        dirEntries = await fs.readdir(dirPath);
      } catch (err) {
        Utils.toast(`漫画阅读器读取目录失败: ${err.message}`, 'error');
        return;
      }

      const imageEntries = dirEntries
        .filter(item => item.type === 'file' && Utils.isImageExt(Utils.getExt(item.name)))
        .sort((a, b) => Utils.naturalCompare(a.name, b.name));

      if (imageEntries.length === 0) {
        Utils.toast('该目录下没有可阅读的图片文件', 'warn');
        return;
      }

      const targetIndex = Math.max(0, imageEntries.findIndex(item => item.path === targetNorm));
      const winId = Utils.uid('manga');
      const createdBlobUrls = [];
      let inertiaRaf = null;
      let isFullscreen = false;

      WindowManager.createWindow({
        id: winId,
        title: `漫画阅读器 - ${Utils.basename(dirPath)} (${targetIndex + 1}/${imageEntries.length})`,
        icon: 'manga',
        width: 880,
        height: 660,
        onClose: () => {
          cancelAnimationFrame(inertiaRaf);
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }
          createdBlobUrls.forEach(u => URL.revokeObjectURL(u));
        },
        render: (bodyEl, winObj) => {
          bodyEl.innerHTML = `
            <div class="manga-root" data-role="manga-root">
              <div class="manga-toolbar">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <span style="font-weight:600;color:var(--gold);white-space:nowrap;">条漫连载</span>
                  <span data-role="progress-text" style="font-size:12px;color:#B8C4C2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    正在加载 ${imageEntries.length} 页...
                  </span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                  <button class="os-btn" data-act="switch-viewer" style="height:28px;font-size:12px;">切换单图查看器</button>
                  <button class="os-btn primary" data-act="fullscreen" style="height:28px;font-size:12px;">全屏沉浸阅读</button>
                </div>
              </div>

              <div class="manga-viewport" data-role="viewport">
                <div class="manga-stream" data-role="stream"></div>
              </div>

              <button class="manga-fs-exit" data-act="exit-fs" title="退出全屏阅读">${SVGIcons.get('winClose', 16)}</button>
            </div>
          `;

          const rootEl = bodyEl.querySelector('[data-role="manga-root"]');
          const viewportEl = bodyEl.querySelector('[data-role="viewport"]');
          const streamEl = bodyEl.querySelector('[data-role="stream"]');
          const progressText = bodyEl.querySelector('[data-role="progress-text"]');
          const fsBtn = bodyEl.querySelector('[data-act="fullscreen"]');
          const exitFsBtn = bodyEl.querySelector('[data-act="exit-fs"]');

          // 1. 按自然排序顺序预先创建所有占位容器（保证顺序绝对一致）
          const pageNodes = imageEntries.map((entry, idx) => {
            const item = document.createElement('div');
            item.className = 'manga-page-item skeleton';
            item.dataset.index = String(idx);
            item.innerHTML = `<span style="font-size:12px;color:#5A686C;">第 ${idx + 1} 页 · ${Utils.escapeHtml(entry.name)}</span>`;
            streamEl.appendChild(item);
            return item;
          });

          // 2. 立即定位到用户点击的那一张图片
          const scrollToTargetPage = () => {
            const targetNode = pageNodes[targetIndex];
            if (targetNode) {
              viewportEl.scrollTop = targetNode.offsetTop;
            }
          };
          requestAnimationFrame(scrollToTargetPage);

          // 3. 并行读取目录下所有图片二进制，按排序索引注入，并执行上方高度增量补偿防抖动
          let loadedCount = 0;
          let failedCount = 0;

          const loadPageAt = async (idx) => {
            const entry = imageEntries[idx];
            const itemEl = pageNodes[idx];
            try {
              const buf = await fs.readFile(entry.path);
              const blob = new Blob([buf], { type: Utils.getMimeType(entry.name) });
              const url = URL.createObjectURL(blob);
              createdBlobUrls.push(url);

              const img = document.createElement('img');
              img.alt = entry.name;
              img.src = url;
              await img.decode().catch(() => {});

              // 记录撑开前的高度与位置，计算高度增量补偿 scrollTop += deltaH
              const prevHeight = itemEl.offsetHeight;
              const itemTopBefore = itemEl.offsetTop;
              const currentScroll = viewportEl.scrollTop;

              itemEl.classList.remove('skeleton');
              itemEl.innerHTML = '';
              itemEl.appendChild(img);

              const newHeight = itemEl.offsetHeight;
              const deltaH = newHeight - prevHeight;

              // 如果此图片在当前阅读视口上方，补偿滚动偏移，防止画面跳动抖动
              if (deltaH !== 0 && itemTopBefore < currentScroll + viewportEl.clientHeight * 0.35) {
                viewportEl.scrollTop += deltaH;
              }
              loadedCount++;
            } catch (_) {
              failedCount++;
              itemEl.classList.remove('skeleton');
              itemEl.style.minHeight = '120px';
              itemEl.innerHTML = `<span style="font-size:12px;color:#8E524D;">第 ${idx + 1} 页 (${Utils.escapeHtml(entry.name)}) 读取失败，已跳过</span>`;
            } finally {
              const done = loadedCount + failedCount;
              progressText.textContent = done >= imageEntries.length
                ? `共 ${imageEntries.length} 页${failedCount > 0 ? ` (${failedCount} 页跳过)` : ''}`
                : `已载入 ${done}/${imageEntries.length} 页...`;
            }
          };

          // 并发读取所有图片（限制并发度为 6 兼顾速度与内存稳定）
          const concurrency = 6;
          let cursor = 0;
          const worker = async () => {
            while (cursor < imageEntries.length) {
              const myIdx = cursor++;
              await loadPageAt(myIdx);
            }
          };
          Promise.all(Array.from({ length: Math.min(concurrency, imageEntries.length) }, worker)).then(() => {
            // 如果用户尚未手动滚动，确保精准停留在目标页
            if (targetIndex > 0 && Math.abs(viewportEl.scrollTop - pageNodes[targetIndex].offsetTop) < 600) {
              scrollToTargetPage();
            }
          });

          // 滚动时动态更新标题栏当前页码
          viewportEl.addEventListener('scroll', () => {
            const midY = viewportEl.scrollTop + viewportEl.clientHeight * 0.4;
            for (let i = 0; i < pageNodes.length; i++) {
              const node = pageNodes[i];
              if (node.offsetTop <= midY && node.offsetTop + node.offsetHeight >= midY) {
                WindowManager.setWindowTitle(winId, `漫画阅读器 - ${Utils.basename(dirPath)} (${i + 1}/${imageEntries.length})`);
                break;
              }
            }
          }, { passive: true });

          // 4. PC 端 Pointer Events 手抓上下拖拽 + setPointerCapture + FRICTION = 0.96 物理阻尼滑行
          let isGrabbing = false;
          let lastPointerY = 0;
          let velocity = 0;
          const FRICTION = 0.96;

          const startInertia = () => {
            cancelAnimationFrame(inertiaRaf);
            const step = () => {
              if (Math.abs(velocity) < 0.35) {
                velocity = 0;
                return;
              }
              const prev = viewportEl.scrollTop;
              viewportEl.scrollTop -= velocity;
              velocity *= FRICTION;
              if (viewportEl.scrollTop !== prev) {
                inertiaRaf = requestAnimationFrame(step);
              }
            };
            inertiaRaf = requestAnimationFrame(step);
          };

          viewportEl.addEventListener('pointerdown', (e) => {
            // 触控设备走合成器原生 120fps 滚动，PC 鼠标走手抓拖拽
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            isGrabbing = true;
            lastPointerY = e.clientY;
            velocity = 0;
            cancelAnimationFrame(inertiaRaf);
            viewportEl.classList.add('grabbing');
            try { viewportEl.setPointerCapture(e.pointerId); } catch (_) {}
          });

          viewportEl.addEventListener('pointermove', (e) => {
            if (!isGrabbing) return;
            const dy = e.clientY - lastPointerY;
            lastPointerY = e.clientY;
            velocity = dy;
            viewportEl.scrollTop -= dy;
          });

          const endGrab = (e) => {
            if (!isGrabbing) return;
            isGrabbing = false;
            viewportEl.classList.remove('grabbing');
            try {
              if (viewportEl.hasPointerCapture(e.pointerId)) {
                viewportEl.releasePointerCapture(e.pointerId);
              }
            } catch (_) {}
            if (Math.abs(velocity) > 1.2) {
              startInertia();
            }
          };

          viewportEl.addEventListener('pointerup', endGrab);
          viewportEl.addEventListener('pointercancel', endGrab);

          // 5. 真全屏沉浸模式（兼容浏览器原生 Fullscreen API 进入与退出两条路径）
          const setFullscreenState = (active) => {
            isFullscreen = active;
            rootEl.classList.toggle('is-fullscreen', active);
          };

          const enterFullscreen = async () => {
            setFullscreenState(true);
            try {
              if (rootEl.requestFullscreen) {
                await rootEl.requestFullscreen();
              } else if (rootEl.webkitRequestFullscreen) {
                await rootEl.webkitRequestFullscreen();
              }
            } catch (_) {
              // 某些内嵌预览环境不允许原生 Fullscreen 时，CSS 固定全屏样式依然保证 100% 沉浸全屏
            }
          };

          const exitFullscreen = async () => {
            setFullscreenState(false);
            try {
              if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) await document.exitFullscreen();
                else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
              }
            } catch (_) {}
          };

          const onFsChange = () => {
            const nativeFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            if (!nativeFs && isFullscreen) {
              setFullscreenState(false);
            }
          };
          document.addEventListener('fullscreenchange', onFsChange);
          document.addEventListener('webkitfullscreenchange', onFsChange);

          fsBtn.onclick = enterFullscreen;
          exitFsBtn.onclick = exitFullscreen;

          bodyEl.querySelector('[data-act="switch-viewer"]').onclick = () => {
            WindowManager.closeWindow(winId);
            ImageViewerApp.open(targetNorm);
          };
        }
      });
    }
  };

  /* 独立图片查看器 (支持缩放、旋转、上下张切换、设为壁纸) */
  const ImageViewerApp = {
    async open(imagePath) {
      const targetNorm = Utils.normalizePath(imagePath);
      const dirPath = Utils.dirname(targetNorm);
      let siblings = [];
      try {
        const list = await fs.readdir(dirPath);
        siblings = list
          .filter(i => i.type === 'file' && Utils.isImageExt(Utils.getExt(i.name)))
          .sort((a, b) => Utils.naturalCompare(a.name, b.name));
      } catch (_) {
        siblings = [{ name: Utils.basename(targetNorm), path: targetNorm, type: 'file' }];
      }

      let curIdx = Math.max(0, siblings.findIndex(x => x.path === targetNorm));
      let scale = 1;
      let rotate = 0;
      let currentUrl = null;
      const winId = Utils.uid('imgviewer');

      WindowManager.createWindow({
        id: winId,
        title: `图片查看器 - ${Utils.basename(targetNorm)}`,
        icon: 'image',
        width: 820,
        height: 580,
        onClose: () => {

                <button class="os-btn" data-act="zoom-reset">1:1 原图</button>

                <button class="os-btn primary" data-act="set-wallpaper">设为桌面壁纸</button>
                <button class="os-btn" data-act="open-manga">条漫阅读模式</button>
              </div>
              <div data-role="canvas-box" style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;">
                <img data-role="img" style="max-width:100%;max-height:100%;object-fit:contain;transition:transform 0.18s ease;box-shadow:0 12px 36px rgba(0,0,0,0.7);" />
              </div>
              <div class="fe-statusbar" data-role="info"></div>
            </div>
          `;

          const imgEl = bodyEl.querySelector('[data-role="img"]');
          const infoEl = bodyEl.querySelector('[data-role="info"]');
          const boxEl = bodyEl.querySelector('[data-role="canvas-box"]');

          const applyTransform = () => {
            imgEl.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
            infoEl.querySelector('[data-role="zoom-label"]').textContent = `缩放: ${Math.round(scale * 100)}% | 旋转: ${rotate}°`;
          };

          const loadAt = async (idx) => {
            curIdx = (idx + siblings.length) % siblings.length;
            const item = siblings[curIdx];
            scale = 1;
            rotate = 0;
            if (currentUrl) URL.revokeObjectURL(currentUrl);
            const buf = await fs.readFile(item.path);
            const blob = new Blob([buf], { type: Utils.getMimeType(item.name) });
            currentUrl = URL.createObjectURL(blob);
            imgEl.src = currentUrl;
            WindowManager.setWindowTitle(winId, `图片查看器 - ${item.name}`);
            infoEl.innerHTML = `
              <span>${Utils.escapeHtml(item.name)} (${curIdx + 1}/${siblings.length})</span>
              <span data-role="zoom-label">缩放: 100% | 旋转: 0°</span>
            `;
            applyTransform();
          };

          boxEl.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = Math.max(0.15, Math.min(6, scale + (e.deltaY < 0 ? 0.15 : -0.15)));
            applyTransform();
          }, { passive: false });

          bodyEl.querySelector('[data-act="prev"]').onclick = () => loadAt(curIdx - 1);
          bodyEl.querySelector('[data-act="next"]').onclick = () => loadAt(curIdx + 1);
          bodyEl.querySelector('[data-act="zoom-in"]').onclick = () => { scale = Math.min(6, scale + 0.25); applyTransform(); };
          bodyEl.querySelector('[data-act="zoom-out"]').onclick = () => { scale = Math.max(0.15, scale - 0.25); applyTransform(); };
          bodyEl.querySelector('[data-act="zoom-reset"]').onclick = () => { scale = 1; rotate = 0; applyTransform(); };
          bodyEl.querySelector('[data-act="rotate"]').onclick = () => { rotate = (rotate + 90) % 360; applyTransform(); };
          bodyEl.querySelector('[data-act="set-wallpaper"]').onclick = () => DesktopOS.setCustomWallpaperFromVfs(siblings[curIdx].path);
          bodyEl.querySelector('[data-act="open-manga"]').onclick = () => {
            const p = siblings[curIdx].path;
            WindowManager.closeWindow(winId);
            MangaViewerApp.open(p);
          };

          loadAt(curIdx);
        }
      });
    }
  };

  /* =========================================================================
     MODULE 14: 影音播放器 (MediaPlayerApp)
     支持音频与视频播放、同目录播放列表、倍速、循环、Web Audio 山峦频谱可视化
     ========================================================================= */
  const MediaPlayerApp = {
    async open(mediaPath) {
      const norm = Utils.normalizePath(mediaPath);
      const dir = Utils.dirname(norm);
      let playlist = [];
      try {
        const list = await fs.readdir(dir);
        playlist = list
          .filter(i => i.type === 'file' && (Utils.isAudioExt(Utils.getExt(i.name)) || Utils.isVideoExt(Utils.getExt(i.name))))
          .sort((a, b) => Utils.naturalCompare(a.name, b.name));
      } catch (_) {
        playlist = [{ name: Utils.basename(norm), path: norm, type: 'file' }];
      }

      let curIdx = Math.max(0, playlist.findIndex(x => x.path === norm));
      let mediaUrl = null;
      let audioCtx = null;
      let spectrumRaf = null;
      const winId = Utils.uid('media');

      WindowManager.createWindow({
        id: winId,
        title: `影音雅乐 - ${Utils.basename(norm)}`,
        icon: Utils.isVideoExt(Utils.getExt(norm)) ? 'video' : 'audio',
        width: 780,
        height: 520,
        onClose: () => {
          cancelAnimationFrame(spectrumRaf);
          if (mediaUrl) URL.revokeObjectURL(mediaUrl);
          if (audioCtx) {
            try { audioCtx.close(); } catch (_) {}
          }
        },
        render: (bodyEl) => {
          bodyEl.innerHTML = `
            <div style="display:flex;height:100%;background:#0A1114;color:#EDE6D6;">
              <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
                <div data-role="stage" style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,#162B32 0%,#080D10 100%);">
                  <video data-role="video" controls style="width:100%;height:100%;display:none;background:#000;"></video>
                  <div data-role="audio-ui" style="width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;">
                    <div style="width:110px;height:110px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:rgba(46,139,153,0.18);box-shadow:0 0 32px rgba(46,139,153,0.35);">
                      ${SVGIcons.get('audio', 54)}
                    </div>
                    <div data-role="track-title" style="font-size:16px;font-weight:700;color:var(--gold);text-align:center;"></div>
                    <canvas data-role="spectrum" width="520" height="110" style="width:100%;max-width:520px;height:110px;"></canvas>
                    <audio data-role="audio" controls style="width:100%;max-width:480px;"></audio>
                  </div>
                </div>
                <div class="fe-toolbar" style="background:rgba(14,22,26,0.94);border-top:1px solid var(--border-subtle);border-bottom:none;">
                  <button class="os-btn" data-act="prev">上一曲</button>
                  <button class="os-btn" data-act="next">下一曲</button>
                  <select class="os-select" data-act="rate">
                    <option value="0.75">倍速: 0.75x</option>
                    <option value="1" selected>倍速: 1.0x</option>
                    <option value="1.25">倍速: 1.25x</option>
                    <option value="1.5">倍速: 1.5x</option>
                    <option value="2">倍速: 2.0x</option>
                  </select>
                  <button class="os-btn" data-act="toggle-list" style="margin-left:auto;">播放列表 (${playlist.length})</button>
                </div>
              </div>
              <div data-role="playlist-pane" style="width:210px;border-left:1px solid var(--border-subtle);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;background:rgba(12,19,23,0.9);"></div>
            </div>
          `;

          const videoEl = bodyEl.querySelector('[data-role="video"]');
          const audioEl = bodyEl.querySelector('[data-role="audio"]');
          const audioUi = bodyEl.querySelector('[data-role="audio-ui"]');
          const trackTitle = bodyEl.querySelector('[data-role="track-title"]');
          const spectrumCanvas = bodyEl.querySelector('[data-role="spectrum"]');
          const playlistPane = bodyEl.querySelector('[data-role="playlist-pane"]');
          const rateSelect = bodyEl.querySelector('[data-act="rate"]');

          let analyser = null;
          const setupAudioSpectrum = () => {
            if (audioCtx) return;
            try {
              const Ctx = window.AudioContext || window.webkitAudioContext;
              audioCtx = new Ctx();
              const src = audioCtx.createMediaElementSource(audioEl);
              analyser = audioCtx.createAnalyser();
              analyser.fftSize = 128;
              src.connect(analyser);
              analyser.connect(audioCtx.destination);

              const ctx2d = spectrumCanvas.getContext('2d');
              const dataArr = new Uint8Array(analyser.frequencyBinCount);
              const draw = () => {
                spectrumRaf = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArr);
                const w = spectrumCanvas.width;
                const h = spectrumCanvas.height;
                ctx2d.clearRect(0, 0, w, h);

                // 绘制青绿山峦频谱曲线
                ctx2d.beginPath();
                ctx2d.moveTo(0, h);
                const step = w / (dataArr.length - 1);
                for (let i = 0; i < dataArr.length; i++) {
                  const val = dataArr[i] / 255;
                  const x = i * step;
                  const y = h - val * (h - 12);
                  ctx2d.lineTo(x, y);
                }
                ctx2d.lineTo(w, h);
                ctx2d.closePath();
                const grad = ctx2d.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, 'rgba(212, 163, 73, 0.72)');
                grad.addColorStop(0.5, 'rgba(46, 139, 153, 0.55)');
                grad.addColorStop(1, 'rgba(16, 30, 35, 0.1)');
                ctx2d.fillStyle = grad;
                ctx2d.fill();
              };
              draw();
            } catch (_) {}
          };

          const renderPlaylist = () => {
            playlistPane.innerHTML = `<div style="font-size:11.5px;color:var(--text-muted);padding:4px 6px;">同目录曲目列表</div>`;
            playlist.forEach((item, idx) => {
              const row = document.createElement('div');
              row.className = `fe-tree-item ${idx === curIdx ? 'active' : ''}`;
              row.textContent = item.name;
              row.title = item.name;
              row.onclick = () => playAt(idx);
              playlistPane.appendChild(row);
            });
          };

          const playAt = async (idx) => {
            curIdx = (idx + playlist.length) % playlist.length;
            const item = playlist[curIdx];
            if (mediaUrl) URL.revokeObjectURL(mediaUrl);

            videoEl.pause();
            audioEl.pause();

            const buf = await fs.readFile(item.path);
            const blob = new Blob([buf], { type: Utils.getMimeType(item.name) });
            mediaUrl = URL.createObjectURL(blob);

            const isVid = Utils.isVideoExt(Utils.getExt(item.name));
            if (isVid) {
              audioUi.style.display = 'none';
              videoEl.style.display = 'block';
              videoEl.src = mediaUrl;
              videoEl.playbackRate = Number(rateSelect.value);
              videoEl.play().catch(() => {});
            } else {
              videoEl.style.display = 'none';
              audioUi.style.display = 'flex';
              trackTitle.textContent = item.name;
              audioEl.src = mediaUrl;
              audioEl.playbackRate = Number(rateSelect.value);
              setupAudioSpectrum();
              if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
              audioEl.play().catch(() => {});
            }

            WindowManager.setWindowTitle(winId, `影音雅乐 - ${item.name}`);
            renderPlaylist();
          };

          videoEl.onended = () => playAt(curIdx + 1);
          audioEl.onended = () => playAt(curIdx + 1);

          bodyEl.querySelector('[data-act="prev"]').onclick = () => playAt(curIdx - 1);
          bodyEl.querySelector('[data-act="next"]').onclick = () => playAt(curIdx + 1);
          rateSelect.onchange = () => {
            const r = Number(rateSelect.value);
            videoEl.playbackRate = r;
            audioEl.playbackRate = r;
          };
          bodyEl.querySelector('[data-act="toggle-list"]').onclick = () => {
            playlistPane.style.display = playlistPane.style.display === 'none' ? 'flex' : 'none';
          };

          playAt(curIdx);
        }
      });
    }
  };

          const navigate = async (rawUrl, push = true) => {
            let target = String(rawUrl || '').trim();
            if (!target) target = 'danqing://home';
            if (!target.startsWith('danqing://') && !target.startsWith('vfs://') && !/^https?:\/\//i.test(target)) {
              if (target.startsWith('/')) target = `vfs://${target}`;
              else target = `https://${target}`;
            }

            addrInput.value = target;
            if (push) {
              state.history = state.history.slice(0, state.index + 1);
              state.history.push(target);
              state.index = state.history.length - 1;
            }

            veil.classList.remove('hidden');
            if (currentBlobUrl) {
              URL.revokeObjectURL(currentBlobUrl);
              currentBlobUrl = null;

              editSrcBtn.style.display = 'none';

              const p = Utils.normalizePath(target.slice(6));
              state.currentVfsPath = p;
              editSrcBtn.style.display = 'inline-flex';
              try {
                const html = await fs.readFile(p, 'utf8');
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });

                frame.src = currentBlobUrl;

                Utils.toast(`加载本地网页失败: ${err.message}`, 'error');
                veil.classList.add('hidden');
              }
            } else {
              state.currentVfsPath = null;
              editSrcBtn.style.display = 'none';
              frame.src = target;
              WindowManager.setWindowTitle(winId, `司南浏览器 - ${target}`);
            }

          frame.onload = () => setTimeout(() => veil.classList.add('hidden'), 100);

            if (ev.data && ev.data.type === 'danqing-nav' && ev.source === frame.contentWindow) {
              navigate(ev.data.url);
            }
          };
          window.addEventListener('message', onMsg);

          bodyEl.querySelector('[data-act="back"]').onclick = () => {
            if (state.index > 0) {
              state.index--;
              navigate(state.history[state.index], false);
            }
          };
          bodyEl.querySelector('[data-act="forward"]').onclick = () => {
            if (state.index < state.history.length - 1) {
              state.index++;
              navigate(state.history[state.index], false);
            }
          };
          bodyEl.querySelector('[data-act="refresh"]').onclick = () => navigate(state.history[state.index], false);
          bodyEl.querySelector('[data-act="home"]').onclick = () => navigate('danqing://home');

          editSrcBtn.onclick = () => {
            if (state.currentVfsPath) CodeEditorApp.open(state.currentVfsPath);
          };

          navigate(url, false);
        }
      });
    }

  const CalculatorApp = {
    open() {
      const winId = 'app_calculator';

          const keypad = bodyEl.querySelector('[data-role="keypad"]');

          const keys = [

            '7', '8', '9', '/', '⌫',
            '4', '5', '6', '*', 'π',

            '0', '.', '%', '+', '='
          ];

          const evalExpr = (raw) => {
            const prepared = raw
              .replace(/π/g, 'Math.PI')
              .replace(/\be\b/g, 'Math.E')
              .replace(/sin\(/g, 'Math.sin(')
              .replace(/cos\(/g, 'Math.cos(')
              .replace(/tan\(/g, 'Math.tan(')
              .replace(/ln\(/g, 'Math.log(')
              .replace(/log\(/g, 'Math.log10(')
              .replace(/√\(/g, 'Math.sqrt(')
              .replace(/\^/g, '**');
            if (!/^[0-9+\-*/().%\sMathPIEsincoagqrt*]+$/.test(prepared)) {
              throw new Error('表达式格式错误');
            }
            const res = Function(`"use strict"; return (${prepared})`)();
            if (!Number.isFinite(res)) throw new Error('结果无效');
            return Number(res.toPrecision(12));
          };

          keys.forEach(k => {
            const btn = document.createElement('button');
            btn.className = `os-btn ${k === '=' ? 'primary' : ''} ${k === 'C' ? 'danger' : ''}`;
            btn.style.height = '100%';
            btn.style.fontFamily = 'var(--font-mono)';
            btn.style.fontSize = '14px';
            btn.textContent = k;

            btn.onclick = () => {
              if (k === 'C') {
                expr = '';
                dispEl.textContent = '0';
              } else if (k === '⌫') {
                expr = expr.slice(0, -1);
                dispEl.textContent = expr || '0';
              } else if (k === '=') {
                if (!expr) return;
                try {
                  const ans = evalExpr(expr);
                  histEl.textContent = `${expr} = ${ans}`;
                  history.unshift(`${expr} = ${ans}`);
                  expr = String(ans);
                  dispEl.textContent = expr;
                } catch (_) {
                  dispEl.textContent = '运算错误';
                  expr = '';
                }
              } else if (['sin', 'cos', 'tan', 'ln', 'log', '√'].includes(k)) {
                expr += `${k}(`;
                dispEl.textContent = expr;
              } else {
                expr += k;
                dispEl.textContent = expr;
              }
            };
            keypad.appendChild(btn);
          });
        }
      });
    }
  };
