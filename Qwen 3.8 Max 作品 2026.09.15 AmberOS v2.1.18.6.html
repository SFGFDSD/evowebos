<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>琥珀系统 · AmberOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
/* ========== 琥珀系统 · 设计令牌 ========== */
:root{
  --tbh:52px;
  --f-disp:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-mono:'IBM Plex Mono','Noto Sans SC',monospace;
  --r-win:10px; --r-el:6px;
  --ok:#63B983; --warn:#E3BC55; --danger:#DE6655;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg0:#0D1411; --bg1:#121B17;
  --panel:#17231D; --panel2:#1D2B24; --panel3:#25362D;
  --line:#2B3D33; --line2:#3C5346;
  --ink:#E9E4D4; --ink2:#A9B6A8; --ink3:#6F8173;
  --accent:#F0A93C; --accent2:#F7C86E; --accent-ink:#221604;
  --accent-soft:rgba(240,169,60,.14);
  --shadow:0 24px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --shadow-sm:0 8px 24px rgba(0,0,0,.45);
  --titlebar:linear-gradient(180deg,#22322A,#1B2822);
  --stripe:rgba(255,255,255,.028);
  --scrim:rgba(6,10,8,.55);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg0:#D9DFD4; --bg1:#E3E8DD;
  --panel:#F1F2EA; --panel2:#F8F8F1; --panel3:#FDFDF7;
  --line:#C6D0C2; --line2:#AEBBAA;
  --ink:#1F2920; --ink2:#57655A; --ink3:#8B988C;
  --accent:#C07E15; --accent2:#A96C0C; --accent-ink:#FFF6E4;
  --accent-soft:rgba(192,126,21,.13);
  --shadow:0 24px 55px rgba(40,55,45,.28),0 2px 8px rgba(40,55,45,.16);
  --shadow-sm:0 8px 22px rgba(40,55,45,.18);
  --titlebar:linear-gradient(180deg,#FAFAF2,#EDEFE5);
  --stripe:rgba(0,0,0,.022);
  --scrim:rgba(30,40,32,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f-body);background:var(--bg0);color:var(--ink);font-size:14px;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:18px;height:18px;flex:none;display:block}

/* ========== 壁纸层 ========== */
#wallpaper{position:fixed;inset:0;z-index:0;background:var(--bg0);background-size:cover;background-position:center;transition:opacity .5s}
#wallpaper::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);pointer-events:none}

/* ========== 舞台 ========== */
#stage{position:fixed;inset:0 0 var(--tbh) 0;z-index:1;overflow:hidden}

/* ========== 桌面图标 ========== */
#iconlayer{position:absolute;inset:0;touch-action:none}
.dicon{position:absolute;width:92px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:8px;cursor:pointer;transition:left .28s cubic-bezier(.22,1,.36,1),top .28s cubic-bezier(.22,1,.36,1),background .15s,box-shadow .15s;border:1px solid transparent}
.dicon.notrans{transition:none}
.dicon:hover{background:var(--accent-soft)}
.dicon.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.dicon.drop-hot{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.06)}
.dicon.drag-src{opacity:.35}
.dicon-ic{width:52px;height:52px;display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));pointer-events:none}
.dicon-ic .ic{width:46px;height:46px}
.dicon-ic img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--line2);background:#000}
.dicon-name{font-size:12px;line-height:1.3;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);word-break:break-all;max-height:2.6em;overflow:hidden;pointer-events:none}
html[data-theme="light"] .dicon-name{color:#fff}
#marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);z-index:2;display:none;pointer-events:none;border-radius:2px}
#snap-ghost{position:absolute;z-index:3;display:none;background:var(--accent-soft);border:2px solid var(--accent);border-radius:var(--r-win);pointer-events:none;transition:all .12s ease}

/* ========== 窗口 ========== */
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-win);box-shadow:var(--shadow);min-width:280px;min-height:160px;overflow:hidden;animation:winin .22s cubic-bezier(.2,.9,.3,1.2);transition:left .2s ease,top .2s ease,width .2s ease,height .2s ease,opacity .18s,transform .18s}
.win.notrans{transition:opacity .18s,transform .18s}
@keyframes winin{from{opacity:0;transform:scale(.94) translateY(14px)}}
.win.closing{opacity:0;transform:scale(.94) translateY(10px);transition:all .15s ease}
.win.min{opacity:0;transform:translateY(60px) scale(.85);pointer-events:none}
.win.active{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.win.peek-dim{opacity:.14;filter:saturate(.4)}
.win.maxed{border-radius:0;border-color:var(--line)}
.win.fscreen{position:fixed !important;inset:0 !important;width:100% !important;height:100% !important;border-radius:0;z-index:9400 !important}
.tbar{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--titlebar);border-bottom:1px solid var(--line);cursor:default;position:relative;touch-action:none}
.rsz{touch-action:none}
.tbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--stripe) 0 2px,transparent 2px 5px);pointer-events:none}
.win.active .tbar{border-bottom-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tbar .wicon{width:17px;height:17px;color:var(--accent);flex:none}
.tbar .wicon .ic{width:17px;height:17px}
.ttitle{font-family:var(--f-disp);font-size:15px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--ink2)}
.win.active .ttitle{color:var(--ink)}
.tbtns{display:flex;gap:5px;position:relative;z-index:1}
.tbtn{width:30px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--ink2);transition:background .12s,color .12s,transform .08s}
.tbtn:hover{background:var(--panel3);color:var(--ink)}
.tbtn:active{transform:scale(.92)}
.tbtn.tclose:hover{background:var(--danger);color:#fff}
.tbtn .ic{width:14px;height:14px}
.wbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.rsz{position:absolute;z-index:5}
.rsz.n{top:-4px;left:10px;right:10px;height:8px;cursor:n-resize}
.rsz.s{bottom:-4px;left:10px;right:10px;height:8px;cursor:s-resize}
.rsz.e{right:-4px;top:10px;bottom:10px;width:8px;cursor:e-resize}
.rsz.w{left:-4px;top:10px;bottom:10px;width:8px;cursor:w-resize}
.rsz.ne{top:-4px;right:-4px;width:14px;height:14px;cursor:ne-resize}
.rsz.nw{top:-4px;left:-4px;width:14px;height:14px;cursor:nw-resize}
.rsz.se{bottom:-4px;right:-4px;width:14px;height:14px;cursor:se-resize}
.rsz.sw{bottom:-4px;left:-4px;width:14px;height:14px;cursor:sw-resize}
.win.maxed .rsz,.win.fscreen .rsz{display:none}
.win.maxed .tbar{cursor:default}

/* ========== 任务栏 ========== */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);z-index:9000;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--titlebar);border-top:1px solid var(--line2);background-color:var(--panel)}
#taskbar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--stripe) 0 2px,transparent 2px 5px);pointer-events:none}
#tb-start{width:44px;height:calc(var(--tbh) - 12px);border-radius:8px;display:grid;place-items:center;color:var(--accent);position:relative;transition:background .15s,transform .1s}
#tb-start:hover{background:var(--accent-soft)}
#tb-start:active{transform:scale(.93)}
#tb-start .ic{width:26px;height:26px}
#tb-apps{flex:1;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:100%;align-items:center;position:relative;z-index:1}
#tb-apps::-webkit-scrollbar{display:none}
.tb-app{height:calc(var(--tbh) - 12px);min-width:44px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:8px;color:var(--ink2);position:relative;transition:background .13s,color .13s;flex:none;cursor:pointer}
.tb-app:hover{background:var(--panel3);color:var(--ink)}
.tb-app .ic{width:22px;height:22px}
.tb-app .tb-label{font-size:12.5px;max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-app.run::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:var(--ink3);transition:background .15s}
.tb-app.run.on::after{background:var(--accent)}
#tb-tray{display:flex;align-items:center;gap:2px;position:relative;z-index:1}
.tray-btn{width:38px;height:calc(var(--tbh) - 14px);border-radius:7px;display:grid;place-items:center;color:var(--ink2);transition:background .13s,color .13s}
.tray-btn:hover{background:var(--panel3);color:var(--ink)}
.tray-btn .ic{width:19px;height:19px}
#tb-clock{font-family:var(--f-mono);font-size:12.5px;line-height:1.25;text-align:center;padding:0 8px;color:var(--ink2);cursor:default}
#tb-clock b{display:block;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.5px}
#tb-peek{width:10px;height:100%;flex:none;border-left:1px solid var(--line);cursor:pointer;position:relative;z-index:1}
#tb-peek:hover{background:var(--accent-soft)}

/* ========== 开始菜单 ========== */
#startmenu{position:fixed;left:8px;bottom:calc(var(--tbh) + 10px);width:min(560px,calc(100vw - 16px));max-height:min(640px,calc(100vh - var(--tbh) - 24px));z-index:9100;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden;transform-origin:bottom left}
#startmenu.open{display:flex;animation:menuin .2s cubic-bezier(.2,.9,.3,1.15)}
@keyframes menuin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.sm-head{padding:18px 20px 10px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
.sm-head h1{font-family:var(--f-disp);font-size:30px;font-weight:400;letter-spacing:2px;color:var(--ink)}
.sm-head h1 i{font-style:normal;color:var(--accent)}
.sm-head span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);letter-spacing:1.5px}
.sm-search{margin:12px 16px 4px;position:relative}
.sm-search input{width:100%;height:38px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 12px 0 36px;font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.sm-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sm-search .ic{position:absolute;left:10px;top:10px;color:var(--ink3)}
.sm-apps{flex:1;overflow-y:auto;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;align-content:start}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 11px;border-radius:10px;cursor:pointer;transition:background .13s,transform .12s;border:1px solid transparent}
.sm-app:hover{background:var(--panel2);border-color:var(--line);transform:translateY(-2px)}
.sm-app .tile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -8px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.3)}
.sm-app .tile .ic{width:24px;height:24px}
.sm-app b{font-size:12.5px;font-weight:500;color:var(--ink2);text-align:center}
.sm-app:hover b{color:var(--ink)}
.sm-foot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.sm-foot .sp{flex:1}
.sm-user{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:8px;cursor:pointer}
.sm-user:hover{background:var(--panel3)}
.sm-user .ava{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-disp);font-size:16px}
.sm-user b{font-size:13px}

/* ========== 通用控件 ========== */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--r-el);background:var(--panel3);border:1px solid var(--line2);font-size:13px;color:var(--ink);transition:all .13s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{background:var(--accent2);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line2))}
.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel3);color:var(--ink)}
.btn.sm{height:27px;padding:0 9px;font-size:12px;border-radius:5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ibtn{width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink2);transition:all .12s;flex:none}
.ibtn:hover{background:var(--panel3);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.ibtn .ic{width:17px;height:17px}
.field{height:32px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-el);padding:0 10px;font-size:13px;outline:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.field{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.toolbar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
.toolbar .sp{flex:1}
.statusbar{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel2);font-family:var(--f-mono);font-size:11px;color:var(--ink3);overflow:hidden;white-space:nowrap}
.statusbar b{color:var(--ink2);font-weight:500}
.statusbar .sp{flex:1}

/* ========== 菜单 ========== */
.menu{position:fixed;z-index:9500;min-width:190px;max-width:280px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);padding:5px;display:none;animation:menuin .13s ease}
.menu.open{display:block}
.menu-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink);transition:background .1s}
.menu-item:hover{background:var(--accent-soft);color:var(--accent)}
.menu-item .ic{width:16px;height:16px;color:var(--ink3)}
.menu-item:hover .ic{color:var(--accent)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.menu-item.danger .ic{color:var(--danger)}
.menu-item[disabled]{opacity:.38;pointer-events:none}
.menu-sep{height:1px;background:var(--line);margin:5px 8px}
.menu-item .kbd{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.menu-sub{position:relative}
.menu-sub>.menu{position:absolute;left:calc(100% - 4px);top:-5px}
.menu-sub:hover>.menu{display:block}
.menu-item .arrow{margin-left:auto;color:var(--ink3)}

/* ========== 对话框 ========== */
#dialogs{position:fixed;inset:0;z-index:9600;display:none;align-items:center;justify-content:center;background:var(--scrim);padding:16px}
#dialogs.open{display:flex}
.dlg{width:min(460px,100%);max-height:calc(100vh - 60px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:menuin .18s cubic-bezier(.2,.9,.3,1.12);overflow:hidden}
.dlg.wide{width:min(640px,100%)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;font-family:var(--f-disp);font-size:18px;letter-spacing:1px}
.dlg-head .ic{color:var(--accent);width:20px;height:20px}
.dlg-body{padding:4px 16px 14px;overflow-y:auto;font-size:13.5px;color:var(--ink2);line-height:1.65}
.dlg-body .field{width:100%;margin-top:8px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel2)}
.dlg-opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dlg-opt{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:all .13s;text-align:left}
.dlg-opt:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(3px)}
.dlg-opt .tile{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 -6px 10px rgba(0,0,0,.2)}
.dlg-opt .tile .ic{width:20px;height:20px}
.dlg-opt b{display:block;font-size:13.5px;color:var(--ink)}
.dlg-opt span{font-size:12px;color:var(--ink3)}
.prog{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s;border-radius:4px}

/* ========== Toast ========== */
#toasts{position:fixed;top:14px;right:14px;z-index:9700;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(360px,calc(100vw - 28px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:8px;box-shadow:var(--shadow-sm);padding:10px 14px;font-size:13px;animation:toastin .25s cubic-bezier(.2,.9,.3,1.2);color:var(--ink)}
.toast.out{opacity:0;transform:translateX(30px);transition:all .25s}
.toast .ic{width:17px;height:17px;color:var(--accent)}
.toast.err{border-left-color:var(--danger)}.toast.err .ic{color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}.toast.warn .ic{color:var(--warn)}
.toast.ok{border-left-color:var(--ok)}.toast.ok .ic{color:var(--ok)}
@keyframes toastin{from{opacity:0;transform:translateX(40px)}}

/* ========== 文件资源管理器 ========== */
.fe{display:flex;flex:1;min-height:0}
.fe-side{width:178px;flex:none;border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.fe-side h4{font-size:10.5px;color:var(--ink3);letter-spacing:2px;padding:8px 10px 4px;font-weight:500}

<script>
'use strict';
/* =====================================================================
   琥珀系统 AmberOS — 单文件 Web 操作系统
   存储：OPFS（主） + File System Access（本地挂载） + IndexedDB（挂载句柄）
         + localStorage（偏好） + 内存后端（降级）

/* ---------- 0. 工具函数 ---------- */
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>[...p.querySelectorAll(s)];
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const isTouch=matchMedia('(pointer:coarse)').matches;
const isMobile=()=>matchMedia('(max-width:820px)').matches;
const baseName=p=>{p=String(p).replace(/\/+$/,'');return p.split('/').pop()||'/';};
const dirName=p=>{p=pathNorm(p);const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i);};
const extOf=p=>{const n=baseName(p);const i=n.lastIndexOf('.');return i>0?n.slice(i+1).toLowerCase():'';};
const fmtSize=b=>{if(b==null)return '—';if(b<1024)return b+' B';const u=['KB','MB','GB','TB'];let i=-1;do{b/=1024;i++;}while(b>=1024&&i<u.length-1);return b.toFixed(b>=100?0:1)+' '+u[i];};
const fmtDate=t=>{if(!t)return '—';const d=new Date(t);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());};
const naturalCmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});
function pathNorm(p){p=String(p==null?'/':p).replace(/\\/g,'/');const out=[];for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..'){out.pop();continue;}out.push(s);}return '/'+out.join('/');}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('加载失败 '+src));document.head.appendChild(s);});}
function loadCSS(href){return new Promise(res=>{const l=document.createElement('link');l.rel='stylesheet';l.href=href;l.onload=res;l.onerror=res;document.head.appendChild(l);});}
function pickFiles({multiple=false,accept=''}={}){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.multiple=multiple;i.accept=accept;i.onchange=()=>res([...i.files]);i.click();});}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);}

/* ---------- 2. Toast & 对话框 ---------- */
function toast(msg,type='info',ms=3200){
  const t=h('div','toast '+type,icon(type==='err'?'warn':type==='warn'?'warn':type==='ok'?'check':'info')+'<span>'+esc(msg)+'</span>');
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260);},ms);
}
const Dlg={
  stack:[],
  open(node){const root=$('#dialogs');root.classList.add('open');root.appendChild(node);this.stack.push(node);return node;},
  close(node){node.remove();if(!$('#dialogs').children.length)$('#dialogs').classList.remove('open');this.stack.pop();},
};
function makeDlg(title,bodyHTML,buttons,{wide=false,iconName='info'}={}){
  return new Promise(res=>{
    const d=h('div','dlg'+(wide?' wide':''));
    d.innerHTML='<div class="dlg-head">'+icon(iconName)+'<span>'+esc(title)+'</span></div>';
    const body=h('div','dlg-body');if(typeof bodyHTML==='string')body.innerHTML=bodyHTML;else body.appendChild(bodyHTML);
    d.appendChild(body);
    const foot=h('div','dlg-foot');d.appendChild(foot);
    let done=false;
    const finish=v=>{if(done)return;done=true;Dlg.close(d);res(v);};
    buttons.forEach(b=>{
      const btn=h('button','btn '+(b.cls||''),esc(b.label));
      btn.onclick=()=>finish(b.value!==undefined?b.value:true);
      foot.appendChild(btn);
    });
    d.addEventListener('keydown',e=>{if(e.key==='Escape')finish(undefined);});
    Dlg.open(d);
    const fi=body.querySelector('input,select,textarea');if(fi)setTimeout(()=>fi.focus(),60);
    d._body=body;d._finish=finish;
  });
}
const confirmDlg=(title,text,opts={})=>makeDlg(title,'<p>'+esc(text)+'</p>',[{label:'取消',cls:'ghost',value:false},{label:opts.okLabel||'确定',cls:opts.danger?'danger':'primary',value:true}],{iconName:opts.danger?'warn':'info'});
async function promptDlg(title,placeholder='',initial='',okLabel='确定'){
  const body=h('div');body.innerHTML='<input class="field" placeholder="'+esc(placeholder)+'" value="'+esc(initial)+'" spellcheck="false">';
  const p=makeDlg(title,body,[{label:'取消',cls:'ghost',value:null},{label:okLabel,cls:'primary'}]);
  const inp=body.querySelector('input');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')p._finish(inp.value);});
  const v=await p;return v===true?inp.value:v;
}
function chooseDlg(title,options,{wide=false}={}){
  const body=h('div','dlg-opts');
  const p=makeDlg(title,body,[{label:'取消',cls:'ghost',value:undefined}],{wide,iconName:'info'});
  options.forEach(o=>{
    const b=h('button','dlg-opt');
    b.innerHTML='<span class="tile" style="background:'+o.color+'">'+icon(o.icon)+'</span><span><b>'+esc(o.label)+'</b><span>'+esc(o.desc||'')+'</span></span>';
    b.onclick=()=>p._finish(o.value);
    body.appendChild(b);
  });
  return p;
}
function progressDlg(title){
  const body=h('div');body.innerHTML='<p class="ptext" style="color:var(--ink2)">准备中…</p><div class="prog"><i></i></div>';

/* =====================================================================
   5. 虚拟文件系统（OPFS 后端 + 本地挂载后端 + 内存降级）
   统一 API：stat / readdir / readFile / writeFile / mkdir / rm /
            rename / copy / exists / walk / usage —— 全部 Promise 化
   ===================================================================== */
class FsError extends Error{constructor(code,msg){super(msg);this.code=code;}}

const memTree={dirs:new Set(['/']),files:new Map()}; // path -> {blob,mtime}
const memBE={
  _dir(p){return memTree.dirs.has(p);},
  async stat(parts,extra){const p='/'+parts.join('/');
    if(parts.length===0||this._dir(p))return{name:baseName(p)||'/',path:p,isDirectory:true,size:0,mtime:Date.now()};
    const f=memTree.files.get(p);if(!f)throw new FsError('ENOENT','不存在: '+p);
    return{name:baseName(p),path:p,isDirectory:false,size:f.blob.size,mtime:f.mtime};},
  async readdir(parts){const p=('/'+parts.join('/')).replace(/\/$/,'');if(!this._dir(p))throw new FsError('ENOTDIR',p);
    const out=[];const pre=p==='/'?'/':p+'/';
    memTree.dirs.forEach(d=>{if(d!==p&&d.startsWith(pre)&&!d.slice(pre.length).includes('/'))out.push({name:d.slice(pre.length),isDirectory:true,size:0,mtime:Date.now(),path:d});});
    memTree.files.forEach((f,d)=>{if(d.startsWith(pre)&&!d.slice(pre.length).includes('/'))out.push({name:baseName(d),isDirectory:false,size:f.blob.size,mtime:f.mtime,path:d});});
    return out;},
  async readFile(parts,type){const p='/'+parts.join('/');const f=memTree.files.get(p);if(!f)throw new FsError('ENOENT',p);
    if(type==='text')return await f.blob.text();if(type==='arrayBuffer')return await f.blob.arrayBuffer();return f.blob;},
  async writeFile(parts,data){const p='/'+parts.join('/');const blob=data instanceof Blob?data:new Blob([data]);memTree.files.set(p,{blob,mtime:Date.now()});},
  async mkdir(parts){let cur='';for(const s of parts){cur=cur+'/'+s;memTree.dirs.add(cur);}},
  async rm(parts,recursive){const p='/'+parts.join('/');
    if(memTree.files.has(p)){memTree.files.delete(p);return;}
    if(this._dir(p)){if(!recursive&&[...memTree.files.keys()].some(k=>k.startsWith(p+'/')))throw new FsError('ENOTEMPTY',p);
      [...memTree.dirs].forEach(d=>{if(d.startsWith(p+'/'))memTree.dirs.delete(d);});
      [...memTree.files.keys()].forEach(k=>{if(k.startsWith(p+'/'))memTree.files.delete(k);});
      memTree.dirs.delete(p);return;}
    throw new FsError('ENOENT',p);},
  async rename(fp,tp){const from='/'+fp.join('/'),to='/'+tp.join('/');
    if(memTree.files.has(from)){memTree.files.set(to,{...memTree.files.get(from),mtime:Date.now()});memTree.files.delete(from);return;}
    throw new FsError('ENOENT',from);}
};

const opfsBE={
  root:null,
  async _dh(parts,create){let d=this.root;for(const s of parts)d=await d.getDirectoryHandle(s,{create});return d;},
  async _fh(parts,create){const name=parts[parts.length-1];const d=await this._dh(parts.slice(0,-1),create);return await d.getFileHandle(name,{create});},
  async stat(parts){
    if(parts.length===0)return{name:'/',path:'/',isDirectory:true,size:0,mtime:Date.now()};
    const name=parts[parts.length-1];
    try{const d=await this._dh(parts,false);return{name,path:pathNorm('/'+parts.join('/')),isDirectory:true,size:0,mtime:Date.now()};}catch(e){}
    try{const f=await this._fh(parts,false);const file=await f.getFile();return{name,path:pathNorm('/'+parts.join('/')),isDirectory:false,size:file.size,mtime:file.lastModified};}catch(e){}
    throw new FsError('ENOENT','不存在: /'+parts.join('/'));},
  async readdir(parts){
    const d=await this._dh(parts,false).catch(()=>{throw new FsError('ENOENT','目录不存在');});
    const out=[];
    for await(const [name,hd] of d.entries()){
      if(hd.kind==='directory')out.push({name,isDirectory:true,size:0,mtime:Date.now(),path:pathNorm('/'+[...parts,name].join('/'))});
      else{try{const f=await hd.getFile();out.push({name,isDirectory:false,size:f.size,mtime:f.lastModified,path:pathNorm('/'+[...parts,name].join('/'))});}catch(e){out.push({name,isDirectory:false,size:0,mtime:Date.now(),path:pathNorm('/'+[...parts,name].join('/'))});}}
    }
    return out;},
  async readFile(parts,type){const fh=await this._fh(parts,false).catch(()=>{throw new FsError('ENOENT','文件不存在: /'+parts.join('/'))});
    const file=await fh.getFile();
    if(type==='text')return await file.text();if(type==='arrayBuffer')return await file.arrayBuffer();return file;},
  async writeFile(parts,data){
    const fh=await this._fh(parts,true);
    const w=await fh.createWritable();
    await w.write(data);await w.close();},
  async mkdir(parts,recursive){await this._dh(parts,recursive!==false);},
  async rm(parts,recursive){
    const name=parts[parts.length-1];const parent=await this._dh(parts.slice(0,-1),false).catch(()=>{throw new FsError('ENOENT','不存在');});
    await parent.removeEntry(name,{recursive:!!recursive});},
  async rename(fp,tp){
    const st=await this.stat(fp);
    if(st.isDirectory){await this._copyDir(fp,tp);await this.rm(fp,true);}
    else{const data=await this.readFile(fp);await this.writeFile(tp,data);await this.rm(fp);}
  },
  async _copyDir(fp,tp){
    await this.mkdir(tp,true);
    const list=await this.readdir(fp);
    for(const e of list){
      if(e.isDirectory)await this._copyDir([...fp,e.name],[...tp,e.name]);
      else await this.writeFile([...tp,e.name],await this.readFile([...fp,e.name]));
    }
  }
};

const Mounts={
  map:new Map(), // name -> {handle}
  makeBE(handle){
    const be=Object.create(opfsBE);
    be.root=handle;
    return be;
  },
  async add(handle){
    let name=handle.name||'local';
    if(this.map.has(name)){let i=2;while(this.map.has(name+'~'+i))i++;name=name+'~'+i;}
    this.map.set(name,{handle,be:this.makeBE(handle)});
    const rec=await IDB.get('mounts')||{};rec[name]=handle;await IDB.set('mounts',rec);

  },
  async remove(name){
    this.map.delete(name);
    const rec=await IDB.get('mounts')||{};delete rec[name];await IDB.set('mounts',rec);
    Store.set('mounts',Object.keys(rec));
    toast('已卸载 '+name);Desktop.render();
  },
  async restorePrompt(){
    const rec=await IDB.get('mounts')||{};
    const pending=[];
    for(const [name,handle] of Object.entries(rec)){
      try{
        const q=handle.queryPermission?await handle.queryPermission({mode:'readwrite'}):'granted';
        if(q==='granted'){this.map.set(name,{handle,be:this.makeBE(handle)});}
        else pending.push({name,handle});
      }catch(e){pending.push({name,handle});}
    }
    if(pending.length){
      const body=h('div');
      body.innerHTML='<p>以下本地文件夹需要重新授权后才能访问（浏览器安全策略所致）：</p>';
      const p=makeDlg('重新挂载本地文件夹',body,[{label:'稍后再说',cls:'ghost',value:false}],{iconName:'mount'});
      pending.forEach(m=>{
        const row=h('div','st-row');
        row.innerHTML='<b>'+esc(m.name)+'</b><span class="sp"></span>';
        const btn=h('button','btn sm primary','重新授权');
        btn.onclick=async()=>{try{const r=await m.handle.requestPermission({mode:'readwrite'});if(r==='granted'){this.map.set(m.name,{handle:m.handle,be:this.makeBE(m.handle)});row.remove();toast('已挂载 '+m.name,'ok');Desktop.render();if(!body.querySelectorAll('.st-row').length)p._finish(true);}else toast('授权被拒绝','warn');}catch(e){toast('授权失败','err');}};
        row.appendChild(btn);body.appendChild(row);
      });
      await p;
    }
    return this.map.size;
  }
};

function resolvePath(path){
  const parts=pathNorm(path).split('/').filter(Boolean);
  if(parts[0]==='__lost')parts.shift();
  if(parts[0]==='mnt'&&parts[1]==='local'&&parts[2]){
    const m=Mounts.map.get(parts[2]);
    if(!m)throw new FsError('ENOENT','挂载点不可用: '+parts[2]+'（请在设置中重新授权）');
    return {be:m.be,parts:parts.slice(3),mount:parts[2]};
  }
  return {be:opfsBE,parts};
}
function compatCb(args){ // 兼容 callback 风格调用
  const cb=typeof args[args.length-1]==='function'?args.pop():null;
  return cb;
}

const fs={
  backend:'opfs',
  async init(){

      }
      if(!(await this.exists('/desktop/示例表格.csv'))){

      }
    }catch(e){}
  },
  async stat(path){
    const p=pathNorm(path);
    const {be,parts,mount}=resolvePath(p);
    const s=await be.stat(parts);
    if(mount&&parts.length===0){s.name=mount;s.path=p;}
    return s;
  },
  async exists(path){try{await this.stat(path);return true;}catch(e){return false;}},
  async readdir(path){
    const p=pathNorm(path);
    const {be,parts}=resolvePath(p);
    const list=await be.readdir(parts);
    if(p==='/mnt/local'){
      Mounts.map.forEach((m,name)=>{
        if(!list.some(e=>e.name===name))list.push({name,isDirectory:true,size:0,mtime:Date.now(),path:'/mnt/local/'+name});
      });
    }
    list.sort((a,b)=>(b.isDirectory-a.isDirectory)||naturalCmp(a.name,b.name));
    return list;
  },
  async readFile(path,type='blob'){const {be,parts}=resolvePath(path);return be.readFile(parts,type);},
  async writeFile(path,data){const {be,parts}=resolvePath(path);await be.writeFile(parts,data);},
  async mkdir(path,recursive=true){const {be,parts}=resolvePath(path);await be.mkdir(parts,recursive);},
  async rm(path,recursive=true){
    const {be,parts,mount}=resolvePath(path);
    if(mount&&!parts.length)throw new FsError('EPERM','请在设置中卸载该本地文件夹');
    if(!mount&&!parts.length)throw new FsError('EPERM','不能删除根目录');
    await be.rm(parts,recursive);
  },
  async rename(from,to){
    from=pathNorm(from);to=pathNorm(to);if(from===to)return;
    if(await this.exists(to))throw new FsError('EEXIST','目标已存在: '+baseName(to));
    const a=resolvePath(from),b=resolvePath(to);
    if(a.be===b.be&&a.be.rename)await a.be.rename(a.parts,b.parts);
    else{const st=await this.stat(from);
      if(st.isDirectory){await this.copy(from,to);await this.rm(from,true);}
      else{await this.writeFile(to,await this.readFile(from));await this.rm(from);}
    }
  },
  async copy(from,to){
    from=pathNorm(from);to=pathNorm(to);
    const st=await this.stat(from);
    if(st.isDirectory){
      await this.mkdir(to,true);
      for(const e of await this.readdir(from)){
        await this.copy(from+'/'+e.name,to+'/'+e.name);
      }
    }else{
      await this.writeFile(to,await this.readFile(from));
    }
  },
  async walk(path,max=2000){ // 递归收集
    const out=[];let n=0;
    const rec=async p=>{
      if(n>max)return;
      let list;try{list=await this.readdir(p);}catch(e){return;}
      for(const e of list){
        if(n++>max)break;
        e.path=(p==='/'?'':p)+'/'+e.name;
        out.push(e);
        if(e.isDirectory)await rec(e.path);
      }
    };
    await rec(path);return out;
  },
  async usage(path='/'){
    let total=0;
    const rec=async p=>{
      let list;try{list=await this.readdir(p);}catch(e){return;}
      for(const e of list){
        const ep=(p==='/'?'':p)+'/'+e.name;
        if(e.isDirectory)await rec(ep);else total+=e.size||0;
      }
    };
    await rec(path);return total;
  },
  async uniqueName(dir,name){
    if(!(await this.exists(dir+'/'+name)))return name;
    const dot=name.lastIndexOf('.');const base=dot>0?name.slice(0,dot):name;const ext=dot>0?name.slice(dot):'';
    let i=2;while(await this.exists(dir+'/'+base+' ('+i+')'+ext))i++;
    return base+' ('+i+')'+ext;
  },
  async estimate(){try{return await navigator.storage.estimate();}catch(e){return{quota:0,usage:0};}}
};

/* =====================================================================
   6. 压缩 / 解压引擎：zip(JSZip) / gz(DecompressionStream) / tar(手写)
      / tgz / 7z(7z-wasm，懒加载，CDN 失败自动降级提示)
   ===================================================================== */
const Archive={
  _7z:null,
  async load7z(){
    if(this._7z)return this._7z;
    const urls=['https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js','https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/dist/7zz.es6.min.js'];
    for(const u of urls){
      try{const mod=await import(u);this._7z=await (mod.default||mod);return this._7z;}catch(e){}
    }
    throw new Error('7z 引擎加载失败（网络不可用）');
  },
  isArchive(name){return ZIP_EXT.includes(extOf(name));},
  async extract(path,onProg){
    const ext=extOf(path);const dir=dirName(path);const base=baseName(path).replace(/\.(tar\.gz|tgz|gz|zip|tar|7z)$/i,'');
    const target=dir+'/'+(await fs.uniqueName(dir,base));
    const buf=await fs.readFile(path,'arrayBuffer');
    if(ext==='zip')await this._zip(buf,target,onProg);
    else if(ext==='7z')await this._7zx(buf,target,onProg);
    else if(ext==='gz'&&/\.tar\.gz$/i.test(baseName(path))===false&&ext==='gz'&&!baseName(path).toLowerCase().endsWith('.tar.gz')){
      if(baseName(path).toLowerCase().endsWith('.tar.gz'))await this._tar(await this._gunzip(buf),target,onProg);
      else{const out=await this._gunzip(buf);await fs.writeFile(dir+'/'+baseName(path).replace(/\.gz$/i,''),out);}
    }
    else if(ext==='tgz'||(ext==='gz'&&baseName(path).toLowerCase().endsWith('.tar.gz')))await this._tar(await this._gunzip(buf),target,onProg);
    else if(ext==='gz')await this._tar(await this._gunzip(buf),target,onProg);
    else if(ext==='tar')await this._tar(buf,target,onProg);
    else throw new Error('不支持的压缩格式');
    return target;
  },
  async _gunzip(buf){
    if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持 gzip 解压');
    const stream=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).arrayBuffer();
  },
  async _zip(buf,target,onProg){
    if(!window.JSZip)throw new Error('JSZip 未加载（网络不可用）');
    const zip=await JSZip.loadAsync(buf);
    const entries=Object.values(zip.files);
    let i=0;
    await fs.mkdir(target,true);
    for(const en of entries){
      i++;onProg&&onProg(en.name,i/entries.length);
      const clean=en.name.replace(/^[\\/]+/,'');
      if(!clean||clean.includes('..'))continue;
      const out=target+'/'+clean;
      if(en.dir){await fs.mkdir(out,true);continue;}
      await fs.mkdir(dirName(out),true);
      await fs.writeFile(out,await en.async('blob'));
    }
  },
  async _tar(buf,target,onProg){
    const u8=new Uint8Array(buf);let off=0;let i=0;
    await fs.mkdir(target,true);
    while(off+512<=u8.length){
      const hdr=u8.subarray(off,off+512);
      if(hdr.every(b=>b===0))break;
      let name=new TextDecoder().decode(hdr.subarray(0,100)).replace(/\0.*$/,'');
      const sizeStr=new TextDecoder().decode(hdr.subarray(124,136)).replace(/\0.*$/,'').trim();
      const size=parseInt(sizeStr,8)||0;
      const type=String.fromCharCode(hdr[156]);
      const prefix=new TextDecoder().decode(hdr.subarray(345,500)).replace(/\0.*$/,'');
      if(prefix)name=prefix+'/'+name;
      off+=512;
      if(name&&!name.includes('..')){
        if(type==='L'){ // GNU 长文件名
          const ln=new TextDecoder().decode(u8.subarray(off,off+size)).replace(/\0.*$/,'');
          off+=Math.ceil(size/512)*512;
          name=ln;i++;continue;
        }
        if(type!=='x'&&type!=='g'&&type!=='K'){
          i++;onProg&&onProg(name,0);
          const clean=name.replace(/^[\\/]+/,'');
          const out=target+'/'+clean;
          if(type==='5'||name.endsWith('/'))await fs.mkdir(out,true);
          else{await fs.mkdir(dirName(out),true);await fs.writeFile(out,u8.slice(off,off+size).buffer);}
        }
      }
      off+=Math.ceil(size/512)*512;
    }
  },
  async _7zx(buf,target,onProg){
    const sz=await this.load7z();
    try{
      sz.FS.writeFile('in.7z',new Uint8Array(buf));
      sz.callMain(['x','in.7z','-oout','-y']);
      await fs.mkdir(target,true);
      const rec=async p=>{
        const names=sz.FS.readdir(p).filter(n=>n!=='.'&&n!=='..');
        for(const n of names){
          const full=p+'/'+n;
          const st=sz.FS.stat(full);
          const rel=full.replace(/^out\//,'');
          if(!rel||rel.includes('..'))continue;
          if(sz.FS.isDir(st.mode)){await fs.mkdir(target+'/'+rel,true);await rec(full);}
          else{onProg&&onProg(rel,0);await fs.writeFile(target+'/'+rel,sz.FS.readFile(full).buffer);}
        }
      };
      await rec('out');

/* =====================================================================
   7. 拖拽缓存（拖出浏览器用，严禁在 dragstart 中异步加载）
   ===================================================================== */
const DragCache=new Map(); // path -> {blob,file,url}
async function preloadPath(path){
  if(DragCache.has(path))return DragCache.get(path);
  try{
    const blob=await fs.readFile(path,'blob');
    const name=baseName(path);
    const file=new File([blob],name,{type:mimeOf(extOf(path))});
    const url=URL.createObjectURL(file);
    const item={blob,file,url};
    DragCache.set(path,item);
    return item;
  }catch(e){return null;}
}
function setDragPayload(e,paths,internalSrc){
  e.dataTransfer.effectAllowed='copyMove';
  e.dataTransfer.setData('application/x-amber-paths',JSON.stringify(paths));
  e.dataTransfer.setData('application/x-amber-src',internalSrc||'desktop');
  paths.forEach(p=>{const it=DragCache.get(p);if(it){try{e.dataTransfer.items.add(it.file);}catch(_){}}});
  const it0=DragCache.get(paths[0]);
  if(it0){try{e.dataTransfer.setData('DownloadURL',it0.file.type+':'+encodeURIComponent(it0.file.name)+':'+it0.url);}catch(_){}}
}
function cleanupDrag(paths){
  setTimeout(()=>{paths.forEach(p=>{const it=DragCache.get(p);if(it){try{URL.revokeObjectURL(it.url);}catch(_){}DragCache.delete(p);}});},6000);
}
/* 物理文件 → VFS 递归导入 */
async function importDataTransfer(dt,targetDir,onProg){
  const items=[...dt.items];
  const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  let done=0,total=0;
  const count=async en=>{if(en.isFile){total++;return;}if(en.isDirectory){const rd=en.createReader();const loop=async()=>{const b=await new Promise((r,j)=>rd.readEntries(r,j));if(!b.length)return;total+=b.length;for(const x of b)await count(x);await loop();};await loop();}};
  for(const en of entries)await count(en);
  total=Math.max(total,1);
  const walk=async(en,dir)=>{
    if(en.isFile){
      const f=await new Promise((r,j)=>en.file(r,j));
      await fs.writeFile(dir+'/'+(await fs.uniqueName(dir,f.name)),await f.arrayBuffer());
      done++;onProg&&onProg(f.name,done/total);
    }else if(en.isDirectory){
      const sub=dir+'/'+(await fs.uniqueName(dir,en.name));
      await fs.mkdir(sub,true);
      const rd=en.createReader();
      const loop=async()=>{
        const b=await new Promise((r,j)=>rd.readEntries(r,j));
        if(!b.length)return;
        for(const x of b)await walk(x,sub);
        await loop();
      };
      await loop();
    }
  };
  for(const en of entries)await walk(en,targetDir);
  return done;
}

const WM={
  wins:new Map(),z:100,seq:0,activeId:null,
  open(appId,opts={}){
    const app=APPS[appId];if(!app)return;
    const id=++this.seq;
    const el=h('div','win');
    el.dataset.id=id;el.dataset.app=appId;el.dataset.type=app.type||'app';
    const stage=$('#stage');
    const sw=stage.clientWidth,sh=stage.clientHeight;
    const mob=isMobile();
    let w=opts.w||app.w||760,hh=opts.h||app.h||520;
    w=Math.min(w,sw-16);hh=Math.min(hh,sh-16);
    const x=opts.x!=null?opts.x:Math.max(8,Math.round((sw-w)/2)+(this.seq%7)*22-60);
    const y=opts.y!=null?opts.y:Math.max(8,Math.round((sh-hh)/2.6)+(this.seq%7)*16-40);
    if(!mob){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=hh+'px';}
    el.innerHTML=
      '<div class="tbar"><span class="wicon">'+(ICONS[app.icon]||ICONS.file)+'</span><span class="ttitle">'+esc(opts.title||app.name)+'</span>'+
      '<span class="tbtns">'+
      '<button class="tbtn tmin" title="最小化">'+ICONS.min+'</button>'+
      '<button class="tbtn tmax" title="最大化">'+ICONS.max+'</button>'+
      '<button class="tbtn tclose" title="关闭">'+ICONS.close+'</button>'+
      '</span></div><div class="wbody"></div>'+
      '<div class="rsz n" data-d="n"></div><div class="rsz s" data-d="s"></div><div class="rsz e" data-d="e"></div><div class="rsz w" data-d="w"></div>'+
      '<div class="rsz ne" data-d="ne"></div><div class="rsz nw" data-d="nw"></div><div class="rsz se" data-d="se"></div><div class="rsz sw" data-d="sw"></div>';
    stage.appendChild(el);
    const win={id,el,app,appId,title:opts.title||app.name,minimized:false,maxed:false,opts,rect:null,onClose:null,onResize:null};
    this.wins.set(id,win);
    win.body=$('.wbody',el);
    win.setTitle=t=>{win.title=t;$('.ttitle',el).textContent=t;Taskbar.render();};
    /* --- 焦点 --- */
    el.addEventListener('pointerdown',()=>this.focus(id),true);
    /* --- 控制按钮 --- */
    $('.tclose',el).onclick=e=>{e.stopPropagation();this.close(id);};
    $('.tmin',el).onclick=e=>{e.stopPropagation();this.minimize(id);};
    $('.tmax',el).onclick=e=>{e.stopPropagation();this.toggleMax(id);};
    /* --- 标题栏拖拽 + Aero Snap --- */
    const tbar=$('.tbar',el);
    tbar.addEventListener('dblclick',e=>{if(!e.target.closest('.tbtn'))this.toggleMax(id);});
    tbar.addEventListener('pointerdown',e=>{
      if(e.target.closest('.tbtn')||e.target.closest('input,select,button,textarea'))return;
      if(win.fscreen)return;
      this.focus(id);
      if(isMobile())return;
      if(win.maxed)return;
      e.preventDefault();
      el.classList.add('notrans');
      const sx=e.clientX,sy=e.clientY;
      const r=el.getBoundingClientRect();
      let ox=r.left,oy=r.top,moved=false;
      const ghost=$('#snap-ghost');
      let snap=null;
      const mv=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
        ox=r.left+dx;oy=r.top+dy;
        el.style.left=ox+'px';el.style.top=oy+'px';
        // Aero Snap 检测
        snap=null;
        const stage=$('#stage');
        if(ev.clientX<=4)snap={x:0,y:0,w:stage.clientWidth/2,h:stage.clientHeight};
        else if(ev.clientX>=innerWidth-5)snap={x:stage.clientWidth/2,y:0,w:stage.clientWidth/2,h:stage.clientHeight};
        else if(ev.clientY<=2)snap={x:0,y:0,w:stage.clientWidth,h:stage.clientHeight};
        if(snap){ghost.style.display='block';ghost.style.left=snap.x+'px';ghost.style.top=snap.y+'px';ghost.style.width=snap.w+'px';ghost.style.height=snap.h+'px';}
        else ghost.style.display='none';
      };
      const up=()=>{
        removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
        el.classList.remove('notrans');
        ghost.style.display='none';
        if(snap){
          if(snap.w>=stage.clientWidth)this.maximize(id);
          else{el.style.left=snap.x+'px';el.style.top=snap.y+'px';el.style.width=snap.w+'px';el.style.height=snap.h+'px';}
        }
        win.onResize&&win.onResize();
      };
      addEventListener('pointermove',mv);addEventListener('pointerup',up);
    });
    /* --- 八向缩放 --- */
    $$('.rsz',el).forEach(rz=>{
      rz.addEventListener('pointerdown',e=>{
        if(win.maxed||win.fscreen)return;
        e.preventDefault();e.stopPropagation();
        this.focus(id);
        el.classList.add('notrans');
        const d=rz.dataset.d;
        const r=el.getBoundingClientRect();
        const sx=e.clientX,sy=e.clientY;
        const minW=app.minW||300,minH=app.minH||200;
        const mv=ev=>{
          const dx=ev.clientX-sx,dy=ev.clientY-sy;
          let {left,top,width,height}=r;
          if(d.includes('e'))width=Math.max(minW,r.width+dx);
          if(d.includes('s'))height=Math.max(minH,r.height+dy);
          if(d.includes('w')){width=Math.max(minW,r.width-dx);left=r.left+(r.width-width);}
          if(d.includes('n')){height=Math.max(minH,r.height-dy);top=r.top+(r.height-height);}
          el.style.left=left+'px';el.style.top=top+'px';el.style.width=width+'px';el.style.height=height+'px';
        };
        const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);el.classList.remove('notrans');win.onResize&&win.onResize();};
        addEventListener('pointermove',mv);addEventListener('pointerup',up);
      });
    });
    Taskbar.render();
    this.focus(id);
    if(app.mount)app.mount(win,opts);
    return win;
  },
  focus(id){
    const win=this.wins.get(id);if(!win)return;
    if(win.minimized)this.restore(id);
    this.wins.forEach(w=>w.el.classList.remove('active'));
    if(this.z>8500){let i=101;this.wins.forEach(w=>{w.el.style.zIndex=i++;});this.z=i;}
    win.el.style.zIndex=++this.z;
    win.el.classList.add('active');
    this.activeId=id;
    Taskbar.render();
  },
  minimize(id){
    const win=this.wins.get(id);if(!win)return;
    win.minimized=true;
    win.el.classList.add('min');
    setTimeout(()=>{if(win.minimized)win.el.style.display='none';},200);
    if(this.activeId===id)this.activeId=null;
    Taskbar.render();
  },
  restore(id){
    const win=this.wins.get(id);if(!win)return;
    win.minimized=false;
    win.el.style.display='flex';
    requestAnimationFrame(()=>win.el.classList.remove('min'));
    Taskbar.render();
  },
  toggleMax(id){
    const win=this.wins.get(id);if(!win)return;
    win.maxed?this.unmaximize(id):this.maximize(id);
  },
  maximize(id){
    const win=this.wins.get(id);if(!win||win.maxed)return;
    win.rect={l:win.el.style.left,t:win.el.style.top,w:win.el.style.width,h:win.el.style.height};
    win.maxed=true;
    win.el.classList.add('maxed');
    win.el.style.left='0px';win.el.style.top='0px';
    win.el.style.width=$('#stage').clientWidth+'px';
    win.el.style.height=$('#stage').clientHeight+'px';
    $('.tmax',win.el).innerHTML=ICONS.rest;
    win.onResize&&win.onResize();
  },
  unmaximize(id){
    const win=this.wins.get(id);if(!win||!win.maxed)return;
    win.maxed=false;
    win.el.classList.remove('maxed');
    if(win.rect){win.el.style.left=win.rect.l;win.el.style.top=win.rect.t;win.el.style.width=win.rect.w;win.el.style.height=win.rect.h;}
    $('.tmax',win.el).innerHTML=ICONS.max;
    win.onResize&&win.onResize();
  },
  close(id){
    const win=this.wins.get(id);if(!win)return;
    try{win.onClose&&win.onClose(win);}catch(e){console.warn(e);}
    try{win.app.unmount&&win.app.unmount(win);}catch(e){console.warn(e);}
    win.el.classList.add('closing');
    this.wins.delete(id);
    if(this.activeId===id)this.activeId=null;
    setTimeout(()=>win.el.remove(),170);
    Taskbar.render();
  },
  peek(id,on){
    this.wins.forEach(w=>{
      if(w.id===id)w.el.classList.toggle('peek',on);
      else if(!w.minimized)w.el.classList.toggle('peek-dim',on);
    });
  },
  peekClear(){this.wins.forEach(w=>{w.el.classList.remove('peek');w.el.classList.remove('peek-dim');});},
  showDesktop(){
    const anyVisible=[...this.wins.values()].some(w=>!w.minimized);
    if(anyVisible){this._stashed=[...this.wins.keys()].filter(id=>!this.wins.get(id).minimized);this.wins.forEach((w,id)=>this.minimize(id));}
    else if(this._stashed){this._stashed.forEach(id=>this.wins.has(id)&&this.restore(id));this._stashed=null;}
  }
};

    const path=()=>'/desktop/'+rec.entry.name;
    /* 单击打开；Ctrl/Shift 选择 */
    el.addEventListener('click',e=>{
      e.stopPropagation();
      if(isTouch&&Date.now()-(Desktop._tt||0)<700)return;
      if(e.ctrlKey||e.metaKey){this.toggleSel(rec.entry.name);return;}
      if(e.shiftKey){this.toggleSel(rec.entry.name);return;}
      openPath(path());
    });
    el.addEventListener('pointerenter',()=>preloadPath(path()));
    el.addEventListener('pointerdown',()=>preloadPath(path()));
    /* 右键菜单 */
    el.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      if(!this.sel.has(rec.entry.name)){this.sel.clear();this.sel.add(rec.entry.name);this.renderSel();}
      fileContext(e.clientX,e.clientY,this.selSelPaths());
    });
    /* HTML5 拖拽（鼠标）：内部移动 + 拖出浏览器 */
    el.addEventListener('dragstart',e=>{
      if(isTouch){e.preventDefault();return;}
      if(!this.sel.has(rec.entry.name)){this.sel.clear();this.sel.add(rec.entry.name);this.renderSel();}
      const paths=this.selSelPaths();
      paths.forEach(p=>preloadPath(p));
      setDragPayload(e,paths,'desktop');
      el.classList.add('drag-src');
      e.dataTransfer.setData('text/plain',rec.entry.name);
      this._dragPaths=paths;
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('drag-src');
      $$('.dicon.drop-hot').forEach(x=>x.classList.remove('drop-hot'));
      if(this._dragPaths)cleanupDrag(this._dragPaths);
      this._dragPaths=null;
    });
    /* 文件夹图标作为放置目标 */
    if(rec.entry.isDirectory){
      el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();el.classList.add('drop-hot');});
      el.addEventListener('dragleave',()=>el.classList.remove('drop-hot'));
      el.addEventListener('drop',async e=>{
        e.preventDefault();e.stopPropagation();
        el.classList.remove('drop-hot');
        const raw=e.dataTransfer.getData('application/x-amber-paths');
        if(raw){
          const paths=JSON.parse(raw);
          try{
            for(const p of paths){
              const nn=await fs.uniqueName(path(),baseName(p));
              await fs.rename(p,path()+'/'+nn);
            }
            toast('已移入 '+rec.entry.name,'ok');
            this.render();
          }catch(err){toast(err.message||'移动失败','err');}
        }
      });
    }
    /* 触摸拖拽（移动端） */
    if(isTouch)this.bindTouch(rec);
  },
  bindTouch(rec){
    const el=rec.el;
    let st=null,ghost=null,timer=null,moved=false,dragging=false;
    el.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      moved=false;dragging=false;
      st={x:t.clientX,y:t.clientY,t:Date.now()};
      timer=setTimeout(()=>{
        if(!moved){
          Desktop._tt=Date.now();
          if(!this.sel.has(rec.entry.name)){this.sel.clear();this.sel.add(rec.entry.name);this.renderSel();}
          const r=el.getBoundingClientRect();
          fileContext(r.left+r.width/2,r.top+r.height,this.selSelPaths());
        }
      },480);
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!st)return;
      const t=e.touches[0];
      const dx=t.clientX-st.x,dy=t.clientY-st.y;
      if(!moved&&Math.hypot(dx,dy)>12){
        moved=true;clearTimeout(timer);
        if(!this.sel.has(rec.entry.name)){this.sel.clear();this.sel.add(rec.entry.name);this.renderSel();}
        dragging=true;
        el.classList.add('notrans','drag-src');
      }
      if(dragging){
        e.preventDefault();
        el.style.left=(t.clientX-46)+'px';
        el.style.top=(t.clientY-40)+'px';
        const under=document.elementFromPoint(t.clientX,t.clientY);
        $$('.dicon.drop-hot').forEach(x=>x.classList.remove('drop-hot'));
        const fic=under&&under.closest('.dicon');
        if(fic&&fic!==el&&this.icons.get(fic.dataset.name)?.entry.isDirectory)fic.classList.add('drop-hot');
      }
    },{passive:false});
    el.addEventListener('touchend',async e=>{
      clearTimeout(timer);
      const wasDrag=dragging;
      el.classList.remove('drag-src');
      if(st&&!wasDrag&&Date.now()-st.t<400&&e.changedTouches.length){
        const t=e.changedTouches[0];
        if(Math.hypot(t.clientX-st.x,t.clientY-st.y)<14){
          Desktop._tt=Date.now();
          if(this.sel.size>1&&this.sel.has(rec.entry.name)){}
          else openPath('/desktop/'+rec.entry.name);
        }
      }
      if(wasDrag){
        el.classList.remove('notrans');
        const t=e.changedTouches[0];
        const under=document.elementFromPoint(t.clientX,t.clientY);
        const fic=under&&under.closest('.dicon');
        const target=fic&&this.icons.get(fic.dataset.name);
        const paths=this.selSelPaths();
        if(target&&target.entry.isDirectory&&target.el!==el){
          try{for(const p of paths){await fs.rename(p,'/desktop/'+target.entry.name+'/'+(await fs.uniqueName('/desktop/'+target.entry.name,baseName(p))));}toast('已移入 '+target.entry.name,'ok');}catch(err){toast(err.message,'err');}
          this.render();
        }else{
          const layer=$('#iconlayer').getBoundingClientRect();
          let x=clamp(t.clientX-46-layer.left,0,layer.width-90);
          let y=clamp(t.clientY-40-layer.top,0,layer.height-100);
          if(Store.get('snapGrid')){const c=this.gridCell();x=Math.round(x/c.w)*c.w;y=Math.round(y/c.h)*c.h;}
          this.iconPos[rec.entry.name]={x,y};
          this.savePos();
          el.style.left=x+'px';el.style.top=y+'px';
        }
        $$('.dicon.drop-hot').forEach(x=>x.classList.remove('drop-hot'));
      }
      st=null;dragging=false;
    },{passive:true});
  },
  selSelPaths(){return [...this.sel].map(n=>'/desktop/'+n);},
  toggleSel(name){this.sel.has(name)?this.sel.delete(name):this.sel.add(name);this.renderSel();},
  renderSel(){$$('.dicon').forEach(el=>el.classList.toggle('sel',this.sel.has(el.dataset.name)));},
  clearSel(){this.sel.clear();this.renderSel();},
  arrange(){
    const c=this.gridCell();
    const stage=$('#stage');
    const cols=Math.max(1,Math.floor((stage.clientHeight-20)/c.h));
    let i=0;
    this.icons.forEach((rec,name)=>{
      const col=Math.floor(i/cols),row=i%cols;
      this.iconPos[name]={x:12+col*c.w,y:10+row*c.h};
      rec.el.style.left=this.iconPos[name].x+'px';
      rec.el.style.top=this.iconPos[name].y+'px';
      i++;
    });
    this.savePos();
  }
};

/* ---------- 桌面舞台事件：框选 / 拖放 / 右键 ---------- */
function initStage(){
  const stage=$('#stage');
  const layer=$('#iconlayer');
  /* 框选 */
  let mq=null;
  stage.addEventListener('pointerdown',e=>{
    if(e.target!==stage&&e.target!==layer)return;
    if(e.button!==0)return;
    Desktop.clearSel();
    closeMenus();
    const sx=e.clientX,sy=e.clientY;
    const box=$('#marquee');
    mq={sx,sy,active:false,add:e.ctrlKey||e.metaKey};
    stage.setPointerCapture(e.pointerId);
    const mv=ev=>{
      if(!mq)return;
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!mq.active&&Math.hypot(dx,dy)>6){mq.active=true;box.style.display='block';}
      if(!mq.active)return;
      const x=Math.min(sx,ev.clientX),y=Math.min(sy,ev.clientY);
      const w=Math.abs(dx),hh=Math.abs(dy);
      box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=hh+'px';
      const r={x,y,w,h:hh};
      Desktop.icons.forEach((rec,name)=>{
        const ir=rec.el.getBoundingClientRect();
        const hit=!(ir.right<r.x||ir.left>r.x+r.w||ir.bottom<r.y||ir.top>r.y+r.h);
        if(hit)Desktop.sel.add(name);else if(!mq.add)Desktop.sel.delete(name);
      });
      Desktop.renderSel();
    };
    const up=()=>{
      stage.removeEventListener('pointermove',mv);
      stage.removeEventListener('pointerup',up);
      box.style.display='none';
      mq=null;
    };
    stage.addEventListener('pointermove',mv);
    stage.addEventListener('pointerup',up);
  });
  /* 拖放进入桌面 */
  stage.addEventListener('dragover',e=>{
    if(e.dataTransfer.types.includes('Files')||e.dataTransfer.types.includes('application/x-amber-paths')){
      e.preventDefault();
      e.dataTransfer.dropEffect='copy';
    }
  });
  stage.addEventListener('drop',async e=>{
    e.preventDefault();
    const raw=e.dataTransfer.getData('application/x-amber-paths');
    const src=e.dataTransfer.getData('application/x-amber-src');
    /* 内部图标移动 */
    if(raw&&src==='desktop'){
      const paths=JSON.parse(raw);
      const names=paths.map(baseName);
      const layerR=$('#iconlayer').getBoundingClientRect();
      let bx=e.clientX-layerR.left-46,by=e.clientY-layerR.top-30;
      if(Store.get('snapGrid')){const c=Desktop.gridCell();bx=Math.round(bx/c.w)*c.w;by=Math.round(by/c.h)*c.h;}
      bx=clamp(bx,0,layerR.width-90);by=clamp(by,0,layerR.height-100);
      names.forEach((n,i)=>{
        if(!Desktop.icons.has(n))return;
        const p={x:clamp(bx+i*22,0,layerR.width-90),y:clamp(by+i*22,0,layerR.height-100)};
        Desktop.iconPos[n]=p;
        const el=Desktop.icons.get(n).el;
        el.style.left=p.x+'px';el.style.top=p.y+'px';
      });
      Desktop.savePos();
      return;
    }
    /* 从资源管理器拖入 → 移动到桌面 */
    if(raw&&src==='explorer'){
      try{
        const paths=JSON.parse(raw);
        for(const p of paths){
          const nn=await fs.uniqueName('/desktop',baseName(p));
          await fs.rename(p,'/desktop/'+nn);
        }
        toast('已移动到桌面','ok');
        Desktop.render();
      }catch(err){toast(err.message,'err');}
      return;
    }
    /* 物理文件拖入 */
    if(e.dataTransfer.files&&e.dataTransfer.files.length){
      const prog=progressDlg('正在导入文件');
      try{
        const n=await importDataTransfer(e.dataTransfer,'/desktop',(f,p)=>prog.set('导入 '+f,Math.round(p*100)));
        toast('已导入 '+n+' 个项目到桌面','ok');
        Desktop.render();
      }catch(err){toast('导入失败: '+err.message,'err');}
      prog.close();
    }
  });
  /* 桌面右键 */
  stage.addEventListener('contextmenu',e=>{
    if(e.target!==stage&&e.target!==layer)return;
    e.preventDefault();
    desktopContext(e.clientX,e.clientY);
  });
}
function desktopContext(x,y){
  showMenu(x,y,[
    {label:'新建文件夹',icon:'folder',fn:async()=>{const n=await promptDlg('新建文件夹','文件夹名称','新建文件夹');if(!n)return;try{await fs.mkdir('/desktop/'+(await fs.uniqueName('/desktop',n)));Desktop.render();}catch(e){toast(e.message,'err');}}},
    {label:'新建文本文档',icon:'fText',fn:async()=>{const n=await promptDlg('新建文本文档','文件名','新建文档.txt');if(!n)return;try{await fs.writeFile('/desktop/'+(await fs.uniqueName('/desktop',n)),'');Desktop.render();}catch(e){toast(e.message,'err');}}},
    'sep',
    {label:'上传文件到桌面',icon:'upload',fn:async()=>{const files=await pickFiles({multiple:true});if(!files.length)return;for(const f of files)await fs.writeFile('/desktop/'+(await fs.uniqueName('/desktop',f.name)),f);toast('已上传 '+files.length+' 个文件','ok');Desktop.render();}},
    {label:'挂载本地文件夹',icon:'mount',fn:async()=>{try{if(!window.showDirectoryPicker){toast('当前浏览器不支持 File System Access API','warn');return;}const dh=await window.showDirectoryPicker({mode:'readwrite'});await Mounts.add(dh);}catch(e){if(e.name!=='AbortError')toast('挂载失败','err');}}},
    'sep',
    {label:'自动排列图标',icon:'grid',fn:()=>{Store.set('autoArrange',!Store.get('autoArrange'));if(Store.get('autoArrange'))Desktop.arrange();}},
    {label:'对齐到网格',icon:'check',fn:()=>{Store.set('snapGrid',!Store.get('snapGrid'));toast(Store.get('snapGrid')?'已开启网格对齐':'已关闭网格对齐');}},
    {label:'刷新桌面',icon:'refresh',fn:()=>Desktop.render()},
    {label:'全屏模式',icon:'full',fn:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('无法进入全屏','warn'));}},
    'sep',

  ]);

/* ---------- 文件图标类型 ---------- */
function fileIcon(en){
  if(en.isDirectory)return 'folder';
  const ext=extOf(en.name);
  if(IMG_EXT.includes(ext))return 'fImg';
  if(AUD_EXT.includes(ext))return 'fAud';
  if(VID_EXT.includes(ext))return 'fVid';
  if(ext==='pdf')return 'fPdf';
  if(ZIP_EXT.includes(ext))return 'fZip';
  if(TBL_EXT.includes(ext))return 'fTbl';
  if(['html','htm','css','js','json','xml','svg'].includes(ext))return 'fCode';
  if(TXT_EXT.includes(ext)||CODE_EXT.includes(ext))return 'fText';
  return 'file';
}
const KIND_NAME=en=>{
  if(en.isDirectory)return '文件夹';
  const ext=extOf(en.name);
  if(IMG_EXT.includes(ext))return '图像';if(AUD_EXT.includes(ext))return '音频';if(VID_EXT.includes(ext))return '视频';
  if(ext==='pdf')return 'PDF 文档';if(ZIP_EXT.includes(ext))return '压缩包';if(TBL_EXT.includes(ext))return '表格';
  return (ext?ext.toUpperCase()+' ':'')+'文件';
};

/* ---------- 文件右键菜单 / 打开分派 ---------- */
async function openPath(path){
  const _n=Date.now();
  if(_n-(openPath._t||0)<380)return;
  openPath._t=_n;
  let st;try{st=await fs.stat(path);}catch(e){toast('无法打开：'+(e.message||path),'err');return;}
  if(st.isDirectory){openApp('files',{path});return;}
  openFile(path,st);
}
async function openFile(path,st){
  st=st||await fs.stat(path);
  const ext=extOf(path);
  if(IMG_EXT.includes(ext))return APPS.image.open(path);
  if(AUD_EXT.includes(ext)||VID_EXT.includes(ext))return APPS.media.open(path,VID_EXT.includes(ext));
  if(ext==='pdf')return APPS.pdf.open(path);
  if(TBL_EXT.includes(ext))return APPS.table.open(path);
  if(['csv','tsv'].includes(ext))return APPS.table.open(path);
  if(ZIP_EXT.includes(ext)){
    const ok=await confirmDlg('解压缩','将 "'+baseName(path)+'" 解压到同级目录？',{okLabel:'解压'});
    if(ok)extractArchive(path);
    return;
  }
  if(['html','htm'].includes(ext))return APPS.code.open(path);
  if(['css','js','mjs','jsx','ts','json','xml','svg','md','markdown'].includes(ext))return APPS.code.open(path);
  if(TXT_EXT.includes(ext))return APPS.notepad.open(path);
  if(CODE_EXT.includes(ext))return APPS.code.open(path);
  /* 未知类型 */
  const v=await chooseDlg('无法识别的文件类型',[
    {icon:'fText',color:'#5E8A6E',label:'以纯文本打开',desc:'用记事本查看原始内容',value:'text'},
    {icon:'appCode',color:'#B9832E',label:'用代码编辑器打开',desc:'语法高亮编辑',value:'code'},
    {icon:'export',color:'#4E7F9E',label:'下载此文件',desc:'导出到本地',value:'dl'},
  ]);
  if(v==='text')APPS.notepad.open(path);
  else if(v==='code')APPS.code.open(path);
  else if(v==='dl'){downloadBlob(await fs.readFile(path,'blob'),baseName(path));}
}
async function extractArchive(path){
  const prog=progressDlg('正在解压 '+baseName(path));
  try{
    const target=await Archive.extract(path,(f,p)=>prog.set('解压 '+f,p?Math.round(p*100):null));
    toast('已解压到 '+target,'ok');
    Explorer.refreshDir(dirName(path));Desktop.render();
  }catch(e){toast('解压失败：'+e.message,'err');}
  prog.close();
}
function openWithList(path){
  const ext=extOf(path);
  const list=[];
  list.push({icon:'appCode',color:'#B9832E',label:'代码编辑器',desc:'HTML / CSS / JS / Markdown',value:'code'});
  list.push({icon:'appNote',color:'#7A8C5A',label:'记事本',desc:'纯文本编辑',value:'notepad'});
  list.push({icon:'appTbl',color:'#5B8A72',label:'表格',desc:'CSV / TSV 双视图',value:'table'});
  if(IMG_EXT.includes(ext))list.unshift({icon:'appImg',color:'#A98436',label:'图片查看器',desc:'条漫式浏览',value:'image'});
  if(['html','htm'].includes(ext))list.unshift({icon:'appWeb',color:'#4E7F9E',label:'浏览器预览',desc:'渲染完整页面',value:'browser'});
  list.push({icon:'fText',color:'#6B7B8A',label:'以纯文本打开',desc:'查看原始内容',value:'notepad'});
  return list;
}
async function openWithDlg(path){
  const v=await chooseDlg('打开方式 · '+baseName(path),openWithList(path));
  if(v==='code')APPS.code.open(path);
  else if(v==='notepad')APPS.notepad.open(path);
  else if(v==='table')APPS.table.open(path);
  else if(v==='image')APPS.image.open(path);
  else if(v==='browser')APPS.browser.openVFS(path);
}
function fileContext(x,y,paths){
  const one=paths.length===1;
  const en=one?{name:baseName(paths[0]),isDirectory:false}:null;
  const ext=one?extOf(paths[0]):'';
  const items=[
    one?{label:'打开',icon:'play',fn:()=>openPath(paths[0])}:null,
    one?{label:'打开方式…',icon:'chevR',fn:()=>openWithDlg(paths[0])}:null,
    one?'sep':null,
    {label:'复制',icon:'copy',kbd:'Ctrl+C',fn:()=>{Explorer.clip={paths,mode:'copy'};toast('已复制 '+paths.length+' 项');}},
    {label:'剪切',icon:'cut',kbd:'Ctrl+X',fn:()=>{Explorer.clip={paths,mode:'cut'};toast('已剪切 '+paths.length+' 项');}},
    one&&IMG_EXT.includes(ext)?{label:'设为桌面壁纸',icon:'wall',fn:async()=>{Store.set('wallCustom',paths[0]);Store.set('wallpaper','custom');Wallpaper.apply();toast('已设为壁纸','ok');}}:null,
    one&&Archive.isArchive(paths[0])?{label:'解压到当前目录',icon:'fZip',fn:()=>extractArchive(paths[0])}:null,
    one?{label:'下载',icon:'download',fn:async()=>{for(const p of paths){const it=await preloadPath(p);if(it)downloadBlob(it.blob,baseName(p));}}}:
        {label:'下载全部',icon:'download',fn:async()=>{for(const p of paths){const it=await preloadPath(p);if(it)downloadBlob(it.blob,baseName(p));}}},
    'sep',
    one?{label:'重命名',icon:'edit',kbd:'F2',fn:()=>renamePath(paths[0])}:null,
    {label:'删除',icon:'trash',kbd:'Del',danger:true,fn:async()=>{
      const ok=await confirmDlg('确认删除','确定要删除选中的 '+paths.length+' 个项目吗？此操作不可撤销。',{danger:true,okLabel:'删除'});
      if(!ok)return;
      for(const p of paths){try{await fs.rm(p,true);}catch(e){toast(e.message,'err');}}
      toast('已删除','ok');Desktop.render();Explorer.refreshAll();
    }},
    one?'sep':null,
    one?{label:'属性',icon:'info',fn:()=>showProps(paths[0])}:null,
  ].filter(Boolean);
  showMenu(x,y,items);
}
async function renamePath(path){
  const old=baseName(path);
  const n=await promptDlg('重命名','新名称',old);
  if(!n||n===old)return;
  try{
    await fs.rename(path,dirName(path)==='/'?'/'+n:dirName(path)+'/'+n);
    Desktop.render();Explorer.refreshAll();
  }catch(e){toast(e.message,'err');}
}
async function showProps(path){
  const st=await fs.stat(path);
  let size=st.size;
  if(st.isDirectory){try{size=await fs.usage(path);}catch(e){}}
  const body=h('div');

    '<div class="st-row"><span>位置</span><span class="sp"></span><b style="font-family:var(--f-mono);font-size:11.5px">'+esc(path)+'</b></div>'+
    '<div class="st-row"><span>大小</span><span class="sp"></span><b>'+fmtSize(size)+'</b></div>'+
    '<div class="st-row"><span>修改时间</span><span class="sp"></span><b>'+fmtDate(st.mtime)+'</b></div>'+
    '<div class="st-row"><span>存储后端</span><span class="sp"></span><b>'+(path.startsWith('/mnt/local')?'本地文件夹（FSA）':'OPFS 虚拟文件系统')+'</b></div>';
  makeDlg('属性',body,[{label:'关闭',cls:'primary'}]);
}

/* ---------- 通用右键菜单 ---------- */
function showMenu(x,y,items){
  const m=$('#ctxmenu');
  m.innerHTML='';
  items.forEach(it=>{
    if(it==='sep'){m.appendChild(h('div','menu-sep'));return;}
    const b=h('div','menu-item'+(it.danger?' danger':'')+(it.disabled?' disabled':''));
    if(it.disabled)b.setAttribute('disabled','');
    b.innerHTML=icon(it.icon||'file')+ '<span>'+esc(it.label)+'</span>'+(it.kbd?'<span class="kbd">'+it.kbd+'</span>':'');
    b.onclick=e=>{e.stopPropagation();m.classList.remove('open');it.fn&&it.fn();};
    m.appendChild(b);
  });
  m.classList.add('open');
  const mw=m.offsetWidth,mh=m.offsetHeight;
  m.style.left=Math.min(x,innerWidth-mw-8)+'px';
  m.style.top=Math.min(y,innerHeight-mh-8)+'px';
}

const APPS={};

/* ---------- 10.1 文件资源管理器 ---------- */
APPS.files={
  name:'文件管理器',icon:'appFiles',w:860,h:560,minW:480,minH:320,type:'files',
  instances:new Set(),
  launch(opts){return WM.open('files',opts||{});},
  mount(win,opts){
    const st={
      dir:pathNorm(opts.path||'/desktop'),
      hist:[pathNorm(opts.path||'/desktop')],hi:0,
      sel:new Set(),sort:{key:'name',dir:1},view:isMobile()?'grid':'grid',

        '<button class="ibtn fe-up" title="上级">'+ICONS.up+'</button>'+

      '</div>'+
