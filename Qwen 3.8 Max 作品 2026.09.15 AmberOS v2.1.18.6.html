        '<button class="btn sm fe-upload">'+icon('upload')+'上传</button>'+
        '<button class="btn sm fe-mount">'+icon('mount')+'挂载</button>'+
        '<span class="sp"></span>'+
        '<button class="ibtn fe-view-grid on" title="网格视图">'+ICONS.grid+'</button>'+
        '<button class="ibtn fe-view-list" title="列表视图">'+ICONS.list+'</button>'+
      '</div>'+
      '<div class="fe"><aside class="fe-side"></aside><div class="fe-main"><div class="fe-list-wrap"><div class="fe-list"></div><div class="fe-empty" style="display:none"></div><div class="fe-drophint">释放以导入到当前目录</div></div></div></div>'+
      '<div class="statusbar"><span class="fe-cnt"></span><span class="sp"></span><span class="fe-path"></span></div>';
    const listWrap=$('.fe-list-wrap',body),listEl=$('.fe-list',body);
    /* 侧边栏 */
    const renderSide=()=>{
      const side=$('.fe-side',body);
      side.innerHTML='<h4>快速访问</h4>';
      const quick=[['桌面','/desktop','folder'],['文档','/documents','fText'],['下载','/downloads','download'],['图片','/pictures','fImg'],['音乐','/music','fAud'],['视频','/videos','fVid'],['根目录','/','appFiles']];
      quick.forEach(([label,path,ic])=>{
        const b=h('div','fe-nav'+(st.dir===path?' on':''),icon(ic)+'<span>'+label+'</span>');
        b.onclick=()=>nav(path);
        side.appendChild(b);
      });
      side.appendChild(h('h4','','本地挂载'));
      if(!Mounts.map.size)side.appendChild(h('div','fe-nav',icon('mount')+'<span style="color:var(--ink3)">未挂载文件夹</span>'));
      Mounts.map.forEach((m,name)=>{
        const b=h('div','fe-nav'+(st.dir==='/mnt/local/'+name?' on':''),icon('mount')+'<span>'+esc(name)+'</span>');
        b.onclick=()=>nav('/mnt/local/'+name);
        side.appendChild(b);
      });
    };
    /* 面包屑 */
    const renderCrumb=()=>{
      const c=$('.crumb',body);c.innerHTML='';
      const parts=st.dir.split('/').filter(Boolean);
      const mk=(label,path,ic)=>{const b=h('button','',ic?icon(ic):label);if(!ic)b.textContent=label;b.onclick=()=>nav(path);return b;};
      c.appendChild(mk('根','/','appFiles'));
      let acc='';
      parts.forEach(p=>{acc+='/'+p;c.appendChild(h('span','','<span class="icw" style="display:flex;color:var(--ink3)">'+ICONS.chevR+'</span>'));c.appendChild(mk(p,acc));});
    };
    /* 导航 */
    const nav=async(path,push=true)=>{
      path=pathNorm(path);
      try{const s=await fs.stat(path);if(!s.isDirectory)throw new Error('不是目录');}catch(e){toast('无法进入：'+path,'err');return;}
      st.dir=path;st.sel.clear();st.search='';$('.fe-search',body).value='';
      if(push){st.hist=st.hist.slice(0,st.hi+1);st.hist.push(path);st.hi=st.hist.length-1;}
      renderSide();renderCrumb();
      await render();
    };
    win.nav=nav;
    /* 列表渲染 */
    const render=async()=>{
      let list;
      try{list=await fs.readdir(st.dir);}catch(e){toast('读取目录失败：'+e.message,'err');list=[];}
      st.entries=list;
      if(st.search){
        const q=st.search.toLowerCase();
        const all=await fs.walk(st.dir,1500);
        list=all.filter(e=>e.name.toLowerCase().includes(q));
      }
      const {key,dir}=st.sort;
      list=[...list].sort((a,b)=>{
        if(a.isDirectory!==b.isDirectory)return b.isDirectory-a.isDirectory;
        let v=0;
        if(key==='name')v=naturalCmp(a.name,b.name);
        else if(key==='size')v=(a.size||0)-(b.size||0);
        else if(key==='mtime')v=(a.mtime||0)-(b.mtime||0);
        else if(key==='type')v=naturalCmp(extOf(a.name),extOf(b.name));
        return v*dir;
      });
      st.shown=list;
      $('.fe-cnt',body).textContent=list.length+' 个项目'+(st.search?'（搜索："'+st.search+'"）':'');
      $('.fe-path',body).textContent=st.dir;
      listEl.innerHTML='';
      $('.fe-empty',body).style.display=list.length?'none':'grid';
      if(!list.length){$('.fe-empty',body).innerHTML=icon(st.search?'search':'folder')+'<div>'+(st.search?'没有找到匹配的项目':'此文件夹为空')+'</div><div style="font-size:12px;opacity:.7">拖拽文件到此处，或点击「上传」</div>';}
      const thumb=(card,en)=>{
        if(en.isDirectory||!IMG_EXT.includes(extOf(en.name))||en.size>8*1024*1024)return;
        fs.readFile(st.dir2(en),'blob').then(b=>{
          const img=h('img');img.src=URL.createObjectURL(b);
          const fic=$('.fic',card);fic.innerHTML='';fic.appendChild(img);
        }).catch(()=>{});
      };
      if(st.view==='grid'){
        const g=h('div','fe-grid');
        list.forEach(en=>{
          const c=h('div','fe-card'+(st.sel.has(en.name)?' sel':''));
          c.dataset.name=en.name;
          c.draggable=true;
          c.innerHTML='<div class="fic">'+(ICONS[fileIcon(en)]||ICONS.file)+'</div><b>'+esc(en.name)+'</b>';
          bindCard(c,en,g);
          g.appendChild(c);
          thumb(c,en);
        });
        listEl.appendChild(g);
      }else{
        const rows=h('div','fe-rows');
        const head=h('div','fe-rowhead');
        const cols=[['name','名称',null],['size','大小',st.cols.size],['type','类型',st.cols.type],['mtime','修改日期',st.cols.mtime]];
        cols.forEach(([key2,label,w])=>{
          const hc=h('div','hc c-'+key2+(st.sort.key===key2?' sr':''));
          if(w)hc.style.width=w+'px';else hc.style.flex='1';
          hc.innerHTML=esc(label)+(st.sort.key===key2?(st.sort.dir>0?ICONS.sortAsc:ICONS.sortDesc):'');
          hc.onclick=e=>{if(e.target.classList.contains('colrz'))return;st.sort=st.sort.key===key2?{key:key2,dir:-st.sort.dir}:{key:key2,dir:1};render();};
          if(key2!=='name'){
            const rz=h('div','colrz');
            rz.addEventListener('pointerdown',e=>{
              e.stopPropagation();e.preventDefault();
              const sx=e.clientX,sw=hc.offsetWidth;
              const mv=ev=>{const w2=Math.max(56,sw+ev.clientX-sx)+'px';hc.style.width=w2;$$('.fe-row .c-'+key2,body).forEach(c=>c.style.width=w2);st.cols[key2]=hc.offsetWidth;};
              const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
              addEventListener('pointermove',mv);addEventListener('pointerup',up);
            });
            hc.appendChild(rz);
          }
          head.appendChild(hc);
        });
        rows.appendChild(head);
        list.forEach(en=>{
          const r=h('div','fe-row'+(st.sel.has(en.name)?' sel':''));
          r.dataset.name=en.name;r.draggable=true;
          r.innerHTML='<div class="cell c-name" style="flex:1"><span class="fic">'+(ICONS[fileIcon(en)]||ICONS.file)+'</span><span class="nm">'+esc(en.name)+'</span></div>'+
            '<div class="cell c-size dim" style="width:'+st.cols.size+'px">'+(en.isDirectory?'—':fmtSize(en.size))+'</div>'+
            '<div class="cell c-type dim" style="width:'+st.cols.type+'px">'+KIND_NAME(en)+'</div>'+
            '<div class="cell c-mtime dim" style="width:'+st.cols.mtime+'px">'+fmtDate(en.mtime)+'</div>';
          bindCard(r,en,rows);
          rows.appendChild(r);
        });
        listEl.appendChild(rows);
      }
    };
    st.dir2=en=>(st.dir==='/'?'':st.dir)+'/'+en.name;
    /* 卡片事件：选择 / 打开 / 拖拽 / 框选 */
    function bindCard(c,en,container){
      const path=()=>st.dir2(en);
      c.addEventListener('click',e=>{
        e.stopPropagation();
        if(e.ctrlKey||e.metaKey){st.sel.has(en.name)?st.sel.delete(en.name):st.sel.add(en.name);}
        else if(e.shiftKey){st.sel.add(en.name);}
        else{st.sel.clear();st.sel.add(en.name);}
        syncSel();
      });
      c.addEventListener('dblclick',e=>{e.stopPropagation();openPath(path());});
      if(isTouch){
        let lt=0;
        c.addEventListener('click',e=>{const now=Date.now();if(now-lt<380)openPath(path());lt=now;});
      }
      c.addEventListener('contextmenu',e=>{
        e.preventDefault();e.stopPropagation();
        if(!st.sel.has(en.name)){st.sel.clear();st.sel.add(en.name);syncSel();}
        fileContext(e.clientX,e.clientY,[...st.sel].map(n=>(st.dir==='/'?'':st.dir)+'/'+n));
      });
      c.addEventListener('pointerenter',()=>{if(!en.isDirectory)preloadPath(path());});
      c.addEventListener('dragstart',e=>{
        if(isTouch){e.preventDefault();return;}
        if(!st.sel.has(en.name)){st.sel.clear();st.sel.add(en.name);syncSel();}
        const paths=[...st.sel].map(n=>st.dir2({name:n}));
        paths.forEach(p=>preloadPath(p));
        setDragPayload(e,paths,'explorer');
        win._dragPaths=paths;
        e.stopPropagation();
      });
      c.addEventListener('dragend',()=>{if(win._dragPaths)cleanupDrag(win._dragPaths);win._dragPaths=null;$$('.fe-card.drop-hot',body).forEach(x=>x.classList.remove('drop-hot'));});
      if(en.isDirectory){
        c.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();c.classList.add('drop-hot');});
        c.addEventListener('dragleave',()=>c.classList.remove('drop-hot'));
        c.addEventListener('drop',async e=>{
          e.preventDefault();e.stopPropagation();c.classList.remove('drop-hot');
          const raw=e.dataTransfer.getData('application/x-amber-paths');
          if(raw){
            const paths=JSON.parse(raw);
            try{
              for(const p of paths){if(pathNorm(p)===pathNorm(path()))continue;await fs.rename(p,path()+'/'+(await fs.uniqueName(path(),baseName(p))));}
              toast('已移入 '+en.name,'ok');render();Desktop.render();
            }catch(err){toast(err.message,'err');}
          }
        });
      }
    }
    function syncSel(){$$('.fe-card,.fe-row',listEl).forEach(c=>c.classList.toggle('sel',st.sel.has(c.dataset.name)));}
    /* 空白处：框选 + 拖放导入 + 右键 */
    listWrap.addEventListener('pointerdown',e=>{
      if(e.target!==listWrap&&!e.target.classList.contains('fe-grid')&&!e.target.classList.contains('fe-rows')&&!e.target.classList.contains('fe-list'))return;
      if(e.button!==0)return;
      st.sel.clear();syncSel();
      const sx=e.clientX,sy=e.clientY;const box=h('div');box.id='';box.style.cssText='position:fixed;border:1px solid var(--accent);background:var(--accent-soft);z-index:50;pointer-events:none';
      document.body.appendChild(box);
      let active=false;
      const mv=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(!active&&Math.hypot(dx,dy)>6)active=true;
        if(!active)return;
        const x=Math.min(sx,ev.clientX),y=Math.min(sy,ev.clientY),w=Math.abs(dx),hh=Math.abs(dy);
        box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=hh+'px';
        const r={x,y,w,h:hh};
        $$('.fe-card,.fe-row',listEl).forEach(c=>{
          const ir=c.getBoundingClientRect();
          if(!(ir.right<r.x||ir.left>r.x+r.w||ir.bottom<r.y||ir.top>r.y+r.h))st.sel.add(c.dataset.name);
        });
        syncSel();
      };
      const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);box.remove();};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);
    });
    listWrap.addEventListener('dblclick',e=>{
      if(e.target===listWrap||e.target.classList.contains('fe-grid')||e.target.classList.contains('fe-rows')||e.target.classList.contains('fe-list')){st.sel.clear();syncSel();}
    });
    listWrap.addEventListener('dragover',e=>{
      if(e.dataTransfer.types.includes('Files')||e.dataTransfer.types.includes('application/x-amber-paths')){
        e.preventDefault();$('.fe-drophint',body).style.display='grid';
      }
    });
    listWrap.addEventListener('dragleave',e=>{if(!listWrap.contains(e.relatedTarget))$('.fe-drophint',body).style.display='none';});
    listWrap.addEventListener('drop',async e=>{
      e.preventDefault();$('.fe-drophint',body).style.display='none';
      const raw=e.dataTransfer.getData('application/x-amber-paths');
      if(raw){
        const paths=JSON.parse(raw);
        try{
          for(const p of paths){
            const d=st.dir;
            if(dirName(p)===d)continue;
            await fs.rename(p,d+'/'+(await fs.uniqueName(d,baseName(p))));
          }
          toast('已移动到当前目录','ok');render();Desktop.render();
        }catch(err){toast(err.message,'err');}
        return;
      }
      if(e.dataTransfer.files&&e.dataTransfer.files.length){
        const prog=progressDlg('正在导入');
        try{
          const n=await importDataTransfer(e.dataTransfer,st.dir,(f,p)=>prog.set('导入 '+f,Math.round(p*100)));
          toast('已导入 '+n+' 个项目','ok');render();Desktop.render();
        }catch(err){toast('导入失败','err');}
        prog.close();
      }
    });
    listWrap.addEventListener('contextmenu',e=>{
      if(e.target.closest('.fe-card,.fe-row'))return;
      e.preventDefault();
      const hasClip=!!Explorer.clip;
      showMenu(e.clientX,e.clientY,[
        {label:'新建文件夹',icon:'folder',fn:async()=>{const n=await promptDlg('新建文件夹','名称','新建文件夹');if(!n)return;await fs.mkdir(st.dir+'/'+(await fs.uniqueName(st.dir,n)));render();}},
        {label:'新建文本文档',icon:'fText',fn:async()=>{const n=await promptDlg('新建文本文档','文件名','新建文档.txt');if(!n)return;await fs.writeFile(st.dir+'/'+(await fs.uniqueName(st.dir,n)),'');render();}},
        {label:'上传文件',icon:'upload',fn:async()=>{const files=await pickFiles({multiple:true});if(!files.length)return;for(const f of files)await fs.writeFile(st.dir+'/'+(await fs.uniqueName(st.dir,f.name)),f);toast('已上传','ok');render();Desktop.render();}},
        'sep',
        {label:'粘贴',icon:'paste',kbd:'Ctrl+V',disabled:!hasClip,fn:()=>Explorer.paste(st.dir).then(render)},
        'sep',
        {label:'刷新',icon:'refresh',fn:render},
        {label:'在终端中打开',icon:'appTerm',fn:()=>openApp('terminal',{cwd:st.dir})},
      ]);
    });
    /* 工具栏 */
    $('.fe-back',body).onclick=()=>{if(st.hi>0){st.hi--;nav(st.hist[st.hi],false);}};
    $('.fe-fwd',body).onclick=()=>{if(st.hi<st.hist.length-1){st.hi++;nav(st.hist[st.hi],false);}};
    $('.fe-up',body).onclick=()=>{if(st.dir!=='/')nav(dirName(st.dir));};
    $('.fe-side-tgl',body).onclick=()=>$('.fe-side',body).classList.toggle('open');
    if(!isMobile())$('.fe-side',body).classList.add('open');
    $('.fe-search',body).addEventListener('input',debounce(e=>{st.search=e.target.value.trim();render();},260));
    $('.fe-view-grid',body).onclick=()=>{st.view='grid';$('.fe-view-grid',body).classList.add('on');$('.fe-view-list',body).classList.remove('on');render();};
    $('.fe-view-list',body).onclick=()=>{st.view='list';$('.fe-view-list',body).classList.add('on');$('.fe-view-grid',body).classList.remove('on');render();};
    $('.fe-upload',body).onclick=async()=>{const files=await pickFiles({multiple:true});if(!files.length)return;for(const f of files)await fs.writeFile(st.dir+'/'+(await fs.uniqueName(st.dir,f.name)),f);toast('已上传 '+files.length+' 个文件','ok');render();Desktop.render();};
    $('.fe-mount',body).onclick=async()=>{
      if(!window.showDirectoryPicker){toast('当前浏览器不支持文件夹挂载','warn');return;}
      try{const dh=await window.showDirectoryPicker({mode:'readwrite'});await Mounts.add(dh);renderSide();nav('/mnt/local/'+dh.name);}catch(e){if(e.name!=='AbortError')toast('挂载失败','err');}
    };
    $('.fe-new',body).onclick=e=>{
      const r=e.currentTarget.getBoundingClientRect();
      showMenu(r.left,r.bottom+4,[
        {label:'文件夹',icon:'folder',fn:async()=>{const n=await promptDlg('新建文件夹','名称','新建文件夹');if(!n)return;await fs.mkdir(st.dir+'/'+(await fs.uniqueName(st.dir,n)));render();}},
        {label:'文本文档 (.txt)',icon:'fText',fn:async()=>{const n=await promptDlg('新建文本文档','文件名','新建文档.txt');if(!n)return;await fs.writeFile(st.dir+'/'+(await fs.uniqueName(st.dir,n)),'');render();}},
        {label:'网页 (.html)',icon:'fCode',fn:async()=>{const n=await promptDlg('新建网页','文件名','index.html');if(!n)return;const p=st.dir+'/'+(await fs.uniqueName(st.dir,n));await fs.writeFile(p,'<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>新页面</title>\n  <style>\n    body{font-family:sans-serif;display:grid;place-items:center;min-height:100vh;background:#12201a;color:#F0A93C}\n  </style>\n</head>\n<body>\n  <h1>你好，琥珀系统</h1>\n</body>\n</html>\n');render();APPS.code.open(p);}},
        {label:'表格 (.csv)',icon:'fTbl',fn:async()=>{const n=await promptDlg('新建表格','文件名','数据.csv');if(!n)return;await fs.writeFile(st.dir+'/'+(await fs.uniqueName(st.dir,n)),'列1,列2,列3\n');render();}},
        {label:'Markdown (.md)',icon:'fText',fn:async()=>{const n=await promptDlg('新建 Markdown','文件名','笔记.md');if(!n)return;await fs.writeFile(st.dir+'/'+(await fs.uniqueName(st.dir,n)),'# 标题\n');render();APPS.code.open(st.dir+'/'+n);}},
      ]);
    };
    /* 键盘 */
    win.el.addEventListener('keydown',e=>{
      if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
      const paths=[...st.sel].map(n=>st.dir2({name:n}));
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&paths.length){Explorer.clip={paths,mode:'copy'};toast('已复制');}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'&&paths.length){Explorer.clip={paths,mode:'cut'};toast('已剪切');}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&Explorer.clip){Explorer.paste(st.dir).then(render);}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();(st.shown||[]).forEach(en=>st.sel.add(en.name));syncSel();}
      if(e.key==='F2'&&paths.length===1)renamePath(paths[0]).then(render);
      if(e.key==='Enter'&&paths.length===1)openPath(paths[0]);
      if(e.key==='Backspace')nav(dirName(st.dir));
      if(e.key==='Delete'&&paths.length){
        confirmDlg('确认删除','删除选中的 '+paths.length+' 项？',{danger:true,okLabel:'删除'}).then(async ok=>{
          if(!ok)return;
          for(const p of paths){try{await fs.rm(p,true);}catch(err){toast(err.message,'err');}}
          st.sel.clear();render();Desktop.render();
        });
      }
    });
    win.refresh=()=>{if(st.dir)render();};
    win.onClose=()=>this.instances.delete(win);
    renderSide();renderCrumb();render();
  },
  unmount(win){this.instances.delete(win);}
};
const Explorer={
  clip:null,
  refreshDir(dir){APPS.files.instances.forEach(w=>{if(w.explorer&&w.explorer.dir===dir)w.refresh();});},
  refreshAll(){APPS.files.instances.forEach(w=>w.refresh&&w.refresh());},
  async paste(targetDir){
    if(!this.clip)return;
    const {paths,mode}=this.clip;
    try{
      for(const p of paths){
        const nn=await fs.uniqueName(targetDir,baseName(p));
        if(mode==='copy')await fs.copy(p,targetDir+'/'+nn);
        else await fs.rename(p,targetDir+'/'+nn);
      }
      if(mode==='cut')this.clip=null;
      toast('已粘贴 '+paths.length+' 项','ok');

    const updPos=()=>{
      const v=ta.value,p=ta.selectionStart;
      const lines=v.slice(0,p).split('\n');
      posEl.textContent='行 '+lines.length+', 列 '+lines[lines.length-1].length+1;
      const sel=Math.abs(ta.selectionEnd-ta.selectionStart);
      lenEl.textContent=(sel?'已选 '+sel+' 字符 · ':'')+v.length+' 字符 · '+v.split('\n').length+' 行';
    };
    const pushUndo=()=>{
      if(ta.value===st.lastSnap)return;
      st.undo.push(st.lastSnap);if(st.undo.length>200)st.undo.shift();
      st.redo=[];st.lastSnap=ta.value;
    };
    const markDirty=()=>{st.dirty=true;setState('未保存');};
    const snapDeb=debounce(pushUndo,500);
    ta.addEventListener('input',()=>{snapDeb();markDirty();updPos();autoSave();});
    ta.addEventListener('keyup',updPos);ta.addEventListener('click',updPos);
    ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ');}
    });
    const doUndo=()=>{pushUndo();const s=st.undo.pop();if(s==null)return;st.redo.push(ta.value);ta.value=s;st.lastSnap=s;markDirty();updPos();};
    const doRedo=()=>{const s=st.redo.pop();if(s==null)return;st.undo.push(ta.value);ta.value=s;st.lastSnap=s;markDirty();updPos();};
    $('.np-undo',body).onclick=doUndo;
    $('.np-redo',body).onclick=doRedo;
    win.el.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();doUndo();}
      else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){e.preventDefault();doRedo();}
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}
    });
    $('.np-fplus',body).onclick=()=>{st.font=clamp(st.font+1,10,32);ta.style.fontSize=st.font+'px';Store.set('npFont',st.font);showFont();};
    $('.np-fminus',body).onclick=()=>{st.font=clamp(st.font-1,10,32);ta.style.fontSize=st.font+'px';Store.set('npFont',st.font);showFont();};

      if(!st.dirty)return;

        try{await fs.writeFile(st.path,ta.value);st.dirty=false;setState('已保存');
          const t=new Date();autoEl.textContent='自动保存 '+t.toTimeString().slice(0,8);
          Explorer.refreshDir(dirName(st.path));if(dirName(st.path)==='/desktop')Desktop.render();
        }catch(e){autoEl.textContent='自动保存失败';}
      }else{
        try{localStorage.setItem('amberos.npdraft.'+win.id,ta.value);autoEl.textContent='草稿已暂存（未命名）';}catch(e){}
      }
    },900);
    const save=async()=>{
      if(!st.path){saveAs();return;}
      pushUndo();
      try{
        await fs.writeFile(st.path,ta.value);
        st.dirty=false;setState('已保存');autoEl.textContent='已保存 '+new Date().toTimeString().slice(0,8);
        Explorer.refreshDir(dirName(st.path));if(dirName(st.path)==='/desktop')Desktop.render();
        toast('已保存 '+baseName(st.path),'ok');
      }catch(e){toast('保存失败：'+e.message,'err');}
    };
    const saveAs=async()=>{
      const n=await promptDlg('另存为','文件名（保存到桌面）','未命名.txt');
      if(!n)return;
      st.path='/desktop/'+(await fs.uniqueName('/desktop',n));
      win.setTitle(baseName(st.path)+' — 记事本');
      await save();
    };
    $('.np-save',body).onclick=save;
    $('.np-saveas',body).onclick=saveAs;
    /* 载入 */
    (async()=>{
      if(st.path){
        try{
          ta.value=await fs.readFile(st.path,'text');
          st.lastSnap=ta.value;
          win.setTitle(baseName(st.path)+' — 记事本');
          setState('已保存');
        }catch(e){toast('打开失败：'+e.message,'err');}
      }else{
        const draft=localStorage.getItem('amberos.npdraft.'+win.id);
        if(draft){ta.value=draft;st.lastSnap=draft;}
        win.setTitle('未命名 — 记事本');
      }
      updPos();
    })();
    win.onClose=()=>{
      if(st.dirty&&!st.path){try{localStorage.setItem('amberos.npdraft.lost.'+Date.now(),ta.value);}catch(e){}}
      localStorage.removeItem('amberos.npdraft.'+win.id);
    };
  }
};

APPS.table={
  name:'表格',icon:'appTbl',w:760,h:520,minW:420,minH:300,type:'table',
  open(path){return WM.open('table',{path});},
  mount(win,opts){
    const st={path:opts.path?pathNorm(opts.path):null,view:'table',raw:'',delim:','};
    const body=win.body;
    body.innerHTML=
      '<div class="toolbar">'+
        '<button class="btn sm tb-save">'+icon('save')+'保存</button>'+
        '<span class="sep"></span>'+
        '<button class="ibtn tb-vt on" title="表格视图">'+ICONS.grid+'</button>'+
        '<button class="ibtn tb-vx" title="文本视图">'+ICONS.fText+'</button>'+
        '<span class="sp"></span><span class="tb-info" style="font-size:11.5px;color:var(--ink3)"></span>'+
      '</div>'+
      '<div class="tbl-wrap"></div>'+
      '<textarea spellcheck="false" style="display:none;flex:1;width:100%;border:none;outline:none;background:var(--panel);color:var(--ink);padding:12px;font-family:var(--f-mono);font-size:13px;user-select:text;resize:none"></textarea>'+
      '<div class="statusbar"><span class="tb-st"></span><span class="sp"></span><b>UTF-8</b></div>';
    const wrap=$('.tbl-wrap',body),ta=$('textarea',body),info=$('.tb-info',body),stb=$('.tb-st',body);
    function parseCSV(text,delim){
      const rows=[];let row=[],cur='',q=false;
      for(let i=0;i<text.length;i++){
        const ch=text[i];
        if(q){
          if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
          else cur+=ch;
        }else if(ch==='"')q=true;
        else if(ch===delim){row.push(cur);cur='';}
        else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
        else if(ch==='\r'){}
        else cur+=ch;
      }
      if(cur!==''||row.length){row.push(cur);rows.push(row);}
      return rows.filter(r=>!(r.length===1&&r[0]===''));
    }
    function detect(text){
      const first=text.slice(0,text.indexOf('\n')<0?text.length:text.indexOf('\n'));
      const c=(first.match(/,/g)||[]).length,t=(first.match(/\t/g)||[]).length,s=(first.match(/;/g)||[]).length;
      return t>=c&&t>=s?'\t':(s>c?';':',');
    }
    function renderTable(){
      const rows=parseCSV(ta.value,st.delim);
      if(!rows.length){wrap.innerHTML='<div class="fe-empty" style="position:static;display:grid;padding:40px">无数据</div>';return;}
      let html='<table><thead><tr>';
      rows[0].forEach((c,i)=>html+='<th>'+(esc(c)||'&nbsp;')+'</th>');
      html+='</tr></thead><tbody>';
      for(let i=1;i<rows.length;i++){
        html+='<tr>';rows[i].forEach(c=>html+='<td title="'+esc(c)+'">'+(esc(c)||'&nbsp;')+'</td>');html+='</tr>';
      }
      html+='</tbody></table>';
      wrap.innerHTML=html;
      info.textContent=rows.length+' 行 × '+rows[0].length+' 列 · 分隔符 '+(st.delim==='\t'?'TAB':st.delim);
    }
    const updSt=()=>stb.textContent=ta.value.length+' 字符 · '+ta.value.split('\n').length+' 行';
    ta.addEventListener('input',()=>{updSt();if(st.view==='table')renderTable();});
    const setView=v=>{
      st.view=v;
      $('.tb-vt',body).classList.toggle('on',v==='table');
      $('.tb-vx',body).classList.toggle('on',v==='text');
      if(v==='table'){ta.style.display='none';wrap.style.display='block';renderTable();}
      else{ta.style.display='block';wrap.style.display='none';}
    };
    $('.tb-vt',body).onclick=()=>setView('table');
    $('.tb-vx',body).onclick=()=>setView('text');
    $('.tb-save',body).onclick=async()=>{
      if(!st.path){const n=await promptDlg('另存为','文件名','数据.csv');if(!n)return;st.path='/desktop/'+(await fs.uniqueName('/desktop',n));win.setTitle(baseName(st.path)+' — 表格');}
      await fs.writeFile(st.path,ta.value);
      toast('已保存 '+baseName(st.path),'ok');
      Explorer.refreshDir(dirName(st.path));Desktop.render();
    };
    win.el.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('.tb-save',body).click();}});
    (async()=>{
      if(st.path){
        try{
          ta.value=await fs.readFile(st.path,'text');
          st.delim=extOf(st.path)==='tsv'?'\t':detect(ta.value);
          win.setTitle(baseName(st.path)+' — 表格');
        }catch(e){toast('打开失败','err');}
      }
      updSt();setView('table');
    })();
  }
};

      }
    };
    const autoRun=debounce(()=>{if(Store.get('editorAutoRun'))runPreview();},700);
    const togglePrev=force=>{
      st.prevVisible=force!==undefined?force:!st.prevVisible;
      prevPane.style.display=st.prevVisible?'flex':'none';
      splitEl.style.display=st.prevVisible?'':'none';
      codePane.style.flex=st.prevVisible?'0 0 55%':'1 1 auto';
      $('.ce-toggleprev',body).classList.toggle('on',st.prevVisible);
      if(st.prevVisible)runPreview();
      if(st.cm)setTimeout(()=>st.cm.refresh(),60);
    };
    $('.ce-toggleprev',body).onclick=()=>togglePrev();
    $('.ce-run',body).onclick=runPreview;
    $('.ce-refprev',body).onclick=runPreview;
    /* --- 状态栏 --- */
    const updStatus=()=>{
      if(!st.cm)return;
      const c=st.cm.getCursor();
      $('.ce-pos',body).textContent='行 '+(c.line+1)+', 列 '+(c.ch+1);
      const sel=st.cm.getSelection();
      $('.ce-sel',body).textContent=sel?('已选 '+sel.length+' 字符'):'';
      $('.ce-lines',body).textContent=st.cm.lineCount()+' 行 · '+st.cm.getValue().length+' 字符';
      $('.ce-lang',body).textContent=MODE_LABEL[st.mode]||st.mode;
    };
    /* --- 编辑器初始化 --- */
    if(ok&&window.CodeMirror){
      st.cm=CodeMirror.fromTextArea(ta,{
        mode:st.mode,lineNumbers:true,lineWrapping:true,
        styleActiveLine:true,showTrailingSpace:true,
        matchBrackets:true,autoCloseBrackets:true,
        matchTags:{bothTags:true},autoCloseTags:true,
        foldGutter:true,gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
        theme:'material-darker',tabSize:2,indentUnit:2,indentWithTabs:false,
        extraKeys:{
          'Ctrl-S':()=>save(),'Cmd-S':()=>save(),
          'Ctrl-Enter':()=>runPreview(),'Cmd-Enter':()=>runPreview(),
          'Ctrl-Shift-F':()=>format(),'Cmd-Shift-F':()=>format(),
          'Ctrl-F':()=>openFind(false),'Cmd-F':()=>openFind(false),
          'Ctrl-H':()=>openFind(true),'Cmd-Alt-F':()=>openFind(true),
          'F3':()=>nextMatch(1),
        }
      });
      st.cm.on('change',()=>{updStatus();autoRun();});
      st.cm.on('cursorActivity',updStatus);
    }else{
      ta.style.cssText='flex:1;width:100%;background:#212121;color:#e6e6e6;border:none;outline:none;padding:12px;font-family:var(--f-mono);font-size:13.5px;resize:none;user-select:text';
      ta.addEventListener('input',()=>{updStatus();autoRun();});
      toast('CodeMirror 加载失败，已降级为纯文本编辑','warn',6000);
    }
    const getVal=()=>st.cm?st.cm.getValue():ta.value;
    const setVal=v=>{if(st.cm)st.cm.setValue(v);else ta.value=v;};
    /* --- 查找替换 --- */
    const findEl=$('.ce-find',body);
    const caseB=$('.ce-case',body),wordB=$('.ce-word',body),regexB=$('.ce-regex',body);
    [caseB,wordB,regexB].forEach(b=>b.onclick=()=>{b.classList.toggle('on');doFind();});
    const openFind=focusRep=>{findEl.classList.add('open');doFind();(focusRep?$('.ce-r',body):$('.ce-q',body)).focus();};
    const closeFind=()=>{findEl.classList.remove('open');clearMarks();if(st.cm)st.cm.focus();};
    $('.ce-findbtn',body).onclick=()=>openFind(false);
    $('.ce-closefind',body).onclick=closeFind;
    const clearMarks=()=>{st.marks.forEach(m=>{try{m.clear();}catch(e){}});st.marks=[];};
    function doFind(){
      clearMarks();st.matches=[];st.cur=-1;
      const cnt=$('.ce-cnt',body);
      const q=$('.ce-q',body).value;
      if(!q||!st.cm){cnt.textContent='0/0';cnt.classList.remove('bad');return;}
      let re;
      try{
        let src=regexB.classList.contains('on')?q:q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        if(wordB.classList.contains('on'))src='\\b'+src+'\\b';
        re=new RegExp(src,caseB.classList.contains('on')?'g':'gi');
      }catch(e){cnt.textContent='无效正则';cnt.classList.add('bad');return;}
      cnt.classList.remove('bad');
      const text=getVal();
      let m,safety=0;
      while((m=re.exec(text))&&safety++<20000){
        st.matches.push({from:st.cm.posFromIndex(m.index),to:st.cm.posFromIndex(m.index+m[0].length)});
        if(m.index===re.lastIndex)re.lastIndex++;
      }
      st.marks=st.matches.map(r=>st.cm.markText(r.from,r.to,{className:'ce-hit'}));
      cnt.textContent=st.matches.length?('1/'+st.matches.length):'0/0';
      if(st.matches.length)gotoMatch(0,false);
    }
    function gotoMatch(i,scroll=true){
      if(!st.matches.length)return;
      st.cur=(i+st.matches.length)%st.matches.length;
      st.marks.forEach((m,idx)=>{try{m.clear();}catch(e){}});
      st.marks=st.matches.map((r,idx)=>st.cm.markText(r.from,r.to,{className:idx===st.cur?'ce-hit-cur':'ce-hit'}));
      if(scroll)st.cm.scrollIntoView({from:st.matches[st.cur].from,to:st.matches[st.cur].to},60);
      $('.ce-cnt',body).textContent=(st.cur+1)+'/'+st.matches.length;
    }
    const nextMatch=d=>{if(!st.matches.length)doFind();if(st.matches.length)gotoMatch(st.cur+d);};
    $('.ce-nextm',body).onclick=()=>nextMatch(1);
    $('.ce-prevm',body).onclick=()=>nextMatch(-1);
    $('.ce-q',body).addEventListener('input',debounce(doFind,200));
    $('.ce-q',body).addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();nextMatch(e.shiftKey?-1:1);}
      if(e.key==='Escape')closeFind();
    });
    $('.ce-r',body).addEventListener('keydown',e=>{if(e.key==='Escape')closeFind();if(e.key==='Enter'){e.preventDefault();replaceOne();}});
    const replaceOne=()=>{
      if(st.cur<0||!st.matches.length)return;
      const r=st.matches[st.cur];
      st.cm.replaceRange($('.ce-r',body).value,r.from,r.to);
      doFind();if(st.matches.length)gotoMatch(Math.min(st.cur,st.matches.length-1));
    };
    $('.ce-rep1',body).onclick=replaceOne;
    $('.ce-repall',body).onclick=()=>{
      if(!st.matches.length){doFind();}
      const rv=$('.ce-r',body).value;
      for(let i=st.matches.length-1;i>=0;i--){
        const r=st.matches[i];
        st.cm.replaceRange(rv,r.from,r.to);
      }
      toast('已替换 '+st.matches.length+' 处','ok');
      doFind();
    };
    /* --- 工具栏动作 --- */
    $('.ce-undo',body).onclick=()=>st.cm?st.cm.undo():document.execCommand('undo');
    $('.ce-redo',body).onclick=()=>st.cm?st.cm.redo():document.execCommand('redo');
    $('.ce-fold',body).onclick=()=>{if(!st.cm||!st.cm.foldCode)return;for(let l=0;l<st.cm.lineCount();l++){try{st.cm.foldCode(l,null,'fold');}catch(e){}}};
    $('.ce-unfold',body).onclick=()=>{if(!st.cm||!st.cm.foldCode)return;for(let l=0;l<st.cm.lineCount();l++){try{st.cm.foldCode(l,null,'unfold');}catch(e){}}};
    const format=async()=>{
      const okb=await CodeCore.ensureBeautify();
      if(!okb||!window.js_beautify){toast('格式化工具加载失败（网络不可用）','warn');return;}
      const opts={indent_size:2,end_with_newline:true,max_preserve_newlines:2,preserve_newlines:true};
      let v=getVal(),out=v;
      const idx=st.cm?st.cm.indexFromPos(st.cm.getCursor()):ta.selectionStart;
      try{
        if(st.mode==='htmlmixed')out=html_beautify(v,Object.assign({indent_inner_html:true,wrap_line_length:120},opts));
        else if(st.mode==='css')out=css_beautify(v,opts);
        else if(st.mode==='javascript'||st.mode==='application/json')out=js_beautify(v,opts);
        else{toast('当前语言暂不支持格式化','warn');return;}
      }catch(e){toast('格式化失败：'+e.message,'err');return;}
      setVal(out);
      if(st.cm){try{st.cm.setCursor(st.cm.posFromIndex(Math.min(idx,out.length)));}catch(e){}}
      toast('已格式化','ok');
      runPreview();
    };
    $('.ce-fmt',body).onclick=format;
    const setMode=m=>{
      st.mode=m;
      if(st.cm)st.cm.setOption('mode',m);
      updStatus();updateBrBtn();
      if(m==='htmlmixed'&&prevPane.style.display==='none')togglePrev(true);
      runPreview();
    };
    modeSel.onchange=e=>setMode(e.target.value);
    const save=async()=>{
      let path=st.path;
      if(!path){
        const n=await promptDlg('保存到文件系统','文件名（保存到桌面）','未命名'+(EXT_BY_MODE[st.mode]||'.html'));
        if(!n)return;
        path='/desktop/'+(await fs.uniqueName('/desktop',n));
        st.path=path;st.dir='/desktop';
        win.setTitle(baseName(path)+' — HTML编辑器');
      }
      try{
        await fs.writeFile(path,getVal());
        toast('已保存 '+baseName(path),'ok');
        Desktop.render();
        Explorer.refreshDir(st.dir);
      }catch(e){toast('保存失败：'+e.message,'err');}
    };
    $('.ce-save',body).onclick=save;
    $('.ce-import',body).onclick=async()=>{
      const files=await pickFiles({accept:'.html,.htm,.css,.js,.mjs,.json,.md,.xml,.svg,.txt'});
      if(!files.length)return;
      const f=files[0];
      setVal(await f.text());
      const ext=extOf(f.name);
      if(MODE_BY_EXT[ext]){st.mode=MODE_BY_EXT[ext];modeSel.value=st.mode;if(st.cm)st.cm.setOption('mode',st.mode);updateBrBtn();updStatus();}
      runPreview();toast('已导入 '+f.name,'ok');
    };
    $('.ce-export',body).onclick=()=>{
      const ext=EXT_BY_MODE[st.mode]||'.txt';
      downloadBlob(new Blob([getVal()],{type:'text/plain;charset=utf-8'}),'代码'+ext);
    };
    $('.ce-clear',body).onclick=async()=>{
      if(await confirmDlg('清空内容','确定要清空编辑器全部内容吗？',{danger:true,okLabel:'清空'})){setVal('');runPreview();}
    };
    $('.ce-extwin',body).onclick=()=>{
      const blob=new Blob([buildDoc()],{type:'text/html'});
      window.open(URL.createObjectURL(blob),'_blank');
    };
    $('.ce-openbr',body).onclick=async()=>{
      const blob=new Blob([getVal()],{type:'text/html'});
      APPS.browser.openURL(URL.createObjectURL(blob));
    };
    /* --- 可拖拽分割条 --- */
    splitEl.addEventListener('pointerdown',e=>{
      e.preventDefault();
      splitEl.classList.add('on');splitEl.setPointerCapture(e.pointerId);
      const ceEl=$('.ce',body);
      const vertical=isMobile();
      const mv=ev=>{
        const r=ceEl.getBoundingClientRect();
        if(vertical){
          const y=clamp(ev.clientY-r.top,140,r.height-100);
          codePane.style.flex='0 0 '+y+'px';
        }else{
          const x=clamp(ev.clientX-r.left,200,r.width-126);
          codePane.style.flex='0 0 '+(x/r.width*100)+'%';
        }
      };
      const up=()=>{splitEl.classList.remove('on');splitEl.removeEventListener('pointermove',mv);splitEl.removeEventListener('pointerup',up);if(st.cm)st.cm.refresh();};
      splitEl.addEventListener('pointermove',mv);
      splitEl.addEventListener('pointerup',up);
    });
    win.onResize=debounce(()=>{st.cm&&st.cm.refresh();},120);
    /* --- 载入内容 --- */
    if(st.path){
      try{setVal(await fs.readFile(st.path,'text'));}catch(e){toast('读取失败：'+e.message,'err');}
    }else{
      setVal('<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>琥珀 · 新页面</title>\n  <style>\n    body{\n      margin:0;min-height:100vh;display:grid;place-items:center;\n      background:#101a15;color:#F0A93C;font-family:sans-serif;\n    }\n    h1{font-size:42px;letter-spacing:6px}\n    p{color:#8fa89a}\n  </style>\n</head>\n<body>\n  <main style="text-align:center">\n    <h1>琥珀系统</h1>\n    <p>在右侧实时预览中编辑你的页面</p>\n  </main>\n</body>\n</html>\n');
    }
    updStatus();
    togglePrev(st.prevVisible);
    runPreview();
    if(st.cm)setTimeout(()=>st.cm.refresh(),80);
  },
  unmount(win){
    // 释放 CodeMirror 实例，避免内存泄漏
    try{const body=win.body;const ta=$('.ce-ta',body);if(ta&&ta._cmInst)ta._cmInst.toTextArea();}catch(e){}
    try{
      const cmEl=$('.CodeMirror',win.body);
      if(cmEl&&cmEl.CodeMirror)cmEl.CodeMirror.toTextArea();
    }catch(e){}
  }
};

APPS.image={
  name:'图片查看器',icon:'appImg',w:820,h:600,minW:380,minH:300,type:'image',
  open(path){return WM.open('image',{path});},
  async mount(win,opts){
    const st={zoom:1,list:[],idx:0};
    const body=win.body;
    body.innerHTML=
      '<div class="toolbar">'+
        '<button class="ibtn iv-zout" title="缩小">'+ICONS.zoomOut+'</button>'+
        '<span class="iv-zpct" style="font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);min-width:46px;text-align:center">100%</span>'+
        '<button class="ibtn iv-zin" title="放大">'+ICONS.zoomIn+'</button>'+
        '<button class="ibtn iv-fit on" title="适应窗口">'+ICONS.fit+'</button>'+
        '<span class="sep"></span>'+
        '<button class="ibtn iv-dl" title="下载">'+ICONS.download+'</button>'+
        '<button class="ibtn iv-wall" title="设为壁纸">'+ICONS.wall+'</button>'+
        '<span class="sp"></span>'+
        '<span class="iv-count" style="font-family:var(--f-mono);font-size:11.5px;color:var(--ink3)"></span>'+
        '<button class="ibtn iv-fs" title="全屏沉浸阅读">'+ICONS.full+'</button>'+
      '</div>'+
      '<div class="manga"><div class="manga-load">正在加载…</div></div>'+
      '<button class="manga-x" title="退出全屏">'+ICONS.close+'</button>';
    const strip=$('.manga',body);
    const loadEl=$('.manga-load',strip);
    const dir=dirName(opts.path);
    const target=baseName(opts.path);
    let entries;
    try{entries=await fs.readdir(dir);}catch(e){loadEl.textContent='目录读取失败：'+e.message;return;}
    const imgs=entries.filter(e=>!e.isDirectory&&IMG_EXT.includes(extOf(e.name)))
      .sort((a,b)=>naturalCmp(a.name,b.name));
    st.list=imgs;
    win.setTitle(target+' — 图片查看器（'+imgs.length+' 张）');
    $('.iv-count',body).textContent=imgs.length+' 张 · 同目录条漫';
    if(!imgs.length){loadEl.textContent='此目录没有图片文件';return;}
    /* 并行读取，按序插入 */
    const blobs=await Promise.all(imgs.map(en=>
      fs.readFile((dir==='/'?'':dir)+'/'+en.name,'blob')
        .then(b=>({en,b,ok:true}))
        .catch(e=>({en,ok:false}))
    ));
    loadEl.remove();
    let loaded=0;
    const imgEls=[];
    for(const item of blobs){
      if(!item.ok){console.warn('跳过读取失败的图片:',item.en.name);continue;}
      const img=document.createElement('img');
      img.src=URL.createObjectURL(item.b);
      img.alt=item.en.name;
      img.dataset.name=item.en.name;
      img.draggable=false;
      img.onload=()=>{loaded++;if(item.en.name===target)img.scrollIntoView({block:'start'});};
      strip.appendChild(img);
      imgEls.push(img);
    }
    st.imgEls=imgEls;
    /* 定位到用户点击的图片 */
    requestAnimationFrame(()=>{
      const el=imgEls.find(i=>i.dataset.name===target);
      if(el)el.scrollIntoView({block:'start'});
    });
    /* 缩放 */
    const applyZoom=()=>{
      imgEls.forEach(i=>{i.style.maxWidth=st.fit?'1000px':(1000*st.zoom)+'px';i.style.width=st.fit?'100%':(100*st.zoom)+'%';});
      $('.iv-zpct',body).textContent=st.fit?'适应':Math.round(st.zoom*100)+'%';
    };
    st.fit=true;
    $('.iv-zin',body).onclick=()=>{st.fit=false;st.zoom=clamp(st.zoom*1.25,.1,8);applyZoom();};
    $('.iv-zout',body).onclick=()=>{st.fit=false;st.zoom=clamp(st.zoom/1.25,.1,8);applyZoom();};
    $('.iv-fit',body).onclick=()=>{st.fit=true;applyZoom();};
    strip.addEventListener('wheel',e=>{
      if(!e.ctrlKey)return;
      e.preventDefault();
      st.fit=false;
      st.zoom=clamp(st.zoom*(e.deltaY<0?1.12:1/1.12),.1,8);
      applyZoom();
    },{passive:false});
    /* 下载 / 壁纸 */
    $('.iv-dl',body).onclick=async()=>{const it=await preloadPath((dir==='/'?'':dir)+'/'+target);if(it)downloadBlob(it.blob,target);};
    $('.iv-wall',body).onclick=()=>{Store.set('wallCustom',(dir==='/'?'':dir)+'/'+target);Store.set('wallpaper','custom');Wallpaper.apply();toast('已设为壁纸','ok');};
    /* 全屏沉浸 */
    const fsBtn=$('.iv-fs',body),xBtn=$('.manga-x',body);
    const goFS=async()=>{
      try{await win.el.requestFullscreen();}catch(e){document.documentElement.requestFullscreen().catch(()=>{});}
      win.el.classList.add('fscreen');
      win.fscreen=true;
    };
    const exitFS=()=>{
      if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
      win.el.classList.remove('fscreen');
      win.fscreen=false;
    };
    fsBtn.onclick=goFS;
    xBtn.onclick=exitFS;
    st._fsh=()=>{if(!document.fullscreenElement){win.el.classList.remove('fscreen');win.fscreen=false;}};
    document.addEventListener('fullscreenchange',st._fsh);
    applyZoom();
    win.onClose=()=>{document.removeEventListener('fullscreenchange',st._fsh);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});};
  }
};

        'a:hover{transform:translateY(-4px);border-color:'+(d?'#F0A93C':'#C07E15')+'}'+
        '.d{width:34px;height:34px;border-radius:9px;background:'+(d?'#F0A93C':'#C07E15')+';color:'+(d?'#221604':'#FFF6E4')+';display:grid;place-items:center;font-weight:bold;font-size:16px}'+
        '</style></head><body><h1>琥 珀</h1><p>内置浏览器 · 支持网址与 vfs:/系统文件</p>'+
        '<div class="tiles">'+
        '<a href="https://www.openstreetmap.org/export/embed.html?bbox=116.2%2C39.8%2C116.6%2C40.1&layer=mapnik" target="_self"><span class="d">M</span>开放街道地图</a>'+
        '<a href="https://zh.m.wikipedia.org" target="_self"><span class="d">W</span>维基百科</a>'+
        '<a href="https://example.com" target="_self"><span class="d">E</span>Example</a>'+
        '</div></body></html>';
    };
    const nav=(url,push=true)=>{
      url=url.trim();
      if(!url||url===BR_HOME){url=BR_HOME;}
      if(push){st.hist=st.hist.slice(0,st.hi+1);st.hist.push(url);st.hi=st.hist.length-1;}
      if(url===BR_HOME){
        urlIn.value='';
        frame.srcdoc=homeHTML();
        win.setTitle('新标签页 — 浏览器');
        return;
      }
      let target=url;
      if(url.startsWith('vfs:')){
        const p=pathNorm(url.slice(4));
        fs.readFile(p,'blob').then(b=>{
          frame.src=URL.createObjectURL(new Blob([b],{type:mimeOf(extOf(p))||'text/html'}));
          win.setTitle(baseName(p)+' — 浏览器');
        }).catch(e=>toast('无法打开 '+p+'：'+e.message,'err'));
        urlIn.value='vfs:'+p;
        return;
      }
      if(!/^https?:\/\//i.test(target)&&!target.startsWith('blob:')){
        if(/^[^\/\s]+\.[^\/\s]+/.test(target))target='https://'+target;
        else if(fs&&target.startsWith('/')){target='vfs:'+target;urlIn.value=target;nav(target,false);return;}
        else target='https://www.bing.com/search?q='+encodeURIComponent(target);
      }
      urlIn.value=target.startsWith('blob:')?'blob（本地预览）':target;
      frame.src=target;
      win.setTitle(new URL(target.startsWith('blob:')?'https://local':target).hostname+' — 浏览器');
      const note=$('.br-note',body);
      note.style.display='block';
      let loaded=false;
      frame.onload=()=>{loaded=true;note.style.display='none';};
      setTimeout(()=>{if(!loaded)note.style.display='block';},5000);
    };
    const go=()=>nav(urlIn.value);
    $('.br-go',body).onclick=go;
    urlIn.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    $('.br-back',body).onclick=()=>{if(st.hi>0){st.hi--;nav(st.hist[st.hi],false);}};
    $('.br-fwd',body).onclick=()=>{if(st.hi<st.hist.length-1){st.hi++;nav(st.hist[st.hi],false);}};
    $('.br-reload',body).onclick=()=>nav(st.hist[st.hi],false);
    if(opts.vfs)nav('vfs:'+opts.vfs);
    else if(opts.url)nav(opts.url);
    else nav(BR_HOME);
  }
};

APPS.calc={
  name:'计算器',icon:'appCalc',w:340,h:520,minW:280,minH:420,type:'calc',
  launch(){return WM.open('calc',{});},
  mount(win){
    const st={expr:'',cur:'0',last:null,hist:[]};
    const body=win.body;
    body.innerHTML=
      '<div class="calc">'+
        '<div class="calc-hist"></div>'+
        '<div class="calc-disp"><div class="calc-expr"></div><div class="calc-val">0</div></div>'+
        '<div class="calc-grid"></div>'+
      '</div>';
    const exprEl=$('.calc-expr',body),valEl=$('.calc-val',body),grid=$('.calc-grid',body),histEl=$('.calc-hist',body);
    const KEYS=[['C','fn'],['±','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['0',''],['. ',''],['⌫','fn'],['=','eq']];
    KEYS.forEach(([k,cls])=>{
      const b=h('button','ck '+cls,esc(k));
      b.onclick=()=>press(k.trim());
      grid.appendChild(b);
    });
    const fmt=n=>{if(!isFinite(n))return '错误';const s=parseFloat(n.toPrecision(12));return String(s);};
    const upd=()=>{exprEl.textContent=st.expr;valEl.textContent=st.cur;};
    const calc=(a,op,b)=>{a=parseFloat(a);b=parseFloat(b);switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b;}return b;};
    function press(k){
      if(/^[0-9]$/.test(k)){st.cur=st.cur==='0'?k:st.cur+k;}
      else if(k==='.'){if(!st.cur.includes('.'))st.cur+='.';}
      else if(k==='C'){st.expr='';st.cur='0';}
      else if(k==='⌫'){st.cur=st.cur.length>1?st.cur.slice(0,-1):'0';}
      else if(k==='±'){st.cur=st.cur.startsWith('-')?st.cur.slice(1):(st.cur!=='0'?'-'+st.cur:st.cur);}
      else if(k==='%'){st.cur=fmt(parseFloat(st.cur)/100);}
      else if(['+','−','×','÷'].includes(k)){
        if(st.expr&&!st.last){st.cur=fmt(calc(st.expr.split(' ')[0],st.expr.split(' ')[1],st.cur));}
        st.expr=st.cur+' '+k;st.last=null;st.cur='0';st.waitOp=true;
        st.expr=st.expr;upd();return;
      }
      else if(k==='='){
        if(st.expr){
          const [a,op]=st.expr.split(' ');
          const r=calc(a,op,st.cur);
          st.hist.unshift(st.expr+' '+st.cur+' = '+fmt(r));
          st.hist=st.hist.slice(0,20);
          histEl.innerHTML=st.hist.map(x=>'<div>'+esc(x)+'</div>').join('');
          histEl.classList.add('open');
          st.expr=st.expr+' '+st.cur+' =';
          st.cur=fmt(r);
          st.last=r;
          upd();setTimeout(()=>{st.expr='';upd();},1400);
          return;
        }
      }
      upd();
    }
    upd();
    win._key=e=>{
      if(win!==WM.wins.get(WM.activeId))return;
      if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
      const map={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','.':'.','%':'%'};
      let k=null;
      if(/^[0-9]$/.test(e.key))k=e.key;
      else if(map[e.key])k=map[e.key];
      if(k){e.preventDefault();press(k);}
    };
    document.addEventListener('keydown',win._key);
    win.onClose=()=>document.removeEventListener('keydown',win._key);
  }
};

APPS.paint={

  mount(win){
    const st={tool:'brush',color:'#F0A93C',size:5,undo:[],drawing:false,shape:null};
    const body=win.body;
    const colors=['#1F2920','#F0A93C','#DE6655','#63B983','#4E7F9E','#906F9E','#E9E4D4','#7A5C3E'];
    body.innerHTML=
      '<div class="toolbar">'+

        '<button class="ibtn pt-eraser" title="橡皮">'+ICONS.eraser+'</button>'+
        '<button class="ibtn pt-line" title="直线">'+ICONS.line+'</button>'+
        '<button class="ibtn pt-rect" title="矩形">'+ICONS.rect+'</button>'+
        '<button class="ibtn pt-ell" title="椭圆">'+ICONS.ellipse+'</button>'+
        '<span class="sep"></span>'+
        '<input type="color" class="pt-color" value="#F0A93C" style="width:30px;height:26px;border:none;background:none;cursor:pointer">'+
        '<span class="pt-sw" style="display:flex;gap:5px"></span>'+

        '<input type="range" class="pt-size" min="1" max="40" value="5" style="width:90px;accent-color:var(--accent)">'+
        '<span class="pt-szv" style="font-family:var(--f-mono);font-size:11px;color:var(--ink3);min-width:26px"></span>'+
        '<span class="sp"></span>'+
        '<button class="ibtn pt-undo" title="撤销">'+ICONS.undo+'</button>'+
        '<button class="ibtn pt-clear" title="清空">'+ICONS.clear+'</button>'+
        '<button class="btn sm pt-save">'+icon('save')+'保存</button>'+
        '<button class="ibtn pt-dl" title="下载 PNG">'+ICONS.download+'</button>'+
      '</div>'+
      '<div class="paint"><div class="paint-cv"><canvas width="1100" height="700"></canvas></div></div>';
    const cv=$('canvas',body),ctx=cv.getContext('2d');
    const ov=document.createElement('canvas');ov.width=cv.width;ov.height=cv.height;
    const octx=ov.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    const szv=$('.pt-szv',body);
    const showSz=()=>szv.textContent=st.size+'px';showSz();
    $('.pt-size',body).oninput=e=>{st.size=+e.target.value;showSz();};
    $('.pt-color',body).oninput=e=>st.color=e.target.value;
    const swBox=$('.pt-sw',body);
    colors.forEach(c=>{
      const s=h('button','swatch'+(c===st.color?' on':''));s.style.background=c;
      s.onclick=()=>{st.color=c;$('.pt-color',body).value=c;$$('.swatch',swBox).forEach(x=>x.classList.remove('on'));s.classList.add('on');};
      swBox.appendChild(s);
    });
    const tools=[['brush','.pt-brush'],['eraser','.pt-eraser'],['line','.pt-line'],['rect','.pt-rect'],['ellipse','.pt-ell']];
    tools.forEach(([t,sel2])=>{
      $(sel2,body).onclick=()=>{st.tool=t;tools.forEach(([,s2])=>$(s2,body).classList.toggle('on',s2===sel2));};
    });
    const snapshot=()=>{st.undo.push(ctx.getImageData(0,0,cv.width,cv.height));if(st.undo.length>25)st.undo.shift();};
    const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};};
    cv.addEventListener('pointerdown',e=>{
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      snapshot();
      st.drawing=true;
      const p=pos(e);
      st.start=p;
      if(st.tool==='brush'||st.tool==='eraser'){
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineCap='round';ctx.lineJoin='round';
        ctx.lineWidth=st.size;
        if(st.tool==='eraser'){ctx.strokeStyle='#fff';}
        else ctx.strokeStyle=st.color;
        ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();
      }
    });
    cv.addEventListener('pointermove',e=>{
      if(!st.drawing)return;
      const p=pos(e);
      if(st.tool==='brush'||st.tool==='eraser'){
        ctx.lineTo(p.x,p.y);ctx.stroke();
      }else{
        octx.clearRect(0,0,ov.width,ov.height);
        octx.strokeStyle=st.color;octx.lineWidth=st.size;octx.lineCap='round';
        octx.beginPath();
        if(st.tool==='line'){octx.moveTo(st.start.x,st.start.y);octx.lineTo(p.x,p.y);}
        else if(st.tool==='rect'){octx.rect(Math.min(st.start.x,p.x),Math.min(st.start.y,p.y),Math.abs(p.x-st.start.x),Math.abs(p.y-st.start.y));}
        else if(st.tool==='ellipse'){octx.ellipse((st.start.x+p.x)/2,(st.start.y+p.y)/2,Math.abs(p.x-st.start.x)/2,Math.abs(p.y-st.start.y)/2,0,0,Math.PI*2);}
        octx.stroke();
        ctx.drawImage(ov,0,0);
        octx.clearRect(0,0,ov.width,ov.height);
      }
    });
    cv.addEventListener('pointerup',()=>{st.drawing=false;});
    $('.pt-undo',body).onclick=()=>{const s=st.undo.pop();if(s)ctx.putImageData(s,0,0);};
    $('.pt-clear',body).onclick=()=>{snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);};
    const pngBlob=()=>new Promise(r=>cv.toBlob(r,'image/png'));
    $('.pt-save',body).onclick=async()=>{
      const n=await promptDlg('保存到图片文件夹','文件名','画板-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'')+'.png');
      if(!n)return;
      await fs.writeFile('/pictures/'+(await fs.uniqueName('/pictures',n)),await pngBlob());
      toast('已保存到 /pictures/'+n,'ok');Desktop.render();
    };
    $('.pt-dl',body).onclick=async()=>downloadBlob(await pngBlob(),'画板.png');
  }
};

APPS.terminal={
  name:'终端',icon:'appTerm',w:680,h:440,minW:380,minH:240,type:'terminal',
  launch(opts){return WM.open('terminal',opts||{});},
  mount(win,opts){
    let cwd=pathNorm(opts.cwd||'/desktop');
    const body=win.body;
    body.innerHTML='<div class="term"></div>';
    const term=$('.term',body);
    const promptHTML=()=>'<span class="tp">amber@os</span> <span style="color:#7fa58c">'+esc(cwd)+'</span> › ';
    const inputLine=h('div','term-line');
    term.appendChild(inputLine);
    let inp=null;
    const scrollB=()=>term.scrollTop=term.scrollHeight;
    const print=(html,cls)=>{const d=h('div',cls||'');d.innerHTML=html;term.insertBefore(d,inputLine);scrollB();};
    const newPrompt=()=>{
      inputLine.innerHTML=promptHTML()+'<input class="term-in" spellcheck="false" autocapitalize="off">';
      inp=$('.term-in',inputLine);
      inp.addEventListener('keydown',onKey);
      setTimeout(()=>inp.focus(),40);
    };
    term.addEventListener('click',()=>{if(inp)inp.focus();});
    const hist=[];let hi2=0;
    const CMDS={
      help:()=>print('可用命令：<span class="tok">ls cd pwd cat mkdir touch rm mv cp echo clear tree open sysinfo mount</span>'),
      pwd:()=>print(esc(cwd)),
      ls:async a=>{
        const p=resolve(a[0]);
        const list=await fs.readdir(p);
        if(!list.length)print('<span style="color:#6F8173">（空目录）</span>');
        else print(list.map(e=>e.isDirectory?'<span style="color:#F0A93C">'+esc(e.name)+'/</span>':esc(e.name)).join('  '));
      },
      cd:a=>{cwd=a[0]?pathNorm(cwd+'/'+a[0]):'/';newPrompt();},
      cat:async a=>{if(!a[0])return print('用法: cat &lt;文件&gt;','terr');print('<pre style="white-space:pre-wrap;color:#CFE3D2">'+esc(await fs.readFile(resolve(a[0]),'text'))+'</pre>');},
      mkdir:async a=>{if(!a[0])return print('用法: mkdir &lt;名称&gt;','terr');await fs.mkdir(resolve(a[0]));},
      touch:async a=>{if(!a[0])return print('用法: touch &lt;文件&gt;','terr');if(!(await fs.exists(resolve(a[0]))))await fs.writeFile(resolve(a[0]),'');},
      rm:async a=>{if(!a[0])return print('用法: rm &lt;路径&gt;','terr');await fs.rm(resolve(a[0]),true);Desktop.render();},
      mv:async a=>{if(a.length<2)return print('用法: mv &lt;源&gt; &lt;目标&gt;','terr');await fs.rename(resolve(a[0]),resolve(a[1]));Desktop.render();},
      cp:async a=>{if(a.length<2)return print('用法: cp &lt;源&gt; &lt;目标&gt;','terr');await fs.copy(resolve(a[0]),resolve(a[1]));},
      echo:a=>print(esc(a.join(' '))),
      clear:()=>{$$('.term div:not(.term-line)',term).forEach(d=>d.remove());},
      tree:async()=>{
        const all=await fs.walk(cwd,400);
        print(all.map(e=>(e.isDirectory?'<span style="color:#F0A93C">'+esc(e.name)+'/</span>':esc(e.name))+' <span style="color:#6F8173">'+e.path+'</span>').join('<br>')||'（空）');
      },
      open:async a=>{if(!a[0])return print('用法: open &lt;路径&gt;','terr');openPath(resolve(a[0]));},
      sysinfo:()=>{
        fs.estimate().then(est=>{
          print('系统: 琥珀系统 AmberOS 1.0<br>后端: '+(fs.backend==='opfs'?'OPFS（持久化）':'内存（降级）')+' · 本地挂载 '+Mounts.map.size+' 个<br>配额: '+fmtSize(est.quota||0)+' · 已用: '+fmtSize(est.usage||0)+'<br>窗口: '+WM.wins.size+' 个 · 分辨率: '+innerWidth+'×'+innerHeight);
        });
      },
      mount:()=>print('已挂载: '+([...Mounts.map.keys()].join(', ')||'无')+' <span style="color:#6F8173">（在文件管理器或桌面右键中挂载）</span>'),
    };
    const resolve=p=>p?pathNorm(p.startsWith('/')?p:cwd+'/'+p):cwd;
    async function onKey(e){
      if(e.key==='Enter'){
        const line=inp.value;
        inp.disabled=true;
        print(promptHTML()+esc(line));
        if(line.trim()){
          hist.push(line);hi2=hist.length;
          const [cmd,...args]=line.trim().split(/\s+/);
          const fn=CMDS[cmd];
          if(fn){try{await fn(args);}catch(err){print('错误: '+esc(err.message),'terr');}}
          else print('未找到命令: '+esc(cmd)+'（输入 help）','terr');
        }
        newPrompt();
      }else if(e.key==='ArrowUp'){e.preventDefault();if(hi2>0){hi2--;inp.value=hist[hi2]||'';}}
      else if(e.key==='ArrowDown'){e.preventDefault();if(hi2<hist.length){hi2++;inp.value=hist[hi2]||'';}}
    }
    print('<span style="color:#F0A93C">琥珀终端 v1.0</span> — 输入 <span class="tok">help</span> 查看命令');
    newPrompt();
  }
};

        st.emu.bus.register('emulator-started',()=>setStatus('运行中 · '+imgName));
        st.emu.bus.register('emulator-stopped',()=>setStatus('已停止'));
        $('.vm-reset',body).disabled=false;
        $('.vm-stop',body).disabled=false;
        $('.vm-mouse',body).disabled=false;
        setStatus('启动中 · '+imgName);
      }catch(e){
        setStatus('启动失败：'+e.message);
        toast('虚拟机启动失败','err');
      }
    };
    const pickFromVFS=async()=>{
      const all=await fs.walk('/',800);
      const imgs=all.filter(e=>!e.isDirectory&&['iso','img','bin','fda','vfd','flp','raw'].includes(extOf(e.name)));
      if(!imgs.length){toast('系统中没有找到镜像文件（.iso / .img）','warn');return;}
      const opts=imgs.slice(0,30).map(e=>({icon:'fZip',color:'#996B33',label:e.name,desc:e.path+' · '+fmtSize(e.size),value:e.path}));
      const v=await chooseDlg('选择虚拟机镜像',opts,{wide:true});
      if(!v)return;
      setStatus('正在读取镜像…');
      imgBuf=await fs.readFile(v,'arrayBuffer');
      imgName=baseName(v);
      setStatus('已加载 '+imgName+'（'+fmtSize(imgBuf.byteLength)+'）');
      $('.vm-start',body).disabled=false;
    };
    const pickLocal=async()=>{
      const files=await pickFiles({accept:'.iso,.img,.bin,.fda,.vfd,.flp,.raw'});
      if(!files.length)return;
      imgBuf=await files[0].arrayBuffer();
      imgName=files[0].name;
      setStatus('已加载 '+imgName+'（'+fmtSize(imgBuf.byteLength)+'）');
      $('.vm-start',body).disabled=false;
    };
    $('.vm-pick',body).onclick=pickFromVFS;
    $('.vm-local',body).onclick=pickLocal;
    $('.vm-start',body).onclick=()=>{$('.vm-start',body).disabled=true;boot();};
    $('.vm-reset',body).onclick=()=>{if(st.emu){st.emu.restart();setStatus('重启中…');}};
    $('.vm-stop',body).onclick=()=>{if(st.emu){st.emu.stop();setStatus('已停止');$('.vm-start',body).disabled=false;}};
    $('.vm-mouse',body).onclick=()=>{
      const sc=$('.vm-screen',body);
      if(sc.requestPointerLock)sc.requestPointerLock();
      toast('鼠标已锁定，按 Esc 释放','info');
    };
    win.onClose=()=>{try{st.emu&&st.emu.destroy();}catch(e){}if(document.pointerLockElement)document.exitPointerLock();};
  }
};

function initClock(){
  const el=$('#tb-clock');
  const tick=()=>{
    const d=new Date();
    const p=n=>String(n).padStart(2,'0');
    el.innerHTML='<b>'+p(d.getHours())+':'+p(d.getMinutes())+'</b><span>'+(d.getMonth()+1)+'月'+d.getDate()+'日</span>';
  };

/* 全局快捷键 */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeMenus();
  const tag=e.target.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag)||e.target.isContentEditable)return;
  /* 桌面选中项操作 */
  if(Desktop.sel.size&&!e.target.closest('.win')){
    const paths=Desktop.selSelPaths();
    if(e.key==='Delete'){
      confirmDlg('确认删除','删除选中的 '+paths.length+' 项？',{danger:true,okLabel:'删除'}).then(async ok=>{
        if(!ok)return;
        for(const p of paths){try{await fs.rm(p,true);}catch(err){toast(err.message,'err');}}
        Desktop.render();
      });
    }
    if(e.key==='F2'&&paths.length===1)renamePath(paths[0]);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){Explorer.clip={paths,mode:'copy'};toast('已复制');}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){Explorer.clip={paths,mode:'cut'};toast('已剪切');}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&Explorer.clip&&!e.target.closest('.win')){
    Explorer.paste('/desktop');
  }
});

  const greet=h2<6?'夜深了':h2<12?'上午好':h2<14?'中午好':h2<18?'下午好':'晚上好';
  setTimeout(()=>toast(greet+'，欢迎回到琥珀系统','ok'),400);
  if(fs.backend!=='opfs')setTimeout(()=>toast('提示：数据仅保存在内存中','warn',8000),1500);
})();
</script>
