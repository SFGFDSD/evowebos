    class DrawingBoardApp {
        static open() {
            const content = `
                <div class="drawing-board">
                    <div class="drawing-toolbar">
                        <div class="tool-group">
                            <button class="tool-btn active" data-tool="brush" title="Brush"><i class="bi bi-brush"></i></button>
                            <button class="tool-btn" data-tool="eraser" title="Eraser"><i class="bi bi-eraser"></i></button>
                            <button class="tool-btn" data-tool="line" title="Line"><i class="bi bi-slash-lg"></i></button>
                            <button class="tool-btn" data-tool="rect" title="Rectangle"><i class="bi bi-square"></i></button>
                            <button class="tool-btn" data-tool="circle" title="Circle"><i class="bi bi-circle"></i></button>
                        </div>
                        <div class="tool-group">
                            <div class="color-picker-wrapper">
                                <input type="color" value="#00d4aa" title="Color">
                            </div>
                            <input type="range" class="brush-size-slider" min="1" max="50" value="5" title="Brush Size">
                        </div>
                        <div class="tool-group">
                            <button class="clear-canvas" title="Clear"><i class="bi bi-trash"></i></button>
                            <button class="save-canvas" title="Save"><i class="bi bi-save"></i></button>
                        </div>
                    </div>
                    <div class="drawing-canvas-container">
                        <canvas width="800" height="500"></canvas>
                    </div>
                </div>
            `;
            
            const win = WindowManager.createWindow('drawing-board', 'Drawing Board', 900, 650, content);
            this.setupEvents(win);
        }
        
        static setupEvents(win) {
            const canvas = win.querySelector('canvas');
            const ctx = canvas.getContext('2d');
            const colorPicker = win.querySelector('input[type="color"]');
            const sizeSlider = win.querySelector('.brush-size-slider');
            const toolBtns = win.querySelectorAll('.tool-btn');
            const clearBtn = win.querySelector('.clear-canvas');
            const saveBtn = win.querySelector('.save-canvas');
            
            let isDrawing = false;
            let currentTool = 'brush';
            let startX, startY;
            let lastX, lastY;
            let snapshot;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            toolBtns.forEach(btn => {
                btn.onclick = () => {
                    toolBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTool = btn.dataset.tool;
                };
            });
            
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                if (e.touches) {
                    return {
                        x: (e.touches[0].clientX - rect.left) * scaleX,
                        y: (e.touches[0].clientY - rect.top) * scaleY
                    };
                }
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };
            
            const startDraw = (e) => {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                startX = lastX = pos.x;
                startY = lastY = pos.y;
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : colorPicker.value;
                ctx.lineWidth = sizeSlider.value;
            };
            
            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                
                if (currentTool === 'brush' || currentTool === 'eraser') {
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    lastX = pos.x;
                    lastY = pos.y;
                } else {
                    ctx.putImageData(snapshot, 0, 0);
                    ctx.beginPath();
                    
                    if (currentTool === 'line') {
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(pos.x, pos.y);
                    } else if (currentTool === 'rect') {
                        ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
                    } else if (currentTool === 'circle') {
                        const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                        ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                    }
                    ctx.stroke();
                }
            };
            
            const stopDraw = () => { isDrawing = false; };
            
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);
            
            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDraw);
            
            clearBtn.onclick = () => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            };
            
            saveBtn.onclick = async () => {
                const name = await showModal('Save Image', 'Enter filename:', true, 'drawing.png');
                if (!name) return;
                
                canvas.toBlob(async (blob) => {
                    const buffer = Buffer.from(await blob.arrayBuffer());
                    const path = `/home/Pictures/${name}`;
                    await fsPromise.writeFile(path, buffer);
                    showNotification('Saved', `Image saved to ${path}`, 'success');
                    refreshDesktop();
                }, 'image/png');
            };
        }
    }

            const openBtn = placeholder.querySelector('button');
            const playPauseBtn = win.querySelector('.play-pause');
            const progress = win.querySelector('.media-progress');
            const progressFill = win.querySelector('.media-progress-fill');
            
            let mediaElement = null;
            
            openBtn.onclick = () => FileExplorerApp.open('/home/Music');
            
            win.loadMedia = async (path) => {
                const data = await fsPromise.readFile(path);
                const ext = path.split('.').pop().toLowerCase();
                const mimeTypes = {
                    mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg',
                    mp4: 'video/mp4', webm: 'video/webm'
                };
                const mime = mimeTypes[ext] || 'video/mp4';
                const blob = new Blob([data], { type: mime });
                const url = URL.createObjectURL(blob);
                
                placeholder.style.display = 'none';
                
                if (mediaElement) {
                    mediaElement.pause();
                    mediaElement.remove();
                }
                
                const isVideo = ['mp4', 'webm', 'mkv', 'avi', 'mov'].includes(ext);
                mediaElement = document.createElement(isVideo ? 'video' : 'audio');
                mediaElement.src = url;
                mediaElement.controls = false;
                if (isVideo) {
                    mediaElement.style.cssText = 'max-width:100%;max-height:100%;border-radius:12px;';
                } else {
                    mediaElement.style.cssText = 'width:300px;';
                }
                display.appendChild(mediaElement);
                
                mediaElement.ontimeupdate = () => {
                    const pct = (mediaElement.currentTime / mediaElement.duration) * 100;
                    progressFill.style.width = pct + '%';
                };
                
                mediaElement.onended = () => {
                    playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                };
                
                win.querySelector('.window-title').textContent = `Media Player - ${path.split('/').pop()}`;
            };
            
            playPauseBtn.onclick = () => {
                if (!mediaElement) return;
                if (mediaElement.paused) {
                    mediaElement.play();
                    playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                } else {
                    mediaElement.pause();
                    playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                }
            };
            
            progress.onclick = (e) => {
                if (!mediaElement) return;
                const rect = progress.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                mediaElement.currentTime = pct * mediaElement.duration;
            };
        }
        
        static async loadMedia(win, path) {
            if (win.loadMedia) {
                await win.loadMedia(path);
            }
        }
    }

    class CalculatorApp {
        static open() {
            const buttons = [
                ['C', '(', ')', '/'],
                ['7', '8', '9', '*'],
                ['4', '5', '6', '-'],
                ['1', '2', '3', '+'],
                ['0', '.', '=', '']
            ];
            
            const funcs = ['sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'pow', 'π'];
            
            let btnsHtml = '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">';
            funcs.forEach(f => {
                btnsHtml += `<button class="calc-btn function" data-val="${f}" style="flex:1;min-width:50px;height:36px;font-size:13px;">${f}</button>`;
            });
            btnsHtml += '</div>';
            
            buttons.forEach(row => {
                row.forEach(btn => {
                    if (!btn) return;
                    let cls = 'calc-btn';
                    if (['+', '-', '*', '/', '(', ')'].includes(btn)) cls += ' operator';
                    if (btn === '=') cls += ' equals';
                    if (btn === 'C') cls += ' function';
                    if (btn === '0') cls += ' wide';
                    btnsHtml += `<button class="${cls}" data-val="${btn}">${btn}</button>`;
                });
            });
            
            const content = `
                <div class="calculator">
                    <div class="calculator-display">
                        <div class="calculator-expression"></div>
                        <div class="calculator-result">0</div>
                    </div>
                    <div class="calculator-buttons">${btnsHtml}</div>
                </div>
            `;
            
            const win = WindowManager.createWindow('calculator', 'Calculator', 360, 520, content);
            this.setupEvents(win);
        }
        
        static setupEvents(win) {
            const expression = win.querySelector('.calculator-expression');
            const result = win.querySelector('.calculator-result');
            const buttons = win.querySelectorAll('.calc-btn');
            
            let currentExpr = '';
            
            const calculate = () => {
                try {
                    let expr = currentExpr
                        .replace(/sin/g, 'Math.sin')
                        .replace(/cos/g, 'Math.cos')
                        .replace(/tan/g, 'Math.tan')
                        .replace(/log/g, 'Math.log10')
                        .replace(/ln/g, 'Math.log')
                        .replace(/sqrt/g, 'Math.sqrt')
                        .replace(/pow/g, 'Math.pow')
                        .replace(/π/g, 'Math.PI');
                    
                    const res = eval(expr);
                    result.textContent = isNaN(res) || !isFinite(res) ? 'Error' : 
                        (Number.isInteger(res) ? res : res.toFixed(8).replace(/\.?0+$/, ''));
                } catch (e) {
                    result.textContent = 'Error';
                }
            };
            
            buttons.forEach(btn => {
                btn.onclick = () => {
                    const val = btn.dataset.val;
                    
                    if (val === 'C') {
                        currentExpr = '';
                        result.textContent = '0';
                        expression.textContent = '';
                    } else if (val === '=') {
                        calculate();
                        expression.textContent = currentExpr + ' =';
                    } else if (['sin', 'cos', 'tan', 'log', 'ln', 'sqrt'].includes(val)) {
                        currentExpr += val + '(';
                        expression.textContent = currentExpr;
                    } else if (val === 'pow') {
                        currentExpr += '**';
                        expression.textContent = currentExpr;
                    } else if (val === 'π') {
                        currentExpr += 'π';
                        expression.textContent = currentExpr;
                    } else {
                        currentExpr += val;
                        expression.textContent = currentExpr;
                    }
                };
            });
        }
    }

                    for (const file of files) {
                        const fullPath = path === '/' ? `/${file}` : `${path}/${file}`;
                        const stat = await fsPromise.stat(fullPath);
                        if (stat.isDirectory()) {
                            await addToZip(fullPath, zipFolder.folder(file));
                        } else {
                            const data = await fsPromise.readFile(fullPath);
                            zipFolder.file(file, data);
                        }
                    }
                };
                
                await addToZip('/home', zip.folder('home'));
                
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'auroraos-export.zip';
                a.click();
                URL.revokeObjectURL(url);
                
                showNotification('Export Complete', 'Your files have been exported.', 'success');
            };
        }
    }

    // ============================================
    // DESKTOP MANAGEMENT
    // ============================================
    async function refreshDesktop() {
        const container = document.getElementById('desktop-icons');
        container.innerHTML = '';
        
        try {
            const files = await fsPromise.readdir('/home/Desktop');
            
            for (const file of files) {
                const path = `/home/Desktop/${file}`;
                const stat = await fsPromise.stat(path);
                const isDir = stat.isDirectory();
                const icon = getFileIcon(file, isDir);
                
                const iconEl = document.createElement('div');
                iconEl.className = 'desktop-icon';
                iconEl.dataset.path = path;
                iconEl.dataset.isDir = isDir;
                iconEl.innerHTML = `
                    <div class="icon"><i class="bi ${icon}"></i></div>
                    <span class="label">${file}</span>
                `;
                
                iconEl.addEventListener('dblclick', () => {
                    if (isDir) {
                        FileExplorerApp.open(path);
                    } else {
                        const type = getFileType(file);
                        if (type === 'text') TextEditorApp.open(path);
                        else if (type === 'image') FileExplorerApp.previewImage(path);
                        else if (type === 'audio' || type === 'video') MediaPlayerApp.open(path);
                        else showNotification('Cannot Open', 'No associated application.', 'warning');
                    }
                });
                
                iconEl.addEventListener('click', () => {
                    container.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
                    iconEl.classList.add('selected');
                });
                
                container.appendChild(iconEl);
            }
        } catch (err) {
            console.error('Error loading desktop:', err);
        }
    }

    // ============================================
    // CONTEXT MENU
    // ============================================
    function setupContextMenu() {
        const menu = document.getElementById('context-menu');
        const desktop = document.getElementById('desktop');
        
        desktop.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.desktop-icon')) return;
            e.preventDefault();
            
            menu.innerHTML = `
                <div class="context-menu-item" data-action="refresh"><i class="bi bi-arrow-clockwise"></i><span>Refresh</span></div>
                <div class="context-menu-item" data-action="new-folder"><i class="bi bi-folder-plus"></i><span>New Folder</span></div>
                <div class="context-menu-item" data-action="new-file"><i class="bi bi-file-earmark-plus"></i><span>New Text File</span></div>
                <div class="context-menu-divider"></div>
                ${clipboard.path ? `<div class="context-menu-item" data-action="paste"><i class="bi bi-clipboard-check"></i><span>Paste</span></div><div class="context-menu-divider"></div>` : ''}
                <div class="context-menu-item" data-action="upload"><i class="bi bi-upload"></i><span>Upload File</span></div>
                <div class="context-menu-item" data-action="change-wallpaper"><i class="bi bi-image"></i><span>Change Wallpaper</span></div>
                <div class="context-menu-divider"></div>
                <div class="context-menu-item" data-action="fullscreen"><i class="bi bi-arrows-fullscreen"></i><span>Toggle Fullscreen</span></div>
            `;
            
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            menu.style.display = 'block';
        });
        
        menu.addEventListener('click', async (e) => {
            const action = e.target.closest('.context-menu-item')?.dataset.action;
            menu.style.display = 'none';
            
            if (action === 'refresh') {
                refreshDesktop();
            } else if (action === 'new-folder') {
                const name = await showModal('New Folder', 'Enter folder name:', true, 'New Folder');
                if (name) {
                    await fsPromise.mkdir(`/home/Desktop/${name}`);
                    refreshDesktop();
                }
            } else if (action === 'new-file') {
                const name = await showModal('New File', 'Enter file name:', true, 'New File.txt');
                if (name) {
                    await fsPromise.writeFile(`/home/Desktop/${name}`, '');
                    refreshDesktop();
                }
            } else if (action === 'paste' && clipboard.path) {
                const fileName = clipboard.path.split('/').pop();
                const newPath = `/home/Desktop/${fileName}`;
                const data = await fsPromise.readFile(clipboard.path);
                await fsPromise.writeFile(newPath, data);
                if (clipboard.cut) {
                    await fsPromise.unlink(clipboard.path);
                    clipboard = { type: null, path: null, cut: false };
                }
                refreshDesktop();
            } else if (action === 'upload') {
                document.getElementById('file-upload-input').click();
            } else if (action === 'change-wallpaper') {
                document.getElementById('wallpaper-upload-input').click();
            } else if (action === 'fullscreen') {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#context-menu')) {
                menu.style.display = 'none';
            }
        });
    }

    // ============================================
    // TASKBAR SETUP
    // ============================================
    function setupTaskbar() {
        const taskbarItems = document.querySelectorAll('.taskbar-item[data-app]');
        
        taskbarItems.forEach(item => {
            item.addEventListener('click', () => {
                const appId = item.dataset.app;
                const existingWindow = WindowManager.getWindowByApp(appId);
                
                if (existingWindow) {
                    const winData = windows.get(existingWindow.id);
                    if (winData?.minimized) {
                        WindowManager.restoreWindow(existingWindow);
                    } else {
                        WindowManager.focusWindow(existingWindow);
                    }
                } else {
                    switch (appId) {
                        case 'file-explorer': FileExplorerApp.open(); break;
                        case 'text-editor': TextEditorApp.open(); break;
                        case 'web-browser': WebBrowserApp.open(); break;
                        case 'drawing-board': DrawingBoardApp.open(); break;
                        case 'media-player': MediaPlayerApp.open(); break;
                        case 'calculator': CalculatorApp.open(); break;
                        case 'settings': SettingsApp.open(); break;
                    }
                }
            });
        });
    }

    // ============================================
    // FILE UPLOAD HANDLERS
    // ============================================
    function setupFileUploads() {
        const fileInput = document.getElementById('file-upload-input');
        const wallpaperInput = document.getElementById('wallpaper-upload-input');
        
        fileInput.addEventListener('change', async (e) => {
            for (const file of e.target.files) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const data = Buffer.from(ev.target.result);
                    await fsPromise.writeFile(`/home/Desktop/${file.name}`, data);
                    showNotification('Uploaded', file.name, 'success');
                    refreshDesktop();
                };
                reader.readAsArrayBuffer(file);
            }
            fileInput.value = '';
        });
        
        wallpaperInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = Buffer.from(ev.target.result);
                const path = `/system/wallpapers/${file.name}`;
                await fsPromise.writeFile(path, data);
                
                // Set as wallpaper
                const blob = new Blob([data]);
                const url = URL.createObjectURL(blob);
                document.getElementById('wallpaper').style.backgroundImage = `url(${url})`;
                localStorage.setItem('wallpaper', path);
                
                showNotification('Wallpaper Changed', file.name, 'success');
            };
            reader.readAsArrayBuffer(file);
            wallpaperInput.value = '';
        });
    }

    // ============================================
    // LOAD SAVED WALLPAPER
    // ============================================
    async function loadWallpaper() {
        const savedPath = localStorage.getItem('wallpaper');
        if (savedPath && await fsPromise.exists(savedPath)) {
            try {
                const data = await fsPromise.readFile(savedPath);
                const blob = new Blob([data]);
                const url = URL.createObjectURL(blob);
                document.getElementById('wallpaper').style.backgroundImage = `url(${url})`;
            } catch (e) {
                console.error('Could not load wallpaper:', e);
            }
        }
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    async function init() {
        try {
            // Load theme
            const savedTheme = localStorage.getItem('theme') || 'dark';
            currentTheme = savedTheme;
            document.documentElement.dataset.theme = savedTheme;
            
            // Initialize BrowserFS
            await initBrowserFS();
            await setupFileSystem();
            
            // Load wallpaper
            await loadWallpaper();
            
            // Setup UI
            setupContextMenu();
            setupTaskbar();
            setupFileUploads();
            
            // Refresh desktop
            await refreshDesktop();
            
            // Start clock
            updateClock();
            setInterval(updateClock, 1000);
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 800);
            
            console.log('🌌 AuroraOS initialized successfully!');
            
        } catch (err) {
            console.error('Initialization error:', err);
            showNotification('Error', 'Failed to initialize: ' + err.message, 'error');
            document.getElementById('loading-screen').classList.add('hidden');
        }
    }

    // Start the OS
    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
