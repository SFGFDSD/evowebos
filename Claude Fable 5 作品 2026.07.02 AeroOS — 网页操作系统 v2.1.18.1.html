<style>
/* ============ AeroOS · Frutiger Aero 主题 ============ */
:root{
  --aqua:#31a8e8; --aqua-deep:#0d68b0; --sky:#bfe8ff; --leaf:#7ed321; --leaf-deep:#3e9c0d;
  --glass:rgba(255,255,255,.55); --glass-hard:rgba(255,255,255,.78);
  --ink:#0c3a5c; --taskbar-h:54px;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.28) 48%,rgba(255,255,255,.04) 52%,rgba(255,255,255,.18));
  --font:'Quicksand','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink)}
body{background:#8ecdf0}
::selection{background:rgba(49,168,232,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.2)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#9fd8f5,#5cb3e4);border-radius:6px;border:2px solid rgba(255,255,255,.4)}
button{font-family:var(--font)}
svg{display:block}

/* ---------- 桌面 ---------- */
#desktop{position:fixed;inset:0 0 var(--taskbar-h) 0;overflow:hidden;background-size:cover;background-position:center;transition:background-image .4s}
#desktop::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(1200px 500px at 70% -10%,rgba(255,255,255,.35),transparent 60%)}
.dicon{position:absolute;width:86px;padding:6px 2px;border-radius:10px;text-align:center;cursor:default;
  user-select:none;-webkit-user-select:none;touch-action:none;z-index:2;
  transition:left .28s cubic-bezier(.22,1.2,.36,1),top .28s cubic-bezier(.22,1.2,.36,1),background .15s,box-shadow .15s}
.dicon.dragging{transition:none;opacity:.35}
.dicon:hover{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.dicon.sel{background:linear-gradient(180deg,rgba(160,220,255,.45),rgba(90,180,240,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 2px 8px rgba(13,104,176,.3)}
.dicon .ig{width:52px;height:52px;margin:0 auto 4px;filter:drop-shadow(0 3px 5px rgba(8,50,90,.45))}
.dicon .ig svg{width:100%;height:100%}
.dicon .lb{font-size:12px;line-height:1.25;color:#fff;font-weight:600;word-break:break-all;
  text-shadow:0 1px 3px rgba(6,40,70,.9),0 0 8px rgba(6,40,70,.5);max-height:46px;overflow:hidden}
#marquee{position:absolute;border:1px solid rgba(60,170,240,.9);background:rgba(120,200,250,.22);
  border-radius:4px;display:none;z-index:9;pointer-events:none}
.drop-glow{outline:2px dashed rgba(255,255,255,.9);outline-offset:-4px;border-radius:12px}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:5000;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;
  background:linear-gradient(180deg,rgba(210,240,255,.75),rgba(120,190,235,.65) 50%,rgba(60,140,200,.7));
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.75);box-shadow:0 -4px 24px rgba(10,60,110,.25)}
#taskbar::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.05));pointer-events:none}
#startBtn{position:relative;width:46px;height:46px;border:none;border-radius:50%;cursor:pointer;flex:none;
  background:radial-gradient(circle at 32% 26%,#c8f7ff 0%,#4fc3f7 34%,#0d84cf 68%,#0a5d99 100%);
  box-shadow:0 2px 8px rgba(6,50,90,.55),inset 0 1px 2px rgba(255,255,255,.9),inset 0 -3px 6px rgba(6,50,90,.4);
  transition:transform .18s,box-shadow .18s}
#startBtn:hover{transform:scale(1.07);box-shadow:0 3px 14px rgba(80,200,255,.8),inset 0 1px 2px rgba(255,255,255,.9)}
#startBtn:active{transform:scale(.96)}
#startBtn svg{width:26px;height:26px;margin:auto}
#taskApps{display:flex;gap:5px;flex:1;overflow-x:auto;overflow-y:hidden;padding:4px 2px;scrollbar-width:none}
#taskApps::-webkit-scrollbar{display:none}
.tapp{position:relative;flex:none;display:flex;align-items:center;gap:7px;height:40px;max-width:180px;padding:0 12px;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.14));
  border:1px solid rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(10,60,110,.18);
  font-size:12.5px;font-weight:600;color:#083a5e;transition:.15s}
.tapp:hover{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.3))}
.tapp.active{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(190,230,255,.55));box-shadow:inset 0 1px 5px rgba(10,70,120,.28)}
.tapp.min{opacity:.62}
.tapp .ti{width:20px;height:20px;flex:none}.tapp .ti svg{width:100%;height:100%}
.tapp .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{flex:none;text-align:center;padding:4px 12px;border-radius:8px;font-weight:700;font-size:13px;color:#063757;line-height:1.25;
  background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.5);position:relative}
#clock small{display:block;font-size:10px;font-weight:600;opacity:.8}

/* ---------- 开始菜单 ---------- */
#startMenu{position:fixed;left:8px;bottom:calc(var(--taskbar-h) + 8px);width:400px;max-width:calc(100vw - 16px);max-height:70vh;z-index:6000;
  border-radius:16px;overflow:hidden;display:none;flex-direction:column;
  background:linear-gradient(160deg,rgba(235,250,255,.92),rgba(180,225,250,.88));
  backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 18px 60px rgba(6,50,95,.45),inset 0 1px 0 rgba(255,255,255,.9)}
#startMenu.show{display:flex;animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
#smHead{padding:16px 18px 8px;font-size:17px;font-weight:700;color:#0a4d7d;display:flex;align-items:center;gap:10px}
#smHead .orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#eaffd8,#8ee244 40%,#3e9c0d 80%);box-shadow:inset 0 1px 2px #fff,0 2px 6px rgba(30,90,10,.4)}
#smGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px;overflow-y:auto}
.smApp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:12px;cursor:pointer;transition:.15s;border:1px solid transparent}
.smApp:hover{background:rgba(255,255,255,.65);border-color:rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(20,90,150,.18);transform:translateY(-2px)}
.smApp .ig{width:44px;height:44px}.smApp .ig svg{width:100%;height:100%}
.smApp .lb{font-size:12px;font-weight:600;color:#0a4470;text-align:center}
#smFoot{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.25)}
#smFoot button{flex:1;padding:8px;border-radius:9px;border:1px solid rgba(255,255,255,.8);cursor:pointer;font-weight:700;font-size:12.5px;color:#0a4470;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(210,240,255,.5));transition:.15s}
#smFoot button:hover{background:linear-gradient(180deg,#fff,#d8f0ff)}

/* ---------- 窗口 ---------- */
.window{position:absolute;min-width:280px;min-height:160px;border-radius:12px;display:flex;flex-direction:column;
  background:rgba(240,249,255,.94);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 10px 44px rgba(6,45,85,.45),inset 0 0 0 1px rgba(140,200,240,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.window.focus{box-shadow:0 16px 60px rgba(4,40,80,.6),0 0 0 1px rgba(90,190,250,.5),inset 0 0 0 1px rgba(160,215,250,.5)}
.window.opening{animation:winIn .26s cubic-bezier(.2,1.3,.4,1)}
@keyframes winIn{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:none;opacity:1}}
.window.closing{animation:winOut .18s ease forwards}
@keyframes winOut{to{transform:scale(.92) translateY(12px);opacity:0}}
.window.maxed{border-radius:0}
.titlebar{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;cursor:default;position:relative;user-select:none;-webkit-user-select:none;touch-action:none;
  background:linear-gradient(180deg,rgba(225,245,255,.95),rgba(150,205,240,.85) 52%,rgba(115,180,225,.9));
  border-bottom:1px solid rgba(255,255,255,.6)}
.titlebar::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.08));pointer-events:none}
.titlebar .wicon{width:18px;height:18px;flex:none;z-index:1}.titlebar .wicon svg{width:100%;height:100%}
.titlebar .wtitle{flex:1;font-size:13px;font-weight:700;color:#073a5f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.wbtns{display:flex;gap:4px;z-index:1}
.wbtn{width:34px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(200,232,252,.45));transition:.13s;color:#0a4a78}
.wbtn:hover{background:linear-gradient(180deg,#fff,#cfeaff)}
.wbtn.close:hover{background:linear-gradient(180deg,#ffb3ab,#e8543f);color:#fff;border-color:#ffd0c8}
.wbtn svg{width:12px;height:12px}
.wbody{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.rs{position:absolute;z-index:20}
.rs.n{top:-4px;left:8px;right:8px;height:8px;cursor:n-resize}.rs.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:s-resize}
.rs.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:e-resize}.rs.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:w-resize}
.rs.ne{top:-5px;right:-5px;width:14px;height:14px;cursor:ne-resize}.rs.nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nw-resize}
.rs.se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:se-resize}.rs.sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:sw-resize}
.window.fullscreen-app .titlebar,.window.fullscreen-app .rs{display:none}
.window.fullscreen-app{border-radius:0}

/* ---------- 右键菜单 ---------- */
.ctxmenu{position:fixed;z-index:9000;min-width:190px;padding:5px;border-radius:11px;
  background:linear-gradient(170deg,rgba(245,252,255,.96),rgba(205,235,255,.93));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 40px rgba(5,45,85,.4);
  animation:pop .16s cubic-bezier(.2,1.3,.4,1)}
.cmi{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;color:#093f68;cursor:pointer;position:relative}
.cmi:hover{background:linear-gradient(180deg,rgba(120,200,250,.5),rgba(70,165,230,.4));color:#032a48}
.cmi .mi{width:16px;height:16px;flex:none}.cmi .mi svg{width:100%;height:100%}
.cmi .arrow{margin-left:auto;font-size:10px;opacity:.6}
.cmsep{height:1px;margin:4px 10px;background:linear-gradient(90deg,transparent,rgba(60,140,200,.4),transparent)}

/* ---------- 通用控件 ---------- */
.abtn{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.85);cursor:pointer;font-size:12.5px;font-weight:700;color:#0a4470;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(200,235,255,.55));box-shadow:0 1px 3px rgba(10,60,110,.18);transition:.14s;white-space:nowrap}
.abtn:hover{background:linear-gradient(180deg,#fff,#d4eeff);box-shadow:0 2px 8px rgba(40,140,220,.35)}
.abtn:active{transform:translateY(1px)}
.abtn.primary{background:linear-gradient(180deg,#7fd0f7,#2492d8);color:#fff;text-shadow:0 1px 2px rgba(6,60,110,.5);border-color:#a8e0ff}
.abtn.primary:hover{background:linear-gradient(180deg,#93dbff,#2e9fe6)}
.abtn.danger{background:linear-gradient(180deg,#ffb9b0,#e05540);color:#fff;border-color:#ffd6cf}
.ainput{padding:7px 11px;border-radius:8px;border:1px solid rgba(120,190,235,.7);background:rgba(255,255,255,.85);font-size:13px;color:#083a5e;outline:none;font-family:var(--font)}
.ainput:focus{border-color:#31a8e8;box-shadow:0 0 0 3px rgba(80,190,250,.3)}
.toolrow{display:flex;align-items:center;gap:6px;padding:7px 9px;flex-wrap:wrap;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(215,240,255,.45));border-bottom:1px solid rgba(160,210,245,.55)}

/* ---------- 提示 ---------- */
#toasts{position:fixed;right:14px;bottom:calc(var(--taskbar-h) + 12px);z-index:9500;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:11px 17px;border-radius:11px;font-size:13px;font-weight:600;color:#073a5f;max-width:320px;
  background:linear-gradient(165deg,rgba(250,254,255,.96),rgba(200,235,255,.92));
  border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(6,50,95,.35);
  animation:toastIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes toastIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.toast.err{background:linear-gradient(165deg,#fff2f0,#ffd6cf);color:#8c2314}

/* ---------- 对话框 ---------- */
#modalMask{position:fixed;inset:0;z-index:8800;background:rgba(10,50,90,.3);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center}
#modalMask.show{display:flex}
.modal{width:360px;max-width:92vw;border-radius:14px;overflow:hidden;background:linear-gradient(165deg,rgba(248,253,255,.98),rgba(205,236,255,.95));
  border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 70px rgba(4,40,80,.5);animation:pop .2s cubic-bezier(.2,1.3,.4,1)}
.modal h3{padding:15px 18px 4px;font-size:15px;color:#083a5e}
.modal .mbody{padding:10px 18px;font-size:13px;color:#134b74}
.modal .mrow{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 15px}

/* ---------- 文件管理器 ---------- */
.explorer{display:flex;flex-direction:column;height:100%}
.exp-main{flex:1;display:flex;overflow:hidden;position:relative}
.exp-side{width:172px;flex:none;overflow-y:auto;padding:8px 6px;border-right:1px solid rgba(160,210,245,.5);
  background:linear-gradient(180deg,rgba(235,248,255,.7),rgba(210,238,255,.5))}
.exp-side h4{font-size:11px;padding:8px 10px 4px;color:#3a7cab;letter-spacing:.5px}
.sideitem{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:#0a4470;cursor:pointer;margin-bottom:1px}
.sideitem:hover{background:rgba(255,255,255,.7)}
.sideitem.cur{background:linear-gradient(180deg,rgba(130,205,250,.55),rgba(80,170,235,.45));color:#032a48}
.sideitem .si{width:17px;height:17px;flex:none}.sideitem .si svg{width:100%;height:100%}
.crumbbar{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;overflow-x:auto;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.7);border:1px solid rgba(140,200,240,.6);scrollbar-width:none}
.crumbbar::-webkit-scrollbar{display:none}
.crumb{padding:2px 7px;border-radius:6px;font-size:12.5px;font-weight:700;color:#0b5089;cursor:pointer;white-space:nowrap}
.crumb:hover{background:rgba(120,200,250,.4)}
.crumb-sep{color:#7db4d8;font-size:11px}
.fileview{flex:1;overflow:auto;position:relative;background:rgba(255,255,255,.45)}
.ftable{width:100%;border-collapse:collapse;table-layout:fixed;min-width:520px}
.ftable th{position:sticky;top:0;z-index:3;text-align:left;font-size:12px;color:#26608d;font-weight:700;padding:7px 10px;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,rgba(240,250,255,.98),rgba(205,235,255,.95));border-bottom:1px solid rgba(150,205,245,.7)}
.ftable th .colrs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize}
.ftable th .sortmark{font-size:9px;margin-left:4px;color:#1583cf}
.ftable td{padding:6px 10px;font-size:12.8px;color:#0d436d;border-bottom:1px solid rgba(190,225,250,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow{cursor:default}
.frow:hover td{background:rgba(190,230,255,.4)}
.frow.sel td{background:linear-gradient(180deg,rgba(140,210,252,.55),rgba(95,180,240,.45))}
.frow .fname{display:flex;align-items:center;gap:8px;font-weight:600}
.frow .fi{width:20px;height:20px;flex:none}.frow .fi svg{width:100%;height:100%}
.exp-status{flex:none;padding:5px 12px;font-size:11.5px;color:#2a6491;background:rgba(255,255,255,.55);border-top:1px solid rgba(160,210,245,.5)}

.fcount{font-size:11px;color:#9fc4da;min-width:48px;text-align:center}

.imgviewer{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#10181f}
.pickerlist{flex:1;overflow-y:auto}

@media (max-width:768px){

}

/* ================= IndexedDB / Cookie 小助手（配置持久层） ================= */
const IDB={db:null,
 open(){return new Promise(res=>{const rq=indexedDB.open('aeroos',1);
  rq.onupgradeneeded=()=>{rq.result.createObjectStore('kv')};
  rq.onsuccess=()=>{IDB.db=rq.result;res(true)}; rq.onerror=()=>res(false);});},
 set(k,v){return new Promise(res=>{if(!IDB.db)return res(false);const tx=IDB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});},
 get(k){return new Promise(res=>{if(!IDB.db)return res(undefined);const rq=IDB.db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined);});},
 del(k){return new Promise(res=>{if(!IDB.db)return res(false);const tx=IDB.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});}};
const Cfg={ get(k,d){try{const v=localStorage.getItem('aero.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
 set(k,v){try{localStorage.setItem('aero.'+k,JSON.stringify(v));}catch(e){IDB.set('cfg.'+k,v);}} };

/* ================= 统一虚拟文件系统 fs（OPFS + 本地挂载 + 内存降级） ================= */
class HandleBackend{ // 同时服务 OPFS 与 File System Access API（接口天然一致）
  constructor(root){this.root=root;}
  async _dir(rel,create=false){let d=this.root;for(const p of String(rel).split('/').filter(Boolean))d=await d.getDirectoryHandle(p,{create});return d;}
  async _parent(rel){const parts=String(rel).split('/').filter(Boolean);const name=parts.pop();return [await this._dir(parts.join('/')),name];}
  async readdir(rel){const d=await this._dir(rel);const out=[];for await(const h of d.values())out.push({name:h.name,isDir:h.kind==='directory'});return out;}
  async stat(rel){rel=String(rel||'');if(!rel.split('/').filter(Boolean).length)return {name:'',isDir:true,size:0,mtime:0};
    const [p,name]=await this._parent(rel);
    try{const fh=await p.getFileHandle(name);const f=await fh.getFile();return {name,isDir:false,size:f.size,mtime:f.lastModified,type:f.type||mimeOf(name)};}
    catch(e){await p.getDirectoryHandle(name);return {name,isDir:true,size:0,mtime:0};}}
  async mkdir(rel){const [p,name]=await this._parent(rel);await p.getDirectoryHandle(name,{create:true});}
  async getFileObj(rel){const [p,name]=await this._parent(rel);const fh=await p.getFileHandle(name);return await fh.getFile();}
  async readFile(rel){return await (await this.getFileObj(rel)).arrayBuffer();}
  async writeFile(rel,data){const [p,name]=await this._parent(rel);const fh=await p.getFileHandle(name,{create:true});
    const w=await fh.createWritable();await w.write(data);await w.close();}
  async delete(rel){const [p,name]=await this._parent(rel);await p.removeEntry(name,{recursive:true});}
  async exists(rel){try{await this.stat(rel);return true;}catch(e){return false;}}
}
class MemBackend{ // 降级：OPFS 不可用时的内存文件系统（会话内有效）
  constructor(){this.tree={type:'dir',children:{}};}
  _walk(rel,create=false){let n=this.tree;for(const p of String(rel).split('/').filter(Boolean)){
    if(!n.children[p]){if(create)n.children[p]={type:'dir',children:{}};else throw new Error('不存在: '+p);}
    n=n.children[p];if(n.type!=='dir')throw new Error('不是目录');}return n;}
  _parent(rel){const parts=String(rel).split('/').filter(Boolean);const name=parts.pop();return [this._walk(parts.join('/')),name];}
  async readdir(rel){const d=this._walk(rel);return Object.entries(d.children).map(([name,n])=>({name,isDir:n.type==='dir'}));}
  async stat(rel){if(!String(rel).split('/').filter(Boolean).length)return{name:'',isDir:true,size:0,mtime:0};
    const [p,name]=this._parent(rel);const n=p.children[name];if(!n)throw new Error('不存在');
    return n.type==='dir'?{name,isDir:true,size:0,mtime:n.mtime||0}:{name,isDir:false,size:n.data.byteLength,mtime:n.mtime,type:mimeOf(name)};}
  async mkdir(rel){const [p,name]=this._parent(rel);if(!p.children[name])p.children[name]={type:'dir',children:{},mtime:Date.now()};}
  async getFileObj(rel){const [p,name]=this._parent(rel);const n=p.children[name];if(!n||n.type!=='file')throw new Error('不存在');
    return new File([n.data],name,{type:mimeOf(name),lastModified:n.mtime});}
  async readFile(rel){return (await this.getFileObj(rel)).arrayBuffer();}
  async writeFile(rel,data){const [p,name]=this._parent(rel);
    let buf; if(typeof data==='string')buf=new TextEncoder().encode(data).buffer;
    else if(data instanceof Blob)buf=await data.arrayBuffer();
    else if(ArrayBuffer.isView(data))buf=data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength);
    else buf=data;
    p.children[name]={type:'file',data:buf,mtime:Date.now()};}
  async delete(rel){const [p,name]=this._parent(rel);delete p.children[name];}
  async exists(rel){try{await this.stat(rel);return true;}catch(e){return false;}}
}
const fs={
  mounts:[], mode:'opfs', def:null,
  async init(){
    try{ const r=await navigator.storage.getDirectory();
      // 探测可写性
      const t=await r.getFileHandle('.aero-probe',{create:true});const w=await t.createWritable();await w.write('1');await w.close();await r.removeEntry('.aero-probe');
      this.def=new HandleBackend(r); this.mode='opfs';
      try{await navigator.storage.persist();}catch(e){}
    }catch(e){ this.def=new MemBackend(); this.mode='memory'; }
  },
  mount(handle){ const name=handle.name||'本地文件夹'; const path='/mnt/local/'+name;
    this.mounts=this.mounts.filter(m=>m.path!==path);
    this.mounts.push({path,backend:new HandleBackend(handle),handle}); return path; },
  unmount(path){ this.mounts=this.mounts.filter(m=>m.path!==path); },
  route(path){ path=norm(path);
    for(const m of this.mounts){ if(path===m.path||path.startsWith(m.path+'/')) return [m.backend, path.slice(m.path.length)||'/']; }
    return [this.def, path]; },
  _virt(path){ path=norm(path);
    if(path==='/mnt') return [{name:'local',isDir:true}];
    if(path==='/mnt/local') return this.mounts.map(m=>({name:basename(m.path),isDir:true}));
    return null; },
  async readdir(path){ const v=this._virt(path); if(v)return v;
    const [b,rel]=this.route(path); return (await b.readdir(rel)).filter(e=>!e.name.startsWith('.aero-')); },
  async stat(path,...extra){ path=norm(path);
    if(path==='/mnt'||path==='/mnt/local')return {name:basename(path),isDir:true,size:0,mtime:0};
    for(const m of this.mounts)if(path===m.path)return {name:basename(path),isDir:true,size:0,mtime:0};
    const [b,rel]=this.route(path); return b.stat(rel); },
  async mkdir(path){ const [b,rel]=this.route(path); return b.mkdir(rel); },
  async readFile(path,...extra){ const [b,rel]=this.route(path); return b.readFile(rel); },
  async readText(path){ const buf=await this.readFile(path); return new TextDecoder().decode(buf); },
  async getFileObj(path){ const [b,rel]=this.route(path); return b.getFileObj(rel); },
  async writeFile(path,data,...extra){ const [b,rel]=this.route(path); return b.writeFile(rel,data); },
  async delete(path){ const [b,rel]=this.route(path); return b.delete(rel); },
  async exists(path){ try{await this.stat(path);return true;}catch(e){return false;} },
  async uniqueName(dir,name){ if(!await this.exists(join(dir,name)))return name;
    const e=extOf(name); const base=e?name.slice(0,-(e.length+1)):name;
    for(let i=2;i<999;i++){const n=e?`${base} (${i}).${e}`:`${base} (${i})`; if(!await this.exists(join(dir,n)))return n;} return Date.now()+'-'+name; },
  async copyTo(src,dstDir,newName){ const st=await this.stat(src);
    const name=await this.uniqueName(dstDir,newName||st.name||basename(src));
    const dst=join(dstDir,name);
    if(st.isDir){ await this.mkdir(dst); for(const e of await this.readdir(src)) await this.copyTo(join(src,e.name),dst,e.name); }
    else{ await this.writeFile(dst, await this.readFile(src)); }
    return dst; },
  async moveTo(src,dstDir,newName){ src=norm(src);
    if(join(dstDir,newName||basename(src))===src)return src;
    if(norm(dstDir).startsWith(src+'/'))throw new Error('不能移动到自身内部');
    const dst=await this.copyTo(src,dstDir,newName); await this.delete(src); return dst; },
  async rename(src,newName){ return this.moveTo(src,dirname(src),newName); },
  async sizeOf(path){ const st=await this.stat(path); if(!st.isDir)return st.size;
    let sum=0; try{ for(const e of await this.readdir(path)) sum+=await this.sizeOf(join(path,e.name)); }catch(err){} return sum; }
};

function toast(msg,err){ const t=el('div','toast'+(err?' err':''),esc(msg)); $('#toasts').appendChild(t);
 setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(()=>t.remove(),420);},err?4200:2600); }
function dialog({title,body,inputs,buttons}){ return new Promise(res=>{
 const mask=$('#modalMask'); mask.innerHTML=''; mask.classList.add('show');
 const m=el('div','modal'); m.innerHTML=`<h3>${esc(title)}</h3><div class="mbody"></div><div class="mrow"></div>`;
 const mb=$('.mbody',m); if(body)mb.innerHTML=body;
 const vals=[];
 (inputs||[]).forEach((inp,i)=>{ const f=el('input','ainput'); f.style.cssText='width:100%;margin-top:8px'; f.value=inp.value||''; f.placeholder=inp.placeholder||''; mb.appendChild(f); vals.push(f); if(i===0)setTimeout(()=>{f.focus();f.select();},60); });
 const row=$('.mrow',m);
 (buttons||[{label:'确定',primary:true,v:true},{label:'取消',v:null}]).forEach(btn=>{
   const b=el('button','abtn'+(btn.primary?' primary':'')+(btn.danger?' danger':''),esc(btn.label));
   b.onclick=()=>{ mask.classList.remove('show'); mask.innerHTML=''; res(btn.v===true&&vals.length?vals.map(f=>f.value):(btn.v===true?true:btn.v)); };
   row.appendChild(b); });
 m.addEventListener('keydown',e=>{ if(e.key==='Enter'){const p=$('.abtn.primary',m);if(p)p.click();} if(e.key==='Escape'){mask.classList.remove('show');mask.innerHTML='';res(null);} });
 mask.appendChild(m); });}
const aeroPrompt=async(title,def='',ph='')=>{const r=await dialog({title,inputs:[{value:def,placeholder:ph}]});return r?r[0]:null;};

let _menuEl=null;
function closeMenu(){ if(_menuEl){_menuEl.remove();_menuEl=null;} $$('.ctxmenu.sub').forEach(m=>m.remove()); }
function showMenu(x,y,items){ closeMenu();
 const m=buildMenu(items); m.style.visibility='hidden'; document.body.appendChild(m); _menuEl=m;
 const r=m.getBoundingClientRect();
 if(x+r.width>innerWidth)x=Math.max(4,innerWidth-r.width-6);
 if(y+r.height>innerHeight)y=Math.max(4,innerHeight-r.height-6);
 m.style.left=x+'px'; m.style.top=y+'px'; m.style.visibility=''; }
function buildMenu(items){ const m=el('div','ctxmenu');
 items.forEach(it=>{ if(it.sep){m.appendChild(el('div','cmsep'));return;}
  const mi=el('div','cmi',`<span class="mi">${it.icon||''}</span><span>${esc(it.label)}</span>${it.sub?'<span class="arrow">▶</span>':''}`);
  if(it.sub){ mi.addEventListener('mouseenter',()=>{ $$('.ctxmenu.sub').forEach(s=>s.remove());
    const sm=buildMenu(it.sub); sm.classList.add('sub'); sm.style.visibility='hidden'; document.body.appendChild(sm);
    const pr=mi.getBoundingClientRect(), sr=sm.getBoundingClientRect();
    let sx=pr.right+2, sy=pr.top-4;
    if(sx+sr.width>innerWidth)sx=pr.left-sr.width-2; if(sy+sr.height>innerHeight)sy=innerHeight-sr.height-6;
    sm.style.left=sx+'px'; sm.style.top=sy+'px'; sm.style.visibility=''; });
   mi.addEventListener('click',e=>e.stopPropagation());
  } else mi.onclick=()=>{ closeMenu(); it.fn&&it.fn(); };
  m.appendChild(mi); });
 return m; }
window.addEventListener('pointerdown',e=>{ if(!e.target.closest('.ctxmenu'))closeMenu(); },true);
window.addEventListener('blur',closeMenu);

 create(opt){

  const win=el('div','window opening');

  win.innerHTML=`<div class="titlebar"><span class="wicon">${w.icon}</span><span class="wtitle">${esc(w.title)}</span>
    <div class="wbtns">

/* ================= 导入（物理 → 虚拟，webkitGetAsEntry 递归） ================= */
function readAllEntries(reader){ return new Promise(res=>{ const all=[];
 (function step(){ reader.readEntries(ents=>{ if(!ents.length)return res(all); all.push(...ents); step(); },()=>res(all)); })(); }); }
async function importEntry(entry,destDir){
 if(entry.isFile){ const file=await new Promise((r,j)=>entry.file(r,j));
   const name=await fs.uniqueName(destDir,entry.name);
   await fs.writeFile(join(destDir,name),await file.arrayBuffer()); }
 else if(entry.isDirectory){ const name=await fs.uniqueName(destDir,entry.name);
   const nd=join(destDir,name); await fs.mkdir(nd);
   const ents=await readAllEntries(entry.createReader());
   for(const e of ents)await importEntry(e,nd); } }
async function importDrop(dt,destDir){ let n=0;
 const items=[...(dt.items||[])].filter(i=>i.kind==='file');
 const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry());
 if(entries.some(Boolean)){ for(const en of entries){ if(en){ await importEntry(en,destDir); n++; } } }
 else{ for(const f of [...(dt.files||[])]){ const name=await fs.uniqueName(destDir,f.name);
   await fs.writeFile(join(destDir,name),await f.arrayBuffer()); n++; } }
 if(n){ toast(`已导入 ${n} 项到 ${destDir==='/Desktop'?'桌面':destDir}`); Desktop.refresh(); Explorer.refreshAll(); } }

      else zf.file(e.name,await fs.readFile(join(p,e.name))); } }
    await add(path,zip); blob=await zip.generateAsync({type:'blob'}); name=st.name+'.zip'; }

const Desktop={ path:'/Desktop', sel:new Set(), cell:{w:96,h:110}, pad:10, cache:new Map(),

 async refresh(){ const d=$('#desktop');

  for(const n in pos){ if(list.some(e=>e.name===n))used.add(key(pos[n].c,pos[n].r)); }
  let cur={c:0,r:0};
  const nextFree=()=>{ for(let c=0;c<cols*3;c++)for(let r=0;r<rows;r++){ if(!used.has(key(c,r))){used.add(key(c,r));return {c,r};} } return {c:0,r:0}; };
  for(const ent of list){ let pc=pos[ent.name];
   if(!pc||pc.c>=cols*3){ pc=nextFree(); pos[ent.name]=pc; }
   this.renderIcon(ent,pc); }
  this.savePos(pos);
  this.sel.forEach(n=>{ const ic=this.iconEl(n); if(ic)ic.classList.add('sel'); });
 },
 iconEl(name){ return $$('.dicon').find(i=>i.dataset.name===name); },

  // 桌面作为放置目标（内部重排 / 跨目录移入 / 物理文件导入）

        Desktop.refresh(); Explorer.refreshAll(); } }

function pickFile({title='选择文件',filter=null,start='/'}={}){ return new Promise(res=>{

  <div class="toolrow"><button class="abtn pk-up">↑ 上级</button><span class="pk-path" style="font-size:12px;font-weight:700;color:#26608d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"></span></div>
  <div class="pickerlist"></div></div>`;
 let cwd=start; let done=false;
 w.onClose=()=>{ if(!done){done=true;res(null);} };
 async function load(p){ cwd=p; $('.pk-path',w.body).textContent=p;
  const lst=$('.pickerlist',w.body); lst.innerHTML='';
  let list=[]; try{ list=await fs.readdir(p); }catch(e){ toast(e.message,true); return; }
  list.sort((a,b)=>(b.isDir-a.isDir)||natCmp(a.name,b.name));
  list.forEach(ent=>{ if(!ent.isDir&&filter&&!filter(ent.name))return;
   const it=el('div','pickitem',`<span class="fi">${iconForFile(ent.name,ent.isDir)}</span>${esc(ent.name)}`);
   it.onclick=()=>{ const fp=join(p,ent.name);
    if(ent.isDir)load(fp); else{ done=true; WM.close(w); res(fp); } };
   lst.appendChild(it); }); }

/* ================= 表格（CSV / TSV 双视图） ================= */
const TableApp={
 async open(path){ let text='';
  try{ text=await fs.readText(path); }catch(e){ return toast('读取失败：'+e.message,true); }
  const sep=extOf(path)==='tsv'?'\t':',';
  const w=WM.create({title:'表格 — '+basename(path),icon:ICONS.table,width:760,height:500});
  w.body.innerHTML=`<div class="tableapp"><div class="toolrow">
    <button class="abtn primary tb-grid">表格视图</button><button class="abtn tb-text">文本视图</button>
    <button class="abtn tb-save">保存 (Ctrl+S)</button><span style="font-size:11.5px;color:#4a7ea6;margin-left:auto" class="tb-info"></span></div>
   <div class="tv-wrap"></div><textarea style="display:none" spellcheck="false"></textarea></div>`;
  const wrap=$('.tv-wrap',w.body), ta=$('textarea',w.body);
  ta.value=text;
  function parseCSV(str){ const rows=[]; let row=[],cell='',inQ=false;
   for(let i=0;i<str.length;i++){ const c=str[i];
    if(inQ){ if(c==='"'){ if(str[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else if(c==='"')inQ=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell.replace(/\r$/,'')); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
   if(cell!==''||row.length){ row.push(cell.replace(/\r$/,'')); rows.push(row); }
   return rows; }
  function renderGrid(){ const rows=parseCSV(ta.value);
   let html='<table>';
   rows.forEach((r,i)=>{ html+='<tr>'+r.map(c=>`<${i?'td':'th'}>${esc(c)}</${i?'td':'th'}>`).join('')+'</tr>'; });
   wrap.innerHTML=html+'</table>';
   $('.tb-info',w.body).textContent=`${rows.length} 行 × ${Math.max(0,...rows.map(r=>r.length))} 列`; }
  function show(grid){ wrap.style.display=grid?'':'none'; ta.style.display=grid?'none':'';
   $('.tb-grid',w.body).classList.toggle('primary',grid); $('.tb-text',w.body).classList.toggle('primary',!grid);
   if(grid)renderGrid(); }
  $('.tb-grid',w.body).onclick=()=>show(true); $('.tb-text',w.body).onclick=()=>show(false);
  $('.tb-save',w.body).onclick=async()=>{ try{ await fs.writeFile(path,ta.value); toast('已保存'); Explorer.refreshAll(); }catch(e){toast(e.message,true);} };
  w.body.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();$('.tb-save',w.body).click();} });
  renderGrid(); }};

/* ================= 压缩包引擎（zip / gz / tar / tar.gz / 7z） ================= */
const Archive={
 async ask(path){ const items=[
   {label:'解压到当前目录',icon:ICONS.zip,fn:()=>this.extract(path)},
   {label:'以纯文本打开',icon:ICONS.txt,fn:()=>Notepad.open(path)}];
  const ok=await dialog({title:'压缩包：'+basename(path),body:'检测到压缩文件，要解压到当前目录吗？',
   buttons:[{label:'解压',primary:true,v:true},{label:'取消',v:null}]});
  if(ok===true)this.extract(path); },
 async extract(path){ const e=extOf(path), dir=dirname(path);
  const base=basename(path).replace(/\.(zip|gz|tgz|tar|7z|rar|xz|bz2)$/i,'').replace(/\.tar$/i,'');
  try{ toast('正在解压…');
   const buf=await fs.readFile(path);
   const outDir=join(dir,await fs.uniqueName(dir,base));
   await fs.mkdir(outDir);
   if(e==='zip'){ if(!window.JSZip)throw new Error('JSZip 未加载');
    const zip=await JSZip.loadAsync(buf); const tasks=[];
    zip.forEach((rel,f)=>tasks.push((async()=>{ const clean=norm(rel.replace(/\\/g,'/'));
     if(f.dir){ let acc=''; for(const pt of join(outDir,clean).split('/').filter(Boolean)){ acc+='/'+pt; try{ await fs.mkdir(acc); }catch(err){} } }
     else{ const pd=dirname(join(outDir,clean));
      const parts=pd.split('/').filter(Boolean); let acc='';
      for(const pt of parts){ acc+='/'+pt; try{ await fs.mkdir(acc); }catch(err){} }
      await fs.writeFile(join(outDir,clean),await f.async('arraybuffer')); } })()));
    await Promise.all(tasks); }
   else if(e==='gz'&&!/\.tar\.gz$/i.test(path)){ const out=await this.gunzip(buf);
    await fs.writeFile(join(outDir,base||'解压文件'),out); }
   else if(e==='tar'){ await this.untar(buf,outDir); }
   else if(e==='tgz'||/\.tar\.gz$/i.test(path)){ await this.untar(await this.gunzip(buf),outDir); }
   else if(e==='7z'||e==='rar'||e==='xz'||e==='bz2'){ await this.via7z(path,buf,outDir); }
   else throw new Error('不支持的格式');
   toast('解压完成：'+basename(outDir)); Desktop.refresh(); Explorer.refreshAll();
  }catch(err){ toast('解压失败：'+err.message,true); } },
 async gunzip(buf){ if(!window.DecompressionStream)throw new Error('浏览器不支持 gzip 解压');
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([buf]).stream().pipeThrough(ds);
  return await new Response(stream).arrayBuffer(); },
 async untar(buf,outDir){ const u8=new Uint8Array(buf); let off=0; const td=new TextDecoder();
  const rd=(s,l)=>td.decode(u8.subarray(s,s+l)).replace(/\0.*$/,'').trim();
  while(off+512<=u8.length){ const name=rd(off,100); if(!name)break;
   const size=parseInt(rd(off+124,12),8)||0; const type=String.fromCharCode(u8[off+156]);
   const prefix=rd(off+345,155);
   const full=norm((prefix?prefix+'/':'')+name);
   if(type==='5'||name.endsWith('/')){ let acc=''; for(const pt of join(outDir,full).split('/').filter(Boolean)){ acc+='/'+pt; try{ await fs.mkdir(acc); }catch(e){} } }
   else if(type==='0'||type==='\0'||type===''){ const pd=dirname(join(outDir,full));
    let acc=''; for(const pt of pd.split('/').filter(Boolean)){ acc+='/'+pt; try{ await fs.mkdir(acc); }catch(e){} }
    await fs.writeFile(join(outDir,full),u8.slice(off+512,off+512+size).buffer); }
   off+=512+Math.ceil(size/512)*512; } },
 async via7z(path,buf,outDir){ if(!window.SevenZipFactory)throw new Error('7z 引擎未加载（需网络）');
  const sz=await SevenZipFactory({print:()=>{}});
  const name=basename(path);
  sz.FS.writeFile(name,new Uint8Array(buf));
  sz.FS.mkdir('/out');
  sz.callMain(['x',name,'-o/out','-y']);
  const walk=async(vp,rp)=>{ for(const n of sz.FS.readdir(vp)){ if(n==='.'||n==='..')continue;
   const fp=vp+'/'+n; const stx=sz.FS.stat(fp);
   if(sz.FS.isDir(stx.mode)){ await fs.mkdir(join(rp,n)); await walk(fp,join(rp,n)); }
   else{ const data=sz.FS.readFile(fp); await fs.writeFile(join(rp,n),data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength)); } } };
  await walk('/out',outDir); }};

   $('.st-sel',R).textContent=sel?`已选 ${sel.length} 字符`:'';
   $('.st-lines',R).textContent=`${cm.lineCount()} 行`;
   $('.st-chars',R).textContent=`${v.length} 字符`;
   $('.st-lang',R).textContent=MODE2NAME[modeSel.value]||modeSel.value; }
  cm.on('cursorActivity',updStatus);
  /* ------ 实时预览 ------ */
  let pt=null, blobU=null;
  function buildDoc(){ const v=cm.getValue(), m=modeSel.value;
   if(m==='css')return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${v}</style></head><body><h2 style="font-family:sans-serif">CSS 预览</h2><p>段落示例 <a href="#">链接</a> <button>按钮</button></p><div class="box demo">.box.demo</div></body></html>`;
   if(m==='javascript')return `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:monospace;padding:10px"><h3>控制台输出</h3><pre id="o"></pre><script>const o=document.getElementById('o');const log=(...a)=>o.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' ')+'\\n';console.log=log;console.error=(...a)=>{o.innerHTML+='<span style="color:red">'+a.join(' ')+'</span>\\n'};try{\n${v}\n}catch(e){console.error(e.message)}<\/script></body></html>`;
   if(m==='markdown')return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:sans-serif;max-width:760px;margin:20px auto;padding:0 16px;line-height:1.7}code{background:#eef;padding:2px 5px;border-radius:4px}pre{background:#182430;color:#cde;padding:12px;border-radius:8px;overflow:auto}blockquote{border-left:4px solid #8cf;margin:0;padding:4px 14px;color:#468}</style></head><body>${mdToHtml(v)}</body></html>`;
   if(m==='application/json'){ let out; try{ out='<pre style="font-family:monospace;padding:14px">'+esc(JSON.stringify(JSON.parse(v||'null'),null,2))+'</pre><p style="color:green;font-family:sans-serif;padding:0 14px">✓ JSON 合法</p>'; }catch(e){ out='<p style="color:#c22;font-family:sans-serif;padding:14px">JSON 解析错误: '+esc(e.message)+'</p>'; } return `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${out}</body></html>`; }
   return v; }
  function refresh(){ const doc=buildDoc();
   try{ const d=ifr.contentDocument; d.open(); d.write(doc); d.close(); }
   catch(e){ if(blobU)URL.revokeObjectURL(blobU);
    blobU=URL.createObjectURL(new Blob([doc],{type:'text/html'})); ifr.src=blobU; } }
  cm.on('change',()=>{ clearTimeout(pt); pt=setTimeout(refresh,600); updStatus(); if(fb.classList.contains('show'))doSearch(); });
  /* ------ Markdown 迷你渲染（预览用） ------ */
  function mdToHtml(md){ let h=esc(md);
   h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c+'</code></pre>');
   h=h.replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^##### (.*)$/gm,'<h5>$1</h5>').replace(/^#### (.*)$/gm,'<h4>$1</h4>')
    .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
   h=h.replace(/^\> (.*)$/gm,'<blockquote>$1</blockquote>');
   h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
   h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
   h=h.replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
   h=h.replace(/\n{2,}/g,'<br><br>');

   try{ if(m==='htmlmixed'||m==='xml')out=html_beautify(v,{...optf,indent_inner_html:true,wrap_line_length:120});
    else if(m==='css')out=css_beautify(v,optf);
    else if(m==='javascript'||m==='application/json')out=js_beautify(v,optf);
    else if(m==='markdown'){ toast('Markdown 无需格式化'); return; } }
   catch(e){ return toast('格式化失败：'+e.message,true); }
   cm.setValue(out); cm.setCursor(c); cm.focus(); toast('已格式化'); }
  /* ------ 折叠 ------ */
  $('.he-foldall',R).onclick=()=>{ for(let i=0;i<cm.lineCount();i++)cm.foldCode(CodeMirror.Pos(i,0),null,'fold'); };
  $('.he-unfold',R).onclick=()=>{ for(let i=0;i<cm.lineCount();i++)cm.foldCode(CodeMirror.Pos(i,0),null,'unfold'); };
  /* ------ 查找 / 替换 ------ */
  const fb=$('.findbar',R), fIn=$('.fb-find',R), fRep=$('.fb-rep',R), fCount=$('.fcount',R);
  const fOpts={cs:false,word:false,re:false};
  let marks=[], matches=[], curM=-1;
  function openFind(rep){ fb.classList.add('show');

  function closeFind(){ fb.classList.remove('show'); clearMarks(); cm.focus(); }
  function clearMarks(){ marks.forEach(m=>m.clear()); marks=[]; matches=[]; curM=-1; fCount.textContent='0/0'; }
  function buildQuery(){ let q=fIn.value; if(!q)return null;
   if(fOpts.re){ try{ return new RegExp(q,fOpts.cs?'g':'gi'); }catch(e){ fCount.textContent='无效正则'; return undefined; } }
   if(fOpts.word)return new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b',fOpts.cs?'g':'gi');
   return q; }
  function doSearch(keepCur){ clearMarks(); const q=buildQuery(); if(q==null||q===undefined)return;
   const cur=cm.getSearchCursor(q,CodeMirror.Pos(0,0),{caseFold:!fOpts.cs});
   while(cur.findNext()){ matches.push({from:cur.from(),to:cur.to()});
    if(matches.length>5000)break; }
   matches.forEach(m=>marks.push(cm.markText(m.from,m.to,{className:'cm-matchhighlight-x'})));
   if(matches.length){ if(!keepCur||curM<0||curM>=matches.length)curM=0; setCur(curM,!keepCur); }
   updCount(); }
  function updCount(){ fCount.textContent=matches.length?`${curM+1}/${matches.length}`:'0/0'; }
  function setCur(i,scroll=true){ if(!matches.length)return; curM=(i+matches.length)%matches.length;
   marks.forEach((m,j)=>{ m.clear(); marks[j]=cm.markText(matches[j].from,matches[j].to,{className:j===curM?'cm-matchcurrent-x':'cm-matchhighlight-x'}); });
   const m=matches[curM]; if(scroll){ cm.setSelection(m.from,m.to); cm.scrollIntoView({from:m.from,to:m.to},60); } updCount(); }
  function findNext(dir){ if(!matches.length)doSearch(); if(matches.length)setCur(curM+dir); }

  $('.fb-close',R).onclick=closeFind;

  modeSel.onchange=()=>{ cm.setOption('mode',modeSel.value); updStatus(); refresh(); };

  $('.he-clear',R).onclick=()=>{ cm.setValue(''); cm.focus(); };
  $('.he-import',R).onclick=()=>{ const inp=$('#hiddenFile'); inp.onchange=async()=>{ const f=inp.files[0]; inp.value='';
   if(!f)return; cm.setValue(await f.text());

   savePath=null; saveDir='/Desktop'; WM.setTitle(w,'HTML编辑器 — '+f.name); updStatus(); refresh(); }; inp.click(); };
  $('.he-export',R).onclick=()=>{ const ext=MODE2EXT[modeSel.value]||'.txt';

   setTimeout(()=>URL.revokeObjectURL(a.href),5000); };
  $('.he-newwin',R).onclick=()=>{ const u=URL.createObjectURL(new Blob([buildDoc()],{type:'text/html'}));

  async function save(){ let target=savePath;

    <button class="abtn vm-pick" style="background:linear-gradient(180deg,#4d5a64,#39434b);color:#cfe8f7;border-color:#5a6a75">选择系统镜像 (VFS)</button>
    <button class="abtn vm-local" style="background:linear-gradient(180deg,#4d5a64,#39434b);color:#cfe8f7;border-color:#5a6a75">本机镜像文件</button>
    <button class="abtn vm-stop" style="background:linear-gradient(180deg,#7a4a44,#5c332e);color:#f7d8d3;border-color:#8a5a54">停止</button>
    <span class="vm-info" style="color:#7da4c0;font-size:12px;flex:1">支持 .iso / .img 镜像（FreeDOS、KolibriOS、Linux 等小型系统）</span></div>
   <div id="screen_container"><div style="white-space:pre;font:14px monospace"></div><canvas style="display:none"></canvas></div></div>`;
  w.onClose=()=>{ this.stop(); this.win=null; };
  $('.vm-pick',w.body).onclick=async()=>{ const p=await pickFile({title:'选择镜像文件',
   filter:n=>['iso','img','bin','fda'].includes(extOf(n)),start:'/'}); if(p)this.boot(p); };
  $('.vm-local',w.body).onclick=()=>{ const inp=$('#hiddenFile'); inp.onchange=async()=>{ const f=inp.files[0]; inp.value='';
   if(f)this.bootBuffer(await f.arrayBuffer(),f.name); }; inp.click(); };
  $('.vm-stop',w.body).onclick=()=>this.stop();
  if(imagePath)this.boot(imagePath); },
 async boot(path){ try{ $('.vm-info',this.win.body).textContent='正在读取镜像…';
   const buf=await fs.readFile(path); this.bootBuffer(buf,basename(path));
  }catch(e){ toast('镜像读取失败：'+e.message,true); } },
 async bootBuffer(buf,name){ try{
   if(!window.V86&&!window.V86Starter){ $('.vm-info',this.win.body).textContent='正在加载 v86 引擎…';
    await loadScript('https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js'); }
   const Ctor=window.V86||window.V86Starter; if(!Ctor)throw new Error('v86 引擎不可用');
   this.stop();
   const e=extOf(name);
   const cfg={ wasm_path:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
    memory_size:64*1024*1024, vga_memory_size:8*1024*1024,
    screen_container:$('#screen_container',this.win.body),
    bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
    vga_bios:{url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
    autostart:true };
   if(e==='iso'){ cfg.cdrom={buffer:buf}; cfg.boot_order=0x213; }
   else if(e==='img'||e==='fda'||e==='bin'){ cfg.fda={buffer:buf}; cfg.boot_order=0x321; }
   else{ cfg.hda={buffer:buf}; cfg.boot_order=0x132; }
   this.emu=new Ctor(cfg);
   $('.vm-info',this.win.body).textContent='运行中：'+name+'（点击屏幕捕获键盘）';
   toast('虚拟机已启动：'+name);
  }catch(e2){ toast('虚拟机启动失败：'+e2.message,true); } },
 stop(){ if(this.emu){ try{ this.emu.destroy(); }catch(e){} this.emu=null;
  if(this.win)$('.vm-info',this.win.body).textContent='已停止'; } }};

/* ================= 系统启动 ================= */
const WELCOME_TXT=`欢迎使用 AeroOS！
━━━━━━━━━━━━━━━━━━━━━━
这是一个完全运行在浏览器里的桌面操作系统。

· 所有文件保存在 OPFS（浏览器原生私有文件系统），刷新不丢失
· 把电脑上的文件直接拖到桌面即可导入；把图标拖出浏览器即可导出
· 右键桌面：新建文件夹 / 上传文件 / 更换壁纸 / 全屏
· 文件管理器可挂载真实本地文件夹（挂载到 /mnt/local）
· 双击 .html 文件可以预览网页或编辑源码
· 图片文件会以"条漫模式"连续阅读同目录所有图片
· 支持 zip / gz / tar / 7z 解压，csv 表格，PDF、音视频播放
· "虚拟机"应用可以引导 .iso/.img 小型系统镜像 (v86)

祝使用愉快！`;
const DEMO_CSV=`名称,类别,数量,单价
苹果,水果,12,3.5
牛奶,饮品,6,8.9
面包,主食,3,12.0
咖啡豆,饮品,2,58.0`;
async function ensureBaseDirs(){ for(const d of ['/Desktop','/Documents','/Pictures','/Music','/Videos','/Downloads','/System']){
  try{ await fs.mkdir(d); }catch(e){} } }
async function firstRun(){ try{ if(await fs.exists('/System/.initialized'))return;
  await fs.writeFile('/Desktop/欢迎使用.txt',WELCOME_TXT);
  await fs.writeFile('/Desktop/示例页面.html',DEFAULT_HTML);
  await fs.writeFile('/Documents/购物清单.csv',DEMO_CSV);
  await fs.writeFile('/System/.initialized','1');
 }catch(e){} }
async function boot(){
 await IDB.open();
 await fs.init();
 if(fs.mode==='memory')toast('OPFS 不可用，已降级为内存文件系统（不持久）',true);
 await ensureBaseDirs(); await firstRun();
 await applyWallpaper(Cfg.get('wallpaper','aurora'));
 initStartMenu(); Desktop.init(); await Desktop.refresh();
 // 阻止浏览器默认拖放导航
 addEventListener('dragover',e=>e.preventDefault());
 addEventListener('drop',e=>e.preventDefault());
 // 键盘：Delete 删除桌面选中项
 addEventListener('keydown',async e=>{ if(e.key==='Delete'&&Desktop.sel.size&&!e.target.closest('.window')&&!e.target.closest('.modal')){
  const ps=Desktop.selPaths();
  if(await aeroConfirm('删除确认',`确定删除选中的 ${ps.length} 项吗？`)){
   for(const p of ps){ try{ await fs.delete(p); }catch(err){} } Desktop.refresh(); Explorer.refreshAll(); } } });
 let rzT; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>Desktop.refresh(),300); });
 // 提示重新挂载上次的本地文件夹
 const prev=Cfg.get('mounts',[]);
 if(prev.length&&window.showDirectoryPicker){
  const ok=await dialog({title:'恢复本地挂载',body:`上次会话挂载过本地文件夹：<b>${prev.map(esc).join('、')}</b><br>浏览器安全策略要求重新授权，现在重新挂载吗？`,
   buttons:[{label:'重新挂载',primary:true,v:true},{label:'跳过',v:false}]});
  if(ok===true){ for(let i=0;i<prev.length;i++)await Explorer.mountLocal(); } }
}
boot();

</script>
