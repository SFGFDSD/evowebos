    /* =========================================================================
       11. 桌面环境 (DesktopManager) — 自由摆放、网格对齐、原生拖拽、触摸拖拽、框选
       ========================================================================= */
    const DesktopManager = {
      selectedPaths: new Set(),
      dragStartOffset: { x: 24, y: 24 },

      init() {
        this.container = document.getElementById('desktop-icons-container');
        this.desktopArea = document.getElementById('desktop-area');
        this.marqueeEl = document.getElementById('desktop-marquee');

        this._bindDesktopAreaEvents();
        window.fs.onChange((changedPath) => {
          if (changedPath === '/Desktop' || changedPath === '/') {
            this.render();
          }
        });
        this.render();
      },

      _getGridSlotPosition(index) {
        const colHeight = Math.max(320, window.innerHeight - 80);
        const cellW = 98;
        const cellH = 96;
        const maxRows = Math.max(1, Math.floor((colHeight - 24) / cellH));
        const col = Math.floor(index / maxRows);
        const row = index % maxRows;
        return {
          x: 16 + col * cellW,
          y: 16 + row * cellH
        };
      },

      _snapCoord(x, y) {
        if (!SysConfig.state.gridSnap) {
          return {
            x: Math.max(8, Math.min(window.innerWidth - 92, Math.round(x))),
            y: Math.max(8, Math.min(window.innerHeight - 140, Math.round(y)))
          };
        }
        const cellW = 98;
        const cellH = 96;
        const col = Math.max(0, Math.round((x - 16) / cellW));
        const row = Math.max(0, Math.round((y - 16) / cellH));
        return {
          x: 16 + col * cellW,
          y: 16 + row * cellH
        };
      },

      async autoArrangeIcons() {
        const names = await window.fs.readdir('/Desktop');
        const total = names.length + SYSTEM_DESKTOP_SHORTCUTS.length;
        let idx = 0;
        for (const sc of SYSTEM_DESKTOP_SHORTCUTS) {
          SysConfig.state.desktopPositions[sc.key] = this._getGridSlotPosition(idx++);
        }
        for (const name of names) {
          const fullPath = window.fs.join('/Desktop', name);
          SysConfig.state.desktopPositions[fullPath] = this._getGridSlotPosition(idx++);
        }
        SysConfig.save();
        this.render();
      },

      async render() {
        if (!this.container) return;
        let names = [];
        try {
          names = await window.fs.readdir('/Desktop');
        } catch (e) {}

        this.container.innerHTML = '';
        let slotIdx = 0;

        // 1. 渲染系统核心工作站快捷图标 (同样支持自由摆放)
        for (const sc of SYSTEM_DESKTOP_SHORTCUTS) {
          let pos = SysConfig.state.desktopPositions[sc.key];
          if (!pos) {
            pos = this._getGridSlotPosition(slotIdx);
            SysConfig.state.desktopPositions[sc.key] = pos;
          }
          slotIdx++;
          const el = this._createIconElement({
            key: sc.key,
            label: sc.label,
            svg: sc.icon,
            isShortcut: true,
            onOpen: sc.action,
            pos
          });
          this.container.appendChild(el);
        }

        // 2. 渲染 OPFS /Desktop 下的所有真实文件和文件夹
        for (const name of names) {
          const fullPath = window.fs.join('/Desktop', name);
          let st;
          try {
            st = await window.fs.stat(fullPath);
          } catch (e) {
            continue;
          }
          let pos = SysConfig.state.desktopPositions[fullPath];
          if (!pos) {
            pos = this._getGridSlotPosition(slotIdx);
            SysConfig.state.desktopPositions[fullPath] = pos;
          }
          slotIdx++;

          const el = this._createIconElement({
            key: fullPath,
            path: fullPath,
            label: name,
            isDir: st.isDirectory(),
            svg: getFileIconSvg(name, st.isDirectory(), fullPath),
            isShortcut: false,
            onOpen: () => openVFSPath(fullPath),
            pos
          });
          this.container.appendChild(el);
        }
      },

      _createIconElement(item) {
        const el = document.createElement('div');
        el.className = `desktop-icon ${this.selectedPaths.has(item.key) ? 'selected' : ''}`;
        el.dataset.key = item.key;
        if (item.path) el.dataset.path = item.path;
        el.dataset.isdir = item.isDir ? '1' : '0';
        el.style.left = `${item.pos.x}px`;
        el.style.top = `${item.pos.y}px`;

        // 严格遵循 3.3：设置原生 draggable="true"
        el.setAttribute('draggable', 'true');

        el.innerHTML = `
          <div class="icon-glyph">${item.svg}</div>
          <div class="icon-label">${escapeHtml(item.label)}</div>
        `;

        // mouseenter / mousedown 时异步预加载文件到同步 Map 缓存，确保 dragstart 100% 同步读取
        if (item.path && !item.isDir) {
          el.addEventListener('mouseenter', () => preloadFileForDrag(item.path));
          el.addEventListener('mousedown', () => preloadFileForDrag(item.path));
        }

        // 点击与单击打开逻辑
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (e.ctrlKey || e.metaKey) {
            if (this.selectedPaths.has(item.key)) this.selectedPaths.delete(item.key);
            else this.selectedPaths.add(item.key);
            this._syncSelectionStyles();
            return;
          }
          this.selectedPaths.clear();
          this.selectedPaths.add(item.key);
          this._syncSelectionStyles();

          if (SysConfig.state.singleClickDesktop) {
            item.onOpen();
          }
        });

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (!SysConfig.state.singleClickDesktop) {
            item.onOpen();
          }
        });

        // 右键菜单
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!this.selectedPaths.has(item.key)) {
            this.selectedPaths.clear();
            this.selectedPaths.add(item.key);
            this._syncSelectionStyles();
          }
          this._showIconContextMenu(e.clientX, e.clientY, item);
        });

        // HTML5 原生 Drag & Drop (严禁 async/await)
        el.addEventListener('dragstart', (e) => {
          const rect = el.getBoundingClientRect();
          this.dragStartOffset = {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
          };
          el.classList.add('dragging-now');

          const payload = {
            key: item.key,
            path: item.path || null,
            isDir: !!item.isDir,
            isShortcut: !!item.isShortcut,
            offsetX: this.dragStartOffset.x,
            offsetY: this.dragStartOffset.y
          };
          e.dataTransfer.effectAllowed = 'copyMove';
          e.dataTransfer.setData('application/x-webos-item', JSON.stringify(payload));

          // 如果是真实文件，同步从 fileDragCache 读取并注入 items.add(file) + 三段式 DownloadURL
          if (item.path && !item.isDir) {
            const cached = fileDragCache.get(item.path);
            if (cached && cached.file && cached.blobUrl) {
              try {
                e.dataTransfer.items.add(cached.file);
              } catch (err) {}
              try {
                e.dataTransfer.setData('DownloadURL', `${cached.mime}:${cached.filename}:${cached.blobUrl}`);
              } catch (err) {}
            }
          }
        });

        el.addEventListener('dragend', () => {
          el.classList.remove('dragging-now');
          // 规则 7：Blob URL 在 dragend 后延迟至少 5 秒再 revokeObjectURL
          if (item.path && fileDragCache.has(item.path)) {
            const cached = fileDragCache.get(item.path);
            if (cached && cached.blobUrl) {
              const oldUrl = cached.blobUrl;
              setTimeout(() => {
                URL.revokeObjectURL(oldUrl);
                preloadFileForDrag(item.path);
              }, 5500);
            }
          }
        });

        // 如果当前图标是文件夹，支持把其他文件/图标拖入该文件夹图标内
        if (item.isDir && item.path) {
          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.add('drop-target');
          });
          el.addEventListener('dragleave', () => {
            el.classList.remove('drop-target');
          });
          el.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.remove('drop-target');
            const raw = e.dataTransfer.getData('application/x-webos-item');
            if (raw) {
              try {
                const data = JSON.parse(raw);
                if (data.path && data.path !== item.path) {
                  const dest = window.fs.join(item.path, window.fs.basename(data.path));
                  await window.fs.rename(data.path, dest);
                  showToast(`已移动至 ${item.label}`, 'success');
                }
              } catch (err) {
                showToast(`移动失败: ${err.message}`, 'error');
              }
            } else {
              await handleExternalDataTransferDrop(e.dataTransfer, item.path);
            }
          });
        }

        // 移动端触摸拖拽适配 (touchstart / touchmove / touchend)
        let touchMoved = false;
        let touchStartX = 0, touchStartY = 0;
        let origX = 0, origY = 0;

        el.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          const t = e.touches[0];
          touchMoved = false;
          touchStartX = t.clientX;
          touchStartY = t.clientY;
          origX = el.offsetLeft;
          origY = el.offsetTop;
        }, { passive: true });

        el.addEventListener('touchmove', (e) => {
          if (e.touches.length !== 1) return;
          const t = e.touches[0];
          const dx = t.clientX - touchStartX;
          const dy = t.clientY - touchStartY;
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
            touchMoved = true;
            el.classList.add('dragging-now');
            const next = this._snapCoord(origX + dx, origY + dy);
            el.style.left = `${next.x}px`;
            el.style.top = `${next.y}px`;
          }
        }, { passive: true });

        el.addEventListener('touchend', () => {
          if (touchMoved) {
            el.classList.remove('dragging-now');
            SysConfig.state.desktopPositions[item.key] = {
              x: el.offsetLeft,
              y: el.offsetTop
            };
            SysConfig.save();
          }
        });

        return el;
      },

      _syncSelectionStyles() {
        this.container.querySelectorAll('.desktop-icon').forEach(iconEl => {
          iconEl.classList.toggle('selected', this.selectedPaths.has(iconEl.dataset.key));
        });
      },

      _bindDesktopAreaEvents() {
        // 桌面监听 dragover + drop (支持内部移动图标坐标 & 外部物理文件拖入)
        this.desktopArea.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        this.desktopArea.addEventListener('drop', async (e) => {
          e.preventDefault();
          const desktopRect = this.desktopArea.getBoundingClientRect();
          const rawInternal = e.dataTransfer.getData('application/x-webos-item');

          if (rawInternal) {
            try {
              const payload = JSON.parse(rawInternal);
              const targetX = e.clientX - desktopRect.left - (payload.offsetX || 32);
              const targetY = e.clientY - desktopRect.top - (payload.offsetY || 32);
              const snapped = this._snapCoord(targetX, targetY);

              // 如果是从其他文件夹窗口拖到桌面的文件 -> 移动到 /Desktop
              if (payload.path && window.fs.dirname(payload.path) !== '/Desktop') {
                const newPath = window.fs.join('/Desktop', window.fs.basename(payload.path));
                SysConfig.state.desktopPositions[newPath] = snapped;
                SysConfig.save();
                await window.fs.rename(payload.path, newPath);
                showToast(`已移动到桌面: ${window.fs.basename(newPath)}`, 'success');
              } else {
                // 桌面内部自由移动位置
                SysConfig.state.desktopPositions[payload.key] = snapped;
                SysConfig.save();
                const iconEl = this.container.querySelector(`.desktop-icon[data-key="${CSS.escape(payload.key)}"]`);
                if (iconEl) {
                  iconEl.style.left = `${snapped.x}px`;
                  iconEl.style.top = `${snapped.y}px`;
                }
              }
            } catch (err) {}
            return;
          }

          // 外部物理桌面拖入到虚拟桌面
          const dropPos = {
            x: e.clientX - desktopRect.left - 30,
            y: e.clientY - desktopRect.top - 30
          };
          await handleExternalDataTransferDrop(e.dataTransfer, '/Desktop', dropPos);
        });

        // 桌面空白处框选 (Marquee Selection)
        let marqueeActive = false;
        let mStartX = 0, mStartY = 0;

        this.desktopArea.addEventListener('pointerdown', (e) => {
          if (e.target !== this.desktopArea && e.target !== this.container) return;
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          ContextMenu.hide();
          document.getElementById('start-menu').classList.add('hidden');
          document.getElementById('calendar-flyout').classList.add('hidden');

          if (!e.ctrlKey && !e.metaKey) {
            this.selectedPaths.clear();
            this._syncSelectionStyles();
          }

          marqueeActive = true;
          const rect = this.desktopArea.getBoundingClientRect();
          mStartX = e.clientX - rect.left;
          mStartY = e.clientY - rect.top;
          this.marqueeEl.style.left = `${mStartX}px`;
          this.marqueeEl.style.top = `${mStartY}px`;
          this.marqueeEl.style.width = '0px';
          this.marqueeEl.style.height = '0px';
          this.marqueeEl.style.display = 'block';
        });

        window.addEventListener('pointermove', (e) => {
          if (!marqueeActive) return;
          const rect = this.desktopArea.getBoundingClientRect();
          const curX = e.clientX - rect.left;
          const curY = e.clientY - rect.top;
          const left = Math.min(mStartX, curX);
          const top = Math.min(mStartY, curY);
          const width = Math.abs(curX - mStartX);
          const height = Math.abs(curY - mStartY);

          this.marqueeEl.style.left = `${left}px`;
          this.marqueeEl.style.top = `${top}px`;
          this.marqueeEl.style.width = `${width}px`;
          this.marqueeEl.style.height = `${height}px`;

          this.container.querySelectorAll('.desktop-icon').forEach(iconEl => {
            const iLeft = iconEl.offsetLeft;
            const iTop = iconEl.offsetTop;
            const iRight = iLeft + iconEl.offsetWidth;
            const iBottom = iTop + iconEl.offsetHeight;
            const hit = !(iRight < left || iLeft > left + width || iBottom < top || iTop > top + height);
            if (hit) this.selectedPaths.add(iconEl.dataset.key);
            else if (!e.ctrlKey) this.selectedPaths.delete(iconEl.dataset.key);
          });
          this._syncSelectionStyles();
        });

        window.addEventListener('pointerup', () => {
          if (marqueeActive) {
            marqueeActive = false;
            this.marqueeEl.style.display = 'none';
          }
        });

        // 桌面空白处右键菜单

          ContextMenu.show(e.clientX, e.clientY, [

                SysConfig.save();

              }
            },

                if (name) {
                  const full = window.fs.join('/Desktop', name.endsWith('.html') ? name : name + '.html');
                  await window.fs.writeFile(full, '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <title>New Page</title>\n</head>\n<body>\n  <h1>Hello KRONOS</h1>\n</body>\n</html>');
                  openHtmlEditorApp(full);
                }

              action: async () => {

                if (name) {

        });
      },

      _showIconContextMenu(x, y, item) {
        if (item.isShortcut) {
          ContextMenu.show(x, y, [
            { label: `启动 ${item.label}`, action: () => item.onOpen() },
            { label: '重置图标位置', action: () => this.autoArrangeIcons() }
          ]);
          return;
        }

        const ext = getExt(item.label);
        const menu = [
          { label: '打开', action: () => openVFSPath(item.path) }
        ];

        if (!item.isDir) {
          if (ext === 'html' || ext === 'htm') {
            menu.push(
              { label: '在系统浏览器中打开', action: () => openWebBrowserApp(item.path) },
              { label: '编辑源代码 (HTML编辑器)', action: () => openHtmlEditorApp(item.path) }
            );
          } else {
            menu.push(
              { label: '打开方式：代码编辑器 (HTML编辑器)', action: () => openHtmlEditorApp(item.path) },
              { label: '打开方式：记事本 (纯文本)', action: () => openNotepadApp(item.path) }
            );
          }
          if (IMAGE_EXTS.has(ext)) {
            menu.push({ label: '打开方式：漫画阅读器 (条漫流)', action: () => openMangaViewerApp(item.path) });
          }
          if (TABLE_EXTS.has(ext)) {
            menu.push({ label: '打开方式：双视图表格', action: () => openTableApp(item.path) });
          }
          if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') {
            menu.push({ label: '解压到当前文件夹', action: () => extractArchiveInVFS(item.path) });
          }
        }

        menu.push(
          { separator: true },
          {
            label: '导出 / 下载到本地物理设备',
            action: () => exportVFSItemToLocal(item.path)
          },
          {
            label: '复制',
            shortcut: 'Ctrl+C',
            action: () => {
              clipboardVFS = { mode: 'copy', paths: [item.path] };
              showToast(`已复制: ${item.label}`);
            }
          },
          {
            label: '剪切',
            shortcut: 'Ctrl+X',
            action: () => {
              clipboardVFS = { mode: 'cut', paths: [item.path] };
              showToast(`已剪切: ${item.label}`);
            }
          },
          {
            label: '重命名',
            shortcut: 'F2',
            action: async () => {
              const newName = prompt('重命名文件/文件夹:', item.label);
              if (newName && newName.trim() && newName.trim() !== item.label) {
                const newPath = window.fs.join(window.fs.dirname(item.path), newName.trim());
                if (SysConfig.state.desktopPositions[item.path]) {
                  SysConfig.state.desktopPositions[newPath] = SysConfig.state.desktopPositions[item.path];
                  delete SysConfig.state.desktopPositions[item.path];
                  SysConfig.save();
                }
                await window.fs.rename(item.path, newPath);
                showToast(`已重命名为 ${newName.trim()}`, 'success');
              }

          },
          { separator: true },
          {
            label: '删除',

            danger: true,
            action: async () => {

              showToast(`已删除 ${item.label}`);

        ContextMenu.show(x, y, menu);

    async function pasteClipboardToDir(targetDir) {
      if (!clipboardVFS.paths || clipboardVFS.paths.length === 0) {
        showToast('剪贴板为空');
        return;
      }
      for (const srcPath of clipboardVFS.paths) {
        try {
          const base = window.fs.basename(srcPath);
          let destPath = window.fs.join(targetDir, base);
          if (destPath === srcPath && clipboardVFS.mode === 'copy') {
            destPath = window.fs.join(targetDir, '副本_' + base);
          }
          if (clipboardVFS.mode === 'cut') {
            await window.fs.rename(srcPath, destPath);
          } else {
            await window.fs.copyFile(srcPath, destPath);
          }
        } catch (err) {
          showToast(`粘贴失败: ${err.message}`, 'error');
        }
      }
      if (clipboardVFS.mode === 'cut') {
        clipboardVFS = { mode: null, paths: [] };
      }
      window.fs.emitChange(targetDir);
      showToast('粘贴操作完成', 'success');
    }

    let currentUploadTargetDir = '/Desktop';
    function triggerGlobalFileUpload(targetDir = '/Desktop') {
      currentUploadTargetDir = targetDir;
      const input = document.getElementById('global-file-input');
      input.value = '';
      input.click();
    }

    document.getElementById('global-file-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      for (const file of files) {
        const buf = await file.arrayBuffer();
        const dest = window.fs.join(currentUploadTargetDir, file.name);
        await window.fs.writeFile(dest, buf);
      }
      showToast(`已导入 ${files.length} 个文件至 ${currentUploadTargetDir}`, 'success');
    });

    document.getElementById('wallpaper-file-input').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const buf = await file.arrayBuffer();
        const ext = getExt(file.name) || 'jpg';
        const savePath = `/System/Wallpapers/custom_wallpaper_${Date.now()}.${ext}`;
        await window.fs.writeFile(savePath, buf);
        SysConfig.state.customWallpaperPath = savePath;
        SysConfig.save();
        await applyWallpaper();
        showToast('已将壁纸持久化保存至 OPFS 并设为桌面背景', 'success');
      } catch (err) {
        showToast(`壁纸上传失败: ${err.message}`, 'error');
      }
    });

    /* =========================================================================
       12. 12/24小时制时钟与可翻页日历组件 (Calendar & Clock)
       ========================================================================= */
    const ClockCalendar = {
      viewYear: new Date().getFullYear(),
      viewMonth: new Date().getMonth(),

      init() {
        this.updateClock();
        setInterval(() => this.updateClock(), 1000);

        const clockBtn = document.getElementById('taskbar-clock');
        const flyout = document.getElementById('calendar-flyout');

        clockBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('start-menu').classList.add('hidden');
          flyout.classList.toggle('hidden');
          if (!flyout.classList.contains('hidden')) {
            this.renderCalendarGrid();
          }
        });

        flyout.addEventListener('click', (e) => e.stopPropagation());

        document.getElementById('cal-prev-month').addEventListener('click', () => {
          this.viewMonth--;
          if (this.viewMonth < 0) {
            this.viewMonth = 11;
            this.viewYear--;
          }
          this.renderCalendarGrid();
        });

        document.getElementById('cal-next-month').addEventListener('click', () => {
          this.viewMonth++;
          if (this.viewMonth > 11) {
            this.viewMonth = 0;
            this.viewYear++;
          }
          this.renderCalendarGrid();
        });

        document.getElementById('cal-today-btn').addEventListener('click', () => {
          const now = new Date();
          this.viewYear = now.getFullYear();
          this.viewMonth = now.getMonth();
          this.renderCalendarGrid();
        });

        document.getElementById('cal-toggle-12h').addEventListener('click', () => {
          SysConfig.state.use12Hour = !SysConfig.state.use12Hour;
          SysConfig.save();
          this.updateClock();
          showToast(`已切换为 ${SysConfig.state.use12Hour ? '12 小时制' : '24 小时制'}`);
        });
      },

      updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        let hours = now.getHours();
        let prefix = '';
        if (SysConfig.state.use12Hour) {
          prefix = hours >= 12 ? '下午 ' : '上午 ';
          hours = hours % 12 || 12;
        }
        const timeStr = `${prefix}${pad(hours)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dateStr = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())}`;

        document.getElementById('clock-time').textContent = timeStr;
        document.getElementById('clock-date').textContent = dateStr;

        const calClock = document.getElementById('cal-digital-clock');
        const calDate = document.getElementById('cal-full-date');
        if (calClock) calClock.textContent = timeStr;
        if (calDate) {
          const weekNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
          calDate.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · ${weekNames[now.getDay()]}`;
        }
      },

      renderCalendarGrid() {
        const titleEl = document.getElementById('cal-month-title');
        const gridEl = document.getElementById('cal-days-grid');
        titleEl.textContent = `${this.viewYear} 年 ${String(this.viewMonth + 1).padStart(2, '0')} 月`;

        const firstDay = new Date(this.viewYear, this.viewMonth, 1).getDay();
        const daysInMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
        const prevMonthDays = new Date(this.viewYear, this.viewMonth, 0).getDate();

        const today = new Date();
        const isCurrentMonth = today.getFullYear() === this.viewYear && today.getMonth() === this.viewMonth;

        gridEl.innerHTML = '';

        // 上月尾日
        for (let i = firstDay - 1; i >= 0; i--) {
          const cell = document.createElement('div');
          cell.className = 'py-1.5 text-[var(--fg-muted)] opacity-45';
          cell.textContent = prevMonthDays - i;
          gridEl.appendChild(cell);
        }

        // 当月日期
        for (let d = 1; d <= daysInMonth; d++) {
          const cell = document.createElement('div');
          const isToday = isCurrentMonth && d === today.getDate();
          cell.className = `py-1.5 cursor-pointer border ${
            isToday
              ? 'bg-[var(--accent-amber)] text-black font-bold border-[var(--accent-amber)]'
              : 'border-transparent hover:border-[var(--accent-cyan)] text-[var(--fg-primary)]'
          }`;
          cell.textContent = d;
          gridEl.appendChild(cell);
        }

        // 下月初日补齐 42 格
        const totalRendered = firstDay + daysInMonth;
        const remain = (7 - (totalRendered % 7)) % 7;
        for (let i = 1; i <= remain; i++) {
          const cell = document.createElement('div');
          cell.className = 'py-1.5 text-[var(--fg-muted)] opacity-45';
          cell.textContent = i;
          gridEl.appendChild(cell);
        }
      }
    };

                  <div class="p-2 border border-[var(--border-subtle)] bg-[var(--bg-input)]/60 text-[10px] text-[var(--fg-secondary)] leading-relaxed">
                    支持将文件直接拖出浏览器至物理桌面，或将物理文件夹拖入此列表。
                  </div>
                </div>

                <!-- Right File List Area -->
                <div class="flex-1 flex flex-col overflow-hidden relative bg-[var(--bg-panel)]" id="exp-list-viewport">
                  <!-- Resizable & Sortable Column Header -->
                  <div class="exp-table-header flex items-center bg-[var(--bg-panel-alt)] border-b border-[var(--border-hairline)] text-[11px] font-mono text-[var(--fg-secondary)] select-none overflow-x-auto">
                    <div class="exp-col-hdr relative flex items-center justify-between px-3 py-2 cursor-pointer hover:text-[var(--fg-primary)] flex-shrink-0" data-col="name">
                      <span>名称 <span class="sort-ind" data-for="name"></span></span>
                      <span class="col-resizer absolute right-0 top-0 bottom-0 w-1.5 cursor-col-resize hover:bg-[var(--accent-amber)]" data-resize="name"></span>
                    </div>
                    <div class="exp-col-hdr relative flex items-center justify-between px-3 py-2 cursor-pointer hover:text-[var(--fg-primary)] flex-shrink-0" data-col="mtime">
                      <span>修改日期 <span class="sort-ind" data-for="mtime"></span></span>
                      <span class="col-resizer absolute right-0 top-0 bottom-0 w-1.5 cursor-col-resize hover:bg-[var(--accent-amber)]" data-resize="mtime"></span>
                    </div>
                    <div class="exp-col-hdr relative flex items-center justify-between px-3 py-2 cursor-pointer hover:text-[var(--fg-primary)] flex-shrink-0" data-col="type">
                      <span>类型 <span class="sort-ind" data-for="type"></span></span>
                      <span class="col-resizer absolute right-0 top-0 bottom-0 w-1.5 cursor-col-resize hover:bg-[var(--accent-amber)]" data-resize="type"></span>
                    </div>
                    <div class="exp-col-hdr relative flex items-center justify-between px-3 py-2 cursor-pointer hover:text-[var(--fg-primary)] flex-shrink-0" data-col="size">
                      <span>大小 <span class="sort-ind" data-for="size"></span></span>
                      <span class="col-resizer absolute right-0 top-0 bottom-0 w-1.5 cursor-col-resize hover:bg-[var(--accent-amber)]" data-resize="size"></span>
                    </div>
                  </div>

                  <!-- Scrollable Rows Container -->
                  <div class="exp-rows-container flex-1 overflow-auto relative p-1"></div>
                  <div class="exp-marquee marquee-box"></div>
                </div>
              </div>

              <!-- Status Bar -->
              <div class="h-6 px-3 bg-[var(--bg-panel-alt)] border-t border-[var(--border-hairline)] flex items-center justify-between text-[11px] font-mono text-[var(--fg-secondary)]">
                <span class="exp-status-left">就绪</span>
                <span class="exp-status-right">OPFS VFS</span>
              </div>
            </div>
          `;

          const navTreeEl = bodyEl.querySelector('.exp-nav-tree');
          const mountsListEl = bodyEl.querySelector('.exp-mounts-list');
          const breadcrumbsEl = bodyEl.querySelector('.exp-breadcrumbs');
          const rowsContainer = bodyEl.querySelector('.exp-rows-container');
          const statusLeft = bodyEl.querySelector('.exp-status-left');
          const statusRight = bodyEl.querySelector('.exp-status-right');
          const searchInput = bodyEl.querySelector('.exp-search-input');
          const marqueeEl = bodyEl.querySelector('.exp-marquee');

          const quickFolders = [
            { label: '根目录 (/)', path: '/' },
            { label: '桌面 (Desktop)', path: '/Desktop' },
            { label: '文档 (Documents)', path: '/Documents' },
            { label: '图集与条漫 (Pictures)', path: '/Pictures' },
            { label: '条漫专栏 (ChronosManga)', path: '/Pictures/ChronosManga' },
            { label: '媒体中心 (Media)', path: '/Media' },
            { label: '归档仓库 (Archives)', path: '/Archives' },
            { label: '虚拟机镜像 (VM)', path: '/System/VM' },
            { label: '本地挂载根 (/mnt/local)', path: '/mnt/local' }
          ];

          function applyColWidths() {
            bodyEl.querySelectorAll('.exp-col-hdr').forEach(hdr => {
              const col = hdr.dataset.col;
              hdr.style.width = `${colWidths[col]}px`;
            });
            rowsContainer.querySelectorAll('.exp-row').forEach(row => {
              row.querySelectorAll('[data-cell]').forEach(cell => {
                const col = cell.dataset.cell;
                cell.style.width = `${colWidths[col]}px`;
              });
            });
          }

          // 列宽拖拽调整
          bodyEl.querySelectorAll('.col-resizer').forEach(resizer => {
            let draggingCol = null;
            let startX = 0;
            let startW = 0;
            resizer.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              draggingCol = resizer.dataset.resize;
              startX = e.clientX;
              startW = colWidths[draggingCol];
              resizer.setPointerCapture(e.pointerId);
            });
            resizer.addEventListener('pointermove', (e) => {
              if (!draggingCol) return;
              const nextW = Math.max(70, startW + (e.clientX - startX));
              colWidths[draggingCol] = nextW;
              applyColWidths();
            });
            resizer.addEventListener('pointerup', (e) => {
              e.stopPropagation();
              draggingCol = null;
            });
          });

          // 点击列标题切换排序方式 (升序 / 降序)
          bodyEl.querySelectorAll('.exp-col-hdr').forEach(hdr => {
            hdr.addEventListener('click', (e) => {
              if (e.target.classList.contains('col-resizer')) return;
              const col = hdr.dataset.col;
              if (sortField === col) sortAsc = !sortAsc;
              else {
                sortField = col;
                sortAsc = true;
              }
              renderRows();
            });
          });

          function renderSidebar() {
            navTreeEl.innerHTML = '';
            for (const item of quickFolders) {
              const btn = document.createElement('div');
              const active = currentDir === item.path && !isGlobalSearchMode;
              btn.className = `px-2 py-1.5 cursor-pointer flex items-center gap-2 truncate ${
                active ? 'bg-[var(--accent-amber)] text-black font-semibold' : 'hover:bg-white/5 text-[var(--fg-primary)]'
              }`;
              btn.innerHTML = `<span class="w-3.5 h-3.5 flex items-center">${ICONS.logo}</span><span class="truncate">${escapeHtml(item.label)}</span>`;
              btn.onclick = () => navigateTo(item.path);
              navTreeEl.appendChild(btn);
            }

            mountsListEl.innerHTML = '';
            const mounts = window.fs.getMountedPaths();
            if (mounts.length === 0) {
              mountsListEl.innerHTML = `<div class="px-2 py-1 text-[10px] text-[var(--fg-muted)]">暂未挂载本地目录</div>`;
            } else {
              for (const mp of mounts) {
                const row = document.createElement('div');
                const active = currentDir === mp || currentDir.startsWith(mp + '/');
                row.className = `px-2 py-1 flex items-center justify-between gap-1 text-[11px] ${
                  active ? 'bg-[var(--accent-cyan)]/20 text-[var(--accent-cyan)] border border-[var(--accent-cyan)]/50' : 'hover:bg-white/5'
                }`;
                row.innerHTML = `
                  <span class="truncate cursor-pointer flex-1" title="${escapeHtml(mp)}">${escapeHtml(window.fs.basename(mp))}</span>
                  <button class="unmount-btn text-[10px] text-[var(--accent-crimson)] hover:underline px-1 cursor-pointer" title="卸载此本地文件夹">卸载</button>
                `;
                row.querySelector('span').onclick = () => navigateTo(mp);
                row.querySelector('.unmount-btn').onclick = async (e) => {
                  e.stopPropagation();
                  await window.fs.unmountBackend(mp);
                  showToast(`已卸载本地目录: ${mp}`);
                  if (currentDir.startsWith(mp)) navigateTo('/mnt/local');
                  else renderSidebar();
                };
                mountsListEl.appendChild(row);
              }
            }
          }

          function renderBreadcrumbs() {
            breadcrumbsEl.innerHTML = '';
            if (isGlobalSearchMode) {
              breadcrumbsEl.innerHTML = `<span class="text-[var(--accent-amber)]">全局搜索结果: "${escapeHtml(searchInput.value.trim())}"</span>`;
              return;
            }
            const parts = currentDir.split('/').filter(Boolean);
            const rootSpan = document.createElement('span');
            rootSpan.className = 'cursor-pointer hover:text-[var(--accent-amber)] px-1';
            rootSpan.textContent = '/ (ROOT)';
            rootSpan.onclick = () => navigateTo('/');
            breadcrumbsEl.appendChild(rootSpan);

            let acc = '';
            for (const p of parts) {
              acc += '/' + p;
              const target = acc;
              const sep = document.createElement('span');
              sep.className = 'text-[var(--fg-muted)]';
              sep.textContent = '›';
              breadcrumbsEl.appendChild(sep);

              const seg = document.createElement('span');
              seg.className = 'cursor-pointer hover:text-[var(--accent-cyan)] px-1';
              seg.textContent = p;
              seg.onclick = () => navigateTo(target);
              breadcrumbsEl.appendChild(seg);
            }
          }

          async function loadDirectoryEntries() {
            isGlobalSearchMode = false;
            selectedItems.clear();
            renderSidebar();
            renderBreadcrumbs();
            meta.setTitle(`文件资源管理器 — ${currentDir}`);

            try {
              const names = await window.fs.readdir(currentDir);
              const list = [];
              for (const name of names) {
                const fullPath = window.fs.join(currentDir, name);
                try {
                  const st = await window.fs.stat(fullPath);
                  const isDir = st.isDirectory();
                  list.push({
                    name,
                    path: fullPath,
                    isDir,
                    size: isDir ? 0 : (st.size || 0),
                    mtimeMs: st.mtimeMs || Date.now(),
                    typeDesc: getFileTypeDesc(name, isDir)
                  });
                  if (!isDir) preloadFileForDrag(fullPath);
                } catch (e) {}
              }
              currentEntries = list;
              renderRows();
            } catch (err) {
              rowsContainer.innerHTML = `<div class="p-6 text-center text-[var(--accent-crimson)]">读取目录失败: ${escapeHtml(err.message)}</div>`;
            }
          }

          async function runGlobalSearch(keyword) {
            const kw = String(keyword || '').trim().toLowerCase();
            if (!kw) {
              loadDirectoryEntries();
              return;
            }
            isGlobalSearchMode = true;
            selectedItems.clear();
            renderSidebar();
            renderBreadcrumbs();
            rowsContainer.innerHTML = `<div class="p-6 text-center text-[var(--accent-cyan)] font-mono">正在全盘递归检索 "${escapeHtml(kw)}" ...</div>`;

            const results = [];
            async function walk(dir) {
              let names = [];
              try { names = await window.fs.readdir(dir); } catch (e) { return; }
              for (const name of names) {
                const full = window.fs.join(dir, name);
                try {
                  const st = await window.fs.stat(full);
                  const isDir = st.isDirectory();
                  if (name.toLowerCase().includes(kw)) {
                    results.push({
                      name: `${name} (${dir})`,
                      rawName: name,
                      path: full,
                      isDir,
                      size: isDir ? 0 : (st.size || 0),
                      mtimeMs: st.mtimeMs || Date.now(),
                      typeDesc: getFileTypeDesc(name, isDir)
                    });
                  }
                  if (isDir) await walk(full);
                } catch (e) {}
              }
            }
            await walk('/');
            currentEntries = results;
            renderRows();
          }

          function renderRows() {
            // 更新表头排序箭头
            bodyEl.querySelectorAll('.sort-ind').forEach(el => {
              if (el.dataset.for === sortField) {
                el.innerHTML = sortAsc ? ICONS.sortAsc : ICONS.sortDesc;
                el.style.color = 'var(--accent-amber)';
              } else {
                el.innerHTML = '';
              }
            });

            const filterKw = !isGlobalSearchMode ? searchInput.value.trim().toLowerCase() : '';
            let filtered = currentEntries.filter(item => {
              if (!filterKw) return true;
              return item.name.toLowerCase().includes(filterKw) || item.typeDesc.toLowerCase().includes(filterKw);
            });

            filtered.sort((a, b) => {
              // 文件夹始终优先或按列排序
              if (a.isDir !== b.isDir && sortField === 'name') {
                return a.isDir ? -1 : 1;
              }
              let cmp = 0;
              if (sortField === 'name') cmp = naturalCompare(a.name, b.name);
              else if (sortField === 'mtime') cmp = (a.mtimeMs || 0) - (b.mtimeMs || 0);
              else if (sortField === 'type') cmp = naturalCompare(a.typeDesc, b.typeDesc);
              else if (sortField === 'size') cmp = (a.size || 0) - (b.size || 0);
              return sortAsc ? cmp : -cmp;
            });

            rowsContainer.innerHTML = '';
            if (filtered.length === 0) {
              rowsContainer.innerHTML = `<div class="p-8 text-center text-[var(--fg-muted)] font-mono">当前目录为空或无匹配项（支持拖入本地文件或右键新建）</div>`;
            }

            for (const item of filtered) {
              const row = document.createElement('div');
              const isSelected = selectedItems.has(item.path);
              row.className = `exp-row flex items-center border border-transparent hover:border-[var(--border-hairline)] hover:bg-white/5 cursor-pointer py-1.5 text-xs ${
                isSelected ? 'bg-[var(--selection-bg)] border-[var(--selection-border)]' : ''
              }`;
              row.dataset.path = item.path;
              row.dataset.isdir = item.isDir ? '1' : '0';
              row.setAttribute('draggable', 'true');

              const iconSvg = getFileIconSvg(item.rawName || item.name, item.isDir, item.path);
              row.innerHTML = `
                <div data-cell="name" class="flex items-center gap-2 px-2.5 truncate flex-shrink-0" style="width:${colWidths.name}px">
                  <span class="w-5 h-5 flex items-center justify-center flex-shrink-0">${iconSvg}</span>
                  <span class="truncate">${escapeHtml(item.name)}</span>
                </div>
                <div data-cell="mtime" class="px-3 font-mono text-[11px] text-[var(--fg-secondary)] truncate flex-shrink-0" style="width:${colWidths.mtime}px">
                  ${formatDate(item.mtimeMs)}
                </div>
                <div data-cell="type" class="px-3 text-[11px] text-[var(--fg-secondary)] truncate flex-shrink-0" style="width:${colWidths.type}px">
                  ${escapeHtml(item.typeDesc)}
                </div>
                <div data-cell="size" class="px-3 font-mono text-[11px] text-[var(--fg-secondary)] truncate flex-shrink-0" style="width:${colWidths.size}px">
                  ${item.isDir ? '--' : formatBytes(item.size)}
                </div>
              `;

              if (!item.isDir) {
                row.addEventListener('mouseenter', () => preloadFileForDrag(item.path));
                row.addEventListener('mousedown', () => preloadFileForDrag(item.path));
              }

              row.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.ctrlKey || e.metaKey) {
                  if (selectedItems.has(item.path)) selectedItems.delete(item.path);
                  else selectedItems.add(item.path);
                } else {
                  selectedItems.clear();
                  selectedItems.add(item.path);
                }
                syncRowSelection();
              });

              row.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                openVFSPath(item.path, { explorerInstance: api });
              });

              row.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!selectedItems.has(item.path)) {
                  selectedItems.clear();
                  selectedItems.add(item.path);
                  syncRowSelection();
                }
                showRowContextMenu(e.clientX, e.clientY, item);
              });

              // 原生拖拽出浏览器或移动到其他文件夹
              row.addEventListener('dragstart', (e) => {
                const payload = {
                  key: item.path,
                  path: item.path,
                  isDir: item.isDir,
                  offsetX: 24,
                  offsetY: 16
                };
                e.dataTransfer.effectAllowed = 'copyMove';
                e.dataTransfer.setData('application/x-webos-item', JSON.stringify(payload));
                if (!item.isDir) {
                  const cached = fileDragCache.get(item.path);
                  if (cached && cached.file && cached.blobUrl) {
                    try { e.dataTransfer.items.add(cached.file); } catch (err) {}
                    try { e.dataTransfer.setData('DownloadURL', `${cached.mime}:${cached.filename}:${cached.blobUrl}`); } catch (err) {}
                  }
                }
              });

              row.addEventListener('dragend', () => {
                if (!item.isDir && fileDragCache.has(item.path)) {
                  const cached = fileDragCache.get(item.path);
                  if (cached && cached.blobUrl) {
                    const oldUrl = cached.blobUrl;
                    setTimeout(() => {
                      URL.revokeObjectURL(oldUrl);
                      preloadFileForDrag(item.path);
                    }, 5500);
                  }
                }
              });

              if (item.isDir) {
                row.addEventListener('dragover', (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  row.classList.add('bg-[var(--accent-cyan)]/25');
                });
                row.addEventListener('dragleave', () => {
                  row.classList.remove('bg-[var(--accent-cyan)]/25');
                });
                row.addEventListener('drop', async (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  row.classList.remove('bg-[var(--accent-cyan)]/25');
                  const raw = e.dataTransfer.getData('application/x-webos-item');
                  if (raw) {
                    const data = JSON.parse(raw);
                    if (data.path && data.path !== item.path) {
                      await window.fs.rename(data.path, window.fs.join(item.path, window.fs.basename(data.path)));
                      showToast(`已移动至 ${item.name}`, 'success');
                    }
                  } else {
                    await handleExternalDataTransferDrop(e.dataTransfer, item.path);
                  }
                });
              }

              rowsContainer.appendChild(row);
            }

            statusLeft.textContent = `共 ${filtered.length} 项 · 已选 ${selectedItems.size} 项`;
            statusRight.textContent = currentDir.startsWith('/mnt/local') ? '本地物理挂载后端 (File System Access)' : 'OPFS 持久化虚拟文件系统';
          }

          function syncRowSelection() {
            rowsContainer.querySelectorAll('.exp-row').forEach(r => {
              const sel = selectedItems.has(r.dataset.path);
              r.classList.toggle('bg-[var(--selection-bg)]', sel);
              r.classList.toggle('border-[var(--selection-border)]', sel);
            });
            statusLeft.textContent = `共 ${currentEntries.length} 项 · 已选 ${selectedItems.size} 项`;
          }

          function showRowContextMenu(x, y, item) {
            const ext = getExt(item.rawName || item.name);
            const menu = [
              { label: '打开', action: () => openVFSPath(item.path, { explorerInstance: api }) }
            ];
            if (!item.isDir) {
              if (ext === 'html' || ext === 'htm') {
                menu.push(
                  { label: '在系统浏览器中打开', action: () => openWebBrowserApp(item.path) },
                  { label: '编辑源代码 (HTML编辑器)', action: () => openHtmlEditorApp(item.path) }
                );
              } else {
                menu.push(
                  { label: '打开方式：代码编辑器 (HTML编辑器)', action: () => openHtmlEditorApp(item.path) },
                  { label: '打开方式：记事本', action: () => openNotepadApp(item.path) }
                );
              }
              if (IMAGE_EXTS.has(ext)) {
                menu.push({ label: '打开方式：漫画阅读器 (同目录条漫)', action: () => openMangaViewerApp(item.path) });
              }
              if (TABLE_EXTS.has(ext)) {
                menu.push({ label: '打开方式：双视图表格', action: () => openTableApp(item.path) });
              }
              if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') {
                menu.push({ label: '解压归档到当前目录', action: () => extractArchiveInVFS(item.path) });
              }
            }
            menu.push(
              { separator: true },
              { label: '导出 / 下载到本地', action: () => exportVFSItemToLocal(item.path) },
              {
                label: '复制',
                action: () => {
                  clipboardVFS = { mode: 'copy', paths: Array.from(selectedItems) };
                  showToast(`已复制 ${selectedItems.size} 个项目`);
                }
              },
              {
                label: '剪切',
                action: () => {
                  clipboardVFS = { mode: 'cut', paths: Array.from(selectedItems) };
                  showToast(`已剪切 ${selectedItems.size} 个项目`);
                }
              },
              {
                label: '重命名',
                action: async () => {
                  const base = window.fs.basename(item.path);
                  const next = prompt('请输入新名称:', base);
                  if (next && next.trim() && next.trim() !== base) {
                    await window.fs.rename(item.path, window.fs.join(window.fs.dirname(item.path), next.trim()));
                  }
                }
              },
              { separator: true },
              {
                label: '删除所选项',
                danger: true,
                action: async () => {
                  for (const p of Array.from(selectedItems)) {
                    await window.fs.delete(p);
                  }
                  selectedItems.clear();
                  showToast('已删除所选项目');
                }
              }
            );
            ContextMenu.show(x, y, menu);
          }

          // 文件列表空白区域接收拖拽放置 & 框选多选
          rowsContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
          });
          rowsContainer.addEventListener('drop', async (e) => {
            e.preventDefault();
            const raw = e.dataTransfer.getData('application/x-webos-item');
            if (raw) {
              try {
                const data = JSON.parse(raw);
                if (data.path && window.fs.dirname(data.path) !== currentDir) {
                  await window.fs.rename(data.path, window.fs.join(currentDir, window.fs.basename(data.path)));
                  showToast(`已移动文件至 ${currentDir}`, 'success');
                }
              } catch (err) {}
              return;
            }
            await handleExternalDataTransferDrop(e.dataTransfer, currentDir);
          });

          // 文件管理器内部框选 (Marquee Selection)
          let mActive = false, mX = 0, mY = 0;
          rowsContainer.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.exp-row')) return;
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (!e.ctrlKey) {
              selectedItems.clear();
              syncRowSelection();
            }
            mActive = true;
            const vRect = rowsContainer.getBoundingClientRect();
            mX = e.clientX - vRect.left;
            mY = e.clientY - vRect.top;
            marqueeEl.style.left = `${mX}px`;
            marqueeEl.style.top = `${mY + 32}px`;
            marqueeEl.style.width = '0px';
            marqueeEl.style.height = '0px';
            marqueeEl.style.display = 'block';
          });

          rowsContainer.addEventListener('pointermove', (e) => {
            if (!mActive) return;
            const vRect = rowsContainer.getBoundingClientRect();
            const cx = e.clientX - vRect.left;
            const cy = e.clientY - vRect.top;
            const l = Math.min(mX, cx);
            const t = Math.min(mY, cy);
            const w = Math.abs(cx - mX);
            const h = Math.abs(cy - mY);
            marqueeEl.style.left = `${l}px`;
            marqueeEl.style.top = `${t + 32}px`;
            marqueeEl.style.width = `${w}px`;
            marqueeEl.style.height = `${h}px`;

            rowsContainer.querySelectorAll('.exp-row').forEach(r => {
              const rTop = r.offsetTop - rowsContainer.scrollTop;
              const rBottom = rTop + r.offsetHeight;
              const hit = !(rBottom < t || rTop > t + h);
              if (hit) selectedItems.add(r.dataset.path);
              else if (!e.ctrlKey) selectedItems.delete(r.dataset.path);
            });
            syncRowSelection();
          });

          window.addEventListener('pointerup', () => {
            if (mActive) {
              mActive = false;
              marqueeEl.style.display = 'none';
            }
          });

          // 空白处右键菜单
          rowsContainer.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.exp-row')) return;
            e.preventDefault();
            ContextMenu.show(e.clientX, e.clientY, [

       15. 内置应用 4.2.1：结构化表格处理 (CSV / TSV 双视图：表格视图 + 文本视图)
       ========================================================================= */
    function parseDelimitedText(text, delimiter = ',') {
      const rows = [];
      let curRow = [];
      let curCell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            curCell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            curCell += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === delimiter) {
            curRow.push(curCell);
            curCell = '';
          } else if (ch === '\r' && next === '\n') {
            curRow.push(curCell);
            rows.push(curRow);
            curRow = [];
            curCell = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            curRow.push(curCell);
            rows.push(curRow);
            curRow = [];
            curCell = '';
          } else {
            curCell += ch;
          }
        }
      }
      if (curCell.length > 0 || curRow.length > 0) {
        curRow.push(curCell);
        rows.push(curRow);
      }
      return rows.length ? rows : [['列1', '列2'], ['', '']];
    }

    function serializeDelimitedData(rows, delimiter = ',') {
      return rows.map(row =>
        row.map(cell => {
          const s = String(cell ?? '');
          if (s.includes(delimiter) || s.includes('"') || s.includes('\n')) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(delimiter)
      ).join('\n');
    }

          function syncUI() {
            const activeCls = 'bg-[var(--accent-cyan)] text-black border-[var(--accent-cyan)]';

            gridData.forEach((row, idx) => row.push(idx === 0 ? `新列_${row.length + 1}` : ''));

        },
        onMount(bodyEl, meta) {
          bodyEl.innerHTML = `

                  <input type="file" class="ide-file-input hidden" />

              </div>

              <!-- Independent Find & Replace Bar (默认隐藏，Ctrl+F / Ctrl+H 激活) -->
              <div class="ide-find-bar hidden flex-wrap items-center gap-1.5 px-3 py-1.5 bg-[#121824] border-b border-[var(--accent-cyan)]/50 text-[11px]">
