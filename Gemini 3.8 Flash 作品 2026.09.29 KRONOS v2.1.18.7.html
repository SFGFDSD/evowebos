  <style>
    /* =========================================================================
       KRONOS // SOLENOID-VITREOUS (曜晶螺线) 美学设计系统
       灵感源于高海拔天体干涉仪、烟熏石英晶体、电离青与磷青铜微光遥测界面
       ========================================================================= */
    :root, [data-theme="dark"] {
      --bg-void: #080a0f;
      --bg-surface: rgba(13, 17, 25, 0.86);
      --bg-surface-elevated: rgba(20, 26, 38, 0.94);
      --bg-panel: #101520;
      --bg-panel-alt: #161d2b;
      --bg-input: #0b0f17;
      --fg-primary: #eceae4;
      --fg-secondary: #9aa5b8;
      --fg-muted: #5a6578;
      --accent-amber: #e59a3c;
      --accent-amber-glow: rgba(229, 154, 60, 0.25);
      --accent-cyan: #2dd4bf;
      --accent-cyan-glow: rgba(45, 212, 191, 0.22);
      --accent-crimson: #f43f5e;
      --border-hairline: rgba(229, 154, 60, 0.18);
      --border-subtle: rgba(154, 165, 184, 0.14);
      --border-active: rgba(45, 212, 191, 0.55);
      --window-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(229, 154, 60, 0.18);
      --taskbar-bg: rgba(9, 12, 18, 0.88);
      --selection-bg: rgba(45, 212, 191, 0.16);
      --selection-border: rgba(45, 212, 191, 0.75);
      --font-display: 'Chakra Petch', 'Noto Sans SC', sans-serif;
      --font-sans: 'Noto Sans SC', 'Chakra Petch', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg-void: #dcd9d0;
      --bg-surface: rgba(244, 241, 234, 0.88);
      --bg-surface-elevated: rgba(252, 250, 245, 0.96);
      --bg-panel: #eae6dc;
      --bg-panel-alt: #dfdbd0;
      --bg-input: #f8f6f0;
      --fg-primary: #181b22;
      --fg-secondary: #4a5365;
      --fg-muted: #7c8596;
      --accent-amber: #b86814;
      --accent-amber-glow: rgba(184, 104, 20, 0.18);
      --accent-cyan: #0d8a7a;
      --accent-cyan-glow: rgba(13, 138, 122, 0.18);
      --accent-crimson: #d92b4b;
      --border-hairline: rgba(184, 104, 20, 0.26);
      --border-subtle: rgba(24, 27, 34, 0.14);
      --border-active: rgba(13, 138, 122, 0.65);
      --window-shadow: 0 20px 50px -12px rgba(24, 27, 34, 0.25), 0 0 0 1px rgba(24, 27, 34, 0.15);
      --taskbar-bg: rgba(238, 234, 224, 0.90);
      --selection-bg: rgba(13, 138, 122, 0.15);
      --selection-border: rgba(13, 138, 122, 0.8);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, [contenteditable="true"], .CodeMirror, .selectable-text {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--fg-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.12);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--fg-muted);
      border-radius: 1px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-amber);
    }

    /* Desktop Container & Atmospheric Layers */
    #os-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #wallpaper-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      transition: background-image 0.5s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s ease;
    }

    /* Solenoid Geometric Overlay Grid */
    #wallpaper-grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(229, 154, 60, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(229, 154, 60, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Desktop Workspace Area */
    #desktop-area {
      position: relative;
      flex: 1;
      width: 100%;
      z-index: 2;
      overflow: hidden;
      touch-action: none;
    }

    /* Desktop Icon Styling */
    .desktop-icon {
      position: absolute;
      width: 86px;
      padding: 8px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      transition: left 0.22s cubic-bezier(0.2, 0.9, 0.3, 1),
                  top 0.22s cubic-bezier(0.2, 0.9, 0.3, 1),
                  background-color 0.15s ease,
                  border-color 0.15s ease,
                  transform 0.15s ease;
      touch-action: none;
    }
    .desktop-icon.dragging-now {
      transition: none !important;
      opacity: 0.78;
      z-index: 50;
    }
    .desktop-icon:hover {
      background: rgba(229, 154, 60, 0.1);
      border-color: rgba(229, 154, 60, 0.35);
    }
    .desktop-icon.selected {
      background: var(--selection-bg);
      border-color: var(--selection-border);
      box-shadow: inset 0 0 12px var(--accent-cyan-glow);
    }
    .desktop-icon.drop-target {
      background: rgba(45, 212, 191, 0.25);
      border-color: var(--accent-cyan);
      transform: scale(1.06);
    }
    .desktop-icon .icon-glyph {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
    }
    .desktop-icon .icon-label {
      width: 100%;
      text-align: center;
      font-size: 11.5px;
      line-height: 1.25;
      color: #f3f1ec;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.8);
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      pointer-events: none;
      font-family: var(--font-sans);
    }
    [data-theme="light"] .desktop-icon .icon-label {
      color: #141820;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.95), 0 0 6px rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    /* Rubber-band Marquee Selection Box */
    .marquee-box {
      position: absolute;
      border: 1px solid var(--selection-border);
      background: var(--selection-bg);
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    /* Aero Snap Phantom Indicator */
    #aero-snap-preview {
      position: absolute;
      z-index: 8900;
      pointer-events: none;
      border: 1.5px solid var(--accent-cyan);
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.18), rgba(229, 154, 60, 0.12));
      backdrop-filter: blur(6px);
      box-shadow: 0 0 30px var(--accent-cyan-glow), inset 0 0 18px var(--accent-cyan-glow);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: scale(0.97);
    }
    #aero-snap-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* OS Window Frame */
    .os-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--window-shadow);
      overflow: hidden;
      min-width: 280px;
      min-height: 180px;
      transition: opacity 0.2s ease, filter 0.2s ease;
      pointer-events: auto;
      clip-path: polygon(
        0 0,
        calc(100% - 10px) 0,
        100% 10px,
        100% 100%,
        10px 100%,
        0 calc(100% - 10px)
      );
    }
    .os-window.active-window {
      border-color: var(--accent-amber);
      box-shadow: 0 28px 70px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px var(--accent-amber);
    }
    .os-window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      clip-path: none !important;
      border-width: 0;
    }
    .os-window.minimized {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(24px) scale(0.94);
    }

    /* Aero Peek Glass Outline Mode */
    body.aero-peek-all .os-window:not(.peek-highlight) {
      opacity: 0.08 !important;
      filter: blur(2px);
      pointer-events: none;
    }
    body.aero-peek-single .os-window:not(.peek-highlight) {
      opacity: 0.14 !important;
      filter: grayscale(0.8);
    }
    .os-window.peek-highlight {
      opacity: 1 !important;
      border-color: var(--accent-cyan) !important;
      box-shadow: 0 0 35px var(--accent-cyan-glow), 0 0 0 1.5px var(--accent-cyan) !important;
    }

    /* Window Titlebar - Non-Apple Mechanical Reticle Controls */
    .window-titlebar {
      height: 36px;
      min-height: 36px;
      background: linear-gradient(90deg, var(--bg-panel) 0%, var(--bg-panel-alt) 65%, rgba(229, 154, 60, 0.12) 100%);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      cursor: default;
      touch-action: none;
    }
    .os-window.active-window .window-titlebar {
      background: linear-gradient(90deg, var(--bg-panel) 0%, var(--bg-panel-alt) 55%, rgba(229, 154, 60, 0.22) 100%);
    }
    .window-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      pointer-events: none;
    }
    .window-title-text {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--fg-primary);
    }
    .window-telemetry-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      color: var(--accent-amber);
      border: 1px solid var(--border-hairline);
      background: rgba(229, 154, 60, 0.07);
      text-transform: uppercase;
    }
    .window-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .win-ctrl-btn {
      width: 26px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--fg-secondary);
      cursor: pointer;
      transition: all 0.14s ease;
      clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%);
    }
    .win-ctrl-btn:hover {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
      background: var(--accent-amber-glow);
    }
    .win-ctrl-btn.close-btn:hover {
      border-color: var(--accent-crimson);
      color: #fff;
      background: var(--accent-crimson);
    }

    .window-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: var(--bg-panel);
    }

    /* 8-Way Resize Handles */
    .resize-handle {
      position: absolute;
      z-index: 30;
      touch-action: none;
    }
    .resize-n  { top: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
    .resize-s  { bottom: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
    .resize-e  { right: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
    .resize-w  { left: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
    .resize-nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .resize-ne { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-se { bottom: 0; right: 0; width: 12px; height: 12px; cursor: nwse-resize; }

    /* Taskbar / Dock */
    #taskbar {
      position: relative;
      z-index: 9000;
      height: 44px;
      min-height: 44px;
      background: var(--taskbar-bg);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 8px;
      gap: 8px;
    }

    #start-btn {
      height: 32px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(229, 154, 60, 0.18), rgba(45, 212, 191, 0.1));
      border: 1px solid var(--accent-amber);
      color: var(--fg-primary);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.15s ease;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }
    #start-btn:hover, #start-btn.active {
      background: var(--accent-amber);
      color: #090c12;
      box-shadow: 0 0 16px var(--accent-amber-glow);
    }

    #taskbar-apps {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      height: 100%;
      padding: 4px 2px;
    }
    #taskbar-apps::-webkit-scrollbar {
      height: 2px;
    }

    .taskbar-item {
      height: 32px;
      min-width: 120px;
      max-width: 190px;
      padding: 0 8px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-bottom: 2px solid var(--fg-muted);
      color: var(--fg-secondary);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .taskbar-item:hover {
      background: rgba(229, 154, 60, 0.1);
      color: var(--fg-primary);
      border-color: var(--border-hairline);
    }
    .taskbar-item.active {
      background: rgba(45, 212, 191, 0.12);
      color: var(--fg-primary);
      border-color: rgba(45, 212, 191, 0.4);
      border-bottom: 2px solid var(--accent-cyan);
    }
    .taskbar-item .tb-close {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      border-radius: 2px;
    }
    .taskbar-item .tb-close:hover {
      opacity: 1;
      background: var(--accent-crimson);
      color: #fff;
    }

    /* Aero Peek Strip on Far Right of Taskbar */
    #aero-peek-strip {
      width: 14px;
      height: 100%;
      border-left: 1px solid var(--border-hairline);
      background: linear-gradient(180deg, rgba(45, 212, 191, 0.18), rgba(229, 154, 60, 0.18));
      cursor: pointer;
      transition: background 0.15s ease, width 0.15s ease;
    }
    #aero-peek-strip:hover {
      background: var(--accent-cyan);
      box-shadow: 0 0 14px var(--accent-cyan);
    }

    /* Context Menu */
    #context-menu {
      position: fixed;
      z-index: 99999;
      min-width: 210px;
      background: var(--bg-surface-elevated);
      backdrop-filter: blur(20px);
      border: 1px solid var(--accent-amber);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.75);
      padding: 5px;
      display: none;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
    .ctx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--fg-primary);
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.1s ease;
    }
    .ctx-item:hover {
      background: var(--accent-amber);
      color: #090c12;
    }
    .ctx-item:hover svg {
      stroke: #090c12;
    }
    .ctx-item.danger:hover {
      background: var(--accent-crimson);
      color: #fff;
    }
    .ctx-item.danger:hover svg {
      stroke: #fff;
    }
    .ctx-sep {
      height: 1px;
      margin: 4px 2px;
      background: var(--border-subtle);
    }

    /* CodeMirror Customizations & Search Marks */
    .CodeMirror {
      height: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 13px;
      line-height: 1.55;
    }
    .cm-trailingspace {
      background-image: radial-gradient(rgba(244, 63, 94, 0.65) 1.5px, transparent 1.5px);
      background-position: center;
      background-repeat: no-repeat;
    }
    .cm-search-match {
      background-color: rgba(229, 154, 60, 0.32);
      border-bottom: 1px solid #e59a3c;
    }
    .cm-search-match-active {
      background-color: rgba(45, 212, 191, 0.55) !important;
      outline: 1px solid #2dd4bf;
      color: #fff !important;
    }

    /* Manga Viewer Fullscreen Mode */
    .manga-fullscreen-active .window-titlebar,
    .manga-fullscreen-active .manga-toolbar,
    .manga-fullscreen-active .resize-handle {
      display: none !important;
    }
    .manga-fullscreen-active {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99990 !important;
      border: none !important;
      clip-path: none !important;
    }
    .manga-scroll-area {
      background: #000000 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y !important;
    }

    /* Mobile / Tablet Adaptive Dock Mode */
    @media (max-width: 768px) {
      #taskbar {
        height: 54px;
        padding: 0 6px;
        border-top: 1px solid var(--accent-amber);
      }
      .taskbar-item {
        min-width: 44px;
        max-width: 56px;
        justify-content: center;
        padding: 0 6px;
      }
      .taskbar-item .tb-title,
      .taskbar-item .tb-close {
        display: none;
      }
      .os-window:not(.maximized) {
        width: 95vw !important;
        left: 2.5vw !important;
      }
      .desktop-icon {
        width: 78px;
      }
    }
  </style>
</head>
<body>
  <div id="os-root">
    <!-- Wallpaper Layer -->
    <div id="wallpaper-layer"></div>
    <div id="wallpaper-grid-overlay"></div>

    <!-- Local Mount Permission Recovery Banner -->
    <div id="mount-restore-banner" class="hidden relative z-50 bg-[#141b29]/95 border-b border-[#e59a3c]/50 px-4 py-2 flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 bg-[#e59a3c]"></span>
        <span id="mount-restore-text">检测到上次会话挂载的本地物理文件夹，浏览器刷新后需重新授权访问权限。</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-restore-mounts" class="px-3 py-1 bg-[#e59a3c] text-black font-semibold cursor-pointer hover:opacity-90">一键恢复挂载</button>
        <button id="btn-dismiss-mounts" class="px-2 py-1 border border-white/20 text-gray-300 cursor-pointer hover:bg-white/10">忽略</button>
      </div>
    </div>

    <!-- Desktop Workspace -->
    <div id="desktop-area">
      <div id="desktop-icons-container" class="w-full h-full relative"></div>
      <div id="desktop-marquee" class="marquee-box"></div>
      <div id="aero-snap-preview"></div>
      <div id="windows-container" class="absolute inset-0 pointer-events-none"></div>
    </div>

    <!-- Start Menu Launcher -->
    <div id="start-menu" class="hidden fixed bottom-12 left-2 z-[9500] w-[390px] max-w-[95vw] bg-[var(--bg-surface-elevated)] backdrop-blur-2xl border border-[var(--accent-amber)] shadow-2xl p-4"
         style="clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-[var(--border-hairline)]">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 flex items-center justify-center bg-[var(--accent-amber)]/15 border border-[var(--accent-amber)]" id="start-brand-glyph"></div>
          <div>
            <div class="font-bold tracking-wider text-sm" style="font-family: var(--font-display);">KRONOS // SOLENOID OS</div>
            <div class="text-[10px] text-[var(--fg-secondary)] font-mono" id="start-storage-badge">OPFS ENGINE READY</div>
          </div>
        </div>
        <button id="start-theme-toggle" class="px-2.5 py-1 text-xs border border-[var(--border-hairline)] hover:border-[var(--accent-cyan)] flex items-center gap-1.5 cursor-pointer" title="切换深浅色主题">
          <span id="start-theme-label">深色曜晶</span>
        </button>
      </div>

      <div class="mb-3">
        <input id="start-search-input" type="text" placeholder="搜索内置应用或虚拟文件系统文件..."
               class="w-full px-3 py-1.5 text-xs bg-[var(--bg-input)] border border-[var(--border-subtle)] focus:border-[var(--accent-cyan)] outline-none text-[var(--fg-primary)]" />
      </div>

      <div class="text-[10px] uppercase tracking-widest text-[var(--accent-amber)] font-mono mb-2">系统核心工作站 // WORKSTATIONS</div>
      <div id="start-apps-grid" class="grid grid-cols-3 gap-2 mb-3 max-h-[270px] overflow-y-auto pr-1"></div>

      <div id="start-search-results" class="hidden mb-3 max-h-[140px] overflow-y-auto border-t border-[var(--border-subtle)] pt-2"></div>

      <div class="flex items-center justify-between pt-2 border-t border-[var(--border-hairline)] text-xs">
        <button id="start-mount-local-btn" class="px-2.5 py-1.5 bg-[var(--accent-cyan)]/15 border border-[var(--accent-cyan)]/50 text-[var(--accent-cyan)] hover:bg-[var(--accent-cyan)] hover:text-black transition cursor-pointer flex items-center gap-1.5">
          <span>挂载本地文件夹 (/mnt/local)</span>
        </button>

          导入本地文件

      </div>

        </div>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-[var(--fg-muted)] font-mono mb-1">

      </div>
      <div id="cal-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-mono"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn" title="打开系统启动器">
        <span id="taskbar-logo-svg" class="w-4 h-4 flex items-center justify-center"></span>
        <span>KRONOS</span>
      </button>

      <div class="flex items-center gap-2 h-full">
        <button id="tray-mount-btn" class="h-7 px-2 text-[11px] font-mono border border-[var(--border-subtle)] hover:border-[var(--accent-cyan)] flex items-center gap-1 cursor-pointer" title="挂载真实物理文件夹到 /mnt/local">
          <span id="tray-mount-svg" class="w-3.5 h-3.5"></span>
          <span class="hidden sm:inline">挂载目录</span>
        </button>

        <button id="tray-theme-btn" class="h-7 w-7 border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] flex items-center justify-center cursor-pointer" title="切换深色/浅色模式"></button>

          <div id="clock-date" class="text-[10px] font-mono text-[var(--fg-secondary)]">----/--/--</div>
        </div>

        <div id="aero-peek-strip" title="Aero Peek：悬停透视桌面 / 点击显示桌面"></div>
      </div>
    </div>

    <div id="context-menu"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-3 right-3 z-[99998] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Hidden Global File Inputs -->
    <input id="global-file-input" type="file" multiple class="hidden" />
    <input id="wallpaper-file-input" type="file" accept="image/*" class="hidden" />
  </div>

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const borderColor = type === 'error' ? 'var(--accent-crimson)' : type === 'success' ? 'var(--accent-cyan)' : 'var(--accent-amber)';
      el.className = 'px-3.5 py-2 text-xs bg-[var(--bg-surface-elevated)] border shadow-xl flex items-center gap-2 pointer-events-auto transition-all duration-200';
      el.style.borderColor = borderColor;
      el.innerHTML = `<span class="w-2 h-2 inline-block" style="background:${borderColor}"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(16px)';
        setTimeout(() => el.remove(), 220);
      }, 3200);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes < 0) return '0 B';
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function formatDate(ts) {
      const d = new Date(ts || Date.now());
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // 自然数字排序比较函数 (1.jpg -> 2.jpg -> 10.jpg)
    const naturalCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    function naturalCompare(a, b) {
      return naturalCollator.compare(String(a), String(b));
    }

        if (cookieTheme && !saved.theme) {

    /* =========================================================================
       4. 统一虚拟文件系统 (window.fs) — OPFS + File System Access API + IDB
          严禁出现任何 isLocal 分支判断：所有挂载点均为多态 DirectoryBackend 实例
       ========================================================================= */
    class HandleDirectoryBackend {
      constructor(rootHandle, label = 'OPFS') {
        this.rootHandle = rootHandle;
        this.label = label;
      }

      _splitParts(relPath) {
        return String(relPath || '').split('/').filter(Boolean);
      }

      async _getDirHandle(relPath, create = false) {
        const parts = this._splitParts(relPath);
        let curr = this.rootHandle;
        for (const part of parts) {
          curr = await curr.getDirectoryHandle(part, { create });
        }
        return curr;
      }

      async _getParentAndName(relPath, createParent = false) {
        const parts = this._splitParts(relPath);
        if (parts.length === 0) return { parent: null, name: '' };
        const name = parts.pop();
        let curr = this.rootHandle;
        for (const part of parts) {
          curr = await curr.getDirectoryHandle(part, { create: createParent });
        }
        return { parent: curr, name };
      }

      async stat(relPath) {
        const parts = this._splitParts(relPath);
        if (parts.length === 0) {
          return {
            name: '/',
            isDirectory: () => true,
            isFile: () => false,
            size: 0,
            mtimeMs: Date.now(),
            mtime: new Date()
          };
        }
        const { parent, name } = await this._getParentAndName(relPath, false);
        try {
          const fileHandle = await parent.getFileHandle(name, { create: false });
          const file = await fileHandle.getFile();
          return {
            name,
            isDirectory: () => false,
            isFile: () => true,
            size: file.size,
            mtimeMs: file.lastModified || Date.now(),
            mtime: new Date(file.lastModified || Date.now()),
            mimeType: file.type || ''
          };
        } catch (fileErr) {
          const dirHandle = await parent.getDirectoryHandle(name, { create: false });
          return {
            name: dirHandle.name || name,
            isDirectory: () => true,
            isFile: () => false,
            size: 0,
            mtimeMs: Date.now(),
            mtime: new Date()
          };
        }
      }

      async readdir(relPath) {
        const dir = await this._getDirHandle(relPath, false);
        const names = [];
        for await (const [name] of dir.entries()) {
          names.push(name);
        }
        return names.sort(naturalCompare);
      }

      async mkdir(relPath) {
        await this._getDirHandle(relPath, true);
        return true;
      }

      async readFile(relPath, options) {
        const { parent, name } = await this._getParentAndName(relPath, false);
        if (!parent || !name) throw new Error('Invalid file path');
        const fileHandle = await parent.getFileHandle(name, { create: false });
        const file = await fileHandle.getFile();
        const encoding = typeof options === 'string' ? options : (options && options.encoding);
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return await file.text();
        }
        return await file.arrayBuffer();
      }

      async writeFile(relPath, data) {
        const { parent, name } = await this._getParentAndName(relPath, true);
        if (!parent || !name) throw new Error('Invalid file path');
        const fileHandle = await parent.getFileHandle(name, { create: true });
        const writable = await fileHandle.createWritable();
        if (typeof data === 'string') {
          await writable.write(new TextEncoder().encode(data));
        } else if (data instanceof ArrayBuffer) {
          await writable.write(new Uint8Array(data));
        } else if (ArrayBuffer.isView(data)) {
          await writable.write(data);
        } else if (data instanceof Blob) {
          await writable.write(data);
        } else {
          await writable.write(new TextEncoder().encode(String(data ?? '')));
        }
        await writable.close();
        return true;
      }

      async unlink(relPath) {
        const { parent, name } = await this._getParentAndName(relPath, false);
        if (!parent || !name) throw new Error('Cannot unlink root');
        await parent.removeEntry(name, { recursive: false });
        return true;
      }

      async rmdir(relPath) {
        const { parent, name } = await this._getParentAndName(relPath, false);
        if (!parent || !name) throw new Error('Cannot remove root directory');
        await parent.removeEntry(name, { recursive: true });
        return true;
      }
    }

    // 内存/IndexedDB 降级 Backend (当浏览器处于受限沙箱无法调用 OPFS 时无缝顶替)
    class FallbackMemoryBackend {
      constructor() {
        this.nodes = new Map();
        this.nodes.set('', { type: 'dir', mtimeMs: Date.now() });
      }
      _clean(relPath) {
        return String(relPath || '').split('/').filter(Boolean).join('/');
      }
      async stat(relPath) {
        const key = this._clean(relPath);
        const node = this.nodes.get(key);
        if (!node) throw new Error(`ENOENT: ${relPath}`);
        return {
          name: key.split('/').pop() || '/',
          isDirectory: () => node.type === 'dir',
          isFile: () => node.type === 'file',
          size: node.data ? node.data.byteLength : 0,
          mtimeMs: node.mtimeMs || Date.now(),
          mtime: new Date(node.mtimeMs || Date.now())
        };
      }
      async readdir(relPath) {
        const prefix = this._clean(relPath);
        if (!this.nodes.has(prefix)) throw new Error(`ENOENT: ${relPath}`);
        const out = new Set();
        for (const k of this.nodes.keys()) {
          if (!k) continue;
          if (prefix === '') {
            if (!k.includes('/')) out.add(k);
          } else if (k.startsWith(prefix + '/')) {
            const rest = k.slice(prefix.length + 1);
            if (rest && !rest.includes('/')) out.add(rest);
          }
        }
        return Array.from(out).sort(naturalCompare);
      }
      async mkdir(relPath) {
        const parts = String(relPath || '').split('/').filter(Boolean);
        let cur = '';
        for (const p of parts) {
          cur = cur ? `${cur}/${p}` : p;
          if (!this.nodes.has(cur)) {
            this.nodes.set(cur, { type: 'dir', mtimeMs: Date.now() });
          }
        }
        return true;
      }
      async readFile(relPath, options) {
        const key = this._clean(relPath);
        const node = this.nodes.get(key);
        if (!node || node.type !== 'file') throw new Error(`ENOENT: ${relPath}`);
        const encoding = typeof options === 'string' ? options : (options && options.encoding);
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return new TextDecoder().decode(node.data);
        }
        return node.data.slice(0);
      }
      async writeFile(relPath, data) {
        const key = this._clean(relPath);
        const parts = key.split('/');
        parts.pop();
        if (parts.length) await this.mkdir(parts.join('/'));
        let buf;
        if (typeof data === 'string') {
          buf = new TextEncoder().encode(data).buffer;
        } else if (data instanceof ArrayBuffer) {
          buf = data.slice(0);
        } else if (ArrayBuffer.isView(data)) {
          buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        } else if (data instanceof Blob) {
          buf = await data.arrayBuffer();
        } else {
          buf = new TextEncoder().encode(String(data ?? '')).buffer;
        }
        this.nodes.set(key, { type: 'file', data: buf, mtimeMs: Date.now() });
        return true;
      }
      async unlink(relPath) {
        const key = this._clean(relPath);
        this.nodes.delete(key);
        return true;
      }
      async rmdir(relPath) {
        const key = this._clean(relPath);
        for (const k of Array.from(this.nodes.keys())) {
          if (k === key || k.startsWith(key + '/')) this.nodes.delete(k);
        }
        return true;
      }
    }

    // IndexedDB 存储挂载句柄与元数据
    const MountIDB = {
      dbPromise: null,
      open() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('KronosVFS_DB', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('mounts')) {
              db.createObjectStore('mounts', { keyPath: 'mountPath' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return this.dbPromise;
      },
      async saveMount(mountPath, name, handle) {
        try {
          const db = await this.open();
          const tx = db.transaction('mounts', 'readwrite');
          tx.objectStore('mounts').put({ mountPath, name, handle, savedAt: Date.now() });
        } catch (e) {}
      },
      async removeMount(mountPath) {
        try {
          const db = await this.open();
          const tx = db.transaction('mounts', 'readwrite');
          tx.objectStore('mounts').delete(mountPath);
        } catch (e) {}
      },
      async getAllMounts() {
        try {
          const db = await this.open();
          return await new Promise((resolve) => {
            const tx = db.transaction('mounts', 'readonly');
            const req = tx.objectStore('mounts').getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          });
        } catch (e) {
          return [];
        }
      },
      async clearAll() {
        try {
          const db = await this.open();
          const tx = db.transaction('mounts', 'readwrite');
          tx.objectStore('mounts').clear();
        } catch (e) {}
      }
    };

    // 统一 VFS 路由与 API 封装 (兼容任意参数签名与 callback)
    class UnifiedVFS {
      constructor() {
        this.mounts = new Map(); // mountPrefix -> Backend instance
        this.listeners = new Set();
      }

      normalizePath(p) {
        if (!p || typeof p !== 'string') return '/';
        const parts = p.replace(/\\/g, '/').split('/');
        const stack = [];
        for (const seg of parts) {
          if (!seg || seg === '.') continue;
          if (seg === '..') stack.pop();
          else stack.push(seg);
        }
        return '/' + stack.join('/');
      }

      dirname(p) {
        const norm = this.normalizePath(p);
        if (norm === '/') return '/';
        const idx = norm.lastIndexOf('/');
        return idx <= 0 ? '/' : norm.slice(0, idx);
      }

      basename(p) {
        const norm = this.normalizePath(p);
        if (norm === '/') return '/';
        return norm.slice(norm.lastIndexOf('/') + 1);
      }

      join(...segments) {
        return this.normalizePath(segments.filter(Boolean).join('/'));
      }

      // 解析路径对应的挂载后端与内部相对路径 (无任何 isLocal 分支)
      _resolve(fullPath) {
        const norm = this.normalizePath(fullPath);
        let bestPrefix = '/';
        let bestBackend = this.mounts.get('/');
        for (const [prefix, backend] of this.mounts.entries()) {
          if (prefix === '/') continue;
          if (norm === prefix || norm.startsWith(prefix + '/')) {
            if (prefix.length > bestPrefix.length) {
              bestPrefix = prefix;
              bestBackend = backend;
            }
          }
        }
        const relPath = norm === bestPrefix ? '' : norm.slice(bestPrefix === '/' ? 1 : bestPrefix.length + 1);
        return { norm, mountPrefix: bestPrefix, backend: bestBackend, relPath };
      }

      // 通用参数签名兼容包装器：自动识别末尾 callback，同时返回 Promise
      _wrapCompat(fn) {
        return (...args) => {
          let cb = null;
          if (args.length > 0 && typeof args[args.length - 1] === 'function') {
            cb = args.pop();
          }
          const promise = Promise.resolve().then(() => fn(...args));
          if (cb) {
            promise.then(res => cb(null, res)).catch(err => cb(err));
          }
          return promise;
        };
      }

      onChange(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }

      emitChange(affectedPath = '/') {
        const norm = this.normalizePath(affectedPath);
        if (typeof preloadDesktopFilesForDrag === 'function') {
          preloadDesktopFilesForDrag();
        }
        for (const fn of this.listeners) {
          try { fn(norm); } catch (e) {}
        }
      }

      async mountBackend(mountPath, backend, persistHandle = null) {
        const norm = this.normalizePath(mountPath);
        if (norm !== '/') {
          const rootBackend = this.mounts.get('/');
          if (rootBackend) {
            try { await rootBackend.mkdir(norm.slice(1)); } catch (e) {}
          }
        }
        this.mounts.set(norm, backend);
        if (persistHandle) {
          await MountIDB.saveMount(norm, this.basename(norm), persistHandle);
        }
        this.emitChange(this.dirname(norm));
      }

      async unmountBackend(mountPath) {
        const norm = this.normalizePath(mountPath);
        if (norm === '/') return false;
        this.mounts.delete(norm);
        const rootBackend = this.mounts.get('/');
        if (rootBackend) {
          try { await rootBackend.rmdir(norm.slice(1)); } catch (e) {}
        }
        await MountIDB.removeMount(norm);
        this.emitChange('/mnt/local');
        return true;
      }

      getMountedPaths() {
        return Array.from(this.mounts.keys()).filter(k => k !== '/');
      }
    }

    const vfsCore = new UnifiedVFS();

    // 绑定所有标准 fs 方法并具备完整参数兼容性 (stat, lstat, readdir, mkdir, readFile, writeFile, unlink, rmdir, rename, copyFile, exists, open)
    vfsCore.stat = vfsCore._wrapCompat(async (path, _options) => {
      const { norm, backend, relPath } = vfsCore._resolve(path);
      const st = await backend.stat(relPath);
      st.path = norm;
      st.name = norm === '/' ? '/' : vfsCore.basename(norm);
      return st;
    });

    vfsCore.lstat = vfsCore.stat;

    vfsCore.exists = vfsCore._wrapCompat(async (path) => {
      try {
        await vfsCore.stat(path);
        return true;
      } catch (e) {
        return false;
      }
    });

    vfsCore.readdir = vfsCore._wrapCompat(async (path, _options) => {
      const { norm, backend, relPath } = vfsCore._resolve(path);
      const names = new Set(await backend.readdir(relPath));
      for (const mp of vfsCore.mounts.keys()) {
        if (mp === '/') continue;
        if (vfsCore.dirname(mp) === norm) {
          names.add(vfsCore.basename(mp));
        }
      }
      return Array.from(names).sort(naturalCompare);
    });

    vfsCore.mkdir = vfsCore._wrapCompat(async (path, _options) => {
      const { norm, backend, relPath } = vfsCore._resolve(path);
      await backend.mkdir(relPath);
      vfsCore.emitChange(vfsCore.dirname(norm));
      return true;
    });

    vfsCore.readFile = vfsCore._wrapCompat(async (path, options) => {
      const { backend, relPath } = vfsCore._resolve(path);
      return await backend.readFile(relPath, options);
    });

    vfsCore.writeFile = vfsCore._wrapCompat(async (path, data, _options) => {
      const { norm, backend, relPath } = vfsCore._resolve(path);
      await backend.writeFile(relPath, data);
      vfsCore.emitChange(vfsCore.dirname(norm));
      return true;
    });

    vfsCore.unlink = vfsCore._wrapCompat(async (path) => {
      const { norm, backend, relPath } = vfsCore._resolve(path);
      await backend.unlink(relPath);
      vfsCore.emitChange(vfsCore.dirname(norm));
      return true;
    });

    vfsCore.rmdir = vfsCore._wrapCompat(async (path) => {
      const { norm, backend, relPath } = vfsCore._resolve(path);
      if (vfsCore.mounts.has(norm) && norm !== '/') {
        return await vfsCore.unmountBackend(norm);
      }
      await backend.rmdir(relPath);
      vfsCore.emitChange(vfsCore.dirname(norm));
      return true;
    });

    vfsCore.delete = vfsCore._wrapCompat(async (path) => {
      const st = await vfsCore.stat(path);
      if (st.isDirectory()) return await vfsCore.rmdir(path);
      return await vfsCore.unlink(path);
    });

    vfsCore.copyFile = vfsCore._wrapCompat(async (src, dest) => {
      const st = await vfsCore.stat(src);
      if (st.isDirectory()) {
        await vfsCore.mkdir(dest);
        const children = await vfsCore.readdir(src);
        for (const child of children) {
          await vfsCore.copyFile(vfsCore.join(src, child), vfsCore.join(dest, child));
        }
      } else {
        const buf = await vfsCore.readFile(src);
        await vfsCore.writeFile(dest, buf);
      }
      return true;
    });

    vfsCore.rename = vfsCore._wrapCompat(async (oldPath, newPath) => {
      const normOld = vfsCore.normalizePath(oldPath);
      const normNew = vfsCore.normalizePath(newPath);
      if (normOld === normNew) return true;
      await vfsCore.copyFile(normOld, normNew);
      await vfsCore.delete(normOld);
      vfsCore.emitChange(vfsCore.dirname(normOld));
      vfsCore.emitChange(vfsCore.dirname(normNew));
      return true;
    });

    vfsCore.open = vfsCore._wrapCompat(async (path, flags = 'r') => {
      return {
        path: vfsCore.normalizePath(path),
        flags,
        read: () => vfsCore.readFile(path),
        write: (d) => vfsCore.writeFile(path, d),
        close: async () => true
      };
    });

    // 全局挂载为 window.fs
    window.fs = vfsCore;

    /* =========================================================================
       5. 文件类型识别、MIME 映射、解压引擎与双向拖拽缓存
       ========================================================================= */
    const EXT_MIME_MAP = {
      html: 'text/html', htm: 'text/html',
      css: 'text/css', js: 'text/javascript', mjs: 'text/javascript',
      json: 'application/json', md: 'text/markdown', markdown: 'text/markdown',
      txt: 'text/plain', log: 'text/plain', yaml: 'text/yaml', yml: 'text/yaml',
      xml: 'application/xml', svg: 'image/svg+xml',
      csv: 'text/csv', tsv: 'text/tab-separated-values',
      png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
      gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp', ico: 'image/x-icon', avif: 'image/avif',
      mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', flac: 'audio/flac', aac: 'audio/aac',
      mp4: 'video/mp4', webm: 'video/webm', ogv: 'video/ogg',
      pdf: 'application/pdf',
      zip: 'application/zip', gz: 'application/gzip', tar: 'application/x-tar',
      tgz: 'application/gzip', '7z': 'application/x-7z-compressed',
      iso: 'application/octet-stream', img: 'application/octet-stream', bin: 'application/octet-stream', fda: 'application/octet-stream'
    };

    const IMAGE_EXTS = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico', 'avif']);
    const AUDIO_EXTS = new Set(['mp3', 'wav', 'ogg', 'flac', 'aac']);
    const VIDEO_EXTS = new Set(['mp4', 'webm', 'ogv']);
    const CODE_EXTS  = new Set(['html', 'htm', 'css', 'js', 'mjs', 'json', 'md', 'markdown', 'xml']);
    const TEXT_EXTS  = new Set(['txt', 'log', 'yaml', 'yml', 'ini', 'conf', 'sh', 'bat']);
    const TABLE_EXTS = new Set(['csv', 'tsv']);
    const ARCHIVE_EXTS = new Set(['zip', 'gz', 'tar', 'tgz', '7z']);
    const VM_EXTS = new Set(['iso', 'img', 'fda', 'bin']);

    function getExt(filename) {
      const lower = String(filename || '').toLowerCase();
      if (lower.endsWith('.tar.gz')) return 'tar.gz';
      const idx = lower.lastIndexOf('.');
      return idx > 0 ? lower.slice(idx + 1) : '';
    }

    function getMimeType(filename) {
      const ext = getExt(filename);
      if (ext === 'tar.gz') return 'application/gzip';
      return EXT_MIME_MAP[ext] || 'application/octet-stream';
    }

    function getFileTypeDesc(filename, isDir) {
      if (isDir) return '文件夹';
      const ext = getExt(filename);
      if (!ext) return '通用文件';
      if (ext === 'html' || ext === 'htm') return 'HTML 网页文档';
      if (TABLE_EXTS.has(ext)) return `${ext.toUpperCase()} 结构化表格`;
      if (IMAGE_EXTS.has(ext)) return `${ext.toUpperCase()} 图像文件`;
      if (AUDIO_EXTS.has(ext)) return `${ext.toUpperCase()} 音频媒体`;
      if (VIDEO_EXTS.has(ext)) return `${ext.toUpperCase()} 视频媒体`;
      if (CODE_EXTS.has(ext)) return `${ext.toUpperCase()} 源代码文档`;
      if (TEXT_EXTS.has(ext)) return `${ext.toUpperCase()} 文本文件`;
      if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') return `${ext.toUpperCase()} 压缩归档`;
      if (ext === 'pdf') return 'PDF 文档';
      if (VM_EXTS.has(ext)) return `${ext.toUpperCase()} 虚拟机镜像`;
      return `${ext.toUpperCase()} 数据文件`;
    }

    function getFileIconSvg(filename, isDir, fullPath = '') {
      if (isDir) {
        if (fullPath.startsWith('/mnt/local')) return ICONS.folderMount;
        return ICONS.folder;
      }
      const ext = getExt(filename);
      if (TABLE_EXTS.has(ext)) return ICONS.fileTable;
      if (CODE_EXTS.has(ext)) return ICONS.fileCode;
      if (IMAGE_EXTS.has(ext)) return ICONS.fileImage;
      if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext)) return ICONS.fileMedia;
      if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') return ICONS.fileArchive;
      if (ext === 'pdf') return ICONS.filePdf;
      if (VM_EXTS.has(ext)) return ICONS.fileVm;
      return ICONS.fileText;
    }

    // =========================================================================
    // 双向拖拽同步预加载缓存 (严禁在 dragstart 中使用 async/await)
    // =========================================================================
    const fileDragCache = new Map(); // path -> { file, blobUrl, mime, filename }

    async function preloadFileForDrag(path) {
      try {
        const norm = window.fs.normalizePath(path);
        const st = await window.fs.stat(norm);
        if (st.isDirectory()) return null;
        const buf = await window.fs.readFile(norm);
        const filename = window.fs.basename(norm);
        const mime = getMimeType(filename);
        const file = new File([buf], filename, { type: mime, lastModified: st.mtimeMs || Date.now() });
        const blobUrl = URL.createObjectURL(file);
        const prev = fileDragCache.get(norm);
        if (prev && prev.blobUrl) {
          setTimeout(() => URL.revokeObjectURL(prev.blobUrl), 6000);
        }
        const entry = { file, blobUrl, mime, filename };
        fileDragCache.set(norm, entry);
        return entry;
      } catch (e) {
        return null;
      }
    }

    async function preloadDesktopFilesForDrag() {
      try {
        const items = await window.fs.readdir('/Desktop');
        for (const name of items) {
          preloadFileForDrag(window.fs.join('/Desktop', name));
        }
      } catch (e) {}
    }

    // 导出/下载任意虚拟文件或目录 (供移动端与右键菜单调用)
    async function exportVFSItemToLocal(path) {
      try {
        const norm = window.fs.normalizePath(path);
        const st = await window.fs.stat(norm);
        if (st.isDirectory()) {
          if (typeof JSZip === 'undefined') {
            showToast('JSZip 未就绪，无法打包导出文件夹', 'error');
            return;
          }
          showToast(`正在打包文件夹 ${st.name}...`);
          const zip = new JSZip();
          async function addDirToZip(vfsDir, zipFolder) {
            const list = await window.fs.readdir(vfsDir);
            for (const item of list) {
              const childPath = window.fs.join(vfsDir, item);
              const childStat = await window.fs.stat(childPath);
              if (childStat.isDirectory()) {
                await addDirToZip(childPath, zipFolder.folder(item));
              } else {
                const data = await window.fs.readFile(childPath);
                zipFolder.file(item, data);
              }
            }
          }
          await addDirToZip(norm, zip);
          const blob = await zip.generateAsync({ type: 'blob' });
          triggerBlobDownload(blob, `${st.name}.zip`);
          showToast(`已导出 ${st.name}.zip`, 'success');
        } else {
          const buf = await window.fs.readFile(norm);
          const mime = getMimeType(st.name);
          const blob = new Blob([buf], { type: mime });
          triggerBlobDownload(blob, st.name);
          showToast(`已导出文件 ${st.name}`, 'success');
        }
      } catch (err) {
        showToast(`导出失败: ${err.message}`, 'error');
      }
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 6000);
    }

    // =========================================================================
    // 反向导入 (物理桌面 -> 虚拟桌面/文件夹)：递归 webkitGetAsEntry + 循环 readEntries
    // 严禁使用 Buffer.from()，统一使用 await file.arrayBuffer()
    // =========================================================================
    async function readAllDirectoryEntries(dirReader) {
      const allEntries = [];
      while (true) {
        const batch = await new Promise((resolve, reject) => {
          dirReader.readEntries(resolve, reject);
        });
        if (!batch || batch.length === 0) break;
        allEntries.push(...batch);
      }
      return allEntries;
    }

    async function importFileSystemEntry(entry, targetDir) {
      if (!entry) return;
      const destPath = window.fs.join(targetDir, entry.name);
      if (entry.isFile) {
        const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
        const arrayBuffer = await file.arrayBuffer();
        await window.fs.writeFile(destPath, arrayBuffer);
      } else if (entry.isDirectory) {
        await window.fs.mkdir(destPath);
        const reader = entry.createReader();
        const children = await readAllDirectoryEntries(reader);
        for (const child of children) {
          await importFileSystemEntry(child, destPath);
        }
      }
    }

    async function handleExternalDataTransferDrop(dataTransfer, targetDir = '/Desktop', dropPosition = null) {
      const items = dataTransfer.items ? Array.from(dataTransfer.items) : [];
      const entries = [];
      for (const item of items) {
        if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
          const entry = item.webkitGetAsEntry();
          if (entry) entries.push(entry);
        }
      }
      if (entries.length > 0) {
        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i];
          if (targetDir === '/Desktop' && dropPosition) {
            const iconPath = window.fs.join('/Desktop', entry.name);
            SysConfig.state.desktopPositions[iconPath] = {
              x: Math.max(12, dropPosition.x + i * 24),
              y: Math.max(12, dropPosition.y + i * 24)
            };
          }
          await importFileSystemEntry(entry, targetDir);
        }
        SysConfig.save();
        showToast(`已成功导入 ${entries.length} 个项目到 ${targetDir}`, 'success');
        return true;
      }

      // 回退到 dataTransfer.files
      const files = dataTransfer.files ? Array.from(dataTransfer.files) : [];
      if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const destPath = window.fs.join(targetDir, f.name);
          if (targetDir === '/Desktop' && dropPosition) {
            SysConfig.state.desktopPositions[destPath] = {
              x: Math.max(12, dropPosition.x + i * 24),
              y: Math.max(12, dropPosition.y + i * 24)
            };
          }
          const arrayBuffer = await f.arrayBuffer();
          await window.fs.writeFile(destPath, arrayBuffer);
        }
        SysConfig.save();
        showToast(`已导入 ${files.length} 个文件到 ${targetDir}`, 'success');
        return true;
      }
      return false;
    }

    // =========================================================================
    // 全格式解压引擎 (.zip, .tar, .gz, .tar.gz, .tgz, .7z) 写入 OPFS/VFS
    // =========================================================================
    async function gunzipBuffer(arrayBuffer) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('当前浏览器不支持原生 DecompressionStream');
      }
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([arrayBuffer]).stream().pipeThrough(ds);
      return await new Response(stream).arrayBuffer();
    }

    async function untarBufferToVFS(tarArrayBuffer, outDir) {
      const bytes = new Uint8Array(tarArrayBuffer);
      let offset = 0;
      const decoder = new TextDecoder('utf-8');
      await window.fs.mkdir(outDir);

      while (offset + 512 <= bytes.length) {
        const header = bytes.subarray(offset, offset + 512);
        // 检查是否为空块
        let isZero = true;
        for (let i = 0; i < 512; i++) {
          if (header[i] !== 0) { isZero = false; break; }
        }
        if (isZero) break;

        const rawName = decoder.decode(header.subarray(0, 100)).replace(/\0.*$/, '').trim();
        const sizeOctal = decoder.decode(header.subarray(124, 136)).replace(/\0.*$/, '').trim();
        const typeFlag = String.fromCharCode(header[156]);
        const size = parseInt(sizeOctal, 8) || 0;
        offset += 512;

        if (rawName) {
          const destPath = window.fs.join(outDir, rawName);
          if (typeFlag === '5' || rawName.endsWith('/')) {
            await window.fs.mkdir(destPath);
          } else if (typeFlag === '0' || typeFlag === '\0' || typeFlag === '') {
            const fileData = bytes.slice(offset, offset + size).buffer;
            await window.fs.writeFile(destPath, fileData);
          }
        }
        offset += Math.ceil(size / 512) * 512;
      }
    }

    async function extractArchiveInVFS(archivePath, customTargetDir = null) {
      try {
        const norm = window.fs.normalizePath(archivePath);
        const filename = window.fs.basename(norm);
        const ext = getExt(filename);
        const baseFolderName = filename.replace(/\.(tar\.gz|tgz|zip|tar|gz|7z)$/i, '') || (filename + '_extracted');
        const outDir = customTargetDir || window.fs.join(window.fs.dirname(norm), baseFolderName);

        showToast(`正在解压 ${filename} 到 ${outDir}...`);
        const buf = await window.fs.readFile(norm);

        if (ext === 'zip') {
          if (typeof JSZip === 'undefined') throw new Error('JSZip 库未加载');
          const zip = await JSZip.loadAsync(buf);
          await window.fs.mkdir(outDir);
          const entries = Object.keys(zip.files);
          for (const relName of entries) {
            const zipObj = zip.files[relName];
            const dest = window.fs.join(outDir, relName);
            if (zipObj.dir) {
              await window.fs.mkdir(dest);
            } else {
              const content = await zipObj.async('arraybuffer');
              await window.fs.writeFile(dest, content);
            }
          }
        } else if (ext === 'tar') {
          await untarBufferToVFS(buf, outDir);
        } else if (ext === 'tar.gz' || ext === 'tgz') {
          const tarBuf = await gunzipBuffer(buf);
          await untarBufferToVFS(tarBuf, outDir);
        } else if (ext === 'gz') {
          const rawBuf = await gunzipBuffer(buf);
          await window.fs.mkdir(outDir);
          const outFile = filename.replace(/\.gz$/i, '') || 'decompressed.bin';
          await window.fs.writeFile(window.fs.join(outDir, outFile), rawBuf);
        } else if (ext === '7z') {
          if (!window.SevenZipFactory) throw new Error('7z-wasm 引擎正在加载或不可用');
          const sevenZip = await window.SevenZipFactory();
          const workDir = '/work_' + Date.now();
          sevenZip.FS.mkdir(workDir);
          const archiveInWasm = `${workDir}/${filename}`;
          sevenZip.FS.writeFile(archiveInWasm, new Uint8Array(buf));
          sevenZip.callMain(['x', archiveInWasm, `-o${workDir}/out`, '-y']);

          async function syncWasmDirToVFS(wasmPath, vfsTarget) {
            await window.fs.mkdir(vfsTarget);
            const names = sevenZip.FS.readdir(wasmPath).filter(n => n !== '.' && n !== '..');
            for (const n of names) {
              const fullWasm = `${wasmPath}/${n}`;
              const stat = sevenZip.FS.stat(fullWasm);
              const fullVfs = window.fs.join(vfsTarget, n);
              if (sevenZip.FS.isDir(stat.mode)) {
                await syncWasmDirToVFS(fullWasm, fullVfs);
              } else {
                const fileBytes = sevenZip.FS.readFile(fullWasm);
                await window.fs.writeFile(fullVfs, fileBytes.buffer);
              }
            }
          }
          await syncWasmDirToVFS(`${workDir}/out`, outDir);
        } else {
          throw new Error(`暂不支持该归档格式: .${ext}`);
        }

        window.fs.emitChange(window.fs.dirname(outDir));
        showToast(`解压完成: ${outDir}`, 'success');
        return outDir;
      } catch (err) {
        showToast(`解压失败: ${err.message}`, 'error');
        throw err;
      }
    }

    /* =========================================================================
       6. File System Access API 本地目录挂载 (/mnt/local/文件夹名)
       ========================================================================= */
    async function mountLocalFolderInteractive() {
      if (typeof window.showDirectoryPicker !== 'function') {
        showToast('当前浏览器环境或内嵌沙箱不支持 showDirectoryPicker API', 'error');
        return null;
      }
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const mountPath = window.fs.join('/mnt/local', dirHandle.name);
        const backend = new HandleDirectoryBackend(dirHandle, `LOCAL:${dirHandle.name}`);
        await window.fs.mountBackend(mountPath, backend, dirHandle);
        showToast(`已将本地目录挂载至 ${mountPath}`, 'success');
        return mountPath;
      } catch (err) {
        if (err && err.name !== 'AbortError') {
          showToast(`挂载取消或失败: ${err.message}`, 'error');
        }
        return null;
      }
    }

    async function checkSavedLocalMountsOnBoot() {
      const saved = await MountIDB.getAllMounts();
      if (!saved || saved.length === 0) return;

      const pending = [];
      for (const item of saved) {
        if (!item.handle) continue;
        try {
          const perm = await item.handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            const backend = new HandleDirectoryBackend(item.handle, `LOCAL:${item.name}`);
            await window.fs.mountBackend(item.mountPath, backend, item.handle);
          } else {
            pending.push(item);
          }
        } catch (e) {
          pending.push(item);
        }
      }

      if (pending.length > 0) {
        const banner = document.getElementById('mount-restore-banner');
        const text = document.getElementById('mount-restore-text');
        const names = pending.map(p => p.name).join('、');
        text.textContent = `检测到上次挂载的本地文件夹 [${names}]，刷新页面后需点击确认以恢复 /mnt/local 读写权限。`;
        banner.classList.remove('hidden');

        document.getElementById('btn-restore-mounts').onclick = async () => {
          for (const item of pending) {
            try {
              const perm = await item.handle.requestPermission({ mode: 'readwrite' });
              if (perm === 'granted') {
                const backend = new HandleDirectoryBackend(item.handle, `LOCAL:${item.name}`);
                await window.fs.mountBackend(item.mountPath, backend, item.handle);
                showToast(`已恢复挂载: ${item.mountPath}`, 'success');
              }
            } catch (e) {
              showToast(`恢复 ${item.name} 失败: ${e.message}`, 'error');
            }
          }
          banner.classList.add('hidden');
        };
        document.getElementById('btn-dismiss-mounts').onclick = () => {
          banner.classList.add('hidden');
        };
      }
    }

    /* =========================================================================
       7. 构建真实可引导 x86 512B 扇区镜像 + 初始 OPFS 种子数据
       ========================================================================= */
    function buildBootableX86SectorImage() {
      // 16-bit x86 实模式引导扇区 (0x7C00): 清屏并打印 KRONOS // SOLENOID x86 TELEMETRY OS
      const buf = new Uint8Array(512);
      const msg = [
        "==================================================\r\n",
        "  KRONOS // SOLENOID-VITREOUS x86 REALMODE KERNEL \r\n",
        "  OPFS VIRTUAL MACHINE HYPERVISOR (V86 0.5.319)   \r\n",
        "==================================================\r\n\r\n",
        "  [OK] SEABIOS VECTOR INITIALIZED AT 0x7C00\r\n",
        "  [OK] SOLENOID TELEMETRY BUS ONLINE\r\n",
        "  [OK] POINTER LOCK & VGA FRAMEBUFFER ACTIVE\r\n\r\n",
        "  Type any key on keyboard to echo in x86 console:\r\n  > "
      ].join("");

      // 机器码:
      // cli; xor ax, ax; mov ds, ax; mov es, ax;
      // mov si, 0x7c30;
      // .loop: lodsb; test al, al; jz .keyloop; mov ah, 0x0e; mov bx, 0x000b; int 0x10; jmp .loop
      // .keyloop: xor ah, ah; int 0x16; mov ah, 0x0e; int 0x10; jmp .keyloop
      const code = [
        0xFA,             // cli
        0x31, 0xC0,       // xor ax, ax
        0x8E, 0xD8,       // mov ds, ax
        0x8E, 0xC0,       // mov es, ax
        0xBE, 0x30, 0x7C, // mov si, 0x7c30
        // .loop (0x0A):
        0xAC,             // lodsb
        0x84, 0xC0,       // test al, al
        0x74, 0x09,       // jz .keyloop (+9 -> 0x18)
        0xB4, 0x0E,       // mov ah, 0x0e
        0xBB, 0x0B, 0x00, // mov bx, 0x000b
        0xCD, 0x10,       // int 0x10
        0xEB, 0xF1,       // jmp .loop
        // .keyloop (0x18):
        0x30, 0xE4,       // xor ah, ah
        0xCD, 0x16,       // int 0x16 (wait for key)
        0xB4, 0x0E,       // mov ah, 0x0e
        0xCD, 0x10,       // int 0x10 (echo key)
        0xEB, 0xF6        // jmp .keyloop
      ];
      code.forEach((b, idx) => { buf[idx] = b; });
      const msgBytes = new TextEncoder().encode(msg);
      msgBytes.forEach((b, idx) => {
        if (0x30 + idx < 510) buf[0x30 + idx] = b;
      });
      // MBR Boot Signature 0x55 0xAA
      buf[510] = 0x55;
      buf[511] = 0xAA;
      return buf.buffer;
    }

          const dy = e.clientY - startY;

            el.style.height = `${desktopRect.height}px`;

          } else if (pendingSnap === 'right') {
            meta.restoreRect = { left: origLeft, top: origTop, width: el.offsetWidth, height: el.offsetHeight };
            meta.snapped = true;
            el.style.left = `${Math.floor(desktopRect.width / 2)}px`;
            el.style.top = '0px';
            el.style.width = `${Math.ceil(desktopRect.width / 2)}px`;
            el.style.height = `${desktopRect.height}px`;

            rStartY = e.clientY;

            if (!resizing) return;
            const dx = e.clientX - rStartX;
            const dy = e.clientY - rStartY;
            let { left, top, width, height } = startRect;
            const minW = 280, minH = 180;

            if (dir.includes('e')) width = Math.max(minW, startRect.width + dx);
            if (dir.includes('s')) height = Math.max(minH, startRect.height + dy);
            if (dir.includes('w')) {
              const possibleW = startRect.width - dx;
              if (possibleW >= minW) {
                width = possibleW;
                left = startRect.left + dx;
              }
            }
            if (dir.includes('n')) {
              const possibleH = startRect.height - dy;
              if (possibleH >= minH && startRect.top + dy >= 0) {
                height = possibleH;
                top = startRect.top + dy;
              }

            el.style.top = `${top}px`;

            el.style.height = `${height}px`;

        if (meta.onResize) setTimeout(() => meta.onResize(), 30);
      },

      toggleMaximize(id, forceMax = null) {
        const meta = this.windows.get(id);
        if (!meta) return;
        const shouldMax = forceMax !== null ? forceMax : !meta.maximized;
        if (shouldMax) {
          if (!meta.maximized && !meta.snapped) {
            meta.restoreRect = {
              left: meta.el.offsetLeft,
              top: meta.el.offsetTop,
              width: meta.el.offsetWidth,
              height: meta.el.offsetHeight
            };
          }
          meta.maximized = true;
          meta.snapped = false;
          meta.el.classList.add('maximized');
        } else {
          meta.maximized = false;
          meta.snapped = false;
          meta.el.classList.remove('maximized');
          meta.el.style.left = `${meta.restoreRect.left}px`;
          meta.el.style.top = `${meta.restoreRect.top}px`;
          meta.el.style.width = `${meta.restoreRect.width}px`;
          meta.el.style.height = `${meta.restoreRect.height}px`;
        }
        if (meta.onResize) setTimeout(() => meta.onResize(), 30);
      },

      closeWindow(id) {
        const meta = this.windows.get(id);
        if (!meta) return;
        if (typeof meta.onClose === 'function') {
          try { meta.onClose(); } catch (e) {}
        }
        meta.el.remove();
        this.windows.delete(id);
        if (this.activeId === id) {
          this.activeId = null;
        }
        this.renderTaskbar();
      },

      toggleShowDesktop() {
        const openMetas = Array.from(this.windows.values());
        const anyVisible = openMetas.some(w => !w.minimized);
        if (anyVisible) {
          this.allMinimizedSnapshot = openMetas.filter(w => !w.minimized).map(w => w.id);
          for (const w of openMetas) {
            w.minimized = true;
            w.el.classList.add('minimized');
          }
          this.activeId = null;
        } else if (this.allMinimizedSnapshot && this.allMinimizedSnapshot.length) {
          for (const id of this.allMinimizedSnapshot) {
            const w = this.windows.get(id);
            if (w) {
              w.minimized = false;
              w.el.classList.remove('minimized');
            }
          }
          this.allMinimizedSnapshot = null;
        }
        this.renderTaskbar();
      },

      renderTaskbar() {
        const container = document.getElementById('taskbar-apps');
        container.innerHTML = '';
        for (const [id, meta] of this.windows.entries()) {
          const item = document.createElement('div');
          const isActive = this.activeId === id && !meta.minimized;
          item.className = `taskbar-item ${isActive ? 'active' : ''}`;
          item.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <span class="w-4 h-4 flex-shrink-0 flex items-center justify-center">${meta.icon}</span>
              <span class="tb-title truncate">${escapeHtml(meta.title)}</span>
            </div>
            <button class="tb-close" title="关闭窗口">${ICONS.winClose}</button>
          `;

          // 点击任务栏：若最小化则恢复，若已置顶则最小化，否则置顶
          item.addEventListener('click', (e) => {
            if (e.target.closest('.tb-close')) return;
            if (meta.minimized) {
              this.restoreWindow(id);
            } else if (this.activeId === id) {
              this.minimizeWindow(id);
            } else {
              this.focusWindow(id);
            }
          });

          // 任务栏关闭按钮
          item.querySelector('.tb-close').addEventListener('click', (e) => {
            e.stopPropagation();
            this.closeWindow(id);
          });

          // Aero Peek 单个窗口悬停透视
          item.addEventListener('mouseenter', () => {
            if (!SysConfig.state.aeroEffects) return;
            document.body.classList.add('aero-peek-single');
            meta.el.classList.add('peek-highlight');
          });
          item.addEventListener('mouseleave', () => {
            document.body.classList.remove('aero-peek-single');
            meta.el.classList.remove('peek-highlight');
          });

          container.appendChild(item);
        }
      }
    };

    // Aero Peek 右侧透视条绑定
    const aeroStrip = document.getElementById('aero-peek-strip');
    aeroStrip.addEventListener('mouseenter', () => {
      if (SysConfig.state.aeroEffects) {
        document.body.classList.add('aero-peek-all');
      }
    });
    aeroStrip.addEventListener('mouseleave', () => {
      document.body.classList.remove('aero-peek-all');
    });
    aeroStrip.addEventListener('click', () => {
      document.body.classList.remove('aero-peek-all');
      WindowManager.toggleShowDesktop();
    });

    /* =========================================================================
       9. 右键上下文菜单系统 (ContextMenu)
       ========================================================================= */
    const ContextMenu = {
      el: document.getElementById('context-menu'),
      show(x, y, items) {
        this.el.innerHTML = '';
        for (const item of items) {
          if (item.separator) {
            const sep = document.createElement('div');
            sep.className = 'ctx-sep';
            this.el.appendChild(sep);
            continue;
          }
          const row = document.createElement('div');
          row.className = `ctx-item ${item.danger ? 'danger' : ''}`;
          row.innerHTML = `
            <span>${escapeHtml(item.label)}</span>
            <span class="text-[10px] font-mono opacity-65">${escapeHtml(item.shortcut || '')}</span>
          `;
          row.addEventListener('click', (e) => {
            e.stopPropagation();
            this.hide();
            if (typeof item.action === 'function') item.action();
          });
          this.el.appendChild(row);
        }
        this.el.style.display = 'block';
        const rect = this.el.getBoundingClientRect();
        const posX = Math.min(x, window.innerWidth - rect.width - 8);
        const posY = Math.min(y, window.innerHeight - rect.height - 8);
        this.el.style.left = `${Math.max(4, posX)}px`;
        this.el.style.top = `${Math.max(4, posY)}px`;
      },
      hide() {
        this.el.style.display = 'none';
      }
    };

    window.addEventListener('click', () => ContextMenu.hide());

    /* =========================================================================
       10. 智能文件与目录分派器 (Section 8.5 & .HTML 双入口支持)
       ========================================================================= */
    let clipboardVFS = { mode: null, paths: [] }; // mode: 'copy' | 'cut'

    async function openVFSPath(path, options = {}) {
      try {
        const norm = window.fs.normalizePath(path);
        const st = await window.fs.stat(norm);

        // 8.5: 如果是目录，在文件管理器中导航进入该文件夹
        if (st.isDirectory()) {
          if (options.explorerInstance) {
            options.explorerInstance.navigateTo(norm);
          } else {
            openFileExplorerApp(norm);
          }
          return;
        }

        const ext = getExt(st.name);

        // 强制指定打开方式
        if (options.openWith === 'editor') {
          openHtmlEditorApp(norm);
          return;
        }
        if (options.openWith === 'notepad') {
          openNotepadApp(norm);
          return;
        }
        if (options.openWith === 'browser') {
          openWebBrowserApp(norm);
          return;
        }
        if (options.openWith === 'manga') {
          openMangaViewerApp(norm);
          return;
        }
        if (options.openWith === 'table') {
          openTableApp(norm);
          return;
        }

        // .html / .htm 专用交互：弹出双入口选择或直接无缝衔接「系统浏览器打开」与「编辑源代码(实时预览)」
        if (ext === 'html' || ext === 'htm') {
          showHtmlLaunchDialog(norm);
          return;
        }

        // 表格文件 (.csv / .tsv) -> 双视图表格应用
        if (TABLE_EXTS.has(ext)) {
          openTableApp(norm);
          return;
        }

        // 图片文件 -> 漫画阅读器 (支持同目录自然排序条漫流 + 缩放 + 全屏)
        if (IMAGE_EXTS.has(ext)) {
          openMangaViewerApp(norm);
          return;
        }

        // 音视频文件 -> 媒体工作站
        if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext)) {
          openMediaPlayerApp(norm);
          return;
        }

        // PDF 文件 -> 内置 PDF 预览器
        if (ext === 'pdf') {
          openPdfViewerApp(norm);
          return;
        }

        // 压缩包 (.zip, .tar, .gz, .tgz, .tar.gz, .7z) -> 解压到当前目录
        if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') {
          const outDir = await extractArchiveInVFS(norm);
          openFileExplorerApp(outDir);
          return;
        }

        // 虚拟机镜像 (.iso, .img, .fda, .bin) -> V86 虚拟机
        if (VM_EXTS.has(ext)) {
          openV86App(norm);
          return;
        }

        // 代码文件 -> 支持记事本或 HTML 编辑器
        if (CODE_EXTS.has(ext) || TEXT_EXTS.has(ext)) {
          openNotepadApp(norm);
          return;
        }

        // 其他任何未知 MIME 类型 -> 至少提供以纯文本形式打开
        openNotepadApp(norm);
      } catch (err) {
        showToast(`无法打开 ${path}: ${err.message}`, 'error');
      }
    }

    // .HTML 文件专用交互选择器：1. 在系统浏览器中打开  2. 编辑源代码（带实时预览）

              <span class="font-bold text-xs">1. 在系统浏览器中打开</span>
