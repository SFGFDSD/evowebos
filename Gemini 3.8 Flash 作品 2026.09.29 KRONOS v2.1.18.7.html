                <div class="flex items-center gap-1">
                  <input type="text" class="ide-replace-input w-40 px-2 py-1 bg-[var(--bg-input)] border border-[var(--border-subtle)] focus:border-[var(--accent-amber)] outline-none font-mono text-xs" placeholder="替换为..." />
                  <button class="ide-replace-one px-2 py-0.5 border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] cursor-pointer">替换</button>
                  <button class="ide-replace-all px-2 py-0.5 border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] cursor-pointer">替换全部</button>
                </div>
                <button class="ide-find-close ml-auto px-2 py-0.5 border border-[var(--border-subtle)] hover:bg-[var(--accent-crimson)] hover:text-white cursor-pointer" title="Esc 关闭">关闭</button>
              </div>

              <!-- Split Workspace: Left CodeMirror Editor + Draggable Splitter + Right Isolated Preview -->
              <div class="ide-split-container flex-1 flex overflow-hidden relative w-full">
                <!-- Left Editor Pane (min-width: 200px) -->
                <div class="ide-left-pane h-full overflow-hidden flex flex-col" style="width: 54%; min-width: 200px;">
                  <textarea class="ide-textarea"></textarea>
                </div>

                <!-- Draggable Splitter -->
                <div class="ide-splitter w-2 h-full bg-[var(--bg-panel-alt)] border-x border-[var(--border-hairline)] hover:bg-[var(--accent-amber)] cursor-col-resize flex items-center justify-center flex-shrink-0 transition-colors">
                  <div class="w-0.5 h-8 bg-[var(--fg-muted)]"></div>
                </div>

                <!-- Right Live Preview Pane (min-width: 120px) -->
                <div class="ide-right-pane flex-1 h-full flex flex-col overflow-hidden bg-white" style="min-width: 120px;">
                  <div class="h-6 px-2.5 bg-[#0e131d] border-b border-[var(--border-hairline)] flex items-center justify-between text-[10px] font-mono text-[#9aa5b8]">
                    <span>SANDBOX LIVE PREVIEW // 实时隔离渲染</span>
                    <span class="ide-file-indicator truncate max-w-[200px]">${escapeHtml(window.fs.join(sourceDir, currentFileName))}</span>
                  </div>
                  <iframe class="ide-preview-iframe flex-1 w-full h-full border-0 bg-white"
                          sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox"></iframe>
                </div>
              </div>

              <!-- Bottom Status Bar -->
              <div class="h-6 px-3 bg-[var(--bg-panel-alt)] border-t border-[var(--border-hairline)] flex items-center justify-between text-[11px] font-mono text-[var(--fg-secondary)]">
                <div class="flex items-center gap-3">
                  <span class="ide-stat-cursor">行 1, 列 1</span>
                  <span class="ide-stat-selection hidden text-[var(--accent-cyan)]">已选 0 字符</span>
                  <span class="ide-stat-totals">共 1 行, 0 字符</span>
                </div>
                <div class="flex items-center gap-3">
                  <span class="ide-stat-lang text-[var(--accent-amber)]">${escapeHtml(MODE_LABELS[currentMode] || 'HTML')}</span>
                  <span>UTF-8</span>
                </div>
              </div>
            </div>
          `;

          const modeSelect = bodyEl.querySelector('.ide-mode-select');
          const textareaEl = bodyEl.querySelector('.ide-textarea');
          const previewIframe = bodyEl.querySelector('.ide-preview-iframe');
          const leftPane = bodyEl.querySelector('.ide-left-pane');
          const splitContainer = bodyEl.querySelector('.ide-split-container');
          const splitter = bodyEl.querySelector('.ide-splitter');
          const fileIndicator = bodyEl.querySelector('.ide-file-indicator');

          // Status Bar Elements
          const statCursor = bodyEl.querySelector('.ide-stat-cursor');
          const statSelection = bodyEl.querySelector('.ide-stat-selection');
          const statTotals = bodyEl.querySelector('.ide-stat-totals');
          const statLang = bodyEl.querySelector('.ide-stat-lang');

          // Find & Replace Bar Elements
          const findBar = bodyEl.querySelector('.ide-find-bar');
          const findInput = bodyEl.querySelector('.ide-find-input');
          const replaceInput = bodyEl.querySelector('.ide-replace-input');
          const matchCountEl = bodyEl.querySelector('.ide-match-count');
          const btnCase = bodyEl.querySelector('.ide-opt-case');
          const btnWord = bodyEl.querySelector('.ide-opt-word');
          const btnRegex = bodyEl.querySelector('.ide-opt-regex');

          modeSelect.value = currentMode;
          textareaEl.value = initialCode;

          // 1. 初始化 CodeMirror 5.65.x
          cmInstance = CodeMirror.fromTextArea(textareaEl, {
            mode: currentMode,
            theme: 'material-darker',
            lineNumbers: true,
            lineWrapping: true,
            styleActiveLine: true,
            showTrailingSpace: true,
            matchBrackets: true,
            autoCloseBrackets: true,
            matchTags: { bothTags: true },
            autoCloseTags: true,
            foldGutter: true,
            gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
            extraKeys: {
              'Ctrl-Enter': () => updatePreview(),
              'Cmd-Enter': () => updatePreview(),
              'Ctrl-Shift-F': () => formatCode(),
              'Cmd-Shift-F': () => formatCode(),
              'Ctrl-F': () => openFindBar(false),
              'Cmd-F': () => openFindBar(false),
              'Ctrl-H': () => openFindBar(true),
              'Cmd-H': () => openFindBar(true),
              'F3': () => navigateMatch(1),
              'Shift-F3': () => navigateMatch(-1),
              'Ctrl-S': () => saveToVFS(),
              'Cmd-S': () => saveToVFS(),
              'Esc': () => closeFindBar()
            }
          });

          setTimeout(() => cmInstance && cmInstance.refresh(), 50);

          // 3. 实时预览渲染（向 iframe.contentDocument 写入，异常时回退为 Blob URL）
          function buildPreviewHtml(raw) {
            if (currentMode === 'css') {
              return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${raw}</style></head><body><div style="padding:16px;font-family:sans-serif;"><h3>CSS 样式预览画布</h3><p>在此检查选择器与样式规则效果。</p><button>示例按钮</button></div></body></html>`;
            }
            if (currentMode === 'javascript') {
              return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{background:#0b0f17;color:#2dd4bf;font-family:monospace;padding:16px;}</style></head><body><div id="out"><h4>JavaScript 控制台输出：</h4></div><script>
                const out = document.getElementById('out');
                const origLog = console.log;
                console.log = (...args) => {
                  origLog(...args);
                  const line = document.createElement('div');
                  line.textContent = '> ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
                  out.appendChild(line);
                };
                try { ${raw} } catch(e) { console.log('Error:', e.message); }
              <\/script></body></html>`;
            }
            if (currentMode === 'markdown') {
              const escaped = escapeHtml(raw)
                .replace(/^### (.*)$/gm, '<h3>$1</h3>')
                .replace(/^## (.*)$/gm, '<h2>$1</h2>')
                .replace(/^# (.*)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code style="background:#1e293b;padding:2px 5px;color:#e59a3c;">$1</code>')
                .replace(/\n/g, '<br/>');
              return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{background:#0d121c;color:#eceae4;font-family:sans-serif;padding:24px;line-height:1.7;}h1,h2,h3{color:#e59a3c;border-bottom:1px solid rgba(229,154,60,0.3);padding-bottom:6px;}</style></head><body>${escaped}</body></html>`;
            }
            if (currentMode === 'application/json') {
              return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{background:#090d16;color:#2dd4bf;font-family:monospace;padding:20px;white-space:pre-wrap;}</style></head><body>${escapeHtml(raw)}</body></html>`;
            }
            return raw;
          }

          function updatePreview() {
            if (!cmInstance) return;
            const code = cmInstance.getValue();
            const htmlToRender = buildPreviewHtml(code);
            try {
              const doc = previewIframe.contentDocument || (previewIframe.contentWindow && previewIframe.contentWindow.document);
              if (!doc) throw new Error('No contentDocument');
              doc.open();
              doc.write(htmlToRender);
              doc.close();
            } catch (err) {
              // 写入异常时回退为 Blob URL 方式
              if (previewBlobUrl) URL.revokeObjectURL(previewBlobUrl);
              const blob = new Blob([htmlToRender], { type: 'text/html;charset=utf-8' });
              previewBlobUrl = URL.createObjectURL(blob);
              previewIframe.src = previewBlobUrl;
            }
          }

          // 14. 状态栏实时同步
          function updateStatusBar() {
            if (!cmInstance) return;
            const cur = cmInstance.getCursor();
            statCursor.textContent = `行 ${cur.line + 1}, 列 ${cur.ch + 1}`;
            const sel = cmInstance.getSelection();
            if (sel && sel.length > 0) {
              statSelection.textContent = `已选 ${sel.length} 字符`;
              statSelection.classList.remove('hidden');
            } else {
              statSelection.classList.add('hidden');
            }
            const val = cmInstance.getValue();
            statTotals.textContent = `共 ${cmInstance.lineCount()} 行, ${val.length} 字符`;
            statLang.textContent = MODE_LABELS[currentMode] || currentMode;
          }

          let previewDebounce = null;
          cmInstance.on('change', () => {
            updateStatusBar();
            clearTimeout(previewDebounce);
            previewDebounce = setTimeout(() => updatePreview(), 180);
            if (!findBar.classList.contains('hidden')) {
              runSearchHighlight(false);
            }
          });

          cmInstance.on('cursorActivity', () => {
            updateStatusBar();
          });

          // 2. 多语言模式切换
          function switchLanguageMode(nextMode) {
            currentMode = nextMode;
            modeSelect.value = currentMode;
            cmInstance.setOption('mode', currentMode);
            updateStatusBar();
            updatePreview();
          }

          modeSelect.addEventListener('change', () => {
            switchLanguageMode(modeSelect.value);
          });

          // 4. 代码格式化 (js-beautify，保留光标位置)
          function formatCode() {
            if (!cmInstance) return;
            const cursor = cmInstance.getCursor();
            const raw = cmInstance.getValue();
            const opts = {
              indent_size: 2,
              indent_char: ' ',
              indent_inner_html: true,
              wrap_line_length: 120,
              preserve_newlines: true,
              max_preserve_newlines: 2,
              end_with_newline: true
            };
            try {
              let formatted = raw;
              if (currentMode === 'htmlmixed' || currentMode === 'xml') {
                if (typeof window.html_beautify === 'function') formatted = window.html_beautify(raw, opts);
              } else if (currentMode === 'css') {
                if (typeof window.css_beautify === 'function') formatted = window.css_beautify(raw, opts);
              } else if (currentMode === 'javascript' || currentMode === 'application/json') {
                if (typeof window.js_beautify === 'function') formatted = window.js_beautify(raw, opts);
              }
              cmInstance.setValue(formatted);
              cmInstance.setCursor(cursor);
              showToast('代码已格式化', 'success');
            } catch (err) {
              showToast(`格式化失败: ${err.message}`, 'error');
            }
          }

          // 5. 折叠全部 / 展开全部
          function foldAllLines(shouldFold) {
            if (!cmInstance) return;
            const action = shouldFold ? 'fold' : 'unfold';
            cmInstance.operation(() => {
              for (let i = 0; i < cmInstance.lineCount(); i++) {
                cmInstance.foldCode(CodeMirror.Pos(i, 0), null, action);
              }
            });
          }

          // 6. 查找与替换实现 (markText 高亮当前匹配与其余匹配)
          function clearSearchMarks() {
            for (const m of searchMarks) {
              try { m.clear(); } catch (e) {}
            }
            searchMarks = [];
            searchMatches = [];
          }

          function buildSearchRegex(query) {
            if (!query) return null;
            let source = useRegex ? query : query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (wholeWord) {
              source = `\\b(?:${source})\\b`;
            }
            const flags = caseSensitive ? 'g' : 'gi';
            return new RegExp(source, flags);
          }

          function runSearchHighlight(jumpToNearest = true) {
            clearSearchMarks();
            const q = findInput.value;
            if (!q) {
              matchCountEl.textContent = '0/0';
              activeMatchIdx = -1;
              return;
            }

            let regex;
            try {
              regex = buildSearchRegex(q);
            } catch (err) {
              matchCountEl.textContent = '无效正则';
              matchCountEl.style.color = 'var(--accent-crimson)';
              return;
            }
            matchCountEl.style.color = 'var(--accent-amber)';

            const lineCount = cmInstance.lineCount();
            for (let lineNo = 0; lineNo < lineCount; lineNo++) {
              const lineText = cmInstance.getLine(lineNo);
              regex.lastIndex = 0;
              let m;
              while ((m = regex.exec(lineText)) !== null) {
                if (m[0].length === 0) {
                  regex.lastIndex++;
                  continue;
                }
                searchMatches.push({
                  from: CodeMirror.Pos(lineNo, m.index),
                  to: CodeMirror.Pos(lineNo, m.index + m[0].length)
                });
              }
            }

            if (searchMatches.length === 0) {
              matchCountEl.textContent = '0/0';
              activeMatchIdx = -1;
              return;
            }

            if (jumpToNearest || activeMatchIdx < 0 || activeMatchIdx >= searchMatches.length) {
              activeMatchIdx = 0;
            }

            renderActiveSearchMarks(jumpToNearest);
          }

          function renderActiveSearchMarks(scrollIntoView = true) {
            for (const m of searchMarks) {
              try { m.clear(); } catch (e) {}
            }
            searchMarks = [];

            searchMatches.forEach((range, idx) => {
              const cls = idx === activeMatchIdx ? 'cm-search-match-active' : 'cm-search-match';
              const mark = cmInstance.markText(range.from, range.to, { className: cls });
              searchMarks.push(mark);
            });

            if (searchMatches.length > 0 && activeMatchIdx >= 0) {
              matchCountEl.textContent = `${activeMatchIdx + 1}/${searchMatches.length}`;
              if (scrollIntoView) {
                const target = searchMatches[activeMatchIdx];
                cmInstance.scrollIntoView(target, 80);
              }
            } else {
              matchCountEl.textContent = '0/0';
            }
          }

          function navigateMatch(step) {
            if (searchMatches.length === 0) {
              runSearchHighlight(true);
              return;
            }
            activeMatchIdx = (activeMatchIdx + step + searchMatches.length) % searchMatches.length;
            renderActiveSearchMarks(true);
          }

          function replaceCurrentMatch() {
            if (searchMatches.length === 0 || activeMatchIdx < 0) return;
            const target = searchMatches[activeMatchIdx];
            cmInstance.replaceRange(replaceInput.value, target.from, target.to);
            runSearchHighlight(false);
          }

          function replaceAllMatches() {
            if (searchMatches.length === 0) return;
            const replacement = replaceInput.value;
            cmInstance.operation(() => {
              for (let i = searchMatches.length - 1; i >= 0; i--) {
                const range = searchMatches[i];
                cmInstance.replaceRange(replacement, range.from, range.to);
              }
            });
            runSearchHighlight(false);
          }

          function openFindBar(focusReplace = false) {
            findBar.classList.remove('hidden');
            findBar.classList.add('flex');
            const sel = cmInstance.getSelection();
            if (sel && !sel.includes('\n')) {
              findInput.value = sel;
            }
            runSearchHighlight(true);
            if (focusReplace) replaceInput.focus();
            else findInput.focus();
          }

          function closeFindBar() {
            findBar.classList.add('hidden');
            findBar.classList.remove('flex');
            clearSearchMarks();
            cmInstance.focus();
          }

          function syncSearchOptionButtons() {
            const onCls = 'border-[var(--accent-cyan)] bg-[var(--accent-cyan)] text-black font-bold';
            const offCls = 'border-[var(--border-subtle)] text-[var(--fg-secondary)]';
            btnCase.className = `ide-opt-case px-1.5 py-0.5 border font-mono cursor-pointer ${caseSensitive ? onCls : offCls}`;
            btnWord.className = `ide-opt-word px-1.5 py-0.5 border font-mono cursor-pointer ${wholeWord ? onCls : offCls}`;
            btnRegex.className = `ide-opt-regex px-1.5 py-0.5 border font-mono cursor-pointer ${useRegex ? onCls : offCls}`;
          }

          btnCase.onclick = () => { caseSensitive = !caseSensitive; syncSearchOptionButtons(); runSearchHighlight(true); };
          btnWord.onclick = () => { wholeWord = !wholeWord; syncSearchOptionButtons(); runSearchHighlight(true); };
          btnRegex.onclick = () => { useRegex = !useRegex; syncSearchOptionButtons(); runSearchHighlight(true); };

          findInput.addEventListener('input', () => runSearchHighlight(true));
          findInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              navigateMatch(e.shiftKey ? -1 : 1);
            } else if (e.key === 'Escape') {
              closeFindBar();
            }
          });
          replaceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFindBar();
          });

          bodyEl.querySelector('.ide-find-prev').onclick = () => navigateMatch(-1);
          bodyEl.querySelector('.ide-find-next').onclick = () => navigateMatch(1);
          bodyEl.querySelector('.ide-replace-one').onclick = () => replaceCurrentMatch();
          bodyEl.querySelector('.ide-replace-all').onclick = () => replaceAllMatches();
          bodyEl.querySelector('.ide-find-close').onclick = () => closeFindBar();

          // 10. 保存到虚拟文件系统 (Ctrl+S)
          async function saveToVFS() {
            let targetName = currentFileName;
            if (!filePath && targetName === 'untitled.html') {
              const defaultExt = MODE_EXT_MAP[currentMode] || '.html';
              const asked = prompt('请输入保存到虚拟文件系统的文件名:', `作品_${Date.now().toString().slice(-4)}${defaultExt}`);
              if (!asked || !asked.trim()) return;
              targetName = asked.trim();
              currentFileName = targetName;
            }
            const saveDir = sourceDir || '/Desktop';
            const fullSavePath = window.fs.join(saveDir, currentFileName);
            try {
              await window.fs.writeFile(fullSavePath, cmInstance.getValue());
              filePath = fullSavePath;
              fileIndicator.textContent = fullSavePath;
              DesktopManager.render();
              refreshAllExplorerWindows();
              showToast(`已保存至 ${fullSavePath}`, 'success');
            } catch (err) {
              showToast(`保存失败: ${err.message}`, 'error');
            }
          }

          // 13. 可拖拽分割条 (编辑区最小宽度 200px，预览区最小宽度 120px，结束后刷新布局)
          let draggingSplit = false;
          splitter.addEventListener('pointerdown', (e) => {
            draggingSplit = true;
            splitter.setPointerCapture(e.pointerId);
            previewIframe.style.pointerEvents = 'none';
          });
          splitter.addEventListener('pointermove', (e) => {
            if (!draggingSplit) return;
            const rect = splitContainer.getBoundingClientRect();
            const totalW = rect.width;
            const splitterW = splitter.offsetWidth || 8;
            const minLeft = 200;
            const minRight = 120;
            const desiredLeft = Math.max(minLeft, Math.min(totalW - minRight - splitterW, e.clientX - rect.left));
            leftPane.style.width = `${desiredLeft}px`;
          });
          const endSplitDrag = () => {
            if (!draggingSplit) return;
            draggingSplit = false;
            previewIframe.style.pointerEvents = 'auto';
            if (cmInstance) cmInstance.refresh();
          };
          splitter.addEventListener('pointerup', endSplitDrag);
          splitter.addEventListener('pointercancel', endSplitDrag);

          // 工具栏按钮事件绑定
          bodyEl.querySelector('.ide-btn-run').onclick = () => updatePreview();
          bodyEl.querySelector('.ide-btn-refresh').onclick = () => updatePreview();
          bodyEl.querySelector('.ide-btn-format').onclick = () => formatCode();
          bodyEl.querySelector('.ide-btn-fold').onclick = () => foldAllLines(true);
          bodyEl.querySelector('.ide-btn-unfold').onclick = () => foldAllLines(false);
          bodyEl.querySelector('.ide-btn-find').onclick = () => openFindBar(false);
          bodyEl.querySelector('.ide-btn-undo').onclick = () => cmInstance.undo();
          bodyEl.querySelector('.ide-btn-redo').onclick = () => cmInstance.redo();

          const localInput = bodyEl.querySelector('.ide-file-input');
          bodyEl.querySelector('.ide-btn-import').onclick = () => {
            localInput.value = '';
            localInput.click();
          };
          localInput.onchange = async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const text = await file.text();
            currentFileName = file.name;
            fileIndicator.textContent = window.fs.join(sourceDir, currentFileName);
            const detected = detectEditorModeByFilename(file.name);
            cmInstance.setValue(text);
            switchLanguageMode(detected);
            showToast(`已载入本地文件: ${file.name}`, 'success');
          };

          bodyEl.querySelector('.ide-btn-export').onclick = () => {
            const ext = MODE_EXT_MAP[currentMode] || '.html';
            const base = currentFileName.replace(/\.[^.]+$/, '') || 'export_code';
            const blob = new Blob([cmInstance.getValue()], { type: 'text/plain;charset=utf-8' });
            triggerBlobDownload(blob, `${base}${ext}`);
          };

          bodyEl.querySelector('.ide-btn-save').onclick = () => saveToVFS();

          bodyEl.querySelector('.ide-btn-clear').onclick = () => {
            cmInstance.setValue('');
            cmInstance.focus();
          };

          bodyEl.querySelector('.ide-btn-newwin').onclick = () => {
            const htmlContent = buildPreviewHtml(cmInstance.getValue());
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
          };

          bodyEl.querySelector('.ide-btn-sysbrowser').onclick = async () => {
            await saveToVFS();
            openWebBrowserApp(window.fs.join(sourceDir, currentFileName));
          };

          updateStatusBar();
          updatePreview();
        }
      });
    }

    /* =========================================================================
       17. 内置应用 4.3.1：漫画阅读器 (Manga Viewer)
           同目录序列识别、自然数字排序、并行读取按序插入、定位点击页、容错、纯黑沉浸全屏
       ========================================================================= */
    async function openMangaViewerApp(clickedImagePath = '/Pictures/ChronosManga/1.svg') {
      const normClicked = window.fs.normalizePath(clickedImagePath);
      const lastSlash = normClicked.lastIndexOf('/');
      const dirPath = lastSlash <= 0 ? '/' : normClicked.slice(0, lastSlash);
      const clickedFileName = normClicked.slice(lastSlash + 1);

      // 1. 读取该目录下全部文件并过滤图片格式 (失败时弹出错误提示并终止)
      let allFiles;
      try {
        allFiles = await window.fs.readdir(dirPath);
      } catch (err) {
        alert(`目录读取失败 (${dirPath}): ${err.message}`);
        showToast(`目录读取失败: ${err.message}`, 'error');
        return;
      }

      const imageFiles = allFiles.filter(name => {
        const ext = getExt(name).toLowerCase();
        return IMAGE_EXTS.has(ext);
      });

      // 2. 自然数字排序 (1.jpg -> 2.jpg -> 10.jpg)
      imageFiles.sort(naturalCompare);

      if (imageFiles.length === 0) {
        showToast(`目录 ${dirPath} 下未找到任何可识别的图片文件`, 'error');
        return;
      }

      let zoomScale = 100;
      const createdBlobUrls = [];

      WindowManager.createWindow({
        title: `漫画阅读器 — ${dirPath} (${imageFiles.length} 页)`,
        type: 'manga',
        icon: ICONS.appManga,
        width: 860,
        height: 660,
        onClose() {
          for (const u of createdBlobUrls) {
            URL.revokeObjectURL(u);
          }
        },
        onMount(bodyEl, meta) {
          bodyEl.innerHTML = `
            <div class="manga-root relative flex flex-col w-full h-full bg-black select-none overflow-hidden">
              <!-- Top Control Bar (在全屏模式下会被隐藏) -->
              <div class="manga-toolbar flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-[var(--bg-panel-alt)] border-b border-[var(--border-hairline)] text-xs z-20">
                <div class="flex items-center gap-2 overflow-hidden">
                  <span class="font-mono text-[var(--accent-amber)] truncate">目录: ${escapeHtml(dirPath)}</span>
                  <span class="manga-load-progress px-2 py-0.5 bg-[var(--accent-cyan)]/15 text-[var(--accent-cyan)] font-mono text-[11px]">正在并行读取 ${imageFiles.length} 张图...</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <button class="manga-zoom-out px-2 py-1 border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] cursor-pointer" title="缩小">-</button>
                  <span class="manga-zoom-label font-mono text-[11px] w-12 text-center">100%</span>
                  <button class="manga-zoom-in px-2 py-1 border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] cursor-pointer" title="放大">+</button>
                  <button class="manga-enter-fs px-3 py-1 bg-[var(--accent-amber)] text-black font-bold cursor-pointer">全屏沉浸阅读</button>
                </div>
              </div>

              <!-- 悬浮右上角隐蔽退出全屏按钮 (仅全屏时显示，只保留此按钮与漫画本身) -->
              <button class="manga-fs-exit-btn hidden fixed top-3 right-4 z-[99999] w-9 h-9 rounded-full bg-black/60 hover:bg-black/90 border border-white/25 text-white/75 hover:text-white items-center justify-center cursor-pointer transition"
                      title="退出全屏沉浸模式">
                ${ICONS.winClose}
              </button>

              <!-- 3. 条漫式无限垂直滚动区 (纯黑 #000，居中排列所有图片) -->
              <div class="manga-scroll-area flex-1 w-full overflow-y-auto overflow-x-hidden bg-black flex flex-col items-center">
                <div class="manga-pages-track w-full max-w-[820px] flex flex-col items-center py-2"></div>
              </div>
            </div>
          `;

          const scrollArea = bodyEl.querySelector('.manga-scroll-area');
          const trackEl = bodyEl.querySelector('.manga-pages-track');
          const progressEl = bodyEl.querySelector('.manga-load-progress');
          const zoomLabel = bodyEl.querySelector('.manga-zoom-label');
          const exitFsBtn = bodyEl.querySelector('.manga-fs-exit-btn');

          // 预先按自然排序顺序在 DOM 中创建占位槽位，确保并行读取完成后严格按顺序插入
          const slots = imageFiles.map((fileName, idx) => {
            const slot = document.createElement('div');
            slot.className = 'manga-page-slot w-full flex flex-col items-center justify-center';
            slot.dataset.filename = fileName;
            slot.dataset.index = String(idx);
            trackEl.appendChild(slot);
            return { fileName, idx, slot };
          });

          // 4. 并行读取所有图片二进制数据，按序插入，单张读取失败时跳过不中断
          let loadedCount = 0;
          let failedCount = 0;

          const readTasks = slots.map(async ({ fileName, slot }) => {
            const fullImgPath = window.fs.join(dirPath, fileName);
            try {
              const buf = await window.fs.readFile(fullImgPath);
              const mime = getMimeType(fileName);
              const blob = new Blob([buf], { type: mime });
              const url = URL.createObjectURL(blob);
              createdBlobUrls.push(url);

              await new Promise((resolve) => {
                const img = new Image();
                img.className = 'w-full h-auto block select-none';
                img.alt = fileName;
                img.onload = () => {
                  slot.appendChild(img);
                  loadedCount++;
                  progressEl.textContent = `已加载 ${loadedCount}/${imageFiles.length} 页`;
                  resolve();
                };
                img.onerror = () => {
                  failedCount++;
                  slot.remove();
                  resolve();
                };
                img.src = url;
              });
            } catch (err) {
              // 6. 单张读取失败容错：跳过该失败项继续渲染其余图片
              failedCount++;
              slot.remove();
            }
          });

          Promise.all(readTasks).then(() => {
            progressEl.textContent = `共 ${loadedCount} 页 (${failedCount > 0 ? `跳过 ${failedCount} 异常项` : '自然序已就绪'})`;
            // 5. 定位到用户点击的具体图片位置
            const targetSlot = trackEl.querySelector(`.manga-page-slot[data-filename="${CSS.escape(clickedFileName)}"]`);
            if (targetSlot) {
              requestAnimationFrame(() => {
                targetSlot.scrollIntoView({ behavior: 'instant', block: 'start' });
              });
            }
          });

          // 缩放控制
          function applyZoom() {
            zoomLabel.textContent = `${zoomScale}%`;
            trackEl.style.maxWidth = `${Math.round(820 * (zoomScale / 100))}px`;
          }
          bodyEl.querySelector('.manga-zoom-out').onclick = () => {
            zoomScale = Math.max(40, zoomScale - 15);
            applyZoom();
          };
          bodyEl.querySelector('.manga-zoom-in').onclick = () => {
            zoomScale = Math.min(220, zoomScale + 15);
            applyZoom();
          };

          // 10. 全屏沉浸模式 (兼容浏览器原生 Fullscreen API 进入与退出两条路径，隐藏标题栏与一切杂项)
          let isImmersive = false;

          function setImmersiveUI(active) {
            isImmersive = active;
            meta.el.classList.toggle('manga-fullscreen-active', active);
            exitFsBtn.classList.toggle('hidden', !active);
            exitFsBtn.classList.toggle('flex', active);
          }

          async function enterImmersiveFullscreen() {
            setImmersiveUI(true);
            if (meta.el.requestFullscreen) {
              try { await meta.el.requestFullscreen(); } catch (e) {}
            }
          }

          async function exitImmersiveFullscreen() {
            setImmersiveUI(false);
            if (document.fullscreenElement) {
              try { await document.exitFullscreen(); } catch (e) {}
            }
          }

          bodyEl.querySelector('.manga-enter-fs').onclick = () => enterImmersiveFullscreen();
          exitFsBtn.onclick = (e) => {
            e.stopPropagation();
            exitImmersiveFullscreen();
          };

          document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isImmersive) {
              setImmersiveUI(false);
            }
          });
        }
      });
    }

            currentUrl = String(target || '').trim();

            if (pushHist) {
              historyList = historyList.slice(0, histPos + 1);
              historyList.push(currentUrl);
              histPos = historyList.length - 1;

            const vfsPath = currentUrl.startsWith('vfs://') ? currentUrl.slice(6) : currentUrl;
            if (vfsPath.startsWith('/')) {
              try {

            if (vfsPath.startsWith('/')) openHtmlEditorApp(vfsPath);
          };

          loadTarget(currentUrl, false);
        }

    /* =========================================================================
       19. 内置应用 4.5：科学计算器 (Calculator) 与 曜晶画板 (Paint Studio)
       ========================================================================= */
    function openCalculatorApp() {
      WindowManager.createWindow({
        title: '精密计算器 // CHRONO-CALC',
        type: 'calculator',
        icon: ICONS.appCalc,
        width: 340,
        height: 470,
        onMount(bodyEl) {
          bodyEl.innerHTML = `
            <div class="flex flex-col h-full w-full p-3 bg-[var(--bg-panel)] select-none">
              <div class="p-3 mb-3 bg-[var(--bg-input)] border border-[var(--border-hairline)] flex flex-col items-end justify-between h-24">
                <div class="calc-expr text-xs font-mono text-[var(--fg-secondary)] truncate w-full text-right h-5"></div>
                <div class="calc-display text-2xl font-mono font-bold text-[var(--accent-cyan)] truncate w-full text-right">0</div>
              </div>
              <div class="calc-grid grid grid-cols-4 gap-1.5 flex-1 font-mono text-sm"></div>
            </div>
          `;

          const exprEl = bodyEl.querySelector('.calc-expr');
          const dispEl = bodyEl.querySelector('.calc-display');
          const gridEl = bodyEl.querySelector('.calc-grid');

          const keys = [
            'C', '(', ')', 'DEL',
            'sin', 'cos', 'sqrt', '÷',
            '7', '8', '9', '×',
            '4', '5', '6', '-',
            '1', '2', '3', '+',
            '0', '.', 'π', '='
          ];

          let currentInput = '';

          function updateScreen(val) {
            dispEl.textContent = val || '0';
          }

          function evaluateInput() {
            if (!currentInput.trim()) return;
            try {
              exprEl.textContent = currentInput + ' =';
              const sanitized = currentInput
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/π/g, 'Math.PI')
                .replace(/sin\(/g, 'Math.sin(')
                .replace(/cos\(/g, 'Math.cos(')
                .replace(/sqrt\(/g, 'Math.sqrt(');
              const result = Function(`"use strict"; return (${sanitized})`)();
              const formatted = Number.isFinite(result) ? Number(result.toPrecision(12)).toString() : 'Error';
              currentInput = formatted === 'Error' ? '' : formatted;
              updateScreen(formatted);
            } catch (e) {
              updateScreen('SYNTAX ERR');
              currentInput = '';
            }
          }

          keys.forEach(k => {
            const btn = document.createElement('button');
            const isOp = ['÷', '×', '-', '+', '='].includes(k);
            const isFn = ['C', '(', ')', 'DEL', 'sin', 'cos', 'sqrt'].includes(k);
            btn.className = `border cursor-pointer transition flex items-center justify-center font-semibold ${
              k === '='
                ? 'bg-[var(--accent-amber)] text-black border-[var(--accent-amber)]'
                : isOp
                ? 'bg-[var(--accent-cyan)]/15 text-[var(--accent-cyan)] border-[var(--accent-cyan)]/40 hover:bg-[var(--accent-cyan)] hover:text-black'
                : isFn
                ? 'bg-[var(--bg-panel-alt)] text-[var(--accent-amber)] border-[var(--border-subtle)] hover:border-[var(--accent-amber)]'
                : 'bg-[var(--bg-input)] text-[var(--fg-primary)] border-[var(--border-subtle)] hover:border-[var(--accent-cyan)]'
            }`;
            btn.textContent = k;
            btn.onclick = () => {
              if (k === 'C') {
                currentInput = '';
                exprEl.textContent = '';
                updateScreen('0');
              } else if (k === 'DEL') {
                currentInput = currentInput.slice(0, -1);
                updateScreen(currentInput);
              } else if (k === '=') {
                evaluateInput();
              } else if (['sin', 'cos', 'sqrt'].includes(k)) {
                currentInput += `${k}(`;
                updateScreen(currentInput);
              } else {
                currentInput += k;
                updateScreen(currentInput);
              }
            };
            gridEl.appendChild(btn);
          });
        }
      });
    }

      WindowManager.createWindow({

          let tool = 'brush';
          let drawing = false;
          let startX = 0, startY = 0;
          let snapshot = null;

          const colorInp = bodyEl.querySelector('.pt-color');
          const sizeInp = bodyEl.querySelector('.pt-size');

          bodyEl.querySelectorAll('.pt-tool').forEach(btn => {
            btn.onclick = () => {
              tool = btn.dataset.tool;
              bodyEl.querySelectorAll('.pt-tool').forEach(b => {
                const active = b.dataset.tool === tool;
                b.className = `pt-tool px-2.5 py-1 border cursor-pointer ${
                  active ? 'border-[var(--accent-cyan)] bg-[var(--accent-cyan)] text-black font-semibold' : 'border-[var(--border-subtle)]'
                }`;
              });
            };
          });

          function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
              x: (e.clientX - rect.left) * (canvas.width / rect.width),
              y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
          }

          canvas.addEventListener('pointerdown', (e) => {
            drawing = true;
            canvas.setPointerCapture(e.pointerId);
            const pt = getCanvasCoords(e);
            startX = pt.x;
            startY = pt.y;
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
          });

          canvas.addEventListener('pointermove', (e) => {
            if (!drawing) return;
            const pt = getCanvasCoords(e);
            ctx.lineWidth = Number(sizeInp.value);
            ctx.lineCap = 'round';
            ctx.strokeStyle = tool === 'eraser' ? '#0f141f' : colorInp.value;

            if (tool === 'brush' || tool === 'eraser') {
              ctx.lineTo(pt.x, pt.y);
              ctx.stroke();
            } else if (tool === 'line') {
              ctx.putImageData(snapshot, 0, 0);
              ctx.beginPath();
              ctx.moveTo(startX, startY);
              ctx.lineTo(pt.x, pt.y);
              ctx.stroke();
            } else if (tool === 'rect') {
              ctx.putImageData(snapshot, 0, 0);
              ctx.strokeRect(startX, startY, pt.x - startX, pt.y - startY);
            }
          });

          const endDraw = () => { drawing = false; };
          canvas.addEventListener('pointerup', endDraw);
          canvas.addEventListener('pointercancel', endDraw);

          bodyEl.querySelector('.pt-clear').onclick = () => {
            ctx.fillStyle = '#0f141f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          };

          bodyEl.querySelector('.pt-save').onclick = async () => {
            const fileName = prompt('保存画作文件名:', `画板作品_${Date.now().toString().slice(-4)}.png`);
            if (!fileName) return;
            const dest = window.fs.join('/Desktop', fileName.endsWith('.png') ? fileName : fileName + '.png');
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            const buf = await blob.arrayBuffer();
            await window.fs.writeFile(dest, buf);
            showToast(`画作已保存至 ${dest}`, 'success');
          };

          if (filePath) {
            window.fs.readFile(filePath).then(buf => {
              const blob = new Blob([buf], { type: getMimeType(filePath) });
              const url = URL.createObjectURL(blob);
              const img = new Image();
              img.onload = () => {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
              };
              img.src = url;
            }).catch(() => {});
          }
        }
      });
    }

    /* =========================================================================
       21. 内置应用 6.1：V86 x86 虚拟机模拟器 (严格固定 0.5.319 与指定 BIOS Commit)
           包含强制 screen_container 结构 + 鼠标锁定 (Pointer Lock) + 扩展名智能挂载
       ========================================================================= */
    async function openV86App(initialImagePath = '/System/VM/kronos-boot.img') {
      let emulator = null;
      let currentImgPath = initialImagePath || '/System/VM/kronos-boot.img';

      WindowManager.createWindow({
        title: `V86 虚拟机工作站 (v0.5.319) — ${window.fs.basename(currentImgPath)}`,
        type: 'vm',
        icon: ICONS.appVm,
        width: 780,
        height: 540,
        onClose() {
          if (emulator && typeof emulator.destroy === 'function') {
            try { emulator.destroy(); } catch (e) {}
            emulator = null;
          }
        },
        onMount(bodyEl, meta) {
          bodyEl.innerHTML = `
            <div class="flex flex-col h-full w-full bg-[#05070b] text-xs select-none">
              <div class="flex flex-wrap items-center justify-between gap-1.5 p-2 bg-[var(--bg-panel-alt)] border-b border-[var(--border-hairline)]">
                <div class="flex items-center gap-1.5">
                  <button class="vm-boot-default px-2.5 py-1 bg-[var(--accent-amber)] text-black font-bold cursor-pointer">引导内置 x86 镜像</button>
                  <button class="vm-load-local px-2.5 py-1 border border-[var(--border-subtle)] hover:border-[var(--accent-cyan)] cursor-pointer">加载本地镜像 (.iso/.img/.bin)</button>
                  <input type="file" class="vm-file-input hidden" accept=".iso,.img,.fda,.bin" />
                  <button class="vm-reboot px-2 py-1 border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] cursor-pointer">重启</button>
                </div>
                <div class="flex items-center gap-1.5">
                  <button class="vm-lock-mouse px-3 py-1 bg-[var(--accent-cyan)]/15 border border-[var(--accent-cyan)] text-[var(--accent-cyan)] hover:bg-[var(--accent-cyan)] hover:text-black font-semibold cursor-pointer">锁定鼠标 (Pointer Lock)</button>
                </div>
              </div>

              <!-- V86 强制要求的 screen_container 结构：一个 white-space:pre 的 monospace div + 一个 canvas 且顺序不变 -->
              <div class="flex-1 flex items-center justify-center overflow-auto p-3 bg-black">
                <div class="v86-screen-container bg-black border border-[var(--border-hairline)] p-2 shadow-2xl">
                  <div style="white-space: pre; font: 14px monospace; line-height: 14px; color: #2dd4bf;"></div>
                  <canvas style="display: none"></canvas>
                </div>
              </div>

              <div class="h-6 px-3 bg-[var(--bg-panel-alt)] border-t border-[var(--border-hairline)] flex items-center justify-between text-[11px] font-mono text-[var(--fg-secondary)]">
                <span class="vm-status">V86 0.5.319 READY</span>
                <span>按 Esc 可退出鼠标锁定状态</span>
              </div>
            </div>
          `;

          const screenContainer = bodyEl.querySelector('.v86-screen-container');
          const statusEl = bodyEl.querySelector('.vm-status');
          const fileInput = bodyEl.querySelector('.vm-file-input');

          async function startVMWithBuffer(arrayBuffer, fileName) {
            if (typeof window.V86Starter === 'undefined' && typeof window.V86 === 'undefined') {
              statusEl.textContent = 'libv86.js 尚未加载完成，请检查网络连接';
              return;
            }
            if (emulator && typeof emulator.destroy === 'function') {
              try { emulator.destroy(); } catch (e) {}
              emulator = null;
            }

            const ext = getExt(fileName).toLowerCase();
            const v86Config = {
              wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
              memory_size: 32 * 1024 * 1024,
              vga_memory_size: 2 * 1024 * 1024,
              screen_container: screenContainer,
              bios: {
                url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'
              },
              vga_bios: {
                url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
              },
              autostart: true
            };

            // 根据后缀正确挂载 iso -> cdrom，img/fda/bin -> fda，否则 -> hda
            if (ext === 'iso') {
              v86Config.cdrom = { buffer: arrayBuffer };
            } else if (ext === 'img' || ext === 'fda' || ext === 'bin') {
              v86Config.fda = { buffer: arrayBuffer };
            } else {
              v86Config.hda = { buffer: arrayBuffer };
            }

            const StarterCtor = window.V86Starter || window.V86;
            emulator = new StarterCtor(v86Config);
            statusEl.textContent = `已挂载 [${fileName}] (${ext === 'iso' ? 'CDROM' : ['img','fda','bin'].includes(ext) ? 'FDA' : 'HDA'}) 并启动虚拟 CPU`;
            meta.setTitle(`V86 虚拟机工作站 — ${fileName}`);
          }

          async function bootVFSImage(vfsPath) {
            try {
              const buf = await window.fs.readFile(vfsPath);
              await startVMWithBuffer(buf, window.fs.basename(vfsPath));
            } catch (err) {
              const fallbackBuf = buildBootableX86SectorImage();
              await startVMWithBuffer(fallbackBuf, 'kronos-boot.img');
            }
          }

          // 鼠标锁定功能
          bodyEl.querySelector('.vm-lock-mouse').onclick = () => {
            if (emulator && typeof emulator.lock_mouse === 'function') {
              emulator.lock_mouse();
              showToast('已启用虚拟机鼠标锁定 (按 Esc 释放)');
            } else if (screenContainer.requestPointerLock) {
              screenContainer.requestPointerLock();
            }
          };

          bodyEl.querySelector('.vm-boot-default').onclick = () => bootVFSImage('/System/VM/kronos-boot.img');
          bodyEl.querySelector('.vm-reboot').onclick = () => {
            if (emulator && typeof emulator.restart === 'function') {
              emulator.restart();
            } else {
              bootVFSImage(currentImgPath);
            }
          };

          bodyEl.querySelector('.vm-load-local').onclick = () => {
            fileInput.value = '';
            fileInput.click();
          };
          fileInput.onchange = async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const buf = await file.arrayBuffer();
            const vfsSave = window.fs.join('/System/VM', file.name);
            await window.fs.writeFile(vfsSave, buf);
            currentImgPath = vfsSave;
            await startVMWithBuffer(buf, file.name);
          };

          bootVFSImage(currentImgPath);
        }
      });
    }

    /* =========================================================================
       22. 内置应用 4.6：系统设置与 OPFS 存储占有率可视化 (Settings)
       ========================================================================= */
    async function computeVFSStorageBreakdown() {
      const categories = {
        codeText: { label: '网页与源代码文档', bytes: 0, count: 0, color: '#2dd4bf' },
        images:   { label: '图像与条漫图集', bytes: 0, count: 0, color: '#e59a3c' },
        archives: { label: '压缩归档包 (.zip/.7z)', bytes: 0, count: 0, color: '#f43f5e' },
        media:    { label: '音视频与表格数据', bytes: 0, count: 0, color: '#38bdf8' },
        vmSystem: { label: '虚拟机镜像与系统核心', bytes: 0, count: 0, color: '#a855f7' }
      };

      async function scanDir(dir) {
        if (dir.startsWith('/mnt/local')) return; // 仅统计 OPFS 存储占用
        let names = [];
        try { names = await window.fs.readdir(dir); } catch (e) { return; }
        for (const name of names) {
          const full = window.fs.join(dir, name);
          try {
            const st = await window.fs.stat(full);
            if (st.isDirectory()) {
              await scanDir(full);
            } else {
              const ext = getExt(name);
              const sz = st.size || 0;
              if (IMAGE_EXTS.has(ext)) {
                categories.images.bytes += sz;
                categories.images.count++;
              } else if (CODE_EXTS.has(ext) || TEXT_EXTS.has(ext)) {
                categories.codeText.bytes += sz;
                categories.codeText.count++;
              } else if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') {
                categories.archives.bytes += sz;
                categories.archives.count++;
              } else if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext) || TABLE_EXTS.has(ext)) {
                categories.media.bytes += sz;
                categories.media.count++;
              } else {
                categories.vmSystem.bytes += sz;
                categories.vmSystem.count++;
              }
            }
          } catch (e) {}
        }
      }

      await scanDir('/');
      let quota = 0, usage = 0;
      if (navigator.storage && typeof navigator.storage.estimate === 'function') {
        try {
          const est = await navigator.storage.estimate();
          quota = est.quota || 0;
          usage = est.usage || 0;
        } catch (e) {}
      }
      const vfsTotalBytes = Object.values(categories).reduce((s, c) => s + c.bytes, 0);
      return { categories, vfsTotalBytes, quota, usage };
    }

                    <p class="text-[11px] text-[var(--fg-secondary)]">清除所有 OPFS 用户文件、本地挂载记录与自定义配置，并恢复系统出厂初始状态。</p>
                  </div>
                  <button id="set-reset-all" class="px-4 py-2 bg-[var(--accent-crimson)] text-white font-bold cursor-pointer hover:opacity-90">
                    一键重置系统与 OPFS
                  </button>
                </section>
              </div>
            `;

            bodyEl.querySelector('#set-toggle-theme').onclick = () => {
              SysConfig.applyTheme(SysConfig.state.theme === 'dark' ? 'light' : 'dark');
              renderSettingsContent();
            };

            bodyEl.querySelector('#set-toggle-clock').onclick = () => {
              SysConfig.state.use12Hour = !SysConfig.state.use12Hour;
              SysConfig.save();
              ClockCalendar.updateClock();
              renderSettingsContent();
            };

            bodyEl.querySelector('#set-toggle-click').onclick = () => {
              SysConfig.state.singleClickDesktop = !SysConfig.state.singleClickDesktop;
              SysConfig.save();
              renderSettingsContent();
            };

            bodyEl.querySelector('#set-toggle-aero').onclick = () => {
              SysConfig.state.aeroEffects = !SysConfig.state.aeroEffects;
              SysConfig.save();
              renderSettingsContent();
            };

            bodyEl.querySelector('#set-upload-wp').onclick = () => {
              document.getElementById('wallpaper-file-input').click();
            };

            bodyEl.querySelectorAll('.wp-preset-card').forEach(card => {
              card.onclick = async () => {
                SysConfig.state.wallpaperId = card.dataset.wp;
                SysConfig.state.customWallpaperPath = '';
                SysConfig.save();
                await applyWallpaper();
                renderSettingsContent();
              };
            });

            bodyEl.querySelector('#set-reset-all').onclick = async () => {
              if (!confirm('确定要清除 OPFS 虚拟文件系统并重置所有设置为初始状态吗？')) return;
              try {
                const topEntries = await window.fs.readdir('/');
                for (const name of topEntries) {
                  if (name === 'mnt') continue;
                  await window.fs.delete('/' + name);
                }
                await MountIDB.clearAll();
                localStorage.removeItem('kronos_sys_config');
                SysConfig.init();
                await seedDefaultVFSFiles(true);
                await applyWallpaper();
                DesktopManager.render();
                refreshAllExplorerWindows();
                renderSettingsContent();
                showToast('OPFS 文件系统与系统设置已完成一键重置', 'success');
              } catch (err) {
                showToast(`重置失败: ${err.message}`, 'error');
              }
            };
          }

          renderSettingsContent();
        }
      });
    }

    /* =========================================================================
       23. 系统工作站注册表、开始菜单启动器与桌面快捷入口
       ========================================================================= */
    const SYSTEM_APPS = [
      { key: 'app_explorer', label: '文件管理器', icon: ICONS.appExplorer, action: () => openFileExplorerApp('/Desktop') },
      { key: 'app_editor',   label: 'HTML编辑器', icon: ICONS.appEditor,   action: () => openHtmlEditorApp('/Desktop/天体干涉仪控制台.html') },
      { key: 'app_manga',    label: '漫画阅读器', icon: ICONS.appManga,    action: () => openMangaViewerApp('/Pictures/ChronosManga/1.svg') },
      { key: 'app_table',    label: '双视图表格', icon: ICONS.appTable,    action: () => openTableApp('/Desktop/观测站遥测数据.csv') },
      { key: 'app_notepad',  label: '记事本',     icon: ICONS.appNotepad,  action: () => openNotepadApp('/Desktop/欢迎使用_KRONOS_OS.md') },
      { key: 'app_browser',  label: '网页浏览器', icon: ICONS.appBrowser,  action: () => openWebBrowserApp('/Desktop/天体干涉仪控制台.html') },
      { key: 'app_vm',       label: 'V86 虚拟机', icon: ICONS.appVm,       action: () => openV86App('/System/VM/kronos-boot.img') },
      { key: 'app_paint',    label: '曜晶画板',   icon: ICONS.appPaint,    action: () => openPaintApp() },
      { key: 'app_calc',     label: '科学计算器', icon: ICONS.appCalc,     action: () => openCalculatorApp() },
      { key: 'app_settings', label: '系统设置',   icon: ICONS.appSettings, action: () => openSettingsApp() }
    ];

    const SYSTEM_DESKTOP_SHORTCUTS = [
      SYSTEM_APPS[0], // 文件管理器
      SYSTEM_APPS[1], // HTML编辑器
      SYSTEM_APPS[2], // 漫画阅读器
      SYSTEM_APPS[6], // V86 虚拟机
      SYSTEM_APPS[9]  // 系统设置
    ];

    function initStartMenuAndTray() {
      const startBtn = document.getElementById('start-btn');
      const startMenu = document.getElementById('start-menu');
      const appsGrid = document.getElementById('start-apps-grid');
      const searchInput = document.getElementById('start-search-input');
      const searchResults = document.getElementById('start-search-results');

      appsGrid.innerHTML = '';
      for (const app of SYSTEM_APPS) {
        const card = document.createElement('div');
        card.className = 'p-2.5 bg-[var(--bg-input)] border border-[var(--border-subtle)] hover:border-[var(--accent-amber)] flex flex-col items-center gap-1.5 cursor-pointer transition';
        card.innerHTML = `
          <div class="w-9 h-9 flex items-center justify-center">${app.icon}</div>
          <div class="text-[11px] text-center truncate w-full">${escapeHtml(app.label)}</div>
        `;
        card.onclick = () => {
          startMenu.classList.add('hidden');
          app.action();
        };
        appsGrid.appendChild(card);
      }

      startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('calendar-flyout').classList.add('hidden');
        startMenu.classList.toggle('hidden');
        if (!startMenu.classList.contains('hidden')) {
          searchInput.value = '';
          searchResults.classList.add('hidden');
          searchInput.focus();
        }
      });

      startMenu.addEventListener('click', (e) => e.stopPropagation());

      // 开始菜单实时全局检索应用与 VFS 文件
      searchInput.addEventListener('input', async () => {
        const kw = searchInput.value.trim().toLowerCase();
        if (!kw) {
          searchResults.classList.add('hidden');
          return;
        }
        searchResults.classList.remove('hidden');
        searchResults.innerHTML = '';

        const matchedApps = SYSTEM_APPS.filter(a => a.label.toLowerCase().includes(kw));
        for (const app of matchedApps) {
          const item = document.createElement('div');
          item.className = 'px-2.5 py-1.5 hover:bg-[var(--accent-amber)] hover:text-black cursor-pointer flex items-center justify-between text-xs';
          item.innerHTML = `<span>[应用] ${escapeHtml(app.label)}</span><span class="font-mono text-[10px]">启动</span>`;
          item.onclick = () => {
            startMenu.classList.add('hidden');
            app.action();
          };
          searchResults.appendChild(item);
        }

        // 搜索 /Desktop 与 /Pictures
        for (const dir of ['/Desktop', '/Documents', '/Pictures', '/Pictures/ChronosManga']) {
          try {
            const list = await window.fs.readdir(dir);
            for (const name of list) {
              if (name.toLowerCase().includes(kw)) {
                const full = window.fs.join(dir, name);
                const item = document.createElement('div');
                item.className = 'px-2.5 py-1.5 hover:bg-[var(--accent-cyan)] hover:text-black cursor-pointer flex items-center justify-between text-xs';
                item.innerHTML = `<span class="truncate">${escapeHtml(name)}</span><span class="font-mono text-[10px] opacity-75">${escapeHtml(dir)}</span>`;
                item.onclick = () => {
                  startMenu.classList.add('hidden');
                  openVFSPath(full);
                };
                searchResults.appendChild(item);
              }
            }
          } catch (e) {}
        }
      });

      // 主题切换按钮
      const toggleTheme = () => {
        SysConfig.applyTheme(SysConfig.state.theme === 'dark' ? 'light' : 'dark');
      };
      document.getElementById('tray-theme-btn').onclick = toggleTheme;
      document.getElementById('start-theme-toggle').onclick = toggleTheme;

      // 挂载本地目录按钮
      const handleMount = async () => {
        startMenu.classList.add('hidden');
        const mp = await mountLocalFolderInteractive();
        if (mp) openFileExplorerApp(mp);
      };
      document.getElementById('tray-mount-btn').onclick = handleMount;
      document.getElementById('start-mount-local-btn').onclick = handleMount;

      document.getElementById('start-upload-btn').onclick = () => {
        startMenu.classList.add('hidden');
        triggerGlobalFileUpload('/Desktop');
      };
    }

    /* =========================================================================
       24. 系统无动画直入桌面引导 (Zero Fake Loading Screen)
       ========================================================================= */
    async function bootKronosOS() {
      SysConfig.init();
      ClockCalendar.init();
      initStartMenuAndTray();
      await initFileSystem();
      await applyWallpaper();
      DesktopManager.init();
    }

    window.addEventListener('DOMContentLoaded', bootKronosOS);
  </script>
</body>
