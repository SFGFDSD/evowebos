    b.innerHTML=shown.map((e,i)=>this.rowHTML(e,i)).join('')+(list.length>this.limit?`<div class="ex-more">显示更多（还有 ${list.length-this.limit} 项）</div>`:'');
    if(!list.length)b.innerHTML=`<div class="empty">${I(this.results||this.filter?'search':'folderOpen',46)}<div>${this.results?(this.searching?'正在搜索…':'没有找到匹配的项目'):this.filter?'没有匹配的项目':'此文件夹为空'}</div><small class="dim3">${this.results||this.filter?'':'拖入文件、右键新建，或点击上方“导入”'}</small></div>`;
    this.anim=false;
    qa('.ex-item',b).forEach((n,i)=>{
      const e=shown[i];if(!e)return;
      if(e.isDir)n._dz=dnd.folderZone(n,()=>n.dataset.path);
      else if(i<160&&U.catOf(e.ext)==='image')files.thumb(e.path,e.mtime).then(u=>{if(u&&n.isConnected)q('.ex-ic',n).innerHTML='<img src="'+u+'" draggable="false" alt="">'});
    });
    qa('.ex-head>div',this.$.head).forEach(d=>{d.classList.toggle('on',d.dataset.k===this.sort.k);d.classList.toggle('desc',this.sort.d<0)});
    q('[data-a="view"]',this.root).innerHTML=I(this.view==='grid'?'list':'grid',16);
    q('[data-a="multi"]',this.root).classList.toggle('on',this.multi);q('[data-a="global"]',this.root).classList.toggle('on',this.global);
    this.updStatus();this.updBtns();
  }
  setSel(s){this.sel=s;qa('.ex-item',this.$.body).forEach(n=>n.classList.toggle('sel',s.has(n.dataset.path)));this.updStatus();this.updBtns()}
  markCut(){qa('.ex-item',this.$.body).forEach(n=>n.classList.toggle('cut',files.clip.op==='cut'&&files.clip.paths.includes(n.dataset.path)));this.updBtns()}
  updStatus(){
    const n=this.cur.length,sel=[...this.sel];let t=this.results?`找到 ${n} 项${this.searching?'（搜索中…）':''}`:`${n} 个项目`;
    if(sel.length){const sz=sel.reduce((a,p)=>{const e=this.map.get(p);return a+(e&&!e.isDir?e.size:0)},0);t+=`  |  已选中 ${sel.length} 项${sz?'  '+fmtSize(sz):''}`}
    this.$.status.firstElementChild.textContent=t;q('.ex-scan',this.$.status).textContent=this.searching?'已扫描 '+(this.scanned||0)+' 项':'';
  }
  updBtns(){
    const has=this.sel.size>0,one=this.sel.size===1,set=(a,dis)=>{const b=q(`[data-a="${a}"]`,this.root);if(b)b.disabled=dis};
    set('cut',!has);set('copy',!has);set('rename',!one);set('del',!has);set('download',!has);set('paste',!files.clip.paths.length||!!this.results);
  }
  beginRename(path){
    const n=qa('.ex-item',this.$.body).find(x=>x.dataset.path===path);if(!n)return;const e=this.map.get(path);n.draggable=false;
    ui.inlineEdit(q('.ex-nm',n),P.base(path),async v=>{const np=await files.rename(path,v);if(np){await this.load(true);this.setSel(new Set([np]))}},!(e&&e.isDir));
    n.scrollIntoView({block:'nearest'});
  }
  dragInfo(){
    const paths=[...this.sel],icons=paths.slice(0,3).map(p=>{const e=this.map.get(p);return e?OS.fileIcon(e.name,e.isDir,44):''});
    return{paths,src:'explorer',srcDir:this.path,label:P.base(paths[0])+(paths.length>1?' 等 '+paths.length+' 项':''),icons,primary:paths[0]};
  }
  itemMenu(x,y){
    const infos=[...this.sel].map(p=>this.map.get(p)).filter(Boolean);if(!infos.length)return;
    const m=files.menu(infos,this.ctx());
    if(this.results&&infos.length===1)m.splice(1,0,{label:'打开所在位置',icon:'folderOpen',action:()=>this.go(P.dir(infos[0].path))});
    ui.menu(m,x,y);
  }
  /* ---------- 搜索 ---------- */
  onSearch(){const v=this.$.search.value.trim();this.filter=v;if(this.global)this.runGlobal(v);else{this.results=null;this.render(true)}}
  async runGlobal(v){
    if(this.ac)this.ac.abort();
    if(!v){this.results=null;this.searching=false;this.render(true);return}
    const ac=this.ac=new AbortController(),res=[];this.results=res;this.searching=true;this.scanned=0;this.render(true);
    let pend=false;const flush=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;if(this.ac===ac)this.render(true)},220)};
    try{await fs.search(v,{root:'/',signal:ac.signal,limit:500,onResult:e=>{res.push(e);this.map.set(e.path,e);flush()},onProgress:n=>{this.scanned=n;this.updStatus()}})}catch(e){}
    if(this.ac===ac){this.searching=false;this.render(true)}
  }
  /* ---------- 导航窗格 ---------- */
  buildSide(){
    this.$.quick.innerHTML=QUICK.map(([n,p,ic])=>`<div class="nav-i" data-path="${p}">${I(ic,16)}<span>${n}</span></div>`).join('');
    qa('.nav-i',this.$.quick).forEach(n=>{n._dz=dnd.folderZone(n,()=>n.dataset.path)});
    this.buildMounts();this.buildTree();
  }
  buildMounts(){
    const ms=fs.mountList(),m=this.$.mounts,pend=fs.pending||[];
    m.innerHTML=ms.map(x=>`<div class="nav-i" data-path="${esc(x.mp)}">${I('plug',16)}<span>${esc(x.name)}</span><button class="nav-x" data-un="${esc(x.mp)}" title="卸载">${I('x',12)}</button></div>`).join('')
      +(pend.length?`<div class="nav-i" data-remount="1" style="color:var(--warn)">${I('lock',16)}<span>重新授权 ${pend.length} 个文件夹</span></div>`:'')
      +(fs.canMount()?`<div class="nav-i" data-mnt="1">${I('plus',16)}<span>挂载本地文件夹…</span></div>`:'<div class="nav-note">当前浏览器不支持挂载本地文件夹（需要桌面版 Chrome / Edge）</div>')
      +((!ms.length&&!pend.length&&fs.canMount())?'<div class="nav-note">挂载后，电脑上的真实文件夹会出现在 /mnt/local 下，可读写、拖拽、解压，与虚拟文件夹完全一致。</div>':'');
    qa('.nav-i[data-path]',m).forEach(n=>{n._dz=dnd.folderZone(n,()=>n.dataset.path)});
    qa('.nav-i',m).forEach(n=>n.classList.toggle('cur',n.dataset.path===this.path));
  }
  mkNode(path,name,depth,mount){
    const row=el(`<div class="tn" data-path="${esc(path)}" style="--d:${depth}"><i class="tn-c">${I('chevR',12)}</i>${path==='/'?I('desktop',16):I(mount?'plug':'folder',16,'',OS.CATCOL.folder)}<span>${esc(name)}</span></div>`),kids=el('<div class="tn-k"></div>');
    row._dz=dnd.folderZone(row,()=>path);const node={row,kids,path,depth,loaded:false};row.node=node;kids.style.display='none';return node;
  }
  async loadKids(node){
    let ents=[];try{ents=await fs.list(node.path)}catch(e){}
    ents=ents.filter(e=>e.isDir&&(OS.S.showHidden||!e.name.startsWith('.'))).sort((a,b)=>natCmp(a.name,b.name));node.kids.innerHTML='';
    for(const e of ents){const n=this.mkNode(e.path,e.name,node.depth+1,e.mount);node.kids.appendChild(n.row);node.kids.appendChild(n.kids)}
    node.loaded=true;q('.tn-c',node.row).classList.toggle('none',!ents.length);
  }
  async toggleNode(node,force){
    const open=force!=null?force:!node.row.classList.contains('open');
    if(open&&!node.loaded)await this.loadKids(node);
    node.row.classList.toggle('open',open);node.kids.style.display=open?'':'none';
  }
  async buildTree(){
    const t=this.$.tree;t.innerHTML='';const r=this.root_=this.mkNode('/','此设备',0);t.appendChild(r.row);t.appendChild(r.kids);await this.toggleNode(r,true);
  }
  async reloadOpen(){
    const nodes=qa('.tn',this.$.tree).map(n=>n.node).filter(n=>n&&n.loaded&&n.row.classList.contains('open'));
    for(const n of nodes){const open=new Set(qa('.tn.open',n.kids).map(x=>x.dataset.path));await this.loadKids(n);qa('.tn',n.kids).forEach(x=>{if(open.has(x.dataset.path))this.toggleNode(x.node,true)})}
    qa('.tn',this.$.tree).forEach(n=>n.classList.toggle('cur',n.dataset.path===this.path));
  }
  async revealTree(){
    const my=this.rev=(this.rev||0)+1;let node=this.root_;if(!node)return;let p='';
    for(const s of P.parts(this.path)){
      p+='/'+s;if(!node.loaded)await this.loadKids(node);if(my!==this.rev)return;
      node.row.classList.add('open');node.kids.style.display='';
      const nx=[...node.kids.children].find(c=>c.classList.contains('tn')&&c.dataset.path===p);if(!nx)break;node=nx.node;
    }
    qa('.tn.cur',this.$.tree).forEach(n=>n.classList.remove('cur'));
    const c=qa('.tn',this.$.tree).find(n=>n.dataset.path===this.path);if(c)c.classList.add('cur');
  }
  async updStore(){
    const e=await fs.estimate(),pct=e.quota?Math.min(100,e.usage/e.quota*100):0;
    q('.bar i',this.$.store).style.width=Math.max(pct,e.usage?1.5:0)+'%';q('.es-n',this.$.store).textContent=e.quota?`${fmtSize(e.usage)} / ${fmtSize(e.quota)}`:'无法获取配额信息';
  }
  applyCols(){
    const c=this.cols;this.$.list.style.setProperty('--tpl',`${c.name}px ${c.date}px ${c.type}px ${c.size}px`);this.$.list.style.minWidth=(c.name+c.date+c.type+c.size)+'px';
  }
  /* ---------- 事件 ---------- */
  bind(){
    const sc=this.$.scroll,body=this.$.body,r=this.root;
    r.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');
      if(b&&!b.disabled)this.act(b.dataset.a,b);
      const c=e.target.closest('.crumb');if(c)this.go(c.dataset.path);
      const un=e.target.closest('[data-un]');
      if(un){e.stopPropagation();const mp=un.dataset.un;ui.confirm('卸载“'+P.base(mp)+'”？\n电脑上的文件不会被删除。',{title:'卸载本地文件夹',ok:'卸载'}).then(async ok=>{if(!ok)return;await fs.unmount(mp);if(P.isUnder(this.path,mp)||this.path===mp)this.go('/mnt/local');ui.toast('已卸载',{type:'ok'})});return}
      const ni=e.target.closest('.nav-i');
      if(ni){if(ni.dataset.mnt)files.mountLocal();else if(ni.dataset.remount)fs.remountPending().then(n=>{this.buildMounts();ui.toast(n?'已重新挂载 '+n+' 个文件夹':'未获得授权',{type:n?'ok':'warn'})});else if(ni.dataset.path)this.go(ni.dataset.path)}
      const tn=e.target.closest('.tn');
      if(tn){const node=tn.node;if(e.target.closest('.tn-c'))this.toggleNode(node);else{this.go(node.path);this.toggleNode(node,true)}}
      if(e.target.closest('.ex-store'))OS.launch('settings',{page:'storage'});
    });
    this.$.addr.addEventListener('click',e=>{if(!e.target.closest('.crumb')&&!this.$.addr.classList.contains('edit'))this.editAddr(true)});
    this.$.addrIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){const v=this.$.addrIn.value.trim();this.editAddr(false);if(v)this.go(v)}else if(e.key==='Escape')this.editAddr(false)});
    this.$.addrIn.addEventListener('blur',()=>this.editAddr(false));
    this.$.search.addEventListener('input',debounce(()=>this.onSearch(),this.global?380:120));
    this.$.search.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){this.$.search.value='';this.onSearch()}});
    /* 列头：排序 + 拖拽调整列宽 */
    this.$.head.addEventListener('click',e=>{
      if(e.target.closest('.hd-rz'))return;const c=e.target.closest('[data-k]');if(!c)return;const k=c.dataset.k;
      if(this.sort.k===k)this.sort.d*=-1;else this.sort={k,d:k==='date'||k==='size'?-1:1};this.render(true);
    });
    this.$.head.addEventListener('pointerdown',e=>{
      const rz=e.target.closest('.hd-rz');if(!rz)return;e.preventDefault();e.stopPropagation();
      const k=rz.parentElement.dataset.k,sx=e.clientX,w0=this.cols[k];rz.setPointerCapture(e.pointerId);
      const mv=ev=>{this.cols[k]=clamp(w0+ev.clientX-sx,56,640);this.applyCols()};
      const up=()=>{rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up);OS.cfg.set('exCols',{...this.cols})};
      rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up);
    });
    /* 选择 */
    sc.addEventListener('pointerdown',e=>{
      const n=e.target.closest('.ex-item');if(!n||e.button>2)return;
      n.draggable=e.pointerType!=='touch';r.focus({preventScroll:true});                  // 触摸关闭原生拖拽，改走 touch 事件
      if(this.multi&&e.pointerType==='touch')return;
      const p=n.dataset.path;
      if(e.ctrlKey||e.metaKey){const s=new Set(this.sel);s.has(p)?s.delete(p):s.add(p);this.setSel(s)}
      else if(e.shiftKey&&this.last){const arr=this.cur.map(i=>i.path),a=arr.indexOf(this.last),b=arr.indexOf(p);if(a>=0&&b>=0)this.setSel(new Set(arr.slice(Math.min(a,b),Math.max(a,b)+1)))}
      else if(!this.sel.has(p))this.setSel(new Set([p]));
      this.last=p;if(e.pointerType!=='touch'&&e.button===0)dnd.preload([...this.sel]);
    });
    sc.addEventListener('click',e=>{
      const n=e.target.closest('.ex-item');
      if(!n){if(e.target.closest('.ex-more')){this.limit+=600;this.render(true)}return}
      if(n.querySelector('.inl-edit')||e.ctrlKey||e.metaKey||e.shiftKey)return;
      const p=n.dataset.path;
      if(this.multi){const s=new Set(this.sel);s.has(p)?s.delete(p):s.add(p);this.setSel(s);return}
      if(OS.touch){files.open(p,{explorer:this});return}
      if(this.sel.size>1&&this.sel.has(p))this.setSel(new Set([p]));
    });
    sc.addEventListener('dblclick',e=>{const n=e.target.closest('.ex-item');if(n&&!OS.touch)files.open(n.dataset.path,{explorer:this})});
    sc.addEventListener('contextmenu',e=>{
      e.preventDefault();const n=e.target.closest('.ex-item');
      if(n){if(!this.sel.has(n.dataset.path))this.setSel(new Set([n.dataset.path]));this.itemMenu(e.clientX,e.clientY)}
      else if(!e.target.closest('.ex-head')){this.setSel(new Set());ui.menu(files.bgMenu(this.path,this.ctx()),e.clientX,e.clientY)}
    });
    /* 拖拽：鼠标 = 原生 DnD（同步 dragstart），触摸 = touch 事件 */
    sc.addEventListener('dragstart',e=>{
      const n=e.target.closest&&e.target.closest('.ex-item');if(!n){e.preventDefault();return}
      if(!this.sel.has(n.dataset.path))this.setSel(new Set([n.dataset.path]));
      dnd.start(e,this.dragInfo());qa('.ex-item.sel',body).forEach(x=>x.classList.add('dragging'));
    });
    sc.addEventListener('dragend',()=>qa('.dragging',body).forEach(x=>x.classList.remove('dragging')));
    sc._dz={over:()=>sc.classList.add('drop-hot'),leave:()=>sc.classList.remove('drop-hot'),
      drop:async(info,pt)=>{sc.classList.remove('drop-hot');await dnd.dropInto(info,this.path,pt.copy)},
      dropExternal:async col=>{sc.classList.remove('drop-hot');await files.importCollected(col,this.path)}};
    dnd.touch(sc,{sel:'.ex-item',delay:330,info:n=>{const p=n.dataset.path;if(!this.sel.has(p))this.setSel(new Set([p]));return this.dragInfo()},hold:(n,x,y)=>this.itemMenu(x,y)});
    ui.longPress(sc,'.ex-scroll',(tg,x,y,ev)=>{if(ev.target.closest('.ex-item')||ev.target.closest('.ex-head'))return;this.setSel(new Set());ui.menu(files.bgMenu(this.path,this.ctx()),x,y)},560);
    OS.lasso(sc,{scroller:sc,itemsSel:'.ex-item',isBg:e=>!e.target.closest('.ex-item')&&!e.target.closest('.ex-head')&&!e.target.closest('.ex-more'),getSel:()=>this.sel,setSel:s=>this.setSel(s),touch:false});
    sc.addEventListener('pointerdown',e=>{if(!e.target.closest('.ex-item')){r.focus({preventScroll:true});if(!e.ctrlKey&&!e.shiftKey&&e.pointerType==='touch')this.setSel(new Set())}});
    /* 键盘 */
    r.addEventListener('keydown',e=>{
      if(e.target.closest('input,textarea'))return;
      const k=e.key.toLowerCase(),ctrl=e.ctrlKey||e.metaKey,sel=[...this.sel];
      if(ctrl&&k==='a'){e.preventDefault();this.setSel(new Set(this.cur.map(i=>i.path)))}
      else if(ctrl&&k==='c'&&sel.length)files.copyClip(sel);
      else if(ctrl&&k==='x'&&sel.length)files.cut(sel);
      else if(ctrl&&k==='v'){e.preventDefault();files.paste(this.path).then(out=>this.load(true).then(()=>this.setSel(new Set(out))))}
      else if(k==='delete'&&sel.length)files.del(sel).then(ok=>ok&&this.load(true));
      else if(k==='f2'&&sel.length===1){e.preventDefault();this.beginRename(sel[0])}
      else if(k==='enter'&&sel.length===1)files.open(sel[0],{explorer:this});
      else if(k==='backspace'){e.preventDefault();this.go(P.dir(this.path))}
      else if(e.altKey&&k==='arrowleft'){e.preventDefault();this.nav(-1)}
      else if(e.altKey&&k==='arrowright'){e.preventDefault();this.nav(1)}
      else if(k==='f5'){e.preventDefault();this.load(true)}
      else if(k==='escape')this.setSel(new Set());
      else if(['arrowdown','arrowup','arrowleft','arrowright'].includes(k))this.arrow(k,e.shiftKey,e);
    });
  }
  arrow(k,shift,e){
    e.preventDefault();const arr=this.cur.map(i=>i.path);if(!arr.length)return;
    const grid=this.view==='grid',cols=grid?Math.max(1,getComputedStyle(this.$.body).gridTemplateColumns.split(' ').length):1;
    const step={arrowdown:cols,arrowup:-cols,arrowright:grid?1:0,arrowleft:grid?-1:0}[k];if(!step)return;
    const i=this.last?arr.indexOf(this.last):-1,n=clamp(i<0?0:i+step,0,arr.length-1),p=arr[n];
    if(shift){const a=i<0?0:i;this.setSel(new Set(arr.slice(Math.min(a,n),Math.max(a,n)+1)))}else this.setSel(new Set([p]));
    this.last=p;const node=qa('.ex-item',this.$.body).find(x=>x.dataset.path===p);if(node)node.scrollIntoView({block:'nearest'});
  }
  act(a,btn){
    const sel=[...this.sel],rc=btn.getBoundingClientRect();
    switch(a){
      case 'side':this.root.classList.toggle('side-open');break;
      case 'back':this.nav(-1);break;case 'fwd':this.nav(1);break;case 'up':this.go(P.dir(this.path));break;
      case 'refresh':this.load(true);this.buildMounts();this.reloadOpen();break;
      case 'global':this.global=!this.global;this.$.search.placeholder=this.global?'全局搜索（整个文件系统）':'搜索当前文件夹';this.onSearch();this.render(true);if(this.global)this.$.search.focus();break;
      case 'new':ui.menu(files.bgMenu(this.path,this.ctx())[0].children,rc.left,rc.bottom+4);break;
      case 'cut':files.cut(sel);break;case 'copy':files.copyClip(sel);break;
      case 'paste':files.paste(this.path).then(out=>this.load(true).then(()=>this.setSel(new Set(out))));break;
      case 'rename':this.beginRename(sel[0]);break;
      case 'del':files.del(sel).then(ok=>ok&&this.load(true));break;
      case 'sort':ui.menu([...COLS.map(([k,n])=>({label:n,checked:this.sort.k===k,action:()=>{this.sort.k=k;this.render(true)}})),{sep:1},{label:'升序',checked:this.sort.d>0,action:()=>{this.sort.d=1;this.render(true)}},{label:'降序',checked:this.sort.d<0,action:()=>{this.sort.d=-1;this.render(true)}},{sep:1},{label:'显示隐藏文件',checked:OS.S.showHidden,action:()=>{OS.cfg.set('showHidden',!OS.S.showHidden);this.load(true)}}],rc.left,rc.bottom+4);break;
      case 'view':this.view=this.view==='grid'?'list':'grid';OS.cfg.set('viewMode',this.view);this.anim=true;this.render();break;
      case 'multi':this.multi=!this.multi;btn.classList.toggle('on',this.multi);ui.toast(this.multi?'多选模式已开启：点按项目即可勾选':'多选模式已关闭',{timeout:1400});break;
      case 'download':files.download(sel);break;
      case 'upload':ui.menu([{label:'上传文件…',icon:'upload',action:()=>files.pickUpload(this.path)},{label:'上传文件夹…',icon:'folderPlus',action:()=>files.pickUpload(this.path,true)}],rc.left,rc.bottom+4);break;
      case 'mount':files.mountLocal();break;
    }
  }
}
OS.registerApp({id:'explorer',name:'文件管理器',icon:'folder',color:'#ffb84d',w:980,h:620,minW:380,minH:320,kw:'files folder 资源管理器 文件',open:(win,args)=>{new Explorer(win,args.path||'/')}});
})();
</script>

.sh-t th.rn,.sh-t td.rn{position:sticky;left:0;z-index:3;background:var(--bg2);text-align:center;color:var(--tx3);font:11px var(--mono);cursor:default;min-width:44px;border-right:1px solid var(--line2)}
.sh-t th.rn{z-index:4}
.sh-t td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 10px;min-width:96px;max-width:420px;outline:none;white-space:pre-wrap;word-break:break-word;color:var(--tx);user-select:text}
.sh-t tr:hover td:not(.rn){background:rgba(var(--ac-rgb),.05)}
.sh-t td:focus{box-shadow:inset 0 0 0 2px var(--ac);background:rgba(var(--ac-rgb),.1)}
.sh-t tr.cr td.rn{background:rgba(var(--ac-rgb),.3);color:var(--tx)}
.sh-txt{flex:1;min-height:0;resize:none;border:0;outline:0;background:transparent;padding:12px 16px;font:12.5px/1.65 var(--mono);color:var(--tx);white-space:pre;overflow:auto;tab-size:4;user-select:text}
</style>
<script>
/* =====================================================================
   C6 · 记事本 + 表格（CSV / TSV 双视图）
   ===================================================================== */
(()=>{
'use strict';
const U=OS.U,{q,qa,el,esc,clamp,debounce,P,natCmp,fmtSize}=U,I=OS.I,fs=OS.fs,ui=OS.ui,store=OS.store,idb=OS.idb;

/* ---------------- 记事本 ---------------- */
class Notepad{
  constructor(win,args){
    Object.assign(this,{win,path:args.path||null,dirty:false,enc:'UTF-8',undo:[],redo:[],saved:null});
    this.root=el(`<div class="np"><div class="tbar"><button class="btn sm" data-a="new">${I('filePlus',15)}新建</button><button class="btn sm" data-a="open">${I('folderOpen',15)}打开</button><button class="btn sm pri" data-a="save">${I('save',15)}保存</button><button class="btn sm" data-a="saveas">另存为</button><span class="sep"></span><button class="btn ico sm" data-a="undo" title="撤销 (Ctrl+Z)">${I('undo',15)}</button><button class="btn ico sm" data-a="redo" title="恢复 (Ctrl+Y)">${I('redo',15)}</button><span class="sep"></span><button class="btn ico sm" data-a="fm" title="减小字号">${I('zoomOut',15)}</button><span class="chip np-fs"></span><button class="btn ico sm" data-a="fp" title="增大字号">${I('zoomIn',15)}</button><button class="btn ico sm" data-a="wrap" title="自动换行">${I('wrap',15)}</button><button class="btn ico sm" data-a="find" title="查找替换 (Ctrl+F)">${I('search',15)}</button><span class="grow"></span><button class="btn sm" data-a="dl" title="下载到电脑">${I('download',15)}</button></div>
      <div class="np-find hidden"><input class="inp f1" placeholder="查找" spellcheck="false"><input class="inp f2" placeholder="替换为" spellcheck="false"><button class="btn sm" data-a="fprev">上一个</button><button class="btn sm" data-a="fnext">下一个</button><button class="btn sm" data-a="frep">替换</button><button class="btn sm" data-a="fall">全部替换</button><span class="dim np-fc"></span><button class="btn ico sm" data-a="fx">${I('x',14)}</button></div>
      <textarea class="np-ta" spellcheck="false" autocapitalize="off"></textarea><div class="stbar"><span class="pos"></span><span class="cnt"></span><span class="grow"></span><span class="enc"></span><span class="sv"></span></div></div>`);
    win.body.appendChild(this.root);this.ta=q('.np-ta',this.root);
    this.commit=debounce(()=>this.doCommit(),500);
    this.saveDraft=debounce(()=>this.writeDraft(),450);this.autosave=debounce(()=>{if(OS.S.autosave&&this.path&&this.dirty)this.save(true)},1200);
    this.applyView();this.bind();this.init();
  }
  key(){return 'np.draft:'+(this.path||'untitled')}
  async init(){
    let mt=0;
    if(this.path){
      try{const st=await fs.stat(this.path);mt=st.mtimeMs;const d=U.decodeText(await fs.readFile(this.path));this.ta.value=d.text;this.enc=d.enc}catch(e){ui.toast('打开失败：'+e.message,{type:'err'})}
    }
    const dr=store.get(this.key());
    if(dr&&dr.text&&dr.text!==this.ta.value&&(!this.path||dr.t>mt)){this.ta.value=dr.text;this.dirty=true;ui.toast('已恢复上次未保存的内容',{timeout:2600})}
    this.base=this.snap();this.upd();
  }
  snap(){return{v:this.ta.value,s:this.ta.selectionStart,e:this.ta.selectionEnd}}
  doCommit(){if(this.ta.value!==this.base.v){this.undo.push(this.base);if(this.undo.length>300)this.undo.shift();this.redo.length=0;this.base=this.snap()}}
  apply(s){this.ta.value=s.v;this.ta.setSelectionRange(s.s,s.e);this.markDirty();this.upd()}
  doUndo(){this.commit.flush();if(!this.undo.length)return;this.redo.push(this.snap());this.base=this.undo.pop();this.apply(this.base)}
  doRedo(){this.commit.flush();if(!this.redo.length)return;this.undo.push(this.base);this.base=this.redo.pop();this.apply(this.base)}
  markDirty(){this.dirty=true;this.saveDraft();this.autosave()}
  writeDraft(){
    const k=this.key();
    if(!this.dirty){store.del(k);idb.del('drafts',k).catch(()=>{});return}
    const v={text:this.ta.value,t:Date.now()};if(v.text.length<400000)store.set(k,v);idb.put('drafts',v,k).catch(()=>{});
  }
  upd(){
    const ta=this.ta,v=ta.value,pos=ta.selectionStart,before=v.slice(0,pos),ln=before.split('\n').length,col=pos-before.lastIndexOf('\n');
    q('.pos',this.root).textContent='行 '+ln+'，列 '+col;q('.cnt',this.root).textContent=v.length.toLocaleString()+' 字符';q('.enc',this.root).textContent=this.enc+'（保存为 UTF-8）';
    q('.sv',this.root).textContent=this.dirty?'● 未保存':(this.saved?'已保存 '+this.saved.toLocaleTimeString():'');
    this.win.setTitle((this.dirty?'● ':'')+(this.path?P.base(this.path):'未命名')+' - 记事本');
  }
  applyView(){
    this.ta.style.fontSize=OS.S.npFont+'px';this.ta.classList.toggle('nowrap',!OS.S.npWrap);
    q('.np-fs',this.root).textContent=OS.S.npFont+'px';q('[data-a="wrap"]',this.root).classList.toggle('on',OS.S.npWrap);
  }
  async save(silent){
    if(!this.path)return this.saveAs();
    try{await fs.writeFile(this.path,this.ta.value);this.dirty=false;this.saved=new Date();this.writeDraft();this.upd();if(!silent)ui.toast('已保存：'+P.base(this.path),{type:'ok',timeout:1600});return true}
    catch(e){ui.toast('保存失败：'+e.message,{type:'err'});return false}
  }
  async saveAs(){
    const p=await ui.pick({mode:'save',name:this.path?P.base(this.path):'未命名.txt',path:this.path?P.dir(this.path):'/桌面'});
    if(!p)return false;const old=this.key();store.del(old);this.path=p;return this.save();
  }
  find(dir){
    const f=q('.f1',this.root).value;if(!f)return;const ta=this.ta,v=ta.value.toLowerCase(),n=f.toLowerCase();
    let i=dir>0?v.indexOf(n,ta.selectionEnd):v.lastIndexOf(n,ta.selectionStart-1);
    if(i<0)i=dir>0?v.indexOf(n):v.lastIndexOf(n);
    if(i>=0){ta.focus();ta.setSelectionRange(i,i+f.length)}
    const total=v.split(n).length-1;q('.np-fc',this.root).textContent=total?total+' 处匹配':'无匹配';
  }
  bind(){
    const ta=this.ta,r=this.root;
    ta.addEventListener('input',()=>{this.commit();this.markDirty();this.upd()});
    ['keyup','click','select'].forEach(ev=>ta.addEventListener(ev,()=>this.upd()));
    ta.addEventListener('keydown',e=>{
      const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
      if(c&&k==='z'&&!e.shiftKey){e.preventDefault();this.doUndo()}
      else if(c&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();this.doRedo()}
      else if(c&&k==='s'){e.preventDefault();this.save()}
      else if(c&&k==='f'){e.preventDefault();this.showFind(true)}
      else if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');this.commit();this.markDirty()}
    });
    ta.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();OS.cfg.set('npFont',clamp(OS.S.npFont+(e.deltaY<0?1:-1),9,48));this.applyView()}},{passive:false});
    q('.f1',r).addEventListener('input',()=>this.find(1));
    q('.f1',r).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();this.find(e.shiftKey?-1:1)}else if(e.key==='Escape')this.showFind(false)});
    r.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
      if(a==='new'){if(this.dirty&&!(await ui.confirm('当前内容尚未保存，仍要新建吗？')))return;this.path=null;ta.value='';this.dirty=false;this.undo=[];this.redo=[];this.base=this.snap();store.del('np.draft:untitled');this.upd()}
      else if(a==='open'){const p=await ui.pick({mode:'open',title:'打开文本文件'});if(p)OS.launch('notepad',{path:p})}
      else if(a==='save')this.save();else if(a==='saveas')this.saveAs();
      else if(a==='undo')this.doUndo();else if(a==='redo')this.doRedo();
      else if(a==='fm'||a==='fp'){OS.cfg.set('npFont',clamp(OS.S.npFont+(a==='fp'?1:-1),9,48));this.applyView()}
      else if(a==='wrap'){OS.cfg.set('npWrap',!OS.S.npWrap);this.applyView()}
      else if(a==='find')this.showFind(true);else if(a==='fx')this.showFind(false);
      else if(a==='fnext')this.find(1);else if(a==='fprev')this.find(-1);
      else if(a==='frep'){const f=q('.f1',r).value;if(f&&ta.value.slice(ta.selectionStart,ta.selectionEnd).toLowerCase()===f.toLowerCase()){ta.setRangeText(q('.f2',r).value,ta.selectionStart,ta.selectionEnd,'end');this.commit();this.markDirty()}this.find(1)}
      else if(a==='fall'){const f=q('.f1',r).value;if(!f)return;const rx=new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,m=>'\\'+m),'gi'),n=(ta.value.match(rx)||[]).length,rep=q('.f2',r).value;ta.value=ta.value.replace(rx,()=>rep);this.commit();this.markDirty();this.upd();q('.np-fc',r).textContent='已替换 '+n+' 处'}
      else if(a==='dl')U.saveBlob(new Blob([ta.value],{type:'text/plain;charset=utf-8'}),this.path?P.base(this.path):'未命名.txt');
    });
    const fl=()=>{if(document.hidden)this.saveDraft.flush()};document.addEventListener('visibilitychange',fl);window.addEventListener('pagehide',fl);
    this.win.onDestroy(()=>{document.removeEventListener('visibilitychange',fl);window.removeEventListener('pagehide',fl);this.saveDraft.flush()});
    this.win.beforeClose(async()=>{
      if(!this.dirty)return true;
      if(OS.S.autosave&&this.path)return this.save(true);
      const v=await ui.dialog({title:'保存更改？',icon:'save',body:'“'+(this.path?P.base(this.path):'未命名')+'”有尚未保存的更改。',buttons:[{text:'取消',value:'c'},{text:'不保存',value:'d',danger:true},{text:'保存',value:'s',primary:true}]});
      if(v==='s')return this.save();if(v==='d'){this.dirty=false;this.writeDraft();return true}return false;
    });
    this.win.el.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&e.target!==ta){e.preventDefault();this.save()}});
  }
  showFind(on){q('.np-find',this.root).classList.toggle('hidden',!on);if(on){const s=this.ta.value.slice(this.ta.selectionStart,this.ta.selectionEnd);const f=q('.f1',this.root);if(s&&!s.includes('\n'))f.value=s;f.focus();f.select()}else this.ta.focus()}
}
OS.registerApp({id:'notepad',name:'记事本',icon:'note',color:'#8cc8ff',w:780,h:540,minW:340,minH:260,kw:'text txt 文本 编辑 notepad',open:(win,args)=>{new Notepad(win,args)}});

/* ---------------- 表格（CSV / TSV） ---------------- */
function parseCSV(text,d){
  const rows=[];let row=[],f='',i=0,inq=false;const n=text.length;
  while(i<n){
    const c=text[i];
    if(inq){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue}inq=false;i++;continue}f+=c;i++;continue}
    if(c==='"'&&f===''){inq=true;i++;continue}
    if(c===d){row.push(f);f='';i++;continue}
    if(c==='\r'){i++;continue}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue}
    f+=c;i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.length?rows:[['']];
}
const serCSV=(rows,d)=>rows.map(r=>r.map(c=>{c=String(c==null?'':c);return(c.includes(d)||c.includes('"')||c.includes('\n')||c.includes('\r'))?'"'+c.replace(/"/g,'""')+'"':c}).join(d)).join('\n')+'\n';
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
class Sheet{
  constructor(win,args){
    Object.assign(this,{win,path:args.path||null,rows:[['']],delim:',',view:'table',header:true,page:0,size:200,sortC:-1,sortD:1,filter:'',dirty:false,cell:null,enc:'UTF-8'});
    this.root=el(`<div class="sh"><div class="tbar"><button class="btn sm pri" data-a="save">${I('save',15)}保存</button><button class="btn sm" data-a="saveas">另存为</button><span class="sep"></span><div class="seg"><button data-v="table" class="on">${I('table',14)}表格视图</button><button data-v="text">${I('note',14)}文本视图</button></div><span class="sep"></span>
      <select class="inp sm dl" style="height:28px" title="分隔符"><option value=",">逗号 ,</option><option value="&#9;">制表符 Tab</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select><button class="btn sm on" data-a="hdr" title="将第一行作为表头">首行表头</button><span class="sep"></span>
      <button class="btn ico sm" data-a="addr" title="在选中行后插入行">${I('plus',14)}</button><button class="btn sm" data-a="delr">删行</button><button class="btn sm" data-a="addc">增列</button><button class="btn sm" data-a="delc">删列</button><span class="grow"></span><input class="inp sm sh-f" style="width:150px;height:28px" placeholder="筛选行…" spellcheck="false"></div>
      <div class="sh-wrap"></div><textarea class="sh-txt hidden" spellcheck="false"></textarea>
      <div class="stbar"><span class="s1"></span><span class="grow"></span><button class="btn sm ico" data-a="pp">${I('chevL',13)}</button><span class="pg"></span><button class="btn sm ico" data-a="np">${I('chevR',13)}</button><span class="s2"></span></div></div>`);
    win.body.appendChild(this.root);Object.assign(this,{wrap:q('.sh-wrap',this.root),ta:q('.sh-txt',this.root)});
    this.autosave=debounce(()=>{if(OS.S.autosave&&this.path&&this.dirty)this.save(true)},1500);this.bind();this.init();
  }
  async init(){
    if(this.path){
      try{
        const d=U.decodeText(await fs.readFile(this.path));this.enc=d.enc;const ext=P.ext(this.path);
        if(ext==='tsv')this.delim='\t';else{const l=d.text.split('\n')[0]||'',c=[',',';','\t','|'].map(x=>[x,l.split(x).length]);this.delim=c.sort((a,b)=>b[1]-a[1])[0][0]}
        this.ta.value=d.text;this.rows=parseCSV(d.text,this.delim);
      }catch(e){ui.toast('打开失败：'+e.message,{type:'err'})}
    }
    q('.dl',this.root).value=this.delim;this.render();this.title();
  }
  title(){this.win.setTitle((this.dirty?'● ':'')+(this.path?P.base(this.path):'未命名表格')+' - 表格')}
  width(){return Math.max(1,...this.rows.map(r=>r.length))}
  order(){
    let idx=this.rows.map((_,i)=>i);if(this.header)idx=idx.filter(i=>i>0);
    const f=this.filter.toLowerCase();if(f)idx=idx.filter(i=>this.rows[i].some(c=>String(c).toLowerCase().includes(f)));
    if(this.sortC>=0){
      const c=this.sortC,d=this.sortD;
      idx.sort((a,b)=>{const x=this.rows[a][c]||'',y=this.rows[b][c]||'',nx=parseFloat(x),ny=parseFloat(y);return d*((!isNaN(nx)&&!isNaN(ny)&&isFinite(x)&&isFinite(y))?nx-ny:natCmp(x,y))});
    }
    return idx;
  }
  render(){
    const w=this.width(),idx=this.order(),pages=Math.max(1,Math.ceil(idx.length/this.size));this.page=clamp(this.page,0,pages-1);
    const slice=idx.slice(this.page*this.size,(this.page+1)*this.size),hd=this.header?this.rows[0]:null;
    let h='<table class="sh-t"><thead><tr><th class="rn">#</th>';
    for(let c=0;c<w;c++){const nm=hd?(hd[c]!=null&&hd[c]!==''?esc(hd[c]):colName(c)):colName(c);h+=`<th data-c="${c}" title="点击排序">${nm}${this.sortC===c?(this.sortD>0?' ▲':' ▼'):''}</th>`}
    h+='</tr></thead><tbody>';
    for(const ri of slice){h+=`<tr data-r="${ri}"><td class="rn">${ri+(this.header?0:1)}</td>`;for(let c=0;c<w;c++)h+=`<td contenteditable="true" data-r="${ri}" data-c="${c}">${esc(this.rows[ri][c]==null?'':this.rows[ri][c])}</td>`;h+='</tr>'}
    this.wrap.innerHTML=h+'</tbody></table>';
    q('.s1',this.root).textContent=(this.header?this.rows.length-1:this.rows.length)+' 行 × '+w+' 列'+(this.filter?'（筛选后 '+idx.length+' 行）':'');
    q('.pg',this.root).textContent=(this.page+1)+' / '+pages;q('.s2',this.root).textContent=this.enc;
    q('[data-a="hdr"]',this.root).classList.toggle('on',this.header);
  }
  mark(){this.dirty=true;this.title();this.autosave()}
  toText(){this.ta.value=serCSV(this.rows,this.delim)}
  toTable(){this.rows=parseCSV(this.ta.value,this.delim);this.render()}
  setView(v){
    if(v===this.view)return;
    if(v==='text'){this.toText();this.wrap.classList.add('hidden');this.ta.classList.remove('hidden')}
    else{this.toTable();this.ta.classList.add('hidden');this.wrap.classList.remove('hidden')}
    this.view=v;qa('.seg button',this.root).forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  }
  async save(silent){
    if(!this.path)return this.saveAs();
    try{await fs.writeFile(this.path,this.view==='text'?this.ta.value:serCSV(this.rows,this.delim));this.dirty=false;this.title();if(!silent)ui.toast('已保存：'+P.base(this.path),{type:'ok',timeout:1600});return true}
    catch(e){ui.toast('保存失败：'+e.message,{type:'err'});return false}
  }
  async saveAs(){const p=await ui.pick({mode:'save',name:this.path?P.base(this.path):'未命名.csv',path:this.path?P.dir(this.path):'/文档'});if(!p)return false;this.path=p;return this.save()}
  bind(){
    const r=this.root;
    r.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]'),v=e.target.closest('.seg button'),th=e.target.closest('th[data-c]');
      if(v)this.setView(v.dataset.v);
      if(th){const c=+th.dataset.c;if(this.sortC===c){if(this.sortD>0)this.sortD=-1;else this.sortC=-1}else{this.sortC=c;this.sortD=1}this.render();return}
      if(!b)return;const a=b.dataset.a,cur=this.cell,w=this.width();
      if(a==='save')this.save();else if(a==='saveas')this.saveAs();
      else if(a==='hdr'){this.header=!this.header;this.render()}
      else if(a==='pp'){this.page--;this.render()}else if(a==='np'){this.page++;this.render()}
      else if(a==='addr'){this.rows.splice((cur?cur.r:this.rows.length-1)+1,0,Array(w).fill(''));this.mark();this.render()}
      else if(a==='delr'){if(cur&&this.rows.length>1){this.rows.splice(cur.r,1);this.cell=null;this.mark();this.render()}else ui.toast('请先点选要删除的行中的一个单元格',{type:'warn'})}
      else if(a==='addc'){const c=cur?cur.c+1:w;this.rows.forEach(rw=>{while(rw.length<w)rw.push('');rw.splice(c,0,'')});this.mark();this.render()}
      else if(a==='delc'){if(cur&&w>1){this.rows.forEach(rw=>rw.splice(cur.c,1));this.cell=null;this.mark();this.render()}else ui.toast('请先点选要删除的列中的一个单元格',{type:'warn'})}
    });
    this.wrap.addEventListener('input',e=>{const td=e.target.closest('td[data-r]');if(!td)return;const rr=this.rows[+td.dataset.r],c=+td.dataset.c;while(rr.length<=c)rr.push('');rr[c]=td.textContent;this.mark()});
    this.wrap.addEventListener('focusin',e=>{const td=e.target.closest('td[data-r]');if(!td)return;this.cell={r:+td.dataset.r,c:+td.dataset.c};qa('tr.cr',this.wrap).forEach(x=>x.classList.remove('cr'));td.parentElement.classList.add('cr')});
    this.wrap.addEventListener('paste',e=>{const td=e.target.closest('td');if(!td)return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});

          {label:'输入时自动补全',icon:'sparkle',checked:S().edHint,action:()=>OS.cfg.set('edHint',!S().edHint)}],rc.left,rc.bottom+4);break;

      }

    [$.fq,$.fr].forEach(i=>i.addEventListener('keydown',e=>{

    window.addEventListener('message',onMsg);
    /* 可拖拽分割条：编辑区最小 200px，预览区最小 120px */
    $.split.addEventListener('pointerdown',e=>{
      e.preventDefault();$.split.setPointerCapture(e.pointerId);$.split.classList.add('on');document.body.classList.add('dragging-win');
      const mv=ev=>{const rc=$.main.getBoundingClientRect(),sw=$.split.offsetWidth,w=clamp(ev.clientX-rc.left,200,Math.max(200,rc.width-120-sw));$.left.style.flex='0 0 '+w+'px';$.left.style.width=w+'px'};

      $.split.addEventListener('pointermove',mv);$.split.addEventListener('pointerup',up);$.split.addEventListener('pointercancel',up);

    this.win.el.addEventListener('keydown',e=>{
      const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;

      if(v==='s')return this.save();return v==='d';
    });
    this.win.onDestroy(()=>{                                   // 关闭窗口：释放 CodeMirror 实例，避免内存泄漏
      window.removeEventListener('message',onMsg);this.urls.forEach(u=>URL.revokeObjectURL(u));
      try{this.$.frame.src='about:blank'}catch(e){}

    });
    if(OS.mobile||r.clientWidth<=760)r.classList.remove('show-pv');
  }
}

<script>
/* =====================================================================
   C8 · 漫画阅读器 / 图片查看器 / 媒体播放器 / PDF 查看器 / 字体预览
   ===================================================================== */
(()=>{
'use strict';
const U=OS.U,{q,qa,el,esc,clamp,debounce,P,natCmp,fmtSize,fmtDur,pmap}=U,I=OS.I,fs=OS.fs,ui=OS.ui;
const IMG_RE=/\.(jpe?g|jpe|jfif|pjpeg|pjp|png|apng|gif|webp|bmp|ico|cur|svg|avif)$/i;      // 匹配不区分大小写
const blobOf=async p=>new Blob([await fs.readBlob(p)],{type:U.mimeOf(P.ext(p))});

/* ---------------- 漫画阅读器：条漫式连续垂直滚动 ---------------- */
class Manga{
  constructor(win,args){
    Object.assign(this,{win,path:args.path,zoom:OS.S.mangaZoom||100,urls:[],els:[],imgs:[],keep:false,auto:false,speed:140,pos:0,cur:0,pseudo:false});
    this.root=el(`<div class="mg"><div class="mg-tb"><span class="chip mg-name"></span><span class="grow"></span><button class="btn ico sm" data-a="zo" title="缩小 (-)">${I('zoomOut',15)}</button><span class="chip mg-z"></span><button class="btn ico sm" data-a="zi" title="放大 (+)">${I('zoomIn',15)}</button><button class="btn sm" data-a="fit" title="适应宽度">适应宽度</button><span class="sep"></span><button class="btn ico sm" data-a="auto" title="自动滚动 (A)">${I('play',15)}</button><input type="range" class="mg-sp" min="30" max="700" value="140" style="width:80px" title="滚动速度"><span class="sep"></span><button class="btn sm" data-a="viewer" title="在图片查看器中打开当前页">${I('image',15)}图片查看器</button><button class="btn sm pri" data-a="full" title="全屏沉浸阅读 (F)">${I('full',15)}全屏</button></div>
      <div class="mg-prog"></div><div class="mg-scroll" tabindex="0"><div class="mg-strip"></div></div><div class="mg-load"><div class="spinner"></div><span>正在读取目录…</span><i class="mg-bar"><b></b></i></div><div class="mg-pg"></div><button class="mg-x" title="退出全屏" aria-label="退出全屏">${I('x',16)}</button></div>`);
    win.body.appendChild(this.root);
    Object.assign(this,{sc:q('.mg-scroll',this.root),strip:q('.mg-strip',this.root),load$:q('.mg-load',this.root)});
    this.applyZoom();this.bind();this.load();
  }
  applyZoom(){this.strip.style.setProperty('--zoom',this.zoom);q('.mg-z',this.root).textContent=this.zoom+'%'}
  setZoom(z){const sc=this.sc,ratio=sc.scrollHeight?sc.scrollTop/sc.scrollHeight:0;this.zoom=clamp(Math.round(z),30,400);OS.cfg.set('mangaZoom',this.zoom);this.applyZoom();sc.scrollTop=ratio*sc.scrollHeight}
  async load(){
    const path=this.path,dir=path.slice(0,path.lastIndexOf('/'))||'/';                    // 取目录：路径截取到最后一个 / 之前
    let ents;
    try{ents=await fs.list(dir)}catch(e){ui.alert('无法读取目录：'+dir+'\n'+(e.message||e),'漫画阅读器','warn');this.win.close(true);return}
    const imgs=ents.filter(e=>!e.isDir&&IMG_RE.test(e.name)).sort((a,b)=>natCmp(a.name,b.name));   // 自然数字排序
    if(!imgs.length){ui.alert('该目录下没有可识别的图片文件。','漫画阅读器');this.win.close(true);return}
    this.imgs=imgs;this.target=Math.max(0,imgs.findIndex(e=>e.path===path));
    q('.mg-name',this.root).textContent=(P.base(dir)||'此设备')+' · '+imgs.length+' 页';this.win.setTitle('漫画阅读器 - '+P.base(path));
    const results=new Array(imgs.length);let next=0,done=0,fails=0;
    const flush=()=>{while(next<imgs.length&&results[next]!==undefined){if(results[next])this.insert(next,results[next],imgs[next]);next++}};   // 并行读取，按序插入
    await pmap(imgs,async(e,i)=>{
      try{const f=await fs.readBlob(e.path);results[i]=new Blob([f],{type:U.mimeOf(e.ext)})}catch(err){results[i]=null;fails++}
      done++;this.progress(done,imgs.length);flush();
    },10);
    flush();this.progress(imgs.length,imgs.length);
    if(fails)ui.toast('有 '+fails+' 张图片读取失败，已自动跳过',{type:'warn'});
    setTimeout(()=>{this.keep=false},4000);
  }
  progress(d,t){
    q('span',this.load$).textContent='正在加载 '+d+' / '+t;q('.mg-bar b',this.load$).style.width=(d/t*100)+'%';
    if(d>=t)setTimeout(()=>{this.load$.classList.add('done')},500);
  }
  insert(i,blob,e){
    const url=URL.createObjectURL(blob);this.urls.push(url);
    const im=new Image();im.className='mg-img';im.decoding='async';im.alt=e.name;im.dataset.i=i;im.draggable=false;im.style.minHeight='240px';
    im.onload=()=>{im.style.minHeight='';if(this.keep&&i<=this.target)this.toTarget();this.upd()};
    im.onerror=()=>{im.remove();this.els[i]=null;this.upd()};         // 单张失败：跳过，继续渲染其余
    im.src=url;this.strip.appendChild(im);this.els[i]=im;
    if(i===this.target){this.keep=true;this.toTarget()}
  }
  toTarget(){const t=this.els[this.target];if(t)this.sc.scrollTop=t.offsetTop}       // 自动定位到用户点击的那一页
  upd(){
    const sc=this.sc,y=sc.scrollTop+sc.clientHeight*.35;let cur=0;
    for(let i=0;i<this.els.length;i++){const n=this.els[i];if(n&&n.offsetTop<=y)cur=i;else if(n)break}
    this.cur=cur;q('.mg-pg',this.root).textContent=(cur+1)+' / '+this.imgs.length;
    q('.mg-prog',this.root).style.width=(sc.scrollHeight>sc.clientHeight?sc.scrollTop/(sc.scrollHeight-sc.clientHeight)*100:100)+'%';
  }
  toggleAuto(force){
    this.auto=force!=null?force:!this.auto;q('[data-a="auto"]',this.root).innerHTML=I(this.auto?'pause':'play',15);
    cancelAnimationFrame(this.raf);
    if(this.auto){let last=performance.now();this.pos=this.sc.scrollTop;const step=t=>{if(!this.auto)return;const dt=Math.min(.1,(t-last)/1000);last=t;if(Math.abs(this.sc.scrollTop-this.pos)>3)this.pos=this.sc.scrollTop;this.pos+=this.speed*dt;this.sc.scrollTop=this.pos;this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)}
  }
  /* 全屏：原生 Fullscreen API（进入 / 退出两条路径）+ iOS 等无 API 环境的 CSS 伪全屏；全屏时隐藏标题栏，仅留右上角退出按钮 */
  async enterFS(){
    const w=this.win.el;
    if(w.requestFullscreen){try{await w.requestFullscreen();return}catch(e){}}
    else if(w.webkitRequestFullscreen){try{w.webkitRequestFullscreen();return}catch(e){}}
    this.pseudo=true;w.classList.add('pfs','fs-hide');document.body.classList.add('mg-pfs');
  }
  async exitFS(){
    if(this.pseudo){this.pseudo=false;this.win.el.classList.remove('pfs','fs-hide');document.body.classList.remove('mg-pfs');return}
    if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
  }
  bind(){
    const sc=this.sc,r=this.root;
    let ticking=false;sc.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;this.upd()})},{passive:true});
    ['wheel','touchstart','pointerdown','keydown'].forEach(ev=>sc.addEventListener(ev,()=>{this.keep=false},{passive:true}));
    sc.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();this.setZoom(this.zoom*(e.deltaY<0?1.1:.9))}},{passive:false});
    sc.addEventListener('dblclick',()=>this.enterFS());
    sc.addEventListener('pointerdown',()=>sc.focus({preventScroll:true}));
    q('.mg-sp',r).addEventListener('input',e=>{this.speed=+e.target.value});
    r.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(b){const a=b.dataset.a;
        if(a==='zi')this.setZoom(this.zoom+10);else if(a==='zo')this.setZoom(this.zoom-10);else if(a==='fit')this.setZoom(100);
        else if(a==='auto')this.toggleAuto();else if(a==='full')this.enterFS();
        else if(a==='viewer'&&this.imgs[this.cur])OS.launch('viewer',{path:this.imgs[this.cur].path})}
      if(e.target.closest('.mg-x'))this.exitFS();
      if(e.target.closest('.mg-pg')){}
    });
    q('.mg-pg',r).style.pointerEvents='auto';q('.mg-pg',r).style.cursor='pointer';
    q('.mg-pg',r).addEventListener('click',async()=>{const n=await ui.prompt('跳转到第几页？（1 – '+this.imgs.length+'）',String(this.cur+1),{title:'页面跳转'});const i=parseInt(n,10);if(i>=1&&i<=this.imgs.length&&this.els[i-1])sc.scrollTop=this.els[i-1].offsetTop});
    sc.addEventListener('keydown',e=>{
      if(e.key==='+'||e.key==='=')this.setZoom(this.zoom+10);else if(e.key==='-')this.setZoom(this.zoom-10);else if(e.key==='0')this.setZoom(100);
      else if(e.key.toLowerCase()==='f')this.enterFS();else if(e.key.toLowerCase()==='a')this.toggleAuto();else if(e.key==='Escape'&&this.pseudo)this.exitFS();
      else if(e.key===' '){e.preventDefault();sc.scrollBy({top:(e.shiftKey?-1:1)*sc.clientHeight*.9,behavior:'smooth'})}
    });
    const onFs=()=>{const on=document.fullscreenElement===this.win.el||document.webkitFullscreenElement===this.win.el;this.win.el.classList.toggle('fs-hide',on||this.pseudo);setTimeout(()=>this.upd(),80)};
    document.addEventListener('fullscreenchange',onFs);document.addEventListener('webkitfullscreenchange',onFs);
    this.win.onDestroy(()=>{
      document.removeEventListener('fullscreenchange',onFs);document.removeEventListener('webkitfullscreenchange',onFs);
      cancelAnimationFrame(this.raf);if(this.pseudo)document.body.classList.remove('mg-pfs');if(document.fullscreenElement===this.win.el)document.exitFullscreen().catch(()=>{});
      this.urls.forEach(u=>URL.revokeObjectURL(u));
    });
  }
}
OS.registerApp({id:'manga',name:'漫画阅读器',icon:'book',color:'#ff7ab8',w:860,h:700,minW:340,minH:300,kw:'manga comic 漫画 阅读 条漫',open:(win,args)=>{new Manga(win,args)}});

/* ---------------- 图片查看器：缩放 / 平移 / 旋转 / 翻转 / 幻灯片 ---------------- */
class ImgView{
  constructor(win,args){
    Object.assign(this,{win,list:[],idx:0,s:1,x:0,y:0,r:0,fx:1,url:null,slide:null,bg:0,ptrs:new Map()});

}

const MEDIA_RE=/\.(mp3|wav|ogg|oga|opus|flac|aac|m4a|weba|aiff|mp4|webm|ogv|m4v|mov|mkv|3gp)$/i;
class Player{
  constructor(win,args){
    Object.assign(this,{win,list:[],idx:0,url:null,loop:0,shuffle:false,ac:null,an:null,raf:0});

      <div class="pl-ctl"><button class="btn ico sm" data-a="prev">${I('prev',15)}</button><button class="btn ico sm pri" data-a="play">${I('play',15)}</button><button class="btn ico sm" data-a="next">${I('next',15)}</button><span class="pl-t t1">0:00</span><input type="range" class="seek" min="0" max="1000" value="0"><span class="pl-t t2">0:00</span><button class="btn ico sm" data-a="mute">${I('vol',15)}</button><input type="range" class="vol" min="0" max="1" step="0.01" value="1"><button class="btn sm" data-a="speed">1×</button><button class="btn ico sm" data-a="loop" title="循环模式：关 / 单曲 / 列表">${I('loop',15)}</button><button class="btn ico sm" data-a="shuf" title="随机播放">${I('shuffle',15)}</button><button class="btn ico sm" data-a="pip" title="画中画">${I('pip',15)}</button><button class="btn ico sm" data-a="full" title="全屏">${I('full',15)}</button><button class="btn ico sm" data-a="list" title="播放列表">${I('list',15)}</button></div></div><aside class="pl-list"></aside></div>`);
    win.body.appendChild(this.root);
    Object.assign(this,{v:q('video',this.root),stage:q('.pl-stage',this.root),cv:q('.pl-vis',this.root),lst:q('.pl-list',this.root)});
    this.root.style.containerType='inline-size';this.bind();this.init(args.path);
  }
  async init(path){
    try{this.list=(await fs.list(P.dir(path))).filter(e=>!e.isDir&&MEDIA_RE.test(e.name)).sort((a,b)=>natCmp(a.name,b.name))}catch(e){}
    if(!this.list.length)this.list=[{path,name:P.base(path)}];this.idx=Math.max(0,this.list.findIndex(e=>e.path===path));
    this.lst.innerHTML=this.list.map((e,i)=>`<div class="pl-it" data-i="${i}">${I(/\.(mp4|webm|ogv|m4v|mov|mkv|3gp)$/i.test(e.name)?'film':'music',15)}<span>${esc(e.name)}</span></div>`).join('');

  }
  async play(i){
    this.idx=i;const e=this.list[i];if(!e)return;

    try{
      const blob=await blobOf(e.path);if(this.url)URL.revokeObjectURL(this.url);this.url=URL.createObjectURL(blob);
      const isVid=/\.(mp4|webm|ogv|m4v|mov|mkv|3gp)$/i.test(e.name)||blob.type.startsWith('video');

    }catch(err){ui.toast('无法读取媒体文件：'+err.message,{type:'err'})}
  }

    vol.addEventListener('input',()=>{v.volume=+vol.value;v.muted=false;q('[data-a="mute"]',r).innerHTML=I(+vol.value?'vol':'mute',15)});
    q('.pl-list',r).addEventListener('click',e=>{const it=e.target.closest('.pl-it');if(it)this.play(+it.dataset.i)});
    r.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
      if(a==='play')v.paused?v.play():v.pause();else if(a==='prev')this.step(-1);else if(a==='next')this.step(1);
      else if(a==='mute'){v.muted=!v.muted;b.innerHTML=I(v.muted?'mute':'vol',15)}
      else if(a==='speed'){const sp=[.5,.75,1,1.25,1.5,2],n=sp[(sp.indexOf(v.playbackRate)+1)%sp.length];v.playbackRate=n;b.textContent=n+'×'}
      else if(a==='loop'){this.loop=(this.loop+1)%3;b.classList.toggle('on',this.loop>0);b.title=['循环：关','循环：单曲','循环：列表'][this.loop];ui.toast(b.title,{timeout:1200})}
      else if(a==='shuf'){this.shuffle=!this.shuffle;b.classList.toggle('on',this.shuffle)}

    });

      if(e.target.closest('input'))return;const k=e.key;

(()=>{

const U=OS.U,{q,qa,el,esc,clamp,debounce,P,fmtSize}=U,I=OS.I,fs=OS.fs,ui=OS.ui;

const SEARCH={bing:'https://www.bing.com/search?q=',baidu:'https://www.baidu.com/s?wd=',ddg:'https://duckduckgo.com/?q=',google:'https://www.google.com/search?igu=1&q='};
const LINKS=[['维基百科','https://zh.wikipedia.org/'],['MDN 文档','https://developer.mozilla.org/zh-CN/'],['开放街图','https://www.openstreetmap.org/export/embed.html'],['必应','https://cn.bing.com/'],['Hacker News','https://news.ycombinator.com/'],['互联网档案馆','https://archive.org/']];
const HOME=()=>'<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>起始页</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 15%,#2a1b3d,#0d1017 62%);color:#ece6d6;font-family:sans-serif}.w{width:min(640px,92vw);text-align:center}h1{font-weight:300;letter-spacing:.45em;margin:0 0 28px}form{display:flex;border:1px solid #ffffff33;border-radius:16px 4px 16px 4px;overflow:hidden;background:#0009}input{flex:1;padding:14px 18px;background:none;border:0;outline:0;color:inherit;font-size:16px}button{border:0;padding:0 24px;background:#ff7a3d;color:#1a0c04;font-weight:700;cursor:pointer}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:30px}.g a{padding:16px 8px;border:1px solid #ffffff22;border-radius:14px 3px 14px 3px;color:inherit;text-decoration:none;font-size:13px;background:#ffffff08;transition:.2s}.g a:hover{border-color:#ff7a3d;transform:translate(-2px,-2px);box-shadow:4px 4px 0 #ff7a3d55}small{display:block;margin-top:26px;opacity:.5;line-height:1.8}</style></head><body><div class="w"><h1>叠影浏览</h1><form onsubmit="go(q.value);return false"><input id="q" placeholder="搜索或输入网址" autofocus><button>前往</button></form><div class="g">'+LINKS.map(([n,u])=>'<a href="#" onclick="go(\''+u+'\');return false">'+n+'</a>').join('')+'</div><small>提示：部分网站禁止被嵌入框架显示，可点击工具栏“新标签页打开”。<br>也可以输入 /文档/示例页面.html 打开虚拟文件系统中的网页。</small></div><script>function go(v){parent.postMessage({__br:1,q:v},"*")}<\/script></body></html>';
async function bundleHtml(path){
  const text=U.decodeText(await fs.readFile(path)).text,doc=new DOMParser().parseFromString(text,'text/html'),base=P.dir(path),made=[];
  const abs=u=>{if(!u||/^(https?:|data:|blob:|#|mailto:|javascript:|\/\/|about:)/i.test(u))return null;const c=u.split('#')[0].split('?')[0];try{return c.startsWith('/')?P.norm(decodeURIComponent(c)):P.join(base,decodeURIComponent(c))}catch(e){return null}};
  const blobUrl=async p=>{try{const b=new Blob([await fs.readBlob(p)],{type:U.mimeOf(P.ext(p))}),u=URL.createObjectURL(b);made.push(u);return u}catch(e){return null}};
  const cssFix=async(css,cb)=>{
    const re=/url\(\s*(['"]?)([^'")]+)\1\s*\)/g,us=new Set();css.replace(re,(m,q1,u)=>{us.add(u);return m});const map={};
    for(const u of us){if(/^(https?:|data:|blob:|#)/i.test(u))continue;const c=u.split('#')[0].split('?')[0],p=c.startsWith('/')?P.norm(c):P.join(cb,c);const b=await blobUrl(p);if(b)map[u]=b}
    return css.replace(re,(m,q1,u)=>map[u]?'url("'+map[u]+'")':m);
  };
  for(const n of [...doc.querySelectorAll('link[rel~="stylesheet"][href]')]){
    const p=abs(n.getAttribute('href'));if(!p)continue;
    try{const css=U.decodeText(await fs.readFile(p)).text,st=doc.createElement('style');st.textContent=await cssFix(css,P.dir(p));n.replaceWith(st)}catch(e){}
  }
  for(const st of [...doc.querySelectorAll('style')])st.textContent=await cssFix(st.textContent,base);
  for(const[sel,at]of[['script[src]','src'],['img[src]','src'],['source[src]','src'],['video[src]','src'],['video[poster]','poster'],['audio[src]','src'],['link[rel~="icon"][href]','href'],['embed[src]','src'],['iframe[src]','src']]){
    for(const n of doc.querySelectorAll(sel)){const p=abs(n.getAttribute(at));if(!p)continue;const b=await blobUrl(p);if(b)n.setAttribute(at,b)}
  }
  return{html:'<!DOCTYPE html>\n'+doc.documentElement.outerHTML,urls:made};
}
class Browser{
  constructor(win,args){
    Object.assign(this,{win,hist:[],hi:-1,urls:[],cur:''});
    this.root=el(`<div class="br"><div class="br-tb"><button class="btn ico sm" data-a="back" title="后退">${I('back',15)}</button><button class="btn ico sm" data-a="fwd" title="前进">${I('fwd',15)}</button><button class="btn ico sm" data-a="reload" title="刷新">${I('refresh',15)}</button><button class="btn ico sm" data-a="home" title="起始页">${I('home',15)}</button><label class="br-addr">${I('globe',14)}<input placeholder="搜索或输入网址；也可输入虚拟文件路径，如 /文档/示例页面.html" spellcheck="false" autocomplete="off"></label><button class="btn sm pri" data-a="go">前往</button><button class="btn sm" data-a="tab" title="在新标签页打开">${I('ext',15)}新标签页</button></div><div class="br-hint hidden"></div><div class="br-prog"><i></i></div><div class="br-fw"><iframe sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation-by-user-activation allow-popups-to-escape-sandbox allow-downloads" title="网页"></iframe></div></div>`);
    win.body.appendChild(this.root);Object.assign(this,{f:q('iframe',this.root),inp:q('.br-addr input',this.root),hint:q('.br-hint',this.root)});
    this.bind();
    if(args.html!=null)this.openHtml(args.html,args.title||'预览');else if(args.path)this.go('vfs://'+args.path);else if(args.url)this.go(args.url);else this.go('about:home');
  }
  mk(html){const u=URL.createObjectURL(new Blob([html],{type:'text/html'}));this.urls.push(u);return u}
  openHtml(html,title){this.push({addr:'预览：'+title,src:this.mk(html),title,ext:false})}
  push(e,replace){
    if(!replace){this.hist=this.hist.slice(0,this.hi+1);this.hist.push(e);this.hi=this.hist.length-1}else this.hist[this.hi]=e;
    this.show(e);
  }
  show(e){
    this.cur=e;this.inp.value=e.addr;this.f.src=e.src;this.win.setTitle((e.title||e.addr)+' - 浏览器');
    q('.br-prog i',this.root).style.width='30%';this.hint.classList.toggle('hidden',!e.ext);
    if(e.ext)this.hint.innerHTML=I('info',14)+'<span>如果页面空白或提示拒绝连接，说明该网站禁止被嵌入框架。</span><a data-a="tab">在新标签页打开</a>';
    const set=(a,d)=>{const b=q(`[data-a="${a}"]`,this.root);if(b)b.disabled=d};set('back',this.hi<=0);set('fwd',this.hi>=this.hist.length-1);
  }
  async go(v,replace){
    v=String(v||'').trim();if(!v||v==='about:home'){this.push({addr:'about:home',src:this.mk(HOME()),title:'起始页',ext:false},replace);return}
    if(/^vfs:\/\//i.test(v)||v.startsWith('/')){
      const p=fs.norm(v.replace(/^vfs:\/\//i,''));
      try{
        const st=await fs.stat(p);if(st.isDirectory()){OS.launch('explorer',{path:p});return}
        const ext=P.ext(p);let src;
        if(ext==='html'||ext==='htm'||ext==='xhtml'){const b=await bundleHtml(p);this.urls.push(...b.urls);src=this.mk(b.html)}
        else{const blob=new Blob([await fs.readBlob(p)],{type:U.mimeOf(ext)});src=URL.createObjectURL(blob);this.urls.push(src)}
        this.push({addr:'vfs://'+p,src,title:P.base(p),ext:false},replace);
      }catch(e){ui.toast('无法打开：'+e.message,{type:'err'})}
      return;
    }
    let url=v;
    if(/^(blob:|data:)/i.test(v)){}
    else if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)){
      if(/^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?([\/?#].*)?$/i.test(v)&&!/\s/.test(v))url='https://'+v;
      else url=(SEARCH[OS.S.search]||SEARCH.bing)+encodeURIComponent(v);
    }
    this.push({addr:url,src:url,title:url.replace(/^https?:\/\//,'').split('/')[0],ext:true},replace);
  }
  bind(){
    const r=this.root;
    r.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
      if(a==='back'&&this.hi>0){this.hi--;this.show(this.hist[this.hi])}else if(a==='fwd'&&this.hi<this.hist.length-1){this.hi++;this.show(this.hist[this.hi])}
      else if(a==='reload')this.show(this.cur);else if(a==='home')this.go('about:home');else if(a==='go')this.go(this.inp.value);
      else if(a==='tab'){const s=this.cur&&this.cur.src;if(s)window.open(s,'_blank')}
    });
    this.inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')this.go(this.inp.value)});
    this.inp.addEventListener('focus',()=>this.inp.select());
    this.f.addEventListener('load',()=>{
      q('.br-prog i',r).style.width='100%';setTimeout(()=>{q('.br-prog i',r).style.width='0'},300);
      try{const t=this.f.contentDocument&&this.f.contentDocument.title;if(t&&this.cur){this.cur.title=t;this.win.setTitle(t+' - 浏览器')}}catch(e){}
    });
    const onMsg=e=>{if(e.source===this.f.contentWindow&&e.data&&e.data.__br)this.go(e.data.q)};window.addEventListener('message',onMsg);
    this.win.onDestroy(()=>{window.removeEventListener('message',onMsg);this.urls.forEach(u=>URL.revokeObjectURL(u));this.f.src='about:blank'});
  }
}
OS.registerApp({id:'browser',name:'网页浏览器',icon:'globe',color:'#5be7ff',w:980,h:640,minW:340,minH:280,kw:'web browser 浏览器 网页 网址',open:(win,args)=>{new Browser(win,args)}});

/* ---------------- 计算器 ---------------- */
function calc(s,deg){
  const tk=[],re=/\s*(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|[a-zπ]+|[-+*\/^%!(),])/gy;s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt');
  while(re.lastIndex<s.length){const m=re.exec(s);if(!m){if(/^\s*$/.test(s.slice(re.lastIndex)))break;throw new Error('无效输入')}tk.push(m[1])}
  let p=0;const peek=()=>tk[p],next=()=>tk[p++];
  const fact=n=>{if(!Number.isInteger(n)||n<0||n>170)throw new Error('阶乘范围错误');let r=1;for(let i=2;i<=n;i++)r*=i;return r};
  const rad=x=>deg?x*Math.PI/180:x,back=x=>deg?x*180/Math.PI:x;
  const F={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>back(Math.asin(x)),acos:x=>back(Math.acos(x)),atan:x=>back(Math.atan(x)),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp};
  const C={pi:Math.PI,'π':Math.PI,e:Math.E};
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=next(),r=term();v=o==='+'?v+r:v-r}return v}
  function term(){
    let v=unary();
    for(;;){
      const t=peek();
      if(t==='*'||t==='/'){next();const r=unary();v=t==='*'?v*r:v/r}
      else if(t!==undefined&&(/^[0-9.]/.test(t)||/^[a-zπ]/.test(t)||t==='(')){v*=unary()}
      else break;
    }
    return v;
  }
  function unary(){const t=peek();if(t==='-'){next();return-unary()}if(t==='+'){next();return unary()}return power()}
  function power(){const b=post();if(peek()==='^'){next();return Math.pow(b,unary())}return b}
  function post(){let v=prim();while(peek()==='!'||peek()==='%'){v=next()==='!'?fact(v):v/100}return v}
  function prim(){
    const t=next();if(t===undefined)throw new Error('表达式不完整');
    if(/^[0-9.]/.test(t))return parseFloat(t);
    if(t==='('){const v=expr();if(peek()===')')next();return v}
    if(t in C)return C[t];
    if(F[t]){if(peek()!=='(')throw new Error('函数需要括号');next();const v=expr();if(peek()===')')next();return F[t](v)}
    throw new Error('未知符号 '+t);
  }
  const v=expr();if(p<tk.length)throw new Error('表达式有误');
  if(!isFinite(v))throw new Error('结果无效');return parseFloat(v.toPrecision(12));
}
class Calc{
  constructor(win){
    Object.assign(this,{win,e:'',r:'0',deg:true,mem:0,hist:store_get(),fresh:false,sci:false});
    const N=[['AC','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['±','fn'],['0'],['.'],['=','eq']];
    const Sc=[['(','fn'],[')','fn'],['mc','fn'],['mr','fn'],['sin','fn'],['cos','fn'],['tan','fn'],['m+','fn'],['ln','fn'],['log','fn'],['√','fn'],['m−','fn'],['x²','fn'],['xʸ','fn'],['n!','fn'],['π','fn'],['e','fn'],['|x|','fn'],['1/x','fn'],['deg','fn']];
    const btn=([l,c])=>`<button class="ca-b ${c||''}" data-k="${esc(l)}">${esc(l)}</button>`;
    this.root=el(`<div class="ca"><div class="ca-m"><div class="tbar" style="padding:0;border:0"><div class="seg"><button data-m="std" class="on">标准</button><button data-m="sci">科学</button></div><span class="grow"></span><button class="btn sm" data-k="hist">${I('clock',14)}历史</button></div><div class="ca-d"><div class="ca-e"></div><div class="ca-r">0</div></div><div class="ca-g"><div class="ca-k s hide">${Sc.map(btn).join('')}</div><div class="ca-k n">${N.map(btn).join('')}</div></div></div><aside class="ca-h hide"><div class="tbar"><b class="grow">计算历史</b><button class="btn sm" data-k="hclr">清空</button></div><div class="ca-hl"></div></aside></div>`);
    win.body.appendChild(this.root);this.root.tabIndex=0;this.render();this.bind();this.renderHist();
  }
  render(){q('.ca-e',this.root).textContent=this.e;q('.ca-r',this.root).textContent=this.fresh?this.r:(this.e?this.e.slice(-40):this.r);q('.ca-r',this.root).style.fontSize=(this.r.length>14?22:34)+'px'}
  renderHist(){
    q('.ca-hl',this.root).innerHTML=this.hist.length?this.hist.map((h,i)=>`<div class="ca-hi" data-i="${i}"><small>${esc(h.e)}</small><b>${esc(h.r)}</b></div>`).join(''):'<div class="empty">暂无记录</div>';
    try{OS.store.set('calc.hist',this.hist.slice(0,40))}catch(e){}
  }
  put(s){if(this.fresh){this.e=/^[+\-×÷−*\/^%]/.test(s)?this.r:'';this.fresh=false}this.e+=s;this.render()}
  eq(){
    if(!this.e)return;
    try{const r=String(calc(this.e,this.deg));this.hist.unshift({e:this.e+' =',r});this.hist=this.hist.slice(0,40);this.r=r;this.e=r;this.fresh=true;this.renderHist()}
    catch(err){this.r='错误';q('.ca-e',this.root).textContent=err.message;this.fresh=true;q('.ca-r',this.root).textContent='错误';return}
    this.render();
  }
  key(k){
    const map={'x²':'^2','xʸ':'^','n!':'!','π':'π','e':'e','|x|':'abs(','1/x':'1/(','sin':'sin(','cos':'cos(','tan':'tan(','ln':'ln(','log':'log(','√':'√('};
    if(/^[0-9.]$/.test(k)||['+','−','×','÷','(',')','%'].includes(k))this.put(k);
    else if(k==='AC'){this.e='';this.r='0';this.fresh=false;this.render()}
    else if(k==='⌫'){if(this.fresh){this.e='';this.fresh=false}else this.e=this.e.slice(0,-1);this.render()}
    else if(k==='='){this.eq()}
    else if(k==='±'){this.fresh=false;this.e=this.e.startsWith('-')?this.e.slice(1):(this.e?'-'+this.e:'-');this.render()}
    else if(k==='deg'){this.deg=!this.deg;q('[data-k="deg"]',this.root).textContent=this.deg?'deg':'rad'}
    else if(k==='mc')this.mem=0;else if(k==='mr')this.put(String(this.mem));
    else if(k==='m+'||k==='m−'){try{const v=this.e?calc(this.e,this.deg):parseFloat(this.r)||0;this.mem+=k==='m+'?v:-v;ui.toast('内存：'+this.mem,{timeout:1200})}catch(e){}}
    else if(map[k])this.put(map[k]);
  }
  bind(){
    const r=this.root;
    r.addEventListener('click',e=>{
      const m=e.target.closest('[data-m]');
      if(m){this.sci=m.dataset.m==='sci';qa('.seg button',r).forEach(b=>b.classList.toggle('on',b===m));q('.ca-k.s',r).classList.toggle('hide',!this.sci);this.win.setRect({w:this.sci?Math.max(this.win.rect.w,640):Math.min(this.win.rect.w,400)});return}
      const h=e.target.closest('.ca-hi');if(h){const it=this.hist[+h.dataset.i];this.e=it.r;this.r=it.r;this.fresh=true;this.render();return}
      const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
      if(k==='hist')q('.ca-h',r).classList.toggle('hide');else if(k==='hclr'){this.hist=[];this.renderHist()}else this.key(k);
    });
    r.addEventListener('keydown',e=>{
      const k=e.key;
      if(/^[0-9.]$/.test(k))this.key(k);else if(k==='+'||k==='(' ||k===')'||k==='%')this.key(k);else if(k==='-')this.key('−');else if(k==='*')this.key('×');else if(k==='/'){e.preventDefault();this.key('÷')}
      else if(k==='^')this.put('^');else if(k==='Enter'||k==='='){e.preventDefault();this.key('=')}else if(k==='Backspace')this.key('⌫');else if(k==='Escape'||k==='Delete')this.key('AC');
    });
    setTimeout(()=>r.focus(),60);
  }
}
function store_get(){try{return OS.store.get('calc.hist',[])||[]}catch(e){return[]}}

function readTar(u8){

        row('持久化存储',persisted?'已获得持久化授权，浏览器不会在空间紧张时清理数据':'尚未授权：空间紧张时浏览器可能清理站点数据，建议申请持久化',persisted?'<span class="chip"><i class="ok-dot"></i>已持久化</span>':'<button class="btn sm pri" data-act="persist">申请持久化</button>'))+
      grp('文件占用（按类型）',`<div class="st-sto">${segs.length?donut(segs,total):'<div class="empty">还没有文件</div>'}<div class="st-lg">${segs.map(s=>`<div class="st-li"><i style="background:${s.c}"></i><span>${esc(s.n)}</span><em>${fmtSize(s.v)} · ${(s.v/total*100).toFixed(1)}%</em><div class="bar"><b style="background:${s.c};width:${(s.v/total*100).toFixed(1)}%"></b></div></div>`).join('')}<div class="dim3" style="font-size:12px;margin-top:4px">${res.files} 个文件 · ${Math.max(0,res.dirs)} 个文件夹</div></div></div>`)+
      grp('按位置',Object.entries(res.byTop).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="st-li" style="padding:6px 0"><i style="background:var(--ac)"></i><span>/${esc(n)}</span><em>${fmtSize(v)} · ${(v/total*100).toFixed(1)}%</em><div class="bar"><b style="background:var(--ac);width:${(v/total*100).toFixed(1)}%"></b></div></div>`).join('')||'<div class="empty">—</div>')+
      grp('最大的文件',res.largest.map(f=>`<div class="st-big" data-reveal="${esc(f.path)}">${OS.fileIcon(P.base(f.path),false,20)}<span>${esc(f.path)}</span><em>${fmtSize(f.size)}</em></div>`).join('')||'<div class="empty">—</div>')+
      `<button class="btn" data-act="rescan">${I('refresh',15)}重新统计</button>`;
    requestAnimationFrame(()=>{const b=q('#qb',box);if(b)b.style.width=Math.max(pct,est.usage?.8:0)+'%'});
  }
  p_mounts(){
    const ms=fs.mountList(),pend=fs.pending||[];
    this.c.innerHTML='<h2>本地挂载</h2><p class="sub">把电脑上的真实文件夹挂载进虚拟文件系统（File System Access API）</p>'+
      grp('已挂载的文件夹',(ms.length?ms.map(m=>row('<span class="mono">'+esc(m.mp)+'</span>','读写权限 · 功能与虚拟文件夹完全一致',`<button class="btn sm" data-open="${esc(m.mp)}">打开</button><button class="btn sm dng" data-unmount="${esc(m.mp)}">卸载</button>`)).join(''):'<div class="empty" style="padding:22px">尚未挂载任何本地文件夹</div>')+
        (pend.length?row('待重新授权：'+pend.map(p=>esc(p.name)).join('、'),'浏览器刷新后需要重新授权访问权限','<button class="btn sm pri" data-act="remount">重新授权并挂载</button>'):''))+
      grp('',(fs.canMount()?row('挂载新的文件夹','选择电脑上的文件夹，将出现在 /mnt/local/文件夹名','<button class="btn pri" data-act="mount">'+I('plug',15)+'选择文件夹…</button>'):row('当前浏览器不支持','需要桌面版 Chrome / Edge 等支持 showDirectoryPicker 的浏览器',''))+
        row('启动时提醒重新挂载','刷新页面后浏览器会撤销目录权限，开启后启动时弹出提醒',sw('mountRemind')));
  }
  async p_system(){
    const hasIdb=await OS.idb.ok(),ck=navigator.cookieEnabled;
    const dot=(b,t)=>`<i class="ok-dot ${b?'':'no-dot'}"></i>${t}`;
    this.c.innerHTML=`<h2>系统与重置</h2><p class="sub">叠影 OS ${OS.version} · Ghostgauge 设计语言</p>`+
      grp('存储分层',`<div class="st-kv"><span>文件内容</span><b>${dot(fs.kind==='opfs',{opfs:'OPFS 原生文件系统',idb:'IndexedDB（OPFS 不可用，已降级）',mem:'内存（已降级，数据不会保留）'}[fs.kind])}</b><span>元数据 / 挂载句柄</span><b>${dot(hasIdb,'IndexedDB '+(hasIdb?'可用':'不可用'))}</b><span>设置（同步）</span><b>${dot(OS.store.persistent,'localStorage '+(OS.store.persistent?'可用':'不可用，已使用内存 + Cookie'))}</b><span>关键设置镜像</span><b>${dot(ck,'Cookie '+(ck?'已启用':'已禁用'))}</b></div>`)+
      grp('能力检测',`<div class="st-kv"><span>File System Access</span><b>${dot(fs.canMount(),fs.canMount()?'支持（可挂载本地文件夹）':'不支持')}</b><span>原生解压流</span><b>${dot(!!window.DecompressionStream,window.DecompressionStream?'支持 gzip / deflate':'不支持')}</b><span>JSZip</span><b>${dot(!!window.JSZip,window.JSZip?'已加载':'未加载（使用原生 ZIP 实现）')}</b><span>7z-wasm</span><b>${dot(!!window.SevenZipFactory,window.SevenZipFactory?'已就绪（7z / rar / xz / bz2 …）':window.SevenZipFailed?'加载失败':'加载中…')}</b><span>V86 虚拟机</span><b>${dot(!!(window.V86||window.V86Starter),(window.V86||window.V86Starter)?'已加载':'未加载')}</b><span>浏览器</span><b class="selectable">${esc(navigator.userAgent)}</b></div>`)+
      grp('恢复',row('恢复默认设置','仅重置个性化与偏好设置，不删除文件','<button class="btn" data-act="cfgreset">恢复默认</button>'))+
      `<div class="st-g st-danger"><h4 style="color:var(--bad)">危险区域</h4>${row('一键重置系统','清除 OPFS 中的全部文件与文件夹、IndexedDB、本地设置与 Cookie，并重新初始化虚拟文件系统。此操作不可恢复！','<button class="btn dng" data-act="reset">'+I('trash',15)+'重置系统</button>')}</div>`;
  }
  bind(){
    const r=this.root;
    r.addEventListener('click',async e=>{
      const nb=e.target.closest('[data-p]');if(nb){this.go(nb.dataset.p);return}
      const tg=e.target.closest('[data-tg]');if(tg){const k=tg.dataset.tg;OS.cfg.set(k,!S()[k]);tg.classList.toggle('on',S()[k]);tg.setAttribute('aria-checked',!!S()[k]);if(k==='clock12'||k==='showSec')this.go('time');return}
      const sg=e.target.closest('.seg[data-seg] button');
      if(sg){const k=sg.parentElement.dataset.seg,cur=S()[k];let v=sg.dataset.v;v=typeof cur==='number'?Number(v):typeof cur==='boolean'?v==='true':v;OS.cfg.set(k,v);
        if(k==='theme'){const d=document.documentElement.dataset.theme;if(d==='light'&&S().wall==='strata')OS.cfg.set('wall','dawn');else if(d==='dark'&&S().wall==='dawn')OS.cfg.set('wall','strata')}
        this.go(this.page);return}
      const ac=e.target.closest('[data-ac]');if(ac){OS.cfg.set('accentCustom','');OS.cfg.set('accent',ac.dataset.ac);this.go('personal');return}
      const wl=e.target.closest('[data-wall]');if(wl){OS.cfg.set('wall',wl.dataset.wall);qa('.st-w',r).forEach(b=>b.classList.toggle('on',b===wl));return}
      const rv=e.target.closest('[data-reveal]');if(rv){OS.launch('explorer',{path:P.dir(rv.dataset.reveal)});return}
      const op=e.target.closest('[data-open]');if(op){OS.launch('explorer',{path:op.dataset.open});return}
      const um=e.target.closest('[data-unmount]');if(um){if(await ui.confirm('卸载“'+P.base(um.dataset.unmount)+'”？\n电脑上的文件不会被删除。',{title:'卸载',ok:'卸载'})){await fs.unmount(um.dataset.unmount);ui.toast('已卸载',{type:'ok'})}return}
      const ab=e.target.closest('[data-act]');if(!ab)return;const a=ab.dataset.act;
      if(a==='persist'){const ok=await fs.persist();ui.toast(ok?'已获得持久化存储授权':'浏览器未授予持久化（可能需要先收藏站点或安装为应用）',{type:ok?'ok':'warn'});this.go('storage')}
      else if(a==='rescan')this.go('storage');
      else if(a==='mount'){await OS.files.mountLocal()}
      else if(a==='remount'){const n=await fs.remountPending();ui.toast(n?'已重新挂载 '+n+' 个文件夹':'未获得授权',{type:n?'ok':'warn'});this.go('mounts')}
      else if(a==='cfgreset'){if(await ui.confirm('恢复所有偏好设置为默认值？（文件不受影响）')){OS.cfg.reset();ui.toast('已恢复默认设置',{type:'ok'});this.go(this.page)}}
      else if(a==='reset'){
        const v=await ui.prompt('此操作将永久删除全部文件、设置和本地数据，且无法恢复。\n如确认，请输入“重置”二字：','',{title:'重置系统',icon:'warn',ok:'立即重置',validate:s=>s.trim()==='重置'?'':'请输入“重置”以确认'});
        if(v==null)return;const t=ui.toast('正在清除数据…',{timeout:0,icon:'trash'});
        try{await fs.reset()}catch(err){console.error(err)}t.close();location.reload();
      }
    });
    r.addEventListener('change',e=>{
      const s=e.target.closest('select[data-sel]');if(s){const k=s.dataset.sel,cur=S()[k];OS.cfg.set(k,typeof cur==='number'?Number(s.value):s.value);if(k==='dateFmt')this.go('time');return}
      const ar=e.target.closest('[data-arr]');if(ar&&ar.value){OS.desk.arrange(ar.value);ar.value='';ui.toast('图标已重新排列',{timeout:1400});return}
      const cc=e.target.closest('[data-accc]');if(cc){OS.cfg.set('accentCustom',cc.value)}
    });
    r.addEventListener('input',e=>{
      const g=e.target.closest('[data-rg]');if(g){const k=g.dataset.rg,v=+g.value;OS.cfg.set(k,v);g.nextElementSibling.textContent=v;return}
      const cc=e.target.closest('[data-accc]');if(cc)OS.cfg.set('accentCustom',cc.value);
    });
  }
}
OS.registerApp({id:'settings',name:'设置',icon:'gear',color:'#c5c9d6',w:920,h:640,minW:340,minH:340,single:true,kw:'settings 设置 系统 主题 壁纸 存储',open:(win,args)=>{new Settings(win,args)},onArgs:(win,args)=>{if(win.settings&&args.page)win.settings.go(args.page)}});
})();
