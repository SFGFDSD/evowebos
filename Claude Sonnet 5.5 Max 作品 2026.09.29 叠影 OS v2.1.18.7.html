<script>
/* =====================================================================
   C11 · 虚拟机（v86 0.5.319 固定版本）+ 系统启动
   ===================================================================== */
(()=>{
'use strict';
const U=OS.U,{q,qa,el,esc,P,fmtSize}=U,I=OS.I,fs=OS.fs,ui=OS.ui,wm=OS.wm;
/* 版本锁定：JS 与 wasm 同为 0.5.319；BIOS 来自固定 commit；镜像只能来自虚拟文件系统（以 buffer 挂载，绝不使用 url: 加载外部 iso/img） */
const LIB_URL='https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js';
const WASM_URL='https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm';
const BIOS_URL='https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin';
const VGABIOS_URL='https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin';
class VM{
  constructor(win,args){
    Object.assign(this,{win,emu:null,img:null,state:'idle',autoLock:true});
    this.root=el(`<div class="vm"><div class="tbar">
      <button class="btn sm" data-a="pick" title="从虚拟文件系统选择 ISO / IMG 镜像">${I('folderOpen',14)}选择镜像</button><button class="btn sm" data-a="import" title="从电脑导入镜像到虚拟文件系统">${I('upload',14)}导入镜像</button>
      <select class="inp slot" title="挂载方式"><option value="auto">挂载：按后缀自动</option><option value="cdrom">光驱 (cdrom)</option><option value="fda">软盘 (fda)</option><option value="hda">硬盘 (hda)</option></select>
      <select class="inp mem" title="内存大小"><option value="64">64 MB</option><option value="128">128 MB</option><option value="256" selected>256 MB</option><option value="512">512 MB</option><option value="1024">1024 MB</option></select><span class="sep"></span>
      <button class="btn sm pri" data-a="start">${I('play',14)}启动</button><button class="btn sm" data-a="pause">${I('pause',14)}暂停</button><button class="btn sm" data-a="reset">${I('refresh',14)}重启</button><button class="btn sm dng" data-a="stop">${I('stop',14)}关闭</button><span class="sep"></span>
      <button class="btn sm" data-a="cad" title="发送 Ctrl+Alt+Del">${I('keyboard',14)}Ctrl+Alt+Del</button><button class="btn sm" data-a="lock" title="鼠标锁定：捕获鼠标供虚拟机使用（Esc 释放）">${I('lock',14)}鼠标锁定</button><button class="btn sm" data-a="shot">${I('camera',14)}截图</button><button class="btn sm" data-a="full">${I('full',14)}全屏</button><button class="btn sm" data-a="savest" title="保存虚拟机状态">${I('save',14)}存档</button><button class="btn sm" data-a="loadst" title="恢复虚拟机状态">${I('undo',14)}读档</button></div>
      <div class="vm-stage"><div id="screen_container"><div style="white-space: pre; font: 14px monospace; line-height: 14px"></div><canvas style="display: none"></canvas></div>
        <div class="vm-ph"><div>${I('vm',52)}</div><b>叠影虚拟机 · x86 (v86)</b><small>先点击“选择镜像”或“导入镜像”：ISO 挂载为光驱，IMG / FDA / BIN 挂载为软盘，其他文件挂载为硬盘。<br>镜像仅从虚拟文件系统读取（不会从外部 URL 加载）。不选镜像也可直接启动，进入 BIOS 界面。</small></div><div class="vm-lock">鼠标已锁定 · 按 Esc 或 Ctrl+Alt 释放</div></div>
      <div class="stbar"><span class="s1">状态：未启动</span><span class="s2">镜像：无</span><span class="grow"></span><span class="s3 dim3">v86 0.5.319 · SeaBIOS</span></div></div>`);
    win.body.appendChild(this.root);
    Object.assign(this,{sc:q('#screen_container',this.root),ph:q('.vm-ph',this.root),lk:q('.vm-lock',this.root)});
    this.bind();this.setState('idle');
    if(args.path)this.setImage(args.path).then(()=>this.start());
  }
  slot(){
    const s=q('.slot',this.root).value;if(s!=='auto')return s;
    const ext=this.img?P.ext(this.img.path):'';
    if(ext==='iso')return 'cdrom';if(ext==='img'||ext==='fda'||ext==='bin')return 'fda';return 'hda';
  }
  async setImage(path){
    try{const st=await fs.stat(path);this.img={path,name:P.base(path),size:st.size};q('.s2',this.root).textContent='镜像：'+this.img.name+'（'+fmtSize(st.size)+'，'+({cdrom:'光驱',fda:'软盘',hda:'硬盘'}[this.slot()])+'）'}
    catch(e){ui.toast('无法读取镜像：'+e.message,{type:'err'})}
  }
  setState(s){
    this.state=s;const L={idle:'未启动',loading:'正在加载引擎与镜像…',running:'运行中',paused:'已暂停'}[s];q('.s1',this.root).textContent='状态：'+L;
    const on=(a,v)=>{const b=q(`[data-a="${a}"]`,this.root);if(b)b.disabled=!v};
    on('start',s==='idle');on('pause',s==='running'||s==='paused');on('reset',s==='running'||s==='paused');on('stop',s!=='idle');
    on('cad',s==='running');on('shot',s==='running'||s==='paused');on('savest',s==='running'||s==='paused');on('loadst',s==='running'||s==='paused');
    q('[data-a="pause"]',this.root).innerHTML=I(s==='paused'?'play':'pause',14)+(s==='paused'?'继续':'暂停');this.ph.classList.toggle('hide',s==='running'||s==='paused'||s==='loading');
  }
  async start(){
    if(this.emu)await this.kill();
    this.setState('loading');
    if(!(window.V86||window.V86Starter)){try{await U.loadScript(LIB_URL,20000)}catch(e){}}
    const Ctor=window.V86||window.V86Starter;
    if(!Ctor){ui.toast('V86 引擎加载失败，请检查网络后重试',{type:'err'});this.setState('idle');return}
    const opts={wasm_path:WASM_URL,memory_size:(+q('.mem',this.root).value)*1024*1024,vga_memory_size:16*1024*1024,screen_container:this.sc,bios:{url:BIOS_URL},vga_bios:{url:VGABIOS_URL},autostart:true};
    if(this.img){
      try{const buf=await fs.readFile(this.img.path);opts[this.slot()]={buffer:buf}}
      catch(e){ui.toast('读取镜像失败：'+e.message,{type:'err'});this.setState('idle');return}
    }
    try{
      this.emu=new Ctor(opts);const em=this.emu;
      if(em.add_listener){
        em.add_listener('download-error',e=>ui.toast('资源下载失败：'+((e&&e.file_name)||'BIOS / wasm')+'，请检查网络',{type:'err'}));
        em.add_listener('emulator-started',()=>{this.setState('running');this.kbd(true)});
      }
      this.setState('running');this.kbd(true);
      try{em.mouse_set_status&&em.mouse_set_status(true)}catch(e){}
    }catch(e){ui.toast('虚拟机启动失败：'+e.message,{type:'err'});this.emu=null;this.setState('idle')}
  }
  kbd(on){try{if(this.emu&&this.emu.keyboard_set_status)this.emu.keyboard_set_status(!!on)}catch(e){}}
  async kill(){
    if(this.emu){try{this.exitLock();if(this.emu.destroy)await this.emu.destroy()}catch(e){}this.emu=null}
    this.setState('idle');
  }
  lock(){
    if(!this.emu)return ui.toast('请先启动虚拟机',{type:'warn',timeout:1600});
    try{if(typeof this.emu.lock_mouse==='function')this.emu.lock_mouse();else this.sc.requestPointerLock()}catch(e){try{this.sc.requestPointerLock()}catch(e2){}}
  }
  exitLock(){if(document.pointerLockElement)document.exitPointerLock()}
  bind(){
    const r=this.root;
    r.addEventListener('click',async e=>{
      const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,em=this.emu;
      if(a==='pick'){const p=await ui.pick({mode:'open',title:'选择磁盘镜像（ISO / IMG / BIN …）',path:'/下载'});if(p)this.setImage(p)}
      else if(a==='import'){const out=await OS.files.pickUpload('/下载');if(out&&out[0])this.setImage(out[0])}
      else if(a==='start')this.start();
      else if(a==='pause'&&em){if(this.state==='paused'){em.run();this.setState('running');this.kbd(true)}else{em.stop();this.setState('paused')}}
      else if(a==='reset'&&em){em.restart();this.setState('running')}
      else if(a==='stop')this.kill();
      else if(a==='cad'&&em)em.keyboard_send_scancodes([0x1D,0x38,0xE0,0x53,0xE0,0xD3,0xB8,0x9D]);
      else if(a==='lock'){this.autoLock=!this.autoLock;b.classList.toggle('on',this.autoLock);this.lock()}
      else if(a==='shot'){
        const c=this.sc.querySelector('canvas');
        if(!c||c.style.display==='none')return ui.toast('当前为文本模式，无法截图',{type:'warn'});
        c.toBlob(async bl=>{const p=await fs.uniquePath('/图片/虚拟机截图.png');await fs.writeFile(p,bl);ui.toast('截图已保存：'+p,{type:'ok'})},'image/png');
      }
      else if(a==='full'){if(document.fullscreenElement)document.exitFullscreen();else if(this.sc.requestFullscreen)this.sc.requestFullscreen()}
      else if(a==='savest'&&em&&em.save_state){try{const buf=await em.save_state(),p=await fs.uniquePath('/下载/虚拟机存档.bin');await fs.writeFile(p,buf);ui.toast('状态已保存：'+p,{type:'ok'})}catch(err){ui.toast('存档失败：'+err.message,{type:'err'})}}
      else if(a==='loadst'&&em&&em.restore_state){const p=await ui.pick({mode:'open',title:'选择虚拟机存档',path:'/下载'});if(p){try{await em.restore_state(await fs.readFile(p));ui.toast('已读取存档',{type:'ok'})}catch(err){ui.toast('读档失败：'+err.message,{type:'err'})}}}
    });
    q('.slot',r).addEventListener('change',()=>{if(this.img)this.setImage(this.img.path)});
    q('[data-a="lock"]',r).classList.add('on');
    this.sc.addEventListener('click',()=>{if(this.autoLock&&this.emu&&!document.pointerLockElement)this.lock()});
    const onPl=()=>{this.lk.classList.toggle('on',!!document.pointerLockElement)};document.addEventListener('pointerlockchange',onPl);
    const off=OS.on('focus',w=>{this.kbd(w===this.win)});const off2=OS.on('wm',()=>{if(this.win.minimized)this.kbd(false)});
    this.win.onDestroy(()=>{document.removeEventListener('pointerlockchange',onPl);off();off2();this.kill()});
    this.win.beforeClose(async()=>{if(!this.emu)return true;return ui.confirm('虚拟机正在运行，关闭窗口将丢失当前运行状态（可先“存档”）。确定关闭吗？',{title:'关闭虚拟机',danger:true,ok:'关闭'})});
  }
}
OS.registerApp({id:'vm',name:'虚拟机',icon:'vm',color:'#5be7ff',w:980,h:660,minW:400,minH:340,single:true,kw:'vm v86 虚拟机 iso img 系统',open:(win,args)=>{new VM(win,args)},onArgs:(win,args)=>{}});

/* =====================================================================
   启动：无任何开场动画，直接进入系统
   ===================================================================== */
OS.boot=async()=>{
  const ui=OS.ui,fs=OS.fs;
  try{OS.shell.init()}catch(e){console.error(e)}
  try{await fs.init()}catch(e){console.error(e);ui.toast('文件系统初始化失败：'+e.message,{type:'err'})}
  try{await OS.cfg.init()}catch(e){console.error(e)}
  let first=false;
  try{first=await OS.seed()}catch(e){console.error('初始化示例内容失败',e)}
  OS.emit('cfg','theme');
  try{await OS.desk.init()}catch(e){console.error(e)}
  if(fs.kind!=='opfs')ui.toast(fs.kind==='idb'?'OPFS 不可用，已降级为 IndexedDB 存储':'存储不可用，已降级为内存模式：刷新后数据会丢失！',{type:'warn',timeout:7000});
  try{
    const pend=await fs.restoreMounts();
    if(pend.length&&OS.S.mountRemind){
      ui.toast('检测到上次挂载的 '+pend.length+' 个本地文件夹，需要重新授权访问',{timeout:0,icon:'plug',action:{label:'重新挂载',fn:async()=>{const n=await fs.remountPending();ui.toast(n?'已重新挂载 '+n+' 个文件夹':'未获得授权',{type:n?'ok':'warn'});OS.emit('mounts')}}});
    }
  }catch(e){console.error(e)}
  if(first)setTimeout(()=>ui.toast('欢迎使用叠影 OS：单击桌面图标即可打开，右键桌面查看更多操作',{timeout:6000,icon:'sparkle'}),700);
  window.addEventListener('unhandledrejection',e=>console.warn('[未处理的 Promise 异常]',e.reason));
  window.OS_READY=true;
};
OS.boot();
})();
</script>
