  /* 详细信息视图：列左对齐连续排列，右侧留白即框选区 */
  function colLabel(k){ return k==='nm'?'名称':k==='mtime'?'修改日期':k==='type'?'类型':'大小'; }
  function renderDetails(list){
    const t=el('div','ltable');
    const head=el('div','lhead');
    S.columns.forEach((k,i)=>{
      const h=el('div','lh'); h.dataset.k=k; h.style.width=S.widths[k]+'px';
      const arw = S.sort.key=== (k==='nm'?'name':k==='mtime'?'mtime':k==='size'?'size':'type')? (S.sort.dir>0?'▲':'▼'):'';
      h.innerHTML='<span>'+colLabel(k)+'</span>'+(arw?'<span class="arw">'+arw+'</span>':'')+'<span class="rz"></span>';
      h.onclick=()=>{ const kk=k==='nm'?'name':k==='mtime'?'mtime':k==='size'?'size':'type';
        if(S.sort.key===kk) S.sort.dir*=-1; else S.sort={key:kk,dir:1};
        localStorage.setItem('lacquer.sort',JSON.stringify(S.sort)); sortSel.value=kk; render(); };
      const rz=h.querySelector('.rz');
      rz.addEventListener('pointerdown',ev=>{
        ev.stopPropagation(); ev.preventDefault();
        const sw=S.widths[k], sx=ev.clientX;
        const mv=e=>{ S.widths[k]=clamp(sw+(e.clientX-sx),70,560); h.style.width=S.widths[k]+'px';
          $$('[data-col="'+k+'"]',t).forEach(c=>c.style.width=S.widths[k]+'px'); };
        const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
          Settings.data.colWidths=Object.assign({},S.widths); Settings.save(); };
        document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
      });
      h.draggable=true;
      h.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/colidx',String(i)); e.dataTransfer.effectAllowed='move'; });
      h.addEventListener('dragover',e=>{ if(e.dataTransfer.types.includes('text/colidx')){ e.preventDefault(); h.style.background='var(--acc-soft)'; } });
      h.addEventListener('dragleave',()=>h.style.background='');
      h.addEventListener('drop',e=>{ const from=+e.dataTransfer.getData('text/colidx'); h.style.background='';
        if(isNaN(from)||from===i) return;
        const arr=S.columns.slice(); const mv=arr.splice(from,1)[0]; arr.splice(i,0,mv);
        S.columns=arr; Settings.set('columns',arr); render(); });
      head.appendChild(h);
    });
    t.appendChild(head);
    const body=el('div');
    for(const it of list){
      const row=el('div','lrow'); row.dataset.col0='';
      S.columns.forEach(k=>{
        const c=el('div','lc'+(k==='nm'?' nm':(k==='mtime'||k==='size')?' num':''));
        c.dataset.col=k; c.style.width=S.widths[k]+'px';
        if(k==='nm'){
          const icoSlot = isImg(it.name)&&Settings.get('thumbnails')? '<img class="thumb" data-thumb="'+esc(it.path)+'">' :
            '<i class="ico">'+icon(it.type==='dir'?'folder':appIconFor(it.name))+'</i>';
          c.innerHTML=icoSlot+'<span>'+esc(Settings.get('showExt')?it.name:it.name.replace(/\.[^.]+$/,''))+'</span>';
        }
        else if(k==='mtime') c.textContent=fmtStamp(it.mtime);
        else if(k==='type') c.textContent=typeName(it.name,it.type==='dir');
        else { if(it.type==='dir'){ c.textContent='…'; c.dataset.dusize=it.path;
            folderSize(it.path).then(v=>{ if(c.isConnected) c.textContent=fmtSize(v); }); }
          else c.textContent=fmtSize(it.size); }
        row.appendChild(c);
      });
      itemCommon(row,it); body.appendChild(row);
    }
    t.appendChild(body); fwrap.appendChild(t);
  }
  /* 分栏视图（macOS 式多栏浏览） */
  function renderColumns(list){
    const cv=el('div','colview');
    const chain=[]; let p=S.path; let guard=0;
    while(p&&p!=='/'&&guard++<12){ chain.unshift(p); p=dirName(p); }
    chain.forEach(cp=>{ cv.appendChild(colPane(cp)); });
    cv.appendChild(colPane(S.path,list,true));
    fwrap.appendChild(cv);
    const last=cv.lastElementChild; if(last) last.scrollIntoView({inline:'end',block:'nearest'});
  }
  function colPane(path,items,isLeaf){
    const pane=el('div','colpane');
    pane.innerHTML='<div class="sh" style="padding:4px 8px">'+esc(baseName(path)||'本机存储')+'</div>';
    const load=async()=>{
      if(!items){ try{ items=await fs.readdir(path); }catch(e){ items=[]; } }
      pane.querySelectorAll('.fitem').forEach(n=>n.remove());
      const obs=ensureThumbObs();
      for(const it of sorted(items||[])){
        const n=el('div','fitem');
        n.innerHTML='<div class="th" style="width:24px;height:24px;font-size:14px;border-radius:6px"><i class="ico">'+icon(it.type==='dir'?'folder':appIconFor(it.name))+'</i></div>'+
          '<div class="nm">'+esc(it.name)+'</div>'+
          '<span class="muted mono" style="font-size:10px">'+(it.type==='dir'?'':fmtSize(it.size))+'</span>';
        itemCommon(n,it); pane.appendChild(n);
        if(obs) obs.observe(n);
        if(isLeaf) n.addEventListener('click',()=>{ if(it.type==='dir') go(it.path); });
      }
    };
    load();
    return pane;
  }
  function bindContainer(){

      disabled:()=>(isTouch||isMobile())&&!S.thumbMode,

  }
  function toggleSel(p,on){ if(on)S.sel.add(p); else S.sel.delete(p); updateStatus(); }
  function updateStatus(list){
    list=list||S.items;
    const nf=list.filter(i=>i.type==='file').length, nd=list.filter(i=>i.type==='dir').length;
    statusEls.count.textContent='共 '+list.length+' 项 · '+nd+' 个文件夹 · '+nf+' 个文件';
    statusEls.sel.textContent='已选 '+S.sel.size+' 项';
    let sz=0; list.forEach(i=>{ if(i.type==='file') sz+=(i.size||0); });

  /* ---------- 拖放 ---------- */
  function dropHandler(e,destDir){
    const dt=e.dataTransfer;
    const raw=dt.getData('application/x-lacquer');
    const target=destDir||S.path;
    if(raw){ const d=JSON.parse(raw); const paths=d.paths||[];
      const bad=paths.filter(p=>dirName(p)===target);
      if(bad.length===paths.length){ toast('目标与来源相同'); return; }
      fs.move(paths.filter(p=>dirName(p)!==target),target); return; }
    Desktop.importDT(dt,target);
  }
  content.addEventListener('dragover',e=>{ const lac=e.dataTransfer.types.includes('application/x-lacquer');
    if(lac||e.dataTransfer.types.includes('Files')){ e.preventDefault(); content.classList.add('dragover'); } });
  content.addEventListener('dragleave',()=>content.classList.remove('dragover'));
  content.addEventListener('drop',e=>{
    content.classList.remove('dragover');

    if(row){ const it=S.items.find(i=>i.path===row.dataset.path); if(it&&it.type==='dir'){ dropHandler(e,it.path); return; } }

  async function uniqueName(dir,base){ let n=base,i=2;
    const dot=base.lastIndexOf('.'); const stem=dot>0?base.slice(0,dot):base, ext=dot>0?base.slice(dot):'';
    while(await fs.exists(pathJoin(dir,n))) n=stem+' ('+(i++)+')'+ext; return n; }

    i.onchange=()=>Desktop.importDT({files:i.files},dir); i.click(); }
  async function exportMany(paths){

  /* ---------- 搜索 ---------- */
  const searchInp=root.querySelector('[data-a=search]');

  async function doSearch(q,global){
    if(!q.trim()){ S.searching=false; render(); return; }
    S.searching=true;
    fwrap.innerHTML='<div class="center"><div class="spin"></div><div>正在搜索…</div></div>';
    const root2=global? '/': S.path;
    try{
      const rs=await fs.search(root2,q,{limit:400});
      S.results=rs; S.sel.clear();
      render();
      statusEls.be.textContent=(global?'全局':'当前目录')+'搜索 '+rs.length+' 项结果';
    }catch(e){ toast('搜索失败：'+e.message,'err'); }
  }
  /* ---------- 工具栏 ---------- */
  root.querySelector('.tools').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const a=b.dataset.a;
    if(a==='back') goHist(-1); else if(a==='fwd') goHist(1);
    else if(a==='up') go(dirName(S.path));
    else if(a==='refresh') refresh();
    else if(a==='sb') sb.classList.toggle('on');

    ], b.getBoundingClientRect().left, b.getBoundingClientRect().bottom+4);
    else if(a==='view'){ /* handled by change */ }
  });
  viewSel.onchange=e=>{ S.view=e.target.value; localStorage.setItem('lacquer.view',S.view); render(); };
  sortSel.onchange=e=>{ S.sort={key:e.target.value,dir:1}; localStorage.setItem('lacquer.sort',JSON.stringify(S.sort)); render(); };
  content.addEventListener('contextmenu',e=>{ if(e.target.closest('.fitem,.lrow,.lhead')) return; e.preventDefault(); pathMenu(e.clientX,e.clientY,S.path); });
  content.addEventListener('keydown',e=>{ if(e.key==='Delete'){ const s=[...S.sel];
      if(s.length&&confirm('确认删除 '+s.length+' 项？')) Promise.all(s.map(p=>fs.remove(p))).then(()=>{refresh();}); } });
  function refresh(){ if(S.searching) doSearch(searchInp.value,true); else go(S.path,true); }
  const ro=new ResizeObserver(()=>{ if(S.view==='details'&&content.clientWidth<420){ /* 移动端自动收窄列 */ } });
  ro.observe(content);
  window.explorerRefresh=window.explorerRefresh||{};
  window.explorerRefresh[S.path]=refresh;
  document.addEventListener('fs-changed',function h(ev){ if(WM.active()&&WM.active().body===body){ clearTimeout(S._r); S._r=setTimeout(refresh,220); } });
  go(S.path,!!opts.noPush);
  if(opts.select){ setTimeout(()=>{ const n=$$('[data-path]',fwrap).find(n=>n.dataset.path===opts.select); if(n) n.classList.add('sel'); },400); }
  return { go, refresh, destroy(){ if(S.marq) S.marq.destroy(); ro.disconnect(); if(thumbObs) thumbObs.disconnect(); } };
}

<script>
/* ==================== PART F：内置应用 ==================== */
/* ---------- 记事本 ---------- */
function notepadApp(body,win,opts={}){
  body.innerHTML='';
  const root=el('div','ed');
  root.innerHTML='<div class="bar2">'+
    '<button class="btn sm" data-a="save"><i class="ico">'+icon('save')+'</i><span>保存</span></button>'+
    '<button class="btn sm" data-a="saveas"><i class="ico">'+icon('doc')+'</i><span>另存为</span></button>'+
    '<button class="btn sm" data-a="undo"><i class="ico">'+icon('undo')+'</i><span>撤销</span></button>'+
    '<button class="btn sm" data-a="redo"><i class="ico">'+icon('redo')+'</i><span>恢复</span></button>'+
    '<span class="muted">字体</span><button class="btn sm" data-a="fdn"><i class="ico">'+icon('minus')+'</i></button>'+
    '<span class="mono" data-a="fs">14</span><button class="btn sm" data-a="fup"><i class="ico">'+icon('plus')+'</i></button>'+
    '<button class="btn sm" data-a="wrap"><i class="ico">'+icon('align')+'</i><span>换行</span></button>'+
    '<button class="btn sm" data-a="copy"><i class="ico">'+icon('copy')+'</i><span>复制全部</span></button>'+
    '<button class="btn sm" data-a="clear"><i class="ico">'+icon('trash')+'</i><span>清空</span></button>'+
    '<button class="btn sm" data-a="download"><i class="ico">'+icon('download')+'</i><span>导出</span></button>'+
    '<span class="muted" data-a="state" style="margin-left:auto"></span></div>'+
    '<div class="body"><div class="pane"><textarea spellcheck="false" style="flex:1;width:100%;resize:none;border:0;outline:none;background:transparent;color:var(--ink);padding:14px;font-family:var(--f-mono);user-select:text"></textarea></div></div>'+
    '<div class="status" style="height:26px;border-top:1px solid var(--hair);padding:0 12px;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)"></div>';
  body.appendChild(root);
  const ta=root.querySelector('textarea'), st=root.querySelector('.status'), stateEl=root.querySelector('[data-a=state]');
  let fs2=Settings.get('editorFont')||14, wrap=Settings.get('editorWrap')!==0, hist=[], hi=-1, timer=0, path=opts.path||null, dirty=false;
  const draftKey='lacquer.draft.'+(path||'untitled-'+(opts.key||uid()));
  ta.style.fontSize=fs2+'px'; ta.style.whiteSpace=wrap?'pre-wrap':'pre'; ta.style.overflowX=wrap?'hidden':'auto';
  function pushHist(){ const snap={v:ta.value,f:fs2}; hist=hist.slice(0,hi+1); hist.push(snap); if(hist.length>120){hist.shift();} hi=hist.length-1; }
  function apply(){ ta.value=hist[hi].v; ta.style.fontSize=hist[hi].f+'px'; root.querySelector('[data-a=fs]').textContent=hist[hi].f; upd(); }
  function upd(){
    const lines=ta.value.split('\n').length, ch=ta.value.length;
    const pos=ta.selectionStart, before=ta.value.slice(0,pos).split('\n');
    st.textContent='行 '+before.length+', 列 '+(before[before.length-1].length+1)+' · '+lines+' 行 · '+ch+' 字符 · UTF-8'+(path?' · '+path:'');
  }
  ta.addEventListener('input',()=>{ dirty=true; clearTimeout(timer);
    stateEl.textContent='未保存';
    timer=setTimeout(()=>{ try{ localStorage.setItem(draftKey,JSON.stringify({v:ta.value,t:Date.now()})); }catch(e){} },700); pushHist(); upd(); });
  ta.addEventListener('keyup',upd); ta.addEventListener('click',upd);
  ta.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); save(); }
    if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText('    ',s,ta.selectionEnd,'end'); } });
  async function load(){
    if(path){ try{ const t=await fs.readFile(path,{as:'text'}); ta.value=t; pushHist(); WM.setTitle(win,baseName(path)+' — 记事本'); }
      catch(e){ toast('读取失败：'+e.message,'err'); } }
    else{ try{ const d=JSON.parse(localStorage.getItem(draftKey)||'null'); if(d&&d.v){ ta.value=d.v; toast('已恢复上次未保存的草稿'); } }catch(e){} pushHist(); }
    upd();
  }
  async function save(){
    try{
      if(!path){ const p=prompt('保存到虚拟文件系统的路径','/文档/'+(opts.suggest||'未命名')+'.txt'); if(!p) return; path=p; }
      await fs.writeFile(path,ta.value);
      dirty=false; stateEl.textContent='已保存 '+new Date().toLocaleTimeString();
      localStorage.removeItem(draftKey);
      if(win) WM.setTitle(win,baseName(path)+' — 记事本');
      toast('已保存 '+path);
    }catch(e){ toast('保存失败：'+e.message,'err'); }
  }
  root.querySelector('.bar2').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
    if(a==='save') save();
    else if(a==='saveas'){ const p=prompt('另存为路径',path||'/文档/未命名.txt'); if(!p)return; path=p; save(); }
    else if(a==='undo'){ if(hi>0){ hi--; apply(); } }
    else if(a==='redo'){ if(hi<hist.length-1){ hi++; apply(); } }
    else if(a==='fdn'){ fs2=Math.max(10,fs2-1); hist[hi].f=fs2; apply(); }
    else if(a==='fup'){ fs2=Math.min(34,fs2+1); hist[hi].f=fs2; apply(); }
    else if(a==='wrap'){ wrap=!wrap; ta.style.whiteSpace=wrap?'pre-wrap':'pre'; ta.style.overflowX=wrap?'hidden':'auto'; }
    else if(a==='copy'){ navigator.clipboard.writeText(ta.value).then(()=>toast('已复制全部内容')).catch(()=>toast('复制失败','err')); }
    else if(a==='clear'){ if(confirm('清空全部内容？')){ ta.value=''; pushHist(); upd(); } }
    else if(a==='download'){ const name=baseName(path||'未命名.txt');
      const b2=new Blob([ta.value],{type:'text/plain;charset=utf-8'}); const u=URL.createObjectURL(b2);
      const a2=el('a'); a2.href=u; a2.download=name; a2.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
  });
  load();
  win&&win.data&&(win.data.save=save);
  return { save, destroy(){ clearTimeout(timer); } };
}
/* ---------- 表格（CSV / TSV 双视图） ---------- */
function sheetApp(body,win,opts={}){
  body.innerHTML='';
  const root=el('div','ed');
  root.innerHTML='<div class="bar2">'+
    '<button class="btn sm" data-a="table"><i class="ico">'+icon('table')+'</i><span>表格视图</span></button>'+
    '<button class="btn sm" data-a="text"><i class="ico">'+icon('text')+'</i><span>文本视图</span></button>'+
    '<button class="btn sm" data-a="save"><i class="ico">'+icon('save')+'</i><span>保存</span></button>'+
    '<button class="btn sm" data-a="dl"><i class="ico">'+icon('download')+'</i><span>导出</span></button>'+
    '<select class="tb" data-a="delim" style="width:auto"><option value=",">逗号 ,</option><option value="\t">制表符 Tab</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select>'+
    '<span class="muted" data-a="info" style="margin-left:auto"></span></div>'+
    '<div class="body"><div class="pane" data-p="table" style="overflow:auto"><div data-a="tgrid" style="min-width:max-content"></div></div>'+
    '<div class="pane" data-p="text" style="display:none"><textarea spellcheck="false" style="flex:1;width:100%;border:0;outline:none;background:transparent;color:var(--ink);padding:12px;font-family:var(--f-mono);user-select:text"></textarea></div></div>';
  body.appendChild(root);
  const delimSel=root.querySelector('[data-a=delim]'), grid=root.querySelector('[data-a=tgrid]'),
        ta=root.querySelector('textarea'), info=root.querySelector('[data-a=info]');
  let path=opts.path||null, delim=',', raw='', mode='table';
  delimSel.value=extOf(path||'')==='tsv'?'\t':',';
  function parse(t,d){
    const rows=[]; let cur=[],cell='',q=false;
    for(let i=0;i<t.length;i++){ const c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
      else if(c==='"') q=true;
      else if(c===d){ cur.push(cell); cell=''; }
      else if(c==='\n'){ cur.push(cell); rows.push(cur); cur=[]; cell=''; }
      else if(c!=='\r') cell+=c; }
    if(cell||cur.length){ cur.push(cell); rows.push(cur); }
    return rows;
  }
  function renderTable(){
    const rows=parse(raw,delim);
    grid.innerHTML='';
    if(!rows.length){ grid.innerHTML='<div class="center">空表格</div>'; info.textContent='0 行'; return; }
    const cols=Math.max(...rows.map(r=>r.length));
    const tb=el('div','ltable');
    const head=el('div','lhead');
    for(let c=0;c<cols;c++){ const h=el('div','lh'); h.style.width=(c===0?200:150)+'px'; h.textContent=rows[0][c]||('列'+(c+1)); head.appendChild(h); }
    tb.appendChild(head);
    for(let r=1;r<rows.length;r++){
      const row=el('div','lrow');
      for(let c=0;c<cols;c++){ const cc=el('div','lc'); cc.style.width=(c===0?200:150)+'px'; cc.textContent=rows[r][c]||''; row.appendChild(cc); }
      tb.appendChild(row);
    }
    grid.appendChild(tb);
    info.textContent=(rows.length-1)+' 行 × '+cols+' 列 · 分隔符 '+(delim==='\t'?'Tab':delim);
  }
  function setMode(m){ mode=m;
    root.querySelector('[data-p=table]').style.display=m==='table'?'flex':'none';
    root.querySelector('[data-p=text]').style.display=m==='text'?'flex':'none';
    $$('[data-a=table],[data-a=text]',root).forEach(b=>b.classList.toggle('on', (b.dataset.a==='table')===(m==='table')));
    if(m==='text') ta.value=raw; else renderTable();
  }
  ta.oninput=()=>{ raw=ta.value; };
  async function load(){
    if(!path){ raw='列A,列B\n1,2\n'; setMode('table'); return; }
    try{ raw=await fs.readFile(path,{as:'text'}); WM.setTitle(win,baseName(path)+' — 表格'); }catch(e){ toast(e.message,'err'); }
    delim=extOf(path)==='tsv'?'\t':delimSel.value; delimSel.value=delim;
    setMode('table');
  }
  async function save(){ try{ if(mode==='text') raw=ta.value;
      if(!path){ const p=prompt('保存路径','/文档/表格.csv'); if(!p)return; path=p; }
      await fs.writeFile(path,raw); toast('已保存 '+path); }catch(e){ toast(e.message,'err'); } }
  root.querySelector('.bar2').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b)return;
    if(b.dataset.a==='table') setMode('table');
    else if(b.dataset.a==='text') setMode('text');
    else if(b.dataset.a==='save') save();
    else if(b.dataset.a==='dl'){ const b2=new Blob([raw],{type:'text/csv'}); const u=URL.createObjectURL(b2);
      const a=el('a'); a.href=u; a.download=baseName(path||'表格.csv'); a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); } });
  delimSel.onchange=()=>{ delim=delimSel.value; if(mode==='table') renderTable(); };
  load();
  return {save};
}

    let v=vel;
    const step=()=>{ if(Math.abs(v)<0.4) return; root.scrollTop+=v; v*=FRICTION; raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step); };
  root.addEventListener('pointerup',endDrag); root.addEventListener('pointercancel',endDrag);
  root.addEventListener('wheel',e=>{ /* 原生滚动，不做拦截 */ },{passive:true});
  /* 全屏沉浸 */
  let inFs=false;
  async function enterFs(){
    inFs=true; root.classList.add('fs');
    try{ await root.requestFullscreen(); }catch(e){ /* 降级：窗口内沉浸 */ root.style.cssText='position:fixed;inset:0;z-index:9998'; }
    WM.setTitle(win,'沉浸阅读 · '+baseName(dir));
  }
  async function exitFs(){
    inFs=false; root.classList.remove('fs');
    try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
    root.style.cssText='';
  }
  fsx.onclick=()=>{ if(inFs) exitFs(); else enterFs(); };
  root.addEventListener('dblclick',()=>{ if(inFs) exitFs(); else enterFs(); });
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&inFs){ inFs=false; root.classList.remove('fs'); root.style.cssText=''; } });
  win&&win.opts&&(win.opts.onbeforeclose=()=>{ if(inFs) exitFs(); return true; });
  return { destroy(){ cancelAnimationFrame(raf); if(inFs) exitFs(); } };
}

/* ---------- 计算器 ---------- */
function calcApp(body,win){
  body.innerHTML='<div class="calc"><div class="disp"><div class="e" data-a="e"></div><div class="v" data-a="v">0</div></div><div class="keys"></div></div>';
  const keys=[['C','op'],['(',')','op'],['⌫','op'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['±','op'],['0'],['.'],['=','eq']];
  const kd=body.querySelector('.keys'), vd=body.querySelector('[data-a=v]'), ed=body.querySelector('[data-a=e]');
  let cur='0';
  const render=()=>{ vd.textContent=cur; };
  const calc=s=>{ try{ const ex=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(!/^[-+*/().0-9\s]+$/.test(ex)) throw 0;
      const r=Function('"use strict";return ('+ex+')')(); if(r===undefined||isNaN(r)) throw 0;
      return String(Math.round(r*1e10)/1e10); }catch(e){ return '错误'; } };
  keys.forEach(([k,cls])=>{ const b=el('button',cls||'',k);
    b.onclick=()=>{
      if(k==='C'){ cur='0'; ed.textContent=''; }
      else if(k==='⌫') cur=cur.length>1?cur.slice(0,-1):'0';
      else if(k==='±') cur=cur.startsWith('-')?cur.slice(1):'-'+cur;
      else if(k==='='){ ed.textContent=cur+' ='; cur=calc(cur); }
      else { if(cur==='0'&&/[0-9(]/.test(k)) cur=k; else cur+=k; }
      render();
    }; kd.appendChild(b); });
  document.addEventListener('keydown',function h(e){ if(!WM.list.includes(win)) return document.removeEventListener('keydown',h);
    if(/^[0-9+\-*/().]$/.test(e.key)){ cur=cur==='0'&&/[0-9]/.test(e.key)? e.key : cur+e.key.replace('*','×').replace('/','÷'); render(); }
    else if(e.key==='Enter'){ ed.textContent=cur+' ='; cur=calc(cur); render(); }
    else if(e.key==='Backspace'){ cur=cur.length>1?cur.slice(0,-1):'0'; render(); }
    else if(e.key==='Escape'){ cur='0'; ed.textContent=''; render(); } });
  render();
}

/* ---------- 终端 ---------- */
function terminalApp(body,win){
  body.innerHTML='<div class="term"></div>';
  const t=body.querySelector('.term');
  let cwd='/桌面';
  const out=s=>{ t.insertBefore(document.createTextNode(s+'\n'), t.lastChild); t.scrollTop=t.scrollHeight; };
  const line=el('div','in');
  line.innerHTML='<span style="color:#e2a63c">'+esc(cwd)+' ▸</span><input spellcheck="false">';
  const inp=line.querySelector('input');
  t.appendChild(line);
  const HELP=['可用命令：','  ls [路径]        列出目录','  cd <路径>        切换目录','  pwd              当前位置','  cat <文件>       显示文本内容','  mkdir <名>       新建文件夹','  touch <名>       新建空文件','  rm <路径>        删除','  mv <a> <b>       移动/重命名','  cp <a> <b>       复制','  echo 文本 > 文件  写入','  df               存储用量','  find <关键词>    全局搜索','  open <路径>      用对应应用打开','  zip <输出> <源>  压缩','  unzip <zip>      解压到当前目录','  clear            清屏','  help             帮助'];
  out('曜砚 Shell · 输入 help 查看命令');
  inp.onkeydown=async e=>{
    if(e.key!=='Enter') return;
    const s=inp.value.trim(); inp.value='';
    out((cwd)+' ▸ '+s);
    if(!s) return;
    const [cmd,...args]=s.split(/\s+/); const rest=s.slice(cmd.length).trim();
    try{
      const P=p=> p&&p.startsWith('/')? p : pathJoin(cwd,p);
      if(cmd==='help') out(HELP.join('\n'));
      else if(cmd==='clear'){ t.querySelectorAll(':scope > *:not(.in)').forEach(n=>n.remove()); }
      else if(cmd==='pwd') out(cwd);
      else if(cmd==='ls'){ const items=await fs.readdir(P(args[0]));
        out(items.map(i=>(i.type==='dir'?'[D] ':'    ')+i.name.padEnd(28)+(i.type==='file'?fmtSize(i.size):'<dir>')).join('\n')||'(空)'); }
      else if(cmd==='cd'){ const np=P(args[0]||'/'); const st=await fs.stat(np); if(st.type!=='dir') throw new Error('不是目录'); cwd=fs.norm(np); line.querySelector('span').textContent=cwd+' ▸ '; }
      else if(cmd==='cat'){ out(await fs.readFile(P(args[0]),{as:'text'})); }
      else if(cmd==='mkdir'){ await fs.mkdir(P(rest)); out('已创建'); }
      else if(cmd==='touch'){ await fs.writeFile(P(rest),''); out('已创建'); }
      else if(cmd==='rm'){ await fs.remove(P(args[0])); out('已删除'); }
      else if(cmd==='mv'){ await fs.rename(P(args[0]),P(args[1])); out('已移动'); }
      else if(cmd==='cp'){ await fs.copy(P(args[0]),P(args[1])); out('已复制'); }
      else if(cmd==='echo'){ const m=rest.match(/^(.*?)\s*>\s*(\S+)$/);
        if(m){ await fs.writeFile(P(m[2]), m[1].replace(/^["']|["']$/g,'')); out('已写入 '+m[2]); } else out(rest); }
      else if(cmd==='df'){ const q=await fs.quota();
        out('配额 '+fmtSize(q.quota)+' · 已用 '+fmtSize(q.usage)+' ('+(q.quota?Math.round(q.usage/q.quota*100):0)+'%)\nOPFS '+fmtSize(q.per.opfs)+' · IndexedDB '+fmtSize(q.per.idb)+' · LocalStore '+fmtSize(q.per.ls)); }
      else if(cmd==='find'){ const rs=await fs.search('/',rest,{limit:60}); out(rs.map(r=>r.path).join('\n')||'无结果'); }
      else if(cmd==='open'){ openPath(P(rest)); out('打开中…'); }
      else if(cmd==='zip'){ const target=P(args[0]); await fs.makeZip(args.slice(1).map(P),target); out('已压缩 → '+target); }
      else if(cmd==='unzip'){ const src=P(args[0]); await fs.unzip(src,dirName(src)); out('已解压'); }
      else if(cmd==='tree'){ const walk=async(d,pre)=>{ let kids=[]; try{ kids=await fs.readdir(d);}catch(e){}
          for(const k of kids){ out(pre+(k.type==='dir'?'├─ ':'├─ ')+k.name); if(k.type==='dir') await walk(k.path,pre+'│  '); } };
        out(cwd); await walk(cwd,''); }
      else out('未知命令：'+cmd+'（输入 help）');
    }catch(err){ out('错误：'+err.message); }
  };
  setTimeout(()=>inp.focus(),100);
  t.addEventListener('click',()=>inp.focus());
}
/* ---------- 智能打开分派 ---------- */
async function openPath(path,forceApp){
  path=fs.norm(path);
  try{
    const st=await fs.stat(path);
    if(st.type==='dir') return launch('explorer',{path});
    if(forceApp) return launch(forceApp,{path});
    const e=extOf(path);
    if(e==='html'||e==='htm') return launch('htmldoc',{path});
    if(isImg(path)) return launch('imageviewer',{path});
    if(isAud(path)||isVid(path)) return launch('media',{path});
    if(isPdf(path)) return launch('pdf',{path});
    if(isArc(path)) return launch('explorer',{path:dirName(path)});
    if(extOf(path)==='csv'||extOf(path)==='tsv') return launch('sheet',{path});
    if(['js','mjs','css','json','md','xml','svg','yaml','yml','py','sh','vue','ts','jsx'].includes(e)) return launch('editor',{path});
    if(e==='ico'||e==='ttf'||e==='otf'||e==='woff'||e==='woff2') return launch('imageviewer',{path});
    return launch('notepad',{path});
  }catch(e){ toast('打开失败：'+e.message,'err'); }
}
</script>

<script>

async function settingsApp(body,win,opts={}){

/* ---------- v86 虚拟机 ---------- */
const V86_CDN={ js:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',
  wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
  bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
  vgabios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin' };
async function vmApp(body,win,opts={}){
  body.innerHTML='<div class="vm">'+
    '<div class="bar2" style="flex:none;display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--hair);align-items:center">'+
    '<button class="btn sm" data-a="pick"><i class="ico">'+icon('upload')+'</i><span>选择镜像（ISO / IMG）</span></button>'+
    '<button class="btn sm" data-a="pickvfs"><i class="ico">'+icon('disk')+'</i><span>从文件系统选择</span></button>'+
    '<button class="btn sm" data-a="lock"><i class="ico">'+icon('lock')+'</i><span>锁定鼠标</span></button>'+
    '<button class="btn sm" data-a="unlock"><i class="ico">'+icon('lock')+'</i><span>释放鼠标</span></button>'+
    '<button class="btn sm" data-a="reset"><i class="ico">'+icon('refresh')+'</i><span>重启</span></button>'+
    '<button class="btn sm" data-a="fs"><i class="ico">'+icon('fullscreen')+'</i><span>全屏</span></button>'+
    '<span class="muted mono" data-a="log" style="margin-left:auto">等待镜像…</span></div>'+
    '<div class="sc" data-a="sc"><div class="screen"></div><canvas></canvas></div></div>';
  const sc=body.querySelector('[data-a=sc]'), screenDiv=body.querySelector('.screen'), log=body.querySelector('[data-a=log]');
  const inp=el('input'); inp.type='file'; inp.accept='.iso,.img,.bin,.fda,.vhd'; inp.style.display='none'; body.appendChild(inp);
  const vfsIn=el('input'); vfsIn.style.display='none'; body.appendChild(vfsIn);
  let machine=null;
  function mountByExt(name,buffer){
    const e=extOf(name);
    if(e==='iso') return {cdrom:{buffer}};
    if(['img','fda','bin','vfd'].includes(e)) return {fda:{buffer}};
    return {hda:{buffer}};
  }
  async function boot(name,buffer){
    try{
      if(!window.V86){ log.textContent='装载 v86 内核…'; await loadScript(V86_CDN.js); }
      const Ctor=window.V86||window.V86Starter;
      if(machine){ try{ machine.destroy(); }catch(e){} machine=null; }
      screenDiv.textContent='';
      log.textContent='启动中…';
      machine=new Ctor(Object.assign({
        wasm_path:V86_CDN.wasm,
        memory_size:opts.mem||96*1024*1024,
        vga_memory_size:8*1024*1024,
        screen_container:sc,
        screen_dummy:false,
        bios:{url:V86_CDN.bios},
        vga_bios:{url:V86_CDN.vgabios},
        autostart:true,
        uart1:true
      }, mountByExt(name,buffer)));
      machine.add_listener&&machine.add_listener('emulator-ready',()=>log.textContent='虚拟机就绪');
      machine.add_listener&&machine.add_listener('emulator-started',()=>log.textContent='运行中');
      machine.add_listener&&machine.add_listener('download-error',d=>{ log.textContent='资源下载失败'; toast('v86 资源下载失败：'+(d&&d.filename||''),'err',5000); });
    }catch(err){ log.textContent='启动失败'; toast('虚拟机启动失败：'+err.message,'err',5000); }
  }
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; log.textContent='读取镜像…';
    boot(f.name, await f.arrayBuffer()); };
  vfsIn.type='file'; vfsIn.accept='.iso,.img,.bin,.vhd';
  body.querySelector('.bar2').addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
    if(a==='pick') inp.click();
    else if(a==='pickvfs'){
      const p=prompt('输入虚拟文件系统中的镜像路径（例如 /文档/boot.iso）'); if(!p) return;
      try{ log.textContent='读取镜像…'; const ab=await fs.readFile(fs.norm(p),{as:'arraybuffer'}); boot(baseName(p),ab); }
      catch(err){ toast('读取失败：'+err.message,'err'); } }
    else if(a==='lock'){ try{ await sc.requestPointerLock(); toast('鼠标已锁定，按 Esc 释放'); }catch(err){ toast('指针锁定失败','err'); } }
    else if(a==='unlock'){ document.exitPointerLock(); }
    else if(a==='reset'){ if(machine) machine.restart(); }
    else if(a==='fs'){ if(document.fullscreenElement) document.exitFullscreen(); else sc.requestFullscreen&&sc.requestFullscreen(); } });
  sc.addEventListener('click',()=>{ if(machine&&!document.pointerLockElement) sc.focus&&sc.focus(); });
  return { destroy(){ try{ machine&&machine.destroy(); }catch(e){} machine=null; } };
}

const APPS=[
  {id:'explorer',name:'砚阁 文件管理器',ico:'folder',run:explorerApp,w:1020,h:660,single:true},
  {id:'notepad',name:'记事本',ico:'text',run:notepadApp,w:760,h:560},

  {id:'browser',name:'网页浏览器',ico:'browser',run:browserApp,w:1080,h:720,single:true},
  {id:'htmldoc',name:'HTML 文档',ico:'browser',run:htmlDocApp,w:960,h:680,hidden:true},
  {id:'calc',name:'计算器',ico:'calc',run:calcApp,w:340,h:470,single:true},
  {id:'paint',name:'画板',ico:'paint',run:paintApp,w:940,h:640},
  {id:'terminal',name:'终端',ico:'terminal',run:terminalApp,w:760,h:480},
  {id:'gsearch',name:'全局搜索',ico:'search',run:globalSearchApp,w:700,h:520,single:true},
  {id:'settings',name:'设置',ico:'settings',run:settingsApp,w:900,h:640,single:true},
  {id:'vm',name:'虚拟机 (v86)',ico:'vm',run:vmApp,w:900,h:660}
];
function launch(id,opts={}){
  const a=APPS.find(x=>x.id===id); if(!a){ toast('未找到应用：'+id,'err'); return null; }
  if(Settings.get('hiddenApps').includes(id)&&!opts.force){ toast('该应用已在设置中被隐藏','err'); return null; }
  if(a.single){
    const ex=WM.list.find(w=>w.app===id&&!w.closed);
    if(ex){ WM.restore(ex); if(a.id==='explorer'&&opts.path&&ex.api&&ex.api.go) ex.api.go(opts.path); return ex; }
  }
  const win=WM.create({app:id,title:a.name,ico:a.ico,w:a.w,h:a.h,minW:320,minH:200,
    onclose:()=>{ try{ inst&&inst.destroy&&inst.destroy(); }catch(e){} inst=null; }});
  let inst=null;
  try{ inst=a.run(win.body,win,opts)||null; win.api=inst; }
  catch(err){ console.error(err); win.body.innerHTML='<div class="center">应用启动失败：'+esc(err.message)+'</div>'; }
  if(a.id==='explorer'&&opts.path&&inst&&inst.go) setTimeout(()=>inst.go(opts.path),80);
  return win;
}
/* ---------- 启动 ---------- */
function refreshStart(){ buildStart($('#start-search').value); }
async function boot(){
  hydrateIcons();
  const r=await fs.init();
  Desktop.init();
  buildStart('');
  tickClock(); setInterval(tickClock,1000);
  WM.renderTaskbar();
  // 启动时打开文件管理器（无假加载动画，直接进入）
  launch('explorer',{path:'/桌面'});
  // 挂载恢复提醒
  const reg=await Meta.get('lacquer.mounts');
  if(reg&&reg.length&&window.showDirectoryPicker){
    setTimeout(()=>{ showMenu([
      {header:'上次会话的本地文件夹'},
      ...reg.map(m=>({label:'重新挂载 '+m.name, ico:'mount', act:()=>fs.remountPending()})),
      {sep:1},{label:'不再提醒', ico:'x', act:()=>Meta.del('lacquer.mounts')}
    ], 24, 90); }, 900);
  }
  if(!fs.isAvailable('opfs')&&!fs.isAvailable('idb')) setTimeout(()=>toast('当前浏览器仅支持 LocalStore 兜底存储，建议使用 Chrome / Edge','err',6000),1200);
  OS.booted=true;
}
window.launch=launch; window.openPath=openPath; window.buildStart=buildStart; window.refreshStart=refreshStart;
OS._booting=false;
window.addEventListener('load',()=>{ if(!OS._booting&&!OS.booted){ OS._booting=true; boot(); } });
if(document.readyState==='complete'||document.readyState==='interactive'){ if(!OS._booting&&!OS.booted){ OS._booting=true; boot(); } }
</script>
