  navigate(st.path, true);
  return { navigate, render, st };
}

/* 解压：zip / gz / tar / tgz（原生 + JSZip 降级） */
async function extractArchive(pathOrDir) {
  let st;
  try { st = await fs.stat(pathOrDir); } catch (e) { return Toast.push('解压失败', e.message); }
  const targets = st.isDir ? [] : [pathOrDir];
  if (!targets.length) {
    try {
      const items = await fs.readdir(pathOrDir);
      targets.push(...items.filter(i => !i.isDir && ['zip', 'gz', 'tgz', 'tar'].includes(extOf(i.name))).map(i => i.path));
    } catch (e) { }
  }
  if (!targets.length) return Toast.push('无可解之卷', '未找到压缩包');
  for (const t of targets) {
    const e = extOf(t);
    const outDir = joinPath(dirOf(t), await fs.uniqueName(dirOf(t), baseOf(t) + '-解压'));
    try {
      await fs.mkdir(outDir);
      if (e === 'zip') {
        if (!window.JSZip) await loadScript('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
        if (!window.JSZip) throw new Error('JSZip 未能加载（网络不可用）');
        const zip = await JSZip.loadAsync(await fs.readBlob(t));
        const entries = Object.values(zip.files);
        for (const entry of entries) {
          const target = joinPath(outDir, entry.name);
          if (entry.dir) { await fs.mkdir(target); continue; }
          await fs.mkdir(dirOf(target));
          const buf = await entry.async('uint8array');
          /* JSZip 把 DOS 时间按 UTC 解析：补偿本地时区，保留原始修改时间 */
          const raw = entry.date ? entry.date.getTime() : Date.now();
          const fixed = raw + (entry.date ? entry.date.getTimezoneOffset() * 60000 : 0);
          await fs.writeFile(target, buf, { mtime: fixed });
        }
      } else if (e === 'gz' || e === 'tgz') {
        const raw = await fs.readFile(t);
        if (typeof DecompressionStream === 'undefined') throw new Error('此浏览器不支持原生 gzip 解压');
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([raw]).stream().pipeThrough(ds);
        const out = new Uint8Array(await new Response(stream).arrayBuffer());
        const isTar = out.length > 262 && new TextDecoder().decode(out.slice(257, 262)) === 'ustar';
        if (isTar) await untar(out, outDir);
        else await fs.writeFile(joinPath(outDir, baseOf(t)), out, { mtime: Date.now() });
      } else if (e === 'tar') {
        await untar(await fs.readFile(t), outDir);
      }
      Toast.push('纸卷展开', '已解压到 ' + outDir);
    } catch (err) {
      Toast.push('解压失败', err.message);
    }
  }
}
async function untar(bytes, outDir) {
  const dec = new TextDecoder('utf-8');
  let off = 0;
  while (off + 512 <= bytes.length) {
    const head = bytes.slice(off, off + 512);
    const name = dec.decode(head.slice(0, 100)).replace(/\0.*$/, '');
    if (!name) break;
    const sizeOct = dec.decode(head.slice(124, 136)).replace(/\0.*$/, '').trim();
    const size = parseInt(sizeOct || '0', 8) || 0;
    const mtimeRaw = parseInt(dec.decode(head.slice(136, 148)).replace(/\0.*$/, '').trim() || '0', 8) || 0;
    const type = String.fromCharCode(head[156] || 48);
    const target = joinPath(outDir, name);
    if (type === '5') { await fs.mkdir(target); }
    else if (type === '0' || type === '\0' || type === '') {
      await fs.mkdir(dirOf(target));
      await fs.writeFile(target, bytes.slice(off + 512, off + 512 + size), { mtime: mtimeRaw * 1000 || Date.now() });
    }
    off += 512 + Math.ceil(size / 512) * 512;
  }
}

Apps.register('notepad', {
  name: '符纸', roman: 'PAPER', icon: ICONS.text, w: 720, h: 540,
  build(win, data) { buildNotepad(win, data); }
});
function buildNotepad(win, data) {
  const st = { path: data.path || null, dirty: false, undo: [], redo: [], fontSize: 13, mode: 'text' };
  const isTable = data.path && ['csv', 'tsv'].includes(extOf(data.path));
  win.body.innerHTML = `
    <div class="np">
      <div class="ex-tool">
        <button class="btn" data-a="undo">${ICONS.chevL}<span>撤销</span></button>
        <button class="btn" data-a="redo">${ICONS.chevR}<span>恢复</span></button>

        <button class="btn" data-a="smaller">${ICONS.minus}<span>字号</span></button>
        <button class="btn" data-a="bigger">${ICONS.plus}</button>
        <div class="divide"></div>
        <button class="btn" data-a="save">${ICONS.save}<span>保存</span></button>
        <button class="btn" data-a="saveas">${ICONS.download}<span>另存</span></button>
        <button class="btn" data-a="find">${ICONS.search}<span>查找</span></button>
        ${isTable ? `<div class="divide"></div>
        <button class="btn on" data-a="ttext">文本视图</button>
        <button class="btn" data-a="ttable">表格视图</button>` : ''}
        <div class="divide"></div>
        <span class="chip" data-a="stat">未存</span>
      </div>
      <textarea spellcheck="false" placeholder="在此落笔……"></textarea>
      <div class="tbl" style="display:none"></div>
    </div>`;
  const ta = $('textarea', win.body);
  const tbl = $('.tbl', win.body);
  ta.style.fontSize = st.fontSize + 'px';

  const saveLocal = debounce(() => {
    if (st.path) try { localStorage.setItem('yinhun.draft:' + st.path, ta.value); } catch (e) { }
  }, 500);

  function pushUndo() {
    st.undo.push(ta.value);
    if (st.undo.length > 120) st.undo.shift();
    st.redo.length = 0;
  }
  ta.addEventListener('input', () => {
    st.dirty = true;
    $('[data-a="stat"]', win.body).textContent = '未存 · ' + ta.value.length + ' 字';
    saveLocal();
    if (data.path) {
      clearTimeout(st.auto);
      st.auto = setTimeout(async () => {
        try {
          const old = await fs.stat(data.path);
          await fs.writeFile(data.path, new TextEncoder().encode(ta.value), { mtime: Date.now() });
          $('[data-a="stat"]', win.body).textContent = '已自动存 ' + fmtDate(Date.now(), true).slice(11);
          st.dirty = false;
        } catch (e) { $('[data-a="stat"]', win.body).textContent = '存写失败'; }
      }, 1200);
    }
  });
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Tab') { ev.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); doSave(); }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); doUndo(); }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); doRedo(); }
  });
  ta.addEventListener('focus', () => { if (!st.undo.length) st.undo.push(ta.value); });

  function doUndo() {
    if (st.undo.length < 2) return;
    st.redo.push(st.undo.pop());
    ta.value = st.undo[st.undo.length - 1];
    st.dirty = true;
  }
  function doRedo() {
    if (!st.redo.length) return;
    const v = st.redo.pop();
    st.undo.push(v);
    ta.value = v;
    st.dirty = true;
  }
  async function doSave() {
    let target = st.path;
    if (!target) {
      const name = prompt('此符纸名为：', '无名符纸.txt');
      if (!name) return;
      target = joinPath(fs.desktopPath(), name);
    }
    try {
      await fs.writeFile(target, new TextEncoder().encode(ta.value), { mtime: Date.now() });
      st.path = target; st.dirty = false;
      $('[data-a="stat"]', win.body).textContent = '已存 ' + fmtDate(Date.now(), true).slice(11);
      win.setTitle('符纸', target);
      Desktop.refresh();
      Toast.push('已落笔', target);
    } catch (e) { Toast.push('存写失败', e.message); }
  }
  $('.ex-tool', win.body).addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    switch (b.dataset.a) {
      case 'undo': doUndo(); break;
      case 'redo': doRedo(); break;
      case 'bigger': st.fontSize = clamp(st.fontSize + 1, 10, 32); ta.style.fontSize = st.fontSize + 'px'; break;
      case 'smaller': st.fontSize = clamp(st.fontSize - 1, 10, 32); ta.style.fontSize = st.fontSize + 'px'; break;
      case 'save': doSave(); break;
      case 'saveas': Shell.exportBlob(new Blob([ta.value], { type: 'text/plain' }), (st.path ? baseOf(st.path.split('/').pop()) : '符纸') + '.txt'); break;
      case 'find': {
        const q = prompt('寻字：', '');
        if (!q) return;
        const i = ta.value.indexOf(q);
        if (i >= 0) { ta.focus(); ta.setSelectionRange(i, i + q.length); }
        else Toast.push('寻不到', '文中无「' + q + '」');
        break;
      }
      case 'ttext':
        st.mode = 'text'; ta.style.display = ''; tbl.style.display = 'none';
        $('[data-a="ttext"]', win.body).classList.add('on'); $('[data-a="ttable"]', win.body).classList.remove('on');
        break;
      case 'ttable':
        st.mode = 'table'; ta.style.display = 'none'; tbl.style.display = '';
        $('[data-a="ttable"]', win.body).classList.add('on'); $('[data-a="ttext"]', win.body).classList.remove('on');
        renderTable();
        break;
    }
  });
  function renderTable() {
    const sep = extOf(st.path || '') === 'tsv' ? '\t' : ',';
    const rows = ta.value.split(/\r?\n/).filter(r => r.length).map(r => r.split(sep));
    if (!rows.length) { tbl.innerHTML = '<div class="empty"><div class="brush">空表</div><p>无一行可记</p></div>'; return; }
    const w = Math.max(...rows.map(r => r.length));
    let html = '<table class="grid"><thead><tr>';
    for (let i = 0; i < w; i++) html += `<th contenteditable="true" data-col="${i}">${String.fromCharCode(65 + (i % 26))}</th>`;
    html += '</tr></thead><tbody>';
    rows.forEach((r, ri) => {
      html += '<tr>';
      for (let i = 0; i < w; i++) html += `<td contenteditable="true" data-r="${ri}" data-c="${i}">${esc(r[i] || '')}</td>`;
      html += '</tr>';
    });
    html += '</tbody></table>';
    tbl.innerHTML = html;
    $$('td[data-r]', tbl).forEach(td => td.addEventListener('blur', () => {
      const rows2 = ta.value.split(/\r?\n/).filter(r => r.length).map(r => r.split(sep));
      const r = +td.dataset.r, c = +td.dataset.c;
      while (rows2[r].length <= c) rows2[r].push('');
      rows2[r][c] = td.textContent;
      pushUndo();
      ta.value = rows2.map(x => x.join(sep)).join('\n');
      st.dirty = true;
    }));
  }
  async function load() {
    if (!data.path) {
      const draft = '';
      ta.value = draft;
      win.setTitle('符纸', '未命名');
      return;
    }
    try {
      const text = await fs.readText(data.path);
      const draft = localStorage.getItem('yinhun.draft:' + data.path);
      ta.value = draft && draft.length > text.length ? draft : text;
      st.undo = [ta.value];
      win.setTitle('符纸', data.path);
      $('[data-a="stat"]', win.body).textContent = fmtSize((await fs.stat(data.path)).size);
      if (isTable) renderTable();
    } catch (e) {
      ta.value = '（读取失败：' + e.message + '）';
    }
  }
  win.on('close', () => {
    if (st.path) try { localStorage.removeItem('yinhun.draft:' + st.path); } catch (e) { }
  });
  load();
}

Apps.register('manga', {

function buildManga(win, data) {
  const st = { files: [], urls: [], current: data.path, fullscreen: false, mode: data.mode || 'scroll', zoom: 1, offset: 0 };
  win.body.innerHTML = `
    <div style="display:flex;flex-direction:column;height:100%;background:#000;position:relative">
      <div class="ex-tool" style="background:rgba(20,18,22,.94);border-bottom:1px solid var(--line)">
        <button class="btn" data-a="prev">${ICONS.chevU}<span>上一页</span></button>
        <button class="btn" data-a="next">${ICONS.chevD}<span>下一页</span></button>

        <button class="btn" data-a="mode">${ICONS.list}<span>长卷模式</span></button>
        <button class="btn" data-a="zoomout">${ICONS.zoomOut}</button>
        <button class="btn" data-a="zoomin">${ICONS.zoomIn}</button>
        <div class="divide"></div>
        <button class="btn" data-a="full">${ICONS.full}<span>沉浸全屏</span></button>
        <button class="btn" data-a="download">${ICONS.download}<span>下载</span></button>
        <span class="chip" data-a="info">读取中…</span>
      </div>
      <div class="reader" style="flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:none;touch-action:pan-y;
        -webkit-overflow-scrolling:touch;contain:layout style;background:#000;position:relative"></div>
      <button class="exitfs" style="display:none;position:absolute;right:14px;top:14px;z-index:40;width:36px;height:36px;
        border-radius:50%;background:rgba(20,18,22,.72);border:1px solid rgba(232,82,63,.5);color:var(--paper)">${ICONS.close}</button>
    </div>`;
  const reader = $('.reader', win.body);
  const info = $('[data-a="info"]', win.body);

  async function load() {
    const dir = dirOf(data.path);
    let items = [];
    try { items = await fs.readdir(dir); } catch (e) {
      reader.innerHTML = `<div class="empty"><div class="brush">取卷失败</div><p>${esc(e.message)}</p></div>`;
      return;
    }
    let imgs = items.filter(i => !i.isDir && KIND.image.includes(extOf(i.name)));
    imgs.sort((a, b) => naturalCompare(a.name, b.name));
    if (!imgs.length) imgs = [await fs.stat(data.path)];
    st.files = imgs;
    info.textContent = imgs.length + ' 页';
    reader.innerHTML = '';
    /* 并行读取，按序插入 */
    const blobs = await Promise.all(imgs.map(f => fs.readBlob(f.path).catch(() => null)));
    const anchors = [];
    imgs.forEach((f, i) => {
      const slot = el('div', '');
      slot.style.cssText = 'width:100%;display:flex;justify-content:center;background:#000;min-height:220px';
      const img = el('img', '');
      img.alt = f.name;
      img.style.cssText = 'max-width:100%;display:block;opacity:0;transition:opacity .35s ease';
      img.dataset.path = f.path;
      slot.appendChild(img);
      reader.appendChild(slot);
      anchors.push({ slot, img, f, i });
      if (blobs[i]) {
        const url = URL.createObjectURL(blobs[i]);
        st.urls.push(url);
        const before = slot.offsetHeight;
        img.onload = () => {
          img.style.opacity = '1';
          /* 高度补偿：上方图片撑开时保持视觉不跳动 */
          const after = slot.offsetHeight;
          const delta = after - before;
          if (delta && slot.offsetTop < reader.scrollTop) reader.scrollTop += delta;
        };
        img.onerror = () => { slot.innerHTML = '<div style="padding:40px;color:#666;font-family:var(--f-mono)">此页已损毁</div>'; };
        img.src = url;
      }
    });
    const target = anchors.find(a => a.f.path === data.path);
    if (target) setTimeout(() => { reader.scrollTop = target.slot.offsetTop - 12; }, 60);
    bindReader();
  }
  /* 鼠标手抓拖拽 + 惯性滑行 */
  function bindReader() {
    let drag = null, raf = 0, vel = 0;
    const FRICTION = 0.96;
    reader.addEventListener('pointerdown', ev => {
      if (ev.pointerType === 'touch') return;
      drag = { y: ev.clientY, top: reader.scrollTop, last: ev.clientY, t: performance.now() };
      vel = 0;
      cancelAnimationFrame(raf);
      reader.setPointerCapture && reader.setPointerCapture(ev.pointerId);
    });
    reader.addEventListener('pointermove', ev => {
      if (!drag) return;
      const dy = ev.clientY - drag.last;
      reader.scrollTop -= dy;
      vel = -dy;
      drag.last = ev.clientY;
    });
    const end = () => {
      if (!drag) return;
      drag = null;
      const step = () => {
        reader.scrollTop += vel;
        vel *= FRICTION;
        if (Math.abs(vel) > 0.4) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };
    reader.addEventListener('pointerup', end);
    reader.addEventListener('pointercancel', end);
  }
  $('.exitfs', win.body).addEventListener('click', exitFull);
  async function enterFull() {
    st.fullscreen = true;
    $('.ex-tool', win.body).style.display = 'none';
    $('.exitfs', win.body).style.display = 'block';
    const t = $('.win-title', win.el);
    if (t) t.style.display = 'none';
    try {
      const target = win.el;
      if (target.requestFullscreen) await target.requestFullscreen();
      else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
    } catch (e) { }
  }
  async function exitFull() {
    st.fullscreen = false;
    $('.ex-tool', win.body).style.display = '';
    $('.exitfs', win.body).style.display = 'none';
    const t = $('.win-title', win.el);
    if (t) t.style.display = '';
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    } catch (e) { }
  }
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && st.fullscreen) exitFull();
  });
  $('.ex-tool', win.body).addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    switch (b.dataset.a) {
      case 'prev': reader.scrollTop -= reader.clientHeight * 0.86; break;
      case 'next': reader.scrollTop += reader.clientHeight * 0.86; break;
      case 'zoomin': st.zoom = clamp(st.zoom + 0.15, 0.3, 4); applyZoom(); break;
      case 'zoomout': st.zoom = clamp(st.zoom - 0.15, 0.3, 4); applyZoom(); break;
      case 'full': enterFull(); break;
      case 'download': Shell.download(data.path); break;
      case 'mode':
        if (reader.style.overflowY === 'hidden') {
          reader.style.overflowY = 'auto';
          $$('img', reader).forEach(i => i.style.maxWidth = '100%');
          b.classList.remove('on');
        } else {
          reader.style.overflowY = 'hidden';
          $$('img', reader).forEach(i => i.style.maxWidth = 'none');
          b.classList.add('on');
        }
        break;
    }
  });
  function applyZoom() {
    $$('img', reader).forEach(i => {
      i.style.transform = 'scale(' + st.zoom + ')';
      i.style.transformOrigin = 'center top';
    });
  }
  win.on('close', () => { st.urls.forEach(u => URL.revokeObjectURL(u)); });
  load();
}

      an.fftSize = 128;
      src.connect(an); an.connect(ctx.destination);
      const cv = $('.viz', win.body), g = cv.getContext('2d');
      const data2 = new Uint8Array(an.frequencyBinCount);

        an.getByteFrequencyData(data2);

        </div>

    let expr = '';
    const render = () => {
      exprEl.textContent = expr || '落子无悔';
      let v = '0';
      try {
        const js = expr.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-').replace(/%/g, '/100*');
        if (js && /^[0-9+\-*/().\s]+$/.test(js)) v = String(Function('"use strict";return (' + js + ')')());
      } catch (e) { }
      valEl.textContent = v;
    };

      const b = ev.target.closest('button'); if (!b) return;
      const k = b.dataset.k;
      if (k === 'C') expr = '';
      else if (k === '=') { render(); expr = valEl.textContent === '0' ? '' : valEl.textContent; render(); return; }
      else if (k === '±') expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
      else if (k === '( )') expr += (expr.split('(').length > expr.split(')').length) ? ')' : '(';
      else expr += k;
      render();
    });
    win.body.addEventListener('keydown', ev => {
      if (/^[0-9.+\-*/]$/.test(ev.key)) { expr += ev.key.replace('*', '×').replace('/', '÷').replace('-', '−'); render(); }

    });

  }

      const img = ctx.getImageData(0, 0, cv.width || 1, cv.height || 1);
      cv.width = r.width; cv.height = r.height;
      ctx.fillStyle = '#0F0D10'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    }
    setTimeout(fit, 60);
    win.on('resize', debounce(fit, 160));
    const pos = e => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };

function simpleFormat(src, mode) {
  try {
    if (mode === 'css') {
      let depth = 0;
      return src.replace(/\s*\{\s*/g, ' {\n').replace(/;\s*/g, ';\n').replace(/\s*\}\s*/g, '\n}\n')
        .split('\n').map(l => {
          l = l.trim();
          if (!l) return '';
          if (l.startsWith('}')) depth = Math.max(0, depth - 1);
          const out = '  '.repeat(depth) + l;
          if (l.endsWith('{')) depth++;
          return out;
        }).join('\n');
    }
    if (mode === 'javascript' || mode === 'application/json') {
      if (mode === 'application/json') return JSON.stringify(JSON.parse(src), null, 2);
      let depth = 0;
      return src.replace(/;\s*(?=[^\s])/g, ';\n').replace(/\{\s*/g, '{\n').replace(/\}\s*/g, '\n}\n')
        .split('\n').map(l => {
          l = l.trim();
          if (!l) return '';
          if (l.startsWith('}')) depth = Math.max(0, depth - 1);
          const out = '  '.repeat(depth) + l;
          if (l.endsWith('{') || l.endsWith('(')) depth++;
          return out;
        }).join('\n');
    }
    /* html / xml */
    let depth = 0;
    return src.replace(/>\s*</g, '>\n<').split('\n').map(l => {
      l = l.trim();
      if (!l) return '';
      if (/^<\//.test(l)) depth = Math.max(0, depth - 1);
      const out = '  '.repeat(depth) + l;
      if (/^<[^!/][^>]*[^/]?>$/.test(l) && !/^<(br|img|input|meta|link|hr)/i.test(l)) depth++;
      return out;
    }).join('\n');
  } catch (e) { return src; }
}

    $('[data-s="sel"]', win.body).textContent = selLen ? '已选 ' + selLen + ' 字符' : '';
    $('[data-s="lines"]', win.body).textContent = '共 ' + text.split('\n').length + ' 行';
    $('[data-s="chars"]', win.body).textContent = '共 ' + text.length + ' 字符';
    $('[data-s="lang"]', win.body).textContent = '语言: ' + (MODE_LABEL[st.mode] || '纯文本');
    $('[data-s="file"]', win.body).textContent = st.path || '未命名';
    win.setTitle('墨咒', (st.path ? st.path.split('/').pop() : '未命名') + (st.dirty ? ' ·未存' : ''));
  }
  function onChange() {
    st.dirty = true;
    clearTimeout(st.pt);
    st.pt = setTimeout(preview, 700);
    if (st.path) {
      clearTimeout(st.auto);
      st.auto = setTimeout(async () => {
        try {
          await fs.writeFile(st.path, new TextEncoder().encode(getValue()), { mtime: Date.now() });
          st.dirty = false;
          updateStatus();
        } catch (e) { }
      }, 1600);
    }
    updateStatus();
  }
  function preview() {
    const text = getValue();
    mask.classList.remove('hide');
    if (st.mode === 'htmlmixed' || st.mode === 'xml') {
      frame.removeAttribute('srcdoc');
      frame.srcdoc = text;
    } else if (st.mode === 'markdown') {
      const html = '<body style="background:#0B0A0C;color:#E9DDC9;font-family:Georgia,serif;padding:26px;line-height:1.9">' +
        esc(text).replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>')
          .replace(/^# (.*)$/gm, '<h1 style="color:#C2312B;letter-spacing:.2em">$1</h1>')
          .replace(/\*\*(.+?)\*\*/g, '<b style="color:#E8523F">$1</b>')
          .replace(/`(.+?)`/g, '<code style="color:#6FE7B0">$1</code>')
          .replace(/\n\n/g, '<br><br>') + '</body>';
      frame.srcdoc = html;
    } else if (st.mode === 'application/json') {
      let body = text;
      try { body = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { }
      frame.srcdoc = '<body style="background:#0B0A0C;color:#6FE7B0;font-family:monospace;padding:22px;white-space:pre-wrap">' + esc(body) + '</body>';
    } else if (st.mode === 'css') {
      frame.srcdoc = '<body style="background:#0B0A0C;color:#E9DDC9;font-family:monospace;padding:22px;white-space:pre-wrap">' +
        esc(text) + '<style>' + text + '</style></body>';
    } else if (st.mode === 'javascript') {
      frame.srcdoc = '<body style="background:#0B0A0C;color:#B6A797;font-family:monospace;padding:22px;white-space:pre-wrap">' +
        '<div style="color:#C2312B;letter-spacing:.3em;margin-bottom:14px">控制台之影</div>' +
        '<div id="out"></div><script>window.onerror=function(m){document.getElementById("out").innerHTML+="<div style=\'color:#E8523F\'>"+m+"</div>"};' +
        'try{' + text + '}catch(e){document.getElementById("out").innerHTML="<div style=\'color:#E8523F\'>"+e.message+"</div>"}<\/script></body>';
    } else {
      frame.srcdoc = '<body style="background:#0B0A0C;color:#B6A797;font-family:monospace;padding:22px;white-space:pre-wrap">' + esc(text) + '</body>';
    }
    mask.classList.add('hide');
  }
  async function save() {
    let target = st.path;
    if (!target) {
      const name = prompt('此咒本名为：', '未命名.' + (st.mode === 'htmlmixed' ? 'html' : st.mode === 'css' ? 'css' : st.mode === 'javascript' ? 'js' : 'txt'));
      if (!name) return;
      target = joinPath(st.dir, name);
      st.path = target;
    }
    try {
      await fs.writeFile(target, new TextEncoder().encode(getValue()), { mtime: Date.now() });
      st.dirty = false;
      updateStatus();
      Desktop.refresh();
      Toast.push('咒已封存', target);
    } catch (e) { Toast.push('保存失败', e.message); }
  }
  async function load() {
    if (!data.path) { setValue(data.content || '<!-- 在此写下你的符咒 -->\n'); preview(); return; }
    try {
      const text = await fs.readText(data.path);
      setValue(text);
      st.dirty = false;
      preview();
    } catch (e) { setValue('（读取失败：' + e.message + '）'); }
    updateStatus();
  }
  $('.ex-tool', win.body).addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    switch (b.dataset.a) {
      case 'undo': cm ? cm.undo() : document.execCommand('undo'); break;
      case 'redo': cm ? cm.redo() : document.execCommand('redo'); break;
      case 'format': {
        const cur = cm ? cm.getCursor() : { line: 0, ch: 0 };
        const out = simpleFormat(getValue(), st.mode);
        setValue(out);
        if (cm) { try { cm.setCursor(cur); } catch (e) { } }
        Toast.push('已规整', '光标位置保持不变');
        break;
      }
      case 'find': {
        if (cm && cm.execCommand) {
          cm.execCommand('findPersistent');
        } else {
          const q = prompt('查找：', ''); if (q) { const i = getValue().indexOf(q); if (i >= 0) { ta.focus(); ta.setSelectionRange(i, i + q.length); } }
        }
        break;
      }
      case 'refresh': preview(); break;
      case 'import': {
        const inp = $('#hiddenFile');
        inp.value = ''; inp.accept = '';
        inp.onchange = async () => {
          const f = inp.files[0]; if (!f) return;
          const text = await f.text();
          setValue(text);
          st.mode = MODE_BY_EXT[extOf(f.name)] || 'text';
          if (cm) cm.setOption('mode', st.mode);
          $('[data-a="mode"]', win.body).value = st.mode;
          updateStatus();
        };
        inp.click();
        break;
      }
      case 'export': {
        const defName = st.path ? st.path.split('/').pop() : '导出.' + (st.mode === 'htmlmixed' ? 'html' : 'txt');
        const name = prompt('导出文件名（含扩展名）：', defName);
        if (!name) return;
        Shell.exportBlob(new Blob([getValue()], { type: mimeOf(name) }), name);
        break;
      }
      case 'exportvfs': {
        const name = prompt('存入虚拟桌面的文件名：', st.path ? st.path.split('/').pop() : '导出.' + (st.mode === 'htmlmixed' ? 'html' : 'txt'));
        if (!name) return;
        const dir = fs.desktopPath();
        const target = joinPath(dir, await fs.uniqueName(dir, name));
        await fs.writeFile(target, new TextEncoder().encode(getValue()), { mtime: Date.now() });
        Desktop.refresh();
        Toast.push('已入纸楼', target);
        break;
      }
      case 'copyall': {
        const text = getValue();
        try { await navigator.clipboard.writeText(text); } catch (e) {
          if (fallback) { fallback.value = text; fallback.select(); document.execCommand('copy'); }
        }
        Toast.push('已抄录', text.length + ' 字符进入剪贴板');
        break;
      }
      case 'clear': setValue(''); break;
      case 'tab': {
        const url = URL.createObjectURL(new Blob([getValue()], { type: 'text/html' }));
        open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 15000);
        break;
      }
      case 'save': save(); break;
    }
  });
  $('.ex-tool', win.body).addEventListener('change', ev => {
    const s = ev.target.closest('select'); if (!s) return;
    if (s.dataset.a === 'mode') {
      st.mode = s.value;
      if (cm) cm.setOption('mode', st.mode);
      updateStatus();
      preview();
    } else if (s.dataset.a === 'layout') {
      st.view = s.value;
      applyLayout();
    } else if (s.dataset.a === 'splitdir') {
      st.splitDir = s.value;
      applyLayout();
    } else if (s.dataset.a === 'input') {
      st.inputStyle = s.value;
      if (cm) {
        cm.setOption('inputStyle', s.value === '自动' ? cm.constructor.defaults.inputStyle : (s.value === '电脑' ? 'textarea' : 'contenteditable'));
        cm.refresh();
      }
      Toast.push('输入模式', s.value === '电脑' ? '长按可唤出系统全选复制（内容为全文）' : s.value === '手机' ? '可长按拖拽选字，全选已补成全文' : '跟随浏览器 UA');
    }
  });
  function applyLayout() {
    const split = $('.ed-split', win.body);
    const code = $('.ed-code', win.body), pv = $('.ed-preview', win.body), grip = $('.ed-grip', win.body);
    split.classList.toggle('vertical', st.splitDir === 'col');
    code.style.display = st.view === 'preview' ? 'none' : '';
    pv.style.display = st.view === 'code' ? 'none' : '';
    grip.style.display = st.view === 'split' ? '' : 'none';
    if (cm) setTimeout(() => cm.refresh(), 30);
    preview();
  }
  /* 分割条拖拽 */
  (function gripDrag() {
    const grip = $('.ed-grip', win.body), split = $('.ed-split', win.body);
    const code = $('.ed-code', win.body), pv = $('.ed-preview', win.body);
    let dr = null;
    grip.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      dr = { x: ev.clientX, y: ev.clientY, w: code.getBoundingClientRect().width, h: code.getBoundingClientRect().height };
      grip.setPointerCapture && grip.setPointerCapture(ev.pointerId);
    });
    grip.addEventListener('pointermove', ev => {
      if (!dr) return;
      const r = split.getBoundingClientRect();
      if (st.splitDir === 'col') {
        const h = clamp(dr.h + ev.clientY - dr.y, 60, r.height - 60);
        code.style.flex = '0 0 ' + h + 'px';
        pv.style.flex = '1';
      } else {
        const w = clamp(dr.w + ev.clientX - dr.x, 80, r.width - 80);
        code.style.flex = '0 0 ' + w + 'px';
        pv.style.flex = '1';
      }
      if (cm) cm.refresh();
    });
    const up = () => { dr = null; if (cm) cm.refresh(); };
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
  })();
  win.on('close', () => {
    if (cm) { try { cm.toTextArea(); } catch (e) { } cm = null; }
    if (fallback) { fallback.remove(); fallback = null; }
    clearTimeout(st.auto); clearTimeout(st.pt);
    st.dirty = false;
  });
  $('[data-a="mode"]', win.body).value = st.mode;
  await load();
  applyLayout();
  updateStatus();
}

});
function buildVM(win, data) {
  win.body.innerHTML = `
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="ex-tool">
        <button class="btn" data-a="pick">${ICONS.upload}<span>载入镜像 (.iso / .img)</span></button>
        <button class="btn primary" data-a="boot">${ICONS.play}<span>开机</span></button>
        <button class="btn" data-a="stop">${ICONS.pause}<span>停机</span></button>
        <button class="btn" data-a="lock">${ICONS.lock}<span>锁定鼠标</span></button>
        <button class="btn" data-a="ctrlalt">${ICONS.seal}<span>Ctrl+Alt+Del</span></button>
        <span class="chip" data-a="state">未载入镜像</span>
      </div>
      <div class="v86wrap">
        <div id="screen_container">
          <div id="screen_text"></div>
          <canvas id="screen_canvas" width="720" height="400"></canvas>
        </div>
        <div class="loadmask hide"><div class="ring"></div><p>正在唤醒阴匣</p></div>
      </div>
    </div>`;
  const state = $('[data-a="state"]', win.body);
  const mask = $('.loadmask', win.body);
  let emulator = null, imageFile = null;
  $('[data-a="pick"]', win.body).addEventListener('click', () => {
    const inp = $('#hiddenFile');
    inp.value = ''; inp.accept = '.iso,.img,.bin,.fda,.hda,.gz';
    inp.onchange = () => {
      imageFile = inp.files[0] || null;
      state.textContent = imageFile ? imageFile.name + ' · ' + fmtSize(imageFile.size) : '未载入镜像';
    };
    inp.click();
  });
  $('[data-a="boot"]', win.body).addEventListener('click', async () => {
    if (!imageFile) { Toast.push('无镜像', '请先载入本地 .iso / .img 文件'); return; }
    mask.classList.remove('hide');
    state.textContent = '正在载入引擎…';
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js', 25000);
    } catch (e) {
      mask.classList.add('hide');
      state.textContent = '引擎加载失败';
      Toast.push('阴匣未能开启', 'V86 引擎 CDN 不可达，请检查网络');
      return;
    }
    const ext = extOf(imageFile.name);
    const buffer = await imageFile.arrayBuffer();
    const conf = {
      wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
      bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin' },
      vga_bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin' },
      memory_size: 128 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      screen_container: win.body.querySelector('#screen_container'),
      autostart: true
    };
    if (ext === 'iso') conf.cdrom = { buffer };
    else if (['img', 'fda', 'bin'].includes(ext)) conf.fda = { buffer };
    else conf.hda = { buffer };
    try {
      emulator = new V86Emulator(conf);
      emulator.add_listener('emulator-ready', () => { mask.classList.add('hide'); state.textContent = '阴匣已开'; });
      emulator.add_listener('download-error', () => { mask.classList.add('hide'); state.textContent = '资源下载失败'; });
    } catch (e) {
      mask.classList.add('hide');
      state.textContent = '启动失败';
      Toast.push('启动失败', e.message);
    }
  });
  $('[data-a="stop"]', win.body).addEventListener('click', () => {
    if (emulator) { try { emulator.stop(); } catch (e) { } state.textContent = '已停机'; }
  });
  $('[data-a="lock"]', win.body).addEventListener('click', () => {
    const canvas = win.body.querySelector('#screen_canvas');
    if (emulator && emulator.lock_mouse) { try { emulator.lock_mouse(); } catch (e) { } }
    if (canvas && canvas.requestPointerLock) canvas.requestPointerLock();
  });
  $('[data-a="ctrlalt"]', win.body).addEventListener('click', () => {
    if (emulator && emulator.keyboard_send_scancodes) {
      emulator.keyboard_send_scancodes([0x1D, 0x38, 0x53, 0xD3, 0xB8, 0x9D]);
    }
  });
  win.on('close', () => {
    if (emulator) { try { emulator.destroy(); } catch (e) { } emulator = null; }
  });
}

    <div class="setsec">
      <h3>${ICONS.info}系统 · 关于</h3>
      <div class="setrow"><div class="lb"><b>引魂 OS · 第三十七号纸楼</b>
        <i>Build 1937.11 · 单文件 / 零后端 / OPFS + IndexedDB 双库<br>
        UA：${esc(navigator.userAgent.slice(0, 96))}<br>
        OPFS：${(navigator.storage && navigator.storage.getDirectory) ? '可用' : '不可用（已降级为影库）'} ·
        File System Access：${window.showDirectoryPicker ? '可用' : '不可用'} ·
        DecompressionStream：${typeof DecompressionStream !== 'undefined' ? '可用' : '不可用'}</i></div></div>
    </div>
  </div>`;

  const root = win.body;
  const applyK = (k, v) => {
    if (['radius', 'winAlpha', 'fsScale'].includes(k)) Settings.set(k, parseFloat(v));
    else if (['clock12', 'taskbar', 'ash', 'grain', 'animations', 'snap', 'peek', 'useTrash'].includes(k)) Settings.set(k, v === 'true' || v === true);
    else if (k === 'wallpaper') Settings.set(k, parseInt(v, 10) || 0);
    else Settings.set(k, v);
  };
  $$('[data-k]', root).forEach(node => {
    const k = node.dataset.k;
    if (node.tagName === 'SELECT') {
      const cur = Settings.get(k);
      node.value = String(cur);
    }
    const handler = () => {
      applyK(k, node.value);
      const tag = $(`[data-v="${k}"]`, root);
      if (tag) tag.textContent = node.value + (k === 'radius' ? 'px' : '');
    };
    node.addEventListener('input', handler);
    node.addEventListener('change', handler);
  });

  /* 隐藏应用 */
  const appBox = $('[data-apps]', root);
  const hidden = new Set(Settings.get('hiddenApps') || []);
  Object.values(Apps.defs).forEach(a => {
    const b = el('button', 'btn' + (hidden.has(a.id) ? ' on' : ''), esc(a.name));
    b.addEventListener('click', () => {
      if (hidden.has(a.id)) hidden.delete(a.id); else hidden.add(a.id);
      b.classList.toggle('on', hidden.has(a.id));
      Settings.set('hiddenApps', Array.from(hidden));
    });
    appBox.appendChild(b);
  });

  /* 存储可视化 */
  async function renderUsage() {
    const box = $('[data-usage]', root);
    box.innerHTML = '<div class="lb"><b>实际占用</b><i>正在丈量纸楼……</i></div>';
    const usage = await fs.usage();
    const totalLocal = usage.mounts.reduce((a, m) => a + (m.size || 0), 0);
    const quota = usage.quota || 1;
    const usedPct = clamp((usage.used / quota) * 100, 0.5, 100);
    let html = `<div class="lb"><b>浏览器配额</b>
      <i>已用 ${fmtSize(usage.used)} / 可用 ${fmtSize(usage.quota)} · 占比 ${usedPct.toFixed(2)}%</i></div>
      <div class="bar" style="width:100%"><i style="width:${usedPct}%"></i></div>`;
    const colors = { '纸库': 'var(--red-hot)', '影库': 'var(--green)', '本机': 'var(--gold)' };
    html += `<div class="lb" style="margin-top:6px"><b>各库实测</b></div><div class="bar" style="width:100%;display:flex">`;
    usage.mounts.forEach(m => {
      const w = totalLocal ? clamp((m.size || 0) / totalLocal * 100, 0.5, 100) : 0;
      html += `<i style="width:${w}%;background:${colors[m.name] || 'var(--paper3)'}"></i>`;
    });
    html += '</div>';
    usage.mounts.forEach(m => {
      html += `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
        <span style="width:9px;height:9px;border-radius:2px;background:${colors[m.name] || 'var(--paper3)'}"></span>
        <b style="letter-spacing:.16em;font-size:11px;min-width:120px">${esc(m.label)}</b>
        <span class="chip">${m.size == null ? '实时读写' : fmtSize(m.size)}</span>
        <span class="chip">${m.files == null ? '—' : m.files + ' 文件'}</span>
        <span class="chip">${m.dirs == null ? '—' : m.dirs + ' 目录'}</span>
        <button class="btn" style="margin-left:auto;height:24px" data-a="enter" data-p="/${m.name}">进入</button>
      </div>`;
    });
    html += `<div class="lb" style="margin-top:8px"><i>纸库 = OPFS（原生大容量持久化，支持二进制） · 影库 = IndexedDB（降级与分库存放） · 本机 = File System Access 挂载</i></div>`;
    box.innerHTML = html;
    $$('[data-a="enter"]', box).forEach(b => b.addEventListener('click', () => Apps.open('files', { path: b.dataset.p })));
  }
  renderUsage();

  /* 挂载管理 */
  async function renderMounts() {
    const box = $('[data-mounts]', root);
    const list = LocalBackend.list();
    let html = `<div class="lb"><b>本地文件夹</b><i>通过 File System Access API 挂载真实文件夹，刷新后需重新授权</i></div>`;
    if (!list.length) html += `<div class="chip">尚未挂载任何阳间文件夹</div>`;
    list.forEach(n => {
      html += `<div style="display:flex;align-items:center;gap:10px">
        <span class="chip green">/本机/${esc(n)}</span>
        <button class="btn" style="height:24px" data-a="openm" data-n="${esc(n)}">打开</button>
        <button class="btn" style="height:24px" data-a="unmount" data-n="${esc(n)}">卸载</button></div>`;
    });
    box.innerHTML = html;
    $$('[data-a="openm"]', box).forEach(b => b.addEventListener('click', () => Apps.open('files', { path: '/本机/' + b.dataset.n })));
    $$('[data-a="unmount"]', box).forEach(b => b.addEventListener('click', async () => {
      await LocalBackend.remove(b.dataset.n);
      renderMounts();
      Toast.push('已卸载', b.dataset.n + ' 已断开');
    }));
  }
  renderMounts();

  $('.setwrap', root).addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    switch (b.dataset.a) {
      case 'wall': {
        const inp = $('#hiddenWall');
        inp.value = '';
        inp.onchange = async () => {
          const f = inp.files[0];
          if (!f) return;
          await Wallpapers.setCustom(f);
          Toast.push('壁纸已换', f.name);
        };
        inp.click();
        break;
      }
      case 'wallclear': Settings.set('wallpaperCustom', ''); break;
      case 'persist': {
        try {
          const ok = await navigator.storage.persist();
          Toast.push(ok ? '已锁定' : '未获许可', ok ? '浏览器承诺不会清理本站数据' : '浏览器拒绝了持久化请求');
        } catch (e) { Toast.push('失败', e.message); }
        break;
      }
      case 'mount': {
        if (!window.showDirectoryPicker) { Toast.push('不可用', '此浏览器不支持 File System Access API'); break; }
        try {
          const h = await window.showDirectoryPicker({ mode: 'readwrite' });
          await LocalBackend.add(h.name, h);
          renderMounts();
          Toast.push('阳间已接入', h.name);
        } catch (e) { if (e.name !== 'AbortError') Toast.push('挂载失败', e.message); }
        break;
      }
      case 'emptytrash': await fs.emptyTrash(); Toast.push('已清空', '焚化炉中再无一物'); break;
      case 'reset': {
        if (!confirm('这将焚毁纸楼中的一切：文件、图标位置、设置。不可复原。确定？')) return;
        if (!confirm('最后再问一次：你确定要让第三十七号纸楼空无一物？')) return;
        await fs.reset();
        localStorage.removeItem('yinhun.iconpos');
        Toast.push('已焚尽', '系统将在三秒后重归原样');
        setTimeout(() => location.reload(), 2600);
        break;
      }
    }
  });
  if (data && data.section === 'wallpaper') {
    const sec = $('[data-sec="wallpaper"]', root);
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ============================================================
   26. 启动 · 直接进入系统（无假加载）
   ============================================================ */
const System = {
  async boot() {
    Settings.apply();
    Wallpapers.apply();

    /* 任务栏托盘图标 */
    $('#peekBtn').innerHTML = ICONS.eyeOff;
    $('#themeBtn').innerHTML = Settings.get('theme') === 'dark' ? ICONS.sun : ICONS.moon;
    $('#setBtn').innerHTML = ICONS.settings;
    $('#smSearchIcon').innerHTML = ICONS.search;

    try { await fs.init(); } catch (e) { console.warn('fs init', e); }
    await this.seed();
    await Desktop.init();

    /* 时钟 */
    Clock.render();
    setInterval(() => Clock.render(), 10000);

    /* 招魂菜单 */
    $('#startBtn').addEventListener('click', ev => { ev.stopPropagation(); StartMenu.toggle(); });
    $('#smClose').addEventListener('click', () => StartMenu.close());
    $('#smFiles').addEventListener('click', () => { StartMenu.close(); Apps.open('files', { path: fs.desktopPath() }); });
    $('#smSettings').addEventListener('click', () => { StartMenu.close(); Apps.open('settings'); });
    $('#smReset').addEventListener('click', () => {
      StartMenu.close();
      Apps.open('settings');
      Toast.push('道坛已开', '「焚尽重来」在最下方');
    });
    $('#smSearch').addEventListener('input', debounce(async ev => {
      const q = ev.target.value.trim().toLowerCase();
      const grid = $('#smGrid');
      if (!q) { StartMenu.open(); return; }
      const appHits = Apps.list().filter(a => a.name.toLowerCase().includes(q) || (a.roman || '').toLowerCase().includes(q));
      grid.innerHTML = '';
      appHits.forEach(a => {
        const b = el('button', 'sm-app', `${a.icon}<div><b>${esc(a.name)}</b><i>${esc(a.roman || a.id)}</i></div>`);
        b.addEventListener('click', () => { StartMenu.close(); Apps.open(a.id); });
        grid.appendChild(b);
      });
      const files = await fs.search(q, '/' + Settings.get('defaultStore'), 12);
      files.forEach(f => {
        const b = el('button', 'sm-app', `${iconFor(f.name, f.isDir)}<div><b>${esc(f.name)}</b><i>${esc(f.path)}</i></div>`);
        b.addEventListener('click', () => { StartMenu.close(); Shell.openPath(f.path); });
        grid.appendChild(b);
      });
      if (!appHits.length && !files.length) grid.innerHTML = '<div class="empty"><div class="brush">寻不到</div><p>纸楼里没有这个名字</p></div>';
    }, 220));
    $('#themeBtn').addEventListener('click', () => {
      Settings.set('theme', Settings.get('theme') === 'dark' ? 'light' : 'dark');
      $('#themeBtn').innerHTML = Settings.get('theme') === 'dark' ? ICONS.sun : ICONS.moon;
    });
    $('#setBtn').addEventListener('click', () => Apps.open('settings'));
    $('#peekBtn').addEventListener('click', () => {
      const on = !$('#peekBtn').classList.contains('on');
      $('#peekBtn').classList.toggle('on', on);
      WM.peekAll(on);
    });
    $('#clock').addEventListener('click', ev => {
      ev.stopPropagation();
      $('#calendar').classList.toggle('open');
      if ($('#calendar').classList.contains('open')) Cal.open();
    });
    document.addEventListener('click', ev => {
      if (!ev.target.closest('#startMenu') && !ev.target.closest('#startBtn')) StartMenu.close();
      if (!ev.target.closest('#calendar') && !ev.target.closest('#clock')) $('#calendar').classList.remove('open');
    });

    /* 桌面拖入（双向拖拽的入口） */
    $('#desktop').addEventListener('dragover', ev => ev.preventDefault());

    /* 键盘 */
    addEventListener('keydown', ev => {
      if (ev.key === 'F5') { ev.preventDefault(); Desktop.refresh(); Toast.push('纸灰重落', '桌面已刷新'); }
      if (ev.key === 'F11') {
        ev.preventDefault();
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }
      if (ev.key === 'Escape') { Ctx.hide(); StartMenu.close(); $('#calendar').classList.remove('open'); }
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'o') {
        ev.preventDefault();
        Shell.upload(fs.desktopPath(), () => Desktop.refresh());
      }
    });

    /* 纸幡计时 */
    const lines = [
      '第三十七号纸楼 · 窗户有四十一扇 · 不要数',
      '你停留得越久，越接近真相',
      '有人在你身后三次，你只回头两次',
      '纸灰落地的方向，与风相反',
      '这台机器记得你删除的一切',
      '第三十七号纸楼 · 门牌号每晚都会变'
    ];
    let li = 0, tick = 37;
    setInterval(() => {
      tick++;
      li = (li + 1) % lines.length;
      const node = $('#bannerTick');
      if (node) node.textContent = lines[li] + ' · ' + String(tick).padStart(3, '0');
    }, 24000);

    /* 入侵（ARG） */
    if (Settings.get('intruder')) this.scheduleIntruder();
  },

  async seed() {
    const dir = await fs.ensureSystem();
    let items = [];
    try { items = await fs.readdir(dir); } catch (e) { }
    if (items.length) return;
    const enc = s => new TextEncoder().encode(s);
    const files = [
      {
        n: '第三十七号纸楼.txt', c:
          `第三十七号纸楼 · 入住须知\n\n` +
          `一、本楼窗户共四十一扇。若你数出第四十二扇，请立即闭眼。\n` +
          `二、纸库与影库中的东西不会真正消失，它们只是换了地方继续看你。\n` +
          `三、拖动窗口时落在桌面上的灰，是前一位住户留下的。\n` +
          `四、不要在凌晨三点打开「阴阳镜」。\n` +
          `五、若桌面图标自己换了位置，那不是故障。\n\n` +
          `—— 引魂物业管理处，敬上\n`
      },
      {
        n: '不要数窗户.html', c:
          `<html><head><meta charset="utf-8"><title>不要数窗户</title>
<style>body{margin:0;background:#0B0A0C;color:#E9DDC9;font-family:Georgia,serif;display:grid;place-items:center;min-height:100vh}
h1{font-size:52px;letter-spacing:.42em;color:#C2312B;font-weight:400}
p{letter-spacing:.28em;color:#7C7078;font-size:12px;line-height:2.4;text-align:center}
.w{width:120px;height:120px;border:1px solid #C2312B;margin:26px auto;position:relative;animation:blink 4s infinite}
@keyframes blink{0%,92%{opacity:.35}94%{opacity:1}96%{opacity:.2}100%{opacity:.35}}
.w:after{content:"";position:absolute;inset:18px;background:#000;border:1px solid #2E2830}</style></head>
<body><div><h1>不要数窗户</h1><div class="w"></div>
<p>你已经数到第七扇了<br>继续</p></div></body></html>`
      },
      {
        n: '名册.csv', c:
          `房号,住户,状态,最后出现\n301,陈氏,已迁出,1937-11-02\n302,无人,空置,1937-11-02\n303,未知,仍在,昨天\n304,你,在住,此刻\n`
      },
      {
        n: '符箓.md', c:
          `# 引魂符\n\n> 此符可开纸楼任意一扇门，代价是**关不上**。\n\n- 朱砂：\`#C2312B\`\n- 纸灰：每帧三十片\n- 焚化炉：可复原，不可遗忘\n\n![符](x)\n`
      }
    ];
    for (const f of files) {
      try {
        await fs.writeFile(joinPath(dir, f.n), enc(f.c), { mtime: Date.now() });
      } catch (e) { }
    }
    try {
      const sub = joinPath(dir, '纸楼档案');
      await fs.mkdir(sub);
      await fs.writeFile(joinPath(sub, '住户须知.txt'), enc('档案室的灯永远是亮着的。\n你上次来过，记得吗？\n'), { mtime: Date.now() - 86400000 });
    } catch (e) { }
  },

  scheduleIntruder() {
    const face = `<svg viewBox="0 0 200 260" fill="none" stroke="#E9DDC9" stroke-width="1.4">
      <path d="M100 12c-34 0-58 26-58 66 0 32 10 58 22 78 8 14 12 34 12 52h48c0-18 4-38 12-52 12-20 22-46 22-78 0-40-24-66-58-66z"/>
      <path d="M72 92c8-8 22-8 30 0M128 92c-8-8-22-8-30 0" stroke-width="2.2"/>
      <ellipse cx="82" cy="104" rx="7" ry="11" fill="#0B0A0C"/><ellipse cx="118" cy="104" rx="7" ry="11" fill="#0B0A0C"/>
      <path d="M100 118v22M88 152c8 6 16 6 24 0" />
      <path d="M64 196c14 10 26 12 36 12s22-2 36-12" stroke-dasharray="3 5"/>
    </svg>`;
    const run = () => {
      const n = $('#intruder');
      n.innerHTML = face;
      n.classList.remove('go');
      void n.offsetWidth;
      n.classList.add('go');
      const msgs = ['有人在看你', '别回头', '第四十二扇窗', '它在纸灰里', '你刚才没关那扇门'];
      Toast.push('……', msgs[Math.floor(Math.random() * msgs.length)], 5200);
      setTimeout(() => { n.classList.remove('go'); n.innerHTML = ''; }, 700);
      setTimeout(run, 240000 + Math.random() * 300000);
    };
    setTimeout(run, 96000);
  }
};

/* 直接进入系统 */
System.boot().catch(e => {
  console.error(e);
  Toast.push('系统异常', e.message, 9000);
});
</script>
</body>
</html>
