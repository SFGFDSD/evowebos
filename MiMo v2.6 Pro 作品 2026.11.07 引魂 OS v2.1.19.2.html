<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>引魂 OS · 第三十七号纸楼</title>
<meta name="description" content="引魂 YINHUN — 纸月操作系统。一个运行在浏览器里的桌面系统，基于 OPFS / IndexedDB 双存储。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
/* ============================================================
   引魂 YINHUN OS — 纸月设计系统
   材质：黑漆柜台 / 黄裱纸 / 朱砂印泥 / 香灰
   ============================================================ */
:root{
  --void:#0B0A0C;
  --stone:#141216;
  --raise:#1C181D;
  --raise2:#242027;
  --line:#2E2830;
  --line-hot:#4A3B44;
  --paper:#E9DDC9;
  --paper2:#B6A797;
  --paper3:#7C7078;
  --red:#C2312B;
  --red-hot:#E8523F;
  --red-deep:#6B1611;
  --green:#6FE7B0;
  --gold:#C9A227;
  --radius:8px;
  --taskbar-h:54px;
  --win-alpha:1;
  --fs-scale:1;
  --f-display:'ZCOOL XiaoWei',serif;
  --f-brush:'Ma Shan Zheng',cursive;
  --f-ui:'Noto Sans SC',sans-serif;
  --f-mono:'Cutive Mono',ui-monospace,monospace;
  --shadow-win:0 30px 70px -22px rgba(0,0,0,.92), 0 0 0 1px rgba(192,49,43,.16);
}
[data-theme="light"]{
  --void:#DCCFB4;
  --stone:#EFE6D3;
  --raise:#F7F0E1;
  --raise2:#E6D9BF;
  --line:#C6B393;
  --line-hot:#9C8560;
  --paper:#241C18;
  --paper2:#5C4B3E;
  --paper3:#8A7862;
  --red:#9E241C;
  --red-hot:#C2312B;
  --red-deep:#F0DCD4;
  --green:#1D7A57;
  --gold:#8A6A15;
  --shadow-win:0 26px 50px -22px rgba(60,40,20,.45), 0 0 0 1px rgba(158,36,28,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:var(--void);color:var(--paper);
  font-family:var(--f-ui);font-size:calc(13px * var(--fs-scale));font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:rgba(192,49,43,.42);color:#fff}
/* ---------- 滚动条：香灰 ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border:3px solid transparent;background-clip:content-box;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:var(--red);background-clip:content-box}

/* ============ 壁纸 / 空气 ============ */
#wallpaper{position:fixed;inset:0;background-color:var(--void);background-size:cover;background-position:center;filter:saturate(.72) contrast(1.06) brightness(.72);transition:opacity .8s ease, filter .8s ease}
[data-theme="light"] #wallpaper{filter:saturate(.6) contrast(.98) brightness(1.08)}
#wallpaper::after{content:"";position:absolute;inset:0;
  background:
   radial-gradient(130% 100% at 78% -10%, rgba(192,49,43,.20), transparent 58%),
   radial-gradient(100% 80% at 20% 110%, rgba(11,10,12,.86), transparent 62%),
   linear-gradient(180deg, rgba(11,10,12,.42), rgba(11,10,12,.80));
}
[data-theme="light"] #wallpaper::after{background:
   radial-gradient(130% 100% at 78% -10%, rgba(158,36,28,.16), transparent 58%),
   linear-gradient(180deg, rgba(220,207,180,.36), rgba(220,207,180,.72));}
#ash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.85}
#grain{position:fixed;inset:-120px;pointer-events:none;z-index:3;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>");
  animation:grainShift 7s steps(6) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}20%{transform:translate(-14px,8px)}40%{transform:translate(10px,-12px)}60%{transform:translate(-8px,-6px)}80%{transform:translate(12px,10px)}100%{transform:translate(0,0)}}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 92% at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);
  animation:breathe 11s ease-in-out infinite}
[data-theme="light"] #vignette{background:radial-gradient(120% 92% at 50% 42%, transparent 46%, rgba(90,60,30,.30) 100%)}
@keyframes breathe{0%,100%{opacity:.86}50%{opacity:1}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.06;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px)}

/* ============ 右侧纸幡 ============ */
#banner{position:fixed;right:0;top:0;bottom:0;width:38px;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:18px 0 calc(var(--taskbar-h) + 16px);
  border-left:1px solid rgba(192,49,43,.22);
  background:linear-gradient(180deg, rgba(11,10,12,.30), rgba(11,10,12,.05) 30%, rgba(11,10,12,.34));}
[data-theme="light"] #banner{background:linear-gradient(180deg, rgba(220,207,180,.35), rgba(220,207,180,.05) 30%, rgba(220,207,180,.35))}
#banner .spine{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--f-brush);
  font-size:19px;letter-spacing:.32em;color:rgba(233,221,201,.62);text-shadow:0 0 18px rgba(192,49,43,.35)}
#banner .spine small{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;color:rgba(192,49,43,.85)}
#banner .tick{writing-mode:vertical-rl;font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;color:rgba(233,221,201,.34)}
@media (max-width:820px){#banner{display:none}}

/* ============ 桌面 ============ */
#desktop{position:fixed;inset:0 0 var(--taskbar-h) 0;z-index:6;overflow:hidden;touch-action:none}
#iconLayer{position:absolute;inset:0}
.dicon{position:absolute;width:88px;padding:8px 4px 6px;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default;
  border:1px solid transparent;transition:left .22s cubic-bezier(.2,.8,.2,1), top .22s cubic-bezier(.2,.8,.2,1), background .16s, border-color .16s, transform .16s;}
.dicon:hover{background:rgba(192,49,43,.12);border-color:rgba(192,49,43,.28)}
.dicon.sel{background:rgba(192,49,43,.22);border-color:rgba(232,82,63,.55)}
.dicon.dragging{opacity:.34;transform:scale(.96)}
.dicon .glyph{width:46px;height:46px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.dicon .lbl{font-size:11.5px;line-height:1.35;text-align:center;color:var(--paper);
  text-shadow:0 1px 4px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.7);
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:84px}
[data-theme="light"] .dicon .lbl{text-shadow:0 1px 3px rgba(255,255,255,.55)}
#marqueeBox{position:absolute;display:none;pointer-events:none;z-index:40;
  border:1px solid var(--red-hot);background:rgba(192,49,43,.16);border-radius:2px}

/* ============ 窗口 ============ */
#winLayer{position:fixed;inset:0 0 var(--taskbar-h) 0;z-index:10;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  background:color-mix(in srgb, var(--stone) calc(var(--win-alpha)*100%), transparent);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-win);
  min-width:260px;min-height:160px;overflow:hidden;
  animation:winIn .16s cubic-bezier(.2,.85,.25,1)}
@keyframes winIn{from{opacity:0;transform:scale(.972) translateY(8px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .13s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.97)}}
.win:not(.focused){box-shadow:0 18px 46px -22px rgba(0,0,0,.85), 0 0 0 1px rgba(46,40,48,.9)}
.win:not(.focused) .win-title{opacity:.62}
.win.peeking{opacity:.10;filter:blur(1px)}
.win.maxed{border-radius:0}
.win-title{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding:0 6px 0 0;
  background:linear-gradient(180deg,var(--raise2),var(--raise));
  border-bottom:1px solid var(--line);cursor:default;user-select:none;position:relative}
.win-title::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--red-hot),var(--red-deep))}
.win-seal{width:26px;height:26px;margin-left:9px;flex:0 0 26px;display:grid;place-items:center;
  border:1px solid rgba(192,49,43,.5);border-radius:3px;background:rgba(192,49,43,.12)}
.win-seal svg{width:16px;height:16px}
.win-name{font-family:var(--f-display);font-size:13.5px;letter-spacing:.22em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.win-name em{font-family:var(--f-mono);font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--paper3);margin-left:8px}
.win-btns{display:flex;gap:2px;flex:0 0 auto}
.win-btn{width:30px;height:26px;border:1px solid transparent;border-radius:3px;display:grid;place-items:center;
  color:var(--paper2);transition:.13s}
.win-btn:hover{background:rgba(192,49,43,.22);border-color:rgba(192,49,43,.5);color:var(--paper)}
.win-btn.close:hover{background:var(--red);border-color:var(--red-hot);color:#fff}
.win-btn svg{width:12px;height:12px}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
/* 8 向缩放 */
.rz{position:absolute;z-index:30}
.rz-n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz-nw{left:-3px;top:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz-ne{right:-3px;top:-3px;width:12px;height:12px;cursor:nesw-resize}
.rz-sw{left:-3px;bottom:-3px;width:12px;height:12px;cursor:nesw-resize}
.rz-se{right:-3px;bottom:-3px;width:12px;height:12px;cursor:nwse-resize}
#snapPreview{position:fixed;z-index:9;display:none;pointer-events:none;border:1px solid var(--red-hot);
  background:rgba(192,49,43,.14);border-radius:var(--radius);backdrop-filter:blur(2px)}

/* ============ 任务栏 · 漆案 ============ */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:60;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(180deg, rgba(28,24,29,.96), rgba(11,10,12,.98));
  border-top:1px solid rgba(192,49,43,.34);backdrop-filter:blur(14px)}
[data-theme="light"] #taskbar{background:linear-gradient(180deg, rgba(247,240,225,.96), rgba(220,207,180,.98))}
#taskbar::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,82,63,.7),transparent)}
#startBtn{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px 0 8px;border-radius:5px;
  border:1px solid rgba(192,49,43,.42);background:rgba(192,49,43,.14);transition:.16s;flex:0 0 auto}
#startBtn:hover{background:rgba(192,49,43,.3);border-color:var(--red-hot)}
#startBtn .mark{font-family:var(--f-brush);font-size:19px;line-height:1;color:var(--red-hot);letter-spacing:.06em}
#startBtn .sub{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.26em;color:var(--paper3);writing-mode:vertical-rl;display:none}
#taskItems{flex:1;display:flex;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;height:100%;padding:0 4px;scrollbar-width:none}
#taskItems::-webkit-scrollbar{display:none}
.tbtn{display:flex;align-items:center;gap:7px;height:36px;min-width:36px;padding:0 10px;border-radius:4px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);position:relative;flex:0 0 auto;
  transition:.14s;max-width:190px}
.tbtn:hover{border-color:var(--line-hot);background:rgba(192,49,43,.14)}
.tbtn.active{border-color:rgba(232,82,63,.62);background:rgba(192,49,43,.22)}
.tbtn.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--red-hot)}
.tbtn.mini{opacity:.6}
.tbtn svg{width:16px;height:16px;flex:0 0 16px}
.tbtn span{font-size:11px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn .x{width:16px;height:16px;display:grid;place-items:center;border-radius:2px;opacity:0;color:var(--paper3)}
.tbtn:hover .x{opacity:1}
.tbtn .x:hover{background:var(--red);color:#fff}
#tray{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.traybtn{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--paper2);border:1px solid transparent}
.traybtn:hover{background:rgba(192,49,43,.16);border-color:rgba(192,49,43,.34);color:var(--paper)}
.traybtn svg{width:15px;height:15px}
#clock{padding:4px 10px;border-radius:4px;text-align:right;border:1px solid var(--line);line-height:1.15;
  background:rgba(255,255,255,.03);min-width:82px}
#clock .t{font-family:var(--f-mono);font-size:14px;letter-spacing:.04em;color:var(--paper)}
#clock .d{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--paper3)}
#clock:hover{border-color:rgba(192,49,43,.5)}

/* ============ 招魂 · 开始菜单 ============ */
#startMenu{position:fixed;left:12px;bottom:calc(var(--taskbar-h) + 12px);width:min(560px,calc(100vw - 24px));
  max-height:min(660px,calc(100vh - var(--taskbar-h) - 32px));z-index:70;display:none;flex-direction:column;
  background:linear-gradient(180deg, rgba(28,24,29,.98), rgba(14,12,15,.99));
  border:1px solid var(--line-hot);border-radius:var(--radius);box-shadow:0 40px 90px -30px rgba(0,0,0,.95);
  overflow:hidden;transform-origin:bottom left;animation:menuIn .18s cubic-bezier(.2,.85,.25,1)}
[data-theme="light"] #startMenu{background:linear-gradient(180deg, rgba(247,240,225,.99), rgba(232,220,196,.99))}
@keyframes menuIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#startMenu.open{display:flex}
.sm-head{display:flex;align-items:center;gap:14px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.sm-head .brush{font-family:var(--f-brush);font-size:40px;line-height:.9;color:var(--red-hot);
  text-shadow:0 0 28px rgba(192,49,43,.5)}
.sm-head .meta{flex:1}
.sm-head .meta b{font-family:var(--f-display);font-size:15px;letter-spacing:.3em;font-weight:400;display:block}
.sm-head .meta i{font-family:var(--f-mono);font-style:normal;font-size:9px;letter-spacing:.24em;color:var(--paper3)}
.sm-search{margin:12px 16px;display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);
  border-radius:4px;background:rgba(255,255,255,.03)}
.sm-search input{flex:1;background:none;border:0;outline:none;letter-spacing:.1em}
.sm-search svg{width:15px;height:15px;color:var(--paper3)}
.sm-grid{flex:1;overflow-y:auto;padding:6px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.sm-app{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid transparent;border-radius:5px;
  text-align:left;transition:.14s;position:relative;overflow:hidden}
.sm-app:hover{background:rgba(192,49,43,.16);border-color:rgba(192,49,43,.34);transform:translateX(3px)}
.sm-app svg{width:26px;height:26px;flex:0 0 26px}
.sm-app b{display:block;font-size:12.5px;font-weight:500;letter-spacing:.12em}
.sm-app i{display:block;font-family:var(--f-mono);font-style:normal;font-size:8.5px;letter-spacing:.22em;color:var(--paper3)}
.sm-foot{display:flex;gap:8px;padding:11px 16px;border-top:1px solid var(--line);background:rgba(0,0,0,.22)}
.sm-foot button{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:4px;
  font-size:11px;letter-spacing:.16em;color:var(--paper2)}
.sm-foot button:hover{border-color:var(--red);color:var(--paper);background:rgba(192,49,43,.16)}
.sm-foot svg{width:13px;height:13px}

/* ============ 右键菜单 · 符令 ============ */
#ctxMenu{position:fixed;z-index:200;display:none;min-width:198px;padding:6px;
  background:rgba(20,18,22,.98);border:1px solid var(--line-hot);border-radius:5px;
  box-shadow:0 26px 60px -18px rgba(0,0,0,.95);animation:menuIn .12s ease}
[data-theme="light"] #ctxMenu{background:rgba(247,240,225,.99)}
.ci{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:3px;font-size:12px;letter-spacing:.1em;position:relative}
.ci:hover{background:var(--red);color:#fff}
.ci:hover .k{color:rgba(255,255,255,.72)}
.ci svg{width:14px;height:14px;flex:0 0 14px}
.ci .k{margin-left:auto;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--paper3)}
.ci.danger:hover{background:var(--red-deep)}
.ci[aria-disabled="true"]{opacity:.36;pointer-events:none}
.csep{height:1px;margin:5px 8px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}

/* ============ 通知 · 纸签 ============ */
#toasts{position:fixed;right:52px;bottom:calc(var(--taskbar-h) + 16px);z-index:300;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
@media (max-width:820px){#toasts{right:12px}}
.toast{max-width:290px;padding:11px 14px;border-radius:4px;border:1px solid var(--line-hot);border-left:3px solid var(--red);
  background:rgba(20,18,22,.97);box-shadow:0 18px 40px -18px rgba(0,0,0,.9);animation:toastIn .2s ease}
[data-theme="light"] .toast{background:rgba(247,240,225,.98)}
.toast b{display:block;font-family:var(--f-display);letter-spacing:.22em;font-size:12px;margin-bottom:3px}
.toast p{margin:0;font-size:11.5px;line-height:1.65;color:var(--paper2)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}

/* ============ 日历 ============ */
#calendar{position:fixed;right:12px;bottom:calc(var(--taskbar-h) + 12px);z-index:80;width:292px;display:none;
  background:rgba(20,18,22,.98);border:1px solid var(--line-hot);border-radius:var(--radius);padding:16px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.95)}
[data-theme="light"] #calendar{background:rgba(247,240,225,.99)}
#calendar.open{display:block;animation:menuIn .16s ease}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-family:var(--f-display);letter-spacing:.24em;font-size:13px}
.cal-nav{width:26px;height:26px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;color:var(--paper2)}
.cal-nav:hover{border-color:var(--red);color:var(--paper)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .w{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-align:center;color:var(--paper3);padding:5px 0}
.cal-grid .d{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border-radius:3px;color:var(--paper2)}
.cal-grid .d:hover{background:rgba(192,49,43,.22);color:var(--paper)}
.cal-grid .d.out{opacity:.26}
.cal-grid .d.today{background:var(--red);color:#fff}

/* ============ 通用控件 ============ */
.btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--line);
  border-radius:4px;font-size:11.5px;letter-spacing:.14em;color:var(--paper2);background:rgba(255,255,255,.03);transition:.13s}
.btn:hover{border-color:var(--red);color:var(--paper);background:rgba(192,49,43,.16)}
.btn.on{border-color:var(--red-hot);background:rgba(192,49,43,.28);color:var(--paper)}
.btn.primary{background:var(--red);border-color:var(--red-hot);color:#fff}
.btn.primary:hover{background:var(--red-hot)}
.btn svg{width:13px;height:13px}
.field{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:4px;
  background:rgba(255,255,255,.03)}
.field input{flex:1;background:none;border:0;outline:none;font-size:12px;letter-spacing:.08em;min-width:0}
select.sel{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--raise);
  color:var(--paper);letter-spacing:.12em;font-size:11.5px;outline:none}
select.sel:focus{border-color:var(--red)}
.tool{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.divide{width:1px;height:22px;background:var(--line);flex:0 0 1px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;
  border:1px solid var(--line);font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;color:var(--paper3)}
.chip.green{border-color:rgba(111,231,176,.42);color:var(--green)}
.chip.red{border-color:rgba(232,82,63,.5);color:var(--red-hot)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center}
.empty .brush{font-family:var(--f-brush);font-size:30px;color:rgba(192,49,43,.62);letter-spacing:.14em}
.empty p{margin:0;font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;color:var(--paper3);line-height:2.1}

/* ============ 加载 · 香篆 ============ */
.loadmask{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:color-mix(in srgb, var(--void) 88%, transparent);transition:opacity .35s}
.loadmask.hide{opacity:0;pointer-events:none}
.loadmask .ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(192,49,43,.22);border-top-color:var(--red-hot);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadmask p{margin:0;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.32em;color:var(--paper3)}

/* ============ 入侵（ARG） ============ */
#intruder{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:0;background:#0B0A0C}
#intruder.go{animation:intrude .62s ease}
#intruder svg{position:absolute;right:6%;top:8%;width:min(38vw,340px);opacity:.13}
@keyframes intrude{0%{opacity:0}12%{opacity:.62}22%{opacity:.12}34%{opacity:.5}100%{opacity:0}}

/* ============ 移动端 ============ */
@media (max-width:820px){
  :root{--taskbar-h:62px}
  #taskbar{padding:0 8px;gap:6px}
  #startBtn{width:44px;padding:0;justify-content:center}
  #startBtn .mark{font-size:22px}
  .tbtn{height:44px;min-width:44px;padding:0 9px}
  .tbtn span{display:none}
  .traybtn{width:40px;height:40px}
  #clock{min-width:64px;padding:3px 8px}
  #clock .t{font-size:12px}
  .win{border-radius:0}
  .win-btn{width:38px;height:32px}
  #startMenu{left:0;right:0;bottom:0;width:100%;max-height:78vh;border-radius:var(--radius) var(--radius) 0 0}
  .sm-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.05ms !important}
  #ash{display:none}
}
</style>

function iconFor(name, isDir) {

/* ============================================================
   3. IndexedDB 低层封装
   ============================================================ */
const IDB = {
  name: 'yinhun-vfs', ver: 1, db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(this.name, this.ver); } catch (e) { return rej(e); }
      req.onupgradeneeded = e => {
        const db = req.result;
        ['nodes', 'blobs', 'meta', 'mounts', 'kv'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); });
      };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => rej(req.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(out && out.__p ? out.__p : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => wrapReq(s.get(key))); },
  put(store, key, val) { return this.tx(store, 'readwrite', s => { s.put(val, key); return 0; }); },
  del(store, key) { return this.tx(store, 'readwrite', s => { s.delete(key); return 0; }); },
  keys(store) { return this.tx(store, 'readonly', s => wrapReq(s.getAllKeys())); },
  vals(store) { return this.tx(store, 'readonly', s => wrapReq(s.getAll())); },
  clear(store) { return this.tx(store, 'readwrite', s => { s.clear(); return 0; }); },
  delPrefix(store, prefix) {
    return this.tx(store, 'readwrite', s => {
      const r = s.openCursor(IDBKeyRange.bound(prefix, prefix + '\uffff'));
      r.onsuccess = () => { const c = r.result; if (c) { c.delete(); c.continue(); } };
      return 0;
    });
  },
  rekeyPrefix(store, prefix, newPrefix, transform) {
    return this.tx(store, 'readwrite', s => {
      const r = s.openCursor(IDBKeyRange.bound(prefix, prefix + '\uffff'));
      r.onsuccess = () => {
        const c = r.result;
        if (!c) return;
        const nk = newPrefix + c.key.slice(prefix.length);
        const val = transform ? transform(nk, c.value) : c.value;
        s.put(val, nk); c.delete(); c.continue();
      };
      return 0;
    });
  }
};
function wrapReq(r) { const p = new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); return { __p: p }; }

/* ============================================================
   4. 双后端：OPFS（纸库） / IndexedDB（影库） / 本机挂载（阳间）
   ============================================================ */
const OPFSBackend = {
  id: 'opfs', label: '纸库 · OPFS', root: null,
  async base() {
    if (this.root) return this.root;
    if (!navigator.storage || !navigator.storage.getDirectory) throw new Error('此浏览器不支持 OPFS');
    this.root = await navigator.storage.getDirectory();
    return this.root;
  },
  async walk(sub, create) {
    const base = await this.base();
    let dir = base;
    for (const seg of segs(sub)) dir = await dir.getDirectoryHandle(seg, { create: !!create });
    return dir;
  },
  async parentOf(sub, create) {
    const parts = segs(sub);
    const name = parts.pop();
    return { dir: await this.walk('/' + parts.join('/'), create), name };
  },
  async readdir(sub) {
    const dir = await this.walk(sub, false);
    const out = [];
    for await (const [name, h] of dir.entries()) out.push({ name, isDir: h.kind === 'directory' });
    return out;
  },
  async stat(sub) {
    const { dir, name } = await this.parentOf(sub, false);
    if (!name) { const f = await this.base(); return { isDir: true, size: 0, mtime: Date.now() }; }
    try {
      const h = await dir.getDirectoryHandle(name);
      return { isDir: true, size: 0, mtime: Date.now() };
    } catch (e) { }
    const fh = await dir.getFileHandle(name);
    const f = await fh.getFile();
    return { isDir: false, size: f.size, mtime: f.lastModified };
  },
  async readFile(sub) {
    const { dir, name } = await this.parentOf(sub, false);
    const fh = await dir.getFileHandle(name);
    const f = await fh.getFile();
    return new Uint8Array(await f.arrayBuffer());
  },
  async writeFile(sub, data, mtime) {
    const { dir, name } = await this.parentOf(sub, true);
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    const chunk = toChunk(data);
    await w.write(chunk);
    await w.close();
    return mtime || Date.now();
  },
  async mkdir(sub) { await this.walk(sub, true); return true; },
  async unlink(sub) {
    const { dir, name } = await this.parentOf(sub, false);
    await dir.removeEntry(name, { recursive: true });
    return true;
  },
  async exists(sub) {
    try { await this.stat(sub); return true; } catch (e) { return false; }
  }
};
function segs(sub) { return norm(sub).split('/').filter(Boolean); }
/* 统一二进制分片：TypedArray 只写视图本身，绝不带出多余字节 */
function toChunk(data) {
  if (data instanceof Blob) return data;
  if (data instanceof ArrayBuffer) return data;
  if (ArrayBuffer.isView(data)) return data;
  if (typeof data === 'string') return new TextEncoder().encode(data);
  return new Uint8Array(data || 0);
}

const IDBBackend = {
  id: 'idb', label: '影库 · IndexedDB',
  key(sub) { return norm(sub); },
  async readdir(sub) {
    const k = this.key(sub);
    const keys = await IDB.keys('nodes');
    const prefix = k === '/' ? '/' : k + '/';
    return keys.filter(x => x.startsWith(prefix) && x.indexOf('/', prefix.length) === -1)
      .map(x => ({ name: x.slice(x.lastIndexOf('/') + 1), isDir: false }));
  },
  async readdirFull(sub) {
    const k = this.key(sub);
    const keys = await IDB.keys('nodes');
    const prefix = k === '/' ? '/' : k + '/';
    const names = keys.filter(x => x.startsWith(prefix) && x.indexOf('/', prefix.length) === -1);
    const out = [];
    for (const x of names) {
      const n = await IDB.get('nodes', x);
      out.push({ name: x.slice(x.lastIndexOf('/') + 1), isDir: !n || n.t === 'd' });
    }
    return out;
  },
  async stat(sub) {
    const k = this.key(sub);
    if (k === '/') return { isDir: true, size: 0, mtime: Date.now() };
    const n = await IDB.get('nodes', k);
    if (!n) throw Object.assign(new Error('不存在'), { code: 'ENOENT' });
    return { isDir: n.t === 'd', size: n.s || 0, mtime: n.m || Date.now(), mime: n.mime };
  },
  async readFile(sub) {
    const k = this.key(sub);
    const b = await IDB.get('blobs', k);
    if (b == null) throw Object.assign(new Error('不存在'), { code: 'ENOENT' });
    return b instanceof Uint8Array ? b : new Uint8Array(b instanceof ArrayBuffer ? b : await new Blob([b]).arrayBuffer());
  },
  async writeFile(sub, data, mtime) {
    const k = this.key(sub);
    const buf = data instanceof Uint8Array ? data.slice().buffer
      : (data instanceof ArrayBuffer ? data : await new Blob([data]).arrayBuffer());
    await IDB.put('blobs', k, buf);
    await IDB.put('nodes', k, { t: 'f', s: buf.byteLength, m: mtime || Date.now(), mime: mimeOf(k) });
    await this.ensureParents(k);
    return mtime || Date.now();
  },
  async ensureParents(k) {
    const parts = k.split('/').filter(Boolean);
    parts.pop();
    let cur = '';
    for (const p of parts) {
      cur += '/' + p;
      const n = await IDB.get('nodes', cur);
      if (!n) await IDB.put('nodes', cur, { t: 'd', s: 0, m: Date.now() });
    }
  },
  async mkdir(sub) {
    const k = this.key(sub);
    await IDB.put('nodes', k, { t: 'd', s: 0, m: Date.now() });
    await this.ensureParents(k);
    return true;
  },
  async unlink(sub) {
    const k = this.key(sub);
    const n = await IDB.get('nodes', k);
    if (!n) return true;
    if (n.t === 'd') {
      await IDB.delPrefix('nodes', k + '/');
      await IDB.delPrefix('blobs', k + '/');
    }
    await IDB.del('nodes', k);
    await IDB.del('blobs', k);
    return true;
  },
  async exists(sub) { const n = await IDB.get('nodes', this.key(sub)); return !!n; }
};
IDBBackend.readdir = IDBBackend.readdirFull;

const LocalBackend = {
  id: 'local', label: '本机 · 阳间', handles: new Map(),
  async load() {
    try {
      const all = await IDB.vals('mounts');
      const keys = await IDB.keys('mounts');
      keys.forEach((k, i) => { if (all[i]) this.handles.set(k, all[i]); });
    } catch (e) { }
  },
  async add(name, handle) {
    this.handles.set(name, handle);
    await IDB.put('mounts', name, handle);
  },
  async remove(name) {
    this.handles.delete(name);
    await IDB.del('mounts', name);
  },
  list() { return Array.from(this.handles.keys()); },
  async walk(sub, create) {
    const parts = segs(sub);
    const rootName = parts.shift();
    const root = this.handles.get(rootName);
    if (!root) throw Object.assign(new Error('未挂载：' + rootName), { code: 'ENOMOUNT' });
    let dir = root;
    for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: !!create });
    return dir;
  },
  async parentOf(sub, create) {
    const parts = segs(sub); const name = parts.pop();
    return { dir: await this.walk('/' + parts.join('/'), create), name };
  },
  async readdir(sub) {
    const dir = await this.walk(sub, false);
    const out = [];
    for await (const h of dir.values()) out.push({ name: h.name, isDir: h.kind === 'directory' });
    return out;
  },
  async stat(sub) {
    const { dir, name } = await this.parentOf(sub, false);
    if (!name) return { isDir: true, size: 0, mtime: Date.now() };
    let h;
    try { h = await dir.getDirectoryHandle(name); return { isDir: true, size: 0, mtime: Date.now() }; } catch (e) { }
    h = await dir.getFileHandle(name);
    const f = await h.getFile();
    return { isDir: false, size: f.size, mtime: f.lastModified };
  },
  async readFile(sub) {
    const { dir, name } = await this.parentOf(sub, false);
    const fh = await dir.getFileHandle(name);
    return new Uint8Array(await (await fh.getFile()).arrayBuffer());
  },
  async writeFile(sub, data, mtime) {
    const { dir, name } = await this.parentOf(sub, true);
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(toChunk(data));
    await w.close();
    return mtime || Date.now();
  },
  async mkdir(sub) { await this.walk(sub, true); return true; },
  async unlink(sub) {
    const { dir, name } = await this.parentOf(sub, false);
    await dir.removeEntry(name, { recursive: true });
    return true;
  },
  async exists(sub) { try { await this.stat(sub); return true; } catch (e) { return false; } }
};

/* 挂载表：路径第一段决定后端 */
const MOUNTS = {
  '纸库': OPFSBackend,
  '影库': IDBBackend,
  '本机': LocalBackend
};
function route(path) {
  const p = norm(path);
  const parts = p.split('/').filter(Boolean);
  const mount = parts.shift() || '';
  const be = MOUNTS[mount];
  return { mount, backend: be, sub: '/' + parts.join('/') };
}
function segsOf(path) { return norm(path).split('/').filter(Boolean); }

/* ============================================================
   5. fs —— 统一文件系统 API（所有 App 只准调用它）
   ============================================================ */
const fs = {
  OPFS: OPFSBackend, IDB: IDBBackend, Local: LocalBackend, MOUNTS,
  metaCache: new Map(),
  thumbCache: new Map(),
  dirSizeCache: new Map(),

  async init() {
    try { await OPFSBackend.base(); } catch (e) { }
    try { await IDB.open(); } catch (e) { }
    await LocalBackend.load();
    for (const m of ['纸库', '影库']) {
      for (const d of ['桌面', '文档', '图片', '音乐', '视频', '下载', '焚化炉', '样本']) {
        try { await this.mkdir('/' + m + '/' + d); } catch (e) { }
      }
    }
    return true;
  },
  async metaGet(p) {
    if (this.metaCache.has(p)) return this.metaCache.get(p);
    let v = null;
    try { v = await IDB.get('meta', p); } catch (e) { }
    this.metaCache.set(p, v);
    return v;
  },
  async metaSet(p, mtime) {
    this.metaCache.set(p, mtime);
    try { await IDB.put('meta', p, mtime); } catch (e) { }
  },
  async metaDel(p) {
    this.metaCache.delete(p);
    try { await IDB.del('meta', p); } catch (e) { }
  },

  async stat(path) {
    const p = norm(path);
    if (p === '/' || !MOUNTS[segsOf(p)[0]]) {
      return { name: segsOf(p).pop() || '/', path: p, isDir: true, size: 0, mtime: Date.now(), mime: '', backend: 'virtual' };
    }
    const r = route(p);
    if (!r.backend) throw new Error('未知存储');
    const s = await r.backend.stat(r.sub);
    const meta = await this.metaGet(p);
    return {
      name: segsOf(p).pop() || r.mount, path: p, isDir: s.isDir,
      size: s.size || 0, mtime: meta != null ? meta : (s.mtime || Date.now()),
      mime: s.isDir ? '' : mimeOf(p), backend: r.backend.id
    };
  },
  async exists(path) {
    const p = norm(path);
    if (p === '/') return true;
    const r = route(p);
    if (!r.backend) return false;
    if (r.backend === LocalBackend && segsOf(r.sub).length === 0) return true;
    try { return await r.backend.exists(r.sub); } catch (e) { return false; }
  },
  async readdir(path) {
    const p = norm(path);
    const r = route(p);
    if (p === '/') {
      return Object.keys(MOUNTS).map(n => ({ name: n, path: '/' + n, isDir: true, size: 0, mtime: Date.now(), backend: MOUNTS[n].id }));
    }
    if (!r.backend) throw new Error('未知存储');
    if (r.backend === LocalBackend && segsOf(r.sub).length === 0) {
      return LocalBackend.list().map(n => ({
        name: n, path: '/本机/' + n, isDir: true, size: 0, mtime: Date.now(), backend: 'local'
      }));
    }
    let raw;
    try { raw = await r.backend.readdir(r.sub); } catch (e) { throw e; }
    const out = [];
    for (const it of raw) {
      const cp = joinPath(p, it.name);
      let size = 0, mtime = Date.now();
      if (!it.isDir) {
        try {
          const s = await r.backend.stat(joinPath(r.sub, it.name));
          size = s.size || 0; mtime = s.mtime || Date.now();
        } catch (e) { }
      } else {
        mtime = (await this.metaGet(cp)) || Date.now();
      }
      const meta = await this.metaGet(cp);
      out.push({
        name: it.name, path: cp, isDir: !!it.isDir, size,
        mtime: meta != null ? meta : mtime,
        mime: it.isDir ? '' : mimeOf(it.name), backend: r.backend.id
      });
    }
    return out;
  },
  async readFile(path) {
    const r = route(norm(path));
    return await r.backend.readFile(r.sub);
  },
  async readText(path) {
    const b = await this.readFile(path);
    return new TextDecoder('utf-8').decode(b);
  },
  async readBlob(path) {
    const p = norm(path);
    const b = await this.readFile(p);
    return new Blob([b], { type: mimeOf(p) });
  },
  async dataURL(path) {
    const blob = await this.readBlob(path);
    return await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result); fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  },
  async objectURL(path) {
    const p = norm(path);
    if (this.thumbCache.has(p)) return this.thumbCache.get(p);
    const url = URL.createObjectURL(await this.readBlob(p));
    this.thumbCache.set(p, url);
    return url;
  },
  async writeFile(path, data, opts = {}) {
    const p = norm(path);
    const r = route(p);
    if (!r.backend) throw new Error('未知存储');
    const mtime = opts.mtime || Date.now();
    await r.backend.writeFile(r.sub, data, mtime);
    await this.metaSet(p, mtime);
    if (data && data.byteLength != null) this.dirSizeCache.clear();
    return true;
  },
  async mkdir(path) {
    const p = norm(path);
    const r = route(p);
    if (!r.backend) throw new Error('未知存储');
    await r.backend.mkdir(r.sub);
    await this.metaSet(p, Date.now());
    return true;
  },
  async unlink(path, opts = {}) {
    const p = norm(path);
    const r = route(p);
    if (!r.backend) throw new Error('未知存储');
    await r.backend.unlink(r.sub);
    await this.metaDel(p);
    try { await IDB.delPrefix('meta', p + '/'); } catch (e) { }
    this.dirSizeCache.clear();
    return true;
  },
  /* 移动：保留修改日期（绝不丢失 mtime） */
  async rename(src, dst) {
    const s = norm(src), d = norm(dst);
    if (s === d) return true;
    const rs = route(s), rd = route(d);
    const st = await this.stat(s);
    /* 影库同后端：整树改键，mtime 原样搬走 */
    if (rs.backend === rd.backend && rs.mount === rd.mount && rs.backend === IDBBackend) {
      try {

    /* 通用路径：先复制（保留 mtime），确认成功后才删源 */
    await this.copy(s, d, { keepTime: true });
    await this.metaSet(d, st.mtime);
    await this.unlink(s);

    const p = getClientXY(e);
    if (e.cancelable) e.preventDefault();
    const l = toLocal(p.x, p.y);
    edgeScroll(p.x, p.y);
    update(l.x, l.y);
  }
  function onUp() {
    if (!active) return;
    active = false; box.style.display = 'none';
    opts.onEnd && opts.onEnd();
  }
  container.addEventListener('pointerdown', onDown);
  container.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  document.addEventListener('touchend', onUp);
  document.addEventListener('touchcancel', onUp);
  return {
    destroy() {
      container.removeEventListener('pointerdown', onDown);
      container.removeEventListener('touchstart', onDown);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('touchend', onUp);
      box.remove();
    }
  };
}

   11. 香灰粒子层
   ============================================================ */
(function ashLayer() {
  const cv = $('#ash'); if (!cv) return;
  const ctx = cv.getContext('2d');
  let w, h, parts = [], raf = 0;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(innerWidth / 22);
    parts = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 1.7 + .35, vy: Math.random() * .28 + .06,
      vx: (Math.random() - .5) * .16, a: Math.random() * .42 + .06,
      hue: Math.random() > .82 ? '192,49,43' : '233,221,201', ph: Math.random() * 6.28
    }));
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.ph += .008;
      p.x += p.vx + Math.sin(p.ph) * .18;
      p.y += p.vy;
      if (p.y > innerHeight + 8) { p.y = -8; p.x = Math.random() * innerWidth; }
      if (p.x > innerWidth + 8) p.x = -8;
      if (p.x < -8) p.x = innerWidth + 8;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.hue},${p.a * .55})`;
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fill();
    }
    raf = requestAnimationFrame(tick);
  }
  size(); tick();
  addEventListener('resize', debounce(size, 200));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { cancelAnimationFrame(raf); tick(); }
  });
})();

    $('#clock .d').textContent = d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' · ' + '日一二三四五六'[d.getDay()];
  }

const Cal = {
  y: 0, m: 0,
  open() {
    const now = new Date();
    if (!this.y) { this.y = now.getFullYear(); this.m = now.getMonth(); }
    this.render();
    $('#calendar').classList.add('open');
  },
  render() {
    const y = this.y, m = this.m;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const today = new Date();
    let html = `<div class="cal-head">
      <button class="cal-nav" data-nav="-1">${ICONS.chevL}</button>
      <b>${y} 年 ${m + 1} 月 · 纸历</b>
      <button class="cal-nav" data-nav="1">${ICONS.chevR}</button></div>
      <div class="cal-grid">`;
    for (const w of '日一二三四五六') html += `<div class="w">${w}</div>`;
    for (let i = 0; i < 42; i++) {
      const dayNum = i - startDow + 1;
      let label, out = false;
      if (dayNum < 1) { label = prevDays + dayNum; out = true; }
      else if (dayNum > days) { label = dayNum - days; out = true; }
      else label = dayNum;
      const isToday = !out && dayNum === today.getDate() && m === today.getMonth() && y === today.getFullYear();
      html += `<div class="d${out ? ' out' : ''}${isToday ? ' today' : ''}">${label}</div>`;
    }
    html += '</div>';
    $('#calendar').innerHTML = html;
    $$('#calendar [data-nav]').forEach(b => b.addEventListener('click', () => {
      this.m += (+b.dataset.nav);
      if (this.m < 0) { this.m = 11; this.y--; }
      if (this.m > 11) { this.m = 0; this.y++; }
      this.render();
    }));

};

/* ============================================================
   13. 桌面图标 / 双向拖拽
   ============================================================ */
const Desktop = {
  container: null, icons: new Map(), selected: new Set(), clipboard: null, touchSelect: true,
  positions: {}, mq: null, dragCache: new Map(), gridSize: { w: 96, h: 100 },
  async init() {
    this.container = $('#iconLayer');
    try { this.positions = JSON.parse(localStorage.getItem('yinhun.iconpos') || '{}'); } catch (e) { this.positions = {}; }
    this.bindSurface();
    this.mq = Marquee($('#desktop'), {
      itemSelector: '.dicon',
      getItems: () => $$('.dicon', this.container),
      touchEnabled: () => this.touchSelect,
      onSelect: list => {
        const set = new Set(list);
        $$('.dicon', this.container).forEach(n => n.classList.toggle('sel', set.has(n)));
        this.selected = set;
      },
      onEnd: () => { }
    });
    await this.refresh();
  },
  savePos() { try { localStorage.setItem('yinhun.iconpos', JSON.stringify(this.positions)); } catch (e) { } },
  async refresh() {
    const dir = await fs.ensureSystem();
    let items = [];
    try { items = await fs.readdir(dir); } catch (e) { }
    items.sort((a, b) => (b.isDir - a.isDir) || naturalCompare(a.name, b.name));
    const existing = new Map();
    $$('.dicon', this.container).forEach(n => existing.set(n.dataset.path, n));
    const used = new Set();
    items.forEach((it, i) => {
      used.add(it.path);
      let node = existing.get(it.path);
      if (!node) {
        node = this.makeIcon(it, i);
        this.container.appendChild(node);
      } else {
        node.dataset.name = it.name;
      }
    });
    existing.forEach((n, p) => { if (!used.has(p)) { n.remove(); this.icons.delete(p); } });
  },
  makeIcon(it, index) {
    const node = el('div', 'dicon');
    node.dataset.path = it.path;
    node.dataset.name = it.name;
    node.dataset.isdir = it.isDir ? '1' : '0';
    node.draggable = true;
    const pos = this.positions[it.path];
    const col = pos ? pos.x : 18 + (index % 6) * this.gridSize.w;
    const row = pos ? pos.y : 18 + Math.floor(index / 6) * this.gridSize.h;
    node.style.left = col + 'px'; node.style.top = row + 'px';
    node.innerHTML = `<div class="glyph">${iconFor(it.name, it.isDir)}</div><div class="lbl">${esc(it.name)}</div>`;
    this.icons.set(it.path, it);

    node.addEventListener('click', ev => {
      ev.stopPropagation();
      if (node.dataset.suppress) return;
      if (ev.ctrlKey || ev.metaKey || ev.shiftKey) {
        node.classList.toggle('sel');
        this.selected.add(node);
        return;
      }
      /* 默认单击打开 */
      this.clearSel();
      node.classList.add('sel');
      this.selected.add(node);
      Shell.openPath(it.path);
    });
    node.addEventListener('dblclick', ev => { ev.stopPropagation(); Shell.openPath(it.path); });
    node.addEventListener('contextmenu', ev => {
      ev.preventDefault(); ev.stopPropagation();
      if (!node.classList.contains('sel')) { this.clearSel(); node.classList.add('sel'); this.selected.add(node); }
      this.menu(ev.clientX, ev.clientY, [it]);
    });
    /* 预加载拖拽数据（严禁在 dragstart 中 await） */
    const preload = () => {
      if (this.dragCache.has(it.path)) return;
      this.dragCache.set(it.path, { pending: true });
      if (it.isDir) { this.dragCache.set(it.path, { dir: true }); return; }
      fs.readBlob(it.path).then(blob => {
        this.dragCache.set(it.path, { blob, name: it.name, mime: mimeOf(it.name) });
      }).catch(() => this.dragCache.delete(it.path));
    };
    node.addEventListener('mouseenter', preload);
    node.addEventListener('mousedown', preload);
    node.addEventListener('touchstart', preload, { passive: true });

    node.addEventListener('dragstart', ev => {
      const c = this.dragCache.get(it.path);
      node.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'copyMove';
      ev.dataTransfer.setData('text/plain', it.path);
      ev.dataTransfer.setData('application/x-yinhun-path', JSON.stringify({ path: it.path, isDir: it.isDir }));
      if (c && c.blob) {
        try {
          const f = new File([c.blob], it.name, { type: c.mime });
          ev.dataTransfer.items.add(f);
          const url = URL.createObjectURL(c.blob);
          ev.dataTransfer.setData('DownloadURL', `${c.mime}:${it.name}:${url}`);
          setTimeout(() => URL.revokeObjectURL(url), 8000);
        } catch (e) { }
      }
    });
    node.addEventListener('dragend', () => {
      node.classList.remove('dragging');
      setTimeout(() => this.dragCache.delete(it.path), 400);
    });

    /* 触摸拖动摆放 */
    let touchDrag = null;
    node.addEventListener('touchstart', ev => {
      const t = ev.touches[0];
      touchDrag = { x: t.clientX, y: t.clientY, lx: parseFloat(node.style.left), ly: parseFloat(node.style.top), moved: false, id: ev.touches[0].identifier };
      const timer = setTimeout(() => { if (touchDrag) touchDrag.armed = true; }, 200);
      touchDrag.timer = timer;
    }, { passive: true });
    node.addEventListener('touchmove', ev => {
      if (!touchDrag) return;
      const t = ev.touches[0];
      const dx = t.clientX - touchDrag.x, dy = t.clientY - touchDrag.y;
      if (!touchDrag.armed && Math.hypot(dx, dy) > 12 && !this.touchSelect) return;
      touchDrag.armed = true; touchDrag.moved = true;
      ev.preventDefault();
      node.style.left = touchDrag.lx + dx + 'px';
      node.style.top = touchDrag.ly + dy + 'px';
    }, { passive: false });
    node.addEventListener('touchend', () => {
      clearTimeout(touchDrag && touchDrag.timer);
      if (touchDrag && touchDrag.moved) {
        node.dataset.suppress = '1';
        setTimeout(() => { delete node.dataset.suppress; }, 520);
        this.positions[it.path] = {
          x: Math.round(parseFloat(node.style.left) / 8) * 8,
          y: Math.round(parseFloat(node.style.top) / 8) * 8
        };
        this.savePos();
      }
      touchDrag = null;
    });
    return node;
  },
  clearSel() {
    this.selected.clear();
    $$('.dicon', this.container).forEach(n => n.classList.remove('sel'));
  },
  bindSurface() {
    const desk = $('#desktop');
    desk.addEventListener('click', ev => {
      if (ev.target === desk || ev.target === this.container) this.clearSel();
    });
    desk.addEventListener('contextmenu', ev => {
      if (ev.target.closest('.dicon')) return;
      ev.preventDefault();
      this.clearSel();
      this.menu(ev.clientX, ev.clientY, []);
    });
    /* 拖入：内部移动 / 外部导入 */
    desk.addEventListener('dragover', ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
    desk.addEventListener('drop', async ev => {
      ev.preventDefault();
      const raw = ev.dataTransfer.getData('application/x-yinhun-path');
      const dir = await fs.ensureSystem();
      if (raw) {
        let info; try { info = JSON.parse(raw); } catch (e) { return; }
        const node = $(`.dicon[data-path="${CSS.escape(info.path)}"]`);
        if (node) {
          const r = $('#desktop').getBoundingClientRect();
          const x = Math.round((ev.clientX - r.left - 44) / 8) * 8;
          const y = Math.round((ev.clientY - r.top - 30) / 8) * 8;
          node.style.left = clamp(x, 0, r.width - 92) + 'px';
          node.style.top = clamp(y, 0, r.height - 96) + 'px';
          this.positions[info.path] = { x: parseFloat(node.style.left), y: parseFloat(node.style.top) };
          this.savePos();
          return;
        }
        try {
          const name = await fs.uniqueName(dir, info.path.split('/').pop());
          await fs.move(info.path, joinPath(dir, name));
          Toast.push('已移入桌面', name);
          this.refresh();
        } catch (e) { Toast.push('移动失败', e.message); }
        return;
      }
      await Shell.importDataTransfer(ev.dataTransfer, dir);
      this.refresh();
    });
  },
  async menu(x, y, picked) {
    const dir = await fs.ensureSystem();
    const items = [];
    if (picked.length) {
      items.push({ label: '打开', icon: ICONS.eye, action: () => picked.forEach(p => Shell.openPath(p.path)) });
      items.push({ label: '用符纸编辑', icon: ICONS.text, action: () => Apps.open('notepad', { path: picked[0].path }) });
      items.push({ label: '下载到阳间', icon: ICONS.download, action: () => picked.forEach(p => Shell.download(p.path)) });
      items.push('-');
      items.push({ label: '复制', icon: ICONS.copy, action: () => { this.clipboard = picked.map(p => p.path); Toast.push('已复制', picked.length + ' 项'); } });
      items.push({ label: '重命名', icon: ICONS.rename, action: () => this.renamePicked(picked[0]) });
      items.push({ label: '送入焚化炉', icon: ICONS.trash, danger: true, action: async () => { for (const p of picked) await fs.trash(p.path); await this.refresh(); Toast.push('已焚化', picked.length + ' 项已送入焚化炉'); } });
      items.push('-');
    }
    items.push({ label: '刷新桌面', icon: ICONS.refresh, key: 'F5', action: () => { this.refresh(); Toast.push('纸灰重落', '桌面已刷新'); } });
    items.push({
      label: '新建文件夹', icon: ICONS.folder, action: async () => {
        const name = await fs.uniqueName(dir, '新纸夹');
        await fs.mkdir(joinPath(dir, name));
        await this.refresh();
      }
    });
    items.push({
      label: '新建文稿', icon: ICONS.text, action: async () => {
        const name = await fs.uniqueName(dir, '无名符纸.txt');
        await fs.writeFile(joinPath(dir, name), new TextEncoder().encode(''), { mtime: Date.now() });
        await this.refresh();
      }
    });
    if (this.clipboard && this.clipboard.length) {
      items.push({
        label: '粘贴 ' + this.clipboard.length + ' 项', icon: ICONS.paste, action: async () => {
          for (const p of this.clipboard) {
            const name = await fs.uniqueName(dir, p.split('/').pop());
            await fs.copy(p, joinPath(dir, name));
          }
          await this.refresh();
        }
      });
    }
    items.push('-');
    items.push({ label: '上传文件到桌面', icon: ICONS.upload, action: () => Shell.upload(dir, () => this.refresh()) });
    items.push({ label: '更换壁纸', icon: ICONS.image, action: () => Apps.open('settings', { section: 'wallpaper' }) });
    items.push({
      label: '全屏模式', icon: ICONS.full, action: () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }
    });
    items.push({ label: '道坛 · 设置', icon: ICONS.settings, action: () => Apps.open('settings') });
    Ctx.show(x, y, items);
  },
  async renamePicked(it) {
    const name = prompt('改名（铭刻于纸）', it.name);
    if (!name || name === it.name) return;
    const dst = joinPath(dirOf(it.path), name);
    await fs.rename(it.path, dst);
    await this.refresh();
  }
};

/* ============================================================
   15. Shell：打开 / 导入 / 导出 / 打开方式
   ============================================================ */
const Shell = {
  cache: new Map(),
  async openPath(path, opts = {}) {
    let st;
    try { st = await fs.stat(path); } catch (e) { Toast.push('无法打开', e.message); return; }
    if (st.isDir) {
      if (opts.win && opts.win.app === 'files') { opts.win.ex.navigate(path); return; }
      Apps.open('files', { path });
      return;
    }
    const k = kindOf(st.name), e = extOf(st.name);
    if (k === 'image') {
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'avif', 'ico', 'svg'].includes(e)) return Apps.open('manga', { path, mode: 'image' });
    }
    if (k === 'audio') return Apps.open('media', { path, kind: 'audio' });
    if (k === 'video') return Apps.open('media', { path, kind: 'video' });
    if (k === 'pdf') return Apps.open('media', { path, kind: 'pdf' });
    if (e === 'zip' || e === 'gz' || e === 'tgz' || e === 'tar') {
      Toast.push('压缩包', '请在档案中右键选择「解压」以展开纸卷');
      Apps.open('files', { path: dirOf(path) });
      return;
    }
    if (['html', 'htm'].includes(e)) return Apps.open('htmlpage', { path });
    if (['csv', 'tsv'].includes(e)) return Apps.open('notepad', { path });
    if (k === 'text') return Apps.open('notepad', { path });
    return Apps.open('notepad', { path, raw: true });
  },
  openWith(path, appId) { return Apps.open(appId, { path }); },
  async download(path) {
    try {
      const blob = await fs.readBlob(path);
      const url = URL.createObjectURL(blob);
      const a = el('a'); a.href = url; a.download = path.split('/').pop();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 6000);
      Toast.push('已送往阳间', path.split('/').pop());
    } catch (e) { Toast.push('导出失败', e.message); }
  },
  exportBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = el('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 6000);
  },
  upload(dir, cb) {
    const inp = $('#hiddenFile');
    inp.value = '';
    inp.accept = '';
    inp.onchange = async () => {
      const files = Array.from(inp.files || []);
      for (const f of files) {
        const name = await fs.uniqueName(dir, f.name);
        await fs.writeFile(joinPath(dir, name), new Uint8Array(await f.arrayBuffer()), { mtime: f.lastModified || Date.now() });
      }
      Toast.push('已入纸楼', files.length + ' 份文件写入 ' + dir);
      cb && cb();
    };
    inp.click();
  },
  async importDataTransfer(dt, dir) {
    const items = dt.items ? Array.from(dt.items) : [];
    const entries = [];
    for (const it of items) {
      if (it.kind !== 'file') continue;
      let entry = null;
      try { entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; } catch (e) { }
      if (entry) entries.push(entry);
    }
    let count = 0;
    const writeEntry = async (entry, targetDir) => {
      if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        const name = await fs.uniqueName(targetDir, entry.name);
        await fs.writeFile(joinPath(targetDir, name), new Uint8Array(await file.arrayBuffer()), { mtime: file.lastModified || Date.now() });
        count++;
      } else if (entry.isDirectory) {
        const sub = joinPath(targetDir, await fs.uniqueName(targetDir, entry.name));
        await fs.mkdir(sub);
        const reader = entry.createReader();
        let batch;
        do {
          batch = await new Promise(res => reader.readEntries(res, () => res([])));
          for (const e of batch) await writeEntry(e, sub);
        } while (batch.length > 0);
      }
    };
    if (entries.length) {
      Toast.push('正在折纸', '读取外部文件…');
      for (const e of entries) await writeEntry(e, dir);
    } else if (dt.files && dt.files.length) {
      for (const f of dt.files) {
        const name = await fs.uniqueName(dir, f.name);
        await fs.writeFile(joinPath(dir, name), new Uint8Array(await f.arrayBuffer()), { mtime: f.lastModified || Date.now() });
        count++;
      }
    }
    Toast.push('已入纸楼', count + ' 份文件已写入 ' + dir);
    return count;
  },
  busy(msg) {
    const t = Toast.push('请候', msg || '正在施法…', 9000);
    return () => t.classList.add('out');
  }
};

/* ============================================================
   16. 纸楼档案 · 文件资源管理器
   ============================================================ */
Apps.register('files', {
  name: '纸楼档案', roman: 'ARCHIVE', icon: ICONS.folder, w: 1000, h: 620,
  build(win, data) { win.ex = buildExplorer(win, data); }
});

function buildExplorer(win, data) {
  const st = {
    path: data.path || fs.desktopPath(),
    hist: [], hi: -1,
    view: Settings.get('explorerView') || 'details',
    sortKey: 'name', sortDir: 1,
    sel: new Set(), cols: { name: 250, date: 148, type: 104, size: 96 },
    touchSelect: false, clipboard: null, items: [], loading: false
  };
  win.body.innerHTML = `
    <div class="ex">
      <div class="ex-tool">
        <button class="btn" data-a="back" title="后退">${ICONS.chevL}</button>
        <button class="btn" data-a="fwd" title="前进">${ICONS.chevR}</button>
        <button class="btn" data-a="up" title="上一层">${ICONS.up}</button>
        <div class="field" style="flex:1;min-width:150px">
          <span style="width:14px;height:14px;color:var(--paper3)">${ICONS.search}</span>
          <input data-a="search" placeholder="在此纸楼中寻物（留空显示全部）">
          <button class="btn" data-a="gsearch" style="height:22px;padding:0 8px">全局</button>
        </div>
        <div class="divide"></div>
        <button class="btn" data-a="newfolder" title="新建文件夹">${ICONS.folder}<span>新建</span></button>
        <button class="btn" data-a="upload" title="上传">${ICONS.upload}<span>上传</span></button>
        <button class="btn" data-a="extract" title="解压">${ICONS.archive}<span>解压</span></button>
        <div class="divide"></div>
        <button class="btn" data-view="icons" title="图标视图">${ICONS.grid}</button>
        <button class="btn" data-view="list" title="列表视图">${ICONS.list}</button>
        <button class="btn" data-view="details" title="详细信息">${ICONS.details}</button>
        <button class="btn" data-view="columns" title="分栏视图">${ICONS.columns}</button>
        <button class="btn" data-a="selmode" title="触摸框选模式">框选</button>
      </div>
      <div class="ex-crumb"></div>
      <div class="ex-main">
        <aside class="ex-side"></aside>
        <div class="ex-body">
          <div class="ex-list"></div>
          <div class="ex-status">
            <span data-s="count">—</span>
            <span data-s="sel">未选中</span>
            <span data-s="path" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
            <button class="btn" data-a="newhere" style="height:22px">在此新建</button>
          </div>
        </div>
      </div>
    </div>`;
  const listEl = $('.ex-list', win.body);
  const sideEl = $('.ex-side', win.body);
  const toolEl = $('.ex-tool', win.body);

  /* ---- 侧栏 ---- */
  async function renderSide() {
    const home = '/' + Settings.get('defaultStore');
    const quick = [
      { n: '桌面', p: home + '/桌面', i: ICONS.monitor },
      { n: '文档', p: home + '/文档', i: ICONS.book },
      { n: '图片', p: home + '/图片', i: ICONS.image },
      { n: '音乐', p: home + '/音乐', i: ICONS.audio },
      { n: '视频', p: home + '/视频', i: ICONS.video },
      { n: '下载', p: home + '/下载', i: ICONS.download },
      { n: '焚化炉', p: home + '/焚化炉', i: ICONS.trash }
    ];
    let html = `<h5>快速通道</h5>`;
    quick.forEach(q => { html += `<div class="n${st.path === q.p ? ' on' : ''}" data-nav="${esc(q.p)}">${q.i}<span>${q.n}</span></div>`; });
    html += `<h5>存储 · 双库</h5>`;
    for (const m of Object.keys(MOUNTS)) {
      const on = st.path === '/' + m || st.path.startsWith('/' + m + '/');
      html += `<div class="n${on && st.path === '/' + m ? ' on' : ''}" data-nav="/${m}">${ICONS.disk}<span>${m}</span></div>`;
      if (m === '本机') {
        const list = LocalBackend.list();
        list.forEach(n => {
          html += `<div class="n${st.path === '/本机/' + n ? ' on' : ''}" data-nav="/本机/${esc(n)}" style="padding-left:22px">${ICONS.mount}<span>${esc(n)}</span></div>`;
        });
        html += `<div class="n" data-a="mount" style="padding-left:22px;opacity:.75">${ICONS.plus}<span>挂载本地文件夹</span></div>`;
      }
    }
    html += `<h5>目录树</h5><div data-tree></div>`;
    sideEl.innerHTML = html;
    $$('[data-nav]', sideEl).forEach(n => n.addEventListener('click', () => navigate(n.dataset.nav)));
    const mountBtn = $('[data-a="mount"]', sideEl);
    if (mountBtn) mountBtn.addEventListener('click', mountLocal);
    await renderTree($('[data-tree]', sideEl));
  }
  async function renderTree(container) {
    container.innerHTML = '';
    const roots = ['/' + Settings.get('defaultStore'), '/纸库', '/影库'];
    const uniq = Array.from(new Set(roots));
    for (const r of uniq) {
      let dirs = [];
      try { dirs = (await fs.readdir(r)).filter(x => x.isDir); } catch (e) { }
      const wrap = el('div', '');
      for (const d of dirs) {
        const node = el('div', 'n', `<span class="tw">${ICONS.chevR}</span>${ICONS.folder}<span>${esc(d.name)}</span>`);
        node.style.paddingLeft = '16px';
        let expanded = false, child = null;
        node.addEventListener('click', async ev => {
          ev.stopPropagation();
          navigate(d.path);
          if (!expanded) {
            expanded = true;
            $('.tw', node).innerHTML = ICONS.chevD;
            child = el('div', '');
            node.after(child);
            let subs = [];
            try { subs = (await fs.readdir(d.path)).filter(x => x.isDir); } catch (e) { }
            subs.forEach(s => {
              const cn = el('div', 'n', `${ICONS.folder}<span>${esc(s.name)}</span>`);
              cn.style.paddingLeft = '34px';
              cn.addEventListener('click', e2 => { e2.stopPropagation(); navigate(s.path); });
              child.appendChild(cn);
            });
          } else {
            expanded = false;
            $('.tw', node).innerHTML = ICONS.chevR;
            if (child) { child.remove(); child = null; }
          }
        });
        wrap.appendChild(node);
      }
      container.appendChild(wrap);
    }
  }
  async function mountLocal() {
    if (!window.showDirectoryPicker) { Toast.push('无法挂载', '此浏览器不支持 File System Access API'); return; }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await LocalBackend.add(handle.name, handle);
      Toast.push('阳间已接入', handle.name + ' 挂载于 /本机/' + handle.name);
      await renderSide();
      navigate('/本机/' + handle.name);
    } catch (e) {
      if (e.name !== 'AbortError') Toast.push('挂载失败', e.message);
    }
  }

  /* ---- 排序 / 渲染 ---- */
  function sortItems(items) {
    const k = st.sortKey, dir = st.sortDir;
    return items.slice().sort((a, b) => {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
      let r = 0;
      if (k === 'name') r = naturalCompare(a.name, b.name);
      else if (k === 'date') r = a.mtime - b.mtime;
      else if (k === 'size') r = (a.size || 0) - (b.size || 0);
      else if (k === 'type') r = naturalCompare(typeLabel(a.name, a.isDir), typeLabel(b.name, b.isDir));
      return r * dir;
    });
  }
  function colWidths() {
    return ['name', 'date', 'type', 'size'].map(k => `width:${st.cols[k]}px`).join(';');
  }
  async function render() {
    st.loading = true;
    let items = [];
    try { items = await fs.readdir(st.path); } catch (e) {
      listEl.innerHTML = `<div class="empty"><div class="brush">此门封着</div><p>${esc(e.message)}<br>请检查是否已挂载本机文件夹</p></div>`;
      st.loading = false;
      return;
    }
    st.items = sortItems(items);
    st.sel.clear();
    if (st.view === 'columns') { renderColumns(); updateStatus(); return; }
    const content = el('div', 'ex-content');
    if (st.view === 'details') {
      const head = el('div', 'ex-head');
      [['name', '名称'], ['date', '修改日期'], ['type', '类型'], ['size', '大小']].forEach(([k, label]) => {
        const c = el('div', 'hc', `${label}${st.sortKey === k ? (st.sortDir > 0 ? ' ↑' : ' ↓') : ''}<div class="hr"></div>`);
        c.style.cssText = `width:${st.cols[k]}px`;
        c.addEventListener('click', ev => {
          if (ev.target.classList.contains('hr')) return;
          if (st.sortKey === k) st.sortDir *= -1; else { st.sortKey = k; st.sortDir = 1; }
          render();
        });
        $('.hr', c).addEventListener('pointerdown', ev => {
          ev.preventDefault(); ev.stopPropagation();
          const start = { x: ev.clientX, w: st.cols[k] };
          const move = e2 => {
            st.cols[k] = clamp(start.w + e2.clientX - start.x, 72, 520);
            $$('.cell.c-' + k, content).forEach(n => n.style.width = st.cols[k] + 'px');
            c.style.width = st.cols[k] + 'px';
          };
          const up = () => {
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
          };
          document.addEventListener('pointermove', move);
          document.addEventListener('pointerup', up);
        });
        head.appendChild(c);
      });
      content.appendChild(head);
    }
    if (st.view === 'icons') {
      const grid = el('div', 'ex-grid');
      st.items.forEach(it => grid.appendChild(iconNode(it)));
      content.appendChild(grid);
    } else if (st.view === 'list') {
      st.items.forEach(it => {
        const r = el('div', 'row');
        r.dataset.path = it.path; r.dataset.isdir = it.isDir ? '1' : '0';
        r.draggable = true;
        r.innerHTML = `<div class="cell c-name" style="width:${st.cols.name}px">${iconFor(it.name, it.isDir)}<span>${esc(it.name)}</span></div>
          <div class="cell c-size" style="width:${st.cols.size}px">${it.isDir ? '文件夹' : fmtSize(it.size)}</div>`;
        bindRow(r, it);
        content.appendChild(r);
      });
    } else {
      st.items.forEach(it => {
        const r = el('div', 'row');
        r.dataset.path = it.path; r.dataset.isdir = it.isDir ? '1' : '0';
        r.draggable = true;
        r.innerHTML = `
          <div class="cell c-name" style="width:${st.cols.name}px">${iconFor(it.name, it.isDir)}<span>${esc(it.name)}</span></div>
          <div class="cell c-date" style="width:${st.cols.date}px">${fmtDate(it.mtime)}</div>
          <div class="cell c-type" style="width:${st.cols.type}px">${typeLabel(it.name, it.isDir)}</div>
          <div class="cell c-size" style="width:${st.cols.size}px">${it.isDir ? '—' : fmtSize(it.size)}</div>`;
        bindRow(r, it);
        content.appendChild(r);
        if (it.isDir) {
          const cell = $('.c-size', r);
          fs.dirSize(it.path).then(s => { if (cell.isConnected) cell.textContent = fmtSize(s); }).catch(() => { });
        }
      });
    }
    listEl.innerHTML = '';
    listEl.appendChild(content);
    if (!st.items.length) {
      content.appendChild(el('div', 'empty', `<div class="brush">空纸楼</div><p>此处尚无一物<br>右键可新建或上传</p>`));
    }
    st.loading = false;
    updateStatus();
  }
  function iconNode(it) {
    const n = el('div', 'gi');
    n.dataset.path = it.path; n.dataset.isdir = it.isDir ? '1' : '0';
    n.draggable = true;
    const isImg = !it.isDir && kindOf(it.name) === 'image';
    n.innerHTML = `<div class="th">${isImg ? `<img alt="" data-thumb="${esc(it.path)}">` : iconFor(it.name, it.isDir)}</div><div class="nm">${esc(it.name)}</div>`;
    if (isImg) {
      fs.objectURL(it.path).then(u => { const img = $('img', n); if (img) img.src = u; }).catch(() => { });
    }
    bindRow(n, it);
    return n;
  }
  function renderColumns() {
    listEl.innerHTML = '';
    const wrap = el('div', 'mill');
    listEl.appendChild(wrap);
    let cur = st.path;
    const addColumn = async (path, parent) => {
      const col = el('div', 'mill-col');
      let items = [];
      try { items = (await fs.readdir(path)).filter(x => x.isDir || true); } catch (e) { return; }
      items = sortItems(items);
      items.forEach(it => {
        const m = el('div', 'm', `${iconFor(it.name, it.isDir)}<span>${esc(it.name)}</span><i>${it.isDir ? '' : fmtSize(it.size)}</i>`);
        m.addEventListener('click', async () => {
          $$('.m', col).forEach(x => x.classList.remove('on'));
          m.classList.add('on');
          while (col.nextSibling) col.nextSibling.remove();
          if (it.isDir) await addColumn(it.path, col);
          else Shell.openPath(it.path);
        });
        m.addEventListener('dblclick', () => { if (!it.isDir) Shell.openPath(it.path); });
        col.appendChild(m);
      });
      parent ? parent.after(col) : wrap.appendChild(col);
      col.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    };
    addColumn(dirOf(st.path) === st.path ? st.path : dirOf(st.path));
    setTimeout(() => addColumn(st.path), 0);
    updateStatus();
  }

  /* ---- 行交互：单击选中 / 双击打开 / 拖拽 ---- */
  function bindRow(node, it) {
    node.addEventListener('click', ev => {
      ev.stopPropagation();
      if (ev.ctrlKey || ev.metaKey) { node.classList.toggle('sel'); }
      else if (!node.classList.contains('sel')) {
        $$('.row.sel,.gi.sel', listEl).forEach(n => n.classList.remove('sel'));
        node.classList.add('sel');
      }
      syncSel();
    });
    node.addEventListener('dblclick', ev => {
      ev.stopPropagation();
      if (it.isDir) navigate(it.path); else Shell.openPath(it.path, { win });
    });
    node.addEventListener('contextmenu', ev => {
      ev.preventDefault(); ev.stopPropagation();
      if (!node.classList.contains('sel')) {
        $$('.row.sel,.gi.sel', listEl).forEach(n => n.classList.remove('sel'));
        node.classList.add('sel');
      }
      syncSel();
      itemMenu(ev.clientX, ev.clientY, [it]);
    });
    /* 拖拽数据预载 */
    const preload = () => {
      if (Shell.cache.has(it.path)) return;
      Shell.cache.set(it.path, { pending: true });
      if (it.isDir) { Shell.cache.set(it.path, { dir: true }); return; }
      fs.readBlob(it.path).then(b => Shell.cache.set(it.path, { blob: b, name: it.name, mime: mimeOf(it.name) })).catch(() => Shell.cache.delete(it.path));
    };
    node.addEventListener('mouseenter', preload);
    node.addEventListener('mousedown', preload);
    node.addEventListener('dragstart', ev => {
      const c = Shell.cache.get(it.path);
      node.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'copyMove';
      ev.dataTransfer.setData('text/plain', it.path);
      ev.dataTransfer.setData('application/x-yinhun-path', JSON.stringify({ path: it.path, isDir: it.isDir }));
      if (c && c.blob) {
        try {
          ev.dataTransfer.items.add(new File([c.blob], it.name, { type: c.mime }));
          const url = URL.createObjectURL(c.blob);
          ev.dataTransfer.setData('DownloadURL', `${c.mime}:${it.name}:${url}`);
          setTimeout(() => URL.revokeObjectURL(url), 8000);
        } catch (e) { }
      }
    });
    node.addEventListener('dragend', () => {
      node.classList.remove('dragging');
      setTimeout(() => Shell.cache.delete(it.path), 400);
    });
    node.addEventListener('dragover', ev => {
      if (it.isDir) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; node.style.outline = '1px solid var(--red-hot)'; }
    });
    node.addEventListener('dragleave', () => { node.style.outline = ''; });
    node.addEventListener('drop', async ev => {
      node.style.outline = '';
      if (!it.isDir) return;
      ev.preventDefault(); ev.stopPropagation();
      await dropInto(ev.dataTransfer, it.path);
    });
    /* 触摸：长按拖动到文件夹 */
    let td = null;
    node.addEventListener('touchstart', ev => {
      const t = ev.touches[0];
      td = { x: t.clientX, y: t.clientY, timer: setTimeout(() => { if (td) td.armed = true; }, 220) };
    }, { passive: true });
    node.addEventListener('touchmove', ev => {
      if (!td) return;
      const t = ev.touches[0];
      if (!td.armed && Math.hypot(t.clientX - td.x, t.clientY - td.y) < 14) return;
      if (!td.armed) return;
      ev.preventDefault();
      node.classList.add('dragging');
      const under = document.elementFromPoint(t.clientX, t.clientY);
      $$('.row,.gi', listEl).forEach(n => n.style.outline = '');
      const tgt = under && under.closest('[data-isdir="1"]');
      if (tgt && tgt !== node) tgt.style.outline = '1px solid var(--red-hot)';
    }, { passive: false });
    node.addEventListener('touchend', async ev => {
      clearTimeout(td && td.timer);
      node.classList.remove('dragging');
      const t = ev.changedTouches[0];
      const under = document.elementFromPoint(t.clientX, t.clientY);
      $$('.row,.gi', listEl).forEach(n => n.style.outline = '');
      const tgt = under && under.closest('[data-isdir="1"]');
      if (td && td.armed && tgt && tgt !== node) {
        const target = tgt.dataset.path;
        try {
          const name = await fs.uniqueName(target, it.name);
          await fs.move(it.path, joinPath(target, name));
          Toast.push('已归档', it.name + ' → ' + target);
          render();
        } catch (e) { Toast.push('移动失败', e.message); }
      }
      td = null;
    });
  }
  async function dropInto(dt, targetDir) {
    const raw = dt.getData('application/x-yinhun-path');
    if (raw) {
      let info; try { info = JSON.parse(raw); } catch (e) { return; }
      if (info.path === targetDir || targetDir.startsWith(info.path + '/')) return;
      try {
        const name = await fs.uniqueName(targetDir, info.path.split('/').pop());
        await fs.move(info.path, joinPath(targetDir, name));
        Toast.push('已归档', info.path.split('/').pop() + ' → ' + targetDir);
        render();
        Desktop.refresh();
      } catch (e) { Toast.push('移动失败', e.message); }
      return;
    }
    await Shell.importDataTransfer(dt, targetDir);
    render();
    Desktop.refresh();
  }
  listEl.addEventListener('dragover', ev => { ev.preventDefault(); });
  listEl.addEventListener('drop', async ev => {
    if (ev.target.closest('[data-isdir="1"]')) return;
    ev.preventDefault();
    await dropInto(ev.dataTransfer, st.path);
  });

  /* ---- 选择 ---- */
  function syncSel() {
    st.sel = new Set($$('.row.sel,.gi.sel', listEl).map(n => n.dataset.path));
    updateStatus();
  }
  function renderCrumb() {
    const cr = $('.ex-crumb', win.body);
    if (!cr) return;
    const parts = st.path.split('/').filter(Boolean);
    let acc = '';
    let html = `<button class="btn" style="height:23px;padding:0 9px" data-c="/">${ICONS.home}</button>`;
    parts.forEach(s => {
      acc += '/' + s;

    });

  /* ---- 导航 ---- */
  async function navigate(p, noHist) {

  /* ---- 工具栏 ---- */
  toolEl.addEventListener('click', async ev => {

    if (v) {

      $$('[data-view]', toolEl).forEach(x => x.classList.toggle('on', x.dataset.view === v));
      render();
      return;

    switch (a) {
      case 'back': if (st.hi > 0) { st.hi--; navigate(st.hist[st.hi], true); } break;
      case 'fwd': if (st.hi < st.hist.length - 1) { st.hi++; navigate(st.hist[st.hi], true); } break;
      case 'up': navigate(dirOf(st.path)); break;
      case 'gsearch': {
        const q = $('[data-a="search"]', toolEl).value.trim();

        stop();
        st.items = res;
        renderResults(res, q);
        break;
      }
      case 'newfolder': {
        const name = await fs.uniqueName(st.path, '新纸夹');
        await fs.mkdir(joinPath(st.path, name));
        render(); Desktop.refresh();

      }
      case 'newhere': {
        const name = await fs.uniqueName(st.path, '无名符纸.txt');
        await fs.writeFile(joinPath(st.path, name), new TextEncoder().encode(''), { mtime: Date.now() });

        break;

      case 'upload': Shell.upload(st.path, () => { render(); Desktop.refresh(); }); break;
      case 'extract': {

  $('[data-a="search"]', toolEl).addEventListener('input', debounce(async ev => {

  }, 180));
  $('[data-view="' + st.view + '"]', toolEl) && $(`[data-view="${st.view}"]`, toolEl).classList.add('on');

  function renderResults(res, q) {

  }
  listEl.addEventListener('contextmenu', ev => {

    Ctx.show(ev.clientX, ev.clientY, [
      { label: '新建文件夹', icon: ICONS.folder, action: async () => { const n = await fs.uniqueName(st.path, '新纸夹'); await fs.mkdir(joinPath(st.path, n)); render(); } },

            await fs.copy(p, joinPath(st.path, name));

      { label: '刷新', icon: ICONS.refresh, action: () => render() },

        label: '此处新建文件夹并进入', icon: ICONS.plus, action: async () => {

  /* ---- 键盘 ---- */
  win.body.tabIndex = 0;

    } else if (k === 'f2') {

      if (p) itemMenu(200, 200, st.items.filter(i => i.path === p));

    } else if (k === 'enter') {

    }
