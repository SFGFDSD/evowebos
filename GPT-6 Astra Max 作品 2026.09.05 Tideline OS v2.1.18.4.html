    async function storageReport(){const entries=await walkFiles('/',{hidden:true,trash:true,mounts:false});const categories=[{key:'documents',label:'Documents',color:'#789c7b',size:0},{key:'images',label:'Images',color:'#baa878',size:0},{key:'media',label:'Audio & video',color:'#81a2a4',size:0},{key:'archives',label:'Archives',color:'#af9880',size:0},{key:'system',label:'System & wallpapers',color:'#a0ad98',size:0},{key:'other',label:'Other files',color:'#c5c2b0',size:0},{key:'trash',label:'Trash',color:'#c09587',size:0}];let total=0,count=0;for(const entry of entries){if(entry.kind!=='file')continue;count++;total+=entry.size;const extension=ext(entry.name);const key=entry.path.startsWith('/.system/')?'system':entry.path.startsWith('/Trash/')?'trash':imageExt.test(extension)?'images':audioExt.test(extension)||videoExt.test(extension)?'media':archiveExt.test(entry.name)?'archives':textExt.test(extension)||extension==='pdf'?'documents':'other';categories.find(category=>category.key===key).size+=entry.size;}let estimate={},persistent=false;try{estimate=await navigator.storage?.estimate?.()||{};persistent=await navigator.storage?.persisted?.()||false;}catch{}return{entries,categories,total,count,usage:estimate.usage,quota:estimate.quota,persistent};}

    async function resetWorkspace(){
      const value=await ask({title:'Make a completely fresh start?',message:'This permanently removes all Tideline files, settings, snapshots and Trash. Connected real folders are not deleted. Export a backup before continuing.\n\nType RESET to confirm.',value:'',confirm:'Reset workspace',danger:true});

      try{await fs.writeQueue;for(const win of [...windows.values()])await win.close(true);await fs.reset();if(DB.db)await DB.request('meta','readwrite',store=>store.clear());
        try{const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('tideline.'))keys.push(key);}keys.forEach(key=>localStorage.removeItem(key));document.cookie='tideline_theme=; max-age=0; path=/; SameSite=Lax';}catch{}

    }

          for(const record of fs.pendingMounts){const row=el('div','mount-entry');row.innerHTML=icon('lock')+`<div><strong>${escapeHTML(record.name)}</strong><small>Permission needed after refresh</small></div>`;const reconnect=el('button','btn','Reconnect');reconnect.onclick=safeRun(async()=>{await reconnectMount(record);await render();});const forget=el('button','icon-btn');forget.innerHTML=icon('close');forget.title='Forget this connection';forget.onclick=safeRun(async()=>{fs.pendingMounts=fs.pendingMounts.filter(item=>item!==record);await fs.saveMounts();await render();});row.append(reconnect,forget);list.append(row);}
        }else if(tab==='diagnostics'){
          main.innerHTML=`<h1>A healthy little workspace.</h1><p class="settings-intro">Real reads, writes and binary round-trips. These checks use a temporary folder in your actual filesystem, then clean up after themselves.</p><div class="flex gap-2">${buttonHTML('shield','Run system checks','checks','primary')}${buttonHTML('download','Export report','export-report')}</div><pre class="diagnostic-log" aria-live="polite"></pre><section class="settings-section"><h2>What needs a human check</h2><p class="muted" style="font-size:10px;line-height:1.9">Native OS drag-out, mobile touch behavior, local directory permissions, fullscreen and virtual-machine boot depend on your actual browser and device. They are reported separately, never marked as automatically verified.<br><br>For a persistence check, create a file, refresh the page, and run the checks again. The retained marker will be verified.</p></section>`;
          const log=$('.diagnostic-log',main);let results=diagnosticResults;if(!results.length){try{results=JSON.parse(await fs.readFile('/.system/diagnostics.json','utf8')).results;}catch{}}
          if(!win.alive||token!==renderToken)return;log.textContent=results.length?results.map(result=>`[${result.state}] ${result.name}${result.detail?'\n  '+result.detail:''}`).join('\n\n'):'No checks have been run yet. Choose Run system checks.';
        }else{
          main.innerHTML=`<div class="about-mark">tideline.</div><div class="about-version">YOUR SPACE. YOUR PACE. / RELEASE 1.0</div><p class="settings-intro" style="margin-top:25px">A quiet, capable desktop that lives in your browser. Built around one simple idea: your digital space should belong to you.</p><section class="settings-section"><h2>A few things worth knowing</h2><p class="muted" style="font-size:10px;line-height:1.95">Files are stored locally using native OPFS, with IndexedDB and clearly identified emergency fallbacks. There is no account and no backend.<br><br>CodeMirror, archive engines, fonts, photography and v86 resources load from pinned CDNs. If a dependency is unavailable, native editing and filesystem tools remain usable. A fresh offline page load still depends on the browser's page cache.<br><br>Browser codec support varies. Unsupported files can always be downloaded or opened as plain text. Some websites deliberately block iframe embedding.<br><br>HTML preview uses an additional isolated sandbox. Scripts in the preview cannot access the workspace filesystem.</p></section><section class="settings-section"><h2>A few useful shortcuts</h2>${[['All applications','Ctrl + Space'],['Save current document','Ctrl + S'],['Find / replace in code','Ctrl + F / H'],['Run preview','Ctrl + Enter'],['Format code','Ctrl + Shift + F'],['Select all files','Ctrl + A'],['Copy / cut / paste','Ctrl + C / X / V'],['Rename a file','F2'],['New folder','Ctrl + Shift + N'],['Close window','Alt + F4'],['Reader fullscreen','F'],['Release VM mouse','Escape']].map(([label,key])=>`<div class="shortcut-row"><span>${label}</span><kbd>${key}</kbd></div>`).join('')}</section><p class="eyebrow muted" style="margin-top:30px">LOCAL FIRST. ALWAYS YOURS.</p>`;
        }
        for(const button of $$('[data-pref-toggle]',main))button.onclick=()=>{const key=button.dataset.prefToggle;prefs[key]=!prefs[key];button.classList.toggle('on',prefs[key]);button.setAttribute('aria-checked',String(prefs[key]));persistPrefs();applyPrefs();};for(const input of $$('[data-pref-range]',main))input.oninput=()=>{const key=input.dataset.prefRange;prefs[key]=Number(input.value);$(`[data-range-value="${key}"]`,main).textContent=input.value;persistPrefs();applyPrefs();};for(const select of $$('[data-pref-select]',main))select.onchange=()=>{prefs[select.dataset.prefSelect]=Number(select.value);persistPrefs();applyPrefs();};
        bindActions(main,{wallpaper:chooseWallpaper,arrange:arrangeDesktop,'cache-wallpapers':async()=>{const notice=toast('Saving the coast collection...','info',null,0);try{for(let index=0;index<wallpaperList.length;index++){await cacheWallpaper(index);$('p',notice).textContent=`Saved ${index+1} of 4 wallpapers.`;}toast('The coast collection is stored locally.');}finally{notice.remove();}},persist:async()=>{if(!navigator.storage?.persist){toast('This browser does not expose persistent-storage requests.','info');return;}const granted=await navigator.storage.persist();toast(granted?'Persistent storage granted. Keep backups for extra safety.':'The browser did not grant persistence. Files still survive refreshes, but can be evicted under storage pressure.',granted?'success':'info');await render();},backup:exportWorkspace,'restore-backup':importBackup,'empty-trash':async()=>{const items=await fs.readdir('/Trash');if(!items.length){toast('Trash is already empty.','info');return;}await deletePaths(items.map(item=>item.path),true);await render();},reset:resetWorkspace,mount:async()=>{await mountFolder();if(win.alive)await render();},'folder-copy':()=>chooseFolderImport('/Documents'),checks:async()=>{const log=$('.diagnostic-log',main);if(!log)return;log.textContent='';const button=$('[data-do="checks"]',main);button.disabled=true;try{await runDiagnostics(true,entry=>{if(log.isConnected){log.textContent+=`[${entry.state}] ${entry.name}${entry.detail?'\n  '+entry.detail:''}\n\n`;log.scrollTop=log.scrollHeight;}});}finally{if(button.isConnected)button.disabled=false;}},'export-report':async()=>{if(await fs.exists('/.system/diagnostics.json'))downloadBlob(await fs.readFile('/.system/diagnostics.json'),'Tideline-system-report.json');else toast('Run the system checks first.','info');}});
      };const diagnosticsComplete=()=>{if(win.alive&&tab==='diagnostics')render().catch(reportError);};document.addEventListener('diagnosticscomplete',diagnosticsComplete);win.onCleanup(()=>document.removeEventListener('diagnosticscomplete',diagnosticsComplete));await render();return win;
    }

    // 10. Seed real files once, then enter the desktop without a simulated boot screen.
    function coastArtwork(number,palette){const [sky,sea,foam]=palette;return `<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="${sky}"/><path d="M0 370C220 290 340 540 570 450S940 265 1400 435V1000H0Z" fill="${foam}"/><path d="M0 430C230 350 375 610 590 510S975 335 1400 495V1000H0Z" fill="${sea}"/><g fill="none" stroke="${sky}" opacity=".4"><path d="M-30 560C200 460 365 710 590 610S975 430 1430 580"/><path d="M-30 610C240 530 365 760 640 660S975 480 1430 630"/><path d="M-30 660C200 560 365 810 640 710S1025 530 1430 680"/><path d="M-30 730C230 620 405 865 690 760S1075 610 1430 730"/></g><circle cx="1090" cy="200" r="58" fill="${foam}"/><text x="100" y="112" fill="${sea}" font-family="monospace" font-size="14" letter-spacing="5">TIDELINE / FIELD STUDY ${number}</text><text x="96" y="250" fill="${sea}" font-family="Georgia,serif" font-size="105" letter-spacing="-5">A quieter coast.</text><text x="100" y="305" fill="${sea}" font-family="sans-serif" font-size="19" opacity=".7">There is a rhythm to making room.</text><text x="100" y="935" fill="${sky}" font-family="monospace" font-size="13" letter-spacing="3">${number} / A SMALL COLLECTION OF OPEN WATER</text><path d="M1190 905h90m-45-45v90" stroke="${sky}" stroke-width="1" opacity=".5"/></svg>`;}
    async function seedWorkspace(){
      if(await fs.exists('/.system/seed-v1.json'))return;
      const seed=async(path,data)=>{if(!await fs.exists(path))await fs.writeFile(path,data);};
      await fs.mkdir('/Desktop/Ideas');await fs.mkdir('/Projects/Coastline');
      await seed('/.system/editor-template.html',starterHTML);
      await seed('/.system/calculator.json','[]');await seed('/.system/trash.json','{}');
      await seed('/Pictures/2 - Quiet water.svg',coastArtwork('02',['#e7e6d7','#69877a','#c6ceba']));
      await seed('/Pictures/10 - After the rain.svg',coastArtwork('10',['#e2e7e1','#526f79','#c4d3cb']));
      await seed('/Projects/Coastline/Readme.md','# Coastline\n\nA place for your next idea.\n\nStart with an HTML file, open it in Code Studio, and make something your own.\n');
      await seed('/Documents/A quiet start.txt','A quiet start\n\nMake a little room.\nWrite down the thought.\nFollow it somewhere.\n\nThis is a real text file in your private filesystem. Edit it, save it, and come back after a refresh.\n');
      await seed('/Pictures/1 - Tidal atlas.svg',coastArtwork('01',['#e9e9db','#355f59','#c4d3bd']));
      await seed('/Documents/Reading list.csv','Title,Author,Status,Notes\nThe Poetics of Space,Gaston Bachelard,To read,"A little perspective on the places we call home"\nA Field Guide to Getting Lost,Rebecca Solnit,Reading,"Wandering, with intention"\nThe Living Mountain,Nan Shepherd,To read,"Look a little closer"\n');
      await seed('/Projects/Hello, world.html',starterHTML);
      await seed('/Documents/Field notes.md','# A little room to think.\n\nThere is something good about a fresh page. No noise, no hurry. Just a place to begin.\n\n## A few things for today\n\n- Give that idea a little attention.\n- Make something without knowing where it will go.\n- Leave room for the unexpected.\n\n> Your space. Your pace.\n\n---\n\nThese are your notes. Switch to **Edit**, write something of your own, and choose **Save**. This document is stored in your real private filesystem.\n');
      await seed('/Desktop/Start here.md','# Welcome to Tideline.\n\nA quiet little desktop. A place for everything that is yours.\n\n## Make yourself at home\n\nClick a desktop icon once to open it. In File Explorer, click to select and double-click to open. On touch devices, tap to open or enable selection mode.\n\nMove icons freely with drag and drop. Hold an icon on a touch screen to move it; hold without moving for its file menu. Use Ctrl or Shift to select more than one file, or drag an empty area to make a selection.\n\n## Bring something with you\n\nDrop files or whole folders onto the desktop. You can also choose **Upload**, or connect a real local folder through Settings. Connected folders use exactly the same filesystem API. Changes to connected files affect your originals.\n\n## A few tools for the journey\n\n- **Code Studio:** HTML, CSS, JavaScript, Markdown, JSON and SVG with a live isolated preview.\n- **Notes:** a simple place to write.\n- **Tables:** editable CSV and TSV, as a table or plain text.\n- **Image Reader:** open an image to read its entire folder in natural numeric order.\n- **Sketchbook:** draw, import images, and save a PNG.\n- **Archive Utility:** native ZIP, TAR and GZIP, plus a WASM engine for other archives.\n- **Virtual Machine:** a real x86 emulator for disk images you provide.\n\n## Your files stay with you\n\nFiles are stored in OPFS when available, with IndexedDB as a persistent fallback. HTTPS or localhost is recommended. Browser storage can still be cleared, so export a backup from Settings regularly.\n\nNative drag-out depends on the browser and operating system. **Export / download** always provides an alternative, including on mobile. Some media codecs and embedded websites depend on browser support.\n\n## Check the little things\n\nSettings includes real filesystem diagnostics and a persistence marker. Run the checks, refresh the page, and run them again to confirm cross-reload retention. Device-specific interactions are listed for manual testing.\n\n---\n\n**Local first. Always yours.**\n');
      await seed('/.system/seed-v1.json',JSON.stringify({version:1,created:Date.now()}));
    }
    function initDesktopSelectionBar(){const bar=el('div','file-context-actions');bar.id='desktop-selection-bar';bar.hidden=true;bar.style.cssText='position:fixed;bottom:101px;left:50%;transform:translateX(-50%);z-index:9300;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 25px #092c3b33;max-width:calc(100vw - 24px);';bar.innerHTML=`<span class="selected-label" style="font-size:9px;padding:0 5px;white-space:nowrap"></span>${buttonHTML('copy','Copy','copy')}${buttonHTML('download','Export','export')}${buttonHTML('trash','Trash','delete')}<button class="icon-btn" data-do="close" title="Clear selection">${icon('close')}</button>`;document.body.append(bar);bindActions(bar,{copy:()=>setClipboard(desktopAPI.paths()),export:()=>exportPaths(desktopAPI.paths()),delete:()=>deletePaths(desktopAPI.paths()),close:()=>desktopAPI.clear()});desktopHolder.onChange=()=>{const paths=desktopAPI.paths();bar.hidden=!paths.length||innerWidth>700||!!activeWindow;$('.selected-label',bar).textContent=paths.length+' selected';};document.addEventListener('windowfocus',()=>desktopHolder.onChange());}
    function installInteractions(){
      $('#search-button').innerHTML=icon('search');$('#notification-button').innerHTML=icon('bell');$('#brand-button').onclick=()=>toggleLauncher();$('#search-button').onclick=()=>toggleLauncher(true);$('#notification-button').onclick=showNotifications;$('#profile-button').onclick=safeRun(()=>launchApp('settings'));$('#sync-button').onclick=safeRun(()=>launchApp('settings','storage'));$('#theme-button').onclick=()=>{prefs.theme=prefs.theme==='light'?'dark':'light';persistPrefs();applyPrefs();};$('#wallpaper-credit').onclick=safeRun(()=>launchApp('settings','appearance'));
      const desktop=$('#desktop');desktop.addEventListener('contextmenu',desktopContext);bindDropTarget(desktop,()=>'/Desktop',{desktop:true});bindRubberband(desktop,desktopAPI);desktop.addEventListener('pointerdown',()=>{if(activeWindow){activeWindow.node.classList.remove('active');activeWindow=null;renderDock();document.dispatchEvent(new CustomEvent('windowfocus',{detail:{id:null}}));}desktopHolder.onChange?.();});
      document.addEventListener('pointerdown',event=>{if(!event.target.closest('#context-menu'))$('#context-menu').hidden=true;if(!event.target.closest('#launcher,#dock,#brand-button,#search-button'))$('#launcher').hidden=true;if(!event.target.closest('#notifications,#notification-button'))$('#notifications').hidden=true;});
      document.addEventListener('keydown',event=>{if($('.modal-shade')||event.defaultPrevented)return;if(document.pointerLockElement)return;const ctrl=event.ctrlKey||event.metaKey,key=event.key.toLowerCase();if(ctrl&&event.code==='Space'){event.preventDefault();toggleLauncher();return;}if(event.key==='Escape'){hidePanels();}if(event.altKey&&event.key==='F4'&&activeWindow){event.preventDefault();activeWindow.close().catch(reportError);return;}if(ctrl&&event.shiftKey&&key==='n'){event.preventDefault();const directory=activeWindow?.app==='files'&&activeWindow.directory!=='Home'?activeWindow.directory:'/Desktop';safeRun(()=>newItem(directory))();return;}const typing=!!event.target.closest('input,textarea,[contenteditable="true"],.CodeMirror');if(activeWindow){if(activeWindow.app==='files'&&typing)return;if(activeWindow.shortcut?.(event))return;}else if(!typing)fileShortcuts(event,desktopAPI,'/Desktop');});
      const refreshDesktop=debounce(()=>{if(fsReady)renderDesktop().catch(reportError);},180);document.addEventListener('fschange',event=>{const paths=event.detail.paths;for(const [key,cached]of dragCache){if(paths.some(path=>key===path||key.startsWith(path+'/')||key.startsWith('bundle:')&&key.includes(path))){dragCache.delete(key);if(cached.url)setTimeout(()=>URL.revokeObjectURL(cached.url),8000);}}if(paths.some(path=>path==='/Desktop'||path.startsWith('/Desktop/')))refreshDesktop();});
      window.addEventListener('resize',debounce(()=>{renderDesktop().catch(reportError);desktopHolder.onChange?.();if(innerWidth>700){const area=$('#window-layer').getBoundingClientRect();for(const win of windows.values()){if(win.maximized)continue;const width=Math.min(win.node.offsetWidth,area.width-20),height=Math.min(win.node.offsetHeight,area.height-16);win.node.style.width=Math.max(300,width)+'px';win.node.style.height=Math.max(220,height)+'px';win.node.style.left=clamp(win.node.offsetLeft,0,Math.max(0,area.width-width))+'px';win.node.style.top=clamp(win.node.offsetTop,0,Math.max(0,area.height-height))+'px';}}},160));
      window.addEventListener('focus',()=>{if(!fsReady)return;refreshDesktop();for(const win of windows.values())if(win.app==='files'&&win.render)win.render().catch(()=>{});});
      window.addEventListener('beforeunload',event=>{if([...windows.values()].some(win=>win.isDirty?.())){event.preventDefault();event.returnValue='';}});
      document.addEventListener('dragover',event=>{if(event.dataTransfer?.types.includes('Files'))event.preventDefault();});document.addEventListener('drop',event=>{if(event.dataTransfer?.types.includes('Files'))event.preventDefault();});
      window.addEventListener('offline',()=>toast('You are offline. Your saved files are still here; CDN-powered tools may be unavailable.','info'));window.addEventListener('online',()=>toast('Connection restored.','info'));
      setInterval(updateClock,1000);initDesktopSelectionBar();
    }
    async function boot(){
      installInteractions();applyPrefs();renderDock();renderDesktop();
      try{
        await fs.init();
        if(!localGet('preferences')){try{const stored=JSON.parse(await fs.readFile('/.system/preferences.json','utf8'));Object.assign(prefs,stored);sanitizePreferences();}catch{}}
        await seedWorkspace();fsReady=true;booting=false;readyResolve();await applyPrefs();await renderDesktop();
        $('#sync-label').textContent=fs.mode==='Temporary session'?'Temporary session':'Saved on this device';
        if(fs.mode!=='OPFS')toast(fs.mode==='IndexedDB'?'This workspace is using persistent IndexedDB storage. Existing files stay on the same backend.':fs.mode==='Limited storage'?'This workspace uses limited localStorage. Export a backup and use HTTPS / localhost for large files.':'Storage is blocked. This is a temporary session; export your work before leaving.','info',null,9000);
        const explorer=await openExplorer('Home');if(innerWidth>700){const area=$('#window-layer').getBoundingClientRect(),width=explorer.node.offsetWidth,height=explorer.node.offsetHeight;explorer.node.style.left=clamp((area.width-width)/2+18,8,Math.max(8,area.width-width-8))+'px';explorer.node.style.top=clamp((area.height-height)/2-4,12,Math.max(12,area.height-height-8))+'px';}
        for(const record of [...fs.pendingMounts]){try{if(record.handle&&await record.handle.queryPermission({mode:'readwrite'})==='granted')await fs.mount(record.handle);}catch{}}
        if(fs.pendingMounts.length)toast(`${fs.pendingMounts.length} connected ${fs.pendingMounts.length===1?'folder needs':'folders need'} permission after this refresh.`,'info',{label:'Reconnect folders',run:()=>openSettings('mounts')},12000);
        if(typeof prefs.wallpaper==='number'){const index=prefs.wallpaper;cacheWallpaper(index).then(async path=>{if(prefs.wallpaper!==index)return;const blob=await fs.readFile(path);if(wallpaperURL)URL.revokeObjectURL(wallpaperURL);wallpaperURL=URL.createObjectURL(blob);wallpaperKey=String(index);document.documentElement.style.setProperty('--wallpaper',`url("${wallpaperURL}")`);}).catch(()=>{});}
        try{const report=JSON.parse(await fs.readFile('/.system/diagnostics.json','utf8'));diagnosticResults=report.results||[];}catch{}
        persistPrefs();
        const check=()=>runDiagnostics(false).then(results=>{if(results.some(result=>result.state==='FAIL'))toast('A filesystem check needs attention. Open Settings > System checks.','error');}).catch(console.warn);
        if(new URLSearchParams(location.search).has('selftest')){await check();await openSettings('diagnostics');}else setTimeout(()=>{if(fsReady&&!diagnosticsRunning){if(window.requestIdleCallback)requestIdleCallback(check,{timeout:5000});else check();}},2500);
      }catch(error){booting=false;fsReady=!!fs.backend;readyResolve();reportError(error);toast('The workspace could not finish opening storage. Open Settings > System checks for details, or use a secure HTTPS / localhost origin.','error',null,0);}
    }
    boot();
