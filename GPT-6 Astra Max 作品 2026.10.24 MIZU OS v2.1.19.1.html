  async function openImageViewer(source){
    source=canonicalPath(source);const paths=await imageSiblings(source);if(!paths.length)throw new Error('文件夹中没有可识别的图片。');
    const w=WM.create({app:'image',title:pathUtil.name(source)+' · 图片查看器',width:800,height:600,badge:'MIZU LENS'});
    let index=Math.max(0,paths.indexOf(source)),url=null,zoom=100,angle=0,ticket=0,image=null,holder=null;
    w.body.innerHTML=`<div class="toolbar">${toolButton('arrowLeft','上一张','prev')}${toolButton('arrowRight','下一张','next')}<span class="separator"></span>${toolButton('minimize','缩小','zoomOut')}<span class="zoom-label tool">适应</span>${toolButton('plus','放大','zoomIn')}${toolButton('maximize','适应窗口','fit')}${toolButton('refresh','旋转','rotate')}<span class="grow"></span>${toolButton('book','连续阅读','manga')}${toolButton('image','设为壁纸','wallpaper')}${toolButton('download','导出','export')}</div><div class="image-stage" style="align-items:flex-start;justify-content:flex-start"></div><div class="editor-status image-info">正在读取图片…</div>`;
    const stage=$('.image-stage',w.body);
    const applyZoom=()=>{
      if(!image?.naturalWidth||!holder)return;
      const rotated=angle%180!==0,displayWidth=rotated?image.naturalHeight:image.naturalWidth,displayHeight=rotated?image.naturalWidth:image.naturalHeight;
      const scale=Math.min(stage.clientWidth/displayWidth,stage.clientHeight/displayHeight,1)*zoom/100;
      Object.assign(holder.style,{width:displayWidth*scale+'px',height:displayHeight*scale+'px'});
      Object.assign(image.style,{width:image.naturalWidth*scale+'px',height:image.naturalHeight*scale+'px',maxWidth:'none',maxHeight:'none',position:'absolute',top:'50%',left:'50%',transform:`translate(-50%,-50%) rotate(${angle}deg)`});
      $('.zoom-label',w.body).textContent=zoom===100?'适应':zoom+'%';
    };
    const load=async()=>{
      const token=++ticket,done=busy(stage);
      try{
        const path=paths[index],blob=await fs.readFile(path),next=URL.createObjectURL(new Blob([blob],{type:mimeFor(path)}));
        if(token!==ticket||w.closed){URL.revokeObjectURL(next);return;}
        if(url)URL.revokeObjectURL(url);url=next;zoom=100;angle=0;
        holder=el('div');holder.style.cssText='position:relative;flex-shrink:0;margin:auto';image=el('img');image.alt=pathUtil.name(path);image.draggable=false;
        image.onload=()=>{if(token!==ticket)return;applyZoom();$('.image-info',w.body).textContent=`${index+1} / ${paths.length} · ${image.naturalWidth} × ${image.naturalHeight} · ${sizeText(blob.size)} · ${pathUtil.name(path)}`;};
        image.onerror=()=>{if(token!==ticket)return;stage.innerHTML=`<div class="empty-state">${icon('image')}<h3>浏览器无法解码此图片</h3><p>文件仍完整保存在磁盘中，可导出后用支持该格式的软件打开。</p></div>`;};

      }finally{done();}
    };
    w.body.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;attempt(async()=>{
      if(action==='prev'||action==='next'){index=(index+(action==='next'?1:-1)+paths.length)%paths.length;await load();}
      if(action==='zoomIn'){zoom=clamp(zoom+25,25,500);applyZoom();}if(action==='zoomOut'){zoom=clamp(zoom-25,25,500);applyZoom();}
      if(action==='fit'){zoom=100;angle=0;applyZoom();}if(action==='rotate'){angle+=90;applyZoom();}
      if(action==='manga')await openManga(paths[index]);if(action==='wallpaper')await setWallpaperFromPath(paths[index]);if(action==='export')await exportPaths([paths[index]]);
    });});

  async function storageReport(){let estimate={};try{estimate=await navigator.storage?.estimate?.()||{};}catch{}const categories={documents:{name:'文档与代码',color:'#b8d8a6',size:0},images:{name:'图片与壁纸',color:'#8faeae',size:0},media:{name:'音频与视频',color:'#b1a1b7',size:0},archives:{name:'压缩包与镜像',color:'#c5b18a',size:0},system:{name:'系统与应用数据',color:'#718c79',size:0},other:{name:'其他文件',color:'#98a29b',size:0}};const volumes=[];for(const [id]of fs.backends){let total=0,count=0;try{for(const item of await fs.walk('/volumes/'+id,{system:true})){if(item.kind!=='file')continue;total+=item.size;count++;const ext=pathUtil.extension(item.path);let category=item.path.includes('/system/')?'system':imageExt.test(ext)?'images':mimeFor(item.path).startsWith('audio/')||mimeFor(item.path).startsWith('video/')?'media':archiveExt.test(item.path)||/^(iso|img|bin|vhd|v86state)$/.test(ext)?'archives':/^(txt|md|markdown|html?|css|js|mjs|json|xml|csv|tsv|pdf|log|ya?ml)$/.test(ext)?'documents':'other';categories[category].size+=item.size;}volumes.push({id,total,count});}catch(error){volumes.push({id,total,count,error:error.message});}}return {usage:estimate.usage??null,quota:estimate.quota??null,categories:Object.values(categories),volumes,persisted:await navigator.storage?.persisted?.().catch(()=>false)||false};}

  function updateClock(){const date=new Date();let hour=date.getHours();const period=hour<12?'上午':'下午';if(prefs.hour12)hour=hour%12||12;const time=String(hour).padStart(2,'0')+':'+String(date.getMinutes()).padStart(2,'0');$('#desktop-time').textContent=time;$('#desktop-date').textContent=date.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+(prefs.hour12?' · '+period:'');$('#top-clock').innerHTML=(prefs.hour12?period+' ':'')+time+` <span class="top-clock-date" style="opacity:.65;margin-left:7px">${date.getMonth()+1}月${date.getDate()}日</span>`;$('#greeting').textContent=date.getHours()<6?'夜深了，给思绪一个安静的角落。':date.getHours()<12?'早上好，让灵感慢慢醒来。':date.getHours()<18?'下午好，留一点时间给自己。':'晚上好，让今天慢慢沉淀。';}
  async function toggleFullscreen(){if(document.fullscreenElement)await document.exitFullscreen();else{if(!document.documentElement.requestFullscreen)throw new Error('此浏览器不支持页面全屏，请使用设备的全屏浏览方式。');await document.documentElement.requestFullscreen();}closePopups();}
  function desktopMenu(x,y){contextMenu([{label:'刷新桌面',icon:'refresh',action:()=>renderDesktop()},{divider:true},{label:'新建文件夹',icon:'folder',action:()=>newItem('/desktop')},{label:'新建文本文件',icon:'note',action:()=>newItem('/desktop','text')},{label:'新建 HTML 网页',icon:'code',action:()=>newItem('/desktop','html')},{label:'粘贴',icon:'paste',shortcut:'Ctrl+V',disabled:!fileClipboard.paths.length,action:()=>pasteFiles('/desktop')},{divider:true},{label:'导入文件',icon:'upload',action:()=>importFiles('/desktop')},{label:'导入文件夹',icon:'folder',action:()=>importFiles('/desktop',true)},{label:'挂载本地文件夹',icon:'mount',action:mountFolder},{divider:true},{label:'切换全屏',icon:'fullscreen',action:toggleFullscreen},{label:'个性化桌面',icon:'paint',action:()=>openSettings('appearance')}],x,y);}
  // 16. Immediate shell, then actual storage initialization and seeded documents.
  async function boot(){
    updateClock();setInterval(()=>{updateClock();const clock=$('.calendar-time');if(clock)clock.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:prefs.hour12});},1000);
    $('#global-search-button').innerHTML=icon('search');$('#quick-settings-button').innerHTML=icon('settings');
    $('#peek-button').innerHTML=icon('columns')+'<span>留白，也是空间</span>';
    $('#global-search-button').onclick=()=>toggleLauncher(true);
    $('#quick-settings-button').onclick=()=>{closePopups();openSettings();};
    $('#clock-button').onclick=toggleCalendar;$('#brand-button').onclick=()=>toggleLauncher();
    $('#peek-button').onpointerenter=()=>$('#window-layer').classList.add('peeking');
    $('#peek-button').onpointerleave=()=>$('#window-layer').classList.remove('peeking');
    $('#peek-button').onclick=()=>{$('#window-layer').classList.remove('peeking');WM.showDesktop();};
    WM.drawDock();renderDesktop();if(prefs.wallpaper!=='custom')applyWallpaper();

    const desktop=$('#desktop');
    desktop.oncontextmenu=event=>{if(event.target.closest('.desktop-icon'))return;event.preventDefault();desktopMenu(event.clientX,event.clientY);};
    desktop.addEventListener('click',event=>{if(!event.target.closest('.desktop-icon')&&Date.now()>Number(desktop.dataset.suppressClick||0)){updateDesktopSelection(new Set());desktop.focus({preventScroll:true});}});
    makeSelection(desktop,{selector:'.desktop-icon',onChange:updateDesktopSelection,getSelected:()=>desktopState.selected});
    bindDropZone(desktop,target=>target.closest('[data-drop-path]')?.dataset.dropPath||'/desktop',desktopDrop);
    let twoFingerY=null;
    desktop.addEventListener('touchstart',event=>{if(event.touches.length===2)twoFingerY=(event.touches[0].clientY+event.touches[1].clientY)/2;},{passive:true});
    desktop.addEventListener('touchmove',event=>{if(event.touches.length===2&&twoFingerY!==null){event.preventDefault();const y=(event.touches[0].clientY+event.touches[1].clientY)/2;desktop.scrollTop+=twoFingerY-y;twoFingerY=y;}},{passive:false});
    desktop.addEventListener('touchend',()=>{twoFingerY=null;},{passive:true});
    const refreshDesktop=debounce(event=>{if(!event.detail.path.includes('/system/')&&(event.detail.path.includes('/desktop')||['backend','mount','unmount'].includes(event.detail.operation)))renderDesktop();},160);
    fs.addEventListener('change',refreshDesktop);
    settingsEvents.addEventListener('change',()=>{updateClock();WM.drawDock();});

    document.addEventListener('keydown',event=>{
      const command=event.ctrlKey||event.metaKey,key=event.key.toLowerCase();
      if(command&&key==='k'){event.preventDefault();toggleLauncher(true);}
      if(event.key==='Escape'){closePopups();$('#window-layer').classList.remove('peeking');const reader=$('.reader-fullscreen .reader-exit');if(reader&&!document.fullscreenElement)reader.click();}
      if(command&&event.altKey&&key==='d'){event.preventDefault();WM.showDesktop();}
      if(event.altKey&&event.key==='F4'&&WM.active){event.preventDefault();WM.close(WM.windows.get(WM.active));}
      if(event.target.closest('input,textarea,[contenteditable=true],.CodeMirror'))return;
      if(!event.target.closest('#desktop'))return;
      const paths=desktopState.items.filter(item=>desktopState.selected.has(item.key)&&item.path).map(item=>item.path);
      if(command&&key==='a'){event.preventDefault();updateDesktopSelection(new Set(desktopState.items.map(item=>item.key)));}
      if(command&&(key==='c'||key==='x')){event.preventDefault();copyFilesToClipboard(paths,key==='x');}
      if(command&&key==='v'){event.preventDefault();attempt(()=>pasteFiles('/desktop'));}
      if(event.key==='Delete')attempt(()=>deleteItems(paths));
      if(event.key==='F2'&&paths.length===1){event.preventDefault();attempt(()=>renameItem(paths[0]));}
    });

    try{
      await fs.init();
      let hasPreferences=false;try{hasPreferences=!!localStorage.getItem('mizu.preferences');}catch{}
      if(!hasPreferences&&await fs.exists('/system/preferences.json')){
        try{const backup=JSON.parse(await fs.readFile('/system/preferences.json','utf8'));Object.assign(prefs,backup);if(fs.backends.has(prefs.backend))fs.defaultBackend=fs.backends.get(prefs.backend);else prefs.backend=fs.defaultBackend.id;applyPreferences();}catch(error){console.warn('Preferences recovery failed',error);}
      }
      await seedBackend();
      for(const [backend]of fs.backends)if(backend!==prefs.backend){
        for(const folder of ['desktop','documents','pictures','downloads','music','videos','system'])await fs.mkdir('/volumes/'+backend+'/'+folder);
      }
      await renderDesktop();await applyWallpaper();WM.drawDock();
      if(innerWidth>760&&prefs.openFilesOnStart!==false)openExplorer('/',{initial:true});
      if(!fs.backends.has('opfs'))toast('当前环境无法使用 OPFS，已使用 IndexedDB 持久化存储。','info',6500);
      if(fs.pendingMounts.length)toast('有 '+fs.pendingMounts.length+' 个本地文件夹需要重新授权。请打开设置中的「本地挂载」。','info',8000);
      if(await fs.exists('/system/diagnostics-latest.json')){
        try{lastDiagnostics=JSON.parse(await fs.readFile('/system/diagnostics-latest.json','utf8'));}catch{}
      }
      savePreferences();document.documentElement.dataset.ready='true';window.dispatchEvent(new Event('mizu-ready'));
      if(new URLSearchParams(location.search).has('selftest')){
        const report=await runSelfTests(new URLSearchParams(location.search).get('selftest')==='full');
        document.documentElement.dataset.selftest=report.results.some(result=>result.status==='失败')?'failed':report.pending?.length?'pending':'passed';
        openSettings('about');
      }
    }catch(error){
      toast(error.message,'error',0);
      const window=WM.create({app:'settings',title:'无法连接持久化存储',width:560,height:340});
      window.body.innerHTML=`<div class="empty-state">${icon('warning')}<h3>请给文件一个安全的家。</h3><p>${esc(error.message)}<br>推荐通过 HTTPS 或 localhost 打开此 HTML 文件。<br>系统不会伪装成内存磁盘或虚假显示保存成功。</p><button class="btn primary reload">重新连接</button></div>`;
      $('.reload',window.body).onclick=()=>location.reload();
    }
  }
  window.addEventListener('unhandledrejection',event=>{if(event.reason?.name==='AbortError'){event.preventDefault();return;}event.preventDefault();console.error(event.reason);toast(event.reason?.message||'操作未完成，请重试。原始文件不会被自动清除。','error',6000);});
  window.MIZU={version:'01.0',fs,open:launch,diagnostics:runSelfTests};
  boot();
  </script>
</body>
