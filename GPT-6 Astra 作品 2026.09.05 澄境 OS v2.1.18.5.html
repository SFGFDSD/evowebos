      '/文档/澄境使用指南.md':'# 欢迎来到澄境 OS\n\n一个单文件、零后端、中文的浏览器桌面。\n\n## 文件真正保存在这里\n\n优先使用 OPFS 保存文件。不可用时按顺序降级到 IndexedDB、小容量 localStorage 应急存储，最后才使用临时会话内存。当前后端可在设置中查看。\n\n请使用 HTTPS 或 localhost。浏览器隐私模式、清除站点数据和存储配额限制可能影响持久化。定期导出重要文件。\n\n## 自由整理你的空间\n\n桌面图标单击打开。鼠标拖动图标可调整位置；Ctrl / Shift 配合点击可多选，空白处拖动可框选。触摸设备长按图标后拖动，使用多选模式进行框选。\n\n文件夹可拖入真实文件与整个目录。拖出浏览器依赖浏览器对 DownloadURL 的支持；不支持时使用导出按钮。\n\n## 窗口也懂你的习惯\n\n拖动标题栏移动窗口，拖动八个边缘调整大小。把窗口推到左右边缘触发 Aero Snap，顶部可最大化。悬停任务栏最右侧使用 Aero Peek，点击显示桌面。\n\n## 让工具顺手起来\n\nHTML 文件可以预览网页或编辑源码。代码编辑器支持实时预览、查找替换、格式化、多语言与折叠。Ctrl+S 保存、Ctrl+Enter 运行、Ctrl+Shift+F 格式化。\n\nCSV / TSV 支持可编辑表格与原始文本。打开图片会将同目录图片按自然数字顺序连续排列。画板可保存 PNG。\n\nZIP、TAR、GZIP 可原生处理，更多格式通过 7z-wasm 加载。解压时拒绝路径穿越与超大归档。\n\n## 挂载真实文件夹\n\n在文件管理器或设置中挂载本地文件夹。所有操作共用 fs API，修改直接影响真实文件。刷新后可在设置中重新连接。\n\n## 虚拟机\n\n自行导入合法的 32 位 x86 镜像，选择内存后启动。ISO 对应光驱，IMG / FDA / BIN 对应软盘，其他对应硬盘。点击锁定鼠标，Esc 释放。磁盘修改和快照需要手动保存。\n\n## 安全与兼容性\n\n本地网页预览使用嵌套沙箱隔离脚本。新标签页打开代码不具有同样的隔离保证，只打开可信代码。浏览器可能拒绝嵌入外部网页。音视频和图片的实际解码能力由浏览器决定。\n\nCDN 不可用时，代码编辑器降级为纯文本编辑；原生应用和已有本地文件继续可用。设置中的真实自检会执行读写、归档、路由与格式解析测试。\n',
      '/文档/小小计划.csv':'事项,备注,状态\n整理灵感文件夹,给想法一个安放的地方,已完成\n写一封给自己的信,慢下来也很好,进行中\n画一片心里的风景,试试桌面上的画板,待开始\n',
      '/文档/灵感花园.html':editorTemplate,
      '/图片/01 - 远山.svg':sceneSVG(0),
      '/图片/02 - 晴空.svg':sceneSVG(1)
    };
    for(const [path,content]of Object.entries(initialFiles))if(!await fs.exists(path))await fs.writeFile(path,content);
    if(!prefs.recent.length)prefs.recent=['/文档/写给你的第一封信.txt','/文档/澄境使用指南.md','/文档/小小计划.csv','/文档/灵感花园.html','/图片/01 - 远山.svg'];
    await fs.writeFile('/.system/initialized.json',JSON.stringify({version:1,created:Date.now()}));persistPrefs();
  }
  async function cacheWallpapers(){
    for(let i=0;i<WALLPAPERS.length;i++){if(bootAbort.signal.aborted)return;const path='/.system/wallpapers/'+i+'.jpg';try{if(!await fs.exists(path)){const response=await fetch(WALLPAPERS[i].url,{mode:'cors',signal:bootAbort.signal});if(!response.ok)continue;const blob=await response.blob();if(!blob.type.startsWith('image/'))continue;await fs.writeFile(path,blob);if(i===0&&!await fs.exists('/图片/山湖来信.jpg'))await fs.writeFile('/图片/山湖来信.jpg',blob);if(prefs.wallpaper===i&&!prefs.customWallpaper)await showWallpaper();}}catch(e){if(e.name!=='AbortError')console.warn('Wallpaper cache:',e);}}
  }
  async function openCalendar(){await fsReady;const win=WM.create({title:'日历与随记',type:'calendar',icon:'note',width:375,height:515,minWidth:310,minHeight:390});let date=new Date(),selected=new Date().toLocaleDateString('en-CA'),notes={};try{notes=JSON.parse(await fs.readFile('/.system/calendar.json','utf8'));}catch{}
    win.body.innerHTML=`<div class="toolbar"><button class="icon-btn cal-prev" aria-label="上个月">${I('left',15)}</button><strong class="cal-month" style="font-size:14px;font-weight:500;flex:1;text-align:center"></strong><button class="icon-btn cal-next" aria-label="下个月">${I('right',15)}</button></div><div class="calendar-content" style="padding:20px;flex:1;overflow:auto"><div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--muted);margin-bottom:10px">${['一','二','三','四','五','六','日'].map(n=>'<span>'+n+'</span>').join('')}</div><div class="cal-days" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div><div style="margin-top:20px"><label class="cal-label small muted"></label><textarea class="field cal-note" style="width:100%;height:100px;resize:none;margin-top:9px;font-size:12px;line-height:1.8" placeholder="给这一天，留下一点记忆。" aria-label="当日随记"></textarea></div></div><div class="app-status cal-status">随记保存在当前设备</div>`;
    const key=(year,month,day)=>year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');selected=key(date.getFullYear(),date.getMonth(),date.getDate());function draw(){$('.cal-month',win.body).textContent=date.getFullYear()+' 年 '+(date.getMonth()+1)+' 月';const y=date.getFullYear(),m=date.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();$('.cal-days',win.body).innerHTML='<span></span>'.repeat(first)+Array.from({length:count},(_,i)=>{const k=key(y,m,i+1),today=new Date();return `<button data-day="${k}" style="height:34px;border-radius:5px;font-size:12px;${k===selected?'background:var(--accent);color:#fff;':k===key(today.getFullYear(),today.getMonth(),today.getDate())?'background:var(--soft);color:var(--accent);':''}">${i+1}${notes[k]?'<i style="display:block;width:3px;height:3px;background:currentColor;border-radius:50%;margin:0 auto"></i>':''}</button>`;}).join('');$$('[data-day]',win.body).forEach(b=>b.onclick=()=>{selected=b.dataset.day;draw();});$('.cal-label',win.body).textContent=selected+' · 随记';$('.cal-note',win.body).value=notes[selected]||'';}
    $('.cal-prev',win.body).onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()-1,1);draw();};$('.cal-next',win.body).onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()+1,1);draw();};const saveNote=debounce(async()=>{try{await fs.writeFile('/.system/calendar.json',JSON.stringify(notes));if(!win.cleaned)$('.cal-status',win.body).textContent='已自动保存';}catch(e){report(e);}},350);$('.cal-note',win.body).oninput=e=>{notes[selected]=e.target.value;$('.cal-status',win.body).textContent='正在保存...';saveNote();};win.onClose.push(async()=>{saveNote.cancel();await fs.writeFile('/.system/calendar.json',JSON.stringify(notes));});draw();return win;
  }
  async function openNotifications(){await fsReady;let previous=[];try{previous=JSON.parse(await fs.readFile('/.system/notifications.json','utf8'));}catch{}const messages=[...notifyLog,...previous].filter((m,i,a)=>a.findIndex(n=>n.time===m.time&&n.message===m.message)===i).sort((a,b)=>b.time-a.time).slice(0,40);await fs.writeFile('/.system/notifications.json',JSON.stringify(messages));const win=WM.create({title:'通知中心',type:'notifications',icon:'logo',width:390,height:500});win.body.innerHTML=`<div class="toolbar"><span class="small">这个空间里的最近动态</span><span class="spacer"></span><button class="btn clear-notifications">全部清除</button></div><div class="notification-list scroll" style="padding:7px 22px;flex:1">${messages.length?messages.map(m=>`<div style="display:flex;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)">${I(m.error?'info':'check',18)}<div><p style="font-size:12px;line-height:1.8;margin:0 0 6px">${escapeHTML(m.message)}</p><small class="muted">${dateText(m.time)}</small></div></div>`).join(''):`<div class="empty-state">${I('bell',32)}<h3>此刻，一切安静。</h3><p>文件操作与系统提示会显示在这里。</p></div>`}</div>`;$('.clear-notifications',win.body).onclick=safely(async()=>{notifyLog.length=0;await fs.writeFile('/.system/notifications.json','[]');$('.notification-list',win.body).innerHTML='<div class="empty-state">所有通知已清除</div>';});return win;}
  function tickClock(){const now=new Date();$('#clock-time').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#clock-date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});$('#desktop-date').textContent=now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#tray-clock').setAttribute('aria-label',now.toLocaleString('zh-CN')+'，打开日历');}
  tickClock();setInterval(tickClock,1000);$('#tray-clock').onclick=safely(openCalendar);$('#tray-connection').innerHTML=I('wifi',17);$('#tray-volume').innerHTML=I('volume',16);$('#tray-notifications').innerHTML=I('bell',16);$('#tray-connection').onclick=()=>openSettings('storage');$('#tray-volume').onclick=()=>openSettings('apps');$('#tray-notifications').onclick=safely(openNotifications);
  addEventListener('offline',()=>toast('网络已断开。本地文件与原生应用仍然可用。'));addEventListener('online',()=>toast('网络已连接，可以继续加载扩展应用。'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(prefs.theme==='auto')applyPrefs();});
  const desktopRefresh=debounce(()=>renderDesktop().catch(report),170);
  fs.addEventListener('change',e=>{if(e.detail.path==='/桌面'||e.detail.parent==='/桌面')desktopRefresh();for(const [key,entry]of dragCache){if(key.split('\n').some(p=>p===e.detail.path||p.startsWith(e.detail.path+'/')||e.detail.path.startsWith(p+'/'))){dragCache.delete(key);Promise.resolve(entry.promise).then(()=>releaseDragEntry(entry));}}});
  let broadcast=null;try{broadcast=new BroadcastChannel('chengjing-files');fs.addEventListener('change',e=>broadcast.postMessage(e.detail));broadcast.onmessage=e=>{if(!e.data?.path)return;desktopRefresh();WM.windows.forEach(w=>w.explorer?.refresh());};}catch{}
  $('#desktop').addEventListener('pointerdown',e=>{if(e.button!==0)return;WM.active=null;WM.windows.forEach(w=>w.el.classList.remove('active'));renderTasks();if(!e.target.closest('.desktop-item'))selectDesktop([]);});
  document.addEventListener('keydown',e=>{
    if($('#dialog').open||e.defaultPrevented)return;const mod=e.ctrlKey||e.metaKey,key=e.key.toLowerCase(),win=WM.windows.get(WM.active);
    if((mod&&e.altKey&&key==='d')||(e.metaKey&&key==='d')){e.preventDefault();WM.showDesktop();return;}if((mod&&key===' ')||e.key==='Meta'&&e.target===document.body){e.preventDefault();toggleLauncher();return;}if(e.altKey&&e.key==='F4'){e.preventDefault();if(win)WM.close(win);return;}
    if(e.key==='Escape'){hideLauncher();$('#context-menu').hidden=true;$('#task-preview').hidden=true;document.body.classList.remove('peeking');if(win?.el.classList.contains('manga-fullscreen')){if(document.fullscreenElement)document.exitFullscreen().catch(report);win.el.classList.remove('manga-fullscreen');}return;}
    if(e.target.closest('input,textarea,.CodeMirror,[contenteditable]'))return;
    if(e.key==='F5'){e.preventDefault();if(win?.explorer)win.explorer.refresh();else renderDesktop().catch(report);return;}
    const inFiles=e.target.closest('#desktop')||win?.type==='explorer';if(!inFiles)return;
    if(mod&&key==='a'&&e.target.closest('#desktop')){e.preventDefault();selectDesktop(desktopItems.keys());return;}
    const paths=lastSelection?.getPaths?.()||[];if(mod&&key==='c'){e.preventDefault();copyFiles(paths);}if(mod&&key==='x'){e.preventDefault();copyFiles(paths,true);}if(mod&&key==='v'){e.preventDefault();pasteFiles(lastSelection?.dir||'/桌面').catch(report);}if(e.key==='Delete'){e.preventDefault();trashFiles(paths).catch(report);}if(e.key==='F2'&&paths.length===1){e.preventDefault();renameFile(paths[0]).catch(report);}
  });
  addEventListener('beforeunload',e=>{persistPrefs.cancel();try{localStorage.setItem('cj-preferences',JSON.stringify(prefs));}catch{}if([...WM.windows.values()].some(w=>w.isDirty?.()||w.type==='vm')){e.preventDefault();e.returnValue='';}});
  async function boot(){
    try{await fsReady;try{let local=null;try{local=localStorage.getItem('cj-preferences');}catch{}if(!local&&await fs.exists('/.system/preferences.json')){prefs={...defaults,...JSON.parse(await fs.readFile('/.system/preferences.json','utf8'))};applyPrefs();}}catch(e){console.warn('Preferences:',e);}await seedFilesystem();await renderDesktop();showWallpaper().catch(report);renderTasks();
      const wide=innerWidth>=1100,w=Math.min(960,Math.max(760,innerWidth*.63)),h=Math.min(668,Math.max(495,innerHeight*.75));
      const explorer=await openExplorer('/',wide?{x:Math.round(innerWidth*.125),y:Math.round(Math.max(104,innerHeight*.135)),width:w,height:h}:{});
      if(wide&&prefs.welcome)await openWelcome({x:Math.min(innerWidth-355,Math.round(innerWidth*.72)),y:Math.round(Math.max(205,innerHeight*.285)),width:330,height:400});
      if(fs.mode!=='OPFS')setTimeout(()=>toast(fs.mode==='会话内存'?'无法使用持久化存储，文件将在关闭页面后丢失。请及时导出。':'当前使用 '+fs.mode+' 降级存储。建议通过 HTTPS 或 localhost 在现代浏览器中使用。',true,{label:'查看存储',run:()=>openSettings('storage')}),800);
      if(fs.savedMounts.length)setTimeout(()=>toast('之前挂载的 '+fs.savedMounts.length+' 个文件夹需要重新连接。',false,{label:'重新连接',run:()=>openSettings('mounts')}),1500);
      cacheWallpapers().catch(console.warn);
      if(new URLSearchParams(location.search).get('selftest')==='1'){await openSettings('about');$('.run-diagnostics')?.click();}
    }catch(e){console.error('Boot error:',e);toast('文件系统初始化失败：'+e.message+'。请检查浏览器存储权限后刷新。',true,{label:'重试',run:()=>location.reload()});renderTasks();}
  }
  addEventListener('unhandledrejection',event=>{event.preventDefault();report(event.reason||Error('操作未完成，请重试'));});
  boot();
