Apps.viewer = {
  name: '图片查看', icon: APPICON.viewer,
  async launch(path = null) {
    const win = WM.create({ app: 'viewer', title: path ? basename(path) : '图片查看', icon: this.icon, w: 760, h: 560 });
    win.body.innerHTML = `
      <div class="app-bar">
        <button class="btn iv-out">−</button>
        <button class="btn iv-in">+</button>
        <button class="btn iv-fit">适应窗口</button>
        <button class="btn iv-100">100%</button>
        <span class="iv-z mono" style="font-size:11px;color:var(--dim)"></span>
        <span style="flex:1"></span>
        <button class="btn iv-dl">${UI.download}导出</button>
      </div>
      <div class="iv-stage"><div class="fx-empty">${UI.img}<div>未选择图片 — 从文件管理器中双击图片打开</div></div></div>
      <div class="app-status"><span class="iv-path"></span><span class="iv-dim"></span></div>`;
    const Q = s => win.body.querySelector(s);
    const stage = Q('.iv-stage');
    let img = null, scale = 1, tx = 0, ty = 0, url = null;
    const apply = () => { if (img) { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; Q('.iv-z').textContent = Math.round(scale * 100) + '%'; } };
    const fit = () => {
      if (!img || !img.naturalWidth) return;
      scale = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight, 1) * 0.96;
      tx = ty = 0; apply();
    };
    if (path) {
      try {
        url = await fs.blobURL(path);
        img = new Image(); img.src = url; img.draggable = false;
        img.onload = () => { stage.innerHTML = ''; stage.appendChild(img); fit(); Q('.iv-dim').textContent = `${img.naturalWidth} × ${img.naturalHeight}`; };
        Q('.iv-path').textContent = path;
        const st = await fs.stat(path);
        Q('.iv-path').textContent = `${path} · ${fmtSize(st.size)}`;
      } catch (e) { toast(e.message, 'err'); }
    }
    stage.addEventListener('wheel', e => { e.preventDefault(); scale = Math.max(.05, Math.min(20, scale * (e.deltaY < 0 ? 1.15 : 0.87))); apply(); }, { passive: false });
    // 拖移 + 双指缩放
    let pts = new Map(), lastDist = 0;
    stage.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
      if (pts.size === 1) { tx += e.clientX - prev.clientX; ty += e.clientY - prev.clientY; apply(); }
      else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (lastDist) { scale = Math.max(.05, Math.min(20, scale * d / lastDist)); apply(); }
        lastDist = d;
      }
    });
    const lift = e => { pts.delete(e.pointerId); lastDist = 0; };
    stage.addEventListener('pointerup', lift); stage.addEventListener('pointercancel', lift);
    Q('.iv-in').onclick = () => { scale = Math.min(20, scale * 1.25); apply(); };
    Q('.iv-out').onclick = () => { scale = Math.max(.05, scale * .8); apply(); };
    Q('.iv-fit').onclick = fit;
    Q('.iv-100').onclick = () => { scale = 1; tx = ty = 0; apply(); };
    Q('.iv-dl').onclick = () => path && exportPath(path);
    win.onClose = () => { if (url) setTimeout(() => URL.revokeObjectURL(url), 1000); };
    return win;
  }
};

/* ---------------- 计算器 ---------------- */
Apps.calc = {
  name: '计算器', icon: APPICON.calc,
  launch() {
    const win = WM.create({ app: 'calc', title: '计算器', icon: this.icon, w: 320, h: 470, single: true });
    win.body.innerHTML = `
      <div class="calc">
        <div class="calc-d"><div class="cd-expr"></div><div class="cd-val">0</div></div>
        <div class="calc-g">
          ${['C','( )','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(b => {
            const cls = b === '=' ? 'eq' : ['÷','×','−','+'].includes(b) ? 'op' : ['C','( )','%','±'].includes(b) ? 'fn' : '';
            return `<button class="calc-b ${cls}" data-b="${b}">${b}</button>`;
          }).join('')}
        </div>
      </div>`;
    // 修正 = 按钮跨行布局
    const eq = win.body.querySelector('.eq'); eq.style.gridRow = 'auto';
    let expr = '';
    const exprEl = win.body.querySelector('.cd-expr'), valEl = win.body.querySelector('.cd-val');
    const evalExpr = s => {
      const js = s.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-');
      if (!/^[0-9+\-*/().%\s]*$/.test(js) || !js.trim()) return null;
      try { const v = Function('"use strict";return(' + js.replace(/%/g, '/100') + ')')(); return Number.isFinite(v) ? v : null; } catch { return null; }
    };
    const update = () => {
      exprEl.textContent = expr;
      const v = evalExpr(expr);
      valEl.textContent = v == null ? (expr ? '…' : '0') : String(Math.round(v * 1e10) / 1e10);
    };
    win.body.querySelectorAll('.calc-b').forEach(b => b.onclick = () => {
      const k = b.dataset.b;
      if (k === 'C') expr = '';
      else if (k === '=') { const v = evalExpr(expr); if (v != null) expr = String(Math.round(v * 1e10) / 1e10); }
      else if (k === '( )') { const o = (expr.match(/\(/g) || []).length, c = (expr.match(/\)/g) || []).length; expr += o > c ? ')' : '('; }
      else if (k === '±') { const v = evalExpr(expr); if (v != null) expr = String(-v); }
      else expr += k;
      update();
    });
    win.body.addEventListener('keydown', e => {
      if (/[0-9+\-*/().%]/.test(e.key)) { expr += e.key.replace('*', '×').replace('/', '÷').replace('-', '−'); update(); }
      else if (e.key === 'Enter') { const v = evalExpr(expr); if (v != null) { expr = String(v); update(); } }
      else if (e.key === 'Backspace') { expr = expr.slice(0, -1); update(); }
      else if (e.key === 'Escape') { expr = ''; update(); }
    });
    win.body.tabIndex = 0; win.body.focus();
    return win;
  }
};

Apps.paint = {
  name: '画板', icon: APPICON.paint,
  launch() {
    const win = WM.create({ app: 'paint', title: '画板', icon: this.icon, w: 780, h: 560 });
    const colors = ['#e8e2d0','#ff9e64','#e46876','#e6c384','#7aa89f','#7e9cd8','#957fb8','#16161d'];
    win.body.innerHTML = `
      <div class="app-bar">
        ${colors.map((c, i) => `<div class="pt-sw ${i === 1 ? 'on' : ''}" data-c="${c}" style="background:${c}"></div>`).join('')}
        <input type="range" min="1" max="48" value="5" class="pt-size" style="width:90px">
        <span class="pt-sz mono" style="font-size:11px;color:var(--dim)">5px</span>
        <button class="btn pt-eraser">橡皮</button>
        <button class="btn pt-clear">清空</button>
        <span style="flex:1"></span>
        <button class="btn pri pt-save">${UI.save}保存到 /Pictures</button>
      </div>
      <div class="pt-canvas-wrap"><canvas></canvas></div>`;
    const Q = s => win.body.querySelector(s);
    const wrap = Q('.pt-canvas-wrap'), cv = Q('canvas'), ctx = cv.getContext('2d');
    let color = colors[1], size = 5, eraser = false, drawing = false, last = null;
    function resize() {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w <= 0 || (cv.width === w && cv.height === h)) return;
      const old = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
      cv.width = w; cv.height = h;
      ctx.fillStyle = '#1f1f28'; ctx.fillRect(0, 0, w, h);
      if (old) ctx.putImageData(old, 0, 0);
      ctx.lineCap = ctx.lineJoin = 'round';
    }
    new ResizeObserver(resize).observe(wrap);
    setTimeout(resize, 60);
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = pos(e);
      ctx.strokeStyle = eraser ? '#1f1f28' : color;
      ctx.lineWidth = eraser ? size * 2.5 : size;
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    });
    cv.addEventListener('pointerup', () => drawing = false);
    win.body.querySelectorAll('.pt-sw').forEach(sw => sw.onclick = () => {
      win.body.querySelectorAll('.pt-sw').forEach(s => s.classList.remove('on'));
      sw.classList.add('on'); color = sw.dataset.c; eraser = false; Q('.pt-eraser').classList.remove('pri');
    });
    Q('.pt-size').oninput = e => { size = +e.target.value; Q('.pt-sz').textContent = size + 'px'; };
    Q('.pt-eraser').onclick = () => { eraser = !eraser; Q('.pt-eraser').classList.toggle('pri', eraser); };
    Q('.pt-clear').onclick = () => { ctx.fillStyle = '#1f1f28'; ctx.fillRect(0, 0, cv.width, cv.height); };
    Q('.pt-save').onclick = () => cv.toBlob(async blob => {
      const name = await fs.uniqueName('/Pictures', '绘画-' + new Date().toISOString().slice(0, 10) + '.png');
      await fs.writeFile('/Pictures/' + name, blob);
      toast('已保存 /Pictures/' + name);
      bus.emit('fs-changed', '/Pictures');
    }, 'image/png');
    return win;
  }
};

        };
        // 占用统计
        const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : { usage: 0, quota: 0 };
        const colors = ['#ff9e64','#7aa89f','#7e9cd8','#e46876','#e6c384','#957fb8','#8e8a9e'];
        let tops = [];
        try {
          const ents = (await fs.rootBackend.readdir('/'));
          for (const e of ents) tops.push({ name: '/' + e.name, size: await fs.dirSize('/' + e.name) });
        } catch {}
        tops.sort((a, b) => b.size - a.size);
        const totalUsed = Math.max(est.usage || 0, tops.reduce((a, b) => a + b.size, 0), 1);
        const meter = main.querySelector('#st-meter'), legend = main.querySelector('#st-legend'), rows = main.querySelector('#st-rows');
        main.querySelector('.st-sub').innerHTML = `后端: ${fs.backendType === 'opfs' ? 'OPFS（持久化私有文件系统）' : 'IndexedDB 降级模式'} · 已用 <b style="color:var(--ember)">${fmtSize(est.usage)}</b> / 配额 ${fmtSize(est.quota)}（占 ${est.quota ? (est.usage / est.quota * 100).toFixed(2) : '?'}%）`;
        tops.forEach((t, i) => {
          const pct = Math.max(0.5, t.size / totalUsed * 100);
          const bar = elBuild('i'); bar.style.cssText = `width:${pct}%;background:${colors[i % colors.length]}`;
          if (t.size > 0) meter.appendChild(bar);
          legend.appendChild(elBuild('div', 'lg', `<i style="background:${colors[i % colors.length]}"></i>${esc(t.name)} · ${fmtSize(t.size)}`));
          rows.appendChild(elBuild('div', '', `<span style="color:var(--ink)">${esc(t.name)}</span> — ${fmtSize(t.size)}`));
        });
        if (est.quota) {
          const free = elBuild('i'); free.style.cssText = `flex:1;background:#26262f`; meter.appendChild(free);
        }
      } else {
        main.innerHTML = `<div class="st-h1">EMBER · OS</div><div class="st-sub">单文件 Web 操作系统 — 运行于浏览器沙箱</div>
          <div class="st-sec mono" style="font-size:12px;line-height:2.2;color:var(--dim)">
            存储后端 · <b style="color:var(--ember)">${fs.backendType.toUpperCase()}</b><br>
            File System Access API · ${window.showDirectoryPicker ? '<b style="color:var(--teal)">支持本地挂载</b>' : '不支持'}<br>
            DecompressionStream · ${window.DecompressionStream ? '<b style="color:var(--teal)">可用 (GZ/TGZ)</b>' : '不可用'}<br>
            JSZip · ${window.JSZip ? '<b style="color:var(--teal)">已加载</b>' : '未加载（离线）'}<br>
            V86 · ${typeof V86 !== 'undefined' ? '<b style="color:var(--teal)">已加载</b>' : '加载中 / 未加载'}<br>
            已挂载本地文件夹 · ${fs.mounts.length} 个
          </div>`;
      }
    }
    show(section);
    return win;
  }
};

async function restoreMounts() {
  let saved = [];
  try { saved = await mountStore.list(); } catch { return; }
  if (!saved.length) return;
  toast(`检测到 ${saved.length} 个之前挂载的本地文件夹`, 'ok', '重新挂载', async () => {
    let okCount = 0;
    for (const { handle } of saved) {
      try {
        let perm = await handle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          await fs.mkdir('/mnt/local').catch(() => {});
          let name = handle.name, prefix = '/mnt/local/' + name, i = 2;
          while (fs.mounts.some(m => m.prefix === prefix)) prefix = '/mnt/local/' + name + '-' + (i++);
          fs.mounts.push({ prefix, backend: new HandleFS(handle), handle });
          okCount++;
        }
      } catch (e) { console.warn(e); }
    }
    toast(okCount ? `已恢复 ${okCount} 个挂载` : '未能恢复挂载（权限被拒绝）', okCount ? 'ok' : 'err');
    bus.emit('fs-changed', '/mnt/local');
  });
}

addEventListener('resize', () => { Desktop.render(); });
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'a' && e.target === document.body) {
    e.preventDefault();
    Desktop.setSel(Desktop.items.map(i => i.key));
  }
  if (e.key === 'Delete' && e.target === document.body && Desktop.sel.size) {
    const paths = Desktop.selPaths();
    if (paths.length) dialog({ title: '确认删除', body: `删除 ${paths.length} 个项目？`, okText: '删除', danger: true })
      .then(async ok => { if (ok) { for (const p of paths) await fs.rm(p).catch(() => {}); bus.emit('fs-changed', '/Desktop'); } });
  }
});

(async function boot() {
  const msg = t => { const m = $('#bootmsg'); if (m) m.textContent = t; };
  try {
    msg('MOUNTING OPFS VOLUME…');
    await fs.init();
    msg(fs.backendType === 'opfs' ? 'OPFS READY · SEEDING…' : 'FALLBACK: INDEXEDDB · SEEDING…');
    await seedDefaults();
    msg('LOADING DESKTOP…');
    await applyWallpaper(conf.get('wall', WALLPAPERS[0].id), false);
    buildStartMenu();
    await Desktop.refresh();
    if (fs.backendType !== 'opfs') toast('OPFS 不可用，已自动降级为 IndexedDB 存储', 'err');
    restoreMounts();
  } catch (e) {
    console.error(e);
    msg('BOOT ERROR: ' + e.message);
    toast('启动异常: ' + e.message, 'err');
  }
  await sleep(500);
  $('#boot').classList.add('gone');
  setTimeout(() => $('#boot').remove(), 900);
})();
