            <button data-bm="vfs:///Desktop/星轨互动演示.html" class="px-2 py-0.5 rounded hover:bg-[var(--bg-hover)] cursor-pointer text-[var(--accent)]">星轨互动演示 (本地 VFS)</button>
            <button data-bm="https://zh.wikipedia.org/wiki/WebAssembly" class="px-2 py-0.5 rounded hover:bg-[var(--bg-hover)] cursor-pointer">维基百科 · WebAssembly</button>
            <button data-bm="https://example.com" class="px-2 py-0.5 rounded hover:bg-[var(--bg-hover)] cursor-pointer">Example 基准页</button>
          </div>
          <div class="flex-1 relative overflow-hidden" style="background: #0c0f14;">
            <div data-br-loader class="xj-dark-loader"><div class="xj-astrolabe-spinner"></div><span class="text-xs">正在载入页面内容...</span></div>
            <iframe data-br-iframe class="w-full h-full border-0 bg-transparent" referrerpolicy="no-referrer"></iframe>
          </div>
        </div>
      `;

      const addrInput = win.bodyEl.querySelector('[data-br-addr]');
      const iframe = win.bodyEl.querySelector('[data-br-iframe]');
      const loader = win.bodyEl.querySelector('[data-br-loader]');
      const editSrcBtn = win.bodyEl.querySelector('[data-br-editsrc]');

      async function navigateBrowser(rawAddr, push = true) {
        let addr = rawAddr.trim();
        if (!addr) return;
        loader.classList.remove('hidden-loader');
        addrInput.value = addr;

        if (push && historyStack[histPtr] !== addr) {
          historyStack.splice(histPtr + 1);
          historyStack.push(addr);
          histPtr = historyStack.length - 1;
        }

        if (addr.startsWith('vfs://')) {
          const vfsPath = normPath(addr.slice(6));
          currentVfsFile = vfsPath;
          editSrcBtn.classList.remove('hidden');
          try {
            const bytes = await window.fs.readFile(vfsPath);
            const blob = new Blob([bytes], { type: 'text/html;charset=utf-8' });
            const bUrl = URL.createObjectURL(blob);
            blobUrls.add(bUrl);
            iframe.src = bUrl;
            win.setTitle(`织渊浏览器 · ${baseName(vfsPath)}`);
          } catch (err) {
            loader.classList.add('hidden-loader');
            showToast(`加载本地 HTML 失败: ${err.message}`, 'error');
          }
        } else {
          currentVfsFile = null;
          editSrcBtn.classList.add('hidden');
          if (!/^https?:\/\//i.test(addr)) {
            if (addr.includes('.') && !addr.includes(' ')) addr = 'https://' + addr;
            else addr = `https://www.bing.com/search?q=${encodeURIComponent(addr)}`;
          }
          addrInput.value = addr;
          iframe.src = addr;
          win.setTitle(`织渊浏览器 · ${addr}`);
        }
      }

      iframe.onload = () => loader.classList.add('hidden-loader');
      win.bodyEl.querySelector('[data-br-go]').onclick = () => navigateBrowser(addrInput.value);
      addrInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigateBrowser(addrInput.value); });
      win.bodyEl.querySelector('[data-br-reload]').onclick = () => navigateBrowser(addrInput.value, false);
      win.bodyEl.querySelector('[data-br-back]').onclick = () => {
        if (histPtr > 0) { histPtr--; navigateBrowser(historyStack[histPtr], false); }
      };
      win.bodyEl.querySelector('[data-br-fwd]').onclick = () => {
        if (histPtr < historyStack.length - 1) { histPtr++; navigateBrowser(historyStack[histPtr], false); }
      };
      win.bodyEl.querySelectorAll('[data-bm]').forEach(btn => {
        btn.onclick = () => navigateBrowser(btn.dataset.bm);
      });
      editSrcBtn.onclick = () => {
        if (currentVfsFile) openHtmlEditorApp({ filePath: currentVfsFile });
      };

      win.onCleanup = () => {
        for (const u of blobUrls) URL.revokeObjectURL(u);
        blobUrls.clear();
      };

      navigateBrowser(defaultUrl, false);
      return win;
    }

    /* -------------------------------------------------------------------------
       4.5 玄玑科学计算器 (Calculator)
       ------------------------------------------------------------------------- */
    function openCalculatorApp() {
      const win = WM.createWindow({
        appId: 'calc',
        title: '玄玑科学计算器',
        iconSvg: Icons.calc,
        width: 370,
        height: 510
      });

      let expr = '';
      let historyText = '就绪';

      const keys = [
        ['C', '(', ')', '退格'],
        ['sin', 'cos', 'tan', 'sqrt'],
        ['7', '8', '9', '/'],
        ['4', '5', '6', '*'],
        ['1', '2', '3', '-'],
        ['0', '.', 'pi', '+'],
        ['^', '%', '复制', '=']
      ];

      win.bodyEl.innerHTML = `
        <div class="flex flex-col h-full p-3 gap-2.5" style="background: var(--bg-surface-0);">
          <div class="p-3.5 rounded-md border flex flex-col items-end justify-end min-h-[92px]" style="background: var(--bg-surface-1); border-color: var(--border-crisp);">
            <div data-calc-hist class="text-xs text-[var(--text-muted)] font-mono truncate w-full text-right mb-1">就绪</div>
            <div data-calc-disp class="text-2xl font-bold text-[var(--accent)] font-mono break-all text-right w-full">0</div>
          </div>
          <div data-calc-grid class="flex-1 grid grid-cols-4 gap-1.5"></div>
        </div>
      `;

      const histEl = win.bodyEl.querySelector('[data-calc-hist]');
      const dispEl = win.bodyEl.querySelector('[data-calc-disp]');
      const gridEl = win.bodyEl.querySelector('[data-calc-grid]');

      const evaluateSafe = (raw) => {
        const sanitized = raw
          .replace(/\bpi\b/g, 'Math.PI')
          .replace(/\bsin\(/g, 'Math.sin(')
          .replace(/\bcos\(/g, 'Math.cos(')
          .replace(/\btan\(/g, 'Math.tan(')
          .replace(/\bsqrt\(/g, 'Math.sqrt(')
          .replace(/\^/g, '**');
        if (!/^[0-9+\-*/%.()\sMathPIsincotaqr*]+$/.test(sanitized)) {
          throw new Error('非法算式');
        }
        const val = Function(`"use strict"; return (${sanitized});`)();
        if (!isFinite(val)) throw new Error('数值溢出');
        return Number(val.toPrecision(12)).toString();
      };

      const pressKey = (k) => {
        if (k === 'C') { expr = ''; historyText = '已清零'; }
        else if (k === '退格') { expr = expr.slice(0, -1); }
        else if (['sin', 'cos', 'tan', 'sqrt'].includes(k)) { expr += `${k}(`; }
        else if (k === '复制') {
          navigator.clipboard?.writeText(dispEl.textContent).then(() => showToast('计算结果已复制', 'success')).catch(() => {});
          return;
        } else if (k === '=') {
          if (!expr) return;
          try {
            const ans = evaluateSafe(expr);
            historyText = `${expr} =`;
            expr = ans;
          } catch (_) {
            historyText = `${expr} -> 语法错误`;
            expr = '';
          }
        } else {
          expr += k;
        }
        histEl.textContent = historyText;
        dispEl.textContent = expr || '0';
      };

      keys.flat().forEach(k => {
        const btn = document.createElement('button');
        const isEq = k === '=';
        btn.className = 'rounded font-mono text-sm font-semibold cursor-pointer border transition-all active:scale-95';
        btn.style.background = isEq ? 'var(--accent)' : 'var(--bg-surface-2)';
        btn.style.color = isEq ? 'var(--text-on-accent)' : 'var(--text-primary)';
        btn.style.borderColor = 'var(--border-subtle)';
        btn.textContent = k;
        btn.onclick = () => pressKey(k);
        gridEl.appendChild(btn);
      });

      return win;
    }

    /* -------------------------------------------------------------------------
       丹青画板工作台 (Paint Studio —— 自由绘制、几何图形、撤销重做、读写 OPFS 图片)
       ------------------------------------------------------------------------- */
    async function openPaintApp(opts = {}) {
      let currentPath = opts.filePath ? normPath(opts.filePath) : null;
      const win = WM.createWindow({
        appId: 'paint',
        title: currentPath ? `丹青画板 · ${baseName(currentPath)}` : '丹青画板工作台',
        iconSvg: Icons.paint,
        width: 900,
        height: 600
      });

      let tool = 'brush'; // brush | eraser | line | rect | circle
      let strokeColor = '#e2b36b';
      let lineWidth = 4;
      const snapshots = [];
      let snapIdx = -1;

      win.bodyEl.innerHTML = `
        <div class="flex flex-col h-full w-full">
          <div class="px-3 py-1.5 border-b border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-2 text-xs" style="background: var(--bg-surface-1);">
            <div class="flex flex-wrap items-center gap-1">
              <button data-pt-tool="brush" class="h-7 px-2.5 rounded cursor-pointer">画笔</button>
              <button data-pt-tool="eraser" class="h-7 px-2.5 rounded cursor-pointer">橡皮</button>
              <button data-pt-tool="line" class="h-7 px-2.5 rounded cursor-pointer">直线</button>
              <button data-pt-tool="rect" class="h-7 px-2.5 rounded cursor-pointer">矩形</button>
              <button data-pt-tool="circle" class="h-7 px-2.5 rounded cursor-pointer">圆形</button>
              <div class="w-px h-4 bg-[var(--border-subtle)] mx-1"></div>
              <input data-pt-color type="color" value="#e2b36b" class="w-7 h-7 rounded cursor-pointer border-0 bg-transparent" />
              <label class="flex items-center gap-1 ml-1">
                <span>粗细</span>
                <input data-pt-size type="range" min="1" max="36" value="4" class="w-20 accent-[var(--accent)]" />
              </label>
            </div>
            <div class="flex items-center gap-1.5">
              <button data-pt-undo class="h-7 px-2 rounded hover:bg-[var(--bg-hover)] cursor-pointer">撤销</button>
              <button data-pt-clear class="h-7 px-2 rounded hover:bg-[var(--bg-hover)] cursor-pointer text-red-400">清屏</button>
              <button data-pt-save class="h-7 px-3 rounded font-semibold cursor-pointer" style="background: var(--accent); color: var(--text-on-accent);">保存 PNG 至 VFS</button>
            </div>
          </div>
          <div class="flex-1 overflow-auto flex items-center justify-center p-4" style="background: var(--bg-surface-0);">
            <canvas data-pt-canvas width="960" height="580" class="rounded shadow-xl border border-[var(--border-subtle)] bg-[#10141b] touch-none cursor-crosshair max-w-full"></canvas>
          </div>
        </div>
      `;

      const canvas = win.bodyEl.querySelector('[data-pt-canvas]');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#10141b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const pushSnapshot = () => {
        snapshots.splice(snapIdx + 1);
        snapshots.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (snapshots.length > 25) snapshots.shift();
        snapIdx = snapshots.length - 1;
      };

      if (currentPath) {
        try {
          const bytes = await window.fs.readFile(currentPath);
          const url = URL.createObjectURL(new Blob([bytes], { type: guessMimeType(currentPath) }));
          const img = new Image();
          await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; });
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
        } catch (_) {}
      }
      pushSnapshot();

      const syncToolBtns = () => {
        win.bodyEl.querySelectorAll('[data-pt-tool]').forEach(b => {
          const on = b.dataset.ptTool === tool;
          b.style.background = on ? 'var(--accent)' : 'var(--bg-surface-2)';
          b.style.color = on ? 'var(--text-on-accent)' : 'var(--text-primary)';
        });
      };
      syncToolBtns();

      const getCanvasXY = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) * (canvas.width / r.width),
          y: (e.clientY - r.top) * (canvas.height / r.height)
        };
      };

      let drawing = false, startPt = null, baseImg = null;
      canvas.addEventListener('pointerdown', (e) => {
        drawing = true;
        canvas.setPointerCapture(e.pointerId);
        startPt = getCanvasXY(e);
        baseImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = tool === 'eraser' ? '#10141b' : strokeColor;
        if (tool === 'brush' || tool === 'eraser') {
          ctx.beginPath();
          ctx.moveTo(startPt.x, startPt.y);
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const pt = getCanvasXY(e);
        if (tool === 'brush' || tool === 'eraser') {
          ctx.lineTo(pt.x, pt.y);
          ctx.stroke();
        } else {
          ctx.putImageData(baseImg, 0, 0);
          ctx.beginPath();
          if (tool === 'line') {
            ctx.moveTo(startPt.x, startPt.y);
            ctx.lineTo(pt.x, pt.y);
          } else if (tool === 'rect') {
            ctx.rect(startPt.x, startPt.y, pt.x - startPt.x, pt.y - startPt.y);
          } else if (tool === 'circle') {
            const rad = Math.hypot(pt.x - startPt.x, pt.y - startPt.y);
            ctx.arc(startPt.x, startPt.y, rad, 0, Math.PI * 2);
          }
          ctx.stroke();
        }
      });

      canvas.addEventListener('pointerup', () => {
        if (!drawing) return;
        drawing = false;
        pushSnapshot();
      });

      win.bodyEl.querySelectorAll('[data-pt-tool]').forEach(b => {
        b.onclick = () => { tool = b.dataset.ptTool; syncToolBtns(); };
      });
      win.bodyEl.querySelector('[data-pt-color]').oninput = (e) => { strokeColor = e.target.value; };
      win.bodyEl.querySelector('[data-pt-size]').oninput = (e) => { lineWidth = Number(e.target.value); };
      win.bodyEl.querySelector('[data-pt-undo]').onclick = () => {
        if (snapIdx > 0) { snapIdx--; ctx.putImageData(snapshots[snapIdx], 0, 0); }
      };
      win.bodyEl.querySelector('[data-pt-clear]').onclick = () => {
        ctx.fillStyle = '#10141b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        pushSnapshot();
      };
      win.bodyEl.querySelector('[data-pt-save]').onclick = async () => {
        const out = currentPath && extName(currentPath) === 'png'
          ? currentPath
          : await promptTextDialog('保存画板作品至 VFS', '保存路径：', `/Pictures/丹青作品_${Date.now().toString().slice(-4)}.png`);
        if (!out) return;
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        const ab = await blob.arrayBuffer();
        await window.fs.writeFile(normPath(out), new Uint8Array(ab));
        currentPath = normPath(out);
        win.setTitle(`丹青画板 · ${baseName(currentPath)}`);
        showToast(`画作已保存至 ${currentPath}`, 'success');
      };

      return win;
    }

    /* -------------------------------------------------------------------------
       6.1 V86 硬件虚拟机模拟器 (严格锁定固定版本 0.5.319 + 指定 commit BIOS + 鼠标锁定 + 二进制缓冲挂载)
       所有磁盘或光盘镜像均从 VFS 二进制缓冲加载，不加载任何外部镜像地址
       ------------------------------------------------------------------------- */
    const V86_LOCKED_RESOURCES = {
      js:      'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',
      wasm:    'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
      seabios: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
      vgabios: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
    };

    async function ensureV86RuntimeLoaded() {
      if (window.V86 || window.V86Starter) return window.V86 || window.V86Starter;
      await new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${V86_LOCKED_RESOURCES.js}"]`);
        if (existing && (window.V86 || window.V86Starter)) return resolve();
        const s = document.createElement('script');
        s.src = V86_LOCKED_RESOURCES.js;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('无法加载 v86@0.5.319 运行时库'));
        document.head.appendChild(s);
      });
      return window.V86 || window.V86Starter;
    }

    async function openV86App(opts = {}) {
      let currentImagePath = opts.imagePath ? normPath(opts.imagePath) : '/System/xuanji-bios-demo.bin';

      const win = WM.createWindow({
        appId: 'vm',
        title: `V86 x86 硬件虚拟机 · ${baseName(currentImagePath)}`,
        iconSvg: Icons.vm,
        width: 880,
        height: 600
      });

      let emulator = null;
      let ramMb = 128;

      // 严格包含 V86 强制要求的 screen_container 结构：一个 white-space:pre 的 monospace div + 一个 canvas 且顺序绝对不变！
      win.bodyEl.innerHTML = `
        <div class="flex flex-col h-full w-full" style="background: #080a0e;">
          <div class="px-3 py-2 border-b border-white/10 flex flex-wrap items-center justify-between gap-2 text-xs text-white/85" style="background: var(--bg-surface-1);">
            <div class="flex flex-wrap items-center gap-1.5">
              <button data-vm-boot-demo class="h-7 px-2.5 rounded font-semibold cursor-pointer" style="background: var(--accent); color: var(--text-on-accent);">启动内置实模式演示</button>
              <button data-vm-pick-vfs class="h-7 px-2.5 rounded border border-[var(--border-subtle)] hover:bg-[var(--bg-hover)] cursor-pointer">挂载 VFS 镜像</button>
              <button data-vm-upload class="h-7 px-2.5 rounded border border-[var(--border-subtle)] hover:bg-[var(--bg-hover)] flex items-center gap-1 cursor-pointer"><span class="w-3.5 h-3.5">${Icons.upload}</span><span>载入本地 ISO/IMG</span></button>
              <label class="flex items-center gap-1 px-2 py-1 rounded border border-[var(--border-subtle)]">
                <span class="text-[var(--text-muted)]">内存:</span>
                <select data-vm-ram class="bg-transparent outline-none cursor-pointer text-[var(--accent)]">
                  <option value="64">64 MB</option>
                  <option value="128" selected>128 MB</option>
                  <option value="256">256 MB</option>
                  <option value="512">512 MB</option>
                </select>
              </label>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              <button data-vm-lockmouse class="h-7 px-2.5 rounded border border-[var(--accent-mineral)] text-[var(--accent-mineral)] hover:bg-sky-500/15 flex items-center gap-1 cursor-pointer" title="调用 V86 鼠标指针锁定 (按 ESC 退出锁定)">
                <span class="w-3.5 h-3.5">${Icons.mouse}</span><span>锁定鼠标</span>
              </button>
              <button data-vm-cad class="h-7 px-2 rounded border border-[var(--border-subtle)] hover:bg-[var(--bg-hover)] cursor-pointer">Ctrl+Alt+Del</button>
              <button data-vm-reboot class="h-7 px-2 rounded border border-[var(--border-subtle)] hover:bg-[var(--bg-hover)] cursor-pointer">重启</button>
            </div>
          </div>

          <div class="flex-1 overflow-auto flex items-center justify-center p-3 relative" style="background: #000000;">
            <div data-vm-loader class="xj-dark-loader hidden-loader"><div class="xj-astrolabe-spinner"></div><span class="text-xs">正在初始化 v86@0.5.319 WASM 与 SeaBIOS...</span></div>
            <!-- V86 强制标准 screen_container 结构（顺序严格固定：monospace pre div 在前，canvas 在后） -->
            <div data-vm-screen class="v86-screen-container bg-black p-2 rounded border border-white/10 shadow-2xl">
              <div style="white-space: pre; font: 14px monospace; line-height: 14px; color: #e5e7eb;"></div>
              <canvas style="display: none"></canvas>
            </div>
          </div>

          <footer data-vm-status class="h-6 px-3 border-t border-white/10 flex items-center justify-between text-[11px] text-white/60 font-mono" style="background: #0d1016;">
            <span data-vm-mount-info>就绪 · v86@0.5.319</span>
            <span>点击画面可聚焦键盘输入 · 点击「锁定鼠标」捕获指针</span>
          </footer>
        </div>
      `;

      const screenContainer = win.bodyEl.querySelector('[data-vm-screen]');
      const loaderEl = win.bodyEl.querySelector('[data-vm-loader]');
      const mountInfoEl = win.bodyEl.querySelector('[data-vm-mount-info]');

      async function bootWithVfsImage(vfsImgPath) {
        currentImagePath = normPath(vfsImgPath);
        loaderEl.classList.remove('hidden-loader');
        try {
          if (emulator) {
            try { await emulator.stop(); emulator.destroy?.(); } catch (_) {}
            emulator = null;
          }
          // 重置标准 screen_container 子节点状态
          screenContainer.innerHTML = `<div style="white-space: pre; font: 14px monospace; line-height: 14px; color: #e5e7eb;"></div><canvas style="display: none"></canvas>`;

          const V86Ctor = await ensureV86RuntimeLoaded();
          const rawBytes = await window.fs.readFile(currentImagePath);
          // 拷贝独立 ArrayBuffer 以防底层偏移视图问题
          const cleanBuffer = rawBytes.buffer.slice(rawBytes.byteOffset, rawBytes.byteOffset + rawBytes.byteLength);

          const ext = extName(currentImagePath);
          let mountSlot = 'hda';
          if (ext === 'iso') mountSlot = 'cdrom';
          else if (ext === 'img' || ext === 'fda' || ext === 'bin') mountSlot = 'fda';
          else mountSlot = 'hda';

          const v86Config = {
            wasm_path: V86_LOCKED_RESOURCES.wasm,
            memory_size: ramMb * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: screenContainer,
            bios: { url: V86_LOCKED_RESOURCES.seabios },
            vga_bios: { url: V86_LOCKED_RESOURCES.vgabios },
            autostart: true
          };
          v86Config[mountSlot] = { buffer: cleanBuffer };

          emulator = new V86Ctor(v86Config);
          win.setTitle(`V86 x86 硬件虚拟机 · ${baseName(currentImagePath)} [${mountSlot.toUpperCase()}]`);
          mountInfoEl.textContent = `已挂载 ${mountSlot.toUpperCase()}: ${currentImagePath} (${formatBytes(cleanBuffer.byteLength)}) | RAM: ${ramMb}MB`;

          emulator.add_listener?.('emulator-ready', () => {
            loaderEl.classList.add('hidden-loader');
          });
          setTimeout(() => loaderEl.classList.add('hidden-loader'), 1200);
        } catch (err) {
          loaderEl.classList.add('hidden-loader');
          showToast(`虚拟机启动失败: ${err.message}`, 'error');
        }
      }

      win.bodyEl.querySelector('[data-vm-ram]').onchange = (e) => {
        ramMb = Number(e.target.value) || 128;
      };
      win.bodyEl.querySelector('[data-vm-boot-demo]').onclick = () => bootWithVfsImage('/System/xuanji-bios-demo.bin');
      win.bodyEl.querySelector('[data-vm-pick-vfs]').onclick = async () => {
        const p = await promptTextDialog('挂载 VFS 镜像文件', '输入虚拟文件系统内的镜像路径（.iso -> cdrom, .img/.fda/.bin -> fda, 其它 -> hda）：', currentImagePath);
        if (p) bootWithVfsImage(p);
      };
      win.bodyEl.querySelector('[data-vm-upload]').onclick = () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.onchange = async () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          const dest = joinPath('/Downloads', f.name);
          showToast(`正在导入镜像 "${f.name}" 至 VFS...`);
          await window.fs.writeFile(dest, new Uint8Array(await f.arrayBuffer()), { mtime: f.lastModified });
          await bootWithVfsImage(dest);
        };
        inp.click();
      };

      // V86 鼠标锁定功能
      win.bodyEl.querySelector('[data-vm-lockmouse]').onclick = () => {
        if (!emulator) return;
        if (typeof emulator.lock_mouse === 'function') {
          emulator.lock_mouse();
          showToast('鼠标已锁定至虚拟机画面，按 ESC 键可随时释放指针');
        } else {
          const cvs = screenContainer.querySelector('canvas');
          cvs?.requestPointerLock?.();
        }
      };

      win.bodyEl.querySelector('[data-vm-cad]').onclick = () => {
        emulator?.keyboard_send_scancodes?.([0x1D, 0x38, 0x53, 0x9D, 0xB8, 0xD3]);
      };
      win.bodyEl.querySelector('[data-vm-reboot]').onclick = () => {
        if (emulator && typeof emulator.restart === 'function') emulator.restart();
        else bootWithVfsImage(currentImagePath);
      };

      win.onCleanup = () => {
        if (emulator) {
          try { emulator.stop(); emulator.destroy?.(); } catch (_) {}
          emulator = null;
        }
      };

      bootWithVfsImage(currentImagePath);
      return win;
    }

    /* -------------------------------------------------------------------------
       4.6 系统深度设置 (Settings —— 存储配额与占有率可视化、双后端管理、圆角/主题色/应用显隐/一键重置)

    async function openSettingsApp(opts = {}) {
      let activeTab = opts.tab || 'storage'; // storage | appearance | desktop | mounts
      const win = WM.createWindow({
        appId: 'settings',
        title: '系统深度设置 · 玄玑控制枢',
        iconSvg: Icons.settings,
        width: 920,
        height: 610
      });

      win.bodyEl.innerHTML = `
        <div class="flex h-full w-full overflow-hidden">
          <aside class="w-48 shrink-0 border-r border-[var(--border-subtle)] p-3 flex flex-col gap-1" style="background: var(--bg-surface-1);">
            <button data-st-tab="storage" class="px-3 py-2 rounded text-left text-xs font-medium flex items-center gap-2 cursor-pointer">${Icons.drive.replace('<svg', '<svg class="w-4 h-4 shrink-0"')}<span>存储与双后端可视化</span></button>
            <button data-st-tab="appearance" class="px-3 py-2 rounded text-left text-xs font-medium flex items-center gap-2 cursor-pointer">${Icons.paint.replace('<svg', '<svg class="w-4 h-4 shrink-0"')}<span>主题、圆角与壁纸</span></button>

      `;

      const contentEl = win.bodyEl.querySelector('[data-st-content]');

      async function scanBackendStats(prefixPath) {
        const categories = {
          image: { label: '图像与漫画', bytes: 0, count: 0, color: '#34d399' },
          code:  { label: '网页与源码', bytes: 0, count: 0, color: '#38bdf8' },
          doc:   { label: '文档与表格', bytes: 0, count: 0, color: '#e2b36b' },
          media: { label: '音视频媒体', bytes: 0, count: 0, color: '#f472b6' },
          arch:  { label: '归档与镜像', bytes: 0, count: 0, color: '#a78bfa' },
          other: { label: '系统与其它', bytes: 0, count: 0, color: '#94a3b8' }
        };
        const files = [];
        const walk = async (dir, depth = 0) => {
          if (depth > 6) return;
          let items = [];
          try { items = await window.fs.readdir(dir, { withFileTypes: true }); } catch (_) {}
          for (const it of items) {
            if (it.name === 'mnt') continue;
            if (it.isDirectory()) {
              await walk(it.path, depth + 1);
            } else {
              const ext = extName(it.name);
              const sz = Number(it.size) || 0;
              files.push({ path: it.path, size: sz, mtime: it.mtimeMs });
              if (IMAGE_EXTS.has(ext)) { categories.image.bytes += sz; categories.image.count++; }
              else if (CODE_EXTS.has(ext)) { categories.code.bytes += sz; categories.code.count++; }
              else if (SHEET_EXTS.has(ext) || TEXT_EXTS.has(ext) || ext === 'pdf') { categories.doc.bytes += sz; categories.doc.count++; }
              else if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext)) { categories.media.bytes += sz; categories.media.count++; }
              else if (ARCHIVE_EXTS.has(ext) || VM_EXTS.has(ext)) { categories.arch.bytes += sz; categories.arch.count++; }
              else { categories.other.bytes += sz; categories.other.count++; }
            }
          }
        };
        await walk(prefixPath);
        const totalVfsBytes = files.reduce((s, f) => s + f.size, 0);
        return { categories, files, totalVfsBytes };

            saveSettings();
            applyVisualSettings();
            DesktopManager.render();
          };

          contentEl.querySelectorAll('[data-vis-desk]').forEach(chk => {
            chk.onchange = () => {
              const id = chk.dataset.visDesk;
              const arr = new Set(OSState.settings.hiddenDesktopApps);
              if (chk.checked) arr.delete(id); else arr.add(id);
              OSState.settings.hiddenDesktopApps = Array.from(arr);
              saveSettings();
              DesktopManager.render();
            };
          });

          contentEl.querySelectorAll('[data-vis-task]').forEach(chk => {
            chk.onchange = () => {
              const id = chk.dataset.visTask;
              const pinned = new Set(OSState.settings.pinnedTaskbarApps);
              const hidden = new Set(OSState.settings.hiddenTaskbarApps);
              if (chk.checked) {
                pinned.add(id);
                hidden.delete(id);
              } else {
                hidden.add(id);
              }
              OSState.settings.pinnedTaskbarApps = Array.from(pinned);
              OSState.settings.hiddenTaskbarApps = Array.from(hidden);
              saveSettings();
              renderTaskbar();
            };
          });
        }

        else if (activeTab === 'mounts') {
          const activeMounts = Array.from(window.fs.localMountNames);
          const pendingMounts = OSState.pendingRemountHandles || [];
          contentEl.innerHTML = `
            <div>
              <h2 class="text-base font-bold text-[var(--text-primary)] mb-1" style="font-family: var(--font-serif);">本地文件夹挂载 (/mnt/local) 与系统重置</h2>
              <p class="text-xs text-[var(--text-secondary)]">通过 File System Access API 将真实物理目录挂载为统一 VFS 节点，享有完全对等读写能力</p>
            </div>

            <div class="p-4 rounded-lg border space-y-3" style="background: var(--bg-surface-1); border-color: var(--border-subtle);">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold">当前已挂载的真实本地目录 (${activeMounts.length})</span>
                <button data-mnt-add class="px-3 py-1.5 rounded text-xs font-semibold cursor-pointer" style="background: var(--accent); color: var(--text-on-accent);">+ 选择本地目录挂载</button>
              </div>
              <div class="space-y-1.5">
                ${activeMounts.length === 0 ? `<div class="text-xs text-[var(--text-muted)]">当前暂无活跃挂载点</div>` : activeMounts.map(m => `
                  <div class="px-3 py-2 rounded border border-[var(--border-subtle)] flex items-center justify-between text-xs" style="background: var(--bg-surface-0);">
                    <span class="font-mono text-[var(--accent-mineral)]">/mnt/local/${m}</span>
                    <div class="flex gap-2">
                      <button data-mnt-open="/mnt/local/${m}" class="px-2.5 py-1 rounded border border-[var(--border-subtle)] hover:bg-[var(--bg-hover)] cursor-pointer">浏览</button>
                      <button data-mnt-remove="${m}" class="px-2.5 py-1 rounded bg-red-500/20 text-red-400 hover:bg-red-600 hover:text-white cursor-pointer">卸载</button>
                    </div>
                  </div>
                `).join('')}
              </div>

              ${pendingMounts.length > 0 ? `
                <div class="pt-3 border-t border-[var(--border-subtle)] space-y-2">
                  <div class="text-xs font-semibold text-amber-400">上次会话记录的待重新授权文件夹：</div>
                  ${pendingMounts.map((rec, i) => `
                    <div class="px-3 py-2 rounded border border-amber-500/30 flex items-center justify-between text-xs">
                      <span>/mnt/local/${rec.mountName}</span>
                      <button data-remount-idx="${i}" class="px-2.5 py-1 rounded font-semibold cursor-pointer" style="background: var(--accent); color: var(--text-on-accent);">重新获取授权并挂载</button>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>

            <!-- 危险操作区：一键重置虚拟文件系统 -->
            <div class="p-4 rounded-lg border border-red-500/40 space-y-2" style="background: rgba(220, 38, 38, 0.06);">
              <div class="text-xs font-bold text-red-400">一键重置系统与清空虚拟文件系统</div>
              <p class="text-xs text-[var(--text-secondary)]">此操作将清除 OPFS、IndexedDB、LocalStorage 与 Cookie 中的全部用户文件和个性化设置，并恢复初始出厂虚拟文件系统。</p>
              <button data-factory-reset class="px-4 py-2 rounded bg-red-600 hover:bg-red-500 text-white text-xs font-semibold cursor-pointer">立即重置虚拟文件系统</button>
            </div>
          `;

          contentEl.querySelector('[data-mnt-add]').onclick = async () => {
            await triggerLocalFolderMountWithFeedback();
            renderActiveTab();
          };
          contentEl.querySelectorAll('[data-mnt-open]').forEach(b => {
            b.onclick = () => openExplorerApp({ initialPath: b.dataset.mntOpen });
          });
          contentEl.querySelectorAll('[data-mnt-remove]').forEach(b => {
            b.onclick = async () => {
              await window.fs.unmountLocalDirectory(b.dataset.mntRemove);
              renderActiveTab();
            };
          });
          contentEl.querySelectorAll('[data-remount-idx]').forEach(b => {
            b.onclick = async () => {
              const rec = OSState.pendingRemountHandles[Number(b.dataset.remountIdx)];
              if (rec) {
                await triggerLocalFolderMountWithFeedback(rec);
                renderActiveTab();
              }
            };
          });
          contentEl.querySelector('[data-factory-reset]').onclick = async () => {
            const ok = await showModalDialog({
              title: '确认一键重置系统',
              bodyHtml: '此操作将清空 OPFS 与 IndexedDB 中的全部虚拟文件并重置系统初始化环境，是否继续？',
              buttons: [
                { label: '取消', value: false },
                { label: '确认清空重置', danger: true, value: true }
              ]
            });
            if (!ok) return;
            await window.fs.resetAll();
            location.reload();
          };
        }
      }

      win.bodyEl.querySelectorAll('[data-st-tab]').forEach(b => {
        b.onclick = () => {
          activeTab = b.dataset.stTab;
          renderActiveTab();
        };
      });

      renderActiveTab();
      return win;
    }

    /* =========================================================================
       模块 12：全局快捷绑定与零假加载屏即时启动入口 (bootXuanJiOS)
       ========================================================================= */
    async function bootXuanJiOS() {
      // 1. 立即渲染默认深色主题与内置艺术壁纸（零等待、零假开机动画，直接进入系统！）
      applyVisualSettings();
      CalendarWidget.tickClock();
      setInterval(() => CalendarWidget.tickClock(), 1000);
      renderTaskbar();

      // 2. 初始化统一文件系统 (OPFS + IndexedDB + LocalStorage + Cookie)
      await window.fs.init();
      await applyVisualSettings(); // 若用户设置了 OPFS 自定义图片壁纸则自动激活

      // 3. 绑定桌面图标自动同步刷新
      OSState.fsChangeListeners.add((changedDir) => {
        if (changedDir === '/Desktop' || changedDir === '/') {
          DesktopManager.render();
        }
      });
      await DesktopManager.init();

      // 4. 任务栏与弹出面板交互绑定
      document.getElementById('btn-start-menu').onclick = (e) => {
        e.stopPropagation();
        const p = document.getElementById('start-menu-panel');
        const wasHidden = p.classList.contains('hidden');
        hideAllFloatingPanels();
        if (wasHidden) {
          renderStartMenu();
          p.classList.remove('hidden');
          p.querySelector('#start-filter-input')?.focus();
        }
      };

      document.getElementById('btn-global-search').onclick = () => {
        const win = openExplorerApp({ initialPath: '/' });
        setTimeout(() => {
          const gBtn = win.bodyEl.querySelector('[data-fe-global-toggle]');
          const sInp = win.bodyEl.querySelector('[data-fe-search]');
          if (gBtn) gBtn.click();
          if (sInp) sInp.focus();
        }, 80);
      };

      document.getElementById('btn-mount-quick').onclick = () => triggerLocalFolderMountWithFeedback();

      document.getElementById('btn-theme-quick').onclick = () => {
        OSState.settings.theme = OSState.settings.theme === 'dark' ? 'light' : 'dark';
        saveSettings();
        applyVisualSettings();
      };

      document.getElementById('btn-clock-tray').onclick = (e) => {
        e.stopPropagation();
        const p = document.getElementById('calendar-panel');
        const wasHidden = p.classList.contains('hidden');
        hideAllFloatingPanels();
        if (wasHidden) {
          CalendarWidget.renderPanel();
          p.classList.remove('hidden');
        }
      };

      // 点击页面空白收起浮层
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#start-menu-panel, #calendar-panel, #context-menu, #btn-start-menu, #btn-clock-tray')) {
          hideAllFloatingPanels();
        }
      });

      // 自定义本地壁纸上传（持久化保存至 OPFS 并立即设为桌面壁纸）
      document.getElementById('wallpaper-file-input').addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const ext = extName(file.name) || 'png';
          const wpPath = `/System/custom_wallpaper.${ext}`;
          const ab = await file.arrayBuffer();
          await window.fs.writeFile(wpPath, new Uint8Array(ab), { mtime: file.lastModified });
          OSState.settings.wallpaperType = 'custom';
          OSState.settings.customWallpaperPath = wpPath;
          saveSettings();
          await applyVisualSettings();
          showToast(`已将 "${file.name}" 保存至 OPFS 并设为桌面壁纸`, 'success');
        } catch (err) {
          showToast(`设置壁纸失败: ${err.message}`, 'error');
        }
      });

      // 5. 若上次会话存在挂载过的本地真实文件夹，页面刷新后弹出持久化恢复授权提醒
      if (OSState.pendingRemountHandles.length > 0) {
        const firstRec = OSState.pendingRemountHandles[0];
        showToast(
          `检测到上次挂载的本地文件夹「${firstRec.mountName}」需要重新授权访问`,
          'info',
          {
            label: '恢复挂载',
            onClick: () => triggerLocalFolderMountWithFeedback(firstRec)
          }
        );
      }
    }

    // 直接进入桌面系统
    bootXuanJiOS();
  </script>
</body>
</html>
