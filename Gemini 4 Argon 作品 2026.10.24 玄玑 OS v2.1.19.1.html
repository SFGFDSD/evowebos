                  <span class="w-4 h-4 shrink-0">${q.icon}</span><span class="truncate">${q.label}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <div>
            <div class="px-2 mb-1 text-[10.5px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">存储后端卷</div>
            <div class="flex flex-col gap-0.5">
              ${volumes.map(v => `
                <button data-nav-path="${v.path}" class="px-2 py-1.5 rounded flex items-center gap-2 text-xs text-left cursor-pointer transition-colors ${state.currentPath === v.path ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'hover:bg-[var(--bg-hover)] text-[var(--text-primary)]'}">
                  <span class="w-4 h-4 shrink-0 text-[var(--accent)]">${v.icon}</span><span class="truncate">${v.label}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <div>
            <div class="px-2 mb-1 flex items-center justify-between text-[10.5px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">
              <span>本地挂载 (/mnt/local)</span>
              <button data-side-mount class="text-[var(--accent-mineral)] hover:underline cursor-pointer">+挂载</button>
            </div>
            <div class="flex flex-col gap-0.5">
              ${localMounts.length === 0 ? `<div class="px-2 py-1 text-[11px] text-[var(--text-muted)]">尚未挂载本地真实目录</div>` : localMounts.map(m => {
                const mp = `/mnt/local/${m}`;
                return `
                  <div class="px-2 py-1 rounded flex items-center justify-between gap-1 text-xs ${state.currentPath.startsWith(mp) ? 'bg-[var(--bg-active)] text-[var(--accent-mineral)]' : 'hover:bg-[var(--bg-hover)]'}">
                    <button data-nav-path="${mp}" class="flex items-center gap-1.5 min-w-0 flex-1 text-left cursor-pointer">
                      <span class="w-4 h-4 shrink-0 text-[var(--accent-mineral)]">${Icons.folderMount}</span>
                      <span class="truncate">${m}</span>
                    </button>
                    <button data-unmount-name="${m}" class="text-[10px] px-1.5 py-0.5 rounded hover:bg-red-500/20 text-[var(--text-muted)] hover:text-red-400 cursor-pointer" title="卸载此本地目录">卸载</button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <div class="px-2 mb-1 text-[10.5px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">目录树导航</div>
            <div data-fe-tree class="flex flex-col gap-0.5 text-xs"></div>
          </div>
        `;
        sidebarEl.innerHTML = html;

        sidebarEl.querySelectorAll('[data-nav-path]').forEach(btn => {
          btn.onclick = () => instanceApi.navigateTo(btn.dataset.navPath);
        });
        sidebarEl.querySelector('[data-side-mount]')?.addEventListener('click', () => triggerLocalFolderMountWithFeedback());
        sidebarEl.querySelectorAll('[data-unmount-name]').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            const mName = btn.dataset.unmountName;
            await window.fs.unmountLocalDirectory(mName);
            if (state.currentPath.startsWith(`/mnt/local/${mName}`)) instanceApi.navigateTo('/Desktop');
            else renderSidebar();
            showToast(`已卸载本地目录 "${mName}"`);
          };
        });

        // 构建递归可折叠目录树
        const treeContainer = sidebarEl.querySelector('[data-fe-tree]');
        await buildDirectoryTreeNodes(treeContainer, '/', 0);
      }

      async function buildDirectoryTreeNodes(parentEl, dirPath, depth) {
        if (depth > 5 || state.disposed) return;
        let subDirs = [];
        try {
          const all = await window.fs.readdir(dirPath, { withFileTypes: true });
          subDirs = all.filter(x => x.isDirectory()).sort((a, b) => naturalCompare(a.name, b.name));
        } catch (_) {}

        for (const d of subDirs) {
          const isExpanded = state.expandedTreeDirs.has(d.path);
          const isCurrent = state.currentPath === d.path;
          const row = document.createElement('div');
          row.className = `py-1 pr-2 rounded flex items-center gap-1 cursor-pointer ${isCurrent ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'hover:bg-[var(--bg-hover)] text-[var(--text-secondary)]'}`;
          row.style.paddingLeft = `${6 + depth * 12}px`;
          row.innerHTML = `
            <span data-tree-toggle class="w-3.5 h-3.5 flex items-center justify-center shrink-0 opacity-75">${isExpanded ? Icons.chevDown : Icons.chevRight}</span>
            <span class="w-3.5 h-3.5 shrink-0 text-[var(--accent)]">${Icons.folder}</span>
            <span class="truncate flex-1">${d.name}</span>
          `;
          row.querySelector('[data-tree-toggle]').onclick = (e) => {
            e.stopPropagation();
            if (state.expandedTreeDirs.has(d.path)) state.expandedTreeDirs.delete(d.path);
            else state.expandedTreeDirs.add(d.path);
            renderSidebar();
          };
          row.onclick = () => {
            state.expandedTreeDirs.add(d.path);
            instanceApi.navigateTo(d.path);
          };
          parentEl.appendChild(row);

          if (isExpanded) {
            await buildDirectoryTreeNodes(parentEl, d.path, depth + 1);
          }
        }
      }

      async function collectGlobalSearchEntries(rootDir, keyword, results = [], depth = 0) {
        if (depth > 6 || results.length > 250) return results;
        try {
          const items = await window.fs.readdir(rootDir, { withFileTypes: true });
          for (const it of items) {
            if (it.name.toLowerCase().includes(keyword)) {
              results.push(it);
            }
            if (it.isDirectory()) {
              await collectGlobalSearchEntries(it.path, keyword, results, depth + 1);
            }
          }
        } catch (_) {}
        return results;
      }

      async function loadEntries() {
        loaderEl.classList.remove('hidden-loader');
        try {
          const kw = state.searchQuery.trim().toLowerCase();
          let list = [];
          if (kw && state.globalSearch) {
            list = await collectGlobalSearchEntries('/', kw);
            for (const mName of window.fs.localMountNames) {
              await collectGlobalSearchEntries(`/mnt/local/${mName}`, kw, list);
            }
          } else {
            list = await window.fs.readdir(state.currentPath, { withFileTypes: true });
            if (kw) list = list.filter(e => e.name.toLowerCase().includes(kw));
          }

          // 并行计算当前目录所有子文件夹的真实递归字节大小，保证文件夹大小显示与排序 100% 准确！
          await Promise.all(list.map(async (item) => {
            item.typeLabel = getFileTypeLabel(item.name, item.isDirectory());
            if (item.isDirectory()) {
              item.computedSize = await window.fs.getFolderSize(item.path);
            } else {
              item.computedSize = item.size;
            }
          }));

          sortEntryList(list);
          state.entries = list;
        } catch (err) {
          showToast(`读取目录失败: ${err.message}`, 'error');
          state.entries = [];
        } finally {
          loaderEl.classList.add('hidden-loader');
        }
      }

      function sortEntryList(list) {
        list.sort((a, b) => {
          // 文件夹优先分组展示（同组内按列精确排序）
          if (a.isDirectory() !== b.isDirectory()) return a.isDirectory() ? -1 : 1;
          let cmp = 0;
          if (state.sortKey === 'name') cmp = naturalCompare(a.name, b.name);
          else if (state.sortKey === 'mtime') cmp = a.mtimeMs - b.mtimeMs;
          else if (state.sortKey === 'type') cmp = naturalCompare(a.typeLabel, b.typeLabel);
          else if (state.sortKey === 'size') cmp = (a.computedSize || 0) - (b.computedSize || 0);
          return cmp * state.sortDir;
        });
      }

      function updateStatusBar() {
        const totalBytes = state.entries.reduce((s, x) => s + (x.computedSize || 0), 0);
        const selCount = state.selectedPaths.size;
        statusEl.innerHTML = `
          <span>共 ${state.entries.length} 个项目 (${formatBytes(totalBytes)})${selCount > 0 ? ` · 已选中 ${selCount} 项` : ''}</span>
          <span>路径: ${state.currentPath}</span>
        `;
      }

      function bindItemCommonInteractions(el, item) {
        el.dataset.path = item.path;
        el.dataset.isDir = String(item.isDirectory());
        el.draggable = true;

        // 提前异步预热拖拽缓存，严禁在 dragstart 内 await
        if (item.isFile()) {
          el.addEventListener('mouseenter', () => DragPreloadCache.preload(item.path));
          el.addEventListener('mousedown', () => DragPreloadCache.preload(item.path));
        }

        el.addEventListener('dragstart', (e) => {
          if (!state.selectedPaths.has(item.path)) {
            state.selectedPaths = new Set([item.path]);
            syncMainSelectionClasses();
          }
          const paths = Array.from(state.selectedPaths);
          e.dataTransfer.effectAllowed = 'copyMove';
          e.dataTransfer.setData('application/x-xuanji-vfs', JSON.stringify({
            source: 'explorer',
            paths,
            offsetX: 32,
            offsetY: 32
          }));
          if (item.isFile()) {
            const cached = DragPreloadCache.getSync(item.path);
            if (cached) {
              try { e.dataTransfer.items.add(cached.file); } catch (_) {}
              try { e.dataTransfer.setData('DownloadURL', `${cached.mime}:${cached.safeName}:${cached.blobUrl}`); } catch (_) {}
            }
          }
        });

        el.addEventListener('dragend', () => {
          if (item.isFile()) DragPreloadCache.scheduleCleanupAfterDrag(item.path);
        });

        if (item.isDirectory()) {
          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.add('drop-target');
          });
          el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
          el.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.remove('drop-target');
            const raw = e.dataTransfer.getData('application/x-xuanji-vfs');
            if (raw) {
              const payload = JSON.parse(raw);
              for (const p of (payload.paths || [])) {
                if (p === item.path || p.startsWith('app:')) continue;
                await window.fs.rename(p, joinPath(item.path, baseName(p)));
              }
              showToast(`已移动至 "${item.name}"`, 'success');
            } else {
              await importDataTransferToVfs(e.dataTransfer, item.path);
            }
          });
        }

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          hideAllFloatingPanels();
          const checkHit = e.target.closest('.fe-row-check, .item-check-badge');
          if (checkHit || state.mobileMarqueeMode || e.ctrlKey || e.metaKey || e.shiftKey) {
            if (state.selectedPaths.has(item.path)) state.selectedPaths.delete(item.path);
            else state.selectedPaths.add(item.path);
            syncMainSelectionClasses();
            updateStatusBar();
            return;
          }
          state.selectedPaths = new Set([item.path]);
          syncMainSelectionClasses();
          updateStatusBar();
          if (OSState.settings.singleClickOpen) {
            openPathSmart(item.path, { explorerInstance: instanceApi });
          }
        });

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (!OSState.settings.singleClickOpen) {
            openPathSmart(item.path, { explorerInstance: instanceApi });
          }
        });

        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!state.selectedPaths.has(item.path)) {
            state.selectedPaths = new Set([item.path]);
            syncMainSelectionClasses();
            updateStatusBar();
          }
          openFileItemContextMenu(e.clientX, e.clientY, Array.from(state.selectedPaths), state.currentPath, instanceApi);
        });
      }

      function syncMainSelectionClasses() {
        mainEl.querySelectorAll('.fe-item').forEach(el => {
          el.classList.toggle('selected', state.selectedPaths.has(el.dataset.path));
        });
      }

      function bindContainerBlankDropAndContext(viewportEl) {
        viewportEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = e.dataTransfer.types.includes('application/x-xuanji-vfs') ? 'move' : 'copy';
        });
        viewportEl.addEventListener('drop', async (e) => {
          e.preventDefault();
          const raw = e.dataTransfer.getData('application/x-xuanji-vfs');
          if (raw) {
            const payload = JSON.parse(raw);
            for (const p of (payload.paths || [])) {
              if (p.startsWith('app:') || dirName(p) === state.currentPath) continue;
              await window.fs.rename(p, joinPath(state.currentPath, baseName(p)));
            }
          } else {
            await importDataTransferToVfs(e.dataTransfer, state.currentPath);
          }
        });
        viewportEl.addEventListener('contextmenu', (e) => {
          if (e.target.closest('.fe-item')) return;
          e.preventDefault();
          showContextMenu(e.clientX, e.clientY, [
            { label: '刷新此目录', icon: Icons.refresh, action: () => refreshAll() },
            { divider: true },
            { label: '新建文件夹', icon: Icons.folder, action: () => createFolderHere() },
            { label: '新建文件', icon: Icons.plus, action: () => createFileHere() },
            { label: '导入电脑文件至此目录', icon: Icons.upload, action: () => triggerUploadFilesToDir(state.currentPath) },
            { label: '粘贴项目', icon: Icons.paste, action: () => pasteClipboardIntoDir(state.currentPath) },
            { divider: true },
            { label: '挂载电脑本地文件夹', icon: Icons.folderMount, action: () => triggerLocalFolderMountWithFeedback() }
          ]);
        });
      }

      /* 渲染模式 1：Windows 资源管理器标准左对齐连续列“详细信息视图”（右侧留白为自由框选区） */
      function renderDetailsView() {
        const totalColsW = state.columns.reduce((sum, c) => sum + c.width, 0);
        const viewport = document.createElement('div');
        viewport.className = 'fe-details-viewport';

        const header = document.createElement('div');
        header.className = 'fe-details-header';

        state.columns.forEach((col, colIdx) => {
          const hCell = document.createElement('div');
          hCell.className = 'fe-col-head';
          hCell.style.width = `${col.width}px`;
          hCell.draggable = true;
          const arrowSvg = state.sortKey === col.key
            ? `<span class="w-3 h-3 ml-1 inline-flex text-[var(--accent)]">${state.sortDir === 1 ? Icons.chevUp : Icons.chevDown}</span>`
            : '';
          hCell.innerHTML = `<span class="truncate inline-flex items-center">${col.label}${arrowSvg}</span><div class="fe-col-resizer"></div>`;

          // 点击列标题切换升序/降序
          hCell.addEventListener('click', (e) => {
            if (e.target.closest('.fe-col-resizer')) return;
            if (state.sortKey === col.key) state.sortDir *= -1;
            else { state.sortKey = col.key; state.sortDir = 1; }
            sortEntryList(state.entries);
            renderMainStage();
          });

          // 拖拽交换列顺序
          hCell.addEventListener('dragstart', (e) => {
            if (e.target.closest('.fe-col-resizer')) { e.preventDefault(); return; }
            e.dataTransfer.setData('text/x-fe-col-idx', String(colIdx));
          });
          hCell.addEventListener('dragover', (e) => {
            if (e.dataTransfer.types.includes('text/x-fe-col-idx')) {
              e.preventDefault();
              hCell.classList.add('drag-over-col');
            }
          });
          hCell.addEventListener('dragleave', () => hCell.classList.remove('drag-over-col'));
          hCell.addEventListener('drop', (e) => {
            hCell.classList.remove('drag-over-col');
            const fromStr = e.dataTransfer.getData('text/x-fe-col-idx');
            if (fromStr === '') return;
            e.stopPropagation();
            const fromIdx = Number(fromStr);
            if (fromIdx !== colIdx) {
              const [moved] = state.columns.splice(fromIdx, 1);
              state.columns.splice(colIdx, 0, moved);
              renderMainStage();
            }
          });

          // 拖拽调整列宽（兼容鼠标与移动端触摸）
          const resizer = hCell.querySelector('.fe-col-resizer');
          resizer.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            resizer.setPointerCapture(e.pointerId);
            resizer.classList.add('resizing');
            const startX = e.clientX;
            const origW = col.width;
            const onMove = (ev) => {
              col.width = Math.max(68, Math.round(origW + (ev.clientX - startX)));
              hCell.style.width = `${col.width}px`;
              const newTotal = state.columns.reduce((s, c) => s + c.width, 0);
              viewport.querySelectorAll('.fe-row').forEach(r => {
                r.style.width = `${newTotal}px`;
                const cellEl = r.children[colIdx];
                if (cellEl) cellEl.style.width = `${col.width}px`;
              });
            };
            const onUp = () => {
              resizer.classList.remove('resizing');
              resizer.removeEventListener('pointermove', onMove);
              resizer.removeEventListener('pointerup', onUp);
            };
            resizer.addEventListener('pointermove', onMove);
            resizer.addEventListener('pointerup', onUp);
          });

          header.appendChild(hCell);
        });

        const rowsWrap = document.createElement('div');
        rowsWrap.className = 'fe-details-rows';

        for (const item of state.entries) {
          const row = document.createElement('div');
          row.className = `fe-row fe-item ${state.selectedPaths.has(item.path) ? 'selected' : ''}`;
          // 关键准则：每行严格只占各列总宽度 totalColsW，绝不撑满右侧空白！右侧留白即自由框选区！
          row.style.width = `${totalColsW}px`;

          for (const col of state.columns) {
            const cell = document.createElement('div');
            cell.style.width = `${col.width}px`;
            if (col.key === 'name') {
              cell.className = 'fe-cell';
              cell.innerHTML = `
                <span class="fe-row-check"><span class="w-2.5 h-2.5">${Icons.check}</span></span>
                <span class="w-4 h-4 mr-2 shrink-0 flex items-center justify-center">${getFileIconSvg(item.name, item.isDirectory(), item.path)}</span>
                <span class="truncate">${item.name}</span>
              `;
            } else if (col.key === 'mtime') {
              cell.className = 'fe-cell muted';
              cell.textContent = formatDateTime(item.mtimeMs);
            } else if (col.key === 'type') {
              cell.className = 'fe-cell muted';
              cell.textContent = item.typeLabel;
            } else if (col.key === 'size') {
              cell.className = 'fe-cell muted';
              cell.textContent = formatBytes(item.computedSize);
            }
            row.appendChild(cell);
          }

          bindItemCommonInteractions(row, item);
          rowsWrap.appendChild(row);
        }

        if (state.entries.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'p-8 text-xs text-[var(--text-muted)] pointer-events-none';
          empty.textContent = '此文件夹为空 — 可拖入电脑本地文件或右键新建项目';
          rowsWrap.appendChild(empty);
        }

        const marqueeEl = document.createElement('div');
        marqueeEl.className = 'xj-marquee-box';

        viewport.appendChild(header);
        viewport.appendChild(rowsWrap);
        viewport.appendChild(marqueeEl);
        mainEl.appendChild(viewport);

        bindContainerBlankDropAndContext(viewport);
        state.marquee = createMarqueeSelector({
          container: viewport,
          marqueeEl,
          itemSelector: '.fe-item',
          shouldEnableTouchMarquee: () => window.innerWidth > 768 || state.mobileMarqueeMode,
          onSelectionChange: (sel) => {
            state.selectedPaths = sel;
            syncMainSelectionClasses();
            updateStatusBar();
          }
        });
      }

      /* 渲染模式 2：缩略图图标网格视图（IntersectionObserver 懒加载图片缩略图） */
      function renderGridView() {
        const viewport = document.createElement('div');
        viewport.className = 'relative flex-1 overflow-y-auto p-3';
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-2.5 items-start';

        state.thumbObserver = new IntersectionObserver((obsEntries) => {
          obsEntries.forEach(async (entry) => {
            if (!entry.isIntersecting) return;
            const imgHolder = entry.target;
            state.thumbObserver?.unobserve(imgHolder);
            const p = imgHolder.dataset.thumbPath;
            if (!p) return;
            try {
              const bytes = await window.fs.readFile(p);
              if (state.disposed) return;
              const blob = new Blob([bytes], { type: guessMimeType(p) });
              const url = URL.createObjectURL(blob);
              state.thumbUrls.add(url);
              imgHolder.innerHTML = `<img src="${url}" alt="" class="w-full h-full object-cover rounded pointer-events-none" />`;
            } catch (_) {}
          });
        }, { root: viewport, rootMargin: '80px' });

        for (const item of state.entries) {
          const card = document.createElement('div');
          card.className = `fe-grid-card fe-item relative p-2.5 rounded-md border border-transparent flex flex-col items-center gap-1.5 cursor-pointer hover:bg-[var(--bg-hover)] ${state.selectedPaths.has(item.path) ? 'selected bg-[var(--bg-active)] border-[var(--border-crisp)]' : ''}`;
          const isImg = item.isFile() && IMAGE_EXTS.has(extName(item.name));
          card.innerHTML = `
            <span class="item-check-badge"><span class="w-3 h-3">${Icons.check}</span></span>
            <div class="w-14 h-14 flex items-center justify-center overflow-hidden rounded" ${isImg ? `data-thumb-path="${item.path}"` : ''}>
              <span class="w-10 h-10 flex items-center justify-center">${getFileIconSvg(item.name, item.isDirectory(), item.path)}</span>
            </div>
            <div class="text-xs text-center truncate w-full text-[var(--text-primary)]">${item.name}</div>
            <div class="text-[10px] text-[var(--text-muted)] font-mono">${formatBytes(item.computedSize)}</div>
          `;
          bindItemCommonInteractions(card, item);
          grid.appendChild(card);

          if (isImg) {
            const holder = card.querySelector('[data-thumb-path]');
            if (holder) state.thumbObserver.observe(holder);
          }
        }

        const marqueeEl = document.createElement('div');
        marqueeEl.className = 'xj-marquee-box';
        viewport.appendChild(grid);
        viewport.appendChild(marqueeEl);
        mainEl.appendChild(viewport);

        bindContainerBlankDropAndContext(viewport);
        state.marquee = createMarqueeSelector({
          container: viewport,
          marqueeEl,
          itemSelector: '.fe-item',
          shouldEnableTouchMarquee: () => window.innerWidth > 768 || state.mobileMarqueeMode,
          onSelectionChange: (sel) => {
            state.selectedPaths = sel;
            syncMainSelectionClasses();
            updateStatusBar();
          }
        });
      }

      /* 渲染模式 3：分栏视图 (Miller Columns 多级连贯分栏) */
      async function renderColumnsView() {
        const wrap = document.createElement('div');
        wrap.className = 'flex-1 flex overflow-x-auto overflow-y-hidden h-full divide-x divide-[var(--border-subtle)]';
        mainEl.appendChild(wrap);

        const segs = state.currentPath === '/' ? [''] : state.currentPath.split('/');
        const chainPaths = [];
        let acc = '';
        segs.forEach((s, idx) => {
          chainPaths.push(idx === 0 ? '/' : (acc += '/' + s));
        });

        for (let i = 0; i < chainPaths.length; i++) {
          const colDir = chainPaths[i];
          const nextActivePath = chainPaths[i + 1] || null;
          const colEl = document.createElement('div');
          colEl.className = 'w-56 shrink-0 h-full overflow-y-auto p-1.5 flex flex-col gap-0.5';
          let items = [];
          try {
            items = await window.fs.readdir(colDir, { withFileTypes: true });
            items.sort((a, b) => (a.isDirectory() !== b.isDirectory() ? (a.isDirectory() ? -1 : 1) : naturalCompare(a.name, b.name)));
          } catch (_) {}

          for (const it of items) {
            const row = document.createElement('div');
            const isHighlighted = it.path === nextActivePath || state.selectedPaths.has(it.path);
            row.className = `fe-item px-2.5 py-1.5 rounded flex items-center justify-between gap-2 text-xs cursor-pointer ${isHighlighted ? 'bg-[var(--bg-active)] text-[var(--accent)] font-medium' : 'hover:bg-[var(--bg-hover)]'}`;
            row.innerHTML = `
              <span class="flex items-center gap-2 min-w-0">
                <span class="w-4 h-4 shrink-0">${getFileIconSvg(it.name, it.isDirectory(), it.path)}</span>
                <span class="truncate">${it.name}</span>
              </span>
              ${it.isDirectory() ? `<span class="w-3.5 h-3.5 opacity-60 shrink-0">${Icons.chevRight}</span>` : ''}

                instanceApi.navigateTo(it.path);
              } else {
                state.selectedPaths = new Set([it.path]);
                renderColumnsPreviewPane(wrap, it);
              }
            };
            row.ondblclick = () => {
              if (it.isFile()) openPathSmart(it.path, { explorerInstance: instanceApi });
            };
            row.oncontextmenu = (e) => {
              e.preventDefault();
              state.selectedPaths = new Set([it.path]);
              openFileItemContextMenu(e.clientX, e.clientY, [it.path], colDir, instanceApi);

      async function renderColumnsPreviewPane(wrap, fileStat) {
        wrap.querySelector('[data-col-preview]')?.remove();
        const pane = document.createElement('div');
        pane.dataset.colPreview = '1';
        pane.className = 'w-64 shrink-0 h-full p-4 flex flex-col items-center justify-center gap-3 text-center overflow-y-auto';

        if (state.disposed) return;

      async function createFolderHere() {

        if (name) await window.fs.mkdir(joinPath(state.currentPath, name));

      async function createFileHere() {

      // 工具栏事件绑定

      win.bodyEl.querySelectorAll('[data-fe-view]').forEach(btn => {
        btn.onclick = () => {
          state.viewMode = btn.dataset.feView;
          renderMainStage();
        };
      });

      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.searchQuery = searchInput.value;
          loadEntries().then(renderMainStage);
        }, 180);
      });

      globalBtn.onclick = () => {
        state.globalSearch = !state.globalSearch;
        globalBtn.style.background = state.globalSearch ? 'var(--accent)' : 'var(--bg-surface-0)';
        globalBtn.style.color = state.globalSearch ? 'var(--text-on-accent)' : 'var(--text-secondary)';
        searchInput.placeholder = state.globalSearch ? '全系统跨卷搜索...' : '搜索当前目录...';
        if (state.searchQuery.trim()) loadEntries().then(renderMainStage);
      };

      // 文件资源管理器键盘快捷键支持 (Ctrl+A 全选, Ctrl+C 复制, Ctrl+X 剪切, Ctrl+V 粘贴, Delete 删除, F2 重命名)
      const onExplorerKeyDown = async (e) => {
        if (OSState.activeWinId !== win.id || state.disposed) return;
        if (e.target.closest('input, textarea, select')) return;
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'a') {
          e.preventDefault();
          state.selectedPaths = new Set(state.entries.map(x => x.path));
          syncMainSelectionClasses();
          updateStatusBar();
        } else if (mod && e.key.toLowerCase() === 'c' && state.selectedPaths.size > 0) {
          e.preventDefault();
          OSState.clipboard = { mode: 'copy', paths: Array.from(state.selectedPaths) };
          showToast(`已复制 ${state.selectedPaths.size} 个项目`);
        } else if (mod && e.key.toLowerCase() === 'x' && state.selectedPaths.size > 0) {
          e.preventDefault();
          OSState.clipboard = { mode: 'cut', paths: Array.from(state.selectedPaths) };
          showToast(`已剪切 ${state.selectedPaths.size} 个项目`);
        } else if (mod && e.key.toLowerCase() === 'v') {
          e.preventDefault();
          await pasteClipboardIntoDir(state.currentPath);
        } else if (e.key === 'F2' && state.selectedPaths.size === 1) {
          e.preventDefault();
          const p = Array.from(state.selectedPaths)[0];
          const nextName = await promptTextDialog('重命名项目', '请输入新名称：', baseName(p));
          if (nextName && nextName !== baseName(p)) {
            await window.fs.rename(p, joinPath(dirName(p), nextName));
          }
        } else if (e.key === 'Delete' && state.selectedPaths.size > 0) {
          e.preventDefault();
          const list = Array.from(state.selectedPaths);
          for (const p of list) {
            const s = await window.fs.stat(p);
            if (s.isDirectory()) await window.fs.rmdir(p, { recursive: true });
            else await window.fs.unlink(p);
          }
          state.selectedPaths.clear();
        }
      };
      document.addEventListener('keydown', onExplorerKeyDown);

      const fsListener = () => refreshAll();
      OSState.fsChangeListeners.add(fsListener);
      win.onCleanup = () => {
        state.disposed = true;
        document.removeEventListener('keydown', onExplorerKeyDown);
        OSState.fsChangeListeners.delete(fsListener);
        cleanupViewResources();
      };

      refreshAll();
      return win;
    }

        width: 740,
        height: 520
      });

      let fontSize = 14;
      let autoSaveEnabled = true;
      const undoStack = [initialText];
      let undoPtr = 0;
      let autoSaveTimer = null;

      win.bodyEl.innerHTML = `
        <div class="flex flex-col h-full w-full">
          <div class="px-2.5 py-1.5 border-b border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-1.5 text-xs" style="background: var(--bg-surface-1);">

            </div>
            <label class="flex items-center gap-1.5 text-[11px] text-[var(--text-secondary)] cursor-pointer">
              <input data-np-autosave type="checkbox" checked class="accent-[var(--accent)]" />

            </label>
          </div>
          <textarea data-np-area spellcheck="false" class="flex-1 w-full p-4 outline-none resize-none leading-relaxed" style="background: var(--bg-surface-0); color: var(--text-primary); font-family: var(--font-mono); font-size: 14px;"></textarea>

      `;

      const area = win.bodyEl.querySelector('[data-np-area]');

      const posEl = win.bodyEl.querySelector('[data-np-pos]');
      const stateEl = win.bodyEl.querySelector('[data-np-state]');
      area.value = initialText;

      const updateTelemetry = () => {
        const val = area.value;
        const upToCursor = val.slice(0, area.selectionStart || 0).split('\n');
        posEl.textContent = `行 ${upToCursor.length}, 列 ${upToCursor[upToCursor.length - 1].length + 1} · 共 ${val.length} 字符`;
      };

      const saveNow = async (silent = false) => {
        if (!filePath) {
          if (silent) {
            try { localStorage.setItem(draftKey, area.value); } catch (_) {}
            stateEl.textContent = '草稿已自动暂存 · UTF-8';
            return;
          }
          const target = await promptTextDialog('保存记事本文档', '输入保存完整路径：', '/Desktop/未命名笔记.txt');
          if (!target) return;
          filePath = normPath(target);

        stateEl.textContent = `已保存至 ${filePath} (${new Date().toLocaleTimeString()})`;
        if (!silent) showToast(`已保存 "${baseName(filePath)}"`, 'success');
      };

      area.addEventListener('input', () => {
        updateTelemetry();
        // 记录撤销快照
        if (undoStack[undoPtr] !== area.value) {
          undoStack.splice(undoPtr + 1);
          undoStack.push(area.value);
          if (undoStack.length > 120) undoStack.shift();
          undoPtr = undoStack.length - 1;
        }
        try { localStorage.setItem(draftKey, area.value); } catch (_) {}
        stateEl.textContent = '编辑中...';
        if (autoSaveEnabled) {
          clearTimeout(autoSaveTimer);
          autoSaveTimer = setTimeout(() => saveNow(true), 550);
        }
      });

      area.addEventListener('keyup', updateTelemetry);
      area.addEventListener('click', updateTelemetry);
      area.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          saveNow(false);
        }
      });

      win.bodyEl.querySelector('[data-np-save]').onclick = () => saveNow(false);
      win.bodyEl.querySelector('[data-np-saveas]').onclick = async () => {
        const next = await promptTextDialog('另存为', '目标路径：', filePath || '/Desktop/笔记副本.txt');
        if (next) {
          filePath = normPath(next);
          win.setTitle(`玄玑记事本 · ${baseName(filePath)}`);
          await saveNow(false);
        }
      };
      win.bodyEl.querySelector('[data-np-undo]').onclick = () => {
        if (undoPtr > 0) {
          undoPtr--;
          area.value = undoStack[undoPtr];
          updateTelemetry();
          if (autoSaveEnabled) saveNow(true);
        }
      };
      win.bodyEl.querySelector('[data-np-redo]').onclick = () => {
        if (undoPtr < undoStack.length - 1) {
          undoPtr++;
          area.value = undoStack[undoPtr];
          updateTelemetry();
          if (autoSaveEnabled) saveNow(true);
        }
      };
      win.bodyEl.querySelector('[data-np-font-dec]').onclick = () => {
        fontSize = Math.max(11, fontSize - 1);
        area.style.fontSize = `${fontSize}px`;
        fontValEl.textContent = `${fontSize}px`;
      };
      win.bodyEl.querySelector('[data-np-font-inc]').onclick = () => {
        fontSize = Math.min(30, fontSize + 1);
        area.style.fontSize = `${fontSize}px`;
        fontValEl.textContent = `${fontSize}px`;
      };
      win.bodyEl.querySelector('[data-np-autosave]').onchange = (e) => {
        autoSaveEnabled = e.target.checked;
      };

      win.onCleanup = () => clearTimeout(autoSaveTimer);
      updateTelemetry();
      return win;
    }

    /* -------------------------------------------------------------------------
       4.2.1 结构化表格处理 (CSV / TSV 双视图：可滚动编辑表格视图 <-> 原始文本视图)
       ------------------------------------------------------------------------- */
    function parseDelimitedText(raw, sep) {
      const rows = [];
      let curRow = [];
      let curCell = '';
      let inQuotes = false;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i];
        const next = raw[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { curCell += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else curCell += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === sep) { curRow.push(curCell); curCell = ''; }
          else if (ch === '\r' && next === '\n') { curRow.push(curCell); rows.push(curRow); curRow = []; curCell = ''; i++; }
          else if (ch === '\n' || ch === '\r') { curRow.push(curCell); rows.push(curRow); curRow = []; curCell = ''; }
          else curCell += ch;
        }
      }
      if (curCell.length > 0 || curRow.length > 0) {
        curRow.push(curCell);
        rows.push(curRow);
      }
      return rows.length ? rows : [['列1', '列2', '列3'], ['', '', '']];
    }

    function serializeDelimitedRows(rows, sep) {
      return rows.map(r => r.map(cell => {
        const s = String(cell ?? '');
        if (s.includes(sep) || s.includes('"') || s.includes('\n')) {
          return `"${s.replace(/"/g, '""')}"`;
        }
        return s;
      }).join(sep)).join('\n');
    }

      let gridData = parseDelimitedText(rawContent, delimiter);

      const win = WM.createWindow({

    /* -------------------------------------------------------------------------
       4.3 HTML 编辑器 (CodeMirror 5.65.x 专业 IDE 工作台)
       包含：多语言模式自动识别、输入模式开关 (自动/电脑/手机)、保持光标格式化、
       查找替换、双端自定义导出、可拖拽上下/左右分屏与视图切换、完整状态栏与实例释放
       ------------------------------------------------------------------------- */
    const CM_LANG_MAP = {
      html:      { mode: 'htmlmixed',        label: 'HTML',       ext: 'html' },
      css:       { mode: 'css',              label: 'CSS',        ext: 'css'  },
      js:        { mode: 'javascript',       label: 'JavaScript', ext: 'js'   },
      json:      { mode: 'application/json', label: 'JSON',       ext: 'json' },
      markdown:  { mode: 'markdown',         label: 'Markdown',   ext: 'md'   },
      xml:       { mode: 'xml',              label: 'XML',        ext: 'xml'  },
      svg:       { mode: 'xml',              label: 'SVG',        ext: 'svg'  }
    };

    function detectEditorLangKeyByFilename(filename) {
      const ext = extName(filename);
      if (ext === 'html' || ext === 'htm') return 'html';
      if (ext === 'css') return 'css';
      if (ext === 'js' || ext === 'mjs') return 'js';
      if (ext === 'json') return 'json';
      if (ext === 'md' || ext === 'markdown') return 'markdown';
      if (ext === 'svg') return 'svg';
      if (ext === 'xml') return 'xml';
      return 'html';
    }

    /* 内置结构化代码格式化器（支持 HTML/XML/SVG/CSS/JS/JSON，格式化后严格还原光标行列） */
    function formatSourceCodeByLang(code, langKey) {
      if (!code || !code.trim()) return code;
      if (langKey === 'json') {
        try { return JSON.stringify(JSON.parse(code), null, 2); } catch (_) { return code; }
      }
      if (langKey === 'html' || langKey === 'xml' || langKey === 'svg') {
        const voidTags = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
        const tokens = code.replace(/>\s+</g, '>\n<').split('\n');
        let pad = 0;
        const out = [];
        for (let rawLine of tokens) {
          const line = rawLine.trim();
          if (!line) continue;
          const isClosing = /^<\/[^>]+>/.test(line);
          const openMatch = line.match(/^<([a-zA-Z0-9:-]+)/);
          const tagName = openMatch ? openMatch[1].toLowerCase() : '';
          const selfClosing = /\/>$/.test(line) || voidTags.has(tagName) || /^<!/.test(line) || /^<\?/.test(line) || /<\/[^>]+>$/.test(line);

          if (isClosing) pad = Math.max(0, pad - 1);
          out.push('  '.repeat(pad) + line);
          if (openMatch && !isClosing && !selfClosing) pad++;
        }
        return out.join('\n');
      }
      if (langKey === 'css' || langKey === 'js') {
        const normalized = code
          .replace(/\r\n/g, '\n')
          .replace(/\{\s*/g, ' {\n')
          .replace(/;\s*/g, ';\n')
          .replace(/\}\s*/g, '\n}\n');
        const lines = normalized.split('\n');
        let indent = 0;
        const result = [];
        for (const l of lines) {
          const t = l.trim();
          if (!t) continue;
          if (t.startsWith('}') || t.startsWith(']') || t.startsWith(')')) indent = Math.max(0, indent - 1);
          result.push('  '.repeat(indent) + t);
          if (t.endsWith('{') || t.endsWith('[')) indent++;
        }
        return result.join('\n');
      }
      return code;
    }

    /* 轻量 Markdown 渲染用于编辑器右侧预览 */
    function renderSimpleMarkdownHtml(mdText) {
      const esc = mdText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const body = esc
        .replace(/^### (.*)$/gm, '<h3>$1</h3>')
        .replace(/^## (.*)$/gm, '<h2>$1</h2>')
        .replace(/^# (.*)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\d+\. (.*)$/gm, '<li>$1</li>')
        .replace(/^- (.*)$/gm, '<li>$1</li>')
        .replace(/\n\n/g, '</p><p>');
      return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
        body { font-family: system-ui, sans-serif; padding: 24px 32px; background: #0f1319; color: #ece7dc; line-height: 1.75; }
        h1, h2, h3 { color: #e2b36b; border-bottom: 1px solid rgba(226,179,107,0.2); padding-bottom: 6px; }
        code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: #38bdf8; }
      </style></head><body><p>${body}</p></body></html>`;
    }

          };
        }

        updateStatusBar();
      }

      function updateStatusBar() {
        const text = getVal();
        const cursorEl = win.bodyEl.querySelector('[data-st-cursor]');
        const selEl = win.bodyEl.querySelector('[data-st-sel]');
        const totalsEl = win.bodyEl.querySelector('[data-st-totals]');
        const langEl = win.bodyEl.querySelector('[data-st-lang]');
        const dirEl = win.bodyEl.querySelector('[data-st-dir]');

        if (cmInstance) {
          const cur = cmInstance.getCursor();
          cursorEl.textContent = `行 ${cur.line + 1}, 列 ${cur.ch + 1}`;
          const selText = cmInstance.getSelection();
          if (selText && selText.length > 0) {
            selEl.textContent = `已选 ${selText.length} 字符`;
            selEl.classList.remove('hidden');
          } else {
            selEl.classList.add('hidden');
          }
          totalsEl.textContent = `共 ${cmInstance.lineCount()} 行 · ${text.length} 字符`;
        } else {
          const lines = text.split('\n').length;
          totalsEl.textContent = `共 ${lines} 行 · ${text.length} 字符`;
        }
        langEl.textContent = CM_LANG_MAP[currentLangKey].label;
        dirEl.textContent = `保存目录: ${sourceDir}`;
      }

      function buildPreviewDocumentHtml() {
        const code = getVal();
        if (currentLangKey === 'html') return code;
        if (currentLangKey === 'svg') {
          return `<!DOCTYPE html><html><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1319;">${code}</body></html>`;
        }
        if (currentLangKey === 'css') {
          return `<!DOCTYPE html><html><head><style>${code}</style></head><body style="padding:24px;background:#0f1319;color:#ece7dc;font-family:sans-serif;"><h2>CSS 样式实时沙盒预览</h2><p>在此检验您的选择器与排版规则。</p><button>测试按钮</button></body></html>`;
        }
        if (currentLangKey === 'js') {
          return `<!DOCTYPE html><html><body style="padding:20px;background:#0f1319;color:#34d399;font-family:monospace;"><div id="log"></div><script>
            const logEl = document.getElementById('log');
            console.log = (...a) => { const d = document.createElement('div'); d.textContent = '> ' + a.map(x => typeof x==='object'?JSON.stringify(x):x).join(' '); logEl.appendChild(d); };
            try { ${code} } catch(e) { console.log('Error:', e.message); }
          <\/script></body></html>`;
        }
        if (currentLangKey === 'markdown') {
          return renderSimpleMarkdownHtml(code);
        }
        return `<!DOCTYPE html><html><body style="margin:0;padding:20px;background:#0f1319;color:#ece7dc;font-family:monospace;white-space:pre-wrap;">${code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</body></html>`;
      }

      function refreshPreviewNow(showDarkMask = false) {
        if (layoutMode === 'code-only') return;
        if (showDarkMask) previewLoader.classList.remove('hidden-loader');
        const htmlDoc = buildPreviewDocumentHtml();
        previewIframe.onload = () => {
          previewLoader.classList.add('hidden-loader');
        };
        previewIframe.srcdoc = htmlDoc;
      }

      function scheduleLivePreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => refreshPreviewNow(false), 260);
      }

      function applyLayoutMode() {
        if (layoutMode === 'code-only') {
          editorPane.style.display = 'block';
          editorPane.style.width = '100%';
          editorPane.style.height = '100%';
          splitter.style.display = 'none';
          previewPane.style.display = 'none';
        } else if (layoutMode === 'preview-only') {
          editorPane.style.display = 'none';
          splitter.style.display = 'none';
          previewPane.style.display = 'block';
          refreshPreviewNow(true);
        } else if (layoutMode === 'split-v') {
          splitRoot.style.flexDirection = 'column';
          editorPane.style.display = 'block';
          previewPane.style.display = 'block';
          splitter.style.display = 'flex';
          splitter.style.width = '100%';
          splitter.style.height = '6px';
          splitter.style.cursor = 'row-resize';
          editorPane.style.width = '100%';
          editorPane.style.height = `${splitPercent}%`;
          refreshPreviewNow(false);
        } else {
          splitRoot.style.flexDirection = 'row';
          editorPane.style.display = 'block';
          previewPane.style.display = 'block';
          splitter.style.display = 'flex';
          splitter.style.width = '6px';
          splitter.style.height = '100%';
          splitter.style.cursor = 'col-resize';
          editorPane.style.height = '100%';
          editorPane.style.width = `${splitPercent}%`;
          refreshPreviewNow(false);
        }
        setTimeout(() => cmInstance?.refresh(), 30);
      }

      // 分割条拖拽调整编辑区与预览区比例
      splitter.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        splitter.setPointerCapture(e.pointerId);
        previewIframe.style.pointerEvents = 'none';
        const onMove = (ev) => {
          const r = splitRoot.getBoundingClientRect();
          if (layoutMode === 'split-v') {
            splitPercent = Math.max(15, Math.min(85, ((ev.clientY - r.top) / r.height) * 100));
            editorPane.style.height = `${splitPercent}%`;
          } else {
            splitPercent = Math.max(15, Math.min(85, ((ev.clientX - r.left) / r.width) * 100));
            editorPane.style.width = `${splitPercent}%`;
          }
          cmInstance?.refresh();
        };
        const onUp = () => {
          previewIframe.style.pointerEvents = '';
          splitter.removeEventListener('pointermove', onMove);
          splitter.removeEventListener('pointerup', onUp);
        };
        splitter.addEventListener('pointermove', onMove);
        splitter.addEventListener('pointerup', onUp);
      });

      // 保存回虚拟文件系统（有源路径存回源目录，无来源回退到 /Desktop 并刷新桌面）
      async function saveToVfs() {
        const ext = CM_LANG_MAP[currentLangKey].ext;
        if (!currentFilePath) {
          const fname = await promptTextDialog('保存到虚拟文件系统', `将保存至 ${sourceDir}，请输入文件名：`, `未命名作品.${ext}`);
          if (!fname) return;
          currentFilePath = joinPath(sourceDir, fname);
          win.setTitle(`HTML 编辑器 · ${baseName(currentFilePath)}`);
        }
        await window.fs.writeFile(currentFilePath, getVal());
        await DesktopManager.render();
        showToast(`已保存至 "${currentFilePath}"`, 'success');
      }

      // 查找与替换逻辑
      let lastSearchCursor = null;
      function toggleFindBar(forceOpen = null) {
        const shouldOpen = forceOpen !== null ? forceOpen : findBar.classList.contains('hidden');
        findBar.classList.toggle('hidden', !shouldOpen);
        findBar.classList.toggle('flex', shouldOpen);
        if (shouldOpen) win.bodyEl.querySelector('[data-find-q]').focus();
        setTimeout(() => cmInstance?.refresh(), 20);
      }

      function findMatch(reverse = false) {
        const q = win.bodyEl.querySelector('[data-find-q]').value;
        if (!q || !cmInstance || !cmInstance.getSearchCursor) return;
        const startPos = reverse ? cmInstance.getCursor('from') : cmInstance.getCursor('to');
        let cur = cmInstance.getSearchCursor(q, startPos);
        if (!cur.find(reverse)) {
          cur = cmInstance.getSearchCursor(q, reverse ? { line: cmInstance.lineCount() - 1, ch: 99999 } : { line: 0, ch: 0 });
          if (!cur.find(reverse)) {
            showToast(`未找到 "${q}"`, 'info');
            return;
          }
        }
        cmInstance.setSelection(cur.from(), cur.to());
        cmInstance.scrollIntoView({ from: cur.from(), to: cur.to() }, 60);
        lastSearchCursor = cur;
      }

      // 工具栏全按钮事件绑定
      langSelect.onchange = () => {
        currentLangKey = langSelect.value;
        if (cmInstance) cmInstance.setOption('mode', CM_LANG_MAP[currentLangKey].mode);
        updateStatusBar();
        refreshPreviewNow(false);
      };

      inputModeSelect.onchange = () => {
        inputModeChoice = inputModeSelect.value;
        const snapshot = cmInstance ? {
          value: cmInstance.getValue(),
          history: cmInstance.getHistory(),
          cursor: cmInstance.getCursor(),
          scroll: cmInstance.getScrollInfo()
        } : { value: getVal() };
        mountCodeMirrorKernel(snapshot);
        showToast(`编辑器输入模式已切换为「${inputModeSelect.options[inputModeSelect.selectedIndex].text}」`);
      };

      layoutSelect.onchange = () => {
        layoutMode = layoutSelect.value;
        applyLayoutMode();
      };

      win.bodyEl.querySelector('[data-cm-import]').onclick = () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.onchange = async () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          const txt = await f.text();
          currentLangKey = detectEditorLangKeyByFilename(f.name);
          langSelect.value = currentLangKey;
          if (cmInstance) cmInstance.setOption('mode', CM_LANG_MAP[currentLangKey].mode);
          setVal(txt);
          updateStatusBar();
          refreshPreviewNow(true);
          showToast(`已载入本地文件 "${f.name}" 并切换为 ${CM_LANG_MAP[currentLangKey].label} 模式`, 'success');
        };
        inp.click();
      };

      win.bodyEl.querySelector('[data-cm-save]').onclick = () => saveToVfs();

      // 导出功能：支持默认命名与自定义命名，支持导出到现实桌面或导出到虚拟桌面
      win.bodyEl.querySelector('[data-cm-export]').onclick = async () => {
        const ext = CM_LANG_MAP[currentLangKey].ext;
        const defaultName = currentFilePath ? baseName(currentFilePath) : `xuanji_export_${Date.now().toString().slice(-4)}.${ext}`;
        const res = await showModalDialog({
          title: '导出编辑器文档',
          bodyHtml: `
            <div class="space-y-3">
              <div>
                <label class="block mb-1 text-[var(--text-secondary)]">导出文件名（可根据需要自定义命名，默认匹配当前 ${CM_LANG_MAP[currentLangKey].label} 模式）：</label>
                <input id="cm-export-name" type="text" value="${defaultName.replace(/"/g, '&quot;')}" class="w-full px-3 py-1.5 rounded border text-xs outline-none" style="background: var(--bg-surface-1); color: var(--text-primary); border-color: var(--border-crisp);" />
              </div>
              <div>
                <label class="block mb-1 text-[var(--text-secondary)]">选择导出目标位置：</label>
                <select id="cm-export-target" class="w-full px-3 py-1.5 rounded border text-xs outline-none" style="background: var(--bg-surface-1); color: var(--text-primary); border-color: var(--border-subtle);">
                  <option value="both">同时导出至「现实物理桌面」与「虚拟桌面 (/Desktop)」</option>
                  <option value="physical">仅下载至「现实物理桌面」</option>
                  <option value="virtual">仅导出至「虚拟系统桌面 (/Desktop)」</option>
                </select>
              </div>
            </div>
          `,
          buttons: [
            { label: '取消', value: null },
            {
              label: '立即导出',
              primary: true,
              getValue: (card) => ({
                name: card.querySelector('#cm-export-name').value.trim() || defaultName,
                target: card.querySelector('#cm-export-target').value
              })
            }
          ]
        });
        if (!res) return;
        let finalName = res.name;
        if (!finalName.includes('.')) finalName += `.${ext}`;
        const codeContent = getVal();

        if (res.target === 'virtual' || res.target === 'both') {
          const vPath = joinPath('/Desktop', finalName);
          await window.fs.writeFile(vPath, codeContent);
          await DesktopManager.render();
        }
        if (res.target === 'physical' || res.target === 'both') {
          const blob = new Blob([codeContent], { type: guessMimeType(finalName) });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = finalName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 6000);
        }
        showToast(`已成功导出 "${finalName}"`, 'success');
      };

      win.bodyEl.querySelector('[data-cm-undo]').onclick = () => cmInstance?.undo();
      win.bodyEl.querySelector('[data-cm-redo]').onclick = () => cmInstance?.redo();

      // 代码格式化：严格保持光标位置不变！
      win.bodyEl.querySelector('[data-cm-format]').onclick = () => {
        const savedCursor = cmInstance ? cmInstance.getCursor() : null;
        const savedScroll = cmInstance ? cmInstance.getScrollInfo() : null;
        const formatted = formatSourceCodeByLang(getVal(), currentLangKey);
        setVal(formatted);
        if (cmInstance && savedCursor) {
          const maxLine = Math.max(0, cmInstance.lineCount() - 1);
          const safeLine = Math.min(savedCursor.line, maxLine);
          const lineLen = (cmInstance.getLine(safeLine) || '').length;
          cmInstance.setCursor({ line: safeLine, ch: Math.min(savedCursor.ch, lineLen) });
          if (savedScroll) cmInstance.scrollTo(savedScroll.left, savedScroll.top);
          cmInstance.focus();
        }
        showToast('代码格式化已完成（已保持光标位置）', 'success');
      };

      win.bodyEl.querySelector('[data-cm-find]').onclick = () => toggleFindBar();
      win.bodyEl.querySelector('[data-find-close]').onclick = () => toggleFindBar(false);
      win.bodyEl.querySelector('[data-find-next]').onclick = () => findMatch(false);
      win.bodyEl.querySelector('[data-find-prev]').onclick = () => findMatch(true);
      win.bodyEl.querySelector('[data-rep-one]').onclick = () => {
        if (!cmInstance) return;
        const rep = win.bodyEl.querySelector('[data-replace-q]').value;
        if (cmInstance.somethingSelected()) cmInstance.replaceSelection(rep);
        findMatch(false);
      };
      win.bodyEl.querySelector('[data-rep-all]').onclick = () => {
        const q = win.bodyEl.querySelector('[data-find-q]').value;
        const rep = win.bodyEl.querySelector('[data-replace-q]').value;
        if (!q) return;
        const nextVal = getVal().split(q).join(rep);
        const cur = cmInstance ? cmInstance.getCursor() : null;
        setVal(nextVal);
        if (cmInstance && cur) cmInstance.setCursor(cur);
        showToast('已完成全文替换', 'success');
      };

      win.bodyEl.querySelector('[data-cm-copyall]').onclick = async () => {
        try {
          await navigator.clipboard.writeText(getVal());
          showToast('已复制全部代码至剪贴板', 'success');
        } catch (_) {
          if (cmInstance) cmInstance.execCommand('selectAll');
          showToast('已全选代码，请按 Ctrl+C 复制');
        }
      };

      win.bodyEl.querySelector('[data-cm-clear]').onclick = () => {
        setVal('');
        cmInstance?.focus();
        showToast('已清空编辑器内容（可点击撤销恢复）');
      };

      win.bodyEl.querySelector('[data-cm-refresh]').onclick = () => refreshPreviewNow(true);

      win.bodyEl.querySelector('[data-cm-newtab]').onclick = () => {
        const blob = new Blob([buildPreviewDocumentHtml()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        createdBlobUrls.add(url);
        window.open(url, '_blank');
      };

      win.bodyEl.querySelector('[data-cm-sysbrowser]').onclick = async () => {
        if (currentFilePath) {
          await window.fs.writeFile(currentFilePath, getVal());
          openBrowserApp({ filePath: currentFilePath });
        } else {
          const tempPath = '/System/.live_preview.html';
          await window.fs.writeFile(tempPath, buildPreviewDocumentHtml());
          openBrowserApp({ filePath: tempPath });
        }
      };

      // 销毁清理防止内存泄漏
      win.onCleanup = () => {
        clearTimeout(previewTimer);
        if (cmInstance) {
          try { cmInstance.toTextArea(); } catch (_) {}
          cmInstance = null;
        }
        for (const u of createdBlobUrls) URL.revokeObjectURL(u);
        createdBlobUrls.clear();
      };

      mountCodeMirrorKernel();
      refreshPreviewNow(true);
      return win;
    }

    /* =========================================================================
       模块 11：内置应用群 Part 2
       (4.3.1 漫画阅读器 & 图片查看器 / 4.4 网页浏览器 & PDF / 4.5 计算器、画板、影音 /
        6.1 V86 硬件虚拟机 / 4.6 系统深度设置 / 即时启动器)
       ========================================================================= */

    /* -------------------------------------------------------------------------
       4.3.1 漫画阅读器 (Manga Viewer —— 严格遵循 Webtoon 无缝滚动与阻尼滑行架构)
       ------------------------------------------------------------------------- */
    async function openMangaViewerApp(opts = {}) {
      let targetFilePath = opts.filePath ? normPath(opts.filePath) : null;
      if (!targetFilePath) {
        // 从开始菜单直接启动时默认载入演示条漫卷第一页
        const fallbackDir = '/Pictures/玄玑条漫卷';
        if (await window.fs.exists(fallbackDir)) {
          const list = await window.fs.readdir(fallbackDir);
          const firstImg = list.filter(n => IMAGE_EXTS.has(extName(n))).sort(naturalCompare)[0];
          if (firstImg) targetFilePath = joinPath(fallbackDir, firstImg);
        }
      }

      if (!targetFilePath) {
        showToast('请点击任意图片文件，或在 /Pictures 中导入漫画图集', 'info');
        return openExplorerApp({ initialPath: '/Pictures' });
      }

      // 1. 提取所在目录路径（截取到最后一个 / 之前），读取同目录全部图片
      const lastSlash = targetFilePath.lastIndexOf('/');
      const folderPath = lastSlash <= 0 ? '/' : targetFilePath.slice(0, lastSlash);

      let dirFiles = [];
      try {
        dirFiles = await window.fs.readdir(folderPath, { withFileTypes: true });
      } catch (err) {
        await showModalDialog({
          title: '漫画目录读取失败',
          bodyHtml: `无法读取图片所在目录 <code>${folderPath}</code>：${err.message}`,
          buttons: [{ label: '确定', primary: true, value: true }]
        });
        return null;
      }

      // 过滤可识别的全部图片格式（不区分大小写）并执行严格自然数字排序 (1.jpg -> 2.jpg -> 10.jpg)
      const imageEntries = dirFiles
        .filter(item => item.isFile() && IMAGE_EXTS.has(extName(item.name)))
        .sort((a, b) => naturalCompare(a.name, b.name));

      if (imageEntries.length === 0) {
        await showModalDialog({
          title: '未找到图片序列',
          bodyHtml: `目录 <code>${folderPath}</code> 中没有可识别的图片文件。`,
          buttons: [{ label: '确定', primary: true, value: true }]
        });
        return null;
      }

      const targetIndex = Math.max(0, imageEntries.findIndex(x => x.path === targetFilePath));

      const win = WM.createWindow({
        appId: 'manga',
        title: `漫画阅读器 · ${baseName(folderPath)} (${targetIndex + 1}/${imageEntries.length})`,
        iconSvg: Icons.manga,
        width: 820,
        height: 680
      });

      const blobUrls = new Set();
      let disposed = false;
      let glideRafId = null;

      win.bodyEl.innerHTML = `
        <div class="manga-root-wrap">
          <!-- 顶部阅读辅助条（进入沉浸全屏后自动彻底隐藏） -->
          <div class="manga-toolbar px-3 py-1.5 border-b border-white/10 flex items-center justify-between gap-2 text-xs shrink-0" style="background: #0d1016; color: #ece7dc;">
            <div class="flex items-center gap-2 min-w-0">
              <span data-mg-progress class="font-mono text-[var(--accent)]">加载序列 0/${imageEntries.length}</span>
              <span class="text-white/40">|</span>
              <span data-mg-curpage class="truncate text-white/80">第 ${targetIndex + 1} / ${imageEntries.length} 页 · ${imageEntries[targetIndex].name}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button data-mg-open-imgviewer class="h-7 px-2.5 rounded border border-white/15 hover:bg-white/10 flex items-center gap-1 cursor-pointer">
                <span class="w-3.5 h-3.5">${Icons.image}</span><span>单图缩放查看器</span>
              </button>
              <button data-mg-fullscreen class="h-7 px-2.5 rounded flex items-center gap-1 font-semibold cursor-pointer" style="background: var(--accent); color: var(--text-on-accent);">
                <span class="w-3.5 h-3.5">${Icons.fullscreen}</span><span>沉浸全屏</span>
              </button>
            </div>
          </div>

          <!-- 全屏沉浸模式下唯一保留的右上角隐蔽退出按钮 × -->
          <button class="manga-fs-exit-btn" data-mg-exit-fs title="退出全屏沉浸模式">×</button>

          <!-- 条漫无限垂直滚动视窗（纯黑 #000 背景） -->
          <div class="manga-scroll-viewport" data-mg-viewport>
            <div class="manga-strip-column" data-mg-column></div>
          </div>
        </div>
      `;

      const viewport = win.bodyEl.querySelector('[data-mg-viewport]');
      const column = win.bodyEl.querySelector('[data-mg-column]');
      const progressEl = win.bodyEl.querySelector('[data-mg-progress]');
      const curPageEl = win.bodyEl.querySelector('[data-mg-curpage]');
      const fsBtn = win.bodyEl.querySelector('[data-mg-fullscreen]');
      const exitFsBtn = win.bodyEl.querySelector('[data-mg-exit-fs]');

      // 预先按自然排序顺序创建全部骨架占位节点（确保并行读取永不乱序，且具备固有宽高比骨架！）
      const slots = imageEntries.map((entry, idx) => {
        const slot = document.createElement('div');
        slot.className = 'manga-slot skeleton';
        slot.dataset.idx = String(idx);
        slot.innerHTML = `<div class="text-xs font-mono text-white/35">正在载入第 ${idx + 1} 页 (${entry.name})...</div>`;
        column.appendChild(slot);
        return slot;
      });

      // 先滚动定位至用户点击的那张图片骨架位置
      requestAnimationFrame(() => {
        if (slots[targetIndex]) {
          viewport.scrollTop = slots[targetIndex].offsetTop;
        }
      });

      // 并行读取所有图片二进制数据，按序就位插入 + 上方图片撑开高度增量补偿 scrollTop += deltaH 零跳动！
      let finishedCount = 0;
      let initialAnchorLocked = targetIndex > 0;

      await Promise.allSettled(imageEntries.map(async (entry, idx) => {
        try {
          const bytes = await window.fs.readFile(entry.path);
          if (disposed) return;
          const blob = new Blob([bytes], { type: guessMimeType(entry.path) });
          const url = URL.createObjectURL(blob);
          blobUrls.add(url);

          const img = new Image();
          img.decoding = 'async';
          await new Promise((res, rej) => {
            img.onload = res;
            img.onerror = rej;
            img.src = url;
          });
          if (disposed) return;

          const slot = slots[idx];
          const oldHeight = slot.offsetHeight;
          const slotTopBefore = slot.offsetTop;
          const wasAboveViewport = (slotTopBefore + oldHeight) <= (viewport.scrollTop + 32);

          slot.innerHTML = '';
          slot.classList.remove('skeleton');
          slot.appendChild(img);

          // 关键防抖补偿：当当前视口上方的异步图片解码完成导致高度变化时，同步补偿 scrollTop += deltaH
          const newHeight = slot.offsetHeight;
          const deltaH = newHeight - oldHeight;
          if (initialAnchorLocked && idx < targetIndex) {
            viewport.scrollTop += deltaH;
          } else if (!initialAnchorLocked && wasAboveViewport && deltaH !== 0) {
            viewport.scrollTop += deltaH;
          }
          if (idx === targetIndex && initialAnchorLocked) {
            viewport.scrollTop = slot.offsetTop;
            initialAnchorLocked = false;
          }
        } catch (err) {
          // 单张读取失败容错：不中断整体加载，仅在该槽位显示轻量提示后继续渲染其余图片
          if (!disposed && slots[idx]) {
            slots[idx].classList.remove('skeleton');
            slots[idx].style.height = '140px';
            slots[idx].innerHTML = `<div class="text-xs font-mono text-red-400/80 px-4 text-center">第 ${idx + 1} 页 (${entry.name}) 读取失败，已自动跳过</div>`;
          }
        } finally {
          finishedCount++;
          if (!disposed) {
            progressEl.textContent = finishedCount >= imageEntries.length
              ? `共 ${imageEntries.length} 页已就绪`
              : `加载中 ${finishedCount}/${imageEntries.length}`;
          }
        }
      }));

      // 滚动时实时指示当前阅读页码
      let currentVisibleIdx = targetIndex;
      viewport.addEventListener('scroll', () => {
        const midY = viewport.scrollTop + viewport.clientHeight * 0.35;
        for (let i = 0; i < slots.length; i++) {
          const s = slots[i];
          if (s.offsetTop <= midY && s.offsetTop + s.offsetHeight >= midY) {
            if (currentVisibleIdx !== i) {
              currentVisibleIdx = i;
              curPageEl.textContent = `第 ${i + 1} / ${imageEntries.length} 页 · ${imageEntries[i].name}`;
              win.setTitle(`漫画阅读器 · ${baseName(folderPath)} (${i + 1}/${imageEntries.length})`);
            }
            break;
          }
        }
      }, { passive: true });

      // PC 端 Pointer Events 手抓拖拽 + 单例 requestAnimationFrame FRICTION = 0.96 物理阻尼滑行
      // 移动端 (pointerType === 'touch') 完全交由合成器原生 120fps touch-action: pan-y 滚动，确保全屏触控丝滑不卡死！
      let isMouseGrabbing = false;
      let lastPointerY = 0;
      let lastPointerTime = 0;
      let velocityY = 0;
      const FRICTION = 0.96;

      function stopMomentumGlide() {
        if (glideRafId !== null) {
          cancelAnimationFrame(glideRafId);
          glideRafId = null;
        }
      }

      function startMomentumGlide() {
        stopMomentumGlide();
        const step = () => {
          if (Math.abs(velocityY) < 0.35 || disposed) {
            glideRafId = null;
            return;
          }
          const prev = viewport.scrollTop;
          viewport.scrollTop += velocityY;
          velocityY *= FRICTION;
          // 触顶或触底立即终止物理滑行
          if (viewport.scrollTop === prev && Math.abs(velocityY) > 1) {
            glideRafId = null;
            return;
          }
          glideRafId = requestAnimationFrame(step);
        };
        glideRafId = requestAnimationFrame(step);
      }

      viewport.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        stopMomentumGlide();
        isMouseGrabbing = true;
        lastPointerY = e.clientY;
        lastPointerTime = performance.now();
        velocityY = 0;
        viewport.classList.add('grabbing');
        viewport.setPointerCapture(e.pointerId);
      });

      viewport.addEventListener('pointermove', (e) => {
        if (!isMouseGrabbing || e.pointerType !== 'mouse') return;
        const now = performance.now();
        const dy = lastPointerY - e.clientY;
        const dt = Math.max(1, now - lastPointerTime);
        viewport.scrollTop += dy;
        // 平滑采样瞬时速度（换算到 16.67ms 帧步长）
        const frameV = (dy / dt) * 16.67;
        velocityY = velocityY * 0.45 + frameV * 0.55;
        lastPointerY = e.clientY;
        lastPointerTime = now;
      });

      const finishMouseGrab = (e) => {
        if (!isMouseGrabbing || e.pointerType !== 'mouse') return;
        isMouseGrabbing = false;
        viewport.classList.remove('grabbing');
        if (performance.now() - lastPointerTime < 80 && Math.abs(velocityY) > 0.8) {
          startMomentumGlide();
        }
      };
      viewport.addEventListener('pointerup', finishMouseGrab);
      viewport.addEventListener('pointercancel', finishMouseGrab);
      viewport.addEventListener('wheel', () => stopMomentumGlide(), { passive: true });

      // 全屏沉浸模式（兼容浏览器原生 Fullscreen API 的进入与退出双路径，自动隐藏窗口标题栏仅留右上角 ×）
      async function enterImmersiveFullscreen() {
        win.el.classList.add('manga-immersive-fullscreen');
        if (win.el.requestFullscreen) {
          try { await win.el.requestFullscreen(); } catch (_) {}
        }
      }

      async function exitImmersiveFullscreen() {
        win.el.classList.remove('manga-immersive-fullscreen');
        if (document.fullscreenElement === win.el && document.exitFullscreen) {
          try { await document.exitFullscreen(); } catch (_) {}
        }
      }

      const onNativeFsChange = () => {
        if (!document.fullscreenElement && win.el.classList.contains('manga-immersive-fullscreen')) {
          win.el.classList.remove('manga-immersive-fullscreen');
        }
      };
      document.addEventListener('fullscreenchange', onNativeFsChange);

      fsBtn.onclick = () => enterImmersiveFullscreen();
      exitFsBtn.onclick = (e) => {
        e.stopPropagation();
        exitImmersiveFullscreen();
      };
      win.bodyEl.querySelector('[data-mg-open-imgviewer]').onclick = () => {
        const curEntry = imageEntries[currentVisibleIdx] || imageEntries[0];
        if (curEntry) openImageViewerApp({ filePath: curEntry.path });
      };

      win.onCleanup = () => {
        disposed = true;
        stopMomentumGlide();
        document.removeEventListener('fullscreenchange', onNativeFsChange);
        if (document.fullscreenElement === win.el) {
          document.exitFullscreen().catch(() => {});
        }
        for (const u of blobUrls) URL.revokeObjectURL(u);
        blobUrls.clear();
      };

      return win;
    }

       精密图片查看器 (Image Viewer —— 缩放、拖拽平移、旋转、同目录翻页、设壁纸)

    async function openImageViewerApp(opts = {}) {

      const win = WM.createWindow({
        appId: 'image',
        title: `精密图片查看器 · ${baseName(filePath)}`,

        height: 580
      });

      let scale = 1;
      let rot = 0;
      let panX = 0;
      let panY = 0;
      let currentUrl = null;
      let siblings = [];
      let sibIdx = 0;

      win.bodyEl.innerHTML = `
        <div class="flex flex-col h-full w-full">
          <div class="px-3 py-1.5 border-b border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-1.5 text-xs" style="background: var(--bg-surface-1);">
            <div class="flex items-center gap-1">

              <span data-iv-zoom-txt class="px-2 font-mono text-[var(--accent)]">100%</span>
              <button data-iv-zin class="h-7 px-2 rounded hover:bg-[var(--bg-hover)] cursor-pointer font-mono">+</button>
              <button data-iv-reset class="h-7 px-2 rounded hover:bg-[var(--bg-hover)] cursor-pointer">1:1 复位</button>
              <button data-iv-rot class="h-7 px-2 rounded hover:bg-[var(--bg-hover)] cursor-pointer">旋转 90°</button>
            </div>
            <div class="flex items-center gap-1.5">
              <button data-iv-manga class="h-7 px-2.5 rounded hover:bg-[var(--bg-hover)] flex items-center gap-1 cursor-pointer"><span class="w-3.5 h-3.5">${Icons.manga}</span><span>条漫模式</span></button>

            </div>
          </div>
          <div data-iv-stage class="flex-1 overflow-hidden relative flex items-center justify-center cursor-grab" style="background: radial-gradient(circle, #181e28 0%, #0a0c10 100%); touch-action: none;">
            <img data-iv-img alt="" class="max-w-full max-h-full object-contain transition-transform duration-75 pointer-events-none" />
          </div>
        </div>
      `;

      const stage = win.bodyEl.querySelector('[data-iv-stage]');
      const imgEl = win.bodyEl.querySelector('[data-iv-img]');
      const zoomTxt = win.bodyEl.querySelector('[data-iv-zoom-txt]');

      const applyTransform = () => {
        imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale}) rotate(${rot}deg)`;
        zoomTxt.textContent = `${Math.round(scale * 100)}%`;
      };

      const loadFile = async (p) => {
        filePath = normPath(p);
        try {
          const dir = dirName(filePath);
          const all = await window.fs.readdir(dir, { withFileTypes: true });
          siblings = all.filter(x => x.isFile() && IMAGE_EXTS.has(extName(x.name))).sort((a, b) => naturalCompare(a.name, b.name));
          sibIdx = Math.max(0, siblings.findIndex(x => x.path === filePath));

          const bytes = await window.fs.readFile(filePath);
          if (currentUrl) URL.revokeObjectURL(currentUrl);
          currentUrl = URL.createObjectURL(new Blob([bytes], { type: guessMimeType(filePath) }));
          imgEl.src = currentUrl;
          scale = 1; rot = 0; panX = 0; panY = 0;
          applyTransform();
          win.setTitle(`精密图片查看器 · ${baseName(filePath)}`);
        } catch (err) {
          showToast(`无法加载图片: ${err.message}`, 'error');
        }
      };

      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        scale = Math.max(0.1, Math.min(8, scale * (e.deltaY < 0 ? 1.12 : 0.89)));
        applyTransform();
      }, { passive: false });

      let dragging = false, sx = 0, sy = 0;
      stage.addEventListener('pointerdown', (e) => {
        dragging = true; sx = e.clientX - panX; sy = e.clientY - panY;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        panX = e.clientX - sx; panY = e.clientY - sy;
        applyTransform();
      });
      stage.addEventListener('pointerup', () => { dragging = false; });

      win.bodyEl.querySelector('[data-iv-zin]').onclick = () => { scale = Math.min(8, scale * 1.25); applyTransform(); };
      win.bodyEl.querySelector('[data-iv-zout]').onclick = () => { scale = Math.max(0.1, scale / 1.25); applyTransform(); };
      win.bodyEl.querySelector('[data-iv-reset]').onclick = () => { scale = 1; rot = 0; panX = 0; panY = 0; applyTransform(); };
      win.bodyEl.querySelector('[data-iv-rot]').onclick = () => { rot = (rot + 90) % 360; applyTransform(); };
      win.bodyEl.querySelector('[data-iv-prev]').onclick = () => {
        if (siblings.length > 1) loadFile(siblings[(sibIdx - 1 + siblings.length) % siblings.length].path);
      };
      win.bodyEl.querySelector('[data-iv-next]').onclick = () => {
        if (siblings.length > 1) loadFile(siblings[(sibIdx + 1) % siblings.length].path);
      };
      win.bodyEl.querySelector('[data-iv-manga]').onclick = () => openMangaViewerApp({ filePath });
      win.bodyEl.querySelector('[data-iv-wp]').onclick = async () => {
        OSState.settings.wallpaperType = 'custom';
        OSState.settings.customWallpaperPath = filePath;
        saveSettings();
        await applyVisualSettings();
        showToast('已设为桌面壁纸', 'success');
      };

      win.onCleanup = () => { if (currentUrl) URL.revokeObjectURL(currentUrl); };
      await loadFile(filePath);
      return win;
    }

    async function openBrowserApp(opts = {}) {
      let currentVfsFile = opts.filePath ? normPath(opts.filePath) : null;

        title: currentVfsFile ? `织渊浏览器 · ${baseName(currentVfsFile)}` : '织渊网页浏览器',
        iconSvg: Icons.browser,
        width: 980,
        height: 640
      });

      const blobUrls = new Set();
      const historyStack = [defaultUrl];
      let histPtr = 0;

      win.bodyEl.innerHTML = `
        <div class="flex flex-col h-full w-full">
          <div class="px-2.5 py-1.5 border-b border-[var(--border-subtle)] flex items-center gap-1.5 text-xs" style="background: var(--bg-surface-1);">

            <button data-br-fwd class="w-7 h-7 rounded flex items-center justify-center hover:bg-[var(--bg-hover)] cursor-pointer"><span class="w-4 h-4">${Icons.chevRight}</span></button>

            <input data-br-addr type="text" value="${defaultUrl}" class="flex-1 h-7 px-3 rounded border text-xs outline-none font-mono" style="background: var(--bg-surface-0); color: var(--text-primary); border-color: var(--border-subtle);" />
            <button data-br-go class="h-7 px-3 rounded font-medium cursor-pointer" style="background: var(--accent); color: var(--text-on-accent);">前往</button>
            <button data-br-editsrc class="h-7 px-2.5 rounded border border-[var(--border-crisp)] hover:bg-[var(--bg-hover)] flex items-center gap-1 cursor-pointer text-[var(--accent)] ${currentVfsFile ? '' : 'hidden'}">

          </div>
          <div class="px-3 py-1 border-b border-[var(--border-subtle)] flex items-center gap-2 text-[11px] overflow-x-auto" style="background: var(--bg-surface-0);">
