      const meta = getAppMeta(appId);
      return meta.launch(opts);
    }

    function hideAllFloatingPanels() {
      document.getElementById('start-menu-panel')?.classList.add('hidden');
      document.getElementById('calendar-panel')?.classList.add('hidden');
      document.getElementById('context-menu')?.classList.add('hidden');
      document.getElementById('taskbar-peek-card')?.classList.add('hidden');
      document.body.classList.remove('aero-peek-single');
    }

    /* 通用模态弹窗系统（输入命名、确认操作、HTML 双入口选择等） */
    function showModalDialog({ title, bodyHtml, buttons = [] }) {
      return new Promise((resolve) => {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.innerHTML = '';
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');

        const card = document.createElement('div');
        card.className = 'w-full max-w-md rounded-lg border p-5 shadow-2xl';
        card.style.background = 'var(--bg-glass-heavy)';
        card.style.borderColor = 'var(--border-crisp)';
        card.style.borderRadius = 'var(--win-radius)';
        card.innerHTML = `
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-[var(--border-subtle)]">
            <h3 class="text-sm font-semibold tracking-wide text-[var(--text-primary)]">${title}</h3>
            <button data-modal-close class="w-6 h-6 rounded flex items-center justify-center text-[var(--text-secondary)] hover:text-[var(--text-primary)] cursor-pointer">${Icons.close}</button>
          </div>
          <div class="modal-content text-xs text-[var(--text-secondary)] leading-relaxed mb-4">${bodyHtml}</div>
          <div class="modal-actions flex items-center justify-end gap-2"></div>
        `;

        const closeWith = (val) => {
          backdrop.classList.add('hidden');
          backdrop.classList.remove('flex');
          backdrop.innerHTML = '';
          resolve(val);
        };

        card.querySelector('[data-modal-close]').onclick = () => closeWith(null);
        const actionsEl = card.querySelector('.modal-actions');
        for (const b of buttons) {
          const btn = document.createElement('button');
          btn.className = 'px-3.5 py-1.5 rounded text-xs font-medium cursor-pointer transition-all border';
          if (b.primary) {
            btn.style.background = 'var(--accent)';
            btn.style.color = 'var(--text-on-accent)';
            btn.style.borderColor = 'var(--accent)';
          } else if (b.danger) {
            btn.style.background = 'var(--danger)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--danger)';
          } else {
            btn.style.background = 'var(--bg-surface-2)';
            btn.style.color = 'var(--text-primary)';
            btn.style.borderColor = 'var(--border-subtle)';
          }
          btn.textContent = b.label;
          btn.onclick = () => {
            const val = b.getValue ? b.getValue(card) : b.value;
            closeWith(val);
          };
          actionsEl.appendChild(btn);
        }

        backdrop.appendChild(card);
        const firstInput = card.querySelector('input, select');
        if (firstInput) {
          setTimeout(() => {
            firstInput.focus();
            if (firstInput.select) firstInput.select();
          }, 30);
          firstInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              const primaryBtn = buttons.find(x => x.primary);
              if (primaryBtn) closeWith(primaryBtn.getValue ? primaryBtn.getValue(card) : primaryBtn.value);
            } else if (e.key === 'Escape') {
              closeWith(null);
            }
          });
        }
      });
    }

    async function promptTextDialog(title, label, defaultValue = '') {
      return showModalDialog({
        title,
        bodyHtml: `
          <label class="block mb-1.5 text-[var(--text-secondary)]">${label}</label>
          <input id="xj-prompt-input" type="text" value="${defaultValue.replace(/"/g, '&quot;')}"
            class="w-full px-3 py-2 rounded text-xs outline-none border"
            style="background: var(--bg-surface-1); color: var(--text-primary); border-color: var(--border-crisp);" />
        `,
        buttons: [
          { label: '取消', value: null },
          { label: '确认', primary: true, getValue: (card) => card.querySelector('#xj-prompt-input').value.trim() }
        ]
      });
    }

    /* 自定义右键菜单渲染器 */
    function showContextMenu(clientX, clientY, menuItems) {
      const menu = document.getElementById('context-menu');
      menu.innerHTML = '';
      for (const item of menuItems) {
        if (item.divider) {
          const hr = document.createElement('div');
          hr.className = 'my-1 border-t border-[var(--border-subtle)]';
          menu.appendChild(hr);
          continue;
        }
        const row = document.createElement('button');
        row.className = 'w-full px-3 py-1.5 flex items-center justify-between gap-4 text-left text-xs transition-colors cursor-pointer';
        row.style.color = item.danger ? 'var(--danger)' : 'var(--text-primary)';
        row.onmouseenter = () => { row.style.background = 'var(--bg-hover)'; };
        row.onmouseleave = () => { row.style.background = 'transparent'; };
        row.innerHTML = `
          <span class="flex items-center gap-2.5 min-w-0">
            <span class="w-4 h-4 shrink-0 opacity-85">${item.icon || ''}</span>
            <span class="truncate">${item.label}</span>
          </span>
          ${item.hint ? `<span class="text-[10.5px] text-[var(--text-muted)] font-mono shrink-0">${item.hint}</span>` : ''}
        `;
        row.onclick = (e) => {
          e.stopPropagation();
          menu.classList.add('hidden');
          if (typeof item.action === 'function') item.action();
        };
        menu.appendChild(row);
      }
      menu.classList.remove('hidden');
      const rect = menu.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - 8;
      const maxY = window.innerHeight - rect.height - 8;
      menu.style.left = `${Math.max(8, Math.min(clientX, maxX))}px`;
      menu.style.top = `${Math.max(8, Math.min(clientY, maxY))}px`;
    }

    /* =========================================================================
       8.5 统一智能文件/文件夹分派（对所有虚拟路径与本地挂载路径 100% 统一生效）
       ========================================================================= */
    async function openPathSmart(targetPath, options = {}) {
      const clean = normPath(targetPath);
      try {
        const st = await window.fs.stat(clean);
        if (st.isDirectory()) {
          if (options.explorerInstance) {
            options.explorerInstance.navigateTo(clean);
          } else {
            openExplorerApp({ initialPath: clean });
          }
          return;
        }

        const ext = extName(clean);
        if (options.openWith) {
          return openFileWithApp(clean, options.openWith);
        }

        // .HTML 文件专用交互：提供「在系统浏览器中打开」与「编辑源代码（实时预览）」双主入口

          const choice = await showModalDialog({
            title: `打开 HTML 文档 · ${st.name}`,

                <button id="html-act-browser" class="p-3 rounded border text-left flex items-center gap-3 cursor-pointer transition-all hover:border-[var(--accent)]" style="background: var(--bg-surface-1); border-color: var(--border-subtle);">
                  <span class="w-7 h-7 text-[#60a5fa] shrink-0">${Icons.browser}</span>
                  <div>
                    <div class="font-semibold text-[var(--text-primary)] text-xs">在系统浏览器中打开</div>
                    <div class="text-[11px] text-[var(--text-secondary)]">使用内置织渊网页浏览器加载 Blob URL 渲染完整页面</div>
                  </div>
                </button>
                <button id="html-act-editor" class="p-3 rounded border text-left flex items-center gap-3 cursor-pointer transition-all hover:border-[var(--accent)]" style="background: var(--bg-surface-1); border-color: var(--border-subtle);">
                  <span class="w-7 h-7 text-[#38bdf8] shrink-0">${Icons.code}</span>
                  <div>
                    <div class="font-semibold text-[var(--text-primary)] text-xs">编辑源代码（右侧实时预览）</div>
                    <div class="text-[11px] text-[var(--text-secondary)]">使用专业代码编辑器修改源码并保存回 OPFS / 原目录</div>
                  </div>
                </button>
              </div>
            `,
            buttons: [
              { label: '取消', value: null },
              { label: '浏览器打开', value: 'browser' },
              { label: '编辑源代码', primary: true, value: 'editor' }
            ]
          });
          if (choice === 'browser') return openBrowserApp({ filePath: clean });
          if (choice === 'editor') return openHtmlEditorApp({ filePath: clean });
          return null;
        }

        // 图片默认调用条漫阅读器（右键或工具栏可切换精密图片查看器）
        if (IMAGE_EXTS.has(ext)) {
          return openMangaViewerApp({ filePath: clean });
        }
        // CSV / TSV 表格自动双视图打开
        if (SHEET_EXTS.has(ext)) {
          return openSpreadsheetApp({ filePath: clean });
        }
        // 音频与视频
        if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext)) {
          return openMediaPlayerApp({ filePath: clean });
        }
        // PDF 内置查看器
        if (ext === 'pdf') {
          return openPdfViewerApp({ filePath: clean });
        }
        // 压缩包弹出解压向导
        if (ARCHIVE_EXTS.has(ext)) {
          return promptExtractArchiveDialog(clean);
        }
        // 虚拟机磁盘/光盘镜像
        if (VM_EXTS.has(ext)) {
          return openV86App({ imagePath: clean });
        }
        // 代码类（CSS / JS / JSON / XML）打开至代码编辑器，其余及任何未列出的 MIME 类型统一用记事本纯文本打开
        if (['css', 'js', 'mjs', 'json', 'xml'].includes(ext)) {
          return openHtmlEditorApp({ filePath: clean });
        }
        return openNotepadApp({ filePath: clean });
      } catch (err) {
        showToast(`无法打开 "${clean}": ${err.message}`, 'error');
      }
    }

    // 绑定 HTML 双入口大卡片点击委托
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      const btnBrowser = e.target.closest('#html-act-browser');
      const btnEditor = e.target.closest('#html-act-editor');
      if (btnBrowser || btnEditor) {
        const pathAttr = document.getElementById('modal-backdrop').dataset.pendingHtmlPath;
        document.querySelector('[data-modal-close]')?.click();
        if (pathAttr) {
          if (btnBrowser) openBrowserApp({ filePath: pathAttr });
          if (btnEditor) openHtmlEditorApp({ filePath: pathAttr });
        }
      }
    });

    function openFileWithApp(filePath, appId) {
      switch (appId) {
        case 'code': return openHtmlEditorApp({ filePath });
        case 'notepad': return openNotepadApp({ filePath });
        case 'browser': return openBrowserApp({ filePath });
        case 'manga': return openMangaViewerApp({ filePath });
        case 'image': return openImageViewerApp({ filePath });
        case 'sheet': return openSpreadsheetApp({ filePath });
        case 'media': return openMediaPlayerApp({ filePath });
        case 'pdf': return openPdfViewerApp({ filePath });
        case 'paint': return openPaintApp({ filePath });
        case 'vm': return openV86App({ imagePath: filePath });
        default: return openNotepadApp({ filePath });
      }
    }

    async function promptExtractArchiveDialog(archivePath) {
      const stem = baseName(archivePath).replace(/\.(tar\.gz|tgz|zip|7z|rar|gz|tar|bz2|xz)$/i, '') || 'extracted';
      const defaultTarget = joinPath(dirName(archivePath), stem);
      const dest = await promptTextDialog('解压归档文件', '解压输出目标路径（自动保留文件原始修改时间）：', defaultTarget);
      if (!dest) return;
      try {
        showToast(`正在解压 "${baseName(archivePath)}" ...`, 'info');
        const count = await ArchiveEngine.extractArchive(archivePath, normPath(dest));
        showToast(`解压完成，共释放 ${count} 个文件至 ${dest}`, 'success');
        notifyFsChanged(dirName(dest));
      } catch (err) {
        showToast(`解压失败: ${err.message}`, 'error');
      }
    }

    /* =========================================================================
       模块 7：窗口管理器 (WM) —— 八向缩放、Aero Snap 吸附预览、Aero Peek 透视
       ========================================================================= */
    const WM = {
      createWindow({ appId, title, iconSvg, width = 840, height = 560, onCleanup = null }) {
        const winId = `win_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const layer = document.getElementById('windows-layer');
        const layerRect = layer.getBoundingClientRect();

        const isMobile = window.innerWidth <= 768;
        const w = isMobile ? Math.min(layerRect.width - 12, width) : Math.min(width, layerRect.width - 24);
        const h = isMobile ? Math.min(layerRect.height - 12, height) : Math.min(height, layerRect.height - 24);
        const cascadeOffset = (OSState.windows.size % 6) * 24;
        const left = isMobile ? 6 : Math.max(12, Math.min(layerRect.width - w - 12, Math.round((layerRect.width - w) / 2) + cascadeOffset));
        const top = isMobile ? 6 : Math.max(10, Math.min(layerRect.height - h - 10, Math.round((layerRect.height - h) / 2) + cascadeOffset));

        const el = document.createElement('article');
        el.className = 'os-window active';
        el.id = winId;
        el.style.left = `${left}px`;
        el.style.top = `${top}px`;
        el.style.width = `${w}px`;
        el.style.height = `${h}px`;
        el.style.zIndex = String(++OSState.zIndexSeed);

        el.innerHTML = `
          <header class="win-titlebar">
            <div class="win-title-group">
              <span class="w-4 h-4 shrink-0" style="color: var(--accent);">${iconSvg || Icons.astrolabe}</span>
              <span class="win-title-text">${title}</span>
            </div>
            <div class="win-controls">
              <button class="win-ctrl-btn min-btn" title="最小化">${Icons.min}</button>
              <button class="win-ctrl-btn max-btn" title="最大化 / 还原">${Icons.max}</button>
              <button class="win-ctrl-btn close-btn" title="关闭窗口">${Icons.close}</button>
            </div>
          </header>
          <div class="win-body"></div>
          <div class="win-resizer r-n" data-dir="n"></div>
          <div class="win-resizer r-s" data-dir="s"></div>
          <div class="win-resizer r-w" data-dir="w"></div>
          <div class="win-resizer r-e" data-dir="e"></div>
          <div class="win-resizer r-nw" data-dir="nw"></div>
          <div class="win-resizer r-ne" data-dir="ne"></div>
          <div class="win-resizer r-sw" data-dir="sw"></div>
          <div class="win-resizer r-se" data-dir="se"></div>
        `;

        const winRecord = {
          id: winId,
          appId,
          title,
          iconSvg: iconSvg || Icons.astrolabe,
          el,
          bodyEl: el.querySelector('.win-body'),
          minimized: false,
          maximized: false,
          snapped: false,
          restoreBounds: { left, top, width: w, height: h },
          onCleanup,
          setTitle(newTitle) {
            this.title = newTitle;
            el.querySelector('.win-title-text').textContent = newTitle;
            renderTaskbar();
          }
        };

        if (isMobile) {
          this._applyMaximize(winRecord, true);
        }

        // 置顶焦点与按钮交互
        el.addEventListener('pointerdown', () => this.focusWindow(winId));
        el.querySelector('.min-btn').onclick = (e) => { e.stopPropagation(); this.minimizeWindow(winId); };
        el.querySelector('.max-btn').onclick = (e) => { e.stopPropagation(); this.toggleMaximize(winId); };
        el.querySelector('.close-btn').onclick = (e) => { e.stopPropagation(); this.closeWindow(winId); };
        el.querySelector('.win-titlebar').addEventListener('dblclick', (e) => {
          if (!e.target.closest('.win-controls')) this.toggleMaximize(winId);
        });

        this._bindTitlebarDragAndAeroSnap(winRecord);
        this._bindEightWayResize(winRecord);

        layer.appendChild(el);
        OSState.windows.set(winId, winRecord);
        this.focusWindow(winId);
        renderTaskbar();
        return winRecord;
      },

      focusWindow(winId) {
        const target = OSState.windows.get(winId);
        if (!target) return;
        if (target.minimized) {
          target.minimized = false;
          target.el.classList.remove('minimized');
        }
        OSState.activeWinId = winId;
        target.el.style.zIndex = String(++OSState.zIndexSeed);
        for (const [id, w] of OSState.windows.entries()) {
          w.el.classList.toggle('active', id === winId);
        }
        renderTaskbar();
      },

      minimizeWindow(winId) {
        const w = OSState.windows.get(winId);
        if (!w) return;
        w.minimized = true;
        w.el.classList.add('minimized');
        w.el.classList.remove('active');
        if (OSState.activeWinId === winId) OSState.activeWinId = null;
        renderTaskbar();
      },

      _applyMaximize(w, flag) {
        const maxBtn = w.el.querySelector('.max-btn');
        if (flag) {
          if (!w.maximized && !w.snapped) {
            w.restoreBounds = {
              left: w.el.offsetLeft,
              top: w.el.offsetTop,
              width: w.el.offsetWidth,
              height: w.el.offsetHeight
            };
          }
          w.maximized = true;
          w.snapped = false;
          w.el.classList.add('maximized');
          maxBtn.innerHTML = Icons.restore;
        } else {
          w.maximized = false;
          w.el.classList.remove('maximized');
          w.el.style.left = `${w.restoreBounds.left}px`;
          w.el.style.top = `${w.restoreBounds.top}px`;
          w.el.style.width = `${w.restoreBounds.width}px`;
          w.el.style.height = `${w.restoreBounds.height}px`;
          maxBtn.innerHTML = Icons.max;
        }
        window.dispatchEvent(new Event('resize'));
      },

      toggleMaximize(winId) {
        const w = OSState.windows.get(winId);
        if (!w) return;
        this._applyMaximize(w, !w.maximized);
      },

      closeWindow(winId) {
        const w = OSState.windows.get(winId);
        if (!w) return;
        if (typeof w.onCleanup === 'function') {
          try { w.onCleanup(); } catch (_) {}
        }
        w.el.remove();
        OSState.windows.delete(winId);
        if (OSState.activeWinId === winId) {
          const remaining = Array.from(OSState.windows.values()).filter(x => !x.minimized);
          remaining.sort((a, b) => Number(b.el.style.zIndex) - Number(a.el.style.zIndex));
          OSState.activeWinId = remaining[0] ? remaining[0].id : null;
          if (OSState.activeWinId) this.focusWindow(OSState.activeWinId);
        }
        renderTaskbar();
      },

      /* 窗口拖拽 + Aero Snap（支持左半屏、右半屏、顶部最大化、四角四分屏象限吸附） */
      _bindTitlebarDragAndAeroSnap(w) {
        const bar = w.el.querySelector('.win-titlebar');
        const phantom = document.getElementById('aero-snap-phantom');
        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;
        let pendingSnapZone = null;

        const computeSnapZone = (cx, cy) => {
          if (!OSState.settings.aeroSnap) return null;
          const layerRect = document.getElementById('windows-layer').getBoundingClientRect();
          const W = layerRect.width;
          const H = layerRect.height;
          const edge = 14;
          const corner = 38;

          const nearL = cx <= edge;
          const nearR = cx >= W - edge;
          const nearT = cy <= edge;
          const nearB = cy >= H - edge;

          if (nearL && cy <= corner) return { type: 'tl', left: 0, top: 0, width: Math.round(W / 2), height: Math.round(H / 2) };
          if (nearR && cy <= corner) return { type: 'tr', left: Math.round(W / 2), top: 0, width: Math.round(W / 2), height: Math.round(H / 2) };
          if (nearL && (nearB || cy >= H - corner)) return { type: 'bl', left: 0, top: Math.round(H / 2), width: Math.round(W / 2), height: Math.round(H / 2) };
          if (nearR && (nearB || cy >= H - corner)) return { type: 'br', left: Math.round(W / 2), top: Math.round(H / 2), width: Math.round(W / 2), height: Math.round(H / 2) };
          if (nearT) return { type: 'max', left: 0, top: 0, width: W, height: H };
          if (nearL) return { type: 'left', left: 0, top: 0, width: Math.round(W / 2), height: H };
          if (nearR) return { type: 'right', left: Math.round(W / 2), top: 0, width: Math.round(W / 2), height: H };
          return null;
        };

        bar.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          if (e.target.closest('.win-controls')) return;
          hideAllFloatingPanels();
          dragging = true;
          bar.setPointerCapture(e.pointerId);

          if (w.maximized || w.snapped) {
            const ratio = e.clientX / Math.max(1, w.el.offsetWidth);
            const restoredW = w.restoreBounds.width;
            w.maximized = false;
            w.snapped = false;
            w.el.classList.remove('maximized');
            w.el.querySelector('.max-btn').innerHTML = Icons.max;
            w.el.style.width = `${restoredW}px`;
            w.el.style.height = `${w.restoreBounds.height}px`;
            w.el.style.left = `${Math.max(0, e.clientX - restoredW * ratio)}px`;
            w.el.style.top = `${Math.max(0, e.clientY - 18)}px`;
          } else {
            w.restoreBounds = {
              left: w.el.offsetLeft,
              top: w.el.offsetTop,
              width: w.el.offsetWidth,
              height: w.el.offsetHeight
            };
          }

          offsetX = e.clientX - w.el.offsetLeft;
          offsetY = e.clientY - w.el.offsetTop;
          // 防止拖拽经过 iframe 时丢失指针事件
          document.querySelectorAll('iframe').forEach(f => { f.style.pointerEvents = 'none'; });
        });

        bar.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const layerRect = document.getElementById('windows-layer').getBoundingClientRect();
          const nx = Math.max(-w.el.offsetWidth + 90, Math.min(layerRect.width - 60, e.clientX - offsetX));
          const ny = Math.max(0, Math.min(layerRect.height - 34, e.clientY - offsetY));
          w.el.style.left = `${nx}px`;
          w.el.style.top = `${ny}px`;

          pendingSnapZone = computeSnapZone(e.clientX, e.clientY);
          if (pendingSnapZone) {
            phantom.style.left = `${pendingSnapZone.left + 4}px`;
            phantom.style.top = `${pendingSnapZone.top + 4}px`;
            phantom.style.width = `${pendingSnapZone.width - 8}px`;
            phantom.style.height = `${pendingSnapZone.height - 8}px`;
            phantom.classList.add('visible');
          } else {
            phantom.classList.remove('visible');
          }
        });

        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          phantom.classList.remove('visible');
          document.querySelectorAll('iframe').forEach(f => { f.style.pointerEvents = ''; });

          if (pendingSnapZone) {
            if (pendingSnapZone.type === 'max') {
              this._applyMaximize(w, true);
            } else {
              w.snapped = true;
              w.el.style.left = `${pendingSnapZone.left}px`;
              w.el.style.top = `${pendingSnapZone.top}px`;
              w.el.style.width = `${pendingSnapZone.width}px`;
              w.el.style.height = `${pendingSnapZone.height}px`;
              window.dispatchEvent(new Event('resize'));
            }
            pendingSnapZone = null;
          }
        };

        bar.addEventListener('pointerup', endDrag);
        bar.addEventListener('pointercancel', endDrag);
      },

      /* 八向边缘丝滑调整窗口大小 */
      _bindEightWayResize(w) {
        const handles = w.el.querySelectorAll('.win-resizer');
        handles.forEach(handle => {
          let resizing = false;
          let dir = '';
          let startX = 0, startY = 0;
          let startL = 0, startT = 0, startW = 0, startH = 0;

          handle.addEventListener('pointerdown', (e) => {
            if (w.maximized) return;
            e.stopPropagation();
            resizing = true;
            dir = handle.dataset.dir;
            startX = e.clientX;
            startY = e.clientY;
            startL = w.el.offsetLeft;
            startT = w.el.offsetTop;
            startW = w.el.offsetWidth;
            startH = w.el.offsetHeight;
            w.snapped = false;
            handle.setPointerCapture(e.pointerId);
            document.querySelectorAll('iframe').forEach(f => { f.style.pointerEvents = 'none'; });
            this.focusWindow(w.id);
          });

          handle.addEventListener('pointermove', (e) => {
            if (!resizing) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const minW = 290;
            const minH = 210;

            let nL = startL, nT = startT, nW = startW, nH = startH;
            if (dir.includes('e')) nW = Math.max(minW, startW + dx);
            if (dir.includes('s')) nH = Math.max(minH, startH + dy);
            if (dir.includes('w')) {
              const candW = startW - dx;
              if (candW >= minW) { nW = candW; nL = startL + dx; }
            }
            if (dir.includes('n')) {
              const candH = startH - dy;
              if (candH >= minH && startT + dy >= 0) { nH = candH; nT = startT + dy; }
            }

            w.el.style.left = `${nL}px`;
            w.el.style.top = `${nT}px`;
            w.el.style.width = `${nW}px`;
            w.el.style.height = `${nH}px`;
          });

          const endResize = () => {
            if (!resizing) return;
            resizing = false;
            document.querySelectorAll('iframe').forEach(f => { f.style.pointerEvents = ''; });
            window.dispatchEvent(new Event('resize'));
          };

          handle.addEventListener('pointerup', endResize);
          handle.addEventListener('pointercancel', endResize);
        });
      }
    };

    /* =========================================================================
       模块 8：任务栏、Aero Peek 透视、开始菜单、12/24小时制时钟与翻页日历、桌面系统
       ========================================================================= */
    function renderTaskbar() {
      const container = document.getElementById('taskbar-apps');
      if (!container) return;
      container.innerHTML = '';

      const hiddenSet = new Set(OSState.settings.hiddenTaskbarApps || []);
      const openWins = Array.from(OSState.windows.values());
      const pinnedIds = (OSState.settings.pinnedTaskbarApps || []).filter(id => !hiddenSet.has(id));

      // 先渲染固定应用（若对应应用已打开单窗口则关联，多窗口则各自展示）
      const renderedWinIds = new Set();

      for (const appId of pinnedIds) {
        const meta = getAppMeta(appId);
        const matchingWins = openWins.filter(w => w.appId === appId);
        if (matchingWins.length === 0) {
          const pill = document.createElement('button');
          pill.className = 'taskbar-app-pill';
          pill.title = meta.name;
          pill.innerHTML = `<span class="w-4 h-4 shrink-0" style="color: ${meta.color};">${Icons[meta.icon]}</span><span class="pill-label text-xs truncate">${meta.name}</span>`;
          pill.onclick = () => launchApp(appId);
          container.appendChild(pill);
        } else {
          for (const w of matchingWins) {
            renderedWinIds.add(w.id);
            container.appendChild(createRunningTaskbarPill(w, meta));
          }
        }
      }

      // 渲染未固定但当前已打开的窗口
      for (const w of openWins) {
        if (renderedWinIds.has(w.id)) continue;
        const meta = getAppMeta(w.appId);
        container.appendChild(createRunningTaskbarPill(w, meta));
      }
    }

    function createRunningTaskbarPill(w, meta) {
      const pill = document.createElement('div');
      const isFocused = OSState.activeWinId === w.id && !w.minimized;
      pill.className = `taskbar-app-pill running ${isFocused ? 'focused' : ''}`;
      pill.innerHTML = `
        <span class="w-4 h-4 shrink-0" style="color: ${meta.color};">${w.iconSvg || Icons[meta.icon]}</span>
        <span class="pill-label text-xs truncate">${w.title}</span>
        <span class="taskbar-pill-close" title="关闭窗口">${Icons.close}</span>
      `;
      pill.onclick = (e) => {
        if (e.target.closest('.taskbar-pill-close')) {
          e.stopPropagation();
          WM.closeWindow(w.id);
          document.getElementById('taskbar-peek-card')?.classList.add('hidden');
          document.body.classList.remove('aero-peek-single');
          return;
        }
        if (w.minimized) WM.focusWindow(w.id);
        else if (OSState.activeWinId === w.id) WM.minimizeWindow(w.id);
        else WM.focusWindow(w.id);
      };

      // 任务栏悬停卡片与单窗口 Aero Peek 透视聚焦
      pill.addEventListener('mouseenter', () => {
        if (!OSState.settings.aeroPeek || window.innerWidth <= 768) return;
        const card = document.getElementById('taskbar-peek-card');
        const r = pill.getBoundingClientRect();
        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="text-xs font-semibold truncate text-[var(--text-primary)]">${w.title}</span>
            <button data-peek-close class="w-5 h-5 rounded flex items-center justify-center hover:bg-red-600 hover:text-white text-[var(--text-secondary)] cursor-pointer">${Icons.close}</button>
          </div>
          <div class="h-20 rounded border flex flex-col items-center justify-center gap-1.5 text-[11px] text-[var(--text-secondary)] cursor-pointer" style="background: var(--bg-surface-1); border-color: var(--border-subtle);">
            <span class="w-7 h-7" style="color: ${meta.color};">${w.iconSvg || Icons[meta.icon]}</span>
            <span>${w.minimized ? '已最小化 · 点击恢复' : '悬停透视此窗口'}</span>
          </div>
        `;
        card.style.left = `${Math.max(8, Math.min(window.innerWidth - 230, r.left - 20))}px`;
        card.classList.remove('hidden');

        card.onmouseenter = () => {
          if (!w.minimized) {
            document.body.classList.add('aero-peek-single');
            OSState.windows.forEach(win => win.el.classList.toggle('peek-focus', win.id === w.id));
          }
        };
        card.onmouseleave = () => {
          card.classList.add('hidden');
          document.body.classList.remove('aero-peek-single');
          OSState.windows.forEach(win => win.el.classList.remove('peek-focus'));
        };
        card.onclick = (ev) => {
          if (ev.target.closest('[data-peek-close]')) {
            WM.closeWindow(w.id);
          } else {
            WM.focusWindow(w.id);
          }
          card.classList.add('hidden');
          document.body.classList.remove('aero-peek-single');
        };
      });

      pill.addEventListener('mouseleave', (e) => {
        const card = document.getElementById('taskbar-peek-card');
        setTimeout(() => {
          if (card && !card.matches(':hover') && !pill.matches(':hover')) {
            card.classList.add('hidden');
            document.body.classList.remove('aero-peek-single');
            OSState.windows.forEach(win => win.el.classList.remove('peek-focus'));
          }
        }, 120);
      });

      return pill;
    }

    /* Aero Peek 右下角透视窄条：悬停透视桌面，点击最小化/恢复全部窗口 */
    (function initAeroPeekSliver() {
      const sliver = document.getElementById('aero-peek-sliver');
      let savedBeforeShowDesktop = [];
      sliver.addEventListener('mouseenter', () => {
        if (OSState.settings.aeroPeek) document.body.classList.add('aero-peek-all');
      });
      sliver.addEventListener('mouseleave', () => {
        document.body.classList.remove('aero-peek-all');
      });
      sliver.addEventListener('click', () => {
        document.body.classList.remove('aero-peek-all');
        const visibleWins = Array.from(OSState.windows.values()).filter(w => !w.minimized);
        if (visibleWins.length > 0) {
          savedBeforeShowDesktop = visibleWins.map(w => w.id);
          visibleWins.forEach(w => WM.minimizeWindow(w.id));
        } else if (savedBeforeShowDesktop.length > 0) {
          savedBeforeShowDesktop.forEach(id => WM.focusWindow(id));
          savedBeforeShowDesktop = [];
        }
      });
    })();

    /* 12/24 小时制时钟与可翻阅上下月的日历浮层 */
    const CalendarWidget = {
      viewYear: new Date().getFullYear(),
      viewMonth: new Date().getMonth(),

      tickClock() {
        const now = new Date();
        const is12 = OSState.settings.clock12Hour;
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        let timeStr = '';
        if (is12) {
          const period = h < 12 ? '上午' : '下午';
          const h12 = h % 12 || 12;
          timeStr = `${period} ${String(h12).padStart(2, '0')}:${m}${OSState.settings.clockShowSeconds ? ':' + s : ''}`;
        } else {
          timeStr = `${String(h).padStart(2, '0')}:${m}${OSState.settings.clockShowSeconds ? ':' + s : ''}`;
        }
        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const timeEl = document.getElementById('tray-time-text');
        const dateEl = document.getElementById('tray-date-text');
        if (timeEl) timeEl.textContent = timeStr;
        if (dateEl) dateEl.textContent = dateStr;

        const liveCalClock = document.getElementById('cal-live-clock');
        if (liveCalClock) liveCalClock.textContent = timeStr;
      },

      renderPanel() {
        const panel = document.getElementById('calendar-panel');
        const today = new Date();
        const firstDay = new Date(this.viewYear, this.viewMonth, 1).getDay();
        const daysInMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
        const daysInPrev = new Date(this.viewYear, this.viewMonth, 0).getDate();

        const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
        let cellsHtml = '';
        // 上月尾日
        for (let i = firstDay - 1; i >= 0; i--) {
          cellsHtml += `<div class="h-8 flex items-center justify-center rounded text-xs text-[var(--text-muted)] opacity-50">${daysInPrev - i}</div>`;
        }
        // 本月日期
        for (let d = 1; d <= daysInMonth; d++) {
          const isToday = d === today.getDate() && this.viewMonth === today.getMonth() && this.viewYear === today.getFullYear();
          cellsHtml += `<div class="h-8 flex items-center justify-center rounded text-xs font-medium cursor-pointer transition-colors ${isToday ? 'font-bold' : 'hover:bg-[var(--bg-hover)]'}" style="${isToday ? 'background: var(--accent); color: var(--text-on-accent);' : 'color: var(--text-primary);'}">${d}</div>`;
        }
        // 下月初日补齐 42 格
        const totalSoFar = firstDay + daysInMonth;
        const remain = (7 - (totalSoFar % 7)) % 7;
        for (let n = 1; n <= remain; n++) {
          cellsHtml += `<div class="h-8 flex items-center justify-center rounded text-xs text-[var(--text-muted)] opacity-50">${n}</div>`;
        }

        panel.innerHTML = `
          <div class="p-4 border-b border-[var(--border-subtle)] flex items-center justify-between">
            <div>
              <div id="cal-live-clock" class="text-lg font-bold tracking-wider text-[var(--accent)]" style="font-family: var(--font-display);"></div>
              <div class="text-xs text-[var(--text-secondary)] mt-0.5">${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 · 星期${weekNames[today.getDay()]}</div>
            </div>
            <button id="cal-toggle-12h" class="px-2.5 py-1 rounded text-[11px] border cursor-pointer hover:border-[var(--accent)]" style="background: var(--bg-surface-2); border-color: var(--border-subtle); color: var(--text-primary);">
              ${OSState.settings.clock12Hour ? '12小时制' : '24小时制'}
            </button>
          </div>
          <div class="p-3.5">
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm font-semibold text-[var(--text-primary)]" style="font-family: var(--font-serif);">${this.viewYear} 年 ${this.viewMonth + 1} 月</span>
              <div class="flex items-center gap-1">
                <button id="cal-prev-m" class="w-7 h-7 rounded flex items-center justify-center hover:bg-[var(--bg-hover)] cursor-pointer text-[var(--text-secondary)]" title="上个月"><span class="w-4 h-4">${Icons.chevLeft}</span></button>
                <button id="cal-today-m" class="px-2 h-7 rounded text-[11px] hover:bg-[var(--bg-hover)] cursor-pointer text-[var(--accent)]">本月</button>
                <button id="cal-next-m" class="w-7 h-7 rounded flex items-center justify-center hover:bg-[var(--bg-hover)] cursor-pointer text-[var(--text-secondary)]" title="下个月"><span class="w-4 h-4">${Icons.chevRight}</span></button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1 mb-1 text-center text-[11px] text-[var(--text-muted)] font-semibold">
              ${weekNames.map(w => `<div>${w}</div>`).join('')}
            </div>
            <div class="grid grid-cols-7 gap-1" style="font-family: var(--font-display);">
              ${cellsHtml}
            </div>
          </div>
        `;
        this.tickClock();

        panel.querySelector('#cal-prev-m').onclick = (e) => {
          e.stopPropagation();
          this.viewMonth--;
          if (this.viewMonth < 0) { this.viewMonth = 11; this.viewYear--; }
          this.renderPanel();
        };
        panel.querySelector('#cal-next-m').onclick = (e) => {
          e.stopPropagation();
          this.viewMonth++;
          if (this.viewMonth > 11) { this.viewMonth = 0; this.viewYear++; }
          this.renderPanel();
        };
        panel.querySelector('#cal-today-m').onclick = (e) => {
          e.stopPropagation();
          const now = new Date();
          this.viewYear = now.getFullYear();
          this.viewMonth = now.getMonth();
          this.renderPanel();
        };
        panel.querySelector('#cal-toggle-12h').onclick = (e) => {
          e.stopPropagation();
          OSState.settings.clock12Hour = !OSState.settings.clock12Hour;
          saveSettings();
          this.renderPanel();
        };
      }
    };

    async function triggerLocalFolderMountWithFeedback(existingRecord = null) {
      const loaderToast = document.createElement('div');
      loaderToast.className = 'pointer-events-auto px-3.5 py-2.5 rounded-md shadow-xl flex items-center gap-2.5 text-xs border';
      loaderToast.style.background = 'var(--bg-glass-heavy)';

      loaderToast.innerHTML = `<div class="xj-astrolabe-spinner" style="width:18px;height:18px;border-width:2px;"></div><span>正在请求本地文件夹访问授权并构建挂载树...</span>`;
      document.getElementById('toast-stack')?.appendChild(loaderToast);
      try {
        const mountedPath = await window.fs.mountLocalDirectory(existingRecord);
        loaderToast.remove();
        showToast(`已成功挂载本地目录至 ${mountedPath}`, 'success', {
          label: '立即浏览',
          onClick: () => openExplorerApp({ initialPath: mountedPath })
        });
      } catch (err) {
        loaderToast.remove();
        if (err && err.name !== 'AbortError') {
          showToast(`挂载取消或失败: ${err.message}`, 'error');
        }
      }
    }

    /* =========================================================================
       模块 9：桌面图标网格/自由摆放、HTML5 原生拖拽、移动端触摸拖拽与桌面框选
       ========================================================================= */
    function snapOrClampDesktopPos(rawX, rawY) {
      const surf = document.getElementById('desktop-surface');
      const maxW = Math.max(200, (surf ? surf.clientWidth : window.innerWidth) - 88);
      const maxH = Math.max(160, (surf ? surf.clientHeight : window.innerHeight - 52) - 96);
      let x = Math.max(12, Math.min(maxW, Math.round(rawX)));
      let y = Math.max(12, Math.min(maxH, Math.round(rawY)));
      if (OSState.settings.desktopSnapGrid) {
        const cellW = 94;
        const cellH = 102;
        x = Math.max(14, Math.min(maxW, 14 + Math.round((x - 14) / cellW) * cellW));
        y = Math.max(14, Math.min(maxH, 14 + Math.round((y - 14) / cellH) * cellH));
      }
      return { x, y };
    }

    function findNextFreeDesktopSlot(occupiedList) {
      const surf = document.getElementById('desktop-surface');
      const maxH = Math.max(220, (surf ? surf.clientHeight : window.innerHeight - 60) - 96);
      const cellW = 94;
      const cellH = 102;
      for (let col = 0; col < 30; col++) {
        for (let row = 0; row < 20; row++) {
          const x = 14 + col * cellW;
          const y = 14 + row * cellH;
          if (y > maxH && row > 0) break;
          const clash = occupiedList.some(p => Math.abs(p.x - x) < 55 && Math.abs(p.y - y) < 60);
          if (!clash) return { x, y };
        }
      }
      return { x: 14, y: 14 };
    }

    const DesktopManager = {
      selectedKeys: new Set(),
      marqueeInstance: null,

      async init() {
        const surface = document.getElementById('desktop-surface');
        const marqueeEl = document.getElementById('desktop-marquee');

        // 桌面框选引擎
        this.marqueeInstance = createMarqueeSelector({
          container: surface,
          marqueeEl,
          itemSelector: '.desktop-icon',
          onSelectionChange: (selSet) => {
            this.selectedKeys = selSet;
            this._syncSelectionClasses();
          }
        });

        // 桌面区域监听 HTML5 原生 dragover + drop（支持内部自由摆放坐标更新 + 外部物理文件递归导入）
        surface.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = e.dataTransfer.types.includes('application/x-xuanji-vfs') ? 'move' : 'copy';
        });

        surface.addEventListener('drop', async (e) => {
          e.preventDefault();
          surface.querySelectorAll('.desktop-icon.drop-target').forEach(n => n.classList.remove('drop-target'));
          const surfRect = surface.getBoundingClientRect();
          const dropX = e.clientX - surfRect.left;
          const dropY = e.clientY - surfRect.top;

          const targetFolderEl = e.target.closest('.desktop-icon[data-is-dir="true"]');
          const rawInternal = e.dataTransfer.getData('application/x-xuanji-vfs');

          if (rawInternal) {
            try {
              const payload = JSON.parse(rawInternal);
              // 若释放在桌面上的某个文件夹图标上 -> 移入该文件夹并保留原始修改时间
              if (targetFolderEl && targetFolderEl.dataset.path) {
                const folderPath = targetFolderEl.dataset.path;
                for (const p of (payload.paths || [])) {
                  if (p.startsWith('app:')) continue;
                  if (p === folderPath) continue;
                  await window.fs.rename(p, joinPath(folderPath, baseName(p)));
                }
                showToast(`已移动至 "${baseName(folderPath)}"`, 'success');
                return;
              }

              // 释放在桌面空白网格：若来自桌面则平滑更新自由/网格坐标；若来自文件管理器则移入 /Desktop 并定位在落点坐标
              const items = payload.keys || payload.paths || [];
              for (let i = 0; i < items.length; i++) {
                const key = items[i];
                const newPos = snapOrClampDesktopPos(
                  dropX - (payload.offsetX || 40) + i * 20,
                  dropY - (payload.offsetY || 40) + i * 20
                );
                if (key.startsWith('app:') || dirName(key) === '/Desktop') {
                  OSState.desktopPositions[key] = newPos;
                } else {
                  const destDesktopPath = joinPath('/Desktop', baseName(key));
                  await window.fs.rename(key, destDesktopPath);
                  OSState.desktopPositions[destDesktopPath] = newPos;
                }
              }
              saveDesktopPositions();
              await this.render();
            } catch (err) {
              showToast(`移动项目失败: ${err.message}`, 'error');
            }
          } else {
            // 物理桌面 -> 虚拟桌面反向拖拽导入
            const targetDir = (targetFolderEl && targetFolderEl.dataset.path) ? targetFolderEl.dataset.path : '/Desktop';
            await importDataTransferToVfs(e.dataTransfer, targetDir, { x: dropX - 36, y: dropY - 36 });
          }
        });

        // 桌面右键菜单
        surface.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const iconEl = e.target.closest('.desktop-icon');
          if (iconEl) {
            const key = iconEl.dataset.path;
            if (!this.selectedKeys.has(key)) {
              this.selectedKeys = new Set([key]);
              this._syncSelectionClasses();
            }
            this._openIconContextMenu(e.clientX, e.clientY, key);
          } else {
            this._openBlankDesktopMenu(e.clientX, e.clientY);
          }
        });

        await this.render();
      },

      _syncSelectionClasses() {
        document.querySelectorAll('#desktop-icons-container .desktop-icon').forEach(el => {
          el.classList.toggle('selected', this.selectedKeys.has(el.dataset.path));
        });
      },

      async render() {
        const container = document.getElementById('desktop-icons-container');
        if (!container || !window.fs._ready) return;

        const hiddenApps = new Set(OSState.settings.hiddenDesktopApps || []);
        const itemsToRender = [];

        // 1. 系统应用快捷图标
        for (const app of SystemApps) {
          if (hiddenApps.has(app.id)) continue;
          itemsToRender.push({
            key: `app:${app.id}`,
            appId: app.id,
            label: app.name,
            isDir: false,
            isApp: true,
            svgHtml: `<span class="w-9 h-9 flex items-center justify-center" style="color: ${app.color};">${Icons[app.icon]}</span>`
          });
        }

        // 2. /Desktop 目录下的持久化虚拟文件与文件夹
        try {
          const vfsEntries = await window.fs.readdir('/Desktop', { withFileTypes: true });
          vfsEntries.sort((a, b) => naturalCompare(a.name, b.name));
          for (const st of vfsEntries) {
            itemsToRender.push({
              key: st.path,
              vfsPath: st.path,
              label: st.name,
              isDir: st.isDirectory(),
              isApp: false,
              svgHtml: `<span class="w-9 h-9 flex items-center justify-center">${getFileIconSvg(st.name, st.isDirectory(), st.path)}</span>`
            });
          }
        } catch (_) {}

        // 计算并持久化每个图标的独立坐标
        const occupied = [];
        for (const it of itemsToRender) {
          if (OSState.desktopPositions[it.key]) {
            occupied.push(OSState.desktopPositions[it.key]);
          }
        }
        let posChanged = false;
        for (const it of itemsToRender) {
          if (!OSState.desktopPositions[it.key]) {
            const slot = findNextFreeDesktopSlot(occupied);
            OSState.desktopPositions[it.key] = slot;
            occupied.push(slot);
            posChanged = true;
          }
        }
        if (posChanged) saveDesktopPositions();

        container.innerHTML = '';
        for (const it of itemsToRender) {
          const pos = OSState.desktopPositions[it.key];
          const el = document.createElement('div');
          el.className = `desktop-icon ${this.selectedKeys.has(it.key) ? 'selected' : ''}`;
          el.dataset.path = it.key;
          el.dataset.isDir = String(it.isDir);
          el.draggable = true; // 统一走 HTML5 原生拖拽，禁止与桌面端 pointermove 混用！
          el.style.left = `${pos.x}px`;
          el.style.top = `${pos.y}px`;

          el.innerHTML = `
            <span class="item-check-badge" title="选择项目"><span class="w-3 h-3">${Icons.check}</span></span>
            <div class="desktop-icon-glyph">${it.svgHtml}</div>
            <div class="desktop-icon-label">${it.label}</div>
          `;

          // 预加载文件缓存至 Map，确保 dragstart 100% 同步读取，绝不使用 async/await！
          if (!it.isApp && !it.isDir) {
            el.addEventListener('mouseenter', () => DragPreloadCache.preload(it.vfsPath));
            el.addEventListener('mousedown', () => DragPreloadCache.preload(it.vfsPath));
          }

          // HTML5 原生 dragstart（同步设置内部元数据 + items.add(file) + DownloadURL 三段式）
          el.addEventListener('dragstart', (e) => {
            if (!this.selectedKeys.has(it.key)) {
              this.selectedKeys = new Set([it.key]);
              this._syncSelectionClasses();
            }
            const rect = el.getBoundingClientRect();
            const keys = Array.from(this.selectedKeys);
            const vfsPaths = keys.filter(k => !k.startsWith('app:'));
            e.dataTransfer.effectAllowed = 'copyMove';
            e.dataTransfer.setData('application/x-xuanji-vfs', JSON.stringify({
              source: 'desktop',
              keys,
              paths: vfsPaths,
              offsetX: e.clientX - rect.left,
              offsetY: e.clientY - rect.top
            }));

            if (!it.isApp && !it.isDir) {
              const cached = DragPreloadCache.getSync(it.vfsPath);
              if (cached) {
                try { e.dataTransfer.items.add(cached.file); } catch (_) {}
                try { e.dataTransfer.setData('DownloadURL', `${cached.mime}:${cached.safeName}:${cached.blobUrl}`); } catch (_) {}
              }
            }
          });

          el.addEventListener('dragend', () => {
            if (!it.isApp && !it.isDir) {
              DragPreloadCache.scheduleCleanupAfterDrag(it.vfsPath);
            }
          });

          if (it.isDir) {
            el.addEventListener('dragover', (e) => {
              e.preventDefault();
              el.classList.add('drop-target');
            });
            el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
          }

          // 移动端纯触摸（touchstart/touchmove/touchend）图标自由移动（与桌面端鼠标原生拖拽严格隔离，零冲突！）
          this._bindMobileTouchReposition(el, it);

          // 点击与双击逻辑（默认单击打开，复选框点击或 Ctrl/Shift 点击做多选）
          const triggerOpen = () => {
            if (it.isApp) launchApp(it.appId);
            else openPathSmart(it.vfsPath);
          };

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            hideAllFloatingPanels();
            if (el.dataset.justTouchDragged === '1') {
              el.dataset.justTouchDragged = '0';
              return;
            }
            if (e.target.closest('.item-check-badge') || e.ctrlKey || e.metaKey || e.shiftKey) {
              if (this.selectedKeys.has(it.key)) this.selectedKeys.delete(it.key);
              else this.selectedKeys.add(it.key);
              this._syncSelectionClasses();
              return;
            }
            this.selectedKeys = new Set([it.key]);
            this._syncSelectionClasses();
            if (OSState.settings.singleClickOpen) triggerOpen();
          });

          el.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (!OSState.settings.singleClickOpen) triggerOpen();
          });

          container.appendChild(el);
        }
      },

      _bindMobileTouchReposition(el, item) {
        let touchMoved = false;
        let startTouchX = 0;
        let startTouchY = 0;
        let origLeft = 0;
        let origTop = 0;

        el.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          e.stopPropagation(); // 阻止冒泡触发桌面框选
          touchMoved = false;
          startTouchX = e.touches[0].clientX;
          startTouchY = e.touches[0].clientY;
          origLeft = el.offsetLeft;
          origTop = el.offsetTop;
        }, { passive: true });

        el.addEventListener('touchmove', (e) => {
          if (e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - startTouchX;
          const dy = e.touches[0].clientY - startTouchY;
          if (!touchMoved && Math.hypot(dx, dy) > 9) {
            touchMoved = true;
            el.classList.add('dragging-touch');
          }
          if (touchMoved) {
            e.preventDefault();
            el.style.left = `${origLeft + dx}px`;
            el.style.top = `${origTop + dy}px`;
          }
        }, { passive: false });

        el.addEventListener('touchend', () => {
          if (!touchMoved) return;
          el.classList.remove('dragging-touch');
          el.dataset.justTouchDragged = '1';
          const snapped = snapOrClampDesktopPos(el.offsetLeft, el.offsetTop);
          el.style.left = `${snapped.x}px`;
          el.style.top = `${snapped.y}px`;
          OSState.desktopPositions[item.key] = snapped;
          saveDesktopPositions();
        });
      },

    /* 通用文件项右键菜单（桌面与文件管理器共享一致体验） */
    async function openFileItemContextMenu(x, y, selectedPaths, currentDir, explorerInstance = null) {
      if (!selectedPaths || selectedPaths.length === 0) return;
      const primary = selectedPaths[0];
      let st = null;
      try { st = await window.fs.stat(primary); } catch (_) {}
      const ext = extName(primary);

      const items = [
        { label: '打开', icon: Icons.external, action: () => openPathSmart(primary, { explorerInstance }) }
      ];

      if (st && st.isFile()) {
        if (ext === 'html' || ext === 'htm') {
          items.push({ label: '在系统浏览器中打开', icon: Icons.browser, action: () => openBrowserApp({ filePath: primary }) });
          items.push({ label: '使用 HTML 代码编辑器打开', icon: Icons.code, action: () => openHtmlEditorApp({ filePath: primary }) });
        } else {
          items.push({ label: '打开方式 · 代码编辑器', icon: Icons.code, action: () => openHtmlEditorApp({ filePath: primary }) });
          items.push({ label: '打开方式 · 记事本 (纯文本)', icon: Icons.notepad, action: () => openNotepadApp({ filePath: primary }) });
          if (IMAGE_EXTS.has(ext)) {
            items.push({ label: '打开方式 · 漫画阅读器', icon: Icons.manga, action: () => openMangaViewerApp({ filePath: primary }) });
            items.push({ label: '打开方式 · 精密图片查看器', icon: Icons.image, action: () => openImageViewerApp({ filePath: primary }) });
            items.push({ label: '设为桌面壁纸', icon: Icons.paint, action: async () => {
                OSState.settings.wallpaperType = 'custom';
                OSState.settings.customWallpaperPath = primary;
                saveSettings();
                await applyVisualSettings();
                showToast('已将该图片设为系统桌面壁纸', 'success');
              }
            });
          }
        }
        if (ARCHIVE_EXTS.has(ext)) {
          items.push({ label: '解压归档文件...', icon: Icons.archive, action: () => promptExtractArchiveDialog(primary) });
        }
      }

      items.push({ divider: true });
      items.push({
        label: '打包压缩为 .ZIP (保留修改时间)',
        icon: Icons.archive,
        action: async () => {
          const zipName = (selectedPaths.length === 1 ? baseName(primary) : '归档合集') + '.zip';
          const outZip = joinPath(currentDir, zipName);
          try {
            await ArchiveEngine.compressToZip(selectedPaths, outZip);
            showToast(`已生成压缩包 "${zipName}"`, 'success');
          } catch (e) {
            showToast(`压缩失败: ${e.message}`, 'error');
          }
        }
      });
      items.push({
        label: '导出/下载至本地设备',
        icon: Icons.download,
        action: () => exportVfsPathToPhysical(primary)
      });
      items.push({ divider: true });
      items.push({
        label: '复制',
        icon: Icons.copy,
        hint: 'Ctrl+C',
        action: () => {
          OSState.clipboard = { mode: 'copy', paths: [...selectedPaths] };
          showToast(`已复制 ${selectedPaths.length} 个项目`);
        }
      });
      items.push({
        label: '剪切',
        icon: Icons.scissors,
        hint: 'Ctrl+X',
        action: () => {
          OSState.clipboard = { mode: 'cut', paths: [...selectedPaths] };
          showToast(`已剪切 ${selectedPaths.length} 个项目`);
        }
      });
      if (selectedPaths.length === 1) {
        items.push({
          label: '重命名',
          icon: Icons.edit,
          action: async () => {
            const newName = await promptTextDialog('重命名项目', '请输入新名称：', baseName(primary));
            if (newName && newName !== baseName(primary)) {
              try {
                await window.fs.rename(primary, joinPath(dirName(primary), newName));
                showToast('重命名成功', 'success');
              } catch (e) {
                showToast(`重命名失败: ${e.message}`, 'error');
              }
            }
          }
        });
      }
      items.push({
        label: `删除 (${selectedPaths.length})`,
        icon: Icons.trash,
        danger: true,
        action: async () => {
          const ok = await showModalDialog({
            title: '确认删除',
            bodyHtml: `确定要永久删除选中的 <b>${selectedPaths.length}</b> 个项目吗？`,
            buttons: [
              { label: '取消', value: false },
              { label: '确认删除', danger: true, value: true }
            ]
          });
          if (!ok) return;
          for (const p of selectedPaths) {
            try {
              const s = await window.fs.stat(p);
              if (s.isDirectory()) await window.fs.rmdir(p, { recursive: true });
              else await window.fs.unlink(p);
            } catch (e) {
              showToast(`删除失败: ${e.message}`, 'error');
            }
          }
        }
      });

      showContextMenu(x, y, items);
    }

    async function pasteClipboardIntoDir(targetDir) {
      const { mode, paths } = OSState.clipboard;
      if (!mode || !paths.length) return;
      for (const src of paths) {
        try {
          const dst = joinPath(targetDir, baseName(src));
          if (mode === 'cut') {
            await window.fs.rename(src, dst);
          } else {
            await window.fs.copy(src, dst);
          }
        } catch (err) {
          showToast(`粘贴 "${baseName(src)}" 失败: ${err.message}`, 'error');
        }
      }
      if (mode === 'cut') OSState.clipboard = { mode: null, paths: [] };
      showToast('粘贴操作已完成', 'success');
    }

    function triggerUploadFilesToDir(targetDir) {
      const inp = document.getElementById('global-file-input');
      inp.value = '';
      inp.onchange = async () => {
        const files = Array.from(inp.files || []);
        for (const f of files) {
          const ab = await f.arrayBuffer();
          await window.fs.writeFile(joinPath(targetDir, f.name), new Uint8Array(ab), { mtime: f.lastModified });
        }
        if (files.length > 0) showToast(`成功导入 ${files.length} 个文件至 ${targetDir}`, 'success');
      };
      inp.click();
    }
