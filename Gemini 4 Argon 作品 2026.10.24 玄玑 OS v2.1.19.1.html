    function hexToRgbTuple(hex) {
      const clean = (hex || '#e2b36b').replace('#', '');
      const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
      const n = parseInt(full, 16) || 0xe2b36b;
      return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
    }

    let currentWallpaperBlobUrl = null;
    async function applyVisualSettings() {
      const s = OSState.settings;
      document.documentElement.setAttribute('data-theme', s.theme === 'light' ? 'light' : 'dark');
      document.documentElement.style.setProperty('--accent', s.accentColor);
      document.documentElement.style.setProperty('--accent-rgb', hexToRgbTuple(s.accentColor));
      document.documentElement.style.setProperty('--win-radius', `${Number(s.winRadius)}px`);
      document.documentElement.style.setProperty('--glass-blur', `${Number(s.glassBlur)}px`);

      const scaleMap = {
        small: { w: 72, h: 80 },
        medium: { w: 84, h: 92 },
        large: { w: 98, h: 106 }
      };
      const sc = scaleMap[s.desktopIconScale] || scaleMap.medium;
      document.documentElement.style.setProperty('--desktop-icon-w', `${sc.w}px`);
      document.documentElement.style.setProperty('--desktop-icon-h', `${sc.h}px`);

      const themeGlyph = document.getElementById('tray-theme-glyph');
      if (themeGlyph) themeGlyph.innerHTML = s.theme === 'light' ? Icons.moon : Icons.sun;
      const backendBadge = document.getElementById('tray-backend-badge');
      if (backendBadge) backendBadge.textContent = s.primaryBackend.toUpperCase();

      // 应用壁纸
      const wpEl = document.getElementById('wallpaper-layer');
      if (s.wallpaperType === 'custom' && s.customWallpaperPath && window.fs && window.fs._ready) {
        try {
          const bytes = await window.fs.readFile(s.customWallpaperPath);
          const mime = guessMimeType(s.customWallpaperPath);
          const blob = new Blob([bytes], { type: mime });
          if (currentWallpaperBlobUrl) URL.revokeObjectURL(currentWallpaperBlobUrl);
          currentWallpaperBlobUrl = URL.createObjectURL(blob);
          wpEl.style.backgroundImage = `url("${currentWallpaperBlobUrl}")`;
          return;
        } catch (_) {}
      }
      const preset = BuiltinWallpapers.find(w => w.id === s.wallpaperId) || BuiltinWallpapers[0];
      wpEl.style.backgroundImage = preset.buildCss(s.theme === 'light');
    }

    function showToast(message, type = 'info', action = null) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const el = document.createElement('div');
      const borderCol = type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--accent)';
      el.className = 'pointer-events-auto px-3.5 py-2.5 rounded-md shadow-xl flex items-center justify-between gap-3 text-xs border transition-all duration-200';
      el.style.background = 'var(--bg-glass-heavy)';
      el.style.borderColor = borderCol;
      el.style.color = 'var(--text-primary)';
      el.style.backdropFilter = 'blur(16px)';

      const textSpan = document.createElement('span');
      textSpan.className = 'leading-relaxed';
      textSpan.textContent = message;
      el.appendChild(textSpan);

      if (action && action.label && typeof action.onClick === 'function') {
        const btn = document.createElement('button');
        btn.className = 'px-2.5 py-1 rounded text-[11px] font-semibold cursor-pointer shrink-0';
        btn.style.background = 'var(--accent)';
        btn.style.color = 'var(--text-on-accent)';
        btn.textContent = action.label;
        btn.onclick = () => {
          action.onClick();
          el.remove();
        };
        el.appendChild(btn);
      }

      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(16px)';
        setTimeout(() => el.remove(), 220);
      }, action ? 9000 : 3400);
    }

    /* 路径与文件类型工具 */
    function normPath(p) {
      if (!p || typeof p !== 'string') return '/';
      let s = p.replace(/\\/g, '/').trim();
      if (!s.startsWith('/')) s = '/' + s;
      const parts = s.split('/');
      const out = [];
      for (const seg of parts) {
        if (!seg || seg === '.') continue;
        if (seg === '..') out.pop();
        else out.push(seg);
      }
      return '/' + out.join('/');
    }
    function dirName(p) {
      const n = normPath(p);
      if (n === '/') return '/';
      const idx = n.lastIndexOf('/');
      return idx <= 0 ? '/' : n.slice(0, idx);
    }
    function baseName(p) {
      const n = normPath(p);
      if (n === '/') return '/';
      return n.slice(n.lastIndexOf('/') + 1);
    }
    function extName(p) {
      const b = baseName(p);
      const idx = b.lastIndexOf('.');
      if (b.toLowerCase().endsWith('.tar.gz')) return 'tar.gz';
      return idx > 0 ? b.slice(idx + 1).toLowerCase() : '';
    }
    function joinPath(...segs) {
      return normPath(segs.filter(Boolean).join('/'));
    }

    const naturalCollator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
    function naturalCompare(a, b) {
      return naturalCollator.compare(String(a), String(b));
    }

    function formatBytes(bytes) {
      if (bytes === undefined || bytes === null || isNaN(bytes)) return '0 B';
      const b = Math.max(0, Number(bytes));
      if (b < 1024) return `${b} B`;
      const units = ['KB', 'MB', 'GB', 'TB'];
      let val = b / 1024;
      let u = 0;
      while (val >= 1024 && u < units.length - 1) {
        val /= 1024;
        u++;
      }
      return `${val >= 100 ? val.toFixed(0) : val >= 10 ? val.toFixed(1) : val.toFixed(2)} ${units[u]}`;
    }

    function formatDateTime(ms) {
      const d = new Date(Number(ms) || Date.now());
      const Y = d.getFullYear();
      const M = String(d.getMonth() + 1).padStart(2, '0');
      const D = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${Y}-${M}-${D} ${hh}:${mm}`;
    }

    const IMAGE_EXTS = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico', 'avif', 'apng', 'jfif']);
    const AUDIO_EXTS = new Set(['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a', 'opus', 'weba']);
    const VIDEO_EXTS = new Set(['mp4', 'webm', 'ogv', 'mov', 'm4v']);
    const SHEET_EXTS = new Set(['csv', 'tsv']);
    const CODE_EXTS  = new Set(['html', 'htm', 'css', 'js', 'mjs', 'json', 'xml', 'md', 'markdown', 'yaml', 'yml', 'ts', 'jsx', 'tsx', 'sh', 'py', 'c', 'cpp', 'rs', 'go', 'sql']);
    const TEXT_EXTS  = new Set(['txt', 'log', 'ini', 'conf', 'env', 'gitignore', 'rtf']);
    const ARCHIVE_EXTS = new Set(['zip', '7z', 'rar', 'gz', 'tar', 'tgz', 'tar.gz', 'bz2', 'xz']);
    const VM_EXTS    = new Set(['iso', 'img', 'fda', 'bin', 'hda', 'vhd']);

    function guessMimeType(filename) {
      const ext = extName(filename);
      const map = {
        png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', jfif: 'image/jpeg',
        gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp', bmp: 'image/bmp',
        ico: 'image/x-icon', avif: 'image/avif',
        mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', flac: 'audio/flac', aac: 'audio/aac', m4a: 'audio/mp4',
        mp4: 'video/mp4', webm: 'video/webm', ogv: 'video/ogg', mov: 'video/quicktime',
        pdf: 'application/pdf',
        html: 'text/html', htm: 'text/html', css: 'text/css', js: 'text/javascript', mjs: 'text/javascript',
        json: 'application/json', xml: 'application/xml', md: 'text/markdown', markdown: 'text/markdown',
        csv: 'text/csv', tsv: 'text/tab-separated-values', txt: 'text/plain', log: 'text/plain',
        zip: 'application/zip', gz: 'application/gzip', tar: 'application/x-tar', tgz: 'application/gzip', 'tar.gz': 'application/gzip',
        '7z': 'application/x-7z-compressed', rar: 'application/vnd.rar',
        iso: 'application/octet-stream', img: 'application/octet-stream', bin: 'application/octet-stream'
      };
      return map[ext] || 'application/octet-stream';
    }

    function getFileTypeLabel(name, isDir) {
      if (isDir) return '文件夹';
      const ext = extName(name);
      if (!ext) return '通用文件';
      if (ext === 'html' || ext === 'htm') return 'HTML 网页文档';
      if (IMAGE_EXTS.has(ext)) return `${ext.toUpperCase()} 图像`;
      if (AUDIO_EXTS.has(ext)) return `${ext.toUpperCase()} 音频`;
      if (VIDEO_EXTS.has(ext)) return `${ext.toUpperCase()} 视频`;
      if (SHEET_EXTS.has(ext)) return `${ext.toUpperCase()} 数据表格`;
      if (ARCHIVE_EXTS.has(ext)) return `${ext.toUpperCase()} 压缩归档`;
      if (ext === 'pdf') return 'PDF 文档';
      if (VM_EXTS.has(ext)) return `${ext.toUpperCase()} 磁盘镜像`;
      if (CODE_EXTS.has(ext)) return `${ext.toUpperCase()} 源代码`;
      if (TEXT_EXTS.has(ext)) return `${ext.toUpperCase()} 文本文档`;
      return `${ext.toUpperCase()} 文件`;
    }

    function getFileIconSvg(name, isDir, fullPath = '') {
      if (isDir) {
        if (fullPath.startsWith('/mnt/local')) return `<span style="color: var(--accent-mineral);">${Icons.folderMount}</span>`;
        return `<span style="color: var(--accent);">${Icons.folder}</span>`;
      }
      const ext = extName(name);
      if (IMAGE_EXTS.has(ext)) return `<span style="color: #34d399;">${Icons.image}</span>`;
      if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext)) return `<span style="color: #f472b6;">${Icons.media}</span>`;
      if (SHEET_EXTS.has(ext)) return `<span style="color: #10b981;">${Icons.sheet}</span>`;
      if (ext === 'html' || ext === 'htm' || CODE_EXTS.has(ext)) return `<span style="color: #38bdf8;">${Icons.code}</span>`;
      if (ARCHIVE_EXTS.has(ext)) return `<span style="color: #fbbf24;">${Icons.archive}</span>`;
      if (ext === 'pdf') return `<span style="color: #f87171;">${Icons.pdf}</span>`;
      if (VM_EXTS.has(ext)) return `<span style="color: #a78bfa;">${Icons.vm}</span>`;
      if (TEXT_EXTS.has(ext)) return `<span style="color: var(--text-secondary);">${Icons.notepad}</span>`;
      return `<span style="color: var(--text-secondary);">${Icons.fileGeneric}</span>`;
    }

    /* =========================================================================
       模块 3：统一虚拟文件系统 (window.fs)
       架构：OPFS + IndexedDB + FileSystemAccess (/mnt/local) + 元数据时间戳持久化
       准则：无任何特殊路径分支判断；所有后端实现完全相同的驱动契约与多参数签名兼容
       ========================================================================= */
    function extractCallbackAndOptions(args, fixedCount) {
      let cb = null;
      const copy = Array.from(args);
      if (copy.length > fixedCount && typeof copy[copy.length - 1] === 'function') {
        cb = copy.pop();
      }
      const extra = copy.slice(fixedCount);
      return { cb, extra };
    }

    async function runWithCallback(promiseFn, cb, isExistsStyle = false) {
      try {
        const res = await promiseFn();
        if (cb) {
          if (isExistsStyle) cb(Boolean(res));
          else cb(null, res);
        }
        return res;
      } catch (err) {
        if (cb) {
          if (isExistsStyle) cb(false);
          else cb(err);
        }
        throw err;
      }
    }

    function toUint8Array(data) {
      if (data instanceof Uint8Array) return data;
      if (data instanceof ArrayBuffer) return new Uint8Array(data);
      if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      if (typeof data === 'string') return new TextEncoder().encode(data);
      return new TextEncoder().encode(String(data ?? ''));
    }

    class StatEntry {
      constructor({ name, path, isDir, size = 0, mtime = Date.now(), ctime = Date.now() }) {
        this.name = name;
        this.path = path;
        this._isDir = Boolean(isDir);
        this.size = Number(size) || 0;
        this.mtimeMs = Number(mtime) || Date.now();
        this.ctimeMs = Number(ctime) || this.mtimeMs;
        this.mtime = new Date(this.mtimeMs);
        this.ctime = new Date(this.ctimeMs);
        this.birthtime = new Date(this.ctimeMs);
      }
      isDirectory() { return this._isDir; }
      isFile() { return !this._isDir; }
      isSymbolicLink() { return false; }
    }

    /* 时间戳元数据持久化库（彻底解决 OPFS 写入/移动/拖拽导致修改日期重置的痛点） */
    class MetadataRegistry {
      constructor() {
        this.map = new Map();
        this.db = null;
      }
      async init() {
        try {
          const raw = localStorage.getItem('xuanji_vfs_mtime_mirror');
          if (raw) {
            const parsed = JSON.parse(raw);
            for (const [k, v] of Object.entries(parsed)) this.map.set(k, v);
          }
        } catch (_) {}
        try {
          this.db = await new Promise((resolve, reject) => {
            const req = indexedDB.open('xuanji_meta_registry_v1', 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
          await new Promise((resolve) => {
            const tx = this.db.transaction('meta', 'readonly');
            const st = tx.objectStore('meta');
            const cur = st.openCursor();
            cur.onsuccess = (e) => {
              const c = e.target.result;
              if (c) {
                this.map.set(c.key, c.value);
                c.continue();
              } else resolve();
            };
            cur.onerror = () => resolve();
          });
        } catch (_) {}
      }
      get(key) {
        return this.map.get(key) || null;
      }
      set(key, val) {
        const entry = {
          mtime: Number(val.mtime) || Date.now(),
          ctime: Number(val.ctime || val.mtime) || Date.now()
        };
        this.map.set(key, entry);
        this._persistKey(key, entry);
      }
      delete(key) {
        const prefix = key === '/' ? '/' : key + '/';
        for (const k of Array.from(this.map.keys())) {
          if (k === key || k.startsWith(prefix)) {
            this.map.delete(k);
            if (this.db) {
              try {
                const tx = this.db.transaction('meta', 'readwrite');
                tx.objectStore('meta').delete(k);
              } catch (_) {}
            }
          }
        }
        this._syncMirrorDebounced();
      }
      renamePrefix(oldKey, newKey) {
        const prefix = oldKey + '/';
        const updates = [];
        for (const [k, v] of Array.from(this.map.entries())) {
          if (k === oldKey) updates.push([oldKey, newKey, v]);
          else if (k.startsWith(prefix)) updates.push([k, newKey + k.slice(oldKey.length), v]);
        }
        for (const [ok, nk, v] of updates) {
          this.map.delete(ok);
          this.map.set(nk, v);
          if (this.db) {
            try {
              const tx = this.db.transaction('meta', 'readwrite');
              const st = tx.objectStore('meta');
              st.delete(ok);
              st.put(v, nk);
            } catch (_) {}
          }
        }
        this._syncMirrorDebounced();
      }
      _persistKey(key, entry) {
        if (this.db) {
          try {
            const tx = this.db.transaction('meta', 'readwrite');
            tx.objectStore('meta').put(entry, key);
          } catch (_) {}
        }
        this._syncMirrorDebounced();
      }
      _syncMirrorDebounced() {
        clearTimeout(this._mirrorTimer);
        this._mirrorTimer = setTimeout(() => {
          try {
            if (this.map.size <= 1500) {
              const obj = {};
              for (const [k, v] of this.map.entries()) obj[k] = v;
              localStorage.setItem('xuanji_vfs_mtime_mirror', JSON.stringify(obj));
            }
          } catch (_) {}
        }, 400);
      }
      async clearAll() {
        this.map.clear();
        try { localStorage.removeItem('xuanji_vfs_mtime_mirror'); } catch (_) {}
        if (this.db) {
          await new Promise((resolve) => {
            const tx = this.db.transaction('meta', 'readwrite');
            tx.objectStore('meta').clear();
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        }
      }
    }

    /* 驱动基类：基于 FileSystemDirectoryHandle 的标准后端（OPFS 与本地挂载目录共用同一套原生 Handle 协议！） */
    class DirectoryHandleBackend {
      constructor(rootHandle, namespacePrefix, metaRegistry) {
        this.root = rootHandle;
        this.ns = namespacePrefix; // e.g., 'opfs:' or 'mnt:/mnt/local/Docs:'
        this.meta = metaRegistry;
      }

      _metaKey(relPath) {
        return `${this.ns}${normPath(relPath)}`;
      }

      async _resolveParent(relPath, createDirs = false) {
        const clean = normPath(relPath);
        if (clean === '/') return { dirHandle: this.root, name: '' };
        const segs = clean.slice(1).split('/');
        const leaf = segs.pop();
        let curr = this.root;
        for (const s of segs) {
          curr = await curr.getDirectoryHandle(s, { create: createDirs });
        }
        return { dirHandle: curr, name: leaf };
      }

      async _getHandle(relPath) {
        const clean = normPath(relPath);
        if (clean === '/') return { handle: this.root, kind: 'directory' };
        const { dirHandle, name } = await this._resolveParent(clean, false);
        try {
          const fh = await dirHandle.getFileHandle(name, { create: false });
          return { handle: fh, kind: 'file' };
        } catch (_) {
          const dh = await dirHandle.getDirectoryHandle(name, { create: false });
          return { handle: dh, kind: 'directory' };
        }
      }

      async stat(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const { handle, kind } = await this._getHandle(clean);
          const rec = this.meta.get(this._metaKey(clean));
          if (kind === 'directory') {
            return new StatEntry({
              name: baseName(clean),
              path: clean,
              isDir: true,
              size: 0,
              mtime: rec ? rec.mtime : Date.now(),
              ctime: rec ? rec.ctime : Date.now()
            });
          } else {
            const file = await handle.getFile();
            const mtime = rec ? rec.mtime : file.lastModified;
            const ctime = rec ? rec.ctime : file.lastModified;
            return new StatEntry({
              name: file.name,
              path: clean,
              isDir: false,
              size: file.size,
              mtime,
              ctime
            });
          }
        }, cb);
      }

      async exists(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          try {
            await this._getHandle(relPath);
            return true;
          } catch (_) {
            return false;
          }
        }, cb, true);
      }

      async readdir(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : {};
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const { handle, kind } = await this._getHandle(clean);
          if (kind !== 'directory') throw new Error(`路径不是文件夹: ${clean}`);
          const names = [];
          const entries = [];
          for await (const [name, entryHandle] of handle.entries()) {
            if (name === '.vfs_meta.json') continue;
            if (opts.withFileTypes) {
              const childRel = joinPath(clean, name);
              const rec = this.meta.get(this._metaKey(childRel));
              if (entryHandle.kind === 'directory') {
                entries.push(new StatEntry({
                  name,
                  path: childRel,
                  isDir: true,
                  size: 0,
                  mtime: rec ? rec.mtime : Date.now(),
                  ctime: rec ? rec.ctime : Date.now()
                }));
              } else {
                const f = await entryHandle.getFile();
                entries.push(new StatEntry({
                  name,
                  path: childRel,
                  isDir: false,
                  size: f.size,
                  mtime: rec ? rec.mtime : f.lastModified,
                  ctime: rec ? rec.ctime : f.lastModified
                }));
              }
            } else {
              names.push(name);
            }
          }
          return opts.withFileTypes ? entries : names;
        }, cb);
      }

      async readFile(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opt = extra[0];
        const encoding = typeof opt === 'string' ? opt : (opt && opt.encoding ? opt.encoding : null);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const { handle, kind } = await this._getHandle(clean);
          if (kind !== 'file') throw new Error(`不能将目录作为文件读取: ${clean}`);
          const file = await handle.getFile();
          if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
            return await file.text();
          }
          if (encoding === 'blob') {
            return file;
          }
          const buf = await file.arrayBuffer();
          return new Uint8Array(buf);
        }, cb);
      }

      async writeFile(relPath, data, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : {};
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (clean === '/') throw new Error('不能写入根目录本身');
          const { dirHandle, name } = await this._resolveParent(clean, true);
          const fh = await dirHandle.getFileHandle(name, { create: true });
          const writable = await fh.createWritable();
          const payload = data instanceof Blob ? data : toUint8Array(data);
          await writable.write(payload);
          await writable.close();

          const existing = this.meta.get(this._metaKey(clean));
          const mtime = opts.mtime !== undefined ? Number(opts.mtime) : Date.now();
          const ctime = existing ? existing.ctime : mtime;
          this.meta.set(this._metaKey(clean), { mtime, ctime });
          return true;
        }, cb);
      }

      async mkdir(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (clean === '/') return true;
          const segs = clean.slice(1).split('/');
          let curr = this.root;
          let built = '';
          for (const s of segs) {
            built += '/' + s;
            curr = await curr.getDirectoryHandle(s, { create: true });
            if (!this.meta.get(this._metaKey(built))) {
              const now = Date.now();
              this.meta.set(this._metaKey(built), { mtime: now, ctime: now });
            }
          }
          return true;
        }, cb);
      }

      async unlink(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const { dirHandle, name } = await this._resolveParent(clean, false);
          await dirHandle.removeEntry(name, { recursive: false });
          this.meta.delete(this._metaKey(clean));
          return true;
        }, cb);
      }

      async rmdir(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : { recursive: true };
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (clean === '/') throw new Error('不可删除卷根目录');
          const { dirHandle, name } = await this._resolveParent(clean, false);
          await dirHandle.removeEntry(name, { recursive: opts.recursive !== false });
          this.meta.delete(this._metaKey(clean));
          return true;
        }, cb);
      }

      async rename(oldRelPath, newRelPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const src = normPath(oldRelPath);
          const dst = normPath(newRelPath);
          if (src === dst) return true;
          const st = await this.stat(src);
          if (st.isDirectory()) {
            await this.mkdir(dst);
            // 保留目录自身修改时间
            this.meta.set(this._metaKey(dst), { mtime: st.mtimeMs, ctime: st.ctimeMs });
            const items = await this.readdir(src);
            for (const name of items) {
              await this.rename(joinPath(src, name), joinPath(dst, name));
            }
            await this.rmdir(src, { recursive: true });
          } else {
            const bytes = await this.readFile(src);
            await this.writeFile(dst, bytes, { mtime: st.mtimeMs });
            this.meta.set(this._metaKey(dst), { mtime: st.mtimeMs, ctime: st.ctimeMs });
            await this.unlink(src);
          }
          return true;
        }, cb);
      }

      async open(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const flags = typeof extra[0] === 'string' ? extra[0] : 'r';
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (flags.includes('w') || flags.includes('a')) {
            const existsNow = await this.exists(clean);
            if (!existsNow || flags.includes('w')) {
              await this.writeFile(clean, new Uint8Array(0));
            }
          } else {
            await this.stat(clean);
          }
          return { path: clean, flags, fd: Math.floor(Math.random() * 900000) + 1000 };
        }, cb);
      }

      async clearAll() {
        for await (const [name] of this.root.entries()) {
          await this.root.removeEntry(name, { recursive: true });
        }
      }
    }

    /* 高性能 IndexedDB 文件系统后端（支持完整二进制 Uint8Array 与精确修改日期保留） */
    class IdbBackend {
      constructor(metaRegistry) {
        this.db = null;
        this.meta = metaRegistry;
        this.memFallback = new Map(); // 极端隐私模式内存兜底
      }

      async init() {
        try {
          this.db = await new Promise((resolve, reject) => {
            const req = indexedDB.open('xuanji_vfs_idb_v1', 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains('nodes')) {
                const st = db.createObjectStore('nodes', { keyPath: 'path' });
                st.createIndex('by_parent', 'parent', { unique: false });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
          const rootNode = await this._getNode('/');
          if (!rootNode) {
            const now = Date.now();
            await this._putNode({ path: '/', parent: '', name: '/', isDir: true, size: 0, mtime: now, ctime: now, data: null });
          }
        } catch (_) {
          const now = Date.now();
          this.memFallback.set('/', { path: '/', parent: '', name: '/', isDir: true, size: 0, mtime: now, ctime: now, data: null });
        }
      }

      async _getNode(path) {
        const clean = normPath(path);
        if (!this.db) return this.memFallback.get(clean) || null;
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('nodes', 'readonly');
          const req = tx.objectStore('nodes').get(clean);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      }

      async _putNode(node) {
        if (!this.db) {
          this.memFallback.set(node.path, node);
          return;
        }
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('nodes', 'readwrite');
          const req = tx.objectStore('nodes').put(node);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async _delNode(path) {
        if (!this.db) {
          this.memFallback.delete(path);
          return;
        }
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('nodes', 'readwrite');
          const req = tx.objectStore('nodes').delete(path);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async _listChildren(parentPath) {
        const clean = normPath(parentPath);
        if (!this.db) {
          const out = [];
          for (const v of this.memFallback.values()) {
            if (v.parent === clean && v.path !== '/') out.push(v);
          }
          return out;
        }
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction('nodes', 'readonly');
          const idx = tx.objectStore('nodes').index('by_parent');
          const req = idx.getAll(clean);
          req.onsuccess = () => resolve((req.result || []).filter(n => n.path !== '/'));
          req.onerror = () => reject(req.error);
        });
      }

      async stat(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const node = await this._getNode(clean);
          if (!node) throw new Error(`文件不存在: ${clean}`);
          return new StatEntry({
            name: node.name,
            path: clean,
            isDir: node.isDir,
            size: node.size || 0,
            mtime: node.mtime,
            ctime: node.ctime
          });
        }, cb);
      }

      async exists(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const node = await this._getNode(relPath);
          return Boolean(node);
        }, cb, true);
      }

      async mkdir(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (clean === '/') return true;
          const segs = clean.slice(1).split('/');
          let curr = '';
          for (const s of segs) {
            const next = curr + '/' + s;
            const existing = await this._getNode(next);
            if (!existing) {
              const now = Date.now();
              await this._putNode({
                path: next,
                parent: curr || '/',
                name: s,
                isDir: true,
                size: 0,
                mtime: now,
                ctime: now,
                data: null
              });
            }
            curr = next;
          }
          return true;
        }, cb);
      }

      async readdir(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : {};
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const dirNode = await this._getNode(clean);
          if (!dirNode || !dirNode.isDir) throw new Error(`目录不存在: ${clean}`);
          const children = await this._listChildren(clean);
          if (opts.withFileTypes) {
            return children.map(n => new StatEntry({
              name: n.name,
              path: n.path,
              isDir: n.isDir,
              size: n.size || 0,
              mtime: n.mtime,
              ctime: n.ctime
            }));
          }
          return children.map(n => n.name);
        }, cb);
      }

      async readFile(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opt = extra[0];
        const encoding = typeof opt === 'string' ? opt : (opt && opt.encoding ? opt.encoding : null);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const node = await this._getNode(clean);
          if (!node || node.isDir) throw new Error(`文件不可读: ${clean}`);
          const bytes = node.data instanceof Uint8Array ? node.data : new Uint8Array(node.data || 0);
          if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
            return new TextDecoder('utf-8').decode(bytes);
          }
          if (encoding === 'blob') {
            return new Blob([bytes], { type: guessMimeType(clean) });
          }
          return bytes;
        }, cb);
      }

      async writeFile(relPath, data, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : {};
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          const parent = dirName(clean);
          await this.mkdir(parent);
          const existing = await this._getNode(clean);
          let bytes;
          if (data instanceof Blob) {
            bytes = new Uint8Array(await data.arrayBuffer());
          } else {
            bytes = toUint8Array(data);
          }
          const mtime = opts.mtime !== undefined ? Number(opts.mtime) : Date.now();
          const ctime = existing ? existing.ctime : mtime;
          await this._putNode({
            path: clean,
            parent,
            name: baseName(clean),
            isDir: false,
            size: bytes.byteLength,
            mtime,
            ctime,
            data: bytes
          });
          return true;
        }, cb);
      }

      async unlink(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          await this._delNode(clean);
          return true;
        }, cb);
      }

      async rmdir(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (clean === '/') throw new Error('不可删除卷根目录');
          const children = await this._listChildren(clean);
          for (const ch of children) {
            if (ch.isDir) await this.rmdir(ch.path);
            else await this.unlink(ch.path);
          }
          await this._delNode(clean);
          return true;
        }, cb);
      }

      async rename(oldRelPath, newRelPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const src = normPath(oldRelPath);
          const dst = normPath(newRelPath);
          if (src === dst) return true;
          const node = await this._getNode(src);
          if (!node) throw new Error(`源文件不存在: ${src}`);
          await this.mkdir(dirName(dst));
          if (node.isDir) {
            await this._putNode({
              path: dst,
              parent: dirName(dst),
              name: baseName(dst),
              isDir: true,
              size: 0,
              mtime: node.mtime,
              ctime: node.ctime,
              data: null
            });
            const children = await this._listChildren(src);
            for (const ch of children) {
              await this.rename(ch.path, joinPath(dst, ch.name));
            }
            await this._delNode(src);
          } else {
            await this._putNode({
              path: dst,
              parent: dirName(dst),
              name: baseName(dst),
              isDir: false,
              size: node.size,
              mtime: node.mtime, // 严格保留原修改时间
              ctime: node.ctime,
              data: node.data
            });
            await this._delNode(src);
          }
          return true;
        }, cb);
      }

      async open(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const flags = typeof extra[0] === 'string' ? extra[0] : 'r';
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (flags.includes('w') || flags.includes('a')) {
            const ex = await this.exists(clean);
            if (!ex || flags.includes('w')) await this.writeFile(clean, new Uint8Array(0));
          } else {
            await this.stat(clean);
          }
          return { path: clean, flags, fd: Math.floor(Math.random() * 900000) + 1000 };
        }, cb);
      }

      async clearAll() {
        if (this.db) {
          await new Promise((resolve) => {
            const tx = this.db.transaction('nodes', 'readwrite');
            tx.objectStore('nodes').clear();
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
          const now = Date.now();
          await this._putNode({ path: '/', parent: '', name: '/', isDir: true, size: 0, mtime: now, ctime: now, data: null });
        }
        this.memFallback.clear();
      }
    }

    /* 虚拟合成目录后端（用于 /mnt 与 /mnt/local 挂载点容器目录，使其与普通文件夹 100% 一致） */
    class MountContainerBackend {
      constructor(getChildMountNamesFn) {
        this.getChildNames = getChildMountNamesFn;
        this.bootTime = Date.now();
      }
      async stat(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const clean = normPath(relPath);
          if (clean !== '/') throw new Error(`未挂载的目录: ${clean}`);
          return new StatEntry({ name: baseName(clean), path: clean, isDir: true, size: 0, mtime: this.bootTime, ctime: this.bootTime });
        }, cb);
      }
      async exists(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => normPath(relPath) === '/', cb, true);
      }
      async readdir(relPath, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : {};
        return runWithCallback(async () => {
          const names = this.getChildNames();
          if (opts.withFileTypes) {
            return names.map(name => new StatEntry({
              name,
              path: '/' + name,
              isDir: true,
              size: 0,
              mtime: this.bootTime,
              ctime: this.bootTime
            }));
          }
          return names;
        }, cb);
      }
      async mkdir(_, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => { throw new Error('请使用挂载本地目录功能在 /mnt/local 下添加挂载点'); }, cb);
      }
      async readFile(_, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => { throw new Error('挂载点容器为目录'); }, cb);
      }
      async writeFile(_, __, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => { throw new Error('请在具体挂载子目录内写入文件'); }, cb);
      }
      async unlink(_, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => { throw new Error('不可直接删除挂载根容器'); }, cb);
      }
      async rmdir(_, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => { throw new Error('请通过卸载功能移除本地挂载目录'); }, cb);
      }
      async rename(_, __, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => { throw new Error('挂载点名称不可直接重命名'); }, cb);
      }
      async open(relPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => ({ path: relPath, flags: 'r', fd: 1 }), cb);
      }
    }

    /* 本地文件夹挂载句柄持久化表（用于刷新页面后提醒用户一键恢复授权） */
    const MountHandleStore = {
      db: null,
      async init() {
        try {
          this.db = await new Promise((resolve, reject) => {
            const req = indexedDB.open('xuanji_mount_handles_v1', 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles', { keyPath: 'mountName' });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        } catch (_) {}
      },
      async saveHandle(mountName, handle) {
        if (!this.db) return;
        return new Promise((resolve) => {
          const tx = this.db.transaction('handles', 'readwrite');
          tx.objectStore('handles').put({ mountName, handle, savedAt: Date.now() });
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      },
      async removeHandle(mountName) {
        if (!this.db) return;
        return new Promise((resolve) => {
          const tx = this.db.transaction('handles', 'readwrite');
          tx.objectStore('handles').delete(mountName);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      },
      async listAll() {
        if (!this.db) return [];
        return new Promise((resolve) => {
          const tx = this.db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      },
      async clearAll() {
        if (!this.db) return;
        return new Promise((resolve) => {
          const tx = this.db.transaction('handles', 'readwrite');
          tx.objectStore('handles').clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      }
    };

    /* 统一文件系统路由器 VfsRouter —— 全局暴露为 window.fs */
    class UnifiedVfs {
      constructor() {
        this._ready = false;
        this.meta = new MetadataRegistry();
        this.opfsBackend = null;
        this.idbBackend = null;
        this.mounts = new Map(); // mountPoint -> backendDriver
        this.localMountNames = new Set();
      }

      async init() {
        await this.meta.init();
        await MountHandleStore.init();

        // 1. 初始化 IndexedDB 后端
        this.idbBackend = new IdbBackend(this.meta);
        await this.idbBackend.init();

        // 2. 初始化原生 OPFS 后端（若受限环境不支持则平滑回退至 IDB）
        if (navigator.storage && typeof navigator.storage.getDirectory === 'function') {
          try {
            const opfsRoot = await navigator.storage.getDirectory();
            this.opfsBackend = new DirectoryHandleBackend(opfsRoot, 'opfs:', this.meta);
          } catch (e) {
            console.warn('OPFS 初始化降级到 IndexedDB:', e);
            this.opfsBackend = this.idbBackend;
          }
        } else {
          this.opfsBackend = this.idbBackend;
        }

        // 3. 注册标准挂载表（最长前缀路由匹配，对上层调用者完全透明统一）
        this.mounts.set('/opfs', this.opfsBackend);
        this.mounts.set('/idb', this.idbBackend);
        this.mounts.set('/mnt', new MountContainerBackend(() => ['local']));
        this.mounts.set('/mnt/local', new MountContainerBackend(() => Array.from(this.localMountNames)));
        this._updatePrimaryRootMount();

        // 4. 创建标准系统目录与初始演示文件
        await this.ensureStandardDirectories();
        this._ready = true;

        // 5. 检测上次挂载的本地文件夹句柄并准备重挂载提醒
        const savedHandles = await MountHandleStore.listAll();
        if (savedHandles.length > 0) {
          OSState.pendingRemountHandles = savedHandles;
        }
      }

      _updatePrimaryRootMount() {
        const primary = OSState.settings.primaryBackend === 'idb' ? this.idbBackend : this.opfsBackend;
        this.mounts.set('/', primary);
      }

      setPrimaryBackend(mode) {
        OSState.settings.primaryBackend = mode === 'idb' ? 'idb' : 'opfs';
        this._updatePrimaryRootMount();
        saveSettings();
        applyVisualSettings();
        this.ensureStandardDirectories().then(() => notifyFsChanged('/'));
      }

      /* 最长前缀挂载点解析 */
      _resolveMount(fullPath) {
        const clean = normPath(fullPath);
        let bestMount = '/';
        let bestBackend = this.mounts.get('/');
        for (const [mp, backend] of this.mounts.entries()) {
          if (mp === '/') continue;
          if (clean === mp || clean.startsWith(mp + '/')) {
            if (mp.length > bestMount.length) {
              bestMount = mp;
              bestBackend = backend;
            }
          }
        }
        const relPath = bestMount === '/' ? clean : (clean.slice(bestMount.length) || '/');
        return { mountPoint: bestMount, backend: bestBackend, relPath: normPath(relPath), fullPath: clean };
      }

      /* 挂载真实电脑文件夹至 /mnt/local/<文件夹名> */
      async mountLocalDirectory(existingRecord = null) {
        if (!existingRecord && typeof window.showDirectoryPicker !== 'function') {
          throw new Error('当前浏览器环境不支持 File System Access API (showDirectoryPicker)');
        }
        let dirHandle;
        let mountName;
        if (existingRecord) {
          dirHandle = existingRecord.handle;
          mountName = existingRecord.mountName;
          const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
          if (perm !== 'granted') {
            const readPerm = await dirHandle.requestPermission({ mode: 'read' });
            if (readPerm !== 'granted') throw new Error('未授予本地文件夹访问权限');
          }
        } else {
          dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          mountName = dirHandle.name;
          let suffix = 1;
          while (this.localMountNames.has(mountName)) {
            suffix++;
            mountName = `${dirHandle.name}_${suffix}`;
          }
        }

        const mountPath = `/mnt/local/${mountName}`;
        const fsaBackend = new DirectoryHandleBackend(dirHandle, `fsa:${mountPath}:`, this.meta);
        this.mounts.set(mountPath, fsaBackend);
        this.localMountNames.add(mountName);
        await MountHandleStore.saveHandle(mountName, dirHandle);
        OSState.pendingRemountHandles = OSState.pendingRemountHandles.filter(r => r.mountName !== mountName);
        notifyFsChanged('/mnt/local');
        return mountPath;
      }

      async unmountLocalDirectory(mountNameOrPath) {
        const name = mountNameOrPath.startsWith('/mnt/local/')
          ? mountNameOrPath.slice('/mnt/local/'.length).split('/')[0]
          : mountNameOrPath;
        const mountPath = `/mnt/local/${name}`;
        this.mounts.delete(mountPath);
        this.localMountNames.delete(name);
        await MountHandleStore.removeHandle(name);
        notifyFsChanged('/mnt/local');
        return true;
      }

      /* 统一 API 方法（全部自动路由，全参数签名兼容） */
      async stat(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath, fullPath } = this._resolveMount(path);
          const st = await backend.stat(relPath, ...extra);
          st.path = fullPath;
          st.name = baseName(fullPath);
          return st;
        }, cb);
      }

      async lstat(path, ...rest) {
        return this.stat(path, ...rest);
      }

      async exists(path, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath } = this._resolveMount(path);
          return await backend.exists(relPath);
        }, cb, true);
      }

      async readdir(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        const opts = extra[0] && typeof extra[0] === 'object' ? extra[0] : {};
        return runWithCallback(async () => {
          const { backend, relPath, fullPath } = this._resolveMount(path);
          const list = await backend.readdir(relPath, opts);
          // 若读取根路径 `/` 且存在挂载点 /mnt，合入虚拟目录节点以保证树形浏览自然连贯
          if (fullPath === '/') {
            if (opts.withFileTypes) {
              const hasMnt = list.some(e => e.name === 'mnt');
              if (!hasMnt && this.localMountNames.size > 0) {
                list.push(new StatEntry({ name: 'mnt', path: '/mnt', isDir: true, size: 0 }));
              }
              for (const item of list) item.path = joinPath(fullPath, item.name);
            } else {
              if (!list.includes('mnt') && this.localMountNames.size > 0) list.push('mnt');
            }
          } else if (opts.withFileTypes) {
            for (const item of list) item.path = joinPath(fullPath, item.name);
          }
          return list;
        }, cb);
      }

      async readFile(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath } = this._resolveMount(path);
          return await backend.readFile(relPath, ...extra);
        }, cb);
      }

      async writeFile(path, data, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath, fullPath } = this._resolveMount(path);
          const res = await backend.writeFile(relPath, data, ...extra);
          OSState.folderSizeCache.clear();
          notifyFsChanged(dirName(fullPath));
          return res;
        }, cb);
      }

      async mkdir(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath, fullPath } = this._resolveMount(path);
          const res = await backend.mkdir(relPath, ...extra);
          notifyFsChanged(dirName(fullPath));
          return res;
        }, cb);
      }

      async unlink(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath, fullPath } = this._resolveMount(path);
          const res = await backend.unlink(relPath, ...extra);
          OSState.folderSizeCache.clear();
          DragPreloadCache.invalidate(fullPath);
          notifyFsChanged(dirName(fullPath));
          return res;
        }, cb);
      }

      async rmdir(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath, fullPath } = this._resolveMount(path);
          const res = await backend.rmdir(relPath, ...extra);
          OSState.folderSizeCache.clear();
          notifyFsChanged(dirName(fullPath));
          return res;
        }, cb);
      }

      async open(path, ...rest) {
        const { cb, extra } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const { backend, relPath } = this._resolveMount(path);
          return await backend.open(relPath, ...extra);
        }, cb);
      }

      /* 跨挂载卷透明移动/重命名（100% 保留原始修改时间戳 mtime） */
      async rename(oldPath, newPath, ...rest) {
        const { cb } = extractCallbackAndOptions(rest, 0);
        return runWithCallback(async () => {
          const s = this._resolveMount(oldPath);
          const d = this._resolveMount(newPath);
          if (s.fullPath === d.fullPath) return true;
          if (d.fullPath.startsWith(s.fullPath + '/')) {
            throw new Error('不能将文件夹移动到其自身的子目录中');
          }
          if (s.backend === d.backend) {
            await s.backend.rename(s.relPath, d.relPath);
          } else {
            // 跨后端路由（如 /opfs <-> /idb <-> /mnt/local），递归复制并保留精确 mtime 后移除源
            await this._copyCrossBackend(s.fullPath, d.fullPath);
            const st = await this.stat(s.fullPath);
            if (st.isDirectory()) await this.rmdir(s.fullPath, { recursive: true });
            else await this.unlink(s.fullPath);
          }
          // 同步桌面坐标键名
          if (OSState.desktopPositions[s.fullPath]) {
            OSState.desktopPositions[d.fullPath] = OSState.desktopPositions[s.fullPath];
            delete OSState.desktopPositions[s.fullPath];
            saveDesktopPositions();
          }
          OSState.folderSizeCache.clear();
          DragPreloadCache.invalidate(s.fullPath);
          notifyFsChanged(dirName(s.fullPath));
          notifyFsChanged(dirName(d.fullPath));
          return true;
        }, cb);
      }

      async _copyCrossBackend(srcFull, dstFull) {
        const st = await this.stat(srcFull);
        if (st.isDirectory()) {
          await this.mkdir(dstFull);
          const entries = await this.readdir(srcFull);
          for (const name of entries) {
            await this._copyCrossBackend(joinPath(srcFull, name), joinPath(dstFull, name));
          }
        } else {
          const bytes = await this.readFile(srcFull);
          await this.writeFile(dstFull, bytes, { mtime: st.mtimeMs });
        }
      }

      async copy(srcPath, dstPath) {
        const s = normPath(srcPath);
        const d = normPath(dstPath);
        if (s === d) {
          const ext = extName(d);
          const stem = ext ? baseName(d).slice(0, -(ext.length + 1)) : baseName(d);
          const copyName = ext ? `${stem} - 副本.${ext}` : `${stem} - 副本`;
          return this.copy(s, joinPath(dirName(d), copyName));
        }
        await this._copyCrossBackend(s, d);
        OSState.folderSizeCache.clear();
        notifyFsChanged(dirName(d));
        return true;
      }

      async getFolderSize(folderPath) {
        const clean = normPath(folderPath);
        if (OSState.folderSizeCache.has(clean)) return OSState.folderSizeCache.get(clean);
        let total = 0;
        try {
          const items = await this.readdir(clean, { withFileTypes: true });
          for (const item of items) {
            if (item.isDirectory()) {
              total += await this.getFolderSize(item.path);
            } else {
              total += Number(item.size) || 0;
            }
          }
          OSState.folderSizeCache.set(clean, total);
        } catch (_) {}
        return total;
      }

    function buildRealX86BootSector() {
      const sector = new Uint8Array(512);
      const msg = [
        '====================================================\r\n',
        '  XUANJI OS // x86 HARDWARE VIRTUALIZATION KERNEL   \r\n',
        '  SeaBIOS 16-Bit Real Mode Boot Sector Active       \r\n',
        '====================================================\r\n\r\n',

        'Interactive: Type any keys on keyboard to echo live!\r\n\r\n',
        'xuanji-x86> '
      ].join('');
      const msgBytes = new TextEncoder().encode(msg);
      // 16-bit x86 汇编机器码 @ 0x7C00:
      // cli; xor ax,ax; mov ds,ax; mov es,ax; mov ss,ax; mov sp,0x7c00; sti
      // mov ax, 0x0003; int 0x10 (清屏 80x25 彩色文本模式)
      // mov si, 0x7c36 (字符串偏移)
      // print_loop: lodsb; test al,al; jz key_loop; mov ah,0x0e; mov bx,0x000e; int 0x10; jmp print_loop
      // key_loop: xor ah,ah; int 0x16; cmp al,0x0d; jne echo; mov al,0x0d; mov ah,0x0e; int 0x10; mov al,0x0a; echo: mov ah,0x0e; int 0x10; jmp key_loop
      const code = [
        0xFA, 0x31, 0xC0, 0x8E, 0xD8, 0x8E, 0xC0, 0x8E, 0xD0, 0xBC, 0x00, 0x7C, 0xFB,
        0xB8, 0x03, 0x00, 0xCD, 0x10,
        0xBE, 0x3A, 0x7C,
        0xAC, 0x84, 0xC0, 0x74, 0x09, 0xB4, 0x0E, 0xBB, 0x0E, 0x00, 0xCD, 0x10, 0xEB, 0xF3,
        0x30, 0xE4, 0xCD, 0x16, 0x3C, 0x0D, 0x75, 0x0A, 0xB4, 0x0E, 0xCD, 0x10, 0xB0, 0x0A, 0xB4, 0x0E, 0xCD, 0x10, 0xEB, 0xEC,
        0xB4, 0x0E, 0xCD, 0x10, 0xEB, 0xE6
      ];
      sector.set(code, 0);
      sector.set(msgBytes.slice(0, 510 - 0x3A), 0x3A);
      sector[510] = 0x55;

       模块 4：归档压缩解压引擎（JSZip 时区修正 + 7z-wasm + 原生 GZIP/TAR 流引擎）

    const ArchiveEngine = {
      /* 修正 JSZip 将 DOS 本地时间按 UTC 解析导致的时区偏差 */
      fixJsZipDateToLocalMs(zipDate) {
        if (!zipDate || !(zipDate instanceof Date)) return Date.now();
        return new Date(
          zipDate.getUTCFullYear(),
          zipDate.getUTCMonth(),
          zipDate.getUTCDate(),
          zipDate.getUTCHours(),
          zipDate.getUTCMinutes(),
          zipDate.getUTCSeconds()
        ).getTime();

      /* 压缩时将真实本地修改时间补偿为 JSZip 期望的伪 UTC Date，确保生成的 ZIP 保留精确原始修改时间 */
      localMsToJsZipDate(mtimeMs) {
        const d = new Date(Number(mtimeMs) || Date.now());
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      },

      async compressToZip(sourcePaths, targetZipPath) {
        if (typeof window.JSZip === 'undefined') {
          throw new Error('JSZip 引擎尚未加载完成，请检查网络连接后重试');
        }
        const zip = new window.JSZip();
        const addEntryRecursive = async (vfsPath, relZipPath) => {
          const st = await window.fs.stat(vfsPath);
          if (st.isDirectory()) {
            zip.folder(relZipPath);
            const children = await window.fs.readdir(vfsPath);
            for (const ch of children) {
              await addEntryRecursive(joinPath(vfsPath, ch), `${relZipPath}/${ch}`);
            }
          } else {
            const bytes = await window.fs.readFile(vfsPath);
            zip.file(relZipPath, bytes, {
              date: this.localMsToJsZipDate(st.mtimeMs),
              binary: true
            });
          }
        };

        for (const p of sourcePaths) {
          await addEntryRecursive(p, baseName(p));
        }
        const outBytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', compressionOptions: { level: 6 } });
        await window.fs.writeFile(targetZipPath, outBytes, { mtime: Date.now() });
        return targetZipPath;
      },

      /* 原生零依赖 DecompressionStream 解压 GZIP */
      async gunzipNative(uint8) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('当前浏览器不支持原生 DecompressionStream');
        }
        const ds = new DecompressionStream('gzip');
        const blob = new Blob([uint8]);
        const stream = blob.stream().pipeThrough(ds);
        const ab = await new Response(stream).arrayBuffer();
        return new Uint8Array(ab);
      },

      /* 原生零依赖 POSIX USTAR TAR 解析器（含八进制原始 mtime 解析） */
      async untarNativeToVfs(tarBytes, destDir) {
        let offset = 0;
        let count = 0;
        const decoder = new TextDecoder('utf-8');
        const readStr = (buf, start, len) => {
          let end = start;
          while (end < start + len && buf[end] !== 0) end++;
          return decoder.decode(buf.subarray(start, end)).trim();
        };

        while (offset + 512 <= tarBytes.length) {
          const header = tarBytes.subarray(offset, offset + 512);
          let allZero = true;
          for (let i = 0; i < 512; i++) {
            if (header[i] !== 0) { allZero = false; break; }
          }
          if (allZero) break;

          const name = readStr(header, 0, 100);
          const prefix = readStr(header, 345, 155);
          const fullRel = (prefix ? `${prefix}/${name}` : name).replace(/^\/+/, '');
          const sizeOct = readStr(header, 124, 12);
          const mtimeOct = readStr(header, 136, 12);
          const typeFlag = header[156];

          const fileSize = parseInt(sizeOct, 8) || 0;
          const mtimeSec = parseInt(mtimeOct, 8);
          const mtimeMs = !isNaN(mtimeSec) && mtimeSec > 0 ? mtimeSec * 1000 : Date.now();

          offset += 512;
          if (fullRel) {
            const targetPath = joinPath(destDir, fullRel);
            if (typeFlag === 53 || fullRel.endsWith('/')) {
              await window.fs.mkdir(targetPath);
            } else if (typeFlag === 0 || typeFlag === 48) {
              const content = tarBytes.subarray(offset, offset + fileSize);
              await window.fs.writeFile(targetPath, content, { mtime: mtimeMs });
              count++;
            }
          }
          offset += Math.ceil(fileSize / 512) * 512;
        }
        return count;
      },

      async extractArchive(archivePath, targetDir) {
        const ext = extName(archivePath);
        const rawBytes = await window.fs.readFile(archivePath);
        const archiveStat = await window.fs.stat(archivePath);
        await window.fs.mkdir(targetDir);

        // 1. ZIP 采用 JSZip + DOS 时区偏差修正
        if (ext === 'zip' && typeof window.JSZip !== 'undefined') {
          const zip = await window.JSZip.loadAsync(rawBytes);
          let extracted = 0;
          const entries = Object.values(zip.files);
          for (const entry of entries) {
            const cleanRel = entry.name.replace(/^\/+/, '');
            if (!cleanRel) continue;
            const outPath = joinPath(targetDir, cleanRel);
            const fixedMtime = this.fixJsZipDateToLocalMs(entry.date);
            if (entry.dir) {
              await window.fs.mkdir(outPath);
            } else {
              const content = await entry.async('uint8array');
              await window.fs.writeFile(outPath, content, { mtime: fixedMtime });
              extracted++;
            }
          }
          return extracted;
        }

        // 2. 原生 TAR / GZ / TAR.GZ / TGZ
        if (ext === 'tar') {
          return await this.untarNativeToVfs(rawBytes, targetDir);
        }
        if (ext === 'tgz' || ext === 'tar.gz') {
          const tarBytes = await this.gunzipNative(rawBytes);
          return await this.untarNativeToVfs(tarBytes, targetDir);
        }
        if (ext === 'gz') {
          const unzipped = await this.gunzipNative(rawBytes);
          const outName = baseName(archivePath).replace(/\.gz$/i, '') || 'extracted_file';
          if (outName.toLowerCase().endsWith('.tar')) {
            return await this.untarNativeToVfs(unzipped, targetDir);
          }
          await window.fs.writeFile(joinPath(targetDir, outName), unzipped, { mtime: archiveStat.mtimeMs });
          return 1;
        }

        // 3. 7z / RAR / XZ / BZ2 等调用 7z-wasm 引擎
        let factory = window.__SevenZipFactory;
        if (!factory) {
          const mod = await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
          factory = mod.default;
          window.__SevenZipFactory = factory;
        }
        const sevenZip = await factory({ print: () => {}, printErr: () => {} });
        const workIn = '/in_' + baseName(archivePath).replace(/[^a-zA-Z0-9._-]/g, '_');
        const workOut = '/out_extract';
        try { sevenZip.FS.mkdir(workOut); } catch (_) {}
        const stream = sevenZip.FS.open(workIn, 'w+');
        sevenZip.FS.write(stream, rawBytes, 0, rawBytes.length);
        sevenZip.FS.close(stream);

        sevenZip.callMain(['x', workIn, `-o${workOut}`, '-y']);

        let count = 0;
        const copyFromEmscripten = async (emPath, vfsDest) => {
          const names = sevenZip.FS.readdir(emPath).filter(n => n !== '.' && n !== '..');
          for (const n of names) {
            const fullEm = `${emPath}/${n}`;
            const st = sevenZip.FS.stat(fullEm);
            const nextVfs = joinPath(vfsDest, n);
            const mtime = st.mtime ? new Date(st.mtime).getTime() : archiveStat.mtimeMs;
            if (sevenZip.FS.isDir(st.mode)) {
              await window.fs.mkdir(nextVfs);
              await copyFromEmscripten(fullEm, nextVfs);
            } else {
              const fileData = sevenZip.FS.readFile(fullEm);
              await window.fs.writeFile(nextVfs, new Uint8Array(fileData), { mtime });
              count++;
            }
          }
        };
        await copyFromEmscripten(workOut, targetDir);
        return count;
      }

        if (this.cache.has(clean)) return;
        try {
          const st = await window.fs.stat(clean);
          if (st.isDirectory() || st.size > 80 * 1024 * 1024) return;
          const bytes = await window.fs.readFile(clean);
          const mime = guessMimeType(clean);
          const safeName = baseName(clean).replace(/:/g, '_');
          const file = new File([bytes], safeName, { type: mime, lastModified: st.mtimeMs });
          const blobUrl = URL.createObjectURL(file);
          this.cache.set(clean, { file, blobUrl, mime, safeName });
          this.activeUrls.add(blobUrl);
        } catch (_) {}
      },

      getSync(fullPath) {
        return this.cache.get(normPath(fullPath)) || null;
      },

      invalidate(fullPath) {
        const clean = normPath(fullPath);
        const rec = this.cache.get(clean);
        if (rec) {
          this.cache.delete(clean);
          setTimeout(() => URL.revokeObjectURL(rec.blobUrl), 6000);
        }
      },

      /* dragend 后延迟至少 5 秒（此处为 6 秒）释放或刷新 Blob URL */
      scheduleCleanupAfterDrag(fullPath) {
        const clean = normPath(fullPath);
        const rec = this.cache.get(clean);
        if (!rec) return;
        this.cache.delete(clean);
        setTimeout(() => {
          URL.revokeObjectURL(rec.blobUrl);
          this.activeUrls.delete(rec.blobUrl);
        }, 6000);
      }
    };

    /* 物理桌面 -> 虚拟桌面 反向拖拽递归导入（采用原生 arrayBuffer，readEntries 循环读取至空数组，保留真实修改日期） */
    async function importDataTransferToVfs(dataTransfer, targetDir, dropDesktopPos = null) {
      const items = dataTransfer.items ? Array.from(dataTransfer.items) : [];
      const entries = [];
      for (const item of items) {
        if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
          const entry = item.webkitGetAsEntry();
          if (entry) entries.push(entry);
        }
      }

      const importedPaths = [];

      const readAllDirectoryEntries = async (dirReader) => {
        const all = [];
        while (true) {
          const batch = await new Promise((resolve, reject) => {
            dirReader.readEntries(resolve, reject);
          });
          if (!batch || batch.length === 0) break;
          all.push(...batch);
        }
        return all;
      };

      const traverseEntry = async (entry, parentVfsDir, isTopLevel = false, indexOffset = 0) => {
        const destPath = joinPath(parentVfsDir, entry.name);
        if (entry.isDirectory) {
          await window.fs.mkdir(destPath);
          const reader = entry.createReader();
          const children = await readAllDirectoryEntries(reader);
          for (const child of children) {
            await traverseEntry(child, destPath, false, 0);
          }
          if (isTopLevel) importedPaths.push(destPath);
        } else if (entry.isFile) {
          const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
          const ab = await file.arrayBuffer();
          await window.fs.writeFile(destPath, new Uint8Array(ab), { mtime: file.lastModified });
          if (isTopLevel) importedPaths.push(destPath);
        }
        if (isTopLevel && dropDesktopPos && parentVfsDir === '/Desktop') {
          OSState.desktopPositions[destPath] = snapOrClampDesktopPos(
            dropDesktopPos.x + indexOffset * 24,
            dropDesktopPos.y + indexOffset * 24
          );
          saveDesktopPositions();
        }
      };

      if (entries.length > 0) {
        for (let i = 0; i < entries.length; i++) {
          await traverseEntry(entries[i], targetDir, true, i);
        }
      } else if (dataTransfer.files && dataTransfer.files.length > 0) {
        const files = Array.from(dataTransfer.files);
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const destPath = joinPath(targetDir, f.name);
          const ab = await f.arrayBuffer();
          await window.fs.writeFile(destPath, new Uint8Array(ab), { mtime: f.lastModified });
          importedPaths.push(destPath);
          if (dropDesktopPos && targetDir === '/Desktop') {
            OSState.desktopPositions[destPath] = snapOrClampDesktopPos(dropDesktopPos.x + i * 24, dropDesktopPos.y + i * 24);
            saveDesktopPositions();
          }
        }
      }

      if (importedPaths.length > 0) {
        showToast(`已成功导入 ${importedPaths.length} 个项目至 ${targetDir}`, 'success');
        notifyFsChanged(targetDir);
      }
      return importedPaths;
    }

    /* 导出/下载文件或文件夹至物理设备（兼容移动端无拖出能力场景） */
    async function exportVfsPathToPhysical(vfsPath, customDownloadName = null) {
      const st = await window.fs.stat(vfsPath);
      let blob;
      let downloadName = customDownloadName || st.name;
      if (st.isDirectory()) {
        showToast(`正在打包文件夹 "${st.name}" 以便导出...`, 'info');
        const tempZip = `/System/.export_${Date.now()}.zip`;
        await ArchiveEngine.compressToZip([vfsPath], tempZip);
        const bytes = await window.fs.readFile(tempZip);
        await window.fs.unlink(tempZip).catch(() => {});
        blob = new Blob([bytes], { type: 'application/zip' });
        if (!downloadName.toLowerCase().endsWith('.zip')) downloadName += '.zip';
      } else {
        const bytes = await window.fs.readFile(vfsPath);
        blob = new Blob([bytes], { type: guessMimeType(vfsPath) });
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = downloadName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 6000);
      showToast(`已导出 "${downloadName}"`, 'success');
    }

    /* =========================================================================
       严格遵循 Web/移动端自适应框选架构标准的框选器工厂
       1. getClientXY(e) 抹平 MouseEvent 与 TouchEvent
       2. 选框 pointer-events: none; position: absolute; 严格累加 scrollLeft/scrollTop
       3. 检查 e.target.closest(itemSelector)，仅在空白处启动框选
       4. document 注册 move/end，touchmove { passive: false } 调用 preventDefault()
       5. 40px 边缘自动滚动感应带 + AABB offsetLeft/Top 碰撞检测
       6. 标准 destroy() 清理函数防止监听残留
       ========================================================================= */
    function getClientXY(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      if (e.changedTouches && e.changedTouches.length > 0) {
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function createMarqueeSelector({
      container,
      marqueeEl,
      itemSelector,
      ignoreSelector = '.fe-details-header, .fe-col-resizer, button, input, select',
      shouldEnableTouchMarquee = () => true,
      onSelectionChange
    }) {
      let active = false;
      let startX = 0;
      let startY = 0;
      let lastClientX = 0;
      let lastClientY = 0;
      let additive = false;
      let baseSelected = new Set();
      let autoScrollRaf = null;
      let cachedItems = [];
      const EDGE_ZONE = 40;
      const MAX_SCROLL_SPEED = 14;

      function snapshotItems() {
        const nodes = Array.from(container.querySelectorAll(itemSelector));
        // 严格基于 offsetLeft / offsetTop 累加相对滚动容器坐标，零布局回流供 AABB 碰撞判定
        cachedItems = nodes.map(el => {
          let left = 0;
          let top = 0;
          let cur = el;
          while (cur && cur !== container) {
            left += cur.offsetLeft || 0;
            top += cur.offsetTop || 0;
            cur = cur.offsetParent;
          }
          const w = el.offsetWidth || 0;
          const h = el.offsetHeight || 0;
          return {
            el,
            path: el.dataset.path,
            left,
            top,
            right: left + w,
            bottom: top + h
          };
        });
      }

      function updateMarqueeByClient(clientX, clientY) {
        const rect = container.getBoundingClientRect();
        // 点击滚动条本身不触发
        const curX = Math.max(0, Math.min(container.scrollWidth, clientX - rect.left + container.scrollLeft));
        const curY = Math.max(0, Math.min(container.scrollHeight, clientY - rect.top + container.scrollTop));

        const x1 = Math.min(startX, curX);
        const y1 = Math.min(startY, curY);
        const x2 = Math.max(startX, curX);
        const y2 = Math.max(startY, curY);
        const w = x2 - x1;
        const h = y2 - y1;

        if (w > 3 || h > 3) {
          marqueeEl.style.display = 'block';
          marqueeEl.style.left = `${x1}px`;
          marqueeEl.style.top = `${y1}px`;
          marqueeEl.style.width = `${w}px`;
          marqueeEl.style.height = `${h}px`;

          const nextSel = new Set(additive ? baseSelected : []);
          // AABB 碰撞判定
          for (let i = 0; i < cachedItems.length; i++) {
            const it = cachedItems[i];
            const hit = !(it.right < x1 || it.left > x2 || it.bottom < y1 || it.top > y2);
            if (hit && it.path) nextSel.add(it.path);
          }
          onSelectionChange(nextSel, true);
        }
      }

      function runEdgeAutoScroll() {
        if (!active) return;
        const rect = container.getBoundingClientRect();
        let dx = 0;
        let dy = 0;

        if (lastClientY < rect.top + EDGE_ZONE) {
          dy = -Math.ceil(((rect.top + EDGE_ZONE - lastClientY) / EDGE_ZONE) * MAX_SCROLL_SPEED);
        } else if (lastClientY > rect.bottom - EDGE_ZONE) {
          dy = Math.ceil(((lastClientY - (rect.bottom - EDGE_ZONE)) / EDGE_ZONE) * MAX_SCROLL_SPEED);
        }

        if (lastClientX < rect.left + EDGE_ZONE) {
          dx = -Math.ceil(((rect.left + EDGE_ZONE - lastClientX) / EDGE_ZONE) * MAX_SCROLL_SPEED);
        } else if (lastClientX > rect.right - EDGE_ZONE) {
          dx = Math.ceil(((lastClientX - (rect.right - EDGE_ZONE)) / EDGE_ZONE) * MAX_SCROLL_SPEED);
        }

        if (dx !== 0 || dy !== 0) {
          const prevTop = container.scrollTop;
          const prevLeft = container.scrollLeft;
          container.scrollTop += dy;
          container.scrollLeft += dx;
          if (container.scrollTop !== prevTop || container.scrollLeft !== prevLeft) {
            updateMarqueeByClient(lastClientX, lastClientY);
          }
        }
        autoScrollRaf = requestAnimationFrame(runEdgeAutoScroll);
      }

      function handleStart(e) {
        const isTouch = e.type === 'touchstart';
        if (!isTouch && e.button !== 0) return;
        if (isTouch && !shouldEnableTouchMarquee()) return;
        if (e.target.closest(itemSelector)) return;
        if (ignoreSelector && e.target.closest(ignoreSelector)) return;

        const rect = container.getBoundingClientRect();
        const { x, y } = getClientXY(e);
        // 排除点击在容器原生滚动条轨道上的情况
        if (x > rect.left + container.clientWidth || y > rect.top + container.clientHeight) return;

        hideAllFloatingPanels();
        active = true;
        additive = Boolean(e.ctrlKey || e.metaKey || e.shiftKey);
        baseSelected = new Set(
          Array.from(container.querySelectorAll(`${itemSelector}.selected`))
            .map(el => el.dataset.path)
            .filter(Boolean)
        );

        startX = x - rect.left + container.scrollLeft;
        startY = y - rect.top + container.scrollTop;
        lastClientX = x;
        lastClientY = y;

        snapshotItems();
        if (!additive) onSelectionChange(new Set(), false);

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('touchmove', handleMove, { passive: false });
        document.addEventListener('touchend', handleEnd);
        document.addEventListener('touchcancel', handleEnd);

        cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = requestAnimationFrame(runEdgeAutoScroll);
      }

      function handleMove(e) {
        if (!active) return;
        if (e.type === 'touchmove') {
          e.preventDefault(); // 锁死框选过程中的页面原生滚动
        }
        const { x, y } = getClientXY(e);
        lastClientX = x;
        lastClientY = y;
        updateMarqueeByClient(x, y);
      }

      function handleEnd() {
        if (!active) return;
        active = false;
        marqueeEl.style.display = 'none';
        marqueeEl.style.width = '0px';
        marqueeEl.style.height = '0px';
        cancelAnimationFrame(autoScrollRaf);
        detachDocListeners();
      }

      function detachDocListeners() {
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
        document.removeEventListener('touchmove', handleMove);
        document.removeEventListener('touchend', handleEnd);
        document.removeEventListener('touchcancel', handleEnd);
      }

      container.addEventListener('mousedown', handleStart);
      container.addEventListener('touchstart', handleStart, { passive: true });

      return {
        destroy() {
          active = false;
          cancelAnimationFrame(autoScrollRaf);
          detachDocListeners();
          container.removeEventListener('mousedown', handleStart);
          container.removeEventListener('touchstart', handleStart);
        }
      };
    }
