<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>玄玑 OS · 织渊桌面系统</title>

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- 甄选字体：几何刻度数字 + 雕版衬线标题 + 精密等宽字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />

  <!-- CodeMirror 5.65.x 代码编辑器样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/material-darker.min.css" />

  <!-- JSZip 解压缩库 -->
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- V86 虚拟机模拟器 -->
  <script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js"></script>

  <!-- CodeMirror 5.65.x 代码编辑器内核与多语言模式 -->
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/xml/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/css/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/markdown/markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/selection/active-line.min.js"></script>

  <!-- ========== 7z-wasm 解压引擎========== -->
  <script type="module">
    import SevenZip from 'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js';
    window.__SevenZipFactory = SevenZip;
  </script>

  <style>
    /* =========================================================================
       美学体系：「玄玑刻律 · 织光层积学」(XuanJi Tectonic Astrolabe)
       双主题独立色彩工程（严禁简单 invert 反色，默认玄曜深色）
       ========================================================================= */
    :root,
    html[data-theme="dark"] {
      --bg-abyss: #090b0f;
      --bg-surface-0: #0f1319;
      --bg-surface-1: #151a22;
      --bg-surface-2: #1c232e;
      --bg-surface-3: #252e3d;
      --bg-glass: rgba(15, 19, 25, 0.84);
      --bg-glass-heavy: rgba(12, 15, 20, 0.93);
      --bg-taskbar: rgba(10, 13, 18, 0.86);
      --bg-hover: rgba(226, 179, 107, 0.11);
      --bg-active: rgba(226, 179, 107, 0.2);
      --bg-row-alt: rgba(255, 255, 255, 0.018);

      --text-primary: #ece7dc;
      --text-secondary: #a5aebd;
      --text-muted: #687385;
      --text-on-accent: #0b0d11;

      --accent: #e2b36b;
      --accent-rgb: 226, 179, 107;
      --accent-strong: #f0c67e;
      --accent-mineral: #38bdf8;
      --danger: #ef5350;
      --success: #34d399;
      --warning: #fbbf24;

      --border-subtle: rgba(236, 231, 220, 0.08);
      --border-crisp: rgba(226, 179, 107, 0.22);
      --border-strong: rgba(226, 179, 107, 0.45);

      --win-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(236, 231, 220, 0.09);
      --win-shadow-active: 0 28px 76px -10px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(var(--accent-rgb), 0.38), 0 0 28px -8px rgba(var(--accent-rgb), 0.16);
      --icon-label-bg: rgba(9, 11, 15, 0.68);
      --icon-label-text: #f3efe6;
      --marquee-bg: rgba(var(--accent-rgb), 0.16);
      --marquee-border: rgba(var(--accent-rgb), 0.78);
      --scrollbar-thumb: rgba(236, 231, 220, 0.18);
      --scrollbar-thumb-hover: rgba(var(--accent-rgb), 0.5);
    }

    html[data-theme="light"] {
      --bg-abyss: #e6e1d6;
      --bg-surface-0: #f7f4ed;
      --bg-surface-1: #efeae0;
      --bg-surface-2: #e5dfd2;
      --bg-surface-3: #d8d0c0;
      --bg-glass: rgba(247, 244, 237, 0.88);
      --bg-glass-heavy: rgba(250, 248, 243, 0.95);
      --bg-taskbar: rgba(242, 238, 229, 0.88);
      --bg-hover: rgba(168, 113, 34, 0.1);
      --bg-active: rgba(168, 113, 34, 0.18);
      --bg-row-alt: rgba(24, 28, 34, 0.025);

      --text-primary: #1a1e24;
      --text-secondary: #4c5563;
      --text-muted: #7b8494;
      --text-on-accent: #ffffff;

      --accent: #b57922;
      --accent-rgb: 181, 121, 34;
      --accent-strong: #966115;
      --accent-mineral: #0284c7;
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;

      --border-subtle: rgba(26, 30, 36, 0.1);
      --border-crisp: rgba(181, 121, 34, 0.26);
      --border-strong: rgba(181, 121, 34, 0.52);

      --win-shadow: 0 20px 50px -12px rgba(28, 25, 20, 0.22), 0 0 0 1px rgba(26, 30, 36, 0.11);
      --win-shadow-active: 0 26px 64px -10px rgba(28, 25, 20, 0.3), 0 0 0 1px rgba(var(--accent-rgb), 0.48);
      --icon-label-bg: rgba(18, 21, 26, 0.72);
      --icon-label-text: #f9f7f2;
      --marquee-bg: rgba(var(--accent-rgb), 0.15);
      --marquee-border: rgba(var(--accent-rgb), 0.78);
      --scrollbar-thumb: rgba(26, 30, 36, 0.22);
      --scrollbar-thumb-hover: rgba(var(--accent-rgb), 0.55);
    }

    :root {
      --win-radius: 8px;
      --glass-blur: 18px;
      --taskbar-h: 48px;
      --desktop-icon-w: 84px;
      --desktop-icon-h: 92px;
      --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Chakra Petch', 'Noto Serif SC', serif;
      --font-serif: 'Noto Serif SC', serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, [contenteditable="true"], .CodeMirror, .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-abyss);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* 精密滚动条 */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    /* 桌面层与壁纸层 */
    #os-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #wallpaper-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.45s ease, opacity 0.35s ease;
    }

    /* 桌面微刻网格暗纹 */
    #wallpaper-grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(var(--accent-rgb), 0.08), transparent 46%),
        linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
    }

    /* 桌面图标画布 */
    #desktop-surface {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--taskbar-h);
      z-index: 5;
      overflow: hidden;
      touch-action: none;
    }

    .desktop-icon {
      position: absolute;
      width: var(--desktop-icon-w);
      min-height: var(--desktop-icon-h);
      padding: 8px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      border-radius: calc(var(--win-radius) * 0.75);
      border: 1px solid transparent;
      cursor: pointer;
      transition: left 0.2s cubic-bezier(0.2, 0.85, 0.3, 1),
                  top 0.2s cubic-bezier(0.2, 0.85, 0.3, 1),
                  background-color 0.15s ease,
                  border-color 0.15s ease,
                  transform 0.15s ease;
    }
    .desktop-icon.dragging-touch {
      transition: none !important;
      z-index: 40;
      opacity: 0.88;
      transform: scale(1.04);
    }
    .desktop-icon:hover {
      background: rgba(var(--accent-rgb), 0.12);
      border-color: rgba(var(--accent-rgb), 0.28);
    }
    .desktop-icon.selected {
      background: rgba(var(--accent-rgb), 0.22);
      border-color: rgba(var(--accent-rgb), 0.65);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
    }
    .desktop-icon.drop-target {
      background: rgba(56, 189, 248, 0.24);
      border-color: #38bdf8;
      transform: scale(1.05);
    }
    .desktop-icon-glyph {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
    }
    .desktop-icon-label {
      max-width: 100%;
      font-size: 11.5px;
      line-height: 1.3;
      text-align: center;
      color: var(--icon-label-text);
      background: var(--icon-label-bg);
      padding: 1.5px 6px;
      border-radius: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .item-check-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(12, 15, 20, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.14s ease, background-color 0.14s ease;
      z-index: 3;
      cursor: pointer;
    }
    .desktop-icon:hover .item-check-badge,
    .desktop-icon.selected .item-check-badge,
    .fe-grid-card:hover .item-check-badge,
    .fe-grid-card.selected .item-check-badge {
      opacity: 1;
    }
    .desktop-icon.selected .item-check-badge,
    .fe-grid-card.selected .item-check-badge,
    .fe-row.selected .fe-row-check {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text-on-accent);
    }

    /* 通用自适应框选矩形（严格 pointer-events: none） */
    .xj-marquee-box {
      position: absolute;
      pointer-events: none !important;
      background: var(--marquee-bg);
      border: 1px solid var(--marquee-border);
      z-index: 90;
      display: none;
      box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.15);
    }

    /* Aero Snap 预览幻影框 */
    #aero-snap-phantom {
      position: fixed;
      z-index: 8999;
      pointer-events: none;
      background: rgba(var(--accent-rgb), 0.14);
      border: 1.5px solid rgba(var(--accent-rgb), 0.72);
      border-radius: var(--win-radius);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 32px rgba(var(--accent-rgb), 0.25), inset 0 0 24px rgba(var(--accent-rgb), 0.12);
      opacity: 0;
      transform: scale(0.96);
      transition: all 0.16s cubic-bezier(0.2, 0.85, 0.3, 1);
    }
    #aero-snap-phantom.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 窗口系统与 Aero Peek 透视模式 */
    #windows-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--taskbar-h);
      z-index: 20;
      pointer-events: none;
    }

    .os-window {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-glass-heavy);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--win-radius);
      box-shadow: var(--win-shadow);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      min-width: 280px;
      min-height: 200px;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.85, 0.3, 1), box-shadow 0.2s ease;
    }
    .os-window.active {
      box-shadow: var(--win-shadow-active);
      border-color: var(--border-crisp);
    }
    .os-window.minimized {
      opacity: 0 !important;
      transform: translateY(28px) scale(0.92) !important;
      pointer-events: none !important;
    }
    .os-window.maximized {
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
    }
    /* Aero Peek 桌面透视幽灵线框效果 */
    body.aero-peek-all .os-window:not(.minimized) {
      opacity: 0.08 !important;
      backdrop-filter: none !important;
      border: 1.5px solid var(--accent) !important;
      box-shadow: none !important;
      pointer-events: none !important;
    }
    body.aero-peek-single .os-window:not(.peek-focus):not(.minimized) {
      opacity: 0.1 !important;
      backdrop-filter: none !important;
      border: 1px dashed var(--accent) !important;
    }

    /* 建筑刻律风格窗口标题栏（右侧几何窗控，严禁模仿苹果红绿灯） */
    .win-titlebar {
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 12px;
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.07) 0%, transparent 55%);
      border-bottom: 1px solid var(--border-subtle);
      cursor: default;
      position: relative;
      touch-action: none;
    }
    .os-window.active .win-titlebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 14px;
      width: 56px;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .win-title-group {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
      pointer-events: none;
    }
    .win-title-text {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .win-ctrl-btn {
      width: 32px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: calc(var(--win-radius) * 0.45);
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .win-ctrl-btn:hover {
      background: var(--bg-surface-3);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }
    .win-ctrl-btn.close-btn:hover {
      background: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
    }

    .win-body {
      flex: 1;
      min-height: 0;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-surface-0);
    }

    /* 八向边缘调整大小感应带 */
    .win-resizer {
      position: absolute;
      z-index: 30;
      touch-action: none;
    }
    .os-window.maximized .win-resizer { display: none; }
    .win-resizer.r-n  { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .win-resizer.r-s  { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .win-resizer.r-w  { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .win-resizer.r-e  { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .win-resizer.r-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .win-resizer.r-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .win-resizer.r-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .win-resizer.r-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

    /* =========================================================================
       文件资源管理器：严格遵循 Windows 详细信息视图左对齐连续列 + 右侧空白框选区
       ========================================================================= */
    .fe-details-viewport {
      position: relative;
      flex: 1;
      overflow: auto;
      background: var(--bg-surface-0);
      touch-action: pan-x pan-y;
    }
    /* 列头背景铺满整行，内部列严格按设定宽度从左到右排列，不自动拉伸 */
    .fe-details-header {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: stretch;
      min-width: 100%;
      width: max-content;
      height: 32px;
      background: var(--bg-surface-1);
      border-bottom: 1px solid var(--border-subtle);
    }
    .fe-col-head {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      padding: 0 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      border-right: 1px solid var(--border-subtle);
      flex-shrink: 0;
      flex-grow: 0;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background-color 0.14s ease, color 0.14s ease;
    }
    .fe-col-head:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .fe-col-head.drag-over-col {
      background: var(--bg-active);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .fe-col-resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 4;
      touch-action: none;
    }
    .fe-col-resizer:hover::after,
    .fe-col-resizer.resizing::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--accent);
    }

    /* 关键：每行只占各列总宽度，绝不撑满 100%，右侧空白与行间空白属于列表背景供框选 */
    .fe-details-rows {
      position: relative;
      padding: 4px 0 36px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: calc(100% - 32px);
    }
    .fe-row {
      display: flex;
      align-items: center;
      height: 32px;
      margin-bottom: 2px;
      flex-shrink: 0;
      flex-grow: 0;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.1s ease, border-color 0.1s ease;
    }
    .fe-row:nth-child(even) {
      background: var(--bg-row-alt);
    }
    .fe-row:hover {
      background: var(--bg-hover);
      border-color: rgba(var(--accent-rgb), 0.22);
    }
    .fe-row.selected {
      background: var(--bg-active);
      border-color: rgba(var(--accent-rgb), 0.58);
    }
    .fe-row.drop-target {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
    }
    .fe-cell {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      padding: 0 10px;
      height: 100%;
      flex-shrink: 0;
      flex-grow: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      color: var(--text-primary);
      pointer-events: none;
    }
    .fe-cell.muted {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11.5px;
    }
    .fe-row-check {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      border: 1px solid var(--border-strong);
      margin-right: 8px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      opacity: 0.45;
    }
    .fe-row:hover .fe-row-check,
    .fe-row.selected .fe-row-check {
      opacity: 1;
    }

    /* =========================================================================
       条漫阅读器（Webtoon 无缝滚动架构标准）
       ========================================================================= */
    .manga-root-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      overscroll-behavior-y: none;
      contain: layout style;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .manga-scroll-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000000;
      overscroll-behavior-y: none;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: pan-y;
      contain: layout style;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
    }
    .manga-scroll-viewport.grabbing {
      cursor: grabbing;
    }
    .manga-strip-column {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000000;
    }
    .manga-slot {
      width: 100%;
      background: #070709;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .manga-slot.skeleton {
      aspect-ratio: 800 / 1160;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .manga-slot img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }
    /* 漫画沉浸全屏模式：自动隐藏标题栏与工具栏，仅保留右上角隐蔽 × 按钮 */
    .os-window.manga-immersive-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
      border-radius: 0 !important;
      border: none !important;
    }
    .os-window.manga-immersive-fullscreen .win-titlebar,
    .os-window.manga-immersive-fullscreen .manga-toolbar,
    .os-window.manga-immersive-fullscreen .win-resizer {
      display: none !important;
    }
    .manga-fs-exit-btn {
      display: none;
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 10002;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 17, 22, 0.42);
      color: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.16);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }
    .manga-fs-exit-btn:hover {
      background: rgba(220, 38, 38, 0.85);
      color: #ffffff;
    }
    .os-window.manga-immersive-fullscreen .manga-fs-exit-btn {
      display: flex !important;
    }

    /* CodeMirror 定制适配 */
    .CodeMirror {
      height: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 13px;
      line-height: 1.58;
    }

    /* 任务栏与底部响应式 Dock */
    #taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-h);
      z-index: 5000;
      background: var(--bg-taskbar);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid var(--border-crisp);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 8px;
      gap: 6px;
    }

    .taskbar-app-pill {
      height: 36px;
      padding: 0 10px;
      border-radius: calc(var(--win-radius) * 0.65);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      cursor: pointer;
      position: relative;
      max-width: 176px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .taskbar-app-pill:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }
    .taskbar-app-pill.running::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 2.5px;
      border-radius: 2px;
      background: var(--text-muted);
      transition: width 0.2s ease, background-color 0.2s ease;
    }
    .taskbar-app-pill.focused {
      background: var(--bg-active);
      color: var(--text-primary);
      border-color: var(--border-crisp);
    }
    .taskbar-app-pill.focused::after {
      width: 22px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .taskbar-pill-close {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      color: var(--text-muted);
      transition: opacity 0.14s ease, background-color 0.14s ease;
    }
    .taskbar-app-pill:hover .taskbar-pill-close {
      opacity: 1;
    }
    .taskbar-pill-close:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Aero Peek 右侧透视桌面窄条 */
    #aero-peek-sliver {
      width: 12px;
      height: 100%;
      border-left: 1px solid var(--border-crisp);
      background: rgba(var(--accent-rgb), 0.06);
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease;
    }
    #aero-peek-sliver:hover {
      background: rgba(var(--accent-rgb), 0.35);
    }

    /* 弹出层：开始菜单、日历面板、右键菜单、任务栏预览 */
    .floating-panel {
      position: fixed;
      z-index: 7500;
      background: var(--bg-glass-heavy);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-crisp);
      border-radius: var(--win-radius);
      box-shadow: var(--win-shadow-active);
      animation: panelReveal 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes panelReveal {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 系统暗色加载遮罩（用于网页/HTML iframe 防白屏闪烁与挂载反馈） */
    .xj-dark-loader {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: #0c0f14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #e2b36b;
      transition: opacity 0.25s ease;
    }
    .xj-dark-loader.hidden-loader {
      opacity: 0;
      pointer-events: none;
    }
    .xj-astrolabe-spinner {
      width: 38px;
      height: 38px;
      border: 2px solid rgba(226, 179, 107, 0.18);
      border-top-color: #e2b36b;
      border-right-color: #38bdf8;
      border-radius: 50%;
      animation: xjSpin 0.85s linear infinite;
    }
    @keyframes xjSpin {
      to { transform: rotate(360deg); }
    }

    /* 桌面端隐藏移动端专属多选按钮，移动端转换为悬浮底部 Dock */
    .mobile-only-ctrl {
      display: none !important;
    }

    @media (max-width: 768px) {
      :root {
        --taskbar-h: 60px;
        --desktop-icon-w: 76px;
        --desktop-icon-h: 84px;
      }
      .mobile-only-ctrl {
        display: inline-flex !important;
      }
      .desktop-only-label {
        display: none !important;
      }
      #taskbar {
        left: 8px;
        right: 8px;
        bottom: 6px;
        height: 52px;
        border-radius: 14px;
        border: 1px solid var(--border-crisp);
        padding: 0 8px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      .taskbar-app-pill {
        padding: 0 9px;
        max-width: 44px;
      }
      .taskbar-app-pill .pill-label,
      .taskbar-app-pill .taskbar-pill-close {
        display: none;
      }
      .os-window {
        min-width: 92vw;
      }
      .win-ctrl-btn {
        width: 34px;
        height: 30px;
      }
    }
  </style>
</head>
<body>
  <div id="os-root">
    <!-- 壁纸与纹理层 -->
    <div id="wallpaper-layer"></div>
    <div id="wallpaper-grain"></div>

    <main id="desktop-surface" aria-label="玄玑桌面区域">
      <div id="desktop-icons-container"></div>
      <div id="desktop-marquee" class="xj-marquee-box"></div>
    </main>

    <!-- Aero Snap 边缘吸附幻影层 -->
    <div id="aero-snap-phantom"></div>

    <!-- 窗口管理层 -->
    <section id="windows-layer" aria-label="应用窗口层"></section>

    <!-- 底部任务栏 / 移动端自适应 Dock -->
    <footer id="taskbar">
      <div class="flex items-center gap-1.5 min-w-0 flex-1 overflow-x-auto no-scrollbar py-1">
        <!-- 开始启动器按钮 -->
        <button id="btn-start-menu" class="h-9 px-3 rounded-md flex items-center gap-2 font-medium text-xs tracking-wider cursor-pointer transition-all border border-transparent hover:border-[var(--border-crisp)] hover:bg-[var(--bg-hover)] shrink-0" title="玄玑启动器">
          <span id="start-btn-glyph" class="w-5 h-5 flex items-center justify-center text-[var(--accent)]"></span>
          <span class="font-semibold tracking-widest desktop-only-label" style="font-family: var(--font-serif);">玄玑</span>
        </button>

        <div class="w-px h-5 bg-[var(--border-subtle)] mx-0.5 shrink-0"></div>

        <!-- 全局快捷搜索按钮 -->
        <button id="btn-global-search" class="h-9 px-2.5 rounded-md flex items-center gap-1.5 text-xs text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-hover)] cursor-pointer shrink-0" title="全局文件与应用检索">

      <div class="flex items-center h-full shrink-0 gap-1">

          <span id="tray-mount-glyph" class="w-3.5 h-3.5"></span>
          <span id="tray-backend-badge" style="font-family: var(--font-mono);">OPFS</span>

        <button id="btn-theme-quick" class="w-8 h-8 rounded flex items-center justify-center text-[var(--text-secondary)] hover:text-[var(--accent)] hover:bg-[var(--bg-hover)] cursor-pointer" title="切换深色 / 浅色模式">
          <span id="tray-theme-glyph" class="w-4 h-4"></span>
        </button>

        <button id="btn-clock-tray" class="h-9 px-2.5 rounded flex flex-col items-end justify-center leading-tight hover:bg-[var(--bg-hover)] cursor-pointer text-right shrink-0" title="点击打开玄玑日历">
          <span id="tray-time-text" class="text-xs font-semibold tracking-wide" style="font-family: var(--font-display);">上午 12:00</span>
          <span id="tray-date-text" class="text-[10.5px] text-[var(--text-secondary)] desktop-only-label" style="font-family: var(--font-mono);">2026-01-01</span>
        </button>

        <div id="aero-peek-sliver" title="悬停透视桌面 (Aero Peek) / 点击显示桌面"></div>
      </div>
    </footer>

    <!-- 开始菜单浮层 -->
    <div id="start-menu-panel" class="floating-panel hidden" style="left: 10px; bottom: calc(var(--taskbar-h) + 8px); width: min(560px, calc(100vw - 20px)); max-height: calc(100vh - 80px);"></div>

    <!-- 日历浮层（支持上月 / 下月 / 今日 / 12-24小时制切换） -->
    <div id="calendar-panel" class="floating-panel hidden" style="right: 12px; bottom: calc(var(--taskbar-h) + 8px); width: min(330px, calc(100vw - 24px));"></div>

    <!-- 任务栏悬停 Aero Peek 窗口预览卡片 -->

    <div id="context-menu" class="floating-panel hidden py-1.5 min-w-[205px]" style="z-index: 9500;"></div>

    <div id="toast-stack" class="fixed top-4 right-4 z-[9800] flex flex-col gap-2 pointer-events-none max-w-sm"></div>

    <!-- 隐藏通用文件选择器 -->
    <input type="file" id="global-file-input" class="hidden" multiple />
    <input type="file" id="wallpaper-file-input" class="hidden" accept="image/*" />

       模块 2：系统配置、Cookie/LocalStorage 协同持久化与通用工具函数
       ========================================================================= */
    const CookieStore = {
      set(key, val, days = 365) {
        try {
          const exp = new Date(Date.now() + days * 86400e3).toUTCString();
          document.cookie = `${encodeURIComponent(key)}=${encodeURIComponent(String(val))}; expires=${exp}; path=/; SameSite=Lax`;
        } catch (_) {}
      },
      get(key) {
        try {
          const prefix = encodeURIComponent(key) + '=';
          const parts = (document.cookie || '').split('; ');
          for (const p of parts) {
            if (p.startsWith(prefix)) return decodeURIComponent(p.slice(prefix.length));
          }
        } catch (_) {}
        return null;
      },
      clearAll() {
        try {
          const parts = (document.cookie || '').split('; ');
          for (const p of parts) {
            const eq = p.indexOf('=');
            const name = eq > -1 ? p.slice(0, eq) : p;
            if (name.startsWith('xj_')) {
              document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
            }
          }
        } catch (_) {}
      }
    };

    function loadInitialSettings() {
      let saved = {};
      try {
        const raw = localStorage.getItem('xuanji_os_settings_v1');
        if (raw) saved = JSON.parse(raw);
      } catch (_) {}
      const merged = { ...DEFAULT_SETTINGS, ...saved };
      // 若 localStorage 被清空则从 Cookie 协同恢复关键偏好
      if (!saved.theme && CookieStore.get('xj_theme')) merged.theme = CookieStore.get('xj_theme');
      if (!saved.primaryBackend && CookieStore.get('xj_backend')) merged.primaryBackend = CookieStore.get('xj_backend');
      if (saved.clock12Hour === undefined && CookieStore.get('xj_clock12') !== null) {
        merged.clock12Hour = CookieStore.get('xj_clock12') === '1';
      }
      if (saved.winRadius === undefined && CookieStore.get('xj_radius') !== null) {
        merged.winRadius = Number(CookieStore.get('xj_radius')) || 8;
      }
      return merged;
    }

    function saveSettings() {
      try {
        localStorage.setItem('xuanji_os_settings_v1', JSON.stringify(OSState.settings));
      } catch (_) {}
      CookieStore.set('xj_theme', OSState.settings.theme);
      CookieStore.set('xj_backend', OSState.settings.primaryBackend);
      CookieStore.set('xj_clock12', OSState.settings.clock12Hour ? '1' : '0');
      CookieStore.set('xj_radius', OSState.settings.winRadius);
      // 同步快照写入虚拟文件系统以实现四层紧密持久化
      if (window.fs && window.fs._ready) {
        window.fs.writeFile('/System/settings.json', JSON.stringify(OSState.settings, null, 2)).catch(() => {});
      }
    }

    function loadDesktopPositions() {

    function saveDesktopPositions() {

      } catch (_) {}
