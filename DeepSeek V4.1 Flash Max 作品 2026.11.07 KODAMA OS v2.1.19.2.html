  function resolve(p) { if (!p) return cwd; if (p.startsWith('/')) return normPath(p); if (p === '..') return parentPath(cwd); if (p === '~') return fs.home(); return normPath(joinPath(cwd, p)); }
  function parseArgs(s) { const out=[]; let cur=''; let q=null; for (let i=0;i<s.length;i++){ const c=s[i]; if (q){ if(c===q) q=null; else cur+=c; } else if(c==='"'||c==="'") q=c; else if(/\s/.test(c)){ if(cur){out.push(cur);cur='';} } else cur+=c; } if(cur) out.push(cur); return out; }
  const commands = {
    echo() {},
    help() { line(`<span class="term-cmd">常用命令</span>\n  ls [路径]       列出目录\n  cd [路径]       切换目录\n  pwd             当前路径\n  cat <文件>      读取文本\n  mkdir <名称>    新建文件夹\n  touch <文件>    新建空文件\n  echo 文本 > 文件 写入文本\n  rm <项目>       删除（目录递归）\n  mv <源> <目标>  移动或重命名\n  cp <源> <目录>  复制\n  zip <名称> <项目...>  压缩\n  unzip <压缩包>  解压到当前目录\n  open <项目>     用对应应用打开\n  tree [路径]     目录树\n  df              存储用量\n  mount           显示挂载点\n  neofetch        系统信息\n  clear           清屏\n  date            当前时间`); },
    pwd() { line(esc(cwd)); },
    async ls(a) { const p = resolve(a[0]); try { const list = await fs.readdir(p); if (!list.length) return line('<span class="term-dim">（空目录）</span>'); list.sort((x,y)=> x.isDir===y.isDir ? naturalCompare(x.name,y.name) : x.isDir ? -1 : 1).forEach(it => { line(`${it.isDir ? '<span class="term-path">'+icon('folder','ic')+'</span>' : icon(typeInfo(it.name).icon,'ic')} <span class="${it.isDir?'term-path':''}">${esc(it.name)}${it.isDir?'/':''}</span>  <span class="term-dim" style="float:right">${it.isDir?'文件夹':fmtBytes(it.size)} · ${fmtDate(it.mtime,'short')}</span>`); }); } catch(e) { line('ls: ' + esc(e.message), 'term-err'); } },
    async cd(a) { const p = resolve(a[0]); try { const st = await fs.stat(p); if (!st.isDir) return line('cd: 不是文件夹', 'term-err'); cwd = p; prompt(); } catch(e) { line('cd: ' + esc(e.message), 'term-err'); } },
    async cat(a) { if (!a[0]) return line('cat: 需要一个文件路径','term-err'); try { const txt = await fs.readFile(resolve(a[0]),'text'); line(esc(txt.slice(0, 20000)) || '<span class="term-dim">（空文件）</span>'); } catch(e) { line('cat: ' + esc(e.message),'term-err'); } },
    async mkdir(a) { if (!a[0]) return line('mkdir: 缺少名称','term-err'); try { await fs.mkdir(resolve(a[0])); line('已创建目录 ' + esc(resolve(a[0]))); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async touch(a) { if (!a[0]) return line('touch: 缺少文件名','term-err'); try { const p = resolve(a[0]); if (!(await fs.exists(p))) await fs.writeFile(p, new Blob([])); else await fs.writeFile(p, await fs.readFile(p,'blob'), {mtime:Date.now()}); line('已写入 ' + esc(p)); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async rm(a) { if (!a[0]) return line('rm: 缺少路径','term-err'); try { await fs.remove(resolve(a[0])); line('已删除 ' + esc(resolve(a[0]))); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async mv(a) { if (a.length<2) return line('mv: 需要源与目标','term-err'); try { const src = resolve(a[0]); let dst = resolve(a[1]); if ((await fs.stat(dst).catch(()=>null))?.isDir) dst = joinPath(dst, baseName(src)); await fs.rename(src, dst); line('已移动 → ' + esc(dst)); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async cp(a) { if (a.length<2) return line('cp: 需要源与目标目录','term-err'); try { const dst = await fs.copyTo(resolve(a[0]), resolve(a[1])); line('已复制 → ' + esc(dst)); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async zip(a) { if (a.length<2) return line('zip: 需要归档名与至少一个项目','term-err'); try { const dest = await compressPathsTo(a.slice(1).map(resolve), cwd, a[0].endsWith('.zip')?a[0]:a[0]+'.zip'); line('已创建 ' + esc(dest)); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async unzip(a) { if (!a[0]) return line('unzip: 需要压缩包路径','term-err'); try { const r = await extractArchiveTo(resolve(a[0]), cwd); line(`已解压 ${r.count} 个文件 → ${esc(r.target)}`); emit('fs-changed'); } catch(e) { line(esc(e.message),'term-err'); } },
    async open(a) { if (!a[0]) return line('open: 需要路径','term-err'); openPath(resolve(a[0])); line('已请求打开 ' + esc(resolve(a[0]))); },
    async tree(a) { const root = resolve(a[0]); let count = 0; const walk = async (p, prefix) => { if (count > 260) return; let list=[]; try { list = await fs.readdir(p); } catch(e){ return; } list.sort((x,y)=>naturalCompare(x.name,y.name)); for (let i=0;i<list.length;i++) { const it = list[i]; const last = i === list.length-1; line('<span class="term-dim">'+esc(prefix + (last?'└─ ':'├─ '))+'</span>' + esc(it.name) + (it.isDir?'/':'')); count++; if (it.isDir) await walk(it.path, prefix + (last?'   ':'│  ')); } }; line('<span class="term-path">'+esc(root)+'</span>'); await walk(root,''); },
    async df() { try { const est = await navigator.storage.estimate(); line(`配额：${fmtBytes(est.quota)}  已用：${fmtBytes(est.usage)}  (${(est.usage/est.quota*100).toFixed(2)}%)`); const opfsSize = await fs.dirSize('/'); line(`OPFS 用户空间：${fmtBytes(opfsSize)}`); if (fs.idbOK) line(`IndexedDB 用户空间：${fmtBytes(await fs.dirSize('/IDB'))}`); fs.mounts.forEach(m => line(`本地挂载 ${esc(m.name)}：${esc(m.path)} · ${m.permission}`)); } catch(e) { line(esc(e.message),'term-err'); } },
    mount() { if (!fs.mounts.length) return line('<span class="term-dim">尚未挂载本地文件夹。使用终端外部的挂载按钮。</span>'); fs.mounts.forEach(m => line(`${icon('plug')} ${esc(m.name)} → ${esc(m.path)} <span class="term-dim">(${m.permission})</span>`)); },
    async date() { line(fmtDate(Date.now(),'long')); },
    async clear() { out.innerHTML = ''; },
    async neofetch() { line(`<div class="neofetch"><pre>      ▄▄▄▄▄▄▄
   ▄██████████▄
  ██████████████   KODAMA
  ███  ████  ███   ——
  ██████████████   OS
   ▀██████████▀
      ▀▀▀▀▀▀▀</pre><div class="nf-lines"><b>user</b>@<b>local</b><br>────────────<br><b>OS</b> KODAMA OS 2.0<br><b>Host</b> Browser Workstation<br><b>Shell</b> kodama-sh<br><b>Storage</b> OPFS + IndexedDB<br><b>Mounts</b> ${fs.mounts.length}<br><b>Theme</b> ${settings.theme} / ${settings.accent}<br><b>Engine</b> ${esc((navigator.userAgent.match(/(Chrome|Firefox|Safari|Edg)\/[\d.]+/)||['Web Engine'])[0])}</div></div>`); }
  };
  async function run(raw) {
    const str = raw.trim(); if (!str) return;
    line(`<span class="term-path">${esc(cwd)}</span> <span class="term-cmd">$</span> ${esc(str)}`);
    hist.push(str); hi = hist.length;
    if (!commands[str.split(/\s+/)[0]]) { line('kodama-sh: 未找到命令：' + esc(str.split(/\s+/)[0]) + '。输入 help 查看。','term-err'); prompt(); return; }
    try {

  return { destroy() {} };
};

/* =========================================================
   MEDIA PLAYER / PDF / ARCHIVE

APP_LAUNCHERS.player = async function(body, params = {}, rec) {
  let path = normPath(params.path || ''); let playlist = [], index = 0, mediaURL = null, destroyed = false;
  const isVideo = typeInfo(baseName(path)).cat === 'video';
  body.innerHTML = `<div class="media-app"><div class="toolbar"><button class="btn sm" id="md-prev">${icon('chev-l')}<span class="hide-m">上一个</span></button><button class="btn sm" id="md-next"><span class="hide-m">下一个</span>${icon('chev-r')}</button><span class="sep"></span><button class="btn sm primary" id="md-toggle">${icon('pause')}<span>播放 / 暂停</span></button><button class="btn sm ghost" id="md-download">${icon('download')}<span class="hide-m">导出</span></button><div class="grow"></div><span class="chip">${isVideo?'视频':'音频'} · 浏览器原生解码</span></div>
    <div style="display:flex;flex:1;min-height:0"><div class="media-stage" id="md-stage">${isVideo?'<video id="md-video" controls playsinline></video>':'<div class="audio-orb paused" id="md-orb"><span class="note">K</span></div><audio id="md-audio" controls></audio>'}</div><div class="media-list" id="md-list"></div></div>
    <div class="media-meta"><div style="width:32px;height:32px;border-radius:8px;background:#172116;display:grid;place-items:center;color:#d8f26a">${icon(isVideo?'video':'music')}</div><div style="min-width:0;flex:1"><div class="mm-t" id="md-title">—</div><div class="mm-s" id="md-sub">—</div></div><div class="chip" id="md-count">—</div></div><div class="statusbar" style="background:#0b110d;border-color:rgba(255,255,255,.08);color:#6f816b"><span class="sgroup">本地播放</span><span class="sgroup">拖动进度条可继续浏览</span><div class="spacer"></div><span class="sgroup">${esc(path)}</span></div></div>`;
  async function loadPlaylist() { try { const list = await fs.readdir(parentPath(path)); playlist = list.filter(x => !x.isDir && typeInfo(x.name).cat === (isVideo ? 'video' : 'audio')).sort((a,b)=>naturalCompare(a.name,b.name)); } catch(e) { playlist = [{path, name:baseName(path)}]; } index = Math.max(0, playlist.findIndex(x => x.path === path)); $('#md-list', body).innerHTML = `<div class="mlabel">同目录 · ${playlist.length}</div>` + playlist.map((p,i) => `<button class="mitem ${p.path===path?'active':''}" data-i="${i}">${icon(isVideo?'video':'music')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span></button>`).join(''); $('#md-list', body).querySelectorAll('[data-i]').forEach(b => b.onclick = () => play(Number(b.dataset.i))); }
  async function play(i) {
    index = clamp(i, 0, Math.max(0, playlist.length-1)); const item = playlist[index] || { path, name:baseName(path) }; path = item.path;
    if (mediaURL) { revokeURL(mediaURL); mediaURL = null; }
    try {
      const blob = await fs.readFile(path, 'blob'); mediaURL = makeObjectURL(new Blob([blob], {type:blob.type || mimeFor(item.name)}));
      const media = body.querySelector('video,audio'); media.src = mediaURL; media.load(); media.play().catch(()=>{});
      $('#md-title', body).textContent = item.name; $('#md-sub', body).textContent = `${esc ? '' : ''}${fmtDate(Date.now(),'time')} · ${blob.size ? fmtBytes(blob.size) : ''} · ${path}`; $('#md-count', body).textContent = `${index+1} / ${playlist.length}`;
      setWindowTitle(rec, item.name); setWindowSub(rec, path); rememberFile(path, item.name);
      $('#md-list', body).querySelectorAll('.mitem').forEach((b,bi)=>b.classList.toggle('active', bi===index));
    } catch(e) { toast('无法播放媒体', e.message, {type:'error'}); }
  }
  $('#md-prev', body).onclick = () => play(index-1); $('#md-next', body).onclick = () => play(index+1);
  const mediaEl = body.querySelector('video,audio');
  mediaEl.addEventListener('play', () => { const o = $('#md-orb', body); if (o) o.classList.remove('paused'); const t = $('#md-toggle', body); if (t) t.innerHTML = icon('pause') + '<span>暂停</span>'; });

async function findDiskImages() {
  const out = []; const seen = new Set();
  const roots = ['/', '/IDB', fs.home() + '/Downloads', fs.home() + '/Projects', fs.home() + '/Documents'];
  for (const root of roots) {
    if (seen.has(root)) continue; seen.add(root);
    const queue = [{ path:root, depth:0 }];
    while (queue.length) {
      const q = queue.shift(); if (q.depth > 3) continue;
      let list = []; try { list = await fs.readdir(q.path); } catch(e) { continue; }
      for (const it of list) {
        if (it.isDir) { if (!['node_modules','.git'].includes(it.name)) queue.push({ path:it.path, depth:q.depth+1 }); }
        else if (['iso','img','bin','fda'].includes(fileExt(it.name))) out.push(it);
        if (out.length > 90) return out;
      }
    }
  }
  return out;
}

async function analyzeVolume(root) {
  const result = { total:0, count:0, dirs:0, by:{ documents:0, images:0, media:0, code:0, archive:0, other:0 }, files:[] };

  while (queue.length && guard < 4200) {
    const q = queue.shift(); let list = []; try { list = await fs.readdir(q.path); } catch(e) { continue; }
    for (const it of list) {
      guard++;
      if (it.isDir) { result.dirs++; if (q.depth < 10) queue.push({ path:it.path, depth:q.depth+1 }); continue; }
      result.count++; result.total += it.size || 0;
      const c = it.cat; result.by[c === 'image' ? 'images' : c === 'audio' || c === 'video' ? 'media' : c === 'text' || c === 'sheet' || c === 'pdf' || c === 'unknown' ? 'documents' : c === 'code' || c === 'html' ? 'code' : c === 'archive' ? 'archive' : 'other'] += it.size || 0;
      if (result.files.length < 500) result.files.push(it);

}

  function renderStorageStatic() {

  async function analyzeStorage() {
    if (analyzing) return; analyzing = true;
    const visual = $('#storage-visual', body); if (!visual) { analyzing = false; return; }
    try {
      const [opfs, idb] = await Promise.all([fs.opfsOK ? analyzeVolume('/') : null, fs.idbOK ? analyzeVolume('/IDB') : null]);
      if (destroyed || tab !== 'storage') { analyzing = false; return; }
      let mountData = []; for (const m of fs.mounts) { try { mountData.push({ m, a: await analyzeVolume(m.path) }); } catch(e) { mountData.push({ m, a:null }); } }
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : { usage:0, quota:0 };
      const used = opfs ? opfs.total : 0, usedIdb = idb ? idb.total : 0;
      const totalData = used + usedIdb; const quota = est.quota || 0;
      const pct = quota ? clamp(((est.usage || totalData) / quota) * 100, .1, 100) : 0;
      const circumference = 2 * Math.PI * 42; const offset = circumference - (pct/100) * circumference;
      const by = { documents:0, images:0, media:0, code:0, archive:0, other:0 };
      [opfs, idb].forEach(a => { if (a) Object.keys(by).forEach(k => by[k] += a.by[k] || 0); });
      const totalBy = Math.max(1, Object.values(by).reduce((x,y)=>x+y,0));
      const colors = { documents:'var(--accent-3)', images:'var(--accent)', media:'var(--accent-2)', code:'#a5b8ff', archive:'#e6b86a', other:'var(--muted)' };
      const labels = { documents:'文稿 / 表格 / PDF', images:'图片', media:'音频 / 视频', code:'代码 / 网页', archive:'压缩包', other:'其他' };
      storageData = { opfs, idb, est, mountData };
      visual.innerHTML = `
      <div class="storage-top"><div class="ring"><svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"></circle><circle class="ring-fg" cx="50" cy="50" r="42" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle></svg><div class="ring-txt"><b>${pct.toFixed(1)}%</b><span>配额占用</span></div></div>
      <div class="storage-info"><div class="si-line"><span>浏览器总用量</span><b>${fmtBytes(est.usage || totalData)}</b></div><div class="si-line" style="color:var(--muted)"><span>可用配额</span><b style="color:var(--muted)">${fmtBytes(quota)}</b></div><div class="si-bar">${Object.entries(by).map(([k,v])=>`<i style="width:${(v/totalBy*100).toFixed(2)}%;background:${colors[k]}" title="${labels[k]} ${fmtBytes(v)}"></i>`).join('')}</div><div class="si-legend">${Object.entries(by).map(([k,v])=>`<span><i style="background:${colors[k]}"></i>${labels[k]} · ${fmtBytes(v)}</span>`).join('')}</div><div class="hint" style="margin-top:6px">数字来自真实递归读取；配额来自 Storage API。</div></div></div>
      <div class="storage-grid">
        <div class="storage-card"><div class="scm">${icon('drive')}OPFS 磁盘</div><div class="scn">${opfs ? fmtBytes(opfs.total) : '不可用'}</div><div class="scd">${opfs ? opfs.count + ' 个文件 · ' + opfs.dirs + ' 个目录 · 真实大小' : '当前浏览器不支持'}</div></div>
        <div class="storage-card"><div class="scm">${icon('database')}IndexedDB</div><div class="scn">${idb ? fmtBytes(idb.total) : '不可用'}</div><div class="scd">${idb ? idb.count + ' 个文件 · 对象存储 · 元数据副本' : '当前浏览器不支持'}</div></div>
        <div class="storage-card"><div class="scm">${icon('plug')}本地挂载</div><div class="scn">${fs.mounts.length}</div><div class="scd">${fs.mounts.length ? mountData.map(x=>esc(x.m.name)).join(' · ') : '尚未挂载，挂载后不占用浏览器配额'}</div></div>
        <div class="storage-card wide"><div class="scm">${icon('archive')}账本与设置</div><div class="scd" style="margin-top:6px;line-height:1.8">localStorage 元数据账本：${fmtBytes(new Blob([JSON.stringify(META.data)]).size)} · ${Object.keys(META.data).length} 条时间记录<br>Cookie 信标：${document.cookie.includes('kodama_beacon')?'已写入':'被浏览器阻止'} · localStorage 设置与草稿会自动恢复<br>双后端路由：路径以 /IDB 开头写入 IndexedDB；/mnt/local 路由到本地文件夹；其余写入 OPFS</div></div>
      </div>`;
      const mountsBox = $('#set-mounts', body);
      if (mountsBox) mountsBox.innerHTML = fs.mounts.length ? fs.mounts.map(m => `<div class="mount-card"><div class="mi">${icon('plug')}</div><div class="ml"><b>${esc(m.name)}</b><span>${esc(m.path)} · ${m.permission === 'granted' ? '已授权读写' : '需要重新授权'}</span></div>${m.permission !== 'granted' ? `<button class="btn sm" data-perm="${esc(m.path)}">授权</button>` : ''}<button class="btn sm ghost" data-unmount2="${esc(m.path)}" title="卸载">${icon('x')}</button></div>`).join('') : `<div class="sm-empty" style="margin:0">尚未挂载本地文件夹</div>`;
      mountsBox?.querySelectorAll('[data-perm]').forEach(b => b.onclick = async () => { await fs.requestMountPermission(b.dataset.perm); analyzeStorage(); });
      mountsBox?.querySelectorAll('[data-unmount2]').forEach(b => b.onclick = async () => { await fs.unmount(b.dataset.unmount2); analyzeStorage(); renderWidgetMounts(); });
    } catch(e) { if (visual) visual.innerHTML = `<div class="warn-box">${icon('alert')}<div>分析失败：${esc(e.message)}</div></div>`; }
    analyzing = false;
  }

    main.querySelectorAll('[data-accent]').forEach(b => b.onclick = () => { settings.accent = b.dataset.accent; settings.accentCustom = ''; saveSettings(); main.querySelectorAll('[data-accent]').forEach(x => x.classList.toggle('active', x.dataset.accent === settings.accent)); });
    main.querySelectorAll('[data-appvisible]').forEach(b => b.onclick = () => { const id = b.dataset.appvisible; settings.hiddenApps = settings.hiddenApps.includes(id) ? settings.hiddenApps.filter(x => x !== id) : [...settings.hiddenApps, id]; saveSettings(); b.classList.toggle('on', !settings.hiddenApps.includes(id)); renderStartMenu(); });
    const accCustom = $('#acc-custom', body); if (accCustom) accCustom.oninput = (e) => { settings.accent = 'custom'; settings.accentCustom = e.target.value; saveSettings(); };
    const radius = $('#set-radius', body); if (radius) radius.oninput = (e) => { settings.radius = Number(e.target.value); $('#set-radiusv', body).textContent = settings.radius + 'px'; saveSettings(); };
    const iconsize = $('#set-iconsize', body); if (iconsize) iconsize.oninput = (e) => { settings.iconSize = Number(e.target.value); $('#set-iconsizev', body).textContent = settings.iconSize + 'px'; saveSettings(); renderDesktop(); };
    const wdim = $('#set-wdim', body); if (wdim) wdim.oninput = (e) => { settings.wallpaperDim = Number(e.target.value); $('#set-wdimv', body).textContent = settings.wallpaperDim + '%'; saveSettings(); };
    const note = $('#set-note', body); if (note) note.oninput = debounce(() => { settings.desktopNotes = note.value; saveSettings(false); renderWidgets(); }, 400);
    const backend = $('#set-backend', body) || $('#set-backend2', body);
    if (backend) backend.onchange = () => { settings.backend = backend.value; saveSettings(); toast('主存储后端已切换', settings.backend === 'dual' ? '桌面指向 OPFS，文件管理器显示两块磁盘。' : '桌面指向 ' + settings.backend.toUpperCase() + '。', {type:'ok'}); renderDesktop(); renderWidgets(); renderTab(); emit('fs-changed'); };
    const upload = $('#wall-upload', body); if (upload) upload.onclick = () => {
      const inp = el('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none'; document.body.appendChild(inp);
      inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { await fs.ensureDir('/System/Wallpapers'); const n = await fs.uniqueChild('/System/Wallpapers', '壁纸-' + Date.now() + '.' + (fileExt(f.name)||'png')); const p = '/System/Wallpapers/' + n; await fs.writeFile(p, new Blob([await f.arrayBuffer()], {type:f.type}), {mtime:f.lastModified||Date.now()}); settings.wallpaper = 'custom'; settings.wallpaperCustom = p; saveSettings(); renderTab(); toast('壁纸已保存并应用', p, {type:'ok'}); } catch(e) { toast('壁纸保存失败', e.message, {type:'error'}); } inp.remove(); };
      inp.click();
    };
    const remove = $('#wall-remove', body); if (remove) remove.onclick = async () => { if (settings.wallpaperCustom) { try { await fs.remove(settings.wallpaperCustom); } catch(e) {} } settings.wallpaperCustom = ''; settings.wallpaper = 'moss'; saveSettings(); renderTab(); };
    const openFolder = $('#wall-open-folder', body); if (openFolder) openFolder.onclick = () => launchApp('explorer', { path:'/System/Wallpapers' });
    const repair = $('#set-repair', body); if (repair) repair.onclick = async () => { let n = 0; const walk = async (p, d) => { if (d > 8) return; let list=[]; try { list=await fs.readdir(p); } catch(e){ return; } for (const it of list) { if (!META.get(it.path)) { META.set(it.path, it.mtime); n++; } if (it.isDir) await walk(it.path, d+1); } }; busyToast('修复账本'); await walk('/',0); if (fs.idbOK) await walk('/IDB',0); toast('账本已检查', n + ' 条时间记录已补齐', {type:'ok'}); };
    const hydrate = $('#set-hydrate', body); if (hydrate) hydrate.onclick = async () => { META.load(); await META.hydrate(); toast('元数据已恢复', Object.keys(META.data).length + ' 条记录', {type:'ok'}); };
    const reseed = $('#set-reseed', body); if (reseed) reseed.onclick = async () => { const did = await seedAll(); toast(did ? '已补写演示文件' : '演示文件完整', did ? '你的文件没有被覆盖。' : '无需操作。', {type:'ok'}); renderDesktop(); };
    const mountBtn = $('#set-mount', body); if (mountBtn) mountBtn.onclick = async () => { mountBtn.disabled = true; mountBtn.innerHTML = `<span class="spinner" style="width:12px;height:12px"></span>等待授权…`; await fs.mountLocal(); renderTab(); };
    const perm = $('#set-permissions', body); if (perm) perm.onclick = async () => { for (const m of fs.mounts) if (m.permission !== 'granted') await fs.requestMountPermission(m.path); renderTab(); };
    const showall = $('#set-showall', body); if (showall) showall.onclick = () => { settings.hiddenApps = []; saveSettings(); renderTab(); renderStartMenu(); };
    const hideunused = $('#set-hideunused', body); if (hideunused) hideunused.onclick = () => { settings.hiddenApps = ['v86','pdf','archive','manga']; saveSettings(); renderTab(); renderStartMenu(); };
    const persist = $('#set-persist', body); if (persist) persist.onclick = async () => { try { const ok = await navigator.storage.persist(); toast(ok ? '已获得持久化存储' : '持久化请求被拒绝', ok ? '浏览器不会轻易清理原存储。' : '仍可正常使用，但请定期导出重要文件。', {type:ok?'ok':'warn'}); } catch(e) { toast('无法请求', e.message, {type:'error'}); } };
    const exp = $('#set-export-settings', body); if (exp) exp.onclick = () => downloadText('kodama-settings.json', JSON.stringify(settings, null, 2), 'application/json');
    const imp = $('#set-import-settings', body); if (imp) imp.onclick = () => { const inp = el('input'); inp.type='file'; inp.accept='.json'; inp.style.display='none'; document.body.appendChild(inp); inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { const parsed = JSON.parse(await f.text()); settings = Object.assign({}, DEFAULT_SETTINGS, parsed); saveSettings(); applySettings(); renderTab(); renderDesktop(); renderWidgets(); toast('设置已导入', '外观与行为已更新', {type:'ok'}); } catch(e) { toast('导入失败', e.message, {type:'error'}); } inp.remove(); }; inp.click(); };
    const reset = $('#set-reset', body); if (reset) reset.onclick = () => confirmReset();
    if (tab === 'storage') analyzeStorage();
  }
  function busyToast(text) { return toast(text, '正在读取实际文件…', {timeout:2400}); }
  await renderTab();
  return { destroy() { destroyed = true; } };
};
</script>
<script>
'use strict';
/* =========================================================
   BOOT
   ========================================================= */
function refreshDesktop() { renderDesktop(); renderWidgets(); }
function refreshEverything() { applySettings(); renderStartMenu(); renderWidgets(); renderDesktop(); }
async function bootKodama() {
  applySettings();
  updateClockUI();
  renderStartMenu();
  renderWidgets();
  bindStartMenu();
  bindDesktop();
  try { await fs.init(); } catch(e) { console.error('fs init', e); toast('文件系统初始化受限', e.message, {type:'error', timeout:8000}); }
  try { await seedAll(); } catch(e) { console.error('seed', e); }
  await renderDesktop();
  renderStartMenu(); renderWidgets(); fillStartStorage();
  setTimeout(() => { refreshWidgetStorage(); }, 1400);
  setTimeout(() => {
    if (fs.pendingMounts && fs.pendingMounts.length) {
      toast('检测到上次的本地挂载', `${fs.pendingMounts.length} 个文件夹需要浏览器重新授权后才能在文件管理器中打开。`, { type:'warn', timeout:11000, actions:[{label:'重新授权', action: async () => { for (const m of fs.mounts) { try { await fs.requestMountPermission(m.path); } catch(e) {} } renderWidgetMounts(); renderDesktop(); }}, {label:'稍后提醒', action:() => {}}] });
    }
  }, 700);
  try { const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; if (!persisted && navigator.storage && navigator.storage.persist) { /* request only on user gesture; surfaced in settings */ } } catch(e) {}
  document.documentElement.dataset.ready = '1';
  window.__KODAMA_READY = true;
  console.info('%cKODAMA OS ready','background:#d8f26a;color:#141d07;padding:2px 7px;border-radius:3px;font-weight:700','OPFS:', fs.opfsOK, 'IDB:', fs.idbOK, 'mounts:', fs.mounts.length);
}
setInterval(updateClockUI, 1000);
window.addEventListener('keydown', (e) => {
  const typing = e.target.closest('input,textarea,select,[contenteditable="true"]');
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); launchApp('terminal'); }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); launchApp('explorer'); }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'd' && !typing) { e.preventDefault(); WINS.forEach(w => minimizeWindow(w)); }
  if (e.key === 'F11') { e.preventDefault(); toggleFullscreen(); }
}, { capture:true });
document.addEventListener('dragover', (e) => { if (!e.target.closest('.fm-scroll,#desk-area,.sm-recent')) e.preventDefault(); });
document.addEventListener('drop', (e) => { if (!e.target.closest('.fm-scroll,#desk-area,#modal-layer')) e.preventDefault(); });
window.addEventListener('unhandledrejection', (e) => { console.error('Unhandled:', e.reason); });
window.addEventListener('error', (e) => { if (e.message && /ResizeObserver/.test(e.message)) return; console.error('Runtime:', e.message, e.filename, e.lineno); });
document.addEventListener('DOMContentLoaded', bootKodama, { once:true });
if (document.readyState !== 'loading') bootKodama();
</script>
</body>
