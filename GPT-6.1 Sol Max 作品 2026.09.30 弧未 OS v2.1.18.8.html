function clockText(d=new Date()){const h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return prefs.clock24?`${String(h).padStart(2,'0')}:${m}`:`${h>=12?'下午':'上午'} ${String(h%12||12).padStart(2,'0')}:${m}`;}
function updateClock(){const now=new Date();$('.clock-date',$('#clockButton')).textContent=now.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'});$('.clock-time',$('#clockButton')).textContent=clockText(now);if(!$('#calendar').hidden){const h=$('.cal-title',$('#calendar'));if(h)h.textContent=clockText(now);}}
function renderCalendar(){const now=new Date(),year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),offset=(new Date(year,month,1).getDay()+6)%7,cal=$('#calendar');cal.innerHTML=`<div class="cal-title">${clockText(now)}</div><div class="cal-caption">${now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div><div class="cal-nav"><strong>${calendarMonth.toLocaleDateString('zh-CN',{year:'numeric',month:'long'})}</strong><button class="icon-btn" data-prev title="上个月">${icon('back')}</button><button class="icon-btn" data-next title="下个月">${icon('forward')}</button></div><div class="calendar-grid">${['一','二','三','四','五','六','日'].map(n=>'<span>'+n+'</span>').join('')}${Array.from({length:42},(_,i)=>{const date=new Date(year,month,i-offset+1),today=date.toDateString()===now.toDateString(),selected=date.toDateString()===calendarSelected.toDateString();return `<button class="${date.getMonth()!==month?'outside':''} ${today?'today':''}" style="${selected&&!today?'outline:1px solid var(--accent)':''}" data-date="${date.getTime()}" title="${date.toLocaleDateString('zh-CN')}">${date.getDate()}</button>`;}).join('')}</div><div class="flex center" style="border-top:1px solid var(--line);margin-top:16px;padding-top:13px"><span class="subtle">${calendarSelected.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}</span><span class="spacer"></span><button class="btn" data-today style="font-size:9px;padding:4px 8px">回到今天</button></div>`;$('[data-prev]',cal).onclick=()=>{calendarMonth=new Date(year,month-1,1);renderCalendar();};$('[data-next]',cal).onclick=()=>{calendarMonth=new Date(year,month+1,1);renderCalendar();};$('[data-today]',cal).onclick=()=>{calendarSelected=new Date();calendarMonth=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();};$$('[data-date]',cal).forEach(b=>b.onclick=()=>{calendarSelected=new Date(+b.dataset.date);if(calendarSelected.getMonth()!==month)calendarMonth=new Date(calendarSelected.getFullYear(),calendarSelected.getMonth(),1);renderCalendar();});}
/* 36 · Launcher and genuine cross-directory search */
const launcherApps=Object.entries(APPS).filter(([id])=>id!=='media');let launcherSearchTimer,launcherSearchToken=0;
function renderLauncher(query=''){const q=query.toLocaleLowerCase();$('#launchGrid').innerHTML=launcherApps.filter(([id,app])=>!q||app.name.toLocaleLowerCase().includes(q)||id.includes(q)).map(([id,app])=>`<button class="launch-app" data-launch="${id}">${icon(app.icon)}<span>${app.name}</span></button>`).join('');$$('[data-launch]',$('#launchGrid')).forEach(b=>b.onclick=guard(()=>launch(b.dataset.launch)));}
function toggleLauncher(force=false,search=false){const launcher=$('#launcher'),show=force||launcher.hidden;hidePopovers('launcher');launcher.hidden=!show;if(show){renderLauncher($('#launcherSearch').value);if(search)setTimeout(()=>$('#launcherSearch').focus(),20);}else $('#launcherSearch').blur();}
$('#launcherSearch').oninput=()=>{const query=$('#launcherSearch').value.trim(),seq=++launcherSearchToken;renderLauncher(query);clearTimeout(launcherSearchTimer);$('#globalResults').hidden=!query;if(!query){$('#globalResults').innerHTML='';return;}$('#globalResults').innerHTML='<div class="subtle" style="padding:10px">正在查找真实文件…</div>';launcherSearchTimer=setTimeout(guard(async()=>{await fsReady;const files=await searchFiles(query);if(seq!==launcherSearchToken)return;$('#globalResults').innerHTML=files.length?'<div class="section-eyebrow" style="margin-top:13px">文件与目录 / '+files.length+'</div>'+files.map(file=>`<button class="search-result" data-result="${escapeHTML(file.path)}">${fileIcon(file)}<div>${escapeHTML(file.name)}<small>${escapeHTML(dirname(file.path))} · ${formatSize(file.size)}</small></div></button>`).join(''):'<div class="subtle" style="padding:10px">未找到匹配文件。</div>';$$('[data-result]',$('#globalResults')).forEach(b=>b.onclick=guard(async()=>{hidePopovers();await openFile(b.dataset.result);}));}),220);};

document.addEventListener('pointerdown',e=>{if(!e.target.closest('#launcher,#brandButton,#appsButton,#globalSearchButton,[data-app="launcher"]'))$('#launcher').hidden=true;if(!e.target.closest('#calendar,#clockButton'))$('#calendar').hidden=true;if(!e.target.closest('#contextMenu'))$('#contextMenu').hidden=true;if(e.target.closest('#desktop')){WM.active=null;for(const w of WM.windows.values())w.el.classList.remove('active');$('#activeAppLabel').textContent='私域桌面';Dock.render();}},true);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,[contenteditable=true],.CodeMirror'))e.preventDefault();});
document.addEventListener('keydown',e=>{const editing=e.target.closest('input,textarea,select,[contenteditable=true],.CodeMirror'),w=WM.windows.get(WM.active);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toggleLauncher(true,true);return;}if(e.key==='Escape'){hidePopovers();const reader=[...WM.windows.values()].find(win=>win.el.classList.contains('manga-full'));if(reader&&!document.fullscreenElement){$('.manga-exit',reader.body).click();e.preventDefault();}return;}if(editing||!$('#dialogOverlay').hidden)return;const isExplorer=w?.app==='explorer',selected=isExplorer?w.selected:Desktop.selected,dir=isExplorer?w.currentPath:'/桌面';if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();if(isExplorer){w.selected=new Set(w.entries.map(i=>i.path));w.paintSelection();}else{Desktop.selected=new Set($$('.desk-item',$('#desktop')).map(i=>i.dataset.path));Desktop.paintSelection();}return;}if((e.ctrlKey||e.metaKey)&&['c','x','v'].includes(e.key.toLowerCase())){e.preventDefault();const key=e.key.toLowerCase();if(key==='v')guard(()=>pasteFiles(dir))();else if(selected?.size)setClipboard([...selected],key==='x');return;}if(e.key==='Delete'&&selected?.size){e.preventDefault();guard(()=>removePaths([...selected]))();}if(e.key==='F2'&&selected?.size===1){e.preventDefault();guard(()=>renamePath([...selected][0]))();}if(e.altKey&&isExplorer){if(e.key==='ArrowLeft')$('[data-nav=back]',w.body).click();if(e.key==='ArrowRight')$('[data-nav=forward]',w.body).click();if(e.key==='ArrowUp')$('[data-nav=up]',w.body).click();}});
window.addEventListener('resize',()=>{Desktop.applyPositions();for(const w of WM.windows.values()){if(w.maximized)WM.setRect(w,{x:0,y:0,width:$('#windowLayer').clientWidth,height:$('#windowLayer').clientHeight});w.onResize?.();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const w of WM.windows.values())w.flush?.().catch(console.warn);});window.addEventListener('beforeunload',e=>{const dirty=[...WM.windows.values()].filter(w=>w.dirty);if(dirty.length){for(const w of dirty)w.flush?.().catch(console.warn);e.preventDefault();e.returnValue='';}});
let changeTimer,changedPaths=new Set();fs.onChange(path=>{changedPaths.add(path);storageStamp=0;clearTimeout(changeTimer);const update=()=>{if($('.dragging,.touch-ghost,.selection-box')){changeTimer=setTimeout(update,180);return;}const paths=[...changedPaths];changedPaths.clear();if(paths.some(p=>p==='/桌面'||p.startsWith('/桌面/')))guard(()=>Desktop.render())();for(const w of WM.windows.values())if(w.app==='explorer'&&paths.some(p=>p===w.currentPath||p.startsWith(w.currentPath==='/'?'/':w.currentPath+'/')))guard(()=>w.refresh())();refreshStorage().catch(console.warn);};changeTimer=setTimeout(update,140);});
/* 38 · Boot into a real workspace */
const fsReady=(async()=>{
 try{await fs.init();let stored=null;try{if(await fs.exists('/.huve/preferences.json'))stored=JSON.parse(await fs.readFile('/.huve/preferences.json','utf8'));}catch{}stored??=await KV.get('preferences');if(stored)prefs={...defaults,...prefs,...stored};if(!/^#[\da-f]{6}$/i.test(prefs.accent))prefs.accent=defaults.accent;prefs.positions=prefs.positions||{};applyPreferences();await seedFileSystem();await fs.restoreMounts();await applyCustomWallpaper();$('#fsBadge').innerHTML=`<i class="status-dot" style="${fs.mode==='临时存储'?'background:var(--danger)':''}"></i><span>${fs.mode} · 私域存储</span>`;if(fs.mode!=='OPFS')toast(fs.mode==='IndexedDB'?'当前环境未提供 OPFS，已使用 IndexedDB 持久化降级。':'浏览器阻止了全部持久化能力；当前是临时空间，请立即导出重要文件。',fs.mode==='临时存储'?'error':'info',10000);Desktop.init();await Desktop.render();
 const mobile=matchMedia('(max-width:760px)').matches;if(!mobile){const W=innerWidth,x=Math.max(122,(W-1150)/2+90),availableH=$('#windowLayer').clientHeight;await openExplorer(prefs.lastPath||'/文档',{x,y:Math.max(28,(availableH-570)/2),width:Math.min(880,W-190),height:Math.min(570,availableH-56)});if(await fs.exists('/文档/今日随记.txt'))await openNotes('/文档/今日随记.txt',{intro:true,x:Math.min(W-355,x+766),y:Math.min(205,availableH-392),width:326,height:375});}await refreshStorage(true);document.documentElement.dataset.ready='true';window.huve={version:'01.0',fs,windows:WM,apps:APPS,open:openFile,launch,diagnostics:runDiagnostics};
 }catch(e){console.error('启动失败',e);toast('工作空间初始化失败：'+e.message+'。可在设置中检查存储权限。','error',0);$('#fsBadge').innerHTML=icon('info')+'<span>存储受限</span>';throw e;}
