/* 7z-wasm is loaded lazily by the archive engine. Kept version-pinned. */

<style>
:root {
  --font-ui: "Noto Sans SC", sans-serif;
  --font-display: "Instrument Serif", "Noto Serif SC", serif;
  --font-mono: "Spline Sans Mono", "SFMono-Regular", monospace;
  --void: #080b08;
  --basalt: #0d110d;
  --panel: rgba(16, 21, 16, .88);
  --panel-solid: #111610;
  --raised: #182018;
  --raised-2: #202920;
  --cream: #ece9d8;
  --mist: #b8baa7;
  --dim: #7e8475;
  --ghost: #545c50;
  --acid: #d7f36b;
  --acid-soft: rgba(215, 243, 107, .14);
  --ember: #ff6b4a;
  --ember-soft: rgba(255, 107, 74, .14);
  --teal: #76aaa0;
  --brass: #c3a76e;
  --line: rgba(236, 233, 216, .105);
  --line-strong: rgba(236, 233, 216, .22);
  --ink-on-accent: #11150c;
  --win-bg: rgba(14, 19, 14, .94);
  --win-body: #0f150f;
  --field: #0b100b;
  --selection: rgba(215, 243, 107, .18);
  --shadow: 0 24px 70px rgba(0, 0, 0, .5), 0 3px 10px rgba(0, 0, 0, .35);
  --topbar-h: 46px;
  --dock-h: 70px;
  --radius: 3px;
  --wallpaper-filter: none;
}
[data-theme="light"] {
  --void: #d8d5c7;
  --basalt: #e3e0d3;
  --panel: rgba(238, 235, 223, .9);
  --panel-solid: #f0ede2;
  --raised: #e3dfd1;
  --raised-2: #d6d1c1;
  --cream: #171c15;
  --mist: #41483d;
  --dim: #687063;
  --ghost: #8d9386;
  --acid: #49631b;
  --acid-soft: rgba(89, 119, 33, .12);
  --ember: #b94025;
  --ember-soft: rgba(185, 64, 37, .1);
  --teal: #356f65;
  --brass: #846831;
  --line: rgba(23, 28, 21, .11);
  --line-strong: rgba(23, 28, 21, .23);
  --ink-on-accent: #f4f2e7;
  --win-bg: rgba(240, 237, 226, .95);
  --win-body: #ece9dd;
  --field: #e5e1d4;
  --selection: rgba(89, 119, 33, .13);
  --shadow: 0 24px 60px rgba(30, 35, 25, .2), 0 2px 8px rgba(30, 35, 25, .1);
  --wallpaper-filter: brightness(1.3) saturate(.75);
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: var(--font-ui);
  color: var(--cream);
  background: var(--void);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 1px solid var(--acid); outline-offset: 2px;
}
::selection { background: var(--acid); color: var(--ink-on-accent); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(184, 186, 167, .22); border: 2px solid transparent; background-clip: content-box; border-radius: 9px; }
::-webkit-scrollbar-thumb:hover { background: rgba(184, 186, 167, .38); background-clip: content-box; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
.mono { font-family: var(--font-mono); letter-spacing: .01em; }
.muted { color: var(--dim); }
.acid { color: var(--acid); }
.ic { display: inline-flex; width: 18px; height: 18px; flex: 0 0 auto; align-items: center; justify-content: center; }
.ic svg { width: 100%; height: 100%; display: block; }
.ic.lg { width: 26px; height: 26px; }
.ic.xl { width: 34px; height: 34px; }

/* Wallpaper */
#wallpaper {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: #0b110c;
  transition: background .65s ease, filter .5s ease;
  filter: var(--wallpaper-filter);
}
#wallpaper::before, #wallpaper::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
body[data-wall="strata"] #wallpaper {
  background:
    radial-gradient(ellipse at 75% 110%, rgba(181, 214, 84, .27), transparent 37%),
    radial-gradient(ellipse at 100% 12%, rgba(255, 107, 74, .11), transparent 31%),
    radial-gradient(ellipse at 4% 18%, rgba(50, 109, 95, .25), transparent 39%),
    linear-gradient(116deg, #080b08 5%, #0e160f 49%, #121a10 67%, #090d08 100%);
}
body[data-wall="strata"] #wallpaper::before {
  background:
    repeating-radial-gradient(ellipse 80% 100% at 71% 108%, transparent 0 38px, rgba(215, 243, 107, .055) 39px, transparent 40px 77px),
    repeating-radial-gradient(ellipse 58% 70% at 18% 100%, transparent 0 28px, rgba(118, 170, 160, .06) 29px, transparent 30px 61px);
  transform: rotate(-4deg) scale(1.06);
}
body[data-wall="strata"] #wallpaper::after {
  background: linear-gradient(166deg, transparent 0 57%, rgba(236, 233, 216, .04) 57.1%, transparent 57.4%),
              linear-gradient(172deg, transparent 0 74%, rgba(236, 233, 216, .05) 74.1%, transparent 74.3%);
}
body[data-wall="graphite"] #wallpaper {
  background:
    radial-gradient(ellipse at 12% 2%, rgba(118, 170, 160, .3), transparent 36%),
    radial-gradient(ellipse at 84% 100%, rgba(61, 87, 93, .6), transparent 43%),
    radial-gradient(circle at 75% 28%, rgba(195, 167, 110, .11), transparent 24%),
    linear-gradient(133deg, #090d0c, #0b1515 48%, #101d1d 64%, #080c0b);
}
body[data-wall="graphite"] #wallpaper::before {
  background: repeating-linear-gradient(119deg, transparent 0 99px, rgba(236, 233, 216, .035) 100px, transparent 101px 199px);
}
body[data-wall="ember"] #wallpaper {
  background:
    radial-gradient(ellipse at 96% 93%, rgba(255, 107, 74, .28), transparent 35%),
    radial-gradient(ellipse at 8% 8%, rgba(195, 167, 110, .17), transparent 30%),
    radial-gradient(ellipse at 45% 90%, rgba(94, 52, 38, .38), transparent 47%),
    linear-gradient(120deg, #100b09, #1c0e0a 48%, #241109 69%, #0d0908);
}
body[data-wall="ember"] #wallpaper::before {
  background: repeating-radial-gradient(ellipse 96% 52% at 88% 104%, transparent 0 26px, rgba(255, 144, 111, .08) 27px, transparent 28px 58px);
}
body[data-wall="paper"] #wallpaper {
  background:
    radial-gradient(ellipse at 80% 100%, rgba(158, 139, 92, .18), transparent 40%),
    radial-gradient(ellipse at 14% 10%, rgba(224, 217, 198, .4), transparent 38%),
    linear-gradient(125deg, #d7d2c2, #e6e1d3 52%, #cbc6b4);
  filter: none;
}
body[data-wall="paper"] #wallpaper::before {
  background: repeating-linear-gradient(0deg, transparent 0 27px, rgba(40, 46, 33, .045) 28px), repeating-linear-gradient(90deg, transparent 0 27px, rgba(40, 46, 33, .03) 28px);
}
#wallpaper.custom-wall::before { background: none; }
.wall-vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  box-shadow: inset 0 0 160px rgba(0, 0, 0, .34);
}
#shell { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; }
#topbar {
  height: var(--topbar-h); flex: 0 0 var(--topbar-h); display: flex; align-items: stretch;
  padding: 0 12px; background: rgba(10, 14, 10, .52); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(22px) saturate(130%); -webkit-backdrop-filter: blur(22px) saturate(130%);
  position: relative; z-index: 60; user-select: none;
}
[data-theme="light"] #topbar { background: rgba(228, 225, 213, .63); }
.brand { display: flex; align-items: center; gap: 10px; padding-right: 17px; border-right: 1px solid var(--line); min-width: 190px; text-align: left; }
.brand-rune { width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid var(--line-strong); background: var(--acid); color: var(--ink-on-accent); position: relative; }
.brand-rune::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 7px; height: 7px; border-right: 1px solid var(--acid); border-bottom: 1px solid var(--acid); }
.brand-name { font-family: var(--font-mono); font-weight: 600; font-size: 11px; letter-spacing: .21em; line-height: 1.1; }
.brand-sub { color: var(--dim); font-size: 9px; letter-spacing: .25em; margin-top: 3px; }
.top-nav { display: flex; align-items: center; gap: 2px; padding-left: 9px; }
.top-nav button { height: 28px; padding: 0 10px; font-size: 11px; color: var(--mist); border: 1px solid transparent; transition: .16s; }
.top-nav button:hover, .top-nav button.on { color: var(--cream); background: rgba(236, 233, 216, .065); border-color: var(--line); }
.top-center { display: flex; align-items: center; justify-content: center; flex: 1; min-width: 0; gap: 9px; }
.field-mark { font-family: var(--font-mono); color: var(--ghost); font-size: 9px; letter-spacing: .15em; white-space: nowrap; }
.field-mark b { color: var(--mist); font-weight: 400; }
.top-right { display: flex; align-items: center; gap: 3px; margin-left: auto; padding-left: 12px; border-left: 1px solid var(--line); }
.top-icon { width: 32px; height: 31px; display: grid; place-items: center; color: var(--mist); border-radius: 2px; transition: .16s; }
.top-icon:hover { background: rgba(236, 233, 216, .08); color: var(--cream); }
.top-icon .ic { width: 16px; height: 16px; }
.clock-btn { text-align: right; padding: 0 9px 0 10px; height: 31px; line-height: 1.1; border-left: 1px solid var(--line); min-width: 88px; color: var(--cream); }
.clock-time { font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; }
.clock-date { font-size: 9px; color: var(--dim); margin-top: 2px; }
.storage-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--acid); display: inline-block; margin-right: 5px; box-shadow: 0 0 7px var(--acid); }

#workspace { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#desk-deco { position: absolute; top: 37px; right: 36px; width: 230px; pointer-events: none; user-select: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; opacity: .7; }
.desk-deco-line { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong)); }
.desk-deco-title { font-family: var(--font-display); font-style: italic; font-size: 52px; color: rgba(236, 233, 216, .13); line-height: .8; letter-spacing: -.01em; white-space: nowrap; }
[data-theme="light"] .desk-deco-title { color: rgba(23, 28, 21, .13); }
.desk-deco-meta { font-family: var(--font-mono); font-size: 8px; letter-spacing: .22em; color: var(--dim); border-right: 2px solid var(--acid); padding-right: 8px; }
.desk-deco-coords { font-family: var(--font-mono); font-size: 8px; color: var(--ghost); letter-spacing: .13em; }
#desk-icons { position: absolute; inset: 10px 8px calc(var(--dock-h) + 20px) 8px; z-index: 3; touch-action: pan-y; }
.desk-icon {
  position: absolute; width: 88px; min-height: 86px; padding: 8px 4px 7px; border: 1px solid transparent;
  display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--cream);
  border-radius: 3px; user-select: none; -webkit-user-select: none; text-align: center;
  transition: background .14s, border-color .14s, transform .2s;
  animation: icon-in .44s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes icon-in { from { opacity: 0; transform: translateY(7px) scale(.96); } to { opacity: 1; transform: none; } }
.desk-icon:hover { background: rgba(236, 233, 216, .075); border-color: var(--line); }
.desk-icon.selected { background: var(--selection); border-color: rgba(215, 243, 107, .5); }
[data-theme="light"] .desk-icon { color: #252b20; }
.desk-icon .icon-art { width: 48px; height: 48px; position: relative; display: grid; place-items: center; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
.desk-icon .icon-art svg { width: 45px; height: 45px; display: block; overflow: visible; }
.desk-icon.selected .icon-art { transform: scale(.96); }
.desk-label { font-size: 10.5px; line-height: 1.35; max-width: 82px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; padding: 1px 4px; border-radius: 1px; }
.desk-icon.selected .desk-label { background: var(--acid); color: var(--ink-on-accent); }
.icon-badge { position: absolute; right: -3px; bottom: -1px; width: 15px; height: 15px; border: 1px solid var(--panel-solid); background: var(--raised-2); color: var(--mist); display: grid; place-items: center; font-family: var(--font-mono); font-size: 7px; }
#windows { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#windows > * { pointer-events: auto; }
#marquee { position: absolute; z-index: 90; border: 1px solid var(--acid); background: rgba(215, 243, 107, .1); box-shadow: 0 0 0 1px rgba(215, 243, 107, .08), inset 0 0 18px rgba(215, 243, 107, .06); pointer-events: none; display: none; }

/* Dock */
#dock-wrap { position: absolute; bottom: 11px; left: 0; right: 0; z-index: 70; display: flex; justify-content: center; pointer-events: none; }
#dock {
  height: 56px; max-width: min(960px, calc(100vw - 22px)); display: flex; align-items: center; gap: 3px;
  padding: 6px; background: rgba(13, 18, 13, .86); border: 1px solid var(--line-strong);
  box-shadow: 0 16px 46px rgba(0,0,0,.32), inset 0 1px rgba(236,233,216,.05);
  backdrop-filter: blur(26px) saturate(130%); -webkit-backdrop-filter: blur(26px) saturate(130%);
  pointer-events: auto; position: relative; overflow-x: auto; overflow-y: visible; scrollbar-width: none;
}
#dock::-webkit-scrollbar { display: none; }
#dock::before { content: ""; position: absolute; left: 0; top: 0; width: 21px; height: 1px; background: var(--acid); }
[data-theme="light"] #dock { background: rgba(238,235,223,.88); }
.dock-start { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 9px; background: var(--acid); color: var(--ink-on-accent); margin-right: 5px; flex: 0 0 auto; position: relative; transition: .16s; }
.dock-start:hover { filter: brightness(1.07); }
.dock-start .rune { width: 23px; height: 23px; }
.dock-start span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; font-weight: 600; }
.dock-app { width: 42px; height: 42px; flex: 0 0 auto; display: grid; place-items: center; position: relative; border: 1px solid transparent; border-radius: 2px; transition: background .15s, border-color .15s, transform .15s; color: var(--mist); }
.dock-app:hover { background: rgba(236,233,216,.075); border-color: var(--line); transform: translateY(-2px); }
.dock-app .ic { width: 20px; height: 20px; }
.dock-app::after { content: ""; position: absolute; bottom: 2px; width: 3px; height: 3px; border-radius: 50%; background: transparent; }
.dock-app.open::after { background: var(--acid); box-shadow: 0 0 5px var(--acid); }
.dock-close { position: absolute; right: -4px; top: -4px; width: 15px; height: 15px; display: none; place-items: center; border: 1px solid var(--line-strong); background: var(--panel-solid); color: var(--mist); z-index: 4; border-radius: 50%; }
.dock-close svg { width: 8px; height: 8px; }
.dock-close:hover { background: var(--ember); color: #fff; border-color: var(--ember); }
.dock-app.open:hover .dock-close { display: grid; }
@media (hover: none) { .dock-app.open .dock-close { display: grid; } }
.dock-app:first-of-type::after { display: none; }
.dock-divider { width: 1px; height: 26px; background: var(--line); margin: 0 4px; flex: 0 0 auto; }
.dock-windows { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; }
.dock-windows::-webkit-scrollbar { display: none; }
.dock-win { min-width: 38px; max-width: 110px; height: 42px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; border: 1px solid transparent; border-radius: 2px; color: var(--mist); position: relative; }
.dock-win:hover { background: rgba(236,233,216,.07); border-color: var(--line); }
.dock-win.active { border-color: var(--line-strong); background: rgba(236,233,216,.055); color: var(--cream); }
.dock-win .ic { width: 17px; height: 17px; flex: 0 0 auto; }
.dock-win .dw-label { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }
.dock-win .dw-dot { position: absolute; bottom: 3px; width: 3px; height: 3px; border-radius: 50%; background: var(--acid); }
.dock-win.minimized .dw-dot { background: var(--ghost); }
.dock-end { margin-left: auto; display: flex; align-items: center; gap: 2px; padding-left: 4px; flex: 0 0 auto; }
.dock-end .top-icon { width: 29px; height: 37px; }
.dock-storage { height: 38px; width: 49px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; justify-content: center; padding: 0 7px; border-left: 1px solid var(--line); color: var(--dim); font-family: var(--font-mono); font-size: 7px; letter-spacing: .04em; }
.storage-bar { height: 2px; background: rgba(236,233,216,.13); overflow: hidden; }
.storage-bar i { display: block; height: 100%; width: 12%; background: var(--acid); transition: width .5s; }
[data-theme="light"] .storage-bar { background: rgba(23,28,21,.13); }

/* Window manager */
.win {
  position: absolute; display: flex; flex-direction: column; background: var(--win-bg); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow); overflow: hidden; border-radius: var(--radius); min-width: 260px; min-height: 150px;
  animation: win-in .24s cubic-bezier(.16,.84,.24,1) both; backdrop-filter: blur(28px) saturate(120%); -webkit-backdrop-filter: blur(28px) saturate(120%);
  isolation: isolate;
}
@keyframes win-in { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: none; } }
.win.closing { animation: win-out .15s ease forwards; }
@keyframes win-out { to { opacity: 0; transform: translateY(6px) scale(.988); } }
.win.minimized { display: none; }

.win-glyph .ic { width: 14px; height: 14px; }

.win-drag { flex: 1; min-width: 12px; }
.win-controls { display: flex; align-items: stretch; height: 100%; flex: 0 0 auto; }

.win-resize { position: absolute; z-index: 12; touch-action: none; }
.win-resize.n { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
.win-resize.s { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
.win-resize.e { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
.win-resize.w { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
.win-resize.ne { right: -3px; top: -3px; width: 15px; height: 15px; cursor: nesw-resize; }
.win-resize.nw { left: -3px; top: -3px; width: 15px; height: 15px; cursor: nwse-resize; }
.win-resize.se { right: -3px; bottom: -3px; width: 16px; height: 16px; cursor: nwse-resize; }
.win-resize.sw { left: -3px; bottom: -3px; width: 15px; height: 15px; cursor: nesw-resize; }
.win-resize.se::after { content: ""; position: absolute; right: 5px; bottom: 5px; width: 5px; height: 5px; border-right: 1px solid var(--dim); border-bottom: 1px solid var(--dim); }
.win.maximized .win-resize { display: none; }
.win.immersive { border-radius: 0; }
.win.immersive .win-head { display: none; }
.win:fullscreen { width: 100% !important; height: 100% !important; left: 0 !important; top: 0 !important; border-radius: 0; }
.win:fullscreen .win-head { display: none; }
.immersive-exit { position: absolute; right: 12px; top: 12px; z-index: 100; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.22); background: rgba(0,0,0,.48); color: #fff; display: none; place-items: center; backdrop-filter: blur(10px); }
.win.immersive .immersive-exit, .win:fullscreen .immersive-exit { display: grid; }
#snap-preview { position: absolute; z-index: 15; border: 1px solid var(--acid); background: rgba(215,243,107,.09); box-shadow: inset 0 0 40px rgba(215,243,107,.04); pointer-events: none; display: none; transition: all .11s ease; }
#peek { position: absolute; z-index: 140; width: 248px; padding: 7px; background: var(--panel-solid); border: 1px solid var(--line-strong); box-shadow: var(--shadow); display: none; }
.peek-preview { height: 120px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: radial-gradient(circle at 75% 25%, var(--acid-soft), transparent 55%), repeating-linear-gradient(45deg, transparent 0 12px, rgba(236,233,216,.025) 13px); color: var(--acid); overflow: hidden; }

.peek-meta .mono { margin-left: auto; color: var(--dim); font-size: 8px; }

/* Start menu */
#start-menu {
  position: fixed; z-index: 130; left: 50%; bottom: 79px; transform: translateX(-50%) translateY(6px);
  width: min(740px, calc(100vw - 24px)); max-height: min(610px, calc(100vh - 130px));
  background: var(--panel); border: 1px solid var(--line-strong); box-shadow: var(--shadow);
  backdrop-filter: blur(32px) saturate(125%); -webkit-backdrop-filter: blur(32px) saturate(125%);
  display: none; flex-direction: column; overflow: hidden; transform-origin: bottom center;
  animation: menu-in .19s cubic-bezier(.12,.8,.25,1) both;
}
#start-menu.open { display: flex; }
@keyframes menu-in { from { opacity: 0; transform: translateX(-50%) translateY(9px) scale(.99); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
.sm-top { padding: 16px 17px 13px; border-bottom: 1px solid var(--line); display: flex; gap: 15px; align-items: flex-start; }
.sm-brand { font-family: var(--font-display); font-size: 35px; line-height: .85; letter-spacing: -.02em; white-space: nowrap; }

.sm-search { margin-left: auto; width: min(280px, 44%); display: flex; align-items: center; gap: 7px; height: 31px; border: 1px solid var(--line-strong); background: rgba(0,0,0,.15); padding: 0 9px; }

.sm-content { display: flex; min-height: 0; flex: 1; }

.sm-label { font-family: var(--font-mono); color: var(--ghost); font-size: 8px; letter-spacing: .19em; margin-bottom: 7px; }

.sm-quick .ic { width: 14px; height: 14px; color: var(--acid); }
.sm-aside-foot { margin-top: auto; display: flex; flex-direction: column; gap: 3px; }
.sm-aside-foot button { display: flex; align-items: center; gap: 9px; height: 29px; text-align: left; padding: 0 7px; color: var(--dim); font-size: 10px; }
.sm-aside-foot button:hover { color: var(--cream); background: rgba(236,233,216,.06); }
.sm-aside-foot .ic { width: 13px; height: 13px; }
.sm-apps-wrap { flex: 1; min-width: 0; padding: 13px 16px 16px; overflow-y: auto; }
.sm-apps-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.sm-apps-count { color: var(--ghost); font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; }
.app-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.app-tile { min-height: 79px; padding: 9px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 1px solid transparent; transition: .15s; position: relative; }
.app-tile:hover, .app-tile:focus-visible { background: rgba(236,233,216,.06); border-color: var(--line); }
.app-tile:hover .app-icon { transform: translateY(-2px); }
.app-icon { width: 35px; height: 35px; display: grid; place-items: center; color: var(--acid); background: var(--raised); border: 1px solid var(--line); position: relative; overflow: hidden; transition: .18s; }
.app-icon::after { content: ""; position: absolute; inset: 4px; border: 1px solid currentColor; opacity: .12; }
.app-icon .ic { width: 19px; height: 19px; }
.app-tile-name { font-size: 10.5px; color: var(--cream); line-height: 1.2; }
.app-tile-meta { font-family: var(--font-mono); font-size: 7px; letter-spacing: .08em; color: var(--dim); line-height: 1.15; }
.sm-bottom { border-top: 1px solid var(--line); padding: 8px 15px; display: flex; align-items: center; gap: 12px; color: var(--ghost); font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; }

/* Menus */
#menu-layer { position: fixed; inset: 0; z-index: 500; pointer-events: none; }
.ctx-menu { position: fixed; min-width: 205px; padding: 5px; background: var(--panel-solid); border: 1px solid var(--line-strong); box-shadow: 0 14px 45px rgba(0,0,0,.4); pointer-events: auto; animation: ctx-in .12s ease both; }
@keyframes ctx-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.ctx-item { width: 100%; min-height: 29px; padding: 5px 8px; display: flex; align-items: center; gap: 9px; text-align: left; color: var(--cream); font-size: 10.5px; border: 1px solid transparent; }
.ctx-item:hover { background: var(--acid); color: var(--ink-on-accent); }
.ctx-item .ic { width: 14px; height: 14px; color: var(--dim); }
.ctx-item:hover .ic { color: var(--ink-on-accent); }
.ctx-item .shortcut { margin-left: auto; font-family: var(--font-mono); font-size: 8px; color: var(--ghost); letter-spacing: .03em; }
.ctx-item:hover .shortcut { color: var(--ink-on-accent); opacity: .7; }
.ctx-item.danger { color: var(--ember); }
.ctx-item.danger:hover { background: var(--ember); color: #fff; }
.ctx-item.danger:hover .ic { color: #fff; }
.ctx-item.disabled { opacity: .35; pointer-events: none; }
.ctx-sep { height: 1px; background: var(--line); margin: 4px 6px; }
.ctx-heading { font-family: var(--font-mono); color: var(--ghost); font-size: 7.5px; letter-spacing: .15em; padding: 6px 8px 4px; }

/* General controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 27px; padding: 4px 9px; border: 1px solid var(--line); background: rgba(236,233,216,.035); color: var(--mist); font-size: 10px; white-space: nowrap; transition: .14s; border-radius: 1px; }
.btn:hover { border-color: var(--line-strong); color: var(--cream); background: rgba(236,233,216,.075); }
.btn:active { transform: translateY(1px); }
.btn .ic { width: 13px; height: 13px; }
.btn.primary { background: var(--acid); color: var(--ink-on-accent); border-color: var(--acid); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--ember); border-color: rgba(255,107,74,.25); }
.btn.danger:hover { background: var(--ember); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { border-color: var(--line); }
.btn.small { min-height: 23px; padding: 3px 7px; font-size: 9px; }
.btn.icon-only { width: 27px; padding: 0; }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); }
.seg button { min-height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 9px; color: var(--dim); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--cream); background: rgba(236,233,216,.05); }
.seg button.active { color: var(--ink-on-accent); background: var(--acid); }
.seg .ic { width: 13px; height: 13px; }
.inp { border: 1px solid var(--line); background: rgba(0,0,0,.17); color: var(--cream); min-height: 27px; padding: 4px 8px; font-size: 11px; border-radius: 1px; outline: none; min-width: 0; }
.inp:focus { border-color: var(--acid); }
.inp::placeholder { color: var(--ghost); }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 12px) 12px, calc(100% - 8px) 12px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; padding-right: 22px; }
.toolbar { flex: 0 0 auto; min-height: 39px; display: flex; align-items: center; gap: 3px; padding: 5px 9px; border-bottom: 1px solid var(--line); background: rgba(236,233,216,.018); flex-wrap: wrap; }
.toolbar .separator { width: 1px; height: 19px; background: var(--line); margin: 0 4px; flex: 0 0 auto; }
.toolbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 18px; border: 1px solid var(--line); padding: 1px 6px; color: var(--dim); font-family: var(--font-mono); font-size: 8px; letter-spacing: .025em; }
.chip.acid { border-color: rgba(215,243,107,.26); color: var(--acid); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--acid); display: inline-block; }
.loading-line { height: 2px; background: var(--line); position: relative; overflow: hidden; }
.loading-line::after { content: ""; position: absolute; width: 32%; top: 0; bottom: 0; background: var(--acid); animation: shimmer 1.1s infinite ease-in-out; }
@keyframes shimmer { 0% { left: -32%; } 100% { left: 100%; } }
.spinner { width: 17px; height: 17px; border: 1px solid var(--line-strong); border-top-color: var(--acid); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { min-height: 160px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--dim); font-size: 11px; padding: 25px; }
.empty-state .ic { width: 34px; height: 34px; color: var(--ghost); opacity: .7; }
.empty-state strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--mist); }
.empty-state small { font-family: var(--font-mono); font-size: 8px; letter-spacing: .07em; color: var(--ghost); }
.flex { display: flex; } .col { flex-direction: column; } .grow { flex: 1; min-width: 0; min-height: 0; }
.row { flex-direction: row; } .gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap14 { gap: 14px; }

/* File manager */
.fm { display: flex; flex-direction: column; height: 100%; background: var(--win-body); }
.fm-main { display: flex; flex: 1; min-height: 0; }
.fm-sidebar { flex: 0 0 178px; display: flex; flex-direction: column; padding: 10px 7px; border-right: 1px solid var(--line); background: rgba(0,0,0,.1); overflow-y: auto; gap: 3px; }
.fm-side-label { font-family: var(--font-mono); font-size: 7.5px; letter-spacing: .16em; color: var(--ghost); padding: 7px 9px 4px; }
.fm-side-btn { display: flex; align-items: center; gap: 8px; min-height: 29px; padding: 4px 9px; color: var(--mist); text-align: left; border: 1px solid transparent; font-size: 10.5px; border-radius: 1px; }
.fm-side-btn:hover { background: rgba(236,233,216,.055); border-color: var(--line); }

.fm-side-btn .ic { width: 14px; height: 14px; color: var(--dim); }

.fm-side-divider { height: 1px; background: var(--line); margin: 7px 5px; }
.mount-row { display: flex; align-items: center; gap: 7px; padding: 3px 9px; font-size: 9px; color: var(--dim); }

.fm-content { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

.crumb-sep { color: var(--ghost); font-size: 10px; }
.fm-search { width: 136px; flex: 0 0 auto; margin-left: auto; display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); height: 24px; padding: 0 5px; }

.fm-search input { width: 100%; border: 0; background: transparent; outline: 0; font-size: 9px; }
.fm-viewbar { flex: 0 0 30px; display: flex; align-items: center; gap: 7px; padding: 2px 9px; border-bottom: 1px solid var(--line); color: var(--dim); font-family: var(--font-mono); font-size: 8px; }

.fm-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--field); overscroll-behavior: contain; }
.fm-scroll.dragover { box-shadow: inset 0 0 0 1px var(--acid); background: rgba(215,243,107,.025); }
.fm-canvas { position: relative; min-width: 100%; min-height: 100%; }
.fm-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: stretch; background: rgba(15,21,15,.97); border-bottom: 1px solid var(--line); min-height: 30px; width: max-content; min-width: 100%; backdrop-filter: blur(15px); }
[data-theme="light"] .fm-head { background: rgba(236,233,217,.97); }
.fm-th { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; height: 30px; padding: 0 7px; font-size: 9px; color: var(--dim); text-align: left; border-right: 1px solid transparent; position: relative; user-select: none; }
.fm-th:hover { color: var(--cream); background: rgba(236,233,216,.035); }
.fm-th.active { color: var(--cream); }
.fm-th .sort-ic { font-family: var(--font-mono); font-size: 9px; color: var(--acid); width: 9px; }
.fm-th .col-resizer { position: absolute; top: 0; right: -3px; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; touch-action: none; }
.fm-th .col-resizer:hover { background: rgba(215,243,107,.3); }

.fm-row { display: flex; align-items: stretch; width: max-content; min-width: 100%; height: 32px; border-bottom: 1px solid rgba(236,233,216,.035); color: var(--mist); user-select: none; position: relative; }

.fm-row:hover { background: rgba(236,233,216,.04); }

.fm-cell { flex: 0 0 auto; padding: 0 7px; display: flex; align-items: center; min-width: 0; font-size: 10px; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.fm-cell .fileBadge { display: inline-grid; place-items: center; font-family: var(--font-mono); font-size: 6px; min-width: 16px; height: 10px; border: 1px solid var(--line); color: var(--dim); padding: 0 2px; }

.fm-cell .fileIcon.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fm-cell.dim { color: var(--dim); font-family: var(--font-mono); font-size: 8.5px; }

.fm-empty-hint { color: var(--ghost); font-family: var(--font-mono); font-size: 8px; padding: 17px 13px; letter-spacing: .03em; }
.fm-icon-grid { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px; padding: 10px; }
.fm-tile { width: 106px; height: 105px; padding: 8px 5px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid transparent; color: var(--mist); text-align: center; user-select: none; position: relative; }

.fm-tile .tile-icon { width: 46px; height: 43px; display: grid; place-items: center; flex: 0 0 auto; }
.fm-tile .tile-icon svg { width: 40px; height: 40px; }
.fm-tile .tile-icon img { width: 44px; height: 42px; object-fit: cover; border: 1px solid var(--line); }
.fm-tile .tile-name { font-size: 9.5px; line-height: 1.25; width: 100%; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fm-tile .tile-meta { font-family: var(--font-mono); font-size: 7px; color: var(--ghost); }
.fm-tile.selected .tile-meta { color: var(--acid); }
.fm-columns { display: flex; height: 100%; overflow-x: auto; align-items: stretch; }
.fm-colpane { min-width: 185px; width: 215px; max-width: 260px; flex: 0 0 auto; border-right: 1px solid var(--line); overflow-y: auto; position: relative; }
.fm-colpane-title { position: sticky; top: 0; z-index: 2; font-family: var(--font-mono); font-size: 8px; color: var(--dim); padding: 7px 9px; border-bottom: 1px solid var(--line); background: var(--field); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-colitem { display: flex; align-items: center; gap: 6px; min-height: 28px; width: 100%; padding: 3px 8px; text-align: left; color: var(--mist); font-size: 10px; border: 1px solid transparent; }
.fm-colitem:hover { background: rgba(236,233,216,.05); }
.fm-colitem.selected { background: var(--selection); color: var(--cream); }
.fm-colitem .ic { width: 13px; height: 13px; }
.fm-status { flex: 0 0 24px; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--line); padding: 0 9px; font-family: var(--font-mono); font-size: 8px; color: var(--ghost); overflow: hidden; white-space: nowrap; }
.fm-status .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.fm-drop-line { position: absolute; border: 1px solid var(--acid); background: rgba(215,243,107,.1); pointer-events: none; z-index: 7; }
.fm-loading { position: absolute; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; background: rgba(8,11,8,.48); backdrop-filter: blur(2px); color: var(--mist); font-family: var(--font-mono); font-size: 9px; letter-spacing: .07em; gap: 9px; }

/* Notepad / table */
.note { height: 100%; display: flex; flex-direction: column; background: var(--field); }
.note-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: rgba(236,233,216,.018); }
.note-toolbar .spacer { flex: 1; }
.note-edit { flex: 1; width: 100%; resize: none; background: transparent; color: var(--cream); border: 0; outline: 0; padding: 17px 20px; font-family: var(--font-mono); font-size: 12px; line-height: 1.75; overflow: auto; }
.note-foot { flex: 0 0 25px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding: 0 10px; color: var(--ghost); font-family: var(--font-mono); font-size: 8px; }
.note-foot .right { margin-left: auto; }
.note-welcome { font-family: var(--font-display); font-size: 28px; color: var(--mist); }
.sheet { height: 100%; display: flex; flex-direction: column; background: var(--field); }
.sheet-toolbar { display: flex; align-items: center; gap: 5px; padding: 5px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sheet-table-wrap { flex: 1; overflow: auto; position: relative; }
.sheet-grid { border-collapse: collapse; font-family: var(--font-mono); font-size: 10px; min-width: 100%; }
.sheet-grid th, .sheet-grid td { border: 1px solid var(--line); min-width: 92px; height: 25px; padding: 3px 7px; text-align: left; white-space: pre; }
.sheet-grid th { background: var(--raised); color: var(--dim); font-weight: 400; position: sticky; top: 0; z-index: 2; }
.sheet-grid td { color: var(--mist); }
.sheet-grid td:focus { outline: 1px solid var(--acid); outline-offset: -1px; background: var(--acid-soft); }
.sheet-grid td.row-head { background: var(--raised); color: var(--ghost); min-width: 34px; text-align: right; position: sticky; left: 0; }
.sheet-text { flex: 1; width: 100%; resize: none; background: transparent; color: var(--cream); border: 0; outline: 0; font-family: var(--font-mono); font-size: 11px; line-height: 1.7; padding: 15px 17px; }
.sheet-foot { flex: 0 0 24px; padding: 0 9px; display: flex; align-items: center; border-top: 1px solid var(--line); color: var(--ghost); font-family: var(--font-mono); font-size: 8px; gap: 12px; }

/* Code editor */
.editor-app { height: 100%; display: flex; flex-direction: column; background: #0b100b; }
.editor-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; padding: 4px 7px; border-bottom: 1px solid rgba(255,255,255,.1); background: #151b15; color: #c9cbb9; flex: 0 0 auto; }
.editor-toolbar .tb-sep { height: 18px; width: 1px; background: rgba(255,255,255,.1); margin: 0 3px; }
.editor-toolbar .spacer { flex: 1; }
.editor-toolbar .btn { color: #b9bcab; background: rgba(255,255,255,.025); border-color: rgba(255,255,255,.1); }
.editor-toolbar .btn:hover { color: #f0f0e3; background: rgba(255,255,255,.075); }
.editor-toolbar .btn.primary { color: #11150c; background: #d7f36b; border-color: #d7f36b; }
.editor-toolbar .btn .ic { width: 12px; height: 12px; }
.editor-title { display: flex; align-items: center; gap: 7px; padding: 0 6px; font-family: var(--font-mono); font-size: 8px; color: #788175; }
.editor-title .dot { background: #d7f36b; }
.editor-select { background: #0e140e; border: 1px solid rgba(255,255,255,.12); color: #d6d8c7; font-family: var(--font-mono); font-size: 9px; padding: 4px 5px; outline: none; height: 25px; }
.editor-main { flex: 1; min-height: 0; display: flex; }
.editor-pane { min-width: 200px; flex: 1 1 54%; display: flex; flex-direction: column; min-height: 0; position: relative; background: #161c16; }
.editor-pane .CodeMirror { flex: 1; height: 100%; font-family: var(--font-mono); font-size: 12px; line-height: 1.58; }
.CodeMirror { height: 100%; }
.CodeMirror-gutters { background: #121812 !important; border-right: 1px solid rgba(255,255,255,.07) !important; }
.CodeMirror-linenumber { color: #576255 !important; }
.CodeMirror-activeline-background { background: rgba(215,243,107,.045) !important; }
.CodeMirror-matchingbracket { color: #d7f36b !important; border-bottom: 1px solid #d7f36b; }
.CodeMirror-matchingtag { background: rgba(215,243,107,.14); }
.cm-trailingspace { background: rgba(255,107,74,.25); border-bottom: 1px solid rgba(255,107,74,.5); }
.cm-match-highlight { background: rgba(215,243,107,.19); outline: 1px solid rgba(215,243,107,.35); }
.cm-match-current { background: rgba(255,107,74,.35); outline: 1px solid #ff6b4a; }
.editor-split { flex: 0 0 5px; background: #0b100b; border-left: 1px solid rgba(255,255,255,.08); border-right: 1px solid rgba(255,255,255,.08); cursor: col-resize; touch-action: none; position: relative; }
.editor-split:hover { background: rgba(215,243,107,.25); }
.preview-pane { flex: 1 1 46%; min-width: 120px; display: flex; flex-direction: column; background: #070b07; position: relative; }
.preview-head { flex: 0 0 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid rgba(255,255,255,.09); color: #7f897c; font-family: var(--font-mono); font-size: 8px; letter-spacing: .07em; background: #10160f; }
.preview-head .right { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.preview-head .chip { color: #8b9688; border-color: rgba(255,255,255,.1); }
.preview-frame-wrap { flex: 1; position: relative; min-height: 0; background: #080c08; }
.preview-loader { position: absolute; inset: 0; background: rgba(5,8,5,.9); z-index: 2; display: flex; align-items: center; justify-content: center; gap: 10px; color: #9fa99b; font-family: var(--font-mono); font-size: 9px; transition: opacity .25s; }
.preview-loader.hidden { display: none !important; }
.preview-frame-wrap iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
.editor-find { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 5px 7px; background: #111811; border-top: 1px solid rgba(255,255,255,.09); flex-wrap: wrap; }
.editor-find .inp { height: 24px; font-family: var(--font-mono); font-size: 9px; background: #0a0f0a; border-color: rgba(255,255,255,.12); }
.find-count { font-family: var(--font-mono); font-size: 8px; color: #8b9484; min-width: 43px; text-align: center; }
.find-toggle { min-width: 25px; height: 22px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.11); color: #969f91; font-family: var(--font-mono); font-size: 9px; }
.find-toggle.on { background: #d7f36b; color: #11150c; border-color: #d7f36b; }
.editor-status { flex: 0 0 22px; display: flex; align-items: center; gap: 13px; padding: 0 9px; border-top: 1px solid rgba(255,255,255,.1); background: #121912; color: #788374; font-family: var(--font-mono); font-size: 8px; overflow: hidden; white-space: nowrap; }
.editor-status .right { margin-left: auto; display: flex; gap: 12px; align-items: center; color: #93a08f; }
.editor-status .lang { color: #d7f36b; }
.editor-fallback { flex: 1; width: 100%; background: #101610; color: #e7e8da; border: 0; outline: none; font-family: var(--font-mono); font-size: 12px; padding: 14px; line-height: 1.6; }

/* Image / manga viewer */
.manga { height: 100%; background: #000; position: relative; display: flex; flex-direction: column; }
.manga-toolbar { flex: 0 0 33px; display: flex; align-items: center; gap: 5px; padding: 3px 8px; background: #0b0d0b; border-bottom: 1px solid rgba(255,255,255,.1); color: #b9bba9; z-index: 4; }
.manga-toolbar .title { font-family: var(--font-mono); font-size: 8px; color: #707b6c; max-width: 240px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.manga-toolbar .right { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.manga-toolbar .btn { min-height: 24px; font-size: 9px; background: #151a14; border-color: rgba(255,255,255,.11); color: #b9bba9; }
.manga-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; background: #000; overscroll-behavior-y: none; touch-action: pan-y; contain: layout style; -webkit-overflow-scrolling: touch; position: relative; }
.manga-flow { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0; }
.manga-item { position: relative; width: min(100%, 920px); min-height: 80px; flex: 0 0 auto; background: #050505; display: flex; justify-content: center; }
.manga-item img { display: block; width: 100%; height: auto; max-width: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.manga-item.skeleton { background: linear-gradient(100deg, #080808 25%, #111 37%, #080808 63%); background-size: 300% 100%; animation: skel 1.6s infinite; }
@keyframes skel { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.manga-item .manga-pg { position: absolute; right: 14px; top: 12px; background: rgba(0,0,0,.52); border: 1px solid rgba(255,255,255,.17); color: rgba(255,255,255,.68); font-family: var(--font-mono); font-size: 8px; padding: 2px 5px; z-index: 2; pointer-events: none; transition: opacity .3s; }
.manga-loadover { position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.87); color: #b8baa8; font-family: var(--font-mono); font-size: 9px; text-align: center; letter-spacing: .06em; }
.manga-loadover .mono { color: #6c7568; font-size: 8px; }
.manga-immersive .win-head { display: none; }
.manga-immersive .manga-toolbar { display: none; }
.manga-immersive .manga-scroll { height: 100%; }
.manga.immersive { position: fixed; inset: 0; z-index: 1000; }
.image-toolbar { flex: 0 0 33px; display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-bottom: 1px solid var(--line); background: rgba(236,233,216,.02); }
.image-toolbar .right { margin-left: auto; display: flex; gap: 4px; }
.image-stage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #080b08; background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px); background-size: 14px 14px; position: relative; }
.image-stage img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .15s; }

/* Browser */
.browser-app { display: flex; flex-direction: column; height: 100%; background: #0c110c; }
.browser-toolbar { display: flex; align-items: center; gap: 4px; padding: 5px 7px; border-bottom: 1px solid var(--line); background: var(--panel-solid); flex: 0 0 auto; flex-wrap: wrap; }
.browser-address { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 5px; height: 27px; background: var(--field); border: 1px solid var(--line); padding: 0 7px; }
.browser-address .ic { width: 12px; height: 12px; color: var(--accent, var(--acid)); }
.browser-address input { width: 100%; border: 0; background: transparent; outline: 0; font-family: var(--font-mono); font-size: 9px; color: var(--cream); }
.browser-view { flex: 1; position: relative; min-height: 0; background: #141a14; }
.browser-view iframe { width: 100%; height: 100%; display: block; border: 0; background: #fff; }
.browser-loader { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(7,10,7,.91); color: var(--mist); font-family: var(--font-mono); font-size: 9px; z-index: 3; transition: opacity .25s; }
.browser-loader.hidden { display: none !important; }
.browser-home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px; background: radial-gradient(circle at 50% 50%, rgba(215,243,107,.06), transparent 60%), #0c110c; text-align: center; padding: 22px; overflow: auto; }
.browser-home .wordmark { font-family: var(--font-display); font-size: 43px; line-height: .9; }
.browser-home .wordmark em { color: var(--acid); }
.browser-home p { color: var(--dim); font-size: 10px; margin: 0; }
.browser-quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 500px; }
.browser-quick button { min-height: 26px; border: 1px solid var(--line); padding: 3px 9px; color: var(--mist); font-size: 9px; background: rgba(236,233,216,.035); }
.browser-quick button:hover { border-color: var(--acid); color: var(--acid); }

/* Calculator / paint */
.calc { height: 100%; display: flex; flex-direction: column; background: var(--field); }
.calc-screen { flex: 0 0 106px; padding: 14px 15px 8px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; border-bottom: 1px solid var(--line); background: radial-gradient(ellipse at 100% 100%, var(--acid-soft), transparent 60%); position: relative; }
.calc-history { font-family: var(--font-mono); color: var(--ghost); font-size: 9px; min-height: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.calc-value { font-family: var(--font-display); font-size: 43px; line-height: 1; letter-spacing: -.01em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.calc-tag { position: absolute; left: 13px; top: 12px; font-family: var(--font-mono); font-size: 7px; color: var(--ghost); letter-spacing: .17em; }
.calc-keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 1px; background: var(--line); padding: 1px; }
.calc-key { background: var(--win-body); color: var(--cream); font-family: var(--font-mono); font-size: 14px; display: flex; align-items: center; justify-content: center; min-height: 37px; transition: .1s; border-radius: 1px; }
.calc-key:hover { background: var(--raised); }
.calc-key:active { transform: scale(.97); background: var(--acid); color: var(--ink-on-accent); }
.calc-key.op { color: var(--acid); }
.calc-key.eq { background: var(--acid); color: var(--ink-on-accent); }
.calc-key.eq:hover { filter: brightness(1.08); }
.calc-key.fn { color: var(--ember); font-size: 11px; }
.calc-foot { flex: 0 0 20px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-family: var(--font-mono); font-size: 7px; color: var(--ghost); }
.paint-app { height: 100%; display: flex; flex-direction: column; background: #0d120d; }
.paint-toolbar { display: flex; align-items: center; gap: 5px; padding: 5px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--panel-solid); }
.paint-colors { display: flex; gap: 3px; align-items: center; }
.color-swatch { width: 17px; height: 17px; border: 1px solid rgba(255,255,255,.2); }
.color-swatch.active { outline: 1px solid var(--acid); outline-offset: 1px; }
.paint-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; background: #080b08; padding: 10px; position: relative; }
.paint-stage canvas { background: #ece9d8; max-width: 100%; max-height: 100%; box-shadow: 0 5px 25px rgba(0,0,0,.3); touch-action: none; cursor: crosshair; }
.paint-status { flex: 0 0 23px; padding: 0 9px; display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 8px; color: var(--ghost); border-top: 1px solid var(--line); }

/* Terminal */
.term-app { height: 100%; display: flex; flex-direction: column; background: #080d08; font-family: var(--font-mono); }
.term-scroll { flex: 1; overflow-y: auto; padding: 13px 14px; font-size: 11px; line-height: 1.65; color: #b7baaa; }
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-line .term-prompt { color: #d7f36b; }
.term-line .term-dim { color: #626d5f; }
.term-line .term-err { color: #ff6b4a; }
.term-form { display: flex; align-items: center; gap: 7px; padding: 6px 13px 10px; border-top: 1px solid rgba(255,255,255,.08); color: #d7f36b; }
.term-form input { flex: 1; border: 0; outline: none; background: transparent; color: #e7e9d9; font-family: var(--font-mono); font-size: 11px; caret-color: #d7f36b; }

/* Media */
.media-app { height: 100%; display: flex; flex-direction: column; background: #070b07; }
.media-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: radial-gradient(ellipse at 50% 50%, rgba(118,170,160,.08), transparent 68%); }
.media-stage audio { width: min(100%, 440px); }
.media-stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.media-meta { flex: 0 0 54px; display: flex; align-items: center; gap: 11px; padding: 6px 12px; border-top: 1px solid var(--line); }
.media-meta .art { width: 34px; height: 34px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--acid); background: radial-gradient(circle at 20% 20%, var(--acid-soft), var(--raised)); }
.media-meta .name { font-size: 11px; }
.media-meta .sub { font-family: var(--font-mono); font-size: 8px; color: var(--dim); margin-top: 3px; }
.media-meta .right { margin-left: auto; display: flex; gap: 4px; }
.media-list { flex: 0 0 auto; max-height: 151px; overflow: auto; border-top: 1px solid var(--line); }
.media-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 11px; text-align: left; font-size: 10px; color: var(--mist); border-bottom: 1px solid var(--line); }
.media-item:hover, .media-item.playing { background: rgba(215,243,107,.07); color: var(--cream); }
.media-item .ic { width: 13px; height: 13px; color: var(--acid); }
.media-item small { margin-left: auto; color: var(--ghost); font-family: var(--font-mono); font-size: 8px; }

/* Settings */
.settings-app { height: 100%; display: flex; background: var(--win-body); }
.settings-nav { flex: 0 0 157px; border-right: 1px solid var(--line); padding: 12px 7px; background: rgba(0,0,0,.1); overflow-y: auto; }
.settings-title { font-family: var(--font-display); font-size: 26px; padding: 2px 9px 14px; }
.settings-nav button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 31px; padding: 4px 9px; color: var(--mist); font-size: 10.5px; text-align: left; border: 1px solid transparent; }
.settings-nav button:hover { background: rgba(236,233,216,.05); }
.settings-nav button.active { background: var(--acid-soft); color: var(--acid); border-color: rgba(215,243,107,.18); }
.settings-nav .ic { width: 14px; height: 14px; }
.settings-body { flex: 1; overflow-y: auto; padding: 19px 23px 40px; min-width: 0; }
.settings-section-title { font-family: var(--font-display); font-size: 31px; font-weight: 400; line-height: 1; margin: 0 0 5px; }
.settings-desc { color: var(--dim); font-size: 10.5px; line-height: 1.7; margin: 0 0 19px; max-width: 600px; }
.setting-group { border-top: 1px solid var(--line); padding: 14px 0 3px; margin-bottom: 13px; }
.setting-group-head { font-family: var(--font-mono); font-size: 8px; color: var(--ghost); letter-spacing: .16em; margin-bottom: 11px; }
.setting-row { display: flex; align-items: center; gap: 15px; padding: 8px 0; min-height: 39px; border-bottom: 1px dashed rgba(236,233,216,.055); }
.setting-row:last-child { border-bottom: 0; }
.setting-copy { flex: 1; min-width: 0; }
.setting-name { font-size: 10.5px; color: var(--cream); }
.setting-note { font-size: 8.5px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
.setting-row .inp, .setting-row .seg { flex: 0 0 auto; }
.toggle { width: 35px; height: 18px; flex: 0 0 auto; border: 1px solid var(--line-strong); background: rgba(0,0,0,.2); position: relative; cursor: pointer; padding: 0; border-radius: 9px; transition: .16s; }
.toggle::after { content: ""; position: absolute; width: 12px; height: 12px; left: 2px; top: 2px; border-radius: 50%; background: var(--ghost); transition: .16s; }
.toggle.on { background: var(--acid); border-color: var(--acid); }
.toggle.on::after { left: 19px; background: var(--ink-on-accent); }
.storage-viz { display: flex; gap: 18px; align-items: center; padding: 15px; border: 1px solid var(--line); background: rgba(0,0,0,.1); margin-bottom: 17px; }
.storage-ring { width: 92px; height: 92px; flex: 0 0 92px; border-radius: 50%; background: conic-gradient(var(--acid) 0 var(--used, 5%), rgba(236,233,216,.09) var(--used, 5%) 100%); display: grid; place-items: center; position: relative; }
.storage-ring::before { content: ""; width: 72px; height: 72px; border-radius: 50%; background: var(--win-body); border: 1px solid var(--line); }
.storage-ring .ring-label { position: absolute; text-align: center; font-family: var(--font-mono); font-size: 8px; color: var(--dim); line-height: 1.5; }

function tickClock() {
  const now = new Date();
  const timeEl = $('#clock-time'), dateEl = $('#clock-date');
  if (timeEl) timeEl.textContent = fmtClockTime(now, settings.seconds);
  if (dateEl) dateEl.textContent = fmtLongDate(now);

function renderCalendar(base = new Date()) {
  const cal = $('#calendar-pop');
  if (!cal) return;
  const year = base.getFullYear(), month = base.getMonth();
  cal.dataset.month = `${year}-${month}`;
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const days = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const now = new Date();
  const sel = OS.lastCalendarDate;
  const cells = [];
  for (let i = startOffset - 1; i >= 0; i--) cells.push({ day: prevDays - i, other: true, m: month - 1, y: year });
  for (let d = 1; d <= days; d++) cells.push({ day: d, other: false, m: month, y: year });
  let next = 1;
  while (cells.length % 7 !== 0 || cells.length < 42) { cells.push({ day: next++, other: true, m: month + 1, y: year }); if (cells.length >= 42) break; }
  cal.innerHTML = `<div class="calendar-head"><button class="calendar-nav" data-cal="-1" aria-label="上个月">${icon('chevronLeft')}</button><div><div class="calendar-title">${year} / ${pad2(month + 1)}</div></div><button class="calendar-nav" data-cal="1" aria-label="下个月">${icon('chevronRight')}</button></div>
    <div class="calendar-now">${fmtLongDate(now)} · ${fmtClockTime(now)}</div>
    <div class="calendar-grid">${['一','二','三','四','五','六','日'].map(d => `<div class="calendar-day-name">${d}</div>`).join('')}
    ${cells.map(c => {
      const isToday = !c.other && now.getDate() === c.day && now.getMonth() === c.m && now.getFullYear() === c.y;
      const isSel = !c.other && sel.getDate() === c.day && sel.getMonth() === c.m && sel.getFullYear() === c.y;
      return `<button class="calendar-day ${c.other ? 'other' : ''} ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" data-day="${c.day}" data-month="${c.m}" data-year="${c.y}">${c.day}</button>`;
    }).join('')}</div>
    <div class="calendar-foot"><span>${month + 1}月 · ${days} 天</span><button data-cal-today>回到今天</button></div>`;
  $$('[data-cal]', cal).forEach(b => b.addEventListener('click', () => {
    cal.dataset.follow = '0';
    renderCalendar(new Date(year, month + Number(b.dataset.cal), 1));
  }));
  $('[data-cal-today]', cal)?.addEventListener('click', () => { OS.lastCalendarDate = new Date(); cal.dataset.follow = '1'; renderCalendar(new Date()); });
  $$('[data-day]', cal).forEach(b => b.addEventListener('click', () => {
    OS.lastCalendarDate = new Date(Number(b.dataset.year), Number(b.dataset.month), Number(b.dataset.day));
    renderCalendar(new Date(Number(b.dataset.year), Number(b.dataset.month), 1));
  }));
}
function openCalendar(anchor) {
  const cal = $('#calendar-pop');

  cal.dataset.follow = '1';

/* ---------- drag and drop plumbing ---------- */
async function primeDrag(path) {
  if (!path || OS.dragCache.has(path)) return;
  try {
    const entry = await fs.stat(path);
    if (entry.kind !== 'file') return;
    const blob = await fs.readFile(path);
    const file = new File([blob], entry.name, { type: blob.type || mimeOf(entry.name), lastModified: entry.mtime || Date.now() });
    if (file.size <= 96 * 1024 * 1024) OS.dragCache.set(path, file);
  } catch {}
}
function removeCachedDrag(path) { OS.dragCache.delete(path); }
function attachFileDrag(el, getPaths) {
  el.draggable = true;
  const prefetch = () => {
    try { const paths = getPaths(); paths.slice(0, 8).forEach(primeDrag); } catch {}
  };
  el.addEventListener('mouseenter', prefetch);
  el.addEventListener('mousedown', prefetch);
  el.addEventListener('pointerdown', prefetch);
  el.addEventListener('dragstart', e => {
    const paths = (getPaths() || []).filter(Boolean);
    if (!paths.length) return;
    const file = OS.dragCache.get(paths[0]);
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData('application/x-lacuna-paths', JSON.stringify(paths));
    e.dataTransfer.setData('text/plain', paths.join('\n'));
    if (file) {
      try { e.dataTransfer.items.add(file); } catch {}
      try {
        const downloadUrl = URL.createObjectURL(file);
        OS.dragUrls.push(downloadUrl);
        e.dataTransfer.setData('DownloadURL', `${file.type || mimeOf(file.name)}:${file.name}:${downloadUrl}`);
        setTimeout(() => { try { URL.revokeObjectURL(downloadUrl); } catch {} }, 12000);
      } catch {}
    }
    document.body.dataset.dragging = '1';
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = paths.length > 1 ? `${paths.length} 个对象` : baseName(paths[0]);
    ghost.style.cssText = 'position:fixed;top:-100px;left:-100px;padding:5px 9px;background:var(--acid);color:var(--ink-on-accent);font:9px var(--font-mono);z-index:9999;pointer-events:none;';
    document.body.append(ghost);
    try { e.dataTransfer.setDragImage(ghost, 10, 10); } catch {}
    setTimeout(() => ghost.remove(), 50);
  });
  el.addEventListener('dragend', () => {
    OS.dragQueue = [];
    if (document.body.dataset.dragging) delete document.body.dataset.dragging;
  });
}
function fileFromEntry(entry) {
  return new Promise((resolve, reject) => entry.file(resolve, reject));
}
function readerEntries(reader) {
  return new Promise((resolve, reject) => reader.readEntries(resolve, reject));
}
async function walkEntry(entry, prefix = '', out = []) {
  if (!entry) return out;
  if (entry.isFile) {
    try {
      const file = await fileFromEntry(entry);
      out.push({ file, relPath: pathJoin(prefix, file.name) });
    } catch {}
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do { batch = await readerEntries(reader); for (const child of batch) await walkEntry(child, pathJoin(prefix, entry.name), out); } while (batch.length > 0);
  }
  return out;
}
async function collectDroppedItems(dataTransfer) {
  const items = [];
  const entries = [];
  if (dataTransfer.items && dataTransfer.items.length) {
    for (const item of Array.from(dataTransfer.items)) {
      if (item.kind !== 'file') continue;
      const entry = item.webkitGetAsEntry?.();
      if (entry) entries.push(entry);
      else { const f = item.getAsFile?.(); if (f) items.push({ file: f, relPath: f.name }); }
    }
  }
  if (!entries.length && !items.length && dataTransfer.files?.length) {
    for (const f of Array.from(dataTransfer.files)) items.push({ file: f, relPath: f.name });
  }
  const walked = [];
  for (const entry of entries) await walkEntry(entry, '', walked);
  return items.concat(walked);
}
async function uniqueVfsPath(path) {
  if (!(await fs.exists(path))) return path;
  const dir = dirName(path), base = baseName(path), ext = extOf(base);
  const stem = ext ? base.slice(0, -(ext.length + 1)) : base;
  for (let i = 2; i < 2000; i++) {
    const p = pathJoin(dir, `${stem} (${i})${ext ? '.' + ext : ''}`);
    if (!(await fs.exists(p))) return p;
  }
  return pathJoin(dir, `${stem}-${Date.now()}${ext ? '.' + ext : ''}`);
}
async function importDroppedItems(items, dest, opts = {}) {
  if (!items.length) return [];
  toast(`正在导入 ${items.length} 个文件…`);
  const imported = [];
  for (const item of items) {
    try {
      let target = pathJoin(dest, item.relPath || item.file.name);
      if (opts.keepStructure === false) target = pathJoin(dest, item.file.name);
      target = await uniqueVfsPath(target);
      const parent = dirName(target);
      await fs.mkdir(parent, { recursive: true });
      await fs.writeFile(target, item.file, item.file.type || mimeOf(item.file.name), { mtime: item.file.lastModified });
      imported.push(target);
    } catch (err) { console.error(err); }
  }
  dispatchEvent(new CustomEvent('lacuna:fs-changed', { detail: { paths: imported } }));
  toast(imported.length ? `已导入 ${imported.length} 个文件到 ${dest}` : '导入失败', imported.length ? 'success' : 'error');
  return imported;
}
async function handleDropInto(e, dest) {
  e.preventDefault(); e.stopPropagation();
  const internal = e.dataTransfer?.getData('application/x-lacuna-paths');
  if (internal) {
    try {
      const paths = JSON.parse(internal);
      for (const p of paths) {
        if (p === dest || dest.startsWith(p + '/')) continue;
        await fs.move(p, pathJoin(dest, baseName(p)));
      }
      dispatchEvent(new CustomEvent('lacuna:fs-changed', { detail: { paths: paths.map(p => pathJoin(dest, baseName(p))) } }));
      toast(`已移动 ${paths.length} 个项目`, 'success');
    } catch (err) { toast(err.message || '移动失败', 'error'); }
    return;
  }
  try {
    const items = await collectDroppedItems(e.dataTransfer);
    if (items.length) await importDroppedItems(items, dest);
    else toast('没有可导入的文件', 'error');
  } catch (err) { toast('无法读取拖入内容：' + (err.message || err), 'error'); }
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name || 'download';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}
async function downloadVfsPath(path) {
  try {
    const blob = await fs.readFile(path);
    downloadBlob(blob, baseName(path));
    toast(`正在导出 ${baseName(path)}`, 'success');
  } catch (err) { toast('导出失败：' + (err.message || err), 'error'); }
}
function pickFiles({ multiple = true, directory = false } = {}) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.multiple = multiple; input.style.display = 'none';
    if (directory) input.webkitdirectory = true;
    document.body.append(input);
    input.addEventListener('change', () => { resolve(Array.from(input.files || [])); input.remove(); });
    input.addEventListener('cancel', () => { resolve([]); input.remove(); });
    input.click();
  });
}
function pickFile({ accept = '', multiple = false } = {}) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.multiple = multiple; input.accept = accept; input.style.display = 'none';
    document.body.append(input);
    input.addEventListener('change', () => { resolve(multiple ? Array.from(input.files || []) : (input.files?.[0] || null)); input.remove(); });
    input.addEventListener('cancel', () => { resolve(null); input.remove(); });
    input.click();
  });
}

/* ==========================================================================
   Unified virtual file system
   OPFS (primary)  +  IndexedDB (mirror / fallback)  +  File System Access mounts
   Every app goes through this object. No UI-level storage branching.
   ========================================================================== */
let vaultDBPromise = null;
function vaultDB() {
  if (!vaultDBPromise) {
    vaultDBPromise = new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB 不可用'));
      const req = indexedDB.open('lacuna-vault', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('backups')) db.createObjectStore('backups', { keyPath: 'path' });
        if (!db.objectStoreNames.contains('mounts')) db.createObjectStore('mounts', { keyPath: 'path' });
        if (!db.objectStoreNames.contains('prefs')) db.createObjectStore('prefs', { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
    });
  }
  return vaultDBPromise;
}
async function idbTx(store, mode, run) {
  const db = await vaultDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const os = tx.objectStore(store);
    let request;
    try { request = run(os); } catch (err) { reject(err); return; }
    tx.oncomplete = () => resolve(request ? request.result : null);
    tx.onerror = () => reject(tx.error || new Error('IndexedDB 事务失败'));
    tx.onabort = () => reject(tx.error || new Error('IndexedDB 事务中止'));
  });
}
const idbPut = (store, value) => idbTx(store, 'readwrite', os => os.put(value));
const idbDelete = (store, key) => idbTx(store, 'readwrite', os => os.delete(key));
const idbGet = (store, key) => idbTx(store, 'readonly', os => os.get(key));
const idbGetAll = (store) => idbTx(store, 'readonly', os => os.getAll());
const idbClear = (store) => idbTx(store, 'readwrite', os => os.clear());

function makeToneWav() {
  const sampleRate = 22050, seconds = 4.8, frames = Math.floor(sampleRate * seconds);
  const buffer = new ArrayBuffer(44 + frames * 2), view = new DataView(buffer);
  const str = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };
  str(0, 'RIFF'); view.setUint32(4, 36 + frames * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true); str(36, 'data'); view.setUint32(40, frames * 2, true);
  for (let i = 0; i < frames; i++) {
    const t = i / sampleRate;
    const envelope = Math.min(1, t / .18) * Math.max(0, 1 - (t - 3.9) / .9);
    const tone = Math.sin(2 * Math.PI * 146.83 * t) * .2 + Math.sin(2 * Math.PI * 220 * t) * .11 + Math.sin(2 * Math.PI * 293.66 * t) * .045;
    view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, tone * envelope)) * 32767, true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

class LacunaFS {
  constructor() {

    this.pref = settings.storageBackend || 'opfs';
    this.nodes.set('/', { path: '/', name: '/', kind: 'directory', size: 0, mtime: Date.now(), type: 'inode/directory' });

async function chooseVfsFile({ title = '选择文件', start = '/', extensions = null, allowAll = false } = {}) {
  let files = [];
  try {
    files = Array.from(fs.nodes.values()).filter(e => e.kind === 'file' && !e.path.startsWith('/mnt/local/'));
    const prefix = normPath(start);
    if (prefix !== '/') files = files.filter(e => e.path === prefix || e.path.startsWith(prefix + '/'));
  }
  catch (err) { toast('读取文件索引失败', 'error'); }
  if (extensions?.length) files = files.filter(f => extensions.includes(extOf(f.name)));
  if (!allowAll && extensions?.length && !files.length) { toast('当前目录中没有可用文件', 'error'); return null; }
  files.sort((a, b) => naturalCompare(a.path, b.path));
  const box = document.createElement('div');
  box.innerHTML = `<label class="modal-label">从虚拟文件系统选择</label><div style="max-height:310px;overflow:auto;border:1px solid var(--line);background:rgba(0,0,0,.12)">${files.map(f => `<button class="search-result" data-pick-path="${esc(f.path)}" style="width:100%;min-height:31px"><span class="ic">${icon(kindOfFile(f) === 'image' ? 'image' : kindOfFile(f) === 'sheet' ? 'table' : 'file')}</span><span style="flex:1;text-align:left">${esc(f.name)}</span><span class="sr-path">${esc(dirName(f.path))}</span></button>`).join('') || '<div class="empty-state" style="min-height:120px">没有文件</div>'}</div><p class="dialog-note">也可以直接在文件管理器中右键，用指定应用打开。</p>`;
  return new Promise(resolve => {
    showModal({ title, iconName: 'folder-open', body: box, actions: [{ label: '取消', value: null }], onMount: modal => {
      $$('[data-pick-path]', box).forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.pickPath)));
      setTimeout(() => $('[data-pick-path]', box)?.focus(), 50);
    } }).then(resolve).catch(() => resolve(null));
  });
}

    if (act === 'enlarge') { win.toggleMaximize(); setTimeout(() => { try { emulator?.screen_set_scale?.(1); } catch {} }, 250); }
  }));
  screen.addEventListener('click', () => { if (started && !document.pointerLockElement) lockMouse(true); });
  screen.addEventListener('contextmenu', e => e.preventDefault());
  const pointerChange = () => { if (!document.pointerLockElement) { try { emulator?.mouse_set_status?.(false); } catch {} } };
  document.addEventListener('pointerlockchange', pointerChange);
  win.meta.onClose = () => { destroyEmulator(); document.removeEventListener('pointerlockchange', pointerChange); };
  if (arg?.path) {
    const p = arg.path, ext = extOf(p);
    disk = { path: p, name: baseName(p), ext, mountType: ext === 'iso' ? 'cdrom' : ['img', 'fda', 'bin'].includes(ext) ? 'fda' : 'hda' };
    setState(`${disk.name} · ${disk.mountType.toUpperCase()} · 本地`);
  }
  return win;
}
registerApp({ id: 'vm', name: '虚拟机', latin: 'STRATUM / V86', icon: 'vm', accent: '#76aaa0', keywords: '虚拟机 v86 iso img 系统 vm', available: true });
AppLaunchers.vm = arg => openVirtualMachine(arg);

async function bootLacuna() {
  wireCoreUI();
  hydrateIcons();
  renderDock();
  applySettings();
  tickClock();
  const badge = $('#vfs-badge');
  if (badge) badge.textContent = 'VFS 连接中';
  try {
    await fs.init();
    hydrateIcons();
    if (badge) { badge.textContent = fs.root ? 'OPFS 已连接' : 'IDB 降级存储'; badge.style.color = fs.root ? 'var(--acid)' : 'var(--brass)'; }
    await wireDesktop();
    renderDock();
    applySettings();
    tickClock();
    document.body.dataset.ready = 'true';
    window.lacunaOS = { OS, fs, WM, settings, launchApp, openVfsEntry, apps: APP_REGISTRY };
    dispatchEvent(new CustomEvent('lacuna:ready', { detail: { backend: fs.backend } }));
    const usage = await fs.storageUsage();
    toast(fs.root ? `隙间已连接 · 私域卷 ${fmtBytes(usage.virtualBytes)}` : `OPFS 不可用，已切换 IndexedDB · ${fmtBytes(usage.virtualBytes)}`, 'info', 3800);
    if (fs.pendingMounts.length && settings.openLocalReminder) {
      setTimeout(() => {
        showModal({
          title: '恢复本地文件夹', iconName: 'mount',
          body: `<p style="margin:0 0 8px">上次会话留下了 <b style="color:var(--cream)">${fs.pendingMounts.length}</b> 个真实文件夹挂载记录：</p><div style="display:flex;flex-direction:column;gap:4px">${fs.pendingMounts.map(m => `<div class="about-line"><span>${esc(m.name)}</span><b>需要重新授权</b></div>`).join('')}</div><p class="dialog-note">浏览器刷新后不会自动授予本地目录权限。点“重新连接”以触发系统目录授权。</p>`,
          actions: [{ label: '稍后处理', value: false }, { label: '重新连接', value: true, variant: 'primary' }]
        }).then(async yes => {
          if (!yes) return;
          const count = await fs.reconnectPendingMounts();
          toast(count ? `已恢复 ${count} 个挂载` : '未获得目录权限', count ? 'success' : 'error');
          refreshDesktop(); renderDock();
        });
      }, 700);
    }
    setInterval(() => { if (fs.ready) updateDockStorage(); }, 45000);
  } catch (err) {
    console.error('Lacuna boot failure', err);
    if (badge) { badge.textContent = '存储受限'; badge.style.color = 'var(--ember)'; }
    toast('存储初始化失败：' + (err.message || err), 'error', 6000);
    if (!fs.ready) {
      fs.ready = true;
      fs.nodes.set('/', { path: '/', name: '/', kind: 'directory', size: 0, mtime: Date.now(), type: 'inode/directory' });
      try { await fs.ensureSystemDirs(); } catch {}
    }
    await wireDesktop();
    renderDock();
    renderStartMenuContent();
  }
}
bootLacuna();
