      </div>
      <textarea class="monoarea" spellcheck="false"></textarea>
      <div class="stat"><span data-a="st"></span><span data-a="m"></span></div>`;
      const ta=$('textarea',w.body), st=$('[data-a=st]',w.body), mp=$('[data-a=m]',w.body);
      ta.style.fontSize=(cfg.notepadFont||13)+'px';
      ta.style.whiteSpace=cfg.notepadWrap?'pre-wrap':'pre';
      let dirty=false, undo=[], redo=[], last='';
      function push(){ if(ta.value===last)return; undo.push(last); if(undo.length>150)undo.shift(); redo=[]; last=ta.value }
      const upd=()=>{ const l=ta.value.split('\n'); st.textContent=l.length+' 行 · '+ta.value.length+' 字符 · '+(dirty?'未保存修改':'已保存'); };
      function load2(t){ ta.value=t||''; last=ta.value; undo=[last]; dirty=false; upd() }
      if(path)fs.readText(path).then(load2).catch(e=>{ toast('读取失败: '+e.message,'err') }); else load2('');
      async function save(){
        let p=path||await fs.uniquePath('/Desktop','未命名.txt');
        if(!path){ const v=await askText('保存到桌面，文件名：','未命名.txt'); if(!v)return; p=await fs.uniquePath('/Desktop',v) }
        try{ await fs.writeText(p,ta.value); dirty=false; upd(); toast('已保存 '+p,'ok');
          if(!path)openApp('notepad',{path:p}), w.close();
          await refreshDesktop(); refreshExplorers(PATH.dir(p)); }catch(e){ toast('保存失败: '+e.message,'err') }
      }
      ta.addEventListener('input',()=>{ dirty=true; clearTimeout(ta._t); ta._t=setTimeout(push,500); upd(); if(cfg.autosave){ clearTimeout(ta._s); ta._s=setTimeout(()=>{ if(path&&dirty)save() },2500) } });
      ta.addEventListener('keyup',upd); ta.addEventListener('click',upd);
      ta.addEventListener('keydown',e=>{
        if(e.ctrlKey&&e.key.toLowerCase()==='s'){ e.preventDefault(); save() }
        if(e.ctrlKey&&e.key.toLowerCase()==='z'){ e.preventDefault(); push(); if(undo.length>1){ const cur=undo.pop(); redo.push(cur); ta.value=undo[undo.length-1]; last=ta.value; dirty=true; upd() } }
        if(e.ctrlKey&&(e.key.toLowerCase()==='y')){ e.preventDefault(); if(redo.length){ ta.value=redo.pop(); undo.push(ta.value); last=ta.value; dirty=true; upd() } }
        if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s+2 }
      });
      mp.textContent='UTF-8 · 自动保存 '+(cfg.autosave?'开':'关');
      w.body.addEventListener('click',async e=>{
        const b=e.target.closest('[data-a]'); if(!b)return;
        if(b.dataset.a==='save')save();
        if(b.dataset.a==='saveas'){ const v=await askText('另存为（完整路径）',path||'/Desktop/未命名.txt'); if(v){ await fs.writeText(v,ta.value); toast('已写入 '+v,'ok'); refreshDesktop() } }
        if(b.dataset.a==='undo')ta.dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true}));
        if(b.dataset.a==='redo')ta.dispatchEvent(new KeyboardEvent('keydown',{key:'y',ctrlKey:true}));
        if(b.dataset.a==='open')openApp('files',{path:PATH.dir(path||'/Desktop')});
        if(b.dataset.a==='f-'){ cfg.notepadFont=clamp((cfg.notepadFont||13)-1,9,26); ta.style.fontSize=cfg.notepadFont+'px'; saveConfig() }
        if(b.dataset.a==='f+'){ cfg.notepadFont=clamp((cfg.notepadFont||13)+1,9,26); ta.style.fontSize=cfg.notepadFont+'px'; saveConfig() }
        if(b.dataset.a==='wrap'){ cfg.notepadWrap=!cfg.notepadWrap; ta.style.whiteSpace=cfg.notepadWrap?'pre-wrap':'pre'; b.classList.toggle('on',cfg.notepadWrap); saveConfig() }
      });
      win.onClose=()=>{ if(dirty&&path)return fs.writeText(path,ta.value).then(()=>{ toast('已自动保存 '+PATH.base(path),'ok'); refreshDesktop() }) };
      // 拖出
      const node=ta; node.addEventListener('mouseenter',()=>{});
      setTimeout(()=>ta.focus(),80);
    }});
  return win;
}

function parseDSV(text,delim){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++ } else q=false } else cur+=c }
    else if(c==='"')q=true;
    else if(c===delim){ row.push(cur); cur='' }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur='' }
    else if(c==='\r'){}
    else cur+=c; }
  row.push(cur); if(row.length>1||row[0]!=='')rows.push(row);
  return rows;
}

  return (s.includes(delim)||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s }).join(delim)).join('\n') }

function termApp(a={}){
  const win=openWindow({app:'terminal',reuse:false,title:'终端 — 内核 shell',icon:ICON.term,w:720,h:460,
    render:w=>{
      let cwd=PATH.norm(a.cwd||'/');
      w.body.innerHTML=`<div style="flex:1;min-height:0;overflow-y:auto;padding:12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6" data-a="out"></div>
        <div style="display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)">
          <span style="color:var(--acc);font-family:var(--f-mono);font-size:12.5px" data-a="ps"></span>
          <input class="f" style="flex:1;background:none;border:0" spellcheck="false" autocomplete="off"></div>`;
      const out=$('[data-a=out]',w.body), inp=$('input',w.body), ps=$('[data-a=ps]',w.body);
      const hist=[]; let hi=0;
      const P=()=>{ ps.textContent=cwd+' ›' };
      const line=(t,cls)=>{ const d=el('div',cls||''); d.style.whiteSpace='pre-wrap'; d.innerHTML=t; out.appendChild(d); out.scrollTop=out.scrollHeight; return d };
      line('<b style="color:var(--acc)">CUPRUM shell</b> — 输入 <i>help</i> 查看命令。后端: '+fs.backendName);
      P();
      const cmds={
        help:()=>line('ls · cd · pwd · cat · write · mkdir · touch · rm · mv · cp · echo · tree · df · mount · open · clear'),
        async pwd(){ line(cwd) },
        async ls(p){ const items=await fs.readdir(p[0]?PATH.join(cwd,p[0]):cwd,{withMeta:!!p[1]});
          items.forEach(i=>line((i.isDir?'<span style="color:var(--acc)">'+esc(i.name)+'/</span>':esc(i.name))+(p[1]?'  '+fmtSize(i.size)+'  '+fmtDate(i.mtime):''))) },
        async cd(p){ const t=p[0]?PATH.join(cwd,p[0]):'/'; const st=await fs.stat(t); if(!st.isDir)throw new Error('不是目录'); cwd=t; P() },
        async cat(p){ if(!p[0])throw new Error('用法: cat <文件>'); line(esc((await fs.readText(PATH.join(cwd,p[0]))).slice(0,20000))) },
        async write(p){ const s=p.join(' '); const i=s.indexOf(' '); const fname=i<0?s:s.slice(0,i); const txt='';
          const v=await askText('输入内容（写入 '+fname+'）',''); await fs.writeText(PATH.join(cwd,fname),v||''); line('已写入 '+fname) },
        async mkdir(p){ await fs.mkdir(PATH.join(cwd,p[0]),{}); line('已创建 '+p[0]) },
        async touch(p){ await fs.writeText(PATH.join(cwd,p[0]),''); line('已新建 '+p[0]) },
        async rm(p){ const r=p[0]==='-r'; const t=PATH.join(cwd,p[r?1:0]); await fs.remove(t); line('已删除 '+t) },
        async mv(p){ await fs.rename(PATH.join(cwd,p[0]),PATH.join(cwd,p[1])); line('已移动') },
        async cp(p){ await fs.copy(PATH.join(cwd,p[0]),PATH.join(cwd,p[1])); line('已复制') },
        async tree(p){ const walk=async(d,pre)=>{ const items=await fs.readdir(d);
            for(const i of items){ line(pre+(i.isDir?'├─ '+esc(i.name)+'/':'│  '+esc(i.name))); if(i.isDir)await walk(i.path,pre+'│  ') } };
          await walk(p[0]?PATH.join(cwd,p[0]):cwd,'') },
        async df(){ const e=await (navigator.storage?.estimate?.()||Promise.resolve({}));
          line('后端: '+fs.backendName+'\n已用: '+fmtSize(e.usage||0)+'\n配额: '+fmtSize(e.quota||0));
          const du=await fs.du('/'); line('文件数: '+du.count+' · 数据合计: '+fmtSize(du.total)) },
        async mount(p){ if(!p.length){ fs.mountPoints().forEach(m=>line(m.point+'  ⇢  '+m.label+' ('+m.kind+')')); return }
          if(p[0]==='local'){ const pt=await mountLocalFolder(); if(pt)line('已挂载到 '+pt) } },
        async open(p){ await openPath(PATH.join(cwd,p[0])) },
        clear:()=>{ out.innerHTML='' },
        async echo(p){ line(esc(p.join(' ').replace(/"/g,''))) }
      };
      inp.addEventListener('keydown',async e=>{
        if(e.key==='ArrowUp'){ if(hist.length){ hi=Math.max(0,hi-1); inp.value=hist[hi] } }
        if(e.key==='ArrowDown'){ if(hist.length){ hi=Math.min(hist.length,inp.value?hi+1:hi+1); inp.value=hist[hi]||'' } }
        if(e.key!=='Enter')return;
        const raw=inp.value.trim(); inp.value=''; if(!raw)return; hist.push(raw); hi=hist.length;
        line('<span style="color:var(--acc)">'+esc(cwd)+' ›</span> '+esc(raw));
        if(/^echo\s+.+>\s*\S+/.test(raw)){ const m=raw.match(/^echo\s+(.*?)>\s*(\S+)$/); await fs.writeText(PATH.join(cwd,m[2]),m[1].replace(/^["']|["']$/g,'')); line('已写入 '+m[2]); return }
        const [c,...args]=raw.split(/\s+/); const fn=cmds[c];
        if(!fn){ line('<span style="color:var(--danger)">未知命令: '+esc(c)+'</span>'); return }
        try{ await fn(args) }catch(err){ line('<span style="color:var(--danger)">'+esc(err.message)+'</span>') }
      });
      setTimeout(()=>inp.focus(),100);
    }});
  return win;
}

function calcApp(){
  return openWindow({app:'calc',reuse:true,title:'计算器',icon:ICON.calc,w:320,h:440,render:w=>{
    w.body.innerHTML=`<div class="calc"><div class="out"><div class="e" data-a="e">就绪</div><div class="r" data-a="r">0</div></div><div class="keys" data-a="k"></div></div>`;
    const keys=['C','( )','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
    const k=$('[data-a=k]',w.body), R=$('[data-a=r]',w.body), E=$('[data-a=e]',w.body); let expr='';
    keys.forEach(x=>{ const b=el('button',x==='='?'eq':(/[+\-−×÷%()]|C|⌫/.test(x)?'o':''),x); b.dataset.k=x; k.appendChild(b) });
    const upd=()=>{ R.textContent=expr||'0' };
    const calc=()=>{ const s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
      if(!/^[0-9+\-*/().\s]*$/.test(s))throw new Error('非法表达式');
      const v=Function('"use strict";return ('+s+')')(); if(typeof v!=='number'||!isFinite(v))throw new Error('结果无效'); return v };
    const press=x=>{
      if(x==='C'){ expr=''; E.textContent='已清空'; upd(); return }
      if(x==='⌫'){ expr=expr.slice(0,-1); upd(); return }
      if(x==='( )'){ const o=(expr.match(/\(/g)||[]).length, c=(expr.match(/\)/g)||[]).length; expr+=(o>c&&/[0-9)]$/.test(expr))?')':'('; upd(); return }
      if(x==='='){ try{ const v=calc(); E.textContent=expr+' ='; expr=String(Math.round(v*1e10)/1e10); R.textContent=expr }catch(e){ E.textContent=e.message } return }
      expr+=x; upd();
      try{ E.textContent=expr+' = '+calc() }catch(e){ E.textContent=expr }
    };
    k.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b)press(b.dataset.k) });
    const kh=e=>{ const m={'/':'÷','*':'×','-':'−','Enter':'=','Backspace':'⌫','Escape':'C'}; const key=e.key;
      if(/^[0-9.+()%]$/.test(key)||m[key]){ if(e.target.tagName==='INPUT')return; e.preventDefault(); press(m[key]||key) } };
    document.addEventListener('keydown',kh); w.onClose=()=>document.removeEventListener('keydown',kh);
  }});
}

  const sel=[...DESK.sel];
  if(e.key==='Delete'){ const ok=await modal({title:'删除确认',desc:'删除 '+sel.length+' 个桌面项目？',ok:'删除',danger:true});
    if(ok){ for(const p of sel){ try{ await fs.remove(p) }catch(err){} } DESK.sel.clear(); refreshDesktop() } }
  if(e.key==='F2'&&sel.length===1){ const v=await askText('重命名',PATH.base(sel[0])); if(v){ await fs.rename(sel[0],await fs.uniquePath('/Desktop',v)); refreshDesktop() } }
  if(e.ctrlKey&&e.key==='c'){ CLIP.paths=sel; CLIP.mode='copy'; CLIP.dir='/Desktop'; toast('已复制') }
  if(e.ctrlKey&&e.key==='x'){ CLIP.paths=sel; CLIP.mode='cut'; CLIP.dir='/Desktop'; toast('已剪切') }
  if(e.ctrlKey&&e.key==='v'){ await doPaste('/Desktop'); refreshDesktop() }
  if(e.ctrlKey&&e.key==='a'){ e.preventDefault(); DESK.items.forEach(i=>DESK.sel.add(i.path)); paintSel() }
});
/* 视图尺寸变化：重新约束窗口、重排图标 */
let rsT=null;
window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{
  const d=deskSize();
  WM.wins.forEach(w=>{ if(w.maximized){ w.node.style.width=d.w+'px'; w.node.style.height=d.h+'px' }
    else { const l=parseFloat(w.node.style.left),t=parseFloat(w.node.style.top);
      w.node.style.left=clamp(l,0,Math.max(0,d.w-90))+'px'; w.node.style.top=clamp(t,0,Math.max(0,d.h-60))+'px' }
    if(w.onResize)try{w.onResize(w)}catch(e){} });
  if(DESK.items.length)refreshDesktop();
  refreshStore();
},220) });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ refreshStore(); Object.values(dragCache).forEach(v=>laterRevoke(v.url,10)) } });
setInterval(clockTick,15000); clockTick();
setInterval(refreshStore,60000);
/* 任务栏拖拽导入（把文件掉到任务栏 → 导入下载目录） */
$('#taskbar').addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy' });
$('#taskbar').addEventListener('drop',async e=>{ e.preventDefault(); if(dtPaths(e.dataTransfer))return;
  await handleDrop(e.dataTransfer,'/Downloads',null,null,false) });
/* -------------------------------- 启动 --------------------------------- */
(async function boot(){
  applyTheme();
  try{
    await fs.init();
  }catch(e){
    console.error(e); document.body.innerHTML='<div style="padding:40px;font-family:monospace;color:#e2a03f">存储初始化失败：'+esc(e.message)+'</div>'; return;
  }
  await loadLayout();
  await loadCustomWallpaper();
  applyWallpaper();
  refreshStore();
  document.title='CUPRUM · 铜构 OS — '+fs.backendName;
  try{ await seedSystem(false) }catch(e){ console.warn('seed',e) }
  await refreshDesktop();
  if(cfg.reduceMotion)document.body.classList.add('noanim');
  /* 挂载恢复提醒 */
  const remembered=(await IDB.get('meta','mounts'))||JSON.parse(cookie.get('cuprum_mounts')||'[]');
  if(remembered.length&&cfg.askMount&&window.showDirectoryPicker){
    toast('检测到上次挂载的本地文件夹：'+remembered.join('、')+'，需要重新授权','info',8000);
    setTimeout(()=>{ if(!WM.wins.length)return;
      ctxMenu(innerWidth-300,innerHeight-160,[{header:'需要重新挂载的本地文件夹'},
        ...remembered.map(n=>({label:n,icon:ICON.mount,action:()=>mountLocalFolder()})),
        {label:'不再提示',icon:ICON.close,danger:true,action:()=>{ cfg.askMount=false; saveConfig(); toast('已关闭挂载提示') }}]);
    },2500);
  }
  if(!fs.backendName||fs.backendName==='IndexedDB')toast('OPFS 不可用，已降级到 IndexedDB 文件系统后端','warn',6000);
  /* 初始窗口：文件管理器（无假加载，直接进入桌面） */
  if((cfg.openOnStart||[]).includes('文件管理器'))openApp('files',{path:'/Desktop'});
  else setTimeout(()=>{ openApp('files',{path:'/Desktop'}); hideStart() },600);
  /* 提示拖放能力 */
  setTimeout(()=>toast('提示：可把电脑文件拖进来导入；图标拖出窗口即下载。右键桌面更多功能。','info',7000),900);
  saveConfig();
})();
</script>
