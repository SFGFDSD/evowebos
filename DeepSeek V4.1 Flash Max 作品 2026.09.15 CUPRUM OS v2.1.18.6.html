<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CUPRUM · 铜构 OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141010'/%3E%3Cpath d='M6 6h20v20H6z' fill='none' stroke='%23E2A03F' stroke-width='2'/%3E%3Cpath d='M11 11h10v10H11z' fill='%23E2A03F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-html.min.js"></script>
<style>
/* ============================================================
   CUPRUM OS · 铜构 —— design tokens
   ============================================================ */
:root{
  --f-ui:'Archivo','Helvetica Neue',sans-serif;
  --f-mono:'DM Mono','SFMono-Regular',Menlo,monospace;
  --f-brand:'Unbounded','Archivo',sans-serif;
  --cw:96px; --ch:104px; --cicon:46px;
  --tb:54px;
  --rad:3px;
  --step:cubic-bezier(.2,.85,.2,1);
}
html.theme-dark{
  --bg:#100C0A; --panel:rgba(28,23,19,.86); --panel2:rgba(20,16,13,.94); --solid:#1B1712;
  --line:#3C332A; --line2:#57493B; --ink:#F2EADE; --dim:#A18F79; --dim2:#7B6C5B;
  --acc:#E2A03F; --accInk:#2A1B04; --acc2:#5AA79A; --danger:#CF4A2B; --ok:#7FA35A;
  --glow:0 0 0 1px rgba(226,160,63,.35),0 18px 50px -22px rgba(0,0,0,.9);
  --grain:.32; --hatch:.05;
}
html.theme-light{
  --bg:#E6DFD1; --panel:rgba(252,249,243,.9); --panel2:rgba(247,242,232,.96); --solid:#FBF8F2;
  --line:#C4B8A5; --line2:#A4977F; --ink:#1D1A15; --dim:#6B6153; --dim2:#8B8071;
  --acc:#B4521B; --accInk:#FFF6EA; --acc2:#1D6B62; --danger:#A83A1C; --ok:#5C7A34;
  --glow:0 0 0 1px rgba(180,82,27,.25),0 18px 46px -24px rgba(60,40,20,.55);
  --grain:.14; --hatch:.08;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;
  overscroll-behavior:none;letter-spacing:.01em;
}
/* ---------- wallpaper ---------- */
#wall{position:fixed;inset:0;z-index:0;overflow:hidden}
.wall-layer{position:absolute;inset:-2px;background-size:cover;background-position:center;transition:opacity .5s ease}
.wall-grain{
  position:absolute;inset:0;opacity:var(--grain);pointer-events:none;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) 0 1px,transparent 1px),radial-gradient(rgba(0,0,0,.5) 0 1px,transparent 1px);
  background-size:3px 3px,5px 5px;background-position:0 0,2px 2px;
}
.wall-hatch{
  position:absolute;inset:0;pointer-events:none;opacity:var(--hatch);
  background-image:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 9px);
}
/* ---------- desktop ---------- */
#os{position:fixed;inset:0;z-index:1}
#desktop{position:absolute;left:0;right:0;top:0;bottom:var(--tb);overflow:hidden;touch-action:manipulation}
#icons{position:absolute;inset:0;padding:14px}
.icon{
  position:absolute;width:calc(var(--cw) - 8px);height:calc(var(--ch) - 10px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  padding:10px 4px 6px;border:1px solid transparent;border-radius:var(--rad);
  cursor:default;user-select:none;-webkit-user-select:none;
  transition:left .24s var(--step),top .24s var(--step),background .15s linear,border-color .15s linear,transform .12s var(--step);
  touch-action:none;
}
.icon .glyph{width:var(--cicon);height:var(--cicon);display:grid;place-items:center;color:var(--ink);
  background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,0));
  border:1px solid var(--line);border-radius:var(--rad);position:relative}
.icon .glyph svg{width:70%;height:70%}
.icon .glyph::after{content:'';position:absolute;inset:2px;border:1px solid var(--acc);opacity:0;transition:opacity .18s}
.icon:hover{background:rgba(226,160,63,.10);border-color:var(--line2)}
.icon:hover .glyph::after{opacity:.85}
.icon.sel{background:rgba(226,160,63,.20);border-color:var(--acc)}
.icon.sel .glyph::after{opacity:1}
.icon .nm{font-size:11.5px;line-height:1.2;text-align:center;max-width:100%;word-break:break-all;
  text-shadow:0 1px 2px rgba(0,0,0,.55);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icon.dragging{opacity:.45;transform:scale(.94)}
.icon.drop-hot .glyph{border-color:var(--acc);box-shadow:0 0 0 2px rgba(226,160,63,.45)}
#marquee{position:absolute;border:1px dashed var(--acc);background:rgba(226,160,63,.16);z-index:40;pointer-events:none}
#snapGhost{position:absolute;z-index:60;pointer-events:none;border:2px solid var(--acc);
  background:rgba(226,160,63,.14);backdrop-filter:blur(2px);transition:all .13s ease-out}
#peekFrame{position:absolute;z-index:59;pointer-events:none;border:2px solid var(--acc2);
  background:rgba(90,167,154,.10);box-shadow:0 0 0 9999px rgba(0,0,0,.28);transition:all .16s ease-out}
.hidden{display:none !important}
/* ---------- windows ---------- */
#wins{position:absolute;inset:0;pointer-events:none}
.win{
  position:absolute;min-width:260px;min-height:150px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--rad);
  box-shadow:var(--glow);backdrop-filter:blur(14px) saturate(1.1);pointer-events:auto;overflow:hidden;
}
.win.anim{transition:transform .22s var(--step),width .22s var(--step),height .22s var(--step),left .22s var(--step),top .22s var(--step),opacity .18s ease}
.win.dragging{transition:none;will-change:left,top}
.win.max{border-radius:0;border-color:var(--line)}
.win.min{opacity:0;transform:scale(.8) translateY(60px);pointer-events:none}
.win.gone{opacity:0;transform:scale(.94);pointer-events:none}
.win.focused{border-color:var(--acc)}
.win::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent 60%);opacity:0;transition:opacity .2s}
.win.focused::before{opacity:1}
.tb-title{height:32px;flex:0 0 32px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.10));border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.win.dragging .tb-title{cursor:grabbing}
.tb-title .ti{width:15px;height:15px;color:var(--acc);flex:0 0 15px}
.tb-title .t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tb-btns{display:flex;gap:4px;align-items:center}
.wbtn{width:26px;height:20px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);
  color:var(--dim);border-radius:2px;cursor:pointer;transition:.14s;padding:0}
.wbtn:hover{color:var(--ink);border-color:var(--acc);background:rgba(226,160,63,.14)}
.wbtn.x:hover{color:#fff;background:var(--danger);border-color:var(--danger)}
.wbtn svg{width:11px;height:11px}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rs{position:absolute;z-index:5;touch-action:none}
.rs-n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rs-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rs-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rs-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rs-nw{left:-3px;top:-3px;width:14px;height:14px;cursor:nwse-resize}
.rs-ne{right:-3px;top:-3px;width:14px;height:14px;cursor:nesw-resize}
.rs-sw{left:-3px;bottom:-3px;width:14px;height:14px;cursor:nesw-resize}
.rs-se{right:-3px;bottom:-3px;width:16px;height:16px;cursor:nwse-resize}
.rs-se::after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);opacity:.6}
/* ---------- taskbar ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb);z-index:200;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:var(--panel2);border-top:1px solid var(--line2);backdrop-filter:blur(16px)}
#taskbar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,var(--acc),transparent 70%);opacity:.75}
.brand{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px 0 9px;border:1px solid var(--line);
  background:linear-gradient(140deg,rgba(226,160,63,.18),rgba(226,160,63,.02));color:var(--ink);border-radius:var(--rad);cursor:pointer;transition:.16s}
.brand:hover{border-color:var(--acc);background:linear-gradient(140deg,rgba(226,160,63,.3),rgba(226,160,63,.05))}
.brand svg{width:19px;height:19px;color:var(--acc)}
.brand b{font-family:var(--f-brand);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
#winList{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:4px 2px}
#winList::-webkit-scrollbar{height:0}
.taskitem{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:36px;max-width:190px;padding:0 12px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--rad);cursor:pointer;
  color:var(--dim);font-size:12px;transition:.15s}
.taskitem svg{width:14px;height:14px;flex:0 0 14px}
.taskitem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);letter-spacing:.03em}
.taskitem:hover{color:var(--ink);border-color:var(--line2);background:rgba(226,160,63,.10)}
.taskitem.act{color:var(--ink);border-color:var(--acc);background:rgba(226,160,63,.16);box-shadow:inset 0 -2px 0 var(--acc)}
.taskitem.act svg{color:var(--acc)}
.tray{display:flex;align-items:center;gap:6px}
.traybtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:transparent;
  color:var(--dim);border-radius:var(--rad);cursor:pointer;transition:.15s;padding:0}
.traybtn:hover{color:var(--acc);border-color:var(--line);background:rgba(226,160,63,.10)}
.traybtn svg{width:16px;height:16px}
#clock{font-family:var(--f-mono);font-size:11.5px;line-height:1.25;text-align:right;padding:0 6px;color:var(--ink);cursor:pointer;letter-spacing:.04em}
#clock small{display:block;color:var(--dim);font-size:10px}
.storebar{width:64px;height:26px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 4px;cursor:pointer;border-radius:2px}
.storebar i{display:block;height:5px;background:rgba(255,255,255,.09);border:1px solid var(--line);position:relative;overflow:hidden}
.storebar i b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc2),var(--acc));width:6%;transition:width .5s}
.storebar em{font-family:var(--f-mono);font-size:8.5px;color:var(--dim);font-style:normal;letter-spacing:.06em}
/* ---------- start menu ---------- */
.start{position:absolute;left:10px;bottom:calc(var(--tb) + 10px);width:min(430px,calc(100vw - 20px));z-index:300;
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--rad);box-shadow:var(--glow);
  backdrop-filter:blur(18px);overflow:hidden;transform-origin:bottom left;
  animation:pop .18s var(--step)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.start header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(120deg,rgba(226,160,63,.16),transparent)}
.start header b{font-family:var(--f-brand);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.start header em{font-family:var(--f-mono);font-size:9.5px;color:var(--dim);font-style:normal;margin-left:auto;letter-spacing:.1em}
.ssearch{display:flex;align-items:center;gap:8px;margin:11px;padding:0 10px;height:38px;border:1px solid var(--line);border-radius:var(--rad);background:rgba(0,0,0,.16)}
.ssearch svg{width:14px;height:14px;color:var(--dim)}
.ssearch input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-family:var(--f-ui);font-size:13px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 11px 12px;max-height:44vh;overflow-y:auto}
.appbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px 9px;border:1px solid transparent;
  border-radius:var(--rad);cursor:pointer;color:var(--ink);background:none;transition:.15s;font-family:var(--f-ui);font-size:10.5px}
.appbtn svg{width:26px;height:26px;color:var(--acc)}
.appbtn:hover{background:rgba(226,160,63,.13);border-color:var(--line2);transform:translateY(-2px)}
.appbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.start footer{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:rgba(0,0,0,.12)}
.sfbtn{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);background:none;color:var(--dim);
  border-radius:var(--rad);cursor:pointer;font-family:var(--f-ui);font-size:11.5px;transition:.15s}
.sfbtn:hover{color:var(--ink);border-color:var(--acc)}
.sfbtn svg{width:13px;height:13px}
.sfbtn.dg:hover{color:#fff;background:var(--danger);border-color:var(--danger)}
/* ---------- context menu ---------- */
.ctx{position:absolute;min-width:206px;z-index:900;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--rad);box-shadow:var(--glow);padding:5px;backdrop-filter:blur(16px);animation:pop .13s var(--step)}
.ctx .ci{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:2px;cursor:pointer;color:var(--ink);font-size:12.5px}
.ctx .ci svg{width:14px;height:14px;color:var(--dim);flex:0 0 14px}
.ctx .ci:hover{background:rgba(226,160,63,.16)}
.ctx .ci:hover svg{color:var(--acc)}
.ctx .ci kbd{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--dim2);border:1px solid var(--line);padding:1px 4px;border-radius:2px}
.ctx .ci.dg{color:var(--danger)}.ctx .ci.dg svg{color:var(--danger)}
.ctx .ci.dg:hover{background:rgba(207,74,43,.2)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.ctx .lbl{font-family:var(--f-mono);font-size:9.5px;color:var(--dim2);padding:7px 10px 4px;letter-spacing:.14em;text-transform:uppercase}
/* ---------- generic panels / buttons / forms ---------- */
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);border-radius:var(--rad);
  cursor:pointer;font-family:var(--f-ui);font-size:12px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);background:rgba(226,160,63,.13)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(140deg,var(--acc),#c8802a);color:var(--accInk);border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ic{padding:0;width:30px}
.btn svg{width:14px;height:14px}
.btn.sm{height:25px;font-size:11px;padding:0 8px}
.btn.sm svg{width:12px;height:12px}
.btn.on{border-color:var(--acc);color:var(--acc);background:rgba(226,160,63,.14)}
input.f,select.f,textarea.f{height:30px;background:rgba(0,0,0,.2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--rad);padding:0 9px;font-family:var(--f-ui);font-size:12.5px;outline:0;min-width:0}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}
.bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.1));flex-wrap:wrap;flex:0 0 auto}
.bar .sp{flex:1}
.stat{display:flex;align-items:center;gap:10px;padding:4px 9px;border-top:1px solid var(--line);
  font-family:var(--f-mono);font-size:10.5px;color:var(--dim);background:rgba(0,0,0,.16);flex:0 0 auto;flex-wrap:wrap}
.stat b{color:var(--ink);font-weight:400}
.lbl-m{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
/* ---------- explorer ---------- */
.ex{display:flex;flex:1;min-height:0}
.ex-side{width:186px;flex:0 0 186px;border-right:1px solid var(--line);background:rgba(0,0,0,.14);overflow-y:auto;padding:8px 6px}
.side-h{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;padding:9px 8px 5px}
.side-i{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:2px;cursor:pointer;color:var(--dim);font-size:12.5px;border:1px solid transparent}
.side-i svg{width:14px;height:14px;flex:0 0 14px}
.side-i:hover{background:rgba(226,160,63,.10);color:var(--ink)}
.side-i.act{background:rgba(226,160,63,.16);color:var(--ink);border-color:var(--line2)}
.side-i .un{margin-left:auto;font-family:var(--f-mono);font-size:9px;color:var(--dim2);border:1px solid var(--line);padding:0 4px;border-radius:2px;cursor:pointer}
.side-i .un:hover{color:var(--danger);border-color:var(--danger)}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumbs{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;white-space:nowrap}
.crumb{padding:3px 7px;border-radius:2px;cursor:pointer;color:var(--dim);font-size:12px;border:1px solid transparent}
.crumb:hover{color:var(--ink);background:rgba(226,160,63,.12);border-color:var(--line)}
.crumb.last{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--dim2);font-family:var(--f-mono);font-size:11px}
.hdr{display:flex;align-items:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);border-bottom:1px solid var(--line);background:rgba(0,0,0,.14);flex:0 0 auto;position:relative}
.hdr>div{padding:6px 9px;cursor:pointer;user-select:none;position:relative;overflow:hidden;white-space:nowrap}
.hdr>div:hover{color:var(--ink);background:rgba(226,160,63,.10)}
.hdr>div .ar{color:var(--acc)}
.hdr .grip{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;padding:0}
.hdr .grip:hover{background:var(--acc)}
.rows{flex:1;overflow:auto;position:relative}
.row{display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.035);cursor:default;user-select:none}
.row:hover{background:rgba(226,160,63,.08)}
.row.sel{background:rgba(226,160,63,.19)}
.row.cut{opacity:.45}
.row.dropt .nm{color:var(--acc)}
.row>div{padding:6px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:12.5px}
.row .ico{width:15px;height:15px;flex:0 0 15px;color:var(--acc)}
.row .ico.f{color:var(--dim)}
.row .sz,.row .dt{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.tiles{flex:1;overflow:auto;display:grid;gap:6px;padding:10px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 5px;border:1px solid transparent;border-radius:var(--rad);cursor:default;user-select:none;position:relative}
.tile:hover{background:rgba(226,160,63,.09);border-color:var(--line)}
.tile.sel{background:rgba(226,160,63,.19);border-color:var(--acc)}
.tile svg{width:34px;height:34px;color:var(--acc)}
.tile svg.f{color:var(--dim)}
.tile span{font-size:11px;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- misc app styles ---------- */
.monoarea{width:100%;height:100%;background:none;border:0;outline:0;resize:none;color:var(--ink);
  font-family:var(--f-mono);font-size:13px;line-height:1.65;padding:12px 14px;tab-size:4}
.calc{display:flex;flex-direction:column;height:100%}
.calc .out{padding:14px 14px 10px;text-align:right;border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
.calc .out .e{font-family:var(--f-mono);font-size:11px;color:var(--dim);min-height:15px;word-break:break-all}
.calc .out .r{font-family:var(--f-brand);font-size:29px;font-weight:600;letter-spacing:-.01em;word-break:break-all}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.keys button{border:0;background:var(--panel);color:var(--ink);font-family:var(--f-ui);font-size:16px;cursor:pointer;transition:.12s;padding:0}
.keys button:hover{background:rgba(226,160,63,.2);color:var(--acc)}
.keys button.o{color:var(--acc);font-weight:600}
.keys button.eq{background:linear-gradient(140deg,var(--acc),#c8802a);color:var(--accInk);font-weight:700}
.keys .sp{display:grid;grid-template-columns:2fr 1fr;grid-column:span 1;gap:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--rad);background:rgba(0,0,0,.12);padding:13px}
.card h4{margin:0 0 9px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.card p{margin:0 0 9px;color:var(--dim);font-size:12px;line-height:1.6}
.rowline{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.rowline:last-child{border:0}
.rowline .k{flex:1;font-size:12.5px}
.rowline .k small{display:block;color:var(--dim2);font-size:10.5px;margin-top:2px}
.sw{width:38px;height:20px;border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:20px;position:relative;cursor:pointer;flex:0 0 38px;transition:.2s}
.sw b{position:absolute;top:1px;left:2px;width:14px;height:14px;background:var(--dim);border-radius:50%;transition:.2s}
.sw.on{border-color:var(--acc);background:rgba(226,160,63,.25)}
.sw.on b{left:20px;background:var(--acc)}
.usage{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:146px;height:146px;border-radius:50%;position:relative;flex:0 0 146px;
  background:conic-gradient(var(--acc) 0deg,var(--acc) 0deg)}
.donut::after{content:'';position:absolute;inset:26px;border-radius:50%;background:var(--solid);border:1px solid var(--line)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;
  font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.donut .ctr b{display:block;font-family:var(--f-brand);font-size:15px;color:var(--ink)}
.leg{flex:1;min-width:220px}
.leg .li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.leg .li i{width:10px;height:10px;flex:0 0 10px;border:1px solid var(--line)}
.leg .li .v{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.setwrap{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.wthumb{height:70px;border:2px solid var(--line);border-radius:var(--rad);cursor:pointer;background-size:cover;background-position:center;position:relative;transition:.16s}
.wthumb:hover{border-color:var(--line2);transform:translateY(-2px)}
.wthumb.on{border-color:var(--acc)}
.wthumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;padding:3px 4px;font-family:var(--f-mono);letter-spacing:.06em}
.split{display:flex;flex:1;min-height:0}
.split .lft{min-width:0;display:flex;flex-direction:column;flex:1}
.split .gutter{flex:0 0 6px;cursor:col-resize;background:var(--line);position:relative;transition:.15s}
.split .gutter:hover,.split .gutter.act{background:var(--acc)}
.split .rgt{min-width:0;display:flex;flex-direction:column;flex:0 0 42%}
.cmwrap{flex:1;min-height:0;position:relative;display:flex}
.CodeMirror{flex:1;height:auto !important;font-family:var(--f-mono) !important;font-size:13px}
.findbar{display:none;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.24);flex-wrap:wrap;flex:0 0 auto}
.findbar.on{display:flex}
.cm-findmatch{background:rgba(226,160,63,.28);outline:1px solid rgba(226,160,63,.5)}
.cm-findmatch-act{background:rgba(90,167,154,.5);outline:1px solid var(--acc2)}
.mangabody{flex:1;min-height:0;background:#000;overflow-y:auto;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
.mangabody img{width:100%;max-width:1000px;display:block;pointer-events:none;opacity:0;transition:opacity .5s ease}
.mangabody img.rdy{opacity:1}
#mangaExit{position:absolute;right:12px;top:10px;z-index:70;width:32px;height:32px;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:2px;display:none;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
#mangaExit svg{width:14px;height:14px}
.win.mfullscreen>.tb-title{display:none}
.win.mfullscreen #mangaExit{display:grid}
.win.mfullscreen{border:0;box-shadow:none;border-radius:0}
.win.mfullscreen .bar>.lbl-m,.win.mfullscreen .stat{opacity:.55}
[data-a=vlock]{display:none;position:absolute;right:12px;top:10px;z-index:70;width:32px;height:32px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:2px;place-items:center;cursor:pointer}
[data-a=vlock] svg{width:14px;height:14px}
.viewer{flex:1;min-height:0;display:flex;flex-direction:column;background:#0a0a0a}
.viewer .stage{flex:1;overflow:auto;display:grid;place-items:center;background-image:
  linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%),
  linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%);
  background-size:22px 22px;background-position:0 0,11px 11px}
.viewer img{max-width:100%;max-height:100%;transform-origin:center;transition:transform .12s ease-out;user-select:none}
.gridcsv{flex:1;min-height:0;overflow:auto;font-family:var(--f-mono);font-size:12px}
table.sheet{border-collapse:collapse;width:max-content;min-width:100%}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:3px 7px;max-width:340px;min-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sheet th{background:rgba(226,160,63,.14);color:var(--acc);position:sticky;top:0;z-index:3;text-align:left;font-size:10px;letter-spacing:.08em}
table.sheet th.rn,table.sheet td.rn{position:sticky;left:0;background:rgba(0,0,0,.32);color:var(--dim2);min-width:44px;width:44px;text-align:right;font-size:10px}
table.sheet td[contenteditable]:focus{outline:2px solid var(--acc);background:rgba(226,160,63,.12);white-space:normal}
table.sheet tr:nth-child(even) td:not(.rn){background:rgba(255,255,255,.022)}
canvas.paint{flex:1;min-height:0;background:#fff;cursor:crosshair;touch-action:none;display:block;width:100%}
.swatch{width:22px;height:22px;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.swatch.on{outline:2px solid var(--acc);outline-offset:1px}
.browserui{flex:1;display:flex;flex-direction:column}
.browserui iframe{flex:1;border:0;background:#fff;width:100%}
.pagesheet{padding:26px 30px;overflow-y:auto;flex:1;background:var(--solid)}
.pagesheet h1{font-family:var(--f-brand);font-size:26px;margin:0 0 6px}
.pagesheet a{color:var(--acc)}
.vmwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#000}
.screen_container{flex:1;min-height:0;overflow:hidden;background:#000;display:block}
.screen_container div{white-space:pre;font:14px monospace;line-height:14px;color:#ccc}
.screen_container canvas{max-width:100%}
/* ---------- toasts, modal ---------- */
#toasts{position:absolute;right:12px;bottom:calc(var(--tb) + 12px);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;min-width:210px;max-width:320px;padding:10px 13px;background:var(--panel2);
  border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:var(--rad);box-shadow:var(--glow);
  animation:slidein .22s var(--step);font-size:12.5px;backdrop-filter:blur(10px)}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--ok)}
.toast svg{width:15px;height:15px;color:var(--acc);flex:0 0 15px}
.toast.err svg{color:var(--danger)}.toast.ok svg{color:var(--ok)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.modal{position:absolute;inset:0;z-index:1100;background:rgba(0,0,0,.5);display:grid;place-items:center;backdrop-filter:blur(3px);animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .mbody{width:min(440px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--line2);border-radius:var(--rad);
  box-shadow:var(--glow);padding:18px;animation:pop .18s var(--step)}
.modal .mbody h3{margin:0 0 4px;font-family:var(--f-brand);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.modal .mbody p{margin:0 0 12px;color:var(--dim);font-size:12.5px;line-height:1.6}
.modal .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--acc);background-clip:padding-box}
.noanim *{transition:none !important;animation:none !important}
/* ---------- mobile / tablet ---------- */
@media (max-width:780px){
  :root{--tb:62px;--cw:80px;--ch:92px;--cicon:40px}
  #icons{padding:8px}
  .icon .nm{font-size:10.5px}
  .ex-side{position:absolute;left:0;top:0;bottom:0;z-index:20;width:74%;flex:0 0 74%;transform:translateX(-101%);
    transition:transform .25s var(--step);background:var(--solid);box-shadow:var(--glow)}
  .ex-side.open{transform:none}
  .start{left:0;right:0;bottom:var(--tb);width:100%;max-height:calc(100vh - var(--tb));border-radius:0;border-left:0;border-right:0}
  .apps{grid-template-columns:repeat(4,1fr);max-height:52vh}
  #taskbar{gap:5px;padding:0 6px}
  .brand{padding:0 9px}
  .brand b{display:none}
  .taskitem{max-width:96px}
  .tray .hide-m{display:none}
  .win{min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .rs-e,.rs-w,.rs-n,.rs-s{display:none}
  .rs-se,.rs-sw,.rs-ne,.rs-nw{width:24px;height:24px}
  .split{flex-direction:column}
  .split .gutter{flex:0 0 8px;cursor:row-resize}
  .split .rgt{flex:0 0 44%}
  .hdr .ty,.hdr .sz,.row .ty,.row .sz{display:none}
  #toasts{left:12px;right:12px;align-items:stretch;bottom:calc(var(--tb) + 10px)}
  .crumb{padding:5px 8px}
  .btn{height:32px}
  .row>div{padding:9px}
}
@media (max-width:520px){ .start .apps{grid-template-columns:repeat(3,1fr)} }
@media (pointer:coarse){
  .icon{touch-action:none}
  .btn{height:34px}
  .wbtn{width:32px;height:26px}
}
</style>

<body>
<div id="os">

    <div class="wall-layer" id="wallImg2"></div>
    <div class="wall-hatch"></div>

  </div>

  <div id="desktop">
    <div id="icons"></div>
    <div id="marquee" class="hidden"></div>
    <div id="snapGhost" class="hidden"></div>
    <div id="peekFrame" class="hidden"></div>
  </div>

  <div id="wins"></div>

  <div id="taskbar">
    <div class="brand" id="startBtn" title="开始 (Ctrl+Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
      <b>CUPRUM</b>
    </div>
    <div id="winList"></div>
    <div class="tray">
      <div class="storebar hide-m" id="storeBar" title="存储用量">
        <i><b id="storeFill"></b></i><em id="storeTxt">OPFS</em>
      </div>
      <button class="traybtn hide-m" id="mountBtn" title="挂载本地文件夹">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h6l2 3h8v9H4z"/><path d="M12 12v4M10 14h4"/></svg>
      </button>
      <button class="traybtn" id="themeBtn" title="明暗模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <div id="clock" title="点击打开设置"></div>
    </div>
  </div>

  <div id="startMenu" class="start hidden"></div>
  <div id="ctx" class="ctx hidden"></div>
  <div id="peekCard" class="ctx hidden"></div>
  <div id="toasts"></div>
  <div class="modal hidden" id="modal"></div>

  <input id="filePick" type="file" multiple hidden>
  <input id="wallPick" type="file" accept="image/*" hidden>
</div>
<script>
/* ============================================================================
   CUPRUM OS · 核心层  —— 工具 / 图标 / 持久化 / 统一文件系统 (fs) / 压缩 / 拖放

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

function el(tag,cls,html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n}

function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
const natCmp=(a,b)=>String(a).localeCompare(String(b),'zh-Hans-CN',{numeric:true,sensitivity:'base'});

const isVideo=n=>/\.(mp4|webm|ogv|mov|m4v|mkv|avi|flv|mpeg|mpg|3gp)$/i.test(n);
const isPdf=n=>/\.pdf$/i.test(n);
const isHtml=n=>/\.(html?|xhtml)$/i.test(n);
const isSvg=n=>/\.svg$/i.test(n);
const isTable=n=>/\.(csv|tsv)$/i.test(n);
const isZip=n=>/\.(zip|7z|rar|gz|tgz|tar|bz2|xz|jar|apk|epub|docx|xlsx|pptx|cbz|cbr)$/i.test(n);
const isCode=n=>/\.(js|mjs|cjs|ts|jsx|tsx|json|jsonc|css|scss|less|xml|yaml|yml|toml|ini|conf|sh|bash|py|rb|go|rs|c|h|cpp|java|php|sql|vue|svelte|md|markdown|log|txt|env|gitignore|svg|html?)$/i.test(n);
const isTextish=n=>isCode(n)||isTable(n)||/\.(txt|log|md|markdown|srt|vtt|rtf|bat|cmd|ps1|config)$/i.test(n);

/* ------------------------------- 图标 (原创 SVG) ------------------------- */
const S=(p,w=1.55)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="square" stroke-linejoin="miter">${p}</svg>`;
const ICON={
  folder:S('<path d="M3 5h6l2.2 3H21v11H3z"/><path d="M3 11h18"/>'),

  paint:S('<path d="M4 20l3-1 10-10-2-2L5 17z"/><path d="M14 6l4 4"/><circle cx="17.5" cy="6.5" r="1"/>'),

  disk:S('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
  search:S('<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L21 21"/>'),
  back:S('<path d="M15 5l-7 7 7 7"/>'), fwd:S('<path d="M9 5l7 7-7 7"/>'),
  up:S('<path d="M12 20V5M6 11l6-6 6 6"/>'), down:S('<path d="M12 4v15M6 13l6 6 6-6"/>'),
  refresh:S('<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/>'),
  plus:S('<path d="M12 5v14M5 12h14"/>'),

/* ------------------------------- 持久化: IDB + Cookie + localStorage ------- */
const IDB=(()=>{
  let dbp=null;
  function open(){ if(dbp)return dbp; dbp=new Promise((res,rej)=>{
    const r=indexedDB.open('cuprum-os',1);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');
      if(!d.objectStoreNames.contains('fs'))d.createObjectStore('fs');
      if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs');};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});
    return dbp; }
  async function tx(store,mode,fn){ try{ const d=await open(); return await new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store); let out;
    const rq=fn(s); if(rq)rq.onsuccess=()=>out=rq.result; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error);
  })}catch(e){ console.warn('[IDB]',e); return null } }
  return {
    get:(st,k)=>tx(st,'readonly',s=>s.get(k)),
    set:(st,k,v)=>tx(st,'readwrite',s=>s.put(v,k)),
    del:(st,k)=>tx(st,'readwrite',s=>s.delete(k)),
    all:(st)=>tx(st,'readonly',s=>s.getAll()),
    keys:(st)=>tx(st,'readonly',s=>s.getAllKeys()),
    clear:(st)=>tx(st,'readwrite',s=>s.clear())
  };
})();
const cookie={
  set(k,v,days=400){try{const d=new Date(Date.now()+days*864e5);document.cookie=k+'='+encodeURIComponent(v)+';expires='+d.toUTCString()+';path=/;SameSite=Lax'}catch(e){}},
  get(k){try{const m=document.cookie.match('(^|;)\\s*'+k+'\\s*=\\s*([^;]+)');return m?decodeURIComponent(m[2]):null}catch(e){return null}}
};

/* ------------------------------- 统一文件系统 fs --------------------------- */
const PATH={
  norm(p){ p=String(p||'/').replace(/\\/g,'/').replace(/\/+/g,'/'); const parts=[];
    p.split('/').forEach(x=>{ if(x===''||x==='.')return; if(x==='..')parts.pop(); else parts.push(x); });
    return '/'+parts.join('/'); },
  parts(p){ return PATH.norm(p).split('/').filter(Boolean); },
  base(p){ const a=PATH.parts(p); return a.length?a[a.length-1]:'/' },
  dir(p){ const a=PATH.parts(p); a.pop(); return '/'+a.join('/') },
  join(...a){ return PATH.norm(a.filter(x=>x!=null&&x!=='').join('/')) },
  ext(p){ const b=PATH.base(p).toLowerCase(); return b.includes('.')?b.split('.').pop():''; }
};
function cbify(fn){ /* 支持 (…args, cb?) 双约定, 保证参数签名兼容 */
  return function(...args){
    let cb=null;
    if(typeof args[args.length-1]==='function')cb=args.pop();
    const p=fn.apply(this,args);
    if(cb)p.then(r=>cb(null,r),e=>cb(e)); else return p;
    return p;
  };
}

/** HandleBackend: 同时适配 OPFS 根句柄与本地文件夹句柄（File System Access API） */
class HandleBackend{
  constructor(root,label,opts={}){ this.root=root; this.label=label; this.kind='handle'; this.rw=opts.rw!==false; }
  async _dir(parts,create=false,opt={}){ let h=this.root; for(const p of parts) h=await h.getDirectoryHandle(p,{create:!!create}); return h; }
  async _file(parts,create=false){ if(!parts.length)throw new Error('EINVAL'); const d=await this._dir(parts.slice(0,-1),create); return d.getFileHandle(parts[parts.length-1],{create:!!create}) }
  async _resolve(parts,create=false){
    if(!parts.length)return {dir:this.root,type:'dir',handle:this.root};
    let dir=this.root;
    for(let i=0;i<parts.length-1;i++){ dir=await dir.getDirectoryHandle(parts[i],{create:!!create}); }
    const last=parts[parts.length-1];
    try{ const fh=await dir.getFileHandle(last); return {file:fh,type:'file',handle:fh,dir} }catch(e){}
    try{ const dh=await dir.getDirectoryHandle(last); return {dir:dh,type:'dir',handle:dh,parent:dir} }catch(e){}
    throw Object.assign(new Error('ENOENT: '+PATH.join('/',...parts)),{code:'ENOENT'});
  }
  async list(parts){ const dir=await this._dir(parts,false); const out=[];
    for await(const [name,h] of dir.entries()){ out.push({name,handle:h,kind:h.kind}); } return out; }
  async readFile(p,flag){ p=PATH.parts(p); const fh=await this._file(p,false); return await fh.getFile(); }
  async writeFile(p,data){ p=PATH.parts(p); const fh=await this._file(p,true); const w=await fh.createWritable();
    try{ await w.write(data); }finally{ await w.close(); } return true; }
  async mkdir(p,opt={}){ const parts=PATH.parts(p); const h=await this._dir(parts,true,opt); return {path:PATH.join('/',...parts),name:parts[parts.length-1],kind:'dir',handle:h} }
  async unlink(p){ const parts=PATH.parts(p); const d=await this._dir(parts.slice(0,-1),false); await d.removeEntry(parts[parts.length-1],{recursive:false}); return true }
  async rmdir(p,opt={}){ const parts=PATH.parts(p); const d=await this._dir(parts.slice(0,-1),false); await d.removeEntry(parts[parts.length-1],{recursive:opt.recursive!==false}); return true }
  async stat(p,isLstat){
    const rel=PATH.parts(p);
    if(!rel.length)return {path:'/',name:'/',isDir:true,isDirectory:()=>true,size:0,mtime:0,type:'dir'};
    const r=await this._resolve(rel,false);
    if(r.type==='dir')return {path:PATH.join('/',...rel),name:rel[rel.length-1],isDir:true,isDirectory:()=>true,size:0,
      mtime:r.lastModified||0,type:'dir',handle:r.handle};
    const f=await r.file.getFile();
    return {path:PATH.join('/',...rel),name:rel[rel.length-1],isDir:false,isDirectory:()=>false,size:f.size,
      mtime:f.lastModified,type:'file',mime:f.type||mimeOf(f.name),handle:r.file,file:r.file};
  }
  async exists(p){ try{ await this.stat(p); return true }catch(e){ return false } }
  async rename(from,to){
    from=PATH.norm(from); to=PATH.norm(to);
    if(from===to)return true;
    const st=await this.stat(from);
    if(st.isDir){
      const items=await this.readdir(from,{withMeta:true});
      await this.mkdir(to,{layout:true});
      for(const it of items) await this.rename(it.path,PATH.join(to,it.name));
      await this.rmdir(from,{recursive:true});
    }else{
      const f=await this.readFile(from);
      await this.mkdir(PATH.dir(to),{layout:true});
      await this.writeFile(to,f);
      await this.unlink(from);
    }
    return true;
  }
}

/** MemoryBackend: 降级后端（IndexedDB 持久化），接口与 HandleBackend 完全一致 */
class MemoryBackend{
  constructor(db='fs'){ this.kind='memory'; this.db=db; this.label='IDB'; this.map=new Map(); this.dirty=false;
    this._flush=()=>{ if(!this.dirty)return; this.dirty=false; IDB.set(this.db,'snapshot',[...this.map.entries()]); }; setInterval(this._flush,1200); }
  async init(){ const snap=await IDB.get(this.db,'snapshot'); if(Array.isArray(snap))snap.forEach(([k,v])=>{ if(v&&v.data)v.data=new Uint8Array(v.data); this.map.set(k,v) }); 
    if(!this.map.has('/'))this.map.set('/',{kind:'dir',name:'/',mtime:Date.now()}); }
  _k(p){ return PATH.norm(p) }
  async mkdir(p,opt={}){ const parts=PATH.parts(p); let cur='';
    for(const s of parts){ cur=cur+'/'+s; if(!this.map.has(cur)){ this.map.set(cur,{kind:'dir',name:s,mtime:Date.now()}); this.dirty=true } }
    return {path:this._k(p),kind:'dir'}; }
  async list(parts){ const base='/'+parts.join('/'); const pre=base==='/'?'/':base+'/';
    return [...this.map.entries()].filter(([k,v])=>k!==base&&k.startsWith(pre)&&k.slice(pre.length).indexOf('/')<0&&k.slice(pre.length)!=='')
      .map(([k,v])=>({name:v.name,kind:v.kind==='dir'?'directory':'file'})); }
  async readFile(p){ const v=this.map.get(this._k(p)); if(!v||v.kind!=='file')throw Object.assign(new Error('ENOENT'),{code:'ENOENT'});
    return new File([v.data||new Uint8Array()],v.name,{type:v.mime||mimeOf(v.name),lastModified:v.mtime||Date.now()}) }
  async writeFile(p,data){ const k=this._k(p); await this.mkdir(PATH.dir(k));
    let buf; if(data instanceof Blob)buf=new Uint8Array(await data.arrayBuffer()); else if(typeof data==='string')buf=new TextEncoder().encode(data);
    else buf=new Uint8Array(data);
    this.map.set(k,{kind:'file',name:PATH.base(k),mtime:Date.now(),data:buf,mime:mimeOf(k)}); this.dirty=true; this._flush(); return true }
  async unlink(p){ this.map.delete(this._k(p)); this.dirty=true; return true }
  async rmdir(p,opt={}){ const k=this._k(p); [...this.map.keys()].forEach(x=>{ if(x===k||x.startsWith(k+'/'))this.map.delete(x) }); this.dirty=true; return true }
  async stat(p,isLstat){ const k=this._k(p); const v=this.map.get(k); if(!v)throw Object.assign(new Error('ENOENT: '+k),{code:'ENOENT'});
    return {path:k,name:v.name,isDir:v.kind==='dir',isDirectory:()=>v.kind==='dir',size:v.data?v.data.byteLength:0,mtime:v.mtime,type:v.kind} }
  async exists(p){ return this.map.has(this._k(p)) }
  async rename(from,to){ from=this._k(from); to=this._k(to);
    const st=await this.stat(from);
    if(st.isDir){ const kids=[...this.map.keys()].filter(k=>k.startsWith(from+'/')); for(const k of kids){ const nv=this.map.get(k); this.map.set(to+k.slice(from.length),nv); this.map.delete(k) }
      const d=this.map.get(from); this.map.delete(from); this.map.set(to,Object.assign({},d,{name:PATH.base(to)})); }
    else{ const v=this.map.get(from); this.map.delete(from); this.map.set(to,Object.assign({},v,{name:PATH.base(to),mtime:Date.now()})); }
    this.dirty=true; this._flush(); return true }
}

const fs=(()=>{
  const mounts=new Map();       // '/mnt/local/X' -> backend
  let rootBackend=null, ready=false, backendName='none';
  function pick(path){ const p=PATH.norm(path); let best=null;
    for(const [m,b] of mounts){ if(p===m||p.startsWith(m==='/'?'/':m+'/')){ if(!best||m.length>best[0].length)best=[m,b] } }
    if(!best) return {backend:rootBackend,rel:p};
    return {backend:best[1],rel:best[0]==='/'?p:p.slice(best[0].length)||'/'};
  }
  function B(path){ return pick(path) }
  const api={
    get ready(){return ready}, get backendName(){return backendName},
    mounts(){ return [...mounts.keys()].filter(m=>m!=='/') },
    mountPoints(){ return [...mounts.entries()].map(([m,b])=>({point:m,label:b.label,kind:b.kind})) },
    async init(){
      try{
        if(navigator.storage&&navigator.storage.getDirectory){
          const rh=await navigator.storage.getDirectory();
          rootBackend=new HandleBackend(rh,'OPFS'); backendName='OPFS';
          await rootBackend.mkdir('/.probe',{layout:true}).catch(()=>{});
          await rootBackend.rmdir('/.probe',{recursive:true}).catch(()=>{});
        }else throw new Error('no OPFS');
      }catch(e){
        console.warn('OPFS 不可用，降级到 IndexedDB FS',e);
        rootBackend=new MemoryBackend('fs'); await rootBackend.init(); backendName='IndexedDB';
      }
      mounts.set('/',rootBackend);
      for(const d of ['/Desktop','/Documents','/Pictures','/Music','/Videos','/Downloads','/Projects','/System','/mnt','/mnt/local'])
        await rootBackend.mkdir(d,{layout:true}).catch(()=>{});
      ready=true;
      return api;
    },
    async mountLocal(point,handle,label,opts={}){ const b=new HandleBackend(handle,label||handle.name,{rw:true}); mounts.set(PATH.norm(point),b); return b },
    unmount(point){ mounts.delete(PATH.norm(point)) },
    readdir:cbify(async function(path,opts={}){
      const {backend,rel}=B(path); const list=await backend.list(PATH.parts(rel));
      let out=[];
      for(const it of list){
        const p=PATH.join(path,it.name);
        let meta={name:it.name,path:p,isDir:it.kind==='directory'||it.kind==='dir'};
        if(opts.withMeta){
          try{ const st=await backend.stat(PATH.join(rel.split('/').filter(Boolean).length?rel:'/',it.name)); 
            Object.assign(meta,{size:st.size,mtime:st.mtime,type:st.type}); }catch(e){ meta.size=0;meta.mtime=0; }
        }
        out.push(meta);
      }
      if(opts.sort!==false)out.sort((a,b)=>(b.isDir-a.isDir)||natCmp(a.name,b.name));
      return out;
    }),
    stat:cbify(async function(path,isLstat){ const {backend,rel}=B(path); return backend.stat(rel!=='/'?rel:'/',isLstat) }),
    readFile:cbify(async function(path,flag){ const {backend,rel}=B(path); return backend.readFile(rel,flag) }),
    readText:cbify(async function(path){ const f=await api.readFile(path); return await f.text() }),
    writeFile:cbify(async function(path,data){ const {backend,rel}=B(path); return backend.writeFile(rel,data) }),
    writeText:cbify(async function(path,txt){ return api.writeFile(path,new Blob([txt],{type:'text/plain;charset=utf-8'})) }),
    mkdir:cbify(async function(path,opt={}){ const {backend,rel}=B(path); return backend.mkdir(rel,opt) }),
    unlink:cbify(async function(path){ const {backend,rel}=B(path); return backend.unlink(rel) }),
    rmdir:cbify(async function(path,opt={recursive:true}){ const {backend,rel}=B(path); return backend.rmdir(rel,opt) }),
    exists:cbify(async function(path){ const {backend,rel}=B(path); return backend.exists(rel) }),
    rename:cbify(async function(from,to){ const a=B(from),b=B(to);
      if(a.backend===b.backend)return a.backend.rename(a.rel,b.rel);
      await api.copy(from,to); return api.remove(from); }),
    copy:cbify(async function(src,dst){ const st=await api.stat(src);
      if(st.isDir){ await api.mkdir(dst,{layout:true}); const kids=await api.readdir(src,{sort:false});
        for(const k of kids) await api.copy(k.path,PATH.join(dst,k.name)); }
      else{ const f=await api.readFile(src); await api.mkdir(PATH.dir(PATH.norm(dst)),{layout:true}); await api.writeFile(dst,f); }
      return true }),
    remove:cbify(async function(path){ const st=await api.stat(path);
      return st.isDir?api.rmdir(path,{recursive:true}):api.unlink(path) }),
    moveInto:cbify(async function(paths,targetDir){
      const result=[];
      for(const p of paths){
        const name=PATH.base(p); let dst=PATH.join(targetDir,name); let i=1;
        while(await api.exists(dst)){ dst=PATH.join(targetDir,name.replace(/(\.\w+)?$/,k=>' ('+(++i)+')'+k)) }
        try{ await api.rename(p,dst); result.push(dst) }catch(e){ console.warn('move fail',e); }
      }
      return result;
    }),
    async du(path,acc){ acc=acc||{total:0,count:0,cats:{}};
      let items=[]; try{ items=await api.readdir(path,{withMeta:true}) }catch(e){ return acc }
      for(const it of items){
        if(it.isDir){ await api.du(it.path,acc); acc.cats.base=(acc.cats.base||0)+4096; }
        else{ const sz=it.size||0; acc.total+=sz; acc.count++;

        try{ e.dataTransfer.setData('DownloadURL',(rec.file.type||mimeOf(paths[0]))+':'+rec.file.name+':'+rec.url) }catch(_){}

  const W=Math.min(o.w||760,ds.w-16), H=Math.min(o.h||520,ds.h-16);
  const id=++WM.seq;
  const n=(WM.wins.filter(w=>w.app===o.app).length)%6;
  const cw=Math.max(Math.round(ds.w*.5-W/2),12)+n*26, ch=Math.max(Math.round(ds.h*.45-H/2),10)+n*22;
  const node=el('div','win anim');
  node.innerHTML=`<div class="tb-title">
      <span class="ti">${o.icon||ICON.window||ICON.grid}</span>
      <span class="t">${esc(o.title||'窗口')}</span>
      <span class="tb-btns">
        <button class="wbtn m" title="最小化">${ICON.min}</button>
        <button class="wbtn z" title="最大化 / 还原">${ICON.max}</button>
        <button class="wbtn x" title="关闭">${ICON.close}</button>
      </span></div>
    <div class="wbody"></div>
    <div class="rs rs-n"></div><div class="rs rs-s"></div><div class="rs rs-w"></div><div class="rs rs-e"></div>
    <div class="rs rs-nw"></div><div class="rs rs-ne"></div><div class="rs rs-sw"></div><div class="rs rs-se"></div>`;
  const win={
    id,key,app:o.app||null,type:o.type||null,title:o.title||'窗口',node,body:$('.wbody',node),
    icon:o.icon||ICON.file, minimized:false, maximized:isMobile(),
    prev:null,onClose:o.onClose,onResize:o.onResize,onFocus:o.onFocus,meta:o.meta||{}
  };
  node.style.width=W+'px'; node.style.height=H+'px'; node.style.left=clamp(cw,8,Math.max(8,ds.w-W-8))+'px'; node.style.top=clamp(ch,8,Math.max(8,ds.h-H-8))+'px';
  $('#wins').appendChild(node);

  const titleEl=$('.t',node);
  win.setTitle=t=>{ win.title=t; titleEl.innerHTML=esc(t) };
  win.focus=()=>{ win.minimized=false; node.classList.remove('min'); node.style.zIndex=++WM.z;
    WM.wins.forEach(x=>x.node.classList.toggle('focused',x===win)); if(win.onFocus)win.onFocus(win); refreshTaskbar(); };
  win.minimize=()=>{ win.minimized=true; node.classList.add('anim'); node.classList.add('min'); refreshTaskbar() };
  win.restore=()=>{ if(win.minimized){ win.minimized=false; node.classList.remove('min'); } };
  win.applyMax=()=>{ const d=deskSize();
    win.maximized=true; node.classList.add('max');
    node.style.left='0px'; node.style.top='0px'; node.style.width=d.w+'px'; node.style.height=d.h+'px';
    $('.wbtn.z',node).innerHTML=ICON.restore; if(win.onResize)win.onResize(win); setTimeout(()=>{ if(win.editorCb)win.editorCb() },240) };
  win.unmax=()=>{ const r=win.prev||{left:60,top:40,width:760,height:520};
    win.maximized=false; node.classList.remove('max');
    node.style.left=r.left+'px'; node.style.top=r.top+'px'; node.style.width=r.width+'px'; node.style.height=r.height+'px';
    $('.wbtn.z',node).innerHTML=ICON.max; if(win.onResize)win.onResize(win); setTimeout(()=>{ if(win.editorCb)win.editorCb() },240) };
  win.toggleMax=()=>{ if(win.maximized)win.unmax(); else { win.prev={left:parseFloat(node.style.left),top:parseFloat(node.style.top),width:parseFloat(node.style.width),height:parseFloat(node.style.height)}; win.applyMax() } };
  win.snap=side=>{ const d=deskSize();
    if(side==='max'){ if(!win.maximized){ win.prev={left:parseFloat(node.style.left),top:parseFloat(node.style.top),width:parseFloat(node.style.width),height:parseFloat(node.style.height)}; win.applyMax() } return }
    if(win.maximized){ win.unmax(); setTimeout(()=>win.snap(side),200); return }
    const half={left:[0,0,Math.round(d.w/2),d.h],right:[Math.round(d.w/2),0,Math.ceil(d.w/2),d.h],
      tl:[0,0,Math.round(d.w/2),Math.round(d.h/2)],tr:[Math.round(d.w/2),0,Math.ceil(d.w/2),Math.round(d.h/2)],
      bl:[0,Math.round(d.h/2),Math.round(d.w/2),Math.ceil(d.h/2)],br:[Math.round(d.w/2),Math.round(d.h/2),Math.ceil(d.w/2),Math.ceil(d.h/2)]}[side];
    if(!half)return; win.prev={left:parseFloat(node.style.left),top:parseFloat(node.style.top),width:parseFloat(node.style.width),height:parseFloat(node.style.height)};
    node.style.left=half[0]+'px'; node.style.top=half[1]+'px'; node.style.width=half[2]+'px'; node.style.height=half[3]+'px';
    if(win.onResize)win.onResize(win) };
  win.close=async()=>{ if(win.onClose){ try{ if(await win.onClose(win)===false)return }catch(e){ console.warn(e) } }
    node.classList.add('gone'); setTimeout(()=>node.remove(),200);
    WM.wins=WM.wins.filter(w=>w!==win); refreshTaskbar();
    const nx=WM.wins.filter(w=>w.app===win.app&&!w.minimized).pop(); if(nx)nx.focus();
  };
  $('.wbtn.m',node).onclick=e=>{ e.stopPropagation(); win.minimize() };
  $('.wbtn.z',node).onclick=e=>{ e.stopPropagation(); win.toggleMax() };
  $('.wbtn.x',node).onclick=e=>{ e.stopPropagation(); win.close() };
  $('.tb-title',node).addEventListener('dblclick',()=>win.toggleMax());
  node.addEventListener('pointerdown',()=>win.focus(),{capture:true});
  WM.wins.push(win); win.focus();

  /* ---- 拖拽 & Aero Snap ---- */
  const tb=$('.tb-title',node);
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.wbtn'))return;
    if(e.button!==0&&e.pointerType==='mouse')return;
    const startX=e.clientX,startY=e.clientY; let sx=parseFloat(node.style.left),sy=parseFloat(node.style.top);
    let moved=false, side=null;
    const d=deskSize(); const ghost=$('#snapGhost');
    node.classList.add('dragging');
    const move=ev=>{
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      if(!moved&&Math.hypot(dx,dy)<4)return; moved=true;
      if(win.maximized&&!o.keepMax){ win.prev={left:clamp(ev.clientX-200,10,innerWidth-300),top:10,width:win.prev?win.prev.width:800,height:win.prev?win.prev.height:560}; win.unmax();
        sx=parseFloat(node.style.left); sy=parseFloat(node.style.top); }
      node.style.left=clamp(sx+dx,-40,d.w-120)+'px'; node.style.top=clamp(sy+dy,0,d.h-40)+'px';
      /* 吸附区域判定 */
      side=null; const EDGE=Math.max(10,innerWidth*.045);
      if(cfg.snaps){
        if(ev.clientX<EDGE&&ev.clientY<EDGE)side='tl';
        else if(ev.clientX>innerWidth-EDGE&&ev.clientY<EDGE)side='tr';
        else if(ev.clientX<EDGE&&ev.clientY>d.h-EDGE)side='bl';
        else if(ev.clientX>innerWidth-EDGE&&ev.clientY>d.h-EDGE)side='br';
        else if(ev.clientY<EDGE)side='max';
        else if(ev.clientX<EDGE)side='left';
        else if(ev.clientX>innerWidth-EDGE)side='right';
      }
      if(side){ ghost.classList.remove('hidden');
        const R={max:[0,0,d.w,d.h],left:[0,0,Math.round(d.w/2),d.h],right:[Math.round(d.w/2),0,Math.ceil(d.w/2),d.h],
          tl:[0,0,Math.round(d.w/2),Math.round(d.h/2)],tr:[Math.round(d.w/2),0,Math.ceil(d.w/2),Math.round(d.h/2)],
          bl:[0,Math.round(d.h/2),Math.round(d.w/2),Math.ceil(d.h/2)],br:[Math.round(d.w/2),Math.round(d.h/2),Math.ceil(d.w/2),Math.ceil(d.h/2)]}[side];
        Object.assign(ghost.style,{left:R[0]+'px',top:R[1]+'px',width:R[2]+'px',height:R[3]+'px'});
      } else { ghost.classList.add('hidden'); $('#peekFrame').classList.add('hidden') }
    };
    const up=()=>{
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
      node.classList.remove('dragging'); ghost.classList.add('hidden');
      if(side)win.snap(side);
    };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });

  /* ---- 八向缩放 ---- */
  $$('.rs',node).forEach(h=>h.addEventListener('pointerdown',e=>{
    e.stopPropagation(); win.focus();
    const dir=h.className.split('rs-')[1], sx=e.clientX, sy=e.clientY;
    const r={l:parseFloat(node.style.left),t:parseFloat(node.style.top),w:parseFloat(node.style.width),h:parseFloat(node.style.height)};
    const d=deskSize(); node.classList.add('dragging');
    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      let l=r.l,t=r.t,w=r.w,ht=r.h;
      if(dir.includes('e'))w=clamp(r.w+dx,260,d.w-r.l);
      if(dir.includes('s'))ht=clamp(r.h+dy,150,d.h-r.t);
      if(dir.includes('w')){ w=clamp(r.w-dx,260,r.l+r.w); l=r.l+ (r.w-w); }
      if(dir.includes('n')){ ht=clamp(r.h-dy,150,r.t+r.h); t=r.t+(r.h-ht); }
      node.style.left=l+'px'; node.style.top=t+'px'; node.style.width=w+'px'; node.style.height=ht+'px';
    };
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
      node.classList.remove('dragging'); if(win.onResize)win.onResize(win);
      if(win.editorCb)win.editorCb(); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  }));
  if(win.maximized)win.applyMax();
  refreshTaskbar();
  if(o.render){ try{ const r=o.render(win); if(r&&typeof r.catch==='function')r.catch(e=>{ console.error(e); toast('应用运行出错: '+e.message,'err') }) }
    catch(e){ console.error(e); toast('应用启动失败: '+e.message,'err') } }
  return win;
}

/* ------------------------------- 任务栏 --------------------------------- */
function taskIcon(w){ return `<span class="ti" style="display:inline-flex;width:14px;height:14px;color:inherit">${w.icon}</span>` }
function refreshTaskbar(){
  const list=$('#winList'); list.innerHTML='';
  WM.wins.forEach(w=>{
    const b=el('button','taskitem'+(w.minimized?'':' act'));
    b.innerHTML=taskIcon(w)+'<span>'+esc(w.title)+'</span>';
    b.onclick=()=>{ if(w.minimized||!w.node.classList.contains('focused'))w.focus(); else w.minimize() };
    b.onmouseenter=()=>aeroPeek(w,true); b.onmouseleave=()=>aeroPeek(w,false);
    b.oncontextmenu=e=>{ e.preventDefault(); ctxMenu(e.clientX,e.clientY-8,[
      {label:w.minimized?'还原':'最小化',icon:ICON.layers,action:()=>w.minimized?w.focus():w.minimize()},
      {label:'最大化 / 还原',icon:ICON.max,action:()=>w.toggleMax()},
      {sep:1},{label:'关闭窗口',icon:ICON.close,danger:true,action:()=>w.close()}]); };
    list.appendChild(b);
  });
}
function aeroPeek(w,on){
  const frame=$('#peekFrame'), card=$('#peekCard');
  if(!on||w.minimized){ frame.classList.add('hidden'); card.classList.add('hidden'); return }
  frame.classList.remove('hidden');
  frame.style.left=w.node.style.left; frame.style.top=w.node.style.top;
  frame.style.width=w.node.style.width; frame.style.height=w.node.style.height;
  card.classList.remove('hidden');
  card.style.visibility='hidden'; card.style.display='block';
  card.innerHTML=`<div class="lbl">${esc(w.app||'window')}</div>
    <div class="ci">${taskIcon(w)}<b style="font-weight:500">${esc(w.title)}</b></div>
    <div class="ci" style="color:var(--dim);font-size:11px">${w.maximized?'已最大化':'自由窗口'} · 点击任务栏可切换</div>`;
  const r=card.getBoundingClientRect();
  const tx=parseFloat(w.node.style.left), ty=parseFloat(w.node.style.top);
  card.style.left=clamp(tx,8,innerWidth-r.width-10)+'px';
  card.style.top=Math.max(8,Math.min(innerHeight,ty)-r.height-10)+'px';
  card.style.visibility='visible';
}
/* 桌面 Aero Peek（悬停右端按钮） */

        <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
      <b>CUPRUM OS</b><em>${fs.backendName} · v1.0</em></header>
    <div class="ssearch">${ICON.search}<input id="startSearch" placeholder="搜索应用与文件…"></div>

    <div id="fileHits" style="padding:0 11px 10px"></div>
    <footer>
      <button class="sfbtn" id="sfMount">${ICON.mount}挂载本地文件夹</button>

function renderAppGrid(q){
  const g=$('#appGrid'); if(!g)return; g.innerHTML='';
  APPS.filter(a=>!a.hidden).filter(a=>!q||a.name.toLowerCase().includes(q.toLowerCase())||(a.tags||'').includes(q)).forEach(a=>{
    const b=el('button','appbtn',a.icon+'<span>'+esc(a.name)+'</span>');
    b.title=a.name; b.onclick=()=>{ hideStart(); openApp(a.id) }; g.appendChild(b);
  });
  if(!g.children.length)g.innerHTML='<div style="grid-column:1/-1;color:var(--dim);font-size:12px;padding:10px">没有匹配的应用</div>';
}
async function searchFiles(q){
  const box=$('#fileHits'); if(!box)return;
  if(!q||q.length<2){ box.innerHTML=''; return }
  box.innerHTML='<div class="lbl-m" style="padding:6px 2px 4px">文件匹配</div>';
  const roots=['/Desktop','/Documents','/Pictures','/Downloads','/Projects'];
  for(const r of roots){
    let items=[]; try{ items=await fs.readdir(r,{withMeta:true}) }catch(e){ continue }
    for(const it of items){
      if(!it.name.toLowerCase().includes(q.toLowerCase()))continue;
      const n=el('div','ci'); n.innerHTML=fileIcon(it.name,it.isDir)+'<span>'+esc(r.replace(/^\//,''))+' / '+esc(it.name)+'</span>';
      n.style.cssText='display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;margin-bottom:5px;cursor:pointer;font-size:12px';
      n.querySelector('svg').setAttribute('style','width:14px;height:14px;color:var(--dim)');
      n.onclick=()=>{ hideStart(); openPath(it.path) };
      box.appendChild(n);
    }
  }
}
let startOpen=false;
function showStart(){ const m=$('#startMenu'); if(!m.dataset.built){ buildStartMenu(); m.dataset.built=1 } m.classList.remove('hidden'); startOpen=true; refreshStore(); setTimeout(()=>$('#startSearch')?.focus(),80) }
function hideStart(){ $('#startMenu').classList.add('hidden'); startOpen=false }
function toggleStart(){ startOpen?hideStart():showStart() }
$('#startBtn').onclick=e=>{ e.stopPropagation(); toggleStart() };
document.addEventListener('pointerdown',e=>{ if(startOpen&&!e.target.closest('#startMenu')&&!e.target.closest('#startBtn'))hideStart() },true);
function toggleFullscreen(){
  const d=document;
  if(!d.fullscreenElement)d.documentElement.requestFullscreen?.().catch(()=>toast('浏览器阻止了全屏','warn'));
  else d.exitFullscreen?.();
}
/* ------------------------------- 桌面图标 ------------------------------- */
const CLIP={paths:[],mode:null,dir:'/Desktop'};
const DESK={layout:{},sel:new Set(),items:[],ghost:null};
function gridDims(){
  const cs=getComputedStyle(document.documentElement);
  return {cw:parseFloat(cs.getPropertyValue('--cw'))||96, ch:parseFloat(cs.getPropertyValue('--ch'))||104, pad:14};
}
function layoutKey(p){ return p }
async function loadLayout(){
  let l=null;
  try{ const t=await fs.readText('/System/desktop.json'); if(t)l=JSON.parse(t) }catch(e){}
  if(!l)l=await IDB.get('meta','iconPos');
  if(!l){ try{ l=JSON.parse(localStorage.getItem('cuprum.iconPos')||'null') }catch(e){} }
  DESK.layout=l||{};
}
function saveLayout(){ const j=JSON.stringify(DESK.layout);
  try{ localStorage.setItem('cuprum.iconPos',j) }catch(e){}
  IDB.set('meta','iconPos',DESK.layout);
  if(fs.ready)fs.writeText('/System/desktop.json',j).catch(()=>{}) }
function cellFree(c,r,except){ return !Object.entries(DESK.layout).some(([k,v])=>k!==except&&v&&v.c===c&&v.r===r) }
function nextCell(){ const d=gridDims(); const rows=Math.max(1,Math.floor((deskSize().h-d.pad*2)/d.ch));
  for(let c=0;c<24;c++)for(let r=0;r<rows;r++)if(cellFree(c,r))return {c,r}; return {c:0,r:0} }
function applyPos(node,cell){ const d=gridDims(); node.style.left=(d.pad+cell.c*d.cw)+'px'; node.style.top=(d.pad+cell.r*d.ch)+'px' }
function iconAt(x,y){ return document.elementFromPoint(x,y)?.closest('.icon') }

async function refreshDesktop(){
  const box=$('#icons');
  DESK.items=await fs.readdir('/Desktop',{withMeta:true}).catch(()=>[]);
  const alive=new Set(DESK.items.map(i=>i.path));
  Object.keys(DESK.layout).forEach(k=>{ if(!alive.has(k))delete DESK.layout[k] });
  box.innerHTML='';
  const d=gridDims();
  DESK.items.forEach(it=>{
    const node=el('div','icon'+(DESK.sel.has(it.path)?' sel':''));
    node.dataset.path=it.path; node.dataset.dir=it.isDir?'1':'0';
    node.innerHTML=`<span class="glyph" style="color:${it.isDir?'var(--acc)':'var(--ink)'}">${fileIcon(it.name,it.isDir)}</span>
      <span class="nm">${esc(it.name)}</span>`;
    let cell=DESK.layout[it.path];
    if(!cell||!cellFree(cell.c,cell.r,it.path)){ cell=nextCell(); if(DESK.layout[it.path])DESK.layout[it.path]=cell; else DESK.layout[it.path]=cell }
    applyPos(node,cell);
    node.title=it.name+'\n'+typeName(it.name,it.isDir)+(it.isDir?'':' · '+fmtSize(it.size))+'\n'+fmtDate(it.mtime);
    bindFileDrag(node,()=>DESK.sel.has(it.path)?[...DESK.sel]:[it.path]);
    node.addEventListener('click',e=>{
      e.stopPropagation();
      if(e.ctrlKey||e.metaKey){ DESK.sel.has(it.path)?DESK.sel.delete(it.path):DESK.sel.add(it.path); }
      else { DESK.sel.clear(); DESK.sel.add(it.path) }
      paintSel();
      if(!e.ctrlKey&&!e.metaKey&&(!cfg.doubleClickOpen))openPath(it.path);
    });
    node.addEventListener('dblclick',e=>{ e.stopPropagation(); if(cfg.doubleClickOpen)openPath(it.path) });
    node.addEventListener('contextmenu',e=>{ e.preventDefault(); e.stopPropagation();
      if(!DESK.sel.has(it.path)){ DESK.sel.clear(); DESK.sel.add(it.path); paintSel() }
      showItemMenu(e.clientX,e.clientY,[...DESK.sel],'/Desktop',true) });
    node.addEventListener('dragover',e=>{ if(it.isDir){ e.preventDefault(); node.classList.add('drop-hot'); e.dataTransfer.dropEffect=dtPaths(e.dataTransfer)?'move':'copy' } });
    node.addEventListener('dragleave',()=>node.classList.remove('drop-hot'));
    node.addEventListener('drop',e=>{ if(it.isDir){ e.preventDefault(); e.stopPropagation(); node.classList.remove('drop-hot');
      handleDrop(e.dataTransfer,it.path,e.clientX,e.clientY,true) } });
    /* 触摸拖拽（内部重排） */
    attachTouchDrag(node,it);
    box.appendChild(node);
  });
  if(DESK.items.length>0)saveLayout();
  refreshStore();
}
function paintSel(){ $$('#icons .icon').forEach(n=>n.classList.toggle('sel',DESK.sel.has(n.dataset.path))) }
function attachTouchDrag(node,it){
  let sx=0,sy=0,active=false,lp=null,moved=false;
  node.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return; const t=e.touches[0]; sx=t.clientX; sy=t.clientY; moved=false;
    lp=setTimeout(()=>{ if(!moved){ DESK.sel.clear(); DESK.sel.add(it.path); paintSel(); openPath(it.path) } },520);
  },{passive:true});
  node.addEventListener('touchmove',e=>{
    const t=e.touches[0]; if(Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)>10){ moved=true; clearTimeout(lp); if(!active){
      active=true; DESK.sel.add(it.path); node.style.transition='none'; node.style.zIndex=99; } }
    if(active){ e.preventDefault(); const r=node.parentElement.getBoundingClientRect();
      node.style.left=(t.clientX-r.left-40)+'px'; node.style.top=(t.clientY-r.top-40)+'px';
      $$('#icons .icon').forEach(n=>n.classList.remove('drop-hot'));
      const tg=iconAt(t.clientX,t.clientY); if(tg&&tg!==node&&tg.dataset.dir==='1')tg.classList.add('drop-hot'); }
  },{passive:false});
  node.addEventListener('touchend',e=>{
    clearTimeout(lp);
    if(active){ active=false; node.style.transition=''; node.style.zIndex='';
      const t=e.changedTouches[0]; const tg=iconAt(t.clientX,t.clientY);
      if(tg&&tg!==node&&tg.dataset.dir==='1'){ const dst=tg.dataset.path; $$('#icons .icon').forEach(n=>n.classList.remove('drop-hot'));
        fs.moveInto([it.path],dst).then(()=>{ DESK.sel.clear(); refreshDesktop(); toast('已移动到 '+PATH.base(dst),'ok') });
      } else { snapNodeToCell(node,it,t.clientX,t.clientY); saveLayout() }
    }
  });
}
function snapNodeToCell(node,it,x,y){

/* 桌面空白区：框选 + 右键 + 放置 */
(function desktopInteractions(){
  const dt=$('#desktop'), mq=$('#marquee');
  dt.addEventListener('pointerdown',e=>{
    if(e.target.closest('.icon'))return;
    if(e.pointerType!=='mouse'){ DESK.sel.clear(); paintSel(); return }
    const x=e.clientX,y=e.clientY; let moved=false;
    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-x,ev.clientY-y)<5)return; moved=true;
      mq.classList.remove('hidden');
      const l=Math.min(x,ev.clientX),t=Math.min(y,ev.clientY),w=Math.abs(ev.clientX-x),h=Math.abs(ev.clientY-y);
      Object.assign(mq.style,{left:l+'px',top:t+'px',width:w+'px',height:h+'px'});
      if(!ev.ctrlKey&&!ev.metaKey)DESK.sel.clear();
      $$('#icons .icon').forEach(n=>{ const r=n.getBoundingClientRect();
        if(r.left<l+w&&r.right>l&&r.top<t+h&&r.bottom>t)DESK.sel.add(n.dataset.path) });
      paintSel();
    };
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); mq.classList.add('hidden') };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });

    if(e.target.closest('.icon'))return; e.preventDefault(); DESK.sel.clear(); paintSel();

  });
  dt.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect=dtPaths(e.dataTransfer)?'move':'copy' });
  dt.addEventListener('drop',async e=>{
    if(e.target.closest('.icon'))return;

  });
})();
async function handleDrop(dt,destDir,x,y,intoFolder){
  const paths=dtPaths(dt);
  if(paths&&paths.length){
    /* 内部移动：若是拖到桌面空白 → 重排坐标；否则移动文件 */
    const fromDesktop=paths.every(p=>PATH.dir(p)==='/Desktop');
    if(fromDesktop&&!intoFolder&&PATH.norm(destDir)==='/Desktop'&&x!=null){
      const d=gridDims(), box=$('#icons').getBoundingClientRect();
      const tc=Math.max(0,Math.round((x-box.left-d.pad-d.cw/2)/d.cw)), tr=Math.max(0,Math.round((y-box.top-d.pad-d.ch/2)/d.ch));
      const anchor=DESK.layout[paths[0]]||{c:0,r:0}; const dc=tc-anchor.c, dr=tr-anchor.r;
      paths.forEach(p=>{ const c0=DESK.layout[p]; if(c0){ DESK.layout[p]={c:Math.max(0,c0.c+dc),r:Math.max(0,c0.r+dr)} } });
      saveLayout(); refreshDesktop(); toast('图标位置已更新');
    } else {
      await fs.moveInto(paths,PATH.norm(destDir));
      DESK.sel.clear(); await refreshDesktop();
      refreshExplorers(PATH.norm(destDir)); refreshExplorers(PATH.dir(paths[0]));
      toast('已移动 '+paths.length+' 项到 '+destDir,'ok');
    }
    return;
  }
  if(!dt)return;
  const t=toast('正在导入…','info',60000);
  try{ const n=await importDataTransfer(dt,PATH.norm(destDir),()=>{});
    t.remove(); toast(n?('已导入 '+n+' 个文件到 '+destDir):'没有可导入的文件',n?'ok':'warn');
    await refreshDesktop(); refreshExplorers(PATH.norm(destDir));
  }catch(err){ t.remove(); toast('导入失败: '+err.message,'err'); console.error(err) }
}
async function newFolder(dir,base='新建文件夹'){ const p=await fs.uniquePath(dir,base); await fs.mkdir(p); await refreshDesktop(); refreshExplorers(dir); return p }
async function newFile(dir,name='新建文本文档.txt'){ const p=await fs.uniquePath(dir,name); await fs.writeText(p,''); await refreshDesktop(); refreshExplorers(dir); return p }

    {label:'粘贴',icon:ICON.paste,disabled:!CLIP.paths.length,action:()=>doPaste(dir)},
    {label:'重命名',icon:ICON.rename,disabled:!one,action:async()=>{ const v=await askText('重命名',name); if(v&&v!==name){ const np=await fs.uniquePath(dir,v); await fs.rename(one,np); await refreshDesktop(); refreshExplorers(dir) } }},
    {label:'导出 / 下载',icon:ICON.download,disabled:!!isDir,action:()=>exportPath(one)},

    {sep:1},

      if(!ok)return; for(const p of paths){ try{ await fs.remove(p) }catch(e){ toast('删除失败: '+PATH.base(p),'err') } }
      DESK.sel.clear(); await refreshDesktop(); refreshExplorers(dir); CLIP.paths=CLIP.paths.filter(p=>!paths.includes(p)); toast('已删除','ok') }},
  ];
  if(isDir)items.splice(2,0,{label:'在新窗口中打开',icon:ICON.folderOpen,action:()=>openApp('files',{path:one})});

async function doPaste(dir){
  if(!CLIP.paths.length)return;
  const t=toast((CLIP.mode==='cut'?'正在移动…':'正在复制…'),'info',60000);
  try{
    if(CLIP.mode==='cut'){ await fs.moveInto(CLIP.paths,dir); CLIP.paths=[]; CLIP.mode=null }
    else { for(const p of CLIP.paths){ const dst=await fs.uniquePath(dir,PATH.base(p)); await fs.copy(p,dst) } }
    t.remove(); toast('完成','ok'); await refreshDesktop(); refreshExplorers(dir);
  }catch(e){ t.remove(); toast('粘贴失败: '+e.message,'err') }
}
async function zipPaths(paths){
  if(!window.JSZip){ toast('JSZip 未加载，无法压缩','err'); return }
  const t=toast('正在压缩…','info',60000);
  try{ const z=new JSZip();
    const add=async(p,rel)=>{ const st=await fs.stat(p);
      if(st.isDir){ const kids=await fs.readdir(p); for(const k of kids)await add(k.path,rel+'/'+k.name) }
      else { const f=await fs.readFile(p); z.file(rel,await f.arrayBuffer()) } };
    for(const p of paths){ const st=await fs.stat(p); await add(p,(paths.length>1||st.isDir?PATH.base(p):PATH.base(p))) }
    const blob=await z.generateAsync({type:'blob',compression:'DEFLATE'});
    const nm=(paths.length===1?PATH.base(paths[0]):'归档')+'.zip';
    const dst=await fs.uniquePath('/Desktop',nm); await fs.writeFile(dst,blob);
    t.remove(); toast('已生成 '+nm,'ok'); refreshDesktop();
  }catch(e){ t.remove(); toast('压缩失败: '+e.message,'err') }
}
async function unzipPath(path,dir){
  const t=toast('正在解压 '+PATH.base(path)+'…','info',60000);
  try{ const base=PATH.base(path).replace(/\.[^.]+$/,'');
    const dest=await fs.uniquePath(dir,base); await fs.mkdir(dest);
    const r=await extractArchiveTo(path,dest,(n,tot)=>{ t.querySelector('div').textContent='解压中 '+n+'/'+tot });
    t.remove(); toast('已解压 '+r.count+' 个文件 → '+dest,'ok'); await refreshDesktop(); refreshExplorers(dir);
  }catch(e){ t.remove(); toast('解压失败: '+e.message,'err'); console.error(e) }
}
/* 本地文件夹挂载 */
async function mountLocalFolder(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持 File System Access API（请使用 Chrome / Edge）','err'); return }
  try{
    const h=await showDirectoryPicker({mode:'readwrite',id:'cuprum-mount'});
    let point=PATH.join('/mnt/local',h.name), i=1;
    while(fs.mountPoints().some(m=>m.point===point))point=PATH.join('/mnt/local',h.name+'-'+(++i));
    await fs.mountLocal(point,h,h.name);
    const ms=await IDB.get('meta','mounts')||[]; if(!ms.includes(h.name)){ ms.push(h.name); await IDB.set('meta','mounts',ms) }
    cookie.set('cuprum_mounts',JSON.stringify(ms.slice(-8)));
    toast('已挂载 '+h.name+' → '+point,'ok');
    await refreshDesktop(); refreshExplorers(); refreshStore();
    return point;
  }catch(e){ if(e.name!=='AbortError')toast('挂载失败: '+e.message,'err') }
}

async function openWriteTextDialog(path){ const t=await fs.readText(path).catch(()=>null); if(t==null)return; openApp('notepad',{path}) }
/** 统一打开分派：先 stat 判断目录/文件，再按类型路由（虚拟与挂载路径一致） */
async function openPath(path,forceApp){
  path=PATH.norm(path);
  let st; try{ st=await fs.stat(path) }catch(e){ toast('无法访问: '+path,'err'); return }
  if(st.isDir){ return openApp('files',{path}) }
  const name=PATH.base(path);
  if(forceApp)return openApp(forceApp,{path});
  if(isSvg(name)||isHtml(name))return openApp('browser',{path});
  if(isImg(name))return openApp('manga',{path});
  if(isAudio(name)||isVideo(name))return openApp('media',{path});
  if(isPdf(name))return openApp('pdf',{path});
  if(isTable(name))return openApp('sheet',{path});
  if(/\.(iso|img|bin|fda|vfd)$/i.test(name))return openApp('vm',{path});
  if(isZip(name)){ const c=await modal({title:'压缩包',desc:name+' — 选择操作',ok:'解压到当前目录',cancel:'仅查看',danger:false});
    return c?unzipPath(path,PATH.dir(path)):openWriteTextDialog(path) }
  if(/\.(css|scss|less|js|mjs|ts|jsx|tsx|json|jsonc|xml|yaml|yml|toml|md|markdown|vue|svelte|py|rb|go|rs|c|cpp|h|sh|sql|ini|conf)$/i.test(name))

function notepadApp(a={}){
  const path=a.path?PATH.norm(a.path):null;
  const win=openWindow({app:'notepad',key:path||('untitled'+Date.now()),reuse:!!path,title:'记事本 — '+(path?PATH.base(path):'未命名'),icon:ICON.notepad,w:720,h:520,

        <button class="btn sm" data-a="redo">${ICON.fwd}重做</button>

        <div class="sp"></div>
        <button class="btn ic sm" data-a="f-">A−</button><button class="btn ic sm" data-a="f+">A+</button>
