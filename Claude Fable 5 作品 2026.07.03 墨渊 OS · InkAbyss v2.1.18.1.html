/* ================================================================
   § 9. 表格（CSV / TSV 双视图）
================================================================ */
function parseCSV(text, sep){
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; }
      else cell+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===sep){ row.push(cell); cell=''; }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(ch!=='\r') cell+=ch;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function openTable(path){
  let text='';
  if(path){ try{ text = await fs.readText(path); }catch(e){ toast('读取失败',true); return; } }
  let curPath = path;
  const sep = path && P.ext(path)==='tsv' ? '\t' : ',';
  const w = createWindow({title:'表格 — '+(path?P.base(path):'未命名.csv'), icon:IC.table, width:780, height:520});

    <div class="tbar">

      <span class="tsep"></span>
      <button class="tbtn acc tb-save">${IC.save}<span>保存</span></button>
      <button class="tbtn tb-dl">${IC.download}<span>下载</span></button>
      <span style="flex:1"></span>
      <span class="tb-info" style="font-size:11px;color:var(--faint);font-family:var(--mono)"></span>
    </div>
    <div class="tbl-view" style="display:block"></div>
    <textarea class="tbl-text" style="display:none" spellcheck="false"></textarea>`;
  const gv = w.body.querySelector('.tbl-view'), tv = w.body.querySelector('.tbl-text');
  const bg = w.body.querySelector('.tb-grid'), bt = w.body.querySelector('.tb-text');
  tv.value = text;
  const renderGrid = ()=>{
    const rows = parseCSV(tv.value, sep);
    w.body.querySelector('.tb-info').textContent = `${rows.length} 行 × ${Math.max(0,...rows.map(r=>r.length),0)} 列`;
    if(!rows.length){ gv.innerHTML='<div class="ex-empty">空表格 — 切换到文本视图输入数据</div>'; return; }
    let h = '<table><thead><tr>'+rows[0].map(c=>`<th>${escapeHtml(c)}</th>`).join('')+'</tr></thead><tbody>';
    for(let i=1;i<rows.length;i++) h += '<tr>'+rows[i].map(c=>`<td>${escapeHtml(c)}</td>`).join('')+'</tr>';
    gv.innerHTML = h+'</tbody></table>';
  };
  renderGrid();
  bg.onclick = ()=>{ renderGrid(); gv.style.display='block'; tv.style.display='none'; bg.classList.add('on'); bt.classList.remove('on'); };
  bt.onclick = ()=>{ gv.style.display='none'; tv.style.display='block'; bt.classList.add('on'); bg.classList.remove('on'); tv.focus(); };
  const save = async ()=>{
    if(!curPath){
      const n = await uiPrompt('保存到桌面','数据.csv'); if(!n) return;
      curPath = await fs.uniquePath(DESK, n);
    }
    await fs.writeText(curPath, tv.value);
    w.setTitle('表格 — '+P.base(curPath));
    toast('已保存');
    refreshDesktop(); refreshExplorers();
  };
  w.body.querySelector('.tb-save').onclick = save;
  w.body.querySelector('.tb-dl').onclick = ()=>downloadBlob(new Blob([tv.value],{type:'text/csv;charset=utf-8'}), curPath?P.base(curPath):'数据.csv');
  tv.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); save(); } });
}

   § 10. 漫画阅读器（图片查看）
================================================================ */
const IMG_RE = /\.(jpg|jpeg|png|webp|gif|svg|bmp|avif)$/i;
async function openManga(clickedPath){
  const dir = P.parent(clickedPath);
  let list;
  try{ list = await fs.readdir(dir); }
  catch(e){ await uiDialog({title:'错误', msg:'目录读取失败：'+escapeHtml(e.message), cancelText:null}); return; }
  const imgs = list.filter(x=>x.kind==='file' && IMG_RE.test(x.name))
    .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));  // 自然排序 1<2<10
  if(!imgs.length){ toast('该目录没有可识别的图片', true); return; }

  const w = createWindow({title:'漫画阅读器 — '+P.base(dir)+` (${imgs.length} 页)`, icon:IC.manga, width:860, height:640, type:'manga'});
  w.body.innerHTML = `
    <div class="tbar">
      <button class="tbtn mg-zi">${IC.zoomin}<span>放大</span></button>
      <button class="tbtn mg-zo">${IC.zoomout}<span>缩小</span></button>
      <span class="tsep"></span>
      <button class="tbtn acc mg-fs">${IC.fullscr}<span>全屏沉浸</span></button>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--faint);font-family:var(--mono)">${imgs.length} 页 · 滚轮连续阅读</span>
    </div>
    <div class="manga-strip"><div class="manga-load">正在加载 ${imgs.length} 张图片…</div></div>
    <button class="manga-exit" title="退出全屏">×</button>`;
  const strip = w.body.querySelector('.manga-strip');
  let maxW = 1000;
  const urls = [];
  w.onClose = ()=>urls.forEach(u=>URL.revokeObjectURL(u));

  /* 并行读取，按序插入 */
  const blobs = await Promise.all(imgs.map(it=>
    fs.readFileBlob(P.join(dir, it.name)).catch(()=>null)   // 单张失败不中断
  ));
  strip.innerHTML='';
  let target = null;
  blobs.forEach((blob, i)=>{
    if(!blob) return;   // 跳过失败项
    const url = URL.createObjectURL(new Blob([blob], {type: mimeOf(imgs[i].name)}));
    urls.push(url);
    const img = new Image();
    img.src = url;
    img.style.maxWidth = maxW+'px';
    strip.appendChild(img);
    if(P.join(dir, imgs[i].name) === P.norm(clickedPath)) target = img;
  });
  if(!strip.children.length) strip.innerHTML = '<div class="manga-load">所有图片读取失败</div>';
  if(target) requestAnimationFrame(()=>target.scrollIntoView({block:'start'}));   // 定位到点击的那页

  const setZoom = d=>{
    maxW = clamp(maxW + d, 300, 3000);
    $$('img', strip).forEach(i=>i.style.maxWidth = maxW+'px');
  };
  w.body.querySelector('.mg-zi').onclick = ()=>setZoom(200);
  w.body.querySelector('.mg-zo').onclick = ()=>setZoom(-200);
  strip.addEventListener('wheel', e=>{ if(e.ctrlKey){ e.preventDefault(); setZoom(e.deltaY<0?150:-150); } }, {passive:false});

  /* 全屏沉浸：原生 Fullscreen API + 隐藏标题栏 + 右上角隐蔽退出按钮 */
  const enterFS = ()=>{
    w.el.requestFullscreen && w.el.requestFullscreen().catch(()=>{});
    w.el.classList.add('manga-full');
  };
  const exitFS = ()=>{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    w.el.classList.remove('manga-full');
  };
  w.body.querySelector('.mg-fs').onclick = enterFS;
  w.body.querySelector('.manga-exit').onclick = exitFS;
  document.addEventListener('fullscreenchange', function fc(){
    if(!windows.has(w.id)){ document.removeEventListener('fullscreenchange', fc); return; }
    if(!document.fullscreenElement) w.el.classList.remove('manga-full');
  });
}

const BR_HOME = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0a1118,#0c141f);font-family:sans-serif;color:#8494a8}

function openBrowser(initialUrl, initialTitle){
  const w = createWindow({title:'网页浏览器', icon:IC.browser, width:900, height:600});
  w.body.innerHTML = `
    <div class="tbar">
      <button class="tbtn br-back">${IC.back}</button>
      <button class="tbtn br-fwd">${IC.fwd}</button>
      <button class="tbtn br-re">${IC.refresh}</button>
      <button class="tbtn br-home">${IC.home}</button>
      <input class="tinput br-addr" style="flex:1;min-width:100px" placeholder="输入网址，回车访问…" spellcheck="false">
      <button class="tbtn acc br-go">${IC.fwd}<span>前往</span></button>
    </div>
    <iframe class="br-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads"></iframe>`;
  const fr = w.body.querySelector('.br-frame'), addr = w.body.querySelector('.br-addr');
  const hist=[]; let hi=-1;
  const load = (src, push=true, label)=>{
    if(push){ hist.splice(hi+1); hist.push({src, label}); hi=hist.length-1; }
    if(src.startsWith('srcdoc:')){ fr.srcdoc = src.slice(7); addr.value = label||''; }
    else{ fr.removeAttribute('srcdoc'); fr.src = src; addr.value = label||src; }
    w.setTitle('浏览器 — '+(label|| src.replace(/^https?:\/\//,'').slice(0,40) || '主页'));
  };
  const go = ()=>{
    let v = addr.value.trim();
    if(!v) return;
    if(!/^(https?|blob|data):/.test(v)) v = 'https://'+v;
    load(v);
  };
  addr.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  addr.addEventListener('pointerdown', e=>e.stopPropagation());
  w.body.querySelector('.br-go').onclick = go;
  w.body.querySelector('.br-re').onclick = ()=>{ if(hi>=0) load(hist[hi].src, false, hist[hi].label); };
  w.body.querySelector('.br-home').onclick = ()=>load('srcdoc:'+BR_HOME, true, '');
  w.body.querySelector('.br-back').onclick = ()=>{ if(hi>0){ hi--; load(hist[hi].src, false, hist[hi].label); } };
  w.body.querySelector('.br-fwd').onclick = ()=>{ if(hi<hist.length-1){ hi++; load(hist[hi].src, false, hist[hi].label); } };
  if(initialUrl) load(initialUrl, true, initialTitle);
  else load('srcdoc:'+BR_HOME, true, '');
  return w;
}

  const w = createWindow({title:'计算器', icon:IC.calc, width:320, height:460});
  w.body.innerHTML = `
    <div class="calc-wrap">
      <div class="calc-disp"><div class="calc-expr"></div><div class="calc-res">0</div></div>
      <div class="calc-grid">
        <button class="calc-k fn" data-k="C">C</button><button class="calc-k fn" data-k="(">(</button><button class="calc-k fn" data-k=")">)</button><button class="calc-k op" data-k="/">÷</button>
        <button class="calc-k" data-k="7">7</button><button class="calc-k" data-k="8">8</button><button class="calc-k" data-k="9">9</button><button class="calc-k op" data-k="*">×</button>
        <button class="calc-k" data-k="4">4</button><button class="calc-k" data-k="5">5</button><button class="calc-k" data-k="6">6</button><button class="calc-k op" data-k="-">−</button>
        <button class="calc-k" data-k="1">1</button><button class="calc-k" data-k="2">2</button><button class="calc-k" data-k="3">3</button><button class="calc-k op" data-k="+">+</button>
        <button class="calc-k fn" data-k="B">⌫</button><button class="calc-k" data-k="0">0</button><button class="calc-k" data-k=".">.</button><button class="calc-k eq" data-k="=" style="grid-row:auto">=</button>
      </div>
    </div>`;
  let expr='';
  const exEl = w.body.querySelector('.calc-expr'), resEl = w.body.querySelector('.calc-res');
  const evalSafe = s=>{
    if(!/^[\d+\-*/().\s%]*$/.test(s)) return NaN;
    try{ const v = Function('"use strict";return('+s+')')(); return typeof v==='number' && isFinite(v)? v : NaN; }catch(e){ return NaN; }
  };
  const upd = ()=>{
    exEl.textContent = expr||' ';
    const v = evalSafe(expr);
    resEl.textContent = expr===''? '0' : (isNaN(v)? '…' : String(Math.round(v*1e10)/1e10));
  };
  const press = k=>{
    if(k==='C') expr='';
    else if(k==='B') expr=expr.slice(0,-1);
    else if(k==='='){ const v=evalSafe(expr); if(!isNaN(v)) expr=String(Math.round(v*1e10)/1e10); }
    else expr+=k;
    upd();
  };
  $$('.calc-k', w.body).forEach(b=>b.onclick=()=>press(b.dataset.k));
  w.el.tabIndex = 0;
  w.el.addEventListener('keydown', e=>{
    if(/^[0-9+\-*/().%]$/.test(e.key)) press(e.key);
    else if(e.key==='Enter'||e.key==='=') press('=');
    else if(e.key==='Backspace') press('B');
    else if(e.key==='Escape') press('C');
  });
}

    const r = wrap.getBoundingClientRect();

    cv.style.width = cv.width*s+'px'; cv.style.height = cv.height*s+'px';

  };

  let color='#e8b04b', size=5, eraser=false, drawing=false, last=null;
  const pos = e=>{
    const r = cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height};
  };
  cv.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); });

    ctx.lineWidth = size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();

}

  };
  modeSel.onchange = ()=>setMode(modeSel.value);

    else if(mode==='application/json'){

      try{ out = '<pre style="color:#7ec97e">'+escapeHtml(JSON.stringify(JSON.parse(src||'null'), null, 2))+'</pre><div style="color:#7ec97e;font-family:monospace">JSON 合法 ✓</div>'; }
      catch(e){ out = '<div style="color:#e0566b;font-family:monospace">JSON 解析错误: '+escapeHtml(e.message)+'</div>'; }
      src = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{background:#111;padding:14px;font-size:12px}pre{font-family:monospace}</style></head><body>${out}</body></html>`;

    }catch(e){
      /* 回退 Blob URL */
      const u = URL.createObjectURL(new Blob([src],{type:'text/html'}));
      iframe.src = u;
      setTimeout(()=>URL.revokeObjectURL(u), 10000);
    }
  };
  let pvTimer=null;
  const schedulePreview = ()=>{ clearTimeout(pvTimer); pvTimer=setTimeout(refreshPreview, 600); };

  /* —— 状态栏 —— */
  const updStatus = ()=>{
    const v = getVal();
    q('.st-chars').textContent = v.length+' 字符';
    q('.st-lines').textContent = (cm? cm.lineCount() : v.split('\n').length)+' 行';
    if(cm){
      const c = cm.getCursor();
      q('.st-pos').textContent = `行 ${c.line+1}, 列 ${c.ch+1}`;
      const sel = cm.getSelection();
      q('.st-sel').textContent = sel? `已选 ${sel.length} 字符` : '';
    }
  };
  if(cm){
    cm.on('change', ()=>{ updStatus(); schedulePreview(); if(findState.open) doFind(false); });
    cm.on('cursorActivity', updStatus);
  }else{
    ta.addEventListener('input', ()=>{ updStatus(); schedulePreview(); });
  }
  updStatus();

  /* —— 查找 / 替换 —— */
  const findBar = q('.ed-find');
  const findState = {open:false, marks:[], matches:[], cur:-1, cs:false, ww:false, re:false};
  const clearMarks = ()=>{ findState.marks.forEach(m=>m.clear()); findState.marks=[]; };
  function buildRegex(){
    let src = q('.f-q').value;
    if(!src) return null;
    if(!findState.re) src = src.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if(findState.ww) src = '\\b'+src+'\\b';
    try{ return new RegExp(src, findState.cs?'g':'gi'); }catch(e){ return 'bad'; }
  }
  function doFind(jump=true, dir=1){
    if(!cm) return;
    clearMarks();
    findState.matches=[];
    const re = buildRegex();
    const cnt = q('.ed-find .cnt');
    if(re==null){ cnt.textContent='0/0'; return; }
    if(re==='bad'){ cnt.textContent='无效正则'; return; }
    const text = cm.getValue();
    let m, guard=0;
    while((m = re.exec(text)) && guard++<20000){
      if(m[0]==='') { re.lastIndex++; continue; }
      findState.matches.push({from:m.index, to:m.index+m[0].length});
    }
    if(!findState.matches.length){ cnt.textContent='0/0'; findState.cur=-1; return; }
    if(jump){
      const curIdx = cm.indexFromPos(cm.getCursor());
      findState.cur = dir>0
        ? findState.matches.findIndex(x=>x.from>=curIdx)
        : (()=>{ let i=-1; findState.matches.forEach((x,k)=>{ if(x.to<curIdx) i=k; }); return i; })();
      if(findState.cur<0) findState.cur = dir>0? 0 : findState.matches.length-1;
    }else if(findState.cur>=findState.matches.length) findState.cur = 0;
    paintMatches();
  }
  function paintMatches(){
    clearMarks();
    const cnt = q('.ed-find .cnt');
    findState.matches.forEach((x,i)=>{
      const from = cm.posFromIndex(x.from), to = cm.posFromIndex(x.to);
      findState.marks.push(cm.markText(from, to, {className: i===findState.cur?'cm-matchhighlight-cur':'cm-matchhighlight-other'}));
    });
    cnt.textContent = `${findState.cur+1}/${findState.matches.length}`;
    if(findState.cur>=0){
      const x = findState.matches[findState.cur];
      cm.scrollIntoView({from:cm.posFromIndex(x.from), to:cm.posFromIndex(x.to)}, 60);
    }
  }
  function findStep(dir){
    if(!findState.matches.length){ doFind(true, dir); return; }
    findState.cur = (findState.cur + dir + findState.matches.length) % findState.matches.length;
    paintMatches();
  }
  function openFind(focusReplace){
    findState.open = true;
    findBar.classList.add('show');
    if(cm && cm.getSelection() && !q('.f-q').value) q('.f-q').value = cm.getSelection();
    doFind(true);
    (focusReplace? q('.f-r') : q('.f-q')).focus();
  }
  function closeFind(){
    findState.open=false;
    findBar.classList.remove('show');
    clearMarks();
    cm && cm.focus();
  }
  q('.ed-findbtn').onclick = ()=>openFind(false);
  q('.f-close').onclick = closeFind;
  q('.f-q').addEventListener('input', ()=>doFind(true));
  ['cs','ww','re'].forEach(k=>{
    q('.f-'+k).onclick = function(){ findState[k]=!findState[k]; this.classList.toggle('on', findState[k]); doFind(true); };
  });
  q('.f-prev').onclick = ()=>findStep(-1);
  q('.f-next').onclick = ()=>findStep(1);
  q('.f-q').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); findStep(e.shiftKey?-1:1); }
    if(e.key==='Escape') closeFind();
  });
  q('.f-r').addEventListener('keydown', e=>{ if(e.key==='Escape') closeFind(); if(e.key==='Enter'){ e.preventDefault(); q('.f-rep').click(); } });
  q('.f-rep').onclick = ()=>{
    if(!cm || findState.cur<0 || !findState.matches.length) return;
    const x = findState.matches[findState.cur];
    cm.replaceRange(q('.f-r').value, cm.posFromIndex(x.from), cm.posFromIndex(x.to));
    doFind(false);
    if(findState.matches.length) paintMatches();
  };
  q('.f-repall').onclick = ()=>{
    if(!cm) return;
    const re = buildRegex();
    if(!re || re==='bad') return;
    const r = q('.f-r').value;
    const n = findState.matches.length;
    cm.setValue(cm.getValue().replace(re, findState.re? r : ()=>r));
    toast(`已替换 ${n} 处`);
    doFind(false);
  };

  /* —— 工具栏动作 —— */
  q('.ed-run').onclick = refreshPreview;
  q('.ed-rf').onclick = refreshPreview;
  q('.ed-undo').onclick = ()=>cm? cm.undo() : document.execCommand('undo');
  q('.ed-redo').onclick = ()=>cm? cm.redo() : document.execCommand('redo');
  q('.ed-foldall').onclick = ()=>{ if(cm) for(let i=cm.lineCount()-1;i>=0;i--) cm.foldCode(CodeMirror.Pos(i,0), null, 'fold'); };
  q('.ed-unfoldall').onclick = ()=>{ if(cm) for(let i=0;i<cm.lineCount();i++) cm.foldCode(CodeMirror.Pos(i,0), null, 'unfold'); };
  q('.ed-fmt').onclick = ()=>{
    const v = getVal();
    let out = v;
    const opts = {indent_size:2, preserve_newlines:true, max_preserve_newlines:2, end_with_newline:true};
    try{
      if(mode==='htmlmixed'||mode==='xml'){ if(window.html_beautify) out = html_beautify(v, {...opts, indent_inner_html:true, wrap_line_length:120}); }
      else if(mode==='css'){ if(window.css_beautify) out = css_beautify(v, opts); }
      else if(mode==='javascript'||mode==='application/json'){ if(window.js_beautify) out = js_beautify(v, opts); }
      else{ toast('当前语言不支持格式化'); return; }
    }catch(e){ toast('格式化失败: '+e.message, true); return; }
    if(out!==v){
      if(cm){ const c = cm.getCursor(); cm.setValue(out); cm.setCursor(c); }  // 保持光标
      else ta.value = out;
      toast('格式化完成');
    }
  };
  q('.ed-clear').onclick = ()=>setVal('');
  q('.ed-newtab').onclick = ()=>{
    const u = URL.createObjectURL(new Blob([getVal()],{type:'text/html'}));
    open(u, '_blank');
    setTimeout(()=>URL.revokeObjectURL(u), 30000);
  };
  q('.ed-inbr').onclick = ()=>{
    const u = URL.createObjectURL(new Blob([getVal()],{type:'text/html'}));
    openBrowser(u, curPath? P.base(curPath) : '编辑器预览');
  };
  q('.ed-imp').onclick = ()=>{
    const inp = $('#ed-import');
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      setVal(await f.text());
      const m = MODE_BY_EXT[P.ext(f.name)];
      if(m) setMode(m);
      w.setTitle('HTML编辑器 — '+f.name);
      inp.value='';
      refreshPreview();
    };
    inp.click();
  };
  q('.ed-exp').onclick = ()=>{
    const ext = MODE_EXT[mode]||'.txt';
    const name = curPath? P.base(curPath) : '文档'+ext;
    downloadBlob(new Blob([getVal()],{type:mimeOf(name)+';charset=utf-8'}), name);
  };
  const doSave = async ()=>{
    if(!curPath){
      const n = await uiPrompt('保存到 '+saveDir, '页面'+(MODE_EXT[mode]||'.html')); if(!n) return;
      curPath = await fs.uniquePath(saveDir, n);
    }
    try{
      await fs.writeText(curPath, getVal());
      w.setTitle('HTML编辑器 — '+P.base(curPath));
      toast('已保存: '+P.base(curPath));
      refreshDesktop(); refreshExplorers(P.parent(curPath));  // 刷新桌面 + 相关目录窗口
    }catch(e){ toast('保存失败: '+e.message, true); }
  };
  q('.ed-save').onclick = doSave;

  /* 快捷键 */
  w.el.addEventListener('keydown', e=>{
    const c = e.ctrlKey||e.metaKey;
    if(c && e.key==='s'){ e.preventDefault(); doSave(); }
    else if(c && e.key==='Enter'){ e.preventDefault(); refreshPreview(); }
    else if(c && e.shiftKey && (e.key==='F'||e.key==='f')){ e.preventDefault(); q('.ed-fmt').click(); }
    else if(c && !e.shiftKey && e.key==='f'){ e.preventDefault(); openFind(false); }
    else if(c && e.key==='h'){ e.preventDefault(); openFind(true); }
    else if(c && e.key==='y'){ e.preventDefault(); cm&&cm.redo(); }
    else if(e.key==='F3'){ e.preventDefault(); findStep(1); }
    else if(e.key==='Escape' && findState.open){ closeFind(); }
  }, true);

  /* —— 可拖拽分割条 —— */
  const gb = q('.ed-gutterbar'), left = q('.ed-left'), split = q('.ed-split');
  gb.addEventListener('pointerdown', e=>{
    e.preventDefault();
    const vertical = !isMobile();
    const mv = ev=>{
      const r = split.getBoundingClientRect();
      if(vertical){
        const px = clamp(ev.clientX - r.left, 200, r.width - 120 - 6);   // 编辑区≥200 预览区≥120
        left.style.width = px+'px'; left.style.flex='none';
      }else{
        const py = clamp(ev.clientY - r.top, 120, r.height - 100 - 6);
        left.style.height = py+'px'; left.style.flex='none';
      }
    };
    const up = ()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); cm && cm.refresh(); };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
  });
  w.onResize = ()=>cm && cm.refresh();

  /* 生命周期：关闭释放实例 */
  w.onClose = ()=>{ try{ cm && cm.toTextArea(); }catch(e){} clearTimeout(pvTimer); };

  setTimeout(()=>{ cm && cm.refresh(); refreshPreview(); }, 60);
}

const STOR_COLORS = ['#e8b04b','#57d6c2','#e0566b','#7ec97e','#6db4e8','#c79bf2','#e08b9d','#b5842f'];
async function openSettings(){
  const w = createWindow({title:'设置', icon:IC.settings, width:720, height:560});
  w.body.innerHTML = `<div class="set-wrap">
    <div class="set-sec"><h3>存储空间</h3>
      <div class="st-est" style="font-size:13px;color:var(--dim)">正在统计…</div>
      <div class="stor-bar st-bar"></div>
      <div class="stor-legend st-legend"></div>
      <div style="margin-top:10px;font-size:11.5px;color:var(--faint)" class="st-mode"></div>
    </div>
    <div class="set-sec"><h3>壁纸</h3>
      <div class="wp-thumbs st-wp"></div>
      <button class="btn st-wpup" style="margin-top:12px">上传自定义壁纸</button>
    </div>

      <div class="msg" style="font-size:12.5px;color:var(--dim);line-height:1.8;margin-bottom:12px">
        一键重置将清空 OPFS 虚拟文件系统、图标布局与全部设置，恢复出厂状态。</div>
      <button class="btn danger st-reset">一键重置系统</button>
    </div>
    <div class="set-sec"><h3>关于</h3>
      <div style="font-size:12.5px;color:var(--dim);line-height:2">
        <span style="font-family:var(--disp);font-size:18px;color:var(--acc);letter-spacing:.14em">墨渊 OS</span> · 单文件 Web 桌面系统<br>
        存储引擎：OPFS（Origin Private File System）+ IndexedDB 降级 + localStorage/Cookie 设置持久化<br>
        内置：文件管理 · HTML 编辑器 (CodeMirror) · 漫画阅读 · v86 虚拟机 · Zip/Gzip/Tar/7z 解压
      </div>
    </div>
  </div>`;
  const q = s=>w.body.querySelector(s);

  /* 存储占用可视化 */
  (async ()=>{
    let quota=0, usage=0;
    try{ const e = await navigator.storage.estimate(); quota=e.quota||0; usage=e.usage||0; }catch(e){}
    const tops = [];
    try{
      for(const it of await fs.readdir('/')){
        if(it.mounted) continue;
        const size = await fs.du('/'+it.name);
        if(size>0) tops.push({name:it.name, size});
      }
    }catch(e){}
    tops.sort((a,b)=>b.size-a.size);
    const total = tops.reduce((s,x)=>s+x.size, 0);
    if(!windows.has(w.id)) return;
    q('.st-est').innerHTML = quota
      ? `已用 <b style="color:var(--acc)">${fmtSize(usage)}</b> / 可用配额 <b>${fmtSize(quota)}</b>（占 ${(usage/quota*100).toFixed(2)}%）· 文件数据 ${fmtSize(total)}`
      : `文件数据总计 ${fmtSize(total)}`;
    const bar = q('.st-bar'), leg = q('.st-legend');
    bar.innerHTML=''; leg.innerHTML='';
    if(!total){ bar.innerHTML = '<div style="display:grid;place-items:center;width:100%;font-size:11px;color:var(--faint)">空</div>'; }
    tops.forEach((t,i)=>{
      const c = STOR_COLORS[i%STOR_COLORS.length];
      const seg = el('div','stor-seg');
      seg.style.cssText = `width:${Math.max(1.5, t.size/total*100)}%;background:${c}`;
      seg.title = `/${t.name} — ${fmtSize(t.size)}`;
      bar.appendChild(seg);
      leg.appendChild(el('span',null,`<span class="dot" style="background:${c}"></span>/${escapeHtml(t.name)} · ${fmtSize(t.size)}`));
    });
    q('.st-mode').textContent = FS.usingFallback? '⚠ 当前运行于 IndexedDB 降级模式（OPFS 不可用）' : '存储后端：OPFS 原生持久化';
  })();

  /* 壁纸 */
  const cur = store.get('wallpaper', {preset:'wp-ink'});
  const wpBox = q('.st-wp');
  WP_PRESETS.forEach(p=>{
    const t = el('div','wp-th '+p.cls+(cur.preset===p.cls?' on':''), `<span class="nm">${p.name}</span>`);
    t.onclick = ()=>{ applyWallpaper({preset:p.cls}); $$('.wp-th',wpBox).forEach(x=>x.classList.remove('on')); t.classList.add('on'); };
    wpBox.appendChild(t);
  });
  q('.st-wpup').onclick = ()=>$('#wp-upload').click();

  /* 挂载列表 */
  const mts = FS.mounts.filter(m=>m.prefix.startsWith('/mnt/local/'));
  const remembered = store.get('mounts', []);
  q('.st-mounts').innerHTML = (mts.length? mts.map(m=>`· ${escapeHtml(m.prefix)}（本次会话已挂载）`).join('<br>') : '当前无已挂载的本地文件夹')
    + (remembered.length? `<br><span style="color:var(--faint);font-size:11.5px">历史挂载记录：${remembered.map(escapeHtml).join('、')}（浏览器安全策略要求刷新后手动重新授权）</span>`:'');

  /* 一键重置 */
  q('.st-reset').onclick = async ()=>{
    const ok = await uiConfirm('一键重置', '将永久删除虚拟文件系统中的<b>所有文件</b>并清空全部设置，确定继续？', true);
    if(!ok) return;
    try{
      const root = FS.mounts.find(m=>m.prefix==='/');
      const list = await fs.readdir('/');
      for(const it of list){ if(!it.mounted) try{ await fs.rm('/'+it.name); }catch(e){} }
      try{ localStorage.clear(); }catch(e){}
      try{ indexedDB.deleteDatabase('vos-fallback-fs'); }catch(e){}
      toast('系统已重置，即将重启…');
      setTimeout(()=>location.reload(), 900);
    }catch(e){ toast('重置失败: '+e.message, true); }
  };
}

const V86_WASM = 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm';
const V86_BIOS = 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin';
const V86_VGA  = 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin';
async function openVM(bootPath){
  const w = createWindow({title:'虚拟机 (v86)', icon:IC.vm, width:820, height:620});
  w.body.innerHTML = `
    <div class="tbar">
      <select class="tinput vm-sel" style="min-width:200px;flex:1"><option value="">— 选择虚拟文件系统中的镜像 —</option></select>
      <button class="tbtn vm-up">${IC.upload}<span>导入镜像</span></button>
      <button class="tbtn acc vm-start">${IC.run}<span>启动</span></button>
      <button class="tbtn vm-stop" disabled>${IC.stop}<span>停止</span></button>
    </div>
    <div class="vm-screen">
      <div class="vm-hint" style="color:var(--faint);font-size:12.5px;line-height:2;text-align:center;padding:30px">
        选择 .iso / .img 磁盘镜像后点击「启动」<br>
        iso → 光驱引导 · img/fda/bin → 软盘引导 · 其他 → 硬盘引导<br>
        可先通过「导入镜像」把本机镜像文件写入虚拟文件系统（如 FreeDOS、TinyCore 软盘镜像）
      </div>
      <div id="vm_container" style="display:none">
        <div id="vm_sc"></div>
        <canvas id="vm_canvas"></canvas>
      </div>
    </div>`;
  const q = s=>w.body.querySelector(s);
  const sel = q('.vm-sel');
  let emulator = null;

  async function scanImages(){
    sel.innerHTML = '<option value="">— 选择虚拟文件系统中的镜像 —</option>';
    const found = [];
    const walk = async (dir, depth)=>{
      if(depth>5 || found.length>200) return;
      let list=[]; try{ list = await fs.readdir(dir); }catch(e){ return; }
      for(const it of list){
        const p = P.join(dir, it.name);
        if(it.kind==='directory'){ if(!it.name.startsWith('.')) await walk(p, depth+1); }
        else if(EXT_KIND.disk.includes(P.ext(it.name))) found.push(p);
      }
    };
    await walk('/', 0);
    for(const p of found){
      const o = el('option'); o.value=p; o.textContent=p;
      sel.appendChild(o);
    }
    if(bootPath){ sel.value = P.norm(bootPath); }
  }
  await scanImages();

  q('.vm-up').onclick = ()=>{
    const inp = $('#file-import');
    inp.onchange = async ()=>{
      await fs.mkdir('/下载');
      for(const f of inp.files) await fs.writeFile(await fs.uniquePath('/下载', f.name), await f.arrayBuffer());
      inp.value='';
      toast('镜像已导入 /下载');
      await scanImages();
      refreshExplorers();
    };
    inp.click();
  };
  q('.vm-start').onclick = async ()=>{
    const p = sel.value;
    if(!p){ toast('请先选择镜像文件', true); return; }
    if(!window.V86 && !window.V86Starter){ toast('v86 引擎未加载（网络问题）', true); return; }
    if(emulator){ try{ emulator.destroy(); }catch(e){} emulator=null; }
    let buffer;
    try{ buffer = await fs.readFile(p); }catch(e){ toast('镜像读取失败: '+e.message, true); return; }
    q('.vm-hint').style.display='none';
    q('#vm_container').style.display='block';
    const ext = P.ext(p);
    const cfg = {
      wasm_path: V86_WASM,
      memory_size: 64*1024*1024,
      vga_memory_size: 8*1024*1024,
      screen_container: q('#vm_container'),
      bios: {url: V86_BIOS},
      vga_bios: {url: V86_VGA},
      autostart: true,
    };
    if(ext==='iso') cfg.cdrom = {buffer};
    else if(ext==='img'||ext==='fda'||ext==='bin') cfg.fda = {buffer};
    else cfg.hda = {buffer};
    try{
      const V = window.V86 || window.V86Starter;
      emulator = new V(cfg);
      q('.vm-stop').disabled = false;
      w.setTitle('虚拟机 — '+P.base(p));
      toast('虚拟机启动中…');
    }catch(e){ toast('启动失败: '+e.message, true); }
  };
  q('.vm-stop').onclick = ()=>{
    if(emulator){ try{ emulator.destroy(); }catch(e){} emulator=null; }
    q('.vm-stop').disabled = true;
    q('#vm_container').style.display='none';
    q('.vm-hint').style.display='block';
  };
  w.onClose = ()=>{ if(emulator){ try{ emulator.destroy(); }catch(e){} } };
}

`欢迎来到 墨渊 OS
