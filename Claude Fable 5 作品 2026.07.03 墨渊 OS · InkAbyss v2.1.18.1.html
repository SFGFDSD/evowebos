<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>墨渊 OS · InkAbyss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- CodeMirror 代码编辑器 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<style>
:root{
  --bg0:#070b10; --bg1:#0d131b; --bg2:#131b26; --bg3:#1a2432;
  --line:#22303f; --line2:#2e4052;
  --ink:#dfe6ef; --dim:#8494a8; --faint:#4d5f73;
  --acc:#e8b04b; --acc-dim:#b5842f; --acc2:#57d6c2; --acc2-dim:#2e8d80;
  --danger:#e0566b; --ok:#7ec97e;
  --tb-h:52px;
  --disp:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;
  --body:'Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono','Noto Sans SC',monospace;
  --shadow:0 18px 50px -12px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{font-family:var(--body); color:var(--ink); background:var(--bg0); font-size:14px;}
button{font-family:var(--body);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2b3a4b; border-radius:5px; border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#3d5066; background-clip:content-box; border:2px solid transparent;}
::selection{background:rgba(232,176,75,.35);}
.noselect{user-select:none; -webkit-user-select:none;}
input,textarea,select,.CodeMirror,.tbl-view,[contenteditable]{user-select:text; -webkit-user-select:text;}

/* ---------- 桌面 ---------- */
#desktop{position:fixed; inset:0 0 var(--tb-h) 0; overflow:hidden;}
#wallpaper{position:absolute; inset:0; background-size:cover; background-position:center; transition:background .5s ease, opacity .5s;}
#wallpaper::after{content:''; position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 0%, transparent 55%, rgba(0,0,0,.42)); pointer-events:none;}
.wp-ink{background:
  radial-gradient(60% 80% at 78% 18%, rgba(87,214,194,.10), transparent 60%),
  radial-gradient(50% 60% at 15% 85%, rgba(232,176,75,.10), transparent 60%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 64px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 64px),
  linear-gradient(160deg,#0a1118 0%, #0c141f 45%, #091019 100%);}
.wp-gold{background:
  radial-gradient(70% 90% at 80% 90%, rgba(232,176,75,.22), transparent 55%),
  radial-gradient(45% 55% at 20% 15%, rgba(224,132,60,.12), transparent 60%),
  conic-gradient(from 210deg at 65% 70%, #0b0d10, #14100a, #0b0d10),
  #0b0d10;}
.wp-jade{background:
  radial-gradient(80% 100% at 20% 100%, rgba(46,141,128,.30), transparent 60%),
  radial-gradient(50% 60% at 85% 10%, rgba(87,214,194,.12), transparent 55%),
  linear-gradient(200deg,#08131a,#0a1a1e 60%,#071014);}
.wp-crimson{background:
  radial-gradient(70% 80% at 75% 25%, rgba(224,86,107,.16), transparent 55%),
  radial-gradient(60% 60% at 10% 90%, rgba(120,32,54,.35), transparent 65%),
  linear-gradient(160deg,#100a10,#170d14 50%,#0c080e);}
.wp-dawn{background:
  radial-gradient(90% 70% at 50% 108%, rgba(232,176,75,.34), rgba(196,90,60,.14) 45%, transparent 70%),
  radial-gradient(40% 45% at 78% 20%, rgba(140,180,220,.10), transparent 60%),
  linear-gradient(180deg,#0a0f1a 0%, #12141f 60%, #1a1420 100%);}

#icon-layer{position:absolute; inset:0;}
.dicon{position:absolute; width:88px; height:100px; display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:10px; border-radius:12px; cursor:pointer; transition:left .28s cubic-bezier(.22,1.2,.36,1), top .28s cubic-bezier(.22,1.2,.36,1), background .15s, box-shadow .15s; touch-action:none; animation:iconIn .5s cubic-bezier(.2,.9,.3,1.1) backwards;}
@keyframes iconIn{from{opacity:0; transform:scale(.7) translateY(14px);} to{opacity:1; transform:none;}}
.dicon:hover{background:rgba(255,255,255,.06);}
.dicon.sel{background:rgba(232,176,75,.14); box-shadow:inset 0 0 0 1px rgba(232,176,75,.45);}
.dicon.drophint{background:rgba(87,214,194,.18); box-shadow:inset 0 0 0 1.5px var(--acc2);}
.dicon .ic{width:46px; height:46px; display:grid; place-items:center; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.dicon .ic svg{width:44px; height:44px;}
.dicon .lb{max-width:84px; font-size:12px; line-height:1.25; text-align:center; color:#eef3f9; text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all;}
.dicon.dragging{opacity:.35;}
#marquee{position:absolute; border:1px solid var(--acc2); background:rgba(87,214,194,.12); z-index:99999; pointer-events:none; border-radius:2px;}
.touch-ghost{position:fixed; z-index:9999; pointer-events:none; opacity:.8; transform:translate(-50%,-50%) scale(1.05); filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));}

/* ---------- 窗口 ---------- */
#windows{position:absolute; inset:0; pointer-events:none;}
.win{position:absolute; min-width:300px; min-height:180px; background:var(--bg1); border:1px solid var(--line2); border-radius:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; pointer-events:auto; overflow:hidden; animation:winIn .28s cubic-bezier(.2,.9,.3,1.05);}
@keyframes winIn{from{opacity:0; transform:scale(.92) translateY(16px);} to{opacity:1; transform:none;}}
.win.closing{animation:winOut .2s ease forwards;}
@keyframes winOut{to{opacity:0; transform:scale(.94) translateY(10px);}}
.win.focus{border-color:#3d5570; box-shadow:0 24px 70px -10px rgba(0,0,0,.75), 0 0 0 1px rgba(232,176,75,.16);}
.win.max{border-radius:0; border:none;}
.win.minimized{display:none;}
.win-tb{height:42px; flex:0 0 42px; display:flex; align-items:center; gap:10px; padding:0 6px 0 14px; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border-bottom:1px solid var(--line); cursor:default; user-select:none; touch-action:none;}
.win.focus .win-tb{background:linear-gradient(180deg,#20304200,#0000), linear-gradient(180deg, #203042, #16202d);}
.win-tb .wt-ic{width:18px; height:18px; flex:0 0 18px;}
.win-tb .wt-ic svg{width:18px; height:18px;}
.win-tb .wt-title{flex:1; font-family:var(--disp); font-size:15px; letter-spacing:.06em; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.win.focus .wt-title{color:var(--ink);}
.win-btn{width:38px; height:30px; border:none; background:transparent; color:var(--dim); border-radius:7px; display:grid; place-items:center; cursor:pointer; transition:.15s;}
.win-btn:hover{background:rgba(255,255,255,.09); color:#fff;}
.win-btn.close:hover{background:var(--danger); color:#fff;}
.win-btn svg{width:13px; height:13px;}
.win-body{flex:1; overflow:hidden; position:relative; display:flex; flex-direction:column;}
.rs{position:absolute; z-index:30;}
.rs-n{top:-4px;left:8px;right:8px;height:8px;cursor:n-resize;}
.rs-s{bottom:-4px;left:8px;right:8px;height:8px;cursor:s-resize;}
.rs-e{right:-4px;top:8px;bottom:8px;width:8px;cursor:e-resize;}
.rs-w{left:-4px;top:8px;bottom:8px;width:8px;cursor:w-resize;}
.rs-ne{top:-5px;right:-5px;width:14px;height:14px;cursor:ne-resize;}
.rs-nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nw-resize;}
.rs-se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:se-resize;}
.rs-sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:sw-resize;}
.win.max .rs{display:none;}

/* 漫画全屏 */
.win.manga-full .win-tb{display:none;}
.win.manga-full{border-radius:0;}
.manga-exit{position:absolute; top:10px; right:12px; z-index:60; width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.45); color:#ccc; font-size:20px; cursor:pointer; display:none; backdrop-filter:blur(6px);}
.win.manga-full .manga-exit{display:block;}
.manga-exit:hover{background:rgba(224,86,107,.8); color:#fff;}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed; left:0; right:0; bottom:0; height:var(--tb-h); display:flex; align-items:center; gap:8px; padding:0 10px; background:rgba(10,15,22,.82); backdrop-filter:blur(18px); border-top:1px solid var(--line); z-index:2000;}
#start-btn{display:flex; align-items:center; gap:8px; height:38px; padding:0 14px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--acc); cursor:pointer; font-family:var(--disp); font-size:17px; letter-spacing:.1em; transition:.18s;}
#start-btn:hover, #start-btn.on{background:rgba(232,176,75,.12); border-color:rgba(232,176,75,.35);}
#start-btn svg{width:20px; height:20px;}
#task-items{flex:1; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; height:100%; align-items:center;}
#task-items::-webkit-scrollbar{display:none;}
.task-item{display:flex; align-items:center; gap:8px; height:38px; padding:0 12px; border-radius:10px; background:rgba(255,255,255,.045); border:1px solid transparent; color:var(--dim); font-size:12.5px; cursor:pointer; max-width:190px; white-space:nowrap; transition:.15s; flex:0 0 auto;}
.task-item svg{width:16px; height:16px; flex:0 0 16px;}
.task-item span{overflow:hidden; text-overflow:ellipsis;}
.task-item:hover{background:rgba(255,255,255,.09); color:var(--ink);}
.task-item.active{background:rgba(232,176,75,.13); border-color:rgba(232,176,75,.4); color:var(--acc); box-shadow:inset 0 -2px 0 var(--acc);}
.task-item.min{opacity:.55; font-style:italic;}
#clock{text-align:right; font-family:var(--mono); line-height:1.3; padding:0 8px; cursor:default;}
#clock .t{font-size:14px; color:var(--ink); font-weight:600;}
#clock .d{font-size:10.5px; color:var(--faint);}

/* ---------- 开始菜单 ---------- */
#startmenu{position:fixed; left:10px; bottom:calc(var(--tb-h) + 10px); width:380px; max-width:calc(100vw - 20px); max-height:min(560px, calc(100vh - 90px)); background:rgba(13,19,27,.94); backdrop-filter:blur(24px); border:1px solid var(--line2); border-radius:16px; box-shadow:var(--shadow); z-index:2100; display:flex; flex-direction:column; overflow:hidden; animation:smIn .22s cubic-bezier(.2,.9,.3,1.05);}
@keyframes smIn{from{opacity:0; transform:translateY(18px) scale(.96);} to{opacity:1; transform:none;}}
#startmenu.hidden{display:none;}
.sm-head{padding:18px 20px 10px; border-bottom:1px solid var(--line);}
.sm-head .logo{font-family:var(--disp); font-size:24px; letter-spacing:.14em; color:var(--acc);}
.sm-head .sub{font-size:11px; color:var(--faint); font-family:var(--mono); letter-spacing:.08em; margin-top:2px;}
.sm-apps{flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.sm-app{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer; transition:.14s; border:1px solid transparent;}
.sm-app:hover{background:rgba(255,255,255,.06); border-color:var(--line);}
.sm-app .ic{width:30px;height:30px; flex:0 0 30px; display:grid; place-items:center;}
.sm-app .ic svg{width:27px;height:27px;}
.sm-app .nm{font-size:13px;}
.sm-app .ds{font-size:10.5px; color:var(--faint);}
.sm-foot{display:flex; gap:6px; padding:10px 12px; border-top:1px solid var(--line);}
.sm-fbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:34px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--dim); font-size:12px; cursor:pointer; transition:.15s;}
.sm-fbtn:hover{color:var(--ink); background:rgba(255,255,255,.06);}
.sm-fbtn svg{width:14px;height:14px;}

/* ---------- 右键菜单 ---------- */
#ctxmenu{position:fixed; z-index:5000; min-width:190px; background:rgba(16,23,32,.97); backdrop-filter:blur(20px); border:1px solid var(--line2); border-radius:11px; padding:5px; box-shadow:var(--shadow); animation:smIn .14s ease;}
#ctxmenu.hidden{display:none;}
.ctx-item{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--ink); position:relative; white-space:nowrap;}
.ctx-item:hover{background:rgba(232,176,75,.14);}
.ctx-item.danger{color:var(--danger);}
.ctx-item.danger:hover{background:rgba(224,86,107,.14);}
.ctx-item svg{width:15px; height:15px; flex:0 0 15px; opacity:.8;}
.ctx-item .arrow{margin-left:auto; opacity:.5; font-size:11px;}
.ctx-sep{height:1px; background:var(--line); margin:4px 8px;}
.ctx-sub{position:absolute; left:100%; top:-6px; min-width:170px; background:rgba(16,23,32,.97); border:1px solid var(--line2); border-radius:11px; padding:5px; box-shadow:var(--shadow); display:none;}
.ctx-item:hover > .ctx-sub{display:block;}
.ctx-sub.flip{left:auto; right:100%;}

/* ---------- 对话框 & Toast ---------- */
.dlg-mask{position:fixed; inset:0; z-index:6000; background:rgba(4,7,11,.55); backdrop-filter:blur(4px); display:grid; place-items:center; animation:fadeIn .15s;}
@keyframes fadeIn{from{opacity:0;}}
.dlg{width:min(400px, calc(100vw - 40px)); background:var(--bg2); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow); padding:20px; animation:smIn .18s;}
.dlg h3{font-family:var(--disp); font-weight:400; letter-spacing:.08em; font-size:17px; color:var(--acc); margin-bottom:12px;}
.dlg .msg{font-size:13px; color:var(--dim); line-height:1.6; margin-bottom:14px; word-break:break-all;}
.dlg input[type=text]{width:100%; height:38px; background:var(--bg0); border:1px solid var(--line2); border-radius:8px; color:var(--ink); padding:0 12px; font-size:13px; outline:none; margin-bottom:14px; font-family:var(--body);}
.dlg input[type=text]:focus{border-color:var(--acc);}
.dlg-btns{display:flex; gap:8px; justify-content:flex-end;}
.btn{height:34px; padding:0 18px; border-radius:8px; border:1px solid var(--line2); background:var(--bg3); color:var(--ink); font-size:13px; cursor:pointer; transition:.15s;}
.btn:hover{border-color:var(--acc); color:var(--acc);}
.btn.primary{background:var(--acc); border-color:var(--acc); color:#171207; font-weight:700;}
.btn.primary:hover{background:#f3c065; color:#171207;}
.btn.danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn.danger:hover{background:var(--danger); color:#fff;}
#toasts{position:fixed; right:16px; bottom:calc(var(--tb-h) + 14px); z-index:7000; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none;}
.toast{max-width:320px; background:rgba(16,23,32,.95); border:1px solid var(--line2); border-left:3px solid var(--acc2); border-radius:10px; padding:10px 14px; font-size:12.5px; color:var(--ink); box-shadow:var(--shadow); animation:toastIn .25s cubic-bezier(.2,.9,.3,1.1);}
.toast.err{border-left-color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);}}
.toast.out{transition:.3s; opacity:0; transform:translateX(30px);}

/* ---------- 通用工具条 ---------- */
.tbar{display:flex; align-items:center; gap:5px; padding:6px 8px; background:var(--bg2); border-bottom:1px solid var(--line); flex-wrap:wrap; flex:0 0 auto;}
.tbtn{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--dim); font-size:12.5px; cursor:pointer; transition:.13s; white-space:nowrap;}
.tbtn:hover{background:rgba(255,255,255,.07); color:var(--ink);}
.tbtn.acc{color:var(--acc);}
.tbtn.acc:hover{background:rgba(232,176,75,.13);}
.tbtn svg{width:15px; height:15px;}
.tbtn:disabled{opacity:.35; cursor:default;}
.tbtn.on{background:rgba(87,214,194,.14); color:var(--acc2); border-color:rgba(87,214,194,.4);}
.tsep{width:1px; height:20px; background:var(--line); margin:0 3px;}
.tinput{height:30px; background:var(--bg0); border:1px solid var(--line2); border-radius:7px; color:var(--ink); padding:0 10px; font-size:12.5px; outline:none; font-family:var(--body);}
.tinput:focus{border-color:var(--acc);}
select.tinput{cursor:pointer;}

/* ---------- 文件管理器 ---------- */
.ex-wrap{display:flex; flex:1; overflow:hidden;}
.ex-side{width:190px; flex:0 0 190px; background:var(--bg2); border-right:1px solid var(--line); overflow-y:auto; padding:10px 7px;}
.ex-side h4{font-size:10.5px; color:var(--faint); letter-spacing:.15em; padding:8px 10px 5px; font-weight:500;}
.ex-nav{display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:8px; font-size:13px; color:var(--dim); cursor:pointer; transition:.13s; margin-bottom:1px;}
.ex-nav:hover{background:rgba(255,255,255,.06); color:var(--ink);}
.ex-nav.on{background:rgba(232,176,75,.13); color:var(--acc);}
.ex-nav svg{width:16px; height:16px; flex:0 0 16px;}
.ex-nav span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.ex-nav .unmount{opacity:0; width:18px; height:18px; display:grid; place-items:center; border-radius:5px; color:var(--danger);}
.ex-nav:hover .unmount{opacity:.8;}
.ex-main{flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative;}
.ex-bread{display:flex; align-items:center; gap:2px; flex:1; min-width:120px; overflow-x:auto; scrollbar-width:none; background:var(--bg0); border:1px solid var(--line); border-radius:7px; height:30px; padding:0 8px;}
.ex-bread::-webkit-scrollbar{display:none;}
.crumb{font-size:12.5px; color:var(--dim); cursor:pointer; padding:3px 6px; border-radius:5px; white-space:nowrap;}
.crumb:hover{background:rgba(255,255,255,.08); color:var(--ink);}
.crumb.last{color:var(--acc);}
.crumb-sep{color:var(--faint); font-size:11px;}
.ex-head{display:flex; border-bottom:1px solid var(--line); background:var(--bg2); font-size:11.5px; color:var(--faint); flex:0 0 30px; align-items:stretch; user-select:none;}
.ex-col{display:flex; align-items:center; gap:5px; padding:0 10px; cursor:pointer; position:relative; overflow:hidden; white-space:nowrap;}
.ex-col:hover{color:var(--ink); background:rgba(255,255,255,.04);}
.ex-col .sort-a{color:var(--acc); font-size:9px;}
.col-rz{position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize; z-index:5;}
.col-rz:hover{background:rgba(232,176,75,.3);}
.ex-list{flex:1; overflow:auto; position:relative;}
.ex-row{display:flex; align-items:center; height:34px; border-radius:0; cursor:pointer; font-size:12.5px; color:var(--ink); border-bottom:1px solid rgba(255,255,255,.025);}
.ex-row:hover{background:rgba(255,255,255,.05);}
.ex-row.sel{background:rgba(232,176,75,.13); box-shadow:inset 2px 0 0 var(--acc);}
.ex-row.drophint{background:rgba(87,214,194,.16); box-shadow:inset 0 0 0 1.5px var(--acc2);}
.ex-cell{padding:0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:8px;}
.ex-cell svg{width:17px; height:17px; flex:0 0 17px;}
.ex-cell.dim{color:var(--faint); font-size:11.5px; font-family:var(--mono);}
.ex-status{flex:0 0 26px; display:flex; align-items:center; gap:14px; padding:0 12px; font-size:11px; color:var(--faint); background:var(--bg2); border-top:1px solid var(--line);}
.ex-empty{padding:50px 20px; text-align:center; color:var(--faint); font-size:13px;}
.ex-empty svg{width:44px;height:44px; opacity:.4; margin-bottom:10px;}
.rename-input{background:var(--bg0); border:1px solid var(--acc); border-radius:5px; color:var(--ink); font-size:12.5px; padding:2px 6px; outline:none; width:100%; font-family:var(--body);}

/* ---------- 编辑器 ---------- */
.ed-wrap{display:flex; flex-direction:column; flex:1; overflow:hidden;}
.ed-split{display:flex; flex:1; overflow:hidden;}
.ed-left{display:flex; flex-direction:column; min-width:200px; overflow:hidden;}
.ed-left .CodeMirror{flex:1; height:auto; font-family:var(--mono); font-size:13px; background:#141a22;}
.ed-gutterbar{width:6px; flex:0 0 6px; cursor:col-resize; background:var(--bg3); border-left:1px solid var(--line); border-right:1px solid var(--line); transition:background .15s;}
.ed-gutterbar:hover{background:var(--acc-dim);}
.ed-right{flex:1; min-width:120px; background:#fff; position:relative;}
.ed-right iframe{width:100%; height:100%; border:none; background:#fff;}
.ed-find{display:none; align-items:center; gap:5px; padding:5px 8px; background:var(--bg3); border-bottom:1px solid var(--line); flex-wrap:wrap;}
.ed-find.show{display:flex;}
.ed-find .cnt{font-size:11px; color:var(--faint); font-family:var(--mono); min-width:52px; text-align:center;}
.fmode{width:28px; height:26px; border-radius:6px; border:1px solid var(--line2); background:transparent; color:var(--dim); font-size:11px; font-family:var(--mono); cursor:pointer;}
.fmode.on{background:rgba(232,176,75,.18); color:var(--acc); border-color:var(--acc);}
.ed-status{flex:0 0 24px; display:flex; align-items:center; gap:16px; padding:0 12px; font-size:11px; color:var(--faint); font-family:var(--mono); background:var(--bg2); border-top:1px solid var(--line); overflow:hidden; white-space:nowrap;}
.cm-matchhighlight-cur{background:rgba(232,176,75,.55) !important; color:#000 !important;}
.cm-matchhighlight-other{background:rgba(87,214,194,.28);}
.cm-trailingspace{background:rgba(224,86,107,.3);}

/* ---------- 漫画 / 图片 ---------- */
.manga-strip{flex:1; overflow-y:auto; background:#000; display:flex; flex-direction:column; align-items:center;}
.manga-strip img{width:100%; max-width:1000px; display:block; pointer-events:none;}
.manga-load{color:#666; font-family:var(--mono); font-size:12px; padding:30px;}

/* ---------- 设置 ---------- */
.set-wrap{flex:1; overflow-y:auto; padding:22px 26px;}
.set-sec{margin-bottom:28px;}
.set-sec h3{font-family:var(--disp); font-weight:400; font-size:17px; letter-spacing:.1em; color:var(--acc); margin-bottom:12px; padding-bottom:7px; border-bottom:1px solid var(--line);}
.stor-bar{height:26px; border-radius:8px; overflow:hidden; display:flex; background:var(--bg0); border:1px solid var(--line2); margin:10px 0;}
.stor-seg{height:100%; transition:width .6s ease;}
.stor-legend{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--dim);}
.stor-legend .dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px;}
.wp-thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px;}
.wp-th{aspect-ratio:16/10; border-radius:9px; cursor:pointer; border:2px solid transparent; background-size:cover; background-position:center; position:relative; transition:.15s;}
.wp-th:hover{transform:scale(1.03);}
.wp-th.on{border-color:var(--acc); box-shadow:0 0 0 2px rgba(232,176,75,.3);}
.wp-th .nm{position:absolute; left:6px; bottom:5px; font-size:10.5px; color:#fff; text-shadow:0 1px 3px #000;}

/* ---------- 计算器 ---------- */
.calc-wrap{flex:1; display:flex; flex-direction:column; padding:12px; gap:10px; background:var(--bg1);}
.calc-disp{background:var(--bg0); border:1px solid var(--line2); border-radius:11px; padding:12px 16px; text-align:right; overflow:hidden;}
.calc-expr{font-size:12px; color:var(--faint); font-family:var(--mono); height:16px; white-space:nowrap; overflow:hidden;}
.calc-res{font-size:31px; font-family:var(--mono); font-weight:600; color:var(--ink); white-space:nowrap; overflow-x:auto; scrollbar-width:none;}
.calc-grid{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
.calc-k{border-radius:10px; border:1px solid var(--line); background:var(--bg2); color:var(--ink); font-size:17px; font-family:var(--mono); cursor:pointer; transition:.1s; min-height:44px;}
.calc-k:hover{background:var(--bg3);}
.calc-k:active{transform:scale(.94);}
.calc-k.op{color:var(--acc2);}
.calc-k.eq{background:var(--acc); color:#171207; border-color:var(--acc); font-weight:700; grid-row:span 2;}
.calc-k.fn{color:var(--dim); font-size:14px;}

.paint-cv-wrap{flex:1; overflow:hidden; position:relative; background:
 repeating-conic-gradient(#181f29 0 25%, #10151d 0 50%) 0 0/22px 22px;}
.paint-cv-wrap canvas{position:absolute; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.5); touch-action:none;}

/* ---------- 浏览器 ---------- */
.br-frame{flex:1; background:#fff; border:none; width:100%;}

/* ---------- 表格 ---------- */
.tbl-view{flex:1; overflow:auto;}
.tbl-view table{border-collapse:collapse; font-size:12.5px; font-family:var(--mono); min-width:100%;}
.tbl-view th{position:sticky; top:0; background:var(--bg3); color:var(--acc); padding:7px 12px; border:1px solid var(--line); text-align:left; white-space:nowrap; z-index:2;}
.tbl-view td{padding:6px 12px; border:1px solid var(--line); color:var(--ink); white-space:nowrap;}
.tbl-view tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.tbl-text{flex:1; width:100%; background:#141a22; color:var(--ink); border:none; outline:none; resize:none; padding:14px; font-family:var(--mono); font-size:13px; line-height:1.6;}

/* ---------- 记事本 ---------- */
.np-text{flex:1; width:100%; background:#11161d; color:var(--ink); border:none; outline:none; resize:none; padding:16px 18px; font-family:var(--mono); font-size:13.5px; line-height:1.7; tab-size:4;}

/* ---------- 虚拟机 ---------- */
.vm-screen{flex:1; overflow:auto; background:#000; display:grid; place-items:center;}
#vm_sc{white-space:pre; font:14px monospace; line-height:14px; color:#ddd;}

/* ---------- 播放器/PDF ---------- */
.media-wrap{flex:1; display:grid; place-items:center; background:#05080c; overflow:hidden; padding:10px;}
.media-wrap video{max-width:100%; max-height:100%;}
.media-wrap audio{width:min(420px, 90%);}
.audio-art{display:flex; flex-direction:column; align-items:center; gap:18px;}
.audio-art .disc{width:130px; height:130px; border-radius:50%; background:conic-gradient(from 0deg, #1a2432, #2e4052, #1a2432 40%, #2e4052 70%, #1a2432); display:grid; place-items:center; animation:spin 7s linear infinite; border:1px solid var(--line2);}
.audio-art .disc::after{content:''; width:34px; height:34px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 6px #0a0f16;}
@keyframes spin{to{transform:rotate(360deg);}}
.audio-art .anm{font-family:var(--disp); letter-spacing:.1em; color:var(--dim); font-size:15px; max-width:380px; text-align:center; word-break:break-all;}
.pdf-frame{flex:1; width:100%; border:none; background:#333;}

/* ---------- 移动端 ---------- */
@media (max-width:768px){
  :root{--tb-h:60px;}

  .rs{display:none;}
  .win-btn{width:44px; height:38px;}
  .win-tb{height:48px; flex-basis:48px;}
  .ex-side{position:absolute; z-index:40; height:100%; transform:translateX(-100%); transition:.25s; box-shadow:20px 0 40px rgba(0,0,0,.4);}
  .ex-side.open{transform:none;}
  .ex-cell.c-type{display:none;}
  .dicon{width:76px; height:92px;}
  #startmenu{left:6px; right:6px; width:auto;}
  .task-item span{display:none;}
  .task-item{padding:0 13px;}
  #clock .d{display:none;}
  .ed-split{flex-direction:column;}
  .ed-gutterbar{width:auto; height:6px; flex-basis:6px; cursor:row-resize;}
  .ed-left{min-width:0; min-height:120px;}
  .ed-right{min-width:0; min-height:100px;}
}

function iconFor(entry){
  if(entry.kind==='directory') return IC.folder;
  const k = kindOf(entry.name);
  const e = P.ext(entry.name);
  if(e==='html'||e==='htm') return IC.html;
  return {img:IC.img,audio:IC.audio,video:IC.video,text:IC.text,code:IC.code,table:IC.table,zip:IC.zip,pdf:IC.pdf,disk:IC.disk}[k] || IC.file;
}

/* ---- 设置存储：localStorage 主 + Cookie 降级 ---- */
const store = {
  get(k, d){
    try{ const v = localStorage.getItem('vos.'+k); if(v!=null) return JSON.parse(v); }catch(e){}
    try{ const m = document.cookie.match(new RegExp('(?:^|; )vos_'+k+'=([^;]*)')); if(m) return JSON.parse(decodeURIComponent(m[1])); }catch(e){}
    return d;
  },
  set(k, v){
    try{ localStorage.setItem('vos.'+k, JSON.stringify(v)); return; }catch(e){}
    try{ document.cookie = 'vos_'+k+'='+encodeURIComponent(JSON.stringify(v))+';max-age=31536000;path=/'; }catch(e){}
  },
  del(k){ try{ localStorage.removeItem('vos.'+k); }catch(e){} }
};

function uiDialog({title, msg, input, value, okText='确定', cancelText='取消', danger, extra}){
  return new Promise(res=>{
    const mask = el('div','dlg-mask');
    const d = el('div','dlg');
    d.innerHTML = `<h3>${escapeHtml(title||'提示')}</h3>` +
      (msg?`<div class="msg">${msg}</div>`:'') +
      (input?`<input type="text" value="${escapeHtml(value||'')}" spellcheck="false">`:'') +
      (extra||'') +
      `<div class="dlg-btns">` +
      (cancelText!==null?`<button class="btn c">${cancelText}</button>`:'') +
      `<button class="btn ${danger?'danger':'primary'} k">${okText}</button></div>`;
    mask.appendChild(d);
    document.body.appendChild(mask);
    const inp = d.querySelector('input');
    const done = v=>{ mask.remove(); res(v); };
    d.querySelector('.k').onclick = ()=> done(input? inp.value.trim() : true);
    const c = d.querySelector('.c'); if(c) c.onclick = ()=>done(input?null:false);
    mask.addEventListener('mousedown', e=>{ if(e.target===mask) done(input?null:false); });
    if(inp){ inp.focus(); const dot=inp.value.lastIndexOf('.'); inp.setSelectionRange(0, dot>0?dot:inp.value.length);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') done(inp.value.trim()); if(e.key==='Escape') done(null); }); }
    else{ mask.tabIndex=-1; mask.focus(); mask.addEventListener('keydown', e=>{ if(e.key==='Enter') done(true); if(e.key==='Escape') done(false); }); }
  });
}

/* ================================================================
   § 1. 虚拟文件系统 VFS
   架构：统一挂载路由。OPFS 为主后端；IndexedDB 为降级后端；
   File System Access API 目录句柄包装为同接口后端挂载至 /mnt/local/*。
   上层调用完全透明，无任何 isLocal 分支。
================================================================ */

/* -- 后端 A：基于 FileSystemDirectoryHandle（OPFS 与本地挂载共用同一实现） -- */
class HandleBackend{
  constructor(root){ this.rootP = Promise.resolve(root); }
  async _dir(parts, create=false){
    let d = await this.rootP;
    for(const p of parts) d = await d.getDirectoryHandle(p, {create});
    return d;
  }
  async mkdir(parts){ if(!parts.length) return; await this._dir(parts, true); }
  async readdir(parts){
    const d = await this._dir(parts);
    const out = [];
    for await (const h of d.values()) out.push({name:h.name, kind:h.kind});
    return out;
  }
  async stat(parts, ...rest){
    if(!parts.length) return {name:'/', kind:'directory', size:0, mtime:0};
    const parent = await this._dir(parts.slice(0,-1));
    const name = parts[parts.length-1];
    try{
      const fh = await parent.getFileHandle(name);
      const f = await fh.getFile();
      return {name, kind:'file', size:f.size, mtime:f.lastModified, type:f.type};
    }catch(e){
      await parent.getDirectoryHandle(name); // 不存在则抛错
      return {name, kind:'directory', size:0, mtime:0};
    }
  }
  async readFileBlob(parts, ...rest){
    const parent = await this._dir(parts.slice(0,-1));
    const fh = await parent.getFileHandle(parts[parts.length-1]);
    return await fh.getFile();
  }
  async writeFile(parts, data, ...rest){
    const parent = await this._dir(parts.slice(0,-1), true);
    const fh = await parent.getFileHandle(parts[parts.length-1], {create:true});
    const w = await fh.createWritable();
    await w.write(data);
    await w.close();
  }
  async rm(parts, ...rest){
    const parent = await this._dir(parts.slice(0,-1));
    await parent.removeEntry(parts[parts.length-1], {recursive:true});
  }
  async exists(parts, ...rest){
    try{ await this.stat(parts); return true; }catch(e){ return false; }
  }
}

/* -- 后端 B：IndexedDB 内存镜像降级（OPFS 不可用时） -- */
class IDBBackend{
  constructor(){ this.map = new Map(); this.ready = this._init(); }
  _init(){
    return new Promise(res=>{
      try{
        const req = indexedDB.open('vos-fallback-fs', 1);
        req.onupgradeneeded = ()=>req.result.createObjectStore('files', {keyPath:'path'});
        req.onsuccess = ()=>{
          this.db = req.result;
          const tx = this.db.transaction('files','readonly').objectStore('files').getAll();
          tx.onsuccess = ()=>{ for(const r of tx.result||[]) this.map.set(r.path, r); res(); };
          tx.onerror = ()=>res();
        };
        req.onerror = ()=>res();
      }catch(e){ res(); }
    });
  }
  _persist(rec){ try{ this.db && this.db.transaction('files','readwrite').objectStore('files').put(rec); }catch(e){} }
  _unpersist(path){ try{ this.db && this.db.transaction('files','readwrite').objectStore('files').delete(path); }catch(e){} }
  _key(parts){ return parts.join('/'); }
  async mkdir(parts){
    await this.ready;
    let k='';
    for(const p of parts){ k = k?k+'/'+p:p;
      if(!this.map.has(k)){ const rec={path:k, kind:'directory', mtime:Date.now()}; this.map.set(k, rec); this._persist(rec); }
    }
  }
  async readdir(parts){
    await this.ready;
    const pre = this._key(parts); const preS = pre?pre+'/':'';
    const out=[]; const seen=new Set();
    for(const [k,v] of this.map){
      if(!k.startsWith(preS)||k===pre) continue;
      const rest = k.slice(preS.length);
      const top = rest.split('/')[0];
      if(seen.has(top)) continue; seen.add(top);
      const direct = this.map.get(preS+top);
      out.push({name:top, kind:direct?direct.kind:'directory'});
    }
    return out;
  }
  async stat(parts){
    await this.ready;
    if(!parts.length) return {name:'/', kind:'directory', size:0, mtime:0};
    const rec = this.map.get(this._key(parts));
    if(!rec) throw new Error('NotFound');
    return {name:parts[parts.length-1], kind:rec.kind, size:rec.data?rec.data.byteLength:0, mtime:rec.mtime||0};
  }
  async readFileBlob(parts){
    await this.ready;
    const rec = this.map.get(this._key(parts));
    if(!rec||rec.kind!=='file') throw new Error('NotFound');
    return new File([rec.data], parts[parts.length-1], {type:mimeOf(parts[parts.length-1]), lastModified:rec.mtime});
  }
  async writeFile(parts, data){
    await this.ready;
    if(parts.length>1) await this.mkdir(parts.slice(0,-1));
    let buf;
    if(data instanceof Blob) buf = await data.arrayBuffer();
    else if(typeof data==='string') buf = new TextEncoder().encode(data).buffer;
    else if(data instanceof ArrayBuffer) buf = data;
    else buf = data.buffer ? data.buffer.slice(data.byteOffset, data.byteOffset+data.byteLength) : new ArrayBuffer(0);
    const rec = {path:this._key(parts), kind:'file', data:buf, mtime:Date.now()};
    this.map.set(rec.path, rec); this._persist(rec);
  }
  async rm(parts){
    await this.ready;
    const k = this._key(parts);
    for(const key of [...this.map.keys()]){
      if(key===k || key.startsWith(k+'/')){ this.map.delete(key); this._unpersist(key); }
    }
  }
  async exists(parts){ await this.ready; return !parts.length || this.map.has(this._key(parts)); }
}

/* -- 挂载路由器 -- */
const FS = {
  mounts: [],   // {prefix, backend, label}
  usingFallback: false,
  mount(prefix, backend, label){
    prefix = P.norm(prefix);
    this.mounts = this.mounts.filter(m=>m.prefix!==prefix);
    this.mounts.push({prefix, backend, label});
    this.mounts.sort((a,b)=>b.prefix.length - a.prefix.length);
  },
  unmount(prefix){
    prefix = P.norm(prefix);
    this.mounts = this.mounts.filter(m=>m.prefix!==prefix);
  },
  resolve(path){
    path = P.norm(path);
    for(const m of this.mounts){
      if(path===m.prefix || path.startsWith(m.prefix==='/'?'/':m.prefix+'/')){
        const rel = path===m.prefix ? '' : path.slice(m.prefix==='/'?1:m.prefix.length+1);
        return {backend:m.backend, parts: rel? rel.split('/'):[], mount:m};
      }
    }
    throw new Error('无挂载点: '+path);
  }
};

/* -- 统一 fs API（全局） -- */
const fs = {
  async init(){
    let primary;
    try{
      if(navigator.storage && navigator.storage.getDirectory){
        const root = await navigator.storage.getDirectory();
        // 探测写入能力
        const t = await root.getFileHandle('.probe', {create:true});
        const w = await t.createWritable(); await w.close();
        await root.removeEntry('.probe');
        primary = new HandleBackend(root);
      }
    }catch(e){ console.warn('OPFS 不可用，降级 IndexedDB', e); }
    if(!primary){ primary = new IDBBackend(); FS.usingFallback = true; }
    FS.mount('/', primary, '系统');
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  },
  async mkdir(path){ const {backend, parts} = FS.resolve(path); return backend.mkdir(parts); },
  async readdir(path){
    path = P.norm(path);
    const {backend, parts} = FS.resolve(path);
    let list = await backend.readdir(parts);
    // 虚拟目录：把子挂载点显示出来（如 /mnt、/mnt/local 下的挂载文件夹）
    for(const m of FS.mounts){
      if(m.prefix!=='/' && P.parent(m.prefix)===path && !list.some(x=>x.name===P.base(m.prefix)))
        list.push({name:P.base(m.prefix), kind:'directory', mounted:true});
    }
    return list;
  },
  async stat(path, ...rest){
    path = P.norm(path);
    for(const m of FS.mounts) if(m.prefix===path) return {name:P.base(path)||'/', kind:'directory', size:0, mtime:0, mounted:true};
    const {backend, parts} = FS.resolve(path);
    return backend.stat(parts, ...rest);
  },
  async exists(path){ try{ await fs.stat(path); return true; }catch(e){ return false; } },
  async readFileBlob(path, ...rest){ const {backend, parts} = FS.resolve(path); return backend.readFileBlob(parts, ...rest); },
  async readFile(path, ...rest){ const b = await fs.readFileBlob(path); return b.arrayBuffer(); },
  async readText(path){ const b = await fs.readFileBlob(path); return b.text(); },
  async writeFile(path, data, ...rest){ const {backend, parts} = FS.resolve(path); return backend.writeFile(parts, data, ...rest); },
  async writeText(path, text){ return fs.writeFile(path, new Blob([text], {type: mimeOf(path)+';charset=utf-8'})); },
  async rm(path, ...rest){
    path = P.norm(path);
    const m = FS.mounts.find(m=>m.prefix===path && m.prefix!=='/');
    if(m){ FS.unmount(path); return; }
    const {backend, parts} = FS.resolve(path);
    return backend.rm(parts, ...rest);
  },
  /* 递归复制（可跨后端） */
  async copy(src, dst){
    src = P.norm(src); dst = P.norm(dst);
    if(dst===src || dst.startsWith(src+'/')) throw new Error('不能复制到自身内部');
    const st = await fs.stat(src);
    if(st.kind==='directory'){
      await fs.mkdir(dst);
      const list = await fs.readdir(src);
      for(const it of list) await fs.copy(P.join(src, it.name), P.join(dst, it.name));
    }else{
      const blob = await fs.readFileBlob(src);
      await fs.writeFile(dst, blob);
    }
  },
  async move(src, dst){
    src = P.norm(src); dst = P.norm(dst);
    if(src===dst) return;
    if(dst===src || dst.startsWith(src+'/')) throw new Error('不能移动到自身内部');
    await fs.copy(src, dst);
    await fs.rm(src);
  },
  async rename(path, newName){
    const dst = P.join(P.parent(path), newName);
    if(P.norm(path)===dst) return dst;
    if(await fs.exists(dst)) throw new Error('同名文件已存在');
    await fs.move(path, dst);
    return dst;
  },
  /* 生成不重名路径 */
  async uniquePath(dir, name){
    let cand = P.join(dir, name);
    if(!await fs.exists(cand)) return cand;
    const dot = name.lastIndexOf('.');
    const stem = dot>0? name.slice(0,dot):name, ext = dot>0? name.slice(dot):'';
    for(let i=2;i<9999;i++){
      cand = P.join(dir, `${stem} (${i})${ext}`);
      if(!await fs.exists(cand)) return cand;
    }
    return cand;
  },
  /* 递归计算大小 */
  async du(path){
    try{
      const st = await fs.stat(path);
      if(st.kind==='file') return st.size||0;
      let sum = 0;
      const list = await fs.readdir(path);
      for(const it of list) sum += await fs.du(P.join(path, it.name));
      return sum;
    }catch(e){ return 0; }
  },
  /* 递归搜索 */
  async search(dir, q, out=[], depth=0){
    if(depth>7) return out;
    let list=[]; try{ list = await fs.readdir(dir); }catch(e){ return out; }
    for(const it of list){
      const p = P.join(dir, it.name);
      if(it.name.toLowerCase().includes(q.toLowerCase())) out.push({...it, path:p});
      if(it.kind==='directory' && out.length<300) await fs.search(p, q, out, depth+1);
    }
    return out;
  }
};

/* -- 本地文件夹挂载（File System Access API） -- */
async function mountLocalFolder(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持 File System Access API', true); return; }
  try{
    const handle = await showDirectoryPicker({mode:'readwrite'});
    try{ await handle.requestPermission({mode:'readwrite'}); }catch(e){}
    await fs.mkdir('/mnt/local').catch(()=>{});
    let name = handle.name, i=2;
    while(FS.mounts.some(m=>m.prefix===P.join('/mnt/local', name))) name = handle.name+'-'+(i++);
    FS.mount(P.join('/mnt/local', name), new HandleBackend(handle), name);
    const remembered = store.get('mounts', []);
    if(!remembered.includes(handle.name)) remembered.push(handle.name);
    store.set('mounts', remembered);
    toast(`本地文件夹「${name}」已挂载到 /mnt/local/${name}`);
    refreshDesktop(); refreshExplorers();
    openExplorer(P.join('/mnt/local', name));
  }catch(e){ if(e.name!=='AbortError') toast('挂载失败: '+e.message, true); }
}
function unmountLocal(prefix){
  FS.unmount(prefix);
  const name = P.base(prefix);
  store.set('mounts', store.get('mounts',[]).filter(n=>n!==name));
  toast(`已卸载「${name}」`);
  refreshExplorers();
}

/* ================================================================
   § 2. 压缩包处理（zip / gz / tar / tar.gz / 7z）
================================================================ */
async function extractArchive(path){
  const name = P.base(path), e = P.ext(name), dir = P.parent(path);
  const stem = name.replace(/\.(zip|gz|tgz|tar|7z)$/i,'').replace(/\.tar$/i,'');
  const destDir = await fs.uniquePath(dir, stem);
  toast('正在解压 '+name+' ...');
  try{
    const buf = await fs.readFile(path);
    if(e==='zip'){
      if(!window.JSZip) throw new Error('JSZip 未加载（网络问题）');
      const z = await JSZip.loadAsync(buf);
      await fs.mkdir(destDir);
      const entries = Object.values(z.files);
      for(const ent of entries){
        const t = P.join(destDir, ent.name);
        if(ent.dir) await fs.mkdir(t);
        else{ const data = await ent.async('arraybuffer'); await fs.writeFile(t, data); }
      }
    }else if(e==='gz' || e==='tgz'){
      const dec = await gunzip(buf);
      if(e==='tgz' || /\.tar\.gz$/i.test(name)){
        await untarTo(dec, destDir);
      }else{
        const inner = name.replace(/\.gz$/i,'');
        await fs.writeFile(await fs.uniquePath(dir, inner), dec);
        toast('解压完成: '+inner);
        refreshDesktop(); refreshExplorers();
        return;
      }
    }else if(e==='tar'){
      await untarTo(buf, destDir);
    }else if(e==='7z'){
      await extract7z(buf, name, destDir);
    }else throw new Error('不支持的压缩格式: '+e);
    toast('解压完成 → '+P.base(destDir));
    refreshDesktop(); refreshExplorers();
  }catch(err){ toast('解压失败: '+err.message, true); }
}
async function gunzip(buf){
  if(!window.DecompressionStream) throw new Error('浏览器不支持 DecompressionStream');
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([buf]).stream().pipeThrough(ds);
  return await new Response(stream).arrayBuffer();
}
async function untarTo(buf, destDir){
  await fs.mkdir(destDir);
  const u8 = new Uint8Array(buf);
  const td = new TextDecoder();
  let off = 0;
  const rd = (o,l)=>td.decode(u8.subarray(o,o+l)).replace(/\0.*$/,'').trim();
  while(off + 512 <= u8.length){
    const name = rd(off, 100);
    if(!name) break;
    const size = parseInt(rd(off+124, 12), 8) || 0;
    const type = String.fromCharCode(u8[off+156]);
    const prefix = rd(off+345, 155);
    const full = (prefix? prefix+'/':'') + name;
    const target = P.join(destDir, full);
    if(type==='5' || full.endsWith('/')) await fs.mkdir(target);
    else if(type==='0' || type==='\0' || type===' '){
      await fs.writeFile(target, u8.slice(off+512, off+512+size).buffer);
    }
    off += 512 + Math.ceil(size/512)*512;
  }
}
async function extract7z(buf, name, destDir){
  if(!window.SevenZipFactory) throw new Error('7z-wasm 引擎未加载');
  const sz = await SevenZipFactory();
  sz.FS.writeFile('/'+name, new Uint8Array(buf));
  sz.FS.mkdir('/out');
  sz.callMain(['x', '/'+name, '-o/out', '-y']);
  await fs.mkdir(destDir);
  const walk = async (vp, tp)=>{
    for(const n of sz.FS.readdir(vp)){
      if(n==='.'||n==='..') continue;
      const full = vp+'/'+n;
      const st = sz.FS.stat(full);
      if(sz.FS.isDir(st.mode)){ await fs.mkdir(P.join(tp, n)); await walk(full, P.join(tp, n)); }
      else{ const data = sz.FS.readFile(full); await fs.writeFile(P.join(tp, n), data.buffer.slice(data.byteOffset, data.byteOffset+data.byteLength)); }
    }
  };
  await walk('/out', destDir);
}
async function zipFolder(path){
  if(!window.JSZip){ toast('JSZip 未加载', true); return; }
  const z = new JSZip();
  const add = async (p, zf)=>{
    const list = await fs.readdir(p);
    for(const it of list){
      const full = P.join(p, it.name);
      if(it.kind==='directory') await add(full, zf.folder(it.name));
      else zf.file(it.name, await fs.readFile(full));
    }
  };
  toast('正在打包 '+P.base(path)+' ...');
  await add(path, z);
  const blob = await z.generateAsync({type:'blob'});
  return blob;
}

let zTop = 100, widSeq = 0;
const windows = new Map();
let focusedWin = null;

function createWindow(opt){
  const id = ++widSeq;
  const w = {
    id, title: opt.title||'窗口', icon: opt.icon||IC.file, type: opt.type||'app',

  let W = Math.min(opt.width||760, dw-16), H = Math.min(opt.height||520, dh-16);
  let X = opt.x!=null? opt.x : Math.max(8, (dw-W)/2 + (id%7-3)*24);
  let Y = opt.y!=null? opt.y : Math.max(8, (dh-H)/2 + (id%5-2)*18);

  const win = el('div','win');
  win.style.cssText = `left:${X}px; top:${Y}px; width:${W}px; height:${H}px; z-index:${++zTop};`;
  win.innerHTML = `
    <div class="win-tb">
      <div class="wt-ic">${w.icon}</div>
      <div class="wt-title">${escapeHtml(w.title)}</div>
      <button class="win-btn b-min" title="最小化">${IC.min}</button>

    </div>
    <div class="win-body"></div>
    ${['n','s','e','w','ne','nw','se','sw'].map(d=>`<div class="rs rs-${d}" data-d="${d}"></div>`).join('')}`;
  $('#windows').appendChild(win);
  w.el = win; w.body = win.querySelector('.win-body');
  windows.set(id, w);

  /* 任务栏项 */
  const ti = el('button','task-item');
  ti.innerHTML = `${w.icon}<span>${escapeHtml(w.title)}</span>`;
  ti.onclick = ()=>{
    if(w.minimized){ restoreWin(w); }
    else if(focusedWin===w){ minimizeWin(w); }
    else focusWin(w);
  };
  $('#task-items').appendChild(ti);
  w.taskItem = ti;

  const setTitle = t=>{ w.title=t; win.querySelector('.wt-title').textContent=t; ti.querySelector('span').textContent=t; };
  w.setTitle = setTitle;

  /* 聚焦 */
  win.addEventListener('pointerdown', ()=>focusWin(w), true);
  focusWin(w);

  /* 拖动 */
  const tb = win.querySelector('.win-tb');
  tb.addEventListener('pointerdown', e=>{
    if(e.target.closest('.win-btn') || w.maximized) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY, ox=win.offsetLeft, oy=win.offsetTop;
    const mv = ev=>{
      win.style.left = clamp(ox+ev.clientX-sx, -W+80, innerWidth-40)+'px';
      win.style.top = clamp(oy+ev.clientY-sy, 0, innerHeight-80)+'px';
    };
    const up = ()=>{ removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
  tb.addEventListener('dblclick', e=>{ if(!e.target.closest('.win-btn')) toggleMax(w); });

  /* 调整大小（八向） */
  $$('.rs', win).forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      const d = h.dataset.d;
      const sx=e.clientX, sy=e.clientY;
      const r = {x:win.offsetLeft, y:win.offsetTop, w:win.offsetWidth, h:win.offsetHeight};
      const mv = ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        let {x,y,w:ww,h:hh} = r;
        if(d.includes('e')) ww = Math.max(300, r.w+dx);
        if(d.includes('s')) hh = Math.max(180, r.h+dy);
        if(d.includes('w')){ ww = Math.max(300, r.w-dx); x = r.x + r.w - ww; }
        if(d.includes('n')){ hh = Math.max(180, r.h-dy); y = r.y + r.h - hh; }
        Object.assign(win.style, {left:x+'px', top:y+'px', width:ww+'px', height:hh+'px'});
        if(w.onResize) w.onResize();
      };
      const up = ()=>{ removeEventListener('pointermove', mv); removeEventListener('pointerup', up); if(w.onResize) w.onResize(); };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
  });

  win.querySelector('.b-min').onclick = ()=>minimizeWin(w);
  win.querySelector('.b-max').onclick = ()=>toggleMax(w);
  win.querySelector('.b-close').onclick = ()=>closeWin(w);

  if(isMobile()) toggleMax(w, true);
  if(opt.content) opt.content(w.body, w);
  return w;
}
function focusWin(w){
  if(focusedWin===w && !w.minimized) { w.el.style.zIndex = ++zTop; return; }
  focusedWin = w;
  w.el.style.zIndex = ++zTop;
  windows.forEach(x=>{ x.el.classList.toggle('focus', x===w); x.taskItem.classList.toggle('active', x===w && !x.minimized); });
}
function minimizeWin(w){
  w.minimized = true;
  w.el.classList.add('minimized');
  w.taskItem.classList.add('min'); w.taskItem.classList.remove('active');
  if(focusedWin===w) focusedWin=null;
}
function restoreWin(w){
  w.minimized = false;
  w.el.classList.remove('minimized');
  w.taskItem.classList.remove('min');
  focusWin(w);
  if(w.onResize) w.onResize();
}
function toggleMax(w, force){
  if(!w.maximized || force){
    if(!w.prev) w.prev = {l:w.el.style.left, t:w.el.style.top, w:w.el.style.width, h:w.el.style.height};
    Object.assign(w.el.style, {left:'0', top:'0', width:'100%', height:'100%'});
    w.el.classList.add('max');
    w.maximized = true;
    w.el.querySelector('.b-max').innerHTML = IC.restore;
  }else{
    Object.assign(w.el.style, {left:w.prev.l, top:w.prev.t, width:w.prev.w, height:w.prev.h});
    w.prev = null;
    w.el.classList.remove('max');
    w.maximized = false;
    w.el.querySelector('.b-max').innerHTML = IC.max;
  }
  if(w.onResize) setTimeout(()=>w.onResize(), 50);
}
function closeWin(w){
  if(w.onClose){ try{ w.onClose(); }catch(e){} }
  w.el.classList.add('closing');
  w.taskItem.remove();
  windows.delete(w.id);
  if(focusedWin===w) focusedWin=null;
  setTimeout(()=>w.el.remove(), 200);
}

================================================================ */
const DESK = '/桌面';
const iconLayer = $('#icon-layer');
const CW = ()=> isMobile()? 80 : 94;
const CH = ()=> isMobile()? 96 : 110;
let iconPos = store.get('iconPos', {});
let deskSel = new Set();          // 选中的桌面项名称
const clipboard = { mode:null, paths:[] };

/* 拖拽预载缓存：dragstart 必须同步，数据提前加载 */
const dragCache = new Map();
async function preloadDrag(path){
  if(dragCache.has(path)) return;
  dragCache.set(path, null); // 占位防止重复
  try{
    const st = await fs.stat(path);
    if(st.kind!=='file'){ dragCache.delete(path); return; }
    const blob = await fs.readFileBlob(path);
    const name = P.base(path);
    const mime = blob.type || mimeOf(name);
    const file = new File([blob], name, {type:mime});
    const url = URL.createObjectURL(new Blob([blob], {type:mime}));
    dragCache.set(path, {file, url, mime, name});
  }catch(e){ dragCache.delete(path); }
}

function gridCellAt(x, y){
  const r = iconLayer.getBoundingClientRect();
  return { c: Math.max(0, Math.floor((x - r.left - 8) / CW())), r: Math.max(0, Math.floor((y - r.top - 8) / CH())) };
}
function cellToXY(cell){
  const rows = Math.max(1, Math.floor((iconLayer.clientHeight - 12) / CH()));
  return { x: 8 + cell.c * CW(), y: 8 + Math.min(cell.r, rows-1) * CH() };
}
function findFreeCell(taken){
  const rows = Math.max(1, Math.floor((iconLayer.clientHeight - 12) / CH()));
  for(let c=0; c<40; c++) for(let r=0; r<rows; r++){
    if(!taken.has(c+','+r)) return {c, r};
  }
  return {c:0, r:0};
}

async function refreshDesktop(){
  let entries = [];
  try{ entries = await fs.readdir(DESK); }catch(e){}
  entries.sort((a,b)=> (a.kind===b.kind?0:a.kind==='directory'?-1:1) || natCmp(a.name,b.name));
  iconLayer.innerHTML = '';
  const taken = new Set();
  for(const n in iconPos){ if(entries.some(x=>x.name===n)) taken.add(iconPos[n].c+','+iconPos[n].r); }
  let idx = 0;
  for(const ent of entries){
    if(!iconPos[ent.name]){
      const cell = findFreeCell(taken);
      iconPos[ent.name] = cell;
      taken.add(cell.c+','+cell.r);
    }
    makeDeskIcon(ent, iconPos[ent.name], idx++);
  }
  // 清理失效位置记录
  for(const n in iconPos) if(!entries.some(x=>x.name===n)) delete iconPos[n];
  store.set('iconPos', iconPos);
}

function makeDeskIcon(ent, cell, idx){
  const path = P.join(DESK, ent.name);
  const d = el('div','dicon');
  const {x, y} = cellToXY(cell);
  d.style.left = x+'px'; d.style.top = y+'px';
  d.style.animationDelay = Math.min(idx*0.035, 0.5)+'s';
  d.dataset.name = ent.name; d.dataset.kind = ent.kind;
  d.draggable = true;
  d.innerHTML = `<div class="ic">${iconFor(ent)}</div><div class="lb">${escapeHtml(ent.name)}</div>`;
  if(deskSel.has(ent.name)) d.classList.add('sel');

  /* 预载拖出数据 */
  if(ent.kind==='file'){
    d.addEventListener('mouseenter', ()=>preloadDrag(path));
    d.addEventListener('pointerdown', ()=>preloadDrag(path));
  }
  d.addEventListener('pointerdown', e=>{
    if(e.button===2){ if(!deskSel.has(ent.name)){ deskSel = new Set([ent.name]); paintDeskSel(); } return; }
    if(e.ctrlKey || e.metaKey){ deskSel.has(ent.name)? deskSel.delete(ent.name) : deskSel.add(ent.name); paintDeskSel(); }
    else if(!deskSel.has(ent.name)){ deskSel = new Set([ent.name]); paintDeskSel(); }
  });
  d.addEventListener('click', e=>{
    if(e.ctrlKey || e.metaKey || d._justDragged) return;
    deskSel = new Set([ent.name]); paintDeskSel();
    openPath(path);
  });
  d.addEventListener('contextmenu', e=>{
    e.preventDefault(); e.stopPropagation();
    showCtxMenu(e.clientX, e.clientY, entryMenu(path, ent, {desk:true}));
  });

  /* —— 原生 HTML5 拖拽（内部移动 + 拖出下载 双协议）—— */
  d.addEventListener('dragstart', e=>{               // 严禁 async
    const sel = deskSel.has(ent.name)? [...deskSel] : [ent.name];
    deskSel = new Set(sel); paintDeskSel();
    const paths = sel.map(n=>P.join(DESK, n));
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData('application/x-vos', JSON.stringify({paths, src:DESK}));
    const c = dragCache.get(path);
    if(c && sel.length===1){
      try{ e.dataTransfer.items.add(c.file); }catch(err){}
      try{ e.dataTransfer.setData('DownloadURL', `${c.mime}:${c.name}:${c.url}`); }catch(err){}
    }
    d.classList.add('dragging');
  });
  d.addEventListener('dragend', ()=>{
    d.classList.remove('dragging');
    setTimeout(()=>{ const c=dragCache.get(path); if(c){ URL.revokeObjectURL(c.url); dragCache.delete(path); } }, 6000);
  });
  if(ent.kind==='directory'){
    d.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); d.classList.add('drophint'); });
    d.addEventListener('dragleave', ()=>d.classList.remove('drophint'));
    d.addEventListener('drop', async e=>{
      e.preventDefault(); e.stopPropagation();
      d.classList.remove('drophint');
      await handleDropInto(e, path);
    });
  }

  /* —— 触摸拖拽（原生 DnD 触摸不可用的替代路径）—— */
  if(isTouch) attachTouchDrag(d, ent, path);
  iconLayer.appendChild(d);
}
function paintDeskSel(){
  $$('.dicon', iconLayer).forEach(x=>x.classList.toggle('sel', deskSel.has(x.dataset.name)));
}

function attachTouchDrag(d, ent, path){
  let t0=null, ghost=null, moved=false, lpTimer=null;
  d.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    t0 = {x:t.clientX, y:t.clientY};
    moved=false;
    lpTimer = setTimeout(()=>{  // 长按 → 上下文菜单
      lpTimer=null;
      if(!moved){
        navigator.vibrate && navigator.vibrate(20);
        d._justDragged = true; setTimeout(()=>d._justDragged=false, 800);
        showCtxMenu(t0.x, t0.y, entryMenu(path, ent, {desk:true})); t0=null;
      }
    }, 550);
  }, {passive:true});
  d.addEventListener('touchmove', e=>{
    if(!t0) return;
    const t = e.touches[0];
    if(!moved && Math.hypot(t.clientX-t0.x, t.clientY-t0.y) < 12) return;
    moved = true;
    if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; }
    e.preventDefault();
    if(!ghost){ ghost = d.cloneNode(true); ghost.className='dicon touch-ghost'; document.body.appendChild(ghost); d.classList.add('dragging'); }
    ghost.style.left = t.clientX+'px'; ghost.style.top = t.clientY+'px';
  }, {passive:false});
  d.addEventListener('touchend', async e=>{
    if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; }
    if(!t0){ return; }
    t0=null;
    if(!ghost){ return; }
    const t = e.changedTouches[0];
    ghost.remove(); ghost=null; d.classList.remove('dragging');
    d._justDragged = true; setTimeout(()=>d._justDragged=false, 350);
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const overIcon = target && target.closest('.dicon');
    const overRow = target && target.closest('.ex-row');
    const overWin = target && target.closest('.win');
    try{
      if(overIcon && overIcon.dataset.kind==='directory' && overIcon.dataset.name!==ent.name){
        await fs.move(path, await fs.uniquePath(P.join(DESK, overIcon.dataset.name), ent.name));
        toast('已移动到 '+overIcon.dataset.name);
        refreshDesktop(); refreshExplorers();
      }else if(overRow && overRow.dataset.kind==='directory' && overRow._exPath){
        await fs.move(path, await fs.uniquePath(overRow._exPath, ent.name));
        refreshDesktop(); refreshExplorers();
      }else if(overWin && overWin._exDropDir){
        if(P.parent(path)!==overWin._exDropDir){ await fs.move(path, await fs.uniquePath(overWin._exDropDir, ent.name)); refreshDesktop(); refreshExplorers(); }
      }else if(!overWin){
        const cell = gridCellAt(t.clientX, t.clientY);
        iconPos[ent.name] = cell;
        store.set('iconPos', iconPos);
        const {x, y} = cellToXY(cell);
        d.style.left=x+'px'; d.style.top=y+'px';
      }
    }catch(err){ toast(err.message, true); }
  });
}

const deskEl = $('#desktop');
deskEl.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect = e.dataTransfer.types.includes('application/x-vos')?'move':'copy'; });
deskEl.addEventListener('drop', async e=>{
  e.preventDefault();
  if(e.target.closest('.win') || e.target.closest('#taskbar')) return;  // 窗口内的 drop 由各自处理
  await handleDropInto(e, DESK, true);
});
async function handleDropInto(e, destDir, isDesktopSurface){
  const raw = e.dataTransfer.getData('application/x-vos');
  if(raw){
    try{
      const meta = JSON.parse(raw);
      if(isDesktopSurface && meta.src===DESK){
        /* 桌面内部：更新图标坐标 */
        const cell = gridCellAt(e.clientX, e.clientY);
        const names = meta.paths.map(p=>P.base(p));
        names.forEach((n,i)=>{ iconPos[n] = {c:cell.c, r:cell.r+i}; });
        store.set('iconPos', iconPos);
        refreshDesktop();
        return;
      }
      for(const src of meta.paths){
        if(P.parent(src)===destDir) continue;
        await fs.move(src, await fs.uniquePath(destDir, P.base(src)));
      }
      if(isDesktopSurface){
        const cell = gridCellAt(e.clientX, e.clientY);
        meta.paths.forEach((p,i)=>{ iconPos[P.base(p)] = {c:cell.c, r:cell.r+i}; });
        store.set('iconPos', iconPos);
      }
      refreshDesktop(); refreshExplorers();
    }catch(err){ toast('移动失败: '+err.message, true); }
    return;
  }
  /* 外部（物理桌面 → 虚拟桌面） */
  await importDataTransfer(e.dataTransfer, destDir);
}

/* 物理文件导入：webkitGetAsEntry 递归 + readEntries 100 条循环 */
async function importDataTransfer(dt, destDir){
  const entries = [];
  if(dt.items){
    for(let i=0;i<dt.items.length;i++){
      const it = dt.items[i];
      if(it.kind!=='file') continue;
      const ent = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
      if(ent) entries.push(ent);
      else{ const f = it.getAsFile(); if(f) entries.push({_plainFile:f}); }
    }
  }
  if(!entries.length && dt.files && dt.files.length){
    for(const f of dt.files) entries.push({_plainFile:f});
  }
  if(!entries.length) return;
  toast(`正在导入 ${entries.length} 项...`);
  let n=0;
  for(const ent of entries){
    try{ n += await importEntry(ent, destDir); }catch(e){ console.warn(e); }
  }
  toast(`导入完成，共 ${n} 个文件`);
  refreshDesktop(); refreshExplorers();
}
async function importEntry(entry, destDir){
  if(entry._plainFile){
    const f = entry._plainFile;
    await fs.writeFile(await fs.uniquePath(destDir, f.name), await f.arrayBuffer());
    return 1;
  }
  if(entry.isFile){
    const f = await new Promise((res,rej)=>entry.file(res,rej));
    await fs.writeFile(await fs.uniquePath(destDir, entry.name), await f.arrayBuffer());
    return 1;
  }
  if(entry.isDirectory){
    const sub = await fs.uniquePath(destDir, entry.name);
    await fs.mkdir(sub);
    const reader = entry.createReader();
    let count = 0;
    while(true){  // readEntries 每批最多 100 条，必须循环
      const batch = await new Promise((res,rej)=>reader.readEntries(res,rej));
      if(!batch.length) break;
      for(const c of batch) count += await importEntry(c, sub);
    }
    return count;
  }
  return 0;
}

/* —— 框选（鼠标 + 触摸） —— */
(function(){
  const mq = $('#marquee');
  let sx, sy, active=false;
  function start(x, y, target){
    if(target.closest('.dicon') || target.closest('.win') || target.closest('#taskbar') || target.closest('#startmenu') || target.closest('#ctxmenu')) return false;
    sx=x; sy=y; active=true;
    return true;
  }
  function move(x, y){
    if(!active) return;
    mq.hidden = false;
    const l=Math.min(x,sx), t=Math.min(y,sy), w=Math.abs(x-sx), h=Math.abs(y-sy);
    Object.assign(mq.style, {left:l+'px', top:t+'px', width:w+'px', height:h+'px'});
    deskSel.clear();
    $$('.dicon', iconLayer).forEach(d=>{
      const r = d.getBoundingClientRect();
      if(r.left < l+w && r.right > l && r.top < t+h && r.bottom > t) deskSel.add(d.dataset.name);
    });
    paintDeskSel();
  }
  function end(){ if(!active) return; active=false; mq.hidden=true; }
  deskEl.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    if(!start(e.clientX, e.clientY, e.target)) return;
    deskSel.clear(); paintDeskSel();
    const mv=ev=>move(ev.clientX, ev.clientY);
    const up=()=>{ end(); removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
    addEventListener('mousemove',mv); addEventListener('mouseup',up);
  });
  deskEl.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    const t=e.touches[0];
    if(!start(t.clientX, t.clientY, e.target)) return;
    deskSel.clear(); paintDeskSel();
  }, {passive:true});
  deskEl.addEventListener('touchmove', e=>{ if(active){ e.preventDefault(); const t=e.touches[0]; move(t.clientX, t.clientY); } }, {passive:false});
  deskEl.addEventListener('touchend', end);
})();

      {label:'媒体播放器', icon:IC.video, action:()=>openMedia(path)},

    items.push({label:'编辑源代码', icon:IC.editor, action:()=>openHtmlEditor(path)});
  }
  if(k==='zip') items.push({label:'解压到当前目录', icon:IC.zip, action:()=>extractArchive(path)});
  if(k==='disk') items.push({label:'在虚拟机中启动', icon:IC.vm, action:()=>openVM(path)});
  items.push(null,
    {label:'复制', icon:IC.copy, action:()=>{ setClip('copy', path, opts); }},
    {label:'剪切', icon:IC.cut, action:()=>{ setClip('cut', path, opts); }},
    {label:'重命名', icon:IC.rename, action:async()=>{
      const n = await uiPrompt('重命名', ent.name); if(!n || n===ent.name) return;
      try{
        await fs.rename(path, n);
        if(opts.desk && iconPos[ent.name]){ iconPos[n]=iconPos[ent.name]; delete iconPos[ent.name]; store.set('iconPos', iconPos); }
        refreshDesktop(); refreshExplorers();
      }catch(e){ toast(e.message, true); }
    }},
    null,
    {label: isDir?'导出为 Zip 下载':'下载到本机', icon:IC.download, action:()=>exportPath(path)},

      const sel = opts.desk && deskSel.size>1 && deskSel.has(ent.name)

      if(!ok) return;
      for(const p of sel){ try{ await fs.rm(p); }catch(e){ toast(e.message,true); } }
      refreshDesktop(); refreshExplorers();

function setClip(mode, path, opts){
  const sel = opts && opts.desk && deskSel.size>1 && deskSel.has(P.base(path))
    ? [...deskSel].map(n=>P.join(DESK,n))
    : (opts && opts.selPaths && opts.selPaths.length>1 && opts.selPaths.includes(path)? opts.selPaths : [path]);
  clipboard.mode = mode; clipboard.paths = sel;
  toast(`已${mode==='copy'?'复制':'剪切'} ${sel.length} 项`);
}
async function doPaste(destDir){
  if(!clipboard.paths.length) return;
  for(const src of clipboard.paths){
    try{
      const target = await fs.uniquePath(destDir, P.base(src));
      if(clipboard.mode==='cut') await fs.move(src, target);
      else await fs.copy(src, target);
    }catch(e){ toast('粘贴失败: '+e.message, true); }
  }
  if(clipboard.mode==='cut'){ clipboard.paths=[]; clipboard.mode=null; }
  refreshDesktop(); refreshExplorers();
}

/* —— 智能打开分派：先 stat 判定目录/文件，再按类型路由 —— */
async function openPath(path){
  let st;
  try{ st = await fs.stat(path); }
  catch(e){ toast('无法访问: '+P.base(path), true); return; }
  if(st.kind==='directory'){ openExplorer(path); return; }
  const k = kindOf(st.name), e = P.ext(st.name);
  if(k==='img') return openManga(path);
  if(k==='audio' || k==='video') return openMedia(path);
  if(k==='table') return openTable(path);
  if(k==='pdf') return openPdf(path);
  if(k==='zip'){
    const ok = await uiConfirm('压缩包', `「${escapeHtml(st.name)}」是压缩文件，是否解压到当前目录？`);
    if(ok) extractArchive(path);
    return;
  }
  if(k==='disk') return openVM(path);
  if(e==='html'||e==='htm') return openHtmlEditor(path);
  if(k==='code') return openHtmlEditor(path);
  return openNotepad(path);   // 纯文本兜底：任何未知类型都能打开
}

  q('.x-mount').onclick = mountLocalFolder;
  q('.x-paste').onclick = ()=>doPaste(ex.path);
  q('.x-menu').onclick = ()=>q('.x-side').classList.toggle('open');

  let searchTimer=null;
  q('.x-search').addEventListener('input', function(){
    clearTimeout(searchTimer);
    const v = this.value.trim();
    searchTimer = setTimeout(async ()=>{
      if(!v){ ex.searchResults=null; ex.refresh(); return; }
      ex.searchResults = await fs.search(ex.path, v);

  q('.x-search').addEventListener('pointerdown', e=>e.stopPropagation());

  ex.nav = (p)=>{
    ex.path = P.norm(p);
    ex.hist = ex.hist.slice(0, ex.hi+1); ex.hist.push(ex.path); ex.hi++;
    ex.sel.clear(); ex.searchResults=null;
    q('.x-search').value='';
    q('.x-side').classList.remove('open');
    ex.refresh();
  };

  ex.renderSide = ()=>{
    const side = q('.x-side');

      const d = el('div','ex-nav'+(ex.path===n.path?' on':''));

      side.appendChild(d);
    }
    const mounts = FS.mounts.filter(m=>m.prefix.startsWith('/mnt/local/'));
    side.appendChild(el('h4', null, '本地挂载'));
    if(!mounts.length) side.appendChild(el('div','ex-nav', `<span style="color:var(--faint);font-size:11.5px">尚未挂载</span>`));
    for(const m of mounts){
      const d = el('div','ex-nav'+(ex.path.startsWith(m.prefix)?' on':''));
      d.innerHTML = `${IC.mount}<span>${escapeHtml(P.base(m.prefix))}</span><span class="unmount" title="卸载">${IC.close}</span>`;
      d.onclick = e=>{ if(e.target.closest('.unmount')){ unmountLocal(m.prefix); } else ex.nav(m.prefix); };
      side.appendChild(d);
    }
    const mb = el('div','ex-nav');
    mb.innerHTML = `${IC.plus}<span style="color:var(--acc2)">挂载文件夹…</span>`;
    mb.onclick = mountLocalFolder;
    side.appendChild(mb);
  };

  ex.renderBread = ()=>{
    const b = q('.x-bread');
    b.innerHTML='';
    const parts = P.parts(ex.path);
    const root = el('span','crumb'+(parts.length?'':' last'), '根目录');
    root.onclick = ()=>ex.nav('/');
    b.appendChild(root);
    let acc='';
    parts.forEach((p,i)=>{
      acc += '/'+p;
      b.appendChild(el('span','crumb-sep','›'));
      const c = el('span','crumb'+(i===parts.length-1?' last':''), escapeHtml(p));
      const target = acc;
      c.onclick = ()=>ex.nav(target);
      b.appendChild(c);
    });
    b.scrollLeft = b.scrollWidth;
  };

  const COLS = [
    {key:'name', label:'名称', flex:true},
    {key:'mtime', label:'修改日期'},
    {key:'type', label:'类型'},
    {key:'size', label:'大小'},
  ];
  ex.renderHead = ()=>{
    const h = q('.x-head');
    h.innerHTML='';
    for(const c of COLS){
      const d = el('div','ex-col');
      d.style.cssText = c.flex? 'flex:1;min-width:120px' : `width:${exCols[c.key]}px;flex:0 0 ${exCols[c.key]}px`;
      if(c.key==='type') d.classList.add('c-type');
      d.innerHTML = `<span>${c.label}</span>` + (ex.sort.key===c.key?`<span class="sort-a">${ex.sort.dir>0?'▲':'▼'}</span>`:'');
      d.onclick = ()=>{
        if(ex.sort.key===c.key) ex.sort.dir*=-1; else ex.sort={key:c.key, dir:1};
        ex.renderHead(); ex.renderList();
      };
      if(!c.flex){
        const rz = el('div','col-rz');
        rz.addEventListener('pointerdown', e=>{
          e.preventDefault(); e.stopPropagation();
          const sx=e.clientX, sw=exCols[c.key];
          const mv=ev=>{ exCols[c.key]=clamp(sw+ev.clientX-sx, 60, 320); ex.renderHead(); ex.renderList(); };
          const up=()=>{ store.set('excols', exCols); removeEventListener('pointermove',mv); removeEventListener('pointerup',up); };
          addEventListener('pointermove',mv); addEventListener('pointerup',up);
        });
        rz.onclick = e=>e.stopPropagation();
        d.appendChild(rz);
      }
      h.appendChild(d);
    }
  };

  ex.refresh = async ()=>{
    if(!windows.has(w.id)){ explorerSet.delete(ex); return; }
    w.setTitle('文件管理器 — '+(ex.path==='/'?'根目录':P.base(ex.path)));
    w.el._exDropDir = ex.path;
    ex.renderSide(); ex.renderBread(); ex.renderHead();
    try{
      const list = await fs.readdir(ex.path);
      ex.entries = await Promise.all(list.map(async it=>{
        let st={size:0, mtime:0};
        try{ st = await fs.stat(P.join(ex.path, it.name)); }catch(e){}
        return {...it, size:st.kind==='file'?st.size:null, mtime:st.mtime||0,
          type: it.kind==='directory'?'文件夹':(P.ext(it.name)?P.ext(it.name).toUpperCase()+' 文件':'文件')};
      }));
    }catch(e){ ex.entries = []; toast('无法读取目录: '+e.message, true); }
    ex.renderList();
  };

  ex.sortedEntries = ()=>{
    const {key, dir} = ex.sort;
    return [...ex.entries].sort((a,b)=>{
      if(a.kind!==b.kind) return a.kind==='directory'? -1 : 1;
      let r=0;
      if(key==='name') r = natCmp(a.name, b.name);
      else if(key==='mtime') r = (a.mtime||0)-(b.mtime||0);
      else if(key==='size') r = (a.size||0)-(b.size||0);
      else if(key==='type') r = natCmp(a.type, b.type) || natCmp(a.name,b.name);
      return r*dir;
    });
  };

  ex.renderList = ()=>{
    const list = ex.listEl;
    list.innerHTML='';
    const items = ex.searchResults
      ? ex.searchResults.map(r=>({...r, size:null, mtime:0, type:r.kind==='directory'?'文件夹':(P.ext(r.name)||'').toUpperCase()+' 文件', _sr:true}))
      : ex.sortedEntries();
    if(!items.length){
      list.innerHTML = `<div class="ex-empty">${IC.folderOpen}<div>${ex.searchResults?'未找到匹配项':'此文件夹为空'}</div></div>`;
    }
    items.forEach(ent=>{
      const path = ent._sr? ent.path : P.join(ex.path, ent.name);
      const row = el('div','ex-row');
      row.dataset.kind = ent.kind; row._exPath = ent.kind==='directory'? path : null;
      row.draggable = true;
      if(ex.sel.has(path)) row.classList.add('sel');
      const c1 = el('div','ex-cell');
      c1.style.cssText='flex:1;min-width:120px';
      c1.innerHTML = `${iconFor(ent)}<span class="rn-lb">${escapeHtml(ent._sr? ent.path : ent.name)}</span>`;
      const c2 = el('div','ex-cell dim'); c2.style.cssText=`width:${exCols.mtime}px;flex:0 0 ${exCols.mtime}px`; c2.textContent = fmtDate(ent.mtime);
      const c3 = el('div','ex-cell dim c-type'); c3.style.cssText=`width:${exCols.type}px;flex:0 0 ${exCols.type}px`; c3.textContent = ent.type;
      const c4 = el('div','ex-cell dim'); c4.style.cssText=`width:${exCols.size}px;flex:0 0 ${exCols.size}px`; c4.textContent = ent.kind==='directory'?'—':fmtSize(ent.size);
      row.append(c1,c2,c3,c4);

      if(ent.kind==='file'){
        row.addEventListener('mouseenter', ()=>preloadDrag(path));
        row.addEventListener('pointerdown', ()=>preloadDrag(path));
      }
      row.addEventListener('click', e=>{
        if(row._justDragged) return;
        if(e.ctrlKey||e.metaKey){ ex.sel.has(path)? ex.sel.delete(path) : ex.sel.add(path); }
        else if(e.shiftKey && ex._lastClick!=null){
          const rows = [...list.children].filter(x=>x.classList.contains('ex-row'));
          const i1 = rows.indexOf(row), i0 = ex._lastClick;
          ex.sel.clear();
          rows.slice(Math.min(i0,i1), Math.max(i0,i1)+1).forEach((r,i)=>{ const idx=rows.indexOf(r); ex.sel.add(items[idx]._sr? items[idx].path : P.join(ex.path, items[idx].name)); });
        }
        else{ ex.sel = new Set([path]); }
        ex._lastClick = [...list.children].filter(x=>x.classList.contains('ex-row')).indexOf(row);
        ex.paintSel();
        if(isTouch && !e.ctrlKey){ openPath(path); }
        ex.updateStatus(items);
      });
      row.addEventListener('dblclick', ()=>openPath(path));
      row.addEventListener('contextmenu', e=>{
        e.preventDefault(); e.stopPropagation();
        if(!ex.sel.has(path)){ ex.sel = new Set([path]); ex.paintSel(); }
        showCtxMenu(e.clientX, e.clientY, entryMenu(path, ent, {selPaths:[...ex.sel]}));
      });
      /* 拖拽（原生 DnD） */
      row.addEventListener('dragstart', e=>{
        if(!ex.sel.has(path)){ ex.sel = new Set([path]); ex.paintSel(); }
        const paths = [...ex.sel];
        e.dataTransfer.effectAllowed='copyMove';
        e.dataTransfer.setData('application/x-vos', JSON.stringify({paths, src:ex.path}));
        const c = dragCache.get(path);
        if(c && paths.length===1){
          try{ e.dataTransfer.items.add(c.file); }catch(err){}
          try{ e.dataTransfer.setData('DownloadURL', `${c.mime}:${c.name}:${c.url}`); }catch(err){}
        }
      });
      row.addEventListener('dragend', ()=>{ setTimeout(()=>{ const c=dragCache.get(path); if(c){ URL.revokeObjectURL(c.url); dragCache.delete(path); } }, 6000); });
      if(ent.kind==='directory'){
        row.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); row.classList.add('drophint'); });
        row.addEventListener('dragleave', ()=>row.classList.remove('drophint'));
        row.addEventListener('drop', async e=>{
          e.preventDefault(); e.stopPropagation();
          row.classList.remove('drophint');
          await handleDropInto(e, path);
          ex.refresh();
        });
      }
      if(isTouch) attachExTouchDrag(row, ent, path, ex);
      list.appendChild(row);
    });
    ex.updateStatus(items);
  };
  ex.paintSel = ()=>{ $$('.ex-row', ex.listEl).forEach((r,i)=>{}); [...ex.listEl.children].forEach(r=>{ if(!r.classList.contains('ex-row')) return; const lb=r.querySelector('.rn-lb'); }); 
    const rows=[...ex.listEl.querySelectorAll('.ex-row')];
    const items = ex.searchResults? ex.searchResults : ex.sortedEntries();
    rows.forEach((r,i)=>{ const p = items[i]._sr? items[i].path : P.join(ex.path, items[i].name); r.classList.toggle('sel', ex.sel.has(p)); });
  };
  ex.updateStatus = (items)=>{
    q('.x-status').innerHTML = `<span>${items.length} 个项目</span>` + (ex.sel.size?`<span style="color:var(--acc)">已选 ${ex.sel.size} 项</span>`:'') + (FS.usingFallback?'<span style="color:var(--danger)">降级模式: IndexedDB</span>':'<span>OPFS</span>');
  };

  /* 列表空白处：drop 导入/移动、框选、右键 */
  ex.listEl.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); });
  ex.listEl.addEventListener('drop', async e=>{
    e.preventDefault(); e.stopPropagation();
    await handleDropInto(e, ex.path);
    ex.refresh();
  });
  ex.listEl.addEventListener('contextmenu', e=>{
    if(e.target.closest('.ex-row')) return;
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY, [
      {label:'刷新', icon:IC.refresh, action:()=>ex.refresh()},
      null,
      {label:'新建文件夹', icon:IC.folder, action:()=>q('.x-newdir').click()},
      {label:'新建文件', icon:IC.text, action:()=>q('.x-newfile').click()},
      {label:'上传文件', icon:IC.upload, action:()=>pickImport(ex.path)},
      {label:'粘贴', icon:IC.paste, hidden:!clipboard.paths.length, action:()=>doPaste(ex.path)},
    ]);
  });
  /* 框选 */
  ex.listEl.addEventListener('mousedown', e=>{
    if(e.button!==0 || e.target.closest('.ex-row')) return;
    const mq = $('#marquee');
    const sx=e.clientX, sy=e.clientY;
    ex.sel.clear(); ex.paintSel();
    const mv = ev=>{
      mq.hidden=false;
      const l=Math.min(ev.clientX,sx), t=Math.min(ev.clientY,sy), ww=Math.abs(ev.clientX-sx), hh=Math.abs(ev.clientY-sy);
      Object.assign(mq.style,{left:l+'px',top:t+'px',width:ww+'px',height:hh+'px'});
      const items = ex.searchResults? ex.searchResults : ex.sortedEntries();
      const rows=[...ex.listEl.querySelectorAll('.ex-row')];
      ex.sel.clear();
      rows.forEach((r,i)=>{
        const rr=r.getBoundingClientRect();
        if(rr.left<l+ww && rr.right>l && rr.top<t+hh && rr.bottom>t) ex.sel.add(items[i]._sr? items[i].path : P.join(ex.path, items[i].name));
      });
      ex.paintSel();
    };
    const up = ()=>{ mq.hidden=true; removeEventListener('mousemove',mv); removeEventListener('mouseup',up); ex.updateStatus(ex.searchResults||ex.sortedEntries()); };
    addEventListener('mousemove',mv); addEventListener('mouseup',up);
  });

  ex.refresh();
  return ex;
}
function attachExTouchDrag(row, ent, path, ex){
  let t0=null, ghost=null, moved=false, lp=null;
  row.addEventListener('touchstart', e=>{
    const t=e.touches[0]; t0={x:t.clientX,y:t.clientY}; moved=false;
    lp = setTimeout(()=>{ lp=null; if(!moved){ navigator.vibrate&&navigator.vibrate(20); row._justDragged=true; setTimeout(()=>row._justDragged=false, 800); showCtxMenu(t0.x,t0.y, entryMenu(path, ent, {})); t0=null; } }, 550);
  }, {passive:true});
  row.addEventListener('touchmove', e=>{
    if(!t0) return;
    const t=e.touches[0];
    if(!moved && Math.hypot(t.clientX-t0.x,t.clientY-t0.y)<14) return;
    moved=true;
    if(lp){clearTimeout(lp); lp=null;}
    e.preventDefault();
    if(!ghost){ ghost=el('div','touch-ghost', `<div style="background:var(--bg3);border:1px solid var(--acc);border-radius:8px;padding:6px 12px;font-size:12px">${escapeHtml(ent.name)}</div>`); document.body.appendChild(ghost); }
    ghost.style.left=t.clientX+'px'; ghost.style.top=t.clientY+'px';
  }, {passive:false});
  row.addEventListener('touchend', async e=>{
    if(lp){clearTimeout(lp); lp=null;}
    if(!t0 || !ghost){ t0=null; return; }
    t0=null;
    const t=e.changedTouches[0];
    ghost.remove(); ghost=null;
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const overRow = target && target.closest('.ex-row');
    const overWin = target && target.closest('.win');
    try{
      if(overRow && overRow._exPath && overRow._exPath!==path){
        await fs.move(path, await fs.uniquePath(overRow._exPath, ent.name));
        refreshDesktop(); refreshExplorers();
      }else if(!overWin){
        await fs.move(path, await fs.uniquePath(DESK, ent.name));
        toast('已移动到桌面');
        refreshDesktop(); refreshExplorers();
      }else if(overWin._exDropDir && overWin._exDropDir!==P.parent(path)){
        await fs.move(path, await fs.uniquePath(overWin._exDropDir, ent.name));
        refreshDesktop(); refreshExplorers();
      }
    }catch(err){ toast(err.message, true); }
  });
}
