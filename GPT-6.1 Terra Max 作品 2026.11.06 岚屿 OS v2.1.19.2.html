        try{const [estimate,opfs,idb]=await Promise.all([navigator.storage?.estimate?.()||Promise.resolve({}),fs.backends.has('/opfs')?fs.folderSize('/opfs'):Promise.resolve(0),fs.folderSize('/indexeddb')]);if(current!=='storage'||!win.el.isConnected)return;const used=estimate.usage??null,quota=estimate.quota??null,other=used==null?null:Math.max(0,used-(opfs||0)-(idb||0));$('.storage-summary',body).innerHTML=`<strong style="font-size:18px;color:var(--text)">${formatSize(used)}</strong> <span style="color:var(--muted)">已用 / ${formatSize(quota)} 可用配额</span>`;$('.stat-opfs',body).textContent=formatSize(opfs);$('.stat-idb',body).textContent=formatSize(idb);$('.stat-other',body).textContent=formatSize(other);if(quota){$('.bar-opfs',body).style.width=Math.min(100,(opfs||0)/quota*100)+'%';$('.bar-idb',body).style.width=Math.min(100,(idb||0)/quota*100)+'%';$('.bar-other',body).style.width=Math.min(100,(other||0)/quota*100)+'%'}}catch(e){if(current==='storage')$('.storage-summary',body).textContent='无法计算用量：'+explainError(e)}}
      else if(id==='apps'){body.innerHTML=`<div class="eyebrow">YOUR DESKTOP</div><h2>应用与任务栏</h2><p class="intro">隐藏不常用的系统应用，留出呼吸的空间。</p><div class="setting-group"><h3>显示应用</h3>${apps.map(app=>row(app.label,app.desc,`<input class="switch app-toggle" type="checkbox" data-app="${app.id}" ${settings.hiddenApps.includes(app.id)?'':'checked'} aria-label="显示${app.label}">`)).join('')}</div><p style="color:var(--muted);font-size:11px">隐藏的应用不会出现在桌面、任务栏或开始菜单，正在运行的窗口仍会显示。</p>`;$$('.app-toggle',body).forEach(input=>input.onchange=()=>{settings.hiddenApps=settings.hiddenApps.filter(x=>x!==input.dataset.app);if(!input.checked)settings.hiddenApps.push(input.dataset.app);saveSettings();renderDesktop();renderTaskbar()})}
      else{const ua=navigator.userAgent;const browser=/Edg\//.test(ua)?'Microsoft Edge':/Firefox\//.test(ua)?'Firefox':/Chrome\//.test(ua)?'Chrome / Chromium':/Safari\//.test(ua)?'Safari':'未知浏览器';body.innerHTML=`<div class="eyebrow">SYSTEM / PREFERENCES</div><h2>系统</h2><p class="intro">管理时间、默认位置与本地数据。</p><div class="setting-group"><h3>常规</h3>${row('24 小时制','关闭时使用 12 小时制。',toggle('hour24'))}${row('默认存储位置','新桌面和新文件使用此后端；切换不会迁移已有文件。',`<select class="backend"><option value="opfs" ${fs.backends.has('/opfs')?'':'disabled'}>OPFS</option><option value="indexeddb">IndexedDB</option></select>`)}${row('浏览器',escapeHTML(browser),'')}${row('安全上下文',window.isSecureContext?'已启用，支持受保护的浏览器 API。':'未启用。请使用 HTTPS 或 localhost。','')}</div><div class="setting-group"><h3>数据管理</h3><p style="color:var(--muted);font-size:11px;line-height:1.7">重置会删除 OPFS 和 IndexedDB 中的所有岚屿文件与设置，不会删除已挂载的真实文件夹。</p><button class="btn danger reset">${svg('trash')}重置文件系统</button></div><div class="setting-group"><h3>关于岚屿</h3><p style="color:var(--muted);font-size:11px;line-height:1.8">LANYU OS · 本地优先的浏览器桌面<br>文件存储由浏览器管理；外部组件在需要时加载。</p></div>`;$('.backend',body).value=settings.backend;$('.backend',body).onchange=e=>{settings.backend=e.target.value;saveSettings();renderDesktop();notify('默认存储位置已切换，两个存储中的文件仍然保留。')};$('.reset',body).onclick=async()=>{const confirmed=await modal({title:'重置文件系统',message:'这将永久删除两个浏览器存储中的全部文件。真实挂载文件夹不会被删除。请先备份。',value:null,ok:'永久重置',danger:true});if(!confirmed)return;try{await fs.reset();location.reload()}catch(e){report(e)}};wireToggles()}}
    win.showSection=draw;draw(section);return win;
  }
  $('#wallpaper-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){notify('请选择图片文件。',true);return}try{const root=fs.backends.has('/opfs')?'/opfs':'/indexeddb';await fs.mkdir(root+'/.lanyu');const path=root+'/.lanyu/wallpaper';await fs.writeFile(path,file,{type:file.type,mtime:file.lastModified});settings.wallpaper='custom';settings.wallpaperPath=path;saveSettings();await applyWallpaper();const win=state.windows.find(w=>w.app==='settings');win?.showSection?.('appearance');notify('自定义壁纸已保存。')}catch(error){report(error)}});
  // Start directly on the desktop; initialization indicators only describe real I/O.
  applyTheme();applyWallpaper();updateClock();setInterval(updateClock,30000);renderTaskbar();
  let desktopRefreshTimer=0;document.addEventListener('fschange',()=>{clearTimeout(desktopRefreshTimer);desktopRefreshTimer=setTimeout(()=>renderDesktop().catch(console.warn),140)});
  $('#desktop-icons').addEventListener('pointerdown',()=>{state.desktopActive=true;for(const win of state.windows){win.active=false;win.el.classList.add('inactive')}renderTaskbar()});
  document.addEventListener('keydown',e=>{if(!state.desktopActive||e.target.closest('input,textarea,[contenteditable="true"]'))return;const mod=e.ctrlKey||e.metaKey;const selected=[...state.desktopSelection].filter(id=>id.startsWith('file:')).map(id=>id.slice(5));if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();state.desktopSelection=new Set($$('.desktop-item',$('#desktop-icons')).map(el=>el.dataset.id));selectElements($('#desktop-icons'),'.desktop-item',state.desktopSelection)}if(mod&&e.key.toLowerCase()==='c'){e.preventDefault();state.clipboard={paths:selected,cut:false};notify('已复制选中的文件')}if(mod&&e.key.toLowerCase()==='x'){e.preventDefault();state.clipboard={paths:selected,cut:true};notify('已剪切选中的文件')}if(mod&&e.key.toLowerCase()==='v'){e.preventDefault();pasteInto(fs.desktop).catch(report)}if(e.key==='Delete'&&selected.length)deletePaths(selected).catch(report);if(e.key==='F2'&&selected.length===1)renamePath(selected[0]).catch(report)});
  fs.ready=(async()=>{try{await fs.init()}catch(error){console.error('Storage initialization failed',error);db.db=null;metadata.map.clear();metadata.fallbackRoot=null;fs.backends.clear();fs.mounts.clear();fs.backends.set('/indexeddb',new IndexedBackend(db));settings.backend='indexeddb';await fs.initSeed();state.bootWarning='持久化存储初始化失败，当前使用临时内存。请通过 HTTPS 或 localhost 打开并检查浏览器存储权限。'}state.fsReady=true;await applyWallpaper();await renderDesktop();renderTaskbar();openExplorer('/'+settings.backend);if(state.bootWarning)notify(state.bootWarning,true);if(state.pendingMounts.length)notify(`${state.pendingMounts.length} 个本地文件夹需要在设置中重新授权。`);return fs})();
  </script>
