<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d04">
<title>酸柠 OS · Sour Lemon Web OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Unbounded:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" defer></script>
<style>
:root{--accent:#e8ff1f;--hot:#ff4f6a;--mint:#3dffc0;--orange:#ff9a1f;--r:4px;--tb-h:54px;--icon:76px;
--font-d:'ZCOOL QingKe HuangYou','Unbounded','Noto Sans SC',sans-serif;
--font-b:'Familjen Grotesk','Noto Sans SC',system-ui,sans-serif;
--font-m:'DM Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
--ease:cubic-bezier(.2,.9,.25,1.1);--ease2:cubic-bezier(.22,1,.36,1)}
[data-theme=dark]{--bg:#090c03;--bg2:#0f1407;--surf:#141a09;--surf2:#1c2410;--surf3:#273317;--line:#35441e;--txt:#f1f6d0;--mut:#93a26c;--accent-ink:var(--accent);--glass:rgba(12,16,6,.84);--shade:rgba(0,0,0,.55);--ink:#0c1004}
[data-theme=light]{--bg:#f5f8e0;--bg2:#edf2cd;--surf:#fcfdf0;--surf2:#f0f4d4;--surf3:#e2e9b4;--line:#c4cf86;--txt:#1b2208;--mut:#667240;--accent-ink:color-mix(in oklab,var(--accent) 30%,#1b2208);--glass:rgba(250,252,230,.86);--shade:rgba(60,70,10,.28);--ink:#10150a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:400 calc(14px*var(--fs,1))/1.45 var(--font-b);overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{display:block;flex:none}
*{scrollbar-width:thin;scrollbar-color:var(--surf3) transparent}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--surf3);border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:padding-box;border:2px solid transparent}::-webkit-scrollbar-corner{background:transparent}
#os{position:absolute;inset:0;overflow:hidden;height:100dvh}
#wallpaper{position:absolute;inset:0;background-color:var(--bg);transition:opacity .5s}
#wallpaper::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.35),transparent 60%);pointer-events:none}
#workarea{position:absolute;left:0;right:0;top:0;bottom:calc(var(--tb-h) + env(safe-area-inset-bottom,0px))}
body.tb-top #workarea{top:var(--tb-h);bottom:0}
#icons{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#windows{position:absolute;inset:0;pointer-events:none}
.marquee{position:absolute;border:1.5px solid var(--accent);background:color-mix(in oklab,var(--accent) 15%,transparent);pointer-events:none;z-index:60}
/* desktop icons */
.dicon{position:absolute;width:calc(var(--icon) + 24px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px 5px;border:1.5px solid transparent;border-radius:var(--r);cursor:pointer;transition:left .3s var(--ease),top .3s var(--ease),background .15s,border-color .15s,opacity .2s;-webkit-user-drag:element;animation:pop-in .45s var(--ease) both}
.dicon .di{width:var(--icon);height:var(--icon);display:grid;place-items:center;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35));transition:transform .2s var(--ease)}
.dicon:hover .di{transform:translateY(-3px) rotate(-2deg)}
.dicon .dl{font-size:12.5px;line-height:1.25;text-align:center;max-width:100%;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#fff;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.8);padding:1px 4px}
[data-theme=light] .dicon .dl{color:#1b2208;text-shadow:0 0 5px rgba(255,255,255,.9)}
.dicon.sel{background:color-mix(in oklab,var(--accent) 24%,transparent);border-color:var(--accent)}
.dicon.sel .dl{background:var(--accent);color:var(--ink);text-shadow:none}
.dicon.dragging{opacity:.35}.dicon.noanim{transition:none}.dicon.drop-hover,.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px;background:color-mix(in oklab,var(--accent) 22%,transparent)}
.dicon.lifted,.fm-item.lifted{transform:scale(1.06);opacity:.85}
@keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
/* windows */
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:6px 6px 0 var(--shade);--tt:var(--surf3);min-width:280px;min-height:160px;transition:opacity .22s,transform .25s var(--ease2),box-shadow .2s,border-color .2s;animation:win-in .32s var(--ease) both}
.win.active{border-color:var(--accent);box-shadow:7px 7px 0 color-mix(in oklab,var(--accent) 38%,transparent),0 24px 60px rgba(0,0,0,.45);--tt:var(--accent)}
.win.animating{transition:left .28s var(--ease2),top .28s var(--ease2),width .28s var(--ease2),height .28s var(--ease2),opacity .22s,transform .25s var(--ease2)}
.win.min{opacity:0;transform:translateY(40px) scale(.85);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .25s var(--ease2),visibility 0s .25s}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0 0 0 0}
.win.closing{opacity:0;transform:scale(.92);transition:opacity .16s,transform .16s}
.win.fs{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100dvh!important;border-radius:0;border:0;z-index:99990!important;transform:none!important;animation:none}
@keyframes win-in{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
.win-title{position:relative;height:38px;flex:none;display:flex;align-items:center;gap:8px;padding-left:10px;background:var(--tt);color:var(--mut);user-select:none;-webkit-user-select:none;touch-action:none;cursor:default}
.win.active .win-title{color:var(--ink)}
.win-title::after{content:'';position:absolute;left:0;right:0;top:100%;height:5px;z-index:3;pointer-events:none;background:linear-gradient(135deg,var(--tt) 50%,transparent 50%) 0 0/8px 5px repeat-x,linear-gradient(225deg,var(--tt) 50%,transparent 50%) 0 0/8px 5px repeat-x}
.win.max .win-title::after,.win.fs .win-title::after{display:none}
.win-ico{width:18px;height:18px;display:grid;place-items:center}
.win-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 16px/1 var(--font-d);letter-spacing:.04em}
.win-ctl{display:flex;height:100%}
.win-ctl button{width:44px;height:100%;border:0;background:transparent;display:grid;place-items:center;color:inherit;transition:background .12s,color .12s}
.win-ctl button:hover{background:rgba(0,0,0,.18)}
.win-ctl button.cls:hover{background:var(--hot);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;margin-top:0}
.rz{position:absolute;z-index:5;touch-action:none}
.rz[data-d=n]{top:-5px;left:10px;right:10px;height:9px;cursor:ns-resize}.rz[data-d=s]{bottom:-5px;left:10px;right:10px;height:9px;cursor:ns-resize}
.rz[data-d=e]{right:-5px;top:10px;bottom:10px;width:9px;cursor:ew-resize}.rz[data-d=w]{left:-5px;top:10px;bottom:10px;width:9px;cursor:ew-resize}
.rz[data-d=ne]{right:-5px;top:-5px;width:16px;height:16px;cursor:nesw-resize}.rz[data-d=nw]{left:-5px;top:-5px;width:16px;height:16px;cursor:nwse-resize}
.rz[data-d=se]{right:-5px;bottom:-5px;width:16px;height:16px;cursor:nwse-resize}.rz[data-d=sw]{left:-5px;bottom:-5px;width:16px;height:16px;cursor:nesw-resize}
.win.max .rz,.win.fs .rz{display:none}
body.wm-busy iframe,body.wm-busy video,body.wm-busy canvas{pointer-events:none!important}
body.wm-busy{user-select:none}
body.peeking .win:not(.peek-target){opacity:.07!important;pointer-events:none}
body.peek-desktop .win{opacity:.0!important;pointer-events:none}
body.peek-desktop .win{transform:scale(.97)}
#snap-preview{position:absolute;z-index:9000;pointer-events:none;border:2px dashed var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent);border-radius:var(--r);opacity:0;transition:all .18s var(--ease2)}
#snap-preview.on{opacity:1}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation-duration:.001s!important;transition-duration:.001s!important}
/* taskbar */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tb-h) + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);display:flex;align-items:stretch;gap:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:2px solid var(--accent);z-index:9500}
body.tb-top #taskbar{top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--accent)}
body.no-glass #taskbar,body.no-glass .pop{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surf)}
#start-btn{align-self:center;height:38px;display:flex;align-items:center;gap:8px;padding:0 14px 0 9px;border:0;background:var(--accent);color:var(--ink);font:400 17px/1 var(--font-d);letter-spacing:.06em;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:filter .15s,transform .2s var(--ease)}
#start-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
#start-btn svg{transition:transform .5s var(--ease)}#start-btn:hover svg,#start-btn.open svg{transform:rotate(180deg)}
#task-items{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;align-items:stretch;scrollbar-width:none;padding-left:4px}
#task-items::-webkit-scrollbar{display:none}
.tk{position:relative;flex:0 1 168px;min-width:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:transparent;border:0;color:var(--txt);transition:background .15s;animation:pop-in .3s var(--ease) both}
body:not(.tb-labels) .tk{flex:none;width:50px;justify-content:center}body:not(.tb-labels) .tk span{display:none}
.tk span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;text-align:left}
.tk:hover{background:color-mix(in oklab,var(--accent) 14%,transparent)}
.tk::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:3px;background:var(--mut);opacity:.5;transform:scaleX(.3);transition:transform .25s var(--ease),background .2s,opacity .2s}
.tk.on::after{background:var(--accent);opacity:1;transform:scaleX(1)}
.tk.mini{opacity:.65}.tk.mini::after{transform:scaleX(.2)}
.tk .tx{width:18px;height:18px;display:grid;place-items:center;opacity:0;border-radius:2px}.tk:hover .tx{opacity:.8}.tk .tx:hover{background:var(--hot);color:#fff;opacity:1}
#tray{display:flex;align-items:center;gap:2px}
.tray-btn{height:100%;min-width:38px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;background:transparent;border:0;transition:background .15s;font-family:var(--font-m);font-size:12.5px}
.tray-btn:hover{background:color-mix(in oklab,var(--accent) 16%,transparent)}
#clock{flex-direction:column;gap:0;line-height:1.2;text-align:right;min-width:78px}#clock b{font-weight:500;font-size:13.5px}#clock small{font-size:11px;color:var(--mut)}
#show-desk{width:10px;padding:0;margin-left:4px;border-left:1.5px solid var(--line);flex:none;min-width:10px}
#show-desk:hover{background:var(--accent)}
.pop{position:absolute;z-index:9400;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1.5px solid var(--accent);border-radius:var(--r);box-shadow:8px 8px 0 var(--shade);transform-origin:bottom left;transition:opacity .2s,transform .28s var(--ease);}
.pop[hidden]{display:block!important;opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;visibility:hidden;transition:opacity .15s,transform .2s,visibility 0s .2s}
#start-menu{left:8px;bottom:calc(var(--tb-h) + 10px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 16px));height:min(620px,calc(100dvh - var(--tb-h) - 30px));display:flex;flex-direction:column;overflow:hidden}
body.tb-top #start-menu{bottom:auto;top:calc(var(--tb-h) + 10px)}
.sm-head{padding:14px 14px 18px;background:var(--accent);color:var(--ink);position:relative;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sm-head::after{content:'';position:absolute;left:0;right:0;top:100%;height:8px;background:linear-gradient(135deg,var(--accent) 50%,transparent 50%) 0 0/12px 8px repeat-x,linear-gradient(225deg,var(--accent) 50%,transparent 50%) 0 0/12px 8px repeat-x}
.sm-brand{font:400 28px/1 var(--font-d);letter-spacing:.06em;flex:1;min-width:130px}.sm-brand small{display:block;font:500 10px/1.6 var(--font-m);letter-spacing:.3em;opacity:.7}
.sm-head .inp{flex:1 1 200px;background:rgba(255,255,255,.45);border-color:rgba(0,0,0,.3);color:#10150a}
.sm-head .inp::placeholder{color:rgba(16,21,10,.6)}
.sm-body{flex:1;overflow:auto;padding:18px 12px 8px}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;background:var(--surf2);border:1.5px solid transparent;color:var(--txt);transition:all .18s var(--ease);animation:pop-in .35s var(--ease) both;border-radius:var(--r)}
.sm-app:hover{background:var(--accent);color:var(--ink);transform:translate(-2px,-2px) rotate(-1.5deg);box-shadow:3px 3px 0 var(--shade)}
.sm-app .ai{width:38px;height:38px;display:grid;place-items:center}
.sm-app span{font-size:12.5px}
.sm-sec{font:500 11px var(--font-m);letter-spacing:.2em;color:var(--mut);margin:4px 2px 8px;text-transform:uppercase}
.sm-res{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:transparent;border:0;border-bottom:1px dashed var(--line);text-align:left}
.sm-res:hover{background:var(--surf2)}.sm-res small{color:var(--mut);display:block;font-size:11px}
.sm-foot{display:flex;gap:6px;padding:8px 10px;border-top:1.5px solid var(--line);background:var(--surf)}
.sm-foot .btn{flex:1}
#cal-pop{right:8px;bottom:calc(var(--tb-h) + 10px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100vw - 16px));padding:14px;transform-origin:bottom right}
body.tb-top #cal-pop{bottom:auto;top:calc(var(--tb-h) + 10px)}
.cal-big{font:400 40px/1 var(--font-d);letter-spacing:.04em}.cal-date{color:var(--mut);margin-bottom:10px}
.cal-nav{display:flex;align-items:center;gap:6px;margin:8px 0}.cal-nav b{flex:1;font:400 18px var(--font-d);cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid i{font-style:normal;font-size:11px;color:var(--mut);padding:3px 0;font-family:var(--font-m)}
.cal-grid button{aspect-ratio:1;border:1.5px solid transparent;background:transparent;font-family:var(--font-m);font-size:12.5px;transition:all .12s}
.cal-grid button:hover{border-color:var(--accent)}.cal-grid button.o{color:var(--mut);opacity:.55}
.cal-grid button.today{background:var(--accent);color:var(--ink);font-weight:700}.cal-grid button.pick{border-color:var(--hot);color:var(--hot)}
#peek-card{position:absolute;z-index:9450;width:220px;padding:8px;background:var(--glass);backdrop-filter:blur(16px);border:1.5px solid var(--accent);box-shadow:5px 5px 0 var(--shade);pointer-events:none;transition:opacity .15s,transform .2s var(--ease)}
#peek-card[hidden]{display:block!important;opacity:0;transform:translateY(8px);visibility:hidden}
.pk-h{display:flex;gap:6px;align-items:center;font-size:12px}.pk-b{margin-top:6px;height:96px;background:repeating-linear-gradient(45deg,var(--surf2) 0 8px,var(--surf) 8px 16px);display:grid;place-items:center;color:var(--accent-ink)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 12px;background:var(--surf2);border:1.5px solid var(--line);border-radius:var(--r);color:var(--txt);white-space:nowrap;transition:transform .12s var(--ease),background .12s,color .12s,box-shadow .12s,border-color .12s;user-select:none;-webkit-user-select:none}
.btn:hover:not(:disabled){background:var(--accent);color:var(--ink);border-color:var(--accent);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--shade)}
.btn:active:not(:disabled){transform:none;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.dan:hover:not(:disabled){background:var(--hot);border-color:var(--hot);color:#fff}
.btn.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.sq{padding:0;width:30px}.btn.sm{min-height:26px;padding:0 8px;font-size:12.5px}
.inp,select.inp,textarea.inp{min-height:30px;padding:3px 9px;background:var(--bg2);border:1.5px solid var(--line);border-radius:var(--r);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
.inp:focus{border-color:var(--accent);box-shadow:3px 3px 0 color-mix(in oklab,var(--accent) 30%,transparent)}
select.inp{padding-right:4px;cursor:pointer}select.inp option{background:var(--surf);color:var(--txt)}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:22px;background:var(--surf3);border:1.5px solid var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;border-radius:var(--r)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;background:var(--mut);transition:transform .25s var(--ease),background .2s;border-radius:calc(var(--r)/2)}
.sw:checked{background:var(--accent);border-color:var(--accent)}.sw:checked::after{transform:translateX(18px);background:var(--ink)}
input[type=range]{accent-color:var(--accent);min-width:0}
input[type=checkbox].ck{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--mut);background:var(--bg2);display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none;border-radius:2px}
input[type=checkbox].ck:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox].ck:checked::after{content:'';width:9px;height:5px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.spin{width:22px;height:22px;border-radius:50%;background:repeating-conic-gradient(var(--accent) 0 28deg,transparent 28deg 45deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%);mask:radial-gradient(circle,transparent 38%,#000 40%);animation:spin 1s steps(8) infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.mask{position:absolute;inset:0;z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--mut);font-size:13px;animation:fade-in .15s both}
.mask .spin{width:34px;height:34px}.mask.out{opacity:0;transition:opacity .3s;pointer-events:none}
@keyframes fade-in{from{opacity:0}}
.bar{height:6px;background:var(--surf3);overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}.seg button{border:0;background:transparent;padding:0 11px;min-height:28px;border-right:1.5px solid var(--line);transition:background .12s}.seg button:last-child{border-right:0}.seg button:hover{background:var(--surf3)}.seg button.on{background:var(--accent);color:var(--ink)}
.sep{width:1.5px;align-self:stretch;background:var(--line);margin:2px 3px;flex:none}
.tag{display:inline-block;padding:0 6px;background:var(--accent);color:var(--ink);font:500 10.5px/18px var(--font-m);letter-spacing:.1em;transform:rotate(-2deg)}
/* context menu / modal / toast */
#ctx-root{position:absolute;z-index:99999}
.ctx{position:fixed;min-width:190px;max-width:280px;padding:4px;background:var(--surf);border:1.5px solid var(--accent);border-radius:var(--r);box-shadow:6px 6px 0 var(--shade);z-index:99999;animation:ctx-in .14s var(--ease2) both;max-height:calc(100dvh - 16px);overflow:auto}
@keyframes ctx-in{from{opacity:0;transform:translateY(-4px) scale(.97)}}

class Notepad{
 constructor(win,path){this.win=win;this.path=null;this.dirty=false;this.hist=[];this.hi=-1;this.font=S.notepad.fontSize;this.build();this.autoSave=debounce(()=>this.doAuto(),1200);this.snapD=debounce(()=>this.snap(),450);
  win.onClose(()=>{this.autoSave.flush&&0;this.destroyed=true});win.beforeClose=async()=>{await this.doAuto(true);return true};if(path)this.open(path);else this.restoreDraft()}
 build(){const b=this.win.body;b.innerHTML=`<div class="tbar"><button class="btn" data-a="new">${ico('filePlus',14)}新建</button><button class="btn" data-a="open">${ico('folder',14)}打开</button><button class="btn pri" data-a="save">${ico('save',14)}保存</button><button class="btn" data-a="saveas">另存为</button><span class="sep"></span>

 <div class="fbar hidden"><input class="inp f1" placeholder="查找内容"><button class="btn sm" data-a="fn">下一个</button><input class="inp f2" placeholder="替换为"><button class="btn sm" data-a="fr">替换</button><button class="btn sm" data-a="fra">全部替换</button><span class="mut fc"></span></div>
 <textarea class="np-ta" spellcheck="false" placeholder="在此输入文字… 内容会自动保存"></textarea><div class="sbar"><span class="s1"></span><span class="s2"></span><span class="grow"></span><span class="s3"></span></div>`;
  const ta=this.ta=$('.np-ta',b);this.fbar=$('.fbar',b);ta.classList.toggle('wrap',S.notepad.wrap);ta.style.fontSize=this.font+'px';
  b.addEventListener('click',e=>{const a=e.target.closest('[data-a]');a&&this.act(a.dataset.a)});
  ta.addEventListener('input',()=>{this.dirty=true;this.snapD();this.autoSave();this.status();this.title()});ta.addEventListener('keyup',()=>this.status());ta.addEventListener('click',()=>this.status());
  ta.addEventListener('keydown',e=>{const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();if(c&&k==='z'&&!e.shiftKey){e.preventDefault();this.undo()}else if(c&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();this.redo()}else if(c&&k==='s'){e.preventDefault();this.save()}else if(c&&k==='f'){e.preventDefault();this.act('find')}

 title(){this.win.setTitle((this.path?Path.basename(this.path):'未命名')+(this.dirty?' ●':'')+' — 记事本')}

 snap(){const t=this.ta.value,l=this.hist[this.hi];if(l&&l.t===t&&l.f===this.font)return;this.hist.splice(this.hi+1);this.hist.push({t,f:this.font});if(this.hist.length>300)this.hist.shift();this.hi=this.hist.length-1}

 setFont(n){this.snap();this.font=clamp(n,9,48);this.ta.style.fontSize=this.font+'px';setCfg('notepad.fontSize',this.font,true);saveCfg();this.snap();this.status()}
 async act(a){const ta=this.ta;switch(a){
  case'new':await this.doAuto(true);this.path=null;ta.value='';this.dirty=false;this.hist=[{t:'',f:this.font}];this.hi=0;localStorage.removeItem('sour.np.draft');this.title();this.status();break;
  case'open':{const p=await ui.pick({mode:'open',startDir:this.path?Path.dirname(this.path):desktopDir()});p&&this.open(p);break}
  case'save':return this.save();case'saveas':return this.save(true);case'undo':return this.undo();case'redo':return this.redo();
  case'fm':return this.setFont(this.font-1);case'fp':return this.setFont(this.font+1);
  case'wrap':{const w=!ta.classList.contains('wrap');ta.classList.toggle('wrap',w);setCfg('notepad.wrap',w,true);saveCfg();break}
  case'find':this.fbar.classList.toggle('hidden');if(!this.fbar.classList.contains('hidden'))$('.f1',this.fbar).focus();break;
  case'fn':{const q=$('.f1',this.fbar).value;if(!q)return;let i=ta.value.indexOf(q,ta.selectionEnd);if(i<0)i=ta.value.indexOf(q);if(i<0){$('.fc',this.fbar).textContent='未找到';return}ta.focus();ta.setSelectionRange(i,i+q.length);$('.fc',this.fbar).textContent='';break}
  case'fr':{const q=$('.f1',this.fbar).value,r=$('.f2',this.fbar).value;if(q&&ta.value.slice(ta.selectionStart,ta.selectionEnd)===q){ta.setRangeText(r,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}this.act('fn');break}
  case'fra':{const q=$('.f1',this.fbar).value,r=$('.f2',this.fbar).value;if(!q)return;const n=ta.value.split(q).length-1;ta.value=ta.value.split(q).join(r);ta.dispatchEvent(new Event('input'));this.snap();$('.fc',this.fbar).textContent=`已替换 ${n} 处`;break}
  case'ed':if(this.path)WM.open('htmleditor',{path:this.path});else WM.open('htmleditor',{content:ta.value,name:'未命名.txt'});}}
 async open(p){try{const t=await textLike(p);if(t==null)return;this.path=p;this.ta.value=t;this.dirty=false;this.hist=[{t,f:this.font}];this.hi=0;this.title();this.status()}catch(e){ui.err(e,'打开失败')}}
 restoreDraft(){const d=localStorage.getItem('sour.np.draft');if(d){this.ta.value=d;this.dirty=true;this.hist=[{t:d,f:this.font}];this.hi=0;this.title();this.status()}}
 async save(as){try{if(!this.path||as){const p=await ui.pick({mode:'save',startDir:this.path?Path.dirname(this.path):desktopDir(),name:this.path?Path.basename(this.path):'未命名.txt'});if(!p)return;this.path=p}
  await fs.writeFile(this.path,this.ta.value);this.dirty=false;localStorage.removeItem('sour.np.draft');this.saved='已保存 '+hhmmss();this.title();this.status()}catch(e){ui.err(e,'保存失败')}}
 async doAuto(force){if(!S.notepad.autoSave&&!force)return;try{if(this.path){if(this.dirty){await fs.writeFile(this.path,this.ta.value);this.dirty=false;this.saved='已自动保存 '+hhmmss();if(!this.destroyed){this.title();this.status()}}}else if(this.ta.value)localStorage.setItem('sour.np.draft',this.ta.value)}catch(e){console.warn(e)}}}

function parseCSV(t,d){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"'&&f==='')q=true;else if(c===d){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
 if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function toCSV(rows,d){const needs=new RegExp('["\\n\\r'+(d==='\t'?'\\t':d.replace(/[\\^\]\-]/g,'\\$&'))+']');return rows.map(r=>r.map(c=>{c=String(c??'');return needs.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(d)).join('\n')+'\n'}
const colName=n=>{let s='';n++;while(n>0){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
class Sheet{
 constructor(win,path){this.win=win;this.path=null;this.delim=',';this.rows=[['','',''],['','','']];this.view='table';this.hdr=false;this.dirty=false;this.cur={r:0,c:0};this.limit=500;this.sortCol=-1;this.sortDir=1;this.build();win.beforeClose=async()=>{if(!this.dirty)return true;const r=await threeWay('表格有未保存的修改，是否保存？');if(r==='cancel')return false;if(r==='save')await this.save();return true};path?this.open(path):this.draw()}
 build(){const b=this.win.body;b.innerHTML=`<div class="tbar"><button class="btn" data-a="open">${ico('folder',14)}打开</button><button class="btn pri" data-a="save">${ico('save',14)}保存</button><button class="btn" data-a="saveas">另存为</button><span class="sep"></span>
 <div class="seg"><button data-v="table">表格视图</button><button data-v="text">文本视图</button></div><span class="sep"></span>
 <select class="inp dl" title="分隔符"><option value=",">逗号 ,</option><option value="&#9;">制表符 Tab</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select><label class="row" style="font-size:12.5px"><input type="checkbox" class="ck hd">首行为表头</label><span class="sep"></span>
 <button class="btn" data-a="ar">+ 行</button><button class="btn" data-a="ac">+ 列</button><button class="btn dan" data-a="dr">− 行</button><button class="btn dan" data-a="dc">− 列</button></div><div class="sh-main" style="flex:1;min-height:0;display:flex;flex-direction:column"></div><div class="sbar"><span class="s1"></span><span class="grow"></span><span class="s2"></span></div>`;
  this.main=$('.sh-main',b);b.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)this.act(a.dataset.a);const v=e.target.closest('[data-v]');if(v)this.setView(v.dataset.v)});
  $('.dl',b).onchange=e=>{this.sync();this.delim=e.target.value;this.setView(this.view,true)};$('.hd',b).onchange=e=>{this.hdr=e.target.checked;this.draw()}}
 title(){this.win.setTitle((this.path?Path.basename(this.path):'未命名表格')+(this.dirty?' ●':'')+' — 表格')}
 async open(p){try{const t=await textLike(p);if(t==null)return;this.path=p;const e=Path.extOf(p).toLowerCase();this.delim=e==='.tsv'||e==='.tab'?'\t':(t.split('\n')[0].split(';').length>t.split('\n')[0].split(',').length?';':',');$('.dl',this.win.body).value=this.delim;this.text=t;this.rows=parseCSV(t,this.delim);if(!this.rows.length)this.rows=[['']];this.dirty=false;this.limit=500;this.draw();this.title()}catch(e){ui.err(e,'打开失败')}}
 sync(){if(this.view==='text'&&this.ta)this.text=this.ta.value;if(this.view==='text'&&this.ta)this.rows=parseCSV(this.ta.value,this.delim)||[['']]}
 setView(v,force){if(v===this.view&&!force)return;if(this.view==='text'&&this.ta){this.rows=parseCSV(this.ta.value,this.delim);if(!this.rows.length)this.rows=[['']]}this.view=v;this.draw()}
 draw(){$$('.seg [data-v]',this.win.body).forEach(b=>b.classList.toggle('on',b.dataset.v===this.view));this.main.replaceChildren();this.ta=null;
  if(this.view==='text'){const ta=h('textarea',{class:'np-ta',spellcheck:'false',value:toCSV(this.rows,this.delim).replace(/\n$/,'')});ta.oninput=()=>{this.dirty=true;this.title()};this.ta=ta;this.main.append(ta);$('.s1',this.win.body).textContent='文本视图：直接编辑原始内容';$('.s2',this.win.body).textContent=`${ta.value.length} 字符`;return}
  const nc=Math.max(...this.rows.map(r=>r.length),1);const wrap=h('div',{class:'sh-wrap'});const tbl=h('table',{class:'sh-tbl'});const hr=h('tr',null,h('th',{class:'rn'},''));
  for(let c=0;c<nc;c++)hr.append(h('th',{title:'点击按此列排序',onclick:()=>{this.sortRows(c)}},colName(c)+(this.sortCol===c?(this.sortDir>0?' ▲':' ▼'):'')));tbl.append(h('thead',null,hr));const tb=h('tbody');tbl.append(tb);
  const total=this.rows.length,show=Math.min(total,this.limit);
  for(let r=0;r<show;r++){const tr=h('tr',{class:this.hdr&&r===0?'hd':''},h('td',{class:'rn'},String(r+1)));for(let c=0;c<nc;c++){const td=h('td',{contenteditable:'true',spellcheck:'false','data-r':r,'data-c':c});td.textContent=this.rows[r][c]??'';tr.append(td)}tb.append(tr)}
  tbl.addEventListener('input',e=>{const td=e.target.closest('td');if(!td||td.classList.contains('rn'))return;const r=+td.dataset.r,c=+td.dataset.c;while(this.rows[r].length<=c)this.rows[r].push('');this.rows[r][c]=td.textContent;this.dirty=true;this.title()});
  tbl.addEventListener('focusin',e=>{const td=e.target.closest('td');if(td&&td.dataset.r!=null){this.cur={r:+td.dataset.r,c:+td.dataset.c};$('.s1',this.win.body).textContent=`单元格 ${colName(this.cur.c)}${this.cur.r+1}`}});
  tbl.addEventListener('keydown',e=>{const td=e.target.closest('td');if(!td||td.dataset.r==null)return;const r=+td.dataset.r,c=+td.dataset.c;let t=null;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();t=tb.querySelector(`[data-r="${r+1}"][data-c="${c}"]`)}else if(e.key==='ArrowDown'&&e.altKey===false&&e.ctrlKey){t=tb.querySelector(`[data-r="${r+1}"][data-c="${c}"]`)}else if(e.key==='ArrowUp'&&e.ctrlKey){t=tb.querySelector(`[data-r="${r-1}"][data-c="${c}"]`)}else if(e.key==='Tab'){e.preventDefault();t=tb.querySelector(`[data-r="${r}"][data-c="${c+(e.shiftKey?-1:1)}"]`)}t&&t.focus()});
  wrap.append(tbl);if(show<total)wrap.append(h('div',{style:{padding:'12px'}},h('button',{class:'btn',onclick:()=>{this.limit+=1000;this.draw()}},`显示更多（已显示 ${show} / ${total} 行）`)));this.main.append(wrap);$('.s2',this.win.body).textContent=`${total} 行 × ${nc} 列`;$('.s1',this.win.body).textContent='表格视图：点击单元格编辑，Enter 向下，Tab 向右'}
 sortRows(c){this.sortDir=this.sortCol===c?-this.sortDir:1;this.sortCol=c;const hd=this.hdr?this.rows.shift():null;const num=this.rows.every(r=>r[c]===''||r[c]==null||!isNaN(parseFloat(r[c])));
  this.rows.sort((a,b)=>num?((parseFloat(a[c])||0)-(parseFloat(b[c])||0))*this.sortDir:natCmp(String(a[c]??''),String(b[c]??''))*this.sortDir);if(hd)this.rows.unshift(hd);this.dirty=true;this.title();this.draw()}
 act(a){if(a==='open')ui.pick({mode:'open',startDir:this.path?Path.dirname(this.path):desktopDir(),filter:n=>/\.(csv|tsv|tab|txt)$/i.test(n)}).then(p=>p&&this.open(p));else if(a==='save')this.save();else if(a==='saveas')this.save(true);
  else{this.sync();const nc=Math.max(...this.rows.map(r=>r.length),1);if(a==='ar')this.rows.splice(this.cur.r+1,0,Array(nc).fill(''));else if(a==='ac')this.rows.forEach(r=>{while(r.length<nc)r.push('');r.splice(this.cur.c+1,0,'')});else if(a==='dr'&&this.rows.length>1)this.rows.splice(this.cur.r,1);else if(a==='dc'&&nc>1)this.rows.forEach(r=>r.splice(this.cur.c,1));this.dirty=true;this.title();this.draw()}}

  this.card('酸柠 OS','lemon',h('div',{html:logoSVG(56)}),mk('版本','1.0 · 单文件 Web OS'),mk('OPFS',fs.info.opfs==='native'?'原生可用':'已降级'),mk('IndexedDB',fs.info.idb==='native'?'可用':'降级为内存'),mk('File System Access',window.showDirectoryPicker?'支持':'不支持（无法挂载本地文件夹）'),mk('Compression Streams',window.DecompressionStream?'支持 (gz/tgz)':'不支持'),mk('浏览器',nav.userAgent.slice(0,90)),mk('屏幕',`${innerWidth}×${innerHeight} @${devicePixelRatio}x · ${isMobile()?'移动布局':'桌面布局'}`));
  this.card('设置备份','save',h('div',{class:'row'},h('button',{class:'btn',onclick:()=>downloadBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'sourOS-settings.json'),html:ico('download',14)+'<span>导出设置</span>'}),h('button',{class:'btn',onclick:()=>{const i=h('input',{type:'file',accept:'.json'});i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());S=deepMerge(structuredClone(DEFAULTS),o);saveCfg();applyCfg();bus.emit('cfg','*');Desk.relayout();Wallpaper.apply();this.show(this.tab);ui.toast('设置已导入')}catch{ui.toast('导入失败：不是有效的设置文件',{type:'err'})}};i.click()},html:ico('upload',14)+'<span>导入设置</span>'}),h('button',{class:'btn',onclick:async()=>{if(await ui.confirm('仅恢复所有设置为默认值，文件不会被删除。',{ok:'恢复默认'})){S=structuredClone(DEFAULTS);saveCfg();location.reload()}}},'仅重置设置')));
  this.card('危险区域','warn',h('div',{class:'mut',style:{marginBottom:10}},'一键重置会清空 OPFS 与 IndexedDB 中的全部文件、设置、挂载记录，并还原为初始状态。本地挂载的真实文件夹不受影响。'),h('button',{class:'btn dan',html:ico('trashAll',15)+'<span>一键重置：清除文件系统并重置</span>',onclick:async()=>{if(!await ui.confirm('这将永久删除虚拟文件系统中的所有文件和设置！\n\n此操作无法撤销。',{danger:1,ok:'我确定，全部清除',title:'一键重置'}))return;const t=await ui.prompt('请输入「重置」以确认','',{ph:'重置'});if(t&&t.trim()==='重置')hardReset()}}))}}

<script>
'use strict';
/* ---------- 9. 打开方式分派 / 启动 ---------- */
function defaultApp(st,info){const ext=info.ext;
 switch(info.cat){case'image':return ext==='svg'?'imgview':(S.imgOpen==='viewer'?'imgview':'manga');case'audio':case'video':return'media';case'pdf':return'pdf';case'table':return'sheet';case'archive':return'archive';case'disk':return'vm';
  case'html':return S.htmlOpen==='editor'?'htmleditor':S.htmlOpen==='browser'?'browser':'ask-html';
  case'code':return S.codeOpen==='editor'?'htmleditor':'notepad';case'text':return(ext==='md'||ext==='markdown')&&S.codeOpen==='editor'?'htmleditor':'notepad'}return null}
async function openPath(path,o={}){let st;try{st=await fs.stat(path)}catch(e){return ui.err(e,'无法打开')}
 if(st.type==='dir'){o.fm?o.fm.nav(st.path):WM.open('files',{path:st.path});return}
 const info=fileInfo(st.name);let app=o.app||defaultApp(st,info);
 if(app==='ask-html')return htmlChooser(st);
 if(!app){try{const b=await fs.readBlob(st.path);const t=new Uint8Array(await b.slice(0,2048).arrayBuffer());let bad=0;for(const c of t)if(c===0||(c<9)||(c>13&&c<32))bad++;if(t.length===0||bad/t.length<.02)app='notepad'}catch{}}
 if(!app)return openChooser(st);WM.open(app,{path:st.path})}
function htmlChooser(st){const card=(ic,t,d,fn)=>h('button',{class:'btn',style:{flex:'1 1 200px',flexDirection:'column',height:'auto',padding:'16px 12px',gap:'8px',whiteSpace:'normal',textAlign:'center'},onclick:()=>{chk.checked&&setCfg('htmlOpen',fn==='browser'?'browser':'editor');m.close();WM.open(fn==='browser'?'browser':'htmleditor',{path:st.path})},html:`<span style="color:var(--accent-ink)">${ico(ic,34,1.6)}</span><b style="font-size:15px">${t}</b><small style="opacity:.7">${d}</small>`});
 const chk=h('input',{type:'checkbox',class:'ck'});const m=modal({title:'打开 HTML 文件 · '+st.name,wide:true,body:[h('div',{class:'row',style:{alignItems:'stretch',flexWrap:'wrap'}},card('globe','在浏览器中打开','使用内置网页浏览器渲染完整页面（自动解析相对资源）','browser'),card('code','编辑源代码','CodeMirror 编辑器，右侧实时预览，Ctrl+S 保存回原位置','editor')),h('label',{class:'row mut',style:{fontSize:'12.5px'}},chk,'记住我的选择（可在 设置 → 应用 中修改）')],buttons:[{t:'取消'}]})}
function openChooser(st){const apps=[['notepad','以纯文本形式打开','notepad'],['htmleditor','代码编辑器','code'],['imgview','图片查看器','image'],['media','媒体播放器','play'],['archive','压缩包管理器','archive'],['vm','虚拟机（作为镜像）','cpu'],['browser','浏览器','globe']];
 const m=modal({title:'选择打开方式 · '+st.name,body:[h('div',{class:'mut'},'无法识别此文件类型。请选择一个应用：'),...apps.map(([id,l,i])=>h('button',{class:'btn',style:{justifyContent:'flex-start'},onclick:()=>{m.close();WM.open(id,{path:st.path})},html:ico(i,16)+'<span>'+l+'</span>'})),h('button',{class:'btn',style:{justifyContent:'flex-start'},onclick:()=>{m.close();Ops.exportDownload([st.path])},html:ico('download',16)+'<span>下载到电脑</span>'})],buttons:[{t:'取消'}]})}
function openWithItems(e){const info=fileInfo(e.name),seen=new Set(),it=[];const add=(label,icon,id,args)=>{const k=id+(args&&args.path?'p':'');if(seen.has(k))return;seen.add(k);it.push({label,icon,act:()=>WM.open(id,args||{path:e.path})})};
 if(info.cat==='html'){add('在浏览器中打开（渲染完整页面）','globe','browser');add('编辑源代码（含实时预览）','code','htmleditor')}
 if(info.cat==='image'){add('漫画阅读器（同目录条漫）','book','manga');add('图片查看器','image','imgview');add('在画板中编辑','paint','paint')}
 if(['audio','video'].includes(info.cat))add('媒体播放器','play','media');if(info.cat==='pdf'){add('PDF 查看器','pdf','pdf')}
 if(info.cat==='table')add('表格','table','sheet');if(info.cat==='archive'||/\.(zip|7z|rar|tar|gz|tgz|bz2|xz)$/i.test(e.name))add('压缩包管理器','archive','archive');if(['disk','archive'].includes(info.cat)||/\.(bin|img)$/i.test(e.name))add('虚拟机（作为镜像）','cpu','vm');
 add('记事本（纯文本）','notepad','notepad');add('代码编辑器','code','htmleditor');if(['image','pdf','text','code'].includes(info.cat))add('浏览器','globe','browser');return it}
async function firstRun(){if(localStorage.getItem('sourOS.init'))return;localStorage.setItem('sourOS.init','1');S.hideSys={sheet:1,calc:1,paint:1,vm:1,media:1};saveCfg();
 try{const d=desktopDir();const ex=await fs.readdir(d);if(ex.length)return;
  await fs.writeFile(d+'/欢迎使用酸柠OS.txt','欢迎来到酸柠 OS —— 一个酸到牙软的网页操作系统。\n\n· 所有文件保存在浏览器的 OPFS / IndexedDB 中，刷新后仍然保留，且保留原始修改日期。\n· 桌面图标可自由摆放：拖动即可，支持多选与框选。\n· 把电脑上的文件直接拖进来即可导入；也可以把文件拖回电脑桌面导出。\n· 文件管理器左侧可以看到 OPFS 与 IndexedDB 两个存储，随你选择放在哪里。\n· 在「设置」中可以更换主题色、壁纸、圆角、12/24 小时制，查看存储占用，或一键重置。\n\n祝你酸爽！\n');
  await fs.writeFile(d+'/酸柠示例.html',TPL_HTML.replace('<title>新网页</title>','<title>酸柠示例</title>').replace('<h1>酸柠 · Hello</h1>','<h1>酸柠 · Hello</h1><p style="color:#fff;opacity:.7">在 HTML 编辑器里修改我，右侧会实时预览。</p>'));
  await fs.writeFile(d+'/示例表格.csv','水果,酸度,价格\n柠檬,10,3.5\n青柠,9,4.2\n西柚,6,5.0\n百香果,8,6.8\n杨梅,7,12\n');
  await fs.writeFile(homeRoot()+'/文档/笔记.md','# 酸柠笔记\n\n- 记事本支持撤销 / 重做 / 字号\n- **HTML 编辑器**支持 Markdown 预览\n\n> 酸，是一种态度。\n')}catch(e){console.warn(e)}}
async function remountPrompt(){if(!window.showDirectoryPicker)return;const saved=(await Handles.list()).filter(x=>!fs.localMounts().some(m=>Path.basename(m.prefix)===x.name));if(!saved.length)return;
 ui.toast(`检测到上次挂载的 ${saved.length} 个本地文件夹，刷新后需要重新授权`,{label:'重新挂载',ms:12000,action:async()=>{let ok=0;for(const x of saved){try{if((await x.handle.requestPermission({mode:'readwrite'}))==='granted'){await ui.busy('正在挂载 '+x.name+'…',()=>fs.mountLocal(x.handle,false));ok++}}catch(e){console.warn(e)}}
  ok<saved.length?ui.toast(`已挂载 ${ok} 个，其余请在 设置 → 存储 中重新挂载`):ui.toast('已重新挂载 '+ok+' 个本地文件夹')}})}
async function boot(){window.fs=fs;applyCfg();(WALLS.find(x=>x.id===S.wallpaper.id)||WALLS[0]);$('#wallpaper').style.background=(S.wallpaper.type==='preset'?(WALLS.find(x=>x.id===S.wallpaper.id)||WALLS[0]):WALLS[0]).css();
 initTaskbar();Desk.init();
 try{await initFS()}catch(e){console.error(e);ui.alert('文件系统初始化失败：'+e.message)}
 if(!localStorage.getItem(LS_KEY)){try{const t=await fs.readText('/opfs/.system/settings.json');S=deepMerge(structuredClone(DEFAULTS),JSON.parse(t));applyCfg()}catch{}}
 await firstRun();Wallpaper.apply();await Desk.render();remountPrompt();
 addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('input,textarea,.CodeMirror,[contenteditable]'))return;e.preventDefault();if(!resolveDrop(e.target)&&e.dataTransfer)e.dataTransfer.dropEffect='none'});
 addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('input,textarea,.CodeMirror,[contenteditable]'))return;e.preventDefault()});
 document.addEventListener('gesturestart',e=>e.preventDefault());document.body.style.touchAction='manipulation';
 matchMedia('(max-width:760px)').addEventListener('change',()=>{for(const w of WM.wins.values()){if(isMobile()){w.max=true;w.el.classList.add('max')}}Desk.layout()});
 window.sour={fs,WM,S,ui,openPath}}
boot().catch(e=>{console.error(e);ui.err(e,'启动失败')});

</script>
