            const b = document.createElement('button');
            b.textContent = k;
            if ('/*-+='.includes(k)) b.className = 'op';
            b.addEventListener('click', () => press(k));
            keyWrap.append(b);
          });

          function press(k) {
            if (k === 'C') expr = '';
            else if (k === 'DEL') expr = expr.slice(0, -1);
            else if (k === '=') calc();
            else expr += k;
            $('.expr', root).textContent = expr;
          }

          function calc() {
            if (!/^[0-9+\-*/().\s]+$/.test(expr)) return;
            try {
              $('.result', root).textContent = String(Function('return (' + expr + ')')());
            } catch {
              $('.result', root).textContent = '错误';
            }
          }
          WindowManager.open('calc', '计算器', root, {
            width: 360,
            height: 520,
            icon: 'calc'
          });
        }

        function openPaint() {
          const root = document.createElement('div');
          root.className = 'paint';
          root.innerHTML =
            `<div class="toolbar"><label class="mono muted">颜色 <input type="color" value="#101817"></label><label class="mono muted">笔触 <input type="range" min="1" max="48" value="7"></label><button class="tool-btn clear">清空</button><button class="tool-btn save">保存到图片</button></div><div class="paint-canvas-wrap"><canvas class="paint-canvas" width="1280" height="820"></canvas></div>`;
          const canvas = $('canvas', root),
            ctx = canvas.getContext('2d');
          ctx.fillStyle = '#f6f0df';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          let drawing = false,
            last = null;

          function pos(e) {
            const r = canvas.getBoundingClientRect();
            return {
              x: (e.clientX - r.left) * canvas.width / r.width,
              y: (e.clientY - r.top) * canvas.height / r.height
            };
          }
          canvas.addEventListener('pointerdown', e => {
            drawing = true;
            last = pos(e);
            canvas.setPointerCapture(e.pointerId);
          });
          canvas.addEventListener('pointermove', e => {
            if (!drawing) return;
            const p = pos(e);
            ctx.strokeStyle = $('input[type=color]', root).value;
            ctx.lineWidth = $('input[type=range]', root).value;
            ctx.beginPath();
            ctx.moveTo(last.x, last.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            last = p;
          });
          canvas.addEventListener('pointerup', () => drawing = false);
          $('.clear', root).addEventListener('click', () => {
            ctx.fillStyle = '#f6f0df';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          });
          $('.save', root).addEventListener('click', async () => {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            const p = await uniquePath('/Pictures', `paint-${Date.now()}.png`);
            await fs.writeFile(p, blob);
            toast('已保存 ' + p);
            refreshExplorers();
          });
          WindowManager.open('paint', '画板', root, {
            width: 920,
            height: 650,
            icon: 'paint'
          });
        }

        async function openSettings() {
          const root = document.createElement('div');
          root.className = 'settings';
          root.innerHTML =
            `<div><div class="brand" style="font-size:42px">系统设置</div><p class="mono muted">存储、壁纸、本地文件夹挂载与重置。</p></div><section class="settings-section storage"></section><section class="settings-section walls"></section><section class="settings-section mounts"></section><section class="settings-section"><button class="tool-btn danger reset">一键重置 OPFS/VFS</button></section>`;
          WindowManager.open('settings', '设置', root, {
            width: 760,
            height: 620,
            icon: 'settings'
          });
          async function renderSettings() {
            const estimate = await navigator.storage?.estimate?.().catch(() => null);
            const usage = estimate?.usage || await scanSize('/');
            const quota = estimate?.quota || Math.max(usage, 1);
            $('.storage', root).innerHTML =
              `<h3 class="text-xl mb-2">存储占用</h3><div class="meter"><span style="width:${Math.min(100, usage / quota * 100)}%"></span></div><p class="mono muted mt-2">已用 ${formatSize(usage)} / 可用配额 ${formatSize(quota)}，占用率 ${(usage / quota * 100).toFixed(2)}%</p><div class="mono mt-3 usage-list">正在扫描目录...</div>`;
            const list = await Promise.all(['/Desktop', '/Documents', '/Pictures', '/Music', '/Videos',
              '/Downloads', '/mnt'
            ].map(async p => [p, await scanSize(p).catch(() => 0)]));
            $('.usage-list', root).innerHTML = list.map(([p, s]) => `<div>${p}: ${formatSize(s)}</div>`).join('');
            $('.walls', root).innerHTML =
              `<h3 class="text-xl mb-2">壁纸</h3><div class="wall-grid"><button class="wall-tile wallpaper-lacquer" data-wall="lacquer"></button><button class="wall-tile wallpaper-blueprint" data-wall="blueprint"></button><button class="wall-tile wallpaper-paper" data-wall="paper"></button></div><button class="tool-btn mt-3 upload-wall">上传自定义壁纸</button>`;
            $$('.wall-tile', root).forEach(b => b.addEventListener('click', () => setWallpaper({
              type: 'preset',
              id: b.dataset.wall
            })));
            $('.upload-wall', root).addEventListener('click', pickWallpaper);
            const mounts = fs.listMounts();
            $('.mounts', root).innerHTML =
              `<h3 class="text-xl mb-2">本地文件夹挂载</h3><button class="tool-btn mount">挂载真实本地文件夹</button><div class="mono mt-3">${mounts.length ? mounts.map(m => `<div>${m.path} <button class="small-btn" data-unmount="${m.path}">卸载</button></div>`).join('') : '暂无活动挂载。刷新后若权限失效，请重新挂载。'}</div>`;
            $('.mount', root).addEventListener('click', async () => {
              await mountFolderAction();
              renderSettings();
            });
            $$('[data-unmount]', root).forEach(b => b.addEventListener('click', async () => {
              await fs.unmount(b.dataset.unmount);
              renderSettings();
              refreshExplorers();
            }));
          }
          $('.reset', root).addEventListener('click', async () => {
            if (!confirm('这会清除 OPFS 虚拟文件系统、桌面布局和挂载记录。继续？')) return;
            await fs.reset();
            await MetaStore.remove('desktopLayout');
            await MetaStore.remove('wallpaper');
            await seedFileSystem(true);
            await applyWallpaper();
            await renderDesktop();
            refreshExplorers();
            renderSettings();
            toast('系统已重置');
          });
          renderSettings();
        }
        async function scanSize(path) {
          const st = await fs.stat(path);
          if (st.type === 'file') return st.size || 0;
          let total = 0;
          for (const child of await fs.readdir(path)) total += await scanSize(child.path).catch(() => 0);
          return total;
        }
        async function pickWallpaper() {
          const input = $('#wallpaperInput');
          input.value = '';
          input.onchange = async () => {
            const file = input.files?.[0];
            if (!file) return;
            const path = await uniquePath('/System/Wallpapers', file.name);
            await fs.writeFile(path, await file.arrayBuffer());
            await setWallpaper({
              type: 'file',
              path
            });
          };
          input.click();
        }
        async function setWallpaper(wp) {
          await MetaStore.set('wallpaper', wp);
          await applyWallpaper();
        }
        async function applyWallpaper() {
          const wp = await MetaStore.get('wallpaper', {
            type: 'preset',
            id: 'lacquer'
          });
          desktop.classList.remove('wallpaper-lacquer', 'wallpaper-blueprint', 'wallpaper-paper');
          desktop.style.backgroundImage = '';
          if (wp.type === 'file') {
            try {
              const url = await blobUrlForPath(wp.path);
              desktop.style.backgroundImage = `url(${url})`;
              return;
            } catch {
              toast('壁纸文件不可用，已切换默认壁纸');
            }
          }
          desktop.classList.add('wallpaper-' + (wp.id || 'lacquer'));
        }

        const apps = [{
            id: 'explorer',
            name: '文件资源管理器',
            desc: '浏览 OPFS 与挂载目录',
            icon: 'folder',
            run: () => openExplorer('/')
          },
          {
            id: 'editor',
            name: '记事本',
            desc: '新建或编辑文本',
            icon: 'code',
            run: () => createTextFile('/Documents')
          },
          {
            id: 'browser',
            name: '网页浏览器',
            desc: 'iframe 预览 HTML 与网址',
            icon: 'browser',
            run: () => openBrowser('about:blank')
          },
          {
            id: 'calc',
            name: '计算器',
            desc: '基础表达式计算',
            icon: 'calc',
            run: openCalculator
          },
          {
            id: 'paint',
            name: '画板',
            desc: '绘制并保存 PNG',
            icon: 'paint',
            run: openPaint
          },
          {
            id: 'settings',
            name: '设置',
            desc: '存储、壁纸、重置',
            icon: 'settings',
            run: openSettings
          }
        ];

        function renderStartApps(filter = '') {
          const wrap = $('#startApps');
          wrap.innerHTML = '';
          const q = filter.trim().toLowerCase();
          if (filter.startsWith('/')) {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerHTML =
              `${svg('folder')}<div><div class="menu-title"></div><div class="menu-desc">打开路径</div></div>`;
            $('.menu-title', btn).textContent = filter;
            btn.addEventListener('click', () => {
              openPath(filter);
              startMenu.classList.remove('open');
            });
            wrap.append(btn);
            return;
          }
          apps.filter(a => !q || a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)).forEach(
          app => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerHTML =
              `${svg(app.icon)}<div><div class="menu-title"></div><div class="menu-desc"></div></div>`;
            $('.menu-title', btn).textContent = app.name;
            $('.menu-desc', btn).textContent = app.desc;
            btn.addEventListener('click', () => {
              app.run();
              startMenu.classList.remove('open');
            });
            wrap.append(btn);
          });
        }
        $('#startBtn').innerHTML = `${svg('start')}<span class="label">开始</span>`;
        $('#desktopBtn').innerHTML = `${svg('desktop')}<span class="label">桌面</span>`;
        $('#startBtn').addEventListener('click', e => {
          e.stopPropagation();
          startMenu.classList.toggle('open');
          renderStartApps($('#startSearch').value);
        });
        $('#desktopBtn').addEventListener('click', () => {
          for (const rec of WindowManager.windows.values()) WindowManager.minimize(rec.id);
        });
        $('#startSearch').addEventListener('input', e => renderStartApps(e.target.value));
        setInterval(() => {
          $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', {
            hour12: false
          });
        }, 1000);

        async function seedFileSystem(force = false) {
          for (const dir of ['/Desktop', '/Documents', '/Pictures', '/Music', '/Videos', '/Downloads', '/System',
              '/System/Wallpapers', '/mnt', '/mnt/local'
            ]) await fs.mkdir(dir).catch(() => {});
          async function writeOnce(path, text) {
            if (force || !await fs.exists(path)) await fs.writeFile(path, text);
          }
          await writeOnce('/Desktop/欢迎使用.txt',
            'Obsidian VFS Web OS\n\n这是一个单文件浏览器桌面系统。文件写入 OPFS，刷新后仍会保留。\n\n提示：\n1. 右键桌面可新建、上传、挂载真实本地文件夹。\n2. 桌面图标使用原生 Drag and Drop，拖出浏览器可下载文件。\n3. HTML 文件会打开带实时预览的工作台。\n'
            );
          await writeOnce('/Desktop/演示页面.html',
            '<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="UTF-8"><title>VFS HTML</title><style>body{font-family:serif;background:#0b1412;color:#e7dec1;padding:40px}h1{color:#c8ff44}</style></head><body><h1>来自 OPFS 的页面</h1><p>修改源码后保存，再用系统浏览器打开。</p></body></html>'
            );
          await writeOnce('/Documents/账目.csv', '项目,金额,日期\n墨水,42,2026-01-18\n纸张,16,2026-01-19\n');
          await writeOnce('/Documents/readme.md', '# Obsidian VFS\n\n所有应用都通过同一套 fs API 访问 OPFS 与挂载文件夹。\n');
          await writeOnce('/Documents/theme.css',
            ':root { color-scheme: dark; }\nbody { background: #08100f; color: #e7dec1; }\n');
        }
        async function boot() {
          try {
            let primary;
            try {
              primary = new OPFSBackend();
              await primary.init();
            } catch (err) {
              primary = new IndexedDBBackend();
              await primary.init();
              toast('OPFS 不可用，已降级到 IndexedDB: ' + err.message, 5200);
            }
            fs = new MountableFS(primary);
            await fs.init();
            window.fs = fs;
            await seedFileSystem(false);
            await applyWallpaper();
            const restored = await fs.tryRestoreHandles();
            const reminders = await MetaStore.get('mountReminders', []);
            if (reminders.length && !restored.length) toast('检测到上次的本地文件夹挂载记录。请在开始菜单或文件管理器中重新挂载以恢复权限。', 7000);
            await renderDesktop();
            renderStartApps();
            $('#boot').classList.add('ready');
          } catch (err) {
            console.error(err);
            toast('启动失败: ' + err.message, 10000);
            $('#boot .boot-sub').textContent = '启动失败: ' + err.message;
          }
        }
        window.addEventListener('beforeunload', () => {
          for (const url of objectUrls) URL.revokeObjectURL(url);
        });
        window.addEventListener('resize', () => renderDesktop());
        boot();
      })();

    </script>
  </body>

</html>
