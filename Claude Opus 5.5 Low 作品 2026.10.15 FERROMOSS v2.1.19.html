<style>
/* =========================================================
   FERROMOSS 磁藓纪 — "氧化生物光" aesthetic
   iron substrate · luminous lichen · survey registration marks
   ========================================================= */
:root{--font:"Familjen Grotesk","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--mono:"Martian Mono",ui-monospace,Menlo,monospace;--tb:50px;--ease:cubic-bezier(.2,.85,.2,1);--cw:92px;--ch:100px}
[data-theme=dark]{--bg:#0a0c0b;--ink:#e2ebe5;--dim:#8b9990;--mute:#56625b;--panel:rgba(15,19,17,.84);--panel2:rgba(20,25,22,.94);--solid:#111513;--solid2:#171c19;--line:rgba(140,255,205,.09);--line2:rgba(140,255,205,.2);--acc:#6ff2c1;--acc-ink:#03140d;--acc2:#ff6b35;--sel:rgba(111,242,193,.15);--hover:rgba(220,255,240,.05);--shadow:0 34px 90px -24px rgba(0,0,0,.8);color-scheme:dark}
[data-theme=light]{--bg:#e8e3d6;--ink:#191c1a;--dim:#5c635d;--mute:#9aa098;--panel:rgba(246,242,233,.88);--panel2:rgba(250,248,242,.96);--solid:#f5f1e8;--solid2:#ebe6da;--line:rgba(20,45,32,.11);--line2:rgba(20,45,32,.24);--acc:#0b8660;--acc-ink:#fff;--acc2:#c8461a;--sel:rgba(11,134,96,.14);--hover:rgba(0,0,0,.045);--shadow:0 30px 70px -26px rgba(40,30,10,.45);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input,textarea,select,button{font:inherit;color:inherit}
button{cursor:pointer}
textarea,input,[contenteditable=true]{user-select:text;-webkit-user-select:text}
svg{display:inline-block;flex:none}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-corner{background:transparent}
#wall{position:fixed;inset:0;background-color:#070908;transition:opacity .5s}
#wallfx{position:fixed;inset:0;pointer-events:none;opacity:.55;background:radial-gradient(30vmax 30vmax at 30% 40%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 70%),radial-gradient(25vmax 25vmax at 75% 65%,color-mix(in srgb,var(--acc2) 7%,transparent),transparent 70%);animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-4vw,3vh,0) scale(1.1)}}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
/* desktop */
#desktop{position:fixed;inset:0 0 var(--tb) 0;touch-action:none;overflow:hidden}
body.tb-hidden #desktop{bottom:0}
#deskMark{position:absolute;right:22px;bottom:18px;font-family:var(--mono);font-size:10px;color:rgba(220,255,240,.32);text-align:right;line-height:1.7;pointer-events:none;letter-spacing:.12em}
.ico{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;align-items:center;padding:8px 4px 4px;gap:6px;border:1px solid transparent;transition:left .42s var(--ease),top .42s var(--ease),background .15s,border-color .15s;touch-action:none}
.ico .ig{width:calc(var(--cw)*.5);height:calc(var(--cw)*.5);display:grid;place-items:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.ico .ig svg,.ico .ig img{width:100%;height:100%;object-fit:cover}
.ico .lb{font-size:12px;text-align:center;line-height:1.25;max-height:2.55em;overflow:hidden;word-break:break-all;color:#eef5f1;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.6);padding:0 2px}
.ico:hover{background:rgba(220,255,240,.07);border-color:rgba(140,255,205,.14)}
.ico.sel{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:color-mix(in srgb,var(--acc) 70%,transparent)}
.ico.pop{animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(10px)}}
.drop-hl{outline:1px dashed var(--acc2)!important;outline-offset:-2px;background:color-mix(in srgb,var(--acc2) 14%,transparent)!important}
.mq{position:absolute;pointer-events:none;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);z-index:50;left:0;top:0}
.mq::after{content:"";position:absolute;right:-1px;bottom:-1px;width:6px;height:6px;background:var(--acc)}
.tghost{position:fixed;z-index:99999;pointer-events:none;padding:8px 12px;background:var(--panel2);border:1px solid var(--acc);font-size:12px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);left:0;top:0}
/* windows */
#windows{position:fixed;inset:0 0 var(--tb) 0;pointer-events:none;z-index:10}
body.tb-hidden #windows{bottom:0}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow);min-width:280px;min-height:170px;transition:opacity .22s,transform .3s var(--ease),border-color .2s}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;border:2px solid var(--mute);z-index:4;transition:border-color .2s}
.win::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.win::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.win.active{border-color:color-mix(in srgb,var(--acc) 38%,transparent)}
.win.active::before,.win.active::after{border-color:var(--acc)}
.win.opening{animation:winIn .34s var(--ease)}
@keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.win.closing{opacity:0;transform:scale(.95) translateY(10px);pointer-events:none}
.win.min{opacity:0;transform:translateY(45vh) scale(.25);pointer-events:none}
.win.maxd{left:0!important;top:0!important;width:100%!important;height:100%!important;border-width:0 0 1px}
.win.maxd::before,.win.maxd::after{display:none}
.win.anim{transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease),opacity .22s,transform .3s var(--ease)}
.tb{height:38px;display:flex;align-items:center;gap:9px;padding-left:12px;border-bottom:1px solid var(--line);flex:none;touch-action:none;cursor:default}
.tb .ti{width:18px;height:18px;display:grid;place-items:center}
.tb .tt{flex:1;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .tid{font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:.1em}
.tc{display:flex;height:100%}
.tc button{width:46px;height:100%;border:0;background:none;display:grid;place-items:center;color:var(--dim)}
.tc button:hover{background:var(--hover);color:var(--ink)}
.tc button.x:hover{background:var(--acc2);color:#fff}
.wb{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:5;touch-action:none}
.rz.n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}.rz.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.rz.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}.rz.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz.ne{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}.rz.sw{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.rz.nw{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}.rz.se{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
.win.maxd .rz{display:none}
body.dragging iframe,body.dragging canvas{pointer-events:none}
body.dragging{cursor:grabbing}
#snapPv{position:fixed;z-index:9;pointer-events:none;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent);backdrop-filter:blur(6px);opacity:0;transition:all .2s var(--ease)}
#snapPv.on{opacity:1}
body.peeking .win:not(.peek-me){opacity:.05!important;box-shadow:none}
body.peeking .win:not(.peek-me)::before{border-color:var(--acc)}
body.peeking .win{transition:opacity .25s}
/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);display:flex;align-items:center;gap:3px;padding-left:6px;background:var(--panel2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--line2);z-index:9000;transition:transform .3s var(--ease)}
body.tb-auto #taskbar{transform:translateY(calc(100% - 3px))}
body.tb-auto #taskbar:hover,body.tb-auto #taskbar.keep{transform:none}
body.tb-hidden #taskbar{display:none}
#startBtn{height:38px;padding:0 12px 0 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:transparent;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--acc)}
#startBtn:hover,#startBtn.on{background:var(--acc);color:var(--acc-ink)}
#tasks{flex:1;display:flex;gap:3px;overflow-x:auto;overflow-y:hidden;height:100%;align-items:center;scrollbar-width:none;padding:0 4px}
#tasks::-webkit-scrollbar{display:none}
.task{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;max-width:190px;border:1px solid transparent;background:none;position:relative;animation:pop .35s var(--ease)}
.task .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.task:hover{background:var(--hover);border-color:var(--line)}
.task.on{background:var(--sel);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.task::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--mute)}
.task.on::after{background:var(--acc)}.task.mini::after{left:40%;right:40%}
.task .tx{width:20px;height:20px;display:grid;place-items:center;opacity:0;color:var(--dim)}
.task:hover .tx{opacity:1}.task .tx:hover{background:var(--acc2);color:#fff}
#tray{display:flex;align-items:center;height:100%;gap:2px}
.trayb{height:38px;padding:0 9px;display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;color:var(--dim)}
.trayb:hover{background:var(--hover);color:var(--ink)}
#clock{flex-direction:column;align-items:flex-end;justify-content:center;gap:0;line-height:1.25;font-family:var(--mono);font-size:10.5px;color:var(--ink);min-width:88px}
#clock small{font-size:9px;color:var(--dim)}
#peek{width:12px;height:100%;border:0;border-left:1px solid var(--line2);background:none;margin-left:4px}
#peek:hover{background:color-mix(in srgb,var(--acc) 25%,transparent)}
/* popups */
.pop{position:fixed;z-index:9500;background:var(--panel2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line2);box-shadow:var(--shadow);display:none}
.pop.on{display:flex;animation:popIn .26s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(10px)}}
#startMenu{left:6px;bottom:calc(var(--tb) + 6px);width:min(560px,calc(100vw - 12px));max-height:min(640px,calc(100vh - var(--tb) - 20px));flex-direction:column}
.sm-head{padding:18px 18px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.sm-brand{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--acc)}
.sm-brand span{color:var(--mute);letter-spacing:.1em;font-size:9px}
.inp{height:34px;border:1px solid var(--line2);background:var(--solid);padding:0 10px;outline:none;width:100%}
.inp:focus{border-color:var(--acc)}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:12px;overflow:auto}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border:1px solid transparent;background:none;font-size:12px;animation:pop .45s var(--ease) both}
.sm-app:hover{background:var(--hover);border-color:var(--line2)}
.sm-sec{padding:4px 18px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mute)}
.sm-foot{display:flex;gap:4px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--solid2);font-size:12px;white-space:nowrap;flex:none}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.btn.pri:hover{filter:brightness(1.1);color:var(--acc-ink)}
.btn.warn:hover{border-color:var(--acc2);color:var(--acc2)}
.btn.on{background:var(--sel);border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px}
#calendar{right:6px;bottom:calc(var(--tb) + 6px);width:300px;flex-direction:column;padding:16px;gap:10px}
.cal-big{font-family:var(--mono);font-size:30px;font-weight:300;letter-spacing:-.02em}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g div{padding:7px 0;font-family:var(--mono);font-size:11px}
.cal-g .wd{color:var(--mute);font-size:9.5px}
.cal-g .o{color:var(--mute)}
.cal-g .t{background:var(--acc);color:var(--acc-ink)}
.cal-g .d:hover{background:var(--hover)}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:none;color:var(--dim)}
.ib:hover{border-color:var(--line2);color:var(--ink);background:var(--hover)}
#ctx{flex-direction:column;min-width:210px;padding:5px;z-index:9800}
.ci{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12.5px;position:relative;white-space:nowrap}
.ci:hover,.ci.hov{background:var(--sel);color:var(--acc)}
.ci .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mute);padding-left:18px}
.ci.dis{opacity:.4;pointer-events:none}
.csep{height:1px;background:var(--line);margin:4px 6px}
.csub{position:fixed}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb) + 12px);z-index:9900;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;min-width:240px;max-width:min(380px,calc(100vw - 24px));background:var(--panel2);backdrop-filter:blur(20px);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:11px 14px;box-shadow:var(--shadow);animation:popIn .3s var(--ease);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.toast.err{border-left-color:var(--acc2)}
.toast .tbar{height:3px;background:var(--line);position:relative}.toast .tbar i{position:absolute;inset:0 auto 0 0;background:var(--acc);transition:width .2s}
#modal{position:fixed;inset:0;z-index:9950;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.dlg{background:var(--panel2);border:1px solid var(--line2);box-shadow:var(--shadow);width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;animation:winIn .3s var(--ease);max-height:90vh}
.dlg h3{font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.dlg h3::before{content:"";width:8px;height:8px;background:var(--acc)}
.dlg .acts{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.chooser{display:flex;flex-direction:column;gap:4px;overflow:auto}
.chooser button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);background:var(--solid);text-align:left}
.chooser button:hover{border-color:var(--acc)}
/* generic toolbar */
.bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:thin}
.bar .sp{flex:1}
.bar .vs{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.tbtn{height:30px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;font-size:12px;white-space:nowrap;flex:none;color:var(--ink)}
.tbtn:hover{background:var(--hover);border-color:var(--line2)}
.tbtn.on{background:var(--sel);border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc)}
.tbtn:disabled{opacity:.35;pointer-events:none}
.sel-in{height:30px;border:1px solid var(--line2);background:var(--solid);padding:0 6px;font-size:12px;outline:none;flex:none}
.status{display:flex;gap:16px;align-items:center;padding:0 12px;height:26px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--dim);flex:none;overflow:hidden;white-space:nowrap}
/* file manager */
.fm{display:flex;flex-direction:column;height:100%}
.fm-main{flex:1;display:flex;min-height:0}
.fm-side{width:200px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.fm-side .sh{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mute);padding:10px 8px 4px}
.side-i{height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;font-size:12.5px;border:1px solid transparent;cursor:default}
.side-i:hover{background:var(--hover)}

function mangaSVG(i){const hues=[160,20,200,280,45,340];const h=hues[i%hues.length];const tall=i%3===0;const H=tall?1500:1100;let panels='';const rows=tall?4:3;const ph=(H-60)/rows;for(let r=0;r<rows;r++){const y=30+r*ph;if(r%2){panels+=`<rect x="30" y="${y}" width="360" height="${ph-20}" fill="hsl(${h},30%,${12+r*4}%)" stroke="#eee" stroke-width="4"/><rect x="410" y="${y}" width="360" height="${ph-20}" fill="hsl(${h},40%,${18+r*3}%)" stroke="#eee" stroke-width="4"/>`}else panels+=`<rect x="30" y="${y}" width="740" height="${ph-20}" fill="hsl(${h},35%,${10+r*5}%)" stroke="#eee" stroke-width="4"/><circle cx="${200+r*120}" cy="${y+ph/2}" r="${ph/4}" fill="none" stroke="hsl(${h},80%,70%)" stroke-width="3"/>`}
 return `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="${H}" viewBox="0 0 800 ${H}"><rect width="800" height="${H}" fill="#f4f1ea"/>${panels}<text x="400" y="${H/2+60}" text-anchor="middle" font-family="Georgia,serif" font-size="200" fill="#fff" stroke="#000" stroke-width="6">${i}</text><text x="770" y="${H-8}" text-anchor="end" font-family="monospace" font-size="18" fill="#333">FERROMOSS 条漫样例 · 第 ${i} 页</text></svg>`}
function makeWav(){const sr=22050,dur=3,n=sr*dur;const b=new ArrayBuffer(44+n*2),v=new DataView(b);const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);const notes=[220,277.18,329.63,440];for(let i=0;i<n;i++){const t=i/sr;const f=notes[Math.floor(t/.75)%4];const env=Math.exp(-((t%.75))*3);v.setInt16(44+i*2,Math.sin(2*Math.PI*f*t)*env*9000+Math.sin(2*Math.PI*f*1.5*t)*env*3000,true)}return new Blob([b],{type:'audio/wav'})}

 await core.mkdir('/home/pictures/条漫样例',{recursive:true}).catch(()=>{});for(let i=1;i<=12;i++)await W(`/home/pictures/条漫样例/${i}.svg`,mangaSVG(i));
 await W('/home/pictures/磁藓海报.svg',`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><radialGradient id="g" cx=".3" cy=".35" r=".7"><stop offset="0" stop-color="#1d5a45"/><stop offset="1" stop-color="#040605"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#g)"/>${Array.from({length:60},(_,i)=>`<circle cx="${(i*263)%1600}" cy="${(i*149)%1000}" r="${2+(i%7)*3}" fill="none" stroke="#6ff2c1" stroke-opacity="${.15+(i%5)*.1}"/>`).join('')}<path d="M0 760 Q400 640 800 740 T1600 700 V1000 H0Z" fill="#2a0f06" opacity=".8"/><text x="120" y="520" font-family="Georgia,serif" font-size="150" fill="#e2ebe5">磁藓纪</text><text x="126" y="590" font-family="monospace" font-size="26" letter-spacing="12" fill="#ff6b35">FERROMOSS</text></svg>`);
