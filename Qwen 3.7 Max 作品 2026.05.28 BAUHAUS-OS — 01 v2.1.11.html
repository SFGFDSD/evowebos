<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BAUHAUS/OS — 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Archivo:wght@300;400;500;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════
   BAUHAUS/OS — Neo-Swiss Editorial Design System
   ══════════════════════════════════════════════════════════════ */
:root {
  --paper: #EFEAE0;
  --paper-2: #E6E0D2;
  --surface: #F7F3EB;
  --ink: #0E0E0C;
  --ink-soft: #2A2A28;
  --red: #E63946;
  --blue: #1D4ED8;
  --yellow: #F4C430;
  --green: #2D7A3E;
  --muted: #8B857A;
  --line: #0E0E0C;
  --bw: 2px;
  --shadow-hard: 4px 4px 0 0 var(--ink);
  --shadow-hard-lg: 6px 6px 0 0 var(--ink);
  --radius: 0px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-sans: 'Archivo', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { border: none; background: none; cursor: pointer; }

/* Selection */
::selection { background: var(--yellow); color: var(--ink); }

/* ══════════════════════════════════════════════════════════════
   DESKTOP
   ══════════════════════════════════════════════════════════════ */
#desktop {
  position: fixed;
  inset: 0;
  bottom: 52px;
  overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--ink) 1px, transparent 1px),
    linear-gradient(90deg, var(--ink) 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: -1px -1px;
  opacity: 0.999;
}
#desktop::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(230,57,70,0.06) 0, transparent 35%),
    radial-gradient(circle at 85% 75%, rgba(29,78,216,0.05) 0, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(244,196,48,0.04) 0, transparent 50%);
  pointer-events: none;
}
#desktop::after {
  content: "";
  position: absolute;
  inset: 0;
  background-color: rgba(239,234,224,0.75);
  pointer-events: none;
}
#desktop.wallpaper-active { background-image: none; }
#desktop.wallpaper-active::after { background-color: rgba(0,0,0,0.25); }
#wallpaper-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
  display: none;
}
#desktop.wallpaper-active #wallpaper-layer { display: block; }

/* Corner decorations */
.corner-mark {
  position: absolute;
  width: 40px; height: 40px;
  z-index: 1;
  pointer-events: none;
  color: var(--ink);
  opacity: 0.4;
}
.corner-mark.tl { top: 14px; left: 14px; }
.corner-mark.tr { top: 14px; right: 14px; }
.corner-mark.bl { bottom: 14px; left: 14px; }
.corner-mark.br { bottom: 14px; right: 14px; }

#sys-label {
  position: absolute;
  top: 18px;
  left: 70px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--ink);
  opacity: 0.55;
  pointer-events: none;
  text-transform: uppercase;
}
#sys-label b { font-weight: 700; color: var(--red); }

#serial-label {
  position: absolute;
  top: 18px;
  right: 70px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--ink);
  opacity: 0.55;
  pointer-events: none;
}

/* ══════════════════════════════════════════════════════════════
   DESKTOP ICONS
   ══════════════════════════════════════════════════════════════ */
#desktop-icons {
  position: absolute;
  inset: 60px 20px 20px 20px;
  z-index: 5;
}
.desk-icon {
  position: absolute;
  width: 88px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(.2,.9,.3,1.2);
  z-index: 5;
  touch-action: none;
}
.desk-icon .icon-box {
  width: 52px;
  height: 52px;
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 3px 3px 0 0 var(--ink);
  transition: all 0.12s ease;
  position: relative;
}
.desk-icon.selected .icon-box {
  background: var(--yellow);
  box-shadow: 1px 1px 0 0 var(--ink);
  transform: translate(2px, 2px);
}
.desk-icon:active .icon-box {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 0 var(--ink);
}
.desk-icon svg { width: 28px; height: 28px; }
.desk-icon .icon-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: center;
  background: var(--paper);
  padding: 1px 4px;
  border: 1px solid var(--ink);
  word-break: break-word;
  line-height: 1.2;
  max-width: 100%;
  letter-spacing: 0.02em;
}
.desk-icon.selected .icon-label {
  background: var(--ink);
  color: var(--paper);
}
.desk-icon.drop-target .icon-box {
  background: var(--blue);
  color: var(--paper);
}

/* ══════════════════════════════════════════════════════════════
   WINDOWS
   ══════════════════════════════════════════════════════════════ */
.window {
  position: absolute;
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow-hard-lg);
  display: flex;
  flex-direction: column;
  min-width: 280px;
  min-height: 200px;
  overflow: hidden;
  animation: windowIn 0.22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes windowIn {
  from { opacity: 0; transform: translate(-6px,-6px) scale(0.97); }
  to { opacity: 1; transform: translate(0,0) scale(1); }
}
.window.minimizing {
  animation: windowOut 0.18s ease forwards;
}
@keyframes windowOut {
  to { opacity: 0; transform: translateY(40vh) scale(0.7); }
}
.window.maximized { border-radius: 0; }
.window-titlebar {
  height: 34px;
  background: var(--ink);
  color: var(--paper);
  display: flex;
  align-items: center;
  padding: 0 8px;
  gap: 10px;
  cursor: grab;
  flex-shrink: 0;
  border-bottom: var(--bw) solid var(--ink);
  position: relative;
}
.window-titlebar:active { cursor: grabbing; }
.window.focused .window-titlebar { background: var(--ink); }
.window:not(.focused) .window-titlebar { background: var(--muted); }
.window-title-icon {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
}
.window-title-icon svg { width: 16px; height: 16px; }
.window-title {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.window-controls {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.win-btn {
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--paper);
  background: transparent;
  color: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.1s;
  padding: 0;
}
.win-btn:hover { background: var(--paper); color: var(--ink); }
.win-btn.close:hover { background: var(--red); color: var(--paper); border-color: var(--red); }
.win-btn svg { width: 10px; height: 10px; }
.window-body {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  position: relative;
}

/* Resize handles */
.rh { position: absolute; z-index: 10; }
.rh-n { top: -3px; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
.rh-s { bottom: -3px; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
.rh-e { right: -3px; top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
.rh-w { left: -3px; top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
.rh-ne { top: -3px; right: -3px; width: 10px; height: 10px; cursor: nesw-resize; }
.rh-nw { top: -3px; left: -3px; width: 10px; height: 10px; cursor: nwse-resize; }
.rh-se { bottom: -3px; right: -3px; width: 10px; height: 10px; cursor: nwse-resize; }
.rh-sw { bottom: -3px; left: -3px; width: 10px; height: 10px; cursor: nesw-resize; }

/* ══════════════════════════════════════════════════════════════
   TASKBAR / DOCK
   ══════════════════════════════════════════════════════════════ */
#taskbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 52px;
  background: var(--ink);
  color: var(--paper);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  z-index: 10000;
  border-top: var(--bw) solid var(--ink);
}
#start-btn {
  height: 38px;
  padding: 0 14px;
  background: var(--red);
  color: var(--paper);
  border: 2px solid var(--paper);
  font-family: var(--font-display);
  font-weight: 700;
  font-style: italic;
  font-size: 15px;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform 0.1s;
}
#start-btn:hover { transform: translate(-2px, -2px); box-shadow: 2px 2px 0 var(--paper); }
#start-btn:active { transform: translate(0, 0); box-shadow: none; }

#task-items {
  flex: 1;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  overflow-y: hidden;
  height: 38px;
  scrollbar-width: none;
}
#task-items::-webkit-scrollbar { display: none; }
.task-item {
  height: 38px;
  padding: 0 10px;
  background: transparent;
  border: 1.5px solid transparent;
  color: var(--paper);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  max-width: 180px;
  text-transform: uppercase;
}
.task-item:hover { border-color: var(--paper); }
.task-item.active {
  background: var(--paper);
  color: var(--ink);
}
.task-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.task-item .t-label { overflow: hidden; text-overflow: ellipsis; }

#tray {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  border-left: 1.5px solid rgba(239,234,224,0.3);
  height: 38px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
}
#clock { font-weight: 700; }

/* ══════════════════════════════════════════════════════════════
   START MENU
   ══════════════════════════════════════════════════════════════ */
#start-menu {
  position: fixed;
  left: 10px;
  bottom: 58px;
  width: 340px;
  background: var(--paper);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow-hard-lg);
  z-index: 9999;
  display: none;
  animation: startIn 0.18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes startIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
#start-menu.open { display: block; }
#start-menu-header {
  padding: 14px 16px;
  border-bottom: var(--bw) solid var(--ink);
  background: var(--yellow);
  position: relative;
}
#start-menu-header h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -0.02em;
}
#start-menu-header .sub {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  margin-top: 4px;
  text-transform: uppercase;
}
#start-menu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
}
.start-app {
  padding: 14px 8px;
  border-right: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: background 0.1s;
  text-align: center;
}
.start-app:hover { background: var(--ink); color: var(--paper); }
.start-app:nth-child(3n) { border-right: none; }
.start-app svg { width: 26px; height: 26px; }
.start-app .name {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════
   CONTEXT MENU
   ══════════════════════════════════════════════════════════════ */
#context-menu {
  position: fixed;
  background: var(--paper);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow-hard);
  min-width: 200px;
  z-index: 100000;
  display: none;
  padding: 4px;
}
#context-menu.open { display: block; }
.ctx-item {
  padding: 7px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.03em;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid transparent;
}
.ctx-item:hover { background: var(--ink); color: var(--paper); }
.ctx-item svg { width: 12px; height: 12px; }
.ctx-item.danger:hover { background: var(--red); }
.ctx-sep {
  height: 1px;
  background: var(--ink);
  margin: 3px 0;
  opacity: 0.4;
}

/* ══════════════════════════════════════════════════════════════
   SELECTION RECT
   ══════════════════════════════════════════════════════════════ */
#sel-rect {
  position: absolute;
  background: rgba(244,196,48,0.25);
  border: 1.5px dashed var(--ink);
  pointer-events: none;
  z-index: 100;
  display: none;
}

/* ══════════════════════════════════════════════════════════════
   APP COMMON UI
   ══════════════════════════════════════════════════════════════ */
.app-toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  background: var(--paper-2);
  border-bottom: var(--bw) solid var(--ink);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.tb-btn {
  height: 28px;
  padding: 0 10px;
  background: var(--surface);
  border: 1.5px solid var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.1s;
}
.tb-btn:hover { background: var(--ink); color: var(--paper); }
.tb-btn.primary { background: var(--red); color: var(--paper); border-color: var(--ink); }
.tb-btn.primary:hover { background: var(--ink); color: var(--paper); }
.tb-btn svg { width: 12px; height: 12px; }
.tb-sep { width: 1.5px; height: 20px; background: var(--ink); opacity: 0.3; margin: 0 4px; }
.tb-input {
  height: 28px;
  padding: 0 8px;
  border: 1.5px solid var(--ink);
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 11px;
  outline: none;
  min-width: 0;
}
.tb-input:focus { background: var(--yellow); }

/* Scrollbars */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--paper-2); }
::-webkit-scrollbar-thumb { background: var(--ink); border: 2px solid var(--paper-2); }
::-webkit-scrollbar-thumb:hover { background: var(--red); }
::-webkit-scrollbar-corner { background: var(--paper-2); }

/* ══════════════════════════════════════════════════════════════
   FILE EXPLORER
   ══════════════════════════════════════════════════════════════ */
.fe-root { display: flex; flex: 1; min-height: 0; }
.fe-sidebar {
  width: 180px;
  background: var(--paper-2);
  border-right: var(--bw) solid var(--ink);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 8px 0;
}
.fe-sb-group-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-style: italic;
  font-size: 12px;
  padding: 8px 12px 4px;
  color: var(--red);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  border-top: 1px dashed var(--ink);
  margin-top: 4px;
}
.fe-sb-group-title:first-child { border-top: none; margin-top: 0; }
.fe-sb-item {
  padding: 5px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-left: 3px solid transparent;
}
.fe-sb-item:hover { background: var(--surface); }
.fe-sb-item.active { background: var(--yellow); border-left-color: var(--red); font-weight: 700; }
.fe-sb-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.fe-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.fe-breadcrumb {
  padding: 6px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  overflow-x: auto;
  white-space: nowrap;
}
.fe-breadcrumb .bc-seg {
  padding: 2px 6px;
  cursor: pointer;
  border: 1px solid transparent;
}
.fe-breadcrumb .bc-seg:hover { background: var(--yellow); border-color: var(--ink); }
.fe-breadcrumb .bc-sep { color: var(--muted); }
.fe-list-wrap {
  flex: 1;
  overflow: auto;
  background: var(--surface);
  position: relative;
}
.fe-list {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 11px;
}
.fe-list thead th {
  position: sticky;
  top: 0;
  background: var(--paper-2);
  border-bottom: var(--bw) solid var(--ink);
  text-align: left;
  padding: 6px 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 10px;
  cursor: pointer;
  user-select: none;
  border-right: 1px solid var(--ink);
}
.fe-list thead th:hover { background: var(--yellow); }
.fe-list thead th:last-child { border-right: none; }
.fe-list tbody tr { border-bottom: 1px solid rgba(14,14,12,0.08); cursor: pointer; }
.fe-list tbody tr:hover { background: var(--paper-2); }
.fe-list tbody tr.selected { background: var(--yellow); }
.fe-list td { padding: 5px 10px; white-space: nowrap; }
.fe-list td .fe-row { display: flex; align-items: center; gap: 8px; }
.fe-list td svg { width: 16px; height: 16px; flex-shrink: 0; }
.fe-status {
  padding: 4px 10px;
  background: var(--paper-2);
  border-top: 1px solid var(--ink);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  display: flex;
  justify-content: space-between;
  text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════
   NOTEPAD
   ══════════════════════════════════════════════════════════════ */
.np-root { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.np-editor {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  padding: 16px 20px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  background: var(--surface);
  color: var(--ink);
  tab-size: 4;
  user-select: text;
  -webkit-user-select: text;
}
.np-status {
  padding: 4px 12px;
  background: var(--paper-2);
  border-top: 1px solid var(--ink);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  display: flex;
  justify-content: space-between;
  text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════
   HTML EDITOR
   ══════════════════════════════════════════════════════════════ */
.he-root { flex: 1; display: flex; min-height: 0; }
.he-editor {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  background: #0E0E0C;
  color: #F7F3EB;
  user-select: text;
  -webkit-user-select: text;
  border-right: var(--bw) solid var(--ink);
}
.he-preview {
  flex: 1;
  border: none;
  background: white;
  min-width: 0;
}

/* ══════════════════════════════════════════════════════════════
   SPREADSHEET
   ══════════════════════════════════════════════════════════════ */
.ss-root { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ss-view { flex: 1; overflow: auto; background: var(--surface); }
.ss-table {
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 11px;
  width: max-content;
  min-width: 100%;
}
.ss-table th, .ss-table td {
  border: 1px solid var(--ink);
  padding: 3px 8px;
  min-width: 80px;
  white-space: nowrap;
}
.ss-table th {
  background: var(--ink);
  color: var(--paper);
  font-weight: 700;
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-size: 10px;
}
.ss-table tr:nth-child(even) td { background: var(--paper-2); }
.ss-text {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  background: var(--surface);
  user-select: text;
  -webkit-user-select: text;
  display: none;
}

/* ══════════════════════════════════════════════════════════════
   CALCULATOR
   ══════════════════════════════════════════════════════════════ */
.calc-root {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  padding: 12px;
}
.calc-display {
  background: var(--ink);
  color: var(--yellow);
  font-family: var(--font-mono);
  font-size: 32px;
  padding: 14px 16px;
  text-align: right;
  border: var(--bw) solid var(--ink);
  min-height: 70px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
  word-break: break-all;
}
.calc-display .expr {
  font-size: 11px;
  color: var(--paper);
  opacity: 0.55;
  letter-spacing: 0.05em;
  min-height: 14px;
}
.calc-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 1fr;
  gap: 6px;
  margin-top: 10px;
}
.calc-btn {
  background: var(--surface);
  border: 2px solid var(--ink);
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 3px 3px 0 0 var(--ink);
  transition: all 0.08s;
  color: var(--ink);
}
.calc-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 0 var(--ink); }
.calc-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 0 var(--ink); }
.calc-btn.op { background: var(--blue); color: var(--paper); }
.calc-btn.eq { background: var(--red); color: var(--paper); grid-row: span 2; }
.calc-btn.fn { background: var(--yellow); }
.calc-btn.clr { background: var(--paper); }

/* ══════════════════════════════════════════════════════════════
   PAINT
   ══════════════════════════════════════════════════════════════ */
.pt-root { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--paper-2); }
.pt-canvas-wrap { flex: 1; overflow: auto; padding: 16px; background:
  linear-gradient(45deg, var(--paper-2) 25%, transparent 25%),
  linear-gradient(-45deg, var(--paper-2) 25%, transparent 25%),
  linear-gradient(45deg, transparent 75%, var(--paper-2) 75%),
  linear-gradient(-45deg, transparent 75%, var(--paper-2) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-color: var(--surface);
}
.pt-canvas {
  background: white;
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow-hard);
  cursor: crosshair;
  touch-action: none;
  display: block;
  margin: 0 auto;
}

/* ══════════════════════════════════════════════════════════════
   BROWSER APP
   ══════════════════════════════════════════════════════════════ */
.br-root { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.br-frame { flex: 1; border: none; background: white; }

/* ══════════════════════════════════════════════════════════════
   IMAGE VIEWER
   ══════════════════════════════════════════════════════════════ */
.iv-root { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #0E0E0C; }
.iv-stage {
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.iv-stage img, .iv-stage video, .iv-stage audio {
  max-width: 100%;
  max-height: 100%;
  border: 2px solid var(--paper);
}
.iv-stage img { cursor: zoom-in; transition: transform 0.2s; }

/* ══════════════════════════════════════════════════════════════
   SETTINGS
   ══════════════════════════════════════════════════════════════ */
.set-root { flex: 1; display: flex; min-height: 0; }
.set-side {
  width: 170px;
  background: var(--paper-2);
  border-right: var(--bw) solid var(--ink);
  padding: 10px 0;
  overflow-y: auto;
}
.set-tab {
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  border-left: 3px solid transparent;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.set-tab:hover { background: var(--surface); }
.set-tab.active { background: var(--yellow); border-left-color: var(--red); font-weight: 700; }
.set-main { flex: 1; padding: 20px; overflow-y: auto; background: var(--surface); }
.set-main h2 {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 28px;
  line-height: 1;
  margin-bottom: 4px;
}
.set-main .set-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.set-section { margin-bottom: 28px; }
.set-section h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 10px;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--ink);
}
.wp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.wp-tile {
  aspect-ratio: 16/10;
  border: 2px solid var(--ink);
  cursor: pointer;
  background-size: cover;
  background-position: center;
  box-shadow: 3px 3px 0 0 var(--ink);
  position: relative;
  transition: transform 0.1s;
}
.wp-tile:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 0 var(--ink); }
.wp-tile.active::after {
  content: "✓";
  position: absolute;
  top: 4px; right: 4px;
  background: var(--red);
  color: var(--paper);
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
}
.set-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--ink);
}
.set-row:last-child { border-bottom: none; }
.set-row .lbl { flex: 1; font-family: var(--font-mono); font-size: 12px; }
.set-row .val { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* Storage visualization */
.storage-bar {
  height: 28px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  display: flex;
  overflow: hidden;
  position: relative;
}
.storage-bar > div {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink);
  font-weight: 700;
  min-width: 20px;
  overflow: hidden;
  white-space: nowrap;
}
.storage-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.storage-legend span { display: flex; align-items: center; gap: 5px; }
.storage-legend .sw { width: 12px; height: 12px; border: 1.5px solid var(--ink); }

/* ══════════════════════════════════════════════════════════════
   DIALOGS
   ══════════════════════════════════════════════════════════════ */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(14,14,12,0.5);
  z-index: 1000000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-box {
  background: var(--paper);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow-hard-lg);
  min-width: 320px;
  max-width: 90vw;
  max-height: 90vh;
  overflow: auto;
  animation: startIn 0.15s ease;
}
.modal-head {
  padding: 10px 14px;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
}
.modal-body { padding: 16px; }
.modal-body p { margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
.modal-body input {
  width: 100%;
  padding: 7px 10px;
  border: 2px solid var(--ink);
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
.modal-body input:focus { background: var(--yellow); }
.modal-foot {
  padding: 10px 14px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--ink);
  background: var(--paper-2);
}

/* ══════════════════════════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════════════════════════ */
#toast-host {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 1000001;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  padding: 8px 14px;
  border: 2px solid var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  box-shadow: 3px 3px 0 0 var(--red);
  animation: toastIn 0.22s cubic-bezier(.2,.9,.3,1.2);
  pointer-events: auto;
  max-width: 320px;
}
.toast.err { box-shadow: 3px 3px 0 0 var(--yellow); background: var(--red); }
.toast.ok { box-shadow: 3px 3px 0 0 var(--blue); background: var(--green); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
#boot {
  position: fixed;
  inset: 0;
  background: var(--ink);
  color: var(--paper);
  z-index: 10000000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
}
#boot .logo {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 900;
  font-size: 96px;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 18px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
#boot .logo .red { color: var(--red); }
#boot .logo .yellow { color: var(--yellow); }
#boot .logo .blue { color: var(--blue); }
#boot .tag {
  font-size: 11px;
  letter-spacing: 0.35em;
  margin-bottom: 40px;
  text-transform: uppercase;
  opacity: 0.8;
}
#boot .bar {
  width: 280px;
  height: 14px;
  border: 2px solid var(--paper);
  position: relative;
  background: var(--ink);
}
#boot .bar::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, var(--paper) 0, var(--paper) 10px, transparent 10px, transparent 14px);
  animation: bootBar 1.4s linear infinite;
}
@keyframes bootBar { from { background-position: 0 0; } to { background-position: 14px 0; } }
#boot .status {
  margin-top: 18px;
  font-size: 11px;
  letter-spacing: 0.15em;
  opacity: 0.7;
}

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE (Mobile & Tablet)
   ══════════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  #desktop { bottom: 60px; }
  #taskbar { height: 60px; padding: 0 6px; gap: 4px; }
  #start-btn { padding: 0 10px; font-size: 13px; height: 44px; }
  #start-btn .s-text { display: none; }
  .task-item { max-width: 120px; padding: 0 8px; height: 44px; }
  .task-item .t-label { max-width: 70px; }
  #tray { padding: 0 6px; font-size: 10px; gap: 6px; }
  #start-menu { width: calc(100vw - 20px); left: 10px; }
  .window { min-width: 260px; }
  .fe-sidebar { width: 130px; }
  .desk-icon { width: 76px; }
  .desk-icon .icon-box { width: 46px; height: 46px; }
  .corner-mark { display: none; }
  #sys-label, #serial-label { font-size: 9px; }
  #boot .logo { font-size: 56px; }
}
@media (max-width: 480px) {
  .fe-sidebar { display: none; }
  .task-item .t-label { display: none; }
}
</style>
</head>

</div>

</div>

/* ───────────────────────── Utilities ───────────────────────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const el = (tag, attrs = {}, ...children) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else if (c instanceof Node) e.appendChild(c);
  }
  return e;
};

const toast = (msg, type = '') => {
  const t = el('div', { class: 'toast ' + type }, msg);
  $('#toast-host').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .25s'; }, 2500);
  setTimeout(() => t.remove(), 2900);
};

const fmtSize = (n) => {
  if (n == null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
};
const fmtDate = (d) => {
  if (!d) return '—';
  const dt = new Date(d);
  const p = (n) => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
};
const extOf = (name) => {
  const m = /\.([^.\\/]+)$/.exec(name || '');
  return m ? m[1].toLowerCase() : '';
};
const mimeOf = (name) => {
  const ext = extOf(name);
  const map = {
    png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',svg:'image/svg+xml',ico:'image/x-icon',avif:'image/avif',
    mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',aac:'audio/aac',m4a:'audio/mp4',opus:'audio/opus',weba:'audio/webm',
    mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',mov:'video/quicktime',mkv:'video/x-matroska',avi:'video/x-msvideo',
    txt:'text/plain',md:'text/markdown',html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',
    json:'application/json',xml:'text/xml',csv:'text/csv',tsv:'text/tab-separated-values',yaml:'text/yaml',yml:'text/yaml',log:'text/plain',
    pdf:'application/pdf',
    zip:'application/zip',gz:'application/gzip',tar:'application/x-tar',
  };
  return map[ext] || 'application/octet-stream';
};
const kindOf = (name, isDir) => {
  if (isDir) return 'folder';
  const ext = extOf(name);
  const kinds = {
    image: ['png','jpg','jpeg','gif','webp','bmp','svg','ico','avif'],
    audio: ['mp3','wav','ogg','flac','aac','m4a','opus','weba'],
    video: ['mp4','webm','ogv','mov','mkv','avi'],
    text: ['txt','md','log','yaml','yml'],
    code: ['html','htm','css','js','mjs','json','xml','csv','tsv'],
    pdf: ['pdf'],
    archive: ['zip','gz','tar','tgz'],
  };
  for (const k in kinds) if (kinds[k].includes(ext)) return k;
  return 'file';
};

const pathJoin = (...parts) => {
  const p = parts.filter(Boolean).join('/').replace(/\/+/g, '/');
  return p || '/';
};
const pathDir = (p) => { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };
const pathBase = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); };
const pathNorm = (p) => {
  if (!p) return '/';
  const parts = p.split('/');
  const out = [];
  for (const seg of parts) {
    if (!seg || seg === '.') continue;
    if (seg === '..') out.pop();
    else out.push(seg);
  }
  return '/' + out.join('/');
};

/* ───────────────────────── File System (OPFS + Local Mount) ───────────────────────── */
const fs = {
  root: null,
  opfsOk: false,
  // Fallback in-memory tree if OPFS unavailable (keeps app functional)
  memRoot: null,
  // Metadata store (icon positions, settings, etc) — uses localStorage
  meta: null,
  // Mounts: Map<path, dirHandle>  (File System Access API)
  mounts: new Map(),
  // Mount metadata persisted to localStorage (for re-prompt on boot)
  mountRecords: [], // { path, name }

  async init() {
    // Metadata in localStorage
    try { this.meta = JSON.parse(localStorage.getItem('bauhaus.meta') || '{}'); } catch { this.meta = {}; }
    try { this.mountRecords = JSON.parse(localStorage.getItem('bauhaus.mounts') || '[]'); } catch { this.mountRecords = []; }

    // Try OPFS
    try {
      if (navigator.storage && navigator.storage.getDirectory) {
        this.root = await navigator.storage.getDirectory();
        this.opfsOk = true;
        await this._ensureDefaults();
      } else throw new Error('no OPFS');
    } catch (e) {
      console.warn('OPFS unavailable, using in-memory FS:', e);
      this.opfsOk = false;
      this.memRoot = { type: 'dir', children: new Map(), mtime: Date.now() };
      await this._ensureDefaultsMem();
    }
  },

  saveMeta() { localStorage.setItem('bauhaus.meta', JSON.stringify(this.meta)); },
  saveMounts() { localStorage.setItem('bauhaus.mounts', JSON.stringify(this.mountRecords)); },

  async _ensureDefaults() {
    const dirs = ['Desktop','Documents','Pictures','Music','Downloads','mnt','mnt/local'];
    for (const d of dirs) {
      const segs = d.split('/').filter(Boolean);
      let dir = this.root;
      for (const s of segs) dir = await dir.getDirectoryHandle(s, { create: true });
    }
    // Welcome README
    const docDir = await this.root.getDirectoryHandle('Documents', { create: true });
    try {
      await docDir.getFileHandle('WELCOME.md');
    } catch {
      const f = await docDir.getFileHandle('WELCOME.md', { create: true });
      const w = await f.createWritable();
      await w.write(
`# Welcome to BAUHAUS/OS

A single-file web operating system inspired by the Bauhaus movement and Swiss editorial design.

## Fundamentals
- Drag icons freely on the desktop
- Right-click anywhere for context actions
- Use File Explorer to navigate your OPFS filesystem
- Mount real folders via Settings > Storage > Mount Local Folder
- Drag files to/from your physical desktop (on desktop browsers)

## Built-in Applications
- **File Explorer** — navigate, copy, move, rename
- **Notepad** — edit text & code
- **Spreadsheet** — CSV/TSV views
- **HTML Studio** — live-preview editor
- **Calculator** — arithmetic with history
- **Paint** — raster drawing canvas
- **Browser** — embedded web viewer
- **Settings** — wallpaper, storage, mounts

> All data is stored in your browser via OPFS (Origin Private File System).

— Form follows function.
`);
      await w.close();
    }
  },
  async _ensureDefaultsMem() {
    // noop — in-memory already empty
  },

  /* ─── Path Resolution ─── */
  _isMountPath(p) {
    for (const mp of this.mounts.keys()) {
      if (p === mp || p.startsWith(mp + '/')) return mp;
    }
    return null;
  },
  async _resolveLocal(mountPath, restPath) {
    const handle = this.mounts.get(mountPath);
    if (!handle) throw new Error('mount gone: ' + mountPath);
    const segs = restPath.split('/').filter(Boolean);
    let cur = handle;
    for (let i = 0; i < segs.length; i++) {
      const isLast = i === segs.length - 1;
      try {
        if (isLast) {
          try { cur = await cur.getDirectoryHandle(segs[i]); }
          catch { cur = await cur.getFileHandle(segs[i]); }
        } else {
          cur = await cur.getDirectoryHandle(segs[i]);
        }
      } catch (e) {
        throw new Error('not found: ' + segs[i]);
      }
    }
    return cur;
  },

  async _resolveOPFS(p, opts = {}) {
    const segs = p.split('/').filter(Boolean);
    let cur = this.root;
    for (let i = 0; i < segs.length; i++) {
      const isLast = i === segs.length - 1;
      try {
        if (isLast && opts.asFile) cur = await cur.getFileHandle(segs[i], opts.create ? { create: true } : undefined);
        else if (isLast && opts.asDir) cur = await cur.getDirectoryHandle(segs[i], opts.create ? { create: true } : undefined);
        else if (isLast) {
          try { cur = await cur.getDirectoryHandle(segs[i]); }
          catch { cur = await cur.getFileHandle(segs[i]); }
        } else {
          cur = await cur.getDirectoryHandle(segs[i]);
        }
      } catch (e) {
        throw e;
      }
    }
    return cur;
  },
  async _resolveMem(p) {
    const segs = p.split('/').filter(Boolean);
    let cur = this.memRoot;
    for (const s of segs) {
      if (cur.type !== 'dir' || !cur.children.has(s)) throw new Error('not found');
      cur = cur.children.get(s);
    }
    return cur;
  },

  /* ─── Public API ─── */
  async stat(p, isLstat = false) {
    p = pathNorm(p);
    if (p === '/') return { name: '', path: '/', isDirectory: true, size: 0, mtime: Date.now() };
    const mp = this._isMountPath(p);
    if (mp) {
      const rest = p.slice(mp.length);
      if (!rest) return { name: pathBase(mp), path: mp, isDirectory: true, size: 0, mtime: Date.now(), mount: true };
      const h = await this._resolveLocal(mp, rest);
      if (h.kind === 'directory') return { name: h.name, path: p, isDirectory: true, size: 0, mtime: Date.now(), mount: true };
      const f = await h.getFile();
      return { name: h.name, path: p, isDirectory: false, size: f.size, mtime: f.lastModified, mount: true };
    }
    if (this.opfsOk) {
      try {
        const h = await this._resolveOPFS(p);
        if (h.kind === 'directory') return { name: pathBase(p), path: p, isDirectory: true, size: 0, mtime: Date.now() };
        const f = await h.getFile();
        return { name: h.name, path: p, isDirectory: false, size: f.size, mtime: f.lastModified };
      } catch (e) { throw new Error('ENOENT: ' + p); }
    } else {
      const node = await this._resolveMem(p);
      if (node.type === 'dir') return { name: pathBase(p), path: p, isDirectory: true, size: 0, mtime: node.mtime };
      return { name: pathBase(p), path: p, isDirectory: false, size: node.data.byteLength, mtime: node.mtime };
    }
  },

  async exists(p) { try { await this.stat(p); return true; } catch { return false; } },

  async readdir(p) {
    p = pathNorm(p);
    let entries = [];
    const mp = this._isMountPath(p);
    if (mp) {
      const rest = p.slice(mp.length);
      const h = rest ? await this._resolveLocal(mp, rest) : this.mounts.get(mp);
      for await (const [name, handle] of h.entries()) {
        if (handle.kind === 'directory') entries.push({ name, isDirectory: true, size: 0, mtime: Date.now() });
        else {
          try {
            const f = await handle.getFile();
            entries.push({ name, isDirectory: false, size: f.size, mtime: f.lastModified });
          } catch { entries.push({ name, isDirectory: false, size: 0, mtime: Date.now() }); }
        }
      }
      return entries;
    }
    if (p === '/') {
      // Root includes mount points as pseudo-dirs
      for (const [mp] of this.mounts) {
        const segs = mp.split('/').filter(Boolean);
        if (segs.length === 1) entries.push({ name: segs[0], isDirectory: true, size: 0, mtime: Date.now(), mount: true });
      }
    }
    // Add /mnt/local/<mountName> entries when listing /mnt or /mnt/local
    if (p === '/mnt' || p === '/mnt/local') {
      for (const [mp] of this.mounts) {
        const rel = mp.replace(/^\/mnt\/local\//, '');
        if (!rel) continue;
        if (p === '/mnt/local') entries.push({ name: rel, isDirectory: true, size: 0, mtime: Date.now(), mount: true });
      }
    }
    if (this.opfsOk) {
      try {
        const dir = p === '/' ? this.root : await this._resolveOPFS(p);
        for await (const [name, handle] of dir.entries()) {
          if (handle.kind === 'directory') entries.push({ name, isDirectory: true, size: 0, mtime: Date.now() });
          else {
            try {
              const f = await handle.getFile();
              entries.push({ name, isDirectory: false, size: f.size, mtime: f.lastModified });
            } catch { entries.push({ name, isDirectory: false, size: 0, mtime: Date.now() }); }
          }
        }
      } catch (e) {
        // root may still return mounts even if OPFS dir missing
        if (entries.length === 0) throw e;
      }
    } else {
      const node = p === '/' ? this.memRoot : await this._resolveMem(p);
      if (node.type !== 'dir') throw new Error('not a directory');
      for (const [name, child] of node.children) {
        entries.push({ name, isDirectory: child.type === 'dir', size: child.data ? child.data.byteLength : 0, mtime: child.mtime });
      }
    }
    return entries;
  },

  async readFile(p, flag) {
    p = pathNorm(p);
    const mp = this._isMountPath(p);
    if (mp) {
      const rest = p.slice(mp.length);
      const h = await this._resolveLocal(mp, rest);
      if (h.kind === 'directory') throw new Error('is a directory');
      const f = await h.getFile();
      return await f.arrayBuffer();
    }
    if (this.opfsOk) {
      const h = await this._resolveOPFS(p, { asFile: true });
      const f = await h.getFile();
      return await f.arrayBuffer();
    } else {
      const node = await this._resolveMem(p);
      if (node.type === 'dir') throw new Error('is a directory');
      return node.data.slice(0);
    }
  },
  async readFileText(p) {
    const buf = await this.readFile(p);
    return new TextDecoder('utf-8').decode(buf);
  },

  async writeFile(p, data) {
    p = pathNorm(p);
    if (typeof data === 'string') data = new TextEncoder().encode(data).buffer;
    if (data instanceof Uint8Array) data = data.buffer;
    // Ensure parent exists
    const parent = pathDir(p);
    await this.mkdir(parent);
    const mp = this._isMountPath(p);
    if (mp) {
      const rest = p.slice(mp.length);
      const segs = rest.split('/').filter(Boolean);
      const name = segs.pop();
      let dir = this.mounts.get(mp);
      for (const s of segs) dir = await dir.getDirectoryHandle(s, { create: true });
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
      return;
    }
    if (this.opfsOk) {
      const h = await this._resolveOPFS(p, { asFile: true, create: true });
      const w = await h.createWritable();
      await w.write(data);
      await w.close();
    } else {
      const segs = p.split('/').filter(Boolean);
      const name = segs.pop();
      let cur = this.memRoot;
      for (const s of segs) {
        if (!cur.children.has(s)) cur.children.set(s, { type: 'dir', children: new Map(), mtime: Date.now() });
        cur = cur.children.get(s);
      }
      cur.children.set(name, { type: 'file', data, mtime: Date.now() });
    }
  },

  async mkdir(p) {
    p = pathNorm(p);
    if (p === '/') return;
    const mp = this._isMountPath(p);
    if (mp) {
      const rest = p.slice(mp.length);
      if (!rest) return;
      const segs = rest.split('/').filter(Boolean);
      let dir = this.mounts.get(mp);
      for (const s of segs) dir = await dir.getDirectoryHandle(s, { create: true });
      return;
    }
    if (this.opfsOk) {
      const segs = p.split('/').filter(Boolean);
      let cur = this.root;
      for (const s of segs) cur = await cur.getDirectoryHandle(s, { create: true });
    } else {
      const segs = p.split('/').filter(Boolean);
      let cur = this.memRoot;
      for (const s of segs) {
        if (!cur.children.has(s)) cur.children.set(s, { type: 'dir', children: new Map(), mtime: Date.now() });
        cur = cur.children.get(s);
      }
    }
  },

  async unlink(p) {
    p = pathNorm(p);
    const mp = this._isMountPath(p);
    if (mp) {
      const rest = p.slice(mp.length);
      const segs = rest.split('/').filter(Boolean);
      const name = segs.pop();
      let dir = this.mounts.get(mp);
      for (const s of segs) dir = await dir.getDirectoryHandle(s);
      await dir.removeEntry(name, { recursive: true });
      return;
    }
    if (this.opfsOk) {
      const parent = pathDir(p);
      const name = pathBase(p);
      const dir = parent === '/' ? this.root : await this._resolveOPFS(parent);
      await dir.removeEntry(name, { recursive: true });
    } else {
      const segs = p.split('/').filter(Boolean);
      const name = segs.pop();
      let cur = this.memRoot;
      for (const s of segs) cur = cur.children.get(s);
      cur.children.delete(name);
    }
  },
  async rmdir(p) { return this.unlink(p); },

  async rename(oldPath, newPath) {
    oldPath = pathNorm(oldPath); newPath = pathNorm(newPath);
    // Cross-backend: copy + delete
    const data = await this.readFile(oldPath).catch(() => null);
    if (data !== null) {
      await this.writeFile(newPath, data);
      await this.unlink(oldPath);
    } else {
      // directory — recursive copy
      await this._copyDir(oldPath, newPath);
      await this.unlink(oldPath);
    }
  },
  async _copyDir(src, dst) {
    await this.mkdir(dst);
    const entries = await this.readdir(src);
    for (const e of entries) {
      const s = pathJoin(src, e.name), d = pathJoin(dst, e.name);
      if (e.isDirectory) await this._copyDir(s, d);
      else {
        const buf = await this.readFile(s);
        await this.writeFile(d, buf);
      }
    }
  },
  async copy(src, dst) {
    src = pathNorm(src); dst = pathNorm(dst);
    const st = await this.stat(src);
    if (st.isDirectory) await this._copyDir(src, dst);
    else {
      const buf = await this.readFile(src);
      await this.writeFile(dst, buf);
    }
  },

  /* ─── Mounts ─── */
  async mountLocal() {
    if (!window.showDirectoryPicker) { toast('File System Access API not supported', 'err'); return null; }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      const name = (handle.name || 'Local').replace(/[^a-zA-Z0-9_\-\u4e00-\u9fa5.]/g, '_');
      let mp = '/mnt/local/' + name, suffix = 1;
      while (this.mounts.has(mp)) mp = '/mnt/local/' + name + '_' + (suffix++);
      this.mounts.set(mp, handle);
      this.mountRecords.push({ path: mp, name });
      this.saveMounts();
      toast('Mounted: ' + mp, 'ok');
      return mp;
    } catch (e) {
      if (e.name !== 'AbortError') toast('Mount failed: ' + e.message, 'err');
      return null;
    }
  },
  unmount(mp) {
    this.mounts.delete(mp);
    this.mountRecords = this.mountRecords.filter(m => m.path !== mp);
    this.saveMounts();
  },

  /* ─── Storage Quota ─── */
  async quota() {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    try { return await navigator.storage.estimate(); } catch { return null; }
  },

  async resetAll() {
    if (this.opfsOk && this.root) {
      for await (const [name] of this.root.entries()) await this.root.removeEntry(name, { recursive: true });
    }
    localStorage.removeItem('bauhaus.meta');
    localStorage.removeItem('bauhaus.mounts');
    this.meta = {};
    this.mountRecords = [];
    this.mounts.clear();
    await this._ensureDefaults();
  }
};

/* ───────────────────────── Window Manager ───────────────────────── */
const WM = {
  windows: new Map(),
  zTop: 100,
  nextId: 1,

  open(opts) {
    const id = 'w' + (this.nextId++);
    const w = el('div', { class: 'window focused', 'data-id': id });
    const vw = window.innerWidth, vh = window.innerHeight - 52;
    const width = Math.min(opts.width || 720, vw - 20);
    const height = Math.min(opts.height || 480, vh - 20);
    const left = Math.max(10, (vw - width) / 2 + ((this.windows.size % 6) * 24) - 60);
    const top = Math.max(10, (vh - height) / 2 + ((this.windows.size % 6) * 24) - 60);
    w.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px;z-index:${++this.zTop};`;

    const titlebar = el('div', { class: 'window-titlebar' });
    titlebar.appendChild(el('div', { class: 'window-title-icon', html: opts.icon || I.file }));
    const titleEl = el('div', { class: 'window-title' }, opts.title || 'Window');
    titlebar.appendChild(titleEl);
    const ctrls = el('div', { class: 'window-controls' });
    const btnMin = el('button', { class: 'win-btn', title: 'Minimize', html: I.min });
    const btnMax = el('button', { class: 'win-btn', title: 'Maximize', html: I.max });
    const btnClose = el('button', { class: 'win-btn close', title: 'Close', html: I.close });
    ctrls.append(btnMin, btnMax, btnClose);
    titlebar.appendChild(ctrls);
    w.appendChild(titlebar);

    const body = el('div', { class: 'window-body' });
    if (opts.content instanceof Node) body.appendChild(opts.content);
    else if (typeof opts.content === 'string') body.innerHTML = opts.content;
    w.appendChild(body);

    // Resize handles
    ['n','s','e','w','ne','nw','se','sw'].forEach(d => {
      w.appendChild(el('div', { class: 'rh rh-' + d, 'data-dir': d }));
    });

    document.body.appendChild(w);

    const winObj = { id, el: w, title: opts.title || 'Window', icon: opts.icon, minimized: false, maximized: false, prevRect: null, onClose: opts.onClose, appId: opts.appId, body };
    this.windows.set(id, winObj);

    // Focus
    w.addEventListener('pointerdown', () => this.focus(id));
    this.focus(id);

    // Drag (title bar)
    titlebar.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.win-btn')) return;
      if (winObj.maximized) return;
      this._startDrag(winObj, e);
    });
    // Double click titlebar to max
    titlebar.addEventListener('dblclick', () => this.toggleMax(id));

    // Resize
    w.querySelectorAll('.rh').forEach(h => {
      h.addEventListener('pointerdown', (e) => { e.stopPropagation(); this._startResize(winObj, e, h.dataset.dir); });
    });

    btnMin.addEventListener('click', () => this.minimize(id));
    btnMax.addEventListener('click', () => this.toggleMax(id));
    btnClose.addEventListener('click', () => this.close(id));

    updateTaskbar();
    if (opts.onReady) opts.onReady({ win: winObj, setTitle: (t) => { winObj.title = t; titleEl.textContent = t; updateTaskbar(); }, body });
    return winObj;
  },

  focus(id) {
    const w = this.windows.get(id); if (!w) return;
    if (w.minimized) { w.el.style.display = ''; w.minimized = false; }
    this.windows.forEach(x => x.el.classList.remove('focused'));
    w.el.classList.add('focused');
    w.el.style.zIndex = ++this.zTop;
    updateTaskbar();
  },

  minimize(id) {
    const w = this.windows.get(id); if (!w) return;
    w.el.classList.add('minimizing');
    setTimeout(() => {
      w.el.style.display = 'none';
      w.el.classList.remove('minimizing');
      w.minimized = true;
      updateTaskbar();
    }, 170);
  },

  toggleMax(id) {
    const w = this.windows.get(id); if (!w) return;
    if (w.maximized) {
      const r = w.prevRect;
      w.el.style.left = r.left + 'px'; w.el.style.top = r.top + 'px';
      w.el.style.width = r.width + 'px'; w.el.style.height = r.height + 'px';
      w.el.classList.remove('maximized');
      w.maximized = false;
    } else {
      w.prevRect = { left: parseInt(w.el.style.left), top: parseInt(w.el.style.top), width: w.el.offsetWidth, height: w.el.offsetHeight };
      w.el.style.left = '0px'; w.el.style.top = '0px';
      w.el.style.width = window.innerWidth + 'px';
      w.el.style.height = (window.innerHeight - 52) + 'px';
      w.el.classList.add('maximized');
      w.maximized = true;
    }
  },

  close(id) {
    const w = this.windows.get(id); if (!w) return;
    try { if (w.onClose) w.onClose(); } catch(e) { console.warn(e); }
    w.el.classList.add('minimizing');
    setTimeout(() => {
      w.el.remove();
      this.windows.delete(id);
      updateTaskbar();
    }, 170);
  },

  _startDrag(winObj, e) {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const sx = parseInt(winObj.el.style.left), sy = parseInt(winObj.el.style.top);
    const onMove = (ev) => {
      let nx = sx + (ev.clientX - startX);
      let ny = sy + (ev.clientY - startY);
      nx = Math.max(-winObj.el.offsetWidth + 80, Math.min(window.innerWidth - 80, nx));
      ny = Math.max(0, Math.min(window.innerHeight - 90, ny));
      winObj.el.style.left = nx + 'px';
      winObj.el.style.top = ny + 'px';
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  },

  _startResize(winObj, e, dir) {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const r = winObj.el.getBoundingClientRect();
    const sL = r.left, sT = r.top, sW = r.width, sH = r.height;
    const onMove = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      let l = sL, t = sT, w = sW, h = sH;
      if (dir.includes('e')) w = Math.max(280, sW + dx);
      if (dir.includes('s')) h = Math.max(200, sH + dy);
      if (dir.includes('w')) { const nw = Math.max(280, sW - dx); l = sL + (sW - nw); w = nw; }
      if (dir.includes('n')) { const nh = Math.max(200, sH - dy); t = sT + (sH - nh); h = nh; }
      winObj.el.style.left = l + 'px'; winObj.el.style.top = t + 'px';
      winObj.el.style.width = w + 'px'; winObj.el.style.height = h + 'px';
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
};

function updateTaskbar() {
  const tb = $('#task-items');
  tb.innerHTML = '';
  WM.windows.forEach((w, id) => {
    const btn = el('button', {
      class: 'task-item' + (w.el.classList.contains('focused') && !w.minimized ? ' active' : ''),
      title: w.title
    });
    btn.innerHTML = (w.icon || I.file) + '<span class="t-label">' + escapeHtml(w.title) + '</span>';
    btn.addEventListener('click', () => {
      if (w.minimized || !w.el.classList.contains('focused')) WM.focus(id);
      else WM.minimize(id);
    });
    tb.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ───────────────────────── Dialogs ───────────────────────── */
function modal({ title = 'Dialog', body, ok = 'OK', cancel = 'Cancel', onOk } = {}) {
  return new Promise((resolve) => {
    const bg = el('div', { class: 'modal-bg' });
    const box = el('div', { class: 'modal-box' });
    box.appendChild(el('div', { class: 'modal-head' }, title));
    const bodyEl = el('div', { class: 'modal-body' });
    if (typeof body === 'string') bodyEl.innerHTML = body;
    else if (body instanceof Node) bodyEl.appendChild(body);
    box.appendChild(bodyEl);
    const foot = el('div', { class: 'modal-foot' });
    if (cancel) {
      const cBtn = el('button', { class: 'tb-btn' }, cancel);
      cBtn.addEventListener('click', () => { bg.remove(); resolve(false); });
      foot.appendChild(cBtn);
    }
    const oBtn = el('button', { class: 'tb-btn primary' }, ok);
    oBtn.addEventListener('click', async () => {
      let res = true;
      if (onOk) res = await onOk(bodyEl);
      if (res !== false) { bg.remove(); resolve(res); }
    });
    foot.appendChild(oBtn);
    box.appendChild(foot);
    bg.appendChild(box);
    bg.addEventListener('click', (e) => { if (e.target === bg) { bg.remove(); resolve(false); } });
    document.body.appendChild(bg);
    setTimeout(() => {
      const inp = box.querySelector('input');
      if (inp) { inp.focus(); inp.select(); }
    }, 50);
  });
}

async function promptText(title, defaultVal = '') {
  const inp = el('input', { type: 'text', value: defaultVal });
  const res = await modal({
    title,
    body: inp,
    onOk: () => inp.value
  });
  return res === false ? null : res;
}

async function confirmDlg(title, msg) {
  return await modal({ title, body: `<p>${msg}</p>`, ok: 'Confirm', cancel: 'Cancel' });
}

/* ───────────────────────── Desktop Manager ───────────────────────── */
const Desktop = {
  icons: new Map(), // path -> {el, x, y, kind, isDir, name}
  selected: new Set(),
  dragCache: new Map(), // path -> File object (preloaded for drag-out)

  async init() {
    await this.loadIcons();
    this.renderAll();
    this._setupEvents();
  },

  async loadIcons() {
    this.icons = new Map();
    const layout = fs.meta.desktopIcons || null;
    // Default: Desktop folder contents + system shortcuts
    try {
      const entries = await fs.readdir('/Desktop');
      const startX = 20, startY = 20;
      const step = 96;
      const cols = Math.max(1, Math.floor((window.innerWidth - 40) / step));
      entries.forEach((e, i) => {
        const path = '/Desktop/' + e.name;
        let x = startX, y = startY + step * i;
        if (layout && layout[path]) { x = layout[path].x; y = layout[path].y; }
        else { x = startX + (i % cols) * step; y = startY + Math.floor(i / cols) * step; }
        this.icons.set(path, { path, name: e.name, isDir: e.isDirectory, kind: kindOf(e.name, e.isDirectory), x, y, size: e.size, mtime: e.mtime });
      });
    } catch(e) { console.warn(e); }
    // System shortcuts at leftmost column (always present, saved into layout too)
    const shortcuts = [
      { path: '::explorer', name: 'File Explorer', kind: 'app', appId: 'explorer', isDir: false },
      { path: '::documents', name: 'Documents', kind: 'shortcut', target: '/Documents', isDir: true },
      { path: '::downloads', name: 'Downloads', kind: 'shortcut', target: '/Downloads', isDir: true },
      { path: '::settings', name: 'Settings', kind: 'app', appId: 'settings', isDir: false },
    ];
    shortcuts.forEach((s, i) => {
      const x = 20, y = 20 + i * 96;
      let iconData = layout && layout[s.path] ? layout[s.path] : { x, y };
      this.icons.set(s.path, { ...s, x: iconData.x, y: iconData.y });
    });
  },

  iconSvg(d) {
    if (d.kind === 'app') {
      const m = { explorer: I.explorer, settings: I.settings };
      return m[d.appId] || I.file;
    }
    if (d.isDir) return I.folder;
    const k = d.kind;
    if (k === 'image') return I.image;
    if (k === 'audio') return I.audio;
    if (k === 'video') return I.video;
    if (k === 'code') return I.code;
    if (k === 'pdf') return I.pdf;
    if (k === 'archive') return I.zip;
    return I.file;
  },

  renderAll() {
    const host = $('#desktop-icons');
    host.innerHTML = '';
    this.icons.forEach((d, path) => {
      const icon = el('div', {
        class: 'desk-icon',
        'data-path': path,
        style: { left: d.x + 'px', top: d.y + 'px' },
        draggable: 'true'
      });
      icon.innerHTML = `<div class="icon-box">${this.iconSvg(d)}</div><div class="icon-label">${escapeHtml(d.name)}</div>`;
      icon.addEventListener('click', (e) => this.onClick(e, path));
      icon.addEventListener('dblclick', (e) => this.onDblClick(e, path));
      icon.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); this.selectOnly(path); openContextMenu(e.clientX, e.clientY, iconMenuItems(path)); });
      icon.addEventListener('dragstart', (e) => this.onIconDragStart(e, path));
      icon.addEventListener('dragend', (e) => this.onIconDragEnd(e, path));
      // Touch: tap to select, double-tap to open
      let lastTap = 0;
      icon.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 320) { this.onDblClick(e, path); lastTap = 0; }
        else lastTap = now;
      });
      host.appendChild(icon);
      d.el = icon;
    });
  },

  selectOnly(path) {
    this.selected.clear();
    this.selected.add(path);
    $$('.desk-icon.selected').forEach(n => n.classList.remove('selected'));
    const d = this.icons.get(path); if (d && d.el) d.el.classList.add('selected');
  },
  addToSelect(path) {
    this.selected.add(path);
    const d = this.icons.get(path); if (d && d.el) d.el.classList.add('selected');
  },
  clearSelect() {
    this.selected.clear();
    $$('.desk-icon.selected').forEach(n => n.classList.remove('selected'));
  },

  onClick(e, path) {
    e.stopPropagation();
    if (e.ctrlKey || e.metaKey) {
      if (this.selected.has(path)) { this.selected.delete(path); const d = this.icons.get(path); if (d?.el) d.el.classList.remove('selected'); }
      else this.addToSelect(path);
    } else this.selectOnly(path);
  },

  onDblClick(e, path) {
    const d = this.icons.get(path); if (!d) return;
    if (d.kind === 'app') { Apps.open(d.appId); return; }
    if (d.kind === 'shortcut') { Apps.open('explorer', { path: d.target }); return; }
    if (d.isDir) { Apps.open('explorer', { path: d.path }); return; }
    Apps.openForFile(d.path);
  },

  async preloadForDrag(path) {
    const d = this.icons.get(path);
    if (!d || d.kind === 'app' || d.kind === 'shortcut' || d.isDir) return;
    try {
      const buf = await fs.readFile(path);
      const file = new File([buf], d.name, { type: mimeOf(d.name) });
      this.dragCache.set(path, file);
    } catch(e) { console.warn('preload failed', e); }
  },

  onIconDragStart(e, path) {
    const d = this.icons.get(path);
    if (!d) { e.preventDefault(); return; }
    if (!this.selected.has(path)) this.selectOnly(path);
    e.dataTransfer.effectAllowed = 'copyMove';

    // Internal: record path + offset for desktop repositioning
    e.dataTransfer.setData('application/x-bauhaus-icon', JSON.stringify({
      paths: Array.from(this.selected),
      startX: e.clientX, startY: e.clientY
    }));

    // External (file drag out): sync read cache
    if (d.kind !== 'app' && d.kind !== 'shortcut' && !d.isDir) {
      const file = this.dragCache.get(path);
      if (file) {
        try { e.dataTransfer.items.add(file); } catch(e){}
        try {
          const url = URL.createObjectURL(file);
          e.dataTransfer.setData('DownloadURL', `${file.type}:${file.name}:${url}`);
          // Delayed revoke
          setTimeout(() => URL.revokeObjectURL(url), 8000);
        } catch(e){}
      }
    }
  },

  onIconDragEnd(e, path) {
    // Cleanup after a moment
  },

  _setupEvents() {
    const desk = $('#desktop');
    // preload on mouseenter
    desk.addEventListener('mouseenter', (e) => {
      const ic = e.target.closest('.desk-icon');
      if (ic) this.preloadForDrag(ic.dataset.path);
    }, true);

    // Desktop drop (reposition + external file import)
    desk.addEventListener('dragover', (e) => {
      if (e.target.closest('.desk-icon')) return; // let icon handle it
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    desk.addEventListener('drop', async (e) => {
      if (e.target.closest('.desk-icon')) return;
      e.preventDefault();
      const internal = e.dataTransfer.getData('application/x-bauhaus-icon');
      if (internal) {
        // Reposition selected icons
        try {
          const data = JSON.parse(internal);
          const rect = desk.getBoundingClientRect();
          for (const p of data.paths) {
            const d = this.icons.get(p);
            if (!d) continue;
            const dx = e.clientX - data.startX;
            const dy = e.clientY - data.startY;
            // Snap to 8px grid
            d.x = Math.max(10, Math.round((d.x + dx) / 8) * 8);
            d.y = Math.max(10, Math.round((d.y + dy) / 8) * 8);
            if (d.el) { d.el.style.left = d.x + 'px'; d.el.style.top = d.y + 'px'; }
          }
          this.saveLayout();
        } catch(err) { console.warn(err); }
        return;
      }
      // External files
      if (e.dataTransfer.items && e.dataTransfer.items.length) {
        await this._importDrop(e.dataTransfer, e.clientX, e.clientY);
      }
    });

    // Icon-over drop (move to folder)
    desk.addEventListener('dragover', (e) => {
      const ic = e.target.closest('.desk-icon');
      if (!ic) return;
      const d = this.icons.get(ic.dataset.path);
      if (d && (d.isDir || d.kind === 'shortcut')) { e.preventDefault(); ic.classList.add('drop-target'); }
    });
    desk.addEventListener('dragleave', (e) => {
      const ic = e.target.closest('.desk-icon');
      if (ic) ic.classList.remove('drop-target');
    });
    desk.addEventListener('drop', async (e) => {
      const ic = e.target.closest('.desk-icon');
      if (!ic) return;
      ic.classList.remove('drop-target');
      const d = this.icons.get(ic.dataset.path);
      if (!d || (!d.isDir && d.kind !== 'shortcut')) return;
      e.preventDefault();
      const internal = e.dataTransfer.getData('application/x-bauhaus-icon');
      const targetPath = d.kind === 'shortcut' ? d.target : d.path;
      if (internal) {
        try {
          const data = JSON.parse(internal);
          for (const p of data.paths) {
            if (p === ic.dataset.path) continue;
            const dd = this.icons.get(p);
            if (!dd) continue;
            await fs.rename(p, pathJoin(targetPath, dd.name));
          }
          toast('Moved', 'ok');
          this.loadIcons().then(() => this.renderAll());
        } catch(err) { toast('Move failed: ' + err.message, 'err'); }
      } else if (e.dataTransfer.items) {
        await this._importDrop(e.dataTransfer, e.clientX, e.clientY, targetPath);
      }
    });

    // Selection rectangle
    let selStart = null;
    desk.addEventListener('pointerdown', (e) => {
      const t = e.target;
      const onIcon = !!t.closest('.desk-icon');
      const onWallpaper = t === desk || t === $('#wallpaper-layer');
      if (!onWallpaper || onIcon) {
        if (!onIcon) this.clearSelect();
        return;
      }
      selStart = { x: e.clientX, y: e.clientY };
      const sr = $('#sel-rect');
      sr.style.display = 'block';
      sr.style.left = e.clientX + 'px'; sr.style.top = e.clientY + 'px';
      sr.style.width = '0px'; sr.style.height = '0px';
    });
    window.addEventListener('pointermove', (e) => {
      if (!selStart) return;
      const sr = $('#sel-rect');
      const x = Math.min(e.clientX, selStart.x), y = Math.min(e.clientY, selStart.y);
      const w = Math.abs(e.clientX - selStart.x), h = Math.abs(e.clientY - selStart.y);
      sr.style.left = x + 'px'; sr.style.top = y + 'px'; sr.style.width = w + 'px'; sr.style.height = h + 'px';
      // Check intersection
      const rect = { x, y, w, h };
      this.icons.forEach((d, p) => {
        if (!d.el) return;
        const r = d.el.getBoundingClientRect();
        const deskRect = desk.getBoundingClientRect();
        const ir = { x: r.left - deskRect.left, y: r.top - deskRect.top, w: r.width, h: r.height };
        if (rect.x < ir.x + ir.w && rect.x + rect.w > ir.x && rect.y < ir.y + ir.h && rect.y + rect.h > ir.y) this.addToSelect(p);
        else { d.el.classList.remove('selected'); this.selected.delete(p); }
      });
    });
    window.addEventListener('pointerup', () => {
      if (selStart) {
        selStart = null;
        $('#sel-rect').style.display = 'none';
      }
    });

    // Desktop context menu
    desk.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.desk-icon')) return;
      e.preventDefault();
      openContextMenu(e.clientX, e.clientY, desktopMenuItems());
    });

    // Click empty to clear
    desk.addEventListener('click', (e) => {
      if (e.target === desk || e.target === $('#wallpaper-layer')) this.clearSelect();
    });

    // Global context close
    document.addEventListener('click', () => closeContextMenu());
    document.addEventListener('scroll', () => closeContextMenu(), true);
  },

  async _importDrop(dt, x, y, targetDir = '/Desktop') {
    try {
      const entries = [];
      for (let i = 0; i < dt.items.length; i++) {
        const item = dt.items[i];
        let entry = null;
        if (item.getAsEntry) entry = item.getAsEntry();
        else if (item.webkitGetAsEntry) entry = item.webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      if (entries.length) {
        for (const entry of entries) await this._walkEntry(entry, targetDir);
        toast('Imported ' + entries.length + ' item(s)', 'ok');
        this.loadIcons().then(() => this.renderAll());
        return;
      }
      // Fallback
      const files = dt.files;
      for (const f of files) {
        const buf = await f.arrayBuffer();
        await fs.writeFile(pathJoin(targetDir, f.name), buf);
      }
      toast('Imported ' + files.length + ' file(s)', 'ok');
      this.loadIcons().then(() => this.renderAll());
    } catch (err) { toast('Import failed: ' + err.message, 'err'); }
  },

  async _walkEntry(entry, dir) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      const buf = await file.arrayBuffer();
      await fs.writeFile(pathJoin(dir, entry.name), buf);
    } else if (entry.isDirectory) {
      const sub = pathJoin(dir, entry.name);
      await fs.mkdir(sub);
      const reader = entry.createReader();
      const all = [];
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const b of batch) all.push(b);
      } while (batch.length > 0);
      for (const child of all) await this._walkEntry(child, sub);
    }
  },

  saveLayout() {
    const layout = {};
    this.icons.forEach((d, p) => { layout[p] = { x: d.x, y: d.y }; });
    fs.meta.desktopIcons = layout;
    fs.saveMeta();
  }
};

/* ───────────────────────── Context Menu ───────────────────────── */
function openContextMenu(x, y, items) {
  const m = $('#context-menu');
  m.innerHTML = '';
  for (const it of items) {
    if (it === '-') { m.appendChild(el('div', { class: 'ctx-sep' })); continue; }
    const btn = el('div', { class: 'ctx-item' + (it.danger ? ' danger' : '') });
    btn.innerHTML = (it.icon || '') + '<span>' + escapeHtml(it.label) + '</span>';
    btn.addEventListener('click', (e) => { e.stopPropagation(); closeContextMenu(); it.action(); });
    m.appendChild(btn);
  }
  m.classList.add('open');
  // Position
  m.style.left = x + 'px'; m.style.top = y + 'px';
  const vw = window.innerWidth, vh = window.innerHeight;
  requestAnimationFrame(() => {
    const r = m.getBoundingClientRect();
    if (r.right > vw - 4) m.style.left = (vw - r.width - 4) + 'px';
    if (r.bottom > vh - 4) m.style.top = (vh - r.height - 4) + 'px';
  });
}
function closeContextMenu() { $('#context-menu').classList.remove('open'); }

function desktopMenuItems() {
  return [
    { label: 'New Folder', icon: I.newFolder, action: async () => {
      const name = await promptText('New folder name', 'New Folder');
      if (!name) return;
      await fs.mkdir('/Desktop/' + name);
      Desktop.loadIcons().then(() => Desktop.renderAll());
    }},
    { label: 'New Text File', icon: I.newFile, action: async () => {
      const name = await promptText('New file name', 'Untitled.txt');
      if (!name) return;
      await fs.writeFile('/Desktop/' + name, '');
      Desktop.loadIcons().then(() => Desktop.renderAll());
    }},
    '-',
    { label: 'Import Files...', icon: I.upload, action: () => importFiles('/Desktop') },
    { label: 'Import Folder...', icon: I.folder, action: () => importFolder('/Desktop') },
    '-',
    { label: 'Refresh Desktop', icon: I.refresh, action: () => Desktop.loadIcons().then(() => Desktop.renderAll()) },
    { label: 'Change Wallpaper...', icon: I.image, action: () => Apps.open('settings', { tab: 'appearance' }) },
    '-',
    { label: 'Toggle Fullscreen', icon: I.max, action: () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    }}
  ];
}

function iconMenuItems(path) {
  const d = Desktop.icons.get(path);
  if (!d) return [];
  if (d.kind === 'app' || d.kind === 'shortcut') {
    return [
      { label: 'Open', icon: I.play, action: () => Desktop.onDblClick({}, path) },
    ];
  }
  const items = [
    { label: 'Open', icon: I.play, action: () => Desktop.onDblClick({}, path) },
  ];
  if (!d.isDir) {
    items.push({ label: 'Open with Notepad', icon: I.notepad, action: () => Apps.open('notepad', { path }) });
    items.push({ label: 'Download', icon: I.download, action: () => downloadFile(path) });
  }
  items.push('-');
  items.push({ label: 'Rename', icon: I.rename, action: async () => {
    const n = await promptText('Rename', d.name);
    if (!n || n === d.name) return;
    await fs.rename(path, pathJoin(pathDir(path), n));
    Desktop.loadIcons().then(() => Desktop.renderAll());
  }});
  items.push({ label: 'Delete', icon: I.trash, danger: true, action: async () => {
    if (!(await confirmDlg('Delete', 'Delete "' + d.name + '"?'))) return;
    await fs.unlink(path);
    Desktop.loadIcons().then(() => Desktop.renderAll());
  }});
  return items;
}

async function downloadFile(path) {
  try {
    const buf = await fs.readFile(path);
    const name = pathBase(path);
    const blob = new Blob([buf], { type: mimeOf(name) });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e) { toast('Download failed: ' + e.message, 'err'); }
}

async function importFiles(targetDir) {
  const inp = el('input', { type: 'file', multiple: 'true' });
  inp.addEventListener('change', async () => {
    for (const f of inp.files) {
      const buf = await f.arrayBuffer();
      await fs.writeFile(pathJoin(targetDir, f.name), buf);
    }
    toast('Imported ' + inp.files.length + ' file(s)', 'ok');
    Desktop.loadIcons().then(() => Desktop.renderAll());
  });
  inp.click();
}
async function importFolder(targetDir) {
  const inp = el('input', { type: 'file', webkitdirectory: 'true', directory: 'true' });
  inp.setAttribute('webkitdirectory', '');
  inp.setAttribute('directory', '');
  inp.addEventListener('change', async () => {
    for (const f of inp.files) {
      const buf = await f.arrayBuffer();
      const rel = f.webkitRelativePath || f.name;
      await fs.writeFile(pathJoin(targetDir, rel), buf);
    }
    toast('Imported folder', 'ok');
    Desktop.loadIcons().then(() => Desktop.renderAll());
  });
  inp.click();
}

/* ───────────────────────── Start Menu ───────────────────────── */
function setupStartMenu() {
  const grid = $('#start-menu-grid');
