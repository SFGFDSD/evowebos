/* ───────────────────────── Built-in Apps ───────────────────────── */
const Apps = {
  open(id, opts = {}) {
    const app = this.registry[id];
    if (!app) { toast('Unknown app: ' + id, 'err'); return; }
    const content = el('div');
    content.style.cssText = 'flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;';
    const win = WM.open({
      title: app.title || id,
      icon: app.icon || I.file,
      width: app.width, height: app.height,
      content, appId: id,
      onReady: (api) => {
        try {
          const result = app.init(api, opts);
          if (result && typeof result.catch === 'function') {
            result.catch(e => { console.error(e); toast('App error: ' + e.message, 'err'); });
          }
        } catch(e) { console.error(e); toast('App error: ' + e.message, 'err'); }
      }
    });
  },

  openForFile(path) {
    const ext = extOf(path);
    const kind = kindOf(pathBase(path), false);
    if (['image'].includes(kind)) return this.open('imageviewer', { path });
    if (['audio','video'].includes(kind)) return this.open('mediaplayer', { path });
    if (kind === 'pdf') return this.open('pdfviewer', { path });
    if (ext === 'html' || ext === 'htm') return this.open('html', { path });
    if (ext === 'csv' || ext === 'tsv') return this.open('spreadsheet', { path });
    if (['zip','gz','tar','tgz'].includes(ext)) return this.open('archive', { path });
    if (['text','code'].includes(kind) || ['txt','md','log','yaml','yml','json','xml','css','js','mjs'].includes(ext)) return this.open('notepad', { path });
    // Fallback: open as text
    this.open('notepad', { path });
  },

  registry: {}
};

/* ── File Explorer ── */
Apps.registry.explorer = {
  title: 'File Explorer',
  icon: I.explorer,
  width: 860, height: 560,
  init(api, opts) {
    const state = {
      path: opts.path || '/',
      history: [opts.path || '/'],
      historyIdx: 0,
      sort: { by: 'name', dir: 1 },
      selected: new Set(),
      clipboard: null, // { paths, op:'copy'|'cut' }
      search: ''
    };
    api.body.innerHTML = `
      <div class="app-toolbar">
        <button class="tb-btn" data-act="back">${I.back}</button>
        <button class="tb-btn" data-act="fwd">${I.fwd}</button>
        <button class="tb-btn" data-act="up">${I.up}</button>
        <button class="tb-btn" data-act="home">${I.home}</button>
        <button class="tb-btn" data-act="refresh">${I.refresh}</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" data-act="newfolder">${I.newFolder}<span>New Folder</span></button>
        <button class="tb-btn" data-act="newfile">${I.newFile}<span>New File</span></button>
        <button class="tb-btn" data-act="upload">${I.upload}<span>Upload</span></button>
        <div class="tb-sep"></div>
        <button class="tb-btn" data-act="paste" style="opacity:.5">${I.paste}</button>
        <div style="flex:1"></div>
        <input class="tb-input" placeholder="Search..." data-act="search" style="width:180px"/>
      </div>
      <div class="fe-root">
        <div class="fe-sidebar" id="fe-side"></div>
        <div class="fe-main">
          <div class="fe-breadcrumb" id="fe-bc"></div>
          <div class="fe-list-wrap" id="fe-wrap">
            <table class="fe-list" id="fe-list">
              <thead><tr>
                <th data-sort="name" style="width:55%">Name</th>
                <th data-sort="mtime" style="width:20%">Modified</th>
                <th data-sort="type" style="width:15%">Type</th>
                <th data-sort="size" style="width:10%">Size</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="fe-status"><span id="fe-status-l">—</span><span id="fe-status-r">—</span></div>
        </div>
      </div>`;
    const render = async () => {
      renderSidebar();
      renderBreadcrumb();
      await renderList();
    };
    const renderSidebar = () => {
      const side = api.body.querySelector('#fe-side');
      side.innerHTML = '';
      const groups = [
        { title: 'Quick', items: [
          { label: 'Root', path: '/', icon: I.disk },
          { label: 'Desktop', path: '/Desktop', icon: I.home },
          { label: 'Documents', path: '/Documents', icon: I.folder },
          { label: 'Pictures', path: '/Pictures', icon: I.image },
          { label: 'Music', path: '/Music', icon: I.audio },
          { label: 'Downloads', path: '/Downloads', icon: I.download },
        ]},
        { title: 'Mounts', items: fs.mountRecords.map(m => ({ label: m.name, path: m.path, icon: I.mount })) },
      ];
      for (const g of groups) {
        side.appendChild(el('div', { class: 'fe-sb-group-title' }, g.title));
        for (const it of g.items) {
          const e = el('div', { class: 'fe-sb-item' + (state.path === it.path ? ' active' : '') });
          e.innerHTML = it.icon + '<span>' + escapeHtml(it.label) + '</span>';
          e.addEventListener('click', async () => {
            // If it's a mount and handle is missing, re-prompt
            if (it.path.startsWith('/mnt/local/') && !fs.mounts.has(it.path)) {
              try {
                const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                fs.mounts.set(it.path, handle);
                toast('Re-authorized: ' + it.label, 'ok');
              } catch(err) { if (err.name !== 'AbortError') toast('Authorization failed', 'err'); return; }
            }
            navTo(it.path);
          });
          side.appendChild(e);
        }
      }
      if (fs.mountRecords.length === 0) {
        const p = el('div', { style: { padding: '8px 12px', fontSize: '10px', opacity: '.6', fontFamily: 'var(--font-mono)' } }, 'No mounts. Use Settings → Storage to mount local folders.');
        side.appendChild(p);
      }
    };
    const renderBreadcrumb = () => {
      const bc = api.body.querySelector('#fe-bc');
      bc.innerHTML = '';
      const segs = state.path.split('/').filter(Boolean);
      const home = el('span', { class: 'bc-seg' }, '/');
      home.addEventListener('click', () => navTo('/'));
      bc.appendChild(home);
      let acc = '';
      for (const s of segs) {
        acc += '/' + s;
        bc.appendChild(el('span', { class: 'bc-sep' }, ' / '));
        const seg = el('span', { class: 'bc-seg' }, s);
        const p = acc;
        seg.addEventListener('click', () => navTo(p));
        bc.appendChild(seg);
      }
    };
    const renderList = async () => {
      const tbody = api.body.querySelector('#fe-list tbody');
      tbody.innerHTML = '';
      let entries;
      try { entries = await fs.readdir(state.path); }
      catch(e) {
        tbody.innerHTML = `<tr><td colspan="4" style="padding:20px;color:var(--red)">Error: ${escapeHtml(e.message)}</td></tr>`;
        return;
      }
      // Filter
      if (state.search) {
        const q = state.search.toLowerCase();
        entries = entries.filter(e => e.name.toLowerCase().includes(q));
      }
      // Sort
      const { by, dir } = state.sort;
      entries.sort((a, b) => {
        // folders first
        if (a.isDirectory !== b.isDirectory) return a.isDirectory ? -1 : 1;
        let va = a[by], vb = b[by];
        if (by === 'type') { va = extOf(a.name); vb = extOf(b.name); }
        if (by === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
        if (va < vb) return -dir; if (va > vb) return dir; return 0;
      });
      for (const e of entries) {
        const tr = el('tr');
        const p = pathJoin(state.path, e.name);
        if (state.selected.has(p)) tr.classList.add('selected');
        const nameCell = el('td');
        const row = el('div', { class: 'fe-row' });
        row.innerHTML = iconForEntry(e) + '<span>' + escapeHtml(e.name) + '</span>';
        nameCell.appendChild(row);
        tr.appendChild(nameCell);
        tr.appendChild(el('td', {}, fmtDate(e.mtime)));
        tr.appendChild(el('td', {}, e.isDirectory ? 'Folder' : (extOf(e.name).toUpperCase() || 'File')));
        tr.appendChild(el('td', {}, e.isDirectory ? '—' : fmtSize(e.size)));
        tr.addEventListener('click', (ev) => {
          if (ev.ctrlKey || ev.metaKey) {
            if (state.selected.has(p)) { state.selected.delete(p); tr.classList.remove('selected'); }
            else { state.selected.add(p); tr.classList.add('selected'); }
          } else {
            state.selected.clear();
            api.body.querySelectorAll('.fe-list tbody tr.selected').forEach(n => n.classList.remove('selected'));
            state.selected.add(p);
            tr.classList.add('selected');
          }
          updateStatus();
        });
        tr.addEventListener('dblclick', () => openEntry(e));
        tr.addEventListener('contextmenu', (ev) => {
          ev.preventDefault();
          if (!state.selected.has(p)) { state.selected.clear(); state.selected.add(p); api.body.querySelectorAll('.fe-list tbody tr.selected').forEach(n => n.classList.remove('selected')); tr.classList.add('selected'); }
          openContextMenu(ev.clientX, ev.clientY, feMenuItems(p, e));
        });
        tr.draggable = true;
        tr.addEventListener('dragstart', (ev) => {
          ev.dataTransfer.effectAllowed = 'copyMove';
          const paths = Array.from(state.selected);
          ev.dataTransfer.setData('application/x-bauhaus-icon', JSON.stringify({ paths, startX: ev.clientX, startY: ev.clientY, source: 'fe' }));
          // File drag-out for single file
          if (!e.isDirectory && paths.length === 1) {
            // preload async but drag-out may fail — best-effort via DownloadURL
            fs.readFile(p).then(buf => {
              const file = new File([buf], e.name, { type: mimeOf(e.name) });
              const url = URL.createObjectURL(file);
              try { ev.dataTransfer.setData('DownloadURL', `${file.type}:${file.name}:${url}`); } catch(err){}
              setTimeout(() => URL.revokeObjectURL(url), 8000);
            }).catch(()=>{});
          }
        });
        // Drop target (move into folder)
        if (e.isDirectory) {
          tr.addEventListener('dragover', (ev) => { ev.preventDefault(); tr.style.background = 'var(--blue)'; tr.style.color = 'var(--paper)'; });
          tr.addEventListener('dragleave', () => { tr.style.background = ''; tr.style.color = ''; });
          tr.addEventListener('drop', async (ev) => {
            ev.preventDefault(); tr.style.background = ''; tr.style.color = '';
            const data = ev.dataTransfer.getData('application/x-bauhaus-icon');
            if (data) {
              try {
                const d = JSON.parse(data);
                for (const sp of d.paths) {
                  if (sp === p || p.startsWith(sp + '/')) continue;
                  await fs.rename(sp, pathJoin(p, pathBase(sp)));
                }
                toast('Moved', 'ok'); render(); Desktop.loadIcons().then(() => Desktop.renderAll());
              } catch(err) { toast(err.message, 'err'); }
            }
          });
        }
        tbody.appendChild(tr);
      }
      updateStatus();
    };
    const updateStatus = () => {
      const n = api.body.querySelectorAll('.fe-list tbody tr').length;
      const s = state.selected.size;
      api.body.querySelector('#fe-status-l').textContent = `${n} items · ${s} selected`;
      api.body.querySelector('#fe-status-r').textContent = state.path;
    };
    const iconForEntry = (e) => {
      if (e.isDirectory) return I.folder;
      return iconForFile(e.name);
    };
    const iconForFile = (name) => {
      const k = kindOf(name, false);
      if (k === 'image') return I.image;
      if (k === 'audio') return I.audio;
      if (k === 'video') return I.video;
      if (k === 'pdf') return I.pdf;
      if (k === 'archive') return I.zip;
      if (k === 'code' || extOf(name) === 'html' || extOf(name) === 'htm') return I.code;
      if (k === 'text') return I.fileText;
      return I.file;
    };
    const openEntry = (e) => {
      const p = pathJoin(state.path, e.name);
      if (e.isDirectory) navTo(p);
      else Apps.openForFile(p);
    };
    const navTo = (p) => {
      p = pathNorm(p);
      if (state.history[state.historyIdx] !== p) {
        state.history = state.history.slice(0, state.historyIdx + 1);
        state.history.push(p);
        state.historyIdx = state.history.length - 1;
      }
      state.path = p;
      state.selected.clear();
      api.setTitle('Explorer — ' + p);
      render();
    };

    // Toolbar actions
    api.body.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'back' && state.historyIdx > 0) { state.historyIdx--; state.path = state.history[state.historyIdx]; state.selected.clear(); render(); }
      else if (act === 'fwd' && state.historyIdx < state.history.length - 1) { state.historyIdx++; state.path = state.history[state.historyIdx]; state.selected.clear(); render(); }
      else if (act === 'up') navTo(pathDir(state.path));
      else if (act === 'home') navTo('/');
      else if (act === 'refresh') render();
      else if (act === 'newfolder') (async () => {
        const n = await promptText('New folder', 'New Folder'); if (!n) return;
        await fs.mkdir(pathJoin(state.path, n)); render();
      })();
      else if (act === 'newfile') (async () => {
        const n = await promptText('New file', 'Untitled.txt'); if (!n) return;
        await fs.writeFile(pathJoin(state.path, n), ''); render();
      })();
      else if (act === 'upload') importFiles(state.path).then(() => render());
      else if (act === 'paste') doPaste();
    });
    const searchInp = api.body.querySelector('[data-act="search"]');
    searchInp.addEventListener('input', () => { state.search = searchInp.value; renderList(); });
    // Sort headers
    api.body.querySelectorAll('.fe-list thead th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const by = th.dataset.sort;
        if (state.sort.by === by) state.sort.dir = -state.sort.dir;
        else { state.sort.by = by; state.sort.dir = 1; }
        renderList();
      });
    });
    // Drop on list-wrap (import files into current dir)
    const wrap = api.body.querySelector('#fe-wrap');
    wrap.addEventListener('dragover', (e) => {
      if (e.target.closest('tr[data-dir]')) return;
      e.preventDefault();
    });
    wrap.addEventListener('drop', async (e) => {
      if (e.target.closest('tr')) return;
      e.preventDefault();
      if (e.dataTransfer.items && e.dataTransfer.items.length) {
        await Desktop._importDrop(e.dataTransfer, e.clientX, e.clientY, state.path);
        render();
      }
    });

    const doPaste = async () => {
      if (!state.clipboard) return;
      for (const p of state.clipboard.paths) {
        const target = pathJoin(state.path, pathBase(p));
        try {
          if (state.clipboard.op === 'cut') await fs.rename(p, target);
          else await fs.copy(p, target);
        } catch(e) { toast('Paste failed: ' + e.message, 'err'); }
      }
      if (state.clipboard.op === 'cut') state.clipboard = null;
      updatePasteBtn();
      render();
      Desktop.loadIcons().then(() => Desktop.renderAll());
    };
    const updatePasteBtn = () => {
      const btn = api.body.querySelector('[data-act="paste"]');
      btn.style.opacity = state.clipboard ? '1' : '.5';
    };
    // Expose clipboard setter via window for cross-window
    window._feSetClipboard = (c) => { state.clipboard = c; updatePasteBtn(); };

    function feMenuItems(p, e) {
      const items = [
        { label: 'Open', icon: I.play, action: () => openEntry(e) },
      ];
      if (!e.isDirectory) {
        items.push({ label: 'Open with Notepad', icon: I.notepad, action: () => Apps.open('notepad', { path: p }) });
        items.push({ label: 'Download', icon: I.download, action: () => downloadFile(p) });
      }
      items.push('-');
      items.push({ label: 'Copy', icon: I.copy, action: () => { window._feSetClipboard({ paths: Array.from(state.selected), op: 'copy' }); toast('Copied'); }});
      items.push({ label: 'Cut', icon: I.cut, action: () => { window._feSetClipboard({ paths: Array.from(state.selected), op: 'cut' }); toast('Cut'); }});
      if (e.isDirectory) items.push({ label: 'Paste Into', icon: I.paste, action: () => { state.path = p; doPaste(); } });
      items.push('-');
      items.push({ label: 'Rename', icon: I.rename, action: async () => {
        const n = await promptText('Rename', e.name); if (!n) return;
        await fs.rename(p, pathJoin(state.path, n)); render();
        Desktop.loadIcons().then(() => Desktop.renderAll());
      }});
      items.push({ label: 'Delete', icon: I.trash, danger: true, action: async () => {
        if (!(await confirmDlg('Delete', 'Delete "' + e.name + '"?'))) return;
        await fs.unlink(p); render();
        Desktop.loadIcons().then(() => Desktop.renderAll());
      }});
      items.push('-');
      items.push({ label: 'Info', icon: I.info, action: () => showInfo(p, e) });
      return items;
    }
    async function showInfo(p, e) {
      let sizeStr = e.isDirectory ? 'Folder' : fmtSize(e.size);
      if (e.isDirectory) {
        let count = 0, total = 0;
        const walk = async (d) => {
          const es = await fs.readdir(d);
          for (const c of es) {
            count++;
            if (c.isDirectory) await walk(pathJoin(d, c.name));
            else total += c.size || 0;
          }
        };
        try { await walk(p); sizeStr = `Folder · ${count} items · ${fmtSize(total)}`; } catch {}
      }
      modal({ title: 'Info', body: `<p><b>${escapeHtml(e.name)}</b></p><p>Path: <code>${escapeHtml(p)}</code></p><p>${sizeStr}</p><p>Modified: ${fmtDate(e.mtime)}</p>`, cancel: '' });
    }

    render();
  }
};

async function openFilePicker(cb) {
  const entries = await fs.readdir('/');
  const body = el('div');
  const browse = el('div', { style: { maxHeight: '300px', overflow: 'auto', border: '2px solid var(--ink)', padding: '4px' } });
  let selectedPath = null;
  const render = async (dir) => {
    browse.innerHTML = '';
    const list = await fs.readdir(dir);
    if (dir !== '/') {
      const up = el('div', { style: { padding: '4px 8px', cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '11px' } }, '../ (up)');
      up.addEventListener('click', () => render(pathDir(dir)));
      browse.appendChild(up);
    }
    for (const e of list) {
      const row = el('div', { style: { padding: '4px 8px', cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '11px', display: 'flex', gap: '6px', alignItems: 'center' } });
      row.innerHTML = (e.isDirectory ? I.folder : I.file) + ' ' + escapeHtml(e.name);
      row.addEventListener('click', () => {
        if (e.isDirectory) render(pathJoin(dir, e.name));
        else { selectedPath = pathJoin(dir, e.name); browse.querySelectorAll('div').forEach(n => n.style.background = ''); row.style.background = 'var(--yellow)'; }
      });
      row.addEventListener('dblclick', () => {
        if (!e.isDirectory) { selectedPath = pathJoin(dir, e.name); cb(selectedPath); bg.remove(); }
      });
      browse.appendChild(row);
    }
    pathLabel.textContent = dir;
  };
  const pathLabel = el('div', { style: { fontFamily: 'var(--font-mono)', fontSize: '10px', marginBottom: '6px', opacity: '.7' } });
  body.appendChild(pathLabel);
  body.appendChild(browse);
  render('/');
  const bg = await modal({ title: 'Open File', body, onOk: () => { if (selectedPath) { cb(selectedPath); return true; } toast('Select a file', 'err'); return false; } });
}

    const pathEl = api.body.querySelector('#ss-path');
    let currentPath = opts.path || null;
    let delim = ',';
    let mode = 'table';

    const parse = (txt, d) => {
      const rows = [];
      const lines = txt.split(/\r?\n/);
      for (const line of lines) {
        if (!line && lines.indexOf(line) === lines.length - 1) continue;
        const row = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];

            else if (c === '"') inQ = false;
            else cur += c;
          } else {
            if (c === '"') inQ = true;
            else if (c === d) { row.push(cur); cur = ''; }
            else cur += c;
          }
        }
        row.push(cur);
        rows.push(row);
      }
      return rows;
    };
    const render = () => {
      if (mode === 'text') { tableWrap.style.display = 'none'; textArea.style.display = 'block'; return; }
      tableWrap.style.display = 'block'; textArea.style.display = 'none';
      const rows = parse(textArea.value, delim);

      table.appendChild(tbody);
      tableWrap.innerHTML = '';
      tableWrap.appendChild(table);

      api.setTitle('Table — ' + pathBase(p));
      render();

      const a = e.target.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act;

    let expr = '', val = '0', lastOp = false;
    const update = () => { valEl.textContent = val; exprEl.textContent = expr; };
    const calc = () => {
      try {
        // Safe eval: only digits, operators, parens, dot
        const safe = expr.replace(/[^0-9+\-*/().]/g, '');
        if (!safe) return '0';
        const r = Function('"use strict";return (' + safe + ')')();
        if (!isFinite(r)) return 'Err';
        return String(+r.toFixed(10));
      } catch { return 'Err'; }
    };
    api.body.querySelectorAll('.calc-btn').forEach(b => {
      b.addEventListener('click', () => {
        const k = b.dataset.k;

        else if (k === '±') { val = val.startsWith('-') ? val.slice(1) : '-' + val; }
        else if (k === '%') { val = String(parseFloat(val) / 100); }
        else if (k === '=') {
          const full = expr + val;
          val = calc();
          expr = '';
          lastOp = true;
        }
        else if (['+','-','*','/'].includes(k)) {
          expr += val + k;
          val = '0';
          lastOp = false;
        }
        else {
          if (lastOp) { val = '0'; lastOp = false; }
          if (k === '.' && val.includes('.')) { update(); return; }
          val = (val === '0' && k !== '.') ? k : val + k;
        }
        update();
      });
    });
    update();
  }

      </div>`;
    const canvas = api.body.querySelector('.pt-canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let drawing = false, last = null, color = '#0E0E0C', size = 4, tool = 'pen';
    const colorInp = api.body.querySelector('#pt-color');
    const sizeInp = api.body.querySelector('#pt-size');

    sizeInp.addEventListener('input', () => { size = +sizeInp.value; sizeV.textContent = size; });

    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / r.width, sy = canvas.height / r.height;
      const cx = (e.touches ? e.touches[0].clientX : e.clientX);
      const cy = (e.touches ? e.touches[0].clientY : e.clientY);
      return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
    };
    const start = (e) => { e.preventDefault(); drawing = true; last = pos(e); };
    const move = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.strokeStyle = tool === 'erase' ? 'white' : color;
      ctx.lineWidth = tool === 'erase' ? size * 3 : size;
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    };
    const end = () => { drawing = false; };
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    api.body.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]'); if (!a) return;

Apps.registry.archive = {
  title: 'Archive',
  icon: I.zip,
  width: 600, height: 460,
  async init(api, opts) {
    api.body.innerHTML = `
      <div class="app-toolbar">
        <button class="tb-btn primary" data-act="extract">${I.download}<span>Extract Here</span></button>
        <div style="flex:1"></div>
        <span class="tb-input" id="ar-path" style="background:var(--paper-2)">—</span>
      </div>
      <div style="flex:1;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:12px" id="ar-out"></div>`;
    const out = api.body.querySelector('#ar-out');
    const pathEl = api.body.querySelector('#ar-path');
    const p = opts.path;
    pathEl.textContent = p;
    api.setTitle('Archive — ' + pathBase(p));
    const ext = extOf(p);
    if (ext === 'zip') {
      try {
        // Try DecompressionStream (won't handle full zip natively, so we do basic zip parsing)
        // Fallback: prompt user that native zip decompression needs library, use simpler approach
        out.innerHTML = `<p style="padding:10px;background:var(--yellow);border:2px solid var(--ink)"><b>ZIP archives</b> require a decompression library.<br><br>Native browsers do not include a full ZIP parser without dependencies. Please extract externally and re-import, or use the file as-is.<br><br><code>.gz</code> and <code>.tar</code> are supported natively via DecompressionStream.</p>`;
      } catch(e) { out.textContent = 'Error: ' + e.message; }
    } else if (ext === 'gz' || ext === 'tar' || ext === 'tgz') {
      try {
        const buf = await fs.readFile(p);
        let stream = new Response(new Blob([buf])).body;
        if (ext === 'gz' || ext === 'tgz') stream = stream.pipeThrough(new DecompressionStream('gzip'));
        const arr = new Uint8Array(await new Response(stream).arrayBuffer());
        // If tar, parse
        if (ext === 'tar' || ext === 'tgz') {
          const files = parseTar(arr);
          const targetDir = pathDir(p);
          let log = '';
          for (const f of files) {
            if (f.name.endsWith('/')) { await fs.mkdir(pathJoin(targetDir, f.name)); log += '[DIR] ' + f.name + '\n'; }
            else { await fs.writeFile(pathJoin(targetDir, f.name), f.data); log += '[FILE] ' + f.name + ' (' + f.data.byteLength + ' B)\n'; }
          }
          out.innerHTML = '<pre style="white-space:pre-wrap">' + escapeHtml(log) + '</pre><p style="margin-top:10px;color:var(--green)"><b>Extracted to ' + escapeHtml(targetDir) + '</b></p>';
          Desktop.loadIcons().then(() => Desktop.renderAll());
        } else {
          // .gz only (single file)
          const newName = pathBase(p).replace(/\.gz$/, '');
          await fs.writeFile(pathJoin(pathDir(p), newName), arr);
          out.textContent = 'Extracted: ' + newName + ' (' + arr.byteLength + ' bytes)';
        }
      } catch(e) { out.textContent = 'Error: ' + e.message; }
    } else {
      out.textContent = 'Unsupported archive format.';
    }
  }
};

function parseTar(arr) {
  const files = [];
  let offset = 0;
  const decoder = new TextDecoder('utf-8');
  while (offset < arr.length) {
    const header = arr.subarray(offset, offset + 512);
    if (header.every(b => b === 0)) break;
    let name = decoder.decode(header.subarray(0, 100)).replace(/\0+$/, '');
    const sizeStr = decoder.decode(header.subarray(124, 136)).replace(/\0+$/, '').trim();
    const size = parseInt(sizeStr, 8) || 0;
    const typeflag = String.fromCharCode(header[156]);
    const prefix = decoder.decode(header.subarray(345, 500)).replace(/\0+$/, '');
    if (prefix) name = prefix + '/' + name;
    offset += 512;
    const data = arr.subarray(offset, offset + size);
    offset += Math.ceil(size / 512) * 512;
    if (typeflag === '0' || typeflag === '\0' || typeflag === '5') {
      files.push({ name, data: data.slice(0), type: typeflag });
    }
  }
  return files;
}

  { id: 'swiss', css: 'linear-gradient(90deg, #0E0E0C 0%, #0E0E0C 20%, #EFEAE0 20%, #EFEAE0 100%)' },
  { id: 'construct', css: 'conic-gradient(from 45deg at 50% 50%, #E63946, #F4C430, #1D4ED8, #E63946)' },
  { id: 'paper', css: 'repeating-linear-gradient(0deg, #EFEAE0 0, #EFEAE0 20px, #E6E0D2 20px, #E6E0D2 21px), repeating-linear-gradient(90deg, transparent 0, transparent 20px, rgba(14,14,12,0.1) 20px, rgba(14,14,12,0.1) 21px)' },
  { id: 'mono', css: 'linear-gradient(135deg, #0E0E0C 0%, #2A2A28 100%)' },
];
async function applyWallpaper() {
  const layer = $('#wallpaper-layer');
  const desk = $('#desktop');
  const id = fs.meta.wallpaper;
  if (!id) {
    desk.classList.remove('wallpaper-active');
    layer.style.display = 'none';
    return;
  }
  if (id === 'grid') {
    desk.classList.remove('wallpaper-active');
    layer.style.display = 'none';
    return;
  }
  if (id.startsWith('custom:')) {
    try {
      const ext = id.slice(7);
      const p = '/Pictures/__wallpaper.' + ext;
      const buf = await fs.readFile(p);
      const blob = new Blob([buf], { type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext) });
      const url = URL.createObjectURL(blob);
      layer.style.backgroundImage = 'url(' + url + ')';
      desk.classList.add('wallpaper-active');
    } catch {
      desk.classList.remove('wallpaper-active');
    }
    return;
  }
  const wp = WALLPAPERS.find(w => w.id === id);
  if (wp) {
    layer.style.backgroundImage = 'none';
    layer.style.background = wp.css;
    desk.classList.add('wallpaper-active');
  }
}

async function boot() {
  const statusEl = $('#boot-status');
  const steps = [
    ['INITIALIZING OPFS...', async () => await fs.init()],
    ['LOADING WALLPAPER...', async () => await applyWallpaper()],
    ['BUILDING DESKTOP...', async () => { await Desktop.init(); }],
    ['MOUNTING LOCAL FOLDERS...', async () => {
      // Re-verify mounts — ask user via prompt on first run
      if (fs.mountRecords.length) {
        for (const m of fs.mountRecords) {
          try {
            // We cannot auto-restore without user gesture; just record.
            // We'll prompt via toast.
          } catch {}
        }
      }
    }],
    ['READY', async () => {
      $('#boot').style.transition = 'opacity .35s';
      $('#boot').style.opacity = '0';
      setTimeout(() => $('#boot').remove(), 400);
    }],
  ];
  for (const [txt, fn] of steps) {
    statusEl.textContent = txt;
    try { await fn(); } catch (e) { console.warn(e); statusEl.textContent = txt + ' [FAIL]'; }
    await new Promise(r => setTimeout(r, 180));
  }
  // Remind about mounts
  if (fs.mountRecords.length) {
    setTimeout(() => {
      toast('Click a mount in Explorer to re-authorize local folders.', '');
    }, 800);
  }
  // Clock
  const updateClock = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    $('#clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
  };
  updateClock(); setInterval(updateClock, 10000);
  // OPFS indicator
  $('#opfs-indicator').style.color = fs.opfsOk ? '#90EE90' : 'var(--yellow)';
  $('#opfs-indicator').title = fs.opfsOk ? 'OPFS: Active' : 'OPFS: Fallback (in-memory)';
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeContextMenu(); $('#start-menu').classList.remove('open'); }
});

window.addEventListener('load', boot);
window.addEventListener('resize', () => {
  // Keep windows on-screen
  WM.windows.forEach(w => {
    if (w.maximized) {
      w.el.style.width = window.innerWidth + 'px';
      w.el.style.height = (window.innerHeight - 52) + 'px';
    }
  });
});
</script>
