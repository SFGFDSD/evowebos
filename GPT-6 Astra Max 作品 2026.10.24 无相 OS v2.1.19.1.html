      }else if(section==='system'){content.innerHTML=`<h2>行止有度。</h2><p class="intro">细微之处，也应合乎你的习惯。</p><div class="setting-group"><h3>时间与输入</h3>${switchControl('clock12','十二时辰 · 12 小时制','关闭后使用 24 小时制；日历可从任务栏时钟打开')}${switchControl('autoSave','文卷自动保存','墨笺、天工阁与经纬册在停止输入后保存；关闭窗口前也会尝试保存')}<div class="setting-row"><div class="label">代码字号<small>应用于新打开的天工阁窗口</small></div><select data-editor-font>${[11,12,13,14,15,16,18,20].map(n=>`<option value="${n}" ${prefs.editorFont===n?'selected':''}>${n} px</option>`).join('')}</select></div><div class="setting-row"><div class="label">默认图片入口<small>同目录自然排序，阅读到点击的那一页</small></div><select data-image-mode><option value="manga" ${prefs.imageMode!=='image'?'selected':''}>漫画连续阅读</option><option value="image" ${prefs.imageMode==='image'?'selected':''}>图片查看器</option></select></div>${switchControl('snap','窗口靠边吸附','拖至左、右边缘分屏，拖至顶部最大化')}</div><div class="setting-group"><h3>环境信息</h3><div class="setting-row"><div class="label">浏览器<small>${esc(browserName())}</small></div><span class="mono muted">${window.isSecureContext?'安全上下文':'非安全上下文'}</span></div><div class="setting-row"><div class="label">文件接口<small>OPFS：${fs.mounts.has('/opfs')?'可用':'不可用'} · IndexedDB：${DB.ready?'可用':'不可用'}<br>本地挂载：${window.showDirectoryPicker?'浏览器支持':'浏览器未提供'} · 全屏：${document.documentElement.requestFullscreen?'支持':'使用应用内沉浸模式'}</small></div></div></div><div class="setting-group"><h3>内功自检</h3><p class="about-text">实际创建并移除独立测试文件，验证二进制读写、回调兼容、复制移动、日期与目录大小。不会触碰你的文卷。</p>${tool('运行文件系统自检','shield','test','outline')}<pre class="diagnostic-log" hidden aria-live="polite"></pre></div>`;$('[data-editor-font]',content).onchange=e=>{prefs.editorFont=+e.target.value;savePrefs();};$('[data-image-mode]',content).onchange=e=>{prefs.imageMode=e.target.value;savePrefs();};onAction(content,{test:async(e,b)=>{b.disabled=true;const log=$('.diagnostic-log',content);log.hidden=false;log.textContent='正在实际执行自检…\n';try{await runDiagnostics(message=>{log.textContent+=message+'\n';log.scrollTop=log.scrollHeight;});}finally{b.disabled=false;}}});
      }else{content.innerHTML=`<div class="about-mark"><h1>无相</h1><span>WUXIANG OS / 1.0</span></div><h2 style="text-align:center;font-size:20px">不拘于形，自成天地。</h2><p class="about-text" style="text-align:center;margin:18px auto 30px;max-width:360px">没有服务器，没有远方的账户。<br>只有一方屏幕，和一方属于你的江湖。<br>以墨为境，以纸为心，以朱砂为一念。</p><div class="setting-group"><h3>几式心法</h3><p class="about-text">单击打开 · Ctrl / Command + 单击多选<br>空白处拖动框选 · 手机可开启「多选」模式<br>Ctrl + S 保存 · Ctrl + K 全局搜索<br>Alt + D 显示桌面 · 拖动窗口至边缘吸附<br>按住文件拖入目录 · 拖至浏览器外导出（浏览器支持时）<br>任务栏最右侧细线：悬停窥见，点击回到桌面</p></div><div class="setting-group"><h3>真实的能力，清晰的边界</h3><p class="about-text">文件基于 OPFS 或 IndexedDB 持久化。localStorage 与 Cookie 只记住界面偏好。浏览器清理站点数据会清除私有文件，重要内容请常备份。</p><p class="about-text">拖出下载依赖 Chromium 的 DownloadURL 扩展，并非所有浏览器和桌面环境都支持。手机和不支持的浏览器，请使用「导出 / 下载」。拖出大文件夹前需要完成 ZIP 预载。</p><p class="about-text">第三方组件按首次使用加载：CodeMirror 5.65.16、JSZip 3.10.1、7z-wasm 1.2.0、v86 0.5.319。网络失败时，代码编辑器回退到原生文本模式；压缩和虚拟机提供明确错误，不模拟成功。</p><p class="about-text">原生音视频、PDF、AVIF 等格式的可用性取决于当前浏览器解码器。网站可能拒绝 iframe 嵌入。真实本地文件夹的目录修改日期不由浏览器公开，无法读取时显示「未提供」，不编造时间。</p></div><div class="setting-group"><h3>一纸山河</h3><p class="about-text">山水与应用图标为内嵌 SVG。界面字体使用思源宋体、思源黑体及 IBM Plex Mono；离线时回退到设备上的宋体与中文字体。文件不会上传，外部 CDN 仅用于字体和按需组件。</p></div>`;}

    async function renderStorage(token){try{const estimate=await navigator.storage?.estimate?.()||{},volumes=[];for(const path of ['/opfs','/idb'])if(fs.mounts.has(path))volumes.push({path,label:fs.mounts.get(path).label,size:await fs.size(path)});const bytes=volumes.reduce((n,v)=>n+v.size,0),usage=estimate.usage??bytes,quota=estimate.quota,percent=quota?Math.min(100,usage/quota*100):0,categories={文卷:0,画卷:0,影音:0,封包:0,其他:0};for(const volume of volumes)await fs.walk(volume.path,async entry=>{if(entry.kind!=='file')return;const s=await fs.stat(entry.path),x=ext(entry.name),category=imageExt.has(x)?'画卷':audioExt.has(x)||videoExt.has(x)?'影音':archiveExt.has(x)?'封包':textExt.has(x)?'文卷':'其他';categories[category]+=s.size;});categories['其他']+=Math.max(0,bytes-Object.values(categories).reduce((a,b)=>a+b,0));if(token!==generation||win.closed)return;const container=$('.storage-details',content);if(!container)return;container.innerHTML=`<div class="storage-summary"><div class="storage-ring" style="background:conic-gradient(var(--accent) ${Math.max(.5,percent*3.6)}deg,var(--panel-3) 0)"><div><strong>${percent<.1&&usage>0?'0.1':percent.toFixed(1)}%</strong><small>${quota?'浏览器配额':'配额未公开'}</small></div></div><div class="storage-numbers"><h3>${fmtSize(usage)} <span style="font-size:11px;color:var(--faint)">/ ${quota?fmtSize(quota):'未知配额'}</span></h3><p>${quota?'可用约 '+fmtSize(Math.max(0,quota-usage)):'浏览器未公开可用容量'}<br>文卷实际大小 ${fmtSize(bytes)}，其余为元数据与站点缓存。</p></div></div>${volumes.map(v=>`<div class="mount-row">${icon('drive')}<span>${v.label}<small>${v.path} · ${v.path==='/opfs'?'Origin Private File System':'IndexedDB'}</small></span><span style="flex:0;white-space:nowrap;font-family:var(--mono);font-size:11px">${fmtSize(v.size)}</span><button class="tool-btn" data-open-volume="${v.path}">查看</button></div>`).join('')}<div style="margin-top:23px">${Object.entries(categories).map(([name,size],i)=>`<div class="storage-category"><span>${name}</span><div class="storage-track"><i style="width:${bytes?size/bytes*100:0}%;background:${['#b8b098','#8f9c7d','#829499','#b27c63','#6e7864'][i]}"></i></div><small>${fmtSize(size)}</small></div>`).join('')}</div><p class="about-text" style="font-size:9px">容量来自 navigator.storage.estimate()，为浏览器估值；分类统计为实际文件字节。真实本地挂载不占用这里的私有配额。</p>`;$$('[data-open-volume]',container).forEach(b=>b.onclick=()=>openExplorer(b.dataset.openVolume));}catch(e){if(token===generation){const el=$('.storage-details',content);if(el)el.innerHTML='<p class="about-text">统计未完成：'+esc(e.message)+'</p>';}}}
    win.navigate=navigate;$$('[data-section]',win.body).forEach(b=>b.onclick=safe(()=>navigate(b.dataset.section)));await navigate(current);return win;

  function browserName(){const ua=navigator.userAgent;if(/Edg\//.test(ua))return 'Microsoft Edge';if(/Firefox\//.test(ua))return 'Mozilla Firefox';if(/Chrome\//.test(ua))return 'Google Chrome / Chromium';if(/Safari\//.test(ua))return 'Apple Safari';return navigator.userAgentData?.brands?.map(x=>x.brand).join(', ')||'当前浏览器';}
  async function resetSystem(){const input=await ask({title:'散尽重来',message:'此操作永久删除 OPFS 与 IndexedDB 私有书库中的全部文件、草稿和界面设置。\n不会删除挂载的真实本地文件。\n\n输入「重置」确认。',value:'',placeholder:'重置',confirm:'永久重置'});if(input===null)return;if(input!=='重置')throw Error('确认文字不匹配，未作任何更改');for(const win of [...wm.windows.values()]){await wm.close(win.id);if(!win.closed)throw Error('有文卷尚未安全保存，已停止重置');}for(const path of ['/opfs','/idb'])if(fs.mounts.has(path))for(const child of await fs.readdir(path))await fs.remove(child.path);if(DB.ready){await DB.clear('meta');await DB.clear('config');await DB.clear('mounts');}for(const path of [...fs.mounts.keys()])if(path.startsWith('/mnt/'))fs.mounts.delete(path);prefs=JSON.parse(defaultPrefsJSON);if(!fs.mounts.has('/opfs'))prefs.primary='idb';await savePrefs();await seedFiles();await applyWallpaper();await renderDesktop();renderDock();openExplorer();toast('已归于初始，江湖可以重来');}
  async function runDiagnostics(log=console.log){let passed=0,failed=0;const run=async(name,fn)=>{try{await fn();passed++;log('通过  '+name);}catch(e){failed++;log('失败  '+name+'：'+e.message);}};const assert=(test,message)=>{if(!test)throw Error(message);};const roots=[];for(const root of ['/opfs','/idb'])if(fs.mounts.has(root)){const dir=join(root,'.系统/自检-'+uid());roots.push(dir);await fs.mkdir(dir);const stamp=new Date(2020,4,6,7,8,10,123).getTime(),bytes=new Uint8Array([0,1,127,128,254,255,65,0]);await run(root+' 二进制读写',async()=>{await fs.writeFile(join(dir,'binary.dat'),bytes,{mtime:stamp});const result=new Uint8Array(await fs.readFile(join(dir,'binary.dat'),'arraybuffer'));assert(result.length===bytes.length&&result.every((b,i)=>b===bytes[i]),'二进制内容不一致');});await run(root+' 回调与额外参数兼容',async()=>{const value=await new Promise((resolve,reject)=>fs.stat(join(dir,'binary.dat'),false,'unused',(e,s)=>e?reject(e):resolve(s)));assert(value.size===8,'stat 回调结果不正确');});await run(root+' 移动与修改时间保留',async()=>{await fs.rename(join(dir,'binary.dat'),join(dir,'moved.dat'));assert((await fs.stat(join(dir,'moved.dat'))).mtime===stamp,'mtime 被移动操作改变');assert(!await fs.exists(join(dir,'binary.dat')),'原路径未移除');});await run(root+' 递归目录与准确大小',async()=>{await fs.mkdir(join(dir,'nested/deep'));await fs.writeFile(join(dir,'nested/deep/text.txt'),'hello');assert(await fs.size(join(dir,'nested'))===5,'递归目录大小错误');});await run(root+' 复制与日期保留',async()=>{await fs.copy(join(dir,'moved.dat'),join(dir,'copied.dat'));assert((await fs.stat(join(dir,'copied.dat'))).mtime===stamp,'复制后日期不一致');});await run(root+' 路径边界保护',async()=>{let blocked=false;try{await fs.copy(join(dir,'nested'),join(dir,'nested/deep/loop'));}catch{blocked=true;}assert(blocked,'未阻止复制到自身');});}
    if(roots.length===2)await run('跨后端复制、二进制与日期',async()=>{const source=join(roots[0],'moved.dat'),target=join(roots[1],'cross.dat');await fs.copy(source,target);assert((await fs.stat(source)).mtime===(await fs.stat(target)).mtime,'跨库修改时间变化');assert((await fs.readFile(target)).size===8,'跨库字节数不一致');});await run('CSV 引号、换行与往返',async()=>{const input=[['一,二','换\n行','他说"好"'],['1','2','3']],decoded=parseDelimited(encodeDelimited(input));assert(JSON.stringify(input)===JSON.stringify(decoded),'CSV 往返不一致');});await run('自然数字排序',async()=>{assert(['10.jpg','1.jpg','2.jpg'].sort(natural.compare).join(',')==='1.jpg,2.jpg,10.jpg','顺序错误');});await run('算式优先级与错误保护',async()=>{assert(calculate('2+3*4')===14,'优先级错误');assert(calculate('(2+3)*4')===20,'括号错误');let blocked=false;try{calculate('1/0');}catch{blocked=true;}assert(blocked,'未阻止除零');});await run('ZIP DOS 时间与本地时区往返',async()=>{const stamp=new Date(2021,9,12,14,36,18).getTime();assert(fromZipDate(zipLocalDate(stamp))===stamp,'时区偏差');});await run('压缩包路径穿越保护',async()=>{let blocked=false;try{safeArchiveName('../../secret.txt');}catch{blocked=true;}assert(blocked,'未阻止路径穿越');});for(const root of roots)await run('移除独立测试目录 '+root.split('/')[1],()=>fs.remove(root));log(`\n结果：${passed} 项通过，${failed} 项失败。`);log('浏览器全屏、物理桌面拖出、真实目录权限、WASM 启动与触摸手势仍需在对应设备上验证。');return {passed,failed};}
  /* XIII. No fake boot screen: the desktop is already interactive while storage opens. */
  async function boot(){try{await initializeFS();await applyWallpaper();await renderDesktop();renderDock();await openExplorer();if(DB.ready){const drafts=join(fs.home,'.系统/草稿');if(await fs.exists(drafts)){const files=await fs.readdir(drafts);if(files.length)setTimeout(()=>toast('有 '+files.length+' 份自动保存的草稿，可在「设置 → 存储」中找回。','success',9000),2500);}}$('#storage-indicator').title='当前默认书库：'+(prefs.primary==='opfs'?'OPFS':'IndexedDB')+' · 文件只保存在本地';}catch(e){report(e);$('#storage-indicator').innerHTML='<i class="status-dot" style="background:var(--accent)"></i><span>持久化存储不可用</span>';readyResolve();}}
