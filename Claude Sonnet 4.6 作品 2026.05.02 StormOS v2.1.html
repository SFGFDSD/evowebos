<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StormOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #040d0e;
  --bg-mid: #071418;
  --bg-surface: #0d1f24;
  --bg-elevated: #122830;
  --bg-hover: #1a3540;
  --teal-dark: #0a3d4a;
  --teal-mid: #0e5c70;
  --teal-bright: #14849e;
  --teal-glow: #1ab8d8;
  --teal-accent: #2dd4f0;
  --storm-grey: #3a5a62;
  --mist: #7ab8c4;
  --foam: #b8dde6;
  --white: #e8f4f7;
  --text-dim: #4a7a86;
  --text-mid: #7ab8c4;
  --text-bright: #c8eaf0;
  --danger: #c0392b;
  --danger-glow: #e74c3c;
  --success: #1abc9c;
  --warning: #f39c12;
  --border: rgba(20, 132, 158, 0.2);
  --border-bright: rgba(45, 212, 240, 0.4);
  --glass: rgba(13, 31, 36, 0.85);
  --glass-light: rgba(18, 40, 48, 0.7);
  --shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(20,132,158,0.15);
  --shadow-glow: 0 0 30px rgba(26, 184, 216, 0.15);
  --font-ui: 'Syne', sans-serif;
  --font-mono: 'Martian Mono', monospace;
  --font-display: 'Syne', sans-serif;
  --radius: 8px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --taskbar-h: 52px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font-ui);
  background: var(--bg-deep);
  color: var(--text-bright);
  user-select: none;
  -webkit-user-select: none;
}

/* ─── DESKTOP ─── */
#desktop {
  position: fixed; inset: 0;
  overflow: hidden;
}

/* ─── NOTIFICATION BADGE ─── */
.taskbar-app-btn .badge {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal-accent);
  flex-shrink: 0;
}

/* ─── FILE EXPLORER MULTI SELECT ─── */
.fe-selection-box {
  position: absolute;
  border: 1px solid var(--teal-accent);
  background: rgba(45,212,240,0.06);
  pointer-events: none;
  z-index: 50;
  display: none;
}
.fe-content { position: relative; }

/* ─── IMAGE VIEWER ─── */
.img-viewer-wrap {
  height: 100%;
  display: flex; flex-direction: column;
  background: #000;
}
.img-viewer-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: rgba(7,20,24,0.8);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.img-viewer-info { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.img-viewer-body {
  flex: 1;
  overflow: auto;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.img-viewer-body img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  border-radius: 4px;
  transition: transform 0.2s;
}

/* ─── SMOOTH WINDOW TRANSITIONS ─── */
.window .win-body {
  transition: opacity 0.1s;
}
.window.minimized .win-body { opacity: 0; }

/* ─── TASKBAR CLOCK HOVER ─── */
#clock:hover { color: var(--text-bright); }

/* ─── SETTINGS COLOR SWATCH ─── */
.color-row { display: flex; gap: 8px; align-items: center; }
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.color-swatch:hover, .color-swatch.active { border-color: var(--teal-accent); }

/* ─── WELCOME WIDGET ─── */
#welcome-widget {
  position: absolute;
  top: 16px; right: 16px;
  padding: 16px 20px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 240px;
  z-index: 5;
  animation: fadeIn 1s ease 2s both;
  pointer-events: none;
}
#welcome-widget h4 {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--teal-accent);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
#welcome-widget p {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}

/* ─── BREADCRUMB ─── */
.breadcrumb {
  display: flex; align-items: center; gap: 4px;
  flex: 1; min-width: 0; overflow: hidden;
}
.breadcrumb-seg {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.1s;
}
.breadcrumb-seg:last-child { color: var(--teal-accent); cursor: default; }
.breadcrumb-seg:not(:last-child):hover { color: var(--text-bright); }
.breadcrumb-sep { color: var(--text-dim); font-size: 10px; flex-shrink: 0; }


#wallpaper {
  position: absolute; inset: 0;
  background: 
    radial-gradient(ellipse 80% 60% at 70% 90%, rgba(14,92,112,0.4) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 20%, rgba(4,20,25,0.9) 0%, transparent 70%),
    radial-gradient(ellipse 100% 50% at 50% 0%, rgba(7,20,24,0.95) 0%, transparent 50%),
    linear-gradient(180deg, #071418 0%, #0a2a34 35%, #0d3d4a 55%, #0a5a6a 75%, #08707f 90%, #0a8090 100%);
  transition: background 0.5s ease;
  z-index: 0;
}

#wallpaper.wp-custom {
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
}

/* Rain effect */
#rain-canvas {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.25;
}

/* Palm silhouette */
#palm-svg {
  position: absolute;
  bottom: var(--taskbar-h);
  right: 0;
  width: min(340px, 40vw);
  z-index: 2;
  opacity: 0.55;
  pointer-events: none;
}

#desktop-icons-area {
  position: absolute;
  inset: 0 0 var(--taskbar-h) 0;
  z-index: 10;
  pointer-events: none;
}
#desktop-icons-area > * { pointer-events: all; }

/* ─── DESKTOP ICONS ─── */
.desktop-icon {
  position: absolute;
  width: 80px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 4px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
  text-align: center;
}
.desktop-icon:hover { background: rgba(45,212,240,0.08); }
.desktop-icon.selected { background: rgba(45,212,240,0.15); outline: 1px solid rgba(45,212,240,0.4); }
.desktop-icon svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 8px rgba(26,184,216,0.4)); }
.desktop-icon span {
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 500;
  color: var(--white);
  text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
  line-height: 1.3;
  word-break: break-word;
  max-width: 76px;
}

/* Selection box */
#selection-box {
  position: absolute;
  border: 1px solid var(--teal-accent);
  background: rgba(45,212,240,0.08);
  pointer-events: none;
  z-index: 9;
  display: none;
}

/* ─── TASKBAR ─── */
#taskbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--taskbar-h);
  background: rgba(7, 20, 24, 0.92);
  backdrop-filter: blur(24px) saturate(180%);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px;
  gap: 8px;
  z-index: 9000;
}

#start-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: linear-gradient(135deg, var(--teal-dark), var(--teal-mid));
  border: 1px solid var(--border-bright);
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--teal-accent);
  letter-spacing: 1.5px;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
}
#start-btn:hover {
  background: linear-gradient(135deg, var(--teal-mid), var(--teal-bright));
  box-shadow: 0 0 16px rgba(45,212,240,0.3);
}
#start-btn svg { width: 18px; height: 18px; }

#taskbar-apps {
  display: flex; align-items: center; gap: 4px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
#taskbar-apps::-webkit-scrollbar { display: none; }

.taskbar-app-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-mid);
  white-space: nowrap;
  max-width: 140px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.taskbar-app-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.taskbar-app-btn:hover { background: var(--bg-hover); color: var(--text-bright); }
.taskbar-app-btn.active {
  background: var(--teal-dark);
  border-color: var(--teal-bright);
  color: var(--teal-accent);
}
.taskbar-app-btn span { overflow: hidden; text-overflow: ellipsis; }

#taskbar-tray {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
  padding-left: 8px;
  border-left: 1px solid var(--border);
}
#clock {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-mid);
  white-space: nowrap;
  cursor: default;
}

/* ─── START MENU ─── */
#start-menu {
  position: fixed;
  bottom: calc(var(--taskbar-h) + 8px);
  left: 12px;
  width: 320px;
  background: var(--glass);
  backdrop-filter: blur(32px) saturate(200%);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-xl);
  padding: 20px;
  z-index: 8900;
  display: none;
  box-shadow: var(--shadow), var(--shadow-glow);
  animation: menuSlide 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes menuSlide {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
#start-menu.open { display: block; }

#start-menu-header {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  color: var(--teal-accent);
  letter-spacing: 2px;
  margin-bottom: 16px;
  text-shadow: 0 0 20px rgba(45,212,240,0.5);
}

.start-menu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.start-app-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.start-app-item:hover {
  background: var(--bg-hover);
  border-color: var(--teal-bright);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(26,184,216,0.2);
}
.start-app-item svg { width: 28px; height: 28px; }
.start-app-item span { font-size: 10px; font-weight: 600; color: var(--text-mid); letter-spacing: 0.5px; }

/* ─── CONTEXT MENU ─── */
#context-menu {
  position: fixed;
  background: var(--glass);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-lg);
  padding: 6px;
  z-index: 9999;
  min-width: 180px;
  display: none;
  box-shadow: var(--shadow);
  animation: ctxIn 0.12s ease;
}
@keyframes ctxIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
#context-menu.open { display: block; }

.ctx-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-bright);
  transition: background 0.1s;
}
.ctx-item:hover { background: var(--bg-hover); color: var(--teal-accent); }
.ctx-item svg { width: 14px; height: 14px; color: var(--text-dim); }
.ctx-item:hover svg { color: var(--teal-bright); }
.ctx-separator { height: 1px; background: var(--border); margin: 4px 0; }
.ctx-item.danger { color: var(--danger-glow); }
.ctx-item.danger svg { color: var(--danger-glow); }
.ctx-item.danger:hover { background: rgba(231,76,60,0.1); }

/* ─── WINDOWS ─── */
.window {
  position: fixed;
  background: var(--glass);
  backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: box-shadow 0.2s;
  min-width: 300px;
  min-height: 200px;
}
.window.focused {
  border-color: rgba(45,212,240,0.3);
  box-shadow: var(--shadow), 0 0 40px rgba(26,184,216,0.1);
}
.window.minimized { display: none; }
.window.maximized {
  left: 0 !important; top: 0 !important;
  width: 100vw !important;
  height: calc(100vh - var(--taskbar-h)) !important;
  border-radius: 0;
}

.win-titlebar {
  display: flex; align-items: center;
  padding: 10px 14px;
  background: rgba(7,20,24,0.6);
  border-bottom: 1px solid var(--border);
  cursor: move;
  flex-shrink: 0;
  gap: 10px;
}
.win-title-icon { width: 16px; height: 16px; flex-shrink: 0; }
.win-title-text {
  flex: 1;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-mid);
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.win-controls { display: flex; gap: 6px; flex-shrink: 0; }
.win-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: var(--bg-elevated);
}
.win-btn svg { width: 10px; height: 10px; }
.win-btn.close { background: rgba(192,57,43,0.3); }
.win-btn.close:hover { background: var(--danger-glow); box-shadow: 0 0 8px rgba(231,76,60,0.5); }
.win-btn.minimize { background: rgba(243,156,18,0.2); }
.win-btn.minimize:hover { background: var(--warning); }
.win-btn.maximize { background: rgba(26,188,156,0.2); }
.win-btn.maximize:hover { background: var(--success); }
.win-btn svg path, .win-btn svg line, .win-btn svg rect { stroke: rgba(255,255,255,0.7); }

.win-body {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* Resize handles */
.resize-handle {
  position: absolute;
  z-index: 10;
}
.rh-n  { top: 0; left: 8px; right: 8px; height: 4px; cursor: n-resize; }
.rh-s  { bottom: 0; left: 8px; right: 8px; height: 4px; cursor: s-resize; }
.rh-w  { left: 0; top: 8px; bottom: 8px; width: 4px; cursor: w-resize; }
.rh-e  { right: 0; top: 8px; bottom: 8px; width: 4px; cursor: e-resize; }
.rh-nw { top: 0; left: 0; width: 12px; height: 12px; cursor: nw-resize; }
.rh-ne { top: 0; right: 0; width: 12px; height: 12px; cursor: ne-resize; }
.rh-sw { bottom: 0; left: 0; width: 12px; height: 12px; cursor: sw-resize; }
.rh-se { bottom: 0; right: 0; width: 12px; height: 12px; cursor: se-resize; }

/* ─── FILE EXPLORER ─── */
#app-files-content {
  display: flex; height: 100%;
  font-family: var(--font-ui);
}
.fe-sidebar {
  width: 160px;
  background: rgba(4,13,14,0.6);
  border-right: 1px solid var(--border);
  padding: 12px 8px;
  display: flex; flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  flex-shrink: 0;
}
.fe-sidebar-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-mid);
  transition: all 0.1s;
}
.fe-sidebar-item:hover { background: var(--bg-hover); color: var(--text-bright); }
.fe-sidebar-item.active { background: var(--teal-dark); color: var(--teal-accent); }
.fe-sidebar-item svg { width: 14px; height: 14px; flex-shrink: 0; }

.fe-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.fe-toolbar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,20,24,0.4);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.fe-path {
  flex: 1;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-mid);
  min-width: 0;
  cursor: default;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fe-btn {
  display: flex; align-items: center; justify-content: center;
  padding: 5px 10px; gap: 5px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-mid);
  white-space: nowrap;
  transition: all 0.1s;
}
.fe-btn svg { width: 12px; height: 12px; }
.fe-btn:hover { background: var(--bg-hover); color: var(--teal-accent); border-color: var(--teal-bright); }
.fe-btn.primary { background: var(--teal-dark); border-color: var(--teal-bright); color: var(--teal-accent); }
.fe-btn.primary:hover { background: var(--teal-mid); }

.fe-content {
  flex: 1;
  overflow: auto;
  padding: 12px;
  position: relative;
}

.fe-drop-zone {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(45,212,240,0.06);
  border: 2px dashed var(--teal-accent);
  border-radius: var(--radius);
  z-index: 100;
  display: none;
  pointer-events: none;
}
.fe-drop-zone span { font-size: 14px; font-weight: 600; color: var(--teal-accent); }
.fe-drop-zone.active { display: flex; }

.fe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 8px;
}
.fe-grid.list-mode {
  display: flex; flex-direction: column; gap: 2px;
}

.fe-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px;
  border-radius: var(--radius);
  cursor: pointer;
  text-align: center;
  border: 1px solid transparent;
  transition: all 0.12s;
  position: relative;
}
.fe-item:hover { background: rgba(45,212,240,0.07); border-color: var(--border); }
.fe-item.selected { background: rgba(45,212,240,0.12); border-color: rgba(45,212,240,0.4); }
.fe-item svg { width: 38px; height: 38px; }
.fe-item-name {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-bright);
  word-break: break-all;
  line-height: 1.3;
  max-width: 86px;
}

.fe-item.list-mode {
  flex-direction: row;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  text-align: left;
}
.fe-item.list-mode svg { width: 20px; height: 20px; flex-shrink: 0; }
.fe-item.list-mode .fe-item-name { max-width: none; flex: 1; }
.fe-item-meta { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

.fe-status {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
  background: rgba(4,13,14,0.4);
}

/* ─── TEXT EDITOR ─── */
#app-editor-content {
  display: flex; flex-direction: column; height: 100%;
}
.editor-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,20,24,0.5);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.editor-filename {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--teal-accent);
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.editor-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.editor-gutter {
  padding: 12px 8px 12px 12px;
  background: rgba(4,13,14,0.5);
  border-right: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-dim);
  text-align: right;
  min-width: 48px;
  overflow: hidden;
  user-select: none;
  flex-shrink: 0;
}
.editor-textarea {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-bright);
  resize: none;
  white-space: pre;
  overflow: auto;
  tab-size: 2;
}
.editor-statusbar {
  display: flex; align-items: center; gap: 16px;
  padding: 4px 12px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  background: rgba(4,13,14,0.5);
  flex-shrink: 0;
}

/* ─── BROWSER ─── */
#app-browser-content {
  display: flex; flex-direction: column; height: 100%;
}
.browser-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,20,24,0.5);
  flex-shrink: 0;
}
.browser-nav-btn {
  width: 28px; height: 28px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.1s;
  color: var(--text-mid);
}
.browser-nav-btn:hover { background: var(--bg-hover); color: var(--teal-accent); }
.browser-nav-btn svg { width: 12px; height: 12px; }
.browser-url {
  flex: 1;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-bright);
  outline: none;
}
.browser-url:focus { border-color: var(--teal-bright); }
.browser-iframe {
  flex: 1;
  border: none;
  background: white;
}

/* ─── MEDIA PLAYER ─── */
#app-media-content {
  display: flex; flex-direction: column; height: 100%;
  background: var(--bg-deep);
  align-items: center;
}
.media-display {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  width: 100%;
  background: #000;
  position: relative;
}
.media-display video, .media-display audio {
  max-width: 100%; max-height: 100%;
}
.media-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  color: var(--text-dim);
}
.media-placeholder svg { width: 64px; height: 64px; opacity: 0.4; }
.media-placeholder p { font-size: 13px; font-weight: 500; }
.media-controls {
  width: 100%;
  padding: 16px;
  background: rgba(7,20,24,0.9);
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 12px;
}
.media-info { font-size: 12px; font-weight: 600; color: var(--text-bright); text-align: center; }
.media-buttons { display: flex; align-items: center; justify-content: center; gap: 12px; }
.media-btn {
  width: 36px; height: 36px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.media-btn:hover { background: var(--teal-dark); border-color: var(--teal-bright); }
.media-btn svg { width: 16px; height: 16px; }
.media-btn.play-btn { width: 44px; height: 44px; background: var(--teal-dark); border-color: var(--teal-bright); }
.media-volume { display: flex; align-items: center; gap: 8px; }
.media-volume svg { width: 14px; height: 14px; color: var(--text-dim); }
.media-seek, .media-vol-slider {
  -webkit-appearance: none;
  background: var(--bg-elevated);
  border-radius: 4px;
  height: 4px;
  cursor: pointer;
  border: none;
}
.media-seek { flex: 1; }
.media-vol-slider { width: 80px; }
.media-seek::-webkit-slider-thumb, .media-vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--teal-accent);
  cursor: pointer;
}
.media-open-btn {
  margin: auto;
  padding: 8px 20px;
  background: var(--teal-dark);
  border: 1px solid var(--teal-bright);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--teal-accent);
  transition: all 0.15s;
}
.media-open-btn:hover { background: var(--teal-mid); }

/* ─── CALCULATOR ─── */
#app-calc-content {
  display: flex; flex-direction: column; height: 100%;
  padding: 20px;
  gap: 12px;
  background: linear-gradient(160deg, var(--bg-mid), var(--bg-deep));
}
.calc-display {
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  text-align: right;
  flex-shrink: 0;
}
.calc-expr {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  min-height: 16px;
  word-break: break-all;
}
.calc-result {
  font-family: var(--font-mono);
  font-size: 32px;
  font-weight: 700;
  color: var(--teal-accent);
  word-break: break-all;
  line-height: 1.2;
}
.calc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  flex: 1;
}
.calc-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-bright);
  transition: all 0.1s;
  display: flex; align-items: center; justify-content: center;
  min-height: 48px;
}
.calc-btn:hover { background: var(--bg-hover); color: var(--teal-accent); }
.calc-btn:active { transform: scale(0.94); }
.calc-btn.op { color: var(--teal-bright); border-color: rgba(20,132,158,0.3); }
.calc-btn.eq {
  background: linear-gradient(135deg, var(--teal-dark), var(--teal-mid));
  border-color: var(--teal-bright);
  color: var(--teal-accent);
  grid-row: span 2;
}
.calc-btn.eq:hover { background: linear-gradient(135deg, var(--teal-mid), var(--teal-bright)); }
.calc-btn.clear { color: var(--danger-glow); }
.calc-btn.span2 { grid-column: span 2; }

/* ─── SETTINGS ─── */
#app-settings-content {
  overflow-y: auto; height: 100%;
  padding: 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.settings-section { display: flex; flex-direction: column; gap: 12px; }
.settings-title {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.settings-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.settings-item-info { display: flex; flex-direction: column; gap: 3px; }
.settings-item-label { font-size: 13px; font-weight: 600; color: var(--text-bright); }
.settings-item-desc { font-size: 11px; color: var(--text-dim); }
.settings-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-mid);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-ui);
  white-space: nowrap;
  transition: all 0.15s;
}
.settings-btn:hover { background: var(--bg-hover); color: var(--teal-accent); border-color: var(--teal-bright); }
.settings-btn.danger { color: var(--danger-glow); border-color: rgba(231,76,60,0.3); }
.settings-btn.danger:hover { background: rgba(231,76,60,0.1); border-color: var(--danger-glow); }

.wp-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.wp-thumb {
  aspect-ratio: 16/9;
  border-radius: var(--radius);
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
  overflow: hidden;
  position: relative;
}
.wp-thumb:hover { border-color: var(--teal-bright); transform: scale(1.02); }
.wp-thumb.active { border-color: var(--teal-accent); box-shadow: 0 0 12px rgba(45,212,240,0.4); }
.wp-thumb-inner { width: 100%; height: 100%; }

/* ─── DIALOGS ─── */
.dialog-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 19000;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog {
  background: var(--bg-surface);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-xl);
  padding: 28px;
  min-width: 300px;
  max-width: 90vw;
  box-shadow: var(--shadow), var(--shadow-glow);
  animation: dialogIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes dialogIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
.dialog h3 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 12px;
}
.dialog p { font-size: 13px; color: var(--text-mid); margin-bottom: 20px; line-height: 1.6; }
.dialog-input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-bright);
  outline: none;
  margin-bottom: 16px;
}
.dialog-input:focus { border-color: var(--teal-accent); }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
.dialog-btn {
  padding: 8px 20px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-mid);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-ui);
  transition: all 0.15s;
}
.dialog-btn:hover { background: var(--bg-hover); }
.dialog-btn.primary {
  background: var(--teal-dark);
  border-color: var(--teal-bright);
  color: var(--teal-accent);
}
.dialog-btn.primary:hover { background: var(--teal-mid); }
.dialog-btn.danger {
  background: rgba(192,57,43,0.2);
  border-color: var(--danger-glow);
  color: var(--danger-glow);
}
.dialog-btn.danger:hover { background: rgba(231,76,60,0.3); }

/* ─── TOAST ─── */
#toast-container {
  position: fixed;
  top: 16px; right: 16px;
  z-index: 20000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-lg);
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-bright);
  animation: toastIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  display: flex; align-items: center; gap: 10px;
  min-width: 200px;
  max-width: 320px;
}
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.toast.success { border-color: rgba(26,188,156,0.5); }
.toast.success svg { color: var(--success); }
.toast.error { border-color: rgba(231,76,60,0.5); }
.toast.error svg { color: var(--danger-glow); }
.toast.info { border-color: var(--border-bright); }
.toast.info svg { color: var(--teal-accent); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px) scale(0.95); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(20px); }
}

/* ─── LOADING SCREEN ─── */
#loading-screen {
  position: fixed; inset: 0;
  background: var(--bg-deep);
  z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
}
.loading-logo {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 800;
  letter-spacing: 6px;
  color: var(--teal-accent);
  text-shadow: 0 0 40px rgba(45,212,240,0.6);
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.loading-bar-wrap {
  width: 200px;
  height: 2px;
  background: var(--bg-elevated);
  border-radius: 2px;
  overflow: hidden;
}
.loading-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--teal-dark), var(--teal-accent));
  border-radius: 2px;
  animation: loadBar 1.8s ease forwards;
}
@keyframes loadBar {
  from { width: 0; }
  to { width: 100%; }
}
.loading-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* ─── SCROLLBARS ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--teal-dark); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--teal-mid); }

/* ─── MOBILE ─── */
@media (max-width: 640px) {
  :root { --taskbar-h: 60px; }
  #taskbar { padding: 0 8px; gap: 4px; }
  #start-btn span { display: none; }
  #start-menu { width: calc(100vw - 24px); left: 12px; }
  .start-menu-grid { grid-template-columns: repeat(4, 1fr); }
  .window {
    left: 0 !important; top: 0 !important;
    width: 100vw !important;
    height: calc(100vh - var(--taskbar-h)) !important;
    border-radius: 0 !important;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0 !important;
  }
  #palm-svg { display: none; }
  .fe-sidebar { width: 120px; }
  .calc-btn { font-size: 14px; min-height: 40px; }
}

/* ─── ANIMATIONS ─── */
@keyframes windowOpen {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.window { animation: windowOpen 0.2s cubic-bezier(0.34,1.56,0.64,1); }

/* ─── PROGRESS BAR ─── */
.progress-wrap {
  width: 100%; height: 6px;
  background: var(--bg-elevated);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal-dark), var(--teal-accent));
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* ─── RENAME INLINE ─── */
.fe-item-name input {
  background: var(--bg-deep);
  border: 1px solid var(--teal-bright);
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 11px;
  font-family: var(--font-ui);
  color: var(--text-bright);
  width: 100%;
  outline: none;
  text-align: center;
}

/* clipboard hint */
.fe-cut { opacity: 0.5; }
</style>
</head>
<body>

<!-- LOADING SCREEN -->

</div>

<!-- DESKTOP -->

<!-- TASKBAR -->

  </div>
</div>

<!-- START MENU -->

  <div class="start-menu-grid" id="start-menu-grid"></div>
</div>

<!-- CONTEXT MENU -->
<div id="context-menu"></div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

/* ═══════════════════════════════════════════════════════
   VIRTUAL FILE SYSTEM — OPFS BACKEND
═══════════════════════════════════════════════════════ */
const fs = (() => {
  let root = null;

  async function init() {
    root = await navigator.storage.getDirectory();
    // Create default directories
    for (const dir of ['Documents', 'Pictures', 'Music', 'Videos', 'Downloads']) {
      try { await root.getDirectoryHandle(dir, { create: true }); } catch {}
    }
  }

  async function _resolve(pathStr, create = false) {
    const parts = pathStr.split('/').filter(Boolean);
    let handle = root;
    for (let i = 0; i < parts.length - 1; i++) {
      handle = await handle.getDirectoryHandle(parts[i], { create });
    }
    return { parent: handle, name: parts[parts.length - 1] || '', parts };
  }

  async function _resolveDir(pathStr, create = false) {
    const parts = pathStr.split('/').filter(Boolean);
    let handle = root;
    for (const p of parts) {
      handle = await handle.getDirectoryHandle(p, { create });
    }
    return handle;
  }

  async function readdir(pathStr) {
    const dir = pathStr === '/' ? root : await _resolveDir(pathStr);
    const entries = [];
    for await (const [name, handle] of dir.entries()) {
      const isDir = handle.kind === 'directory';
      let size = 0;
      let modified = null;
      if (!isDir) {
        try {
          const f = await handle.getFile();
          size = f.size;
          modified = f.lastModified;
        } catch {}
      }
      entries.push({ name, isDir, size, modified, handle });
    }
    entries.sort((a, b) => {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    return entries;
  }

  async function readFile(pathStr) {
    const { parent, name } = await _resolve(pathStr);
    const fh = await parent.getFileHandle(name);
    return await fh.getFile();
  }

  async function readText(pathStr) {
    const file = await readFile(pathStr);
    return await file.text();
  }

  async function readArrayBuffer(pathStr) {
    const file = await readFile(pathStr);
    return await file.arrayBuffer();
  }

  async function writeFile(pathStr, data) {
    const { parent, name } = await _resolve(pathStr, true);
    const fh = await parent.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(data);
    await w.close();
  }

  async function writeText(pathStr, text) {
    return writeFile(pathStr, new Blob([text], { type: 'text/plain' }));
  }

  async function mkdir(pathStr) {
    return _resolveDir(pathStr, true);
  }

  async function remove(pathStr) {
    const { parent, name } = await _resolve(pathStr);
    try {
      const dh = await parent.getDirectoryHandle(name);
      await dh.remove({ recursive: true });
    } catch {
      await parent.removeEntry(name, { recursive: true });
    }
  }

  async function exists(pathStr) {
    try {
      const { parent, name } = await _resolve(pathStr);
      try { await parent.getFileHandle(name); return 'file'; } catch {}
      try { await parent.getDirectoryHandle(name); return 'dir'; } catch {}
      return false;
    } catch { return false; }
  }

  async function copy(srcPath, destPath) {
    const srcType = await exists(srcPath);
    if (!srcType) throw new Error('Source not found');
    if (srcType === 'dir') {
      await mkdir(destPath);
      const entries = await readdir(srcPath);
      for (const e of entries) {
        await copy(`${srcPath}/${e.name}`, `${destPath}/${e.name}`);
      }
    } else {
      const data = await readArrayBuffer(srcPath);
      await writeFile(destPath, data);
    }
  }

  async function move(srcPath, destPath) {
    await copy(srcPath, destPath);
    await remove(srcPath);
  }

  async function rename(pathStr, newName) {
    const parts = pathStr.split('/');
    parts[parts.length - 1] = newName;
    const newPath = parts.join('/');
    await move(pathStr, newPath);
    return newPath;
  }

  async function importFile(file, destDir) {
    const destPath = `${destDir}/${file.name}`;
    const buf = await file.arrayBuffer();
    await writeFile(destPath, buf);
    return destPath;
  }

  async function clearAll() {
    for await (const [name, handle] of root.entries()) {
      await root.removeEntry(name, { recursive: true });
    }
    for (const dir of ['Documents', 'Pictures', 'Music', 'Videos', 'Downloads']) {
      await root.getDirectoryHandle(dir, { create: true });
    }
  }

  // Recursive dir walk
  async function walk(pathStr, result = []) {
    const entries = await readdir(pathStr);
    for (const e of entries) {
      const full = pathStr === '/' ? `/${e.name}` : `${pathStr}/${e.name}`;
      result.push({ path: full, ...e });
      if (e.isDir) await walk(full, result);
    }
    return result;
  }

  return { init, readdir, readFile, readText, readArrayBuffer, writeFile, writeText, mkdir, remove, exists, copy, move, rename, importFile, clearAll, walk };
})();

/* ═══════════════════════════════════════════════════════
   RAIN ANIMATION
═══════════════════════════════════════════════════════ */
function initRain() {
  const canvas = document.getElementById('rain-canvas');
  const ctx = canvas.getContext('2d');
  let drops = [];
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drops = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 20 + 10,
      speed: Math.random() * 4 + 3,
      opacity: Math.random() * 0.5 + 0.1,
      width: Math.random() * 0.8 + 0.3,
    }));
  }
  
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drops.forEach(d => {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * 0.15, d.y + d.len);
      ctx.strokeStyle = `rgba(180, 220, 230, ${d.opacity})`;
      ctx.lineWidth = d.width;
      ctx.stroke();
      d.y += d.speed;
      d.x -= d.speed * 0.15;
      if (d.y > canvas.height) {
        d.y = -d.len;
        d.x = Math.random() * canvas.width;
      }
    });
    requestAnimationFrame(animate);
  }
  
  resize();
  window.addEventListener('resize', resize);
  animate();
}

/* ═══════════════════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════════════════ */
function updateClock() {
  const el = document.getElementById('clock');
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const d = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  el.textContent = `${d}  ${h}:${m}:${s}`;
}

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function toast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { info: Icons.info, success: Icons.check, error: Icons.warn };
  el.innerHTML = `${icons[type] || Icons.info}<span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ═══════════════════════════════════════════════════════
   DIALOG SYSTEM
═══════════════════════════════════════════════════════ */
function showDialog({ title, body, input = null, actions = [] }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    let inputHtml = input ? `<input class="dialog-input" type="text" value="${input.value || ''}" placeholder="${input.placeholder || ''}">` : '';
    let actionsHtml = actions.map((a, i) =>
      `<button class="dialog-btn ${a.cls || ''}" data-idx="${i}">${a.label}</button>`
    ).join('');
    overlay.innerHTML = `<div class="dialog"><h3>${title}</h3><p>${body}</p>${inputHtml}<div class="dialog-actions">${actionsHtml}</div></div>`;
    document.body.appendChild(overlay);
    const inputEl = overlay.querySelector('.dialog-input');
    if (inputEl) { inputEl.focus(); inputEl.select(); }
    overlay.querySelectorAll('.dialog-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        const val = inputEl ? inputEl.value : null;
        overlay.remove();
        resolve({ action: actions[idx].key, value: val });
      });
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.remove(); resolve({ action: 'cancel' }); } });
    if (inputEl) {
      inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { overlay.querySelector('[data-idx="0"]')?.click(); }
        if (e.key === 'Escape') { overlay.remove(); resolve({ action: 'cancel' }); }
      });
    }
  });
}

/* ═══════════════════════════════════════════════════════
   WINDOW MANAGER
═══════════════════════════════════════════════════════ */
const WM = (() => {
  let windows = new Map();
  let zCounter = 100;
  let focused = null;
  
  function create({ id, title, icon, width = 700, height = 480, minW = 280, minH = 180, content, onClose, appId }) {
    if (windows.has(id)) { focus(id); return; }
    
    const isMobile = window.innerWidth <= 640;
    const w = isMobile ? window.innerWidth : Math.min(width, window.innerWidth - 40);
    const h = isMobile ? window.innerHeight - 60 : Math.min(height, window.innerHeight - 80);
    const x = isMobile ? 0 : Math.max(20, Math.floor((window.innerWidth - w) / 2) + (windows.size % 5) * 24);
    const y = isMobile ? 0 : Math.max(10, Math.floor((window.innerHeight - h) / 3) + (windows.size % 4) * 24);
    
    const el = document.createElement('div');
    el.className = 'window';
    el.dataset.id = id;
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++zCounter}`;
    
    el.innerHTML = `
      <div class="win-titlebar" data-drag="${id}">
        <div class="win-title-icon">${icon}</div>
        <div class="win-title-text">${title}</div>
        <div class="win-controls">
          <button class="win-btn minimize" title="Minimize">${Icons.minimize}</button>
          <button class="win-btn maximize" title="Maximize">${Icons.maximize}</button>
          <button class="win-btn close" title="Close">${Icons.close}</button>
        </div>
      </div>
      <div class="win-body">${content}</div>
      <div class="resize-handle rh-n"></div>
      <div class="resize-handle rh-s"></div>
      <div class="resize-handle rh-w"></div>
      <div class="resize-handle rh-e"></div>
      <div class="resize-handle rh-nw"></div>
      <div class="resize-handle rh-ne"></div>
      <div class="resize-handle rh-sw"></div>
      <div class="resize-handle rh-se"></div>
    `;
    
    document.getElementById('desktop').appendChild(el);
    
    const state = { id, title, icon, el, minimized: false, maximized: false, prevRect: null, appId, onClose, minW, minH };
    windows.set(id, state);
    
    // Controls
    el.querySelector('.win-btn.close').addEventListener('click', () => close(id));
    el.querySelector('.win-btn.minimize').addEventListener('click', () => minimize(id));
    el.querySelector('.win-btn.maximize').addEventListener('click', () => toggleMaximize(id));
    el.querySelector('.win-titlebar').addEventListener('dblclick', () => toggleMaximize(id));
    
    // Focus on click
    el.addEventListener('mousedown', () => focus(id), true);
    el.addEventListener('touchstart', () => focus(id), { passive: true });
    
    setupDrag(el, id);
    setupResize(el, id);
    
    focus(id);
    addTaskbarBtn(id);
    return id;
  }
  
  function focus(id) {
    if (focused === id) return;
    windows.forEach((w, wid) => { w.el.classList.remove('focused'); });
    const win = windows.get(id);
    if (!win) return;
    win.el.style.zIndex = ++zCounter;
    win.el.classList.add('focused');
    if (win.minimized) restore(id);
    focused = id;
    updateTaskbar();
  }
  
  function minimize(id) {
    const win = windows.get(id);
    if (!win) return;
    win.minimized = true;
    win.el.classList.add('minimized');
    focused = null;
    updateTaskbar();
  }
  
  function restore(id) {
    const win = windows.get(id);
    if (!win) return;
    win.minimized = false;
    win.el.classList.remove('minimized');
    focus(id);
    updateTaskbar();
  }
  
  function toggleMaximize(id) {
    const win = windows.get(id);
    if (!win) return;
    if (win.maximized) {
      win.el.style.cssText = `left:${win.prevRect.x}px;top:${win.prevRect.y}px;width:${win.prevRect.w}px;height:${win.prevRect.h}px;z-index:${++zCounter}`;
      win.el.classList.remove('maximized');
      win.maximized = false;
      win.el.querySelector('.win-btn.maximize').innerHTML = Icons.maximize;
    } else {
      win.prevRect = { x: parseInt(win.el.style.left), y: parseInt(win.el.style.top), w: win.el.offsetWidth, h: win.el.offsetHeight };
      win.el.classList.add('maximized');
      win.el.style.zIndex = ++zCounter;
      win.maximized = true;
      win.el.querySelector('.win-btn.maximize').innerHTML = Icons.restore;
    }
  }
  
  function close(id) {
    const win = windows.get(id);
    if (!win) return;
    if (win.onClose) win.onClose();
    win.el.remove();
    windows.delete(id);
    focused = null;
    removeTaskbarBtn(id);
    updateTaskbar();
  }
  
  function addTaskbarBtn(id) {
    const win = windows.get(id);
    if (!win) return;
    const bar = document.getElementById('taskbar-apps');
    const btn = document.createElement('button');
    btn.className = 'taskbar-app-btn';
    btn.dataset.wid = id;
    btn.innerHTML = `${win.icon}<span>${win.title}</span>`;
    btn.addEventListener('click', () => {
      const w = windows.get(id);
      if (!w) return;
      if (w.minimized) restore(id);
      else if (focused === id) minimize(id);
      else focus(id);
    });
    bar.appendChild(btn);
  }
  
  function removeTaskbarBtn(id) {
    const btn = document.querySelector(`.taskbar-app-btn[data-wid="${id}"]`);
    if (btn) btn.remove();
  }
  
  function updateTaskbar() {
    document.querySelectorAll('.taskbar-app-btn').forEach(btn => {
      const win = windows.get(btn.dataset.wid);
      btn.classList.toggle('active', win && !win.minimized && focused === btn.dataset.wid);
    });
  }
  
  function setupDrag(el, id) {
    const titlebar = el.querySelector('[data-drag]');
    let startX, startY, startL, startT, dragging = false;
    
    const onStart = (x, y) => {
      const win = windows.get(id);
      if (!win || win.maximized) return;
      dragging = true;
      startX = x; startY = y;
      startL = parseInt(el.style.left) || 0;
      startT = parseInt(el.style.top) || 0;
      document.body.style.cursor = 'move';
    };
    const onMove = (x, y) => {
      if (!dragging) return;
      const dx = x - startX, dy = y - startY;
      const newL = Math.max(-el.offsetWidth + 60, startL + dx);
      const newT = Math.max(0, Math.min(window.innerHeight - 60, startT + dy));
      el.style.left = newL + 'px';
      el.style.top = newT + 'px';
    };
    const onEnd = () => { dragging = false; document.body.style.cursor = ''; };
    
    titlebar.addEventListener('mousedown', e => { if (e.button !== 0) return; e.preventDefault(); onStart(e.clientX, e.clientY); });
    titlebar.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
    document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    document.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);
  }
  
  function setupResize(el, id) {
    el.querySelectorAll('.resize-handle').forEach(handle => {
      let startX, startY, startW, startH, startL, startT, resizing = false;
      const dirs = handle.className.match(/rh-(\w+)/)[1];
      
      const onStart = (x, y) => {
        const win = windows.get(id);
        if (!win || win.maximized) return;
        resizing = true;
        startX = x; startY = y;
        startW = el.offsetWidth; startH = el.offsetHeight;
        startL = parseInt(el.style.left) || 0;
        startT = parseInt(el.style.top) || 0;
        document.body.style.userSelect = 'none';
      };
      
      const onMove = (x, y) => {
        if (!resizing) return;
        const win = windows.get(id);
        if (!win) return;
        const dx = x - startX, dy = y - startY;
        let newW = startW, newH = startH, newL = startL, newT = startT;
        if (dirs.includes('e')) newW = Math.max(win.minW, startW + dx);
        if (dirs.includes('s')) newH = Math.max(win.minH, startH + dy);
        if (dirs.includes('w')) { newW = Math.max(win.minW, startW - dx); newL = startL + (startW - newW); }
        if (dirs.includes('n')) { newH = Math.max(win.minH, startH - dy); newT = startT + (startH - newH); }
        el.style.left = newL + 'px'; el.style.top = newT + 'px';
        el.style.width = newW + 'px'; el.style.height = newH + 'px';
      };
      
      const onEnd = () => { resizing = false; document.body.style.userSelect = ''; };
      
      handle.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); onStart(e.clientX, e.clientY); });
      handle.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientX, t.clientY); e.stopPropagation(); }, { passive: true });
      document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      document.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    });
  }
  
  function setTitle(id, title) {
    const win = windows.get(id);
    if (!win) return;
    win.title = title;
    win.el.querySelector('.win-title-text').textContent = title;
    const btn = document.querySelector(`.taskbar-app-btn[data-wid="${id}"] span`);
    if (btn) btn.textContent = title;
  }
  
  return { create, focus, minimize, restore, close, toggleMaximize, setTitle, windows };
})();

/* ═══════════════════════════════════════════════════════
   FILE TYPE HELPERS
═══════════════════════════════════════════════════════ */
const EXT_MAP = {
  // Text/Code
  txt: 'text', md: 'text', json: 'code', js: 'code', ts: 'code', html: 'code',
  css: 'code', py: 'code', sh: 'code', yaml: 'code', yml: 'code', xml: 'code',
  csv: 'text', log: 'text', ini: 'text', cfg: 'text', conf: 'text', toml: 'code',
  rs: 'code', go: 'code', c: 'code', cpp: 'code', h: 'code', java: 'code',
  php: 'code', rb: 'code', swift: 'code', kt: 'code', sql: 'code',
  // Images
  jpg: 'image', jpeg: 'image', png: 'image', gif: 'image', webp: 'image',
  svg: 'image', bmp: 'image', ico: 'image', tiff: 'image', avif: 'image',
  // Video
  mp4: 'video', webm: 'video', ogg: 'video', mkv: 'video', mov: 'video',
  avi: 'video', m4v: 'video',
  // Audio
  mp3: 'audio', wav: 'audio', flac: 'audio', aac: 'audio', m4a: 'audio',
  opus: 'audio', weba: 'audio',
  // Archive
  zip: 'zip', tar: 'zip', gz: 'zip', bz2: 'zip', xz: 'zip', '7z': 'zip',
  // Docs
  pdf: 'pdf', doc: 'doc', docx: 'doc', xls: 'doc', xlsx: 'doc', ppt: 'doc',
};

function getFileType(name) {
  const ext = name.split('.').pop().toLowerCase();
  return EXT_MAP[ext] || 'file';
}

function getFileIcon(name, isDir = false) {
  if (isDir) return Icons.folder;
  const type = getFileType(name);
  const map = {
    text: Icons.fileText, code: Icons.fileCode, image: Icons.fileImage,
    video: Icons.fileVideo, audio: Icons.fileAudio, zip: Icons.fileZip,
    pdf: Icons.filePdf, doc: Icons.doc,
  };
  return map[type] || Icons.file;
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`;
}

function formatDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* ═══════════════════════════════════════════════════════
   CONTEXT MENU SYSTEM
═══════════════════════════════════════════════════════ */
const ContextMenu = (() => {
  const el = document.getElementById('context-menu');
  let cleanup = null;
  
  function show(x, y, items) {
    el.innerHTML = '';
    items.forEach(item => {
      if (item.separator) {
        const sep = document.createElement('div');
        sep.className = 'ctx-separator';
        el.appendChild(sep);
      } else {
        const btn = document.createElement('div');
        btn.className = `ctx-item${item.danger ? ' danger' : ''}`;
        btn.innerHTML = `${item.icon || ''}<span>${item.label}</span>`;
        if (item.action) btn.addEventListener('click', () => { hide(); item.action(); });
        else btn.style.opacity = '0.4';
        el.appendChild(btn);
      }
    });
    
    el.classList.add('open');
    const rect = el.getBoundingClientRect();
    const safeX = Math.min(x, window.innerWidth - rect.width - 8);
    const safeY = Math.min(y, window.innerHeight - rect.height - 8);
    el.style.left = safeX + 'px';
    el.style.top = safeY + 'px';
    
    setTimeout(() => {
      cleanup = (e) => { if (!el.contains(e.target)) hide(); };
      document.addEventListener('mousedown', cleanup);
      document.addEventListener('touchstart', cleanup, { passive: true });
    }, 10);
  }
  
  function hide() {
    el.classList.remove('open');
    if (cleanup) {
      document.removeEventListener('mousedown', cleanup);
      document.removeEventListener('touchstart', cleanup);
      cleanup = null;
    }
  }
  
  return { show, hide };
})();

/* ═══════════════════════════════════════════════════════
   DESKTOP ICONS
═══════════════════════════════════════════════════════ */
const Desktop = (() => {
  const area = document.getElementById('desktop-icons-area');
  const selBox = document.getElementById('selection-box');
  let icons = [];
  let positions = {};
  let selected = new Set();
  let selStart = null;
  
  const DESKTOP_APPS = [
    { id: 'files', label: 'Files', icon: Icons.explorer, app: 'files' },
    { id: 'editor', label: 'Editor', icon: Icons.editor, app: 'editor' },
    { id: 'browser', label: 'Browser', icon: Icons.browser, app: 'browser' },
    { id: 'media', label: 'Media', icon: Icons.media, app: 'media' },
    { id: 'calc', label: 'Calculator', icon: Icons.calc, app: 'calc' },
    { id: 'settings', label: 'Settings', icon: Icons.settings, app: 'settings' },
  ];
  
  function load() {
    try { positions = JSON.parse(localStorage.getItem('stormOS_iconPos') || '{}'); } catch {}
    area.innerHTML = '';
    icons = [];
    
    DESKTOP_APPS.forEach((app, i) => {
      const col = 0, row = i;
      const defaultX = 16 + col * 96;
      const defaultY = 16 + row * 100;
      const pos = positions[app.id] || { x: defaultX, y: defaultY };
      
      const el = document.createElement('div');
      el.className = 'desktop-icon';
      el.dataset.id = app.id;
      el.dataset.app = app.app;
      el.innerHTML = `${app.icon}<span>${app.label}</span>`;
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
      
      setupIconDrag(el, app.id);
      
      let clickTimer = null, clickCount = 0;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        clickCount++;
        if (clickCount === 1) {
          clickTimer = setTimeout(() => {
            clickCount = 0;
            selectIcon(app.id, e.ctrlKey || e.metaKey || e.shiftKey);
          }, 250);
        } else {
          clearTimeout(clickTimer);
          clickCount = 0;
          clearSelection();
          launchApp(app.app);
        }
      });
      
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        selectIcon(app.id, false);
        ContextMenu.show(e.clientX, e.clientY, [
          { label: 'Open', icon: Icons.folderOpen, action: () => launchApp(app.app) },
        ]);
      });
      
      area.appendChild(el);
      icons.push({ ...app, el, pos });
    });
  }
  
  function setupIconDrag(el, id) {
    let startX, startY, origX, origY, moved = false;
    const onStart = (x, y) => {
      startX = x; startY = y;
      origX = parseInt(el.style.left) || 0;
      origY = parseInt(el.style.top) || 0;
      moved = false;
    };
    const onMove = (x, y) => {
      if (Math.abs(x - startX) < 4 && Math.abs(y - startY) < 4) return;
      moved = true;
      el.style.left = Math.max(0, origX + (x - startX)) + 'px';
      el.style.top = Math.max(0, origY + (y - startY)) + 'px';
    };
    const onEnd = () => {
      if (moved) {
        positions[id] = { x: parseInt(el.style.left), y: parseInt(el.style.top) };
        localStorage.setItem('stormOS_iconPos', JSON.stringify(positions));
      }
    };
    el.addEventListener('mousedown', e => { if (e.button !== 0) return; e.stopPropagation(); onStart(e.clientX, e.clientY); });
    document.addEventListener('mousemove', e => { if (e.buttons === 1) onMove(e.clientX, e.clientY); });
    document.addEventListener('mouseup', () => onEnd());
  }
  
  function selectIcon(id, multi) {
    if (!multi) clearSelection();
    selected.add(id);
    document.querySelector(`.desktop-icon[data-id="${id}"]`)?.classList.add('selected');
  }
  
  function clearSelection() {
    selected.clear();
    document.querySelectorAll('.desktop-icon.selected').forEach(el => el.classList.remove('selected'));
  }
  
  // Selection box
  area.addEventListener('mousedown', e => {
    if (e.target !== area) return;
    clearSelection();
    selStart = { x: e.clientX, y: e.clientY };
    selBox.style.display = 'block';
    selBox.style.left = e.clientX + 'px';
    selBox.style.top = e.clientY + 'px';
    selBox.style.width = '0'; selBox.style.height = '0';
  });
  
  document.addEventListener('mousemove', e => {
    if (!selStart) return;
    const x = Math.min(e.clientX, selStart.x);
    const y = Math.min(e.clientY, selStart.y);
    const w = Math.abs(e.clientX - selStart.x);
    const h = Math.abs(e.clientY - selStart.y);
    selBox.style.left = x + 'px'; selBox.style.top = y + 'px';
    selBox.style.width = w + 'px'; selBox.style.height = h + 'px';
    
    const sr = { left: x, top: y, right: x + w, bottom: y + h };
    document.querySelectorAll('.desktop-icon').forEach(icon => {
      const ir = icon.getBoundingClientRect();
      const overlap = ir.left < sr.right && ir.right > sr.left && ir.top < sr.bottom && ir.bottom > sr.top;
      if (overlap) { icon.classList.add('selected'); selected.add(icon.dataset.id); }
      else { icon.classList.remove('selected'); selected.delete(icon.dataset.id); }
    });
  });
  
  document.addEventListener('mouseup', () => {
    selStart = null;
    selBox.style.display = 'none';
  });
  
  return { load, clearSelection };
})();

async function applyWallpaper(wpId) {
  const wallpaperEl = document.getElementById('wallpaper');
  if (wpId === 'custom') {
    try {
      const data = await fs.readArrayBuffer('/system/wallpaper');
      const blob = new Blob([data]);
      const url = URL.createObjectURL(blob);
      wallpaperEl.className = 'wp-custom';
      wallpaperEl.style.backgroundImage = `url(${url})`;
      wallpaperEl.style.backgroundSize = 'cover';
      wallpaperEl.style.backgroundPosition = 'center';
    } catch {}
    return;
  }
  const wp = WALLPAPERS.find(w => w.id === wpId) || WALLPAPERS[0];
  wallpaperEl.className = '';
  wallpaperEl.style.cssText = wp.style;
  localStorage.setItem('stormOS_wallpaper', wpId);
}

function loadWallpaper() {
  const saved = localStorage.getItem('stormOS_wallpaper') || 'storm';
  applyWallpaper(saved);
}
