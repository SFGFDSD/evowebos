  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const imgs = list.filter(e => !e.isDirectory && /\.(jpe?g|png|webp|gif)$/i.test(e.name)).map(e => e.name).sort(collator.compare);
  if (!imgs.length) { UI.alert('该目录下没有可识别的图片（jpg / jpeg / png / webp / gif）', '漫画阅读器'); return; }
  const urls = [];
  const win = WM.open({ app: 'manga', title: `漫画阅读器 · ${dirLabel(dir)}`, w: 940, h: 720, build });
  function build(body) {
    body.innerHTML = `<div class="app" style="background:#000"><div class="toolbar" style="background:#111;border-bottom-color:#222;color:#ddd">
      <span class="chip b-page" style="background:rgba(255,255,255,.1);color:#fff">1 / ${imgs.length}</span>
      <button class="btn b-top" style="color:#ddd" title="回到顶部">${ICON.up()}<span class="lb">顶部</span></button>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;margin-left:8px">宽度<input type="range" class="rng b-w" min="400" max="2000" step="50" value="${S.mangaWidth}"></label>
      <div class="sp"></div><span class="b-name" style="font-size:12px;color:#888;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;max-width:200px"></span>
      <button class="btn b-fs" style="color:#ddd" title="全屏 (F)">${ICON.fullscreen()}<span class="lb">全屏</span></button></div>
      <div class="manga-scroll"><div class="manga-load"><div class="spinner"></div><span>正在加载 ${imgs.length} 张图片…</span></div><div class="manga-col"></div></div>
      <button class="manga-exit" title="退出全屏">${ICON.close()}</button></div>`;
    const scroll = $('.manga-scroll', body), col = $('.manga-col', body), loadEl = $('.manga-load', body), pageEl = $('.b-page', body), nameEl = $('.b-name', body);
    const setW = w => { col.style.setProperty('--mw', w + 'px'); $$('img', col).forEach(i => i.style.maxWidth = w + 'px'); };
    $('.b-w', body).oninput = e => { setW(+e.target.value); Settings.set('mangaWidth', +e.target.value); };
    $('.b-top', body).onclick = () => scroll.scrollTo({ top: 0, behavior: 'smooth' });
    /* 全屏 */
    const enterFs = () => { win.el.classList.add('manga-fs'); if (win.el.requestFullscreen) win.el.requestFullscreen().catch(() => { }); };
    const exitFs = () => { win.el.classList.remove('manga-fs'); if (document.fullscreenElement) document.exitFullscreen().catch(() => { }); };
    $('.b-fs', body).onclick = () => win.el.classList.contains('manga-fs') ? exitFs() : enterFs();
    $('.manga-exit', body).onclick = exitFs;
    const onFsChange = () => { if (!document.fullscreenElement) win.el.classList.remove('manga-fs'); };
    document.addEventListener('fullscreenchange', onFsChange);
    win.el.tabIndex = -1; win.el.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') $('.b-fs', body).click(); if (e.key === 'Escape' && win.el.classList.contains('manga-fs')) exitFs(); });

    const io = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) { pageEl.textContent = `${+en.target.dataset.i + 1} / ${imgs.length}`; nameEl.textContent = en.target.dataset.name; } }, { root: scroll, threshold: 0.3 });
    win.onClose.push(() => { io.disconnect(); document.removeEventListener('fullscreenchange', onFsChange); urls.forEach(u => URL.revokeObjectURL(u)); if (document.fullscreenElement === win.el) document.exitFullscreen().catch(() => { }); });
    /* 并行读取，按序插入 */
    (async () => {
      const results = await Promise.all(imgs.map(n => fs.readFile(P.join(dir, n)).then(b => ({ n, b })).catch(err => ({ n, err }))));
      let failed = 0; const targetName = P.base(path); let target = null; let pinned = true;
      const unpin = () => { pinned = false; }; scroll.addEventListener('wheel', unpin, { passive: true }); scroll.addEventListener('touchstart', unpin, { passive: true }); scroll.addEventListener('pointerdown', unpin);
      results.forEach((r, i) => {
        if (r.err) { failed++; console.warn('漫画图片读取失败', r.n, r.err); return; }
        const url = URL.createObjectURL(new Blob([r.b], { type: mimeOf(r.n) })); urls.push(url);

      <div class="sep"></div><button class="btn b-lock" disabled title="锁定鼠标到虚拟机（按 Esc 释放）">${ICON.mouse()}<span class="lb">锁定鼠标</span></button><button class="btn b-cad" disabled title="发送 Ctrl+Alt+Del">${ICON.keyboard()}<span class="lb">Ctrl+Alt+Del</span></button><button class="btn b-scale" disabled title="缩放画面">${ICON.zoomIn()}<span class="lb">缩放</span></button><button class="btn b-fs" disabled>${ICON.fullscreen()}<span class="lb">全屏</span></button>
      <div class="sep"></div><button class="btn b-savest" disabled title="保存虚拟机状态到 /Documents">${ICON.save()}<span class="lb">存档</span></button><button class="btn b-loadst" disabled title="从文件载入状态">${ICON.upload()}<span class="lb">读档</span></button>
      <div class="sp"></div><span class="st mono" style="font-size:12px;color:#8a8">就绪</span></div>
      <div class="vm-screen">
        <div class="vm-setup"><h2>启动一台 x86 虚拟机</h2><p>v86 在浏览器中模拟 x86 PC。请从虚拟文件系统选择你自己导入的镜像：<b>.iso</b> 挂载为光驱、<b>.img / .fda / .bin</b> 挂载为软盘、其他挂载为硬盘。系统不会从外部 URL 下载任何镜像。</p>
          <label>镜像文件<div style="display:flex;gap:6px"><input class="inp vm-img" readonly style="flex:1" placeholder="尚未选择" value="${esc(imagePath || '')}"><button class="btn ghost b-pick">${ICON.doc()}<span>选择</span></button><button class="btn ghost b-import" title="从电脑导入镜像到 /Downloads">${ICON.upload()}</button></div></label>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
            <label>挂载方式<select class="inp vm-kind"><option value="auto">自动（按后缀）</option><option value="cdrom">光驱 (cdrom)</option><option value="fda">软盘 (fda)</option><option value="hda">硬盘 (hda)</option></select></label>
            <label>内存<select class="inp vm-mem">${[32, 64, 128, 256, 512, 1024].map(m => `<option value="${m}" ${m === S.vmMemory ? 'selected' : ''}>${m} MB</option>`).join('')}</select></label>
            <label>显存<select class="inp vm-vga">${[2, 8, 16, 32].map(m => `<option value="${m}" ${m === S.vmVga ? 'selected' : ''}>${m} MB</option>`).join('')}</select></label></div>
          <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" class="vm-autolock" checked> 点击画面时自动锁定鼠标</label>
          <div><button class="btn primary b-boot" style="height:40px;padding:0 20px">${ICON.play()}<span>启动虚拟机</span></button></div>
          <p style="font-size:11.5px">BIOS 来自锁定 commit 的 CDN，WASM 与 JS 均为 v0.5.319。${(window.V86 || window.V86Starter) ? '' : '<b style="color:#f28b82">libv86.js 尚未加载（检查网络）。</b>'}</p></div>
        <div class="screen_container hidden" id="${sid}"><div style="white-space:pre;font:14px/1.2 monospace"></div><canvas></canvas></div>
      </div><div class="vm-log"></div></div>`;
    const log = m => { const el = $('.vm-log', body); el.textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; el.scrollTop = el.scrollHeight; }; const st = m => $('.st', body).textContent = m;
    const setup = $('.vm-setup', body), container = $('#' + sid, body);
    const setBtns = on => { for (const c of ['pause', 'reset', 'stop', 'lock', 'cad', 'scale', 'fs', 'savest', 'loadst']) $('.b-' + c, body).disabled = !on; $('.b-start', body).disabled = on; };
    $('.b-pick', body).onclick = async () => { const p = await UI.pickFile(imagePath ? P.dir(imagePath) : '/Downloads', e => ['disk', 'archive', 'other'].includes(e.kind) || ['iso', 'img', 'bin', 'fda', 'hda'].includes(e.ext), '选择磁盘镜像'); if (p) { imagePath = p; $('.vm-img', body).value = p; } };
    $('.b-import', body).onclick = async () => { const [f] = await pickFiles($('#file-in'), { multiple: false, accept: '.iso,.img,.bin,.fda,.hda,.vhd' }); if (!f) return; const dest = P.join('/Downloads', await fs.uniqueName('/Downloads', f.name)); const b = UI.busy('正在导入镜像…'); await fs.writeFile(dest, f); b.done('已导入 ' + f.name); imagePath = dest; $('.vm-img', body).value = dest; };
    async function boot() {
      const Ctor = window.V86 || window.V86Starter; if (!Ctor) { UI.alert('libv86.js 未能加载，请检查网络后重试。', '虚拟机'); return; }
      if (!imagePath) { UI.toast('请先选择镜像文件', 'err'); return; }
      let buf; const b = UI.busy('正在读取镜像…'); try { buf = await fs.readFile(imagePath); } catch (e) { b.done('读取镜像失败：' + e.message, 'err'); return; } b.done();
      const ext = P.ext(imagePath); let kind = $('.vm-kind', body).value; if (kind === 'auto') kind = ext === 'iso' ? 'cdrom' : ['img', 'fda', 'bin'].includes(ext) ? 'fda' : 'hda';
      const mem = +$('.vm-mem', body).value, vga = +$('.vm-vga', body).value; Settings.set('vmMemory', mem); Settings.set('vmVga', vga);
      const opts = { wasm_path: V86_URLS.wasm, memory_size: mem * 1024 * 1024, vga_memory_size: vga * 1024 * 1024, screen_container: container, bios: { url: V86_URLS.bios }, vga_bios: { url: V86_URLS.vgabios }, autostart: true, boot_order: kind === 'cdrom' ? 0x213 : kind === 'fda' ? 0x231 : 0x312 };
      opts[kind] = { buffer: buf };
      setup.classList.add('hidden'); container.classList.remove('hidden'); log(`镜像 ${P.base(imagePath)} (${fmtSize(buf.byteLength)}) 挂载为 ${kind}，内存 ${mem}MB`); st('正在启动…');
      try { emulator = new Ctor(opts); } catch (e) { log('启动失败：' + e.message); st('失败'); setup.classList.remove('hidden'); return; }
      running = true; setBtns(true);
      emulator.add_listener('emulator-ready', () => { log('模拟器就绪'); st('运行中'); });
      emulator.add_listener('emulator-started', () => st('运行中'));
      emulator.add_listener('emulator-stopped', () => st('已暂停'));
      emulator.add_listener('download-error', e => log('资源下载失败：' + (e && e.file_name)));
      emulator.add_listener('screen-set-size-graphical', s => log(`显示模式 ${s[0]}×${s[1]}`));
      emulator.add_listener('screen-set-size-text', s => log(`文本模式 ${s[0]}×${s[1]}`));
      container.onclick = () => { if ($('.vm-autolock', body).checked) lockMouse(); emulator.keyboard_set_status && emulator.keyboard_set_status(true); };
    }
    const lockMouse = () => { if (!emulator) return; try { emulator.lock_mouse(); st('鼠标已锁定 · Esc 释放'); } catch (e) { const cv = $('canvas', container); cv.requestPointerLock && cv.requestPointerLock(); } };
    document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && running) st('运行中'); });
    $('.b-boot', body).onclick = boot; $('.b-start', body).onclick = () => setup.classList.contains('hidden') && emulator ? emulator.run() : boot();
    $('.b-pause', body).onclick = e => { if (!emulator) return; if (emulator.is_running()) { emulator.stop(); e.currentTarget.innerHTML = `${ICON.play()}<span class="lb">继续</span>`; } else { emulator.run(); e.currentTarget.innerHTML = `${ICON.pause()}<span class="lb">暂停</span>`; } };
    $('.b-reset', body).onclick = () => emulator && emulator.restart();
    $('.b-stop', body).onclick = async () => { if (!emulator) return; try { await emulator.stop(); emulator.destroy && emulator.destroy(); } catch (e) { } emulator = null; running = false; setBtns(false); container.classList.add('hidden'); setup.classList.remove('hidden'); st('已停止'); log('虚拟机已停止'); };
    $('.b-lock', body).onclick = lockMouse;
    $('.b-cad', body).onclick = () => emulator && emulator.keyboard_send_scancodes([0x1D, 0x38, 0xE0, 0x53, 0xE0, 0xD3, 0xB8, 0x9D]);
    $('.b-scale', body).onclick = () => { scale = scale >= 2 ? 1 : scale + 0.5; emulator && emulator.screen_set_scale(scale, scale); st(`缩放 ${scale}×`); };
    $('.b-fs', body).onclick = () => emulator && emulator.screen_go_fullscreen();
    $('.b-savest', body).onclick = async () => { if (!emulator) return; try { const state = await emulator.save_state(); const dest = P.join('/Documents', await fs.uniqueName('/Documents', `${P.stem(imagePath)}-state.bin`)); await fs.writeFile(dest, state); UI.toast('状态已保存到 ' + dest, 'ok'); } catch (e) { UI.toast('保存状态失败：' + e.message, 'err'); } };
    $('.b-loadst', body).onclick = async () => { if (!emulator) return; const p = await UI.pickFile('/Documents', e => e.ext === 'bin', '选择状态文件'); if (!p) return; try { await emulator.restore_state(await fs.readFile(p)); UI.toast('状态已载入', 'ok'); } catch (e) { UI.toast('载入失败：' + e.message, 'err'); } };
    win.onClose.push(() => { if (emulator) { try { emulator.stop(); emulator.destroy && emulator.destroy(); } catch (e) { } } if (document.pointerLockElement) document.exitPointerLock(); });
  }
}
APP_LAUNCH.vm = o => VMApp(o);

/* ============================================================
   § 27. 启动
   ============================================================ */
(async function boot() {
  applyTheme(); tickClock();
  const mode = await vfs.init();
  try { await ensureLayout(); } catch (e) { console.error(e); }
  await applyWallpaper();
  Desktop.init(); StartMenu.init(); applyTheme();
  await Desktop.refresh();
  document.addEventListener('settings', e => { const k = e.detail.key; if (['theme', 'accent', 'animations', 'blur', 'fontScale', 'iconSize'].includes(k)) applyTheme(); });
  if (mode !== 'OPFS') UI.toast(`OPFS 不可用，已自动降级到 ${mode} 存储`, 'err', 7000);
  Mounts.remindOnBoot();
  window.addEventListener('beforeunload', () => { });
  console.log('%cLimoni OS%c 已启动 · 存储后端 ' + mode, 'font-weight:700;color:#1f5fae', '');
})();
</script>
