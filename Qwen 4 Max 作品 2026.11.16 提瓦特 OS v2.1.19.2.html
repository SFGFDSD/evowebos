const Desktop={
  sel:new Set(),items:[],mq:null,
  keyOf(it){return it.type==='app'?'app:'+it.id:'file:'+it.name},
  defaultPos(i){const cellW=96,cellH=106,pad=10;const perCol=Math.max(1,Math.floor(($('#desktop').clientHeight-pad*2)/cellH));
    return{x:pad+Math.floor(i/perCol)*cellW,y:pad+(i%perCol)*cellH}},
  async render(){const wrap=$('#desktop-icons');wrap.innerHTML='';this.items=[];this.sel.clear();
    const positions=Settings.get('iconPositions');let idx=0;
    const add=it=>{const key=this.keyOf(it);let pos=positions[key];if(!pos){pos=this.defaultPos(idx);positions[key]=pos}idx++;
      const d=el('div','dicon');d.style.left=pos.x+'px';d.style.top=pos.y+'px';d.dataset.key=key;
      d.innerHTML=`<div class="di-img">${it.thumb?`<img src="${it.thumb}" alt="">`:icon(it.icon)}</div><div class="di-label">${esc(it.name)}</div>`;
      d.title=it.name;wrap.appendChild(d);it.el=d;this.items.push(it);
      d.addEventListener('click',e=>{if(d._suppressClick){d._suppressClick=false;return}
        e.stopPropagation();this.clickSelect(it,e);this.open(it)});
      d.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
        if(!this.sel.has(key))this.clickSelect(it,{});this.menu(e,it)});
      this._bindDrag(it)};
    if(Settings.get('showSysDesktopIcons')){
      APPS.filter(a=>a.desktop&&!Settings.get('hiddenApps').includes(a.id)).forEach(a=>add({type:'app',id:a.id,name:a.name,icon:a.icon}))}
    let entries=[];try{entries=await FS.readdir('/桌面')}catch{}
    entries.sort((a,b)=>(b.dir-a.dir)||natCmp(a.name,b.name));
    for(const en of entries){const it={type:'file',name:en.name,path:en.path,dir:en.dir,icon:fileIconName(en.name,en.dir),stat:en};
      add(it);
      if(!en.dir&&fileKind(en.name,false)==='image'&&en.size<8*1024*1024){
        FS.readFile(en.path).then(b=>{const u=URL.createObjectURL(b);const img=it.el.querySelector('.di-img');
          img.innerHTML=`<img src="${u}" alt="">`;it._thumbURL=u}).catch(()=>{})}}
    Settings.save();
    this.items.forEach(it=>{if(it._thumbURL){}});
  },
  clickSelect(it,e){const key=this.keyOf(it);
    if(e.ctrlKey||e.metaKey){this.sel.has(key)?this.sel.delete(key):this.sel.add(key)}
    else if(e.shiftKey&&this._lastSel){const ids=this.items.map(i=>this.keyOf(i));
      const a=ids.indexOf(this._lastSel),b=ids.indexOf(key);if(a>=0&&b>=0){this.sel.clear();ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(k=>this.sel.add(k))}}
    else{this.sel.clear();this.sel.add(key)}
    this._lastSel=key;this.paintSel()},
  paintSel(){this.items.forEach(it=>it.el.classList.toggle('selected',this.sel.has(this.keyOf(it))))},
  clearSel(){this.sel.clear();this.paintSel()},
  selectedFiles(){return this.items.filter(it=>it.type==='file'&&this.sel.has(this.keyOf(it)))},
  open(it){if(it.type==='app')launchApp(it.id);else openPath(it.path)},
  savePos(it,x,y){const positions=Settings.get('iconPositions');positions[this.keyOf(it)]={x:Math.round(x),y:Math.round(y)};Settings.save()},
  menu(e,it){const files=this.selectedFiles();const multi=files.length>1;
    const items=it?[
      {label:'打开',icon:'external',action:()=>this.open(it)},
      ...(it.type==='file'&&!it.dir?[{label:'打开方式…',icon:'grid',action:()=>openWithDialog(it.path)}]:[]),
      ...(it.type==='file'?[{label:multi?`导出 ${files.length} 项`:'导出到本机',icon:'download',action:()=>exportPaths(files.map(f=>f.path))},
        {label:'重命名',icon:'rename',disabled:multi,action:async()=>{const n=await uiPrompt('为「'+it.name+'」赐名',it.name,'重命名');
          if(n&&n!==it.name){try{await FS.rename(it.path,pathJoin('/桌面',n));toast('重命名完成','ok')}catch(err){toast(err.message,'error')}}}},
        {label:'删除',icon:'trash',danger:true,action:()=>deletePaths(files.map(f=>f.path))}]:[]),
      '-',
      {label:'刷新桌面',icon:'refresh',action:()=>this.render()},
      {label:'整理图标',icon:'grid',action:()=>{Settings.set('iconPositions',{});this.render()}},
    ]:[
      {label:'新建文件夹',icon:'folder',action:()=>newFolder('/桌面')},
      {label:'新建文本文档',icon:'fileText',action:()=>newTextFile('/桌面')},
      {label:'上传文件',icon:'upload',action:()=>pickFilesTo('/桌面')},
      {label:'粘贴',icon:'paste',disabled:!Clipboard.items.length,action:()=>pasteInto('/桌面')},
      '-',
      {label:'更换壁纸',icon:'image',action:()=>launchApp('settings',{section:'wallpaper'})},
      {label:'显示设置',icon:'gear',action:()=>launchApp('settings')},
      {label:'全屏模式',icon:'fullscreen',action:toggleFullscreen},
      {label:'刷新桌面',icon:'refresh',action:()=>this.render()},
    ];
    Ctx.show(items,e.clientX,e.clientY)},
  _bindDrag(it){const d=it.el;const key=this.keyOf(it);
    /* —— 鼠标：HTML5 原生 DnD（与内部移动统一，绝不混用 pointer 拖拽） —— */
    if(it.type==='file'){d.draggable=true;
      d.addEventListener('pointerenter',()=>DragOut.preload(it.path));
      d.addEventListener('pointerdown',()=>DragOut.preload(it.path));
      d.addEventListener('dragstart',e=>{ // 同步！禁止 await
        if(!this.sel.has(key)){this.sel.clear();this.sel.add(key);this.paintSel()}
        const paths=this.selectedFiles().map(f=>f.path);
        e.dataTransfer.setData('application/x-teyvat',JSON.stringify({paths,from:'/桌面',iconKeys:paths.map(p=>'file:'+pathBase(p))}));
        e.dataTransfer.effectAllowed='copyMove';
        Desktop._dragOrigin={key,x:parseFloat(d.style.left),y:parseFloat(d.style.top)};
        if(paths.length===1)DragOut.attach(e.dataTransfer,paths[0]);
        d.classList.add('dragging');this._dragKeys=[...this.sel]});
      d.addEventListener('dragend',()=>{d.classList.remove('dragging');DragOut.scheduleRevoke();this._dragKeys=null})}
    else{d.draggable=true;
      d.addEventListener('dragstart',e=>{e.dataTransfer.setData('application/x-teyvat',JSON.stringify({appMove:key}));
        d.classList.add('dragging');this._dragKeys=[key]});
      d.addEventListener('dragend',()=>{d.classList.remove('dragging');this._dragKeys=null})}
    /* —— 触摸：touch 事件自由移动 —— */
    let ts=null;
    d.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const p=getClientXY(e);
      ts={x:p.x,y:p.y,ox:parseFloat(d.style.left),oy:parseFloat(d.style.top),moved:false};
      if(it.type==='file')DragOut.preload(it.path)},{passive:true});
    d.addEventListener('touchmove',e=>{if(!ts)return;const p=getClientXY(e);
      const dx=p.x-ts.x,dy=p.y-ts.y;
      if(!ts.moved&&Math.hypot(dx,dy)>10){ts.moved=true;
        if(!this.sel.has(key)){this.sel.clear();this.sel.add(key);this.paintSel()}
        this._dragKeys=[...this.sel];d.classList.add('dragging')}
      if(ts.moved){e.preventDefault();
        const nx=clamp(ts.ox+dx,0,$('#desktop').clientWidth-80),ny=clamp(ts.oy+dy,0,$('#desktop').clientHeight-90);
        d.style.left=nx+'px';d.style.top=ny+'px';
        const target=this.folderAt(p.x,p.y,d);this.items.forEach(i=>i.el.classList.toggle('exp-drop-target',i===target))}},{passive:false});
    d.addEventListener('touchend',e=>{if(!ts)return;const wasMoved=ts.moved;ts=null;
      d.classList.remove('dragging');this.items.forEach(i=>i.el.classList.remove('exp-drop-target'));
      if(wasMoved){d._suppressClick=true;const p=getClientXY(e);
        const target=this.folderAt(p.x,p.y,d);
        if(target&&it.type==='file'){const paths=this.selectedFiles().map(f=>f.path);
          movePaths(paths,target.path).then(()=>this.render())}
        else{const nx=parseFloat(d.style.left),ny=parseFloat(d.style.top);
          const odx=nx-(it._origX??nx),ody=ny-(it._origY??ny);
          this.savePos(it,nx,ny);
          if(this._dragKeys&&this._dragKeys.length>1){this._dragKeys.forEach(k=>{if(k===key)return;
            const o=this.items.find(i=>this.keyOf(i)===k);if(!o)return;
            const opos=Settings.get('iconPositions')[k]||{x:0,y:0};
            const px=clamp(opos.x+odx,0,$('#desktop').clientWidth-80),py=clamp(opos.y+ody,0,$('#desktop').clientHeight-90);
            o.el.style.left=px+'px';o.el.style.top=py+'px';this.savePos(o,px,py)})}}
        this._dragKeys=null}},{passive:true});
    d.addEventListener('touchstart',()=>{it._origX=parseFloat(d.style.left);it._origY=parseFloat(d.style.top)},{passive:true});
  },
  folderAt(x,y,exclude){for(const it of this.items){if(it.el===exclude||!it.dir)continue;
    const r=it.el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return it}return null},
};
Desktop.init=function(){const desk=$('#desktop');
  desk.addEventListener('contextmenu',e=>{if(e.target.closest('.dicon'))return;e.preventDefault();this.clearSel();this.menu(e,null)});
  desk.addEventListener('click',e=>{if(!e.target.closest('.dicon'))this.clearSel()});
  // 内部拖放：图标自由摆放 / 拖入文件夹
  desk.addEventListener('dragover',e=>{const ts=[...e.dataTransfer.types];
    if(ts.includes('application/x-teyvat')||ts.includes('Files')){e.preventDefault();
      e.dataTransfer.dropEffect=ts.includes('Files')?'copy':'move';
      const f=this.folderAt(e.clientX,e.clientY,null);
      this.items.forEach(i=>i.el.classList.toggle('exp-drop-target',i===f&&i.dir))}});
  desk.addEventListener('dragleave',()=>this.items.forEach(i=>i.el.classList.remove('exp-drop-target')));
  desk.addEventListener('drop',async e=>{this.items.forEach(i=>i.el.classList.remove('exp-drop-target'));
    const raw=e.dataTransfer.getData('application/x-teyvat');
    if(!raw)return; // Files 由 bindImportDrop 处理
    e.preventDefault();e.stopPropagation();
    let data;try{data=JSON.parse(raw)}catch{return}
    const rect=desk.getBoundingClientRect();
    const dx0=e.clientX-rect.left,dy0=e.clientY-rect.top;
    if(data.appMove){const it=this.items.find(i=>this.keyOf(i)===data.appMove);
      if(it){const nx=clamp(dx0-44,0,desk.clientWidth-88),ny=clamp(dy0-40,0,desk.clientHeight-96);
        it.el.style.transition='left .18s cubic-bezier(.2,.9,.3,1.1),top .18s cubic-bezier(.2,.9,.3,1.1)';
        it.el.style.left=nx+'px';it.el.style.top=ny+'px';this.savePos(it,nx,ny);
        setTimeout(()=>it.el.style.transition='',200)}return}
    if(data.paths){const target=this.folderAt(e.clientX,e.clientY,null);
      if(target&&target.dir){await movePaths(data.paths,target.path);this.render();return}
      // 自由摆放：主图标落到指针处，其余按位移跟随
      const origin=this._dragOrigin;
      if(origin){const nx=clamp(dx0-44,0,desk.clientWidth-88),ny=clamp(dy0-40,0,desk.clientHeight-96);
        const ddx=nx-origin.x,ddy=ny-origin.y;
        (this._dragKeys||[origin.key]).forEach(k=>{const it=this.items.find(i=>this.keyOf(i)===k);if(!it)return;
          const pos=Settings.get('iconPositions')[k]||{x:0,y:0};
          const px=k===origin.key?nx:clamp(pos.x+ddx,0,desk.clientWidth-88);
          const py=k===origin.key?ny:clamp(pos.y+ddy,0,desk.clientHeight-96);
          it.el.style.transition='left .18s cubic-bezier(.2,.9,.3,1.1),top .18s cubic-bezier(.2,.9,.3,1.1)';
          it.el.style.left=px+'px';it.el.style.top=py+'px';this.savePos(it,px,py);
          setTimeout(()=>it.el.style.transition='',200)})}
      if(data.from&&data.from!=='/桌面'){await movePaths(data.paths,'/桌面');this.render()}}});
  bindImportDrop(desk,()=>'/桌面');
  // 桌面框选
  this.mq=makeMarquee(desk,{box:$('#marquee-desktop'),itemSelector:'.dicon',scrollEl:desk,
    getItems:()=>this.items.map(it=>({id:this.keyOf(it),el:it.el})),
    onSelect:(set,add)=>{if(!add)this.sel.clear();set.forEach(k=>this.sel.add(k));this.paintSel()}});
  Bus.on('fs:change',dir=>{if(dir==='/桌面')this.render()});
  Bus.on('settings:hiddenApps',()=>this.render());
  Bus.on('settings:showSysDesktopIcons',()=>this.render());
};
async function newFolder(dir){const n=await uiPrompt('新文件夹的名称','新建文件夹','新建文件夹');if(!n)return;
  try{await FS.mkdir(await FS.uniquePath(dir,n));toast('文件夹已创建','ok')}catch(e){toast(e.message,'error')}}
async function newTextFile(dir){const n=await uiPrompt('新文档的名称','未命名.txt','新建文本文档');if(!n)return;
  try{const p=await FS.uniquePath(dir,n);await FS.writeFile(p,'');toast('文档已创建','ok');openPath(p)}catch(e){toast(e.message,'error')}}
async function deletePaths(paths){if(!paths.length)return;
  if(Settings.get('confirmDelete')&&!await uiConfirm(`确定将 ${paths.length} 项送入深渊吗？此操作不可撤销。`,'删除确认',true))return;
  for(const p of paths){try{await FS.remove(p)}catch(e){toast('删除失败: '+e.message,'error')}}
  toast(`已删除 ${paths.length} 项`,'ok');Desktop.render()}
async function movePaths(paths,targetDir){let ok=0;
  for(const p of paths){if(pathDir(p)===targetDir||p===targetDir||targetDir.startsWith(p+'/'))continue;
    try{const dst=await FS.uniquePath(targetDir,pathBase(p));await FS.rename(p,dst);ok++}catch(e){toast('移动失败: '+e.message,'error')}}
  if(ok)toast(`已移动 ${ok} 项，修改时间完好保留`,'ok');Bus.emit('fs:change',targetDir)}
async function exportPaths(paths){for(const p of paths){try{const st=await FS.stat(p);
  if(st.dir){toast('文件夹请先压缩为 ZIP 再导出','info');continue}
  const b=await FS.readFile(p);downloadBlob(b,st.name)}catch(e){toast('导出失败: '+e.message,'error')}}}
function toggleFullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen().catch(()=>toast('浏览器拒绝了全屏请求','error'))}

const Clipboard={items:[],cut:false};
async function pasteInto(dir){if(!Clipboard.items.length)return;let n=0;
  for(const src of Clipboard.items){try{const st=await FS.stat(src);const dst=await FS.uniquePath(dir,st.name);
    if(Clipboard.cut){if(pathDir(src)!==dir){await FS.rename(src,dst);n++}}
    else{await FS.copy(src,dst);n++}}catch(e){toast('粘贴失败: '+e.message,'error')}}
  if(Clipboard.cut)Clipboard.items=[];
  if(n)toast(`已粘贴 ${n} 项`,'ok');Bus.emit('fs:change',dir);Desktop.render()}
const DragOut={
  cache:new Map(),
  async preload(path){if(this.cache.has(path))return;try{
    const st=await FS.stat(path);if(st.dir)return;
    const blob=await FS.readFile(path);const file=new File([blob],st.name,{type:blob.type||mimeOf(st.name),lastModified:st.mtime});
    const url=URL.createObjectURL(file);this.cache.set(path,{file,url})}catch{}},
  attach(dt,path){const c=this.cache.get(path);if(!c)return;
    try{dt.items.add(c.file)}catch{}
    dt.setData('DownloadURL',`${c.file.type||'application/octet-stream'}:${c.file.name}:${c.url}`)},
  scheduleRevoke(){setTimeout(()=>{this.cache.forEach(c=>URL.revokeObjectURL(c.url));this.cache.clear()},5000)},
};
/* 外部文件导入：递归遍历 FileSystemEntry，readEntries 循环取尽 */
async function importDataTransfer(dt,targetDir,onProgress){
  const items=[...(dt.items||[])];const entries=[];
  for(const it of items){if(it.kind==='file'){const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(en)entries.push(en)}}
  let count=0;const total={n:0};
  const countEntry=async en=>{total.n++;if(en.isDirectory){const rd=en.createReader();let batch;
    do{batch=await new Promise((res,rej)=>rd.readEntries(res,rej));for(const c of batch)await countEntry(c)}while(batch.length)}};
  for(const en of entries)await countEntry(en);
  const importEntry=async(en,dir)=>{
    if(en.isFile){const file=await new Promise((res,rej)=>en.file(res,rej));
      const buf=await file.arrayBuffer();
      const p=await FS.uniquePath(dir,file.name);
      await FS.writeFile(p,new Blob([buf],{type:file.type||mimeOf(file.name)}),{mtime:file.lastModified||Date.now()});
      count++;onProgress&&onProgress(count,total.n,file.name)}
    else if(en.isDirectory){const sub=await FS.uniquePath(dir,en.name);await FS.mkdir(sub);
      const rd=en.createReader();let batch;
      do{batch=await new Promise((res,rej)=>rd.readEntries(res,rej));
        for(const c of batch)await importEntry(c,sub)}while(batch.length)}};
  if(entries.length){for(const en of entries)await importEntry(en,targetDir)}
  else{const files=[...(dt.files||[])];for(const f of files){const buf=await f.arrayBuffer();
    const p=await FS.uniquePath(targetDir,f.name);
    await FS.writeFile(p,new Blob([buf],{type:f.type||mimeOf(f.name)}),{mtime:f.lastModified||Date.now()});
    count++;onProgress&&onProgress(count,files.length,f.name)}}
  return count}
function bindImportDrop(zone,getDir){
  zone.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';zone.classList.add('exp-drop-target')}});
  zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('exp-drop-target')});
  zone.addEventListener('drop',async e=>{if(![...e.dataTransfer.types].includes('Files'))return;
    e.preventDefault();e.stopPropagation();zone.classList.remove('exp-drop-target');
    const dir=getDir();const t=toast('正在导入文件…','info',60000);
    try{const n=await importDataTransfer(e.dataTransfer,dir,(c,total,name)=>{t.querySelector('div:last-child').textContent=`正在导入 ${c}/${total}：${name}`});
      t.remove();toast(`成功导入 ${n} 个文件`,'ok');Bus.emit('fs:change',dir);Desktop.render()}
    catch(err){t.remove();toast('导入失败: '+err.message,'error')}})}
function pickFilesTo(dir){const inp=$('#hidden-file-input');inp.value='';
  inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;
    const t=toast('正在导入…','info',60000);let n=0;
    try{for(const f of files){const buf=await f.arrayBuffer();const p=await FS.uniquePath(dir,f.name);
      await FS.writeFile(p,new Blob([buf],{type:f.type||mimeOf(f.name)}),{mtime:f.lastModified||Date.now()});n++;
      t.querySelector('div:last-child').textContent=`正在导入 ${n}/${files.length}`}
      t.remove();toast(`已导入 ${n} 个文件`,'ok');Bus.emit('fs:change',dir);Desktop.render()}
    catch(e){t.remove();toast('导入失败: '+e.message,'error')}};
  inp.click()}

function parseDelimited(text,delim){const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=c}
    else if(c==='"')inQ=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r')cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows}

function miniMarkdown(src){
  const blocks=esc(src).split(/\n{2,}/);
  return blocks.map(b=>{
    if(/^```/.test(b))return'<pre style="background:#111;padding:10px;border-radius:6px;overflow:auto">'+b.replace(/^```\w*\n?/,'').replace(/```$/,'')+'</pre>';
    const h=b.match(/^(#{1,6})\s+(.*)/);if(h)return`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    if(/^(-{3,}|\*{3,})$/.test(b.trim()))return'<hr>';
    if(/^&gt;/.test(b))return'<blockquote style="border-left:3px solid #d3bc8e;padding-left:10px;color:#888">'+inline(b.replace(/^&gt;\s?/gm,''))+'</blockquote>';
    if(/^(\s*[-*+]\s+)/.test(b))return'<ul>'+b.split('\n').map(l=>'<li>'+inline(l.replace(/^\s*[-*+]\s+/,''))+'</li>').join('')+'</ul>';
    if(/^\s*\d+\.\s+/.test(b))return'<ol>'+b.split('\n').map(l=>'<li>'+inline(l.replace(/^\s*\d+\.\s+/,''))+'</li>').join('')+'</ol>';
    return'<p>'+inline(b).replace(/\n/g,'<br>')+'</p>'}).join('\n');
  function inline(s){return s.replace(/`([^`]+)`/g,'<code style="background:#222;padding:1px 5px;border-radius:4px">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" style="color:#d3bc8e">$1</a>')}}
function formatCode(text,mode){
  try{
    if(mode==='application/json')return JSON.stringify(JSON.parse(text),null,2);
    if(mode==='css'){let out='',depth=0;
      text.replace(/\s+/g,' ').split(/([{};])/).forEach(tok=>{tok=tok.trim();if(!tok)return;
        if(tok==='{'){out+=' {\n'+'  '.repeat(++depth)}
        else if(tok==='}'){depth=Math.max(0,depth-1);out=out.replace(/\s+$/,'')+'\n'+'  '.repeat(depth)+'}\n'+'  '.repeat(depth)}
        else if(tok===';'){out+=';\n'+'  '.repeat(depth)}
        else out+=tok});
      return out.replace(/\n\s*\n/g,'\n').trim()}
    if(mode==='htmlmixed'||mode==='xml'){
      let t=text.replace(/>\s+</g,'>\n<').split('\n');let depth=0,out=[];
      const voidRe=/^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr|!)/i;
      t.forEach(line=>{line=line.trim();if(!line)return;
        if(/^<\//.test(line))depth=Math.max(0,depth-1);
        out.push('  '.repeat(depth)+line);
        if(/^<[^/!]/.test(line)&&!voidRe.test(line)&&!/<\/[^>]+>\s*$/.test(line)&&!/\/>$/.test(line)&&!/^<[^>]+\/>/.test(line))depth++});
      return out.join('\n')}
    if(mode==='javascript'){let depth=0,out=[];
      text.split('\n').forEach(raw=>{let line=raw.trim();if(!line){out.push('');return}
        const opens=(line.match(/[{[(]/g)||[]).length,closes=(line.match(/[}\])]/g)||[]).length;
        if(/^[}\])]/.test(line))depth=Math.max(0,depth-1);
        out.push('  '.repeat(depth)+line);
        depth=Math.max(0,depth+opens-closes+(/^[}\])]/.test(line)?1:0))});
      return out.join('\n')}
  }catch(e){toast('格式化失败: '+e.message,'error')}
  return text}

function openImageViewer(path){

  const act=a=>win.body.querySelector(`[data-a="${a}"]`);

    win.body.querySelector('.iv-zoom').textContent=Math.round(scale*100)+'%'}

let jszipReady=null;
function ensureJSZip(){if(window.JSZip)return Promise.resolve();

/* JSZip 日期时区处理：3.10.1 读取 DOS 时间后按本地时区构造 Date，
   经实测 round-trip 与原始 mtime 一致（误差仅秒级截断），故直接取 getTime()，
   不再叠加 getTimezoneOffset 偏移（叠加反而会造成 ±8h 偏差）。压缩端用本地 getter 写入，时间完整保留。 */
function fixZipDate(d){return d.getTime()}
async function extractZip(path){await ensureJSZip();
  const buf=await FS.readFile(path);const zip=await JSZip.loadAsync(await buf.arrayBuffer());
  const dir=pathDir(path);const base=pathBase(path).replace(/\.zip$/i,'');
  const outDir=await FS.uniquePath(dir,base);await FS.mkdir(outDir);
  const entries=Object.values(zip.files);let n=0;
  const t=toast(`正在解压 ${entries.length} 项…`,'info',120000);
  for(const en of entries){
    const safe=en.name.replace(/^\/+/,'').split('/').filter(p=>p!=='..').join('/');
    if(!safe)continue;
    const target=pathJoin(outDir,safe);
    if(en.dir){await FS.mkdir(target).catch(()=>{});continue}
    await FS.mkdir(pathDir(target)).catch(()=>{});
    const blob=await en.async('blob');
    const mtime=en.date?fixZipDate(en.date):Date.now();
    await FS.writeFile(target,new Blob([blob],{type:mimeOf(safe)}),{mtime});
    n++;t.querySelector('div:last-child').textContent=`正在解压 ${n}/${entries.length}：${safe}`}
  t.remove();toast(`解压完成：${n} 个文件 → ${outDir}（修改时间已还原）`,'ok',4500);
  Bus.emit('fs:change',dir);Desktop.render()}
async function gunzipBlob(blob){if(!window.DecompressionStream)throw new Error('浏览器不支持原生 gzip 解压');
  const ds=new DecompressionStream('gzip');

async function parseTar(buf,targetDir){const u8=new Uint8Array(buf);let off=0,n=0,longName=null;
  const dec=new TextDecoder();
  const str=(o,l)=>dec.decode(u8.subarray(o,o+l)).replace(/\0.*$/,'').trim();
  const oct=(o,l)=>{const s=str(o,l);return s?parseInt(s,8)||0:0};
  while(off+512<=u8.length){
    const name=str(off,100);if(!name){off+=512;continue}
    const size=oct(off+124,12),type=String.fromCharCode(u8[off+156]),mtime=oct(off+136,12)*1000;
    const prefix=str(off+345,155);
    let full=longName||(prefix?prefix+'/'+name:name);longName=null;
    full=full.replace(/^\/+/,'').split('/').filter(p=>p!=='..').join('/');
    const dataStart=off+512;
    if(type==='L'){longName=dec.decode(u8.subarray(dataStart,dataStart+size)).replace(/\0.*$/,'');off=dataStart+Math.ceil(size/512)*512;continue}
    if(type==='x'||type==='g'||type==='K'){off=dataStart+Math.ceil(size/512)*512;continue}
    if(full){const target=pathJoin(targetDir,full);
      if(type==='5'){await FS.mkdir(target).catch(()=>{})}
      else if(type==='0'||type==='\0'||type==='7'){await FS.mkdir(pathDir(target)).catch(()=>{});
        const data=u8.slice(dataStart,dataStart+size);
        await FS.writeFile(target,new Blob([data],{type:mimeOf(full)}),{mtime:mtime||Date.now()});n++}}

  return n}
async function extract7z(path){

  catch(e){t.remove();toast('7z 解压失败: '+e.message,'error',5000)}}

      else{const outName=name.replace(/\.gz$/i,'')||'解压结果';

      return}
    if(e==='tar'){const blob=await FS.readFile(path);const dir=pathDir(path);

async function compressToZip(paths,dir){if(!paths.length)return;
  try{await ensureJSZip()}catch(e){toast('压缩引擎加载失败（需联网）: '+e.message,'error');return}
  const zip=new JSZip();const t=toast('正在压缩…','info',120000);let n=0;
  const addFile=async(p,rel)=>{const st=await FS.stat(p);const blob=await FS.readFile(p);
    // JSZip 写入 DOS 时间使用本地时间 getter，直接传原始 mtime 即可保留墙钟时间

    t.querySelector('div:last-child').textContent=`正在压缩 ${n}：${rel}`};
  const addDir=async(p,rel)=>{const kids=await FS.readdir(p);
    if(!kids.length)zip.folder(rel);
    for(const k of kids){if(k.dir)await addDir(k.path,rel+'/'+k.name);else await addFile(k.path,rel+'/'+k.name)}};
  try{for(const p of paths){const st=await FS.stat(p);
      if(st.dir)await addDir(p,st.name);else await addFile(p,st.name)}

    const out=await FS.uniquePath(dir,base+'.zip');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    await FS.writeFile(out,blob);t.remove();toast(`压缩完成：${out}`,'ok');Bus.emit('fs:change',dir);Desktop.render()}
  catch(e){t.remove();toast('压缩失败: '+e.message,'error')}}
async function compressToGz(path){if(!window.CompressionStream){toast('浏览器不支持原生 gzip 压缩','error');return}

    await FS.writeFile(p,out,{mtime:st.mtime});toast('GZ 压缩完成：'+p,'ok');Bus.emit('fs:change',pathDir(path))}

function openCalculator(){const win=WM.create({title:'计算器 · 星算仪',icon:'calc',width:320,height:460,appId:'calc',minW:260,minH:360});
  let cur='0',expr='',justEq=false;
  win.body.innerHTML=`<div class="calc-root"><div class="calc-display"><div class="calc-expr"></div><div class="calc-val">0</div></div>
  <div class="calc-keys">
    ${[['C','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['±','fn'],['0',''],['.',''],['=','eq']].map(([k,c])=>`<button class="calc-key ${c}" data-k="${k}">${k}</button>`).join('')}
  </div></div>`;
  const val=win.body.querySelector('.calc-val'),ex=win.body.querySelector('.calc-expr');
  const paint=()=>{val.textContent=cur;ex.textContent=expr;val.style.fontSize=cur.length>12?'22px':'32px'};
  function input(k){
    if(k==='C'){cur='0';expr='';justEq=false}
    else if(k==='⌫'){if(!justEq)cur=cur.length>1?cur.slice(0,-1):'0'}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):cur!=='0'?'-'+cur:cur}
    else if(k==='%'){cur=String(parseFloat(cur)/100)}
    else if(k==='.'){if(justEq){cur='0.';justEq=false}else if(!cur.includes('.'))cur+='.'}
    else if(/[0-9]/.test(k)){if(cur==='0'||justEq){cur=k;justEq=false}else cur+=k}
    else if(['+','−','×','÷'].includes(k)){expr=(justEq?cur:expr+cur)+' '+k+' ';cur='0';justEq=false}
    else if(k==='='){const full=expr+cur;
      try{const js=full.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[^0-9+\-*/.() ]/g,'');
        if(!js.trim())return;const r=Function('"use strict";return('+js+')')();
        if(!isFinite(r))throw 0;cur=String(Math.round(r*1e10)/1e10);expr=full+' =';justEq=true}
      catch{cur='错误';expr='';justEq=true}}
    paint()}
  win.body.querySelectorAll('.calc-key').forEach(b=>b.onclick=()=>input(b.dataset.k));
  win.el.addEventListener('keydown',e=>{const map={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'C'};
    const k=map[e.key]||e.key;if(/^[0-9.+%]$/.test(k)||['×','÷','−','=','⌫','C'].includes(k)){e.preventDefault();input(k)}});
  paint();return win}

let calYear,calMonth;
function drawCalendar(){const pop=$('#calendar-pop');const now=new Date();
  if(calYear==null){calYear=now.getFullYear();calMonth=now.getMonth()}
  const first=new Date(calYear,calMonth,1);const startDow=(first.getDay()+6)%7;
  const days=new Date(calYear,calMonth+1,0).getDate();const prevDays=new Date(calYear,calMonth,0).getDate();
  let cells='';
  for(let i=0;i<42;i++){const dnum=i-startDow+1;let cls='cal-day',label,show;
    if(dnum<1){label=prevDays+dnum;cls+=' dim'}
    else if(dnum>days){label=dnum-days;cls+=' dim'}
    else{label=dnum;if(dnum===now.getDate()&&calMonth===now.getMonth()&&calYear===now.getFullYear())cls+=' today'}
    cells+=`<div class="${cls}">${label}</div>`}
  pop.innerHTML=`<div class="cal-big-clock" id="cal-clock"></div>
  <div class="cal-head"><button data-a="prev">${icon('chevL')}</button>
    <div class="cal-title">${calYear} 年 ${calMonth+1} 月</div>
    <button data-a="next">${icon('chevR')}</button></div>
  <div class="cal-grid">${['一','二','三','四','五','六','日'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  <div style="text-align:center;margin-top:8px"><button class="btn sm" data-a="today">回到今天</button></div>`;
  pop.querySelector('[data-a=prev]').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--}drawCalendar()};
  pop.querySelector('[data-a=next]').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++}drawCalendar()};
  pop.querySelector('[data-a=today]').onclick=()=>{calYear=now.getFullYear();calMonth=now.getMonth();drawCalendar()};
  tickClock()}

async function pickFileFor(kinds,exts,title){
  const all=await FS.search('/','',800).catch(()=>[]);
  const opts=all.filter(e=>!e.dir&&(kinds.includes(fileKind(e.name,false))||(exts&&exts.includes(extOf(e.name)))))
    .slice(0,25).map(e=>({label:`${e.path}（${fmtSize(e.size)}）`,icon:fileIconName(e.name,false),value:e.path}));
  if(!opts.length){toast('文件系统中没有符合条件的文件，请先导入','info');return null}
  return await uiSelect('选择要打开的文件：',opts,title)}

async function seedWelcome(force){
  const flag='teyvat.seeded.v1';
  if(!force&&localStorage.getItem(flag))return;
  try{
    if(!await FS.exists('/桌面/欢迎来到提瓦特.txt'))await FS.writeFile('/桌面/欢迎来到提瓦特.txt',WELCOME_TXT);
    if(!await FS.exists('/图片/璃月暮金.svg'))await FS.writeFile('/图片/璃月暮金.svg',SAMPLE_SVG);
    if(!await FS.exists('/文档/风之翼.html'))await FS.writeFile('/文档/风之翼.html',SAMPLE_HTML);
    if(!await FS.exists('/文档/旅行者名册.csv'))await FS.writeFile('/文档/旅行者名册.csv',SAMPLE_CSV);
    localStorage.setItem(flag,'1');
  }catch(e){console.warn('seed',e)}}
(async function boot(){
  applyTheme();
  try{await FS.init()}catch(e){toast('文件系统初始化失败: '+e.message,'error',8000)}
  await seedWelcome(false);
  buildStartMenu();tickClock();
  Desktop.init();await Desktop.render();
  applyWallpaper();
  if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
  // 全局键盘
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){Ctx.hide();$('#start-menu').classList.add('hidden');$('#calendar-pop').classList.add('hidden')}
    if((e.ctrlKey||e.metaKey)&&e.key==='e'&&!e.target.closest('input,textarea,.CodeMirror')){e.preventDefault();openExplorer('/')}});
  // 阻止浏览器默认的外部文件拖放（避免整页跳转），桌面/管理器内部各自处理
  ['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{
    if([...e.dataTransfer.types].includes('Files')&&!e.defaultPrevented)e.preventDefault()}));
  // 移动端：点击窗口外不关闭，但侧栏点外部收起
  document.addEventListener('click',e=>{if(isMobile()&&!e.target.closest('.exp-side')&&!e.target.closest('[data-a=side]'))
    $$('.exp-side.open').forEach(s=>s.classList.remove('open'))});
})();
