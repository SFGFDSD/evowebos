<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>提瓦特 OS · Teyvat Web OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ CSS_CORE ============ */
:root{
  --gold:#d3bc8e; --gold-hi:#f0dfa8; --gold-dim:#9c8b64;
  --accent:#d3bc8e; --accent-ink:#2b2416;
  --bg0:#0d1120; --bg1:#151b30; --bg2:#1e2540; --bg3:#283052;
  --panel:rgba(21,27,48,.92); --panel-solid:#171d33;
  --glass:rgba(30,37,64,.72);
  --ink:#ece5d8; --ink-dim:#a9a58f; --ink-faint:#6f6d5e;
  --line:rgba(211,188,142,.22); --line-hi:rgba(211,188,142,.5);
  --danger:#e06c5f; --ok:#8fbc7a; --info:#7fa8c9;
  --sel:rgba(211,188,142,.18); --sel-line:rgba(211,188,142,.55);
  --hover:rgba(211,188,142,.09);
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  --radius:10px; --win-radius:var(--radius);
  --tb-h:52px;
  --font-ui:"Noto Sans SC",sans-serif;
  --font-display:"Cinzel","Noto Serif SC",serif;
  --font-serif:"Noto Serif SC",serif;
  --font-mono:"JetBrains Mono",monospace;
  --scroll-thumb:rgba(211,188,142,.3);
}
html[data-theme="light"]{
  --bg0:#e8e0cd; --bg1:#f3ecdb; --bg2:#faf5e8; --bg3:#fffdf5;
  --panel:rgba(247,241,227,.94); --panel-solid:#f5efdf;
  --glass:rgba(250,245,232,.8);
  --ink:#3a3325; --ink-dim:#7a7157; --ink-faint:#a89e82;
  --line:rgba(120,100,55,.28); --line-hi:rgba(120,100,55,.55);
  --gold:#8a6d3b; --gold-hi:#6d5527; --gold-dim:#a08c5e;
  --sel:rgba(138,109,59,.16); --sel-line:rgba(138,109,59,.5);
  --hover:rgba(138,109,59,.08);
  --shadow:0 18px 44px rgba(90,75,40,.25), 0 2px 8px rgba(90,75,40,.15);
  --scroll-thumb:rgba(120,100,55,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font-ui);color:var(--ink);background:var(--bg0);
  font-size:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
input,textarea,[contenteditable],.cm-s-material-darker,.allow-select{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-hi);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
.hidden{display:none!important}
svg{display:block;flex:none}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---- wallpaper ---- */
#wallpaper-layer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:opacity .6s}
#wallpaper-layer::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 120%,transparent 55%,rgba(5,8,18,.35));}
html[data-theme="light"] #wallpaper-layer::after{background:radial-gradient(ellipse at 50% 120%,transparent 60%,rgba(120,100,55,.12))}
.wp-stars{position:absolute;inset:0;pointer-events:none;opacity:.8;
  background-image:
   radial-gradient(1px 1px at 12% 22%,#fff9,transparent),radial-gradient(1.5px 1.5px at 34% 8%,#ffe9b8aa,transparent),
   radial-gradient(1px 1px at 58% 16%,#fff7,transparent),radial-gradient(2px 2px at 73% 30%,#ffe9b866,transparent),
   radial-gradient(1px 1px at 88% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 22% 45%,#fff5,transparent),
   radial-gradient(1px 1px at 45% 38%,#ffe9b855,transparent),radial-gradient(1px 1px at 92% 52%,#fff6,transparent),
   radial-gradient(1.5px 1.5px at 66% 60%,#fff4,transparent),radial-gradient(1px 1px at 8% 70%,#ffe9b844,transparent);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}

/* ---- desktop ---- */
#desktop{position:fixed;inset:0 0 var(--tb-h) 0;z-index:1;outline:none;overflow:hidden}
#desktop-icons{position:absolute;inset:0}
.dicon{position:absolute;width:88px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border-radius:8px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,box-shadow .2s;
  touch-action:none}
.dicon:hover{background:rgba(211,188,142,.1);border-color:rgba(211,188,142,.18)}
.dicon.selected{background:var(--sel);border-color:var(--sel-line)}
.dicon.dragging{opacity:.35}
.dicon .di-img{width:46px;height:46px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.dicon .di-img svg{width:44px;height:44px}
.dicon .di-img img{width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.dicon .di-label{font-size:12px;line-height:1.3;text-align:center;color:#f2ecdd;max-height:2.6em;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
html[data-theme="light"] .dicon .di-label{color:#fff}
.marquee-box{position:absolute;border:1px solid var(--sel-line);background:var(--sel);pointer-events:none;display:none;z-index:50;border-radius:2px}

/* ---- taskbar ---- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:9000;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:linear-gradient(180deg,var(--glass),var(--panel));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line)}
#taskbar::before{content:"";position:absolute;top:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-hi) 30%,var(--line-hi) 70%,transparent)}
.tb-btn{height:40px;min-width:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;
  color:var(--ink);transition:background .15s;position:relative}
.tb-btn:hover{background:var(--hover)}
#start-btn svg{width:26px;height:26px;color:var(--gold)}
#start-btn:hover svg{filter:drop-shadow(0 0 6px rgba(211,188,142,.7))}
#task-items{flex:1;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:100%;align-items:center}
#task-items::-webkit-scrollbar{display:none}
.task-item{height:40px;max-width:180px;min-width:44px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:8px;
  background:var(--hover);border:1px solid transparent;transition:all .15s;position:relative;flex:none}
.task-item .ti-label{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item svg{width:18px;height:18px;color:var(--gold)}
.task-item::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:2.5px;border-radius:2px;background:var(--gold-dim);transition:all .2s}
.task-item.active{background:var(--sel);border-color:var(--line)}
.task-item.active::after{width:22px;background:var(--gold)}
.task-item.minimized::after{width:6px}
#tray{display:flex;align-items:center;gap:2px;height:100%}
.tray-clock{flex-direction:column;gap:0;padding:0 12px;line-height:1.25;align-items:flex-end}
.tray-clock .tc-time{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.tray-clock .tc-date{font-size:10.5px;color:var(--ink-dim)}
#peek-btn{width:8px;height:100%;border-left:1px solid var(--line);border-radius:0}
#peek-btn:hover{background:var(--hover)}

/* ---- start menu ---- */
#start-menu{position:fixed;left:10px;bottom:calc(var(--tb-h) + 10px);width:400px;max-width:calc(100vw - 20px);max-height:min(600px,calc(100vh - var(--tb-h) - 24px));
  z-index:9500;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line-hi);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  animation:menuIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes menuIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.sm-head{padding:16px 18px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.sm-head .sm-title{font-family:var(--font-serif);font-weight:700;font-size:16px;color:var(--gold);letter-spacing:2px}
.sm-head .sm-sub{font-size:11px;color:var(--ink-dim);letter-spacing:1px}
.sm-search{margin:10px 14px 4px;display:flex;align-items:center;gap:8px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sm-search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13px;font-family:inherit}
.sm-apps{flex:1;overflow-y:auto;padding:10px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:10px;transition:background .15s;border:1px solid transparent}
.sm-app:hover{background:var(--hover);border-color:var(--line)}
.sm-app svg{width:30px;height:30px;color:var(--gold)}
.sm-app span{font-size:11.5px;text-align:center;line-height:1.2}
.sm-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sm-foot .sm-user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim)}
.sm-foot button{padding:7px 10px;border-radius:8px;color:var(--ink-dim)}
.sm-foot button:hover{background:var(--hover);color:var(--ink)}

/* ---- context menu ---- */
#ctx-menu{position:fixed;z-index:9800;min-width:200px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line-hi);border-radius:10px;box-shadow:var(--shadow);padding:5px;animation:ctxIn .13s ease-out}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.ctx-item:hover{background:var(--sel)}
.ctx-item svg{width:16px;height:16px;color:var(--gold)}
.ctx-item.danger{color:var(--danger)} .ctx-item.danger svg{color:var(--danger)}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
.ctx-item .ctx-arrow{margin-left:auto;color:var(--ink-faint)}
.ctx-sub{position:relative}

/* ---- windows ---- */
#window-layer{position:fixed;inset:0 0 var(--tb-h) 0;z-index:100;pointer-events:none}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:280px;min-height:180px;
  background:var(--panel-solid);border:1px solid var(--line-hi);border-radius:var(--win-radius);box-shadow:var(--shadow);overflow:hidden;
  animation:winIn .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.window.closing{animation:winOut .16s ease-in forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95) translateY(8px)}}
.window.minimizing{animation:winMin .2s ease-in forwards}
@keyframes winMin{to{opacity:0;transform:scale(.7) translateY(60px)}}
.window.maximized{border-radius:0;border-left:none;border-right:none;border-bottom:none}
.window.snapped{border-radius:0}
.window.focused{border-color:var(--line-hi);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(211,188,142,.12),var(--shadow)}
.window:not(.focused){filter:saturate(.85)}
.window:not(.focused) .win-titlebar{opacity:.75}
.window.peek-hide{opacity:.08;transition:opacity .2s}
.window.peek-outline{opacity:1}
.window.peek-outline>*:not(.win-titlebar){visibility:hidden}
.window.peek-outline{background:transparent;border:1.5px solid var(--line-hi);box-shadow:none}
.win-titlebar{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;cursor:default;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));border-bottom:1px solid var(--line);touch-action:none}
.win-titlebar .wt-icon{width:17px;height:17px;color:var(--gold)}
.win-titlebar .wt-title{flex:1;font-size:12.5px;font-family:var(--font-serif);font-weight:500;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.win-titlebar .wt-title::before{content:"◆ ";color:var(--gold-dim);font-size:8px;vertical-align:1px}
.wt-controls{display:flex;gap:2px}
.wt-btn{width:34px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);transition:all .12s}
.wt-btn:hover{background:var(--hover);color:var(--ink)}
.wt-btn.wt-close:hover{background:var(--danger);color:#fff}
.wt-btn svg{width:14px;height:14px}
.win-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg1)}
.win-resize{position:absolute;z-index:10}
.wr-n{top:-3px;left:8px;right:8px;height:7px;cursor:n-resize}
.wr-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:s-resize}
.wr-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:e-resize}
.wr-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:w-resize}
.wr-ne{top:-3px;right:-3px;width:12px;height:12px;cursor:ne-resize}
.wr-nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nw-resize}
.wr-se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:se-resize}
.wr-sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:sw-resize}
.window.maximized .win-resize,.window.fullscreen-win .win-resize{display:none}
.window.fullscreen-win{border:none;border-radius:0}
.window.fullscreen-win .win-titlebar{display:none}
#snap-preview{position:fixed;z-index:99;pointer-events:none;display:none;border:2px solid var(--gold);border-radius:12px;
  background:rgba(211,188,142,.12);backdrop-filter:blur(2px);transition:all .15s ease-out;box-shadow:0 0 30px rgba(211,188,142,.25) inset}

/* ---- generic UI ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12.5px;
  background:var(--bg2);border:1px solid var(--line);color:var(--ink);transition:all .13s;white-space:nowrap}
.btn:hover{border-color:var(--line-hi);background:var(--bg3)}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--accent-ink);border-color:var(--gold);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:rgba(224,108,95,.4)}
.btn.danger:hover{background:rgba(224,108,95,.12)}
.btn svg{width:15px;height:15px}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;pointer-events:none}
.inp{background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font-size:13px;
  outline:none;font-family:inherit;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--gold-dim)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;flex:none}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.statusbar{flex:none;display:flex;align-items:center;gap:14px;padding:4px 12px;font-size:11px;color:var(--ink-dim);
  border-top:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.spinner.lg{width:34px;height:34px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--bg1);z-index:20;color:var(--ink-dim);font-size:12.5px;letter-spacing:1px}
.loading-cover .rune{width:44px;height:44px;color:var(--gold);animation:runeSpin 2.4s linear infinite}
@keyframes runeSpin{to{transform:rotate(360deg)}}
.empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-faint);pointer-events:none}
.empty-hint svg{width:40px;height:40px;opacity:.5}
.empty-hint span{font-size:12.5px;letter-spacing:1px}

/* ---- dialogs ---- */
#dialog-layer{position:fixed;inset:0;z-index:9900;pointer-events:none}
.dlg-mask{position:absolute;inset:0;background:rgba(5,8,18,.55);backdrop-filter:blur(3px);pointer-events:auto;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dlg{width:400px;max-width:calc(100vw - 32px);background:var(--panel-solid);border:1px solid var(--line-hi);border-radius:14px;
  box-shadow:var(--shadow);padding:20px;animation:menuIn .2s cubic-bezier(.2,.9,.3,1.15);max-height:85vh;overflow-y:auto}
.dlg h3{font-family:var(--font-serif);font-size:15px;color:var(--gold);margin-bottom:12px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.dlg h3 svg{width:18px;height:18px}
.dlg .dlg-msg{font-size:13px;color:var(--ink-dim);line-height:1.6;margin-bottom:14px;word-break:break-all}
.dlg .dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .inp{margin-top:4px}

/* ---- toast ---- */
#toast-layer{position:fixed;top:14px;right:14px;z-index:9950;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(360px,90vw)}
.toast{pointer-events:auto;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line-hi);border-left:3px solid var(--gold);
  border-radius:10px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2);line-height:1.5}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast svg{width:16px;height:16px;color:var(--gold);margin-top:1px}
.toast.error{border-left-color:var(--danger)} .toast.error svg{color:var(--danger)}
.toast.ok{border-left-color:var(--ok)} .toast.ok svg{color:var(--ok)}

/* ---- calendar popover ---- */
#calendar-pop{position:fixed;right:10px;bottom:calc(var(--tb-h) + 10px);z-index:9500;width:290px;background:var(--panel);
  backdrop-filter:blur(20px);border:1px solid var(--line-hi);border-radius:14px;box-shadow:var(--shadow);padding:14px;animation:menuIn .2s}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .cal-title{font-family:var(--font-serif);font-weight:700;color:var(--gold);font-size:14px;letter-spacing:1px}
.cal-head button{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim)}
.cal-head button:hover{background:var(--hover);color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .cal-dow{font-size:10.5px;color:var(--ink-faint);padding:4px 0}
.cal-grid .cal-day{font-size:12px;padding:6px 0;border-radius:7px;cursor:default;font-variant-numeric:tabular-nums}
.cal-grid .cal-day.dim{color:var(--ink-faint)}
.cal-grid .cal-day.today{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--accent-ink);font-weight:700}
.cal-big-clock{text-align:center;font-size:26px;font-family:var(--font-display);color:var(--ink);padding:4px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:2px}

/* ============ CSS_APPS ============ */
/* ---- explorer ---- */
.exp-root{flex:1;display:flex;flex-direction:column;overflow:hidden}
.exp-main{flex:1;display:flex;overflow:hidden}
.exp-side{width:190px;flex:none;border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:8px 6px;font-size:12.5px}
.side-sec{font-size:10.5px;color:var(--ink-faint);letter-spacing:2px;padding:8px 10px 4px;font-family:var(--font-serif)}
.side-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink-dim);white-space:nowrap;overflow:hidden}
.side-item:hover{background:var(--hover);color:var(--ink)}
.side-item.active{background:var(--sel);color:var(--gold)}
.side-item svg{width:15px;height:15px;flex:none}
.side-item .si-label{overflow:hidden;text-overflow:ellipsis}
.side-tree-node{margin-left:0}
.side-tree-children{margin-left:14px;border-left:1px solid var(--line);padding-left:2px}
.side-twisty{width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);flex:none;transition:transform .15s}
.side-twisty.open{transform:rotate(90deg)}
.side-twisty.leaf{visibility:hidden}
.exp-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.exp-crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;overflow-x:auto;scrollbar-width:none;background:var(--bg0);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}
.exp-crumbs::-webkit-scrollbar{display:none}
.crumb{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;color:var(--ink-dim)}
.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb:last-child{color:var(--gold);font-weight:500}
.crumb-sep{color:var(--ink-faint);font-size:10px}
.exp-search{width:170px;flex:none;display:flex;align-items:center;gap:6px;background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.exp-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:12px;font-family:inherit}
.exp-search svg{width:14px;height:14px;color:var(--ink-faint)}
.exp-listwrap{flex:1;position:relative;overflow:auto;background:var(--bg1)}
.exp-list{position:relative;min-width:100%;min-height:100%}
/* details view */
.exp-cols-head{position:sticky;top:0;z-index:5;display:flex;background:var(--bg2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-dim);width:max-content;min-width:100%}
.exp-col-h{position:relative;padding:7px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;flex:none;overflow:hidden;white-space:nowrap}
.exp-col-h:hover{color:var(--ink)}
.exp-col-h .sort-arrow{font-size:9px;color:var(--gold)}
.exp-col-resizer{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6}
.exp-col-resizer:hover::after{content:"";position:absolute;left:3px;top:15%;bottom:15%;width:1.5px;background:var(--gold)}
.exp-row{display:flex;width:max-content;min-width:0;font-size:12.5px;cursor:pointer;border-radius:0;height:30px;align-items:center}
.exp-row:hover .exp-cell{background:var(--hover)}
.exp-row.selected .exp-cell{background:var(--sel)}
.exp-row.cut{opacity:.45}
.exp-cell{padding:0 10px;flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:100%;display:flex;align-items:center;gap:7px}
.exp-cell svg{width:16px;height:16px;color:var(--gold);flex:none}
.exp-cell img.thumb{width:20px;height:20px;object-fit:cover;border-radius:3px;flex:none}
.exp-cell.c-size,.exp-cell.c-mtime{color:var(--ink-dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.exp-cell .cell-txt{overflow:hidden;text-overflow:ellipsis}
/* icon view */
.exp-grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:12px;position:relative;min-height:100%;min-width:100%;width:max-content}
.exp-gitem{width:96px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.exp-gitem:hover{background:var(--hover)}
.exp-gitem.selected{background:var(--sel);border-color:var(--sel-line)}
.exp-gitem.cut{opacity:.45}
.exp-gitem .gi-img{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.exp-gitem .gi-img svg{width:42px;height:42px;color:var(--gold)}
.exp-gitem .gi-img img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.exp-gitem .gi-label{font-size:11.5px;text-align:center;line-height:1.3;max-height:2.6em;overflow:hidden;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* column (miller) view */
.exp-miller{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.exp-miller-col{width:210px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:5px}
.exp-miller-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.exp-miller-item:hover{background:var(--hover)}
.exp-miller-item.selected{background:var(--sel);color:var(--gold)}
.exp-miller-item svg{width:15px;height:15px;color:var(--gold);flex:none}
.exp-miller-item .mi-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.exp-miller-item .mi-arrow{color:var(--ink-faint);font-size:10px}
.exp-drop-target{outline:2px dashed var(--gold);outline-offset:-2px;background:var(--sel)!important}

/* ---- notepad / editor shared ---- */
.np-area{flex:1;width:100%;resize:none;background:var(--bg1);color:var(--ink);border:none;outline:none;padding:14px 16px;
  font-family:var(--font-mono);font-size:14px;line-height:1.7;tab-size:4}
/* ---- code editor ---- */
.ce-root{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ce-split{flex:1;display:flex;overflow:hidden;position:relative}
.ce-split.vertical{flex-direction:column}
.ce-pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ce-divider{flex:none;width:6px;cursor:col-resize;background:var(--bg2);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;z-index:5;touch-action:none}
.ce-split.vertical .ce-divider{width:auto;height:6px;cursor:row-resize;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ce-divider:hover,.ce-divider.drag{background:var(--gold-dim)}
.ce-preview-wrap{flex:1;position:relative;background:#0b0e1a}
.ce-preview-wrap iframe{width:100%;height:100%;border:none;background:#fff;position:relative;z-index:1}
.ce-preview-mask{position:absolute;inset:0;z-index:2;background:var(--bg0);display:flex;align-items:center;justify-content:center;transition:opacity .3s;pointer-events:none}
.ce-preview-mask.off{opacity:0}
.CodeMirror{height:100%!important;font-family:var(--font-mono)!important;font-size:13.5px;line-height:1.6}
.ce-fallback{flex:1;width:100%;resize:none;background:#212121;color:#eeffff;border:none;outline:none;padding:12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.6}
.ce-findbar{display:flex;gap:6px;padding:7px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.ce-findbar .inp{width:150px;padding:5px 9px;font-size:12px}

/* ---- image viewer ---- */
.iv-root{flex:1;display:flex;flex-direction:column;background:#0a0c16;overflow:hidden}
.iv-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.iv-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .12s ease-out;pointer-events:none}
.iv-stage img.free{position:absolute;max-width:none;max-height:none;transition:none}
.iv-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:10px;background:rgba(20,25,45,.6);
  color:var(--gold);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:5}
.iv-stage:hover .iv-nav{opacity:1}
.iv-nav:hover{background:rgba(211,188,142,.25)}
.iv-nav.prev{left:10px}.iv-nav.next{right:10px}

/* ---- manga viewer ---- */
.mg-root{flex:1;position:relative;background:#000;overflow:hidden;display:flex;flex-direction:column}
.mg-scroll{flex:1;overflow-y:auto;overflow-x:hidden;background:#000;overscroll-behavior-y:none;touch-action:pan-y;
  contain:layout style;-webkit-overflow-scrolling:touch;position:relative}
.mg-scroll img{display:block;width:min(100%,860px);margin:0 auto;height:auto}
.mg-page-skel{width:min(100%,860px);margin:0 auto;background:#0d0d0d;display:flex;align-items:center;justify-content:center;color:#444;font-size:12px}
.mg-exit-fs{position:fixed;top:10px;right:10px;z-index:9999;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);
  color:#fff9;display:none;align-items:center;justify-content:center;border:1px solid #ffffff33}
.mg-exit-fs:hover{background:rgba(0,0,0,.75);color:#fff}
.window.mg-fullscreen .mg-exit-fs{display:flex}
.window.mg-fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:9998!important;border:none;border-radius:0}
.window.mg-fullscreen .win-titlebar,.window.mg-fullscreen .mg-toolbar{display:none}
.mg-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#ffffff14;z-index:6;pointer-events:none}
.mg-progress .bar{height:100%;background:var(--gold);width:0;transition:width .1s}

/* ---- media player ---- */
.mp-root{flex:1;display:flex;flex-direction:column;background:#0a0c16;align-items:center;justify-content:center;gap:18px;padding:20px;overflow:hidden}
.mp-root video{max-width:100%;max-height:100%;flex:1;min-height:0;border-radius:8px;background:#000;outline:none}
.mp-audio-art{width:150px;height:150px;border-radius:50%;border:2px solid var(--line-hi);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,var(--bg3),var(--bg0));animation:runeSpin 14s linear infinite;animation-play-state:paused}
.mp-audio-art.playing{animation-play-state:running}
.mp-audio-art svg{width:60px;height:60px;color:var(--gold)}
.mp-title{font-family:var(--font-serif);font-size:15px;color:var(--gold);text-align:center;word-break:break-all}
.mp-controls{width:min(560px,100%);display:flex;flex-direction:column;gap:8px}
.mp-seek{width:100%;accent-color:var(--gold);height:4px;cursor:pointer}
.mp-row{display:flex;align-items:center;gap:12px;justify-content:center}
.mp-time{font-size:11.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.mp-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--bg2);border:1px solid var(--line)}
.mp-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.mp-btn.main{width:52px;height:52px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--accent-ink);border:none}
.mp-vol{width:90px;accent-color:var(--gold)}

/* ---- browser ---- */
.br-root{flex:1;display:flex;flex-direction:column}
.br-frame-wrap{flex:1;position:relative;background:var(--bg0)}
.br-frame-wrap iframe{width:100%;height:100%;border:none;background:#fff}
.br-addr{flex:1;min-width:100px;display:flex;align-items:center;gap:7px;background:var(--bg0);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.br-addr input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:12.5px;font-family:inherit}
.br-home{flex:1;overflow-y:auto;padding:34px 22px;display:flex;flex-direction:column;align-items:center;gap:22px}
.br-home h2{font-family:var(--font-display);color:var(--gold);letter-spacing:4px;font-size:20px}
.br-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:min(560px,100%)}
.br-link{padding:16px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;text-align:center;font-size:12.5px;cursor:pointer;transition:all .15s}
.br-link:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.br-link svg{width:24px;height:24px;margin:0 auto 8px;color:var(--gold)}

/* ---- calculator ---- */
.calc-root{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px;background:var(--bg1)}
.calc-display{background:var(--bg0);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:right}
.calc-expr{font-size:12px;color:var(--ink-faint);min-height:17px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.calc-val{font-size:32px;font-family:var(--font-display);color:var(--ink);overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:1px}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-key{border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:17px;font-family:var(--font-display);transition:all .1s;color:var(--ink)}
.calc-key:hover{border-color:var(--gold-dim)}
.calc-key:active{transform:scale(.95)}
.calc-key.op{color:var(--gold)}
.calc-key.eq{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--accent-ink);border:none;font-weight:700}
.calc-key.fn{color:var(--ink-dim);font-size:14px}

/* ---- paint ---- */
.pt-root{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pt-canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg0);display:flex;align-items:center;justify-content:center}
.pt-canvas-wrap canvas{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4);touch-action:none;cursor:crosshair}
.pt-color{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none;padding:0}
.pt-color.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--sel)}

/* ---- terminal ---- */
.term-root{flex:1;background:#0b0e1a;color:#d8e0c8;font-family:var(--font-mono);font-size:13px;padding:12px;overflow-y:auto;line-height:1.65;cursor:text}
.term-root .t-line{white-space:pre-wrap;word-break:break-all}
.term-root .t-prompt{color:var(--gold)}
.term-root .t-err{color:var(--danger)}
.term-root .t-dim{color:#7a8266}
.term-input-line{display:flex;gap:0}
.term-input{flex:1;background:none;border:none;outline:none;color:inherit;font:inherit;padding:0}

/* ---- sheets ---- */
.sh-root{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sh-table-wrap{flex:1;overflow:auto;position:relative}
.sh-table{border-collapse:collapse;font-size:12.5px;font-family:var(--font-mono)}
.sh-table td,.sh-table th{border:1px solid var(--line);padding:5px 10px;min-width:70px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-table th{background:var(--bg2);color:var(--gold);position:sticky;top:0;z-index:2;font-weight:500}
.sh-table td:first-child{background:var(--bg2);color:var(--ink-faint);text-align:center;position:sticky;left:0}
.sh-table tr:hover td{background:var(--hover)}

/* ---- settings ---- */
.set-root{flex:1;display:flex;overflow:hidden}
.set-nav{width:170px;flex:none;border-right:1px solid var(--line);background:var(--bg2);padding:10px 7px;overflow-y:auto}
.set-nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;margin-bottom:2px}
.set-nav-item:hover{background:var(--hover);color:var(--ink)}
.set-nav-item.active{background:var(--sel);color:var(--gold)}
.set-nav-item svg{width:16px;height:16px}
.set-body{flex:1;overflow-y:auto;padding:20px 24px}
.set-body h2{font-family:var(--font-serif);color:var(--gold);font-size:17px;letter-spacing:2px;margin-bottom:4px}
.set-body .set-desc{font-size:12px;color:var(--ink-faint);margin-bottom:18px}
.set-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .sr-label{font-size:13px}
.set-row .sr-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;line-height:1.4}
.set-row .sr-ctrl{flex:none;display:flex;align-items:center;gap:8px}
.set-row select.inp{width:auto;min-width:120px;padding:6px 30px 6px 10px;font-size:12px}
.switch{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .sw-track{position:absolute;inset:0;background:var(--bg0);border:1px solid var(--line);border-radius:99px;transition:all .2s}
.switch .sw-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink-dim);transition:all .2s}
.switch input:checked~.sw-track{background:var(--gold);border-color:var(--gold)}
.switch input:checked~.sw-thumb{left:21px;background:var(--accent-ink)}
input[type=range].range{accent-color:var(--gold);width:130px}
.wp-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.wp-thumb{aspect-ratio:16/10;border-radius:9px;border:2px solid var(--line);cursor:pointer;background-size:cover;background-position:center;transition:all .15s;position:relative;overflow:hidden}
.wp-thumb:hover{transform:translateY(-2px)}
.wp-thumb.active{border-color:var(--gold);box-shadow:0 0 12px rgba(211,188,142,.35)}
.wp-thumb .wp-name{position:absolute;bottom:0;left:0;right:0;font-size:10px;padding:3px 6px;background:rgba(0,0,0,.5);color:#fff}
.storage-bar{height:16px;border-radius:99px;background:var(--bg0);border:1px solid var(--line);overflow:hidden;display:flex;margin:10px 0 6px}
.storage-bar>div{height:100%;transition:width .5s}
.storage-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-dim)}
.storage-legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.accent-swatches{display:flex;gap:8px;flex-wrap:wrap}
.accent-sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.accent-sw.active{border-color:var(--ink);transform:scale(1.12)}
.v86-screen{flex:1;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.v86-screen>div{white-space:pre;font:14px monospace;line-height:14px;color:#aaa}
.v86-screen canvas{max-width:100%;max-height:100%}

/* ============ CSS_RESPONSIVE ============ */
@media (max-width:760px){
  :root{--tb-h:60px}
  body{font-size:13.5px}
  #taskbar{padding:0 6px;gap:4px}
  .task-item{max-width:52px;padding:0 8px}
  .task-item .ti-label{display:none}
  .tray-clock{padding:0 8px}
  .tray-clock .tc-date{display:none}
  #start-menu{left:8px;right:8px;width:auto;bottom:calc(var(--tb-h) + 8px)}
  .sm-apps{grid-template-columns:repeat(4,1fr)}
  .window{border-radius:0!important}
  .window.mobile-full{left:0!important;top:0!important;width:100%!important;height:100%!important}
  .win-resize{display:none}
  .win-titlebar{height:44px}
  .wt-btn{width:40px;height:34px}
  .exp-side{position:absolute;left:0;top:0;bottom:0;z-index:30;width:220px;box-shadow:8px 0 30px rgba(0,0,0,.4);transform:translateX(-105%);transition:transform .22s}
  .exp-side.open{transform:none}
  .exp-search{width:110px}
  .set-nav{width:52px;padding:8px 5px}
  .set-nav-item{justify-content:center;padding:10px 0}
  .set-nav-item span{display:none}
  .set-body{padding:14px}
  .dicon{width:80px}
  .toolbar{padding:6px 8px;gap:5px}
  .toolbar .btn{padding:6px 9px;font-size:11.5px}
  .toolbar .btn .btn-txt{display:none}
  .toolbar .btn.keep-txt .btn-txt{display:inline}
  .ce-split{flex-direction:column}
  .ce-divider{width:auto;height:8px;cursor:row-resize}
  .dlg{padding:16px}
  #calendar-pop{right:8px}
}
@media (max-width:760px) and (orientation:landscape){
  :root{--tb-h:48px}
}
@media (hover:none){
  .iv-nav{opacity:.7}
}
</style>
</head>
<body>
<div id="wallpaper-layer"></div>
<div id="desktop" tabindex="0">
  <div id="desktop-icons"></div>
  <div id="marquee-desktop" class="marquee-box"></div>
</div>
<div id="snap-preview"></div>
<div id="window-layer"></div>
<div id="taskbar">
  <button id="start-btn" class="tb-btn" title="开始 · 七天神像"></button>
  <div id="task-items"></div>
  <div id="tray">
    <button id="tray-clock" class="tb-btn tray-clock" title="日历"></button>
    <button id="peek-btn" title="显示桌面 (Aero Peek)"></button>
  </div>
</div>
<div id="start-menu" class="hidden"></div>

function shadeColor(hex,pct){const n=parseInt(hex.slice(1),16);let r=(n>>16)+pct,g=((n>>8)&255)+pct,b=(n&255)+pct;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
/* ============ JS_FS ============ */
/* 统一虚拟文件系统：OPFS 主后端 + IndexedDB 备用后端 + File System Access 本地挂载。
   所有后端实现同一接口；元数据(修改时间等)存于 IndexedDB meta 库，保证移动/重命名不丢失时间。 */
const MetaDB=(()=>{
  let dbp=null;
  function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{
    const rq=indexedDB.open('teyvat-fs',2);
    rq.onupgradeneeded=e=>{const db=rq.result;
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'path'});
      if(!db.objectStoreNames.contains('files')){const s=db.createObjectStore('files',{keyPath:'path'});s.createIndex('parent','parent',{unique:false})}
      if(!db.objectStoreNames.contains('mounts'))db.createObjectStore('mounts',{keyPath:'name'});
    };
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
  });return dbp}
  async function tx(store,mode,fn){const db=await open();return new Promise((res,rej)=>{
    const t=db.transaction(store,mode);const s=t.objectStore(store);let out;
    const r=fn(s);if(r&&r.onsuccess!==undefined)r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('tx abort'));
  })}
  return{
    open,
    getMeta:p=>tx('meta','readonly',s=>s.get(p)),
    setMeta:(p,m)=>tx('meta','readwrite',s=>s.put({path:p,...m})),
    delMeta:p=>tx('meta','readwrite',s=>s.delete(p)),
    allMeta:()=>tx('meta','readonly',s=>s.getAll()),
    async delMetaTree(prefix){const all=await this.allMeta();const keys=all.filter(m=>m.path===prefix||m.path.startsWith(prefix+'/')).map(m=>m.path);
      if(!keys.length)return;await tx('meta','readwrite',s=>{keys.forEach(k=>s.delete(k))})},
    async moveMetaTree(from,to){const all=await this.allMeta();const hits=all.filter(m=>m.path===from||m.path.startsWith(from+'/'));
      if(!hits.length)return;await tx('meta','readwrite',s=>{hits.forEach(m=>{s.delete(m.path);s.put({...m,path:to+m.path.slice(from.length)})})})},
    // idb files store
    idbGet:p=>tx('files','readonly',s=>s.get(p)),
    idbPut:rec=>tx('files','readwrite',s=>s.put(rec)),
    idbDel:p=>tx('files','readwrite',s=>s.delete(p)),
    idbChildren:parent=>tx('files','readonly',s=>s.index('parent').getAll(parent)),
    idbAll:()=>tx('files','readonly',s=>s.getAll()),
    async idbDelTree(prefix){const all=await this.idbAll();const keys=all.filter(r=>r.path===prefix||r.path.startsWith(prefix+'/')).map(r=>r.path);
      if(keys.length)await tx('files','readwrite',s=>{keys.forEach(k=>s.delete(k))})},
    // mounts
    mountPut:(name,handle)=>tx('mounts','readwrite',s=>s.put({name,handle})),
    mountDel:name=>tx('mounts','readwrite',s=>s.delete(name)),
    mountAll:()=>tx('mounts','readonly',s=>s.getAll()),
  };
})();

/* ---- OPFS 后端 ---- */
const OPFSBackend={
  name:'opfs', root:null, available:false, mk(p){return 'opfs:'+p},
  async init(){try{if(!navigator.storage?.getDirectory)throw 0;this.root=await navigator.storage.getDirectory();this.available=true}catch{this.available=false}},
  async _dir(path,create=false){let d=this.root;const parts=path.split('/').filter(Boolean);
    for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d},
  async _parent(path){return this._dir(pathDir(path),true)},
  async stat(path){
    if(path==='/'){const m=await MetaDB.getMeta(this.mk('/'));return{path,name:'/',dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now()}}
    const name=pathBase(path);let h;
    try{const pd=await this._dir(pathDir(path));h=await pd.getFileHandle(name).catch(()=>pd.getDirectoryHandle(name))}catch{throw new Error('ENOENT: '+path)}
    const m=await MetaDB.getMeta(this.mk(path));
    if(h.kind==='directory')return{path,name,dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now()};
    const f=await h.getFile();return{path,name,dir:false,size:f.size,mtime:m?.mtime??f.lastModified,ctime:m?.ctime??f.lastModified}},
  async exists(path){try{await this.stat(path);return true}catch{return false}},
  async readdir(path){const d=await this._dir(path);const out=[];
    for await(const h of d.values()){const cp=pathJoin(path,h.name);const m=await MetaDB.getMeta(this.mk(cp));
      if(h.kind==='directory')out.push({path:cp,name:h.name,dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now()});
      else{const f=await h.getFile();out.push({path:cp,name:h.name,dir:false,size:f.size,mtime:m?.mtime??f.lastModified,ctime:m?.ctime??f.lastModified})}}
    return out},
  async readFile(path){const pd=await this._dir(pathDir(path));const h=await pd.getFileHandle(pathBase(path));return await h.getFile()},
  async writeFile(path,data,opts={}){const pd=await this._parent(path);const h=await pd.getFileHandle(pathBase(path),{create:true});
    const w=await h.createWritable();const blob=data instanceof Blob?data:new Blob([data]);await w.write(blob);await w.close();
    const now=Date.now();const old=await MetaDB.getMeta(this.mk(path));
    await MetaDB.setMeta(this.mk(path),{mtime:opts.mtime||now,ctime:old?.ctime||now,size:blob.size});return blob.size},
  async mkdir(path){await this._dir(path,true);const now=Date.now();const old=await MetaDB.getMeta(this.mk(path));
    if(!old)await MetaDB.setMeta(this.mk(path),{mtime:now,ctime:now})},
  async remove(path){if(path==='/'){for await(const h of this.root.values())await this.root.removeEntry(h.name,{recursive:true});await MetaDB.delMetaTree(this.mk('/'));return}
    const pd=await this._dir(pathDir(path));await pd.removeEntry(pathBase(path),{recursive:true});await MetaDB.delMetaTree(this.mk(path))},
  async rename(from,to){const st=await this.stat(from);const pd=await this._dir(pathDir(from));
    const h=st.dir?await pd.getDirectoryHandle(pathBase(from)):await pd.getFileHandle(pathBase(from));
    if(typeof h.move==='function'){try{const td=await this._dir(pathDir(to),true);await h.move(td,pathBase(to));await MetaDB.moveMetaTree(this.mk(from),this.mk(to));return}catch{}}
    await FS._copyAcross(this,from,this,to,st);await this.remove(from);await MetaDB.moveMetaTree(this.mk(from),this.mk(to))},
};

/* ---- IndexedDB 后端 ---- */
const IDBBackend={
  name:'idb', available:true,
  async init(){await MetaDB.open();if(!await MetaDB.idbGet('/'))await MetaDB.idbPut({path:'/',parent:null,dir:true,mtime:Date.now(),ctime:Date.now()})},
  async stat(path){const r=await MetaDB.idbGet(path);if(!r)throw new Error('ENOENT: '+path);
    return{path,name:pathBase(path),dir:!!r.dir,size:r.dir?0:(r.data?.size||0),mtime:r.mtime,ctime:r.ctime}},
  async exists(path){return!!(await MetaDB.idbGet(path))},
  async readdir(path){const rs=await MetaDB.idbChildren(path);
    return rs.map(r=>({path:r.path,name:pathBase(r.path),dir:!!r.dir,size:r.dir?0:(r.data?.size||0),mtime:r.mtime,ctime:r.ctime}))},
  async readFile(path){const r=await MetaDB.idbGet(path);if(!r||r.dir)throw new Error('ENOENT: '+path);return r.data},
  async writeFile(path,data,opts={}){const blob=data instanceof Blob?data:new Blob([data]);
    const parent=pathDir(path);if(!await MetaDB.idbGet(parent))await this.mkdir(parent);
    const old=await MetaDB.idbGet(path);const now=Date.now();
    await MetaDB.idbPut({path,parent,dir:false,data:blob,mtime:opts.mtime||now,ctime:old?.ctime||now});return blob.size},
  async mkdir(path){const parts=path.split('/').filter(Boolean);let cur='';
    for(const p of parts){cur+='/'+p;if(!await MetaDB.idbGet(cur)){const now=Date.now();
      await MetaDB.idbPut({path:cur,parent:pathDir(cur),dir:true,mtime:now,ctime:now})}}},
  async remove(path){if(path==='/'){const all=await MetaDB.idbAll();for(const r of all)if(r.path!=='/')await MetaDB.idbDel(r.path);return}
    await MetaDB.idbDelTree(path)},
  async rename(from,to){const st=await this.stat(from);await FS._copyAcross(this,from,this,to,st);await this.remove(from)},
};
/* ---- File System Access 本地挂载后端（与 VFS 完全同构，无 isLocal 分支） ---- */
function makeFSABackend(label,rootHandle){
  const ns='local:'+label+':';const mk=p=>ns+p;
  return{
    name:'local:'+label, label, rootHandle, available:true,
    async init(){},
    async _dir(rel,create=false){let d=rootHandle;for(const p of rel.split('/').filter(Boolean))d=await d.getDirectoryHandle(p,{create});return d},
    async _handle(rel){if(rel==='/')return rootHandle;const pd=await this._dir(pathDir(rel));const n=pathBase(rel);
      try{return await pd.getFileHandle(n)}catch{return await pd.getDirectoryHandle(n)}},
    async stat(rel){let h;try{h=await this._handle(rel)}catch{throw new Error('ENOENT: '+rel)}
      const m=await MetaDB.getMeta(mk(rel));
      if(h.kind==='directory')return{path:rel,name:pathBase(rel),dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now()};
      const f=await h.getFile();return{path:rel,name:h.name,dir:false,size:f.size,mtime:m?.mtime??f.lastModified,ctime:m?.ctime??f.lastModified}},
    async exists(rel){try{await this._handle(rel);return true}catch{return false}},
    async readdir(rel){const d=await this._dir(rel);const out=[];
      for await(const h of d.values()){const cp=pathJoin(rel,h.name);const m=await MetaDB.getMeta(mk(cp));
        if(h.kind==='directory')out.push({path:cp,name:h.name,dir:true,size:0,mtime:m?.mtime||Date.now(),ctime:m?.ctime||Date.now()});
        else{const f=await h.getFile();out.push({path:cp,name:h.name,dir:false,size:f.size,mtime:m?.mtime??f.lastModified,ctime:m?.ctime??f.lastModified})}}
      return out},
    async readFile(rel){const pd=await this._dir(pathDir(rel));const h=await pd.getFileHandle(pathBase(rel));return await h.getFile()},
    async writeFile(rel,data,opts={}){const pd=await this._dir(pathDir(rel),true);const h=await pd.getFileHandle(pathBase(rel),{create:true});
      const w=await h.createWritable();const blob=data instanceof Blob?data:new Blob([data]);await w.write(blob);await w.close();
      const now=Date.now();const old=await MetaDB.getMeta(mk(rel));
      await MetaDB.setMeta(mk(rel),{mtime:opts.mtime||now,ctime:old?.ctime||now,size:blob.size});return blob.size},
    async mkdir(rel){await this._dir(rel,true);const old=await MetaDB.getMeta(mk(rel));const now=Date.now();
      if(!old)await MetaDB.setMeta(mk(rel),{mtime:now,ctime:now})},
    async remove(rel){if(rel==='/'){for await(const h of rootHandle.values())await rootHandle.removeEntry(h.name,{recursive:true});await MetaDB.delMetaTree(ns);return}
      const pd=await this._dir(pathDir(rel));await pd.removeEntry(pathBase(rel),{recursive:true});await MetaDB.delMetaTree(mk(rel))},
    async rename(from,to){const st=await this.stat(from);const h=await this._handle(from);
      if(typeof h.move==='function'){try{const td=await this._dir(pathDir(to),true);await h.move(td,pathBase(to));await MetaDB.moveMetaTree(mk(from),mk(to));return}catch{}}
      await FS._copyAcross(this,from,this,to,st);await this.remove(from);await MetaDB.moveMetaTree(mk(from),mk(to))},
  };
}

/* ---- FS 路由与公共 API ---- */
const FS={
  mounts:[], // {prefix, backend}
  primary:null, duCache:new Map(), pendingMounts:[],
  async init(){
    await OPFSBackend.init();await IDBBackend.init();
    let primaryName=Settings.get('fsBackend');
    if(primaryName==='opfs'&&!OPFSBackend.available){primaryName='idb';setTimeout(()=>toast('当前浏览器不支持 OPFS，已降级至 IndexedDB 存储','error'),1200)}
    this.primary=primaryName==='opfs'?OPFSBackend:IDBBackend;
    this.mounts=[{prefix:'/',backend:this.primary}];
    if(Settings.get('showBothBackends')){
      const other=this.primary===OPFSBackend?IDBBackend:OPFSBackend;
      if(other.available)this.mounts.push({prefix:'/mnt/'+other.name,backend:other});
    }
    await this.ensureDirs();
    await this.restoreMounts();
  },
  async ensureDirs(){for(const d of ['/桌面','/文档','/图片','/音乐','/视频','/下载','/mnt','/mnt/local'])if(!await this.primary.exists(d).catch(()=>false))await this.primary.mkdir(d).catch(()=>{})},
  resolve(path){path=pathJoin(path);let best=null;
    for(const m of this.mounts)if((path===m.prefix||path.startsWith(m.prefix==='/'?'/':m.prefix+'/'))&&(!best||m.prefix.length>best.prefix.length))best=m;
    if(!best)throw new Error('路径未挂载: '+path);
    const rel=best.prefix==='/'?path:path.slice(best.prefix.length)||'/';
    return{backend:best.backend,rel:rel.startsWith('/')?rel:'/'+rel,prefix:best.prefix}},
  toVirtual(prefix,rel){return prefix==='/'?rel:pathJoin(prefix,rel)},
  async stat(path){const{backend,rel,prefix}=this.resolve(path);const st=await backend.stat(rel);
    return{...st,path:this.toVirtual(prefix,rel),backend:backend.name}},
  async exists(path){try{const{backend,rel}=this.resolve(path);return await backend.exists(rel)}catch{return false}},
  async readdir(path){const{backend,rel,prefix}=this.resolve(path);
    const list=await backend.readdir(rel);
    const out=list.map(st=>({...st,path:this.toVirtual(prefix,st.path),backend:backend.name}));
    const addMounts=filter=>{for(const m of this.mounts)if(filter(m)){
      const name=pathBase(m.prefix);if(!out.find(o=>o.name===name))out.push({path:m.prefix,name,dir:true,size:0,mtime:Date.now(),ctime:Date.now(),backend:m.backend.name})}};
    if(path==='/')addMounts(m=>m.prefix!=='/'&&pathDir(m.prefix)==='/');
    if(path==='/mnt')addMounts(m=>m.prefix.startsWith('/mnt/')&&m.prefix.split('/').length===3);
    if(path==='/mnt/local')addMounts(m=>m.prefix.startsWith('/mnt/local/')&&m.prefix.split('/').length===4);
    return out},
  async readFile(path){const{backend,rel}=this.resolve(path);return await backend.readFile(rel)},
  async readText(path){const b=await this.readFile(path);return await b.text()},
  async writeFile(path,data,opts={}){const{backend,rel}=this.resolve(path);const r=await backend.writeFile(rel,data,opts);this.invalidateDu(path);Bus.emit('fs:change',pathDir(path));return r},
  async mkdir(path){const{backend,rel}=this.resolve(path);await backend.mkdir(rel);this.invalidateDu(path);Bus.emit('fs:change',pathDir(path))},
  async remove(path){const{backend,rel,prefix}=this.resolve(path);
    if(prefix!=='/'&&rel==='/')throw new Error('请通过卸载移除本地挂载');
    await backend.remove(rel);this.invalidateDu(path);Bus.emit('fs:change',pathDir(path))},
  async rename(from,to){const a=this.resolve(from),b=this.resolve(to);
    if(a.backend===b.backend){await a.backend.rename(a.rel,b.rel)}
    else{const st=await this.stat(from);await this._copyAcross(a.backend,a.rel,b.backend,b.rel,st);await a.backend.remove(a.rel)}
    this.invalidateDu(from);this.invalidateDu(to);Bus.emit('fs:change',pathDir(from));Bus.emit('fs:change',pathDir(to))},
  async copy(src,dst){const a=this.resolve(src),b=this.resolve(dst);const st=await this.stat(src);
    await this._copyAcross(a.backend,a.rel,b.backend,b.rel,st);this.invalidateDu(dst);Bus.emit('fs:change',pathDir(dst))},
  async _copyAcross(sb,sp,db,dp,st){ // 递归复制，保留修改时间
    if(st.dir){await db.mkdir(dp);const kids=await sb.readdir(sp);
      for(const k of kids)await this._copyAcross(sb,k.path,db,pathJoin(dp,k.name),k)}
    else{const blob=await sb.readFile(sp);await db.writeFile(dp,blob,{mtime:st.mtime})}},
  async du(path){const c=this.duCache.get(path);if(c&&Date.now()-c.ts<15000)return c.size;
    let total=0;const walk=async p=>{const list=await this.readdir(p);
      for(const e of list){if(e.dir)await walk(e.path);else total+=e.size||0}};
    await walk(path);this.duCache.set(path,{size:total,ts:Date.now()});return total},
  invalidateDu(path){for(const k of this.duCache.keys())if(k===path||path.startsWith(k+'/')||k.startsWith(path+'/'))this.duCache.delete(k)},
  async search(root,q,limit=300){const out=[];const ql=q.toLowerCase();
    const walk=async p=>{if(out.length>=limit)return;let list;try{list=await this.readdir(p)}catch{return}
      for(const e of list){if(out.length>=limit)return;
        if(e.name.toLowerCase().includes(ql))out.push(e);
        if(e.dir)await walk(e.path)}};
    await walk(root);return out},
  async uniquePath(dir,name){let p=pathJoin(dir,name);if(!await this.exists(p))return p;
    const dot=name.lastIndexOf('.');const base=dot>0?name.slice(0,dot):name;const ext=dot>0?name.slice(dot):'';
    let i=1;while(await this.exists(p=pathJoin(dir,`${base} (${i})${ext}`)))i++;return p},
  /* 本地挂载管理 */
  async mountLocal(handle){const label=handle.name;const prefix='/mnt/local/'+label;
    if(this.mounts.find(m=>m.prefix===prefix))throw new Error('该文件夹已挂载');
    const be=makeFSABackend(label,handle);this.mounts.push({prefix,backend:be});
    await MetaDB.mountPut(label,handle);Bus.emit('fs:mounts');Bus.emit('fs:change','/mnt/local');return prefix},
  async unmountLocal(label){const prefix='/mnt/local/'+label;this.mounts=this.mounts.filter(m=>m.prefix!==prefix);
    await MetaDB.mountDel(label);Bus.emit('fs:mounts');Bus.emit('fs:change','/mnt/local')},
  localMounts(){return this.mounts.filter(m=>m.prefix.startsWith('/mnt/local/')).map(m=>({label:m.backend.label,prefix:m.prefix}))},
  async restoreMounts(){let saved=[];try{saved=await MetaDB.mountAll()}catch{}
    this.pendingMounts=[];
    for(const s of saved){try{
      const perm=await s.handle.queryPermission({mode:'readwrite'});
      if(perm==='granted'){this.mounts.push({prefix:'/mnt/local/'+s.name,backend:makeFSABackend(s.name,s.handle)})}
      else this.pendingMounts.push(s);
    }catch{}}
    if(this.pendingMounts.length)setTimeout(()=>toast(`有 ${this.pendingMounts.length} 个本地文件夹需要重新授权，可在 设置 → 本地挂载 中恢复`,'info',6000),1500)},
  async regrantPending(){for(const s of[...this.pendingMounts]){try{
    const perm=await s.handle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){this.mounts.push({prefix:'/mnt/local/'+s.name,backend:makeFSABackend(s.name,s.handle)});this.pendingMounts=this.pendingMounts.filter(x=>x!==s)}
  }catch{}}Bus.emit('fs:mounts');Bus.emit('fs:change','/mnt/local')},
  async pickAndMount(){if(!window.showDirectoryPicker)throw new Error('当前浏览器不支持本地文件夹挂载（需 Chromium 内核）');
    const h=await window.showDirectoryPicker({mode:'readwrite'});return await this.mountLocal(h)},
  async resetAll(){for(const m of[...this.mounts])if(m.prefix.startsWith('/mnt/local/'))await this.unmountLocal(m.backend.label);
    if(OPFSBackend.available){for await(const h of OPFSBackend.root.values())await OPFSBackend.root.removeEntry(h.name,{recursive:true})}
    const all=await MetaDB.idbAll();for(const r of all)await MetaDB.idbDel(r.path);
    const metas=await MetaDB.allMeta();for(const m of metas)await MetaDB.delMeta(m.path);
    await IDBBackend.init();this.duCache.clear();await this.ensureDirs();Bus.emit('fs:change','/')},
};
window.fs=FS;
/* ============ JS_UI ============ */
function toast(msg,type='info',ms=3200){const t=el('div','toast '+type,`${icon(type==='error'?'warn':type==='ok'?'check':'info')}<div>${esc(msg)}</div>`);
  $('#toast-layer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),220)},ms);return t}
function dlgMask(){const m=el('div','dlg-mask');$('#dialog-layer').appendChild(m);return m}
function dlgClose(m){m.remove()}
function uiAlert(msg,title='派蒙的提醒'){return new Promise(res=>{const m=dlgMask();
  const d=el('div','dlg',`<h3>${icon('star4')}${esc(title)}</h3><div class="dlg-msg">${esc(msg)}</div><div class="dlg-actions"><button class="btn primary">知道了</button></div>`);
  m.appendChild(d);d.querySelector('button').onclick=()=>{dlgClose(m);res()};m.onclick=e=>{if(e.target===m){dlgClose(m);res()}}})}

  <div class="dlg-actions"><button class="btn" data-a="no">取消</button><button class="btn ${danger?'danger':'primary'}" data-a="yes">确定</button></div>`);
  m.appendChild(d);d.querySelector('[data-a=yes]').onclick=()=>{dlgClose(m);res(true)};
  d.querySelector('[data-a=no]').onclick=()=>{dlgClose(m);res(false)};m.onclick=e=>{if(e.target===m){dlgClose(m);res(false)}}})}
function uiPrompt(msg,def='',title='请输入'){return new Promise(res=>{const m=dlgMask();
  const d=el('div','dlg',`<h3>${icon('rename')}${esc(title)}</h3><div class="dlg-msg">${esc(msg)}</div><input class="inp" value="${esc(def)}">

  m.appendChild(d);const inp=d.querySelector('input');

const Ctx={
  el:$('#ctx-menu'),sub:null,
  show(items,x,y){this.hide();const menu=this.el;menu.innerHTML='';menu.classList.remove('hidden');
    this._build(menu,items);
    const r=menu.getBoundingClientRect();
    menu.style.left=clamp(x,4,window.innerWidth-r.width-4)+'px';
    menu.style.top=clamp(y,4,window.innerHeight-r.height-4)+'px'},
  _build(menu,items){items.forEach(it=>{
    if(it==='-'){menu.appendChild(el('div','ctx-sep'));return}
    const row=el('div','ctx-item'+(it.danger?' danger':'')+(it.disabled?' disabled':''),
      `${icon(it.icon||'star4')}<span>${esc(it.label)}</span>${it.children?'<span class="ctx-arrow">▸</span>':''}`);
    if(it.children){let sub=null;
      const openSub=()=>{this._closeSub();sub=el('div');sub.id='ctx-sub';sub.style.cssText='position:fixed;z-index:9810;min-width:180px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line-hi);border-radius:10px;box-shadow:var(--shadow);padding:5px;animation:ctxIn .13s';
        this._build(sub,it.children);document.body.appendChild(sub);this.sub=sub;
        const rr=row.getBoundingClientRect();const sr=sub.getBoundingClientRect();
        let sx=rr.right-4;if(sx+sr.width>window.innerWidth)sx=rr.left-sr.width+4;
        sub.style.left=clamp(sx,4,window.innerWidth-sr.width-4)+'px';sub.style.top=clamp(rr.top,4,window.innerHeight-sr.height-4)+'px'};
      row.addEventListener('mouseenter',openSub);
      row.addEventListener('click',e=>{e.stopPropagation();if(!this.sub)openSub()});
      menu.appendChild(row);return}
    row.onclick=e=>{e.stopPropagation();this.hide();it.action&&it.action()};
    menu.appendChild(row)})},
  _closeSub(){if(this.sub){this.sub.remove();this.sub=null}},
  hide(){this.el.classList.add('hidden');this._closeSub()},
};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx-menu')&&!e.target.closest('#ctx-sub'))Ctx.hide();
  if(!e.target.closest('#start-menu')&&!e.target.closest('#start-btn'))$('#start-menu').classList.add('hidden');
  if(!e.target.closest('#calendar-pop')&&!e.target.closest('#tray-clock'))$('#calendar-pop').classList.add('hidden')},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('input,textarea,.CodeMirror,.allow-select'))return;e.preventDefault()});
window.addEventListener('blur',()=>Ctx.hide());

/* ---- 框选引擎（鼠标 + 触摸统一，边缘自动滚动，AABB 判定） ---- */
function makeMarquee(container,opts){
  // opts: {box, itemSelector, getItems(), onSelect(set), onClickEmpty(), enabled(), scrollEl}
  const box=opts.box;let active=false,sx=0,sy=0,raf=0,scrollV=0,additive=false;
  const scrollEl=opts.scrollEl||container;
  function pt(e){const r=container.getBoundingClientRect();const p=getClientXY(e);
    return{x:p.x-r.left+scrollEl.scrollLeft,y:p.y-r.top+scrollEl.scrollTop,cx:p.x,cy:p.y}}
  function start(e){
    if(opts.enabled&&!opts.enabled())return;
    if(e.type==='touchstart'&&opts.touchEnabled&&!opts.touchEnabled())return;
    if(e.target.closest(opts.itemSelector))return;
    if(e.button!=null&&e.button!==0)return;
    const p=pt(e);active=true;sx=p.x;sy=p.y;additive=e.ctrlKey||e.metaKey||e.shiftKey;
    if(!additive)opts.onSelect(new Set(),false);
    box.style.display='block';move(e);
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',end);
    raf=requestAnimationFrame(autoScroll)}
  function move(e){if(!active)return;if(e.cancelable&&e.type==='touchmove')e.preventDefault();
    const p=pt(e);const x=Math.min(sx,p.x),y=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);
    box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
    const hits=new Set();
    opts.getItems().forEach(it=>{const l=it.el.offsetLeft,t=it.el.offsetTop,r=l+it.el.offsetWidth,b=t+it.el.offsetHeight;
      if(l<x+w&&r>x&&t<y+h&&b>y)hits.add(it.id)});
    opts.onSelect(hits,additive);
    // edge auto-scroll
    const r=scrollEl.getBoundingClientRect();const BAND=40;
    scrollV=p.cy<r.top+BAND?-Math.ceil((r.top+BAND-p.cy)/4):p.cy>r.bottom-BAND?Math.ceil((p.cy-(r.bottom-BAND))/4):0;
    scrollEl._mqX=p.cx;scrollEl._mqY=p.cy}
  function autoScroll(){if(!active)return;
    if(scrollV){scrollEl.scrollTop+=scrollV;
      const fake={clientX:scrollEl._mqX,clientY:scrollEl._mqY,type:'mousemove'};move(fake)}
    raf=requestAnimationFrame(autoScroll)}
  function end(){if(!active)return;active=false;box.style.display='none';cancelAnimationFrame(raf);scrollV=0;
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',end);
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',end);
    opts.onEnd&&opts.onEnd()}
  container.addEventListener('mousedown',start);
  container.addEventListener('touchstart',start,{passive:true});
  return{destroy(){end();container.removeEventListener('mousedown',start);container.removeEventListener('touchstart',start)}};
}

const WM={
  wins:new Map(),z:100,focused:null,peeked:false,
  create({title,icon:ic='star4',width=760,height=520,x,y,minW=280,minH=180,onClose,appId}){
    const id=uid();const layer=$('#window-layer');
    const w=el('div','window');w.dataset.id=id;
    const vw=layer.clientWidth,vh=layer.clientHeight;
    width=Math.min(width,vw-16);height=Math.min(height,vh-16);
    if(x==null)x=Math.max(8,(vw-width)/2+(this.wins.size%5)*26-40);
    if(y==null)y=Math.max(8,(vh-height)/2+(this.wins.size%5)*20-30);
    w.style.cssText=`left:${x}px;top:${y}px;width:${width}px;height:${height}px;min-width:${minW}px;min-height:${minH}px`;
    w.innerHTML=`<div class="win-titlebar">${icon(ic,'wt-icon')}<div class="wt-title">${esc(title)}</div>
      <div class="wt-controls">
        <button class="wt-btn wt-min" title="最小化">${icon('min')}</button>
        <button class="wt-btn wt-max" title="最大化">${icon('max')}</button>
        <button class="wt-btn wt-close" title="关闭">${icon('close')}</button>
      </div></div><div class="win-body"></div>
      ${['n','s','e','w','ne','nw','se','sw'].map(d=>`<div class="win-resize wr-${d}" data-dir="${d}"></div>`).join('')}`;
    layer.appendChild(w);
    const win={id,el:w,body:w.querySelector('.win-body'),title,icon:ic,appId,minimized:false,maximized:false,snap:null,
      restoreRect:null,cleanups:[],setTitle(t){this.title=t;w.querySelector('.wt-title').textContent=t;this.taskEl&&(this.taskEl.querySelector('.ti-label').textContent=t)}};
    this.wins.set(id,win);
    if(isMobile())w.classList.add('mobile-full');
    // controls
    w.querySelector('.wt-min').onclick=e=>{e.stopPropagation();this.minimize(id)};
    w.querySelector('.wt-max').onclick=e=>{e.stopPropagation();this.toggleMax(id)};
    w.querySelector('.wt-close').onclick=e=>{e.stopPropagation();this.close(id)};
    w.addEventListener('pointerdown',()=>this.focus(id),true);
    w.querySelector('.win-titlebar').addEventListener('dblclick',e=>{if(!e.target.closest('.wt-btn'))this.toggleMax(id)});
    this._drag(win);this._resize(win);
    this._taskItem(win);this.focus(id);
    win.onClose=onClose;
    return win},
  _taskItem(win){const t=el('button','task-item',`${icon(win.icon)}<span class="ti-label">${esc(win.title)}</span>`);
    t.onclick=()=>{if(win.minimized)this.restore(win.id);else if(this.focused===win.id)this.minimize(win.id);else this.focus(win.id)};
    t.onmouseenter=()=>{if(!isMobile()&&!win.minimized)this.peek(win.id)};
    t.onmouseleave=()=>this.unpeek();
    $('#task-items').appendChild(t);win.taskEl=t},
  focus(id){const win=this.wins.get(id);if(!win)return;
    if(win.minimized)this.restore(id);
    this.focused=id;win.el.style.zIndex=++this.z;
    this.wins.forEach(w=>{w.el.classList.toggle('focused',w.id===id);w.taskEl.classList.toggle('active',w.id===id)});
    Bus.emit('wm:focus',id)},
  minimize(id){const win=this.wins.get(id);if(!win||win.minimized)return;
    win.el.classList.add('minimizing');
    setTimeout(()=>{win.el.classList.remove('minimizing');win.el.style.display='none';win.minimized=true;
      win.taskEl.classList.add('minimized');win.taskEl.classList.remove('active');
      if(this.focused===id){this.focused=null;const rest=[...this.wins.values()].filter(w=>!w.minimized).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];if(rest)this.focus(rest.id)}},190)},
  restore(id){const win=this.wins.get(id);if(!win)return;win.minimized=false;win.el.style.display='';
    win.taskEl.classList.remove('minimized');this.focus(id)},
  toggleMax(id){const win=this.wins.get(id);if(!win)return;const w=win.el;
    if(win.maximized||win.snap){const r=win.restoreRect;if(r){w.style.left=r.x+'px';w.style.top=r.y+'px';w.style.width=r.w+'px';w.style.height=r.h+'px'}
      win.maximized=false;win.snap=null;w.classList.remove('maximized','snapped');w.querySelector('.wt-max').innerHTML=icon('max')}
    else{win.restoreRect={x:parseFloat(w.style.left),y:parseFloat(w.style.top),w:w.offsetWidth,h:w.offsetHeight};
      win.maximized=true;w.classList.add('maximized');w.style.left='0';w.style.top='0';w.style.width='100%';w.style.height='100%';
      w.querySelector('.wt-max').innerHTML=icon('restore')}
    Bus.emit('wm:resize',id)},
  close(id){const win=this.wins.get(id);if(!win)return;
    try{win.onClose&&win.onClose()}catch(e){console.error(e)}
    win.cleanups.forEach(f=>{try{f()}catch{}});
    win.el.classList.add('closing');win.taskEl.remove();this.wins.delete(id);
    setTimeout(()=>win.el.remove(),160);
    if(this.focused===id){this.focused=null;const rest=[...this.wins.values()].filter(w=>!w.minimized).sort((a,b)=>(b.el.style.zIndex|0)-(a.el.style.zIndex|0))[0];if(rest)this.focus(rest.id)}
    Bus.emit('wm:close',id)},
  closeByApp(appId){[...this.wins.values()].filter(w=>w.appId===appId).forEach(w=>this.close(w.id))},
  _drag(win){const tb=win.el.querySelector('.win-titlebar');const preview=$('#snap-preview');
    let sx,sy,ox,oy,dragging=false,snapZone=null;
    const down=e=>{if(e.target.closest('.wt-btn'))return;if(isMobile())return;
      if(e.button!=null&&e.button!==0)return;
      const p=getClientXY(e);dragging=true;sx=p.x;sy=p.y;
      if(win.maximized||win.snap){const r=win.restoreRect;const ratio=(p.x-parseFloat(win.el.style.left))/win.el.offsetWidth;
        win.maximized=false;win.snap=null;win.el.classList.remove('maximized','snapped');win.el.querySelector('.wt-max').innerHTML=icon('max');
        if(r){win.el.style.width=r.w+'px';win.el.style.height=r.h+'px';ox=p.x-r.w*ratio;oy=p.y-14}
        else{ox=p.x-200;oy=p.y-14}}
      else{ox=parseFloat(win.el.style.left);oy=parseFloat(win.el.style.top)}
      tb.setPointerCapture&&e.pointerId!=null&&tb.setPointerCapture(e.pointerId);
      e.preventDefault()};
    const move=e=>{if(!dragging)return;const p=getClientXY(e);
      let nx=ox+p.x-sx,ny=oy+p.y-sy;
      ny=Math.max(0,ny);win.el.style.left=nx+'px';win.el.style.top=ny+'px';
      const layer=$('#window-layer');const lw=layer.clientWidth,lh=layer.clientHeight;
      snapZone=null;
      if(p.y<=6)snapZone='max';else if(p.x<=6)snapZone='left';else if(p.x>=window.innerWidth-6)snapZone='right';
      if(snapZone){preview.style.display='block';
        const r=snapZone==='max'?{l:0,t:0,w:lw,h:lh}:snapZone==='left'?{l:0,t:0,w:lw/2,h:lh}:{l:lw/2,t:0,w:lw/2,h:lh};
        preview.style.left=r.l+'px';preview.style.top=r.t+'px';preview.style.width=r.w+'px';preview.style.height=r.h+'px'}
      else preview.style.display='none'};
    const up=e=>{if(!dragging)return;dragging=false;preview.style.display='none';
      if(snapZone){win.restoreRect={x:parseFloat(win.el.style.left),y:parseFloat(win.el.style.top),w:win.el.offsetWidth,h:win.el.offsetHeight};
        const layer=$('#window-layer');const lw=layer.clientWidth,lh=layer.clientHeight;
        const r=snapZone==='max'?{l:0,t:0,w:lw,h:lh}:snapZone==='left'?{l:0,t:0,w:lw/2,h:lh}:{l:lw/2,t:0,w:lw/2,h:lh};
        win.el.style.left=r.l+'px';win.el.style.top=r.t+'px';win.el.style.width=r.w+'px';win.el.style.height=r.h+'px';
        win.snap=snapZone;win.maximized=snapZone==='max';win.el.classList.add(snapZone==='max'?'maximized':'snapped');
        if(snapZone==='max')win.el.querySelector('.wt-max').innerHTML=icon('restore');
        Bus.emit('wm:resize',win.id);snapZone=null}};
    tb.addEventListener('pointerdown',down);
    tb.addEventListener('pointermove',move);tb.addEventListener('pointerup',up);tb.addEventListener('pointercancel',up)},
  _resize(win){win.el.querySelectorAll('.win-resize').forEach(h=>{
    const dir=h.dataset.dir;let sx,sy,r0,active=false;
    h.addEventListener('pointerdown',e=>{if(win.maximized)return;e.preventDefault();e.stopPropagation();
      active=true;const p=getClientXY(e);sx=p.x;sy=p.y;
      r0={x:parseFloat(win.el.style.left),y:parseFloat(win.el.style.top),w:win.el.offsetWidth,h:win.el.offsetHeight};
      h.setPointerCapture(e.pointerId)});
    h.addEventListener('pointermove',e=>{if(!active)return;const p=getClientXY(e);const dx=p.x-sx,dy=p.y-sy;
      const minW=parseInt(win.el.style.minWidth)||280,minH=parseInt(win.el.style.minHeight)||180;
      let{x,y,w,h:hh}=r0;
      if(dir.includes('e'))w=Math.max(minW,r0.w+dx);
      if(dir.includes('s'))hh=Math.max(minH,r0.h+dy);
      if(dir.includes('w')){w=Math.max(minW,r0.w-dx);x=r0.x+r0.w-w}
      if(dir.includes('n')){hh=Math.max(minH,r0.h-dy);y=Math.max(0,r0.y+r0.h-hh);if(y===0)hh=r0.y+r0.h}
      win.el.style.left=x+'px';win.el.style.top=y+'px';win.el.style.width=w+'px';win.el.style.height=hh+'px'});
    const up=()=>{if(active){active=false;Bus.emit('wm:resize',win.id)}};
    h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)})},
  peek(id){if(this.peeked)return;this.wins.forEach(w=>{if(w.minimized)return;
    w.el.classList.toggle('peek-hide',w.id!==id);w.el.classList.toggle('peek-outline',w.id===id)})},
  unpeek(){this.wins.forEach(w=>w.el.classList.remove('peek-hide','peek-outline'))},
  peekDesktop(on){this.peeked=on;this.wins.forEach(w=>{if(!w.minimized)w.el.classList.toggle('peek-hide',on)})},
};

let wallURL=null;
async function applyWallpaper(){const layer=$('#wallpaper-layer');const wp=Settings.get('wallpaper');
  if(wp.startsWith('builtin:')){const w=WALLPAPERS[wp.slice(8)]||WALLPAPERS.liyue;
    layer.style.backgroundImage=w.css;layer.innerHTML=w.stars?'<div class="wp-stars"></div>':'';

  else if(wp.startsWith('file:')){try{const blob=await FS.readFile(wp.slice(5));

    layer.style.backgroundImage=`url(${wallURL})`;layer.innerHTML=''}catch{Settings.set('wallpaper','builtin:liyue')}}}
