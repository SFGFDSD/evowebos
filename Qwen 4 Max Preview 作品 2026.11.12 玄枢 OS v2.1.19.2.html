    node.addEventListener('dragleave',()=>node.classList.remove('drop-hint'));
    node.addEventListener('drop',async e=>{node.classList.remove('drop-hint');await handleInternalDrop(e,p,e.ctrlKey)})}
  /* ----- 侧边栏 ----- */
  function renderSide(){sb.innerHTML='';
    const quick=[['/desktop','桌面','folder'],['/documents','文档','text'],['/pictures','图片','image'],['/music','音乐','music'],['/downloads','下载','download']];
    sb.appendChild(el('div','',`<div style="font-size:10px;color:var(--gold);letter-spacing:2px;padding:4px 8px">快速访问</div>`));
    for(const[p,n,ic]of quick){const r=el('button','tbtn tree-row',`${icon(ic,'width:15px;height:15px')}${n}`);r.style.cssText='width:100%;justify-content:flex-start';r.dataset.p=p;dropTarget(r,p);r.onclick=()=>navigate(p);sb.appendChild(r)}
    sb.appendChild(el('div','',`<div style="font-size:10px;color:var(--gold);letter-spacing:2px;padding:10px 8px 4px">存储位置</div>`));
    treeNode(sb,'/','玄枢盘 · OPFS','hdd',0);treeNode(sb,'/idb','索引库 · IndexedDB','hdd',0);treeNode(sb,'/mnt/local','本地挂载','mount',0);
  }
  function treeNode(parent,p,label,ic,depth){
    const wrap=el('div');const row=el('div','tree-row',`<button class="tbtn tw" style="padding:2px">${icon('chevR','width:12px;height:12px')}</button>${icon(ic,'width:15px;height:15px;color:var(--jade)')}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>${p.startsWith('/mnt/local/')?`<button class="tbtn eject" title="卸载" style="padding:2px">${icon('eject','width:13px;height:13px')}</button>`:''}`);
    row.style.cssText=`display:flex;align-items:center;gap:5px;padding:4px 6px;padding-left:${6+depth*14}px;border-radius:6px;cursor:pointer;font-size:12.5px`;
    row.dataset.p=p;dropTarget(row,p);
    const kids=el('div');kids.style.display='none';let loaded=false;
    row.querySelector('.tw').onclick=async e=>{e.stopPropagation();const open=kids.style.display==='none';kids.style.display=open?'':'none';
      row.querySelector('.tw').innerHTML=icon(open?'chevD':'chevR','width:12px;height:12px');
      if(open&&!loaded){loaded=true;try{const list=(await fs.readdir(p)).filter(x=>x.dir&&!x.name.startsWith('.'));for(const c of list)treeNode(kids,c.path,c.name,'folder',depth+1);if(!list.length)kids.appendChild(el('div','',`<div style="font-size:11px;color:var(--faint);padding:3px 0 3px ${20+depth*14}px">（空）</div>`))}catch(err){}}};
    const ej=row.querySelector('.eject');if(ej)ej.onclick=e=>{e.stopPropagation();fs.unmount(fs.nameOf(p)).then(()=>toast('已卸载 '+label,'ok'))};
    row.onclick=()=>navigate(p);
    row.onmouseenter=()=>row.style.background='var(--jade-soft)';row.onmouseleave=()=>row.style.background=row.dataset.p===cwd?'var(--acc-soft)':'';
    wrap.append(row,kids);parent.appendChild(wrap)}
  async function mountLocal(){if(!window.showDirectoryPicker){toast('此浏览器不支持本地文件夹挂载（需 Chromium 桌面版）','warn');return}
    try{const h=await showDirectoryPicker({mode:'readwrite'});const name=await fs.mountLocal(h);toast(`已挂载本地文件夹：${name}`,'ok');navigate('/mnt/local/'+name)}catch(e){if(e.name!=='AbortError')toast('挂载失败：'+e.message,'err')}}
  async function newNode(dir,ext=''){const n=await ui.prompt(dir?'新建文件夹':'新建文件',dir?'新建文件夹':'未命名'+ext);if(!n)return;try{const p=await fs.unique(fs.join(cwd,n));if(dir)await fs.mkdir(p);else await fs.writeFile(p,'');toast('已创建','ok')}catch(e){toast(e.message,'err')}}
  /* ----- 数据与刷新 ----- */
  async function refresh(showVeil=true){const my=++token;
    if(showVeil){veil.style.opacity=1;veil.style.pointerEvents='auto'}
    try{
      let list;
      if(query){list=globalSearch?await fs.search('/',query,200):(await fs.readdir(cwd)).filter(x=>x.name.toLowerCase().includes(query.toLowerCase()))}
      else list=await fs.readdir(cwd);
      if(my!==token)return;
      entries=list.filter(x=>S.showHidden||!x.name.startsWith('.'));
      entries.sort((a,b)=>{if(a.dir!==b.dir)return a.dir?-1:1;let r=0;
        if(sort.key==='name')r=natCmp(a.name,b.name);else if(sort.key==='mtime')r=a.mtime-b.mtime;
        else if(sort.key==='size')r=(a._sz??a.size)-(b._sz??b.size);else r=natCmp(extOf(a.name)||'',extOf(b.name)||'')||natCmp(a.name,b.name);
        return r*sort.dir});
      renderItems();
    }catch(e){if(my===token){content.innerHTML=`<div class="empty-hint">${esc(e.message)}</div>`;entries=[]}}
    veil.style.opacity=0;veil.style.pointerEvents='none';updStatus()}
  function updStatus(){const sz=entries.filter(x=>sel.has(x.path)).reduce((s,x)=>s+(x._sz??x.size),0);
    status.innerHTML=`<span>${entries.length} 项${query?(globalSearch?' · 全局搜索':' · 过滤'):''}</span>${sel.size?`<span style="color:var(--acc)">选中 ${sel.size} 项 · ${fmtSize(sz)}</span>`:''}<span style="margin-left:auto">${fs.backendName(cwd)}</span><span>${esc(cwd)}</span>`}
  /* ----- 渲染 ----- */
  function renderItems(){const my=token;detachMarq&&detachMarq();thumbIO&&thumbIO.disconnect();
    content.innerHTML='';content.style.cssText='position:relative;min-width:100%;min-height:100%';
    if(!entries.length){content.appendChild(el('div','empty-hint',query?'没有匹配结果':'空文件夹 · 右键新建或拖入文件'))}
    if(view==='list')renderList();else if(view==='grid')renderGrid();else renderColsView();
    if(view!=='cols'){detachMarq=marquee(scroll,{content,itemSel:'.fx-item',onSel:s=>{sel=s;$$('.fx-item',content).forEach(n=>n.classList.toggle('sel',s.has(n.dataset.mid)));updStatus()}})}else detachMarq=null;
    scroll.classList.toggle('marq-mode',marqMode);scroll.style.touchAction=marqMode?'none':'';
    $$('.fx-item',content).forEach(n=>{if(view!=='cols')n.draggable=!marqMode});
    // 文件夹真实大小（递归统计，带缓存）
    for(const en of entries){if(!en.dir)continue;fs.du(en.path).then(sz=>{if(my!==token)return;en._sz=sz;const cell=content.querySelector(`.fx-item[data-mid="${CSS.escape(en.path)}"] .c-size`);if(cell)cell.textContent=fmtSize(sz)}).catch(()=>{})}
  }
  const rowH=()=>isTouch?40:30;
  function cellHTML(en,key){
    if(key==='name')return `<span class="c-name" style="width:var(--cw-name);display:flex;align-items:center;gap:8px;padding:0 8px;overflow:hidden"><span style="color:${en.dir?'var(--gold)':'var(--jade)'};flex:none">${icon(en.dir?'folder':kindOf(en.name).icon,'width:16px;height:16px')}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(en.name)}</span>${query&&globalSearch?`<span style="color:var(--faint);font-size:10px;flex:none">${esc(fs.parentOf(en.path))}</span>`:''}</span>`;
    if(key==='mtime')return `<span class="c-mtime" style="width:var(--cw-mtime);padding:0 8px;color:var(--dim);font-size:12px;overflow:hidden;white-space:nowrap">${fmtDate(en.mtime)}</span>`;
    if(key==='type')return `<span class="c-type" style="width:var(--cw-type);padding:0 8px;color:var(--dim);font-size:12px;overflow:hidden;white-space:nowrap">${en.dir?'文件夹':typeLabel(en.name)}</span>`;
    return `<span class="c-size" style="width:var(--cw-size);padding:0 8px;color:var(--dim);font-size:12px;font-family:var(--f-mono);overflow:hidden;white-space:nowrap">${en.dir?'…':fmtSize(en.size)}</span>`}
  function applyColVars(){for(const k of colCfg.order)content.style.setProperty('--cw-'+k,colCfg.w[k]+'px');
    content.style.setProperty('--row-w',colCfg.order.reduce((s,k)=>s+colCfg.w[k],0)+'px')}
  function renderList(){applyColVars();
    const head=el('div','col-h');head.style.cssText='position:sticky;top:0;z-index:6;display:flex;height:30px;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--line2);min-width:100%';
    for(const k of colCfg.order){const c=el('div','',`<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${COLNAME[k]}${sort.key===k?(sort.dir>0?' ↑':' ↓'):''}</span><span class="rszcol" style="position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2"></span>`);
      c.style.cssText=`position:relative;width:var(--cw-${k});flex:none;display:flex;align-items:center;padding:0 8px;font-size:12px;color:${sort.key===k?'var(--acc)':'var(--dim)'};border-right:1px solid var(--line);cursor:pointer;user-select:none`;
      c.draggable=true;c.dataset.col=k;
      c.addEventListener('click',e=>{if(c._rsz)return;if(sort.key===k)sort.dir*=-1;else{sort.key=k;sort.dir=1}refresh(false)});
      c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/x-xs-col',k);e.stopPropagation()});
      c.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/x-xs-col'))e.preventDefault()});
      c.addEventListener('drop',e=>{const from=e.dataTransfer.getData('text/x-xs-col');if(!from||from===k)return;e.preventDefault();e.stopPropagation();const o=colCfg.order;const oi=o.indexOf(from),ni=o.indexOf(k);o.splice(oi,1);o.splice(ni,0,from);saveCols();renderItems()});
      const rz=c.querySelector('.rszcol');
      rz.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();c._rsz=true;const sx=e.clientX,sw=colCfg.w[k];rz.setPointerCapture(e.pointerId);
        const mv=ev=>{colCfg.w[k]=clamp(sw+ev.clientX-sx,64,600);applyColVars()};
        const up=()=>{rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up);saveCols();setTimeout(()=>c._rsz=false,50)};
        rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up)});
      head.appendChild(c)}
    content.appendChild(head);
    const H=rowH();
    entries.forEach((en,i)=>{const r=makeItem(en);r.style.cssText=`position:absolute;left:0;top:${30+i*H}px;width:var(--row-w);height:${H}px;display:flex;align-items:center;border-radius:4px`;
      r.innerHTML=colCfg.order.map(k=>cellHTML(en,k)).join('');content.appendChild(r)});
    content.style.height=(30+entries.length*H+60)+'px';
    const totalW=colCfg.order.reduce((s,k)=>s+colCfg.w[k],0);
    content.style.minWidth='100%';content.style.width=Math.max(scroll.clientWidth,totalW)+'px'; /* 列左对齐连续排布，右侧留白即框选区 */
  }
  function renderGrid(){const W=104,H=116;const cols=Math.max(1,Math.floor((scroll.clientWidth-16)/W));
    entries.forEach((en,i)=>{const r=makeItem(en);const x=8+(i%cols)*W,y=8+Math.floor(i/cols)*H;
      r.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${W-8}px;height:${H-8}px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px`;
      const isImg=S.thumbs&&IMG_EXT.includes(extOf(en.name));
      r.innerHTML=`<span style="width:48px;height:48px;display:grid;place-items:center;color:${en.dir?'var(--gold)':'var(--jade)'}">${isImg?`<img data-tp="${esc(en.path)}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)" alt="">`:icon(en.dir?'folder':kindOf(en.name).icon,'width:42px;height:42px;stroke-width:1.2')}</span><span style="font-size:11.5px;text-align:center;line-height:1.3;max-height:2.6em;overflow:hidden;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(en.name)}</span>`;
      content.appendChild(r)});
    content.style.height=(Math.ceil(entries.length/cols)*H+80)+'px';
    thumbIO=attachThumbs(scroll)}
  function renderColsView(){if(!chain.length)chain=[cwd];
    content.style.cssText='position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden';
    chain.forEach((p,ci)=>{const pane=el('div');pane.style.cssText='width:230px;flex:none;border-right:1px solid var(--line);overflow-y:auto;position:relative';
      const inner=el('div');inner.style.cssText='position:relative;min-height:100%';pane.appendChild(inner);
      const listEl=ci===chain.length-1?entries:null;
      const fill=list=>{inner.innerHTML='';inner.style.height=(list.length*30+50)+'px';
        list.forEach((en,i)=>{const r=el('div','fx-item');r.dataset.mid=en.path;r.dataset.dir=en.dir?'1':'';
          r.style.cssText=`position:absolute;left:2px;right:2px;top:${4+i*30}px;height:28px;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:5px;cursor:pointer;font-size:12.5px;${chain[ci+1]===en.path||sel.has(en.path)?'background:var(--acc-soft)':''}`;
          r.innerHTML=`<span style="color:${en.dir?'var(--gold)':'var(--jade)'}">${icon(en.dir?'folder':kindOf(en.name).icon,'width:15px;height:15px')}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(en.name)}</span>${en.dir?icon('chevR','width:11px;height:11px;color:var(--faint)'):''}`;
          r.onclick=e=>{if(e.ctrlKey||e.metaKey){sel.has(en.path)?sel.delete(en.path):sel.add(en.path);r.classList.toggle('sel');updStatus();return}
            if(en.dir){chain=chain.slice(0,ci+1);chain.push(en.path);cwd=en.path;win.setSub(en.path);renderCrumbsFor(en.path);renderItems();refreshDirOnly(en.path)}else openPath(en.path)};
          r.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();itemCtx(e,en)};
          inner.appendChild(r)})};
      if(listEl)fill(entries);else inner.innerHTML='<div class="empty-hint" style="font-size:11px">读取中…</div>';
      if(!listEl)fs.readdir(p).then(l=>fill(l.filter(x=>S.showHidden||!x.name.startsWith('.')).sort((a,b)=>a.dir!==b.dir?(a.dir?-1:1):natCmp(a.name,b.name)))).catch(()=>fill([]));
      content.appendChild(pane)});
    setTimeout(()=>{content.scrollLeft=content.scrollWidth},30)}
  function renderCrumbsFor(p){const old=cwd;cwd=p;renderCrumbs();cwd=p}
  async function refreshDirOnly(p){try{const l=await fs.readdir(p);entries=l.filter(x=>S.showHidden||!x.name.startsWith('.')).sort((a,b)=>a.dir!==b.dir?(a.dir?-1:1):natCmp(a.name,b.name));updStatus()}catch(e){}}
  function makeItem(en){const r=el('div','fx-item');r.dataset.mid=en.path;r.dataset.dir=en.dir?'1':'';r.draggable=true;
    if(sel.has(en.path))r.classList.add('sel');
    r.onmouseenter=()=>{if(!en.dir)prepareDrag(en.path)};
    r.addEventListener('pointerdown',()=>{if(!en.dir)prepareDrag(en.path)});
    r.addEventListener('dragstart',e=>{if(!sel.has(en.path)){sel=new Set([en.path]);$$('.fx-item',content).forEach(n=>n.classList.toggle('sel',sel.has(n.dataset.mid)))}
      dndStart(e,[...sel]);e.dataTransfer.setData('text/x-xs-from','explorer')});
    r.addEventListener('dragend',()=>dndEnd([...sel]));
    if(en.dir){r.addEventListener('dragover',e=>{e.preventDefault();r.classList.add('drop-hint')});
      r.addEventListener('dragleave',()=>r.classList.remove('drop-hint'));
      r.addEventListener('drop',async e=>{r.classList.remove('drop-hint');if(await handleInternalDrop(e,en.path,e.ctrlKey))refresh(false)})}
    r.onclick=e=>{
      if(marqMode||e.ctrlKey||e.metaKey){sel.has(en.path)?sel.delete(en.path):sel.add(en.path);r.classList.toggle('sel');anchor=en.path;updStatus();return}
      if(e.shiftKey&&anchor){const ids=entries.map(x=>x.path);const a=ids.indexOf(anchor),b2=ids.indexOf(en.path);if(a>=0&&b2>=0){sel=new Set(ids.slice(Math.min(a,b2),Math.max(a,b2)+1));$$('.fx-item',content).forEach(n=>n.classList.toggle('sel',sel.has(n.dataset.mid)));updStatus();return}}
      if(en.dir)navigate(en.path);else openPath(en.path)};
    r.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();
      if(!sel.has(en.path)){sel=new Set([en.path]);$$('.fx-item',content).forEach(n=>n.classList.toggle('sel',sel.has(n.dataset.mid)));updStatus()}
      itemCtx(e,en)};
    attachTouchDrag(r,()=>sel.has(en.path)?[...sel]:[en.path],(x,y)=>{
      ghostHide();const under=document.elementFromPoint(x,y);const t=under&&under.closest('[data-drop-path],.fx-item[data-dir="1"],.dicon[data-drop]');
      if(!t)return;const dest=t.dataset.dropPath||t.dataset.mid;const paths=sel.has(en.path)?[...sel]:[en.path];
      paths.forEach(pp=>fs.move(pp,dest).catch(er=>toast(er.message,'err')));toast(`已移动 ${paths.length} 项`,'ok')},{axis:'x'});
    return r}
  function ghostHide(){$('#drag-ghost').style.display='none'}
  function itemCtx(e,en){const paths=[...sel].length?[...sel]:[en.path];const k=kindOf(en.name);
    const items=[{label:'打开',icon:'folderOpen',fn:()=>en.dir?navigate(en.path):openPath(en.path)}];
    if(en.dir)items.push({label:'在新窗口打开',icon:'external',fn:()=>launch('explorer',{path:en.path})});
    else items.push({label:'打开方式',icon:'dots',sub:openWithItems(en.path)});
    if(k.kind==='image')items.push({label:'设为壁纸',icon:'image',fn:()=>{S.wall={type:'file',path:en.path};S.save();applyWall();toast('壁纸已更新','ok')}});
    if(k.kind==='archive')items.push({label:'解压到同名文件夹',icon:'zip',fn:()=>extractArchive(en.path,fs.join(cwd,en.name.replace(/\.(zip|gz|tar|tgz|7z)$/i,'')))});
    if(en.path.startsWith('/mnt/local/')&&en.path.split('/').length===4)items.push({label:'卸载此文件夹',icon:'eject',fn:()=>fs.unmount(en.name).then(()=>toast('已卸载','ok'))});
    items.push({sep:true},
      {label:'复制',icon:'copy',fn:()=>{CLIP={paths,mode:'copy'};toast(`已复制 ${paths.length} 项`)}},
      {label:'剪切',icon:'cut',fn:()=>{CLIP={paths,mode:'cut'};toast(`已剪切 ${paths.length} 项`)}},
      {label:'粘贴',icon:'paste',dis:!CLIP,fn:()=>pasteTo(en.dir?en.path:cwd)},
      {label:'重命名',icon:'edit',dis:paths.length>1,fn:()=>renamePath(en.path)},
      {label:'导出到本机',icon:'download',fn:()=>paths.forEach(exportPath)},
      {sep:true},
      {label:'压缩为 ZIP',icon:'zip',fn:async()=>{try{const pt=progressToast('压缩中…');const blob=await makeZipBlob(paths);await fs.writeFile(await fs.unique(fs.join(cwd,en.name.replace(/\.[^.]+$/,'')+'.zip')),blob);pt.done('压缩完成')}catch(er){toast(er.message,'err')}}},
      {sep:true},
      {label:'删除',icon:'trash',danger:true,fn:()=>deletePaths(paths)},
      {label:'属性',icon:'info',fn:()=>showProps(en.path)});
    showMenu(items,e.clientX,e.clientY)}
  function blankCtx(e){showMenu([
    {label:'刷新',icon:'refresh',fn:()=>refresh()},
    {label:'查看',icon:'eye',sub:[{label:'详细信息',icon:'list',fn:()=>{view='list';syncViewBtns();renderItems()}},{label:'图标',icon:'grid',fn:()=>{view='grid';syncViewBtns();renderItems()}},{label:'分栏',icon:'cols',fn:()=>{view='cols';chain=[cwd];syncViewBtns();renderItems()}}]},
    {label:'排序方式',icon:'format',sub:['name','mtime','type','size'].map(k=>({label:COLNAME[k]+(sort.key===k?(sort.dir>0?' ↑':' ↓'):''),icon:sort.key===k?'check':'dots',fn:()=>{if(sort.key===k)sort.dir*=-1;else{sort.key=k;sort.dir=1}refresh(false)}}))},
    {sep:true},
    {label:'新建文件夹',icon:'folderPlus',fn:()=>newNode(true)},
    {label:'新建文本文档',icon:'filePlus',fn:()=>newNode(false,'.txt')},
    {label:'上传文件',icon:'upload',fn:()=>pickFiles(cwd)},
    {label:'挂载本地文件夹',icon:'mount',fn:mountLocal},
    {label:'粘贴',icon:'paste',dis:!CLIP,fn:()=>pasteTo(cwd)},
    {sep:true},
    {label:'全选',icon:'check',fn:()=>{sel=new Set(entries.map(x=>x.path));$$('.fx-item',content).forEach(n=>n.classList.add('sel'));updStatus()}},
    {label:document.fullscreenElement?'退出全屏':'全屏模式',icon:'fit',fn:toggleFS},
    {label:'属性',icon:'info',fn:()=>showProps(cwd)}],e.clientX,e.clientY)}
  return win;
}};

<script>
/* ================= 玄枢 · 内置应用（一） ================= */
'use strict';
/* ---------- 记事本 ---------- */
APPS.notepad={name:'记事本',icon:'note',open({path}={}){
  let dirty=false,fontSize=14,auto=true,undoStack=[],redoStack=[],cur='';
  const win=wm.create('notepad',{title:'记事本',icon:'note',w:720,h:520,sub:path||'未命名',build});
  let ta;
  async function build(b){
    b.innerHTML=`<div class="toolbar">
      <button class="tbtn" data-a="save">${icon('save')}保存</button>
      <button class="tbtn" data-a="undo">${icon('undo')}撤销</button>
      <button class="tbtn" data-a="redo">${icon('redo')}重做</button>
      <span class="tsep"></span>
      <button class="tbtn" data-a="f-">A−</button><span class="fs" style="font-size:11px;color:var(--dim)">14</span><button class="tbtn" data-a="f+">A＋</button>
      <button class="tbtn on" data-a="auto">${icon('check')}自动保存</button>
      <button class="tbtn" data-a="wrap">${icon('format')}自动换行</button>
      <span class="tsep"></span><button class="tbtn" data-a="export">${icon('download')}导出</button>

APPS.sheet={name:'表格',icon:'table',open({path}={}){
  let rows=[],mode='table',delim=extOf(path||'csv')==='tsv'?'\t':',',dirty=false;
  const win=wm.create('sheet',{title:'表格',icon:'table',w:860,h:560,sub:path||'未命名',build});
  function parseCSV(text,d){const out=[];let row=[],cell='',q=false;
    for(let i=0;i<text.length;i++){const c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
      else if(c==='"')q=true;else if(c===d){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);out.push(row);row=[];cell=''}
      else if(c!=='\r')cell+=c}
    if(cell!==''||row.length){row.push(cell);out.push(row)}return out}
  const ser=()=>rows.map(r=>r.map(c=>/[",\n\t]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(delim)).join('\n');
  async function build(b){
    b.innerHTML=`<div class="toolbar">
      <button class="tbtn on" data-a="table">${icon('table')}表格视图</button>

      <span style="flex:1"></span><span style="font-size:11px;color:var(--faint)">${esc(path||'')}</span></div>
      <div class="sh-wrap" style="flex:1;overflow:auto;position:relative"></div><div class="statusbar sh-st"></div>`;
    let text=path?await fs.readText(path).catch(()=>''):'名称,数量,备注\n示例,1,双击单元格编辑\n';
    rows=parseCSV(text,delim);if(!rows.length)rows=[['']];
    const wrap=$('.sh-wrap',b);
    function drawTable(){wrap.innerHTML='';const t=el('table');t.style.cssText='border-collapse:collapse;font-size:12.5px;font-family:var(--f-mono);min-width:100%';
      const maxC=Math.max(...rows.map(r=>r.length));
      rows.forEach((r,ri)=>{const tr=el('tr');
        tr.appendChild(Object.assign(el('td','',String(ri+1)),{style:'background:var(--bg2);color:var(--faint);padding:4px 8px;border:1px solid var(--line);font-size:10px;text-align:center;position:sticky;left:0'}));
        for(let ci=0;ci<maxC;ci++){const td=el('td');td.contentEditable=true;td.spellcheck=false;td.textContent=r[ci]??'';
          td.style.cssText=`border:1px solid var(--line);padding:5px 10px;min-width:80px;max-width:340px;outline:none;${ri===0?'background:var(--jade-soft);color:var(--jade);font-weight:700':''}`;
          td.oninput=()=>{rows[ri][ci]=td.textContent;dirty=true;st()};
          td.onfocus=()=>td.style.boxShadow='inset 0 0 0 2px var(--acc)';td.onblur=()=>td.style.boxShadow='';
          tr.appendChild(td)}t.appendChild(tr)});
      wrap.appendChild(t)}
    let ta=null;
    function drawText(){wrap.innerHTML='';ta=el('textarea');ta.style.cssText='width:100%;height:100%;border:none;border-radius:0;resize:none;font-family:var(--f-mono);font-size:13px;padding:12px;background:var(--bg1)';ta.value=ser();ta.oninput=()=>{dirty=true;st()};wrap.appendChild(ta)}
    function st(){$('.sh-st',b).innerHTML=`<span>${rows.length} 行 × ${Math.max(...rows.map(r=>r.length))} 列</span><span>${delim==='\t'?'TSV':'CSV'}</span><span style="margin-left:auto;color:${dirty?'var(--warn)':'var(--ok)'}">${dirty?'● 未保存':'✓ 已保存'}</span>`}
    async function save(){if(ta&&mode==='text')rows=parseCSV(ta.value,delim);
      if(!path){const n=await ui.prompt('保存表格','数据.csv');if(!n)return;path=await fs.unique(defaultDir('documents')+'/'+n);win.setSub(path)}
      await fs.writeFile(path,ser());dirty=false;st();toast('已保存','ok')}
    b.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
      if(a==='table'||a==='text'){if(a===mode)return;if(ta&&mode==='text')rows=parseCSV(ta.value,delim);mode=a;
        $('[data-a="table"]',b).classList.toggle('on',mode==='table');$('[data-a="text"]',b).classList.toggle('on',mode==='text');

      else if(a==='save')save();
      else if(a==='addrow'){rows.push(new Array(Math.max(...rows.map(r=>r.length))).fill(''));drawTable();st()}
      else if(a==='addcol'){rows.forEach(r=>r.push(''));drawTable();st()}

    b.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});

      else{expr+=k;out.textContent=expr}}
    b.tabIndex=0;b.addEventListener('keydown',e=>{const m={'/':'÷','*':'×','-':'−','Enter':'=','Backspace':'⌫','Escape':'C'};const k=m[e.key]||e.key;

function fmtHTML(src){const blocks=[];let s=src.replace(/<(script|style|pre)[\s\S]*?<\/\1>/gi,m=>{blocks.push(m);return'\x00'+(blocks.length-1)+'\x00'});

    }catch(e){toast('CodeMirror 加载失败，使用基础编辑模式','warn');
      edPane.innerHTML='';fallbackTA=el('textarea');fallbackTA.style.cssText='width:100%;height:100%;border:none;border-radius:0;resize:none;background:#131f1d;color:#dcebe2;font-family:var(--f-mono);font-size:13px;padding:12px';fallbackTA.value=initial;
      fallbackTA.oninput=()=>{dirty=true;queuePreview();updSt()};fallbackTA.onkeyup=updSt;
      fallbackTA.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key==='s'){ev.preventDefault();save()}});
      edPane.appendChild(fallbackTA)}
    frame.addEventListener('load',()=>{veil.style.opacity=0;veil.style.pointerEvents='none'});
    setOrient(orient);setView('split');doPreview();updSt();
    /* 分割条拖动 */
    split.addEventListener('pointerdown',e=>{split.setPointerCapture(e.pointerId);split.style.background='var(--acc)';
      const mv=ev=>{const r=wrap.getBoundingClientRect();
        if(orient==='row'){const pct=clamp((ev.clientX-r.left)/r.width*100,15,85);edPane.style.flexBasis=pct+'%';pvPane.style.flexBasis=(100-pct)+'%'}
        else{const pct=clamp((ev.clientY-r.top)/r.height*100,15,85);edPane.style.flexBasis=pct+'%';pvPane.style.flexBasis=(100-pct)+'%'}};
      const up=()=>{split.style.background='';split.removeEventListener('pointermove',mv);split.removeEventListener('pointerup',up);cm&&cm.refresh()};
      split.addEventListener('pointermove',mv);split.addEventListener('pointerup',up)});
    $('.ed-lang',b).onchange=e=>{lang=e.target.value;cm&&cm.setOption('mode',CM_LANGS[lang].mode);updSt();doPreview()};
    $('.ed-input',b).onchange=e=>{inputMode=e.target.value;if(!cm)return;
      const v=inputMode==='pc'?'textarea':inputMode==='mobile'?'contenteditable':window.CodeMirror.defaults.inputStyle;
      cm.setOption('inputStyle',v);cm.focus();toast('输入模式：'+(inputMode==='auto'?'自动（跟随浏览器）':inputMode==='pc'?'电脑（textarea）':'手机（可拖拽选字）'))};
    b.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
      if(a==='save')save();
      else if(a==='undo')cm?cm.undo():document.execCommand('undo');
      else if(a==='redo')cm?cm.redo():document.execCommand('redo');
      else if(a==='fmt')format();
      else if(a==='find')cm?cm.execCommand('findPersistent'):toast('基础模式请用浏览器查找','warn');
      else if(a==='replace')cm?cm.execCommand('replace'):toast('基础模式暂不支持替换','warn');
      else if(a==='refresh')doPreview();
      else if(a==='orient')setOrient(orient==='row'?'col':'row');
      else if(a.startsWith('v-'))setView(a.slice(2)==='pv'?'preview':a.slice(2));
      else if(a==='copy')copyText(getVal());
      else if(a==='clear'){if(await ui.confirm('清空内容','确定清空编辑器全部内容？')){setVal('');doPreview()}}
      else if(a==='newtab'){const u=URL.createObjectURL(new Blob([previewDoc()],{type:'text/html'}));window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
      else if(a==='browser'){if(path)launch('browser',{path});else{const tmp='/desktop/'+(await ui.prompt('先在虚拟磁盘生成页面文件','预览页面.html')||'预览页面.html');await fs.writeFile(tmp,getVal());launch('browser',{path:tmp})}}
      else if(a==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.html,.htm,.css,.js,.mjs,.json,.md,.markdown,.xml,.svg,.txt,.csv,.tsv,text/*';
        inp.onchange=async()=>{const f=inp.files[0];if(!f)return;setVal(await f.text());lang=langOfExt(extOf(f.name));$('.ed-lang',b).value=lang;cm&&cm.setOption('mode',CM_LANGS[lang].mode);win.setSub(f.name+'（导入）');path=null;doPreview();updSt()};inp.click()}
      else if(a==='export'){showMenu([
        {label:'下载到本机',icon:'download',fn:async()=>{const n=await ui.prompt('导出文件名','导出.'+CM_LANGS[lang].ext);if(n)download(new Blob([getVal()]),n)}},
        {label:'导出到虚拟桌面',icon:'hdd',fn:async()=>{const n=await ui.prompt('保存到 /desktop','导出.'+CM_LANGS[lang].ext);if(n){await fs.writeFile(await fs.unique('/desktop/'+n),getVal());toast('已导出到桌面','ok')}}}],e.clientX,e.clientY)}});
    async function save(){
      if(!path){const n=await ui.prompt('保存到桌面（/desktop）','未命名.'+CM_LANGS[lang].ext);if(!n)return;path=await fs.unique('/desktop/'+n);win.setSub(path)}
      try{await fs.writeFile(path,getVal());dirty=false;updSt();toast('已保存 → '+path,'ok');snd('ok')}catch(e){toast('保存失败：'+e.message,'err')}}
    function format(){let v=getVal();
      try{if(lang==='json')v=JSON.stringify(JSON.parse(v),null,2);
        else if(lang==='html'||lang==='xml')v=fmtHTML(v);
        else if(lang==='css')v=fmtCSS(v);
        else if(lang==='javascript')v=fmtJS(v);
        else{toast('该语言暂不支持格式化','warn');return}
        setVal(v);doPreview();toast('已格式化','ok')}catch(e){toast('格式化失败：内容存在语法错误','err')}}
    function setOrient(o){orient=o;wrap.style.flexDirection=o==='row'?'row':'column';
      split.style.width=o==='row'?'6px':'100%';split.style.height=o==='row'?'100%':'6px';split.style.cursor=o==='row'?'col-resize':'row-resize';
      $('[data-a="orient"]',b).innerHTML=icon('split')+(o==='row'?'左右分屏':'上下分屏');
      edPane.style.flexBasis='50%';pvPane.style.flexBasis='50%';cm&&setTimeout(()=>cm.refresh(),50)}
    function setView(v){view=v;['code','split','pv'].forEach(k=>$(`[data-a="v-${k}"]`,b).classList.toggle('on',(v==='preview'?'pv':v)===k));
      edPane.style.display=v==='preview'?'none':'';pvPane.style.display=v==='code'?'none':'';split.style.display=v==='split'?'':'none';
      if(v==='code')edPane.style.flexBasis='100%';if(v==='preview')pvPane.style.flexBasis='100%';
      if(v==='split'){edPane.style.flexBasis='50%';pvPane.style.flexBasis='50%'}
      cm&&setTimeout(()=>cm.refresh(),50);if(v!=='code')doPreview()}
    function updSt(){const v=getVal();let line=1,col=1,selN=0;
      if(cm){const c=cm.getCursor();line=c.line+1;col=c.ch+1;selN=cm.getSelection().length}
      $('.ed-st',b).innerHTML=`<span>行 ${line}, 列 ${col}</span>${selN?`<span style="color:var(--acc)">已选 ${selN} 字符</span>`:''}<span>${v.split('\n').length} 行</span><span>${v.length} 字符</span><span style="color:var(--jade)">${CM_LANGS[lang].label}</span><span>UTF-8</span><span style="margin-left:auto;color:${dirty?'var(--warn)':'var(--ok)'}">${dirty?'● 未保存':'✓ 已保存'}</span>`}
    function previewDoc(){const v=getVal();
      if(lang==='html')return v;
      if(lang==='xml')return v.trim().startsWith('<svg')||v.includes('<svg')?v:'<body style="background:#0d1716;color:#dcebe2;font-family:monospace"><pre>'+v.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></body>';
      if(lang==='css')return`<!DOCTYPE html><html><head><meta charset="utf-8"><style>${v}</style></head><body style="font-family:sans-serif;padding:24px;background:#0d1716;color:#dcebe2"><h1>标题预览</h1><p>段落文本 · <a href="#">链接样式</a></p><button>按钮</button><div class="box" style="margin-top:16px;padding:18px;border:1px solid #3fd8c2">.box 容器</div><ul><li>列表项一</li><li>列表项二</li></ul></body></html>`;
      if(lang==='javascript')return`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#0d1716;color:#dcebe2;font-family:monospace;padding:16px"><div style="color:#e6b455">JavaScript 运行输出：</div><pre id="__o" style="white-space:pre-wrap"></pre><script>const __p=(...a)=>{document.getElementById('__o').textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):x).join(' ')+'\\n'};console.log=__p;console.info=__p;console.warn=__p;try{${v}\n}catch(e){__p('[错误] '+e.message)}<\/script></body></html>`;
      if(lang==='markdown')return miniMD(v);
      if(lang==='json'){try{return'<body style="background:#0d1716;color:#3fd8c2;font-family:monospace;padding:16px"><pre>'+JSON.stringify(JSON.parse(v),null,2).replace(/</g,'&lt;')+'</pre></body>'}catch(e){return'<body style="background:#0d1716;color:#ff5f5f;font-family:monospace;padding:16px">JSON 语法错误：'+e.message+'</body>'}}
      return'<body style="background:#0d1716;color:#dcebe2;font-family:monospace;padding:16px"><pre>'+v.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></body>'}
    function doPreview(){if(view==='code')return;veil.style.opacity=1;veil.style.pointerEvents='auto';frame.srcdoc=previewDoc()}
    function queuePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(doPreview,550)}
    win.api.dispose=()=>{clearTimeout(previewTimer);if(cm){cm.getWrapperElement().remove();cm=null}fallbackTA=null};
  }
  return win}};
</script>
<script>
/* ================= 玄枢 · 漫画阅读器 / 浏览器 / v86 ================= */
'use strict';
APPS.manga={name:'漫画阅读',icon:'manga',open({path}={}){
  let urls=[],wraps=[],raf=0,fsActive=false,loaded=0,total=0,fitW=true;
  const win=wm.create('manga',{title:'漫画阅读',icon:'manga',w:860,h:680,sub:path?fs.nameOf(path):'',build});
  let scroller,stageEl;
  async function build(b){
    b.innerHTML=`<div class="toolbar mg-tb">
      <button class="tbtn" data-a="viewer">${icon('image')}单图模式</button>
      <button class="tbtn" data-a="width">${icon('fit')}适合宽度</button>
      <button class="tbtn" data-a="fs">${icon('fit')}全屏沉浸</button>
      <button class="tbtn" data-a="top">${icon('up')}回到顶部</button>
      <span style="flex:1"></span><span class="mg-pos" style="font-size:11px;color:var(--dim);font-family:var(--f-mono)"></span></div>
      <div class="mg-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;background:#000;overscroll-behavior-y:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;contain:layout style;position:relative;cursor:grab">
        <div class="mg-stage" style="display:flex;flex-direction:column;align-items:center;gap:0;min-height:100%"></div></div>
      <div class="loading-veil mg-veil"><div class="box"><div class="spin"></div><span class="mg-load">提取同目录图片…</span></div></div>
      <button class="mg-exit" title="退出全屏" style="position:absolute;top:10px;right:12px;z-index:99;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center;opacity:.28;transition:opacity .2s;border:1px solid rgba(255,255,255,.25)">${icon('x')}</button>`;
    scroller=$('.mg-scroll',b);stageEl=$('.mg-stage',b);
    const exitBtn=$('.mg-exit',b);
    exitBtn.onmouseenter=()=>exitBtn.style.opacity=1;exitBtn.onmouseleave=()=>exitBtn.style.opacity=.28;
    if(!path){$('.mg-veil',b).querySelector('.box').innerHTML='请从文件管理器打开一张图片';return}
    const dir=fs.parentOf(path);let list;
    try{list=(await fs.readdir(dir)).filter(x=>!x.dir&&IMG_EXT.includes(extOf(x.name))).sort((a,c)=>natCmp(a.name,c.name))}
    catch(e){$('.mg-veil',b).querySelector('.box').innerHTML='目录读取失败：'+esc(e.message);toast('漫画目录读取失败','err');return}
    if(!list.length)list=[{path,name:fs.nameOf(path)}];
    total=list.length;const targetIdx=Math.max(0,list.findIndex(x=>x.path===path));
    win.setSub(`${dir} · ${total} 页`);
    /* 先按序建立骨架占位，再并行读取、就位填充 */
    list.forEach((it,i)=>{const wp=el('div','mg-page');wp.dataset.i=i;
      wp.style.cssText=`width:min(100%,860px);aspect-ratio:3/4;position:relative;flex:none;background:#050505;display:grid;place-items:center`;
      wp.innerHTML=`<div class="spin" style="opacity:.5"></div>`;stageEl.appendChild(wp);wraps.push(wp)});
    let scrolled=false;
    const jobs=list.map(async(it,i)=>{
      try{const blob=await fs.readFile(it.path);const u=URL.createObjectURL(blob);urls[i]=u;
        await new Promise(res=>{const wp=wraps[i];const img=new Image();img.decoding='async';
          img.style.cssText='width:100%;display:block;user-select:none;-webkit-user-drag:none';
          img.onload=()=>{const before=wp.offsetHeight;const wasAbove=wp.offsetTop<scroller.scrollTop;
            wp.style.aspectRatio='';wp.innerHTML='';wp.appendChild(img);
            const delta=wp.offsetHeight-before;if(wasAbove&&delta)scroller.scrollTop+=delta; /* 高度补偿：阅读画面零跳动 */
            res()};
          img.onerror=()=>{wp.style.aspectRatio='16/6';wp.innerHTML=`<div style="color:#666;font-size:12px;padding:20px">第 ${i+1} 页读取失败 · ${esc(it.name)}</div>`;res()};
          img.src=u})}
      catch(e){wraps[i].innerHTML=`<div style="color:#666;font-size:12px;padding:20px">第 ${i+1} 页读取失败</div>`}
      loaded++;$('.mg-load',b)&&($('.mg-load',b).textContent=`加载 ${loaded}/${total}`);
      if(i===targetIdx&&!scrolled){scrolled=true;requestAnimationFrame(()=>{scroller.scrollTop=wraps[i].offsetTop;$('.mg-veil',b).style.opacity=0;$('.mg-veil',b).style.pointerEvents='none'})}
      if(loaded===total){const v=$('.mg-veil',b);v.style.opacity=0;v.style.pointerEvents='none';updPos()}
    });
    await Promise.all(jobs);
    function updPos(){let cur=0;for(let i=0;i<wraps.length;i++){if(wraps[i].offsetTop<=scroller.scrollTop+40)cur=i}
      $('.mg-pos',b).textContent=`第 ${cur+1} / ${total} 页 · ${list[cur]?list[cur].name:''}`;win.setTitle(list[cur]?list[cur].name:'漫画阅读')}
    scroller.addEventListener('scroll',()=>{updPos()},{passive:true});
    /* PC 手抓拖拽 + 0.96 摩擦惯性（单例 rAF） */
    let vel=0,lastY=0,dragging=false,inertia=0;
    const stopInertia=()=>{if(inertia){cancelAnimationFrame(inertia);inertia=0}};
    const glide=()=>{if(Math.abs(vel)<.3){inertia=0;return}scroller.scrollTop+=vel;vel*=0.96;inertia=requestAnimationFrame(glide)};
    scroller.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||fsLockIgnore(e))return;stopInertia();dragging=true;lastY=e.clientY;vel=0;scroller.setPointerCapture(e.pointerId);scroller.style.cursor='grabbing'});
    const fsLockIgnore=()=>false;
    scroller.addEventListener('pointermove',e=>{if(!dragging)return;const dy=e.clientY-lastY;lastY=e.clientY;scroller.scrollTop-=dy;vel=-dy});
    const upH=()=>{if(!dragging)return;dragging=false;scroller.style.cursor='grab';stopInertia();inertia=requestAnimationFrame(glide)};
    scroller.addEventListener('pointerup',upH);scroller.addEventListener('pointercancel',upH);
    scroller.addEventListener('wheel',stopInertia,{passive:true});
    /* 全屏沉浸：隐藏标题栏，仅留右上退出 */
    let preFsCss='';
    const enterFS=async()=>{fsActive=true;preFsCss=win.el.style.cssText;win.el.classList.add('manga-fs');win.tb.style.display='none';$('.mg-tb',b).style.display='none';exitBtn.style.display='grid';
      try{await win.el.requestFullscreen()}catch(e){win.el.style.cssText+=';position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;border-radius:0'}};
    const exitFS=async()=>{if(!fsActive)return;fsActive=false;win.el.classList.remove('manga-fs');win.tb.style.display='';$('.mg-tb',b).style.display='';exitBtn.style.display='none';
      if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}
      win.el.style.cssText=preFsCss;wm.focus(win.id)};
    const onFsc=()=>{if(!document.fullscreenElement&&fsActive)exitFS()};
    document.addEventListener('fullscreenchange',onFsc);
    exitBtn.onclick=exitFS;
    b.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
      if(a==='viewer'){launch('viewer',{path:list[Math.max(0,wraps.findIndex(w=>w.offsetTop>=scroller.scrollTop-40))]?.path||path});win.close()}
      else if(a==='width'){fitW=!fitW;wraps.forEach(w=>w.style.width=fitW?'min(100%,860px)':'100%');t.classList.toggle('on',!fitW)}
      else if(a==='fs')enterFS();
      else if(a==='top')scroller.scrollTo({top:0,behavior:'smooth'})});
    win.api.dispose=()=>{stopInertia();document.removeEventListener('fullscreenchange',onFsc);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});urls.forEach(u=>u&&setTimeout(()=>URL.revokeObjectURL(u),2000))};
  }
  return win}};
/* ---------- 网页浏览器 ---------- */
APPS.browser={name:'网页浏览',icon:'globe',open({path,url:startURL}={}){
  let hist=[],hi=-1,objURL=null;
  const win=wm.create('browser',{title:'网页浏览',icon:'globe',w:1000,h:660,sub:'玄枢起始页',build});
  async function build(b){
    b.innerHTML=`<div class="toolbar">
      <button class="tbtn" data-a="back">${icon('back')}后退</button><button class="tbtn" data-a="fwd">${icon('fwd')}前进</button>
      <button class="tbtn" data-a="refresh">${icon('refresh')}刷新</button><button class="tbtn" data-a="home">${icon('home')}主页</button>
      <input class="bw-addr" placeholder="输入网址，或虚拟路径如 /desktop/页面.html" style="flex:1;min-width:120px;font-family:var(--f-mono);font-size:12px">
      <button class="tbtn" data-a="go">${icon('fwd')}前往</button>
      <button class="tbtn" data-a="file">${icon('folderOpen')}虚拟文件</button>
      <button class="tbtn" data-a="tab">${icon('external')}新标签</button></div>
      <div style="flex:1;position:relative;background:var(--bg1)">
        <iframe class="bw-frame" style="width:100%;height:100%;border:none;background:var(--bg1)" title="网页"></iframe>
        <div class="loading-veil bw-veil"><div class="box"><div class="spin"></div><span class="bw-msg">正在载入</span></div></div></div>`;
    const frame=$('.bw-frame',b),addr=$('.bw-addr',b),veil=$('.bw-veil',b),msg=$('.bw-msg',b);
    let slowT=0;
    frame.addEventListener('load',()=>{veil.style.opacity=0;veil.style.pointerEvents='none';clearTimeout(slowT)});
    const homeDoc=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(80% 100% at 50% 0%,#123029,#08110f);font-family:'Noto Sans SC',sans-serif;color:#dcebe2}main{text-align:center;padding:20px}h1{font-size:40px;letter-spacing:14px;color:#ff5a3c;font-weight:400;margin:0 0 6px}p{color:#8fa89d;letter-spacing:4px;margin:0 0 28px}form{display:flex;gap:8px;justify-content:center}input{width:min(420px,70vw);padding:12px 16px;border-radius:10px;border:1px solid #2a8f7e;background:#0c1b19;color:#dcebe2;font-size:15px;outline:none}button{padding:12px 22px;border-radius:10px;border:none;background:#ff5a3c;color:#fff;font-size:15px;cursor:pointer}nav{margin-top:30px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}a{color:#3fd8c2;text-decoration:none;border:1px solid #1d4a42;padding:8px 18px;border-radius:8px;font-size:13px}a:hover{border-color:#3fd8c2}</style></head><body><main><h1>玄枢</h1><p>XUANSHU · 观 澜</p><form action="https://www.bing.com/search" method="get"><input name="q" placeholder="搜索万象…"><button>探</button></form><nav><a href="https://zh.wikipedia.org">维基百科</a><a href="https://www.bing.com">必应</a><a href="https://developer.mozilla.org/zh-CN/">MDN</a><a href="https://example.com">Example</a></nav></main></body></html>`;
    function showVeil(t){msg.textContent=t;veil.style.opacity=1;veil.style.pointerEvents='auto';clearTimeout(slowT);
      slowT=setTimeout(()=>{msg.innerHTML='仍在载入…<br><span style="font-size:10px;color:var(--faint)">部分网站拒绝内嵌 (X-Frame-Options)，可尝试「新标签」</span>'},6000)}
    async function go(target,push=true){
      if(target==='home'){if(objURL){URL.revokeObjectURL(objURL);objURL=null}showVeil('正在载入');frame.srcdoc=homeDoc;addr.value='';win.setSub('玄枢起始页');if(push){hist=hist.slice(0,hi+1);hist.push('home');hi++}return}
      if(target.startsWith('/')){try{showVeil('读取虚拟文件');const blob=await fs.readFile(target);if(objURL)URL.revokeObjectURL(objURL);objURL=URL.createObjectURL(new Blob([blob],{type:mimeOf(target)}));frame.removeAttribute('srcdoc');frame.src=objURL;addr.value=target;win.setSub(fs.nameOf(target));if(push){hist=hist.slice(0,hi+1);hist.push(target);hi++}}catch(e){toast(e.message,'err');veil.style.opacity=0}return}
      let u=target;if(!/^https?:\/\//i.test(u))u='https://'+u;
      showVeil('正在载入 '+u);frame.removeAttribute('srcdoc');frame.src=u;addr.value=u;win.setSub(u);
      if(push){hist=hist.slice(0,hi+1);hist.push(u);hi++}}
    addr.addEventListener('keydown',e=>{if(e.key==='Enter')go(addr.value.trim())});
    b.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
      if(a==='go')go(addr.value.trim());
      else if(a==='back'&&hi>0){hi--;go(hist[hi],false)}
      else if(a==='fwd'&&hi<hist.length-1){hi++;go(hist[hi],false)}
      else if(a==='refresh'){if(hist[hi])go(hist[hi],false)}
      else if(a==='home')go('home');
      else if(a==='tab'){const cur=hist[hi];if(cur&&cur.startsWith('http'))window.open(cur,'_blank');else{const u=URL.createObjectURL(new Blob([frame.srcdoc||''],{type:'text/html'}));window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}}
      else if(a==='file'){const p=await ui.prompt('打开虚拟文件（完整路径）','/desktop/');if(p)go(p)}});
    if(path)go(path);else if(startURL)go(startURL);else go('home');
    win.api.dispose=()=>{clearTimeout(slowT);if(objURL)setTimeout(()=>URL.revokeObjectURL(objURL),3000)};
  }
  return win}};
/* ---------- v86 虚拟机（版本锁定 0.5.319） ---------- */
const V86_CDN={js:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',vga:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'};
APPS.v86={name:'虚拟机',icon:'chip',open({path}={}){
  let emu=null,imgPath=path||null,imgBuf=null;
  const win=wm.create('v86',{title:'虚拟机 · v86',icon:'chip',w:900,h:640,sub:'x86 模拟',build});
  async function build(b){
    b.innerHTML=`<div class="toolbar">
      <button class="tbtn" data-a="pick">${icon('folderOpen')}选择镜像</button>
      <button class="tbtn" data-a="import">${icon('upload')}导入镜像</button>
      <select class="vm-dev" style="padding:4px 6px;font-size:12px"><option value="auto">挂载: 自动</option><option value="cdrom">CD-ROM (.iso)</option><option value="fda">软驱 (.img)</option><option value="hda">硬盘</option></select>
      <select class="vm-mem" style="padding:4px 6px;font-size:12px"><option value="128">内存 128M</option><option value="64">64M</option><option value="256">256M</option><option value="512">512M</option></select>
      <button class="tbtn" data-a="start" style="color:var(--ok)">${icon('play')}启动</button>
      <button class="tbtn" data-a="stop" style="color:var(--err)">${icon('pause')}停止</button>
      <span class="tsep"></span>
      <button class="tbtn" data-a="lock">${icon('lock')}鼠标锁定</button>
      <button class="tbtn" data-a="cad">Ctrl+Alt+Del</button>
      <button class="tbtn" data-a="fs">${icon('fit')}全屏</button></div>
      <div class="vm-screen" style="flex:1;background:#000;position:relative;overflow:hidden;display:grid;place-items:center">
        <div class="screen_container" style="position:relative"><div style="white-space:pre;font:14px monospace;line-height:14px;color:#aaa"></div><canvas style="display:none"></canvas></div>
        <div class="vm-hint" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,8,8,.92);z-index:5"><div style="text-align:center;max-width:420px;padding:20px">
          <div style="color:var(--gold);margin-bottom:14px">${icon('chip','width:44px;height:44px;margin:0 auto;stroke-width:1.1')}</div>
          <div style="font-family:var(--f-disp);font-size:18px;letter-spacing:3px;margin-bottom:10px">x86 虚拟机就绪</div>
          <p style="font-size:12px;color:var(--dim);line-height:1.9">选择或导入你自己的磁盘镜像（.iso / .img / .bin），<br>系统将按后缀自动挂载到 CD-ROM / 软驱 / 硬盘。<br>镜像仅在本机 OPFS 中读取，不经网络。<br><span style="color:var(--faint)">进入系统后点「鼠标锁定」捕获指针，Esc 释放。</span></p></div></div>
        <div class="loading-veil vm-veil" style="opacity:0;pointer-events:none"><div class="box"><div class="spin"></div><span class="vm-msg">加载模拟引擎</span></div></div></div>
      <div class="statusbar"><span class="vm-st">未启动</span><span style="margin-left:auto">v86 0.5.319 · JS/WASM/BIOS 版本锁定</span></div>`;
    const screen=$('.screen_container',b),veil=$('.vm-veil',b),hint=$('.vm-hint',b),st=$('.vm-st',b);
    async function pickImg(){const cands=[];for(const d of['/downloads','/desktop','/documents']){try{for(const f of await fs.readdir(d))if(['iso','img','bin','ima','fda'].includes(extOf(f.name)))cands.push(f)}catch(e){}}
      if(!cands.length){toast('虚拟磁盘常见目录中没有镜像，请先导入','warn');return}
      showMenu(cands.slice(0,12).map(f=>({label:f.name+' · '+fmtSize(f.size),icon:'hdd',fn:()=>{imgPath=f.path;win.setSub(f.name);st.textContent='已选择 '+f.name}})),innerWidth/2-100,innerHeight/2-100)}
    async function start(){
      if(emu){toast('虚拟机已在运行，请先停止','warn');return}
      if(!imgPath){toast('请先选择或导入镜像文件','warn');return}
      try{
        veil.style.opacity=1;veil.style.pointerEvents='auto';$('.vm-msg',b).textContent='读取镜像…';
        imgBuf=await fs.readBuffer(imgPath);
        $('.vm-msg',b).textContent='加载模拟引擎 (v86.wasm)…';
        await loadJS(V86_CDN.js);
        if(!window.V86)throw new Error('libv86 加载失败');
        hint.style.display='none';screen.innerHTML='<div style="white-space:pre;font:14px monospace;line-height:14px;color:#aaa"></div><canvas style="display:none"></canvas>';
        const devSel=$('.vm-dev',b).value;const e=extOf(imgPath);
        const dev=devSel!=='auto'?devSel:(e==='iso'?'cdrom':(['img','fda','bin','ima'].includes(e)?'fda':'hda'));
        const cfg={wasm_path:V86_CDN.wasm,bios:{url:V86_CDN.bios},vga_bios:{url:V86_CDN.vga},memory_size:(+$('.vm-mem',b).value)*1024*1024,vga_memory_size:8*1024*1024,screen_container:screen,autostart:true};
        cfg[dev]={buffer:imgBuf};   /* 仅使用本地 buffer，禁止 url 直载外部镜像 */
        emu=new window.V86(cfg);
        emu.add_listener('emulator-ready',()=>{st.textContent='运行中 · '+fs.nameOf(imgPath)+' → '+dev;veil.style.opacity=0;veil.style.pointerEvents='none';snd('ok')});
        setTimeout(()=>{if(emu){veil.style.opacity=0;veil.style.pointerEvents='none'}},9000);
        st.textContent='引导中…';
      }catch(err){veil.style.opacity=0;veil.style.pointerEvents='none';hint.style.display='grid';toast('虚拟机启动失败：'+err.message,'err');st.textContent='启动失败'}}
    function stop(){if(!emu)return;try{emu.stop();emu.destroy&&emu.destroy()}catch(e){}emu=null;st.textContent='已停止';hint.style.display='grid';if(document.pointerLockElement)document.exitPointerLock()}
    b.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
      if(a==='pick')pickImg();
      else if(a==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.iso,.img,.bin,.ima,.fda';
        inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const pt=progressToast('导入镜像…');await fs.writeFile('/downloads/'+f.name,await f.arrayBuffer(),{mtime:f.lastModified});imgPath='/downloads/'+f.name;pt.done('镜像已导入');win.setSub(f.name);st.textContent='已选择 '+f.name};inp.click()}
      else if(a==='start')start();else if(a==='stop')stop();
      else if(a==='lock'){if(!emu){toast('请先启动虚拟机','warn');return}try{screen.requestPointerLock();toast('鼠标已锁定，按 Esc 释放')}catch(err){toast('指针锁定失败','err')}}
      else if(a==='cad'){if(emu){emu.keyboard_send_scancodes([0x1d,0x38,0x53,0xd3,0xb8,0x9d]);toast('已发送 Ctrl+Alt+Del')}}
      else if(a==='fs'){const sc=$('.vm-screen',b);document.fullscreenElement?document.exitFullscreen():sc.requestFullscreen().catch(()=>{})}});
    win.api.dispose=stop;
  }
  return win}};
</script>
<script>
/* ================= 玄枢 · 系统设置 ================= */
'use strict';
const defaultDir=sub=>(S.backend==='idb'?'/idb/':'/')+sub;
APPS.settings={name:'系统设置',icon:'gear',open({sec}={}){
  const win=wm.create('settings',{title:'系统设置',icon:'gear',w:880,h:620,build});
  async function build(b){
    b.innerHTML=`<div style="flex:1;display:flex;overflow:hidden">
      <div class="set-nav" style="width:150px;flex:none;border-right:1px solid var(--line);padding:10px 6px;overflow-y:auto;background:rgba(0,0,0,.1)"></div>
      <div class="set-body" style="flex:1;overflow-y:auto;padding:18px 22px"></div></div>`;
    const nav=$('.set-nav',b),bodyEl=$('.set-body',b);
    const SECS=[['look','外观','paint'],['wall','壁纸','image'],['desk','桌面与任务栏','monitor'],['storage','存储','hdd'],['sys','系统','info']];
    SECS.forEach(([id,n,ic])=>{const btn=el('button','tbtn',`${icon(ic)}${n}`);btn.style.cssText='width:100%;justify-content:flex-start;margin-bottom:2px';btn.dataset.s=id;
      btn.onclick=()=>{show(id);$$('.tbtn',nav).forEach(x=>x.classList.toggle('on',x===btn))};nav.appendChild(btn)});
    const row=(label,ctrl,hint='')=>`<div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><div style="font-size:13.5px">${label}</div>${hint?`<div style="font-size:11px;color:var(--faint);margin-top:2px">${hint}</div>`:''}</div>${ctrl}</div>`;
    const seg=(id,opts,val)=>`<span class="seg" data-k="${id}" style="display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden">${opts.map(([v,n])=>`<button data-v="${v}" class="tbtn" style="border-radius:0;${v===val?'background:var(--acc);color:#fff':''}">${n}</button>`).join('')}</span>`;
    const tog=(k,v)=>`<button class="tog tbtn ${v?'on':''}" data-k="${k}" style="min-width:56px;justify-content:center">${v?'开':'关'}</button>`;
    function show(id){
      if(id==='look')bodyEl.innerHTML=`<h4 class="sec">主题与色彩</h4>
        ${row('明暗模式','<span>'+seg('theme',[['dark','墨玉 · 深'],['light','宣纸 · 浅']],S.theme)+'</span>','深色为玄枢默认气韵；浅色为独立宣纸配色，非简单反色')}
        ${row('主题印章色',`<span style="display:flex;gap:8px">${[['cinnabar','#ff5a3c','朱砂'],['jade','#2fd6b5','青金'],['gold','#f0b64a','鎏金'],['azure','#57b6ff','雪青']].map(([k,c,n])=>`<button class="accsw" data-k="${k}" title="${n}" style="width:30px;height:30px;border-radius:50%;background:${c};border:3px solid ${S.acc===k?'var(--ink)':'transparent'};cursor:pointer"></button>`).join('')}</span>`)}
        ${row('窗口圆角',`<input type="range" class="rng" data-k="radius" min="0" max="22" value="${S.radius}" style="width:150px;padding:0"><b class="radius-v" style="font-family:var(--f-mono);font-size:12px;width:40px">${S.radius}px</b>`,'0 为凌厉直角')}
        ${row('界面字号',`<input type="range" class="rng" data-k="fontSize" min="12" max="18" value="${S.fontSize}" style="width:150px;padding:0">`)}
        ${row('窗口与菜单动画',tog('anim',S.anim))}
        ${row('系统音效',tog('sound',S.sound),'开启/关闭全部界面音效（与托盘同步）')}`;
      else if(id==='wall'){bodyEl.innerHTML=`<h4 class="sec">壁纸 · 内置四景</h4><div class="wall-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px"></div>
        <h4 class="sec">自定义</h4><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="upwall">${icon('upload')}上传本地图片</button><button class="btn" data-a="vfsimg">${icon('image')}从虚拟文件选择</button></div>
        <p style="font-size:11px;color:var(--faint);margin-top:10px">上传的图片将持久保存于 OPFS 的 /.system/wallpapers，重启不丢失。也可在文件管理器中右键任意图片「设为壁纸」。</p>`;
        const g=$('.wall-grid',bodyEl);
        Object.entries(WALLS).forEach(([id2,w])=>{const c=el('button','',`<img src="data:image/svg+xml,${encodeURIComponent(w.make())}" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:2px solid ${S.wall.type==='preset'&&S.wall.id===id2?'var(--acc)':'var(--line2)'}"><div style="font-size:12px;margin-top:6px;color:var(--dim)">${w.name}</div>`);
          c.style.cssText='background:none;text-align:center';c.onclick=()=>{S.wall={type:'preset',id:id2};S.save();applyWall();show('wall');toast('壁纸：'+w.name,'ok')};g.appendChild(c)});
        $('[data-a="upwall"]',bodyEl).onclick=()=>{const inp=$('#wall-pick');inp.onchange=async()=>{const f=inp.files[0];if(!f)return;await fs.mkdir('/.system/wallpapers');const p=await fs.unique('/.system/wallpapers/'+f.name);await fs.writeFile(p,await f.arrayBuffer(),{mtime:f.lastModified});S.wall={type:'file',path:p};S.save();applyWall();toast('自定义壁纸已应用并持久保存','ok');inp.value=''};inp.click()};
        $('[data-a="vfsimg"]',bodyEl).onclick=async()=>{const p=await ui.prompt('图片的虚拟路径','/pictures/');if(p&&await fs.exists(p)){S.wall={type:'file',path:p};S.save();applyWall();toast('壁纸已更新','ok')}};}
      else if(id==='desk')bodyEl.innerHTML=`<h4 class="sec">时间与显示</h4>
        ${row('时钟制式',seg('clock24',[['0','12 小时制'],['1','24 小时制']],S.clock24?'1':'0'))}
        ${row('显示隐藏文件',tog('showHidden',S.showHidden),'以 . 开头的文件与文件夹')}
        ${row('图片缩略图',tog('thumbs',S.thumbs),'桌面与图标视图按需懒加载')}
        ${row('删除前确认',tog('confirmDel',S.confirmDel))}
        <h4 class="sec">隐藏系统应用</h4><p style="font-size:11px;color:var(--faint);margin-bottom:8px">勾选后将从开始菜单与桌面入口隐藏（文件与功能不受影响）</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px">${MENU_APPS.map(id2=>`<label style="display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" class="hideapp" data-app="${id2}" ${S.hiddenApps.includes(id2)?'checked':''} style="accent-color:var(--acc)">${icon(APPS[id2].icon,'width:15px;height:15px;color:var(--jade)')}${APPS[id2].name}</label>`).join('')}</div>`;
      else if(id==='storage'){bodyEl.innerHTML=`<h4 class="sec">存储总览</h4><div class="sto-total"><div class="spin"></div></div>
        <h4 class="sec">空间占用分布（实际递归统计）</h4><div class="sto-break"></div>
        <h4 class="sec">存储后端</h4>
        ${row('新文件默认后端',seg('backend',[['opfs','OPFS 主盘'],['idb','IndexedDB 索引库']],S.backend),'两个后端同时可见：文件管理侧栏「玄枢盘」与「索引库」，可互相拖拽移动')}
        <div class="sto-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px"></div>
        <h4 class="sec">本地文件夹挂载</h4><div class="sto-mounts"></div>
        <div style="display:flex;gap:10px;margin-top:10px"><button class="btn" data-a="mount">${icon('mount')}挂载新文件夹</button><button class="btn" data-a="recalc">${icon('refresh')}重新统计</button></div>`;
        drawStorage();
        $('[data-a="mount"]',bodyEl).onclick=async()=>{if(!window.showDirectoryPicker){toast('此浏览器不支持 File System Access API','warn');return}try{const h=await showDirectoryPicker({mode:'readwrite'});await fs.mountLocal(h);drawStorage();toast('挂载成功','ok')}catch(e){if(e.name!=='AbortError')toast(e.message,'err')}};
        $('[data-a="recalc"]',bodyEl).onclick=()=>drawStorage();}
      else if(id==='sys')bodyEl.innerHTML=`<h4 class="sec">关于玄枢</h4>
        <div style="display:flex;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--jade-soft)">${sealSVG(52)}<div><div style="font-family:var(--f-disp);font-size:22px;letter-spacing:5px">玄枢 · XUANSHU</div><div style="font-size:11px;color:var(--dim);margin-top:4px">墨玉为底 · 朱砂为印 · 青金为脉 · 鎏金为线</div></div></div>
        <div style="font-size:12.5px;color:var(--dim);line-height:2.1;margin-top:12px">
        内核：OPFS + IndexedDB 双后端统一 VFS · File System Access 本地挂载<br>
        持久化：文件 / 元数据 / 壁纸 / 布局 / 设置 全部本机保存，刷新不丢失<br>
        修改日期：移动 / 重命名 / 复制全程保留原始时间戳<br>
        压缩：ZIP (JSZip·时区修正) / TAR / GZ / TGZ (原生流) / 7z (wasm 按需)<br>
        编辑：CodeMirror 5.65 · 模拟：v86 0.5.319（版本锁定）</div>
        <h4 class="sec" style="color:var(--err)">危险区</h4>
        ${row('一键重置系统','<button class="btn danger" data-a="reset">清空并重置</button>','删除全部虚拟文件、挂载记录与设置，恢复出厂')}`;
      bindCommon();
      if(id==='sys')$('[data-a="reset"]',bodyEl).onclick=async()=>{if(await ui.confirm('重置系统','所有数据将被清除且不可恢复。确定重置？',true))fs.reset()};
      if(id==='desk')$$('.hideapp',bodyEl).forEach(c=>c.onchange=()=>{const a=c.dataset.app;if(c.checked){if(!S.hiddenApps.includes(a))S.hiddenApps.push(a)}else S.hiddenApps=S.hiddenApps.filter(x=>x!==a);S.save();renderDesktop()});
    }
    function bindCommon(){
      $$('.seg .tbtn',bodyEl).forEach(btn=>btn.onclick=()=>{const k=btn.parentElement.dataset.k,v=btn.dataset.v;
        if(k==='clock24')S.clock24=v==='1';else S[k]=v;S.save();applyTheme();emit('settings-sync');
        if(k==='theme'||k==='backend')renderDesktop();
        $$('.tbtn',btn.parentElement).forEach(x=>{x.style.background=x===btn?'var(--acc)':'';x.style.color=x===btn?'#fff':''});snd('tap')});
      $$('.tog',bodyEl).forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k;S[k]=!S[k];S.save();btn.classList.toggle('on',S[k]);btn.textContent=S[k]?'开':'关';applyTheme();emit('settings-sync');
        if(k==='showHidden'||k==='thumbs')renderDesktop()});
      $$('.rng',bodyEl).forEach(r=>r.oninput=()=>{S[r.dataset.k]=+r.value;S.save();applyTheme();const v=$('.radius-v',bodyEl);if(v&&r.dataset.k==='radius')v.textContent=r.value+'px'});
      $$('.accsw',bodyEl).forEach(sw=>sw.onclick=()=>{S.acc=sw.dataset.k;S.save();applyTheme();$$('.accsw',bodyEl).forEach(x=>x.style.borderColor=x===sw?'var(--ink)':'transparent')});
    }
    const PALETTE=['#ff5a3c','#3fd8c2','#e6b455','#5ab8ff','#5ad68a','#b48cff','#ff8ad4','#8fa89d'];
    async function drawStorage(){
      const total=$('.sto-total',bodyEl),brk=$('.sto-break',bodyEl),cards=$('.sto-cards',bodyEl),mnt=$('.sto-mounts',bodyEl);
      if(!total)return;
      try{
        const est=await fs.estimate();const pct=est.quota?Math.min(100,est.usage/est.quota*100):0;
        total.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>已用 <b style="color:var(--acc)">${fmtSize(est.usage||0)}</b></span><span style="color:var(--dim)">浏览器配额 ${fmtSize(est.quota||0)}</span></div>
        <div style="height:14px;border-radius:8px;background:var(--bg0);border:1px solid var(--line);overflow:hidden"><div style="height:100%;width:${Math.max(pct,1)}%;background:linear-gradient(90deg,var(--jade),var(--acc));border-radius:8px;transition:width .6s"></div></div>
        <div style="font-size:10px;color:var(--faint);margin-top:4px">占用率 ${pct.toFixed(2)}%（含系统其它数据）</div>`;
        brk.innerHTML='<div class="spin"></div>';
        const roots=[['/desktop','桌面'],['/documents','文档'],['/pictures','图片'],['/music','音乐'],['/downloads','下载'],['/videos','视频'],['/idb','索引库'],['/.system','系统资源']];
        const sizes=await Promise.all(roots.map(async([p])=>{try{return await fs.du(p)}catch(e){return 0}}));
        const sum=sizes.reduce((a,c)=>a+c,0)||1;
        brk.innerHTML=`<div style="display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--line)">${sizes.map((s,i)=>s?`<div title="${roots[i][1]} ${fmtSize(s)}" style="width:${s/sum*100}%;background:${PALETTE[i]};min-width:3px"></div>`:'').join('')||'<div style="flex:1;background:var(--bg0)"></div>'}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px">${roots.map(([p,n],i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer" data-p="${p}"><span style="width:10px;height:10px;border-radius:3px;background:${PALETTE[i]};flex:none"></span><span style="flex:1">${n}</span><b style="font-family:var(--f-mono);font-size:11px;color:var(--dim)">${fmtSize(sizes[i])}</b></div>`).join('')}</div>`;
        $$('[data-p]',brk).forEach(n=>n.onclick=()=>launch('explorer',{path:n.dataset.p}));
        const idb=await fs.idbUsage();
        const lsBytes=Object.keys(localStorage).reduce((s,k)=>s+k.length+(localStorage.getItem(k)||'').length,0)*2;
        cards.innerHTML=[
          ['OPFS 主盘',fs.hasOPFS()?'已就绪':'不可用',fs.hasOPFS()?'var(--ok)':'var(--err)','/'],
          ['IndexedDB 索引库',`${idb.count} 条记录 · ${fmtSize(idb.bytes)}`,'var(--jade)','/idb'],
          ['localStorage',fmtSize(lsBytes)+' · 设置/布局','var(--gold)',null],
          ['Cookie','引导标记 · '+ (document.cookie?document.cookie.length+' B':'空'),'var(--info)',null],
        ].map(([n,v,c,p])=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;${p?'cursor:pointer':''}" ${p?`data-p="${p}"`:''}><div style="font-size:11px;color:var(--faint)">${n}</div><div style="font-size:13px;margin-top:5px;color:${c}">${v}</div></div>`).join('');
        $$('[data-p]',cards).forEach(n=>n.onclick=()=>launch('explorer',{path:n.dataset.p}));
        const ms=fs.listMounts();
        mnt.innerHTML=(ms.length?ms.map(n=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px">${icon('mount','width:15px;height:15px;color:var(--jade)')}<span style="flex:1">${esc(n)}</span><button class="btn sm" data-open="${esc(n)}">打开</button><button class="btn sm danger" data-un="${esc(n)}">卸载</button></div>`).join(''):'<p style="font-size:12px;color:var(--faint)">尚未挂载本地文件夹</p>')
        +(fs.pendingMounts.length?`<p style="font-size:11px;color:var(--warn);margin-top:6px">有 ${fs.pendingMounts.length} 个此前挂载的文件夹等待重新授权</p><button class="btn sm" data-a="resume" style="margin-top:6px">${icon('lock')}重新授权</button>`:'');
        $$('[data-un]',mnt).forEach(x=>x.onclick=async()=>{await fs.unmount(x.dataset.un);drawStorage();toast('已卸载','ok')});
        $$('[data-open]',mnt).forEach(x=>x.onclick=()=>launch('explorer',{path:'/mnt/local/'+x.dataset.open}));
        const rs=$('[data-a="resume"]',mnt);if(rs)rs.onclick=async()=>{for(const it of[...fs.pendingMounts]){try{await fs.resumeMount(it);fs.pendingMounts=fs.pendingMounts.filter(x=>x!==it)}catch(e){toast(it.name+'：'+e.message,'warn')}}drawStorage()};
      }catch(e){total.innerHTML='<span style="color:var(--err)">统计失败：'+esc(e.message)+'</span>'}
    }
    show(sec&&SECS.some(s=>s[0]===sec)?sec:'look');
    $$('.tbtn',nav).forEach(x=>x.classList.toggle('on',x.dataset.s===(sec||'look')));
    on('fs-mounts',()=>{});
  }
  return win}};
</script>
<script>
/* ================= 玄枢 · 引导与初章 ================= */
'use strict';
function setCookie(k,v,days){document.cookie=`${k}=${v};max-age=${days*86400};path=/;SameSite=Lax`}
async function seedComicPage(pageNo,title){
  const cv=document.createElement('canvas');cv.width=760;cv.height=1080;const c=cv.getContext('2d');
  c.fillStyle='#f2ebd9';c.fillRect(0,0,760,1080);
  c.strokeStyle='rgba(60,60,50,.08)';for(let i=0;i<40;i++){c.beginPath();c.moveTo(0,i*28+((pageNo*13)%28));c.lineTo(760,i*28);c.stroke()}
  const layers=[['#2c3a34',.9,620],['#4a5a50',.65,720],['#75846f',.4,830]];
  layers.forEach(([col,op,base],li)=>{c.fillStyle=col;c.globalAlpha=op;c.beginPath();c.moveTo(0,1080);c.lineTo(0,base);
    for(let x=0;x<=760;x+=40){const y=base-Math.abs(Math.sin(x*.011+pageNo*2+li*5))*(150-li*36)-Math.sin(x*.03+li)*24;c.lineTo(x,y)}
    c.lineTo(760,1080);c.closePath();c.fill()});
  c.globalAlpha=1;c.fillStyle='#d63a1f';c.beginPath();c.arc(560-pageNo*60,200+pageNo*30,64,0,7);c.fill();
  c.fillStyle='#22322c';c.font='700 120px "ZCOOL XiaoWei",serif';c.fillText(['壹','贰','叁'][pageNo-1]||pageNo,70,190);
  c.font='34px "ZCOOL XiaoWei",serif';c.fillText(title,72,250);
  c.font='20px "Noto Sans SC",sans-serif';c.fillStyle='#5d6f66';
  c.fillText(['晨雾未散，独步入山。','行至半岭，朱日破云。','登临绝顶，万象归墨。'][pageNo-1]||'',72,300);
  c.fillStyle='#d63a1f';c.fillRect(640,950,64,64);c.fillStyle='#f2ebd9';c.font='700 34px "ZCOOL XiaoWei",serif';c.fillText('枢',652,996);
  c.fillStyle='#8b9a90';c.font='15px "Fira Code",monospace';c.fillText(`— ${pageNo} —`,350,1044);
  return new Promise(r=>cv.toBlob(r,'image/png'))}
async function seed(){
  for(const d of['/desktop','/documents','/pictures','/music','/downloads','/videos','/.system/wallpapers'])await fs.mkdir(d);
  await fs.writeFile('/desktop/欢迎.txt',`欢迎登上「玄枢」—— 一枚运行在浏览器里的桌面操作系统。\n\n◈ 快速上手\n· 单击图标即可打开；空白处拖动即可框选（鼠标与触摸一致）\n· 图标可自由拖放排布；文件可直接拖出浏览器落到真实桌面\n· 从真实桌面拖文件进来即可导入（支持整个文件夹）\n· 右键处处有菜单：新建 / 上传 / 压缩 / 解压 / 属性 / 设壁纸\n\n◈ 双存储内核\n· 玄枢盘（OPFS）与索引库（IndexedDB）同时在线，可互相拖拽\n· 本地真实文件夹可挂载到 /mnt/local，与虚拟文件同权操作\n· 移动、重命名绝不丢失修改日期\n\n◈ 值得一试\n· 打开 /pictures/条漫·山行 里任意一页 → 条漫阅读器\n· 打开 /desktop/朱印.html → 实时代码编辑器 + 预览\n· 终端输入 neofetch\n\n—— 玄枢 · 墨玉之核`);
  await fs.writeFile('/desktop/朱印.html',`<!DOCTYPE html>\n<html lang="zh">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>朱印 · 演示</title>\n<style>\n  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 10%,#143430,#08110f);font-family:'Noto Sans SC',sans-serif;color:#dcebe2;overflow:hidden}\n  .seal{width:150px;height:150px;border:5px solid #ff5a3c;border-radius:22px;display:grid;place-items:center;font-size:74px;color:#e6b455;cursor:pointer;transition:.25s;box-shadow:0 0 60px rgba(255,90,60,.35);user-select:none}\n  .seal:active{transform:scale(.9) rotate(-4deg)}\n  h2{letter-spacing:8px;font-weight:400;color:#8fa89d}\n  b{color:#3fd8c2}\n</style>\n</head>\n<body>\n  <div style="text-align:center">\n    <div class="seal" id="s">枢</div>\n    <h2>点击落印 · 已落 <b id="n">0</b> 次</h2>\n  </div>\n  <script>\n    let n=0;\n    document.getElementById('s').onclick=()=>{document.getElementById('n').textContent=++n};\n  <\/script>\n</body>\n</html>`);
  await fs.writeFile('/documents/山货账.csv','山货,数量,单价,备注\n云雾茶,3,128,明前\n松烟墨,2,86,徽制\n朱砂印泥,1,45,漳州\n宣纸,10,12,四尺\n');
  await fs.writeFile('/documents/读我.md','# 玄枢小笺\n\n> 墨玉为底，朱砂为印。\n\n- **代码编辑器**：左侧书写，右侧即刻成像\n- *表格*：CSV 双击即开，双视图切换\n- `终端`：ls / cd / cat / tree / neofetch\n\n---\n\n所有文件都持久保存在你自己的浏览器里。');
  await fs.writeFile('/pictures/朱印.svg','<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 40 40"><rect x="2.5" y="2.5" width="35" height="35" rx="7" fill="#f2ebd9" stroke="#d63a1f" stroke-width="2.6"/><path d="M20 8.5v3.5M11 15h18M14.5 15c0 6-1.5 10-4.5 14M25.5 15c0 6 1.5 10 4.5 14M15 23.5h10M20 19v12" fill="none" stroke="#d63a1f" stroke-width="2.2" stroke-linecap="round"/></svg>');
  await fs.mkdir('/pictures/条漫·山行');
  for(let i=1;i<=3;i++){const blob=await seedComicPage(i,'山行');await fs.writeFile(`/pictures/条漫·山行/第${i}页.png`,blob)}
}
let errShown=0;
const reportErr=msg=>{if(Date.now()-errShown>4000){errShown=Date.now();console.error(msg);toast('运行异常：'+(msg||'未知错误'),'err')}};
addEventListener('error',e=>reportErr(e.message));
addEventListener('unhandledrejection',e=>reportErr(e.reason&&e.reason.message||String(e.reason||'异步错误')));
async function boot(){
  applyTheme();
  if(S.wall.type==='preset')$('#wall').style.backgroundImage=wallURI(WALLS[S.wall.id]?S.wall.id:'ink');
  document.addEventListener('contextmenu',e=>{if(e.target.closest('input,textarea,.CodeMirror,[contenteditable]'))return;e.preventDefault()});
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>e.preventDefault());
  try{await fs.init()}catch(e){toast('文件系统初始化失败：'+e.message,'err')}
  const firstBoot=!document.cookie.includes('xs_boot=1');
  try{if(firstBoot||!await fs.exists('/desktop')){await seed();setCookie('xs_boot','1',365)}}catch(e){console.error(e)}
  await applyWall();
  initDesktop();initTaskbar();
  await renderDesktop();
  if(fs.pendingMounts.length){toast(`有 ${fs.pendingMounts.length} 个本地文件夹需重新授权`, 'warn',{action:'重新挂载',ms:12000,fn:async()=>{for(const it of[...fs.pendingMounts]){try{await fs.resumeMount(it);fs.pendingMounts=fs.pendingMounts.filter(x=>x!==it);toast('已恢复挂载：'+it.name,'ok')}catch(e){toast(it.name+' 授权失败','warn')}}}})}
  if(!fs.hasOPFS())toast('当前环境不支持 OPFS，已启用 IndexedDB 后端','warn');
  document.addEventListener('keydown',e=>{
    const inField=e.target.closest('input,textarea,.CodeMirror,[contenteditable]');
    if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();launch('term');return}
    if(inField)return;
    if(e.key==='Delete'&&deskSel.size&&!wm.activeId()){const ps=[...deskSel].filter(k=>!k.startsWith('@'));if(ps.length)deletePaths(ps)}
    if(e.key==='F2'&&deskSel.size===1){const k=[...deskSel][0];if(!k.startsWith('@'))renamePath(k)}
    if((e.ctrlKey||e.metaKey)&&e.key==='a'&&!wm.activeId()){e.preventDefault();deskSel=new Set($$('.dicon').map(n=>n.dataset.mid));$$('.dicon').forEach(n=>n.classList.add('sel'))}
  });
  emit('wm-update');
}
boot();
</script>
