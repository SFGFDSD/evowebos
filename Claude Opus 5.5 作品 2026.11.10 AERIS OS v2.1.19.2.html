<!DOCTYPE html>
<html lang="zh-CN" data-theme="aero" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06223a">
<title>AERIS OS · 晴空</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Chakra+Petch:wght@400;500;600;700&family=Michroma&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" defer></script>
<style>
/* ================= RESET ================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);color:var(--text);background:#04121f;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-size:calc(13.5px * var(--ui-scale));line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;margin:0}
input,textarea,select{font:inherit;color:inherit;margin:0}
input,textarea,[contenteditable=true],.CodeMirror{user-select:text;-webkit-user-select:text}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
img{display:block}
[hidden]{display:none!important}
::selection{background:rgba(var(--accent-rgb),.4)}

/* ================= THEME TOKENS ================= */
:root{--radius:12px;--blur:18px;--glass-alpha:.62;--ui-scale:1;--icon-size:48px;--tb-h:50px;--accent:#2fb4ff;--accent-rgb:47,180,255;--on-accent:#fff;
--ease:cubic-bezier(.22,.9,.24,1);--spring:cubic-bezier(.34,1.45,.5,1);--font-mono:'JetBrains Mono','Noto Sans SC',ui-monospace,monospace}
html[data-theme=aero]{--font-ui:'M PLUS Rounded 1c','Noto Sans SC',sans-serif;--font-display:'M PLUS Rounded 1c','Noto Sans SC',sans-serif;--fold-a:#fff0bf;--fold-b:#f5c65a;--fold-c:#d8961b;--tile-rad:10}
html[data-theme=y2k]{--font-ui:'Chakra Petch','Noto Sans SC',sans-serif;--font-display:'Michroma','Chakra Petch','Noto Sans SC',sans-serif;--fold-a:#fbfcfd;--fold-b:#bcc5cf;--fold-c:#7a8594}
html[data-theme=aero][data-mode=dark]{color-scheme:dark;--glass-rgb:10,32,54;--text:#eaf6ff;--text-dim:rgba(210,235,255,.62);--body:rgba(4,18,32,.5);--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.085);--line:rgba(170,220,255,.15);--glass-border:rgba(170,225,255,.32);--hi:rgba(255,255,255,.28);--hover:rgba(140,210,255,.13);--field:rgba(0,12,26,.5);--field-border:rgba(160,220,255,.26);--menu:rgba(8,28,48,.9);--shadow:0 24px 64px rgba(0,8,20,.62),0 2px 10px rgba(0,0,0,.35);--title:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 48%,rgba(255,255,255,0) 52%,rgba(255,255,255,.05));--btn:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07) 49%,rgba(255,255,255,.02) 51%,rgba(255,255,255,.09));--desk-text:#fff;--desk-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);--sel:rgba(var(--accent-rgb),.26);--sel-border:rgba(var(--accent-rgb),.7);--danger:#ff6a55;--ok:#5fe08a;--warn:#ffc552}
html[data-theme=aero][data-mode=light]{color-scheme:light;--glass-rgb:232,247,255;--text:#0b2a44;--text-dim:rgba(11,42,68,.62);--body:rgba(255,255,255,.62);--panel:rgba(10,90,160,.05);--panel-2:rgba(10,90,160,.09);--line:rgba(20,90,150,.15);--glass-border:rgba(255,255,255,.8);--hi:rgba(255,255,255,.9);--hover:rgba(30,140,230,.11);--field:rgba(255,255,255,.75);--field-border:rgba(20,100,170,.25);--menu:rgba(240,250,255,.93);--shadow:0 22px 56px rgba(10,60,110,.32),0 2px 8px rgba(10,50,90,.18);--title:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.35) 48%,rgba(255,255,255,.1) 52%,rgba(255,255,255,.3));--btn:linear-gradient(180deg,#fff,rgba(255,255,255,.7) 49%,rgba(225,240,252,.75) 51%,rgba(245,251,255,.9));--desk-text:#fff;--desk-shadow:0 1px 3px rgba(0,30,60,.85),0 0 8px rgba(0,40,80,.45);--sel:rgba(var(--accent-rgb),.2);--sel-border:rgba(var(--accent-rgb),.65);--danger:#d8402c;--ok:#1f9d4a;--warn:#c98a00}
html[data-theme=y2k][data-mode=dark]{color-scheme:dark;--glass-rgb:12,13,18;--text:#ecedf3;--text-dim:rgba(220,224,235,.58);--body:rgba(8,9,13,.72);--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.08);--line:rgba(200,210,230,.13);--glass-border:rgba(210,218,232,.3);--hi:rgba(255,255,255,.35);--hover:rgba(var(--accent-rgb),.12);--field:rgba(0,0,0,.55);--field-border:rgba(200,210,230,.22);--menu:rgba(14,15,20,.94);--shadow:0 26px 70px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);--title:linear-gradient(180deg,#f3f5f8 0%,#c7cdd6 46%,#9aa3b0 50%,#cfd5dd 100%);--btn:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 50%,rgba(0,0,0,.15) 51%,rgba(255,255,255,.07));--desk-text:#f2f4f8;--desk-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.7);--sel:rgba(var(--accent-rgb),.16);--sel-border:var(--accent);--danger:#ff3d6e;--ok:#c6ff00;--warn:#ffd23d;--title-text:#14161b}
html[data-theme=y2k][data-mode=light]{color-scheme:light;--glass-rgb:236,239,244;--text:#15171d;--text-dim:rgba(21,23,29,.58);--body:rgba(250,251,253,.78);--panel:rgba(20,30,60,.04);--panel-2:rgba(20,30,60,.08);--line:rgba(30,40,70,.13);--glass-border:rgba(255,255,255,.95);--hi:#fff;--hover:rgba(var(--accent-rgb),.12);--field:rgba(255,255,255,.85);--field-border:rgba(30,40,70,.2);--menu:rgba(244,246,250,.95);--shadow:0 22px 60px rgba(40,50,80,.28),0 0 0 1px rgba(120,130,150,.25);--title:linear-gradient(180deg,#ffffff 0%,#dfe3ea 46%,#c3c9d3 50%,#eef1f5 100%);--btn:linear-gradient(180deg,#fff,#eef1f5 50%,#dde2ea 51%,#f4f6f9);--desk-text:#fff;--desk-shadow:0 1px 2px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.4);--sel:rgba(var(--accent-rgb),.14);--sel-border:var(--accent);--danger:#e0144c;--ok:#2b9d00;--warn:#b98a00;--title-text:#14161b}

/* ================= PRIMITIVES ================= */
.glass{background:rgba(var(--glass-rgb),var(--glass-alpha));-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);border:1px solid var(--glass-border)}
.i{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:calc(var(--radius)*.55);background:var(--btn);border:1px solid var(--field-border);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px rgba(0,0,0,.18);white-space:nowrap;font-size:.95em;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--hover);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px rgba(var(--accent-rgb),.35),0 0 14px rgba(var(--accent-rgb),.22)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.08) 50%,rgba(0,0,0,.06) 51%,rgba(255,255,255,.18)),var(--accent);color:var(--on-accent);border-color:rgba(var(--accent-rgb),.9);font-weight:600}
.btn.danger{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05) 50%,rgba(0,0,0,.08) 51%,rgba(255,255,255,.12)),var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.on{background:rgba(var(--accent-rgb),.22);border-color:var(--sel-border)}
.btn.sm{height:26px;padding:0 9px;font-size:.88em}
html[data-theme=y2k] .btn{border-radius:calc(var(--radius)*.35);text-transform:none;letter-spacing:.02em}
.field{height:30px;padding:0 10px;border-radius:calc(var(--radius)*.55);background:var(--field);border:1px solid var(--field-border);outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.18);min-width:0}
.field:focus{border-color:var(--accent);box-shadow:inset 0 1px 3px rgba(0,0,0,.18),0 0 0 3px rgba(var(--accent-rgb),.22)}
textarea.field{height:auto;padding:8px 10px}
select.field{padding-right:6px;cursor:pointer}
select.field option{background:var(--menu);color:var(--text)}
.sw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:20px;background:var(--field);border:1px solid var(--field-border);transition:.2s;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,#fff,#d7e3ee);box-shadow:0 1px 3px rgba(0,0,0,.4);transition:.25s var(--spring)}
.sw input:checked+i{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 12px rgba(var(--accent-rgb),.5)}
.sw input:checked+i::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:34px;height:30px;border:1px solid var(--field-border);border-radius:8px;background:none;padding:2px;cursor:pointer}
.seg{display:inline-flex;padding:2px;border-radius:calc(var(--radius)*.6);background:var(--field);border:1px solid var(--field-border);gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:calc(var(--radius)*.45);font-size:.92em;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--btn);box-shadow:inset 0 1px 0 var(--hi),0 1px 3px rgba(0,0,0,.25);color:var(--text);outline:1px solid var(--sel-border)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(var(--accent-rgb),.2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.spinner.sm{width:14px;height:14px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--text-dim)}
.kbd{font-family:var(--font-mono);font-size:.8em;padding:1px 5px;border-radius:4px;border:1px solid var(--line);background:var(--panel)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.32);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background-color:rgba(var(--accent-rgb),.55)}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
.no-anim *,.no-anim *::before,.no-anim *::after{animation-duration:0s!important;transition-duration:0s!important}

/* ================= DESKTOP ================= */
#desktop-bg{position:fixed;inset:0;background:#04121f center/cover no-repeat;transition:background-image .6s}
#desktop-bg.fit-contain{background-size:contain}
#desktop-bg.fit-fill{background-size:100% 100%}
#desktop-bg.fit-center{background-size:auto}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-160px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 6%,rgba(255,255,255,.18) 14%,rgba(160,230,255,.08) 45%,rgba(120,220,255,.22) 68%,rgba(255,255,255,.55) 74%,rgba(255,255,255,0) 76%);box-shadow:inset 0 -8px 18px rgba(120,230,255,.25);animation:rise linear infinite;opacity:.85}
.bubble::after{content:"";position:absolute;left:20%;top:12%;width:34%;height:18%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(-24deg)}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.85)}50%{transform:translate3d(40px,-55vh,0) scale(1)}100%{transform:translate3d(-30px,-115vh,0) scale(1.08)}}
.wire{position:absolute;right:7vw;top:12vh;width:min(34vw,380px);aspect-ratio:1;perspective:900px;opacity:.55}
.wire-in{position:absolute;inset:0;transform-style:preserve-3d;animation:wspin 38s linear infinite}
.wire-in i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.55);box-shadow:0 0 6px rgba(var(--accent-rgb),.25)}
.wire-core{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#dfe5ec 18%,#8c96a5 46%,#2a2f39 72%,#9aa4b2 90%,#e8ecf1 100%);box-shadow:0 0 40px rgba(var(--accent-rgb),.35),inset -10px -14px 30px rgba(0,0,0,.45)}
@keyframes wspin{to{transform:rotateY(360deg) rotateX(18deg)}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#desktop{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h);outline:none;touch-action:none;overflow:hidden}
body.hide-taskbar #desktop,body.tb-autohide #desktop{bottom:0}
.dicon{position:absolute;width:var(--cw);height:var(--ch);padding:4px;transition:left .38s var(--ease),top .38s var(--ease);touch-action:none;-webkit-user-drag:element}
.dicon-in{height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 4px;border-radius:calc(var(--radius)*.6);border:1px solid transparent;transition:background .15s,border-color .15s}
.dicon:hover .dicon-in{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.dicon.sel .dicon-in{background:var(--sel);border-color:var(--sel-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.dicon.drop-hl .dicon-in{background:rgba(var(--accent-rgb),.35);border-color:var(--accent);transform:scale(1.06)}
.dicon-img{width:var(--icon-size);height:var(--icon-size);display:grid;place-items:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transition:transform .25s var(--spring)}
.dicon:hover .dicon-img{transform:translateY(-2px) scale(1.04)}
.dicon-img svg{width:100%;height:100%}
html[data-theme=y2k] .app-ico .tile-bg{fill:url(#t-graphite);stroke:url(#t-chrome);stroke-width:3.2}
html[data-theme=y2k] .app-ico .tile-gloss{opacity:.28}
html[data-theme=y2k] .app-ico{filter:drop-shadow(0 0 3px rgba(var(--accent-rgb),.35))}
html[data-theme=y2k] .dicon-lb,html[data-theme=y2k] .sm-app span{letter-spacing:.03em}
.dicon-img img{max-width:100%;max-height:100%;border-radius:4px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);object-fit:cover}
.dicon-lb{color:var(--desk-text);text-shadow:var(--desk-shadow);font-size:.92em;text-align:center;line-height:1.25;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.dicon.sel .dicon-lb{-webkit-line-clamp:4}
.dicon.cut,.fm-item.cut{opacity:.5}
.dicon.appear{animation:iconIn .5s var(--spring) backwards}
@keyframes iconIn{from{opacity:0;transform:translateY(14px) scale(.8)}}
.marquee{position:absolute;pointer-events:none;border:1px solid var(--sel-border);background:rgba(var(--accent-rgb),.16);border-radius:2px;z-index:50;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
#desktop .marquee{position:absolute}
.drop-zone-hl{box-shadow:inset 0 0 0 2px var(--accent)!important}

/* ================= WINDOWS ================= */
#windows{position:fixed;inset:0;pointer-events:none;z-index:10}
.win{position:absolute;display:flex;flex-direction:column;pointer-events:auto;min-width:260px;min-height:160px;border-radius:var(--radius);background:rgba(var(--glass-rgb),var(--glass-alpha));-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);overflow:hidden;animation:winIn .3s var(--ease);transition:opacity .2s}
.win.snapping{transition:left .22s var(--ease),top .22s var(--ease),width .22s var(--ease),height .22s var(--ease)}
.win.max,.win.snapped{border-radius:0}
.win.max{border-width:0}
.win:not(.active){box-shadow:0 12px 34px rgba(0,0,0,.32)}
.win:not(.active) .win-title{opacity:.86}
.win.minimized{display:none}
.win.closing{animation:winOut .18s ease-in forwards}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes winOut{to{opacity:0;transform:scale(.95)}}
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(115deg,rgba(255,255,255,.14) 0 22%,transparent 22.2% 60%,rgba(255,255,255,.06) 60.2% 66%,transparent 66.2%);pointer-events:none;z-index:0}
.win-title{position:relative;z-index:2;display:flex;align-items:center;gap:8px;height:38px;padding:0 0 0 12px;background:var(--title);border-bottom:1px solid var(--line);flex-shrink:0;touch-action:none;cursor:default}
html[data-theme=y2k] .win-title{color:var(--title-text);border-bottom:1px solid rgba(0,0,0,.35);box-shadow:inset 0 -1px 0 rgba(255,255,255,.6)}
html[data-theme=y2k] .win-tt{font-family:var(--font-display);font-size:.78em;letter-spacing:.08em;text-transform:uppercase}
.win-ico{width:20px;height:20px;display:grid;place-items:center}
.win-ico svg{width:20px;height:20px}
.win-tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.08)}
html[data-theme=aero][data-mode=dark] .win-tt{text-shadow:0 0 10px rgba(140,210,255,.35),0 1px 2px rgba(0,0,0,.6)}
.win-ctrls{display:flex;align-self:flex-start;height:24px;margin-right:8px;border-radius:0 0 7px 7px;overflow:hidden;border:1px solid rgba(0,0,0,.35);border-top:0;box-shadow:0 1px 0 rgba(255,255,255,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.wc{width:32px;height:100%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.12) 50%,rgba(0,0,0,.05) 51%,rgba(255,255,255,.18));border-left:1px solid rgba(0,0,0,.2);transition:background .15s,box-shadow .15s;color:#fff}
.wc:first-child{border-left:0}
.wc svg{width:12px;height:12px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.wc:hover{background:linear-gradient(180deg,rgba(190,235,255,.85),rgba(80,170,240,.65) 50%,rgba(20,110,200,.75) 51%,rgba(110,210,255,.85));box-shadow:0 0 12px rgba(80,190,255,.75)}
.wc-close{width:46px;background:linear-gradient(180deg,#f0a493,#d9573f 50%,#c2321b 51%,#e2775b)}
.wc-close:hover{background:linear-gradient(180deg,#ffc0ad,#f2694c 50%,#e33a1a 51%,#ff8f6c);box-shadow:0 0 16px rgba(255,80,40,.85)}
html[data-theme=y2k] .win-ctrls{border:0;box-shadow:none;gap:5px;align-self:center;height:22px;border-radius:0}
html[data-theme=y2k] .wc{width:26px;border:1px solid #5e6672;border-radius:3px;background:linear-gradient(180deg,#fff,#cfd5dd 50%,#a7afba 51%,#e3e7ec);color:#20242b;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
html[data-theme=y2k] .wc svg{filter:none}
html[data-theme=y2k] .wc:hover{background:var(--accent);color:var(--on-accent);box-shadow:none}
html[data-theme=y2k] .wc-close{width:30px}
html[data-theme=y2k] .wc-close:hover{background:var(--danger);color:#fff}
.win-tools{display:flex;gap:4px;align-items:center}
.win-body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--body)}
.rz{position:absolute;z-index:5;touch-action:none}
.rz-n,.rz-s{left:8px;right:8px;height:6px;cursor:ns-resize}.rz-n{top:0}.rz-s{bottom:0}
.rz-e,.rz-w{top:8px;bottom:8px;width:6px;cursor:ew-resize}.rz-e{right:0}.rz-w{left:0}
.rz-ne,.rz-nw,.rz-se,.rz-sw{width:12px;height:12px}
.rz-ne{top:0;right:0;cursor:nesw-resize}.rz-sw{bottom:0;left:0;cursor:nesw-resize}.rz-nw{top:0;left:0;cursor:nwse-resize}.rz-se{bottom:0;right:0;cursor:nwse-resize}
.win.max .rz{display:none}
.win.dragging,.win.resizing{transition:none!important;user-select:none}
.win.dragging iframe,.win.resizing iframe,body.dragging-any iframe{pointer-events:none}

.fm-td.c-name .fm-name{overflow:hidden;text-overflow:ellipsis}
.fm-td.c-size{font-variant-numeric:tabular-nums}
.fm-loc{font-size:.8em;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis}
.fm-ico{display:grid;place-items:center;width:22px;height:22px;flex-shrink:0;touch-action:none}
.fm-ico svg,.fm-ico img{width:22px;height:22px;object-fit:cover;border-radius:2px}
.fm-item:hover{background:var(--hover)}
.fm-item.sel{background:var(--sel);border-color:var(--sel-border)}
.fm-item.drop-hl{background:rgba(var(--accent-rgb),.35);border-color:var(--accent)}
/* icons */
.fm-icons{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:10px}
.fm-tile{width:108px;height:124px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 4px;border-radius:calc(var(--radius)*.55);border:1px solid transparent;text-align:center}
.fm-tile .fm-ico{width:64px;height:64px}
.fm-tile .fm-ico svg{width:56px;height:56px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.fm-tile .fm-ico img{width:64px;height:64px;border-radius:5px;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35);object-fit:cover;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px}
.fm-tile .fm-name{font-size:.88em;line-height:1.25;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* columns */
.fm-cols{display:flex;overflow-x:auto;overflow-y:hidden}
.fm-col{width:230px;flex-shrink:0;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);position:relative;padding:4px;contain:strict}
.fm-col .fm-item{display:flex;align-items:center;gap:7px;height:28px;padding:0 6px;border-radius:5px;border:1px solid transparent;font-size:.93em}
.fm-col .fm-item .fm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-col .fm-item.chain{background:var(--panel-2)}
.fm-col-prev{width:280px;flex-shrink:0;padding:18px;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fm-col-prev img{max-width:100%;max-height:220px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fm-col-prev svg.big{width:96px;height:96px}
.fm-status{display:flex;align-items:center;gap:12px;height:26px;padding:0 10px;font-size:.82em;color:var(--text-dim);border-top:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden}
.fm-status .sp{flex:1}
.fm-touchbar{display:none}
@media (pointer:coarse){.fm-touchbar{display:inline-flex}}
.fm-view.selmode{touch-action:none}
.fm-side-toggle{display:none}

/* ================= APPS (shared) ================= */
.tbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex-shrink:0;background:var(--panel)}
.tbar .btn{flex-shrink:0}
.tbar .sp{flex:1}
.sbar{display:flex;align-items:center;gap:14px;height:26px;padding:0 10px;font-size:.8em;color:var(--text-dim);border-top:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.frame-wrap{position:relative;flex:1;min-height:0;background:#0b1622}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frame-mask{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(var(--accent-rgb),.18),transparent 60%),#07121d;color:#cfe6f7;font-size:.9em;transition:opacity .3s}
.frame-mask.hide{opacity:0;pointer-events:none}
.orbit{width:46px;height:46px;position:relative}
.orbit i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
.orbit i:nth-child(2){inset:7px;border-top-color:rgba(var(--accent-rgb),.6);animation-duration:1.5s;animation-direction:reverse}
.orbit i:nth-child(3){inset:15px;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 60%,rgba(0,0,0,.4));border:0;animation:none;box-shadow:0 0 14px var(--accent)}
/* notepad */
.np{display:flex;flex-direction:column;height:100%}
.np textarea{flex:1;min-height:0;resize:none;border:0;outline:none;padding:14px 16px;background:transparent;color:var(--text);font-family:var(--font-mono);line-height:1.6;tab-size:4}
.np textarea.nowrap{white-space:pre;overflow-wrap:normal;overflow-x:auto}
.findbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.findbar .field{width:170px;height:28px}
.findbar label{display:flex;align-items:center;gap:4px;font-size:.88em;white-space:nowrap}
/* sheet */
.sh-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--body)}
.sh-table{border-collapse:separate;border-spacing:0;font-size:.92em;font-family:var(--font-mono)}
.sh-table th,.sh-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;min-width:80px;max-width:360px;white-space:pre;overflow:hidden;text-overflow:ellipsis;height:28px}
.sh-table th{position:sticky;top:0;background:rgba(var(--glass-rgb),.96);z-index:2;color:var(--text-dim);font-weight:500}
.sh-table td.rn,.sh-table th.rn{position:sticky;left:0;background:rgba(var(--glass-rgb),.96);color:var(--text-dim);min-width:44px;text-align:right;z-index:1}
.sh-table th.rn{z-index:3}
.sh-table td:focus{outline:2px solid var(--accent);outline-offset:-2px;background:rgba(var(--accent-rgb),.08)}
.sh-text{flex:1;min-height:0;resize:none;border:0;outline:none;padding:12px;background:transparent;color:var(--text);font-family:var(--font-mono);white-space:pre;overflow:auto}
/* code editor */
.ce{display:flex;flex-direction:column;height:100%;min-height:0}
.ce .tbar{flex-wrap:nowrap}
.ce-main{flex:1;min-height:0;display:flex;position:relative}
.ce-main.dir-v{flex-direction:column}
.ce-code{flex:0 0 50%;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:#212121}
.ce-code .CodeMirror{flex:1;height:100%;font-family:var(--font-mono);font-size:var(--ce-fs,14px);line-height:1.55}
.ce-code textarea.ce-fallback{flex:1;resize:none;border:0;outline:none;background:#212121;color:#eee;padding:10px;font-family:var(--font-mono);font-size:14px;line-height:1.55}
.ce-split{flex:0 0 7px;background:var(--panel-2);cursor:col-resize;position:relative;touch-action:none;z-index:3}
.ce-split::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:36px;margin-top:-18px;border-radius:3px;background:rgba(var(--accent-rgb),.5)}
.ce-main.dir-v .ce-split{cursor:row-resize}
.ce-main.dir-v .ce-split::after{top:2px;bottom:2px;height:auto;left:50%;width:36px;margin:0 0 0 -18px}
.ce-split:hover{background:rgba(var(--accent-rgb),.35)}
.ce-prev{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.ce-main.only-code .ce-prev,.ce-main.only-code .ce-split{display:none}
.ce-main.only-code .ce-code{flex:1 1 auto!important}
.ce-main.only-prev .ce-code,.ce-main.only-prev .ce-split{display:none}
.ce-prevbar{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;font-size:.82em;color:var(--text-dim);background:var(--panel);border-bottom:1px solid var(--line)}
.cm-search-hit{background:rgba(255,200,0,.35);border-bottom:1px solid #ffc800}
.CodeMirror-focused .cm-search-cur,.cm-search-cur{background:rgba(var(--accent-rgb),.55)!important}
.ce .grp{display:flex;align-items:center;gap:4px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line);flex-shrink:0}
.ce .grp:last-child{border-right:0}
.ce label.lb{font-size:.82em;color:var(--text-dim);white-space:nowrap}
.ce select.field{height:28px;font-size:.88em}
/* browser */
.br-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.br-bar .field{flex:1;height:32px;border-radius:16px;padding:0 14px}
.br-hint{font-size:.8em;padding:4px 12px;color:var(--text-dim);background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
/* html launcher */
.hl{display:grid;grid-template-columns:260px 1fr;height:100%;min-height:0}
.hl-acts{padding:16px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);overflow:auto}
.hl-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));text-align:left;transition:.2s}
.hl-card:hover{border-color:var(--sel-border);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15),0 6px 18px rgba(0,0,0,.2);transform:translateY(-1px)}
.hl-card svg{width:40px;height:40px}
.hl-card b{display:block}
.hl-card small{color:var(--text-dim)}
/* manga */
.mg{display:flex;flex-direction:column;height:100%;min-height:0;background:#000}
.mg-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(10,12,16,.92);border-bottom:1px solid rgba(255,255,255,.08);color:#dfe7ef;overflow-x:auto;flex-shrink:0}
.mg-bar .btn{color:#e8eef5;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.mg-bar .muted{color:rgba(230,238,245,.6)}
.mg-prog{height:2px;background:rgba(255,255,255,.08);flex-shrink:0}
.mg-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s;box-shadow:0 0 6px var(--accent)}
.mg-scroll{flex:1;min-height:0;position:relative;background:#000;overscroll-behavior-y:none;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;overflow-anchor:none;cursor:grab}
.mg-scroll.grabbing{cursor:grabbing}
.mg-strip{margin:0 auto;max-width:var(--mg-w,860px);display:flex;flex-direction:column;align-items:stretch}
.mg-page{position:relative;width:100%;aspect-ratio:var(--ar,0.7);background:linear-gradient(110deg,#0c0c0c 30%,#1a1a1a 50%,#0c0c0c 70%) 0 0/300% 100%;animation:shimmer 1.6s linear infinite;contain:layout paint}
.mg-page.ok{background:#000;animation:none}
.mg-page img{width:100%;height:100%;display:block;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}
.mg-page .pn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#555;font-family:var(--font-mono);font-size:.9em}
@keyframes shimmer{to{background-position:-300% 0}}
.mg-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#bbb;z-index:4;background:#000;font-size:.9em}
.mg-x{display:none;position:absolute;right:14px;top:14px;z-index:20;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.12);place-items:center;opacity:.35;transition:opacity .2s}
.mg-x:hover,.mg-x:focus{opacity:1}
.win.manga-fs{border-radius:0!important;border:0!important}
.win.manga-fs .win-title,.win.manga-fs .mg-bar,.win.manga-fs .mg-prog,.win.manga-fs .rz{display:none!important}
.win.manga-fs .mg-x{display:grid}
.win.pseudo-fs{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:99999!important}
.win:fullscreen{width:100%!important;height:100%!important;left:0!important;top:0!important}
/* image viewer */
.iv{display:flex;flex-direction:column;height:100%;min-height:0}
.iv-stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:repeating-conic-gradient(rgba(128,128,128,.12) 0 25%,transparent 0 50%) 0 0/24px 24px,#0a0f15;cursor:grab}
.iv-stage img{position:absolute;left:0;top:0;max-width:none!important;transform-origin:0 0;will-change:transform;-webkit-user-drag:none;image-rendering:auto}
.iv-stage.pixel img{image-rendering:pixelated}
.iv-info{position:absolute;left:12px;bottom:12px;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.82em;pointer-events:none}
/* media player */
.mp{display:flex;height:100%;min-height:0}
.mp-main{flex:1;min-width:0;display:flex;flex-direction:column}
.mp-stage{flex:1;min-height:0;position:relative;background:#000;display:grid;place-items:center;overflow:hidden}
.mp-stage video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.mp-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.mp-disc{position:relative;width:min(46%,240px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#111 0 9%,#ddd 9.5% 10.5%,transparent 11%),conic-gradient(from 0deg,#cfe9ff,#7ab8ff,#e9f6ff,#5ad1b5,#d7f4ff,#8fb2ff,#cfe9ff);box-shadow:0 0 50px rgba(var(--accent-rgb),.5),inset 0 0 0 10px rgba(255,255,255,.15);animation:spin 8s linear infinite;animation-play-state:paused;z-index:2}
.mp-disc.play{animation-play-state:running}
.mp-title{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;z-index:2;text-shadow:0 2px 6px #000;font-weight:600;padding:0 12px}
.mp-ctrl{padding:8px 12px 10px;background:var(--panel);border-top:1px solid var(--line)}
.mp-seek{display:flex;align-items:center;gap:10px;font-size:.8em;font-variant-numeric:tabular-nums;color:var(--text-dim)}
.mp-btns{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.mp-play{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.7),var(--accent) 55%,rgba(0,0,0,.25));color:#fff;box-shadow:0 0 14px rgba(var(--accent-rgb),.6),inset 0 1px 0 rgba(255,255,255,.7)}
.mp-list{width:250px;border-left:1px solid var(--line);overflow:auto;background:var(--panel);padding:6px}
.mp-li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:.88em;width:100%;text-align:left}
.mp-li:hover{background:var(--hover)}
.mp-li.cur{background:var(--sel);color:var(--text)}
/* calculator */
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px}
.calc-disp{padding:12px 14px;border-radius:var(--radius);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15));border:1px solid var(--line);text-align:right;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
html[data-mode=light] .calc-disp{background:linear-gradient(180deg,#e9f5ff,#fff)}
.calc-expr{min-height:1.4em;color:var(--text-dim);font-size:.9em;word-break:break-all;font-family:var(--font-mono)}
.calc-val{font-size:2.2em;font-weight:500;word-break:break-all;font-variant-numeric:tabular-nums;line-height:1.2}
html[data-theme=y2k] .calc-val{font-family:var(--font-display);font-size:1.7em;color:var(--accent);text-shadow:0 0 12px rgba(var(--accent-rgb),.5)}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:6px}
.ck{border-radius:calc(var(--radius)*.6);background:var(--btn);border:1px solid var(--field-border);box-shadow:inset 0 1px 0 var(--hi),0 2px 3px rgba(0,0,0,.15);font-size:1.15em;min-height:40px;transition:transform .08s,background .15s}
.ck:hover{background:var(--hover)}
.ck:active{transform:scale(.95)}
.ck.op{color:var(--accent);font-weight:700}
.ck.eq{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.08) 50%,rgba(0,0,0,.08) 51%,rgba(255,255,255,.15)),var(--accent);color:var(--on-accent)}
.ck.fn{font-size:.9em;color:var(--text-dim)}
/* paint */
.pt{display:flex;flex-direction:column;height:100%;min-height:0}
.pt-stage{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:20px;background:repeating-linear-gradient(45deg,rgba(128,128,128,.06) 0 10px,transparent 10px 20px)}
.pt-stage canvas{background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.4);touch-action:none;cursor:crosshair;max-width:none}
.pt-colors{display:flex;gap:3px;flex-shrink:0}
.pt-colors button{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pt-colors button.on{outline:2px solid var(--accent);outline-offset:1px}
/* terminal */
.term{flex:1;min-height:0;overflow:auto;padding:10px 12px;font-family:var(--font-mono);font-size:13px;line-height:1.55;background:rgba(2,8,14,.88);color:#cfe8ff;cursor:text;user-select:text;-webkit-user-select:text}
html[data-theme=y2k] .term{color:#d8ff6a;background:rgba(4,5,7,.92)}
.term .ln{white-space:pre-wrap;word-break:break-all}
.term .pr{color:var(--accent)}
.term .er{color:#ff7a6a}
.term .dirc{color:#7ad3ff;font-weight:600}
.term-in{display:flex;gap:8px}
.term-in input{flex:1;background:none;border:0;outline:none;color:inherit;font:inherit;padding:0}
/* v86 */
.vm{display:flex;flex-direction:column;height:100%;min-height:0}
.vm-screen{flex:1;min-height:0;overflow:auto;background:#000;display:grid;place-items:center;position:relative}
.vm-screen>div{white-space:pre;font:14px monospace;line-height:14px;color:#ccc}
.vm-screen canvas{display:none;image-rendering:pixelated;max-width:100%;max-height:100%}
.vm-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9ab;text-align:center;padding:20px}
/* preview */
.pv-font{padding:24px;overflow:auto;flex:1}
.pv-hex{flex:1;overflow:auto;padding:12px;font-family:var(--font-mono);font-size:12px;white-space:pre;line-height:1.5;user-select:text;-webkit-user-select:text}
/* settings */
.st{display:flex;height:100%;min-height:0}
.st-nav{width:210px;flex-shrink:0;padding:12px 8px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.st-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:calc(var(--radius)*.5);text-align:left;margin-bottom:2px}
.st-nav button:hover{background:var(--hover)}
.st-nav button.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.st-main{flex:1;min-width:0;overflow:auto;padding:20px 24px 40px}
.st-main h2{margin:0 0 4px;font-size:1.5em;font-weight:700;font-family:var(--font-display)}
html[data-theme=y2k] .st-main h2{font-size:1.1em;letter-spacing:.1em;text-transform:uppercase}
.st-main h3{margin:22px 0 8px;font-size:.82em;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase}
.st-card{border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.st-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.st-row:last-child{border-bottom:0}
.st-row .lbl{flex:1;min-width:180px}
.st-row .lbl small{display:block;color:var(--text-dim);font-size:.85em}
.st-row .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-row input[type=range]{width:180px}
.theme-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.theme-card{border-radius:var(--radius);border:2px solid var(--line);overflow:hidden;text-align:left;transition:.2s;background:var(--panel)}
.theme-card.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}
.theme-card .pv{height:110px;position:relative;overflow:hidden}
.theme-card div.t{padding:8px 12px}
.theme-card small{color:var(--text-dim)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wp{aspect-ratio:16/10;border-radius:calc(var(--radius)*.7);background:#111 center/cover;border:2px solid transparent;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.wp.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.3)}
.wp span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:.75em;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
.wp .del{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.6);box-shadow:0 1px 4px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.4)}
.swatches button.on{outline:2px solid var(--text);outline-offset:2px}
.bar{height:16px;border-radius:9px;background:var(--field);overflow:hidden;display:flex;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}

/* =====================================================================

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

   ===================================================================== */

/* =====================================================================

   ===================================================================== */

  if(f==='rep'){const sel=this.ta.value.slice(this.ta.selectionStart,this.ta.selectionEnd);if((cs?sel:sel.toLowerCase())===Q){this.snap();this.ta.setRangeText(r,this.ta.selectionStart,this.ta.selectionEnd,'end');this.dirty=true;this.snap();this.autosave()}f='next'}
  let i;if(f==='next'){i=V.indexOf(Q,this.ta.selectionEnd);if(i<0)i=V.indexOf(Q)}else{i=V.lastIndexOf(Q,Math.max(0,this.ta.selectionStart-1));if(i<0)i=V.lastIndexOf(Q)}if(i>=0){this.ta.focus();this.ta.setSelectionRange(i,i+q.length);const line=this.ta.value.slice(0,i).split('\n').length;this.ta.scrollTop=Math.max(0,(line-5)*this.font*1.6)}this.status()}

  $('.s-len',b).textContent=`${t.value.length} 字符 · ${t.value.split('\n').length} 行`;$('.s-st',b).textContent=msg||(this.dirty?(this.path&&S.get('autoSave')?'● 待自动保存':'● 未保存（草稿已暂存）'):'已保存');$('.s-path',b).textContent=this.path||'无标题';if(msg)setTimeout(()=>this.status(),1800)}

function parseDSV(text,d){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else if(c==='"'&&cell==='')q=true;else if(c===d){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
 if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
class Sheet{
 constructor(win,path){this.win=win;this.path=null;this.d=',';this.rows=[['']];this.view='table';this.dirty=false;this.limit=2000;this.build();if(path)this.open(path);else this.render();win.onSave=()=>this.save();win.beforeClose=async()=>!this.dirty||await UI.confirm('有未保存的更改，确定关闭吗？','表格')}
 build(){const b=this.win.body;b.innerHTML=`<div class="np"><div class="tbar"><button class="btn sm" data-a="open">${I('newfolder')}打开</button><button class="btn sm" data-a="save">${I('save')}保存</button><button class="btn sm" data-a="saveas">${I('save')}另存为</button><span class="rb-sep"></span><div class="seg"><button data-v="table">${I('grid')}表格视图</button><button data-v="text">${I('text')}文本视图</button></div><span class="rb-sep"></span>
  <button class="btn sm" data-a="row">${I('plus')}添加行</button><button class="btn sm" data-a="col">${I('plus')}添加列</button><span class="rb-sep"></span><label class="muted" style="font-size:.85em">分隔符</label><select class="field" data-a="delim" style="height:28px"><option value=",">逗号 ,</option><option value="\t">制表符 Tab</option><option value=";">分号 ;</option><option value="|">竖线 |</option></select><button class="btn sm" data-a="np">${I('text')}用记事本打开</button></div>
  <div class="sh-body" style="flex:1;min-height:0;display:flex;flex-direction:column"></div><div class="sbar"><span class="s-info"></span><span class="s-st" style="margin-left:auto"></span></div></div>`;
  $('.tbar',b).onclick=e=>{const v=e.target.closest('[data-v]')?.dataset.v;if(v)return this.setView(v);const a=e.target.closest('button[data-a]')?.dataset.a;if(a)this.act(a)};$('select[data-a=delim]',b).onchange=e=>{this.sync();this.d=e.target.value;this.dirty=true;this.render()}}
 async open(path){try{const t=await fs.readText(path);this.path=path;this.d=P.ext(path)==='tsv'?'\t':(t.split('\n')[0].includes('\t')&&!t.split('\n')[0].includes(',')?'\t':',');$('select[data-a=delim]',this.win.body).value=this.d;this.rows=parseDSV(t,this.d);if(!this.rows.length)this.rows=[['']];this.win.setTitle(P.base(path)+' - 表格');this.dirty=false;this.render()}catch(e){UI.alert(errMsg(e))}}
 text(){const d=this.d;return this.rows.map(r=>r.map(c=>(c.includes(d)||/["\n\r]/.test(c))?'"'+c.replace(/"/g,'""')+'"':c).join(d)).join('\n')}

 setView(v){this.sync();this.view=v;this.render()}
 render(){const body=$('.sh-body',this.win.body);$$('[data-v]',this.win.body).forEach(x=>x.classList.toggle('on',x.dataset.v===this.view));const cols=Math.max(1,...this.rows.map(r=>r.length));
  if(this.view==='text'){body.innerHTML=`<textarea class="sh-text" spellcheck="false"></textarea>`;const ta=$('textarea',body);ta.value=this.text();ta.oninput=()=>{this.dirty=true;this.status()}}
  else{const n=Math.min(this.rows.length,this.limit);let h=`<div class="sh-wrap"><table class="sh-table"><thead><tr><th class="rn">#</th>${Array.from({length:cols},(_,i)=>`<th>${colName(i)}</th>`).join('')}</tr></thead><tbody>`;
   for(let r=0;r<n;r++){const row=this.rows[r];h+=`<tr><td class="rn">${r+1}</td>${Array.from({length:cols},(_,c)=>`<td contenteditable="true" data-r="${r}" data-c="${c}">${esc(row[c]??'')}</td>`).join('')}</tr>`}
   h+=`</tbody></table>${this.rows.length>n?`<div style="padding:12px"><button class="btn sm" data-more>显示更多（剩余 ${this.rows.length-n} 行）</button></div>`:''}</div>`;body.innerHTML=h;
   body.oninput=e=>{const td=e.target.closest('td[data-r]');if(!td)return;const r=+td.dataset.r,c=+td.dataset.c;while(this.rows[r].length<=c)this.rows[r].push('');this.rows[r][c]=td.innerText.replace(/\n$/,'');this.dirty=true;this.status()};

 async saveAs(){this.sync();const p=await UI.pickVfs({save:true,title:'另存为',name:this.path?P.base(this.path):'表格.csv'});if(!p)return;this.path=p;this.win.setTitle(P.base(p)+' - 表格');return this.save()}
 act(a){if(a==='open')UI.pickVfs({exts:['csv','tsv','txt'],title:'打开表格'}).then(p=>p&&this.open(p));else if(a==='save')this.save();else if(a==='saveas')this.saveAs();else if(a==='row'){this.sync();this.rows.push([]);this.dirty=true;this.render();const w=$('.sh-wrap',this.win.body);if(w)w.scrollTop=w.scrollHeight}
  else if(a==='col'){this.sync();const c=Math.max(...this.rows.map(r=>r.length));this.rows.forEach(r=>{while(r.length<=c)r.push('')});this.dirty=true;this.render()}else if(a==='np'&&this.path)Apps.launch('notepad',this.path)}

function mdFallback(s){let h=esc(s);h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre><code>${c}</code></pre>`);for(let i=6;i>0;i--)h=h.replace(new RegExp(`^${'#'.repeat(i)} (.*)$`,'gm'),`<h${i}>$1</h${i}>`);

  return `<h2>关于与兼容性</h2><div class="st-card" style="padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="sm-avatar" style="width:72px;height:72px;border-radius:20px">${LOGO.replace('<svg','<svg width="42" height="42"')}</div><div><div style="font-size:1.6em;font-weight:800;font-family:var(--font-display)">AERIS OS</div><div class="muted">晴空 · Frutiger Aero × Y2K Futurism · 单文件 Web 操作系统</div><div class="muted" style="font-size:.85em">主存储：${esc(fs.primary.label)} · 挂载点 ${fs.mounts.length} 个</div></div></div>
  <h3>运行环境</h3><div class="stat-grid"><div class="stat"><small>浏览器</small><div class="big-num" style="font-size:1.3em">${br} ${ver.split('.')[0]}</div></div><div class="stat"><small>屏幕</small><div class="big-num" style="font-size:1.3em">${screen.width}×${screen.height}</div><small>DPR ${devicePixelRatio}</small></div><div class="stat"><small>CPU 线程</small><div class="big-num" style="font-size:1.3em">${navigator.hardwareConcurrency||'?'}</div></div><div class="stat"><small>设备内存</small><div class="big-num" style="font-size:1.3em">${navigator.deviceMemory?navigator.deviceMemory+' GB':'未知'}</div></div><div class="stat"><small>输入方式</small><div class="big-num" style="font-size:1.3em">${isTouch()?'触摸':'鼠标'}</div></div></div>
  <h3>API 支持</h3><div class="st-card">${api.map(([n,ok])=>this.row(n,'',`<span class="chip ${ok?'ok':'no'}">${ok?'支持':'不支持'}</span>`)).join('')}</div>`}
 p_reset(){return `<h2>重置系统</h2><div class="st-card" style="padding:20px;border-color:var(--danger)"><b style="color:var(--danger);font-size:1.1em">一键重置</b><p class="muted">将清除 OPFS 与 IndexedDB 中的全部文件、修改日期元数据、桌面布局、设置、草稿与 Cookie，然后以全新状态重新启动。本地挂载的真实文件夹不会被删除。</p><button class="btn danger" data-act="reset">${I('trash')}清除文件系统并重置</button></div>`}
 async reset(){const v=await UI.prompt('此操作不可撤销。请输入“重置”以确认：','','一键重置');if(v!=='重置')return;const t=UI.toast('正在重置…',{progress:.2});
  try{clearTimeout(Meta.t);Meta.q.clear();const root=await navigator.storage?.getDirectory?.();if(root)await root.removeEntry('aeris',{recursive:true}).catch(()=>{})}catch{}
  try{IDB.db?.close();await new Promise(r=>{const q=indexedDB.deleteDatabase('aeris-os');q.onsuccess=q.onerror=q.onblocked=()=>r()})}catch{}
  try{Object.keys(localStorage).filter(k=>k.startsWith('aeris.')).forEach(k=>localStorage.removeItem(k))}catch{}Cookie.del('aeris_boot');t.close();location.reload()}
}

async function seed(){if(await fs.exists('/桌面'))return;for(const d of ['/桌面','/文档','/图片','/图片/漫画示例','/音乐','/视频','/下载'])await fs.mkdir(d,{recursive:true});
 await fs.writeFile('/桌面/欢迎使用 AERIS.txt',`欢迎来到 AERIS OS · 晴空\n\n这是一个完全运行在浏览器中的桌面操作系统，所有文件持久化保存在 OPFS（或 IndexedDB）中，刷新后不会丢失。\n\n快速上手\n• 单击图标即可打开（可在 设置 → 桌面 改为双击）\n• 在桌面或资源管理器空白处拖动可框选；拖动图标可在网格中自由摆放\n• 从电脑拖入文件/文件夹即可导入；把文件拖到电脑桌面即可导出\n• 右键菜单：新建、上传、粘贴、全屏模式、更换壁纸……\n• 窗口拖到屏幕边缘自动贴靠（Aero Snap），悬停右下角预览桌面（Aero Peek）\n• 设置 → 个性化 可切换 Frutiger Aero / Y2K Futurism 主题、深浅色、主题色、圆角\n• 资源管理器“挂载本地文件夹”可直接读写电脑上的真实目录（Chrome / Edge）\n• 打开 /图片/漫画示例 中任意一张图片，体验条漫阅读器\n\n移动端：触屏设备在资源管理器中可开启“框选模式”；长按打开右键菜单。\n`);
 await fs.writeFile('/桌面/示例网页.html',`<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>晴空示例</title>\n<style>\n  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,'Noto Sans SC';background:linear-gradient(180deg,#1f9ef0,#7fd4ff 60%,#b9f08a);}\n  .card{padding:36px 44px;border-radius:24px;background:rgba(255,255,255,.35);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 60px rgba(0,60,120,.35),inset 0 1px 0 #fff;text-align:center;color:#0b2a44}\n  h1{margin:0 0 8px;font-size:40px}\n  button{margin-top:16px;padding:10px 26px;border-radius:30px;border:1px solid #0a6fc0;color:#fff;font-size:16px;background:linear-gradient(180deg,#9fe3ff,#1e9bf0 50%,#0a6fc0 51%,#4cc0ff);box-shadow:0 4px 14px rgba(0,90,170,.45);cursor:pointer}\n</style>\n</head>\n<body>\n  <div class="card">\n    <h1>你好，晴空！</h1>\n    <p>右键此文件 → 编辑源代码，体验实时预览。</p>\n    <button onclick="this.textContent='已点击 '+(++window.n||(window.n=1))+' 次'">点我</button>\n  </div>\n</body>\n</html>\n`);
 await fs.writeFile('/桌面/数据示例.csv','月份,访问量,新用户,备注\n1月,1200,340,"新年活动"\n2月,980,210,\n3月,1560,480,"春季上新, 推广"\n4月,1720,520,\n5月,2100,690,"创历史新高"\n');
 await fs.writeFile('/文档/说明.md','# AERIS 文档\n\n- **存储**：OPFS + IndexedDB 双后端\n- **修改日期**：独立元数据层，移动/复制/解压都保留\n- **压缩**：ZIP / TAR / GZ 原生 + 7z-wasm（RAR、7Z、XZ…）\n\n```js\nawait fs.writeFile("/文档/hello.txt", "你好");\nconst text = await fs.readFile("/文档/hello.txt", "utf8");\n```\n\n> 用代码编辑器打开本文件可看到 Markdown 实时预览。\n');
 await fs.writeFile('/文档/config.json',JSON.stringify({name:'AERIS',version:'3.0',theme:['Frutiger Aero','Y2K Futurism'],storage:{primary:'OPFS',fallback:'IndexedDB'}},null,2));
 await fs.writeFile('/文档/样式示例.css','body {\n  font-family: "Noto Sans SC", sans-serif;\n  background: linear-gradient(160deg, #e3f8ff, #ffffff);\n  color: #0b2a44;\n}\nh1 { color: #0a84d6; text-shadow: 0 2px 8px rgba(10,132,214,.3); }\nbutton { padding: 8px 18px; border-radius: 20px; border: 0; background: #2fb4ff; color: #fff; }\n.card { padding: 16px; border-radius: 14px; background: rgba(255,255,255,.7); box-shadow: 0 8px 24px rgba(0,60,120,.15); }\n');
 for(let i=1;i<=12;i++)await fs.writeFile(`/图片/漫画示例/${i}.svg`,mangaPage(i));
 await fs.writeFile('/图片/玻璃球.svg',`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><radialGradient id="a" cx=".5" cy=".35" r=".65"><stop offset="0" stop-color="#e6fbff"/><stop offset=".4" stop-color="#55c8ff"/><stop offset=".8" stop-color="#0b5aa8"/><stop offset="1" stop-color="#043061"/></radialGradient><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="400" height="400" fill="#bfe9ff"/><ellipse cx="200" cy="360" rx="120" ry="18" fill="#0b5aa8" opacity=".25"/><circle cx="200" cy="200" r="140" fill="url(#a)"/><ellipse cx="200" cy="120" rx="100" ry="58" fill="url(#g)"/><circle cx="200" cy="200" r="140" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/></svg>`)}
async function initFS(){let opfs=null,idb=null;
 try{if(navigator.storage?.getDirectory){const r=await navigator.storage.getDirectory();const root=await r.getDirectoryHandle('aeris',{create:true});opfs=new HandleBackend(root,{id:'opfs',label:'OPFS',kind:'opfs',workerPrefix:['aeris']})}}catch(e){console.warn('OPFS 不可用',e)}
 if(IDB.db)idb=new IDBBackend();fs.available={opfs:!!opfs,idb:!!idb};fs.backends={opfs,idb};
 let primary=S.get('primaryBackend')==='idb'?(idb||opfs):(opfs||idb);if(!primary){primary=new MemBackend();UI.toast('OPFS 与 IndexedDB 均不可用，已降级为内存存储（刷新后数据会丢失）',{type:'warn',timeout:9000})}
 else if(S.get('primaryBackend')==='opfs'&&!opfs)UI.toast('OPFS 不可用，已自动降级为 IndexedDB',{type:'warn'});
 fs.primary=primary;fs.mount('/',primary,{label:primary.label});const sec=primary===opfs?idb:primary===idb?opfs:null;if(sec&&S.get('showBothBackends')){fs.mount('/mnt/'+sec.id,sec,{label:sec.label})}
 try{await seed()}catch(e){console.error('seed',e)}}
document.addEventListener('keydown',e=>{if(e.key!=='Meta')Taskbar._meta=false;if(e.key==='Escape'){Ctx.hide();StartMenu.close();Calendar.close()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){if(e.defaultPrevented)return;e.preventDefault();WM.wins.get(WM.activeId)?.onSave?.();return}
 if(e.ctrlKey&&e.key==='Escape'){StartMenu.toggle();return}if(e.key==='Meta')Taskbar._meta=true;
 const t=e.target;if(t.closest?.('input,textarea,select,[contenteditable=true],.CodeMirror')||$('.dlg-bk'))return;const c=Focus.ctx;if(c===Desktop)Desktop.onKey(e);else if(c&&c.onKey&&WM.wins.has(c.id))c.onKey(e)});
document.addEventListener('keyup',e=>{if(e.key==='Meta'&&Taskbar._meta){Taskbar._meta=false;StartMenu.toggle()}});
(async function boot(){S.load();Theme.apply();Taskbar.init();Desktop.init();Focus.ctx=Desktop;
 await IDB.open();if(await S.restoreFromIDB())Theme.apply();if(!Object.keys(Desktop.pos).length){const dp=await IDB.kvGet('desk.pos');if(dp)Desktop.pos=dp}
 await Meta.load();await initFS();Taskbar.clock();await Desktop.render();Theme.apply();
 const pend=await Mounts.restore();if(pend.length)UI.toast(`有 ${pend.length} 个本地文件夹需要重新授权才能挂载`,{sticky:true,actions:[{label:'重新挂载全部',action:async()=>{for(const p of [...Mounts.pending]){try{await Mounts.remount(p)}catch(e){UI.toast(p.name+'：'+errMsg(e),{type:'error'})}}}},{label:'稍后',action:()=>{}}]});
 try{if(navigator.storage?.persisted&&!(await navigator.storage.persisted()))navigator.storage.persist?.().catch(()=>{})}catch{}
})();
