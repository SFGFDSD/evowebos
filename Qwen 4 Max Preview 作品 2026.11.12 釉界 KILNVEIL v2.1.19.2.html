  media:{ name:'影音播放器', icon:'play', tint:'var(--info)', desktop:false, open:async () => { const p = await Dlg.prompt('影音播放器', '输入 VFS 中的音视频路径', '/音乐/窑铃.wav'); if (p) Media.open(p); } },
  vm:{ name:'PC 虚拟机', icon:'cpu', tint:'var(--tx2)', desktop:false, open:() => VM.open() }
};
const RECENT = { list:(() => { try { return JSON.parse(localStorage.getItem('kilnveil.recent') || '[]'); } catch (e) { return []; } })(),
  push(p) { RECENT.list = [p].concat(RECENT.list.filter(x => x !== p)).slice(0, 8); localStorage.setItem('kilnveil.recent', JSON.stringify(RECENT.list)); } };
const _openPath = openPath;
openPath = async function (p, opt) { if (!opt || !opt.app) RECENT.push(p); return _openPath(p, opt); };

function closeStart() { $('#startmenu').classList.remove('on'); $('#startbtn').classList.remove('on'); }
function renderStart() {
  const sm = $('#startmenu');
  sm.innerHTML =
    '<div class="sm-hd"><div class="sm-brand">' + icon('spark') + '釉界<small>KILNVEIL</small></div>' +
    '<input class="inp sm-q" placeholder="搜索应用与文件…" style="width:100%;margin-top:11px"></div>' +
    '<div class="sm-body"><div class="sm-sec">应用</div><div class="sm-grid"></div><div class="sm-res"></div>' +
    '<div class="sm-sec">快速访问</div><div class="sm-dirs"></div></div>' +
    '<div class="sm-ft"><button class="btn sm f-set">' + icon('settings') + '设置</button>' +
    '<button class="btn sm f-full">' + icon('fullscreen') + '全屏</button>' +
    '<button class="btn sm f-mount">' + icon('mount') + '挂载本地文件夹</button>' +
    '<span style="flex:1"></span><button class="btn sm f-desk">' + icon('layout') + '显示桌面</button></div>';
  const grid = $('.sm-grid', sm);
  Object.keys(APPS).filter(k => !S.hiddenApps.includes(k)).forEach(k => {
    const a = APPS[k];
    const n = el('div', 'sm-app', '<div class="thumb" style="color:' + a.tint + '">' + icon(a.icon) + '</div><div class="nm">' + a.name + '</div>');
    n.dataset.name = a.name;
    n.onclick = () => { closeStart(); a.open({}); };
    grid.appendChild(n);
  });
  const dirs = $('.sm-dirs', sm);
  [['/桌面', '桌面', 'home'], ['/文档', '文档', 'text'], ['/图片', '图片', 'image'], ['/下载', '下载', 'download'], ['/mnt', '存储卷与挂载', 'hdd'], ['/回收站', '回收站', 'trash']].forEach(([p, n, ic]) => {
    const r = el('div', 'sm-row', icon(ic) + '<span>' + n + '</span><span class="sub">' + p + '</span>');
    r.onclick = () => { closeStart(); Explorer.open(p); };
    dirs.appendChild(r);
  });
  if (RECENT.list.length) {
    const box = $('.sm-res', sm);
    box.appendChild(el('div', 'sm-sec', '最近打开'));
    RECENT.list.slice(0, 5).forEach(p => {
      const r = el('div', 'sm-row', icon(U.fileIcon({ name:U.base(p), kind:'file' })) + '<span>' + U.esc(U.base(p)) + '</span><span class="sub">' + U.esc(U.dir(p)) + '</span>');
      r.onclick = () => { closeStart(); openPath(p); };
      box.appendChild(r);
    });
  }
  $('.f-set', sm).onclick = () => { closeStart(); SettingsApp.open(); };
  $('.f-full', sm).onclick = () => { closeStart(); toggleFullscreen(); };
  $('.f-mount', sm).onclick = () => { closeStart(); mountLocalFolder(); };
  $('.f-desk', sm).onclick = () => { closeStart(); WM.showDesktop(); };
  const q = $('.sm-q', sm);
  q.onkeydown = e => e.stopPropagation();
  q.oninput = U.debounce(async () => {
    const v = q.value.trim().toLowerCase();
    $$('.sm-app', grid).forEach(n => n.style.display = !v || n.dataset.name.toLowerCase().includes(v) ? '' : 'none');
    const box = $('.sm-res', sm);
    if (!v) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="sm-sec">文件搜索</div><div class="sm-row"><div class="spin"></div><span class="sub">正在检索文件系统…</span></div>';
    const res = await FS.search('/', v, 24);
    if (q.value.trim().toLowerCase() !== v) return;
    box.innerHTML = '<div class="sm-sec">文件搜索 · ' + res.length + ' 项</div>';
    res.forEach(it => {
      const r = el('div', 'sm-row', '<span style="color:' + U.tint(it) + '">' + icon(U.fileIcon(it)) + '</span><span>' + U.esc(it.name) + '</span><span class="sub">' + U.esc(U.dir(it.path)) + '</span>');
      r.onclick = () => { closeStart(); openPath(it.path); };
      box.appendChild(r);
    });
    if (!res.length) box.innerHTML += '<div class="sm-row dim">没有匹配的文件</div>';
  }, 280);
}
$('#startbtn').innerHTML = icon('spark') + '<span class="bt">釉界</span>';
$('#startbtn').onclick = e => {
  e.stopPropagation();
  const sm = $('#startmenu');
  const on = !sm.classList.contains('on');
  sm.classList.toggle('on', on); $('#startbtn').classList.toggle('on', on);
  if (on) { renderStart(); setTimeout(() => { const q = $('.sm-q', sm); if (q && !IS_TOUCH) q.focus(); }, 60); }
};
$('#themeBtn').onclick = () => { Settings.set('theme', S.theme === 'dark' ? 'light' : 'dark'); };

/* ---------- 时钟与日历 ---------- */
let calMonth = new Date();
function tickClock() {
  const now = new Date();
  const c = $('#clock');
  $('.t', c).textContent = U.time(now.getTime()).trim();
  $('.d', c).textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 周' + '日一二三四五六'[now.getDay()];
  if ($('#calpop').classList.contains('on')) renderCal();
}
function renderCal() {
  const p = $('#calpop');
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), start = first.getDay(), days = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const today = new Date();
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const dnum = i - start + 1;
    let cls = 'day', txt = dnum;
    if (dnum < 1) { cls += ' out'; txt = prevDays + dnum; }
    else if (dnum > days) { cls += ' out'; txt = dnum - days; }
    else if (dnum === today.getDate() && m === today.getMonth() && y === today.getFullYear()) cls += ' today';
    cells += '<div class="' + cls + '">' + txt + '</div>';
  }
  p.innerHTML = '<div class="cal-hd"><button class="btn sm c-prev">' + icon('back') + '</button>' +
    '<div style="font-family:var(--f-dis);font-size:15px;letter-spacing:.1em">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
    '<button class="btn sm c-next">' + icon('forward') + '</button></div>' +
    '<div class="cal-grid">' + ['日', '一', '二', '三', '四', '五', '六'].map(d => '<div class="dow">' + d + '</div>').join('') + cells + '</div>' +
    '<div class="row" style="margin-top:11px;justify-content:space-between"><span class="mono" style="font-size:12px;color:var(--acc)">' + U.time(Date.now()).trim() + '</span>' +
    '<button class="btn sm c-today">回到今天</button></div>';
  $('.c-prev', p).onclick = e => { e.stopPropagation(); calMonth = new Date(y, m - 1, 1); renderCal(); };
  $('.c-next', p).onclick = e => { e.stopPropagation(); calMonth = new Date(y, m + 1, 1); renderCal(); };
  $('.c-today', p).onclick = e => { e.stopPropagation(); calMonth = new Date(); renderCal(); };
}
$('#clock').onclick = e => { e.stopPropagation(); const p = $('#calpop'); const on = !p.classList.contains('on'); p.classList.toggle('on', on); if (on) { calMonth = new Date(); renderCal(); } };

/* ---------- 全局快捷键与拖放兜底 ---------- */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(e.target.tagName) || e.target.closest('.CodeMirror');
  if (e.key === 'Escape') { Menu.close(); closeStart(); $('#calpop').classList.remove('on'); }
  if (e.key === 'F5' && !typing) { e.preventDefault(); Thumb.clear(); Desktop.refresh(); Explorer.instances.forEach(i => i.load()); toast('已刷新', 'ok', 1200); }
  if (e.key === 'F2' && !typing && Desktop.sel.size === 1) {
    const p = Desktop.selectedPaths()[0];
    if (p) Dlg.prompt('重命名', '输入新的名称', U.base(p)).then(n => n && FS.rename(p, n).then(() => Desktop.refresh()).catch(err => toast(err.message, 'error')));
  }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); Terminal.open(); }
  if (!typing && !WM.wins.length) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); Desktop.sel = new Set(Desktop.items.map(i => i.key)); Desktop.paintSel(); }
    if (e.key === 'Delete' && Desktop.sel.size) deletePaths(Desktop.selectedPaths());
    if (e.key === 'Enter' && Desktop.sel.size === 1) { const it = Desktop.items.find(i => Desktop.sel.has(i.key)); if (it) Desktop.activate(it); }
  }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); });
document.addEventListener('contextmenu', e => {
  if (e.target.closest('input,textarea,.CodeMirror,.term')) return;
  if (!e.target.closest('#desktop') && !e.target.closest('.ex-body') && !e.target.closest('.dicon') && !e.target.closest('[data-p]')) e.preventDefault();
});
SBus.push(() => document.body.classList.toggle('tb-nolabel', !S.taskbarLabels));

/* ---------- 启动（无假加载动画，直接进入系统） ---------- */
(async function boot() {
  Settings.apply();
  document.body.classList.toggle('tb-nolabel', !S.taskbarLabels);
  tickClock(); setInterval(tickClock, 1000);
  try {
    await FS.init();
  } catch (e) {
    console.error(e);
    toast('文件系统初始化异常：' + e.message, 'error', 8000);
  }
  applyWallpaper();
  await seedSystem();
  Desktop.init();
  await Desktop.refresh();
  renderStart();
  if (FS.memOnly) toast('OPFS 与 IndexedDB 均不可用，已进入临时内存模式，数据不会持久化。', 'error', 9000);
  else if (!FS.opfsOK) toast('OPFS 不可用，已自动降级到 IndexedDB 存储。', 'warn', 6000);
  try {
    const saved = await FS.savedMounts();
    if (saved.length) toast('有 ' + saved.length + ' 个本地文件夹需要重新授权，可在资源管理器侧栏或设置中恢复。', 'warn', 7000);
  } catch (e) {}
  if (!localStorage.getItem('kilnveil.hello')) {
    localStorage.setItem('kilnveil.hello', '1');
    setTimeout(() => toast('欢迎来到釉界 · 单击图标打开，空白处拖动框选，右键唤出釉面菜单。', 'ok', 7000), 700);
  }
  window.addEventListener('beforeunload', () => { try { Settings.save(); } catch (e) {} });
})();
</script>
