<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3442">
<title>CDE/OS · 浏览器桌面环境</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
/* =========================================================
   CDE/OS — 设计系统
   灵感：Common Desktop Environment (Solaris / HP-UX) 的斜面浮雕、
   前面板 (Front Panel)、多工作区，以赭石 × 石板 × 青瓷为主色。
   ========================================================= */
:root{
  --font-ui:"Chakra Petch","LXGW WenKai Screen","LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif;
  --font-cn:"LXGW WenKai Screen","LXGW WenKai","PingFang SC","Microsoft YaHei",serif;
  --font-mono:"IBM Plex Mono","LXGW WenKai Mono Screen",ui-monospace,Menlo,Consolas,monospace;
  --panel-h:72px; --ease:cubic-bezier(.22,.9,.24,1); --scale:1;
  --cell-w:92px; --cell-h:100px; --ico:46px;
}
html[data-theme="dark"]{
  --desk:#141a24; --face:#2b3442; --face2:#252d3a; --face3:#1c232e;
  --hi:#4f5d73; --lo:#0b0f15; --mid:#3a4658;
  --text:#ebe2ce; --dim:#9ea7b3; --faint:#687282;
  --accent:#d9a441; --accent-ink:#1a1206;
  --teal:#5fa8a0; --rust:#c8553d; --olive:#8fa05a; --cobalt:#5b8cc9;
  --title-a:#7b5a2a; --title-a2:#a17a3a; --title-i:#364152;
  --sel:rgba(95,168,160,.30); --sel-b:#5fa8a0;
  --input:#151b24; --win-bg:#20272f;
  --shadow:0 22px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --desk:#8e9aa8; --face:#cfc9b8; --face2:#c3bcaa; --face3:#b4ad99;
  --hi:#f6f2e6; --lo:#6b6555; --mid:#a29b88;
  --text:#1d1b16; --dim:#4f4b41; --faint:#7d776a;
  --accent:#b0502a; --accent-ink:#fff;
  --teal:#2f6f7a; --rust:#a8402b; --olive:#5c6e2e; --cobalt:#2f5f99;
  --title-a:#3c5f82; --title-a2:#5a7fa5; --title-i:#a8a18e;
  --sel:rgba(47,111,122,.22); --sel-b:#2f6f7a;
  --input:#f1ecdf; --win-bg:#e7e1d2;
  --shadow:0 18px 44px rgba(40,30,10,.35),0 3px 10px rgba(40,30,10,.2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--desk);color:var(--text);font-family:var(--font-ui);font-size:calc(13.5px * var(--scale));line-height:1.45;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input,textarea,select,button{font:inherit;color:inherit;letter-spacing:inherit}
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block;flex-shrink:0}
::selection{background:var(--accent);color:var(--accent-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--mid) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--face3)}
::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
html.no-anim *{animation:none !important;transition:none !important}

/* ---------- 基础控件：斜面浮雕 ---------- */
.bv{box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.bvin{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--face2)}
.btn:active,.btn.on{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:var(--face3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{background:var(--rust);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);flex-shrink:0}
.ibtn:hover{color:var(--accent)}
.ibtn:active,.ibtn.on{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:var(--face3)}
.ibtn:disabled{opacity:.35;pointer-events:none}
.tbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.tbtn:hover{background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.tbtn:active,.tbtn.on{background:var(--face3);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.tbtn.on{color:var(--accent)}
.tbtn:disabled{opacity:.4;pointer-events:none}
.tsep{width:2px;align-self:stretch;margin:4px 4px;box-shadow:inset 1px 0 0 var(--lo),inset -1px 0 0 var(--hi);flex-shrink:0}
.inp{height:30px;padding:0 9px;background:var(--input);border:0;outline:0;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);min-width:0;border-radius:0}
.inp:focus{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi),0 0 0 1px var(--accent)}
textarea.inp{height:auto;padding:8px}
.grow{flex:1}
.mono{font-family:var(--font-mono)}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:22px;background:var(--input);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);transition:transform .22s var(--ease),background .2s}
.sw:checked{background:color-mix(in srgb,var(--accent) 45%,var(--input))}
.sw:checked::after{transform:translateX(20px);background:var(--accent)}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}

/* ---------- 桌面 ---------- */
#wallpaper{position:fixed;inset:0;background:var(--desk);animation:wpIn 1.1s ease both}
#wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.35),transparent 60%);pointer-events:none}
#desktop{position:fixed;left:0;top:0;right:0;bottom:var(--panel-h);overflow:hidden;touch-action:none}
#desk-icons{position:absolute;inset:0}
.dicon{position:absolute;width:var(--cell-w);height:var(--cell-h);display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;transition:left .34s var(--ease),top .34s var(--ease),opacity .2s;touch-action:none;cursor:default;outline:none}
.dicon.enter{animation:iconIn .6s var(--ease) backwards;animation-delay:calc(var(--i) * 45ms + 180ms)}
.dicon.pop{animation:iconIn .35s var(--ease) backwards}
.dicon-img{width:var(--ico);height:var(--ico);display:grid;place-items:center;transition:transform .2s var(--ease);position:relative}
.dicon-img svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.dicon-img img{max-width:100%;max-height:100%;object-fit:cover;box-shadow:0 0 0 2px #ece3cf,0 0 0 3px #12161d,0 4px 10px rgba(0,0,0,.5)}
.dicon-label{max-width:100%;font-size:calc(12px * var(--scale));line-height:1.3;text-align:center;padding:1px 5px;color:#fff;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.7);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dicon:hover .dicon-img{transform:translateY(-2px)}
.dicon.sel .dicon-label{background:var(--sel-b);text-shadow:none;-webkit-line-clamp:4}
.dicon.sel .dicon-img::after{content:"";position:absolute;inset:-5px;background:var(--sel);outline:1px dotted var(--sel-b)}
.dicon.drop-hover .dicon-img{transform:scale(1.16)}
.dicon.drop-hover .dicon-img::after{content:"";position:absolute;inset:-6px;outline:2px dashed var(--accent)}
.dicon.dragging{opacity:.35}
.dicon.cut{opacity:.5}
.grid-ghost{position:absolute;width:var(--cell-w);height:var(--cell-h);border:1.5px dashed var(--accent);background:rgba(217,164,65,.08);pointer-events:none;opacity:0;transition:left .12s var(--ease),top .12s var(--ease),opacity .15s}
.grid-ghost.on{opacity:1}
.marquee{position:absolute;border:1px solid var(--sel-b);background:var(--sel);pointer-events:none;z-index:50}
.touch-ghost{transition:none !important;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.ghost-count,.drag-badge span{position:absolute;top:0;right:8px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:600 12px var(--font-mono)}
.drag-badge{position:fixed;left:-500px;top:-500px;width:70px;height:70px;display:grid;place-items:center;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.drag-badge svg{width:40px;height:40px}

/* ---------- 窗口 ---------- */
#windows{position:fixed;left:0;top:0;right:0;bottom:var(--panel-h);pointer-events:none;z-index:10}
body.pseudo-fs-on #windows{z-index:2147483000;bottom:0}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--face);padding:4px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),inset 2px 2px 0 color-mix(in srgb,var(--hi) 45%,transparent),var(--shadow);min-width:240px;min-height:150px;animation:winIn .26s var(--ease) backwards;transition:opacity .2s,transform .26s var(--ease),filter .2s}
.win.geo{transition:left .24s var(--ease),top .24s var(--ease),width .24s var(--ease),height .24s var(--ease),opacity .2s,transform .26s var(--ease)}
.win.minimized{opacity:0;transform:translateY(60px) scale(.82);pointer-events:none}
.win.closing{animation:winOut .18s ease forwards;pointer-events:none}
.win.ws-hidden{display:none !important}
.win.max{padding:2px}
.win-title{display:flex;align-items:stretch;height:30px;gap:3px;flex-shrink:0;color:var(--dim);touch-action:none}
.wbtn{width:28px;display:grid;place-items:center;background:var(--title-i);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);color:inherit;flex-shrink:0;transition:background .2s}
.wbtn:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.wbtn:hover{color:var(--text)}
.wbtn.wclose:hover{background:var(--rust);color:#fff}
.wtitle{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;background:var(--title-i);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);font-weight:600;letter-spacing:.05em;font-size:calc(12.5px * var(--scale));cursor:default;transition:background .2s}
.wtitle .wt-ico{width:18px;height:18px}
.wtitle .wt-ico svg{width:18px;height:18px}
.wtitle .wt-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win.active .win-title{color:#fff}
.win.active .wtitle,.win.active .wbtn{background:linear-gradient(180deg,var(--title-a2),var(--title-a))}
.win.active .wbtn{box-shadow:inset 1px 1px 0 rgba(255,255,255,.28),inset -1px -1px 0 rgba(0,0,0,.45)}
.win.active .wtitle{box-shadow:inset 1px 1px 0 rgba(255,255,255,.28),inset -1px -1px 0 rgba(0,0,0,.45)}
.win-body{flex:1;min-height:0;margin-top:4px;background:var(--win-bg);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:3;touch-action:none}
.rz.n{top:-3px;left:12px;right:12px;height:8px;cursor:ns-resize}
.rz.s{bottom:-3px;left:12px;right:12px;height:8px;cursor:ns-resize}
.rz.e{right:-3px;top:12px;bottom:12px;width:8px;cursor:ew-resize}
.rz.w{left:-3px;top:12px;bottom:12px;width:8px;cursor:ew-resize}
.rz.ne{right:-3px;top:-3px;width:16px;height:16px;cursor:nesw-resize}
.rz.nw{left:-3px;top:-3px;width:16px;height:16px;cursor:nwse-resize}
.rz.se{right:-3px;bottom:-3px;width:16px;height:16px;cursor:nwse-resize}
.rz.sw{left:-3px;bottom:-3px;width:16px;height:16px;cursor:nesw-resize}
.win.max .rz{display:none}
body.dragging-win .win iframe,body.dragging-win .win canvas{pointer-events:none}
#snap-preview{position:fixed;z-index:9;pointer-events:none;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);backdrop-filter:blur(3px);opacity:0;transform:scale(.97);transition:all .2s var(--ease)}
#snap-preview.on{opacity:1;transform:none}
body.peek .win:not(.peek-target){opacity:.06 !important;filter:blur(1px)}
body.peek .win.peek-target{outline:2px solid var(--accent)}
body.peek .win.peek-target.minimized{opacity:.96;transform:none}
body.peek-desktop .win{opacity:.05 !important}
body.peek-desktop .win{outline:1px dashed color-mix(in srgb,var(--accent) 60%,transparent)}

/* ---------- 前面板 Front Panel ---------- */
#panel{position:fixed;left:0;right:0;bottom:0;height:var(--panel-h);display:flex;align-items:stretch;gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom));background:var(--face);box-shadow:inset 0 1px 0 var(--hi),inset 0 2px 0 color-mix(in srgb,var(--hi) 40%,transparent),0 -8px 24px rgba(0,0,0,.35);z-index:5000}
.fp-sec{display:flex;align-items:center;gap:4px;padding:0 5px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);animation:rise .7s var(--ease) backwards}
.fp-sec:nth-child(1){animation-delay:.05s}.fp-sec:nth-child(2){animation-delay:.12s}.fp-sec:nth-child(3){animation-delay:.19s}.fp-sec:nth-child(4){animation-delay:.26s}.fp-sec:nth-child(5){animation-delay:.33s}
.fp-startbtn{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);font-weight:700;letter-spacing:.16em;font-size:13px}
.fp-startbtn svg{width:32px;height:32px;transition:transform .5s var(--ease)}
.fp-startbtn:hover svg{transform:rotate(90deg)}
.fp-startbtn.on{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:var(--face3)}
.fp-launch{position:relative;width:52px;height:52px;display:grid;place-items:center;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);transition:background .15s}
.fp-launch:hover{background:var(--face2)}
.fp-launch:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.fp-launch svg{width:34px;height:34px;transition:transform .25s var(--ease)}
.fp-launch:hover svg{transform:translateY(-2px) scale(1.06)}
.fp-launch-w{position:relative;display:flex;flex-direction:column;align-items:center}
.fp-tab{position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:34px;height:14px;display:grid;place-items:center;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);color:var(--dim)}
.fp-tab:hover{color:var(--accent)}
.fp-tab.on svg{transform:rotate(180deg)}
.fp-tasks-wrap{flex:1;min-width:0;padding:0 4px}
.fp-tasks{display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;width:100%;height:100%;scrollbar-width:none}
.fp-tasks::-webkit-scrollbar{display:none}
.fp-tasks:empty::before{content:"没有打开的窗口";color:var(--faint);font-size:12px;letter-spacing:.2em;padding-left:8px}
.task{position:relative;display:flex;align-items:center;gap:7px;height:44px;min-width:0;flex:0 1 190px;padding:0 4px 0 8px;background:var(--face2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);cursor:pointer;animation:taskIn .3s var(--ease) backwards}
.task .t-ico svg{width:24px;height:24px}
.task .tt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px}
.task .tx{width:22px;height:22px;display:grid;place-items:center;opacity:.45;flex-shrink:0}
.task .tx:hover{opacity:1;background:var(--rust);color:#fff}
.task.active{background:var(--face3);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.task.active::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;height:2px;background:var(--accent)}
.task.min .tt{opacity:.6;font-style:italic}
.ws-grid{display:grid;grid-template-columns:repeat(2,auto);gap:3px}
.ws-btn{height:24px;min-width:60px;padding:0 6px;font-size:11px;letter-spacing:.06em;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);background:color-mix(in srgb,var(--wsc) 26%,var(--face));position:relative;white-space:nowrap}
.ws-btn .ws-n{font-family:var(--font-mono);opacity:.7;margin-right:3px}
.ws-btn .ws-dot{position:absolute;right:3px;top:3px;width:5px;height:5px;background:var(--wsc)}
.ws-btn.on{background:var(--wsc);color:#101010;box-shadow:inset 1px 1px 0 rgba(0,0,0,.4),inset -1px -1px 0 rgba(255,255,255,.3);font-weight:600}
.fp-ctl{display:flex;flex-direction:column;gap:3px}
.fp-mini{width:30px;height:24px;display:grid;place-items:center;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.fp-mini:hover{color:var(--accent)}
.fp-mini:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.fp-tray .fp-ctl{flex-direction:column}
.clock{height:52px;min-width:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:var(--face3);font-family:var(--font-mono)}
.clock #clock-time{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.04em;white-space:nowrap}
.clock #clock-date{font-size:10.5px;color:var(--dim);font-family:var(--font-cn);white-space:nowrap}
.peek-strip{width:12px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);cursor:pointer;background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--hi) 40%,transparent) 3px 4px)}
.peek-strip:hover{background-color:var(--face2)}

/* 子面板 / 菜单 */
.menu{position:fixed;z-index:100000;min-width:210px;max-width:320px;padding:3px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),inset 2px 2px 0 color-mix(in srgb,var(--hi) 40%,transparent),0 14px 34px rgba(0,0,0,.5);animation:menuIn .16s var(--ease) backwards;font-size:13px}
.menu .m-title{padding:5px 10px 6px;font-size:11px;letter-spacing:.18em;color:var(--dim);border-bottom:1px solid var(--lo);box-shadow:0 1px 0 var(--hi);margin-bottom:3px;text-transform:uppercase}
.mi{display:flex;align-items:center;gap:9px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.mi .mi-ic{width:18px;height:18px;display:grid;place-items:center;color:var(--dim)}
.mi .mi-ic svg.asvg,.mi .mi-ic svg.fsvg{width:18px;height:18px}
.mi .mi-l{flex:1;overflow:hidden;text-overflow:ellipsis}
.mi .mi-k{font-family:var(--font-mono);font-size:11px;color:var(--faint)}
.mi:hover,.mi.open{background:var(--accent);color:var(--accent-ink)}
.mi:hover .mi-ic,.mi.open .mi-ic,.mi:hover .mi-k{color:inherit}
.mi.dis{opacity:.4;pointer-events:none}
.mi.bold .mi-l{font-weight:700}
.msep{height:2px;margin:4px 6px;box-shadow:inset 0 1px 0 var(--lo),inset 0 -1px 0 var(--hi)}
.subpanel{min-width:190px}

/* 开始菜单 */
.startmenu{position:fixed;left:6px;bottom:calc(var(--panel-h) + 6px);width:min(430px,calc(100vw - 12px));max-height:min(620px,calc(100vh - var(--panel-h) - 20px));display:flex;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),var(--shadow);z-index:6000;animation:startIn .28s var(--ease) backwards}
.sm-band{width:38px;flex-shrink:0;background:linear-gradient(180deg,var(--title-a2),var(--title-a));display:flex;align-items:flex-end;justify-content:center;padding:14px 0;color:#fff}
.sm-band span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;letter-spacing:.5em;font-size:14px}
.sm-main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px;gap:8px;overflow:hidden}
.sm-search{display:flex;align-items:center;gap:6px;background:var(--input);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);padding:0 8px;height:34px}
.sm-search input{flex:1;background:none;border:0;outline:0;min-width:0}
.sm-scroll{overflow:auto;flex:1;min-height:0;padding-right:2px}
.sm-h{font-size:10.5px;letter-spacing:.24em;color:var(--faint);margin:10px 2px 6px;display:flex;align-items:center;gap:8px}
.sm-h::after{content:"";flex:1;height:2px;box-shadow:inset 0 1px 0 var(--lo),inset 0 -1px 0 var(--hi)}
.sm-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;font-size:11.5px;text-align:center;transition:background .15s;animation:iconIn .4s var(--ease) backwards;animation-delay:calc(var(--i) * 22ms)}
.sm-app svg{width:34px;height:34px;transition:transform .2s var(--ease)}
.sm-app:hover{background:var(--face2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.sm-app:hover svg{transform:translateY(-2px)}
.sm-row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;text-align:left;font-size:12.5px}
.sm-row:hover{background:var(--accent);color:var(--accent-ink)}
.sm-row svg.fsvg,.sm-row svg.asvg{width:20px;height:20px}
.sm-row small{color:var(--faint);margin-left:auto;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.sm-row:hover small{color:inherit}
.sm-foot{display:flex;gap:4px}
.sm-foot .btn{flex:1;height:32px;font-size:12px;padding:0 6px}

/* 日历 */
.calendar{position:fixed;right:10px;bottom:calc(var(--panel-h) + 6px);width:300px;padding:12px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),var(--shadow);z-index:6000;animation:startIn .25s var(--ease) backwards}
.cal-now{font-family:var(--font-mono);font-size:30px;font-weight:600;color:var(--accent);line-height:1.1}
.cal-today{font-family:var(--font-cn);color:var(--dim);margin-bottom:10px}
.cal-head{display:flex;align-items:center;gap:3px;margin-bottom:6px}
.cal-head .t{flex:1;text-align:center;font-weight:600;letter-spacing:.08em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .wd{font-size:11px;color:var(--faint);padding:4px 0}
.cal-grid .d{height:34px;display:grid;place-items:center;font-family:var(--font-mono);font-size:12.5px;cursor:pointer}
.cal-grid .d:hover{background:var(--face2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.cal-grid .d.o{color:var(--faint)}
.cal-grid .d.we{color:var(--rust)}
.cal-grid .d.today{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-grid .d.pick{outline:1px solid var(--accent);outline-offset:-2px}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--dim)}

/* 对话框 / 通知 */
.modal-back{position:fixed;inset:0;z-index:90000;background:rgba(5,8,12,.45);display:grid;place-items:center;padding:14px;animation:fadeIn .15s ease}
.modal-back.out{opacity:0;transition:opacity .15s}
.dialog{width:min(460px,100%);background:var(--face);padding:4px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),var(--shadow);animation:winIn .22s var(--ease) backwards;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.dlg-title{height:28px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--title-a2),var(--title-a));color:#fff;font-weight:600;letter-spacing:.08em;box-shadow:inset 1px 1px 0 rgba(255,255,255,.28),inset -1px -1px 0 rgba(0,0,0,.45);flex-shrink:0}
.dlg-body{display:flex;gap:14px;padding:18px 16px 14px;overflow:auto}
.dlg-ic{color:var(--accent);flex-shrink:0}
.dlg-content{flex:1;min-width:0}
.dlg-msg{margin-bottom:10px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.dlg-btns{display:flex;justify-content:flex-end;gap:6px;padding:10px 12px;box-shadow:inset 0 1px 0 var(--hi);flex-shrink:0}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;background:var(--face2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);transition:background .15s,transform .15s}
.choice:hover{background:var(--accent);color:var(--accent-ink);transform:translateX(3px)}
.choice.primary{box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),inset 3px 0 0 var(--accent)}
.choice .ch-ic svg{width:28px;height:28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv b{font-weight:500;color:var(--dim);white-space:nowrap}
.kv span{word-break:break-all;font-family:var(--font-mono);font-size:12px}
#toasts{position:fixed;right:12px;bottom:calc(var(--panel-h) + 12px);z-index:95000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100vw - 24px)}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;min-width:240px;max-width:400px;padding:10px 8px 10px 12px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),inset 4px 0 0 var(--tc,var(--teal)),0 10px 30px rgba(0,0,0,.4);animation:toastIn .3s var(--ease) backwards;flex-wrap:wrap}
.toast.out{opacity:0;transform:translateX(30px);transition:all .25s}
.toast.t-ok{--tc:var(--olive)}.toast.t-warn{--tc:var(--accent)}.toast.t-err{--tc:var(--rust)}
.t-ic{color:var(--tc,var(--teal));margin-top:1px}
.t-msg{flex:1;min-width:0;font-size:12.5px;line-height:1.5;word-break:break-word}
.t-x{opacity:.5;padding:2px}.t-x:hover{opacity:1}
.t-acts{flex-basis:100%;display:flex;gap:6px;justify-content:flex-end}
.t-acts .btn{height:26px;padding:0 10px;font-size:12px}

/* 锁屏 */
#lock{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 30%,rgba(43,52,66,.85),rgba(8,10,14,.97));backdrop-filter:blur(14px);color:#ebe2ce;cursor:pointer;animation:fadeIn .4s ease}
#lock[hidden]{display:none}
#lock .lk-time{font-family:var(--font-mono);font-size:clamp(56px,12vw,120px);font-weight:500;color:#d9a441;line-height:1}
#lock .lk-date{font-family:var(--font-cn);font-size:20px;letter-spacing:.2em}
#lock .lk-hint{margin-top:30px;font-size:12px;letter-spacing:.3em;opacity:.55;animation:blink 2.4s ease infinite}
#lock .lk-mark svg{width:64px;height:64px;margin-bottom:20px}

/* ---------- 文件管理器 ---------- */
.ex{--c-name:280px;--c-date:160px;--c-type:130px;--c-size:90px}
.ex-bar{display:flex;align-items:center;gap:4px;padding:6px;background:var(--face);flex-shrink:0}
.ex-crumbs{flex:1;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:text;height:30px;padding:0 4px}
.ex-crumbs::-webkit-scrollbar{display:none}
.ex-crumbs input{width:100%;background:none;border:0;outline:0;font-family:var(--font-mono);font-size:12.5px}
.crumb{padding:3px 6px;white-space:nowrap;cursor:pointer;font-size:12.5px}
.crumb:hover{background:var(--face);color:var(--accent)}
.crumb-sep{opacity:.45;flex-shrink:0}
.ex-search{display:flex;align-items:center;gap:5px;background:var(--input);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);padding:0 7px;height:30px;width:270px;color:var(--dim)}
.ex-search input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--text)}
.ex-glob{display:flex;align-items:center;gap:3px;font-size:11.5px;white-space:nowrap;cursor:pointer}
.ex-tools{display:flex;align-items:center;gap:1px;padding:3px 6px;background:var(--face2);overflow-x:auto;flex-shrink:0;box-shadow:inset 0 1px 0 var(--lo),inset 0 -1px 0 var(--lo);scrollbar-width:none}
.ex-main{flex:1;display:flex;min-height:0;position:relative}
.ex-side{width:212px;flex-shrink:0;overflow:auto;background:var(--face2);box-shadow:inset -1px 0 0 var(--lo);padding:4px 0 12px}
.sd-h{font-size:10.5px;letter-spacing:.2em;color:var(--faint);padding:12px 12px 4px;display:flex;align-items:center;justify-content:space-between}
.sd-h button{color:var(--dim)}.sd-h button:hover{color:var(--accent)}
.sd-i{display:flex;align-items:center;gap:7px;padding:5px 8px 5px calc(8px + var(--d,0) * 14px);cursor:pointer;white-space:nowrap;font-size:12.5px}
.sd-i:hover{background:var(--face)}
.sd-i.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.sd-i.drop-hover{outline:1px dashed var(--accent);outline-offset:-2px}
.sd-i svg.fsvg{width:18px;height:18px}
.sd-i .sd-l{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sd-tw{width:14px;height:14px;display:grid;place-items:center;opacity:.55;flex-shrink:0;transition:transform .15s}
.sd-tw.open{transform:rotate(90deg)}
.sd-tw.none{visibility:hidden}
.sd-ej{opacity:.5;padding:2px}.sd-ej:hover{opacity:1;color:var(--rust)}
.ex-content{flex:1;overflow:auto;position:relative;min-width:0;background:var(--win-bg)}
.ex-head{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:var(--c-name) var(--c-date) var(--c-type) var(--c-size);width:max-content;min-width:100%;background:var(--face)}
.ex-head .h{position:relative;padding:6px 10px;font-size:12px;color:var(--dim);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.ex-head .h:hover{color:var(--text)}
.ex-head .h.sorted{color:var(--accent)}
.ex-head .h i{display:inline-grid;font-style:normal}
.ex-head .rsz{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize;z-index:3;touch-action:none}
.ex-head .rsz:hover,.ex-head .rsz.on{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.ex-list{position:relative;min-height:calc(100% - 32px);width:max-content;min-width:100%;padding-bottom:40px}
.ex-row{display:grid;grid-template-columns:var(--c-name) var(--c-date) var(--c-type) var(--c-size);align-items:center;height:30px;cursor:default;touch-action:pan-y pan-x;animation:rowIn .25s var(--ease) backwards;animation-delay:calc(min(var(--i),30) * 10ms)}
.ex-row:nth-child(even){background:color-mix(in srgb,var(--face) 22%,transparent)}
.ex-row:hover{background:color-mix(in srgb,var(--face) 60%,transparent)}
.ex-row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--sel-b)}
.ex-row.drop-hover{outline:1px dashed var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ex-row.cut,.ex-row.dragging{opacity:.45}
.ex-row .c{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.c-name{display:flex;align-items:center;gap:8px}
.c-name .ri{width:20px;height:20px;flex-shrink:0;display:grid;place-items:center}
.c-name .ri svg,.c-name .ri img{width:20px;height:20px;object-fit:cover}
.c-name .rn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-name small{display:block;font-size:10.5px;color:var(--faint);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.c-date,.c-size{font-family:var(--font-mono);font-size:11.5px !important;color:var(--dim)}
.c-size{text-align:right}
.c-type{color:var(--dim)}
.ex.icons .ex-head{display:none}
.ex.icons .ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));align-content:start;gap:4px;padding:10px 10px 40px;width:auto;min-height:100%}
.ex.icons .ex-row{display:flex;flex-direction:column;height:auto;padding:8px 4px;text-align:center;background:none}
.ex.icons .ex-row .c-date,.ex.icons .ex-row .c-type,.ex.icons .ex-row .c-size{display:none}
.ex.icons .c-name{flex-direction:column;gap:5px;padding:0;white-space:normal;width:100%}
.ex.icons .c-name .ri,.ex.icons .c-name .ri svg,.ex.icons .c-name .ri img{width:46px;height:46px}
.ex.icons .rn{word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px;white-space:normal}
.ex.icons .ex-row.sel{box-shadow:inset 0 0 0 1px var(--sel-b)}
.ex.selmode .ex-list,.ex.selmode .ex-row{touch-action:none}
.ex-status{display:flex;justify-content:space-between;gap:10px;padding:4px 10px;font-size:11.5px;color:var(--dim);background:var(--face);flex-shrink:0;white-space:nowrap;overflow:hidden}
.ex-empty{padding:50px 20px;text-align:center;color:var(--faint);letter-spacing:.1em}
.ex-tools [data-a="side"]{display:none}

/* ---------- 通用 App 外壳 ---------- */
.appbar{display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--face);flex-shrink:0;flex-wrap:wrap;box-shadow:inset 0 -1px 0 var(--lo)}
.appstatus{display:flex;gap:16px;padding:3px 10px;font-family:var(--font-mono);font-size:11.5px;color:var(--dim);background:var(--face);flex-shrink:0;white-space:nowrap;overflow-x:auto;box-shadow:inset 0 1px 0 var(--hi)}
.appstatus .ok{color:var(--olive)}
.np-text{flex:1;width:100%;resize:none;border:0;outline:0;padding:14px 16px;background:var(--win-bg);color:var(--text);font-family:var(--font-mono);line-height:1.65;tab-size:4}
.np-text.nowrap{white-space:pre;overflow-x:auto}
.np-find{display:flex;gap:4px;padding:4px 6px;background:var(--face2)}
.np-find[hidden]{display:none}
.sh-wrap{flex:1;overflow:auto;background:var(--win-bg)}
.sh-table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.sh-table th,.sh-table td{border:1px solid color-mix(in srgb,var(--lo) 60%,transparent);padding:0;height:28px;min-width:90px;max-width:340px}
.sh-table thead th{position:sticky;top:0;z-index:2;background:var(--face);font-weight:500;color:var(--dim);font-family:var(--font-mono);font-size:11.5px;cursor:pointer;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.sh-table thead th:hover{color:var(--accent)}
.sh-table tbody th{position:sticky;left:0;z-index:1;background:var(--face);min-width:44px;font-family:var(--font-mono);font-size:11px;color:var(--faint);font-weight:400}
.sh-table thead th:first-child{left:0;z-index:3;min-width:44px}
.sh-table td{padding:4px 8px;white-space:pre-wrap;word-break:break-word;outline:none;background:var(--win-bg)}
.sh-table td:focus{box-shadow:inset 0 0 0 2px var(--accent);background:var(--input)}
.sh-table tr:first-child td{font-weight:600}
.sh-text{flex:1;resize:none;border:0;outline:0;padding:12px;background:var(--win-bg);color:var(--text);font-family:var(--font-mono);font-size:13px;white-space:pre;overflow:auto}
.seg{display:inline-flex;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);padding:2px;gap:2px;background:var(--face3)}
.seg button{height:24px;padding:0 10px;font-size:12px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---------- HTML 编辑器 ---------- */
.he{background:#1c1f24}
.he-bar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 6px;background:var(--face);flex-shrink:0;box-shadow:inset 0 -1px 0 var(--lo)}
.he-bar .grp{display:flex;align-items:center;gap:1px;padding-right:4px;margin-right:3px;box-shadow:1px 0 0 var(--hi),inset -1px 0 0 var(--lo)}
.he-bar .tbtn{height:28px;padding:0 7px}
.he-bar select.inp{height:28px;font-size:12px}
.he-find{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--face2);flex-shrink:0;animation:rise .2s var(--ease)}
.he-find[hidden]{display:none}
.hf-row{display:flex;align-items:center;gap:3px;flex:1;min-width:280px}
.hf-row .inp{flex:1;height:28px;font-family:var(--font-mono);font-size:12.5px}
.hf-count{font-family:var(--font-mono);font-size:11.5px;min-width:70px;text-align:center;color:var(--dim)}
.hf-count.bad{color:var(--rust);font-family:var(--font-cn)}
.hf-tog{width:32px;height:28px;font-family:var(--font-mono);font-size:12px;background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.hf-tog.on{background:var(--accent);color:var(--accent-ink);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.he-main{flex:1;display:flex;min-height:0}
.he-code{flex:0 0 55%;min-width:200px;display:flex;flex-direction:column;min-height:0;position:relative}
.he-code .CodeMirror{flex:1;height:auto;min-height:0;font-family:var(--font-mono);font-size:14px;line-height:1.6}
.he-code textarea.fallback{flex:1;border:0;outline:0;resize:none;background:#212121;color:#eee;font-family:var(--font-mono);padding:10px}
.he-split{flex:0 0 7px;cursor:col-resize;background:var(--face);box-shadow:inset 1px 0 0 var(--hi),inset -1px 0 0 var(--lo);touch-action:none;position:relative}
.he-split::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:30px;margin-top:-15px;background:repeating-linear-gradient(0deg,var(--lo) 0 1px,transparent 1px 4px)}
.he-split:hover,.he-dragging .he-split{background:var(--accent)}
.he-dragging iframe{pointer-events:none}
.he-dragging{cursor:col-resize}
.he-prev{flex:1;min-width:120px;display:flex;flex-direction:column;background:var(--face3);min-height:0}
.hp-bar{display:flex;align-items:center;gap:8px;padding:3px 8px;font-size:11.5px;color:var(--dim);background:var(--face2);flex-shrink:0}
.hp-bar .dot{width:7px;height:7px;background:var(--olive)}
.hp-bar .dot.busy{background:var(--accent);animation:blink .6s infinite}
.hp-stage{flex:1;overflow:auto;display:flex;justify-content:center;min-height:0;background:conic-gradient(#2a2f37 25%,#23272e 0 50%,#2a2f37 0 75%,#23272e 0) 0 0/18px 18px}
.hp-stage iframe{border:0;background:#fff;width:100%;height:100%;display:block;flex-shrink:0}
.hp-stage.dev iframe{margin:12px auto;height:calc(100% - 24px);box-shadow:0 0 0 1px #000,0 12px 30px rgba(0,0,0,.5)}
.hp-console{height:34%;min-height:90px;display:flex;flex-direction:column;background:#101317;box-shadow:inset 0 2px 0 var(--face)}
.hp-console[hidden]{display:none}
.hc-head{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:11.5px;color:#9ea7b3;background:#171b21}
.hc-log{flex:1;overflow:auto;font-family:var(--font-mono);font-size:12px;user-select:text}
.hc-line{padding:3px 10px;border-bottom:1px solid #1d2229;white-space:pre-wrap;word-break:break-all;color:#cfd6df}
.hc-line.warn{color:#e3c26b;background:rgba(227,194,107,.06)}
.hc-line.error{color:#ff8a78;background:rgba(200,85,61,.12)}
.hc-line.info{color:#8fd6cc}
.he-status{display:flex;gap:16px;padding:3px 10px;font-family:var(--font-mono);font-size:11.5px;background:linear-gradient(180deg,var(--title-a2),var(--title-a));color:#fff;overflow-x:auto;white-space:nowrap;flex-shrink:0}
.he-status .sp{flex:1}
.cm-hit{background:rgba(217,164,65,.3);border-bottom:1px solid rgba(217,164,65,.8)}
.cm-hit-cur{background:rgba(95,168,160,.7) !important;color:#fff !important}
.he .narrow-only{display:none}
.he.narrow .narrow-only{display:inline-flex}
.he.narrow .he-split{display:none}
.he.narrow .he-code{flex:1 1 auto !important}
.he.narrow .he-prev{display:none}

.st{flex-direction:row !important}

.st-main{flex:1;overflow:auto;padding:18px 22px 40px;min-width:0}
.st-main h2{margin:0 0 4px;font-size:20px;letter-spacing:.08em}
.st-main .sub{color:var(--dim);margin-bottom:16px;font-size:12.5px}
.st-card{background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);padding:4px 14px;margin-bottom:12px;animation:rise .35s var(--ease) backwards}

.st-row .lb{flex:1;min-width:0}

.st-wp{aspect-ratio:16/10;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);padding:3px;background:var(--face2);position:relative;display:flex;flex-direction:column}
.st-wp i{flex:1;display:block;background-size:cover !important;background-position:center !important}
.st-wp span{font-size:11px;padding-top:3px;text-align:center}
.st-wp.on{outline:2px solid var(--accent);outline-offset:1px}
.st-accents{display:flex;gap:6px;flex-wrap:wrap}
.st-accents button{width:28px;height:28px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(0,0,0,.4)}
.st-accents button.on{outline:2px solid var(--text);outline-offset:2px}
.st-bar{display:flex;height:22px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:var(--input);overflow:hidden;margin:8px 0}
.st-bar i{display:block;height:100%;transition:width .6s var(--ease)}
.st-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px;font-size:12px;padding-bottom:10px}
.st-legend div{display:flex;align-items:center;gap:7px}
.st-legend b{width:10px;height:10px;display:inline-block;flex-shrink:0}
.st-legend span{margin-left:auto;font-family:var(--font-mono);color:var(--dim);font-size:11.5px}
.st-donut{display:flex;gap:18px;align-items:center;padding:10px 0;flex-wrap:wrap}
.st-donut svg{width:130px;height:130px}
.st-big{font-family:var(--font-mono);font-size:26px;color:var(--accent);font-weight:600}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:8px 0 12px;font-size:12.5px}
.caps div{display:flex;align-items:center;gap:7px}
.caps .y{color:var(--olive)}.caps .n{color:var(--rust)}

/* ---------- 虚拟机 ---------- */
.vm-screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative;min-height:0}

.vm-screen .vm-text{white-space:pre;font:14px/14px monospace;color:#ccc}
.vm-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9ea7b3;text-align:center;padding:20px;font-size:12.5px;line-height:1.7}

.hex{flex:1;overflow:auto;margin:0;padding:10px 14px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;background:var(--win-bg);color:var(--text);user-select:text;white-space:pre}

@keyframes winOut{to{opacity:0;transform:scale(.95) translateY(6px)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}

@keyframes taskIn{from{opacity:0;transform:translateY(12px)}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}

  .win{left:0 !important;top:0 !important;width:100% !important;height:100% !important;padding:2px;box-shadow:none}
  .win .rz{display:none}
  .wbtn.wmax{display:none}
  .startmenu{left:4px;right:4px;width:auto;bottom:calc(var(--panel-h) + 4px)}

  .calendar{left:4px;right:4px;width:auto}
  .ex-side{position:absolute;left:0;top:0;bottom:0;z-index:6;transform:translateX(-102%);transition:transform .25s var(--ease);box-shadow:var(--shadow)}
  .ex.side-open .ex-side{transform:none}
  .ex-tools [data-a="side"]{display:inline-flex}
  .ex-bar{flex-wrap:wrap}.ex-crumbs{order:9;flex-basis:100%}.ex-search{flex:1;width:auto}
  .tbtn span{display:none}

  .st-main{padding:14px}

  .calc-sci{width:46%}
  #toasts{left:12px;right:12px;align-items:stretch}
  .toast{max-width:none}
}

const Lock = {
  show() { StartMenu.close(); Calendar.close(); const l = $('#lock'); $('.lk-mark', l).innerHTML = appSvg('logo'); l.hidden = false; this.tick(); const un = () => { l.style.transition = 'opacity .35s'; l.style.opacity = '0'; setTimeout(() => { l.hidden = true; l.style.opacity = ''; }, 350); document.removeEventListener('keydown', un); l.removeEventListener('click', un); }; setTimeout(() => { document.addEventListener('keydown', un); l.addEventListener('click', un); }, 400); },

<script>
/* =====================================================================

const DESKTOP = '/桌面';

/* —— 拖出预加载缓存：dragstart 中只能同步读取 —— */

/* —— 统一放置路由：桌面空白 / 文件夹图标 / 文件管理器 / 侧边栏 —— */
const DropRouter = {

/* —— 框选（鼠标 + 触摸） —— */
function bindMarquee(container, o) {

/* —— 桌面 —— */
const ICON_SIZES = { s: { cw: 80, ch: 88, ico: 36 }, m: { cw: 94, ch: 102, ico: 46 }, l: { cw: 116, ch: 128, ico: 62 } };
const Desktop = {
  el: null, layer: null, entries: [], names: new Set(), pos: {}, sel: new Set(), els: new Map(), thumbs: new Map(), first: true, g: null,
  async init() {
    this.el = $('#desktop'); this.layer = $('#desk-icons'); this.ghost = $('#grid-ghost');
    try { this.pos = (await KV.get('deskpos')) || {}; } catch { this.pos = {}; }

  grid() {

  },
  cellXY(c, r, g) { return { x: 8 + c * g.cw, y: 8 + r * g.ch }; },
  cellAt(x, y, g) { const L = this.layer.getBoundingClientRect(); return { c: clamp(Math.floor((x - L.left - 8) / g.cw), 0, g.cols - 1), r: clamp(Math.floor((y - L.top - 8) / g.ch), 0, g.rows - 1) }; },
  occupied(except) { const m = new Map(); for (const [n, p] of Object.entries(this.pos)) if (this.names.has(n) && !(except && except.has(n))) m.set(p.c + ',' + p.r, n); return m; },
  freeCell(occ, g, near) {

  async refresh() {

/* —— 导入：文件选择器 / 物理桌面拖入（递归目录，readEntries 循环） —— */
const Importer = {
  pick(dir, folder) {
    return new Promise(res => {
      const inp = h('input', { type: 'file', multiple: true, style: { display: 'none' } }); if (folder) { inp.webkitdirectory = true; inp.setAttribute('webkitdirectory', ''); }
      document.body.append(inp);
      inp.onchange = async () => {
        const files = [...inp.files]; inp.remove(); if (!files.length) return res([]);
        const created = [], topMap = new Map(); const n = notify(`正在导入 0 / ${files.length}`, { timeout: 0 }); let i = 0;
        try {
          for (const f of files) {
            let dest;
            if (folder && f.webkitRelativePath) {
              const parts = f.webkitRelativePath.split('/'); const top = parts[0];
              if (!topMap.has(top)) { const tp = await fs.uniquePath(dir, sanitize(top)); await fs.mkdir(tp); topMap.set(top, tp); created.push(tp); }
              dest = P.join(topMap.get(top), ...parts.slice(1).map(sanitize));
            } else { dest = await fs.uniquePath(dir, sanitize(f.name)); created.push(dest); }
            await fs.writeFile(dest, await f.arrayBuffer()); n.update(`正在导入 ${++i} / ${files.length}`);
          }
          n.close(); notify(`已导入 ${files.length} 个文件`, { type: 'ok' });
        } catch (e) { n.close(); UI.alert('导入失败：' + e.message); }
        res(created);
      };
      inp.addEventListener('cancel', () => { inp.remove(); res([]); });
      inp.click();
    });
  },
  fromDataTransfer(dt, dir) {
    // 必须同步收集 entries，异步之后 DataTransfer 会失效
    const entries = [], files = [];
    if (dt.items && dt.items.length) { for (const it of dt.items) { if (it.kind !== 'file') continue; const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; if (en) entries.push(en); else { const f = it.getAsFile(); f && files.push(f); } } }
    else for (const f of dt.files || []) files.push(f);
    return this.run(entries, files, dir);
  },
  async run(entries, files, dir) {
    const created = []; let count = 0; if (!entries.length && !files.length) return created;
    const n = notify('正在导入…', { timeout: 0 });
    try {
      for (const en of entries) created.push(await this.entry(en, dir, () => n.update(`正在导入… ${++count} 个文件`)));
      for (const f of files) { const dest = await fs.uniquePath(dir, sanitize(f.name)); await fs.writeFile(dest, await f.arrayBuffer()); created.push(dest); count++; }
      n.close(); notify(`导入完成：${count} 个文件`, { type: 'ok' });
    } catch (e) { n.close(); UI.alert('导入失败：' + e.message); }
    return created;
  },
  async entry(en, dir, tick) {
    const dest = await fs.uniquePath(dir, sanitize(en.name));
    if (en.isFile) { const f = await new Promise((res, rej) => en.file(res, rej)); await fs.writeFile(dest, await f.arrayBuffer()); tick(); }
    else if (en.isDirectory) {
      await fs.mkdir(dest); const reader = en.createReader(); let batch;
      do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const c of batch) await this.entry(c, dest, tick); } while (batch.length > 0);
    }
    return dest;
  }
};

/* —— 壁纸 —— */
function contourSvg() {
  let paths = '';
  for (let i = 1; i <= 26; i++) {
    const base = i * 34; let d = '';
    for (let k = 0; k <= 72; k++) { const t = k / 72 * Math.PI * 2; const r = base * (1 + 0.13 * Math.sin(3 * t + i * 0.32) + 0.07 * Math.sin(5 * t - i * 0.21) + 0.04 * Math.cos(7 * t + i * 0.5)); d += (k ? 'L' : 'M') + (1060 + r * Math.cos(t) * 1.25).toFixed(1) + ' ' + (470 + r * Math.sin(t)).toFixed(1); }
    const major = i % 5 === 0; paths += `<path d="${d}Z" fill="none" stroke="${major ? '#d9a441' : '#8fb7b1'}" stroke-opacity="${major ? .42 : .13}" stroke-width="${major ? 1.6 : 1}"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g" cx="66%" cy="47%" r="75%"><stop offset="0" stop-color="#23343a"/><stop offset=".55" stop-color="#151d26"/><stop offset="1" stop-color="#0b0f15"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#g)"/>${paths}<circle cx="1060" cy="470" r="4" fill="#d9a441"/><path d="M60 940h220M60 948h140" stroke="#d9a441" stroke-opacity=".5" stroke-width="2"/></svg>`;
}
const BAUHAUS_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="1000" fill="#1a2029"/><circle cx="1150" cy="420" r="300" fill="#d9a441"/><circle cx="1150" cy="420" r="370" fill="none" stroke="#ebe2ce" stroke-opacity=".18" stroke-width="2"/><rect x="220" y="520" width="520" height="520" fill="#2f6f7a"/><path d="M740 1000a260 260 0 0 1 520 0z" fill="#c8553d"/><path d="M0 300H1600M420 0V1000" stroke="#ebe2ce" stroke-opacity=".12" stroke-width="2"/><rect x="1300" y="720" width="120" height="120" fill="#8fa05a"/><path d="M160 160l180 0-90 156z" fill="#ebe2ce" fill-opacity=".85"/></svg>`;
const DUNE_SVG = (() => { let p = ''; for (let i = 0; i < 16; i++) { const y = 380 + i * 42; p += `<path d="M0 ${y} C 300 ${y - 60 + i * 3}, 600 ${y + 50}, 900 ${y - 10} S 1400 ${y - 70}, 1600 ${y - 20}" fill="none" stroke="#7a5a2c" stroke-opacity="${(0.08 + i * 0.012).toFixed(3)}" stroke-width="2"/>`; } return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcc0"/><stop offset=".5" stop-color="#d6c29a"/><stop offset="1" stop-color="#b99b6c"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#s)"/><circle cx="1240" cy="250" r="110" fill="#b0502a" fill-opacity=".85"/>${p}</svg>`; })();
const svgUrl = s => `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}")`;
const Wallpaper = {
  url: null,
  list: [{ id: 'contour', name: '暮色等高线' }, { id: 'loom', name: '赭石织纹' }, { id: 'slate', name: '石板栅格' }, { id: 'bauhaus', name: '构成主义' }, { id: 'dither', name: '青瓷半调' }, { id: 'dune', name: '沙丘（浅）' }],
  css(id) {

      case 'loom': return 'repeating-linear-gradient(45deg,rgba(0,0,0,.2) 0 2px,transparent 2px 10px),repeating-linear-gradient(-45deg,rgba(255,214,150,.07) 0 2px,transparent 2px 10px),radial-gradient(ellipse at 30% 20%,#6a4c24,#2e2213 60%,#140f09)';
      case 'slate': return 'linear-gradient(rgba(235,226,206,.04) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(235,226,206,.04) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(circle at 72% 28%,#3a5872 0,#1b2636 45%,#0c1118 100%)';

const FileOps = {
  async newFolder(dir) { const name = await UI.prompt('新文件夹名称', '新建文件夹', '新建文件夹'); if (!name) return null; try { const p = await fs.uniquePath(dir, sanitize(name)); await fs.mkdir(p); return p; } catch (e) { UI.alert('创建失败：' + e.message); return null; } },
  async newFile(dir, def, content = '') { const name = await UI.prompt('文件名', def, '新建文件'); if (!name) return null; try { const p = await fs.uniquePath(dir, sanitize(name)); await fs.writeFile(p, content); return p; } catch (e) { UI.alert('创建失败：' + e.message); return null; } },
  async rename(path) {
    const old = P.base(path); const name = await UI.prompt('重命名为', old, '重命名'); if (!name || name === old) return;
    const np = P.join(P.dir(path), sanitize(name));
    try { await fs.rename(path, np); if (P.dir(path) === DESKTOP && Desktop.pos[old]) { Desktop.pos[P.base(np)] = Desktop.pos[old]; delete Desktop.pos[old]; Desktop.savePos(); } } catch (e) { UI.alert('重命名失败：' + e.message); }
  },
  async remove(paths) {
    if (!paths.length) return;
    if (Settings.get('confirmDelete') && !await UI.confirm(`确定要永久删除 ${paths.length === 1 ? '“' + P.base(paths[0]) + '”' : paths.length + ' 个项目'} 吗？\n此操作不可撤销。`, '删除', true)) return;
    for (const p of paths) { try { await fs.rm(p, { recursive: true }); } catch (e) { UI.alert('删除失败：' + e.message); break; } }
  },
  copy(paths) { Clip.set('copy', paths); notify(`已复制 ${paths.length} 项到剪贴板`); },
  cut(paths) { Clip.set('cut', paths); notify(`已剪切 ${paths.length} 项`); },
  async paste(dir) { if (!Clip.has()) return []; const mode = Clip.mode; const r = await this.transfer(Clip.paths, dir, mode === 'cut' ? 'move' : 'copy'); if (mode === 'cut') Clip.clear(); return r; },
  async transfer(paths, dir, mode) {
    const done = []; const n = paths.length > 2 ? notify(`${mode === 'copy' ? '复制' : '移动'}中…`, { timeout: 0 }) : null;
    for (const src of paths) {
      if (P.within(dir, src)) { notify('不能将文件夹放入它自身', { type: 'warn' }); continue; }

      try {

      } catch (e) { UI.alert(`${mode === 'copy' ? '复制' : '移动'}失败：${e.message}`); break; }
    }
    n && n.close(); return done;
  },
  async download(paths) {
    for (const p of paths) {
      try {
        const st = await fs.stat(p);
        if (st.isDirectory()) { notify('正在打包 ' + st.name + ' …'); downloadBlob(await Archive.zipPaths([p]), st.name + '.zip'); }
        else downloadBlob(await fs.readFile(p, { as: 'blob' }), st.name);
      } catch (e) { UI.alert('导出失败：' + e.message); }
    }
  },
  async compress(paths) {
    if (!paths.length) return; const dir = P.dir(paths[0]); const n = notify('正在压缩…', { timeout: 0 });
    try { const blob = await Archive.zipPaths(paths); const dest = await fs.uniquePath(dir, (paths.length === 1 ? P.stem(paths[0]) || P.base(paths[0]) : '压缩包') + '.zip'); await fs.writeFile(dest, blob); n.close(); notify('已创建 ' + P.base(dest), { type: 'ok' }); } catch (e) { n.close(); UI.alert('压缩失败：' + e.message); }
  },

function mdToHtml(src) {
  const esc = escHtml; const lines = String(src).replace(/\r\n?/g, '\n').split('\n'); let out = '', i = 0;
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2" target="_blank">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>').replace(/~~([^~]+)~~/g, '<del>$1</del>');
  const isList = l => /^\s*([-*+]|\d+\.)\s+/.test(l);
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^```/.test(l)) { const lang = l.slice(3).trim(); const code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out += `<pre><code class="lang-${esc(lang)}">${esc(code.join('\n'))}</code></pre>`; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^>\s?/.test(l)) { const q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out += `<blockquote>${mdToHtml(q.join('\n'))}</blockquote>`; continue; }
    if (isList(l)) { const ordered = /^\s*\d+\./.test(l); const items = []; while (i < lines.length && isList(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, '')); out += `<${ordered ? 'ol' : 'ul'}>${items.map(t => { const tm = t.match(/^\[([ xX])\]\s+(.*)/); return tm ? `<li class="task"><input type="checkbox" disabled ${tm[1] !== ' ' ? 'checked' : ''}> ${inline(tm[2])}</li>` : `<li>${inline(t)}</li>`; }).join('')}</${ordered ? 'ol' : 'ul'}>`; continue; }
    if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{3,}/.test(lines[i + 1])) { const row = s => s.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const head = row(l); i += 2; const body = []; while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++])); out += `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>|\|)/.test(lines[i]) && !isList(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out += `<p>${para.map(inline).join('<br>')}</p>`;
  }
  return out;
}

    const pre = $('.hex', win.body); let off = 0; const CH = 64 * 1024;

function makeWav() {

}
