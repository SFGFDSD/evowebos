registerApp('calc',{
  name:'计算器', icon:'calc', desc:'Calc',
  launch(){
    const win=WM.open({app:'calc',title:'计算器',icon:'calc',sub:'Calculator',width:340,height:500});
    const body=win.body;
    body.innerHTML='<div class="calc"><div class="scr"><div class="exp" data-s="exp"></div><div class="val" data-s="val">0</div></div>'+
      '<div class="keys">'+
      ['C','( )','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','=']
      .map(k=>'<button class="key'+(/[÷×−+=%]/.test(k)?' op':'')+(k==='='?' eq':'')+'" data-k="'+k+'">'+k+'</button>').join('')+
      '</div><div class="tag" style="text-align:center;opacity:.7">支持键盘输入 · 实时求值</div></div>';
    const valEl=$('[data-s="val"]',body), expEl=$('[data-s="exp"]',body);
    let expr='';
    const render=()=>{ expEl.textContent=expr||' '; try{ valEl.textContent=String(eval(expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100'))??0) }catch(e){ valEl.textContent=expr?'…':'0' } };
    const press=k=>{
      if(k==='C'){ expr=''; render(); return }
      if(k==='='){ try{ expr=String(eval(expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100'))) }catch(e){ valEl.textContent='错误' }; render(); return }
      if(k==='±'){ expr=expr.startsWith('-')?expr.slice(1):'-'+expr; render(); return }
      if(k==='( )'){ expr+=( (expr.split('(').length-expr.split(')').length)>0 )?')':'('; render(); return }
      expr+=k; render();
    };
    $$('.key',body).forEach(b=>b.onclick=()=>press(b.dataset.k));
    win.el.addEventListener('keydown',e=>{
      if(/^[0-9]$/.test(e.key)) press(e.key);
      else if(['+','-','*','/','%','.','(',')'].includes(e.key)) press({'*':'×','/':'÷','-':'−'}[e.key]||e.key);
      else if(e.key==='Enter'||e.key==='=') press('=');
      else if(e.key==='Backspace'){ expr=expr.slice(0,-1); render() }
      else if(e.key==='Escape'){ press('C') }
    });
    win.el.tabIndex=0;
    setTimeout(()=>win.el.focus(),50);
    return win;
  }
});

registerApp('paint',{
  name:'画板', icon:'paint', desc:'Paint',
  launch(){
    const win=WM.open({app:'paint',title:'画板',icon:'paint',sub:'Canvas',width:820,height:600});

    body.innerHTML=
      '<div class="toolbar">'+

        ['#F4EBDD','#E8A33D','#59C2A8','#E0603C','#241C13','#6E86D8'].map(c=>'<button class="sw" style="width:24px;height:24px;background:'+c+'" data-c="'+c+'"></button>').join('')+
        '<div class="spacer"></div>'+
        '<button class="tb" data-a="undo">'+icon('undo',15)+'撤销</button>'+
        '<button class="tb" data-a="clear">'+icon('trash',15)+'清空</button>'+
        '<button class="tb" data-a="save">'+icon('save',15)+'保存到文件系统</button>'+
        '<button class="tb" data-a="dl">'+icon('download',15)+'下载 PNG</button>'+
      '</div>'+
      '<div class="cv"><canvas></canvas></div>';
    const canvas=$('canvas',body), ctx=canvas.getContext('2d');
    const hist=[];
    const resize=()=>{
      const r=$('.cv',body).getBoundingClientRect();
      const img=canvas.width?ctx.getImageData(0,0,canvas.width,canvas.height):null;
      canvas.width=r.width*devicePixelRatio; canvas.height=r.height*devicePixelRatio;
      ctx.scale(devicePixelRatio,devicePixelRatio);
      ctx.lineCap='round'; ctx.lineJoin='round';
      if(img) ctx.putImageData(img,0,0);
    };
    setTimeout(resize,60);
    win.onResize=()=>{};
    let drawing=false, color='#F4EBDD', size=4, eraser=false, last=null;
    const pos=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top} };
    const save=()=>{ if(canvas.width) hist.push(ctx.getImageData(0,0,canvas.width,canvas.height)); if(hist.length>24) hist.shift() };
    canvas.addEventListener('pointerdown',e=>{
      drawing=true; save(); last=pos(e);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove',e=>{
      if(!drawing) return;
      const p=pos(e);
      ctx.beginPath();
      ctx.strokeStyle=eraser?'#F6F2EA':color;
      ctx.lineWidth=eraser?size*2.4:size;
      ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last=p;
    });
    const stop=()=>{ drawing=false };
    canvas.addEventListener('pointerup',stop); canvas.addEventListener('pointercancel',stop);
    $$('[data-a]',body).forEach(b=>{
      const a=b.dataset.a;
      if(a==='size'){ b.oninput=()=>size=parseInt(b.value,10); return }
      b.onclick=()=>{
        if(a==='pen'){ eraser=false; $$('[data-a="pen"],[data-a="eraser"]',body).forEach(x=>x.classList.remove('on')); b.classList.add('on') }
        else if(a==='eraser'){ eraser=true; $$('[data-a="pen"],[data-a="eraser"]',body).forEach(x=>x.classList.remove('on')); b.classList.add('on') }
        else if(a==='clear'){ save(); ctx.clearRect(0,0,canvas.width,canvas.height) }
        else if(a==='undo'){ const im=hist.pop(); if(im) ctx.putImageData(im,0,0) }
        else if(a==='dl') canvas.toBlob(b2=>download(b2,'画作.png'));
        else if(a==='save'){
          promptModal({title:'保存画作',value:'画作-'+Date.now()+'.png',okText:'保存'}).then(async n=>{
            if(!n) return;
            const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
            const dir=fs.join('/opfs/图片',n);
            await fs.writeFile(dir, await blob.arrayBuffer(),{mtime:Date.now()});
            toast('已保存到 '+dir,'ok'); Desktop.render(); if(window.__explorerRefresh) window.__explorerRefresh();
          });
        }
      };
    });
    $$('.sw',body).forEach(b=>b.onclick=()=>{ color=b.dataset.c; eraser=false });
    return win;
  }
});

            WALLPAPERS.map((w,i)=>'<div class="wp'+(cur.wallpaper==='w'+i?' on':'')+'" data-wp="w'+i+'" style="background-image:url('+w.url+')"><div class="lb">'+esc(w.name)+'</div></div>').join('')+
            (Wallpaper.customURL?'<div class="wp'+(cur.wallpaper==='custom'?' on':'')+'" data-wp="custom" style="background-image:url('+Wallpaper.customURL+')"><div class="lb">自定义</div></div>':'')+
            '<div class="wp'+(cur.wallpaper==='plain'?' on':'')+'" data-wp="plain" style="background:linear-gradient(150deg,#2A231E,#141110)"><div class="lb">纯色</div></div>'+
          '</div>'+
          '<button class="btn" data-a="uploadwp" style="margin-top:12px">'+icon('upload',15)+' 上传图片作为壁纸</button>'+
        '</div>'+
        /* 存储 */
        '<div class="card"><h4>存储用量</h4><p>OPFS 与 IndexedDB 双后端共同组成虚拟文件系统。下面的数字来自浏览器真实的存储统计与逐目录扫描。</p>'+

            '<i style="width:'+pct(idbSize)+'%;background:var(--jade)"></i>'+
            '<i style="width:'+pct(other)+'%;background:rgba(162,150,138,.5)"></i>'+
          '</div>'+
          '<div class="legend">'+
            '<div class="li"><span class="dot" style="background:var(--acc)"></span><span>OPFS 文件</span><div class="spacer"></div><span class="mono">'+fmtSize(opfsSize)+'</span></div>'+
            '<div class="li"><span class="dot" style="background:var(--jade)"></span><span>IndexedDB 文件</span><div class="spacer"></div><span class="mono">'+fmtSize(idbSize)+'</span></div>'+
            '<div class="li"><span class="dot" style="background:rgba(162,150,138,.6)"></span><span>系统与其他缓存</span><div class="spacer"></div><span class="mono">'+fmtSize(other)+'</span></div>'+
            '<div class="li"><span class="dot" style="background:var(--dim)"></span><span>本源已用 / 配额</span><div class="spacer"></div><span class="mono">'+fmtSize(est.usage)+' / '+fmtSize(est.quota)+'</span></div>'+
          '</div>'+
          '<div class="tag" style="margin-top:14px">写入后端</div>'+
          '<div class="seg" data-seg="backend"><button data-v="opfs">OPFS 优先</button><button data-v="idb">IndexedDB 优先</button></div>'+
          '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
            '<button class="btn" data-a="mount">'+icon('mount',15)+' 挂载本地文件夹</button>'+
            '<button class="btn" data-a="recalc">重新扫描</button>'+
          '</div>'+
          (mounts.size?'<div class="tag" style="margin-top:12px">已挂载</div>'+[...mounts.keys()].map(n=>'<div class="li" style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px">'+icon('folder',15)+'<span>'+esc(n)+'</span><div class="spacer"></div><button class="btn" data-unmount="'+esc(n)+'">卸载</button></div>').join(''):'')+
        '</div>'+
        /* 桌面与任务栏 */
        '<div class="card"><h4>桌面与任务栏</h4><p>控制仪表边栏、时钟制式与系统应用的可见性。所有改动立即生效。</p>'+
          '<div class="legend">'+
            toggleRow('hideRail','隐藏仪表边栏',cur.hideRail)+
            toggleRow('clock12','12 小时制时钟',cur.clock12!==false)+
            toggleRow('autosave','记事本自动保存',cur.autosave!==false)+
            toggleRow('autoplay','媒体自动播放',cur.autoplay!==false)+
            toggleRow('singleClick','单击打开项目',cur.singleClick!==false)+
            toggleRow('hideSysApps','隐藏系统内置应用',cur.hideSysApps)+
            toggleRow('showExt','文件名显示扩展名',cur.showExt!==false)+
          '</div>'+
          '<div class="tag" style="margin-top:12px">主页目录</div>'+
          '<div class="seg" data-seg="homeDir"><button data-v="/opfs/桌面">桌面</button><button data-v="/opfs/文档">文档</button><button data-v="/idb/空间">IDB 空间</button></div>'+
        '</div>'+
        /* 系统 */
        '<div class="card"><h4>系统</h4><p>玄岩台 v1.0 · 单文件运行，无任何后端请求。数据全部保存在浏览器本地存储中。</p>'+
          '<div class="legend">'+
            '<div class="li"><span class="dot" style="background:var(--jade)"></span><span>OPFS 可用</span><div class="spacer"></div><span class="mono">'+(navigator.storage&&navigator.storage.getDirectory?'是':'否')+'</span></div>'+
            '<div class="li"><span class="dot" style="background:var(--jade)"></span><span>IndexedDB 可用</span><div class="spacer"></div><span class="mono">'+(window.indexedDB?'是':'否')+'</span></div>'+
            '<div class="li"><span class="dot" style="background:var(--jade)"></span><span>文件系统访问 API</span><div class="spacer"></div><span class="mono">'+(window.showDirectoryPicker?'是':'否')+'</span></div>'+
            '<div class="li"><span class="dot" style="background:var(--jade)"></span><span>原生压缩 (gzip/tar)</span><div class="spacer"></div><span class="mono">'+(typeof DecompressionStream==='function'?'是':'否')+'</span></div>'+
          '</div>'+
          '<div class="tag" style="margin-top:14px">危险区域</div>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
            '<button class="btn dgr" data-a="reset">'+icon('power',15)+' 一键重置系统</button>'+
            '<button class="btn" data-a="exportall">'+icon('download',15)+' 导出全部文件</button>'+
          '</div>'+
        '</div>'+
      '</div></div>';

      /* 绑定 */
      $$('[data-seg]',body).forEach(seg=>{
        const key=seg.dataset.seg;
        const curv=key==='theme'?Prefs.get('theme','dark'):key==='radius'?Prefs.get('radius','round'):key==='backend'?(Prefs.get('backend','opfs')):key==='homeDir'?Prefs.get('homeDir','/opfs/桌面'):'';
        $$('button',seg).forEach(b=>b.classList.toggle('on',b.dataset.v===curv));
        $$('button',seg).forEach(b=>b.onclick=()=>{
          if(key==='theme'||key==='radius') Prefs.set(key,b.dataset.v);
          else if(key==='backend'){ Prefs.set('backend',b.dataset.v); toast('默认写入后端：'+b.textContent) }
          else if(key==='homeDir') Prefs.set('homeDir',b.dataset.v);
          render();
        });
      });
      $$('[data-accent]',body).forEach(b=>b.classList.toggle('on',b.dataset.accent===Prefs.get('accent','amber')));
      $$('[data-accent]',body).forEach(b=>b.onclick=()=>{ Prefs.set('accent',b.dataset.accent); render() });
      $$('[data-wp]',body).forEach(b=>b.onclick=()=>{ Prefs.set('wallpaper',b.dataset.wp); Wallpaper.boot(); render() });
      const sc=$('[data-a="scale"]',body);
      if(sc) sc.oninput=()=>{ Prefs.set('uiScale',sc.value/100); $('[data-s="scale"]',body).textContent=sc.value+'%' };
      $$('[data-toggle]',body).forEach(b=>b.onclick=()=>{ Prefs.set(b.dataset.toggle,!Prefs.get(b.dataset.toggle,false)); render() });
      $$('[data-unmount]',body).forEach(b=>b.onclick=async()=>{
        const n=b.dataset.unmount;
        const h=mounts.get(n);
        if(h&&h.removeEntry){ try{ await h.removeEntry }catch(e){} }
        mounts.delete(n); toast('已卸载 '+n); render(); window.__explorerRefresh&&window.__explorerRefresh();
      });
      const acts={
        uploadwp(){ $('#imgPick').value=''; $('#imgPick').onchange=e=>{ const f=e.target.files[0]; if(f) Wallpaper.setCustom(f).then(render) }; $('#imgPick').click() },
        mount(){ window.__mountLocal&&window.__mountLocal().then(render) },
        recalc(){ render(); toast('已重新扫描存储') },
        async exportall(){
          const items=await fs.readdir('/opfs').catch(()=>[]);
          for(const it of items) if(!it.isDir) await window.__exportPaths([it.path]);
          toast('导出完成','ok');
        },
        async reset(){
          const ok=await showModal({title:'一键重置系统',html:'<div style="color:var(--danger)">此操作将清除虚拟文件系统中的全部文件、壁纸与个人设置，且不可撤销。</div>',
            buttons:[{label:'取消'},{label:'确认重置',cls:'dgr',value:true}]});
          if(!ok) return;
          $('#veil').style.display='grid';
          try{
            try{ await IDB.clear('nodes'); await IDB.clear('meta'); await IDB.clear('prefs') }catch(e){}
            try{ const root=await navigator.storage.getDirectory(); for await (const k of root.keys()) await root.removeEntry(k,{recursive:true}).catch(()=>{}) }catch(e){}
            localStorage.removeItem('xy_prefs'); localStorage.removeItem('xy_iconpos'); localStorage.removeItem('xy_seeded');
          }catch(e){}
          setTimeout(()=>location.reload(),420);
        }
      };
      $$('[data-a]',body).forEach(b=>{ const a=b.dataset.a; if(acts[a]) b.onclick=acts[a] });
    };
    function toggleRow(key,label,on){
      return '<div class="li"><span>'+label+'</span><div class="spacer"></div>'+
        '<button class="btn" data-toggle="'+key+'" style="min-width:64px">'+(on?'已开启':'已关闭')+'</button></div>';
    }
    render();
    win.onRefresh=render;
    return win;
  }
});
/* ================= 虚拟机 (v86，版本锁定) ================= */
const V86_RES={
  js:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',
  wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
  bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',
  vga:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
};
function loadScriptOnce(src){
  return new Promise((res,rej)=>{
    const ex=[...document.scripts].find(s=>s.src===src);
    if(ex) return res();
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}
registerApp('vm',{
  name:'虚拟机', icon:'vm', desc:'V86',
  launch(){
    const win=WM.open({app:'vm',title:'虚拟机',icon:'vm',sub:'V86 Emulator',width:920,height:660});
    const body=win.body;
    const cid='sc_'+uid();
    let emu=null, imgBuf=null, imgName='';
    body.innerHTML=
      '<div class="toolbar">'+
        '<button class="tb" data-a="pick">'+icon('upload',15)+'从文件系统选择镜像</button>'+
        '<button class="tb" data-a="local">'+icon('folder',15)+'本地镜像</button>'+
        '<button class="tb on" data-a="start">'+icon('play',15)+'启动</button>'+
        '<button class="tb" data-a="stop">'+icon('x',15)+'停止</button>'+
        '<button class="tb" data-a="lock">'+icon('lock',15)+'锁定鼠标</button>'+
        '<button class="tb" data-a="reset">'+icon('refresh',15)+'复位</button>'+
        '<div class="spacer"></div><span class="tag" data-s="info">未载入镜像</span>'+
      '</div>'+
      '<div style="flex:1;min-height:0;background:#000;display:grid;place-items:center;overflow:auto">'+
        '<div id="'+cid+'"><div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas></div>'+
      '</div>'+
      '<div class="statusbar"><span data-s="st">待机</span><div class="spacer"></div><span>libv86 0.5.319 · wasm 同版本锁定</span></div>';
    const screen=$('#'+cid,body);
    const info=$('[data-s="info"]',body), stEl=$('[data-s="st"]',body);
    const pick=()=>{
      const inp=document.createElement('input'); inp.type='file';
      inp.onchange=async()=>{
        const f=inp.files[0]; if(!f) return;
        imgBuf=await f.arrayBuffer(); imgName=f.name;
        info.textContent=f.name+' · '+fmtSize(f.size);
        toast('镜像已载入内存，点击「启动」运行');
      };
      inp.click();
    };
    const start=async()=>{
      if(!imgBuf){ toast('请先选择镜像文件（.iso / .img / .bin）','err'); return }
      stEl.textContent='正在启动…';
      try{
        await loadScriptOnce(V86_RES.js);
      }catch(e){ stEl.textContent='libv86 加载失败'; toast('虚拟机引擎加载失败（网络不可用）','err'); return }
      const e=fs.ext(imgName);
      const opts={
        wasm_path:V86_RES.wasm,
        memory_size:128*1024*1024,
        vga_memory_size:8*1024*1024,
        screen_container:screen,
        bios:{url:V86_RES.bios},
        vga_bios:{url:V86_RES.vga},
        autostart:true
      };
      if(e==='iso'||e==='cdrom') opts.cdrom={buffer:imgBuf};
      else if(['img','fda','bin','flp'].includes(e)) opts.fda={buffer:imgBuf};
      else opts.hda={buffer:imgBuf};
      try{
        emu=new V86(opts);
        emu.add_listener&&emu.add_listener('emulator-ready',()=>{ stEl.textContent='运行中' });
        stEl.textContent='运行中 · 点击画面可锁定鼠标';
      }catch(err){ stEl.textContent='启动失败'; toast('启动失败：'+err.message,'err') }
    };
    const acts={
      pick,
      local:pick,
      start,
      stop(){ if(emu){ try{emu.stop()}catch(e){} stEl.textContent='已停止' } },
      reset(){ if(emu){ try{emu.restart()}catch(e){} } },
      lock(){ if(emu&&emu.lock_mouse){ try{ emu.lock_mouse(); toast('鼠标已锁定，按 Esc 释放') }catch(e){ toast('鼠标锁定失败','err') } } else toast('虚拟机尚未运行','err') }
    };
    $$('[data-a]',body).forEach(b=>b.onclick=()=>acts[b.dataset.a]&&acts[b.dataset.a]());
    win.onClose=()=>{ if(emu){ try{emu.destroy()}catch(e){} emu=null; imgBuf=null } };
    return win;
  }
});

/* ================= 本地文件夹挂载 ================= */
window.__mountLocal=async()=>{
  if(!window.showDirectoryPicker){
    await showModal({title:'无法挂载',html:'<div>当前浏览器不支持 File System Access API。请使用桌面版 Chrome / Edge，或改用「上传文件」导入数据。</div>',buttons:[{label:'知道了',cls:'pri'}]});
    return;
  }
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite'});
    mounts.set(h.name,h);
    const list=JSON.parse(localStorage.getItem('xy_mounts')||'[]');
    if(!list.includes(h.name)){ list.push(h.name); localStorage.setItem('xy_mounts',JSON.stringify(list)) }
    toast('已挂载 /mnt/'+h.name+' ，权限在刷新后需要重新授予','ok',5200);
    window.__explorerRefresh&&window.__explorerRefresh();
  }catch(e){ if(e.name!=='AbortError') toast('挂载失败：'+e.message,'err') }
};

/* ================= 开始菜单 ================= */
function buildStart(){
  const q=$('#startSearch').value.trim();
  const list=$('#applist');
  const sys=['pdf','archive'];
  let apps=Object.values(Apps).filter(a=>!(Prefs.get('hideSysApps')&&sys.includes(a.id)));
  if(q) apps=apps.filter(a=>a.name.includes(q)||(a.desc||'').toLowerCase().includes(q.toLowerCase()));
  let html=apps.map((a,i)=>'<button class="apptile" data-app="'+a.id+'" style="animation-delay:'+(i*32)+'ms">'+
    '<span class="gl">'+icon(a.icon,20)+'</span><span><span class="nm">'+esc(a.name)+'</span><span class="ds">'+esc(a.desc||'')+'</span></span></button>').join('');
  list.innerHTML=html||'<div class="empty"><div class="tag">没有匹配的应用</div></div>';
  $$('.apptile',list).forEach(b=>b.onclick=()=>{
    $('#start').classList.remove('open'); $('#startbtn').classList.remove('on');
    openApp(b.dataset.app);
  });
  if(q){
    fs.search('/opfs',q).then(res=>{
      const r=res.slice(0,8);
      if(!r.length) return;
      const sec=document.createElement('div');
      sec.style.cssText='grid-column:1/-1;padding:6px 4px';
      sec.innerHTML='<div class="tag" style="margin-bottom:8px">文件结果</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:6px">'+r.map(f=>'<button class="chip" data-file="'+esc(f.path)+'">'+icon(iconFor(f.name,f.isDir),14)+esc(f.name)+'</button>').join('')+'</div>';
      list.appendChild(sec);
      $$('[data-file]',sec).forEach(b2=>b2.onclick=()=>{
        $('#start').classList.remove('open');
        openPath(b2.dataset.file);
      });
    }).catch(()=>{});
  }
}

/* ================= 启动 ================= */
(async function boot(){
  Prefs.load();
  applyPrefs();
  tickClock();
  setInterval(tickClock,10000);

  // 图标与界面
  $('#startbtn').innerHTML=icon('app',22);
  $('#peekbtn').innerHTML=icon('eye',16);
  $('#searchIcon').innerHTML=icon('search',15);
  $('#sb-settings').innerHTML=icon('settings',14)+'设置';
  $('#sb-explorer').innerHTML=icon('explorer',14)+'文件管理器';
  $('#sb-full').innerHTML=icon('fullscreen',14)+'全屏';
  $('#sb-power').innerHTML=icon('power',14)+'重启';

  // 文件系统
  try{ await fs.init() }catch(e){ toast('存储初始化异常：'+e.message,'err',6000) }
  await Wallpaper.loadCustom();
  Wallpaper.boot();

  Desktop.loadPos();
  Desktop.render();
  Desktop.bindSurface();

  // 开始菜单
  buildStart();
  $('#startSearch').addEventListener('input',debounce(buildStart,180));
  $('#startbtn').onclick=e=>{
    e.stopPropagation();
    const s=$('#start'), on=!s.classList.contains('open');
    s.classList.toggle('open',on);
    $('#startbtn').classList.toggle('on',on);
    if(on){ buildStart(); setTimeout(()=>$('#startSearch').focus(),60) }
  };
  $('#sb-settings').onclick=()=>{ $('#start').classList.remove('open'); openApp('settings') };
  $('#sb-explorer').onclick=()=>{ $('#start').classList.remove('open'); openApp('explorer') };
  $('#sb-full').onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen() };
  $('#sb-power').onclick=async()=>{
    const r=await showModal({title:'重启玄岩台',html:'<div>将重新载入系统界面，文件系统中的数据不会丢失。</div>',buttons:[{label:'取消'},{label:'重启',cls:'pri',value:true}]});
    if(r) location.reload();
  };
  $('#clockbox').onclick=e=>{ e.stopPropagation(); openCal() };
  $('#peekbtn').onclick=()=>{
    const vis=[...WM.wins.values()].filter(w=>!w.isMin);
    if(vis.length){ vis.forEach(w=>WM.minimize(w)); toast('已显示桌面') }
    else { [...WM.wins.values()].forEach(w=>WM.focus(w)) }
  };

  // 全局拖放（防止浏览器直接打开文件）
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{
    if(e.target.closest('#desktop')||e.target.closest('.listwrap')) return;
    e.preventDefault();
    if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){
      const dir=Prefs.get('lastDir','/opfs/桌面');
      window.__importFiles(e.dataTransfer.files,dir).then(()=>{ Desktop.render(); window.__explorerRefresh&&window.__explorerRefresh() });
    }
  }));

  // 键盘
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      hideCtx();
      $('#cal').style.display='none';
      $('#start').classList.remove('open'); $('#startbtn').classList.remove('on');
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){ e.preventDefault(); openApp('explorer') }
    if((e.ctrlKey||e.metaKey)&&e.key===','){ e.preventDefault(); openApp('settings') }
    if(e.key==='F5'){ e.preventDefault(); Desktop.render(); window.__explorerRefresh&&window.__explorerRefresh() }
  });

  // 存储读数
  const mem=async()=>{
    const est=await navigator.storage.estimate().catch(()=>({usage:0,quota:0}));
    $('#sb-mem').textContent='已用 '+fmtSize(est.usage)+' / '+fmtSize(est.quota);
  };
  mem(); setInterval(mem,30000);

  // 挂载提醒
  const ml=JSON.parse(localStorage.getItem('xy_mounts')||'[]');
  if(ml.length){
    setTimeout(()=>toast('上次挂载的本地文件夹需要重新授权：'+ml.join('、'),'info',7000),900);
  }

  // 移动端：默认收起侧栏
  if(innerWidth<640) setTimeout(()=>toast('单指拖动空白处可框选，长按图标可拖动位置','info',5200),1200);
})();
