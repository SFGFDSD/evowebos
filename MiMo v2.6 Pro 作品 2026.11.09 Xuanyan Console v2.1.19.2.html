<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#141110">
<title>玄岩台 · Xuanyan Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= 玄岩台 · BASALT CONSOLE ================= */
:root{
  --bg:#141110; --bg2:#1B1715; --panel:#211C19; --panel2:#2A231E; --panel3:#332A23;
  --ink:#F4EBDD; --muted:#A2968A; --dim:#6E6157;
  --line:rgba(214,164,86,.18); --line2:rgba(214,164,86,.34);
  --acc:#E8A33D; --acc-hi:#FFC77A; --acc-lo:#B7761F; --jade:#59C2A8; --danger:#E0603C;
  --radius:14px; --fs:14px;
  --rail:68px;
  --shadow:0 30px 70px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.05) inset;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
  --ticks:repeating-linear-gradient(to bottom, rgba(232,163,61,.25) 0 1px, transparent 1px 8px);
}
html[data-theme="light"]{
  --bg:#E8E0D2; --bg2:#DED4C2; --panel:#F7F2E9; --panel2:#FFFDF8; --panel3:#EFE7D9;
  --ink:#241C13; --muted:#6B5C4C; --dim:#9A8B79;
  --line:rgba(96,64,22,.16); --line2:rgba(96,64,22,.3);
  --acc:#B7761F; --acc-hi:#D89A3E; --acc-lo:#8A5612; --jade:#2E8B72;
  --shadow:0 24px 54px rgba(70,50,25,.22), 0 1px 0 rgba(255,255,255,.7) inset;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden}
body{
  font-family:"Noto Sans SC", "PingFang SC", sans-serif; font-size:var(--fs); color:var(--ink);
  background:var(--bg); user-select:none; -webkit-user-select:none; overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
.mono{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.tag{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.disp{font-family:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif; font-weight:400; letter-spacing:.02em}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(232,163,61,.22); border-radius:8px; border:2px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(232,163,61,.42); background-clip:content-box}
.ic{flex:none; display:block}

/* ---------- wallpaper ---------- */
#wall{position:fixed; inset:0; z-index:0; background:var(--bg); overflow:hidden}
#wall .layer{position:absolute; inset:-2%; background-size:cover; background-position:center; transition:opacity .8s ease, transform 12s ease}
#wall .duo{position:absolute; inset:0; mix-blend-mode:color; background:linear-gradient(150deg,#2b1c0c,#0d0b0a 55%,#241505)}
#wall .vig{position:absolute; inset:0; background:
   radial-gradient(120% 90% at 78% 8%, rgba(232,163,61,.16), transparent 55%),
   radial-gradient(100% 80% at 12% 100%, rgba(89,194,168,.10), transparent 60%),
   linear-gradient(180deg, rgba(10,8,7,.30), rgba(10,8,7,.72))}
#wall .grid{position:absolute; inset:0; opacity:.28;
  background-image:linear-gradient(rgba(232,163,61,.10) 1px, transparent 1px),linear-gradient(90deg, rgba(232,163,61,.10) 1px, transparent 1px);
  background-size:64px 64px; mask-image:radial-gradient(120% 100% at 50% 30%, #000 20%, transparent 85%)}
#wall .grain{position:absolute; inset:0; background-image:var(--grain); opacity:.16; mix-blend-mode:overlay}
html[data-wall="plain"] #wall .layer{opacity:0!important}
html[data-wall="plain"] #wall .duo{opacity:0}

/* ---------- desktop ---------- */
#desktop{position:fixed; inset:0; z-index:1; overflow:auto; overscroll-behavior:contain; touch-action:pan-x pan-y}
#icons{position:relative; min-height:100%; width:100%}
.dicon{position:absolute; width:88px; padding:8px 4px 6px; border-radius:12px; border:1px solid transparent;
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; cursor:default;
  transition:left .22s cubic-bezier(.2,.9,.25,1), top .22s cubic-bezier(.2,.9,.25,1), background .16s, border-color .16s, transform .12s}
.dicon:hover{background:rgba(232,163,61,.10); border-color:rgba(232,163,61,.22)}
.dicon.sel{background:rgba(232,163,61,.18); border-color:rgba(232,163,61,.5); box-shadow:0 0 0 1px rgba(232,163,61,.18) inset}
.dicon.dragging{opacity:.35}
.dicon .gl{width:46px; height:46px; display:grid; place-items:center; color:var(--acc-hi); filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.dicon .nm{font-size:11.5px; line-height:1.35; color:#F4EBDD; text-shadow:0 1px 3px rgba(0,0,0,.85); word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:84px}
html[data-theme="light"] .dicon .nm{color:#241C13; text-shadow:0 1px 2px rgba(255,255,255,.6)}
#marquee,#m-marquee{position:absolute; pointer-events:none; z-index:60; border:1px solid var(--acc);
  background:rgba(232,163,61,.10); border-radius:2px; display:none}
#selband{position:absolute; inset:0; z-index:2; display:none}

/* ---------- instrument rail ---------- */
#rail{position:fixed; left:0; top:0; bottom:0; width:var(--rail); z-index:900;
  background:linear-gradient(180deg, rgba(38,31,25,.92), rgba(22,18,15,.94));
  border-right:1px solid var(--line2); backdrop-filter:blur(22px) saturate(1.2);
  display:flex; flex-direction:column; align-items:center; padding:12px 0 10px; gap:10px}
#rail::before{content:''; position:absolute; right:5px; top:14px; bottom:14px; width:5px; background:var(--ticks); opacity:.5; border-radius:3px}
html[data-theme="light"] #rail{background:linear-gradient(180deg, rgba(250,246,238,.92), rgba(232,222,205,.95))}
#startbtn{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; color:var(--acc-hi);
  background:radial-gradient(120% 120% at 30% 20%, rgba(232,163,61,.26), rgba(232,163,61,.06));
  border:1px solid var(--line2); transition:.2s}
#startbtn:hover{transform:translateY(-1px); box-shadow:0 10px 24px rgba(232,163,61,.24)}
#startbtn.on{background:radial-gradient(120% 120% at 30% 20%, rgba(232,163,61,.5), rgba(232,163,61,.14)); color:#fff}
.rail-div{width:26px; height:1px; background:var(--line2); margin:2px 0}
#tasks{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; overflow-y:auto; overflow-x:hidden; padding:2px 0}
#tasks::-webkit-scrollbar{width:0}
.titem{position:relative; width:46px; height:46px; border-radius:13px; display:grid; place-items:center; color:var(--muted);
  border:1px solid transparent; transition:.18s}
.titem:hover{background:rgba(232,163,61,.12); color:var(--acc-hi)}
.titem.active{background:rgba(232,163,61,.18); color:var(--acc-hi); border-color:rgba(232,163,61,.3)}
.titem.min{opacity:.55}
.titem .led{position:absolute; left:-4px; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:3px;
  background:var(--acc); opacity:0; transition:.25s}
.titem .tx{position:absolute; right:-3px; top:-3px; width:16px; height:16px; border-radius:50%; display:none; place-items:center;
  background:var(--danger); color:#fff; border:1px solid var(--panel); box-shadow:0 3px 8px rgba(0,0,0,.4)}
.titem:hover .tx{display:grid}
.titem.active .led{opacity:1; box-shadow:0 0 10px var(--acc); animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
.rail-clock{margin-top:auto; text-align:center; padding:6px 2px; border-radius:12px; border:1px solid transparent; cursor:pointer}
.rail-clock:hover{border-color:var(--line2); background:rgba(232,163,61,.10)}
.rail-clock .hm{font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:600; letter-spacing:-.02em; color:var(--ink)}
.rail-clock .dt{font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.06em; color:var(--dim); margin-top:2px}
.peek-btn{width:34px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--dim); border:1px solid var(--line)}
.peek-btn:hover{color:var(--acc); border-color:var(--line2)}

/* ---------- start drawer ---------- */
#start{position:fixed; left:calc(var(--rail) + 12px); bottom:14px; width:min(560px, calc(100vw - var(--rail) - 26px));
  max-height:min(72vh, 640px); z-index:960; display:none; flex-direction:column;
  background:linear-gradient(170deg, rgba(42,35,30,.97), rgba(24,20,17,.98)); border:1px solid var(--line2);
  border-radius:18px; box-shadow:var(--shadow); overflow:hidden}
#start.open{display:flex; animation:drawer .26s cubic-bezier(.2,.9,.25,1)}
@keyframes drawer{from{opacity:0; transform:translateY(14px) scale(.98)}to{opacity:1; transform:none}}
html[data-theme="light"] #start{background:linear-gradient(170deg, rgba(255,252,246,.98), rgba(240,232,218,.98))}
.start-head{padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.start-head h2{margin:0; font-size:19px}
.start-search{flex:1; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.22); border:1px solid var(--line);
  border-radius:11px; padding:8px 12px}
html[data-theme="light"] .start-search{background:rgba(255,255,255,.6)}
.start-search input{flex:1; background:none; border:0; outline:0; font-size:13px}
#applist{flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px}
.apptile{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:13px; border:1px solid transparent;
  text-align:left; animation:tilein .38s backwards cubic-bezier(.2,.9,.25,1)}
@keyframes tilein{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.apptile:hover{background:rgba(232,163,61,.13); border-color:var(--line2); transform:translateY(-2px)}
.apptile .gl{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; color:#231a10;
  background:linear-gradient(150deg, var(--acc-hi), var(--acc-lo)); box-shadow:0 6px 14px rgba(232,163,61,.28)}
.apptile .nm{font-size:12.5px; line-height:1.25}
.apptile .ds{font-size:9.5px; color:var(--dim); letter-spacing:.1em; font-family:"IBM Plex Mono",monospace; text-transform:uppercase}
.start-foot{padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:10px; border:1px solid var(--line);
  font-size:11.5px; color:var(--muted); transition:.16s}
.chip:hover{color:var(--acc-hi); border-color:var(--line2); background:rgba(232,163,61,.10)}

/* ---------- windows ---------- */
#winlayer{position:fixed; inset:0 0 0 var(--rail); z-index:200; pointer-events:none}
.win{position:absolute; pointer-events:auto; display:flex; flex-direction:column; min-width:280px; min-height:180px;
  background:var(--panel); border:1px solid var(--line2); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; animation:winin .19s cubic-bezier(.2,.9,.25,1)}
@keyframes winin{from{opacity:0; transform:scale(.965) translateY(8px); filter:blur(6px)}to{opacity:1; transform:none; filter:none}}
.win.closing{animation:winout .16s forwards ease-in}
@keyframes winout{to{opacity:0; transform:scale(.97) translateY(6px)}}
.win.maxed{border-radius:0}
.win.focused{border-color:rgba(232,163,61,.44); box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(232,163,61,.14)}
.win:not(.focused){filter:saturate(.82) brightness(.94)}
.titlebar{height:38px; flex:none; display:flex; align-items:center; gap:9px; padding:0 8px 0 12px;
  background:linear-gradient(180deg, var(--panel2), var(--panel)); border-bottom:1px solid var(--line); cursor:grab; position:relative}
.titlebar::after{content:''; position:absolute; left:12px; right:12px; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,163,61,.5), transparent)}
.titlebar:active{cursor:grabbing}
.titlebar .ti{width:19px; height:19px; color:var(--acc)}
.titlebar .tt{font-family:"ZCOOL QingKe HuangYou",sans-serif; font-size:13.5px; letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.titlebar .sub{font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wbtns{margin-left:auto; display:flex; gap:5px}
.wbtn{width:30px; height:24px; border-radius:7px; display:grid; place-items:center; color:var(--muted);
  border:1px solid var(--line); background:rgba(255,255,255,.03); transition:.15s}
.wbtn:hover{color:var(--ink); border-color:var(--line2); background:rgba(232,163,61,.16)}
.wbtn.close:hover{background:var(--danger); border-color:var(--danger); color:#fff}
.winbody{flex:1; min-height:0; position:relative; overflow:hidden; display:flex; flex-direction:column}
.rz{position:absolute; z-index:5}
.rz.n{top:-3px; left:12px; right:12px; height:7px; cursor:ns-resize}
.rz.s{bottom:-3px; left:12px; right:12px; height:7px; cursor:ns-resize}
.rz.w{left:-3px; top:12px; bottom:12px; width:7px; cursor:ew-resize}
.rz.e{right:-3px; top:12px; bottom:12px; width:7px; cursor:ew-resize}
.rz.nw{left:-3px; top:-3px; width:14px; height:14px; cursor:nwse-resize}
.rz.ne{right:-3px; top:-3px; width:14px; height:14px; cursor:nesw-resize}
.rz.sw{left:-3px; bottom:-3px; width:14px; height:14px; cursor:nesw-resize}
.rz.se{right:-3px; bottom:-3px; width:14px; height:14px; cursor:nwse-resize}
#snap{position:fixed; z-index:190; border:1px solid rgba(232,163,61,.5); background:rgba(232,163,61,.14);
  border-radius:12px; backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:.16s ease}
#snap.on{opacity:1}

/* ---------- taskbar preview (aero peek) ---------- */
#peek{position:fixed; z-index:970; display:none; padding:10px; border-radius:15px; background:rgba(28,23,20,.96);
  border:1px solid var(--line2); box-shadow:var(--shadow); width:230px}
#peek .pv{height:118px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--panel2);
  display:grid; place-items:center; color:var(--dim); position:relative}
#peek .pt{margin-top:8px; font-size:11.5px; display:flex; align-items:center; gap:7px}
.peeking .win:not(.peek-target){opacity:.18; filter:blur(1.5px) saturate(.4); transition:.22s}

/* ---------- context menu / dialog / toast ---------- */
#ctx{position:fixed; z-index:990; min-width:196px; padding:6px; border-radius:13px; display:none;
  background:rgba(32,26,22,.97); border:1px solid var(--line2); box-shadow:var(--shadow); backdrop-filter:blur(18px)}
html[data-theme="light"] #ctx{background:rgba(255,252,246,.98)}
#ctx button{display:flex; width:100%; align-items:center; gap:10px; padding:8px 11px; border-radius:9px; font-size:12.5px; color:var(--ink); text-align:left}
#ctx button:hover{background:rgba(232,163,61,.16)}
#ctx button[disabled]{opacity:.38; pointer-events:none}
#ctx .sep{height:1px; background:var(--line); margin:5px 8px}
#ctx .kbd{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:9px; color:var(--dim)}
#toasts{position:fixed; right:16px; bottom:16px; z-index:995; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.toast{display:flex; gap:10px; align-items:flex-start; max-width:330px; padding:11px 14px; border-radius:13px;
  background:rgba(32,26,22,.96); border:1px solid var(--line2); box-shadow:0 18px 40px rgba(0,0,0,.4);
  animation:tin .3s cubic-bezier(.2,.9,.25,1); font-size:12.5px}
html[data-theme="light"] .toast{background:rgba(255,252,246,.98)}
@keyframes tin{from{opacity:0; transform:translateX(18px)}to{opacity:1; transform:none}}
.toast.out{animation:tout .3s forwards}
@keyframes tout{to{opacity:0; transform:translateX(18px)}}
.toast .bar{width:3px; align-self:stretch; border-radius:3px; background:var(--acc)}
.toast.err .bar{background:var(--danger)} .toast.ok .bar{background:var(--jade)}
.modal-wrap{position:fixed; inset:0; z-index:992; display:none; place-items:center; background:rgba(10,8,7,.55); backdrop-filter:blur(4px)}
.modal-wrap.open{display:grid}
.modal{width:min(520px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line2); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden; animation:winin .22s}
.modal h3{margin:0; padding:16px 20px 8px; font-family:"ZCOOL QingKe HuangYou",sans-serif; font-size:17px; letter-spacing:.04em}
.modal .mb{padding:4px 20px 16px; font-size:13px; color:var(--muted); line-height:1.8}
.modal .mf{padding:12px 20px 18px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.btn{padding:9px 16px; border-radius:11px; border:1px solid var(--line2); font-size:12.5px; color:var(--ink); transition:.16s; background:rgba(255,255,255,.03)}
.btn:hover{background:rgba(232,163,61,.16); transform:translateY(-1px)}
.btn.pri{background:linear-gradient(150deg, var(--acc-hi), var(--acc-lo)); color:#241a0c; border-color:transparent; font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dgr:hover{background:var(--danger); border-color:var(--danger); color:#fff}
.field{display:flex; flex-direction:column; gap:6px; margin:12px 0}
.field input,.field select,.field textarea{background:rgba(0,0,0,.24); border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:0}
html[data-theme="light"] .field input,html[data-theme="light"] .field select{background:rgba(255,255,255,.7)}
.field input:focus,.field select:focus{border-color:var(--acc)}

/* ---------- shared app chrome ---------- */
.toolbar{display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; background:rgba(255,255,255,.015)}
.tb{display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:10px; border:1px solid transparent;
  font-size:12px; color:var(--muted); white-space:nowrap; transition:.15s}
.tb:hover{color:var(--ink); background:rgba(232,163,61,.13); border-color:var(--line)}
.tb.on{color:#241a0c; background:linear-gradient(150deg,var(--acc-hi),var(--acc-lo)); border-color:transparent; font-weight:600}
.tb .ic{width:16px; height:16px}
.statusbar{flex:none; display:flex; align-items:center; gap:14px; padding:6px 12px; border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; flex-wrap:wrap}
.spacer{flex:1}
.empty{display:grid; place-items:center; gap:12px; padding:40px 20px; text-align:center; color:var(--dim)}
.empty .gl{width:64px; height:64px; opacity:.5}
.loadring{width:26px; height:26px; border-radius:50%; border:2px solid rgba(232,163,61,.22); border-top-color:var(--acc); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadbar{position:absolute; left:0; top:0; height:2px; width:36%; background:linear-gradient(90deg,transparent,var(--acc),transparent); animation:slide 1.1s ease-in-out infinite; z-index:9}
@keyframes slide{0%{left:-36%}100%{left:100%}}

/* ---------- explorer ---------- */
.exp{display:flex; flex:1; min-height:0}
.expside{width:206px; flex:none; border-right:1px solid var(--line); overflow-y:auto; padding:10px 8px; background:rgba(0,0,0,.12)}
html[data-theme="light"] .expside{background:rgba(255,255,255,.35)}
.side-h{padding:10px 10px 6px}
.side-i{display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:9px; font-size:12px; color:var(--muted); cursor:pointer}
.side-i:hover{background:rgba(232,163,61,.12); color:var(--ink)}
.side-i.on{background:rgba(232,163,61,.2); color:var(--acc-hi)}
.side-i .ic{width:16px; height:16px}
.side-i .tw{width:12px; color:var(--dim); font-size:9px}
.expmain{flex:1; min-width:0; display:flex; flex-direction:column}
.crumbs{display:flex; align-items:center; gap:3px; padding:6px 10px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none}
.crumbs::-webkit-scrollbar{height:0}
.crumb{padding:5px 9px; border-radius:8px; font-size:11.5px; color:var(--muted); white-space:nowrap; border:1px solid transparent}
.crumb:hover{background:rgba(232,163,61,.13); color:var(--acc-hi)}
.crumb.cur{color:var(--acc-hi); border-color:var(--line2)}
.listwrap{flex:1; min-height:0; overflow:auto; position:relative; touch-action:pan-x pan-y}

.imgview{flex:1; min-height:0; overflow:auto; display:grid; place-items:center; background:#0B0A09; position:relative}
.imgview img{max-width:none; transition:transform .18s ease; cursor:grab; image-rendering:auto}

#cal{position:fixed; z-index:985; width:280px; padding:14px; border-radius:16px; display:none;

/* ================= VFS : OPFS + IndexedDB + 本地挂载 ================= */
const IDB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      if(!('indexedDB' in window)) return rej(new Error('IndexedDB 不可用'));
      const r=indexedDB.open('xuanyan_fs',1);
      r.onupgradeneeded=()=>{
        const db=r.result;
        if(!db.objectStoreNames.contains('nodes')) db.createObjectStore('nodes');
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
        if(!db.objectStoreNames.contains('prefs')) db.createObjectStore('prefs');
      };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
  },
  async run(store,mode,fn){
    if(!this.db) this.db=await this.open();
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode), s=t.objectStore(store), out=fn(s);
      t.oncomplete=()=>res(out && out.result!==undefined ? out.result : out && out.__v!==undefined ? out.__v : undefined);
      t.onerror=()=>rej(t.error);
    });
  },
  get(st,k){ return this.run(st,'readonly',s=>s.get(k)) },
  put(st,k,v){ return this.run(st,'readwrite',s=>s.put(v,k)) },
  del(st,k){ return this.run(st,'readwrite',s=>s.delete(k)) },
  keys(st){ return this.run(st,'readonly',s=>s.getAllKeys()) },
  vals(st){ return this.run(st,'readonly',s=>s.getAll()) },
  clear(st){ return this.run(st,'readwrite',s=>s.clear()) }
};

const Meta = {
  map:new Map(),
  async load(){ try{ const k=await IDB.keys('meta'), v=await IDB.vals('meta'); k.forEach((key,i)=>this.map.set(key, v[i])); }catch(e){} },
  get(p){ return this.map.get(p) },
  async set(p,t){ this.map.set(p,t); try{ await IDB.put('meta',p,t) }catch(e){} },
  async del(p){ this.map.delete(p); try{ await IDB.del('meta',p) }catch(e){} },
  async rename(from,to){
    const t=this.map.get(from);
    await this.del(from);
    if(t!=null) await this.set(to,t);
  }
};

const pathUtil = {
  norm(p){
    p=String(p||'/').replace(/\\/g,'/');
    if(p[0]!=='/') p='/'+p;
    const out=[];
    for(const seg of p.split('/')){
      if(!seg||seg==='.') continue;
      if(seg==='..'){ out.pop(); continue }
      out.push(seg);
    }
    return '/'+out.join('/');
  },
  zone(p){ const n=this.norm(p).slice(1).split('/'); return ['opfs','idb','mnt'].includes(n[0]) ? n[0] : 'opfs' },
  parts(p){ const n=this.norm(p).slice(1).split('/'); return (['opfs','idb','mnt'].includes(n[0]) ? n.slice(1) : n).filter(Boolean) },
  join(...a){ return this.norm(a.filter(Boolean).join('/')) },
  dirname(p){ const n=this.norm(p); const i=n.lastIndexOf('/'); return i<=0?'/':n.slice(0,i) },
  basename(p){ const n=this.norm(p); return n.slice(n.lastIndexOf('/')+1) },
  ext(p){ return extOf(this.basename(p)) }
};

/* ---------- IndexedDB 后端 ---------- */
const idbIndex = new Map();     // path -> {d,size,mtime}
const idb = {
  async refresh(){
    try{
      const ks=await IDB.keys('nodes'), vs=await IDB.vals('nodes');
      idbIndex.clear();
      ks.forEach((k,i)=>{ const v=vs[i]||{}; idbIndex.set(k,{d:!!v.d, size:v.size||0, mtime:v.mtime||0}) });
    }catch(e){}
  },
  async readdir(p){
    p=pathUtil.norm(p);
    const out=[];
    for(const [k,v] of idbIndex){
      if(pathUtil.dirname(k)===p) out.push({name:pathUtil.basename(k), path:k, isDir:v.d, size:v.d?0:v.size, mtime:v.mtime});
    }
    return out;
  },
  async stat(p){
    p=pathUtil.norm(p);
    if(p==='/idb') return {name:'idb', path:p, isDir:true, size:0, mtime:0};
    const v=idbIndex.get(p);
    if(!v) throw Object.assign(new Error('不存在：'+p),{code:'ENOENT'});
    return {name:pathUtil.basename(p), path:p, isDir:v.d, size:v.d?0:v.size, mtime:v.mtime};
  },
  async readFile(p){
    p=pathUtil.norm(p);
    const rec=await IDB.get('nodes',p);
    if(!rec||rec.d) throw Object.assign(new Error('不是文件：'+p),{code:'ENOENT'});
    return rec.data instanceof ArrayBuffer ? rec.data : await new Blob([rec.data]).arrayBuffer();
  },
  async writeFile(p,data,opts={}){
    p=pathUtil.norm(p);
    const buf = data instanceof ArrayBuffer ? data : (data instanceof Uint8Array ? data.buffer : await new Blob([data]).arrayBuffer());
    const mtime = opts.mtime || Date.now();
    await IDB.put('nodes',p,{d:false, data:buf, size:buf.byteLength, mtime});
    idbIndex.set(p,{d:false,size:buf.byteLength,mtime});
    await Meta.set(p,mtime);
    return p;
  },
  async mkdir(p,opts={}){
    p=pathUtil.norm(p);
    const par=pathUtil.dirname(p);
    if(par!=='/idb' && !idbIndex.get(par)) await this.mkdir(par,{});
    const cur=await IDB.get('nodes',p);
    if(cur && !cur.d) throw Object.assign(new Error('同名文件已存在'),{code:'EEXIST'});
    const mtime=opts.mtime||Date.now();
    await IDB.put('nodes',p,{d:true,mtime});
    idbIndex.set(p,{d:true,size:0,mtime});
    await Meta.set(p,mtime);
    return p;
  },
  async rm(p){
    p=pathUtil.norm(p);
    const keys=[...idbIndex.keys()].filter(k=>k===p||k.startsWith(p+'/'));
    for(const k of keys){ await IDB.del('nodes',k); await Meta.del(k); idbIndex.delete(k) }
  },
  async exists(p){ return pathUtil.norm(p)==='/idb' || idbIndex.has(pathUtil.norm(p)) }
};

/* ---------- OPFS 后端 ---------- */
const opfs = {
  root:null, cache:new Map(),
  async init(){
    if(!this.root){
      if(!navigator.storage||!navigator.storage.getDirectory) throw new Error('OPFS 不可用');
      this.root=await navigator.storage.getDirectory();
    }
    return this.root;
  },
  async dir(parts,create=false){
    const key='/'+parts.join('/');
    if(!create && this.cache.has(key)) return this.cache.get(key);
    let d=await this.init();
    for(const seg of parts) d=await d.getDirectoryHandle(seg,{create});
    if(parts.length) this.cache.set(key,d);
    return d;
  },
  async file(parts,create=false){
    const arr=parts.slice();
    const name=arr.pop();
    const d=await this.dir(arr,create);
    return d.getFileHandle(name,{create});
  },
  async readdir(p){
    const parts=pathUtil.parts(p);
    const d=await this.dir(parts,false);
    const out=[];
    const collect=async(name,h)=>{
      if(name==='.'||name==='..') return;
      const full=pathUtil.join(p,name);
      if(h.kind==='directory'){
        let m=Meta.get(full)||0;
        out.push({name, path:full, isDir:true, size:0, mtime:m});
      }else{
        const f=await h.getFile();
        out.push({name, path:full, isDir:false, size:f.size, mtime:Meta.get(full)||f.lastModified});
      }
    };
    if(typeof d.entries==='function'){
      for await (const [name,h] of d.entries()){ try{ await collect(name,h) }catch(e){} }
    }else{
      for await (const name of d.keys()){
        try{
          const h=await d.getFileHandle(name).catch(()=>null)||await d.getDirectoryHandle(name);
          await collect(name,h);
        }catch(e){}
      }
    }
    return out;
  },
  async stat(p){
    const parts=pathUtil.parts(p);
    if(!parts.length) return {name:'opfs', path:'/', isDir:true, size:0, mtime:0};
    const arr=parts.slice(), name=arr.pop();
    const d=await this.dir(arr,false);
    try{
      const fd=await d.getFileHandle(name);
      const f=await fd.getFile();
      return {name, path:pathUtil.norm(p), isDir:false, size:f.size, mtime:Meta.get(p)||f.lastModified};
    }catch(e){
      await d.getDirectoryHandle(name);
      return {name, path:pathUtil.norm(p), isDir:true, size:0, mtime:Meta.get(p)||0};
    }
  },
  async readFile(p){ const f=await this.file(pathUtil.parts(p),false); return await (await f.getFile()).arrayBuffer() },
  async writeFile(p,data,opts={}){
    const f=await this.file(pathUtil.parts(p),true);
    const w=await f.createWritable();
    const chunk = data instanceof ArrayBuffer ? new Uint8Array(data) : (data instanceof Uint8Array ? data : data);
    await w.write(chunk); await w.close();
    const mtime=opts.mtime||Date.now();
    await Meta.set(pathUtil.norm(p),mtime);
    return p;
  },
  async mkdir(p,opts={}){
    await this.dir(pathUtil.parts(p),true);
    await Meta.set(pathUtil.norm(p),opts.mtime||Date.now());
    return p;
  },
  async rm(p){
    const parts=pathUtil.parts(p);
    const name=parts.pop();
    const d=await this.dir(parts,false);
    await d.removeEntry(name,{recursive:true});
    this.cache.clear();
    const pref=pathUtil.norm(p);
    for(const k of [...Meta.map.keys()]) if(k===pref||k.startsWith(pref+'/')) await Meta.del(k);
  },
  async exists(p){ try{ await this.stat(p); return true }catch(e){ return false } }
};

/* ---------- 本地文件夹挂载 (File System Access API) ---------- */
const mounts = new Map();   // name -> FileSystemDirectoryHandle
const mnt = {
  isRoot(path){ return pathUtil.parts(path).length===0 },
  handle(path){
    const parts=pathUtil.parts(path);
    const name=parts.shift();
    const h=mounts.get(name);
    if(!h) throw Object.assign(new Error('未挂载：'+name),{code:'ENOENT'});
    return {root:h, rest:parts};
  },
  async dir(path,create=false){
    const {root,rest}=this.handle(path);
    let d=root;
    for(const seg of rest) d=await d.getDirectoryHandle(seg,{create});
    return d;
  },
  async file(path,create=false){
    const {root,rest}=this.handle(path);
    const arr=rest.slice(), name=arr.pop();
    let d=root;
    for(const seg of arr) d=await d.getDirectoryHandle(seg,{create});
    return d.getFileHandle(name,{create});
  },
  async readdir(p){
    if(this.isRoot(p)){
      return [...mounts.keys()].map(n=>({name:n,path:'/mnt/'+n,isDir:true,size:0,mtime:Meta.get('/mnt/'+n)||0}));
    }
    const d=await this.dir(p,false);
    const out=[];
    for await (const [name,h] of d.entries()){
      const full=pathUtil.join(p,name);
      if(h.kind==='directory'){ out.push({name,path:full,isDir:true,size:0,mtime:Meta.get(full)||0}) }
      else{ const f=await h.getFile(); out.push({name,path:full,isDir:false,size:f.size,mtime:Meta.get(full)||f.lastModified}) }
    }
    return out;
  },
  async stat(p){
    const parts=pathUtil.parts(p);
    if(parts.length<=1) return {name:parts[0]||'mnt',path:pathUtil.norm(p),isDir:true,size:0,mtime:Meta.get(p)||0};

      const f=await this.file(p,false); const file=await f.getFile();
      return {name:parts[parts.length-1],path:pathUtil.norm(p),isDir:false,size:file.size,mtime:Meta.get(p)||file.lastModified};
    }catch(e){
      await this.dir(p,false);

    await Meta.set(pathUtil.norm(p),opts.mtime||Date.now()); return p;
  },
  async mkdir(p,opts={}){ await this.dir(p,true); await Meta.set(pathUtil.norm(p),opts.mtime||Date.now()); return p },
  async rm(p){

    let d=await this.handle(p).root;

    await d.removeEntry(name,{recursive:true});

  async exists(p){ try{ await this.stat(p); return true }catch(e){ return false } }
};

  async writeFile(p,data,opts={}){ return await this.be(p).writeFile(pathUtil.norm(p),data,opts) },

  async rm(p){ const m=pathUtil.norm(p); await this.be(m).rm(m) },

  async rename(from,to){

    if(st.isDir){
      await this.cpDir(from,to);
      await this.rm(from);
      await Meta.set(to,mt);
      for(const k of [...Meta.map.keys()]) if(k.startsWith(from+'/')){ const t=Meta.get(k); await Meta.del(k); await Meta.set(to+k.slice(from.length),t) }
    }else{
      const data=await this.readFile(from);
      await this.writeFile(to,data,{mtime:mt});

    }
    return to;
  },
  async cpDir(from,to){
    await this.mkdir(to,{mtime:Meta.get(from)||Date.now()});
    const items=await this.readdir(from);

      if(it.isDir) await this.cpDir(s,d);
      else await this.writeFile(d,await this.readFile(s),{mtime:Meta.get(s)||it.mtime});
    }
  },
  async copy(from,to){

    const mt=Meta.get(from)||st.mtime;

  },
  async move(from,to){
    from=pathUtil.norm(from); to=pathUtil.norm(to);
    if(pathUtil.dirname(from)===pathUtil.dirname(to) && pathUtil.basename(to)===pathUtil.basename(from)) return from;
    await this.copy(from,to);
    await this.rm(from);
    return to;
  },
  async du(p){

    let total=0;
    const items=await this.readdir(p).catch(()=>[]);
    for(const it of items){ total += it.isDir ? await this.du(it.path).catch(()=>0) : it.size }
    return total;
  },
  async search(root,q){

      const items=await this.readdir(dir).catch(()=>[]);
      for(const it of items){
        if(it.name.toLowerCase().includes(ql)) out.push(it);
        if(it.isDir) await walk(it.path,depth+1);
      }
    };
    await walk(pathUtil.norm(root),0);
    return out;
  },
  async listImages(dir){

  join:pathUtil.join.bind(pathUtil), dirname:pathUtil.dirname.bind(pathUtil), basename:pathUtil.basename.bind(pathUtil),

/* ---- 压缩：gzip / tar 原生，zip 走 JSZip（惰性） ---- */
async function gzipDecode(buf){
  if(typeof DecompressionStream==='function'){
    const ds=new DecompressionStream('gzip');
    const s=new Blob([buf]).stream().pipeThrough(ds);
    return await new Response(s).arrayBuffer();
  }
  throw new Error('当前浏览器不支持原生 gzip 解码');
}
function parseTar(buf){
  const u=new Uint8Array(buf); const dec=new TextDecoder(); const out=[]; let off=0;
  while(off+512<=u.length){
    const head=u.subarray(off,off+512);
    if(head.every(b=>b===0)) break;
    const name=dec.decode(head.subarray(0,100)).replace(/\0.*$/,'');
    const prefix=dec.decode(head.subarray(345,500)).replace(/\0.*$/,'');
    const sizeOct=dec.decode(head.subarray(124,136)).replace(/\0.*$/,'').trim();
    const size=parseInt(sizeOct||'0',8)||0;
    const mtime=(parseInt(dec.decode(head.subarray(136,148)).replace(/\0.*$/,'').trim()||'0',8)||0)*1000;
    const type=String.fromCharCode(head[156]||48);
    off+=512;
    const data=u.subarray(off,off+size);
    off+=Math.ceil(size/512)*512;
    if(name) out.push({name:(prefix?prefix+'/':'')+name, size, mtime, isDir:type==='5', data:type==='0'?data.slice().buffer:null});
  }
  return out;
}
async function loadJSZip(){
  if(window.JSZip) return window.JSZip;
  const urls=['https://unpkg.com/jszip@3.10.1/dist/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'];
  for(const u of urls){
    try{
      await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=u; s.onload=res; s.onerror=rej; document.head.appendChild(s); setTimeout(rej,12000) });
      if(window.JSZip) return window.JSZip;
    }catch(e){}
  }
  throw new Error('JSZip 加载失败（网络不可用）');
}

    $$('.win.peek-target').forEach(w=>w.classList.remove('peek-target'));
  },
  makeDraggable(win){
    const bar=$('.titlebar',win.el), el=win.el;
    let sx=0,sy=0,ox=0,oy=0,drag=false,snapTo=null;
    const layer=$('#winlayer');
    bar.addEventListener('pointerdown',e=>{
      if(e.target.closest('.wbtns')||e.button===2) return;
      if(el.classList.contains('maxed')) return;
      drag=true; sx=e.clientX; sy=e.clientY;
      const r=el.getBoundingClientRect(), L=layer.getBoundingClientRect();
      ox=r.left-L.left; oy=r.top-L.top;
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove',e=>{
      if(!drag) return;
      const L=layer.getBoundingClientRect();
      el.style.left=clamp(ox+e.clientX-sx, -el.offsetWidth+80, L.width-60)+'px';
      el.style.top=clamp(oy+e.clientY-sy, 0, L.height-40)+'px';
      snapTo=null;
      const sp=$('#snap');
      const nearTop=e.clientY<8, nearL=e.clientX-L.left<10, nearR=e.clientX>L.right-10;
      if(nearTop){ snapTo='max'; sp.style.cssText='left:'+L.left+'px;top:'+L.top+'px;width:'+L.width+'px;height:'+L.height+'px' }
      else if(nearL){ snapTo='left'; sp.style.cssText='left:'+L.left+'px;top:'+L.top+'px;width:'+(L.width/2)+'px;height:'+L.height+'px' }
      else if(nearR){ snapTo='right'; sp.style.cssText='left:'+(L.left+L.width/2)+'px;top:'+L.top+'px;width:'+(L.width/2)+'px;height:'+L.height+'px' }
      sp.classList.toggle('on',!!snapTo);
    });
    const end=()=>{
      if(!drag) return; drag=false;
      $('#snap').classList.remove('on');
      if(snapTo){
        const L=layer.getBoundingClientRect();
        const r=el.getBoundingClientRect();
        if(!el.classList.contains('maxed')) win.prevRect={x:r.left-L.left,y:r.top-L.top,w:r.width,h:r.height};
        if(snapTo==='max'){ if(!el.classList.contains('maxed')) this.toggleMax(win) }
        else{
          el.classList.remove('maxed');
          el.style.left=(snapTo==='left'?0:L.width/2)+'px'; el.style.top='0px';
          el.style.width=(L.width/2)+'px'; el.style.height=L.height+'px';
          win.onResize&&win.onResize();
        }
      }
    };
    bar.addEventListener('pointerup',end); bar.addEventListener('pointercancel',end);
  },
  makeResizable(win){
    const el=win.el, layer=$('#winlayer');
    $$('.rz',el).forEach(h=>{
      h.addEventListener('pointerdown',e=>{
        e.preventDefault(); e.stopPropagation();
        const d=h.dataset.d;
        const r=el.getBoundingClientRect(), L=layer.getBoundingClientRect();
        const st={x:e.clientX,y:e.clientY,left:r.left-L.left,top:r.top-L.top,w:r.width,h:r.height};
        el.classList.remove('maxed');
        const mv=ev=>{
          const dx=ev.clientX-st.x, dy=ev.clientY-st.y;
          let {left,top,w,h}=st;
          if(d.includes('e')) w=Math.max(280,st.w+dx);
          if(d.includes('s')) h=Math.max(180,st.h+dy);
          if(d.includes('w')){ w=Math.max(280,st.w-dx); left=st.left+(st.w-w) }
          if(d.includes('n')){ h=Math.max(180,st.h-dy); top=Math.max(0,st.top+(st.h-h)) }
          el.style.cssText='left:'+left+'px;top:'+top+'px;width:'+w+'px;height:'+h+'px;z-index:'+el.style.zIndex;
          win.onResize&&win.onResize();
        };
        const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); win.onResize&&win.onResize() };
        document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
      });
    });
  }
};

function tickClock(){
  const d=new Date();
  let h=d.getHours();
  const use12=Prefs.get('clock12',true);
  let suffix='';
  if(use12){ suffix=h<12?' AM':' PM'; h=h%12||12 }
  const p=n=>String(n).padStart(2,'0');
  $('#clockHm').textContent=p(h)+':'+p(d.getMinutes())+suffix;
  $('#clockDt').textContent=d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' 周'+'日一二三四五六'[d.getDay()];
}
let calMonth=null;
function openCal(){
  const el=$('#cal');
  if(el.style.display==='block'){ el.style.display='none'; return }
  calMonth=new Date();
  renderCal();
  el.style.display='block';
  const r=$('#clockbox').getBoundingClientRect(), cr=el.getBoundingClientRect();
  if(innerWidth>1099){ el.style.left=(r.right+12)+'px'; el.style.bottom=(innerHeight-r.top+10)+'px'; el.style.top='auto' }
  else{ el.style.left=clamp(r.left+r.width/2-140,10,innerWidth-290)+'px'; el.style.bottom=(innerHeight-r.top+10)+'px'; el.style.top='auto' }
}
function renderCal(){
  const el=$('#cal');
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1), start=first.getDay(), days=new Date(y,m+1,0).getDate();
  const today=new Date();
  let html='<div class="cal-h"><button class="chip" data-nav="-1">'+icon('back',13)+'</button>'+
    '<div class="m">'+y+' 年 '+(m+1)+' 月</div>'+
    '<button class="chip" data-nav="1">'+icon('fwd',13)+'</button></div>';
  html+='<div class="cal-g">'+'日一二三四五六'.split('').map(w=>'<div class="wd">'+w+'</div>').join('');
  const prevDays=new Date(y,m,0).getDate();
  for(let i=0;i<42;i++){
    const dayNum=i-start+1;
    let label, out='';
    if(dayNum<1){ label=prevDays+dayNum; out=' out' }
    else if(dayNum>days){ label=dayNum-days; out=' out' }
    else label=dayNum;
    const isToday=!out&&dayNum===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    html+='<div class="d'+out+(isToday?' today':'')+'">'+label+'</div>';
  }
  html+='</div>';
  html+='<div style="margin-top:10px" class="tag">今天 · '+fmtDate(Date.now())+'</div>';
  el.innerHTML=html;
  $$('[data-nav]',el).forEach(b=>b.onclick=()=>{ calMonth=new Date(y,m+parseInt(b.dataset.nav,10),1); renderCal() });
}
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#cal')&&!e.target.closest('#clockbox')) $('#cal').style.display='none';
  if(!e.target.closest('#start')&&!e.target.closest('#startbtn')) $('#start').classList.remove('open'),$('#startbtn').classList.remove('on');
});

/* ---- 通用框选（鼠标 + 触摸，边缘自动滚动，AABB 碰撞） ---- */
function marqueeSelect(container, scrollEl, itemSel, onHit){
  let start=null, box=null, raf=null, lastEv=null;
  const getClientXY=e=>{
    if(e.touches&&e.touches[0]) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(e.changedTouches&&e.changedTouches[0]) return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    return {x:e.clientX,y:e.clientY};
  };
  const buildBox=()=>{
    if(!box){ box=document.createElement('div'); box.id='m-marquee'; box.style.display='block'; (scrollEl||container).appendChild(box) }
    return box;
  };
  const apply=()=>{
    if(!start||!lastEv) return;
    const p=getClientXY(lastEv);
    const host=scrollEl||container;
    const hostRect=host.getBoundingClientRect();
    const x1=Math.min(start.x,p.x), y1=Math.min(start.y,p.y), x2=Math.max(start.x,p.x), y2=Math.max(start.y,p.y);
    const b=buildBox();
    const hostPos=getComputedStyle(host).position;
    if(hostPos==='static') host.style.position='relative';
    b.style.left=(x1-hostRect.left+host.scrollLeft)+'px';
    b.style.top=(y1-hostRect.top+host.scrollTop)+'px';
    b.style.width=(x2-x1)+'px'; b.style.height=(y2-y1)+'px';
    onHit({left:x1,top:y1,right:x2,bottom:y2,width:x2-x1,height:y2-y1});
    // 边缘自动滚动 40px
    const edge=40; let dy=0,dx=0;
    if(p.y-hostRect.top<edge) dy=-Math.min(18,(edge-(p.y-hostRect.top))/2);
    else if(hostRect.bottom-p.y<edge) dy=Math.min(18,(edge-(hostRect.bottom-p.y))/2);
    if(p.x-hostRect.left<edge) dx=-Math.min(18,(edge-(p.x-hostRect.left))/2);
    else if(hostRect.right-p.x<edge) dx=Math.min(18,(edge-(hostRect.right-p.x))/2);
    if(dx||dy){ host.scrollLeft+=dx; host.scrollTop+=dy }
    raf=requestAnimationFrame(apply);
  };
  const move=e=>{
    if(!start) return;
    lastEv=e;
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{
    if(!start) return;
    start=null; lastEv=null;
    if(raf) cancelAnimationFrame(raf);
    if(box){ box.remove(); box=null }
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('touchmove',move);
    document.removeEventListener('touchend',end);
    document.body.style.userSelect='';
  };
  const begin=(e)=>{
    if(start) return;
    if(e.target.closest(itemSel)||e.target.closest('button,input,textarea,select,.colhead')) return;
    if(e.button!==undefined&&e.button!==0) return;
    const p=getClientXY(e);
    start=p; lastEv=e;
    document.body.style.userSelect='none';
    document.addEventListener('pointermove',move,{passive:false});
    document.addEventListener('pointerup',end);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('touchend',end);
    raf=requestAnimationFrame(apply);
  };
  container.addEventListener('pointerdown',begin);
  container.addEventListener('touchstart',begin,{passive:true});
  return ()=>{ end() };
}

window.__dragCache=new Map();
window.__preload=async(path)=>{
  if(window.__dragCache.has(path)) return;
  try{ const st=await fs.stat(path); if(!st.isDir&&st.size<24*1024*1024){ const b=await fs.readBlob(path); window.__dragCache.set(path,b) } }catch(e){}
  if(window.__dragCache.size>60) window.__dragCache.clear();
};
window.__exportPaths=async(paths)=>{
  for(const p of paths){
    try{
      const st=await fs.stat(p);
      if(st.isDir){ toast('文件夹请先压缩后再导出：'+st.name,'err'); continue }
      const b=await fs.readBlob(p);
      download(b, st.name);
    }catch(e){ toast('导出失败：'+e.message,'err') }
  }
  toast('已开始下载 '+paths.length+' 个文件','ok');
};
window.__importFiles=async(files,dir)=>{
  let n=0;
  for(const f of files){
    try{ await fs.writeFile(fs.join(dir,f.name), await f.arrayBuffer(), {mtime:f.lastModified||Date.now()}); n++ }
    catch(e){ toast('导入失败 '+f.name+'：'+e.message,'err') }
  }
  if(n) toast('已导入 '+n+' 个文件','ok');
  return n;
};
window.__readEntry=async(entry,dir)=>{
  if(entry.isFile){
    const file=await new Promise((res,rej)=>entry.file(res,rej));
    await fs.writeFile(fs.join(dir,entry.name), await file.arrayBuffer(), {mtime:file.lastModified||Date.now()});
    return 1;
  }
  if(entry.isDirectory){
    const sub=fs.join(dir,entry.name);
    await fs.mkdir(sub).catch(()=>{});
    let n=0, batch;
    const reader=entry.createReader();
    do{
      batch=await new Promise(res=>reader.readEntries(res,()=>res([])));
      for(const e of batch) n+=await window.__readEntry(e,sub);
    }while(batch&&batch.length);
    return n;
  }
  return 0;
};
window.__importEntries=async(items,dir)=>{
  const entries=[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.webkitGetAsEntry){ const e=it.webkitGetAsEntry(); if(e) entries.push(e) }
    else if(it.getAsFile){ const f=it.getAsFile(); if(f) await fs.writeFile(fs.join(dir,f.name),await f.arrayBuffer(),{mtime:f.lastModified||Date.now()}) }
  }
  let n=0;
  for(const e of entries) n+=await window.__readEntry(e,dir).catch(err=>{ toast(err.message,'err'); return 0 });
  if(n) toast('已导入 '+n+' 个文件','ok');
  if(window.__explorerRefresh) window.__explorerRefresh();
  return n;
};
window.__uploadTo=(dir)=>{
  const inp=$('#filePick');
  inp.value='';
  inp.onchange=async()=>{ await window.__importFiles(inp.files,dir); if(window.__explorerRefresh) window.__explorerRefresh(); Desktop.render() };
  inp.click();
};

async function htmlOpenDialog(path){
  const name=fs.basename(path);
  const r=await showModal({
    title:name,
    html:'<div>这是一个网页文件。请选择要执行的操作，右侧可随时在代码编辑器中实时预览。</div>',
    buttons:[
      {label:'取消'},
      {label:'编辑源代码', cls:'', value:'edit'},
      {label:'在浏览器中打开', cls:'pri', value:'browse'}
    ]
  });
  if(r==='browse') openApp('browser',{path});
  else if(r==='edit') openApp('editor',{path});
}
window.__htmlOpen=p=>openApp('browser',{path:p});
window.__codeEdit=p=>openApp('editor',{path:p});
window.__openPath=async(path)=>{
  let st;
  try{ st=await fs.stat(path) }catch(e){ toast('无法访问：'+e.message,'err'); return }
  if(st.isDir) return openApp('explorer',{path});
  const e=st.ext;
  if(IMG_EXT.includes(e)) return openApp('viewer',{path});
  if(AUD_EXT.includes(e)||VID_EXT.includes(e)) return openApp('media',{path});
  if(['html','htm'].includes(e)) return htmlOpenDialog(path);
  if(['css','js','mjs','json','md','xml','svg','yaml','yml','ts','tsx','jsx'].includes(e)) return openApp('editor',{path});
  if(['csv','tsv'].includes(e)) return openApp('notepad',{path,sheet:true});
  if(e==='pdf') return openApp('pdf',{path});
  if(['zip','gz','tgz','tar'].includes(e)) return openApp('archive',{path});
  return openApp('notepad',{path,raw:true});
};

    function bindItem(el,it){
      el.addEventListener('click',e=>{

        if(e.ctrlKey||e.metaKey||e.shiftKey){ el.classList.toggle('sel'); syncSel(); return }
        $$('.row.sel,.gitem.sel',wrap).forEach(x=>{ if(x!==el) x.classList.remove('sel') });

        if(Prefs.get('singleClick',true)) openPath(it.path);

      el.addEventListener('dblclick',e=>{ e.stopPropagation(); openPath(it.path) });
      el.addEventListener('contextmenu',e=>{ e.preventDefault(); e.stopPropagation(); itemMenu(e,it,el) });
      el.addEventListener('dragstart',e=>dragStart(e,it,el));

      $$('.row',wrap).forEach(el=>{
        const it=st.items.find(i=>i.path===el.dataset.path)||{name:el.dataset.name,path:el.dataset.path,isDir:false,size:0};

      });
      // 列宽拖拽 + 列顺序
      $$('.ch',wrap).forEach(ch=>{
        const grip=$('.grip',ch);
        if(grip) grip.addEventListener('pointerdown',e=>{
          e.preventDefault(); e.stopPropagation();
          const i=parseInt(grip.dataset.grip,10), sx=e.clientX, w0=st.cols[i].w;
          const mv=ev=>{ st.cols[i].w=Math.max(64,w0+ev.clientX-sx); renderList() };
          const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up) };
          document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
        });
        ch.addEventListener('click',e=>{
          if(e.target.classList.contains('grip')) return;
          const k=ch.dataset.col;
          if(st.sort.key===k) st.sort.dir*=-1; else { st.sort.key=k; st.sort.dir=1 }
          Prefs.set('expSort',st.sort.key); Prefs.set('expSortDir',st.sort.dir);
          api.refresh();
        });
        ch.draggable=true;
        ch.addEventListener('dragstart',e=>{
          e.stopPropagation();
          e.dataTransfer.setData('application/x-xy-col',ch.dataset.i);
          e.dataTransfer.effectAllowed='move';
        });
        ch.addEventListener('dragover',e=>{ if(e.dataTransfer.types.includes('application/x-xy-col')) e.preventDefault() });
        ch.addEventListener('drop',e=>{
          e.preventDefault(); e.stopPropagation();
          const from=parseInt(e.dataTransfer.getData('application/x-xy-col'),10);
          const to=parseInt(ch.dataset.i,10);
          if(isNaN(from)||from===to) return;
          const c=st.cols.splice(from,1)[0]; st.cols.splice(to,0,c);
          renderList();
        });
      });
    }
    function syncSel(){
      st.sel.clear();
      $$('.row.sel,.gitem.sel',wrap).forEach(el=>st.sel.add(el.dataset.path));
      renderStatus(st.items);
    }
    function dragStart(e,it,el){
      el.classList.add('dragging');
      const sel=$$('.row.sel,.gitem.sel',wrap).map(x=>x.dataset.path);
      const paths=sel.length&&sel.includes(it.path)?sel:[it.path];
      try{
        e.dataTransfer.setData('application/x-xy-paths',JSON.stringify(paths));
        e.dataTransfer.effectAllowed='copyMove';
        const blob=window.__dragCache.get(it.path);
        if(blob){
          const f=new File([blob],it.name,{type:blob.type||mimeOf(it.name)});
          e.dataTransfer.items.add(f);
          const url=URL.createObjectURL(blob);
          e.dataTransfer.setData('DownloadURL',(blob.type||mimeOf(it.name))+':'+it.name+':'+url);
          setTimeout(()=>URL.revokeObjectURL(url),8000);
        }
      }catch(err){}
    }
    function itemMenu(e,it,el){
      if(!el.classList.contains('sel')){ $$('.row.sel,.gitem.sel',wrap).forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); syncSel() }
      const paths=[...st.sel];
      const isHtml=['html','htm'].includes(it.ext);
      showCtx(e.clientX,e.clientY,[
        {label:'打开', icon:'folder', fn:()=>openPath(it.path)},

      let html='<table><thead><tr>';
      for(let i=0;i<cols;i++) html+='<th>'+(rows[0][i]!==undefined?esc(rows[0][i]):'')+'</th>';
      html+='</tr></thead><tbody>';

        for(let c=0;c<cols;c++) html+='<td>'+esc(rows[r][c]!==undefined?rows[r][c]:'')+'</td>';
        html+='</tr>';
      }
      html+='</tbody></table>';
      sheet.innerHTML=html;
    }
    $$('[data-a]',body).forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='save') save();
      else if(a==='undo') doUndo();
      else if(a==='redo') doRedo();

      else if(a==='fontdown'){ fontSize=Math.max(9,fontSize-1); ta.style.fontSize=fontSize+'px'; Prefs.set('padFont',fontSize) }
      else if(a==='copyall'){ navigator.clipboard&&navigator.clipboard.writeText(ta.value); toast('已复制全部内容','ok') }

      else if(a==='clear'){ ta.value=''; ta.dispatchEvent(new Event('input')) }
    });
    $$('[data-m]',body).forEach(b=>b.onclick=()=>{
      $$('[data-m]',body).forEach(x=>x.classList.remove('on')); b.classList.add('on');
      const m=b.dataset.m==='sheet';

    });
    (async()=>{
      if(st.path){
        try{ ta.value=await fs.readText(st.path) }catch(e){ toast('读取失败：'+e.message,'err') }
      }else ta.value=opts.text||'';
      st.hist=[ta.value]; st.hi=0;

      setStatus();
      if(isTable&&st.sheet){ const b=$('[data-m="sheet"]',body); b&&b.click() }
    })();
    return win;
  }
});
function parseDelimited(txt,sep){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){ cur+='"'; i++ } else q=false }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===sep){ row.push(cur); cur='' }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur='' }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur||row.length){ row.push(cur); rows.push(row) }
  return rows;
}

const CMRes={loaded:false,loading:null};
async function loadCodeMirror(){
  if(CMRes.loaded) return true;
  if(CMRes.loading) return CMRes.loading;
  CMRes.loading=(async()=>{
    const css=[
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css'
    ];
    const js=[
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js'
    ];
    css.forEach(u=>{ const l=document.createElement('link'); l.rel='stylesheet'; l.href=u; document.head.appendChild(l) });
    for(const u of js){
      await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=u; s.onload=res; s.onerror=rej; document.head.appendChild(s); setTimeout(res,15000) });
      if(u.includes('codemirror.min.js')&&!window.CodeMirror) throw new Error('CodeMirror 加载失败');
    }
    if(!window.CodeMirror) throw new Error('CodeMirror 加载失败');
    CMRes.loaded=true; return true;
  })().catch(e=>{ CMRes.loading=null; throw e });
  return CMRes.loading;
}
function cmModeFor(path,lang){
  const e=fs.ext(path||'');
  if(lang) return lang;
  const m={html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',mjs:'javascript',json:'application/json',md:'markdown',markdown:'markdown',xml:'xml',svg:'xml',yaml:'text/x-yaml',txt:'text/plain'};
  return m[e]||'htmlmixed';
}
function langLabel(mode){
  const m={'htmlmixed':'HTML','css':'CSS','javascript':'JavaScript','application/json':'JSON','markdown':'Markdown','xml':'XML','text/plain':'纯文本','text/x-yaml':'YAML'};
  return m[mode]||String(mode).toUpperCase();
}
function prettyPrint(code,mode){
  // 轻量格式化：缩进对齐，光标按行比例恢复
  if(mode==='javascript'||mode==='application/json'||mode==='css'){
    let out='', ind=0, i=0;
    const src=code.replace(/\r/g,'');
    let line='', inStr=null;
    for(;i<src.length;i++){
      const c=src[i];
      if(inStr){ line+=c; if(c===inStr&&src[i-1]!=='\\') inStr=null; continue }
      if(c==='"'||c==="'"||c==='`'){ inStr=c; line+=c; continue }
      if(c==='{'){ line+='{'; out+='  '.repeat(ind)+line.trim()+'\n'; ind++; line='' }
      else if(c==='}'){
        if(line.trim()) out+='  '.repeat(ind)+line.trim()+'\n';
        ind=Math.max(0,ind-1); out+='  '.repeat(ind)+'}\n'; line='';
      }
      else if(c===';'){ line+=';'; out+='  '.repeat(ind)+line.trim()+'\n'; line='' }
      else if(c==='\n'){ if(line.trim()) out+='  '.repeat(ind)+line.trim()+'\n'; line='' }
      else line+=c;
    }
    if(line.trim()) out+='  '.repeat(ind)+line.trim()+'\n';
    return out.trim();
  }
  // HTML / XML
  let out='', ind=0;
  const toks=code.replace(/>\s*</g,'><').split(/(<[^>]*>)/).filter(t=>t.trim());
  const selfClose=/^<(img|br|hr|input|meta|link|source|path|circle|rect|use|stop|col|area|base|embed|param|track|wbr)/i;
  for(const t of toks){
    const s=t.trim();
    if(/^<\//.test(s)){ ind=Math.max(0,ind-1); out+='  '.repeat(ind)+s+'\n' }
    else if(/^<[^!]/.test(s)&&!/>\/$/.test(s)&&!selfClose.test(s)&&!/\/>$/.test(s)&&!/^(input|meta)/i.test(s)){
      out+='  '.repeat(ind)+s+'\n';
      if(!/\/>$/.test(s)) ind++;
    }
    else out+='  '.repeat(ind)+s+'\n';
  }
  return out.trim();
}

        '<button class="tb" data-f="rep">替换</button><button class="tb" data-f="repall">全部替换</button>'+
        '<span class="tag" data-f="count">0 处匹配</span><div class="spacer"></div>'+
        '<button class="tb" data-f="close">'+icon('x',14)+'关闭</button>'+
      '</div>'+
      '<div class="splitHost" style="flex:1;min-height:0;display:flex">'+
        '<div class="cm-holder"><div class="cm-mount" style="position:absolute;inset:0"><textarea class="fallbackTA" spellcheck="false"></textarea></div></div>'+
        '<div class="splitter"></div>'+
        '<div class="preview-pane"><div class="pveil"><div style="text-align:center"><div class="loadring" style="margin:0 auto 10px"></div><div class="tag">正在渲染预览</div></div></div><iframe sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe></div>'+
      '</div>'+
      '<div class="statusbar">'+
        '<span data-s="pos">行 1, 列 1</span><span data-s="sel"></span><span data-s="lines">1 行</span>'+
        '<span data-s="chars">0 字符</span><span data-s="lang">HTML</span><span>UTF-8</span>'+
        '<div class="spacer"></div><span data-s="path">'+esc(st.path||'未保存')+'</span>'+
      '</div>';
    const host=$('.cm-mount',body), ta=$('.fallbackTA',body), iframe=$('.preview-pane iframe',body);
    const veil=$('.pveil',body);
    const getValue=()=>st.cm?st.cm.getValue():ta.value;
    const setValue=v=>{ st.cm?st.cm.setValue(v):(ta.value=v) };

    function refreshPreview(){
      const v=getValue();
      veil.classList.remove('hide');
      iframe.srcdoc=v;
    }
    iframe.addEventListener('load',()=>setTimeout(()=>veil.classList.add('hide'),140));
    const autoPreview=debounce(()=>{ if(st.view!=='code') refreshPreview() },700);

    function updateStatus(){
      let pos='行 1, 列 1', sel='', lines=1, chars=getValue().length;
      if(st.cm){
        const c=st.cm.getCursor();
        pos='行 '+(c.line+1)+', 列 '+(c.ch+1);
        const s=st.cm.getSelection();
        if(s) sel='已选 '+s.length+' 字符';
        lines=st.cm.lineCount();
      }else{
        const before=ta.value.slice(0,ta.selectionStart);
        pos='行 '+(before.split('\n').length)+', 列 '+(before.length-before.lastIndexOf('\n'));
        const s=ta.value.slice(ta.selectionStart,ta.selectionEnd);
        if(s) sel='已选 '+s.length+' 字符';
        lines=ta.value.split('\n').length;

      $('[data-s="sel"]',body).textContent=sel;
      $('[data-s="lines"]',body).textContent=lines+' 行';
      $('[data-s="chars"]',body).textContent=chars+' 字符';
      $('[data-s="lang"]',body).textContent=langLabel(st.mode);
      $('[data-s="path"]',body).textContent=st.path||'未保存';
    }
    async function save(){
      const v=getValue();
      if(!st.path) st.path=fs.join(st.dir,'未命名.'+(st.mode==='css'?'css':st.mode==='javascript'?'js':st.mode==='application/json'?'json':st.mode==='markdown'?'md':'html'));
      try{
        await fs.writeText(st.path,v,{mtime:Date.now()});

    function applyView(){
      const holder=$('.cm-holder',body), prev=$('.preview-pane',body), sp=$('.splitter',body), hostEl=$('.splitHost',body);
      hostEl.style.flexDirection=st.splitDir==='v'?'column':'row';
      sp.style.width=st.splitDir==='v'?'auto':'5px';
      sp.style.height=st.splitDir==='v'?'5px':'auto';
      sp.style.cursor=st.splitDir==='v'?'row-resize':'col-resize';
      if(st.view==='code'){ holder.style.display='flex'; holder.style.flex='1'; prev.style.display='none'; sp.style.display='none' }
      else if(st.view==='preview'){ prev.style.display='flex'; prev.style.flex='1'; holder.style.display='none'; sp.style.display='none' }
      else { holder.style.display='flex'; holder.style.flex='1 1 50%'; prev.style.display='flex'; prev.style.flex='1 1 50%'; sp.style.display='block' }
      $$('[data-view]',body).forEach(b=>b.classList.toggle('on',b.dataset.view===st.view));
      st.cm&&st.cm.refresh();
    }
    function setLang(m){
      st.mode=m;
      $('[data-a="lang"]',body).value=m;

    // 分割条拖拽
    $('.splitter',body).addEventListener('pointerdown',e=>{
      e.preventDefault();
      const hostEl=$('.splitHost',body), holder=$('.cm-holder',body), prev=$('.preview-pane',body);
      const r=hostEl.getBoundingClientRect();
      const mv=ev=>{
        const ratio=st.splitDir==='v'?clamp((ev.clientY-r.top)/r.height,.15,.85):clamp((ev.clientX-r.left)/r.width,.15,.85);
        holder.style.flex='0 0 '+(ratio*100)+'%'; prev.style.flex='1';
        st.cm&&st.cm.refresh();
      };
      const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up) };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });

    // 查找替换
    const fb=$('.findbar',body);
    const findNext=(back)=>{
      const q=$('[data-f="q"]',body).value; if(!q) return;
      if(st.cm){ const cur=st.cm.getSearchCursor?q:null; st.cm.execCommand&&((back?st.cm.execCommand('findPrev'):st.cm.execCommand('findNext'))) }
      else{
        const from=back?ta.selectionStart-1:ta.selectionEnd;
        const idx=ta.value.toLowerCase().indexOf(q.toLowerCase(), Math.max(0,from));
        if(idx>=0){ ta.focus(); ta.setSelectionRange(idx,idx+q.length) }
      }
    };
    $('[data-f="q"]',body).addEventListener('input',()=>{
      const q=$('[data-f="q"]',body).value.toLowerCase();

    });
    $('[data-f="close"]',body).onclick=()=>{ fb.style.display='none' };

    $('[data-f="rep"]',body).onclick=()=>{
      const q=$('[data-f="q"]',body).value, r=$('[data-f="r"]',body).value;

      else{
        const s=ta.value.slice(ta.selectionStart,ta.selectionEnd);
        if(s.toLowerCase()===q.toLowerCase()){ const st0=ta.selectionStart; ta.setRangeText(r,st0,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input')) }
      }
    };
    $('[data-f="repall"]',body).onclick=()=>{
      const q=$('[data-f="q"]',body).value, r=$('[data-f="r"]',body).value;
      if(!q) return;
      const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');

    };

    const actions={
      save, undo(){ st.cm?st.cm.undo():(document.execCommand&&document.execCommand('undo')) }, redo(){ st.cm?st.cm.redo():(document.execCommand&&document.execCommand('redo')) },
      format(){

        toast('已格式化','ok'); autoPreview(); updateStatus();
      },
      find(){ fb.style.display=fb.style.display==='none'?'flex':'none'; if(fb.style.display==='flex') $('[data-f="q"]',body).focus() },
      import(){
        const inp=document.createElement('input'); inp.type='file';
        inp.onchange=async()=>{

        const def=(st.path?fs.basename(st.path):'导出.'+(names[st.mode]||'txt'));
        promptModal({title:'导出文件',value:def,okText:'下载'}).then(n=>{
          if(n) download(new Blob([getValue()],{type:'text/plain'}),n);
        });
      },
      exportv(){
        const names={htmlmixed:'html',css:'css',javascript:'js','application/json':'json',markdown:'md',xml:'xml','text/plain':'txt'};
        const def=(st.path?fs.basename(st.path):'导出.'+(names[st.mode]||'txt'));
        promptModal({title:'存入虚拟文件系统',value:def,okText:'保存'}).then(async n=>{
          if(!n) return;

          st.path=p; win.setTitle(fs.basename(p),'已保存');
          toast('已存入 '+p,'ok'); Desktop.render(); if(window.__explorerRefresh) window.__explorerRefresh();
        });
      },
      copyall(){ navigator.clipboard&&navigator.clipboard.writeText(getValue()); toast('已复制全部代码','ok') },
      clear(){ setValue(''); autoPreview(); updateStatus() },
      newwin(){
        const blob=new Blob([getValue()],{type:'text/html'});
        window.open(URL.createObjectURL(blob),'_blank');
        setTimeout(()=>{},0);
      },
      refresh(){ refreshPreview() }
    };
    $$('[data-a]',body).forEach(b=>{
      const a=b.dataset.a;
      if(a==='lang'){ b.value=st.mode; b.onchange=()=>{ setLang(b.value); autoPreview() }; return }
      if(a==='inputmode'){ b.value='auto'; b.onchange=()=>{
        st.inputMode=b.value;
        const opt=b.value==='auto'?{}:{inputStyle:b.value};
        if(st.cm){ st.cm.setOption('inputStyle',opt.inputStyle||undefined); st.cm.toTextArea&&null; st.cm.refresh() }
        toast('输入模式：'+b.options[b.selectedIndex].text);
      }; return }
      if(a==='splitdir'){ b.onchange=()=>{ st.splitDir=b.value; applyView() }; return }
      b.onclick=()=>actions[a]&&actions[a]();
    });
    $$('[data-view]',body).forEach(b=>b.onclick=()=>{ st.view=b.dataset.view; applyView(); if(st.view!=='code') refreshPreview() });

    (async()=>{
      try{
        await loadCodeMirror();
        st.cm=CodeMirror.fromTextArea(ta,{
          value:'', mode:st.mode, theme:'material-darker',
          lineNumbers:true, lineWrapping:true, styleActiveLine:true, matchBrackets:true,
          indentUnit:2, tabSize:2, autofocus:false
        });
        st.cm.on('change',()=>{ updateStatus(); autoPreview() });
        st.cm.on('cursorActivity',updateStatus);
        st.cm.setOption('extraKeys',{'Ctrl-S':()=>save(),'Cmd-S':()=>save()});
      }catch(e){
        toast('CodeMirror 加载失败，已切换到内置编辑器','err');
        ta.style.display='block';
        ta.addEventListener('input',()=>{ updateStatus(); autoPreview() });
        ta.addEventListener('keyup',updateStatus); ta.addEventListener('click',updateStatus);
      }
      if(opts.text!==undefined) setValue(opts.text);
      else if(st.path){ try{ setValue(await fs.readText(st.path)) }catch(e){ toast('读取失败：'+e.message,'err') } }
      else setValue('<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>新页面</title>\n  <style>\n    body { font-family: sans-serif; padding: 24px; }\n  </style>\n</head>\n<body>\n  <h1>你好，玄岩台</h1>\n  <script>\n    console.log("hello");\n  <\/script>\n</body>\n</html>\n');
      setLang(st.mode);
      applyView();
      updateStatus();
      setTimeout(()=>{ refreshPreview(); st.cm&&st.cm.refresh() },120);
    })();
    win.onResize=()=>{ st.cm&&st.cm.refresh() };
    win.onClose=()=>{ if(st.cm){ try{ st.cm.toTextArea&&st.cm.toTextArea() }catch(e){} st.cm=null } };
    return win;
  }
});

async function loadSevenZip(){
  if(window.__SevenZip) return window.__SevenZip;
  const mod=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
  window.__SevenZip=(mod&&mod.default)||mod;
  return window.__SevenZip;
}
async function extract7z(path,dir){
  const SevenZip=await loadSevenZip();
  const sz=await SevenZip({print:()=>{},printErr:()=>{}});
  sz.FS.writeFile('/in.bin',new Uint8Array(await fs.readFile(path)));
  try{ sz.callMain(['x','/in.bin','-o/out','-y']) }catch(e){}
  let n=0;
  const walk=async(d,prefix)=>{
    for(const name of sz.FS.readdir(d)){
      if(name==='.'||name==='..') continue;
      const full=d+'/'+name;
      const node=sz.FS.stat(full);
      const target=fs.join(dir,prefix?prefix+'/'+name:name);
      if(sz.FS.isDir(node.mode)){ await fs.mkdir(target).catch(()=>{}); await walk(full,prefix?prefix+'/'+name:name) }
      else{
        await fs.mkdir(pathUtil.dirname(target)).catch(()=>{});
        const data=sz.FS.readFile(full);
        await fs.writeFile(target,data,{mtime:node.mtime?node.mtime*1000:Date.now()});
        n++;
      }
    }
  };
  await walk('/out','');
  return n;
}
window.__extract=async(path,dest,forceDir)=>{
  toast('正在解压…');
  try{
    const ext=fs.ext(path);
    const dir=forceDir?dest:dest;
    await fs.mkdir(dir).catch(()=>{});
    let count=0;
    const write=async(name,data,mtime)=>{
      const p=fs.join(dir,name);
      await fs.mkdir(pathUtil.dirname(p)).catch(()=>{});
      await fs.writeFile(p,data,{mtime:mtime||Date.now()});
      count++;
    };
    if(ext==='zip'){
      const JSZip=await loadJSZip();
      const zip=await JSZip.loadAsync(await fs.readFile(path));
      for(const f of Object.values(zip.files)){
        if(f.dir){ await fs.mkdir(fs.join(dir,f.name)).catch(()=>{}) ; continue }
        // JSZip 把 DOS 时间按 UTC 解析，这里修正回本地时区，保留原始修改时间
        const d=f.date;
        const mtime=d?(new Date(d.getTime()+new Date().getTimezoneOffset()*60000)).getTime():Date.now();
        await write(f.name, await f.async('arraybuffer'), mtime);
      }
    }else if(ext==='gz'||ext==='tgz'){
      const raw=await gzipDecode(await fs.readFile(path));
      if(ext==='tgz'){ for(const e of parseTar(raw)) e.isDir?await fs.mkdir(fs.join(dir,e.name)).catch(()=>{}):await write(e.name,e.data,e.mtime) }
      else await write(fs.basename(path).replace(/\.gz$/i,''),raw,Date.now());
    }else if(['7z','rar','xz','bz2','zst','cab','iso','jar','apk','deb'].includes(ext)){
      count=await extract7z(path,dir);
    }else{
      for(const e of parseTar(await fs.readFile(path))) e.isDir?await fs.mkdir(fs.join(dir,e.name)).catch(()=>{}):await write(e.name,e.data,e.mtime);
    }
    toast('解压完成，共 '+count+' 个文件','ok');
    Desktop.render(); if(window.__explorerRefresh) window.__explorerRefresh();
  }catch(e){ toast('解压失败：'+e.message,'err') }
};

/* ================= 漫画阅读器 / 图片查看器 ================= */
registerApp('viewer',{
  name:'漫画阅读器', icon:'image', desc:'Viewer',
  launch(opts={}){
    const win=WM.open({app:'viewer',title:fs.basename(opts.path||'图片'),icon:'image',sub:'Webtoon Viewer',width:880,height:700});
    const body=win.body;
    body.innerHTML=
      '<div class="toolbar" data-role="chrome">'+
        '<button class="tb" data-a="zoomout">'+icon('zoomout',15)+'缩小</button>'+
        '<button class="tb" data-a="fit">适应宽度</button>'+
        '<button class="tb" data-a="zoomin">'+icon('zoomin',15)+'放大</button>'+
        '<button class="tb" data-a="top">'+icon('up',15)+'回到顶部</button>'+
        '<div class="spacer"></div>'+
        '<button class="tb" data-a="dl">'+icon('download',15)+'导出本页</button>'+
        '<button class="tb" data-a="fs">'+icon('fullscreen',15)+'全屏阅读</button>'+
      '</div>'+
      '<div class="mangawrap"><div class="mlist"></div></div>'+
      '<div class="statusbar" data-role="chrome"><span data-s="idx">—</span><span data-s="load">准备中…</span>'+
      '<div class="spacer"></div><span data-s="zoom">适应宽度</span></div>';
    const wrap=$('.mangawrap',body), list=$('.mlist',body);
    const st={imgs:[], zoom:0, loaded:0};
    const FRICTION=0.96;

    (async()=>{
      let items=[];
      try{ items=await fs.listImages(pathUtil.dirname(opts.path)) }catch(e){ toast('目录读取失败：'+e.message,'err'); return }
      if(!items.length) items=[{path:opts.path,name:fs.basename(opts.path)}];
      st.imgs=items;
      $('[data-s="load"]',body).textContent='共 '+items.length+' 张 · 并行读取中';
      // 骨架占位（按固有宽高比在加载后补偿高度）
      list.innerHTML=items.map((it,i)=>'<div class="mpage" data-i="'+i+'"><div class="ph" style="height:0;min-height:220px"></div></div>').join('');
      // 并行读取，按序插入
      const results=new Array(items.length);
      let done=0;
      await Promise.all(items.map(async(it,i)=>{
        try{
          const b=await fs.readBlob(it.path);
          results[i]={url:URL.createObjectURL(b), name:it.name};
        }catch(e){ results[i]={err:true,name:it.name} }
        done++;
        $('[data-s="load"]',body).textContent='已读取 '+done+' / '+items.length;
      }));
      results.forEach((r,i)=>{
        const slot=$('.mpage[data-i="'+i+'"]',list);
        if(!slot) return;
        if(r&&r.err){ slot.innerHTML='<div style="color:#666;padding:40px;font-family:monospace">'+esc(r.name)+' 读取失败</div>'; return }
        const img=new Image();
        img.alt=r.name;
        img.src=r.url;
        img.onload=()=>{
          const w=slot.clientWidth||760;
          const ratio=img.naturalHeight/img.naturalWidth;
          const prevH=slot.offsetHeight;
          slot.innerHTML=''; slot.appendChild(img);
          const newH=img.offsetHeight||w*ratio;
          const delta=newH-prevH;
          if(delta>0 && slot.offsetTop < wrap.scrollTop) wrap.scrollTop+=delta;
          st.loaded++;
        };
        img.onerror=()=>{ slot.innerHTML='<div style="color:#666;padding:40px">'+esc(r.name)+' 渲染失败</div>' };
      });
      // 定位到用户点击的那张
      const idx=Math.max(0,items.findIndex(i=>i.path===opts.path));
      requestAnimationFrame(()=>{
        const target=$('.mpage[data-i="'+idx+'"]',list);
        if(target) wrap.scrollTop=target.offsetTop;
        $('[data-s="idx"]',body).textContent='第 '+(idx+1)+' / '+items.length+' 张 · '+items[idx].name;
      });
      wrap.addEventListener('scroll',()=>{
        const y=wrap.scrollTop+wrap.clientHeight*0.35;
        let cur=0;
        $$('.mpage',list).forEach((el,i)=>{ if(el.offsetTop<=y) cur=i });
        $('[data-s="idx"]',body).textContent='第 '+(cur+1)+' / '+st.imgs.length+' 张 · '+st.imgs[cur].name;
        win.currentIndex=cur;
      },{passive:true});
    })();
    win.currentIndex=0;

    /* 条漫拖拽 + 物理惯性 */
    let dragging=false, lastY=0, vel=0, raf=null;
    wrap.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch') return;
      dragging=true; lastY=e.clientY; vel=0;
      wrap.classList.add('dragging');
      wrap.setPointerCapture(e.pointerId);
      if(raf) cancelAnimationFrame(raf);
    });
    wrap.addEventListener('pointermove',e=>{
      if(!dragging) return;
      const dy=e.clientY-lastY; lastY=e.clientY; vel=dy;
      wrap.scrollTop-=dy;
      e.preventDefault();
    });
    const release=e=>{
      if(!dragging) return;
      dragging=false; wrap.classList.remove('dragging');
      try{ wrap.releasePointerCapture(e.pointerId) }catch(err){}
      const glide=()=>{
        if(Math.abs(vel)<0.4) return;
        wrap.scrollTop-=vel; vel*=FRICTION;
        raf=requestAnimationFrame(glide);
      };
      raf=requestAnimationFrame(glide);
    };
    wrap.addEventListener('pointerup',release);
    wrap.addEventListener('pointercancel',release);

    const setZoom=z=>{
      st.zoom=z;
      $$('.mpage img',list).forEach(img=>{
        img.style.maxWidth = z<=0 ? '860px' : (z*100)+'%';
        img.style.width = z<=0 ? '100%' : 'auto';
      });
      $('[data-s="zoom"]',body).textContent=z<=0?'适应宽度':Math.round(z*100)+'%';
    };
    const toggleFS=async()=>{
      const on=!wrap.classList.contains('fs');
      wrap.classList.toggle('fs',on);
      $$('[data-role="chrome"]',body).forEach(el=>el.style.display=on?'none':'');
      let exit=$('.fs-exit',body);
      if(on){
        if(!exit){
          exit=document.createElement('button'); exit.className='fs-exit show'; exit.innerHTML=icon('x',18);
          exit.onclick=()=>toggleFS();
          document.body.appendChild(exit);
          win.fsExit=exit;
        }
        exit.classList.add('show');
        try{ await win.el.requestFullscreen() }catch(e){}
      }else{
        exit&&exit.classList.remove('show');
        try{ if(document.fullscreenElement) await document.exitFullscreen() }catch(e){}
      }
    };
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement && wrap.classList.contains('fs')){
        wrap.classList.remove('fs');
        $$('[data-role="chrome"]',body).forEach(el=>el.style.display='');
        win.fsExit&&win.fsExit.classList.remove('show');
      }
    });
    $('[data-a="zoomin"]',body).onclick=()=>setZoom(st.zoom<=0?1.25:st.zoom+0.25);
    $('[data-a="zoomout"]',body).onclick=()=>setZoom(Math.max(0.25,(st.zoom<=0?1:st.zoom)-0.25));
    $('[data-a="fit"]',body).onclick=()=>setZoom(0);
    $('[data-a="top"]',body).onclick=()=>wrap.scrollTo({top:0,behavior:'smooth'});
    $('[data-a="fs"]',body).onclick=toggleFS;
    $('[data-a="dl"]',body).onclick=()=>{
      const i=win.currentIndex||0;
      const it=st.imgs[i]; if(!it) return;
      fs.readBlob(it.path).then(b=>download(b,it.name));
    };
    win.onClose=()=>{ win.fsExit&&win.fsExit.remove(); st.imgs.forEach(()=>{}) };
    return win;
  }
});

      if(media.paused){ media.play(); $('[data-a="play"]',body).innerHTML=icon('pause',16)+'暂停' }
      else{ media.pause(); $('[data-a="play"]',body).innerHTML=icon('play',16)+'播放' }
    };
    $('[data-a="seek"]',body).oninput=e=>{ if(media.duration) media.currentTime=media.duration*e.target.value/1000 };
    $('[data-a="vol"]',body).oninput=e=>{ media.volume=e.target.value/100 };
    const speeds=[0.5,0.75,1,1.25,1.5,2]; let si=2;
    $('[data-a="speed"]',body).onclick=e=>{ si=(si+1)%speeds.length; media.playbackRate=speeds[si]; e.currentTarget.textContent=speeds[si].toFixed(2)+'×' };
    const fsBtn=$('[data-a="fs"]',body);
    if(fsBtn) fsBtn.onclick=()=>{ media.requestFullscreen?media.requestFullscreen():toast('当前浏览器不支持全屏','err') };
    win.onClose=()=>{ try{ media.pause(); media.src='' }catch(e){} };
    return win;
  }
});
