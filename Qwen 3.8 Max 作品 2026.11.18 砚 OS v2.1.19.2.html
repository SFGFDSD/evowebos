<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>砚 OS · INKSTONE — 浏览器桌面环境</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   砚 OS · INKSTONE  —  Design tokens
   ============================================================ */
:root{
  --font-display:'Bricolage Grotesque','Noto Sans SC',system-ui,sans-serif;
  --font-ui:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','Noto Sans SC',ui-monospace,monospace;

  --acc:#f2b544;          /* citrine 灯焰 */
  --acc-ink:#2a1d05;
  --acc2:#3fc7b0;         /* 青瓷 */
  --acc3:#e2705a;         /* 赭石 */
  --acc-soft:rgba(242,181,68,.14);
  --acc-line:rgba(242,181,68,.34);

  --radius:10px;
  --radius-sm:7px;
  --radius-win:10px;
  --tb-h:54px;
  --shadow-1:0 2px 6px rgba(0,0,0,.28);
  --shadow-2:0 14px 40px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 40px 90px rgba(0,0,0,.6);
  --dur:.22s;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
html[data-theme="dark"]{
  --bg-0:#0a0e11; --bg-1:#10161b; --bg-2:#151d24; --bg-3:#1b252e; --bg-4:#22303a;
  --line:#25323c; --line-2:#33454f;
  --tx-0:#e9eff3; --tx-1:#a5b6c1; --tx-2:#6d808d; --tx-3:#4d5f6b;
  --glass:rgba(16,22,27,.72);
  --glass-2:rgba(21,29,36,.86);
  --sel:rgba(63,199,176,.18);
  --hover:rgba(255,255,255,.055);
  --active:rgba(255,255,255,.09);
  --scrim:rgba(4,7,9,.55);
  --code-bg:#212121;
}
html[data-theme="light"]{
  --bg-0:#dfe5e9; --bg-1:#eef2f5; --bg-2:#ffffff; --bg-3:#f2f5f7; --bg-4:#e6ecf0;
  --line:#d2dbe2; --line-2:#b9c6cf;
  --tx-0:#0e171d; --tx-1:#3d4e5a; --tx-2:#657783; --tx-3:#8b9aa4;
  --glass:rgba(255,255,255,.78);
  --glass-2:rgba(255,255,255,.92);
  --acc-soft:rgba(181,122,18,.12);
  --acc-line:rgba(181,122,18,.4);
  --sel:rgba(15,139,120,.16);
  --hover:rgba(14,23,29,.05);
  --active:rgba(14,23,29,.09);
  --scrim:rgba(220,228,233,.5);
  --shadow-2:0 14px 40px rgba(20,35,45,.18),0 2px 8px rgba(20,35,45,.1);
  --shadow-3:0 40px 90px rgba(20,35,45,.25);
  --code-bg:#f7f9fa;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--font-ui);color:var(--tx-0);background:var(--bg-0);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:14px;line-height:1.5;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--acc2)}
svg{display:block}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:14px;height:14px}
.i.lg{width:22px;height:22px}
.i.xl{width:30px;height:30px}
::selection{background:var(--sel)}
/* scrollbars */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tx-3);background-clip:content-box;border:3px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
.mono{font-family:var(--font-mono)}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   Shell · wallpaper · desktop
   ============================================================ */
#os{position:fixed;inset:0;overflow:hidden;isolation:isolate}
#wall{position:absolute;inset:0;z-index:0;background:var(--bg-0);transition:opacity .5s var(--ease)}
#wallArt{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .45s var(--ease)}
.wall-grain{position:absolute;inset:0;opacity:.4;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>")}
.wall-vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 8%,transparent 40%,rgba(0,0,0,.42) 100%)}
html[data-theme="light"] .wall-vig{background:radial-gradient(120% 90% at 50% 8%,transparent 45%,rgba(30,45,55,.16) 100%)}

#desktop{position:absolute;inset:0 0 var(--tb-h) 0;z-index:1;overflow:hidden;touch-action:manipulation}
#iconLayer{position:absolute;inset:0}
.dicon{
  position:absolute;width:92px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border-radius:var(--radius-sm);cursor:default;user-select:none;-webkit-user-select:none;
  transition:background .14s,transform .28s var(--ease-out),box-shadow .2s;will-change:transform,left,top;
  text-align:center;
}
.dicon.moving{transition:none !important}
.dicon:hover{background:var(--hover)}
.dicon.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--acc-line)}
.dicon.dragover{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.dicon .dglyph{width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.dicon .dglyph svg{width:40px;height:40px}
.dicon .dname{
  font-size:12px;line-height:1.3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.5);
  max-width:88px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;
}
html[data-theme="light"] .dicon .dname{color:#0d1418;text-shadow:0 1px 2px rgba(255,255,255,.8)}
.dicon .dbadge{position:absolute;top:2px;right:4px;font-size:9px;letter-spacing:.04em;padding:1px 4px;border-radius:4px;
  background:rgba(0,0,0,.5);color:var(--acc);font-family:var(--font-mono);border:1px solid rgba(255,255,255,.14)}
.dicon.opening{animation:iconPop .38s var(--ease-out)}
@keyframes iconPop{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
#desktop.renaming .dname{display:none}
.icon-rename{position:absolute;width:88px;font-size:12px;text-align:center;background:var(--bg-2);color:var(--tx-0);
  border:1px solid var(--acc);border-radius:4px;padding:1px 3px;outline:none;z-index:5}

#marquee{position:absolute;pointer-events:none;z-index:60;border:1px solid var(--acc);
  background:linear-gradient(0deg,var(--acc-soft),var(--acc-soft));border-radius:3px;opacity:0;transition:opacity .1s}
#marquee.on{opacity:1}
.snap-preview{position:absolute;z-index:59;pointer-events:none;border-radius:var(--radius-win);
  border:1.5px solid var(--acc);background:var(--acc-soft);opacity:0;transform:scale(.94);
  transition:opacity .16s,transform .2s var(--ease-out),left .16s var(--ease-out),top .16s var(--ease-out),width .16s var(--ease-out),height .16s var(--ease-out);
  backdrop-filter:blur(3px)}
.snap-preview.on{opacity:1;transform:scale(1)}
#dropHint{position:absolute;inset:14px;z-index:58;border:2px dashed var(--acc);border-radius:16px;
  display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.25)}
#dropHint.on{opacity:1}
#dropHint span{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--acc);letter-spacing:.02em;
  background:var(--glass-2);padding:10px 20px;border-radius:99px;border:1px solid var(--acc-line)}

/* ============================================================
   Taskbar / dock
   ============================================================ */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);z-index:9000;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid var(--line);
}
#taskbar.hidden-tb{transform:translateY(102%)}
#taskbar{transition:transform .3s var(--ease)}
#startBtn{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 14px 0 11px;border-radius:9px;
  background:linear-gradient(160deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#c96a1f));
  color:var(--acc-ink);font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.03em;
  box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .16s var(--ease-out),filter .16s,box-shadow .2s;flex:none;
}
#startBtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
#startBtn:active{transform:translateY(0) scale(.97)}
#startBtn .brand{width:20px;height:20px}
#startBtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
#taskItems{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:2px 0}
#taskItems::-webkit-scrollbar{height:0}
.titem{
  position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 11px;border-radius:8px;
  color:var(--tx-1);background:transparent;border:1px solid transparent;flex:none;max-width:190px;
  transition:background .16s,color .16s,transform .16s var(--ease-out),border-color .16s;
}
.titem:hover{background:var(--hover);color:var(--tx-0);transform:translateY(-1px)}
.titem svg{width:18px;height:18px}
.titem .tlabel{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem.active{background:var(--active);color:var(--tx-0);border-color:var(--line-2)}
.titem.active::after{content:"";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
  width:18px;height:2.5px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.titem.min::after{background:var(--tx-3);box-shadow:none;width:10px}
.titem .cnt{font-family:var(--font-mono);font-size:10px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:5px;padding:0 4px;color:var(--tx-2)}
#tray{display:flex;align-items:center;gap:4px;flex:none}
.tray-btn{display:grid;place-items:center;width:34px;height:36px;border-radius:8px;color:var(--tx-1);transition:.15s}
.tray-btn:hover{background:var(--hover);color:var(--tx-0)}
#clockBtn{width:auto;padding:0 10px;height:40px;border-radius:8px;display:flex;flex-direction:column;align-items:flex-end;
  justify-content:center;gap:1px;color:var(--tx-1);line-height:1.15;transition:.15s}
#clockBtn:hover{background:var(--hover);color:var(--tx-0)}
#clockTime{font-family:var(--font-mono);font-size:13.5px;font-weight:600;letter-spacing:.02em;color:var(--tx-0)}
#clockDate{font-size:10.5px;color:var(--tx-2)}
#peekBtn{width:12px;height:40px;border-radius:5px;border:1px solid var(--line);background:var(--hover);margin-left:2px}
#peekBtn:hover{background:var(--acc-soft);border-color:var(--acc-line)}

/* ============================================================
   Start menu
   ============================================================ */
#startMenu{
  position:absolute;left:10px;bottom:calc(var(--tb-h) + 10px);width:min(560px,calc(100vw - 20px));z-index:9500;
  background:var(--glass-2);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-3);
  padding:14px;display:flex;flex-direction:column;gap:12px;
  opacity:0;transform:translateY(14px) scale(.98);pointer-events:none;
  transition:opacity .2s var(--ease),transform .28s var(--ease-out);transform-origin:bottom left;
}
#startMenu.on{opacity:1;transform:none;pointer-events:auto}
.sm-search{display:flex;align-items:center;gap:8px;background:var(--bg-1);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;transition:border-color .18s,box-shadow .18s}
.sm-search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.sm-search input{flex:1;background:none;border:0;outline:none;font-size:13.5px}
.sm-search input::placeholder{color:var(--tx-3)}
.sm-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
.sm-head h3{margin:0;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx-2)}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:6px;max-height:min(46vh,360px);overflow:auto;padding:2px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:10px;
  color:var(--tx-1);transition:background .16s,transform .18s var(--ease-out),color .16s;position:relative}
.sm-app:hover{background:var(--hover);color:var(--tx-0);transform:translateY(-2px)}
.sm-app:active{transform:scale(.96)}
.sm-app svg{width:26px;height:26px}
.sm-app span{font-size:11.5px;text-align:center;line-height:1.25}
.sm-app .tag{position:absolute;top:5px;right:6px;font-size:8.5px;font-family:var(--font-mono);color:var(--tx-3);
  border:1px solid var(--line);border-radius:4px;padding:0 3px;letter-spacing:.05em}
.sm-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:11px}
.sm-user{display:flex;align-items:center;gap:9px;min-width:0}
.sm-avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--acc2),color-mix(in srgb,var(--acc2) 45%,var(--bg-4)));color:#04120f;
  font-family:var(--font-display);font-weight:800;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.sm-user b{font-size:13px;display:block;font-weight:600}
.sm-user small{font-size:10.5px;color:var(--tx-2);font-family:var(--font-mono)}
.sm-acts{display:flex;gap:5px}
.sm-acts button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx-1);transition:.15s;border:1px solid transparent}
.sm-acts button:hover{background:var(--hover);color:var(--tx-0);border-color:var(--line)}
.sm-store{display:flex;gap:8px}
.sm-store .chip{flex:1;background:var(--bg-1);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.sm-store .chip b{display:block;font-family:var(--font-mono);font-size:11px;color:var(--tx-1);letter-spacing:.04em}
.sm-store .bar{height:4px;border-radius:3px;background:var(--bg-4);margin-top:5px;overflow:hidden}
.sm-store .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.sm-store .chip small{font-size:10px;color:var(--tx-2);font-family:var(--font-mono)}

/* ============================================================
   Calendar popover
   ============================================================ */
#calPop{position:absolute;right:10px;bottom:calc(var(--tb-h) + 10px);width:302px;z-index:9500;
  background:var(--glass-2);backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--line-2);
  border-radius:14px;box-shadow:var(--shadow-3);padding:14px;opacity:0;transform:translateY(12px) scale(.98);
  pointer-events:none;transition:opacity .2s,transform .26s var(--ease-out);transform-origin:bottom right}
#calPop.on{opacity:1;transform:none;pointer-events:auto}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-top .now{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:.01em}
.cal-top .now small{display:block;font-size:11px;color:var(--tx-2);font-weight:400;letter-spacing:.06em}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--tx-1);border:1px solid transparent}
.cal-nav button:hover{background:var(--hover);border-color:var(--line);color:var(--tx-0)}
.cal-title{font-family:var(--font-display);font-weight:700;font-size:13.5px;margin:2px 0 8px;display:flex;justify-content:space-between;align-items:center}
.cal-title em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--tx-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .dow{font-size:10px;color:var(--tx-3);text-align:center;padding:4px 0;font-family:var(--font-mono)}
.cal-cell{aspect-ratio:1;display:grid;place-items:center;font-size:12px;border-radius:8px;color:var(--tx-1);
  font-family:var(--font-mono);transition:.14s;position:relative}
.cal-cell:hover{background:var(--hover);color:var(--tx-0)}
.cal-cell.out{color:var(--tx-3);opacity:.5}
.cal-cell.today{background:var(--acc);color:var(--acc-ink);font-weight:600}
.cal-cell.sel{box-shadow:inset 0 0 0 1.5px var(--acc2)}
.cal-foot{margin-top:10px;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;
  font-size:11px;color:var(--tx-2);font-family:var(--font-mono)}

/* ============================================================
   Context menu
   ============================================================ */
#ctxMenu{position:absolute;z-index:9900;min-width:214px;background:var(--glass-2);
  backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--line-2);border-radius:11px;
  box-shadow:var(--shadow-2);padding:5px;opacity:0;transform:scale(.96);pointer-events:none;
  transition:opacity .12s,transform .16s var(--ease-out);transform-origin:top left;max-height:74vh;overflow:auto}
#ctxMenu.on{opacity:1;transform:none;pointer-events:auto}
.cmi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:7px;color:var(--tx-1);
  font-size:13px;text-align:left;transition:background .12s,color .12s;position:relative}
.cmi:hover:not(.dis){background:var(--acc-soft);color:var(--tx-0)}
.cmi.dis{opacity:.38;cursor:not-allowed}
.cmi svg{width:16px;height:16px;flex:none}
.cmi .kb{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--tx-3);letter-spacing:.03em}
.cmi .arrow{margin-left:auto;opacity:.6}
.cmi.danger:hover{background:rgba(226,112,90,.16);color:var(--acc3)}
.cmi .chk{margin-left:auto;color:var(--acc2)}
.csep{height:1px;background:var(--line);margin:4px 8px}
.clabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);padding:7px 10px 3px;
  font-family:var(--font-mono)}
.csub{position:absolute;left:100%;top:-5px;margin-left:2px;min-width:186px;background:var(--glass-2);
  backdrop-filter:blur(26px);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow-2);padding:5px;
  opacity:0;pointer-events:none;transform:translateX(-6px);transition:.16s var(--ease-out);z-index:2}
.cmi:hover>.csub{opacity:1;pointer-events:auto;transform:none}

/* ============================================================
   Modals · toasts · boot bar
   ============================================================ */
#modalLayer{position:absolute;inset:0;z-index:9800;display:none;place-items:center;background:var(--scrim);
  backdrop-filter:blur(4px);padding:20px}
#modalLayer.on{display:grid;animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(460px,100%);background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow-3);overflow:hidden;animation:modalIn .28s var(--ease-out)}
.modal.wide{width:min(720px,100%)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-1)}
.modal-h h3{margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.01em}
.modal-h svg{color:var(--acc)}
.modal-b{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:64vh;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--bg-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--bg-3);color:var(--tx-0);font-size:13px;font-weight:500;
  transition:transform .14s var(--ease-out),background .16s,border-color .16s,box-shadow .16s;white-space:nowrap}
.btn:hover{background:var(--bg-4);border-color:var(--tx-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(160deg,var(--acc),color-mix(in srgb,var(--acc) 72%,#b96a17));color:var(--acc-ink);
  border-color:transparent;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dgr{background:rgba(226,112,90,.14);border-color:rgba(226,112,90,.45);color:var(--acc3)}
.btn.dgr:hover{background:rgba(226,112,90,.24)}
.btn.gho{background:transparent;border-color:var(--line)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2);font-family:var(--font-mono)}
.inp{height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg-1);outline:none;
  font-size:13px;transition:border-color .16s,box-shadow .16s;width:100%}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx-2) 50%),linear-gradient(135deg,var(--tx-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-1);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--tx-2);transition:.15s;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--tx-0);background:var(--hover)}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:var(--bg-4);border:1px solid var(--line-2);
  transition:.22s var(--ease);flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--tx-2);
  transition:.22s var(--ease-out)}
.sw.on{background:var(--acc-soft);border-color:var(--acc)}
.sw.on::after{left:20px;background:var(--acc)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv b{font-family:var(--font-mono);font-weight:500;color:var(--tx-0)}
.kv span{color:var(--tx-2)}

#toastLayer{position:absolute;right:14px;bottom:calc(var(--tb-h) + 14px);z-index:9950;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none;max-width:min(380px,calc(100vw - 28px))}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:var(--glass-2);
  backdrop-filter:blur(20px);border:1px solid var(--line-2);border-left:3px solid var(--acc);border-radius:10px;
  padding:10px 13px;box-shadow:var(--shadow-2);font-size:12.5px;color:var(--tx-0);animation:toastIn .34s var(--ease-out);
  max-width:100%}
.toast.out{animation:toastOut .26s var(--ease) forwards}
.toast.err{border-left-color:var(--acc3)}
.toast.ok{border-left-color:var(--acc2)}
.toast svg{width:16px;height:16px;margin-top:1px}
.toast.err svg{color:var(--acc3)}.toast.ok svg{color:var(--acc2)}.toast svg{color:var(--acc)}
.toast b{display:block;font-weight:600;margin-bottom:1px}
.toast p{margin:0;color:var(--tx-1);word-break:break-word}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px) scale(.94)}}

#bootBar{position:absolute;top:0;left:0;right:0;height:2px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s}
#bootBar.on{opacity:1}
#bootBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc2),var(--acc));
  box-shadow:0 0 12px var(--acc);transition:width .3s var(--ease)}

.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--acc);border-radius:50%;
  animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.busy-line{height:2px;background:var(--line);overflow:hidden;border-radius:2px;position:relative}
.busy-line::after{content:"";position:absolute;inset:0;width:40%;background:var(--acc);border-radius:2px;
  animation:bl 1.1s var(--ease) infinite}
@keyframes bl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx-3);
  padding:40px 20px;text-align:center;height:100%}
.empty svg{width:44px;height:44px;opacity:.5}
.empty p{margin:0;font-size:13px}
.empty small{font-size:11.5px;color:var(--tx-3);font-family:var(--font-mono)}
/* ============================================================
   Windows
   ============================================================ */
#wmLayer{position:absolute;inset:0;z-index:100;pointer-events:none}
.win{
  position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:280px;min-height:150px;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius-win);
  box-shadow:var(--shadow-2);overflow:hidden;contain:layout paint;
  transition:box-shadow .2s,opacity .2s,border-color .2s;
}
.win.focused{box-shadow:var(--shadow-3);border-color:color-mix(in srgb,var(--acc) 40%,var(--line-2))}
.win.max{border-radius:0;border-color:var(--line)}
.win.opening{animation:winIn .3s var(--ease-out)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .2s var(--ease) forwards;pointer-events:none}
@keyframes winOut{to{opacity:0;transform:scale(.95) translateY(10px)}}
.win.minimizing{animation:winMin .26s var(--ease) forwards}
@keyframes winMin{to{opacity:0;transform:scale(.6) translateY(60vh)}}
.win.restoring{animation:winIn .24s var(--ease-out)}
body.peeking .win{opacity:.07 !important;filter:blur(1px)}
body.peeking .win:hover{opacity:1 !important;filter:none}
.win-head{
  height:38px;flex:none;display:flex;align-items:center;gap:9px;padding:0 0 0 12px;
  background:linear-gradient(180deg,var(--bg-3),var(--bg-1));border-bottom:1px solid var(--line);
  cursor:default;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;
}
.win.focused .win-head{background:linear-gradient(180deg,var(--bg-4),var(--bg-2))}
.win-head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--acc-line),transparent);opacity:0;transition:opacity .25s}
.win.focused .win-head::after{opacity:1}
.win-ico{width:17px;height:17px;color:var(--acc);flex:none;transition:transform .3s var(--ease-out)}
.win.focused .win-ico{transform:scale(1.06)}
.win-title{font-size:12.8px;font-weight:600;letter-spacing:.01em;color:var(--tx-1);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0}
.win.focused .win-title{color:var(--tx-0)}
.win-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--tx-3);flex:none;max-width:34%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.win-ctrls{display:flex;flex:none;height:100%}
.wc{width:40px;height:100%;display:grid;place-items:center;color:var(--tx-2);transition:background .14s,color .14s;position:relative}
.wc:hover{background:var(--hover);color:var(--tx-0)}
.wc svg{width:13px;height:13px;stroke-width:1.7}
.wc.close:hover{background:var(--acc3);color:#fff}
.wc::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:1px;background:var(--line)}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--bg-2);overflow:hidden}
.rz{position:absolute;z-index:5}
.rz-n{top:-3px;left:8px;right:8px;height:8px;cursor:ns-resize}
.rz-s{bottom:-3px;left:8px;right:8px;height:8px;cursor:ns-resize}
.rz-w{left:-3px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz-e{right:-3px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz-nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz-ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}
.rz-sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}
.rz-se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
.win.max .rz{display:none}
.win.noresize .rz{display:none}
.win-loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg-1);z-index:20;gap:12px}
.win-loading .ring{width:38px;height:38px;border:2.5px solid var(--line-2);border-top-color:var(--acc);
  border-right-color:var(--acc2);border-radius:50%;animation:sp .8s linear infinite}

/* ============================================================
   File Explorer
   ============================================================ */
.fx{display:flex;flex-direction:column;height:100%;min-height:0;--c-name:280px;--c-date:158px;--c-type:104px;--c-size:96px}
.fx-bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--bg-1);flex:none;flex-wrap:wrap}
.fx-nav{display:flex;gap:2px}
.iconbtn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--tx-2);border:1px solid transparent;
  transition:.14s;flex:none}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--tx-0);border-color:var(--line)}
.iconbtn:disabled{opacity:.32;cursor:not-allowed}
.iconbtn.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.crumb{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;height:30px;padding:0 8px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:8px;overflow-x:auto;scrollbar-width:none}
.crumb::-webkit-scrollbar{height:0}
.crumb button{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;font-size:12.5px;color:var(--tx-1);
  white-space:nowrap;transition:.14s;flex:none}
.crumb button:hover{background:var(--hover);color:var(--tx-0)}
.crumb button.cur{color:var(--tx-0);font-weight:600}
.crumb .sepi{width:12px;height:12px;color:var(--tx-3);flex:none}
.fx-search{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:8px;min-width:132px;transition:.16s;flex:none}
.fx-search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);min-width:190px}
.fx-search input{border:0;background:none;outline:none;width:100%;font-size:12.5px;min-width:40px}
.fx-search svg{color:var(--tx-3);width:14px;height:14px}
.fx-main{display:flex;flex:1;min-height:0}
.fx-side{width:216px;flex:none;border-right:1px solid var(--line);background:var(--bg-1);overflow:auto;padding:8px 6px;
  transition:width .24s var(--ease),padding .24s}
.fx-side.collapsed{width:0;padding:8px 0;overflow:hidden;border-right:0}
.side-h{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);
  padding:9px 10px 5px}
.tree-n{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;color:var(--tx-1);font-size:12.5px;
  cursor:default;transition:background .13s,color .13s;position:relative;user-select:none}
.tree-n:hover{background:var(--hover);color:var(--tx-0)}
.tree-n.cur{background:var(--acc-soft);color:var(--acc);font-weight:600}
.tree-n.cur::before{content:"";position:absolute;left:0;top:15%;bottom:15%;width:2.5px;border-radius:2px;background:var(--acc)}
.tree-n svg{width:15px;height:15px;flex:none}
.tree-n .tw{width:14px;height:14px;display:grid;place-items:center;color:var(--tx-3);flex:none;transition:transform .2s var(--ease)}
.tree-n .tw.open{transform:rotate(90deg)}
.tree-n .tw:hover{color:var(--tx-0)}
.tree-n .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tree-n .cnt{font-family:var(--font-mono);font-size:9.5px;color:var(--tx-3)}
.tree-n.drop{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.tree-kids{margin-left:12px;border-left:1px solid var(--line);padding-left:3px}
.side-store{margin:4px 6px;padding:8px 9px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line)}
.side-store .sst{display:flex;justify-content:space-between;font-size:11px;color:var(--tx-2);font-family:var(--font-mono);margin-bottom:5px}
.side-store .bar{height:5px;border-radius:4px;background:var(--bg-4);overflow:hidden;margin-bottom:6px}
.side-store .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s var(--ease)}
.fx-content{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg-2)}
.fx-listwrap{flex:1;min-height:0;overflow:auto;position:relative}
.fx-head{display:flex;position:sticky;top:0;z-index:6;background:var(--bg-1);border-bottom:1px solid var(--line);
  min-width:max-content}
.fx-hcell{display:flex;align-items:center;gap:5px;padding:0 9px;height:30px;font-size:11px;font-family:var(--font-mono);
  letter-spacing:.06em;text-transform:uppercase;color:var(--tx-2);cursor:default;user-select:none;position:relative;flex:none;
  transition:color .14s,background .14s}
.fx-hcell:hover{color:var(--tx-0);background:var(--hover)}
.fx-hcell.sorted{color:var(--acc)}
.fx-hcell svg{width:11px;height:11px;opacity:.85}
.fx-grip{position:absolute;right:-3px;top:5px;bottom:5px;width:7px;cursor:col-resize;z-index:2}
.fx-grip:hover,.fx-grip.act{background:var(--acc-line);border-radius:3px}
.fx-rows{min-width:max-content;position:relative;padding-bottom:60px}
.frow{display:flex;align-items:center;height:30px;border-radius:6px;cursor:default;user-select:none;position:relative;
  transition:background .12s;color:var(--tx-1)}
.frow:hover{background:var(--hover)}
.frow.sel{background:var(--sel);color:var(--tx-0)}
.frow.sel .fcell.nm{color:var(--tx-0);font-weight:500}
.frow.cut{opacity:.45}
.frow.drop{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.frow.ren .fcell.nm{display:none}
.fcell{padding:0 9px;font-size:12.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;
  display:flex;align-items:center;gap:7px}
.fcell.nm{color:var(--tx-0)}
.fcell.dt,.fcell.sz{font-family:var(--font-mono);font-size:11.5px;color:var(--tx-2)}
.fcell.tp{font-size:11.5px;color:var(--tx-2)}
.fcell svg{width:16px;height:16px;flex:none}
.fthumb{width:19px;height:19px;border-radius:4px;object-fit:cover;background:var(--bg-4);flex:none;border:1px solid var(--line)}
.fbadge{font-family:var(--font-mono);font-size:9px;padding:0 4px;border-radius:4px;border:1px solid var(--line-2);
  color:var(--tx-2);letter-spacing:.04em;flex:none}
.fbadge.opfs{color:var(--acc2);border-color:rgba(63,199,176,.4);background:rgba(63,199,176,.08)}
.fbadge.idb{color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
.fbadge.mnt{color:var(--acc3);border-color:rgba(226,112,90,.4);background:rgba(226,112,90,.09)}
.frename{height:24px;border:1px solid var(--acc);border-radius:5px;background:var(--bg-2);color:var(--tx-0);
  outline:none;font-size:12.5px;padding:0 6px;width:100%;box-shadow:0 0 0 3px var(--acc-soft)}
/* icon grid view */
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;padding:12px;align-content:start}
.gitem{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 6px 9px;border-radius:9px;
  cursor:default;user-select:none;position:relative;transition:background .13s,transform .18s var(--ease-out);text-align:center}
.gitem:hover{background:var(--hover);transform:translateY(-2px)}
.gitem.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--acc-line)}
.gitem.drop{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.gitem .gth{width:58px;height:58px;border-radius:8px;display:grid;place-items:center;background:var(--bg-3);
  border:1px solid var(--line);overflow:hidden;position:relative}
.gitem .gth svg{width:32px;height:32px}
.gitem .gth img{width:100%;height:100%;object-fit:cover}
.gitem .gnm{font-size:11.5px;line-height:1.3;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;word-break:break-all;color:var(--tx-1)}
.gitem.sel .gnm{color:var(--tx-0)}
.gitem .gmeta{font-family:var(--font-mono);font-size:9.5px;color:var(--tx-3)}
/* list view (compact single column) */
.fx-list .frow{height:26px}
.fx-stat{flex:none;display:flex;align-items:center;gap:12px;padding:5px 11px;border-top:1px solid var(--line);
  background:var(--bg-1);font-family:var(--font-mono);font-size:11px;color:var(--tx-2);min-height:28px;flex-wrap:wrap}
.fx-stat b{color:var(--tx-0);font-weight:500}
.fx-stat .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.selbox{position:absolute;pointer-events:none;z-index:40;border:1px solid var(--acc2);background:rgba(63,199,176,.14);
  border-radius:2px;opacity:0}
.selbox.on{opacity:1}
.fx-modesel{display:flex;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.fx-modesel button{width:26px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--tx-3);transition:.14s}
.fx-modesel button:hover{color:var(--tx-0);background:var(--hover)}
.fx-modesel button.on{background:var(--acc);color:var(--acc-ink)}
.fx-modesel svg{width:15px;height:15px}
.props-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px}
.props-grid dt{color:var(--tx-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.04em}
.props-grid dd{margin:0;word-break:break-all}
/* ============================================================
   Notepad / Sheets
   ============================================================ */
.np{display:flex;flex-direction:column;height:100%;min-height:0}
.np-bar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-1);
  flex:none;flex-wrap:wrap}
.np-ta{flex:1;min-height:0;width:100%;border:0;outline:none;resize:none;padding:16px 18px;background:var(--bg-2);
  color:var(--tx-0);font-family:var(--font-mono);font-size:14px;line-height:1.75;tab-size:2}
.np-ta.wrap-off{white-space:pre;overflow:auto}
.np-status{flex:none;display:flex;gap:14px;align-items:center;padding:4px 11px;border-top:1px solid var(--line);
  background:var(--bg-1);font-family:var(--font-mono);font-size:11px;color:var(--tx-2);min-height:26px;flex-wrap:wrap}
.np-status .dot{width:6px;height:6px;border-radius:50%;background:var(--acc2);flex:none;box-shadow:0 0 6px var(--acc2)}
.np-status .dot.dirty{background:var(--acc3);box-shadow:0 0 6px var(--acc3)}
.np-status .sp{margin-left:auto}
.sheet-wrap{flex:1;min-height:0;overflow:auto;background:var(--bg-2);position:relative}
table.sheet{border-collapse:collapse;font-size:12.5px;min-width:100%}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:0}
table.sheet thead th{position:sticky;top:0;z-index:3;background:var(--bg-3);font-family:var(--font-mono);font-size:10.5px;
  color:var(--tx-2);letter-spacing:.06em;padding:5px 8px;font-weight:500;text-align:left}
table.sheet tbody th{position:sticky;left:0;z-index:2;background:var(--bg-1);font-family:var(--font-mono);font-size:10.5px;
  color:var(--tx-3);padding:4px 8px;font-weight:400;min-width:42px;text-align:right}
table.sheet td input{width:100%;min-width:88px;border:0;background:transparent;padding:5px 8px;outline:none;font-size:12.5px;
  font-family:var(--font-ui);color:var(--tx-0)}
table.sheet td input:focus{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
table.sheet tbody tr:hover td{background:var(--hover)}

/* ============================================================
   Code editor
   ============================================================ */
.ce{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-1)}
.ce-bar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-1);
  flex:none;flex-wrap:wrap}
.ce-tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;font-size:12px;
  color:var(--tx-1);border:1px solid transparent;transition:.14s;white-space:nowrap}
.ce-tbtn:hover{background:var(--hover);color:var(--tx-0);border-color:var(--line)}
.ce-tbtn:active{transform:scale(.96)}
.ce-tbtn svg{width:14px;height:14px}
.ce-tbtn.pri{color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
.ce-tbtn.pri:hover{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.ce-sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
.ce-sel{height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg-2);font-size:12px;padding:0 6px;
  outline:none;color:var(--tx-1)}
.ce-split{flex:1;min-height:0;display:flex;position:relative}
.ce-split.vert{flex-direction:column}
.ce-editor{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:var(--code-bg)}
.ce-editor .CodeMirror{height:100%;font-family:var(--font-mono);font-size:13px;line-height:1.65}
.ce-fallback{width:100%;height:100%;border:0;outline:none;resize:none;padding:12px;background:var(--code-bg);
  color:var(--tx-0);font-family:var(--font-mono);font-size:13px;line-height:1.6}
.ce-divider{flex:none;background:var(--bg-3);position:relative;z-index:4;transition:background .15s}
.ce-split:not(.vert) .ce-divider{width:5px;cursor:col-resize}
.ce-split.vert .ce-divider{height:5px;cursor:row-resize}
.ce-divider:hover,.ce-divider.act{background:var(--acc)}
.ce-divider::after{content:"";position:absolute;inset:-4px}
.ce-prev{flex:1;min-width:0;min-height:0;position:relative;background:#fff;overflow:hidden}
.ce-prev iframe{width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .28s var(--ease)}
.ce-prev.ready iframe{opacity:1}
.ce-prev .veil{position:absolute;inset:0;background:var(--bg-1);display:grid;place-items:center;gap:12px;z-index:2;
  transition:opacity .3s var(--ease);align-content:center;justify-items:center}
.ce-prev.ready .veil{opacity:0;pointer-events:none}
.ce-find{position:absolute;top:8px;right:14px;z-index:30;background:var(--glass-2);backdrop-filter:blur(18px);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-2);padding:8px;display:none;gap:6px;
  align-items:center;flex-wrap:wrap;max-width:min(440px,92%)}
.ce-find.on{display:flex;animation:modalIn .2s var(--ease-out)}
.ce-find input{height:27px;border-radius:6px;border:1px solid var(--line);background:var(--bg-1);padding:0 8px;
  font-size:12px;outline:none;width:120px;font-family:var(--font-mono)}
.ce-find input:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.ce-find .cnt{font-family:var(--font-mono);font-size:11px;color:var(--tx-2);min-width:44px;text-align:center}
.ce-find label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx-2)}
.ce-status{flex:none;display:flex;align-items:center;gap:14px;padding:4px 11px;border-top:1px solid var(--line);
  background:var(--bg-1);font-family:var(--font-mono);font-size:11px;color:var(--tx-2);min-height:26px;flex-wrap:wrap}
.ce-status b{color:var(--tx-0);font-weight:500}
.ce-status .sp{margin-left:auto;display:flex;gap:14px;align-items:center}
.ce-status .lang{color:var(--acc);letter-spacing:.06em}
.CodeMirror-searching{background:rgba(242,181,68,.32);border-radius:2px}
.CodeMirror-activeline-background{background:rgba(255,255,255,.045)}
html[data-theme="light"] .CodeMirror-activeline-background{background:rgba(14,23,29,.05)}

/* ============================================================
   Image / Manga / Media viewers
   ============================================================ */
.iv{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-0)}
.iv-bar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-1);flex:none;flex-wrap:wrap}
.iv-stage{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 40%,var(--bg-2),var(--bg-0));touch-action:none;cursor:grab}
.iv-stage.grabbing{cursor:grabbing}
.iv-stage img{max-width:none;max-height:none;position:absolute;user-select:none;-webkit-user-drag:none;
  transition:opacity .25s;box-shadow:0 12px 40px rgba(0,0,0,.5);background:var(--bg-3)}
.iv-stage img.plain{max-width:100%;max-height:100%;object-fit:contain;position:relative;box-shadow:none}
.iv-hud{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;
  background:var(--glass-2);backdrop-filter:blur(16px);border:1px solid var(--line-2);border-radius:99px;padding:4px 8px;
  box-shadow:var(--shadow-2);z-index:6}
.iv-hud .z{font-family:var(--font-mono);font-size:11px;color:var(--tx-2);min-width:48px;text-align:center}
.iv-side{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:56px;border-radius:10px;
  background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--line-2);display:grid;place-items:center;
  color:var(--tx-1);z-index:6;transition:.16s}
.iv-side:hover{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.iv-side.l{left:10px}.iv-side.r{right:10px}
.mv{position:relative;height:100%;display:flex;flex-direction:column;background:#000;min-height:0}
.mv-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:#000;position:relative;
  overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;cursor:grab}
.mv-scroll.grabbing{cursor:grabbing}
.mv-scroll::-webkit-scrollbar{width:8px}
.mv-scroll::-webkit-scrollbar-thumb{background:#333;border:2px solid transparent;background-clip:content-box}
.mv-page{display:flex;justify-content:center;align-items:flex-start;background:#000;position:relative;width:100%}
.mv-page img{display:block;max-width:100%;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
.mv-page .ph{width:min(100%,900px);background:linear-gradient(100deg,#111 30%,#1c1c1c 50%,#111 70%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite;display:grid;place-items:center;color:#4a4a4a;
  font-family:var(--font-mono);font-size:12px}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.mv-page .err{color:#7a3b32;font-family:var(--font-mono);font-size:12px;padding:20px;text-align:center}
.mv-hud{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.86),transparent);color:#cfd8dc;z-index:5;font-family:var(--font-mono);
  font-size:11.5px;transition:opacity .3s;pointer-events:none}
.mv-hud .sp{margin-left:auto}
.mv-hud .pbar{flex:1;height:3px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;max-width:220px}
.mv-hud .pbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .12s linear}
.mv-exit{position:absolute;top:10px;right:12px;z-index:20;width:34px;height:34px;border-radius:9px;display:grid;
  place-items:center;background:rgba(10,10,10,.5);color:#dfe6e9;border:1px solid rgba(255,255,255,.14);
  opacity:.22;transition:.2s;backdrop-filter:blur(8px)}
.mv-exit:hover{opacity:1;background:rgba(226,112,90,.85);color:#fff}
.mv.load{display:grid;place-items:center;color:#8b9aa4;font-family:var(--font-mono);font-size:12px;gap:14px;
  align-content:center;justify-items:center;height:100%}
.win.mvfull .win-head,.win.mvfull .mv-hud{display:none}
.win.mvfull .mv-exit{opacity:.25}
.mp{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-1)}
.mp-stage{flex:1;min-height:0;display:grid;place-items:center;background:#000;position:relative;padding:0}
.mp-stage video{width:100%;height:100%;object-fit:contain;background:#000;outline:none}
.mp-audio{display:flex;flex-direction:column;align-items:center;gap:18px;justify-content:center;height:100%;
  background:radial-gradient(circle at 50% 35%,var(--bg-3),var(--bg-0));padding:22px;text-align:center}
.mp-disc{width:132px;height:132px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(from 0deg,#1a2229,#2b3742,#1a2229,#2b3742,#1a2229);box-shadow:0 14px 40px rgba(0,0,0,.5),
  inset 0 0 0 1px rgba(255,255,255,.06);animation:spinDisc 5.5s linear infinite;animation-play-state:paused}
.mp.playing .mp-disc{animation-play-state:running}
@keyframes spinDisc{to{transform:rotate(360deg)}}
.mp-disc::after{content:"";width:34px;height:34px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 6px var(--bg-1),0 0 22px var(--acc)}
.mp-meta b{display:block;font-family:var(--font-display);font-size:16px;font-weight:700}
.mp-meta small{color:var(--tx-2);font-family:var(--font-mono);font-size:11px}
.mp-ctl{display:flex;flex-direction:column;gap:9px;width:min(440px,100%)}
.mp-seek{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;color:var(--tx-2)}
.mp-seek input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--bg-4);outline:none}
.mp-seek input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--acc);cursor:pointer;box-shadow:0 0 8px rgba(242,181,68,.6)}
.mp-seek input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
.mp-btns{display:flex;align-items:center;justify-content:center;gap:8px}
.mp-btns button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--tx-1);
  border:1px solid var(--line);background:var(--bg-2);transition:.15s}
.mp-btns button:hover{color:var(--tx-0);background:var(--bg-3);border-color:var(--line-2)}
.mp-btns button.pp{width:48px;height:48px;background:var(--acc);color:var(--acc-ink);border-color:transparent;
  box-shadow:0 4px 16px rgba(0,0,0,.3)}
.mp-btns button.pp:hover{filter:brightness(1.08)}
.mp-list{flex:none;max-height:38%;overflow:auto;border-top:1px solid var(--line);background:var(--bg-2)}
.mp-list .it{display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:12.5px;color:var(--tx-1);
  border-bottom:1px solid var(--line);transition:.13s;cursor:default}
.mp-list .it:hover{background:var(--hover);color:var(--tx-0)}
.mp-list .it.on{background:var(--acc-soft);color:var(--acc)}
.mp-list .it .n{font-family:var(--font-mono);font-size:10.5px;color:var(--tx-3);width:22px}
.mp-list .it .sp{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--tx-3)}

/* ============================================================
   Browser · Calculator · Paint · Settings · VM
   ============================================================ */
.br{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-1)}
.br-bar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;background:var(--bg-1)}
.br-url{flex:1;min-width:60px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);
  padding:0 13px;outline:none;font-size:12.5px;font-family:var(--font-mono);transition:.16s}
.br-url:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.br-stage{flex:1;min-height:0;position:relative;background:#fff}
.br-stage iframe{width:100%;height:100%;border:0;opacity:0;transition:opacity .3s var(--ease)}
.br-stage.ready iframe{opacity:1}
.br-veil{position:absolute;inset:0;background:var(--bg-1);display:grid;place-items:center;gap:14px;z-index:2;
  align-content:center;justify-items:center;transition:opacity .3s}
.br-stage.ready .br-veil{opacity:0;pointer-events:none}
.br-veil .ring{width:34px;height:34px;border:2.5px solid var(--line-2);border-top-color:var(--acc);border-radius:50%;
  animation:sp .8s linear infinite}
.br-veil p{margin:0;font-family:var(--font-mono);font-size:11.5px;color:var(--tx-2);max-width:70%;text-align:center}
.br-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:5px 8px 0;background:var(--bg-1);flex:none}
.br-tabs::-webkit-scrollbar{height:0}
.br-tab{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px 8px 0 0;font-size:12px;color:var(--tx-2);
  background:var(--bg-2);border:1px solid var(--line);border-bottom:0;max-width:170px;flex:none;transition:.14s}
.br-tab.on{color:var(--tx-0);background:var(--bg-3);box-shadow:inset 0 2px 0 var(--acc)}
.br-tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-tab button{color:var(--tx-3);display:grid;place-items:center}
.br-tab button:hover{color:var(--acc3)}
.br-start{position:absolute;inset:0;background:var(--bg-1);z-index:1;overflow:auto;padding:26px}
.br-start h2{font-family:var(--font-display);font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.br-start p{margin:0 0 20px;color:var(--tx-2);font-size:12.5px}
.br-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;max-width:660px}
.br-link{display:flex;align-items:center;gap:9px;padding:11px;border-radius:10px;background:var(--bg-2);
  border:1px solid var(--line);transition:.18s var(--ease-out);text-align:left}
.br-link:hover{transform:translateY(-2px);border-color:var(--acc-line);box-shadow:var(--shadow-1)}
.br-link b{font-size:12.5px;display:block}
.br-link small{font-size:10.5px;color:var(--tx-3);font-family:var(--font-mono);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.br-link .fav{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--acc-soft);
  color:var(--acc);flex:none;font-family:var(--font-display);font-weight:800;font-size:13px}

.calc{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-1);padding:12px;gap:10px}
.calc-disp{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;flex:none}
.calc-expr{font-family:var(--font-mono);font-size:12px;color:var(--tx-3);min-height:17px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.calc-out{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;min-height:0}
.calc-pad button{border-radius:11px;background:var(--bg-2);border:1px solid var(--line);font-size:17px;color:var(--tx-0);
  font-family:var(--font-mono);transition:.12s;display:grid;place-items:center;min-height:38px}
.calc-pad button:hover{background:var(--bg-3);border-color:var(--line-2);transform:translateY(-1px)}
.calc-pad button:active{transform:scale(.95)}
.calc-pad button.op{color:var(--acc2);font-size:19px}
.calc-pad button.eq{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}
.calc-pad button.eq:hover{filter:brightness(1.08)}
.calc-pad button.fn{color:var(--tx-2);font-size:14px}
.calc-hist{flex:none;max-height:29%;overflow:auto;border-top:1px solid var(--line);padding-top:7px}
.calc-hist .h{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:11.5px;
  padding:3px 6px;border-radius:6px;color:var(--tx-2);cursor:default}
.calc-hist .h:hover{background:var(--hover);color:var(--tx-0)}
.calc-hist .h b{color:var(--acc)}

.pt{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-1)}
.pt-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;background:var(--bg-1)}
.pt-stage{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--bg-3) 0 25%,var(--bg-2) 0 50%) 50%/18px 18px;padding:12px}
.pt-stage canvas{background:#fff;border-radius:6px;box-shadow:var(--shadow-2);touch-action:none;cursor:crosshair;
  max-width:100%;max-height:100%}
.pt-colors{display:flex;gap:4px;align-items:center}
.pt-sw{width:20px;height:20px;border-radius:6px;border:2px solid transparent;transition:.14s;flex:none}
.pt-sw:hover{transform:scale(1.14)}
.pt-sw.on{border-color:var(--tx-0);box-shadow:0 0 0 2px var(--bg-1)}
input[type=range].sl{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--bg-4);
  outline:none;width:88px}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--acc);cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,.4)}
input[type=range].sl::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}

.st{display:flex;height:100%;min-height:0;background:var(--bg-2)}
.st-nav{width:186px;flex:none;border-right:1px solid var(--line);background:var(--bg-1);overflow:auto;padding:10px 8px}
.st-nav button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;color:var(--tx-1);
  font-size:12.8px;transition:.14s;text-align:left;margin-bottom:2px;border:1px solid transparent}
.st-nav button:hover{background:var(--hover);color:var(--tx-0)}
.st-nav button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line);font-weight:600}
.st-nav button svg{width:16px;height:16px}
.st-body{flex:1;min-width:0;overflow:auto;padding:18px 20px 40px}
.st-body h2{font-family:var(--font-display);font-size:21px;font-weight:800;margin:0 0 3px;letter-spacing:-.01em}
.st-body>p.sub{margin:0 0 18px;color:var(--tx-2);font-size:12.5px}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h4{margin:0 0 3px;font-family:var(--font-display);font-size:13.5px;font-weight:700;letter-spacing:.01em}
.card p.d{margin:0 0 12px;color:var(--tx-2);font-size:11.8px;line-height:1.55}
.setrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:0;padding-bottom:0}
.setrow .txt{flex:1;min-width:0}
.setrow .txt b{display:block;font-size:12.8px;font-weight:600}
.setrow .txt small{display:block;color:var(--tx-2);font-size:11.3px;line-height:1.5}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;transition:.16s var(--ease-out);position:relative}
.swatch:hover{transform:translateY(-2px) scale(1.06)}
.swatch.on{border-color:var(--tx-0);box-shadow:0 0 0 2px var(--bg-1)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px}
.wp-item{aspect-ratio:16/10;border-radius:9px;border:2px solid var(--line);overflow:hidden;position:relative;
  transition:.18s var(--ease-out);background-size:cover;background-position:center}
.wp-item:hover{transform:translateY(-2px);border-color:var(--line-2)}
.wp-item.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.wp-item span{position:absolute;left:0;right:0;bottom:0;padding:12px 7px 4px;font-size:10.5px;color:#fff;
  background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);text-align:left;text-shadow:0 1px 2px #000}
.store-viz{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sv-card{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:13px;position:relative;overflow:hidden}
.sv-card .svt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sv-card .svt svg{color:var(--acc2)}
.sv-card.idb .svt svg{color:var(--acc)}
.sv-card .svt b{font-family:var(--font-mono);font-size:12px;letter-spacing:.05em}
.sv-card .svt .pill{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;padding:1px 6px;border-radius:5px;
  background:var(--bg-4);color:var(--tx-2);letter-spacing:.05em}
.sv-big{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.sv-big small{font-size:12px;font-weight:500;color:var(--tx-2);margin-left:4px;font-family:var(--font-mono)}
.sv-bar{height:9px;border-radius:6px;background:var(--bg-4);overflow:hidden;margin:9px 0 7px;display:flex}
.sv-bar i{display:block;height:100%}
.sv-legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;color:var(--tx-2)}
.sv-legend em{font-style:normal;display:flex;align-items:center;gap:5px}
.sv-legend i{width:8px;height:8px;border-radius:2px;display:block}
.sv-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.sv-row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:11.8px}
.sv-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx-1);
  font-family:var(--font-mono);font-size:11px}
.sv-row .vb{width:96px;height:6px;border-radius:4px;background:var(--bg-4);overflow:hidden;flex:none}
.sv-row .vb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.sv-row .sz{font-family:var(--font-mono);font-size:10.5px;color:var(--tx-2);width:62px;text-align:right;flex:none}
.mnt-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--bg-2);
  border:1px solid var(--line);margin-bottom:7px}
.mnt-item .mi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(226,112,90,.12);
  color:var(--acc3);flex:none}
.mnt-item b{font-size:12.5px;display:block}
.mnt-item small{font-size:10.8px;color:var(--tx-2);font-family:var(--font-mono)}
.mnt-item .sp{margin-left:auto;display:flex;gap:6px;align-items:center}

.vm{display:flex;flex-direction:column;height:100%;min-height:0;background:#0b0e10}
.vm-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-1);
  flex:none;flex-wrap:wrap}
.vm-screen{flex:1;min-height:0;position:relative;background:#000;overflow:auto;display:grid;place-items:center}
.vm-screen .screen_container{position:relative;background:#000}
.vm-screen .screen_container div{white-space:pre;font-family:var(--font-mono);font-size:14px;color:#e8eef2}
.vm-screen canvas{image-rendering:pixelated}
.vm-note{position:absolute;inset:0;display:grid;place-items:center;gap:12px;align-content:center;justify-items:center;
  padding:24px;text-align:center;color:var(--tx-2)}
.vm-note svg{width:40px;height:40px;color:var(--acc2)}
.vm-note b{font-family:var(--font-display);font-size:15px;color:var(--tx-0)}
.vm-note p{margin:0;font-size:12px;max-width:420px;line-height:1.6}
.vm-lock{position:absolute;top:8px;right:8px;z-index:5}

/* ============================================================
   Responsive — mobile / tablet
   ============================================================ */
@media (max-width:900px){
  .fx-side{width:180px}
  .store-viz{grid-template-columns:1fr}
  .st-nav{width:150px}
}
@media (max-width:768px){
  :root{--tb-h:58px}
  body{font-size:14px}
  #startBtn span:last-child{display:none}
  #startBtn{padding:0 10px;width:44px;justify-content:center}
  .titem .tlabel{display:none}
  .titem{padding:0 10px;width:44px;justify-content:center}
  #clockBtn{padding:0 8px}
  #clockDate{display:none}
  #startMenu{left:6px;right:6px;bottom:calc(var(--tb-h) + 6px);width:auto;max-height:calc(100vh - var(--tb-h) - 16px);
    overflow:auto;border-radius:16px}
  .sm-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));max-height:none}
  #calPop{right:6px;left:6px;width:auto}
  .win{border-radius:0 !important;border-width:0}
  .win-head{height:44px}
  .wc{width:46px}
  .fx-side{position:absolute;left:0;top:0;bottom:0;z-index:20;width:230px;box-shadow:var(--shadow-2);
    transform:translateX(-104%);transition:transform .26s var(--ease)}
  .fx-side.open{transform:none}
  .fx-side.collapsed{width:230px;padding:8px 6px}
  .st{flex-direction:column}
  .st-nav{width:100%;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:7px;gap:5px}
  .st-nav button{width:auto;flex:none;margin:0;padding:7px 11px}
  .st-nav button span{display:none}
  .st-body{padding:14px}
  .dicon{width:82px}
  .dicon .dglyph{width:38px;height:38px}
  .dicon .dglyph svg{width:34px;height:34px}
  .ce-find{left:8px;right:8px;max-width:none}
  .toast-layer,#toastLayer{left:10px;right:10px;bottom:calc(var(--tb-h) + 10px);max-width:none;align-items:stretch}
  .modal-b{max-height:56vh}
}
@media (max-width:420px){
  .calc-out{font-size:27px}
  .fx-search{min-width:96px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* 补充：动画开关 / 列表视图（多栏紧凑） / 图标视图容器 / 移动端抽屉侧栏 */
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
.fx-rows.fx-grid{min-width:0}
.fx-rows.fx-list{min-width:0;display:block;column-width:214px;column-gap:8px;padding:8px 10px}
.fx-list .frow{break-inside:avoid;-webkit-column-break-inside:avoid;width:100%;margin-bottom:2px}
.fx-list .fcell.nm{width:auto !important;flex:1 1 auto}
.fx-list .fcell:not(.nm){display:none}
.fx-list .selbox{display:none}
@media (max-width:768px){
  .fx-side{transform:translateX(-105%)}
  .fx-side:not(.collapsed){transform:none}
}

const P = {
  norm(p) {

      out.push(seg);
    }
    return (abs ? '/' : '') + out.join('/') || (abs ? '/' : '.');
  },
  join(...a) { return P.norm(a.filter(Boolean).join('/')); },
  dir(p) { p = P.norm(p); const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); },
  base(p) { p = P.norm(p); const i = p.lastIndexOf('/'); return p.slice(i + 1); },
  ext(p) { const b = P.base(p); const i = b.lastIndexOf('.'); return i < 1 ? '' : b.slice(i + 1).toLowerCase(); },
  isRoot(p) { return P.norm(p) === '/'; },

      if (st.type === 'dir') {

  async usage() {

  async topFolders(limit = 8) {

    for (const r of all) {

  /* ---------- 索引重建 ---------- */
  async rebuildIndex() {

  async requestMountPermission(name) {

  async mountStatus(name) { return MountFS.handles.has(name) ? 'ready' : 'need-auth'; },

  /* ---------- 导出 / 导入 ---------- */
  async exportFile(path) {

  async importEntry(entry, dir, onProgress) {

    if (!entry) return;

  /* ---------- 危险操作 ---------- */
  async resetAll() {

      } catch (e) {}

/* 回调风格兼容适配（8.6：任意多余参数均安全） */
function adapt(promise, cb) {

  promise.then(r => cb(null, r), e => cb(e));

function toBlob(data, path) {
  if (data instanceof Blob) return data;
  if (data instanceof File) return data;
  if (data instanceof ArrayBuffer) return new Blob([data], {type: mimeOf(path || '')});
  if (ArrayBuffer.isView(data)) return new Blob([data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength)], {type: mimeOf(path || '')});
  if (typeof data === 'string') return new Blob([data], {type: 'text/plain;charset=utf-8'});
  return new Blob([JSON.stringify(data)], {type: 'application/json'});
}

  return useCache ? BlobCache.put(key, url) : url;
}

        {label: '并排平铺', icon: 'split', action: () => this.tileAll()},

  },

      y: mobile ? 0 : clamp(Math.round((a.h - h) / 2.4) + off, 6, Math.max(6, a.h - h - 6)),

/* 根据 stat 结果智能分派：目录 → 文件管理器；文件 → 对应应用 */
async function openPath(path, opts) {
  opts = opts || {};
  let st;
  try { st = await fs.stat(path); }
  catch (e) { toast('无法打开', e.message || String(e), 'err'); return; }
  if (st.type === 'dir') { WM.open('explorer', {path}); return; }
  if (opts.app) { WM.open(opts.app, {path}); return; }
  const k = kindOf(path), e = P.ext(path);
  if (k === 'image') {
    // 默认漫画阅读器（自动连读同目录序列）；可在设置中改为图片查看器
    const pref = opts.viewer ? 'viewer' : (opts.app || S.imageOpenWith || 'manga');
    WM.open(pref === 'viewer' ? 'viewer' : pref, {path}); return;
  }
  if (k === 'audio' || k === 'video') { WM.open('media', {path}); return; }
  if (k === 'pdf') { WM.open('viewer', {path, mode: 'pdf'}); return; }
  if (k === 'sheet') { WM.open('sheet', {path}); return; }
  if (k === 'code') { WM.open('code', {path}); return; }
  if (k === 'zip' || k === 'sevenz' || k === 'tar') { WM.open('archive', {path}); return; }
  if (k === 'text') { WM.open('notepad', {path}); return; }
  if (e === 'iso' || e === 'img' || e === 'bin' || e === 'fda' || e === 'fd' || e === 'vhd') { WM.open('vm', {path}); return; }
  // 未知类型：探测是否为文本
  try {
    const b = await fs.readBlob(path);
    if (b.size < 4 * 1024 * 1024 && await looksLikeText(b)) { WM.open('notepad', {path}); return; }
  } catch (err) {}
  WM.open('viewer', {path, mode: 'unknown'});
}
async function looksLikeText(blob) {
  const buf = new Uint8Array(await blob.slice(0, 2048).arrayBuffer());
  if (!buf.length) return true;
  let weird = 0;
  for (const b of buf) if (b === 0) return false;
  for (const b of buf) if (b < 9 || (b > 13 && b < 32)) weird++;
  return weird / buf.length < 0.06;
}
function openWithMenu(path) {
  const k = kindOf(path);
  const list = [];
  if (k === 'image') list.push({app: 'viewer', label: '图片查看器'}, {app: 'manga', label: '漫画阅读器（同目录连读）'}, {app: 'paint', label: '画板编辑'});
  if (k === 'text' || k === 'code' || k === 'sheet' || k === 'other') {
    list.push({app: 'notepad', label: '记事本'}, {app: 'code', label: '代码编辑器'});
  }
  if (k === 'sheet') list.unshift({app: 'sheet', label: '表格（解析 CSV/TSV）'});
  if (k === 'code' && ['html', 'htm'].includes(P.ext(path))) list.unshift({app: 'browser', label: '在浏览器中打开'});
  if (k === 'audio' || k === 'video') list.push({app: 'media', label: '影音播放器'});
  if (k === 'pdf') list.push({app: 'viewer', label: 'PDF 预览'});
  list.push({app: 'notepad', label: '以纯文本打开'});
  const seen = new Set();
  return list.filter(i => { const k2 = i.app + i.label; if (seen.has(k2)) return false; seen.add(k2); return true; });
}
