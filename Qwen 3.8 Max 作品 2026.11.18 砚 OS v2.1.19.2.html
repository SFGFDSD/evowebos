    const color = it.kind === 'app' ? 'var(--acc)' : (APP_ICON_COLOR[kindOf(it.path || '')] || 'var(--tx-1)');
    const name = it.kind === 'app' ? APPS[it.appId].name : it.name;
    g.innerHTML = coloredIcon(it.icon, it.type === 'dir', color);
    node.querySelector('.dname').textContent = name;
    let badge = node.querySelector('.dbadge');
    if (it.kind === 'file' && S.showBackendBadge && it.store && it.store !== 'sys') {
      if (!badge) { badge = el('span', {class: 'dbadge'}); node.appendChild(badge); }
      badge.textContent = it.store === 'mnt' ? '本地' : it.store.toUpperCase();
    } else if (badge) badge.remove();
    node.classList.toggle('sel', this.selection.has(it.id));
  },
  layout() {
    const a = {w: $('#desktop').clientWidth, h: $('#desktop').clientHeight};
    const cols = Math.max(1, Math.floor((a.w - 8) / CELL_W)), rows = Math.max(1, Math.floor((a.h - 8) / CELL_H));
    const occupied = new Set();
    // 已保存位置的先占位
    this.items.forEach(it => {
      const pos = S.iconPositions[it.id];
      if (pos && typeof pos.x === 'number') { it.x = clamp(pos.x, 0, Math.max(0, a.w - CELL_W)); it.y = clamp(pos.y, 0, Math.max(0, a.h - CELL_H)); }
    });
    this.items.forEach(it => { if (it.x != null) occupied.add(Math.round(it.x / CELL_W) + ',' + Math.round(it.y / CELL_H)); });
    // 无位置的自动排布
    let ci = 0, ri = 0;
    const nextFree = () => {
      let attempts = 0;
      while (attempts++ < cols * rows) {
        const key = ci + ',' + ri;
        if (!occupied.has(key)) { occupied.add(key); return {x: ci * CELL_W + 6, y: ri * CELL_H + 6}; }
        ri++;
        if (ri >= rows) { ri = 0; ci++; if (ci >= cols) ci = 0; }
      }
      return {x: 6, y: 6};
    };
    this.items.forEach(it => {
      if (S.iconAutoArrange || it.x == null) { const p = nextFree(); it.x = p.x; it.y = p.y; }
      const n = this.nodes.get(it.id); if (!n) return;
      n.style.left = it.x + 'px'; n.style.top = it.y + 'px';
    });
    if (S.iconAutoArrange) this.persistPositions();
  },
  persistPositions() {
    const o = {};
    this.items.forEach(it => { o[it.id] = {x: Math.round(it.x), y: Math.round(it.y)}; });
    S.iconPositions = o; saveSettings();
  },
  snapTo(x, y) {
    const a = {w: $('#desktop').clientWidth, h: $('#desktop').clientHeight};
    return {x: clamp(Math.round(x / CELL_W) * CELL_W + 6, 0, Math.max(0, a.w - CELL_W)),
            y: clamp(Math.round((y - 6) / CELL_H) * CELL_H + 6, 0, Math.max(0, a.h - CELL_H))};
  },

  /* ---- 选择 ---- */
  select(id, additive) {
    if (!additive) this.selection.clear();
    if (id === null) { this.paintSel(); return; }
    if (additive && this.selection.has(id)) this.selection.delete(id); else this.selection.add(id);
    this.paintSel();
  },
  paintSel() { this.items.forEach(it => { const n = this.nodes.get(it.id); if (n) n.classList.toggle('sel', this.selection.has(it.id)); }); },
  selectedItems() { return this.items.filter(it => this.selection.has(it.id)); },

  onClick(e, it) {
    if (this._moved) return;
    if (e.ctrlKey || e.metaKey) { this.select(it.id, true); return; }
    if (e.shiftKey && this.selection.size) {
      const ids = this.items.map(i => i.id);
      const a = ids.indexOf(Array.from(this.selection)[0]), b = ids.indexOf(it.id);
      ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(i => this.selection.add(i));
      this.paintSel(); return;
    }
    if (this.selection.has(it.id) && this.selection.size > 1) { /* 保持多选 */ }
    else this.select(it.id, false);
    if (S.openMode === 'single') {
      this._clickTimer && clearTimeout(this._clickTimer);
      this._clickTimer = setTimeout(() => this.open(it), 150);
    }
  },
  open(it) {
    const n = this.nodes.get(it.id);
    if (n) { n.classList.remove('opening'); void n.offsetWidth; n.classList.add('opening'); }
    if (it.kind === 'app') {
      WM.open(it.appId, it.appId === 'explorer' ? {path: '/Desktop'} : {});
    } else openPath(it.path);
  },

  onContext(e, it) {
    e.preventDefault(); e.stopPropagation();
    if (!this.selection.has(it.id)) this.select(it.id, false);
    const sel = this.selectedItems();
    const files = sel.filter(s => s.kind === 'file');
    const items = [];
    if (sel.length === 1) {
      items.push({label: '打开', icon: 'external', action: () => this.open(it)});
      if (it.kind === 'file' && it.type === 'file') {
        const ow = openWithMenu(it.path);
        items.push({label: '打开方式', icon: 'layers', submenu: ow.map(o => ({label: o.label, icon: APPS[o.app].icon, action: () => WM.open(o.app, {path: it.path, manga: o.app === 'manga'})}))});
        if (['html', 'htm'].includes(P.ext(it.path))) {
          items.push({label: '在浏览器中打开', icon: 'browser', action: () => WM.open('browser', {path: it.path})});
          items.push({label: '编辑源代码', icon: 'code', action: () => WM.open('code', {path: it.path})});
        }
        if (kindOf(it.path) === 'image') items.push({label: '漫画模式连读同目录', icon: 'book', action: () => WM.open('manga', {path: it.path})});
      }
      if (it.kind === 'app') items.push({label: '应用信息', icon: 'info', action: () => WM.open('about', {app: it.appId})});
      items.push('-');
    } else {
      items.push({label: '打开 ' + sel.length + ' 项', icon: 'external', action: () => sel.forEach(s => this.open(s))});
      items.push('-');
    }
    if (files.length) {
      items.push({label: '复制', icon: 'copy', hint: 'Ctrl+C', action: () => { Clipboard.mode = 'copy'; Clipboard.paths = files.map(f => f.path); Clipboard.from = '/Desktop'; toast('已复制', files.length + ' 个项目', 'ok', 1600); }});
      items.push({label: '剪切', icon: 'scissors', hint: 'Ctrl+X', action: () => { Clipboard.mode = 'cut'; Clipboard.paths = files.map(f => f.path); Clipboard.from = '/Desktop'; }});
      items.push({label: '导出到电脑（下载）', icon: 'download', action: () => files.forEach(f => fs.exportFile(f.path).catch(e => toast('导出失败', e.message, 'err')))});
      items.push({label: '移动到…', icon: 'mount', action: () => this.moveToDialog(files.map(f => f.path))});
      items.push({label: '重命名', icon: 'pencil', hint: 'F2', disabled: sel.length !== 1, action: () => this.renameInline(it)});
      items.push('-');
      items.push({label: '删除', icon: 'trash', danger: true, hint: 'Del', action: () => deletePaths(files.map(f => f.path), () => this.refresh())});
      items.push({label: '属性', icon: 'info', action: () => showProperties(files[0].path)});
    } else {
      items.push({label: '从桌面移除快捷方式', icon: 'trash', action: () => {
        sel.filter(s => s.kind === 'app').forEach(s => { S.hideSystemApps.push(s.appId); const n = this.nodes.get(s.id); if (n) n.remove(); this.nodes.delete(s.id); });
        saveSettings(); this.refresh();
      }});
    }
    Menu.show(e.clientX, e.clientY, items);
  },

  async renameInline(it) {
    const n = this.nodes.get(it.id); if (!n) return;
    const nameEl = n.querySelector('.dname');
    const inp = el('input', {class: 'icon-rename', value: it.name});
    nameEl.style.display = 'none'; n.appendChild(inp); inp.focus();
    const dot = it.name.lastIndexOf('.');
    inp.setSelectionRange(0, dot > 0 ? dot : it.name.length);
    const done = async (commit) => {
      inp.remove(); nameEl.style.display = '';
      if (!commit) return;
      const nv = inp.value.trim();
      if (!nv || nv === it.name) return;
      if (/[\\/:*?"<>|]/.test(nv)) { toast('名称无效', '不能包含 \\ / : * ? " < > |', 'err'); return; }
      try { await fs.rename(it.path, P.join(P.dir(it.path), nv)); toast('已重命名', nv, 'ok', 1800); this.refresh(); }
      catch (e) { toast('重命名失败', e.message, 'err'); }
    };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
    inp.addEventListener('blur', () => done(true));
    inp.addEventListener('click', e => e.stopPropagation());
  },

  async moveToDialog(paths) {
    const dirs = [];
    const walk = async (p, d) => { if (d > 3) return; for (const e of await fs.readdir(p)) if (e.type === 'dir') { dirs.push(e.path); await walk(e.path, d + 1); } };
    await walk('/', 0);
    const sel = el('select', {class: 'inp'}, dirs.map(d => el('option', {value: d, text: d})));
    const body = el('div', {class: 'fld'}, [el('label', {text: '选择目标文件夹（' + paths.length + ' 项）'}), sel]);
    const ok = await openModal({title: '移动到', icon: 'mount', body, buttons: [{label: '取消', value: false}, {label: '移动', value: true, cls: 'pri'}]});
    if (!ok) return;
    let n = 0;
    for (const p of paths) {
      const to = P.join(sel.value, P.base(p));
      try { await fs.rename(p, to === p ? P.join(sel.value, P.uniqueName(sel.value, P.base(p), (await fs.readdir(sel.value)).map(e => e.name))) : to); n++; }
      catch (e) { try { await fs.copy(p, P.join(sel.value, P.uniqueName(sel.value, P.base(p), (await fs.readdir(sel.value)).map(x => x.name))), {preserveMtime: true}); await fs.rm(p, {recursive: true}); n++; } catch (e2) { toast('移动失败', P.base(p) + '：' + e2.message, 'err'); } }
    }
    toast('已移动 ' + n + ' 项', sel.value, 'ok');
    this.refresh();
  },

  /* ---- 原生 HTML5 拖拽（拖出浏览器 + 内部移动） ---- */
  onDragStart(e, it) {
    this._dragItems = this.selection.has(it.id) ? this.selectedItems() : [it];
    if (!this.selection.has(it.id)) this.select(it.id, false);
    const dt = e.dataTransfer;
    dt.effectAllowed = 'copyMove';
    const paths = this._dragItems.filter(i => i.kind === 'file').map(i => i.path);
    dt.setData('application/x-inkstone', JSON.stringify({paths, ids: this._dragItems.map(i => i.id)}));
    dt.setData('text/plain', this._dragItems.map(i => i.name).join(', '));
    // 同步读取预载缓存（严禁 await）
    let added = 0;
    for (const p of paths) {
      const c = dragCache.get(p);
      if (c && c.file) {
        try { dt.items.add(c.file); added++; } catch (err) {}
        try { if (added === 1) dt.setData('DownloadURL', c.mime + ':' + c.name + ':' + c.url); } catch (err) {}
      }
    }
    this._dragPaths = paths;
    document.body.classList.add('dragging-internal');
  },
  onDragEnd(e, it) {
    document.body.classList.remove('dragging-internal');
    $$('.dicon.dragover').forEach(n => n.classList.remove('dragover'));
    $('#dropHint').classList.remove('on');
    const paths = this._dragPaths || [];
    // Blob URL 延迟 5 秒释放
    setTimeout(() => paths.forEach(p => { const c = dragCache.get(p); if (c && c.url && !c.pinned) { URL.revokeObjectURL(c.url); dragCache.delete(p); } }), 5200);
    this._dragPaths = null;
  },
  onIconDragOver(e, it) {
    if (!this._dragItems) return;
    const src = this._dragItems;
    if (src.length === 1 && src[0].id === it.id) return;
    if (it.type === 'dir' && !src.some(s => s.id === it.id)) { e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = 'move'; this.layer.querySelectorAll('.dragover').forEach(n => n !== e.currentTarget && n.classList.remove('dragover'));
      e.currentTarget.classList.add('dragover'); }
  },
  async onIconDrop(e, it) {
    e.preventDefault(); e.stopPropagation();
    e.currentTarget.classList.remove('dragover');
    const src = this._dragItems || [];
    if (it.type !== 'dir') return;
    const paths = src.filter(s => s.kind === 'file' && s.id !== it.id).map(s => s.path);
    if (!paths.length) return;
    let n = 0;
    for (const p of paths) {
      if (P.dir(p) === it.path) continue;
      const target = P.join(it.path, P.base(p));
      try { await fs.rename(p, target); n++; }
      catch (err) { try { await fs.copy(p, target, {preserveMtime: true}); await fs.rm(p, {recursive: true}); n++; } catch (e2) { toast('移动失败', e2.message, 'err'); } }
    }
    if (n) toast('已移动到 ' + it.name, n + ' 个项目', 'ok', 2000);
    this.refresh();
  },

  /* ---- 桌面区域：内部位置调整 + 外部文件导入 ---- */
  bindDesktopEvents() {
    const d = $('#desktop');
    d.addEventListener('dragover', e => {
      if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; $('#dropHint').classList.add('on'); }
      else if (this._dragItems) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    });
    d.addEventListener('dragleave', e => { if (e.target === d) $('#dropHint').classList.remove('on'); });
    d.addEventListener('drop', async e => {
      e.preventDefault(); $('#dropHint').classList.remove('on');
      const dt = e.dataTransfer;
      const rect = d.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      // 1) 内部图标位置调整
      if (this._dragItems && !dt.types.includes('Files')) {
        const items = this._dragItems;
        const base = items[0];
        const target = this.snapTo(x - (x - (base.x || 0)) % CELL_W - CELL_W / 2 + 4, y - 20);
        const p0 = this.snapTo(x - 46, y - 20);
        items.forEach((it, i) => {
          const off = {x: (it.x || 0) - (base.x || 0), y: (it.y || 0) - (base.y || 0)};
          const n = this.nodes.get(it.id);
          const pos = items.length === 1 ? p0 : this.snapTo(p0.x + off.x, p0.y + off.y);
          it.x = pos.x; it.y = pos.y;
          if (n) { n.classList.remove('moving'); n.style.left = pos.x + 'px'; n.style.top = pos.y + 'px'; }
        });
        this.persistPositions();
        this._dragItems = null;
        return;
      }
      // 2) 外部文件导入（物理桌面 → 虚拟桌面）
      if (dt.items && dt.items.length && dt.types.includes('Files')) {
        const entries = [];
        for (let i = 0; i < dt.items.length; i++) {
          const it2 = dt.items[i];
          if (it2.kind !== 'file') continue;
          const en = it2.webkitGetAsEntry ? it2.webkitGetAsEntry() : null;
          if (en) entries.push(en);
        }
        const files = dt.files ? Array.from(dt.files) : [];
        toast('正在导入', entries.length || files.length ? '写入 OPFS 中…' : '', 'ok', 1600);
        try {
          if (entries.length) { for (const en of entries) await fs.importEntry(en, '/Desktop'); }
          else for (const f of files) { const buf = await f.arrayBuffer(); await fs.importBlob(new Blob([buf], {type: f.type}), f.name, '/Desktop', {mtime: f.lastModified}); }
          toast('导入完成', '已写入 /Desktop', 'ok');
        } catch (err) { toast('导入失败', err.message, 'err'); }
        this.refresh();
        return;
      }
      // 3) 从文件管理器窗口拖到桌面
      const raw = dt.getData('application/x-inkstone-fx');
      if (raw) {
        try {
          const data = JSON.parse(raw);
          for (const p of data.paths) {
            if (P.dir(p) === '/Desktop') continue;
            await fs.copy(p, P.join('/Desktop', P.base(p)), {preserveMtime: true});
          }
          const pos = this.snapTo(x - 46, y - 20);
          data.paths.forEach((p, i) => { S.iconPositions['file:/Desktop/' + P.base(p)] = {x: pos.x + i * CELL_W, y: pos.y}; });
          saveSettings(); this.refresh(); toast('已复制到桌面', data.paths.length + ' 项', 'ok', 2000);
        } catch (err) { toast('操作失败', err.message, 'err'); }
      }
    });

    // 空白处：框选 + 取消选择（鼠标 + 触摸通用）
    let mar = null;
    const startMarquee = (e) => {
      if (e.target.closest('.dicon')) return;
      if (e.button != null && e.button !== 0) return;
      Menu.hide();
      const rect = d.getBoundingClientRect();
      const p0 = getClientXY(e);
      mar = {sx: p0.x - rect.left, sy: p0.y - rect.top, additive: e.ctrlKey || e.metaKey || e.shiftKey, pid: e.pointerId, moved: false, base: new Set(this.selection)};
      if (!mar.additive) this.select(null);
      const onMoveDoc = ev => { if (mar && mar.moved && ev.cancelable) ev.preventDefault(); moveMarquee(ev); };
      const onUpDoc = () => { endMarquee(); document.removeEventListener('pointermove', onMoveDoc); document.removeEventListener('pointerup', onUpDoc); document.removeEventListener('pointercancel', onUpDoc); };
      document.addEventListener('pointermove', onMoveDoc, {passive: false});
      document.addEventListener('pointerup', onUpDoc);
      document.addEventListener('pointercancel', onUpDoc);
    };
    d.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && e.target.closest('.dicon')) return; startMarquee(e); });
    const moveMarquee = e => {
      if (!mar) return;
      const rect = d.getBoundingClientRect();
      const p = getClientXY(e);
      const cx = p.x - rect.left, cy = p.y - rect.top;
      if (!mar.moved && Math.abs(cx - mar.sx) + Math.abs(cy - mar.sy) < 5) return;
      mar.moved = true; this._moved = true;
      const x = Math.min(mar.sx, cx), y = Math.min(mar.sy, cy), w = Math.abs(cx - mar.sx), h = Math.abs(cy - mar.sy);
      Object.assign(this.marquee.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
      this.marquee.classList.add('on');
      if (!mar.additive) this.selection.clear(); else this.selection = new Set(mar.base);
      this.items.forEach(it => {
        const n = this.nodes.get(it.id); if (!n) return;
        const ix = it.x, iy = it.y, iw = n.offsetWidth, ih = n.offsetHeight;
        if (ix < x + w && ix + iw > x && iy < y + h && iy + ih > y) this.selection.add(it.id);
      });
      this.paintSel();
    };
    const endMarquee = () => {
      if (!mar) return;
      this.marquee.classList.remove('on');
      mar = null;
      setTimeout(() => { this._moved = false; }, 60);
    };
    d.addEventListener('click', e => { if (!e.target.closest('.dicon') && !this._moved) this.select(null); });
    d.addEventListener('contextmenu', e => {
      if (e.target.closest('.dicon')) return;
      e.preventDefault();
      this.select(null);
      showDesktopMenu(e.clientX, e.clientY);
    });
  },

  /* ---- 触摸端图标拖动（原生 DnD 在触摸设备不可用） ---- */
  bindTouchMove(node, it) {
    let st = null;
    node.style.touchAction = 'none';
    node.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      st = {sx: t.clientX, sy: t.clientY, ox: it.x, oy: it.y, moved: false, t0: Date.now()};
      preloadDragData(it.path);
    }, {passive: true});
    node.addEventListener('touchmove', e => {
      if (!st) return;
      const t = e.touches[0];
      const dx = t.clientX - st.sx, dy = t.clientY - st.sy;
      if (!st.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
      if (!st.moved) { st.moved = true; this._moved = true; node.classList.add('moving'); this.select(it.id, e.shiftKey); }
      e.preventDefault();
      it.x = st.ox + dx; it.y = st.oy + dy;
      node.style.left = it.x + 'px'; node.style.top = it.y + 'px';
      // 文件夹命中高亮
      const el2 = document.elementFromPoint(t.clientX, t.clientY);
      const target = el2 && el2.closest ? el2.closest('.dicon') : null;
      $$('.dicon.dragover').forEach(n => n !== target && n.classList.remove('dragover'));
      if (target && target !== node && this.items.find(i => i.id === target.dataset.id && i.type === 'dir')) target.classList.add('dragover');
      st.hover = target;
    }, {passive: false});
    const end = async (e) => {
      if (!st) return;
      const wasMoved = st.moved, hover = st.hover; st = null;
      node.classList.remove('moving');
      $$('.dicon.dragover').forEach(n => n.classList.remove('dragover'));
      if (!wasMoved) { setTimeout(() => this._moved = false, 80); return; }
      if (hover && hover !== node) {
        const hit = this.items.find(i => i.id === hover.dataset.id);
        if (hit && hit.type === 'dir' && it.kind === 'file') {
          try { await fs.rename(it.path, P.join(hit.path, it.name)); toast('已移动到 ' + hit.name, it.name, 'ok', 1800); }
          catch (err) { toast('移动失败', err.message, 'err'); }
          this.refresh(); return;
        }
      }
      const p = this.snapTo(it.x, it.y);
      it.x = p.x; it.y = p.y;
      node.style.left = p.x + 'px'; node.style.top = p.y + 'px';
      this.persistPositions();
      setTimeout(() => this._moved = false, 90);
    };
    node.addEventListener('touchend', end);
    node.addEventListener('touchcancel', end);
  },

  bindImportDrop() { /* 全局兜底：拖到窗口区域也导入 */
    ['dragover', 'drop'].forEach(t => window.addEventListener(t, e => {
      if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
        if (t === 'dragover') e.preventDefault();
      }
    }, false));
  }
};

function coloredIcon(name, isDir, color) {
  const c = color || 'var(--tx-1)';
  if (isDir) return '<svg viewBox="0 0 24 24" style="overflow:visible"><defs><linearGradient id="fg' + Math.random().toString(36).slice(2, 7) + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + c + '" stop-opacity=".95"/><stop offset="1" stop-color="' + c + '" stop-opacity=".55"/></linearGradient></defs>' +
    '<path d="' + ICON_PATHS.folder + '" fill="' + c + '" fill-opacity=".22" stroke="' + c + '" stroke-width="1.4" stroke-linejoin="round"/>' +

/* 拖出浏览器所需数据的异步预载 */
async function preloadDragData(path) {
  if (!path || dragCache.has(path)) return;
  try {
    const st = await fs.stat(path);
    if (st.type !== 'file') return;
    const blob = await fs.readBlob(path);
    const url = URL.createObjectURL(blob);
    const file = new File([blob], P.base(path), {type: blob.type || mimeOf(path), lastModified: st.mtime || Date.now()});
    dragCache.set(path, {blob, url, file, mime: blob.type || mimeOf(path) || 'application/octet-stream', name: P.base(path)});
  } catch (e) { /* 忽略：dragstart 时若无缓存则仅内部拖动 */ }
}

async function countItems(path) {
  let files = 0, dirs = 0;
  const walk = async (p, d) => { if (d > 6) return; for (const e of await fs.readdir(p).catch(() => [])) { if (e.type === 'dir') { dirs++; await walk(e.path, d + 1); } else files++; } };
  await walk(path, 0); return {files, dirs};
}

function pickAndImport(dir, opts) {
  const inp = el('input', {type: 'file', multiple: true, webkitdirectory: opts && opts.dir ? '' : null});
  if (opts && opts.accept) inp.accept = opts.accept;
  inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    inp.remove();
    if (!files.length) return;
    toast('正在导入', files.length + ' 个文件写入 ' + dir, 'ok', 1500);
    let n = 0;
    for (const f of files) {
      try {
        const rel = f.webkitRelativePath || f.name;
        const target = P.join(dir, rel);
        await fs.mkdir(P.dir(target), {recursive: true, force: true});
        const buf = await f.arrayBuffer();
        await fs.writeFile(target, new Blob([buf], {type: f.type}), {mtime: f.lastModified, store: opts && opts.store});
        n++;
      } catch (e) { toast('导入失败', f.name + '：' + e.message, 'err'); }
    }
    toast('导入完成', n + ' 个文件已写入 ' + dir, 'ok');
    Desktop.refresh(); opts && opts.done && opts.done(n);
  };
  inp.click();
}

      for (const e of list) {
        if (e.type === 'dir') await walk(e.path, d + 1);
        else if (e.store === store) out.push(e);
      }
    };
    await walk('/', 0);
    return out;
  }
  async function globalSearch(q) {
    const out = []; const lc = q.toLowerCase();
    const walk = async (p, d) => {
      if (d > 8 || out.length > 1500) return;
      let list; try { list = await fs.readdir(p); } catch (e) { return; }
      for (const e of list) {
        if (e.name.toLowerCase().includes(lc)) out.push(e);
        if (e.type === 'dir') await walk(e.path, d + 1);
      }
    };
    await walk('/', 0);
    return out;
  }

  /* ---- 渲染 ---- */
  function sorted(list) {
    const {key, dir} = st.sort;
    const arr = list.slice();
    const get = (e) => {
      if (key === 'name') return e.name;
      if (key === 'date') return e.mtime || 0;
      if (key === 'type') return P.ext(e.path) || (e.type === 'dir' ? '' : 'zzz');
      if (key === 'size') return e.type === 'dir' ? -1 : (e.size || 0);
      return e.name;
    };
    arr.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      const A = get(a), B = get(b);
      let c;
      if (typeof A === 'number') c = A - B;
      else c = key === 'name' ? natCompare(A, B) : String(A).localeCompare(String(B), 'zh-Hans-CN');
      return c * (dir || 1);
    });
    return arr;
  }
  function filtered() {
    let list = st.entries;
    if (st.query && !st.global) {
      const q = st.query.toLowerCase();
      list = list.filter(e => e.name.toLowerCase().includes(q));
    }
    return sorted(list);
  }
  function render() {
    const list = filtered();
    rows.innerHTML = '';
    applyColVars();
    head.innerHTML = ''; head.style.display = st.view === 'details' && !st.filterStore ? '' : 'none';
    if (st.view === 'details' && !st.filterStore) buildHead();

    rows.classList.toggle('fx-list', st.view === 'list');
    if (!list.length) {
      rows.appendChild(el('div', {class: 'empty'}, [svgEl(st.query ? 'search' : 'folderOpen'),
        el('p', {text: st.query ? '没有匹配的项目' : '此文件夹为空'}),
        el('small', {text: st.query ? '尝试调整关键字或使用全局搜索' : '右键空白处可新建文件夹、上传文件或挂载本地文件夹'})]));
      renderCrumb(); renderStatus(); return;
    }
    const frag = document.createDocumentFragment();
    list.forEach((e, i) => frag.appendChild(st.view === 'icons' ? gridItem(e, i) : detailRow(e, i)));
    rows.appendChild(frag);
    if (st.view === 'details' && !st.filterStore) {
      const total = colTotal();
      head.style.minWidth = total + 'px';
      rows.style.minWidth = total + 'px';
    } else { head.style.minWidth = ''; rows.style.minWidth = ''; }
    observeThumbs();
    computeFolderSizes(list);
    renderCrumb(); paintSel(); renderStatus();
  }
  function colTotal() { return S.colOrder.reduce((s, k) => s + (S.colWidths[k] || 100), 0) + 8; }
  function applyColVars() {
    root.style.setProperty('--c-name', S.colWidths.name + 'px');
    root.style.setProperty('--c-date', S.colWidths.date + 'px');
    root.style.setProperty('--c-type', S.colWidths.type + 'px');
    root.style.setProperty('--c-size', S.colWidths.size + 'px');
  }
  const COLS = {name: '名称', date: '修改日期', type: '类型', size: '大小'};
  function buildHead() {
    S.colOrder.forEach((key, idx) => {
      const c = el('div', {class: 'fx-hcell' + (st.sort.key === key ? ' sorted' : ''), draggable: 'true',
        style: {width: 'var(--c-' + (key === 'date' ? 'date' : key) + ')'},
        onclick: () => { if (st.sort.key === key) st.sort.dir *= -1; else { st.sort.key = key; st.sort.dir = 1; }
          S.explorerSort = Object.assign({}, st.sort); saveSettings(); render(); }});
      c.innerHTML = '<span>' + COLS[key] + '</span>' + (st.sort.key === key ? svg(st.sort.dir > 0 ? 'sortAsc' : 'sortDesc', 'sm') : '');
      const grip = el('div', {class: 'fx-grip', title: '拖动调整列宽'});
      let rz = null;
      grip.addEventListener('pointerdown', ev => {
        ev.stopPropagation(); ev.preventDefault();
        rz = {sx: ev.clientX, w0: S.colWidths[key]};
        grip.classList.add('act'); grip.setPointerCapture(ev.pointerId);
      });
      grip.addEventListener('pointermove', ev => {
        if (!rz) return;
        S.colWidths[key] = clamp(rz.w0 + (ev.clientX - rz.sx), key === 'name' ? 90 : 54, 900);
        applyColVars();
        head.style.minWidth = colTotal() + 'px'; rows.style.minWidth = colTotal() + 'px';
      });
      const up = () => { if (!rz) return; rz = null; grip.classList.remove('act'); saveSettings(); };
      grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
      c.appendChild(grip);
      // 列顺序拖拽调整
      c.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/x-col', key); ev.dataTransfer.effectAllowed = 'move'; c.style.opacity = '.4'; });
      c.addEventListener('dragend', () => c.style.opacity = '');
      c.addEventListener('dragover', ev => { if (ev.dataTransfer.types.includes('text/x-col')) { ev.preventDefault(); c.style.boxShadow = 'inset 2px 0 0 var(--acc)'; } });
      c.addEventListener('dragleave', () => c.style.boxShadow = '');
      c.addEventListener('drop', ev => {
        ev.preventDefault(); c.style.boxShadow = '';
        const from = ev.dataTransfer.getData('text/x-col'); if (!from || from === key) return;
        const arr = S.colOrder.filter(k => k !== from);
        arr.splice(arr.indexOf(key), 0, from);
        S.colOrder = arr; saveSettings(); render();
      });
      head.appendChild(c);
    });
  }

  function detailRow(e, i) {
    const n = el('div', {class: 'frow', 'data-path': e.path, 'data-type': e.type, draggable: 'true',

  function gridItem(e, i) {

  /* ---- 缩略图（仅需要时加载） ---- */
  let io = null;
  function observeThumbs() {
    if (io) io.disconnect();
    const targets = $$('[data-thumb]', rows).filter(n => kindOf(n.dataset.thumb) === 'image');
    if (!targets.length) return;
    io = new IntersectionObserver(async (ents) => {
      for (const en of ents) {
        if (!en.isIntersecting) continue;
        io.unobserve(en.target);
        const p = en.target.dataset.thumb;
        try {
          const url = await fileBlobURL(p);
          const img = new Image();
          img.onload = () => {
            if (en.target.classList.contains('gth')) { en.target.innerHTML = ''; en.target.appendChild(img); }
            else { en.target.innerHTML = ''; img.className = 'fthumb'; en.target.appendChild(img); }
          };
          img.src = url; img.alt = '';
        } catch (e) {}
      }
    }, {root: listwrap, rootMargin: '220px'});
    targets.forEach(t => io.observe(t));
  }
  /* ---- 文件夹真实大小（异步、缓存、并发受限） ---- */
  let sizeQueue = [], sizeBusy = 0;
  function computeFolderSizes(list) {
    list.filter(e => e.type === 'dir').forEach(e => {
      if (folderSizeCache.has(e.path)) { paintSize(e.path, folderSizeCache.get(e.path)); return; }
      if (!sizeQueue.includes(e.path)) sizeQueue.push(e.path);
    });
    pumpSizes();
  }
  function pumpSizes() {
    while (sizeBusy < 3 && sizeQueue.length) {
      const p = sizeQueue.shift(); sizeBusy++;
      fs.dirSize(p).then(s => { folderSizeCache.set(p, s); paintSize(p, s); })
        .catch(() => {}).finally(() => { sizeBusy--; pumpSizes(); });
    }
  }
  function paintSize(p, size) {
    const c = rows.querySelector('[data-dsize="' + cssEsc(p) + '"]');
    if (c) c.textContent = fmtSize(size);
  }

  /* ---- 项目交互 ---- */
  function bindItem(n, e) {
    n.addEventListener('click', ev => {
      if (ev.target.closest('.frename')) return;
      if (ev.ctrlKey || ev.metaKey) { st.sel.has(e.path) ? st.sel.delete(e.path) : st.sel.add(e.path); paintSel(); updateStat(); return; }
      if (ev.shiftKey && st.sel.size) {
        const list = filtered(); const paths = list.map(x => x.path);
        const a = paths.indexOf(Array.from(st.sel)[0]), b = paths.indexOf(e.path);
        paths.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(p => st.sel.add(p));
        paintSel(); updateStat(); return;
      }
      const already = st.sel.has(e.path) && st.sel.size === 1;
      st.sel.clear(); st.sel.add(e.path); paintSel(); updateStat();
      if (S.openMode === 'single' && (already || IS_TOUCH === false)) {
        if (already) openEntry(e);
      } else if (S.openMode === 'single' && already) openEntry(e);
    });
    n.addEventListener('dblclick', ev => { ev.stopPropagation(); openEntry(e); });
    n.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation();
      if (!st.sel.has(e.path)) { st.sel.clear(); st.sel.add(e.path); paintSel(); updateStat(); }
      itemMenu(ev.clientX, ev.clientY, e); });
    // 拖出浏览器 + 内部拖拽
    n.addEventListener('mouseenter', () => { if (e.type === 'file') preloadDragData(e.path); }, {passive: true});
    n.addEventListener('dragstart', ev => {
      const paths = st.sel.has(e.path) && st.sel.size > 1 ? Array.from(st.sel) : [e.path];
      ev.dataTransfer.setData('application/x-inkstone-fx', JSON.stringify({paths, from: st.path}));
      ev.dataTransfer.setData('text/plain', paths.map(p => P.base(p)).join(', '));
      ev.dataTransfer.effectAllowed = 'copyMove';
      let added = 0;
      for (const p of paths) {
        const c = dragCache.get(p);
        if (c && c.file && e.type === 'file') {
          try { ev.dataTransfer.items.add(c.file); added++; } catch (err) {}
          try { if (added === 1) ev.dataTransfer.setData('DownloadURL', c.mime + ':' + c.name + ':' + c.url); } catch (err) {}
        }
      }
      win.data.dragPaths = paths;
    });
    n.addEventListener('dragend', () => {
      const paths = win.data.dragPaths || [];
      setTimeout(() => paths.forEach(p => { const c = dragCache.get(p); if (c && c.url) { URL.revokeObjectURL(c.url); dragCache.delete(p); } }), 5200);
      win.data.dragPaths = null;
      $$('.dragover', rows).forEach(x => x.classList.remove('dragover'));
    });
    if (e.type === 'dir') {
      n.addEventListener('dragover', ev => {
        const has = ev.dataTransfer.types.includes('Files') || ev.dataTransfer.types.includes('application/x-inkstone-fx');
        if (!has) return;
        ev.preventDefault(); ev.stopPropagation(); ev.dataTransfer.dropEffect = 'move';
        n.classList.add('drop');
      });
      n.addEventListener('dragleave', () => n.classList.remove('drop'));
      n.addEventListener('drop', async ev => {
        ev.preventDefault(); ev.stopPropagation(); n.classList.remove('drop');
        await dropInto(ev, e.path);
      });
    }
  }
  function openEntry(e) {
    if (e.type === 'dir') { navigate(e.path); return; }
    openPath(e.path, {manga: false});
  }

  /* ---- 拖放处理（外部导入 / 内部移动 / 从桌面拖入） ---- */
  listwrap.addEventListener('dragover', ev => {
    if (ev.dataTransfer.types.includes('Files') || ev.dataTransfer.types.includes('application/x-inkstone')) {
      ev.preventDefault(); ev.dataTransfer.dropEffect = ev.dataTransfer.types.includes('Files') ? 'copy' : 'move';
    }
  });
  listwrap.addEventListener('drop', async ev => {
    if (ev.target.closest('.frow[data-type="dir"],.gitem[data-type="dir"]')) return;
    ev.preventDefault();
    await dropInto(ev, st.path);
  });
  async function dropInto(ev, dirPath) {
    const dt = ev.dataTransfer;
    if (dt.types.includes('Files') && dt.items && dt.items.length) {
      const entries = [];
      for (let i = 0; i < dt.items.length; i++) {
        const it = dt.items[i]; if (it.kind !== 'file') continue;
        const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
        if (en) entries.push(en);
      }
      const files = dt.files ? Array.from(dt.files) : [];
      toast('正在导入到 ' + dirPath, (entries.length || files.length) + ' 项', 'ok', 1500);
      try {
        if (entries.length) for (const en of entries) await fs.importEntry(en, dirPath);
        else for (const f of files) { const buf = await f.arrayBuffer(); await fs.importBlob(new Blob([buf], {type: f.type}), f.name, dirPath, {mtime: f.lastModified}); }
        toast('导入完成', dirPath, 'ok'); load(); Desktop.refresh();
      } catch (err) { toast('导入失败', err.message, 'err'); }
      return;
    }
    const rawFx = dt.getData('application/x-inkstone-fx');
    if (rawFx) {
      const d = JSON.parse(rawFx);
      let n = 0;
      for (const p of d.paths) {
        if (P.dir(p) === dirPath) continue;
        const to = P.join(dirPath, P.base(p));
        try { await fs.rename(p, to); n++; }
        catch (err) { try { await fs.copy(p, to, {preserveMtime: true}); await fs.rm(p, {recursive: true}); n++; } catch (e2) { toast('移动失败', e2.message, 'err'); } }
      }
      if (n) toast('已移动 ' + n + ' 项到 ' + dirPath, '', 'ok', 2000);
      st.sel.clear(); load(); return;
    }
    const rawD = dt.getData('application/x-inkstone');
    if (rawD) {
      const d = JSON.parse(rawD);
      if (!d.paths || !d.paths.length) return;
      let n = 0;
      for (const p of d.paths) {
        const to = P.join(dirPath, P.base(p));
        if (P.norm(to) === P.norm(p)) continue;
        try { await fs.rename(p, to); n++; } catch (err) { try { await fs.copy(p, to, {preserveMtime: true}); await fs.rm(p, {recursive: true}); n++; } catch (e2) {} }
      }
      if (n) toast('已移动 ' + n + ' 项', dirPath, 'ok', 2000);
      Desktop.refresh(); load();
    }
  }

/* ============================================================================
   15 · 归档：ZIP（保留修改日期）/ TAR / GZ（原生 DecompressionStream）/ 7z（懒加载）
   ========================================================================== */
function zipDateFix(d) {
  // JSZip 按本地时间解析 DOS 时间；若解出的时间与你的时区恰好偏差一个时区，可在设置中开启修正
  if (!d || isNaN(d.getTime())) return Date.now();
  return S.zipTzFix ? d.getTime() - d.getTimezoneOffset() * 60000 : d.getTime();
}
async function ensureJSZip() {
  if (window.JSZip) return window.JSZip;
  await loadScript('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
  if (!window.JSZip) throw new Error('JSZip 加载失败（网络不可用），无法处理 ZIP');
  return window.JSZip;
}
async function zipPaths(paths, outName) {
  const JSZip = await ensureJSZip();
  const zip = new JSZip();
  for (const p of paths) {
    const stt = await fs.stat(p);
    if (stt.type === 'file') {
      const blob = await fs.readBlob(p);
      // 保留原始修改时间（date 传入 Date 对象，压缩时写回 DOS 时间）
      zip.file(P.base(p), blob, {date: new Date(stt.mtime || Date.now()), createFolders: false});
    } else {
      const walk = async (dir, prefix) => {
        const list = await fs.readdir(dir);
        if (!list.length) zip.folder(prefix);
        for (const e of list) {
          if (e.type === 'dir') await walk(e.path, prefix + e.name + '/');
          else { const b = await fs.readBlob(e.path); zip.file(prefix + e.name, b, {date: new Date(e.mtime || Date.now())}); }
        }
      };
      await walk(p, P.base(p) + '/');
    }
  }
  return await zip.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 6}});
}
async function makeZip(paths, destDir) {
  try {
    toast('正在压缩', paths.length + ' 项…', 'ok', 1400);
    const base = paths.length === 1 ? P.base(paths[0]) : '归档';
    const list = (await fs.readdir(destDir)).map(e => e.name);
    const name = P.uniqueName(destDir, base + '.zip', list);
    const blob = await zipPaths(paths, name);
    await fs.writeFile(P.join(destDir, name), blob);
    toast('压缩完成', P.join(destDir, name) + ' · ' + fmtSize(blob.size), 'ok');
    Desktop.refresh();

  } catch (e) { toast('压缩失败', e.message, 'err'); }
}
async function extractArchive(path, destDir) {
  const ext = P.ext(path); const base = P.base(path).replace(/\.(zip|7z|tar|gz|tgz|bz2)$/i, '');
  const target = P.join(destDir, base);
  toast('正在解压', path + ' → ' + target, 'ok', 1500);
  try {
    await fs.mkdir(target, {recursive: true, force: true});
    if (KIND.zip.includes(ext)) await extractZip(path, target);
    else if (ext === '7z') await extract7z(path, target);
    else if (ext === 'tar') await extractTar(await (await fs.readBlob(path)).arrayBuffer(), target);
    else if (ext === 'tgz' || /\.tar\.gz$/i.test(P.base(path))) {
      const buf = await gunzip(await (await fs.readBlob(path)).arrayBuffer());
      await extractTar(buf, target);
    } else if (ext === 'gz') {
      const buf = await gunzip(await (await fs.readBlob(path)).arrayBuffer());
      await fs.writeFile(P.join(destDir, base), buf);
    } else throw new Error('暂不支持的归档格式: .' + ext);
    const cnt = await countItems(target);
    toast('解压完成', target + ' · ' + cnt.files + ' 个文件（修改日期已保留）', 'ok', 4200);
    Desktop.refresh();

  } catch (e) { toast('解压失败', e.message, 'err'); }

async function extractZip(path, target) {
  const JSZip = await ensureJSZip();
  const blob = await fs.readBlob(path);
  const zip = await JSZip.loadAsync(blob);
  const files = [];
  zip.forEach((rel, entry) => files.push({rel, entry}));
  let i = 0;
  for (const f of files) {
    const rel = decodeURIComponent(f.rel.replace(/\\/g, '/'));
    if (rel.includes('..')) continue;
    const out = P.join(target, rel);
    if (f.entry.dir) { await fs.mkdir(out, {recursive: true, force: true}); continue; }
    await fs.mkdir(P.dir(out), {recursive: true, force: true});
    const content = await f.entry.async('uint8array');
    // 保留 ZIP 内记录的修改时间
    await fs.writeFile(out, new Blob([content]), {mtime: zipDateFix(f.entry.date)});
    i++;
    if (i % 12 === 0) await new Promise(r => setTimeout(r));
  }
  return i;
}
async function gunzip(buf) {
  if (typeof DecompressionStream === 'undefined') throw new Error('此浏览器不支持 DecompressionStream，无法解压 .gz');
  const ds = new DecompressionStream('gzip');

  return await new Response(stream).arrayBuffer();

async function extractTar(buf, target) {
  const u8 = new Uint8Array(buf); let off = 0, n = 0;
  const dec = new TextDecoder();
  while (off + 512 <= u8.length) {
    const header = u8.slice(off, off + 512);
    if (header.every(b => b === 0)) break;
    const nameRaw = dec.decode(header.slice(0, 100)).replace(/\0.*$/, '');
    if (!nameRaw) { off += 512; continue; }
    const sizeStr = dec.decode(header.slice(124, 136)).replace(/\0.*$/, '').trim();
    const size = parseInt(sizeStr, 8) || 0;
    const mtime = (parseInt(dec.decode(header.slice(136, 148)).replace(/\0.*$/, '').trim(), 8) || 0) * 1000;
    const type = String.fromCharCode(header[156]);
    let name = nameRaw;
    // ustar prefix
    const magic = dec.decode(header.slice(257, 263));
    if (magic.startsWith('ustar')) {
      const prefix = dec.decode(header.slice(345, 500)).replace(/\0.*$/, '');
      if (prefix) name = prefix + '/' + nameRaw;
    }
    name = name.replace(/^\.\//, '');
    if (!name.includes('..')) {
      const out = P.join(target, name);
      if (type === '5' || name.endsWith('/')) await fs.mkdir(out, {recursive: true, force: true});
      else {
        await fs.mkdir(P.dir(out), {recursive: true, force: true});
        await fs.writeFile(out, new Blob([u8.slice(off + 512, off + 512 + size)]), {mtime: mtime || Date.now()});
        n++;
      }
    }
    off += 512 + Math.ceil(size / 512) * 512;
  }
  return n;
}
async function extract7z(path, target) {
  let SevenZip;
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
    SevenZip = mod.default || mod;
  } catch (e) { throw new Error('7z 引擎加载失败（需联网）：' + e.message); }
  const Module = await SevenZip();
  const blob = await fs.readBlob(path);
  const buf = new Uint8Array(await blob.arrayBuffer());
  const FS = Module.FS;
  FS.writeFile('/in.7z', buf);
  FS.mkdir('/out');
  const res = Module.callMain(['x', '/in.7z', '-o/out', '-y']);
  if (res !== 0) throw new Error('7z 解压返回错误码 ' + res);
  const walk = (dir, vfsPath) => {
    const list = FS.readdir(dir);
    list.forEach(name => {
      if (name === '.' || name === '..') return;
      const full = dir + '/' + name;
      const st = FS.stat(full);
      if (FS.isDir(st.mode)) { walk(full, P.join(vfsPath, name)); }
      else {
        const data = FS.readFile(full);
        fs.writeFile(P.join(vfsPath, name), new Blob([data]));
      }
    });
  };
  await fs.mkdir(target, {recursive: true, force: true});
  walk('/out', target);
}

    }));
    row(c3, '一键迁移全部文件', '把所有文件字节迁移到指定后端（元数据与修改日期保持不变）', (function () {
      const w = el('div', {class: 'row'});
      const b1 = el('button', {class: 'btn gho', text: '全部迁移到 OPFS', onclick: () => migrateAll('opfs')});
      const b2 = el('button', {class: 'btn gho', text: '全部迁移到 IndexedDB', onclick: () => migrateAll('idb')});
      if (!fs.backendStatus.opfs) b1.disabled = true;

    })());
    const c4 = card('索引维护', '元数据索引保存在 IndexedDB 中；若出现列表缺失或大小异常，可重新扫描 OPFS 与 IndexedDB 重建。');
    row(c4, '重新扫描并重建索引', '不会删除任何文件字节', (function () { const b = el('button', {class: 'btn gho', html: svg('refresh', 'sm') + '<span>重建索引</span>', onclick: async () => {
      b.disabled = true; toast('正在重建索引', '扫描 OPFS 与 IndexedDB…', 'ok', 2000);
      await fs.rebuildIndex(); folderSizeCache.clear(); Desktop.refresh(); paint(); toast('索引已重建', '', 'ok'); }}); return b; })());
    row(c4, '一键重置系统', '清除全部文件、目录、挂载与索引，恢复到初始状态（不可撤销）', (function () { const b = el('button', {class: 'btn dgr', html: svg('power', 'sm') + '<span>清空并重置</span>', onclick: async () => {
      const ok = await confirmDlg('重置虚拟文件系统', '将删除所有文件与文件夹，并清空 OPFS、IndexedDB 与挂载记录。', '确认重置', true);
      if (!ok) return;
      await fs.resetAll(); S.iconPositions = {}; saveSettings();
      Desktop.refresh(); paint(); await seedFirstRun(true);
      toast('系统已重置', '已恢复初始状态并重建示例文件', 'ok');
    }}); return b; })());
    // 目录占用统计
    const top = await fs.topFolders(8).catch(() => []);
    listBox.innerHTML = '';
    if (!top.length) listBox.appendChild(el('div', {class: 'sv-row'}, [el('span', {class: 'nm', text: '暂无统计数据'})]));
    const max = Math.max(1, ...top.map(t => t.size));
    top.forEach(t => {
      const r = el('div', {class: 'sv-row'});
      r.innerHTML = '<span class="nm">' + esc(t.path) + '</span><span class="vb"><i style="width:' + clamp(t.size / max * 100, 2, 100) + '%"></i></span><span class="sz">' + fmtSize(t.size) + '</span>';

      r.onclick = () => WM.open('explorer', {path: t.path});
      listBox.appendChild(r);
    });
    async function migrateAll(store) {
      const ok = await confirmDlg('迁移全部文件', '将把所有文件的字节数据迁移到 ' + store.toUpperCase() + ' 后端。文件名、大小、创建与修改日期保持不变。', '开始迁移');
      if (!ok) return;
      const all = await fs.stat('/').then(() => collectAllFiles());
      let n = 0;
      for (const p of all) { try { await fs.setStore(p, store); n++; } catch (e) {} }
      toast('迁移完成', n + ' 个文件已迁移到 ' + store.toUpperCase(), 'ok');
      paint(); Desktop.refresh();
    }
    async function collectAllFiles() {
      const out = [];
      const walk = async (p, d) => { if (d > 8) return; let l; try { l = await fs.readdir(p); } catch (e) { return; }
        for (const e of l) { if (e.type === 'dir') { if (!e.path.startsWith('/mnt/local')) await walk(e.path, d + 1); } else if (e.store !== 'mnt') out.push(e.path); } };
      await walk('/', 0); return out;
    }
  }

async function seedFirstRun(force) {
  const done = await KV.get('seeded', false);
  if (done && !force) return;
  try {
    await fs.mkdir('/Pictures/示例漫画', {recursive: true, force: true});
    const welcome = '# 欢迎使用砚 OS · INKSTONE\n\n这是一个完全运行在浏览器中的桌面环境。\n\n## 你可以做什么\n\n- **拖拽导入**：把电脑上的文件/文件夹拖到桌面，直接写入 OPFS。\n- **拖拽导出**：把桌面或文件管理器里的文件拖出浏览器窗口，即可下载到真实桌面（移动端请使用右键「导出到电脑」）。\n- **自由摆放图标**：桌面图标可以拖到任意位置，位置会被记住。\n- **框选**：在桌面或文件管理器空白处按住拖动即可框选多个项目。\n- **双后端存储**：每个文件都可以选择存放在 OPFS 或 IndexedDB，右键「存储后端」即可切换，修改日期始终保留。\n- **挂载本地文件夹**：文件管理器左侧「挂载本地文件夹」，真实目录出现在 /mnt/local。\n- **代码编辑器**：支持 HTML/CSS/JS/Markdown/JSON/XML 语法高亮与实时预览，Ctrl+S 保存回文件系统。\n- **漫画阅读器**：双击任意图片可进入条漫模式，自动按 1 → 2 → 10 的自然顺序连读同目录图片。\n- **x86 虚拟机**：载入你自己的 .iso / .img 镜像即可引导（不从网络加载镜像）。\n\n## 数据说明\n\n所有文件保存在浏览器私有的 OPFS / IndexedDB 中，不会上传到任何服务器。清除浏览器站点数据会导致文件丢失，重要文件请及时导出备份。\n';
    await fs.writeFile('/Documents/欢迎使用.md', welcome);
    await fs.writeFile('/Documents/示例数据.csv', '编号,名称,类别,数量,单价,修改说明\n1,砚台,文房,2,188,首批入库\n2,墨条,文房,10,45,\n3,宣纸,文房,40,12,含宣纸 4 尺\n4,笔架,文房,6,32,\n5,镇尺,文房,4,58,黄铜\n');
    const demoHtml = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>砚 OS 示例页面</title>\n<style>\n  :root{--acc:#f2b544}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans SC",sans-serif;background:#0e1418;color:#e8eef2;display:grid;place-items:center;padding:24px}\n  .card{max-width:560px;padding:34px 38px;border:1px solid #2a363f;border-radius:18px;background:linear-gradient(160deg,#151d23,#111820);box-shadow:0 30px 80px rgba(0,0,0,.55)}\n  h1{margin:0 0 6px;font-size:28px;letter-spacing:-.01em}\n  .sub{color:#8ea2ae;font-size:13px;margin:0 0 20px}\n  .row{display:flex;gap:10px;flex-wrap:wrap}\n  button{padding:10px 16px;border-radius:10px;border:1px solid #33424c;background:#1b252c;color:#e8eef2;font-size:13px;cursor:pointer;transition:.18s}\n  button:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}\n  #log{margin-top:18px;padding:12px;border-radius:10px;background:#0b1114;border:1px solid #223039;font:12px/1.7 ui-monospace,monospace;color:#8fd6c6;min-height:60px;white-space:pre-wrap}\n</style>\n</head>\n<body>\n  <div class="card">\n    <h1>虚拟文件系统示例页面</h1>\n    <p class="sub">这个页面存放在 OPFS 中，由代码编辑器的实时预览渲染。</p>\n    <div class="row"><button onclick="hit()">点我一下</button><button onclick="info()">环境信息</button><button onclick="clearLog()">清空</button></div>\n    <div id="log">等待操作…</div>\n  </div>\n<script>\n  let n=0;const log=document.getElementById("log");\n  function hit(){n++;log.textContent+="第 "+n+" 次点击 · "+new Date().toLocaleTimeString("zh-CN")+"\\n";}\n  function info(){log.textContent+="UA: "+navigator.userAgent.slice(0,60)+"…\\n视口: "+innerWidth+"×"+innerHeight+"\\n";}\n  function clearLog(){log.textContent="";n=0;}\n<\/script>\n</body>\n</html>\n';
    await fs.writeFile('/Documents/示例页面.html', demoHtml);
    // 生成三张示例图片，验证漫画阅读器的自然排序（1 → 2 → 10）
    const names = ['1.png', '2.png', '10.png'];
    const base = Date.now() - 86400000 * 3;
    for (let i = 0; i < names.length; i++) {
      const c = document.createElement('canvas'); c.width = 900; c.height = 560;
      const g = c.getContext('2d');
      const grd = g.createLinearGradient(0, 0, 900, 560);
      const pal = [['#101a20', '#2b4a4a', '#f2b544'], ['#131a22', '#3a3050', '#3fc7b0'], ['#1a1418', '#4a2c26', '#e2705a']][i];
      grd.addColorStop(0, pal[0]); grd.addColorStop(.6, pal[1]); grd.addColorStop(1, pal[2]);
      g.fillStyle = grd; g.fillRect(0, 0, 900, 560);
      g.globalAlpha = .16; g.strokeStyle = '#fff'; g.lineWidth = 1;
      for (let y = 40; y < 560; y += 40) { g.beginPath(); g.moveTo(0, y + Math.sin(y / 60) * 12); g.lineTo(900, y - Math.cos(y / 50) * 12); g.stroke(); }
      g.globalAlpha = 1;
      g.fillStyle = 'rgba(255,255,255,.92)'; g.font = '700 74px system-ui,"Noto Sans SC",sans-serif';
      g.fillText('第 ' + names[i].replace('.png', '') + ' 页', 60, 300);
      g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '400 26px ui-monospace,monospace';
      g.fillText('INKSTONE · 自然排序示例（1 → 2 → 10）', 62, 348);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await fs.writeFile('/Pictures/示例漫画/' + names[i], blob, {mtime: base + i * 3600000});
    }
    await KV.set('seeded', true);
  } catch (e) { console.warn('[seed] 示例文件创建失败', e); }
}

async function boot() {
  const t0 = performance.now();
  loadSettings();
  S.zipTzFix = S.zipTzFix === undefined ? false : S.zipTzFix;
  S.notepadFont = S.notepadFont || 14;
  applySettings();
  bootStep(8);
  $('#storeBtn').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    Menu.show(r.left - 150, r.top - 4, [
      {type: 'title', label: '存储后端状态'},
      {label: 'OPFS：' + (fs.backendStatus.opfs ? '可用' : '不可用'), icon: fs.backendStatus.opfs ? 'drive' : 'cloudOff', disabled: true},
      {label: 'IndexedDB：' + (fs.backendStatus.idb ? '可用' : '不可用'), icon: fs.backendStatus.idb ? 'database' : 'cloudOff', disabled: true},
      {label: '本地挂载：' + (MountFS.supports ? '支持' : '不支持'), icon: 'mount', disabled: true},
      '-',
      {label: '默认写入 OPFS', icon: 'drive', checked: S.defaultBackend === 'opfs', action: () => { S.defaultBackend = 'opfs'; saveSettings(); toast('默认后端：OPFS', '', 'ok', 1500); }},
      {label: '默认写入 IndexedDB', icon: 'database', checked: S.defaultBackend === 'idb', action: () => { S.defaultBackend = 'idb'; saveSettings(); toast('默认后端：IndexedDB', '', 'ok', 1500); }},
      '-',
      {label: '打开存储设置', icon: 'settings', action: () => WM.open('settings', {page: 'storage'})}
    ]);
  });
  $('#themeBtn').addEventListener('click', () => toggleTheme());
  $('#taskbar').addEventListener('contextmenu', e => {
    if (e.target.closest('#taskItems')) return;
    e.preventDefault();
    Menu.show(e.clientX, e.clientY - 4, [
      {label: S.taskbarHidden ? '显示任务栏' : '隐藏任务栏', icon: 'desktop', action: () => { S.taskbarHidden = !S.taskbarHidden; applySettings(); WM.onResize(); }},
      {label: '层叠窗口', icon: 'layers', action: () => WM.cascadeAll()},
      {label: '并排平铺', icon: 'split', action: () => WM.tileAll()},
      {label: '显示桌面', icon: 'eye', action: () => WM.toggleDesktop()},
      '-', {label: '任务管理器（关闭窗口）', icon: 'close', action: () => WM.open('settings', {page: 'desktop'})}
    ]);
  });
  bootStep(20);
  try { await fs.init(); }
  catch (e) { console.error(e); toast('文件系统初始化失败', e.message, 'err', 9000); }
  bootStep(55);
  WM.init();
  Desktop.init();
  StartMenu.init();
  Clock.init();
  renderTray();
  bindGlobalKeys();
  bootStep(75);
  await seedFirstRun(false);
  await Wallpaper.apply();
  Desktop.refresh();
  bootStep(92);
  // 挂载点重新授权提醒
  const mounts = await MountFS.list().catch(() => []);
  const needAuth = mounts.filter(m => !MountFS.handles.has(m.name));
  if (needAuth.length) {
    setTimeout(() => toast('本地挂载需要重新授权', needAuth.map(m => m.name).join('、') + ' · 在文件管理器侧栏或设置→本地挂载中点击「重新授权」', 'err', 9000), 900);
  }
  bootStep(100); bootDone();
  const dt = Math.round(performance.now() - t0);
  console.log('%c砚 OS · INKSTONE ' + OS_VER + '%c 就绪（' + dt + 'ms）\nfs API 已挂载到 window.fs；应用注册表 window.APPS；窗口管理器 window.WM。',
    'background:#f2b544;color:#241a04;padding:2px 8px;border-radius:4px;font-weight:700', 'color:#3fc7b0');
  window.OS = {fs, WM, APPS, Desktop, S, version: OS_VER};
  // 首次进入的引导窗口
  if (!await KV.get('welcomed', false)) {
    await KV.set('welcomed', true);
    setTimeout(() => {
      WM.open('explorer', {path: '/Desktop'});
      setTimeout(() => toast('欢迎使用砚 OS', '把文件拖到桌面即可导入；右键桌面可新建、上传、挂载本地文件夹与更换壁纸。', 'ok', 7000), 700);
    }, 320);
  }
}
document.addEventListener('DOMContentLoaded', () => { boot().catch(e => { console.error(e); toast('启动失败', e.message, 'err', 10000); bootDone(); }); });
window.addEventListener('error', e => { console.error('[inkstone]', e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.warn('[inkstone] promise', e.reason); });
</script>
</body>
</html>
