<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#07080c;--bg1:#0c0e14;--bg2:#11141c;--bg3:#171b25;--bg4:#1f2430;
  --ln:#1e2330;--ln2:#2a3142;
  --tx:#e9ecf3;--tx2:#a4abbd;--tx3:#6c7488;--tx4:#454c5e;
  --ac:#22d3ee;--ac2:#818cf8;--acbg:rgba(34,211,238,.1);
  --ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;
  --r:14px;--sh:0 18px 50px -18px rgba(0,0,0,.8);
  --mono:'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',monospace;
  --display:'Orbitron','Noto Sans SC',sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f4f8;--bg1:#ffffff;--bg2:#ffffff;--bg3:#f1f3f7;--bg4:#e7eaf1;
  --ln:#e4e7ee;--ln2:#d3d8e3;--tx:#141823;--tx2:#4a5268;--tx3:#7a8296;--tx4:#a8afbf;
  --ac:#0891b2;--ac2:#6366f1;--acbg:rgba(8,145,178,.08);--sh:0 16px 40px -18px rgba(20,30,60,.28);color-scheme:light;
}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 40% at 10% 0%,rgba(34,211,238,.07),transparent 70%),radial-gradient(50% 40% at 95% 10%,rgba(129,140,248,.07),transparent 70%)}
:root[data-theme=light] body::before{opacity:.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
a{color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* ---------- header ---------- */
.hd{position:relative;z-index:2;max-width:1640px;margin:0 auto;padding:30px 28px 14px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px}
.logo .mk{width:44px;height:44px;border-radius:13px;background:conic-gradient(from 210deg,#e8a050,#10a37f,#60a5fa,#818cf8,#ff8a33,#e8a050);padding:2px;box-shadow:0 10px 30px -10px rgba(34,211,238,.5)}
.logo .mk div{width:100%;height:100%;border-radius:11px;background:var(--bg1);display:grid;place-items:center}
.logo h1{margin:0;font-family:var(--display);font-size:22px;letter-spacing:2px;font-weight:700}
.logo h1 b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:2px 0 0;color:var(--tx3);font-size:12.5px}
.kpis{display:flex;gap:26px;margin-left:auto}
.kp .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:0;line-height:1.15}
.kp .l{font-size:11.5px;color:var(--tx3);letter-spacing:.06em}
.hacts{display:flex;gap:8px;align-items:center}
.src{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--ln2);font-size:12px;color:var(--tx2);background:var(--bg2);white-space:nowrap;cursor:pointer}
.src i{width:7px;height:7px;border-radius:50%;background:var(--tx4)}
.src.live i{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.15)}
.src.off i{background:var(--warn)}
.src.check i{background:var(--warn)}
.src.busy i{background:var(--ac);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}

/* ---------- toolbar ---------- */
.tb{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln);border-top:1px solid var(--ln)}
.tbi{max-width:1640px;margin:0 auto;padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:460px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);width:16px;height:16px}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--ln2);background:var(--bg2);padding:0 64px 0 38px;outline:none;transition:.15s}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acbg)}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--ln2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--tx3);background:var(--bg3)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 11px;border-radius:7px;color:var(--tx2);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button svg{width:15px;height:15px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--bg4);color:var(--tx)}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx3)}
select,input[type=date],input[type=number]{height:34px;border-radius:9px;border:1px solid var(--ln2);background:var(--bg2);padding:0 9px;outline:none;min-width:0}
select:focus,input:focus{border-color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--ln2);background:var(--bg2);font-weight:500;white-space:nowrap;transition:.15s;font-size:13px}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn svg{width:16px;height:16px}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.pri{background:var(--ac);border-color:transparent;color:#04131a;font-weight:600}
.btn.pri:hover{filter:brightness(1.1);color:#04131a}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--bg3);color:var(--tx)}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln2);background:var(--bg2);display:grid;place-items:center;color:var(--tx2);transition:.15s;flex:none}
.ib:hover{color:var(--ac);border-color:var(--ac)}
.ib svg{width:17px;height:17px}
.ib.sm{width:30px;height:30px;border-radius:8px}.ib.sm svg{width:15px;height:15px}
.ib.on{color:var(--ac);border-color:var(--ac);background:var(--acbg)}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:1;max-width:1640px;margin:0 auto;padding:18px 28px 120px;display:grid;grid-template-columns:268px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.fs{border-bottom:1px solid var(--ln);padding:12px 0 14px}
.fs:first-child{padding-top:0}
.fs h4{margin:0 0 9px;font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.08em;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.fs h4 .clr{margin-left:auto;font-weight:500;letter-spacing:0;color:var(--ac);font-size:11.5px;display:none}
.fs.act h4 .clr{display:inline}
.fs h4 .car{transition:.2s;opacity:.6}
.fs.col h4 .car{transform:rotate(-90deg)}
.fs.col .fb{display:none}
.fb{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2);user-select:none;border:1px solid transparent;transition:background .12s}
.opt:hover{background:var(--bg3);color:var(--tx)}
.opt .dot{width:9px;height:9px;border-radius:3px;flex:none}
.opt .n{margin-left:auto;font-size:11.5px;color:var(--tx4);font-family:var(--mono)}
.opt.on{background:color-mix(in srgb,var(--c,var(--ac)) 12%,transparent);color:var(--tx);border-color:color-mix(in srgb,var(--c,var(--ac)) 35%,transparent)}
.opt.on .n{color:var(--c,var(--ac))}
.opt.zero{opacity:.38}
.opt .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.ch{height:27px;padding:0 10px;border-radius:99px;border:1px solid var(--ln2);background:var(--bg2);font-size:12.5px;color:var(--tx2);display:inline-flex;align-items:center;gap:5px;transition:.12s}
.ch:hover{color:var(--tx);border-color:var(--tx4)}
.ch.on{color:var(--c,var(--ac));border-color:var(--c,var(--ac));background:color-mix(in srgb,var(--c,var(--ac)) 12%,transparent)}
.ch small{color:var(--tx4);font-family:var(--mono);font-size:11px}
.rng{display:flex;gap:6px;align-items:center}
.rng input,.rng select{flex:1;width:0}
.rng span{color:var(--tx4)}
.more{font-size:12px;color:var(--ac);background:none;border:0;padding:4px 8px;text-align:left}
.mini{font-size:11.5px;color:var(--tx3);margin-top:6px}

/* ---------- results header ---------- */
.rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-height:36px}
.rh .cnt{font-size:14px;color:var(--tx2)}
.rh .cnt b{color:var(--tx);font-size:17px}
.achips{display:flex;gap:6px;flex-wrap:wrap}
.ac{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 5px 0 10px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--c,var(--ac)) 12%,transparent);color:var(--c,var(--ac));border:1px solid color-mix(in srgb,var(--c,var(--ac)) 30%,transparent)}
.ac button{width:18px;height:18px;border:0;border-radius:50%;background:none;color:inherit;display:grid;place-items:center;padding:0;opacity:.75}
.ac button:hover{opacity:1;background:color-mix(in srgb,var(--c,var(--ac)) 22%,transparent)}
.share{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--bg3);margin-bottom:6px;gap:2px}
.share i{display:block;height:100%;cursor:pointer;transition:filter .15s;min-width:3px}
.share i:hover{filter:brightness(1.3)}
.shl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.shl button{--c:var(--tx);display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid var(--ln2);border-radius:20px;background:transparent;color:var(--tx2);font-size:13px;line-height:1.4;white-space:nowrap;transition:all .25s}
.shl button b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--tx4);transition:color .25s}
/* 悬停与选中共用同一套配色：移上去什么样，点上去就什么样（与原入口页一致） */
.shl button:hover,.shl button.on{border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 15%,transparent)}
.shl button:hover b,.shl button.on b{color:inherit;opacity:.75}
.shl button[data-sv=all]:hover,.shl button[data-sv=all].on{border-color:var(--ln2);color:var(--tx);background:var(--bg3);box-shadow:none}

/* activity strip */
.strip{position:relative;height:74px;margin-bottom:16px;background:var(--bg1);border:1px solid var(--ln);border-radius:12px;padding:8px 10px 18px;user-select:none}
.strip svg{width:100%;height:100%;overflow:visible;cursor:crosshair}
.strip .lab{position:absolute;left:12px;top:6px;font-size:11px;color:var(--tx3);pointer-events:none}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{--vc:#888;position:relative;background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r);padding:15px 16px 13px;cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;display:flex;flex-direction:column;min-height:158px;outline:none;animation:ci .35s both}
@keyframes ci{from{opacity:0;transform:translateY(6px)}}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 100% 0%,color-mix(in srgb,var(--vc) 16%,transparent),transparent 60%);pointer-events:none;opacity:.8;transition:.2s}
.card::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--vc);opacity:.85}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--vc) 45%,var(--ln));box-shadow:0 16px 40px -20px color-mix(in srgb,var(--vc) 55%,transparent)}
.card:hover::before{opacity:1}
.card .mono{position:absolute;right:-6px;bottom:-26px;font-size:96px;font-weight:800;color:var(--vc);opacity:.06;line-height:1;pointer-events:none;letter-spacing:-.05em}
.card .top{display:flex;align-items:flex-start;gap:8px;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:500;line-height:1.6;font-family:var(--mono);letter-spacing:.5px;background:color-mix(in srgb,var(--vc) 14%,transparent);color:var(--vc);border:1px solid color-mix(in srgb,var(--vc) 28%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .cd{display:inline-flex;gap:2px}
.badge .cd i{width:7px;height:7px;border-radius:50%}
.card .tools{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.15s;position:relative;z-index:2}
.card:hover .tools,.card:focus-within .tools,.card .tools.keep{opacity:1}
.tbtn{width:27px;height:27px;border-radius:7px;border:1px solid var(--ln2);background:var(--bg1);color:var(--tx3);display:grid;place-items:center;padding:0}
.tbtn:hover{color:var(--tx)}
.tbtn svg{width:14px;height:14px}
.tbtn.on{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--ln2))}
.tbtn.cmp.on{color:var(--ac);border-color:var(--ac);background:var(--acbg)}
.card h3{margin:12px 0 2px;font-size:18px;font-weight:650;letter-spacing:-.005em;line-height:1.3;position:relative;word-break:break-word}
.card .sub{font-size:12px;color:var(--tx3);position:relative;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .sub .v{color:var(--tx2)}
.card .meta{margin-top:auto;padding-top:12px;display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--tx3);position:relative;flex-wrap:wrap}
.card .meta .go{margin-left:auto;color:var(--vc);display:flex;align-items:center;gap:4px;font-weight:600;opacity:.0;transform:translateX(-4px);transition:.18s}
.card:hover .meta .go{opacity:1;transform:none}
.card .seen{position:absolute;right:12px;top:44px;width:6px;height:6px;border-radius:50%;background:var(--tx4)}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--bg4);color:var(--tx2)}
.pal{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:10px;position:relative}
.pal i{flex:1}
.grid.dense .card{min-height:128px;padding:12px 13px 11px}
.grid.dense .card h3{font-size:15.5px;margin-top:9px}
.grid.dense .mono{font-size:72px;bottom:-20px}

.gh{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.gh:first-child{margin-top:0}
.gh h3{margin:0;font-size:15px;font-weight:650}
.gh .n{color:var(--tx3);font-size:12.5px}
.gh .dot{width:10px;height:10px;border-radius:3px}
.gh .right{margin-left:auto;display:flex;gap:6px}

/* list */
.tw{overflow:auto;border:1px solid var(--ln);border-radius:12px;background:var(--bg2)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.t th{position:sticky;top:0;background:var(--bg3);text-align:left;font-size:12px;font-weight:600;color:var(--tx2);padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
.t th:hover{color:var(--tx)}
.t th.on{color:var(--ac)}
.t td{padding:8px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer;transition:background .1s}
.t tbody tr:hover td{background:var(--bg3)}
.t .nm{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.t .r{text-align:right}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--ac);vertical-align:middle;opacity:.7}

/* timeline */
.tl{position:relative}
.tlm{display:grid;grid-template-columns:120px 1fr;gap:18px;margin-bottom:6px}
.tlm .mh{position:sticky;top:74px;align-self:start;padding-top:6px}
.tlm .mh b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.tlm .mh span{font-size:12px;color:var(--tx3)}
.tlm .mh .mbar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:8px;gap:1px}
.tlm .items{border-left:2px solid var(--ln);padding:4px 0 18px 20px;display:flex;flex-direction:column;gap:6px}
.tli{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--ln);cursor:pointer;transition:.15s}
.tli:hover{border-color:color-mix(in srgb,var(--vc) 50%,var(--ln));transform:translateX(3px)}
.tli::before{content:"";position:absolute;left:-27px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--vc);box-shadow:0 0 0 3px var(--bg)}
.tli .d{font-family:var(--mono);font-size:12px;color:var(--tx3);width:38px}
.tli .nm{font-weight:600;min-width:120px}
.tli .badge{flex:none}
.tli .v{font-size:12px;color:var(--tx3);margin-left:auto;font-family:var(--mono)}

/* empty */
.empty{padding:70px 20px;text-align:center;color:var(--tx3)}
.empty svg{margin:0 auto 12px;width:40px;height:40px;opacity:.6}

/* ---------- compare tray ---------- */
.tray{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:40;background:color-mix(in srgb,var(--bg1) 94%,transparent);backdrop-filter:blur(14px);border:1px solid var(--ln2);border-radius:16px;box-shadow:var(--sh);padding:9px 10px 9px 16px;display:flex;align-items:center;gap:10px;transition:transform .28s cubic-bezier(.3,.8,.3,1);max-width:calc(100vw - 24px)}
.tray.on{transform:translate(-50%,0)}
.tray .tt{font-size:12.5px;color:var(--tx3);white-space:nowrap}
.tray .its{display:flex;gap:6px;overflow:auto}

async function syncTree(force) {
  const cache = LS.get('tree', null);
  // 60 秒内刚读过就不再请求：不登录时每个 IP 每小时只有 60 次，连 304 也算一次，频繁刷新会很快用完
  if (!force && cache && cache.etag && Date.now() - (cache.at || 0) < 60e3) { LIST_STATE = 'ok'; setWorks(cache.list, 'live', `GitHub 实时 · ${cache.list.length} 件`); render(); fillUploadTimes(); return; }
  setSrc('busy', '同步中…');
  try {
    const h = { Accept: 'application/vnd.github+json' };
    if (cache && cache.etag && !force) h['If-None-Match'] = cache.etag;
    let r;
    try { r = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/git/trees/HEAD?recursive=1`, { headers: h, cache: 'no-store' }); }
    catch (e) { API_ERR = '连不上 GitHub API（离线、网络或代理拦截）'; throw e; }
    if (!r.ok && r.status !== 304) {
      const rem = r.headers.get('X-RateLimit-Remaining'), rs = +r.headers.get('X-RateLimit-Reset');
      if ((r.status === 403 || r.status === 429) && rem === '0') {
        const t = rs ? new Date(rs * 1000) : null;
        API_ERR = `GitHub API 额度用完（不登录时每个网络 IP 每小时 60 次，同一出口 IP 的其他人也会占用）${t ? `，${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} 恢复` : ''}`;
      } else if (r.status === 404) API_ERR = `GitHub 上找不到仓库 ${CFG.owner}/${CFG.repo}（HTTP 404，仓库名不对或是私有仓库）`;
      else API_ERR = `GitHub API 返回 HTTP ${r.status}`;
      throw new Error(API_ERR);
    }
    API_ERR = ''; LIST_STATE = 'ok';
    if (r.status === 304 && cache) { cache.at = Date.now(); LS.set('tree', cache); setWorks(cache.list, 'live', `GitHub 实时 · ${W.length} 件`); render(); fillUploadTimes(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const list = (j.tree || []).filter(t => t.type === 'blob' && !t.path.includes('/') && RE_FILE.test(t.path)).map(t => [t.path, t.size]);
    if (!list.length) { LIST_STATE = 'empty'; LS.set('tree', { etag: r.headers.get('ETag'), at: Date.now(), list }); setWorks([], 'live', 'GitHub 实时 · 0 件'); render(); return; }
    LS.set('tree', { etag: r.headers.get('ETag'), at: Date.now(), list });
    const before = new Set(W.map(w => w.file));
    setWorks(list, 'live', `GitHub 实时 · ${list.length} 件`);
    const added = list.filter(x => !before.has(x[0])).length;
    if (added && before.size) toast(`同步完成：发现 ${added} 件新作品`);
    render(); fillUploadTimes();
  } catch (e) {
    console.warn('GitHub 同步失败', e);
    await fallbackList(cache);
  }
}
// GitHub API 用不了时的后备：候选 = 这个仓库的缓存 + 网站上的 works-stats.json + 内置清单（仅 evowebos），
// 再向网站逐个确认文件存在（HEAD 请求，不占 API 额度），只留下真实存在的作品
async function fallbackList(cache) {
  const cand = new Map();
  const add = (f, s, u) => { if (RE_FILE.test(f) && !f.includes('/') && !cand.has(f)) cand.set(f, [f, s ?? null, u ?? null]); };
  if (cache && cache.list) cache.list.forEach(x => add(x[0], x[1], x[2]));
  try { const r = await fetch('works-stats.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); for (const [f, v] of Object.entries(j.works || {})) add(f, v.s, v.u); } } catch (e) { }
  if (HOME) SNAP.forEach(x => add(x[0], x[1], x[2]));
  let list = [...cand.values()];
  if (SAME_ORIGIN && list.length) {
    setSrc('busy', `核对文件中… 0/${list.length}`);
    const ok = new Array(list.length).fill(null); let i = 0, done = 0;
    const one = async () => {
      while (i < list.length) {
        const k = i++;
        try { const r = await fetch(URLF(list[k][0]), { method: 'HEAD', cache: 'no-store' }); ok[k] = r.ok; }
        catch (e) { ok[k] = null; }      // 网络错误：不知道在不在，先保留
        if (++done % 10 === 0) setSrc('busy', `核对文件中… ${done}/${list.length}`);
      }
    };
    await Promise.all(Array.from({ length: 8 }, one));
    if (ok.every(v => v === null)) {      // 整个网站都连不上（离线）：只能用这个仓库自己的缓存
      list = cache && cache.list ? cache.list : [];
      LIST_STATE = list.length ? 'ok' : 'failed';
      setWorks(list, 'off', list.length ? `离线 · 缓存清单 ${list.length} 件` : '离线 · 读不到作品清单'); setSrc('off', $('#src span').textContent, API_ERR); render(); return;
    }
    list = list.filter((x, k) => ok[k] !== false);
    // 核对过的清单存回缓存（etag 清空，API 恢复后会重新完整读取）
    if (list.length) LS.set('tree', { etag: null, at: Date.now(), list });
  } else if (!SAME_ORIGIN) list = cache && cache.list ? cache.list : (HOME ? SNAP : []);
  LIST_STATE = list.length ? 'ok' : 'failed';
  setWorks(list, 'check', list.length ? `已核对 · ${list.length} 件` : '读不到作品清单');
  setSrc('check', $('#src span').textContent, API_ERR);
  render();
}

/* ================= 上传时间（同一天的作品按它排先后） ================= */
let UTIME = LS.get('utime', {});           // 文件名 -> 上传时间（秒），从提交记录读出，永久缓存
async function fillUploadTimes() {
  const miss = new Set(W.filter(w => w.u == null).map(w => w.file));
  if (!miss.size) return;
  try {
    const h = { Accept: 'application/vnd.github+json' };
    const cl = LS.get('commits', null);
    if (cl && cl.etag) h['If-None-Match'] = cl.etag;
    const r = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/commits?per_page=30`, { headers: h, cache: 'no-store' });
    let list;
    if (r.status === 304 && cl) list = cl.list;
    else if (r.ok) { list = (await r.json()).map(c => [c.sha, Date.parse(c.commit.committer.date) / 1000]); LS.set('commits', { etag: r.headers.get('ETag'), list }); }
    else return;
    const seen = LS.get('cdone', []);
    let calls = 0;
    for (const [sha, t] of list) {                 // 从新到旧
      if (!miss.size || calls >= 8) break;
      if (seen.includes(sha)) continue;
      const d = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/commits/${sha}`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'force-cache' });
      calls++;
      if (!d.ok) break;
      for (const f of (await d.json()).files || []) {
        if ((f.status === 'added' || f.status === 'renamed') && !(f.filename in UTIME)) UTIME[f.filename] = t;
        miss.delete(f.filename);
      }
      seen.push(sha);
    }
    LS.set('utime', UTIME); LS.set('cdone', seen.slice(-300));
    let changed = false;
    for (const w of W) if (w.u == null && UTIME[w.file] != null) { w.u = UTIME[w.file]; changed = true; }
    if (changed) render();
  } catch (e) { console.warn('读取上传时间失败', e); }
}

const ARR = ['v', 'ser', 'tier', 'sc', 'ft', 'tg'];
function writeHash() {
  const p = new URLSearchParams();
  for (const k of Object.keys(DEF)) {
    const v = S[k], d = DEF[k];
    if (ARR.includes(k)) { if (v.length) p.set(k, v.join('~')); }
    else if (v !== d && v !== '' && v != null) p.set(k, v);
  }
  if (VW.open) p.set('open', VW.list[VW.i]);
  if (CV.open) p.set('cmp', CMP.join('~'));
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  Object.assign(S, JSON.parse(JSON.stringify(DEF)));
  for (const [k, v] of p) {
    if (!(k in DEF)) continue;
    if (ARR.includes(k)) S[k] = v.split('~').filter(Boolean);
    else if (typeof DEF[k] === 'number' || k === 'd0' || k === 'd1') S[k] = v === '' ? null : +v;
    else S[k] = v;
  }
  return { open: p.get('open'), cmp: p.get('cmp') };
}

    else if (t.dataset.dmx) { const [v, k] = t.dataset.dmx.split('|'); if (v === '特殊提示词') { S.sp = 1; S.q = ''; } else { S.vf = S.vt = v; } S.v = k === 'collab' ? [] : [k]; if (k === 'collab') S.co = 'only'; S.view = 'grid'; }
    update(); scrollTo({ top: 0, behavior: 'smooth' });
  };
}
function chartMonthly(L, Wd) {
  const H = 190, pad = 28;
  const ms = [...new Set(W.map(w => w.ym))].sort();
  if (!ms.length) return '';
  // 补齐空月份
  const all = []; let [y, m] = ms[0].split('.').map(Number); const [y1, m1] = ms[ms.length - 1].split('.').map(Number);
  while (y < y1 || (y === y1 && m <= m1)) { all.push(`${y}.${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } }
  const data = all.map(k => { const g = new Map(); L.filter(w => w.ym === k).forEach(w => g.set(w.cls, (g.get(w.cls) || 0) + 1)); return [k, g]; });
  const mx = Math.max(1, ...data.map(([, g]) => [...g.values()].reduce((s, v) => s + v, 0)));
  const bw = (Wd - pad) / all.length;
  let s = `<svg width="100%" viewBox="0 0 ${Wd} ${H + 22}" class="ax">`;
  for (let i = 0; i <= 4; i++) { const yy = H - i / 4 * (H - 10); s += `<line x1="${pad}" x2="${Wd}" y1="${yy}" y2="${yy}" stroke-dasharray="${i ? '2 4' : ''}"/><text x="${pad - 6}" y="${yy + 4}" text-anchor="end">${Math.round(mx * i / 4)}</text>`; }
  data.forEach(([k, g], i) => {
    let yy = H; const tot = [...g.values()].reduce((s, v) => s + v, 0);
    for (const c of VORDER.concat('collab')) { const n = g.get(c); if (!n) continue; const h = n / mx * (H - 10); yy -= h; s += `<rect x="${pad + i * bw + bw * .15}" y="${yy}" width="${bw * .7}" height="${h}" fill="${vc(c)}" rx="2"/>`; }
    s += `<rect x="${pad + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" style="cursor:pointer" data-dm="${k}" data-tip="${k} · ${tot} 件<br>${VORDER.concat('collab').filter(c => g.get(c)).map(c => `<span style='color:${vc(c)}'>●</span> ${c === 'collab' ? '合作' : VEND[c].n} ${g.get(c)}`).join('<br>')}"/>`;
    if (tot) s += `<text x="${pad + i * bw + bw / 2}" y="${yy - 5}" text-anchor="middle" style="fill:var(--tx2)">${tot}</text>`;
    if (all.length < 16 || i % Math.ceil(all.length / 12) === 0) s += `<text x="${pad + i * bw + bw / 2}" y="${H + 16}" text-anchor="middle">${k.slice(2)}</text>`;
  });
  return s + '</svg>';
}
function chartScatter(L, Wd) {
  if (!L.length) return '<div class="mini">暂无数据</div>';
  const H = 260, pl = 46, pb = 22;
  const d0 = Math.min(...W.map(w => w.dn)) - 3, d1 = Math.max(...W.map(w => w.dn)) + 3;
  const lmax = Math.max(...L.map(w => w.st.l)) * 1.08;
  const smax = Math.max(...L.map(w => w.size || 1));
  const X = d => pl + (d - d0) / (d1 - d0) * (Wd - pl - 8), Y = l => H - pb - l / lmax * (H - pb - 8);
  let s = `<svg width="100%" viewBox="0 0 ${Wd} ${H}" class="ax">`;
  for (let i = 0; i <= 4; i++) { const v = lmax * i / 4, yy = Y(v); s += `<line x1="${pl}" x2="${Wd}" y1="${yy}" y2="${yy}" stroke-dasharray="${i ? '2 4' : ''}"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${fmtN(Math.round(v))}</text>`; }
  const dt = new Date(d0 * 864e5); let mm = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1) / 864e5;
  while (mm < d1) { const t = new Date(mm * 864e5); s += `<text x="${X(mm)}" y="${H - 5}" text-anchor="middle">${String(t.getUTCFullYear()).slice(2)}.${String(t.getUTCMonth() + 1).padStart(2, '0')}</text>`; mm = Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 1) / 864e5; }
  // 趋势线（按月中位数）
  const byM = new Map(); L.forEach(w => { if (!byM.has(w.ym)) byM.set(w.ym, []); byM.get(w.ym).push(w); });
  const pts = [...byM.entries()].sort().map(([k, a]) => { const ls = a.map(w => w.st.l).sort((x, y) => x - y); const [y, m] = k.split('.').map(Number); return [X(Date.UTC(y, m - 1, 15) / 864e5), Y(ls[Math.floor(ls.length / 2)])]; });
  if (pts.length > 1) s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--tx3)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>`;
  for (const w of L.slice().sort((a, b) => (b.size || 0) - (a.size || 0))) {
    const r = 3 + Math.sqrt((w.size || 0) / smax) * 8;
    s += `<circle cx="${X(w.dn)}" cy="${Y(w.st.l)}" r="${r}" fill="${vc(w.cls)}" fill-opacity=".55" stroke="${vc(w.cls)}" stroke-width="1.2" style="cursor:pointer" data-f="${esc(w.file)}" data-tip="<b>${esc(w.name)}</b><br>${esc(w.model)}<br>${w.date} · ${w.st.l.toLocaleString()} 行 · ${fmtKB(w.size)}"/>`;
  }
  return s + `<text x="${Wd - 4}" y="14" text-anchor="end" style="fill:var(--tx3)">- - 月中位数</text></svg>`;
}
function tableVendors(L) {
  const ks = VORDER.concat('collab').filter(k => L.some(w => w.cls === k));
  const mxl = Math.max(1, ...ks.map(k => avg(L.filter(w => w.cls === k && w.st), w => w.st.l)));
  return `<div style="overflow:auto"><table class="t" style="font-size:12.5px"><thead><tr><th>厂商</th><th class="r">作品</th><th>平均行数</th><th class="r">平均大小</th><th class="r">JS%</th><th class="r">能力</th></tr></thead><tbody>${ks.map(k => {
    const a = L.filter(w => w.cls === k), s = a.filter(w => w.st), al = avg(s, w => w.st.l);
    return `<tr data-dv="${k}"><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${vc(k)};margin-right:7px"></span>${k === 'collab' ? '合作' : VEND[k].n}</td><td class="r num">${a.length}</td><td class="num"><span class="bar" style="width:${al / mxl * 70}px;background:${vc(k)};margin-right:6px"></span>${s.length ? Math.round(al).toLocaleString() : '—'}</td><td class="r num">${fmtKB(avg(a, w => w.size))}</td><td class="r num">${s.length ? avg(s, w => w.st.j).toFixed(0) : '—'}</td><td class="r num">${s.length ? avg(s, w => w.st.f.length).toFixed(1) : '—'}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function chartFeats(L, Wd) {
  const n = L.length || 1;
  const rows = FEATS.map(f => [f, L.filter(w => w.st.f.includes(f[0])).length]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
  return `<div style="display:flex;flex-direction:column;gap:5px">${rows.map(([f, c]) => `<div data-dft="${f[0]}" style="display:grid;grid-template-columns:96px 1fr 70px;gap:8px;align-items:center;cursor:pointer;font-size:12.5px;${S.ft.includes(f[0]) ? 'color:var(--ac)' : ''}"><span>${f[1]}</span><span style="height:8px;border-radius:4px;background:var(--bg4);overflow:hidden"><i style="display:block;height:100%;width:${c / n * 100}%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px"></i></span><span class="num" style="color:var(--tx3);text-align:right">${c} · ${Math.round(c / n * 100)}%</span></div>`).join('')}</div>`;
}
function matrixVer(L) {
  const ks = VORDER.concat('collab').filter(k => L.some(w => w.cls === k));
  const vs = [...new Set(L.map(w => w.ver))].sort((a, b) => cmpVer(L.find(w => w.ver === b), L.find(w => w.ver === a)));
  const cnt = (v, k) => L.filter(w => w.ver === v && w.cls === k).length;
  const mx = Math.max(1, ...vs.flatMap(v => ks.map(k => cnt(v, k))));
  return `<div style="overflow:auto"><table class="mx" style="border-collapse:separate;border-spacing:3px"><tr><th></th>${ks.map(k => `<th style="color:${vc(k)}">${k === 'collab' ? '合作' : VEND[k].n}</th>`).join('')}<th>合计</th></tr>${vs.map(v => `<tr><th class="l num">${esc(v)}</th>${ks.map(k => { const c = cnt(v, k); return c ? `<td data-dmx="${esc(v)}|${k}" style="background:color-mix(in srgb,${vc(k)} ${12 + c / mx * 70}%,transparent);color:var(--tx)" data-tip="${esc(v)} · ${k === 'collab' ? '合作' : VEND[k].n} · ${c} 件">${c}</td>` : '<td style="color:var(--tx4);cursor:default">·</td>'; }).join('')}<td class="num" style="color:var(--tx3);cursor:default">${L.filter(w => w.ver === v).length}</td></tr>`).join('')}</table></div>`;
}
function hue(h) { const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; if (!d) return 400 + mx * 10; let H = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return (H * 60 + 360) % 360 + (d < .15 ? 400 : 0); }
function colorWall(L) {
  const arr = L.filter(w => w.st.p.length).map(w => [w, w.st.p.find(h => { const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); return Math.max(r, g, b) - Math.min(r, g, b) > 40; }) || w.st.p[0]]).sort((a, b) => hue(a[1]) - hue(b[1]));
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px">${arr.map(([w, h]) => `<a href="${URLF(w.file)}" data-f="${esc(w.file)}" style="aspect-ratio:1;border-radius:7px;background:linear-gradient(135deg,#${h},#${w.st.p[1] || h});cursor:pointer;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)" data-tip="<b>${esc(w.name)}</b><br>${esc(w.model)}<br><span style='font-family:var(--mono)'>#${h}</span>"></a>`).join('')}</div>`;
}

/* ================= 启动 ================= */
function init() {
  applyTheme(); buildSide(); bind(); buildViewer();
  const h = readHash(); $('#q').value = S.q;
  const cache = LS.get('tree', null);
  if (cache && cache.list && cache.list.length) setWorks(cache.list, 'cache', `缓存清单 · ${cache.list.length} 件`);
  else if (HOME) setWorks(SNAP, 'snap', `内置清单 · ${SNAP.length} 件`);
  else { LIST_STATE = 'loading'; setWorks([], 'busy', '正在读取仓库…'); }
  render();
  if (h.cmp) { const c = h.cmp.split('~').filter(f => BY.has(f)).slice(0, 4); if (c.length >= 2) { CMP = c; openCompare(); } }
  else if (h.open && BY.has(h.open)) openViewer(h.open);
  syncTree();
  loadRemoteStats();
}
init();
