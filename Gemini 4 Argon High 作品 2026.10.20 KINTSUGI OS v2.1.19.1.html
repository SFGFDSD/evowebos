    // Preload Map cache so `dragstart` is 100% SYNCHRONOUS (never uses async/await!)
    const DragPreloadCache = new Map();

    async function preloadFileForDrag(vfsPath) {
      const norm = PathUtils.normalize(vfsPath);
      try {
        const st = await fs.stat(norm);
        if (st.isDirectory()) {
          DragPreloadCache.set(norm, { isDir: true, path: norm, filename: PathUtils.basename(norm) });
          return;
        }
        // Avoid re-creating if already cached with same mtime
        const existing = DragPreloadCache.get(norm);
        if (existing && existing.mtime === st.mtime && existing.blobUrl) return;

        const bytes = await fs.readFile(norm);
        const info = getFileCategoryAndMime(norm, false);
        const filename = PathUtils.basename(norm);
        const file = new File([bytes], filename, { type: info.mime, lastModified: st.mtime || Date.now() });
        const blobUrl = URL.createObjectURL(file);
        DragPreloadCache.set(norm, {
          isDir: false,
          path: norm,
          filename,
          mime: info.mime,
          mtime: st.mtime,
          file,
          blobUrl
        });
      } catch (e) {}
    }

    // Bind native HTML5 draggable="true" to any icon/row element
    function bindNativeDraggable(el, getPathsFn, sourceContext = 'desktop') {
      el.setAttribute('draggable', 'true');

      // Preload asynchronously on mouseenter & mousedown so dragstart is strictly synchronous!
      const triggerPreload = () => {
        const paths = getPathsFn();
        for (const p of paths) preloadFileForDrag(p);
      };
      el.addEventListener('mouseenter', triggerPreload, { passive: true });
      el.addEventListener('mousedown', triggerPreload, { passive: true });

      el.addEventListener('dragstart', (e) => {
        e.stopPropagation();
        const paths = getPathsFn();
        if (!paths || paths.length === 0) return;

        const rect = el.getBoundingClientRect();
        const offsetX = e.clientX - rect.left;
        const offsetY = e.clientY - rect.top;

        // 1. Set internal VFS metadata
        e.dataTransfer.effectAllowed = 'copyMove';
        e.dataTransfer.setData('application/x-kintsugi-vfs', JSON.stringify({
          paths,
          source: sourceContext,
          offsetX,
          offsetY
        }));

        // 2. Synchronous drag-out to physical OS desktop via BOTH items.add(file) AND DownloadURL
        const primaryPath = PathUtils.normalize(paths[0]);
        const cached = DragPreloadCache.get(primaryPath);
        if (cached && !cached.isDir && cached.file && cached.blobUrl) {
          try {
            e.dataTransfer.items.add(cached.file);
          } catch (err) {}
          try {
            // Strict 3-segment DownloadURL: mime:filename:url
            const safeName = cached.filename.replace(/:/g, '_');
            e.dataTransfer.setData('DownloadURL', `${cached.mime}:${safeName}:${cached.blobUrl}`);
          } catch (err) {}
        }
      });

      el.addEventListener('dragend', () => {
        const paths = getPathsFn();
        for (const p of paths) {
          const norm = PathUtils.normalize(p);
          const cached = DragPreloadCache.get(norm);
          if (cached && cached.blobUrl) {
            const urlToRevoke = cached.blobUrl;
            // Strict Requirement 3.3.7: Delay at least 5 seconds before revoking Blob URL!
            setTimeout(() => {
              URL.revokeObjectURL(urlToRevoke);
            }, 6000);
            DragPreloadCache.delete(norm);
          }
        }
      });
    }

    // Reverse Import: Physical Desktop -> Virtual Desktop / Directory
    // Uses webkitGetAsEntry(), loops readEntries() until empty array, uses file.arrayBuffer()
    async function handleExternalDropEntries(dataTransfer, targetDirPath) {
      const items = dataTransfer.items;
      const entries = [];
      if (items && items.length > 0) {
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
            const entry = item.webkitGetAsEntry();
            if (entry) entries.push(entry);
          }
        }
      }

      showLoading('正在从物理桌面导入文件并保留修改日期...');
      let importedCount = 0;

      const processEntry = async (entry, currentTargetDir) => {
        if (entry.isFile) {
          const file = await new Promise((res, rej) => entry.file(res, rej));
          const ab = await file.arrayBuffer(); // Strictly await file.arrayBuffer(), NO Buffer.from()
          const destPath = PathUtils.join(currentTargetDir, file.name);
          await fs.writeFile(destPath, new Uint8Array(ab), { mtime: file.lastModified || Date.now() });
          importedCount++;
        } else if (entry.isDirectory) {
          const newDir = PathUtils.join(currentTargetDir, entry.name);
          await fs.mkdir(newDir);
          const reader = entry.createReader();
          // Strict Requirement 3.3: readEntries() returns max 100 entries; loop until empty array!
          while (true) {
            const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
            if (!batch || batch.length === 0) break;
            for (const childEntry of batch) {
              await processEntry(childEntry, newDir);
            }
          }
        }
      };

      try {
        if (entries.length > 0) {
          for (const entry of entries) {
            await processEntry(entry, targetDirPath);
          }
        } else if (dataTransfer.files && dataTransfer.files.length > 0) {
          for (const file of dataTransfer.files) {
            const ab = await file.arrayBuffer();
            const destPath = PathUtils.join(targetDirPath, file.name);
            await fs.writeFile(destPath, new Uint8Array(ab), { mtime: file.lastModified || Date.now() });
            importedCount++;
          }
        }
        hideLoading();
        if (importedCount > 0) {
          notify(`已成功导入 ${importedCount} 个文件至 ${targetDirPath}`, 'success');
        }
      } catch (err) {
        hideLoading();
        notify('导入文件出错: ' + err.message, 'error');
      }
    }

    // Export / Download helper for Mobile & Context Menu
    async function triggerBrowserDownload(vfsPath) {
      try {
        const st = await fs.stat(vfsPath);
        if (st.isDirectory()) {
          // Automatically zip directory and download
          const zipName = PathUtils.basename(vfsPath) + '.zip';
          const tempZipPath = PathUtils.join('/Archives', zipName);
          await ArchiveEngine.compressToZip([vfsPath], tempZipPath);
          await triggerBrowserDownload(tempZipPath);
          return;
        }
        const bytes = await fs.readFile(vfsPath);
        const info = getFileCategoryAndMime(vfsPath, false);
        const blob = new Blob([bytes], { type: info.mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = PathUtils.basename(vfsPath);
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 6000);
        notify(`已触发下载: ${PathUtils.basename(vfsPath)}`, 'success');
      } catch (err) {
        notify('导出失败: ' + err.message, 'error');
      }
    }

    // ============================================================================
    // SECTION 8: WEB / MOBILE ADAPTIVE MARQUEE SELECTION CONTROLLER (Strict 4.1)
    // ============================================================================
    let GlobalMobileBoxSelectMode = false;

    function getClientXY(e) {
      if (e.touches && e.touches.length > 0) {
        return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
      }
      if (e.changedTouches && e.changedTouches.length > 0) {
        return { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY };
      }
      return { clientX: e.clientX, clientY: e.clientY };
    }

    function createMarqueeController({
      container,
      marqueeEl,
      itemSelector,
      ignoreSelector = '.fe-details-header, button, input, select',
      onSelectionChange,
      allowTouchWithoutToggle = false
    }) {
      let active = false;
      let startX = 0;
      let startY = 0;
      let currentClientX = 0;
      let currentClientY = 0;
      let autoScrollRaf = null;
      const EDGE_ZONE = 40;
      const MAX_SCROLL_SPEED = 14;

      const updateSelectionBox = () => {
        if (!active) return;
        const rect = container.getBoundingClientRect();
        const curX = currentClientX - rect.left + container.scrollLeft;
        const curY = currentClientY - rect.top + container.scrollTop;

        const left = Math.min(startX, curX);
        const top = Math.min(startY, curY);
        const width = Math.abs(curX - startX);
        const height = Math.abs(curY - startY);

        marqueeEl.style.display = 'block';
        marqueeEl.style.left = `${left}px`;
        marqueeEl.style.top = `${top}px`;
        marqueeEl.style.width = `${width}px`;
        marqueeEl.style.height = `${height}px`;

        // AABB Collision Detection using offsetLeft / offsetTop
        const items = container.querySelectorAll(itemSelector);
        const selectedPaths = [];
        items.forEach(item => {
          // Calculate item coordinates relative to container scroll space
          let itemLeft = item.offsetLeft;
          let itemTop = item.offsetTop;
          let p = item.offsetParent;
          while (p && p !== container && container.contains(p)) {
            itemLeft += p.offsetLeft;
            itemTop += p.offsetTop;
            p = p.offsetParent;
          }
          const itemRight = itemLeft + item.offsetWidth;
          const itemBottom = itemTop + item.offsetHeight;

          const hit = !(itemRight < left || itemLeft > left + width || itemBottom < top || itemTop > top + height);
          const path = item.getAttribute('data-path');
          if (hit && path) {
            item.classList.add('selected');
            selectedPaths.push(path);
          } else {
            item.classList.remove('selected');
          }
        });

        if (onSelectionChange) onSelectionChange(selectedPaths);
      };

      const edgeAutoScrollLoop = () => {
        if (!active) return;
        const rect = container.getBoundingClientRect();
        let scrolled = false;

        if (currentClientY < rect.top + EDGE_ZONE && container.scrollTop > 0) {
          const ratio = Math.min(1, (rect.top + EDGE_ZONE - currentClientY) / EDGE_ZONE);
          container.scrollTop -= Math.ceil(ratio * MAX_SCROLL_SPEED);
          scrolled = true;
        } else if (currentClientY > rect.bottom - EDGE_ZONE && container.scrollTop + container.clientHeight < container.scrollHeight) {
          const ratio = Math.min(1, (currentClientY - (rect.bottom - EDGE_ZONE)) / EDGE_ZONE);
          container.scrollTop += Math.ceil(ratio * MAX_SCROLL_SPEED);
          scrolled = true;
        }

        if (currentClientX < rect.left + EDGE_ZONE && container.scrollLeft > 0) {
          const ratio = Math.min(1, (rect.left + EDGE_ZONE - currentClientX) / EDGE_ZONE);
          container.scrollLeft -= Math.ceil(ratio * MAX_SCROLL_SPEED);
          scrolled = true;
        } else if (currentClientX > rect.right - EDGE_ZONE && container.scrollLeft + container.clientWidth < container.scrollWidth) {
          const ratio = Math.min(1, (currentClientX - (rect.right - EDGE_ZONE)) / EDGE_ZONE);
          container.scrollLeft += Math.ceil(ratio * MAX_SCROLL_SPEED);
          scrolled = true;
        }

        if (scrolled) updateSelectionBox();
        autoScrollRaf = requestAnimationFrame(edgeAutoScrollLoop);
      };

      const handleStart = (e) => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        const isTouch = e.type === 'touchstart';
        if (isTouch && !allowTouchWithoutToggle && !GlobalMobileBoxSelectMode) return;

        // Only start on blank space!
        if (e.target.closest(itemSelector)) return;
        if (ignoreSelector && e.target.closest(ignoreSelector)) return;

        const { clientX, clientY } = getClientXY(e);
        const rect = container.getBoundingClientRect();
        // Ignore clicks on native scrollbars
        if (clientX > rect.left + container.clientWidth || clientY > rect.top + container.clientHeight) return;

        active = true;
        startX = clientX - rect.left + container.scrollLeft;
        startY = clientY - rect.top + container.scrollTop;
        currentClientX = clientX;
        currentClientY = clientY;

        // Clear existing selection on blank click
        container.querySelectorAll(itemSelector).forEach(el => el.classList.remove('selected'));
        if (onSelectionChange) onSelectionChange([]);

        if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = requestAnimationFrame(edgeAutoScrollLoop);
      };

      const handleMove = (e) => {
        if (!active) return;
        if (e.type === 'touchmove') {
          e.preventDefault(); // Lock native page scroll during marquee selection
        }
        const { clientX, clientY } = getClientXY(e);
        currentClientX = clientX;
        currentClientY = clientY;
        updateSelectionBox();
      };

      const handleEnd = () => {
        if (!active) return;
        active = false;
        if (autoScrollRaf) {
          cancelAnimationFrame(autoScrollRaf);
          autoScrollRaf = null;
        }
        marqueeEl.style.display = 'none';
        marqueeEl.style.width = '0px';
        marqueeEl.style.height = '0px';
      };

      container.addEventListener('mousedown', handleStart);
      container.addEventListener('touchstart', handleStart, { passive: true });
      document.addEventListener('mousemove', handleMove);
      document.addEventListener('touchmove', handleMove, { passive: false });
      document.addEventListener('mouseup', handleEnd);
      document.addEventListener('touchend', handleEnd);

      return {
        destroy() {
          if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
          container.removeEventListener('mousedown', handleStart);
          container.removeEventListener('touchstart', handleStart);
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('touchmove', handleMove);
          document.removeEventListener('mouseup', handleEnd);
          document.removeEventListener('touchend', handleEnd);
        }
      };
    }

    // ============================================================================
    // SECTION 9: WALLPAPER SYSTEM (Built-in Procedural Art + Custom OPFS Upload)
    // ============================================================================
    const WallpaperSystem = {
      customBlobUrl: null,
      animId: null,

      async apply() {
        const layer = document.getElementById('wallpaper-layer');
        const canvas = document.getElementById('wallpaper-canvas');
        if (!layer || !canvas) return;

        if (this.animId) {
          cancelAnimationFrame(this.animId);
          this.animId = null;
        }

        if (SysConfig.wallpaperPreset === 'custom' && SysConfig.customWallpaperPath) {
          try {
            const bytes = await fs.readFile(SysConfig.customWallpaperPath);
            const info = getFileCategoryAndMime(SysConfig.customWallpaperPath);
            if (this.customBlobUrl) URL.revokeObjectURL(this.customBlobUrl);
            this.customBlobUrl = URL.createObjectURL(new Blob([bytes], { type: info.mime }));
            canvas.style.display = 'none';
            layer.style.backgroundImage = `url("${this.customBlobUrl}")`;
            return;
          } catch (e) {
            SysConfig.wallpaperPreset = 'kintsugi-nebula';
          }
        }

        layer.style.backgroundImage = 'none';
        canvas.style.display = 'block';
        this.renderPreset(canvas, SysConfig.wallpaperPreset || 'kintsugi-nebula');
      },

      renderPreset(canvas, preset) {
        const ctx = canvas.getContext('2d');
        const draw = () => {
          const w = canvas.width = window.innerWidth;
          const h = canvas.height = window.innerHeight;
          const isLight = SysConfig.theme === 'light';

          if (preset === 'porcelain-ink' || isLight && preset === 'kintsugi-nebula') {
            const g = ctx.createLinearGradient(0, 0, w, h);
            if (isLight) {
              g.addColorStop(0, '#efeae1');
              g.addColorStop(0.5, '#e5dfd3');
              g.addColorStop(1, '#d8d0c1');
            } else {
              g.addColorStop(0, '#0a0d14');
              g.addColorStop(0.5, '#111622');
              g.addColorStop(1, '#080a0f');
            }
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
          } else if (preset === 'cinnabar-horizon') {
            const g = ctx.createRadialGradient(w * 0.7, h * 0.3, 40, w * 0.5, h * 0.5, Math.max(w, h));
            g.addColorStop(0, '#2c1215');
            g.addColorStop(0.45, '#140c12');
            g.addColorStop(1, '#07080c');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
          } else if (preset === 'jade-matrix') {
            const g = ctx.createRadialGradient(w * 0.25, h * 0.75, 40, w * 0.5, h * 0.5, Math.max(w, h));
            g.addColorStop(0, '#0c2622');
            g.addColorStop(0.5, '#0a1419');
            g.addColorStop(1, '#06080b');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
          } else {
            // Default: kintsugi-nebula
            const g = ctx.createRadialGradient(w * 0.65, h * 0.28, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.9);
            g.addColorStop(0, '#1e1912');
            g.addColorStop(0.4, '#0f121a');
            g.addColorStop(1, '#07080b');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
          }

          // Tectonic Kintsugi Gold Veins & Astrolabe Rings
          const accent = SysConfig.accent || '#d4a853';
          ctx.save();
          ctx.strokeStyle = hexToRgba(accent, isLight ? 0.22 : 0.16);
          ctx.lineWidth = 1.2;
          const cx = w * 0.65;
          const cy = h * 0.36;
          for (let r = 80; r < Math.max(w, h) * 0.85; r += 110) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          // Diagonal Kintsugi fracture lines
          ctx.strokeStyle = hexToRgba(accent, isLight ? 0.35 : 0.26);
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(0, h * 0.72);
          ctx.lineTo(w * 0.28, h * 0.58);
          ctx.lineTo(w * 0.48, h * 0.63);
          ctx.lineTo(cx, cy);
          ctx.lineTo(w * 0.82, h * 0.18);
          ctx.lineTo(w, h * 0.12);
          ctx.stroke();

          ctx.fillStyle = hexToRgba(accent, 0.55);
          [[w * 0.28, h * 0.58], [w * 0.48, h * 0.63], [cx, cy], [w * 0.82, h * 0.18]].forEach(([px, py]) => {
            ctx.beginPath();
            ctx.arc(px, py, 3.5, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        };
        draw();
      },

      async uploadCustomWallpaper(file) {
        if (!file) return;
        showLoading('正在将壁纸写入 OPFS 持久化存储...');
        try {
          const ab = await file.arrayBuffer();
          const savePath = PathUtils.join('/Pictures', 'wallpaper_' + file.name);
          await fs.writeFile(savePath, new Uint8Array(ab), { mtime: file.lastModified || Date.now() });
          SysConfig.wallpaperPreset = 'custom';
          SysConfig.customWallpaperPath = savePath;
          saveSysConfig();
          await this.apply();
          hideLoading();
          notify('自定义壁纸已保存至 OPFS 并设为桌面背景', 'success');
        } catch (err) {
          hideLoading();
          notify('设置壁纸失败: ' + err.message, 'error');
        }
      }
    };

    window.addEventListener('resize', () => WallpaperSystem.apply());

    // ============================================================================
    // SECTION 10: WINDOW MANAGER (Drag, 8-Way Resize, Aero Snap, Aero Peek, Z-Index)
    // ============================================================================
    const WindowManager = {
      windows: new Map(), // winId -> { id, appId, title, icon, el, bodyEl, minimized, maximized, zIndex, onCleanup }
      topZ: 200,
      activeWinId: null,
      winCounter: 1,

      createWindow({ appId, title, icon, width = 840, height = 560, x, y, onCleanup, singleInstanceKey }) {
        if (singleInstanceKey) {
          for (const [, w] of this.windows) {
            if (w.singleInstanceKey === singleInstanceKey) {
              if (w.minimized) this.restoreWindow(w.id);
              this.focusWindow(w.id);
              return w;
            }
          }
        }

        const winId = `win_${this.winCounter++}`;
        const stageW = window.innerWidth;
        const stageH = window.innerHeight - 52;
        const finalW = Math.min(width, stageW - 16);
        const finalH = Math.min(height, stageH - 16);
        const offsetStep = ((this.windows.size % 6) * 26);
        const finalX = x !== undefined ? x : Math.max(8, Math.floor((stageW - finalW) / 2) + offsetStep);
        const finalY = y !== undefined ? y : Math.max(8, Math.floor((stageH - finalH) / 2) + offsetStep);

        const winEl = document.createElement('div');
        winEl.className = 'os-window';
        winEl.id = winId;
        winEl.style.width = `${finalW}px`;
        winEl.style.height = `${finalH}px`;
        winEl.style.left = `${finalX}px`;
        winEl.style.top = `${finalY}px`;
        winEl.style.zIndex = ++this.topZ;

        winEl.innerHTML = `
          <div class="resizer resizer-n" data-dir="n"></div>
          <div class="resizer resizer-s" data-dir="s"></div>
          <div class="resizer resizer-e" data-dir="e"></div>
          <div class="resizer resizer-w" data-dir="w"></div>
          <div class="resizer resizer-ne" data-dir="ne"></div>
          <div class="resizer resizer-nw" data-dir="nw"></div>
          <div class="resizer resizer-se" data-dir="se"></div>
          <div class="resizer resizer-sw" data-dir="sw"></div>
          <div class="win-titlebar">
            <div class="win-title-group">
              <span class="w-4 h-4 flex items-center justify-center text-[var(--accent)] shrink-0">${icon || Icons.logo}</span>
              <span class="win-title-text">${escapeHtml(title)}</span>
            </div>
            <div class="win-controls">
              <button class="win-ctrl-btn min-btn" title="最小化">${Icons.min}</button>
              <button class="win-ctrl-btn max-btn" title="最大化 / 还原">${Icons.max}</button>
              <button class="win-ctrl-btn close-btn" title="关闭窗口">${Icons.close}</button>
            </div>
          </div>
          <div class="win-body"></div>
        `;

        document.getElementById('windows-layer').appendChild(winEl);

        const winObj = {
          id: winId,
          appId,
          title,
          icon: icon || Icons.logo,
          el: winEl,
          bodyEl: winEl.querySelector('.win-body'),
          titleTextEl: winEl.querySelector('.win-title-text'),
          minimized: false,
          maximized: stageW < 640, // Auto-maximize on phones for ergonomics
          zIndex: this.topZ,
          onCleanup,
          singleInstanceKey,
          prevRect: { left: finalX, top: finalY, width: finalW, height: finalH }
        };

        if (winObj.maximized) {
          winEl.classList.add('maximized');
        }

        this.windows.set(winId, winObj);
        this._bindWindowEvents(winObj);
        this.focusWindow(winId);
        this.renderTaskbar();
        return winObj;
      },

      setTitle(winId, newTitle) {
        const w = this.windows.get(winId);
        if (!w) return;
        w.title = newTitle;
        w.titleTextEl.textContent = newTitle;
        this.renderTaskbar();
      },

      focusWindow(winId) {
        const w = this.windows.get(winId);
        if (!w) return;
        this.activeWinId = winId;
        w.zIndex = ++this.topZ;
        w.el.style.zIndex = w.zIndex;
        for (const [id, item] of this.windows) {
          item.el.classList.toggle('active-window', id === winId && !item.minimized);
        }
        this.renderTaskbar();
      },

      minimizeWindow(winId) {
        const w = this.windows.get(winId);
        if (!w) return;
        w.minimized = true;
        w.el.classList.add('minimized');
        w.el.classList.remove('active-window');
        if (this.activeWinId === winId) this.activeWinId = null;
        this.renderTaskbar();
      },

      restoreWindow(winId) {
        const w = this.windows.get(winId);
        if (!w) return;
        w.minimized = false;
        w.el.classList.remove('minimized');
        this.focusWindow(winId);
      },

      toggleMaximize(winId) {
        const w = this.windows.get(winId);
        if (!w) return;
        if (w.maximized) {
          w.maximized = false;
          w.el.classList.remove('maximized');
          w.el.style.left = `${w.prevRect.left}px`;
          w.el.style.top = `${w.prevRect.top}px`;
          w.el.style.width = `${w.prevRect.width}px`;
          w.el.style.height = `${w.prevRect.height}px`;
        } else {
          w.prevRect = {
            left: w.el.offsetLeft,
            top: w.el.offsetTop,
            width: w.el.offsetWidth,
            height: w.el.offsetHeight
          };
          w.maximized = true;
          w.el.classList.add('maximized');
        }
        window.dispatchEvent(new CustomEvent('win-resize', { detail: { winId } }));
      },

      closeWindow(winId) {
        const w = this.windows.get(winId);
        if (!w) return;
        if (typeof w.onCleanup === 'function') {
          try { w.onCleanup(); } catch (e) {}
        }
        w.el.remove();
        this.windows.delete(winId);
        if (this.activeWinId === winId) this.activeWinId = null;
        this.renderTaskbar();
      },

      _bindWindowEvents(w) {
        const { el, id } = w;
        el.addEventListener('mousedown', () => this.focusWindow(id));
        el.addEventListener('touchstart', () => this.focusWindow(id), { passive: true });

        el.querySelector('.min-btn').onclick = (e) => { e.stopPropagation(); this.minimizeWindow(id); };
        el.querySelector('.max-btn').onclick = (e) => { e.stopPropagation(); this.toggleMaximize(id); };
        el.querySelector('.close-btn').onclick = (e) => { e.stopPropagation(); this.closeWindow(id); };

        // Titlebar Drag + Aero Snap
        const titlebar = el.querySelector('.win-titlebar');
        titlebar.addEventListener('dblclick', (e) => {
          if (e.target.closest('.win-controls')) return;
          this.toggleMaximize(id);
        });

        let dragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let pendingSnapZone = null;
        const snapPreview = document.getElementById('aero-snap-preview');

        const computeSnapZone = (clientX, clientY) => {
          const sw = window.innerWidth;
          const sh = window.innerHeight - 52;
          const margin = 14;
          if (clientX <= margin && clientY <= margin) return { left: 0, top: 0, width: sw / 2, height: sh / 2 };
          if (clientX >= sw - margin && clientY <= margin) return { left: sw / 2, top: 0, width: sw / 2, height: sh / 2 };
          if (clientX <= margin && clientY >= sh - margin) return { left: 0, top: sh / 2, width: sw / 2, height: sh / 2 };
          if (clientX >= sw - margin && clientY >= sh - margin) return { left: sw / 2, top: sh / 2, width: sw / 2, height: sh / 2 };
          if (clientY <= margin) return { left: 0, top: 0, width: sw, height: sh, isMax: true };
          if (clientX <= margin) return { left: 0, top: 0, width: sw / 2, height: sh };
          if (clientX >= sw - margin) return { left: sw / 2, top: 0, width: sw / 2, height: sh };
          return null;
        };

        const startDrag = (e) => {
          if (e.target.closest('.win-controls')) return;
          if (e.type === 'mousedown' && e.button !== 0) return;
          this.focusWindow(id);
          const { clientX, clientY } = getClientXY(e);

          if (w.maximized) {
            const ratio = clientX / window.innerWidth;
            w.maximized = false;
            el.classList.remove('maximized');
            el.style.width = `${w.prevRect.width}px`;
            el.style.height = `${w.prevRect.height}px`;
            el.style.left = `${Math.max(0, clientX - w.prevRect.width * ratio)}px`;
            el.style.top = `${Math.max(0, clientY - 18)}px`;
          }

          dragging = true;
          dragOffsetX = clientX - el.offsetLeft;
          dragOffsetY = clientY - el.offsetTop;
        };

        const moveDrag = (e) => {
          if (!dragging) return;
          const { clientX, clientY } = getClientXY(e);
          const newLeft = clientX - dragOffsetX;
          const newTop = Math.max(0, Math.min(window.innerHeight - 90, clientY - dragOffsetY));
          el.style.left = `${newLeft}px`;
          el.style.top = `${newTop}px`;

          // Aero Snap detection
          pendingSnapZone = computeSnapZone(clientX, clientY);
          if (pendingSnapZone) {
            snapPreview.style.left = `${pendingSnapZone.left + 4}px`;
            snapPreview.style.top = `${pendingSnapZone.top + 4}px`;
            snapPreview.style.width = `${pendingSnapZone.width - 8}px`;
            snapPreview.style.height = `${pendingSnapZone.height - 8}px`;
            snapPreview.classList.add('visible');
          } else {
            snapPreview.classList.remove('visible');
          }
        };

        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          snapPreview.classList.remove('visible');
          if (pendingSnapZone) {
            w.prevRect = { left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight };
            if (pendingSnapZone.isMax) {
              w.maximized = true;
              el.classList.add('maximized');
            } else {
              el.style.left = `${pendingSnapZone.left}px`;
              el.style.top = `${pendingSnapZone.top}px`;
              el.style.width = `${pendingSnapZone.width}px`;
              el.style.height = `${pendingSnapZone.height}px`;
            }
            pendingSnapZone = null;
            window.dispatchEvent(new CustomEvent('win-resize', { detail: { winId: id } }));
          }
        };

        titlebar.addEventListener('mousedown', startDrag);
        titlebar.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: true });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // 8-Direction Resize Handles
        el.querySelectorAll('.resizer').forEach(handle => {
          let resizing = false;
          let dir = handle.getAttribute('data-dir');
          let startX = 0, startY = 0, startW = 0, startH = 0, startL = 0, startT = 0;

          const onResizeStart = (e) => {
            e.stopPropagation();
            if (w.maximized) return;
            this.focusWindow(id);
            resizing = true;
            const pt = getClientXY(e);
            startX = pt.clientX;
            startY = pt.clientY;
            startW = el.offsetWidth;
            startH = el.offsetHeight;
            startL = el.offsetLeft;
            startT = el.offsetTop;
          };

          const onResizeMove = (e) => {
            if (!resizing) return;
            const pt = getClientXY(e);
            const dx = pt.clientX - startX;
            const dy = pt.clientY - startY;
            let newW = startW, newH = startH, newL = startL, newT = startT;

            if (dir.includes('e')) newW = Math.max(280, startW + dx);
            if (dir.includes('s')) newH = Math.max(180, startH + dy);
            if (dir.includes('w')) {
              const proposedW = startW - dx;
              if (proposedW >= 280) {
                newW = proposedW;
                newL = startL + dx;
              }
            }
            if (dir.includes('n')) {
              const proposedH = startH - dy;
              if (proposedH >= 180 && startT + dy >= 0) {
                newH = proposedH;
                newT = startT + dy;
              }
            }

            el.style.width = `${newW}px`;
            el.style.height = `${newH}px`;
            el.style.left = `${newL}px`;
            el.style.top = `${newT}px`;
            window.dispatchEvent(new CustomEvent('win-resize', { detail: { winId: id } }));
          };

          const onResizeEnd = () => { resizing = false; };

          handle.addEventListener('mousedown', onResizeStart);
          handle.addEventListener('touchstart', onResizeStart, { passive: true });
          document.addEventListener('mousemove', onResizeMove);
          document.addEventListener('touchmove', onResizeMove, { passive: true });
          document.addEventListener('mouseup', onResizeEnd);
          document.addEventListener('touchend', onResizeEnd);
        });
      },

      renderTaskbar() {
        const container = document.getElementById('taskbar-apps');
        if (!container) return;
        container.innerHTML = '';

        for (const [id, w] of this.windows) {
          const btn = document.createElement('div');
          const isActive = (this.activeWinId === id && !w.minimized);
          btn.className = `tb-btn ${isActive ? 'active-app' : ''}`;
          btn.innerHTML = `
            <span class="w-4 h-4 flex items-center justify-center text-[var(--accent)]">${w.icon}</span>
            <span class="tb-title text-xs max-w-[130px] truncate">${escapeHtml(w.title)}</span>
            <span class="tb-close" title="关闭窗口">${Icons.close}</span>
          `;

          // Click to restore / minimize / focus
          btn.onclick = (e) => {
            if (e.target.closest('.tb-close')) {
              e.stopPropagation();
              this.closeWindow(id);
              return;
            }
            if (w.minimized) {
              this.restoreWindow(id);
            } else if (this.activeWinId === id) {
              this.minimizeWindow(id);
            } else {
              this.focusWindow(id);
            }
          };

          // Aero Peek on Hover over Taskbar App Button
          btn.addEventListener('mouseenter', () => {
            document.body.classList.add('aero-peek-active');
            w.el.classList.add('aero-peek-focus');
          });
          btn.addEventListener('mouseleave', () => {
            document.body.classList.remove('aero-peek-active');
            w.el.classList.remove('aero-peek-focus');
          });

          container.appendChild(btn);
        }
      }
    };

      updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        let hours = now.getHours();
        let timeStr = '';
        if (SysConfig.clock12Hour) {
          const period = hours >= 12 ? '下午' : '上午';
          hours = hours % 12 || 12;
          timeStr = `${period} ${pad(hours)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        } else {
          timeStr = `${pad(hours)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }
        const dateStr = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())}`;
        const tEl = document.getElementById('clock-time');
        const dEl = document.getElementById('clock-date');
        if (tEl) tEl.textContent = timeStr;
        if (dEl) dEl.textContent = dateStr;
      },

      renderCalendar() {
        const flyout = document.getElementById('calendar-flyout');
        const today = new Date();
        const firstDay = new Date(this.viewYear, this.viewMonth, 1).getDay();
        const daysInMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
        const prevMonthDays = new Date(this.viewYear, this.viewMonth, 0).getDate();

        let cellsHtml = '';
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        for (const wd of weekDays) {
          cellsHtml += `<div class="text-center text-[11px] text-[var(--text-secondary)] font-semibold py-1">${wd}</div>`;
        }

        for (let i = firstDay - 1; i >= 0; i--) {
          cellsHtml += `<div class="text-center py-1.5 text-xs text-[var(--text-muted)] opacity-50">${prevMonthDays - i}</div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const isToday = (d === today.getDate() && this.viewMonth === today.getMonth() && this.viewYear === today.getFullYear());
          cellsHtml += `
            <div class="text-center py-1.5 text-xs rounded-[var(--btn-radius)] cursor-pointer transition-colors ${isToday ? 'bg-[var(--accent)] text-black font-bold' : 'hover:bg-[var(--bg-hover)]'}">
              ${d}
            </div>
          `;
        }

        flyout.innerHTML = `
          <div class="flex items-center justify-between pb-3 mb-2 border-b border-[var(--border-subtle)]">
            <div>
              <div class="text-sm font-bold font-[var(--font-display)] text-[var(--accent)]">${this.viewYear} 年 ${this.viewMonth + 1} 月</div>
              <div class="text-[11px] text-[var(--text-secondary)]">曜金星历 · 实时同步</div>
            </div>
            <div class="flex items-center gap-1">
              <button id="cal-prev-btn" class="k-btn px-2 py-1" title="上个月">${Icons.arrowLeft}</button>
              <button id="cal-today-btn" class="k-btn px-2 py-1 text-[11px]">今天</button>
              <button id="cal-next-btn" class="k-btn px-2 py-1" title="下个月">${Icons.arrowRight}</button>
            </div>
          </div>
          <div class="grid grid-cols-7 gap-1 mb-3">${cellsHtml}</div>
          <div class="pt-2 border-t border-[var(--border-subtle)] flex items-center justify-between text-xs">
            <span class="text-[var(--text-secondary)]">时间显示制式</span>
            <button id="cal-toggle-12h" class="k-btn text-[11px]">${SysConfig.clock12Hour ? '当前: 12小时制 (切换)' : '当前: 24小时制 (切换)'}</button>
          </div>
        `;

        flyout.querySelector('#cal-prev-btn').onclick = (e) => {
          e.stopPropagation();
          this.viewMonth--;
          if (this.viewMonth < 0) { this.viewMonth = 11; this.viewYear--; }
          this.renderCalendar();
        };
        flyout.querySelector('#cal-next-btn').onclick = (e) => {
          e.stopPropagation();
          this.viewMonth++;
          if (this.viewMonth > 11) { this.viewMonth = 0; this.viewYear++; }
          this.renderCalendar();
        };
        flyout.querySelector('#cal-today-btn').onclick = (e) => {
          e.stopPropagation();
          const now = new Date();
          this.viewYear = now.getFullYear();
          this.viewMonth = now.getMonth();
          this.renderCalendar();
        };
        flyout.querySelector('#cal-toggle-12h').onclick = (e) => {
          e.stopPropagation();
          SysConfig.clock12Hour = !SysConfig.clock12Hour;
          saveSysConfig();
          this.updateClock();
          this.renderCalendar();
        };
      }
    };

    // Strict Requirement 8.5: Unified Smart File/Folder Dispatcher
    // Always checks `fs.stat(path)` first regardless of virtual or local mount path!
    async function openVFSPath(vfsPath, preferredApp = null) {
      const norm = PathUtils.normalize(vfsPath);
      try {
        const st = await fs.stat(norm);
        if (st.isDirectory()) {
          Apps.openFileExplorer(norm);
          return;
        }

        if (preferredApp) {
          switch (preferredApp) {
            case 'html-editor': return Apps.openHtmlEditor(norm);
            case 'browser': return Apps.openBrowser(norm);
            case 'notepad': return Apps.openNotepad(norm);
            case 'table': return Apps.openTableEditor(norm);
            case 'manga': return Apps.openMangaViewer(norm);
            case 'image': return Apps.openImageViewer(norm);
            case 'media': return Apps.openMediaPlayer(norm);
            case 'pdf': return Apps.openPdfViewer(norm);
            case 'v86': return Apps.openV86Emulator(norm);
            case 'paint': return Apps.openPaintApp(norm);
          }
        }

        const ext = PathUtils.extname(norm);
        const info = getFileCategoryAndMime(norm, false);

        // Special interaction for .html / .htm files (Requirement 4.3):
        // Provide primary dual entrance: 1. Open in System Browser 2. Edit Source Code (with real-time preview)
        if (ext === '.html' || ext === '.htm') {
          showModal({
            title: `打开 HTML 文档: ${PathUtils.basename(norm)}`,
            bodyHtml: `
              <p class="text-[var(--text-secondary)] mb-3">请选择打开 <b>${escapeHtml(PathUtils.basename(norm))}</b> 的方式（预览效果与修改代码无缝衔接）：</p>
              <div class="grid grid-cols-1 gap-2.5">
                <button id="html-open-editor-btn" class="k-btn primary py-3 justify-start px-4 text-left">
                  <span class="w-5 h-5 text-[var(--accent)]">${Icons.fileCode}</span>
                  <div>
                    <div class="font-semibold text-xs">编辑源代码 + 实时分屏预览 (HTML 编辑器)</div>
                    <div class="text-[11px] text-[var(--text-secondary)]">使用 CodeMirror 内核修改代码并在右侧实时渲染预览</div>
                  </div>
                </button>
                <button id="html-open-browser-btn" class="k-btn py-3 justify-start px-4 text-left">
                  <span class="w-5 h-5 text-[var(--accent)]">${Icons.browser}</span>
                  <div>
                    <div class="font-semibold text-xs">在系统网页浏览器中打开</div>
                    <div class="text-[11px] text-[var(--text-secondary)]">生成隔离 Blob URL 并在内置浏览器窗口中全屏渲染</div>
                  </div>
                </button>
              </div>
            `,
            hideCancel: false,
            confirmText: '在编辑器中打开',
            cancelText: '关闭',
            onConfirm: () => {
              Apps.openHtmlEditor(norm);
              return true;
            }
          });
          setTimeout(() => {
            const b1 = document.getElementById('html-open-editor-btn');
            const b2 = document.getElementById('html-open-browser-btn');
            if (b1) b1.onclick = () => {
              document.getElementById('modal-overlay').classList.add('hidden');
              document.getElementById('modal-overlay').classList.remove('flex');
              Apps.openHtmlEditor(norm);
            };
            if (b2) b2.onclick = () => {
              document.getElementById('modal-overlay').classList.add('hidden');
              document.getElementById('modal-overlay').classList.remove('flex');
              Apps.openBrowser(norm);
            };
          }, 20);
          return;
        }

        if (info.category === 'image') {
          if (SysConfig.defaultImageApp === 'image') {
            Apps.openImageViewer(norm);
          } else {
            Apps.openMangaViewer(norm);
          }
          return;
        }

        if (info.category === 'table') {
          Apps.openTableEditor(norm);
          return;
        }

        if (info.category === 'code') {
          Apps.openHtmlEditor(norm);
          return;
        }

        if (info.category === 'audio' || info.category === 'video') {
          Apps.openMediaPlayer(norm);
          return;
        }

        if (info.category === 'pdf') {
          Apps.openPdfViewer(norm);
          return;
        }

        if (info.category === 'archive') {
          await ArchiveEngine.extractArchive(norm, PathUtils.dirname(norm));
          return;
        }

        if (info.category === 'vm') {
          Apps.openV86Emulator(norm);
          return;
        }

        // Default fallback for .txt, .md, .yaml, .log and any unlisted MIME type: open as plain text!
        Apps.openNotepad(norm);
      } catch (err) {
        notify('无法打开目标路径: ' + err.message, 'error');
      }
    }

      async init() {
        const stage = document.getElementById('desktop-stage');
        const container = document.getElementById('desktop-icons-container');
        const marqueeEl = document.getElementById('desktop-marquee');

        // Initialize Desktop Marquee Selection
        this.marqueeCtrl = createMarqueeController({
          container: stage,
          marqueeEl,
          itemSelector: '.desktop-icon',
          onSelectionChange: (paths) => {
            this.selectedKeys = new Set(paths);
          }
        });

        // Native HTML5 DragOver & Drop on Desktop Stage
        stage.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        stage.addEventListener('drop', async (e) => {
          e.preventDefault();
          const rawInternal = e.dataTransfer.getData('application/x-kintsugi-vfs');
          const stageRect = stage.getBoundingClientRect();

          if (rawInternal) {
            try {
              const payload = JSON.parse(rawInternal);
              const { paths, source, offsetX = 40, offsetY = 40 } = payload;
              if (!paths || paths.length === 0) return;

              // If dragged from Desktop itself onto blank Desktop -> update icon coordinates!
              if (source === 'desktop') {
                const baseLeft = Math.max(8, Math.min(stageRect.width - 92, e.clientX - stageRect.left - offsetX));
                const baseTop = Math.max(8, Math.min(stageRect.height - 96, e.clientY - stageRect.top - offsetY));

                paths.forEach((key, idx) => {
                  const newLeft = Math.round(baseLeft + idx * 18);
                  const newTop = Math.round(baseTop + idx * 18);
                  SysConfig.desktopIconPositions[key] = { left: newLeft, top: newTop };
                  const iconEl = container.querySelector(`.desktop-icon[data-path="${CSS.escape(key)}"]`);
                  if (iconEl) {
                    iconEl.classList.add('smooth-move');
                    iconEl.style.left = `${newLeft}px`;
                    iconEl.style.top = `${newTop}px`;
                  }
                });
                saveSysConfig();
              } else {
                // Dragged from File Explorer window onto Desktop -> move to /Desktop preserving mtime!
                for (const p of paths) {
                  if (p.startsWith('app:')) continue;
                  const dest = PathUtils.join('/Desktop', PathUtils.basename(p));

                if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
                else document.exitFullscreen?.();
              }
            },
            {
              label: '个性化与系统设置',
              icon: Icons.settings,
              action: () => Apps.openSettings()
            }
          ]);
        });

        window.addEventListener('vfs-change', () => this.renderIcons());
        await this.renderIcons();
      },

      async pasteToDir(targetDir) {
        if (!ClipboardState.paths || ClipboardState.paths.length === 0) {
          notify('剪贴板为空', 'info');
          return;
        }
        for (const src of ClipboardState.paths) {
          let base = PathUtils.basename(src);
          let dest = PathUtils.join(targetDir, base);
          if (PathUtils.normalize(src) === dest && ClipboardState.mode === 'copy') {
            const ext = PathUtils.extname(base);
            const stem = ext ? base.slice(0, -ext.length) : base;
            dest = PathUtils.join(targetDir, `${stem}_副本${ext}`);
          }
          if (ClipboardState.mode === 'cut') {
            await fs.rename(src, dest);
          } else {
            await fs.copyFile(src, dest);
          }
        }
        if (ClipboardState.mode === 'cut') ClipboardState.paths = [];
        notify('粘贴完成（已保留原始修改时间）', 'success');
      },

      triggerFileUpload(targetDir) {
        const input = document.getElementById('global-file-input');
        input.onchange = async (e) => {
          const files = e.target.files;
          if (!files || files.length === 0) return;
          showLoading('正在导入本地文件至虚拟文件系统...');
          for (const file of files) {
            const ab = await file.arrayBuffer();
            await fs.writeFile(PathUtils.join(targetDir, file.name), new Uint8Array(ab), { mtime: file.lastModified || Date.now() });
          }
          hideLoading();
          input.value = '';
          notify(`已上传 ${files.length} 个文件至 ${targetDir}`, 'success');
        };
        input.click();
      },

      autoArrangeGrid() {
        SysConfig.desktopIconPositions = {};
        saveSysConfig();
        this.renderIcons(true);
        notify('桌面图标已按网格对齐排列', 'info');
      },

      async renderIcons(animate = false) {
        const container = document.getElementById('desktop-icons-container');
        if (!container) return;

        const items = [];
        if (!SysConfig.hideDesktopSystemIcons) {
          for (const app of SystemAppShortcuts) {
            items.push({
              key: app.id,
              name: app.name,
              icon: app.icon,
              isApp: true,
              isDir: false,
              action: app.action
            });
          }
        }

        // Load real VFS files from /Desktop
        try {
          const names = await fs.readdir('/Desktop');
          names.sort(naturalCompare);
          for (const name of names) {
            const fullPath = PathUtils.join('/Desktop', name);
            try {
              const st = await fs.stat(fullPath);
              const isDir = st.isDirectory();
              const info = getFileCategoryAndMime(name, isDir);
              items.push({
                key: fullPath,
                name,
                icon: info.icon,
                isApp: false,
                isDir,
                action: () => openVFSPath(fullPath)
              });
            } catch (e) {}
          }
        } catch (e) {}

        container.innerHTML = '';
        const stageH = Math.max(360, window.innerHeight - 70);
        const cellW = 96;
        const cellH = 96;
        const maxRows = Math.max(1, Math.floor((stageH - 20) / cellH));

        items.forEach((item, index) => {
          const col = Math.floor(index / maxRows);
          const row = index % maxRows;
          const defaultLeft = 14 + col * cellW;
          const defaultTop = 14 + row * cellH;
          const savedPos = SysConfig.desktopIconPositions[item.key];
          const left = savedPos ? savedPos.left : defaultLeft;
          const top = savedPos ? savedPos.top : defaultTop;

          const el = document.createElement('div');
          el.className = `desktop-icon ${animate ? 'smooth-move' : ''} ${this.selectedKeys.has(item.key) ? 'selected' : ''}`;
          el.setAttribute('data-path', item.key);
          el.style.left = `${left}px`;
          el.style.top = `${top}px`;

          el.innerHTML = `
            <div class="icon-glyph text-[var(--accent)]">${item.icon}</div>
            <div class="icon-label">${escapeHtml(item.name)}</div>
          `;

          // Single-Click vs Double-Click to Open (Default is Single-Click!)
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) {
              el.classList.toggle('selected');
              if (el.classList.contains('selected')) this.selectedKeys.add(item.key);
              else this.selectedKeys.delete(item.key);
              return;
            }
            container.querySelectorAll('.desktop-icon').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            this.selectedKeys = new Set([item.key]);

            if (SysConfig.singleClickOpen) {
              item.action();
            }
          });

          el.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (!SysConfig.singleClickOpen) {
              item.action();
            }
          });

          // Bind Native HTML5 Drag & Drop (Strict Requirement 3.3)
          bindNativeDraggable(el, () => {
            if (this.selectedKeys.has(item.key) && this.selectedKeys.size > 1) {
              return Array.from(this.selectedKeys);
            }
            return [item.key];
          }, 'desktop');

          // If this icon is a folder, allow dropping files onto it!
          if (item.isDir && !item.isApp) {
            el.addEventListener('dragover', (e) => {
              e.preventDefault();
              e.stopPropagation();
              el.classList.add('drag-target-hover');
            });
            el.addEventListener('dragleave', () => {
              el.classList.remove('drag-target-hover');
            });
            el.addEventListener('drop', async (e) => {
              e.preventDefault();
              e.stopPropagation();
              el.classList.remove('drag-target-hover');
              const rawInternal = e.dataTransfer.getData('application/x-kintsugi-vfs');
              if (rawInternal) {
                const payload = JSON.parse(rawInternal);
                for (const p of payload.paths) {
                  if (p.startsWith('app:') || p === item.key) continue;
                  const dest = PathUtils.join(item.key, PathUtils.basename(p));
                  await fs.rename(p, dest);
                }
                notify(`已移动至文件夹 ${item.name}`, 'success');
              } else {
                await handleExternalDropEntries(e.dataTransfer, item.key);
              }
            });
          }

          // Mobile Touchscreen Dragging for Free Placement on Touch Devices
          let touchMoving = false;
          let tStartX = 0, tStartY = 0, origL = 0, origT = 0;
          el.addEventListener('touchstart', (e) => {
            if (GlobalMobileBoxSelectMode) return;
            const t = e.touches[0];
            tStartX = t.clientX;
            tStartY = t.clientY;
            origL = el.offsetLeft;
            origT = el.offsetTop;
            touchMoving = false;
          }, { passive: true });

          el.addEventListener('touchmove', (e) => {
            if (GlobalMobileBoxSelectMode) return;
            const t = e.touches[0];
            const dx = t.clientX - tStartX;
            const dy = t.clientY - tStartY;
            if (Math.hypot(dx, dy) > 8) {
              touchMoving = true;
              e.preventDefault();
              const nl = Math.max(4, Math.min(window.innerWidth - 90, origL + dx));
              const nt = Math.max(4, Math.min(window.innerHeight - 140, origT + dy));
              el.style.left = `${nl}px`;
              el.style.top = `${nt}px`;
            }
          }, { passive: false });

          el.addEventListener('touchend', () => {
            if (touchMoving) {
              SysConfig.desktopIconPositions[item.key] = { left: el.offsetLeft, top: el.offsetTop };
              saveSysConfig();
            }
          });

          // Context Menu on Icon
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (item.isApp) {
              showContextMenu(e.clientX, e.clientY, [
                { label: `打开 ${item.name}`, icon: item.icon, action: item.action }
              ]);
              return;
            }
            showFileItemContextMenu(e.clientX, e.clientY, item.key, item.isDir);
          });

          container.appendChild(el);
        });
      }
    };
