        const sb = b.querySelector('#fe-sidebar');
        const mountedNames = fs.getMountedLocalNames();

        const quickLinks = [
          { path: '/Desktop', label: '桌面 (Desktop)', icon: Icons.gridIcons },
          { path: '/Documents', label: '文档 (Documents)', icon: Icons.fileText },
          { path: '/Pictures', label: '图片 (Pictures)', icon: Icons.fileImage },
          { path: '/Desktop/条漫示例_星渊纪元', label: '条漫示例图集', icon: Icons.fileManga },
          { path: '/Archives', label: '归档包 (Archives)', icon: Icons.fileArchive },
          { path: '/System', label: '系统镜像 (System)', icon: Icons.vm }
        ];

        const storageRoots = [
          { path: '/', label: `主文件系统 (${SysConfig.primaryBackend.toUpperCase()})`, icon: Icons.drive },
          ...(SysConfig.showDualBackendsInFE ? [
            { path: '/opfs', label: 'OPFS 原生存储区 (/opfs)', icon: Icons.drive },
            { path: '/idb', label: 'IndexedDB 存储区 (/idb)', icon: Icons.drive }
          ] : [])
        ];

        let html = `
          <div>
            <div class="px-2 py-1 text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)]">快速访问</div>
            <div class="space-y-0.5" id="fe-sb-quick"></div>
          </div>
          <div>
            <div class="px-2 py-1 text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)]">双后端存储池</div>
            <div class="space-y-0.5" id="fe-sb-backends"></div>
          </div>
          <div>
            <div class="px-2 py-1 flex items-center justify-between text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)]">
              <span>本地挂载 (/mnt/local)</span>
              <button id="fe-sb-add-mount" class="text-[var(--accent)] hover:underline cursor-pointer">+挂载</button>
            </div>
            <div class="space-y-0.5" id="fe-sb-mounts"></div>
          </div>
          <div class="flex-1">
            <div class="px-2 py-1 text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)]">目录树形导航</div>
            <div class="space-y-0.5" id="fe-sb-tree"></div>
          </div>
        `;
        sb.innerHTML = html;

        const bindNavRow = (container, item, allowUnmount = false) => {
          const row = document.createElement('div');
          const active = currentPath === item.path;
          row.className = `flex items-center justify-between px-2 py-1.5 rounded-[var(--btn-radius)] text-xs cursor-pointer transition-colors ${active ? 'bg-[var(--bg-active)] text-[var(--accent-bright)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}`;
          row.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span class="w-4 h-4 text-[var(--accent)] shrink-0">${item.icon}</span>
              <span class="truncate">${escapeHtml(item.label)}</span>
            </div>
            ${allowUnmount ? `<button class="unmount-btn text-[10px] px-1.5 py-0.5 rounded bg-red-500/20 text-red-300 hover:bg-red-500/40" title="卸载本地文件夹">卸载</button>` : ''}
          `;
          row.onclick = (e) => {
            if (e.target.closest('.unmount-btn')) {
              e.stopPropagation();
              fs.unmountLocalDirectory(item.mountName);
              if (currentPath.startsWith(item.path)) navigateTo('/Desktop');
              else renderSidebarTree();
              return;
            }
            navigateTo(item.path);
          };

          // Allow dropping files onto any sidebar directory
          row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('bg-[var(--bg-active)]'); });
          row.addEventListener('dragleave', () => { if (!active) row.classList.remove('bg-[var(--bg-active)]'); });
          row.addEventListener('drop', async (e) => {
            e.preventDefault();
            const raw = e.dataTransfer.getData('application/x-kintsugi-vfs');
            if (raw) {
              const payload = JSON.parse(raw);
              for (const p of payload.paths) {
                if (p.startsWith('app:')) continue;
                await fs.rename(p, PathUtils.join(item.path, PathUtils.basename(p)));
              }
              notify(`已移动至 ${item.path}`, 'success');
            } else {
              await handleExternalDropEntries(e.dataTransfer, item.path);
            }
          });

          container.appendChild(row);
        };

        const qBox = sb.querySelector('#fe-sb-quick');
        quickLinks.forEach(q => bindNavRow(qBox, q));

        const bBox = sb.querySelector('#fe-sb-backends');
        storageRoots.forEach(r => bindNavRow(bBox, r));

        const mBox = sb.querySelector('#fe-sb-mounts');
        if (mountedNames.length === 0) {
          mBox.innerHTML = `<div class="px-2 py-1.5 text-[11px] text-[var(--text-muted)]">尚未挂载本地真实目录</div>`;
        } else {
          mountedNames.forEach(name => {
            bindNavRow(mBox, { path: `/mnt/local/${name}`, label: name, icon: Icons.folderMount, mountName: name }, true);
          });
        }

        sb.querySelector('#fe-sb-add-mount').onclick = async () => {
          const p = await fs.mountLocalDirectory();
          if (p) navigateTo(p);
        };

        // Render collapsible directory tree starting at '/'
        const treeBox = sb.querySelector('#fe-sb-tree');
        const renderTreeNode = async (dirPath, label, depth = 0) => {
          const isExpanded = expandedTreeDirs.has(dirPath);
          const isCurrent = currentPath === dirPath;
          const nodeEl = document.createElement('div');
          nodeEl.className = `flex items-center gap-1 py-1 px-1.5 rounded-[var(--btn-radius)] text-xs cursor-pointer ${isCurrent ? 'bg-[var(--bg-active)] text-[var(--accent-bright)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}`;
          nodeEl.style.paddingLeft = `${6 + depth * 12}px`;
          nodeEl.innerHTML = `
            <span class="tree-toggle w-3.5 h-3.5 flex items-center justify-center text-[var(--text-muted)]">${isExpanded ? Icons.chevronDown : Icons.chevronRight}</span>
            <span class="w-4 h-4 text-[var(--accent)] shrink-0">${Icons.folder}</span>
            <span class="truncate">${escapeHtml(label)}</span>
          `;
          nodeEl.onclick = (e) => {
            if (e.target.closest('.tree-toggle')) {
              e.stopPropagation();
              if (expandedTreeDirs.has(dirPath)) expandedTreeDirs.delete(dirPath);
              else expandedTreeDirs.add(dirPath);
              renderSidebarTree();
              return;
            }
            expandedTreeDirs.add(dirPath);
            navigateTo(dirPath);
          };
          treeBox.appendChild(nodeEl);

          if (isExpanded && depth < 4) {
            try {
              const names = await fs.readdir(dirPath);
              names.sort(naturalCompare);
              for (const n of names) {
                const sub = PathUtils.join(dirPath, n);
                try {
                  const st = await fs.stat(sub);
                  if (st.isDirectory()) {
                    await renderTreeNode(sub, n, depth + 1);
                  }
                } catch (e) {}
              }
            } catch (e) {}
          }
        };
        await renderTreeNode('/', '根目录 (/)', 0);
      };

      // Load directory entries and compute accurate folder sizes
      const loadAndRenderDirectory = async (customItems = null) => {
        cleanupThumbs();
        if (customItems) {
          currentItemsList = customItems;
        } else {
          try {
            const names = await fs.readdir(currentPath);
            const items = [];
            for (const name of names) {
              const fullPath = PathUtils.join(currentPath, name);
              try {
                const st = await fs.stat(fullPath);
                const isDir = st.isDirectory();
                const info = getFileCategoryAndMime(name, isDir);
                items.push({
                  name,
                  path: fullPath,
                  isDir,
                  mtime: st.mtime || Date.now(),
                  size: isDir ? 0 : (st.size || 0),
                  folderSizeCalculated: !isDir,
                  typeLabel: info.typeLabel,
                  category: info.category,
                  icon: (fullPath.startsWith('/mnt/local') && isDir) ? Icons.folderMount : info.icon
                });
              } catch (e) {}
            }
            currentItemsList = items;

            // Asynchronously compute accurate folder sizes for directories in current view
            Promise.all(currentItemsList.filter(i => i.isDir).map(async (dirItem) => {
              const realSize = await fs.getFolderSize(dirItem.path);
              dirItem.size = realSize;
              dirItem.folderSizeCalculated = true;
              const sizeCell = contentHost.querySelector(`.fe-folder-size[data-size-path="${CSS.escape(dirItem.path)}"]`);
              if (sizeCell) sizeCell.textContent = formatBytes(realSize);
            }));
          } catch (err) {
            notify('读取目录失败: ' + err.message, 'error');
            currentItemsList = [];
          }
        }

        sortAndRenderItems();
      };

      const sortAndRenderItems = () => {
        const filterKeyword = b.querySelector('#fe-search-input').value.trim().toLowerCase();
        let list = currentItemsList.filter(item => !filterKeyword || item.name.toLowerCase().includes(filterKeyword));

        list.sort((a, bItem) => {
          // Keep directories grouped first unless sorting by size or mtime explicitly
          if (a.isDir !== bItem.isDir && sortField === 'name') {
            return a.isDir ? -1 : 1;
          }
          let cmp = 0;
          if (sortField === 'name') cmp = naturalCompare(a.name, bItem.name);
          else if (sortField === 'mtime') cmp = (a.mtime || 0) - (bItem.mtime || 0);
          else if (sortField === 'typeLabel') cmp = naturalCompare(a.typeLabel, bItem.typeLabel);
          else if (sortField === 'size') cmp = (a.size || 0) - (bItem.size || 0);
          return sortAsc ? cmp : -cmp;
        });

        if (viewMode === 'details') renderDetailsView(list);
        else if (viewMode === 'icons') renderIconsView(list);
        else if (viewMode === 'columns') renderColumnsView(list);

        updateStatusBar();
      };

      // Bind common item interactions (Single-click/Double-click open, Drag & Drop, Context Menu)
      const bindFileRowInteractions = (el, item) => {
        el.setAttribute('data-path', item.path);

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (e.ctrlKey || e.metaKey || feMobileMarqueeMode) {
            el.classList.toggle('selected');
            if (el.classList.contains('selected')) selectedPaths.add(item.path);
            else selectedPaths.delete(item.path);
            updateStatusBar();
            return;
          }
          contentHost.querySelectorAll('.fe-selectable-item').forEach(x => x.classList.remove('selected'));
          el.classList.add('selected');
          selectedPaths = new Set([item.path]);
          updateStatusBar();

          if (SysConfig.singleClickOpen) {
            if (item.isDir) navigateTo(item.path);
            else openVFSPath(item.path);
          }
        });

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (!SysConfig.singleClickOpen) {
            if (item.isDir) navigateTo(item.path);
            else openVFSPath(item.path);
          }
        });

        // Native HTML5 Drag & Drop (Bidirectional!)
        bindNativeDraggable(el, () => {
          if (selectedPaths.has(item.path) && selectedPaths.size > 1) {
            return Array.from(selectedPaths);
          }
          return [item.path];
        }, 'explorer');

        if (item.isDir) {
          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            el.classList.add('selected');
          });
          el.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const raw = e.dataTransfer.getData('application/x-kintsugi-vfs');
            if (raw) {
              const payload = JSON.parse(raw);
              for (const p of payload.paths) {
                if (p.startsWith('app:') || p === item.path) continue;
                await fs.rename(p, PathUtils.join(item.path, PathUtils.basename(p)));
              }
            } else {
              await handleExternalDropEntries(e.dataTransfer, item.path);
            }
          });
        }

        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!selectedPaths.has(item.path)) {
            contentHost.querySelectorAll('.fe-selectable-item').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            selectedPaths = new Set([item.path]);
            updateStatusBar();
          }
          showFileItemContextMenu(e.clientX, e.clientY, item.path, item.isDir);
        });
      };

      // ----------------------------------------------------------------------
      // View Mode 1: Strict Windows Explorer Details View (Requirement 4.1)
      // Left-aligned continuous columns, NOT stretched to fill; right blank area is for marquee!
      // ----------------------------------------------------------------------
      const renderDetailsView = (list) => {
        contentHost.innerHTML = '';

        const headerEl = document.createElement('div');
        headerEl.className = 'fe-details-header';

        columns.forEach((col, colIdx) => {
          const colHead = document.createElement('div');
          colHead.className = 'fe-col-header';
          colHead.style.width = `${col.width}px`;
          colHead.setAttribute('draggable', 'true');
          const arrowSvg = sortField === col.key
            ? `<span class="w-3.5 h-3.5 ml-1 inline-flex items-center justify-center text-[var(--accent)] ${sortAsc ? 'rotate-180' : ''}">${Icons.chevronDown}</span>`
            : '';
          colHead.innerHTML = `
            <span class="truncate flex items-center">${escapeHtml(col.label)}${arrowSvg}</span>
            <div class="fe-col-resizer"></div>
          `;

          // Click header to sort
          colHead.addEventListener('click', (e) => {
            if (e.target.closest('.fe-col-resizer')) return;
            if (sortField === col.key) sortAsc = !sortAsc;
            else { sortField = col.key; sortAsc = true; }
            sortAndRenderItems();
          });

          // Drag column header to reorder columns
          colHead.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', String(colIdx));
          });
          colHead.addEventListener('dragover', (e) => e.preventDefault());
          colHead.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (!isNaN(fromIdx) && fromIdx !== colIdx) {
              const moved = columns.splice(fromIdx, 1)[0];
              columns.splice(colIdx, 0, moved);
              renderDetailsView(list);
            }
          });

          // Column width drag resizer (Mouse + Touch)
          const resizer = colHead.querySelector('.fe-col-resizer');
          const startColResize = (e) => {
            e.stopPropagation();
            const startX = getClientXY(e).clientX;
            const origW = col.width;
            const onMove = (me) => {
              const dx = getClientXY(me).clientX - startX;
              col.width = Math.max(68, origW + dx);
              colHead.style.width = `${col.width}px`;
              contentHost.querySelectorAll(`.fe-cell-col-${col.key}`).forEach(c => {
                c.style.width = `${col.width}px`;
              });
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('touchmove', onMove);
              document.removeEventListener('mouseup', onUp);
              document.removeEventListener('touchend', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: true });
            document.addEventListener('mouseup', onUp);
            document.addEventListener('touchend', onUp);
          };
          resizer.addEventListener('mousedown', startColResize);
          resizer.addEventListener('touchstart', startColResize, { passive: true });

          headerEl.appendChild(colHead);
        });

        contentHost.appendChild(headerEl);

        const bodyList = document.createElement('div');
        bodyList.className = 'fe-details-body';

        list.forEach(item => {
          const row = document.createElement('div');
          row.className = `fe-detail-row fe-selectable-item ${selectedPaths.has(item.path) ? 'selected' : ''}`;

          columns.forEach(col => {
            const cell = document.createElement('div');
            cell.className = `fe-detail-cell fe-cell-col-${col.key}`;
            cell.style.width = `${col.width}px`;

            if (col.key === 'name') {
              cell.innerHTML = `
                <span class="w-4 h-4 mr-2 text-[var(--accent)] shrink-0">${item.icon}</span>
                <span class="truncate">${escapeHtml(item.name)}</span>
              `;
            } else if (col.key === 'mtime') {
              cell.className += ' font-mono text-[var(--text-secondary)] text-[11.5px]';
              cell.textContent = formatDate(item.mtime);
            } else if (col.key === 'typeLabel') {
              cell.className += ' text-[var(--text-secondary)]';
              cell.textContent = item.typeLabel;
            } else if (col.key === 'size') {
              cell.className += ' font-mono text-[var(--text-secondary)] text-[11.5px] fe-folder-size';
              cell.setAttribute('data-size-path', item.path);
              cell.textContent = item.folderSizeCalculated ? formatBytes(item.size) : '计算中...';
            }
            row.appendChild(cell);
          });

          bindFileRowInteractions(row, item);
          bodyList.appendChild(row);
        });

        contentHost.appendChild(bodyList);
      };

      // ----------------------------------------------------------------------
      // View Mode 2: Icons Grid View with Lazy-Loaded Image Thumbnails (8.7)
      // ----------------------------------------------------------------------
      const renderIconsView = (list) => {
        contentHost.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'p-4 flex flex-wrap gap-3 items-start content-start min-h-full';

        // IntersectionObserver so thumbnails are ONLY loaded when visible in Icon View!
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(async (entry) => {
            if (!entry.isIntersecting) return;
            const thumbBox = entry.target;
            obs.unobserve(thumbBox);
            const imgPath = thumbBox.getAttribute('data-thumb-path');
            if (!imgPath) return;
            try {
              const bytes = await fs.readFile(imgPath);
              const info = getFileCategoryAndMime(imgPath, false);
              const url = URL.createObjectURL(new Blob([bytes], { type: info.mime }));
              activeThumbUrls.push(url);
              thumbBox.innerHTML = `<img src="${url}" class="w-full h-full object-cover rounded" alt="" />`;
            } catch (e) {}
          });
        }, { root: mainViewport, rootMargin: '80px' });

        list.forEach(item => {
          const card = document.createElement('div');
          card.className = `fe-selectable-item w-28 p-2.5 rounded-[var(--btn-radius)] border border-transparent hover:border-[var(--border-hairline)] hover:bg-[var(--bg-hover)] flex flex-col items-center gap-1.5 cursor-pointer transition-all ${selectedPaths.has(item.path) ? 'selected bg-[var(--bg-active)] border-[var(--accent)]' : ''}`;
          const isImg = item.category === 'image';
          card.innerHTML = `
            <div class="w-14 h-14 flex items-center justify-center text-[var(--accent)] overflow-hidden rounded bg-[var(--bg-subtle)]" ${isImg ? `data-thumb-path="${escapeHtml(item.path)}"` : ''}>
              <span class="w-9 h-9">${item.icon}</span>
            </div>
            <div class="text-xs text-center line-clamp-2 break-all leading-tight">${escapeHtml(item.name)}</div>
            <div class="text-[10px] font-mono text-[var(--text-muted)] fe-folder-size" data-size-path="${escapeHtml(item.path)}">${item.folderSizeCalculated ? formatBytes(item.size) : '...'}</div>
          `;
          bindFileRowInteractions(card, item);
          grid.appendChild(card);

          if (isImg) {
            const thumbTarget = card.querySelector('[data-thumb-path]');
            if (thumbTarget) observer.observe(thumbTarget);
          }
        });

        contentHost.appendChild(grid);
      };

      // ----------------------------------------------------------------------
      // View Mode 3: Miller Columns View (分栏视图)
      // ----------------------------------------------------------------------
      const renderColumnsView = async () => {
        contentHost.innerHTML = '';
        const wrapper = document.createElement('div');
        wrapper.className = 'flex h-full min-h-[420px] overflow-x-auto divide-x divide-[var(--border-subtle)]';

        // Build chain of directories from root to currentPath
        const segs = currentPath === '/' ? [''] : currentPath.split('/');
        const chain = [];
        let acc = '';
        segs.forEach((s, idx) => {
          acc = idx === 0 ? '/' : PathUtils.join(acc, s);
          chain.push(acc);
        });

        for (const dirPath of chain) {
          const colEl = document.createElement('div');
          colEl.className = 'w-60 shrink-0 flex flex-col bg-[var(--bg-surface-solid)] overflow-y-auto';
          colEl.innerHTML = `<div class="fe-miller-col-header px-3 py-1.5 text-[11px] font-mono font-semibold text-[var(--accent)] border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] sticky top-0">${escapeHtml(dirPath)}</div>`;
          try {
            const names = await fs.readdir(dirPath);
            names.sort(naturalCompare);
            for (const name of names) {
              const full = PathUtils.join(dirPath, name);
              try {
                const st = await fs.stat(full);
                const isDir = st.isDirectory();
                const info = getFileCategoryAndMime(name, isDir);
                const activeInChain = chain.includes(full);
                const row = document.createElement('div');
                row.className = `fe-selectable-item px-3 py-2 flex items-center justify-between text-xs cursor-pointer ${activeInChain ? 'bg-[var(--bg-active)] text-[var(--accent-bright)] font-semibold' : 'hover:bg-[var(--bg-hover)]'}`;
                row.innerHTML = `
                  <div class="flex items-center gap-2 truncate">
                    <span class="w-4 h-4 text-[var(--accent)] shrink-0">${info.icon}</span>
                    <span class="truncate">${escapeHtml(name)}</span>
                  </div>
                  ${isDir ? `<span class="text-[var(--text-muted)]">${Icons.chevronRight}</span>` : ''}
                `;
                bindFileRowInteractions(row, {
                  name, path: full, isDir, mtime: st.mtime, size: st.size || 0, typeLabel: info.typeLabel, category: info.category, icon: info.icon
                });
                colEl.appendChild(row);
              } catch (e) {}
            }
          } catch (e) {}
          wrapper.appendChild(colEl);
        }

        contentHost.appendChild(wrapper);
      };

      // Global Recursive Search across all backends
      const runGlobalSearch = async () => {
        const kw = b.querySelector('#fe-search-input').value.trim().toLowerCase();
        if (!kw) {
          loadAndRenderDirectory();
          return;
        }
        showLoading(`正在全局检索 "${kw}"...`);
        const results = [];
        const visited = new Set();
        const walk = async (dir, depth = 0) => {
          if (depth > 6 || visited.has(dir)) return;
          visited.add(dir);
          try {
            const names = await fs.readdir(dir);
            for (const name of names) {
              const full = PathUtils.join(dir, name);
              try {
                const st = await fs.stat(full);
                const isDir = st.isDirectory();
                if (name.toLowerCase().includes(kw)) {
                  const info = getFileCategoryAndMime(name, isDir);
                  results.push({
                    name: `${name} (${PathUtils.dirname(full)})`,
                    path: full,
                    isDir,
                    mtime: st.mtime || Date.now(),
                    size: st.size || 0,
                    folderSizeCalculated: true,
                    typeLabel: info.typeLabel,
                    category: info.category,
                    icon: info.icon
                  });
                }
                if (isDir) await walk(full, depth + 1);
              } catch (e) {}
            }
          } catch (e) {}
        };
        await walk('/');
        hideLoading();
        notify(`全局检索找到 ${results.length} 个匹配项`, 'info');
        await loadAndRenderDirectory(results);
      };

      // Drop onto File Explorer Blank Viewport -> Move or Import into currentPath
      mainViewport.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      mainViewport.addEventListener('drop', async (e) => {
        e.preventDefault();
        const raw = e.dataTransfer.getData('application/x-kintsugi-vfs');
        if (raw) {
          const payload = JSON.parse(raw);
          for (const p of payload.paths) {
            if (p.startsWith('app:')) continue;
            const dest = PathUtils.join(currentPath, PathUtils.basename(p));
            if (PathUtils.normalize(p) !== dest) {
              await fs.rename(p, dest);
            }
          }
        } else {
          await handleExternalDropEntries(e.dataTransfer, currentPath);
        }
      });

      // Context menu on File Explorer blank space
      mainViewport.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.fe-selectable-item')) return;
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, [
          { label: '刷新当前文件夹', icon: Icons.refresh, action: () => loadAndRenderDirectory() },
          { divider: true },
          {
            label: '新建文件夹',
            icon: Icons.folder,
            action: async () => {
              const name = await promptModal('新建文件夹', '文件夹名称:', '新建文件夹');

    Apps.openNotepad = async function (filePath = null) {
      let currentFile = filePath ? PathUtils.normalize(filePath) : null;
      let fontSize = 14;
      let undoStack = [];
      let redoStack = [];
      let autoSaveTimer = null;
      const draftKey = `kintsugi_notepad_draft_${currentFile || 'untitled'}`;

      const win = WindowManager.createWindow({
        appId: 'notepad',
        title: `曜金记事本 — ${currentFile ? PathUtils.basename(currentFile) : '未命名文档.txt'}`,
        icon: Icons.fileText,
        width: 720,
        height: 500,
        onCleanup: () => {
          if (autoSaveTimer) clearTimeout(autoSaveTimer);
        }
      });

      win.bodyEl.innerHTML = `
        <div class="px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex flex-wrap items-center gap-1.5">

            <button id="np-save-as" class="k-btn">${Icons.fileText}<span>另存为</span></button>

            <button id="np-font-inc" class="k-btn px-2">A+</button>
            <label class="flex items-center gap-1 ml-2 text-[var(--text-secondary)] cursor-pointer">
              <input type="checkbox" id="np-autosave" checked class="accent-[var(--accent)]" />
              <span>自动保存</span>
            </label>
          </div>
        </div>
        <textarea id="np-textarea" class="flex-1 w-full p-4 bg-[var(--bg-abyss)] text-[var(--text-primary)] font-mono outline-none resize-none leading-relaxed" style="font-size: 14px;" placeholder="在此输入文本内容，自动保存开启时将实时同步至 OPFS/VFS..."></textarea>
        <div class="h-7 px-3 border-t border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex items-center justify-between text-[11px] font-mono text-[var(--text-secondary)]">
          <span id="np-status-msg">状态: 就绪</span>
          <span id="np-char-count">0 字符 | 1 行 | UTF-8</span>
        </div>
      `;

      const b = win.bodyEl;
      const ta = b.querySelector('#np-textarea');
      const statusMsg = b.querySelector('#np-status-msg');
      const charCount = b.querySelector('#np-char-count');

      // Load file content from VFS or draft
      if (currentFile) {
        try {
          const text = await fs.readFile(currentFile, 'utf8');
          ta.value = text;
          undoStack.push(text);
        } catch (err) {
          notify('读取文件失败: ' + err.message, 'error');
        }
      } else {
        const savedDraft = localStorage.getItem(draftKey);
        if (savedDraft) {
          ta.value = savedDraft;
          undoStack.push(savedDraft);
          statusMsg.textContent = '状态: 已恢复上次未保存草稿';
        } else {
          undoStack.push('');
        }
      }

      const updateStats = () => {
        const val = ta.value;
        const lines = val.split('\n').length;
        charCount.textContent = `${val.length} 字符 | ${lines} 行 | UTF-8`;
      };
      updateStats();

      const saveToVfs = async (silent = false) => {
        if (!currentFile) {
          if (silent) {
            localStorage.setItem(draftKey, ta.value);
            statusMsg.textContent = `草稿已自动暂存 (${new Date().toLocaleTimeString()})`;
            return;
          }
          const name = await promptModal('保存文件', '请输入要保存到桌面的文件名:', '笔记.txt');
          if (!name) return;
          currentFile = PathUtils.join('/Desktop', name);
          WindowManager.setTitle(win.id, `曜金记事本 — ${PathUtils.basename(currentFile)}`);
        }
        await fs.writeFile(currentFile, ta.value, { mtime: Date.now() });
        localStorage.removeItem(draftKey);
        statusMsg.textContent = `已保存至 ${currentFile} (${new Date().toLocaleTimeString()})`;
        if (!silent) notify(`文件已保存: ${PathUtils.basename(currentFile)}`, 'success');
      };

      ta.addEventListener('input', () => {
        updateStats();
        if (undoStack[undoStack.length - 1] !== ta.value) {
          undoStack.push(ta.value);
          if (undoStack.length > 80) undoStack.shift();
          redoStack = [];
        }
        if (b.querySelector('#np-autosave').checked) {
          statusMsg.textContent = '正在输入 (等待自动保存...)';
          if (autoSaveTimer) clearTimeout(autoSaveTimer);
          autoSaveTimer = setTimeout(() => saveToVfs(true), 650);
        }
      });

      ta.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          saveToVfs(false);
        }
      });

      b.querySelector('#np-save').onclick = () => saveToVfs(false);
      b.querySelector('#np-save-as').onclick = async () => {
        const name = await promptModal('另存为', '请输入文件名:', currentFile ? PathUtils.basename(currentFile) : '新文档.txt');
        if (!name) return;
        const dir = currentFile ? PathUtils.dirname(currentFile) : '/Desktop';
        currentFile = PathUtils.join(dir, name);
        WindowManager.setTitle(win.id, `曜金记事本 — ${PathUtils.basename(currentFile)}`);
        await saveToVfs(false);
      };

      b.querySelector('#np-undo').onclick = () => {
        if (undoStack.length > 1) {
          redoStack.push(undoStack.pop());
          ta.value = undoStack[undoStack.length - 1];
          updateStats();
          if (b.querySelector('#np-autosave').checked) saveToVfs(true);
        }
      };

      b.querySelector('#np-redo').onclick = () => {
        if (redoStack.length > 0) {
          const next = redoStack.pop();
          undoStack.push(next);
          ta.value = next;
          updateStats();
          if (b.querySelector('#np-autosave').checked) saveToVfs(true);
        }
      };

      const applyFont = () => {
        ta.style.fontSize = `${fontSize}px`;
        b.querySelector('#np-font-val').textContent = `${fontSize}px`;
      };
      b.querySelector('#np-font-dec').onclick = () => { fontSize = Math.max(10, fontSize - 1); applyFont(); };
      b.querySelector('#np-font-inc').onclick = () => { fontSize = Math.min(32, fontSize + 1); applyFont(); };
    };

    // ----------------------------------------------------------------------------
    // 4.2.1 Structured Table Editor (CSV / TSV Dual-View Switcher)
    // ----------------------------------------------------------------------------
    Apps.openTableEditor = async function (filePath = '/Desktop/数据报表_2026.csv') {
      let currentFile = filePath ? PathUtils.normalize(filePath) : '/Desktop/未命名表格.csv';
      let ext = PathUtils.extname(currentFile);
      let delimiter = ext === '.tsv' ? '\t' : ',';
      let mode = 'table'; // 'table' | 'text'
      let rawContent = '';
      let gridData = [['列1', '列2', '列3'], ['', '', '']];

      const parseDelimited = (txt, delim) => {
        const lines = txt.replace(/\r\n/g, '\n').split('\n').filter((l, i, arr) => l.length > 0 || i < arr.length - 1);
        if (lines.length === 0) return [['列1', '列2'], ['', '']];
        return lines.map(line => {
          const row = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
              if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
              else inQuotes = !inQuotes;
            } else if (ch === delim && !inQuotes) {
              row.push(cur);
              cur = '';
            } else {
              cur += ch;
            }
          }
          row.push(cur);
          return row;
        });
      };

      const serializeDelimited = (grid, delim) => {
        return grid.map(row => row.map(cell => {
          const s = String(cell ?? '');
          if (s.includes(delim) || s.includes('"') || s.includes('\n')) {
            return `"${s.replace(/"/g, '""')}"`;
          }
          return s;
        }).join(delim)).join('\n');
      };

      try {
        if (await fs.exists(currentFile)) {
          rawContent = await fs.readFile(currentFile, 'utf8');
          gridData = parseDelimited(rawContent, delimiter);
        } else {
          rawContent = serializeDelimited(gridData, delimiter);
        }
      } catch (e) {}

      const win = WindowManager.createWindow({
        appId: 'table',
        title: `结构化表格 (${ext === '.tsv' ? 'TSV' : 'CSV'}) — ${PathUtils.basename(currentFile)}`,
        icon: Icons.fileTable,
        width: 860,
        height: 540
      });

      win.bodyEl.innerHTML = `
        <div class="px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex flex-wrap items-center gap-1.5">
            <button id="tb-view-table" class="k-btn primary">${Icons.fileTable}<span>表格视图</span></button>
            <button id="tb-view-text" class="k-btn">${Icons.fileText}<span>文本视图</span></button>
            <span class="mx-1 text-[var(--border-subtle)]">|</span>
            <button id="tb-add-row" class="k-btn">${Icons.plus}<span>添加行</span></button>
            <button id="tb-add-col" class="k-btn">${Icons.plus}<span>添加列</span></button>
            <button id="tb-save" class="k-btn primary">${Icons.save}<span>保存回 OPFS</span></button>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[var(--text-secondary)]">分隔符:</span>
            <select id="tb-delim-select" class="k-select text-xs">
              <option value="," ${delimiter === ',' ? 'selected' : ''}>逗号 (CSV)</option>
              <option value="&#9;" ${delimiter === '\t' ? 'selected' : ''}>制表符 (TSV)</option>
            </select>
          </div>
        </div>
        <div id="tb-table-container" class="flex-1 overflow-auto p-3 bg-[var(--bg-abyss)]"></div>
        <textarea id="tb-text-container" class="flex-1 w-full p-4 bg-[var(--bg-abyss)] text-[var(--text-primary)] font-mono text-xs outline-none resize-none hidden"></textarea>
        <div class="h-7 px-3 border-t border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex items-center justify-between text-[11px] font-mono text-[var(--text-secondary)]">
          <span id="tb-status">路径: ${escapeHtml(currentFile)}</span>
          <span id="tb-dims">0 行 × 0 列</span>
        </div>
      `;

      const b = win.bodyEl;
      const tableWrap = b.querySelector('#tb-table-container');
      const textWrap = b.querySelector('#tb-text-container');
      const dimsEl = b.querySelector('#tb-dims');

      const renderTableGrid = () => {
        const maxCols = Math.max(1, ...gridData.map(r => r.length));
        dimsEl.textContent = `${gridData.length} 行 × ${maxCols} 列`;

        let html = `<table class="border-collapse text-xs min-w-full font-mono"><thead><tr class="bg-[var(--bg-elevated-solid)]">`;
        html += `<th class="border border-[var(--border-subtle)] px-2.5 py-1.5 text-[var(--text-muted)] w-10 text-center">#</th>`;
        for (let c = 0; c < maxCols; c++) {
          const headVal = gridData[0]?.[c] ?? `Col ${c + 1}`;
          html += `<th class="border border-[var(--border-subtle)] p-0 min-w-[120px]">
            <input data-r="0" data-c="${c}" value="${escapeHtml(headVal)}" class="tb-cell-input w-full px-2.5 py-1.5 bg-transparent font-bold text-[var(--accent)] outline-none focus:bg-[var(--bg-hover)]" />
          </th>`;
        }
        html += `</tr></thead><tbody>`;

        for (let r = 1; r < gridData.length; r++) {
          html += `<tr class="hover:bg-[var(--bg-subtle)]">`;
          html += `<td class="border border-[var(--border-subtle)] px-2 py-1 text-center text-[var(--text-muted)] bg-[var(--bg-elevated)]">${r}</td>`;
          for (let c = 0; c < maxCols; c++) {
            const val = gridData[r]?.[c] ?? '';
            html += `<td class="border border-[var(--border-subtle)] p-0">
              <input data-r="${r}" data-c="${c}" value="${escapeHtml(val)}" class="tb-cell-input w-full px-2.5 py-1.5 bg-transparent text-[var(--text-primary)] outline-none focus:bg-[var(--bg-hover)]" />
            </td>`;
          }
          html += `</tr>`;
        }
        html += `</tbody></table>`;
        tableWrap.innerHTML = html;

        tableWrap.querySelectorAll('.tb-cell-input').forEach(inp => {
          inp.addEventListener('input', () => {
            const r = parseInt(inp.getAttribute('data-r'), 10);
            const c = parseInt(inp.getAttribute('data-c'), 10);
            while (gridData.length <= r) gridData.push([]);
            gridData[r][c] = inp.value;
            rawContent = serializeDelimited(gridData, delimiter);
          });
        });
      };

      const switchView = (targetMode) => {
        if (targetMode === 'text' && mode === 'table') {
          rawContent = serializeDelimited(gridData, delimiter);
          textWrap.value = rawContent;
          tableWrap.classList.add('hidden');
          textWrap.classList.remove('hidden');
        } else if (targetMode === 'table' && mode === 'text') {
          rawContent = textWrap.value;
          gridData = parseDelimited(rawContent, delimiter);
          textWrap.classList.add('hidden');
          tableWrap.classList.remove('hidden');
          renderTableGrid();
        }
        mode = targetMode;
        b.querySelector('#tb-view-table').classList.toggle('primary', mode === 'table');
        b.querySelector('#tb-view-text').classList.toggle('primary', mode === 'text');
      };

      b.querySelector('#tb-view-table').onclick = () => switchView('table');
      b.querySelector('#tb-view-text').onclick = () => switchView('text');

      b.querySelector('#tb-add-row').onclick = () => {
        if (mode === 'text') switchView('table');
        const cols = Math.max(1, ...gridData.map(r => r.length));
        gridData.push(new Array(cols).fill(''));
        rawContent = serializeDelimited(gridData, delimiter);
        renderTableGrid();
      };

      b.querySelector('#tb-add-col').onclick = () => {
        if (mode === 'text') switchView('table');
        gridData.forEach((row, idx) => row.push(idx === 0 ? `新列${row.length + 1}` : ''));
        rawContent = serializeDelimited(gridData, delimiter);
        renderTableGrid();
      };

      b.querySelector('#tb-delim-select').onchange = (e) => {
        delimiter = e.target.value;
        if (mode === 'text') rawContent = textWrap.value;
        gridData = parseDelimited(rawContent, delimiter);
        if (mode === 'table') renderTableGrid();
      };

      b.querySelector('#tb-save').onclick = async () => {
        if (mode === 'text') rawContent = textWrap.value;
        else rawContent = serializeDelimited(gridData, delimiter);
        await fs.writeFile(currentFile, rawContent, { mtime: Date.now() });
        b.querySelector('#tb-status').textContent = `已保存至 ${currentFile} (${new Date().toLocaleTimeString()})`;
        notify(`表格已保存至 OPFS: ${PathUtils.basename(currentFile)}`, 'success');
      };

      renderTableGrid();
    };

              <div class="w-8 h-8 animate-spin text-[var(--accent)]">${Icons.logo}</div>

            </div>
            <iframe id="he-preview-iframe" class="w-full h-full border-0 bg-[#090a0d]" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
          </div>
        </div>

        <!-- Status Bar (Requirement 4.3.14) -->
        <div class="h-7 px-3 border-t border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between text-[11px] font-mono text-[var(--text-secondary)]">

            <span>编码: UTF-8</span>

        </div>

        <input type="file" id="he-local-import-input" class="hidden" />
      `;

      const b = win.bodyEl;
      const modeSelect = b.querySelector('#he-mode-select');
      modeSelect.value = currentMode;

      // Initial Content
      let initialCode = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>曜金实时预览</title>
  <style>
    body {

  </style>
</head>
<body>
  <div class="card">
    <h1>KINTSUGI CODE STUDIO</h1>
    <p>编辑左侧代码即可实时驱动右侧 DOM 隔离预览视图</p>

  </div>

      if (currentFile) {
        try {
          initialCode = await fs.readFile(currentFile, 'utf8');
        } catch (err) {
          notify('加载文件失败: ' + err.message, 'error');
        }
      }

      // Initialize CodeMirror 5.65.16 Kernel
      const hostTa = b.querySelector('#he-cm-host');
      hostTa.value = initialCode;

      cmInstance = CodeMirror.fromTextArea(hostTa, {
        mode: currentMode,
        theme: 'material-darker',
        lineNumbers: true,
        lineWrapping: true,
        styleActiveLine: true,
        indentUnit: 2,
        tabSize: 2,
        inputStyle: CodeMirror.defaults.inputStyle,
        extraKeys: {
          'Ctrl-S': () => saveFileToVfs(),
          'Cmd-S': () => saveFileToVfs(),
          'Ctrl-F': () => toggleFindBar(true),
          'Cmd-F': () => toggleFindBar(true)
        }
      });

      // Mobile contenteditable Select-All helper (Requirement 4.3: 手机模式下系统全选自动补全为全文!)
      const attachContentEditableSelectAllHelper = () => {
        const wrapper = cmInstance.getWrapperElement();
        wrapper.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            cmInstance.execCommand('selectAll');
          }
        });
        document.addEventListener('selectionchange', () => {
          if (!cmInstance || cmInstance.getOption('inputStyle') !== 'contenteditable') return;
          const activeEl = document.activeElement;
          if (activeEl && wrapper.contains(activeEl)) {
            const sel = window.getSelection();
            if (sel && sel.toString().length > 0 && sel.toString().length >= activeEl.innerText.length - 2) {
              // User triggered native OS "Select All" in contenteditable mode -> expand to full CodeMirror document
              const totalLen = cmInstance.getValue().length;
              if (cmInstance.getSelection().length < totalLen) {
                cmInstance.execCommand('selectAll');
              }
            }
          }
        });
      };
      attachContentEditableSelectAllHelper();

      // Update Status Bar (Cursor, Selection, Lines, Chars, Mode)
      const updateEditorStatus = () => {
        if (!cmInstance) return;
        const cur = cmInstance.getCursor();
        b.querySelector('#he-st-cursor').textContent = `行 ${cur.line + 1}, 列 ${cur.ch + 1}`;
        const selText = cmInstance.getSelection();
        const selEl = b.querySelector('#he-st-sel');
        if (selText && selText.length > 0) {
          selEl.textContent = `已选 ${selText.length} 字符`;
          selEl.classList.remove('hidden');
        } else {
          selEl.classList.add('hidden');
        }
        const val = cmInstance.getValue();
        b.querySelector('#he-st-totals').textContent = `共 ${cmInstance.lineCount()} 行 | 共 ${val.length} 字符`;
        b.querySelector('#he-st-lang').textContent = modeMap[currentMode]?.label || currentMode;
      };

      // Real-Time DOM-Isolated Preview with Dark Mask
      const renderPreview = (showMaskEffect = false) => {
        if (!cmInstance) return;
        const code = cmInstance.getValue();
        const iframe = b.querySelector('#he-preview-iframe');
        const mask = b.querySelector('#he-preview-mask');

        if (showMaskEffect) {
          mask.style.opacity = '1';
        }

        let htmlDoc = code;
        if (currentMode === 'css') {
          htmlDoc = `<!DOCTYPE html><html><head><style>body{background:#090a0d;color:#f2efe9;font-family:sans-serif;padding:20px;}${code}</style></head><body><h2>CSS 样式实时预览</h2><p>在此预览当前 CSS 规则渲染效果。</p><button>示例按钮</button></body></html>`;
        } else if (currentMode === 'javascript') {
          htmlDoc = `<!DOCTYPE html><html><head><style>body{background:#090a0d;color:#d4a853;font-family:monospace;padding:16px;}</style></head><body><div id="out">JavaScript 控制台输出:<hr/></div><script>const log=(...a)=>{document.getElementById('out').innerHTML+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):x).join(' ')+'<br/>';};console.log=log;console.error=log;try{${code}}catch(e){log('Error:',e.message);}<\/script></body></html>`;
        } else if (currentMode === 'application/json') {
          htmlDoc = `<!DOCTYPE html><html><head><style>body{background:#090a0d;color:#34d399;font-family:monospace;padding:16px;white-space:pre-wrap;}</style></head><body>${escapeHtml(code)}</body></html>`;
        } else if (currentMode === 'markdown') {
          const simpleMd = escapeHtml(code)
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
            .replace(/\`(.*?)\`/gim, '<code style="background:#1e2230;padding:2px 5px;border-radius:4px;color:#d4a853;">$1</code>')
            .replace(/\n/gim, '<br/>');
          htmlDoc = `<!DOCTYPE html><html><head><style>body{background:#090a0d;color:#f2efe9;font-family:sans-serif;padding:24px;line-height:1.7;}h1,h2,h3{color:#d4a853;border-bottom:1px solid rgba(212,168,83,0.2);padding-bottom:6px;}</style></head><body>${simpleMd}</body></html>`;
        }

        if (previewBlobUrl) URL.revokeObjectURL(previewBlobUrl);
        previewBlobUrl = URL.createObjectURL(new Blob([htmlDoc], { type: 'text/html' }));
        iframe.onload = () => {
          mask.style.opacity = '0';
        };
        iframe.src = previewBlobUrl;
      };

      cmInstance.on('change', () => {
        updateEditorStatus();
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(() => renderPreview(false), 260);
      });
      cmInstance.on('cursorActivity', updateEditorStatus);

      // Mode Switcher
      const switchMode = (newMode) => {
        currentMode = newMode;
        modeSelect.value = newMode;
        cmInstance.setOption('mode', newMode);
        updateEditorStatus();
        renderPreview(true);
      };
      modeSelect.onchange = () => switchMode(modeSelect.value);

      // Input Mode Switcher (模式: 自动 / 电脑 / 手机)
      b.querySelector('#he-input-style').onchange = (e) => {
        const val = e.target.value;
        const targetStyle = val === 'auto' ? CodeMirror.defaults.inputStyle : val;
        cmInstance.setOption('inputStyle', targetStyle);
        cmInstance.refresh();
        notify(`已切换编辑器输入模式为: ${val === 'auto' ? '自动 (' + targetStyle + ')' : val}`, 'info');
      };

      // Code Formatter (Strictly Preserving Cursor Position!)
      const formatCode = () => {
        if (!cmInstance) return;
        const savedCursor = cmInstance.getCursor();
        const savedScroll = cmInstance.getScrollInfo();
        const raw = cmInstance.getValue();
        let formatted = raw;

        try {
          if (currentMode === 'application/json') {
            formatted = JSON.stringify(JSON.parse(raw), null, 2);
          } else if (currentMode === 'htmlmixed' || currentMode === 'xml') {
            // Clean structural HTML/XML/SVG indentation formatter
            let pad = 0;
            const tokens = raw.replace(/>\s*</g, '>\n<').split('\n');
            formatted = tokens.map(line => {
              let t = line.trim();
              if (!t) return '';
              if (/^<\/\w/.test(t)) pad = Math.max(0, pad - 1);
              const out = '  '.repeat(pad) + t;
              if (/^<\w[^>]*[^\/]>$/.test(t) && !/^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b/i.test(t) && !/<\/[^>]+>$/.test(t)) {
                pad++;
              }
              return out;
            }).join('\n');
          } else if (currentMode === 'css' || currentMode === 'javascript') {
            let pad = 0;
            const lines = raw.replace(/\{\s*/g, ' {\n').replace(/;\s*/g, ';\n').replace(/\}\s*/g, '\n}\n').split('\n');
            formatted = lines.map(l => {
              const t = l.trim();
              if (!t) return '';
              if (t.startsWith('}')) pad = Math.max(0, pad - 1);
              const res = '  '.repeat(pad) + t;
              if (t.endsWith('{')) pad++;
              return res;
            }).filter(Boolean).join('\n');
          }
          cmInstance.setValue(formatted);
          // Restore exact cursor position & scroll!
          const maxLine = Math.min(savedCursor.line, cmInstance.lineCount() - 1);
          const maxCh = Math.min(savedCursor.ch, cmInstance.getLine(maxLine).length);
          cmInstance.setCursor({ line: maxLine, ch: maxCh });
          cmInstance.scrollTo(savedScroll.left, savedScroll.top);
          cmInstance.focus();
          notify('代码格式化完成（已保持光标位置不变）', 'success');
        } catch (err) {
          notify('格式化解析提示: ' + err.message, 'error');
        }
      };

      b.querySelector('#he-format-btn').onclick = formatCode;

      // Save back to VFS (Ctrl+S or Save Button)
      const saveFileToVfs = async () => {
        if (!currentFile) {
          const defaultExt = modeMap[currentMode]?.ext || '.html';
          const name = await promptModal('保存到虚拟文件系统', `请输入文件名 (保存目录: ${saveDirectory}):`, `未命名文档${defaultExt}`);
          if (!name) return;
          currentFile = PathUtils.join(saveDirectory, name);
          WindowManager.setTitle(win.id, `HTML 代码编辑器 — ${PathUtils.basename(currentFile)}`);
        }
        await fs.writeFile(currentFile, cmInstance.getValue(), { mtime: Date.now() });
        await DesktopManager.renderIcons();
        b.querySelector('#he-st-path').textContent = `已保存: ${currentFile}`;
        notify(`已成功保存至 ${currentFile}`, 'success');
      };

      b.querySelector('#he-save-btn').onclick = saveFileToVfs;

      // Import Local File into Editor (Auto-switch language mode by extension)
      const importInput = b.querySelector('#he-local-import-input');
      b.querySelector('#he-import-btn').onclick = () => importInput.click();
      importInput.onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const text = await file.text();
        const detected = detectModeByExt(file.name);

        cmInstance.setValue(text);
        WindowManager.setTitle(win.id, `HTML 代码编辑器 — ${file.name}`);
        importInput.value = '';
        notify(`已导入本地文件 "${file.name}" 并切换为 ${modeMap[detected]?.label} 模式`, 'success');
      };

      // Export Modal: Supports Default or Custom Filename, AND Export to Physical Desktop or Virtual Desktop!
      b.querySelector('#he-export-btn').onclick = () => {
        const ext = modeMap[currentMode]?.ext || '.html';
        const baseDefault = currentFile ? PathUtils.basename(currentFile, PathUtils.extname(currentFile)) + ext : `export_code${ext}`;
        showModal({
          title: '导出编辑器代码',
          bodyHtml: `
            <div class="space-y-3">
              <div>
                <label class="block text-[var(--text-secondary)] mb-1">导出文件名 (自动匹配当前语言扩展名 ${escapeHtml(ext)}):</label>
                <input type="text" id="he-exp-name" class="k-input w-full font-mono" value="${escapeHtml(baseDefault)}" />
              </div>
              <div class="grid grid-cols-1 gap-2 pt-1">
                <button id="he-exp-phys-default" class="k-btn primary py-2 justify-center">${Icons.download}<span>下载导出到现实桌面 (使用上方名称)</span></button>
                <button id="he-exp-vfs-desktop" class="k-btn py-2 justify-center">${Icons.folder}<span>导出到虚拟桌面 (/Desktop)</span></button>
                <button id="he-exp-vfs-custom-dir" class="k-btn py-2 justify-center">${Icons.save}<span>自定义路径导出到虚拟文件系统</span></button>
              </div>
            </div>
          `,
          hideCancel: false,
          confirmText: '完成',
          cancelText: '取消'
        });

        setTimeout(() => {
          const getTargetName = () => {
            let v = document.getElementById('he-exp-name')?.value.trim() || baseDefault;
            if (!PathUtils.extname(v)) v += ext;

          const btnPhys = document.getElementById('he-exp-phys-default');

            const filename = getTargetName();

            notify(`已导出至虚拟桌面: ${dest}`, 'success');
          };

          if (btnVfsCustom) btnVfsCustom.onclick = async () => {
            const filename = getTargetName();
            const customPath = await promptModal('自定义虚拟系统导出路径', '请输入完整目录与文件名:', PathUtils.join(saveDirectory, filename));
            if (customPath) {
              await fs.writeFile(customPath, cmInstance.getValue(), { mtime: Date.now() });
              await DesktopManager.renderIcons();
              notify(`已导出至: ${customPath}`, 'success');
            }
          };
        }, 20);
      };

      // Find & Replace Implementation
      const findBar = b.querySelector('#he-find-bar');
      const toggleFindBar = (forceOpen) => {
        const show = forceOpen !== undefined ? forceOpen : findBar.classList.contains('hidden');
        findBar.classList.toggle('hidden', !show);
        findBar.classList.toggle('flex', show);
        if (show) b.querySelector('#he-find-input').focus();
