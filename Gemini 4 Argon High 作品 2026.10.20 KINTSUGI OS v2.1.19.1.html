<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-corners="rounded">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>曜金织界 KINTSUGI-CHRONO // Web OS</title>

  <!-- Distinctive Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,300..700;1,300..700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- JSZip 解压缩库 -->
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- V86 虚拟机模拟器 (严格锁定 0.5.319) -->
  <script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js"></script>

  <!-- 7z-wasm 解压引擎 -->
  <script type="module">
    import SevenZip from 'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js';
    window.SevenZipFactory = SevenZip;
  </script>

  <!-- CodeMirror 5.65.x 代码编辑器内核与模式 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>

  <style>
    :root {
      /* Kintsugi-Chrono (曜金织界) Aesthetic Variables - Default Dark Mode */
      --bg-abyss: #090a0d;
      --bg-surface: rgba(16, 18, 24, 0.88);
      --bg-surface-solid: #12141c;
      --bg-elevated: rgba(24, 27, 36, 0.94);
      --bg-elevated-solid: #191c26;
      --bg-subtle: rgba(255, 255, 255, 0.04);
      --bg-hover: rgba(212, 168, 83, 0.12);
      --bg-active: rgba(212, 168, 83, 0.22);

      --text-primary: #f2efe9;
      --text-secondary: #a5a198;
      --text-muted: #68655e;

      --accent: #d4a853;
      --accent-bright: #f0c975;
      --accent-glow: rgba(212, 168, 83, 0.32);
      --accent-secondary: #38bdf8;
      --danger: #e05252;
      --success: #34d399;
      --warning: #f59e0b;

      --border-hairline: rgba(212, 168, 83, 0.18);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(212, 168, 83, 0.65);

      --win-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.78), 0 0 0 1px var(--border-hairline);
      --win-radius: 10px;
      --btn-radius: 6px;
      --taskbar-h: 52px;

      --font-display: 'Syne', 'Noto Sans SC', sans-serif;
      --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Chivo Mono', monospace;
    }

    /* Carefully Engineered Light Theme: Alabaster Porcelain & Warm Bronze (白瓷墨金) */
    html[data-theme="light"] {
      --bg-abyss: #eae6df;
      --bg-surface: rgba(249, 247, 242, 0.90);
      --bg-surface-solid: #f7f4ee;
      --bg-elevated: rgba(255, 253, 249, 0.96);
      --bg-elevated-solid: #ffffff;
      --bg-subtle: rgba(24, 22, 18, 0.045);
      --bg-hover: rgba(168, 118, 32, 0.12);
      --bg-active: rgba(168, 118, 32, 0.22);

      --text-primary: #1c1a17;
      --text-secondary: #57534a;
      --text-muted: #8c867a;

      --accent: #a6731b;
      --accent-bright: #c48b28;
      --accent-glow: rgba(166, 115, 27, 0.25);
      --accent-secondary: #0284c7;
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;

      --border-hairline: rgba(166, 115, 27, 0.24);
      --border-subtle: rgba(28, 26, 23, 0.10);
      --border-focus: rgba(166, 115, 27, 0.75);

      --win-shadow: 0 20px 50px -12px rgba(28, 24, 18, 0.22), 0 0 0 1px var(--border-hairline);
    }

    html[data-corners="sharp"] {
      --win-radius: 0px;
      --btn-radius: 0px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, [contenteditable="true"], .CodeMirror * {
      user-select: text;
      -webkit-user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-abyss);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 145, 135, 0.28);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Desktop Root & Wallpaper */
    #os-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #wallpaper-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      transition: opacity 0.4s ease;
    }

    #wallpaper-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Architectural Grid Overlay */
    .tectonic-grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--border-subtle) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-subtle) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.35;
    }

    /* Desktop Workspace & Icons */
    #desktop-stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - var(--taskbar-h));
      z-index: 10;
      overflow: hidden;
      touch-action: none;
    }

    .desktop-icon {
      position: absolute;
      width: 86px;
      padding: 8px 6px;
      border-radius: var(--btn-radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      touch-action: none;
    }
    .desktop-icon.smooth-move {
      transition: left 0.22s cubic-bezier(0.22, 1, 0.36, 1), top 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.16s ease, background-color 0.15s ease;
    }
    .desktop-icon:hover {
      background: var(--bg-hover);
      border-color: var(--border-hairline);
      backdrop-filter: blur(6px);
    }
    .desktop-icon.selected {
      background: var(--bg-active);
      border-color: var(--accent);
      box-shadow: 0 0 16px -4px var(--accent-glow);
    }
    .desktop-icon.drag-target-hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-secondary);
      transform: scale(1.06);
    }
    .desktop-icon .icon-glyph {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
    }
    .desktop-icon .icon-label {
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      color: var(--text-primary);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      pointer-events: none;
      max-width: 100%;
    }
    html[data-theme="light"] .desktop-icon .icon-label {
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    /* Rubber-band Marquee Selection Box */
    .marquee-box {
      position: absolute;
      pointer-events: none;
      border: 1px solid var(--accent);
      background: var(--accent-glow);
      z-index: 9999;
      display: none;
    }

    /* Aero Snap Preview Indicator */
    #aero-snap-preview {
      position: fixed;
      z-index: 8000;
      pointer-events: none;
      border: 2px solid var(--accent);
      background: var(--accent-glow);
      backdrop-filter: blur(8px);
      border-radius: var(--win-radius);
      transition: all 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
      opacity: 0;
      transform: scale(0.96);
    }
    #aero-snap-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Window System & Aero Peek */
    #windows-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .os-window {
      position: absolute;
      pointer-events: auto;
      background: var(--bg-surface);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--border-hairline);
      border-radius: var(--win-radius);
      box-shadow: var(--win-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 280px;
      min-height: 180px;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .os-window.active-window {
      border-color: var(--border-focus);
      box-shadow: 0 28px 70px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px var(--accent);
    }
    .os-window.minimized {
      opacity: 0 !important;
      transform: translateY(40px) scale(0.9) !important;
      pointer-events: none !important;
    }
    .os-window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
    }

    /* Aero Peek Mode: translucent glass wireframes */
    body.aero-peek-active .os-window:not(.aero-peek-focus) {
      opacity: 0.12 !important;
      backdrop-filter: none !important;
      border: 1px dashed var(--accent) !important;
      pointer-events: none !important;
    }

    /* Window Titlebar - Tectonic Kintsugi Style (NO macOS traffic lights!) */
    .win-titlebar {
      height: 38px;
      min-height: 38px;
      background: linear-gradient(90deg, var(--bg-elevated) 0%, rgba(212, 168, 83, 0.06) 100%);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 12px;
      cursor: default;
      touch-action: none;
    }
    .win-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }
    .win-title-text {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-controls {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .win-ctrl-btn {
      width: 32px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--btn-radius);
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .win-ctrl-btn:hover {
      background: var(--bg-hover);
      color: var(--accent-bright);
      border-color: var(--border-hairline);
    }
    .win-ctrl-btn.close-btn:hover {
      background: rgba(224, 82, 82, 0.2);
      color: #ff7b7b;
      border-color: rgba(224, 82, 82, 0.45);
    }

    .win-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface-solid);
    }

    /* 8-Direction Window Resize Handles */
    .resizer {
      position: absolute;
      z-index: 30;
      touch-action: none;
    }
    .resizer-n { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .resizer-s { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
    .resizer-e { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .resizer-w { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
    .resizer-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resizer-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .resizer-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .resizer-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }

    /* Taskbar / Dock */
    #taskbar {
      position: relative;
      height: var(--taskbar-h);
      width: 100%;
      z-index: 5000;
      background: var(--bg-elevated);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 8px;
    }

    .taskbar-section {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
    }

    #taskbar-apps {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
    }
    #taskbar-apps::-webkit-scrollbar { display: none; }

    .tb-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: var(--btn-radius);
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
      position: relative;
    }
    .tb-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-hairline);
    }
    .tb-btn.active-app {
      background: var(--bg-active);
      border-color: var(--accent);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .tb-btn .tb-close {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      transition: all 0.12s;
    }
    .tb-btn .tb-close:hover {
      opacity: 1;
      background: var(--danger);
      color: #fff;
    }

    /* Aero Peek Blade at Far Right of Taskbar */
    #aero-peek-blade {
      width: 10px;
      height: 38px;
      border-left: 1px solid var(--border-hairline);
      background: rgba(212, 168, 83, 0.08);
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s;
    }
    #aero-peek-blade:hover {
      background: var(--accent);
    }

    /* Windows Explorer Standard Details View (Strict Requirement 4.1)
       Columns are left-aligned continuous columns, NOT stretched to fill!
       Right blank space belongs to list background for marquee selection. */
    .fe-details-viewport {
      position: relative;
      flex: 1;
      overflow: auto;
      background: var(--bg-surface-solid);
      touch-action: pan-y;
    }
    .fe-details-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      min-width: 100%;
      width: max-content;
      height: 32px;
      background: var(--bg-elevated-solid);
      border-bottom: 1px solid var(--border-subtle);
    }
    .fe-col-header {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-right: 1px solid var(--border-subtle);
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .fe-col-header:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .fe-col-resizer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 5;
    }
    .fe-col-resizer:hover {
      background: var(--accent);
    }
    .fe-details-body {
      position: relative;
      padding: 4px 0 48px 0;
      min-height: calc(100% - 32px);
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* Crucial: rows only occupy sum of column widths! */
    }
    .fe-detail-row {
      display: flex;
      align-items: center;
      height: 30px;
      width: max-content; /* Crucial: NOT 100%, leaves right space for marquee! */
      border: 1px solid transparent;
      border-radius: 4px;
      margin: 1px 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .fe-detail-row:hover {
      background: var(--bg-hover);
      border-color: var(--border-hairline);
    }
    .fe-detail-row.selected {
      background: var(--bg-active);
      border-color: var(--accent);
    }
    .fe-detail-cell {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 10px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex-shrink: 0;
      font-size: 12.5px;
      pointer-events: none;
    }

    /* Manga Viewer Webtoon Seamless Scroll Standard (Strict Requirement 4.3.1) */
    .manga-scroll-viewport {
      overscroll-behavior-y: none;
      overflow-y: auto;
      touch-action: pan-y;
      contain: layout style;
      -webkit-overflow-scrolling: touch;
      background: #000000;
      width: 100%;
      height: 100%;
      position: relative;
      cursor: grab;
    }
    .manga-scroll-viewport:active {
      cursor: grabbing;
    }
    .manga-item-slot {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      background: #08080a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .manga-item-slot.skeleton-loading {
      aspect-ratio: 720 / 1040;
      background: linear-gradient(110deg, #0d0e12 8%, #181b22 18%, #0d0e12 33%);
      background-size: 200% 100%;
      animation: shimmer 1.6s linear infinite;
    }
    @keyframes shimmer {
      to { background-position-x: -200%; }
    }

    /* Manga Fullscreen Immersive Mode: Hides titlebar and all chrome except top-right × */
    .os-window.manga-immersive-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      border: none !important;
      border-radius: 0 !important;
    }
    .os-window.manga-immersive-fullscreen .win-titlebar,
    .os-window.manga-immersive-fullscreen .manga-toolbar,
    .os-window.manga-immersive-fullscreen .resizer {
      display: none !important;
    }
    .manga-fs-exit-btn {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 100000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 15, 18, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }
    .manga-fs-exit-btn:hover {
      background: rgba(224, 82, 82, 0.85);
      color: #fff;
      opacity: 1;
    }
    .os-window.manga-immersive-fullscreen .manga-fs-exit-btn {
      display: flex !important;
    }

    /* CodeMirror Custom Integration */
    .CodeMirror {
      height: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 13.5px !important;
      line-height: 1.55 !important;
    }

    /* Utility Buttons & UI Elements */
    .k-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: var(--btn-radius);
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
    }
    .k-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-hairline);
      color: var(--accent-bright);
    }
    .k-btn.primary {
      background: rgba(212, 168, 83, 0.2);
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    html[data-theme="light"] .k-btn.primary {
      color: var(--accent);
      background: rgba(166, 115, 27, 0.15);
    }
    .k-btn.danger:hover {
      background: rgba(224, 82, 82, 0.18);
      border-color: var(--danger);
      color: var(--danger);
    }

    .k-input, .k-select {
      background: var(--bg-abyss);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: var(--btn-radius);
      padding: 5px 10px;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .k-input:focus, .k-select:focus {
      border-color: var(--accent);
    }

    /* Context Menu */
    #context-menu {
      position: fixed;
      z-index: 99990;
      min-width: 200px;
      background: var(--bg-elevated);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-hairline);
      border-radius: var(--win-radius);
      box-shadow: var(--win-shadow);
      padding: 5px;
      display: none;
    }
    .ctx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: var(--btn-radius);
      color: var(--text-primary);
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ctx-item:hover {
      background: var(--bg-hover);
      color: var(--accent-bright);
    }
    .ctx-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 4px 6px;
    }

    /* Responsive Mobile / Tablet Adaptation (Dock Mode) */
    @media (max-width: 768px) {
      :root {
        --taskbar-h: 60px;
      }
      #taskbar {
        padding: 0 6px;
      }
      .tb-btn span.tb-title {
        display: none;
      }
      .tb-btn {
        padding: 0 10px;
      }
      .os-window {
        min-width: 240px;
      }
    }
  </style>
</head>

    </div>

      <div id="desktop-icons-container" class="w-full h-full relative"></div>

    <input type="file" id="global-file-input" multiple class="hidden" />

    const CookieStore = {
      set(name, val, days = 365) {
        try {
          const d = new Date();
          d.setTime(d.getTime() + days * 86400000);
          document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
        } catch (e) {}
      },
      get(name) {
        try {
          const key = encodeURIComponent(name) + '=';
          const parts = document.cookie.split(';');
          for (let p of parts) {
            p = p.trim();
            if (p.indexOf(key) === 0) return decodeURIComponent(p.substring(key.length));
          }
        } catch (e) {}
        return null;
      }
    };

    let SysConfig = { ...DefaultConfig };

    function loadSysConfig() {
      try {
        const raw = localStorage.getItem(SYS_CONFIG_KEY) || CookieStore.get(SYS_CONFIG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          SysConfig = { ...DefaultConfig, ...parsed };
        }
      } catch (e) {
        console.warn('Config load fallback:', e);
      }
      applySysConfigVisuals();

    function saveSysConfig() {
      try {
        const str = JSON.stringify(SysConfig);
        localStorage.setItem(SYS_CONFIG_KEY, str);
        // Save compact core preferences to cookie as secondary fallback
        CookieStore.set(SYS_CONFIG_KEY, JSON.stringify({
          theme: SysConfig.theme,
          corners: SysConfig.corners,
          accent: SysConfig.accent,
          primaryBackend: SysConfig.primaryBackend,
          singleClickOpen: SysConfig.singleClickOpen,

    function hexToRgba(hex, alpha) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      if (isNaN(num)) return `rgba(212, 168, 83, ${alpha})`;
      return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
    }

    function formatBytes(bytes) {
      if (bytes === undefined || bytes === null || isNaN(bytes)) return '0 B';
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(Math.max(1, bytes)) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function formatDate(ms) {
      const d = new Date(ms || Date.now());
      if (isNaN(d.getTime())) return '2026-01-01 00:00';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    const PathUtils = {
      normalize(p) {
        if (!p || typeof p !== 'string') return '/';
        let parts = p.replace(/\\/g, '/').split('/');
        let out = [];
        for (const seg of parts) {
          if (!seg || seg === '.') continue;
          if (seg === '..') out.pop();
          else out.push(seg);
        }
        return '/' + out.join('/');
      },
      dirname(p) {
        const norm = this.normalize(p);
        if (norm === '/') return '/';
        const idx = norm.lastIndexOf('/');
        return idx <= 0 ? '/' : norm.slice(0, idx);
      },
      basename(p) {
        const norm = this.normalize(p);
        if (norm === '/') return '';
        const idx = norm.lastIndexOf('/');
        return norm.slice(idx + 1);
      },
      extname(p) {
        const base = this.basename(p);
        if (base.toLowerCase().endsWith('.tar.gz')) return '.tar.gz';
        const idx = base.lastIndexOf('.');
        return idx > 0 ? base.slice(idx).toLowerCase() : '';
      },
      join(...segs) {
        return this.normalize(segs.join('/'));
      }
    };

    // ============================================================================
    // SECTION 4: UNIFIED VIRTUAL FILE SYSTEM (VFS)
    // OPFS + IndexedDB + File System Access API (/mnt/local) + Metadata Preservation
    // ============================================================================
    const IDB_NAME = 'KintsugiVFS_DB_v1';
    const IDB_NODES_STORE = 'vfs_nodes';     // For IDBBackend files & directories
    const IDB_META_STORE = 'vfs_meta';       // Persistent mtime registry for OPFS & mounts
    const IDB_HANDLES_STORE = 'vfs_handles'; // Persistent FileSystemDirectoryHandle store

    class IDBHelper {
      constructor() {
        this.dbPromise = null;
      }
      open() {
        if (this.dbPromise) return this.dbPromise;
        this.dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(IDB_NAME, 2);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_NODES_STORE)) {
              const s = db.createObjectStore(IDB_NODES_STORE, { keyPath: 'path' });
              s.createIndex('parent', 'parent', { unique: false });
            }
            if (!db.objectStoreNames.contains(IDB_META_STORE)) {
              db.createObjectStore(IDB_META_STORE, { keyPath: 'path' });
            }
            if (!db.objectStoreNames.contains(IDB_HANDLES_STORE)) {
              db.createObjectStore(IDB_HANDLES_STORE, { keyPath: 'name' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return this.dbPromise;
      }
      async tx(storeName, mode, fn) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const t = db.transaction(storeName, mode);
          const store = t.objectStore(storeName);
          let res;
          try {
            res = fn(store, t);
          } catch (err) {
            reject(err);
            return;
          }
          if (res && typeof res.onsuccess !== 'undefined') {
            res.onsuccess = () => resolve(res.result);
            res.onerror = () => reject(res.error);
          } else {
            t.oncomplete = () => resolve(res);
            t.onerror = () => reject(t.error);
          }
        });
      }
    }

    const idbHelper = new IDBHelper();

    // Persistent Metadata Registry to strictly preserve modification time (mtime)
    // Combines IndexedDB + LocalStorage fallback for rock-solid mtime preservation
    const META_LS_KEY = 'kintsugi_vfs_meta_ls_v1';
    const MetaRegistry = {
      cache: new Map(),
      async init() {
        try {
          const rawLs = localStorage.getItem(META_LS_KEY);
          if (rawLs) {
            const parsed = JSON.parse(rawLs);
            for (const [k, v] of Object.entries(parsed)) this.cache.set(k, v);
          }
        } catch (e) {}
        try {
          const all = await idbHelper.tx(IDB_META_STORE, 'readonly', s => s.getAll());
          if (Array.isArray(all)) {
            for (const item of all) this.cache.set(item.path, item);
          }
        } catch (e) {}
      },
      _syncLs() {
        try {
          const obj = {};
          for (const [k, v] of this.cache.entries()) obj[k] = v;
          localStorage.setItem(META_LS_KEY, JSON.stringify(obj));
        } catch (e) {}
      },
      get(path) {
        return this.cache.get(PathUtils.normalize(path));
      },
      async set(path, meta) {
        const norm = PathUtils.normalize(path);
        const record = { path: norm, mtime: meta.mtime || Date.now(), ctime: meta.ctime || meta.mtime || Date.now() };
        this.cache.set(norm, record);
        this._syncLs();
        try {
          await idbHelper.tx(IDB_META_STORE, 'readwrite', s => s.put(record));
        } catch (e) {}
      },
      async remove(path) {
        const norm = PathUtils.normalize(path);
        this.cache.delete(norm);
        this._syncLs();
        try {
          await idbHelper.tx(IDB_META_STORE, 'readwrite', s => s.delete(norm));
        } catch (e) {}
      }
    };

    // Helper to convert any input data to Uint8Array / ArrayBuffer
    async function toUint8Array(data) {
      if (data instanceof Uint8Array) return data;
      if (data instanceof ArrayBuffer) return new Uint8Array(data);
      if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      if (data instanceof Blob) return new Uint8Array(await data.arrayBuffer());
      if (typeof data === 'string') return new TextEncoder().encode(data);
      return new TextEncoder().encode(String(data ?? ''));
    }

    // ----------------------------------------------------------------------------
    // Backend 1: Native OPFS Backend (Origin Private File System)
    // ----------------------------------------------------------------------------
    class OPFSBackend {
      constructor() {
        this.name = 'opfs';
        this.rootHandle = null;
        this.available = false;
      }
      async init() {
        try {
          if (navigator.storage && navigator.storage.getDirectory) {
            this.rootHandle = await navigator.storage.getDirectory();
            this.available = true;
          }
        } catch (e) {
          console.warn('OPFS unavailable, falling back to IndexedDB:', e);
          this.available = false;
        }
      }
      async _resolveDir(relPath, create = false) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return this.rootHandle;
        const parts = norm.slice(1).split('/');
        let curr = this.rootHandle;
        for (const part of parts) {
          curr = await curr.getDirectoryHandle(part, { create });
        }
        return curr;
      }
      async stat(relPath) {
        const norm = PathUtils.normalize(relPath);
        const meta = MetaRegistry.get('/opfs' + (norm === '/' ? '' : norm)) || MetaRegistry.get(norm);
        if (norm === '/') {
          return {
            isDirectory: () => true,
            isFile: () => false,
            size: 0,
            mtime: meta ? meta.mtime : Date.now(),
            ctime: meta ? meta.ctime : Date.now()
          };
        }
        const parentPath = PathUtils.dirname(norm);
        const name = PathUtils.basename(norm);
        const parentDir = await this._resolveDir(parentPath, false);
        try {
          const fileHandle = await parentDir.getFileHandle(name, { create: false });
          const file = await fileHandle.getFile();
          const mtime = (meta && meta.mtime) ? meta.mtime : file.lastModified;
          return {
            isDirectory: () => false,
            isFile: () => true,
            size: file.size,
            mtime,
            ctime: (meta && meta.ctime) ? meta.ctime : mtime
          };
        } catch (e) {
          const dirHandle = await parentDir.getDirectoryHandle(name, { create: false });
          if (dirHandle) {
            const mtime = (meta && meta.mtime) ? meta.mtime : Date.now();
            return {
              isDirectory: () => true,
              isFile: () => false,
              size: 0,
              mtime,
              ctime: mtime
            };
          }
          throw new Error(`ENOENT: no such file or directory '${norm}'`);
        }
      }
      async readdir(relPath) {
        const dir = await this._resolveDir(relPath, false);
        const entries = [];
        for await (const [name] of dir.entries()) {
          entries.push(name);
        }
        return entries;
      }
      async mkdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        await this._resolveDir(norm, true);
        if (!MetaRegistry.get('/opfs' + norm)) {
          await MetaRegistry.set('/opfs' + norm, { mtime: Date.now() });
        }
      }
      async readFile(relPath, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        const fileHandle = await parentDir.getFileHandle(PathUtils.basename(norm), { create: false });
        const file = await fileHandle.getFile();
        const ab = await file.arrayBuffer();
        const encoding = typeof options === 'string' ? options : options?.encoding;
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return new TextDecoder().decode(ab);
        }
        if (encoding === 'blob') return file;
        return new Uint8Array(ab);
      }
      async writeFile(relPath, data, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), true);
        const fileHandle = await parentDir.getFileHandle(PathUtils.basename(norm), { create: true });
        const bytes = await toUint8Array(data);
        const writable = await fileHandle.createWritable();
        await writable.write(bytes);
        await writable.close();
        const mtime = options?.mtime || Date.now();
        await MetaRegistry.set('/opfs' + norm, { mtime });
        await MetaRegistry.set(norm, { mtime });
      }
      async unlink(relPath) {
        const norm = PathUtils.normalize(relPath);
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        await parentDir.removeEntry(PathUtils.basename(norm), { recursive: false });
        await MetaRegistry.remove('/opfs' + norm);
        await MetaRegistry.remove(norm);
      }
      async rmdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return;
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        await parentDir.removeEntry(PathUtils.basename(norm), { recursive: true });
        await MetaRegistry.remove('/opfs' + norm);
        await MetaRegistry.remove(norm);
      }
    }

    // ----------------------------------------------------------------------------
    // Backend 2: High-Performance IndexedDB Backend (IDBBackend)
    // ----------------------------------------------------------------------------
    class IDBBackend {
      constructor() {
        this.name = 'idb';
      }
      async init() {
        await idbHelper.open();
        const root = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.get('/'));
        if (!root) {
          const now = Date.now();
          await idbHelper.tx(IDB_NODES_STORE, 'readwrite', s => s.put({
            path: '/', parent: '', name: '', isDir: true, size: 0, mtime: now, ctime: now, data: null
          }));
        }
      }
      async stat(relPath) {
        const norm = PathUtils.normalize(relPath);
        const node = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.get(norm));
        if (!node) throw new Error(`ENOENT: no such file or directory '${norm}'`);
        return {
          isDirectory: () => !!node.isDir,
          isFile: () => !node.isDir,
          size: node.size || 0,
          mtime: node.mtime || Date.now(),
          ctime: node.ctime || node.mtime || Date.now()
        };
      }
      async readdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        const children = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.index('parent').getAll(norm));
        return (children || []).map(c => c.name).filter(Boolean);
      }
      async mkdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return;
        const parts = norm.slice(1).split('/');
        let curr = '';
        for (const p of parts) {
          const parent = curr || '/';
          curr = curr + '/' + p;
          const existing = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.get(curr));
          if (!existing) {
            const now = Date.now();
            await idbHelper.tx(IDB_NODES_STORE, 'readwrite', s => s.put({
              path: curr, parent, name: p, isDir: true, size: 0, mtime: now, ctime: now, data: null
            }));
          }
        }
      }
      async readFile(relPath, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const node = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.get(norm));
        if (!node || node.isDir) throw new Error(`ENOENT: cannot read file '${norm}'`);
        const bytes = await toUint8Array(node.data || new Uint8Array(0));
        const encoding = typeof options === 'string' ? options : options?.encoding;
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return new TextDecoder().decode(bytes);
        }
        if (encoding === 'blob') {
          const info = getFileCategoryAndMime(norm);
          return new Blob([bytes], { type: info.mime });
        }
        return bytes;
      }
      async writeFile(relPath, data, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const parent = PathUtils.dirname(norm);
        const name = PathUtils.basename(norm);
        await this.mkdir(parent);
        const bytes = await toUint8Array(data);
        const existing = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.get(norm));
        const mtime = options?.mtime || Date.now();
        const ctime = existing?.ctime || mtime;
        await idbHelper.tx(IDB_NODES_STORE, 'readwrite', s => s.put({
          path: norm,
          parent,
          name,
          isDir: false,
          size: bytes.byteLength,
          mtime,
          ctime,
          data: bytes
        }));
      }
      async unlink(relPath) {
        const norm = PathUtils.normalize(relPath);
        await idbHelper.tx(IDB_NODES_STORE, 'readwrite', s => s.delete(norm));
      }
      async rmdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        const all = await idbHelper.tx(IDB_NODES_STORE, 'readonly', s => s.getAll());
        const prefix = norm === '/' ? '/' : norm + '/';
        await idbHelper.tx(IDB_NODES_STORE, 'readwrite', s => {
          for (const item of all) {
            if (item.path === norm || item.path.startsWith(prefix)) {
              if (item.path !== '/') s.delete(item.path);
            }
          }
        });
      }
    }

    // ----------------------------------------------------------------------------
    // Backend 3: Local File System Access API Backend (Mounted at /mnt/local/<name>)
    // Wraps a FileSystemDirectoryHandle with 100% identical VFSBackend interface
    // ----------------------------------------------------------------------------
    class LocalFSABackend {
      constructor(dirHandle, mountName) {
        this.name = 'local:' + mountName;
        this.rootHandle = dirHandle;
        this.mountName = mountName;
      }
      async _resolveDir(relPath, create = false) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return this.rootHandle;
        const parts = norm.slice(1).split('/');
        let curr = this.rootHandle;
        for (const part of parts) {
          curr = await curr.getDirectoryHandle(part, { create });
        }
        return curr;
      }
      async stat(relPath) {
        const norm = PathUtils.normalize(relPath);
        const metaKey = `/mnt/local/${this.mountName}${norm === '/' ? '' : norm}`;
        const savedMeta = MetaRegistry.get(metaKey);
        if (norm === '/') {
          return {
            isDirectory: () => true,
            isFile: () => false,
            size: 0,
            mtime: savedMeta?.mtime || Date.now(),
            ctime: savedMeta?.ctime || Date.now()
          };
        }
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        const base = PathUtils.basename(norm);
        try {
          const fh = await parentDir.getFileHandle(base, { create: false });
          const file = await fh.getFile();
          const mtime = savedMeta?.mtime || file.lastModified || Date.now();
          return {
            isDirectory: () => false,
            isFile: () => true,
            size: file.size,
            mtime,
            ctime: mtime
          };
        } catch (e) {
          const dh = await parentDir.getDirectoryHandle(base, { create: false });
          if (dh) {
            const mtime = savedMeta?.mtime || Date.now();
            return {
              isDirectory: () => true,
              isFile: () => false,
              size: 0,
              mtime,
              ctime: mtime
            };
          }
          throw new Error(`ENOENT: '${norm}'`);
        }
      }
      async readdir(relPath) {
        const dir = await this._resolveDir(relPath, false);
        const entries = [];
        for await (const [name] of dir.entries()) {
          entries.push(name);
        }
        return entries;
      }
      async mkdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        await this._resolveDir(norm, true);
      }
      async readFile(relPath, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        const fh = await parentDir.getFileHandle(PathUtils.basename(norm), { create: false });
        const file = await fh.getFile();
        const ab = await file.arrayBuffer();
        const encoding = typeof options === 'string' ? options : options?.encoding;
        if (encoding === 'utf8' || encoding === 'utf-8' || encoding === 'text') {
          return new TextDecoder().decode(ab);
        }
        if (encoding === 'blob') return file;
        return new Uint8Array(ab);
      }
      async writeFile(relPath, data, options = {}) {
        const norm = PathUtils.normalize(relPath);
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), true);
        const fh = await parentDir.getFileHandle(PathUtils.basename(norm), { create: true });
        const bytes = await toUint8Array(data);
        const writable = await fh.createWritable();
        await writable.write(bytes);
        await writable.close();
        if (options?.mtime) {
          await MetaRegistry.set(`/mnt/local/${this.mountName}${norm}`, { mtime: options.mtime });
        }
      }
      async unlink(relPath) {
        const norm = PathUtils.normalize(relPath);
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        await parentDir.removeEntry(PathUtils.basename(norm), { recursive: false });
      }
      async rmdir(relPath) {
        const norm = PathUtils.normalize(relPath);
        if (norm === '/') return;
        const parentDir = await this._resolveDir(PathUtils.dirname(norm), false);
        await parentDir.removeEntry(PathUtils.basename(norm), { recursive: true });
      }
    }

    // ----------------------------------------------------------------------------
    // Unified VFS Router (`window.fs`) - No `isLocal` branches in Upper Layer!
    // ----------------------------------------------------------------------------
    const opfsBackend = new OPFSBackend();
    const idbBackend = new IDBBackend();
    const localMounts = new Map(); // folderName -> LocalFSABackend

    function getPrimaryBackend() {
      if (SysConfig.primaryBackend === 'idb' || !opfsBackend.available) {
        return idbBackend;
      }
      return opfsBackend;
    }

    // Resolves any virtual path into { backend, relPath, virtualType }
    function resolveMount(fullPath) {
      const norm = PathUtils.normalize(fullPath);

      if (norm === '/opfs' || norm.startsWith('/opfs/')) {
        const rel = norm.slice(5) || '/';
        return { backend: opfsBackend.available ? opfsBackend : idbBackend, relPath: rel };
      }
      if (norm === '/idb' || norm.startsWith('/idb/')) {
        const rel = norm.slice(4) || '/';
        return { backend: idbBackend, relPath: rel };
      }
      if (norm === '/mnt') {
        return { virtualDir: 'mnt' };
      }
      if (norm === '/mnt/local') {
        return { virtualDir: 'mnt_local' };
      }
      if (norm.startsWith('/mnt/local/')) {
        const rest = norm.slice('/mnt/local/'.length);
        const slashIdx = rest.indexOf('/');
        const mountName = slashIdx === -1 ? rest : rest.slice(0, slashIdx);
        const relPath = slashIdx === -1 ? '/' : rest.slice(slashIdx);
        const backend = localMounts.get(mountName);
        if (!backend) {
          throw new Error(`ENOENT: Mount point '/mnt/local/${mountName}' is not mounted`);
        }
        return { backend, relPath, isMountRoot: relPath === '/', mountName };
      }

      return { backend: getPrimaryBackend(), relPath: norm };
    }

    // Helper for 8.6 Parameter Signature Compatibility (Promise + Callback)
    function wrapFsMethod(fn) {
      return function (...args) {
        let cb = null;
        if (args.length > 0 && typeof args[args.length - 1] === 'function') {
          cb = args.pop();
        }
        const promise = Promise.resolve().then(() => fn.apply(this, args));
        if (cb) {
          promise.then(res => cb(null, res)).catch(err => cb(err));
        }
        return promise;
      };
    }

    const fs = {
      // Mount management methods
      async mountLocalDirectory() {
        if (!window.showDirectoryPicker) {
          notify('当前浏览器环境不支持 showDirectoryPicker API', 'error');
          return null;
        }
        try {
          const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          showLoading(`正在挂载本地文件夹 "${dirHandle.name}"...`);
          let mountName = dirHandle.name;
          localMounts.set(mountName, new LocalFSABackend(dirHandle, mountName));
          try {
            await idbHelper.tx(IDB_HANDLES_STORE, 'readwrite', s => s.put({ name: mountName, handle: dirHandle, mountedAt: Date.now() }));
          } catch (e) {}
          hideLoading();
          notify(`已成功挂载本地目录至 /mnt/local/${mountName}`, 'success');
          window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path: `/mnt/local/${mountName}` } }));
          return `/mnt/local/${mountName}`;
        } catch (err) {
          hideLoading();
          if (err.name !== 'AbortError') {
            notify('挂载本地文件夹失败: ' + err.message, 'error');
          }
          return null;
        }
      },

      async unmountLocalDirectory(mountName) {
        localMounts.delete(mountName);
        try {
          await idbHelper.tx(IDB_HANDLES_STORE, 'readwrite', s => s.delete(mountName));
        } catch (e) {}
        notify(`已卸载本地目录 /mnt/local/${mountName}`, 'info');
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path: '/mnt/local' } }));
      },

      getMountedLocalNames() {
        return Array.from(localMounts.keys());
      },

      async checkPendingRemounts() {
        try {
          const saved = await idbHelper.tx(IDB_HANDLES_STORE, 'readonly', s => s.getAll());
          if (!saved || saved.length === 0) return [];
          const pending = [];
          for (const item of saved) {
            if (!item.handle) continue;
            try {
              const perm = await item.handle.queryPermission({ mode: 'readwrite' });
              if (perm === 'granted') {
                localMounts.set(item.name, new LocalFSABackend(item.handle, item.name));
              } else {
                pending.push(item);
              }
            } catch (e) {
              pending.push(item);
            }
          }
          return pending;
        } catch (e) {
          return [];
        }
      },

      async restorePendingMounts(pendingList) {
        showLoading('正在恢复本地目录挂载授权...');
        let count = 0;
        for (const item of pendingList) {
          try {
            const perm = await item.handle.requestPermission({ mode: 'readwrite' });
            if (perm === 'granted') {
              localMounts.set(item.name, new LocalFSABackend(item.handle, item.name));
              count++;
            }
          } catch (e) {}
        }
        hideLoading();
        if (count > 0) {
          notify(`已恢复挂载 ${count} 个本地文件夹`, 'success');
          window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path: '/mnt/local' } }));
        }
        return count;
      },

      // Core POSIX-like VFS methods (wrapped for Promise + Callback compatibility)
      stat: wrapFsMethod(async function (path, _isLstat) {
        const res = resolveMount(path);
        if (res.virtualDir) {
          const now = Date.now();
          return { isDirectory: () => true, isFile: () => false, size: 0, mtime: now, ctime: now };
        }
        return await res.backend.stat(res.relPath);
      }),

      lstat: wrapFsMethod(async function (path) {
        return await fs.stat(path);
      }),

      exists: wrapFsMethod(async function (path) {
        try {
          await fs.stat(path);
          return true;
        } catch (e) {
          return false;
        }
      }),

      readdir: wrapFsMethod(async function (path) {
        const norm = PathUtils.normalize(path);
        const res = resolveMount(norm);
        if (res.virtualDir === 'mnt') return ['local'];
        if (res.virtualDir === 'mnt_local') return Array.from(localMounts.keys());

        const list = await res.backend.readdir(res.relPath);
        const set = new Set(list);
        if (norm === '/') {
          set.add('mnt');
          if (SysConfig.showDualBackendsInFE) {
            set.add('opfs');
            set.add('idb');
          }
        }
        return Array.from(set);
      }),

      mkdir: wrapFsMethod(async function (path, _options) {
        const res = resolveMount(path);
        if (res.virtualDir) return;
        await res.backend.mkdir(res.relPath);
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path } }));
      }),

      readFile: wrapFsMethod(async function (path, optionsOrFlag) {
        const res = resolveMount(path);
        if (res.virtualDir) throw new Error('EISDIR: illegal operation on a directory');
        return await res.backend.readFile(res.relPath, optionsOrFlag);
      }),

      writeFile: wrapFsMethod(async function (path, data, options) {
        const res = resolveMount(path);
        if (res.virtualDir) throw new Error('EISDIR: cannot write to virtual directory');
        await res.backend.writeFile(res.relPath, data, options || {});
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path } }));
      }),

      open: wrapFsMethod(async function (path, flags = 'r') {
        const isWrite = String(flags).includes('w') || String(flags).includes('a');
        return {
          path,
          flags,
          read: () => fs.readFile(path),
          write: (data, opts) => fs.writeFile(path, data, opts),
          close: async () => true,
          isWrite
        };
      }),

      unlink: wrapFsMethod(async function (path) {
        const res = resolveMount(path);
        if (res.virtualDir) throw new Error('EPERM: cannot unlink virtual mount');
        await res.backend.unlink(res.relPath);
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path } }));
      }),

      rmdir: wrapFsMethod(async function (path) {
        const res = resolveMount(path);
        if (res.virtualDir || res.isMountRoot) throw new Error('EPERM: cannot remove mount root');
        await res.backend.rmdir(res.relPath);
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path } }));
      }),

      remove: wrapFsMethod(async function (path) {
        const st = await fs.stat(path);
        if (st.isDirectory()) {
          await fs.rmdir(path);
        } else {
          await fs.unlink(path);
        }
      }),

      // Copy file or directory recursively while strictly preserving mtime!
      copyFile: wrapFsMethod(async function (src, dest) {
        const srcNorm = PathUtils.normalize(src);
        const destNorm = PathUtils.normalize(dest);
        if (srcNorm === destNorm) return;
        const st = await fs.stat(srcNorm);
        if (st.isDirectory()) {
          await fs.mkdir(destNorm);
          await MetaRegistry.set(destNorm, { mtime: st.mtime });
          const children = await fs.readdir(srcNorm);
          for (const child of children) {
            await fs.copyFile(PathUtils.join(srcNorm, child), PathUtils.join(destNorm, child));
          }
        } else {
          const data = await fs.readFile(srcNorm);
          await fs.writeFile(destNorm, data, { mtime: st.mtime });
        }
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path: destNorm } }));
      }),

      // Rename / Move across any backend while strictly preserving mtime!
      rename: wrapFsMethod(async function (oldPath, newPath) {
        const srcNorm = PathUtils.normalize(oldPath);
        const destNorm = PathUtils.normalize(newPath);
        if (srcNorm === destNorm) return;
        await fs.copyFile(srcNorm, destNorm);
        await fs.remove(srcNorm);
        window.dispatchEvent(new CustomEvent('vfs-change', { detail: { path: destNorm } }));
      }),

      utimes: wrapFsMethod(async function (path, _atime, mtime) {
        const ms = mtime instanceof Date ? mtime.getTime() : Number(mtime) || Date.now();
        await MetaRegistry.set(PathUtils.normalize(path), { mtime: ms });
      }),

      // Accurate Recursive Folder Size Calculation (Requirement 4.1)
      getFolderSize: wrapFsMethod(async function (dirPath, depth = 0) {
        if (depth > 8) return 0;
        const norm = PathUtils.normalize(dirPath);
        if (norm === '/' || norm === '/mnt') return 0;
        let total = 0;
        try {
          const names = await fs.readdir(norm);
          for (const name of names) {
            if (norm === '/' && (name === 'opfs' || name === 'idb' || name === 'mnt')) continue;
            const childPath = PathUtils.join(norm, name);
            try {
              const st = await fs.stat(childPath);
              if (st.isDirectory()) {
                total += await fs.getFolderSize(childPath, depth + 1);
              } else {
                total += (st.size || 0);
              }
            } catch (e) {}
          }
        } catch (e) {}
        return total;
      })
    };

    window.fs = fs;

    // ============================================================================
    // SECTION 5: ARCHIVE ENGINE (.zip with DOS Timezone Fix, .tar, .gz, .tgz, .7z)
    // ============================================================================
    const ArchiveEngine = {
      // Compress files/folders into .zip while preserving original mtime (fixing JSZip UTC bug)
      async compressToZip(paths, targetZipPath) {
        if (!window.JSZip) throw new Error('JSZip 未加载');
        showLoading('正在打包压缩并保留原始修改时间...');
        try {
          const zip = new JSZip();
          const addEntry = async (vfsPath, relZipPath) => {
            const st = await fs.stat(vfsPath);
            // JSZip writes DOS timestamps using getUTC* methods!
            // To make the stored DOS time equal the local time of st.mtime, we shift by timezone offset:
            const realMtime = st.mtime || Date.now();
            const dosAdjustedDate = new Date(realMtime - new Date(realMtime).getTimezoneOffset() * 60000);

            if (st.isDirectory()) {
              zip.folder(relZipPath);
              const children = await fs.readdir(vfsPath);
              for (const c of children) {
                await addEntry(PathUtils.join(vfsPath, c), relZipPath ? `${relZipPath}/${c}` : c);
              }
            } else {
              const bytes = await fs.readFile(vfsPath);
              zip.file(relZipPath, bytes, { date: dosAdjustedDate });
            }
          };

          for (const p of paths) {
            const base = PathUtils.basename(p);
            await addEntry(p, base);
          }

          const content = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
          await fs.writeFile(targetZipPath, content, { mtime: Date.now() });
          hideLoading();
          notify(`已生成压缩包: ${PathUtils.basename(targetZipPath)}`, 'success');
        } catch (err) {
          hideLoading();
          notify('压缩失败: ' + err.message, 'error');
        }
      },

      // Extract .zip, .tar, .gz, .tar.gz, .tgz, .7z into VFS while preserving entry mtime
      async extractArchive(archivePath, targetDir) {
        const ext = PathUtils.extname(archivePath);
        const baseName = PathUtils.basename(archivePath).replace(/(\.tar\.gz|\.tgz|\.zip|\.tar|\.gz|\.7z)$/i, '');
        const outDir = PathUtils.join(targetDir, baseName + '_解压');
        showLoading(`正在解压 ${PathUtils.basename(archivePath)}...`);
        try {
          await fs.mkdir(outDir);
          const bytes = await fs.readFile(archivePath);

          if (ext === '.zip') {
            const zip = await JSZip.loadAsync(bytes);
            const entries = Object.keys(zip.files);
            for (const key of entries) {
              const entry = zip.files[key];
              const destPath = PathUtils.join(outDir, key);
              // Fix JSZip UTC-parsed DOS time back to local timestamp:
              const rawDate = entry.date || new Date();
              const correctedMtime = rawDate.getTime() + rawDate.getTimezoneOffset() * 60000;
              if (entry.dir) {
                await fs.mkdir(destPath);
                await MetaRegistry.set(destPath, { mtime: correctedMtime });
              } else {
                const u8 = await entry.async('uint8array');
                await fs.writeFile(destPath, u8, { mtime: correctedMtime });
              }
            }
          } else if (ext === '.gz' || ext === '.tar.gz' || ext === '.tgz') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const decompressedBuf = await new Response(ds.readable).arrayBuffer();
            const decompressed = new Uint8Array(decompressedBuf);
            if (ext === '.tar.gz' || ext === '.tgz' || this._looksLikeTar(decompressed)) {
              await this._extractTarBuffer(decompressed, outDir);
            } else {
              const st = await fs.stat(archivePath);
              await fs.writeFile(PathUtils.join(outDir, baseName), decompressed, { mtime: st.mtime });
            }
          } else if (ext === '.tar') {
            await this._extractTarBuffer(bytes, outDir);
          } else if (ext === '.7z') {
            if (!window.SevenZipFactory) throw new Error('7z-wasm 引擎正在加载，请稍后重试');
            const sevenZip = await window.SevenZipFactory();
            const archiveName = 'input.7z';
            sevenZip.FS.writeFile(archiveName, bytes);
            sevenZip.callMain(['x', archiveName, '-o/out', '-y']);
            const read7zDir = async (emPath, vfsTarget) => {
              const items = sevenZip.FS.readdir(emPath).filter(n => n !== '.' && n !== '..');
              for (const item of items) {
                const fullEm = `${emPath}/${item}`;
                const fullVfs = PathUtils.join(vfsTarget, item);
                const stat = sevenZip.FS.stat(fullEm);
                const mtime = stat.mtime ? new Date(stat.mtime).getTime() : Date.now();
                if (sevenZip.FS.isDir(stat.mode)) {
                  await fs.mkdir(fullVfs);
                  await read7zDir(fullEm, fullVfs);
                } else {
                  const data = sevenZip.FS.readFile(fullEm);
                  await fs.writeFile(fullVfs, data, { mtime });
                }
              }
            };
            await read7zDir('/out', outDir);
          } else {
            throw new Error('不支持的归档格式: ' + ext);
          }

          hideLoading();
          notify(`已成功解压至 ${outDir}`, 'success');
          return outDir;
        } catch (err) {
          hideLoading();
          notify('解压出错: ' + err.message, 'error');
          throw err;
        }
      },

      _looksLikeTar(u8) {
        if (u8.byteLength < 512) return false;
        const magic = new TextDecoder().decode(u8.slice(257, 262));
        return magic === 'ustar';
      },

      async _extractTarBuffer(u8, outDir) {
        let offset = 0;
        const decoder = new TextDecoder();
        while (offset + 512 <= u8.byteLength) {
          const header = u8.slice(offset, offset + 512);
          if (header.every(b => b === 0)) break;
          const name = decoder.decode(header.slice(0, 100)).replace(/\0+$/, '').trim();
          const sizeOctal = decoder.decode(header.slice(124, 136)).replace(/\0+$/, '').trim();
          const mtimeOctal = decoder.decode(header.slice(136, 148)).replace(/\0+$/, '').trim();
          const typeFlag = String.fromCharCode(header[156]);
          const size = parseInt(sizeOctal, 8) || 0;
          const mtime = (parseInt(mtimeOctal, 8) * 1000) || Date.now();
          offset += 512;
          if (name) {
            const target = PathUtils.join(outDir, name);
            if (typeFlag === '5' || name.endsWith('/')) {
              await fs.mkdir(target);
              await MetaRegistry.set(target, { mtime });
            } else {
              const content = u8.slice(offset, offset + size);
              await fs.writeFile(target, content, { mtime });
            }
          }
          offset += Math.ceil(size / 512) * 512;
        }
      }
    };

    // Create a genuine 512-byte x86 real-mode boot sector image for V86 Emulator
    function createBootableFloppyImage() {
      const img = new Uint8Array(1440 * 1024); // 1.44MB standard floppy
      // Simple x86 real-mode boot sector that prints a Kintsugi OS banner via BIOS int 10h
      const msg = "=== KINTSUGI-CHRONO x86 REAL-MODE KERNEL (V86) ===\r\n\r\n" +
                  "Boot device  : /System/boot_demo.img (1.44MB Floppy)\r\n" +
                  "Architecture : i386 / SeaBIOS / VGA Text Mode\r\n" +
                  "Status       : ONLINE - Type any key to echo...\r\n\r\n> ";
      const code = [
        0xFA,                   // cli
        0x31, 0xC0,             // xor ax, ax
        0x8E, 0xD8,             // mov ds, ax
        0x8E, 0xC0,             // mov es, ax
        0x8E, 0xD0,             // mov ss, ax
        0xBC, 0x00, 0x7C,       // mov sp, 0x7c00
        0xFB,                   // sti
        0xB8, 0x03, 0x00,       // mov ax, 0x0003 (clear screen 80x25)
        0xCD, 0x10,             // int 0x10
        0xBE, 0x30, 0x7C,       // mov si, msg_offset (0x7c30)
        // print_loop (0x7c16):
        0xAC,                   // lodsb
        0x08, 0xC0,             // or al, al
        0x74, 0x06,             // jz key_loop
        0xB4, 0x0E,             // mov ah, 0x0e
        0xCD, 0x10,             // int 0x10
        0xEB, 0xF5,             // jmp print_loop
        // key_loop (0x7c21):
        0x31, 0xC0,             // xor ax, ax
        0xCD, 0x16,             // int 0x16 (wait for key)
        0xB4, 0x0E,             // mov ah, 0x0e
        0xCD, 0x10,             // int 0x10 (echo char)
        0xEB, 0xF6              // jmp key_loop
      ];
      img.set(code, 0);
      const msgBytes = new TextEncoder().encode(msg + '\0');
      img.set(msgBytes, 0x30);
      img[510] = 0x55;
      img[511] = 0xAA;
      return img;
    }
