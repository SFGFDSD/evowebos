      b.querySelector('#he-find-btn').onclick = () => toggleFindBar();
      b.querySelector('#he-find-close').onclick = () => toggleFindBar(false);

      let lastSearchQuery = '';
      let searchCursor = null;

      b.querySelector('#he-find-next').onclick = () => {
        const q = b.querySelector('#he-find-input').value;
        if (!q) return;
        if (q !== lastSearchQuery || !searchCursor) {
          lastSearchQuery = q;
          searchCursor = cmInstance.getSearchCursor(q, cmInstance.getCursor());
        }
        if (!searchCursor.findNext()) {
          searchCursor = cmInstance.getSearchCursor(q, { line: 0, ch: 0 });
          if (!searchCursor.findNext()) {
            notify('未找到匹配内容', 'info');
            return;
          }
        }
        cmInstance.setSelection(searchCursor.from(), searchCursor.to());
        cmInstance.scrollIntoView({ from: searchCursor.from(), to: searchCursor.to() }, 60);
      };

      b.querySelector('#he-replace-one').onclick = () => {
        const q = b.querySelector('#he-find-input').value;
        const rep = b.querySelector('#he-replace-input').value;
        if (!q) return;
        if (cmInstance.getSelection() === q) {
          cmInstance.replaceSelection(rep);
        }
        b.querySelector('#he-find-next').click();
      };

      b.querySelector('#he-replace-all').onclick = () => {
        const q = b.querySelector('#he-find-input').value;
        const rep = b.querySelector('#he-replace-input').value;
        if (!q) return;
        const cursor = cmInstance.getSearchCursor(q, { line: 0, ch: 0 });
        let count = 0;
        cmInstance.operation(() => {
          while (cursor.findNext()) {
            cursor.replace(rep);
            count++;
          }
        });
        notify(`已完成全部替换，共替换 ${count} 处`, 'success');
      };

      // Undo / Redo / Copy All / Clear / Refresh Preview / Open in New Window
      b.querySelector('#he-undo-btn').onclick = () => cmInstance.undo();
      b.querySelector('#he-redo-btn').onclick = () => cmInstance.redo();
      b.querySelector('#he-copy-all-btn').onclick = async () => {
        try {
          await navigator.clipboard.writeText(cmInstance.getValue());
          notify('已复制编辑器全部内容到剪贴板', 'success');
        } catch (e) {
          cmInstance.execCommand('selectAll');
          document.execCommand('copy');
          notify('已复制全部内容', 'success');
        }
      };
      b.querySelector('#he-clear-btn').onclick = () => {
        cmInstance.setValue('');
        cmInstance.focus();
        notify('编辑器内容已清空', 'info');
      };
      b.querySelector('#he-refresh-prev-btn').onclick = () => renderPreview(true);
      b.querySelector('#he-open-new-win-btn').onclick = () => {
        const blob = new Blob([cmInstance.getValue()], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      };
      b.querySelector('#he-open-sys-browser-btn').onclick = async () => {
        await saveFileToVfs();
        if (currentFile) Apps.openBrowser(currentFile);
      };

      // Split Layout Direction & View Mode + Draggable Splitter
      const workspace = b.querySelector('#he-workspace');
      const editorPane = b.querySelector('#he-editor-pane');
      const previewPane = b.querySelector('#he-preview-pane');
      const splitter = b.querySelector('#he-splitter');

      const applyLayoutGeometry = () => {
        workspace.style.flexDirection = splitDirection === 'horizontal' ? 'row' : 'column';
        if (viewLayout === 'code') {
          editorPane.style.display = 'block';
          editorPane.style.width = '100%';
          editorPane.style.height = '100%';
          splitter.style.display = 'none';
          previewPane.style.display = 'none';
        } else if (viewLayout === 'preview') {
          editorPane.style.display = 'none';
          splitter.style.display = 'none';
          previewPane.style.display = 'flex';
          previewPane.style.width = '100%';
          previewPane.style.height = '100%';
        } else {
          editorPane.style.display = 'block';
          splitter.style.display = 'flex';
          previewPane.style.display = 'flex';
          if (splitDirection === 'horizontal') {
            splitter.style.width = '6px';
            splitter.style.height = '100%';
            splitter.style.cursor = 'col-resize';
            editorPane.style.width = `${splitRatio}%`;
            editorPane.style.height = '100%';
            previewPane.style.width = `calc(${100 - splitRatio}% - 6px)`;
            previewPane.style.height = '100%';
          } else {
            splitter.style.width = '100%';
            splitter.style.height = '6px';
            splitter.style.cursor = 'row-resize';
            editorPane.style.width = '100%';
            editorPane.style.height = `${splitRatio}%`;
            previewPane.style.width = '100%';
            previewPane.style.height = `calc(${100 - splitRatio}% - 6px)`;
          }
        }
        if (cmInstance) cmInstance.refresh();
      };

      b.querySelector('#he-split-dir-btn').onclick = () => {
        splitDirection = splitDirection === 'horizontal' ? 'vertical' : 'horizontal';
        b.querySelector('#he-split-dir-label').textContent = splitDirection === 'horizontal' ? '左右分屏' : '上下分屏';
        applyLayoutGeometry();
      };

      b.querySelector('#he-view-mode-select').onchange = (e) => {
        viewLayout = e.target.value;
        applyLayoutGeometry();
      };

      // Draggable Splitter Bar
      let draggingSplit = false;
      const startSplitDrag = (e) => {
        e.preventDefault();
        draggingSplit = true;
        b.querySelector('#he-preview-iframe').style.pointerEvents = 'none';
      };
      const moveSplitDrag = (e) => {
        if (!draggingSplit) return;
        const rect = workspace.getBoundingClientRect();
        const pt = getClientXY(e);
        if (splitDirection === 'horizontal') {
          splitRatio = Math.max(15, Math.min(85, ((pt.clientX - rect.left) / rect.width) * 100));
        } else {
          splitRatio = Math.max(15, Math.min(85, ((pt.clientY - rect.top) / rect.height) * 100));
        }
        applyLayoutGeometry();
      };
      const endSplitDrag = () => {
        if (!draggingSplit) return;
        draggingSplit = false;
        b.querySelector('#he-preview-iframe').style.pointerEvents = 'auto';
      };

      splitter.addEventListener('mousedown', startSplitDrag);
      splitter.addEventListener('touchstart', startSplitDrag, { passive: false });
      document.addEventListener('mousemove', moveSplitDrag);
      document.addEventListener('touchmove', moveSplitDrag, { passive: true });
      document.addEventListener('mouseup', endSplitDrag);
      document.addEventListener('touchend', endSplitDrag);

      const onWinResize = (e) => {
        if (e.detail?.winId === win.id && cmInstance) cmInstance.refresh();
      };
      window.addEventListener('win-resize', onWinResize);

      setTimeout(() => {
        cmInstance.refresh();
        updateEditorStatus();
        renderPreview(true);
      }, 40);
    };

    // ============================================================================
    // SECTION 17: 4.3.1 MANGA VIEWER (漫画阅读器) & IMAGE VIEWER (图片查看器)
    // ============================================================================
    Apps.openMangaViewer = async function (clickedImagePath = '/Desktop/条漫示例_星渊纪元/1.png') {
      const normClicked = PathUtils.normalize(clickedImagePath);
      const lastSlash = normClicked.lastIndexOf('/');
      const dirPath = lastSlash <= 0 ? '/' : normClicked.slice(0, lastSlash);
      const clickedFilename = normClicked.slice(lastSlash + 1);

      let allEntries = [];
      try {
        allEntries = await fs.readdir(dirPath);
      } catch (err) {
        notify(`漫画目录读取失败 (${dirPath}): ${err.message}`, 'error');
        return;
      }

      // Filter all image files (case-insensitive) and sort via Natural Numeric Sort
      const imageFiles = allEntries.filter(name => isImageExt(name));
      if (imageFiles.length === 0) {
        notify('当前目录下未找到可识别的图片文件', 'error');
        return;
      }
      imageFiles.sort(naturalCompare);

      const targetIndex = Math.max(0, imageFiles.findIndex(n => n.toLowerCase() === clickedFilename.toLowerCase()));
      const createdBlobUrls = [];
      let inertiaRaf = null;

      const win = WindowManager.createWindow({
        appId: 'manga-viewer',
        title: `漫画阅读器 — ${PathUtils.basename(dirPath) || '/'} (共 ${imageFiles.length} 页)`,
        icon: Icons.fileManga,
        width: 840,
        height: 680,
        onCleanup: () => {
          if (inertiaRaf) cancelAnimationFrame(inertiaRaf);
          for (const u of createdBlobUrls) URL.revokeObjectURL(u);
          document.removeEventListener('fullscreenchange', onFsChange);
        }
      });

      win.bodyEl.innerHTML = `
        <!-- Top Control Bar (Hidden automatically in Fullscreen Immersive Mode) -->
        <div class="manga-toolbar px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2">
            <span class="font-mono text-[var(--accent)]" id="mv-page-indicator">页码: ${targetIndex + 1} / ${imageFiles.length}</span>
            <span class="text-[var(--text-secondary)] truncate max-w-[260px]" title="${escapeHtml(dirPath)}">目录: ${escapeHtml(dirPath)}</span>
          </div>
          <div class="flex items-center gap-1.5">
            <select id="mv-jump-select" class="k-select text-xs font-mono"></select>
            <button id="mv-switch-img-viewer" class="k-btn">${Icons.fileImage}<span>切换单图查看器</span></button>
            <button id="mv-fullscreen-btn" class="k-btn primary">${Icons.fullscreen}<span>全屏沉浸阅读</span></button>
          </div>
        </div>

        <!-- Floating Exit Button ONLY shown in Fullscreen Immersive Mode (Top-Right SVG Close) -->
        <button class="manga-fs-exit-btn" id="mv-fs-exit" title="退出全屏沉浸模式 (Esc)">${Icons.close}</button>

        <!-- Webtoon Seamless Vertical Scroll Viewport (Pure Black #000) -->
        <div id="mv-scroll-viewport" class="manga-scroll-viewport flex-1">
          <div id="mv-stream-container" class="w-full flex flex-col items-center"></div>
        </div>
      `;

      const b = win.bodyEl;
      const viewport = b.querySelector('#mv-scroll-viewport');
      const streamContainer = b.querySelector('#mv-stream-container');
      const jumpSelect = b.querySelector('#mv-jump-select');
      const pageIndicator = b.querySelector('#mv-page-indicator');

      // 1. Pre-allocate ordered skeleton slots in exact natural-sorted sequence
      const slotElements = imageFiles.map((filename, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.textContent = `P${idx + 1} - ${filename}`;
        if (idx === targetIndex) opt.selected = true;
        jumpSelect.appendChild(opt);

        const slot = document.createElement('div');
        slot.className = 'manga-item-slot skeleton-loading';
        slot.setAttribute('data-page-idx', String(idx));
        slot.innerHTML = `<div class="text-xs font-mono text-neutral-500 py-12">正在并行加载第 ${idx + 1} 页 (${escapeHtml(filename)})...</div>`;
        streamContainer.appendChild(slot);
        return slot;
      });

      // Scroll to user's clicked image immediately using skeleton geometry
      requestAnimationFrame(() => {
        const targetSlot = slotElements[targetIndex];
        if (targetSlot) {
          viewport.scrollTop = targetSlot.offsetTop;
        }
      });

      // 2. Parallel Binary Read + Ordered Slot Insertion + Scroll Height Delta Compensation!
      let initialPositionLocked = (targetIndex > 0);
      setTimeout(() => { initialPositionLocked = false; }, 1200);

      await Promise.allSettled(imageFiles.map(async (filename, idx) => {
        const fullImgPath = PathUtils.join(dirPath, filename);
        const slot = slotElements[idx];
        try {
          const bytes = await fs.readFile(fullImgPath);
          const info = getFileCategoryAndMime(filename, false);
          const blobUrl = URL.createObjectURL(new Blob([bytes], { type: info.mime }));
          createdBlobUrls.push(blobUrl);

          const img = new Image();
          img.decoding = 'async';
          img.draggable = false;
          img.className = 'w-full h-auto block select-none pointer-events-none';

          await new Promise((res, rej) => {
            img.onload = res;
            img.onerror = rej;
            img.src = blobUrl;
          });

          // Measure height before replacing skeleton to compensate scrollTop if above viewport!
          const prevHeight = slot.offsetHeight;
          const slotTop = slot.offsetTop;
          const wasAboveViewport = (slotTop + prevHeight <= viewport.scrollTop + 40);

          slot.classList.remove('skeleton-loading');
          slot.innerHTML = '';
          slot.appendChild(img);

          const newHeight = slot.offsetHeight;
          const deltaH = newHeight - prevHeight;

          if (initialPositionLocked && idx < targetIndex) {
            viewport.scrollTop = slotElements[targetIndex].offsetTop;
          } else if (wasAboveViewport && deltaH !== 0) {
            // Strict Requirement 4.3.1: Compensate scrollTop += deltaH so reading view never jumps!
            viewport.scrollTop += deltaH;
          }
        } catch (err) {
          // Single image failure fault tolerance: skip without interrupting overall stream
          slot.classList.remove('skeleton-loading');
          slot.style.aspectRatio = 'auto';
          slot.innerHTML = `<div class="py-8 px-4 text-xs font-mono text-red-400/80 border border-red-500/20 rounded my-2">图片读取跳过: ${escapeHtml(filename)}</div>`;
        }
      }));

      // Final exact scroll positioning check if user entered from a middle image
      if (targetIndex > 0 && slotElements[targetIndex]) {
        viewport.scrollTop = slotElements[targetIndex].offsetTop;
      }

      // 3. PC Pointer Events Hand-Grab Drag + Physics Inertia (FRICTION = 0.96)
      // Mobile uses native -webkit-overflow-scrolling: touch (touch-action: pan-y)
      let isPointerDown = false;
      let lastPointerY = 0;
      let velocityY = 0;
      let lastMoveTime = 0;
      const FRICTION = 0.96;

      const startInertiaLoop = () => {
        if (Math.abs(velocityY) < 0.4) {
          velocityY = 0;
          inertiaRaf = null;
          return;
        }
        viewport.scrollTop -= velocityY;
        velocityY *= FRICTION;
        inertiaRaf = requestAnimationFrame(startInertiaLoop);
      };

      viewport.addEventListener('pointerdown', (e) => {
        // Let mobile touch use native 120fps compositor scrolling!
        if (e.pointerType === 'touch') return;
        if (e.button !== 0) return;
        if (inertiaRaf) {
          cancelAnimationFrame(inertiaRaf);
          inertiaRaf = null;
        }
        isPointerDown = true;
        lastPointerY = e.clientY;
        velocityY = 0;
        lastMoveTime = performance.now();
        try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
      });

      viewport.addEventListener('pointermove', (e) => {
        if (!isPointerDown || e.pointerType === 'touch') return;
        const now = performance.now();
        const dy = e.clientY - lastPointerY;
        const dt = Math.max(1, now - lastMoveTime);
        viewport.scrollTop -= dy;
        velocityY = (dy / dt) * 16;
        lastPointerY = e.clientY;
        lastMoveTime = now;
      });

      const endPointerDrag = (e) => {
        if (!isPointerDown || e.pointerType === 'touch') return;
        isPointerDown = false;
        try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
        if (Math.abs(velocityY) > 0.6) {
          if (inertiaRaf) cancelAnimationFrame(inertiaRaf);
          inertiaRaf = requestAnimationFrame(startInertiaLoop);
        }
      };

      viewport.addEventListener('pointerup', endPointerDrag);
      viewport.addEventListener('pointercancel', endPointerDrag);

      // Update current page indicator on scroll
      viewport.addEventListener('scroll', () => {
        const centerLine = viewport.scrollTop + viewport.clientHeight * 0.35;
        let currentIdx = 0;
        for (let i = 0; i < slotElements.length; i++) {
          if (slotElements[i].offsetTop <= centerLine) currentIdx = i;
          else break;
        }
        pageIndicator.textContent = `页码: ${currentIdx + 1} / ${imageFiles.length}`;
        jumpSelect.value = String(currentIdx);
      }, { passive: true });

      jumpSelect.onchange = () => {
        const idx = parseInt(jumpSelect.value, 10);
        if (slotElements[idx]) {
          viewport.scrollTop = slotElements[idx].offsetTop;
        }
      };

      // Switch to Single Image Viewer
      b.querySelector('#mv-switch-img-viewer').onclick = () => {
        const curIdx = parseInt(jumpSelect.value, 10) || 0;
        const curFile = PathUtils.join(dirPath, imageFiles[curIdx]);
        Apps.openImageViewer(curFile);
      };

      // 4. Immersive Fullscreen Mode (Compatible with Native Fullscreen API + CSS Fullscreen)
      const enterImmersiveFullscreen = async () => {
        win.el.classList.add('manga-immersive-fullscreen');
        try {
          if (win.el.requestFullscreen) {
            await win.el.requestFullscreen();
          }
        } catch (e) {}
      };

      const exitImmersiveFullscreen = async () => {
        win.el.classList.remove('manga-immersive-fullscreen');
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          }
        } catch (e) {}
      };

      const onFsChange = () => {
        if (!document.fullscreenElement && win.el.classList.contains('manga-immersive-fullscreen')) {
          win.el.classList.remove('manga-immersive-fullscreen');
        }
      };
      document.addEventListener('fullscreenchange', onFsChange);

      b.querySelector('#mv-fullscreen-btn').onclick = enterImmersiveFullscreen;
      b.querySelector('#mv-fs-exit').onclick = exitImmersiveFullscreen;
    };

    // ----------------------------------------------------------------------------
    // Built-in Single Image Viewer (图片查看器 - 支持缩放、旋转、平移、前后切换)
    // ----------------------------------------------------------------------------
    Apps.openImageViewer = async function (imagePath = '/Desktop/星渊画集_封面.png') {
      let currentFile = PathUtils.normalize(imagePath);
      let dirPath = PathUtils.dirname(currentFile);
      let siblingImages = [];
      let currentIdx = 0;
      let scale = 1;
      let rotation = 0;
      let panX = 0, panY = 0;
      let activeBlobUrl = null;

      try {
        const all = await fs.readdir(dirPath);
        siblingImages = all.filter(n => isImageExt(n)).sort(naturalCompare);
        currentIdx = Math.max(0, siblingImages.indexOf(PathUtils.basename(currentFile)));
      } catch (e) {
        siblingImages = [PathUtils.basename(currentFile)];
      }

      const win = WindowManager.createWindow({
        appId: 'image-viewer',
        title: `图片查看器 — ${PathUtils.basename(currentFile)}`,
        icon: Icons.fileImage,
        width: 820,
        height: 580,
        onCleanup: () => {
          if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
        }
      });

      win.bodyEl.innerHTML = `
        <div class="px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-1.5">
            <button id="iv-prev" class="k-btn">${Icons.arrowLeft}<span>上一张</span></button>
            <button id="iv-next" class="k-btn"><span>下一张</span>${Icons.arrowRight}</button>
            <span class="mx-1 text-[var(--border-subtle)]">|</span>
            <button id="iv-zoom-out" class="k-btn"><span>缩小 -</span></button>
            <span id="iv-zoom-label" class="font-mono w-12 text-center">100%</span>
            <button id="iv-zoom-in" class="k-btn"><span>放大 +</span></button>
            <button id="iv-reset" class="k-btn"><span>1:1 复位</span></button>
            <button id="iv-rotate" class="k-btn">${Icons.refresh}<span>旋转 90°</span></button>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="iv-open-manga" class="k-btn primary">${Icons.fileManga}<span>切换条漫模式</span></button>
          </div>
        </div>
        <div id="iv-stage" class="flex-1 bg-[#07080b] overflow-hidden relative flex items-center justify-center cursor-grab active:cursor-grabbing">
          <img id="iv-img" class="max-w-full max-h-full object-contain transition-transform duration-75 select-none" draggable="false" />
        </div>
      `;

      const b = win.bodyEl;
      const imgEl = b.querySelector('#iv-img');
      const stage = b.querySelector('#iv-stage');

      const applyTransform = () => {
        imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale}) rotate(${rotation}deg)`;
        b.querySelector('#iv-zoom-label').textContent = `${Math.round(scale * 100)}%`;
      };

      const loadImageAt = async (idx) => {
        if (siblingImages.length === 0) return;
        currentIdx = (idx + siblingImages.length) % siblingImages.length;
        currentFile = PathUtils.join(dirPath, siblingImages[currentIdx]);
        WindowManager.setTitle(win.id, `图片查看器 — ${siblingImages[currentIdx]} (${currentIdx + 1}/${siblingImages.length})`);
        scale = 1; rotation = 0; panX = 0; panY = 0;
        applyTransform();
        try {
          const bytes = await fs.readFile(currentFile);
          const info = getFileCategoryAndMime(currentFile, false);
          if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
          activeBlobUrl = URL.createObjectURL(new Blob([bytes], { type: info.mime }));
          imgEl.src = activeBlobUrl;
        } catch (err) {
          notify('加载图片失败: ' + err.message, 'error');
        }
      };

      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.87;
        scale = Math.max(0.15, Math.min(12, scale * factor));
        applyTransform();
      }, { passive: false });

      let panning = false, startX = 0, startY = 0;
      stage.addEventListener('pointerdown', (e) => {
        panning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', (e) => {
        if (!panning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
      });
      stage.addEventListener('pointerup', () => { panning = false; });

      b.querySelector('#iv-prev').onclick = () => loadImageAt(currentIdx - 1);
      b.querySelector('#iv-next').onclick = () => loadImageAt(currentIdx + 1);
      b.querySelector('#iv-zoom-in').onclick = () => { scale = Math.min(12, scale * 1.25); applyTransform(); };
      b.querySelector('#iv-zoom-out').onclick = () => { scale = Math.max(0.15, scale * 0.8); applyTransform(); };
      b.querySelector('#iv-reset').onclick = () => { scale = 1; rotation = 0; panX = 0; panY = 0; applyTransform(); };
      b.querySelector('#iv-rotate').onclick = () => { rotation = (rotation + 90) % 360; applyTransform(); };
      b.querySelector('#iv-open-manga').onclick = () => {
        WindowManager.closeWindow(win.id);
        Apps.openMangaViewer(currentFile);
      };

      await loadImageAt(currentIdx);
    };

    // ============================================================================
    // SECTION 18: WEB BROWSER, CALCULATOR, PAINT, MEDIA, PDF & V86 EMULATOR
    // ============================================================================
    Apps.openBrowser = async function (initialTarget = '/Desktop/交互流体艺术.html') {
      let currentTarget = initialTarget || '/Desktop/交互流体艺术.html';
      let historyList = [currentTarget];
      let hIdx = 0;
      let activeBlobUrl = null;

      const win = WindowManager.createWindow({
        appId: 'browser',
        title: `系统网页浏览器 — ${currentTarget}`,
        icon: Icons.browser,
        width: 920,
        height: 600,
        onCleanup: () => {
          if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
        }
      });

      win.bodyEl.innerHTML = `
        <div class="px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex items-center gap-2 text-xs">
          <button id="br-back" class="k-btn px-2">${Icons.arrowLeft}</button>
          <button id="br-fwd" class="k-btn px-2">${Icons.arrowRight}</button>
          <button id="br-reload" class="k-btn px-2">${Icons.refresh}</button>
          <input type="text" id="br-url-input" class="k-input flex-1 font-mono text-xs" value="${escapeHtml(currentTarget)}" placeholder="输入虚拟文件路径 (如 /Desktop/交互流体艺术.html) 或 https:// 网址" />
          <button id="br-go" class="k-btn primary"><span>前往</span></button>
          <button id="br-edit-source" class="k-btn" title="在 HTML 编辑器中编辑此网页源码">${Icons.fileCode}<span>编辑源代码</span></button>
        </div>
        <div class="flex-1 relative bg-[#090a0d] overflow-hidden">
          <!-- System Dark Mask to prevent iframe white flash! -->
          <div id="br-loading-mask" class="absolute inset-0 z-10 bg-[#090a0d] flex flex-col items-center justify-center gap-3 transition-opacity duration-200">
            <div class="w-10 h-10 animate-spin text-[var(--accent)]">${Icons.logo}</div>
            <div class="text-xs font-mono text-[var(--text-secondary)]">正在载入网页视窗...</div>
          </div>
          <iframe id="br-iframe" class="w-full h-full border-0 bg-[#090a0d]" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        </div>
      `;

      const b = win.bodyEl;
      const iframe = b.querySelector('#br-iframe');
      const mask = b.querySelector('#br-loading-mask');
      const urlInput = b.querySelector('#br-url-input');

      const loadTarget = async (target, push = true) => {
        currentTarget = target.trim();
        urlInput.value = currentTarget;
        WindowManager.setTitle(win.id, `系统网页浏览器 — ${currentTarget}`);
        if (push) {
          historyList = historyList.slice(0, hIdx + 1);
          historyList.push(currentTarget);
          hIdx = historyList.length - 1;
        }

        mask.style.opacity = '1';
        mask.style.pointerEvents = 'auto';

        iframe.onload = () => {
          mask.style.opacity = '0';
          mask.style.pointerEvents = 'none';
        };

        if (currentTarget.startsWith('/')) {
          try {
            const html = await fs.readFile(currentTarget, 'utf8');
            if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
            activeBlobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
            iframe.src = activeBlobUrl;
          } catch (err) {
            mask.style.opacity = '0';
            mask.style.pointerEvents = 'none';
            notify('读取本地 HTML 文件失败: ' + err.message, 'error');
          }
        } else {
          let url = currentTarget;
          if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
          iframe.src = url;
          setTimeout(() => {
            mask.style.opacity = '0';
            mask.style.pointerEvents = 'none';
          }, 1200);
        }
      };

      b.querySelector('#br-go').onclick = () => loadTarget(urlInput.value);
      urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadTarget(urlInput.value); });
      b.querySelector('#br-reload').onclick = () => loadTarget(currentTarget, false);
      b.querySelector('#br-back').onclick = () => { if (hIdx > 0) { hIdx--; loadTarget(historyList[hIdx], false); } };
      b.querySelector('#br-fwd').onclick = () => { if (hIdx < historyList.length - 1) { hIdx++; loadTarget(historyList[hIdx], false); } };
      b.querySelector('#br-edit-source').onclick = () => {

        width: 340,
        height: 460
      });

      let expr = '';
      win.bodyEl.innerHTML = `
        <div class="p-4 flex-1 flex flex-col gap-3 bg-[var(--bg-abyss)]">
          <div class="p-3 rounded-[var(--btn-radius)] bg-[var(--bg-surface-solid)] border border-[var(--border-hairline)] flex flex-col items-end justify-end h-24">
            <div id="calc-history" class="text-xs font-mono text-[var(--text-muted)] truncate w-full text-right h-5"></div>
            <div id="calc-display" class="text-2xl font-mono font-bold text-[var(--accent-bright)] truncate w-full text-right">0</div>
          </div>
          <div class="grid grid-cols-4 gap-2 flex-1" id="calc-grid"></div>
        </div>
      `;

      const keys = [
        'C', '(', ')', '/',
        '7', '8', '9', '*',
        '4', '5', '6', '-',
        '1', '2', '3', '+',
        '0', '.', 'DEL', '='
      ];
      const disp = win.bodyEl.querySelector('#calc-display');
      const hist = win.bodyEl.querySelector('#calc-history');
      const grid = win.bodyEl.querySelector('#calc-grid');

      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = `k-btn text-sm font-mono font-semibold justify-center ${k === '=' ? 'primary' : ''}`;
        btn.textContent = k;
        btn.onclick = () => {
          if (k === 'C') {
            expr = '';
            hist.textContent = '';
            disp.textContent = '0';
          } else if (k === 'DEL') {
            expr = expr.slice(0, -1);
            disp.textContent = expr || '0';
          } else if (k === '=') {
            if (!expr) return;
            try {
              const sanitized = expr.replace(/[^0-9+\-*/().]/g, '');
              const res = Function(`"use strict"; return (${sanitized})`)();
              hist.textContent = `${expr} =`;
              expr = String(Number(res.toFixed(8)));
              disp.textContent = expr;
            } catch (e) {
              disp.textContent = 'Error';
              expr = '';
            }
          } else {
            expr += k;
            disp.textContent = expr;
          }
        };
        grid.appendChild(btn);
      });
    };

    Apps.openPaintApp = async function (imagePath = null) {
      const win = WindowManager.createWindow({
        appId: 'paint',
        title: `曜金画板 — ${imagePath ? PathUtils.basename(imagePath) : '新画布.png'}`,
        icon: Icons.paint,
        width: 820,
        height: 560
      });

      win.bodyEl.innerHTML = `
        <div class="px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex flex-wrap items-center gap-1.5">
            <button data-tool="brush" class="paint-tool k-btn primary"><span>画笔</span></button>
            <button data-tool="line" class="paint-tool k-btn"><span>直线</span></button>
            <button data-tool="rect" class="paint-tool k-btn"><span>矩形</span></button>
            <button data-tool="circle" class="paint-tool k-btn"><span>圆形</span></button>
            <button data-tool="eraser" class="paint-tool k-btn"><span>橡皮擦</span></button>
            <input type="color" id="pt-color" value="#d4a853" class="w-7 h-7 rounded cursor-pointer bg-transparent border-0" />
            <input type="range" id="pt-size" min="1" max="36" value="4" class="w-24 accent-[var(--accent)]" />
          </div>
          <div class="flex items-center gap-1.5">
            <button id="pt-undo" class="k-btn">${Icons.undo}<span>撤销</span></button>
            <button id="pt-clear" class="k-btn danger">${Icons.trash}<span>清空</span></button>
            <button id="pt-save" class="k-btn primary">${Icons.save}<span>保存至 OPFS</span></button>
          </div>
        </div>
        <div class="flex-1 bg-[#090a0d] overflow-auto flex items-center justify-center p-3">
          <canvas id="pt-canvas" width="740" height="440" class="bg-[#12141c] border border-[var(--border-hairline)] shadow-xl cursor-crosshair touch-none"></canvas>
        </div>
      `;

      const b = win.bodyEl;
      const canvas = b.querySelector('#pt-canvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#12141c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let tool = 'brush';
      let drawing = false;
      let startX = 0, startY = 0;
      let snapshot = null;
      const history = [ctx.getImageData(0, 0, canvas.width, canvas.height)];

      if (imagePath) {
        try {
          const bytes = await fs.readFile(imagePath);
          const url = URL.createObjectURL(new Blob([bytes]));
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            URL.revokeObjectURL(url);
          };
          img.src = url;
        } catch (e) {}
      }

      b.querySelectorAll('.paint-tool').forEach(btn => {
        btn.onclick = () => {
          tool = btn.getAttribute('data-tool');
          b.querySelectorAll('.paint-tool').forEach(x => x.classList.toggle('primary', x === btn));
        };
      });

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };

      canvas.addEventListener('pointerdown', (e) => {
        drawing = true;
        const pos = getPos(e);
        startX = pos.x;
        startY = pos.y;
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const pos = getPos(e);
        ctx.lineWidth = parseInt(b.querySelector('#pt-size').value, 10);
        ctx.lineCap = 'round';
        ctx.strokeStyle = tool === 'eraser' ? '#12141c' : b.querySelector('#pt-color').value;

        if (tool === 'brush' || tool === 'eraser') {
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        } else {
          ctx.putImageData(snapshot, 0, 0);
          ctx.beginPath();
          if (tool === 'line') {
            ctx.moveTo(startX, startY);
            ctx.lineTo(pos.x, pos.y);
          } else if (tool === 'rect') {
            ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
          } else if (tool === 'circle') {
            const r = Math.hypot(pos.x - startX, pos.y - startY);
            ctx.arc(startX, startY, r, 0, Math.PI * 2);
          }
          ctx.stroke();
        }
      });

      canvas.addEventListener('pointerup', () => {
        if (!drawing) return;
        drawing = false;
        history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (history.length > 25) history.shift();
      });

      b.querySelector('#pt-undo').onclick = () => {
        if (history.length > 1) {
          history.pop();
          ctx.putImageData(history[history.length - 1], 0, 0);
        }
      };

      b.querySelector('#pt-clear').onclick = () => {
        ctx.fillStyle = '#12141c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      };

      b.querySelector('#pt-save').onclick = async () => {
        const defaultName = imagePath ? PathUtils.basename(imagePath) : '曜金画作.png';
        const name = await promptModal('保存画作至 OPFS', '请输入保存文件名 (.png):', defaultName);
        if (!name) return;
        const savePath = PathUtils.join('/Desktop', name.endsWith('.png') ? name : name + '.png');
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        const ab = await blob.arrayBuffer();
        await fs.writeFile(savePath, new Uint8Array(ab), { mtime: Date.now() });
        notify(`画作已保存至 ${savePath}`, 'success');
      };
    };

      });

      // 2. Immediately followed by a canvas in exact order!
      win.bodyEl.innerHTML = `
        <div class="px-3 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] flex flex-wrap items-center justify-between gap-2 text-xs">

      `;

      const b = win.bodyEl;
      const screenContainer = b.querySelector('#v86-screen-container');

      // Mouse Pointer Lock (必须给 V86 添加鼠标锁定功能!)
      const lockMouse = () => {
        if (emulator && typeof emulator.lock_mouse === 'function') {
          emulator.lock_mouse();
        }
        screenContainer.requestPointerLock?.();
      };
      b.querySelector('#v86-lock-mouse').onclick = lockMouse;
      screenContainer.addEventListener('click', lockMouse);

      const bootWithImagePath = async (vfsImgPath) => {
        if (!window.V86 && !window.V86Starter) {
          notify('libv86.js 尚未就绪，请检查网络连接', 'error');
          return;
        }
        if (emulator) {
          try { emulator.stop(); emulator.destroy?.(); } catch (e) {}
          emulator = null;
        }

        // Reset screen_container exact structure
        screenContainer.innerHTML = `<div style="white-space: pre; font: 14px monospace; line-height: 14px"></div><canvas style="display: none"></canvas>`;

        try {
          const bytes = await fs.readFile(vfsImgPath);
          const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const ext = PathUtils.extname(vfsImgPath).toLowerCase();

          // Strictlocked CDN config (0.5.319 + commit bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f)
          const v86Config = {
            wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
            memory_size: 64 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: screenContainer,
            bios: {
              url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'
            },
            vga_bios: {
              url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'
            },
            autostart: true
          };

          // Mount according to extension: iso -> cdrom, img/fda/bin -> fda, else -> hda
          let slotLabel = 'HDA';
          if (ext === '.iso') {
            v86Config.cdrom = { buffer: ab };
            slotLabel = 'CDROM (.iso)';
          } else if (ext === '.img' || ext === '.fda' || ext === '.bin') {
            v86Config.fda = { buffer: ab };
            slotLabel = `FDA (${ext})`;
          } else {
            v86Config.hda = { buffer: ab };
            slotLabel = `HDA (${ext || 'raw'})`;
          }

          b.querySelector('#v86-mount-badge').textContent = `挂载槽: ${slotLabel} — ${PathUtils.basename(vfsImgPath)}`;
          WindowManager.setTitle(win.id, `V86 x86 虚拟机 — ${PathUtils.basename(vfsImgPath)}`);

          const Ctor = window.V86Starter || window.V86;
          emulator = new Ctor(v86Config);
        } catch (err) {
          notify('引导镜像失败: ' + err.message, 'error');
        }
      };

      b.querySelector('#v86-reboot').onclick = () => bootWithImagePath(currentImagePath);
      b.querySelector('#v86-cad').onclick = () => {
        if (emulator) emulator.keyboard_send_scancodes([0x1d, 0x38, 0x53, 0xd3, 0xb8, 0x9d]);
      };

      b.querySelector('#v86-load-vfs').onclick = async () => {
        const p = await promptModal('挂载 VFS 镜像文件', '请输入虚拟文件系统中的镜像路径 (.iso / .img / .fda / .bin):', currentImagePath);
        if (p) {

      const fileInput = b.querySelector('#v86-file-input');
      b.querySelector('#v86-upload-local').onclick = () => fileInput.click();
      fileInput.onchange = async (e) => {

        showLoading(`正在将镜像 ${f.name} 写入 OPFS 并挂载至 V86...`);
        const ab = await f.arrayBuffer();
        const dest = PathUtils.join('/System', f.name);
        await fs.writeFile(dest, new Uint8Array(ab), { mtime: f.lastModified || Date.now() });
        hideLoading();
        currentImagePath = dest;
        await bootWithImagePath(currentImagePath);
      };

      await bootWithImagePath(currentImagePath);
    };

    // ============================================================================
    // SECTION 19: 4.6 SETTINGS & STORAGE VISUALIZATION (系统设置与双后端可视化)
    // ============================================================================
    Apps.openSettings = async function () {
      const win = WindowManager.createWindow({
        appId: 'settings',
        title: '系统设置与存储架构中心',
        icon: Icons.settings,
        width: 900,
        height: 620,
        singleInstanceKey: 'app:settings'
      });

      let activeTab = 'storage'; // 'storage' | 'appearance' | 'interaction' | 'reset'

      const analyzeBackendFiles = async (rootPrefix) => {
        const stats = {
          totalBytes: 0,
          fileCount: 0,
          dirCount: 0,
          categories: {
            image: { label: '图像与条漫', bytes: 0, color: '#d4a853' },
            code: { label: '代码与网页', bytes: 0, color: '#38bdf8' },
            doc: { label: '文档与表格', bytes: 0, color: '#34d399' },
            archive: { label: '压缩归档包', bytes: 0, color: '#f59e0b' },
            vm: { label: '系统与虚拟镜像', bytes: 0, color: '#a855f7' },
            other: { label: '音视频与其他', bytes: 0, color: '#f43f5e' }
          },
          files: []
        };

        const walk = async (dir, depth = 0) => {
          if (depth > 6) return;
          try {
            const names = await fs.readdir(dir);
            for (const name of names) {
              if (dir === '/' && (name === 'opfs' || name === 'idb' || name === 'mnt')) continue;
              const full = PathUtils.join(dir, name);
              try {
                const st = await fs.stat(full);
                if (st.isDirectory()) {
                  stats.dirCount++;
                  await walk(full, depth + 1);
                } else {
                  const sz = st.size || 0;
                  stats.fileCount++;
                  stats.totalBytes += sz;
                  const info = getFileCategoryAndMime(name, false);
                  if (info.category === 'image') stats.categories.image.bytes += sz;
                  else if (info.category === 'html' || info.category === 'code') stats.categories.code.bytes += sz;
                  else if (info.category === 'text' || info.category === 'table' || info.category === 'pdf') stats.categories.doc.bytes += sz;
                  else if (info.category === 'archive') stats.categories.archive.bytes += sz;
                  else if (info.category === 'vm') stats.categories.vm.bytes += sz;
                  else stats.categories.other.bytes += sz;

                  stats.files.push({ path: full, name, size: sz, mtime: st.mtime });
                }
              } catch (e) {}
            }
          } catch (e) {}
        };

        await walk(rootPrefix);
        stats.files.sort((a, b) => b.size - a.size);
        return stats;
      };

      const renderSettingsContent = async () => {
        const b = win.bodyEl;
        b.innerHTML = `
          <div class="flex-1 flex overflow-hidden">
            <!-- Left Settings Navigation -->
            <div class="w-48 sm:w-56 border-r border-[var(--border-subtle)] bg-[var(--bg-elevated)] p-3 flex flex-col gap-1.5 shrink-0">
              <div class="px-2 py-1 text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)]">控制面板模块</div>
              <button data-tab="storage" class="st-tab-btn k-btn justify-start py-2 ${activeTab === 'storage' ? 'primary' : ''}">${Icons.drive}<span>存储可视化与双后端</span></button>
              <button data-tab="appearance" class="st-tab-btn k-btn justify-start py-2 ${activeTab === 'appearance' ? 'primary' : ''}">${Icons.paint}<span>美学主题与窗口外观</span></button>
              <button data-tab="interaction" class="st-tab-btn k-btn justify-start py-2 ${activeTab === 'interaction' ? 'primary' : ''}">${Icons.settings}<span>桌面、任务栏与交互</span></button>
              <button data-tab="reset" class="st-tab-btn k-btn justify-start py-2 ${activeTab === 'reset' ? 'primary' : ''}">${Icons.trash}<span>系统维护与一键重置</span></button>
            </div>

            <!-- Right Settings Pane -->
            <div id="st-main-pane" class="flex-1 overflow-y-auto p-5 space-y-5 bg-[var(--bg-surface-solid)]"></div>
          </div>
        `;

        b.querySelectorAll('.st-tab-btn').forEach(btn => {
          btn.onclick = () => {
            activeTab = btn.getAttribute('data-tab');
            renderSettingsContent();
          };
        });

        const pane = b.querySelector('#st-main-pane');

        if (activeTab === 'storage') {
          pane.innerHTML = `<div class="text-xs font-mono text-[var(--text-secondary)]">正在扫描 OPFS 与 IndexedDB 存储扇区...</div>`;
          let quotaInfo = { usage: 0, quota: 1024 * 1024 * 1024 };
          try {
            if (navigator.storage && navigator.storage.estimate) {
              quotaInfo = await navigator.storage.estimate();
            }
          } catch (e) {}

          const opfsStats = await analyzeBackendFiles('/opfs');
          const idbStats = await analyzeBackendFiles('/idb');
          const activeStats = SysConfig.primaryBackend === 'opfs' ? opfsStats : idbStats;
          const totalVfsBytes = Math.max(1, activeStats.totalBytes);
          const browserUsed = quotaInfo.usage || activeStats.totalBytes;
          const browserQuota = quotaInfo.quota || (10 * 1024 * 1024 * 1024);
          const quotaPct = Math.min(100, (browserUsed / browserQuota) * 100).toFixed(2);

          const catList = Object.values(activeStats.categories);

          pane.innerHTML = `

              saveSysConfig();
              applySysConfigVisuals();
              await idbBackend.init();
              await ensureSeedFiles();
              await WallpaperSystem.apply();
              await DesktopManager.renderIcons(true);
              hideLoading();
              renderSettingsContent();
              notify('系统已成功重置为初始状态', 'success');
            } catch (err) {
              hideLoading();
              notify('重置出错: ' + err.message, 'error');
            }
          };
        }
      };

      await renderSettingsContent();
    };

    // ============================================================================
    // SECTION 20: SYSTEM BOOTSTRAP (Immediate Desktop Entry, Zero Fake Boot Screen!)
    // ============================================================================
    async function initOS() {
      loadSysConfig();
      initStartMenu();
      CalendarWidget.init();

      // Initialize VFS Backends & Metadata Registry
      await MetaRegistry.init();
      await opfsBackend.init();
      await idbBackend.init();

      // Seed default files on both OPFS and IDB so both are rich out-of-the-box
      await ensureSeedFiles();

      // Apply Wallpaper & Render Desktop Icons immediately
      await WallpaperSystem.apply();
      await DesktopManager.init();

      // Check if previously mounted local folders need permission re-granting after reload (8.3)
      const pendingMounts = await fs.checkPendingRemounts();
      if (pendingMounts.length > 0) {
        const banner = document.getElementById('remount-banner');
        const names = pendingMounts.map(p => p.name).join(', ');
        banner.innerHTML = `
          <span class="w-5 h-5 text-[var(--accent)] shrink-0">${Icons.folderMount}</span>
          <div class="text-xs flex-1">
            <div class="font-semibold">检测到上次挂载的本地文件夹 (${escapeHtml(names)})</div>
            <div class="text-[11px] text-[var(--text-secondary)]">浏览器刷新后需重新授权本地目录读写权限</div>
          </div>
          <button id="remount-restore-btn" class="k-btn primary text-xs">一键恢复挂载</button>
          <button id="remount-dismiss-btn" class="win-ctrl-btn close-btn">${Icons.close}</button>
        `;
        banner.classList.remove('hidden');
        banner.classList.add('flex');
        banner.querySelector('#remount-restore-btn').onclick = async () => {
          await fs.restorePendingMounts(pendingMounts);
          banner.classList.add('hidden');
        };
        banner.querySelector('#remount-dismiss-btn').onclick = () => {
          banner.classList.add('hidden');
        };
      }

      // Global Click to dismiss popovers
      document.addEventListener('click', (e) => {
        hideContextMenu();
        if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
          document.getElementById('start-menu').classList.add('hidden');
        }
        if (!e.target.closest('#calendar-flyout') && !e.target.closest('#clock-widget')) {
          document.getElementById('calendar-flyout').classList.add('hidden');
        }
      });

      // Taskbar Quick Buttons
      document.getElementById('global-search-btn').onclick = () => {
        Apps.openFileExplorer('/Desktop');
      };

      const mobBoxBtn = document.getElementById('mobile-box-select-btn');
      mobBoxBtn.onclick = () => {
        GlobalMobileBoxSelectMode = !GlobalMobileBoxSelectMode;
        document.getElementById('box-select-label').textContent = GlobalMobileBoxSelectMode ? '框选: 开' : '框选: 关';
        mobBoxBtn.classList.toggle('primary', GlobalMobileBoxSelectMode);
        notify(GlobalMobileBoxSelectMode ? '已开启触屏框选模式：在空白处滑动即可框选图标' : '已关闭触屏框选模式', 'info');
      };

      document.getElementById('mount-quick-btn').onclick = async () => {
        const mountedPath = await fs.mountLocalDirectory();
        if (mountedPath) Apps.openFileExplorer(mountedPath);
      };

      document.getElementById('theme-quick-btn').onclick = () => {
        SysConfig.theme = SysConfig.theme === 'dark' ? 'light' : 'dark';
        saveSysConfig();
        applySysConfigVisuals();
        WallpaperSystem.apply();
        notify(`已切换至${SysConfig.theme === 'dark' ? '深色 (玄曜金丝)' : '浅色 (白瓷墨金)'}主题`, 'info');
      };

      // Aero Peek Blade at Far Right of Taskbar (Hover to Peek Desktop, Click to Minimize/Restore All)
      const peekBlade = document.getElementById('aero-peek-blade');
      peekBlade.addEventListener('mouseenter', () => {
        document.body.classList.add('aero-peek-active');
      });
      peekBlade.addEventListener('mouseleave', () => {
        document.body.classList.remove('aero-peek-active');
      });
      peekBlade.addEventListener('click', () => {
        document.body.classList.remove('aero-peek-active');
        const anyVisible = Array.from(WindowManager.windows.values()).some(w => !w.minimized);
        for (const [id, w] of WindowManager.windows) {
          if (anyVisible) WindowManager.minimizeWindow(id);
          else WindowManager.restoreWindow(id);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initOS);
  </script>
</body>
</html>
