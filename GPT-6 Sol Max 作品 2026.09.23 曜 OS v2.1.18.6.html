<html lang="zh-CN">

  <style>
    :root {
      --ink: #16232a; --paper: #f3f1eb; --surface: #f7f7f3; --surface-2: #eaece8;

    body[data-theme="dark"] {

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .43; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }

    .glyph { display: inline-flex; width: 20px; height: 20px; flex: none; align-items: center; justify-content: center; vertical-align: middle; }
    .glyph svg { width: 100%; height: 100%; display: block; }
    .desktop { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }
    .wallpaper { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(140deg,#122833,#324348 58%,#9e7565); }
    .wallpaper svg, .wallpaper img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .wallpaper:after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg,rgba(8,19,26,.26),transparent 42%), linear-gradient(0deg,rgba(8,19,26,.19),transparent 27%); }
    .wallpaper-signature { position: absolute; right: 5.2vw; top: 13vh; color: rgba(255,255,255,.64); z-index: 1; text-align: right; pointer-events: none; text-shadow: 0 2px 15px rgba(0,0,0,.15); animation: signatureIn 900ms 120ms both; }
    .wallpaper-signature strong { display: block; font-family: var(--display); font-weight: 500; font-size: clamp(48px,8vw,132px); line-height: .98; letter-spacing: -.09em; }

    @keyframes signatureIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .topbar { height: 47px; position: absolute; z-index: 5000; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 0 18px; gap: 18px; color: #f7f5ef; background: var(--top); border-bottom: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); }
    .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; border: 0; color: inherit; background: none; padding: 0; }

    .brand-name { font-family: var(--display); font-size: 19px; letter-spacing: -.055em; line-height: 1; }
    .brand-name small { margin-left: 6px; font: 500 9px var(--mono); letter-spacing: .11em; opacity: .59; }
    .top-nav { display: flex; gap: 3px; height: 100%; align-items: center; }

    .top-spacer { flex: 1; }

    .top-action { display: inline-flex; align-items: center; justify-content: center; padding: 5px; }
    .desktop-icons { position: absolute; inset: 47px 0 66px; z-index: 2; }
    .desktop-icon { position: absolute; width: 91px; min-height: 91px; padding: 9px 4px 5px; border: 1px solid transparent; border-radius: 9px; color: var(--desktop-label); text-align: center; cursor: default; user-select: none; -webkit-user-select: none; touch-action: none; transition: left .24s cubic-bezier(.2,.8,.2,1),top .24s cubic-bezier(.2,.8,.2,1), background .17s, border-color .17s, transform .17s; animation: iconIn .45s both; }
    .desktop-icon:hover { background: rgba(255,255,255,.11); }

    .desktop-icon .icon-visual .glyph { width: 100%; height: 100%; }
    .desktop-icon .icon-label { display: block; text-shadow: 0 1px 3px rgba(0,0,0,.95),0 2px 12px rgba(0,0,0,.6); font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; max-height: 3.9em; overflow: hidden; }
    @keyframes iconIn { from { opacity: 0; transform: translateY(11px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .selection-marquee { position: fixed; z-index: 4800; pointer-events: none; border: 1px solid rgba(255,255,255,.66); background: rgba(166,204,212,.19); box-shadow: inset 0 0 18px rgba(255,255,255,.07); }
    .taskbar { position: absolute; z-index: 6000; bottom: 0; left: 0; right: 0; height: 66px; display: flex; align-items: center; gap: 5px; padding: 0 16px; color: #f4f4ee; background: var(--dock); border-top: 1px solid rgba(255,255,255,.17); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); box-shadow: 0 -6px 30px rgba(0,0,0,.07); }
    .taskbar .task-brand { font: 500 13px var(--display); letter-spacing: -.03em; margin: 0 16px 0 3px; color: rgba(255,255,255,.76); white-space: nowrap; }
    .dock-button { position: relative; height: 43px; min-width: 43px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 10px; border-radius: 8px; background: transparent; color: #eeeee9; transition: background .18s,transform .18s; white-space: nowrap; }
    .dock-button .glyph { width: 22px; height: 22px; }
    .dock-button:hover, .dock-button.active { background: rgba(255,255,255,.13); transform: translateY(-2px); }
    .dock-button.active:after, .task-button:after { content: ''; width: 15px; height: 2px; border-radius: 2px; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); background: var(--accent); }
    #mobile-select { display: none; }
    body[data-select-mode="true"] #mobile-select { color: var(--accent); background: rgba(255,255,255,.16); }
    .dock-divider { height: 25px; width: 1px; background: rgba(255,255,255,.19); margin: 0 8px; flex: none; }
    .task-list { display: flex; gap: 3px; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; height: 100%; align-items: center; }
    .task-list::-webkit-scrollbar { display: none; }
    .task-button { position: relative; height: 42px; max-width: 180px; min-width: 43px; padding: 0 13px; gap: 10px; overflow: hidden; justify-content: flex-start; background: rgba(255,255,255,.065); }
    .task-button span:last-child { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .task-button.minimized { opacity: .55; }
    .task-button:not(.active):after { background: rgba(255,255,255,.48); width: 8px; }
    .tray { display: flex; align-items: center; gap: 12px; flex: none; padding-left: 8px; font: 11px var(--mono); }
    .tray-clock { text-align: right; line-height: 1.5; min-width: 88px; }
    .tray-clock small { display: block; color: rgba(255,255,255,.65); font-size: 10px; }
    .peek-strip { height: 40px; width: 8px; margin-left: 7px; border-left: 1px solid rgba(255,255,255,.32); cursor: pointer; }
    .peek-strip:hover { background: rgba(255,255,255,.25); }
    body.peek-desktop .os-window { opacity: .08 !important; pointer-events: none !important; }
    body.peek-app .os-window:not(.peek-focus) { opacity: .16 !important; }
    body.peek-app .os-window.peek-focus { z-index: 4900 !important; }
    .peek-preview { position: fixed; z-index: 7000; bottom: 73px; width: 194px; height: 114px; padding: 13px; color: #f5f4ef; background: #17262d; border: 1px solid rgba(255,255,255,.24); border-radius: 9px; box-shadow: 0 14px 45px rgba(0,0,0,.36); pointer-events: none; animation: floatIn .18s both; }
    .peek-preview .peek-top { display: flex; align-items: center; gap: 8px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 10px; }
    .peek-preview .peek-art { opacity: .3; text-align: center; padding: 9px; }
    .peek-preview .peek-art .glyph { width: 37px; height: 37px; }
    .start-menu { position: absolute; z-index: 6500; left: 17px; bottom: 75px; width: min(430px,calc(100vw - 30px)); max-height: min(650px,calc(100dvh - 132px)); display: flex; flex-direction: column; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--window-shadow); overflow: hidden; animation: menuIn .23s cubic-bezier(.18,.85,.26,1) both; }
    @keyframes menuIn { from { opacity: 0; transform: translateY(11px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .launcher-head { padding: 24px 24px 15px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .launcher-head .overline { font: 10px var(--mono); letter-spacing: .18em; color: var(--accent); }
    .launcher-head h2 { font: 500 31px var(--display); letter-spacing: -.065em; margin: 2px 0 15px; }
    .launcher-search, .field { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 0 11px; color: var(--text); background: var(--surface-2); outline: none; }
    .launcher-search:focus, .field:focus { border-color: var(--accent); }
    .launcher-body { padding: 16px 18px 18px; overflow: auto; }
    .section-kicker { color: var(--muted); font: 10px var(--mono); letter-spacing: .12em; margin: 3px 7px 12px; text-transform: uppercase; }
    .launcher-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
    .launcher-app { display: flex; align-items: center; gap: 11px; min-height: 57px; border: 0; background: transparent; color: var(--text); text-align: left; padding: 7px 9px; border-radius: 7px; }
    .launcher-app:hover { background: var(--surface-2); }
    .launcher-app .glyph { width: 31px; height: 31px; }
    .launcher-app b { display: block; font-weight: 600; font-size: 12px; }
    .launcher-app small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .launcher-foot { display: flex; gap: 9px; border-top: 1px solid var(--line); padding: 11px 18px; }
    .launcher-foot button { flex: 1; border: 0; color: var(--muted); background: transparent; font-size: 11px; text-align: left; padding: 6px; }
    .launcher-foot button:hover { color: var(--accent); }
    .context-menu { position: fixed; z-index: 9000; min-width: 206px; max-height: 75vh; overflow: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--window-shadow); padding: 5px; animation: floatIn .13s both; }
    @keyframes floatIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; color: var(--text); background: none; border: 0; border-radius: 5px; text-align: left; padding: 6px 10px; font-size: 12px; }
    .menu-item:hover { background: var(--surface-2); color: var(--accent); }
    .menu-item .glyph { width: 16px; height: 16px; }
    .menu-item .hint { color: var(--muted); margin-left: auto; font: 10px var(--mono); }
    .menu-separator { height: 1px; background: var(--line); margin: 5px 8px; }
    .window-layer { position: absolute; inset: 47px 0 66px; z-index: 10; pointer-events: none; }
    .os-window { position: absolute; display: flex; flex-direction: column; pointer-events: auto; min-width: 300px; min-height: 190px; overflow: hidden; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--window-shadow); transition: opacity .2s,box-shadow .2s; animation: windowIn .26s cubic-bezier(.18,.85,.26,1) both; }
    body[data-glass="true"] .os-window, body[data-glass="true"] .start-menu { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); }
    .os-window.focused { box-shadow: var(--window-shadow),0 0 0 1px rgba(var(--accent-rgb),.31); }
    .os-window.maximized { border-radius: 0; }
    @keyframes windowIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .window-titlebar { height: 42px; min-height: 42px; display: flex; align-items: center; justify-content: space-between; padding-left: 14px; background: var(--surface); border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; }
    .window-titlebar:active { cursor: grabbing; }
    .window-name { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .window-name .glyph { width: 19px; height: 19px; color: var(--accent); }
    .window-controls { align-self: stretch; display: flex; flex: none; }
    .window-controls button { border: 0; background: transparent; color: var(--muted); width: 43px; display: grid; place-items: center; padding: 0; }
    .window-controls button:hover { background: var(--surface-2); color: var(--text); }
    .window-controls button.close:hover { background: #c45148; color: white; }
    .window-controls svg { width: 14px; height: 14px; }
    .window-content { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .resize-handle { position: absolute; z-index: 10; }
    .resize-handle[data-dir="n"],.resize-handle[data-dir="s"] { left: 9px; right: 9px; height: 5px; cursor: ns-resize; }
    .resize-handle[data-dir="n"] { top: -2px; }.resize-handle[data-dir="s"] { bottom: -2px; }
    .resize-handle[data-dir="e"],.resize-handle[data-dir="w"] { top: 9px; bottom: 9px; width: 5px; cursor: ew-resize; }
    .resize-handle[data-dir="e"] { right: -2px; }.resize-handle[data-dir="w"] { left: -2px; }
    .resize-handle[data-dir="ne"],.resize-handle[data-dir="nw"],.resize-handle[data-dir="se"],.resize-handle[data-dir="sw"] { width: 12px; height: 12px; }
    .resize-handle[data-dir="ne"] { top: -2px; right: -2px; cursor: nesw-resize; }.resize-handle[data-dir="nw"] { top: -2px; left: -2px; cursor: nwse-resize; }
    .resize-handle[data-dir="se"] { bottom: -2px; right: -2px; cursor: nwse-resize; }.resize-handle[data-dir="sw"] { bottom: -2px; left: -2px; cursor: nesw-resize; }
    .snap-hint { position: fixed; z-index: 4900; pointer-events: none; border: 2px solid rgba(255,255,255,.68); background: rgba(188,215,221,.18); backdrop-filter: blur(3px); border-radius: 7px; transition: all .12s; }
    .toolbar { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar { display: none; }

    .tool:hover { background: var(--surface-2); }

    .tool .glyph { width: 16px; height: 16px; }

    .sidebar-label { font: 10px var(--mono); letter-spacing: .12em; color: var(--muted); padding: 0 10px; margin: 8px 0 10px; }
    .side-link { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--text); text-align: left; white-space: nowrap; font-size: 12px; }
    .side-link .glyph { width: 17px; height: 17px; color: var(--muted); }
    .side-link:hover, .side-link.active { background: var(--surface-2); }
    .side-link.active { color: var(--accent); }.side-link.active .glyph { color: var(--accent); }
    .explorer-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .explorer-pathbar { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
    .breadcrumbs { display: flex; align-items: center; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    .breadcrumbs button { flex: none; border: 0; background: transparent; color: var(--text); border-radius: 4px; padding: 4px 7px; font-size: 11px; }
    .breadcrumbs button:hover { color: var(--accent); background: var(--surface-2); }

    .explorer-search { width: min(190px,32%); flex: none; }
    .explorer-table-wrap { flex: 1; overflow: auto; position: relative; }
    .explorer-table { --col-name: 290px; --col-date: 170px; --col-type: 125px; --col-size: 100px; min-width: max(100%, 690px); }
    .file-header, .file-row { display: grid; grid-template-columns: minmax(170px,var(--col-name)) minmax(138px,var(--col-date)) minmax(90px,var(--col-type)) minmax(80px,var(--col-size)); align-items: center; }

    .file-head-cell.sorted { color: var(--accent); }

    .col-grip:hover:after { content: ''; position: absolute; right: 4px; top: 5px; bottom: 5px; width: 2px; background: var(--accent); }
    .file-row { min-height: 45px; border-bottom: 1px solid color-mix(in srgb,var(--line) 48%,transparent); cursor: default; transition: background .13s; user-select: none; }

    .file-row:hover { background: var(--surface-2); }.file-row.selected { background: rgba(var(--accent-rgb),.17); }

  function parseDelimited(text,delimiter=',') {
    const rows=[];let row=[],field='',quoted=false;
    for(let i=0;i<text.length;i++){
      const char=text[i];if(char==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}
      else if(char===delimiter&&!quoted){row.push(field);field='';}
      else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';}
      else field+=char;
    }
    if(field||row.length){row.push(field);rows.push(row);}return rows;
  }

  async function scanStorage() {
    const types={文稿:0,图片:0,音频视频:0,压缩包:0,其他:0};let files=0;
    const stack=['/'],visited=new Set();
    while(stack.length){const folder=stack.pop();if(visited.has(folder))continue;visited.add(folder);let entries=[];
      try{entries=await fs.readdir(folder);}catch{continue;}
      for(const entry of entries){if(entry.path==='/mnt')continue;
        if(entry.kind==='directory'){stack.push(entry.path);continue;}
        files++;const ext=extOf(entry.name),category=imageExt.has(ext)?'图片':audioExt.has(ext)||videoExt.has(ext)?'音频视频':archiveExt(entry.name)?'压缩包':textExt.has(ext)?'文稿':'其他';types[category]+=entry.size||0;
      }
    }
    const estimate=await navigator.storage?.estimate?.().catch(()=>null);
    return {types,files,used:estimate?.usage||Object.values(types).reduce((a,b)=>a+b,0),quota:estimate?.quota||0,persisted:await navigator.storage?.persisted?.().catch(()=>false)};

    });
    screen.addEventListener('click',()=>{if(emulator?.lock_mouse)emulator.lock_mouse();});
    win.onClose=()=>{stop();if(document.pointerLockElement)document.exitPointerLock?.();};
    if(imagePath)win.chooseImage(imagePath).catch(report);return win;
  }

  function selectedFilePaths() {
    if(selectionOwner.type==='desktop')return [...desktopSelection].filter(id=>!id.startsWith('app:'));
    if(selectionOwner.type==='explorer'&&selectionOwner.win&&windows.has(selectionOwner.win.id))return [...selectionOwner.win.selection];
    return [];
  }
  function boot() {
    $('#start-button').innerHTML=glyph('start');
    $('#mobile-select').innerHTML=glyph('check');
    $('#mobile-select').addEventListener('click',()=>{const mode=document.body.dataset.selectMode!=='true';document.body.dataset.selectMode=String(mode);selectionOwner={type:'desktop'};if(!mode){desktopSelection.clear();updateDesktopSelection();}toast(mode?'多选模式：点击桌面图标进行选择':'已退出多选模式');});
    $$('.pin-app').forEach(button=>{button.innerHTML=glyph(appById(button.dataset.app).icon);button.addEventListener('click',()=>launchApp(button.dataset.app));});
    $('#launcher-grid').innerHTML=appCatalog.map(app=>`<button class="launcher-app" data-app="${app.id}">${glyph(app.icon)}<span><b>${app.name}</b><small>${app.sub}</small></span></button>`).join('');
    $('#launcher-grid').addEventListener('click',event=>{const id=event.target.closest('[data-app]')?.dataset.app;if(id)launchApp(id);});
    $('#launcher-search').addEventListener('input',event=>filterLauncher(event.target.value));
    $('#launcher-search').addEventListener('keydown',event=>{if(event.key==='Enter'){const first=$('.launcher-app:not(.hidden)');if(first)launchApp(first.dataset.app);}});
    $('#start-button').addEventListener('click',()=>toggleLauncher());
    $('#brand-button').addEventListener('click',()=>toggleLauncher());
    $$('.launcher-foot [data-location]').forEach(button=>button.addEventListener('click',()=>launchApp('explorer',{path:button.dataset.location})));
    $$('.top-nav [data-top]').forEach(button=>button.addEventListener('click',()=>{
      if(button.dataset.top==='desktop'){for(const win of windows.values())minimizeWindow(win);closeMenus();}
      if(button.dataset.top==='files')launchApp('explorer');
      if(button.dataset.top==='apps')toggleLauncher();
    }));
    $('#quick-theme').addEventListener('click',()=>{settings.theme=settings.theme==='dark'?'light':'dark';applySettings();scheduleSettingsSave();toast(settings.theme==='dark'?'已切换为深色模式':'已切换为浅色模式');});
    document.body.dataset.compact=String(!!settings.compact);
    const peek=$('#peek-strip');
    peek.addEventListener('mouseenter',()=>{clearPeek();document.body.classList.add('peek-desktop');});
    peek.addEventListener('mouseleave',clearPeek);
    peek.addEventListener('click',()=>{
      clearPeek();
      if(peekRestore.length){for(const id of peekRestore){const win=windows.get(id);if(win)restoreWindow(win);}peekRestore=[];}
      else {peekRestore=[...windows.values()].filter(win=>!win.minimized).map(win=>win.id);for(const id of peekRestore)minimizeWindow(windows.get(id));}
    });
    document.addEventListener('pointerdown',event=>{
      if(!event.target.closest('#start-menu,#start-button,#brand-button')&&!$('#start-menu').classList.contains('hidden'))toggleLauncher(false);
      if(!event.target.closest('#context-menu'))$('#context-menu').classList.add('hidden');
    });
    $('#file-import').addEventListener('change',event=>{if(event.target.files?.length)importFileList(event.target.files,importTarget).catch(report);});
    $('#folder-import').addEventListener('change',event=>{if(event.target.files?.length)importFileList(event.target.files,importTarget,true).catch(report);});
    $('#wallpaper-input').addEventListener('change',event=>{
      const file=event.target.files?.[0];if(!file)return;
      Promise.resolve().then(async()=>{
        if(!file.type.startsWith('image/')&&!imageExt.has(extOf(file.name)))fail('请选择图片文件作为壁纸');
        const extension=extOf(file.name)||'png',path='/.system/wallpaper.'+extension;
        if(settings.customWallpaperFile&&settings.customWallpaperFile!==path&&await fs.exists(settings.customWallpaperFile))await fs.delete(settings.customWallpaperFile);
        await fs.writeFile(path,new Blob([await file.arrayBuffer()],{type:file.type||mimeOf(file.name)}));
        settings.customWallpaperFile=path;settings.wallpaper='custom';scheduleSettingsSave();await paintWallpaper();refreshSettingsWindows();toast('壁纸已保存在本地空间。');
      }).catch(report);event.target.value='';
    });
    $('#vm-import').addEventListener('change',event=>{
      const file=event.target.files?.[0];if(!file)return;
      Promise.resolve().then(async()=>{
        const path=await uniquePath('/Downloads',validName(file.name));await fs.writeFile(path,new Blob([await file.arrayBuffer()],{type:file.type||mimeOf(file.name)}));
        if(vmTargetWin&&windows.has(vmTargetWin.id))await vmTargetWin.chooseImage(path);
        toast('镜像已导入 '+path);
      }).catch(report);event.target.value='';
    });
    document.addEventListener('keydown',event=>{
      const typing=!!event.target.closest('input,textarea,select,[contenteditable],.CodeMirror');
      if(event.key==='Escape'){closeMenus();if(document.pointerLockElement)document.exitPointerLock?.();if(document.body.dataset.selectMode==='true')document.body.dataset.selectMode='false';return;}
      if((event.ctrlKey||event.metaKey)&&event.altKey&&['ArrowLeft','ArrowRight','ArrowUp'].includes(event.key)&&activeWindow){event.preventDefault();snapWindow(activeWindow,event.key==='ArrowLeft'?'left':event.key==='ArrowRight'?'right':'max');return;}
      if(typing||!(event.ctrlKey||event.metaKey)&&event.key!=='Delete')return;
      const paths=selectedFilePaths(),key=event.key.toLowerCase();
      if(key==='a'&&(selectionOwner.type==='desktop'||selectionOwner.type==='explorer')){
        event.preventDefault();
        if(selectionOwner.type==='desktop')$$('.desktop-icon').forEach(icon=>desktopSelection.add(icon.dataset.id)),updateDesktopSelection();
        else {$$('.file-row',selectionOwner.win.el).forEach(row=>selectionOwner.win.selection.add(row.dataset.path));updateExplorerSelection(selectionOwner.win);}
      }
      if(key==='c'&&paths.length){event.preventDefault();rememberClipboard(paths);}
      if(key==='x'&&paths.length){event.preventDefault();rememberClipboard(paths,true);}
      if(key==='v'&&clipboard){event.preventDefault();pasteInto(selectionOwner.type==='explorer'?selectionOwner.win.current:'/Desktop').catch(report);}
      if(event.key==='Delete'&&paths.length){event.preventDefault();deleteItems(paths).catch(report);}
    });
    window.addEventListener('resize',()=>{
      for(const win of windows.values()){
        if(win.maximized)setRect(win,snapRect('max'));
        else if(win.snapped)setRect(win,snapRect(win.snapped));
        else if(window.innerWidth>900){const rect=getRect(win);setRect(win,{...rect,x:Math.min(Math.max(rect.x,0),Math.max(0,areaSize().width-120)),y:Math.min(Math.max(rect.y,0),Math.max(0,areaSize().height-45))});}
        win.onResize?.();
      }
      renderDesktop().catch(report);
    });
    installDesktopInteractions();clockTick();setInterval(clockTick,15000);
    fs.ready.then(()=>{applySettings();document.body.dataset.compact=String(!!settings.compact);renderDesktop().catch(report);}).catch(error=>{report(error);$('#storage-indicator').textContent='存储不可用';});
  }
  boot();
  </script>
</body>
</html>
