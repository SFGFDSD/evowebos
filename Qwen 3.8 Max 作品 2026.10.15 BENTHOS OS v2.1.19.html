<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>渊图 BENTHOS OS · 深海测绘工作站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   渊图 BENTHOS OS — 深海测绘站美学
   深渊蓝黑 · 生物荧光青 #43e5c3 · 仪器琥珀 #f2a93b
   ============================================================ */
:root{
  --f-disp:'Chakra Petch','Noto Sans SC',sans-serif;
  --f-body:'Noto Sans SC','Chakra Petch',sans-serif;
  --f-mono:'IBM Plex Mono','Noto Sans SC',monospace;
}
html[data-theme="dark"]{
  --bg0:#030d15; --bg1:#061723; --panel:#0a1c2a; --panel2:#0d2334; --panel3:#123049;
  --line:rgba(110,224,201,.16); --line2:rgba(110,224,201,.30);
  --ink:#d9ece7; --ink2:#8fb3ab; --ink3:#5c7f7a;
  --acc:#43e5c3; --acc-ink:#04241c; --acc-dim:rgba(67,229,195,.14);
  --amb:#f2a93b; --amb-dim:rgba(242,169,59,.14);
  --danger:#ff6d6d; --danger-dim:rgba(255,109,109,.14);
  --sel:rgba(67,229,195,.20); --sel-line:rgba(67,229,195,.65);
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --taskbar:rgba(5,20,30,.82); --menu:rgba(9,26,38,.94);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg0:#dcebe8; --bg1:#cfe3e0; --panel:#f2f8f7; --panel2:#e6f1ef; --panel3:#d8e9e6;
  --line:rgba(10,80,70,.18); --line2:rgba(10,80,70,.34);
  --ink:#0e2b27; --ink2:#3f625c; --ink3:#7a968f;
  --acc:#0a8f76; --acc-ink:#eafffa; --acc-dim:rgba(10,143,118,.12);
  --amb:#b06e0a; --amb-dim:rgba(176,110,10,.12);
  --danger:#c23a3a; --danger-dim:rgba(194,58,58,.12);
  --sel:rgba(10,143,118,.16); --sel-line:rgba(10,143,118,.6);
  --shadow:0 14px 40px rgba(20,60,55,.25), 0 2px 8px rgba(20,60,55,.12);
  --taskbar:rgba(238,247,245,.86); --menu:rgba(246,251,250,.96);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f-body);font-size:13px;color:var(--ink);background:var(--bg0);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
input,textarea,[contenteditable="true"],. selectable{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid transparent;border-radius:6px;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--acc);border:3px solid transparent;background-clip:content-box}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg.ic{display:block;flex:none}

/* ---------- 桌面与壁纸 ---------- */
#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;transition:opacity .6s;background-size:cover;background-position:center}
.wp-abyss{background:
  radial-gradient(1100px 700px at 82% 112%, rgba(67,229,195,.14), transparent 60%),
  radial-gradient(900px 620px at 12% -8%, rgba(242,169,59,.08), transparent 55%),
  radial-gradient(2px 2px at 22% 34%, rgba(160,255,235,.5), transparent 60%),
  radial-gradient(1.5px 1.5px at 68% 22%, rgba(160,255,235,.4), transparent 60%),
  radial-gradient(2px 2px at 84% 58%, rgba(160,255,235,.35), transparent 60%),
  radial-gradient(1.5px 1.5px at 42% 74%, rgba(160,255,235,.3), transparent 60%),
  linear-gradient(178deg, #04121d 0%, #062033 46%, #041019 100%)}
.wp-abyss::after,.wp-vent::after,.wp-kelp::after,.wp-ice::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(120,230,205,.045) 0 1px, transparent 1px 64px),
             repeating-linear-gradient(90deg, rgba(120,230,205,.045) 0 1px, transparent 1px 64px);
  animation:sonar 9s ease-in-out infinite}
@keyframes sonar{0%,100%{opacity:.5}50%{opacity:1}}
.wp-vent{background:
  radial-gradient(1000px 700px at 75% 108%, rgba(255,120,60,.20), transparent 58%),
  radial-gradient(700px 500px at 20% 100%, rgba(255,190,90,.10), transparent 60%),
  linear-gradient(175deg, #0c0908 0%, #20100c 55%, #0a0605 100%)}
.wp-kelp{background:
  radial-gradient(900px 700px at 20% 108%, rgba(120,255,170,.16), transparent 60%),
  radial-gradient(800px 600px at 90% -6%, rgba(67,229,195,.10), transparent 55%),
  linear-gradient(170deg, #03130f 0%, #07301f 52%, #02100b 100%)}
.wp-ice{background:
  radial-gradient(1000px 640px at 80% -10%, rgba(150,220,255,.16), transparent 60%),
  radial-gradient(800px 600px at 10% 110%, rgba(67,190,229,.12), transparent 55%),
  linear-gradient(178deg, #0a1a26 0%, #14344a 55%, #08141d 100%)}
html[data-theme="light"] .wp-abyss{background:
  radial-gradient(1100px 700px at 82% 112%, rgba(10,143,118,.14), transparent 60%),
  radial-gradient(900px 620px at 12% -8%, rgba(176,110,10,.10), transparent 55%),
  linear-gradient(178deg, #d7eae6 0%, #c2ddd9 46%, #cfe4e0 100%)}
html[data-theme="light"] .wp-vent{background:linear-gradient(175deg,#efe4dc,#e4cfc2 55%,#eadfd6)}
html[data-theme="light"] .wp-kelp{background:linear-gradient(170deg,#ddeee4,#c2e0cf 52%,#d5e9dd)}
html[data-theme="light"] .wp-ice{background:linear-gradient(178deg,#ddeaf2,#c4dcea 55%,#d3e5ef)}

/* ---------- 桌面图标 ---------- */
#icons-layer{position:absolute;inset:0;bottom:var(--task-h,52px)}
.dicon{position:absolute;width:86px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  border:1px solid transparent;border-radius:8px;cursor:pointer;transition:transform .18s cubic-bezier(.2,.9,.3,1.2),background .15s,border-color .15s;touch-action:none}
.dicon:hover{background:var(--acc-dim)}
.dicon.sel{background:var(--sel);border-color:var(--sel-line)}
.dicon.dragging{opacity:.45;transform:scale(.94)}
.dicon .di-ic{width:44px;height:44px;display:grid;place-items:center;color:var(--acc);filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));transition:transform .18s}
.dicon:hover .di-ic{transform:translateY(-2px) scale(1.05)}
.dicon .di-ic svg{width:42px;height:42px}
.dicon .di-name{font-size:12px;line-height:1.25;text-align:center;color:#eef8f5;text-shadow:0 1px 3px rgba(0,0,0,.9);max-width:82px;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[data-theme="light"] .dicon .di-name{color:#0e2b27;text-shadow:0 1px 2px rgba(255,255,255,.8)}
.dicon input.di-rename{width:80px;font-size:12px;text-align:center;background:var(--panel);border:1px solid var(--acc);border-radius:4px;color:var(--ink);outline:none}
.drop-hint{outline:2px dashed var(--acc);outline-offset:-6px;border-radius:10px}

/* ---------- 框选矩形 ---------- */
.marquee{position:absolute;border:1px solid var(--sel-line);background:var(--sel);pointer-events:none;z-index:5;border-radius:2px}

/* ---------- 任务栏 ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:stretch;gap:4px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:var(--taskbar);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  border-top:1px solid var(--line);z-index:9000}
#start-btn{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:8px;color:var(--acc);font-family:var(--f-disp);font-weight:600;letter-spacing:.12em;font-size:12px;transition:.15s}
#start-btn:hover,#start-btn.on{background:var(--acc-dim);color:var(--acc)}
#start-btn svg{width:22px;height:22px}
#task-apps{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:stretch}
#task-apps::-webkit-scrollbar{display:none}
.tbtn{display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;min-width:44px;max-width:190px;border:1px solid transparent;position:relative;transition:.15s;color:var(--ink2)}
.tbtn svg{width:20px;height:20px;flex:none}
.tbtn .tbtn-t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn:hover{background:var(--acc-dim);color:var(--ink)}
.tbtn.on{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.tbtn.on::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.tbtn.min{opacity:.55}
#tray{display:flex;align-items:center;gap:2px}
.tray-btn{width:38px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--ink2);transition:.15s;position:relative}
.tray-btn:hover{background:var(--acc-dim);color:var(--acc)}
.tray-btn svg{width:19px;height:19px}
#tray-clock{text-align:right;padding:0 10px;border-radius:8px;cursor:pointer;line-height:1.25;transition:.15s}
#tray-clock:hover{background:var(--acc-dim)}
#tray-clock .tc-time{font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.04em}
#tray-clock .tc-date{font-size:10.5px;color:var(--ink2)}
#peek-slice{width:10px;margin-left:4px;border-left:1px solid var(--line2);border-radius:0 6px 6px 0;cursor:pointer}
#peek-slice:hover{background:var(--acc-dim)}
body.no-taskbar #taskbar{display:none}
body.no-taskbar #icons-layer{bottom:0}

/* ---------- 日历浮层 ---------- */
#calendar-pop{position:absolute;right:12px;bottom:62px;width:290px;background:var(--menu);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);
  z-index:9500;padding:12px;display:none;backdrop-filter:blur(16px)}
#calendar-pop.show{display:block;animation:pop-in .18s cubic-bezier(.2,.9,.3,1.3)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--f-disp);font-size:14px;letter-spacing:.05em}
.cal-nav{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.cal-nav:hover{background:var(--acc-dim);color:var(--acc)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .cw{font-size:10.5px;color:var(--ink3);padding:4px 0}
.cal-grid .cd{font-size:12px;padding:6px 0;border-radius:6px;cursor:pointer;font-family:var(--f-mono)}
.cal-grid .cd:hover{background:var(--acc-dim)}
.cal-grid .cd.other{color:var(--ink3);opacity:.5}
.cal-grid .cd.today{background:var(--acc);color:var(--acc-ink);font-weight:600}

/* ---------- 开始菜单 ---------- */
#start-menu{position:absolute;left:10px;bottom:62px;width:520px;max-width:calc(100vw - 20px);max-height:min(600px, calc(100vh - 90px));
  background:var(--menu);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:9600;
  display:none;flex-direction:column;overflow:hidden;backdrop-filter:blur(20px) saturate(1.3)}
#start-menu.show{display:flex;animation:pop-in .2s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.sm-head{padding:16px 18px 10px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.sm-avatar{width:44px;height:44px;border-radius:10px;background:linear-gradient(140deg,var(--acc),#0d5c4d);display:grid;place-items:center;color:var(--acc-ink)}
.sm-avatar svg{width:26px;height:26px}
.sm-head b{font-family:var(--f-disp);font-size:15px;letter-spacing:.06em;display:block}
.sm-head span{font-size:11px;color:var(--ink2)}
.sm-search{margin:12px 18px 4px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sm-search:focus-within{border-color:var(--acc)}
.sm-search svg{width:16px;height:16px;color:var(--ink3)}
.sm-search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13px;font-family:inherit}
#sm-apps{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;align-content:start}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.15s}
.sm-app:hover{background:var(--acc-dim);border-color:var(--line);transform:translateY(-2px)}
.sm-app svg{width:30px;height:30px;color:var(--acc)}
.sm-app span{font-size:12px;text-align:center}
.sm-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.sm-foot button{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:8px;font-size:12px;color:var(--ink2);transition:.15s}
.sm-foot button:hover{background:var(--acc-dim);color:var(--ink)}
.sm-foot button svg{width:17px;height:17px}

/* ---------- 窗口 ---------- */
#windows-layer{position:absolute;inset:0;bottom:var(--task-h,52px);pointer-events:none}
body.no-taskbar #windows-layer{bottom:0}
#windows-layer.peek .window{opacity:.07;transform:translateY(26px) scale(.985);filter:blur(2px)}
.window{position:absolute;min-width:320px;min-height:220px;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;pointer-events:auto;
  transition:opacity .22s,transform .22s;animation:win-in .22s cubic-bezier(.2,.9,.3,1.15)}
@keyframes win-in{from{opacity:0;transform:translateY(16px) scale(.965)}to{opacity:1;transform:none}}
.window.min-anim{opacity:0;transform:translateY(40%) scale(.8)}
.window.maxed{border-radius:0;border-color:transparent}
.window.focused{border-color:var(--line2);box-shadow:var(--shadow),0 0 0 1px var(--line),0 0 34px rgba(67,229,195,.07)}
.wt-bar{height:40px;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-bottom:1px solid var(--line);cursor:default;flex:none;touch-action:none}
.window.focused .wt-bar{background:linear-gradient(180deg,var(--panel3),var(--panel2))}
.wt-ic{width:20px;height:20px;color:var(--acc);display:grid;place-items:center}
.wt-ic svg{width:18px;height:18px}
.wt-title{flex:1;font-family:var(--f-disp);font-size:12.5px;font-weight:600;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.window.focused .wt-title{color:var(--ink)}
.wt-ctrl{display:flex;gap:4px}
.wc-btn{width:34px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--ink2);border:1px solid transparent;transition:.13s}
.wc-btn svg{width:14px;height:14px}
.wc-btn:hover{background:var(--acc-dim);color:var(--acc);border-color:var(--line)}
.wc-btn.close:hover{background:var(--danger-dim);color:var(--danger);border-color:rgba(255,109,109,.4)}
.wt-resize{position:absolute;z-index:5}
.rz-n{top:-3px;left:10px;right:10px;height:7px;cursor:n-resize}
.rz-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:s-resize}
.rz-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:e-resize}
.rz-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:w-resize}
.rz-ne{top:-3px;right:-3px;width:14px;height:14px;cursor:ne-resize}
.rz-nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nw-resize}
.rz-se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:se-resize}
.rz-sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:sw-resize}
.wt-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#snap-ghost{position:absolute;z-index:8900;border:1.5px solid var(--acc);background:var(--acc-dim);border-radius:10px;display:none;pointer-events:none;backdrop-filter:blur(2px);transition:all .12s ease-out;box-shadow:0 0 30px rgba(67,229,195,.15)}

/* ---------- 右键菜单 ---------- */
#ctx-menu{position:absolute;z-index:9800;min-width:196px;background:var(--menu);border:1px solid var(--line2);border-radius:10px;
  box-shadow:var(--shadow);padding:5px;display:none;backdrop-filter:blur(18px)}
#ctx-menu.show{display:block;animation:ctx-in .13s ease-out}
@keyframes ctx-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;position:relative;color:var(--ink)}
.ctx-item svg{width:16px;height:16px;color:var(--ink2);flex:none}
.ctx-item:hover{background:var(--acc-dim);color:var(--ink)}
.ctx-item:hover svg{color:var(--acc)}
.ctx-item.danger:hover{background:var(--danger-dim);color:var(--danger)}
.ctx-item.danger:hover svg{color:var(--danger)}
.ctx-item .ctx-arrow{margin-left:auto;width:12px;height:12px;color:var(--ink3)}
.ctx-item .ctx-key{margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:var(--f-mono)}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-sub{position:absolute;left:calc(100% - 4px);top:-5px;min-width:180px;background:var(--menu);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:none;z-index:2}
.ctx-item:hover>.ctx-sub{display:block}

/* ---------- 对话框 / 通知 ---------- */
#dlg-root{position:fixed;inset:0;z-index:9900;display:none;place-items:center;background:rgba(2,10,16,.55);backdrop-filter:blur(3px)}
#dlg-root.show{display:grid}
.dlg{width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 60px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);animation:pop-in .18s cubic-bezier(.2,.9,.3,1.2)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:15px 18px 11px;border-bottom:1px solid var(--line)}
.dlg-head svg{width:20px;height:20px;color:var(--acc)}
.dlg-head b{font-family:var(--f-disp);font-size:14px;letter-spacing:.06em;flex:1}
.dlg-body{padding:16px 18px;font-size:13px;line-height:1.7;color:var(--ink)}
.dlg-body .row{display:flex;align-items:center;gap:10px;margin:8px 0}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:12.5px;border:1px solid var(--line);color:var(--ink);background:var(--panel2);transition:.15s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.12);color:var(--acc-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:5px 10px;font-size:12px}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 11px;color:var(--ink);font-size:13px;outline:none;font-family:inherit;width:100%}
.inp:focus{border-color:var(--acc)}
#toasts{position:fixed;top:14px;right:14px;z-index:9990;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(340px,90vw)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--menu);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;
  padding:11px 14px;box-shadow:var(--shadow);animation:toast-in .25s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto;backdrop-filter:blur(14px)}
.toast.warn{border-left-color:var(--amb)} .toast.err{border-left-color:var(--danger)}
.toast svg{width:17px;height:17px;color:var(--acc);margin-top:1px}
.toast.warn svg{color:var(--amb)} .toast.err svg{color:var(--danger)}
.toast .t-t{font-size:12.5px;line-height:1.55}
.toast.out{animation:toast-out .3s forwards}
@keyframes toast-in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateX(40px)}}
#notify-card{position:absolute;right:12px;bottom:62px;width:330px;max-width:calc(100vw - 24px);background:var(--menu);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);z-index:9500;padding:14px;display:none;backdrop-filter:blur(16px)}
#notify-card.show{display:block;animation:pop-in .18s}
#notify-card .nc-title{display:flex;gap:9px;align-items:center;font-weight:600;font-size:13px;margin-bottom:6px}
#notify-card .nc-title svg{width:17px;height:17px;color:var(--amb)}
#notify-card .nc-body{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-bottom:10px}
#notify-card .nc-btns{display:flex;gap:8px;justify-content:flex-end}

/* ---------- 通用工具条/面板 ---------- */
.toolbar{display:flex;align-items:center;gap:5px;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--panel2);flex:none;flex-wrap:wrap}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:7px;font-size:12px;color:var(--ink2);border:1px solid transparent;transition:.13s;white-space:nowrap}
.tb-btn svg{width:16px;height:16px}
.tb-btn:hover{background:var(--acc-dim);color:var(--acc);border-color:var(--line)}
.tb-btn.on{background:var(--acc-dim);color:var(--acc);border-color:var(--line)}
.tb-btn.icon{padding:0 7px}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
.tb-sp{flex:1}
.statusbar{display:flex;align-items:center;gap:14px;padding:5px 12px;border-top:1px solid var(--line);background:var(--panel2);font-size:11px;color:var(--ink2);font-family:var(--f-mono);flex:none;overflow-x:auto;white-space:nowrap}
.statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* ---------- 文件资源管理器 ---------- */
.fe-wrap{display:flex;flex:1;min-height:0}
.fe-side{width:186px;flex:none;border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:8px 6px}
.fe-side h5{font-size:10px;letter-spacing:.18em;color:var(--ink3);padding:10px 10px 5px;font-family:var(--f-disp)}
.fe-nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--ink2);border:1px solid transparent}
.fe-nav svg{width:16px;height:16px}
.fe-nav:hover{background:var(--acc-dim);color:var(--ink)}
.fe-nav.on{background:var(--acc-dim);color:var(--acc);border-color:var(--line)}
.fe-nav .ej{margin-left:auto;width:22px;height:22px;display:none;place-items:center;border-radius:5px}
.fe-nav:hover .ej{display:grid}
.fe-nav .ej:hover{background:var(--danger-dim);color:var(--danger)}
.fe-main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.fe-crumb{display:flex;align-items:center;gap:2px;flex:1;min-width:80px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:0 6px;height:30px;overflow-x:auto;scrollbar-width:none}
.fe-crumb::-webkit-scrollbar{display:none}
.fe-crumb .cb{padding:3px 8px;border-radius:5px;font-size:12px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.fe-crumb .cb:hover{background:var(--acc-dim);color:var(--acc)}
.fe-crumb .cb-sep{color:var(--ink3)}
.fe-search{width:150px;transition:width .2s}
.fe-search:focus{width:220px}
.fe-listhead{display:flex;border-bottom:1px solid var(--line);background:var(--panel2);flex:none;padding-right:14px;position:relative}
.fe-col{position:relative;display:flex;align-items:center;gap:4px;padding:7px 10px;font-size:11px;letter-spacing:.08em;color:var(--ink2);cursor:pointer;flex:none;font-family:var(--f-disp)}
.fe-col:hover{color:var(--acc)}
.fe-col .arr{font-size:9px}
.fe-colrz{position:absolute;right:-2px;top:0;bottom:0;width:5px;cursor:col-resize}
.fe-colrz:hover{background:var(--acc)}
.fe-scroll{flex:1;overflow:auto;position:relative}
.fe-rows{position:relative;width:max-content;min-width:100%}
.fe-row{display:flex;width:max-content;min-width:0;border-bottom:1px solid rgba(120,200,190,.05);cursor:pointer}
.fe-row:hover{background:var(--acc-dim)}
.fe-row.sel{background:var(--sel)}
.fe-cell{padding:6px 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;display:flex;align-items:center;gap:8px}
.fe-cell svg{width:17px;height:17px}
.fe-cell .th{width:26px;height:26px;border-radius:4px;object-fit:cover;background:var(--panel3)}
.fe-cell.mut{color:var(--ink2);font-family:var(--f-mono);font-size:11.5px}
.fe-row .fname{word-break:break-all}
.fe-row input.fr-rename{background:var(--panel);border:1px solid var(--acc);border-radius:4px;color:var(--ink);font-size:12.5px;padding:2px 6px;outline:none;width:200px}
.fe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px;align-content:start;position:relative;width:100%}
.ed-pane .CodeMirror{height:100%;flex:1}
.fe-gitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.fe-gitem:hover{background:var(--acc-dim)}
.fe-gitem.sel{background:var(--sel);border-color:var(--sel-line)}
.fe-gitem .gi{width:52px;height:52px;display:grid;place-items:center;color:var(--acc)}
.fe-gitem .gi svg{width:44px;height:44px}
.fe-gitem .gi img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.fe-gitem span{font-size:11.5px;text-align:center;max-width:92px;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.fe-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:12.5px;pointer-events:none}
.fe-empty svg{width:40px;height:40px;margin:0 auto 10px;opacity:.5}

/* ---------- 记事本 / 编辑器 ---------- */
.np-area{flex:1;display:flex;min-height:0}
.np-area textarea{flex:1;background:var(--bg1);color:var(--ink);border:none;outline:none;resize:none;padding:14px 16px;
  font-family:var(--f-mono);font-size:13.5px;line-height:1.75;user-select:text;-webkit-user-select:text}
.np-table-wrap{flex:1;overflow:auto;background:var(--bg1)}
.np-table{border-collapse:collapse;font-size:12.5px;font-family:var(--f-mono)}
.np-table th{position:sticky;top:0;background:var(--panel3);color:var(--acc);font-weight:600;z-index:2}
.np-table th,.np-table td{border:1px solid var(--line);padding:5px 10px;white-space:nowrap}
.np-table td{min-width:60px}
.np-table td[contenteditable]:focus{outline:2px solid var(--acc);background:var(--acc-dim)}
.np-table tr:nth-child(even) td{background:rgba(120,220,200,.03)}
/* CodeMirror 覆盖 */
.ed-wrap{flex:1;display:flex;min-height:0}
.ed-pane{display:flex;flex-direction:column;min-width:200px;overflow:hidden}
.ed-pane .CodeMirror{flex:1;height:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6}
.ed-split{width:6px;cursor:col-resize;background:var(--panel2);border-left:1px solid var(--line);border-right:1px solid var(--line);flex:none;transition:.15s}
.ed-split:hover{background:var(--acc)}
.ed-preview{flex:1;min-width:120px;position:relative;background:#fff;display:flex;flex-direction:column}
.ed-preview iframe{flex:1;border:none;width:100%;background:#fff}
.ed-pv-head{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px;color:var(--ink2);flex:none}
.ed-pv-head .dotrow{display:flex;gap:4px}
.ed-pv-head .dotrow i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.ed-find{display:none;flex-direction:column;gap:7px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.ed-find.show{display:flex}
.ed-find .fr-row{display:flex;gap:6px;align-items:center}
.ed-find input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--ink);font-family:var(--f-mono);font-size:12px;outline:none}
.ed-find input:focus{border-color:var(--acc)}
.ed-find .fr-count{font-family:var(--f-mono);font-size:11px;color:var(--ink2);min-width:56px;text-align:right}
.fr-tog{min-width:30px;height:28px;padding:0 7px;border-radius:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);border:1px solid var(--line)}
.fr-tog.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.cm-mark{background:rgba(242,169,59,.35);border-radius:2px}
.cm-mark.cur{background:rgba(67,229,195,.5);outline:1px solid var(--acc)}
.CodeMirror .cm-trailing-space{background:rgba(255,109,109,.28)}

/* ---------- 图片/漫画阅读器 ---------- */
.mg-wrap{flex:1;background:#000;overflow-y:auto;overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;position:relative;cursor:grab}
.mg-wrap.grabbing{cursor:grabbing}
.mg-inner{display:flex;flex-direction:column;align-items:center;padding:10px 0 40vh}
.mg-item{width:100%;max-width:820px;position:relative}
.mg-item img{display:block;width:100%;height:auto}
.mg-ph{background:linear-gradient(110deg,#0c0c0c 30%,#161616 50%,#0c0c0c 70%);background-size:200% 100%;animation:shimmer 1.4s infinite;height:70vh;display:grid;place-items:center;color:#3a3a3a;font-family:var(--f-mono);font-size:11px}
@keyframes shimmer{to{background-position:-200% 0}}
.mg-item .mg-num{position:absolute;top:8px;left:10px;font-family:var(--f-mono);font-size:10.5px;color:#7dffd9;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px;opacity:0;transition:.2s}
.mg-item:hover .mg-num{opacity:1}
.mg-fail{height:80px;display:grid;place-items:center;color:#ff6d6d;font-size:12px;border:1px dashed #442222;margin:6px 0}
.window.mg-fs .wt-bar,.window.mg-fs .wt-resize,.window.mg-fs .mg-tools{display:none!important}
.window.mg-fs{border:none;border-radius:0}
.mg-x{position:fixed;top:12px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#9adfd0;display:none;place-items:center;z-index:99;border:1px solid rgba(120,230,205,.3);opacity:.25;transition:.2s}
.mg-x:hover{opacity:1;color:#fff}
.window.mg-fs .mg-x{display:grid}
.mg-loading{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid rgba(120,230,205,.3);color:#7dffd9;font-family:var(--f-mono);font-size:11px;padding:4px 14px;border-radius:20px;z-index:20;pointer-events:none}

/* ---------- 媒体播放器 ---------- */
.mp-wrap{flex:1;display:flex;flex-direction:column;background:var(--bg1);min-height:0}
.mp-stage{flex:1;display:grid;place-items:center;min-height:0;padding:14px;position:relative}
.mp-stage video{max-width:100%;max-height:100%;border-radius:8px;background:#000}
.mp-vis{width:min(420px,86%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--panel3),var(--bg1) 72%);border:1px solid var(--line2);display:grid;place-items:center;position:relative;overflow:hidden}
.mp-vis canvas{position:absolute;inset:0;width:100%;height:100%}
.mp-vis .mp-disc{width:44%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,#0f2a3a,#154059,#0f2a3a,#1a4a63,#0f2a3a);border:6px solid #08131c;display:grid;place-items:center;animation:spin 4s linear infinite;animation-play-state:paused;z-index:1}
.mp-vis .mp-disc.playing{animation-play-state:running}
.mp-vis .mp-disc::after{content:"";width:26%;aspect-ratio:1;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
.mp-ctrl{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.mp-seek{width:100%;appearance:none;-webkit-appearance:none;height:5px;border-radius:3px;background:var(--line2);outline:none;cursor:pointer}
.mp-seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);cursor:pointer}
.mp-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.mp-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);transition:.15s}
.mp-btn:hover{color:var(--acc);border-color:var(--acc)}
.mp-btn svg{width:18px;height:18px}
.mp-time{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2)}

/* ---------- 计算器 ---------- */
.calc{flex:1;display:flex;flex-direction:column;background:var(--bg1);padding:14px;gap:12px}
.calc-disp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.calc-expr{font-family:var(--f-mono);font-size:13px;color:var(--ink3);min-height:18px;word-break:break-all}
.calc-res{font-family:var(--f-disp);font-size:34px;font-weight:600;letter-spacing:.02em;color:var(--ink);word-break:break-all}
.calc-res.err{color:var(--danger);font-size:18px}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-disp);font-size:18px;font-weight:500;color:var(--ink);transition:.1s;display:grid;place-items:center;min-height:44px}
.ck:hover{border-color:var(--acc);color:var(--acc)}
.ck:active{transform:scale(.94)}
.ck.op{color:var(--amb)}
.ck.eq{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.ck.fn{color:var(--ink2);font-size:15px}

/* ---------- 画板 ---------- */
.paint-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.paint-stage{flex:1;overflow:auto;display:grid;place-items:center;background:repeating-conic-gradient(var(--panel2) 0 25%,var(--bg1) 0 50%) 0 0/24px 24px;padding:14px}
.paint-stage canvas{background:#fff;box-shadow:var(--shadow);touch-action:none;border-radius:4px;max-width:100%}
.paint-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
input[type=range].slim{width:90px;accent-color:var(--acc)}

/* ---------- 终端 ---------- */
.term{flex:1;background:#041014;font-family:var(--f-mono);font-size:12.5px;padding:12px 14px;overflow-y:auto;line-height:1.65;color:#9fe8d8}
.term .t-p{color:var(--amb)}
.term .t-err{color:var(--danger)}
.term .t-line{white-space:pre-wrap;word-break:break-all}
.term-inrow{display:flex;gap:0}
.term input{flex:1;background:none;border:none;outline:none;color:#d9f7ef;font-family:inherit;font-size:inherit}

/* ---------- 设置 ---------- */
.set-wrap{display:flex;flex:1;min-height:0}
.set-nav{width:168px;flex:none;border-right:1px solid var(--line);background:var(--panel2);padding:10px 8px;overflow-y:auto}
.set-body{flex:1;overflow-y:auto;padding:20px 24px}
.set-body h3{font-family:var(--f-disp);font-size:17px;letter-spacing:.08em;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.set-body h3 svg{width:19px;height:19px;color:var(--acc)}
.set-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.set-card h4{font-size:12px;letter-spacing:.1em;color:var(--acc);font-family:var(--f-disp);margin-bottom:10px}
.set-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13px}
.set-row .desc{font-size:11.5px;color:var(--ink3)}
.set-row .grow{flex:1}
.switch{width:42px;height:23px;border-radius:13px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink2);transition:.2s}
.switch.on{background:var(--acc)}
.switch.on::after{left:22px;background:var(--acc-ink)}
.usebar{height:14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;margin:8px 0}
.usebar i{height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- 浏览器 ---------- */
.br-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.br-bar{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.br-url{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.br-url:focus-within{border-color:var(--acc)}
.br-url svg{width:14px;height:14px;color:var(--ink3)}
.br-url input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:12.5px;font-family:var(--f-mono)}
.br-stage{flex:1;position:relative;background:#fff}
.br-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.br-veil{position:absolute;inset:0;background:var(--bg1);display:grid;place-items:center;z-index:3;transition:opacity .3s}
.br-veil.hide{opacity:0;pointer-events:none}
.loader-ring{width:42px;height:42px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc);animation:spin 0.9s linear infinite}
.loader-ring.small{width:20px;height:20px;border-width:2px}

/* ---------- 虚拟机 ---------- */
.vm-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:#000}
.vm-screen{flex:1;display:grid;place-items:center;min-height:0;position:relative;overflow:hidden}
.vm-screen div[style*="white-space"]{font-family:var(--f-mono)!important}
.vm-hint{color:#3f625c;font-size:12px;text-align:center;line-height:2;padding:20px}

/* ---------- 响应式 ---------- */
@media (max-width:820px){
  #taskbar{height:58px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  #start-btn span{display:none}
  #start-btn{padding:0 10px}
  .tbtn .tbtn-t{display:none}
  .tbtn{max-width:52px;justify-content:center;padding:0}
  #tray-clock .tc-date{display:none}
  #start-menu{left:8px;right:8px;bottom:66px;width:auto;max-height:calc(100vh - 90px)}
  .window{inset:0!important;width:100%!important;height:calc(100% )!important;border-radius:0;min-width:0}
  .wt-resize{display:none}
  .fe-side{position:absolute;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.22s;box-shadow:var(--shadow)}
  .fe-side.open{transform:none}
  .set-nav{width:120px}
  .ed-wrap{flex-direction:column}
  .ed-split{width:auto;height:6px;cursor:row-resize}
  .mg-item{max-width:100vw}
  .dicon{width:76px}
  .dicon .di-ic{width:38px;height:38px}
  .dicon .di-ic svg{width:36px;height:36px}
  .calc-res{font-size:28px}
  #peek-slice{display:none}
}
</style>
</head>
<body>
<div id="desktop">
  <div id="wallpaper" class="wp-abyss"></div>
  <div id="icons-layer"></div>
  <div id="windows-layer"></div>
  <div id="snap-ghost"></div>

  <div id="ctx-menu"></div>

  <div id="start-menu">
    <div class="sm-head">
      <div class="sm-avatar" id="sm-avatar"></div>
      <div><b>潜航员 · OPERATOR</b><span id="sm-sysinfo">BENTHOS OS 1.0 · 深海测绘工作站</span></div>
    </div>
    <div class="sm-search"><span id="sm-search-ic"></span><input id="sm-search" placeholder="检索应用…" autocomplete="off"></div>
    <div id="sm-apps"></div>
    <div class="sm-foot" id="sm-foot"></div>
  </div>

  <div id="calendar-pop"></div>
  <div id="notify-card"></div>

  <div id="taskbar">
    <button id="start-btn"></button>
    <div id="task-apps"></div>
    <div id="tray"></div>
    <div id="peek-slice" title="Aero Peek · 悬停透视桌面"></div>
  </div>

  <input type="file" id="import-input" multiple hidden>
  <input type="file" id="wallpaper-input" accept="image/*" hidden>
</div>
<div id="dlg-root"></div>
<div id="toasts"></div>

<script>
'use strict';
/* ================================================================
   渊图 BENTHOS OS · 内核脚本
   ================================================================ */

/* ---------------- 工具库 ---------------- */
const B = {
  $: (s, el=document) => el.querySelector(s),
  $$: (s, el=document) => [...el.querySelectorAll(s)],
  el(tag, cls, html){ const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; },
  esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  uid: () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; },
  natural(a, b){
    const ax=String(a), bx=String(b);
    const re=/(\d+|\D+)/g; const pa=ax.match(re)||[], pb=bx.match(re)||[];
    for(let i=0;i<Math.max(pa.length,pb.length);i++){
      const x=pa[i], y=pb[i];
      if(x===undefined) return -1; if(y===undefined) return 1;
      const nx=/^\d+$/.test(x), ny=/^\d+$/.test(y);
      if(nx&&ny){ const d=BigInt(x)-BigInt(y); if(d!==0n) return d>0n?1:-1; }
      else if(nx) return -1; else if(ny) return 1;
      else { const c=x.localeCompare(y,'zh'); if(c) return c; }
    }
    return 0;
  },
  ext(name){ const i=String(name).lastIndexOf('.'); return i>0?String(name).slice(i+1).toLowerCase():''; },
  base(p){ p=normPath(p); const i=p.lastIndexOf('/'); return i<=0?p.slice(1):p.slice(i+1); },
  dirOf(p){ p=normPath(p); const i=p.lastIndexOf('/'); return i<=0?'/':p.slice(0,i); },
  join(p, name){ return normPath(normPath(p)+'/'+name); },
  fmtBytes(n){
    if(n==null) return '—';
    if(n<1024) return n+' B';
    const u=['KB','MB','GB','TB']; let i=-1;
    do{ n/=1024; i++; }while(n>=1024 && i<u.length-1);
    return (n>=100?n.toFixed(0):n.toFixed(1))+' '+u[i];
  },
  fmtDate(t, withTime=true){
    if(!t) return '—';
    const d=new Date(t); const p=n=>String(n).padStart(2,'0');
    const s=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    return withTime?`${s} ${p(d.getHours())}:${p(d.getMinutes())}`:s;
  },
  getClientXY(e){
    if(e.touches && e.touches.length) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    if(e.changedTouches && e.changedTouches.length) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  },
  download(blob, name){
    const u=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 4000);
  },
  pathNorm: null
};
function normPath(p){
  if(!p) return '/';
  p=String(p).replace(/\\/g,'/');
  if(!p.startsWith('/')) p='/'+p;
  const parts=[]; for(const seg of p.split('/')){
    if(!seg || seg==='.') continue;
    if(seg==='..'){ parts.pop(); continue; }
    parts.push(seg);
  }
  return '/'+parts.join('/');
}
window.normPath = normPath;

function icon(name, size=18, cls=''){
  const p = ICONS[name] || ICONS.file;
  return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function iconForFile(name, isDir, size=42){
  if(isDir) return icon('folder', size);
  const e=B.ext(name);
  if(IMG_EXT.includes(e)) return icon('fileImg', size);
  if(AUD_EXT.includes(e)) return icon('fileAud', size);
  if(VID_EXT.includes(e)) return icon('fileVid', size);
  if(['zip','gz','tgz','tar','7z'].includes(e)) return icon('fileZip', size);
  if(e==='pdf') return icon('filePdf', size);
  if(e==='csv'||e==='tsv') return icon('fileCsv', size);
  if(CODE_EXT.includes(e)) return icon('fileCode', size);
  if(TXT_EXT.includes(e)||e==='') return icon('fileTxt', size);
  return icon('file', size);
}

/* ---------------- 通知 Toast ---------------- */
const Toast = {
  show(msg, type='ok', ms=3600){
    const t=B.el('div','toast '+type, icon(type==='err'?'warn':type==='warn'?'info':'check') + `<div class="t-t">${B.esc(msg)}</div>`);
    document.getElementById('toasts').appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 320); }, ms);
  }
};

/* ---------------- IndexedDB 底层 ---------------- */
function idbOpen(name, version, upgrade){
  return new Promise((res, rej)=>{
    if(!window.indexedDB) return rej(new Error('IndexedDB 不可用'));
    const rq=indexedDB.open(name, version);
    rq.onupgradeneeded = e => upgrade(rq.result, e);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}

  function db(){ if(!dbp) dbp = idbOpen('benthos-meta', 1, d=>{ d.createObjectStore('kv'); d.createObjectStore('handles'); }); return dbp; }
  async function tx(store, mode, fn){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); }
  return {
    get: async k => { try{ const d=await db(); return await new Promise((res,rej)=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } },
    set: async (k,v) => { try{ await tx('kv','readwrite', s=>s.put(v,k)); }catch(e){} },
    del: async k => { try{ await tx('kv','readwrite', s=>s.delete(k)); }catch(e){} },
    putHandle: async (id, rec) => { try{ await tx('handles','readwrite', s=>s.put(rec, id)); }catch(e){} },
    getHandles: async () => { try{ const d=await db(); return await new Promise((res,rej)=>{ const out=[]; const c=d.transaction('handles').objectStore('handles').openCursor(); c.onsuccess=e=>{ const cu=e.target.result; if(cu){ out.push({id:cu.key, ...cu.value}); cu.continue(); } else res(out); }; c.onerror=()=>rej(c.error); }); }catch(e){ return []; } },
    delHandle: async id => { try{ await tx('handles','readwrite', s=>s.delete(id)); }catch(e){} },
  };
})();

/* ---------------- 设置存储（localStorage，小数据） ---------------- */
const S = (() => {
  const KEY='benthos-settings';
  const DEF = { theme:'dark', clock24:false, showSeconds:false, wallpaper:'abyss', wallpaperFile:null,
    hiddenApps:[], hideTaskbar:false, taskbarLabels:true, peek:true, defaultBackend:'opfs',
    iconGridSnap:true, accentGlow:true, editorInput:'auto' };
  let data = {...DEF};
  try{ data = {...DEF, ...(JSON.parse(localStorage.getItem(KEY)||'{}'))}; }catch(e){}
  const subs=[];
  return {
    get: k => data[k],
    set: (k,v) => { data[k]=v; try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} subs.forEach(f=>f(k,v)); },
    all: () => ({...data}),
    onChange: f => { subs.push(f); },
    reset: () => { data={...DEF}; localStorage.removeItem(KEY); }
  };
})();

/* ---------------- POSIX 错误 ---------------- */
function fsErr(code, msg, path){
  const e = new Error(`${code}: ${msg}${path? ', '+path:''}`);
  e.code=code; e.path=path; return e;
}
function mapDom(e, path){
  const n=e&&(e.name||'');
  const map={NotFoundError:'ENOENT',TypeMismatchError:'ENOTDIR',NotAllowedError:'EACCES',QuotaExceededError:'ENOSPC',InvalidModificationError:'EEXIST',NoModificationAllowedError:'EPERM',SecurityError:'EACCES',AbortError:'EINTR'};
  return fsErr(map[n]||'EIO', e&&e.message||String(e), path);
}

/* ================================================================
   存储后端层 —— HandleBackend 同时服务 OPFS 根目录与本地挂载文件夹
   （两者拿到的都是 FileSystemDirectoryHandle，结构保证功能一致）
   ================================================================ */
class HandleBackend {
  constructor(rootHandle, label){ this.root=rootHandle; this.label=label||'handle'; }
  async _dir(rel, create=false){
    const segs = rel ? rel.split('/').filter(Boolean) : [];
    let h=this.root;
    for(const s of segs){
      try{ h = await h.getDirectoryHandle(s, {create}); }
      catch(e){
        if(e.name==='TypeMismatchError') throw fsErr('ENOTDIR','路径不是目录', rel);
        throw mapDom(e, rel);
      }
    }
    return h;
  }
  async stat(rel){
    rel=rel||'';
    if(!rel){ return {name:this.root.name||'/', isDirectory:true, size:0, mtime:Date.now()}; }
    const segs=rel.split('/'); const last=segs.pop(); const parent=await this._dir(segs.join('/'));
    if(parent.entries){
      try{
        const fh = await parent.getDirectoryHandle(last);
        return {name:last, isDirectory:true, size:0, mtime:null};
      }catch(e){}
      try{
        const fh = await parent.getFileHandle(last);
        const f = await fh.getFile();
        return {name:last, isDirectory:false, size:f.size, mtime:f.lastModified};
      }catch(e){ throw mapDom(e, rel); }
    }
    try{ const f=await parent.getFile(last); return {name:last,isDirectory:false,size:f.size,mtime:f.lastModified}; }
    catch(e){ try{ await parent.getDirectory(last); return {name:last,isDirectory:true,size:0,mtime:null}; }catch(e2){ throw mapDom(e, rel); } }
  }
  async readdir(rel, opts={}){
    const dir = await this._dir(rel);
    const out=[];
    if(dir.entries){
      const items=[];
      for await (const [name, h] of dir.entries()) items.push([name,h]);
      await Promise.all(items.map(async ([name,h])=>{
        if(h.kind==='directory') out.push({name, isDirectory:true, size:null, mtime:null});
        else {
          try{ const f=await h.getFile(); out.push({name, isDirectory:false, size:f.size, mtime:f.lastModified}); }
          catch(e){ out.push({name, isDirectory:false, size:0, mtime:0}); }
        }
      }));
    } else {
      /* 旧 API 回退 */
      await new Promise(res=>{
        const rd = dir.createReader ? dir.createReader() : null;
        if(!rd) return res();
        const loop=()=>rd.readEntries(async es=>{ if(!es.length) return res();
          await Promise.all(es.map(async en=>{
            if(en.isDirectory) out.push({name:en.name,isDirectory:true,size:null,mtime:null});
            else { const f=await new Promise((r,j)=>en.file(r,j)); out.push({name:en.name,isDirectory:false,size:f.size,mtime:f.lastModified}); }
          })); loop();
        }, ()=>res());
        loop();
      });
    }
    return out;
  }
  async _fileHandle(rel){
    const segs=rel.split('/'); const last=segs.pop();
    const parent = await this._dir(segs.join('/'));
    return parent.getFileHandle(last);
  }
  async readFile(rel, opts={}){
    try{
      const fh = await this._fileHandle(rel);
      const f = await fh.getFile();
      if(opts.as==='blob'||opts.as==='file') return f;
      if(opts.as==='buffer') return f.arrayBuffer();
      return f.text();
    }catch(e){ throw e.code?e:mapDom(e, rel); }
  }
  async writeFile(rel, data){
    const segs=rel.split('/'); const last=segs.pop();
    const parent = await this._dir(segs.join('/'), true);
    const fh = await parent.getFileHandle(last, {create:true});
    const blob = data instanceof Blob ? data : new Blob([data]);
    if(fh.createWritable){
      const w = await fh.createWritable();
      await w.write(blob); await w.close();
    } else if(fh.createSyncAccessHandle && typeof Worker!=='undefined'){
      /* Safari 旧版回退：同步访问句柄 */
      const sh = await fh.createSyncAccessHandle();
      const buf = await blob.arrayBuffer();
      sh.truncate(0); sh.write(buf); sh.flush(); sh.close();
    } else throw fsErr('EPERM','当前环境不支持写入', rel);
  }
  async mkdir(rel, recursive=false){
    const segs=rel.split('/').filter(Boolean);
    if(!segs.length) return;
    if(recursive){ await this._dir(rel, true); return; }
    const last=segs.pop();
    const parent=await this._dir(segs.join('/'));
    try{ await parent.getDirectoryHandle(last, {create:true}); }catch(e){ throw mapDom(e, rel); }
  }
  async remove(rel, recursive=false){
    const segs=rel.split('/'); const last=segs.pop();
    const parent=await this._dir(segs.join('/'));
    try{
      if(parent.removeEntry) await parent.removeEntry(last, {recursive});
      else if(recursive){ const d=await parent.getDirectory(last); await d.removeRecursively(); }
      else await parent.removeEntry(last);
    }catch(e){ throw mapDom(e, rel); }
  }
  async rename(relFrom, relTo){
    const hFrom = await this._resolveHandle(relFrom);
    const segsTo=relTo.split('/'); const lastTo=segsTo.pop();
    const parentTo=await this._dir(segsTo.join('/'), true);
    if(hFrom.move){ try{ await hFrom.move(parentTo, lastTo); return; }catch(e){ /* 回退复制+删除 */ } }
    /* 复制 + 删除 */
    const st = await this.stat(relFrom);
    if(st.isDirectory) await this._copyDir(relFrom, relTo);
    else { const f = await this.readFile(relFrom, {as:'blob'}); await this.writeFile(relTo, f); }
    await this.remove(relFrom, true);
  }
  async _resolveHandle(rel){
    const segs=rel.split('/'); const last=segs.pop();
    const parent=await this._dir(segs.join('/'));
    try{ return await parent.getFileHandle(last); }catch(e){ return await parent.getDirectoryHandle(last); }
  }
  async _copyDir(from, to){
    await this.mkdir(to, true);
    const entries = await this.readdir(from);
    await Promise.all(entries.map(en=>{
      const f=from?from+'/'+en.name:en.name, t=to+'/'+en.name;
      return en.isDirectory ? this._copyDir(f,t) : this.readFile(f,{as:'blob'}).then(b=>this.writeFile(t,b));
    }));
  }
  async getFile(rel){ /* 惰性 File 对象，用于缩略图/媒体 */
    const fh = await this._fileHandle(rel);
    return fh.getFile();
  }
}

/* ---------------- IndexedDB 后端（降级 / 可选存储域） ---------------- */
class IDBBackend {
  constructor(dbName='benthos-fs'){ this.dbName=dbName; this._dbp=null; }
  db(){ if(!this._dbp) this._dbp = idbOpen(this.dbName, 1, d=>{ if(!d.objectStoreNames.contains('fs')) d.createObjectStore('fs', {keyPath:'path'}); }); return this._dbp; }
  _norm(rel){ return rel||''; }
  async _get(rel){ const d=await this.db(); return new Promise((res,rej)=>{ const q=d.transaction('fs').objectStore('fs').get(this._norm(rel)); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
  async _put(rec){ const d=await this.db(); return new Promise((res,rej)=>{ const t=d.transaction('fs','readwrite'); t.objectStore('fs').put(rec); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
  async _del(path){ const d=await this.db(); return new Promise((res,rej)=>{ const t=d.transaction('fs','readwrite'); t.objectStore('fs').delete(path); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
  async _all(prefix){ const d=await this.db(); return new Promise((res,rej)=>{ const out=[]; const c=d.transaction('fs').objectStore('fs').openCursor(); c.onsuccess=e=>{ const cu=e.target.result; if(cu){ if(!prefix || cu.key===prefix || cu.key.startsWith(prefix+'/')) out.push(cu.value); cu.continue(); } else res(out); }; c.onerror=()=>rej(c.error); }); }
  async stat(rel){
    rel=this._norm(rel);
    if(!rel) return {name:'IndexedDB', isDirectory:true, size:0, mtime:Date.now()};
    const rec = await this._get(rel);
    if(rec) return {name:B.base('/'+rel), isDirectory:!!rec.dir, size:rec.size||0, mtime:rec.mtime||Date.now()};
    /* 隐式目录 */
    const kids = await this._all(rel);
    if(kids.length) return {name:B.base('/'+rel), isDirectory:true, size:0, mtime:Date.now()};
    throw fsErr('ENOENT','无此文件或目录','/'+rel);
  }
  async readdir(rel){
    rel=this._norm(rel);
    const all = await this._all(rel);
    const map=new Map();
    for(const rec of all){
      const rest = rel ? rec.path.slice(rel.length+1) : rec.path;
      if(!rest) continue;
      const first = rest.split('/')[0];
      if(!map.has(first)) map.set(first, rest===first ? rec : {dir:true, size:0, mtime:Date.now()});
    }
    return [...map.entries()].map(([name,rec])=>({name, isDirectory:!!rec.dir, size:rec.dir?null:(rec.size||0), mtime:rec.dir?null:(rec.mtime||0)}));
  }
  async readFile(rel, opts={}){
    const rec = await this._get(this._norm(rel));
    if(!rec || rec.dir) throw fsErr('ENOENT','无此文件','/'+rel);
    const blob = rec.blob||new Blob([]);
    if(opts.as==='blob'||opts.as==='file') return blob;
    if(opts.as==='buffer') return blob.arrayBuffer();
    return blob.text();
  }
  async writeFile(rel, data){
    const blob = data instanceof Blob ? data : new Blob([data]);
    await this._put({path:this._norm(rel), dir:false, blob, size:blob.size, mtime:Date.now()});
  }
  async mkdir(rel, recursive=false){
    rel=this._norm(rel);
    if(!rel) return;
    if(recursive){
      const segs=rel.split('/'); let acc='';
      for(const s of segs){ acc=acc?acc+'/'+s:s; const ex=await this._get(acc); if(!ex) await this._put({path:acc, dir:true, size:0, mtime:Date.now()}); }
      return;
    }
    const ex=await this._get(rel);
    if(ex) throw fsErr('EEXIST','已存在','/'+rel);
    await this._put({path:rel, dir:true, size:0, mtime:Date.now()});
  }
  async remove(rel, recursive=false){
    rel=this._norm(rel);
    const rec=await this._get(rel);
    const kids=await this._all(rel);
    const hasKids=kids.some(k=>k.path!==rel);
    if(rec && rec.dir && hasKids && !recursive) throw fsErr('ENOTEMPTY','目录非空','/'+rel);
    if(!rec && !hasKids) throw fsErr('ENOENT','无此文件或目录','/'+rel);
    for(const k of kids) if(k.path!==rel) await this._del(k.path);
    if(rec) await this._del(rel);
  }
  async rename(relFrom, relTo){
    const rec=await this._get(relFrom);
    const kids=await this._all(relFrom);
    if(rec){ await this._del(relFrom); rec.path=relTo; await this._put(rec); }
    for(const k of kids){ if(k.path===relFrom) continue; await this._del(k.path); k.path = relTo + k.path.slice(relFrom.length); await this._put(k); }
  }
  async getFile(rel){ const b=await this.readFile(rel,{as:'blob'}); return new File([b], B.base('/'+rel)); }
}

/* ================================================================
   VFS 路由层 —— 挂载表 + 最长前缀匹配
   ================================================================ */
const VFS = {
  mounts: [],
  add(point, backend, info={}){ 
    point=normPath(point);
    this.mounts.push({point, backend, ...info});
    this.mounts.sort((a,b)=>b.point.length-a.point.length);
  },
  remove(point){ this.mounts = this.mounts.filter(m=>m.point!==normPath(point)); },
  resolve(path){
    path=normPath(path);
    for(const m of this.mounts){
      if(path===m.point || path.startsWith(m.point==='/'?'/':m.point+'/') || m.point==='/') {
        const rel = m.point==='/' ? path.slice(1) : path.slice(m.point.length+1);
        return {mount:m, rel: rel||'', point:m.point};
      }
    }
    throw fsErr('ENOENT','路径不在任何挂载点内', path);
  },
  isMountPoint(path){ path=normPath(path); return this.mounts.some(m=>m.point===path && m.point!==''); },
  mountUnder(path){ path=normPath(path); return this.mounts.some(m=>m.point!==path && (m.point===path || m.point.startsWith(path+'/'))); },
  childMounts(path){ path=normPath(path); return this.mounts.filter(m=>m.point!==path && m.point!== '/' && B.dirOf(m.point)===path); }
};

/* ================================================================
   fs 门面层 —— Node 风格 API，Promise + 回调双兼容
   ================================================================ */
const fsCore = {
  async stat(path){
    const {mount, rel} = VFS.resolve(path);
    const st = await mount.backend.stat(rel);
    return {...st, path:normPath(path), isMount: VFS.isMountPoint(path)};
  },
  async exists(path){ try{ await fsCore.stat(path); return true; }catch(e){ return false; } },
  async readdir(path, opts={}){
    path=normPath(path);
    const {mount, rel} = VFS.resolve(path);
    const list = await mount.backend.readdir(rel, opts);
    const out = list.map(en=>({...en, path:B.join(path,en.name)}));
    /* 合并子挂载点 */
    for(const cm of VFS.childMounts(path)){
      out.push({name:B.base(cm.point), isDirectory:true, size:null, mtime:null, path:cm.point, isMount:true});
    }
    out.sort((a,b)=> (b.isDirectory-a.isDirectory) || B.natural(a.name,b.name));
    return out;
  },
  async readFile(path, opts){
    const o = typeof opts==='string' ? {encoding:opts} : (opts||{});
    const {mount, rel} = VFS.resolve(path);
    return mount.backend.readFile(rel, o);
  },
  async writeFile(path, data){
    path=normPath(path);
    if(VFS.isMountPoint(path)) throw fsErr('EISDIR','不能覆盖挂载点', path);
    const {mount, rel} = VFS.resolve(path);
    if(!rel) throw fsErr('EISDIR','不能写入目录', path);
    await mount.backend.writeFile(rel, data);
    fsEmit(B.dirOf(path));
  },
  async appendFile(path, data){
    let old='';
    try{ old = await fsCore.readFile(path, 'utf8'); }catch(e){}
    await fsCore.writeFile(path, old + data);
  },
  async mkdir(path, opts={}){
    path=normPath(path);
    const recursive = opts===true || (opts&&opts.recursive);
    const {mount, rel} = VFS.resolve(path);
    await mount.backend.mkdir(rel, recursive);
    fsEmit(B.dirOf(path));
  },
  async rm(path, opts={}){
    path=normPath(path);
    const recursive = opts===true || (opts&&opts.recursive);
    if(path==='/' || path==='') throw fsErr('EPERM','不能删除根目录', path);
    if(VFS.isMountPoint(path)) throw fsErr('EPERM','挂载点不能删除，请先在设置或侧边栏中卸载', path);
    if(VFS.mountUnder(path)) throw fsErr('EPERM','目录中包含本地挂载点，请先卸载', path);
    const {mount, rel} = VFS.resolve(path);
    await mount.backend.remove(rel, recursive);
    fsEmit(B.dirOf(path));
  },
  unlink: p=>fsCore.rm(p),
  rmdir: p=>fsCore.rm(p),
  async rename(from, to){
    from=normPath(from); to=normPath(to);
    if(from===to) return;
    if(VFS.isMountPoint(from)) throw fsErr('EPERM','挂载点不能移动或重命名', from);
    if(await fsCore.exists(to)) throw fsErr('EEXIST','目标已存在', to);
    const rf=VFS.resolve(from), rt=VFS.resolve(to);
    if(rf.mount===rt.mount && rf.mount.backend.rename){
      await rf.mount.backend.rename(rf.rel, rt.rel);
    } else {
      /* 跨后端：复制 + 删除 */
      const st=await fsCore.stat(from);
      if(st.isDirectory) await copyTree(from, to);
      else await fsCore.writeFile(to, await fsCore.readFile(from, {as:'blob'}));
      await fsCore.rm(from, {recursive:true});
    }
    fsEmit(B.dirOf(from)); fsEmit(B.dirOf(to));
  },
  async copy(from, to){
    from=normPath(from); to=normPath(to);
    const st=await fsCore.stat(from);
    if(st.isDirectory) await copyTree(from, to);
    else await fsCore.writeFile(to, await fsCore.readFile(from, {as:'blob'}));
    fsEmit(B.dirOf(to));
  },
  async du(path, signal){
    let total=0;
    await walk(path, {signal, fn: st=>{ if(!st.isDirectory) total += st.size||0; }});
    return total;
  },
  async lstat(path){ return fsCore.stat(path); },
  async open(path){ return openPath(path); },
  async truncate(path){ await fsCore.writeFile(path, new Blob([])); },
};
async function copyTree(from, to){
  await fsCore.mkdir(to, {recursive:true});
  const list = await fsCore.readdir(from);
  const CHUNK=6;
  for(let i=0;i<list.length;i+=CHUNK){
    await Promise.all(list.slice(i,i+CHUNK).map(async en=>{
      const f=B.join(from,en.name), t=B.join(to,en.name);
      if(en.isDirectory) await copyTree(f,t);
      else await fsCore.writeFile(t, await fsCore.readFile(f,{as:'blob'}));
    }));
  }
}
/* 变更事件：按目录去抖合并 */
const _fsWatchers = new Set();
const _fsEmitPend = new Map();
function fsEmit(dir){
  dir=normPath(dir);
  if(_fsEmitPend.has(dir)) return;
  _fsEmitPend.set(dir, setTimeout(()=>{
    _fsEmitPend.delete(dir);
    _fsWatchers.forEach(f=>{ try{ f(dir); }catch(e){} });
  }, 80));
}
/* 回调兼容包装：回调可出现在任意参数位置，其余参数原样传递 */
function wrapCb(fn){
  return function(...args){
    let cb=null;
    const i=args.findIndex(a=>typeof a==='function');
    if(i>-1){ cb=args[i]; args.splice(i,1); }
    const p = fn.apply(null, args);
    if(cb){ p.then(r=>cb(null,r), e=>cb(e)); return undefined; }
    return p;
  };
}
const fs = {};
for(const k of Object.keys(fsCore)) fs[k] = typeof fsCore[k]==='function' ? wrapCb(fsCore[k]) : fsCore[k];
fs.promises = fsCore;
fs.onChange = fn => { _fsWatchers.add(fn); return ()=>_fsWatchers.delete(fn); };
fs.getFile = async path => { const {mount, rel} = VFS.resolve(path); return mount.backend.getFile ? mount.backend.getFile(rel) : fsCore.readFile(path,{as:'file'}); };
fs.mountInfo = path => VFS.resolve(path).mount;
window.fs = fs;

/* 唯一文件命名 */
async function uniqueName(dir, base){
  const dot=base.lastIndexOf('.');
  const stem = dot>0?base.slice(0,dot):base, ext = dot>0?base.slice(dot):'';
  let cand=base, n=2;
  while(await fsCore.exists(B.join(dir,cand))){ cand=`${stem} (${n})${ext}`; n++; }
  return cand;
}

/* ================================================================
   对话框系统
   ================================================================ */
const Dlg = {
  root(){ return document.getElementById('dlg-root'); },
  show({title, icon:icn='info', body='', buttons=null, width=440, onClose}={}){
    return new Promise(res=>{
      const root=this.root();
      root.innerHTML='';
      const d=B.el('div','dlg'); d.style.width=width+'px';
      d.appendChild(B.el('div','dlg-head', (icn?icon(icn,20):'') + `<b>${B.esc(title)}</b>`));
      const bd=B.el('div','dlg-body');
      if(typeof body==='string') bd.innerHTML=body; else bd.appendChild(body);
      d.appendChild(bd);
      const ft=B.el('div','dlg-foot');
      const btns = buttons || [{label:'确定', primary:true, value:true}];
      btns.forEach(b=>{
        const el=B.el('button','btn '+(b.primary?'primary ':'')+(b.danger?'danger ':''), B.esc(b.label));
        el.onclick=()=>{ this.hide(); onClose&&onClose(); res(b.value!==undefined?b.value:b.label); };
        ft.appendChild(el);
      });
      d.appendChild(ft);
      root.innerHTML=''; root.appendChild(d); root.classList.add('show');
    });
  },

/* ================================================================
   窗口管理器 —— 拖拽 / 八向缩放 / 最小化 / 最大化 / Aero Snap / Peek
   ================================================================ */
const WM = {
  wins: [], z:100, n:0,
  isMobile(){ return matchMedia('(max-width:820px)').matches; },
  area(){ const l=document.getElementById('windows-layer'); return {w:l.clientWidth, h:l.clientHeight}; },
  open(appId, opts={}){
    const app = APPS[appId];
    if(!app){ Toast.show('未注册的应用：'+appId, 'err'); return; }
    if(app.single){ const ex=this.wins.find(w=>w.appId===appId && !w.closed); if(ex){ this.restore(ex); this.focus(ex); return ex; } }
    this.n++;
    const mob=this.isMobile();
    const W = opts.w||app.w||780, H = opts.h||app.h||540;
    const area=this.area();
    const win = {
      id:'win'+this.n, appId, app, closed:false, minimized:false, maximized:mob, prevRect:null,
      state:{},
    };
    const el=B.el('div','window'+(win.maximized?' maxed':''));
    el.style.width=Math.min(W, area.w-16)+'px';
    el.style.height=Math.min(H, area.h-16)+'px';
    const off=(this.n%7)*26;
    el.style.left=Math.max(8, (area.w-W)/2 + off - 60)+'px';
    el.style.top=Math.max(8, (area.h-H)/2.6 + off - 40)+'px';
    if(win.maximized){ el.style.left='0'; el.style.top='0'; el.style.width='100%'; el.style.height='100%'; }
    el.innerHTML = `
      <div class="wt-bar">
        <div class="wt-ic">${icon(app.icon,18)}</div>
        <div class="wt-title">${B.esc(opts.title||app.name)}</div>
        <div class="wt-ctrl">
          <button class="wc-btn min" title="最小化">${icon('min',14)}</button>
          <button class="wc-btn max" title="最大化">${icon('max',14)}</button>
          <button class="wc-btn close" title="关闭">${icon('close',14)}</button>
        </div>
      </div>
      <div class="wt-body"></div>
      <div class="wt-resize rz-n"></div><div class="wt-resize rz-s"></div>
      <div class="wt-resize rz-e"></div><div class="wt-resize rz-w"></div>
      <div class="wt-resize rz-ne"></div><div class="wt-resize rz-nw"></div>
      <div class="wt-resize rz-se"></div><div class="wt-resize rz-sw"></div>`;
    win.el=el; win.body=el.querySelector('.wt-body');
    document.getElementById('windows-layer').appendChild(el);
    this.wins.push(win);

    /* --- 焦点 --- */
    el.addEventListener('pointerdown', ()=>this.focus(win), true);
    /* --- 控制按钮 --- */
    el.querySelector('.wc-btn.min').onclick=e=>{ e.stopPropagation(); this.minimize(win); };
    el.querySelector('.wc-btn.max').onclick=e=>{ e.stopPropagation(); this.maxToggle(win); };
    el.querySelector('.wc-btn.close').onclick=e=>{ e.stopPropagation(); this.close(win); };
    el.querySelector('.wt-bar').addEventListener('dblclick', e=>{ if(!e.target.closest('.wc-btn')) this.maxToggle(win); });
    /* --- 标题栏拖拽 + Aero Snap --- */
    if(!mob) this._drag(win);
    /* --- 八向缩放 --- */
    if(!mob) B.$$('.wt-resize', el).forEach(h=>this._resize(win, h));

    this.focus(win);
    Taskbar.render();
    /* 应用主体 */
    const ctx = app.launch(win, opts);
    if(ctx && typeof ctx==='object') Object.assign(win.state, ctx);
    return win;
  },
  focus(win){
    if(win.minimized) this.restore(win);
    win.el.style.zIndex = ++this.z;
    this.wins.forEach(w=>w.el.classList.toggle('focused', w===win));
    Taskbar.render();
  },
  minimize(win){
    win.minimized=true;
    win.el.classList.add('min-anim');
    setTimeout(()=>{ win.el.style.display='none'; win.el.classList.remove('min-anim'); }, 210);
    Taskbar.render();
  },
  restore(win){
    win.minimized=false;
    win.el.style.display='flex';
    requestAnimationFrame(()=>win.el.classList.remove('min-anim'));
  },
  maxToggle(win){
    if(this.isMobile()) return; /* 移动端窗口已铺满 */
    const el=win.el;
    if(!win.maximized){
      win.prevRect={left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height};
      win.maximized=true; el.classList.add('maxed');
      el.style.left='0'; el.style.top='0'; el.style.width='100%'; el.style.height='100%';
      el.querySelector('.wc-btn.max').innerHTML=icon('restore',14);
    } else {
      win.maximized=false; el.classList.remove('maxed');
      Object.assign(el.style, win.prevRect||{});
      el.querySelector('.wc-btn.max').innerHTML=icon('max',14);
    }
    if(win.state.onResize) win.state.onResize();
  },
  applySnap(win, zone){
    const area=this.area();
    if(!win.maximized){
      win.prevRect={left:win.el.style.left, top:win.el.style.top, width:win.el.style.width, height:win.el.style.height};
    }
    win.maximized = zone==='max';
    win.el.classList.toggle('maxed', zone==='max');
    const P=6;
    if(zone==='max'){ Object.assign(win.el.style,{left:'0',top:'0',width:'100%',height:'100%'}); }
    else if(zone==='left'){ Object.assign(win.el.style,{left:P+'px',top:P+'px',width:(area.w/2-P*1.5)+'px',height:(area.h-P*2)+'px'}); }
    else if(zone==='right'){ Object.assign(win.el.style,{left:(area.w/2+P*0.5)+'px',top:P+'px',width:(area.w/2-P*1.5)+'px',height:(area.h-P*2)+'px'}); }
    win.el.querySelector('.wc-btn.max').innerHTML=icon(win.maximized?'restore':'max',14);
    if(win.state.onResize) win.state.onResize();
  },
  close(win){
    win.closed=true;
    if(win.state.onClose){ try{ win.state.onClose(); }catch(e){ console.warn(e); } }
    win.el.style.transition='opacity .15s, transform .15s';
    win.el.style.opacity='0'; win.el.style.transform='scale(.95)';
    setTimeout(()=>win.el.remove(), 160);
    this.wins=this.wins.filter(w=>w!==win);
    Taskbar.render();
  },
  _drag(win){
    const bar=win.el.querySelector('.wt-bar');
    const ghost=document.getElementById('snap-ghost');
    bar.addEventListener('pointerdown', e=>{
      if(e.target.closest('.wc-btn') || e.button===2) return;
      if(win.maximized){
        /* 从最大化拖出：按比例还原 */
        const ratio = e.clientX / window.innerWidth;
        this.maxToggle(win);
        const w=win.el.offsetWidth;
        win.el.style.left=(e.clientX - w*ratio)+'px';
        win.el.style.top=(e.clientY-20)+'px';
      }
      const sx=e.clientX, sy=e.clientY;
      const r=win.el.getBoundingClientRect();
      const layer=document.getElementById('windows-layer').getBoundingClientRect();
      let zone=null, moved=false;
      bar.setPointerCapture(e.pointerId);
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
        /* 边缘检测 → Snap 预览 */
        zone=null;
        if(ev.clientY<=layer.top+6) zone='max';
        else if(ev.clientX<=layer.left+6) zone='left';
        else if(ev.clientX>=layer.right-6) zone='right';
        if(zone && S.get('peek')){
          const area=this.area(); const P=6;
          const rects={max:[0,0,'100%','100%'], left:[P,P,(area.w/2-P*1.5),(area.h-P*2)], right:[area.w/2+P*0.5,P,(area.w/2-P*1.5),(area.h-P*2)]};
          const [gx,gy,gw,gh]=rects[zone];
          Object.assign(ghost.style,{display:'block',left:gx+'px',top:gy+'px',width:(typeof gw==='number'?gw+'px':gw),height:(typeof gh==='number'?gh+'px':gh)});
        } else ghost.style.display='none';
        if(!zone){
          win.el.style.left=B.clamp(r.left+dx-layer.left, -r.width+80, layer.width-80)+'px';
          win.el.style.top=B.clamp(r.top+dy-layer.top, 0, layer.height-44)+'px';
        }
      };
      const up=ev=>{
        bar.removeEventListener('pointermove',move);
        bar.removeEventListener('pointerup',up);
        ghost.style.display='none';
        if(zone){ this.applySnap(win, zone); }
      };
      bar.addEventListener('pointermove',move);
      bar.addEventListener('pointerup',up);
    });
  },
  _resize(win, handle){
    handle.addEventListener('pointerdown', e=>{
      if(win.maximized || e.button===2) return;
      e.stopPropagation();
      const dir=[...handle.classList].find(c=>c.startsWith('rz-')).slice(3);
      const sx=e.clientX, sy=e.clientY, r=win.el.getBoundingClientRect();
      const layer=document.getElementById('windows-layer').getBoundingClientRect();
      handle.setPointerCapture(e.pointerId);
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        let {left,top,width,height}={left:r.left-layer.left, top:r.top-layer.top, width:r.width, height:r.height};
        if(dir.includes('e')) width=Math.max(320, r.width+dx);
        if(dir.includes('s')) height=Math.max(220, r.height+dy);
        if(dir.includes('w')){ width=Math.max(320, r.width-dx); left=r.left-layer.left+(r.width-width); }
        if(dir.includes('n')){ height=Math.max(220, r.height-dy); top=r.top-layer.top+(r.height-height); }
        Object.assign(win.el.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
      };
      const up=()=>{
        handle.removeEventListener('pointermove',move);
        handle.removeEventListener('pointerup',up);
        if(win.state.onResize) win.state.onResize();
      };
      handle.addEventListener('pointermove',move);
      handle.addEventListener('pointerup',up);
    });
  },
  showDesktop(){
    const allMin=this.wins.filter(w=>!w.minimized);
    if(allMin.length){ this._saved=allMin; allMin.forEach(w=>this.minimize(w)); }
    else if(this._saved){ this._saved.forEach(w=>this.restore(w)); this._saved=null; }
    Taskbar.render();
  },
  peek(on){ document.getElementById('windows-layer').classList.toggle('peek', on && S.get('peek')); }
};

const Clip = { mode:null, paths:[],
  set(mode, paths){ this.mode=mode; this.paths=[...paths]; },
  clear(){ this.mode=null; this.paths=[]; },
  async paste(destDir){
    if(!this.mode || !this.paths.length) return;
    const mode=this.mode, paths=[...this.paths];
    this.clear();
    for(const p of paths){
      try{
        const name=B.base(p);
        let target=B.join(destDir,name);
        if(target===p) continue;
        if(mode==='cut'){
          if(await fsCore.exists(target)) target=B.join(destDir, await uniqueName(destDir,name));
          await fsCore.rename(p, target);
        } else {
          if(await fsCore.exists(target)) target=B.join(destDir, await uniqueName(destDir,name));
          await fsCore.copy(p, target);
        }
      }catch(e){ Toast.show('粘贴失败：'+e.message, 'err'); }
    }
  }
};

const dragCache = new Map(); /* path -> {file, url} */
async function preloadDragFile(path){
  if(dragCache.has(path)) return dragCache.get(path);
  try{
    const st=await fsCore.stat(path);
    if(st.isDirectory) return null;
    const file = await fs.getFile(path);
    const url = URL.createObjectURL(file);
    const rec={file, url};
    dragCache.set(path, rec);
    return rec;
  }catch(e){ return null; }
}
function scheduleRevoke(path){
  setTimeout(()=>{
    const rec=dragCache.get(path);
    if(rec){ URL.revokeObjectURL(rec.url); dragCache.delete(path); }
  }, 6000);
}
/* 导出：文件或文件夹（文件夹自动打包 zip） */
async function exportPath(path){
  try{
    const st=await fsCore.stat(path);
    if(!st.isDirectory){
      const file=await fs.getFile(path);
      B.download(file, st.name);
    } else {
      const JSZip=await loadJSZip();
      if(!JSZip){ Toast.show('压缩组件未加载（离线），无法导出文件夹','err'); return; }
      const zip=new JSZip();
      await zipWalk(zip, path, '');
      const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE'});
      B.download(blob, st.name+'.zip');
    }
  }catch(e){ Toast.show('导出失败：'+e.message,'err'); }
}
async function zipWalk(zip, dir, rel){
  const list=await fsCore.readdir(dir);
  for(const en of list){
    const p=B.join(dir,en.name), r=rel?rel+'/'+en.name:en.name;
    if(en.isDirectory){ zip.folder(r); await zipWalk(zip, p, r); }
    else zip.file(r, await fsCore.readFile(p,{as:'blob'}), {date: en.mtime?shiftDateForZip(new Date(en.mtime)):undefined});
  }
}
/* JSZip 时区修复：DOS 时间按 UTC 解析造成的偏差 */
function shiftDateForZip(d){ return new Date(d.getTime() - d.getTimezoneOffset()*60000); }
function unshiftDateFromZip(d){ return new Date(d.getTime() + d.getTimezoneOffset()*60000); }

/* 导入：从 DataTransfer 递归写入 VFS（同步收集 entry，异步写入） */
async function importDataTransfer(dt, destDir, onProgress){
  const entries=[];
  const files=[];
  if(dt.items){
    for(const it of dt.items){
      if(it.kind==='file'){
        const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
        if(en) entries.push(en); else { const f=it.getAsFile(); if(f) files.push(f); }
      }
    }
  }
  if(!entries.length && dt.files && dt.files.length) for(const f of dt.files) files.push(f);
  if(!entries.length && !files.length){
    /* 纯文本拖入 */
    const txt = dt.getData('text/plain') || dt.getData('text/uri-list');
    if(txt){
      const name=await uniqueName(destDir,'拖入的文本.txt');
      await fsCore.writeFile(B.join(destDir,name), txt);
      Toast.show('已保存拖入的文本');
      return true;
    }
    return false;
  }
  let done=0, total=0;
  const countAll=async en=>{ if(en.isFile) total++; else if(en.isDirectory){ const rd=en.createReader(); await new Promise(res=>{ const loop=()=>rd.readEntries(es=>{ if(!es.length) return res(); es.forEach(countAll); loop(); }, ()=>res()); loop(); }); } };
  await Promise.all(entries.map(countAll)); total+=files.length;
  const tick=()=>{ done++; onProgress&&onProgress(done,total); };
  await fsCore.mkdir(destDir,{recursive:true});
  await Promise.all(entries.map(en=>writeEntry(en, destDir, tick)));
  for(const f of files){
    const name=await uniqueName(destDir, f.name);
    await fsCore.writeFile(B.join(destDir,name), new Blob([await f.arrayBuffer()]));
    tick();
  }
  fsEmit(destDir);
  Toast.show(`已导入 ${done} 个项目到 ${destDir}`);
  return true;
}
function writeEntry(entry, destDir, tick){
  return new Promise(async res=>{
    if(entry.isFile){
      entry.file(async f=>{
        try{
          const name=await uniqueName(destDir, f.name);
          await fsCore.writeFile(B.join(destDir,name), new Blob([await f.arrayBuffer()]));
        }catch(e){ console.warn(e); }
        tick(); res();
      }, async ()=>{ tick(); res(); });
    } else if(entry.isDirectory){
      try{ await fsCore.mkdir(B.join(destDir,entry.name),{recursive:true}); }catch(e){}
      const sub=B.join(destDir,entry.name);
      const rd=entry.createReader();
      const loop=()=>rd.readEntries(async es=>{
        if(!es.length) return res();
        for(const e of es) await writeEntry(e, sub, tick); /* readEntries 每次最多 100 条，循环直到空 */
        loop();
      }, ()=>res());
      loop();
    } else res();
  });
}
