  }
});

/* ================================================================
   压缩 / 解压缩引擎（ZIP · GZip · TAR · 7z）
   ================================================================ */
async function extractZip(path){
  const JSZip=await loadJSZip();
  const buf=await fsCore.readFile(path,{as:'buffer'});
  const zip=await JSZip.loadAsync(buf);
  const dir=B.dirOf(path);
  const stem=B.base(path).replace(/\.zip$/i,'');
  const dest=await uniqueName(dir, stem);
  const destDir=B.join(dir, dest);
  await fsCore.mkdir(destDir,{recursive:true});
  const names=Object.keys(zip.files);
  let i=0;
  for(const name of names){
    const item=zip.files[name];
    const clean=name.replace(/\\/g,'/');
    if(clean.includes('../')) continue; /* 防目录穿越 */
    const target=B.join(destDir, clean);
    if(item.dir){ await fsCore.mkdir(target,{recursive:true}); continue; }
    const blob=await item.async('blob');
    await fsCore.mkdir(B.dirOf(target),{recursive:true});
    await fsCore.writeFile(target, blob);
    /* item.date 已经 JSZip 时区修复（unshiftDateFromZip）可在此处比对展示 */
    void unshiftDateFromZip(item.date||new Date());
    if(++i%8===0) await new Promise(r=>setTimeout(r)); /* 让出主线程 */
  }
  Toast.show(`已解压 ${i} 个文件到 /${dest}`);
  return destDir;
}
/* GZip：浏览器原生 DecompressionStream */
async function extractGz(path){
  const buf=await fsCore.readFile(path,{as:'buffer'});
  const ds=new DecompressionStream('gzip');
  const out=await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
  const dir=B.dirOf(path);
  let name=B.base(path).replace(/\.gz$/i,'');
  if(/\.tar$/i.test(name)) return await writeTar(dir, out, name.replace(/\.tar$/i,''));
  name=await uniqueName(dir, name||'解压缩数据');
  await fsCore.writeFile(B.join(dir,name), new Blob([out]));
  Toast.show('已解压：'+name);
}
/* TAR：原生解析（支持 ustar 长路径） */
function parseTarEntries(buf){
  const u8=new Uint8Array(buf);
  const entries=[];
  let off=0, longName=null;
  const dec=new TextDecoder();
  while(off+512<=u8.length){
    const header=u8.subarray(off, off+512);
    if(header.every(b=>b===0)) break;
    const name0=dec.decode(header.subarray(0,100)).replace(/\0.*$/,'');
    const sizeStr=dec.decode(header.subarray(124,136)).replace(/\0/g,'').trim();
    const size=parseInt(sizeStr,8)||0;
    const type=String.fromCharCode(header[156]);
    const prefix=dec.decode(header.subarray(345,500)).replace(/\0.*$/,'');
    off+=512;
    const data=u8.subarray(off, off+size);
    off+=Math.ceil(size/512)*512;
    if(name0==='././@LongLink'){ longName=dec.decode(data).replace(/\0.*$/,''); continue; }
    let name=longName||((prefix?prefix+'/':'')+name0);
    longName=null;
    if(!name) continue;
    entries.push({name, dir:type==='5'||name.endsWith('/'), data: type==='0'||type===''||type===undefined?data.slice(0):null});
  }
  return entries;
}
async function writeTar(dir, buf, stem){
  const entries=parseTarEntries(buf);
  const dest=await uniqueName(dir, stem||'tar-解包');
  const destDir=B.join(dir, dest);
  await fsCore.mkdir(destDir,{recursive:true});
  let n=0;
  for(const en of entries){
    const clean=en.name.replace(/^\.\//,'').replace(/\\/g,'/');
    if(clean.includes('../')) continue;
    const target=B.join(destDir, clean);
    if(en.dir){ await fsCore.mkdir(target,{recursive:true}); continue; }
    if(!en.data) continue;
    await fsCore.mkdir(B.dirOf(target),{recursive:true});
    await fsCore.writeFile(target, new Blob([en.data]));
    n++;
  }
  Toast.show(`Tar 解包完成：${n} 个文件 → /${dest}`);
  return destDir;
}
async function extractTar(path){
  const buf=await fsCore.readFile(path,{as:'buffer'});
  return writeTar(B.dirOf(path), buf, B.base(path).replace(/\.tar$/i,''));
}
/* 7z：7z-wasm（延迟加载，失败友好提示） */
async function extract7z(path){
  let SevenZip;
  try{
    SevenZip=(await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js')).default;
  }catch(e){ Toast.show('7z 引擎加载失败（需要网络）','err'); return; }
  try{
    const mod=await SevenZip();
    const buf=await fsCore.readFile(path,{as:'buffer'});
    mod.FS.writeFile('/in.7z', new Uint8Array(buf));
    mod.callMain(['x','-y','-o/out','/in.7z']);
    const dir=B.dirOf(path);
    const dest=await uniqueName(dir, B.base(path).replace(/\.7z$/i,''));
    const destDir=B.join(dir,dest);
    const walkMem=async mp=>{
      const items=mod.FS.readdir(mp).filter(n=>n!=='.'&&n!=='..');
      for(const n of items){
        const full=mp+'/'+n;
        const stt=mod.FS.stat(full);
        const rel=full.slice(4); /* 去掉 /out */
        const target=B.join(destDir, rel);
        if(mod.FS.isDir(stt.mode)){ await fsCore.mkdir(target,{recursive:true}); await walkMem(full); }
        else { const data=mod.FS.readFile(full); await fsCore.mkdir(B.dirOf(target),{recursive:true}); await fsCore.writeFile(target, new Blob([data])); }
      }
    };
    await fsCore.mkdir(destDir,{recursive:true});
    await walkMem('/out');
    Toast.show('7z 解压完成 → /'+dest);
  }catch(e){ Toast.show('7z 解压失败：'+e.message,'err'); }
}

/* ================================================================
   十六进制查看器
   ================================================================ */
async function hexView(path){
  const buf=(await fsCore.readFile(path,{as:'buffer'})).slice(0, 4096);
  const u8=new Uint8Array(buf);
  let html='<div style="font-family:var(--f-mono);font-size:11.5px;line-height:1.7;overflow:auto;max-height:420px;background:var(--bg1);padding:12px;border-radius:8px">';
  for(let i=0;i<u8.length;i+=16){
    const row=[...u8.slice(i,i+16)];
    const hex=row.map(b=>b.toString(16).padStart(2,'0')).join(' ');
    const ascii=row.map(b=>(b>=32&&b<127)?String.fromCharCode(b):'·').join('');
    html+=`<div style="white-space:pre"><span style="color:var(--amb)">${i.toString(16).padStart(8,'0')}</span>  <span style="color:var(--ink)">${hex.padEnd(48)}</span> <span style="color:var(--acc)">${B.esc(ascii)}</span></div>`;
  }
  html+='</div>';
  Dlg.show({title:'十六进制 · '+B.base(path), icon:'hex', body:html, width:640, buttons:[{label:'关闭', primary:true}]});
}

/* ================================================================
   智能打开分派（先 stat 判类型）
   ================================================================ */
async function openPath(path, ctx={}){
  path=normPath(path);
  let st;
  try{ st=await fsCore.stat(path); }catch(e){ Toast.show('无法打开：'+e.message,'err'); return; }
  if(st.isDirectory){
    /* 目录：资源管理器来源 → 当前窗口导航；其他 → 新窗口 */
    if(ctx.explorerNav){ ctx.explorerNav(path); return; }
    openApp('files',{path});
    return;
  }
  const e=B.ext(path);
  if(IMG_EXT.includes(e)) return openApp('image',{path});
  if(AUD_EXT.includes(e)||VID_EXT.includes(e)) return openApp('media',{path});
  if(e==='pdf') return openApp('pdf',{path});
  if(e==='csv'||e==='tsv') return openApp('notepad',{path});
  if(e==='html'||e==='htm') return htmlOpenDialog(path);
  if(['css','js','mjs','json','xml'].includes(e)) return openApp('editor',{path});
  if(TXT_EXT.includes(e)) return openApp('notepad',{path});
  if(CODE_EXT.includes(e)) return openApp('editor',{path});
  if(e==='zip') return archiveDialog(path, ()=>extractZip(path));
  if(e==='gz'||e==='tgz') return extractGz(path).catch(err=>Toast.show('解压失败：'+err.message,'err'));
  if(e==='tar') return extractTar(path).catch(err=>Toast.show('解压失败：'+err.message,'err'));
  if(e==='7z') return extract7z(path);
  /* 未知类型：通用入口 */
  const choice=await Dlg.show({title:'未知文件类型 · .'+e, icon:'warn',
    body:`<p><b>${B.esc(B.base(path))}</b>（${B.fmtBytes(st.size)}）</p><p class="desc">系统不认识这种文件，选择一种处理方式：</p>`,
    buttons:[{label:'以文本打开', value:'text'},{label:'十六进制查看', value:'hex'},{label:'下载', value:'dl'},{label:'取消', value:null}]});
  if(choice==='text') openApp('notepad',{path});
  else if(choice==='hex') hexView(path);
  else if(choice==='dl') exportPath(path);
}
function archiveDialog(path, fn){
  return Dlg.show({title:'压缩文件 · '+B.base(path), icon:'archive',
    body:'<p>解压到同名文件夹？（推荐）</p>',
    buttons:[{label:'取消', value:null},{label:'解压到文件夹', primary:true, value:'go'}]
  }).then(async v=>{ if(v==='go'){ try{ await fn(); }catch(err){ Toast.show('解压失败：'+err.message,'err'); } } });
}
/* HTML 文件专用：预览效果 / 修改代码 双入口 */
async function htmlOpenDialog(path){
  const choice=await Dlg.show({title:B.base(path), icon:'browser',
    body:'<p>这是一个 HTML 网页文件，选择打开方式：</p>',
    buttons:[{label:'浏览器预览', value:'browser', primary:true},{label:'代码编辑器（含实时预览）', value:'editor'},{label:'记事本', value:'notepad'}],
    width:460});

    const f=await fs.getFile(path);
    const u=URL.createObjectURL(f);
    openApp('browser',{url:u, title:B.base(path)});

  else if(choice==='editor') openApp('editor',{path});
  else if(choice==='notepad') openApp('notepad',{path});
}

function wireDesktopEvents(){
  const layer=document.getElementById('icons-layer');
  const desk=document.getElementById('desktop');

  desk.addEventListener('click', e=>{

    if(e.target.closest('.window')||e.target.closest('#taskbar')||e.target.closest('#start-menu')||e.target.closest('.dicon')) return;
    e.preventDefault();
    Menu.show(e.clientX, e.clientY, [
      {label:'刷新桌面', icon:'refresh', fn:()=>Desktop.render()},
      '-',
      {label:'新建文件夹', icon:'plus', fn:async()=>{ const n=await Dlg.prompt('新建文件夹','新建文件夹'); if(n){ try{ await fsCore.mkdir(B.join('/Desktop',n)); }catch(err){Toast.show(err.message,'err');} } }},
      {label:'新建文本文件', icon:'fileTxt', fn:async()=>{ const n=await Dlg.prompt('新建文件','新建文件.txt'); if(n){ const p=B.join('/Desktop',n); await fsCore.writeFile(p,''); openPath(p); } }},
      {label:'上传文件到桌面', icon:'import', fn:()=>{ const inp=document.getElementById('import-input');

      {label:'粘贴', icon:'paste', disabled:!Clip.paths.length, fn:()=>Clip.paste('/Desktop')},
      '-',
      {label:'更换壁纸', icon:'wallpaper', sub:[
        ...Wallpaper.list.map(([k,n])=>({label:n, icon:'image', fn:async()=>{ S.set('wallpaper',k); await Wallpaper.apply(); }})),
        {label:'上传图片…', icon:'import', fn:()=>{ const inp=document.getElementById('wallpaper-input'); inp.onchange=async()=>{ if(inp.files[0]) await Wallpaper.upload(inp.files[0]); }; inp.click(); }},
      ]},
      {label:'显示设置', icon:'settings', fn:()=>openApp('settings')},
      '-',
      {label:'切换深浅色主题', icon: S.get('theme')==='dark'?'sun':'moon', fn:()=>S.set('theme', S.get('theme')==='dark'?'light':'dark')},
      {label:'进入全屏模式', icon:'fullscreen', fn:toggleFullscreen},
    ]);
  });
  /* 从物理桌面拖入 → 导入 */
  layer.addEventListener('dragover', e=>{
    if(e.dataTransfer.types && [...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
  layer.addEventListener('drop', async e=>{
    if(e.target.closest('.dicon')) return; /* 图标自己处理 */
    e.preventDefault();
    if(Desktop._dragIcon){
      /* 内部图标移动由图标层坐标逻辑处理（dragend 后按位置保存） */
      const r=layer.getBoundingClientRect();
      const el=Desktop._dragIcon;
      let x=e.clientX-r.left-43, y=e.clientY-r.top-30;
      if(S.get('iconGridSnap')){
        const {w,h}=Desktop.cell();
        x=Math.round((x-16)/w)*w+16; y=Math.round((y-16)/h)*h+16;
      }
      el.style.left=B.clamp(x,4,r.width-70)+'px';
      el.style.top=B.clamp(y,4,r.height-60)+'px';
      Desktop.pos[el.dataset.name]={x:parseFloat(el.style.left), y:parseFloat(el.style.top)};
      Desktop.save();
      return;
    }
    await importDataTransfer(e.dataTransfer, '/Desktop');
  });
  /* 拖入窗口区域（非桌面）也导入到 /Desktop */
  document.getElementById('windows-layer').addEventListener('dragover', e=>{
    if(e.dataTransfer.types && [...e.dataTransfer.types].includes('Files') && !e.target.closest('.window')) e.preventDefault();
  });
  document.getElementById('windows-layer').addEventListener('drop', async e=>{
    if(e.target.closest('.window')) return;
    e.preventDefault();
    await importDataTransfer(e.dataTransfer, '/Desktop');
  });
  /* 桌面框选多选（鼠标直接框选；触摸同样即时生效） */
  const dSel={sel:new Set(), marqueeMode:true};
  attachMarquee(dSel, layer, layer, ()=>{ B.$$('.dicon', layer).forEach(d=>d.classList.toggle('sel', dSel.sel.has(d.dataset.path))); });
  /* 全局抑制默认右键菜单（输入框除外） */
  document.addEventListener('contextmenu', e=>{
    if(!e.target.closest('input,textarea,[contenteditable="true"]')) e.preventDefault();
  });
  addEventListener('resize', B.debounce(()=>{ WM.wins.forEach(w=>{ if(w.state.onResize) w.state.onResize(); }); }, 200));
}
function wireGlobalKeys(){

}
