/* ================================================================
   桌面图标层 —— 自由摆放 / HTML5 双向拖拽 / 触摸拖拽
   ================================================================ */
const Desktop = {
  pos:{},
  async load(){ this.pos = (await meta.get('iconpos'))||{}; },
  save(){ meta.set('iconpos', this.pos); },
  cell(){ return {w:96, h:104}; },
  autoSlot(i){
    const layer=document.getElementById('icons-layer');
    const {w,h}=this.cell();
    const cols=Math.max(1, Math.floor((layer.clientWidth-20)/w));
    const rows=Math.max(1, Math.floor((layer.clientHeight-20)/h));
    const col=Math.floor(i/rows), row=i%rows;
    return {x:16+col*w, y:16+row*h};
  },
  async render(){
    const layer=document.getElementById('icons-layer');
    layer.innerHTML='';
    let entries=[];
    try{ entries=await fsCore.readdir('/Desktop'); }catch(e){}
    let i=0;
    for(const en of entries){
      const el=B.el('div','dicon');
      el.dataset.name=en.name; el.dataset.path=en.path; el.dataset.dir=en.isDirectory?'1':'';
      let p=this.pos[en.name];
      if(!p || p.x>layer.clientWidth-60 || p.y>layer.clientHeight-60){ p=this.autoSlot(i); this.pos[en.name]=p; }
      el.style.left=p.x+'px'; el.style.top=p.y+'px';
      el.innerHTML=`<div class="di-ic">${iconForFile(en.name,en.isDirectory)}</div><div class="di-name">${B.esc(en.name)}</div>`;
      layer.appendChild(el);
      this._wire(el, en);
      i++;
    }
    this.save();
  },
  _wire(el, en){
    const layer=document.getElementById('icons-layer');
    const path=en.path, isDir=en.isDirectory;
    /* 预加载拖出数据（严禁在 dragstart 里异步） */
    const preload=()=>{ if(!isDir) preloadDragFile(path); };
    el.addEventListener('mouseenter', preload);
    el.addEventListener('pointerdown', preload);
    /* --- HTML5 原生拖拽（鼠标：内部移动 + 拖出浏览器） --- */
    el.draggable=true;
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/benthos-icon', el.dataset.name);
      e.dataTransfer.effectAllowed='copyMove';
      const rec=dragCache.get(path);
      if(!isDir && rec){
        try{ e.dataTransfer.items.add(rec.file); }catch(err){}
        try{ e.dataTransfer.setData('DownloadUrl', `${mimeOf(en.name)}:${en.name}:${rec.url}`); }catch(err){}
      }
      el.classList.add('dragging');
      Desktop._dragIcon=el;
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      B.$$('.dicon.drop-hint').forEach(d=>d.classList.remove('drop-hint'));
      Desktop._dragIcon=null;
      if(!isDir) scheduleRevoke(path);
    });
    /* 点击打开（单击），选中 */
    el.addEventListener('click', e=>{
      if(Desktop._suppressedClick){ Desktop._suppressedClick=false; return; }
      B.$$('.dicon.sel').forEach(d=>d.classList.remove('sel'));
      el.classList.add('sel');
      openPath(path, {from:'desktop'});
    });
    el.addEventListener('contextmenu', e=>{
      e.preventDefault(); e.stopPropagation();
      if(!el.classList.contains('sel')){ B.$$('.dicon.sel').forEach(d=>d.classList.remove('sel')); el.classList.add('sel'); }
      const selPaths=B.$$('.dicon.sel').map(d=>d.dataset.path);
      Menu.show(e.clientX, e.clientY, iconMenuItems(path, isDir, selPaths, '/Desktop'));
    });
    /* --- 触摸拖拽（原生 DnD 在触屏不可用） --- */
    let tInfo=null;
    el.addEventListener('touchstart', e=>{
      if(e.touches.length!==1) return;
      const t=e.touches[0];
      tInfo={sx:t.clientX, sy:t.clientY, ox:parseFloat(el.style.left), oy:parseFloat(el.style.top), moved:false, timer:setTimeout(()=>{},0)};
    }, {passive:true});
    el.addEventListener('touchmove', e=>{
      if(!tInfo) return;
      const t=e.touches[0];
      const dx=t.clientX-tInfo.sx, dy=t.clientY-tInfo.sy;
      if(!tInfo.moved && Math.hypot(dx,dy)<10) return;
      tInfo.moved=true;
      e.preventDefault();
      el.style.transition='none';
      el.style.left=B.clamp(tInfo.ox+dx, -30, layer.clientWidth-50)+'px';
      el.style.top=B.clamp(tInfo.oy+dy, -10, layer.clientHeight-40)+'px';
      const under=document.elementFromPoint(t.clientX, t.clientY);
      const tgt=under && under.closest('.dicon');
      B.$$('.dicon.drop-hint').forEach(d=>d.classList.remove('drop-hint'));
      if(tgt && tgt!==el && tgt.dataset.dir) tgt.classList.add('drop-hint');
    }, {passive:false});
    el.addEventListener('touchend', async e=>{
      if(!tInfo) return;
      const moved=tInfo.moved;
      const t=e.changedTouches[0];
      tInfo=null;
      el.style.transition='';
      if(!moved){ return; } /* click 事件会处理打开 */
      Desktop._suppressedClick=true;
      const under=document.elementFromPoint(t.clientX, t.clientY);
      const tgt=under && under.closest('.dicon');
      B.$$('.dicon.drop-hint').forEach(d=>d.classList.remove('drop-hint'));
      if(tgt && tgt!==el && tgt.dataset.dir){
        /* 移入文件夹 */
        try{
          const to=B.join(tgt.dataset.path, en.name);
          await fsCore.rename(path, to);
          delete this.pos[en.name];
          Toast.show(`已移入 ${tgt.dataset.name}`);
        }catch(err){ Toast.show(err.message,'err'); }
        return;
      }
      /* 网格吸附 */
      if(S.get('iconGridSnap')){
        const {w,h}=this.cell();
        const nx=Math.round((parseFloat(el.style.left)-16)/w)*w+16;
        const ny=Math.round((parseFloat(el.style.top)-16)/h)*h+16;
        el.style.left=B.clamp(nx,8,layer.clientWidth-70)+'px';
        el.style.top=B.clamp(ny,8,layer.clientHeight-60)+'px';
      }
      this.pos[en.name]={x:parseFloat(el.style.left), y:parseFloat(el.style.top)};
      this.save();
    });
  }
};

/* 桌面/文件通用右键条目 */
function iconMenuItems(path, isDir, selPaths, cwd){
  const multi=selPaths.length>1;
  const items=[
    {label:'打开', icon:'openext', fn:()=>openPath(path)},
  ];
  if(!isDir && !multi){
    items.push({label:'打开方式', icon:'box', sub: openWithSub(path)});
  }
  items.push('-');
  if(!multi){
    items.push({label:'重命名', icon:'edit', fn:()=>renameFlow(path, cwd)});
    items.push({label:'复制', icon:'copy', key:'Ctrl+C', fn:()=>Clip.set('copy', selPaths)});
    items.push({label:'剪切', icon:'cut', key:'Ctrl+X', fn:()=>Clip.set('cut', selPaths)});
    items.push('-');
    items.push({label:'导出 / 下载', icon:'download', fn:async()=>{ for(const p of selPaths) await exportPath(p); }});
    if(!isDir && IMG_EXT.includes(B.ext(path))){
      items.push({label:'设为桌面壁纸', icon:'wallpaper', fn:async()=>{ S.set('wallpaper','file:'+path); await Wallpaper.apply(); }});
    }
  } else {
    items.push({label:`导出 ${selPaths.length} 项`, icon:'download', fn:async()=>{ for(const p of selPaths) await exportPath(p); }});
  }
  items.push('-');
  items.push({label:multi?`删除 ${selPaths.length} 项`:'删除', icon:'trash', danger:true, key:'Del', fn:()=>deleteFlow(selPaths)});
  return items;
}
function openWithSub(path){
  const st={name:B.base(path), path, isDirectory:false};
  const list=[];
  for(const id in APPS){
    const a=APPS[id];
    if(a.accepts && a.accepts(st)) list.push({label:a.name, icon:a.icon, fn:()=>openApp(id,{path})});
  }
  if(!list.length) list.push({label:'无可用应用', icon:'warn', disabled:true});
  return list;
}
async function deleteFlow(paths){
  const ok=await Dlg.confirm(`确定删除 ${paths.length>1?paths.length+' 个项目':B.base(paths[0])} 吗？此操作不可撤销。`, {danger:true, ok:'删除'});
  if(!ok) return;
  for(const p of paths){
    try{ await fsCore.rm(p,{recursive:true}); }
    catch(e){ Toast.show(e.message,'err'); }
  }
}
async function renameFlow(path, cwd){
  const old=B.base(path);
  const nv=await Dlg.prompt('重命名', old, {ok:'重命名'});
  if(!nv || nv===old) return;
  try{
    await fsCore.rename(path, B.join(B.dirOf(path), nv));
    if(cwd==='/Desktop' && Desktop.pos[old]){ Desktop.pos[nv]=Desktop.pos[old]; delete Desktop.pos[old]; Desktop.save(); }
  }catch(e){ Toast.show(e.message,'err'); }
}

/* ================================================================
   本地文件夹挂载（File System Access API）
   ================================================================ */
const Mounts = {
  supported: typeof window.showDirectoryPicker === 'function',
  _ids: new Map(), /* point -> id */
  async add(){
    if(!this.supported){
      Toast.show('当前浏览器不支持文件夹挂载（需要 Chrome / Edge 的 File System Access API）', 'warn', 5200);
      return;
    }
    try{
      const handle = await window.showDirectoryPicker({mode:'readwrite'});
      await this.mountHandle(handle);
      Toast.show(`已挂载本地文件夹「${handle.name}」`);
      return handle;
    }catch(e){ if(e.name!=='AbortError') Toast.show('挂载失败：'+e.message,'err'); }
  },
  async mountHandle(handle){
    let point = normPath('/mnt/local/'+handle.name);
    let n=2;
    while(VFS.mounts.some(m=>m.point===point)){ point=normPath(`/mnt/local/${handle.name}-${n}`); n++; }
    const id='mnt'+B.uid();
    const backend=new HandleBackend(handle, 'local:'+handle.name);
    VFS.add(point, backend, {label:handle.name, local:true, id});
    this._ids.set(point, id);
    await meta.putHandle(id, {name:handle.name, handle, point});
    fsEmit('/mnt/local');
    return point;
  },
  async eject(point){
    const m=VFS.mounts.find(x=>x.point===normPath(point));
    if(!m) return;
    VFS.remove(point);
    const id=this._ids.get(point) || m.id;
    if(id) await meta.delHandle(id);
    this._ids.delete(point);
    fsEmit('/mnt/local');
    Toast.show('已卸载 '+B.base(point)+'（本地文件未被删除）');
  },
  async restore(){
    const recs=await meta.getHandles();
    const pending=[];
    for(const r of recs){
      try{
        const perm = await r.handle.queryPermission({mode:'readwrite'});
        if(perm==='granted'){
          let point = normPath('/mnt/local/'+r.name);
          let n=2;
          while(VFS.mounts.some(m=>m.point===point)){ point=normPath(`/mnt/local/${r.name}-${n}`); n++; }
          VFS.add(point, new HandleBackend(r.handle,'local:'+r.name), {label:r.name, local:true, id:r.id});
          this._ids.set(point, r.id);
        } else pending.push(r);
      }catch(e){ pending.push(r); }
    }
    if(pending.length) this._askRestore(pending);
  },
  _askRestore(pending){
    const card=document.getElementById('notify-card');
    const names=pending.map(p=>B.esc(p.name)).join('、');
    card.innerHTML=`
      <div class="nc-title">${icon('mount',17)}<span>本地挂载点需要重新授权</span></div>
      <div class="nc-body">检测到上次会话挂载的文件夹：${names}。浏览器要求用户手势确认后才能恢复读写权限。</div>
      <div class="nc-btns">
        <button class="btn small" data-act="forget">忘记</button>
        <button class="btn small primary" data-act="remount">重新挂载</button>
      </div>`;
    card.classList.add('show');
    card.querySelector('[data-act="remount"]').onclick=async()=>{
      card.classList.remove('show');
      for(const r of pending){
        try{
          const p=await r.handle.requestPermission({mode:'readwrite'});
          if(p==='granted') await this.mountHandle(r.handle);
        }catch(e){}
      }
    };
    card.querySelector('[data-act="forget"]').onclick=async()=>{
      card.classList.remove('show');
      for(const r of pending) await meta.delHandle(r.id);
    };
  }
};

            <button class="ej" data-eject="${m.point}" title="卸载（不删除本地文件）">${icon('eject',13)}</button></div>`;
        });
      }
      h+=`<div class="fe-nav" data-act="mount" style="color:var(--acc)">${icon('plus',16)}<span>挂载本地文件夹</span></div>`;
      side.innerHTML=h;
      side.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>nav(el.dataset.nav));
      side.querySelectorAll('[data-eject]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); Mounts.eject(el.dataset.eject).then(renderSide); });
      const mb=side.querySelector('[data-act=mount]');
      if(mb) mb.onclick=async()=>{ await Mounts.add(); renderSide(); nav('/mnt/local'); };
    }

    /* ---------- 面包屑 ---------- */
    function renderCrumb(){
      const c=$('[data-role=crumb]');
      const segs=st.path.split('/').filter(Boolean);
      let h=`<span class="cb" data-go="/">⌂ 根目录</span>`;
      let acc='';
      segs.forEach(s=>{
        acc+='/'+s;
        h+=`<span class="cb-sep">/</span><span class="cb" data-go="${acc}">${B.esc(s)}</span>`;
      });
      c.innerHTML=h;
      c.querySelectorAll('.cb').forEach(el=>el.onclick=()=>nav(el.dataset.go));
      c.scrollLeft=c.scrollWidth;
    }

    /* ---------- 列表头（详细信息视图，列宽可拖拽） ---------- */
    function renderHead(){
      headEl.style.display = st.view==='detail' ? 'flex' : 'none';
      if(st.view!=='detail') return;
      headEl.innerHTML='';
      Object.entries(FE_COLS_DEF).forEach(([key,def])=>{
        const col=B.el('div','fe-col');
        col.style.width=cols[key]+'px';
        const arr = st.sort.key===key ? (st.sort.dir>0?'▲':'▼') : '';
        col.innerHTML=`<span>${def.label}</span><span class="arr">${arr}</span><div class="fe-colrz"></div>`;
        col.onclick=e=>{
          if(e.target.classList.contains('fe-colrz')) return;
          if(st.sort.key===key) st.sort.dir*=-1; else { st.sort.key=key; st.sort.dir= key==='name'?1:-1; }
          localStorage.setItem('fe-sortkey',st.sort.key); localStorage.setItem('fe-sortdir',st.sort.dir);
          renderHead(); renderList();
        };
        const rz=col.querySelector('.fe-colrz');
        rz.addEventListener('pointerdown', e=>{
          e.stopPropagation(); e.preventDefault();
          rz.setPointerCapture(e.pointerId);
          const sx=e.clientX, sw=cols[key];
          const mv=ev=>{ cols[key]=Math.max(64, sw+ev.clientX-sx); col.style.width=cols[key]+'px'; };
          const up=()=>{ rz.removeEventListener('pointermove',mv); rz.removeEventListener('pointerup',up);
            localStorage.setItem('fe-cols', JSON.stringify(cols)); };
          rz.addEventListener('pointermove',mv); rz.addEventListener('pointerup',up);
        });
        headEl.appendChild(col);
      });
    }

    /* ---------- 排序 ---------- */
    function sortEntries(list){
      const {key,dir}=st.sort;
      return [...list].sort((a,b)=>{
        if(a.isDirectory!==b.isDirectory) return a.isDirectory?-1:1;
        let va,vb;
        if(key==='name') return B.natural(a.name,b.name)*dir;
        if(key==='mtime'){ va=a.mtime||0; vb=b.mtime||0; }
        else if(key==='size'){ va=a.isDirectory?(a._du||0):(a.size||0); vb=b.isDirectory?(b._du||0):(b.size||0); }
        else { return typeLabel(a).localeCompare(typeLabel(b),'zh')*dir; }
        return (va-vb)*dir;
      });
    }

    /* ---------- 缩略图 ---------- */
    const thumbCache=new Map();
    function thumbURL(en){
      if(!IMG_EXT.includes(B.ext(en.name))) return null;
      if(en.size!=null && en.size>8*1024*1024) return null;
      if(thumbCache.has(en.path)) return thumbCache.get(en.path);
      thumbCache.set(en.path, null);
      fs.getFile(en.path).then(f=>{
        const u=URL.createObjectURL(f);
        thumbCache.set(en.path,u);
        st._thumbUrls.push(u);
        rowsEl.querySelectorAll(`[data-thumb="${CSS.escape(en.path)}"]`).forEach(img=>{ img.src=u; });
      }).catch(()=>{});
      return null;
    }

    /* ---------- 主列表渲染 ---------- */
    function renderList(){
      if(st.abort){ st.abort.abort(); }
      st.abort=new AbortController();
      st._thumbUrls&&st._thumbUrls.forEach(u=>URL.revokeObjectURL(u));
      st._thumbUrls=[];
      rowsEl.className = st.view==='grid' ? 'fe-grid' : 'fe-rows';
      const list=sortEntries(st.entries.filter(en=>!st.query || en.name.toLowerCase().includes(st.query.toLowerCase())));
      const emptyEl=$('[data-role=empty]');
      emptyEl.style.display = list.length? 'none':'grid';
      const frag=document.createDocumentFragment();
      if(st.view==='detail'){
        list.forEach(en=>{
          const row=B.el('div','fe-row'+(st.sel.has(en.path)?' sel':''));
          row.dataset.path=en.path; row.dataset.dir=en.isDirectory?'1':'';
          const isImg=IMG_EXT.includes(B.ext(en.name));
          const th = isImg?`<img class="th" data-thumb="${B.esc(en.path)}" src="" alt="">`:'';
          row.innerHTML=`
            <div class="fe-cell" style="width:${cols.name}px">${th||iconForFile(en.name,en.isDirectory,17)}<span class="fname">${B.esc(en.name)}</span></div>
            <div class="fe-cell mut" style="width:${cols.mtime}px">${B.fmtDate(en.mtime)}</div>
            <div class="fe-cell mut" style="width:${cols.type}px">${typeLabel(en)}</div>
            <div class="fe-cell mut" style="width:${cols.size}px" data-size>${en.isDirectory?'…':B.fmtBytes(en.size)}</div>`;
          frag.appendChild(row);
          wireRow(row, en, list);
        });
      } else if(st.view==='list'){
        list.forEach(en=>{
          const row=B.el('div','fe-row'+(st.sel.has(en.path)?' sel':''));
          row.dataset.path=en.path; row.dataset.dir=en.isDirectory?'1':'';
          row.innerHTML=`<div class="fe-cell" style="width:${cols.name}px">${iconForFile(en.name,en.isDirectory,17)}<span class="fname">${B.esc(en.name)}</span></div>
            <div class="fe-cell mut" style="width:${cols.size}px">${en.isDirectory?'':B.fmtBytes(en.size)}</div>`;
          frag.appendChild(row);
          wireRow(row, en, list);
        });
      } else {
        list.forEach(en=>{
          const it=B.el('div','fe-gitem'+(st.sel.has(en.path)?' sel':''));
          it.dataset.path=en.path; it.dataset.dir=en.isDirectory?'1':'';
          const isImg=IMG_EXT.includes(B.ext(en.name));
          it.innerHTML=`<div class="gi">${isImg?`<img data-thumb="${B.esc(en.path)}" src="">`:iconForFile(en.name,en.isDirectory)}</div><span>${B.esc(en.name)}</span>`;
          frag.appendChild(it);
          wireRow(it, en, list);
        });
      }
      rowsEl.innerHTML='';
      rowsEl.appendChild(frag);
      list.forEach(en=>{ if(st.view!=='list' && IMG_EXT.includes(B.ext(en.name))) thumbURL(en); });
      /* 文件夹真实大小：异步并行计算后回填 */
      if(st.view==='detail'){
        list.filter(e=>e.isDirectory).forEach(en=>{
          fsCore.du(en.path, st.abort.signal).then(sz=>{
            en._du=sz;
            const row=rowsEl.querySelector(`[data-path="${CSS.escape(en.path)}"] [data-size]`);
            if(row) row.textContent=B.fmtBytes(sz);
          }).catch(()=>{
            const row=rowsEl.querySelector(`[data-path="${CSS.escape(en.path)}"] [data-size]`);
            if(row) row.textContent='—';
          });
        });
      }
      renderStatus();
    }

    function renderStatus(){
      const dirs=st.entries.filter(e=>e.isDirectory).length;
      const files=st.entries.length-dirs;
      const sz=st.entries.reduce((a,e)=>a+(e.size||0),0);
      $('[data-role=status]').innerHTML=`<span class="dot"></span><span>${B.esc(st.path)}</span><span>${dirs} 个文件夹 · ${files} 个文件</span><span>${B.fmtBytes(sz)}</span>${st.sel.size?`<span style="color:var(--acc)">已选 ${st.sel.size} 项</span>`:''}`;
    }

    /* ---------- 行交互 ---------- */
    function wireRow(row, en, list){
      row.addEventListener('click', e=>{
        if(e.target.closest('input')) return;
        if(e.ctrlKey||e.metaKey){ st.sel.has(en.path)?st.sel.delete(en.path):st.sel.add(en.path); st._anchor=en.path; }
        else if(e.shiftKey && st._anchor){
          const idxs=list.map(x=>x.path);
          const a=idxs.indexOf(st._anchor), b=idxs.indexOf(en.path);
          if(a>-1&&b>-1) idxs.slice(Math.min(a,b),Math.max(a,b)+1).forEach(p=>st.sel.add(p));
        }
        else { st.sel=new Set([en.path]); st._anchor=en.path; }
        syncSel();
      });
      row.addEventListener('dblclick', ()=>openPath(en.path,{from:'explorer', explorerWin:win, explorerNav:nav}));
      row.addEventListener('contextmenu', e=>{
        e.preventDefault(); e.stopPropagation();
        if(!st.sel.has(en.path)){ st.sel=new Set([en.path]); syncSel(); }
        Menu.show(e.clientX, e.clientY, iconMenuItems(en.path, en.isDirectory, [...st.sel], st.path).concat([
          '-', {label:'复制路径', icon:'copy', fn:()=>{ try{ navigator.clipboard.writeText(en.path); }catch(err){} Toast.show('路径已复制：'+en.path); }}
        ]));
      });
      /* 拖出浏览器 + 内部移动 */
      row.draggable=true;
      row.addEventListener('mouseenter', ()=>{ if(!en.isDirectory && st.sel.size<=1) preloadDragFile(en.path); });
      row.addEventListener('dragstart', e=>{
        e.stopPropagation();
        if(!st.sel.has(en.path)){ st.sel=new Set([en.path]); syncSel(); }
        e.dataTransfer.setData('text/benthos-paths', JSON.stringify([...st.sel]));
        e.dataTransfer.effectAllowed='copyMove';
        if(!en.isDirectory && st.sel.size===1){
          const rec=dragCache.get(en.path);
          if(rec){ try{ e.dataTransfer.items.add(rec.file); }catch(err){}
            try{ e.dataTransfer.setData('DownloadUrl', `${mimeOf(en.name)}:${en.name}:${rec.url}`); }catch(err){} }
        }
      });
      row.addEventListener('dragend', ()=>{ if(!en.isDirectory) scheduleRevoke(en.path); B.$$('.fe-row.drop-hint,.fe-gitem.drop-hint',rowsEl).forEach(r=>r.classList.remove('drop-hint')); });
      if(en.isDirectory){
        row.addEventListener('dragover', e=>{
          const types=e.dataTransfer.types;
          if(types && (types.includes('text/benthos-paths')||types.includes('text/benthos-icon')||[...types].some(t=>t==='Files'))){
            e.preventDefault(); e.stopPropagation(); row.classList.add('drop-hint');
          }
        });
        row.addEventListener('dragleave', ()=>row.classList.remove('drop-hint'));
        row.addEventListener('drop', async e=>{
          e.preventDefault(); e.stopPropagation(); row.classList.remove('drop-hint');
          const pathsJson=e.dataTransfer.getData('text/benthos-paths');
          const iconName=e.dataTransfer.getData('text/benthos-icon');
          try{
            if(pathsJson){
              for(const p of JSON.parse(pathsJson)){
                if(p===en.path || en.path.startsWith(p+'/')) continue;
                const target=B.join(en.path, B.base(p));
                if(await fsCore.exists(target)) { Toast.show(B.base(p)+' 已存在于目标文件夹','warn'); continue; }
                if(e.dataTransfer.files && e.dataTransfer.files.length && e.ctrlKey) await fsCore.copy(p,target);
                else await fsCore.rename(p, target);
              }
            } else if(iconName){
              const from=B.join('/Desktop', iconName);
              if(await fsCore.exists(from)) await fsCore.rename(from, B.join(en.path, iconName));
            } else {
              await importDataTransfer(e.dataTransfer, en.path);
            }
          }catch(err){ Toast.show(err.message,'err'); }
        });
      }
    }
    function syncSel(){
      rowsEl.querySelectorAll('[data-path]').forEach(r=>r.classList.toggle('sel', st.sel.has(r.dataset.path)));
      renderStatus();
    }

    /* ---------- 导航 ---------- */
    async function nav(p, pushHist=true){
      p=normPath(p);
      /* 目标是文件 → 打开文件 */
      try{
        const s=await fsCore.stat(p);
        if(!s.isDirectory){ openPath(p, {from:'explorer'}); return; }
      }catch(e){}
      if(pushHist){ st.hist=st.hist.slice(0,st.hidx+1); st.hist.push(p); st.hidx=st.hist.length-1; }
      st.path=p; st.sel=new Set(); st.query=''; $('[data-role=search]').value='';
      await load();
    }
    async function load(){
      renderCrumb(); renderSide(); renderHead();
      try{
        st.entries=await fsCore.readdir(st.path, {withFileTypes:true});
      }catch(e){
        Toast.show('无法打开目录：'+e.message,'err');
        st.entries=[];
      }
      renderList();
      win.el.querySelector('.wt-title').textContent=`文件资源管理器 · ${st.path}`;
    }
    nav(st.path, true);

    /* ---------- 框选（鼠标恒生效；触屏由「框选模式」开关启用） ---------- */
    attachMarquee(st, scrollEl, rowsEl, ()=>{ syncSel(); renderStatus(); });

    /* ---------- 空白区右键 / 拖入导入 ---------- */
    scrollEl.addEventListener('contextmenu', e=>{
      if(e.target.closest('[data-path]')) return;
      e.preventDefault();
      st.sel=new Set(); syncSel();
      Menu.show(e.clientX, e.clientY, folderMenuItems(st.path, ()=>load()));
    });
    scrollEl.addEventListener('dragover', e=>{
      const t=e.dataTransfer.types;
      if(t && ([...t].includes('Files') || t.includes('text/benthos-paths') || t.includes('text/benthos-icon'))) e.preventDefault();
    });
    scrollEl.addEventListener('drop', async e=>{
      e.preventDefault();
      const pathsJson=e.dataTransfer.getData('text/benthos-paths');
      const iconName=e.dataTransfer.getData('text/benthos-icon');
      try{
        if(pathsJson){
          for(const p of JSON.parse(pathsJson)){
            if(B.dirOf(p)===st.path) continue;
            const target=B.join(st.path,B.base(p));
            if(await fsCore.exists(target)) continue;
            await fsCore.rename(p,target);
          }
        } else if(iconName){
          const from=B.join('/Desktop',iconName);
          if(await fsCore.exists(from)) await fsCore.rename(from, B.join(st.path,iconName));
        } else {
          await importDataTransfer(e.dataTransfer, st.path);
        }
      }catch(err){ Toast.show(err.message,'err'); }
    });
    /* 桌面文件拖到窗口标题栏 = 移动到当前目录 */
    win.el.querySelector('.wt-bar').addEventListener('dragover', e=>{
      if(e.dataTransfer.types && (e.dataTransfer.types.includes('text/benthos-icon')||e.dataTransfer.types.includes('text/benthos-paths'))) e.preventDefault();
    });
    win.el.querySelector('.wt-bar').addEventListener('drop', async e=>{
      e.preventDefault();
      const iconName=e.dataTransfer.getData('text/benthos-icon');
      const pathsJson=e.dataTransfer.getData('text/benthos-paths');
      try{
        if(iconName){ const from=B.join('/Desktop',iconName); if(await fsCore.exists(from)) await fsCore.rename(from,B.join(st.path,iconName)); }
        else if(pathsJson){ for(const p of JSON.parse(pathsJson)){ const t=B.join(st.path,B.base(p)); if(!(await fsCore.exists(t))) await fsCore.rename(p,t); } }
      }catch(err){ Toast.show(err.message,'err'); }
    });

    /* ---------- 工具条 ---------- */
    win.body.querySelector('[data-act=back]').onclick=()=>{ if(st.hidx>0){ st.hidx--; nav(st.hist[st.hidx], false); } };
    win.body.querySelector('[data-act=fwd]').onclick=()=>{ if(st.hidx<st.hist.length-1){ st.hidx++; nav(st.hist[st.hidx], false); } };
    win.body.querySelector('[data-act=up]').onclick=()=>{ if(st.path!=='/') nav(B.dirOf(st.path)); };
    B.$$('[data-view]',win.body).forEach(b=>b.onclick=()=>{
      st.view=b.dataset.view; localStorage.setItem('fe-view',st.view);
      B.$$('[data-view]',win.body).forEach(x=>x.classList.toggle('on',x===b));
      renderHead(); renderList();
    });
    win.body.querySelector(`[data-view=${st.view}]`).classList.add('on');
    const mBtn=win.body.querySelector('[data-act=marquee]');
    mBtn.onclick=()=>{ st.marqueeMode=!st.marqueeMode; mBtn.classList.toggle('on',st.marqueeMode); };
    win.body.querySelector('[data-act=newfolder]').onclick=async()=>{
      const name=await Dlg.prompt('新建文件夹','新建文件夹');
      if(!name) return;
      try{ await fsCore.mkdir(B.join(st.path,name)); }catch(e){ Toast.show(e.message,'err'); }
    };
    win.body.querySelector('[data-act=newfile]').onclick=async()=>{
      const name=await Dlg.prompt('新建文件','新建文件.txt');
      if(!name) return;
      try{ await fsCore.writeFile(B.join(st.path,name),''); openPath(B.join(st.path,name)); }catch(e){ Toast.show(e.message,'err'); }
    };
    win.body.querySelector('[data-act=import]').onclick=()=>{
      const inp=document.getElementById('import-input');
      inp.onchange=async()=>{
        if(!inp.files.length) return;
        const files=[...inp.files];
        for(const f of files){
          const name=await uniqueName(st.path,f.name);
          await fsCore.writeFile(B.join(st.path,name), f);
        }
        Toast.show(`已导入 ${files.length} 个文件`);
        inp.value='';
      };
      inp.click();
    };
    win.body.querySelector('[data-act=side]').onclick=()=> $('[data-role=side]').classList.toggle('open');
    /* 搜索：当前目录即时过滤；Enter → 递归全局搜索 */
    const searchInp=$('[data-role=search]');
    searchInp.addEventListener('input', B.debounce(()=>{ st.query=searchInp.value.trim(); renderList(); }, 160));
    searchInp.addEventListener('keydown', async e=>{
      if(e.key!=='Enter' || searchInp.value.trim().length<2) return;
      const q=searchInp.value.trim().toLowerCase();
      st.query=''; renderList();
      const results=[];
      const ctrl=new AbortController();
      try{
        await walk(st.path, {signal:ctrl.signal, cap:400, fn:e2=>{
          if(e2.name.toLowerCase().includes(q)) results.push(e2);
        }});
      }catch(err){}
      if(!results.length){ Toast.show('未找到匹配项','warn'); return; }
      st.entries=results.map(r=>({...r, isDirectory:false, _searchPath:r.path}));
      /* 用搜索结果覆盖显示（带路径列） */
      st.entries=await Promise.all(results.slice(0,200).map(async r=>{ try{ return await fsCore.stat(r.path); }catch(e){ return r; } }));
      rowsEl.className='fe-rows';
      renderList();
      Toast.show(`全局搜索完成：${results.length} 个结果`);
    });

    /* ---------- 键盘快捷键 ---------- */
    win.body.tabIndex=0;
    win.el.addEventListener('pointerdown', e=>{
      const t=e.target;
      if(!(t.closest('input')||t.closest('textarea')||t.closest('[contenteditable]')||t.closest('select'))) setTimeout(()=>win.body.focus(),0);
    }, true);
    win.el.addEventListener('keydown', async e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable) return;
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){ e.preventDefault(); st.entries.forEach(en=>st.sel.add(en.path)); syncSel(); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){ Clip.set('copy',[...st.sel]); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='x'){ Clip.set('cut',[...st.sel]); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){ await Clip.paste(st.path); }
      else if(e.key==='Delete'){ if(st.sel.size) deleteFlow([...st.sel]); }
      else if(e.key==='F2' && st.sel.size===1){ renameFlow([...st.sel][0], st.path); }
      else if(e.key==='Backspace'){ e.preventDefault(); if(st.path!=='/') nav(B.dirOf(st.path)); }
    });

    /* ---------- 变更监听 ---------- */
    const unwatch=fs.onChange(B.debounce(dir=>{
      if(dir===st.path || B.dirOf(st.path)===dir || dir==='/mnt/local') load();
    }, 120));
    const prevClose=win.state.onClose;
    win.state.onClose=()=>{ unwatch(); if(st.abort) st.abort.abort(); st._thumbUrls&&st._thumbUrls.forEach(u=>URL.revokeObjectURL(u)); prevClose&&prevClose(); };
    win.state.nav=nav;
    win.state.getPath=()=>st.path;
    return {};
  }
});

/* 递归遍历（可中止 / 结果上限） */
async function walk(path, {signal, cap=2000, fn, skipMounts=true}={}){
  const stack=[path]; let n=0;
  while(stack.length){
    if(signal&&signal.aborted) throw fsErr('EINTR','已中止',path);
    const cur=stack.pop();
    let list;
    try{ list=await fsCore.readdir(cur,{withFileTypes:true}); }catch(e){ continue; }
    for(const en of list){
      if(signal&&signal.aborted) throw fsErr('EINTR','已中止',cur);
      if(en.isMount && skipMounts) continue;
      fn&&fn(en);
      if(++n>cap) return;
      if(en.isDirectory) stack.push(en.path);
    }
  }
}

/* 文件夹空白区右键 */
function folderMenuItems(dir, refresh){
  const isRoot=dir==='/';
  return [
    {label:'刷新', icon:'refresh', fn:refresh},
    '-',
    {label:'新建文件夹', icon:'plus', fn:async()=>{ const n=await Dlg.prompt('新建文件夹','新建文件夹'); if(n){ try{ await fsCore.mkdir(B.join(dir,n)); }catch(e){Toast.show(e.message,'err');} } }},
    {label:'新建文本文件', icon:'fileTxt', fn:async()=>{ const n=await Dlg.prompt('新建文件','新建文件.txt'); if(n){ await fsCore.writeFile(B.join(dir,n),''); openPath(B.join(dir,n)); } }},
    {label:'上传文件到此目录', icon:'import', fn:()=>{ const inp=document.getElementById('import-input');
      inp.onchange=async()=>{ for(const f of inp.files){ const nm=await uniqueName(dir,f.name); await fsCore.writeFile(B.join(dir,nm),f); } Toast.show('上传完成'); inp.value=''; }; inp.click(); }},

/* ================================================================
   框选引擎 —— 鼠标/触摸通用 · AABB · 边缘自动滚动 · 完整销毁清理
   ================================================================ */
function attachMarquee(st, scrollEl, itemsEl, onChange){
  let active=false, box=null, startPt=null, ctrlAdd=false, baseSel=null;
  let raf=0, lastPt=null;

  function begin(e){
    /* 仅在空白处启动 */
    if(e.target.closest('[data-path]') || e.target.closest('input') || e.target.closest('button')) return;
    if(e.button===2) return;
    /* 触摸：仅在框选模式下启动 */
    if(e.pointerType==='touch' && !st.marqueeMode) return;
    active=true;
    ctrlAdd=e.ctrlKey||e.metaKey;
    baseSel=new Set(st.sel);
    const p=B.getClientXY(e);
    startPt={x:p.x, y:p.y}; lastPt={x:p.x, y:p.y};
    box=B.el('div','marquee');
    scrollEl.appendChild(box);
    if(!ctrlAdd){ st.sel=new Set(); }
    document.addEventListener('pointermove', move, {passive:false});
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
    scrollEl.addEventListener('touchmove', touchBlock, {passive:false});
    loop();
  }
  function touchBlock(e){ if(active) e.preventDefault(); }
  function move(e){
    if(!active) return;
    if(e.cancelable) e.preventDefault();
    const p=B.getClientXY(e);
    lastPt={x:p.x, y:p.y};
  }
  function loop(){
    if(!active) return;
    const r=scrollEl.getBoundingClientRect();
    /* 40px 感应带边缘自动滚动 */
    const BAND=40, SPD=14;
    if(lastPt.y>r.bottom-BAND && lastPt.y<r.bottom+60) scrollEl.scrollTop+=SPD;
    else if(lastPt.y<r.top+BAND && lastPt.y>r.top-60) scrollEl.scrollTop-=SPD;
    if(lastPt.x>r.right-BAND) scrollEl.scrollLeft+=SPD;
    else if(lastPt.x<r.left+BAND) scrollEl.scrollLeft-=SPD;
    /* 坐标严格累加滚动偏移 */
    const x1=startPt.x - r.left + scrollEl.scrollLeft, y1=startPt.y - r.top + scrollEl.scrollTop;
    const x2=lastPt.x - r.left + scrollEl.scrollLeft, y2=lastPt.y - r.top + scrollEl.scrollTop;
    const bx=Math.min(x1,x2), by=Math.min(y1,y2), bw=Math.abs(x2-x1), bh=Math.abs(y2-y1);
    Object.assign(box.style,{left:bx+'px', top:by+'px', width:bw+'px', height:bh+'px'});
    if(bw>4||bh>4){
      /* AABB 碰撞判定 */
      const items=itemsEl.querySelectorAll('[data-path]');
      const selNow=ctrlAdd?new Set(baseSel):new Set();
      items.forEach(it=>{
        const ix=it.offsetLeft, iy=it.offsetTop, iw=it.offsetWidth, ih=it.offsetHeight;
        if(ix<bx+bw && ix+iw>bx && iy<by+bh && iy+ih>by) selNow.add(it.dataset.path);
      });
      st.sel=selNow;
      itemsEl.querySelectorAll('[data-path]').forEach(it=>it.classList.toggle('sel', st.sel.has(it.dataset.path)));
      onChange&&onChange();
    }
    raf=requestAnimationFrame(loop);
  }
  function end(){
    active=false;
    cancelAnimationFrame(raf);
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', end);
    scrollEl.removeEventListener('touchmove', touchBlock);
    if(box){ box.remove(); box=null; }
    onChange&&onChange();
  }
  scrollEl.addEventListener('pointerdown', begin);
}

/* ================================================================
   CDN 资源延迟加载（离线降级）
   ================================================================ */
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>res(src); s.onerror=()=>rej(new Error('脚本加载失败：'+src));
    document.head.appendChild(s);
  });
}
function loadCss(href){
  return new Promise(res=>{
    const l=document.createElement('link');
    l.rel='stylesheet'; l.href=href; l.onload=()=>res(); l.onerror=()=>res();
    document.head.appendChild(l);
  });
}
let _cmP=null;
function loadCodeMirror(){
  if(window.CodeMirror) return Promise.resolve(window.CodeMirror);
  if(_cmP) return _cmP;
  const base='https://cdn.jsdelivr.net/npm/codemirror@5.65.16';
  const css=[base+'/lib/codemirror.css', base+'/theme/material-darker.css', base+'/addon/fold/foldgutter.css'];
  const js=[base+'/lib/codemirror.js',
    base+'/addon/selection/active-line.js',
    base+'/addon/edit/matchbrackets.js', base+'/addon/edit/closebrackets.js',
    base+'/addon/edit/closetag.js', base+'/addon/edit/matchtags.js',
    base+'/addon/edit/trailing-space.js',
    base+'/addon/fold/foldcode.js', base+'/addon/fold/foldgutter.js',
    base+'/addon/fold/xml-fold.js', base+'/addon/fold/comment-fold.js',
    base+'/addon/search/searchcursor.js',
    base+'/mode/xml/xml.js', base+'/mode/javascript/javascript.js',
    base+'/mode/css/css.js', base+'/mode/htmlmixed/htmlmixed.js',
    base+'/mode/markdown/markdown.js'];
  _cmP = Promise.all(css.map(loadCss))
    .then(async ()=>{ for(const u of js) await loadScript(u); return window.CodeMirror; })

}
let _btP=null;

   ================================================================ */
function parseDelimited(text, delim){
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else if(c==='"') inQ=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur.replace(/\r$/,'')); rows.push(row); row=[]; cur=''; }
    else if(c==='\r'){}
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function serializeDelimited(rows, delim){
  return rows.map(r=>r.map(c=>{
    c=String(c??'');
    return (c.includes(delim)||c.includes('"')||c.includes('\n')) ? '"'+c.replace(/"/g,'""')+'"' : c;
  }).join(delim)).join('\n');
}

const ED_MODES = {
  htmlmixed:{label:'HTML', ext:'.html', mime:'text/html'},
  css:{label:'CSS', ext:'.css', mime:'text/css'},
  javascript:{label:'JavaScript', ext:'.js', mime:'text/javascript'},
  markdown:{label:'Markdown', ext:'.md', mime:'text/markdown'},
  'application/json':{label:'JSON', ext:'.json', mime:'application/json'},
  xml:{label:'XML / SVG', ext:'.xml', mime:'text/xml'},
};
function edModeForExt(e){
  if(['html','htm'].includes(e)) return 'htmlmixed';
  if(e==='css') return 'css';
  if(['js','mjs'].includes(e)) return 'javascript';
  if(e==='json') return 'application/json';
  if(['md','markdown'].includes(e)) return 'markdown';
  if(['xml','svg'].includes(e)) return 'xml';
  return 'htmlmixed';
}
function mdToHtml(src){
  let s=B.esc(src);
  s=s.replace(/```([\s\S]*?)```/g, (m,c)=>'<pre style="background:#0d2334;color:#9fe8d8;padding:10px;border-radius:6px;overflow:auto"><code>'+c+'</code></pre>');
  s=s.replace(/^######\s?(.+)$/gm,'<h6>$1</h6>').replace(/^#####\s?(.+)$/gm,'<h5>$1</h5>')
    .replace(/^####\s?(.+)$/gm,'<h4>$1</h4>').replace(/^###\s?(.+)$/gm,'<h3>$1</h3>')
    .replace(/^##\s?(.+)$/gm,'<h2>$1</h2>').replace(/^#\s?(.+)$/gm,'<h1>$1</h1>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code style="background:#0d2334;padding:1px 5px;border-radius:4px">$1</code>');
  s=s.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  s=s.replace(/^\d+\.\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/^---$/gm,'<hr>');
  s=s.replace(/\n{2,}/g,'</p><p>');
  return '<div style="font-family:sans-serif;max-width:760px;margin:0 auto;padding:24px;line-height:1.8"><p>'+s+'</p></div>';
}

      <div class="statusbar"><span class="dot"></span><span data-spos>行 1, 列 1</span><span data-ssel></span><span data-stot></span><span data-slang>HTML</span><span>UTF-8</span><div class="tb-sp"></div><span data-smsg style="color:var(--acc)"></span></div>`;
    const $=s=>win.body.querySelector(s);
    const ta=$('.ed-ta'), frame=$('[data-frame]'), veil=$('[data-veil]');
    const modeSel=$('[data-a=mode]');
    Object.entries(ED_MODES).forEach(([k,v])=>{ const o=document.createElement('option'); o.value=k; o.textContent=v.label; modeSel.appendChild(o); });
    modeSel.value=st.mode;
    const inputSel=$('[data-a=inputmode]');
    inputSel.value=S.get('editorInput')||'auto';

    async function initCM(){
      const pane=$('[data-edpane]');
      try{
        await loadCodeMirror();
      }catch(e){
        Toast.show('CodeMirror 加载失败（网络离线），已降级为纯文本编辑','warn',5000);
        ta.style.cssText='flex:1;width:100%;background:var(--bg1);color:var(--ink);border:none;outline:none;resize:none;padding:12px;font-family:var(--f-mono);font-size:13px';
        pane.style.display='flex';
        return;
      }
      const io=inputSel.value;
      const inputStyle = io==='pc' ? 'textarea' : io==='phone' ? 'contenteditable' : undefined;
      const cmOpts={
        lineNumbers:true, lineWrapping:true, styleActiveLine:true, showTrailingSpace:true,
        matchBrackets:true, autoCloseBrackets:true, matchTags:{bothTags:true}, autoCloseTags:true,
        foldGutter:true, gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
        theme:'material-darker', indentUnit:2, tabSize:2,
        extraKeys:{
          'Ctrl-S':()=>saveDoc(false), 'Cmd-S':()=>saveDoc(false),
          'Ctrl-F':()=>openFind(false), 'Cmd-F':()=>openFind(false),
          'Ctrl-H':()=>openFind(true), 'Cmd-Alt-F':()=>openFind(true),
          'Ctrl-Shift-F':()=>formatCode(), 'Shift-Ctrl-F':()=>formatCode(),
          'Ctrl-Enter':()=>runPreview(true), 'Cmd-Enter':()=>runPreview(true),
          'F3':()=>frNav(1),
        }
      };
      if(inputStyle) cmOpts.inputStyle=inputStyle;
      st.cm=window.CodeMirror.fromTextArea(ta, cmOpts);
      st.cm.setSize('100%','100%');
      st.cm.on('change', B.debounce(()=>{ runPreview(false); updStatus(); }, 700));
      st.cm.on('cursorActivity', updStatus);
      st.cm.on('change', ()=>{ frRefreshMarks(); });
      st.cm.setValue(st._initVal||'');
      if(st._initCursor) st.cm.setCursor(st._initCursor);
      st.cm.focus();
      updStatus(); runPreview(false);
    }
    function getVal(){ return st.cm?st.cm.getValue():ta.value; }
    function setVal(v){ if(st.cm) st.cm.setValue(v); else ta.value=v; }

    /* ---------- 状态栏 ---------- */
    function updStatus(){
      if(st.cm){
        const c=st.cm.getCursor();
        $('[data-spos]').textContent=`行 ${c.line+1}, 列 ${c.ch+1}`;
        const sel=st.cm.getSelection();
        $('[data-ssel]').textContent=sel?`已选 ${sel.length} 字符`:'';
        $('[data-stot]').textContent=`${st.cm.lineCount()} 行 · ${st.cm.getValue().length} 字符`;
      } else {
        const v=ta.value, pos=ta.selectionStart;
        const lines=v.slice(0,pos).split('\n');
        $('[data-spos]').textContent=`行 ${lines.length}, 列 ${lines[lines.length-1].length+1}`;
        $('[data-stot]').textContent=`${v.split('\n').length} 行 · ${v.length} 字符`;
      }
      $('[data-slang]').textContent=ED_MODES[st.mode]?ED_MODES[st.mode].label:st.mode;
    }

    /* ---------- 预览 ---------- */
    function previewDoc(){
      const code=getVal();
      switch(st.mode){
        case 'css': return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+code+'</style></head><body><div class="demo"><h1>CSS 预览</h1><p>示例段落 Example paragraph</p><button>按钮 Button</button> <a href="#">链接 Link</a><ul><li>列表项</li><li>列表项</li></ul></div></body></html>';
        case 'javascript': return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:monospace;padding:16px"><div id="out"></div><script>const __log=console.log;console.log=(...a)=>{__log(...a);const d=document.createElement("div");d.textContent=a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ");document.getElementById("out").appendChild(d);};<\/script><script>try{'+code+'}catch(e){console.log("错误: "+e.message)}<\/script></body></html>';
        case 'markdown': return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>'+mdToHtml(code)+'</body></html>';
        case 'application/json': {
          let pretty=code;
          try{ pretty=JSON.stringify(JSON.parse(code),null,2); }catch(e){}
          return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#0a1c2a;color:#9fe8d8;font-family:monospace;padding:16px"><pre>'+B.esc(pretty)+'</pre></body></html>';
        }
        case 'xml': return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#0a1c2a;color:#9fe8d8;font-family:monospace;padding:16px"><pre>'+B.esc(code)+'</pre></body></html>';
        default: return code;
      }
    }
    function runPreview(manual){
      const html=previewDoc();
      veil.classList.remove('hide');
      try{
        const doc=frame.contentDocument;
        doc.open(); doc.write(html); doc.close();
      }catch(e){
        if(st._pvUrl) URL.revokeObjectURL(st._pvUrl);
        st._pvUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));
        frame.src=st._pvUrl;
      }
      if(manual) flash('已运行');
    }
    frame.addEventListener('load', ()=>setTimeout(()=>veil.classList.add('hide'), 150));
    function flash(m){ const el=$('[data-smsg]'); el.textContent=m; setTimeout(()=>el.textContent='',2200); }

    /* ---------- 语言切换 ---------- */
    function setMode(m){
      st.mode=m; modeSel.value=m;
      if(st.cm) st.cm.setOption('mode', m);
      updStatus();
    }
    modeSel.onchange=()=>{ setMode(modeSel.value); runPreview(false); };

    /* ---------- 保存 ---------- */
    async function saveDoc(auto){
      let path=st.doc.path;
      if(!path){
        const ext=ED_MODES[st.mode]?ED_MODES[st.mode].ext:'.html';
        const n=await Dlg.prompt('保存到虚拟文件系统', (st.doc.baseName||'未命名')+ext, {ok:'保存'});
        if(!n) return;
        path=B.join(st.doc.saveDir||defaultSaveDir(), n);
        st.doc.path=path; st.doc.baseName=n;
      }
      try{
        await fsCore.writeFile(path, getVal());
        flash('已保存到 '+path);
        Desktop.render();
      }catch(e){ Toast.show('保存失败：'+e.message,'err'); }
    }

    /* ---------- 格式化 ---------- */
    async function formatCode(){
      try{ await loadBeautify(); }catch(e){ Toast.show('格式化组件加载失败（离线）','err'); return; }
      const opt={indent_size:2, indent_inner_html:true, wrap_line_length:120, max_preserve_newlines:2, end_with_newline:true};
      let out=null;
      try{
        if(st.mode==='htmlmixed') out=window.html_beautify(getVal(), opt);
        else if(st.mode==='css') out=window.css_beautify(getVal(), opt);
        else if(st.mode==='javascript'||st.mode==='application/json') out=window.js_beautify(getVal(), opt);
        else { Toast.show('当前语言暂不支持格式化','warn'); return; }
      }catch(e){ Toast.show('格式化出错：'+e.message,'err'); return; }
      if(st.cm){
        const idx=st.cm.indexFromPos(st.cm.getCursor());
        st.cm.setValue(out);
        st.cm.setCursor(st.cm.posFromIndex(Math.min(idx, out.length)));
      } else setVal(out);
      flash('已格式化');
    }

    /* ---------- 查找替换 ---------- */
    const findPanel=$('[data-find]'), fin=$('[data-fin]'), rin=$('[data-rin]'), ferr=$('[data-ferr]');
    function openFind(focusReplace){
      st.findOpen=true; findPanel.classList.add('show');
      if(st.cm && st.cm.getSelection()) fin.value=st.cm.getSelection();
      (focusReplace?rin:fin).focus();
      frCompute();
    }
    $('[data-a=find]').onclick=()=>openFind(false);
    $('[data-a=replace]').onclick=()=>openFind(true);
    $('[data-a=fclose]').onclick=closeFind;
    function closeFind(){ st.findOpen=false; findPanel.classList.remove('show'); frClear(); st.cm&&st.cm.focus(); }
    B.$$('[data-ft]').forEach(b=>b.onclick=()=>{
      st.frOpts[b.dataset.ft]=!st.frOpts[b.dataset.ft];
      b.classList.toggle('on', st.frOpts[b.dataset.ft]);
      frCompute();
    });
    function frQuery(){
      const q=fin.value;
      if(!q) return null;
      if(st.frOpts.regex){
        try{ return new RegExp(q, st.frOpts.case?'g':'gi'); }
        catch(e){ ferr.style.display='block'; return false; }
      }
      ferr.style.display='none';
      return q;
    }
    function frCompute(){
      frClear();
      st.matches=[]; st.fidx=-1;
      const q=frQuery();
      if(!q || q===false || !st.cm){ frCount(); return; }
      const o=st.frOpts;
      const cur=st.cm.getSearchCursor(q, null, {caseFold:!o.case, regexp:!!o.regex});
      let n=0;
      while(cur.findNext() && n<2000){
        const from=cur.from(), to=cur.to();
        if(o.word){
          const line=st.cm.getLine(from.line);
          const before=line[from.ch-1]||'', after=line[to.ch]||'';
          if(/\w/.test(before)||/\w/.test(after)){ continue; }
        }
        st.matches.push({from, to, text:st.cm.getRange(from,to)});
        n++;
      }
      st._marks=[];
      st.matches.forEach((m,i)=>{
        st._marks.push(st.cm.markText(m.from, m.to, {className:'cm-mark'}));
      });
      if(st.matches.length){ st.fidx=0; frHighlight(); }
      frCount();
    }
    function frClear(){
      if(st._marks) st._marks.forEach(m=>{ try{m.clear();}catch(e){} });
      st._marks=[];
    }
    function frHighlight(){
      if(st.fidx<0||!st._marks.length) return;
      st._marks.forEach((m,i)=>{
        try{
          m.clear();
          const mm=st.matches[i];
          st._marks[i]=st.cm.markText(mm.from, mm.to, {className:'cm-mark'+(i===st.fidx?' cur':'')});
        }catch(e){}
      });
      const m=st.matches[st.fidx];
      st.cm.scrollIntoView({from:m.from,to:m.to}, 80);
      st.cm.setCursor(m.from);
      frCount();
    }
    function frCount(){ $('[data-fcount]').textContent = st.matches.length?`${st.fidx+1}/${st.matches.length}`:'0/0'; }
    function frNav(d){
      if(!st.matches.length){ frCompute(); if(!st.matches.length) return; }
      st.fidx=(st.fidx+d+st.matches.length)%st.matches.length;
      frHighlight();
    }
    function frReplaceOne(){
      if(st.fidx<0||!st.matches.length) return;
      const m=st.matches[st.fidx];
      let rep=rin.value;
      if(st.frOpts.regex){
        try{ rep=m.text.replace(new RegExp(fin.value, st.frOpts.case?'':'i'), rin.value); }catch(e){}
      }
      st.cm.replaceRange(rep, m.from, m.to);
      frCompute();
    }
    function frReplaceAll(){
      if(!st.matches.length) return;
      const n=st.matches.length;
      for(let i=st.matches.length-1;i>=0;i--){
        const m=st.matches[i];
        let rep=rin.value;
        if(st.frOpts.regex){ try{ rep=m.text.replace(new RegExp(fin.value, st.frOpts.case?'':'i'), rin.value); }catch(e){} }
        st.cm.replaceRange(rep, m.from, m.to);
      }
      frCompute();
      flash(`已替换 ${n} 处`);
    }
    function frRefreshMarks(){ if(st.findOpen && st.matches.length) frCompute(); }
    fin.addEventListener('input', B.debounce(frCompute, 220));
    fin.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); frNav(e.shiftKey?-1:1); }
      if(e.key==='Escape') closeFind();
    });
    rin.addEventListener('keydown', e=>{ if(e.key==='Escape') closeFind(); if(e.key==='Enter'){e.preventDefault(); frReplaceOne();} });
    $('[data-a=fnext]').onclick=()=>frNav(1);
    $('[data-a=fprev]').onclick=()=>frNav(-1);
    $('[data-a=rone]').onclick=frReplaceOne;
    $('[data-a=rall]').onclick=frReplaceAll;

    /* ---------- 工具条 ---------- */
    $('[data-a=save]').onclick=()=>saveDoc(false);
    $('[data-a=undo]').onclick=()=>st.cm?st.cm.undo():document.execCommand('undo');
    $('[data-a=redo]').onclick=()=>st.cm?st.cm.redo():document.execCommand('redo');
    $('[data-a=format]').onclick=formatCode;
    $('[data-a=run]').onclick=()=>runPreview(true);
    $('[data-a=pvrefresh]').onclick=()=>runPreview(true);
    $('[data-a=copyall]').onclick=async()=>{ try{ await navigator.clipboard.writeText(getVal()); flash('已复制全部内容'); }catch(e){ ta.select(); document.execCommand('copy'); } };
    $('[data-a=clear]').onclick=async()=>{ if(await Dlg.confirm('清空编辑器全部内容？', {danger:true, ok:'清空'})) { setVal(''); runPreview(false);} };
    $('[data-a=newtab]').onclick=()=>{
      const u=URL.createObjectURL(new Blob([previewDoc()],{type:'text/html'}));
      window.open(u,'_blank');
      setTimeout(()=>URL.revokeObjectURL(u), 15000);
    };
    $('[data-a=inbrowser]').onclick=()=>{
      const u=URL.createObjectURL(new Blob([previewDoc()],{type:'text/html'}));
      openApp('browser', {url:u, title:st.doc.baseName||'HTML 预览'});
    };
    $('[data-a=import]').onclick=()=>{
      const inp=document.createElement('input'); inp.type='file';
      inp.onchange=async()=>{
        const f=inp.files[0]; if(!f) return;
        setVal(await f.text());
        setMode(edModeForExt(B.ext(f.name)));
        st.doc.baseName=f.name;
        flash('已导入 '+f.name);
      };
      inp.click();
    };
    $('[data-a=export]').onclick=async()=>{
      const ext=ED_MODES[st.mode]?ED_MODES[st.mode].ext:'.html';
      const def=st.doc.baseName || ('未命名'+ext);
      const wrap=B.el('div');
      wrap.innerHTML=`<div class="row"><span style="width:64px;flex:none">文件名</span><input class="inp" data-fn value="${B.esc(def)}"></div>
        <div class="row"><span style="width:64px;flex:none">目录</span><select class="inp" data-dir><option value="/Desktop">/Desktop</option><option value="/Documents">/Documents</option><option value="/Pictures">/Pictures</option></select></div>`;
      const r=await Dlg.show({title:'导出文件', icon:'export', body:wrap,
        buttons:[{label:'取消', value:null},{label:'下载到本机', value:'local'},{label:'保存到虚拟文件系统', primary:true, value:'vfs'}]});
      if(!r) return;
      const fn=wrap.querySelector('[data-fn]').value.trim()||def;
      const content=getVal();
      if(r==='local'){ B.download(new Blob([content],{type:ED_MODES[st.mode]?ED_MODES[st.mode].mime:'text/plain'}), fn); }
      else {
        const p=B.join(wrap.querySelector('[data-dir]').value, fn);
        await fsCore.writeFile(p, content);
        st.doc.path=p; st.doc.baseName=fn; st.doc.saveDir=B.dirOf(p);
        flash('已保存到 '+p);
        Desktop.render();
      }
    };
    /* 输入模式切换：重建编辑器 */
    inputSel.onchange=async()=>{
      S.set('editorInput', inputSel.value);
      if(!st.cm) return;
      st._initVal=st.cm.getValue();
      st._initCursor=st.cm.getCursor();
      st.cm.toTextArea(); st.cm=null;
      $('.ed-pane').querySelectorAll('.CodeMirror').forEach(e=>e.remove());
      await initCM();
      Toast.show('输入模式已切换：'+inputSel.options[inputSel.selectedIndex].text);
    };

    /* ---------- 可拖拽分割条 ---------- */
    const split=$('[data-split]'), pane=$('[data-edpane]'), pv=$('[data-pv]'), wrapEl=$('.ed-wrap');
    split.addEventListener('pointerdown', e=>{
      e.preventDefault();
      split.setPointerCapture(e.pointerId);
      const mob=WM.isMobile();
      const sr=wrapEl.getBoundingClientRect();
      const move=ev=>{
        if(mob){
          const h=B.clamp(ev.clientY-sr.top, 160, sr.height-120);
          pane.style.flex='0 0 '+h+'px';
        } else {
          const w=B.clamp(ev.clientX-sr.left, 200, sr.width-120-6);
          pane.style.flex='0 0 '+w+'px';
        }
      };
      const up=()=>{ split.removeEventListener('pointermove',move); split.removeEventListener('pointerup',up); st.cm&&st.cm.refresh(); };
      split.addEventListener('pointermove',move);
      split.addEventListener('pointerup',up);
    });

    /* ---------- 载入文件 ---------- */
    if(opts.path){
      win.el.querySelector('.wt-title').textContent='HTML编辑器 · '+B.base(opts.path);
      fsCore.readFile(opts.path,'utf8').then(t=>{
        st._initVal=t;
        setMode(edModeForExt(B.ext(opts.path)));
        if(st.cm){ st.cm.setValue(t); runPreview(false); updStatus(); }
      }).catch(e=>Toast.show('读取失败：'+e.message,'err'));
    } else {
      st._initVal=opts.content||'<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <title>未命名页面</title>\n  <style>\n    body {\n      font-family: sans-serif;\n      display: grid;\n      place-items: center;\n      min-height: 100vh;\n      margin: 0;\n      background: #061723;\n      color: #43e5c3;\n    }\n    h1 { letter-spacing: .2em; font-weight: 300; }\n  </style>\n</head>\n<body>\n  <h1>BENTHOS</h1>\n</body>\n</html>';
    }
    initCM();
    win.state.onResize=()=>st.cm&&st.cm.refresh();
    win.state.onClose=()=>{
      if(st.cm){ try{ st.cm.toTextArea(); }catch(e){} st.cm=null; }
      if(st._pvUrl) URL.revokeObjectURL(st._pvUrl);
    };
  }
});

/* ================================================================
   图片 / 漫画阅读器（条漫流）
   ================================================================ */
regApp({
  id:'image', name:'图片查看器', icon:'image', w:780, h:640,
  accepts: st=> !st.isDirectory && IMG_EXT.includes(B.ext(st.name)),
  launch(win, opts){
    const path=opts.path;
    const dir=B.dirOf(path);
    win.body.innerHTML=`
      <div class="toolbar mg-tools">
        <button class="tb-btn" data-a="prev">${icon('up',16)}<span>上一张</span></button>
        <button class="tb-btn" data-a="next">${icon('download',16)}<span>下一张</span></button>
        <button class="tb-btn" data-a="top">${icon('forward',16)}<span>回顶部</span></button>
        <div class="tb-sep"></div>
        <button class="tb-btn" data-a="zoom">${icon('search',16)}<span>适合宽度</span></button>
        <button class="tb-btn" data-a="dl">${icon('download',16)}<span>下载本页</span></button>
        <button class="tb-btn" data-a="opendir">${icon('folderOpen',16)}<span>打开目录</span></button>
        <div class="tb-sp"></div>
        <button class="tb-btn primary" data-a="fs">${icon('fullscreen',16)}<span>沉浸全屏</span></button>
      </div>
      <div class="mg-wrap"><div class="mg-inner"></div><div class="mg-loading" data-load>准备…</div></div>
      <button class="mg-x" title="退出全屏">${icon('close',18)}</button>`;
    const wrapEl=win.body.querySelector('.mg-wrap');
    const inner=win.body.querySelector('.mg-inner');
    const loadEl=win.body.querySelector('[data-load]');
    const st={urls:[], items:[], zoomFit:true, cur:0};
    win.el.querySelector('.wt-title').textContent='图片查看器 · '+B.base(path);

    async function loadAll(){
      let list;
      try{ list=await fsCore.readdir(dir); }
      catch(e){ Toast.show('目录读取失败：'+e.message,'err'); return; }
      const imgs=list.filter(e=>!e.isDirectory && IMG_EXT.includes(B.ext(e.name)))
        .sort((a,b)=>B.natural(a.name,b.name)); /* 自然排序：1,2,10 */
      if(!imgs.length){ Toast.show('目录中没有图片','warn'); return; }
      loadEl.textContent=`0 / ${imgs.length}`;
      /* 按序创建占位骨架 */
      const itemEls=imgs.map((en,i)=>{
        const it=B.el('div','mg-item');
        it.innerHTML=`<div class="mg-ph">${B.esc(en.name)}</div><div class="mg-num">${i+1} / ${imgs.length}</div>`;
        inner.appendChild(it);
        return it;
      });
      /* 并行读取、按序插入 */
      const results=await Promise.all(imgs.map(en=>
        fsCore.readFile(en.path,{as:'blob'})
          .then(b=>({en, url:URL.createObjectURL(b)}))
          .catch(e=>({en, err:e}))
      ));
      let done=0, targetScrolled=false;
      results.forEach((r,i)=>{
        const it=itemEls[i];
        done++;
        loadEl.textContent=`${done} / ${imgs.length}`;
        if(done===imgs.length) setTimeout(()=>loadEl.remove(), 900);
        if(r.err){
          it.innerHTML=`<div class="mg-fail">${B.esc(r.en.name)} 读取失败，已跳过</div>`;
          return;
        }
        st.urls.push(r.url);
        const img=new Image();
        img.src=r.url;
        img.style.display='block';
        if(!st.zoomFit) img.style.maxWidth='none';
        img.onload=()=>{
          const ph=it.querySelector('.mg-ph');
          if(!ph) return;
          const oldH=ph.offsetHeight;
          const topBefore=it.getBoundingClientRect().top;
          const wrapTop=wrapEl.getBoundingClientRect().top;
          it.replaceChild(img, ph);
          const newH=img.offsetHeight;
          /* 上方图片撑开高度时补偿 scrollTop，画面不跳动 */
          if(topBefore < wrapTop) wrapEl.scrollTop += (newH-oldH);
          /* 定位到用户点击的图片 */
          if(r.en.path===path && !targetScrolled){
            targetScrolled=true;
            requestAnimationFrame(()=>{ it.scrollIntoView({block:'start'}); });
          }
        };
        img.onerror=()=>{ it.innerHTML=`<div class="mg-fail">${B.esc(r.en.name)} 解码失败，已跳过</div>`; };
      });
      st.items=itemEls;
    }
    loadAll();

    function go(delta){
      if(!st.items.length) return;
      const tops=st.items.map(it=>({it, top:it.offsetTop}));
      const cur=wrapEl.scrollTop+10;
      let idx=tops.findIndex(t=>t.top>=cur);
      if(idx<0) idx=tops.length-1;
      const target=B.clamp(idx+delta, 0, tops.length-1);
      wrapEl.scrollTo({top:tops[target].top-8, behavior:'smooth'});
    }
    win.body.querySelector('[data-a=prev]').onclick=()=>go(-1);
    win.body.querySelector('[data-a=next]').onclick=()=>go(1);
    win.body.querySelector('[data-a=top]').onclick=()=>wrapEl.scrollTo({top:0, behavior:'smooth'});
    const zoomBtn=win.body.querySelector('[data-a=zoom]');
    zoomBtn.onclick=()=>{
      st.zoomFit=!st.zoomFit;
      zoomBtn.querySelector('span').textContent=st.zoomFit?'适合宽度':'原始大小';
      inner.querySelectorAll('img').forEach(im=>{ im.style.maxWidth=st.zoomFit?'':'none'; im.style.width=st.zoomFit?'':'auto'; });
    };
    win.body.querySelector('[data-a=dl]').onclick=()=>{
      const img=inner.querySelector('img');
      if(img){ fetch(img.src).then(r=>r.blob()).then(b=>B.download(b, B.base(path))); }
    };
    win.body.querySelector('[data-a=opendir]').onclick=()=>openApp('files',{path:dir});
    /* 全屏沉浸 */
    const fsBtn=win.body.querySelector('[data-a=fs]');
    const xBtn=win.body.querySelector('.mg-x');
    fsBtn.onclick=async()=>{
      try{ await win.el.requestFullscreen(); }catch(e){ win.el.classList.add('mg-fs'); }
    };
    xBtn.onclick=()=>{
      if(document.fullscreenElement) document.exitFullscreen();
      else win.el.classList.remove('mg-fs');
    };
    const onFs=()=>{
      const on=!!document.fullscreenElement;
      win.el.classList.toggle('mg-fs', on);
      if(!on) win.el.classList.remove('mg-fs');
    };
    document.addEventListener('fullscreenchange', onFs);
    /* 鼠标手抓拖拽 + 物理阻尼滑行 */
    let drag=null, raf=0;
    wrapEl.addEventListener('pointerdown', e=>{
      if(e.pointerType!=='mouse' || e.button!==0) return;
      cancelAnimationFrame(raf);
      drag={y:e.clientY, st:wrapEl.scrollTop, v:0, lastY:e.clientY, lastT:performance.now()};
      wrapEl.classList.add('grabbing');
      wrapEl.setPointerCapture(e.pointerId);
    });
    wrapEl.addEventListener('pointermove', e=>{
      if(!drag) return;
      const now=performance.now();
      const dy=e.clientY-drag.lastY;
      drag.v=dy/Math.max(1, now-drag.lastT)*16;
      drag.lastY=e.clientY; drag.lastT=now;
      wrapEl.scrollTop=drag.st-(e.clientY-drag.y);
    });
    const endDrag=()=>{
      if(!drag) return;
      wrapEl.classList.remove('grabbing');
      let v=drag.v; drag=null;
      const FRICTION=0.96;
      const glide=()=>{
        if(Math.abs(v)<0.5) return;
        wrapEl.scrollTop-=v;
        v*=FRICTION;
        raf=requestAnimationFrame(glide);
      };
      glide();
    };
    wrapEl.addEventListener('pointerup', endDrag);
    wrapEl.addEventListener('pointercancel', endDrag);
    win.state.onClose=()=>{
      document.removeEventListener('fullscreenchange', onFs);
      cancelAnimationFrame(raf);
      st.urls.forEach(u=>URL.revokeObjectURL(u));
      if(document.fullscreenElement===win.el) document.exitFullscreen().catch(()=>{});
    };
  }
});

      } else {
        win.body.innerHTML=`
          <div class="mp-wrap">
            <div class="mp-stage"><div class="mp-vis"><canvas></canvas><div class="mp-disc"></div></div></div>
            <div class="mp-ctrl">

                <button class="mp-btn" data-loop>${icon('refresh',18)}</button>
              </div>
            </div>
          </div>`;
        const audio=new Audio(); audio.src=url; audio.preload='metadata';
        const seek=win.body.querySelector('.mp-seek');
        const disc=win.body.querySelector('.mp-disc');
        const canvas=win.body.querySelector('canvas');
        const fmt=t=>{ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); };
        const playBtn=win.body.querySelector('[data-play]');
        function ensureAnalyser(){
          if(actx) return;
          try{
            actx=new (window.AudioContext||window.webkitAudioContext)();
            const src=actx.createMediaElementSource(audio);
            analyser=actx.createAnalyser(); analyser.fftSize=128;
            src.connect(analyser); analyser.connect(actx.destination);
            drawVis();
          }catch(e){}
        }
        function drawVis(){
          const ctx=canvas.getContext('2d');
          const data=new Uint8Array(analyser.frequencyBinCount);
          const loop=()=>{
            raf=requestAnimationFrame(loop);
            analyser.getByteFrequencyData(data);
            const w=canvas.width=canvas.offsetWidth, h=canvas.height=canvas.offsetHeight;
            ctx.clearRect(0,0,w,h);
            const cx=w/2, cy=h/2, n=data.length;
            for(let i=0;i<n;i++){
              const ang=(i/n)*Math.PI*2 - Math.PI/2;
              const v=data[i]/255;
              const r1=Math.min(w,h)*0.30, r2=r1+v*Math.min(w,h)*0.19;
              ctx.strokeStyle=`rgba(67,229,195,${0.25+v*0.7})`;
              ctx.lineWidth=2.4;
              ctx.beginPath();
              ctx.moveTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
              ctx.lineTo(cx+Math.cos(ang)*r2, cy+Math.sin(ang)*r2);
              ctx.stroke();
            }
          };
          loop();
        }
        playBtn.onclick=async()=>{
          ensureAnalyser();
          if(actx&&actx.state==='suspended') await actx.resume();
          if(audio.paused){ audio.play(); } else audio.pause();
        };
        audio.onplay=()=>{ playBtn.innerHTML=icon('pause',18); disc.classList.add('playing'); };
        audio.onpause=()=>{ playBtn.innerHTML=icon('play',18); disc.classList.remove('playing'); };
        audio.ontimeupdate=()=>{
          if(!seekDrag) seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;
          win.body.querySelector('[data-cur]').textContent=fmt(audio.currentTime);
        };
        audio.onloadedmetadata=()=>{ win.body.querySelector('[data-dur]').textContent=fmt(audio.duration); };
        let seekDrag=false;
        seek.addEventListener('input', ()=>{ seekDrag=true; });
        seek.addEventListener('change', ()=>{ audio.currentTime=seek.value/1000*audio.duration; seekDrag=false; });
        win.body.querySelector('[data-vol]').onclick=function(){ audio.muted=!audio.muted; this.style.color=audio.muted?'var(--danger)':''; };
        const loopBtn=win.body.querySelector('[data-loop]');
        loopBtn.onclick=function(){ audio.loop=!audio.loop; this.classList.toggle('on', audio.loop); this.style.color=audio.loop?'var(--acc)':''; };
        win.state.onClose=()=>{
          audio.pause(); cancelAnimationFrame(raf);
          if(actx) actx.close().catch(()=>{});
          if(url) URL.revokeObjectURL(url);
        };
      }
    }).catch(e=>{ win.body.innerHTML=`<div class="fe-empty" style="position:static;display:grid;height:100%"><div style="text-align:center;color:var(--danger)">${icon('warn',40)}<div>加载失败：${B.esc(e.message)}</div></div></div>`; });
    if(kind==='video') win.state.onClose=()=>{ const v=win.body.querySelector('video'); v&&v.pause(); if(url) URL.revokeObjectURL(url); };
  }
});

/* ================================================================
   计算器（递归下降安全解析器）
   ================================================================ */
function calcEval(src){
  let i=0;
  const isDigit=c=>c>='0'&&c<='9';
  function skip(){ while(src[i]===' ') i++; }
  function num(){
    skip();
    let s='';
    while(isDigit(src[i])||src[i]==='.'){ s+=src[i++]; }
    if(!s || s==='.') throw new Error('无效数字');
    return parseFloat(s);
  }
  function primary(){
    skip();
    if(src[i]==='('){ i++; const v=expr(); skip(); if(src[i]!==')') throw new Error('缺少右括号'); i++; return v; }
    return num();
  }
  function factor(){
    skip();
    if(src[i]==='-'){ i++; return -factor(); }
    if(src[i]==='+'){ i++; return factor(); }
    let v=primary();
    skip();
    while(src[i]==='^'){ i++; v=Math.pow(v, factor()); skip(); }
    return v;
  }
  function term(){
    let v=factor(); skip();
    while(src[i]==='*'||src[i]==='/'||src[i]==='%'){
      const op=src[i++]; const r=factor(); skip();
      if(op==='*') v*=r; else if(op==='/'){ if(r===0) throw new Error('除数为零'); v/=r; } else v%=r;
    }
    return v;
  }
  function expr(){
    let v=term(); skip();
    while(src[i]==='+'||src[i]==='-'){ const op=src[i++]; const r=term(); v = op==='+'? v+r : v-r; skip(); }
    return v;
  }
  const v=expr(); skip();
  if(i<src.length) throw new Error('意外的字符：'+src[i]);
  return v;
}
regApp({
  id:'calc', name:'计算器', icon:'calc', w:340, h:520, single:true,
  launch(win){
    win.body.innerHTML=`<div class="calc">
      <div class="calc-disp"><div class="calc-expr" data-expr>&nbsp;</div><div class="calc-res" data-res>0</div></div>
      <div class="calc-keys"></div></div>`;
    const res=win.body.querySelector('[data-res]'), exprEl=win.body.querySelector('[data-expr]');
    const keysEl=win.body.querySelector('.calc-keys');
    let cur='0', lastEq=null;
    const layout=[['C','fn'],['(',')','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['0',''],['.',''],['⌫','fn'],['=','eq']];
    layout.forEach(([k,cls])=>{
      const b=B.el('button','ck '+cls, B.esc(k));
      b.onclick=()=>press(k);
      keysEl.appendChild(b);
    });
    function fmtNum(v){
      if(!isFinite(v)) return '∞';
      const r=Math.round(v*1e10)/1e10;
      const s=String(r);
      return s.length>14 ? r.toExponential(6) : s;
    }
    function press(k){
      const disp={'÷':'/','×':'*','−':'-'}[k]||k;
      if(k==='C'){ cur='0'; lastEq=null; }
      else if(k==='⌫'){ cur=cur.length>1?cur.slice(0,-1):'0'; }
      else if(k==='='){
        try{
          const v=calcEval(cur);
          exprEl.textContent=cur+' =';
          exprEl.dataset.hold='1';
          cur=fmtNum(v);
        }catch(e){ res.classList.add('err'); res.textContent=e.message; setTimeout(()=>{res.classList.remove('err'); cur='0'; exprEl.dataset.hold=''; render();},1300); return; }
      }
      else {
        exprEl.dataset.hold='';
        if(cur==='0' && /[0-9]/.test(disp)) cur=disp;
        else if(cur.length<40) cur+=disp;
      }
      render();
    }
    function render(){ if(!exprEl.dataset.hold) exprEl.textContent=cur; res.textContent=fmtNum(evalSafe(cur)); }
    function evalSafe(s){ try{ if(/^[\d+\-*/().%\s^]*$/.test(s)&&/[0-9]/.test(s)) { const v=calcEval(s); return isFinite(v)?v:0; } }catch(e){} return 0; }
    render();
    win.el.addEventListener('keydown', e=>{
      if(e.target.tagName==='INPUT') return;
      const map={'Enter':'=','Backspace':'⌫','Escape':'C','*':'×','/':'÷','-':'−'};
      const k=map[e.key]||e.key;
      if(layout.some(l=>l[0]===k)){ e.preventDefault(); press(k); }
    });
  }
});

    sizeInp.oninput=()=>{ st.size=+sizeInp.value; win.body.querySelector('[data-szv]').textContent=st.size+'px'; };
    function snapshot(){ st.undo.push(ctx.getImageData(0,0,cv.width,cv.height)); if(st.undo.length>18) st.undo.shift(); }
    win.body.querySelector('[data-a=undo]').onclick=()=>{ const s=st.undo.pop(); if(s) ctx.putImageData(s,0,0); };
    win.body.querySelector('[data-a=clear]').onclick=async()=>{
      if(await Dlg.confirm('清空画布？',{danger:true,ok:'清空'})){ snapshot(); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height); }
    };
    win.body.querySelector('[data-a=save]').onclick=()=>{
      cv.toBlob(async b=>{
        await fsCore.mkdir('/Pictures',{recursive:true});
        const n=await uniqueName('/Pictures','画作.png');
        await fsCore.writeFile(B.join('/Pictures',n), b);
        Toast.show('已保存到 /Pictures/'+n);
      },'image/png');
    };
    let draw=null, shapeStart=null, base=null;
    function pt(e){
      const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)};
    }
    cv.addEventListener('pointerdown', e=>{
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      const p=pt(e);
      snapshot();
      if(st.tool==='brush'||st.tool==='eraser'){
        draw=p;
        ctx.strokeStyle = st.tool==='eraser'?'#ffffff':st.color;
        ctx.lineWidth = st.tool==='eraser'?st.size*2.4:st.size;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+.01,p.y+.01); ctx.stroke();
      } else {
        shapeStart=p;
        base=ctx.getImageData(0,0,cv.width,cv.height);
      }
    });
    cv.addEventListener('pointermove', e=>{
      const p=pt(e);
      if(draw){ ctx.lineTo(p.x,p.y); ctx.stroke(); draw=p; }
      else if(shapeStart){
        ctx.putImageData(base,0,0);
        ctx.strokeStyle=st.color; ctx.lineWidth=st.size;
        ctx.beginPath();
        if(st.tool==='line'){ ctx.moveTo(shapeStart.x,shapeStart.y); ctx.lineTo(p.x,p.y); }
        else if(st.tool==='rect'){ ctx.rect(Math.min(shapeStart.x,p.x),Math.min(shapeStart.y,p.y),Math.abs(p.x-shapeStart.x),Math.abs(p.y-shapeStart.y)); }
        else if(st.tool==='ellipse'){ ctx.ellipse((shapeStart.x+p.x)/2,(shapeStart.y+p.y)/2,Math.abs(p.x-shapeStart.x)/2,Math.abs(p.y-shapeStart.y)/2,0,0,Math.PI*2); }
        ctx.stroke();
      }
    });
    const endDraw=()=>{ draw=null; shapeStart=null; base=null; };
    cv.addEventListener('pointerup', endDraw);
    cv.addEventListener('pointercancel', endDraw);
  }
});

regApp({
  id:'terminal', name:'终端', icon:'terminal', w:720, h:480,
  launch(win){
    win.body.innerHTML=`<div class="term" data-term></div>`;
    const term=win.body.querySelector('[data-term]');
    let cwd='/';
    const hist=[]; let hi=0;
    function print(html, cls='t-line'){ const d=B.el('div',cls||'t-line',html); term.insertBefore(d, term.lastElementChild); term.scrollTop=term.scrollHeight; }
    function prompt(){
      const row=B.el('div','term-inrow');
      row.innerHTML=`<span class="t-p">benthos:${cwd}$&nbsp;</span><input autocomplete="off" spellcheck="false">`;
      term.appendChild(row);
      const inp=row.querySelector('input');
      inp.focus();
      inp.addEventListener('keydown', async e=>{
        if(e.key==='Enter'){
          const cmd=inp.value;
          row.querySelector('input').remove();
          row.innerHTML=`<span class="t-p">benthos:${cwd}$&nbsp;</span>${B.esc(cmd)}`;
          if(cmd.trim()){ hist.push(cmd); hi=hist.length; await run(cmd); }
          prompt();
        } else if(e.key==='ArrowUp'){ if(hi>0){ hi--; inp.value=hist[hi]||''; } e.preventDefault(); }
        else if(e.key==='ArrowDown'){ if(hi<hist.length){ hi++; inp.value=hist[hi]||''; } e.preventDefault(); }
      });
      term.scrollTop=term.scrollHeight;
    }
    term.addEventListener('click', ()=>{ const i=term.querySelector('input'); i&&i.focus(); });
    function abs(p){ return p.startsWith('/')?normPath(p):normPath(cwd+'/'+p); }
    async function run(cmd){
      const [c,...args]=cmd.trim().split(/\s+/);
      const arg=args.join(' ');
      try{
        switch(c){
          case 'help': print('可用命令：help ls cd pwd cat mkdir touch rm mv cp echo du date whoami clear open'); break;
          case 'ls': {
            const list=await fsCore.readdir(abs(arg||cwd));
            print(list.map(e=>e.isDirectory?`<span style="color:var(--acc)">${B.esc(e.name)}/</span>`:B.esc(e.name)).join('   ')||'（空）');
            break; }
          case 'cd': {
            if(!arg||arg==='~'){ cwd='/'; break; }
            if(arg==='..'){ cwd=B.dirOf(cwd); break; }
            const p=abs(arg); const s=await fsCore.stat(p);
            if(!s.isDirectory) throw fsErr('ENOTDIR','不是目录',p);
            cwd=p; break; }
          case 'pwd': print(B.esc(cwd)); break;
          case 'cat': print(B.esc(await fsCore.readFile(abs(arg),'utf8'))||'（空文件）'); break;
          case 'mkdir': await fsCore.mkdir(abs(arg),{recursive:true}); break;
          case 'touch': await fsCore.writeFile(abs(arg),''); break;
          case 'rm': await fsCore.rm(abs(arg),{recursive:true}); break;
          case 'mv': { const [a,b2]=args; await fsCore.rename(abs(a), abs(b2)); break; }
          case 'cp': { const [a,b2]=args; await fsCore.copy(abs(a), abs(b2)); break; }
          case 'echo': print(B.esc(arg.replace(/^["']|["']$/g,''))); break;
          case 'du': print(B.fmtBytes(await fsCore.du(abs(arg||cwd)))); break;
          case 'date': print(new Date().toString()); break;
          case 'whoami': print('潜航员 (operator) @ BENTHOS OS'); break;
          case 'clear': term.innerHTML=''; break;
          case 'open': openPath(abs(arg),{}); break;
          case '': break;
          default: print(`未知命令：${B.esc(c)}（输入 help 查看）`,'t-err');
        }
      }catch(e){ print(B.esc(e.message),'t-err'); }
    }
    print('<span style="color:var(--acc)">BENTHOS SHELL 1.0</span> · 深海测绘工作站终端 · 输入 <b>help</b> 查看命令');
    prompt();
  }
});

    };
    win.body.querySelector('[data-a=stop]').onclick=()=>{ if(emu){ emu.destroy(); emu=null; hint.style.display='block'; } };
    win.body.querySelector('[data-a=mouse]').onclick=()=>{
      if(!emu){ Toast.show('请先启动虚拟机','warn'); return; }
      try{ emu.lock_mouse(); }catch(e){ Toast.show('鼠标锁定失败','err'); }
    };
    win.body.querySelector('[data-a=fs]').onclick=()=>{
      const sc=win.body.querySelector('#vm-screen-container');
