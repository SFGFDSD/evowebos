<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>汐砚 · 砚潮系统</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
/* ===================== 砚潮 · Inkstone-Tide 设计语言 ===================== */
:root{--acc:#e4573d;--gold:#cfa864;--r:10px;--blur:18px;--galpha:.74;--tbh:52px;--isz:76px;--fs:14px;
--ui:'LXGW WenKai Screen','Noto Serif SC',serif;--disp:'Noto Serif SC',serif;--mono:'Martian Mono',ui-monospace,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=dark]{--bg0:#090c0d;--bg1:#101517;--bg2:#161d20;--bg3:#1f282c;--bg4:#2a353a;--line:rgba(200,225,210,.08);--line2:rgba(200,225,210,.16);--tx:#dfe7dd;--tx2:#9aaba2;--tx3:#5e6e67;--glassc:14,19,21;--sh:0 28px 70px -14px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.45);--hov:rgba(220,235,225,.06);color-scheme:dark}
[data-theme=light]{--bg0:#e6dfcf;--bg1:#f8f4ea;--bg2:#efe9dc;--bg3:#e4dccb;--bg4:#d6ccb8;--line:rgba(70,50,30,.10);--line2:rgba(70,50,30,.2);--tx:#2b241e;--tx2:#6d6156;--tx3:#a19584;--glassc:248,244,234;--sh:0 24px 50px -16px rgba(60,40,20,.38),0 0 0 1px rgba(60,40,20,.1);--hov:rgba(60,40,20,.06);color-scheme:light}
:root{--glass:rgba(var(--glassc),var(--galpha));--sel:color-mix(in oklab,var(--acc) 22%,transparent);--selb:color-mix(in oklab,var(--acc) 55%,transparent)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0);color:var(--tx);font-family:var(--ui);font-size:var(--fs);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
textarea,input[type=text],input[type=search],[contenteditable]{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
body.noanim *{transition:none!important;animation:none!important}
body.dragging iframe,body.dragging .cm-host{pointer-events:none}
svg{flex:none}
/* 壁纸 */
#wall{position:fixed;inset:0;transition:background .6s,opacity .4s}
#wall::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#wallDim{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0}
/* 桌面 */
#desk{position:fixed;left:0;top:0;right:0;bottom:var(--tbh);overflow:hidden}
.dicon{position:absolute;width:var(--isz);padding:4px 2px 6px;border-radius:calc(var(--r)*.6);transition:left .34s var(--ease),top .34s var(--ease),background .15s;touch-action:none;cursor:default;animation:icIn .5s var(--ease) both}
.dicon .ic{width:calc(var(--isz)*.62);height:calc(var(--isz)*.62);margin:2px auto 4px;display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.dicon .ic svg{width:100%;height:100%}
.dicon .lb{font-size:12px;text-align:center;line-height:1.28;padding:1px 3px;color:#f2f5ef;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--selb)}
.dicon.sel .lb{-webkit-line-clamp:4}
.dicon.drop,.drop{box-shadow:inset 0 0 0 2px var(--acc)!important;background:color-mix(in oklab,var(--acc) 18%,transparent)!important}
.dicon.cut,.it.cut{opacity:.42}
@keyframes icIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
.marq{position:absolute;pointer-events:none;border:1px solid var(--acc);background:color-mix(in oklab,var(--acc) 13%,transparent);z-index:40;display:none;border-radius:2px}
.ghost{position:fixed;left:0;top:0;z-index:99990;pointer-events:none;opacity:.85;width:64px}
.ghost .gb{position:absolute;right:-4px;top:-4px;background:var(--acc);color:#fff;font:600 10px var(--mono);border-radius:9px;padding:2px 6px}
/* 窗口 */
#wins{position:fixed;left:0;top:0;right:0;bottom:var(--tbh);pointer-events:none;overflow:hidden}
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg1);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line2);min-width:280px;min-height:180px;overflow:hidden;pointer-events:auto;animation:winIn .3s var(--ease);transition:opacity .2s,transform .22s var(--ease),visibility 0s}
.win::before{content:'';position:absolute;left:16px;top:0;width:34px;height:2px;background:var(--tx3);z-index:3;transition:background .2s,width .3s var(--ease)}
.win.active::before{background:var(--acc);width:54px}
@keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.965)}}
.win.closing{opacity:0;transform:scale(.96);pointer-events:none}
.win.min{opacity:0;transform:translateY(60px) scale(.88);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .22s var(--ease),visibility 0s .22s}
.win.anim{transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease),border-radius .26s}
.win.max{border-radius:0;border-width:0}
.tb{height:38px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;touch-action:none;position:relative}
.tb .seal{display:grid;place-items:center}
.tb .tt{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx3);letter-spacing:.02em}
.win.active .tb .tt{color:var(--tx)}
.wc{display:flex;gap:2px}
.wc button{width:36px;height:28px;display:grid;place-items:center;border-radius:calc(var(--r)*.45);color:var(--tx2);transition:background .15s,color .15s}
.wc button:hover{background:var(--hov);color:var(--tx)}
.wc .x:hover{background:var(--acc);color:#fff}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:6}
.rz.n{top:-3px;left:8px;right:8px;height:7px;cursor:n-resize}.rz.s{bottom:-3px;left:8px;right:8px;height:7px;cursor:s-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:7px;cursor:e-resize}.rz.w{left:-3px;top:8px;bottom:8px;width:7px;cursor:w-resize}
.rz.ne{right:-3px;top:-3px;width:12px;height:12px;cursor:ne-resize}.rz.nw{left:-3px;top:-3px;width:12px;height:12px;cursor:nw-resize}
.rz.se{right:-3px;bottom:-3px;width:12px;height:12px;cursor:se-resize}.rz.sw{left:-3px;bottom:-3px;width:12px;height:12px;cursor:sw-resize}
.win.max .rz{display:none}
body.peeking .win:not(.peekme),body.peekall .win{opacity:.04!important;transition:opacity .25s}
body.peeking .win.peekme{box-shadow:0 0 0 2px var(--acc),var(--sh)}
#snap{position:fixed;border:1px solid var(--acc);background:color-mix(in oklab,var(--acc) 10%,transparent);border-radius:var(--r);pointer-events:none;transition:all .18s var(--ease);opacity:0;z-index:7000;backdrop-filter:blur(4px)}
/* 任务栏 */
#tbar{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);display:flex;align-items:center;gap:4px;padding:0 0 0 6px;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);border-top:1px solid var(--line2);z-index:8000;transition:transform .3s var(--ease)}
body.tb-auto #tbar{transform:translateY(calc(100% - 4px))}body.tb-auto #tbar:hover,body.tb-auto #tbar.pin{transform:none}
body.tb-auto #desk,body.tb-auto #wins{bottom:4px}
body.tb-hide #tbar{transform:translateY(100%)}body.tb-hide #desk,body.tb-hide #wins{bottom:0}
#startBtn{width:42px;height:38px;display:grid;place-items:center;border-radius:calc(var(--r)*.6);transition:background .2s}
#startBtn:hover,#startBtn.on{background:var(--hov)}
#tapps{flex:1;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;align-items:center;min-width:0;height:100%}
#tapps::-webkit-scrollbar{display:none}
.tapp{height:38px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-radius:calc(var(--r)*.6);max-width:200px;min-width:0;position:relative;flex:none;transition:background .15s;animation:icIn .3s var(--ease)}
.tapp:hover{background:var(--hov)}
.tapp.focus{background:color-mix(in oklab,var(--tx) 9%,transparent)}
.tapp::after{content:'';position:absolute;bottom:2px;left:50%;width:6px;height:2px;border-radius:2px;background:var(--tx3);transform:translateX(-50%);transition:width .25s var(--ease),background .2s}
.tapp.focus::after{width:22px;background:var(--acc)}
.tapp.mini::after{background:var(--tx3);width:4px}
.tapp .lbl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tapp .tx{width:20px;height:20px;display:grid;place-items:center;border-radius:4px;opacity:0;color:var(--tx2)}
.tapp:hover .tx{opacity:1}.tapp .tx:hover{background:var(--acc);color:#fff}
#tray{display:flex;align-items:center;gap:2px;padding:0 4px}
.tray-b{height:38px;min-width:34px;padding:0 8px;display:grid;place-items:center;border-radius:calc(var(--r)*.5);color:var(--tx2)}
.tray-b:hover{background:var(--hov);color:var(--tx)}
#clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.25;font-family:var(--mono);font-size:10.5px;color:var(--tx)}
#clock span{color:var(--tx3);font-size:9.5px}
#peek{width:10px;align-self:stretch;border-left:1px solid var(--line2);cursor:pointer;transition:background .2s}
#peek:hover{background:color-mix(in oklab,var(--acc) 30%,transparent)}
/* 浮层 */
.pop{position:fixed;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);border:1px solid var(--line2);border-radius:calc(var(--r)*1.2);box-shadow:var(--sh);z-index:8500;transition:opacity .2s,transform .26s var(--ease)}
.pop.hide{opacity:0;transform:translateY(14px) scale(.98);pointer-events:none}
#start{left:8px;bottom:calc(var(--tbh) + 8px);width:min(600px,calc(100vw - 16px));height:min(620px,calc(100% - var(--tbh) - 24px));display:flex;overflow:hidden;transform-origin:bottom left}
.st-side{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;padding:16px 0 10px;gap:10px;border-right:1px solid var(--line);background:linear-gradient(180deg,color-mix(in oklab,var(--acc) 16%,transparent),transparent 60%)}
.st-vert{writing-mode:vertical-rl;font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.35em;color:var(--tx)}
.st-seal{width:30px;height:30px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:13px;border-radius:3px;transform:rotate(-4deg)}
.st-main{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px}
.st-h{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:var(--tx3);margin:14px 2px 8px;text-transform:uppercase}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:calc(var(--r)*.7);font-size:12px;text-align:center;animation:icIn .4s var(--ease) both}
.st-app:hover{background:var(--hov)}
.st-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:calc(var(--r)*.6);font-size:12.5px;cursor:pointer}
.st-row:hover{background:var(--hov)}.st-row small{color:var(--tx3);font-family:var(--mono);font-size:9.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#cal{right:8px;bottom:calc(var(--tbh) + 8px);width:300px;padding:16px;transform-origin:bottom right}
.cal-t{font-family:var(--mono);font-size:26px;font-weight:300}
.cal-d{color:var(--tx2);font-size:12.5px;margin:2px 0 12px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-family:var(--mono);font-size:11px}
.cal-g b{color:var(--tx3);font-weight:400;padding:4px 0}
.cal-g span{padding:7px 0;border-radius:6px;cursor:default}.cal-g span:hover{background:var(--hov)}
.cal-g .o{color:var(--tx3);opacity:.5}.cal-g .td{background:var(--acc);color:#fff}
.cm{position:fixed;min-width:210px;max-width:290px;padding:5px;z-index:9500;animation:pop .14s var(--ease);font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-3px)}}
.cm .it2{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:calc(var(--r)*.5);white-space:nowrap;cursor:default;position:relative}
.cm .it2:hover,.cm .it2.hl{background:var(--acc);color:#fff}
.cm .it2.dis{opacity:.4;pointer-events:none}
.cm .it2 .k{margin-left:auto;color:var(--tx3);font-family:var(--mono);font-size:9.5px;padding-left:14px}
.cm .it2:hover .k{color:rgba(255,255,255,.75)}
.cm .sep{height:1px;background:var(--line2);margin:4px 8px}
/* 对话框 & 提示 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:9800;display:grid;place-items:center;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.dlg{width:min(440px,100%);background:var(--bg1);border:1px solid var(--line2);border-radius:calc(var(--r)*1.2);box-shadow:var(--sh);padding:20px;animation:pop .22s var(--ease);max-height:90%;overflow:auto;position:relative}
.dlg::before{content:'';position:absolute;left:20px;top:0;width:40px;height:2px;background:var(--acc)}
.dlg h3{margin:0 0 12px;font-family:var(--disp);font-size:16px;font-weight:700}
.dlg .bt{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:12px;bottom:calc(var(--tbh) + 12px);z-index:9900;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100vw - 24px)}
.toast{pointer-events:auto;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:calc(var(--r)*.7);padding:10px 14px;font-size:12.5px;box-shadow:var(--sh);min-width:220px;max-width:380px;animation:tIn .3s var(--ease)}
.toast.err{border-left-color:#d9433a}.toast.ok{border-left-color:#5fa58a}
.toast .ta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toast .pb{height:3px;background:var(--bg4);border-radius:3px;margin-top:8px;overflow:hidden}.toast .pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}}
/* 控件 */
.btn{height:30px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;border-radius:calc(var(--r)*.5);background:var(--bg3);border:1px solid var(--line);color:var(--tx);font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s;flex:none}
.btn:hover{background:var(--bg4);border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{color:#ff7b6b}.btn.on{background:var(--sel);border-color:var(--selb)}
.btn.ghost-b{background:transparent;border-color:transparent}.btn.ghost-b:hover{background:var(--hov)}
.btn:disabled{opacity:.4;pointer-events:none}
.inp{height:30px;background:var(--bg0);border:1px solid var(--line2);border-radius:calc(var(--r)*.5);color:var(--tx);padding:0 10px;outline:none;min-width:0;font-size:12.5px}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in oklab,var(--acc) 18%,transparent)}
select.inp{padding-right:4px}
.toolbar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none;flex-wrap:wrap}
.toolbar.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
.toolbar .sp{flex:1}.vsep{width:1px;height:20px;background:var(--line2);margin:0 3px;flex:none}
.status{min-height:24px;display:flex;align-items:center;gap:14px;padding:0 10px;font-family:var(--mono);font-size:10px;color:var(--tx3);border-top:1px solid var(--line);background:var(--bg2);flex:none;white-space:nowrap;overflow:hidden}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--bg4);border-radius:22px;transition:.2s;cursor:pointer}
.sw span::before{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--tx2);transition:.25s var(--ease)}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span::before{transform:translateX(16px);background:#fff}
input[type=range]{accent-color:var(--acc)}
.seg{display:inline-flex;background:var(--bg0);border:1px solid var(--line2);border-radius:calc(var(--r)*.5);padding:2px;gap:2px;flex:none}
.seg button{height:24px;padding:0 9px;border-radius:calc(var(--r)*.4);font-size:12px;color:var(--tx2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.ripple{width:56px;height:56px;position:relative}
.ripple i{position:absolute;inset:0;border:1.5px solid var(--acc);border-radius:50%;animation:rip 1.6s var(--ease) infinite;opacity:0}
.ripple i:nth-child(2){animation-delay:.4s}.ripple i:nth-child(3){animation-delay:.8s;border-color:var(--gold)}
@keyframes rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(1);opacity:0}}
.ifr-wrap{position:relative;flex:1;min-height:0;display:flex;background:var(--bg0)}
.ifr-wrap iframe{flex:1;border:0;width:100%;height:100%;background:transparent}
.ifr-mask{position:absolute;inset:0;background:var(--bg0);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;transition:opacity .35s;z-index:2;color:var(--tx3);font-size:12px}
.ifr-mask.gone{opacity:0;pointer-events:none}
.loadbar{position:absolute;left:0;top:0;height:2px;width:100%;overflow:hidden;z-index:10;display:none}
.loadbar::before{content:'';position:absolute;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--acc),var(--gold),transparent);animation:lb 1s linear infinite}
.loading>.loadbar{display:block}
@keyframes lb{from{left:-40%}to{left:100%}}
.spin-ov{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in oklab,var(--bg1) 60%,transparent);z-index:9}
.loading.slow>.spin-ov{display:grid}
/* 文件管理器 */
.fm{display:flex;flex:1;min-height:0;position:relative}
.fm-side{width:220px;flex:none;border-right:1px solid var(--line);overflow:auto;background:var(--bg2);padding:6px 6px 20px;transition:transform .25s var(--ease)}
.side-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--tx3);padding:12px 8px 5px;text-transform:uppercase;display:flex;align-items:center}
.side-h button{margin-left:auto;color:var(--tx3)}.side-h button:hover{color:var(--acc)}
.side-i{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:calc(var(--r)*.5);font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;color:var(--tx2)}
.side-i:hover{background:var(--hov);color:var(--tx)}.side-i.on{background:var(--sel);color:var(--tx)}
.side-i .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.side-i .tw{width:14px;height:14px;display:grid;place-items:center;transition:transform .15s;color:var(--tx3);flex:none}
.tnode.open>.side-i .tw{transform:rotate(90deg)}
.tkids{padding-left:12px;display:none}.tnode.open>.tkids{display:block}
.fm-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

/* ---------- IndexedDB 基础 ---------- */
const DB={db:null,p:null};
function idb(){if(DB.p)return DB.p;DB.p=new Promise((res,rej)=>{if(!self.indexedDB)return rej(new Error('IndexedDB 不可用'));const r=indexedDB.open('xiyan-os',1);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');if(!d.objectStoreNames.contains('nodes')){const s=d.createObjectStore('nodes',{keyPath:'path'});s.createIndex('parent','parent')}if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
 r.onsuccess=()=>res(DB.db=r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB 被阻塞'))});return DB.p}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function itx(stores,mode,fn){const d=await idb();return new Promise((res,rej)=>{let t;try{t=d.transaction(stores,mode)}catch(e){return rej(e)}let out,err;Promise.resolve().then(()=>fn(t,v=>out=v)).catch(e=>{err=e;try{t.abort()}catch{}});t.oncomplete=()=>err?rej(err):res(out);t.onerror=()=>rej(err||t.error);t.onabort=()=>rej(err||t.error||new Error('事务中止'))})}
const cursorAll=(src,range,cb)=>new Promise((res,rej)=>{const c=src.openCursor(range);c.onsuccess=()=>{const cur=c.result;if(cur){cb(cur);cur.continue()}else res()};c.onerror=()=>rej(c.error)});
async function kvGet(k){return itx('kv','readonly',async(t,s)=>s(await rq(t.objectStore('kv').get(k))))}
async function kvSet(k,v){return itx('kv','readwrite',t=>{t.objectStore('kv').put(v,k)})}

const LSMeta={m:null,load(){if(!this.m){try{this.m=JSON.parse(localStorage.getItem('xy:meta')||'{}')}catch{this.m={}}}return this.m},save:debounce(function(){try{localStorage.setItem('xy:meta',JSON.stringify(LSMeta.m))}catch{}},300)};
const Meta={ok:true,
 async get(k){if(this.ok)try{return await itx('meta','readonly',async(t,s)=>s(await rq(t.objectStore('meta').get(k))))}catch{}return LSMeta.load()[k]},
 async set(k,v){if(this.ok)try{return await itx('meta','readwrite',t=>{t.objectStore('meta').put(v,k)})}catch{}LSMeta.load()[k]=v;LSMeta.save()},
 async range(prefix){const m=new Map();if(this.ok)try{await itx('meta','readonly',async t=>{await cursorAll(t.objectStore('meta'),IDBKeyRange.bound(prefix,prefix+'\uffff'),c=>m.set(c.key,c.value))});return m}catch{}const o=LSMeta.load();for(const k in o)if(k.startsWith(prefix))m.set(k,o[k]);return m},
 async delTree(k){if(this.ok)try{return await itx('meta','readwrite',t=>{const s=t.objectStore('meta');s.delete(k);s.delete(IDBKeyRange.bound(k+'/',k+'/\uffff'))})}catch{}const o=LSMeta.load();for(const x in o)if(x===k||x.startsWith(k+'/'))delete o[x];LSMeta.save()},
 async moveTree(a,b){if(this.ok)try{return await itx('meta','readwrite',async t=>{const s=t.objectStore('meta');const items=[];const g=await rq(s.get(a));if(g)items.push([a,g]);await cursorAll(s,IDBKeyRange.bound(a+'/',a+'/\uffff'),c=>items.push([c.key,c.value]));for(const[k,v]of items){s.delete(k);s.put(v,b+k.slice(a.length))}})}catch{}const o=LSMeta.load();for(const k of Object.keys(o))if(k===a||k.startsWith(a+'/')){o[b+k.slice(a.length)]=o[k];delete o[k]}LSMeta.save()}
};
const enoent=p=>Object.assign(new Error('找不到：'+p),{code:'ENOENT'});

/* ---------- 后端 1：句柄文件系统（OPFS 与 File System Access 本地文件夹共用） ---------- */
class HandleFS{
 constructor(root,id,label){this.root=root;this.id=id;this.label=label}
 k(p){return this.id+':'+p}
 async dirH(p,create=false){let d=this.root;for(const s of p.split('/').filter(Boolean)){try{d=await d.getDirectoryHandle(s,{create})}catch(e){throw e.name==='TypeMismatchError'?new Error('路径不是文件夹：'+p):enoent(p)}}return d}
 async parent(p,create=false){return [await this.dirH(P.dir(p),create),P.base(p)]}
 async handle(p){if(p==='/')return this.root;const[d,n]=await this.parent(p);try{return await d.getFileHandle(n)}catch{try{return await d.getDirectoryHandle(n)}catch{throw enoent(p)}}}
 async stat(p){const hd=await this.handle(p);const m=await Meta.get(this.k(p));if(hd.kind==='file'){const f=await hd.getFile();return {kind:'file',size:f.size,mtime:m?.mtime??f.lastModified}}return {kind:'dir',size:0,mtime:m?.mtime??0}}
 async readdir(p){const d=await this.dirH(p);const metas=await Meta.range(this.k(p==='/'?'/':p+'/'));const out=[],jobs=[];
  for await(const hd of d.values()){const name=hd.name;if(name.startsWith('.xy-')||name.endsWith('.crswap'))continue;const m=metas.get(this.k(P.join(p,name)));
   if(hd.kind==='file')jobs.push(hd.getFile().then(f=>out.push({name,kind:'file',size:f.size,mtime:m?.mtime??f.lastModified})).catch(()=>out.push({name,kind:'file',size:0,mtime:m?.mtime??0})));else out.push({name,kind:'dir',size:0,mtime:m?.mtime??0})}
  await Promise.all(jobs);return out}
 async readFile(p){const[d,n]=await this.parent(p);let fh;try{fh=await d.getFileHandle(n)}catch{throw enoent(p)}return fh.getFile()}
 async writeFile(p,blob,mtime){const[d,n]=await this.parent(p,true);const fh=await d.getFileHandle(n,{create:true});if(!fh.createWritable)throw new Error('此浏览器不支持写入（createWritable）');const w=await fh.createWritable();try{await w.write(blob);await w.close()}catch(e){try{await w.abort()}catch{}throw e}await Meta.set(this.k(p),{mtime:mtime??Date.now()});const pd=P.dir(p);if(pd!=='/'&&!(await Meta.get(this.k(pd))))await Meta.set(this.k(pd),{mtime:Date.now()})}
 async mkdir(p,mtime){await this.dirH(p,true);const k=this.k(p);if(mtime!=null||!(await Meta.get(k)))await Meta.set(k,{mtime:mtime??Date.now()})}
 async rm(p){const[d,n]=await this.parent(p);await d.removeEntry(n,{recursive:true});await Meta.delTree(this.k(p))}
 async move(a,b){const hd=await this.handle(a);if(!hd.move)throw new Error('no-move');const st=await this.stat(a);const[nd,nn]=await this.parent(b,true);await hd.move(nd,nn);await Meta.moveTree(this.k(a),this.k(b));await Meta.set(this.k(b),{mtime:st.mtime||Date.now()})}
 async du(p){const hd=await this.handle(p);if(hd.kind==='file')return (await hd.getFile()).size;const walk=async d=>{let s=0;const j=[];for await(const x of d.values()){if(x.kind==='file')j.push(x.getFile().then(f=>s+=f.size).catch(()=>{}));else j.push(walk(x).then(v=>s+=v))}await Promise.all(j);return s};return walk(hd)}
}
/* ---------- 后端 2：IndexedDB 文件系统 ---------- */
class IDBFS{
 constructor(){this.id='idb';this.label='IndexedDB'}
 async node(p){return itx('nodes','readonly',async(t,s)=>s(await rq(t.objectStore('nodes').get(p))))}

const fs=(()=>{

 const sortM=()=>mounts.sort((a,b)=>b.prefix.length-a.prefix.length);

 function resolve(p){p=P.norm(p);for(const m of mounts){if(m.prefix==='/'||p===m.prefix||p.startsWith(m.prefix+'/'))return {m,b:m.backend,rel:m.prefix==='/'?p:(p.slice(m.prefix.length)||'/'),path:p}}throw new Error('没有挂载根文件系统')}

 const toBlob=(d,name)=>d instanceof Blob?d:new Blob([d==null?'':d],{type:mimeOf(name)});
 const mountAt=p=>mounts.find(m=>m.prefix===p&&m.prefix!=='/');
 async function stat(p){p=P.norm(p);const mt=mountAt(p);if(mt)return {name:P.base(p),path:p,kind:'dir',size:0,mtime:0,mount:mt.backend.id,backend:mt.backend.id};const r=resolve(p);const s=await r.b.stat(r.rel);return {...s,name:P.base(p)||'/',path:p,backend:r.b.id}}
 async function readdir(p){p=P.norm(p);const r=resolve(p);let list=[];try{list=await r.b.readdir(r.rel)}catch(e){if(!mounts.some(m=>m.prefix!=='/'&&P.dir(m.prefix)===p))throw e}
  for(const m of mounts){if(m.prefix!=='/'&&P.dir(m.prefix)===p){const n=P.base(m.prefix);list=list.filter(x=>x.name!==n);list.push({name:n,kind:'dir',size:0,mtime:0,mount:m.backend.id})}}

 async function rm(p){p=P.norm(p);if(p==='/'||mounts.some(m=>m.prefix===p||m.prefix.startsWith(p+'/')))throw new Error('不能删除挂载点或包含挂载点的目录');const r=resolve(p);await r.b.rm(r.rel);changed(P.dir(p))}
 async function exists(p){try{await stat(p);return true}catch{return false}}
 async function uniq(dir,name){if(!(await exists(P.join(dir,name))))return name;const i=name.lastIndexOf('.');const st=i>0?name.slice(0,i):name,ex=i>0?name.slice(i):'';for(let n=2;;n++){const c=`${st} (${n})${ex}`;if(!(await exists(P.join(dir,c))))return c}}

 for(let i=0;i<42;i++){const n=i-off+1;let cls='',t;if(n<1){t=prev+n;cls='o'}else if(n>days){t=n-days;cls='o'}else{t=n;if(CAL.y===d.getFullYear()&&CAL.m===d.getMonth()&&n===d.getDate())cls='td'}cells+=`<span class="${cls}">${t}</span>`}
 cal.innerHTML=`<div class="cal-t">${fmtTime(d,true)}</div><div class="cal-d">${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${wk[d.getDay()]}</div><div style="display:flex;align-items:center;gap:2px;margin-bottom:8px"><b style="flex:1;font-family:var(--disp);font-size:14px">${CAL.y} 年 ${CAL.m+1} 月</b><button class="btn ghost-b" data-a="-1" title="上个月">${ico('back',14)}</button><button class="btn ghost-b" data-a="0" title="回到本月">今天</button><button class="btn ghost-b" data-a="1" title="下个月">${ico('fwd',14)}</button></div><div class="cal-g">${'一二三四五六日'.split('').map(x=>`<b>${x}</b>`).join('')}${cells}</div>`;
 $$('[data-a]',cal).forEach(b=>b.onclick=()=>{const a=+b.dataset.a;if(!a){CAL.y=d.getFullYear();CAL.m=d.getMonth()}else{CAL.m+=a;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}}renderCal()})}
function initClock(){$('#clock').onclick=()=>{const cal=$('#cal'),show=cal.classList.contains('hide');if(show){const d=new Date();CAL.y=d.getFullYear();CAL.m=d.getMonth();renderCal()}cal.classList.toggle('hide',!show);$('#tbar').classList.toggle('pin',show)};
 $('#cal').addEventListener('wheel',e=>{e.preventDefault();CAL.m+=e.deltaY>0?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}renderCal()},{passive:false});tickClock();setInterval(tickClock,1000)}

 return `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="${H}" viewBox="0 0 800 ${H}"><rect width="800" height="${H}" fill="#f1ebdd"/><rect x="28" y="28" width="744" height="440" fill="#14181a" stroke="#0c0c0c" stroke-width="6"/><circle cx="${220+r(1)*360}" cy="${150+r(2)*140}" r="${60+r(3)*70}" fill="hsl(${hue} 68% 55%)"/>
 ${Array.from({length:7},(_,k)=>`<path d="M28 ${300+k*22} Q 250 ${270+k*22+r(k)*30} 420 ${310+k*22} T 772 ${300+k*20}" stroke="#e9e4d8" stroke-opacity="${.12+k*.06}" stroke-width="2" fill="none"/>`).join('')}
 <rect x="28" y="492" width="360" height="${H-640}" fill="#fff" stroke="#111" stroke-width="5"/><rect x="412" y="492" width="360" height="${H-640}" fill="#262b2e" stroke="#111" stroke-width="5"/>
 <text x="208" y="${492+(H-640)/2+40}" text-anchor="middle" font-family="serif" font-weight="900" font-size="150" fill="#14181a">${i}</text><text x="592" y="${492+(H-640)/2}" text-anchor="middle" font-family="serif" font-size="40" fill="#cfa864" letter-spacing="10">第${i}话</text>
 <rect x="28" y="${H-124}" width="744" height="96" fill="#e4573d" stroke="#111" stroke-width="5"/><text x="400" y="${H-62}" text-anchor="middle" font-family="serif" font-size="30" fill="#fff" letter-spacing="8">汐砚 · 示例条漫 ${i}.svg</text></svg>`}
const WELCOME=`# 欢迎使用汐砚\n\n**砚潮（Inkstone-Tide）** 设计语言的网页桌面系统：墨色砚台为底，朱砂印色为锋，潮汐纹理为韵。\n\n## 快速上手\n\n- 单击图标即可打开（可在设置中改为双击）\n- 桌面图标可拖动到任意网格位置；在空白处拖动即可框选\n- 将电脑中的文件 / 文件夹直接拖入桌面或文件管理器即可导入\n- 将图标拖出浏览器窗口即可导出到真实桌面（Chrome / Edge）\n- 右键（触屏长按）打开上下文菜单\n- 打开「图片 / 示例条漫」中的任意一张，体验条漫阅读器\n\n## 存储架构\n\n| 层 | 用途 |\n|---|---|\n| OPFS | 主文件存储（默认） |\n| IndexedDB | 第二文件后端 + 修改日期元数据 + 挂载句柄 |\n| localStorage | 设置、桌面布局、草稿 |\n| Cookie | 主题兜底 |\n\n> 所有修改日期在移动、复制、重命名、压缩、解压时都会被保留。\n`;
const DEMO_HTML=`<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<title>砚潮示例</title>\n<style>\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 30%,#e4573d 0 9%,transparent 9.5%),#0e1315;color:#e9e4d8;font-family:serif}\n  .card{padding:40px 48px;border:1px solid #2a353a;border-radius:14px;background:rgba(16,21,23,.8);text-align:center}\n  h1{font-size:42px;letter-spacing:.3em;margin:0 0 10px}\n  button{margin-top:18px;padding:10px 22px;border:0;border-radius:8px;background:#e4573d;color:#fff;font-size:15px;cursor:pointer}\n</style>\n</head>\n<body>\n  <div class="card">\n    <h1>砚潮</h1>\n    <p>右键此文件 →「编辑源代码」即可实时预览修改</p>\n    <button onclick="this.textContent='点击了 '+(++window.n||(window.n=1))+' 次'">点我</button>\n  </div>\n</body>\n</html>\n`;
async function seed(){const first=!(await fs.exists('/桌面'));for(const d of ['/桌面','/文档','/图片','/下载','/音乐','/视频','/系统','/系统/壁纸','/mnt','/mnt/local'])try{if(!(await fs.exists(d)))await fs.mkdir(d)}catch{}
 if(!first)return;try{await fs.writeFile('/桌面/欢迎使用汐砚.md',WELCOME);await fs.writeFile('/桌面/示例网页.html',DEMO_HTML);await fs.writeFile('/文档/库存.csv','名称,数量,产地,备注\n端砚,3,广东肇庆,"老坑, 石眼"\n徽墨,12,安徽歙县,松烟\n宣纸,200,安徽泾县,四尺单宣\n湖笔,8,浙江湖州,兼毫\n');
  await fs.writeFile('/文档/笔记.txt','这是一份纯文本笔记。\n记事本支持撤销 / 重做、字号调整与自动保存。\n');await fs.writeFile('/文档/配置.json','{"name":"xiyan","theme":"inkstone-tide","version":1,"features":["opfs","indexeddb","mount"]}');
  await fs.mkdir('/图片/示例条漫');for(let i=1;i<=12;i++)await fs.writeFile(`/图片/示例条漫/${i}.svg`,mangaSVG(i));}catch(e){console.warn(e)}}

/* ---------- 启动（无假加载，直接进入） ---------- */
(async function boot(){
 if(!localStorage.getItem('xy:set')){try{const s=await kvGet('settings');if(s)S={...DEF,...s}}catch{}}applyS();
 $('#startBtn').innerHTML=`<svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="3.5" fill="var(--acc)" transform="rotate(-4 12 12)"/><path d="M6.5 9.5q2.75-2 5.5 0t5.5 0M6.5 13q2.75-2 5.5 0t5.5 0M6.5 16.5q2.75-2 5.5 0t5.5 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
 $('#startBtn').onclick=()=>toggleStart();$('#trayMount').innerHTML=ico('link',17);$('#trayMount').onclick=()=>mountLocal();$('#trayTheme').onclick=()=>{const th=document.documentElement.dataset.theme;S.theme=th==='dark'?'light':'dark';saveS()};
 const pk=$('#peek');pk.onclick=()=>{const vis=[...WM.wins.values()].filter(w=>!w.min);if(vis.length){WM._shown=vis;vis.forEach(minWin)}else{(WM._shown||[]).forEach(w=>WM.wins.has(w.id)&&restoreWin(w));WM._shown=null}document.body.classList.remove('peekall')};
 pk.onmouseenter=()=>{if(!S.peek)return;clearTimeout(peekT);peekT=setTimeout(()=>document.body.classList.add('peekall'),400)};pk.onmouseleave=()=>{clearTimeout(peekT);document.body.classList.remove('peekall')};
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s')e.preventDefault();if(e.altKey&&(e.key==='t'||e.key==='T')){$('#tbar').classList.toggle('pin');if(S.tbMode==='hide')document.body.classList.toggle('tb-hide')}});
 matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>S.theme==='auto'&&applyS());
 let dbok=true;try{await idb()}catch{dbok=false;Meta.ok=false}
 let opfs=null;try{const root=await navigator.storage.getDirectory();const fh=await root.getFileHandle('.xy-probe',{create:true});if(!fh.createWritable)throw 0;const w=await fh.createWritable();await w.write('ok');await w.close();opfs=new HandleFS(root,'opfs','OPFS')}catch{}
 const idbfs=dbok?new IDBFS():null;BK.opfs=opfs;BK.idb=idbfs;const primary=(S.backend==='idb'&&idbfs)||opfs||idbfs||new MemFS();BK.primary=primary;
 fs.mount('/',primary);const second=primary===opfs?idbfs:primary===idbfs?opfs:null;if(second)fs.mount('/mnt/'+second.id,second);
 if(primary.id==='mem')toast('浏览器禁用了持久化存储，当前使用临时内存（刷新后丢失）',{type:'err',ms:0});else if(S.backend==='opfs'&&!opfs)toast('OPFS 不可用，已自动降级为 IndexedDB',{ms:5000});
 await seed();initDesk();await renderDesk();applyWall();buildStart();initClock();renderTaskbar();restoreMounts();navigator.storage?.persist?.().catch(()=>{});
})();
