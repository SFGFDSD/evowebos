          <button class="btn sq" data-a="foldAll" title="折叠全部">${svg('sortD', 's')}</button>
          <button class="btn sq" data-a="unfoldAll" title="展开全部">${svg('sortA', 's')}</button>
          <div class="sepv"></div>
          <button class="btn" data-a="import">${svg('upload', 's')}导入</button>
          <button class="btn" data-a="export">${svg('download', 's')}导出</button>
          <button class="btn sq" data-a="clear" title="清空">${svg('trash', 's')}</button>
          <button class="btn sq" data-a="pop" title="在新窗口打开">${svg('globe', 's')}</button>
          <button class="btn sq" data-a="reload" title="刷新预览">${svg('refresh', 's')}</button>
          <button class="btn showM" data-a="mprev">${svg('eye', 's')}预览</button>
        </div>
        <div class="findbar">
          ${svg('search', 's')}
          <input class="inp" data-f="q" placeholder="查找" style="width:150px">
          <span class="mini" data-f="cnt">0/0</span>
          <button class="btn sq" data-f="prev" title="上一个 Shift+Enter">${svg('sortA', 's')}</button>
          <button class="btn sq" data-f="next" title="下一个 Enter / F3">${svg('sortD', 's')}</button>
          <button class="btn sq" data-f="case" title="区分大小写">Aa</button>
          <button class="btn sq" data-f="word" title="全词匹配">W</button>
          <button class="btn sq" data-f="re" title="正则表达式">.*</button>
          <input class="inp" data-f="r" placeholder="替换为" style="width:150px">
          <button class="btn" data-f="rep">替换</button>
          <button class="btn" data-f="repAll">全部替换</button>
          <button class="btn sq" data-f="close">${svg('close', 's')}</button>
        </div>
        <div class="edWrap">
          <div class="edPane"><textarea></textarea></div>
          <div class="edSplit"></div>
          <div class="edPrev"><iframe sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox"></iframe></div>
        </div>
        <div class="statusbar">
          <span data-s="pos">行 1, 列 1</span><span data-s="sel"></span><span data-s="lines">0 行</span>
          <span data-s="chars">0 字符</span><span data-s="lang">${MODE_LABEL[mode] || ''}</span><span>UTF-8</span>
        </div>
        <input type="file" data-a="fileinput" hidden>`;

      const wrap = body.querySelector('.edWrap'), pane = body.querySelector('.edPane'),
        prev = body.querySelector('.edPrev'), split = body.querySelector('.edSplit'),
        iframe = prev.querySelector('iframe'), findbar = body.querySelector('.findbar');
      ta = pane.querySelector('textarea');
      ta.value = opts.content != null ? opts.content : '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>硯 OS 新页面</title>\n  <style>\n    body{font-family:system-ui;background:#12100f;color:#ece3d4;display:grid;place-items:center;height:100vh;margin:0}\n    h1{font-weight:400;letter-spacing:.2em;color:#d9503c}\n  </style>\n</head>\n<body>\n  <h1>硯</h1>\n</body>\n</html>';

      /* ---------- 内核初始化 ---------- */
      if (window.CodeMirror) {
        editor = CodeMirror.fromTextArea(ta, {
          mode, theme: 'material-darker', lineNumbers: true, lineWrapping: true, styleActiveLine: true,
          showTrailingSpace: true, matchBrackets: true, autoCloseBrackets: true, matchTags: { bothTags: true },
          autoCloseTags: true, foldGutter: true, indentUnit: 2, tabSize: 2,
          gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
          extraKeys: {
            'Ctrl-S': () => { save(); return false; }, 'Cmd-S': () => { save(); return false; },
            'Ctrl-Enter': () => refreshPreview(true), 'Cmd-Enter': () => refreshPreview(true),
            'Ctrl-F': () => openFind(false), 'Cmd-F': () => openFind(false),
            'Ctrl-H': () => openFind(true), 'Cmd-H': () => openFind(true),
            'Shift-Ctrl-F': () => format(), 'Shift-Cmd-F': () => format(),
            'Ctrl-Y': cm => cm.redo(), 'F3': () => jump(1), 'Esc': () => closeFind()
          }
        });
        editor.on('change', () => { schedule(); updateStatus(); if (findbar.classList.contains('on')) runFind(); });
        editor.on('cursorActivity', updateStatus);
      } else {
        ta.style.cssText = 'width:100%;height:100%;background:#12100f;color:#ece3d4;border:0;outline:0;padding:12px;font-family:var(--ff-mono);font-size:13px;resize:none';
        ta.addEventListener('input', () => { schedule(); updateStatus(); });
        toast('CodeMirror 未加载，已降级为基础编辑器', 'err');
      }
      const getVal = () => editor ? editor.getValue() : ta.value;
      const setVal = v => { editor ? editor.setValue(v) : (ta.value = v); schedule(); updateStatus(); };

      /* ---------- 预览 ---------- */
      let pT;
      function schedule() { clearTimeout(pT); pT = setTimeout(() => refreshPreview(), 420); }
      function buildDoc() {
        const src = getVal();
        if (mode === 'htmlmixed' || mode === 'xml') return src;
        if (mode === 'css') return `<!DOCTYPE html><html><head><style>${src}</style></head><body style="font-family:system-ui;padding:18px"><h1>标题 H1</h1><p>段落文本 paragraph.</p><button>按钮</button><div class="box">.box</div><ul><li>列表项</li><li>列表项</li></ul></body></html>`;
        if (mode === 'javascript') return `<!DOCTYPE html><html><body style="font-family:ui-monospace;padding:14px;background:#111;color:#ddd"><pre id="out"></pre><script>const o=document.getElementById('out');const _l=console.log;console.log=(...a)=>{o.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'\\n';_l(...a)};try{${src}\n}catch(e){o.textContent+='\\n⛔ '+e}<\/script></body></html>`;
        if (mode === 'markdown') return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:system-ui;max-width:760px;margin:0 auto;padding:26px;line-height:1.75;color:#222}pre{background:#f4f0e8;padding:12px;border-radius:8px;overflow:auto}code{background:#f4f0e8;padding:1px 5px;border-radius:4px}blockquote{border-left:3px solid #d9503c;margin:0;padding-left:14px;color:#666}</style></head><body>${mdToHtml(src)}</body></html>`;
        if (mode === 'application/json') { let t; try { t = JSON.stringify(JSON.parse(src), null, 2); } catch (e) { t = '解析错误: ' + e.message; } return `<!DOCTYPE html><html><body style="font-family:ui-monospace;background:#12100f;color:#8fd6b4;padding:14px"><pre>${esc(t)}</pre></body></html>`; }
        return `<pre>${esc(src)}</pre>`;
      }
      function refreshPreview() {
        const doc = buildDoc();
        try {
          const d = iframe.contentDocument;
          d.open(); d.write(doc); d.close();
        } catch (e) {
          const url = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
          iframe.src = url; setTimeout(() => URL.revokeObjectURL(url), 12000);
        }
      }

      /* ---------- 状态栏 ---------- */
      function updateStatus() {
        const q = s => body.querySelector(`[data-s=${s}]`);
        const val = getVal();
        if (editor) {
          const c = editor.getCursor();
          q('pos').textContent = `行 ${c.line + 1}, 列 ${c.ch + 1}`;
          const s = editor.getSelection();
          q('sel').textContent = s ? `已选 ${s.length} 字符` : '';
          q('lines').textContent = editor.lineCount() + ' 行';
        } else { q('lines').textContent = val.split('\n').length + ' 行'; }
        q('chars').textContent = val.length + ' 字符';
        q('lang').textContent = MODE_LABEL[mode] || mode;
      }

      /* ---------- 语言模式 ---------- */
      const modeSel = body.querySelector('[data-a=mode]');
      modeSel.value = mode;
      modeSel.onchange = () => setMode(modeSel.value);
      function setMode(m) { mode = m; modeSel.value = m; if (editor) editor.setOption('mode', m); updateStatus(); refreshPreview(); }

      /* ---------- 格式化 ---------- */
      function format() {
        const val = getVal(); let out = val;
        const o = { indent_size: 2, indent_char: ' ', max_preserve_newlines: 2, preserve_newlines: true, end_with_newline: true, wrap_line_length: 120, indent_inner_html: true };
        try {
          if (mode === 'htmlmixed' || mode === 'xml') out = (window.html_beautify || (window.beautifier && beautifier.html))(val, o);
          else if (mode === 'css') out = (window.css_beautify || (window.beautifier && beautifier.css))(val, o);
          else if (mode === 'javascript') out = (window.js_beautify || window.beautify)(val, o);
          else if (mode === 'application/json') out = JSON.stringify(JSON.parse(val), null, 2);
          else return toast('当前语言不支持格式化');
        } catch (e) { return toast('格式化失败：' + e.message, 'err'); }
        if (editor) { const c = editor.getCursor(), sc = editor.getScrollInfo(); editor.setValue(out); editor.setCursor(c); editor.scrollTo(sc.left, sc.top); }
        else ta.value = out;
        toast('已格式化', 'ok'); updateStatus(); refreshPreview();
      }

      /* ---------- 查找替换 ---------- */
      const F = s => body.querySelector(`[data-f=${s}]`);
      let optCase = false, optWord = false, optRe = false;
      function openFind(focusRep) {
        findbar.classList.add('on');
        if (editor && editor.getSelection() && !editor.getSelection().includes('\n')) F('q').value = editor.getSelection();
        (focusRep ? F('r') : F('q')).focus();
        runFind();
      }
      function closeFind() { findbar.classList.remove('on'); clearMarks(); editor && editor.focus(); }
      function clearMarks() { marks.forEach(m => m.clear()); marks = []; hits = []; hitIdx = -1; F('cnt').textContent = '0/0'; }
      function buildRe() {
        const q = F('q').value; if (!q) return null;
        let src = optRe ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (optWord) src = '\\b' + src + '\\b';
        try { return new RegExp(src, 'g' + (optCase ? '' : 'i')); } catch (e) { F('cnt').textContent = '无效正则'; return false; }
      }
      function runFind(keepIdx) {
        const keep = hitIdx;
        clearMarks();
        if (!editor) return;
        const re = buildRe(); if (!re) return;
        const text = editor.getValue(); let m, guard = 0;
        while ((m = re.exec(text)) && guard++ < 8000) {
          if (m[0] === '') { re.lastIndex++; continue; }
          hits.push({ from: editor.posFromIndex(m.index), to: editor.posFromIndex(m.index + m[0].length) });
        }
        hits.forEach(h => marks.push(editor.markText(h.from, h.to, { className: 'cm-search-hit' })));
        if (hits.length) { hitIdx = keepIdx ? Math.max(0, Math.min(keep, hits.length - 1)) : 0; focusHit(); }
        F('cnt').textContent = `${hits.length ? hitIdx + 1 : 0}/${hits.length}`;
      }
      function focusHit() {
        if (hitIdx < 0 || !hits[hitIdx]) return;
        const h = hits[hitIdx];
        marks.forEach(m => { const r = m.find(); if (r) { m.clear(); } });
        marks = hits.map((x, i) => editor.markText(x.from, x.to, { className: i === hitIdx ? 'cm-search-cur' : 'cm-search-hit' }));
        editor.setSelection(h.from, h.to);
        editor.scrollIntoView({ from: h.from, to: h.to }, 80);
        F('cnt').textContent = `${hitIdx + 1}/${hits.length}`;
      }
      function jump(d) { if (!hits.length) { runFind(); return; } hitIdx = (hitIdx + d + hits.length) % hits.length; focusHit(); }
      F('next').onclick = () => jump(1); F('prev').onclick = () => jump(-1);
      F('close').onclick = closeFind;
      F('q').oninput = () => runFind();
      F('q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); jump(e.shiftKey ? -1 : 1); } if (e.key === 'Escape') closeFind(); };
      F('r').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doReplace(); } if (e.key === 'Escape') closeFind(); };
      ['case', 'word', 're'].forEach(k => F(k).onclick = () => {
        if (k === 'case') optCase = !optCase; if (k === 'word') optWord = !optWord; if (k === 're') optRe = !optRe;
        F(k).classList.toggle('on'); runFind();
      });
      function doReplace() {
        if (!editor || hitIdx < 0 || !hits[hitIdx]) return;
        const h = hits[hitIdx];
        editor.replaceRange(F('r').value, h.from, h.to);
        runFind(true);
      }
      F('rep').onclick = doReplace;
      F('repAll').onclick = () => {
        if (!editor) return; const re = buildRe(); if (!re) return;
        const n = hits.length;
        editor.setValue(editor.getValue().replace(re, F('r').value));
        toast(`已替换 ${n} 处`, 'ok'); runFind();
      };

      /* ---------- 保存 / 导入 / 导出 ---------- */
      async function save() {
        let target = savePath;
        if (!target) {
          const nm = await Modal.prompt('保存到虚拟文件系统', name);
          if (!nm) return;
          target = pathUtil.join(saveDir || '/桌面', nm);
          savePath = target;
        }
        try {
          await fs.writeFile(target, getVal());
          toast('已保存 ' + pathUtil.basename(target), 'ok');
          win.setTitle('HTML编辑器 · ' + pathUtil.basename(target));
          window.Desktop.refresh();
          window.refreshExplorers(pathUtil.dirname(target));
        } catch (e) { toast('保存失败：' + e.message, 'err'); }
      }
      const fi = body.querySelector('[data-a=fileinput]');
      fi.onchange = async () => {
        const f = fi.files[0]; if (!f) return;
        setVal(await f.text());
        const m = EXT2MODE[pathUtil.extname(f.name)]; if (m) setMode(m);
        win.setTitle('HTML编辑器 · ' + f.name); savePath = null; fi.value = '';
      };

      /* ---------- 工具栏 ---------- */
      const A = s => body.querySelector(`[data-a=${s}]`);
      A('run').onclick = () => { refreshPreview(); toast('已运行'); };
      A('reload').onclick = () => refreshPreview();
      A('save').onclick = save;
      A('undo').onclick = () => editor ? editor.undo() : document.execCommand('undo');
      A('redo').onclick = () => editor ? editor.redo() : document.execCommand('redo');
      A('fmt').onclick = format;
      A('find').onclick = () => openFind(false);
      A('import').onclick = () => fi.click();
      A('export').onclick = () => UI.downloadBlob((name.replace(/\.[^.]+$/, '') || '未命名') + (MODE2EXT[mode] || '.txt'), new Blob([getVal()], { type: 'text/plain;charset=utf-8' }));
      A('clear').onclick = async () => { if (await Modal.confirm('清空内容', '确定清空编辑器全部内容？')) setVal(''); };
      A('pop').onclick = () => { const u = URL.createObjectURL(new Blob([buildDoc()], { type: 'text/html' })); window.open(u, '_blank'); setTimeout(() => URL.revokeObjectURL(u), 20000); };
      A('foldAll').onclick = () => { if (!editor) return; editor.operation(() => { for (let i = 0; i < editor.lineCount(); i++) editor.foldCode({ line: i, ch: 0 }, null, 'fold'); }); };
      A('unfoldAll').onclick = () => { if (!editor) return; editor.operation(() => { for (let i = 0; i < editor.lineCount(); i++) editor.foldCode({ line: i, ch: 0 }, null, 'unfold'); }); };
      A('mprev').onclick = () => { wrap.classList.toggle('mprev'); refreshPreview(); };

      /* ---------- 分割条 ---------- */
      split.addEventListener('pointerdown', e => {
        e.preventDefault(); split.setPointerCapture(e.pointerId);
        const wr = wrap.getBoundingClientRect();
        const mv = ev => {
          const x = ev.clientX - wr.left;
          const pw = Math.max(120, wr.width - Math.max(200, Math.min(x, wr.width - 120)) - 6);
          prev.style.width = pw + 'px';
        };
        const up = () => { split.removeEventListener('pointermove', mv); split.removeEventListener('pointerup', up); editor && editor.refresh(); };
        split.addEventListener('pointermove', mv); split.addEventListener('pointerup', up);
      });

      win.on('resize', () => editor && editor.refresh());
      win.on('close', () => { try { editor && editor.toTextArea(); } catch (e) {} editor = null; });
      body.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(false); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') { e.preventDefault(); openFind(true); }
      });
      setMode(mode); updateStatus(); refreshPreview();
      setTimeout(() => editor && editor.refresh(), 120);
    }
  });
}
window.openEditor = openEditor;
window.mdToHtml = mdToHtml;
registerApp({ id: 'editor', name: 'HTML 编辑器', icon: 'code', run: a => openEditor(a || {}) });
})();
</script>
<script>

(function () {

          <div data-a="prevbox" hidden style="width:44%;border-left:1px solid var(--line-2);background:#fff"><iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups" style="width:100%;height:100%;border:0"></iframe></div>

      };

      }
      body.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(false); } });
      win.on('close', () => { if (dirty) toast('记事本内容未保存', 'err'); });
      upd();
    }
  });
}

/* ───────── 表格（CSV / TSV 双视图） ───────── */
function openSheet(path, text) {
  const name = pathUtil.basename(path || '表格.csv');
  const sepChar = /\.tsv$/i.test(name) ? '\t' : ',';
  WM.open({
    title: '表格 · ' + name, icon: 'table', w: 880, h: 560, type: 'sheet',
    build(body, win) {
      body.innerHTML = `
        <div class="tbar">
          <button class="btn on" data-v="table">${svg('table', 's')}表格视图</button>
          <button class="btn" data-v="text">${svg('text', 's')}文本视图</button>
          <div class="sepv"></div>
          <button class="btn pri" data-a="save">${svg('save', 's')}保存</button>
          <button class="btn" data-a="addRow">${svg('plus', 's')}加行</button>
          <button class="btn" data-a="export">${svg('download', 's')}导出</button>
          <div style="flex:1"></div><span class="mini" data-a="info"></span>
        </div>
        <div class="sheet" data-p="table"></div>
        <textarea data-p="text" hidden spellcheck="false" style="flex:1;background:transparent;border:0;outline:0;resize:none;padding:14px;font-family:var(--ff-mono);font-size:13px;color:var(--text)"></textarea>`;
      const tblBox = body.querySelector('[data-p=table]'), txt = body.querySelector('[data-p=text]');
      txt.value = text || '';
      function parse(t) {
        const rows = []; let row = [], cell = '', q = false;
        for (let i = 0; i < t.length; i++) {
          const c = t[i];
          if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
          else if (c === '"') q = true;
          else if (c === sepChar) { row.push(cell); cell = ''; }
          else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
          else if (c !== '\r') cell += c;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }
      const ser = rows => rows.map(r => r.map(c => /[",\n\t]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join(sepChar)).join('\n');
      function renderTable() {
        const rows = parse(txt.value);
        if (!rows.length) { tblBox.innerHTML = '<div class="empty">空表格</div>'; return; }
        const cols = Math.max(...rows.map(r => r.length));
        let h = '<table><thead><tr><th style="min-width:38px">#</th>';
        for (let c = 0; c < cols; c++) h += `<th>${esc(rows[0][c] || String.fromCharCode(65 + c % 26))}</th>`;
        h += '</tr></thead><tbody>';
        for (let r = 1; r < rows.length; r++) {
          h += `<tr><td style="color:var(--faint)">${r}</td>`;
          for (let c = 0; c < cols; c++) h += `<td contenteditable data-r="${r}" data-c="${c}">${esc(rows[r][c] || '')}</td>`;
          h += '</tr>';
        }
        tblBox.innerHTML = h + '</tbody></table>';
        body.querySelector('[data-a=info]').textContent = `${rows.length - 1} 行 × ${cols} 列`;
        tblBox.querySelectorAll('td[contenteditable]').forEach(td => td.onblur = () => {
          const rows2 = parse(txt.value), r = +td.dataset.r, c = +td.dataset.c;
          while (rows2.length <= r) rows2.push([]);
          while (rows2[r].length <= c) rows2[r].push('');
          rows2[r][c] = td.textContent;
          txt.value = ser(rows2);
        });
      }
      body.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
        const v = b.dataset.v;
        body.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
        tblBox.hidden = v !== 'table'; txt.hidden = v !== 'text';
        if (v === 'table') renderTable();
      });
      body.querySelector('[data-a=addRow]').onclick = () => { txt.value += '\n'; renderTable(); };
      body.querySelector('[data-a=save]').onclick = async () => { await fs.writeFile(path, txt.value); toast('已保存', 'ok'); window.refreshExplorers(pathUtil.dirname(path)); };
      body.querySelector('[data-a=export]').onclick = () => UI.downloadBlob(name, new Blob([txt.value], { type: 'text/csv;charset=utf-8' }));
      renderTable();
    }
  });
}

/* ───────── 图片查看器 ───────── */
async function openImage(path) {
  const url = await fs.readURL(path);
  let scale = 1, rot = 0, tx = 0, ty = 0;
  WM.open({
    title: '图片查看器 · ' + pathUtil.basename(path), icon: 'image', w: 800, h: 580, type: 'image',
    build(body, win) {
      body.innerHTML = `
        <div class="tbar">
          <button class="btn sq" data-a="out">−</button><span class="mini" data-a="z">100%</span><button class="btn sq" data-a="in">+</button>
          <button class="btn" data-a="fit">适应</button><button class="btn" data-a="one">1:1</button>
          <button class="btn sq" data-a="rot" title="旋转">${svg('refresh', 's')}</button>
          <div class="sepv"></div>
          <button class="btn" data-a="manga">${svg('book', 's')}漫画模式</button>
          <button class="btn" data-a="export">${svg('download', 's')}导出</button>
          <div style="flex:1"></div><span class="mini" data-a="meta"></span>
        </div>
        <div class="imgv"><img src="${url}" alt=""></div>`;
      const img = body.querySelector('img'), box = body.querySelector('.imgv');
      const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale}) rotate(${rot}deg)`; body.querySelector('[data-a=z]').textContent = Math.round(scale * 100) + '%'; };
      img.onload = async () => { const st = await fs.stat(path); body.querySelector('[data-a=meta]').textContent = `${img.naturalWidth}×${img.naturalHeight} · ${fmtSize(st.size)}`; };
      body.querySelector('[data-a=in]').onclick = () => { scale = Math.min(12, scale * 1.25); apply(); };
      body.querySelector('[data-a=out]').onclick = () => { scale = Math.max(.05, scale / 1.25); apply(); };
      body.querySelector('[data-a=one]').onclick = () => { scale = 1; tx = ty = 0; apply(); };
      body.querySelector('[data-a=fit]').onclick = () => { scale = 1; tx = ty = 0; apply(); };
      body.querySelector('[data-a=rot]').onclick = () => { rot = (rot + 90) % 360; apply(); };
      body.querySelector('[data-a=manga]').onclick = () => openManga(path);
      body.querySelector('[data-a=export]').onclick = () => UI.exportPath(path);
      box.addEventListener('wheel', e => { e.preventDefault(); scale = Math.max(.05, Math.min(12, scale * (e.deltaY < 0 ? 1.12 : .89))); apply(); }, { passive: false });
      let drag = null;
      box.addEventListener('pointerdown', e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; box.setPointerCapture(e.pointerId); });
      box.addEventListener('pointermove', e => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
      box.addEventListener('pointerup', () => drag = null);
      let pinch = null;
      box.addEventListener('touchmove', e => {
        if (e.touches.length !== 2) return; e.preventDefault();
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (pinch) { scale = Math.max(.05, Math.min(12, scale * d / pinch)); apply(); }
        pinch = d;
      }, { passive: false });
      box.addEventListener('touchend', () => pinch = null);
      win.on('close', () => URL.revokeObjectURL(url));
    }
  });
}

/* ───────── 漫画阅读器 ───────── */
async function openManga(startPath) {
  const dir = startPath.slice(0, startPath.lastIndexOf('/')) || '/';
  let files;
  try { files = (await fs.readdir(dir)).filter(f => f.kind === 'file' && IMG_RE.test(f.name)); }
  catch (e) { return Modal.alert('无法打开漫画', '读取目录失败：' + e.message); }
  if (!files.length) return Modal.alert('无法打开漫画', '该目录下没有图片文件。');
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

  WM.open({
    title: '漫画阅读器 · ' + pathUtil.basename(dir), icon: 'book', w: 900, h: 700, type: 'manga',
    build(body, win) {
      body.innerHTML = `
        <div class="tbar">
          <span class="mini" data-a="idx">0 / ${files.length}</span>
          <div class="sepv"></div>
          <button class="btn sq" data-a="prev" title="上一页">${svg('sortA', 's')}</button>
          <button class="btn sq" data-a="next" title="下一页">${svg('sortD', 's')}</button>
          <button class="btn" data-a="top">回到顶部</button>
          <button class="btn" data-a="width">宽度</button>
          <div style="flex:1"></div>
          <button class="btn" data-a="fs">${svg('expand', 's')}全屏沉浸</button>
        </div>
        <div class="manga"><div class="empty" style="color:#666">正在载入 ${files.length} 页…</div></div>`;
      const view = body.querySelector('.manga');
      const urls = [];
      let maxW = 1000;
      (async () => {
        const bufs = await Promise.all(files.map(async f => {           // 并行读取
          try { return { name: f.name, blob: await fs.readBlob(pathUtil.join(dir, f.name)) }; }
          catch (e) { console.warn('跳过', f.name, e); return null; }
        }));
        view.innerHTML = '';
        let target = null;
        bufs.forEach((b, i) => {                                        // 按序插入
          if (!b) return;
          const u = URL.createObjectURL(b.blob); urls.push(u);
          const im = new Image();
          im.src = u; im.alt = b.name; im.loading = 'lazy';
          im.style.cssText = 'width:100%;max-width:' + maxW + 'px;display:block;pointer-events:none';
          im.dataset.i = i;
          im.onerror = () => im.remove();
          view.appendChild(im);
          if (pathUtil.join(dir, b.name) === pathUtil.norm(startPath)) target = im;
        });
        body.querySelector('[data-a=idx]').textContent = `1 / ${view.children.length}`;
        if (target) setTimeout(() => target.scrollIntoView({ block: 'start' }), 80);
      })();
      view.addEventListener('scroll', () => {
        const imgs = [...view.querySelectorAll('img')];
        const top = view.scrollTop;
        let cur = 1;
        imgs.forEach((im, i) => { if (im.offsetTop - view.offsetTop <= top + 60) cur = i + 1; });
        body.querySelector('[data-a=idx]').textContent = `${cur} / ${imgs.length}`;
      });
      const step = d => { const imgs = [...view.querySelectorAll('img')]; const top = view.scrollTop; let idx = 0; imgs.forEach((im, i) => { if (im.offsetTop - view.offsetTop <= top + 60) idx = i; }); const t = imgs[Math.max(0, Math.min(imgs.length - 1, idx + d))]; t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      body.querySelector('[data-a=prev]').onclick = () => step(-1);
      body.querySelector('[data-a=next]').onclick = () => step(1);
      body.querySelector('[data-a=top]').onclick = () => view.scrollTo({ top: 0, behavior: 'smooth' });
      body.querySelector('[data-a=width]').onclick = () => { maxW = maxW === 1000 ? 1600 : maxW === 1600 ? 700 : 1000; view.querySelectorAll('img').forEach(i => i.style.maxWidth = maxW + 'px'); toast('页宽 ' + maxW + 'px'); };
      body.querySelector('[data-a=fs]').onclick = () => win.enterImmersive('fs-manga');
      view.addEventListener('keydown', e => { if (e.key === 'ArrowDown') step(1); if (e.key === 'ArrowUp') step(-1); });
      win.on('close', () => setTimeout(() => urls.forEach(u => URL.revokeObjectURL(u)), 500));
    }
  });
}

/* ───────── 媒体播放器 ───────── */
async function openMedia(path, kind) {
  const dir = pathUtil.dirname(path);
  const isVideo = kind === 'video';
  const url = await fs.readURL(path);
  WM.open({
    title: (isVideo ? '视频' : '音乐') + ' · ' + pathUtil.basename(path), icon: isVideo ? 'video' : 'audio',
    w: isVideo ? 800 : 460, h: isVideo ? 520 : 260, type: 'media',
    build(body, win) {
      body.innerHTML = `
        <div class="tbar"><span class="mini" data-a="nm">${esc(pathUtil.basename(path))}</span><div style="flex:1"></div>
          <button class="btn sq" data-a="prev">${svg('back', 's')}</button><button class="btn sq" data-a="next">${svg('fwd', 's')}</button>
          <button class="btn" data-a="export">${svg('download', 's')}导出</button></div>
        <div class="mediaWrap">${isVideo ? `<video src="${url}" controls autoplay playsinline></video>` : `<div style="text-align:center;width:100%">
          <div style="width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(217,80,60,.3),transparent 70%);border:1px solid var(--line)">${svg('audio', 'l')}</div>
          <audio src="${url}" controls autoplay style="width:100%"></audio></div>`}</div>`;
      const m = body.querySelector(isVideo ? 'video' : 'audio');
      let playlist = [], idx = 0;
      (async () => {
        const l = await fs.list(dir);
        playlist = l.filter(f => !f.isDir && UI.ftype(f.name).cat === (isVideo ? 'video' : 'audio')).sort((a, b) => UI.natCmp(a.name, b.name));
        idx = playlist.findIndex(f => f.path === pathUtil.norm(path));
      })();
      const jump = async d => {
        if (!playlist.length) return;
        idx = (idx + d + playlist.length) % playlist.length;
        const u = await fs.readURL(playlist[idx].path);
        m.src = u; m.play();
        body.querySelector('[data-a=nm]').textContent = playlist[idx].name;
        win.setTitle((isVideo ? '视频' : '音乐') + ' · ' + playlist[idx].name);
      };
      body.querySelector('[data-a=prev]').onclick = () => jump(-1);
      body.querySelector('[data-a=next]').onclick = () => jump(1);
      body.querySelector('[data-a=export]').onclick = () => UI.exportPath(path);
      m.addEventListener('ended', () => jump(1));
      win.on('close', () => { m.pause(); URL.revokeObjectURL(url); });
    }
  });
}

/* ───────── 网页浏览器 ───────── */
async function openBrowser(o = {}) {
  let url = o.url || '';
  if (o.path) url = await fs.readURL(o.path);
  WM.open({
    title: '网页浏览器', icon: 'globe', w: 960, h: 640, type: 'browser',
    build(body, win) {
      body.innerHTML = `
        <div class="tbar">
          <button class="btn sq" data-a="back">${svg('back', 's')}</button>
          <button class="btn sq" data-a="fwd">${svg('fwd', 's')}</button>
          <button class="btn sq" data-a="reload">${svg('refresh', 's')}</button>
          <button class="btn sq" data-a="home">${svg('desktop', 's')}</button>
          <input class="inp" data-a="url" style="flex:1;min-width:80px" placeholder="输入网址或 VFS 路径，回车访问" value="${esc(o.url || (o.path || ''))}">
          <button class="btn" data-a="go">${svg('fwd', 's')}前往</button>
          <button class="btn sq" data-a="tab" title="在系统浏览器打开">${svg('globe', 's')}</button>
        </div>
        <iframe data-a="fr" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-presentation" style="flex:1;border:0;background:#fff"></iframe>`;
      const fr = body.querySelector('[data-a=fr]'), inp = body.querySelector('[data-a=url]');
      const hist = []; let hi = -1;
      const home = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
        body{margin:0;height:100vh;display:grid;place-items:center;background:#12100f;color:#ece3d4;font-family:system-ui}
        .w{text-align:center}.s{font-size:66px;color:#d9503c;line-height:1}
        p{color:#9d9083;font-size:13px;letter-spacing:.18em;margin-top:14px}
        a{color:#d8a441;text-decoration:none;margin:0 9px;font-size:13px}</style></head>
        <body><div class="w"><div class="s">硯</div><p>INKSTONE BROWSER</p>
        <div style="margin-top:18px"><a href="https://example.com" target="_top">example.com</a><a href="https://developer.mozilla.org" target="_top">MDN</a><a href="https://wikipedia.org" target="_top">维基百科</a></div>
        <p style="font-size:11px;opacity:.6;max-width:420px;margin:22px auto 0">提示：部分站点通过 X-Frame-Options 禁止被嵌入。可在地址栏输入 VFS 路径（如 /桌面/index.html）来预览本地网页。</p></div></body></html>`;
      async function nav(u, push = true) {
        if (!u) { const d = fr.contentDocument; fr.removeAttribute('src'); d.open(); d.write(home); d.close(); return; }
        let real = u;
        if (u.startsWith('/')) { try { real = await fs.readURL(u); } catch (e) { return toast('找不到文件：' + u, 'err'); } }
        else if (!/^(https?|blob|data):/i.test(u)) real = 'https://' + u;
        fr.src = real;
        if (push) { hist.splice(hi + 1); hist.push(u); hi = hist.length - 1; }
        inp.value = u; win.setTitle('网页浏览器 · ' + u.slice(0, 40));
      }
      body.querySelector('[data-a=go]').onclick = () => nav(inp.value.trim());
      inp.onkeydown = e => { if (e.key === 'Enter') nav(inp.value.trim()); };
      body.querySelector('[data-a=back]').onclick = () => { if (hi > 0) { hi--; nav(hist[hi], false); } };
      body.querySelector('[data-a=fwd]').onclick = () => { if (hi < hist.length - 1) { hi++; nav(hist[hi], false); } };
      body.querySelector('[data-a=reload]').onclick = () => { const s = fr.src; fr.src = 'about:blank'; setTimeout(() => fr.src = s, 40); };
      body.querySelector('[data-a=home]').onclick = () => { hi = -1; hist.length = 0; nav(''); inp.value = ''; };
      body.querySelector('[data-a=tab]').onclick = () => fr.src && window.open(fr.src, '_blank');
      if (url) { fr.src = url; inp.value = o.path || o.url || ''; hist.push(o.path || o.url); hi = 0; } else nav('');
    }
  });
}

/* ───────── 通用二进制 / 十六进制查看 ───────── */
async function openHex(path) {
  const buf = new Uint8Array((await fs.readFile(path)).slice(0, 65536));
  let out = '';
  for (let i = 0; i < buf.length; i += 16) {
    const row = [...buf.slice(i, i + 16)];
    out += i.toString(16).padStart(8, '0') + '  ' +
      row.map(b => b.toString(16).padStart(2, '0')).join(' ').padEnd(48) + ' |' +
      row.map(b => b >= 32 && b < 127 ? String.fromCharCode(b) : '.').join('') + '|\n';
  }
  WM.open({
    title: '十六进制 · ' + pathUtil.basename(path), icon: 'chip', w: 720, h: 520,
    build(b) { b.innerHTML = `<div class="term" style="user-select:text"><pre style="margin:0;font-size:12px">${esc(out)}</pre></div>`; }
  });
}

<script>
/* ══════════════════ 硯 OS · 计算器 / 画板 / 终端 / 设置 / 虚拟机 ══════════════════ */
(function () {
'use strict';
const { el, svg, esc, fmtSize, fmtDate } = UI;

/* ───────── 计算器 ───────── */
function openCalc() {
  WM.open({
    title: '计算器', icon: 'calc', w: 330, h: 460, type: 'calc', single: 'calc',
    build(body) {
      const keys = [['C', 'fn'], ['±', 'fn'], ['%', 'fn'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'],
      ['4'], ['5'], ['6'], ['−', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['√', 'fn'], ['0'], ['.'], ['=', 'eq']];
      body.innerHTML = `<div class="calc"><div class="calcDisp"><div class="hist"></div><div class="val">0</div></div>
        <div class="calcKeys">${keys.map(([k, c]) => `<button class="${c || ''}" data-k="${k}">${k}</button>`).join('')}</div></div>`;
      const disp = body.querySelector('.val'), hist = body.querySelector('.hist');
      let cur = '0', prev = null, op = null, fresh = true;
      const show = () => disp.textContent = cur.length > 14 ? (+cur).toPrecision(11) : cur;
      const calc = () => {
        const a = parseFloat(prev), b = parseFloat(cur);
        const r = op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : op === '÷' ? (b === 0 ? NaN : a / b) : b;
        return isFinite(r) ? String(+r.toFixed(10)) : '错误';
      };
      const press = k => {
        if (/[0-9]/.test(k)) { cur = fresh || cur === '0' ? k : cur + k; fresh = false; }
        else if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
        else if (k === 'C') { cur = '0'; prev = null; op = null; fresh = true; hist.textContent = ''; }
        else if (k === '±') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
        else if (k === '%') cur = String(parseFloat(cur) / 100);
        else if (k === '√') cur = String(Math.sqrt(parseFloat(cur)));
        else if (['+', '−', '×', '÷'].includes(k)) {
          if (op && !fresh) { cur = calc(); }
          prev = cur; op = k; fresh = true; hist.textContent = `${prev} ${op}`;
        } else if (k === '=') { if (op) { hist.textContent = `${prev} ${op} ${cur} =`; cur = calc(); op = null; prev = null; fresh = true; } }
        show();
      };
      body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
      body.tabIndex = 0;
      body.addEventListener('keydown', e => {
        const m = { '/': '÷', '*': '×', '-': '−', '+': '+', 'Enter': '=', '=': '=', 'Escape': 'C', 'c': 'C', '%': '%' };
        const k = /[0-9.]/.test(e.key) ? e.key : m[e.key];
        if (k) { e.preventDefault(); press(k); }
        if (e.key === 'Backspace') { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; show(); }
      });
      setTimeout(() => body.focus(), 60);
    }
  });
}

function openPaint(o = {}) {

      body.innerHTML = `
        <div class="tbar">
          <input type="color" value="#d9503c" data-a="color" style="width:34px;height:29px;border:1px solid var(--line-2);border-radius:7px;background:transparent;padding:2px;cursor:pointer">

          <span class="mini" data-a="sz">4 px</span>
          <div class="sepv"></div>
          <button class="btn on" data-t="pen">${svg('brush', 's')}画笔</button>
          <button class="btn" data-t="eraser">橡皮</button>
          <button class="btn" data-t="line">直线</button>
          <button class="btn" data-t="rect">矩形</button>
          <button class="btn" data-t="circle">圆形</button>

          <button class="btn pri" data-a="save">${svg('save', 's')}保存到 VFS</button>
          <button class="btn" data-a="export">${svg('download', 's')}导出 PNG</button>
        </div>
        <div class="paintWrap"><canvas width="1200" height="800" style="max-width:100%;max-height:100%;background:#fff;touch-action:none;cursor:crosshair"></canvas></div>`;
      const cv = body.querySelector('canvas'), ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.lineCap = ctx.lineJoin = 'round';
      let tool = 'pen', drawing = false, sx = 0, sy = 0, snap = null;
      const undoStack = [];
      if (o.path) fs.readURL(o.path).then(u => { const im = new Image(); im.onload = () => { ctx.drawImage(im, 0, 0, cv.width, cv.height); }; im.src = u; });
      const col = () => body.querySelector('[data-a=color]').value;
      const size = () => +body.querySelector('[data-a=size]').value;
      const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
      body.querySelector('[data-a=size]').oninput = e => body.querySelector('[data-a=sz]').textContent = e.target.value + ' px';
      body.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tool = b.dataset.t; body.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); });
      cv.addEventListener('pointerdown', e => {
        cv.setPointerCapture(e.pointerId); drawing = true;
        undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undoStack.length > 22) undoStack.shift();
        const p = pos(e); sx = p.x; sy = p.y;
        snap = ctx.getImageData(0, 0, cv.width, cv.height);
        ctx.beginPath(); ctx.moveTo(sx, sy);
      });
      cv.addEventListener('pointermove', e => {
        if (!drawing) return;
        const p = pos(e);
        ctx.strokeStyle = tool === 'eraser' ? '#fff' : col();
        ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = size();
        if (tool === 'pen' || tool === 'eraser') { ctx.lineTo(p.x, p.y); ctx.stroke(); }
        else {
          ctx.putImageData(snap, 0, 0); ctx.beginPath();
          if (tool === 'line') { ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); }
          else if (tool === 'rect') ctx.rect(sx, sy, p.x - sx, p.y - sy);
          else ctx.arc(sx, sy, Math.hypot(p.x - sx, p.y - sy), 0, 7);
          ctx.stroke();
        }
      });
      addEventListener('pointerup', () => drawing = false);
      body.querySelector('[data-a=undo]').onclick = () => { const s = undoStack.pop(); if (s) ctx.putImageData(s, 0, 0); };
      body.querySelector('[data-a=clear]').onclick = () => { undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); };
      const toBlob = () => new Promise(r => cv.toBlob(r, 'image/png'));
      body.querySelector('[data-a=save]').onclick = async () => {
        const nm = await Modal.prompt('保存到虚拟文件系统', o.path ? pathUtil.basename(o.path) : '画作.png');
        if (!nm) return;
        const dir = o.path ? pathUtil.dirname(o.path) : '/图片';
        await fs.mkdir(dir).catch(() => {});
        await fs.writeFile(pathUtil.join(dir, nm), await toBlob());
        toast('已保存到 ' + dir, 'ok'); window.Desktop.refresh(); window.refreshExplorers(dir);
      };
      body.querySelector('[data-a=export]').onclick = async () => UI.downloadBlob('画作.png', await toBlob());
    }
  });
}

/* ───────── 终端 ───────── */
function openTerm(startDir = '/') {
  WM.open({
    title: '终端', icon: 'term', w: 720, h: 460, type: 'term',
    build(body) {
      body.innerHTML = `<div class="term"></div><div class="termIn"><span class="pr">›</span><input spellcheck="false" autocomplete="off"></div>`;
      const out = body.querySelector('.term'), inp = body.querySelector('input');
      let cwd = startDir; const histArr = []; let hp = 0;
      const w = (t, c = '') => { const d = el('div', 'ln ' + c); d.textContent = t; out.appendChild(d); out.scrollTop = out.scrollHeight; };
      w('硯 OS Shell · 输入 help 查看命令列表  [后端 ' + fs.kind.toUpperCase() + ']', 'pr');
      const cmds = {
        help: () => w('可用命令: ls, cd, pwd, cat, mkdir, touch, write, rm, cp, mv, du, df, tree, open, mount, unzip, clear, echo, date'),
        async ls(a) { const l = await fs.list(a[0] ? pathUtil.join(cwd, a[0]) : cwd); l.forEach(i => w(`${i.isDir ? 'd' : '-'} ${String(i.isDir ? '' : fmtSize(i.size)).padStart(9)}  ${fmtDate(i.mtime)}  ${i.name}`)); },
        async cd(a) { const t = !a[0] || a[0] === '/' ? '/' : pathUtil.join(cwd, a[0]); const st = await fs.stat(t); if (!st.isDirectory()) throw new Error('不是目录'); cwd = t; },
        pwd: () => w(cwd),
        async cat(a) { w(await fs.readText(pathUtil.join(cwd, a[0]))); },
        async mkdir(a) { await fs.mkdir(pathUtil.join(cwd, a[0])); },
        async touch(a) { await fs.writeFile(pathUtil.join(cwd, a[0]), ''); },
        async write(a) { await fs.writeFile(pathUtil.join(cwd, a[0]), a.slice(1).join(' ')); },
        async rm(a) { await fs.remove(pathUtil.join(cwd, a[0])); },
        async cp(a) { await fs.copy(pathUtil.join(cwd, a[0]), pathUtil.join(cwd, a[1])); },
        async mv(a) { await fs.move(pathUtil.join(cwd, a[0]), pathUtil.join(cwd, a[1])); },
        async du(a) { const d = await fs.du(a[0] ? pathUtil.join(cwd, a[0]) : cwd); w(`${fmtSize(d.size)}  (${d.files} 文件, ${d.dirs} 目录)`); },
        async df() { const u = await fs.usage(); w(`已用 ${fmtSize(u.usage)} / 配额 ${fmtSize(u.quota)}  (${u.quota ? (u.usage / u.quota * 100).toFixed(2) : 0}%)`); },
        async tree(a) { const items = await fs.walk(a[0] ? pathUtil.join(cwd, a[0]) : cwd); items.slice(0, 400).forEach(i => w('  '.repeat(i.path.split('/').length - 2) + (i.isDir ? '├─ ' : '│  ') + i.name)); },
        async open(a) { window.openPath(pathUtil.join(cwd, a[0])); },
        mount() { fs.listMounts().forEach(m => w(`${m.prefix}  →  ${m.label}`)); if (!fs.listMounts().length) w('(无挂载)'); },
        async unzip(a) { const p = pathUtil.join(cwd, a[0]); const n = await UI.Archive.extract(p, pathUtil.join(cwd, pathUtil.basename(p).replace(/\.\w+$/, ''))); w(`解压 ${n} 个文件`); },
        clear: () => out.innerHTML = '',
        echo: a => w(a.join(' ')),
        date: () => w(new Date().toLocaleString('zh-CN'))
      };
      inp.onkeydown = async e => {
        if (e.key === 'ArrowUp') { hp = Math.max(0, hp - 1); inp.value = histArr[hp] || ''; return; }
        if (e.key === 'ArrowDown') { hp = Math.min(histArr.length, hp + 1); inp.value = histArr[hp] || ''; return; }
        if (e.key !== 'Enter') return;
        const line = inp.value.trim(); inp.value = '';
        if (!line) return;
        histArr.push(line); hp = histArr.length;
        w('› ' + line, 'pr');
        const [c, ...a] = line.split(/\s+/);
        if (!cmds[c]) return w('未知命令: ' + c, 'er');
        try { await cmds[c](a); } catch (err) { w(err.message, 'er'); }
      };
      body.addEventListener('click', () => inp.focus());
      setTimeout(() => inp.focus(), 80);
    }
  });
}

function openVM() {
  WM.open({
    title: '虚拟机 · v86', icon: 'chip', w: 760, h: 600, type: 'vm', single: 'vm',
    build(body, win) {
      body.innerHTML = `
        <div class="tbar">
          <button class="btn pri" data-a="pick">${svg('disk', 's')}从 VFS 选择镜像</button>
          <button class="btn" data-a="local">${svg('upload', 's')}从本机选择</button>

          <button class="btn" data-a="ctrlaltdel">Ctrl+Alt+Del</button>
          <button class="btn" data-a="stop">${svg('close', 's')}停止</button>
          <div style="flex:1"></div><span class="mini" data-a="st">未启动</span>
        </div>
        <div id="v86screen"><div></div><canvas></canvas></div>
        <div class="statusbar"><span>v86 0.5.319</span><span>iso→cdrom · img/fda/bin→fda · 其它→hda</span><span>镜像仅从本地/VFS 加载</span></div>
        <input type="file" data-a="fi" hidden accept=".iso,.img,.bin,.fda,.raw">`;
      const scr = body.querySelector('#v86screen'), st = body.querySelector('[data-a=st]');
      let emu = null;
      async function boot(buffer, filename) {
        if (!window.V86 && !window.V86Starter) return Modal.alert('虚拟机不可用', 'libv86.js 未能加载（可能被网络拦截）。');
        if (emu) { try { emu.stop(); } catch (e) {} emu = null; scr.querySelector('canvas').getContext('2d').clearRect(0, 0, 9999, 9999); }
        const ext = pathUtil.extname(filename);
        const image = { buffer };
        const cfg = {
          wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
          memory_size: 128 * 1024 * 1024, vga_memory_size: 8 * 1024 * 1024,
          screen_container: scr, autostart: true,
          bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin' },
          vga_bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin' }
        };
        if (ext === 'iso') cfg.cdrom = image;
        else if (['img', 'fda', 'bin', 'raw'].includes(ext)) cfg.fda = image;
        else cfg.hda = image;
        st.textContent = '启动中…';
        try { emu = new (window.V86 || window.V86Starter)(cfg); st.textContent = '运行中 · ' + filename; }
        catch (e) { st.textContent = '启动失败'; Modal.alert('启动失败', e.message); }
      }
      body.querySelector('[data-a=pick]').onclick = async () => {
        const list = [];
        for (const root of ['/桌面', '/下载', '/文档']) {
          for (const it of await fs.walk(root)) if (!it.isDir && /\.(iso|img|bin|fda|raw)$/i.test(it.name)) list.push(it);
        }
        if (!list.length) return Modal.alert('没有可用镜像', '请先把 .iso / .img 磁盘镜像导入虚拟文件系统（桌面 / 下载 / 文档）。');
        const pick = await Modal.choose('选择磁盘镜像', list.map(i => ({ label: i.path, icon: 'disk', path: i.path })));
        if (!pick) return;
        st.textContent = '读取镜像…';
        boot(await fs.readFile(pick.path), pathUtil.basename(pick.path));
      };
      const fi = body.querySelector('[data-a=fi]');
      body.querySelector('[data-a=local]').onclick = () => fi.click();
      fi.onchange = async () => { const f = fi.files[0]; if (f) boot(await f.arrayBuffer(), f.name); };
      body.querySelector('[data-a=lock]').onclick = () => { try { emu && emu.lock_mouse(); } catch (e) {} scr.requestPointerLock && scr.requestPointerLock(); };
      scr.addEventListener('click', () => { if (emu) { try { emu.lock_mouse(); } catch (e) { scr.requestPointerLock && scr.requestPointerLock(); } } });
      body.querySelector('[data-a=ctrlaltdel]').onclick = () => { if (!emu) return; [0x1d, 0x38, 0x53].forEach(k => emu.keyboard_send_scancodes([k])); [0xd3, 0xb8, 0x9d].forEach(k => emu.keyboard_send_scancodes([k])); };
      body.querySelector('[data-a=stop]').onclick = () => { if (emu) { try { emu.stop(); } catch (e) {} emu = null; st.textContent = '已停止'; } };
      win.on('close', () => { if (emu) try { emu.stop(); } catch (e) {} });
    }
  });
}

<script>
/* ══════════════════ 硯 OS · 启动与调度 ══════════════════ */
(function () {
'use strict';
const { esc } = UI;

/* ---------- 应用启动 ---------- */
window.launch = (id, args) => {
  const a = (window.APPS || []).find(x => x.id === id);
  if (!a) return toast('未找到应用：' + id, 'err');
  try { a.run(args || {}); } catch (e) { toast('启动失败：' + e.message, 'err'); console.error(e); }
};

/* ---------- 快捷方式 .app 图标识别 ---------- */
const baseFtype = UI.ftype;
UI.ftype = window.ftype = function (name, isDir) {
  if (!isDir && /\.app$/i.test(name)) {
    const base = name.replace(/\.app$/i, '');
    const app = (window.APPS || []).find(x => x.name === base);
    return { cat: 'app', ext: 'app', icon: app ? app.icon : 'star' };
  }
  return baseFtype(name, isDir);
};

/* ---------- 统一打开调度（先 stat 再分派） ---------- */
window.openPath = async function (path) {
  let st;
  try { st = await fs.stat(path); }
  catch (e) { return toast('无法访问：' + pathUtil.basename(path), 'err'); }
  if (st.isDirectory()) return window.openExplorer(path);

  const name = pathUtil.basename(path), ext = pathUtil.extname(name), t = UI.ftype(name, false);
  switch (t.cat) {
    case 'app': {
      try { const id = (await fs.readText(path)).trim(); return window.launch(id); } catch (e) { return toast('快捷方式无效', 'err'); }
    }
    case 'image': return ext === 'svg' ? window.openImage(path) : window.openImage(path);
    case 'audio': return window.openMedia(path, 'audio');
    case 'video': return window.openMedia(path, 'video');
    case 'pdf': return window.openPDF(path);
    case 'sheet': return window.openSheet(path, await fs.readText(path));
    case 'archive': {
      const c = await Modal.choose('压缩包 · ' + name, [
        { label: '解压到当前目录', icon: 'archive', a: 'x' },
        { label: '查看包内文件列表', icon: 'list', a: 'l' },
        { label: '导出到本机', icon: 'download', a: 'd' }
      ]);
      if (!c) return;
      if (c.a === 'x') return window.Desktop.extractTo(path);
      if (c.a === 'd') return UI.exportPath(path);
      const tmp = pathUtil.join('/系统/cache', name.replace(/\.\w+$/, ''));
      const tip = toast('正在读取…', '', 60000);
      try { const n = await UI.Archive.extract(path, tmp); tip.remove(); toast(`已展开 ${n} 项到缓存`, 'ok'); window.openExplorer(tmp); }
      catch (e) { tip.remove(); toast('读取失败：' + e.message, 'err'); }
      return;
    }
    case 'disk': return window.launch('vm');
    case 'code': {
      if (/^html?$/.test(ext)) {
        const c = await Modal.choose('打开 ' + name, [
          { label: '在系统浏览器中打开（渲染页面）', icon: 'globe', a: 'b' },
          { label: '编辑源代码（带实时预览）', icon: 'code', a: 'e' },
          { label: '用记事本打开', icon: 'text', a: 'n' }
        ]);
        if (!c) return;
        if (c.a === 'b') return window.openBrowser({ path });
        if (c.a === 'n') return window.openNotepad({ path, name, content: await fs.readText(path) });
        return window.openEditor({ path, name, content: await fs.readText(path), dir: pathUtil.dirname(path) });
      }
      return window.openEditor({ path, name, content: await fs.readText(path), dir: pathUtil.dirname(path) });
    }
    case 'text': return window.openNotepad({ path, name, content: await fs.readText(path) });
    default: {
      if (st.size > 3 * 1024 * 1024) return window.openWith(path);
      let txt = '';
      try { txt = await fs.readText(path); } catch (e) {}
      const printable = txt && (txt.match(/[\x09\x0a\x0d\x20-\x7e\u4e00-\u9fff]/g) || []).length / Math.max(1, txt.length) > .85;
      if (printable) return window.openNotepad({ path, name, content: txt });
      return window.openWith(path);
    }
  }
};

/* ---------- 打开方式 ---------- */
window.openWith = async function (path) {
  const name = pathUtil.basename(path);
  const opts = [
    { label: '记事本（纯文本）', icon: 'text', a: async () => window.openNotepad({ path, name, content: await fs.readText(path).catch(() => '') }) },
    { label: '代码编辑器（实时预览）', icon: 'code', a: async () => window.openEditor({ path, name, content: await fs.readText(path).catch(() => ''), dir: pathUtil.dirname(path) }) },
    { label: '图片查看器', icon: 'image', a: () => window.openImage(path) },
    { label: '漫画阅读器（本目录全部图片）', icon: 'book', a: () => window.openManga(path) },
    { label: '媒体播放器（视频）', icon: 'video', a: () => window.openMedia(path, 'video') },
    { label: '媒体播放器（音频）', icon: 'audio', a: () => window.openMedia(path, 'audio') },
    { label: '表格视图 (CSV/TSV)', icon: 'table', a: async () => window.openSheet(path, await fs.readText(path)) },
    { label: '网页浏览器', icon: 'globe', a: () => window.openBrowser({ path }) },
    { label: 'PDF 查看器', icon: 'pdf', a: () => window.openPDF(path) },
    { label: '画板中编辑', icon: 'brush', a: () => window.openPaint({ path }) },
    { label: '十六进制查看', icon: 'chip', a: () => window.openHex(path) },
    { label: '解压缩', icon: 'archive', a: () => window.Desktop.extractTo(path) },
    { label: '虚拟机中启动', icon: 'chip', a: () => window.launch('vm') },
    { label: '导出到本机', icon: 'download', a: () => UI.exportPath(path) }
  ];
  const c = await Modal.choose('打开方式 · ' + name, opts);
  if (c) c.a();
};

/* ---------- 挂载本机文件夹 ---------- */
window.mountLocalFolder = async function () {
  if (!window.showDirectoryPicker) { toast('当前浏览器不支持 File System Access API', 'err'); return null; }
  try {
    const h = await window.showDirectoryPicker({ mode: 'readwrite' });
    if (h.requestPermission) { const p = await h.requestPermission({ mode: 'readwrite' }); if (p !== 'granted') { toast('未获得写入权限', 'err'); return null; } }
    const prefix = await fs.mountLocal(h, h.name);
    toast(`已挂载 ${h.name} → ${prefix}`, 'ok');
    window.refreshExplorers();
    return prefix;
  } catch (e) { if (e.name !== 'AbortError') toast('挂载失败：' + e.message, 'err'); return null; }
};

/* ---------- 防止浏览器接管拖放 ---------- */
['dragover', 'drop'].forEach(t => window.addEventListener(t, e => {
  if (!e.target.closest || !e.target.closest('#desktop,.fxList,.fxSide,.crumbs')) { e.preventDefault(); if (t === 'drop') $('#dropVeil').classList.remove('on'); }
}, false));

> 墨分五色，屏纳千文。
`);

  await fs.writeFile('/文档/物料清单.csv', '名称,类别,数量,单价,更新日期\n松烟墨,墨,12,86.5,2026-01-08\n宣纸(四尺),纸,240,3.2,2026-01-11\n狼毫笔,笔,36,42,2026-02-02\n端砚,砚,4,880,2026-02-14\n镇纸,配件,18,26.5,2026-03-01\n');
  await fs.writeFile('/文档/随笔.txt', '硯 OS 随笔\n\n窗中月色，屏上墨痕。\n所有数据均存于 OPFS，离线可用。\n');

/* ---------- 启动 ---------- */
(async function boot() {

  try { await fs.ready; } catch (e) { console.error(e); }
  try {
    const cp = Cfg.get('wallCustomPath');
    if (cp && await fs.exists(cp)) Cfg.d.wallCustom = await fs.readURL(cp);
    else if (Cfg.get('wallCustom') && Cfg.get('wallCustom').startsWith('blob:')) Cfg.d.wallCustom = '';
    UI.applyWallpaper();
  } catch (e) {}
  try { await seed(); } catch (e) { console.warn('种子数据失败', e); }
  await window.Desktop.refresh();
  window.Desktop.renderStart();

  /* 上次挂载提醒（File System Access 权限刷新后失效） */
  try {
    const hs = (await fs.savedHandles()).filter(h => h.handle);
    if (hs.length) setTimeout(async () => {
      const ok = await Modal.confirm('恢复本机文件夹挂载', `检测到上次会话挂载了 ${hs.length} 个本机文件夹：\n${hs.map(h => h.prefix).join('\n')}\n\n浏览器安全策略要求刷新后重新授权，是否现在恢复？`);
      if (!ok) return;
      for (const h of hs) {
        try {
          const q = await h.handle.queryPermission({ mode: 'readwrite' });
          const p = q === 'granted' ? q : await h.handle.requestPermission({ mode: 'readwrite' });
          if (p === 'granted') await fs.mountLocal(h.handle, h.handle.name);
        } catch (e) { console.warn(e); }
      }
      window.refreshExplorers(); toast('本机文件夹已恢复挂载', 'ok');
    }, 1200);
  } catch (e) {}

  console.log('%c硯 OS ready', 'color:#d9503c;font-size:16px', '| backend:', fs.kind);
})();
})();
</script>
