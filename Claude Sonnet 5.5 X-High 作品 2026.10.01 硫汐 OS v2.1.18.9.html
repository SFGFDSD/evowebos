/* ================================================================
   硫汐 SULFTIDE —— 「潮线测绘主义」
   一个虚构测绘局的潮汐硫滩制图台：硫黄荧光、锈橙标注、等高潮线、
   切角铭牌、刻度尺与套准十字。
   ================================================================ */
:root{
  --f-disp:"Big Shoulders Display","LXGW WenKai Screen","PingFang SC","Microsoft YaHei",sans-serif;
  --f-ui:"LXGW WenKai Screen","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"Martian Mono","JetBrains Mono",ui-monospace,Consolas,monospace;
  --tb-h:46px; --ease:cubic-bezier(.2,.85,.25,1); --acc-base:#d7ff3f; --cw:92px; --ch:104px; --isz:48px;
  --rust:#ff6b35; --tide:#5ee0c4; --danger:#ff5a4d; --warn:#ffb23f;
}
html[data-theme=dark]{
  --bg0:#070d0b; --bg1:#0d1512; --bg2:#131d19; --bg3:#1b2924; --line:#2a3d35; --line2:#3c564a;
  --ink:#e4eede; --ink2:#9db2a4; --ink3:#61786b; --acc:var(--acc-base); --on-acc:#0a110d;
  --glass:rgba(8,14,12,.78); --paper:#101b17; --sel:color-mix(in oklab,var(--acc) 20%,transparent);
  --shadow:0 26px 60px -18px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.4); color-scheme:dark;
}
html[data-theme=light]{
  --bg0:#e5e1cf; --bg1:#f0edde; --bg2:#faf8ec; --bg3:#ddd8c2; --line:#bab49a; --line2:#9b947a;
  --ink:#16221c; --ink2:#44564b; --ink3:#7a8a7e; --acc:color-mix(in oklab,var(--acc-base) 34%,#0a3a2b); --on-acc:#f8fbe8;
  --glass:rgba(244,241,225,.8); --paper:#fdfcf3; --sel:color-mix(in oklab,var(--acc) 18%,transparent);
  --shadow:0 22px 50px -18px rgba(40,50,30,.45),0 0 0 1px rgba(40,50,30,.15); color-scheme:light;
  --rust:#d6450f; --tide:#0f8f77; --danger:#c9281c; --warn:#b97400;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0);color:var(--ink);font:13px/1.45 var(--f-ui);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{display:inline-flex;width:1.15em;height:1.15em;flex:none;align-items:center;justify-content:center}.ic svg{width:100%;height:100%}
::selection{background:color-mix(in oklab,var(--acc) 40%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid transparent;background-clip:padding-box;border-radius:0}::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:padding-box;border:3px solid transparent}::-webkit-scrollbar-corner{background:transparent}
.noanim *,.noanim *::before,.noanim *::after{animation-duration:.001s!important;transition-duration:.001s!important}
.noblur{--blur:none}

#wallpaper{position:fixed;inset:0;background:#050a08 center/cover no-repeat;animation:wpIn .9s var(--ease)}
@keyframes wpIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#wpfx{position:fixed;inset:0;pointer-events:none;background:
 repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
 radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.42) 100%)}
html[data-theme=light] #wpfx{background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(60,50,20,.18) 100%)}
#desktop{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h);z-index:1;touch-action:none;user-select:none;-webkit-user-select:none}
#desktop::before,#desktop::after{content:"";position:absolute;width:18px;height:18px;pointer-events:none;opacity:.5;
 background:linear-gradient(var(--acc),var(--acc)) center/1px 100% no-repeat,linear-gradient(var(--acc),var(--acc)) center/100% 1px no-repeat}
#desktop::before{right:10px;top:10px}#desktop::after{left:auto;right:auto;left:10px;bottom:10px}
#icons{position:absolute;inset:0;overflow:hidden}
#coord{position:absolute;right:36px;top:12px;font:400 10px var(--f-mono);letter-spacing:.12em;color:var(--ink2);opacity:.65;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.dicon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 3px;width:var(--cw);height:var(--ch);text-align:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none;border:1px solid transparent}
.dicon.anim{transition:left .34s var(--ease),top .34s var(--ease)}
.dicon .di-ic{width:var(--isz);height:var(--isz);flex:none;filter:drop-shadow(0 4px 7px rgba(0,0,0,.5));transition:transform .22s var(--ease);pointer-events:none}
.dicon:hover .di-ic{transform:translateY(-3px) scale(1.06)}
.dicon .di-ic svg,.dicon .di-ic img{width:100%;height:100%;object-fit:contain}
.dicon .di-lb{font-size:12px;line-height:1.25;max-width:100%;padding:1px 5px;background:color-mix(in oklab,var(--bg0) 62%,transparent);color:var(--ink);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none;
 clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.dicon:hover{background:color-mix(in oklab,var(--acc) 9%,transparent);border-color:color-mix(in oklab,var(--acc) 30%,transparent)}
.dicon.sel,.fx-item.sel{background:var(--sel);border-color:var(--acc)}
.dicon.sel .di-lb{background:var(--acc);color:var(--on-acc)}
.dicon.lifting{opacity:.35}
.drop-hover{outline:2px dashed var(--acc)!important;outline-offset:-3px;background:var(--sel)!important}
.marquee{position:absolute;pointer-events:none;border:1px solid var(--acc);background:color-mix(in oklab,var(--acc) 16%,transparent);z-index:50;display:none}
.drag-ghost{position:fixed;z-index:99999;pointer-events:none;padding:6px 10px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:12px;opacity:.92;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transform:translate(-50%,-120%)}
/* ---------- 窗口 ---------- */
#winlayer{position:fixed;left:0;top:0;right:0;bottom:var(--tb-h);z-index:10;pointer-events:none;overflow:hidden}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:260px;min-height:140px;box-shadow:var(--shadow);animation:winIn .34s var(--ease);transition:opacity .2s,transform .22s var(--ease),visibility 0s}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.965)}to{opacity:1;transform:none}}
.win.animating{transition:left .24s var(--ease),top .24s var(--ease),width .24s var(--ease),height .24s var(--ease),opacity .2s,transform .22s var(--ease)}
.win.closing{opacity:0;transform:scale(.96) translateY(10px);pointer-events:none;transition:opacity .16s,transform .16s}
.win.min{opacity:0;transform:translateY(60px) scale(.86);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .22s var(--ease),visibility 0s .22s}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;box-shadow:none}
.win-frame{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg1);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line2);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.win.max .win-frame{clip-path:none}
.win-frame::before,.win-frame::after{content:"";position:absolute;width:14px;height:14px;z-index:5;pointer-events:none;background:linear-gradient(135deg,transparent calc(50% - 1px),var(--line2) calc(50% - 1px) 50%,transparent 50%)}
.win-frame::before{left:0;top:0}.win-frame::after{right:0;bottom:0}
.win.max .win-frame::before,.win.max .win-frame::after{display:none}
.win.active .win-frame::before,.win.active .win-frame::after{background:linear-gradient(135deg,transparent calc(50% - 1px),var(--acc) calc(50% - 1px) 50%,transparent 50%)}
.win-bar{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 0 0 18px;background:var(--bg2);border-bottom:1px solid var(--line);cursor:default;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.win-bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--acc) 0 38px,transparent 38px);opacity:0;transition:opacity .2s}
.win.active .win-bar::after{opacity:1}
.win-ic{width:18px;height:18px;flex:none;color:var(--acc);display:flex}.win-ic svg{width:100%;height:100%}
.win-title{font:700 14px var(--f-disp);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);flex:none;max-width:45%}
.win.active .win-title{color:var(--ink)}
.win-ruler{flex:1;height:14px;min-width:20px;background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 6px) bottom/100% 5px no-repeat,repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 30px) bottom/100% 10px no-repeat;opacity:.6}
.win-btns{display:flex;height:100%}
.wb{width:44px;height:100%;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;padding:0}
.wb svg{width:14px;height:14px}.wb:hover{background:var(--bg3);color:var(--ink)}.wb.cl:hover{background:var(--rust);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:20;touch-action:none}
.rz[data-d=n]{left:14px;right:14px;top:-4px;height:8px;cursor:ns-resize}.rz[data-d=s]{left:14px;right:14px;bottom:-4px;height:8px;cursor:ns-resize}
.rz[data-d=e]{top:14px;bottom:14px;right:-4px;width:8px;cursor:ew-resize}.rz[data-d=w]{top:14px;bottom:14px;left:-4px;width:8px;cursor:ew-resize}
.rz[data-d=ne]{right:-4px;top:-4px;width:16px;height:16px;cursor:nesw-resize}.rz[data-d=sw]{left:-4px;bottom:-4px;width:16px;height:16px;cursor:nesw-resize}
.rz[data-d=nw]{left:-4px;top:-4px;width:16px;height:16px;cursor:nwse-resize}.rz[data-d=se]{right:-4px;bottom:-4px;width:16px;height:16px;cursor:nwse-resize}
.win.max .rz{display:none}
body.dragging iframe,body.dragging video,body.dragging canvas{pointer-events:none!important}
body.dragging{user-select:none}
#snapPrev{position:absolute;z-index:9998;pointer-events:none;border:2px solid var(--acc);background:color-mix(in oklab,var(--acc) 12%,transparent);opacity:0;transition:all .18s var(--ease);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}

/* ---------- 任务栏 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:9000;display:flex;align-items:stretch;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}

const S=(()=>{
  let data={},had=false;
  try{const raw=localStorage.getItem(SKEY);if(raw){data=JSON.parse(raw)||{};had=true}}catch(e){}
  const subs=[];
  const mirror=debounce(async()=>{
    const json=JSON.stringify(data);
    KV.set('settings',json);
    try{if(typeof fs!=='undefined'&&fs.ready)await fs.writeFile('/.system/settings.json',json)}catch(e){}
  },1000);
  const persist=()=>{
    try{localStorage.setItem(SKEY,JSON.stringify(data))}catch(e){}
    CK.set('sf_theme',data.theme||'dark');CK.set('sf_clk',data.clock12===false?'24':'12');
    mirror();
  };
  return{
    had,
    get(k){return k in data?data[k]:DEFAULTS[k]},
    set(k,v){data[k]=v;persist();subs.forEach(f=>{try{f(k,v)}catch(e){console.error(e)}})},
    all(){return{...DEFAULTS,...data}},
    onChange(f){subs.push(f);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}},
    load(obj){data={...obj};persist();subs.forEach(f=>f('*',null))},
    reset(){data={};try{localStorage.removeItem(SKEY)}catch(e){}},
    async recover(){ // localStorage 被清空时，从 IDB → OPFS 逐级恢复
      if(had)return false;
      try{let raw=await KV.get('settings');if(!raw&&typeof fs!=='undefined'&&fs.ready){try{raw=await fs.readFile('/.system/settings.json','utf8')}catch(e){}}
        if(raw){data=JSON.parse(raw);persist();subs.forEach(f=>f('*',null));return true}}catch(e){}
      return false;
    }
  };
})();

class FsError extends Error{constructor(code,path,msg){super((msg||code)+(path?'  ['+path+']':''));this.code=code;this.errno=code;this.path=path}}

/* 兼容层：无论传入多少参数，自动识别 callback（最后一个函数参数），返回 Promise 或回调 */
function compat(impl){

    for(let i=args.length-1;i>=0;i--)if(typeof args[i]==='function'){cb=args[i];args.splice(i,1);break}

  mkdir=compat(async function(path,opts){

/* ---- IndexedDB / 内存 节点存储 ---- */
class IDBStore{
  constructor(db){this.db=db}

  delPrefix(p){return this._t('readwrite',s=>{s.delete(p);s.delete(IDBKeyRange.bound(p+'/',p+'0'))})}

}

  async prefix(p){return[...this.m.values()].filter(n=>n.path.startsWith(p+'/'))}

  async open(path){

    if(is(0x50,0x4b,3,4)||is(0x50,0x4b,5,6))fmt='zip';else if(is(0x1f,0x8b))fmt='gzip';else if(this.isUstar(head)||ext==='tar')fmt='tar';

  async tarBlob(paths){

async function readAllEntries(reader){const all=[];for(;;){const b=await new Promise((res,rej)=>reader.readEntries(res,rej));if(!b.length)break;all.push(...b)}return all}   // readEntries 每次最多 100 条，循环读取
async function walkEntry(entry,dst,ctx){
  if(entry.isFile){const file=await new Promise((res,rej)=>entry.file(res,rej));const buf=await file.arrayBuffer();await fs.writeFile(dst,new Blob([buf],{type:file.type}),{mtime:file.lastModified});ctx.n++;ctx.prog&&ctx.prog(file.name)}
  else if(entry.isDirectory){await fs.mkdir(dst,{recursive:true});const kids=await readAllEntries(entry.createReader());for(const k of kids)await walkEntry(k,P.join(dst,k.name),ctx)}
}

<script>
'use strict';
/* =====================================================================
   启动 —— 无开场动画，直接进入系统
   ===================================================================== */
(()=>{
  // 无参数启动（开始菜单）时，漫画阅读器 / 压缩包管理器 先让用户选择文件
  const mg=OS.apps.manga;if(mg){const o=mg.open;mg.open=async a=>{if(!a||!a.path){const p=await UI.pickPath({title:'选择一张图片（将加载其所在目录的全部图片）',mode:'file',start:'/Pictures',exts:Object.keys(EXTMAP).filter(k=>EXTMAP[k]==='image')});if(!p)return null;a={path:p}}return o(a)}}
  const ar=OS.apps.archive;if(ar){const o=ar.open;ar.open=async a=>{if(!a||!a.path){const p=await UI.pickPath({title:'选择压缩包',mode:'file',start:'/',exts:['zip','7z','rar','tar','gz','tgz','bz2','xz','iso','cab','tar.gz','jar','apk']});if(!p)return null;a={path:p}}return o(a)}}
  const pdf=OS.apps.pdf;if(pdf){const o=pdf.open;pdf.open=async a=>{if(!a||!a.path){const p=await UI.pickPath({title:'选择 PDF',mode:'file',start:'/Documents',exts:['pdf']});if(!p)return null;a={path:p}}return o(a)}}
  const vw=OS.apps.viewer;if(vw){const o=vw.open;vw.open=async a=>{if(!a||!a.path){const p=await UI.pickPath({title:'选择图片',mode:'file',start:'/Pictures',exts:Object.keys(EXTMAP).filter(k=>EXTMAP[k]==='image')});if(!p)return null;a={path:p}}return o(a)}}
  const pl=OS.apps.player;if(pl){const o=pl.open;pl.open=async a=>{if(!a||!a.path){const p=await UI.pickPath({title:'选择音频或视频',mode:'file',start:'/Music',exts:[...EXTS.audio.split(' '),...EXTS.video.split(' ')]});if(!p)return null;a={path:p}}return o(a)}}
  function promptRemount(pending){
    const open=()=>{
      const body=h('div',{},h('p',{style:{margin:'0 0 10px',color:'var(--ink2)'}},'浏览器刷新后，本地文件夹的访问权限需要重新授予（出于安全限制，必须由你点击授权）：'),
        ...pending.map(it=>{const row=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:'1px dashed var(--line)'}},
          h('span',{class:'ic',html:I.plug,style:{color:'var(--acc)'}}),h('div',{style:{flex:1,minWidth:0}},h('b',{},it.name),h('div',{class:'mono',style:{fontSize:'11px',color:'var(--ink3)'}},it.mp)),
          h('button',{class:'btn sm pri',onclick:async()=>{const ok=await Mounts.regrant(it);if(ok){row.remove();UI.toast('已重新挂载 '+it.name)}else UI.toast('未获得授权','warn')}},'重新挂载'),
          h('button',{class:'btn sm',onclick:async()=>{await Mounts.remove(it.mp);row.remove()}},'移除'));return row}));
      UI.dialog({title:'重新挂载本地文件夹',body,width:500,buttons:[{label:'稍后',value:null}]});
    };
    UI.toast(`检测到 ${pending.length} 个之前挂载的本地文件夹，需要重新授权`,{type:'warn',ms:16000,action:{label:'重新挂载',fn:open}});
  }
  async function boot(){
    try{
      Shell.init();Theme.apply();Clock.init();if(S.get('wallpaper').type!=='file')Wallpapers.apply();DnD.init();Desktop.init();
      const info=await fs.init();
      if(!S.had){const rec=await S.recover();if(rec){Theme.apply();Wallpapers.apply()}}
      if(S.get('wallpaper').type==='file')Wallpapers.apply();
      await Desktop.loadPos();
      await seedFS();
      await Desktop.load();
      if(info.degraded)UI.toast(`OPFS 不可用，已降级为 ${info.kind==='idb'?'IndexedDB':'内存 + localStorage'}${info.prior==='opfs'?'（此前的数据可能保存在 OPFS 中）':''}`,{type:'warn',ms:8000});
      const pending=await Mounts.restore();if(pending.length)promptRemount(pending);
      OS.emit('ready');
    }catch(e){console.error(e);UI.toast('启动异常：'+(e.message||e),'err')}
  }
  boot();
})();
</script>
<script>
'use strict';
/* 收尾补丁：对话框默认聚焦主按钮（回车直接确认）+ 模块健康检查 */
(()=>{
  try{
    const _dlg=UI.dialog;
    UI.dialog=function(o){
      const p=_dlg.call(UI,o);
      setTimeout(()=>{
        const back=$('#dialogs').lastElementChild,dlg=back&&back.querySelector('.dlg');
        if(dlg&&!dlg.contains(document.activeElement)){const b=dlg.querySelector('.btn.pri')||dlg.querySelector('.btn.dng');b&&b.focus()}
      },90);
      return p;
    };
  }catch(e){console.warn(e)}
  setTimeout(()=>{
    try{
      const need=['explorer','notepad','sheet','viewer','player','pdf','editor','manga','browser','calc','paint','archive','v86','settings'];
      const miss=need.filter(id=>!OS.apps[id]);
      if(miss.length)UI.toast('部分模块加载失败：'+miss.join('、')+'（请按 F12 查看控制台错误）','err');
    }catch(e){
      document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;left:12px;top:12px;z-index:99999;background:#300;color:#fff;padding:10px 14px;font:13px monospace">核心模块加载失败，请按 F12 查看控制台错误</div>');
    }
  },1800);
  window.addEventListener('unhandledrejection',e=>console.warn('[unhandledrejection]',e.reason));
})();
</script>
