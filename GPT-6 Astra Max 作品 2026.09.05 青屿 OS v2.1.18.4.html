  const el = (tag, attrs={}, ...children) => {const node=document.createElement(tag);for(const [key,value] of Object.entries(attrs)){if(key==='class')node.className=value;else if(key==='text')node.textContent=value;else if(key==='html')node.innerHTML=value;else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);else if(value!==false&&value!=null)node.setAttribute(key,value===true?'':value);}for(const child of children.flat())if(child!=null)node.append(child instanceof Node?child:document.createTextNode(String(child)));return node;};

  const USER_GUIDE=`青屿 QINGYU
你的个人数字小岛

欢迎来到青屿。
这不是静态桌面图片。你的文件、编辑内容与设置，都写入当前浏览器的文件系统。

01 / 开始使用
桌面图标单击打开，文件列表双击打开。左下角的青屿按钮中可以找到所有应用。
窗口可以拖动、八向缩放、最小化、最大化和关闭。任务栏可以恢复窗口。
按住 Ctrl / Command 点击多选，Shift 选择范围，拖动空白区域框选。
手机上长按图标后拖动；在文件管理器点击“多选”可逐个选择文件。

02 / 你的文件在哪里
系统优先使用 OPFS，所有数据仅属于当前网站来源与当前浏览器配置文件。
若 OPFS 不可用，系统依次尝试 IndexedDB、LocalStorage。仅在全部持久存储不可用时才使用临时内存，并明确提示。
设置中的存储页面显示真实文件占用与浏览器动态配额。建议申请持久存储，并定期导出重要文件。
清除浏览器网站数据、使用隐私模式或更换网站地址，都会影响数据可见性或保留时间。

03 / 导入与导出
把电脑文件或文件夹拖到桌面、文件夹图标或文件管理器中即可导入。
也可以点击“上传文件”“导入文件夹”。文件夹导入保留目录结构。
桌面内部拖动图标会保存网格位置；拖到另一个文件夹会真正移动文件。
文件拖出浏览器需要桌面浏览器支持 DownloadURL。请先把鼠标停留在文件上，等待内容预读取。
如果系统或浏览器不接受拖出，使用右键菜单“导出 / 下载”；手机也使用这个入口。
导出多个文件或文件夹会生成 ZIP。原生 ZIP 写入在离线环境下仍可用。

04 / 挂载电脑上的真实文件夹
桌面 Chrome / Edge 等支持 File System Access API 的浏览器，可通过“挂载本地文件夹”授权目录。
挂载点位于 /mnt/local/实际目录名，所有应用使用相同的 fs API，无需切换操作模式。
注意：这里的修改、重命名和删除会影响真实电脑文件。刷新后可能需要重新授权。
不支持挂载的浏览器可以导入文件夹副本，但副本不是实时挂载。
卸载只解除连接，不会删除你的真实文件。重置青屿也不会清空已挂载的真实目录。

05 / 写一点代码
HTML 文件可以选择“预览网页”或“编辑源代码与实时预览”。
代码编辑器按需加载 CodeMirror 5.65.16，支持 HTML、CSS、JavaScript、Markdown、JSON、XML / SVG。
Ctrl+S 保存到源目录；Ctrl+Enter 运行；Ctrl+Shift+F 格式化。
Ctrl+F 查找；Ctrl+H 替换；F3 下一个；Shift+F3 上一个；Esc 关闭查找。
支持大小写、全词与正则匹配，也可以导入、导出、折叠与拆分预览布局。
离线或 CDN 失败时，原生文本编辑、保存、导出与预览仍然保留。
预览使用双层 iframe：外层负责写入文档，内层为不透明来源沙盒。用户网页不能直接读取青屿的 fs。
同目录的图片、样式和经典脚本会转换为 Blob URL。复杂模块打包、外部网站认证与服务端 API 仍受浏览器限制。

06 / 看图、听歌、画画
点击图片会自然排序并打开同目录的全部图片，可连续滚动、缩放和沉浸全屏。
CSV / TSV 提供表格与原始文本双视图，正确处理引号、分隔符与多行字段。
音频、视频与 PDF 使用浏览器原生能力。具体编码能否播放取决于当前浏览器。
画板支持画笔、橡皮、直线、矩形、撤销与重做，保存为 PNG。

07 / 压缩文件与虚拟机
ZIP、TAR、GZIP 优先使用原生能力；JSZip 和 7z-wasm 提供兼容解压。密码文件可以输入密码后重新读取。
解压会检查路径穿越与展开大小，符号链接不会写入 VFS。分卷压缩包需先合并。
虚拟机必须使用你自己的本地镜像。ISO 挂载为 CD-ROM，img/fda/bin 挂载为软盘，其他后缀挂载为硬盘。
v86 JS 与 WASM 都固定为 0.5.319；BIOS 固定为项目要求的 commit，不加载外部镜像地址。
点击“锁定鼠标”捕获鼠标，按 Esc 释放。手机可操作应用界面，但虚拟机交互更适合带键鼠的电脑。
快照需要相同的镜像、内存大小和 v86 版本；快照不替代原始磁盘镜像的备份。

08 / 检查与重置
设置 > 系统与诊断 > 运行真实文件系统自检，会写入测试文件并执行真实检查，随后清理。
真实目录授权、操作系统级文件拖出和客户镜像启动仍需要在你的设备上手动验证。
设置 > 存储与文件 > 重置青屿，可以清除整个虚拟工作空间。请先做好备份。
