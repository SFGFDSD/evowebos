<style>
:root{
  --aero-blue:#4ab8ff;
  --aero-sky:#7fd0ff;
  --aero-deep:#0b4a8a;
  --aero-glow:#bde4ff;
  --aero-green:#7ed957;
  --aero-glass: rgba(220, 240, 255, 0.45);
  --aero-glass-strong: rgba(255,255,255,0.62);
  --aero-border: rgba(255,255,255,0.75);
  --aero-shadow: 0 10px 40px rgba(10,60,120,0.35), 0 2px 8px rgba(0,0,0,0.25);
  --aero-text:#0a2540;
  --aero-text-soft:#244b73;
  --aero-accent:#1790ff;
  --font-display:'Syne',sans-serif;
  --font-ui:'Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --z-desktop:10;
  --z-icon:20;
  --z-window:100;
  --z-menu:5000;
  --z-taskbar:4000;
  --z-start:4500;
  --z-toast:9000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-ui);color:var(--aero-text);user-select:none;-webkit-user-select:none}
body{
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.7) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 90%, rgba(126,217,87,0.25) 0%, transparent 50%),
    linear-gradient(180deg, #8fd0ff 0%, #b6e3ff 35%, #d7f0c4 70%, #f0f9d4 100%);
}
/* Animated clouds */
body::before{
  content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(ellipse 220px 90px at 10% 15%, rgba(255,255,255,0.85), transparent 70%),
    radial-gradient(ellipse 300px 120px at 70% 25%, rgba(255,255,255,0.75), transparent 70%),
    radial-gradient(ellipse 260px 100px at 40% 60%, rgba(255,255,255,0.55), transparent 70%),
    radial-gradient(ellipse 340px 130px at 85% 75%, rgba(255,255,255,0.65), transparent 70%),
    radial-gradient(ellipse 200px 80px at 25% 85%, rgba(255,255,255,0.7), transparent 70%);
  animation: drift 90s linear infinite;
}
@keyframes drift{
  0%{transform:translate(0,0)}
  50%{transform:translate(-3%,1%)}
  100%{transform:translate(0,0)}
}
/* Glass bubbles accent */
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 15% 80%, rgba(255,255,255,0.25) 0, transparent 3%),
    radial-gradient(circle at 75% 15%, rgba(255,255,255,0.22) 0, transparent 2.5%),
    radial-gradient(circle at 90% 55%, rgba(255,255,255,0.18) 0, transparent 2%),
    radial-gradient(circle at 5% 40%, rgba(255,255,255,0.15) 0, transparent 1.8%),
    radial-gradient(circle at 55% 92%, rgba(255,255,255,0.22) 0, transparent 2.2%);
}
/* Wallpaper layer */
#wallpaper{position:fixed;inset:0;z-index:1;background-size:cover;background-position:center;transition:background 0.6s}

/* Desktop */
#desktop{position:fixed;inset:0;z-index:var(--z-desktop);overflow:hidden}
#icon-layer{position:absolute;inset:0;z-index:var(--z-icon)}

/* Selection rectangle */
#sel-rect{position:absolute;border:1px solid rgba(30,130,255,0.9);background:rgba(80,160,255,0.2);pointer-events:none;z-index:50;display:none;border-radius:2px;box-shadow:0 0 12px rgba(100,180,255,0.6)}

/* Desktop icon */
.dsk-icon{
  position:absolute;width:86px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;border-radius:10px;transition:transform 0.2s, background 0.15s;
  touch-action:none;
}
.dsk-icon:hover{background:rgba(255,255,255,0.35)}
.dsk-icon.selected{background:linear-gradient(180deg, rgba(80,160,255,0.4), rgba(30,100,200,0.35));box-shadow:0 0 0 1.5px rgba(255,255,255,0.8) inset}
.dsk-icon .icon-img{
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 3px 6px rgba(10,60,120,0.35));
  transition:transform 0.15s;
}
.dsk-icon:hover .icon-img{transform:translateY(-2px) scale(1.05)}
.dsk-icon .icon-label{
  color:#fff;font-size:12px;text-align:center;line-height:1.25;max-width:82px;
  text-shadow:0 1px 3px rgba(0,0,0,0.7), 0 0 6px rgba(0,0,0,0.5);
  word-break:break-word;font-weight:500;
}
.dsk-icon.dragging{opacity:0.4}
.dsk-icon .rename-input{
  width:100%;font-size:11px;padding:2px 4px;background:rgba(255,255,255,0.95);
  border:1px solid var(--aero-accent);border-radius:4px;text-align:center;outline:none;
  color:var(--aero-text);text-shadow:none;
}

/* Windows */
.window{
  position:absolute;min-width:300px;min-height:200px;
  background:var(--aero-glass-strong);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--aero-border);
  border-radius:10px;
  box-shadow:var(--aero-shadow);
  display:flex;flex-direction:column;overflow:hidden;
  animation:winOpen 0.22s cubic-bezier(.2,1.4,.4,1);
}
@keyframes winOpen{from{opacity:0;transform:scale(0.92) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.window.closing{animation:winClose 0.18s ease forwards}
@keyframes winClose{to{opacity:0;transform:scale(0.9) translateY(10px)}}
.window.minimizing{animation:winMin 0.28s ease forwards}
@keyframes winMin{to{opacity:0;transform:scale(0.3) translateY(200px)}}
.window.maximized{border-radius:0}

.win-titlebar{
  height:32px;display:flex;align-items:center;padding:0 8px 0 12px;gap:8px;cursor:move;
  background:linear-gradient(180deg,
    rgba(255,255,255,0.9) 0%,
    rgba(180,220,255,0.55) 40%,
    rgba(100,170,230,0.4) 100%);
  border-bottom:1px solid rgba(255,255,255,0.6);
  position:relative;
}
.win-titlebar::after{
  content:'';position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,0.5), transparent);
  pointer-events:none;border-radius:10px 10px 0 0;
}
.win-icon{width:18px;height:18px;flex-shrink:0}
.win-title{flex:1;font-size:13px;font-weight:600;color:var(--aero-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-display);letter-spacing:0.3px}
.win-controls{display:flex;gap:4px;z-index:2}
.win-btn{
  width:26px;height:22px;border:none;border-radius:5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(200,220,240,0.6));
  border:1px solid rgba(100,140,180,0.4);
  transition:all 0.15s;color:#1a3a5a;
}
.win-btn:hover{background:linear-gradient(180deg, #fff, #cfe5ff);box-shadow:0 1px 4px rgba(30,100,200,0.3)}
.win-btn.close:hover{background:linear-gradient(180deg, #ff8080, #e02020);color:#fff;border-color:#a00}
.win-btn svg{width:12px;height:12px;pointer-events:none}

.win-body{flex:1;overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,0.85);position:relative}

/* Resize handles */
.rh{position:absolute;z-index:10}
.rh-n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rh-s{bottom:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rh-w{top:8px;bottom:8px;left:-3px;width:6px;cursor:ew-resize}
.rh-e{top:8px;bottom:8px;right:-3px;width:6px;cursor:ew-resize}
.rh-nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nwse-resize}
.rh-ne{top:-3px;right:-3px;width:12px;height:12px;cursor:nesw-resize}
.rh-sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:nesw-resize}
.rh-se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:nwse-resize}

/* Taskbar */
#taskbar{
  position:fixed;bottom:0;left:0;right:0;height:42px;z-index:var(--z-taskbar);
  background:linear-gradient(180deg,
    rgba(255,255,255,0.55) 0%,
    rgba(180,220,255,0.4) 40%,
    rgba(80,150,220,0.55) 100%);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid rgba(255,255,255,0.7);
  display:flex;align-items:center;padding:0 8px;gap:6px;
  box-shadow:0 -2px 14px rgba(10,60,120,0.15);
}
#taskbar::before{
  content:'';position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
  pointer-events:none;
}
#start-btn{
  width:90px;height:34px;border:none;border-radius:6px;cursor:pointer;
  background:linear-gradient(180deg, #7fd0ff 0%, #1790ff 50%, #0a60c0 100%);
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:0 1px 3px rgba(10,60,120,0.4), inset 0 1px 0 rgba(255,255,255,0.6);
  transition:all 0.15s;position:relative;z-index:2;letter-spacing:0.5px;
}
#start-btn:hover{background:linear-gradient(180deg, #a5dfff 0%, #2aa0ff 50%, #1070d0 100%)}
#start-btn:active{transform:translateY(1px)}
#start-btn::after{
  content:'';position:absolute;left:4px;right:4px;top:2px;height:45%;
  background:linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
  border-radius:6px 6px 50% 50%;pointer-events:none;
}
#taskbar-items{flex:1;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;align-items:center;padding:0 4px;z-index:2}
#taskbar-items::-webkit-scrollbar{display:none}
.tb-item{
  height:32px;padding:0 10px;border-radius:5px;cursor:pointer;
  background:linear-gradient(180deg, rgba(255,255,255,0.45), rgba(200,230,255,0.25));
  border:1px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;gap:6px;font-size:12px;color:#0a2540;
  max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  transition:all 0.15s;
}
.tb-item:hover{background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(220,240,255,0.4))}
.tb-item.active{
  background:linear-gradient(180deg, rgba(80,160,255,0.7), rgba(30,100,200,0.5));
  color:#fff;box-shadow:inset 0 1px 3px rgba(0,30,80,0.3);
}
.tb-item svg{width:16px;height:16px;flex-shrink:0}
.tb-item span{overflow:hidden;text-overflow:ellipsis}
#tray{display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:#0a2540;font-weight:500;z-index:2;font-family:var(--font-display)}
#tray .clock{text-align:right;line-height:1.2}
#tray .clock .time{font-size:13px;font-weight:700}
#tray .clock .date{font-size:10px;opacity:0.8}

/* Start menu */
#start-menu{
  position:fixed;bottom:46px;left:8px;width:340px;max-height:70vh;z-index:var(--z-start);
  background:linear-gradient(180deg, rgba(220,240,255,0.85) 0%, rgba(180,220,255,0.7) 100%);
  backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  border:1px solid rgba(255,255,255,0.8);
  border-radius:10px;box-shadow:var(--aero-shadow);
  display:none;flex-direction:column;overflow:hidden;
  animation:menuOpen 0.2s cubic-bezier(.2,1.4,.4,1);
}
@keyframes menuOpen{from{opacity:0;transform:translateY(10px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
#start-menu.open{display:flex}
.start-header{padding:12px;background:linear-gradient(90deg, rgba(23,144,255,0.3), transparent);border-bottom:1px solid rgba(255,255,255,0.4);display:flex;align-items:center;gap:10px}
.start-header .avatar{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg, #7fd0ff, #1790ff);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.7)}
.start-header .avatar svg{width:22px;height:22px;color:#fff}
.start-header .info{flex:1}
.start-header .info .uname{font-family:var(--font-display);font-weight:700;color:#0a2540;font-size:14px}
.start-header .info .role{font-size:11px;color:#244b73}
.start-apps{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.start-apps::-webkit-scrollbar{width:6px}
.start-apps::-webkit-scrollbar-thumb{background:rgba(30,100,200,0.4);border-radius:3px}
.start-app{
  padding:10px 4px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:background 0.15s;
}
.start-app:hover{background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(200,230,255,0.6));box-shadow:0 1px 3px rgba(30,100,200,0.25)}
.start-app svg{width:32px;height:32px;filter:drop-shadow(0 2px 3px rgba(10,60,120,0.3))}
.start-app .n{font-size:11px;color:#0a2540;text-align:center;line-height:1.2;font-weight:500}
.start-footer{padding:8px 10px;border-top:1px solid rgba(255,255,255,0.4);display:flex;justify-content:flex-end;gap:6px;background:linear-gradient(180deg, transparent, rgba(23,144,255,0.1))}
.start-footer button{
  padding:6px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;
  background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(200,220,240,0.5));
  border:1px solid rgba(100,140,180,0.3);color:#0a2540;
}
.start-footer button:hover{background:linear-gradient(180deg, #fff, #dfeeff)}

/* Context menu */
.ctx-menu{
  position:fixed;z-index:var(--z-menu);
  background:linear-gradient(180deg, rgba(245,250,255,0.95), rgba(210,230,250,0.92));
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(255,255,255,0.8);border-radius:8px;
  box-shadow:var(--aero-shadow);padding:4px;min-width:200px;
  animation:menuOpen 0.15s ease;font-size:13px;
}
.ctx-item{padding:6px 14px 6px 28px;border-radius:4px;cursor:pointer;position:relative;color:#0a2540;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:linear-gradient(180deg, rgba(80,160,255,0.5), rgba(30,100,200,0.4));color:#fff}
.ctx-item.disabled{opacity:0.4;pointer-events:none}
.ctx-item svg{width:14px;height:14px;position:absolute;left:8px}
.ctx-sep{height:1px;background:rgba(100,140,180,0.3);margin:4px 8px}
.ctx-item.has-sub::after{content:'▶';margin-left:auto;font-size:9px;opacity:0.7}
.ctx-submenu{position:absolute;top:-4px;left:100%;margin-left:4px}

/* Toast */
#toast-container{position:fixed;top:16px;right:16px;z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  padding:10px 16px;border-radius:8px;font-size:13px;color:#0a2540;
  background:linear-gradient(180deg, rgba(245,250,255,0.95), rgba(200,230,255,0.9));
  backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.7);
  box-shadow:var(--aero-shadow);pointer-events:auto;
  animation:toastIn 0.3s cubic-bezier(.2,1.4,.4,1);max-width:320px;
}
.toast.error{background:linear-gradient(180deg, rgba(255,235,235,0.95), rgba(255,180,180,0.85))}
.toast.success{background:linear-gradient(180deg, rgba(230,255,230,0.95), rgba(180,240,180,0.85))}
.toast.out{animation:toastOut 0.25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* Dialog */
.dialog-overlay{position:fixed;inset:0;z-index:8000;background:rgba(10,40,80,0.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dialog{
  background:linear-gradient(180deg, rgba(245,250,255,0.97), rgba(210,230,250,0.95));
  backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.8);
  border-radius:10px;box-shadow:var(--aero-shadow);min-width:320px;max-width:90vw;max-height:85vh;
  display:flex;flex-direction:column;overflow:hidden;animation:winOpen 0.2s;
}
.dialog-head{padding:10px 14px;font-family:var(--font-display);font-weight:700;font-size:14px;border-bottom:1px solid rgba(100,140,180,0.2);display:flex;align-items:center;gap:8px}
.dialog-body{padding:14px;flex:1;overflow:auto;font-size:13px;line-height:1.5}
.dialog-body input,.dialog-body textarea,.dialog-body select{
  width:100%;padding:6px 10px;border:1px solid rgba(100,140,180,0.4);border-radius:5px;
  background:rgba(255,255,255,0.9);font-family:inherit;font-size:13px;color:var(--aero-text);outline:none;
}
.dialog-body input:focus,.dialog-body textarea:focus{border-color:var(--aero-accent);box-shadow:0 0 0 2px rgba(23,144,255,0.2)}
.dialog-foot{padding:10px;border-top:1px solid rgba(100,140,180,0.2);display:flex;justify-content:flex-end;gap:8px}
.btn{
  padding:6px 16px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;
  background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(210,225,245,0.8));
  border:1px solid rgba(100,140,180,0.4);color:#0a2540;transition:all 0.15s;
}
.btn:hover{background:linear-gradient(180deg, #fff, #dfeeff);box-shadow:0 1px 3px rgba(30,100,200,0.2)}
.btn.primary{background:linear-gradient(180deg, #7fd0ff, #1790ff);color:#fff;border-color:#0a60c0}
.btn.primary:hover{background:linear-gradient(180deg, #a5dfff, #2aa0ff)}
.btn.danger{background:linear-gradient(180deg, #ff9090, #e02020);color:#fff;border-color:#a00}

/* File Explorer */
.fe{display:flex;flex:1;overflow:hidden}
.fe-sidebar{width:180px;border-right:1px solid rgba(100,140,180,0.2);padding:8px 4px;overflow-y:auto;background:rgba(245,250,255,0.6);font-size:12px}
.fe-sidebar h4{font-size:10px;text-transform:uppercase;color:#5a7a9a;padding:6px 10px 2px;letter-spacing:0.6px;font-weight:700}
.fe-sb-item{padding:5px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;color:#0a2540}
.fe-sb-item:hover{background:rgba(80,160,255,0.2)}
.fe-sb-item.active{background:linear-gradient(180deg, rgba(80,160,255,0.5), rgba(30,100,200,0.4));color:#fff}
.fe-sb-item svg{width:14px;height:14px}
.fe-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.fe-toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid rgba(100,140,180,0.2);background:rgba(255,255,255,0.5);flex-wrap:wrap}
.fe-tbtn{width:28px;height:26px;border:1px solid rgba(100,140,180,0.3);background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(220,235,250,0.6));border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fe-tbtn:hover{background:linear-gradient(180deg, #fff, #dfeeff)}
.fe-tbtn:disabled{opacity:0.4;cursor:not-allowed}
.fe-tbtn svg{width:14px;height:14px}
.fe-path{flex:1;min-width:100px;padding:4px 10px;background:rgba(255,255,255,0.85);border:1px solid rgba(100,140,180,0.3);border-radius:4px;font-size:12px;font-family:var(--font-mono);display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap}
.fe-crumb{cursor:pointer;color:#1790ff;padding:1px 4px;border-radius:3px}
.fe-crumb:hover{background:rgba(23,144,255,0.15)}
.fe-crumb-sep{color:#8aa;opacity:0.6}
.fe-search{width:150px;padding:4px 10px;border:1px solid rgba(100,140,180,0.3);border-radius:12px;background:rgba(255,255,255,0.85);font-size:12px;outline:none}
.fe-search:focus{border-color:var(--aero-accent);box-shadow:0 0 0 2px rgba(23,144,255,0.2)}
.fe-list{flex:1;overflow:auto;padding:4px;position:relative}
.fe-table{width:100%;border-collapse:collapse;font-size:12px}
.fe-table th{position:sticky;top:0;background:linear-gradient(180deg, rgba(220,235,250,0.95), rgba(200,220,240,0.9));text-align:left;padding:6px 8px;font-weight:600;border-bottom:1px solid rgba(100,140,180,0.3);cursor:pointer;user-select:none;white-space:nowrap;z-index:5}
.fe-table th:hover{background:linear-gradient(180deg, rgba(180,220,255,0.95), rgba(150,200,240,0.9))}
.fe-table th .arrow{display:inline-block;width:12px;opacity:0.5}
.fe-table th.sorted .arrow{opacity:1;color:var(--aero-accent)}
.fe-table td{padding:5px 8px;border-bottom:1px solid rgba(100,140,180,0.1)}
.fe-table tr.row:hover{background:rgba(80,160,255,0.15)}
.fe-table tr.row.selected{background:linear-gradient(180deg, rgba(80,160,255,0.4), rgba(30,100,200,0.35));color:#fff}
.fe-table tr.row.selected td{border-color:transparent}
.fe-row{cursor:pointer;display:flex;align-items:center}
.fe-name{display:flex;align-items:center;gap:8px;min-width:0}
.fe-name svg{width:20px;height:20px;flex-shrink:0}
.fe-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fe-status{padding:4px 10px;font-size:11px;color:#5a7a9a;border-top:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.5);display:flex;justify-content:space-between}
.col-resize{width:4px;position:absolute;right:0;top:0;bottom:0;cursor:col-resize}
.fe-table th{position:sticky;position:relative}

/* Notepad */
.np{display:flex;flex-direction:column;height:100%;background:#fff}
.np-toolbar{display:flex;gap:4px;padding:6px;border-bottom:1px solid rgba(100,140,180,0.2);flex-wrap:wrap;align-items:center;background:rgba(245,250,255,0.7)}
.np-toolbar button{padding:4px 10px;font-size:12px;border:1px solid rgba(100,140,180,0.3);background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(220,235,250,0.6));border-radius:4px;cursor:pointer}
.np-toolbar button:hover{background:linear-gradient(180deg, #fff, #dfeeff)}
.np-area{flex:1;border:none;outline:none;padding:12px;font-family:var(--font-mono);font-size:13px;resize:none;line-height:1.5;color:#0a2540;background:#fff}
.np-status{padding:3px 10px;font-size:11px;color:#5a7a9a;border-top:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.5);display:flex;justify-content:space-between}
.np-csv{flex:1;overflow:auto;padding:0;background:#fff}
.np-csv table{border-collapse:collapse;font-size:12px;font-family:var(--font-mono);width:100%}
.np-csv th,.np-csv td{border:1px solid rgba(100,140,180,0.3);padding:4px 8px;white-space:nowrap}
.np-csv th{background:linear-gradient(180deg, rgba(220,235,250,0.95), rgba(200,220,240,0.9));position:sticky;top:0;font-weight:600;z-index:2}
.np-csv td:first-child,.np-csv th:first-child{position:sticky;left:0;background:linear-gradient(180deg, rgba(220,235,250,0.95), rgba(200,220,240,0.9));z-index:1}
.np-csv th:first-child{z-index:3}

/* HTML Editor */
.he{display:flex;flex-direction:column;height:100%}
.he-toolbar{display:flex;gap:4px;padding:6px;border-bottom:1px solid rgba(100,140,180,0.2);flex-wrap:wrap;align-items:center;background:rgba(245,250,255,0.7)}
.he-toolbar button,.he-toolbar select{padding:4px 8px;font-size:11px;border:1px solid rgba(100,140,180,0.3);background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(220,235,250,0.6));border-radius:4px;cursor:pointer;font-family:var(--font-ui);color:#0a2540}
.he-toolbar button:hover{background:linear-gradient(180deg, #fff, #dfeeff)}
.he-toolbar .sep{width:1px;height:20px;background:rgba(100,140,180,0.3);margin:0 2px}
.he-split{flex:1;display:flex;overflow:hidden;position:relative}
.he-edit{flex:1;display:flex;flex-direction:column;min-width:200px;overflow:hidden}
.he-edit .CodeMirror{flex:1;height:auto !important;font-family:var(--font-mono);font-size:13px}
.he-divider{width:5px;background:linear-gradient(90deg, rgba(100,140,180,0.4), rgba(100,140,180,0.2));cursor:col-resize;position:relative}
.he-divider::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:30px;background:rgba(100,140,180,0.6);border-radius:1px}
.he-preview{flex:1;min-width:120px;background:#fff;display:flex;flex-direction:column}
.he-preview iframe{flex:1;border:none;width:100%;background:#fff}
.he-status{padding:3px 10px;font-size:11px;color:#5a7a9a;border-top:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.5);display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono)}
.he-findbar{display:none;padding:6px;border-bottom:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.85);gap:4px;align-items:center;flex-wrap:wrap}
.he-findbar.open{display:flex}
.he-findbar input{padding:3px 8px;font-size:12px;border:1px solid rgba(100,140,180,0.3);border-radius:4px;outline:none;background:#fff;font-family:var(--font-mono);width:160px}
.he-findbar .count{font-size:11px;color:#5a7a9a;min-width:50px}
.he-findbar button{padding:3px 8px;font-size:11px;border:1px solid rgba(100,140,180,0.3);background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(220,235,250,0.6));border-radius:4px;cursor:pointer}
.he-findbar .toggle{width:24px;height:24px;font-family:var(--font-mono);font-weight:600}
.he-findbar .toggle.on{background:linear-gradient(180deg, #7fd0ff, #1790ff);color:#fff;border-color:#0a60c0}
.CodeMirror .cm-current-match{background:#ff9632 !important;color:#fff !important}
.CodeMirror .cm-match{background:#ffe19a !important}

/* Manga viewer */
.mv{display:flex;flex-direction:column;height:100%;background:#000}
.mv-toolbar{display:flex;gap:4px;padding:6px;background:rgba(20,30,50,0.95);border-bottom:1px solid rgba(100,140,180,0.3);align-items:center;color:#fff}
.mv-toolbar button{padding:4px 10px;font-size:11px;border:1px solid rgba(120,160,200,0.4);background:linear-gradient(180deg, rgba(60,90,130,0.8), rgba(30,50,90,0.8));color:#fff;border-radius:4px;cursor:pointer}
.mv-toolbar button:hover{background:linear-gradient(180deg, rgba(80,120,160,0.9), rgba(40,70,110,0.9))}
.mv-toolbar .info{flex:1;text-align:center;font-size:11px;opacity:0.8}
.mv-scroll{flex:1;overflow-y:auto;background:#000;display:flex;flex-direction:column;align-items:center;scroll-behavior:smooth}
.mv-scroll::-webkit-scrollbar{width:8px}
.mv-scroll::-webkit-scrollbar-track{background:#111}
.mv-scroll::-webkit-scrollbar-thumb{background:rgba(120,160,200,0.4);border-radius:4px}
.mv-scroll img{width:100%;max-width:1000px;display:block;pointer-events:none}
.mv-loading{color:#fff;padding:40px;font-size:13px;opacity:0.7}
.window.fullscreen-manga .win-titlebar{display:none}
.window.fullscreen-manga{border-radius:0}
.mv-fs-exit{position:fixed;top:12px;right:12px;z-index:9999;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:1px solid rgba(255,255,255,0.3);display:none;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.window.fullscreen-manga .mv-fs-exit{display:flex}

/* Browser */
.br{display:flex;flex-direction:column;height:100%}
.br-bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.7);align-items:center}
.br-bar button{width:28px;height:26px;border:1px solid rgba(100,140,180,0.3);background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(220,235,250,0.6));border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.br-bar button:hover{background:linear-gradient(180deg, #fff, #dfeeff)}
.br-bar input{flex:1;padding:4px 10px;border:1px solid rgba(100,140,180,0.3);border-radius:14px;font-size:12px;outline:none;background:#fff;font-family:var(--font-mono)}
.br-bar input:focus{border-color:var(--aero-accent)}
.br-view{flex:1;background:#fff;position:relative}
.br-view iframe{width:100%;height:100%;border:none;background:#fff}

/* Calculator */
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px;background:linear-gradient(180deg, #eaf4ff, #d6e8fa)}
.calc-screen{
  padding:14px;border-radius:8px;background:linear-gradient(180deg, #0a2540, #134678);
  color:#bde4ff;text-align:right;font-family:var(--font-mono);min-height:80px;
  display:flex;flex-direction:column;justify-content:flex-end;
  border:1px solid rgba(255,255,255,0.2);box-shadow:inset 0 2px 6px rgba(0,0,0,0.4);
}
.calc-expr{font-size:12px;opacity:0.6;min-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-val{font-size:30px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-btn{
  border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;
  background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(200,220,240,0.7));
  border:1px solid rgba(100,140,180,0.3);color:#0a2540;
  box-shadow:0 1px 3px rgba(10,60,120,0.15), inset 0 1px 0 rgba(255,255,255,0.7);
  transition:all 0.1s;
}
.calc-btn:hover{background:linear-gradient(180deg, #fff, #dfeeff)}
.calc-btn:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(0,30,80,0.2)}
.calc-btn.op{background:linear-gradient(180deg, #7fd0ff, #1790ff);color:#fff;border-color:#0a60c0}
.calc-btn.op:hover{background:linear-gradient(180deg, #a5dfff, #2aa0ff)}
.calc-btn.eq{background:linear-gradient(180deg, #7ed957, #3a9c25);color:#fff;border-color:#2a7a18}
.calc-btn.clr{background:linear-gradient(180deg, #ff9090, #e02020);color:#fff;border-color:#a00}

/* Paint */
.pt{display:flex;flex-direction:column;height:100%;background:#fff}
.pt-toolbar{display:flex;gap:6px;padding:6px;border-bottom:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.7);align-items:center;flex-wrap:wrap}
.pt-toolbar button,.pt-toolbar label{padding:4px 10px;font-size:11px;border:1px solid rgba(100,140,180,0.3);background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(220,235,250,0.6));border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.pt-toolbar button:hover{background:linear-gradient(180deg, #fff, #dfeeff)}
.pt-toolbar button.active{background:linear-gradient(180deg, #7fd0ff, #1790ff);color:#fff;border-color:#0a60c0}
.pt-toolbar input[type=color]{width:30px;height:24px;padding:0;border:1px solid rgba(100,140,180,0.3);border-radius:4px;cursor:pointer;background:none}
.pt-toolbar input[type=range]{width:80px}
.pt-canvas{flex:1;overflow:auto;background:repeating-conic-gradient(#eef 0% 25%, #fff 0% 50%) 0 0/20px 20px;display:flex;align-items:center;justify-content:center;padding:10px}
.pt-canvas canvas{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.2);cursor:crosshair;touch-action:none}

/* Settings */
.st{display:flex;height:100%;background:#fff}
.st-nav{width:160px;padding:8px;border-right:1px solid rgba(100,140,180,0.2);background:rgba(245,250,255,0.6)}
.st-nav button{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:2px;border:none;background:transparent;border-radius:4px;cursor:pointer;font-size:12px;color:#0a2540;font-weight:500}
.st-nav button:hover{background:rgba(80,160,255,0.2)}
.st-nav button.active{background:linear-gradient(180deg, rgba(80,160,255,0.5), rgba(30,100,200,0.4));color:#fff}
.st-body{flex:1;padding:16px;overflow:auto}
.st-body h3{font-family:var(--font-display);font-size:18px;margin-bottom:14px;color:#0a2540}
.st-body h4{font-size:13px;margin:14px 0 8px;color:#244b73;font-weight:700}
.st-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(100,140,180,0.1);font-size:13px}
.st-row label{color:#244b73}
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.wp-item{aspect-ratio:16/10;border-radius:6px;cursor:pointer;border:2px solid transparent;background-size:cover;background-position:center;position:relative;overflow:hidden;transition:transform 0.2s}
.wp-item:hover{transform:scale(1.03);border-color:rgba(23,144,255,0.5)}
.wp-item.active{border-color:var(--aero-accent);box-shadow:0 0 0 2px rgba(23,144,255,0.3)}
.usage-bar{height:22px;background:rgba(100,140,180,0.2);border-radius:11px;overflow:hidden;position:relative;margin-top:6px}
.usage-bar-fill{height:100%;background:linear-gradient(90deg, #7ed957, #1790ff);transition:width 0.4s;border-radius:11px}
.usage-bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#0a2540;text-shadow:0 1px 0 rgba(255,255,255,0.6)}
.usage-list{font-size:12px;margin-top:8px;max-height:160px;overflow:auto}
.usage-item{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid rgba(100,140,180,0.1)}

/* Media player (img/audio/video) */
.mp{display:flex;flex-direction:column;height:100%;background:#000}
.mp-view{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#0a0a0a;position:relative}
.mp-view img{max-width:100%;max-height:100%;transition:transform 0.1s;user-select:none;-webkit-user-drag:none}
.mp-view video,.mp-view audio{max-width:100%;max-height:100%;outline:none}
.mp-view audio{width:90%;max-width:500px}
.mp-zoom{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;font-family:var(--font-mono);pointer-events:none}

/* V86 emulator */
.vm{display:flex;flex-direction:column;height:100%;background:#000}
.vm-toolbar{display:flex;gap:4px;padding:6px;background:rgba(20,30,50,0.95);border-bottom:1px solid rgba(100,140,180,0.3);align-items:center;color:#fff;flex-wrap:wrap}
.vm-toolbar button,.vm-toolbar label{padding:4px 10px;font-size:11px;border:1px solid rgba(120,160,200,0.4);background:linear-gradient(180deg, rgba(60,90,130,0.8), rgba(30,50,90,0.8));color:#fff;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.vm-screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vm-screen .screen{white-space:pre;font-family:var(--font-mono);font-size:14px;line-height:1.2;color:#ccc;background:#000}
.vm-screen canvas{background:#000}
.vm-msg{color:#bde4ff;padding:20px;font-size:13px;text-align:center;max-width:400px;line-height:1.6}

/* About */
.about{padding:20px;text-align:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg, #eaf4ff, #d6e8fa);gap:14px}
.about-logo{width:80px;height:80px;filter:drop-shadow(0 4px 8px rgba(10,60,120,0.3))}
.about h2{font-family:var(--font-display);font-size:22px;color:#0a2540}
.about p{font-size:12px;color:#244b73;max-width:360px;line-height:1.6}

/* Mobile */
@media (max-width:720px){
  .fe-sidebar{display:none}
  #taskbar{height:48px}
  #start-btn{width:auto;padding:0 12px;font-size:0}
  #start-btn::before{content:'☰';font-size:18px}
  #start-menu{left:4px;right:4px;width:auto;max-height:80vh}
  .window{min-width:auto !important;left:4px !important;right:4px !important;width:auto !important;top:4px !important;bottom:52px !important;height:auto !important;border-radius:8px}
  .dsk-icon{width:76px}
  .dsk-icon .icon-img{width:44px;height:44px}
  .dsk-icon .icon-label{font-size:11px}
  .st-nav{width:100px}
  .fe-search{width:100px}
  .he-toolbar{font-size:10px}
}
</style>
</head>

</div>

<div id="start-menu"></div>

/* ---------- Utility ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === 'style') Object.assign(e.style, attrs[k]);
    else if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids){
    if (k == null) continue;
    e.append(typeof k === 'string' ? document.createTextNode(k) : k);
  }
  return e;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtSize = b => {
  if (b < 1024) return b+' B';
  if (b < 1024*1024) return (b/1024).toFixed(1)+' KB';
  if (b < 1024*1024*1024) return (b/1024/1024).toFixed(1)+' MB';
  return (b/1024/1024/1024).toFixed(2)+' GB';
};
const fmtDate = d => {
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const basename = p => p.split('/').filter(Boolean).pop() || '';
const dirname = p => {const a = p.split('/').filter(Boolean); a.pop(); return '/'+a.join('/')};
const join = (...parts) => {
  const p = parts.join('/').replace(/\/+/g,'/');
  return p.startsWith('/') ? p : '/'+p;
};
const normPath = p => {
  const segs = p.split('/');
  const out = [];
  for (const s of segs){
    if (s === '' || s === '.') continue;
    if (s === '..') out.pop();
    else out.push(s);
  }
  return '/'+out.join('/');
};
const extOf = name => {
  const i = name.lastIndexOf('.');
  return i > 0 ? name.slice(i+1).toLowerCase() : '';
};
const mimeOf = name => {
  const ext = extOf(name);
  const map = {
    txt:'text/plain', md:'text/markdown', markdown:'text/markdown',
    html:'text/html', htm:'text/html', css:'text/css', js:'text/javascript', mjs:'text/javascript',
    json:'application/json', xml:'application/xml', svg:'image/svg+xml',
    yaml:'text/yaml', yml:'text/yaml', log:'text/plain', csv:'text/csv', tsv:'text/tab-separated-values',
    png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', bmp:'image/bmp', ico:'image/x-icon',
    mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', flac:'audio/flac', aac:'audio/aac',
    mp4:'video/mp4', webm:'video/webm', ogv:'video/ogg',
    pdf:'application/pdf',
    zip:'application/zip', gz:'application/gzip',
  };
  return map[ext] || 'application/octet-stream';
};
const isTextExt = ext => /^(txt|md|markdown|html|htm|css|js|mjs|json|xml|svg|yaml|yml|log|csv|tsv|ini|cfg|conf|sh|bat|py|rb|php|java|c|cpp|h|rs|go|ts|tsx|jsx|vue|svelte|sql|toml|env)$/i.test(ext);
const isImageExt = ext => /^(png|jpg|jpeg|gif|webp|bmp|ico|svg)$/i.test(ext);
const isAudioExt = ext => /^(mp3|wav|ogg|flac|aac|m4a)$/i.test(ext);
const isVideoExt = ext => /^(mp4|webm|ogv|mov)$/i.test(ext);

function toast(msg, type='info', dur=2500){
  const t = el('div',{class:`toast ${type}`}, msg);
  $('#toast-container').append(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},dur);
}

function confirm_(title, msg, okText='确定'){
  return new Promise(res => {
    const ov = el('div',{class:'dialog-overlay'});
    const d = el('div',{class:'dialog'},
      el('div',{class:'dialog-head'}, title),
      el('div',{class:'dialog-body'}, msg),
      el('div',{class:'dialog-foot'},
        el('button',{class:'btn',onclick:()=>{ov.remove();res(false)}}, '取消'),
        el('button',{class:'btn primary',onclick:()=>{ov.remove();res(true)}}, okText)
      )
    );
    ov.append(d); document.body.append(ov);
  });
}
function prompt_(title, placeholder='', defaultVal=''){
  return new Promise(res => {
    const ov = el('div',{class:'dialog-overlay'});
    const inp = el('input',{type:'text',placeholder,value:defaultVal});
    const d = el('div',{class:'dialog'},
      el('div',{class:'dialog-head'}, title),
      el('div',{class:'dialog-body'}, inp),
      el('div',{class:'dialog-foot'},
        el('button',{class:'btn',onclick:()=>{ov.remove();res(null)}}, '取消'),
        el('button',{class:'btn primary',onclick:()=>{ov.remove();res(inp.value)}}, '确定')
      )
    );
    ov.append(d); document.body.append(ov);
    setTimeout(()=>inp.focus(),50);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){ov.remove();res(inp.value)}else if(e.key==='Escape'){ov.remove();res(null)}});
  });
}

/* =========================================================
 * 核心 VFS — 基于 OPFS
 * 结构: /Desktop, /Documents, /Pictures, /Music, /Videos, /Downloads, /Trash, /mnt/local/...
 * ========================================================= */
const VFS = (() => {
  let root = null;
  let idb = null; // 用于存元数据
  const META_STORE = 'meta';
  const MOUNT_STORE = 'mounts';
  
  function openIDB(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open('aeroos-vfs', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(META_STORE)) db.createObjectStore(META_STORE);
        if (!db.objectStoreNames.contains(MOUNT_STORE)) db.createObjectStore(MOUNT_STORE);
      };
      req.onsuccess = () => { idb = req.result; res(idb); };
      req.onerror = () => rej(req.error);
    });
  }
  function idbPut(store, k, v){
    return new Promise((res,rej)=>{
      const tx = idb.transaction(store,'readwrite');
      tx.objectStore(store).put(v, k);
      tx.oncomplete = ()=>res();
      tx.onerror = ()=>rej(tx.error);
    });
  }
  function idbGet(store, k){
    return new Promise((res,rej)=>{
      const tx = idb.transaction(store,'readonly');
      const r = tx.objectStore(store).get(k);
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
  }
  function idbDel(store, k){
    return new Promise((res,rej)=>{
      const tx = idb.transaction(store,'readwrite');
      tx.objectStore(store).delete(k);
      tx.oncomplete = ()=>res();
      tx.onerror = ()=>rej(tx.error);
    });
  }
  function idbKeys(store){
    return new Promise((res,rej)=>{
      const tx = idb.transaction(store,'readonly');
      const r = tx.objectStore(store).getAllKeys();
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
  }
  
  async function init(){
    try {
      await openIDB();
      window.idb = idb; // 暴露给其它模块（Desktop 等）
      if (navigator.storage && navigator.storage.persist) {
        try { await navigator.storage.persist(); } catch(e){}
      }
      root = await navigator.storage.getDirectory();
      // 创建标准目录
      for (const d of ['Desktop','Documents','Pictures','Music','Videos','Downloads','Trash']){
        await root.getDirectoryHandle(d, {create:true});
      }
      return true;
    } catch(e){
      console.error('OPFS init failed, using fallback',e);
      return false;
    }
  }
  
  // 路径解析: 返回 {parent, name}
  async function resolvePath(path, create=false){
    const p = normPath(path);
    const segs = p.split('/').filter(Boolean);
    if (segs.length === 0) return {handle: root, name:'', isRoot:true};
    let cur = root;
    for (let i=0;i<segs.length-1;i++){
      cur = await cur.getDirectoryHandle(segs[i], {create});
    }
    return {parent:cur, name:segs[segs.length-1]};
  }
  
  async function stat(path){
    // 挂载路径路由
    if (path.startsWith('/mnt/local/')){
      return LocalFS.stat(path);
    }
    const p = normPath(path);
    if (p === '/' || p === '') return {type:'dir', name:'', mtime:Date.now(), size:0};
    const {parent, name} = await resolvePath(p);
    try {
      const fh = await parent.getFileHandle(name);
      const f = await fh.getFile();
      const meta = await idbGet(META_STORE, p) || {};
      return {type:'file', name, size:f.size, mtime:meta.mtime || f.lastModified || Date.now(), mime:f.type || mimeOf(name)};
    } catch(e){
      try {
        await parent.getDirectoryHandle(name);
        return {type:'dir', name, size:0, mtime:Date.now()};
      } catch(e2){
        throw new Error('ENOENT: '+path);
      }
    }
  }
  
  async function exists(path){
    try { await stat(path); return true; } catch(e){ return false; }
  }
  
  async function readdir(path){
    if (path.startsWith('/mnt/local/')) return LocalFS.readdir(path);
    const p = normPath(path);
    let dir;
    if (p === '/' || p === '') dir = root;
    else {
      const s = await stat(p);
      if (s.type !== 'dir') throw new Error('ENOTDIR: '+path);
      const {parent,name} = await resolvePath(p);
      dir = await parent.getDirectoryHandle(name);
    }
    const out = [];
    for await (const [name, h] of dir.entries()){
      const childPath = join(p, name);
      if (h.kind === 'file'){
        try {
          const f = await h.getFile();
          const meta = await idbGet(META_STORE, childPath) || {};
          out.push({name, type:'file', size:f.size, mtime:meta.mtime || f.lastModified || Date.now(), mime:f.type || mimeOf(name), path:childPath});
        } catch(e){
          out.push({name, type:'file', size:0, mtime:Date.now(), path:childPath});
        }
      } else {
        out.push({name, type:'dir', size:0, mtime:Date.now(), path:childPath});
      }
    }
    return out;
  }
  
  async function mkdir(path, recursive=true){
    if (path.startsWith('/mnt/local/')) return LocalFS.mkdir(path);
    const p = normPath(path);
    const segs = p.split('/').filter(Boolean);
    let cur = root;
    for (const s of segs){
      cur = await cur.getDirectoryHandle(s, {create:true});
    }
    return cur;
  }
  
  async function readFile(path){
    if (path.startsWith('/mnt/local/')) return LocalFS.readFile(path);
    const st = await stat(path);
    if (st.type !== 'file') throw new Error('EISDIR: '+path);
    const {parent,name} = await resolvePath(path);
    const fh = await parent.getFileHandle(name);
    const f = await fh.getFile();
    return await f.arrayBuffer();
  }
  
  async function readText(path){
    const buf = await readFile(path);
    return new TextDecoder('utf-8').decode(buf);
  }
  
  async function writeFile(path, data, opts={}){
    if (path.startsWith('/mnt/local/')) return LocalFS.writeFile(path, data, opts);
    const p = normPath(path);
    const {parent,name} = await resolvePath(p, true);
    const fh = await parent.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    if (typeof data === 'string') await w.write(new TextEncoder().encode(data));
    else if (data instanceof Blob) await w.write(data);
    else if (data instanceof ArrayBuffer) await w.write(new Uint8Array(data));
    else if (ArrayBuffer.isView(data)) await w.write(data);
    else await w.write(data);
    await w.close();
    await idbPut(META_STORE, p, {mtime:Date.now(), ...(opts.meta||{})});
    return true;
  }
  
  async function unlink(path){
    if (path.startsWith('/mnt/local/')) return LocalFS.unlink(path);
    const p = normPath(path);
    const s = await stat(p);
    const {parent,name} = await resolvePath(p);
    if (s.type === 'dir'){
      // 递归删除
      await parent.getDirectoryHandle(name).then(async dh => {
        for await (const [cn] of dh.entries()){ /* OPFS supports removeEntry({recursive}) */ }
      });
      await parent.removeEntry(name, {recursive:true});
    } else {
      await parent.removeEntry(name);
    }
    await idbDel(META_STORE, p);
    return true;
  }
  
  async function rename(oldPath, newPath){
    if (oldPath.startsWith('/mnt/local/') || newPath.startsWith('/mnt/local/')){
      return LocalFS.rename(oldPath, newPath);
    }
    const op = normPath(oldPath), np = normPath(newPath);
    if (op === np) return true;
    // OPFS 没有重命名 API — 复制 + 删除
    const s = await stat(op);
    if (s.type === 'dir'){
      await mkdir(np);
      const kids = await readdir(op);
      for (const k of kids){
        await rename(join(op,k.name), join(np,k.name));
      }
      await unlink(op);
    } else {
      const data = await readFile(op);
      await writeFile(np, data);
      await unlink(op);
    }
    return true;
  }
  
  async function copy(src, dst){
    if (src.startsWith('/mnt/local/') || dst.startsWith('/mnt/local/')){
      return LocalFS.copy(src, dst);
    }
    const s = await stat(src);
    if (s.type === 'dir'){
      await mkdir(dst);
      const kids = await readdir(src);
      for (const k of kids) await copy(join(src,k.name), join(dst,k.name));
    } else {
      const data = await readFile(src);
      await writeFile(dst, data);
    }
    return true;
  }
  
  async function estimate(){
    if (navigator.storage && navigator.storage.estimate){
      return await navigator.storage.estimate();
    }
    return {usage:0, quota:0};
  }
  
  // 递归遍历大小（用于可视化）
  async function du(path='/'){
    if (path.startsWith('/mnt/local/')) return {path,size:0,children:[]};
    const p = normPath(path);
    let total = 0;
    const children = [];
    try {
      const items = await readdir(p);
      for (const it of items){
        if (it.type === 'file'){
          total += it.size;
          children.push({path:it.path,size:it.size,name:it.name});
        } else {
          const sub = await du(it.path);
          total += sub.size;
          children.push(sub);
        }
      }
    } catch(e){}
    return {path, name:basename(p)||'/', size:total, children};
  }
  
  async function resetAll(){
    for await (const [name] of root.entries()){
      await root.removeEntry(name, {recursive:true});
    }
    const tx = idb.transaction(META_STORE,'readwrite');
    tx.objectStore(META_STORE).clear();
    await new Promise(r=>tx.oncomplete=r);
    await init();
  }
  
  return {init, stat, exists, readdir, mkdir, readFile, readText, writeFile, unlink, rename, copy, estimate, du, resetAll, get root(){return root}};
})();

/* =========================================================
 * LocalFS — File System Access API 封装，挂载到 /mnt/local/...
 * ========================================================= */
const LocalFS = (() => {
  // 挂载表：{ mountName: { handle, path } }
  const mounts = new Map();
  
  function parsePath(p){
    // /mnt/local/XXX/rest
    const parts = p.split('/').filter(Boolean);
    // ['mnt','local','XXX',...]
    if (parts[0] !== 'mnt' || parts[1] !== 'local') throw new Error('Invalid local path: '+p);
    const mountName = parts[2];
    const rest = parts.slice(3);
    return {mountName, rest};
  }
  
  async function resolve(p){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    if (!m) throw new Error('Mount not found: '+mountName);
    let cur = m.handle;
    for (let i=0;i<rest.length-1;i++){
      cur = await cur.getDirectoryHandle(rest[i]);
    }
    return {parent: rest.length ? cur : null, name: rest[rest.length-1], mount:cur, mountName, rest};
  }
  
  async function stat(p){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    if (!m) throw new Error('Mount not found');
    if (rest.length === 0){
      return {type:'dir', name:mountName, mtime:Date.now(), size:0, isLocal:true};
    }
    let cur = m.handle;
    for (let i=0;i<rest.length-1;i++){
      cur = await cur.getDirectoryHandle(rest[i]);
    }
    const name = rest[rest.length-1];
    try {
      const fh = await cur.getFileHandle(name);
      const f = await fh.getFile();
      return {type:'file', name, size:f.size, mtime:f.lastModified, mime:f.type || mimeOf(name), isLocal:true};
    } catch(e){
      await cur.getDirectoryHandle(name);
      return {type:'dir', name, size:0, mtime:Date.now(), isLocal:true};
    }
  }
  
  async function readdir(p){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    if (!m) throw new Error('Mount not found');
    let cur = m.handle;
    for (const s of rest){ cur = await cur.getDirectoryHandle(s); }
    const out = [];
    for await (const [name, h] of cur.entries()){
      const childPath = join(p, name);
      if (h.kind === 'file'){
        try {
          const f = await h.getFile();
          out.push({name,type:'file',size:f.size,mtime:f.lastModified,mime:f.type||mimeOf(name),path:childPath,isLocal:true});
        } catch(e){
          out.push({name,type:'file',size:0,mtime:Date.now(),path:childPath,isLocal:true});
        }
      } else {
        out.push({name,type:'dir',size:0,mtime:Date.now(),path:childPath,isLocal:true});
      }
    }
    return out;
  }
  
  async function mkdir(p){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    if (!m) throw new Error('Mount not found');
    let cur = m.handle;
    for (const s of rest){ cur = await cur.getDirectoryHandle(s, {create:true}); }
    return cur;
  }
  
  async function readFile(p){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    let cur = m.handle;
    for (let i=0;i<rest.length-1;i++){ cur = await cur.getDirectoryHandle(rest[i]); }
    const fh = await cur.getFileHandle(rest[rest.length-1]);
    const f = await fh.getFile();
    return await f.arrayBuffer();
  }
  
  async function writeFile(p, data){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    let cur = m.handle;
    for (let i=0;i<rest.length-1;i++){ cur = await cur.getDirectoryHandle(rest[i], {create:true}); }
    const fh = await cur.getFileHandle(rest[rest.length-1], {create:true});
    const w = await fh.createWritable();
    if (typeof data === 'string') await w.write(new TextEncoder().encode(data));
    else if (data instanceof Blob) await w.write(data);
    else if (data instanceof ArrayBuffer) await w.write(new Uint8Array(data));
    else await w.write(data);
    await w.close();
    return true;
  }
  
  async function unlink(p){
    const {mountName, rest} = parsePath(p);
    const m = mounts.get(mountName);
    let cur = m.handle;
    for (let i=0;i<rest.length-1;i++){ cur = await cur.getDirectoryHandle(rest[i]); }
    const name = rest[rest.length-1];
    // 检查是文件还是目录
    try {
      await cur.getFileHandle(name);
      await cur.removeEntry(name);
    } catch(e){
      await cur.removeEntry(name, {recursive:true});
    }
    return true;
  }
  
  async function rename(oldP, newP){
    // File System Access API 没有重命名 — 通过 VFS 的 copy+delete
    const s = await stat(oldP);
    if (s.type === 'dir'){
      await mkdir(newP);
      const kids = await readdir(oldP);
      for (const k of kids) await VFS.rename(join(oldP,k.name), join(newP,k.name));
      await unlink(oldP);
    } else {
      const data = await readFile(oldP);
      await VFS.writeFile(newP, data);
      await unlink(oldP);
    }
    return true;
  }
  
  async function copy(src, dst){
    const s = await stat(src);
    if (s.type === 'dir'){
      await VFS.mkdir(dst);
      const kids = await readdir(src);
      for (const k of kids) await VFS.copy(join(src,k.name), join(dst,k.name));
    } else {
      const data = await readFile(src);
      await VFS.writeFile(dst, data);
    }
    return true;
  }
  
  async function mount(name, handle){
    mounts.set(name, {handle, ts:Date.now()});
    // 持久化挂载信息（不能持久化 handle 本身，仅记录名称以便提醒）
    try {
      await idbPut_('mounts', name, {ts:Date.now()});
    } catch(e){}
    refreshDesktop();
    return true;
  }
  async function idbPut_(store, k, v){
    if (!window.idb) return;
    const tx = window.idb.transaction(store,'readwrite');
    tx.objectStore(store).put(v,k);
    await new Promise(r=>tx.oncomplete=r);
  }
  
  function unmount(name){
    mounts.delete(name);
    refreshDesktop();
  }
  function list(){
    return Array.from(mounts.entries()).map(([k,v])=>({name:k,path:'/mnt/local/'+k}));
  }
  async function pickAndMount(){
    if (!window.showDirectoryPicker){
      toast('此浏览器不支持 File System Access API','error');
      return;
    }
    try {
      const h = await window.showDirectoryPicker({mode:'readwrite'});
      const name = h.name || ('local_'+Date.now());
      await mount(name, h);
      toast(`已挂载 "${name}" 到 /mnt/local/${name}`,'success');
    } catch(e){
      if (e.name !== 'AbortError') toast('挂载失败：'+e.message,'error');
    }
  }
  
  return {stat, readdir, mkdir, readFile, writeFile, unlink, rename, copy, mount, unmount, list, pickAndMount};
})();
window.LocalFS = LocalFS;

/* =========================================================
 * 窗口管理器
 * ========================================================= */
const WM = (() => {
  const wins = new Map(); // id -> {win, data}
  let zTop = 100;
  let activeId = null;
  
  function create(opts){
    const id = 'w'+Date.now()+Math.random().toString(36).slice(2,6);
    const vw = window.innerWidth, vh = window.innerHeight - 42;
    const w = opts.width || 640, h = opts.height || 420;
    const x = opts.x ?? Math.max(20, Math.min(vw-w-20, (vw-w)/2 + (wins.size%6)*20));
    const y = opts.y ?? Math.max(20, Math.min(vh-h-20, (vh-h)/2 + (wins.size%6)*20));
    
    const win = el('div',{class:'window',style:{left:x+'px',top:y+'px',width:w+'px',height:h+'px',zIndex:++zTop}});
    win.dataset.id = id;
    
    const title = el('div',{class:'win-title'}, opts.title || '窗口');
    const titlebar = el('div',{class:'win-titlebar'},
      el('div',{class:'win-icon',html:opts.icon||ICO.file()}),
      title,
      el('div',{class:'win-controls'},
        el('button',{class:'win-btn',title:'最小化',html:ICO.min(),onclick:()=>minimize(id)}),
        !opts.noMaximize ? el('button',{class:'win-btn',title:'最大化',html:ICO.max(),onclick:()=>toggleMax(id)}) : null,
        el('button',{class:'win-btn close',title:'关闭',html:ICO.close(),onclick:()=>close(id)})
      )
    );
    const body = el('div',{class:'win-body'});
    win.append(titlebar, body);
    
    // Resize handles
    if (!opts.noResize){
      for (const d of ['n','s','e','w','ne','nw','se','sw']){
        const h = el('div',{class:'rh rh-'+d});
        h.dataset.dir = d;
        h.addEventListener('pointerdown', ev => startResize(ev, id, d));
        win.append(h);
      }
    }
    
    // Drag
    titlebar.addEventListener('pointerdown', ev => {
      if (ev.target.closest('.win-controls')) return;
      startDrag(ev, id);
    });
    titlebar.addEventListener('dblclick', () => !opts.noMaximize && toggleMax(id));
    win.addEventListener('pointerdown', () => focus(id));
    
    document.body.append(win);
    
    const rec = {id, win, body, title, titlebar, opts, state:{max:false,min:false,prev:null}, onClose:opts.onClose};
    wins.set(id, rec);
    focus(id);
    renderTaskbar();
    return {id, body, setTitle:t=>{title.textContent=t}, close:()=>close(id), win, setBody: node => {body.innerHTML='';body.append(node)}};
  }
  
  function focus(id){
    const r = wins.get(id); if (!r) return;
    if (r.state.min) restore(id);
    r.win.style.zIndex = ++zTop;
    if (activeId !== id){
      const prev = wins.get(activeId);
      if (prev) prev.win.classList.remove('focused');
      activeId = id;
      r.win.classList.add('focused');
      renderTaskbar();
    }
  }
  
  function close(id){
    const r = wins.get(id); if (!r) return;
    try { if (r.onClose) r.onClose(); } catch(e){}
    r.win.classList.add('closing');
    setTimeout(()=>{r.win.remove();wins.delete(id);if(activeId===id)activeId=null;renderTaskbar()},180);
  }
  
  function minimize(id){
    const r = wins.get(id); if (!r) return;
    r.state.min = true;
    r.win.classList.add('minimizing');
    setTimeout(()=>{r.win.style.display='none';r.win.classList.remove('minimizing')},260);
    renderTaskbar();
  }
  function restore(id){
    const r = wins.get(id); if (!r) return;
    r.state.min = false;
    r.win.style.display='flex';
    focus(id);
    renderTaskbar();
  }
  function toggleMax(id){
    const r = wins.get(id); if (!r) return;
    if (r.state.max){
      r.state.max = false;
      r.win.classList.remove('maximized');
      const p = r.state.prev;
      Object.assign(r.win.style, {left:p.left,top:p.top,width:p.width,height:p.height});
    } else {
      r.state.prev = {left:r.win.style.left,top:r.win.style.top,width:r.win.style.width,height:r.win.style.height};
      r.state.max = true;
      r.win.classList.add('maximized');
      Object.assign(r.win.style, {left:'0',top:'0',width:'100vw',height:'calc(100vh - 42px)'});
    }
  }
  
  function startDrag(ev, id){
    const r = wins.get(id); if (!r || r.state.max) return;
    ev.preventDefault();
    focus(id);
    const rect = r.win.getBoundingClientRect();
    const sx = ev.clientX, sy = ev.clientY;
    const ox = rect.left, oy = rect.top;
    const move = e => {
      const nx = Math.max(0, Math.min(window.innerWidth-80, ox + e.clientX - sx));
      const ny = Math.max(0, Math.min(window.innerHeight-42-32, oy + e.clientY - sy));
      r.win.style.left = nx+'px'; r.win.style.top = ny+'px';
    };
    const up = () => {document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  }
  
  function startResize(ev, id, dir){
    const r = wins.get(id); if (!r || r.state.max) return;
    ev.preventDefault(); ev.stopPropagation();
    focus(id);
    const rect = r.win.getBoundingClientRect();
    const sx = ev.clientX, sy = ev.clientY;
    const ow = rect.width, oh = rect.height, ox = rect.left, oy = rect.top;
    const mw = 300, mh = 200;
    const move = e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      let nw=ow,nh=oh,nx=ox,ny=oy;
      if (dir.includes('e')) nw = Math.max(mw, ow + dx);
      if (dir.includes('s')) nh = Math.max(mh, oh + dy);
      if (dir.includes('w')){ nw = Math.max(mw, ow - dx); nx = ox + ow - nw; }
      if (dir.includes('n')){ nh = Math.max(mh, oh - dy); ny = oy + oh - nh; }
      r.win.style.width = nw+'px'; r.win.style.height = nh+'px';
      r.win.style.left = nx+'px'; r.win.style.top = ny+'px';
    };
    const up = () => {document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  }
  
  function renderTaskbar(){
    const tb = $('#taskbar-items'); tb.innerHTML = '';
    wins.forEach(r => {
      const b = el('div',{class:'tb-item'+(activeId===r.id&&!r.state.min?' active':''),onclick:()=>{
        if (r.state.min) restore(r.id);
        else if (activeId===r.id) minimize(r.id);
        else focus(r.id);
      }}, el('span',{html:r.opts.icon||ICO.file()}), el('span',{}, r.opts.title||'窗口'));
      tb.append(b);
    });
  }
  
  return {create, close, focus, minimize, restore, toggleMax, renderTaskbar, wins:()=>wins};
})();

/* =========================================================
 * 桌面图标系统
 * 使用 HTML5 Drag & Drop（桌面内）+ 触摸拖拽（移动端）
 * 不使用自定义 pointer 拖拽，避免冲突
 * ========================================================= */
const Desktop = (() => {
  let icons = []; // [{id,name,path,type,x,y}]
  let selected = new Set();
  let dragCache = new Map(); // path -> File 预加载
  
  async function loadIcons(){
    // 从 IDB 加载布局（仅 FS 项，快捷方式由 boot 重新添加）
    try {
      const saved = await idbGetLocal('meta', 'desktop-icons');
      if (saved) { icons = saved.filter(i => i.kind !== 'shortcut'); return; }
    } catch(e){}
    // 默认：从 /Desktop 读取
    await rebuildFromFS();
  }
  async function saveIcons(){
    // 不保存快捷方式（action 函数无法序列化），下次启动时重新添加
    const persistent = icons.filter(i => i.kind !== 'shortcut');
    try { await idbPutLocal('meta', 'desktop-icons', persistent); } catch(e){}
  }
  async function idbGetLocal(store, k){
    if (!window.idb) return null;
    return new Promise(res => {
      const tx = window.idb.transaction(store,'readonly');
      const r = tx.objectStore(store).get(k);
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
    });
  }
  async function idbPutLocal(store, k, v){
    if (!window.idb) return;
    return new Promise(res => {
      const tx = window.idb.transaction(store,'readwrite');
      tx.objectStore(store).put(v, k);
      tx.oncomplete = ()=>res();
      tx.onerror = ()=>res();
    });
  }
  
  async function rebuildFromFS(){
    // 保留非 FS 的快捷方式图标（如 回收站）
    const shortcuts = icons.filter(i => i.kind === 'shortcut');
    icons = shortcuts;
    try {
      const items = await VFS.readdir('/Desktop');
      for (const it of items){
        icons.push({id:'fs-'+it.path, name:it.name, path:it.path, type:it.type, kind:'fs',
          x:null, y:null});
      }
    } catch(e){}
    autoLayout();
    await saveIcons();
  }
  
  function autoLayout(){
    const layer = $('#icon-layer');
    const rect = layer.getBoundingClientRect();
    const cellW = 92, cellH = 96;
    const cols = Math.max(1, Math.floor(rect.width / cellW));
    let col = 0, row = 0;
    for (const ic of icons){
      if (ic.x == null || ic.y == null){
        ic.x = 10 + col * cellW;
        ic.y = 10 + row * cellH;
        col++;
        if (col >= cols){ col = 0; row++; }
      }
    }
  }
  
  function iconFor(item){
    if (item.kind === 'shortcut' && item.iconKey && ICO[item.iconKey]) return ICO[item.iconKey]();
    if (item.type === 'dir') return ICO.folder();
    const ext = extOf(item.name);
    if (isImageExt(ext)) return ICO.image();
    if (isAudioExt(ext)) return ICO.audio();
    if (isVideoExt(ext)) return ICO.video();
    if (ext === 'zip' || ext === 'gz' || ext === 'tar' || ext === 'tgz') return ICO.zip();
    if (ext === 'pdf') return ICO.pdf();
    if (ext === 'csv' || ext === 'tsv') return ICO.csv();
    if (ext === 'html' || ext === 'htm') return ICO.html();
    if (ext === 'css') return ICO.css();
    if (ext === 'js' || ext === 'mjs') return ICO.js();
    if (isTextExt(ext)) return ICO.text();
    return ICO.file();
  }
  
  function render(){
    const layer = $('#icon-layer');
    layer.innerHTML = '';
    for (const ic of icons){
      const node = el('div',{class:'dsk-icon'+(selected.has(ic.id)?' selected':''),
        style:{left:ic.x+'px', top:ic.y+'px'},
        draggable:'true',
        'data-id':ic.id
      });
      node.innerHTML = `<div class="icon-img">${iconFor(ic)}</div><div class="icon-label">${esc(ic.name)}</div>`;
      
      // 单击选中
      node.addEventListener('click', e => {
        if (!e.ctrlKey && !e.metaKey) selected.clear();
        selected.add(ic.id);
        render();
      });
      // 双击打开
      node.addEventListener('dblclick', e => {
        e.stopPropagation();
        openItem(ic);
      });
      
      // 右键
      node.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        if (!selected.has(ic.id)){ selected.clear(); selected.add(ic.id); render(); }
        showIconContext(e.clientX, e.clientY, ic);
      });
      
      // ===== HTML5 Drag & Drop =====
      // 严格同步，不使用 async/await
      node.addEventListener('dragstart', e => {
        node.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'copyMove';
        
        // 内部数据（同步）
        e.dataTransfer.setData('application/x-aeroos-path', ic.path || '');
        e.dataTransfer.setData('application/x-aeroos-type', ic.type || 'file');
        e.dataTransfer.setData('application/x-aeroos-id', ic.id);
        
        // 拖出浏览器：使用已在 mouseenter 时预加载的缓存
        const cached = dragCache.get(ic.path);
        if (cached){
          try {
            e.dataTransfer.items.add(cached);
            const url = URL.createObjectURL(cached);
            e.dataTransfer.setData('DownloadURL', `${cached.type||'application/octet-stream'}:${cached.name}:${url}`);
            setTimeout(()=>URL.revokeObjectURL(url), 6000);
          } catch(err){}
        }
      });
      node.addEventListener('dragend', ()=>{ node.classList.remove('dragging'); });
      node.addEventListener('dragover', e => {
        if (ic.type === 'dir'){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; node.style.outline='2px solid rgba(23,144,255,0.8)'; }
      });
      node.addEventListener('dragleave', ()=>{ node.style.outline=''; });
      node.addEventListener('drop', async e => {
        e.preventDefault(); e.stopPropagation();
        node.style.outline='';
        if (ic.type !== 'dir') return;
        // 内部移动：其他图标拖到文件夹上
        const srcId = e.dataTransfer.getData('application/x-aeroos-id');
        if (srcId && srcId !== ic.id){
          const src = icons.find(x=>x.id===srcId);
          if (src && src.kind === 'fs'){
            try {
              const dstPath = join(ic.path, src.name);
              await VFS.rename(src.path, dstPath);
              toast('已移动 '+src.name,'success',1500);
              await rebuildFromFS(); render();
            } catch(err){ toast('移动失败：'+err.message,'error'); }
          }
        }
        // 外部文件拖到文件夹上
        if (e.dataTransfer.files && e.dataTransfer.files.length){
          await importFilesInto(e.dataTransfer, ic.path);
        }
      });
      
      // 预加载文件到缓存（鼠标进入时异步）
      node.addEventListener('mouseenter', async () => {
        if (ic.type === 'dir' || !ic.path || ic.kind !== 'fs') return;
        if (dragCache.has(ic.path)) return;
        try {
          const buf = await VFS.readFile(ic.path);
          const file = new File([buf], ic.name, {type: mimeOf(ic.name)});
          dragCache.set(ic.path, file);
        } catch(e){}
      });
      
      // 触摸拖拽（移动端）
      let touchDrag = null;
      node.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        touchDrag = {sx:t.clientX, sy:t.clientY, ox:ic.x, oy:ic.y, moved:false, ghost:null};
      }, {passive:true});
      node.addEventListener('touchmove', e => {
        if (!touchDrag) return;
        const t = e.touches[0];
        const dx = t.clientX - touchDrag.sx, dy = t.clientY - touchDrag.sy;
        if (!touchDrag.moved && Math.abs(dx)+Math.abs(dy) < 10) return;
        if (!touchDrag.moved){
          touchDrag.moved = true;
          e.preventDefault();
        }
        if (touchDrag.moved){
          e.preventDefault();
          ic.x = touchDrag.ox + dx; ic.y = touchDrag.oy + dy;
          node.style.left = ic.x+'px'; node.style.top = ic.y+'px';
        }
      }, {passive:false});
      node.addEventListener('touchend', () => {
        if (touchDrag && touchDrag.moved){ saveIcons(); }
        touchDrag = null;
      });
      
      layer.append(node);
    }
  }
  
  function clearSelection(){ selected.clear(); render(); }
  
  async function openItem(ic){
    if (ic.kind === 'shortcut' && ic.action){
      ic.action(); return;
    }
    if (!ic.path) return;
    try {
      const s = await VFS.stat(ic.path);
      if (s.type === 'dir') Apps.explorer(ic.path);
      else Apps.openFile(ic.path);
    } catch(e){ toast('无法打开：'+e.message,'error'); }
  }
  
  function showIconContext(x, y, ic){
    const items = [];
    items.push({label:'打开', icon:ICO.fwd(), onclick:()=>openItem(ic)});
    if (ic.kind === 'fs'){
      items.push({sep:true});
      items.push({label:'重命名', onclick:async()=>{
        const nn = await prompt_('重命名', ic.name, ic.name);
        if (!nn || nn === ic.name) return;
        try {
          const np = join(dirname(ic.path), nn);
          await VFS.rename(ic.path, np);
          await rebuildFromFS(); render();
        } catch(e){ toast('重命名失败：'+e.message,'error'); }
      }});
      items.push({label:'删除', onclick:async()=>{
        if (!await confirm_('删除','确定删除 '+ic.name+' ?','删除')) return;
        try { await VFS.unlink(ic.path); await rebuildFromFS(); render(); } catch(e){ toast('删除失败','error'); }
      }});
      items.push({label:'导出到本地', icon:ICO.download(), onclick:()=>exportItem(ic)});
      if (ic.type === 'file'){
        items.push({sep:true});
        items.push({label:'打开方式', sub:[
          {label:'记事本', onclick:()=>Apps.notepad(ic.path)},
          {label:'代码编辑器', onclick:()=>Apps.editor(ic.path)},
          {label:'网页浏览器', onclick:()=>Apps.browser(ic.path)},
        ]});
      }
    }
    if (ic.kind === 'shortcut' && ic.removable){
      items.push({sep:true});
      items.push({label:'从桌面移除', onclick:async()=>{
        icons = icons.filter(i=>i.id!==ic.id); saveIcons(); render();
      }});
    }
    showContextMenu(x, y, items);
  }
  
  async function exportItem(ic){
    try {
      const s = await VFS.stat(ic.path);
      if (s.type === 'dir'){
        // 打包成 zip
        const zip = new JSZip();
        const add = async (path, rel) => {
          const items = await VFS.readdir(path);
          for (const it of items){
            const p = rel ? rel+'/'+it.name : it.name;
            if (it.type === 'dir') await add(it.path, p);
            else zip.file(p, await VFS.readFile(it.path));
          }
        };
        await add(ic.path, '');
        const blob = await zip.generateAsync({type:'blob'});
        downloadBlob(blob, ic.name+'.zip');
      } else {
        const buf = await VFS.readFile(ic.path);
        downloadBlob(new Blob([buf], {type:mimeOf(ic.name)}), ic.name);
      }
    } catch(e){ toast('导出失败：'+e.message,'error'); }
  }
  
  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }
  
  // 桌面区域拖放（外部文件导入 + 内部图标移动）
  function setupDesktopDrop(){
    const layer = $('#icon-layer');
    layer.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
    layer.addEventListener('drop', async e => {
      e.preventDefault();
      // 判断是否是内部图标移动（落在空白处）
      const srcId = e.dataTransfer.getData('application/x-aeroos-id');
      if (srcId){
        const ic = icons.find(x=>x.id===srcId);
        if (ic){
          const rect = layer.getBoundingClientRect();
          ic.x = e.clientX - rect.left - 43;
          ic.y = e.clientY - rect.top - 48;
          saveIcons(); render();
          return;
        }
      }
      // 外部文件导入
      if (e.dataTransfer.items && e.dataTransfer.items.length){
        await importFilesInto(e.dataTransfer, '/Desktop');
      }
    });
  }
  
  // 递归导入外部文件（支持目录）
  async function importFilesInto(dt, dirPath){
    let imported = 0;
    const entries = [];
    for (let i=0;i<dt.items.length;i++){
      const it = dt.items[i];
      if (it.webkitGetAsEntry){
        const e = it.webkitGetAsEntry();
        if (e) entries.push(e);
      } else if (it.getAsEntry){
        const e = it.getAsEntry();
        if (e) entries.push(e);
      }
    }
    if (entries.length === 0 && dt.files){
      // 降级
      for (const f of dt.files){
        try {
          const buf = await f.arrayBuffer();
          await VFS.writeFile(join(dirPath, f.name), buf);
          imported++;
        } catch(e){}
      }
    } else {
      for (const e of entries){
        try {
          await importEntry(e, dirPath);
          imported++;
        } catch(err){ toast('导入失败: '+err.message,'error'); }
      }
    }
    if (imported > 0){
      toast(`已导入 ${imported} 项到 ${basename(dirPath)||'桌面'}`,'success');
      if (dirPath === '/Desktop'){ await rebuildFromFS(); render(); }
      // 刷新所有打开的资源管理器
      document.dispatchEvent(new CustomEvent('vfs-change', {detail:{path:dirPath}}));
    }
  }
  
  async function importEntry(entry, parentPath){
    if (entry.isFile){
      const file = await new Promise((res,rej) => entry.file(res, rej));
      const buf = await file.arrayBuffer();
      await VFS.writeFile(join(parentPath, entry.name), buf);
    } else if (entry.isDirectory){
      const newPath = join(parentPath, entry.name);
      await VFS.mkdir(newPath);
      const reader = entry.createReader();
      let all = [];
      while (true){
        const batch = await new Promise((res,rej)=>reader.readEntries(res,rej));
        if (!batch.length) break;
        all = all.concat(batch);
      }
      for (const c of all) await importEntry(c, newPath);
    }
  }
  
  // 框选
  function setupRubber(){
    const layer = $('#icon-layer');
    const selRect = $('#sel-rect');
    let start = null;
    layer.addEventListener('pointerdown', e => {
      if (e.target !== layer && !e.target.classList.contains('icon-layer')) return;
      if (e.button !== 0) return;
      start = {x:e.clientX, y:e.clientY, cx:e.clientX, cy:e.clientY};
      selected.clear(); render();
      const onMove = ev => {
        if (!start) return;
        start.cx = ev.clientX; start.cy = ev.clientY;
        const r = {
          x: Math.min(start.x, start.cx), y: Math.min(start.y, start.cy),
          w: Math.abs(start.cx - start.x), h: Math.abs(start.cy - start.y)
        };
        selRect.style.display = 'block';
        selRect.style.left = r.x+'px'; selRect.style.top = r.y+'px';
        selRect.style.width = r.w+'px'; selRect.style.height = r.h+'px';
        // 更新选中
        selected.clear();
        const lr = layer.getBoundingClientRect();
        for (const ic of icons){
          const ix = lr.left + ic.x, iy = lr.top + ic.y;
          if (ix < r.x+r.w && ix+86 > r.x && iy < r.y+r.h && iy+96 > r.y){
            selected.add(ic.id);
          }
        }
        render();
      };
      const onUp = () => {
        start = null;
        selRect.style.display = 'none';
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }
  
  async function newFolder(){
    const name = await prompt_('新建文件夹', '文件夹名', '新建文件夹');
    if (!name) return;
    try {
      await VFS.mkdir('/Desktop/'+name);
      await rebuildFromFS(); render();
    } catch(e){ toast('创建失败','error'); }
  }
  async function newFile(){
    const name = await prompt_('新建文件', '文件名.txt', '未命名.txt');
    if (!name) return;
    try {
      await VFS.writeFile('/Desktop/'+name, '');
      await rebuildFromFS(); render();
    } catch(e){ toast('创建失败','error'); }
  }
  async function uploadToDesktop(){
    const inp = el('input',{type:'file',multiple:'true'});
    inp.onchange = async () => {
      if (!inp.files.length) return;
      for (const f of inp.files){
        const buf = await f.arrayBuffer();
        await VFS.writeFile('/Desktop/'+f.name, buf);
      }
      toast(`已上传 ${inp.files.length} 个文件`,'success');
      await rebuildFromFS(); render();
    };
    inp.click();
  }
  
  function addShortcut(opts){
    const id = 'sc-'+opts.key;
    if (icons.find(i=>i.id===id)) return;
    // 找空位
    icons.push({id, name:opts.name, kind:'shortcut', iconKey:opts.iconKey, action:opts.action, removable:opts.removable!==false, x:null, y:null, type:'shortcut'});
    autoLayout(); saveIcons(); render();
  }
  
  function getSelected(){ return icons.filter(i=>selected.has(i.id)); }
  
  return {loadIcons, saveIcons, render, clearSelection, openItem, rebuildFromFS, setupDesktopDrop, setupRubber, newFolder, newFile, uploadToDesktop, addShortcut, exportItem, icons:()=>icons, getSelected};
})();

/* =========================================================
 * 右键菜单
 * ========================================================= */
let currentMenu = null;
function closeContextMenu(){
  if (currentMenu){ currentMenu.remove(); currentMenu = null; }
}
function showContextMenu(x, y, items, parent=null){
  closeContextMenu();
  const m = el('div',{class:'ctx-menu'});
  for (const it of items){
    if (it.sep){ m.append(el('div',{class:'ctx-sep'})); continue; }
    const node = el('div',{class:'ctx-item'+(it.disabled?' disabled':'')+(it.sub?' has-sub':''),
      html:(it.icon?it.icon:'')+esc(it.label)});
    node.addEventListener('click', e => {
      if (it.disabled || it.sub) return;
      closeContextMenu();
      try { it.onclick && it.onclick(e); } catch(err){ toast(err.message,'error'); }
    });
    if (it.sub){
      node.addEventListener('mouseenter', () => {
        const rect = node.getBoundingClientRect();
        showContextMenu(rect.right, rect.top, it.sub, m);
      });
    }
    m.append(node);
  }
  document.body.append(m);
  // 位置调整
  const mr = m.getBoundingClientRect();
  if (x + mr.width > window.innerWidth) x = window.innerWidth - mr.width - 4;
  if (y + mr.height > window.innerHeight) y = window.innerHeight - mr.height - 4;
  m.style.left = x+'px'; m.style.top = y+'px';
  currentMenu = m;
}
document.addEventListener('click', closeContextMenu);
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.ctx-menu')) return;
  // 默认桌面菜单
  if (e.target.closest('#icon-layer') && !e.target.closest('.dsk-icon')){
    e.preventDefault();
    Desktop.clearSelection();
    showContextMenu(e.clientX, e.clientY, [
      {label:'刷新', icon:ICO.refresh(), onclick: async()=>{await Desktop.rebuildFromFS();Desktop.render();}},
      {sep:true},
      {label:'新建文件夹', icon:ICO.newf(), onclick:()=>Desktop.newFolder()},
      {label:'新建文件', onclick:()=>Desktop.newFile()},
      {label:'上传文件', icon:ICO.upload(), onclick:()=>Desktop.uploadToDesktop()},
      {sep:true},
      {label:'挂载本地文件夹', icon:ICO.mount(), onclick:()=>LocalFS.pickAndMount()},
      {sep:true},
      {label:document.fullscreenElement?'退出全屏':'全屏模式', onclick:()=>{
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }},
      {label:'设置', icon:ICO.settings(), onclick:()=>Apps.settings()},
    ]);
  }
});

  'aero-sunset': 'linear-gradient(180deg, #ffa07a 0%, #ffb088 30%, #a0d8ff 70%, #7fd0ff 100%)',
  'aero-ocean': 'linear-gradient(180deg, #0a60c0 0%, #1790ff 40%, #7fd0ff 80%, #d7f0c4 100%)',
  'aero-mint': 'linear-gradient(180deg, #b8f0d0 0%, #7ed957 40%, #3a9c25 100%)',
  'aero-aurora': 'linear-gradient(180deg, #1a2540 0%, #4a3a9c 30%, #9c3a7a 60%, #ffa07a 100%)',
  'aero-dawn': 'linear-gradient(180deg, #2a1a4a 0%, #9c3a7a 40%, #ffa07a 80%, #ffe89a 100%)',
