async function applyWallpaper(key){
  const wp = $('#wallpaper');
  if (WALLPAPERS[key]){
    wp.style.background = WALLPAPERS[key];
    document.body.style.background = WALLPAPERS[key];
  } else if (key && key.startsWith('custom:')){
    try {
      const buf = await VFS.readFile(key.slice(7));
      const blob = new Blob([buf]);
      const url = URL.createObjectURL(blob);
      wp.style.background = `url(${url}) center/cover`;
    } catch(e){}
  }
  try { await idbPutLocal('meta','wallpaper',key); } catch(e){}
}
async function loadWallpaper(){
  try {
    const k = await idbGetLocal('meta','wallpaper');
    if (k) await applyWallpaper(k);
  } catch(e){}
}

/* =========================================================
 * Apps
 * ========================================================= */
const Apps = {
  registry: {},
  register(key, def){ this.registry[key] = def; },
  
  openFile(path){
    // 智能分派
    (async () => {
      try {
        const s = await VFS.stat(path);
        if (s.type === 'dir'){ Apps.explorer(path); return; }
        const ext = extOf(path);
        const mime = s.mime || mimeOf(path);
        if (isImageExt(ext)){
          // 判断是否是漫画序列
          Apps.imageView(path);
          return;
        }
        if (isAudioExt(ext)){ Apps.media(path,'audio'); return; }
        if (isVideoExt(ext)){ Apps.media(path,'video'); return; }
        if (ext === 'pdf'){ Apps.pdf(path); return; }
        if (ext === 'zip' || ext === 'gz' || ext === 'tgz'){ Apps.extract(path); return; }
        if (ext === 'csv' || ext === 'tsv'){ Apps.notepad(path, 'csv'); return; }
        if (ext === 'html' || ext === 'htm'){ Apps.openHTML(path); return; }
        if (isTextExt(ext)){ Apps.notepad(path); return; }
        // 通用：尝试文本打开
        if (mime.startsWith('text/') || /\+xml|\+json$/.test(mime)){
          Apps.notepad(path);
        } else {
          if (await confirm_('未知格式',`文件：${basename(path)}\n格式：${ext||'未知'}\n\n是否尝试以文本打开？`,'打开')){
            Apps.notepad(path);
          }
        }
      } catch(e){ toast('打开失败：'+e.message,'error'); }
    })();
  },
  
  openHTML(path){
    // 提供 "浏览器打开" 或 "编辑" 选择
    const ov = el('div',{class:'dialog-overlay'});
    const d = el('div',{class:'dialog'},
      el('div',{class:'dialog-head'}, 'HTML 文件 · '+basename(path)),
      el('div',{class:'dialog-body',style:{textAlign:'center',padding:'20px'}},
        el('p',{style:{marginBottom:'12px'}}, '请选择操作：'),
        el('div',{style:{display:'flex',gap:'10px',justifyContent:'center'}},
          el('button',{class:'btn primary',onclick:()=>{ov.remove();Apps.browser(path)}},'浏览器打开'),
          el('button',{class:'btn',onclick:()=>{ov.remove();Apps.editor(path)}},'编辑代码'),
          el('button',{class:'btn',onclick:()=>{ov.remove();Apps.notepad(path)}},'记事本'),
        )
      )
    );
    ov.append(d); document.body.append(ov);
  },
  
  /* ----- 文件管理器 ----- */
  explorer(startPath='/'){
    const win = WM.create({title:'文件资源管理器', icon:ICO.explorer(), width:780, height:500});
    const state = {path:startPath, history:[startPath], hi:0, sortKey:'name', sortDir:1, search:''};
    
    const ui = el('div',{class:'fe'});
    const sidebar = el('div',{class:'fe-sidebar'});
    const main = el('div',{class:'fe-main'});
    const toolbar = el('div',{class:'fe-toolbar'});
    const btnBack = el('button',{class:'fe-tbtn',title:'后退',html:ICO.back()});
    const btnFwd = el('button',{class:'fe-tbtn',title:'前进',html:ICO.fwd()});
    const btnUp = el('button',{class:'fe-tbtn',title:'上一级',html:ICO.up()});
    const btnRefresh = el('button',{class:'fe-tbtn',title:'刷新',html:ICO.refresh()});
    const btnNew = el('button',{class:'fe-tbtn',title:'新建文件夹',html:ICO.newf()});
    const btnUpload = el('button',{class:'fe-tbtn',title:'上传',html:ICO.upload()});
    const btnMount = el('button',{class:'fe-tbtn',title:'挂载本地文件夹',html:ICO.mount()});

      sidebar.innerHTML = '';
      const quick = el('div');
      quick.append(el('h4',{},'快速访问'));
      const quicks = [
        {name:'桌面',path:'/Desktop',icon:ICO.home()},
        {name:'文档',path:'/Documents',icon:ICO.folder()},
        {name:'图片',path:'/Pictures',icon:ICO.image()},
        {name:'音乐',path:'/Music',icon:ICO.audio()},
        {name:'视频',path:'/Videos',icon:ICO.video()},
        {name:'下载',path:'/Downloads',icon:ICO.download()},
        {name:'回收站',path:'/Trash',icon:ICO.trash()},
      ];
      for (const q of quicks){
        const item = el('div',{class:'fe-sb-item'+(state.path===q.path?' active':''),html:q.icon,onclick:()=>nav(q.path)}, q.name);
        quick.append(item);
      }
      sidebar.append(quick);

      drives.append(el('h4',{},'驱动器'));

      // 挂载点
      const mounts = LocalFS.list();
      for (const m of mounts){
        drives.append(el('div',{class:'fe-sb-item'+(state.path.startsWith(m.path)?' active':''),html:ICO.mount(),onclick:()=>nav(m.path)}, m.name));
      }
      sidebar.append(drives);
    }
    
    function renderPath(){
      pathEl.innerHTML = '';
      const parts = state.path.split('/').filter(Boolean);
      const home = el('span',{class:'fe-crumb',onclick:()=>nav('/')},'/');

      let acc = '';
      for (const p of parts){
        acc += '/'+p;
        pathEl.append(el('span',{class:'fe-crumb-sep'},'/'));
        const cur = acc;
        pathEl.append(el('span',{class:'fe-crumb',onclick:()=>nav(cur)}, p));
      }
    }
    
    async function renderList(){
      list.innerHTML = '';
      try {
        let items = await VFS.readdir(state.path);
        if (state.search){
          const q = state.search.toLowerCase();
          items = items.filter(i => i.name.toLowerCase().includes(q));
        }
        // 排序
        const key = state.sortKey;
        items.sort((a,b)=>{
          if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
          let av = a[key], bv = b[key];
          if (key === 'name'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
          if (av < bv) return -state.sortDir;
          if (av > bv) return state.sortDir;
          return 0;
        });
        
        const table = el('table',{class:'fe-table'});
        const thead = el('thead');
        const hr = el('tr');
        const cols = [
          {k:'name',label:'名称',flex:3},
          {k:'mtime',label:'修改日期',flex:1.5},
          {k:'_type',label:'类型',flex:1.2},
          {k:'size',label:'大小',flex:1},
        ];
        for (const c of cols){
          const th = el('th',{class:state.sortKey===c.k?'sorted':'',style:{flex:c.flex}},
            c.label, el('span',{class:'arrow'}, state.sortKey===c.k?(state.sortDir>0?'▲':'▼'):''));
          th.addEventListener('click', ()=>{
            if (state.sortKey === c.k) state.sortDir *= -1;
            else { state.sortKey = c.k; state.sortDir = 1; }
            renderList();
          });
          hr.append(th);
        }
        thead.append(hr); table.append(thead);
        const tbody = el('tbody');
        let sel = new Set();
        for (const it of items){
          const tr = el('tr',{class:'row',style:{display:'flex'}});
          const ext = extOf(it.name);
          const icon = it.type==='dir' ? ICO.folder() :
            isImageExt(ext)?ICO.image():isAudioExt(ext)?ICO.audio():isVideoExt(ext)?ICO.video():
            ext==='zip'||ext==='gz'?ICO.zip():ext==='pdf'?ICO.pdf():ext==='csv'||ext==='tsv'?ICO.csv():
            ext==='html'||ext==='htm'?ICO.html():ext==='css'?ICO.css():ext==='js'||ext==='mjs'?ICO.js():
            isTextExt(ext)?ICO.text():ICO.file();
          const typeName = it.type==='dir'?'文件夹':(ext?ext.toUpperCase()+' 文件':'文件');
          const tdName = el('td',{class:'fe-name',style:{flex:3,minWidth:0}}, el('span',{html:icon}), el('span',{}, it.name));
          const tdDate = el('td',{style:{flex:1.5}}, fmtDate(new Date(it.mtime)));
          const tdType = el('td',{style:{flex:1.2}}, typeName);
          const tdSize = el('td',{style:{flex:1}}, it.type==='file'?fmtSize(it.size):'—');
          tr.append(tdName,tdDate,tdType,tdSize);
          tr.addEventListener('click', e => {
            if (!e.ctrlKey && !e.metaKey) sel.clear();
            if (sel.has(it.name)) sel.delete(it.name); else sel.add(it.name);
            $$('.row',tbody).forEach(r=>r.classList.remove('selected'));
            for (const n of sel){
              const r2 = tbody.querySelector(`[data-name="${CSS.escape(n)}"]`);
              if (r2) r2.classList.add('selected');
            }
            tr.dataset.name = it.name;
            if (sel.has(it.name)) tr.classList.add('selected');
            status.innerHTML = `<span>已选 ${sel.size} 项</span><span>${items.length} 项</span>`;
          });
          tr.dataset.name = it.name;
          tr.addEventListener('dblclick', ()=>{
            const p = join(state.path, it.name);
            if (it.type==='dir') nav(p);
            else Apps.openFile(p);
          });
          tr.addEventListener('contextmenu', e => {
            e.preventDefault(); e.stopPropagation();
            if (!sel.has(it.name)){ sel.clear(); sel.add(it.name); }
            $$('.row',tbody).forEach(r=>r.classList.remove('selected'));
            tr.classList.add('selected');
            showFileContext(e.clientX, e.clientY, it, sel, ()=>renderList());
          });
          tbody.append(tr);
        }
        table.append(tbody);
        list.append(table);
        status.innerHTML = `<span>共 ${items.length} 项</span><span>${state.path}</span>`;
      } catch(e){
        list.innerHTML = `<div style="padding:20px;color:#a00">无法读取：${esc(e.message)}</div>`;
      }
    }
    
    async function nav(path, pushHistory=true){
      const p = normPath(path);
      state.path = p;
      if (pushHistory){
        state.history = state.history.slice(0, state.hi+1);
        state.history.push(p);
        state.hi = state.history.length - 1;
      }
      win.setTitle('文件资源管理器 · '+p);
      refreshSidebar(); renderPath(); renderList();
      updateNavButtons();
    }
    function updateNavButtons(){
      btnBack.disabled = state.hi <= 0;
      btnFwd.disabled = state.hi >= state.history.length-1;
      btnUp.disabled = state.path === '/';
    }
    btnBack.onclick = () => { if (state.hi > 0){ state.hi--; nav(state.history[state.hi], false); } };
    btnFwd.onclick = () => { if (state.hi < state.history.length-1){ state.hi++; nav(state.history[state.hi], false); } };
    btnUp.onclick = () => { if (state.path !== '/') nav(dirname(state.path)); };
    btnRefresh.onclick = () => renderList();
    btnNew.onclick = async () => {
      const name = await prompt_('新建文件夹','文件夹名','新建文件夹');
      if (!name) return;
      try { await VFS.mkdir(join(state.path,name)); renderList(); if (state.path==='/Desktop') {await Desktop.rebuildFromFS();Desktop.render();} } catch(e){ toast('创建失败','error'); }
    };
    btnUpload.onclick = () => {
      const inp = el('input',{type:'file',multiple:'true'});
      inp.onchange = async () => {
        for (const f of inp.files){
          const buf = await f.arrayBuffer();
          await VFS.writeFile(join(state.path, f.name), buf);
        }
        toast(`已上传 ${inp.files.length} 个文件`,'success');
        renderList();
        if (state.path==='/Desktop') {await Desktop.rebuildFromFS();Desktop.render();}
      };
      inp.click();
    };
    btnMount.onclick = () => LocalFS.pickAndMount();
    searchInp.oninput = e => { state.search = e.target.value; renderList(); };
    
    document.addEventListener('vfs-change', e => {
      if (e.detail.path === state.path || state.path.startsWith(e.detail.path+'/')) renderList();
    });
    
    nav(startPath);
  },
};

function showFileContext(x, y, it, sel, refresh){
  const path = join(Apps._ctxPath || '', it.name);
  const items = [];
  items.push({label:'打开', icon:ICO.fwd(), onclick:()=>{
    const p = join(Apps._ctxPath,it.name);
    if (it.type==='dir') Apps.explorer(p); else Apps.openFile(p);
  }});
  items.push({sep:true});
  items.push({label:'重命名', onclick:async()=>{
    const nn = await prompt_('重命名', it.name, it.name);
    if (!nn || nn === it.name) return;
    try {
      await VFS.rename(join(Apps._ctxPath,it.name), join(Apps._ctxPath,nn));
      refresh();
      if (Apps._ctxPath==='/Desktop') {await Desktop.rebuildFromFS();Desktop.render();}
    } catch(e){ toast('重命名失败','error'); }
  }});
  items.push({label:'删除', onclick:async()=>{
    if (!await confirm_('删除',`删除 ${sel.size} 项？`,'删除')) return;
    for (const n of sel){
      try { await VFS.unlink(join(Apps._ctxPath, n)); } catch(e){}
    }
    refresh();
    if (Apps._ctxPath==='/Desktop') {await Desktop.rebuildFromFS();Desktop.render();}
  }});
  if (it.type === 'file'){
    items.push({label:'导出到本地', icon:ICO.download(), onclick:async()=>{
      try {
        const buf = await VFS.readFile(join(Apps._ctxPath,it.name));
        const blob = new Blob([buf],{type:mimeOf(it.name)});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url;a.download=it.name;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
      } catch(e){ toast('导出失败','error'); }
    }});
    items.push({sep:true});
    items.push({label:'打开方式', sub:[
      {label:'记事本', onclick:()=>Apps.notepad(join(Apps._ctxPath,it.name))},
      {label:'代码编辑器', onclick:()=>Apps.editor(join(Apps._ctxPath,it.name))},
      {label:'网页浏览器', onclick:()=>Apps.browser(join(Apps._ctxPath,it.name))},
      {label:'漫画阅读器', onclick:()=>Apps.manga(join(Apps._ctxPath,it.name))},
    ]});
  }
  if (it.type === 'dir'){
    items.push({label:'压缩为 ZIP', onclick:async()=>{
      try {
        const zip = new JSZip();
        const add = async (p, rel) => {
          const ks = await VFS.readdir(p);
          for (const k of ks){
            const r = rel?rel+'/'+k.name:k.name;
            if (k.type==='dir') await add(k.path,r);
            else zip.file(r, await VFS.readFile(k.path));
          }
        };
        await add(join(Apps._ctxPath,it.name), '');
        const blob = await zip.generateAsync({type:'blob'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url;a.download=it.name+'.zip';a.click();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
      } catch(e){ toast('压缩失败','error'); }
    }});
  }
  showContextMenu(x, y, items);
}

    try { await VFS.mkdir(join(state.path,name)); renderList(); if (state.path==='/Desktop'){await Desktop.rebuildFromFS();Desktop.render();} } catch(e){ toast('创建失败','error'); }
  };
  btnUpload.onclick = () => {
    const inp = el('input',{type:'file',multiple:'true'});
    inp.onchange = async () => {
      for (const f of inp.files){ await VFS.writeFile(join(state.path,f.name), await f.arrayBuffer()); }
      toast(`已上传 ${inp.files.length} 个文件`,'success');
      renderList();
      if (state.path==='/Desktop'){await Desktop.rebuildFromFS();Desktop.render();}
    };
    inp.click();
  };
  btnMount.onclick = () => LocalFS.pickAndMount();
  searchInp.oninput = e => { state.search=e.target.value; renderList(); };
  
  // 列表区拖放导入
  list.addEventListener('dragover', e => { e.preventDefault(); });
  list.addEventListener('drop', async e => {
    e.preventDefault();
    if (e.dataTransfer.items && e.dataTransfer.items.length){
      // 复用 Desktop 的 import
      const dt = e.dataTransfer;
      let imported = 0;
      const entries = [];
      for (let i=0;i<dt.items.length;i++){ const it=dt.items[i]; if (it.webkitGetAsEntry){const e=it.webkitGetAsEntry();if(e)entries.push(e);} }
      async function importEntry(entry,parentPath){
        if (entry.isFile){ const f=await new Promise((r,j)=>entry.file(r,j)); await VFS.writeFile(join(parentPath,entry.name), await f.arrayBuffer()); }
        else if (entry.isDirectory){ const np=join(parentPath,entry.name); await VFS.mkdir(np); const reader=entry.createReader(); let all=[]; while(true){const b=await new Promise((r,j)=>reader.readEntries(r,j));if(!b.length)break;all=all.concat(b);} for(const c of all)await importEntry(c,np); }
      }
      if (entries.length){ for (const e of entries) await importEntry(e, state.path); imported=entries.length; }
      else if (dt.files){ for (const f of dt.files){ await VFS.writeFile(join(state.path,f.name), await f.arrayBuffer()); imported++; } }
      if (imported){ toast(`已导入 ${imported} 项`,'success'); renderList(); if (state.path==='/Desktop'){await Desktop.rebuildFromFS();Desktop.render();} }
    }
  });
  
  const refreshHandler = e => {
    if (e.detail.path === state.path || state.path.startsWith(e.detail.path+'/')) renderList();
  };
  document.addEventListener('vfs-change', refreshHandler);
  win.onClose = () => document.removeEventListener('vfs-change', refreshHandler);
  
  nav(startPath);
};

/* ----- 记事本 ----- */
Apps.notepad = async function(path, mode='text'){
  let content = '', name = '未命名.txt', dir = '/Documents', detectedMode = mode;
  if (path){
    try {
      content = await VFS.readText(path);
      name = basename(path); dir = dirname(path);
      const ext = extOf(name);
      if (ext==='csv') detectedMode = 'csv';
      else if (ext==='tsv') detectedMode = 'tsv';
    } catch(e){ toast('读取失败：'+e.message,'error'); }
  }
  const win = WM.create({title:'记事本 · '+name, icon:ICO.notepad(), width:640, height:460});
  
  if (detectedMode === 'csv' || detectedMode === 'tsv'){
    // CSV/TSV 双视图
    const root = el('div',{class:'np'});
    const toolbar = el('div',{class:'np-toolbar'});
    const btnSave = el('button',{},'保存');
    const btnTableView = el('button',{class:'active'},'表格视图');
    const btnTextView = el('button',{},'文本视图');
    const btnExport = el('button',{},'导出');
    toolbar.append(btnSave, el('span',{style:{width:'1px',height:'20px',background:'rgba(100,140,180,0.3)',margin:'0 4px'}}), btnTableView, btnTextView, btnExport);
    const textArea = el('textarea',{class:'np-area',style:{display:'none'}});
    textArea.value = content;
    const csvView = el('div',{class:'np-csv'});
    const status = el('div',{class:'np-status'});
    root.append(toolbar, csvView, textArea, status);
    win.setBody(root);
    
    const delim = detectedMode === 'tsv' ? '\t' : ',';
    function renderTable(){
      const lines = textArea.value.split(/\r?\n/).filter(l=>l.length);
      const rows = lines.map(l => parseCSVLine(l, delim));
      csvView.innerHTML = '';
      if (!rows.length){ csvView.append(el('div',{style:{padding:20,color:'#888'}},'空文件')); return; }
      const table = el('table');
      const thead = el('thead');
      const hr = el('tr');
      for (const c of rows[0]) hr.append(el('th',{}, c));
      thead.append(hr); table.append(thead);
      const tbody = el('tbody');
      for (let i=1;i<rows.length;i++){
        const tr = el('tr');
        for (const c of rows[i]) tr.append(el('td',{}, c));
        tbody.append(tr);
      }
      table.append(tbody); csvView.append(table);
      status.innerHTML = `<span>${rows.length} 行 × ${(rows[0]||[]).length} 列</span><span>${dir}/${name}</span>`;
    }
    function parseCSVLine(line, d){
      const out = []; let cur = '', inQ = false;
      for (let i=0;i<line.length;i++){
        const c = line[i];
        if (inQ){ if (c==='"'){ if (line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
        else { if (c===d[0] && (d.length===1||line.slice(i,i+d.length)===d)){out.push(cur);cur='';if(d.length>1)i+=d.length-1;} else if (c==='"') inQ=true; else cur+=c; }
      }
      out.push(cur); return out;
    }
    btnTableView.onclick = () => { csvView.style.display=''; textArea.style.display='none'; btnTableView.classList.add('active'); btnTextView.classList.remove('active'); renderTable(); };
    btnTextView.onclick = () => { csvView.style.display='none'; textArea.style.display=''; btnTableView.classList.remove('active'); btnTextView.classList.add('active'); textArea.focus(); };
    btnSave.onclick = async () => {
      try { await VFS.writeFile(join(dir,name), textArea.value); toast('已保存','success'); } catch(e){ toast('保存失败','error'); }
    };
    btnExport.onclick = () => {
      const blob = new Blob([textArea.value], {type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url;a.download=name;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    };
    renderTable();
    return;
  }
  
  // 普通文本
  const root = el('div',{class:'np'});
  const toolbar = el('div',{class:'np-toolbar'});
  const btnSave = el('button',{},'保存 (Ctrl+S)');
  const btnNew = el('button',{},'新建');
  const btnOpen = el('button',{},'打开');
  const btnExport = el('button',{},'导出');
  const btnEditor = el('button',{},'在代码编辑器中打开');
  toolbar.append(btnNew, btnOpen, btnSave, btnExport, btnEditor);
  const ta = el('textarea',{class:'np-area'});
  ta.value = content;
  const status = el('div',{class:'np-status'});
  root.append(toolbar, ta, status);
  win.setBody(root);
  function upd(){
    const lines = ta.value.split('\n').length;
    const chars = ta.value.length;
    const pos = ta.selectionStart;
    const before = ta.value.slice(0,pos);
    const ln = before.split('\n').length;
    const col = before.length - before.lastIndexOf('\n');
    status.innerHTML = `<span>行 ${ln}, 列 ${col} · ${chars} 字符 · ${lines} 行</span><span>${dir}/${name}</span>`;
  }
  ta.addEventListener('input', upd);
  ta.addEventListener('click', upd); ta.addEventListener('keyup', upd);
  upd();
  
  async function save(){
    const np = path ? join(dir,name) : '/Documents/'+name;
    try { await VFS.writeFile(np, ta.value); toast('已保存','success'); document.dispatchEvent(new CustomEvent('vfs-change',{detail:{path:dirname(np)}})); } catch(e){ toast('保存失败','error'); }
  }
  btnSave.onclick = save;
  btnNew.onclick = async () => { if (ta.value && !await confirm_('新建','当前内容将被丢失，继续？')) return; ta.value=''; name='未命名.txt'; win.setTitle('记事本 · '+name); upd(); };
  btnOpen.onclick = async () => {
    const inp = el('input',{type:'file'});
    inp.onchange = async () => { if (inp.files[0]){ ta.value = await inp.files[0].text(); name = inp.files[0].name; win.setTitle('记事本 · '+name); upd(); } };
    inp.click();
  };
  btnExport.onclick = () => {
    const blob = new Blob([ta.value], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  };
  btnEditor.onclick = () => { if (path) Apps.editor(path); else toast('请先保存文件','error'); };
  ta.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); save(); } });
};

  findbar.append(findInp,findCount,btnPrev,btnNext,btnCase,btnWord,btnReg,el('span',{class:'sep'}),repInp,btnRepOne,btnRepAll,btnCloseFind);
  
  const split = el('div',{class:'he-split'});

  preview.append(iframe);
  const taEl = el('textarea');
  editPane.append(taEl);

  win.setBody(root);
  
  // CodeMirror init（textarea 已在 DOM 中）
  let editor;
  try {
    editor = CodeMirror.fromTextArea(taEl, {
      mode:'htmlmixed', theme:'material-darker',
      lineNumbers:true, lineWrapping:true,
      styleActiveLine:true, matchBrackets:true, autoCloseBrackets:true,
      autoCloseTags:true, matchTags:{bothTags:true},
      foldGutter:true, gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
      extraKeys:{
        'Ctrl-S': ()=>save(),
        'Cmd-S': ()=>save(),
        'Ctrl-Enter': ()=>runPreview(),
        'Cmd-Enter': ()=>runPreview(),
        'Ctrl-Shift-F': ()=>formatCode(),
        'Cmd-Shift-F': ()=>formatCode(),
        'Ctrl-F': ()=>openFind(false),
        'Cmd-F': ()=>openFind(false),
        'Ctrl-H': ()=>openFind(true),
        'Cmd-H': ()=>openFind(true),
        'F3': ()=>findNext(),
        'Esc': ()=>closeFind(),
      }
    });
    editor.setValue(content);
    editor.clearHistory();
    setTimeout(()=>editor.refresh(), 50);
  } catch(e){
    // 降级：使用原生 textarea
    taEl.style.display = '';
    taEl.value = content;
    taEl.className = 'np-area';
    toast('CodeMirror 加载失败，使用原生编辑器','error');
    editor = {
      getValue: ()=>taEl.value,
      setValue: v => { taEl.value = v; },
      setOption: ()=>{},
      getOption: ()=>'htmlmixed',
      getCursor: ()=>({line:0,ch:0}),
      getSelection: ()=>'',
      setCursor: ()=>{},
      undo: ()=>document.execCommand('undo'),
      redo: ()=>document.execCommand('redo'),
      clearHistory: ()=>{},
      refresh: ()=>{},
      toTextArea: ()=>{},
      on: ()=>{},
      operation: fn => fn(),
      foldCode: ()=>{},
      execCommand: ()=>{},
      lineCount: ()=>1,
      posFromIndex: i=>({line:0,ch:i}),
      markText: ()=>({clear:()=>{}}),
      scrollIntoView: ()=>{},
      replaceRange: (t,f,t2)=>{},
    };
  }
  
  // 根据扩展名设置模式
  function setModeFromExt(n){
    const ext = extOf(n);
    const map = {html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',mjs:'javascript',json:'application/json',md:'markdown',markdown:'markdown',xml:'xml',svg:'xml'};
    const m = map[ext] || 'htmlmixed';
    editor.setOption('mode', m);
    modeSel.value = m;
    const labels = {htmlmixed:'HTML',css:'CSS',javascript:'JavaScript',markdown:'Markdown','application/json':'JSON',xml:'XML/SVG'};
    stRight.textContent = (labels[m]||'TEXT')+' · UTF-8';
  }
  setModeFromExt(name);
  
  modeSel.onchange = () => { editor.setOption('mode', modeSel.value); const labels={htmlmixed:'HTML',css:'CSS',javascript:'JavaScript',markdown:'Markdown','application/json':'JSON',xml:'XML/SVG'}; stRight.textContent=(labels[modeSel.value]||'TEXT')+' · UTF-8'; };
  
  function updateStatus(){
    const c = editor.getCursor();
    stLeft.textContent = `行 ${c.line+1}, 列 ${c.ch+1}`;
    const sel = editor.getSelection();
    stSel.textContent = sel.length ? `已选 ${sel.length} 字符` : '';
  }
  editor.on('cursorActivity', updateStatus);
  editor.on('change', () => { updateStatus(); });
  updateStatus();
  
  // 预览
  let previewTimer;
  function runPreview(){
    const mode = editor.getOption('mode');
    let html;
    if (mode === 'htmlmixed' || mode === 'xml'){
      html = editor.getValue();
    } else if (mode === 'markdown'){
      // 简易 markdown 渲染
      let md = editor.getValue();
      md = md.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      md = md.replace(/^### (.*$)/gm,'<h3>$1</h3>').replace(/^## (.*$)/gm,'<h2>$1</h2>').replace(/^# (.*$)/gm,'<h1>$1</h1>');
      md = md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
      md = md.replace(/`([^`]+)`/g,'<code>$1</code>');
      md = md.replace(/^\s*[-*+] (.+)/gm,'<li>$1</li>');
      md = md.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
      md = md.replace(/\n\n+/g,'</p><p>');
      html = '<html><head><meta charset="utf-8"><style>body{font-family:system-ui;padding:20px;max-width:720px;margin:auto;line-height:1.6}code{background:#f0f0f0;padding:2px 6px;border-radius:3px}</style></head><body><p>'+md+'</p></body></html>';
    } else if (mode === 'css'){
      html = '<html><head><style>'+editor.getValue()+'</style></head><body><div class="demo"><h1>CSS 预览</h1><p>这是一个示例段落。</p><button>按钮</button><div class="box">盒子</div></div></body></html>';
    } else if (mode === 'javascript'){
      html = '<html><body><pre id="out"></pre><script>try{const _c=console.log.bind(console);let _o="";console.log=(...a)=>{_o+=a.map(x=>typeof x==="object"?JSON.stringify(x):x).join(" ")+"\\n";document.getElementById("out").textContent=_o};'+editor.getValue()+'}catch(e){document.getElementById("out").textContent="Error: "+e.message}<\/script></body></html>';
    } else {
      html = '<pre>'+editor.getValue().replace(/</g,'&lt;')+'</pre>';
    }
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open(); doc.write(html); doc.close();
    } catch(e){
      const blob = new Blob([html], {type:'text/html'});
      iframe.src = URL.createObjectURL(blob);
    }
  }
  editor.on('change', () => {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 600);
  });
  setTimeout(runPreview, 100);
  
  btnRun.onclick = runPreview;
  btnRefresh.onclick = runPreview;
  
  // 格式化
  function formatCode(){
    const mode = editor.getOption('mode');
    const cur = editor.getCursor();
    let txt = editor.getValue();
    try {
      if (mode === 'htmlmixed' || mode === 'xml'){
        txt = html_beautify(txt, {indent_size:2, indent_inner_html:true, wrap_line_length:120, max_preserve_newlines:3, end_with_newline:true});
      } else if (mode === 'css'){
        txt = css_beautify(txt, {indent_size:2});
      } else if (mode === 'javascript' || mode === 'application/json'){
        txt = js_beautify(txt, {indent_size:2});
      }
      editor.setValue(txt);
      editor.setCursor(cur);
    } catch(e){ toast('格式化失败：'+e.message,'error'); }
  }
  btnFormat.onclick = formatCode;
  btnFoldAll.onclick = () => { editor.operation(()=>{for(let i=0;i<editor.lineCount();i++)editor.foldCode({line:i,ch:0})}); };
  btnUnfoldAll.onclick = () => { editor.operation(()=>{for(let i=0;i<editor.lineCount();i++){const w=editor.getHelper({line:i,ch:0},'fold');}}); editor.execCommand('unfoldAll'); };
  
  // 查找替换
  let findState = {cursor:null,matches:[],current:-1,caseSensitive:false,wholeWord:false,regex:false};
  function openFind(withReplace){
    findbar.classList.add('open');
    findInp.focus();
    if (withReplace) setTimeout(()=>repInp.focus(),50);
    updateFind();
  }
  function closeFind(){
    findbar.classList.remove('open');
    clearMarks();
    editor.focus();
  }
  function clearMarks(){
    for (const m of findState.matches) try{m.clear();}catch(e){}
    findState.matches = [];
  }
  function updateFind(){
    clearMarks();
    findState.current = -1;
    const q = findInp.value;
    if (!q){ findCount.textContent='0/0'; return; }
    let regex;
    try {
      if (findState.regex) regex = new RegExp(q, 'g'+(findState.caseSensitive?'':'i'));
      else {
        const esc = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        const pat = findState.wholeWord ? '\\b'+esc+'\\b' : esc;
        regex = new RegExp(pat, 'g'+(findState.caseSensitive?'':'i'));
      }
    } catch(e){ findCount.textContent='无效正则'; return; }
    const text = editor.getValue();
    const arr = [];
    let m;
    while ((m = regex.exec(text)) !== null){
      const start = editor.posFromIndex(m.index);
      const end = editor.posFromIndex(m.index + m[0].length);
      arr.push({from:start, to:end});
      if (m.index === regex.lastIndex) regex.lastIndex++;
    }
    for (let i=0;i<arr.length;i++){
      const mark = editor.markText(arr[i].from, arr[i].to, {className:'cm-match'});
      findState.matches.push(mark);
    }
    findCount.textContent = `${arr.length?1:0}/${arr.length}`;
    if (arr.length){ findState.current = 0; highlightCurrent(); }
  }
  function highlightCurrent(){
    for (let i=0;i<findState.matches.length;i++){
      try{findState.matches[i].clear();}catch(e){}
    }
    findState.matches = [];
    const q = findInp.value;
    if (!q) return;
    let regex;
    try {
      if (findState.regex) regex = new RegExp(q, 'g'+(findState.caseSensitive?'':'i'));
      else {
        const esc = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        const pat = findState.wholeWord ? '\\b'+esc+'\\b' : esc;
        regex = new RegExp(pat, 'g'+(findState.caseSensitive?'':'i'));
      }
    } catch(e){return;}
    const text = editor.getValue();
    const arr=[];let m;
    while((m=regex.exec(text))!==null){
      arr.push({from:editor.posFromIndex(m.index),to:editor.posFromIndex(m.index+m[0].length)});
      if(m.index===regex.lastIndex)regex.lastIndex++;
    }
    for(let i=0;i<arr.length;i++){
      const cls = i===findState.current?'cm-current-match':'cm-match';
      findState.matches.push(editor.markText(arr[i].from,arr[i].to,{className:cls}));
    }
    findCount.textContent = `${arr.length?(findState.current+1):0}/${arr.length}`;
    if (findState.current>=0 && arr[findState.current]){
      editor.scrollIntoView(arr[findState.current].from, 100);
      editor.setCursor(arr[findState.current].from);
    }
  }
  function findNext(){
    if (!findState.matches.length) return;
    findState.current = (findState.current+1) % findState.matches.length;
    highlightCurrent();
  }
  function findPrev(){
    if (!findState.matches.length) return;
    findState.current = (findState.current-1+findState.matches.length) % findState.matches.length;
    highlightCurrent();
  }
  findInp.addEventListener('input', updateFind);
  findInp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); e.shiftKey ? findPrev() : findNext(); }

  btnWord.onclick = () => { findState.wholeWord = !findState.wholeWord; btnWord.classList.toggle('on',findState.wholeWord); updateFind(); };
  btnReg.onclick = () => { findState.regex = !findState.regex; btnReg.classList.toggle('on',findState.regex); updateFind(); };
  btnRepOne.onclick = () => {
    if (findState.current < 0) return;
    const q = findInp.value; const r = repInp.value;
    let regex;

      if (findState.regex) regex = new RegExp(q);

      const txt = editor.getValue();
      const m = txt.match(regex);
      if (m){
        const idx = txt.search(regex);
        const from = editor.posFromIndex(idx), to = editor.posFromIndex(idx + m[0].length);
        editor.replaceRange(r, from, to);
        updateFind();
      }
    } catch(e){ toast('替换失败','error'); }
  };
  btnRepAll.onclick = () => {
    const q = findInp.value; const r = repInp.value;
    let regex;
    try {
      if (findState.regex) regex = new RegExp(q,'g'+(findState.caseSensitive?'':'i'));
      else { const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); regex=new RegExp(findState.wholeWord?'\\b'+esc+'\\b':esc, 'g'+(findState.caseSensitive?'':'i')); }
      editor.setValue(editor.getValue().replace(regex, r));
      updateFind();
    } catch(e){ toast('替换失败','error'); }
  };
  btnCloseFind.onclick = closeFind;
  
  btnFind.onclick = ()=>openFind(false);
  btnReplace.onclick = ()=>openFind(true);

      document.dispatchEvent(new CustomEvent('vfs-change',{detail:{path:dirname(np)}}));
      if (np.startsWith('/Desktop')) { await Desktop.rebuildFromFS(); Desktop.render(); }
    } catch(e){ toast('保存失败：'+e.message,'error'); }
  }
  btnSave.onclick = save;
  btnNew.onclick = async () => {
    if (editor.getValue() && !await confirm_('新建','当前内容丢失？','继续')) return;
    editor.setValue(''); name='未命名.html'; win.setTitle('HTML 编辑器 · '+name);
  };
  btnOpen.onclick = () => {
    const inp = el('input',{type:'file'});
    inp.onchange = async () => { if (inp.files[0]){ editor.setValue(await inp.files[0].text()); name = inp.files[0].name; setModeFromExt(name); win.setTitle('HTML 编辑器 · '+name); } };
    inp.click();
  };
  btnImport.onclick = () => btnOpen.click();
  btnExport.onclick = () => {
    const map = {htmlmixed:'.html',css:'.css',javascript:'.js',markdown:'.md','application/json':'.json',xml:'.xml'};
    const ext = map[editor.getOption('mode')] || '.txt';
    const fname = name.endsWith(ext) ? name : name.replace(/\.[^.]+$/, '')+ext;
    const blob = new Blob([editor.getValue()],{type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;a.download=fname;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  };
  btnClear.onclick = () => editor.setValue('');
  btnNewWin.onclick = () => {
    const blob = new Blob([editor.getValue()], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  };
  
  // 可拖拽分割
  divider.addEventListener('pointerdown', e => {
    e.preventDefault();
    const sr = split.getBoundingClientRect();
    const move = ev => {
      let x = ev.clientX - sr.left;
      x = Math.max(200, Math.min(sr.width-120, x));
      editPane.style.flex = `0 0 ${x}px`;
    };
    const up = () => { document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up); editor.refresh(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
  
  // 窗口关闭时释放
  win.onClose = () => { try{editor.toTextArea();}catch(e){} };
  
  // 刷新
  win._refresh = () => editor.refresh();
  const ro = new ResizeObserver(()=>editor.refresh());
  ro.observe(editPane);
};

Apps.manga = async function(path){
  const name = basename(path);
  const dir = dirname(path);
  const win = WM.create({title:'漫画阅读器 · '+name, icon:ICO.manga(), width:800, height:700, noMaximize:false});
  win.win.classList.add('manga-win');
  
  const root = el('div',{class:'mv'});
  const toolbar = el('div',{class:'mv-toolbar'});
  const btnFS = el('button',{},'全屏');
  const info = el('div',{class:'info'}, name);
  const btnExitFS = el('button',{class:'mv-fs-exit'},'×');
  toolbar.append(btnFS, info);
  const scroll = el('div',{class:'mv-scroll'});
  const loading = el('div',{class:'mv-loading'},'加载中…');
  scroll.append(loading);
  root.append(toolbar, scroll, btnExitFS);
  win.setBody(root);
  
  // 全屏
  async function enterFS(){
    try { await win.win.requestFullscreen(); } catch(e){}
    win.win.classList.add('fullscreen-manga');
  }
  async function exitFS(){
    try { if (document.fullscreenElement) await document.exitFullscreen(); } catch(e){}
    win.win.classList.remove('fullscreen-manga');
  }
  btnFS.onclick = enterFS;
  btnExitFS.onclick = exitFS;
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement) win.win.classList.remove('fullscreen-manga');
  });
  
  try {
    const items = await VFS.readdir(dir);
    const imgs = items.filter(i => i.type==='file' && isImageExt(extOf(i.name)));
    // 自然排序
    imgs.sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
    
    if (!imgs.length){ scroll.innerHTML = '<div class="mv-loading">此目录没有图片</div>'; return; }
    
    // 并行读取
    const bufs = await Promise.all(imgs.map(async it => {
      try { return {name:it.name, buf: await VFS.readFile(it.path), ok:true}; }
      catch(e){ return {name:it.name, ok:false}; }
    }));
    
    scroll.innerHTML = '';
    let targetImg = null;
    for (const b of bufs){
      if (!b.ok){ scroll.append(el('div',{class:'mv-loading',style:{color:'#f88'}},'加载失败: '+b.name)); continue; }
      const blob = new Blob([b.buf],{type:mimeOf(b.name)});
      const url = URL.createObjectURL(blob);
      const img = el('img',{src:url, alt:b.name, loading:'lazy'});
      img.dataset.name = b.name;
      scroll.append(img);
      if (b.name === name) targetImg = img;
    }
    info.textContent = `${imgs.length} 张 · ${name}`;
    
    if (targetImg){
      setTimeout(()=>{ targetImg.scrollIntoView({behavior:'auto', block:'start'}); }, 100);
    }
  } catch(e){ toast('加载失败：'+e.message,'error'); scroll.innerHTML = '<div class="mv-loading">错误：'+esc(e.message)+'</div>'; }
};

/* ----- ZIP 解压 ----- */
Apps.extract = async function(path){
  const name = basename(path);
  const ext = extOf(name);
  const dir = dirname(path);
  
  toast('正在解压 '+name+'…','info');
  try {
    if (ext === 'zip'){
      const buf = await VFS.readFile(path);
      const zip = await JSZip.loadAsync(buf);
      const targetDir = join(dir, name.replace(/\.zip$/i,''));
      await VFS.mkdir(targetDir);
      const files = Object.values(zip.files).filter(f=>!f.dir);
      for (const f of files){
        const ab = await f.async('arraybuffer');
        await VFS.writeFile(join(targetDir, f.name), ab);
      }
      toast(`解压完成：${files.length} 个文件`,'success');
      document.dispatchEvent(new CustomEvent('vfs-change',{detail:{path:dir}}));
      Apps.explorer(targetDir);
    } else if (ext === 'gz' || ext === 'tgz'){
      // 浏览器原生解压 gz（DecompressionStream）
      const buf = await VFS.readFile(path);
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([buf]).stream().pipeThrough(ds);
      const decompressed = await new Response(stream).arrayBuffer();
      if (ext === 'tgz' || name.endsWith('.tar.gz')){
        // tar 解析
        await extractTar(decompressed, join(dir, name.replace(/\.(tgz|tar\.gz)$/i,'')));
      } else {
        const outName = name.replace(/\.gz$/i,'');
        await VFS.writeFile(join(dir, outName), decompressed);
        toast('解压完成','success');
      }
    } else {
      toast('不支持的格式','error');
    }
  } catch(e){ toast('解压失败：'+e.message,'error'); }
};

async function extractTar(buf, targetDir){
  await VFS.mkdir(targetDir);
  const u8 = new Uint8Array(buf);
  let offset = 0;
  let count = 0;
  while (offset < u8.length - 512){
    const header = u8.subarray(offset, offset+512);
    if (header.every(b=>b===0)) break;
    const nameBytes = header.subarray(0,100);
    let name = new TextDecoder().decode(nameBytes).split('\0')[0];
    const sizeOctal = new TextDecoder().decode(header.subarray(124,136)).split('\0')[0].trim();
    const size = parseInt(sizeOctal, 8) || 0;
    const typeflag = String.fromCharCode(header[156]);
    offset += 512;
    if (name){
      if (typeflag === '5' || name.endsWith('/')){
        await VFS.mkdir(join(targetDir, name));
      } else if (size > 0){
        const data = u8.subarray(offset, offset+size);
        await VFS.writeFile(join(targetDir, name), data);
        count++;
      }
    }
    offset += Math.ceil(size/512)*512;
  }
  toast(`解压完成：${count} 个文件`,'success');
  document.dispatchEvent(new CustomEvent('vfs-change',{detail:{path:dirname(targetDir)}}));
}

Apps.calculator = function(){
  const win = WM.create({title:'计算器', icon:ICO.calculator(), width:280, height:400, noResize:true});
  const root = el('div',{class:'calc'});
  const screen = el('div',{class:'calc-screen'});
  const expr = el('div',{class:'calc-expr'},' ');
  const val = el('div',{class:'calc-val'},'0');
  screen.append(expr, val);
  const grid = el('div',{class:'calc-grid'});
  const keys = ['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
  let current = '0', lastExpr = '';
  function press(k){
    if (k==='C'){ current='0'; lastExpr=''; }
    else if (k==='⌫'){ current = current.length>1?current.slice(0,-1):'0'; }
    else if (k==='±'){ current = current.startsWith('-')?current.slice(1):'-'+current; }
    else if (k==='%'){ current = String(parseFloat(current)/100); }
    else if (k==='='){
      try {
        const e = (lastExpr+' '+current).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
        const r = Function('"use strict";return ('+e+')')();
        lastExpr = '';
        current = String(Math.round(r*1e10)/1e10);
      } catch(err){ current='错误'; }
    }
    else if (['+','−','×','÷'].includes(k)){ lastExpr = current+' '+k; current='0'; }
    else {
      if (current==='0' && k!=='.') current = k;
      else if (k==='.' && current.includes('.')){}
      else current += k;
    }
    val.textContent = current;
    expr.textContent = lastExpr || ' ';
  }
  for (const k of keys){
    const b = el('button',{class:'calc-btn'+(['+','−','×','÷'].includes(k)?' op':'')+(k==='='?' eq':'')+(k==='C'?' clr':''),onclick:()=>press(k)}, k);
    grid.append(b);
  }
  root.append(screen, grid);
  win.setBody(root);
};

Apps.paint = function(){
  const win = WM.create({title:'画板', icon:ICO.paint(), width:640, height:480});
  const root = el('div',{class:'pt'});
  const toolbar = el('div',{class:'pt-toolbar'});
  const btnPen = el('button',{class:'active'},'画笔');
  const btnEraser = el('button',{},'橡皮');
  const btnLine = el('button',{},'直线');
  const btnRect = el('button',{},'矩形');
  const btnCircle = el('button',{},'圆形');
  const color = el('input',{type:'color',value:'#1790ff'});
  const size = el('input',{type:'range',min:'1',max:'30',value:'3'});
  const sizeLbl = el('span',{style:{fontSize:'11px',minWidth:'32px'}},'3px');
  const btnClear = el('button',{},'清空');
  const btnSave = el('button',{},'保存到图片');
  toolbar.append(btnPen, btnEraser, btnLine, btnRect, btnCircle, color, size, sizeLbl, btnClear, btnSave);
  size.oninput = ()=>sizeLbl.textContent=size.value+'px';
  const cvWrap = el('div',{class:'pt-canvas'});
  const cv = el('canvas',{width:800,height:600});
  cvWrap.append(cv);
  root.append(toolbar, cvWrap);
  win.setBody(root);
  
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  let tool = 'pen', drawing = false, sx=0, sy=0, snap = null;
  
  function setTool(t){
    tool = t;
    [btnPen,btnEraser,btnLine,btnRect,btnCircle].forEach(b=>b.classList.remove('active'));
    ({pen:btnPen,eraser:btnEraser,line:btnLine,rect:btnRect,circle:btnCircle}[t]).classList.add('active');
  }
  btnPen.onclick = ()=>setTool('pen');
  btnEraser.onclick = ()=>setTool('eraser');
  btnLine.onclick = ()=>setTool('line');
  btnRect.onclick = ()=>setTool('rect');
  btnCircle.onclick = ()=>setTool('circle');
  btnClear.onclick = ()=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); };
  btnSave.onclick = async () => {
    const name = await prompt_('保存文件名','画板.png','画板_'+Date.now()+'.png');
    if (!name) return;
    cv.toBlob(async b => {
      const buf = await b.arrayBuffer();
      await VFS.writeFile('/Pictures/'+name, buf);
      toast('已保存到图片文件夹','success');
      document.dispatchEvent(new CustomEvent('vfs-change',{detail:{path:'/Pictures'}}));
    });
  };
  
  function pos(e){
    const r = cv.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(cx-r.left)*cv.width/r.width, y:(cy-r.top)*cv.height/r.height };
  }
  function down(e){
    e.preventDefault();
    drawing = true;
    const p = pos(e);
    sx = p.x; sy = p.y;
    if (tool === 'pen' || tool === 'eraser'){
      ctx.beginPath(); ctx.moveTo(p.x,p.y);
      ctx.strokeStyle = tool==='eraser'?'#fff':color.value;
      ctx.lineWidth = parseInt(size.value); ctx.lineCap='round'; ctx.lineJoin='round';
    } else {
      snap = ctx.getImageData(0,0,cv.width,cv.height);
    }
  }
  function move(e){
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    if (tool === 'pen' || tool === 'eraser'){ ctx.lineTo(p.x,p.y); ctx.stroke(); }
    else if (snap){
      ctx.putImageData(snap,0,0);
      ctx.strokeStyle = color.value; ctx.lineWidth = parseInt(size.value);
      if (tool==='line'){ ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(p.x,p.y); ctx.stroke(); }
      else if (tool==='rect'){ ctx.strokeRect(sx,sy,p.x-sx,p.y-sy); }
      else if (tool==='circle'){ ctx.beginPath(); ctx.arc(sx,sy,Math.hypot(p.x-sx,p.y-sy),0,Math.PI*2); ctx.stroke(); }
    }
  }
  function up(){ drawing=false; }
  cv.addEventListener('pointerdown', down);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointerleave', up);
};

    const used = est.usage || 0, quota = est.quota || 0;
    const pct = quota ? (used/quota*100).toFixed(1) : 0;
    body.append(el('div',{}, `已用 ${fmtSize(used)} / ${fmtSize(quota)} (${pct}%)`));
    const bar = el('div',{class:'usage-bar'});
    bar.append(el('div',{class:'usage-bar-fill',style:{width:Math.min(pct,100)+'%'}}));
    bar.append(el('div',{class:'usage-bar-label'}, fmtSize(used)+' / '+fmtSize(quota)));
    body.append(bar);
    body.append(el('h4',{},'详细占用'));
    const duList = el('div',{class:'usage-list'});
    body.append(duList);
    const dirs = ['Desktop','Documents','Pictures','Music','Videos','Downloads','Trash'];
    for (const d of dirs){
      const info = await VFS.du('/'+d);
      duList.append(el('div',{class:'usage-item'}, el('span',{},' /'+d), el('span',{}, fmtSize(info.size))));
    }
    const mnts = LocalFS.list();
    for (const m of mnts){
      duList.append(el('div',{class:'usage-item'}, el('span',{},' 🗀 '+m.name+' (本地挂载)'), el('span',{},'—')));
    }
    body.append(el('h4',{style:{marginTop:'16px'}},'操作'));
    const btnRst = el('button',{class:'btn danger'},'一键重置（清除所有数据）');
    btnRst.onclick = async () => {
      if (!await confirm_('重置警告','这将清除所有虚拟文件系统数据，不可恢复。是否继续？','重置')) return;
      await VFS.resetAll();
      toast('系统已重置，即将刷新','success');
      setTimeout(()=>location.reload(), 1500);
    };
    body.append(btnRst);
  };
  pages['mounts'] = () => {
    body.innerHTML = '';
    body.append(el('h3',{},'本地文件夹挂载'));
    body.append(el('p',{style:{fontSize:'12px',color:'#5a7a9a',marginBottom:'12px',lineHeight:'1.6'}},'将电脑上的真实文件夹挂载到虚拟文件系统 /mnt/local/ 下。挂载后可像虚拟文件一样浏览、编辑。注意：页面刷新后需重新授权。'));
    const btn = el('button',{class:'btn primary'},'挂载新文件夹');
    btn.onclick = () => LocalFS.pickAndMount().then(()=>pages.mounts());
    body.append(btn);
    body.append(el('h4',{style:{marginTop:'16px'}},'已挂载'));
    const list = el('div',{style:{marginTop:'8px'}});
    const mnts = LocalFS.list();
    if (!mnts.length) list.append(el('div',{style:{fontSize:'12px',color:'#888',padding:'10px'}},'暂无挂载'));
    for (const m of mnts){
      const row = el('div',{class:'st-row'});
      row.append(el('label',{}, m.name+' → '+m.path));
      const unbtn = el('button',{class:'btn'},'卸载');
      unbtn.onclick = () => { LocalFS.unmount(m.name); pages.mounts(); };
      row.append(unbtn);
      list.append(row);
    }
    body.append(list);
  };
  pages['about'] = () => {
    body.innerHTML = '';
    body.append(el('h3',{},'关于 AeroOS'));
    body.append(el('div',{class:'about',style:{background:'none',padding:'20px 0',justifyContent:'flex-start'}},
      el('div',{class:'about-logo',html:ICO.about()}),
      el('h2',{},'AeroOS · 玻璃花园'),
      el('p',{},'一个基于浏览器 OPFS 技术的虚拟桌面操作系统。采用 Frutiger Aero 美学设计，致敬 2005–2013 年的玻璃与数字自然主义。'),
      el('p',{style:{fontSize:'11px'}},'版本 1.0 · 单文件交付 · 零后端 · 数据保存在您的浏览器中')
    ));
  };
  
  const navItems = [
    {k:'personalize',l:'个性化'},
    {k:'storage',l:'存储'},
    {k:'mounts',l:'本地挂载'},
    {k:'about',l:'关于'},
  ];
  for (const it of navItems){
    const b = el('button',{}, it.l);
    b.onclick = () => { $$('.st-nav button',nav).forEach(x=>x.classList.remove('active')); b.classList.add('active'); pages[it.k](); };
    nav.append(b);
  }
  nav.firstChild.classList.add('active');
  pages.personalize();
};

/* ----- 虚拟机 (V86) ----- */
Apps.vm = function(){
  const win = WM.create({title:'x86 虚拟机', icon:ICO.vm(), width:720, height:560});
  const root = el('div',{class:'vm'});
  const toolbar = el('div',{class:'vm-toolbar'});
  const lblISO = el('label',{},'加载 ISO/IMG');
  const inpISO = el('input',{type:'file',style:{display:'none'},accept:'.iso,.img,.bin,.fda'});
  lblISO.append(inpISO);
  const btnStart = el('button',{},'启动');
  const btnStop = el('button',{},'停止');
  const btnRestart = el('button',{},'重启');
  toolbar.append(lblISO, btnStart, btnStop, btnRestart);
  const screen = el('div',{class:'vm-screen'});
  const msg = el('div',{class:'vm-msg',html:`<strong>x86 虚拟机</strong><br><br>请先选择一个 ISO 或 IMG 镜像文件（从虚拟文件系统或本地选择），然后点击启动。<br><br><small>基于 copy/v86 项目。需要加载约 5MB 的 WASM 运行时。</small>`});
  screen.append(msg);
  root.append(toolbar, screen);
  win.setBody(root);
  
  let emulator = null;
  let selectedFile = null;
  
  inpISO.onchange = async () => {
    if (inpISO.files[0]){
      selectedFile = inpISO.files[0];
      lblISO.innerHTML = '已选: '+selectedFile.name;
      lblISO.append(inpISO);
    }
  };
  
  btnStart.onclick = async () => {
    if (!selectedFile){ toast('请先选择镜像文件','error'); return; }
    if (emulator){ toast('已在运行','info'); return; }
    screen.innerHTML = '';
    const screenContainer = el('div',{class:'screen',style:{whiteSpace:'pre',fontFamily:'monospace'}});
    const canvas = el('canvas');
    const wrap = el('div');
    wrap.append(screenContainer, canvas);
    screen.append(wrap);
    
    const statusEl = el('div',{style:{position:'absolute',top:'10px',left:'10px',color:'#bde4ff',fontSize:'12px',background:'rgba(0,0,0,0.5)',padding:'4px 10px',borderRadius:'4px'}},'加载中…');
    screen.append(statusEl);
    
    try {
      if (!window.V86){
        await new Promise((res,rej)=>{
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js';
          s.onload = res; s.onerror = rej;
          document.head.append(s);
        });
      }
      const ext = extOf(selectedFile.name);
      const opts = {
        wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',
        memory_size: 128*1024*1024,
        vga_memory_size: 16*1024*1024,
        screen_container: wrap,
        bios: {url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin'},
        vga_bios: {url:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'},
        autostart: true,
      };
      if (ext === 'iso') opts.cdrom = {buffer: await selectedFile.arrayBuffer()};
      else if (ext === 'fda' || ext === 'img' || ext === 'bin') opts.fda = {buffer: await selectedFile.arrayBuffer()};
      else opts.hda = {buffer: await selectedFile.arrayBuffer()};
      
      emulator = new V86(opts);
      statusEl.textContent = '运行中';
      setTimeout(()=>statusEl.remove(), 3000);
    } catch(e){
      screen.innerHTML = `<div class="vm-msg" style="color:#f88">启动失败：${esc(e.message)}<br><br>请确保网络连接正常且镜像文件有效。</div>`;
    }
  };
  btnStop.onclick = () => { if (emulator){ try{emulator.stop();}catch(e){} emulator=null; } };
  btnRestart.onclick = () => { if (emulator){ try{emulator.restart();}catch(e){} } };
  win.onClose = () => { if (emulator){ try{emulator.stop();}catch(e){} emulator=null; } };
};

/* =========================================================
 * 开始菜单
 * ========================================================= */
function renderStartMenu(){
  const m = $('#start-menu');
  m.innerHTML = '';
  const head = el('div',{class:'start-header'},
    el('div',{class:'avatar',html:ICO.about()}),
    el('div',{class:'info'},
      el('div',{class:'uname'},'Aero 用户'),
      el('div',{class:'role'},'AeroOS · 玻璃花园')
    )
  );
  const apps = el('div',{class:'start-apps'});
  const list = [
    {k:'explorer',n:'资源管理器',i:ICO.explorer(),a:()=>Apps.explorer('/Desktop')},
    {k:'notepad',n:'记事本',i:ICO.notepad(),a:()=>Apps.notepad()},
    {k:'editor',n:'HTML 编辑器',i:ICO.editor(),a:()=>Apps.editor()},
    {k:'browser',n:'网页浏览器',i:ICO.browser(),a:()=>Apps.browser()},
    {k:'calculator',n:'计算器',i:ICO.calculator(),a:()=>Apps.calculator()},
    {k:'paint',n:'画板',i:ICO.paint(),a:()=>Apps.paint()},
    {k:'manga',n:'漫画阅读器',i:ICO.manga(),a:()=>toast('请从图片文件打开','info')},
    {k:'vm',n:'虚拟机',i:ICO.vm(),a:()=>Apps.vm()},
    {k:'settings',n:'设置',i:ICO.settings(),a:()=>Apps.settings()},
    {k:'about',n:'关于',i:ICO.about(),a:()=>Apps.about()},
  ];
  for (const it of list){
    const a = el('div',{class:'start-app',onclick:()=>{closeStart();it.a();}},
      el('span',{html:it.i}),
      el('div',{class:'n'}, it.n)
    );
    apps.append(a);
  }
  const foot = el('div',{class:'start-footer'},
    el('button',{onclick:()=>{ closeStart(); Apps.settings(); }},'设置'),
    el('button',{onclick:()=>{ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); closeStart(); }},'全屏')
  );
  m.append(head, apps, foot);
}
function toggleStart(){ $('#start-menu').classList.toggle('open'); renderStartMenu(); }
function closeStart(){ $('#start-menu').classList.remove('open'); }
$('#start-btn').addEventListener('click', e => { e.stopPropagation(); toggleStart(); });
document.addEventListener('click', e => {
  if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) closeStart();
});

/* =========================================================
 * 时钟
 * ========================================================= */
function tickClock(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  $('#clock-time').textContent = p(d.getHours())+':'+p(d.getMinutes());
  $('#clock-date').textContent = `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`;
}
setInterval(tickClock, 1000); tickClock();

/* =========================================================
 * 全局键盘快捷键
 * ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    closeContextMenu(); closeStart();
  }
});

/* =========================================================
 * 启动
 * ========================================================= */
(async function boot(){
  const ok = await VFS.init();
  if (!ok){
    document.body.innerHTML = '<div style="padding:40px;color:#a00;font-family:system-ui">您的浏览器不支持 OPFS，请使用最新版 Chrome / Edge / Firefox。</div>';
    return;
  }
  
  // 预装示例文件
  if (!await VFS.exists('/Documents/欢迎.txt')){
    await VFS.writeFile('/Documents/欢迎.txt', '欢迎使用 AeroOS · 玻璃花园\n\n这是一个基于 OPFS 的单文件 Web OS。\n所有数据都保存在您的浏览器中。\n\n试试：\n- 在桌面右键新建文件夹\n- 拖拽本地文件到桌面导入\n- 从桌面拖拽文件到外部导出\n- 挂载本地文件夹到 /mnt/local/\n- 用代码编辑器编写 HTML\n- 打开漫画阅读器连续浏览\n\n玩得开心！');
  }
  if (!await VFS.exists('/Documents/示例.csv')){
    await VFS.writeFile('/Documents/示例.csv', '姓名,年龄,城市\n张三,28,北京\n李四,32,上海\n王五,25,广州');
  }
  if (!await VFS.exists('/Documents/demo.html')){
    await VFS.writeFile('/Documents/demo.html', '<!DOCTYPE html>\n<html>\n<head><meta charset="utf-8"><title>示例</title><style>body{font-family:sans-serif;background:linear-gradient(135deg,#7fd0ff,#7ed957);color:#fff;padding:40px;text-align:center}h1{font-size:42px}button{padding:10px 20px;font-size:16px;border:none;border-radius:8px;background:#fff;color:#1790ff;cursor:pointer}</style></head>\n<body><h1>Hello, AeroOS!</h1><p>这是一个示例 HTML 文件。</p><button onclick="alert(\'你好！\')">点我</button></body>\n</html>');
  }
  
  await Desktop.loadIcons();
  
  // 添加默认快捷方式（如果不存在）
  Desktop.addShortcut({key:'explorer', name:'资源管理器', iconKey:'explorer', action:()=>Apps.explorer('/Desktop')});
  Desktop.addShortcut({key:'settings', name:'设置', iconKey:'settings', action:()=>Apps.settings()});
  Desktop.addShortcut({key:'browser', name:'网页浏览器', iconKey:'browser', action:()=>Apps.browser()});
  Desktop.addShortcut({key:'trash', name:'回收站', iconKey:'trash', action:()=>Apps.explorer('/Trash'), removable:false});
  
  Desktop.render();
  Desktop.setupDesktopDrop();
  Desktop.setupRubber();
  
  await loadWallpaper();
  
  // 全局：防止右键菜单在非自定义区域出现
  document.addEventListener('contextmenu', e => {
    if (!e.target.closest('#desktop') && !e.target.closest('#taskbar') && !e.target.closest('.window')){
      e.preventDefault();
    }
  });
  
  // 响应式：移动端隐藏某些元素
  function onResize(){
    const mobile = window.innerWidth < 720;
    document.body.classList.toggle('mobile', mobile);
  }
  window.addEventListener('resize', onResize); onResize();
})();
</script>
