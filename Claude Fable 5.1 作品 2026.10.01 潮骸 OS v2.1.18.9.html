<style>
/* ================= 潮骸 TIDEBONE · 设计变量 ================= */
:root{
  --font-cn:'LXGW WenKai','Fraunces',serif;
  --font-disp:'Fraunces','LXGW WenKai',serif;
  --font-mono:'Azeret Mono','LXGW WenKai',monospace;
  --tb:46px;
  --accent:#c9713a; --accent-2:#7ee8c2; --danger:#b8473a;
  --cell-w:96px; --cell-h:106px;
  --r:2px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme=dark]{
  --bg:#07100f; --bg-2:#0d1b1a; --panel:rgba(10,22,21,.86); --panel-solid:#0f1f1e;
  --line:rgba(233,226,208,.14); --line-2:rgba(233,226,208,.28);
  --fg:#e9e2d0; --fg-2:#a9a596; --fg-3:#6f7368;
  --hover:rgba(233,226,208,.06); --sel:rgba(201,113,58,.22); --sel-line:rgba(201,113,58,.7);
  --shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(233,226,208,.06);
  --glow:0 0 0 1px rgba(201,113,58,.55),0 24px 70px rgba(0,0,0,.65);
  --input:rgba(0,0,0,.35);
}
html[data-theme=light]{
  --bg:#efe9dc; --bg-2:#e4dccb; --panel:rgba(244,239,228,.9); --panel-solid:#f3eee2;
  --line:rgba(20,35,34,.16); --line-2:rgba(20,35,34,.32);
  --fg:#142322; --fg-2:#3f4d4b; --fg-3:#7b8683;
  --hover:rgba(20,35,34,.06); --sel:rgba(201,113,58,.2); --sel-line:rgba(201,113,58,.8);
  --shadow:0 20px 60px rgba(30,20,10,.25),0 0 0 1px rgba(20,35,34,.08);
  --glow:0 0 0 1px rgba(201,113,58,.6),0 24px 70px rgba(30,20,10,.3);
  --input:rgba(255,255,255,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-cn);font-size:13.5px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{display:inline-block;vertical-align:middle}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:padding-box;border:2px solid transparent}
::selection{background:var(--accent);color:#fff}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-disp)}

/* ================= 桌面 ================= */
#desktop{position:fixed;inset:0 0 var(--tb) 0;overflow:hidden;user-select:none}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s var(--ease)}
#wall::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
   radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));
  mix-blend-mode:multiply}
#icons{position:absolute;inset:0;padding:12px}
.dicon{position:absolute;width:var(--cell-w);height:var(--cell-h);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 4px 4px;gap:4px;
  border:1px solid transparent;cursor:default;touch-action:none;
  transition:left .32s var(--ease),top .32s var(--ease),background .15s,border-color .15s,transform .2s var(--ease),opacity .3s;
  animation:iconIn .5s var(--ease) both}
@keyframes iconIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.dicon.moving{transition:none;z-index:5;opacity:.85}
.dicon:hover{background:rgba(233,226,208,.08);border-color:rgba(233,226,208,.15)}
.dicon.sel{background:var(--sel);border-color:var(--sel-line)}
.dicon.drop-target{outline:1px dashed var(--accent-2);background:rgba(126,232,194,.15)}
.dicon .ig{width:52px;height:52px;display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));color:#e9e2d0}
.dicon .ig img{width:52px;height:52px;object-fit:cover;border:1px solid rgba(233,226,208,.4)}
.dicon .lb{font-size:12px;line-height:1.25;text-align:center;color:#f2ecda;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);
  max-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;padding:0 2px}
.dicon .lb.editing{-webkit-line-clamp:unset;max-height:none}
.dicon .lb input{width:100%;background:var(--panel-solid);border:1px solid var(--accent);padding:1px 3px;font-size:12px;text-align:center;outline:none;color:var(--fg)}
#rb,.rubber{position:absolute;pointer-events:none;border:1px solid var(--accent);background:rgba(201,113,58,.15);display:none;z-index:50}

/* ================= 窗口 ================= */
#wins{position:fixed;inset:0 0 var(--tb) 0;pointer-events:none}
.win{position:absolute;min-width:280px;min-height:160px;pointer-events:auto;display:flex;flex-direction:column;
  background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line-2);box-shadow:var(--shadow);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:opacity .22s var(--ease),transform .22s var(--ease),box-shadow .2s;
  animation:winIn .28s var(--ease)}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.win.focus{box-shadow:var(--glow)}
.win.max{clip-path:none!important;border-width:0!important}
.win.mini{opacity:0;transform:scale(.7) translateY(60vh);pointer-events:none}
.win.peekdim{opacity:.12!important;pointer-events:none}
.win.dragging,.win.resizing{transition:none;user-select:none}
.win.dragging iframe,.win.resizing iframe{pointer-events:none}
.win-title{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;
  border-bottom:1px solid var(--line);cursor:move;touch-action:none;
  background:
    repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px) left bottom/100% 6px no-repeat,
    linear-gradient(90deg,rgba(201,113,58,.16),transparent 40%)}
.win.focus .win-title{background:
    repeating-linear-gradient(90deg,transparent 0 23px,var(--line-2) 23px 24px) left bottom/100% 6px no-repeat,
    linear-gradient(90deg,rgba(201,113,58,.3),transparent 45%)}
.win-title .wi{width:18px;height:18px;color:var(--accent);flex:none}
.win-title .wt{flex:1;font-family:var(--font-disp);font-size:13.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-title .wc{display:flex;gap:3px}
.win-title .wc button{width:34px;height:28px;display:grid;place-items:center;color:var(--fg-2);border:1px solid transparent}
.win-title .wc button:hover{background:var(--hover);color:var(--fg);border-color:var(--line)}
.win-title .wc button.x:hover{background:var(--danger);color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rs{position:absolute;z-index:3;touch-action:none}
.rs.n{top:0;left:12px;right:12px;height:6px;cursor:n-resize}.rs.s{bottom:0;left:12px;right:12px;height:6px;cursor:s-resize}
.rs.e{right:0;top:12px;bottom:12px;width:6px;cursor:e-resize}.rs.w{left:0;top:12px;bottom:12px;width:6px;cursor:w-resize}
.rs.ne{right:0;top:0;width:14px;height:14px;cursor:ne-resize}.rs.nw{left:0;top:0;width:14px;height:14px;cursor:nw-resize}
.rs.se{right:0;bottom:0;width:14px;height:14px;cursor:se-resize}.rs.sw{left:0;bottom:0;width:14px;height:14px;cursor:sw-resize}
#snap-preview{position:fixed;display:none;border:1px solid var(--accent-2);background:rgba(126,232,194,.12);backdrop-filter:blur(2px);z-index:9998;pointer-events:none;transition:all .15s var(--ease)}

/* ================= 任务栏 ================= */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);display:flex;align-items:stretch;z-index:10000;
  background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line-2)}
#startBtn{display:flex;align-items:center;gap:8px;padding:0 16px;font-family:var(--font-disp);letter-spacing:.12em;font-size:13px;border-right:1px solid var(--line);color:var(--fg)}
#startBtn svg{color:var(--accent)}
#startBtn:hover,#startBtn.on{background:var(--hover)}
#tasks{flex:1;display:flex;gap:2px;padding:4px 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:8px;padding:0 12px;max-width:190px;min-width:44px;position:relative;border:1px solid transparent;color:var(--fg-2);flex:none}
.task svg{flex:none;color:var(--accent)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.task::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;background:var(--fg-3);opacity:.5}
.task.active{background:var(--hover);border-color:var(--line);color:var(--fg)}
.task.active::after{background:var(--accent);opacity:1}
.task.mini{opacity:.6}
.task:hover{background:var(--hover);color:var(--fg)}
.task .tx{display:none;width:18px;height:18px;place-items:center;margin-right:-6px;color:var(--fg-3)}
.task:hover .tx{display:grid}.task .tx:hover{color:var(--danger)}
#tray{display:flex;align-items:center;gap:2px;padding:0 4px;border-left:1px solid var(--line)}
#tray button{height:100%;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--fg-2)}
#tray button:hover{background:var(--hover);color:var(--fg)}
#clock{font-family:var(--font-mono);font-size:12.5px;line-height:1.15;text-align:center;flex-direction:column;justify-content:center}
#clock small{font-size:10px;color:var(--fg-3);letter-spacing:.06em}
#showDesk{width:10px;border-left:1px solid var(--line-2);cursor:pointer}
#showDesk:hover{background:var(--accent)}
#peek{position:fixed;display:none;bottom:calc(var(--tb) + 8px);background:var(--panel-solid);border:1px solid var(--line-2);padding:8px;z-index:10001;box-shadow:var(--shadow);width:220px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#peek .pt{font-size:12px;color:var(--fg-2);margin-bottom:6px;display:flex;gap:6px;align-items:center}
#peek .pv{height:110px;border:1px solid var(--line);overflow:hidden;position:relative;background:var(--bg)}
#peek .pv > *{transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none}

/* ================= 开始菜单 / 弹层 ================= */
.pop{position:fixed;z-index:10002;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line-2);box-shadow:var(--shadow);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transform-origin:bottom left;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#startMenu{left:8px;bottom:calc(var(--tb) + 8px);width:min(440px,calc(100vw - 16px));display:none;flex-direction:column;max-height:calc(100vh - var(--tb) - 24px)}
#startMenu .sm-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
#startMenu .sm-head h1{margin:0;font-family:var(--font-disp);font-weight:400;font-size:20px;letter-spacing:.08em}
#startMenu .sm-head small{display:block;color:var(--fg-3);font-family:var(--font-mono);font-size:10px;letter-spacing:.2em}
#startMenu .sm-search{margin:10px 14px 0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);padding:6px 10px;background:var(--input)}
#startMenu .sm-search input{flex:1;background:none;border:0;outline:none}
#startMenu .sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 14px;overflow:auto}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border:1px solid transparent;color:var(--fg-2);font-size:12px;animation:iconIn .4s var(--ease) both}
.sm-app svg{width:30px;height:30px;color:var(--accent)}
.sm-app:hover{background:var(--hover);border-color:var(--line);color:var(--fg)}
#startMenu .sm-foot{border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 8px}
#startMenu .sm-foot button{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;color:var(--fg-2)}
#startMenu .sm-foot button:hover{background:var(--hover);color:var(--fg)}
#calendar{right:8px;bottom:calc(var(--tb) + 8px);width:300px;padding:14px;display:none;transform-origin:bottom right}
#calendar .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:var(--font-disp);font-size:15px}
#calendar .ch button{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line)}
#calendar .ch button:hover{background:var(--hover)}
#calendar .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-family:var(--font-mono);font-size:12px}
#calendar .cg .wd{color:var(--fg-3);font-size:10px;padding:4px 0}
#calendar .cg .d{padding:7px 0;border:1px solid transparent}
#calendar .cg .d.o{color:var(--fg-3);opacity:.5}
#calendar .cg .d.t{border-color:var(--accent);color:var(--accent)}
#calendar .cg .d:hover{background:var(--hover)}
#calendar .big{font-family:var(--font-mono);font-size:26px;text-align:center;margin-bottom:6px;letter-spacing:.05em}

/* ================= 右键菜单 ================= */
.ctx{position:fixed;z-index:10005;min-width:200px;padding:5px;background:var(--panel-solid);border:1px solid var(--line-2);box-shadow:var(--shadow);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);animation:popIn .14s var(--ease)}
.ctx .ci{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;color:var(--fg);position:relative;white-space:nowrap}
.ctx .ci svg{width:16px;height:16px;color:var(--fg-2);flex:none}
.ctx .ci:hover{background:var(--sel)}
.ctx .ci.dis{opacity:.4;pointer-events:none}
.ctx .ci .arr{margin-left:auto;color:var(--fg-3)}
.ctx .sep{height:1px;background:var(--line);margin:4px 6px}
.ctx .sub{display:none;position:absolute;left:100%;top:-6px}
.ctx .ci:hover > .sub,.ctx .ci.open > .sub{display:block}

/* ================= 对话框 / 通知 ================= */
#dlgLayer{position:fixed;inset:0;z-index:10010;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.dlg{width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--panel-solid);border:1px solid var(--line-2);box-shadow:var(--shadow);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);animation:winIn .22s var(--ease)}
.dlg.wide{width:min(720px,calc(100vw - 32px))}
.dlg h3{margin:0;padding:14px 18px;font-family:var(--font-disp);font-weight:400;font-size:16px;border-bottom:1px solid var(--line);letter-spacing:.05em}
.dlg .dbody{padding:16px 18px;overflow:auto;color:var(--fg-2)}
.dlg .dfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line-2);color:var(--fg);font-size:13px;background:var(--hover);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.dan{border-color:var(--danger);color:var(--danger)}.btn.dan:hover{background:var(--danger);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.inp{width:100%;padding:8px 10px;background:var(--input);border:1px solid var(--line-2);outline:none;color:var(--fg)}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:auto}
#toasts{position:fixed;right:14px;bottom:calc(var(--tb) + 14px);z-index:10006;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel-solid);border:1px solid var(--line-2);border-left:3px solid var(--accent);padding:10px 14px;min-width:240px;max-width:360px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;font-size:13px;animation:toastIn .3s var(--ease)}
.toast.err{border-left-color:var(--danger)}
.toast .btn{margin-left:auto}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ================= 通用 App 布局 ================= */
.tbar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none;background:rgba(0,0,0,.08)}
.tbar .tb-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;font-size:12px;color:var(--fg-2);border:1px solid transparent;white-space:nowrap}
.tbar .tb-btn:hover{background:var(--hover);color:var(--fg);border-color:var(--line)}
.tbar .tb-btn.on{color:var(--accent);border-color:var(--accent)}
.tbar .tb-btn svg{width:15px;height:15px}
.tbar .sp{width:1px;height:20px;background:var(--line);margin:0 4px}
.tbar select,.tbar input[type=text],.tbar input[type=search]{background:var(--input);border:1px solid var(--line);padding:4px 6px;font-size:12px;outline:none;color:var(--fg)}
.sbar{display:flex;gap:14px;padding:3px 10px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:11px;color:var(--fg-3);flex:none;flex-wrap:wrap;background:rgba(0,0,0,.1)}
.fill{flex:1;min-height:0;min-width:0}
.center{display:grid;place-items:center;height:100%;color:var(--fg-3);text-align:center;padding:20px}

/* ================= 文件管理器 ================= */
.ex{display:flex;flex:1;min-height:0}
.ex-side{width:190px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px 0;background:rgba(0,0,0,.08)}
.ex-side h4{margin:8px 14px 4px;font-size:10px;letter-spacing:.2em;color:var(--fg-3);font-family:var(--font-mono);font-weight:400}
.ex-side .si{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12.5px;color:var(--fg-2);cursor:default;border-left:2px solid transparent}
.ex-side .si svg{width:15px;height:15px;color:var(--accent)}
.ex-side .si:hover{background:var(--hover);color:var(--fg)}
.ex-side .si.on{border-left-color:var(--accent);background:var(--hover);color:var(--fg)}
.ex-side .si.drop-target{background:var(--sel)}
.ex-main{flex:1;display:flex;flex-direction:column;min-width:0}
.crumb{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12.5px;overflow-x:auto;white-space:nowrap;min-height:32px;flex:none}
.crumb button{padding:3px 6px;color:var(--fg-2)}
.crumb button:hover{background:var(--hover);color:var(--fg)}
.crumb .cs{color:var(--fg-3)}
.crumb input{flex:1;background:var(--input);border:1px solid var(--accent);padding:3px 8px;outline:none}
.ex-body{flex:1;position:relative;overflow:auto;min-height:0;user-select:none}
.ex-body.drop-target{outline:2px dashed var(--accent-2);outline-offset:-4px}
/* 详细信息视图 */
.dv{position:relative;min-width:max-content;min-height:100%}
.dv-head{display:flex;position:sticky;top:0;z-index:2;background:var(--panel-solid);border-bottom:1px solid var(--line);width:100%}
.dv-head .col{position:relative;display:flex;align-items:center;gap:4px;padding:5px 8px;font-size:11.5px;color:var(--fg-2);flex:none;white-space:nowrap;overflow:hidden;border-right:1px solid var(--line);cursor:default}
.dv-head .col:hover{background:var(--hover)}
.dv-head .col .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none;z-index:1}
.md-view h1{font-size:1.8em}.md-view h2{font-size:1.45em}.md-view h3{font-size:1.2em}.md-view ul{list-style:disc;padding-left:1.5em}.md-view ol{list-style:decimal;padding-left:1.5em}.md-view p{margin:.5em 0}
.dv-head .col .rz:hover{background:var(--accent)}
.dv-head .col.dragover{border-left:2px solid var(--accent)}
.dv-row{display:flex;height:30px;align-items:center;border:1px solid transparent;width:max-content}
.dv-row:hover{background:var(--hover)}
.dv-row.sel{background:var(--sel);border-color:var(--sel-line)}
.dv-row.drop-target{outline:1px dashed var(--accent-2)}
.dv-row .cell{flex:none;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;display:flex;align-items:center;gap:7px;height:100%}
.dv-row .cell svg{width:16px;height:16px;flex:none;color:var(--accent)}
.dv-row .cell img.th{width:20px;height:20px;object-fit:cover;flex:none;border:1px solid var(--line)}
.dv-row .cell.dim{color:var(--fg-3);font-family:var(--font-mono);font-size:11.5px}
/* 图标视图 */
.iv{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:10px;min-height:100%;position:relative}
.iv-item{width:100px;height:112px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid transparent;font-size:12px;text-align:center}
.iv-item .ig{width:56px;height:56px;display:grid;place-items:center;color:var(--accent)}
.iv-item .ig svg{width:44px;height:44px}
.iv-item .ig img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line-2)}
.iv-item .lb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;line-height:1.25}
.iv-item:hover{background:var(--hover);border-color:var(--line)}
.iv-item.sel{background:var(--sel);border-color:var(--sel-line)}
.iv-item.drop-target{outline:1px dashed var(--accent-2)}
/* 分栏视图 */
.cv{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.cv-col{width:220px;flex:none;border-right:1px solid var(--line);overflow:auto;height:100%}
.cv-col .ci2{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.cv-col .ci2 svg{width:15px;height:15px;color:var(--accent);flex:none}
.cv-col .ci2:hover{background:var(--hover)}
.cv-col .ci2.sel{background:var(--sel);border-color:var(--sel-line)}
.cv-col .ci2 .arr{margin-left:auto;color:var(--fg-3)}
.cv-prev{width:260px;flex:none;padding:16px;font-size:12px;color:var(--fg-2);overflow:auto}
.cv-prev img{max-width:100%;border:1px solid var(--line-2);display:block;margin-bottom:10px}
.cv-prev dt{color:var(--fg-3);font-size:10px;letter-spacing:.1em;margin-top:8px}
.cv-prev dd{margin:0;word-break:break-all}
.ex-mob-side{display:none}

/* ================= 记事本 / 表格 ================= */
.np-ta{flex:1;width:100%;resize:none;background:transparent;border:0;outline:none;padding:12px 16px;font-family:var(--font-mono);line-height:1.6;tab-size:4;color:var(--fg)}
.tbl-wrap{flex:1;overflow:auto}
.tbl-wrap table{border-collapse:collapse;font-family:var(--font-mono);font-size:12px;min-width:100%}
.tbl-wrap th,.tbl-wrap td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;min-width:60px;text-align:left}
.tbl-wrap th{background:var(--panel-solid);position:sticky;top:0;color:var(--accent)}
.tbl-wrap td[contenteditable]:focus{outline:1px solid var(--accent);background:var(--sel)}
.tbl-wrap td:first-child,.tbl-wrap th:first-child{color:var(--fg-3);background:var(--panel-solid);position:sticky;left:0}

/* ================= 图片 / 漫画 / 媒体 ================= */
.iv-stage{flex:1;overflow:hidden;position:relative;display:grid;place-items:center;background:
  repeating-conic-gradient(rgba(128,128,128,.08) 0 25%,transparent 0 50%) 0 0/20px 20px;cursor:grab;touch-action:none}
.iv-stage img{max-width:none;transform-origin:center;transition:transform .08s linear;user-select:none;-webkit-user-drag:none}
.manga{flex:1;background:#000;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;position:relative;cursor:grab}
.manga.grab{cursor:grabbing}
.manga .mi{display:block;margin:0 auto;max-width:100%;width:min(100%,900px);position:relative;background:#0a0a0a}
.manga .mi img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
.manga .mi .ph{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-family:var(--font-mono);font-size:11px}
.manga-fs .win-title{display:none!important}
.manga-fs .tbar,.manga-fs .sbar{display:none!important}
.manga-x{position:absolute;top:10px;right:14px;z-index:5;width:34px;height:34px;display:none;place-items:center;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.3);opacity:.35}
.manga-x:hover{opacity:1}
.manga-fs .manga-x{display:grid}
.media{flex:1;display:flex;flex-direction:column;background:#000;min-height:0}
.media video{flex:1;min-height:0;width:100%;object-fit:contain}
.media .aud-viz{flex:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,rgba(201,113,58,.25),#000 70%)}
.media .ctl{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(15,31,30,.9);border-top:1px solid var(--line)}
.media .ctl button{width:32px;height:32px;display:grid;place-items:center;color:var(--fg)}
.media .ctl button:hover{color:var(--accent)}
.media .ctl input[type=range]{accent-color:var(--accent)}
.media .ctl .tm{font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
.media .ctl .seek{flex:1}

/* ================= 编辑器 ================= */
.ed{flex:1;display:flex;min-height:0}
.ed-left{display:flex;flex-direction:column;min-width:200px;width:55%;min-height:0}
.ed-left .CodeMirror{flex:1;height:auto;min-height:0;font-family:var(--font-mono);font-size:13px}
.ed-left textarea.fallback{flex:1;background:#212121;color:#eee;border:0;padding:10px;font-family:var(--font-mono);resize:none;outline:none}
.ed-split{width:6px;flex:none;cursor:col-resize;background:var(--line);touch-action:none}
.ed-split:hover{background:var(--accent)}
.ed-right{flex:1;min-width:120px;display:flex;flex-direction:column;background:#fff}
.ed-right iframe{flex:1;border:0;width:100%;background:#fff}
.ed-find{display:none;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(0,0,0,.15);font-size:12px}
.ed-find.on{display:flex}
.ed-find input{background:var(--input);border:1px solid var(--line);padding:4px 6px;outline:none;width:160px;font-size:12px}
.ed-find .tg{padding:3px 6px;border:1px solid var(--line);font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
.ed-find .tg.on{border-color:var(--accent);color:var(--accent)}
.ed-find .cnt{font-family:var(--font-mono);color:var(--fg-3);min-width:50px}
.ed-find .cnt.bad{color:var(--danger)}
.cm-find-m{background:rgba(126,232,194,.25);outline:1px solid rgba(126,232,194,.5)}
.cm-find-cur{background:rgba(201,113,58,.55)!important;outline:1px solid var(--accent)}
.cm-trailingspace{background:rgba(184,71,58,.35)}

/* ================= 计算器 / 画板 / 设置 / 浏览器 ================= */
.calc{flex:1;display:flex;flex-direction:column;padding:10px;gap:8px}
.calc .scr{font-family:var(--font-mono);text-align:right;padding:10px 12px;background:var(--input);border:1px solid var(--line);min-height:70px;display:flex;flex-direction:column;justify-content:flex-end}
.calc .scr .ex{font-size:12px;color:var(--fg-3);min-height:1.4em;display:block}
.calc .scr .rs2{font-size:28px;word-break:break-all}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{border:1px solid var(--line);font-family:var(--font-mono);font-size:17px;min-height:40px}
.calc .keys button:hover{background:var(--hover);border-color:var(--line-2)}
.calc .keys button.op{color:var(--accent)}
.calc .keys button.eq{background:var(--accent);color:#fff;border-color:var(--accent)}
.paint-stage{flex:1;overflow:auto;background:repeating-conic-gradient(rgba(128,128,128,.08) 0 25%,transparent 0 50%) 0 0/20px 20px;display:grid;place-items:center}
.paint-stage canvas{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:none;cursor:crosshair;max-width:none}
.set{flex:1;display:flex;min-height:0}
.set-nav{width:150px;flex:none;border-right:1px solid var(--line);padding:8px 0;overflow:auto}
.set-nav button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 14px;font-size:13px;color:var(--fg-2);border-left:2px solid transparent;text-align:left}
.set-nav button svg{width:15px;height:15px}
.set-nav button.on{color:var(--fg);border-left-color:var(--accent);background:var(--hover)}
.set-page{flex:1;overflow:auto;padding:18px 22px}
.set-page h2{font-family:var(--font-disp);font-weight:400;font-size:20px;margin:0 0 14px;letter-spacing:.05em}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.set-row .lab small{display:block;color:var(--fg-3);font-size:11px}
.set-row select,.set-row input[type=number]{background:var(--input);border:1px solid var(--line-2);padding:5px 8px;outline:none;min-width:120px;color:var(--fg)}
.sw{width:42px;height:22px;border:1px solid var(--line-2);position:relative;flex:none;background:var(--input);transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--fg-3);transition:.2s var(--ease)}
.sw.on{border-color:var(--accent);background:rgba(201,113,58,.2)}.sw.on::after{left:23px;background:var(--accent)}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.wall-grid .wp{aspect-ratio:16/10;background-size:cover;background-position:center;border:2px solid var(--line);cursor:pointer;position:relative}
.wall-grid .wp.on{border-color:var(--accent)}
.wall-grid .wp span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:2px 6px;background:rgba(0,0,0,.55);color:#fff}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border:2px solid transparent}
.swatches button.on{border-color:var(--fg)}
.stor-bar{height:22px;display:flex;border:1px solid var(--line-2);overflow:hidden;margin:10px 0;background:var(--input)}
.stor-bar div{height:100%;transition:width .6s var(--ease)}
.stor-list{font-size:12px;font-family:var(--font-mono)}
.stor-list div{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.stor-list i{width:10px;height:10px;flex:none}
.stor-list b{margin-left:auto;font-weight:400;color:var(--fg-2)}
.br-bar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line)}
.br-bar button{width:30px;height:30px;display:grid;place-items:center;color:var(--fg-2)}
.br-bar button:hover{background:var(--hover);color:var(--fg)}
.br-bar input{flex:1;background:var(--input);border:1px solid var(--line);padding:6px 10px;outline:none;font-family:var(--font-mono);font-size:12px;min-width:80px}
.br-bar input:focus{border-color:var(--accent)}
.br-frame{flex:1;border:0;width:100%;background:#fff}
.vm-screen{flex:1;background:#000;overflow:auto;display:grid;place-items:center}
#v86wrap div{white-space:pre;font:14px monospace;line-height:14px;color:#ddd}
#v86wrap canvas{display:block}
.fp-list{max-height:320px;overflow:auto;border:1px solid var(--line)}
.fp-list .fi{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
.fp-list .fi svg{width:15px;height:15px;color:var(--accent)}
.fp-list .fi:hover{background:var(--hover)}
.fp-list .fi.sel{background:var(--sel)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--fg-3)}.kv dd{margin:0;word-break:break-all;font-family:var(--font-mono);font-size:12px}
.md-view{padding:16px 22px;overflow:auto;flex:1;line-height:1.7}
.md-view pre{background:var(--input);padding:10px;overflow:auto;font-family:var(--font-mono);font-size:12px}
.md-view code{font-family:var(--font-mono);font-size:.9em;background:var(--input);padding:1px 4px}
.md-view h1,.md-view h2,.md-view h3{font-family:var(--font-disp);font-weight:400}
.font-prev p{font-size:28px;margin:8px 0;line-height:1.3}

/* ================= 移动端 ================= */
@media (max-width:768px){
  :root{--tb:58px;--cell-w:78px;--cell-h:96px}
  .dicon .ig{width:44px;height:44px}.dicon .ig img{width:44px;height:44px}
  .win{inset:0 0 0 0!important;width:auto!important;height:auto!important;min-width:0;min-height:0;clip-path:none;border:0;animation:none}
  .win.mini{transform:translateY(100%)}
  .rs{display:none}
  .win-title{cursor:default;height:42px}
  #startBtn span{display:none}#startBtn{padding:0 18px}
  .task span{display:none}.task{padding:0 12px;min-width:48px;justify-content:center}
  .task .tx{display:none!important}
  #showDesk{display:none}
  #clock small{display:none}
  #startMenu{left:6px;right:6px;width:auto;transform-origin:bottom center}
  #startMenu .sm-grid{grid-template-columns:repeat(4,1fr)}
  .ex-side{position:absolute;left:0;top:0;bottom:0;z-index:5;background:var(--panel-solid);transform:translateX(-100%);transition:transform .25s var(--ease);width:220px}
  .ex-side.open{transform:none;box-shadow:var(--shadow)}
  .ex-mob-side{display:inline-flex}
  .ed{flex-direction:column}
  .ed-left{width:auto!important;height:55%;min-width:0}
  .ed-split{width:auto;height:6px;cursor:row-resize}
  .ed-right{min-width:0;min-height:120px}
  .set-nav{width:56px}.set-nav button span{display:none}.set-nav button{justify-content:center;padding:12px 0}
  .dlg{width:calc(100vw - 20px)}
  #peek{display:none!important}
}
</style>
</head>

  <div id="tasks"></div>
  <div id="tray">
    <button id="themeBtn" title="切换深浅模式"></button>

  </div>

</div>

<div id="calendar" class="pop"></div>

<input type="file" id="wallIn" accept="image/*" hidden>

  stem(p) { const b = P.base(p); const i = b.lastIndexOf('.'); return i > 0 ? b.slice(0, i) : b; },

  get(s, k) { return this._tx(s, 'readonly', st => st.get(k)); },

class HandleFS {

  async stat(p) {

    let d; try { d = await this._dir(P.dir(p)); } catch { throw new FSError('ENOENT', p); }
    const name = P.base(p);
    try { const f = await (await d.getFileHandle(name)).getFile(); return { name, isDir: false, size: f.size, mtime: f.lastModified }; }
    catch (e) { try { await d.getDirectoryHandle(name); return { name, isDir: true, size: 0, mtime: 0 }; } catch { throw new FSError('ENOENT', p); } }
  }
  async readdir(p) {
    let dh; try { dh = await this._dir(p); } catch { throw new FSError('ENOENT', p); }
    const out = [];
    for await (const [name, h] of dh.entries()) {
      if (h.kind === 'file') { try { const f = await h.getFile(); out.push({ name, isDir: false, size: f.size, mtime: f.lastModified }); } catch { out.push({ name, isDir: false, size: 0, mtime: 0 }); } }

    const fh = await this._file(p); if (!fh.move) throw new FSError('ENOTSUP', p);
