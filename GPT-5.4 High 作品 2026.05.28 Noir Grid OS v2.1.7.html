      return obj;
    }

    function focusWindow(id) {
      const win = state.windows.get(id);
      if (!win) return;
      state.activeWindowId = id;
      win.el.style.zIndex = ++state.z;
      state.windows.forEach(w => w.el.classList.toggle('focused', w.id === id));
      renderDock();
    }

    function clampWindow(win) {
      const rect = win.el.getBoundingClientRect();
      const maxW = window.innerWidth - 10;
      const maxH = window.innerHeight - 10 - (window.innerWidth < 700 ? 70 : 0);
      let w = Math.min(rect.width, maxW);
      let h = Math.min(rect.height, maxH);
      let x = Math.min(Math.max(4, rect.left), window.innerWidth - w - 4);
      let y = Math.min(Math.max(4, rect.top), window.innerHeight - h - 4);
      Object.assign(win.el.style, { width: w + 'px', height: h + 'px', left: x + 'px', top: y + 'px' });
    }

    function maximizeWindow(win) {
      if (win.maximized) {
        const r = win.restoreRect;
        if (r) Object.assign(win.el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
        win.maximized = false;
        win.el.classList.remove('maximized');
      } else {
        const rect = win.el.getBoundingClientRect();
        win.restoreRect = { x: rect.left, y: rect.top, w: rect.width, h: rect.height };
        const pad = window.innerWidth < 700 ? 6 : 10;
        Object.assign(win.el.style, { left: pad + 'px', top: pad + 'px', width: (window.innerWidth - pad * 2) + 'px', height: (window.innerHeight - (window.innerWidth < 700 ? 96 : 26) - pad) + 'px' });
        win.maximized = true;
        win.el.classList.add('maximized');
      }
      focusWindow(win.id);
    }

    function minimizeWindow(win) {
      win.minimized = true;
      win.el.classList.add('minimized');
      renderDock();
    }

    function restoreWindow(win) {
      win.minimized = false;
      win.el.classList.remove('minimized');
      focusWindow(win.id);
    }

    async function closeWindow(id) {
      const win = state.windows.get(id);
      if (!win) return;
      try {
        const result = await win.onClose?.();
        if (result === false) return;
      } catch (error) {
        console.warn(error);
      }
      win.el.remove();
      state.windows.delete(id);
      if (state.activeWindowId === id) state.activeWindowId = [...state.windows.keys()].pop() || null;
      renderDock();
    }

    function bindWindow(win) {
      const titlebar = $('.window-titlebar', win.el);
      titlebar.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.window-controls')) return;
        if (win.maximized && window.innerWidth >= 700) return;
        focusWindow(win.id);
        const rect = win.el.getBoundingClientRect();
        const startX = e.clientX, startY = e.clientY;
        const originX = rect.left, originY = rect.top;
        const move = (ev) => {
          Object.assign(win.el.style, {
            left: Math.max(4, Math.min(window.innerWidth - rect.width - 4, originX + ev.clientX - startX)) + 'px',
            top: Math.max(4, Math.min(window.innerHeight - rect.height - 8, originY + ev.clientY - startY)) + 'px'
          });
        };
        const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up, { once: true });
      });
      win.el.addEventListener('pointerdown', () => focusWindow(win.id));
      $('[data-action="min"]', win.el).onclick = () => minimizeWindow(win);
      $('[data-action="max"]', win.el).onclick = () => maximizeWindow(win);
      $('[data-action="close"]', win.el).onclick = () => closeWindow(win.id);
      $$('.resize-handle', win.el).forEach(handle => {
        handle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (win.maximized) return;
          focusWindow(win.id);
          const dir = handle.dataset.dir;
          const rect = win.el.getBoundingClientRect();
          const startX = e.clientX, startY = e.clientY;
          const move = (ev) => {
            let left = rect.left, top = rect.top, width = rect.width, height = rect.height;
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (dir.includes('e')) width = Math.max(320, rect.width + dx);
            if (dir.includes('s')) height = Math.max(220, rect.height + dy);
            if (dir.includes('w')) { width = Math.max(320, rect.width - dx); left = rect.right - width; }
            if (dir.includes('n')) { height = Math.max(220, rect.height - dy); top = rect.bottom - height; }
            Object.assign(win.el.style, { left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
          };
          const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); clampWindow(win); };
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up, { once: true });
        });
      });
    }

    function renderDock() {
      $('#startButton').innerHTML = icon('start');
      $('#dockUpload').innerHTML = icon('upload');
      const dockWindows = $('#dockWindows');
      dockWindows.innerHTML = '';
      for (const win of state.windows.values()) {
        const chip = el('button', `window-chip ${win.id === state.activeWindowId ? 'active' : ''} ${win.minimized ? 'minimized' : ''}`, `${icon(win.iconName, 'w-4 h-4')}<span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml($('.name', win.el).textContent)}</span>`);
        chip.onclick = () => win.minimized ? restoreWindow(win) : (win.id === state.activeWindowId ? minimizeWindow(win) : restoreWindow(win));
        dockWindows.appendChild(chip);
      }
    }

    function renderStartMenu(filter = '') {
      const q = filter.trim().toLowerCase();
      const appCards = APPS.filter(app => !q || app.name.toLowerCase().includes(q) || app.description.toLowerCase().includes(q));
      startMenu.innerHTML = `
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="menu-title">Noir Grid OS</div>
            <div class="muted" style="font-size:12px;margin-top:6px;">Browser-native Web OS · OPFS-first VFS · Windowed SPA</div>
          </div>
          <div class="status-pill">${state.fs.root instanceof HandleTreeBackend ? 'OPFS primary' : 'IndexedDB fallback'}</div>
        </div>
        <div class="toolbar" style="margin-top:14px;padding:0;border:0;background:none;">
          <div class="toolbar-group" style="width:100%;">
            <div style="position:relative;flex:1;min-width:180px;">
              <div style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)">${icon('search')}</div>
              <input id="startSearch" class="toolbar-input" style="width:100%;padding-left:42px;" placeholder="搜索应用与入口" value="${escapeHtml(filter)}" />
            </div>
            <button class="toolbar-btn small" data-action="mount">${icon('mount')}挂载目录</button>
            <button class="toolbar-btn small" data-action="settings">${icon('settings')}设置</button>
          </div>
        </div>
        ${state.mountReminders.length ? `<div class="settings-card" style="margin-top:14px;"><div class="small muted">需要重新授权</div><div style="margin-top:8px;font-size:12px;line-height:1.8;">${state.mountReminders.map(m => escapeHtml(m.mountPath)).join('<br>')}</div></div>` : ''}
        <div class="menu-grid">
          ${appCards.map((app, i) => `<button class="start-card" data-app="${app.id}" style="animation:riseIn 500ms ${(i * 50)}ms both"> <div>${icon(app.icon, 'w-8 h-8')}</div><div><div class="big">${escapeHtml(app.name)}</div><div class="small">${escapeHtml(app.description)}</div></div></button>`).join('')}
        </div>
      `;
      $('#startSearch', startMenu).oninput = (e) => renderStartMenu(e.target.value);
      $$('[data-app]', startMenu).forEach(btn => btn.onclick = () => { hideMenus(); openApp(btn.dataset.app); });
      $('[data-action="mount"]', startMenu).onclick = async () => { hideMenus(); await mountLocalFolder(); };
      $('[data-action="settings"]', startMenu).onclick = () => { hideMenus(); openSettings(); };
    }

    async function openApp(appId, payload = {}) {
      if (appId === 'explorer') return openExplorer(payload.path || state.prefs.lastExplorerPath || '/Desktop');
      if (appId === 'notepad') return openEditor(payload.path || '/Desktop/Read Me.txt');
      if (appId === 'browser') return openBrowser(payload.url || 'about:noir');
      if (appId === 'calculator') return openCalculator();
      if (appId === 'paint') return openPaint();
      if (appId === 'settings') return openSettings();
    }

    async function openPath(path) {
      const info = await state.fs.stat(path);
      if (info.kind === 'dir') return openExplorer(path);
      const ext = extname(path);
      if (IMAGE_EXTS.has(ext)) return openImageViewer(path);
      if (AUDIO_EXTS.has(ext) || VIDEO_EXTS.has(ext)) return openMediaViewer(path);
      if (PDF_EXTS.has(ext)) return openPdfViewer(path);
      if (ARCHIVE_EXTS.has(ext) || path.endsWith('.tar.gz')) return openArchive(path);
      if (TABLE_EXTS.has(ext) || TEXT_EXTS.has(ext)) return openEditor(path);
      return openGenericViewer(path);
    }

    function sortEntries(entries, key, dir) {
      const factor = dir === 'desc' ? -1 : 1;
      const copy = [...entries];
      copy.sort((a, b) => {
        if (a.kind !== b.kind) return a.kind === 'dir' ? -1 : 1;
        if (key === 'name') return a.name.localeCompare(b.name, 'zh-CN') * factor;
        if (key === 'lastModified') return ((a.lastModified || 0) - (b.lastModified || 0)) * factor;
        if (key === 'type') return String(a.type || '').localeCompare(String(b.type || ''), 'zh-CN') * factor;
        if (key === 'size') return ((a.size || 0) - (b.size || 0)) * factor;
        return 0;
      });
      return copy;
    }

    async function openExplorer(startPath = '/Desktop') {
      const info = await state.fs.stat(startPath);
      if (info.kind !== 'dir') return openPath(startPath);
      state.prefs.lastExplorerPath = startPath;
      await savePrefs();
      const win = createWindow({ title: `资源管理器 · ${basename(startPath)}`, iconName: 'explorer', width: 1080, height: 720, appId: 'explorer' });
      const app = {
        currentPath: startPath,
        history: [startPath],
        historyIndex: 0,
        sortKey: 'name',
        sortDir: 'asc',
        query: '',
        selection: new Set()
      };
      state.explorerSelections.set(win.id, app.selection);
      win.body.innerHTML = `
        <div class="toolbar">
          <div class="toolbar-group">
            <button class="toolbar-btn small" data-act="back">${icon('back')}返回</button>
            <button class="toolbar-btn small" data-act="forward">${icon('forward')}前进</button>
            <button class="toolbar-btn small" data-act="up">${icon('up')}上级</button>
            <button class="toolbar-btn small" data-act="refresh">${icon('refresh')}刷新</button>
          </div>
          <div class="breadcrumbs" data-role="crumbs"></div>
          <div class="toolbar-spacer"></div>
          <div class="toolbar-group">
            <button class="toolbar-btn small" data-act="newfolder">${icon('plus')}文件夹</button>
            <button class="toolbar-btn small" data-act="upload">${icon('upload')}导入</button>
            <button class="toolbar-btn small" data-act="mount">${icon('mount')}挂载</button>
            <input class="toolbar-input" data-role="search" placeholder="搜索当前目录" />
          </div>
        </div>
        <div class="toolbar" style="padding-top:10px;">
          <div class="toolbar-group">
            <button class="toolbar-btn small" data-act="copy">${icon('copy')}复制</button>
            <button class="toolbar-btn small" data-act="paste">${icon('paste')}粘贴</button>
            <button class="toolbar-btn small" data-act="rename">${icon('rename')}重命名</button>
            <button class="toolbar-btn small" data-act="delete">${icon('delete')}删除</button>
          </div>
          <div class="toolbar-path" data-role="pathLabel"></div>
        </div>
        <div class="app-shell">
          <aside class="sidebar" data-role="sidebar"></aside>
          <section class="main-pane">
            <div class="file-list-wrap" data-role="listWrap">
              <div class="selection-box" data-role="selectBox"></div>
              <div class="file-head">
                <div class="file-cell"><button data-sort="name">名称</button></div>
                <div class="file-cell"><button data-sort="lastModified">修改日期</button></div>
                <div class="file-cell"><button data-sort="type">类型</button></div>
                <div class="file-cell"><button data-sort="size">大小</button></div>
              </div>
              <div data-role="rows"></div>
            </div>
          </section>
        </div>
      `;

      const root = win.body;
      const refs = {
        crumbs: $('[data-role="crumbs"]', root),
        sidebar: $('[data-role="sidebar"]', root),
        rows: $('[data-role="rows"]', root),
        listWrap: $('[data-role="listWrap"]', root),
        selectBox: $('[data-role="selectBox"]', root),
        search: $('[data-role="search"]', root),
        pathLabel: $('[data-role="pathLabel"]', root)
      };

      async function navigate(path, push = true) {
        const st = await state.fs.stat(path);
        if (st.kind !== 'dir') return openPath(path);
        app.currentPath = path;
        if (push) {
          app.history = app.history.slice(0, app.historyIndex + 1);
          app.history.push(path);
          app.historyIndex = app.history.length - 1;
        }
        app.selection = new Set();
        state.explorerSelections.set(win.id, app.selection);
        state.prefs.lastExplorerPath = path;
        await savePrefs();
        await render();
      }

      async function renderSidebar() {
        const quick = ['/Desktop', '/Documents', '/Downloads', '/Pictures', '/Music', '/Videos', '/mnt/local'];
        const mounted = state.fs.mounts.map(m => m.path).filter(p => p.startsWith('/mnt/local/'));
        refs.sidebar.innerHTML = [...quick, ...mounted.filter(p => !quick.includes(p))].map(path => `
          <button class="nav-item ${app.currentPath === path ? 'active' : ''}" data-path="${escapeHtml(path)}">${icon(path.includes('/mnt/local') ? 'mount' : (path === '/Desktop' ? 'start' : 'folder'))}<span>${escapeHtml(path === '/mnt/local' ? '本地挂载根' : basename(path))}</span></button>
        `).join('');
        $$('[data-path]', refs.sidebar).forEach(btn => btn.onclick = () => navigate(btn.dataset.path));
      }

      function renderCrumbs() {
        const parts = app.currentPath.split('/').filter(Boolean);
        const paths = ['/'];
        let accum = '';
        for (const part of parts) {
          accum += '/' + part;
          paths.push(accum);
        }
        refs.crumbs.innerHTML = paths.map(path => `<button class="crumb" data-path="${escapeHtml(path)}">${escapeHtml(path === '/' ? '根目录' : basename(path))}</button>`).join('');
        $$('[data-path]', refs.crumbs).forEach(btn => btn.onclick = () => navigate(btn.dataset.path));
      }

      async function refreshRows() {
        let entries = await state.fs.readdir(app.currentPath);
        const q = app.query.trim().toLowerCase();
        if (q) entries = entries.filter(item => item.name.toLowerCase().includes(q));
        entries = sortEntries(entries, app.sortKey, app.sortDir);
        refs.rows.innerHTML = entries.map(entry => `
          <div class="file-row ${app.selection.has(entry.path) ? 'selected' : ''}" data-path="${escapeHtml(entry.path)}" data-kind="${entry.kind}" draggable="true">
            <div class="file-cell file-name">${icon(fileKindIcon(entry), 'w-5 h-5')}<span>${escapeHtml(entry.name)}</span></div>
            <div class="file-cell file-muted">${escapeHtml(formatDate(entry.lastModified))}</div>
            <div class="file-cell file-muted">${escapeHtml(entry.kind === 'dir' ? '文件夹' : (entry.type || mimeFromName(entry.name)))}</div>
            <div class="file-cell file-muted">${escapeHtml(entry.kind === 'dir' ? '—' : formatBytes(entry.size || 0))}</div>
          </div>
        `).join('');
        const rows = $$('.file-row', refs.rows);
        for (const row of rows) {
          const path = row.dataset.path;
          const item = entries.find(e => e.path === path);
          row.onclick = (e) => {
            if (e.metaKey || e.ctrlKey) {
              if (app.selection.has(path)) app.selection.delete(path); else app.selection.add(path);
            } else {
              app.selection = new Set([path]);
            }
            state.explorerSelections.set(win.id, app.selection);
            refreshRows();
          };
          row.ondblclick = () => openPath(path);
          row.oncontextmenu = (e) => {
            e.preventDefault();
            if (!app.selection.has(path)) app.selection = new Set([path]);
            state.explorerSelections.set(win.id, app.selection);
            refreshRows();
            showContextMenu(e.clientX, e.clientY, explorerContextActions(app, win));
          };
          row.addEventListener('dragstart', (e) => {
            const paths = app.selection.size && app.selection.has(path) ? [...app.selection] : [path];
            e.dataTransfer.setData('application/x-webos-paths', JSON.stringify(paths));
            if ((item?.kind || row.dataset.kind) === 'file' && paths.length === 1 && row.dataset.downloadurl) {
              e.dataTransfer.setData('DownloadURL', row.dataset.downloadurl);
            }
          });
          row.addEventListener('dragover', (e) => {
            if (row.dataset.kind === 'dir') e.preventDefault();
          });
          row.addEventListener('drop', async (e) => {
            if (row.dataset.kind !== 'dir') return;
            e.preventDefault();
            await handleDropInto(path, e.dataTransfer, false);
            await render();
          });
          if (row.dataset.kind === 'file') prepareDragExport(row, path);
        }
      }

      async function render() {
        win.setTitle(`资源管理器 · ${basename(app.currentPath) || '根目录'}`);
        refs.pathLabel.textContent = app.currentPath;
        renderCrumbs();
        await renderSidebar();
        await refreshRows();
      }

      win.rerender = render;
      refs.search.oninput = async (e) => { app.query = e.target.value; await refreshRows(); };
      $$('[data-sort]', root).forEach(btn => btn.onclick = async () => {
        const key = btn.dataset.sort;
        if (app.sortKey === key) app.sortDir = app.sortDir === 'asc' ? 'desc' : 'asc';
        else { app.sortKey = key; app.sortDir = 'asc'; }
        await refreshRows();
      });
      $('[data-act="back"]', root).onclick = async () => { if (app.historyIndex > 0) { app.historyIndex--; await navigate(app.history[app.historyIndex], false); } };
      $('[data-act="forward"]', root).onclick = async () => { if (app.historyIndex < app.history.length - 1) { app.historyIndex++; await navigate(app.history[app.historyIndex], false); } };
      $('[data-act="up"]', root).onclick = async () => { if (app.currentPath !== '/') await navigate(dirname(app.currentPath)); };
      $('[data-act="refresh"]', root).onclick = render;
      $('[data-act="newfolder"]', root).onclick = async () => { const name = await showPrompt({ title: '新建文件夹', value: '新建文件夹' }); if (name) { await state.fs.mkdir(await state.fs.ensureUniquePath(joinPath(app.currentPath, name)), { recursive: true }); await render(); renderDesktop(); } };
      $('[data-act="upload"]', root).onclick = () => { state.uploadTarget = app.currentPath; fileUploadInput.click(); };
      $('[data-act="mount"]', root).onclick = async () => { await mountLocalFolder(); await render(); };
      $('[data-act="copy"]', root).onclick = () => { if (app.selection.size) { state.clipboard = { mode: 'copy', paths: [...app.selection] }; toast('已复制', `${app.selection.size} 项`); } };
      $('[data-act="paste"]', root).onclick = async () => { await pasteInto(app.currentPath); await render(); };
      $('[data-act="rename"]', root).onclick = async () => { if (app.selection.size === 1) await renamePath([...app.selection][0]); await render(); };
      $('[data-act="delete"]', root).onclick = async () => { await deleteSelection([...app.selection]); app.selection.clear(); await render(); renderDesktop(); };
      refs.listWrap.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.file-row')) return;
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, explorerBackgroundActions(app, render));
      });
      refs.listWrap.addEventListener('dragover', (e) => { e.preventDefault(); });
      refs.listWrap.addEventListener('drop', async (e) => { e.preventDefault(); await handleDropInto(app.currentPath, e.dataTransfer, false); await render(); });
      setupSelectionBox(refs.listWrap, refs.rows, refs.selectBox, () => {
        const next = new Set();
        $$('.file-row', refs.rows).forEach(row => next.add(row.dataset.path));
        return next;
      }, (selectedPaths) => {
        app.selection = new Set(selectedPaths);
        state.explorerSelections.set(win.id, app.selection);
        refreshRows();
      });
      await render();
      return win;
    }

    function explorerContextActions(app, win) {
      const paths = [...app.selection];
      const single = paths[0];
      return [
        { label: '打开', icon: 'open', action: () => single && openPath(single) },
        { label: '复制', icon: 'copy', action: () => { if (paths.length) { state.clipboard = { mode: 'copy', paths }; toast('已复制', `${paths.length} 项`); } } },
        { label: '重命名', icon: 'rename', action: () => single && renamePath(single).then(() => win.rerender?.()) },
        { label: '删除', icon: 'delete', action: () => deleteSelection(paths).then(() => { app.selection.clear(); win.rerender?.(); renderDesktop(); }) },
        { label: '下载到本地', icon: 'download', action: () => single && downloadPath(single) },
        ...(single && (ARCHIVE_EXTS.has(extname(single)) || single.endsWith('.tar.gz')) ? [{ label: '解压归档', icon: 'archive', action: () => extractArchiveDialog(single).then(() => win.rerender?.()) }] : [])
      ];
    }

    function explorerBackgroundActions(app, render) {
      return [
        { label: '刷新', icon: 'refresh', action: render },
        { label: '新建文件夹', icon: 'plus', action: async () => { const name = await showPrompt({ title: '新建文件夹', value: '新建文件夹' }); if (name) { await state.fs.mkdir(await state.fs.ensureUniquePath(joinPath(app.currentPath, name)), { recursive: true }); render(); renderDesktop(); } } },
        { label: '导入文件', icon: 'upload', action: () => { state.uploadTarget = app.currentPath; fileUploadInput.click(); } },
        { label: '粘贴', icon: 'paste', action: async () => { await pasteInto(app.currentPath); render(); } },
        { label: '挂载本地目录', icon: 'mount', action: mountLocalFolder }
      ];
    }

    function setupSelectionBox(surface, container, boxNode, allItemsGetter, applySelection) {
      surface.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.file-row') || e.button === 2) return;
        const rect = surface.getBoundingClientRect();
        const start = { x: e.clientX - rect.left + surface.scrollLeft, y: e.clientY - rect.top + surface.scrollTop };
        boxNode.style.display = 'block';
        const move = () => {};
        const pointerMove = (ev) => {
          const x = ev.clientX - rect.left + surface.scrollLeft;
          const y = ev.clientY - rect.top + surface.scrollTop;
          const left = Math.min(start.x, x);
          const top = Math.min(start.y, y);
          const width = Math.abs(start.x - x);
          const height = Math.abs(start.y - y);
          Object.assign(boxNode.style, { left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
          const selectionRect = { left: rect.left + left - surface.scrollLeft, top: rect.top + top - surface.scrollTop, right: rect.left + left + width - surface.scrollLeft, bottom: rect.top + top + height - surface.scrollTop };
          const selected = [];
          $$('.file-row', container).forEach(row => {
            const r = row.getBoundingClientRect();
            if (!(r.right < selectionRect.left || r.left > selectionRect.right || r.bottom < selectionRect.top || r.top > selectionRect.bottom)) selected.push(row.dataset.path);
          });
          applySelection(selected);
        };
        const up = () => {
          boxNode.style.display = 'none';
          window.removeEventListener('pointermove', pointerMove);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', pointerMove);
        window.addEventListener('pointerup', up, { once: true });
      });
    }

    async function pasteInto(targetDir) {
      if (!state.clipboard?.paths?.length) { toast('剪贴板为空'); return; }
      for (const src of state.clipboard.paths) {
        const candidate = await state.fs.ensureUniquePath(joinPath(targetDir, basename(src)));
        await state.fs.copy(src, candidate);
      }
      toast('已粘贴到', targetDir);
      rerenderExplorerWindows();
      renderDesktop();
    }

    async function deleteSelection(paths) {
      if (!paths.length) return;
      const yes = await showConfirm({ title: '删除所选项目', message: `将删除 ${paths.length} 个项目，此操作不可撤销。`, confirmText: '删除' });
      if (!yes) return;
      for (const path of paths) await state.fs.remove(path);
      toast('已删除', `${paths.length} 项`);
      renderDesktop();
      rerenderExplorerWindows();
    }

    function rerenderExplorerWindows() {
      state.windows.forEach(win => { if (win.appId === 'explorer') win.rerender?.(); });
    }

    function parseDelimited(text, delimiter = ',') {
      const rows = [];
      let row = [], value = '', quote = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quote) {
          if (ch === '"' && text[i + 1] === '"') { value += '"'; i++; }
          else if (ch === '"') quote = false;
          else value += ch;
          continue;
        }
        if (ch === '"') { quote = true; continue; }
        if (ch === delimiter) { row.push(value); value = ''; continue; }
        if (ch === '\n') { row.push(value); rows.push(row); row = []; value = ''; continue; }
        if (ch === '\r') continue;
        value += ch;
      }
      row.push(value);
      if (row.length > 1 || row[0] !== '') rows.push(row);
      return rows;
    }

    function serializeDelimited(rows, delimiter = ',') {
      return rows.map(row => row.map(cell => {
        const text = String(cell ?? '');
        return /["\n\r]/.test(text) || text.includes(delimiter) ? '"' + text.replace(/"/g, '""') + '"' : text;
      }).join(delimiter)).join('\n');
    }

    async function openEditor(path) {
      const win = createWindow({ title: `记事本 · ${basename(path)}`, iconName: 'editor', width: 1040, height: 720, appId: 'notepad' });
      const ext = extname(path);
      const delimiter = ext === 'tsv' ? '\t' : ',';
      let text;
      try {
        text = await state.fs.readFile(path, 'text');
      } catch {
        const buffer = await state.fs.readFile(path, 'arrayBuffer');
        text = decodeText(buffer);
      }
      const htmlMode = ext === 'html' || ext === 'htm';
      const tableMode = TABLE_EXTS.has(ext);
      win.body.innerHTML = `
        <div class="editor-shell">
          <div class="toolbar">
            <div class="toolbar-group">
              <button class="toolbar-btn small" data-act="save">${icon('save')}保存</button>
              ${htmlMode ? `<button class="toolbar-btn small" data-act="browser">${icon('browser')}浏览器打开</button>` : ''}
              <div class="status-pill">${escapeHtml(path)}</div>
            </div>
            <div class="toolbar-spacer"></div>
            ${tableMode ? `<div class="segmented"><button class="seg-btn active" data-view="text">文本</button><button class="seg-btn" data-view="table">表格</button></div>` : htmlMode ? `<div class="status-pill">实时预览已开启</div>` : ''}
          </div>
          <div class="editor-main ${htmlMode ? 'html-mode' : ''}" data-role="main">
            <textarea class="editor-text" data-role="text"></textarea>
            ${htmlMode ? `<iframe class="editor-preview" data-role="preview"></iframe>` : ''}
            ${tableMode ? `<div class="table-view hidden" data-role="table"></div>` : ''}
          </div>
        </div>
      `;
      const textarea = $('[data-role="text"]', win.body);
      textarea.value = text;
      const preview = $('[data-role="preview"]', win.body);
      const table = $('[data-role="table"]', win.body);
      let dirty = false;

      function refreshPreview() {
        if (preview) preview.srcdoc = textarea.value;
      }

      function renderTable() {
        if (!table) return;
        const rows = parseDelimited(textarea.value, delimiter);
        const maxCols = Math.max(1, ...rows.map(r => r.length));
        table.innerHTML = `<table class="sheet-table"><tbody>${rows.map((row, rIndex) => `<tr>${Array.from({ length: maxCols }, (_, cIndex) => `<td><input class="sheet-input" data-r="${rIndex}" data-c="${cIndex}" value="${escapeHtml(row[cIndex] ?? '')}" /></td>`).join('')}</tr>`).join('')}</tbody></table>`;
        $$('input.sheet-input', table).forEach(input => input.oninput = () => {
          const grid = parseDelimited(textarea.value, delimiter);
          const r = Number(input.dataset.r), c = Number(input.dataset.c);
          grid[r] = grid[r] || [];
          grid[r][c] = input.value;
          textarea.value = serializeDelimited(grid, delimiter);
          dirty = true;
        });
      }

      if (preview) refreshPreview();
      if (table) renderTable();
      textarea.addEventListener('input', () => {
        dirty = true;
        if (preview) refreshPreview();
      });
      $('[data-act="save"]', win.body).onclick = async () => {
        await state.fs.writeFile(path, textarea.value, { type: mimeFromName(path) });
        dirty = false;
        toast('文件已保存', path);
        renderDesktop();
        rerenderExplorerWindows();
      };
      if (htmlMode) {
        $('[data-act="browser"]', win.body).onclick = async () => {
          const blob = new Blob([textarea.value], { type: 'text/html' });
          const url = rememberObjectUrl(`html-preview:${path}`, URL.createObjectURL(blob), true);
          openBrowser(url, basename(path));
        };
      }
      if (tableMode) {
        $$('[data-view]', win.body).forEach(btn => btn.onclick = () => {
          $$('[data-view]', win.body).forEach(b => b.classList.toggle('active', b === btn));
          const showTable = btn.dataset.view === 'table';

    function parseTar(buffer) {
      const bytes = new Uint8Array(buffer);
      const out = [];
      let offset = 0;
      const td = new TextDecoder();
      const readString = (start, length) => td.decode(bytes.slice(start, start + length)).replace(/\0.*$/, '').trim();
      while (offset + 512 <= bytes.length) {
        const block = bytes.slice(offset, offset + 512);
        const empty = block.every(v => v === 0);
        if (empty) break;
        const name = readString(offset, 100);
        const sizeText = readString(offset + 124, 12).replace(/\0/g, '').trim();
        const size = parseInt(sizeText || '0', 8) || 0;
        const type = String.fromCharCode(bytes[offset + 156] || 48);
        const prefix = readString(offset + 345, 155);
        const fullName = prefix ? `${prefix}/${name}` : name;
        const dataStart = offset + 512;
        const dataEnd = dataStart + size;
        if (fullName) out.push({ name: fullName, type, data: bytes.slice(dataStart, dataEnd) });
        offset = dataStart + Math.ceil(size / 512) * 512;
      }
      return out;
    }

    async function gunzipBuffer(buffer) {
      if (!window.DecompressionStream) throw new Error('当前浏览器不支持 DecompressionStream');
      const ds = new DecompressionStream('gzip');
      return new Response(new Blob([buffer]).stream().pipeThrough(ds)).arrayBuffer();
    }

    function parseGzipOriginalName(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) return null;
      const flags = bytes[3];
      let i = 10;
      if (flags & 4) { const xlen = bytes[i] | (bytes[i + 1] << 8); i += 2 + xlen; }
      if (flags & 8) {
        let name = '';
        while (i < bytes.length && bytes[i] !== 0) name += String.fromCharCode(bytes[i++]);
        return name || null;
      }
      return null;
    }

    async function analyzeArchive(path) {
      const ext = extname(path);
      const buffer = await state.fs.readFile(path, 'arrayBuffer');
      if (path.endsWith('.tar.gz') || ext === 'tgz') {
        const tarBuffer = await gunzipBuffer(buffer);
        const entries = parseTar(tarBuffer).filter(e => e.name);
        return { type: 'tgz', entries };
      }
      if (ext === 'tar') {
        const entries = parseTar(buffer).filter(e => e.name);
        return { type: 'tar', entries };
      }
      if (ext === 'gz') {
        const name = parseGzipOriginalName(buffer) || stem(path);
        return { type: 'gz', entries: [{ name, type: '0', data: new Uint8Array(await gunzipBuffer(buffer)) }] };
      }
      if (ext === 'zip') {
        if (!window.fflate) throw new Error('zip 解压库未加载');
        const files = window.fflate.unzipSync(new Uint8Array(buffer));
        const entries = Object.entries(files).map(([name, data]) => ({ name, type: name.endsWith('/') ? '5' : '0', data }));
        return { type: 'zip', entries };
      }
      throw new Error('暂不支持的归档类型');
    }

          await state.fs.mkdir(joinPath(targetDir, clean), { recursive: true });

          await state.fs.mkdir(dirname(joinPath(targetDir, clean)), { recursive: true });
          await state.fs.writeFile(joinPath(targetDir, clean), entry.data, { type: mimeFromName(entry.name) });
        }

      rerenderExplorerWindows();

      ctx.lineJoin = 'round';
      let drawing = false;

      const size = $('[data-role="size"]', win.body);
      const point = (e) => {
        const rect = canvas.getBoundingClientRect();

        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        return { x, y };
      };
      canvas.addEventListener('pointerdown', (e) => {
        drawing = true;
        const p = point(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const p = point(e);
        ctx.strokeStyle = color.value;
        ctx.lineWidth = Number(size.value);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });
      window.addEventListener('pointerup', () => drawing = false);
      $('[data-act="clear"]', win.body).onclick = () => {

    async function directorySizes(base = '/') {
      const entries = await state.fs.readdir(base);
      const out = [];
      for (const entry of entries) {
        const size = entry.kind === 'file' ? entry.size || 0 : await sumDir(entry.path);
        out.push({ name: entry.name, path: entry.path, size });
      }
      return out.sort((a, b) => b.size - a.size);
    }

    async function sumDir(path) {
      const entries = await state.fs.readdir(path);
      let total = 0;
      for (const entry of entries) {
        total += entry.kind === 'file' ? (entry.size || 0) : await sumDir(entry.path);
      }
      return total;
    }

      }

      function renderWallpapers() {
        $('[data-role="wallpapers"]', win.body).innerHTML = WALLPAPERS.map(wp => `<button class="wallpaper-card ${state.prefs.wallpaper?.id === wp.id && state.prefs.wallpaper?.kind === 'builtin' ? 'active' : ''}" data-id="${wp.id}" style="background:${wp.css}"></button>`).join('');
        $$('[data-id]', win.body).forEach(btn => btn.onclick = async () => {
          state.prefs.wallpaper = { kind: 'builtin', id: btn.dataset.id };
          await savePrefs();
          await applyWallpaper();
          renderWallpapers();
        });
      }

      function renderMounts() {
        const live = state.fs.mounts.map(m => `<div class="mount-row"><div>${escapeHtml(m.path)}</div><div class="good">已挂载</div><button class="toolbar-btn small" data-unmount="${escapeHtml(m.path)}">卸载</button></div>`).join('');
        const stale = state.mountReminders.map(m => `<div class="mount-row"><div>${escapeHtml(m.mountPath)}</div><div class="danger">待重新授权</div><button class="toolbar-btn small" data-remount="${escapeHtml(m.mountPath)}">重新挂载</button></div>`).join('');
        $('[data-role="mountList"]', win.body).innerHTML = live + stale || '<div class="muted">暂无挂载</div>';
        $$('[data-unmount]', win.body).forEach(btn => btn.onclick = () => unmountPath(btn.dataset.unmount).then(() => { renderMounts(); rerenderExplorerWindows(); }));
        $$('[data-remount]', win.body).forEach(btn => btn.onclick = async () => { await mountLocalFolder(); renderMounts(); rerenderExplorerWindows(); });
      }

      $('[data-act="persist"]', win.body).onclick = async () => {
        try {
          const result = await navigator.storage?.persist?.();
          toast(result ? '已请求持久化成功' : '浏览器未确认持久化');
          renderUsage();
        } catch (error) { toast('持久化请求失败', error.message || ''); }
      };
      $('[data-act="mount"]', win.body).onclick = async () => { await mountLocalFolder(); renderMounts(); rerenderExplorerWindows(); };
      $('[data-act="refresh"]', win.body).onclick = () => { renderUsage(); renderMounts(); renderWallpapers(); };
      $('[data-act="uploadWallpaper"]', win.body).onclick = () => wallpaperUploadInput.click();
      $('[data-act="reset"]', win.body).onclick = async () => {
        const yes = await showConfirm({ title: '重置整个系统', message: '将清空 OPFS/IndexedDB 虚拟文件系统、偏好与挂载记录。', confirmText: '彻底重置' });
        if (!yes) return;
        await resetSystem();
      };

      renderWallpapers();
      renderMounts();
      renderUsage();
      return win;
    }

    async function clearRootBackend(path = '/') {
      const items = await state.fs.root.readdir(path);
      for (const item of items) {
        if (item.kind === 'dir') await state.fs.root.rmdir(item.path, { recursive: true });
        else await state.fs.root.unlink(item.path);
      }
    }

    async function resetSystem() {
      try {
        await clearRootBackend('/');
      } catch (error) {
        console.warn(error);
      }
      await idbClear('kv');
      await idbClear('mounts');
      if (!(state.fs.root instanceof HandleTreeBackend)) await idbClear('fsnodes');
      state.fs.mounts = [];
      state.mountReminders = [];
      state.prefs = structuredClone(DEFAULT_PREFS);
      tinyStore.clear('noir-prefs');
      await state.fs.root.init?.();
      await ensureSystemFolders();
      await seedSystem();
      await savePrefs();
      await applyWallpaper();
      renderDesktop();
      rerenderExplorerWindows();
      state.windows.forEach(win => { win.onClose = null; win.el.remove(); });
      state.windows.clear();
      state.activeWindowId = null;
      renderDock();
      toast('系统已重置', '已恢复默认桌面与文件结构');
    }

    async function importFileObject(file, targetDir) {
      const path = await state.fs.ensureUniquePath(joinPath(targetDir, file.name));
      await state.fs.writeFile(path, file, { type: file.type || mimeFromName(file.name) });
    }

    async function importHandleRecursive(handle, targetDir) {
      if (handle.kind === 'file') {
        const file = await handle.getFile();
        const path = await state.fs.ensureUniquePath(joinPath(targetDir, file.name));
        await state.fs.writeFile(path, file, { type: file.type || mimeFromName(file.name) });
        return;
      }
      const folderPath = await state.fs.ensureUniquePath(joinPath(targetDir, handle.name));
      await state.fs.mkdir(folderPath, { recursive: true });
      for await (const child of handle.values()) {
        await importHandleRecursive(child, folderPath);
      }
    }

    async function handleDropInto(targetDir, dataTransfer, fromDesktop = false) {
      const internal = dataTransfer.getData('application/x-webos-paths');
      if (internal) {
        const paths = JSON.parse(internal);
        for (const src of paths) {
          if (isSubPath(targetDir, src)) continue;
          if (normalizePath(dirname(src)) === normalizePath(targetDir)) continue;
          const target = await state.fs.ensureUniquePath(joinPath(targetDir, basename(src)));
          if (normalizePath(src) !== normalizePath(target)) await state.fs.rename(src, target);
        }
        toast('已移动到', targetDir);
        renderDesktop();
        rerenderExplorerWindows();
        return;
      }

      if (dataTransfer.items?.length) {
        for (const item of dataTransfer.items) {
          if (item.kind !== 'file') continue;
          if (item.getAsFileSystemHandle) {
            const handle = await item.getAsFileSystemHandle();
            if (handle) { await importHandleRecursive(handle, targetDir); continue; }
          }
          const file = item.getAsFile();
          if (file) await importFileObject(file, targetDir);
        }
      } else if (dataTransfer.files?.length) {
        for (const file of dataTransfer.files) await importFileObject(file, targetDir);
      }
      toast('导入完成', targetDir);
      renderDesktop();
      rerenderExplorerWindows();
    }

    $('#startButton').onclick = () => {
      state.startMenuOpen = !state.startMenuOpen;
      startMenu.classList.toggle('hidden', !state.startMenuOpen);
      if (state.startMenuOpen) renderStartMenu();
    };
    $('#dockUpload').onclick = () => { state.uploadTarget = '/Desktop'; fileUploadInput.click(); };

    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#startMenu') && !e.target.closest('#startButton')) {
        startMenu.classList.add('hidden');
        state.startMenuOpen = false;
      }
      if (!e.target.closest('#contextMenu')) {
        contextMenu.style.display = 'none';
        state.contextMenuOpen = false;
      }
    });
    window.addEventListener('resize', () => { state.windows.forEach(clampWindow); renderDesktop(); });

    fileUploadInput.addEventListener('change', async () => {
      const files = [...fileUploadInput.files];
      for (const file of files) await importFileObject(file, state.uploadTarget || '/Desktop');
      fileUploadInput.value = '';
      renderDesktop();
      rerenderExplorerWindows();
      toast('文件已导入', `${files.length} 个项目`);
    });

    folderUploadInput.addEventListener('change', async () => {
      const files = [...folderUploadInput.files];
      const groups = new Map();
      for (const file of files) {
        const rel = file.webkitRelativePath || file.name;
        groups.set(rel, file);
      }
      for (const [rel, file] of groups) {
        const target = joinPath(state.uploadTarget || '/Desktop', rel);
        await state.fs.mkdir(dirname(target), { recursive: true });
        await state.fs.writeFile(target, file, { type: file.type || mimeFromName(file.name) });
      }
      folderUploadInput.value = '';
      renderDesktop();
      rerenderExplorerWindows();
      toast('文件夹已导入', `${files.length} 个文件`);
    });

    wallpaperUploadInput.addEventListener('change', async () => {
      const file = wallpaperUploadInput.files[0];
      if (!file) return;
      const path = await state.fs.ensureUniquePath(`/System/Wallpapers/${file.name}`);
      await state.fs.writeFile(path, file, { type: file.type || 'image/*' });
      state.prefs.wallpaper = { kind: 'custom', path };
      await savePrefs();
      await applyWallpaper();
      wallpaperUploadInput.value = '';
      toast('壁纸已更新', path);
    });

    setupDesktopSurface();

    state.db = await openDB();
    await loadPrefs();
    state.fs = new UnifiedFS(await createRootBackend());
    await state.fs.init();
    window.fs = state.fs;
    await seedSystem();
    await restoreMounts();
    await applyWallpaper();
    await renderDesktop();
    await refreshStorageQuick();
    clockTick();
    setInterval(clockTick, 1000 * 20);
    setInterval(refreshStorageQuick, 1000 * 25);

    toast('Noir Grid OS 已就绪', '右键桌面可新建文件夹、上传文件或切换壁纸');
  })();
  </script>
</body>
</html>
