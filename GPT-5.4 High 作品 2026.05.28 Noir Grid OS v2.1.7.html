<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Noir Grid OS</title>
  <meta name="theme-color" content="#0b0a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" onerror="window.fflateUnavailable=true"></script>
  <style>
    :root {
      --bg: #09070d;
      --bg-soft: rgba(17, 14, 25, 0.7);
      --panel: rgba(17, 15, 24, 0.82);
      --panel-2: rgba(30, 25, 39, 0.75);
      --panel-3: rgba(9, 9, 14, 0.65);
      --text: #f3ecdc;
      --muted: #bba894;
      --line: rgba(255, 238, 209, 0.12);
      --line-strong: rgba(255, 238, 209, 0.22);
      --accent: #ff9f5a;
      --accent-2: #f2d06b;
      --accent-3: #7dd3c7;
      --danger: #ff6b73;
      --good: #7ce2a2;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      --radius: 24px;
      --dock-h: 72px;
      --font-ui: 'Unbounded', sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Fragment Mono', monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
    body {
      font-family: var(--font-ui);
      letter-spacing: 0.02em;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background:
        radial-gradient(circle at 15% 15%, rgba(244, 162, 97, 0.12), transparent 24%),
        radial-gradient(circle at 78% 18%, rgba(125, 211, 199, 0.11), transparent 25%),
        linear-gradient(135deg, #060508, #09070d 45%, #140f19 100%);
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    textarea, input { user-select: text; -webkit-user-select: text; }
    #os { position: relative; height: 100%; width: 100%; overflow: hidden; }
    #wallpaperLayer, .atmosphere, #desktop, #windowLayer, #promptLayer, #toastArea { position: absolute; inset: 0; }
    #wallpaperLayer {
      background-size: cover;
      background-position: center;
      transition: background 500ms ease, filter 500ms ease;
      filter: saturate(1.04) contrast(1.06);
    }
    .atmosphere {
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(6, 5, 8, 0.24), rgba(6, 5, 8, 0.08) 18%, rgba(6, 5, 8, 0.35) 100%),
        radial-gradient(circle at top, rgba(255, 159, 90, 0.10), transparent 28%),
        radial-gradient(circle at 80% 15%, rgba(125, 211, 199, 0.08), transparent 25%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 26px);
      mix-blend-mode: screen;
      opacity: 0.38;
    }
    #desktop {
      padding: 18px 18px calc(var(--dock-h) + env(safe-area-inset-bottom) + 18px) 18px;
      overflow: hidden;
      touch-action: none;
    }
    .desktop-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255,255,255,0.025) calc(100% - 1px)),
        linear-gradient(180deg, transparent 0 calc(100% - 1px), rgba(255,255,255,0.025) calc(100% - 1px));
      background-size: 104px 104px;
      opacity: 0.2;
      mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
    }
    #desktopIcons { position: absolute; inset: 0; }
    .desktop-icon {
      position: absolute;
      width: 92px;
      min-height: 102px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 22px;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      border: 1px solid transparent;
      cursor: default;
      touch-action: none;
      animation: riseIn 540ms cubic-bezier(.2,.8,.2,1) both;
      transform-origin: center;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.06); transform: translateY(-2px) scale(1.01); }
    .desktop-icon.selected {
      background: rgba(255, 159, 90, 0.12);
      border-color: rgba(255, 159, 90, 0.36);
      box-shadow: 0 14px 32px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255, 209, 128, 0.08);
    }
    .desktop-icon .glyph {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: var(--accent-2);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        linear-gradient(135deg, rgba(255,159,90,0.18), rgba(125,211,199,0.10));
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 12px 24px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
    }
    .desktop-icon .label {
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
      color: #f8f0e1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.55);
      word-break: break-word;
      max-width: 100%;
    }

    .frost {
      background: linear-gradient(180deg, rgba(26, 22, 34, 0.82), rgba(12, 11, 18, 0.76));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(1.2);
    }
    .panel {
      background: linear-gradient(180deg, rgba(24, 20, 30, 0.92), rgba(12, 11, 18, 0.88));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(1.2);
    }

    #dock {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      height: var(--dock-h);
      border-radius: 28px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1500;
      animation: riseIn 700ms 120ms both;
    }
    .dock-left, .dock-right { display: flex; align-items: center; gap: 10px; }
    .dock-center { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .dock-center::-webkit-scrollbar { display: none; }
    .dock-btn, .window-chip, .start-card, .ctx-btn, .toolbar-btn, .seg-btn, .soft-btn {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      color: var(--text);
      border-radius: 18px;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    .dock-btn, .toolbar-btn, .soft-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      min-height: 48px;
      cursor: pointer;
    }
    .dock-btn:hover, .window-chip:hover, .start-card:hover, .ctx-btn:hover, .toolbar-btn:hover, .seg-btn:hover, .soft-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,159,90,0.42);
      background: linear-gradient(180deg, rgba(255,159,90,0.12), rgba(255,255,255,0.05));
    }
    .window-chip {
      min-width: 96px;
      max-width: 220px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window-chip.active { border-color: rgba(255,159,90,0.48); background: linear-gradient(180deg, rgba(255,159,90,0.18), rgba(255,255,255,0.05)); }
    .window-chip.minimized { opacity: 0.6; }
    .status-pill {
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      background: rgba(255,255,255,0.03);
      white-space: nowrap;
    }

    #startMenu {
      position: absolute;
      left: 18px;
      bottom: calc(var(--dock-h) + 34px + env(safe-area-inset-bottom));
      width: min(560px, calc(100vw - 36px));
      max-height: min(72vh, 840px);
      border-radius: 30px;
      padding: 18px;
      z-index: 1600;
      overflow: auto;
      transform-origin: bottom left;
      animation: menuIn 240ms ease;
    }
    .menu-title {
      font-family: var(--font-serif);
      font-size: 28px;
      letter-spacing: 0.02em;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .start-card {
      min-height: 106px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      cursor: pointer;
    }
    .start-card .small { font-size: 11px; color: var(--muted); }
    .start-card .big { font-size: 13px; line-height: 1.4; }

    #contextMenu {
      position: absolute;
      min-width: 220px;
      border-radius: 22px;
      padding: 8px;
      z-index: 2200;
      display: none;
      animation: menuIn 180ms ease;
    }
    .ctx-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin: 4px 0;
      cursor: pointer;
      text-align: left;
    }
    .ctx-btn .hint { margin-left: auto; color: var(--muted); font-size: 10px; }

    #windowLayer { pointer-events: none; z-index: 1200; }
    .window {
      position: absolute;
      min-width: 320px;
      min-height: 220px;
      border-radius: 28px;
      overflow: hidden;
      pointer-events: auto;
      transform-origin: center;
      animation: windowIn 260ms cubic-bezier(.2,.8,.2,1);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(26,21,34,0.9), rgba(12,11,18,0.86));
      backdrop-filter: blur(28px) saturate(1.2);
    }
    .window.maximized {
      border-radius: 20px;
    }
    .window.minimized {
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      pointer-events: none;
    }
    .window-titlebar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
        linear-gradient(90deg, rgba(255,159,90,0.06), transparent 26%, transparent 74%, rgba(125,211,199,0.06));
      cursor: grab;
      touch-action: none;
    }
    .window-titlebar:active { cursor: grabbing; }
    .window-title {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }
    .window-title .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window-controls { display: flex; align-items: center; gap: 8px; }
    .control-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }
    .control-btn:hover { transform: translateY(-1px); border-color: rgba(255,159,90,0.4); background: rgba(255,159,90,0.12); }
    .control-btn.close:hover { background: rgba(255,107,115,0.16); border-color: rgba(255,107,115,0.38); }
    .window-content {
      position: absolute;
      inset: 58px 0 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .resize-handle { position: absolute; z-index: 2; }
    .resize-handle.n, .resize-handle.s { left: 14px; right: 14px; height: 10px; cursor: ns-resize; }
    .resize-handle.n { top: -4px; }
    .resize-handle.s { bottom: -4px; }
    .resize-handle.e, .resize-handle.w { top: 14px; bottom: 14px; width: 10px; cursor: ew-resize; }
    .resize-handle.e { right: -4px; }
    .resize-handle.w { left: -4px; }
    .resize-handle.ne, .resize-handle.nw, .resize-handle.se, .resize-handle.sw { width: 14px; height: 14px; }
    .resize-handle.ne { top: -4px; right: -4px; cursor: nesw-resize; }
    .resize-handle.nw { top: -4px; left: -4px; cursor: nwse-resize; }
    .resize-handle.se { bottom: -4px; right: -4px; cursor: nwse-resize; }
    .resize-handle.sw { bottom: -4px; left: -4px; cursor: nesw-resize; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
    }
    .toolbar-group { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-input {
      min-height: 42px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 16px;
      padding: 0 14px;
      outline: none;
    }
    .toolbar-input:focus { border-color: rgba(255,159,90,0.4); box-shadow: 0 0 0 3px rgba(255,159,90,0.09); }
    .toolbar-btn.small, .soft-btn.small { min-height: 42px; padding: 0 12px; }
    .toolbar-spacer { flex: 1; }
    .toolbar-path {
      min-width: min(220px, 44vw);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
    }

    .app-shell { flex: 1; min-height: 0; display: flex; }
    .sidebar {
      width: 220px;
      min-width: 180px;
      border-right: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      padding: 12px;
      overflow: auto;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid transparent;
      cursor: pointer;
      color: var(--muted);
    }
    .nav-item.active, .nav-item:hover {
      color: var(--text);
      border-color: rgba(255,159,90,0.28);
      background: rgba(255,159,90,0.08);
    }
    .main-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(255,255,255,0.01); }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .breadcrumbs::-webkit-scrollbar { display: none; }
    .crumb {
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      color: var(--muted);
    }
    .crumb:hover { border-color: rgba(255,159,90,0.28); color: var(--text); background: rgba(255,159,90,0.08); }
    .file-list-wrap { position: relative; flex: 1; min-height: 0; overflow: auto; }
    .file-head, .file-row {
      display: grid;
      grid-template-columns: minmax(240px, 1.9fr) 1fr 0.8fr 0.7fr;
      gap: 12px;
      align-items: center;
      padding: 0 16px;
      min-width: 720px;
    }
    .file-head {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 48px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(11, 10, 15, 0.86);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 11px;
    }
    .file-head button {
      all: unset;
      cursor: pointer;
      padding: 10px 0;
      color: inherit;
    }
    .file-row {
      min-height: 54px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: default;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .file-row:hover { background: rgba(255,255,255,0.03); }
    .file-row.selected { background: rgba(255,159,90,0.10); }
    .file-cell {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .file-name { display: flex; align-items: center; gap: 10px; color: var(--text); }
    .file-muted { color: var(--muted); }

    .editor-shell, .browser-shell, .viewer-shell, .settings-shell, .archive-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .editor-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
    .editor-main.html-mode { grid-template-columns: 1fr 1fr; }
    .editor-text {
      width: 100%;
      height: 100%;
      padding: 18px;
      resize: none;
      border: 0;
      outline: none;
      background: rgba(7,7,11,0.55);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
    }
    .editor-preview, .browser-frame, .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
    .table-view { flex: 1; min-height: 0; overflow: auto; background: rgba(7,7,11,0.35); }
    .sheet-table { min-width: 100%; border-collapse: collapse; }
    .sheet-table td, .sheet-table th {
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0;
      min-width: 140px;
    }
    .sheet-input {
      width: 100%;
      min-height: 42px;
      border: 0;
      outline: none;
      background: transparent;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .segmented {
      display: inline-flex;
      gap: 8px;
      padding: 4px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    .seg-btn {
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 12px;
    }
    .seg-btn.active { background: rgba(255,159,90,0.14); border-color: rgba(255,159,90,0.32); }

    .browser-shell .toolbar { gap: 8px; }
    .browser-status { font-size: 11px; color: var(--muted); padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.07); }
    .home-splash {
      min-height: 100%;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,159,90,0.25), transparent 24%),
        radial-gradient(circle at 84% 24%, rgba(125,211,199,0.20), transparent 22%),
        linear-gradient(135deg, #0a0810, #14101b 50%, #0a0a0f 100%);
      color: #f4ead8;
      padding: 36px;
      font-family: var(--font-ui);
    }
    .home-splash h1 { font-family: var(--font-serif); font-size: 52px; margin: 0 0 12px; font-weight: 400; }
    .home-splash p { max-width: 760px; line-height: 1.8; color: #d7c3aa; }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 26px; }
    .home-card { border: 1px solid rgba(255,255,255,0.09); border-radius: 22px; padding: 16px; background: rgba(255,255,255,0.04); }

    .viewer-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 55%), rgba(0,0,0,0.25);
      overflow: auto;
    }
    .viewer-stage img {
      max-width: 100%;
      max-height: 100%;
      transform-origin: center center;
      transition: transform 160ms ease;
      filter: drop-shadow(0 20px 50px rgba(0,0,0,0.45));
    }
    .media-element { max-width: 100%; max-height: 100%; }
    .generic-text {
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 18px;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.7;
      background: rgba(7,7,11,0.55);
      white-space: pre-wrap;
    }

    .calculator {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      background: radial-gradient(circle at top, rgba(255,159,90,0.07), transparent 30%), transparent;
    }
    .calc-display {
      padding: 22px 18px 8px;
      text-align: right;
      font-family: var(--font-mono);
    }
    .calc-expression { color: var(--muted); min-height: 24px; font-size: 14px; }
    .calc-result { font-size: clamp(28px, 6vw, 48px); word-break: break-all; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 18px; }
    .calc-key {
      min-height: 58px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      font-size: 16px;
    }
    .calc-key.op { background: rgba(255,159,90,0.11); }
    .calc-key.eq { background: linear-gradient(180deg, rgba(255,159,90,0.22), rgba(242,208,107,0.18)); }

    .paint-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .paint-stage { flex: 1; min-height: 0; position: relative; background: #fff; overflow: auto; }
    .paint-canvas { display: block; background: white; touch-action: none; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }

    .settings-shell { overflow: auto; }
    .settings-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; padding: 16px; }
    .settings-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,0.03);
      padding: 16px;
    }

    function escapeHtml(text = '') {
      return String(text)

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizePath(input = '/') {
      const raw = String(input || '/').replace(/\\/g, '/').trim();
      const parts = [];
      const source = raw.startsWith('/') ? raw : `/${raw}`;
      for (const part of source.split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') parts.pop(); else parts.push(part);
      }
      return '/' + parts.join('/');
    }

    function dirname(path) {
      path = normalizePath(path);
      if (path === '/') return '/';
      const parts = path.split('/').filter(Boolean);
      parts.pop();
      return parts.length ? '/' + parts.join('/') : '/';
    }

    function basename(path) {
      path = normalizePath(path);
      if (path === '/') return '/';
      return path.split('/').filter(Boolean).pop() || '/';
    }

    function joinPath(...parts) {
      return normalizePath(parts.join('/'));

      const idx = base.lastIndexOf('.');

    }

    function stem(path) {
      const base = basename(path);
      if (base.endsWith('.tar.gz')) return base.slice(0, -7);

      return idx === -1 ? base : base.slice(0, idx);

    function isSubPath(candidate, parent) {

    function formatBytes(bytes = 0) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / Math.pow(1024, i)).toFixed(i < 2 ? 0 : 1)} ${units[i]}`;
    }

    function formatDate(ts) {

    function mimeFromName(name = '') {

    function fileKindIcon(entry) {
      if (entry.kind === 'dir') return 'folder';
      const ext = extname(entry.name || entry.path || '');
      if (TABLE_EXTS.has(ext)) return 'table';
      if (IMAGE_EXTS.has(ext)) return 'image';
      if (AUDIO_EXTS.has(ext)) return 'audio';
      if (VIDEO_EXTS.has(ext)) return 'video';
      if (PDF_EXTS.has(ext)) return 'pdf';
      if (ARCHIVE_EXTS.has(ext) || ext === 'tar.gz') return 'archive';
      if (TEXT_EXTS.has(ext)) return ext === 'html' || ext === 'htm' ? 'browser' : 'code';
      return 'file';
    }

    function setCookie(name, value, days = 365) {
      const maxAge = days * 24 * 60 * 60;
      document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; path=/; max-age=${maxAge}; SameSite=Lax`;
    }

    function getCookie(name) {
      const key = encodeURIComponent(name) + '=';
      const row = document.cookie.split('; ').find(r => r.startsWith(key));
      return row ? decodeURIComponent(row.slice(key.length)) : null;
    }

    const tinyStore = {
      get(key) {
        try {
          const ls = localStorage.getItem(key);
          if (ls) return ls;
        } catch {}
        return getCookie(key);
      },
      set(key, value) {
        try { localStorage.setItem(key, value); } catch {}
        setCookie(key, value);
      },
      clear(key) {
        try { localStorage.removeItem(key); } catch {}
        setCookie(key, '', -1);
      }
    };

    function toast(title, detail = '', timeout = 3200) {
      const node = el('div', 'toast', `<div>${escapeHtml(title)}</div>${detail ? `<div class="muted">${escapeHtml(detail)}</div>` : ''}`);
      $('#toastStack').appendChild(node);
      setTimeout(() => node.remove(), timeout);
    }

    async function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('noir-grid-os', 3);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
          if (!db.objectStoreNames.contains('mounts')) db.createObjectStore('mounts', { keyPath: 'mountPath' });
          if (!db.objectStoreNames.contains('fsnodes')) db.createObjectStore('fsnodes', { keyPath: 'path' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbRequest(req) {
      return new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbStore(storeName, mode = 'readonly') {
      return state.db.transaction(storeName, mode).objectStore(storeName);
    }

    async function idbGet(storeName, key) {
      return idbRequest(idbStore(storeName).get(key));
    }

    async function idbSet(storeName, key, value) {
      const store = idbStore(storeName, 'readwrite');
      const req = store.put(value, key);
      return idbRequest(req);
    }

    async function idbPut(storeName, value) {
      const store = idbStore(storeName, 'readwrite');
      return idbRequest(store.put(value));
    }

    async function idbDelete(storeName, key) {
      const store = idbStore(storeName, 'readwrite');
      return idbRequest(store.delete(key));
    }

    async function idbGetAll(storeName) {
      return idbRequest(idbStore(storeName).getAll());
    }

    async function idbClear(storeName) {
      return idbRequest(idbStore(storeName, 'readwrite').clear());
    }

    class AbstractBackend {
      async copy(src, dst) {
        const info = await this.stat(src);
        if (info.kind === 'dir') {
          await this.mkdir(dst, { recursive: true });
          const entries = await this.readdir(src);
          for (const entry of entries) {
            await this.copy(joinPath(src, entry.name), joinPath(dst, entry.name));
          }
        } else {
          const blob = await this.readFile(src, 'blob');
          await this.writeFile(dst, blob, { type: info.type || mimeFromName(dst) });
        }
      }
      async remove(path) {
        const info = await this.stat(path);
        if (info.kind === 'dir') return this.rmdir(path, { recursive: true });
        return this.unlink(path);
      }
      async rename(src, dst) {
        await this.copy(src, dst);
        await this.remove(src);
      }
    }

    class HandleTreeBackend extends AbstractBackend {
      constructor(rootHandle, label = 'HandleFS') {
        super();
        this.root = rootHandle;
        this.label = label;
      }
      async init() {
        return true;
      }
      parts(path) {
        return normalizePath(path).split('/').filter(Boolean);
      }
      async getDirHandle(path, create = false) {
        const parts = this.parts(path);
        let handle = this.root;
        for (const part of parts) {
          handle = await handle.getDirectoryHandle(part, { create });
        }
        return handle;
      }
      async getFileHandle(path, create = false) {
        const parent = await this.getDirHandle(dirname(path), create);
        return parent.getFileHandle(basename(path), { create });
      }
      async exists(path, ..._rest) {
        try { await this.stat(path); return true; } catch { return false; }
      }
      async mkdir(path, options = { recursive: true }, ..._rest) {
        const recursive = options?.recursive !== false;
        if (normalizePath(path) === '/') return;
        const parts = this.parts(path);
        if (!recursive && parts.length > 1) {
          await this.getDirHandle(dirname(path), false);
        }
        await this.getDirHandle(path, true);
      }
      async stat(path, ..._rest) {
        path = normalizePath(path);
        if (path === '/') return { kind: 'dir', name: '/', path, size: 0, type: 'folder', lastModified: 0 };
        const parent = await this.getDirHandle(dirname(path), false);
        const name = basename(path);
        try {
          const fh = await parent.getFileHandle(name);
          const file = await fh.getFile();
          return { kind: 'file', name, path, size: file.size, type: file.type || mimeFromName(name), lastModified: file.lastModified };
        } catch {}
        const dh = await parent.getDirectoryHandle(name);
        return { kind: 'dir', name, path, size: 0, type: 'folder', lastModified: 0 };
      }
      async readdir(path, ..._rest) {
        const dir = await this.getDirHandle(path, false);
        const out = [];
        for await (const [name, handle] of dir.entries()) {
          if (handle.kind === 'directory') {
            out.push({ name, path: joinPath(path, name), kind: 'dir', size: 0, type: 'folder', lastModified: 0 });
          } else {
            const file = await handle.getFile();
            out.push({ name, path: joinPath(path, name), kind: 'file', size: file.size, type: file.type || mimeFromName(name), lastModified: file.lastModified });
          }
        }
        return out;
      }
      async readFile(path, mode = 'text', ..._rest) {
        const handle = await this.getFileHandle(path, false);
        const file = await handle.getFile();
        if (mode === 'blob') return file;
        if (mode === 'arrayBuffer') return file.arrayBuffer();
        return file.text();
      }
      async writeFile(path, data, options = {}, ..._rest) {
        await this.mkdir(dirname(path), { recursive: true });
        const handle = await this.getFileHandle(path, true);
        const writer = await handle.createWritable();
        await writer.write(data instanceof Blob ? data : blobFromData(data, options?.type || mimeFromName(path)));
        await writer.close();
      }
      async unlink(path, ..._rest) {
        const parent = await this.getDirHandle(dirname(path), false);
        await parent.removeEntry(basename(path));
      }
      async rmdir(path, options = { recursive: true }, ..._rest) {
        if (normalizePath(path) === '/') throw new Error('无法删除根目录');
        const parent = await this.getDirHandle(dirname(path), false);
        await parent.removeEntry(basename(path), { recursive: options?.recursive !== false });
      }
    }

    class IDBFSBackend extends AbstractBackend {
      constructor() { super(); }
      async init() {
        if (!(await this.exists('/'))) {
          await idbPut('fsnodes', { path: '/', kind: 'dir', lastModified: Date.now(), mime: 'folder', blob: null });
        }
      }
      async all() {
        return idbGetAll('fsnodes');
      }
      async record(path) {
        return idbGet('fsnodes', normalizePath(path));
      }
      async exists(path, ..._rest) {
        return !!(await this.record(path));
      }
      async mkdir(path, options = { recursive: true }, ..._rest) {
        path = normalizePath(path);
        if (path === '/') return;
        const parts = path.split('/').filter(Boolean);
        let cur = '';
        for (let i = 0; i < parts.length; i++) {
          cur = normalizePath(cur + '/' + parts[i]);
          const exists = await this.record(cur);
          if (!exists) {
            if (options?.recursive === false && i < parts.length - 1) throw new Error('父目录不存在');
            await idbPut('fsnodes', { path: cur, kind: 'dir', lastModified: Date.now(), mime: 'folder', blob: null });
          }
        }
      }
      async stat(path, ..._rest) {
        path = normalizePath(path);
        const rec = await this.record(path);
        if (!rec) throw new Error('路径不存在');
        return { kind: rec.kind, name: basename(path), path, size: rec.blob ? rec.blob.size : 0, type: rec.mime || (rec.kind === 'dir' ? 'folder' : mimeFromName(path)), lastModified: rec.lastModified || 0 };
      }
      async readdir(path, ..._rest) {
        path = normalizePath(path);
        const items = await this.all();
        const out = [];
        for (const rec of items) {
          if (rec.path === path || rec.path === '/') continue;
          if (dirname(rec.path) === path) {
            out.push({ name: basename(rec.path), path: rec.path, kind: rec.kind, size: rec.blob ? rec.blob.size : 0, type: rec.mime || (rec.kind === 'dir' ? 'folder' : mimeFromName(rec.path)), lastModified: rec.lastModified || 0 });
          }
        }
        return out;
      }
      async readFile(path, mode = 'text', ..._rest) {
        const rec = await this.record(path);
        if (!rec || rec.kind !== 'file') throw new Error('文件不存在');
        const blob = rec.blob || new Blob([]);
        if (mode === 'blob') return blob;
        if (mode === 'arrayBuffer') return blob.arrayBuffer();
        return blob.text();
      }
      async writeFile(path, data, options = {}, ..._rest) {
        path = normalizePath(path);
        await this.mkdir(dirname(path), { recursive: true });
        const blob = data instanceof Blob ? data : blobFromData(data, options?.type || mimeFromName(path));
        await idbPut('fsnodes', { path, kind: 'file', lastModified: Date.now(), mime: blob.type || options?.type || mimeFromName(path), blob });
      }
      async unlink(path, ..._rest) {
        const rec = await this.record(path);
        if (!rec || rec.kind !== 'file') throw new Error('文件不存在');
        await idbDelete('fsnodes', normalizePath(path));
      }
      async rmdir(path, options = { recursive: true }, ..._rest) {
        path = normalizePath(path);
        if (path === '/') throw new Error('无法删除根目录');
        const rec = await this.record(path);
        if (!rec || rec.kind !== 'dir') throw new Error('文件夹不存在');
        const all = await this.all();
        const descendants = all.filter(item => item.path === path || item.path.startsWith(path + '/'));
        if (options?.recursive === false && descendants.length > 1) throw new Error('目录非空');
        for (const item of descendants) await idbDelete('fsnodes', item.path);
      }
    }

    class UnifiedFS {
      constructor(rootBackend) {
        this.root = rootBackend;
        this.mounts = [];
      }
      normalize(path) { return normalizePath(path); }
      dirname(path) { return dirname(path); }
      basename(path) { return basename(path); }
      join(...parts) { return joinPath(...parts); }
      extname(path) { return extname(path); }
      async init() {
        if (this.root.init) await this.root.init();
      }
      addMount(mountPath, backend, meta = {}) {
        mountPath = normalizePath(mountPath);
        this.mounts = this.mounts.filter(m => m.path !== mountPath);
        this.mounts.push({ path: mountPath, backend, meta });
        this.mounts.sort((a, b) => b.path.length - a.path.length);
      }
      removeMount(mountPath) {
        mountPath = normalizePath(mountPath);
        this.mounts = this.mounts.filter(m => m.path !== mountPath);
      }
      resolve(path) {
        path = normalizePath(path);
        const mount = this.mounts.find(m => path === m.path || path.startsWith(m.path + '/'));
        if (!mount) return { backend: this.root, path, mount: null };
        const sub = path.slice(mount.path.length) || '/';
        return { backend: mount.backend, path: normalizePath(sub), mount };
      }
      virtualMountChildren(path) {
        path = normalizePath(path);
        const out = [];
        for (const mount of this.mounts) {
          const parent = dirname(mount.path);
          if (parent === path) {
            out.push({ name: basename(mount.path), path: mount.path, kind: 'dir', size: 0, type: 'mount', lastModified: 0, mount: true });
          }
        }
        return out;
      }
      async exists(path, ...rest) {
        path = normalizePath(path);
        if (this.mounts.some(m => m.path === path)) return true;
        const { backend, path: sub } = this.resolve(path);
        return backend.exists(sub, ...rest);
      }
      async stat(path, ...rest) {
        path = normalizePath(path);
        const exact = this.mounts.find(m => m.path === path);
        if (exact) return { kind: 'dir', name: basename(path), path, size: 0, type: 'mount', lastModified: 0, mount: true };
        const { backend, path: sub } = this.resolve(path);
        const st = await backend.stat(sub, ...rest);
        return { ...st, path, name: basename(path) };
      }
      async readdir(path, ...rest) {
        path = normalizePath(path);
        const { backend, path: sub, mount } = this.resolve(path);
        let items = mount && path === mount.path ? await backend.readdir('/', ...rest) : await backend.readdir(sub, ...rest);
        items = items.map(item => ({ ...item, path: mount ? joinPath(mount.path, item.name) : item.path }));
        const virtuals = this.virtualMountChildren(path);
        const map = new Map();
        [...items, ...virtuals].forEach(item => map.set(item.path, item));
        return [...map.values()];
      }
      async mkdir(path, ...rest) {
        const { backend, path: sub } = this.resolve(path);
        return backend.mkdir(sub, ...(rest.length ? rest : [{ recursive: true }]));
      }
      async readFile(path, mode = 'text', ...rest) {
        const { backend, path: sub } = this.resolve(path);
        return backend.readFile(sub, mode, ...rest);
      }
      async writeFile(path, data, options = {}, ...rest) {
        const { backend, path: sub } = this.resolve(path);
        return backend.writeFile(sub, data, options, ...rest);
      }
      async unlink(path, ...rest) {
        const { backend, path: sub } = this.resolve(path);
        return backend.unlink(sub, ...rest);
      }
      async rmdir(path, ...rest) {
        const { backend, path: sub } = this.resolve(path);
        return backend.rmdir(sub, ...(rest.length ? rest : [{ recursive: true }]));
      }
      async remove(path, ...rest) {
        const { backend, path: sub } = this.resolve(path);
        return backend.remove(sub, ...rest);
      }
      async copy(src, dst, ...rest) {
        const from = this.resolve(src);
        const to = this.resolve(dst);
        if (from.backend === to.backend) return from.backend.copy(from.path, to.path, ...rest);
        const st = await this.stat(src);
        if (st.kind === 'dir') {
          await this.mkdir(dst, { recursive: true });
          const entries = await this.readdir(src);
          for (const entry of entries) await this.copy(joinPath(src, entry.name), joinPath(dst, entry.name));
        } else {
          const blob = await this.readFile(src, 'blob');
          await this.writeFile(dst, blob, { type: st.type || mimeFromName(dst) });
        }
      }
      async rename(src, dst, ...rest) {
        const from = this.resolve(src);
        const to = this.resolve(dst);
        if (from.backend === to.backend) return from.backend.rename(from.path, to.path, ...rest);
        await this.copy(src, dst);
        await this.remove(src);
      }
      async ensureUniquePath(targetPath) {
        targetPath = normalizePath(targetPath);
        if (!(await this.exists(targetPath))) return targetPath;
        const dir = dirname(targetPath);
        const base = basename(targetPath);
        const ext = extname(base);
        const head = ext ? base.slice(0, -(ext.length + 1)) : base;
        let index = 2;
        while (true) {
          const name = ext ? `${head} (${index}).${ext}` : `${head} (${index})`;
          const next = joinPath(dir, name);
          if (!(await this.exists(next))) return next;
          index++;
        }
      }
    }

      return new IDBFSBackend();
    }

    function rememberObjectUrl(key, url, single = false) {
      const old = state.objectUrls.get(key);
      if (single && old) {
        try { URL.revokeObjectURL(old); } catch {}
      }
      state.objectUrls.set(key, url);
      return url;
    }

    async function getBlobUrl(path) {
      const blob = await state.fs.readFile(path, 'blob');
      const url = URL.createObjectURL(blob);
      return rememberObjectUrl(`blob:${path}:${Date.now()}`, url);
    }

    function appName(appId) {

    async function restoreMounts() {
      const records = await idbGetAll('mounts');
      state.mountReminders = [];
      for (const rec of records) {
        try {
          const handle = rec.handle;
          if (!handle) continue;
          const perm = handle.queryPermission ? await handle.queryPermission({ mode: 'readwrite' }) : 'granted';
          if (perm === 'granted') {
            state.fs.addMount(rec.mountPath, new HandleTreeBackend(handle, 'LocalMount'), { name: rec.name, persisted: true, handle });
          } else {
            state.mountReminders.push(rec);
          }
        } catch (error) {
          console.warn(error);
          state.mountReminders.push(rec);
        }
      }
      if (state.mountReminders.length) {
        toast('检测到需要重新授权的本地挂载', '请在设置中重新挂载这些目录');
      }
    }

    async function mountLocalFolder() {
      if (!window.showDirectoryPicker) {
        toast('当前浏览器不支持目录挂载', '需要 File System Access API');
        return;
      }
      try {
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const name = handle.name || 'mounted';
        const mountPath = await state.fs.ensureUniquePath(`/mnt/local/${name}`);
        state.fs.addMount(mountPath, new HandleTreeBackend(handle, 'LocalMount'), { name, handle });
        await persistMountRecord(mountPath, basename(mountPath), handle);
        renderDesktop();
        renderStartMenu();
        toast('本地文件夹已挂载', mountPath);
      } catch (error) {
        if (error?.name !== 'AbortError') toast('挂载失败', error.message || '无法挂载该目录');
      }
    }

    function defaultDesktopPosition(index) {
      const columns = Math.max(1, Math.floor((window.innerWidth - 80) / 108));
      const col = index % columns;
      const row = Math.floor(index / columns);
      return { x: 22 + col * 100, y: 24 + row * 112 };
    }

    async function desktopItems() {
      const files = await state.fs.readdir('/Desktop');
      const fileItems = files.map(entry => ({ id: `path:${entry.path}`, kind: 'path', path: entry.path, name: entry.name, icon: fileKindIcon(entry) }));
      const shortcutItems = (state.prefs.shortcuts || []).map(item => ({ ...item, icon: APPS.find(app => app.id === item.app)?.icon || 'file' }));
      return [...shortcutItems, ...fileItems];
    }

    async function renderDesktop() {
      const items = await desktopItems();
      desktopIcons.innerHTML = '';
      items.forEach((item, index) => {
        const pos = state.prefs.desktopLayout[item.id] || defaultDesktopPosition(index);
        const node = el('div', `desktop-icon ${state.desktopSelection.has(item.id) ? 'selected' : ''}`, `
          <div class="glyph">${icon(item.icon || 'file', 'w-8 h-8')}</div>
          <div class="label">${escapeHtml(item.name)}</div>
        `);
        node.style.left = pos.x + 'px';
        node.style.top = pos.y + 'px';
        node.style.animationDelay = `${(index % 8) * 45}ms`;
        node.dataset.id = item.id;
        node.dataset.kind = item.kind;
        node.dataset.path = item.path || '';
        node.dataset.app = item.app || '';
        node.draggable = item.kind === 'path';
        bindDesktopIcon(node, item);
        desktopIcons.appendChild(node);
        if (item.kind === 'path') prepareDragExport(node, item.path);
      });
    }

    function setDesktopSelection(ids) {
      state.desktopSelection = new Set(ids);
      $$('.desktop-icon').forEach(node => node.classList.toggle('selected', state.desktopSelection.has(node.dataset.id)));
    }

    function openDesktopItem(item) {
      if (item.kind === 'app') {
        return openApp(item.app);
      }
      return openPath(item.path);
    }

    function bindDesktopIcon(node, item) {
      let startX = 0, startY = 0, origin = null, dragging = false;
      node.addEventListener('pointerdown', (e) => {
        hideMenus();
        if (e.button === 2) return;
        e.stopPropagation();
        node.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
        origin = state.prefs.desktopLayout[item.id] || { x: node.offsetLeft, y: node.offsetTop };
        dragging = false;
        if (!e.shiftKey && !e.metaKey && !e.ctrlKey && !state.desktopSelection.has(item.id)) {
          setDesktopSelection([item.id]);
        } else if ((e.metaKey || e.ctrlKey) && state.desktopSelection.has(item.id)) {
          const next = new Set(state.desktopSelection);
          next.delete(item.id);
          setDesktopSelection(next);
        } else if (e.metaKey || e.ctrlKey) {
          const next = new Set(state.desktopSelection);
          next.add(item.id);
          setDesktopSelection(next);
        }
      });
      node.addEventListener('pointermove', (e) => {
        if (!node.hasPointerCapture(e.pointerId)) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!dragging && Math.hypot(dx, dy) > 6) dragging = true;
        if (!dragging) return;
        const next = { x: Math.max(10, origin.x + dx), y: Math.max(10, origin.y + dy) };
        node.style.left = next.x + 'px';
        node.style.top = next.y + 'px';
        state.prefs.desktopLayout[item.id] = next;
      });
      node.addEventListener('pointerup', async (e) => {
        if (node.hasPointerCapture(e.pointerId)) node.releasePointerCapture(e.pointerId);
        if (dragging) {
          await savePrefs();
          return;
        }
        const now = Date.now();
        if (state.lastTapId === item.id && now - state.lastTap < 330) {
          state.lastTapId = '';
          openDesktopItem(item);
        } else {
          state.lastTap = now;
          state.lastTapId = item.id;
        }
      });
      node.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (!state.desktopSelection.has(item.id)) setDesktopSelection([item.id]);
        showContextMenu(e.clientX, e.clientY, desktopItemActions(item));
      });
      node.addEventListener('dragstart', (e) => {
        if (item.kind !== 'path') {
          e.preventDefault();
          return;
        }
        const selectedPaths = state.desktopSelection.size && state.desktopSelection.has(item.id)
          ? [...state.desktopSelection].filter(id => id.startsWith('path:')).map(id => id.replace(/^path:/, ''))
          : [item.path];
        e.dataTransfer.setData('application/x-webos-paths', JSON.stringify(selectedPaths));
        const downloadUrl = node.dataset.downloadurl;
        if (downloadUrl && selectedPaths.length === 1) {
          e.dataTransfer.setData('DownloadURL', downloadUrl);
          e.dataTransfer.effectAllowed = 'copyMove';
        }
      });
    }

    async function prepareDragExport(node, path) {
      try {
        const info = await state.fs.stat(path);
        if (info.kind !== 'file') return;
        const blob = await state.fs.readFile(path, 'blob');
        const url = URL.createObjectURL(blob);
        rememberObjectUrl(`drag:${path}:${Math.random().toString(36).slice(2)}`, url);
        node.dataset.downloadurl = `${info.type || 'application/octet-stream'}:${basename(path)}:${url}`;
      } catch {}
    }

    function setupDesktopSurface() {
      desktop.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.desktop-icon') || e.button === 2) return;
        hideMenus();
        const rect = desktop.getBoundingClientRect();
        const start = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        desktopSelection.style.display = 'block';
        desktopSelection.style.left = start.x + 'px';
        desktopSelection.style.top = start.y + 'px';
        desktopSelection.style.width = '0px';
        desktopSelection.style.height = '0px';
        const additive = e.metaKey || e.ctrlKey;
        const base = additive ? new Set(state.desktopSelection) : new Set();
        const move = (ev) => {
          const x = ev.clientX - rect.left;
          const y = ev.clientY - rect.top;
          const left = Math.min(start.x, x);
          const top = Math.min(start.y, y);
          const width = Math.abs(start.x - x);
          const height = Math.abs(start.y - y);
          Object.assign(desktopSelection.style, { left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
          const box = { left: rect.left + left, top: rect.top + top, right: rect.left + left + width, bottom: rect.top + top + height };
          const next = new Set(base);
          $$('.desktop-icon').forEach(iconNode => {
            const r = iconNode.getBoundingClientRect();
            const intersects = !(r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom);
            if (intersects) next.add(iconNode.dataset.id);
          });
          setDesktopSelection(next);
        };
        const up = async () => {
          desktopSelection.style.display = 'none';
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up, { once: true });
      });

      desktop.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.desktop-icon')) return;
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, [
          { label: '刷新桌面', icon: 'refresh', action: renderDesktop },
          { label: '新建文件夹', icon: 'plus', action: async () => { const name = await showPrompt({ title: '新建文件夹', value: '新建文件夹' }); if (name) { await state.fs.mkdir(await state.fs.ensureUniquePath(`/Desktop/${name}`), { recursive: true }); renderDesktop(); } } },
          { label: '上传文件到桌面', icon: 'upload', action: () => { state.uploadTarget = '/Desktop'; fileUploadInput.click(); } },
          { label: '上传文件夹到桌面', icon: 'mount', action: () => { state.uploadTarget = '/Desktop'; folderUploadInput.click(); } },
          { label: '更换壁纸', icon: 'image', action: () => wallpaperUploadInput.click() },
          { label: '挂载本地文件夹', icon: 'mount', action: mountLocalFolder },
          { type: 'divider' },
          { label: '全屏模式', icon: 'fullscreen', action: async () => { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); } }
        ]);
      });

      desktop.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });
      desktop.addEventListener('drop', async (e) => {
        e.preventDefault();
        await handleDropInto('/Desktop', e.dataTransfer, true);
      });
    }

    async function renamePath(path) {
      const name = await showPrompt({ title: '重命名', value: basename(path) });
      if (!name) return;
      const target = joinPath(dirname(path), name);
      if (normalizePath(path) === normalizePath(target)) return;
      const unique = await state.fs.ensureUniquePath(target);
      await state.fs.rename(path, unique);
      toast('已重命名', `${basename(path)} → ${basename(unique)}`);
      renderDesktop();
      rerenderExplorerWindows();
    }

    async function downloadPath(path) {
      const info = await state.fs.stat(path);
      if (info.kind !== 'file') {
        toast('文件夹暂不支持直接下载拖出', '可先压缩或进入目录逐项导出');
        return;
      }
      const blob = await state.fs.readFile(path, 'blob');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = basename(path);
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    }

    function createWindow({ title, iconName = 'file', width = 920, height = 620, appId = 'window' } = {}) {
      const id = `win-${Math.random().toString(36).slice(2, 9)}`;
      const mobile = window.innerWidth < 700;
      const win = el('div', 'window');
      win.dataset.id = id;
      win.dataset.appId = appId;
      const w = mobile ? Math.max(320, window.innerWidth - 16) : Math.min(width, window.innerWidth - 40);
      const h = mobile ? Math.max(300, window.innerHeight - 120) : Math.min(height, window.innerHeight - 70);
      const x = mobile ? 8 : Math.max(20, 34 + state.windows.size * 18);
      const y = mobile ? 10 : Math.max(16, 22 + state.windows.size * 18);
      Object.assign(win.style, { width: w + 'px', height: h + 'px', left: x + 'px', top: y + 'px', zIndex: ++state.z });
      win.innerHTML = `
        <div class="window-titlebar">
          <div class="window-title">${icon(iconName, 'w-5 h-5')}<div class="name">${escapeHtml(title)}</div></div>
          <div class="window-controls">
            <button class="control-btn" data-action="min">${icon('download', 'w-4 h-4')}</button>
            <button class="control-btn" data-action="max">${icon('fullscreen', 'w-4 h-4')}</button>
            <button class="control-btn close" data-action="close">${icon('delete', 'w-4 h-4')}</button>
          </div>
        </div>
        <div class="window-content"></div>
        <div class="resize-handle n" data-dir="n"></div>
        <div class="resize-handle s" data-dir="s"></div>
        <div class="resize-handle e" data-dir="e"></div>
        <div class="resize-handle w" data-dir="w"></div>
        <div class="resize-handle ne" data-dir="ne"></div>
        <div class="resize-handle nw" data-dir="nw"></div>
        <div class="resize-handle se" data-dir="se"></div>
        <div class="resize-handle sw" data-dir="sw"></div>
      `;
      windowLayer.appendChild(win);
      const body = $('.window-content', win);

        maximized: false,
        restoreRect: null,
        onClose: null,
        rerender: null
      };
      state.windows.set(id, obj);
      focusWindow(id);
      renderDock();
