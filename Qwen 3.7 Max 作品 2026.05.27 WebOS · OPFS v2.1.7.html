// Simple ZIP extractor (no dependencies)
async function extractZip(buffer, targetDir, statusEl) {
  // Minimal ZIP parser
  const dv = new DataView(buffer);
  const u8 = new Uint8Array(buffer);
  const dec = new TextDecoder('utf-8');
  
  // Find End of Central Directory
  let eocdOffset = -1;
  for (let i = buffer.byteLength - 22; i >= 0 && i > buffer.byteLength - 65557; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
  }
  if (eocdOffset < 0) throw new Error('无效的 ZIP 文件');
  
  const cdOffset = dv.getUint32(eocdOffset + 16, true);
  const cdCount = dv.getUint16(eocdOffset + 10, true);
  
  let pos = cdOffset;
  for (let i = 0; i < cdCount; i++) {
    if (dv.getUint32(pos, true) !== 0x02014b50) throw new Error('CD 错误');
    const compMethod = dv.getUint16(pos + 10, true);
    const compSize = dv.getUint32(pos + 20, true);
    const uncompSize = dv.getUint32(pos + 24, true);
    const nameLen = dv.getUint16(pos + 28, true);
    const extraLen = dv.getUint16(pos + 30, true);
    const commentLen = dv.getUint16(pos + 32, true);
    const localOffset = dv.getUint32(pos + 42, true);
    const fname = dec.decode(u8.subarray(pos + 46, pos + 46 + nameLen));
    
    // Read local file header
    const lpos = localOffset;
    const lNameLen = dv.getUint16(lpos + 26, true);
    const lExtraLen = dv.getUint16(lpos + 28, true);
    const dataStart = lpos + 30 + lNameLen + lExtraLen;
    const dataEnd = dataStart + compSize;
    
    const outPath = (targetDir === '/' ? '/' : targetDir + '/') + fname;
    
    if (fname.endsWith('/')) {
      await VFS.mkdir(outPath.slice(0, -1));
    } else if (compSize > 0 || uncompSize > 0) {
      if (statusEl) statusEl.textContent = '解压: ' + fname;
      let data;
      if (compMethod === 0) {
        data = buffer.slice(dataStart, dataEnd);
      } else if (compMethod === 8) {
        // Deflate - use DecompressionStream with 'deflate-raw'
        const comp = buffer.slice(dataStart, dataEnd);
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([comp]).stream().pipeThrough(ds);
        data = await new Response(stream).arrayBuffer();
      } else {
        throw new Error('不支持的压缩方法: ' + compMethod);
      }
      await VFS.writeFile(outPath, data);
    }
    
    pos += 46 + nameLen + extraLen + commentLen;
  }
}

  name: '计算器', icon: ICONS.calc, desc: '科学计算器',

          <button class="cb" data-v="3">3</button>
          <button class="cb op" data-v="+">+</button>
          <button class="cb" data-v="0" style="grid-column:span 2">0</button>
          <button class="cb" data-v=".">.</button>
          <button class="cb eq" data-v="=">=</button>
        </div>
      </div>
    `);
    win.body.appendChild(c);
    let cur = '0', prev = '', op = '';
    const d = c.querySelector('#calc-cur'), p = c.querySelector('#calc-prev');
    const render = () => { d.textContent = cur; p.textContent = prev ? `${prev} ${op}` : ''; };
    c.querySelectorAll('.cb').forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (v === 'C') { cur = '0'; prev = ''; op = ''; }
      else if (v === '±') cur = String(-parseFloat(cur));
      else if (v === '%') cur = String(parseFloat(cur) / 100);
      else if ('+-×÷'.includes(v)) {
        if (op && prev) {
          const r = calc(parseFloat(prev), parseFloat(cur), op);
          cur = String(r); prev = ''; op = '';
        }
        prev = cur; cur = '0'; op = v;
      }
      else if (v === '=') {
        if (op && prev) {
          cur = String(calc(parseFloat(prev), parseFloat(cur), op));
          prev = ''; op = '';
        }
      }
      else if (v === '.') { if (!cur.includes('.')) cur += '.'; }
      else { if (cur === '0') cur = v; else cur += v; }
      render();
    });
    const calc = (a, b, o) => o === '+' ? a+b : o === '-' ? a-b : o === '×' ? a*b : o === '÷' ? (b===0?0:a/b) : 0;
  }
});

    const colors = ['#000000','#ffffff','#ff5370','#ffcb6b','#c3e88d','#89ddff','#82aaff','#c792ea'];
    const c = el(`
      <div class="pnt">
        <div class="pnt-toolbar">
          <div class="pnt-tool active" data-tool="pen" title="画笔"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></div>
          <div class="pnt-tool" data-tool="eraser" title="橡皮"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14 2l8 8L11 21"/></svg></div>
          <input class="pnt-size" type="number" value="3" min="1" max="50">
          <div class="pnt-colors">${colors.map((co,i) => `<div class="pnt-color ${i===0?'active':''}" data-c="${co}" style="background:${co}"></div>`).join('')}</div>
          <span style="flex:1"></span>
          <div class="tb-btn" data-act="clear" title="清空"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18"/><path d="M8 6V4h8v2"/></svg></div>
          <div class="tb-btn" data-act="save" title="保存">${ICONS.download}</div>
        </div>
        <div class="pnt-body"><canvas></canvas></div>
      </div>
    `);
    win.body.appendChild(c);
    const canvas = c.querySelector('canvas'), ctx = canvas.getContext('2d');
    let tool = 'pen', color = '#000', size = 3, drawing = false;
    const resize = () => {
      const body = c.querySelector('.pnt-body');
      const r = body.getBoundingClientRect();
      const img = ctx.getImageData ? (canvas.width ? canvas.toDataURL() : null) : null;
      canvas.width = r.width; canvas.height = r.height;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0); i.src = img; }
    };
    setTimeout(resize, 50);
    window.addEventListener('resize', resize);
    
    c.querySelectorAll('.pnt-tool').forEach(t => t.onclick = () => {
      c.querySelectorAll('.pnt-tool').forEach(x => x.classList.remove('active'));
      t.classList.add('active'); tool = t.dataset.tool;
    });
    c.querySelectorAll('.pnt-color').forEach(co => co.onclick = () => {
      c.querySelectorAll('.pnt-color').forEach(x => x.classList.remove('active'));
      co.classList.add('active'); color = co.dataset.c;
    });
    c.querySelector('.pnt-size').oninput = (e) => size = +e.target.value;
    c.querySelector('[data-act=clear]').onclick = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); };
    c.querySelector('[data-act=save]').onclick = async () => {
      const name = await Dialog.prompt('保存文件名', `paint-${Date.now()}.png`);
      if (!name) return;
      canvas.toBlob(async (b) => {
        const buf = await b.arrayBuffer();
        await VFS.writeFile('/Pictures/' + name, buf);
        Toast.show('已保存到 /Pictures/', 'success');
        FE.refreshAll();
      });
    };
    
    const getPos = (e) => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    const draw = (e) => {
      if (!drawing) return;
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
      ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.stroke();
    };
    canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', () => drawing = false);
  }
});

// Helper: estimate directory sizes
async function estimateDirSize(path, depth = 0) {
  if (depth > 3) return [];
  const result = [];
  try {
    const entries = await VFS.readdir(path);
    let size = 0, files = 0;
    for (const e of entries) {
      if (e.type === 'file') { size += e.size || 0; files++; }
      else if (e.type === 'directory' && !e.mount) {
        const sub = await estimateDirSize(path === '/' ? '/' + e.name : path + '/' + e.name, depth + 1);
        for (const s of sub) { size += s.size; files += s.files; }
      }
    }
    if (files > 0) result.push({ path, size, files });
  } catch {}
  return result;
}

// Mount folder
async function mountFolder() {
  if (!('showDirectoryPicker' in window)) {
    Toast.show('此浏览器不支持 File System Access API', 'error');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const path = await VFS.mountLocal(handle);
    Toast.show(`已挂载: ${handle.name}`, 'success');
    FE.refreshAll();
  } catch (e) {
    if (e.name !== 'AbortError') Toast.show('挂载失败: ' + e.message, 'error');
  }
}

const Desktop = {
  icons: [],
  
  async init() {
    // Load positions from localStorage
    this.positions = JSON.parse(localStorage.getItem('webos-dicons') || '{}');
    this.layer = document.getElementById('desktop-icons-layer');
    this.layer.innerHTML = '';
    
    // Default apps
    const apps = [
      { id: 'explorer', name: '文件资源管理器', icon: ICONS.explorer, color: 'var(--accent-3)' },
      { id: 'notepad', name: '记事本', icon: ICONS.notepad, color: 'var(--accent)' },
      { id: 'browser', name: '浏览器', icon: ICONS.browser, color: 'var(--accent-3)' },
      { id: 'paint', name: '画板', icon: ICONS.paint, color: 'var(--accent-2)' },
      { id: 'calc', name: '计算器', icon: ICONS.calc, color: 'var(--warn)' },
      { id: 'table', name: '表格', icon: ICONS.table, color: 'var(--success)' },
      { id: 'settings', name: '设置', icon: ICONS.settings, color: 'var(--text-dim)' },
    ];
    
    // Desktop shortcuts (from /Desktop)
    let files = [];
    try { files = await VFS.readdir('/Desktop'); } catch {}
    
    // Render apps
    apps.forEach((a, i) => this._createIcon(a.id, a.name, a.icon, a.color, 'app', i));
    
    // Render desktop files
    files.forEach((f, i) => {
      const path = '/Desktop/' + f.name;
      const iconHtml = f.type === 'directory' ? ICONS.folder : getIconForFile(f.name);
      const color = f.type === 'directory' ? 'var(--accent-3)' : 'var(--text-dim)';
      this._createIcon(path, f.name, iconHtml, color, 'file', apps.length + i);
    });
  },
  
  _createIcon(id, name, icon, color, type, index) {
    const GRID = 90;
    const pos = this.positions[id] || { x: 16, y: 16 + index * GRID };
    const ic = el(`
      <div class="d-icon" data-id="${id}" data-type="${type}" style="left:${pos.x}px;top:${pos.y}px">
        <div class="ico" style="color:${color}">${icon}</div>
        <div class="lbl">${name}</div>
      </div>
    `);
    this.layer.appendChild(ic);
    this.icons.push({ el: ic, id, type, name });
    
    // Drag
    let drag = null, moved = false;
    const onDown = (e) => {
      if (e.button === 2) return;
      const t = e.touches ? e.touches[0] : e;
      drag = { sx: t.clientX, sy: t.clientY, x: pos.x, y: pos.y };
      moved = false;
    };
    const onMove = (e) => {
      if (!drag) return;
      const t = e.touches ? e.touches[0] : e;
      const dx = t.clientX - drag.sx, dy = t.clientY - drag.sy;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        if (!moved) { ic.classList.add('dragging'); moved = true; }
        ic.style.left = (drag.x + dx) + 'px';
        ic.style.top = (drag.y + dy) + 'px';
      }
    };
    const onUp = () => {
      if (drag && moved) {
        ic.classList.remove('dragging');
        pos.x = ic.offsetLeft; pos.y = ic.offsetTop;
        this.positions[id] = { x: pos.x, y: pos.y };
        localStorage.setItem('webos-dicons', JSON.stringify(this.positions));
      }
      drag = null;
    };
    ic.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    ic.addEventListener('touchstart', onDown, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: true });
    document.addEventListener('touchend', onUp);
    
    // Click / double-click
    ic.addEventListener('click', (e) => {
      if (moved) return;
      this.icons.forEach(i => i.el.classList.remove('selected'));
      ic.classList.add('selected');
    });
    ic.addEventListener('dblclick', (e) => {
      if (moved) return;
      if (type === 'app') Apps.launch(id);
      else openFile(id);
    });
    ic.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      const items = [];
      if (type === 'app') {
        items.push({ label: '打开', icon: ICONS.folderOpen, action: () => Apps.launch(id) });
      } else {
        items.push({ label: '打开', icon: ICONS.file, action: () => openFile(id) });
        items.push({ label: '删除', icon: ICONS.trash, action: async () => {
          if (await Dialog.confirm('删除', `删除 ${name}？`)) {
            await VFS.unlink(id);
            Toast.show('已删除', 'success');
            this.init();
          }
        }});
      }
      ContextMenu.show(e.clientX, e.clientY, items);
    });
  },
  
  refresh() { this.init(); }
};

const StartMenu = {
  init() {
    const menu = document.getElementById('start-menu');
    const appsList = document.getElementById('sm-apps');
    const search = document.getElementById('sm-search');
    
    const render = (filter = '') => {
      appsList.innerHTML = '';
      Apps.registry.forEach((app, id) => {
        if (filter && !app.name.toLowerCase().includes(filter.toLowerCase()) && 
            !(app.desc && app.desc.toLowerCase().includes(filter.toLowerCase()))) return;
        const item = el(`
          <div class="sm-app">
            <div style="color:var(--accent)">${app.icon}</div>
            <div class="sm-app-info">
              <div class="sm-app-name">${app.name}</div>
              <div class="sm-app-desc">${app.desc || ''}</div>
            </div>
          </div>
        `);
        item.onclick = () => {
          Apps.launch(id);
          menu.classList.remove('active');
          search.value = '';
        };
        appsList.appendChild(item);
      });
    };
    
    render();
    search.addEventListener('input', (e) => render(e.target.value));
    
    document.getElementById('start-btn').onclick = (e) => {
      e.stopPropagation();
      menu.classList.toggle('active');
      if (menu.classList.contains('active')) { search.focus(); search.select(); }
    };
    
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && !e.target.closest('#start-btn')) {
        menu.classList.remove('active');
      }
    });
    
    document.getElementById('sm-mount').onclick = () => { menu.classList.remove('active'); mountFolder(); };
    document.getElementById('sm-power').onclick = async () => {
      if (await Dialog.confirm('重新加载', '刷新页面？')) location.reload();
    };
  }
};

function setupDesktopCtx() {
  const desktop = document.getElementById('desktop');
  desktop.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.d-icon') || e.target.closest('.win')) return;
    e.preventDefault();
    ContextMenu.show(e.clientX, e.clientY, [
      { label: '刷新', icon: ICONS.refresh, shortcut: 'F5', action: () => Desktop.refresh() },
      'sep',
      { label: '新建文件夹到桌面', icon: ICONS.folder, action: async () => {
        const name = await Dialog.prompt('文件夹名', '新文件夹');
        if (name) { await VFS.mkdir('/Desktop/' + name); Desktop.refresh(); }
      }},
      { label: '新建文件到桌面', icon: ICONS.newFile, action: async () => {
        const name = await Dialog.prompt('文件名', '新文件.txt');
        if (name) { await VFS.writeFile('/Desktop/' + name, ''); Desktop.refresh(); }
      }},
      'sep',
      { label: '上传文件到桌面', icon: ICONS.upload, action: () => {
        const inp = el('<input type="file" multiple style="display:none">');
        inp.onchange = async () => {
          for (const f of inp.files) {
            await VFS.writeFile('/Desktop/' + f.name, await f.arrayBuffer());
          }
          Toast.show('已上传', 'success');
          Desktop.refresh();
          inp.remove();
        };
        document.body.appendChild(inp); inp.click();
      }},
      'sep',
      { label: '挂载本地文件夹', icon: ICONS.mount, action: mountFolder },
      { label: '壁纸设置', icon: ICONS.image, action: () => Apps.launch('settings', { sec: 'wallpaper' }) },
      'sep',
      { label: '全屏', icon: ICONS.fullscreen, action: () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }},
    ]);
  });
  
  // Desktop drop
  desktop.addEventListener('dragover', (e) => {
    if (e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      desktop.classList.add('drop-hover');
    }
  });
  desktop.addEventListener('dragleave', (e) => {
    if (e.target === desktop || !desktop.contains(e.relatedTarget)) desktop.classList.remove('drop-hover');
  });
  desktop.addEventListener('drop', async (e) => {
    desktop.classList.remove('drop-hover');
    if (e.dataTransfer.files.length > 0) {
      e.preventDefault();
      for (const f of e.dataTransfer.files) {
        await VFS.writeFile('/Desktop/' + f.name, await f.arrayBuffer());
      }
      Toast.show(`已上传 ${e.dataTransfer.files.length} 个文件`, 'success');
      Desktop.refresh();
    }
  });
  
  // Desktop click deselect
  desktop.addEventListener('click', (e) => {
    if (e.target === desktop || e.target.id === 'desktop-icons-layer') {
      document.querySelectorAll('.d-icon.selected').forEach(i => i.classList.remove('selected'));
    }
  });
}

// ============================================================
// Selection Box (Desktop)
// ============================================================
function setupSelectionBox() {
  const desktop = document.getElementById('desktop');
  let box = null, start = null;
  desktop.addEventListener('mousedown', (e) => {
    if (e.target !== desktop && e.target.id !== 'desktop-icons-layer') return;
    start = { x: e.clientX, y: e.clientY };
    box = el('<div class="sel-box"></div>');
    document.body.appendChild(box);
  });
  document.addEventListener('mousemove', (e) => {
    if (!box || !start) return;
    const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
    const w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    // Select icons in box
    const br = box.getBoundingClientRect();
    document.querySelectorAll('.d-icon').forEach(ic => {
      const ir = ic.getBoundingClientRect();
      const overlap = !(ir.right < br.left || ir.left > br.right || ir.bottom < br.top || ir.top > br.bottom);
      ic.classList.toggle('selected', overlap);
    });
  });
  document.addEventListener('mouseup', () => {
    if (box) { box.remove(); box = null; start = null; }
  });
}

// ============================================================
// Keyboard
// ============================================================
function setupKeys() {
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F5') { e.preventDefault(); Desktop.refresh(); }
  });
}

// ============================================================
// Clock
// ============================================================
function updateClock() {
  const c = document.getElementById('clock');
  const n = new Date();
  c.innerHTML = `
    <div style="font-weight:600">${n.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</div>
    <div style="font-size:10px;opacity:.7">${n.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' })}</div>
  `;
}

// ============================================================
// Wallpaper
// ============================================================
function applyWallpaper(css) {
  const d = document.getElementById('desktop');
  if (css.startsWith('url(') || css.startsWith('linear') || css.startsWith('radial')) {
    d.style.background = css;
  } else {
    d.style.background = css;
  }
  d.style.backgroundSize = 'cover';
  d.style.backgroundPosition = 'center';
}

async function loadWallpaper() {
  const saved = localStorage.getItem('webos-wallpaper');
  const custom = localStorage.getItem('webos-wallpaper-custom');
  if (custom) {
    document.getElementById('desktop').style.background = `url(${custom}) center/cover no-repeat`;
  }
  // Default is already set in CSS
}

// ============================================================
// Re-mount prompt
// ============================================================
async function promptRemount() {
  const saved = VFS.getSavedMounts();
  if (saved.length > 0 && 'showDirectoryPicker' in window) {
    const names = saved.map(s => s.name).join(', ');
    if (await Dialog.confirm('重新挂载', `检测到之前的挂载: ${names}\n\n是否重新授权？(需要逐个选择文件夹)`)) {
      for (const s of saved) {
        try {
          const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
          await VFS.mountLocal(handle);
        } catch (e) {
          if (e.name !== 'AbortError') break;
        }
      }
      Toast.show('挂载完成', 'success');
      FE.refreshAll();
    }
  }
}

// ============================================================
// Global drag-drop to window
// ============================================================
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

// ============================================================
// Init
// ============================================================
async function boot() {
  try {
    // Request persistence
    if (navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch {}
    }
    await VFS.init();
    await loadWallpaper();
    await Desktop.init();
    StartMenu.init();
    setupDesktopCtx();
    setupSelectionBox();
    setupKeys();
    updateClock();
    setInterval(updateClock, 1000);
    setTimeout(() => promptRemount(), 800);
    console.log('WebOS booted');
  } catch (e) {
    console.error(e);
    document.body.innerHTML = `
      <div style="padding:40px;color:#fff;font-family:monospace">
        <h2>WebOS 启动失败</h2>
        <p style="color:#ff7777">${e.message}</p>
        <p style="color:#888;margin-top:12px">请确保浏览器支持 OPFS (需要 Chrome/Edge 102+ 或 Firefox 111+)</p>
        <button onclick="location.reload()" style="margin-top:20px;padding:8px 16px;background:#82aaff;color:#000;border:none;border-radius:4px;cursor:pointer">重新加载</button>
      </div>
    `;
  }
}

boot();
</script>
