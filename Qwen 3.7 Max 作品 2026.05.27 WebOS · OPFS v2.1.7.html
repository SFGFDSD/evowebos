<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebOS · OPFS</title>
<style>
:root{
  --bg-0:#0e0f1a;
  --bg-1:#151726;
  --bg-2:#1c1f33;
  --bg-3:#242842;
  --bg-hover:#2c3052;
  --bg-active:rgba(130,170,255,.18);
  --border:#323756;
  --border-soft:#262a42;
  --text:#dfe4ff;
  --text-dim:#8f97bf;
  --text-mute:#5a6185;
  --accent:#82aaff;
  --accent-2:#c792ea;
  --accent-3:#89ddff;
  --success:#c3e88d;
  --warn:#ffcb6b;
  --danger:#ff5370;
  --shadow:0 10px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
  --radius:8px;
  --radius-lg:14px;
  --font-display:'JetBrains Mono','SF Mono','Menlo',monospace;
  --font-ui:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--font-ui);
  background:var(--bg-0);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  font-size:13px;
  line-height:1.45;
}
::selection{background:var(--accent);color:#000;}

/* Desktop */
#desktop{
  position:fixed;inset:0 0 48px 0;
  background:#0a0b14;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(130,170,255,.12), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(199,146,234,.10), transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(137,221,255,.05), transparent 60%),
    linear-gradient(135deg,#0a0b14 0%, #151726 50%, #0a0b14 100%);
  background-size:cover;
  background-position:center;
  overflow:hidden;
  transition:background-image .3s ease;
}
#desktop::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
}

/* Desktop Icons */
#desktop-icons-layer{position:absolute;inset:0;overflow:hidden;}
.desktop-icons{
  position:absolute;top:16px;left:16px;
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);
  gap:6px;padding:8px;
}
.d-icon{
  position:absolute;width:84px;height:84px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:6px 4px;border-radius:var(--radius);
  cursor:pointer;transition:background .15s ease, transform .15s ease;
}
.d-icon:hover{background:rgba(130,170,255,.08);}
.d-icon.selected{background:var(--bg-active);outline:1px solid rgba(130,170,255,.35);}
.d-icon.dragging{opacity:.4;transition:none;}
.d-icon .ico{width:36px;height:36px;color:var(--accent);flex-shrink:0;}
.d-icon .lbl{
  font-size:11px;text-align:center;color:var(--text);
  max-width:80px;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word;
}

/* Taskbar */
#taskbar{
  position:fixed;bottom:0;left:0;right:0;height:48px;
  background:rgba(14,15,26,.85);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:4px;z-index:10000;
}
.tb-start{
  width:40px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);cursor:pointer;transition:background .15s;
}
.tb-start:hover{background:var(--bg-hover);}
.tb-start svg{width:20px;height:20px;color:var(--accent);}
.tb-apps{flex:1;display:flex;gap:3px;overflow-x:auto;overflow-y:hidden;padding:4px 0;}
.tb-apps::-webkit-scrollbar{display:none;}
.tb-app{
  min-width:44px;max-width:180px;height:36px;padding:0 10px;
  display:flex;align-items:center;gap:8px;
  background:var(--bg-2);border:1px solid transparent;
  border-radius:var(--radius);cursor:pointer;transition:all .15s;
  position:relative;flex-shrink:0;
}
.tb-app:hover{background:var(--bg-hover);}
.tb-app.active{border-color:var(--accent);background:rgba(130,170,255,.12);}
.tb-app.minimized::after{
  content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--text-mute);
}
.tb-app.active::after{background:var(--accent);}
.tb-app svg{width:16px;height:16px;color:var(--text);flex-shrink:0;}
.tb-app .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-tray{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--text-dim);font-size:11px;}
.tb-clock{text-align:right;line-height:1.2;font-family:var(--font-display);}

/* Start Menu */
#start-menu{
  position:fixed;bottom:56px;left:8px;width:360px;max-height:520px;
  background:rgba(21,23,38,.96);backdrop-filter:blur(30px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);display:none;flex-direction:column;
  overflow:hidden;z-index:10001;
}
#start-menu.active{display:flex;animation:slideUp .2s cubic-bezier(.2,.9,.3,1.2);}
@keyframes slideUp{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
.sm-header{padding:14px 14px 10px;border-bottom:1px solid var(--border-soft);}
.sm-search{
  width:100%;padding:9px 12px;background:var(--bg-0);
  border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:13px;outline:none;font-family:inherit;
}
.sm-search:focus{border-color:var(--accent);}
.sm-apps{flex:1;overflow-y:auto;padding:6px;}
.sm-app{
  display:flex;align-items:center;gap:12px;padding:9px 10px;
  border-radius:var(--radius);cursor:pointer;transition:background .15s;
}
.sm-app:hover{background:var(--bg-hover);}
.sm-app svg{width:24px;height:24px;color:var(--accent);}
.sm-app-info{flex:1;min-width:0;}
.sm-app-name{font-size:13px;font-weight:500;}
.sm-app-desc{font-size:11px;color:var(--text-mute);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sm-footer{padding:8px 12px;border-top:1px solid var(--border-soft);display:flex;gap:6px;justify-content:flex-end;}
.sm-footer-btn{
  padding:6px 10px;font-size:11px;background:transparent;color:var(--text-dim);
  border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.sm-footer-btn:hover{background:var(--bg-hover);color:var(--text);}
.sm-footer-btn svg{width:14px;height:14px;}

/* Windows */
#windows-layer{position:fixed;inset:0 0 48px 0;pointer-events:none;z-index:1000;}
.win{
  position:absolute;background:var(--bg-1);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:320px;min-height:220px;
  pointer-events:auto;overflow:hidden;
  animation:winOpen .25s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes winOpen{from{opacity:0;transform:scale(.95) translateY(8px);}to{opacity:1;transform:none;}}
.win.max{
  top:0!important;left:0!important;
  width:100%!important;height:100%!important;
  border-radius:0;border:none;
}
.win.min{display:none;}
.win.focused{border-color:rgba(130,170,255,.4);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(130,170,255,.2);}
.win-head{
  height:36px;background:var(--bg-2);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 4px 0 12px;cursor:move;
  flex-shrink:0;gap:8px;
}
.win.focused .win-head{background:linear-gradient(90deg,var(--bg-2),rgba(130,170,255,.06));}
.win-title{flex:1;font-size:12px;font-weight:500;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.win.focused .win-title{color:var(--text);}
.win-ctrls{display:flex;}
.win-ctrl{
  width:32px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s;
}
.win-ctrl:hover{background:var(--bg-hover);}
.win-ctrl svg{width:12px;height:12px;stroke:var(--text-dim);fill:none;stroke-width:1.6;}
.win-ctrl.close:hover{background:var(--danger);}
.win-ctrl.close:hover svg{stroke:white;}
.win-body{flex:1;overflow:auto;position:relative;background:var(--bg-0);min-height:0;}
.win-resize{
  position:absolute;width:14px;height:14px;right:0;bottom:0;
  cursor:nwse-resize;z-index:10;
}
.win-resize::after{
  content:'';position:absolute;right:3px;bottom:3px;width:6px;height:6px;
  border-right:1.5px solid var(--text-mute);border-bottom:1.5px solid var(--text-mute);
}

/* Context Menu */
.ctx{
  position:fixed;background:rgba(21,23,38,.98);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);min-width:200px;padding:4px;z-index:30000;display:none;
}
.ctx.active{display:block;animation:ctxIn .12s ease;}
@keyframes ctxIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
.ctx-item{
  padding:7px 10px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;gap:10px;font-size:12.5px;transition:background .1s;
}
.ctx-item:hover{background:var(--bg-active);color:var(--accent);}
.ctx-item.disabled{opacity:.4;cursor:not-allowed;}
.ctx-item.disabled:hover{background:transparent;color:inherit;}
.ctx-item svg{width:15px;height:15px;color:var(--text-dim);flex-shrink:0;}
.ctx-item:hover svg{color:var(--accent);}
.ctx-sep{height:1px;background:var(--border-soft);margin:4px 6px;}
.ctx-item .shortcut{margin-left:auto;color:var(--text-mute);font-size:11px;font-family:var(--font-display);}

/* File Explorer */
.fe{display:flex;height:100%;flex-direction:column;}
.fe-toolbar{
  height:42px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0;
}
.tb-btn{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;cursor:pointer;transition:background .12s;color:var(--text-dim);
}
.tb-btn:hover{background:var(--bg-hover);color:var(--text);}
.tb-btn:disabled{opacity:.3;cursor:not-allowed;}
.tb-btn svg{width:16px;height:16px;}
.fe-breadcrumb{
  flex:1;display:flex;align-items:center;gap:2px;
  padding:5px 10px;background:var(--bg-0);border-radius:6px;
  font-size:12px;overflow-x:auto;min-width:0;font-family:var(--font-display);
}
.fe-breadcrumb::-webkit-scrollbar{display:none;}
.bc-item{color:var(--text-dim);cursor:pointer;white-space:nowrap;padding:2px 4px;border-radius:4px;}
.bc-item:hover{color:var(--accent);background:var(--bg-hover);}
.bc-sep{color:var(--text-mute);}
.fe-search{
  width:160px;padding:5px 10px;background:var(--bg-0);
  border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:12px;outline:none;font-family:inherit;
}
.fe-search:focus{border-color:var(--accent);}
.fe-main{display:flex;flex:1;min-height:0;}
.fe-side{
  width:180px;background:var(--bg-1);border-right:1px solid var(--border-soft);
  padding:8px 6px;overflow-y:auto;flex-shrink:0;
}
.fe-side-title{
  font-size:10px;font-weight:600;color:var(--text-mute);
  text-transform:uppercase;letter-spacing:.5px;padding:8px 10px 6px;
}
.side-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-radius:6px;cursor:pointer;font-size:12.5px;
  color:var(--text-dim);transition:background .12s;
}
.side-item:hover{background:var(--bg-hover);color:var(--text);}
.side-item.active{background:var(--bg-active);color:var(--accent);}
.side-item svg{width:15px;height:15px;flex-shrink:0;}
.side-item.mount{color:var(--success);}
.fe-content{flex:1;display:flex;flex-direction:column;min-width:0;}
.fe-list-head{
  display:grid;grid-template-columns:32px 1fr 130px 80px 90px;gap:8px;
  padding:6px 14px;font-size:11px;font-weight:600;color:var(--text-mute);
  text-transform:uppercase;letter-spacing:.4px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-1);
  flex-shrink:0;
}
.fe-list-head > div{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;}
.fe-list-head > div:hover{color:var(--text-dim);}
.fe-list-head .sort-ind{color:var(--accent);font-size:9px;}
.fe-list{flex:1;overflow-y:auto;padding:2px 0;}
.f-item{
  display:grid;grid-template-columns:32px 1fr 130px 80px 90px;gap:8px;
  padding:6px 14px;align-items:center;cursor:pointer;
  transition:background .1s;border-radius:0;
}
.f-item:hover{background:var(--bg-hover);}
.f-item.selected{background:var(--bg-active);}
.f-item.drop-target{background:rgba(195,232,141,.1);outline:1px dashed var(--success);}
.f-item svg{width:20px;height:20px;flex-shrink:0;}
.f-item-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f-item-meta{font-size:11.5px;color:var(--text-mute);font-family:var(--font-display);}
.f-item-editing{
  background:var(--bg-0)!important;padding:4px 8px!important;
}
.f-item-editing input{
  width:100%;padding:3px 6px;background:var(--bg-0);
  border:1px solid var(--accent);border-radius:4px;color:var(--text);
  font-size:13px;outline:none;font-family:inherit;
}
.fe-status{
  height:24px;background:var(--bg-1);border-top:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text-mute);
  gap:16px;flex-shrink:0;
}

/* Text Editor */
.ed{display:flex;flex-direction:column;height:100%;}
.ed-tabs{
  height:34px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;overflow-x:auto;flex-shrink:0;
}
.ed-tab{
  height:34px;padding:0 12px;display:flex;align-items:center;gap:6px;
  background:transparent;border-right:1px solid var(--border-soft);
  cursor:pointer;font-size:12px;color:var(--text-dim);white-space:nowrap;
}
.ed-tab.active{background:var(--bg-0);color:var(--text);}
.ed-tab .close{opacity:.5;font-size:14px;padding:0 2px;}
.ed-tab .close:hover{opacity:1;color:var(--danger);}
.ed-toolbar{
  height:36px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:4px;flex-shrink:0;
}
.ed-toolbar-sep{width:1px;height:20px;background:var(--border-soft);margin:0 4px;}
.ed-file-info{margin-left:auto;font-size:11px;color:var(--text-mute);font-family:var(--font-display);}
.ed-body{flex:1;display:flex;min-height:0;position:relative;}
.ed-gutter{
  width:48px;background:var(--bg-1);border-right:1px solid var(--border-soft);
  padding:12px 8px 12px 0;text-align:right;font-family:var(--font-display);
  font-size:12px;color:var(--text-mute);line-height:1.6;overflow:hidden;user-select:none;
}
.ed-area{flex:1;position:relative;overflow:auto;background:var(--bg-0);}
.ed-area textarea{
  width:100%;height:100%;background:transparent;color:var(--text);
  border:none;padding:12px 14px;
  font-family:var(--font-display);font-size:13px;line-height:1.6;
  resize:none;outline:none;tab-size:2;white-space:pre;overflow-wrap:normal;
}
.ed-split{display:flex;flex:1;min-height:0;}
.ed-preview{
  flex:1;background:white;position:relative;
}
.ed-preview iframe{width:100%;height:100%;border:none;}
.ed-preview-label{
  position:absolute;top:6px;right:10px;font-size:10px;color:#666;
  background:rgba(255,255,255,.9);padding:2px 6px;border-radius:4px;z-index:2;
  font-family:var(--font-display);
}

/* Spreadsheet */
.ss{display:flex;flex-direction:column;height:100%;}
.ss-tabs{
  height:34px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:4px;flex-shrink:0;
}
.ss-tab{
  padding:5px 12px;background:var(--bg-2);border-radius:6px;
  font-size:12px;cursor:pointer;color:var(--text-dim);
}
.ss-tab.active{background:var(--accent);color:#000;}
.ss-body{flex:1;overflow:auto;min-height:0;background:var(--bg-0);}
.ss-table{
  width:100%;border-collapse:collapse;font-family:var(--font-display);font-size:12px;
}
.ss-table th,.ss-table td{
  padding:6px 10px;border:1px solid var(--border-soft);text-align:left;white-space:nowrap;
}
.ss-table th{background:var(--bg-2);color:var(--text-dim);font-weight:600;position:sticky;top:0;}
.ss-table td[contenteditable]{cursor:text;user-select:text;}
.ss-table td[contenteditable]:focus{outline:1px solid var(--accent);background:var(--bg-1);}
.ss-table tr:nth-child(even) td{background:rgba(255,255,255,.015);}

/* Image Viewer */
.iv{height:100%;display:flex;flex-direction:column;background:#000;}
.iv-toolbar{
  height:36px;background:rgba(21,23,38,.9);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:4px;flex-shrink:0;
}
.iv-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.iv-stage img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s ease;}
.iv-info{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;font-family:var(--font-display);}

/* Media Player */
.mp{height:100%;display:flex;flex-direction:column;background:#000;}
.mp-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;}
.mp-stage audio,.mp-stage video{max-width:100%;max-height:100%;}

/* Calculator */
.calc{padding:16px;display:flex;flex-direction:column;gap:10px;height:100%;background:var(--bg-1);}
.calc-disp{
  background:var(--bg-0);padding:18px;border-radius:var(--radius);
  text-align:right;font-size:30px;font-weight:300;
  font-family:var(--font-display);min-height:72px;
  display:flex;align-items:center;justify-content:flex-end;overflow:hidden;
  border:1px solid var(--border-soft);
}
.calc-disp .prev{font-size:13px;color:var(--text-mute);margin-bottom:4px;}
.calc-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1;}
.cb{
  background:var(--bg-2);border:none;border-radius:var(--radius);
  color:var(--text);font-size:16px;cursor:pointer;transition:all .12s;
  font-family:var(--font-display);
}
.cb:hover{background:var(--bg-hover);}
.cb:active{transform:scale(.95);}
.cb.op{background:var(--accent);color:#000;font-weight:600;}
.cb.op:hover{background:#9abcff;}
.cb.eq{background:var(--accent-2);color:#000;font-weight:600;}
.cb.eq:hover{background:#d8aaff;}
.cb.fn{background:var(--bg-3);color:var(--text-dim);}

/* Settings */
.stg{display:flex;height:100%;}
.stg-side{width:180px;background:var(--bg-1);border-right:1px solid var(--border-soft);padding:8px 6px;overflow-y:auto;}
.stg-content{flex:1;padding:24px;overflow-y:auto;}
.stg-section{margin-bottom:28px;}
.stg-h{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text);}
.stg-sub{font-size:11px;color:var(--text-mute);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.stg-card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.stg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
.stg-row:last-child{margin-bottom:0;}
.stg-label{font-size:13px;color:var(--text);}
.stg-val{font-size:12px;color:var(--text-dim);font-family:var(--font-display);}
.storage-bar{height:24px;background:var(--bg-0);border-radius:6px;overflow:hidden;margin-bottom:10px;border:1px solid var(--border-soft);}
.storage-used{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;}
.stg-btn{
  background:var(--bg-2);color:var(--text);border:1px solid var(--border);
  padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:13px;
  transition:all .15s;font-family:inherit;
}
.stg-btn:hover{background:var(--bg-hover);border-color:var(--accent);}
.stg-btn.danger{background:var(--danger);border-color:var(--danger);color:#000;}
.stg-btn.danger:hover{background:#ff7a8f;}
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.wp-item{
  aspect-ratio:16/10;border-radius:6px;cursor:pointer;
  border:2px solid transparent;transition:all .15s;overflow:hidden;
  position:relative;background-size:cover;background-position:center;
}
.wp-item:hover{transform:translateY(-2px);}
.wp-item.active{border-color:var(--accent);}
.wp-item.upload{
  background:var(--bg-2);display:flex;align-items:center;justify-content:center;
  border:2px dashed var(--border);color:var(--text-mute);font-size:11px;
}
.wp-item.upload:hover{border-color:var(--accent);color:var(--accent);}

/* Browser */
.br{display:flex;flex-direction:column;height:100%;}
.br-toolbar{
  height:40px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0;
}
.br-url{
  flex:1;padding:6px 12px;background:var(--bg-0);
  border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:12px;outline:none;font-family:var(--font-display);
}
.br-url:focus{border-color:var(--accent);}
.br-body{flex:1;background:white;}
.br-body iframe{width:100%;height:100%;border:none;}

/* Paint */
.pnt{display:flex;flex-direction:column;height:100%;}
.pnt-toolbar{
  height:44px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0;
}
.pnt-tool{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-2);border-radius:6px;cursor:pointer;
  border:1px solid transparent;
}
.pnt-tool:hover{background:var(--bg-hover);}
.pnt-tool.active{border-color:var(--accent);background:var(--bg-active);}
.pnt-tool svg{width:16px;height:16px;}
.pnt-colors{display:flex;gap:3px;}
.pnt-color{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.pnt-color.active{border-color:var(--text);}
.pnt-size{width:60px;padding:4px 6px;background:var(--bg-0);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;outline:none;}
.pnt-body{flex:1;background:#fff;overflow:hidden;cursor:crosshair;}
.pnt-body canvas{display:block;}

/* Dialogs */
.dlg-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  z-index:50000;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.dlg{
  background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);min-width:360px;max-width:500px;overflow:hidden;
  animation:dlgIn .2s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes dlgIn{from{opacity:0;transform:scale(.95) translateY(8px);}to{opacity:1;transform:none;}}
.dlg-head{padding:14px 18px;border-bottom:1px solid var(--border-soft);}
.dlg-title{font-size:15px;font-weight:600;}
.dlg-body{padding:18px;}
.dlg-body input[type=text]{
  width:100%;padding:9px 12px;background:var(--bg-0);
  border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:13px;outline:none;font-family:inherit;
}
.dlg-body input[type=text]:focus{border-color:var(--accent);}
.dlg-body label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;}
.dlg-btn{
  padding:8px 16px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-2);color:var(--text);font-size:12.5px;cursor:pointer;font-family:inherit;
}
.dlg-btn:hover{background:var(--bg-hover);}
.dlg-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
.dlg-btn.primary:hover{background:#9abcff;}

/* Toast */
.toast-layer{position:fixed;top:16px;right:16px;z-index:60000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{
  background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;box-shadow:var(--shadow);max-width:320px;pointer-events:auto;
  display:flex;align-items:center;gap:10px;font-size:12.5px;
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1.1);
  border-left:3px solid var(--accent);
}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.toast.warn{border-left-color:var(--warn);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
.toast.out{animation:toastOut .2s ease forwards;}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}
.toast svg{width:16px;height:16px;flex-shrink:0;}

/* Selection box */
.sel-box{
  position:fixed;border:1px solid var(--accent);
  background:rgba(130,170,255,.08);pointer-events:none;z-index:9999;
}

/* Drag overlay */
.drag-ghost{
  position:fixed;pointer-events:none;z-index:100000;
  background:var(--bg-2);border:1px solid var(--accent);
  border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);
  box-shadow:var(--shadow);white-space:nowrap;
}

/* Desktop drop zone highlight */
#desktop.drop-hover::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:rgba(130,170,255,.05);border:2px dashed var(--accent);
  animation:pulse 1s ease infinite;
}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

/* Mobile */
@media (max-width:768px){
  #taskbar{height:56px;}
  #desktop{bottom:56px;}
  #windows-layer{bottom:56px;}
  .tb-app .nm{display:none;}
  .tb-app{min-width:40px;padding:0 8px;}
  .win{min-width:280px!important;min-height:200px!important;}
  .fe-side{width:140px;}
  .fe-list-head,.f-item{grid-template-columns:28px 1fr 80px;}
  .fe-list-head > div:nth-child(4),.fe-list-head > div:nth-child(5),
  .f-item > div:nth-child(4),.f-item > div:nth-child(5){display:none;}
  .fe-search{width:100px;}
  .ed-gutter{width:32px;font-size:10px;}
}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid var(--bg-0);}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute);}
::-webkit-scrollbar-corner{background:transparent;}

// ============================================================
// VFS: Unified File System (OPFS + Local Mounts)
// ============================================================
const VFS = {
  opfsRoot: null,
  mounts: new Map(), // path -> {handle, name}
  clipboard: null,
  
  async init() {
    this.opfsRoot = await navigator.storage.getDirectory();
    // Load mount metadata from IndexedDB
    await this._loadMountMeta();
    // Ensure default dirs
    await this.mkdir('/Documents');
    await this.mkdir('/Pictures');
    await this.mkdir('/Downloads');
    await this.mkdir('/Desktop');
    await this.mkdir('/mnt');
    console.log('VFS ready');
  },
  
  _idb() {
    return new Promise((res, rej) => {
      const req = indexedDB.open('webos-meta', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('meta');
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  },
  
  async _loadMountMeta() {
    try {
      const db = await this._idb();
      const tx = db.transaction('meta', 'readonly');
      const req = tx.objectStore('meta').get('mounts');
      await new Promise(r => { req.onsuccess = r; req.onerror = r; });
      this._savedMounts = req.result || [];
    } catch { this._savedMounts = []; }
  },
  
  async _saveMountMeta() {
    try {
      const db = await this._idb();
      const tx = db.transaction('meta', 'readwrite');
      const data = Array.from(this.mounts.entries()).map(([path, m]) => ({
        path, name: m.name
      }));
      tx.objectStore('meta').put(data, 'mounts');
    } catch {}
  },
  
  getSavedMounts() { return this._savedMounts || []; },
  
  // Parse path, return {mount, subpath} or null for OPFS
  _resolve(path) {
    if (!path.startsWith('/')) path = '/' + path;
    // Check mounts (longest prefix match)
    let match = null, matchLen = 0;
    for (const [mp, m] of this.mounts.entries()) {
      if (path === mp || path.startsWith(mp + '/')) {
        if (mp.length > matchLen) { match = { mount: m, mountPath: mp }; matchLen = mp.length; }
      }
    }
    if (match) {
      const sub = path.slice(matchLen) || '/';
      return { mount: match.mount, subpath: sub };
    }
    return null;
  },
  
  // Get OPFS directory handle for given path
  async _opfsDir(path, create = false) {
    let h = this.opfsRoot;
    const parts = path.split('/').filter(Boolean);
    for (const p of parts) {
      h = await h.getDirectoryHandle(p, { create });
    }
    return h;
  },
  
  async _localDir(handle, subpath, create = false) {
    let h = handle;
    const parts = subpath.split('/').filter(Boolean);
    for (const p of parts) {
      h = await h.getDirectoryHandle(p, { create });
    }
    return h;
  },
  
  // Public API — all work with both OPFS and local paths uniformly
  async stat(path) {
    if (path === '/' || path === '') {
      return { type: 'directory', size: 0, modified: Date.now(), name: '' };
    }
    const res = this._resolve(path);
    const parts = path.split('/').filter(Boolean);
    const name = parts[parts.length - 1];
    const parentPath = '/' + parts.slice(0, -1).join('/');
    
    try {
      let parentHandle;
      if (res) {
        parentHandle = res.subpath === '/' 
          ? res.mount.handle
          : await this._localDir(res.mount.handle, res.subpath.split('/').slice(0, -1).join('/') || '/');
        const entryName = res.subpath.split('/').filter(Boolean).pop();
        if (!entryName) return { type: 'directory', size: 0, modified: Date.now(), name };
        try {
          const dh = await parentHandle.getDirectoryHandle(entryName);
          return { type: 'directory', size: 0, modified: Date.now(), name };
        } catch {
          const fh = await parentHandle.getFileHandle(entryName);
          const f = await fh.getFile();
          return { type: 'file', size: f.size, modified: f.lastModified, name };
        }
      } else {
        parentHandle = await this._opfsDir(parentPath);
        try {
          await parentHandle.getDirectoryHandle(name);
          return { type: 'directory', size: 0, modified: Date.now(), name };
        } catch {
          const fh = await parentHandle.getFileHandle(name);
          const f = await fh.getFile();
          return { type: 'file', size: f.size, modified: f.lastModified, name };
        }
      }
    } catch (e) {
      throw new Error('Path not found: ' + path);
    }
  },
  
  async readdir(path = '/') {
    const entries = [];
    
    if (path === '/') {
      // Show OPFS root entries
      for await (const [name, handle] of this.opfsRoot.entries()) {
        const st = handle.kind === 'directory'
          ? { type: 'directory', size: 0, modified: Date.now() }
          : { type: 'file', size: (await handle.getFile()).size, modified: (await handle.getFile()).lastModified };
        entries.push({ name, ...st });
      }
      // Show mounts as virtual folders
      for (const [mp, m] of this.mounts.entries()) {
        const mpParts = mp.split('/').filter(Boolean);
        if (mpParts.length === 2 && mpParts[0] === 'mnt') {
          entries.push({ name: mpParts[1], type: 'directory', size: 0, modified: Date.now(), mount: true });
        } else if (mpParts.length === 1) {
          entries.push({ name: mpParts[0], type: 'directory', size: 0, modified: Date.now(), mount: true });
        }
      }
      return entries;
    }
    
    // Check if path is a mount parent (e.g. /mnt)
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 1 && parts[0] === 'mnt') {
      for (const [mp, m] of this.mounts.entries()) {
        const mpParts = mp.split('/').filter(Boolean);
        if (mpParts.length >= 2 && mpParts[0] === 'mnt') {
          entries.push({ name: mpParts[1], type: 'directory', size: 0, modified: Date.now(), mount: true });
        }
      }
      return entries;
    }
    
    const res = this._resolve(path);
    try {
      let handle;
      if (res) {
        handle = res.subpath === '/' ? res.mount.handle : await this._localDir(res.mount.handle, res.subpath);
      } else {
        handle = await this._opfsDir(path);
      }
      for await (const [name, h] of handle.entries()) {
        if (h.kind === 'directory') {
          entries.push({ name, type: 'directory', size: 0, modified: Date.now() });
        } else {
          const f = await h.getFile();
          entries.push({ name, type: 'file', size: f.size, modified: f.lastModified });
        }
      }
      return entries;
    } catch (e) {
      throw new Error('Cannot read directory: ' + path);
    }
  },
  
  async readFile(path) {
    const res = this._resolve(path);
    const parts = path.split('/').filter(Boolean);
    const name = parts.pop();
    
    let parentHandle;
    if (res) {
      const subParts = res.subpath.split('/').filter(Boolean);
      subParts.pop();
      parentHandle = subParts.length === 0 ? res.mount.handle : await this._localDir(res.mount.handle, subParts.join('/'));
    } else {
      parentHandle = await this._opfsDir(parts.join('/') || '/');
    }
    
    const fh = await parentHandle.getFileHandle(name);
    const f = await fh.getFile();
    return await f.arrayBuffer();
  },
  
  async readText(path) {
    const buf = await this.readFile(path);
    return new TextDecoder().decode(buf);
  },
  
  async writeFile(path, content) {
    const res = this._resolve(path);
    const parts = path.split('/').filter(Boolean);
    const name = parts.pop();
    const dirPath = '/' + parts.join('/');
    
    let parentHandle;
    if (res) {
      const subParts = res.subpath.split('/').filter(Boolean);
      subParts.pop();
      parentHandle = subParts.length === 0 ? res.mount.handle : await this._localDir(res.mount.handle, subParts.join('/'), true);
    } else {
      await this.mkdir(dirPath || '/');
      parentHandle = await this._opfsDir(parts.join('/') || '/');
    }
    
    const fh = await parentHandle.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    if (typeof content === 'string') await w.write(new TextEncoder().encode(content));
    else await w.write(content);
    await w.close();
  },
  
  async mkdir(path) {
    if (path === '/' || !path) return;
    const res = this._resolve(path);
    if (res) {
      await this._localDir(res.mount.handle, res.subpath, true);
      return;
    }
    await this._opfsDir(path, true);
  },
  
  async unlink(path) {
    const parts = path.split('/').filter(Boolean);
    const name = parts.pop();
    const parentPath = '/' + parts.join('/');
    const res = this._resolve(path);
    
    let parentHandle;
    if (res) {
      const subParts = res.subpath.split('/').filter(Boolean);
      subParts.pop();
      parentHandle = subParts.length === 0 ? res.mount.handle : await this._localDir(res.mount.handle, subParts.join('/'));
    } else {
      parentHandle = await this._opfsDir(parts.join('/') || '/');
    }
    await parentHandle.removeEntry(name, { recursive: true });
  },
  
  async rename(oldPath, newPath) {
    const oldParts = oldPath.split('/').filter(Boolean);
    const oldName = oldParts.pop();
    const oldParentPath = '/' + oldParts.join('/');
    const newParts = newPath.split('/').filter(Boolean);
    const newName = newParts.pop();
    
    const res = this._resolve(oldPath);
    if (res) {
      // Local FS rename (same parent only for simplicity)
      const subParts = res.subpath.split('/').filter(Boolean);
      subParts.pop();
      const parentHandle = subParts.length === 0 ? res.mount.handle : await this._localDir(res.mount.handle, subParts.join('/'));
      const st = await this.stat(oldPath);
      if (st.type === 'file') {
        const fh = await parentHandle.getFileHandle(oldName);
        const f = await fh.getFile();
        const buf = await f.arrayBuffer();
        await this.writeFile(newPath, buf);
        await parentHandle.removeEntry(oldName);
      } else {
        throw new Error('Folder rename on local mounts not fully supported');
      }
    } else {
      // OPFS rename
      const st = await this.stat(oldPath);
      if (st.type === 'file') {
        const buf = await this.readFile(oldPath);
        await this.writeFile(newPath, buf);
        await this.unlink(oldPath);
      } else {
        await this._copyDir(oldPath, newPath);
        await this.unlink(oldPath);
      }
    }
  },
  
  async copy(src, dst) {
    const st = await this.stat(src);
    if (st.type === 'file') {
      const buf = await this.readFile(src);
      await this.writeFile(dst, buf);
    } else {
      await this._copyDir(src, dst);
    }
  },
  
  async _copyDir(src, dst) {
    await this.mkdir(dst);
    const entries = await this.readdir(src);
    for (const e of entries) {
      const s = src === '/' ? '/' + e.name : src + '/' + e.name;
      const d = dst === '/' ? '/' + e.name : dst + '/' + e.name;
      await this.copy(s, d);
    }
  },
  
  async exists(path) {
    try { await this.stat(path); return true; } catch { return false; }
  },
  
  async mountLocal(handle) {
    const name = handle.name || 'local-' + Date.now();
    const mountPath = '/mnt/' + name;
    this.mounts.set(mountPath, { handle, name });
    await this._saveMountMeta();
    return mountPath;
  },
  
  async unmount(path) {
    this.mounts.delete(path);
    await this._saveMountMeta();
  },
  
  async getStorageEstimate() {
    const q = await navigator.storage.estimate();
    return { used: q.usage || 0, quota: q.quota || 0 };
  },
  
  async reset() {
    for await (const [name] of this.opfsRoot.entries()) {
      await this.opfsRoot.removeEntry(name, { recursive: true });
    }
    this.mounts.clear();
    await this._saveMountMeta();
    const db = await this._idb();
    db.transaction('meta', 'readwrite').objectStore('meta').clear();
  }
};

// ============================================================
// Utility
// ============================================================
const fmtSize = (b) => {
  if (!b || b === 0) return '—';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(b < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
};
const fmtDate = (ts) => {
  if (!ts) return '—';
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
};
const getExt = (name) => {
  const m = name.match(/\.([^.\\/]+)$/);
  return m ? m[1].toLowerCase() : '';
};
const getIconForFile = (name) => {
  const ext = getExt(name);
  if (['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'].includes(ext)) return ICONS.image;
  if (['mp4','webm','ogv','mov','mkv'].includes(ext)) return ICONS.video;
  if (['mp3','wav','ogg','flac','aac','m4a','opus'].includes(ext)) return ICONS.audio;
  if (['html','css','js','ts','json','xml','yaml','yml','py','java','c','cpp','rs','go','sh','md','jsx','tsx','vue','svelte'].includes(ext)) return ICONS.code;
  if (['pdf'].includes(ext)) return ICONS.pdf;
  if (['zip','gz','tar','tgz','rar','7z'].includes(ext)) return ICONS.archive;
  if (['txt','log','ini','cfg','conf','csv','tsv'].includes(ext)) return ICONS.text;
  return ICONS.file;
};
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

const Dialog = {
  prompt(title, defaultValue = '', placeholder = '') {
    return new Promise((resolve) => {
      const overlay = el(`<div class="dlg-overlay"></div>`);
      const dlg = el(`
        <div class="dlg">
          <div class="dlg-head"><div class="dlg-title">${title}</div></div>
          <div class="dlg-body">
            <label>输入内容</label>
            <input type="text" value="${defaultValue.replace(/"/g,'&quot;')}" placeholder="${placeholder}">
          </div>
          <div class="dlg-foot">
            <button class="dlg-btn" data-act="cancel">取消</button>
            <button class="dlg-btn primary" data-act="ok">确定</button>
          </div>
        </div>
      `);
      overlay.appendChild(dlg);
      const input = dlg.querySelector('input');
      input.focus(); input.select();
      const close = (val) => { overlay.remove(); resolve(val); };
      dlg.querySelector('[data-act=cancel]').onclick = () => close(null);
      dlg.querySelector('[data-act=ok]').onclick = () => close(input.value);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') close(input.value);
        if (e.key === 'Escape') close(null);
      });
      overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
      document.body.appendChild(overlay);
    });
  },
  
  confirm(title, message) {
    return new Promise((resolve) => {
      const overlay = el(`<div class="dlg-overlay"></div>`);
      const dlg = el(`
        <div class="dlg">
          <div class="dlg-head"><div class="dlg-title">${title}</div></div>
          <div class="dlg-body"><p style="color:var(--text-dim);line-height:1.5">${message}</p></div>
          <div class="dlg-foot">
            <button class="dlg-btn" data-act="cancel">取消</button>
            <button class="dlg-btn primary" data-act="ok">确定</button>
          </div>
        </div>
      `);
      overlay.appendChild(dlg);
      const close = (v) => { overlay.remove(); resolve(v); };
      dlg.querySelector('[data-act=cancel]').onclick = () => close(false);
      dlg.querySelector('[data-act=ok]').onclick = () => close(true);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(false); });
      document.body.appendChild(overlay);
    });
  }
};

// ============================================================
// Window Manager
// ============================================================
const WM = {
  windows: new Map(),
  z: 1000,
  active: null,
  
  create(opts) {
    const id = 'w' + Date.now() + Math.floor(Math.random() * 1000);
    const w = el(`
      <div class="win" id="${id}">
        <div class="win-head">
          <div class="win-title">${opts.title || ''}</div>
          <div class="win-ctrls">
            <div class="win-ctrl min" title="最小化"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
            <div class="win-ctrl max" title="最大化"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg></div>
            <div class="win-ctrl close" title="关闭"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></div>
          </div>
        </div>
        <div class="win-body"></div>
        <div class="win-resize"></div>
      </div>
    `);
    const body = w.querySelector('.win-body');
    if (typeof opts.content === 'string') body.innerHTML = opts.content;
    else if (opts.content instanceof HTMLElement) body.appendChild(opts.content);
    
    // Size & position
    const vw = window.innerWidth, vh = window.innerHeight - 48;
    const width = Math.min(opts.width || 820, vw - 20);
    const height = Math.min(opts.height || 560, vh - 20);
    w.style.width = width + 'px';
    w.style.height = height + 'px';
    const x = opts.x != null ? opts.x : Math.max(10, (vw - width) / 2 + (this.windows.size * 24) % 100 - 50);
    const y = opts.y != null ? opts.y : Math.max(10, (vh - height) / 2 + (this.windows.size * 24) % 100 - 50);
    w.style.left = x + 'px';
    w.style.top = y + 'px';
    w.style.zIndex = ++this.z;
    
    document.getElementById('windows-layer').appendChild(w);
    
    const data = {
      id, el: w, title: opts.title, icon: opts.icon,
      minimized: false, maximized: false,
      prev: null, onclose: opts.onclose, app: opts.app
    };
    this.windows.set(id, data);
    
    this._bindEvents(data);
    this.focus(id);
    this._refreshTaskbar();
    
    return { id, el: w, body, data, close: () => this.close(id), focus: () => this.focus(id) };
  },
  
  _bindEvents(d) {
    const w = d.el;
    const head = w.querySelector('.win-head');
    
    // Drag
    let drag = null;
    const onDown = (e) => {
      if (d.maximized) return;
      if (e.target.closest('.win-ctrl')) return;
      const t = e.touches ? e.touches[0] : e;
      drag = { x: t.clientX - w.offsetLeft, y: t.clientY - w.offsetTop };
      this.focus(d.id);
      e.preventDefault();
    };
    const onMove = (e) => {
      if (!drag) return;
      const t = e.touches ? e.touches[0] : e;
      w.style.left = Math.max(0, t.clientX - drag.x) + 'px';
      w.style.top = Math.max(0, Math.min(window.innerHeight - 100, t.clientY - drag.y)) + 'px';
    };
    const onUp = () => { drag = null; };
    head.addEventListener('mousedown', onDown);
    head.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
    
    // Resize
    const rs = w.querySelector('.win-resize');
    let rz = null;
    rs.addEventListener('mousedown', (e) => {
      if (d.maximized) return;
      rz = { x: e.clientX, y: e.clientY, w: w.offsetWidth, h: w.offsetHeight };
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!rz) return;
      w.style.width = Math.max(320, rz.w + e.clientX - rz.x) + 'px';
      w.style.height = Math.max(220, rz.h + e.clientY - rz.y) + 'px';
    });
    document.addEventListener('mouseup', () => { rz = null; });
    
    // Controls
    w.querySelector('.min').onclick = (e) => { e.stopPropagation(); this.minimize(d.id); };
    w.querySelector('.max').onclick = (e) => { e.stopPropagation(); this.toggleMax(d.id); };
    w.querySelector('.close').onclick = (e) => { e.stopPropagation(); this.close(d.id); };
    
    // Double-click to max
    head.addEventListener('dblclick', (e) => {
      if (e.target.closest('.win-ctrl')) return;
      this.toggleMax(d.id);
    });
    
    // Focus
    w.addEventListener('mousedown', () => this.focus(d.id));
  },
  
  focus(id) {
    const d = this.windows.get(id);
    if (!d) return;
    if (d.minimized) {
      d.el.classList.remove('min');
      d.minimized = false;
    }
    d.el.style.zIndex = ++this.z;
    this.windows.forEach((x, k) => x.el.classList.toggle('focused', k === id));
    this.active = id;
    this._refreshTaskbar();
  },
  
  minimize(id) {
    const d = this.windows.get(id);
    if (!d) return;
    d.el.classList.add('min');
    d.minimized = true;
    this._refreshTaskbar();
  },
  
  toggleMax(id) {
    const d = this.windows.get(id);
    if (!d) return;
    if (d.maximized) {
      d.el.classList.remove('max');
      if (d.prev) {
        d.el.style.left = d.prev.l; d.el.style.top = d.prev.t;
        d.el.style.width = d.prev.w; d.el.style.height = d.prev.h;
      }
      d.maximized = false;
    } else {
      d.prev = { l: d.el.style.left, t: d.el.style.top, w: d.el.style.width, h: d.el.style.height };
      d.el.classList.add('max');
      d.maximized = true;
    }
  },
  
  close(id) {
    const d = this.windows.get(id);
    if (!d) return;
    if (d.onclose) d.onclose();
    d.el.style.animation = 'winOpen .18s reverse';
    setTimeout(() => {
      d.el.remove();
      this.windows.delete(id);
      this._refreshTaskbar();
    }, 170);
  },
  
  _refreshTaskbar() {
    const tb = document.getElementById('tb-apps');
    tb.innerHTML = '';
    this.windows.forEach((d, id) => {
      const t = el(`
        <div class="tb-app ${this.active === id && !d.minimized ? 'active' : ''} ${d.minimized ? 'minimized' : ''}">
          ${d.icon || ICONS.file}
          <span class="nm">${d.title}</span>
        </div>
      `);
      t.onclick = () => {
        if (d.minimized || this.active !== id) this.focus(id);
        else this.minimize(id);
      };
      tb.appendChild(t);
    });
  }
};

const ContextMenu = {
  el: document.getElementById('ctx-menu'),
  show(x, y, items) {
    this.el.innerHTML = '';
    items.forEach(it => {
      if (it === 'sep') {
        this.el.appendChild(el('<div class="ctx-sep"></div>'));
        return;
      }
      const item = el(`
        <div class="ctx-item ${it.disabled ? 'disabled' : ''}">
          ${it.icon || ''}
          <span>${it.label}</span>
          ${it.shortcut ? `<span class="shortcut">${it.shortcut}</span>` : ''}
        </div>
      `);
      if (!it.disabled) item.onclick = () => { this.hide(); it.action && it.action(); };
      this.el.appendChild(item);
    });
    this.el.classList.add('active');
    // Position
    const rect = this.el.getBoundingClientRect();
    const w = this.el.offsetWidth, h = this.el.offsetHeight;
    const maxX = window.innerWidth - w - 8;
    const maxY = window.innerHeight - h - 8;
    this.el.style.left = Math.min(x, maxX) + 'px';
    this.el.style.top = Math.min(y, maxY) + 'px';
  },
  hide() { this.el.classList.remove('active'); }
};

          </div>
          <div class="fe-content">
            <div class="fe-list-head">
              <div></div>
              <div data-sort="name">名称 <span class="sort-ind"></span></div>
              <div data-sort="modified">修改时间 <span class="sort-ind"></span></div>
              <div data-sort="type">类型 <span class="sort-ind"></span></div>
              <div data-sort="size">大小 <span class="sort-ind"></span></div>
            </div>
            <div class="fe-list"></div>
            <div class="fe-status"><span class="fe-count"></span><span class="fe-total"></span></div>
          </div>
        </div>
      </div>
    `);
    win.body.appendChild(container);
    
    const state = {
      path: initialPath, history: [initialPath], hi: 0,
      sort: 'name', sortDir: 1, selected: new Set(), filter: '',
    };
    
    const render = async () => {
      const list = container.querySelector('.fe-list');
      const bc = container.querySelector('.fe-breadcrumb');
      const status = container.querySelector('.fe-status');
      list.innerHTML = '<div style="padding:20px;color:var(--text-mute)">加载中...</div>';
      
      try {
        let entries = await VFS.readdir(state.path);
        
        // Filter
        if (state.filter) {
          entries = entries.filter(e => e.name.toLowerCase().includes(state.filter.toLowerCase()));
        }
        
        // Sort
        const sortFn = (a, b) => {
          if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
          let c = 0;
          if (state.sort === 'name') c = a.name.localeCompare(b.name);
          else if (state.sort === 'modified') c = (a.modified || 0) - (b.modified || 0);
          else if (state.sort === 'size') c = (a.size || 0) - (b.size || 0);
          else if (state.sort === 'type') c = getExt(a.name).localeCompare(getExt(b.name));
          return c * state.sortDir;
        };
        entries.sort(sortFn);
        
        // Breadcrumb
        bc.innerHTML = '';
        const parts = state.path.split('/').filter(Boolean);
        const root = el(`<span class="bc-item" data-path="/">/</span>`);
        root.onclick = () => navigate('/');
        bc.appendChild(root);
        let acc = '';
        parts.forEach(p => {
          acc += '/' + p;
          bc.appendChild(el('<span class="bc-sep">/</span>'));
          const item = el(`<span class="bc-item" data-path="${acc}">${p}</span>`);
          item.onclick = () => navigate(acc);
          bc.appendChild(item);
        });
        
        // List
        list.innerHTML = '';
        if (entries.length === 0) {
          list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-mute);font-size:12px">此文件夹为空<br><br>拖拽文件到此处上传</div>';
        }
        entries.forEach(entry => {
          const row = el(`
            <div class="f-item" data-name="${entry.name}" data-type="${entry.type}" draggable="true">
              <div style="color:${entry.mount ? 'var(--success)' : (entry.type === 'directory' ? 'var(--accent-3)' : 'var(--text-dim)')}">${entry.mount ? ICONS.mount : (entry.type === 'directory' ? ICONS.folder : getIconForFile(entry.name))}</div>
              <div class="f-item-name">${entry.name}</div>
              <div class="f-item-meta">${fmtDate(entry.modified)}</div>
              <div class="f-item-meta">${entry.type === 'directory' ? '文件夹' : (getExt(entry.name).toUpperCase() || '文件')}</div>
              <div class="f-item-meta">${entry.type === 'directory' ? '—' : fmtSize(entry.size)}</div>
            </div>
          `);
          
          // Click
          row.addEventListener('click', (e) => {
            if (e.ctrlKey || e.metaKey) {
              if (state.selected.has(entry.name)) { state.selected.delete(entry.name); row.classList.remove('selected'); }
              else { state.selected.add(entry.name); row.classList.add('selected'); }
            } else {
              state.selected.clear();
              list.querySelectorAll('.f-item').forEach(x => x.classList.remove('selected'));
              state.selected.add(entry.name);
              row.classList.add('selected');
            }
            updateStatus();
          });
          
          // Double click
          row.addEventListener('dblclick', () => openItem(state.path, entry));
          
          // Right click
          row.addEventListener('contextmenu', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (!state.selected.has(entry.name)) {
              state.selected.clear();
              list.querySelectorAll('.f-item').forEach(x => x.classList.remove('selected'));
              state.selected.add(entry.name);
              row.classList.add('selected');
            }
            showContextMenu(e.clientX, e.clientY, state.path, entry);
          });
          
          // Drag
          row.addEventListener('dragstart', (e) => {
            e.stopPropagation();
            const path = state.path === '/' ? '/' + entry.name : state.path + '/' + entry.name;
            e.dataTransfer.setData('application/x-webos-path', path);
            e.dataTransfer.setData('text/plain', path);
            e.dataTransfer.effectAllowed = 'copyMove';
            // Try setting a download URL for external drop
            if (entry.type === 'file') {
              (async () => {
                try {
                  const buf = await VFS.readFile(path);
                  const blob = new Blob([buf]);
                  const url = URL.createObjectURL(blob);
                  e.dataTransfer.setData('DownloadURL', `application/octet-stream:${entry.name}:${url}`);
                } catch {}
              })();
            }
          });
          
          // Drop on folder item
          if (entry.type === 'directory') {
            row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drop-target'); });
            row.addEventListener('dragleave', () => row.classList.remove('drop-target'));
            row.addEventListener('drop', async (e) => {
              e.preventDefault(); e.stopPropagation();
              row.classList.remove('drop-target');
              const srcPath = e.dataTransfer.getData('application/x-webos-path');
              const targetDir = state.path === '/' ? '/' + entry.name : state.path + '/' + entry.name;
              if (srcPath) {
                const srcName = srcPath.split('/').pop();
                try {
                  await VFS.rename(srcPath, targetDir + '/' + srcName);
                  Toast.show('已移动 ' + srcName, 'success');
                  render();
                  // Refresh other FE instances
                  FE.refreshAll();
                } catch (err) { Toast.show('移动失败: ' + err.message, 'error'); }
              }
            });
          }
          
          list.appendChild(row);
        });
        
        // Status
        const updateStatus = () => {
          const dirs = entries.filter(e => e.type === 'directory').length;
          const files = entries.length - dirs;
          const totalSize = entries.reduce((a, b) => a + (b.size || 0), 0);
          container.querySelector('.fe-count').textContent = `${entries.length} 项 (${dirs} 文件夹, ${files} 文件)`;
          container.querySelector('.fe-total').textContent = state.selected.size ? ` · 已选 ${state.selected.size} 项` : (totalSize ? ` · 共 ${fmtSize(totalSize)}` : '');
        };
        updateStatus();
        
        // Update side highlight
        container.querySelectorAll('.side-item').forEach(s => {
          s.classList.toggle('active', s.dataset.path === state.path);
        });
        
        // Sort indicators
        container.querySelectorAll('.fe-list-head > div[data-sort]').forEach(h => {
          const ind = h.querySelector('.sort-ind');
          if (h.dataset.sort === state.sort) ind.textContent = state.sortDir > 0 ? '▲' : '▼';
          else ind.textContent = '';
        });
        
      } catch (e) {
        list.innerHTML = `<div style="padding:20px;color:var(--danger)">加载失败: ${e.message}</div>`;
      }
      
      // Render mounts sidebar
      const mountsEl = container.querySelector('.fe-mounts');
      mountsEl.innerHTML = '';
      if (VFS.mounts.size === 0) {
        mountsEl.innerHTML = '<div style="padding:4px 10px;font-size:11px;color:var(--text-mute)">未挂载</div>';
      } else {
        VFS.mounts.forEach((m, p) => {
          const item = el(`<div class="side-item mount" data-path="${p}">${ICONS.mount}<span>${m.name}</span></div>`);
          item.onclick = () => navigate(p);
          item.oncontextmenu = (e) => {
            e.preventDefault(); e.stopPropagation();
            ContextMenu.show(e.clientX, e.clientY, [
              { label: '卸载', icon: ICONS.trash, action: async () => {
                if (await Dialog.confirm('卸载', `确定卸载 "${m.name}" 吗？`)) {
                  await VFS.unmount(p);
                  Toast.show('已卸载', 'success');
                  render();
                }
              }}
            ]);
          };
          mountsEl.appendChild(item);
        });
      }
    };
    
    const navigate = (path, pushHistory = true) => {
      state.path = path;
      state.selected.clear();
      if (pushHistory) {
        state.history = state.history.slice(0, state.hi + 1);
        state.history.push(path);
        state.hi = state.history.length - 1;
      }
      render();
      win.el.querySelector('.win-title').textContent = '文件资源管理器 · ' + (path === '/' ? '/' : path.split('/').pop());
    };
    
    const openItem = async (dirPath, entry) => {
      const fullPath = dirPath === '/' ? '/' + entry.name : dirPath + '/' + entry.name;
      if (entry.type === 'directory') {
        navigate(fullPath);
      } else {
        openFile(fullPath, entry.name);
      }
    };
    
    const showContextMenu = (x, y, dirPath, entry) => {
      const fullPath = entry ? (dirPath === '/' ? '/' + entry.name : dirPath + '/' + entry.name) : dirPath;
      const items = [];
      
      if (entry) {
        items.push({ label: '打开', icon: entry.type === 'directory' ? ICONS.folderOpen : ICONS.file, action: () => openItem(dirPath, entry) });
        if (entry.type === 'file') {
          items.push({ label: '以文本方式打开', icon: ICONS.text, action: () => Apps.launch('notepad', { path: fullPath }) });
          items.push({ label: '导出到本地', icon: ICONS.download, action: () => exportFile(fullPath, entry.name) });
        }
        items.push('sep');
        items.push({ label: '复制', icon: ICONS.copy, shortcut: 'Ctrl+C', action: () => { VFS.clipboard = { op: 'copy', path: fullPath }; Toast.show('已复制', 'info', 1200); } });
        items.push({ label: '重命名', icon: ICONS.rename, action: async () => {
          const newName = await Dialog.prompt('重命名', entry.name);
          if (newName && newName !== entry.name) {
            const newPath = dirPath === '/' ? '/' + newName : dirPath + '/' + newName;
            try { await VFS.rename(fullPath, newPath); Toast.show('已重命名', 'success'); render(); FE.refreshAll(); }
            catch (e) { Toast.show(e.message, 'error'); }
          }
        }});
        items.push({ label: '删除', icon: ICONS.trash, action: async () => {
          if (await Dialog.confirm('删除', `确定删除 "${entry.name}" 吗？`)) {
            try { await VFS.unlink(fullPath); Toast.show('已删除', 'success'); render(); FE.refreshAll(); }
            catch (e) { Toast.show(e.message, 'error'); }
          }
        }});
      } else {
        items.push({ label: '新建文件夹', icon: ICONS.folder, action: async () => {
          const name = await Dialog.prompt('新建文件夹', '新建文件夹');
          if (name) { try { await VFS.mkdir(dirPath === '/' ? '/' + name : dirPath + '/' + name); render(); } catch (e) { Toast.show(e.message, 'error'); } }
        }});
        items.push({ label: '新建文本文件', icon: ICONS.newFile, action: async () => {
          const name = await Dialog.prompt('新建文本文件', '新建文件.txt');
          if (name) { try { await VFS.writeFile(dirPath === '/' ? '/' + name : dirPath + '/' + name, ''); render(); } catch (e) { Toast.show(e.message, 'error'); } }
        }});
        items.push('sep');
        items.push({ 
          label: '粘贴', icon: ICONS.paste, shortcut: 'Ctrl+V',
          disabled: !VFS.clipboard,
          action: async () => {
            if (!VFS.clipboard) return;
            const srcName = VFS.clipboard.path.split('/').pop();
            const dst = dirPath === '/' ? '/' + srcName : dirPath + '/' + srcName;
            try {
              await VFS.copy(VFS.clipboard.path, dst);
              Toast.show('已粘贴', 'success');
              render(); FE.refreshAll();
            } catch (e) { Toast.show(e.message, 'error'); }
          }
        });
        items.push('sep');
        items.push({ label: '上传文件', icon: ICONS.upload, action: () => uploadToDir(dirPath) });
        items.push({ label: '刷新', icon: ICONS.refresh, shortcut: 'F5', action: render });
      }
      
      ContextMenu.show(x, y, items);
    };
    
    const uploadToDir = async (dirPath) => {
      const input = el('<input type="file" multiple style="display:none">');
      document.body.appendChild(input);
      input.onchange = async () => {
        for (const f of input.files) {
          try {
            const buf = await f.arrayBuffer();
            await VFS.writeFile(dirPath === '/' ? '/' + f.name : dirPath + '/' + f.name, buf);
          } catch (e) { Toast.show('上传失败: ' + f.name, 'error'); }
        }
        Toast.show(`已上传 ${input.files.length} 个文件`, 'success');
        render(); FE.refreshAll();
        input.remove();
      };
      input.click();
    };
    
    const exportFile = async (path, name) => {
      try {
        const buf = await VFS.readFile(path);
        const blob = new Blob([buf]);
        const url = URL.createObjectURL(blob);
        const a = el(`<a href="${url}" download="${name}" style="display:none"></a>`);
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
      } catch (e) { Toast.show('导出失败: ' + e.message, 'error'); }
    };
    
    // Toolbar buttons
    container.querySelector('[data-act=back]').onclick = () => {
      if (state.hi > 0) { state.hi--; state.path = state.history[state.hi]; render(); }
    };
    container.querySelector('[data-act=fwd]').onclick = () => {
      if (state.hi < state.history.length - 1) { state.hi++; state.path = state.history[state.hi]; render(); }
    };
    container.querySelector('[data-act=up]').onclick = () => {
      if (state.path === '/') return;
      const parts = state.path.split('/').filter(Boolean);
      parts.pop();
      navigate('/' + parts.join('/') || '/');
    };
    container.querySelector('[data-act=refresh]').onclick = render;
    
    // Search
    const search = container.querySelector('.fe-search');
    search.addEventListener('input', (e) => { state.filter = e.target.value; render(); });
    
    // Sort headers
    container.querySelectorAll('.fe-list-head > div[data-sort]').forEach(h => {
      h.onclick = () => {
        if (state.sort === h.dataset.sort) state.sortDir *= -1;
        else { state.sort = h.dataset.sort; state.sortDir = 1; }
        render();
      };
    });
    
    // Sidebar
    container.querySelectorAll('.side-item[data-path]').forEach(s => {
      s.onclick = () => navigate(s.dataset.path);
    });
    
    // Context on empty area
    const contentArea = container.querySelector('.fe-content');
    contentArea.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.f-item')) return;
      e.preventDefault();
      state.selected.clear();
      container.querySelectorAll('.f-item').forEach(x => x.classList.remove('selected'));
      showContextMenu(e.clientX, e.clientY, state.path, null);
    });
    
    // Content area click to deselect
    container.querySelector('.fe-list').addEventListener('click', (e) => {
      if (e.target.closest('.f-item')) return;
      state.selected.clear();
      container.querySelectorAll('.f-item').forEach(x => x.classList.remove('selected'));
      container.querySelector('.fe-count').textContent = container.querySelector('.fe-count').textContent.split(' · ')[0];
    });
    
    // Drag & drop upload
    const listArea = container.querySelector('.fe-list');
    listArea.addEventListener('dragover', (e) => {
      if (e.dataTransfer.types.includes('application/x-webos-path')) return;
      e.preventDefault();
      contentArea.style.background = 'rgba(130,170,255,.04)';
    });
    listArea.addEventListener('dragleave', (e) => {
      if (e.target === listArea) contentArea.style.background = '';
    });
    listArea.addEventListener('drop', async (e) => {
      contentArea.style.background = '';
      if (e.dataTransfer.files.length > 0) {
        e.preventDefault();
        for (const f of e.dataTransfer.files) {
          try {
            const buf = await f.arrayBuffer();
            await VFS.writeFile(state.path === '/' ? '/' + f.name : state.path + '/' + f.name, buf);
          } catch (err) { Toast.show('上传失败: ' + f.name, 'error'); }
        }
        Toast.show(`已上传 ${e.dataTransfer.files.length} 个文件`, 'success');
        render(); FE.refreshAll();
      }
    });
    
    // Keyboard shortcuts
    win.el.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if ((e.ctrlKey || e.metaKey) && e.key === 'c' && state.selected.size > 0) {
        const name = Array.from(state.selected)[0];
        VFS.clipboard = { op: 'copy', path: state.path === '/' ? '/' + name : state.path + '/' + name };
        Toast.show('已复制', 'info', 1200);
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'v' && VFS.clipboard) {
        (async () => {
          const srcName = VFS.clipboard.path.split('/').pop();
          const dst = state.path === '/' ? '/' + srcName : state.path + '/' + srcName;
          try {
            await VFS.copy(VFS.clipboard.path, dst);
            Toast.show('已粘贴', 'success');
            render();
          } catch (err) { Toast.show(err.message, 'error'); }
        })();
      }
      if (e.key === 'Delete' && state.selected.size > 0) {
        (async () => {
          for (const name of state.selected) {
            try { await VFS.unlink(state.path === '/' ? '/' + name : state.path + '/' + name); } catch {}
          }
          Toast.show('已删除', 'success');
          render(); FE.refreshAll();
        })();
      }
      if (e.key === 'F5') { e.preventDefault(); render(); }
    });
    win.el.tabIndex = 0;
    
    // Store for refresh
    this.instances.set(win.id, { render, navigate, state });
    win.data.onclose = () => this.instances.delete(win.id);
    
    render();
  },
  
  refreshAll() {
    this.instances.forEach(i => i.render());
  }
};

// ---------- Open File (router) ----------
async function openFile(path, name = null) {
  name = name || path.split('/').pop();
  const ext = getExt(name);
  
  const textExts = ['txt','md','js','ts','jsx','tsx','css','html','htm','json','xml','yaml','yml','py','java','c','cpp','h','hpp','rs','go','sh','bash','log','ini','cfg','conf','toml','vue','svelte','php','rb','pl','lua','r','sql','bat','ps1'];
  const tableExts = ['csv','tsv'];
  const imgExts = ['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'];
  const audioExts = ['mp3','wav','ogg','flac','aac','m4a','opus'];
  const videoExts = ['mp4','webm','ogv','mov','mkv'];
  const archiveExts = ['zip','gz','tar','tgz'];
  
  if (textExts.includes(ext)) Apps.launch('notepad', { path });
  else if (tableExts.includes(ext)) Apps.launch('table', { path });
  else if (ext === 'html' || ext === 'htm') Apps.launch('notepad', { path, preview: true });
  else if (imgExts.includes(ext)) Apps.launch('image', { path });
  else if (audioExts.includes(ext)) Apps.launch('audio', { path });
  else if (videoExts.includes(ext)) Apps.launch('video', { path });
  else if (ext === 'pdf') Apps.launch('pdf', { path });
  else if (archiveExts.includes(ext)) Apps.launch('archive', { path });
  else {
    // Fallback: open as text
    Apps.launch('notepad', { path });
  }
}

// ---------- Notepad ----------
Apps.register('notepad', {
  name: '记事本', icon: ICONS.notepad, desc: '文本与代码编辑器',
  launch(args = {}) {
    const win = WM.create({
      title: '记事本', icon: ICONS.notepad, width: 780, height: 540, app: 'notepad'
    });
    const c = el(`
      <div class="ed">
        <div class="ed-toolbar">
          <div class="tb-btn" data-act="open" title="打开">${ICONS.folder}</div>
          <div class="tb-btn" data-act="save" title="保存 (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></div>
          <div class="tb-btn" data-act="saveas" title="另存为"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></div>
          <div class="ed-toolbar-sep"></div>
          <div class="tb-btn" data-act="preview" title="预览 HTML" style="display:none">${ICONS.browser}</div>
          <div class="ed-file-info" id="ed-info"></div>
        </div>
        <div class="ed-body">
          <div class="ed-gutter">1</div>
          <div class="ed-area"><textarea spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea></div>
        </div>
      </div>
    `);
    win.body.appendChild(c);
    
    const ta = c.querySelector('textarea');
    const gutter = c.querySelector('.ed-gutter');
    const info = c.querySelector('#ed-info');
    let currentPath = null;
    let dirty = false;
    let previewWin = null;
    const isHtml = args.path && /\.html?$/i.test(args.path);
    
    const updateGutter = () => {
      const lines = ta.value.split('\n').length;
      gutter.innerHTML = Array.from({length: Math.max(1, lines)}, (_, i) => i + 1).join('<br>');
    };
    
    const updateInfo = () => {
      const lines = ta.value.split('\n').length;
      const chars = ta.value.length;
      info.textContent = `${lines} 行 · ${chars} 字符${dirty ? ' · 已修改' : ''}`;
    };
    
    const loadFile = async (path) => {
      try {
        const text = await VFS.readText(path);
        ta.value = text;
        currentPath = path;
        dirty = false;
        win.el.querySelector('.win-title').textContent = '记事本 · ' + path.split('/').pop();
        updateGutter(); updateInfo();
        if (isHtml && args.preview) openPreview();
      } catch (e) { Toast.show('无法打开文件', 'error'); }
    };
    
    const save = async () => {
      if (!currentPath) {
        const p = await Dialog.prompt('保存为', '/Documents/untitled.txt');
        if (!p) return;
        currentPath = p;
      }
      try {
        await VFS.writeFile(currentPath, ta.value);
        dirty = false;
        updateInfo();
        Toast.show('已保存', 'success', 1500);
        FE.refreshAll();
        if (isHtml && previewWin) updatePreview();
      } catch (e) { Toast.show('保存失败: ' + e.message, 'error'); }
    };
    
    const openPreview = () => {
      if (!isHtml) return;
      if (previewWin) { previewWin.focus(); return; }
      previewWin = Apps._openHtmlPreview(currentPath || '未命名.html', ta.value, () => { previewWin = null; });
    };
    
    const updatePreview = () => {
      if (previewWin && previewWin.update) previewWin.update(ta.value);
    };
    
    if (isHtml) c.querySelector('[data-act=preview]').style.display = '';
    
    ta.addEventListener('input', () => { dirty = true; updateGutter(); updateInfo(); if (isHtml) updatePreview(); });
    ta.addEventListener('scroll', () => { gutter.scrollTop = ta.scrollTop; });

Apps.register('table', {
  name: '表格', icon: ICONS.table, desc: 'CSV/TSV 表格编辑器',
  launch(args = {}) {
    const win = WM.create({
      title: '表格', icon: ICONS.table, width: 820, height: 540, app: 'table'
    });
    const c = el(`
      <div class="ss">
        <div class="ss-tabs">
          <div class="ss-tab active" data-view="table">表格视图</div>
          <div class="ss-tab" data-view="text">文本视图</div>
          <span style="flex:1"></span>
          <div class="ss-tab" data-act="save">保存</div>
        </div>
        <div class="ss-body" id="ss-table-view"></div>
        <div class="ss-body" id="ss-text-view" style="display:none">
          <textarea spellcheck="false" style="width:100%;height:100%;background:var(--bg-0);color:var(--text);border:none;padding:12px;font-family:var(--font-display);font-size:13px;resize:none;outline:none"></textarea>
        </div>
      </div>
    `);
    win.body.appendChild(c);
    
    let currentPath = null;
    let delimiter = ',';
    let rows = [];
    let currentView = 'table';
    
    const parse = (text) => {
      if (!text.trim()) return [];
      // Simple CSV parser
      const result = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        const row = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"' && !inQ) { inQ = true; continue; }
          if (ch === '"' && inQ && line[i+1] === '"') { cur += '"'; i++; continue; }
          if (ch === '"' && inQ) { inQ = false; continue; }
          if (ch === delimiter && !inQ) { row.push(cur); cur = ''; continue; }
          cur += ch;
        }
        row.push(cur);
        if (row.length === 1 && row[0] === '' && line === '') continue;
        result.push(row);
      }
      return result;
    };
    
    const stringify = () => {
      return rows.map(r => r.map(c => {
        if (c == null) return '';
        if (c.includes(delimiter) || c.includes('"') || c.includes('\n')) {
          return '"' + c.replace(/"/g, '""') + '"';
        }
        return c;
      }).join(delimiter)).join('\n');
    };
    
    const renderTable = () => {
      const tv = c.querySelector('#ss-table-view');
      if (!rows.length) { tv.innerHTML = '<div style="padding:20px;color:var(--text-mute)">空表格</div>'; return; }
      const maxCols = Math.max(...rows.map(r => r.length));
      let html = '<table class="ss-table"><thead><tr><th>#</th>';
      for (let i = 0; i < maxCols; i++) html += `<th>${String.fromCharCode(65 + i)}</th>`;
      html += '</tr></thead><tbody>';
      rows.forEach((row, r) => {
        html += `<tr><td style="background:var(--bg-2);color:var(--text-mute);text-align:center">${r+1}</td>`;
        for (let i = 0; i < maxCols; i++) {
          html += `<td contenteditable data-r="${r}" data-c="${i}">${row[i] || ''}</td>`;
        }
        html += '</tr>';
      });
      html += '</tbody></table>';
      tv.innerHTML = html;
      tv.querySelectorAll('td[contenteditable]').forEach(td => {
        td.addEventListener('blur', () => {
          const r = +td.dataset.r, co = +td.dataset.c;
          if (!rows[r]) rows[r] = [];
          rows[r][co] = td.textContent;
          c.querySelector('#ss-text-view textarea').value = stringify();
        });
      });
    };
    
    const load = async (path) => {
      try {
        const text = await VFS.readText(path);
        delimiter = path.endsWith('.tsv') ? '\t' : ',';
        rows = parse(text);
        currentPath = path;
        c.querySelector('#ss-text-view textarea').value = text;
        renderTable();
        win.el.querySelector('.win-title').textContent = '表格 · ' + path.split('/').pop();
      } catch (e) { Toast.show('打开失败', 'error'); }
    };
    
    c.querySelectorAll('.ss-tab[data-view]').forEach(t => {
      t.onclick = () => {
        c.querySelectorAll('.ss-tab[data-view]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        currentView = t.dataset.view;
        c.querySelector('#ss-table-view').style.display = currentView === 'table' ? '' : 'none';
        c.querySelector('#ss-text-view').style.display = currentView === 'text' ? '' : 'none';
        if (currentView === 'text') c.querySelector('#ss-text-view textarea').value = stringify();
        else { rows = parse(c.querySelector('#ss-text-view textarea').value); renderTable(); }
      };
    });
    
    c.querySelector('[data-act=save]').onclick = async () => {
      if (!currentPath) { Toast.show('无路径', 'error'); return; }
      try {
        await VFS.writeFile(currentPath, stringify());
        Toast.show('已保存', 'success');
      } catch (e) { Toast.show('保存失败', 'error'); }
    };
    
    if (args.path) load(args.path);
  }
});
