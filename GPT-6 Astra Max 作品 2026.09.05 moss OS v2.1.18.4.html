  async function openNotes(path){if(!path){path=await uniquePath('/Desktop','Untitled.txt');await fs.writeFile(path,'');}const stat=await fs.stat(path);if(stat.size>8*1024*1024&&!await dialog({title:'A rather large note.',message:`This file is ${bytes(stat.size)}. Opening it as text may take a while. Binary data will be decoded as UTF-8.`,confirm:'Open as text'}))return;let saved=await fs.readFile(path,'utf8');const w=wm.create({type:'notes',title:'Notes',icon:'notes',width:670,height:545});w.path=path;wm.subtitle(w,paths.base(path));w.body.innerHTML=`<div class="toolbar notes-toolbar"><span class="note-path" title="${esc(path)}">${esc(path)}</span><button class="button primary" data-action="save">${icon('save')}Save</button><button class="icon-button" data-action="export" title="Download note">${icon('download')}</button><button class="icon-button" data-action="more" title="More note actions">${icon('more')}</button></div><textarea class="notes-text" aria-label="Note content" spellcheck="false" placeholder="Every good idea starts somewhere."></textarea><footer class="statusbar"><span class="note-stats"></span><span class="note-save-state"><i class="status-dot"></i>Saved / UTF-8</span></footer>`;const text=$('textarea',w.body);text.value=saved;const update=()=>{const words=text.value.trim()?text.value.trim().split(/\s+/).length:0;$('.note-stats',w.body).textContent=`${words} words / ${text.value.length} characters`;$('.note-save-state',w.body).innerHTML=text.value===saved?'<i class="status-dot"></i>Saved / UTF-8':'Unsaved changes / UTF-8';};const save=async()=>{const value=text.value;await fs.writeFile(path,value);saved=value;update();};w.save=save;const autosave=debounce(()=>{if(prefs.autosave&&!w.closed)save().catch(report);},1100);text.oninput=()=>{update();autosave();};$('[data-action=save]',w.body).onclick=()=>save().then(()=>toast('A thought, safely kept.')).catch(report);$('[data-action=export]',w.body).onclick=()=>downloadBlob(new Blob([text.value],{type:'te     async function start(){if(booting)return;if(!path){toast('Choose a bootable ISO or disk image first.');return;}if(!globalThis.WebAssembly)throw new Error('This browser does not support WebAssembly.');booting=true;loaded=false;controls(false);$('[data-action=start]',w.body).disabled=true;notify('Reading your image and checking the pinned engine resources...');try{if(emulator){await emulator.destroy();emulator=null;}const image=await fs.readFile(path);if(image.size>ARCHIVE_LIMIT&&!await dialog({title:'A large virtual disk.',message:`This image needs ${bytes(image.size)} plus guest memory. Your browser may run out of memory. Continue?`,confirm:'Continue'}))return;const [bios,vgabios]=await Promise.all([fetchBinary(V86_RESOURCES.bios),fetchBinary(V86_RESOURCES.vgabios),loadScript(V86_RESOURCES.js,()=>!!(window.V86||window.V86Starter))]);if(w.closed)return;const buffer=await image.arrayBuffer();const Constructor=window.V86||window.V86Starter;if(!Constructor)throw new Error('The pinned v86 engine did not initialize.');screen.hidden=false;$('.vm-empty',w.body).hidden=true;screen.innerHTML='<div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas>';const extension=paths.ext(path),device=extension==='iso'?'cdrom':['img','fda','bin'].includes(extension)?'fda':'hda';const options={wasm_path:V86_RESOURCES.wasm,memory_size:Number(memory.value)*1024*1024,vga_memory_size:8*1024*1024,screen_container:screen,bios:{buffer:bios},vga_bios:{buffer:vgabios},autostart:true,disable_speaker:false};options[device]={buffer};emulator=new Constructor(options);const ready=()=>{if(w.closed){emulator?.destroy();return;}clearTimeout(timeout);loaded=true;paused=false;controls(true);notify(`Running ${paths.base(path)} / ${device.toUpperCase()} / Esc releases mouse`);const keyboard=emulator.keyboard_set_enabled||emulator.keyboard_set_status;keyboard?.call(emulator,wm.active===w.id);};emulator.add_listener('emulator-ready',ready);emulator.add_lis     memory.onchange=()=>{prefs.vmMemory=Number(memory.value);persistPrefs();};$('[data-action=import]',w.body).onclick=()=>{$('.vm-file',w.body).value='';$('.vm-file',w.body).click();};$('.vm-file',w.body).onchange=e=>{const file=e.target.files[0];if(!file)return;(async()=>{notify('Saving the boot image to your private Downloads folder...');const destination=await uniquePath('/Downloads',file.name);await fs.writeFile(destination,await file.arrayBuffer());path=destination;notify(paths.base(path)+' / ready to start');wm.subtitle(w,paths.base(path));})().catch(report);};$('[data-action=files]',w.body).onclick=async()=>{const value=await dialog({title:'Open a virtual disk.',message:'Enter a path to a bootable image in your workspace or a connected folder. You can copy the path from Files > Properties.',value:path||'/Downloads/',confirm:'Use image'});if(!value)return;try{const target=paths.normalize(value),st=await fs.stat(target);if(st.kind!=='file')throw new Error('Choose a disk image file, not a folder.');path=target;notify(paths.base(path)+' / ready to start');}catch(error){report(error);}};$('[data-action=start]',w.body).onclick=()=>start().catch(report);$('[data-action=pause]',w.body).onclick=async()=>{if(!loaded)return;if(paused)await emulator.run();else await emulator.stop();paused=!paused;notify(paused?'Virtual machine paused.':'Virtual machine running.');$('[data-action=pause]',w.body).innerHTML=icon(paused?'play':'pause');};$('[data-action=restart]',w.body).onclick=async()=>{if(!loaded)return;if(await dialog({title:'Restart the guest computer?',message:'Unsaved work inside the virtual machine may be lost.',confirm:'Restart'})){emulator.restart();paused=false;notify('Restarting the guest computer...');}};$('[data-action=lock]',w.body).onclick=async()=>{try{if(document.pointerLockElement){document.exitPointerLock();return;}if(emulator?.lock_mouse)await emulator.lock_mouse();else if(screen.requestPointerLock)await screen.requestPointerLock();else throw new Error(   async function runSelfTests(log=()=>{}){if(testRun){log('A system check is already in progress.');return testRun;}testRun=(async()=>{await fs.ready;const root='/.moss/self-test-'+uid(),mount='/mnt/local/.moss-test-'+uid();let passed=0,failed=0;const results=[];const assert=(condition,message)=>{if(!condition)throw new Error(message);};const test=async(name,fn)=>{try{await fn();passed++;results.push({name,ok:true});log('PASS  '+name);}catch(error){failed++;results.push({name,ok:false,error:error.message});log('FAIL  '+name+': '+error.message);}};await fs.mkdir(root);fs.batchDepth++;try{
      await test('Text write / read through '+fs.mode,async()=>{const text='moss / \u4f60\u597d / a little space\n';await fs.writeFile(root+'/note.txt',text);assert(await fs.readFile(root+'/note.txt','utf8')===text,'Text round-trip mismatch.');});
      await test('Binary bytes survive without encoding loss',async()=>{const data=new Uint8Array([0,1,2,127,128,200,254,255]);await fs.writeFile(root+'/bytes.bin',data);const actual=new Uint8Array(await(await fs.readFile(root+'/bytes.bin')).arrayBuffer());assert(actual.length===data.length&&actual.every((v,i)=>v===data[i]),'Binary round-trip mismatch.');});
      await test('An empty file remains a readable empty file',async()=>{await fs.writeFile(root+'/empty.txt',new Blob());const file=await fs.readFile(root+'/empty.txt');assert(file instanceof Blob&&file.size===0&&await file.text()==='','An empty file lost its Blob representation.');});
      await test('Nested folders and meaningful file metadata',async()=>{await fs.mkdir(root+'/tree/nested');await fs.writeFile(root+'/tree/nested/data.txt','seven!!');const st=await fs.stat(root+'/tree/nested/data.txt');assert(st.isFile()&&st.size===7&&st.mtime>0,'Incorrect file metadata.');const entries=await fs.readdir(root+'/tree');assert(entries[0].name==='nested'&&entries[0].kind==='directory','Directory listing mismatch.');});
      await test('Recursive copy and rename keep source data',async()=>{await fs.copy(root+'/tree',root+'/copy');await fs.rename(root+'/copy',root+'/moved');assert(await fs.readFile(root+'/moved/nested/data.txt','utf8')==='seven!!','Copied content differs.');assert(!await fs.exists(root+'/copy'),'Rename left the old path.');assert(await fs.exists(root+'/tree/nested/data.txt'),'Copy removed its source.');});
      await test('Callback compatibility with additional flags',async()=>{const text=await new Promise((resolve,reject)=>fs.readFile(root+'/note.txt','utf8','r',(error,value)=>error?reject(error):resolve(value)));const stat=await new Promise((resolve,reject)=>fs.stat(root+'/note.txt',true,{},(error,value)=>error?reject(error):resolve(value)));assert(typeof text==='string'&&stat.isFile(),'Callback did not receive the correct result.');});
      await test('Mounted paths route through the same API',async()=>{const subtree=root+'/mounted';await fs.mkdir(subtree);const backend={};for(const method of fsMethods)backend[method]=(...args)=>{args[0]=paths.join(subtree,args[0]||'/');if(['copy','rename'].includes(method))args[1]=paths.join(subtree,args[1]);return fs.base[method](...args);};await fs.mount(mount,backend);await fs.writeFile(mount+'/shared.txt','one API');assert(await fs.readFile(subtree+'/shared.txt','utf8')==='one API','Mount write used the wrong backend.');const entries=await fs.readdir('/mnt/local');assert(entries.some(e=>e.path===mount),'Mount name was not visible in its parent.');assert((await fs.stat(mount)).isDirectory(),'Mount root did not dispatch as a directory.');await fs.unmount(mount);});
      await test('Recursive delete and non-existent paths',async()=>{await fs.delete(root+'/moved');assert(!await fs.exists(root+'/moved/nested/data.txt'),'Deleted file still exists.');});
      await test('Image filenames use natural numeric order',()=>{assert(['10.jpg','2.jpg','1.jpg'].sort(natural.compare).join(',')==='1.jpg,2.jpg,10.jpg','Natural numeric sorting failed.');});
      await test('CSV quoted fields, newlines, and round-trip',()=>{const rows=[['Name','Notes'],['Moss, green','Two\nlines'],['Quote','Say "hello"']];assert(JSON.stringify(parseDelimited(stringifyDelimited(rows)))===JSON.stringify(rows),'CSV parser mismatch.');assert(parseDelimited('a\tb\n1\t2\n','\t')[1][1]==='2','TSV parser mismatch.');});
      await test('Arithmetic precedence and input validation',()=>{assert(calculate('2+3*4')===14,'Incorrect precedence.');assert(calculate('(2+3)*4')===20,'Incorrect parentheses.');assert(calculate('50%*80')===40,'Incorrect percentage.');let blocked=false;try{calculate('window.alert(1)');}catch{blocked=true;}assert(blocked,'Non-arithmetic input was not rejected.');});
      await test('Native ZIP export, import, CRC, and binary data',async()=>{const blob=await nativeZip([{name:'test/note.txt',data:new Blob(['hello moss'])},{name:'test/raw.bin',data:new Blob([new Uint8Array([0,255,10])])}]);const entries=await nativeUnzip(blob);assert(entries.length===2&&await entries[0].data.text()==='hello moss','ZIP text did not round-trip.');const data=new Uint8Array(await entries[1].data.arrayBuffer());assert(data[1]===255,'ZIP changed binary data.');});
      await test('Archive traversal paths are rejected',()=>{for(const name of ['../outside','/absolute','a/../../escape','C:/windows']){let blocked=false;try{archiveSafeName(name);}catch{blocked=true;}assert(blocked,'Accepted unsafe path: '+name);}});

      await test('Every window has eight resize edges',()=>{assert([...wm.windows.values()].every(w=>$$('.resize-handle',w.el).length===8),'Missing window resize handles.');});
      const marker='/.moss/persistence-check.json';await test('Persistence marker is written and readable',async()=>{const prior=await fs.exists(marker)?JSON.parse(await fs.readFile(marker,'utf8')):null;if(prior?.session&&prior.session!==sessionId)diagnostics.previousSession=true;const saved={session:sessionId,time:Date.now(),value:'moss-persistence-check'};await fs.writeFile(marker,JSON.stringify(saved));assert(JSON.parse(await fs.readFile(marker,'utf8')).value===saved.value,'Persistence marker failed.');});

  $('#top-file').onclick=e=>{const rect=e.currentTarget.getBoundingClientRect(),active=wm.windows.get(wm.active),dir=active?.state?.path&&active.state.path!=='home'?active.state.path:'/Desktop';showMenu(rect.left,rect.bottom+4,[{label:'New Files window',icon:'folder',run:()=>openExplorer('home')},{label:'New folder',icon:'folder',run:()=>createFile(dir,'folder')},{label:'New note',icon:'notes',run:()=>openNotes()},{label:'New HTML document',icon:'code',run:()=>createFile(dir,'html')},null,{label:'Import files',icon:'upload',run:()=>chooseImport(dir)},{label:'Connect local folder',icon:'mount',run:mountFolder},{label:'Save',icon:'save',hint:'Ctrl S',disabled:!active?.save,run:()=>active?.save()},{label:'Close window',icon:'close',disabled:!active,run:()=>active&&wm.close(active)}]);};
  $('#top-view').onclick=e=>{const rect=e.currentTarget.getBoundingClientRect();showMenu(rect.left,rect.bottom+4,[{label:'Show desktop',icon:'desktop',run:()=>{for(const w of wm.windows.values())if(!w.minimized)wm.minimize(w);}},{label:'Show all windows',icon:'restore',run:()=>{for(const w of wm.windows.values())if(w.minimized)wm.restore(w);}},{label:'Full screen',icon:'fullscreen',run:toggleFullscreen},{label:'Refresh workspace',icon:'refresh',run:()=>{renderDesktop();fs.notify();}},null,{label:'Appearance',icon:'sun',run:()=>openSettings('appearance')},{label:'Desktop preferences',icon:'settings',run:()=>openSettings('desktop')}]);};
  document.addEventListener('keydown',e=>{if(e.defaultPrevented)return;const ctrl=e.ctrlKey||e.metaKey;if(ctrl&&e.code==='Space'){e.preventDefault();toggleLauncher();}else if(e.key==='Escape'){closeMenus();$('#launcher').hidden=true;}else if(ctrl&&e.key.toLowerCase()==='s'){const w=wm.windows.get(wm.active);if(w?.save){e.preventDefault();Promise.resolve(w.save()).catch(report);}}});

  async function boot(){try{await seedFiles();try{prefs=sanitizePreferences(JSON.parse(await fs.readFile('/.moss/settings.json','utf8')));}catch{}applyPreferences();await applyWallpaper();await renderDesktop();if(prefs.openHome)await openExplorer('home');await restoreMountRegistry();if(fs.mode!=='OPFS'){const temporary=fs.mode==='Temporary session';toast(temporary?'Storage is unavailable. This is a temporary session; export your files before closing.':`Using ${fs.mode} because OPFS is unavailable in this context. HTTPS or localhost is recommended.`,temporary?'error':'info',{label:'Storage',run:()=>openSettings('storage')});}cacheWallpaper();setTimeout(()=>runSelfTests().then(result=>{if(result.failed)toast('Some file-system checks need attention. See Settings > About.','error',{label:'Check',run:()=>openSettings('about')});}).catch(report),1200);}catch(error){report(error);$('#active-app-name').textContent='Desktop';toast('Storage setup could not finish. Open Settings to inspect the browser capabilities.','error',{label:'Settings',run:()=>openSettings('about')});}}
  boot();
