    const welcome='# 欢迎来到栖境\n\n留一隅，自在生长。\n\n这里是一个属于你的浏览器工作空间。没有账号，也没有服务器。你看到的这份文档，以及接下来写下的文字、收藏的图片，都通过统一的 fs API 保存到设备上的私有文件系统。\n\n## 从这里开始\n\n- 单击桌面图标打开应用；文件管理器默认双击打开。\n- 将设备上的文件或整个文件夹拖到桌面，即可导入。\n- Ctrl / Shift 多选，拖动空白区域框选，右键查看更多操作。\n- 触摸设备可直接拖动桌面图标；文件列表长按后拖动，短滑动滚动。\n- 文件与文件夹都可通过“导出 / 下载”带回设备。\n\n## 一些顺手的工具\n\n记事本支持文本与 CSV / TSV 表格双视图。HTML 编辑器提供 CodeMirror、多语言高亮、隔离实时预览和查找替换。\n\n点击图片，会把同一目录里的图片按自然数字顺序载入连续阅读器。浏览器原生支持的音频、视频和 PDF 也能直接打开。\n\n## 文件属于你\n\n默认使用 OPFS。不可用时降级到 IndexedDB，最后才是受容量限制的 LocalStorage。Cookie 只记住主题。\n\n在设置中可以挂载真实本地文件夹。挂载后的编辑与删除会直接修改设备文件。刷新页面后请重新授权。\n\n浏览器存储不是永久备份。清理站点数据可能删除私有文件，请在“设置 > 存储空间”定期导出备份。\n\n## 快捷键\n\nCtrl S：保存文档\nCtrl F / Ctrl H：查找 / 替换\nCtrl Enter：运行网页预览\nCtrl Shift F：格式化代码\nCtrl C / X / V：复制 / 剪切 / 粘贴文件\nCtrl A：选择全部文件\nF2：重命名\nDelete：移到回收站\nAlt Tab：切换栖境窗口（浏览器允许时）\n\n愿每一个小小的开始，都在这里找到自己的方向。\n';

      [HOME+'/配色灵感.json',JSON.stringify({name:'山野来信',colors:{松绿:'#456952',晨光:'#f3f5e9',远山:'#97ac91',湖水:'#9dbcb7',纸笺:'#e8dcc3'},note:'颜色可以从每一次散步开始收集。'},null,2)],
      [DESKTOP+'/开始阅读.md',welcome],
      [DOCS+'/使用指南.md',welcome],
      [DOCS+'/随手记.txt','把还没成形的想法写在这里。\n'],
      [SYSTEM+'/trash.json','[]'],[SYSTEM+'/calculator.json',JSON.stringify({history:[],memory:0})],[SYSTEM+'/terminal-history.json','[]']
    ];for(const [path,data]of seeded)if(!await fs.exists(path))await fs.writeFile(path,data);
    for(const folder of ['工作笔记','生活手记','收藏与资料'])await fs.mkdir(DOCS+'/'+folder,{recursive:true});
    const vector=$('#wallpaper-fallback').cloneNode(true);vector.removeAttribute('id');vector.setAttribute('xmlns','http://www.w3.org/2000/svg');vector.setAttribute('width','1600');vector.setAttribute('height','1000');const svg=new XMLSerializer().serializeToString(vector);await fs.writeFile(PICTURES+'/01-山间来信.svg',svg);await fs.writeFile(PICTURES+'/02-暮色.svg',svg.replaceAll('#d8e0d2','#e9d7bc').replaceAll('#b1c5b7','#c7b8a3').replaceAll('#a2bbae','#b9a18d').replaceAll('#7d9e91','#978f78').replaceAll('#527b6e','#6c7c67'));await fs.writeFile(PICTURES+'/10-湖光.svg',svg.replaceAll('#d8e0d2','#dce7e4').replaceAll('#b1c5b7','#b3c9c9').replaceAll('#94b5aa','#8bb3b9').replaceAll('#537e74','#517d85'));
    await fs.mkdir(HOME+'/项目/一个小网站',{recursive:true});await fs.writeFile(HOME+'/项目/一个小网站/index.html','<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"><title>一个小网站</title></head><body><main><p>QIJING / MY LITTLE WEBSITE</p><h1>从这里，开始。</h1><button id="hello">向世界打个招呼</button></main><script src="script.js"><'+'/script></body></html>');await fs.writeFile(HOME+'/项目/一个小网站/style.css','body { margin: 0; background: #f3f5e9; color: #456952; font-family: Georgia, serif; }\nmain { padding: 12%; }\nh1 { font-size: 48px; font-weight: 400; }\np { letter-spacing: 3px; font-size: 11px; }\nbutton { padding: 12px 20px; border: 1px solid #93a77c; background: transparent; color: inherit; cursor: pointer; }\n');await fs.writeFile(HOME+'/项目/一个小网站/script.js','document.getElementById("hello").onclick = function () { this.textContent = "你好，世界。"; };\n');await fs.writeFile(SYSTEM+'/initialized.json',JSON.stringify({version:1,created:Date.now()}));

  // ---------- Desktop wiring: usable immediately, with no simulated boot screen ----------
  desktopSelection=new SelectionController($('#desktop-icons'),{

    context:(node,x,y)=>{

        {label:'打开 '+(node.dataset.name||''),icon:'external',run:()=>launchApp(node.dataset.app)},
        {label:'多选模式',icon:'select',run:()=>{desktopSelection.multi=!desktopSelection.multi;desktopSelection.refresh();}},
        {label:'整理图标',icon:'grid',run:()=>{prefs.positions={};persistPreferences();renderDesktop();}},
        {label:'移除桌面快捷方式',icon:'trash',run:()=>{setPreference('hiddenShortcuts',[...new Set([...prefs.hiddenShortcuts,...records.map(r=>r.id)])]);renderDesktop();toast('已移除快捷方式，应用仍可从启动器打开。');}},

    }

  $('#launcher').addEventListener('contextmenu',e=>{
    const node=e.target.closest('.launcher-app');if(!node)return;e.preventDefault();
    const app=APPS.find(a=>a.name===node.textContent.trim());if(!app)return;
    contextMenu(e.clientX,e.clientY,[{label:'打开 '+app.name,icon:'external',run:()=>launchApp(app.id)},{label:'添加到桌面',icon:'desktop',run:async()=>{
      await fsReady;const builtIn=desktopShortcuts.find(s=>s.app===app.id);
      if(builtIn){setPreference('hiddenShortcuts',prefs.hiddenShortcuts.filter(id=>id!==builtIn.id));await renderDesktop();}
      else{const path=await uniquePath(DESKTOP,app.name+'.qapp');await fs.writeFile(path,JSON.stringify({app:app.id,name:app.name}));}
      toast('快捷方式已添加到桌面。','success');
    }}]);
  });
  registerDropZone($('#desktop'),()=>DESKTOP,{desktop:true});
  $('#desktop').addEventListener('contextmenu',e=>{if(e.target.closest('[data-item]'))return;e.preventDefault();desktopMenu(e.clientX,e.clientY);});
  $('#desktop').addEventListener('pointerdown',e=>{WM.active=null;for(const w of WM.windows.values())w.el.classList.remove('focused');if(!e.target.closest('[data-item]'))$('#desktop').focus({preventScroll:true});renderDock();window.dispatchEvent(new CustomEvent('qijing-window-focus',{detail:null}));});
  $('#brand-button').onclick=toggleLauncher;$('#desktop-menu-button').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();desktopMenu(r.left,r.bottom+7);};
  $('#file-menu-button').onclick=e=>{const dir=WM.active?.type==='explorer'?WM.active.state.dir:DESKTOP;menuAt(e.currentTarget,[{label:'打开文件管理器',icon:'folder',run:()=>openExplorer(HOME)},{label:'新建文件夹',icon:'plus',run:()=>createFolder(dir)},{label:'新建文本文档',icon:'file',run:()=>createDocument(dir)},{label:'新建网页',icon:'code',run:()=>createDocument(dir,'html')},'-',{label:'导入文件',icon:'upload',run:()=>importPicker(dir)},{label:'挂载本地文件夹',icon:'link',run:mountDirectory}]);};
  $('#view-menu-button').onclick=e=>menuAt(e.currentTarget,[{label:'显示桌面',icon:'desktop',run:()=>WM.showDesktop()},{label:'应用启动器',icon:'grid',run:toggleLauncher},{label:'全屏模式',icon:'fullscreen',run:toggleSystemFullscreen},'-',{label:'刷新文件视图',icon:'refresh',run:()=>{renderDesktop();for(const w of WM.windows.values())w.refresh?.();}},{label:'外观与壁纸',icon:'image',run:()=>openSettings()}]);
  $('#theme-quick').onclick=()=>setPreference('theme',document.documentElement.dataset.theme==='dark'?'light':'dark');$('#user-button').onclick=safe(()=>openSettings('appearance'));
  $('#system-quick').onclick=e=>menuAt(e.currentTarget,[{heading:'系统状态'},{label:fs.backendLabel+' · 本地文件存储',icon:'drive',run:()=>openSettings('storage')},{label:navigator.onLine?'网络已连接':'当前处于离线状态',icon:'wifi',run:()=>openSettings('diagnostics')},{label:'文件夹挂载',icon:'link',run:()=>openSettings('mounts')},{label:'偏好设置',icon:'sliders',run:()=>openSettings('preferences')},{label:'系统诊断',icon:'shield',run:()=>openSettings('diagnostics')}]);
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context-menu'))$('#context-menu').hidden=true;if(!e.target.closest('#launcher,#brand-button,[data-dock=launcher]'))$('#launcher').hidden=true;});
  document.addEventListener('keydown',e=>{if(e.defaultPrevented||$('.modal-scrim'))return;if(e.key==='Escape'){$('#context-menu').hidden=true;$('#launcher').hidden=true;desktopSelection.multi=false;desktopSelection.refresh();return;}if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();toggleLauncher();return;}if(e.altKey&&e.key==='Tab'){const windows=[...WM.windows.values()].sort((a,b)=>Number(b.el.style.zIndex)-Number(a.el.style.zIndex));if(windows.length){e.preventDefault();WM.restore(windows[WM.active?1%windows.length:0]);}return;}if(e.target.closest('input,textarea,[contenteditable=true],.CodeMirror'))return;const selection=WM.active?.type==='explorer'?WM.active.selection:!WM.active?desktopSelection:null;if(!selection)return;const dir=WM.active?.type==='explorer'?WM.active.state.dir:DESKTOP,paths=selection.records().filter(r=>r.path).map(r=>r.path),ctrl=e.ctrlKey||e.metaKey;const key=e.key.toLowerCase();if(ctrl&&key==='a'){e.preventDefault();selection.all();}else if(ctrl&&key==='c'&&paths.length){e.preventDefault();copyFiles(paths);}else if(ctrl&&key==='x'&&paths.length){e.preventDefault();copyFiles(paths,true);}else if(ctrl&&key==='v'&&fileClipboard.paths.length){e.preventDefault();safe(()=>pasteFiles(dir))();}else if(ctrl&&e.shiftKey&&key==='n'){e.preventDefault();safe(()=>createFolder(dir))();}else if(e.key==='F2'&&paths.length===1){e.preventDefault();safe(()=>renamePath(paths[0]))();}else if(e.key==='Delete'&&paths.length){e.preventDefault();safe(()=>trashPaths(paths))();}else if(e.key==='Enter'&&paths.length===1){e.preventDefault();safe(()=>openPath(paths[0]))();}else if(e.key==='F5'){e.preventDefault();renderDesktop();WM.active?.refresh?.();}});
  document.addEventListener('paste',e=>{if(e.target.closest('input,textarea,[contenteditable=true],.CodeMirror'))return;const files=[...(e.clipboardData?.files||[])];if(files.length&&(!WM.active||WM.active.type==='explorer')){e.preventDefault();safe(()=>importFiles(files,WM.active?.state.dir||DESKTOP))();}});
  window.addEventListener('beforeunload',e=>{if([...WM.windows.values()].some(w=>w.dirty)){e.preventDefault();e.returnValue='';}});
  window.addEventListener('unhandledrejection',e=>{e.preventDefault();if(!resetting)report(e.reason);});
  window.addEventListener('resize',debounce(()=>{renderDesktop().catch(report);if(!isMobile()){const layer=$('#window-layer');for(const w of WM.windows.values()){if(w.maximized||w.minimized||w.closed)continue;const width=Math.min(w.el.offsetWidth,layer.clientWidth-15),height=Math.min(w.el.offsetHeight,layer.clientHeight-10);Object.assign(w.el.style,{width:width+'px',height:height+'px',left:clamp(parseFloat(w.el.style.left),0,layer.clientWidth-width)+'px',top:clamp(parseFloat(w.el.style.top),0,layer.clientHeight-height)+'px'});w.onResize?.();}}},180));
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(prefs.theme==='auto')applyPreferences();});
  function tickClock(){const date=new Date(),clock=date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:prefs.clockSeconds?'2-digit':undefined,hour12:!prefs.clock24});$('#top-clock').textContent=clock;$('#top-clock').dateTime=date.toISOString();$('#top-clock').title=date.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#desktop-time').textContent=date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:!prefs.clock24});$('#desktop-date').textContent=date.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}).replace('日','日  ');}
  function updateNetwork(){const online=navigator.onLine;$('#network-label').textContent=online?'已连接':'离线';$('#network-status').title=online?'网络可用。你的文件仍保存在本地。':'当前离线，已加载的应用与本地文件仍可使用。';}
  window.addEventListener('online',()=>{updateNetwork();toast('网络已恢复。');});window.addEventListener('offline',()=>{updateNetwork();toast('已离线。本地文件仍然可以读取和保存。');});
  tickClock();setInterval(tickClock,1000);updateNetwork();renderDock();
  fsReady=(async()=>{
    await fs.init();await seedFilesystem();
    try{prefs=normalizePreferences(JSON.parse(await fs.readFile(SYSTEM+'/settings.json','utf8')));}catch{prefs=normalizePreferences(prefs);}
    preferencesReady=true;applyPreferences();await applyWallpaper();
    try{mountRecords=(await meta.entries('mounts')).map(([,record])=>record).filter(r=>r?.handle&&r?.path);for(const record of mountRecords){try{if(await fs.exists(record.path))await fs.delete(record.path,{recursive:false});}catch{}}}catch{mountRecords=[];}
    try{const marker=JSON.parse(await fs.readFile(SYSTEM+'/persistence-check.json','utf8'));window.persistenceVerification=`跨刷新验证：已读回 ${new Date(marker.written).toLocaleString('zh-CN')} 写入的标记（${marker.backend}）。`;}catch{window.persistenceVerification='跨刷新验证：请先运行自检，再刷新页面查看结果。';}
    try{localStorage.setItem('qijing:backend',fs.mounts.get('/').id);}catch{}
    return fs;
  })();
  fsReady.then(async()=>{await renderDesktop();const refreshDesktop=debounce(()=>{if(!resetting)renderDesktop().catch(report);},160);fs.addEventListener('change',e=>{if(resetting)return;if(e.detail.paths.some(p=>p===DESKTOP||pathUtil.dirname(p)===DESKTOP||p==='/'))refreshDesktop();for(const [path,entry]of dragCache){if(e.detail.paths.some(p=>p===path||path.startsWith(p+'/'))){dragCache.delete(path);if(entry.url)setTimeout(()=>URL.revokeObjectURL(entry.url),10000);clearTimeout(entry.timer);}}});if(prefs.startupExplorer&&!new URLSearchParams(location.search).has('desktop'))await openExplorer(HOME);if(fs.backendLabel!=='OPFS')toast(`当前使用 ${fs.backendLabel} 降级存储。你的文件仍会保存，请定期导出备份。`,'info',{label:'查看存储状态',run:()=>openSettings('storage')},8000);if(mountRecords.length)toast(`发现 ${mountRecords.length} 个以前挂载的文件夹，请重新授权连接。`,'info',{label:'管理挂载',run:()=>openSettings('mounts')},9000);if(new URLSearchParams(location.search).has('selftest')){const result=await runSelfTests(line=>console.info(line));toast(`自检结果：${result.passed} 项通过，${result.failed} 项失败。`,result.failed?'error':'success',{label:'查看诊断',run:()=>openSettings('diagnostics')});}const preset=WALLPAPERS.find(p=>p.id===prefs.wallpaper);if(preset)setTimeout(()=>cacheWallpaper(preset),800);}).catch(error=>{console.error('Storage initialization failed',error);toast('无法初始化持久存储：'+errorText(error),'error',{label:'重试',run:()=>location.reload()},0);});
