  root.querySelector('#set-backend').textContent = fs.backend==='opfs'?'OPFS（原生持久化）':'IndexedDB（降级模式）';
  root.querySelector('#set-mount').onclick=mountLocalFolder;
  root.querySelector('#set-reset').onclick=async()=>{ if(await confirm2('重置系统','这将永久删除所有文件、文件夹和设置，无法撤销。')){ await fs.wipe(); localStorage.removeItem('ember_iconpos'); localStorage.removeItem('ember_mounts'); iconPositions={}; await seedFS(); renderDesktop(); refreshExplorers(); toast('系统已重置','ok'); refreshStorage(); } };

  async function refreshStorage(){
    const est=await fs.estimate(); const usage=est.usage||0, quota=est.quota||1;
    // categorize by walking VFS
    const cats={图片:0,音视频:0,文档代码:0,其他:0};
    async function walk(p){ let items=[]; try{items=await fs.readdir(p);}catch(e){return;} for(const n of items){ if(p.startsWith('/mnt'))continue; const fp=p==='/'?'/'+n:p+'/'+n; let s; try{s=await fs.stat(fp);}catch(e){continue;} if(s.isDirectory){await walk(fp);}else{ const e=extOf(n); if(['png','jpg','jpeg','gif','svg','webp','bmp','ico'].includes(e))cats.图片+=s.size; else if(['mp3','wav','ogg','mp4','webm','flac','aac','ogv'].includes(e))cats.音视频+=s.size; else if(['txt','html','css','js','json','md','csv','tsv','xml','pdf'].includes(e))cats.文档代码+=s.size; else cats.其他+=s.size; } } }
    try{ for(const r of ['/Desktop','/Documents','/Pictures','/System']) if(await fs.exists(r)) await walk(r); }catch(e){}
    const fileTotal=Object.values(cats).reduce((a,b)=>a+b,0);
    const colors={图片:'#8fae7c',音视频:'#cf7e7e',文档代码:'#7fa6c4',其他:'#e8a13c'};
    const bar=root.querySelector('#set-bar'); bar.innerHTML='';
    const display=Math.max(usage,fileTotal,1);
    Object.entries(cats).forEach(([k,v])=>{ if(v>0){const i=document.createElement('i');i.style.width=(v/display*100)+'%';i.style.background=colors[k];bar.appendChild(i);} });
    const used=document.createElement('i'); const known=fileTotal; const sys=Math.max(0,usage-known); if(sys>0){const i=document.createElement('i');i.style.width=(sys/display*100)+'%';i.style.background='#473829';i.title='系统/元数据';bar.appendChild(i);}
    root.querySelector('#set-legend').innerHTML=Object.entries(cats).map(([k,v])=>`<span><i style="background:${colors[k]}"></i>${k} ${fmtSize(v)}</span>`).join('')+`<span><i style="background:#473829"></i>系统 ${fmtSize(Math.max(0,usage-fileTotal))}</span>`;
    root.querySelector('#set-info').textContent=`已用 ${fmtSize(usage)} / 配额 ${fmtSize(quota)}（${(usage/quota*100).toFixed(1)}%）`;
  }
  refreshStorage();
  return win;
}

/* ============================================================
   SEED FILESYSTEM (first run)
   ============================================================ */
async function seedFS(){
  for(const d of ['/Desktop','/Documents','/Pictures','/System','/mnt','/mnt/local']){ if(!(await fs.exists(d))) await fs.mkdir(d); }
  if(!(await fs.exists('/System/.seeded'))){
    await fs.writeFile('/Desktop/欢迎.txt', `欢迎使用 EMBER OS\n\n这是一个完全运行在浏览器中的桌面系统。\n所有文件都通过 OPFS 持久化存储，刷新后依然保留。\n\n• 双击图标打开文件或文件夹\n• 右键桌面新建/上传/挂载/换壁纸\n• 拖拽图标可自由摆放（吸附网格）\n• 把电脑文件拖进来即可导入\n• 文件可拖出浏览器下载\n\n尽情探索吧。`);
    await fs.writeFile('/Desktop/示例网页.html', `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:Georgia,serif;background:linear-gradient(135deg,#2a1e16,#16110d);color:#f0e6d8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column}h1{color:#e8a13c;font-size:48px}p{color:#b3a18c}</style></head><body><h1>Hello, Ember</h1><p>这是一个内置示例 HTML 文件，支持实时预览与编辑。</p></body></html>`);
    await fs.writeFile('/Documents/数据示例.csv', `名称,类型,大小\n报告.pdf,文档,2.4MB\n照片.jpg,图片,1.1MB\n音乐.mp3,音频,4.8MB\n脚本.js,代码,12KB`);
    await fs.writeFile('/Documents/笔记.md', `# 我的笔记\n\n- EMBER OS 使用 OPFS 持久化\n- 支持 *Markdown* 文本编辑\n- 支持 \`代码\` 高亮显示\n\n## 待办\n1. 探索文件管理器\n2. 尝试画板\n3. 挂载本地文件夹`);
    // a tiny svg image
    await fs.writeFile('/Pictures/标志.svg', `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#16110d"/><circle cx="100" cy="100" r="70" fill="none" stroke="#e8a13c" stroke-width="6" stroke-dasharray="20 14"/><path d="M100 50 L140 140 L60 140 Z" fill="#d2632a"/><circle cx="100" cy="155" r="14" fill="#f0c074"/></svg>`);
    await fs.writeFile('/System/.seeded','1');
  }
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  const status=document.getElementById('boot-status');
  try{
    status.textContent='MOUNTING FILESYSTEM…';
    const be=await fs.init();
    status.textContent='SEEDING SYSTEM FILES…';
    await seedFS();
    status.textContent='LOADING DESKTOP…';
    await applyWallpaper(localStorage.getItem('ember_wp')||'ember');
    await renderDesktop();
    clock();
    if(be!=='opfs') toast('OPFS 不可用，已降级到 IndexedDB','err');
  }catch(e){ console.error(e); status.textContent='ERROR: '+e.message; toast('启动错误: '+e.message,'err'); }
  setTimeout(()=>{ document.getElementById('boot').classList.add('gone'); setTimeout(()=>document.getElementById('boot').remove(),900); checkRemount(); }, 1800);
}

// reposition icons on resize for mobile
window.addEventListener('resize',()=>{ Object.values(WINS).forEach(w=>{ if(isMobile()&&!w.maximized){ w.el.style.left='6px';w.el.style.top='6px';w.el.style.width=(window.innerWidth-12)+'px';w.el.style.height=(window.innerHeight-80)+'px'; } }); });
// prevent native dragover default flashing
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ if(!e.target.closest('#icon-layer')&&!e.target.closest('.fe-list')) e.preventDefault(); });

boot();
</script>
