.stringify({version:1,created:Date.now()}))}}
  const desktopRefresh=debounce(()=>renderDesktop(),160);fs.addEventListener('change',e=>{const d=e.detail;DragCache.invalidate(d.path);if(d.from)DragCache.invalidate(d.from);if(parent(d.path)===fs.desktop||d.path===fs.desktop||d.from&&parent(d.from)===fs.desktop||['mount','unmount'].includes(d.operation))desktopRefresh()});
  async function boot(){try{await fs.ready;const settingsPath=join(fs.systemRoot,'.miixi','settings.json');if(await fs.exists(settingsPath)){try{const stored=JSON.parse(await fs.readFile(settingsPath,'utf8'));if((stored.updatedAt||0)>=(prefs.updatedAt||0))prefs={...defaultPrefs,...stored};if(!fs.mounts.has('/'+prefs.backend))prefs.backend=fs.systemRoot.slice(1)}catch(e){console.warn('Settings recovery:',e)}}applyPrefs();await seedFilesystem();await renderDesktop();await openExplorer(fs.home);if(fs.pendingMounts.length){const note=toast('本地目录等待重新授权',`${fs.pendingMounts.length} 个目录需要重新连接，点击此提示前往存储设置。`,8500);note.el.style.cursor='pointer';note.el.addEventListener('click',()=>{note.close();guarded(openSettings)('storage')})}if(!window.isSecureContext)toast('当前不是安全上下文','部分原生文件能力不可用。建议使用 HTTPS 或 localhost。',7000);const run=()=>runDiagnostics().then(result=>{if(!result.passed)toast('文件系统自检发现问题','请打开设置 → 系统与诊断查看具体结果。',9000,'error')}).catch(e=>console.warn('Diagnostics:',e));if(window.requestIdleCallback)requestIdleCallback(run,{timeout:4000});else setTimeout(run,1800);savePrefs()}catch(e){report(e,'系统存储初始化未完成');$('#storage-status').innerHTML='<i class="storage-light" style="background:#d99679"></i><span>存储不可用</span>';$('#desktop').innerHTML='<div style="position:absolute;left:30px;top:40px;max-width:400px;color:#e3e7d9"><h1 style="font-size:24px;font-weight:400;margin:0 0 14px">需要一片安全的存储空间。</h1><p style="font-size:12px;line-height:2;color:#b0bba4">请通过 HTTPS 或 localhost 打开这个单文件页面，并允许浏览器使用站点存储。系统不会假装保存文件，也不会把你的数据退化为临时内存。</p><button class="btn" style="margin-top:20px" onclick="location.reload()">重新尝试</button></div>'}}
  // Touch names move files; thumbnails and detail cells retain native scrolling.
  $('#window-layer').addEventListener('touchstart',event=>{
    if(event.target.closest('.file-item')&&!event.target.closest('.file-name'))event.stopPropagation();
  },{capture:true,passive:true});
  boot();
  </script>
