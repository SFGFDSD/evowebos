  async function runDiagnostics(container){container.innerHTML='';const root=SYSTEM+'/diagnostic-'+Date.now(),lines=[];const add=(name,state,message)=>{const el=document.createElement('div');el.className='diagnostic-line';el.innerHTML=`<span class="${state==='pass'?'test-pass':state==='fail'?'test-fail':'muted'}">${icon(state==='pass'?'check':state==='fail'?'close':'help','small')}</span><span class="grow">${esc(name)}<br><span class="muted" style="font-size:10px">${esc(message)}</span></span>`;container.append(el);lines.push({name,state,message});};async function test(name,fn){try{const message=await fn();add(name,'pass',message||'通过');}catch(e){add(name,'fail',e.message);}}await fs.mkdir(root);try{await test('UTF-8 文本持久写入与读取',async()=>{const text='青屿 / Qingyu\n真实文件系统测试';await fs.writeFile(root+'/文本.txt',text);if(await fs.readFile(root+'/文本.txt','utf8')!==text)throw Error('读写不一致');return fs.backendName+' · 内容逐字校验一致';});await test('二进制 ArrayBuffer / Blob',async()=>{const data=new Uint8Array([0,1,127,128,255,0,42]);await fs.writeFile(root+'/binary.bin',data.buffer);const result=new Uint8Array(await fs.readFile(root+'/binary.bin','arraybuffer'));if(result.length!==data.length||result.some((v,i)=>v!==data[i]))throw Error('二进制不一致');return '全部 7 字节一致，包括空字节';});await test('目录、复制、移动、删除',async()=>{await fs.mkdir(root+'/a/b');await fs.copy(root+'/文本.txt',root+'/a/b/copy.txt');await fs.rename(root+'/a/b/copy.txt',root+'/moved.txt');if(await fs.exists(root+'/a/b/copy.txt')||!await fs.exists(root+'/moved.txt'))throw Error('移动结果不一致');await fs.delete(root+'/a');if(await fs.exists(root+'/a'))throw Error('目录未移除');return '跨目录复制后才删除源文件';});await test('额外参数与 callback 签名',async()=>{const stat=await new Promise((resolve,reject)=>fs.stat(root+'/文本.txt',true,{unused:true},(err,value)=>err?reject(err):resolve(value)));if(!stat.isFile()||!stat.size||!stat.mtime)throw Error('stat 返回值不完整');const text=await new Promise((resolve,reject)=>fs.readFile(root+'/文本.txt','utf8','r',(err,value)=>err?reject(err):resolve(value)));if(!text.startsWith('青屿'))throw Error('readFile 参数兼容失败');return 'Promise 与 callback 均正确返回';});await test('自然数字排序',()=>{const sorted=['10.jpg','1.jpg','2.jpg'].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}));if(sorted.join(',')!=='1.jpg,2.jpg,10.jpg')throw Error('排序错误');return sorted.join(' → ');});await test('CSV 多行、分隔符和转义',()=>{const data=[['a,b','一行\n二行','他说"你好"'],['','末行','42']];if(JSON.stringify(parseDelimited(serializeDelimited(data)))!==JSON.stringify(data))throw Error('CSV 往返不一致');return '带逗号、换行、双引号的单元格往返一致';});await test('无依赖 ZIP 打包与解包',async()=>{const zip=await nativeZip([{name:'test.txt',blob:new Blob(['Qingyu ZIP'])}]),files=await nativeUnzip(zip,1024*1024);if(files.length!==1||await files[0].blob.text()!=='Qingyu ZIP')throw Error('ZIP 往返不一致');return '本地文件头、中央目录与 CRC32 校验通过';});await test('归档路径安全校验',()=>{for(const path of ['../escape','/absolute','C:/windows','a/../../escape']){let rejected=false;try{safeArchivePath(path);}catch{rejected=true;}if(!rejected)throw Error('未拒绝 '+path);}return '拒绝绝对路径、盘符与父目录穿越';});await test('计算器表达式解析',()=>{if(evaluateArithmetic('(2+3)*4')!==20||evaluateArithmetic('50%*200')!==100||evaluateArithmetic('-2*-3')!==6)throw Error('运算结果异常');return '括号、百分数和一元负号正确';});const previous=await metadata.get('diagnostic-persistence');if(previous&&previous.session!==BOOT_SESSION)add('跨会话存储记录','pass','已读取上次会话记录：'+new Date(previous.time).toLocaleString('zh-CN'));else add('跨刷新持久化','info','已写入检查标记；请刷新后再次运行，才能验证跨会话保留。');await metadata.set('diagnostic-persistence',{session:BOOT_SESSION,time:Date.now()});add('当前浏览器能力','info',`安全上下文：${isSecureContext?'是':'否'}；存储后端：${fs.backendName}；本地目录挂载：${window.showDirectoryPicker?'支持':'不支持'}；原生全屏：${document.fullscreenEnabled?'支持':'不支持'}`);}finally{await fs.delete(root).catch(console.warn);}await fs.writeFile(SYSTEM+'/diagnostic-report.json',JSON.stringify({time:new Date().toISOString(),lines},null,2));return lines;}
  async function openSettings(initial='appearance'){await fs.ready;const w=WM.create({title:'系统设置',icon:'settings',type:'settings',width:775,height:585});w.body.innerHTML='<div class="settings-layout"><nav class="settings-nav"></nav><div class="settings-page"></div></div><div class="statusbar"><span class="grow">偏好即时生效，并同步到本地文件系统</span><span class="mono">QINGYU / SETTINGS</span></div>';const pages=[['appearance','外观','paint'],['desktop','桌面与行为','files'],['storage','存储空间','drive'],['mounts','本地挂载','link'],['system','系统与诊断','settings']];let page=initial,generation=0;for(const [id,label,i]of pages){const b=document.createElement('button');b.dataset.page=id;b.title=label;b.innerHTML=icon(i,'small')+`<span>${label}</span>`;b.onclick=()=>render(id).catch(report);$('.settings-nav',w.body).append(b);}const content=$('.settings-page',w.body);const select=(key,options)=>`<select data-pref="${key}" aria-label="${key}">${options.map(([value,label])=>`<option value="${value}" ${String(prefs[key])===String(value)?'selected':''}>${label}</option>`).join('')}</select>`;const toggle=key=>`<input type="checkbox" data-pref="${key}" ${prefs[key]?'checked':''} aria-label="${key}">`;const range=(key,min,max,step=1)=>`<div style="display:flex;gap:9px;align-items:center"><input type="range" min="${min}" max="${max}" step="${step}" value="${prefs[key]}" data-pref="${key}" aria-label="${key}"><span class="mono range-value" style="font-size:10px;min-width:23px">${prefs[key]}</span></div>`;const row=(title,description,control)=>`<div class="setting-row"><label>${title}${description?'<small>'+description+'</small>':''}</label>${control}</div>`;

      else if(id==='desktop'){content.innerHTML=`<h2>顺手，比热闹重要。</h2><p>让文件与窗口跟随你的工作节奏。</p>${row('窗口边缘吸附','拖到左侧、右侧分屏，顶部最大化。',toggle('snap'))}${row('自动隐藏前面板','指针移到下方或聚焦时显示。',toggle('autoPanel'))}${row('桌面网格间距','图标仍可在网格内自由拖放。',range('grid',88,132,4))}${row('默认文件视图','新打开的文件夹采用此视图。',select('view',[['list','详细列表'],['grid','图标视图']]))}${row('显示隐藏文件','包括以点开头的系统目录。',toggle('showHidden'))}${row('删除前确认','回收站的永久删除始终需要确认。',toggle('confirmDelete'))}${row('24 小时时间','关闭后使用 12 小时制。',toggle('clock24'))}<div class="settings-section">创作偏好</div>${row('自动保存间隔','输入时另写草稿日志；单位：毫秒。',select('autosave',[[250,'250 ms'],[650,'650 ms'],[1200,'1200 ms'],[2000,'2000 ms']]))}${row('代码编辑器字号','应用于所有打开的代码窗口。',range('editorSize',11,22))}${row('代码自动换行','不改变文件原本的换行内容。',toggle('wordWrap'))}${row('缩进宽度','新打开的编辑器使用此配置。',select('tabSize',[[2,'2 空格'],[4,'4 空格'],[8,'8 空格']]))}<div style="margin-top:22px"><button class="btn arrange">${icon('grid','small')}重新排列桌面图标</button></div>`;$('.arrange',content).onclick=()=>{prefs.desktopPositions={};persistPrefs();renderDesktop().catch(report);};}
      else if(id==='storage'){content.innerHTML='<h2>每一份文件，都有着落。</h2><p>正在统计文件系统的实际内容与浏览器配额…</p>';const [usage,estimate,persisted]=await Promise.all([fs.usage(),navigator.storage?.estimate?.().catch(()=>({}))||{},navigator.storage?.persisted?.().catch(()=>false)||false]);if(w.closed||current!==generation)return;const used=estimate.usage??usage.total,quota=estimate.quota,percent=quota?used/quota*100:0,colors=['#5e806b','#8a9c78','#b1a779','#818f9b','#b9bbae'];content.innerHTML=`<h2>每一份文件，都有着落。</h2><p>${fs.backendName} 优先的本地存储。挂载的真实文件夹不占用此配额。</p><div class="storage-head"><span class="storage-number">${bytes(used)}</span><small>站点已用${quota?' / '+bytes(quota)+' 浏览器配额':''}</small></div><div class="meter" style="height:9px"><span style="width:${Math.min(100,percent)}%"></span></div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:9px"><span>${quota?percent.toFixed(3)+'% 已占用':'浏览器未提供配额数据'}</span><span>${quota?'可用 '+bytes(Math.max(0,quota-used)):''}</span></div><div class="settings-section" style="margin-top:30px">虚拟文件内容构成 · ${usage.count} 个文件 · ${bytes(usage.total)}</div><div class="storage-chart">${Object.entries(usage.groups).filter(([,n])=>n>0).map(([label,size])=>`<span title="${label} ${bytes(size)}" style="width:${size/(usage.total||1)*100}%;background:${colors[Object.keys(usage.groups).indexOf(label)]}"></span>`).join('')}</div><div class="storage-legend">${Object.entries(usage.groups).map(([name,size],i)=>`<div><i style="background:${colors[i]}"></i>${name}<span class="mono">${bytes(size)}</span></div>`).join('')}</div><div class="notice">${persisted?'浏览器已授予持久存储保护。':'尚未获得持久存储保护；设备存储紧张时，浏览器可能回收数据。'}<br>配额由浏览器动态分配，不代表物理磁盘剩余容量。清除网站数据仍会删除文件。</div><div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn persist">${icon('drive','small')}申请持久保护</button><button class="btn backup">${icon('download','small')}导出个人文件</button><button class="btn empty-trash">清空回收站</button><button class="btn refresh-storage">重新统计</butt       else if(id==='mounts'){content.innerHTML='<h2>电脑上的文件，也在这里。</h2><p>使用同一套操作，读写真实文件夹与虚拟文件。所有修改会直接写回挂载目录。</p><button class="btn primary mount">'+icon('plus','small')+'挂载本地文件夹</button><div class="mount-list" style="margin-top:18px"></div><div class="notice">挂载路径：/mnt/local/文件夹名<br>浏览器刷新后可能需要重新授权；卸载只断开访问，不会删除电脑上的文件。</div>';$('.mount',content).onclick=guard(async()=>{await mountFolder();await render('mounts');});const saved=Database.db?await Database.run('handles','getAll').catch(()=>[]):[];if(w.closed||current!==generation)return;const records=new Map(saved.map(r=>[r.point,r]));for(const [point,backend]of fs.mounts)records.set(point,{point,handle:backend.root,name:basename(point)});const list=$('.mount-list',content);if(!records.size)list.innerHTML='<div class="empty" style="padding:28px 12px">'+icon('drive')+'<p>尚未挂载任何本地文件夹</p><small>需要支持目录选择器的浏览器，以及你的明确授权。</small></div>';for(const [point,record]of records){const active=fs.mounts.has(point),el=document.createElement('div');el.className='mount-row';el.innerHTML=`${icon('drive')}<div class="grow"><strong>${esc(record.name)}</strong><small>${esc(point)}</small><small>${active?'已挂载 · 修改会同步到电脑':'需要重新授权'}</small></div><button class="btn connect">${active?'打开':'重新授权'}</button><button class="btn disconnect">${active?'卸载':'移除记录'}</button>`;list.append(el);$('.connect',el).onclick=guard(async()=>{if(active)await openExplorer(point);else{const permission=await record.handle.requestPermission({mode:'readwrite'});if(permission!=='granted')throw Error('没有获得文件夹访问权限');await fs.mount(record.handle);await render('mounts');}});$('.disconnect',el).onclick=guard(async()=>{if(await dialog({title:'卸载文件夹',message:'不会删除真实文件。未保存的编辑请先保存。',confirm:'卸载'})){await Promise.all([...documentSessions].filter(s=>s.path===point||s.path.startsWith(point+'/')).map(s=>s.flush()));await fs.unmount(point);await render('mounts');}});}}
      else{content.innerHTML=`<h2>简单的桌面，认真的底层。</h2><p>青屿 Qingyu · 单文件 Web OS · 本地优先，没有后端。</p>${row('当前文件系统',fs.backendName==='OPFS'?'OPFS 内容 + IndexedDB 草稿/句柄 + 本地偏好 + 主题 Cookie':'OPFS 不可用，当前已降级；请留意此后端的容量与持久化限制。','<span class="mono" style="font-size:11px">'+fs.backendName+'</span>')}${row('虚拟机内存','v86 0.5.319，新启动的虚拟机生效。',select('vmRam',[[32,'32 MB'],[64,'64 MB'],[128,'128 MB'],[256,'256 MB'],[512,'512 MB']]))}${row('归档内存安全上限','打包、解压缩限制；增大可能造成内存不足。',select('archiveLimit',[[64,'64 MB'],[128,'128 MB'],[256,'256 MB'],[512,'512 MB'],[1024,'1024 MB']]))}<div class="settings-section">可用性与诊断</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary diagnostic">${icon('check','small')}运行真实读写检查</button><button class="btn open-report">查看检查报告</button><button class="btn guide">使用帮助</button></div><div class="diagnostic-results" style="margin-top:15px"></div><div class="notice">浏览器权限、编解码器、外部网页嵌入策略与 CDN 网络都可能限制相关功能。诊断结果来自当前设备，不会预设“全部通过”。</div><div class="settings-section">危险区域</div>${row('重置青屿桌面','删除本站虚拟文件、草稿与设置。不会删除已挂载的真实文件。','<button class="btn danger reset">重置系统</button>')}`;$('.diagnostic',content).onclick=guard(async e=>{const button=e.currentTarget;button.disabled=true;try{await runDiagnostics($('.diagnostic-results',content));}finally{button.disabled=false;}});$('.open-report',content).onclick=guard(async()=>{if(!await fs.exists(SYSTEM+'/diagnostic-report.json'))throw Error('请先运行检查');await openNotepad(SYSTEM+'/diagnostic-report.json');});$('.guide',content).onclick=guard(openHelp);$('.reset',content).onclick=guard(async()=>{const answer=await dialog({title:'重置青屿桌面',message:'此操作会永久删除虚拟文件和所有草稿。\n已挂载的真实文件夹不会被删除。\n请输入“重置”以确认，重要内容请先导出。',value:'',confirm:'删除虚拟数据并重启',danger:true});if(answer!=='重置'){if(answer!==null)toast('确认文字不匹配，未进行任何删除');return;}systemResetting=true;for(const win of [...WM.windows.values()])await WM.close(win,true);await fs.reset();location.reload();});}

  async function openHelp(){await fs.ready;const path=SYSTEM+'/guide.md';if(!await fs.exists(path))await fs.writeFile(path,'# 欢迎来到青屿\n\n一张安静、私有、可以长久使用的数字工作台。\n\n## 文件属于你\n\n所有文件通过统一 fs API 读写，优先保存在浏览器 OPFS。清除网站数据会删除虚拟文件，请定期导出。真实本地挂载需要安全上下文和浏览器支持。\n\n## 一个熟悉的桌面\n\n- 单击桌面图标打开，双击文件列表项目打开。\n- 拖动标题栏移动窗口，拖到屏幕边缘分屏。\n- 下方四个工作空间可以独立组织窗口。\n- 悬停任务按钮可以预览窗口；最右侧窄条用于查看桌面。\n\n## 文件的来与去\n\n- 拖入电脑文件与文件夹，可递归导入到当前目录。\n- 鼠标停留片刻让文件预读，再拖出浏览器。拖出支持取决于浏览器和宿主操作系统；导出按钮在所有设备上都可作为替代。\n- 触屏长按文件开始拖动；长按后松手进入多选模式。\n- 复制、移动、删除、解包，对挂载目录与虚拟目录完全一致。\n\n## 安心创作\n\n记事本、表格与代码编辑器有自动保存和独立草稿日志。重要文件仍建议备份。代码预览使用双层 iframe，将用户代码留在不透明源沙箱内。\n\n## 原生能力与边界\n\n图片、音视频、PDF 与字体依赖浏览器支持的编解码器。网站可用 CSP 或 X-Frame-Options 禁止嵌入，请使用浏览器的新标签页入口。无网络时增强代码编辑、7z 与 v86 可能不可用，原生文件操作和文本编辑仍可继续。\n\n## 虚拟机\n\n镜像由你导入，不会从外部链接下载系统镜像。v86 与 WASM 固定为 0.5.319，BIOS 使用固定 Git commit。双击虚拟机屏幕或点击锁定鼠标捕获输入，Esc 释放。客体磁盘变更需点击保存磁盘或保存状态持久化。\n');const text=await fs.readFile(path,'utf8'),w=WM.create({title:'关于青屿 · 使用帮助',icon:'help',type:'help',width:705,height:580});w.body.innerHTML=`<div class="toolbar"><span class="grow" style="font-family:var(--serif);font-size:17px;letter-spacing:3px">青屿 / QINGYU</span><button class="btn diagnostic">系统诊断</button><button class="btn export">导出指南</button></div><div class="document-preview grow">${markdownHTML(text)}<div class="help-shortcuts">${[['Ctrl / Cmd + S','保存文档'],['Ctrl / Cmd + F','查找'],['Ctrl / Cmd + H','替换'],['Ctrl + Enter','运行网页'],['Ctrl + Shift + F','代码格式化'],['Ctrl + A','全选文件'],['Ctrl + C / X / V','复制 / 剪切 / 粘贴'],['F2 / Delete','重命名 / 删除'],['Alt + F4','关闭窗口'],['Esc','退出沉浸 / 鼠标锁定']].map(([key,label])=>`<div><span>${label}</span><kbd>${key}</kbd></div>`).join('')}</div></div><div class="statusbar"><span class="grow">Common desktop, uncommon ideas.</span><span class="mono">CDE INSPIRED / LOCAL FIRST</span></div>`;$('.diagnostic',w.body).onclick=guard(()=>openSettings('system'));$('.export',w.body).onclick=guard(()=>exportPaths([path]));return w;}
  /* The desktop is visible immediately; only real filesystem initialization is awaited. */
  const APPS=[
    {id:'files',name:'文件管理器',keywords:'files folders wenjian',icon:'folder',open:()=>openExplorer(HOME)},
    {id:'notepad',name:'记事本',keywords:'text notes jishi',icon:'text',open:()=>openNotepad()},
    {id:'editor',name:'HTML 编辑器',keywords:'html code css js json markdown daima',icon:'editor',open:()=>openEditor()},
    {id:'browser',name:'网页浏览器',keywords:'web browser liulan',icon:'browser',open:()=>openBrowser()},
    {id:'sheet',name:'表格',keywords:'csv tsv sheet biaoge',icon:'sheet',open:()=>openSheet()},
    {id:'reader',name:'漫画阅读器',keywords:'image photo manga manhua',icon:'image',open:async()=>{const pictures=(await fs.readdir(HOME+'/图片')).filter(e=>e.kind==='file'&&isImage(e.name)).sort((a,b)=>natural(a.name,b.name));if(pictures.length)return openManga(pictures[0].path);toast('请先把图片导入此文件夹');return openExplorer(HOME+'/图片');}},
    {id:'paint',name:'画板',keywords:'paint draw huaban',icon:'paint',open:()=>openPaint()},
    {id:'calculator',name:'计算器',keywords:'calculator math jisuan',icon:'calculator',open:()=>openCalculator()},
    {id:'archive',name:'归档管理器',keywords:'zip 7z rar archive yasuo',icon:'archive',open:()=>openArchive()},
    {id:'vm',name:'虚拟机',keywords:'vm v86 iso dos x86',icon:'vm',open:()=>openVM()},
    {id:'settings',name:'系统设置',keywords:'settings theme storage shezhi',icon:'settings',open:()=>openSettings()},
    {id:'help',name:'青屿指南',keywords:'help about guide bangzhu',icon:'help',open:()=>openHelp()}
  ];
  let systemReady;
  async function launchApp(id){$('#launcher').hidden=true;await systemReady;if(id==='home')return openExplorer(HOME);if(id==='root')return openExplorer('/');if(id==='trash')return openExplorer(TRASH);if(id==='mount')return mountFolder();const app=APPS.find(a=>a.id===id);if(!app)throw Error('应用不存在');return app.open();}
  function renderLauncher(query=''){const list=$('#launcher-apps');list.innerHTML='';const matches=APPS.filter(app=>(app.name+' '+app.keywords).toLowerCase().includes(query.toLowerCase()));for(const app of matches){const b=document.createElement('button');b.className='launcher-app';b.innerHTML=icon(app.icon)+`<span>${esc(app.name)}</span>`;b.onclick=guard(()=>launchApp(app.id));list.append(b);}if(!matches.length)list.innerHTML='<p class="empty" style="grid-column:1/-1;padding:25px">没有匹配的应用</p>';}
  function toggleLauncher(){const root=$('#launcher');root.hidden=!root.hidden;if(!root.hidden){$('#app-search').value='';renderLauncher();setTimeout(()=>$('#app-search').focus(),30);}}
  $('#launcher-toggle').onclick=toggleLauncher;$('#top-launcher').onclick=toggleLauncher;$('#app-search').oninput=e=>renderLauncher(e.target.value);$('#app-search').onkeydown=e=>{if(e.key==='Enter')$('#launcher-apps button')?.click();if(e.key==='Escape')$('#launcher').hidden=true;};$$('[data-launch]').forEach(b=>b.onclick=guard(()=>launchApp(b.dataset.launch)));$('#top-settings').onclick=guard(()=>launchApp('settings'));$('#top-help').onclick=guard(()=>launchApp('help'));$('#launcher-about').onclick=guard(()=>launchApp('help'));$('#clock-settings').onclick=guard(()=>openSettings('desktop'));$('#desktop-menu').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();menu(r.left,r.bottom,[{heading:'桌面 · '+['日常','创作','阅读','留白'][WM.space]},...blankFileMenu(DESKTOP,renderDesktop,desktopSelection),null,{label:'显示桌面',icon:'files',action:()=>$('#peek-desktop').click()},{label:'切换深色 / 浅色',icon:'settings',action:()=>setPref('theme',prefs.theme==='light'?'dark':'light')},{label:'全屏模式',icon:'fullscreen',action:toggleFullscreen}]);};
  function updateClock(){const date=new Date(),time=date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:!prefs.clock24}),day=date.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}),weekday=['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];$('#top-clock').innerHTML=`<span class="top-date">${esc(day)} ${weekday}<span style="opacity:.35;margin:0 11px">/</span></span>${esc(time)}`;$('#panel-date').textContent=day.replaceAll('/','.');$('#clock-hour').setAttribute('transform',`rotate(${(date.getHours()%12)*30+date.getMinutes()*.5} 21 21)`);$('#clock-minute').setAttribute('transform',`rotate(${date.getMinutes()*6+date.getSeconds()*.1} 21 21)`);}
  updateClock();setInterval(updateClock,1000);renderLauncher();
  document.addEventListener('keydown',e=>{if($('.dialog-backdrop'))return;if(e.key==='Escape'){closeMenu();$('#launcher').hidden=true;WM.endPeek();}if(e.altKey&&e.key==='F4'&&WM.active){e.preventDefault();guard(()=>WM.close(WM.active))();return;}if(e.ctrlKey&&e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();WM.switch((WM.space+(e.key==='ArrowRight'?1:3))%4);return;}if(e.target.closest('input,textarea,select,[contenteditable="true"],.CodeMirror'))return;const c=activeSelection;if(!c)return;const owner=c.container.closest('.window');if(owner&&owner!==WM.active?.el)return;const control=e.ctrlKey||e.metaKey,key=e.key.toLowerCase(),paths=selectedPaths(c),dir=c.container.closest('[data-drop-directory]')?.dataset.dropDirectory||DESKTOP;let action;if(control&&key==='a')action=()=>{c.selected=new Set(c.items().map(el=>el.dataset.id));c.update();};else if(control&&key==='c'&&paths.length)action=()=>copyPaths(paths);else if(control&&key==='x'&&paths.length)action=()=>copyPaths(paths,true);else if(control&&key==='v')action=()=>pastePaths(dir);else if(e.key==='Delete'&&paths.length)action=()=>deletePaths(paths);else if(e.key==='F2'&&paths.length===1)action=()=>renamePath(paths[0]);else if(e.key==='F5')action=()=>owner?WM.windows.get(owner.id).refresh?.():renderDesktop();else if(e.key==='Enter'&&paths.length===1)action=()=>openPath(paths[0]);if(action){e.preventDefault();guard(action)();}});
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files')||e.dataTransfer?.types.includes('application/x-qingyu'))e.preventDefault();});
  document.addEventListener('drop',e=>{if(e.defaultPrevented)return;if(e.dataTransfer?.types.includes('Files')){e.preventDefault();const internal=e.dataTransfer.getData('application/x-qingyu');if(internal)return;const entries=Array.from(e.dataTransfer.items).filter(i=>i.kind==='file').map(i=>({entry:i.webkitGetAsEntry?.(),file:i.getAsFile()}));guard(()=>importDrop(entries,DESKTOP))();}});
  window.addEventListener('error',e=>{if(e.message&&e.filename?.startsWith(location.origin))console.error('青屿运行错误',e.message);});
  systemReady=(async()=>{
    await fs.ready;let hasPreferences=false;
    try{hasPreferences=!!localStorage.getItem('qingyu.preferences');}catch{}
    if(!hasPreferences){
      try{prefs={...defaultPrefs,...JSON.parse(await fs.readFile(SYSTEM+'/settings.json','utf8'))};}
      catch{try{const cookie=document.cookie.match(/(?:^|; )qingyu_theme=(dark|light)/);if(cookie)prefs.theme=cookie[1];}catch{}}
      applyPrefs();
    }
    await seedSystem();await applyCustomWallpaper();
    $('#storage-badge').textContent=fs.backendName==='OPFS'?'本地存储已就绪':fs.backendName+' 模式';
    $('#wall-storage-label').textContent=fs.backendName.toUpperCase()+' / YOURS ALWAYS';
    if(fs.backendName!=='OPFS')toast(fs.backendName==='临时内存'?'持久存储不可用，当前为临时会话，刷新会丢失文件。请及时导出。':'OPFS 不可用，已使用 '+fs.backendName+' 降级存储。建议通过 HTTPS 或 localhost 使用现代浏览器。',true,10000);
    await renderDesktop();
    const bounds=WM.bounds();
    const explorer=await openExplorer(HOME,innerWidth>720?{
      x:Math.min(175,Math.max(105,(bounds.width-1050)/2+70)),
      y:Math.max(22,Math.min(65,bounds.height*.085)),
      width:Math.min(868,bounds.width-(bounds.width>=1100?530:150)),
      height:Math.min(561,bounds.height-40)
    }:{});
    if(innerWidth>=1100&&bounds.height>480){
      await openWelcome({x:bounds.width-350,y:Math.min(bounds.height-305,Math.max(280,bounds.height*.49)),width:320,height:287});
      WM.focus(explorer);
    }
    const previous=Database.db?await Database.run('handles','getAll').catch(()=>[]):[];
    if(previous.length){
      const notice=toast(`发现 ${previous.length} 个之前挂载的文件夹。点击前往“本地挂载”重新授权。`,false,10000);
      notice.addEventListener('click',event=>{if(!event.target.closest('button'))guard(()=>openSettings('mounts'))();});
    }
    if(Database.db){
      const keys=await Database.run('meta','getAllKeys').catch(()=>[]);
      if(keys.some(key=>String(key).startsWith('operation:')))toast('检测到未完成的移动记录。源文件在复制成功前会保留，请检查源目录和目标目录。',true,10000);
    }
    return true;
  })();
  systemReady.catch(error=>{report(error);const retry=document.createElement('button');retry.className='btn';retry.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20000';retry.textContent='文件系统启动未完成 · 点击重新尝试';retry.onclick=()=>location.reload();document.body.append(retry);});
  window.Qingyu={fs,windows:WM,launch:launchApp,ready:systemReady,diagnostics:container=>systemReady.then(()=>runDiagnostics(container||document.createElement('div'))),version:'1.0.0'};
