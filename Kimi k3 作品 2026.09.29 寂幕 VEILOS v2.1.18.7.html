/* =====================================================
   解压缩引擎：zip / gz / tgz / tar（原生）+ 7z/rar（7z-wasm 懒加载）
===================================================== */
async function ensureJSZip(){
  if(window.JSZip)return true;
  try{await new Promise((res,rej)=>{const s=ce("script");s.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";s.onload=res;s.onerror=rej;document.head.append(s)});return !!window.JSZip}catch(e){return false}
}
async function jszipExtract(buf,destDir,onOne){
  if(!await ensureJSZip())throw new Error("JSZip 未能加载（网络异常）");
  const zip=await JSZip.loadAsync(buf);let n=0;
  const jobs=[];
  zip.forEach((rel,entry)=>{
    if(rel.startsWith("__MACOSX")||rel.endsWith(".DS_Store"))return;
    if(entry.dir){jobs.push(fs.mkdir(Path.join(destDir,rel)).catch(()=>{}));return}
    jobs.push(entry.async("arraybuffer").then(ab=>fs.write(Path.join(destDir,rel),ab)).then(()=>{n++;onOne&&onOne(rel)}));
  });
  for(const j of jobs)await j;
  return n;
}
async function gunzip(buf){
  const ds=new DecompressionStream("gzip");
  const stream=new Blob([buf]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer();
}
function tarParse(buf){
  const u8=new Uint8Array(buf);const files=[];let off=0;
  const str=(a,l)=>{let s="";for(let i=0;i<l&&a[i];i++)s+=String.fromCharCode(a[i]);return s};
  while(off+512<=u8.length){
    const head=u8.subarray(off,off+512);
    const name=str(head.subarray(0,100),100);
    if(!name)break;
    const sizeStr=str(head.subarray(124,12),12).trim();
    const size=parseInt(sizeStr,8)||0;
    const type=String.fromCharCode(head[156]||48);
    const prefix=str(head.subarray(345,155),155);
    const full=prefix?prefix+"/"+name:name;
    off+=512;
    const data=u8.slice(off,off+size);
    files.push({name:full,size,type,data});
    off+=Math.ceil(size/512)*512;
  }
  return files;
}
async function tarExtract(buf,destDir,onOne){
  const files=tarParse(buf);let n=0;
  for(const f of files){
    const rel=f.name.replace(/^\.\//,"");
    if(!rel||rel.includes(".."))continue;
    if(f.type==="5"){await fs.mkdir(Path.join(destDir,rel)).catch(()=>{});continue}
    if(f.type!=="0"&&f.type!=="\0"&&f.type!=="g")continue;
    try{await fs.mkdir(Path.dir(Path.join(destDir,rel)))}catch(_){}
    await fs.write(Path.join(destDir,rel),f.data);n++;onOne&&onOne(rel);
  }
  return files.length?n:null;
}
let sevenZipMod=null;
async function sevenZipExtract(buf,destDir){
  toast("正在启动 7z 解压引擎（首次需下载 WASM）…");
  if(!sevenZipMod){try{
    const m=await import("https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js");
    sevenZipMod=await (m.default||m)();
  }catch(e){throw new Error("7z 引擎加载失败："+e.message)}}
  const S=sevenZipMod;
  try{S.FS.mkdir("/in")}catch(_){}
  try{S.FS.mkdir("/out")}catch(_){}
  S.FS.writeFile("/in/pkg",new Uint8Array(buf));
  const code=S.callMain(["x","/in/pkg","-o/out","-y"]);
  if(code!==0)throw new Error("7z 解压失败（退出码 "+code+"）");
  let n=0;
  const walk=async(dir,rel)=>{for(const name of S.FS.readdir(dir)){
    if(name==="."||name==="..")continue;
    const p=dir+"/"+name,r=rel?rel+"/"+name:name;
    const st=S.FS.stat(p);
    if(S.FS.isDir(st.mode)){await fs.mkdir(Path.join(destDir,r)).catch(()=>{});await walk(p,r)}
    else{await fs.write(Path.join(destDir,r),S.FS.readFile(p).buffer);n++}}};
  await walk("/out","");
  try{S.FS.unlink("/in/pkg")}catch(_){}
  return n;
}
async function extractArchive(p,destDir){
  const ext=extOf(p);const base=Path.base(p).replace(/\.(tar\.gz|tgz|zip|tar|gz|7z|rar|bz2)$/i,"");
  destDir=destDir||Path.dir(p);
  const target=Path.join(destDir,await(fs.newName(destDir,base,"").then?fs.newName(destDir,base,""):Promise.resolve(base)));
  const t=toast(`正在解压「${esc(Path.base(p))}」…`,"",60000);
  try{
    const buf=await fs.read(p);
    await fs.mkdir(target).catch(()=>{});
    let n=0;
    if(ext==="zip")n=await jszipExtract(buf,target);
    else if(ext==="tar"){const r=await tarExtract(buf,target);if(r==null){n=await jszipExtract(buf,target)}else n=r}
    else if(ext==="gz"||ext==="tgz"){
      const out=await gunzip(buf);
      if(ext==="tgz"||/\.tar$/i.test(base)){const r=await tarExtract(out,target);n=r??0}
      else{await fs.write(Path.join(destDir,await freeNameOf(destDir,base)),out);n=1}
    }
    else if(ext==="7z"||ext==="rar"||ext==="bz2")n=await sevenZipExtract(buf,target);
    else throw new Error("暂不支持的压缩格式："+ext);
    toast(`解压完成，共写入 ${n} 个文件 → ${esc(target)}`,"ok");
    refreshDirViews(destDir);refreshDesktop();
    return target;
  }catch(e){toast("解压失败: "+e.message,"err");return null}
}

  if(ok)extractArchive(p,Path.dir(p));
}

/* ---------- 极简 Markdown 渲染（编辑器预览用） ---------- */
function mdRender(src){
  let h=esc(src);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre style="background:#00000055;padding:10px;border-radius:8px;overflow:auto"><code>${c.trim()}</code></pre>`);
  h=h.replace(/`([^`]+)`/g,'<code style="background:#00000055;padding:1px 6px;border-radius:5px">$1</code>');
  h=h.replace(/^###### (.*)$/gm,"<h6>$1</h6>").replace(/^##### (.*)$/gm,"<h5>$1</h5>").replace(/^#### (.*)$/gm,"<h4>$1</h4>")
     .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" style="color:#62d8c4">$1</a>');

function parseCSV(text,delim){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>!(r.length===1&&r[0]===""));
}
function toCSV(rows,delim){return rows.map(r=>r.map(c=>/[",\n]/.test(c)&&delim===","?'"'+c.replace(/"/g,'""')+'"':c).join(delim)).join("\n")}

    function getTextAndOps(){
      if(cm)return{doc:cm.getDoc(),val:cm.getValue(),
        fromIdx:i=>cm.posFromIndex(i)};
      return{val:ta.value,fromIdx:i=>{const bf=ta.value.slice(0,i);return{line:bf.split("\n").length-1,ch:i-bf.lastIndexOf("\n")-1}}};
    }
    function scan(){
      clearMarks();
      const q=fq.value;if(!q)return[];
      let re;
      try{re=fopts.re?new RegExp(q,"g"+(fopts.case?"":"i")):null}
      catch(e){msg("无效正则");return[]}
      const val=(cm?cm.getValue():ta.value);
      let list=[];
      if(re){let m;while((m=re.exec(val))){if(m[0]===""){re.lastIndex++;continue}list.push([m.index,m.index+m[0].length]);if(list.length>2000)break}}
      else{
        const needle=fopts.case?q:q.toLowerCase();const hay=fopts.case?val:val.toLowerCase();
        let i=0;
        if(fopts.word){const rq=new RegExp(`\\b${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`,"g"+(fopts.case?"":"i"));let m;while((m=rq.exec(hay))){list.push([m.index,m.index+m[0].length]);if(list.length>2000)break}}
        else{while((i=hay.indexOf(needle,i))>=0){list.push([i,i+needle.length]);i+=needle.length;if(list.length>2000)break}}
      }
      if(cm)list.forEach(([s,e])=>marks.push(cm.markText(cm.posFromIndex(s),cm.posFromIndex(e),{className:"cm-hit"})));
      $("[data-f-cnt]",b).textContent=`0/${list.length}`;
      return list;
    }
    let findList=[];
    function highlightCur(){
      if(cm){$$(".cm-hit-cur",paneEd).forEach(x=>x.classList.remove("cm-hit-cur"))}
    }
    function findNext(dlt){
      if(!fq.value)return;
      findList=scan();
      if(!findList.length){msg(fq.value?"没有匹配项":"");return}
      if(cur<0)cur=dlt>=0?0:findList.length-1;
      else cur=(cur+dlt+findList.length)%findList.length;
      $("[data-f-cnt]",b).textContent=`${cur+1}/${findList.length}`;
      const[s,e]=findList[cur];
      if(cm){
        if(cmCurMark)cmCurMark.clear();
        cmCurMark=cm.markText(cm.posFromIndex(s),cm.posFromIndex(e),{className:"cm-hit cm-hit-cur"});
        cm.scrollIntoView({from:cm.posFromIndex(s),to:cm.posFromIndex(e)},120);
        cm.setSelection(cm.posFromIndex(s),cm.posFromIndex(e));cm.focus()}
      else{ta.focus();ta.setSelectionRange(s,e);
        const lineH=parseFloat(getComputedStyle(ta).lineHeight)||22;
        ta.scrollTop=(ta.value.slice(0,s).split("\n").length-6)*lineH}
    }
    function replaceCur(){
      if(cur<0||!findList.length)return;
      const[s,e]=findList[cur];
      if(cm){cm.replaceRange(fr.value,cm.posFromIndex(s),cm.posFromIndex(e))}
      else{ta.setRangeText(fr.value,s,e,"end");dirty=true}
      dirty=true;findNext(0);
    }
    function replaceAll(){
      if(!fq.value)return;
      const val=cm?cm.getValue():ta.value;
      let cnt=0,out;
      if(fopts.re){try{out=val.replace(new RegExp(fq.value,"g"+(fopts.case?"":"i")),fr.value);cnt=val.length!==out.length?undefined:0}
        catch(e){msg("无效正则");return}}
      else if(fopts.word||fopts.case){try{const rq=new RegExp((fopts.word?"\\b":"")+fq.value.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(fopts.word?"\\b":""),"g"+(fopts.case?"":"i"));
        let n=0;out=val.replace(rq,()=>{n++;return fr.value});cnt=n}catch(e){return}}
      else{const parts=val.split(fq.value);cnt=parts.length-1;out=parts.join(fr.value)}
      api.set(out);dirty=true;
      msg(cnt===undefined?"替换完成":`已替换 ${cnt} 处`);
      findList=scan();
    }
    function openFind(focusR){
      $(".findbar",b).classList.add("on");
      if(cm)fq.value=cm.getSelection()||fq.value;
      setTimeout(()=>{(focusR?fr:fq).focus();fq.select()},30);
      findList=scan();if(findList.length)findNext(0);
    }
    function closeFind(){$(".findbar",b).classList.remove("on");clearMarks();api.focus()}
    fq.addEventListener("input",debounce(()=>{findList=scan()},200));
    fq.addEventListener("keydown",e=>{if(e.key==="Enter")findNext(e.shiftKey?-1:1);if(e.key==="Escape")closeFind();if(e.key==="F3")findNext(1);e.stopPropagation()});
    fr.addEventListener("keydown",e=>{if(e.key==="Escape")closeFind();e.stopPropagation()});
    $$("[data-f-opt]",b).forEach(el=>el.onclick=()=>{fopts[el.dataset.fOpt]=!fopts[el.dataset.fOpt];el.classList.toggle("on",fopts[el.dataset.fOpt]);findList=scan()});
    const fActs={prev:()=>findNext(-1),next:()=>findNext(1),rep:replaceCur,repall:replaceAll,close:closeFind};
    $$("[data-f-act]",b).forEach(el=>el.onclick=()=>fActs[el.dataset.fAct]());
    /* ---- 文件操作 ---- */
    async function save(){
      if(!path){
        const nv=await dlg.prompt(`文件名（保存到 ${dir}）`,"未命名"+extForMode(mode),"保存");
        if(!nv)return;path=Path.join(dir,nv);
      }
      try{await fs.write(path,api.get());dirty=false;
        win.setTitle("HTML编辑器 · "+Path.base(path));
        msg("已保存到 "+path);toast("已保存","ok");
        refreshDirViews(Path.dir(path));refreshDesktop();
      }catch(e){toast("保存失败: "+e.message,"err")}
    }
    function imp(){
      const inp=ce("input");inp.type="file";inp.accept=".html,.htm,.css,.js,.mjs,.json,.md,.markdown,.xml,.svg,.txt";
      inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
        api.set(await f.text());setMode(modeForExt(extOf(f.name)));path=null;dirty=true;render();
        win.setTitle("HTML编辑器 · "+f.name+"（本地导入）");msg("已导入本地文件，保存后写入虚拟磁盘")};
      inp.click();
    }
    function exp(){
      const v=api.get();
      const name=(path?Path.base(path).replace(/\.[^.]+$/,""):"导出")+extForMode(mode);
      const a=ce("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/plain;charset=utf-8"}));a.download=name;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),6000);msg("已导出 "+name);
    }
    const acts={
      open:async()=>{const p=await pickVFSFile(null,"/");if(!p)return;
        try{api.set(await fs.readText(p));path=p;dir=Path.dir(p);setMode(modeForExt(extOf(p)));dirty=false;render();
          win.setTitle("HTML编辑器 · "+Path.base(p))}catch(e){toast(e.message,"err")}},
      imp,exp,save,
      clear:async()=>{if(await dlg.confirm("清空全部内容？此操作可用撤销挽回（编辑内核模式）。","清空","清空",true)){api.set("");dirty=true;render()}},
      undo:()=>cm?cm.undo():document.execCommand("undo"),
      redo:()=>cm?cm.redo():document.execCommand("redo"),
      find:()=>openFind(false),fmt:format,
      foldall:()=>foldAll(false),unfoldall:()=>foldAll(true),
      run:()=>render(),refresh:()=>render(),
      pv:e=>{const on=panePv.style.display==="none";panePv.style.display=on?"flex":"none";
        $("[data-split]",b).style.display=on?"block":"none";e.currentTarget.classList.toggle("on",on);
        if(on)render();if(cm)setTimeout(()=>cm.refresh(),80)},
      newwin:()=>{const u=URL.createObjectURL(new Blob([previewDoc()],{type:"text/html"}));window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),30000)},
    };
    $$("[data-a]",b).forEach(el=>el.onclick=acts[el.dataset.a]);
    /* ---- 分割条 ---- */
    const split=$("[data-split]",b);
    split.addEventListener("pointerdown",e=>{
      e.preventDefault();split.classList.add("on");split.setPointerCapture(e.pointerId);
      const host=split.parentElement.getBoundingClientRect();
      const mv=e2=>{
        let px=e2.clientX-host.left;
        px=clamp(px,200,host.width-120);
        paneEd.style.flex=`0 0 ${px}px`;
      };
      const up=()=>{split.classList.remove("on");split.removeEventListener("pointermove",mv);split.removeEventListener("pointerup",up);
        if(cm)cm.refresh()};
      split.addEventListener("pointermove",mv);split.addEventListener("pointerup",up);
    });
    if(innerWidth<=720){paneEd.style.flex="0 0 46%"}
    /* ---- 初始内容 ---- */
    if(path){
      try{api.set(await fs.readText(path));setMode(modeForExt(extOf(Path.base(path))));
        win.setTitle("HTML编辑器 · "+Path.base(path));dirty=false}
      catch(e){toast("读取失败: "+e.message,"err")}
    }else{
      api.set(`<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>未命名页面</title>\n  <style>\n    body { font-family: serif; margin: 40px; background: #130e1b; color: #f0e7d7; }\n    h1 { font-weight: 300; letter-spacing: .3em; border-bottom: 1px solid #e0a94c; padding-bottom: .3em; }\n  </style>\n</head>\n<body>\n  <h1>寂 幕</h1>\n  <p>聚光已就位，开始你的表演。</p>\n</body>\n</html>\n`);
      setMode("htmlmixed");
    }
    updStatus();render();
    win.onResize=()=>{if(cm)cm.refresh()};
    win.onClose=()=>{if(cm){clearMarks();cm.toTextArea();cm=null}};
  }
});
/* =====================================================
   应用：图片查看器
===================================================== */
regApp("imageviewer",{
  title:"图片查看器",icon:"image",w:820,h:600,
  async build(win,opts){
    let list=[],idx=0,scale=1,fit=true,px=0,py=0;
    const b=win.body;
    b.innerHTML=`
      <div class="tb">
        <button class="tbb" data-a="prev" title="上一张">${icon("prev",16)}</button>
        <button class="tbb" data-a="next" title="下一张">${icon("next",16)}</button>
        <span class="tbsep"></span>
        <button class="tbb" data-a="zout">${icon("zoomOut",16)}</button>
        <span data-z style="font-size:11.5px;color:var(--ink3);min-width:46px;text-align:center">适应</span>
        <button class="tbb" data-a="zin">${icon("zoomIn",16)}</button>
        <button class="tbb" data-a="fit" title="适应窗口">1:1 / 适应</button>
        <span class="tbsep"></span>
        <button class="tbb" data-a="manga" title="同目录漫画模式">${icon("manga",16)} 漫画模式</button>
        <span style="flex:1"></span>
        <button class="tbb" data-a="wall" title="设为壁纸">${icon("image",16)}</button>
        <button class="tbb" data-a="dl" title="下载">${icon("download",16)}</button>
      </div>
      <div class="iv-stage" data-stage><img data-img draggable="false" alt=""></div>
      <div class="status"><span data-name>—</span><span data-cnt style="margin-left:auto"></span></div>`;
    const img=$("[data-img]",b),stage=$("[data-stage]",b);
    function apply(){
      if(fit){const sw=stage.clientWidth-24,sh=stage.clientHeight-24;
        const s=Math.min(sw/img.naturalWidth,sh/img.naturalHeight,8)||1;
        scale=s;img.style.transform=`translate(${px}px,${py}px) scale(${s})`;
        $("[data-z]",b).textContent="适应";
      }else{img.style.transform=`translate(${px}px,${py}px) scale(${scale})`;
        $("[data-z]",b).textContent=Math.round(scale*100)+"%"}
    }
    async function show(i){
      idx=(i+list.length)%list.length;
      const it=list[idx];
      try{const url=await fs.readURL(it.path,true);
        img.onload=()=>{fit=true;px=py=0;
          $("[data-name]",b).textContent=it.name;
          $("[data-cnt]",b).textContent=`${idx+1} / ${list.length} · ${img.naturalWidth}×${img.naturalHeight}`;
          win.setTitle(it.name+" · 图片查看器");
          apply()};
        img.src=url;
      }catch(e){toast(e.message,"err")}
    }
    const acts={
      prev:()=>show(idx-1),next:()=>show(idx+1),
      zin:()=>{fit=false;scale=clamp(scale*1.25,.05,16);apply()},
      zout:()=>{fit=false;scale=clamp(scale/1.25,.05,16);apply()},
      fit:()=>{fit=!fit;px=py=0;if(!fit)scale=1;apply()},
      manga:()=>WM.open("mangaview",{path:list[idx].path,dir:opts.dir||Path.dir(list[idx].path)}),
      wall:async()=>{try{const p=list[idx].path;const buf=await fs.read(p);
        const np=Path.join("/系统/wallpapers",list[idx].name);await fs.write(np,buf);
        SET.wall="opfs:"+np;applySet();toast("壁纸已更新","ok")}catch(e){toast(e.message,"err")}},
      dl:()=>downloadPath(list[idx].path),
    };
    $$("[data-a]",b).forEach(el=>el.onclick=()=>acts[el.dataset.a]&&acts[el.dataset.a]());
    stage.addEventListener("wheel",e=>{e.preventDefault();if(e.ctrlKey||!fit){fit=false;
      scale=clamp(scale*(e.deltaY<0?1.13:1/1.13),.05,16);apply()}}, {passive:false});
    stage.addEventListener("wheel",e=>{if(fit){e.preventDefault();show(idx+(e.deltaY>0?1:-1))}},{passive:false});
    img.addEventListener("pointerdown",e=>{e.preventDefault();img.setPointerCapture(e.pointerId);
      const sx=e.clientX-px,sy=e.clientY-py;
      const mv=e2=>{px=e2.clientX-sx;py=e2.clientY-sy;fit=false;apply()};
      const up=()=>{img.removeEventListener("pointermove",mv);img.removeEventListener("pointerup",up)};
      img.addEventListener("pointermove",mv);img.addEventListener("pointerup",up)});
    win.el.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")acts.prev();if(e.key==="ArrowRight")acts.next()});
    win.el.tabIndex=-1;
    win.onResize=()=>apply();
    b.closest(".win").addEventListener("dblclick",e=>{if(e.target===stage)acts.fit()});
    stage.addEventListener("dblclick",()=>acts.fit());
    /* 装载 */
    if(opts.path){
      const dir=opts.dir||Path.dir(opts.path);
      try{const all=await fs.readdir(dir);
        list=all.filter(c=>c.kind==="file"&&EXT.img.includes(extOf(c.name))).sort((a,b)=>natSort(a.name,b.name))
          .map(c=>({name:c.name,path:Path.join(dir,c.name)}));
        idx=Math.max(0,list.findIndex(x=>x.path===opts.path));
        show(idx);
      }catch(e){toast(e.message,"err")}
    }else{
      const p=await pickVFSFile(EXT.img,"/图片");
      if(p){WM.close(win.id);WM.open("imageviewer",{path:p,dir:Path.dir(p)})}
      else$("#stage img");
    }
  }
});
/* =====================================================
   应用：漫画阅读器（同目录长卷）
===================================================== */
regApp("mangaview",{
  title:"漫画阅读器",icon:"manga",w:900,h:640,
  async build(win,opts){
    if(!opts.path){
      const p=await pickVFSFile(EXT.img,"/图片");
      WM.close(win.id);
      if(p)WM.open("mangaview",{path:p,dir:Path.dir(p)});
      return;
    }
    const b=win.body;
    b.innerHTML=`
      <div class="tb" style="background:#0b0b0e;border-color:#ffffff14">
        <button class="tbb" data-a="top" title="回到顶部">${icon("up",16)}</button>
        <span class="tbsep"></span>
        <button class="tbb" data-a="fitw" title="宽度模式：适应 / 通栏">${icon("list",16)} 适应宽度</button>
        <span style="flex:1"></span>
        <span data-progress style="font-size:11.5px;color:#9a8fa8"></span>
        <button class="tbb" data-a="fs" title="沉浸全屏">${icon("full",16)} 全屏</button>
      </div>
      <div class="mgv-meter"><i data-meter></i></div>
      <div class="manga-scroll" data-scroll></div>
      <button class="mg-fs-btn" data-fsx title="退出全屏">${icon("x",18)}</button>`;
    const scrollEl=$("[data-scroll]",b),meter=$("[data-meter]",b);
    scrollEl.innerHTML=`<div class="fx-empty" style="color:#7c6f88;height:220px">${icon("manga",40)}正在编排队列…</div>`;
    const dir=opts.dir||(opts.path?Path.dir(opts.path):"/");
    let files=[];
    try{
      const all=await fs.readdir(dir);
      files=all.filter(c=>c.kind==="file"&&EXT.img.includes(extOf(c.name))).map(c=>c.name).sort(natSort);
    }catch(e){scrollEl.innerHTML=`<div class="fx-empty" style="color:var(--danger)">${icon("warn",40)}目录读取失败：${esc(e.message)}</div>`;toast("目录读取失败","err");return}
    if(!files.length){scrollEl.innerHTML=`<div class="fx-empty" style="color:#7c6f88">该目录下没有可识别的图片</div>`;return}
    win.setTitle(Path.base(dir)+" · 漫画阅读器");
    $("[data-progress]",b).textContent=`${files.length} 页 · 加载中 0/${files.length}`;
    scrollEl.innerHTML="";
    /* 按排序后顺序先插入占位，再并行读取填充（顺序不会错乱） */
    const imgs=files.map((name,i)=>{
      const im=ce("img");im.draggable=false;im.dataset.name=name;im.dataset.i=i;
      im.style.minHeight="240px";im.style.background="linear-gradient(180deg,#141414,#0c0c0c)";
      im.loading="lazy";im.alt=name;
      scrollEl.append(im);return im;
    });
    let done=0;
    const queue=[...files.keys()];
    const workers=Array.from({length:Math.min(6,queue.length)},async()=>{
      while(queue.length){
        const i=queue.shift();
        try{const url=await fs.readURL(Path.join(dir,files[i]),true);
          imgs[i].src=url;
          imgs[i].onload=()=>{imgs[i].style.minHeight="";imgs[i].style.background="none"};
        }catch(e){imgs[i].remove();done++;console.warn("跳过读取失败的图片",files[i],e);continue}
        done++;
        meter.style.transform=`scaleX(${done/files.length})`;
        $("[data-progress]",b).textContent=`${files.length} 页 · 已加载 ${done}/${files.length}`;
      }
    });
    Promise.all(workers).then(()=>{
      $("[data-progress]",b).textContent=`${files.length} 页`;
      setTimeout(()=>meter.style.opacity="0",600);
      /* 定位到用户点击的那一页 */
      if(opts.path){
        const t=imgs.find(im=>im.dataset.name===Path.base(opts.path));
        if(t)setTimeout(()=>t.scrollIntoView({block:"start"}),80);
      }
    });
    const acts={
      top:()=>scrollEl.scrollTo({top:0,behavior:"smooth"}),
      fitw:()=>{const tap=scrollEl.classList.toggle("tap");
        scrollEl.querySelectorAll("img").forEach(im=>im.classList.toggle("tap",tap));
        $('[data-a="fitw"]',b).innerHTML=icon("list",16)+(tap?" 通栏模式":" 适应宽度")},
      fs:()=>enterFull(),
    };
    $$("[data-a]",b).forEach(el=>el.onclick=()=>acts[el.dataset.a]&&acts[el.dataset.a]());
    function enterFull(){
      if(document.fullscreenElement){document.exitFullscreen();return}
      win.el.classList.add("manga-full");
      win.el.requestFullscreen().catch(()=>{win.el.classList.remove("manga-full");toast("全屏失败","err")});
    }
    $("[data-fsx]",b).onclick=()=>document.exitFullscreen();
    const onFs=()=>{if(document.fullscreenElement!==win.el)win.el.classList.remove("manga-full")};
    document.addEventListener("fullscreenchange",onFs);
    win.onClose=()=>document.removeEventListener("fullscreenchange",onFs);
  }
});

      <div class="calc">
        ${[["C","dgr"],["⌫","dgr"],["%","op"],["÷","op"],["7",""],["8",""],["9",""],["×","op"],["4",""],["5",""],["6",""],["−","op"],["1",""],["2",""],["3",""],["+","op"],["±",""],["0",""],[".",""],["=","eq"]].map(([t,c])=>`<button class="${c}" data-k="${t}">${t==="⌫"?"退格":t}</button>`).join("")}
      </div>`;
    let cur="0",prev=null,op=null,fresh=true;
    const C=$("[data-c]",b),H=$("[data-h]",b);
    const show=()=>{C.textContent=cur};
    const calc=(a,b2,o)=>{a=+a;b2=+b2;
      const r=o==="+"?a+b2:o==="−"?a-b2:o==="×"?a*b2:o==="÷"?(b2===0?NaN:a/b2):o==="%"?a*b2/100:0;
      return Number.isFinite(r)?String(Math.round(r*1e10)/1e10):"错误"};
    const press=k=>{
      if(k==="C"){cur="0";prev=null;op=null;fresh=true;H.textContent="";show();return}
      if(k==="⌫"){cur=cur.length>1?cur.slice(0,-1):"0";show();return}
      if(k==="±"){cur=cur.startsWith("-")?cur.slice(1):"-"+cur;show();return}
      if(k==="."){if(fresh){cur="0.";fresh=false}else if(!cur.includes("."))cur+=".";show();return}
      if(/^[0-9]$/.test(k)){cur=(cur==="0"||fresh)?k:cur+k;fresh=false;show();return}
      if(k==="="){
        if(op&&prev!=null){H.textContent=`${prev} ${op} ${cur} =`;cur=calc(prev,cur,op);prev=null;op=null;fresh=true;show()}
        return}
      if(["+","−","×","÷","%"].includes(k)){
        if(op&&prev!=null&&!fresh){cur=calc(prev,cur,op)}
        prev=cur;op=k;fresh=true;H.textContent=`${prev} ${op}`;show();return}
    };
    $$("[data-k]",b).forEach(el=>el.onclick=()=>press(el.dataset.k));
    win.el.tabIndex=-1;
    win.el.addEventListener("keydown",e=>{
      const map={"/":"÷","*":"×","-":"−","Enter":"=","=":"=","Backspace":"⌫","Escape":"C","%":"%",".":".","+":"+"};
      let k=e.key;if(/^[0-9]$/.test(k))press(k);else if(map[k]){press(map[k]);e.preventDefault()}
    });
    show();
  }
});

        <div class="set-row"><span class="si">${icon("moon",19)}</span><div class="st"><b>主题模式</b><small>默认深色 · 「寂幕」深色 / 「宣光」浅色</small></div><div data-s="theme">${seg(SET.theme,[["dark","深色"],["light","浅色"]])}</div></div>
        <div class="set-row"><span class="si">${icon("paint",19)}</span><div class="st"><b>强调色</b><small>聚光灯的颜色</small></div><div data-s="accent">${seg(SET.accent,[["brass","黄铜"],["verdant","新苔"],["iris","鸢尾"]])}</div></div>
        <div class="set-row"><span class="si">${icon("grid",19)}</span><div class="st"><b>桌面图标大小</b><small data-iv>${SET.iconSize} px</small></div><input type="range" class="sld" data-r="iconSize" min="34" max="64" value="${SET.iconSize}" style="width:170px"></div>
        <div class="set-row"><span class="si">${icon("play",19)}</span><div class="st"><b>界面动效</b><small>关闭以降低耗电与眩晕感</small></div><div data-s="motion">${seg(SET.motion===1?"1":"0",[["1","开"],["0","关"]])}</div></div>`;
        $$('[data-s="theme"] button',pane).forEach(x=>x.onclick=()=>{SET.theme=x.dataset.v;applySet();PAGES.look()});
        $$('[data-s="accent"] button',pane).forEach(x=>x.onclick=()=>{SET.accent=x.dataset.v;applySet();PAGES.look()});
        $$('[data-s="motion"] button',pane).forEach(x=>x.onclick=()=>{SET.motion=+x.dataset.v;applySet();PAGES.look()});
        $('[data-r="iconSize"]',pane).oninput=e=>{SET.iconSize=+e.target.value;applySet();$("[data-iv]",pane).textContent=SET.iconSize+" px";
          e.target.style.setProperty("--p",((SET.iconSize-34)/30*100)+"%")};
      },
      wall(){
        const names={veil:"帷幕之夜",tide:"铜绿潮生",ember:"灰烬余烬",paper:"宣纸晨光"};
        pane.innerHTML=`<h3 style="margin:4px 0 10px;font-family:var(--font-disp);font-weight:600">壁纸</h3>
          <div class="wp-grid">${Object.entries(names).map(([k,n])=>`
            <div class="wp-cell${SET.wall===k?" on":""}" data-w="${k}" style="background:${{veil:"radial-gradient(120px 80px at 80% 0%,#e0a94c66,transparent),#191026",tide:"radial-gradient(120px 80px at 20% 0%,#62d8c455,transparent),#0b1a1e",ember:"radial-gradient(120px 80px at 80% 100%,#e0784755,transparent),#1c1013",paper:"linear-gradient(165deg,#f3ecdc,#e9e0cd)"}[k]}"><span>${n}</span></div>`).join("")}
            <div class="wp-cell" data-up style="display:grid;place-items:center;border-style:dashed"><span style="position:static;background:none;color:var(--ink2)">${icon("upload",20)} 上传图片</span></div>
          </div>
          <p style="color:var(--ink3);font-size:12px;margin-top:12px">上传的壁纸会存入虚拟磁盘 /系统/wallpapers，刷新后依然生效。</p>`;
        $$("[data-w]",pane).forEach(x=>x.onclick=()=>{SET.wall=x.dataset.w;applySet();PAGES.wall()});
        $("[data-up]",pane).onclick=()=>{wallpaperUpload();setTimeout(()=>PAGES.wall(),600)};
      },
      time(){
        pane.innerHTML=`<h3 style="margin:4px 0 2px;font-family:var(--font-disp);font-weight:600">时间与日期</h3>
        <div class="set-row"><span class="si">${icon("clock",19)}</span><div class="st"><b>时间制式</b><small>任务栏与日历显示</small></div><div data-s="h12">${seg(SET.hour12?"12":"24",[["12","12 小时"],["24","24 小时"]])}</div></div>
        <div class="set-row"><span class="si">${icon("eye",19)}</span><div class="st"><b>显示秒</b><small>任务栏时钟</small></div><div data-s="sec">${seg(SET.seconds?"1":"0",[["1","显示"],["0","隐藏"]])}</div></div>`;
        $$('[data-s="h12"] button',pane).forEach(x=>x.onclick=()=>{SET.hour12=x.dataset.v==="12";applySet();tickClock();PAGES.time()});
        $$('[data-s="sec"] button',pane).forEach(x=>x.onclick=()=>{SET.seconds=x.dataset.v==="1";applySet();tickClock();PAGES.time()});
      },
      async store(){
        pane.innerHTML=`<h3 style="margin:4px 0 10px;font-family:var(--font-disp);font-weight:600">存储</h3><div style="color:var(--ink3)">正在丈量剧场…</div>`;
        let est={usage:0,quota:0};
        try{est=await navigator.storage.estimate()||est}catch(_){}
        const cats={"图片":0,"音频":0,"视频":0,"文档代码":0,"压缩包":0,"其他":0};
        let myTotal=0;
        const catOf=n=>{const k=kindOf(n);return k==="img"?"图片":k==="audio"?"音频":k==="video"?"视频":(k==="text"||k==="code"||k==="csv"||k==="pdf")?"文档代码":k==="arch"?"压缩包":"其他"};
        const walk=async dir=>{let arr;try{arr=await fs.readdir(dir)}catch(e){return}
          for(const c of arr){const p=Path.join(dir,c.name);
            if(p.startsWith("/mnt/local"))continue;
            if(c.kind==="dir")await walk(p);else{cats[catOf(c.name)]+=c.size||0;myTotal+=c.size||0}}};
        await walk("/");
        const colors={"图片":"#e0a94c","音频":"#62d8c4","视频":"#a98bf0","文档代码":"#5fd08e","压缩包":"#e07847","其他":"#8a7f95"};
        const denom=est.quota||Math.max(myTotal,1);
        const usedPct=Math.min(100,(est.usage||myTotal)/denom*100);
        pane.innerHTML=`<h3 style="margin:4px 0 10px;font-family:var(--font-disp);font-weight:600">存储</h3>
        <div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px">浏览器配额（含系统其他数据）：已用 <b style="color:var(--acc)">${fmtSize(est.usage||myTotal)}</b> / ${est.quota?fmtSize(est.quota):"未知"} · <b>${usedPct.toFixed(1)}%</b></div>
        <div class="quota-bar" style="margin-bottom:6px"><i style="width:${usedPct}%;background:linear-gradient(90deg,var(--acc),#8a5f22)"></i></div>
        <div style="font-size:12.5px;color:var(--ink2);margin:16px 0 8px">寂幕虚拟磁盘占用：<b style="color:var(--acc)">${fmtSize(myTotal)}</b>（后端：${fs.mode==="opfs"?"OPFS 原生持久化":"IndexedDB 降级"}）</div>
        <div class="quota-bar" style="margin-bottom:14px">${Object.entries(cats).filter(([,v])=>v>0).map(([k,v])=>`<i style="width:${(v/(myTotal||1)*100)}%;background:${colors[k]}" title="${k} ${fmtSize(v)}"></i>`).join("")||'<i style="width:0%"></i>'}</div>
        ${Object.entries(cats).map(([k,v])=>`<div class="qleg"><i style="background:${colors[k]}"></i>${k}<b>${fmtSize(v)}</b></div>`).join("")}
        <div class="set-row" style="margin-top:16px"><span class="si" style="color:var(--danger);background:rgba(224,106,99,.12)">${icon("trash",19)}</span><div class="st"><b>一键重置寂幕</b><small>清除 OPFS 全部文件、本地设置与草稿，恢复到首演之夜的状态</small></div><button class="btn dgr" data-reset>重置…</button></div>`;
        $("[data-reset]",pane).onclick=async()=>{
          if(!await dlg.confirm("将删除虚拟磁盘中的<strong>全部文件</strong>与设置，且不可恢复。确定继续？","重置寂幕","继续",true))return;
          if(!await dlg.confirm("最后确认：剧终之后，便是新的首演。","重置寂幕","清除一切",true))return;
          try{
            if(fs.mode==="opfs"&&MAIN.root){
              for await(const e of MAIN.root.values()){try{await MAIN.root.removeEntry(e.name,{recursive:true})}catch(_){}}
            }
            await IDB.clear("fs").catch(()=>{});await IDB.clear("meta").catch(()=>{});await IDB.clear("mounts").catch(()=>{});
            localStorage.clear();
            toast("已清除，即将重新开幕…");
            setTimeout(()=>location.reload(),900);
          }catch(e){toast("重置失败: "+e.message,"err")}};
      },
      mnt(){
        const ms=fs.mounts(),pd=fs.pending();
        pane.innerHTML=`<h3 style="margin:4px 0 10px;font-family:var(--font-disp);font-weight:600">本地挂载</h3>
          <p style="color:var(--ink3);font-size:12px;margin:0 0 10px">通过 File System Access API 将真实文件夹桥接进 /mnt/local，享有与虚拟文件完全对等的能力。浏览器出于安全策略，刷新网页后需重新授权一次。</p>
          ${ms.map(n=>`<div class="set-row"><span class="si">${icon("mount",19)}</span><div class="st"><b>${esc(n)}</b><small>已挂载 · /mnt/local/${esc(n)}</small></div><button class="btn" data-u="${esc(n)}">卸载</button></div>`).join("")}
          ${pd.map(n=>`<div class="set-row"><span class="si" style="color:var(--danger);background:rgba(224,106,99,.12)">${icon("unplug",19)}</span><div class="st"><b>${esc(n)}</b><small>权限失效 · 需重新授权</small></div><button class="btn" data-r="${esc(n)}">重新挂载</button></div>`).join("")}
          ${!ms.length&&!pd.length?'<div style="color:var(--ink3);padding:14px 0">尚未挂载任何文件夹</div>':""}
          <button class="btn pri" data-add style="margin-top:12px">${icon("plus",15)} 挂载本地文件夹</button>
          <button class="btn" data-open style="margin-top:12px;margin-left:8px">${icon("open2",15)} 打开挂载目录</button>`;
        $("[data-add]",pane).onclick=async()=>{await fs.mountLocal();PAGES.mnt()};
        $("[data-open]",pane).onclick=()=>WM.open("explorer",{dir:"/mnt/local"});
        $$("[data-u]",pane).forEach(x=>x.onclick=async()=>{await fs.unmount(x.dataset.u);PAGES.mnt()});
        $$("[data-r]",pane).forEach(x=>x.onclick=async()=>{await fs.remount(x.dataset.r);PAGES.mnt()});
      },
      about(){
        pane.innerHTML=`<div style="text-align:center;padding:26px 0 10px">
          <div style="color:var(--acc)">${icon("crest",64)}</div>
          <h2 style="font-family:var(--font-disp);font-weight:300;letter-spacing:.5em;text-indent:.5em;margin:14px 0 4px">寂 幕</h2>
          <div style="color:var(--ink3);letter-spacing:.3em;font-size:12px">VEILOS · 首演版 1.0</div></div>
          <div style="max-width:420px;margin:10px auto;font-size:12.5px;color:var(--ink2);line-height:2">
            文件系统后端：${fs.mode==="opfs"?"OPFS（Origin Private File System）":"IndexedDB（降级模式）"}<br>
            引擎：CodeMirror 5.65.16 · JSZip 3.10.1 · 7z-wasm 1.2.0 · v86 0.5.319<br>
            双击打开 · 右键菜单 · 拖入导入 · 拖出下载 · 框选多选 · 边缘分屏<br>
          </div>`;
      }
    };
    PAGES.look();
    $$("[data-n]",b).forEach(el=>el.onclick=()=>{
      $$("[data-n]",b).forEach(x=>x.classList.toggle("on",x===el));
      PAGES[el.dataset.n]();
    });
  }
});
/* =====================================================
   应用：v86 虚拟机（版本锁定资源）
   libv86.js → v86@0.5.319  |  v86.wasm → 同版本  |  BIOS → 固定 commit
===================================================== */
const V86_RES={
  lib:"https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js",
  wasm:"https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm",
  bios:"https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin",
  vga:"https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin",
};
let v86LibP=null, v86Booted=false, v86Idx=0;
regApp("vm",{
  title:"虚拟机 · v86",icon:"vm",w:860,h:620,
  build(win){
    const b=win.body;const myIdx=++v86Idx;
    b.innerHTML=`
      <div class="tb">
        <button class="tbb" data-a="pickl">${icon("upload",15)} 选择本地镜像</button>
        <button class="tbb" data-a="pickv">${icon("harddrive",15)} 从虚拟磁盘选择</button>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--ink3)" data-img>未选择镜像（.iso / .img / .bin）</span>
        <span class="tbsep"></span>
        <button class="tbb" data-a="boot" style="color:var(--acc2)">${icon("power",15)} 启动</button>
        <button class="tbb" data-a="lock" disabled>${icon("cursor",15)} 锁定鼠标</button>
      </div>
      <div class="v86wrap">
        <div class="v86-screen" data-screen>
          <div style="white-space:pre;font:14px/1.15 'IBM Plex Mono',monospace" data-txt></div>
          <canvas data-cv></canvas>
          <div class="v86hint" data-hint>${icon("info",20)}<span>v86 是真实的 x86 模拟器。请选择一枚磁盘镜像（.iso 挂载为光驱，.img/.bin 挂载为软驱）后启动。<br>出于跨域安全策略，镜像仅支持从本机或虚拟磁盘读入，不能直接粘贴网络镜像地址。</span></div>
        </div>
      </div>
      <div class="status"><span data-log>待命</span><span style="margin-left:auto">v86 0.5.319 · 128 MB RAM</span></div>`;
    let emu=null,imgBuf=null,imgName="";
    const log=t=>{$("[data-log]",b).textContent=t};
    const screen=$("[data-screen]",b);
    $('[data-a="pickl"]',b).onclick=()=>{
      const inp=ce("input");inp.type="file";inp.accept=".iso,.img,.bin,.fda";
      inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
        imgBuf=await f.arrayBuffer();imgName=f.name;
        $("[data-img]",b).textContent=f.name+" · "+fmtSize(f.size);log("镜像已装入，等待启动")};
      inp.click()};
    $('[data-a="pickv"]',b).onclick=async()=>{
      const p=await pickVFSFile(["iso","img","bin","fda"],"/下载");if(!p)return;
      try{imgBuf=await fs.read(p);imgName=Path.base(p);
        $("[data-img]",b).textContent="vfs:"+p+" · "+fmtSize(imgBuf.byteLength);log("镜像已装入，等待启动")}
      catch(e){toast(e.message,"err")}};
    async function boot(){
      if(!imgBuf)return toast("请先选择磁盘镜像","err");
      try{
        log("正在下载 v86 引擎（libv86 0.5.319）…");
        if(!v86LibP)v86LibP=loadJS(V86_RES.lib);
        await v86LibP;
        if(!window.V86)throw new Error("引擎全局对象缺失");
        if(emu){try{emu.stop()}catch(_){} emu=null;
          // v86 单例限制：一个页面一台稳定实例
          return toast("已有一台虚拟机在运行，请重启页面后再试","err")}
        $("[data-hint]",b).style.display="none";
        const ext=extOf(imgName);
        const diskKey=ext==="iso"?"cdrom":(ext==="img"||ext==="fda"||ext==="bin")?"fda":"hda";
        log("BIOS 自检中…（首次需下载 WASM 与 BIOS 固件）");
        emu=new V86({
          wasm_path:V86_RES.wasm,
          memory_size:128*1024*1024,
          vga_memory_size:8*1024*1024,
          screen_container:screen,
          bios:{url:V86_RES.bios},
          vga_bios:{url:V86_RES.vga},
          [diskKey]:{buffer:imgBuf},
          autostart:true,
        });
        emu.add_listener("emulator-ready",()=>{
          log("运行中 · 点击进入屏幕，使用「锁定鼠标」捕获指针，Esc 释放");
          $('[data-a="lock"]',b).disabled=false;
        });
        emu.add_listener("download-progress",e=>{if(e&&e.total)log(`下载固件中 ${Math.round(e.loaded/e.total*100)}%`)});
        screen.classList.add("gfx");
      }catch(e){console.error(e);log("启动失败: "+e.message);toast("v86 启动失败："+e.message+"（请检查网络后重试）","err");
        $("[data-hint]",b).style.display="flex"}
    }
    $('[data-a="boot"]',b).onclick=boot;
    $('[data-a="lock"]',b).onclick=()=>{
      try{
        if(emu&&emu.lock_mouse)emu.lock_mouse();
        else $("canvas",screen).requestPointerLock();
        toast("鼠标已锁定到虚拟机 · 按 Esc 释放");
      }catch(e){toast("鼠标锁定失败: "+e.message,"err")}};
    win.onClose=()=>{if(emu){try{emu.stop()}catch(_){}emu=null;v86Booted=false}};
    win.onReopen=()=>{};
  }
});
/* =====================================================
   启动序列（直接进入系统，无加载动画）
===================================================== */
function buildDock(){
  const dock=$("#dockapps");
  const pins=["explorer","notepad","editor","browser","media","calc","settings"];
  dock.innerHTML=pins.map(id=>`<button class="dockapp" data-d="${id}" title="${APPS[id]?APPS[id].title:id}">${icon(APPS[id]?APPS[id].icon:"file",20)}</button>`).join("");
  $$("[data-d]",dock).forEach(el=>el.onclick=()=>WM.open(el.dataset.d));
  if(innerWidth<=720)dock.style.display="none";
}
async function bootOS(){
  try{await fs.init()}catch(e){console.error(e);toast("文件系统初始化失败，使用受限模式运行: "+e.message,"err")}
  try{await seedFS()}catch(e){console.warn("种子数据失败",e)}
  buildStart();buildDock();updateTray();
  await refreshDesktop();
  applyWall();
  if(fs.pending().length){
    setTimeout(()=>{toast(`上次挂载的本地文件夹「${esc(fs.pending().join("」「"))}」需要重新授权，点击左侧挂载图标恢复`,"",8000)},800);
  }
  addEventListener("resize",debounce(()=>{
    WM.wins.forEach(w=>{if(w.maxed){const r=$("#desk").getBoundingClientRect();
      Object.assign(w.el.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"})}});
  },200));
}
bootOS();
</script>
