<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Celadon OS · 青瓷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1411'/%3E%3Cpath d='M8 22V10h16' fill='none' stroke='%23d8a657' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%237fc2a4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   CELADON OS — 视觉系统
   风格：墨釉青瓷 × 黄铜仪表  /  Celadon & Brass
   ============================================================ */
:root{
  --font-ui: 'Sora', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font-display: 'Fraunces', 'Songti SC', 'Noto Serif SC', Georgia, serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  --win-radius: 12px;
  --accent: #d8a657;
  --accent-2: #7fc2a4;
  --dur: .22s;
  --ease: cubic-bezier(.2,.9,.25,1);
}
:root[data-theme="dark"]{
  --bg:#0a0f0d; --bg-2:#101815; --bg-3:#16211c;
  --panel:rgba(18,26,23,.86); --panel-solid:#121a17; --elev:rgba(28,40,34,.94);
  --line:rgba(158,196,174,.14); --line-2:rgba(158,196,174,.28);
  --text:#e9efe7; --text-2:#a7b8ac; --text-3:#6e8277;
  --accent-ink:#241a08; --danger:#d8735e; --ok:#7fc2a4;
  --shadow:0 20px 60px rgba(0,0,0,.6), 0 2px 10px rgba(0,0,0,.35);
  --glass-blur:blur(26px) saturate(1.5);
  --field:rgba(255,255,255,.045);
  --hover:rgba(158,196,174,.09);
  --sel:rgba(216,166,87,.18);
  --scroll:rgba(158,196,174,.24);
}
:root[data-theme="light"]{
  --bg:#e6e2d6; --bg-2:#f0ede4; --bg-3:#faf8f2;
  --panel:rgba(250,248,242,.88); --panel-solid:#faf8f2; --elev:rgba(255,255,255,.96);
  --line:rgba(38,58,46,.14); --line-2:rgba(38,58,46,.28);
  --text:#1c2a23; --text-2:#52665a; --text-3:#849488;
  --accent:#9c6b1f; --accent-2:#2f7d61; --accent-ink:#fff8e8;
  --danger:#b4492f; --ok:#2f7d61;
  --shadow:0 20px 55px rgba(50,45,30,.22), 0 2px 8px rgba(50,45,30,.1);
  --glass-blur:blur(24px) saturate(1.3);
  --field:rgba(30,60,42,.045);
  --hover:rgba(38,58,46,.075);
  --sel:rgba(156,107,31,.16);
  --scroll:rgba(38,58,46,.28);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--font-ui); color:var(--text); background:var(--bg);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:padding-box}
::selection{background:var(--sel);color:var(--text)}
input,textarea{user-select:text;-webkit-user-select:text}

/* ---------- 桌面 / 壁纸 ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;z-index:0}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:background-image .6s ease, filter .5s ease;will-change:filter}
#wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 15%, transparent 40%, rgba(0,0,0,.28) 100%);pointer-events:none}
:root[data-theme="light"] #wallpaper::after{background:radial-gradient(120% 90% at 50% 15%, transparent 45%, rgba(255,255,255,.18) 100%)}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.35)}
#desktop-icons{position:absolute;inset:0;z-index:2}
.dicon{
  position:absolute;width:88px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border-radius:10px;border:1px solid transparent;cursor:default;
  transition:left .28s var(--ease), top .28s var(--ease), background .16s, border-color .16s, transform .16s;
  animation:iconIn .5s var(--ease) backwards;
}
@keyframes iconIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.dicon.dragging{transition:none;opacity:.55}
.dicon:hover{background:var(--hover);border-color:var(--line)}
.dicon.selected{background:var(--sel);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.dicon .di-art{width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.dicon .di-art svg{width:42px;height:42px}
.dicon .di-label{
  font-size:11.5px;line-height:1.28;text-align:center;max-width:86px;word-break:break-all;
  color:#f2f6f0;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
:root[data-theme="light"] .dicon .di-label{color:#14201a;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.dicon.selected .di-label{color:var(--accent)}
#marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);pointer-events:none;z-index:40;display:none;border-radius:2px}

/* ---------- 窗口 ---------- */
#windows{position:fixed;inset:0;pointer-events:none;z-index:100}
.win{
  position:absolute;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line-2);border-radius:var(--win-radius);box-shadow:var(--shadow);
  min-width:280px;min-height:180px;
  animation:winIn .24s var(--ease) backwards;
  transition:box-shadow .2s, opacity .2s, border-color .2s;
}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.win.focused{box-shadow:0 26px 70px rgba(0,0,0,.66),0 0 0 1px color-mix(in srgb,var(--accent) 32%,transparent),0 2px 12px rgba(0,0,0,.4)}
.win.minimized{display:none}
.win.maximized{border-radius:0}
.win.peek{opacity:.16}
.win-title{
  height:38px;min-height:38px;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--text) 5%,transparent),transparent);
  border-bottom:1px solid var(--line);cursor:default;flex-shrink:0;
}
.win-title .wt-ico{width:17px;height:17px;color:var(--accent);flex-shrink:0}
.win-title .wt-ico svg{width:17px;height:17px}
.win-title .wt-name{font-size:12px;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--text-2)}
.win.focused .wt-name{color:var(--text)}
.wt-btns{display:flex;gap:2px;flex-shrink:0}
.wt-btn{width:30px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,transform .1s}
.wt-btn svg{width:14px;height:14px}
.wt-btn:hover{background:var(--hover);color:var(--text)}
.wt-btn:active{transform:scale(.9)}
.wt-btn.close:hover{background:var(--danger);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:5}
.rz-n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz-nw{top:-4px;left:-4px;width:14px;height:14px;cursor:nwse-resize}
.rz-ne{top:-4px;right:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz-sw{bottom:-4px;left:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz-se{bottom:-4px;right:-4px;width:14px;height:14px;cursor:nwse-resize}
.win.maximized .rz{display:none}

/* ---------- Snap / Peek ---------- */
#snap-preview{
  position:fixed;z-index:90;pointer-events:none;display:none;border:2px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 20%,transparent);border-radius:var(--win-radius);
  box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;transition:all .12s var(--ease);
}

/* ---------- 任务栏 ---------- */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:52px;z-index:200;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--line-2);box-shadow:0 -6px 30px rgba(0,0,0,.2);
}
.tb-start{
  height:36px;display:flex;align-items:center;gap:9px;padding:0 13px 0 10px;border-radius:8px;
  border:1px solid transparent;font-weight:600;letter-spacing:.06em;font-size:12px;transition:all .18s var(--ease);
}
.tb-start svg{width:19px;height:19px;color:var(--accent)}
.tb-start:hover,.tb-start.on{background:var(--hover);border-color:var(--line-2)}
.tb-start .tb-brand{font-family:var(--font-display);font-size:15px;letter-spacing:.01em}
.tb-search{
  height:34px;width:190px;display:flex;align-items:center;gap:8px;padding:0 11px;border-radius:8px;
  background:var(--field);border:1px solid var(--line);color:var(--text-3);transition:all .2s;
}
.tb-search svg{width:15px;height:15px;flex-shrink:0}
.tb-search:hover{border-color:var(--line-2);background:var(--hover)}
.tb-search input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--text)}
.tb-search input::placeholder{color:var(--text-3)}
#tb-apps{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden;height:100%}
.tb-app{
  height:36px;min-width:0;max-width:190px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;
  border:1px solid transparent;color:var(--text-2);transition:all .16s;position:relative;flex-shrink:1;
}
.tb-app svg{width:17px;height:17px;flex-shrink:0;color:var(--accent)}
.tb-app span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-app:hover{background:var(--hover);color:var(--text)}
.tb-app.active{background:var(--hover);border-color:var(--line-2);color:var(--text)}
.tb-app.active::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
#tb-tray{display:flex;align-items:center;gap:2px;flex-shrink:0}
.tray-btn{height:34px;min-width:30px;padding:0 7px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--text-2);transition:background .15s}
.tray-btn:hover{background:var(--hover);color:var(--text)}
.tray-btn svg{width:15px;height:15px}
#tb-clock{font-family:var(--font-mono);font-size:11.5px;line-height:1.15;text-align:right;letter-spacing:.02em;white-space:nowrap}
#tb-clock small{display:block;font-size:9.5px;color:var(--text-3);font-family:var(--font-ui)}
.tb-peek{width:8px;height:34px;margin-left:4px;border-left:1px solid var(--line);border-radius:0 4px 4px 0}
.tb-peek:hover{background:var(--accent);opacity:.7}

/* ---------- 开始菜单 ---------- */
#startmenu{
  position:fixed;left:12px;bottom:62px;width:390px;max-height:min(76vh,660px);z-index:210;
  background:var(--elev);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom left;
  animation:smIn .26s var(--ease) backwards;
}
@keyframes smIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
#startmenu[hidden],.hidden{display:none !important}
.sm-head{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.sm-head .sm-logo{font-family:var(--font-display);font-size:22px;letter-spacing:.02em}
.sm-head .sm-logo em{font-style:normal;color:var(--accent)}
.sm-head .sm-sub{font-size:10px;letter-spacing:.22em;color:var(--text-3);text-transform:uppercase;font-family:var(--font-mono)}
.sm-search{margin:6px 16px 12px;height:36px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:9px;background:var(--field);border:1px solid var(--line)}
.sm-search svg{width:15px;height:15px;color:var(--text-3)}
.sm-search input{border:0;outline:0;background:transparent;flex:1;font-size:12px}
.sm-label{padding:4px 20px 8px;font-size:10px;letter-spacing:.18em;color:var(--text-3);text-transform:uppercase;font-family:var(--font-mono)}
.sm-grid{padding:0 14px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;overflow-y:auto;flex:1}
.sm-item{
  padding:12px 4px 10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  border:1px solid transparent;transition:all .16s var(--ease);animation:smItem .4s var(--ease) backwards;
}
@keyframes smItem{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.sm-item:hover{background:var(--hover);border-color:var(--line-2);transform:translateY(-2px)}
.sm-item .si-art{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--field);border:1px solid var(--line);color:var(--accent)}
.sm-item .si-art svg{width:22px;height:22px}
.sm-item span{font-size:10.5px;text-align:center;line-height:1.2}
.sm-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.sm-user{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text-2)}
.sm-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid var(--line-2);color:var(--accent);font-family:var(--font-display);font-size:14px}
.sm-power{display:flex;gap:4px}

/* ---------- 右键菜单 / 弹出面板 ---------- */
#ctxmenu{
  position:fixed;z-index:400;min-width:214px;max-width:270px;padding:6px;
  background:var(--elev);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow);
  animation:ctxIn .14s var(--ease) backwards;
}
@keyframes ctxIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.ctx-item{height:32px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text);width:100%;text-align:left;transition:background .12s}
.ctx-item:hover{background:var(--hover)}
.ctx-item svg{width:15px;height:15px;color:var(--text-3);flex-shrink:0}
.ctx-item.danger svg{color:var(--danger)}
.ctx-item.danger:hover{background:color-mix(in srgb,var(--danger) 18%,transparent)}
.ctx-item .ctx-key{margin-left:auto;font-size:10px;color:var(--text-3);font-family:var(--font-mono)}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
.ctx-label{padding:7px 10px 4px;font-size:10px;letter-spacing:.14em;color:var(--text-3);font-family:var(--font-mono);text-transform:uppercase}

/* ---------- 日历 / 通知面板 ---------- */
#tray-panel{
  position:fixed;right:10px;bottom:62px;width:310px;z-index:210;padding:16px;
  background:var(--elev);backdrop-filter:var(--glass-blur);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);
  animation:smIn .22s var(--ease) backwards;
}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-family:var(--font-display);font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .cw{font-size:10px;color:var(--text-3);padding:5px 0;font-family:var(--font-mono)}
.cal-d{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:11.5px;color:var(--text-2);transition:background .15s}
.cal-d:hover{background:var(--hover)}
.cal-d.out{color:var(--text-3);opacity:.45}
.cal-d.today{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:10px 16px;border-radius:10px;background:var(--elev);border:1px solid var(--line-2);box-shadow:var(--shadow);
  backdrop-filter:var(--glass-blur);font-size:12px;display:flex;align-items:center;gap:9px;max-width:340px;
  animation:toastIn .3s var(--ease) backwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.toast svg{width:16px;height:16px;color:var(--accent);flex-shrink:0}
.toast.err svg{color:var(--danger)}
.toast.out{opacity:0;transform:translateY(-10px);transition:all .25s}

/* ---------- 通用 UI 元件 ---------- */
.btn{
  height:30px;padding:0 11px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--field);font-size:11.5px;color:var(--text-2);white-space:nowrap;
  transition:all .15s var(--ease);flex-shrink:0;
}
.btn svg{width:14px;height:14px}
.btn:hover{background:var(--hover);border-color:var(--line-2);color:var(--text)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.btn.on{background:var(--sel);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent)}
.btn.sq{width:30px;padding:0}
.inp{
  height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--field);
  outline:0;font-size:12px;min-width:0;color:var(--text);transition:border-color .15s;
}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--text-3)}
select.inp{padding-right:6px;cursor:pointer}
option{background:var(--panel-solid);color:var(--text)}
.toolbar{
  min-height:44px;display:flex;align-items:center;gap:6px;padding:6px 10px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--text) 2.5%,transparent);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
}
.toolbar .inp,.toolbar .chip,.toolbar .seg{flex-shrink:0}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex-shrink:0}
.toolbar .spacer{flex:1;min-width:4px}
.statusbar{
  height:26px;min-height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;flex-shrink:0;
  border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);
  background:color-mix(in srgb,var(--text) 2%,transparent);overflow:hidden;white-space:nowrap;
}
.pane{flex:1;min-height:0;overflow:auto;position:relative}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;color:var(--text-3);font-size:12px;text-align:center;padding:24px}
.empty svg{width:42px;height:42px;opacity:.5}
.chip{padding:2px 7px;border-radius:5px;background:var(--field);border:1px solid var(--line);font-size:10px;font-family:var(--font-mono);color:var(--text-3)}
.loading-mask{position:absolute;inset:0;background:var(--panel-solid);display:flex;align-items:center;justify-content:center;z-index:30;gap:12px;color:var(--text-2);font-size:12px}
.spinner{width:20px;height:20px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:4px;border-radius:4px;background:var(--field);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s;width:0}

/* ---------- 对话框 ---------- */
.modal-mask{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(440px,100%);background:var(--elev);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);
  padding:20px;animation:winIn .24s var(--ease) backwards;max-height:86vh;overflow:auto;
}
.modal h3{margin:0 0 6px;font-family:var(--font-display);font-size:19px;font-weight:600}
.modal p{margin:0 0 16px;color:var(--text-2);font-size:12px;line-height:1.6}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal label.fld{display:block;font-size:11px;color:var(--text-2);margin:12px 0 6px}
.modal .inp{width:100%}

/* ---------- 锁屏 ---------- */
#lockscreen{position:fixed;inset:0;z-index:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);background-size:cover;background-position:center;transition:opacity .4s,transform .4s}
#lockscreen .lk-time{font-family:var(--font-display);font-size:clamp(64px,12vw,140px);line-height:1;letter-spacing:-.03em;text-shadow:0 10px 50px rgba(0,0,0,.5)}
#lockscreen .lk-date{font-family:var(--font-mono);letter-spacing:.3em;font-size:13px;color:var(--text-2);text-transform:uppercase}
#lockscreen .lk-hint{margin-top:30px;font-size:11px;color:var(--text-3);letter-spacing:.1em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
/* ---------- 文件资源管理器 ---------- */
.fe-wrap{display:flex;flex:1;min-height:0;overflow:hidden}
.fe-side{
  width:210px;min-width:150px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--text) 2.5%,transparent);
  overflow-y:auto;padding:10px 8px;flex-shrink:0;
}
.fe-side h4{margin:8px 10px 6px;font-size:9.5px;letter-spacing:.2em;color:var(--text-3);font-family:var(--font-mono);text-transform:uppercase;font-weight:500}
.fe-nav{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border-radius:7px;font-size:11.5px;color:var(--text-2);text-align:left;transition:all .14s}
.fe-nav:hover{background:var(--hover);color:var(--text)}
.fe-nav.on{background:var(--sel);color:var(--accent)}
.fe-nav svg{width:15px;height:15px;flex-shrink:0;color:var(--text-3)}
.fe-nav.on svg{color:var(--accent)}
.fe-nav .fe-caret{width:12px;height:12px;margin-left:auto;transition:transform .18s}
.fe-nav .fe-caret.open{transform:rotate(90deg)}
.fe-tree{padding-left:12px;overflow:hidden}
.fe-tree .fe-nav{height:28px;font-size:11px;padding-left:8px}
.fe-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.fe-crumbs{display:flex;align-items:center;gap:3px;height:38px;min-height:38px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.crumb{padding:4px 8px;border-radius:6px;font-size:11.5px;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:5px;transition:background .14s}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb svg{width:12px;height:12px;color:var(--text-3)}
.crumb.cur{color:var(--text);font-weight:500}
.fe-view{flex:1;min-height:0;position:relative;overflow:auto;outline:0;background:transparent}
.fe-marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);pointer-events:none;display:none;z-index:20}
/* 列表（详细信息）视图：左对齐连续列，右侧留白为框选区 */
.fe-head{display:flex;height:32px;min-height:32px;position:sticky;top:0;z-index:8;background:var(--panel-solid);border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.fe-hcell{display:flex;align-items:center;gap:5px;padding:0 9px;font-size:11px;color:var(--text-2);border-right:1px solid var(--line);position:relative;cursor:pointer;white-space:nowrap;flex-shrink:0;user-select:none}
.fe-hcell:hover{background:var(--hover);color:var(--text)}
.fe-hcell .sort{width:11px;height:11px;color:var(--accent);opacity:0;transition:opacity .15s}
.fe-hcell.sorted .sort{opacity:1}
.fe-hcell.desc .sort{transform:rotate(180deg)}
.fe-colgrip{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:3}
.fe-colgrip:hover::after{content:"";position:absolute;left:3px;top:4px;bottom:4px;width:1px;background:var(--accent)}
.fe-row{display:flex;align-items:center;height:34px;width:max-content;min-width:0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:default;transition:background .1s}
.fe-row:hover{background:var(--hover)}
.fe-row.sel{background:var(--sel)}
.fe-row.sel:hover{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.fe-cell{padding:0 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;color:var(--text-2)}
.fe-cell.name{display:flex;align-items:center;gap:9px;color:var(--text);font-size:12px}
.fe-cell.name svg{width:18px;height:18px;flex-shrink:0}
.fe-cell.mono{font-family:var(--font-mono);font-size:10.5px}
.fe-row .fe-cell:nth-child(n+2){border-left:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
/* 图标视图 */
.fe-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:14px;align-content:start}
.fe-ico{padding:10px 5px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid transparent;transition:background .12s,border-color .12s;cursor:default;min-height:96px}
.fe-ico:hover{background:var(--hover)}
.fe-ico.sel{background:var(--sel);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fe-ico .art{width:48px;height:48px;display:grid;place-items:center;overflow:hidden;border-radius:6px}
.fe-ico .art svg{width:46px;height:46px}
.fe-ico .art img{width:46px;height:46px;object-fit:cover;border-radius:4px}
.fe-ico .nm{font-size:11px;text-align:center;word-break:break-all;line-height:1.25;max-width:92px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 分栏视图（双栏：目录树 + 详情） */
.fe-cols{display:flex;height:100%;min-height:0}
.fe-col-tree{width:190px;min-width:130px;border-right:1px solid var(--line);overflow:auto;padding:8px}
.fe-col-detail{flex:1;min-width:0;overflow:auto;padding:14px}
.fe-detail-card{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px;background:var(--field)}
.fe-detail-card .art{width:72px;height:72px;display:grid;place-items:center;flex-shrink:0}
.fe-detail-card .art svg{width:64px;height:64px}
.fe-detail-card h4{margin:0 0 6px;font-size:14px;font-weight:600}
.fe-detail-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:11px;color:var(--text-2)}
.fe-detail-card dt{color:var(--text-3);font-family:var(--font-mono);font-size:10px}
/* 搜索结果 */
.fe-searchbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--field)}
.fe-searchbar svg{width:14px;height:14px;color:var(--text-3)}
.fe-searchbar input{flex:1;border:0;outline:0;background:transparent;font-size:12px}
.fe-badge{padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;font-family:var(--font-mono)}

/* ---------- 记事本 ---------- */
.np-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.np-area{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;padding:16px 18px;background:transparent;color:var(--text);font-family:var(--font-mono);line-height:1.7;font-size:13px;tab-size:2;white-space:pre;overflow:auto}
.np-area::placeholder{color:var(--text-3)}

/* ---------- 表格 ---------- */
.tb-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.tb-scroll{flex:1;min-height:0;overflow:auto;position:relative}
.tb-table{border-collapse:separate;border-spacing:0;font-size:11.5px;min-width:100%}
.tb-table th,.tb-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;min-width:92px;max-width:320px}
.tb-table th{background:var(--field);height:28px;position:sticky;top:0;z-index:2;font-family:var(--font-mono);font-size:10px;color:var(--text-3);text-align:center;font-weight:500}
.tb-rownum{width:42px;min-width:42px;max-width:42px;background:var(--field);color:var(--text-3);font-family:var(--font-mono);font-size:10px;text-align:center;position:sticky;left:0;z-index:1}
.tb-table td[contenteditable]{outline:0;padding:5px 8px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.tb-table td[contenteditable]:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--sel)}
.tb-source{width:100%;height:100%;border:0;outline:0;resize:none;padding:16px;background:transparent;color:var(--text);font-family:var(--font-mono);font-size:12.5px;line-height:1.65}

/* ---------- HTML 编辑器 (CodeMirror) ---------- */
.ed-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.ed-split{flex:1;min-height:0;display:flex;overflow:hidden;position:relative}
.ed-split.v{flex-direction:column}
.ed-code{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:#212121}
.ed-code .CodeMirror{height:100%;font-family:var(--font-mono);font-size:13px;line-height:1.65}
.ed-code .CodeMirror-gutters{border-right:1px solid rgba(255,255,255,.07)}
.ed-preview{flex:1;min-width:0;min-height:0;position:relative;background:#fff;overflow:hidden}
.ed-preview iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.ed-preview.dark iframe{background:#121a17}
.ed-mask{position:absolute;inset:0;background:#0d1411;display:flex;align-items:center;justify-content:center;gap:10px;color:#a7b8ac;font-size:12px;z-index:5;transition:opacity .3s}
.ed-mask.gone{opacity:0;pointer-events:none}
.ed-splitter{flex:0 0 5px;background:var(--line);cursor:col-resize;position:relative;z-index:4;transition:background .15s}
.ed-split.v .ed-splitter{cursor:row-resize;flex-basis:5px;width:auto}
.ed-splitter:hover,.ed-splitter.active{background:var(--accent)}
.ed-splitter::after{content:"";position:absolute;inset:0}
.ed-find{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--field);flex-wrap:wrap;flex-shrink:0}
.ed-find .inp{height:26px;font-size:11px;width:170px}
.ed-find .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);min-width:56px}
.ed-tool .btn{height:28px}
/* 编辑器工具栏自动换行，保证每个按钮的文字始终可见 */
#ed-tb1,#ed-tb2{flex-wrap:wrap;height:auto;min-height:44px;overflow:visible;row-gap:5px;padding:5px 8px}
#ed-tb2 .chip{background:transparent;border:0;color:var(--text-2);font-size:10.5px;padding:0 3px;letter-spacing:.04em}
.cm-s-material-darker.CodeMirror{background:#1c2420;color:#e9efe7}
.cm-s-material-darker .CodeMirror-gutters{background:#18201c}
.cm-s-material-darker .CodeMirror-activeline-background{background:rgba(216,166,87,.07)}

/* ---------- 图片查看器 ---------- */
.iv-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:repeating-conic-gradient(rgba(128,128,128,.09) 0% 25%, transparent 0% 50%) 50%/22px 22px}
.iv-stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
.iv-stage img{max-width:none;display:block;transform-origin:center center;transition:transform .12s;user-select:none;-webkit-user-drag:none}
.iv-stage.fit img{max-width:100%;max-height:100%;object-fit:contain}

/* ---------- 媒体播放器 ---------- */
.md-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080b0a;gap:14px;padding:16px}
.md-wrap video,.md-wrap audio{max-width:100%;max-height:100%;width:100%;border-radius:8px;outline:0}
.md-wrap video{max-height:calc(100% - 40px)}
.md-title{font-size:11.5px;color:#a7b8ac;font-family:var(--font-mono)}

/* ---------- 漫画阅读器（Webtoon） ---------- */
.mg-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#000;position:relative}
.mg-scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:#000;
  overscroll-behavior-y:none;touch-action:pan-y;contain:layout style;-webkit-overflow-scrolling:touch;
  cursor:grab;
}
.mg-scroll.grabbing{cursor:grabbing}
.mg-inner{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 0 80px}
.mg-page{width:100%;max-width:920px;position:relative;background:#0b0b0b;display:block}
.mg-page img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.mg-page .pg-no{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:5px;background:rgba(0,0,0,.6);color:#ddd;font-family:var(--font-mono);font-size:10px}
.mg-page.err{height:70px;display:grid;place-items:center;color:#777;font-size:11px;font-family:var(--font-mono)}
.mg-hud{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);color:#d8d8d8;font-family:var(--font-mono);font-size:10.5px;z-index:4;pointer-events:none}
.mg-hud .bar{flex:1;height:3px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.mg-hud .bar i{display:block;height:100%;background:var(--accent);width:0}
.mg-exit{position:fixed;top:14px;right:16px;z-index:10000;width:34px;height:34px;border-radius:50%;display:none;place-items:center;background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(8px);opacity:.28;transition:opacity .2s}
.mg-exit:hover{opacity:1}
.mg-exit.show{display:grid}
.mg-exit svg{width:17px;height:17px}
.mg-load{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#888;font-size:12px;z-index:6}

/* ---------- 网页浏览器 ---------- */
.br-wrap{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.br-stage{flex:1;min-height:0;position:relative;background:#fff}
.br-stage iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.br-mask{position:absolute;inset:0;background:#0d1411;display:flex;align-items:center;justify-content:center;gap:10px;color:#a7b8ac;font-size:12px;z-index:5;transition:opacity .3s}
.br-mask.gone{opacity:0;pointer-events:none}

/* ---------- 计算器 ---------- */
.ca-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:10px;background:var(--bg-2)}
.ca-screen{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:right;min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.ca-expr{font-family:var(--font-mono);font-size:12px;color:var(--text-3);min-height:18px;word-break:break-all}
.ca-val{font-family:var(--font-display);font-size:34px;line-height:1.1;word-break:break-all}
.ca-hist{font-family:var(--font-mono);font-size:10px;color:var(--text-3);height:44px;overflow:auto;white-space:pre-line;text-align:right}
.ca-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:7px;min-height:0}
.ca-key{border:1px solid var(--line);background:var(--field);border-radius:9px;font-family:var(--font-mono);font-size:16px;transition:all .12s;display:grid;place-items:center}
.ca-key:hover{background:var(--hover);border-color:var(--line-2)}
.ca-key:active{transform:scale(.94)}
.ca-key.op{color:var(--accent);font-size:15px}
.ca-key.eq{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.ca-key.fn{color:var(--text-3);font-size:12px}

/* ---------- 画板 ---------- */
.pa-wrap{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:#f3f0e8}
.pa-canvas{flex:1;min-height:0;width:100%;touch-action:none;display:block;cursor:crosshair}
.pa-color{width:26px;height:26px;border-radius:6px;border:2px solid var(--line-2);padding:0;overflow:hidden;cursor:pointer}
.pa-swatches{display:flex;gap:4px;align-items:center}

/* ---------- 设置 ---------- */
.se-wrap{flex:1;min-height:0;display:flex;overflow:hidden}
.se-nav{width:178px;min-width:130px;border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto;flex-shrink:0;background:color-mix(in srgb,var(--text) 2%,transparent)}
.se-nav button{width:100%;height:34px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2);text-align:left;transition:all .14s}
.se-nav button svg{width:15px;height:15px;color:var(--text-3)}
.se-nav button:hover{background:var(--hover);color:var(--text)}
.se-nav button.on{background:var(--sel);color:var(--accent)}
.se-nav button.on svg{color:var(--accent)}
.se-body{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 40px}
.se-body h2{margin:0 0 4px;font-family:var(--font-display);font-size:24px;font-weight:600}
.se-body .lead{color:var(--text-3);font-size:11.5px;margin-bottom:22px}
.se-sec{margin-bottom:26px;max-width:720px}
.se-sec h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--font-mono);color:var(--text-3);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:500}
.se-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);min-height:52px}
.se-row .lbl{flex:1;min-width:0}
.se-row .lbl b{display:block;font-size:12.5px;font-weight:500}
.se-row .lbl small{display:block;color:var(--text-3);font-size:10.5px;margin-top:2px;line-height:1.4}
.se-row .ctl{flex-shrink:0;display:flex;align-items:center;gap:8px}
.switch{width:38px;height:21px;border-radius:11px;background:var(--line-2);position:relative;transition:background .2s;flex-shrink:0;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--text);transition:transform .2s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px);background:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--field)}
.seg button{padding:5px 11px;font-size:11px;color:var(--text-2);border-right:1px solid var(--line);transition:all .15s}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--line-2);outline:0;width:130px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--panel-solid)}
input[type=color]{width:34px;height:28px;border:1px solid var(--line-2);border-radius:6px;background:transparent;padding:2px;cursor:pointer}
/* 存储可视化 */
.st-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--field);margin-bottom:12px}
.st-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.st-top b{font-family:var(--font-display);font-size:20px;font-weight:600}
.st-top small{color:var(--text-3);font-family:var(--font-mono);font-size:10px}
.st-bar{height:12px;border-radius:6px;background:var(--bg-3);display:flex;overflow:hidden;border:1px solid var(--line)}
.st-bar i{display:block;height:100%;transition:width .5s var(--ease)}
.st-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.st-legend span{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-2);font-family:var(--font-mono)}
.st-legend i{width:9px;height:9px;border-radius:2px;display:block}
.st-donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.st-donut .ring{width:120px;height:120px;border-radius:50%;position:relative;flex-shrink:0}
.st-donut .ring::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--panel-solid)}
.st-donut .ring .ctr{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-family:var(--font-display);font-size:17px;text-align:center;line-height:1.15}
.st-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.st-app{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:11.5px}
.st-app svg{width:17px;height:17px;color:var(--accent)}
.st-app .sw{margin-left:auto}
.st-mount{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--field);font-size:11.5px}
.st-mount svg{width:17px;height:17px;color:var(--accent);flex-shrink:0}
.st-mount .grow{flex:1;min-width:0}
.st-mount small{display:block;color:var(--text-3);font-family:var(--font-mono);font-size:10px}
/* 壁纸张贴 */
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wp-item{aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:2px solid transparent;position:relative;cursor:pointer;background-size:cover;background-position:center;transition:all .18s}
.wp-item:hover{transform:translateY(-2px)}
.wp-item.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.wp-item span{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;font-size:10px;background:rgba(0,0,0,.5);color:#fff}
/* 属性对话框信息表 */
.pp-table{width:100%;border-collapse:collapse;font-size:11.5px}
.pp-table td{padding:6px 4px;border-bottom:1px solid var(--line);color:var(--text-2)}
.pp-table td:first-child{color:var(--text-3);font-family:var(--font-mono);font-size:10.5px;width:96px}

/* ---------- V86 虚拟机 ---------- */
.v86-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#000;align-items:center;justify-content:center;gap:14px;padding:14px;position:relative}
#screen_container{display:flex;flex-direction:column;align-items:center;max-width:100%;max-height:100%;overflow:hidden}
#screen_container div{white-space:pre;font-family:monospace;font-size:12px;line-height:12px;color:#aaa;background:#000}
#screen_container canvas{max-width:100%;max-height:100%;image-rendering:pixelated;background:#000}
.v86-hint{color:#889;font-size:11.5px;max-width:420px;text-align:center;line-height:1.7}
.v86-boot{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#a7b8ac;font-size:12px;z-index:5}

/* ---------- 终端 ---------- */
.tm-wrap{flex:1;min-height:0;overflow:auto;background:#0b100e;padding:14px 16px;font-family:var(--font-mono);font-size:12px;line-height:1.7;color:#c7d6cc}
.tm-line{white-space:pre-wrap;word-break:break-all}
.tm-line .cmd{color:var(--accent-2)}
.tm-line .er{color:var(--danger)}
.tm-line .dim{color:var(--text-3)}
.tm-input{display:flex;gap:8px;align-items:center}
.tm-input input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--font-mono);font-size:12px}
.tm-prompt{color:var(--accent);white-space:nowrap}

/* ---------- 漫画沉浸全屏：除右上角退出按钮外什么都不显示 ---------- */
.win.mg-fs{position:fixed !important;inset:0 !important;left:0 !important;top:0 !important;width:100% !important;height:100% !important;
  border:0 !important;border-radius:0 !important;background:#000 !important;box-shadow:none !important;z-index:9999 !important}
.win.mg-fs .win-title,.win.mg-fs .toolbar,.win.mg-fs .statusbar,.win.mg-fs .mg-hud,.win.mg-fs .rz{display:none !important}
.win.mg-fs .win-body,.win.mg-fs .mg-wrap{background:#000}
.win.mg-fs .mg-page{max-width:none;width:100%}
body:has(.win.mg-fs) #taskbar,body:has(.win.mg-fs) #startmenu,body:has(.win.mg-fs) #ctxmenu{display:none !important}
.mg-load.gone{opacity:0;pointer-events:none}

/* ---------- 挂载恢复提示卡 ---------- */
#mount-notice{position:fixed;top:14px;right:14px;z-index:300;width:290px;padding:14px;border-radius:12px;background:var(--elev);border:1px solid var(--line-2);box-shadow:var(--shadow);animation:toastIn .3s var(--ease) backwards}
#mount-notice h4{margin:0 0 6px;font-size:12.5px;display:flex;align-items:center;gap:8px}
#mount-notice h4 svg{width:16px;height:16px;color:var(--accent)}
#mount-notice p{margin:0 0 10px;font-size:11px;color:var(--text-3);line-height:1.5}

/* ---------- 响应式：平板 / 手机 ---------- */
@media (max-width:1050px){
  .tb-search{width:140px}
  .tb-app span{display:none}
  .tb-app{max-width:44px;justify-content:center;padding:0 8px}
  .fe-side{width:172px}
}
@media (max-width:760px){
  #taskbar{height:60px;padding:0 8px calc(env(safe-area-inset-bottom,0px)) 8px;gap:4px}
  .tb-start{padding:0 10px;height:42px}
  .tb-start .tb-brand{display:none}
  .tb-search{display:none}
  #tb-apps{justify-content:flex-start;gap:2px}
  .tb-app{height:42px;min-width:42px;max-width:52px;padding:0 6px}
  .tb-app svg{width:20px;height:20px}
  .tb-app.active::after{bottom:-9px}
  #tb-tray .tray-hide{display:none}
  #tb-clock{font-size:10.5px}
  #startmenu{left:8px;right:8px;bottom:70px;width:auto;max-height:72vh;border-radius:16px}
  .sm-grid{grid-template-columns:repeat(4,1fr)}
  .win{border-radius:var(--win-radius)}
  .win:not(.maximized):not(.dialog){
    left:6px !important;right:6px !important;top:8px !important;bottom:68px !important;
    width:auto !important;height:auto !important;
  }
  .win-title{height:42px;min-height:42px}
  .wt-btn{width:36px;height:32px}
  .fe-side{position:absolute;left:0;top:0;bottom:0;z-index:12;width:220px;box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .24s var(--ease)}
  .fe-side.open{transform:none}
  .fe-cols .fe-col-tree{display:none}
  .se-nav{width:56px;min-width:56px;padding:8px 5px}
  .se-nav button{font-size:0;justify-content:center;padding:0}
  .se-nav button svg{width:18px;height:18px}
  .se-body{padding:16px 14px 40px}
  .toolbar{gap:4px;padding:5px 6px}
  .btn{padding:0 8px;height:30px}
  .ed-split:not(.v){flex-direction:column}
  .ed-splitter{cursor:row-resize}
  .ed-mask,.br-mask{background:#0d1411}
  .statusbar{font-size:9.5px;gap:9px}
  .modal{width:100%}
  .dicon{width:76px}
  .dicon .di-label{font-size:10.5px;max-width:74px}
  .tb-peek{display:none}
}
@media (max-width:420px){
  .toolbar .lbl-txt{display:none}
  .fe-crumbs{height:34px;min-height:34px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ==================================================================
   [1] 存储层 —— 多后端统一虚拟文件系统
   OPFS(主存) / IndexedDB(副存) / File System Access(本地挂载) / 内存(最终降级)
   localStorage 与 Cookie 负责配置与轻量元数据镜像；IndexedDB 负责 mtime 元数据
   ================================================================== */
let IDB=null, IDB_OK=false;
function openIDB(){
  return new Promise(res=>{
    let req;
    try{ req=indexedDB.open('celadon_os',1); }catch(e){ return res(null); }
    req.onupgradeneeded=()=>{ const d=req.result;
      if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'path'});
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'path'});
      if(!d.objectStoreNames.contains('mounts'))d.createObjectStore('mounts',{keyPath:'id'});
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'});
    };
    req.onsuccess=()=>res(req.result); req.onerror=()=>res(null); req.onblocked=()=>res(null);
    setTimeout(()=>{ if(!IDB)res(null); },4000);
  });
}
function idbTx(store,mode,fn){
  return new Promise((res,rej)=>{
    if(!IDB)return rej(new Error('IndexedDB 不可用'));
    let t; try{ t=IDB.transaction(store,mode); }catch(e){ return rej(e); }
    const s=t.objectStore(store); let out;
    try{ out=fn(s); }catch(e){ return rej(e); }
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);
    t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('事务中止'));
  });
}
const idbGet=(store,key)=>idbTx(store,'readonly',s=>s.get(key));
const idbPut=(store,val)=>idbTx(store,'readwrite',s=>s.put(val));
const idbDel=(store,key)=>idbTx(store,'readwrite',s=>s.delete(key));
const idbAll=(store)=>idbTx(store,'readonly',s=>s.getAll());
const idbClear=(store)=>idbTx(store,'readwrite',s=>s.clear());

/* --- 元数据层：全局 mtime / size / 标记。移动与复制均保留修改日期 --- */
const Meta={
  _mem:new Map(),
  async init(){
    IDB=await openIDB(); IDB_OK=!!IDB;
    if(!IDB_OK){ try{ this._mem=new Map(LS.get('meta',[])); }catch(e){} }
    else { try{ const a=await idbAll('meta'); a.forEach(x=>this._mem.set(x.path,x)); }catch(e){} }
  },
  get(p){ return this._mem.get(norm(p))||null; },
  async set(p,o){
    p=norm(p); const v=Object.assign({},this._mem.get(p)||{},o,{path:p}); this._mem.set(p,v);
    if(IDB_OK){ try{ await idbPut('meta',v); }catch(e){} } else LS.set('meta',[...this._mem]);
    return v;
  },
  async del(p){
    p=norm(p); this._mem.delete(p);
    if(IDB_OK){ try{ await idbDel('meta',p); }catch(e){} } else LS.set('meta',[...this._mem]);
  },
  async delTree(prefix){
    prefix=norm(prefix); for(const k of [...this._mem.keys()]) if(k===prefix||k.startsWith(prefix+'/')) await this.del(k);
  },
  all(){ return [...this._mem.values()]; }
};

/* --- 参数签名兼容包装：识别末尾 callback，忽略多余参数(isLstat/flag/opts) --- */
function compat(obj){
  const out={};
  for(const k of Object.keys(obj)){
    if(typeof obj[k]!=='function'){ out[k]=obj[k]; continue; }
    const fn=obj[k].bind(obj);
    out[k]=async function(...args){
      let cb=null;
      const i=args.findIndex(a=>typeof a==='function');
      if(i>=0){ cb=args[i]; args.splice(i,1); }
      try{ const r=await fn(...args); if(cb)cb(null,r); return r; }
      catch(e){ if(cb)cb(e); else throw e; }
    };
  }
  return out;
}
const ERR_NOTFOUND=()=>{ const e=new Error('路径不存在'); e.code='ENOENT'; return e; };

/* ---------------- 后端 A：OPFS ---------------- */
function makeOPFS(root){
  return compat({
    kind:'opfs',
    async _dir(rel,create){
      let h=root; const segs=rel.split('/').filter(Boolean);
      for(const s of segs) h=await h.getDirectoryHandle(s,{create:!!create});
      return h;
    },
    async _parent(rel,create){ const i=rel.lastIndexOf('/'); const d=i<=0?'':rel.slice(0,i); return {dir:await this._dir(d,create),name:rel.slice(i+1)}; },
    async stat(rel){
      rel=norm(rel); if(rel==='/')return {type:'dir',size:0,mtime:Date.now(),name:'/'};
      const {dir,name}=await this._parent(rel,false);
      try{ const f=await dir.getFileHandle(name); const file=await f.getFile(); return {type:'file',size:file.size,mtime:file.lastModified,name}; }
      catch(e){ const d=await dir.getDirectoryHandle(name); return {type:'dir',size:0,mtime:Date.now(),name}; }
    },
    async readdir(rel){
      const d=await this._dir(rel,false); const out=[];
      for await (const k of d.keys()) out.push(k);
      return out;
    },
    async mkdir(rel,opts){ await this._dir(rel,true); },
    async readFile(rel,flag){
      const {dir,name}=await this._parent(rel,false); const f=await dir.getFileHandle(name);
      return await (await f.getFile()).arrayBuffer();
    },
    async writeFile(rel,data,opts){
      const ab=await toAB(data);
      const {dir,name}=await this._parent(rel,true); const f=await dir.getFileHandle(name,{create:true});
      const w=await f.createWritable(); await w.write(ab); await w.close();
    },
    async unlink(rel){ const {dir,name}=await this._parent(rel,false); await dir.removeEntry(name); },
    async rmdir(rel){
      if(norm(rel)==='/')return; const {dir,name}=await this._parent(rel,false);
      await dir.removeEntry(name,{recursive:true});
    },
    async rename(oldRel,newRel){
      const a=await this._parent(oldRel,false);
      let handle; try{ handle=await a.dir.getFileHandle(a.name); }catch(e){ handle=await a.dir.getDirectoryHandle(a.name); }
      const b=await this._parent(newRel,true);
      if(handle.move){ try{ await handle.move(b.dir,b.name); return; }catch(e){} }
      const st=await this.stat(oldRel);
      if(st.type==='file'){ const ab=await this.readFile(oldRel); await this.writeFile(newRel,ab); await this.unlink(oldRel); }
      else { await this.rmdir(newRel).catch(()=>{}); await this.mkdir(newRel,{}); for(const n of await this.readdir(oldRel)) await this.rename(oldRel+'/'+n,newRel+'/'+n); await this.rmdir(oldRel); }
    },
    async exists(rel){ try{ await this.stat(rel); return true; }catch(e){ return false; } }
  });
}

/* ---------------- 后端 B：IndexedDB ---------------- */
function makeIDBFS(){
  return compat({
    kind:'idb',
    async stat(rel){
      rel=norm(rel); if(rel==='/')return {type:'dir',size:0,mtime:Date.now(),name:'/'};
      const r=await idbGet('files',rel); if(!r)throw ERR_NOTFOUND();
      return {type:r.kind==='dir'?'dir':'file',size:r.size||0,mtime:r.mtime||Date.now(),name:pathName(rel)};
    },
    async readdir(rel){
      rel=norm(rel); const all=await idbAll('files'); const pre=rel==='/'?'/':rel+'/'; const set=new Set();
      for(const r of all){ if(r.path===rel)continue;
        if(r.path.startsWith(pre)){ const rest=r.path.slice(pre.length); const n=rest.split('/')[0]; if(n)set.add(n); } }
      return [...set];
    },
    async mkdir(rel,opts){ rel=norm(rel); await idbPut('files',{path:rel,kind:'dir',mtime:Date.now(),size:0});
      let p=pathDir(rel); while(p&&p!=='/'){ if(!(await idbGet('files',p)))await idbPut('files',{path:p,kind:'dir',mtime:Date.now(),size:0}); p=pathDir(p); } },
    async readFile(rel,flag){ const r=await idbGet('files',norm(rel)); if(!r||r.kind!=='file')throw ERR_NOTFOUND(); return r.data||new ArrayBuffer(0); },
    async writeFile(rel,data,opts){ const ab=await toAB(data); const p=norm(rel); const m=Meta.get(p);
      await idbPut('files',{path:p,kind:'file',data:ab,mtime:(m&&m.mtime)||Date.now(),size:ab.byteLength});
      let d=pathDir(p); while(d&&d!=='/'){ if(!(await idbGet('files',d)))await idbPut('files',{path:d,kind:'dir',mtime:Date.now(),size:0}); d=pathDir(d); }
    },
    async unlink(rel){ await idbDel('files',norm(rel)); },
    async rmdir(rel){ rel=norm(rel); const all=await idbAll('files');
      for(const r of all) if(r.path===rel||r.path.startsWith(rel+'/')) await idbDel('files',r.path); },
    async rename(a,b){ a=norm(a);b=norm(b); const all=await idbAll('files');
      for(const r of all) if(r.path===a||r.path.startsWith(a+'/')){ const np=b+r.path.slice(a.length); await idbDel('files',r.path); r.path=np; await idbPut('files',r); } },
    async exists(rel){ return !!(await idbGet('files',norm(rel))); }
  });
}

/* ---------------- 后端 C：本地文件夹（File System Access API） ---------------- */
function makeLocalFS(handle){
  return compat({
    kind:'local', handle,
    async _dir(rel,create){
      let h=handle; for(const s of rel.split('/').filter(Boolean)) h=await h.getDirectoryHandle(s,{create:!!create}); return h;
    },
    async _parent(rel,create){ const i=rel.lastIndexOf('/'); const d=i<=0?'':rel.slice(0,i); return {dir:await this._dir(d,create),name:rel.slice(i+1)}; },
    async stat(rel){
      rel=norm(rel); if(rel==='/')return {type:'dir',size:0,mtime:Date.now(),name:handle.name};
      const {dir,name}=await this._parent(rel,false);
      try{ const f=await dir.getFileHandle(name); const file=await f.getFile(); return {type:'file',size:file.size,mtime:file.lastModified,name}; }
      catch(e){ await dir.getDirectoryHandle(name); return {type:'dir',size:0,mtime:Date.now(),name}; }
    },
    async readdir(rel){ const d=await this._dir(rel,false); const out=[]; for await (const k of d.keys())out.push(k); return out; },
    async mkdir(rel,opts){ await this._dir(rel,true); },
    async readFile(rel,flag){ const {dir,name}=await this._parent(rel,false); const f=await dir.getFileHandle(name); return await (await f.getFile()).arrayBuffer(); },
    async writeFile(rel,data,opts){ const ab=await toAB(data); const {dir,name}=await this._parent(rel,true);
      const f=await dir.getFileHandle(name,{create:true}); const w=await f.createWritable(); await w.write(ab); await w.close(); },
    async unlink(rel){ const {dir,name}=await this._parent(rel,false); await dir.removeEntry(name); },
    async rmdir(rel){ if(norm(rel)==='/')return; const {dir,name}=await this._parent(rel,false); await dir.removeEntry(name,{recursive:true}); },
    async rename(a,b){ const x=await this._parent(a,false); let h; try{h=await x.dir.getFileHandle(x.name);}catch(e){h=await x.dir.getDirectoryHandle(x.name);}
      const y=await this._parent(b,true); if(h.move){try{await h.move(y.dir,y.name);return;}catch(e){}}
      const st=await this.stat(a); if(st.type==='file'){const d=await this.readFile(a);await this.writeFile(b,d);await this.unlink(a);}
      else{await this.rmdir(b).catch(()=>{});await this.mkdir(b,{});for(const n of await this.readdir(a))await this.rename(a+'/'+n,b+'/'+n);await this.rmdir(a);} },
    async exists(rel){ try{await this.stat(rel);return true;}catch(e){return false;} }
  });
}

/* ---------------- 后端 D：内存（最终降级） ---------------- */
function makeMemFS(){
  const M=new Map([['/',{kind:'dir',mtime:Date.now()}]]);
  return compat({
    kind:'mem',
    async stat(rel){ rel=norm(rel); const r=M.get(rel); if(!r)throw ERR_NOTFOUND(); return {type:r.kind==='dir'?'dir':'file',size:r.size||0,mtime:r.mtime||Date.now(),name:pathName(rel)}; },
    async readdir(rel){ rel=norm(rel); const pre=rel==='/'?'/':rel+'/'; const s=new Set();
      for(const k of M.keys())if(k!==rel&&k.startsWith(pre)){const n=k.slice(pre.length).split('/')[0];if(n)s.add(n);} return [...s]; },
    async mkdir(rel){ M.set(norm(rel),{kind:'dir',mtime:Date.now()}); let p=pathDir(norm(rel)); while(p&&p!=='/'){if(!M.has(p))M.set(p,{kind:'dir',mtime:Date.now()});p=pathDir(p);} },
    async readFile(rel){ const r=M.get(norm(rel)); if(!r||r.kind!=='file')throw ERR_NOTFOUND(); return r.data||new ArrayBuffer(0); },
    async writeFile(rel,data){ const ab=await toAB(data); const p=norm(rel); M.set(p,{kind:'file',data:ab,size:ab.byteLength,mtime:Date.now()}); let d=pathDir(p);while(d&&d!=='/'){if(!M.has(d))M.set(d,{kind:'dir',mtime:Date.now()});d=pathDir(d);} },
    async unlink(rel){ M.delete(norm(rel)); },
    async rmdir(rel){ rel=norm(rel); for(const k of [...M.keys()])if(k===rel||k.startsWith(rel+'/'))M.delete(k); },
    async rename(a,b){ a=norm(a);b=norm(b); for(const k of [...M.keys()])if(k===a||k.startsWith(a+'/')){M.set(b+k.slice(a.length),M.get(k));M.delete(k);} },
    async exists(rel){ return M.has(norm(rel)); }
  });
}

/* ==================================================================
   fs 门面：所有 App 只调用这里，绝不出现 isLocal 之类的分支
   路径：/ → OPFS主存，/mnt/idb → IndexedDB副存，/mnt/local/<名称> → 本地挂载
   ================================================================== */
const fs={
  mounts:[], ready:false, backendMain:'opfs',
  mount(prefix,backend,info){ this.mounts.push(Object.assign({prefix:norm(prefix),backend},info||{})); this.mounts.sort((a,b)=>b.prefix.length-a.prefix.length); },
  unmount(prefix){ this.mounts=this.mounts.filter(m=>m.prefix!==norm(prefix)); },
  resolve(p){ p=norm(p); for(const m of this.mounts) if(p===m.prefix||p.startsWith(m.prefix+'/')) return {b:m.backend,rel:'/'+p.slice(m.prefix.length).replace(/^\/+/,''),m}; return {b:this.mounts[this.mounts.length-1].backend,rel:p,m:null}; },
  _exact(p){ return this.mounts.find(m=>m.prefix===norm(p))||null; },
  _children(p){ p=norm(p); const s=new Set(); for(const m of this.mounts){ if(m.prefix===p)continue;
      if(m.prefix.startsWith(p==='/'?'/':p+'/')){ const rest=m.prefix.slice(p==='/'?1:p.length+1); const n=rest.split('/')[0]; if(n)s.add(n); } } return [...s]; },
  async stat(p,...a){ p=norm(p); const x=this._exact(p); if(x)return {type:'dir',size:0,mtime:Date.now(),name:pathName(p)};
    const r=this.resolve(p); const st=await r.b.stat(r.rel,...a); return st; },
  async readdir(p,...a){ p=norm(p); const r=this.resolve(p); let out=[];
    try{ out=await r.b.readdir(r.rel,...a); }catch(e){ if(e.code==='ENOENT'&&this._children(p).length===0)throw e; }
    return [...new Set([...out,...this._children(p)])]; },
  async mkdir(p,...a){ return this.resolve(p).b.mkdir(this.resolve(p).rel,...a); },
  async readFile(p,...a){ return this.resolve(p).b.readFile(this.resolve(p).rel,...a); },
  async writeFile(p,data,...a){ const r=this.resolve(p); await r.b.writeFile(r.rel,data,...a);
    const ab=await toAB(data); await Meta.set(p,{type:'file',size:ab.byteLength,mtime:Date.now(),backend:r.m?r.m.kind:'opfs'}); },
  async unlink(p,...a){ await this.resolve(p).b.unlink(this.resolve(p).rel,...a); await Meta.del(p); },
  async rmdir(p,...a){ p=norm(p); if(this._exact(p))throw new Error('挂载点不可删除，请先卸载');
    await this.resolve(p).b.rmdir(this.resolve(p).rel,...a); await Meta.delTree(p); },
  async rename(a,b,...rest){ a=norm(a);b=norm(b);
    if(this._exact(a))throw new Error('挂载点不可重命名');
    const ra=this.resolve(a), rb=this.resolve(b); const meta=this._readMeta(a);
    // 先快照子树元数据，避免移动/复制后修改日期丢失
    const kids=Meta.all().filter(x=>x.path.startsWith(a+'/')).map(x=>({...x}));
    if(ra.b===rb.b){ await ra.b.rename(ra.rel,rb.rel,...rest); }
    else { await this._copyNode(a,b); await this.remove(a); }
    await Meta.delTree(a);
    if(meta)await Meta.set(b,{type:meta.type,size:meta.size,mtime:meta.mtime,backend:this.resolve(b).m?this.resolve(b).m.kind:'opfs'});
    for(const k of kids) await Meta.set(b+k.path.slice(a.length),{type:k.type,size:k.size,mtime:k.mtime});
  },
  async exists(p,...a){ p=norm(p); if(this._exact(p))return true; const r=this.resolve(p); try{return await r.b.exists(r.rel,...a);}catch(e){return false;} },
  _readMeta(p){ return Meta.get(p); },
  async readText(p){ return abText(await this.readFile(p)); },
  async writeText(p,t){ return this.writeFile(p,enc.encode(String(t)).buffer); },
  async writeFileKeepTime(p,data,mtime){ const r=this.resolve(p); await r.b.writeFile(r.rel,data); const ab=await toAB(data); await Meta.set(p,{type:'file',size:ab.byteLength,mtime:mtime||Date.now(),backend:r.m?r.m.kind:'opfs'}); },
  async mkdirWith(p,mtime){ const r=this.resolve(p); await r.b.mkdir(r.rel,{}); await Meta.set(p,{type:'dir',size:0,mtime:mtime||Date.now(),backend:r.m?r.m.kind:'opfs'}); },
  async remove(p){ const st=await this.stat(p); if(st.type==='dir')await this.rmdir(p); else await this.unlink(p); },
  async _copyNode(src,dst){ const st=await this.stat(src);
    if(st.type==='file'){ const ab=await this.readFile(src); await this.writeFileKeepTime(dst,ab,this._readMeta(src)?.mtime||st.mtime); }
    else { await this.mkdirWith(dst,this._readMeta(src)?.mtime||st.mtime); for(const n of await this.readdir(src)) await this._copyNode(src+'/'+n,dst+'/'+n); } },
  async copy(src,dst){ const st=await this.stat(src); const m=this._readMeta(src)?.mtime||st.mtime; await this._copyNode(src,dst); await Meta.set(dst,{mtime:m}); },
  async move(src,dst){ if(src===dst)return; await this.rename(src,dst); },
  async list(p){ p=norm(p); let names=[]; try{ names=await this.readdir(p); }catch(e){ return []; }
    return await Promise.all(names.map(async n=>{
      const q=p==='/'?'/'+n:p+'/'+n; let st; try{ st=await this.stat(q); }catch(e){ st={type:'file',size:0,mtime:Date.now()}; }
      const m=Meta.get(q); const mount=this._exact(q);
      return {name:n,path:q,type:st.type,size:st.size,mtime:(m&&m.mtime)||st.mtime,
        backend:mount?mount.kind:(this.resolve(q).m?this.resolve(q).m.kind:'opfs'),isMount:!!mount};
    })); },
  async getDirSize(p){ let total=0; let names; try{ names=await this.readdir(p); }catch(e){ return 0; }
    for(const n of names){ const q=p==='/'?'/'+n:p+'/'+n; try{ const st=await this.stat(q);
      if(st.type==='dir')total+=await this.getDirSize(q); else total+=st.size; }catch(e){} } return total; },
  async tree(p,depth,max){ p=p||'/';depth=depth||0;max=max||3; let out=[]; let ns=[];try{ns=await this.readdir(p);}catch(e){return out;}
    for(const n of ns){ const q=p==='/'?'/'+n:p+'/'+n; let st;try{st=await this.stat(q);}catch(e){continue;}
      out.push({name:n,path:q,type:st.type}); if(st.type==='dir'&&depth<max)out=out.concat(await this.tree(q,depth+1,max)); } return out; },
  async init(){
    await Meta.init();
    let main=null;
    if(navigator.storage&&navigator.storage.getDirectory){
      try{ const root=await navigator.storage.getDirectory(); const vfs=await root.getDirectoryHandle('celadon_vfs',{create:true}); main=makeOPFS(vfs); this.backendMain='opfs'; }catch(e){}
    }
    if(!main){ main=IDB_OK?makeIDBFS():makeMemFS(); this.backendMain=IDB_OK?'idb':'mem'; }
    this.mount('/',main,{kind:this.backendMain,name:'OPFS 主存',label:'此电脑 · 主存'});
    const second=IDB_OK?makeIDBFS():makeMemFS();
    this.mount('/mnt/idb',second,{kind:IDB_OK?'idb':'mem',name:'IndexedDB 副存',label:'IndexedDB 副存'});
    // 预建系统目录
    for(const d of ['/桌面','/文档','/图片','/音乐','/视频','/下载','/mnt','/mnt/local','/mnt/idb/桌面']){
      try{ if(!(await this.exists(d)))await this.mkdir(d); }catch(e){}
    }
    // 本地挂载恢复
    await this.restoreMounts();
    // 首次运行的欢迎内容
    if(!(await this.exists('/桌面/读我.txt'))){
      try{ await this.writeText('/桌面/读我.txt',
        '欢迎来到 Celadon OS · 青瓷\n\n'+
        '这是一个完全运行在浏览器里的桌面操作系统。\n'+
        '所有文件都保存在你的设备本地：OPFS / IndexedDB，刷新页面也不会丢失。\n\n'+
        '· 桌面图标与文件管理器都支持框选、拖拽、右键菜单\n'+
        '· 从真实电脑拖入文件即可导入，拖出即可下载\n'+
        '· 设置里可以挂载本地文件夹、切换双存储后端、更换壁纸与主题\n'+
        '· 双击（或单击，取决于设置）打开图片、文本、网页、音视频与压缩包\n\n'+
        '把你想收藏的东西拖进来吧。'); }catch(e){}
    }
    this.ready=true;
  },
  async restoreMounts(){
    let list=[]; if(IDB_OK){ try{ list=await idbAll('mounts'); }catch(e){} } else list=LS.get('mounts',[]);
    for(const m of list){ if(!m.handle)continue;
      const b=makeLocalFS(m.handle); this.mount('/mnt/local/'+m.name,b,{kind:'local',name:m.name,id:m.id,handle:m.handle,pending:true}); }
    return list.length;
  },
  async saveMounts(){ const list=this.mounts.filter(m=>m.kind==='local').map(m=>({id:m.id,name:m.name,handle:m.handle}));
    if(IDB_OK){ try{ await idbClear('mounts'); for(const m of list)await idbPut('mounts',m); }catch(e){} } else LS.set('mounts',list); },
  async addLocalMount(handle){
    const name=handle.name||('本地'+uid().slice(0,4));
    let id=uid(); const prefix='/mnt/local/'+name;
    if(this._exact(prefix)){ toast('同名挂载点已存在','err'); return null; }
    const b=makeLocalFS(handle); this.mount(prefix,b,{kind:'local',name,id,handle});
    await this.saveMounts(); return prefix;
  },
  async dropLocalMount(prefix){ this.unmount(prefix); await Meta.delTree(prefix); await this.saveMounts(); }
};

/* ==================================================================
   [3] 窗口管理器 WM
   拖拽 / 八向缩放 / 最小化 / 最大化 / 关闭 / 置顶 / Aero Snap / Peek

const WM={
  wins:[], z:1, focused:null, peekOn:false,
  open(o){
    const id=uid();
    const icon=o.icon||'file';
    const w=el('div','win');
    w.dataset.id=id; w.dataset.app=o.app||'';
    const title=el('div','win-title');
    title.innerHTML='<span class="wt-ico">'+ICON(icon)+'</span><span class="wt-name">'+esc(o.title||'应用')+'</span>'+
      '<div class="wt-btns">'+
      '<button class="wt-btn" data-a="min" title="最小化">'+ICON('min')+'</button>'+
      '<button class="wt-btn" data-a="max" title="最大化">'+ICON('max')+'</button>'+
      '<button class="wt-btn close" data-a="close" title="关闭">'+ICON('close')+'</button></div>';
    const body=el('div','win-body');
    w.append(title,body);
    ['n','s','w','e','nw','ne','sw','se'].forEach(d=>{ const r=el('div','rz rz-'+d); r.dataset.dir=d; w.appendChild(r); });
    $('#windows').appendChild(w);
    const vw=window.innerWidth, vh=window.innerHeight, tbH=isMobile()?68:52;
    const dw=o.w||Math.min(880,vw-80), dh=o.h||Math.min(600,vh-100);
    const off=(this.wins.length%7)*26;
    const win={ id,app:o.app||'',el:w,body,title:o.title||'应用',icon,
      x:o.x!=null?o.x:clamp(Math.round((vw-dw)/2)+off-60,6,vw-120),
      y:o.y!=null?o.y:clamp(Math.round((vh-dh-tbH)/2)+off-50,6,vh-160),
      w:dw,h:dh,minW:o.minW||280,minH:o.minH||180,min:false,max:false,prev:null,
      onClose:o.onClose,onResize:o.onResize,onFocus:o.onFocus,resizable:o.resizable!==false,
      params:o.params||{}, data:{} };
    this.wins.push(win);
    this.applyGeom(win);
    title.addEventListener('pointerdown',e=>this.startDrag(e,win));
    title.addEventListener('dblclick',e=>{ if(e.target.closest('.wt-btn'))return; this.toggleMax(win); });
    $$('.wt-btn',title).forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
      const a=b.dataset.a; if(a==='min')this.minimize(win); else if(a==='max')this.toggleMax(win); else this.close(win); }));
    $$('.rz',w).forEach(r=>r.addEventListener('pointerdown',e=>this.startResize(e,win,r.dataset.dir)));
    w.addEventListener('pointerdown',()=>this.focus(win),true);
    if(!win.resizable)$$('.rz',w).forEach(r=>r.style.display='none');
    this.focus(win); HOOK.refreshTaskbar();
    // 内容挂载
    if(o.mount)try{ o.mount(win); }catch(e){ console.error(e); body.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
    return win;
  },
  applyGeom(win){
    if(isMobile()){ win.el.style.left='';win.el.style.top='';win.el.style.width='';win.el.style.height=''; return; }
    win.el.style.left=win.x+'px'; win.el.style.top=win.y+'px';
    win.el.style.width=win.w+'px'; win.el.style.height=win.h+'px';
  },
  focus(win){ if(this.focused===win&&!win.min)return;
    this.wins.forEach(w=>w.el.classList.remove('focused'));
    win.el.classList.add('focused'); win.min=false; win.el.classList.remove('minimized');
    win.el.style.zIndex=++this.z; this.focused=win;
    if(win.onFocus)try{win.onFocus();}catch(e){}
    HOOK.refreshTaskbar();
  },
  minimize(win){ win.min=true; win.el.classList.add('minimized'); win.el.classList.remove('focused');
    if(this.focused===win)this.focused=null;
    const next=this.wins.filter(w=>!w.min).sort((a,b)=>+b.el.style.zIndex-+a.el.style.zIndex)[0];
    if(next)this.focus(next); else HOOK.refreshTaskbar(); },
  restore(win){ win.min=false; win.el.classList.remove('minimized'); this.focus(win); },
  toggleMax(win){
    if(isMobile())return;
    if(win.max){ const p=win.prev||{x:60,y:60,w:800,h:520}; Object.assign(win,p); win.max=false; win.el.classList.remove('maximized'); }
    else { win.prev={x:win.x,y:win.y,w:win.w,h:win.h}; win.max=true; win.el.classList.add('maximized');
      win.x=0;win.y=0;win.w=window.innerWidth;win.h=window.innerHeight-(CFG.taskbar?52:0); }
    this.applyGeom(win); this.focus(win); if(win.onResize)win.onResize(); HOOK.refreshTaskbar();
  },
  close(win){
    if(win.onClose){ try{ const r=win.onClose(); if(r===false)return; }catch(e){} }
    win.el.style.transition='opacity .16s,transform .16s'; win.el.style.opacity='0'; win.el.style.transform='scale(.96)';
    setTimeout(()=>win.el.remove(),170);
    this.wins=this.wins.filter(w=>w!==win); if(this.focused===win)this.focused=null;
    const next=this.wins.filter(w=>!w.min).sort((a,b)=>+b.el.style.zIndex-+a.el.style.zIndex)[0];
    if(next)this.focus(next); HOOK.refreshTaskbar();
  },
  snapTo(win,kind){
    if(win.max)return; const vw=window.innerWidth,vh=window.innerHeight-(CFG.taskbar?52:0);
    win.prev={x:win.x,y:win.y,w:win.w,h:win.h};
    if(kind==='max'){ this.toggleMax(win); return; }
    if(kind==='left'){win.x=0;win.y=0;win.w=Math.round(vw/2);win.h=vh;}
    if(kind==='right'){win.x=Math.round(vw/2);win.y=0;win.w=Math.round(vw/2);win.h=vh;}
    this.applyGeom(win); this.focus(win); if(win.onResize)win.onResize();
  },
  startDrag(e,win){
    if(e.target.closest('.wt-btn')||e.button===2)return;
    if(win.max)return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,ox=win.x,oy=win.y; const tb=52;
    const titleEl=win.el.querySelector('.win-title');
    titleEl.setPointerCapture(e.pointerId);
    const snap=$('#snap-preview');
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      win.x=clamp(ox+dx,-win.w+90,window.innerWidth-90); win.y=clamp(oy+dy,0,window.innerHeight-tb-30);
      win.el.style.transition='none'; this.applyGeom(win);
      if(CFG.snap&&!isMobile()){
        let k=null;
        if(ev.clientY<=6)k='max'; else if(ev.clientX<=6)k='left'; else if(ev.clientX>=window.innerWidth-6)k='right';
        if(k){ snap.style.display='block';
          if(k==='max'){snap.style.left='0';snap.style.top='0';snap.style.width='100%';snap.style.height=(window.innerHeight-52)+'px';snap.style.borderRadius='0';}
          else{ const half=Math.round(window.innerWidth/2); snap.style.left=(k==='left'?0:half)+'px';snap.style.top='0';snap.style.width=half+'px';snap.style.height=(window.innerHeight-52)+'px';snap.style.borderRadius='0';}
          this._snapKind=k;
        } else { snap.style.display='none'; this._snapKind=null; }
      }
    };
    const up=()=>{ titleEl.removeEventListener('pointermove',move); titleEl.removeEventListener('pointerup',up); titleEl.removeEventListener('pointercancel',up);
      win.el.style.transition=''; snap.style.display='none';
      if(this._snapKind&&CFG.snap&&!isMobile()){ this.snapTo(win,this._snapKind); this._snapKind=null; }
      try{titleEl.releasePointerCapture(e.pointerId);}catch(err){}
    };
    titleEl.addEventListener('pointermove',move); titleEl.addEventListener('pointerup',up); titleEl.addEventListener('pointercancel',up);
    this.focus(win);
  },
  startResize(e,win,dir){
    if(win.max||!win.resizable)return; e.preventDefault(); e.stopPropagation();
    const sx=e.clientX,sy=e.clientY,ox=win.x,oy=win.y,ow=win.w,oh=win.h;
    const rz=win.el.querySelector('.rz-'+dir); rz.setPointerCapture(e.pointerId);
    const move=ev=>{ const dx=ev.clientX-sx,dy=ev.clientY-sy; let x=ox,y=oy,w=ow,h=oh;
      if(dir.includes('e'))w=clamp(ow+dx,win.minW,window.innerWidth-ox);
      if(dir.includes('s'))h=clamp(oh+dy,win.minH,window.innerHeight-oy-52);
      if(dir.includes('w')){ w=clamp(ow-dx,win.minW,ox+ow); x=ox+(ow-w); }
      if(dir.includes('n')){ h=clamp(oh-dy,win.minH,oy+oh); y=oy+(oh-h); }
      Object.assign(win,{x,y,w,h}); win.el.style.transition='none'; this.applyGeom(win);
    };
    const up=()=>{ rz.removeEventListener('pointermove',move);rz.removeEventListener('pointerup',up);rz.removeEventListener('pointercancel',up);
      win.el.style.transition=''; if(win.onResize)try{win.onResize();}catch(err){} try{rz.releasePointerCapture(e.pointerId);}catch(err){} };

let ctxHide=null;
function showCtx(x,y,items){
  const m=$('#ctxmenu'); m.innerHTML=''; m.hidden=false;
  const build=(arr)=>{ let real=0; arr.forEach(it=>{
    if(it.sep){ m.appendChild(el('div','ctx-sep')); return; }
    if(it.label&&!it.fn){ m.appendChild(el('div','ctx-label',esc(it.label))); return; }
    real++;
    const b=el('button','ctx-item'+(it.danger?' danger':''),
      ICON(it.icon||'file')+'<span>'+esc(it.label)+'</span>'+(it.key?'<span class="ctx-key">'+esc(it.key)+'</span>':''));
    b.addEventListener('click',async()=>{ hideCtx(); try{ await it.fn(); }catch(e){ toast(e.message,'err'); } });
    m.appendChild(b);
  }); return real; };
  if(!build(items))m.appendChild(el('div','ctx-item','<span>无可用操作</span>'));
  const r=m.getBoundingClientRect();
  m.style.left=clamp(x,6,window.innerWidth-r.width-6)+'px';
  m.style.top=clamp(y,6,window.innerHeight-r.height-6)+'px';
  clearTimeout(ctxHide); ctxHide=null;
}
function hideCtx(){ const m=$('#ctxmenu'); if(m.hidden)return; m.hidden=true; }

function dialog(o){
  return new Promise(res=>{
    const mask=el('div','modal-mask');
    const box=el('div','modal');
    box.innerHTML='<h3>'+esc(o.title||'')+'</h3><p>'+esc(o.text||'')+'</p>'+(o.body||'');
    const row=el('div','row');
    (o.buttons||[{label:'取消',value:null},{label:'确定',value:true,primary:true}]).forEach(b=>{
      const btn=el('button','btn'+(b.primary?' primary':'')+(b.danger?' danger':''),esc(b.label));
      btn.onclick=()=>{ const v=b.getValue?b.getValue(box):b.value; mask.remove(); res(v); }; row.appendChild(btn);
    });
    box.appendChild(row); mask.appendChild(box); document.body.appendChild(mask);
    mask.addEventListener('pointerdown',e=>{ if(e.target===mask&&o.dismiss!==false){mask.remove();res(null);} });
    const f=$('.inp',box); if(f)setTimeout(()=>{f.focus();if(f.select)f.select();},40);
    box.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.target.matches('textarea')){ const p=$('.btn.primary',row)||$('.btn',row); if(p)p.click(); } });
  });
}

/* ==================================================================
   [7] 通用框选引擎 —— 严格 Web / 移动端自适应标准
   getClientXY 抹平触点 · pointer-events:none · scrollLeft/Top 累加 ·
   document 上 handleMove/End · touchmove passive:false · 40px 边缘自动滚动 · AABB
   ================================================================== */
function makeMarquee(o){
  const c=o.container, box=o.marquee, itemSel=o.itemSelector;
  let active=false, sx=0, sy=0, cx=0, cy=0, additive=false, raf=0, scrollVX=0, scrollVY=0, lastEv=null, destroyed=false;
  const rect=()=>c.getBoundingClientRect();
  const toLocal=(x,y)=>{ const r=rect(); return {x:x-r.left+c.scrollLeft, y:y-r.top+c.scrollTop}; };
  const items=()=>$$(itemSel,c).filter(n=>n.offsetParent!==null);
  function hit(){
    const x0=Math.min(sx,cx),y0=Math.min(sy,cy),x1=Math.max(sx,cx),y1=Math.max(sy,cy);
    const sel=[];
    for(const n of items()){
      const l=n.offsetLeft,t=n.offsetTop,r=n.offsetLeft+n.offsetWidth,b=n.offsetTop+n.offsetHeight;
      if(l<x1&&r>x0&&t<y1&&b>y0)sel.push(n);
    }
    if(o.onSelect)o.onSelect(sel,additive);
  }
  function draw(){
    const x0=Math.min(sx,cx),y0=Math.min(sy,cy),x1=Math.max(sx,cx),y1=Math.max(sy,cy);
    box.style.display='block'; box.style.left=x0+'px'; box.style.top=y0+'px';
    box.style.width=(x1-x0)+'px'; box.style.height=(y1-y0)+'px';
    hit();
  }
  function autoScroll(){
    if(!active||destroyed)return;
    if(scrollVX||scrollVY){ c.scrollLeft+=scrollVX; c.scrollTop+=scrollVY;
      if(lastEv){ const p=getClientXY(lastEv); const q=toLocal(p.x,p.y); cx=q.x;cy=q.y; draw(); } }
    raf=requestAnimationFrame(autoScroll);
  }
  function start(e){
    if(destroyed||e.button===2)return;
    if(!o.ignoreItemCheck&&e.target.closest(itemSel))return;   // 仅在空白处启动（框选模式可忽略）
    if(o.guard&&!o.guard(e))return;
    const p=getClientXY(e); const q=toLocal(p.x,p.y);
    active=true; sx=cx=q.x; sy=cy=q.y; additive=!!(e.shiftKey||e.ctrlKey||e.metaKey);
    if(o.onStart)o.onStart(additive);
    box.style.display='none';
    document.addEventListener('mousemove',move,{passive:false});
    document.addEventListener('mouseup',end);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('touchend',end);
    document.addEventListener('touchcancel',end);
    cancelAnimationFrame(raf); raf=requestAnimationFrame(autoScroll);
    if(o.lockScroll&&e.type==='touchstart')e.preventDefault();
  }
  function move(e){
    if(!active)return;
    if(e.type==='touchmove'&&e.cancelable)e.preventDefault();  // 锁死原生滚动
    lastEv=e; const p=getClientXY(e); const q=toLocal(p.x,p.y); cx=q.x;cy=q.y;
    const r=rect(),EDGE=40;

function uniqueName(name,list){
  const used=new Set(list.map(x=>x.name)); if(!used.has(name))return name;
  const i=name.lastIndexOf('.'), base=i>0?name.slice(0,i):name, e=i>0?name.slice(i):'';
  let k=2; while(used.has(base+' ('+k+')'+e))k++; return base+' ('+k+')'+e;
