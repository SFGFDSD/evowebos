/* ==================================================================
   [10] 双向拖拽 DRAG —— 统一走 HTML5 原生 Drag & Drop
   dragstart 严禁 async：数据由 mousedown/mouseenter 异步预加载进缓存，同步读取
   拖出浏览器：items.add(file) + setData('DownloadURL','mime:filename:url')
   Blob URL 在 dragend 后延迟 >=5s 才 revoke
   ================================================================== */
const DRAG={
  cache:new Map(), _revoke:new Set(),
  async preload(it){
    if(!it||it.type==='sys'||it.type==='dir'||!it.path)return;
    if(this.cache.has(it.key))return;
    try{
      const ab=await fs.readFile(it.path); const mime=mimeOf(it.name);
      const url=blobURL(ab,mime);
      this.cache.set(it.key,{ab,mime,name:it.name,url,file:new File([ab],it.name,{type:mime})});
    }catch(e){}
  },
  invalidate(path){ for(const [k,v] of this.cache) if(k==='file:'+path){ setTimeout(()=>URL.revokeObjectURL(v.url),5000); this.cache.delete(k); } },
  start(e,it,desk){
    // —— 同步区开始，禁止 await ——
    const sels=desk.selected.has(it.key)?desk.selectedEntries():[it];
    const payload={from:'desktop',items:sels.map(s=>({key:s.key,path:s.path,name:s.name,type:s.type,sys:s.type==='sys'}))};
    try{ e.dataTransfer.setData('text/x-celadon',JSON.stringify(payload)); }catch(err){}
    try{ e.dataTransfer.setData('text/plain',payload.items.map(i=>i.name).join(', ')); }catch(err){}
    e.dataTransfer.effectAllowed='copyMove';
    let first=true;
    for(const s of sels){
      const c=this.cache.get(s.key);
      if(!c||s.type==='sys'||s.type==='dir')continue;
      try{ e.dataTransfer.items.add(c.file); }catch(err){}
      if(first){ try{ e.dataTransfer.setData('DownloadURL',c.mime+':'+c.name+':'+c.url); }catch(err){} first=false; }
    }
    // —— 同步区结束 ——
    const nodes=sels.map(s=>$('.dicon[data-key="'+CSS.escape(s.key)+'"]')).filter(Boolean);
    nodes.forEach(n=>n.classList.add('dragging'));
    this._nodes=nodes;
  },
  end(e){
    if(this._nodes){ this._nodes.forEach(n=>n.classList.remove('dragging')); this._nodes=null; }
    // DownloadURL 使用的 Blob URL 延迟至少 5 秒释放
    const urls=[...this.cache.values()].map(v=>v.url);
    setTimeout(()=>{ urls.forEach(u=>{ if(u&&!this._revoke.has(u)){ try{URL.revokeObjectURL(u);}catch(err){} this._revoke.add(u); } }); },6000);
  }
};

   [11] 导入 / 导出 / 压缩（含 JSZip 时区修复）

const IMPORT={
  async files(fileList,dest){
    let n=0;
    for(const f of fileList){ try{ const ab=await f.arrayBuffer(); await fs.writeFile(pathJoin(dest,f.name),ab); n++; }
      catch(e){ toast('导入失败 '+f.name,'err'); } }
    if(n){ HOOK.refreshAll(); toast('已导入 '+n+' 个文件'); }
    return n;
  },
  async folderFiles(fileList,dest){
    let n=0;
    for(const f of fileList){ const rel=f.webkitRelativePath||f.name; const parts=rel.split('/');
      let d=dest; for(let i=0;i<parts.length-1;i++){ d=pathJoin(d,parts[i]); if(!(await fs.exists(d)))await fs.mkdir(d); }
      try{ await fs.writeFile(pathJoin(d,parts[parts.length-1]),await f.arrayBuffer()); n++; }catch(e){} }
    if(n){ HOOK.refreshAll(); toast('已导入文件夹（'+n+' 个文件）'); }
  },
  async fromDataTransfer(dt,dest){
    const entries=[];
    if(dt.items)for(const it of dt.items){ const en=it.webkitGetAsEntry?it.webkitGetAsEntry():null; if(en)entries.push(en); }
    if(entries.length){ let n=0; for(const en of entries)n+=await this.entry(en,dest);
      if(n){HOOK.refreshAll();toast('已导入 '+n+' 项');} return n; }
    return this.files(dt.files,dest);
  },
  async entry(en,dest){
    let n=0;
    if(en.isFile){
      const f=await new Promise(res=>en.file(res,()=>res(null)));
      if(f){ try{ await fs.writeFile(pathJoin(dest,f.name),await f.arrayBuffer()); n=1; }catch(e){} }
    } else if(en.isDirectory){
      const dir=pathJoin(dest,en.name); if(!(await fs.exists(dir)))await fs.mkdir(dir);
      const reader=en.createReader(); let batch;
      // readEntries 每次最多返回 100 条，必须循环直到空数组
      do{ batch=await new Promise(res=>{ try{ reader.readEntries(res,()=>res([])); }catch(e){ res([]); } });
        for(const c of batch) n+=await this.entry(c,dir);
      }while(batch.length>0);
    }
    return n;
  }
};

const EXPORT={
  async path(p){
    try{ const st=await fs.stat(p);

      const ab=await fs.readFile(p); download(ab,pathName(p),mimeOf(pathName(p))); toast('已开始下载');
    }catch(e){ toast('导出失败：'+e.message,'err'); }
  },
  async dirZip(p){
    const JSZip=await CDN.zip(); if(!JSZip){ toast('压缩组件不可用，无法导出文件夹','err'); return; }
    const zip=new JSZip(); const meta={};
    const walk=async(dir,rel)=>{ for(const f of await fs.list(dir)){
      if(f.type==='dir'){ const r=rel+'/'+f.name; zip.folder(r); await walk(f.path,r); }
      else { const ab=await fs.readFile(f.path); const mtime=(Meta.get(f.path)||{}).mtime||f.mtime;
        // JSZip 写入 DOS 时间使用本地小时、读取时按 UTC 解析，存在时区偏差；
        // 这里显式保存真实修改时间到元数据文件，解压时优先据此恢复，保证不失真。
        meta[rel+'/'+f.name]=mtime;
        zip.file(rel+'/'+f.name,ab,{date:new Date(mtime),binary:true}); }
    }};
    await walk(p,pathName(p));
    zip.file('__celadon_meta__.json',JSON.stringify({__vfs_meta__:meta}));
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:5}});
    download(await blob.arrayBuffer(),pathName(p)+'.zip','application/zip');
    toast('文件夹已打包下载');
  }

/* 桌面 dragover / drop：内部移动 + 外部导入 */
$('#desktop').addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
$('#desktop').addEventListener('drop',async e=>{
  e.preventDefault(); hideCtx();
  const raw=e.dataTransfer.getData(INTERNAL_MIME);
  if(raw){
    let data;try{data=JSON.parse(raw);}catch(err){return;}
    const targetIcon=e.target.closest('.dicon');
    const target=targetIcon?DESK.entries.find(x=>x.key===targetIcon.dataset.key):null;
    const files=data.items.filter(i=>i.path);
    if(target&&target.type==='dir'&&files.length){
      for(const f of files){ try{ const dst=pathJoin(target.path,pathName(f.path)); await fs.move(f.path,dst); }catch(err){toast('移动失败','err');} }
      HOOK.refreshAll(); toast('已移动到 '+target.name); return;
    }
    if(target&&target.type==='sys'&&files.length){
      const dest=target.app==='explorer'?'/桌面':'/桌面';
      for(const f of files){ try{ await fs.move(f.path,pathJoin(dest,pathName(f.path))); }catch(err){} }
      HOOK.refreshAll(); return;
    }
    // 释放在桌面空白 → 更新图标坐标（内部位置移动）
    const r=$('#desktop').getBoundingClientRect();
    const bx=e.clientX-r.left-44, by=e.clientY-r.top-22;
    const lead=data.items[0];
    const dx=bx-(parseFloat($('.dicon[data-key="'+CSS.escape(lead.key)+'"]')?.style.left)||0);
    const dy=by-(parseFloat($('.dicon[data-key="'+CSS.escape(lead.key)+'"]')?.style.top)||0);
    data.items.forEach(i=>{ const n=$('.dicon[data-key="'+CSS.escape(i.key)+'"]'); if(!n)return;
      const x=clamp(Math.round((parseFloat(n.style.left)+dx)/4)*4,0,window.innerWidth-90);
      const y=clamp(Math.round((parseFloat(n.style.top)+dy)/4)*4,0,window.innerHeight-100);
      n.style.left=x+'px';n.style.top=y+'px'; DESK.pos[i.key]={free:true,x,y}; });
    DESK.savePos(); return;
  }
  await IMPORT.fromDataTransfer(e.dataTransfer,defaultDest());
});

    if(st.search&&st.search.global&&st.search.q){
      const q=st.search.q.toLowerCase(); const all=await fs.tree('/',0,5); const out=[];
      for(const n of all) if(n.name.toLowerCase().includes(q)){
        const m=Meta.get(n.path)||{}; let size=0; try{size=(await fs.stat(n.path)).size;}catch(e){}
        out.push({name:n.name,path:n.path,type:n.type,size,mtime:m.mtime||Date.now(),backend:'opfs'}); }
      return out;
    }
    let list=await fs.list(st.cwd);
    if(st.search&&st.search.q){ const q=st.search.q.toLowerCase(); list=list.filter(f=>f.name.toLowerCase().includes(q)); }

  sortList(win,list){

      let r=0;
      if(key==='name')r=natural(a.name,b.name);
      else if(key==='date')r=(a.mtime||0)-(b.mtime||0);
      else if(key==='type')r=typeOf(a.name,a.type).localeCompare(typeOf(b.name,b.type),'zh');
      else r=(a.size||0)-(b.size||0);
      return r*k;

      const k=c.dataset.k; if(st.sort.key===k)st.sort.asc=!st.sort.asc; else st.sort={key:k,asc:true}; this.render(win); });
    this.bindColResize(win,head);

      row.innerHTML='<div class="fe-cell name" style="width:'+cols.name+'px">'+fileIcon(f.name,f.type,18)+'<span>'+esc(f.name)+'</span></div>'+
        '<div class="fe-cell mono" style="width:'+cols.date+'px">'+fmtDate(f.mtime)+'</div>'+
        '<div class="fe-cell" style="width:'+cols.type+'px">'+esc(typeOf(f.name,f.type))+'</div>'+
        '<div class="fe-cell mono" style="width:'+cols.size+'px" data-size="'+(f.type==='dir'?'dir':'file')+'">'+(f.type==='dir'?'<span style="color:var(--text-3)">计算中…</span>':fmtSize(f.size))+'</div>';

    const st=win.data.st;
    $$('.fe-colgrip',head).forEach(g=>{

  applyCols(win){
    const st=win.data.st,v=win.data.view,cols=st.cols;
    $$('.fe-hcell',v).forEach(c=>c.style.width=cols[c.dataset.k]+'px');
    $$('.fe-row',v).forEach(r=>{ const cs=r.children;
      ['name','date','type','size'].forEach((k,i)=>{if(cs[i])cs[i].style.width=cols[k]+'px';}); });
  },
  async fillSizes(win){
    const st=win.data.st,v=win.data.view;
    const dirs=$$('.fe-row [data-size="dir"]',v);
    for(const cell of dirs){
      const p=cell.parentElement.dataset.path; if(!p)continue;
      if(st.sizeCache.has(p)){cell.textContent=fmtSize(st.sizeCache.get(p));continue;}
      let s=0;try{s=await fs.getDirSize(p);}catch(e){}
      st.sizeCache.set(p,s); if(cell.isConnected)cell.textContent=fmtSize(s);
      await sleep(0);
    }
  },
  renderIcons(win){
    const st=win.data.st,v=win.data.view;
    const grid=el('div','fe-icons');
    for(const f of st.list){
      const d=el('div','fe-ico'+(st.selected.has(f.path)?' sel':'')); d.dataset.path=f.path;d.draggable=true;
      d.innerHTML='<div class="art">'+fileIcon(f.name,f.type,46)+'</div><div class="nm">'+esc(f.name)+'</div>'+
        '<div class="chip" style="font-size:9px">'+esc(typeOf(f.name,f.type))+'</div>';
      grid.appendChild(d);
    }
    v.appendChild(grid);
  },
  async loadThumbs(win){
    const st=win.data.st,v=win.data.view;
    const nodes=$$('.fe-ico',v);
    for(const n of nodes){
      const p=n.dataset.path,f=st.list.find(x=>x.path===p); if(!f||f.type==='dir'||!IMG_EXT.includes(ext(f.name)))continue;
      if(st.thumbs.has(p)){ this.setThumb(n,st.thumbs.get(p)); continue; }
      try{ const ab=await fs.readFile(p); const u=blobURL(ab,mimeOf(f.name)); st.thumbs.set(p,u); if(n.isConnected)this.setThumb(n,u); }catch(e){}
    }
  },
  setThumb(n,u){ const art=$('.art',n); if(art)art.innerHTML='<img src="'+u+'" loading="lazy" alt="">'; },
  renderColumns(win){
    const st=win.data.st,v=win.data.view; v.style.overflow='hidden';
    const wrap=el('div','fe-cols');
    const left=el('div','fe-col-tree');
    const right=el('div','fe-col-detail');
    const dirs=st.list.filter(f=>f.type==='dir');
    left.innerHTML='<div style="font-size:10px;letter-spacing:.16em;color:var(--text-3);padding:6px 8px">子文件夹 ('+dirs.length+')</div>'+
      (dirs.length?dirs.map(d=>'<button class="fe-nav" data-p="'+esc(d.path)+'">'+ICON('folder')+'<span>'+esc(d.name)+'</span></button>').join(''):'<div class="empty" style="height:80px">无子文件夹</div>');
    right.innerHTML=st.list.map(f=>'<div class="fe-detail-card" data-p="'+esc(f.path)+'"><div class="art">'+fileIcon(f.name,f.type,64)+'</div>'+
      '<div><h4>'+esc(f.name)+'</h4><dl><dt>类型</dt><dd>'+esc(typeOf(f.name,f.type))+'</dd>'+
      '<dt>修改日期</dt><dd>'+fmtDate(f.mtime)+'</dd>'+
      '<dt>大小</dt><dd>'+(f.type==='dir'?'文件夹':fmtSize(f.size))+'</dd>'+
      '<dt>路径</dt><dd style="word-break:break-all">'+esc(f.path)+'</dd></dl></div></div>').join('');
    wrap.append(left,right); v.appendChild(wrap);
    $$('[data-p]',left).forEach(b=>b.onclick=()=>this.go(win,b.dataset.p,true));
    $$('.fe-detail-card',right).forEach(c=>{ c.onclick=()=>this.openItem(win,st.list.find(f=>f.path===c.dataset.p)); });
  },
  bindMarquee(win,list){
    const st=win.data.st,v=win.data.view,mq=$('#fe-mq',win.body);
    st.marquee=makeMarquee({container:v,marquee:mq,itemSelector:st.view==='icons'?'.fe-ico':'.fe-row',
      ignoreItemCheck:st.marqueeMode,
      onStart:add=>{ if(!add)this.select(win,[],false); },
      onEnd:()=>{ st.justMarqueed=true; setTimeout(()=>{st.justMarqueed=false;},0); },
      onSelect:(nodes,add)=>{ const ps=nodes.map(n=>n.dataset.path).filter(Boolean); this.select(win,ps,add); }});
  },
  select(win,paths,additive){
    const st=win.data.st,v=win.data.view;
    if(!additive)st.selected.clear(); paths.forEach(p=>st.selected.add(p));
    $$('.fe-row,.fe-ico',v).forEach(n=>n.classList.toggle('sel',st.selected.has(n.dataset.path)));
    this.status(win);
  },
  status(win){
    const st=win.data.st; const total=st.list.reduce((s,f)=>s+(f.size||0),0);
    $('#fe-status',win.body).innerHTML='<span>'+st.list.length+' 项</span><span>选中 '+st.selected.size+' 项</span>'+
      '<span>'+fmtSize(total)+'</span><span>'+(st.search&&st.search.global?'全局搜索':'')+'</span>'+
      '<span style="margin-left:auto">'+esc(st.cwd)+'</span>';
  },
  bindItems(win){
    const st=win.data.st,v=win.data.view;
    const clickMode=CFG.clickExplorer;
    $$('.fe-row,.fe-ico',v).forEach(n=>{
      const f=st.list.find(x=>x.path===n.dataset.path); if(!f)return;
      n.addEventListener('click',e=>{ e.stopPropagation(); this.select(win,[f.path],e.ctrlKey||e.metaKey||e.shiftKey);
        if(clickMode==='single'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey)this.openItem(win,f); });
      n.addEventListener('dblclick',e=>{ e.stopPropagation(); if(clickMode==='double')this.openItem(win,f); });
      n.addEventListener('contextmenu',e=>{ e.preventDefault();e.stopPropagation();
        if(!st.selected.has(f.path))this.select(win,[f.path],false); this.context(win,e.clientX,e.clientY,f); });
      n.addEventListener('mouseenter',()=>DRAG.preload({key:'ex:'+f.path,path:f.path,name:f.name,type:f.type}));
      n.addEventListener('dragstart',e=>this.dragStart(e,win,f));
      n.addEventListener('dragend',e=>DRAG.end(e));
      n.addEventListener('touchstart',e=>this.touchDrag(e,win,n,f),{passive:false});
    });
    v.addEventListener('click',e=>{ if(e.target===v&&!win.data.st.justMarqueed)this.select(win,[],false); });
  },
  async openItem(win,f){
    // 智能分派：打开前统一 stat 检查类型，虚拟/本地路径一视同仁
    let st;try{st=await fs.stat(f.path);}catch(e){toast('文件不存在','err');return;}
    if(st.type==='dir'){ await this.go(win,f.path,true); return; }
    await OPEN.path(f.path);
  },
  dragStart(e,win,f){
    const st=win.data.st;
    const paths=st.selected.has(f.path)?[...st.selected]:[f.path];
    const items=paths.map(p=>({path:p,name:pathName(p)}));
    try{ e.dataTransfer.setData(INTERNAL_MIME,JSON.stringify({from:'explorer',cwd:st.cwd,items})); }catch(err){}
    e.dataTransfer.effectAllowed='copyMove';
    const c=DRAG.cache.get('ex:'+f.path);
    if(c){ try{e.dataTransfer.items.add(c.file);}catch(err){}
      try{e.dataTransfer.setData('DownloadURL',c.mime+':'+c.name+':'+c.url);}catch(err){} }
    this._dragNodes=$$('.fe-row.sel,.fe-ico.sel',win.data.view);
  },
  bindDrop(win){
    const st=win.data.st,v=win.data.view;
    v.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
    v.addEventListener('drop',async e=>{
      e.preventDefault();
      const raw=e.dataTransfer.getData(INTERNAL_MIME);
      if(raw){ let d;try{d=JSON.parse(raw);}catch(err){return;}
        const row=e.target.closest('.fe-row,.fe-ico'); let dest=st.cwd;
        if(row){ const t=st.list.find(x=>x.path===row.dataset.path);
          if(t&&t.type==='dir')dest=t.path; }
        else if(e.target.closest('.crumb')){ dest=e.target.closest('.crumb').dataset.p||'/'; }
        for(const it of d.items){ if(!it.path||pathDir(it.path)===dest)continue;
          try{ await fs.move(it.path,pathJoin(dest,it.name)); }catch(err){toast('移动失败','err');} }
        HOOK.refreshAll(); toast('已移动到 '+(dest==='/'?'此电脑':pathName(dest))); return;
      }
      await IMPORT.fromDataTransfer(e.dataTransfer,st.cwd);
    });
  },
  touchDrag(e,win,n,f){
    if(e.touches.length!==1||win.data.st.marqueeMode)return;
    const t=e.touches[0],sx=t.clientX,sy=t.clientY; let moved=false,ghost=null;
    const move=ev=>{ const p=ev.touches[0]; if(!moved&&Math.hypot(p.clientX-sx,p.clientY-sy)<8)return;
      moved=true; if(ev.cancelable)ev.preventDefault();
      if(!ghost){ ghost=el('div','chip'); ghost.style.cssText='position:fixed;z-index:999;pointer-events:none;background:var(--accent);color:var(--accent-ink);padding:6px 10px';document.body.appendChild(ghost); }
      ghost.style.left=(p.clientX+12)+'px';ghost.style.top=(p.clientY+12)+'px';ghost.textContent=pathName(f.path); };
    const up=ev=>{ document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
      if(ghost)ghost.remove(); if(!moved)return;
      const p=ev.changedTouches[0]; const hit=document.elementFromPoint(p.clientX,p.clientY);
      const row=hit&&hit.closest('.fe-row,.fe-ico'); let dest=win.data.st.cwd;
      if(row){ const t=win.data.st.list.find(x=>x.path===row.dataset.path); if(t&&t.type==='dir')dest=t.path; }
      if(pathDir(f.path)!==dest){ fs.move(f.path,pathJoin(dest,pathName(f.path))).then(()=>{HOOK.refreshAll();toast('已移动到 '+pathName(dest));}).catch(err=>toast('移动失败','err')); }
    };
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
  },
  context(win,x,y,f){
    const st=win.data.st, sel=[...st.selected], paths=sel.length?sel:[f.path];
    const multi=paths.length>1, one=multi?null:f, e=one?ext(one.name):'';
    const items=[{label:multi?'打开 '+paths.length+' 项':'打开',icon:'launch',fn:()=>paths.forEach(p=>OPEN.path(p))}];
    if(!multi){
      items.push({label:'打开方式',icon:'eye'});
      items.push({label:'用代码编辑器打开',icon:'code',fn:()=>APP.launch('editor',{path:one.path})});
      items.push({label:'用记事本 / 纯文本打开',icon:'text',fn:async()=>APP.launch('notepad',{content:await fs.readText(one.path),path:null,title:one.name})});
      if(IMG_EXT.includes(e)){items.push({label:'图片查看器',icon:'image',fn:()=>APP.launch('viewer',{path:one.path})});
        items.push({label:'漫画阅读器（同目录）',icon:'book',fn:()=>APP.launch('manga',{path:one.path})});}
      if(e==='html'||e==='htm')items.push({label:'在网页浏览器中打开',icon:'browser',fn:()=>OPEN.browserFile(one.path)});
      items.push({sep:true});
      if(one.type==='dir')items.push({label:'在此解压 / 打包',icon:'zip',fn:()=>ARCHIVE.menu(one.path)});
      items.push({label:'下载 / 导出到本机',icon:'download',fn:()=>EXPORT.path(one.path)});
      if(ZIP_EXT.includes(e))items.push({label:'解压到当前目录',icon:'zip',fn:()=>ARCHIVE.extract(one.path,pathDir(one.path))});
      items.push({label:'属性',icon:'properties',fn:()=>PROPERTIES.show(one.path)});
    } else items.push({sep:true});
    items.push({label:'复制',icon:'copy',key:'Ctrl+C',fn:()=>{CLIP.mode='copy';CLIP.paths=paths;toast('已复制 '+paths.length+' 项');}},
      {label:'剪切',icon:'paste',key:'Ctrl+X',fn:()=>{CLIP.mode='cut';CLIP.paths=paths;toast('已剪切 '+paths.length+' 项');}},
      {label:'粘贴到此处',icon:'paste',key:'Ctrl+V',fn:()=>pasteInto(st.cwd)},
      {label:'重命名',icon:'rename',fn:()=>!multi&&renamePath(one.path)},
      {label:'删除',icon:'trash',danger:true,key:'Delete',fn:()=>deletePaths(paths)},
      {sep:true},
      {label:'在此新建文件夹',icon:'folder',fn:()=>newItem(st.cwd,'dir')},
      {label:'导入文件到此',icon:'upload',fn:()=>pickFiles(st.cwd,false)});
    showCtx(x,y,items);
  }
};

/* ==================================================================
   [15] 文件打开分派 OPEN —— 统一 stat 后按类型调用应用
   任何未知 MIME 都提供「以纯文本形式打开」兜底
   ================================================================== */
Object.assign(OPEN,{
  async path(p,opts){
    p=norm(p); let st;
    try{ st=await fs.stat(p); }catch(e){ toast('文件不存在：'+p,'err'); return; }
    if(st.type==='dir'){ APP.launch('explorer',{path:p}); return; }
    const e=ext(pathName(p)), name=pathName(p);
    if(IMG_EXT.includes(e)){
      if(CFG.imageApp==='manga')return APP.launch('manga',{path:p});
      return APP.launch('viewer',{path:p});
    }
    if(AUD_EXT.includes(e)||VID_EXT.includes(e))return APP.launch('media',{path:p});
    if(e==='pdf'){ const ab=await fs.readFile(p); return APP.launch('browser',{url:blobURL(ab,'application/pdf'),title:name}); }
    if(e==='csv'||e==='tsv')return APP.launch('table',{path:p});
    if(ZIP_EXT.includes(e))return ARCHIVE.open(p);
    if(e==='html'||e==='htm')return APP.launch('editor',{path:p});
    if(TXT_EXT.includes(e)||e==='svg')return APP.launch('notepad',{path:p});
    // 未知 MIME：通用打开选项
    const v=await dialog({title:'打开 '+esc(name),text:'无法识别该文件类型（'+esc(mimeOf(name))+'）。你可以选择以纯文本查看原始内容，或将其下载到本机。',
      buttons:[{label:'取消',value:null},{label:'下载文件',value:'download'},{label:'以纯文本打开',value:'text',primary:true}]});
    if(v==='download')return EXPORT.path(p);
    if(v==='text')return APP.launch('notepad',{path:p,forceText:true});
  },
  async browserFile(p){ try{ const ab=await fs.readFile(p); APP.launch('browser',{url:blobURL(ab,mimeOf(pathName(p))),title:pathName(p)}); }catch(e){toast(e.message,'err');} },
  async text(p){ try{ const t=await fs.readText(p); APP.launch('notepad',{content:t,path:null,title:pathName(p)}); }catch(e){toast(e.message,'err');} }
});

/* ==================================================================
   [16] 应用：记事本（撤销/重做 · 字号 · 自动保存草稿 · 写回 OPFS）
   ================================================================== */
const NP={
  async build(win,params){
    const fsPath=params.path||null;
    let text='', title=params.title||'未命名文档';
    if(fsPath){ try{ text=await fs.readText(fsPath); title=pathName(fsPath); }catch(e){ toast('读取失败','err'); } }
    else if(params.content!=null)text=params.content;
    else { const d=LS.get('notepad.draft',null); if(d&&d.text){ text=d.text; title=d.title||'恢复的草稿'; toast('已恢复上次未保存的草稿'); } }
    const size=LS.get('notepad.font',13);
    win.body.innerHTML='<div class="toolbar" id="np-tb"></div><div class="np-wrap"><textarea class="np-area" id="np-ta" spellcheck="false" placeholder="开始输入…"></textarea></div>'+
      '<div class="statusbar" id="np-st"></div>';
    const ta=$('#np-ta',win.body); ta.value=text; ta.style.fontSize=size+'px';
    const st={path:fsPath,title,font:size,hist:[{text,sel:0}],hi:0,auto:true,saved:true,dirty:false};
    win.data.st=st; win.el.querySelector('.wt-name').textContent=title+' — 记事本';
    const tb=$('#np-tb',win.body);
    tb.innerHTML=
      '<button class="btn" data-a="open">'+ICON('folder')+'<span class="lbl-txt">打开</span></button>'+
      '<button class="btn" data-a="save">'+ICON('save')+'<span class="lbl-txt">保存</span></button>'+
      '<button class="btn" data-a="saveas">'+ICON('download')+'<span class="lbl-txt">另存为</span></button>'+
      '<span class="sep"></span>'+
      '<button class="btn sq" data-a="undo" title="撤销">'+ICON('undo')+'</button>'+
      '<button class="btn sq" data-a="redo" title="重做">'+ICON('redo')+'</button>'+
      '<span class="sep"></span>'+
      '<button class="btn sq" data-a="smaller" title="缩小字号">'+ICON('min')+'</button>'+
      '<span class="chip" id="np-fsize">'+size+'px</span>'+
      '<button class="btn sq" data-a="larger" title="放大字号">'+ICON('plus')+'</button>'+
      '<span class="spacer"></span>'+
      '<button class="btn on" data-a="auto" id="np-auto">'+ICON('check')+'<span class="lbl-txt">自动保存</span></button>'+
      '<button class="btn" data-a="export">'+ICON('download')+'<span class="lbl-txt">导出</span></button>';
    const record=()=>{ const cur=ta.value; if(cur===st.hist[st.hi].text)return;
      st.hist=st.hist.slice(0,st.hi+1); st.hist.push({text:cur,sel:ta.selectionStart}); st.hi=st.hist.length-1;
      if(st.hist.length>240){st.hist.shift();st.hi--;} };
    const apply=h=>{ ta.value=h.text; try{ta.setSelectionRange(h.sel,h.sel);}catch(e){} this.status(win); saveDraft(); };
    const saveDraft=debounce(()=>{ if(!st.path)LS.set('notepad.draft',{text:ta.value,title:st.title}); },400);
    const autosave=debounce(async()=>{ if(!st.auto||!st.path)return;
      try{ await fs.writeText(st.path,ta.value); st.saved=true;st.dirty=false; this.status(win); }catch(e){} },700);
    ta.addEventListener('input',()=>{ st.dirty=true;st.saved=false; this.status(win); record(); saveDraft(); autosave(); });
    ta.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); record(); if(e.shiftKey)this.redo(win,record,apply); else this.undo(win,record,apply); return; }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); this.redo(win,record,apply); return; }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); this.save(win,false); return; }
      if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText('  ',s,s,'end'); }
    });
    win.data.np={record,apply,saveDraft,autosave};
    $$('[data-a]',tb).forEach(b=>b.onclick=async()=>{ const a=b.dataset.a;
      if(a==='undo'){record();this.undo(win,record,apply);}
      else if(a==='redo'){this.redo(win,record,apply);}
      else if(a==='smaller'||a==='larger'){ st.font=clamp(st.font+(a==='larger'?1:-1),10,28); ta.style.fontSize=st.font+'px';
        $('#np-fsize',win.body).textContent=st.font+'px'; LS.set('notepad.font',st.font); }
      else if(a==='auto'){ st.auto=!st.auto; b.classList.toggle('on',st.auto); toast(st.auto?'自动保存已开启':'自动保存已关闭'); }
      else if(a==='save')await this.save(win,false);
      else if(a==='saveas')await this.save(win,true);
      else if(a==='open')await this.openFile(win);
      else if(a==='export')download(enc.encode(ta.value).buffer,st.title.endsWith('.txt')?st.title:st.title+'.txt','text/plain');
    });
    win.onClose=()=>{ if(!st.path&&ta.value.trim())LS.set('notepad.draft',{text:ta.value,title:st.title}); return true; };
    this.status(win);
  },
  undo(win,record,apply){ const s=win.data.st; if(s.hi>0){ s.hi--; apply(s.hist[s.hi]); } },
  redo(win,record,apply){ const s=win.data.st; if(s.hi<s.hist.length-1){ s.hi++; apply(s.hist[s.hi]); } },
  status(win){ const s=win.data.st,ta=$('#np-ta',win.body); if(!ta)return;
    const t=ta.value, lines=t.split('\n').length;
    $('#np-st',win.body).innerHTML='<span>'+t.length+' 字符 · '+lines+' 行</span>'+
      '<span>UTF-8</span><span>'+esc(s.path||'未保存到虚拟文件系统')+'</span>'+
      '<span style="margin-left:auto;color:'+(s.saved?'var(--ok)':'var(--accent)')+'">'+(s.saved?'已保存':'有未保存的修改')+'</span>';
  },
  async save(win,as){
    const s=win.data.st,ta=$('#np-ta',win.body);
    let p=s.path;
    if(as||!p){ const list=await fs.list(p?pathDir(p):'/文档');
      const r=await prompt('另存为','输入文件名（保存回虚拟文件系统）',p?pathName(p):s.title||'未命名.txt');
      if(!r)return; p=pathJoin(p?pathDir(p):defaultDocs(),r); }
    try{ await fs.writeText(p,ta.value); s.path=p;s.title=pathName(p);s.saved=true;s.dirty=false;
      win.el.querySelector('.wt-name').textContent=s.title+' — 记事本';
      LS.del('notepad.draft'); this.status(win); HOOK.refreshAll(); toast('已保存到 '+p); }
    catch(e){ toast('保存失败：'+e.message,'err'); }
  },
  async openFile(win){
    const dirs=[defaultDest(),defaultDocs(),'/桌面','/文档']; const list=[];
    for(const d of dirs){ try{ for(const f of await fs.list(d)) if(f.type==='file'&&(TXT_EXT.includes(ext(f.name))||!ext(f.name)))list.push(f); }catch(e){} }

    const v=await dialog({title:'打开文本文件',text:'从虚拟文件系统中选择（也可输入完整路径）',

/* ==================================================================
   [17] 应用：表格（CSV / TSV 双视图）
   ================================================================== */
function parseDelimited(text,sep){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'&&text[i+1]==='"'){cur+='"';i++;} else if(c==='"')q=false; else cur+=c; }
    else { if(c==='"')q=true;
      else if(c===sep){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur='';}
      else cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function serializeDelimited(rows,sep){
  return rows.map(r=>r.map(c=>{ c=String(c==null?'':c);
    if(c.includes('"')||c.includes(sep)||/[\n\r]/.test(c))return '"'+c.replace(/"/g,'""')+'"'; return c; }).join(sep)).join('\n');
}
const TABLE={
  async build(win,params){
    const p=params.path||null; let text=params.content||'',sep=',';
    if(p){ try{ text=await fs.readText(p); sep=ext(pathName(p))==='tsv'?'\t':','; }catch(e){} }
    const rows=parseDelimited(text,sep);
    win.body.innerHTML='<div class="toolbar" id="tb-tb"></div><div class="tb-wrap">'+
      '<div class="tb-scroll" id="tb-scroll"><table class="tb-table" id="tb-table"></table></div>'+
      '<textarea class="tb-source hidden" id="tb-src" spellcheck="false"></textarea></div>'+
      '<div class="statusbar" id="tb-st"></div>';
    const src=$('#tb-src',win.body); src.value=text;
    const st={path:p,sep,rows,view:'table',saved:true}; win.data.st=st;
    win.el.querySelector('.wt-name').textContent=(p?pathName(p):'未命名表格')+' — 表格';
    const tb=$('#tb-tb',win.body);
    tb.innerHTML='<div class="seg" id="tb-vseg"><button data-v="table" class="on">'+ICON('table')+' 表格视图</button><button data-v="text">'+ICON('text')+' 文本视图</button></div>'+
      '<span class="sep"></span><button class="btn" data-a="addrow">'+ICON('plus')+'<span class="lbl-txt">加一行</span></button>'+
      '<button class="btn" data-a="addcol">'+ICON('plus')+'<span class="lbl-txt">加一列</span></button>'+
      '<span class="spacer"></span><span class="chip">'+(sep==='\t'?'TSV':'CSV')+'</span>'+
      '<button class="btn" data-a="save">'+ICON('save')+'<span class="lbl-txt">保存</span></button>'+
      '<button class="btn" data-a="export">'+ICON('download')+'<span class="lbl-txt">导出</span></button>';
    $$('#tb-vseg button',tb).forEach(b=>b.onclick=()=>{ $$('#tb-vseg button',tb).forEach(x=>x.classList.toggle('on',x===b)); this.setView(win,b.dataset.v); });
    $$('[data-a]',tb).forEach(b=>b.onclick=async()=>{ const a=b.dataset.a;
      if(a==='addrow'){ st.rows.push(new Array(Math.max(1,st.rows[0]?st.rows[0].length:1)).fill('')); this.drawTable(win); }
      else if(a==='addcol'){ st.rows.forEach(r=>r.push('')); this.drawTable(win); }
      else if(a==='save')await this.save(win);
      else if(a==='export')download(enc.encode(this.currentText(win)).buffer,p?pathName(p):'表格.'+(sep==='\t'?'tsv':'csv'),'text/plain');
    });
    src.addEventListener('input',()=>{ st.saved=false;this.status(win); });
    win.el.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();this.save(win);} });
    win.onClose=()=>true;
    this.drawTable(win); this.status(win);
  },
  currentText(win){ const s=win.data.st; return s.view==='text'?$('#tb-src',win.body).value:serializeDelimited(s.rows,s.sep); },
  setView(win,v){
    const s=win.data.st,src=$('#tb-src',win.body),scroll=$('#tb-scroll',win.body);
    if(v===s.view)return;
    if(v==='text'){ src.value=serializeDelimited(s.rows,s.sep); }
    else { s.rows=parseDelimited(src.value,s.sep); this.drawTable(win); }
    s.view=v; src.classList.toggle('hidden',v!=='text'); scroll.classList.toggle('hidden',v==='text'); this.status(win);
  },
  drawTable(win){
    const s=win.data.st,t=$('#tb-table',win.body); if(!t)return;
    const maxC=Math.max(1,...s.rows.map(r=>r.length));
    let h='<thead><tr><th class="tb-rownum">#</th>';
    for(let c=0;c<maxC;c++)h+='<th>'+String.fromCharCode(65+(c%26))+(c>=26?Math.floor(c/26):'')+'</th>';
    h+='</tr></thead><tbody>';
    s.rows.forEach((r,i)=>{ h+='<tr><td class="tb-rownum">'+(i+1)+'</td>';
      for(let c=0;c<maxC;c++)h+='<td contenteditable data-r="'+i+'" data-c="'+c+'">'+esc(r[c]==null?'':r[c])+'</td>';
      h+='</tr>'; });
    t.innerHTML=h+'</tbody>';
    $$('td[contenteditable]',t).forEach(td=>{ td.addEventListener('input',()=>{
      const r=+td.dataset.r,c=+td.dataset.c; if(!s.rows[r])s.rows[r]=[]; s.rows[r][c]=td.textContent; s.saved=false; this.status(win);
    }); });
  },
  status(win){ const s=win.data.st;
    $('#tb-st',win.body).innerHTML='<span>'+s.rows.length+' 行 × '+Math.max(0,...s.rows.map(r=>r.length))+' 列</span>'+
      '<span>'+(s.sep==='\t'?'制表符分隔':'逗号分隔')+'</span><span>'+esc(s.path||'未保存')+'</span>'+
      '<span style="margin-left:auto">'+(s.saved?'已保存':'有修改')+'</span>';
  },
  async save(win){
    const s=win.data.st; let p=s.path;
    if(!p){ const r=await prompt('保存表格','输入文件名（.csv 或 .tsv）','表格.csv'); if(!r)return;
      s.sep=ext(r)==='tsv'?'\t':','; p=pathJoin(defaultDocs(),r); }
    if(s.view==='text'){ s.rows=parseDelimited($('#tb-src',win.body).value,s.sep); }
    try{ await fs.writeText(p,serializeDelimited(s.rows,s.sep)); s.path=p;s.saved=true;this.status(win);HOOK.refreshAll();toast('已保存到 '+p); }
    catch(e){ toast('保存失败：'+e.message,'err'); }
  }
};

      if(!st.urls.has(p))st.urls.set(p,blobURL(ab,mimeOf(pathName(p))));

      stage.addEventListener('pointermove',mv);stage.addEventListener('pointerup',up); });
    win.onClose=()=>{ st.urls.forEach(u=>URL.revokeObjectURL(u)); return true; };
    if(st.path)await load(st.path);
    else stage.innerHTML='<div class="empty">'+ICON('image')+'<span>未指定图片</span></div>';
  }
};

    const update=()=>{ val.textContent=cur; expr.textContent=expression; };
    const press=k=>{
      if(/^[0-9.]$/.test(k)){ if(done||cur==='0'){cur=k==='.'?'0.':k;done=false;} else if(!(k==='.'&&cur.includes('.')))cur+=k; }
      else if('+−×÷'.includes(k)){ const op={'−':'-','×':'*','÷':'/'}[k]||k; expression=(expression||cur)+' '+op+' '; cur='0';done=false; }
      else if(k==='('||k===')'){ if(done){expression='';done=false;} expression+=k; }
      else if(k==='C'){cur='0';expression='';done=false;}
      else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0';}
      else if(k==='='){ const s=expression+cur;
        try{ const r=evalExpr(s.replace(/−/g,'-')); hist.textContent=s+' = '+r+'\n'+hist.textContent; cur=String(Math.round(r*1e10)/1e10); expression='';done=true; }
        catch(e){ toast(e.message,'err'); } }
      else if(['%','√','x²','1/x'].includes(k)){ const n=parseFloat(cur)||0;
        cur=String(k==='%'?n/100:k==='√'?Math.sqrt(n):k==='x²'?n*n:1/n); done=false; }
      update();
    };
    grid.addEventListener('click',e=>{ const b=e.target.closest('.ca-key'); if(b)press(b.dataset.k); });
    win.el.addEventListener('keydown',e=>{ const k=e.key;
      if(/^[0-9.+\-*/()%]$/.test(k))press(k);
      else if(k==='Enter'||k==='=')press('=');
      else if(k==='Backspace')press('⌫');
      else if(k==='Escape')press('C');
      else if(k==='x')press('×'); else if(k==='X')press('×');
    });
    update();
  }
};

const PAINT={
  build(win,params){
    win.body.innerHTML='<div class="toolbar" id="pa-tb"></div><div class="pa-wrap"><canvas class="pa-canvas" id="pa-cv"></canvas></div><div class="statusbar" id="pa-st"></div>';
    const cv=$('#pa-cv',win.body),ctx=cv.getContext('2d',{willReadFrequently:true});
    const st={color:'#1c2a23',size:4,tool:'pen',undo:[],path:params&&params.path||null}; win.data.st=st;
    const tb=$('#pa-tb',win.body);
    const colors=['#1c2a23','#d8a657','#d8735e','#2f7d61','#3a6ea5','#8c5b9e','#ffffff','#000000'];
    tb.innerHTML='<button class="btn on" data-a="pen">'+ICON('paint')+'<span class="lbl-txt">画笔</span></button>'+
      '<button class="btn" data-a="eraser">'+ICON('close')+'<span class="lbl-txt">橡皮</span></button>'+
      '<span class="sep"></span><div class="pa-swatches" id="pa-sw"></div>'+
      '<input type="color" id="pa-color" value="#1c2a23" title="自定义颜色">'+
      '<span class="sep"></span>'+ICON('min')+'<input type="range" id="pa-size" min="1" max="40" value="4" style="width:90px"><span class="chip" id="pa-sz">4px</span>'+
      '<span class="spacer"></span><button class="btn" data-a="undo">'+ICON('undo')+'<span class="lbl-txt">撤销</span></button>'+
      '<button class="btn" data-a="clear">'+ICON('trash')+'<span class="lbl-txt">清空</span></button>'+
      '<button class="btn" data-a="save">'+ICON('save')+'<span class="lbl-txt">保存</span></button>'+
      '<button class="btn" data-a="export">'+ICON('download')+'<span class="lbl-txt">导出</span></button>';
    $('#pa-sw',win.body).innerHTML=colors.map(c=>'<button class="pa-color" data-c="'+c+'" style="background:'+c+'"></button>').join('');
    $$('.pa-color',win.body).forEach(b=>b.onclick=()=>{st.color=b.dataset.c;$('#pa-color',win.body).value=b.dataset.c;});
    $('#pa-color',win.body).oninput=e=>st.color=e.target.value;
    $('#pa-size',win.body).oninput=e=>{st.size=+e.target.value;$('#pa-sz',win.body).textContent=st.size+'px';};
    const resize=()=>{ const wrap=cv.parentElement, snap=cv.width?cv.toDataURL():null;
      const dpr=Math.min(window.devicePixelRatio||1,2);
      cv.width=Math.max(1,Math.floor(wrap.clientWidth*dpr)); cv.height=Math.max(1,Math.floor(wrap.clientHeight*dpr));
      cv.style.width=wrap.clientWidth+'px';cv.style.height=wrap.clientHeight+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#f7f4ec';ctx.fillRect(0,0,wrap.clientWidth,wrap.clientHeight);
      if(snap){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,wrap.clientWidth,wrap.clientHeight);im.src=snap;}
    };
    requestAnimationFrame(resize); win.onResize=resize;
    let drawing=false,lx=0,ly=0;
    const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true;
      st.undo.push(cv.toDataURL()); if(st.undo.length>25)st.undo.shift();
      const p=pos(e);lx=p.x;ly=p.y; ctx.beginPath();ctx.moveTo(p.x,p.y); });
    cv.addEventListener('pointermove',e=>{ if(!drawing)return; const p=pos(e);
      ctx.globalCompositeOperation=st.tool==='eraser'?'destination-out':'source-over';
      ctx.strokeStyle=st.color;ctx.lineWidth=st.size;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y; });
    cv.addEventListener('pointerup',()=>{drawing=false;ctx.globalCompositeOperation='source-over';});
    cv.addEventListener('pointercancel',()=>{drawing=false;});
    $$('[data-a]',tb).forEach(b=>b.onclick=async()=>{ const a=b.dataset.a;
      if(a==='pen'||a==='eraser'){st.tool=a;$$('[data-a="pen"],[data-a="eraser"]',tb).forEach(x=>x.classList.toggle('on',x===b));}
      else if(a==='undo'){const s=st.undo.pop();if(s){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(im,0,0,cv.width/(window.devicePixelRatio||1),cv.height/(window.devicePixelRatio||1));};im.src=s;}}
      else if(a==='clear'){st.undo.push(cv.toDataURL());ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#f7f4ec';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();}
      else if(a==='save'||a==='export'){
        const blob=await new Promise(r=>cv.toBlob(r,'image/png')); const ab=await blob.arrayBuffer();
        if(a==='export'){download(ab,'画板.png','image/png');return;}
        const r=await prompt('保存到虚拟文件系统','输入文件名','画作.png'); if(!r)return;
        const p=pathJoin('/图片',r); try{await fs.writeFile(p,ab);toast('已保存到 '+p);HOOK.refreshAll();}catch(e){toast('保存失败','err');}
      }
    });
    $('#pa-st',win.body).innerHTML='<span>画布就绪</span><span style="margin-left:auto">支持鼠标与触控笔</span>';
  }
};

const TERM={
  async build(win){

    out.appendChild(inpWrap);
    const promptEl=$('#tm-p',inpWrap),inp=$('#tm-i',inpWrap);
    const setP=()=>promptEl.textContent='celadon:'+cwd+'$ '; setP();
    const print=(s,cls)=>{const d=el('div','tm-line '+(cls||''),esc(s));out.insertBefore(d,inpWrap);};
    const abs=p=>p&&p.startsWith('/')?norm(p):pathJoin(cwd,p||'');
    const cmds={
      help:()=>print('命令：ls  cd  pwd  cat  mkdir  touch  rm  mv  cp  echo  tree  date  df  open  about  clear  theme  mount  whoami'),
      ls:async a=>{const p=abs(a[0]);const l=await fs.list(p);print(l.length?l.map(f=>f.name+(f.type==='dir'?'/':'')).join('  '):'(空)');},
      cd:async a=>{const p=abs(a[0]||'/');const s=await fs.stat(p);if(s.type!=='dir')throw new Error('不是目录');cwd=p;setP();},
      pwd:()=>print(cwd),
      cat:async a=>{if(!a[0])throw new Error('用法：cat <文件>');print((await fs.readText(abs(a[0]))).slice(0,4000));},
      mkdir:async a=>{if(!a[0])throw new Error('用法：mkdir <名称>');await fs.mkdir(abs(a[0]));HOOK.refreshAll();},
      touch:async a=>{if(!a[0])throw new Error('用法：touch <文件>');await fs.writeText(abs(a[0]),'');HOOK.refreshAll();},
      rm:async a=>{if(!a[0])throw new Error('用法：rm <路径>');await fs.remove(abs(a[0]));HOOK.refreshAll();},
      mv:async a=>{await fs.move(abs(a[0]),abs(a[1]));HOOK.refreshAll();},
      cp:async a=>{await fs.copy(abs(a[0]),abs(a[1]));HOOK.refreshAll();},
      echo:async a=>{const t=a.join(' ');if(a.includes('>')){const i=a.indexOf('>'),txt=a.slice(0,i).join(' ');await fs.writeText(abs(a[i+1]),txt);}else print(t);},
      tree:async()=>{const t=await fs.tree(cwd,0,2);print(t.map(x=>'  '.repeat(x.path.split('/').length-cwd.split('/').length)+x.name).join('\n'));},
      date:()=>print(new Date().toLocaleString('zh-CN')),
      df:async()=>{const e=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():{};print('已用 '+fmtSize(e.usage||0)+' / 配额 '+fmtSize(e.quota||0));},
      open:async a=>{if(!a[0])throw new Error('用法：open <文件>');await OPEN.path(abs(a[0]));},
      about:()=>print('Celadon OS · 青瓷 | OPFS + IndexedDB 双后端 | 单文件零后端'),
      clear:()=>{$$('.tm-line',out).forEach(n=>{if(n!==inpWrap)n.remove();});},
      theme:()=>{CFG.theme=CFG.theme==='dark'?'light':'dark';saveCfg();WALL.apply();print('主题切换为 '+CFG.theme);},
      mount:async()=>{await MOUNT.pick();},
      whoami:()=>print('本地用户 @ celadon')
    };
    inp.addEventListener('keydown',async e=>{ if(e.key!=='Enter')return; const line=inp.value.trim();inp.value='';
      const echoLine=el('div','tm-line','<span class="cmd">'+esc(setPText())+'</span> '+esc(line)); out.insertBefore(echoLine,inpWrap);
      const parts=line.match(/"[^"]*"|'[^']*'|\S+/g)||[],cmd=parts.shift(),args=parts.map(s=>s.replace(/^['"]|['"]$/g,''));
      try{ if(cmds[cmd])await cmds[cmd](args); else if(cmd)print('未知命令：'+cmd,'er'); }catch(err){print(err.message,'er');}
      out.scrollTop=out.scrollHeight; });
    function setPText(){return 'celadon:'+cwd+'$';}
    out.addEventListener('click',()=>inp.focus()); setTimeout(()=>inp.focus(),100);
  }
};

   [24] 应用：HTML 编辑器（CodeMirror 5.65.x 内核）
   多语言 / 实时预览 / 格式化 / 查找替换 / 导入导出 / 保存回 VFS /
   分屏方向与视图 / 输入模式(自动·电脑·手机) / 状态栏 / 实例释放
   ================================================================== */
const EDITOR={
  MODES:[['htmlmixed','HTML'],['css','CSS'],['javascript','JavaScript'],['markdown','Markdown'],['application/json','JSON'],['xml','XML / SVG']],
  EXT:{html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',mjs:'javascript',cjs:'javascript',json:'application/json',md:'markdown',markdown:'markdown',xml:'xml',svg:'xml'},
  DEFNAME:{htmlmixed:'export.html',css:'style.css',javascript:'script.js',markdown:'readme.md','application/json':'data.json',xml:'document.xml'},
  MIME:{htmlmixed:'text/html',css:'text/css',javascript:'text/javascript',markdown:'text/markdown','application/json':'application/json',xml:'application/xml'},
  modeFor(name){ return this.EXT[ext(name)]||'htmlmixed'; },
  langName(m){ return (this.MODES.find(x=>x[0]===m)||['','纯文本'])[1]; },
  /* --- 简易代码格式化（无第三方依赖） --- */
  format(src,mode){
    if(mode==='application/json'){ try{return JSON.stringify(JSON.parse(src),null,2);}catch(e){return src;} }
    if(mode==='css'){
      let out=src.replace(/\s*\{\s*/g,' {\n').replace(/;\s*/g,';\n').replace(/\s*\}\s*/g,'\n}\n').replace(/\n{2,}/g,'\n');
      const lines=out.split('\n');let ind=0;
      return lines.map(l=>{l=l.trim();if(!l)return ''; if(l.startsWith('}'))ind=Math.max(0,ind-1);
        const r='  '.repeat(ind)+l; if(l.endsWith('{'))ind++; return r;}).join('\n').trim();
    }
    if(mode==='javascript'){
      const lines=src.replace(/\s*\{\s*/g,' {\n').replace(/;\s*/g,';\n').replace(/\s*\}\s*/g,'\n}\n').split('\n');let ind=0;
      return lines.map(l=>{l=l.trim();if(!l)return '';if(/^[}\])]/.test(l))ind=Math.max(0,ind-1);
        const r='  '.repeat(ind)+l;if(/[{(]\s*$/.test(l))ind++;return r;}).join('\n').trim();
    }
    if(mode==='htmlmixed'||mode==='xml'){
      const s=src.replace(/>\s*</g,'>\n<').replace(/\n{2,}/g,'\n');
      const lines=s.split('\n');let ind=0;
      const VOID=['br','hr','img','input','meta','link','source','area','base','col','embed','param','track','wbr'];
      return lines.map(l=>{l=l.trim();if(!l)return '';
        if(/^<\//.test(l))ind=Math.max(0,ind-1);
        const r='  '.repeat(ind)+l;
        if(/^<[^/!?]/.test(l)&&!/^<[^>]*\/>$/.test(l)){ const tag=(l.match(/^<([a-zA-Z0-9-]+)/)||[])[1]; if(tag&&!VOID.includes(tag.toLowerCase()))ind++; }
        return r;}).join('\n').trim();
    }
    return src;
  },
  /* --- 预览文档生成（DOM 隔离：写入 iframe.srcdoc） --- */
  previewDoc(code,mode){
    const base='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
      '<style>body{margin:0;padding:22px;font-family:system-ui,"PingFang SC",sans-serif;background:#faf8f2;color:#1c2a23;line-height:1.7}'+

      'code{font-family:ui-monospace,monospace}a{color:#9c6b1f}h1,h2,h3{font-family:Georgia,serif}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:5px 10px}</style></head><body>';
    if(mode==='htmlmixed')return code;
    if(mode==='css')return '<!doctype html><html><head><meta charset="utf-8"><style>'+code+'</style></head><body><h1>样式预览</h1><p>这是一个用于检视 CSS 的示例页面。</p><button>按钮</button><div class="box" style="padding:16px;margin:12px 0">容器</div></body></html>';
    if(mode==='javascript')return '<!doctype html><html><head><meta charset="utf-8"><style>body{background:#121a17;color:#e9efe7;font-family:ui-monospace,monospace}#log{padding:16px}pre{background:#1b2621;padding:12px;border-radius:6px}</style></head><body><div id="log"><b>控制台输出</b><pre id="o"></pre></div>'+
      '<scr'+'ipt>var _o=document.getElementById("o");console.log=function(){for(var i=0;i<arguments.length;i++){_o.textContent+=String(arguments[i])+"\\n"}};'+
      'window.onerror=function(m){_o.textContent+="错误: "+m+"\\n"};<\/scr'+'ipt><scr'+'ipt>'+code+'<\/scr'+'ipt></body></html>';
    if(mode==='markdown'){
      let h=esc(code)
        .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
        .replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/\n/g,'<br>');
      return base+'<div>'+h+'</div></body></html>';
    }
    return base+'<h3>'+esc(this.langName(mode))+' 预览</h3><pre>'+esc(code)+'</pre></body></html>';
  },
  /* --- Markdown/JS 等辅助转义 --- */
  async build(win,params){

    const ta=$('#ed-ta',win.body); ta.value=text; st.textarea=ta;
    win.el.querySelector('.wt-name').textContent=(st.path?pathName(st.path):'未命名文档')+' — HTML 编辑器';

    // 加载 CodeMirror（首次使用时才请求 CDN），失败则降级为原生 textarea
    const CM=await CDN.cm();

    else { this.initFallback(win); toast('代码编辑器组件不可用，已切换为轻量文本模式'); }

      st.cm=null; st.urls.forEach(u=>URL.revokeObjectURL(u)); clearTimeout(st.previewTimer); return true;
    };
  },

      [['auto','自动'],['pc','电脑'],['mobile','手机']].map(v=>'<option value="'+v[0]+'"'+(v[0]===st.input?' selected':'')+'>'+v[1]+'</option>').join('')+'</select>'+
      '<span class="sep"></span><button class="btn on" data-a="wrap">'+ICON('text')+'<span>自动换行</span></button>'+
      '<span class="spacer"></span><span class="chip" id="ed-path">'+(st.path?esc(st.path):'未保存 · 默认保存到 /桌面')+'</span>';
    $$('#ed-tb1 [data-a]',win.body).forEach(b=>b.onclick=()=>this.action(win,b.dataset.a,b));
    $$('#ed-tb2 [data-a]',win.body).forEach(b=>b.onclick=()=>this.action(win,b.dataset.a,b));
    $('#ed-mode',win.body).onchange=e=>{ st.mode=e.target.value; if(st.cm)st.cm.setOption('mode',st.mode); this.status(win); this.refreshPreview(win); };
    $('#ed-view',win.body).onchange=e=>{ st.view=e.target.value;CFG.editorMode=st.view;saveCfg();this.applyLayout(win); };
    $('#ed-dir',win.body).onchange=e=>{ st.split=e.target.value;CFG.editorDir=st.split;saveCfg();this.applyLayout(win); };
    $('#ed-input',win.body).onchange=e=>{ st.input=e.target.value;CFG.editorInput=st.input;saveCfg();this.setInputMode(win); };
  },
  cmOptions(st,CM){
    let inputStyle;
    if(st.input==='pc')inputStyle='textarea'; else if(st.input==='mobile')inputStyle='contenteditable'; else inputStyle=CM.defaults.inputStyle;
    return {mode:st.mode,theme:'material-darker',lineNumbers:true,lineWrapping:st.wrap,styleActiveLine:true,
      indentUnit:2,tabSize:2,indentWithTabs:false,matchBrackets:true,autoCloseBrackets:true,
      inputStyle,viewportMargin:Infinity};
  },
  initCM(win,CM){
    const st=win.data.st,ta=$('#ed-ta',win.body);
    const cm=CM.fromTextArea(ta,this.cmOptions(st,CM)); st.cm=cm;
    const changed=()=>{ clearTimeout(st.previewTimer); st.previewTimer=setTimeout(()=>this.refreshPreview(win),280); this.status(win); };
    cm.on('change',changed); cm.on('cursorActivity',()=>this.status(win));
    // Ctrl+S 拦截
    cm.getWrapperElement().addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();this.action(win,'save');} });
  },
  initFallback(win){
    const st=win.data.st,ta=$('#ed-ta',win.body);
    ta.style.cssText='width:100%;height:100%;border:0;outline:0;resize:none;padding:14px;background:#1c2420;color:#e9efe7;font-family:var(--font-mono);font-size:13px;line-height:1.65';
    ta.addEventListener('input',()=>{clearTimeout(st.previewTimer);st.previewTimer=setTimeout(()=>this.refreshPreview(win),300);this.status(win);});
    ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();this.action(win,'save');}});
  },
  value(win){ const s=win.data.st; return s.cm?s.cm.getValue():s.textarea.value; },
  setValue(win,v){ const s=win.data.st; if(s.cm)s.cm.setValue(v); else s.textarea.value=v; this.status(win);this.refreshPreview(win); },
  cursor(win){ const s=win.data.st; return s.cm?s.cm.getCursor():{line:0,ch:0}; },
  setInputMode(win){
    const st=win.data.st; if(!st.cm)return;
    const CM=window.CodeMirror; if(!CM)return;
    const val=st.cm.getValue(),cur=st.cm.getCursor(),hist=st.cm.getHistory();
    try{ st.cm.toTextArea(); }catch(e){ try{st.cm.getWrapperElement().remove();}catch(err){} }
    st.cm=null;
    // toTextArea() 会把原始 #ed-ta 还原到 DOM，复用它避免残留重复文本框
    let ta=$('#ed-ta',win.body);
    if(!ta){ ta=el('textarea'); ta.id='ed-ta'; $('#ed-code',win.body).appendChild(ta); }
    ta.value=val; st.textarea=ta;
    $$('#ed-code textarea',win.body).forEach(n=>{ if(n!==ta)n.remove(); });
    try{ const cm=CM.fromTextArea(ta,this.cmOptions(st,CM)); st.cm=cm;
      cm.setHistory(hist); cm.setCursor(cur); cm.focus();
      cm.on('change',()=>{clearTimeout(st.previewTimer);st.previewTimer=setTimeout(()=>this.refreshPreview(win),280);this.status(win);});
      cm.on('cursorActivity',()=>this.status(win));
      cm.getWrapperElement().addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();this.action(win,'save');}});
    }catch(e){ this.initFallback(win); }
    toast('输入模式已切换：'+({auto:'自动',pc:'电脑',mobile:'手机'}[st.input]));
  },
  applyLayout(win){
    const st=win.data.st,sp=$('#ed-split',win.body),code=$('#ed-code',win.body),prev=$('#ed-preview',win.body),splitter=$('#ed-splitter',win.body);
    sp.classList.toggle('v',st.split==='v');
    const showCode=st.view!=='preview',showPrev=st.view!=='code';
    code.style.display=showCode?'':'none'; prev.style.display=showPrev?'':'none'; splitter.style.display=(showCode&&showPrev)?'':'none';
    if(showCode&&showPrev){ code.style.flex='1';prev.style.flex='1';code.style.width='';code.style.height='';prev.style.width='';prev.style.height=''; }
    else { const only=showCode?code:prev; only.style.flex='1';only.style.width='';only.style.height=''; }
    this.status(win);
  },
  bindSplitter(win){
    const sp=$('#ed-split',win.body),bar=$('#ed-splitter',win.body),code=$('#ed-code',win.body),prev=$('#ed-preview',win.body),st=win.data.st;
    bar.addEventListener('pointerdown',e=>{ e.preventDefault();bar.setPointerCapture(e.pointerId);bar.classList.add('active');
      const r=sp.getBoundingClientRect();
      const move=ev=>{ const vertical=st.split==='v'; const total=vertical?r.height:r.width;
        const p=clamp(((vertical?ev.clientY-r.top:ev.clientX-r.left)/total)*100,15,85);
        code.style.flex=p+'%';prev.style.flex=(100-p)+'%';
        if(vertical){code.style.height=p+'%';prev.style.height=(100-p)+'%';code.style.width='';prev.style.width='';}
        else {code.style.width=p+'%';prev.style.width=(100-p)+'%';code.style.height='';prev.style.height='';}
        if(st.cm)st.cm.refresh();
      };
      const up=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.classList.remove('active');};
      bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);
    });
  },
  findPanel(win){
    const p=$('#ed-find',win.body);
    p.innerHTML=ICON('find')+'<input class="inp" id="ed-fq" placeholder="查找"><input class="inp" id="ed-fr" placeholder="替换为">'+
      '<button class="btn" data-f="prev">上一处</button><button class="btn" data-f="next">下一处</button>'+
      '<button class="btn" data-f="replace">替换</button><button class="btn" data-f="all">全部替换</button>'+
      '<span class="cnt" id="ed-fc"></span><button class="btn sq" data-f="close">'+ICON('close')+'</button>';
    $$('[data-f]',p).forEach(b=>b.onclick=()=>this.findAction(win,b.dataset.f));
    $('#ed-fq',p).addEventListener('input',()=>this.findCount(win));
    $('#ed-fq',p).addEventListener('keydown',e=>{if(e.key==='Enter')this.findAction(win,'next');});
    $('#ed-fr',p).addEventListener('keydown',e=>{if(e.key==='Enter')this.findAction(win,'replace');});
  },
  findCount(win){
    const st=win.data.st,q=$('#ed-fq',win.body).value; const out=$('#ed-fc',win.body);
    if(!q){out.textContent='';return;} let n=0;
    if(st.cm&&st.cm.getSearchCursor){ const c=st.cm.getSearchCursor(q,{line:0,ch:0},{caseFold:true});while(c.findNext())n++; }
    else n=(this.value(win).split(q).length-1);
    out.textContent=n+' 处';
  },
  findAction(win,a){
    const st=win.data.st,p=$('#ed-find',win.body),q=$('#ed-fq',win.body).value,rp=$('#ed-fr',win.body).value;
    if(a==='close'){p.classList.add('hidden');return;}
    if(a==='open'){p.classList.remove('hidden');$('#ed-fq',p).focus();return;}
    if(!q)return;
    if(!st.cm){
      const v=this.value(win); if(a==='all')this.setValue(win,v.split(q).join(rp));
      else toast('轻量模式仅支持全部替换');
      this.findCount(win);return;
    }
    const cm=st.cm;
    if(a==='next'||a==='prev'){
      const c=cm.getSearchCursor(q,cm.getCursor(),{caseFold:true}); const found=a==='next'?c.findNext():c.findPrevious();
      if(found){cm.setSelection(c.from(),c.to());cm.scrollIntoView(c.from());cm.focus();}
      else {const c2=cm.getSearchCursor(q,{line:0,ch:0},{caseFold:true});if(c2.findNext()){cm.setSelection(c2.from(),c2.to());cm.scrollIntoView(c2.from());}}
    } else if(a==='replace'){
      const c=cm.getSearchCursor(q,cm.getCursor(),{caseFold:true}); if(c.findNext()){cm.replaceRange(rp,c.from(),c.to());}
    } else if(a==='all'){
      cm.operation(()=>{const c=cm.getSearchCursor(q,{line:0,ch:0},{caseFold:true});while(c.findNext()){c.replace(rp);}});
    }
    this.findCount(win);
  },
  refreshPreview(win){
    const st=win.data.st,frame=$('#ed-frame',win.body),mask=$('#ed-mask',win.body);
    if(!frame)return;
    if(st.view==='code')return;
    const doc=this.previewDoc(this.value(win),st.mode);
    mask.classList.remove('gone');mask.style.display='flex';
    frame.onload=()=>{mask.classList.add('gone');setTimeout(()=>{if(mask.classList.contains('gone'))mask.style.display='none';},320);};
    frame.srcdoc=doc;
    setTimeout(()=>{mask.classList.add('gone');setTimeout(()=>{if(mask.classList.contains('gone'))mask.style.display='none';},320);},1600);
  },
  status(win){
    const st=win.data.st,box=$('#ed-st',win.body); if(!box)return;
    const v=this.value(win),cur=this.cursor(win);
    let selN=0; if(st.cm){ const s=st.cm.getSelection();selN=s.length; }
    else { const ta=st.textarea;selN=Math.abs((ta.selectionEnd||0)-(ta.selectionStart||0)); }
    box.innerHTML='<span>行 '+(cur.line+1)+', 列 '+(cur.ch+1)+'</span>'+
      (selN?'<span style="color:var(--accent)">已选 '+selN+' 字符</span>':'')+
      '<span>'+v.split('\n').length+' 行</span><span>'+v.length+' 字符</span>'+
      '<span>'+esc(this.langName(st.mode))+'</span><span>UTF-8</span>'+
      '<span style="margin-left:auto">'+esc(st.path||'未保存')+'</span>';
  },
  async action(win,a,btn){
    const st=win.data.st,v=this.value(win),p=$('#ed-find',win.body);
    if(a==='save'){ let path=st.path;
      if(!path){ path=pathJoin(st.saveDir,this.DEFNAME[st.mode]||'export.html'); }
      try{ await fs.writeText(path,v); st.path=path;st.saveDir=pathDir(path);
        $('#ed-path',win.body).textContent=path; win.el.querySelector('.wt-name').textContent=pathName(path)+' — HTML 编辑器';
        HOOK.refreshAll(); this.status(win); toast('已保存到 '+path); }catch(e){toast('保存失败：'+e.message,'err');} return; }
    if(a==='saveas'){ const r=await prompt('另存为','输入虚拟文件系统中的完整路径或文件名',pathJoin(st.saveDir,this.DEFNAME[st.mode]||'export.html'));
      if(!r)return; const path=r.startsWith('/')?norm(r):pathJoin(st.saveDir,r);
      try{await fs.writeText(path,v);st.path=path;st.saveDir=pathDir(path);$('#ed-path',win.body).textContent=path;HOOK.refreshAll();toast('已保存到 '+path);}catch(e){toast('保存失败','err');} return; }
    if(a==='import'){ const inp=el('input');inp.type='file';inp.accept='.html,.htm,.css,.js,.mjs,.json,.md,.markdown,.xml,.svg,.txt,*';
      inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const t=await f.text();this.setValue(win,t);
        st.mode=this.modeFor(f.name);$('#ed-mode',win.body).value=st.mode;if(st.cm)st.cm.setOption('mode',st.mode);
        st.path=null;$('#ed-path',win.body).textContent='来自本机：'+f.name;this.status(win);toast('已导入 '+f.name);}; inp.click(); return; }
    if(a==='dl'||a==='vexport'){
      const def=this.DEFNAME[st.mode]||'export.txt';
      const name=await prompt(a==='dl'?'下载到本机':'导出到虚拟桌面','可自定义文件名（含扩展名）',st.path?pathName(st.path):def);
      if(!name)return;
      if(a==='dl'){download(enc.encode(v).buffer,name,this.MIME[st.mode]||'text/plain');toast('已开始下载 '+name);}
      else {const path=pathJoin('/桌面',name);try{await fs.writeText(path,v);HOOK.refreshAll();toast('已导出到 '+path);}catch(e){toast('导出失败','err');}}
      return; }
    if(a==='undo'){ if(st.cm)st.cm.undo(); else document.execCommand('undo'); return; }
    if(a==='redo'){ if(st.cm)st.cm.redo(); else document.execCommand('redo'); return; }
    if(a==='format'){ const cur=this.cursor(win); const out=this.format(v,st.mode);
      this.setValue(win,out);
      if(st.cm){const last=st.cm.lineCount()-1;st.cm.setCursor({line:Math.min(cur.line,last),ch:Math.min(cur.ch,(st.cm.getLine(Math.min(cur.line,last))||'').length)});st.cm.focus();}
      toast('格式化完成'); return; }
    if(a==='copyall'){ try{await navigator.clipboard.writeText(v);}catch(e){const t=el('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
      toast('已复制全部内容'); return; }
    if(a==='clear'){ const ok=await confirmBox('清空','确定要清空编辑器中的全部内容吗？',true); if(!ok)return; this.setValue(win,'');return; }
    if(a==='find'){ p.classList.toggle('hidden'); if(!p.classList.contains('hidden'))$('#ed-fq',p).focus(); return; }
    if(a==='refresh'){this.refreshPreview(win);toast('预览已刷新');return;}
    if(a==='wrap'){ st.wrap=!st.wrap;btn.classList.toggle('on',st.wrap);if(st.cm)st.cm.setOption('lineWrapping',st.wrap);return; }
    if(a==='newwin'||a==='inbrowser'){
      const html=st.mode==='htmlmixed'?v:this.previewDoc(v,st.mode);
      const u=blobURL(enc.encode(html).buffer,'text/html'); st.urls.push(u);
      if(a==='newwin')window.open(u,'_blank','noopener');
      else APP.launch('browser',{url:u,title:(st.path?pathName(st.path):'编辑器预览')});
      toast(a==='newwin'?'已在新标签页打开':'已在系统浏览器中打开'); return; }
  }
};
APP.open.editor=params=>WM.open({app:'editor',icon:'code',title:'HTML 编辑器',w:1120,h:680,minW:520,minH:380,params,mount:w=>EDITOR.build(w,params||{})});
/* ==================================================================
   [25] 应用：漫画阅读器（Webtoon 条漫）
   同目录序列 / 自然数字排序 / 并行读取按序插入 / 失败跳过 / 定位 /
   骨架占位 + 高度补偿 / PC 指针拖拽惯性 / 移动端原生滚动 / 全屏沉浸
   ================================================================== */
const MANGA={
  async build(win,params){
    win.body.innerHTML='<div class="toolbar" id="mg-tb"></div>'+
      '<div class="mg-wrap"><div class="mg-scroll" id="mg-scroll"><div class="mg-inner" id="mg-inner"></div></div>'+
      '<div class="mg-hud" id="mg-hud"><span id="mg-count">0 / 0</span><div class="bar"><i id="mg-bar"></i></div><span id="mg-name"></span></div>'+
      '<div class="mg-load" id="mg-load"><div class="spinner"></div><span id="mg-load-t">正在读取图片…</span></div></div>'+
      '<div class="statusbar" id="mg-st"></div>';
    const tb=$('#mg-tb',win.body);
    tb.innerHTML='<span class="chip" id="mg-dir"></span><span class="spacer"></span>'+
      '<button class="btn" data-a="top">'+ICON('up')+'<span class="lbl-txt">回到顶部</span></button>'+
      '<button class="btn" data-a="viewer">'+ICON('image')+'<span class="lbl-txt">单页查看</span></button>'+
      '<button class="btn" data-a="fs">'+ICON('full')+'<span class="lbl-txt">沉浸全屏</span></button>';
    const st={path:params&&params.path||null,dir:'/',files:[],urls:[],cur:0,full:false,raf:0}; win.data.st=st;
    const scroll=$('#mg-scroll',win.body),inner=$('#mg-inner',win.body);
    const exit=el('button','mg-exit',ICON('close')); exit.title='退出全屏'; document.body.appendChild(exit);
    st.exitBtn=exit;
    exit.onclick=()=>MANGA.exitFull(win);
    const onFS=()=>{ if(!document.fullscreenElement&&st.full)MANGA.exitFull(win,true); };
    document.addEventListener('fullscreenchange',onFS); st.onFS=onFS;
    /* --- 条漫拖拽：PC 用 Pointer Events 手抓 + 阻尼滑行；移动端交给合成器 --- */
    let dragging=false,sy=0,top=0,lastY=0,lastT=0,vel=0;
    const inertia=()=>{ vel*=0.96; if(Math.abs(vel)<0.35){st.raf=0;return;}
      scroll.scrollTop-=vel; st.raf=requestAnimationFrame(inertia); };
    scroll.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch')return; if(e.button!==0)return;
      dragging=true;sy=e.clientY;top=scroll.scrollTop;lastY=e.clientY;lastT=performance.now();vel=0;
      cancelAnimationFrame(st.raf);st.raf=0;scroll.classList.add('grabbing');scroll.setPointerCapture(e.pointerId); });
    scroll.addEventListener('pointermove',e=>{ if(!dragging)return; const dy=e.clientY-sy;
      scroll.scrollTop=top-dy; const now=performance.now(),dt=Math.max(1,now-lastT);
      vel=(e.clientY-lastY)/dt*14; lastY=e.clientY;lastT=now; });
    const stopDrag=()=>{ if(!dragging)return; dragging=false;scroll.classList.remove('grabbing');
      if(Math.abs(vel)>0.6)st.raf=requestAnimationFrame(inertia); };
    scroll.addEventListener('pointerup',stopDrag); scroll.addEventListener('pointercancel',stopDrag);
    /* --- HUD 进度 --- */
    const updateHud=()=>{
      const pages=$$('.mg-page',inner); let idx=0;
      const mid=scroll.scrollTop+scroll.clientHeight/2;
      pages.forEach((p,i)=>{if(p.offsetTop<=mid)idx=i;});
      st.cur=idx;
      $('#mg-count',win.body).textContent=(idx+1)+' / '+pages.length;
      $('#mg-name',win.body).textContent=st.files[idx]?st.files[idx].name:'';
      $('#mg-bar',win.body).style.width=(pages.length?((idx+1)/pages.length*100):0)+'%';
    };
    scroll.addEventListener('scroll',throttleRAF(updateHud),{passive:true});
    $$('[data-a]',tb).forEach(b=>b.onclick=()=>{ const a=b.dataset.a;
      if(a==='top')scroll.scrollTo({top:0,behavior:'smooth'});
      else if(a==='viewer'){ const f=st.files[st.cur]; if(f)APP.launch('viewer',{path:f.path}); }
      else if(a==='fs')this.enterFull(win);
    });
    win.onClose=()=>{ document.removeEventListener('fullscreenchange',onFS); exit.remove();
      cancelAnimationFrame(st.raf); st.urls.forEach(u=>URL.revokeObjectURL(u));
      if(document.fullscreenElement)document.exitFullscreen().catch(()=>{}); return true; };
    await this.load(win);
  },
  async load(win){
    const st=win.data.st,scroll=$('#mg-scroll',win.body),inner=$('#mg-inner',win.body),mask=$('#mg-load',win.body),txt=$('#mg-load-t',win.body);
    st.dir=st.path?pathDir(st.path):'/图片';
    $('#mg-dir',win.body).textContent=st.dir;
    let all=[];
    try{ all=await fs.list(st.dir); }catch(e){ mask.innerHTML=ICON('alert')+'<span>目录读取失败：'+esc(e.message)+'</span>';toast('目录读取失败','err');return; }
    st.files=all.filter(f=>f.type==='file'&&IMG_EXT.includes(ext(f.name).toLowerCase()))
      .sort((a,b)=>natural(a.name,b.name));   // 自然数字排序：1,2,10 而非 1,10,2
    if(!st.files.length){ mask.innerHTML=ICON('image')+'<span>该目录下没有可识别的图片</span>';return; }
    win.el.querySelector('.wt-name').textContent=pathName(st.dir)+'（'+st.files.length+' 页） — 漫画阅读器';
    txt.textContent='正在并行读取 '+st.files.length+' 张图片…';
    // 并行发起所有读取，但严格按排序顺序插入 DOM
    const jobs=st.files.map(f=>fs.readFile(f.path).then(ab=>({f,ab})).catch(()=>({f,ab:null})));
    const pages=[];
    for(let i=0;i<jobs.length;i++){
      const {f,ab}=await jobs[i];
      const page=el('div','mg-page'); page.dataset.i=i;
      page.style.aspectRatio='2 / 3';   // 固有宽高比骨架占位
      const no=el('div','pg-no',(i+1)+' / '+st.files.length); page.appendChild(no);
      if(!ab){ page.className='mg-page err';page.textContent='第 '+(i+1)+' 张读取失败 · 已跳过';page.style.aspectRatio='auto';page.style.height='70px'; }
      else{
        const u=blobURL(ab,mimeOf(f.name)); st.urls.push(u);
        const img=el('img'); img.alt=esc(f.name); img.draggable=false; img.loading='lazy';
        img.onload=()=>{
          const before=page.getBoundingClientRect().height;
          page.style.aspectRatio='auto';
          const after=page.getBoundingClientRect().height;
          const delta=after-before;
          // 上方图片撑开高度时补偿 scrollTop，避免阅读画面跳动
          if(delta>0&&page.offsetTop<scroll.scrollTop)scroll.scrollTop+=delta;
        };
        img.src=u; page.appendChild(img);
      }
      inner.appendChild(page); pages.push(page);
      if(i===0||i%5===0)txt.textContent='已载入 '+(i+1)+' / '+st.files.length+' 页…';
      await sleep(0);
    }

async function withLoading(title,fn){
  const m=el('div','modal-mask');
  m.innerHTML='<div class="modal" style="text-align:center;max-width:340px"><div class="spinner" style="margin:6px auto 14px"></div>'+
    '<div style="font-size:13px" id="ld-t">'+esc(title)+'</div><div style="font-size:10.5px;color:var(--text-3);margin-top:8px" id="ld-s">请稍候…</div></div>';
  document.body.appendChild(m);
  const sub=s=>{const n=$('#ld-s',m);if(n)n.textContent=s;};
  try{ return await fn(sub); }finally{ m.remove(); }
}
function tarStr(a,o,n){ return dec.decode(a.subarray(o,o+n)).replace(/\0[\s\S]*$/,'').trim(); }
function parseTAR(ab){
  const u8=new Uint8Array(ab),out=[]; let off=0;
  while(off+512<=ab.byteLength){
    const h=u8.subarray(off,off+512);
    if(h.every(b=>b===0))break;
    let name=tarStr(u8,off,100); const prefix=tarStr(u8,off+345,155);
    if(prefix)name=prefix+'/'+name;
    const size=parseInt(tarStr(u8,off+124,12)||'0',8)||0;
    const mtime=(parseInt(tarStr(u8,off+136,12)||'0',8)||0)*1000;
    const type=String.fromCharCode(h[156]||48);
    const data=u8.slice(off+512,off+512+size);
    out.push({name,size,mtime,type,data});
    off+=512+Math.ceil(size/512)*512;
  }
  return out;
}
async function inflateRaw(ab,format){
  if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持原生解压流');
  const ds=new DecompressionStream(format);
  const stream=new Blob([ab]).stream().pipeThrough(ds);
  return await new Response(stream).arrayBuffer();
}

  async stats(){
    let est={quota:0,usage:0}; try{ if(navigator.storage&&navigator.storage.estimate)est=await navigator.storage.estimate(); }catch(e){}
    const all=await fs.tree('/',0,8);
    const cats={图片:0,音频:0,视频:0,文档:0,代码:0,表格:0,压缩与归档:0,其他:0};
    const back={opfs:0,idb:0,local:0,mem:0},bcount={opfs:0,idb:0,local:0,mem:0};
    const files=[]; let dirs=0;
    for(const n of all){
      if(n.type==='dir'){dirs++;continue;}
      let size=0;try{size=(await fs.stat(n.path)).size;}catch(e){continue;}
      const e=ext(n.name); let c='其他';
      if(IMG_EXT.includes(e))c='图片'; else if(AUD_EXT.includes(e))c='音频'; else if(VID_EXT.includes(e))c='视频';
      else if(['csv','tsv'].includes(e))c='表格'; else if(ZIP_EXT.includes(e)||e==='pdf')c='压缩与归档';
      else if(['html','css','js','mjs','json','xml','svg','ts','py','sh','md'].includes(e))c='代码';
      else if(TXT_EXT.includes(e))c='文档';
      cats[c]+=size;
      const kind=(fs.resolve(n.path).m&&fs.resolve(n.path).m.kind)||'opfs';
      back[kind]=(back[kind]||0)+size;bcount[kind]=(bcount[kind]||0)+1;
      files.push({name:n.name,path:n.path,size,kind});
    }
    let idbRecs=0,idbBytes=0;
    if(IDB_OK){try{const a=await idbAll('files');idbRecs=a.length;idbBytes=a.reduce((s,r)=>s+(r.data?r.data.byteLength:0),0);}catch(e){}}
    return {est,cats,back,bcount,files,dirs,idbRecs,idbBytes,meta:Meta.all().length,
      total:Object.values(cats).reduce((a,b)=>a+b,0)};
  },

    box.innerHTML=this.head('关于与重置','Celadon OS 是一个完全运行在浏览器中的桌面环境，所有数据都留在你的设备上。')+
      '<div class="se-sec"><h3>系统信息</h3><table class="pp-table">'+info.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</table></div>'+
      '<div class="se-sec"><h3>快捷键</h3><table class="pp-table">'+keys.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</table></div>'+
      '<div class="se-sec"><h3>危险操作</h3>'+
      this.row('一键重置','清除 OPFS / IndexedDB 中的所有文件、挂载与偏好设置，重新初始化虚拟文件系统',
        '<button class="btn danger" id="se-reset">'+ICON('reset')+'重置系统</button>')+'</div>';
    $('#se-reset',box).onclick=()=>this.reset();
  },
  async reset(){
    const ok=await confirmBox('一键重置','这将清除虚拟文件系统中的所有文件、本地挂载与个性化设置，且无法撤销。确定继续吗？',true);
    if(!ok)return;
    await withLoading('正在重置虚拟文件系统…',async sub=>{
      sub('清除 OPFS 主存…');
      try{ const root=await navigator.storage.getDirectory(); await root.removeEntry('celadon_vfs',{recursive:true}); }catch(e){}
      sub('清除 IndexedDB 数据与元数据…');
      if(IDB_OK)for(const s of ['files','meta','mounts','kv']){try{await idbClear(s);}catch(e){}}
      sub('清除本机偏好与草稿…');
      try{Object.keys(localStorage).filter(k=>k.startsWith('celadon.')).forEach(k=>localStorage.removeItem(k));}catch(e){}
      try{document.cookie.split(';').forEach(c=>{const n=c.split('=')[0].trim();if(n.startsWith('celadon_'))document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';});}catch(e){}
    });
    location.reload();
  }
};
APP.open.settings=params=>WM.open({app:'settings',icon:'settings',title:'设置',w:900,h:620,minW:440,minH:340,params,mount:w=>SETTINGS.build(w,params||{})});
/* 文件变化后刷新所有已打开的资源管理器窗口 */
HOOK.refreshExplorer=()=>{
  WM.wins.filter(w=>w.app==='explorer').forEach(w=>{
    if(w.data&&w.data.st){ try{ EX.render(w); }catch(e){ console.warn(e); } }
  });
};

/* ==================================================================
   [29] 移动端长按 → 上下文菜单（与桌面右键完全一致）
   ================================================================== */
let _lpTimer=null,_lpPt=null,_longPressed=false;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return; const t=e.touches[0]; _lpPt={x:t.clientX,y:t.clientY};
  _lpTimer=setTimeout(()=>{
    const target=document.elementFromPoint(_lpPt.x,_lpPt.y); if(!target)return;
    _longPressed=true;
    target.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:_lpPt.x,clientY:_lpPt.y}));
  },520);
},{passive:true});
document.addEventListener('touchmove',e=>{ if(_lpTimer&&Math.abs(e.touches[0].clientX-(_lpPt?.x||0))+Math.abs(e.touches[0].clientY-(_lpPt?.y||0))>10){clearTimeout(_lpTimer);_lpTimer=null;} },{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(_lpTimer);_lpTimer=null;setTimeout(()=>_longPressed=false,320);},{passive:true});
document.addEventListener('click',e=>{ if(_longPressed){e.stopPropagation();e.preventDefault();_longPressed=false;} },true);

/* ==================================================================
   [30] 启动 —— 直接呈现系统，无任何开场假加载动画
   ================================================================== */
async function boot(){
  applyTheme();
  WALL.apply();                 // 壁纸立即上屏
  TASKBAR.render();             // 任务栏 / 开始按钮 / 托盘立即上屏
  TASKBAR.tick();
  setInterval(()=>TASKBAR.tick(),1000);
  // 文件系统在后台静默初始化，不阻塞界面
  try{ await fs.init(); }
  catch(e){ console.error('[Celadon] VFS 初始化失败',e); toast('文件系统初始化异常：'+e.message,'err'); }
  try{ await WALL.loadCustom(); WALL.apply(); }catch(e){}
  try{ await DESK.render(); }catch(e){ console.error(e); }
  try{ await MOUNT.checkPermissions(); }catch(e){}
  if(fs.backendMain!=='opfs')toast('当前环境不支持 OPFS，已自动降级为 '+fs.backendMain.toUpperCase()+' 存储','err');
  // 首次进入的轻提示（非加载动画）
  if(!LS.get('welcomed',false)){ LS.set('welcomed',true); setTimeout(()=>toast('拖入文件即可导入 · 右键桌面查看更多'),900); }
}
window.addEventListener('error',e=>{ console.error('[Celadon]',e.error||e.message); });
boot();

})();
</script>
