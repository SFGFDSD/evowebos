<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>殓波 · 榆渡第四转播站夜班终端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+QingKe+HuangYou&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#060807;--panel:#0e1211;--panel2:#161b19;--panel3:#1d2421;--line:#2b3430;--ink:#d9d2be;--dim:#8a897a;--acc:#c5381f;--acc2:#7fbf9a;--tal:#d2ad55;--r:3px;--tb:44px;--icon:84px;--fxo:.6;--shadow:0 18px 60px rgba(0,0,0,.75);--disp:'ZCOOL QingKe HuangYou','Noto Serif SC',serif;--body:'Noto Serif SC','Songti SC','SimSun',serif;--mono:'VT323','Courier New',monospace;--veil:#050606}
[data-theme=light]{--bg:#cfc6ad;--panel:#efe8d4;--panel2:#e5dcc4;--panel3:#d9cfb4;--line:#b0a585;--ink:#1c1915;--dim:#6a624f;--acc2:#2c6a4d;--tal:#8a6a1c;--shadow:0 14px 40px rgba(50,35,10,.4);--veil:#d9d0b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--panel)}::-webkit-scrollbar-thumb:hover{background:var(--acc)}::-webkit-scrollbar-corner{background:transparent}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
#wall{position:fixed;inset:0;z-index:0;background:#050706 center/cover no-repeat;transition:filter .6s}
#wall canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
#wall.w-corridor canvas{display:block}
#wall.w-static{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(90deg,#3a3a35 0 14.28%,#3b3a22 0 28.56%,#1f3a37 0 42.84%,#1f3a24 0 57.12%,#3a1f37 0 71.4%,#3a1c18 0 85.68%,#161a3a 0),#000;background-size:auto,100% 68%,auto;background-repeat:repeat,no-repeat;filter:saturate(.7) brightness(.55)}
#wall.w-well{background:radial-gradient(circle at 50% 46%,#000 0 6%,transparent 7%),repeating-radial-gradient(circle at 50% 46%,#120807 0 22px,#2a0d09 22px 24px,#0a0a09 24px 60px),#050505}
#wall.w-river{background:linear-gradient(180deg,#0a0f0e 0,#16211d 46%,#28362f 58%,#0b100e 59%,#060908 100%)}
#wall.w-river::after{content:"";position:absolute;left:62%;bottom:41%;width:2px;height:34vh;background:#050706;box-shadow:-14px 34vh 0 30px #050706,0 0 0 0 #000}
#wall.w-river::before{content:"";position:absolute;left:calc(62% - 3px);bottom:calc(41% + 34vh);width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 24px 6px var(--acc);animation:beacon 4.4s infinite}
[data-theme=light] #wall{filter:sepia(.5) brightness(1.5) contrast(.8)}
@keyframes beacon{0%,8%,100%{opacity:1}10%,60%{opacity:.08}62%{opacity:.9}64%{opacity:.1}}
#desk{position:fixed;left:0;right:0;top:0;bottom:var(--tb);z-index:1;overflow:hidden}
body.bar-top #desk{top:var(--tb);bottom:0}
#desk .stamp{position:absolute;right:26px;bottom:20px;font:400 13px/1.5 var(--mono);color:var(--dim);text-align:right;opacity:.75;pointer-events:none;letter-spacing:.08em}
#desk .stamp b{display:block;font:400 34px/1 var(--disp);color:var(--acc);letter-spacing:.2em;opacity:.85}
.dicon{position:absolute;width:var(--icon);height:calc(var(--icon) + 14px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border:1px solid transparent;border-radius:var(--r);cursor:pointer;transition:left .28s cubic-bezier(.2,.9,.25,1),top .28s cubic-bezier(.2,.9,.25,1),background .15s,opacity .2s;touch-action:none;animation:rise .5s both}
.dicon .gl{width:calc(var(--icon)*.52);height:calc(var(--icon)*.52);flex:none;position:relative;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.dicon .gl svg,.dicon .gl img{width:100%;height:100%;object-fit:cover}
.dicon .nm{font-size:12px;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;text-shadow:0 1px 3px #000,0 0 8px #000;color:#e6dfca}
.dicon:hover{background:rgba(197,56,31,.12);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.dicon.sel{background:color-mix(in srgb,var(--acc) 26%,transparent);border-color:var(--acc)}
.dicon.dragging,.fx-item.dragging{opacity:.35}
.drop-on{outline:1px dashed var(--tal)!important;outline-offset:-2px;background:color-mix(in srgb,var(--tal) 12%,transparent)!important}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.mq{position:absolute;pointer-events:none;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);z-index:50}
.gico{width:100%;height:100%}
/* windows */
#wins{position:fixed;left:0;right:0;top:0;bottom:var(--tb);z-index:10;pointer-events:none}
body.bar-top #wins{top:var(--tb);bottom:0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);pointer-events:auto;min-width:260px;min-height:160px;transition:opacity .18s,transform .18s,filter .2s}
.win.act{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.win.anim{transition:left .2s,top .2s,width .2s,height .2s,opacity .18s,transform .18s}
.win.opening{animation:winin .26s cubic-bezier(.2,.9,.2,1)}
@keyframes winin{from{opacity:0;transform:translateY(14px) scaleY(.92);filter:brightness(2.2)}}
.win.min{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none;visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s .18s}
.win.max{border-radius:0}
#wins.peek .win:not(.peeked){opacity:.06!important;visibility:visible;transform:none}
#wins.peek .win.peeked{opacity:1;visibility:visible;transform:none}
.win-tb{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 0;background:linear-gradient(180deg,var(--panel3),var(--panel2));border-bottom:1px dashed var(--line);border-radius:var(--r) var(--r) 0 0;touch-action:none;cursor:default;overflow:hidden}
.win-seal{width:34px;height:34px;display:grid;place-items:center;background:var(--acc);color:#120604;flex:none;font-size:15px}
.win:not(.act) .win-seal{background:var(--line);color:var(--dim)}
.win-ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 16px/1 var(--disp);letter-spacing:.12em}
.win-no{font:13px var(--mono);color:var(--dim);letter-spacing:.1em}
.win-ctl{display:flex;gap:3px}
.win-ctl button{width:30px;height:24px;border:1px solid var(--line);background:transparent;font:400 14px/1 var(--disp);cursor:pointer;border-radius:calc(var(--r)*.6);color:var(--dim);transition:.12s}
.win-ctl button:hover{color:var(--ink);border-color:var(--tal);background:color-mix(in srgb,var(--tal) 14%,transparent)}
.win-ctl button.x:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:0 0 var(--r) var(--r)}
.rz{position:absolute;z-index:5;touch-action:none}
.rz[data-d=n]{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}.rz[data-d=s]{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.rz[data-d=e]{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}.rz[data-d=w]{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.rz[data-d=ne]{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}.rz[data-d=sw]{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.rz[data-d=nw]{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}.rz[data-d=se]{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
.win.max .rz{display:none}
#snapghost{position:fixed;z-index:9;border:1px dashed var(--tal);background:color-mix(in srgb,var(--tal) 10%,transparent);pointer-events:none;opacity:0;transition:all .15s}
/* bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:9000;display:flex;align-items:stretch;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body.bar-top #bar{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
#startbtn{width:58px;border:0;background:var(--acc);color:#140705;font:400 20px/1 var(--disp);cursor:pointer;letter-spacing:.05em;flex:none;position:relative}
#startbtn:hover{filter:brightness(1.2)}
#tasks{flex:1;display:flex;gap:3px;padding:5px 6px;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:6px;padding:0 4px 0 9px;max-width:190px;min-width:44px;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);cursor:pointer;flex:none;position:relative;font-size:13px;animation:rise .25s}
.task span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.task.act{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel2))}
.task.isMin{opacity:.55;border-style:dashed}
.task .x{width:20px;height:20px;border:0;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center;border-radius:var(--r);flex:none;font-size:13px}
.task .x:hover{background:var(--acc);color:#fff}
#tray{display:flex;align-items:center;gap:2px;padding:0 6px;flex:none}
#tray button{border:0;background:transparent;height:100%;padding:0 8px;cursor:pointer;color:var(--dim)}
#tray button:hover{color:var(--ink);background:var(--panel3)}
#clock{font:400 17px/1.05 var(--mono);text-align:right;letter-spacing:.04em;color:var(--ink)!important}
#clock small{display:block;font:11px var(--body);color:var(--dim)}
#peekbtn{width:10px;border-left:1px solid var(--line);cursor:pointer;flex:none}#peekbtn:hover{background:var(--acc)}
/* popups */
.pop{position:fixed;z-index:9100;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:none;animation:winin .2s}
.pop.on{display:block}
#start{left:6px;bottom:calc(var(--tb) + 6px);width:min(420px,calc(100vw - 12px));max-height:calc(100vh - var(--tb) - 20px);overflow:auto;padding:14px}
body.bar-top #start,body.bar-top #cal{bottom:auto;top:calc(var(--tb) + 6px)}
#start h2{margin:0 0 2px;font:400 26px var(--disp);letter-spacing:.3em;color:var(--acc)}
#start p{margin:0 0 10px;color:var(--dim);font-size:12px}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:10px 0}
.st-app{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid transparent;border-radius:var(--r);cursor:pointer;text-align:center;background:none}
.st-app:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.st-app .gl{width:38px;height:38px}.st-app b{font:400 16px var(--disp);letter-spacing:.15em}.st-app small{font-size:11px;color:var(--dim)}
#cal{right:6px;bottom:calc(var(--tb) + 6px);width:300px;padding:12px}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}.cal-h b{flex:1;font:400 20px var(--disp);letter-spacing:.15em}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font:16px var(--mono)}
.cal-g i{font:normal 11px var(--body);color:var(--dim);padding:3px 0}
.cal-g span{padding:5px 0;border:1px solid transparent;border-radius:var(--r)}.cal-g span.o{color:var(--dim);opacity:.4}.cal-g span.t{background:var(--acc);color:#fff}
.cal-f{margin-top:8px;font-size:12px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
#ctx{z-index:9500;min-width:200px;padding:4px;max-height:90vh;overflow:auto}
.mi{display:flex;align-items:center;gap:9px;padding:6px 10px;cursor:pointer;border-radius:calc(var(--r)*.6);white-space:nowrap;font-size:13.5px}
.mi:hover{background:var(--acc);color:#fff}.mi small{margin-left:auto;padding-left:18px;color:var(--dim);font-size:11.5px}.mi:hover small{color:#fff}
.mi.dis{opacity:.35;pointer-events:none}.sep{height:1px;background:var(--line);margin:4px 6px}
#toasts{position:fixed;right:10px;bottom:calc(var(--tb) + 10px);z-index:9600;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:min(380px,calc(100vw - 20px))}
body.bar-top #toasts{bottom:10px}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--tal);padding:9px 12px;border-radius:var(--r);box-shadow:var(--shadow);font-size:13px;animation:tin .3s;display:flex;gap:10px;align-items:center;user-select:text}
.toast.err{border-left-color:var(--acc)}.toast.ok{border-left-color:var(--acc2)}
.toast em{font:normal 12px var(--mono);color:var(--dim);display:block;letter-spacing:.1em}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.dlg-mask{position:fixed;inset:0;z-index:9400;background:rgba(0,0,0,.55);display:grid;place-items:center;animation:fade .2s;padding:12px}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:var(--r);box-shadow:var(--shadow);width:min(460px,100%);max-height:90vh;display:flex;flex-direction:column;animation:winin .22s}
.dlg h3{margin:0;padding:12px 16px 4px;font:400 20px var(--disp);letter-spacing:.18em}
.dlg-b{padding:8px 16px;overflow:auto;user-select:text}.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--tal);background:var(--panel3)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.15)}
.btn.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.inp{background:var(--bg);border:1px solid var(--line);padding:6px 9px;border-radius:var(--r);outline:0;min-width:0;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--acc)}
select.inp{padding:5px 6px}
.tbar{display:flex;align-items:center;gap:4px;padding:5px 6px;border-bottom:1px solid var(--line);background:var(--panel2);flex:none;overflow-x:auto;scrollbar-width:thin}
.tbar.wrap{flex-wrap:wrap;overflow:visible}
.tb{border:1px solid transparent;background:transparent;padding:4px 8px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px;flex:none}
.tb:hover{border-color:var(--line);background:var(--panel3)}.tb.on{border-color:var(--acc);color:var(--acc)}.tb:disabled{opacity:.35;pointer-events:none}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:2px 3px;flex:none}
.grow{flex:1;min-width:0}
.ldr{display:inline-block;width:26px;height:26px;border:2px dashed var(--acc);border-radius:50%;animation:spin 1.6s linear infinite;position:relative}
.ldr::after{content:"";position:absolute;inset:6px;background:var(--tal);clip-path:polygon(50% 0,100% 100%,0 100%);animation:beacon 1.2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.veil{position:absolute;inset:0;background:var(--veil);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:4;color:var(--dim);font:16px var(--mono);letter-spacing:.2em;transition:opacity .3s}
.veil.off{opacity:0;pointer-events:none}
/* explorer */
.fx-b{flex:1;min-height:0;display:flex;position:relative}
.fx-side{width:190px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:6px 4px;background:var(--panel);font-size:13px}
.fx-side h5{margin:8px 6px 3px;font:400 12px var(--mono);color:var(--dim);letter-spacing:.2em}
.tn{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:var(--r);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn:hover{background:var(--panel3)}.tn.cur{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--ink)}
.tn i{width:14px;text-align:center;font-style:normal;color:var(--dim);flex:none;font-size:10px}
.fx-main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.fx-crumb{display:flex;align-items:center;flex:1;min-width:120px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);overflow-x:auto;scrollbar-width:none;padding:0 4px;cursor:text}
.fx-crumb a{padding:2px 6px;cursor:pointer;white-space:nowrap;border-radius:var(--r)}.fx-crumb a:hover{background:var(--acc);color:#fff}.fx-crumb s{color:var(--dim);text-decoration:none;font-size:11px}
.fx-list{flex:1;min-height:0;overflow:auto;position:relative;background:var(--panel);overscroll-behavior:contain}
.fx-head{display:flex;position:sticky;top:0;z-index:3;background:var(--panel2);border-bottom:1px solid var(--line);min-width:100%;width:max-content;font-size:12.5px;color:var(--dim)}
.fx-hc{position:relative;padding:5px 10px;flex:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.fx-hc:hover{color:var(--ink)}.fx-hc u{text-decoration:none;color:var(--acc);margin-left:4px}
.rzc{position:absolute;right:-5px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:2;touch-action:none}
.fx-row{display:flex;width:var(--rw);height:30px;align-items:center;border-bottom:1px solid transparent;cursor:pointer;font-size:13.5px}
.fx-row:hover{background:var(--panel3)}.fx-item.sel{background:color-mix(in srgb,var(--acc) 26%,transparent)!important;outline:1px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:-1px}
.fx-item.cutting{opacity:.45}
.fx-c{flex:none;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.fx-c.nm{color:var(--ink);display:flex;align-items:center;gap:7px}.fx-c.nm .gi{width:20px;height:20px;flex:none;touch-action:none}.fx-c.nm span{overflow:hidden;text-overflow:ellipsis}
.fx-c.nm small{color:var(--dim);margin-left:6px;font-size:11px}
.ck{width:14px;height:14px;border:1px solid var(--line);flex:none;border-radius:2px;opacity:0;display:grid;place-items:center;font-size:10px;color:#fff}
.fx-item:hover .ck,.fx-item.sel .ck,.multi .ck{opacity:1}.fx-item.sel .ck{background:var(--acc);border-color:var(--acc)}.fx-item.sel .ck::after{content:"";width:6px;height:6px;background:#fff}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:10px;align-content:start;min-height:100%}
.fx-tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:var(--r);cursor:pointer;position:relative;text-align:center;font-size:12.5px;height:128px}
.fx-tile:hover{background:var(--panel3)}.fx-tile .gi{width:64px;height:64px;flex:none;touch-action:none}.fx-tile .gi img{width:100%;height:100%;object-fit:cover;border:1px solid var(--line);background:#000}
.fx-tile span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;line-height:1.25}
.fx-tile .ck{position:absolute;left:5px;top:5px}
.fx-cols{display:flex;min-height:100%;height:100%;width:max-content;min-width:100%}
.fx-col{width:220px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:4px}
.fx-col .fx-ci{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--r);cursor:pointer;white-space:nowrap;overflow:hidden;font-size:13px}
.fx-col .fx-ci .gi{width:18px;height:18px;flex:none;touch-action:none}.fx-col .fx-ci span{overflow:hidden;text-overflow:ellipsis;flex:1}
.fx-col .fx-ci:hover{background:var(--panel3)}.fx-col .fx-ci.onpath{background:color-mix(in srgb,var(--tal) 20%,transparent)}
