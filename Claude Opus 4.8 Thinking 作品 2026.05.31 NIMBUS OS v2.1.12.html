<!DOCTYPE html>
<html lang="zh" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NIMBUS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<style>
:root{
  --bg-deep:#1a1326;
  --bg-mid:#241a36;
  --ink:#f4ece2;
  --ink-soft:#c9bcb0;
  --ink-dim:#8c8194;
  --amber:#f0a868;
  --coral:#e8836b;
  --teal:#5fb3a9;
  --plum:#9d6ba8;
  --glass:rgba(36,26,54,0.72);
  --glass-2:rgba(46,34,68,0.85);
  --line:rgba(240,168,104,0.16);
  --line-soft:rgba(244,236,226,0.08);
  --shadow:0 24px 60px -16px rgba(0,0,0,0.6),0 2px 8px rgba(0,0,0,0.35);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  font-family:'Sora',system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg-deep);
  user-select:none;
  position:relative;
}
.font-display{font-family:'Fraunces',serif;}
.font-mono{font-family:'JetBrains Mono',monospace;}
.font-grotesk{font-family:'Space Grotesk',sans-serif;}

/* ===== Desktop ===== */
#desktop{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:background-image .6s ease;
  overflow:hidden;
}
#desktop::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% -10%, rgba(240,168,104,0.10), transparent 60%),
             linear-gradient(180deg, rgba(20,14,30,0.15), rgba(20,14,30,0.45));
  pointer-events:none;
}
#icon-layer{position:absolute;inset:0;z-index:1;}

.desk-icon{
  position:absolute;width:96px;padding:8px 6px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:default;text-align:center;transition:background .15s, transform .12s, box-shadow .15s;
  touch-action:none;
}
.desk-icon:hover{background:rgba(244,236,226,0.07);}
.desk-icon.selected{background:rgba(240,168,104,0.20);box-shadow:inset 0 0 0 1px var(--line);}
.desk-icon .ic{width:52px;height:52px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));pointer-events:none;}
.desk-icon .nm{font-size:12px;line-height:1.25;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.7);word-break:break-word;max-width:100%;pointer-events:none;}
.desk-icon.dragging{opacity:.5;}

/* ===== Selection box ===== */
#sel-box{position:absolute;border:1px solid var(--amber);background:rgba(240,168,104,0.12);z-index:50;pointer-events:none;display:none;border-radius:4px;}

/* ===== Windows ===== */
.window{
  position:absolute;min-width:260px;min-height:160px;
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  animation:winpop .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes winpop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.window.closing{animation:winclose .16s ease forwards;}
@keyframes winclose{to{transform:scale(.92);opacity:0}}
.window.minimized{display:none;}
.win-title{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;
  background:linear-gradient(180deg, rgba(240,168,104,0.10), rgba(240,168,104,0.02));
  border-bottom:1px solid var(--line-soft);cursor:grab;
}
.win-title .wt-name{font-family:'Space Grotesk';font-size:13px;font-weight:600;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
.win-title .wt-ic{width:18px;height:18px;flex:0 0 18px;opacity:.9;}
.win-btns{display:flex;gap:8px;align-items:center;}
.win-btn{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(244,236,226,0.06);transition:.15s;color:var(--ink-soft);}
.win-btn:hover{background:rgba(244,236,226,0.18);color:var(--ink);}
.win-btn.close:hover{background:var(--coral);color:#fff;}
.win-body{flex:1;overflow:auto;position:relative;}
.resize-handle{position:absolute;z-index:5;}
.rh-e{right:0;top:0;width:7px;height:100%;cursor:ew-resize;}
.rh-s{bottom:0;left:0;height:7px;width:100%;cursor:ns-resize;}
.rh-se{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;}
.rh-w{left:0;top:0;width:7px;height:100%;cursor:ew-resize;}
.rh-n{top:0;left:0;height:7px;width:100%;cursor:ns-resize;}

/* ===== Taskbar / Dock ===== */
#taskbar{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:9000;
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--glass-2);backdrop-filter:blur(24px) saturate(150%);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  max-width:calc(100vw - 24px);
}
.tb-launch{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(140deg,var(--amber),var(--coral));box-shadow:0 6px 16px -4px rgba(232,131,107,.5);transition:.18s;flex:0 0 auto;}
.tb-launch:hover{transform:translateY(-3px) scale(1.04);}
.tb-sep{width:1px;height:28px;background:var(--line-soft);flex:0 0 auto;}
.tb-apps{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;}
.tb-apps::-webkit-scrollbar{display:none;}
.tb-app{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.16s;flex:0 0 auto;background:rgba(244,236,226,0.05);}
.tb-app:hover{background:rgba(244,236,226,0.14);transform:translateY(-2px);}
.tb-app.active::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--amber);}
.tb-clock{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.2;padding:0 8px;flex:0 0 auto;cursor:default;}

/* ===== Start menu ===== */
#start-menu{
  position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(12px);z-index:9100;
  width:min(640px,calc(100vw - 24px));max-height:70vh;
  background:var(--glass-2);backdrop-filter:blur(28px) saturate(150%);
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  padding:20px;opacity:0;pointer-events:none;transition:.24s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;
}
#start-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.sm-search{display:flex;align-items:center;gap:10px;background:rgba(20,14,30,0.5);border:1px solid var(--line-soft);border-radius:14px;padding:10px 14px;margin-bottom:16px;}
.sm-search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:'Sora';font-size:14px;}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;overflow:auto;}
.sm-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;cursor:pointer;transition:.14s;}
.sm-item:hover{background:rgba(240,168,104,0.14);transform:translateY(-2px);}
.sm-item .ic{width:40px;height:40px;}
.sm-item .nm{font-size:11.5px;color:var(--ink-soft);text-align:center;}

/* ===== Context menu ===== */
.ctx-menu{position:absolute;z-index:9500;min-width:208px;background:var(--glass-2);backdrop-filter:blur(24px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;animation:ctxpop .12s ease;}
@keyframes ctxpop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink-soft);transition:.1s;}
.ctx-item:hover{background:rgba(240,168,104,0.16);color:var(--ink);}
.ctx-item .ic{width:16px;height:16px;flex:0 0 16px;opacity:.85;}
.ctx-sep{height:1px;background:var(--line-soft);margin:5px 8px;}

/* ===== generic UI ===== */
.btn{font-family:'Space Grotesk';font-size:13px;font-weight:500;padding:8px 14px;border-radius:11px;cursor:pointer;border:1px solid var(--line-soft);background:rgba(244,236,226,0.06);color:var(--ink);transition:.14s;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{background:rgba(240,168,104,0.16);border-color:var(--line);}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--coral));border:none;color:#2a1a14;font-weight:600;}
.btn.primary:hover{filter:brightness(1.08);}
input.fld,textarea.fld{background:rgba(20,14,30,0.45);border:1px solid var(--line-soft);border-radius:9px;color:var(--ink);padding:8px 11px;font-family:'Sora';font-size:13px;outline:none;}
input.fld:focus,textarea.fld:focus{border-color:var(--amber);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(240,168,104,0.25);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(240,168,104,0.45);background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}

/* File explorer */
.fe-row{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:8px;align-items:center;padding:7px 12px;border-radius:8px;cursor:default;font-size:12.5px;color:var(--ink-soft);}
.fe-row:hover{background:rgba(244,236,226,0.06);}
.fe-row.selected{background:rgba(240,168,104,0.18);color:var(--ink);}
.fe-row .nm{display:flex;align-items:center;gap:9px;overflow:hidden;}
.fe-row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fe-head{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:8px;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--glass);z-index:2;}
.fe-head span{cursor:pointer;display:flex;align-items:center;gap:4px;}
.fe-head span:hover{color:var(--amber);}
.fe-side-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink-soft);transition:.12s;}
.fe-side-item:hover{background:rgba(244,236,226,0.07);color:var(--ink);}
.fe-side-item.active{background:rgba(240,168,104,0.16);color:var(--ink);}
.crumb{cursor:pointer;color:var(--ink-soft);font-size:12.5px;padding:3px 7px;border-radius:7px;}
.crumb:hover{background:rgba(244,236,226,0.08);color:var(--ink);}

.calc-btn{display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-size:19px;border-radius:14px;cursor:pointer;background:rgba(244,236,226,0.06);transition:.1s;user-select:none;}
.calc-btn:hover{background:rgba(244,236,226,0.16);}
.calc-btn:active{transform:scale(.95);}
.calc-btn.op{background:rgba(240,168,104,0.2);color:var(--amber);}
.calc-btn.eq{background:linear-gradient(135deg,var(--amber),var(--coral));color:#2a1a14;}

.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9999;
  background:var(--glass-2);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:12px;
  padding:11px 18px;font-size:13px;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:.3s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* boot */
#boot{position:absolute;inset:0;z-index:99999;background:var(--bg-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s;}
#boot .logo{width:90px;height:90px;animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-bar{width:200px;height:3px;background:rgba(244,236,226,0.1);border-radius:3px;overflow:hidden;}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--coral));animation:fill 2s ease forwards;}
@keyframes fill{to{width:100%}}

@media (max-width:760px){
  .desk-icon{width:78px;}
  .fe-row,.fe-head{grid-template-columns:1fr 70px;}
  .fe-row .ty,.fe-row .dt,.fe-head .ty,.fe-head .dt{display:none;}
  #start-menu{bottom:90px;}
  #taskbar{bottom:10px;width:calc(100vw - 16px);justify-content:flex-start;}
}
.modal-bg{position:absolute;inset:0;z-index:9600;background:rgba(10,7,16,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;}
.modal{background:var(--glass-2);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;width:min(420px,calc(100vw - 32px));}
.hidden{display:none!important;}
</style>
</head>
<body>

<div id="boot">
  <svg class="logo" viewBox="0 0 100 100" fill="none">
    <circle cx="50" cy="50" r="42" stroke="url(#bg1)" stroke-width="3" stroke-dasharray="18 10"/>
    <circle cx="50" cy="50" r="26" stroke="var(--amber)" stroke-width="3" stroke-dasharray="40 14"/>
    <circle cx="50" cy="50" r="6" fill="var(--coral)"/>
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0a868"/><stop offset="1" stop-color="#9d6ba8"/></linearGradient></defs>
  </svg>
  <div class="font-display" style="font-size:30px;letter-spacing:2px;color:var(--ink);">NIMBUS<span style="color:var(--amber)">OS</span></div>
  <div class="boot-bar"><i></i></div>
  <div id="boot-msg" class="font-mono" style="font-size:11px;color:var(--ink-dim)">挂载文件系统…</div>
</div>

<div id="desktop">
  <div id="icon-layer"></div>
  <div id="sel-box"></div>
</div>

<div id="windows"></div>

<div id="start-menu">
  <div class="sm-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-dim)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="sm-search-input" placeholder="搜索应用…">
  </div>
  <div class="sm-grid" id="sm-grid"></div>
</div>

<div id="taskbar">
  <div class="tb-launch" id="tb-launch" title="开始">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a1a14" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-apps" id="tb-apps"></div>
  <div class="tb-sep"></div>
  <div class="tb-clock" id="tb-clock">--:--</div>
</div>

<div id="ctx-root"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   NIMBUS OS  —  single-file web desktop
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const isTouch = ('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ---------- toast ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ============================================================
   FS MODULE — OPFS backed, with mountable FSA backends
   Unified path-based API.  Mounts under /mnt/local/<name>
   ============================================================ */
const FS = (()=>{
  let root=null;
  const mounts={}; // name -> FileSystemDirectoryHandle
  let backend='opfs';

  async function init(){
    try{
      root = await navigator.storage.getDirectory();
      backend='opfs';
    }catch(e){
      console.warn('OPFS unavailable, using IndexedDB fallback',e);
      backend='idb';
      await IDB.init();
    }
  }
  function norm(p){
    p=p.replace(/\\/g,'/');
    const parts=[];
    for(const seg of p.split('/')){ if(!seg||seg==='.')continue; if(seg==='..'){parts.pop();continue;} parts.push(seg);}
    return '/'+parts.join('/');
  }
  function parts(p){return norm(p).split('/').filter(Boolean);}

  // detect mount
  function mountFor(p){
    const pa=parts(p);
    if(pa[0]==='mnt'&&pa[1]==='local'&&pa[2]&&mounts[pa[2]]){
      return {name:pa[2], handle:mounts[pa[2]], rest:pa.slice(3)};
    }
    return null;
  }

  /* ---- OPFS handle resolution ---- */
  async function getDir(p,{create=false}={}){
    if(backend==='idb')return null;
    const m=mountFor(p);
    if(m){ let h=m.handle; for(const seg of m.rest){ h=await h.getDirectoryHandle(seg,{create}); } return h; }
    let h=root;
    for(const seg of parts(p)){ h=await h.getDirectoryHandle(seg,{create}); }
    return h;
  }
  async function getFile(p,{create=false}={}){
    const pa=parts(p); const name=pa[pa.length-1]; const dir='/'+pa.slice(0,-1).join('/');
    const dh=await getDir(dir,{create});
    return dh.getFileHandle(name,{create});
  }

  async function exists(p){
    p=norm(p); if(p==='/')return true;
    if(backend==='idb')return IDB.exists(p);
    try{ await stat(p); return true;}catch(e){return false;}
  }
  async function stat(p){
    p=norm(p);
    if(backend==='idb')return IDB.stat(p);
    if(p==='/')return {name:'/',isDir:true,size:0,mtime:0,kind:'directory'};
    const pa=parts(p); const name=pa[pa.length-1]; const dir='/'+pa.slice(0,-1).join('/');
    const dh=await getDir(dir);
    // try dir
    try{ await dh.getDirectoryHandle(name); return {name,isDir:true,size:0,mtime:0,kind:'directory'}; }catch(e){}
    const fh=await dh.getFileHandle(name); const f=await fh.getFile();
    return {name,isDir:false,size:f.size,mtime:f.lastModified,kind:'file',type:f.type};
  }
  async function readdir(p){
    p=norm(p);
    if(backend==='idb')return IDB.readdir(p);
    const out=[];
    // synthetic root listing for mounts at /mnt/local
    const dh=await getDir(p);
    for await(const [name,handle] of dh.entries()){
      let entry={name,isDir:handle.kind==='directory'};
      if(!entry.isDir){ try{const f=await handle.getFile();entry.size=f.size;entry.mtime=f.lastModified;entry.type=f.type;}catch(e){entry.size=0;entry.mtime=0;} }
      else {entry.size=0;entry.mtime=0;}
      out.push(entry);
    }
    return out;
  }
  async function mkdir(p){
    p=norm(p);
    if(backend==='idb')return IDB.mkdir(p);
    await getDir(p,{create:true});
  }
  async function readFile(p){ // returns Blob
    p=norm(p);
    if(backend==='idb')return IDB.readFile(p);
    const fh=await getFile(p); const f=await fh.getFile(); return f;
  }
  async function readText(p){ const b=await readFile(p); return await b.text(); }
  async function writeFile(p,data){ // data: Blob|ArrayBuffer|string
    p=norm(p);
    if(backend==='idb')return IDB.writeFile(p,data);
    const fh=await getFile(p,{create:true});
    const w=await fh.createWritable();
    await w.write(data); await w.close();
  }
  async function writeText(p,t){ return writeFile(p,new Blob([t],{type:'text/plain'})); }
  async function unlink(p){
    p=norm(p);
    if(backend==='idb')return IDB.unlink(p);
    const pa=parts(p); const name=pa[pa.length-1]; const dir='/'+pa.slice(0,-1).join('/');
    const dh=await getDir(dir);
    await dh.removeEntry(name,{recursive:true});
  }
  async function copy(src,dst){
    const s=await stat(src);
    if(s.isDir){
      await mkdir(dst);
      for(const e of await readdir(src)){ await copy(src+'/'+e.name, dst+'/'+e.name); }
    }else{
      const b=await readFile(src); await writeFile(dst,b);
    }
  }
  async function rename(src,dst){ await copy(src,dst); await unlink(src); }

  async function usage(){
    try{ const est=await navigator.storage.estimate(); return {used:est.usage||0, quota:est.quota||0}; }
    catch(e){ return {used:0,quota:0}; }
  }
  async function resetAll(){
    if(backend==='idb'){await IDB.reset();return;}
    for await(const [name] of root.entries()){ await root.removeEntry(name,{recursive:true}); }
  }

  async function mount(name,handle){ mounts[name]=handle; if(!await exists('/mnt'))await mkdir('/mnt'); if(!await exists('/mnt/local'))await mkdir('/mnt/local'); }
  function unmount(name){ delete mounts[name]; }
  function listMounts(){ return Object.keys(mounts); }

  return {init,norm,parts,exists,stat,readdir,mkdir,readFile,readText,writeFile,writeText,unlink,copy,rename,usage,resetAll,mount,unmount,listMounts,get backend(){return backend;}};
})();

/* ---- IndexedDB fallback backend ---- */
const IDB=(()=>{
  let db=null;
  function init(){return new Promise((res,rej)=>{const r=indexedDB.open('nimbus-vfs',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files');};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=()=>rej(r.error);});}
  function tx(mode){return db.transaction('files',mode).objectStore('files');}
  function get(k){return new Promise((res,rej)=>{const r=tx('readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  function put(k,v){return new Promise((res,rej)=>{const r=tx('readwrite').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
  function del(k){return new Promise((res,rej)=>{const r=tx('readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
  function keys(){return new Promise((res,rej)=>{const r=tx('readonly').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  async function exists(p){if(p==='/')return true;const m=await get('D:'+p);if(m)return true;const f=await get('F:'+p);return !!f;}
  async function stat(p){if(p==='/')return{name:'/',isDir:true,size:0,mtime:0};const d=await get('D:'+p);if(d)return{name:p.split('/').pop(),isDir:true,size:0,mtime:d.mtime||0};const f=await get('F:'+p);if(!f)throw new Error('ENOENT '+p);return{name:p.split('/').pop(),isDir:false,size:f.data.size||f.data.byteLength||0,mtime:f.mtime||0,type:f.type||''};}
  async function readdir(p){const all=await keys();const set=new Map();const base=p==='/'?'/':p+'/';for(const k of all){const isD=k.startsWith('D:');const isF=k.startsWith('F:');if(!isD&&!isF)continue;const path=k.slice(2);if(!path.startsWith(base))continue;const rest=path.slice(base.length);if(!rest||rest.includes('/'))continue;const meta=await get(k);set.set(rest,{name:rest,isDir:isD,size:isF?(meta.data.size||0):0,mtime:meta.mtime||0,type:isF?meta.type:''});}return[...set.values()];}
  async function mkdir(p){await put('D:'+p,{mtime:Date.now()});}
  async function readFile(p){const f=await get('F:'+p);if(!f)throw new Error('ENOENT '+p);return f.data instanceof Blob?f.data:new Blob([f.data],{type:f.type||''});}
  async function writeFile(p,data){let blob=data instanceof Blob?data:new Blob([data]);await put('F:'+p,{data:blob,type:blob.type,mtime:Date.now()});}
  async function unlink(p){const all=await keys();for(const k of all){const path=k.slice(2);if(path===p||path.startsWith(p+'/'))await del(k);}}
  async function reset(){const all=await keys();for(const k of all)await del(k);}
  return{init,exists,stat,readdir,mkdir,readFile,writeFile,unlink,reset};
})();

function ext(name){const m=name.toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:'';}
function ftype(name){const e=ext(name);for(const k in EXT){if(EXT[k].includes(e))return k;}return e?'file':'file';}
function mimeFor(name){const e=ext(name);const map={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',bmp:'image/bmp',ico:'image/x-icon',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',aac:'audio/aac',mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',pdf:'application/pdf',html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',json:'application/json',txt:'text/plain',csv:'text/csv',svg2:'image/svg+xml'};return map[e]||'application/octet-stream';}
function fmtSize(b){if(!b)return '—';const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<u.length-1){b/=1024;i++;}return b.toFixed(b<10&&i>0?1:0)+u[i];}

        };return mv;};
      h.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();const mv=begin(e.clientX,e.clientY);const m=ev=>mv(ev.clientX,ev.clientY);const u=()=>{document.removeEventListener('mousemove',m);document.removeEventListener('mouseup',u);};document.addEventListener('mousemove',m);document.addEventListener('mouseup',u);});
      h.addEventListener('touchstart',e=>{e.stopPropagation();const t=e.touches[0];const mv=begin(t.clientX,t.clientY);const m=ev=>{mv(ev.touches[0].clientX,ev.touches[0].clientY);};const u=()=>{document.removeEventListener('touchmove',m);document.removeEventListener('touchend',u);};document.addEventListener('touchmove',m,{passive:true});document.addEventListener('touchend',u);},{passive:true});
    }
  }
  function close(id){const w=wins.get(id);if(!w)return;if(w.onClose)try{w.onClose();}catch(e){}w.el.classList.add('closing');setTimeout(()=>w.el.remove(),160);wins.delete(id);const ta=$(`.tb-app[data-win="${id}"]`);if(ta)ta.remove();}
  function minimize(id){const w=wins.get(id);if(!w)return;w.el.classList.add('minimized');w.min=true;}
  function restore(id){const w=wins.get(id);if(!w)return;w.el.classList.remove('minimized');w.min=false;focus(id);}
  function toggleMax(id){const w=wins.get(id);if(!w)return;if(w.max){const p=w.prev;w.el.style.cssText=`left:${p.l}px;top:${p.t}px;width:${p.w}px;height:${p.h}px;z-index:${w.el.style.zIndex};`;w.max=false;}else{const r=w.el.getBoundingClientRect();w.prev={l:r.left,t:r.top,w:r.width,h:r.height};w.el.style.left='6px';w.el.style.top='6px';w.el.style.width=(window.innerWidth-12)+'px';w.el.style.height=(window.innerHeight-72)+'px';w.max=true;}}
  function addTaskApp(rec){
    const ta=document.createElement('div');ta.className='tb-app active';ta.dataset.win=rec.id;ta.title=rec.title;
    ta.innerHTML=`<div style="width:24px;height:24px">${rec.appId&&APPS[rec.appId]?APPS[rec.appId].icon:ICONS.file}</div>`;
    ta.onclick=()=>{const w=wins.get(rec.id);if(!w)return;if(w.min)restore(rec.id);else if(w.el.style.zIndex==z)minimize(rec.id);else focus(rec.id);};
    $('#tb-apps').appendChild(ta);
  }
  function setTitle(id,t){const w=wins.get(id);if(w){$('.wt-name',w.el).textContent=t;const ta=$(`.tb-app[data-win="${id}"]`);if(ta)ta.title=t;w.title=t;}}
  return {create,close,minimize,restore,focus,toggleMax,setTitle};
})();

const APPS={
  files:{name:'文件管理器',icon:ICONS.files,open:(p)=>openFiles(p)},
  notepad:{name:'记事本',icon:ICONS.notepad,open:(p)=>openNotepad(p)},

  browser:{name:'浏览器',icon:ICONS.browser,open:(u)=>openBrowser(u)},

  paint:{name:'画板',icon:ICONS.paint,open:()=>openPaint()},

  vm:{name:'虚拟机',icon:ICONS.vm,open:()=>openVM()},

/* open a path: stat then dispatch */
async function openPath(path){
  try{
    const s=await FS.stat(path);
    if(s.isDir){ openFiles(path); return; }
    const t=ftype(path);
    if(t==='img')return openImage(path);
    if(t==='audio'||t==='video')return openMedia(path,t);
    if(t==='pdf')return openPDF(path);
    if(t==='zip')return promptUnzip(path);
    if(ext(path)==='html'||ext(path)==='htm')return openCode(path);
    if(t==='table')return openTable(path);
    if(t==='code'||t==='text')return openNotepad(path);
    // unknown -> open as text
    return openNotepad(path);
  }catch(e){toast('无法打开: '+e.message);}
}

function si2(svg){return `<div style="width:15px;height:15px">${svg}</div>`;}

/* ---- drag preload cache for dragging out ---- */
const dragCache=new Map();let dragUrls=[];
async function preloadDrag(path,entry){if(entry.isDir||dragCache.has(path))return;try{const blob=await FS.readFile(path);dragCache.set(path,blob);}catch(e){}}
function dragStartFile(ev,path,entry){
  ev.dataTransfer.effectAllowed='all';
  ev.dataTransfer.setData('app/move',path);
  if(!entry.isDir){
    const blob=dragCache.get(path);
    if(blob){
      const name=path.split('/').pop();const mime=blob.type||mimeFor(name);
      const file=new File([blob],name,{type:mime});
      try{ev.dataTransfer.items.add(file);}catch(e){}
      const url=URL.createObjectURL(file);dragUrls.push(url);
      ev.dataTransfer.setData('DownloadURL',`${mime}:${name}:${url}`);
    }
  }
}
function cleanupDrag(){const urls=dragUrls.slice();dragUrls=[];setTimeout(()=>urls.forEach(u=>URL.revokeObjectURL(u)),6000);}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
async function importFiles(destDir){
  return new Promise(res=>{
    const inp=document.createElement('input');inp.type='file';inp.multiple=true;
    inp.onchange=async()=>{for(const f of inp.files){await FS.writeFile(FS.norm(destDir+'/'+f.name),f);}toast('已导入 '+inp.files.length+' 个文件');res();};
    inp.click();
  });
}
async function importDataTransfer(dt,destDir){
  const items=dt.items?[...dt.items]:[];
  let count=0;
  if(items.length&&items[0].webkitGetAsEntry){
    const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
    for(const en of entries){count+=await walkEntry(en,destDir);}
  }else{
    for(const f of dt.files){await FS.writeFile(FS.norm(destDir+'/'+f.name),f);count++;}
  }
  toast('已导入 '+count+' 项');
}
async function walkEntry(entry,destDir){
  let n=0;
  if(entry.isFile){
    const file=await new Promise((res,rej)=>entry.file(res,rej));
    await FS.writeFile(FS.norm(destDir+'/'+entry.name),file);n++;
  }else if(entry.isDirectory){
    const sub=FS.norm(destDir+'/'+entry.name);await FS.mkdir(sub);
    const reader=entry.createReader();
    let all=[];
    while(true){const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));if(!batch.length)break;all=all.concat(batch);}
    for(const e of all)n+=await walkEntry(e,sub);
  }
  return n;
}
async function exportFile(path,entry){
  try{
    if(entry.isDir){
      // zip the folder
      const zip=new JSZip();await addDirToZip(zip,path,'');
      const blob=await zip.generateAsync({type:'blob'});downloadBlob(blob,entry.name+'.zip');
    }else{
      const blob=await FS.readFile(path);downloadBlob(blob,entry.name);
    }
  }catch(e){toast('导出失败:'+e.message);}
}
async function addDirToZip(zip,path,prefix){
  for(const e of await FS.readdir(path)){
    const full=path+'/'+e.name;const zp=prefix?prefix+'/'+e.name:e.name;
    if(e.isDir){await addDirToZip(zip,full,zp);}else{const b=await FS.readFile(full);zip.file(zp,b);}
  }
}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);}

/* ============================================================
   ZIP support
   ============================================================ */
function promptUnzip(path){
  const dir='/'+FS.parts(path).slice(0,-1).join('/');
  confirmDialog('解压','解压 “'+path.split('/').pop()+'” 到当前目录？').then(ok=>{if(ok)unzipFile(path,dir||'/');});
}
async function unzipFile(path,destDir){
  try{
    if(!window.JSZip){toast('解压库未加载');return;}
    toast('正在解压…');
    const blob=await FS.readFile(path);const zip=await JSZip.loadAsync(blob);
    const base=destDir+'/'+path.split('/').pop().replace(/\.zip$/i,'');
    await FS.mkdir(base);
    const files=Object.values(zip.files);
    for(const f of files){
      const target=FS.norm(base+'/'+f.name);
      if(f.dir){await FS.mkdir(target);}
      else{const dir='/'+FS.parts(target).slice(0,-1).join('/');await FS.mkdir(dir);const content=await f.async('blob');await FS.writeFile(target,content);}
    }
    toast('解压完成 ('+files.length+' 项)');
  }catch(e){toast('解压失败:'+e.message);}
}

/* ============================================================
   FILE SYSTEM ACCESS — mount local folder
   ============================================================ */
async function mountLocalFolder(){
  if(!window.showDirectoryPicker){toast('浏览器不支持挂载本地文件夹');return;}
  try{
    const handle=await window.showDirectoryPicker();
    await handle.requestPermission?.({mode:'readwrite'});
    await FS.mount(handle.name,handle);
    toast('已挂载: '+handle.name);
  }catch(e){if(e.name!=='AbortError')toast('挂载失败:'+e.message);}
}

function openNotepad(path){
  const cont=document.createElement('div');cont.style.cssText='display:flex;flex-direction:column;height:100%;';
  const name=path?path.split('/').pop():'未命名.txt';
  cont.innerHTML=`<div style="display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line-soft);align-items:center;">
     <div class="btn primary" id="np-save">保存</div>

function openCode(path){

   </div>
   <div style="flex:1;display:flex;min-height:0;">

     <iframe id="cm-prev" style="flex:1;border:none;border-left:1px solid var(--line-soft);background:#fff;${isHtml?'':'display:none'}"></iframe>
   </div>`;
  const win=WM.create({title:name,icon:ICONS.code,width:820,height:540,content:cont,appId:'code'});
  let cm=null;const editDiv=$('#cm-edit',cont);
  const modeMap={html:'htmlmixed',htm:'htmlmixed',css:'css',js:'javascript',json:{name:'javascript',json:true},xml:'xml'};
  FS.readText(path).then(text=>{
    if(window.CodeMirror){
      cm=CodeMirror(editDiv,{value:text,mode:modeMap[ext(path)]||'text',lineNumbers:true,theme:'default',lineWrapping:true});
      cm.setSize('100%','100%');
      editDiv.querySelector('.CodeMirror').style.cssText+=';height:100%;background:rgba(20,14,30,0.5);';
      cm.on('change',()=>{if(isHtml&&previewOn)updatePreview();});
    }else{
      editDiv.innerHTML=`<textarea class="fld" style="width:100%;height:100%;border:none;border-radius:0;resize:none;font-family:JetBrains Mono;font-size:13px;background:rgba(20,14,30,0.4)">${escapeHtml(text)}</textarea>`;
      cm={getValue:()=>editDiv.querySelector('textarea').value,setValue:v=>editDiv.querySelector('textarea').value=v};
      editDiv.querySelector('textarea').oninput=()=>{if(isHtml&&previewOn)updatePreview();};
    }
    if(isHtml)updatePreview();
  });
  let previewOn=isHtml;
  const prev=$('#cm-prev',cont);
  function updatePreview(){if(!cm)return;const html=cm.getValue();prev.srcdoc=html;}
  $('#cm-save',cont).onclick=async()=>{await FS.writeText(path,cm.getValue());toast('已保存');if(isHtml)updatePreview();};
  if(isHtml){
    $('#cm-preview',cont).onclick=()=>{previewOn=!previewOn;prev.style.display=previewOn?'block':'none';if(previewOn)updatePreview();};
    $('#cm-browser',cont).onclick=()=>openHtmlInBrowser(path);
  }
  return win;
}

   <div id="ca-grid" style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:8px"></div>`;
  WM.create({title:'计算器',icon:ICONS.calc,width:320,height:440,content:cont,appId:'calc'});
  const disp=$('#ca-disp',cont);const grid=$('#ca-grid',cont);
  const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  let expr='';
  const map={'÷':'/','×':'*','−':'-','+':'+'};
  function show(){disp.textContent=expr||'0';}
  keys.forEach(k=>{const b=document.createElement('div');b.className='calc-btn';b.textContent=k;
    if(['÷','×','−','+','='].includes(k))b.classList.add(k==='='?'eq':'op');
    if(k==='0')b.style.gridColumn='span 1';
    b.onclick=()=>{
      if(k==='C'){expr='';}
      else if(k==='='){try{expr=String(eval(expr.replace(/[÷×−]/g,m=>map[m])||'0'));}catch(e){expr='错误';}}
      else if(k==='±'){if(expr&&!isNaN(expr))expr=String(-parseFloat(expr));}
      else if(k==='%'){try{expr=String(eval(expr.replace(/[÷×−]/g,m=>map[m]))/100);}catch(e){}}
      else{if(expr==='错误')expr='';expr+=k;}
      show();
    };grid.appendChild(b);});
  show();
}

function openPaint(){
  const cont=document.createElement('div');cont.style.cssText='display:flex;flex-direction:column;height:100%;';

     <div class="btn" id="pt-clear">清空</div>
     <div style="flex:1"></div>
     <div class="btn primary" id="pt-save">保存到VFS</div>
   </div>
   <div style="flex:1;overflow:hidden;background:#fff"><canvas id="pt-canvas" style="display:block;touch-action:none;cursor:crosshair"></canvas></div>`;
  const win=WM.create({title:'画板',icon:ICONS.paint,width:680,height:520,content:cont,appId:'paint'});
  const cv=$('#pt-canvas',cont);const ctx=cv.getContext('2d');
  function resize(){const r=cv.parentElement.getBoundingClientRect();const img=ctx.getImageData?null:null;const d=document.createElement('canvas');d.width=cv.width;d.height=cv.height;if(cv.width)d.getContext('2d').drawImage(cv,0,0);cv.width=r.width;cv.height=r.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(d,0,0);}
  setTimeout(resize,60);
  let drawing=false,erase=false;
  function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
  function start(e){drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=erase?'#fff':$('#pt-color',cont).value;ctx.lineWidth=$('#pt-size',cont).value;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
  function end(){drawing=false;}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  $('#pt-erase',cont).onclick=function(){erase=!erase;this.classList.toggle('primary',erase);};
  $('#pt-clear',cont).onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);};
  $('#pt-save',cont).onclick=async()=>{const n=await promptDialog('保存图片','路径','/Pictures/drawing-'+Date.now()+'.png');if(n){cv.toBlob(async b=>{await FS.writeFile(n,b);toast('已保存');});}};
  return win;
}

  WM.create({title:'虚拟机 (v86)',icon:ICONS.vm,width:740,height:560,content:cont,appId:'vm'});
  $('#os_image',cont).addEventListener('change',function(e){
    const file=e.target.files[0];if(!file)return;
    if(!window.V86){toast('正在加载 v86 引擎…');loadScript('https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js').then(()=>boot(file)).catch(()=>toast('v86 加载失败'));return;}
    boot(file);
  });
  function boot(file){
    try{
      toast('正在启动虚拟机…');
      new V86({
        wasm_path:"https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
        bios:{url:"https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin"},
        vga_bios:{url:"https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin"},
        screen_container:$('#screen_container',cont),
        cdrom:{buffer:file},
        memory_size:64*1024*1024,
        vga_memory_size:4*1024*1024,
        autostart:true,
      });
      $('#screen_container',cont).querySelector('canvas').style.display='block';
    }catch(err){toast('启动失败:'+err.message);}
  }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

/* ============================================================

   ============================================================ */
function showCtx(x,y,items){
  closeCtx();
  const m=document.createElement('div');m.className='ctx-menu';
  items.forEach(it=>{
    if(it.sep){const s=document.createElement('div');s.className='ctx-sep';m.appendChild(s);return;}
    const el=document.createElement('div');el.className='ctx-item';if(it.danger)el.style.color='var(--coral)';
    el.innerHTML=`<div class="ic">${it.ic||''}</div>${it.label}`;
    el.onclick=()=>{closeCtx();it.act&&it.act();};
    m.appendChild(el);
  });
  $('#ctx-root').appendChild(m);
  const r=m.getBoundingClientRect();
  if(x+r.width>window.innerWidth)x=window.innerWidth-r.width-8;
  if(y+r.height>window.innerHeight)y=window.innerHeight-r.height-8;
  m.style.left=x+'px';m.style.top=y+'px';
}
function closeCtx(){$('#ctx-root').innerHTML='';}
document.addEventListener('click',e=>{if(!e.target.closest('.ctx-menu'))closeCtx();});
document.addEventListener('scroll',closeCtx,true);

/* ============================================================

   ============================================================ */
function promptDialog(title,label,def=''){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<div class="modal"><div class="font-display" style="font-size:19px;margin-bottom:14px">${title}</div>
      <div style="font-size:12px;color:var(--ink-dim);margin-bottom:7px">${label}</div>
      <input class="fld" id="dlg-inp" style="width:100%;margin-bottom:18px" value="${escapeHtml(def)}">
      <div style="display:flex;gap:10px;justify-content:flex-end"><div class="btn" id="dlg-cancel">取消</div><div class="btn primary" id="dlg-ok">确定</div></div></div>`;
    $('#modal-root').appendChild(bg);
    const inp=$('#dlg-inp',bg);inp.focus();inp.select();
    const done=v=>{bg.remove();res(v);};
    $('#dlg-ok',bg).onclick=()=>done(inp.value.trim()||null);
    $('#dlg-cancel',bg).onclick=()=>done(null);
    inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value.trim()||null);if(e.key==='Escape')done(null);};
    bg.onclick=e=>{if(e.target===bg)done(null);};
  });
}
function confirmDialog(title,msg){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<div class="modal"><div class="font-display" style="font-size:19px;margin-bottom:12px">${title}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;line-height:1.5">${msg}</div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><div class="btn" id="dlg-no">取消</div><div class="btn primary" id="dlg-yes">确定</div></div></div>`;
    $('#modal-root').appendChild(bg);
    $('#dlg-yes',bg).onclick=()=>{bg.remove();res(true);};
    $('#dlg-no',bg).onclick=()=>{bg.remove();res(false);};
    bg.onclick=e=>{if(e.target===bg){bg.remove();res(false);}};
  });
}

/* ============================================================
   DESKTOP ICONS
   ============================================================ */
const DESKTOP_PATH='/Desktop';
let iconPositions={};
function loadIconPos(){try{iconPositions=JSON.parse(localStorage.getItem('nimbus-icons')||'{}');}catch(e){iconPositions={};}}
function saveIconPos(){localStorage.setItem('nimbus-icons',JSON.stringify(iconPositions));}

async function renderDesktop(){
  const layer=$('#icon-layer');layer.innerHTML='';
  if(!await FS.exists(DESKTOP_PATH))await FS.mkdir(DESKTOP_PATH);
  let entries=await FS.readdir(DESKTOP_PATH);
  // app shortcuts always present
  const shortcuts=[
    {key:'__app_files',name:'文件管理器',app:'files',icon:ICONS.files},
    {key:'__app_settings',name:'设置',app:'settings',icon:ICONS.settings},
  ];
  const all=[...shortcuts.map(s=>({...s,shortcut:true})),...entries.map(e=>({...e,key:DESKTOP_PATH+'/'+e.name}))];
  const gridX=110,gridY=112;let auto=0;
  all.forEach(item=>{
    const ic=document.createElement('div');ic.className='desk-icon';ic.dataset.key=item.key;
    let pos=iconPositions[item.key];
    if(!pos){const col=Math.floor(auto/Math.max(1,Math.floor((window.innerHeight-160)/gridY)));const r=auto%Math.max(1,Math.floor((window.innerHeight-160)/gridY));pos={x:20+col*gridX,y:20+r*gridY};auto++;}
    ic.style.left=pos.x+'px';ic.style.top=pos.y+'px';
    ic.innerHTML=`<div class="ic">${item.shortcut?item.icon:iconFor(item)}</div><div class="nm">${item.name}</div>`;
    layer.appendChild(ic);
    setupDesktopIcon(ic,item);
  });
}
function setupDesktopIcon(ic,item){
  const open=()=>{if(item.shortcut)APPS[item.app].open();else openPath(item.key);};
  ic.onclick=e=>{e.stopPropagation();$$('.desk-icon').forEach(i=>i.classList.remove('selected'));ic.classList.add('selected');};
  ic.ondblclick=open;
  let tapT;ic.addEventListener('touchend',e=>{const now=Date.now();if(tapT&&now-tapT<350){open();}tapT=now;});
  ic.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();$$('.desk-icon').forEach(i=>i.classList.remove('selected'));ic.classList.add('selected');
    const items=[{ic:ICONS.open,label:'打开',act:open}];
    if(!item.shortcut){items.push({sep:1},
      {ic:ICONS.rename,label:'重命名',act:async()=>{const n=await promptDialog('重命名','名称',item.name);if(n){await FS.rename(item.key,DESKTOP_PATH+'/'+n);delete iconPositions[item.key];saveIconPos();renderDesktop();}}},
      {ic:ICONS.download,label:'导出',act:()=>exportFile(item.key,item)},
      {ic:ICONS.trash,label:'删除',danger:1,act:async()=>{if(await confirmDialog('删除','删除 “'+item.name+'”？')){await FS.unlink(item.key);delete iconPositions[item.key];saveIconPos();renderDesktop();}}});
    }
    showCtx(e.clientX,e.clientY,items);
  };
  // drag to move (mouse + touch). Native draggable for export.
  ic.setAttribute('draggable','true');
  if(!item.shortcut){ic.addEventListener('mouseenter',()=>preloadDrag(item.key,item));}
  ic.addEventListener('dragstart',e=>{if(!item.shortcut)dragStartFile(e,item.key,item);else e.preventDefault();});
  ic.addEventListener('dragend',()=>cleanupDrag());
  // pointer move within desktop (use mouse, not interfering since drag uses HTML5 only on long press? we use separate: left-drag moves)
  let moving=false,sx,sy,ox,oy;
  const begin=(cx,cy)=>{moving=true;sx=cx;sy=cy;ox=parseInt(ic.style.left);oy=parseInt(ic.style.top);ic.style.zIndex=10;};
  const move=(cx,cy)=>{if(!moving)return;let nx=Math.max(0,ox+cx-sx),ny=Math.max(0,oy+cy-sy);ic.style.left=nx+'px';ic.style.top=ny+'px';};
  const end=()=>{if(!moving)return;moving=false;ic.style.zIndex='';iconPositions[item.key]={x:parseInt(ic.style.left),y:parseInt(ic.style.top)};saveIconPos();};
  // mouse drag (custom) — disable native draggable while moving with mouse to avoid conflict; we only allow native drag via... use touch for move, mouse for move too but cancel native
  ic.addEventListener('mousedown',e=>{if(e.button!==0)return;ic.setAttribute('draggable','false');begin(e.clientX,e.clientY);const m=ev=>move(ev.clientX,ev.clientY);const u=()=>{end();ic.setAttribute('draggable','true');document.removeEventListener('mousemove',m);document.removeEventListener('mouseup',u);};document.addEventListener('mousemove',m);document.addEventListener('mouseup',u);});
  ic.addEventListener('touchstart',e=>{const t=e.touches[0];begin(t.clientX,t.clientY);},{passive:true});
  ic.addEventListener('touchmove',e=>{const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  ic.addEventListener('touchend',end);
}

/* desktop right-click + drop import + selection box */
const desktop=$('#desktop');
desktop.addEventListener('click',()=>$$('.desk-icon').forEach(i=>i.classList.remove('selected')));
desktop.oncontextmenu=e=>{if(e.target.closest('.desk-icon'))return;e.preventDefault();
  showCtx(e.clientX,e.clientY,[
    {ic:ICONS.refresh,label:'刷新',act:renderDesktop},
    {ic:ICONS.newfolder,label:'新建文件夹',act:async()=>{const n=await promptDialog('新建文件夹','名称','新建文件夹');if(n){await FS.mkdir(DESKTOP_PATH+'/'+n);renderDesktop();}}},
    {ic:ICONS.file,label:'新建文本文件',act:async()=>{const n=await promptDialog('新建文件','名称','未命名.txt');if(n){await FS.writeText(DESKTOP_PATH+'/'+n,'');renderDesktop();}}},
    {ic:ICONS.upload,label:'上传文件',act:()=>importFiles(DESKTOP_PATH).then(renderDesktop)},
    {sep:1},
    {ic:ICONS.wallpaper,label:'更换壁纸',act:openSettings},
    {ic:ICONS.fullscreen,label:'全屏模式',act:()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}},
    {ic:ICONS.settings,label:'显示设置',act:openSettings},
  ]);
};
// drop import on desktop
desktop.addEventListener('dragover',e=>{e.preventDefault();});
desktop.addEventListener('drop',async e=>{
  e.preventDefault();
  const move=e.dataTransfer.getData('app/move');
  if(e.dataTransfer.files&&e.dataTransfer.files.length&&!move){await importDataTransfer(e.dataTransfer,DESKTOP_PATH);renderDesktop();return;}
  if(move){const name=move.split('/').pop();const dst=FS.norm(DESKTOP_PATH+'/'+name);if(FS.norm(move)!==dst){try{await FS.rename(move,dst);renderDesktop();}catch(err){}}cleanupDrag();}
});
// selection box
let selStart=null;
desktop.addEventListener('mousedown',e=>{if(e.target!==desktop&&e.target.id!=='icon-layer')return;selStart={x:e.clientX,y:e.clientY};const box=$('#sel-box');box.style.display='block';box.style.left=e.clientX+'px';box.style.top=e.clientY+'px';box.style.width='0px';box.style.height='0px';
  const m=ev=>{if(!selStart)return;const x=Math.min(ev.clientX,selStart.x),y=Math.min(ev.clientY,selStart.y),w=Math.abs(ev.clientX-selStart.x),h=Math.abs(ev.clientY-selStart.y);box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
    $$('.desk-icon').forEach(ic=>{const r=ic.getBoundingClientRect();const hit=!(r.right<x||r.left>x+w||r.bottom<y||r.top>y+h);ic.classList.toggle('selected',hit);});};
  const u=()=>{selStart=null;box.style.display='none';document.removeEventListener('mousemove',m);document.removeEventListener('mouseup',u);};
  document.addEventListener('mousemove',m);document.addEventListener('mouseup',u);
});

async function seedFS(){
  const need=['/Desktop','/Documents','/Pictures','/Music','/mnt','/mnt/local'];
  for(const d of need){if(!await FS.exists(d))await FS.mkdir(d);}
  if(!await FS.exists('/Desktop/欢迎.txt')){
    await FS.writeText('/Desktop/欢迎.txt','欢迎使用 NIMBUS OS\n\n· 双击图标打开文件或应用\n· 右键桌面新建/上传/换壁纸\n· 拖拽图标自由摆放\n· 文件管理器支持挂载本地文件夹\n· 所有数据通过 OPFS 持久化保存\n\n尽情探索吧！');
    await FS.writeText('/Documents/示例.csv','名称,部门,薪资\n艾琳,设计,18000\n柯尔,工程,22000\n莫娜,产品,20000');
    await FS.writeText('/Desktop/demo.html','<!doctype html><html><head><meta charset=utf-8><style>body{font-family:sans-serif;background:linear-gradient(135deg,#1a1326,#e8836b);color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}h1{font-size:3rem}</style></head><body><h1>Hello from NIMBUS</h1></body></html>');
  }
}
async function boot(){
  const msg=$('#boot-msg');
  try{await FS.init();}catch(e){console.error(e);}
  msg.textContent='初始化目录…';
  await seedFS();
  // restore wallpaper
  const savedWP=localStorage.getItem('nimbus-wp');
  if(savedWP){const wf=localStorage.getItem('nimbus-wp-file');if(wf&&await FS.exists(wf)){try{const b=await FS.readFile(wf);setWallpaper(`url(${URL.createObjectURL(b)})`);}catch(e){setWallpaper(savedWP);}}else setWallpaper(savedWP);}
  else setWallpaper(WALLPAPERS[0]);
  loadIconPos();
  buildStartMenu();
  await renderDesktop();
  // mount reminder
  setTimeout(()=>{if(localStorage.getItem('nimbus-had-mount'))toast('提示: 本地挂载需在每次启动后重新挂载');},1500);
  // hide boot
  setTimeout(()=>{const b=$('#boot');b.style.opacity='0';setTimeout(()=>b.remove(),600);},1400);
}
window.addEventListener('resize',()=>{/* keep */});
boot();
