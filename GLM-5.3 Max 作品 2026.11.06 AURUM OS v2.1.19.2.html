<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-radius="10">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURUM OS — 单文件 Web 操作系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d0e'/%3E%3Cpath d='M7 23V9l9 8 9-8v14' stroke='%23d9a04a' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Spline+Sans:wght@300;400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURUM OS — design system
   typography: Spline Sans (UI) · Instrument Serif (display) · Spline Sans Mono (code)
   palette: obsidian ink + brass / verdigris accents
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --font-ui:'Spline Sans',-apple-system,'Segoe UI',sans-serif;
  --font-disp:'Instrument Serif',Georgia,serif;
  --font-mono:'Spline Sans Mono','SFMono-Regular',Consolas,monospace;
  --accent-h:37; --accent-s:64%; --accent-l:57%;
  --accent:hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --accent-ink:#100c07;
  --green:#4fbfa6; --red:#d9634f; --blue:#5a9bd6; --violet:#a98ad6;
  --r-win:10px; --r-sm:6px; --r-lg:16px;
  --fs:15px; --gap:10px;
  --tb-h:52px; --tb-fs:13px;
  --dur:.22s; --ease:cubic-bezier(.2,.8,.2,1);
  --anim:1;
  --blur:16px;
}
html[data-theme="dark"]{
  --bg:#0a0c0d; --bg2:#101314; --panel:#141819; --panel2:#1a1f21; --panel3:#22282b;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --txt:#eae6dd; --txt2:#a8a49b; --txt3:#716d66;
  --glass:rgba(18,22,23,.74); --glass2:rgba(24,29,31,.6);
  --shadow:0 26px 60px -18px rgba(0,0,0,.85),0 2px 10px -4px rgba(0,0,0,.6);
  --hi:inset 0 1px 0 rgba(255,255,255,.06);
  --sel:rgba(217,160,74,.16);
  --grid:rgba(255,255,255,.028);
}
html[data-theme="light"]{
  --bg:#ebe6dc; --bg2:#f3efe7; --panel:#fbf8f2; --panel2:#f1ece2; --panel3:#e7e1d5;
  --line:rgba(30,26,20,.11); --line2:rgba(30,26,20,.2);
  --txt:#1c1a16; --txt2:#5c574e; --txt3:#8b8579;
  --glass:rgba(250,247,241,.82); --glass2:rgba(255,253,248,.7);
  --shadow:0 24px 50px -20px rgba(60,50,32,.4),0 2px 8px -3px rgba(60,50,32,.22);
  --hi:inset 0 1px 0 rgba(255,255,255,.8);
  --sel:rgba(160,110,20,.16);
  --grid:rgba(30,26,20,.035);
}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--font-ui);font-size:var(--fs);color:var(--txt);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
html[data-anim="0"] *{animation:none!important;transition:none!important}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--txt3);background-clip:content-box}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-disp);font-weight:400;letter-spacing:.01em}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3)}
svg.i{width:1em;height:1em;display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}

/* ---------- desktop + wallpaper ---------- */
#stage{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .6s,opacity .6s}
#wall-fx{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 12% 8%,hsl(var(--accent-h) 60% 40%/.14),transparent 60%),
    radial-gradient(90% 70% at 88% 92%,rgba(79,191,166,.11),transparent 60%),
    linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.05) 40%,rgba(0,0,0,.34));
}
html[data-theme="light"] #wall-fx{background:
  radial-gradient(120% 90% at 12% 8%,hsl(var(--accent-h) 70% 78%/.55),transparent 60%),
  radial-gradient(90% 70% at 88% 92%,rgba(79,191,166,.2),transparent 60%),
  linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.04))}
#wall-grid{position:absolute;inset:0;pointer-events:none;opacity:.9;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(120% 100% at 50% 40%,#000 40%,transparent 100%)}
#orbit{position:absolute;pointer-events:none;inset:-20%;opacity:.5;
  background:conic-gradient(from 0deg at 50% 50%,transparent 0 70%,hsl(var(--accent-h) 70% 55%/.07) 78%,transparent 86%);
  animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#desktop{position:absolute;inset:0 0 var(--tb-h) 0;overflow:hidden}
#marquee{position:absolute;border:1px solid var(--accent);background:var(--sel);pointer-events:none;display:none;z-index:5}

/* ---------- desktop icons ---------- */
.dicon{position:absolute;width:92px;padding:10px 6px 8px;border-radius:var(--r-sm);display:flex;flex-direction:column;
  align-items:center;gap:7px;cursor:default;text-align:center;border:1px solid transparent;transition:background var(--dur) var(--ease),transform .18s var(--ease),border-color .18s}
.dicon:hover{background:rgba(255,255,255,.07);border-color:var(--line)}
html[data-theme="light"] .dicon:hover{background:rgba(255,255,255,.5)}
.dicon.sel{background:var(--sel);border-color:hsl(var(--accent-h) 60% 50%/.6)}
.dicon.dragging{opacity:.45;transform:scale(.94)}
.dicon .gi{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;color:var(--txt);position:relative}
.dicon .gi svg{width:34px;height:34px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.dicon .nm{font-size:12.5px;line-height:1.28;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);word-break:break-all;
  max-height:2.6em;overflow:hidden;max-width:100%}
html[data-theme="light"] .dicon .nm{color:#1b1815;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.dicon .bdg{position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;
  background:var(--panel3);border:1px solid var(--line2);color:var(--txt2)}
.dicon .bdg svg{width:9px;height:9px}
.folder-ic{color:hsl(40 55% 62%)}.code-ic{color:var(--blue)}.img-ic{color:var(--green)}.aud-ic{color:var(--violet)}.arc-ic{color:var(--red)}
.txt-ic{color:var(--txt2)}.mnt-ic{color:var(--green)}

/* ---------- taskbar ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);
  border-top:1px solid var(--line);box-shadow:0 -8px 30px -14px rgba(0,0,0,.7);z-index:900}
html[data-theme="light"] #taskbar{box-shadow:0 -8px 30px -18px rgba(60,50,32,.35)}
.tb-btn{height:36px;min-width:36px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--txt2);transition:.16s var(--ease);font-size:var(--tb-fs)}
.tb-btn:hover{background:rgba(255,255,255,.08);color:var(--txt)}
html[data-theme="light"] .tb-btn:hover{background:rgba(0,0,0,.06)}
.tb-btn.on{color:var(--txt);background:var(--sel)}
#start-btn{gap:9px;font-weight:600;color:var(--txt)}
#start-btn .mark{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#0d0b08;
  background:linear-gradient(150deg,hsl(var(--accent-h) 80% 68%),hsl(var(--accent-h) 60% 44%));box-shadow:0 3px 10px -3px hsl(var(--accent-h) 70% 50%/.7)}
#start-btn .mark svg{width:16px;height:16px;stroke-width:2.2}
#tb-apps{flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:2px}
#tb-apps::-webkit-scrollbar{display:none}
.tb-app{position:relative;height:38px;min-width:38px;padding:0 9px;border-radius:9px;display:flex;align-items:center;gap:8px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--txt2);transition:.16s var(--ease);font-size:var(--tb-fs);white-space:nowrap}
.tb-app:hover{background:rgba(255,255,255,.09);color:var(--txt)}
html[data-theme="light"] .tb-app:hover{background:rgba(0,0,0,.06)}
.tb-app.on{background:var(--sel);color:var(--txt);border-color:hsl(var(--accent-h) 55% 48%/.45)}
.tb-app.min{opacity:.6}
.tb-app .dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:3px;border-radius:2px;background:var(--txt3)}
.tb-app.on .dot{background:var(--accent)}
#tray{display:flex;align-items:center;gap:4px}
#tray .tb-btn{min-width:auto;padding:0 8px}
#clock{flex-direction:column;align-items:flex-end;gap:0;line-height:1.15;padding:0 11px}
#clock .t{font-family:var(--font-mono);font-size:13.5px;font-weight:600;letter-spacing:.02em}
#clock .d{font-size:10.5px;color:var(--txt3);letter-spacing:.05em}
#show-desk{width:8px;height:34px;border-radius:4px;border:1px solid var(--line);background:transparent;cursor:pointer;margin-left:2px}
#show-desk:hover{background:var(--line)}

/* ---------- start menu ---------- */
#start{position:absolute;left:10px;bottom:calc(var(--tb-h) + 10px);width:min(660px,calc(100vw - 20px));max-height:min(560px,72vh);
  background:var(--glass);backdrop-filter:blur(calc(var(--blur) * 1.6)) saturate(1.6);-webkit-backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(1.6);
  border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:950;
  display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom left;
  animation:popIn var(--dur) var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
#start.hide{display:none}
#start .sh{padding:16px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
#start .sh h1{margin:0;font-family:var(--font-disp);font-size:29px;font-weight:400;letter-spacing:.02em;flex:1}
#start .sh h1 em{font-style:italic;color:var(--accent)}
#start .body{display:flex;min-height:0;flex:1}
#start .nav{width:170px;border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto;flex:none}
#start .grid{flex:1;padding:14px;overflow-y:auto}
#start .foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--glass2)}
.snav{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;cursor:pointer;color:var(--txt2);font-size:13.5px}
.snav:hover{background:var(--line);color:var(--txt)}
.snav.on{background:var(--sel);color:var(--txt)}
.app-cell{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px 12px;border-radius:12px;cursor:pointer;
  text-align:center;border:1px solid transparent;transition:.16s var(--ease);font-size:12px}
.app-cell:hover{background:var(--line);border-color:var(--line);transform:translateY(-2px)}
.app-cell .gi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.app-cell .gi svg{width:24px;height:24px}
#start .recent{display:flex;flex-direction:column;gap:2px}
.rec{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--txt2)}
.rec:hover{background:var(--line);color:var(--txt)}
.rec .p{margin-left:auto;font-size:10.5px;color:var(--txt3);font-family:var(--font-mono)}

/* ---------- windows ---------- */
#winlayer{position:absolute;inset:0;pointer-events:none;z-index:100}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:260px;min-height:150px;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-win);box-shadow:var(--shadow);overflow:hidden;
  transition:box-shadow .2s,opacity .2s,transform .2s var(--ease)}
html[data-radius="0"] .win{border-radius:0}
.win.focus{border-color:hsl(var(--accent-h) 45% 45%/.5);box-shadow:0 34px 80px -20px rgba(0,0,0,.9),0 0 0 1px hsl(var(--accent-h) 50% 45%/.28)}
.win.mini{opacity:0;transform:translateY(60px) scale(.8);pointer-events:none}
.win.max{border-radius:0}
.win.opening{animation:winIn .26s var(--ease)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
.win.peek-others{opacity:.16;filter:blur(1px) saturate(.4)}
.wbar{height:38px;flex:none;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;cursor:default;
  background:linear-gradient(var(--panel2),var(--panel));border-bottom:1px solid var(--line);position:relative}
html[data-theme="light"] .wbar{background:linear-gradient(var(--panel),var(--panel2))}
.wbar .ti{width:17px;height:17px;color:var(--accent)}
.wbar .tt{flex:1;font-size:12.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar .tt .sub{color:var(--txt3);font-weight:400;margin-left:6px;font-size:11.5px}
.wact{display:flex;gap:4px;align-items:center}
.wbtn{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--txt2);background:transparent;border:none}
.wbtn:hover{background:var(--line);color:var(--txt)}
.wbtn.x:hover{background:rgba(217,99,79,.22);color:#ff9a86}
.wbtn svg{width:13px;height:13px;stroke-width:1.9}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);position:relative}
.wrz{position:absolute;z-index:5}
.rz-n{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}.rz-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rz-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rz-nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}.rz-ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}
.rz-sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}.rz-se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
#snap-preview{position:absolute;display:none;border:1.5px solid hsl(var(--accent-h) 70% 60%/.8);background:hsl(var(--accent-h) 70% 55%/.14);
  border-radius:var(--r-win);z-index:99;pointer-events:none;backdrop-filter:blur(3px);transition:all .13s var(--ease)}
#peek{position:absolute;display:none;z-index:960;pointer-events:none;background:var(--glass);backdrop-filter:blur(12px);
  border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
#peek .cap{padding:6px 10px;font-size:11.5px;color:var(--txt2);display:flex;gap:6px;align-items:center}
#peek .shot{width:230px;height:140px;overflow:hidden;position:relative;background:var(--bg2)}
#peek .shot>*{transform-origin:0 0;position:absolute!important}

/* ---------- controls ---------- */
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;transition:.15s var(--ease);white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:var(--txt3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{background:transparent;border-color:transparent;color:var(--txt2)}
.btn.gh:hover{background:var(--line);color:var(--txt)}
.btn.sm{height:26px;padding:0 8px;font-size:11.5px;gap:5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.inp,select.inp{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);
  font-size:12.5px;outline:none;min-width:0;font-family:inherit}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px hsl(var(--accent-h) 70% 50%/.14)}
textarea.inp{height:auto;padding:8px 10px;resize:none;line-height:1.5}
.sw{width:40px;height:22px;border-radius:20px;background:var(--panel3);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--txt3);transition:.2s var(--ease)}
.sw.on{background:hsl(var(--accent-h) 65% 45%);border-color:transparent}
.sw.on::after{left:20px;background:#fff}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:4px;background:var(--panel3);outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);
  border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}
.chip{height:24px;padding:0 9px;border-radius:20px;border:1px solid var(--line2);background:var(--panel2);display:inline-flex;
  align-items:center;gap:5px;font-size:10.5px;cursor:pointer;color:var(--txt2);font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.chip.on{border-color:var(--accent);color:var(--accent);background:hsl(var(--accent-h) 70% 50%/.12)}
.chip svg{width:11px;height:11px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 13px;font-size:12.5px;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--txt);border-color:var(--accent)}
.sep{height:1px;background:var(--line);margin:10px 0}
.scroll{overflow:auto;min-height:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--txt3);padding:40px 20px;text-align:center}
.empty svg{width:44px;height:44px;opacity:.5}
.loadbar{height:2px;background:var(--panel3);overflow:hidden;border-radius:2px}
.loadbar i{display:block;height:100%;width:34%;background:var(--accent);animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .7s linear infinite}

/* ---------- context menu / toast / modal ---------- */
#ctx{position:absolute;z-index:1000;min-width:196px;padding:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line2);border-radius:11px;box-shadow:var(--shadow);
  animation:popIn .14s var(--ease);transform-origin:top left}
.ci{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--txt);white-space:nowrap}
.ci svg{width:15px;height:15px;color:var(--txt2);flex:none}
.ci:hover{background:var(--sel)}
.ci:hover svg{color:var(--accent)}
.ci.dis{opacity:.35;pointer-events:none}
.ci .kb{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--txt3);padding-left:18px}
.ci .arr{margin-left:auto;width:11px;height:11px;color:var(--txt3)}
.csep{height:1px;background:var(--line);margin:5px 8px}
#toasts{position:absolute;right:12px;bottom:calc(var(--tb-h) + 12px);z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:11px;background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--line2);box-shadow:var(--shadow);max-width:min(360px,90vw);animation:slideIn .22s var(--ease);font-size:12.5px}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}}
.toast.out{animation:slideOut .2s var(--ease) forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(24px)}}
.toast .ic{width:17px;height:17px;color:var(--accent);flex:none;margin-top:1px}
.toast.err .ic{color:var(--red)}.toast.ok .ic{color:var(--green)}
#modal{position:absolute;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;background:rgba(4,5,6,.55);
  backdrop-filter:blur(4px);padding:18px}
#modal.on{display:flex;animation:fadeIn .16s}
@keyframes fadeIn{from{opacity:0}}
.dlg{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  animation:popIn .2s var(--ease)}
.dlg .h{padding:15px 17px 10px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.dlg .b{padding:4px 17px 16px;color:var(--txt2);font-size:13px;line-height:1.6}
.dlg .f{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel2)}

/* ---------- calendar popover ---------- */
#cal{position:absolute;right:10px;bottom:calc(var(--tb-h) + 10px);width:296px;background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:955;padding:14px;display:none;animation:popIn .2s var(--ease)}
#cal.on{display:block}
#cal .cm{display:flex;align-items:center;gap:6px;margin-bottom:10px}
#cal .cm b{flex:1;text-align:center;font-family:var(--font-disp);font-size:19px;font-weight:400}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-g span{font-size:10px;color:var(--txt3);padding:4px 0;font-family:var(--font-mono)}
.cal-d{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--txt2)}
.cal-d:hover{background:var(--line)}
.cal-d.out{opacity:.28}.cal-d.today{background:var(--accent);color:var(--accent-ink);font-weight:700}
#cal .big{font-family:var(--font-disp);font-size:44px;line-height:1;text-align:center;margin:6px 0 2px;letter-spacing:-.01em}

/* ---------- FILE EXPLORER ---------- */
.fx{display:flex;flex-direction:column;height:100%;min-height:0}
.fx-top{flex:none;padding:8px 10px;display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fx-nav{display:flex;gap:2px;flex:none}
.fx-mid{flex:1;display:flex;min-height:0}
.fx-side{width:210px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px 7px;background:var(--panel2)}
.fx-side h4{margin:11px 8px 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);font-family:var(--font-mono)}
.fx-side h4:first-child{margin-top:2px}
.tree{display:flex;flex-direction:column}
.tn{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--txt2);position:relative}
.tn:hover{background:var(--line);color:var(--txt)}
.tn.on{background:var(--sel);color:var(--txt)}
.tn .cv{width:12px;flex:none;display:grid;place-items:center;color:var(--txt3);transition:transform .16s}
.tn .cv svg{width:11px;height:11px}
.tn.open>.cv{transform:rotate(90deg)}
.tn svg.fi{width:15px;height:15px;flex:none}
.tn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.crumb{display:flex;align-items:center;gap:2px;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.crumb::-webkit-scrollbar{display:none}
.cr{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--txt2);white-space:nowrap}
.cr:hover{background:var(--line);color:var(--txt)}
.cr.on{color:var(--txt);background:var(--sel)}
.cr-sep{color:var(--txt3);width:11px;height:11px}
/* list view — left aligned columns, right side is selection background */
.fv{flex:1;overflow:auto;position:relative}
.fv-head{position:sticky;top:0;z-index:6;display:flex;background:var(--panel2);border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.fh{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11px;color:var(--txt2);cursor:pointer;border-right:1px solid var(--line);
  font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;position:relative;flex:none}
.fh:hover{background:var(--line)}
.fh.on{color:var(--accent)}
.fh.on::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);transform:rotate(45deg)}
.fh.on.asc::after{transform:rotate(225deg)}
.fh .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.fh .rz:hover{background:hsl(var(--accent-h) 70% 55%/.5)}
.frows{width:max-content;min-width:100%}
.fr{display:flex;align-items:center;height:30px;border-radius:6px;cursor:pointer;position:relative;width:max-content}
.fr:hover{background:var(--line)}
.fr.sel{background:var(--sel)}
.fr.sel .fc.nm{color:var(--txt)}
.fc{padding:0 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;height:100%;display:flex;align-items:center;gap:8px}
.fc.nm{color:var(--txt)}
.fc.mt,.fc.tp,.fc.sz{color:var(--txt2);font-family:var(--font-mono);font-size:11.5px}
.fc .fi{width:16px;height:16px;flex:none}
.fr.drop{outline:1.5px dashed var(--accent);outline-offset:-2px}
/* icon grid view */
.fgrid{display:flex;flex-wrap:wrap;gap:4px;padding:10px;align-content:flex-start}
.fcell{width:104px;padding:10px 6px 8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center}
.fcell:hover{background:var(--line)}
.fcell.sel{background:var(--sel)}
.fcell .nm{font-size:12px;line-height:1.3;max-height:2.6em;overflow:hidden;word-break:break-all}
.fcell .gi{width:44px;height:44px;display:grid;place-items:center}
.fcell .gi svg{width:34px;height:34px}
.fcell .thumb{width:52px;height:40px;border-radius:5px;object-fit:cover;border:1px solid var(--line2);background:var(--bg2)}
.fcell .sz{font-size:10px;color:var(--txt3);font-family:var(--font-mono)}
/* column (分栏) view */
.fcols{display:flex;height:100%;overflow-x:auto}
.fcol{width:230px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:6px 4px}
.fcol .fr{border-radius:6px;height:28px}
/* details pane */
.fx-status{flex:none;height:26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 11px;font-size:11px;
  color:var(--txt3);font-family:var(--font-mono);background:var(--panel2);overflow:hidden;white-space:nowrap}

/* ---------- CODE EDITOR ---------- */
.ed{display:flex;flex-direction:column;height:100%;min-height:0}
.ed-bar{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2)}
.ed-bar .grp{display:flex;gap:3px;align-items:center;padding:2px 3px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.ed-split{flex:1;display:flex;min-height:0;position:relative}
.ed-split.v{flex-direction:row}.ed-split.h{flex-direction:column}
.ed-pane{flex:1;min-width:0;min-height:0;position:relative;display:flex}
.ed-splitter{flex:none;background:var(--panel3);position:relative;transition:background .15s}
.ed-split.v .ed-splitter{width:6px;cursor:col-resize}
.ed-split.h .ed-splitter{height:6px;cursor:row-resize}
.ed-splitter:hover,.ed-splitter.on{background:var(--accent)}
.ed-prev{flex:1;min-width:0;min-height:0;position:relative;background:#0d0f11}
.ed-prev iframe{width:100%;height:100%;border:0;display:block;background:#0d0f11}
.ed-prev .mask{position:absolute;inset:0;background:#0d0f11;display:grid;place-items:center;z-index:3;transition:opacity .25s}
.ed-prev .mask.off{opacity:0;pointer-events:none}
.mask .ml{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--txt3);font-size:11px;font-family:var(--font-mono);letter-spacing:.12em}
.CodeMirror{height:100%!important;font-family:var(--font-mono)!important;font-size:13px!important;background:transparent!important}
.ed-status{flex:none;height:24px;display:flex;align-items:center;gap:0;border-top:1px solid var(--line);background:var(--panel2);
  font-size:10.5px;font-family:var(--font-mono);color:var(--txt3);overflow-x:auto;scrollbar-width:none}
.ed-status::-webkit-scrollbar{display:none}
.ed-status span{padding:0 10px;border-right:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:5px;height:100%}
.ed-status b{color:var(--txt2);font-weight:500}
.ed-find{position:absolute;top:0;left:0;right:0;z-index:8;display:none;gap:6px;align-items:center;padding:7px 10px;background:var(--glass);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.ed-find.on{display:flex}
textarea.ed-fallback{flex:1;width:100%;border:0;outline:none;background:#0d0f11;color:#e6e1d7;padding:14px;font-family:var(--font-mono);
  font-size:13px;line-height:1.6;resize:none;tab-size:2}

/* ---------- MANGA / VIEWER / MEDIA ---------- */
.mg{position:absolute;inset:0;background:#000;overflow-y:auto;overscroll-behavior-y:none;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;contain:layout style;display:flex;flex-direction:column;align-items:center;gap:0}
.mg img{display:block;max-width:100%;width:100%;object-fit:contain;background:#000;user-select:none;-webkit-user-drag:none}
.mg .skel{width:100%;background:linear-gradient(90deg,#0c0c0c,#151515,#0c0c0c);animation:indBg 1.4s linear infinite}
@keyframes indBg{0%{background-position:0 0}100%{background-position:200% 0}}
.mg-ui{position:absolute;z-index:20;display:flex;gap:6px;align-items:center}
.mg-x{top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.16);
  color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.mg-x:hover{background:rgba(200,60,45,.85)}
.mg-top{position:absolute;top:0;left:0;right:0;z-index:15;display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:linear-gradient(rgba(0,0,0,.8),transparent);transition:opacity .3s;flex-wrap:wrap}
.iv{position:absolute;inset:0;background:var(--bg2);overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.iv img{max-width:100%;max-height:100%;transform-origin:0 0;transition:transform .12s var(--ease)}
.iv.grabbing{cursor:grabbing}
.iv .hud{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:12px;
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line2);z-index:5}
.mplay{display:flex;flex-direction:column;height:100%;background:var(--bg2)}
.mplay video,.mplay audio{width:100%;flex:1;min-height:0;background:#000}
.mp-list{max-height:170px;overflow:auto;border-top:1px solid var(--line);flex:none}

/* ---------- CALC / PAINT / TERM / BROWSER ---------- */
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;background:linear-gradient(160deg,var(--panel),var(--bg2))}
.calc .scr{border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:12px 14px;text-align:right;flex:none}
.calc .ex{font-size:12px;color:var(--txt3);min-height:16px;font-family:var(--font-mono)}
.calc .out{font-family:var(--font-mono);font-size:32px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ck{border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer;
  display:grid;place-items:center;font-family:var(--font-mono);transition:.12s}
.ck:hover{background:var(--panel3)}
.ck:active{transform:scale(.96)}
.ck.op{color:var(--accent);background:hsl(var(--accent-h) 70% 50%/.1)}
.ck.eq{background:var(--accent);color:var(--accent-ink);font-weight:700;border-color:transparent}
.ck.fn{font-size:13px;color:var(--txt2)}
.paint{display:flex;flex-direction:column;height:100%}
.paint canvas{background:#fff;touch-action:none;cursor:crosshair;flex:1;min-height:0;width:100%}
.term{position:absolute;inset:0;background:#0b0d0e;color:#cfe8dd;font-family:var(--font-mono);font-size:12.5px;padding:12px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-all;line-height:1.55}
.term .in{display:flex;gap:6px}
.term input{flex:1;background:transparent;border:0;outline:none;color:#cfe8dd;font:inherit}
.term .p{color:var(--accent)}
.term .e{color:#e8836f}.term .w{color:#d9c477}.term .g{color:#77c9a4}
.brw{display:flex;flex-direction:column;height:100%}
.brw-tabs{flex:none;display:flex;gap:4px;padding:6px 6px 0;overflow-x:auto;scrollbar-width:none;background:var(--panel2)}
.brw-tabs::-webkit-scrollbar{display:none}
.btab{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:9px 9px 0 0;background:var(--bg2);border:1px solid var(--line);
  border-bottom:0;font-size:12px;cursor:pointer;color:var(--txt2);white-space:nowrap;max-width:190px}
.btab.on{background:var(--panel);color:var(--txt)}
.btab .nm{overflow:hidden;text-overflow:ellipsis}
.brw-body{flex:1;position:relative;background:var(--bg2);border-top:1px solid var(--line)}
.brw-body iframe{width:100%;height:100%;border:0;display:block}
.brw-body .mask{position:absolute;inset:0;background:#0b0d0e;display:grid;place-items:center;z-index:3;transition:opacity .3s}
.brw-body .mask.off{opacity:0;pointer-events:none}
.vmwrap{position:relative;flex:1;min-height:0;background:#000;display:grid;place-items:center;overflow:auto}
#screen_container{white-space:pre;font:14px/14px var(--font-mono);color:#dfeee7;background:#000;padding:8px}
.vmwrap canvas{display:block;max-width:100%}

/* ---------- SETTINGS ---------- */
.set{display:flex;height:100%;min-height:0}
.set-nav{width:190px;flex:none;border-right:1px solid var(--line);background:var(--panel2);padding:10px 8px;overflow:auto}
.set-body{flex:1;overflow:auto;padding:18px 22px;min-width:0}
.set-body h2{margin:0 0 4px;font-family:var(--font-disp);font-size:26px;font-weight:400}
.set-body .hint{color:var(--txt3);font-size:12.5px;margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:13px;background:var(--panel2);padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:12px;font-family:var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--txt3)}
.srow{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;min-width:0}
.srow .t b{font-weight:600;font-size:13px;display:block}
.srow .t small{color:var(--txt3);font-size:11.5px;line-height:1.45;display:block;margin-top:2px}
.meter{height:9px;border-radius:6px;background:var(--panel3);overflow:hidden;display:flex}
.meter i{height:100%}
.donut{width:130px;height:130px;flex:none}
.swatch{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent;position:relative}
.swatch.on{border-color:var(--txt);box-shadow:0 0 0 3px var(--panel)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.wp{aspect-ratio:16/10;border-radius:10px;border:2px solid transparent;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.wp.on{border-color:var(--accent)}
.wp span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:3px 6px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--font-mono)}

/* ---------- sheet (csv) ---------- */
.sh{display:flex;flex-direction:column;height:100%}
.sh-grid{flex:1;overflow:auto;background:var(--bg2)}
.sh table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.sh th{position:sticky;top:0;background:var(--panel2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:5px 9px;font-family:var(--font-mono);font-size:10.5px;color:var(--txt3);text-align:left;font-weight:500;white-space:nowrap}
.sh td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 9px;min-width:76px;max-width:280px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;background:var(--panel);cursor:cell}
.sh td:focus{outline:1.6px solid var(--accent);background:var(--bg2);white-space:normal}
.sh td.editing{box-shadow:inset 0 0 0 1.4px var(--accent)}

/* ---------- shutdown ---------- */
#power{position:fixed;inset:0;z-index:3000;background:#050707;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#power.on{display:flex;animation:fadeIn .5s}
#power .pl{width:64px;height:64px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;cursor:pointer;color:var(--accent)}
#power .pl:hover{background:var(--accent);color:#0b0a07}
#power .pl svg{width:26px;height:26px}
#power p{color:var(--txt3);font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}

/* ---------- mobile ---------- */
body.touch .dicon{width:78px}
body.touch .dicon .nm{font-size:11.5px}
@media (max-width:860px){
  :root{--tb-h:60px;--fs:14.5px}
  #taskbar{justify-content:space-between;padding:0 8px}
  #start-btn .txt{display:none}
  #tray .hide-m{display:none}
  #clock{padding:0 6px}
  #clock .d{display:none}
  #tb-apps{justify-content:flex-start}
  #start{left:0;right:0;bottom:0;width:100%;max-height:82vh;border-radius:16px 16px 0 0;transform-origin:bottom center}
  #cal{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0}
  #winlayer{inset:0}
  .win{inset:0 0 var(--tb-h) 0!important;width:auto!important;height:auto!important;border-radius:0!important;
    animation:sheetIn .26s var(--ease)}
  @keyframes sheetIn{from{opacity:0;transform:translateY(5%)}}
  .wrz{display:none!important}
  .wbar{height:44px}
  .fx-side{position:absolute;left:0;top:0;bottom:0;width:74%;max-width:280px;background:var(--panel);z-index:20;
    transform:translateX(-102%);transition:transform .24s var(--ease);box-shadow:var(--shadow)}
  .fx-side.open{transform:none}
  .set-nav{width:52px;padding:8px 6px}
  .set-nav .snav span{display:none}
  .set-nav .snav{justify-content:center}
  .set-body{padding:14px}
  .fh{padding:7px 8px}
  .fc.mt,.fc.tp{display:none!important}
  .fcell{width:92px}
  .dicon{width:76px}
  #toasts{left:12px;right:12px;align-items:stretch}
}
</style>
</head>
<body>
<div id="stage">
  <div id="wallpaper"></div><div id="orbit"></div><div id="wall-grid"></div><div id="wall-fx"></div>
  <div id="desktop"><div id="marquee"></div></div>
  <div id="winlayer"></div>
  <div id="snap-preview"></div>
  <div id="taskbar">
    <div class="tb-btn" id="start-btn"><span class="mark"><svg viewBox="0 0 24 24" class="i"><path d="M4 18V6l8 6 8-6v12"/></svg></span><span class="txt">开始</span></div>
    <div class="tb-btn hide-m" id="tb-search" title="全局搜索"><svg viewBox="0 0 24 24" class="i" style="width:15px;height:15px"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></div>
    <div id="tb-apps"></div>
    <div id="tray">
      <div class="tb-btn hide-m" id="tr-net" title="网络"><svg viewBox="0 0 24 24" class="i" style="width:15px;height:15px"><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg></div>

<script>

const P = {

  dirname(p) { p = P.norm(p); if (p === '/') return '/'; const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); },
  basename(p) { p = P.norm(p); return p === '/' ? '/' : p.slice(p.lastIndexOf('/') + 1); },

/* ---------------------------- OPFS backend ---------------------------- */
const OPFS_OK = (() => { try { return 'storage' in navigator && !!navigator.storage.getDirectory; } catch (e) { return false; } })();
class OPFSBackend {
  constructor() { this.id = 'opfs'; this.label = 'OPFS 私有存储'; this.ic = 'opfs'; this._r = null; }
  async root() { if (!this._r) this._r = await navigator.storage.getDirectory(); return this._r; }
  async dir(path, create = false) {
    let h = await this.root();
    for (const part of P.parts(path)) h = await h.getDirectoryHandle(part, { create });
    return h;
  }
  async fh(path, create = false) {
    const d = await this.dir(P.dirname(path), create);
    return d.getFileHandle(P.basename(path), { create });
  }
  async stat(path, isLstat) {
    path = P.norm(path);
    if (path === '/') return { path: '/', name: '/', type: 'dir', size: null, mtime: 0, ctime: 0, backend: 'opfs' };
    const d = await this.dir(P.dirname(path)).catch(() => null);
    if (!d) return null;
    const name = P.basename(path);
    const m = (await Meta.get(path)) || {};
    try {
      const f = await (await d.getFileHandle(name)).getFile();
      return { path, name, type: 'file', size: f.size, mtime: m.mtime ?? f.lastModified, ctime: m.ctime ?? f.lastModified, mime: m.mime, backend: 'opfs' };
    } catch (e) { }
    try {
      await d.getDirectoryHandle(name);
      return { path, name, type: 'dir', size: m.size ?? null, mtime: m.mtime ?? 0, ctime: m.ctime ?? 0, backend: 'opfs' };
    } catch (e) { }
    return null;
  }
  async readdir(path) {
    path = P.norm(path);
    const d = await this.dir(path).catch(() => null);
    if (!d) throw new Error('目录不存在: ' + path);
    const names = [];
    const iter = d.entries ? d.entries() : d.values();
    for await (const e of iter) names.push(Array.isArray(e) ? e : [e.name, e]);
    return (await pool(names, 16, async ([name, h]) => {
      const full = P.join(path, name), m = (await Meta.get(full)) || {};
      if (h.kind === 'file') { const f = await h.getFile(); return { path: full, name, type: 'file', size: f.size, mtime: m.mtime ?? f.lastModified, ctime: m.ctime ?? f.lastModified, mime: m.mime, backend: 'opfs' }; }
      return { path: full, name, type: 'dir', size: m.size ?? null, mtime: m.mtime ?? 0, ctime: m.ctime ?? 0, backend: 'opfs' };
    })).filter(Boolean);
  }
  async readFile(path, flag) { const f = await (await this.fh(path)).getFile(); return await f.arrayBuffer(); }
  async writeFile(path, data, opts = {}) {
    const h = await this.fh(path, true);
    const blob = data instanceof Blob ? data : new Blob([data]);
    const w = await h.createWritable({ keepExistingData: false });
    await w.write(blob); await w.close();
    const mt = opts.mtime != null ? opts.mtime : Date.now();
    await Meta.patch(path, { mtime: mt, ctime: opts.ctime ?? mt, size: blob.size, mime: opts.mime });
    return mt;
  }
  async mkdir(path) { await this.dir(path, true); const t = Date.now(); await Meta.patch(path, { mtime: t, ctime: t }); }
  async rm(path) {
    const st = await this.stat(path); if (!st) return;
    const d = await this.dir(P.dirname(path));
    await d.removeEntry(P.basename(path), { recursive: true });
    await IDB.walk('meta', path, async (s, k) => s.delete(k));
    await Meta.del(path);
  }
  async move(from, to) {
    const st = await this.stat(from); if (!st) throw new Error('源不存在');
    await this.dir(P.dirname(to), true);
    try {
      const h = st.type === 'file' ? await this.fh(from) : await this.dir(from);
      if (h.move) { await h.move(await this.dir(P.dirname(to)), P.basename(to)); await Meta.renamePath(from, to); return; }
      throw new Error('no move');
    } catch (e) { await fs._genericCopy(from, to, this, this); await this.rm(from); }
  }
  async exists(path) { return !!(await this.stat(path)); }
  async du(path) {
    let total = 0, files = 0, dirs = 0;
    const walk = async p => {
      const list = await this.readdir(p).catch(() => []);
      for (const e of list) { if (e.type === 'file') { total += e.size || 0; files++; } else { dirs++; await walk(e.path); } }
    };
    await walk(path); return { size: total, files, dirs };
  }
}

/* ---------------------------- IndexedDB backend ---------------------------- */
class IDBBackend {
  constructor() { this.id = 'idb'; this.label = 'IndexedDB 数据库'; this.ic = 'idb'; }
  async rec(p) { return await IDB.get('fs', p); }
  async stat(path, isLstat) {
    path = P.norm(path);
    if (path === '/') return { path: '/', name: '/', type: 'dir', size: null, mtime: 0, ctime: 0, backend: 'idb' };
    const r = await this.rec(path);
    if (!r) {
      // 目录可能是隐式存在（有子项）
      const ks = await IDB.keys('fs');
      if (ks.some(k => k === path + '/' || String(k).startsWith(path + '/'))) return { path, name: P.basename(path), type: 'dir', size: null, mtime: 0, ctime: 0, backend: 'idb' };
      return null;
    }
    if (r.k === 'dir') return { path, name: P.basename(path), type: 'dir', size: r.s ?? null, mtime: r.m, ctime: r.c, backend: 'idb' };
    return { path, name: P.basename(path), type: 'file', size: r.s, mtime: r.m, ctime: r.c, mime: r.mime, backend: 'idb' };
  }
  async readdir(path) {
    path = P.norm(path);
    const ks = (await IDB.keys('fs')).filter(k => typeof k === 'string');
    const pre = path === '/' ? '/' : path + '/';
    const kids = ks.filter(k => k.startsWith(pre) && !k.slice(pre.length).includes('/')).map(k => k.slice(pre.length));
    const out = [];
    for (const name of kids) {
      const full = path === '/' ? '/' + name : pre + name;
      const r = await this.rec(full);
      if (!r) { out.push({ path: full, name, type: 'dir', size: null, mtime: 0, ctime: 0, backend: 'idb' }); continue; }
      out.push(r.k === 'dir'
        ? { path: full, name, type: 'dir', size: r.s ?? null, mtime: r.m, ctime: r.c, backend: 'idb' }
        : { path: full, name, type: 'file', size: r.s, mtime: r.m, ctime: r.c, mime: r.mime, backend: 'idb' });
    }
    return out;
  }
  async readFile(path, flag) { const r = await this.rec(path); if (!r || r.k !== 'file') throw new Error('文件不存在: ' + path); const b = r.d instanceof Blob ? await r.d.arrayBuffer() : (r.d.buffer ? new Uint8Array(r.d).slice().buffer : r.d); return b; }
  async writeFile(path, data, opts = {}) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const mt = opts.mtime != null ? opts.mtime : Date.now();
    await IDB.set('fs', path, { k: 'file', d: blob, s: blob.size, m: mt, c: opts.ctime ?? mt, mime: opts.mime });
    await Meta.patch(path, { mtime: mt, ctime: opts.ctime ?? mt });
    return mt;
  }
  async mkdir(path) { const t = Date.now(); await IDB.set('fs', P.norm(path), { k: 'dir', s: null, m: t, c: t }); }
  async rm(path) {
    path = P.norm(path);
    await IDB.walk('fs', path, async (s, k) => s.delete(k));
    await IDB.del('fs', path);
    await IDB.walk('meta', path, async (s, k) => s.delete(k));
  }
  async move(from, to) {
    from = P.norm(from); to = P.norm(to);
    // 先收集前缀键，再串行迁移（避免事务嵌套）
    const ks = (await IDB.keys('fs')).filter(k => typeof k === 'string' && (k === from || k.startsWith(from + '/'))).sort((a, b) => a.length - b.length);
    for (const k of ks) {
      const v = await IDB.get('fs', k);
      if (v) { await IDB.set('fs', to + k.slice(from.length), v); await IDB.del('fs', k); }
    }
    await IDB.set('fs', P.dirname(to), { k: 'dir', s: null, m: Date.now(), c: Date.now() });
    await Meta.renamePath(from, to);
  }
  async exists(path) { return !!(await this.stat(path)); }
  async du(path) {
    let total = 0, files = 0, dirs = 0;
    await IDB.walk('fs', path, async (s, k, v) => { if (v && v.k === 'file') { total += v.s || 0; files++; } else dirs++; });
    return { size: total, files, dirs };
  }
}

/* ---------------------------- File System Access mount backend ----------------------------

const FSA_OK = (() => { try { return typeof window.showDirectoryPicker === 'function'; } catch (e) { return false; } })();
class LocalBackend {

    try { await d.getDirectoryHandle(name); return { path: P.norm(path), name, type: 'dir', size: null, mtime: 0, ctime: 0, backend: this.id, mount: this.name }; } catch (e) { }

    for await (const e of iter) {
      const [name, h] = Array.isArray(e) ? e : [e.name, e];
      const full = P.join(P.norm(path), name);
      if (h.kind === 'file') { const f = await h.getFile(); out.push({ path: full, name, type: 'file', size: f.size, mtime: f.lastModified, ctime: f.lastModified, backend: this.id, mount: this.name }); }

  async writeFile(path, data, opts = {}) {
    const rel = this.rel(path);
    const d = await this.dir(P.dirname(rel), true);
    const h = await d.getFileHandle(P.basename(rel), { create: true });
    const blob = data instanceof Blob ? data : new Blob([data]);
    const w = await h.createWritable({ keepExistingData: false });
    await w.write(blob); await w.close();

  }
  async move(from, to) {
    const st = await this.stat(from); if (!st) throw new Error('源不存在');

    const rf = this.rel(from), rt = this.rel(to);

    const walk = async p => { const l = await this.readdir(p).catch(() => []); for (const e of l) { if (e.type === 'file') { total += e.size || 0; files++; } else { dirs++; await walk(e.path); } } };
    await walk(P.norm(path)); return { size: total, files, dirs };
  }
}

/* ---------------------------- unified facade ---------------------------- */
const fs = {
  OP: new (OPFS_OK ? OPFSBackend : IDBBackend)(),
  ID: new IDBBackend(),
  locals: [],
  primary: 'opfs',
  get backends() { return [this.OP, this.ID, ...this.locals]; },
  backendOf(path) {
    path = P.norm(path);
    for (const l of this.locals) if (path === l.mountPath || path.startsWith(l.mountPath + '/')) return l;
    return this.primary === 'idb' ? this.ID : this.OP;
  },
  setBackend(id) {
    this.primary = id === 'idb' ? 'idb' : 'opfs';
    S.backend = this.primary; saveS();
  },
  /* —— 兼容回调式调用：任何方法最后一个参数若是 function 则以 callback 形式返回 —— */
  _cb(args) { const a = [...args]; if (typeof a[a.length - 1] === 'function') return { a: a.slice(0, -1), cb: a.pop() }; return { a, cb: null }; },
  _wrap(fn) {
    return (...args) => {
      const { a, cb } = this._cb(args);
      const p = fn.apply(this, a);
      if (cb) p.then(v => cb(null, v), e => cb(e));
      return p;
    };
  },
  stat(path, isLstat) { return this.backendOf(path).stat(path, isLstat).catch(() => null); },
  readdir(path) { return this.backendOf(path).readdir(path); },
  readFile(path, flag) { return this.backendOf(path).readFile(path, flag); },
  async readText(path, flag) { const b = await this.readFile(path, flag); return new TextDecoder('utf-8').decode(b); },
  writeFile(path, data, opts) { return this.backendOf(path).writeFile(path, data, opts || {}); },
  async writeText(path, text, opts) { return this.writeFile(path, new TextEncoder().encode(text), opts); },
  mkdir(path) { return this.backendOf(path).mkdir(P.norm(path)); },
  rm(path) { return this.backendOf(path).rm(P.norm(path)); },
  async move(from, to) {
    from = P.norm(from); to = P.norm(to);
    if (from === to) return;
    const sb = this.backendOf(from), tb = this.backendOf(to);
    await tb.mkdir(P.dirname(to)).catch(() => { });
    if (sb === tb) return sb.move(from, to);
    await this._genericCopy(from, to, sb, tb); await sb.rm(from);
  },
  copy: null,
  async _genericCopy(from, to, sb, tb) {
    const st = await sb.stat(from); if (!st) throw new Error('源不存在: ' + from);
    await tb.mkdir(P.dirname(to)).catch(() => { });
    if (st.type === 'file') {
      const buf = await sb.readFile(from);
      await tb.writeFile(to, buf, { mtime: st.mtime, ctime: st.ctime, mime: st.mime });
    } else {
      await tb.mkdir(to);
      const kids = await sb.readdir(from);
      for (const k of kids) await this._genericCopy(k.path, P.join(to, k.name), sb, tb);

  async exists(path) { return !!(await this.stat(path)); },
  async uniqueName(dir, name) {
    const list = await this.readdir(dir).catch(() => []);
    const taken = new Set(list.map(e => e.name.toLowerCase()));
    if (!taken.has(name.toLowerCase())) return name;
    const e = P.ext(name), stem = P.stem(name);
    for (let i = 2; i < 999; i++) { const c = e ? `${stem} (${i}).${e}` : `${stem} (${i})`; if (!taken.has(c.toLowerCase())) return c; }
    return stem + ' ' + uid() + (e ? '.' + e : '');

  /* 递归目录大小（带 30s 缓存，写操作会失效） */
  _duCache: new Map(),
  async dirSize(path, force) {

    const v = await (b.du ? b.du(path) : { size: 0, files: 0, dirs: 0 });

function openApp(id, opts = {}) {
  const app = APPS[id];
  if (!app) { toast('应用不存在: ' + id, 'err'); return null; }

  if (app.single) { const ex = WM.list.find(w => w.app.id === id); if (ex) { ex.restore(true); if (opts.path && ex.onOpen) ex.onOpen(opts); return ex; } }
  const w = new Win(app, opts);
  w.ctx = { ...opts };
  try { app.mount(w, opts, w.body); } catch (e) {
    console.error(e);
    w.body.innerHTML = '';
    w.body.append(el('div', { class: 'empty' }, el('div', { html: icon('bug', 40) }), el('div', { text: '应用启动失败：' + e.message })));

}

/* ------------------------------ 统一文件分派 ------------------------------ */
async function openPath(path, opts = {}) {
  const st = await fs.stat(path);
  if (!st) { toast('找不到：' + P.basename(path), 'err'); return; }
  if (st.type === 'dir') return openApp('explorer', { path });
  const k = fs.kind(st), e = P.ext(path);
  if (opts.as) { const a = APPS[opts.as]; if (a) return openApp(opts.as, { path }); }
  if (k === 'image') return openApp(opts.single ? 'viewer' : 'manga', { path });
  if (k === 'audio' || k === 'video') return openApp('media', { path });
  if (k === 'sheet') return openApp('sheet', { path });
  if (e === 'html' || e === 'htm' || e === 'xhtml') {
    const v = await askPick(`${icon('browser', 18)} 打开 HTML 文档`,
      [{ v: 'browser', t: '在系统浏览器中打开（实时渲染）' }, { v: 'editor', t: '用代码编辑器打开（编辑 + 实时预览）' }, { v: 'notepad', t: '用记事本查看源码' }], 'browser');
    if (v) return openApp(v, { path });
    return;
  }
  if (k === 'archive') return openApp('archive', { path });
  if (k === 'pdf') return openApp('pdf', { path });
  if (k === 'text') return openApp('notepad', { path });
  // 未知类型：通用打开
  const v = await askPick(`${icon('file', 18)} 选择打开方式 · ${esc(P.basename(path))}`,
    [{ v: 'notepad', t: '以纯文本形式打开' }, { v: 'editor', t: '用代码编辑器打开' }, { v: 'viewer', t: '尝试作为图片预览' }, { v: 'media', t: '尝试作为媒体播放' }, { v: 'hex', t: '查看二进制信息' }], 'notepad');
  if (v) openApp(v === 'hex' ? 'notepad' : v, { path, hex: v === 'hex' });
}

/* ------------------------------ desktop ------------------------------ */
const DESKTOP_PATH = '/桌面';
const Desktop = {
  items: [], sel: new Set(),
  async refresh() {
    const layer = $('#desktop');
    layer.querySelectorAll('.dicon').forEach(n => n.remove());
    let list = [];
    try { list = await fs.readdir(DESKTOP_PATH); } catch (e) {
      await fs.mkdir(DESKTOP_PATH).catch(() => { }); list = [];
    }
    list.sort((a, b) => naturalCompare(a.name, b.name));
    // 位置分配
    const gridX = S.deskGridX || 96, gridY = S.deskGridY || 100;
    const maxRows = Math.max(2, Math.floor((innerHeight - S.tbSize - 20) / gridY));
    let auto = 0;

    for (const it of list) {
      const m = await Meta.get(it.path);
      if (m && m.x != null && m.y != null) { it.x = m.x; it.y = m.y; taken.add(Math.round(m.x / gridX) + ':' + Math.round(m.y / gridY)); }
      else it.auto = true;
    }
    for (const it of list.filter(i => i.auto)) {

      while (true) {
        const r = auto % maxRows; c = Math.floor(auto / maxRows);
        const x = 14 + c * gridX, y = 12 + r * gridY;
        if (!taken.has(c + ':' + r)) { it.x = x; it.y = y; taken.add(c + ':' + r); break; }
        auto++;

      auto++;

  buildIcon(it) {

    n.innerHTML = `<div class="gi">${icon(fs.iconFor(it), 34, fs.colorFor(it))}</div>
      <div class="nm">${esc(it.name)}</div>
      ${fs.locals.length && it.backend && it.backend.startsWith('local:') ? `<div class="bdg" title="本机挂载">${icon('mount', 9)}</div>` : it.backend === 'idb' ? `<div class="bdg" title="IndexedDB">${icon('idb', 9)}</div>` : ''}`;
    n.onclick = e => {
      if (e.ctrlKey || e.metaKey) { n.classList.toggle('sel'); this.sel.has(it) ? this.sel.delete(it) : this.sel.add(it); return; }
      if (this._lastClick && Date.now() - this._lastClick < 400 && this._lastPath === it.path) { }
      this._lastClick = Date.now(); this._lastPath = it.path;
      this.sel.clear(); layer_clearSel();
      n.classList.add('sel'); this.sel.add(it);
    };
    n.ondblclick = () => this.openItem(it);
    longPress(n, () => this.menu(it, n));
    n.addEventListener('contextmenu', e => { e.preventDefault(); this.sel.clear(); layer_clearSel(); this.sel.add(it); n.classList.add('sel'); this.menu(it, n); });
    // —— 原生拖拽（桌面内部移动 / 拖到文件夹 / 拖出到物理桌面）——
    n.addEventListener('mouseenter', () => this.preload(it.path));
    n.addEventListener('mousedown', () => this.preload(it.path));
    n.addEventListener('dragstart', ev => {
      const c = dragCache.get(it.path);
      const name = it.name;
      try {
        if (c) {
          const file = new File([c.blob], name, { type: c.mime });
          ev.dataTransfer.items.add(file);
          const u = URL.createObjectURL(c.blob);
          ev.dataTransfer.setData('DownloadURL', `${c.mime}:${name}:${u}`);
          setTimeout(() => URL.revokeObjectURL(u), 8000);
        }

      ev.dataTransfer.setData('text/plain', name);
      ev.dataTransfer.effectAllowed = 'copyMove';

    n.addEventListener('dragend', () => n.classList.remove('dragging'));
    n.addEventListener('dragover', e => { if (it.type === 'dir') { e.preventDefault(); n.classList.add('sel'); } });
    n.addEventListener('dragleave', () => { if (!this.sel.has(it)) n.classList.remove('sel'); });
    n.addEventListener('drop', async e => {
      if (it.type !== 'dir') return;
      e.preventDefault(); e.stopPropagation(); n.classList.remove('sel');
      await handleDrop(e, it.path);
    });
    if (isTouch) this.touchDrag(n, it);
    return n;
  },

const Clipboard = {

  has() { return this.paths.length > 0; },
  copy(p) { this.mode = 'copy'; this.paths = Array.isArray(p) ? p : [p]; toast(`已复制 ${this.paths.length} 项`, 'ok'); },
  cut(p) { this.mode = 'cut'; this.paths = Array.isArray(p) ? p : [p]; toast(`已剪切 ${this.paths.length} 项`, 'ok'); },
  async paste(dir) {
    if (!this.paths.length) return;
    for (const p of this.paths) {
      const st = await fs.stat(p); if (!st) continue;
      const nn = await fs.uniqueName(dir, st.name);
      try {
        if (this.mode === 'cut') await fs.move(p, P.join(dir, nn)); else await fs.copy(p, P.join(dir, nn));
      } catch (e) { toast('粘贴失败：' + e.message, 'err'); }
    }
    if (this.mode === 'cut') { this.paths = []; this.mode = null; }
    fs.invalidate(dir); Desktop.refresh();
  }
};

async function downloadFile(path) {
  const st = await fs.stat(path); if (!st) return;
  const t = toastProgress('正在准备下载 ' + st.name);
  try {
    const buf = await fs.readFile(path);
    const blob = new Blob([buf], { type: fs.mime(path) });
    const a = el('a', { href: URL.createObjectURL(blob), download: st.name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 9000);
    t.remove(); toast('已开始下载 ' + st.name, 'ok');
  } catch (e) { t.remove(); toast('导出失败：' + e.message, 'err'); }
}
function pickFiles(multiple = true, accept = '') {
  return new Promise(res => {
    const i = el('input', { type: 'file', multiple, style: 'display:none' });
    if (accept) i.accept = accept;
    i.onchange = () => { res([...i.files]); i.remove(); };
    document.body.append(i); i.click();
    setTimeout(() => { if (!i.files.length) { } }, 100);
    i.oncancel = () => { res([]); i.remove(); };
  });
}
async function uploadFiles(dir) {
  const files = await pickFiles(true);
  if (!files.length) return;
  const t = toastProgress(`正在导入 ${files.length} 个文件…`);
  for (const f of files) {
    try {
      const nn = await fs.uniqueName(dir, f.name);
      const buf = await f.arrayBuffer();
      await fs.writeFile(P.join(dir, nn), buf, { mtime: f.lastModified, ctime: f.lastModified, mime: f.type || fs.mime(f.name) });
    } catch (e) { toast('导入失败：' + f.name, 'err'); }
  }
  t.remove(); fs.invalidate(dir); Desktop.refresh(); toast(`已导入 ${files.length} 个文件到 ${dir}`, 'ok');
  return files.length;
}
/* 物理桌面 → 虚拟桌面：递归读取 FileSystemEntry（严禁 Buffer，使用 arrayBuffer） */
function readEntry(entry) {
  return new Promise(res => {
    if (entry.isFile) entry.file(f => res(f), () => res(null));
    else if (entry.isDirectory) {
      const r = entry.createReader();
      const all = [];
      const step = () => r.readEntries(async ents => {          // readEntries 每次最多 100 条 → 循环
        if (!ents.length) { res({ dir: true, name: entry.name, children: all }); return; }
        for (const e of ents) { const c = await readEntry(e); if (c) all.push(c); }
        step();
      }, () => res({ dir: true, name: entry.name, children: all }));
      step();
    } else res(null);
  });
}
async function importEntryTree(node, dir) {
  if (!node) return 0;
  if (node.dir) {
    const target = P.join(dir, node.name);
    await fs.mkdir(target).catch(() => { });
    let n = 0;
    for (const c of node.children) n += await importEntryTree(c, target);
    return n;
  }
  const buf = await node.arrayBuffer();
  const nn = await fs.uniqueName(dir, node.name);
  await fs.writeFile(P.join(dir, nn), buf, { mtime: node.lastModified, ctime: node.lastModified, mime: node.type });
  return 1;
}
async function handleDrop(e, dir) {
  const dt = e.dataTransfer;
  const internal = dt.getData('application/x-aurum');
  const entries = [];
  if (dt.items && dt.items.length) {
    for (const it of [...dt.items]) {
      if (it.kind !== 'file') continue;
      const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
      if (en) entries.push(en); else { const f = it.getAsFile(); if (f) entries.push(f); }
    }
  }
  const hasExternal = entries.length && !internal;
  if (hasExternal) {
    const t = toastProgress(`正在导入 ${entries.length} 个项目…`);
    let n = 0;
    for (const en of entries) {
      if (en.isFile !== undefined) { const tree = await readEntry(en); n += await importEntryTree(tree, dir); }
      else if (en instanceof File) {
        const nn = await fs.uniqueName(dir, en.name);
        await fs.writeFile(P.join(dir, nn), await en.arrayBuffer(), { mtime: en.lastModified, ctime: en.lastModified, mime: en.type });
        n++;
      }
    }
    t.remove(); fs.invalidate(dir); Desktop.refresh(); toast(`已导入 ${n} 个项目`, 'ok');
    return;
  }
  if (internal) {
    const st = await fs.stat(internal);
    if (st) { const nn = await fs.uniqueName(dir, st.name); await fs.move(internal, P.join(dir, nn)); fs.invalidate(dir); Desktop.refresh(); toast('已移动', 'ok'); }
  }
}

async function downloadTree(path) {
  const t = toastProgress('正在打包文件夹…');
  try { await zipCreate([path], '/下载/' + P.basename(path) + '.zip'); await downloadFile('/下载/' + P.basename(path) + '.zip'); t.remove(); }
  catch (e) { t.remove(); toast('导出失败：' + e.message, 'err'); }
}

reg({
  id: 'search', title: '全局搜索', icon: 'search', cat: 'sys', w: 720, h: 520, kw: 'search find',
  mount(w, opts, body) {
    body.innerHTML = '';
    const box = el('div', { class: 'fx' });
    const top = el('div', { class: 'fx-top' });
    const inp = el('input', { class: 'inp', placeholder: '搜索文件名（支持全部存储后端与挂载）…', style: 'flex:1', value: opts.q || '' });
    const scope = el('select', { class: 'inp' }, [['/', '全部'], [DESKTOP_PATH, '桌面'], ['/文档', '文档'], ['/mnt/local', '本机挂载']].map(([v, t]) => el('option', { value: v, text: t })));
    const out = el('div', { class: 'fv scroll' });
    top.append(inp, scope, el('button', { class: 'btn pri', html: icon('search', 14) + '<span>搜索</span>', onclick: () => run() }));
    box.append(top, out); body.append(box);
    let jobs = [];
    async function run() {
      const q = inp.value.trim(); if (!q) { out.innerHTML = `<div class="empty">${icon('search', 44)}<div>输入关键词开始搜索</div></div>`; return; }
      out.innerHTML = `<div class="empty"><div class="spin"></div><div class="lbl">正在全盘搜索…</div></div>`;
      const t0 = performance.now(); const res = [];
      const roots = scope.value === '/' ? ['/', ...fs.locals.map(l => l.mountPath)] : [scope.value];
      await Promise.all(roots.map(r => fs.search(q, r, { limit: 300, max: 12000 }).then(l => res.push(...l))));
      jobs = res.sort((a, b) => naturalCompare(a.path, b.path));
      if (!jobs.length) { out.innerHTML = `<div class="empty">${icon('search', 44)}<div>没有找到「${esc(q)}」</div></div>`; return; }
      out.innerHTML = '';
      const rows = el('div', { class: 'frows' });
      out.append(el('div', { class: 'fx-status', style: 'position:sticky;top:0', text: `找到 ${jobs.length} 个结果 · ${Math.round(performance.now() - t0)} ms` }), rows);
      for (const it of jobs.slice(0, 400)) {
        const r = el('div', { class: 'fr', 'data-path': it.path, html: `<div class="fc nm" style="width:34%">${icon(fs.iconFor(it), 16, fs.colorFor(it))}<span>${esc(it.name)}</span></div>

          <div class="fc mt" style="width:12%;font-size:11px">${relTime(new Date(it.mtime || 0))}</div>` });
        r.ondblclick = () => { Recent.push(it.path); openPath(it.path); };
        r.onclick = () => { rows.querySelectorAll('.fr').forEach(x => x.classList.remove('sel')); r.classList.add('sel'); };
        r.oncontextmenu = e => { e.preventDefault(); menu(e.clientX, e.clientY, [{ label: '打开', icon: 'open', action: () => openPath(it.path) }, { label: '打开所在位置', icon: 'folder', action: () => openApp('explorer', { path: P.dirname(it.path) }) }, { label: '下载到本机', icon: 'exportIc', action: () => downloadFile(it.path) }]); };
        rows.append(r);
      }
    }
    inp.onkeydown = e => { if (e.key === 'Enter') run(); };
    setTimeout(run, 60);
  }

reg({

    const keys = el('div', { class: 'keys' });
    box.append(scr, keys); body.append(box);
    const K = [['AC', 'fn'], ['±', 'fn'], ['%', 'fn'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'], ['4'], ['5'], ['6'], ['−', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['0'], ['.'], ['⌫', 'fn'], ['=', 'eq']];
    for (const [k, c] of K) {

    function evalEx(s) {
      const t = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/%/g, '/100');
      if (!/^[\d+\-*/(). ]+$/.test(t)) return '错误';
      try {
        const r = Function('"use strict";return (' + t + ')')();

      const isMd = String(st.mode) === 'markdown';
      frame.onload = () => setTimeout(() => mask.classList.add('off'), 120);
      if (isMd) frame.srcdoc = `<body style="margin:0;padding:22px;background:#0d1113;color:#dfe6e2;font:15px/1.75 ui-sans-serif,system-ui,sans-serif">
        <style>pre{background:#16191b;padding:12px;border-radius:8px;overflow:auto}code{font-family:ui-monospace,monospace;color:#d9a04a}h1,h2{font-family:Georgia,serif;font-weight:400}img{max-width:100%}blockquote{border-left:3px solid #d9a04a;margin:0;padding-left:14px;color:#9aa5a0}</style>
        ${esc(v).replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>')

    /* ---------------- 文件操作 ---------------- */
    async function load(p) {

      selMode.value = String(st.mode);
      st.dirty = false; w.setTitle(P.basename(p), P.dirname(p)); Recent.push(p);
      fs.invalidate(P.dirname(p)); Desktop.refresh(); updStatus(); refreshPreview(true);
    }
    async function save() {
      if (!st.path) return saveAs();

    }
    async function saveAs() {
      const dir = st.path ? P.dirname(st.path) : DESKTOP_PATH;

      if (!n) return;

      await save();
    }
    async function importLocal() {
      const files = await pickFiles(false);
      if (!files.length) return;
      const f = files[0];
      const txt = await f.text();
      st.path = null;
      st.mode = MODE_FOR[P.ext(f.name)] || 'null';
      setValue(txt); if (st.cm) st.cm.setOption('mode', st.mode);
      selMode.value = String(st.mode);

    async function exportAs() {
      const ext = EXT_FOR[String(st.mode)] || 'txt';
      const def = st.path ? P.basename(st.path) : ('导出.' + ext);
      const n = await askText('导出文件名', def);
      if (!n) return;
      const name = n.includes('.') ? n : n + '.' + ext;
      const blob = new Blob([getValue()], { type: 'text/plain;charset=utf-8' });
      const a = el('a', { href: URL.createObjectURL(blob), download: name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 8000);
      toast('已导出到本机：' + name, 'ok');
    }
    async function copyAll() {
      try { await navigator.clipboard.writeText(getValue()); toast('已复制全部内容（' + getValue().length + ' 字符）', 'ok'); }
      catch (e) { if (st.cm) { st.cm.execCommand('selectAll'); st.cm.focus(); document.execCommand('copy'); toast('已复制', 'ok'); } }
    }
    function clearAll() {
      askConfirm(`${icon('clear', 18)} 清空编辑器`, '当前内容将被清空（可用撤销恢复）。继续吗？').then(ok => { if (!ok) return; if (st.cm) { st.cm.setValue(''); } else st.ta.value = ''; markDirty(); });
    }
    function openBlob() {
      const blob = new Blob([getValue()], { type: st.mode === 'htmlmixed' ? 'text/html' : 'text/plain' });
      const u = URL.createObjectURL(blob);
      window.open(u, '_blank');
      setTimeout(() => URL.revokeObjectURL(u), 60000);
    }
    async function doFormat() {
      const before = getValue();
      const off = (() => {
        if (st.cm) { const c = st.cm.indexFromPos(st.cm.getCursor()); return c; }
        return st.ta.selectionStart;
      })();
      let after;
      try { after = formatCode(before, st.mode); } catch (e) { return toast('格式化失败：' + e.message, 'err'); }
      if (after === before) return toast('内容已是格式化状态');
      const newOff = mapOffset(before, after, off);
      setValue(after);
      if (st.cm) { const pos = st.cm.posFromIndex(newOff); st.cm.setCursor(pos); st.cm.scrollIntoView(null, 80); st.cm.focus(); }
      else { st.ta.setSelectionRange(newOff, newOff); }
      markDirty(); toast('格式化完成（光标位置已保留）', 'ok');
    }
    /* 事件 */
    selMode.onchange = () => { st.mode = selMode.value === 'null' ? 'null' : selMode.value; if (st.cm) st.cm.setOption('mode', st.mode); updStatus(); refreshPreview(true); };
    selView.onchange = () => { st.view = selView.value; applyView(); refreshPreview(true); };
    selInput.onchange = async () => {
      st.inputStyle = selInput.value; S.edInput = st.inputStyle; saveS();
      if (!st.cm) return;
      const v = st.cm.getValue(), c = st.cm.getCursor();
      st.cm.setOption('inputStyle', st.inputStyle === 'auto' ? (await loadCM()).defaults.inputStyle : st.inputStyle);
      st.cm.setValue(v); st.cm.setCursor(c);
      toast('输入模式：' + selInput.selectedOptions[0].text, 'ok');
    };
    body.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFind(true); }
    });
    w.onClose = () => { if (st.cm) { st.cm.toTextArea ? null : st.cm.setValue(''); st.cm = null; } };
    w.setTitle(st.path ? P.basename(st.path) : '未命名.html', '代码编辑器');
    applyView();
    if (opts.path) fs.readText(opts.path).then(t => { init(t); Recent.push(opts.path); }).catch(e => { toast('读取失败：' + e.message, 'err'); init(''); });
    else init(opts.text || HTML_TPL);
  }
});

          row('重新计算文件夹大小缓存', '', el('button', { class: 'btn sm', html: icon('refresh', 13) + '刷新', onclick: () => { fs._duCache.clear(); render(); } })),
          row('一键重置系统', '清除 OPFS、IndexedDB、localStorage 与 Cookie 并恢复初始状态',
            el('button', { class: 'btn', style: 'border-color:var(--red);color:var(--red)', html: icon('warning', 14) + '<span>重置</span>', onclick: async () => { if (await askConfirm(`${icon('warning', 18)} 一键重置`, '所有文件、设置与挂载记录都将被删除。确定继续吗？')) { await fs.reset(); location.reload(); } } }))));
      },
      apps() {
        main.innerHTML = '';
        main.append(el('h2', { text: '应用' }), el('div', { class: 'hint', text: '隐藏不再使用的应用（仍可从文件管理器打开）' }));
        const c = el('div', {});
        for (const a of Object.values(APPS)) {
          if (a.hidden) continue;
          c.append(row(a.title, 'ID: ' + a.id + (a.cat ? ' · ' + ({ sys: '系统工具', work: '工作与创作', media: '媒体', dev: '开发' })[a.cat] : ''), sw(() => !S.hideApps.includes(a.id), v => { S.hideApps = v ? S.hideApps.filter(x => x !== a.id) : [...S.hideApps, a.id]; saveS(); Start.render(); })));
        }
        main.append(card('已安装应用 · ' + Object.keys(APPS).length + ' 个', c));
      },
      editor() {
        main.innerHTML = '';
        main.append(el('h2', { text: '代码编辑器' }), el('div', { class: 'hint', text: 'CodeMirror 内核的默认行为' }));
        main.append(card('编辑器',
          row('主题', '', (() => { const s = el('select', { class: 'inp', onchange: e => { S.edTheme = e.target.value; saveS(); } }, ['material-darker', 'default', 'monokai', 'dracula', 'eclipse', 'idea'].map(t => el('option', { value: t, text: t, selected: (S.edTheme || 'material-darker') === t }))); return s; })()),
          row('字号', '', slider(() => S.edFont, v => { S.edFont = v; saveS(); }, 11, 20, 1, 'px')),
          row('自动换行', '', sw(() => S.edWrap !== false, v => { S.edWrap = v; saveS(); })),
          row('默认布局', '', (() => { const s = el('select', { class: 'inp', onchange: e => { S.edView = e.target.value; saveS(); } }, [['code', '仅代码'], ['preview', '仅预览'], ['split-v', '左右分屏'], ['split-h', '上下分屏']].map(([v, t]) => el('option', { value: v, text: t, selected: S.edView === v }))); return s; })()),
          row('输入模式', '自动跟随浏览器 UA；电脑=textarea（长按全选），手机=contenteditable（长按拖选）',
            (() => { const s = el('select', { class: 'inp', onchange: e => { S.edInput = e.target.value; saveS(); } }, [['auto', '自动'], ['textarea', '电脑'], ['contenteditable', '手机']].map(([v, t]) => el('option', { value: v, text: t, selected: S.edInput === v }))); return s; })())));
      },
      sys() {
        main.innerHTML = '';
        main.append(el('h2', { text: '系统' }), el('div', { class: 'hint', text: '系统信息与电源选项' }));
        main.append(card('显示',
          row('全屏模式', '进入浏览器全屏以获得沉浸式体验', el('button', { class: 'btn', html: icon('full', 14) + '<span>切换全屏</span>', onclick: () => toggleFullscreen() })),
          row('锁定屏幕', '', el('button', { class: 'btn', html: icon('lock', 14) + '<span>锁定</span>', onclick: () => lockScreen() })),
          row('重新加载系统', '刷新浏览器页面（文件已持久保存）', el('button', { class: 'btn', html: icon('refresh', 14) + '<span>重新加载</span>', onclick: () => location.reload() })),
          row('关机', '显示关机画面，点击电源图标重新唤醒', el('button', { class: 'btn', html: icon('power', 14) + '<span>关机</span>', onclick: () => shutdown() }))));
        main.append(card('信息',
          row('系统信息', '浏览器能力与存储架构详情', el('button', { class: 'btn', html: icon('info', 14) + '<span>查看</span>', onclick: () => openApp('about', { force: 1 }) })),
          row('任务管理器', '', el('button', { class: 'btn', html: icon('cpu', 14) + '<span>打开</span>', onclick: () => openApp('taskmgr', { force: 1 }) })),
          row('键盘快捷键', 'F5 刷新桌面 · Ctrl+Alt+T 终端 · Ctrl+Alt+E 文件管理器 · F11 全屏 · 双击标题栏最大化 · 拖到边缘贴靠',
            el('button', { class: 'btn', html: icon('info', 14) + '<span>查看</span>', onclick: () => askConfirm('键盘快捷键', '<div style="text-align:left;line-height:2">F5 · 刷新桌面<br>Ctrl + Alt + T · 打开终端<br>Ctrl + Alt + E · 打开文件资源管理器<br>Ctrl + Alt + S · 打开设置<br>F11 · 切换全屏<br>双击窗口标题栏 · 最大化/还原<br>拖动窗口到屏幕边缘 · Aero Snap 贴靠<br>悬停任务栏按钮 · Aero Peek 预览</div>') }))));
      }
    };
    function render() {
      nav.innerHTML = '';
      for (const [id, t, ic] of SEC) {
        nav.append(el('div', { class: 'snav' + (cur === id ? ' on' : ''), html: icon(ic, 16) + `<span>${t}</span>`, onclick: () => { cur = id; render(); } }));
      }
      (PAGES[cur] || PAGES.look)();
    }
    w.onOpen = o => { if (o && o.section) { cur = o.section; render(); } };
    render();
  }
});
