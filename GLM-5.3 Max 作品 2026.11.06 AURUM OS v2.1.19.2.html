<script>
/* ============================================================================
   AURUM OS · BOOT
   ========================================================================== */
(async function boot() {
  if (!OPFS_OK) { S.backend = 'idb'; saveS(); }
  fs.primary = S.backend === 'idb' ? 'idb' : 'opfs';
  applySettings();
  Desktop.init();

  // —— 首次运行：初始化目录结构与示例文件 ——
  const seeded = localStorage.getItem('aurum.seeded') === '1';
  if (!seeded) {
    const t0 = Date.now();
    try {
      for (const d of [DESKTOP_PATH, '/文档', '/图片', '/下载', '/音乐', '/系统/壁纸', '/mnt/local']) await fs.mkdir(d).catch(() => { });
      const files = [
        [DESKTOP_PATH + '/欢迎使用 AURUM OS.txt', `AURUM OS · 单文件 Web 操作系统
=====================================

这是一个完全运行在浏览器中的桌面环境，所有数据保存在你的设备上，
不会上传到任何服务器。

存储架构
  · OPFS（Origin Private File System）—— 主文件后端，大容量二进制读写
  · IndexedDB —— 备用文件后端 + 元数据（修改时间 / 图标位置）
  · localStorage —— 系统设置
  · Cookie —— 会话标记

你可以做什么
  1. 在桌面空白处点击右键：新建文件夹、上传文件、挂载本机文件夹、更改壁纸
  2. 把电脑里的文件直接拖进浏览器 —— 会自动导入并保留修改时间
  3. 把桌面图标拖出浏览器窗口 —— 直接下载到你的电脑
  4. 双击 HTML 文件 —— 一键在系统浏览器中预览，或用代码编辑器修改
  5. 双击任意图片 —— 自动按自然顺序加载同目录全部图片的条漫阅读器
  6. 打开 .zip / .tar / .gz / .7z —— 右键即可解压到任意目录
  7. 设置 → 存储 —— 可随时切换 OPFS / IndexedDB 双后端

小技巧
  · 拖动窗口到屏幕边缘 → Aero Snap 贴靠
  · 悬停任务栏图标 → Aero Peek 预览
  · Ctrl + Alt + T → 终端（试试 neofetch）
  · 终端支持 > 重定向：echo 你好 > /桌面/note.txt

祝你使用愉快。`],
        [DESKTOP_PATH + '/示例页面.html', HTML_TPL],
        ['/文档/项目说明.md', `# AURUM OS 项目说明

## 设计理念

> 一个 100% 单文件、零后端的浏览器操作系统。

- **排版**：Spline Sans（界面）· Instrument Serif（展示）· Spline Sans Mono（代码）
- **色彩**：曜石黑基底 + 黄铜强调色，克制而有辨识度
- **动效**：CSS 驱动的高频微交互，动画可全局关闭

## 技术要点

1. 统一 \`fs\` 门面：OPFS / IndexedDB / File System Access 三后端同构
2. 元数据层独立于内容层 → 移动文件时**修改日期永不丢失**
3. 原生 HTML5 拖拽 + 触摸拖拽双轨实现
4. CodeMirror 5 懒加载，失败时自动降级为纯文本编辑器

## 文件清单

| 文件 | 说明 |
| --- | --- |
| \`index.html\` | 全部源代码 |
| \`/系统/壁纸\` | 自定义壁纸存放目录 |`],
        ['/文档/销售数据.csv', `月份,产品,数量,金额
2025-01,黄铜台灯,120,42000
2025-02,黄铜台灯,98,34300
2025-03,氧化铜花瓶,76,28880
2025-04,氧化铜花瓶,143,54340
2025-05,石墨镇纸,55,13750
2025-06,石墨镇纸,210,52500`],
        ['/图片/AURUM 标志.svg', `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<rect width="400" height="300" fill="#0b0d0e"/>
<g stroke="#d9a04a" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M60 210V90l140 90 140-90v120"/>
  <circle cx="200" cy="150" r="6" fill="#4fbfa6" stroke="none"/>
</g>
<text x="200" y="262" text-anchor="middle" fill="#8b877e" font-family="Georgia,serif" font-size="18" letter-spacing="6">AURUM OS</text>
</svg>`]
      ];
      for (const [p, txt] of files) await fs.writeFile(p, txt, { mtime: t0, ctime: t0, mime: fs.mime(p) });
      localStorage.setItem('aurum.seeded', '1');
      cookieSet('aurum.boot', String(Date.now()));
    } catch (e) { console.warn('seed failed', e); }
  } else if (!fs.locals.length) {
    for (const d of [DESKTOP_PATH, '/文档', '/图片', '/下载', '/音乐']) await fs.mkdir(d).catch(() => { });
  }

  await fs.loadMounts();
  await Desktop.refresh();
  tick(); setInterval(tick, 1000);

  /* ---------------- 任务栏交互 ---------------- */
  $('#start-btn').onclick = e => { e.stopPropagation(); Start.toggle(); };
  $('#tb-search').onclick = e => { e.stopPropagation(); Start.toggle(false); globalSearch(''); };
  $('#clock').onclick = e => { e.stopPropagation(); Cal.toggle(); };
  $('#show-desk').onclick = () => {
    const any = WM.list.some(w => !w.mini);
    if (any) { WM._pre = WM.list.filter(w => !w.mini).map(w => w.id); WM.minimizeAll(); }
    else WM._pre ? WM._pre.forEach(id => { const w = WM.byId(id); w && w.restore(false); }) : WM.list.forEach(w => w.restore(false));
  };
  $('#tr-net').onclick = () => {
    const on = navigator.onLine;
    menu(innerWidth - 200, innerHeight - S.tbSize - 130, [
      { label: on ? '网络已连接' : '当前无网络连接', icon: 'network', action: () => { } },
      { label: '浏览器：' + (navigator.userAgent.match(/(Firefox|Edg|Chrome|Safari|OPR)\/[\d.]+/)?.[0] || '未知'), icon: 'browser', action: () => openApp('about', { force: 1 }) },
      { label: '存储后端：' + fs.primary.toUpperCase(), icon: 'disk', action: () => openApp('settings', { force: 1, section: 'storage' }) }
    ]);
  };
  let volPanel = null;
  $('#tr-vol').onclick = e => {
    e.stopPropagation();
    if (volPanel) { volPanel.remove(); volPanel = null; return; }
    volPanel = el('div', { style: `position:absolute;right:10px;bottom:calc(var(--tb-h) + 10px);width:230px;padding:14px;background:var(--glass);
      backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:13px;box-shadow:var(--shadow);z-index:958` });
    const lab = el('div', { class: 'row', style: 'margin-bottom:10px' }, el('span', { class: 'lbl', text: '系统音量' }), el('span', { class: 'grow' }), el('b', { text: Math.round(S.vol * 100) + '%', style: 'font-family:var(--font-mono);font-size:12px' }));
    const sl = el('input', { type: 'range', min: 0, max: 100, value: Math.round(S.vol * 100) });
    sl.oninput = () => {
      S.vol = sl.value / 100; saveS(); lab.lastChild.textContent = sl.value + '%';
      document.querySelectorAll('video,audio').forEach(m => m.volume = S.vol);
    };
    volPanel.append(lab, sl, el('div', { class: 'sep' }), el('div', { style: 'font-size:11.5px;color:var(--txt3);line-height:1.7', text: '影响媒体播放器与虚拟机音频输出。' }));
    document.body.append(volPanel);
    const close = ev => { if (volPanel && !volPanel.contains(ev.target) && ev.target !== $('#tr-vol')) { volPanel.remove(); volPanel = null; document.removeEventListener('pointerdown', close); } };
    setTimeout(() => document.addEventListener('pointerdown', close), 50);
  };
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#start') && !e.target.closest('#start-btn')) Start.toggle(false);
    if (!e.target.closest('#cal') && !e.target.closest('#clock')) $('#cal').classList.remove('on');
  });
  document.addEventListener('contextmenu', e => {
    if (e.target.closest('.win, #taskbar, #start, #cal, input, textarea, .CodeMirror, .dlg, #ctx')) return;
    e.preventDefault(); Desktop.bgMenu(e);
  });

  /* ---------------- 全局快捷键 ---------------- */
  document.addEventListener('keydown', e => {
    const inField = e.target.matches('input,textarea,select,[contenteditable="true"]') || e.target.closest('.CodeMirror, .term');
    if (e.key === 'Escape') { closeCtx(); Start.toggle(false); $('#cal').classList.remove('on'); }
    if (inField) return;
    if (e.key === 'F5') { e.preventDefault(); Desktop.refresh(); toast('桌面已刷新'); }
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); openApp('terminal', { path: DESKTOP_PATH }); }
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'e') { e.preventDefault(); openApp('explorer', { path: DESKTOP_PATH }); }
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); openApp('settings', { force: 1 }); }
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'l') { e.preventDefault(); lockScreen(); }
    if (e.altKey && e.key === 'F4' && WM.active) { e.preventDefault(); WM.active.close(); }
  });

  /* ---------------- 全局拖放兜底 ---------------- */
  ['dragover', 'drop'].forEach(t => window.addEventListener(t, e => { if (!e.target.closest('#desktop, .fv, .dicon, .fr, .fcell, .fcol')) e.preventDefault(); }));

  /* ---------------- 窗口边界约束 ---------------- */
  let rzT;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      for (const w of WM.list) {
        if (w.maxed) { w.place(0, 0, innerWidth, innerHeight - S.tbSize); continue; }
        w.place(clamp(w.x, -w.w + 90, innerWidth - 90), clamp(w.y, 0, Math.max(0, innerHeight - S.tbSize - 40)), Math.min(w.w, innerWidth), Math.min(w.h, innerHeight - S.tbSize));
      }
    }, 120);
  });

  /* ---------------- 存储与提示 ---------------- */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
  const est = await navigator.storage.estimate().catch(() => null);
  const bk = fs.primary === 'idb' ? 'IndexedDB' : 'OPFS';
  toast(`文件系统已就绪 · 主后端 <b>${bk}</b>${est ? ' · 可用配额约 ' + fmtBytes(est.quota - (est.usage || 0)) : ''}`, 'ok', 4200);
  if (!OPFS_OK) toast('当前浏览器不支持 OPFS，已自动降级为 IndexedDB 后端', 'err', 6000);

  if (fs.locals.some(l => l.perm !== 'granted')) setTimeout(() => fs.requestMountAccess(), 1200);

  if (!S.seenWelcome && !isTouch) {
    S.seenWelcome = 1; saveS();
    setTimeout(() => openApp('notepad', { path: DESKTOP_PATH + '/欢迎使用 AURUM OS.txt' }), 400);
  }
  window.AURUM = { fs, WM, APPS, S, openApp, openPath, P, icon };
})();
</script>
