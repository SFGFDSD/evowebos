<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VERDANT OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1f1c; --ink2:#102b27; --ink3:#16382f;
  --panel:rgba(16,43,39,0.78); --panel-solid:#0f2823;
  --line:rgba(212,175,120,0.18); --line2:rgba(212,175,120,0.34);
  --copper:#d9a05b; --copper-bright:#f2c178; --rust:#c2683a;
  --sage:#8fae8b; --mist:#cfe0d2; --fog:#9bb4a8;
  --glow:rgba(217,160,91,0.5);
  --red:#c2683a; --ok:#8fae8b;
  --font-d:'Fraunces',Georgia,serif;
  --font-m:'JetBrains Mono',monospace;
  --shadow:0 24px 60px -18px rgba(0,0,0,0.65), 0 4px 12px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-m);background:var(--ink);color:var(--mist);user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,textarea{font-family:var(--font-m)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--copper)}

/* ====== DESKTOP ====== */
#desktop{position:fixed;inset:0;overflow:hidden;background-size:cover;background-position:center;transition:background-image .6s ease}
#desktop::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%, transparent 40%, rgba(6,16,14,0.55) 100%);pointer-events:none}
#wallpaper-canvas{position:absolute;inset:0;width:100%;height:100%}

/* boot */
#boot{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .7s ease}
#boot.hide{opacity:0;pointer-events:none}
.boot-mark{width:90px;height:90px}
.boot-mark .leaf{stroke:var(--copper);fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 2.2s ease forwards}
.boot-mark .stem{stroke:var(--sage);fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.8s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#boot h1{font-family:var(--font-d);font-weight:600;font-size:34px;letter-spacing:.18em;color:var(--copper-bright);opacity:0;animation:fadeUp .8s 1s forwards}
#boot .bar{width:200px;height:2px;background:var(--line);overflow:hidden;border-radius:2px}
#boot .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--copper),transparent);animation:load 1.4s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* desktop icons */
#icon-layer{position:absolute;inset:0;z-index:2}
.dicon{position:absolute;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:12px;text-align:center;transition:background .15s, box-shadow .15s, transform .12s cubic-bezier(.2,.9,.3,1.3);cursor:pointer}
.dicon:hover{background:rgba(217,160,91,0.08)}
.dicon.sel{background:rgba(217,160,91,0.16);box-shadow:0 0 0 1px var(--line2) inset}
.dicon .ico{width:52px;height:52px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.dicon .ico svg{width:48px;height:48px}
.dicon .lbl{font-size:11.5px;color:var(--mist);max-width:92px;word-break:break-word;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.8);padding:1px 4px;border-radius:5px}
.dicon.sel .lbl{background:var(--copper);color:var(--ink);text-shadow:none}
.dicon.dragging{opacity:.4}

/* selection box */
#selbox{position:absolute;border:1px solid var(--copper);background:rgba(217,160,91,0.1);z-index:50;display:none;pointer-events:none}

/* ===== WINDOWS ===== */
.win{position:absolute;min-width:280px;min-height:180px;background:var(--panel);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10;animation:winIn .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.win.closing{animation:winOut .18s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.96)}}
.win.max{border-radius:0}
.titlebar{height:42px;flex:0 0 42px;display:flex;align-items:center;padding:0 10px 0 14px;gap:10px;cursor:grab;background:linear-gradient(180deg,rgba(217,160,91,0.07),transparent);border-bottom:1px solid var(--line)}
.titlebar:active{cursor:grabbing}
.titlebar .tt-ico{width:18px;height:18px;flex:0 0 18px}
.titlebar .tt{font-family:var(--font-d);font-weight:600;font-size:14.5px;color:var(--copper-bright);letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtns{display:flex;gap:7px}
.wbtn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fog);transition:.13s}
.wbtn:hover{background:rgba(255,255,255,0.08);color:var(--mist)}
.wbtn.close:hover{background:var(--rust);color:#fff}
.wbtn svg{width:13px;height:13px}
.win-body{flex:1;overflow:auto;position:relative}
.resizer{position:absolute;z-index:5}
.rz-e{right:0;top:0;width:7px;height:100%;cursor:e-resize}
.rz-s{bottom:0;left:0;height:7px;width:100%;cursor:s-resize}
.rz-se{right:0;bottom:0;width:16px;height:16px;cursor:se-resize}
.rz-w{left:0;top:0;width:7px;height:100%;cursor:w-resize}
.rz-n{top:0;left:0;height:7px;width:100%;cursor:n-resize}

/* ===== TASKBAR / DOCK ===== */
#taskbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;height:60px;z-index:5000;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);max-width:96vw}
#start-btn{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--copper),var(--rust));box-shadow:0 4px 12px rgba(217,160,91,.35);transition:transform .15s}
#start-btn:hover{transform:translateY(-2px) scale(1.04)}
#start-btn svg{width:24px;height:24px}
.tb-sep{width:1px;height:30px;background:var(--line)}
#task-items{display:flex;gap:5px;overflow-x:auto;max-width:60vw;align-items:center}
#task-items::-webkit-scrollbar{display:none}
.task-item{height:44px;min-width:44px;padding:0 8px;border-radius:12px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.03);border:1px solid transparent;transition:.14s;position:relative;flex:0 0 auto}
.task-item:hover{background:rgba(217,160,91,0.12)}
.task-item.active{border-color:var(--line2);background:rgba(217,160,91,0.16)}
.task-item.active::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:14px;height:2.5px;border-radius:2px;background:var(--copper)}
.task-item svg{width:24px;height:24px}
.task-item .tl{font-size:11.5px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mist)}
#clock{font-family:var(--font-d);font-size:13px;color:var(--copper-bright);padding:0 8px;text-align:center;line-height:1.1;cursor:default;white-space:nowrap}
#clock small{display:block;font-family:var(--font-m);font-size:9px;color:var(--fog);letter-spacing:.05em}

/* ===== START MENU ===== */
#start-menu{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(12px);width:min(560px,94vw);max-height:70vh;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);z-index:5500;padding:20px;opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,.9,.3,1.1)}
#start-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#start-menu .sm-head{font-family:var(--font-d);font-size:20px;color:var(--copper-bright);margin-bottom:4px;letter-spacing:.04em}
#start-menu .sm-sub{font-size:11px;color:var(--fog);margin-bottom:16px}
.sm-search{width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--mist);font-size:13px;margin-bottom:16px;outline:none}
.sm-search:focus{border-color:var(--copper)}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;overflow-y:auto;max-height:42vh}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;transition:.13s;cursor:pointer}
.sm-app:hover{background:rgba(217,160,91,0.12);transform:translateY(-2px)}
.sm-app svg{width:38px;height:38px}
.sm-app span{font-size:11px;color:var(--mist);text-align:center}

/* ===== CONTEXT MENU ===== */
.ctx{position:fixed;z-index:7000;min-width:208px;background:var(--panel-solid);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;font-size:13px;animation:ctxIn .12s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--mist);transition:.1s;cursor:pointer}
.ctx-item:hover{background:var(--copper);color:var(--ink)}
.ctx-item.danger:hover{background:var(--rust);color:#fff}
.ctx-item svg{width:15px;height:15px;opacity:.85;flex:0 0 15px}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}

/* ===== generic app styles ===== */
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,0.15);flex-wrap:wrap}
.tbtn{padding:6px 11px;border-radius:8px;font-size:12px;background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--mist);transition:.12s;display:flex;align-items:center;gap:6px}
.tbtn:hover{background:var(--copper);color:var(--ink);border-color:var(--copper)}
.tbtn svg{width:14px;height:14px}
.tbtn.accent{background:var(--copper);color:var(--ink);border-color:var(--copper)}

/* file explorer */
.fe{display:flex;height:100%;flex-direction:column}
.fe-main{display:flex;flex:1;overflow:hidden}
.fe-side{width:190px;flex:0 0 190px;border-right:1px solid var(--line);padding:10px;overflow-y:auto;background:rgba(0,0,0,0.12)}
.fe-side h4{font-size:10px;letter-spacing:.12em;color:var(--fog);text-transform:uppercase;margin:12px 8px 6px}
.fe-side h4:first-child{margin-top:2px}
.side-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;color:var(--mist);transition:.1s;cursor:pointer}
.side-item:hover{background:rgba(217,160,91,0.1)}
.side-item.active{background:rgba(217,160,91,0.16);color:var(--copper-bright)}
.side-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.8}
.fe-content{flex:1;overflow:auto;padding:8px;position:relative}
.crumbs{display:flex;align-items:center;gap:3px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap;background:rgba(0,0,0,0.1)}
.crumb{padding:4px 8px;border-radius:7px;cursor:pointer;color:var(--fog);transition:.1s}
.crumb:hover{background:rgba(217,160,91,0.12);color:var(--mist)}
.crumb.last{color:var(--copper-bright)}
.crumb-sep{color:var(--line2);font-size:11px}
.fe-search{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:9px;padding:4px 10px}
.fe-search input{background:none;border:none;outline:none;color:var(--mist);font-size:12px;width:140px}
.list-head{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:8px;padding:6px 12px;font-size:10.5px;letter-spacing:.06em;color:var(--fog);text-transform:uppercase;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-solid);z-index:2}
.list-head .col{cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none}
.list-head .col:hover{color:var(--copper)}
.list-head .col svg{width:10px;height:10px;opacity:0}
.list-head .col.sorted svg{opacity:1}
.frow{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:8px;padding:7px 12px;font-size:12.5px;border-radius:8px;align-items:center;cursor:default;transition:background .08s}
.frow:hover{background:rgba(217,160,91,0.08)}
.frow.sel{background:rgba(217,160,91,0.2)}
.frow .nm{display:flex;align-items:center;gap:10px;overflow:hidden}
.frow .nm svg{width:22px;height:22px;flex:0 0 22px}
.frow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .meta{font-size:11px;color:var(--fog)}
.fe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:10px}
.fe-grid .gcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:11px;text-align:center;transition:.1s;cursor:default}
.fe-grid .gcell:hover{background:rgba(217,160,91,0.08)}
.fe-grid .gcell.sel{background:rgba(217,160,91,0.2)}
.fe-grid .gcell svg{width:42px;height:42px}
.fe-grid .gcell span{font-size:11px;word-break:break-word;line-height:1.2;max-width:90px}
.empty-note{padding:40px;text-align:center;color:var(--fog);font-size:13px;font-family:var(--font-d);font-style:italic}

/* notepad / code */
.editor{width:100%;height:100%;background:transparent;border:none;outline:none;resize:none;color:var(--mist);padding:16px;font-size:13.5px;line-height:1.7;tab-size:2}
.split{display:flex;height:100%}
.split>.editor{width:50%;border-right:1px solid var(--line)}
.split>iframe{width:50%;height:100%;border:none;background:#fff}

/* image viewer */
.imgview{display:flex;align-items:center;justify-content:center;height:100%;background:repeating-conic-gradient(#0a1614 0% 25%, #0d1d19 0% 50%) 50%/24px 24px;overflow:hidden}
.imgview img{max-width:100%;max-height:100%;transition:transform .15s;transform-origin:center}

/* media */
.mediaview{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;padding:20px;background:radial-gradient(circle at 50% 30%, var(--ink3), var(--ink))}
.mediaview audio,.mediaview video{width:100%;max-width:560px;border-radius:12px}
.mediaview .mt{font-family:var(--font-d);font-size:18px;color:var(--copper-bright);text-align:center}

/* calculator */
.calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:10px;background:radial-gradient(circle at 30% 0%, var(--ink3), var(--ink))}
.calc-disp{background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:right;flex:0 0 auto}
.calc-disp .hist{font-size:13px;color:var(--fog);min-height:18px;font-family:var(--font-m)}
.calc-disp .cur{font-family:var(--font-d);font-size:40px;color:var(--copper-bright);overflow:hidden;text-overflow:ellipsis}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.calc-grid button{border-radius:13px;font-size:19px;font-family:var(--font-d);background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--mist);transition:.1s}
.calc-grid button:hover{background:rgba(217,160,91,0.16)}
.calc-grid button:active{transform:scale(.95)}
.calc-grid button.op{color:var(--copper);background:rgba(217,160,91,0.1)}
.calc-grid button.eq{background:linear-gradient(145deg,var(--copper),var(--rust));color:var(--ink);grid-row:span 2}
.calc-grid button.fn{color:var(--rust);font-size:15px}

/* paint */
.paint{display:flex;flex-direction:column;height:100%}
.paint canvas{flex:1;background:#fff;touch-action:none;cursor:crosshair}
.paint .ptools{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.15);flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--copper-bright);transform:scale(1.1)}

/* settings */
.settings{padding:24px;overflow-y:auto;height:100%}
.settings h2{font-family:var(--font-d);font-size:24px;color:var(--copper-bright);margin-bottom:4px}
.settings .sub{font-size:12px;color:var(--fog);margin-bottom:24px}
.set-card{background:rgba(0,0,0,0.18);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.set-card h3{font-family:var(--font-d);font-size:16px;color:var(--mist);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.set-card h3 svg{width:18px;height:18px;color:var(--copper)}
.wallpaper-row{display:flex;gap:10px;flex-wrap:wrap}
.wp-thumb{width:90px;height:58px;border-radius:9px;cursor:pointer;border:2px solid transparent;overflow:hidden;transition:.12s;position:relative}
.wp-thumb canvas,.wp-thumb img{width:100%;height:100%;object-fit:cover}
.wp-thumb.on{border-color:var(--copper-bright)}
.wp-thumb:hover{transform:scale(1.04)}
.storage-bar{height:22px;border-radius:11px;background:rgba(0,0,0,0.3);overflow:hidden;display:flex;margin:10px 0 6px;border:1px solid var(--line)}
.storage-bar i{height:100%;transition:width .6s ease}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--fog);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:11px;height:11px;border-radius:3px;display:inline-block}

/* table view */
.tableview{height:100%;display:flex;flex-direction:column}
.tbl-wrap{flex:1;overflow:auto;padding:6px}
table.csv{border-collapse:collapse;font-size:12px;width:100%}
table.csv th,table.csv td{border:1px solid var(--line);padding:6px 10px;white-space:nowrap}
table.csv th{background:rgba(217,160,91,0.12);color:var(--copper-bright);position:sticky;top:0;font-family:var(--font-d)}
table.csv tr:nth-child(even) td{background:rgba(255,255,255,0.02)}

/* toast */
#toasts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel-solid);border:1px solid var(--line2);border-radius:11px;padding:11px 18px;font-size:12.5px;color:var(--mist);box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:88vw;display:flex;align-items:center;gap:9px}
.toast svg{width:16px;height:16px;color:var(--copper);flex:0 0 16px}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* modal/prompt */
#modal-bg{position:fixed;inset:0;z-index:8000;background:rgba(5,12,11,0.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
.modal{background:var(--panel-solid);border:1px solid var(--line2);border-radius:16px;padding:24px;width:min(420px,92vw);box-shadow:var(--shadow);animation:winIn .2s ease}
.modal h3{font-family:var(--font-d);font-size:19px;color:var(--copper-bright);margin-bottom:8px}
.modal p{font-size:13px;color:var(--fog);margin-bottom:16px;line-height:1.5}
.modal input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--mist);font-size:13px;outline:none;margin-bottom:18px}
.modal input:focus{border-color:var(--copper)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-btns button{padding:9px 18px;border-radius:10px;font-size:13px;border:1px solid var(--line)}
.modal-btns .ok{background:var(--copper);color:var(--ink);border-color:var(--copper)}
.modal-btns .cancel{color:var(--fog)}
.modal-btns .ok:hover{background:var(--copper-bright)}

/* drop highlight */
.drop-active{outline:2px dashed var(--copper) !important;outline-offset:-6px;background:rgba(217,160,91,0.06) !important}
.frow.droptarget,.gcell.droptarget,.dicon.droptarget{background:rgba(217,160,91,0.3)!important;box-shadow:0 0 0 2px var(--copper) inset}

/* mobile */
@media (max-width:760px){
  .dicon{width:78px}
  .dicon .ico svg{width:42px;height:42px}

<script>
/* ============================================================
   VFS — Virtual File System over OPFS with mount routing
============================================================ */
const VFS = (()=> {
  let root=null, ready=false;
  const mounts = {}; // path -> backend
  async function init(){
    try{
      root = await navigator.storage.getDirectory();
      ready=true;
      // seed default tree
      await ensureDir('/Desktop');
      await ensureDir('/Documents');
      await ensureDir('/Pictures');
      await ensureDir('/Music');
      await ensureDir('/mnt');
      await ensureDir('/mnt/local');
      const seeded = localStorage.getItem('verdant_seeded');
      if(!seeded){ await seed(); localStorage.setItem('verdant_seeded','1'); }
    }catch(e){ console.error('OPFS unavailable',e); ready=false; throw e; }
  }
  function norm(p){ p=p.replace(/\\/g,'/'); if(!p.startsWith('/'))p='/'+p; p=p.replace(/\/+/g,'/'); if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1); return p; }
  function parts(p){ p=norm(p); return p==='/'?[]:p.slice(1).split('/'); }
  function findMount(p){ p=norm(p); for(const mp in mounts){ if(p===mp||p.startsWith(mp+'/')) return {mp, be:mounts[mp], sub:p.slice(mp.length)||'/'}; } return null; }
  function addMount(path, backend){ mounts[norm(path)]=backend; }
  function removeMount(path){ delete mounts[norm(path)]; }
  function listMounts(){ return Object.keys(mounts); }

  async function dirHandle(p, create=false){
    let dir=root;
    for(const seg of parts(p)){ dir = await dir.getDirectoryHandle(seg, {create}); }
    return dir;
  }
  async function parentAndName(p){
    const ps=parts(p); const name=ps.pop();
    let dir=root;
    for(const seg of ps){ dir=await dir.getDirectoryHandle(seg,{create:false}); }
    return {dir,name};
  }
  async function ensureDir(p){ const m=findMount(p); if(m) return m.be.mkdir(m.sub); await dirHandle(p,true); }

  // ===== Public API =====
  async function mkdir(p){ const m=findMount(p); if(m) return m.be.mkdir(m.sub); await dirHandle(p,true); }
  async function exists(p){
    const m=findMount(p); if(m) return m.be.exists(m.sub);
    try{ const {dir,name}=await parentAndName(p);
      for await(const [n] of dir.entries()){ if(n===name) return true; }
      return parts(p).length===0;
    }catch(e){ return false; }
  }
  async function stat(p){
    const m=findMount(p); if(m) return m.be.stat(m.sub);
    p=norm(p);
    if(parts(p).length===0) return {name:'/',isDir:true,isDirectory:true,size:0,mtime:Date.now()};
    const {dir,name}=await parentAndName(p);
    for await(const [n,h] of dir.entries()){
      if(n===name){
        if(h.kind==='directory') return {name,isDir:true,isDirectory:true,size:0,mtime:Date.now()};
        const f=await h.getFile();
        return {name,isDir:false,isDirectory:false,size:f.size,mtime:f.lastModified,type:f.type};
      }
    }
    throw new Error('ENOENT '+p);
  }
  async function readdir(p){
    const m=findMount(p); if(m) return m.be.readdir(m.sub);
    const dir=await dirHandle(p,false);
    const out=[];
    for await(const [n,h] of dir.entries()){
      if(h.kind==='directory'){ out.push({name:n,isDir:true,size:0,mtime:Date.now(),type:'directory'}); }
      else { try{ const f=await h.getFile(); out.push({name:n,isDir:false,size:f.size,mtime:f.lastModified,type:f.type}); }catch(e){ out.push({name:n,isDir:false,size:0,mtime:Date.now()}); } }
    }
    return out;
  }
  async function readFile(p, opt){
    const m=findMount(p); if(m) return m.be.readFile(m.sub,opt);
    const {dir,name}=await parentAndName(p);
    const fh=await dir.getFileHandle(name,{create:false});
    const f=await fh.getFile();
    if(opt==='text'||opt&&opt.encoding==='utf8') return f.text();
    return f.arrayBuffer();
  }
  async function readBlob(p){
    const m=findMount(p); if(m){ const ab=await m.be.readFile(m.sub); const st=await m.be.stat(m.sub); return new Blob([ab],{type:st.type||''}); }
    const {dir,name}=await parentAndName(p);
    const fh=await dir.getFileHandle(name,{create:false});
    return await fh.getFile();
  }
  async function writeFile(p, data){
    const m=findMount(p); if(m) return m.be.writeFile(m.sub,data);
    const {dir,name}=await parentAndName(p);
    const fh=await dir.getFileHandle(name,{create:true});
    const w=await fh.createWritable();
    await w.write(data); await w.close();
  }
  async function unlink(p){
    const m=findMount(p); if(m) return m.be.unlink(m.sub);
    const {dir,name}=await parentAndName(p);
    await dir.removeEntry(name,{recursive:true});
  }
  const rmdir=unlink, rm=unlink, del=unlink;
  async function rename(oldP,newP){
    const so=await stat(oldP);
    if(so.isDir){ await copyDir(oldP,newP); await unlink(oldP); }
    else { const data=await readFile(oldP); await writeFile(newP,data); await unlink(oldP); }
  }
  async function copyDir(src,dst){
    await mkdir(dst);
    const items=await readdir(src);
    for(const it of items){
      const s=src+'/'+it.name, d=dst+'/'+it.name;
      if(it.isDir) await copyDir(s,d);
      else { const data=await readFile(s); await writeFile(d,data); }
    }
  }
  async function copy(src,dst){
    const s=await stat(src);
    if(s.isDir) await copyDir(src,dst);
    else { const data=await readFile(src); await writeFile(dst,data); }
  }

<script>
/* ============================================================
   Local Folder backend (File System Access API)
   Wraps a real directory handle to match VFS interface.
============================================================ */
function makeLocalBackend(dirHandle){
  async function resolve(sub, create=false, wantFile=false){
    sub=sub.replace(/^\/+/,'');
    if(sub===''){ return {handle:dirHandle, parent:null, name:dirHandle.name}; }
    const segs=sub.split('/');
    let dir=dirHandle, parent=null, name=null;
    for(let i=0;i<segs.length;i++){
      name=segs[i]; const last=i===segs.length-1;
      parent=dir;
      if(last) return {parent, name};
      dir=await dir.getDirectoryHandle(name,{create});
    }
    return {parent, name};
  }
  return {
    async mkdir(sub){ const{parent,name}=await resolve(sub,true); if(name) await parent.getDirectoryHandle(name,{create:true}); },
    async exists(sub){ try{ const{parent,name}=await resolve(sub); if(!name)return true;
      for await(const [n] of parent.entries()){ if(n===name)return true; } return false; }catch(e){return false;} },
    async stat(sub){ const{parent,name}=await resolve(sub);
      if(!name) return {name:dirHandle.name,isDir:true,isDirectory:true,size:0,mtime:Date.now()};
      for await(const [n,h] of parent.entries()){ if(n===name){
        if(h.kind==='directory') return {name,isDir:true,isDirectory:true,size:0,mtime:Date.now()};
        const f=await h.getFile(); return {name,isDir:false,isDirectory:false,size:f.size,mtime:f.lastModified,type:f.type};
      }}
      throw new Error('ENOENT'); },
    async readdir(sub){ const{parent,name}=await resolve(sub);
      let dir=parent;
      if(name){ dir=await parent.getDirectoryHandle(name,{create:false}); }
      const out=[];
      for await(const [n,h] of dir.entries()){
        if(h.kind==='directory') out.push({name:n,isDir:true,size:0,mtime:Date.now(),type:'directory'});
        else { try{const f=await h.getFile(); out.push({name:n,isDir:false,size:f.size,mtime:f.lastModified,type:f.type});}catch(e){out.push({name:n,isDir:false,size:0,mtime:Date.now()});} }
      }
      return out; },
    async readFile(sub,opt){ const{parent,name}=await resolve(sub);
      const fh=await parent.getFileHandle(name,{create:false}); const f=await fh.getFile();
      if(opt==='text'||opt&&opt.encoding==='utf8') return f.text(); return f.arrayBuffer(); },
    async writeFile(sub,data){ const{parent,name}=await resolve(sub,true);
      const fh=await parent.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(data); await w.close(); },
    async unlink(sub){ const{parent,name}=await resolve(sub); await parent.removeEntry(name,{recursive:true}); },
    async rmdir(sub){ return this.unlink(sub); }
  };
}
</script>
<script>
/* ============================================================
   Helpers: file types, formatting, toast, modal
============================================================ */
function ext(name){ const i=name.lastIndexOf('.'); return i<0?'':name.slice(i+1).toLowerCase(); }
function baseName(p){ return p.split('/').filter(Boolean).pop()||'/'; }
function dirName(p){ const ps=fs.parts(p); ps.pop(); return '/'+ps.join('/'); }
const TYPE={
  img:['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'],
  audio:['mp3','wav','ogg','flac','aac','m4a','opus'],
  video:['mp4','webm','ogv','mov','m4v'],
  text:['txt','md','log','yaml','yml','ini','conf','rtf'],
  code:['js','css','json','xml','ts','jsx','tsx','py','c','cpp','java','sh','php','rb','go','rs','toml','sql'],
  html:['html','htm'],
  csv:['csv','tsv'],
  zip:['zip','gz','tar','tgz'],
  pdf:['pdf'],
};
function fileKind(name){ const e=ext(name); for(const k in TYPE){ if(TYPE[k].includes(e)) return k; } return 'bin'; }
function iconFor(item){
  if(item.isDir) return 'folder';
  const k=fileKind(item.name);
  return ({img:'img',audio:'audio',video:'video',html:'html',code:'code',text:'txt',csv:'csv',zip:'zip',pdf:'pdf'})[k]||'file';
}
function fmtSize(b){ if(b===0||b==null)return '—'; const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return (i?b.toFixed(1):b)+' '+u[i]; }
function fmtDate(t){ if(!t)return '—'; const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function typeLabel(item){ if(item.isDir)return '文件夹'; const e=ext(item.name); return e?e.toUpperCase()+' 文件':'文件'; }

function toast(msg,iconName='check'){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=ico(iconName)+`<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateY(8px)';setTimeout(()=>t.remove(),300);},2400);
}
function modal({title,desc,value='',placeholder='',ok='确定',input=true}){
  return new Promise(res=>{
    const bg=document.getElementById('modal-bg'), m=document.getElementById('modal');
    m.innerHTML=`<h3>${title}</h3>${desc?`<p>${desc}</p>`:''}${input?`<input id="m-in" placeholder="${placeholder}" value="${value.replace(/"/g,'&quot;')}">`:''}<div class="modal-btns"><button class="cancel">取消</button><button class="ok">${ok}</button></div>`;
    bg.style.display='flex';
    const inp=m.querySelector('#m-in');
    if(inp){ inp.focus(); inp.select(); inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value);if(e.key==='Escape')done(null);}; }
    const done=v=>{ bg.style.display='none'; res(v); };
    m.querySelector('.ok').onclick=()=>done(input?inp.value:true);
    m.querySelector('.cancel').onclick=()=>done(null);
    bg.onclick=e=>{ if(e.target===bg)done(null); };
  });
}
function confirmModal(title,desc,ok='确定'){
  return new Promise(res=>{
    const bg=document.getElementById('modal-bg'), m=document.getElementById('modal');
    m.innerHTML=`<h3>${title}</h3><p>${desc}</p><div class="modal-btns"><button class="cancel">取消</button><button class="ok">${ok}</button></div>`;
    bg.style.display='flex';
    const done=v=>{bg.style.display='none';res(v);};
    m.querySelector('.ok').onclick=()=>done(true);
    m.querySelector('.cancel').onclick=()=>done(false);
    bg.onclick=e=>{if(e.target===bg)done(false);};
  });
}
</script>

<script>
/* ============================================================
   WINDOW MANAGER
============================================================ */
const WM = (()=>{
  let z=20; const wins={}; let idc=0;
  const isMobile=()=>window.innerWidth<=760;
  function focus(w){ z++; w.el.style.zIndex=z; document.querySelectorAll('.win').forEach(e=>e.dataset.focus='0'); w.el.dataset.focus='1'; updateTask(); }
  function open({title,iconName,width=560,height=420,content,onMount,appId}){
    const id='w'+(idc++);
    const el=document.createElement('div'); el.className='win'; el.dataset.appId=appId||'';
    let x= isMobile()?0 : Math.max(20,(window.innerWidth-width)/2 + (Object.keys(wins).length%5)*26 - 60);
    let y= isMobile()?0 : Math.max(20,(window.innerHeight-height)/2 + (Object.keys(wins).length%5)*26 - 60);
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=width+'px'; el.style.height=height+'px';
    el.innerHTML=`<div class="titlebar"><div class="tt-ico">${ico(iconName)}</div><div class="tt">${title}</div><div class="wbtns"><button class="wbtn min" title="最小化">${ico('min')}</button><button class="wbtn maxb" title="最大化">${ico('max')}</button><button class="wbtn close" title="关闭">${ico('close')}</button></div></div><div class="win-body"></div><div class="resizer rz-e"></div><div class="resizer rz-s"></div><div class="resizer rz-se"></div><div class="resizer rz-w"></div><div class="resizer rz-n"></div>`;
    document.getElementById('desktop').appendChild(el);
    const body=el.querySelector('.win-body');
    if(typeof content==='string') body.innerHTML=content; else if(content) body.appendChild(content);
    const w={id,el,body,title,iconName,min:false,max:false,appId,prevRect:null};
    wins[id]=w;
    if(isMobile()){ maximize(w,true); }
    focus(w);
    // drag
    const tb=el.querySelector('.titlebar');
    dragMove(tb,el,w);
    // buttons
    el.querySelector('.close').onclick=()=>close(w);
    el.querySelector('.min').onclick=()=>minimize(w);
    el.querySelector('.maxb').onclick=()=>toggleMax(w);
    tb.ondblclick=()=>toggleMax(w);
    el.addEventListener('pointerdown',()=>focus(w),true);
    // resizers
    ['e','s','se','w','n'].forEach(d=>resizeHandle(el.querySelector('.rz-'+d),el,d,w));
    if(onMount) onMount(body,w);
    updateTask();
    return w;
  }
  function close(w){ w.el.classList.add('closing'); setTimeout(()=>{w.el.remove(); delete wins[w.id]; updateTask();},170); if(w.onClose)w.onClose(); }
  function minimize(w){ w.min=true; w.el.style.display='none'; updateTask(); }
  function restore(w){ w.min=false; w.el.style.display='flex'; focus(w); }
  function maximize(w,silent){ if(w.max)return; w.prevRect={l:w.el.style.left,t:w.el.style.top,wd:w.el.style.width,h:w.el.style.height}; w.el.classList.add('max'); const tbH=isMobile()?64:0; w.el.style.left='0'; w.el.style.top='0'; w.el.style.width='100vw'; w.el.style.height=`calc(100vh - ${isMobile()?64:18}px)`; w.max=true; }
  function unmaximize(w){ if(!w.max)return; w.el.classList.remove('max'); const r=w.prevRect; if(r){w.el.style.left=r.l;w.el.style.top=r.t;w.el.style.width=r.wd;w.el.style.height=r.h;} w.max=false; }
  function toggleMax(w){ w.max?unmaximize(w):maximize(w); }
  function dragMove(handle,el,w){
    let sx,sy,ox,oy,drag=false;
    handle.addEventListener('pointerdown',e=>{
      if(e.target.closest('.wbtn'))return;
      if(w.max && !isMobile()){ /* allow un-max on drag */ }
      drag=true; sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop; handle.setPointerCapture(e.pointerId); focus(w);
    });
    handle.addEventListener('pointermove',e=>{
      if(!drag)return;
      if(w.max){ unmaximize(w); ox=e.clientX-el.offsetWidth/2; oy=e.clientY-20; sx=e.clientX; sy=e.clientY; }
      let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
      ny=Math.max(0,ny); nx=Math.max(-el.offsetWidth+80,Math.min(window.innerWidth-60,nx));
      el.style.left=nx+'px'; el.style.top=ny+'px';
    });
    handle.addEventListener('pointerup',e=>{drag=false;try{handle.releasePointerCapture(e.pointerId);}catch(_){}});
  }
  function resizeHandle(h,el,dir,w){
    if(!h)return; let sx,sy,ow,oh,ol,ot,act=false;
    h.addEventListener('pointerdown',e=>{e.stopPropagation();act=true;sx=e.clientX;sy=e.clientY;ow=el.offsetWidth;oh=el.offsetHeight;ol=el.offsetLeft;ot=el.offsetTop;h.setPointerCapture(e.pointerId);focus(w);});
    h.addEventListener('pointermove',e=>{ if(!act)return; const dx=e.clientX-sx,dy=e.clientY-sy;
      if(dir.includes('e')) el.style.width=Math.max(280,ow+dx)+'px';
      if(dir.includes('s')) el.style.height=Math.max(180,oh+dy)+'px';
      if(dir.includes('w')){ const nw=Math.max(280,ow-dx); el.style.width=nw+'px'; el.style.left=ol+(ow-nw)+'px'; }
      if(dir.includes('n')){ const nh=Math.max(180,oh-dy); el.style.height=nh+'px'; el.style.top=ot+(oh-nh)+'px'; }
    });
    h.addEventListener('pointerup',e=>{act=false;try{h.releasePointerCapture(e.pointerId);}catch(_){}});
  }
  function updateTask(){
    const c=document.getElementById('task-items'); c.innerHTML='';
    Object.values(wins).forEach(w=>{
      const t=document.createElement('div'); t.className='task-item'+(w.el.dataset.focus==='1'&&!w.min?' active':'');
      t.innerHTML=ico(w.iconName)+`<span class="tl">${w.title}</span>`;
      t.onclick=()=>{ if(w.min) restore(w); else if(w.el.dataset.focus==='1'){ minimize(w); } else focus(w); };
      c.appendChild(t);
    });
  }
  return {open,close,focus,wins};
})();
</script>

<script>
/* ============================================================
   APP REGISTRY
============================================================ */
const APPS={};
function registerApp(id,def){ APPS[id]=def; }

/* ---- open path: stat-based dispatch ---- */
async function openPath(path){
  let st;
  try{ st=await fs.stat(path); }catch(e){ toast('无法访问：'+baseName(path),'close'); return; }
  if(st.isDir){ launchApp('explorer',{path}); return; }
  const k=fileKind(baseName(path));
  if(k==='img') launchApp('imgview',{path});
  else if(k==='audio'||k==='video') launchApp('media',{path,kind:k});
  else if(k==='pdf') launchApp('pdfview',{path});
  else if(k==='html') launchApp('htmledit',{path});
  else if(k==='csv') launchApp('table',{path});
  else if(k==='zip') zipAction(path);
  else launchApp('notepad',{path}); // text/code/bin fallback => text
}
function launchApp(id,opts={}){ const a=APPS[id]; if(!a){toast('未知应用','close');return;} a.launch(opts); closeStart(); }
</script>

<script>
/* ============================================================
   APP: FILE EXPLORER
============================================================ */
registerApp('explorer',{name:'文件管理器',icon:'explorer',launch(opts={}){
  const state={path:opts.path||'/',hist:[opts.path||'/'],hi:0,sortKey:'name',sortDir:1,view:'list',sel:new Set(),search:''};
  const win=WM.open({title:'文件管理器',iconName:'explorer',width:780,height:520,appId:'explorer',content:buildShell(),onMount(body,w){ wire(body,w); body.__render=render; render(); }});
  function buildShell(){
    return `<div class="fe">
      <div class="toolbar">
        <button class="tbtn nav-back" title="后退">${ico('back')}</button>
        <button class="tbtn nav-fwd" title="前进">${ico('fwd')}</button>
        <button class="tbtn nav-up" title="上级">${ico('up')}</button>
        <button class="tbtn nav-ref" title="刷新">${ico('refresh')}</button>

        <button class="tbtn nf" title="新建文件夹">${ico('newfolder')}</button>
        <button class="tbtn nfile" title="新建文件">${ico('newfile')}</button>
        <button class="tbtn up-btn" title="上传">${ico('upload')}</button>
        <button class="tbtn mount-btn" title="挂载本地文件夹">${ico('mount')}</button>
        <button class="tbtn view-btn" title="切换视图">${ico('eye')}</button>
        <div class="fe-search">${ico('search')}<input class="search-in" placeholder="搜索…"></div>
      </div>
      <div class="crumbs"></div>
      <div class="fe-main">
        <div class="fe-side"></div>
        <div class="fe-content"></div>
      </div>
    </div>`;
  }
  function wire(body,w){
    state.win=w; state.body=body;
    body.querySelector('.nav-back').onclick=()=>{ if(state.hi>0){state.hi--;state.path=state.hist[state.hi];render();} };
    body.querySelector('.nav-fwd').onclick=()=>{ if(state.hi<state.hist.length-1){state.hi++;state.path=state.hist[state.hi];render();} };
    body.querySelector('.nav-up').onclick=()=>{ if(state.path!=='/')nav(dirName(state.path)); };
    body.querySelector('.nav-ref').onclick=render;
    body.querySelector('.nf').onclick=()=>newFolder();
    body.querySelector('.nfile').onclick=()=>newFile();
    body.querySelector('.up-btn').onclick=()=>uploadTo(state.path,render);
    body.querySelector('.mount-btn').onclick=()=>mountLocal().then(render);
    body.querySelector('.view-btn').onclick=()=>{ state.view=state.view==='list'?'grid':'list'; render(); };
    body.querySelector('.side-toggle').onclick=()=>body.querySelector('.fe-side').classList.toggle('show');
    const si=body.querySelector('.search-in'); si.oninput=()=>{ state.search=si.value.trim().toLowerCase(); render(); };
    // drop zone (import from physical)
    const content=body.querySelector('.fe-content');
    content.addEventListener('dragover',e=>{ e.preventDefault(); content.classList.add('drop-active'); });
    content.addEventListener('dragleave',e=>{ if(e.target===content)content.classList.remove('drop-active'); });
    content.addEventListener('drop',async e=>{ e.preventDefault(); content.classList.remove('drop-active');
      if(handleInternalDrop(e,state.path)){render();return;}
      await importDataTransfer(e.dataTransfer,state.path); render(); });
  }
  function nav(p){ state.path=p; state.hist=state.hist.slice(0,state.hi+1); state.hist.push(p); state.hi++; state.sel.clear(); render(); }
  state._nav=nav;
  async function render(){
    const body=state.body; if(!body)return;

    if(state.search) items=items.filter(i=>i.name.toLowerCase().includes(state.search));
    items.sort((a,b)=>{ if(a.isDir!==b.isDir)return a.isDir?-1:1; let r=0; const k=state.sortKey;
      if(k==='name')r=a.name.localeCompare(b.name);
      else if(k==='size')r=(a.size||0)-(b.size||0);
      else if(k==='mtime')r=(a.mtime||0)-(b.mtime||0);
      else if(k==='type')r=typeLabel(a).localeCompare(typeLabel(b));
      return r*state.sortDir; });
    if(state.view==='grid') renderGrid(content,items);
    else renderList(content,items);
  }
  function renderCrumbs(body){

  function renderSide(body){

    places.forEach(([p,n,ic])=>{ html+=`<div class="side-item${state.path===p?' active':''}" data-p="${p}">${ico(ic)}<span>${n}</span></div>`; });
    html+=`<h4>设备 / 挂载</h4>`;

    const mts=fs.listMounts();

    s.innerHTML=html;
    s.querySelectorAll('.side-item').forEach(el=>{ el.onclick=()=>{nav(el.dataset.p); body.querySelector('.fe-side').classList.remove('show');};
      if(el.dataset.mount){ el.oncontextmenu=ev=>{ ev.preventDefault(); ctxMenu(ev.clientX,ev.clientY,[{label:'卸载',icon:'close',danger:true,fn:async()=>{ fs.removeMount(el.dataset.mount); if(state.path.startsWith(el.dataset.mount))nav('/mnt/local'); else render(); toast('已卸载'); }}]); }; }
    });
  }
  function renderList(content,items){
    const arrow=state.sortDir>0?ico('arrow'):ico('arrowD');
    let html=`<div class="list-head">
      <div class="col cname ${state.sortKey==='name'?'sorted':''}" data-k="name">名称 ${arrow}</div>

      <div class="col csize ${state.sortKey==='size'?'sorted':''}" data-k="size">大小 ${arrow}</div></div>`;
    if(!items.length) html+=`<div class="empty-note">${state.search?'未找到匹配项':'此文件夹为空'}</div>`;
    items.forEach(it=>{ const p=fs.norm(state.path+'/'+it.name);
      html+=`<div class="frow" data-p="${p}" data-dir="${it.isDir}" data-name="${it.name}" draggable="true">
        <div class="nm">${ico(iconFor(it))}<span>${it.name}</span></div>
        <div class="meta cdate">${fmtDate(it.mtime)}</div>
        <div class="meta ctype">${typeLabel(it)}</div>
        <div class="meta csize">${it.isDir?'—':fmtSize(it.size)}</div></div>`; });
    content.innerHTML=html;
    content.querySelectorAll('.list-head .col').forEach(c=>c.onclick=()=>{ const k=c.dataset.k; if(state.sortKey===k)state.sortDir*=-1; else {state.sortKey=k;state.sortDir=1;} render(); });
    bindRows(content);
  }
  function renderGrid(content,items){
    let html=`<div class="fe-grid">`;
    if(!items.length) html=`<div class="empty-note">${state.search?'未找到匹配项':'此文件夹为空'}</div>`;
    else { items.forEach(it=>{ const p=fs.norm(state.path+'/'+it.name);
      html+=`<div class="gcell frow" data-p="${p}" data-dir="${it.isDir}" data-name="${it.name}" draggable="true">${ico(iconFor(it))}<span>${it.name}</span></div>`; });
      html+=`</div>`; }
    content.innerHTML=html; bindRows(content);
  }
  function bindRows(content){
    content.querySelectorAll('.frow[data-p]').forEach(row=>{
      const p=row.dataset.p, isDir=row.dataset.dir==='true';
      row.onclick=e=>{ if(!e.ctrlKey&&!e.metaKey){ content.querySelectorAll('.frow.sel').forEach(r=>r.classList.remove('sel')); state.sel.clear(); }
        row.classList.toggle('sel'); if(row.classList.contains('sel'))state.sel.add(p); else state.sel.delete(p); };
      row.ondblclick=()=>{ if(isDir)nav(p); else openPath(p); };
      row.oncontextmenu=e=>{ e.preventDefault(); if(!row.classList.contains('sel')){ content.querySelectorAll('.frow.sel').forEach(r=>r.classList.remove('sel')); state.sel.clear(); row.classList.add('sel'); state.sel.add(p);} rowMenu(e,p,isDir,row); };
      // drag out / move
      row.addEventListener('mouseenter',()=>preloadDrag(p,row.dataset.name,isDir));
      row.addEventListener('dragstart',e=>dragStartItem(e,p,row.dataset.name,isDir));
      row.addEventListener('dragend',cleanupDrag);
      if(isDir){
        row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('droptarget');});
        row.addEventListener('dragleave',()=>row.classList.remove('droptarget'));
        row.addEventListener('drop',async e=>{ e.preventDefault();e.stopPropagation();row.classList.remove('droptarget');
          if(handleInternalDrop(e,p)){render();return;}
          await importDataTransfer(e.dataTransfer,p); render(); });
      }
    });
    // background context
    content.oncontextmenu=e=>{ if(e.target.closest('.frow'))return; e.preventDefault(); ctxMenu(e.clientX,e.clientY,[
      {label:'新建文件夹',icon:'newfolder',fn:newFolder},
      {label:'新建文本文件',icon:'newfile',fn:newFile},
      {label:'上传文件…',icon:'upload',fn:()=>uploadTo(state.path,render)},
      {sep:true},
      {label:'粘贴',icon:'paste',disabled:!clipboard,fn:()=>doPaste(state.path)},
      {label:'刷新',icon:'refresh',fn:render},
    ]); };
  }
  function rowMenu(e,p,isDir,row){
    const items=[{label:'打开',icon:'open',fn:()=>isDir?nav(p):openPath(p)}];
    if(!isDir){ const k=fileKind(baseName(p));
      if(k==='html'){ items.push({label:'用浏览器打开',icon:'browser',fn:()=>launchApp('browser',{path:p})}); items.push({label:'编辑源代码',icon:'code',fn:()=>launchApp('notepad',{path:p})}); }
      if(k==='zip') items.push({label:'解压到此处',icon:'zip',fn:()=>zipAction(p).then(render)});
      items.push({label:'以文本打开',icon:'txt',fn:()=>launchApp('notepad',{path:p})});
    }
    items.push({sep:true});
    items.push({label:'复制',icon:'copy',fn:()=>{clipboard={op:'copy',paths:[...state.sel]};toast('已复制');}});
    items.push({label:'剪切',icon:'paste',fn:()=>{clipboard={op:'cut',paths:[...state.sel]};toast('已剪切');}});
    items.push({label:'重命名',icon:'rename',fn:()=>doRename(p)});
    items.push({label:'下载 / 导出',icon:'download',fn:()=>exportPath(p)});
    items.push({sep:true});
    items.push({label:'删除',icon:'trash',danger:true,fn:()=>doDelete([...state.sel])});
    ctxMenu(e.clientX,e.clientY,items);
  }
  async function newFolder(){ const n=await modal({title:'新建文件夹',placeholder:'文件夹名称',value:'新建文件夹'}); if(!n)return; await fs.mkdir(state.path+'/'+n); render(); }
  async function newFile(){ const n=await modal({title:'新建文本文件',placeholder:'文件名',value:'新建文档.txt'}); if(!n)return; await fs.writeFile(state.path+'/'+n,''); render(); }
  async function doRename(p){ const n=await modal({title:'重命名',value:baseName(p)}); if(!n||n===baseName(p))return; await fs.rename(p,dirName(p)+'/'+n); render(); }
  async function doDelete(paths){ if(!paths.length)return; const ok=await confirmModal('确认删除',`删除选中的 ${paths.length} 个项目？此操作不可恢复。`,'删除'); if(!ok)return; for(const p of paths){ try{await fs.unlink(p);}catch(e){} } state.sel.clear(); render(); toast('已删除'); }
  async function doPaste(dst){ if(!clipboard)return; for(const src of clipboard.paths){ const target=dst+'/'+baseName(src); try{ await fs.copy(src,target); if(clipboard.op==='cut')await fs.unlink(src); }catch(e){console.error(e);} } if(clipboard.op==='cut')clipboard=null; render(); toast('已粘贴'); }
  state.render=render;
}});

/* shared clipboard */
let clipboard=null;

/* ============================================================
   DRAG & DROP — unified HTML5 native, bidirectional
============================================================ */
const dragCache=new Map();       // path -> File (preloaded)
const blobUrls=[];
let internalDragData=null;       // {path,name,isDir}

async function preloadDrag(path,name,isDir){
  if(isDir||dragCache.has(path))return;
  try{ const blob=await fs.readBlob(path); const file=new File([blob],name,{type:blob.type||'application/octet-stream'}); dragCache.set(path,file); }catch(e){}
}
function dragStartItem(e,path,name,isDir){
  internalDragData={path,name,isDir};
  e.dataTransfer.effectAllowed='all';
  e.dataTransfer.setData('application/x-verdant',JSON.stringify({path,name,isDir}));
  if(!isDir && dragCache.has(path)){
    const file=dragCache.get(path);
    try{ e.dataTransfer.items.add(file); }catch(_){}
    const url=URL.createObjectURL(file); blobUrls.push(url);
    e.dataTransfer.setData('DownloadURL',`${file.type||'application/octet-stream'}:${name}:${url}`);
  }
}
function cleanupDrag(){
  internalDragData=null;
  setTimeout(()=>{ while(blobUrls.length)URL.revokeObjectURL(blobUrls.pop()); },5500);
}
/* internal move: returns true if handled */
function handleInternalDrop(e,destDir){
  const raw=e.dataTransfer.getData('application/x-verdant');
  if(!raw)return false;
  try{ const d=JSON.parse(raw);
    const target=fs.norm(destDir+'/'+d.name);
    if(fs.norm(dirName(d.path))===fs.norm(destDir))return true; // same place
    if(d.isDir && target.startsWith(d.path))return true; // into itself
    (async()=>{ try{ await fs.copy(d.path,target); await fs.unlink(d.path); toast('已移动'); refreshAllExplorers(); refreshDesktop(); }catch(err){console.error(err);toast('移动失败','close');} })();
    return true;
  }catch(err){return false;}
}
/* import from physical (DataTransfer items) */
async function importDataTransfer(dt,destDir){
  if(!dt)return;
  const items=dt.items;
  if(items&&items.length&&items[0].webkitGetAsEntry){
    const entries=[];
    for(let i=0;i<items.length;i++){ if(items[i].kind==='file'){ const en=items[i].webkitGetAsEntry&&items[i].webkitGetAsEntry(); if(en)entries.push(en); } }
    if(entries.length){ toast('正在导入…','upload'); for(const en of entries) await importEntry(en,destDir); toast('导入完成'); return; }
  }
  // fallback: files
  if(dt.files&&dt.files.length){ toast('正在导入…','upload'); for(const f of dt.files){ const buf=await f.arrayBuffer(); await fs.writeFile(destDir+'/'+f.name,buf); } toast('导入完成'); }
}
async function importEntry(entry,destDir){
  if(entry.isFile){
    await new Promise(res=>entry.file(async f=>{ const buf=await f.arrayBuffer(); await fs.writeFile(destDir+'/'+entry.name,buf); res(); },res));
  } else if(entry.isDirectory){
    const newDir=destDir+'/'+entry.name; await fs.mkdir(newDir);
    const reader=entry.createReader(); let all=[];
    await new Promise(res=>{ const read=()=>reader.readEntries(async ents=>{ if(!ents.length){ res(); return; } all=all.concat(ents); read(); },res); read(); });
    for(const ch of all) await importEntry(ch,newDir);
  }
}
/* export / download */
async function exportPath(p){
  const st=await fs.stat(p);
  if(st.isDir){ toast('请逐个导出文件夹内文件（或在文件夹内多选）','close'); return; }
  const blob=await fs.readBlob(p); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=baseName(p); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast('已导出 '+baseName(p),'download');
}

/* upload via picker */
function uploadTo(destDir,cb){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=async()=>{ for(const f of inp.files){ const buf=await f.arrayBuffer(); await fs.writeFile(destDir+'/'+f.name,buf); } toast('已上传 '+inp.files.length+' 个文件'); cb&&cb(); refreshDesktop(); };
  inp.click();
}

/* mount local folder */
async function mountLocal(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持本地挂载','close'); return; }
  try{
    const handle=await window.showDirectoryPicker();
    const mp='/mnt/local/'+handle.name;
    fs.addMount(mp,makeLocalBackend(handle));
    // remember name for re-mount prompt
    const remembered=JSON.parse(localStorage.getItem('verdant_mounts')||'[]');
    if(!remembered.includes(handle.name)){ remembered.push(handle.name); localStorage.setItem('verdant_mounts',JSON.stringify(remembered)); }
    toast('已挂载 '+handle.name,'mount');
  }catch(e){ /* cancelled */ }
}

function refreshAllExplorers(){ Object.values(WM.wins).forEach(w=>{ if(w.appId==='explorer'&&w.body.__render){ try{w.body.__render();}catch(e){} } }); }

registerApp('notepad',{name:'记事本',icon:'notepad',async launch(opts={}){

      async function save(){ if(!path){ saveAs(); return; } await fs.writeFile(path,ta.value); toast('已保存'); refreshAllExplorers(); }

registerApp('browser',{name:'网页浏览器',icon:'browser',async launch(opts={}){

  else if(opts.url) startUrl=opts.url;

registerApp('imgview',{name:'图片查看器',icon:'img',async launch(opts={}){

registerApp('table',{name:'表格',icon:'csv',async launch(opts={}){

registerApp('calc',{name:'计算器',icon:'calc',launch(){

    <div class="calc-disp"><div class="hist"></div><div class="cur">0</div></div>

      <button class="fn" data-a="clear">AC</button><button class="fn" data-a="neg">±</button><button class="fn" data-a="pct">%</button><button class="op" data-o="/">÷</button>
      <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button class="op" data-o="*">×</button>
      <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button class="op" data-o="-">−</button>
      <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button class="op" data-o="+">+</button>
      <button data-n="0" style="grid-column:span 2">0</button><button data-n=".">.</button><button class="eq" data-a="eq">=</button>
    </div></div>`,
    onMount(body){
      const cur=body.querySelector('.cur'),hist=body.querySelector('.hist');
      let a=null,op=null,fresh=true,disp='0';
      const set=v=>{disp=v;cur.textContent=v;};
      body.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        if(b.dataset.n!=null){ const n=b.dataset.n; if(fresh){set(n==='.'?'0.':n);fresh=false;} else { if(n==='.'&&disp.includes('.'))return; set(disp+n);} }
        else if(b.dataset.o){ if(op&&!fresh){calc();} a=parseFloat(disp); op=b.dataset.o; fresh=true; hist.textContent=fmt(a)+' '+b.textContent; }
        else { const ac=b.dataset.a;
          if(ac==='clear'){a=null;op=null;fresh=true;set('0');hist.textContent='';}
          else if(ac==='neg')set(String(parseFloat(disp)*-1));
          else if(ac==='pct')set(String(parseFloat(disp)/100));
          else if(ac==='eq'){calc();op=null;} }
      });
      function calc(){ if(op==null||a==null)return; const b=parseFloat(disp); let r=0;
        if(op==='+')r=a+b; else if(op==='-')r=a-b; else if(op==='*')r=a*b; else if(op==='/')r=b===0?NaN:a/b;
        hist.textContent=fmt(a)+' '+({'+':'+','-':'−','*':'×','/':'÷'})[op]+' '+fmt(b)+' =';
        set(isNaN(r)?'错误':fmt(r)); a=r; fresh=true; }
      function fmt(n){ return Number.isInteger(n)?String(n):parseFloat(n.toFixed(10)).toString(); }
    }});
}});

<script>
/* ============================================================
   ZIP / ARCHIVE handling — native DecompressionStream where possible
============================================================ */
async function zipAction(path){
  const e=ext(path);
  try{
    if(e==='zip'){ await extractZip(path); }
    else if(e==='gz'){ await extractGzip(path); }
    else if(e==='tar'){ await extractTar(path,dirName(path)); toast('已解压 TAR'); refreshAllExplorers(); }
    else if(e==='tgz'||path.endsWith('.tar.gz')){ const inner=await gunzipBuffer(path); await extractTarBuffer(inner,dirName(path)); toast('已解压'); refreshAllExplorers(); }
    else { launchApp('notepad',{path}); }
  }catch(err){ console.error(err); toast('解压失败：'+err.message,'close'); }
}
// ZIP (store + deflate) parser using DecompressionStream
async function extractZip(path){
  const ab=await fs.readFile(path); const dv=new DataView(ab); const u8=new Uint8Array(ab);
  // find End of Central Directory
  let eocd=-1; for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0)throw new Error('非法 ZIP');
  const cdOff=dv.getUint32(eocd+16,true); const cnt=dv.getUint16(eocd+10,true);
  const outDir=dirName(path)+'/'+baseName(path).replace(/\.zip$/i,'');
  await fs.mkdir(outDir);
  let p=cdOff;
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commentLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nameLen));
    p+=46+nameLen+extraLen+commentLen;
    // local header
    const lnameLen=dv.getUint16(lho+26,true); const lextraLen=dv.getUint16(lho+28,true);
    const dataStart=lho+30+lnameLen+lextraLen;
    const comp=u8.slice(dataStart,dataStart+compSize);
    const full=outDir+'/'+name;
    if(name.endsWith('/')){ await fs.mkdir(full); continue; }
    // ensure parent dirs
    await ensureParents(full);
    let data;
    if(method===0){ data=comp; }
    else if(method===8){ data=await inflateRaw(comp); }
    else { toast('跳过不支持的压缩方法: '+name,'close'); continue; }
    await fs.writeFile(full,data);
  }
  toast('已解压到 '+baseName(outDir));
  refreshAllExplorers(); refreshDesktop();
}
async function ensureParents(p){ const ps=fs.parts(p); ps.pop(); let acc=''; for(const seg of ps){ acc+='/'+seg; try{await fs.mkdir(acc);}catch(e){} } }
async function inflateRaw(u8){ const ds=new DecompressionStream('deflate-raw'); const stream=new Blob([u8]).stream().pipeThrough(ds); return new Uint8Array(await new Response(stream).arrayBuffer()); }
async function gunzipBuffer(path){ const ab=await fs.readFile(path); const ds=new DecompressionStream('gzip'); const stream=new Blob([ab]).stream().pipeThrough(ds); return await new Response(stream).arrayBuffer(); }
async function extractGzip(path){ const out=await gunzipBuffer(path); let name=baseName(path).replace(/\.gz$/i,''); if(!name.includes('.'))name+='.bin';
  if(name.endsWith('.tar')){ await extractTarBuffer(out,dirName(path)); toast('已解压 tar.gz'); } else { await fs.writeFile(dirName(path)+'/'+name,out); toast('已解压 '+name); }
  refreshAllExplorers(); }
async function extractTar(path,destDir){ const ab=await fs.readFile(path); await extractTarBuffer(ab,destDir); }
async function extractTarBuffer(ab,destDir){
  const u8=new Uint8Array(ab); let off=0; const td=new TextDecoder();
  const outDir=destDir+'/extracted_tar'; await fs.mkdir(outDir);
  while(off+512<=u8.length){
    const name=td.decode(u8.slice(off,off+100)).replace(/\0.*$/,'');
    if(!name){ off+=512; if(off+512>u8.length||u8[off]===0)break; continue; }
    const sizeStr=td.decode(u8.slice(off+124,off+136)).replace(/\0.*$/,'').trim();
    const size=parseInt(sizeStr,8)||0;
    const type=String.fromCharCode(u8[off+156]);
    off+=512;
    const full=outDir+'/'+name;
    if(type==='5'||name.endsWith('/')){ await fs.mkdir(full); }
    else { await ensureParents(full); await fs.writeFile(full,u8.slice(off,off+size)); }
    off+=Math.ceil(size/512)*512;
  }
  refreshAllExplorers();
}
</script>

<script>
/* ============================================================

  {name:'幽林', draw(c,w,h){ const g=c.createLinearGradient(0,0,w,h); g.addColorStop(0,'#0b1f1a');g.addColorStop(.5,'#10322a');g.addColorStop(1,'#081512');c.fillStyle=g;c.fillRect(0,0,w,h);
    c.strokeStyle='rgba(217,160,91,0.06)';c.lineWidth=1; for(let i=0;i<14;i++){ const x=w*(i/14); c.beginPath(); c.moveTo(x,h); c.quadraticCurveTo(x+40,h*.5,x-30,0); c.stroke(); }
    for(let i=0;i<40;i++){ c.fillStyle='rgba(242,193,120,'+(Math.random()*.12)+')'; const r=Math.random()*60+10; c.beginPath();c.arc(Math.random()*w,Math.random()*h*.6,r,0,7);c.fill(); } }},
  {name:'琥珀谷', draw(c,w,h){ const g=c.createRadialGradient(w*.7,h*.2,0,w*.7,h*.2,w); g.addColorStop(0,'#3a2417');g.addColorStop(.4,'#1c2620');g.addColorStop(1,'#0a1815');c.fillStyle=g;c.fillRect(0,0,w,h);

  {name:'墨竹', draw(c,w,h){ c.fillStyle='#0e1d1a';c.fillRect(0,0,w,h);
    const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(143,174,139,0.15)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,w,h);

  {name:'晨雾', draw(c,w,h){ const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#16382f');g.addColorStop(.6,'#0f2823');g.addColorStop(1,'#0a1714');c.fillStyle=g;c.fillRect(0,0,w,h);
    c.fillStyle='rgba(207,224,210,0.04)'; for(let i=0;i<5;i++){ c.beginPath();c.ellipse(w*Math.random(),h*(.3+i*.15),w*.4,30,0,0,7);c.fill(); }
    c.fillStyle='#f2c178';c.globalAlpha=.9;c.beginPath();c.arc(w*.8,h*.25,w*.05,0,7);c.fill();c.globalAlpha=1; }},
  {name:'深渊', draw(c,w,h){ c.fillStyle='#060f0d';c.fillRect(0,0,w,h);
    for(let i=0;i<120;i++){ c.fillStyle='rgba(217,160,91,'+(Math.random()*.5)+')'; c.fillRect(Math.random()*w,Math.random()*h,Math.random()*2+.5,Math.random()*2+.5); }
    const g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w*.6);g.addColorStop(0,'rgba(22,56,47,0.4)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,w,h); }},

/* ============================================================
   DESKTOP — icons, free positioning, selection, context
============================================================ */
const iconLayer=document.getElementById('icon-layer');
const GRID=110, MARGIN=20;
let iconPositions={};
function loadPositions(){ try{ iconPositions=JSON.parse(localStorage.getItem('verdant_icons')||'{}'); }catch(e){iconPositions={};} }
function savePositions(){ localStorage.setItem('verdant_icons',JSON.stringify(iconPositions)); }
function autoPos(used){ const rowsPer=Math.max(1,Math.floor((window.innerHeight-140)/GRID)); let i=0; while(true){ const col=Math.floor(i/rowsPer); const row=i%rowsPer; const x=MARGIN+col*GRID, y=MARGIN+row*GRID; if(!used.some(u=>Math.abs(u.x-x)<10&&Math.abs(u.y-y)<10)){ return {x,y}; } i++; if(i>500)return{x:MARGIN,y:MARGIN}; } }

async function refreshDesktop(){
  let items=[]; try{ items=await fs.readdir('/Desktop'); }catch(e){}
  iconLayer.innerHTML='';
  const used=[];
  items.forEach(it=>{ const p=iconPositions[it.name]; if(p)used.push(p); });
  items.forEach(it=>{
    let pos=iconPositions[it.name];
    if(!pos){ pos=autoPos(used); iconPositions[it.name]=pos; used.push(pos); }
    const el=document.createElement('div'); el.className='dicon'; el.dataset.name=it.name; el.draggable=true;
    el.style.left=pos.x+'px'; el.style.top=pos.y+'px';
    el.innerHTML=`<div class="ico">${ico(iconFor(it))}</div><div class="lbl">${it.name}</div>`;
    const path='/Desktop/'+it.name;
    el.onclick=e=>{ e.stopPropagation(); if(!e.ctrlKey&&!e.metaKey)clearDeskSel(); el.classList.add('sel'); };
    el.ondblclick=()=>openPath(path);
    el.oncontextmenu=e=>{ e.preventDefault();e.stopPropagation(); clearDeskSel(); el.classList.add('sel'); deskIconMenu(e,path,it.isDir); };
    el.addEventListener('mouseenter',()=>preloadDrag(path,it.name,it.isDir));
    el.addEventListener('dragstart',e=>{ desktopDragName=it.name; dragStartItem(e,path,it.name,it.isDir); });
    el.addEventListener('dragend',e=>{ cleanupDrag(); desktopDragName=null; });
    if(it.isDir){
      el.addEventListener('dragover',ev=>{ev.preventDefault();el.classList.add('droptarget');});
      el.addEventListener('dragleave',()=>el.classList.remove('droptarget'));
      el.addEventListener('drop',async ev=>{ ev.preventDefault();ev.stopPropagation();el.classList.remove('droptarget');
        if(handleInternalDrop(ev,path)){return;} await importDataTransfer(ev.dataTransfer,path); refreshDesktop(); });
    }
    iconLayer.appendChild(el);
  });
  savePositions();
}
let desktopDragName=null;
function clearDeskSel(){ iconLayer.querySelectorAll('.dicon.sel').forEach(e=>e.classList.remove('sel')); }
function deskIconMenu(e,path,isDir){
  const items=[{label:'打开',icon:'open',fn:()=>openPath(path)}];
  if(!isDir){ const k=fileKind(baseName(path)); if(k==='html'){items.push({label:'用浏览器打开',icon:'browser',fn:()=>launchApp('browser',{path})});} if(k==='zip')items.push({label:'解压',icon:'zip',fn:()=>zipAction(path)}); items.push({label:'导出 / 下载',icon:'download',fn:()=>exportPath(path)}); }
  items.push({sep:true});
  items.push({label:'复制',icon:'copy',fn:()=>{clipboard={op:'copy',paths:[path]};toast('已复制');}});
  items.push({label:'重命名',icon:'rename',fn:async()=>{ const n=await modal({title:'重命名',value:baseName(path)}); if(!n||n===baseName(path))return; const np='/Desktop/'+n; await fs.rename(path,np); iconPositions[n]=iconPositions[baseName(path)]; delete iconPositions[baseName(path)]; savePositions(); refreshDesktop(); }});
  items.push({label:'删除',icon:'trash',danger:true,fn:async()=>{ const ok=await confirmModal('删除','确定删除「'+baseName(path)+'」？','删除'); if(!ok)return; await fs.unlink(path); delete iconPositions[baseName(path)]; savePositions(); refreshDesktop(); }});
  ctxMenu(e.clientX,e.clientY,items);
}

const desktop=document.getElementById('desktop');
desktop.addEventListener('dragover',e=>{ e.preventDefault(); });
desktop.addEventListener('drop',async e=>{
  if(e.target.closest('.dicon')||e.target.closest('.win'))return;
  e.preventDefault();
  if(desktopDragName){ const el=iconLayer.querySelector(`.dicon[data-name="${CSS.escape(desktopDragName)}"]`); if(el){ const x=Math.max(0,e.clientX-48), y=Math.max(0,e.clientY-30); iconPositions[desktopDragName]={x,y}; el.style.transition='left .18s cubic-bezier(.2,.9,.3,1.3),top .18s cubic-bezier(.2,.9,.3,1.3)'; el.style.left=x+'px'; el.style.top=y+'px'; setTimeout(()=>el.style.transition='',220); savePositions(); return; } }
  if(handleInternalDrop(e,'/Desktop')){ setTimeout(refreshDesktop,200); return; }
  await importDataTransfer(e.dataTransfer,'/Desktop'); refreshDesktop();
});
desktop.addEventListener('contextmenu',e=>{ if(e.target.closest('.dicon')||e.target.closest('.win'))return; e.preventDefault();
  ctxMenu(e.clientX,e.clientY,[
    {label:'新建文件夹',icon:'newfolder',fn:async()=>{ const n=await modal({title:'新建文件夹',value:'新建文件夹'}); if(!n)return; await fs.mkdir('/Desktop/'+n); refreshDesktop(); }},
    {label:'新建文本文件',icon:'newfile',fn:async()=>{ const n=await modal({title:'新建文件',value:'新建文档.txt'}); if(!n)return; await fs.writeFile('/Desktop/'+n,''); refreshDesktop(); }},
    {label:'上传文件…',icon:'upload',fn:()=>uploadTo('/Desktop',refreshDesktop)},
    {sep:true},
    {label:'粘贴',icon:'paste',disabled:!clipboard,fn:async()=>{ if(!clipboard)return; for(const src of clipboard.paths){ try{await fs.copy(src,'/Desktop/'+baseName(src)); if(clipboard.op==='cut')await fs.unlink(src);}catch(e){} } if(clipboard.op==='cut')clipboard=null; refreshDesktop(); refreshAllExplorers(); }},
    {sep:true},
    {label:'打开文件管理器',icon:'explorer',fn:()=>launchApp('explorer',{path:'/Desktop'})},
    {label:'刷新',icon:'refresh',fn:refreshDesktop},
    {label:'全屏模式',icon:'eye',fn:()=>{ if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }},
    {label:'更换壁纸 / 设置',icon:'settings',fn:()=>launchApp('settings')},
  ]);
});

/* selection box (marquee) */
const selbox=document.getElementById('selbox');
let selStart=null;
desktop.addEventListener('pointerdown',e=>{
  if(e.target!==desktop&&e.target!==iconLayer&&e.target.id!=='wallpaper-canvas')return;
  if(e.button!==0)return;
  clearDeskSel(); selStart={x:e.clientX,y:e.clientY};
  selbox.style.display='block'; selbox.style.left=e.clientX+'px'; selbox.style.top=e.clientY+'px'; selbox.style.width='0'; selbox.style.height='0';
});
desktop.addEventListener('pointermove',e=>{
  if(!selStart)return;
  const x=Math.min(e.clientX,selStart.x), y=Math.min(e.clientY,selStart.y), w=Math.abs(e.clientX-selStart.x), h=Math.abs(e.clientY-selStart.y);
  selbox.style.left=x+'px';selbox.style.top=y+'px';selbox.style.width=w+'px';selbox.style.height=h+'px';
  const box={l:x,t:y,r:x+w,b:y+h};
  iconLayer.querySelectorAll('.dicon').forEach(ic=>{ const r=ic.getBoundingClientRect(); const hit=!(r.right<box.l||r.left>box.r||r.bottom<box.t||r.top>box.b); ic.classList.toggle('sel',hit); });
});
window.addEventListener('pointerup',()=>{ if(selStart){selStart=null;selbox.style.display='none';} });

/* ============================================================
   CLOCK
============================================================ */
function tickClock(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); const days=['日','一','二','三','四','五','六'];
  document.getElementById('clock').innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}<small>${d.getMonth()+1}月${d.getDate()}日 周${days[d.getDay()]}</small>`; }
setInterval(tickClock,1000); tickClock();

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  try{ await fs.init(); }catch(e){ document.getElementById('boot').innerHTML='<div style="color:var(--rust);font-family:var(--font-d);text-align:center;padding:30px;max-width:400px">无法初始化存储系统。<br><br>OPFS (Origin Private File System) 不可用，请使用最新版 Chrome / Edge / Safari，并避免隐私模式。</div>'; return; }
  loadPositions();
  if(currentWP==='custom'){ await setCustomWallpaper(); } else { drawWallpaper(); }
  buildStart();
  await refreshDesktop();
  setTimeout(()=>{ const remembered=JSON.parse(localStorage.getItem('verdant_mounts')||'[]'); if(remembered.length){ toast('检测到曾挂载的本地文件夹，可在文件管理器中重新挂载','mount'); } },2400);
  setTimeout(()=>{ document.getElementById('boot').classList.add('hide'); }, 1800);
}
boot();
