          <iframe class="ed-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox" title="实时预览"></iframe>
        </div>
        <div class="ed-find" hidden>
          <div class="ed-find-row">
            <input class="f-q" placeholder="查找…" spellcheck="false">
            <span class="ed-find-count">0/0</span>
            <button class="fbtn f-case" title="区分大小写">Aa</button>
            <button class="fbtn f-word" title="全词匹配">W</button>
            <button class="fbtn f-re" title="正则表达式">.*</button>
            <button class="fbtn f-prev" title="上一个 (Shift+Enter)">${icon("chevU", 13)}</button>
            <button class="fbtn f-next" title="下一个 (Enter / F3)">${icon("chevD", 13)}</button>
            <button class="fbtn f-close" title="关闭 (Esc)">${icon("x", 13)}</button>
          </div>
          <div class="ed-find-row">
            <input class="f-r" placeholder="替换为…" spellcheck="false">
            <button class="fbtn f-rep1" title="替换当前">替换</button>
            <button class="fbtn f-repall" title="替换全部">全部</button>
          </div>
        </div>
      </div>
      <div class="statusbar">
        <span class="st-pos">行 1, 列 1</span><span class="st-sel"></span>
        <span class="st-lines">1 行</span><span class="st-chars">0 字符</span>
        <span style="margin-left:auto" class="st-lang">HTML</span><span>UTF-8</span>
      </div>`;
    const w = WM.create({
      title: path ? PATH.base(path) : "HTML编辑器", icon: "code", appId: "editor", type: "editor",
      width: 1000, height: 650, minW: 480, minH: 360, content: root
    });
    let curPath = path || null;
    const ta = root.querySelector(".ed-ta");
    const frame = root.querySelector(".ed-frame");
    const cm = CodeMirror.fromTextArea(ta, {
      lineNumbers: true, lineWrapping: true, styleActiveLine: true, showTrailingSpace: true,
      matchBrackets: true, autoCloseBrackets: true, matchTags: { bothTags: true }, autoCloseTags: true,
      foldGutter: true, gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
      theme: "material-darker", mode: "htmlmixed",
      extraKeys: {
        "Ctrl-Enter": () => runPreview(),
        "Ctrl-S": () => save(),
        "Ctrl-Shift-F": () => beautifyCode(),
        "Ctrl-F": () => openFind(false), "Cmd-F": () => openFind(false),
        "Ctrl-H": () => openFind(true), "Cmd-H": () => openFind(true),
        "F3": () => jump(1),
        "Esc": () => closeFind()
      }
    });
    cm.setSize("100%", "100%");
    requestAnimationFrame(() => cm.refresh());
    const resizeHandler = ww => { if (ww === w) setTimeout(() => cm.refresh(), 30); };
    Bus.on("win-resized", resizeHandler);
    w.onClose = () => {
      Bus.m["win-resized"] = (Bus.m["win-resized"] || []).filter(f => f !== resizeHandler);
      try { cm.toTextArea(); } catch { }   // 释放编辑器实例，避免泄漏
    };

    /* 预览 */
    let lastBlob = null;
    function docHtml() {
      const v = cm.getValue(), mode = cm.getOption("mode");
      if (mode === "markdown") return mdToHtml(v);
      if (mode === "htmlmixed" || mode === "xml") return v;
      if (mode === "application/json") {
        let pretty = v;
        try { pretty = esc(JSON.stringify(JSON.parse(v), null, 2)); } catch { pretty = esc(v); }
        return `<!DOCTYPE html><meta charset="UTF-8"><style>body{font-family:monospace;padding:20px;white-space:pre-wrap;background:#1e1e1e;color:#9CDCFE}</style>${pretty}`;
      }
      return `<!DOCTYPE html><meta charset="UTF-8"><style>body{font-family:monospace;padding:20px;white-space:pre-wrap;background:#1e1e1e;color:#D4D4D4}</style>${esc(v)}`;
    }
    function runPreview() {
      const html2 = docHtml();
      try {
        const d = frame.contentDocument;
        d.open(); d.write(html2); d.close();
      } catch (e) {
        if (lastBlob) URL.revokeObjectURL(lastBlob);
        lastBlob = URL.createObjectURL(new Blob([html2], { type: "text/html" }));
        frame.src = lastBlob;
      }
    }
    const autoPreview = debounce(runPreview, 450);

    /* 状态栏 */
    function updStatus() {
      const cur = cm.getCursor(), sel = cm.getSelection();
      root.querySelector(".st-pos").textContent = `行 ${cur.line + 1}, 列 ${cur.ch + 1}`;
      root.querySelector(".st-sel").textContent = sel ? `已选 ${sel.length} 字符` : "";
      root.querySelector(".st-lines").textContent = `${cm.lineCount()} 行`;
      root.querySelector(".st-chars").textContent = `${cm.getValue().length} 字符`;
      root.querySelector(".st-lang").textContent = MODE_LABEL[cm.getOption("mode")] || "纯文本";
    }
    cm.on("cursorActivity", updStatus);
    cm.on("changes", () => { updStatus(); autoPreview(); });

    function setMode(m) {
      cm.setOption("mode", m);
      root.querySelector(".ed-mode").value = m;
      updStatus(); runPreview();
    }
    root.querySelector(".ed-mode").addEventListener("change", e => setMode(e.target.value));

    /* 保存 */
    async function save() {
      let p = curPath;
      if (!p) {
        p = await Dlg.prompt("保存到虚拟文件系统路径", PATH.join(DESKTOP, "未命名" + (MODE_EXT[cm.getOption("mode")] || ".html")), "保存文件");
        if (!p) return;
        if (!PATH.ext(p)) p += MODE_EXT[cm.getOption("mode")] || ".html";
        curPath = p;
        w.setTitle(PATH.base(p));
      }
      try {
        await fs.mkdir(PATH.dirname(p));
        await fs.writeText(p, cm.getValue());
        Bus.emit("fs", PATH.dirname(p));   // 刷新桌面 + 该目录的文件夹窗口
        toast("已保存到 " + p);
      } catch (e) { toast("保存失败：" + e.message, "err"); }
    }
    /* 格式化 */
    function beautifyCode() {
      const mode = cm.getOption("mode"), v = cm.getValue();
      const opts = { indent_size: 2, preserve_newlines: true, max_preserve_newlines: 2, end_with_newline: true };
      let out = null;
      try {
        if (mode === "htmlmixed" || mode === "xml") { if (!window.html_beautify) throw 0; out = html_beautify(v, { ...opts, indent_inner_html: true, wrap_line_length: 120 }); }
        else if (mode === "css") { if (!window.css_beautify) throw 0; out = css_beautify(v, opts); }
        else if (mode === "javascript") { if (!window.js_beautify) throw 0; out = js_beautify(v, opts); }
        else if (mode === "application/json") out = JSON.stringify(JSON.parse(v), null, 2) + "\n";
        else { toast("Markdown 无需格式化"); return; }
        const pos = cm.getCursor(), scroll = cm.getScrollInfo();
        cm.setValue(out);
        cm.setCursor(pos);
        cm.scrollTo(scroll.left, scroll.top);
        toast("格式化完成");
      } catch (e) { toast(e === 0 ? "格式化库尚未加载完成" : "格式化失败：内容有误", "err"); }
    }
    /* 查找替换 */
    const findBar = root.querySelector(".ed-find");
    const fq = findBar.querySelector(".f-q"), fr = findBar.querySelector(".f-r"), fcount = findBar.querySelector(".ed-find-count");
    let marks = [], curMark = null;
    function clearMarks() { marks.forEach(m => m.clear()); marks = []; if (curMark) { curMark.clear(); curMark = null; } }
    function buildQuery() {
      const raw = fq.value;
      if (!raw) return null;
      const cs = findBar.querySelector(".f-case").classList.contains("on");
      const ww = findBar.querySelector(".f-word").classList.contains("on");
      const re = findBar.querySelector(".f-re").classList.contains("on");
      if (re || ww) {
        try {
          const src = re ? raw : raw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          return new RegExp(ww ? `\\b(?:${src})\\b` : src, cs ? "g" : "gi");
        } catch { return "invalid"; }
      }
      return { text: raw, case: cs };
    }
    function refreshMatches() {
      clearMarks();
      const q = buildQuery();
      if (!q) { fcount.textContent = "0/0"; return; }
      if (q === "invalid") { fcount.textContent = "无效正则"; return; }
      cm.operation(() => {
        const cursor = cm.getSearchCursor(q, { line: 0, ch: 0 });
        while (cursor.findNext() && marks.length < 1000) {
          marks.push(cm.markText(cursor.from(), cursor.to(), { className: "cm-search-hit" }));
        }
      });
      fcount.textContent = `0/${marks.length}`;
    }
    function jump(dir) {
      if (!marks.length) { refreshMatches(); if (!marks.length) return; }
      const from = cm.getCursor(dir > 0 ? "to" : "from");
      let target = null, idx = -1;
      if (dir > 0) {
        for (let i = 0; i < marks.length; i++) { const f = marks[i].find(); if (f && (f.from.line > from.line || (f.from.line === from.line && f.from.ch >= from.ch - (dir > 0 ? 0 : 0)))) { target = marks[i]; idx = i; break; } }
        if (!target) { target = marks[0]; idx = 0; }
      } else {
        for (let i = marks.length - 1; i >= 0; i--) { const f = marks[i].find(); if (f && (f.from.line < from.line || (f.from.line === from.line && f.from.ch < from.ch))) { target = marks[i]; idx = i; break; } }
        if (!target) { target = marks[marks.length - 1]; idx = marks.length - 1; }
      }
      if (curMark) { curMark.clear(); curMark = null; }
      const f = target.find();
      if (f) {
        const elMk = cm.markText(f.from, f.to, { className: "cm-search-hit-active" });
        curMark = elMk;
        marks[idx].clear();
        marks[idx] = cm.markText(f.from, f.to, { className: "cm-search-hit" });
        cm.setSelection(f.from, f.to);
        cm.scrollIntoView({ from: f.from, to: f.to }, 80);
      }
      fcount.textContent = `${idx + 1}/${marks.length}`;
    }
    function openFind(replace) {
      findBar.hidden = false;
      const sel = cm.getSelection();
      if (sel && !sel.includes("\n")) fq.value = sel;
      refreshMatches();
      (replace ? fr : fq).focus();
      (replace ? fr : fq).select();
    }
    function closeFind() { if (findBar.hidden) return; findBar.hidden = true; clearMarks(); cm.focus(); }
    fq.addEventListener("input", debounce(refreshMatches, 200));
    fq.addEventListener("keydown", e => { if (e.key === "Enter") jump(e.shiftKey ? -1 : 1); if (e.key === "Escape") closeFind(); if (e.key === "F3") jump(1); });
    fr.addEventListener("keydown", e => { if (e.key === "Enter") replace1(); if (e.key === "Escape") closeFind(); });
    findBar.querySelector(".f-close").onclick = closeFind;
    findBar.querySelector(".f-next").onclick = () => jump(1);
    findBar.querySelector(".f-prev").onclick = () => jump(-1);
    ["f-case", "f-word", "f-re"].forEach(c => findBar.querySelector("." + c).onclick = e => { e.currentTarget.classList.toggle("on"); refreshMatches(); });
    function replace1() {
      const sel = cm.getSelection(), q = buildQuery();
      if (!q || q === "invalid" || !sel) { jump(1); return; }
      const rev = fr.value;
      let match = false;
      if (q instanceof RegExp) { const re2 = new RegExp(q.source, q.ignoreCase ? "i" : ""); match = re2.test(sel); if (match) cm.replaceSelection(sel.replace(re2, rev)); }
      else { match = q.case ? sel === q.text : sel.toLowerCase() === q.text.toLowerCase(); if (match) cm.replaceSelection(rev); }
      if (!match) { refreshMatches(); jump(1); return; }
      refreshMatches(); jump(1);
    }
    findBar.querySelector(".f-rep1").onclick = replace1;
    findBar.querySelector(".f-repall").onclick = () => {
      const q = buildQuery(); if (!q || q === "invalid") return;
      const rev = fr.value;
      const cursor = cm.getSearchCursor(q, { line: 0, ch: 0 });
      let n = 0;
      cm.operation(() => { while (cursor.findNext()) { cursor.replace(rev); n++; } });
      toast(`已替换 ${n} 处`);
      refreshMatches();
    };
    /* 折叠 */
    function foldAll(fold) {
      cm.operation(() => {
        for (let i = 0; i < cm.lineCount(); i++) cm.foldCode(CodeMirror.Pos(i, 0), null, fold ? "fold" : "unfold");
      });
    }
    /* 工具栏 */
    root.querySelectorAll(".tbtn").forEach(b => b.addEventListener("click", async () => {
      const a = b.dataset.a;
      if (a === "run" || a === "refresh") runPreview();
      else if (a === "beautify") beautifyCode();
      else if (a === "foldall") foldAll(true);
      else if (a === "unfold") foldAll(false);
      else if (a === "find") findBar.hidden ? openFind(false) : closeFind();
      else if (a === "undo") cm.undo();
      else if (a === "redo") cm.redo();
      else if (a === "save") save();
      else if (a === "clear") cm.setValue("");
      else if (a === "newwin") {
        const blob = new Blob([docHtml()], { type: "text/html" });
        window.open(URL.createObjectURL(blob), "_blank");
      }
      else if (a === "export") {
        const mode = cm.getOption("mode");
        const name = (curPath ? PATH.base(curPath).replace(/\.[^.]+$/, "") : "未命名") + (MODE_EXT[mode] || ".txt");
        const url = URL.createObjectURL(new Blob([cm.getValue()], { type: "text/plain" }));
        const an = el("a", { href: url, download: name });
        document.body.append(an); an.click(); an.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      else if (a === "import") {
        const fs2 = await pickFiles(false);
        if (fs2.length) {
          cm.setValue(await fs2[0].text());
          setMode(extToMode(fs2[0].name));
          curPath = null;
          w.setTitle(fs2[0].name + " — 未保存");
        }
      }
    }));
    /* 分隔条拖拽 */
    const split = root.querySelector(".ed-split"), editorPane = root.querySelector(".ed-editor-pane");
    split.addEventListener("pointerdown", e => {
      e.preventDefault();
      split.setPointerCapture(e.pointerId);
      const layout = root.querySelector(".ed-layout");
      const mv = ev => {
        const r = layout.getBoundingClientRect();
        let wpx = ev.clientX - r.left;
        wpx = clamp(wpx, 200, r.width - 120);   // 编辑区最小 200 / 预览区最小 120
        editorPane.style.flex = `0 0 ${wpx}px`;
      };
      const up = () => { split.removeEventListener("pointermove", mv); split.removeEventListener("pointerup", up); split.removeEventListener("pointercancel", up); cm.refresh(); };
      split.addEventListener("pointermove", mv);
      split.addEventListener("pointerup", up);
      split.addEventListener("pointercancel", up);
    });
    /* 初始内容 */
    if (path) {
      try {
        const text = await fs.readText(path);
        cm.setValue(text);
        setMode(extToMode(path));
      } catch (e) { toast("无法读取文件：" + e.message, "err"); cm.setValue(""); }
    } else {
      cm.setValue("<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>新页面</title>\n  <style>\n    body { font-family: system-ui, sans-serif; margin: 40px; }\n  </style>\n</head>\n<body>\n  <h1>你好，星澜！</h1>\n  <p>左侧编辑，右侧即时预览。Ctrl+S 保存到虚拟磁盘。</p>\n</body>\n</html>\n");
      setMode("htmlmixed");
    }
    cm.clearHistory();
    updStatus();
    setTimeout(() => { cm.refresh(); runPreview(); }, 80);
    return w;
  }
});

Apps.def("browser", {
  name: "网页浏览器", icon: "globe",
  open(url, _internalPath) {
    const root = el("div", { class: "app-root" });
    root.innerHTML = `
      <div class="toolbar" style="flex-wrap:nowrap">
        <button class="tbtn" data-a="back">${icon("arrL", 16)}</button>
        <button class="tbtn" data-a="fwd">${icon("arrR", 16)}</button>
        <button class="tbtn" data-a="reload">${icon("refresh", 16)}</button>
        <button class="tbtn" data-a="home">${icon("home", 16)}</button>
        <div class="tinput" style="flex:1;display:flex;align-items:center;gap:7px;padding:0 4px 0 11px;min-width:0">
          ${icon("lock", 12)}<input class="wb-addr" placeholder="输入网址，回车访问…" style="flex:1;border:0;background:transparent;outline:0;height:27px;color:inherit;min-width:0" spellcheck="false">
        </div>
        <button class="tbtn" data-a="go">${icon("arrR", 15)}</button>

      </div>
      <div class="wb-stage" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>`;

    const w = WM.create({ title: "网页浏览器", icon: "globe", appId: "browser", type: "browser", width: 940, height: 640, content: root, onClose: () => { if (blobUrl) URL.revokeObjectURL(blobUrl); } });
    function homePage() {
      if (frame) { frame.remove(); frame = null; }
      stage.innerHTML = "";
      const hp = el("div", { class: "wb-home" });
      hp.innerHTML = `<div class="wb-logo">NEBULA WEB</div>
        <div style="width:min(560px,100%)" class="sm-search">${icon("search", 15)}<input placeholder="搜索或输入网址…"></div>
        <div class="wb-links"></div>`;
      const links = [
        ["MDN Web 文档", "developer.mozilla.org", "book"], ["GitHub", "github.com", "code"],
        ["维基百科", "zh.wikipedia.org", "globe"], ["Bilibili", "bilibili.com", "film"],
        ["哔哩轻小说示例", "example.com", "info"], ["Can I Use", "caniuse.com", "check"]
      ];
      const grid = hp.querySelector(".wb-links");
      links.forEach(([n, u, i]) => {
        const a = el("a", { class: "wb-link", html: icon(i, 17) + `<span>${esc(n)}</span>` });
        a.onclick = () => nav("https://" + u);
        grid.append(a);
      });

      stage.append(hp);
      addr.value = "nebula://home";
      w.setTitle("新标签页");
    }
    async function nav(u, push = true) {
      u = (u || "").trim();
      if (!u) return;
      if (u === "nebula://home") { homePage(); if (push) { hist = hist.slice(0, hi + 1); hist.push(u); hi++; } return; }
      if (u.startsWith("file://")) {
        const p = u.slice(7);
        try {
          if (blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = URL.createObjectURL(await fs.readBlob(p));
          u = blobUrl; vfsPath = p;
        } catch (e) { toast("无法加载文件", "err"); return; }
      } else if (!/^https?:\/\//i.test(u)) {
        u = u.includes(".") && !u.includes(" ") ? "https://" + u : "https://www.bing.com/search?q=" + encodeURIComponent(u);
      }
      if (!frame) {
        stage.innerHTML = "";
        frame = el("iframe", { class: "wb-iframe", sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads", referrerpolicy: "no-referrer" });
        stage.append(frame);
        frame.addEventListener("load", () => {
          try { const t = frame.contentDocument.title; if (t) w.setTitle(t); } catch { try { w.setTitle(new URL(frame.src).hostname); } catch { } }
        });
      }
      frame.src = u;
      addr.value = u;
      w.setTitle(vfsPath ? PATH.base(vfsPath) : u.replace(/^https?:\/\//, "").slice(0, 40));
      if (push) { hist = hist.slice(0, hi + 1); hist.push(u); hi++; }
    }
    addr.addEventListener("keydown", e => { if (e.key === "Enter") nav(addr.value); });
    root.querySelectorAll(".tbtn").forEach(b => b.addEventListener("click", () => {
      const a = b.dataset.a;
      if (a === "back" && hi > 0) { hi--; nav(hist[hi], false); }
      else if (a === "fwd" && hi < hist.length - 1) { hi++; nav(hist[hi], false); }
      else if (a === "reload") nav(addr.value || "nebula://home", false);
      else if (a === "home") nav("nebula://home");
      else if (a === "go") nav(addr.value);
      else if (a === "tab") window.open(addr.value.startsWith("http") ? addr.value : undefined, "_blank");
    }));
    nav(url || "nebula://home");
    return w;
  }
});

/* ---------- 计算器 ---------- */
Apps.def("calc", {
  name: "计算器", icon: "calc",
  open() {
    const root = el("div", { class: "app-root" });
    root.innerHTML = `<div class="calc-disp"><div class="prev"></div><div class="cur">0</div></div><div class="calc-grid"></div>`;
    const grid = root.querySelector(".calc-grid"), cur = root.querySelector(".cur"), prev = root.querySelector(".prev");
    let expr = "";
    function safeEval(s) {
      s = s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
      if (!/^[-+*/%.()0-9\s]*$/.test(s)) throw "bad";
      const tokens = s.match(/(\d+\.?\d*|\.\d+|[+\-*/%()])/g); if (!tokens) throw "bad";
      let pos = 0;
      const peek = () => tokens[pos], next = () => tokens[pos++];
      function parseE() { let v = parseT(); while (peek() === "+" || peek() === "-") v = next() === "+" ? v + parseT() : v - parseT(); return v; }
      function parseT() { let v = parseF(); while (["*", "/", "%"].includes(peek())) { const o = next(); const r = parseF(); v = o === "*" ? v * r : o === "%" ? v % r : v / r; } return v; }
      function parseF() { const t = next(); if (t === "(") { const v = parseE(); if (next() !== ")") throw "bad"; return v; } if (t === "-") return -parseF(); if (t === "+") return parseF(); const n = parseFloat(t); if (isNaN(n)) throw "bad"; return n; }
      const r = parseE(); if (pos !== tokens.length || !isFinite(r)) throw "bad"; return r;
    }
    function update() { cur.textContent = expr || "0"; }
    function press(k) {
      if (k === "C") { expr = ""; prev.textContent = ""; }
      else if (k === "⌫") expr = expr.slice(0, -1);
      else if (k === "=") {
        try { const r = safeEval(expr); prev.textContent = expr + " ="; expr = String(Math.round(r * 1e12) / 1e12); }
        catch { cur.textContent = "错误"; expr = ""; return; }
      }
      else if (k === "±") expr = expr.startsWith("-") ? expr.slice(1) : "-" + expr;
      else expr += k;
      update();
    }
    const keys = ["C", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", ".", "⌫", "="];
    keys.forEach(k => {
      const b = el("button", { class: ["÷", "×", "−", "+"].includes(k) ? "op" : k === "=" ? "eq" : "" }, k);

  open() {

      <div class="toolbar">

      <div class="statusbar"><span class="p-info"></span><span style="margin-left:auto">触摸/鼠标均可绘制</span></div>`;
    const wrap = root.querySelector(".paint-canvas-wrap"), canvas = root.querySelector("canvas"), ctx2 = canvas.getContext("2d");
    const colorInput = root.querySelector(".p-color"), sizeInput = root.querySelector(".p-size");
    let color = "#2dd4bf", size = 5, erasing = false, drawing = false, last = null;
    const undoStack = [];
    const COLORS = ["#0b0f14", "#6b7280", "#ef4444", "#f97316", "#eab308", "#22c55e", "#2dd4bf", "#3b82f6", "#8b5cf6", "#ec4899", "#ffffff"];
    const swWrap = root.querySelector(".sw-wrap");
    COLORS.forEach((c, i) => {
      const s = el("button", { class: "swatch" + (i === 6 ? " on" : ""), style: { background: c } });
      s.onclick = () => { color = c; erasing = false; root.querySelector('[data-a="erase"]').classList.remove("on"); swWrap.querySelectorAll(".swatch").forEach(x => x.classList.remove("on")); s.classList.add("on"); colorInput.value = c.startsWith("#") ? c : "#2dd4bf"; };
      swWrap.append(s);
    });
    colorInput.addEventListener("input", e => { color = e.target.value; swWrap.querySelectorAll(".swatch").forEach(x => x.classList.remove("on")); });
    sizeInput.addEventListener("input", e => size = +e.target.value);
    function fitCanvas() {
      const r = wrap.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      const img = canvas.width ? canvas.toDataURL() : null;
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      ctx2.scale(dpr, dpr);
      if (img) { const im = new Image(); im.onload = () => ctx2.drawImage(im, 0, 0, r.width, r.height); im.src = img; }
      else { ctx2.fillStyle = "#ffffff"; ctx2.fillRect(0, 0, r.width, r.height); }
      canvas.style.width = r.width + "px"; canvas.style.height = r.height + "px";
    }
    const w = WM.create({ title: "画板", icon: "palette", appId: "paint", type: "paint", width: 780, height: 580, content: root });
    setTimeout(fitCanvas, 40);
    Bus.on("win-resized", ww => { if (ww === w) debounce(fitCanvas, 200)(); });
    function pushUndo() { try { undoStack.push(canvas.toDataURL()); if (undoStack.length > 24) undoStack.shift(); } catch { } }
    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.x, y: e.clientY - r.y }; }
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault(); canvas.setPointerCapture(e.pointerId);
      pushUndo();
      drawing = true; last = pos(e);
      ctx2.lineCap = ctx2.lineJoin = "round";
      ctx2.strokeStyle = erasing ? "#ffffff" : color;
      ctx2.lineWidth = erasing ? size * 3 : size;
      ctx2.beginPath(); ctx2.moveTo(last.x, last.y); ctx2.lineTo(last.x + .01, last.y + .01); ctx2.stroke();
    });
    canvas.addEventListener("pointermove", e => {
      if (!drawing) return;
      const p = pos(e);
      ctx2.beginPath();
      ctx2.moveTo(last.x, last.y);
      const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
      ctx2.quadraticCurveTo(last.x, last.y, mx, my);
      ctx2.lineTo(p.x, p.y);
      ctx2.stroke();
      last = p;
    });
    const stop = () => drawing = false;
    canvas.addEventListener("pointerup", stop); canvas.addEventListener("pointercancel", stop);
    root.querySelectorAll(".tbtn").forEach(b => b.addEventListener("click", async () => {
      const a = b.dataset.a;
      if (a === "erase") { erasing = !erasing; b.classList.toggle("on", erasing); }
      else if (a === "undo" && undoStack.length) { const img = new Image(); const r = canvas.getBoundingClientRect(); img.onload = () => { ctx2.fillStyle = "#fff"; ctx2.fillRect(0, 0, r.width, r.height); ctx2.drawImage(img, 0, 0, r.width, r.height); }; img.src = undoStack.pop(); }
      else if (a === "clear") { pushUndo(); const r = canvas.getBoundingClientRect(); ctx2.fillStyle = "#ffffff"; ctx2.fillRect(0, 0, r.width, r.height); }
      else if (a === "save") {
        const p = await Dlg.prompt("保存路径", PATH.join(HOME, "pictures", "画-" + new Date().toISOString().slice(0, 10) + ".png"), "保存画作");
        if (!p) return;
        canvas.toBlob(async blob => { await fs.mkdir(PATH.dirname(p)); await fs.writeFile(p.endsWith(".png") ? p : p + ".png", blob); Bus.emit("fs", PATH.dirname(p)); toast("已保存画作"); }, "image/png");
      }
    }));
    const info = root.querySelector(".p-info");
    const infoT = setInterval(() => { if (!document.body.contains(root)) { clearInterval(infoT); return; } info.textContent = `${canvas.width}×${canvas.height} · ${erasing ? "橡皮" : "画笔"} ${size}px`; }, 800);
    return w;
  }
});

      await walk(HOME, 0); await walk("/mnt/local", 0);
      if (imagePath && !found.some(f => f.p === imagePath)) found.unshift({ p: imagePath, size: 0 });
      if (!found.length) { Dlg.alert("虚拟磁盘中没有找到 .iso / .img / .bin 镜像。\n可以先把本地镜像文件拖拽导入到桌面，再来此处选择。", "没有镜像"); return; }
      const sel = await Dlg.list("选择磁盘镜像", "hdd", found.map(f => ({ label: f.p, value: f.p, icon: "hdd", sub: fmtBytes(f.size) })), "后缀决定挂载方式：.iso → 光驱，.img/.bin → 软驱，其他 → 硬盘");
      if (sel) { const f = await fs.getNativeFile(sel); setImage(f, PATH.base(sel)); }
    }
    root.querySelector('[data-a="pick"]').onclick = pickFromVFS;
    root.querySelector('[data-a="local"]').onclick = async () => { const fs2 = await pickFiles(false, ".iso,.img,.bin,.fda"); if (fs2.length) setImage(fs2[0], fs2[0].name); };
    btnStart.onclick = async () => {
      if (!imageFile) return;
      btnStart.disabled = true;
      status.textContent = "正在加载 v86 引擎（0.5.319）…";
      try { await loadScript(V86_CDN.lib); } catch (e) { status.textContent = "引擎加载失败（网络）"; btnStart.disabled = false; return; }
      const Ctor = window.V86 || window.V86Starter;
      if (!Ctor) { status.textContent = "引擎加载失败"; btnStart.disabled = false; return; }
      empty.style.display = "none"; container.style.display = "block";
      const ext = PATH.ext(imageName);
      const boot = ext === "iso" ? { cdrom: { buffer: imageFile } } : ["img", "fda", "bin"].includes(ext) ? { fda: { buffer: imageFile } } : { hda: { buffer: imageFile } };
      try {
        emu = new Ctor({
          wasm_path: V86_CDN.wasm,
          memory_size: 256 * 1024 * 1024,
          vga_memory_size: 16 * 1024 * 1024,
          screen_container: container,
          bios: { url: V86_CDN.bios },
          vga_bios: { url: V86_CDN.vgabios },
          autostart: true,
          ...boot
        });
        status.textContent = `运行中 · ${imageName} 挂载为 ${ext === "iso" ? "光驱 CD-ROM" : ["img", "fda", "bin"].includes(ext) ? "软驱 FDA" : "硬盘 HDA"} · 点击「锁定」捕获鼠标（Esc 释放）`;
        btnLock.disabled = false; btnStop.disabled = false;
        btnLock.onclick = () => { try { emu.lock_mouse(); } catch (e) { container.querySelector("canvas, div")?.requestPointerLock?.(); } };
        container.addEventListener("dblclick", () => { try { emu.lock_mouse(); } catch { } });
      } catch (e) { status.textContent = "启动失败：" + e.message; console.error(e); }
    };
    if (imagePath) fs.getNativeFile(imagePath).then(f => setImage(f, PATH.base(imagePath))).catch(() => { });
    return w;
  }
});

/* ============================================
   启动
============================================ */
(async function boot() {
  applyTheme();
  await fs.init();
  await seedWorkspace();
  Shell.init();
  await Desktop.init();
  await applyWallpaper();
  Mount.remind();
  /* 全局快捷键 */
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && !e.target.closest(".win")) e.preventDefault();
  });
})();


</script>
