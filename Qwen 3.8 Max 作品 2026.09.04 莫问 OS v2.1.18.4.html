/* ============================================================
   查看器：漫画阅读（条漫）＋ 单图缩放 ＋ PDF
   ============================================================ */
const ViewerApp=(()=>{
  function launch(opts={}){
    const w=WM.open('viewer',{title:'查看器',w:860,h:640,...opts});if(!w)return;
    const state={path:opts.path,mode:opts.mode||'auto',list:[],idx:0,zoom:1};
    w.body.innerHTML=`
      <div class="app-toolbar mg-tools">
        <button class="tb-btn v-manga on" title="条漫模式">${IC.book}<span>条漫</span></button>
        <button class="tb-btn v-single" title="单页模式">${IC.image}<span>单页</span></button>
        <span class="tb-sep"></span>
        <button class="tb-btn v-prev" title="上一张">${IC.prevpage}</button>
        <button class="tb-btn v-next" title="下一张">${IC.nextpage}</button>
        <span class="v-pageinfo" style="font-size:11.5px;color:var(--tx3);font-family:var(--mono)"></span>
        <span class="tb-sp"></span>
        <button class="tb-btn v-zout hidden" title="缩小">${IC.zoomout}</button>
        <button class="tb-btn v-zin hidden" title="放大">${IC.zoomin}</button>
        <button class="tb-btn v-fit hidden" title="适应窗口">${IC.fit}</button>
        <button class="tb-btn v-export" title="导出">${IC.download}</button>
        <button class="tb-btn v-fs" title="全屏沉浸">${IC.fullscreen}<span>全屏</span></button>
      </div>
      <div class="mg">
        <div class="mg-strip"></div>
        <div class="mg-single hidden"></div>
        <div class="mg-hud">
          <button class="tb-btn v-hprev">${IC.prevpage}</button>
          <span class="mg-page v-hudpage">—</span>
          <button class="tb-btn v-hnext">${IC.nextpage}</button>
        </div>
      </div>`;
    const T=w.body,strip=$('.mg-strip',T),single=$('.mg-single',T);
    let urls=[],imgs=[],targetPath=opts.path;
    async function init(){
      if(extOf(state.path)==='pdf'||state.mode==='pdf'){renderPdf();return;}
      /* 同目录图片序列识别 */
      const dir=dirName(state.path);
      let files;try{files=await fs.readdir(dir);}catch(e){toast('目录读取失败: '+e.message,'err');return;}
      const images=files.filter(f=>!f.isDir&&IMG_EXT.includes(extOf(f.name)));
      images.sort((a,b)=>naturalCmp(a.name,b.name)); /* 自然排序 1,2,10 */
      if(!images.length){toast('目录中没有图片','warn');return;}
      state.list=images;state.idx=images.findIndex(f=>f.path===state.path);if(state.idx<0)state.idx=0;
      strip.innerHTML=`<div class="mg-loading"><div class="ring"></div><div class="mg-ltxt">正在读取 ${images.length} 张图片…</div></div>`;
      /* 并行读取、按序插入 */
      const datas=await Promise.all(images.map(async f=>{try{return await fs.readBlob(f.path);}catch(e){console.warn('跳过',f.name,e);return null;}}));
      strip.innerHTML='';imgs=[];urls=[];
      datas.forEach((d,i)=>{if(!d)return;const u=URL.createObjectURL(d);urls.push(u);
        const img=new Image();img.src=u;img.alt=images[i].name;img.style.width='100%';img.style.maxWidth='1000px';img.style.display='block';img.style.pointerEvents='none';
        imgs.push({img,name:images[i].name,path:images[i].path,idx:i});strip.appendChild(img);});
      $('.mg-ltxt')&&$('.mg-ltxt').remove();
      WM.setTitle(w,'查看器 · '+baseName(state.path)+` (${state.list.length} 张)`);
      updatePage();
      /* 定位到用户点击的那一张 */
      const tgt=imgs.find(x=>x.path===targetPath);
      if(tgt)setTimeout(()=>tgt.img.scrollIntoView({block:'start'}),80);
      else strip.scrollTop=0;
      strip.addEventListener('scroll',throttle(()=>{if(!single.classList.contains('hidden'))return;
        const mid=strip.scrollTop+strip.clientHeight/2;let best=0,bd=1e9;
        imgs.forEach((x,i)=>{const d=Math.abs(x.img.offsetTop+x.img.height/2-mid);if(d<bd){bd=d;best=i;}});
        if(best!==state.idx){state.idx=best;updatePage();}},150));
    }
    function updatePage(){
      const t=`${state.idx+1} / ${state.list.length} · ${state.list[state.idx]?esc(state.list[state.idx].name):''}`;
      $('.v-pageinfo',T).textContent=t;$('.v-hudpage',T).textContent=`${state.idx+1}/${state.list.length}`;
    }
    function goto(i){if(!imgs.length)return;state.idx=clamp(i,0,imgs.length-1);
      if(state.mode==='manga'||$('.mg-strip',T).classList.contains('hidden')===false&&state.mode!=='single'){imgs[state.idx].img.scrollIntoView({block:'start',behavior:'smooth'});}
      renderSingle();updatePage();}
    function renderSingle(){
      single.innerHTML='';if(!imgs.length)return;
      const img=new Image();img.src=imgs[state.idx].src||imgs[state.idx].img.src;
      img.style.transform=`scale(${state.zoom})`;single.appendChild(img);
      single.onwheel=e=>{if(!e.ctrlKey)return;e.preventDefault();state.zoom=clamp(state.zoom+(e.deltaY<0?.15:-.15),.1,6);img.style.transform=`scale(${state.zoom})`;};
    }
    function setMode(m){state.mode=m;
      $('.v-manga',T).classList.toggle('on',m==='manga');$('.v-single',T).classList.toggle('on',m==='single');
      $('.v-zout',T).classList.toggle('hidden',m!=='single');$('.v-zin',T).classList.toggle('hidden',m!=='single');$('.v-fit',T).classList.toggle('hidden',m!=='single');
      if(m==='single'){strip.classList.add('hidden');single.classList.remove('hidden');renderSingle();}
      else{single.classList.add('hidden');strip.classList.remove('hidden');imgs[state.idx]&&imgs[state.idx].img.scrollIntoView({block:'start'});}
    }
    function renderPdf(){
      w.body.innerHTML='<div class="mg" style="background:var(--bg0)"></div>';
      fs.blobURL(state.path).then(u=>{const f=document.createElement('iframe');f.src=u;f.style.cssText='flex:1;border:none;width:100%';$('.mg',w.body).appendChild(f);WM.setTitle(w,'查看器 · '+baseName(state.path));});
    }
    /* 全屏沉浸：隐藏标题栏，仅留右上退出钮 */
    const exitBtn=el('button','mg-exitfs hidden',IC.x);document.body.appendChild(exitBtn);
    exitBtn.onclick=()=>{document.fullscreenElement?document.exitFullscreen():endFull();};
    function startFull(){w.el.classList.add('manga-full');exitBtn.classList.remove('hidden');
      const fsReq=w.el.requestFullscreen||document.documentElement.requestFullscreen;
      fsReq&&(w.el.requestFullscreen?w.el.requestFullscreen().catch(()=>{}):document.documentElement.requestFullscreen().catch(()=>{}));}
    function endFull(){w.el.classList.remove('manga-full');exitBtn.classList.add('hidden');
      document.fullscreenElement&&document.exitFullscreen().catch(()=>{});}
    document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&w.el.classList.contains('manga-full'))endFull();});
    $('.v-fs',T).onclick=()=>w.el.classList.contains('manga-full')?endFull():startFull();
    $('.v-manga',T).onclick=()=>setMode('manga');
    $('.v-single',T).onclick=()=>setMode('single');
    $('.v-prev',T).onclick=()=>goto(state.idx-1);$('.v-next',T).onclick=()=>goto(state.idx+1);
    $('.v-hprev',T).onclick=()=>goto(state.idx-1);$('.v-hnext',T).onclick=()=>goto(state.idx+1);
    $('.v-zin',T).onclick=()=>{state.zoom=clamp(state.zoom+.2,.1,6);renderSingle();};
    $('.v-zout',T).onclick=()=>{state.zoom=clamp(state.zoom-.2,.1,6);renderSingle();};
    $('.v-fit',T).onclick=()=>{state.zoom=1;renderSingle();};
    $('.v-export',T).onclick=()=>fs.exportFile(state.path);
    w.onClose=()=>{urls.forEach(u=>URL.revokeObjectURL(u));exitBtn.remove();};
    init();
    return w;
  }
  return{launch};
})();

})();

    const T=w.body,frame=$('.br-frame',T),url=$('.br-url',T);
    let homeURL=null;
    async function nav(u,push=true){
      u=u.trim();if(!u)u='about:home';
      if(u==='about:home'){if(!homeURL)homeURL=URL.createObjectURL(new Blob([HOME_HTML],{type:'text/html'}));u=homeURL;}
      else if(u.startsWith('vfs:')){const p=fs.norm(u.slice(4));try{u=await fs.blobURL(p);}catch(e){toast('文件不存在: '+p,'err');return;}}
      else if(!/^(https?:|blob:|about:)/.test(u))u='https://'+u;
      frame.src=u;url.value=u.startsWith('blob:')?'about:home':u;
      if(push){hist.splice(hi.i+1);hist.push(u);hi.i++;}
      $('.b-back',T).classList.toggle('dis',hi.i<=0);
      $('.b-fwd',T).classList.toggle('dis',hi.i>=hist.length-1);
      WM.setTitle(w,'浏览器 · '+(url.value.length>40?url.value.slice(0,40)+'…':url.value));
    }
    $('.b-back',T).onclick=()=>{if(hi.i>0){hi.i--;nav(hist[hi.i],false);}};
    $('.b-fwd',T).onclick=()=>{if(hi.i<hist.length-1){hi.i++;nav(hist[hi.i],false);}};
    $('.b-re',T).onclick=()=>nav(hist[hi.i],false);
    $('.b-home',T).onclick=()=>nav('about:home');
    $('.b-go',T).onclick=()=>nav(url.value);
    url.onkeydown=e=>{if(e.key==='Enter')nav(url.value);};
    nav(hist[0],false);
    w.onReuse=o=>{if(o.url)nav(o.url);};
    return w;
  }
  return{launch};
})();

          'Ctrl-F':()=>openFind(false),'Cmd-F':()=>openFind(false),

      else cm.setValue('<!-- 莫问代码编辑器 -->\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset="utf-8">\n    <title>我的页面</title>\n    <style>\n      body { font-family: sans-serif; padding: 2rem; background: #f5f2ea; }\n      h1 { color: #c2401f; }\n    </style>\n  </head>\n  <body>\n    <h1>你好，莫问</h1>\n    <p>在左侧编辑，右侧即时预览。Ctrl+S 保存，Ctrl+Enter 运行。</p>\n  </body>\n</html>\n');

    const scheduleClearSearch=debounce(()=>{if(findbar.classList.contains('open'))doSearch();},350);

    function closeFind(){findbar.classList.remove('open');clearMarks();state.cm&&state.cm.focus();}

      const m=state.marks[i];if(!m){doSearch();return;}

    /* ---- 格式化（js-beautify，保持光标） ---- */

    function foldAll(fold){if(!state.cm)return;const cm=state.cm;

    async function save(){

    /* ---- 可拖拽分割条 ---- */
    split.addEventListener('pointerdown',e=>{
      e.preventDefault();split.setPointerCapture(e.pointerId);split.classList.add('on');
      const main=$('.ced-main',T);
      const mv=ev=>{const r=main.getBoundingClientRect();

      const up=()=>{split.removeEventListener('pointermove',mv);split.removeEventListener('pointerup',up);split.classList.remove('on');state.cm&&state.cm.refresh();};
      split.addEventListener('pointermove',mv);split.addEventListener('pointerup',up);

    /* ---- 工具栏绑定 ---- */
    $('.ed-import',T).onclick=importFile;
    $('.ed-save',T).onclick=save;
    $('.ed-export',T).onclick=exportFile;
    $('.ed-openbr',T).onclick=openInBrowser;
    $('.ed-newwin',T).onclick=openNewWindow;
    $('.ed-clear',T).onclick=async()=>{if(await Dlg.confirm('清空内容','确定清空编辑器全部内容？','清空')){setVal('');runPreview();}};
    $('.ed-undo',T).onclick=()=>state.cm?state.cm.undo():document.execCommand('undo');
    $('.ed-redo',T).onclick=()=>state.cm?state.cm.redo():document.execCommand('redo');
    $('.ed-fmt',T).onclick=format;
    $('.ed-fold',T).onclick=()=>foldAll(true);

    /* 窗口关闭释放实例 */
    w.onClose=()=>{if(state.cm){try{state.cm.toTextArea();}catch(e){}state.cm=null;}};

    return w;
  }

/* ---------- 计算器（安全表达式解析） ---------- */
const CalcApp=(()=>{
  function tokenize(s){
    const toks=[];let i=0;
    while(i<s.length){const c=s[i];
      if(/\s/.test(c)){i++;continue;}
      if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;toks.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue;}
      if(/[a-z]+/i.test(c)){let j=i;while(j<s.length&&/[a-z]/i.test(s[j]))j++;toks.push({t:'fn',v:s.slice(i,j).toLowerCase()});i=j;continue;}
      if('+-*/%^()'.includes(c)){toks.push({t:'op',v:c});i++;continue;}
      throw new Error('非法字符: '+c);
    }
    return toks;
  }
  function parse(toks){
    let p=0;const peek=()=>toks[p],next=()=>toks[p++];
    function expr(){let v=term();while(peek()&&(peek().v==='+'||peek().v==='-')){const o=next().v;const r=term();v=o==='+'?v+r:v-r;}return v;}
    function term(){let v=power();while(peek()&&(peek().v==='*'||peek().v==='/'||peek().v==='%')){const o=next().v;const r=power();v=o==='*'?v*r:o==='/'?v/r:v%r;}return v;}
    function power(){const v=unary();if(peek()&&peek().v==='^'){next();return Math.pow(v,power());}return v;}
    function unary(){if(peek()&&peek().t==='op'&&(peek().v==='-'||peek().v==='+')){const o=next().v;const v=unary();return o==='-'?-v:v;}return atom();}
    function atom(){const t=next();if(!t)throw new Error('表达式不完整');
      if(t.t==='num')return t.v;
      if(t.v==='pi')return Math.PI;if(t.v==='e')return Math.E;
      if(t.t==='fn'){const F={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,log:Math.log,log2:Math.log2,log10:Math.log10,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round};
        if(peek()&&peek().v==='('){next();const v=expr();if(next()?.v!==')')throw new Error('缺少右括号');return(F[t.v]||(()=>{throw new Error('未知函数 '+t.v);}))(v);}
        if(F[t.v])return F[t.v];throw new Error('未知标识 '+t.v);}
      if(t.v==='('){const v=expr();if(next()?.v!==')')throw new Error('缺少右括号');return v;}
      throw new Error('意外符号 '+t.v);
    }
    const v=expr();if(p<toks.length)throw new Error('表达式多余内容');return v;
  }
  const evalExpr=s=>parse(tokenize(s));
  function launch(){
    const w=WM.open('calc',{title:'计算器',w:520,h:560,single:true});if(!w)return;
    let expr='',hist=[];store.get('calc.hist',[]).then(h=>hist=h);
    w.body.innerHTML=`<div class="calc">
      <div class="calc-main">
        <div class="calc-scr"><div class="calc-expr mono"></div><div class="calc-res mono">0</div></div>
        <div class="calc-keys">
          ${[['C','fn'],['(',')','op'],['%','op'],['÷','op'],['sin','fn'],['7',''],['8',''],['9',''],['×','op'],['cos','fn'],['4',''],['5',''],['6',''],['−','op'],['tan','fn'],['1',''],['2',''],['3',''],['+','op'],['sqrt','fn'],['0',''],['.',''],['⌫','fn'],['=','eq']]
            .map(([k,cls])=>`<button class="ck ${cls==='fn'?'fn':cls==='op'?'op':cls==='eq'?'eq':''}" data-k="${k}">${k}</button>`).join('')}
        </div>
      </div>
      <div class="calc-hist"><div style="font-size:10.5px;letter-spacing:.18em;color:var(--tx3);margin-bottom:4px">历史</div><div class="ch-list" style="display:flex;flex-direction:column;gap:6px"></div></div>
    </div>`;
    const T=w.body,exprEl=$('.calc-expr',T),resEl=$('.calc-res',T),histEl=$('.ch-list',T);
    const MAP={'÷':'/','×':'*','−':'-','⌫':'BS','C':'C','=':'='};
    function render(){exprEl.textContent=expr||' ';
      if(!expr){resEl.textContent='0';return;}
      try{const v=evalExpr(expr);resEl.textContent=fmtNum(v);}catch(e){resEl.textContent='…';}
    }
    function fmtNum(v){if(!isFinite(v))return '无效';if(Number.isInteger(v))return String(v);return String(Math.round(v*1e10)/1e10);}
    function input(k){
      const m=MAP[k]||k;
      if(m==='C'){expr='';render();return;}
      if(m==='BS'){expr=expr.slice(0,-1);render();return;}
      if(m==='='){try{const v=fmtNum(evalExpr(expr));
          hist.unshift({e:expr,r:v});hist=hist.slice(0,30);store.set('calc.hist',hist);renderHist();
          exprEl.textContent=expr+' =';expr=String(v);resEl.textContent=v;}catch(e){resEl.textContent='错误';}return;}
      expr+=m;render();
    }
    function renderHist(){histEl.innerHTML='';
      if(!hist.length){histEl.innerHTML='<div class="ch-empty">暂无记录</div>';return;}
      hist.forEach(h=>{const d=el('div','ch-item',`<div class="e">${esc(h.e)}</div><div class="r">= ${esc(h.r)}</div>`);
        d.onclick=()=>{expr=h.r;render();};histEl.appendChild(d);});}
    T.addEventListener('click',e=>{const b=e.target.closest('.ck');if(b)input(b.dataset.k);});
    const calcKey=e=>{
      if(WM.active()!==w||w.minimized)return;
      if(e.target.closest('input,textarea'))return;
      if(/^[0-9+\-*/%.^()]$/.test(e.key)){input(e.key);e.preventDefault();}
      else if(e.key==='Enter')input('=');
      else if(e.key==='Backspace')input('⌫');
      else if(e.key==='Escape')input('C');
    };
    document.addEventListener('keydown',calcKey);
    const _cc=w.onClose;w.onClose=()=>{document.removeEventListener('keydown',calcKey);_cc&&_cc();};
    render();renderHist();
    return w;
  }
  return{launch};
})();

  function launch(){

          ${[['brush','画笔'],['eraser','橡皮'],['line','直线'],['rect','矩形'],['ellipse','椭圆'],['fill','填充'],['picker','取色']].map(([k,t])=>`<button class="pt-tool ${k==='brush'?'on':''}" data-t="${k}" title="${t}">${IC[k]}</button>`).join('')}
        </div>
        <div class="pt-cv-wrap"><canvas width="860" height="540"></canvas></div>
        <div class="pt-side">
          <div><div class="pt-lbl">颜料</div><div class="pt-swatches"></div></div>
          <div><div class="pt-lbl">笔触 <span class="pt-szv mono">4px</span></div><input type="range" class="pt-range" min="1" max="40" value="4"></div>
          <div><div class="pt-lbl">当前色</div><input type="color" class="pt-color" value="#1d2b2e" style="width:100%;height:34px;border:none;background:none;cursor:pointer"></div>
        </div>
      </div>`;
    const T=w.body,cv=$('canvas',T),ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.lineCap='round';ctx.lineJoin='round';
    let snapshot=null;
    const sw=$('.pt-swatches',T);
    COLORS.forEach(c=>{const s=el('div','pt-sw'+(c===state.color?' on':''));s.style.background=c;
      s.onclick=()=>{state.color=c;$('.pt-color',T).value=c;$$('.pt-sw',T).forEach(x=>x.classList.remove('on'));s.classList.add('on');};
      sw.appendChild(s);});
    $('.pt-color',T).oninput=e=>state.color=e.target.value;
    $('.pt-range',T).oninput=e=>{state.size=+e.target.value;$('.pt-szv',T).textContent=state.size+'px';};
    $$('.pt-tool',T).forEach(b=>b.onclick=()=>{state.tool=b.dataset.t;$$('.pt-tool',T).forEach(x=>x.classList.remove('on'));b.classList.add('on');});
    function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};}
    function push(){state.stack=state.stack.slice(0,state.si+1);state.stack.push(cv.toDataURL());if(state.stack.length>25)state.stack.shift();state.si=state.stack.length-1;}
    push();
    function restore(i){if(i<0||i>=state.stack.length)return;state.si=i;const img=new Image();img.onload=()=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0);};img.src=state.stack[i];}
    function flood(x,y,hex){
      const img=ctx.getImageData(0,0,cv.width,cv.height),d=img.data;
      const tx=Math.round(x),ty=Math.round(y);const i0=(ty*cv.width+tx)*4;
      const t=[d[i0],d[i0+1],d[i0+2],d[i0+3]];
      const c=hex.match(/\w\w/g).map(h=>parseInt(h,16));
      if(t[0]===c[0]&&t[1]===c[1]&&t[2]===c[2])return;
      const stack=[[tx,ty]],seen=new Set();
      while(stack.length){const[px,py]=stack.pop();if(px<0||py<0||px>=cv.width||py>=cv.height)continue;
        const k=py*cv.width+px;if(seen.has(k))continue;seen.add(k);const i=k*4;
        if(Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])>60)continue;
        d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
        stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);}
      ctx.putImageData(img,0,0);push();
    }
    cv.addEventListener('pointerdown',e=>{
      e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);state.sx=p.x;state.sy=p.y;
      if(state.tool==='picker'){const d=ctx.getImageData(p.x,p.y,1,1).data;const hx='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');state.color=hx;$('.pt-color',T).value=hx;return;}
      if(state.tool==='fill'){flood(p.x,p.y,state.color.replace('#',''));return;}
      state.drawing=true;snapshot=ctx.getImageData(0,0,cv.width,cv.height);
      if(state.tool==='brush'||state.tool==='eraser'){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y);
        ctx.strokeStyle=state.tool==='eraser'?'#fff':state.color;ctx.lineWidth=state.tool==='eraser'?state.size*2.5:state.size;ctx.stroke();}
    });
    cv.addEventListener('pointermove',e=>{
      if(!state.drawing)return;const p=pos(e);
      if(state.tool==='brush'||state.tool==='eraser'){ctx.lineTo(p.x,p.y);ctx.stroke();}
      else{ctx.putImageData(snapshot,0,0);ctx.strokeStyle=state.color;ctx.lineWidth=state.size;ctx.beginPath();
        if(state.tool==='line'){ctx.moveTo(state.sx,state.sy);ctx.lineTo(p.x,p.y);ctx.stroke();}
        else if(state.tool==='rect')ctx.strokeRect(Math.min(state.sx,p.x),Math.min(state.sy,p.y),Math.abs(p.x-state.sx),Math.abs(p.y-state.sy));
        else if(state.tool==='ellipse'){ctx.ellipse((state.sx+p.x)/2,(state.sy+p.y)/2,Math.abs(p.x-state.sx)/2,Math.abs(p.y-state.sy)/2,0,0,Math.PI*2);ctx.stroke();}}
    });
    const up=()=>{if(state.drawing){state.drawing=false;push();}};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    $('.pt-undo',T).onclick=()=>restore(state.si-1);
    $('.pt-redo',T).onclick=()=>restore(state.si+1);
    $('.pt-clear',T).onclick=async()=>{if(await Dlg.confirm('清空画布','确定清空当前画作？','清空')){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);push();}};
    $('.pt-save',T).onclick=async()=>{
      const r=await Dlg.prompt('保存画作','保存路径：','/Pictures/画作 '+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.png');
      if(!r.ok||!r.val)return;
      const p=fs.norm(r.val);await fs.mkdir(dirName(p)).catch(()=>{});
      const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
      await fs.writeFile(p,blob);Bus.emit('desk:refresh');toast('已保存到 '+p,'ok');
    };
    return w;
  }
  return{launch};
})();

      imgURL=URL.createObjectURL(file);
      const e=extOf(file.name);
      const media=e==='iso'?{cdrom:{url:imgURL,async:true}}:(['img','fda','fdi','bin','vhd'].includes(e)?{fda:{url:imgURL,async:true}}:{hda:{url:imgURL,async:true}});
      try{
        emu=new V86C({
          wasm_path:V86_WASM,
          memory_size:64*1024*1024,vga_memory_size:8*1024*1024,
          screen_container:scr,
          bios:{url:BIOS},vga_bios:{url:VGABIOS},
          ...media,autostart:true,
        });
        stEl.textContent='运行中 · '+file.name;
        $$('.vm-lock,.vm-fs,.vm-restart,.vm-stop',T).forEach(b=>b.classList.remove('dis'));
        emu.add_listener('emulator-ready',()=>{stEl.textContent='运行中 · '+file.name;});
      }catch(err){stEl.textContent='启动失败';toast('虚拟机启动失败: '+err.message,'err');drop.classList.remove('hidden');}
    }
    drop.onclick=()=>$('#inp-vm-file').click();
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];f&&boot(f);});
    const inp=$('#inp-vm-file');
    inp.onchange=e=>{const f=e.target.files[0];f&&boot(f);inp.value='';};
    $('.vm-load',T).onclick=()=>inp.click();
    /* 鼠标锁定 */
    $('.vm-lock',T).onclick=()=>{if(!emu)return;
      locked=!locked;
      try{locked?emu.lock_mouse():emu.mouse_set_status(false);}catch(e){}
      $('.vm-lock',T).classList.toggle('on',locked);
      $('.vm-lock',T).innerHTML=(locked?IC.unlock:IC.lock)+`<span>${locked?'解除锁定':'锁定鼠标'}</span>`;
      stEl.textContent=locked?'鼠标已锁定 · Esc 解除':'运行中';};
    scr.addEventListener('click',()=>{if(emu&&locked){try{emu.lock_mouse();}catch(e){}}});
    $('.vm-fs',T).onclick=()=>{scr.requestFullscreen?scr.requestFullscreen():document.documentElement.requestFullscreen();};
    $('.vm-restart',T).onclick=()=>{emu&&emu.restart();};
    $('.vm-stop',T).onclick=()=>{if(emu){emu.destroy();emu=null;}
      if(imgURL){URL.revokeObjectURL(imgURL);imgURL=null;}
      $$('.vm-lock,.vm-fs,.vm-restart,.vm-stop',T).forEach(b=>b.classList.add('dis'));
      drop.classList.remove('hidden');stEl.textContent='已关闭';};
    w.onClose=()=>{if(emu){try{emu.destroy();}catch(e){}}if(imgURL)URL.revokeObjectURL(imgURL);};
    return w;
  }
  return{launch};
})();

(async function boot(){
  await store.ready;
  await Theme.init();
  /* 强调色恢复 */
  const acc=await store.get('accent',null);
  if(acc){document.documentElement.style.setProperty('--acc',acc);
    const r=parseInt(acc.slice(1,3),16),g=parseInt(acc.slice(3,5),16),b=parseInt(acc.slice(5,7),16);
    document.documentElement.style.setProperty('--acc-soft',`rgba(${r},${g},${b},.16)`);}
  const iz=await store.get('desk.zoom',100);
  if(iz!==100)document.documentElement.style.setProperty('--icon-zoom',iz/100);
  WP.init();
  Bus.on('mount:pending',recs=>{setTimeout(()=>toast(`检测到 ${recs.length} 个本地挂载记录：浏览器安全策略要求重新授权，请在「设置 → 挂载」中重新挂载`,'warn',6500),800);});
  await fs.init();
  Desktop.refresh();
  Shell.buildGrid();
  /* 首启问候 */
  $('#inp-wallpaper').addEventListener('change',async e=>{const f=e.target.files[0];if(f){try{await WP.upload(f);}catch(err){toast(err.message,'err');}}e.target.value='';});
  const greeted=await store.get('greeted',false);
  if(!greeted){store.set('greeted',true);
    setTimeout(()=>toast('欢迎使用莫问 OS · 文件保存于浏览器 OPFS，刷新不丢失','ok',5200),600);}
  console.log('%c莫问 OS%c OPFS VFS 已挂载 · '+fs.backend(),'font-family:serif;font-size:16px;color:#d8502f','color:#888');
})();
