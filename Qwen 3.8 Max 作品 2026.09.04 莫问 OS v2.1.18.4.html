<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1214">
<title>莫问 OS · 浏览器桌面系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d8502f'/%3E%3Ctext x='32' y='45' font-family='serif' font-size='38' fill='%23f5efe2' text-anchor='middle'%3E%E5%A2%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   莫问 OS · 视觉层
   美学：莫色底 × 朱砂印 × 泥金点缀；宣纸浅色模式
   字体：站酷小薇(显示) + 思源黑体(正文) + IBM Plex Mono(等宽)
   ============================================================ */
:root{
  --disp:"ZCOOL XiaoWei","STKaiti","KaiTi",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;

  --bg0:#0b1113;          /* 最深莫色 */
  --bg1:#101a1e;          /* 面板 */
  --bg2:#16242a;          /* 抬升 */
  --bg3:#1e3038;          /* 悬停 */
  --bg4:#27404a;
  --line:#24383f;
  --line-soft:#1a2b31;
  --tx:#e9e4d6;           /* 宣纸白文字 */
  --tx2:#9db3ae;
  --tx3:#5f7a77;
  --acc:#d8502f;          /* 朱砂 */
  --acc-soft:rgba(216,80,47,.16);
  --acc-deep:#a83a20;
  --gold:#c9a227;         /* 泥金 */
  --jade:#58a189;
  --teal:#3e8f86;
  --danger:#e05a3a;
  --ok:#5fae7c;
  --sel:rgba(216,80,47,.22);
  --win-bg:rgba(16,26,30,.96);
  --task-bg:rgba(11,17,19,.88);
  --shadow-1:0 2px 8px rgba(0,0,0,.35);
  --shadow-2:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --r-s:6px; --r-m:10px; --r-l:14px;
  --task-h:50px;
  --title-h:38px;
}
[data-theme="light"]{
  --bg0:#dfe5dc;
  --bg1:#eef1ea;
  --bg2:#f7f9f3;
  --bg3:#e4eae0;
  --bg4:#d3ddd1;
  --line:#c2cec0;
  --line-soft:#d5ded2;
  --tx:#1d2b2e;
  --tx2:#4e6460;
  --tx3:#86998f;
  --acc:#c2401f;
  --acc-soft:rgba(194,64,31,.12);
  --acc-deep:#9c3116;
  --gold:#8f7414;
  --jade:#2f7d63;
  --teal:#2c7268;
  --danger:#c43d1e;
  --ok:#2e7d4f;
  --sel:rgba(194,64,31,.15);
  --win-bg:rgba(247,249,243,.97);
  --task-bg:rgba(238,241,234,.9);
  --shadow-1:0 2px 8px rgba(30,45,40,.14);
  --shadow-2:0 14px 44px rgba(30,45,40,.22),0 2px 8px rgba(30,45,40,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--body);color:var(--tx);background:var(--bg0);
  font-size:14px;line-height:1.55;user-select:none;-webkit-user-select:none;
}
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text;font-family:var(--body)}
button{font-family:var(--body);color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
svg{display:block}
.hidden{display:none !important}
.mono{font-family:var(--mono)}

/* ---------- 桌面基底 ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;touch-action:manipulation}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
#wallpaper::after{ /* 呼吸雾气层 —— 活的环境 */
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(42% 34% at 18% 22%, rgba(233,228,214,.05), transparent 70%),
    radial-gradient(36% 30% at 82% 74%, rgba(216,80,47,.05), transparent 70%);
  animation:mist 46s ease-in-out infinite alternate;pointer-events:none;
}
[data-theme="light"] #wallpaper::after{
  background:
    radial-gradient(42% 34% at 18% 22%, rgba(255,255,255,.35), transparent 70%),
    radial-gradient(36% 30% at 82% 74%, rgba(194,64,31,.06), transparent 70%);
}
@keyframes mist{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.42)}
[data-theme="light"] #vignette{box-shadow:inset 0 0 140px rgba(40,60,50,.12)}

/* ---------- 桌面图标 ---------- */
#icon-layer{position:absolute;inset:0 0 var(--task-h) 0;zoom:var(--icon-zoom,1)}
.dicon{
  position:absolute;width:92px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border-radius:var(--r-m);cursor:default;z-index:2;touch-action:none;
  transition:background .15s, transform .18s cubic-bezier(.2,.9,.3,1.2);
  animation:iconIn .4s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i)*35ms);
}
@keyframes iconIn{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
.dicon:hover{background:rgba(233,228,214,.07)}
[data-theme="light"] .dicon:hover{background:rgba(29,43,46,.06)}
.dicon.sel{background:var(--sel);outline:1px solid var(--acc-soft)}
.dicon.dragging{opacity:.45;transform:scale(.94)}
.dicon.ghost{opacity:.55;outline:1px dashed var(--acc);background:var(--acc-soft);pointer-events:none;transition:none;z-index:5}
.dicon .plate{
  width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--p1,#33474f),var(--p2,#1c2a30));
  box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.3), box-shadow .18s;
}
[data-theme="light"] .dicon .plate{box-shadow:0 4px 12px rgba(40,60,50,.25), inset 0 1px 0 rgba(255,255,255,.5)}
.dicon:hover .plate{transform:translateY(-3px) scale(1.05)}
.dicon .plate svg{width:30px;height:30px;stroke:#f2ede0;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dicon .plate .fillg{fill:#f2ede0;stroke:none}
.dicon .lbl{
  font-size:12px;line-height:1.25;text-align:center;max-width:88px;color:var(--tx);word-break:break-all;
  text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
[data-theme="light"] .dicon .lbl{text-shadow:0 1px 2px rgba(255,255,255,.7)}
.dicon .extbadge{
  position:absolute;top:40px;right:14px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.03em;
  background:var(--acc);color:#fff;padding:1px 4px;border-radius:4px;text-transform:uppercase;box-shadow:var(--shadow-1);
}
#drop-hint{
  position:absolute;inset:10px 10px calc(var(--task-h) + 10px) 10px;border:2px dashed var(--acc);border-radius:var(--r-l);
  background:var(--acc-soft);display:none;align-items:center;justify-content:center;z-index:40;pointer-events:none;
  font-family:var(--disp);font-size:26px;color:var(--tx);letter-spacing:.2em;
}
#drop-hint.on{display:flex}
#marquee{position:absolute;border:1px solid var(--acc);background:var(--sel);z-index:3;display:none;pointer-events:none}

/* ---------- 任务栏 ---------- */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:var(--task-h);z-index:9000;
  background:var(--task-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);display:flex;align-items:stretch;gap:4px;padding:0 8px;
}
#start-btn{
  width:52px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-s);position:relative;
  transition:background .15s;
}
#start-btn:hover{background:var(--bg3)}
#start-btn .seal{
  width:30px;height:30px;border-radius:7px;background:linear-gradient(150deg,var(--acc),var(--acc-deep));
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:17px;color:#fff;
  box-shadow:0 2px 8px rgba(216,80,47,.4), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s;
}
#start-btn:hover .seal{transform:rotate(-6deg) scale(1.06)}
#task-apps{flex:1;display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:none}
#task-apps::-webkit-scrollbar{display:none}
.tbtn{
  min-width:44px;height:40px;padding:0 10px;border-radius:var(--r-s);display:flex;align-items:center;gap:8px;position:relative;
  transition:background .15s;flex:0 0 auto;
}
.tbtn:hover{background:var(--bg3)}
.tbtn svg{width:22px;height:22px}
.tbtn .t-label{font-size:12.5px;color:var(--tx2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.active{background:var(--bg2)}
.tbtn.active .t-label{color:var(--tx)}
.tbtn::after{
  content:"";position:absolute;left:50%;bottom:2px;width:0;height:3px;border-radius:2px;background:var(--acc);
  transform:translateX(-50%);transition:width .25s cubic-bezier(.2,.9,.3,1.2);
}
.tbtn.running::after{width:14px}
.tbtn.active::after{width:26px}
#tray{display:flex;align-items:center;gap:2px}
.tray-btn{height:40px;min-width:38px;padding:0 6px;border-radius:var(--r-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .15s;color:var(--tx2)}
.tray-btn:hover{background:var(--bg3);color:var(--tx)}
.tray-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#clock{padding:0 10px;border-radius:var(--r-s);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.2;cursor:default}
#clock:hover{background:var(--bg3)}
#clock .t{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--tx)}
#clock .d{font-size:10.5px;color:var(--tx3)}
#show-desktop{width:10px;border-left:1px solid var(--line-soft);cursor:pointer}
#show-desktop:hover{background:var(--acc-soft)}

/* ---------- 开始菜单 ---------- */
#start-menu{
  position:absolute;left:8px;bottom:calc(var(--task-h) + 10px);width:520px;max-width:calc(100vw - 16px);
  max-height:min(620px, calc(100vh - var(--task-h) - 26px));z-index:9500;
  background:var(--win-bg);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-2);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(16px) scale(.97);transform-origin:bottom left;pointer-events:none;
  transition:opacity .2s, transform .24s cubic-bezier(.2,.9,.3,1.1);
}
#start-menu.open{opacity:1;transform:none;pointer-events:auto}
#start-search{margin:14px 14px 8px;position:relative}
#start-search input{
  width:100%;height:38px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--bg1);color:var(--tx);
  padding:0 12px 0 36px;font-size:13.5px;outline:none;transition:border-color .15s, box-shadow .15s;
}
#start-search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
#start-search svg{position:absolute;left:11px;top:10px;width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:1.8;stroke-linecap:round}
#start-grid{flex:1;overflow-y:auto;padding:8px 14px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:start}
.sapp{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:var(--r-m);
  transition:background .15s, transform .15s;cursor:pointer;
}
.sapp:hover{background:var(--bg3);transform:translateY(-2px)}
.sapp .plate{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--p1),var(--p2));box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.14)}
.sapp .plate svg{width:24px;height:24px;stroke:#f2ede0;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sapp .plate .fillg{fill:#f2ede0;stroke:none}
.sapp span{font-size:12px;color:var(--tx2)}
.sapp:hover span{color:var(--tx)}
#start-foot{border-top:1px solid var(--line-soft);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:var(--bg1)}
#start-foot .who{display:flex;align-items:center;gap:9px}
#start-foot .ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,var(--teal),#245450);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;color:#fff}
#start-foot .uname{font-size:13px}
#start-foot .ver{font-size:10.5px;color:var(--tx3);font-family:var(--mono)}
.sf-btns{display:flex;gap:4px}
.sf-btn{width:34px;height:34px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:background .15s,color .15s}
.sf-btn:hover{background:var(--bg3);color:var(--tx)}
.sf-btn.dangerous:hover{background:var(--acc-soft);color:var(--acc)}
.sf-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 窗口 ---------- */
.window{
  position:absolute;display:flex;flex-direction:column;min-width:320px;min-height:200px;
  background:var(--win-bg);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-2);
  overflow:hidden;
}
.window.entering{animation:winIn .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.window.closing{animation:winOut .16s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95) translateY(8px)}}
.window.minimizing{animation:winMin .24s ease forwards}
@keyframes winMin{to{opacity:0;transform:translateY(60px) scale(.6)}}
.window.restoring{animation:winIn .2s cubic-bezier(.2,.9,.3,1.1)}
.window.focused{border-color:var(--bg4)}
.window.focused .wtitle{opacity:1}
.wtitle{
  height:var(--title-h);flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));border-bottom:1px solid var(--line-soft);
  cursor:default;opacity:.72;transition:opacity .2s;touch-action:none;
}
.window.focused .wtitle{background:linear-gradient(180deg,var(--bg3),var(--bg2))}
.wtitle .wico{width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:linear-gradient(145deg,var(--p1,#33474f),var(--p2,#1c2a30));padding:3.5px;flex:0 0 auto}
.wtitle .wico svg{width:12px;height:12px;stroke:#f2ede0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wtitle .wico .fillg{fill:#f2ede0;stroke:none}
.wtitle .wt-text{flex:1;font-family:var(--disp);font-size:15px;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wctrl{display:flex;gap:4px;flex:0 0 auto}
.wc-btn{width:28px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:background .12s,color .12s}
.wc-btn:hover{background:var(--bg4);color:var(--tx)}
.wc-btn.close:hover{background:var(--acc);color:#fff}
.wc-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.wbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg1)}
/* 八向调整手柄 */
.rsz{position:absolute;z-index:30}
.rsz.n{top:-3px;left:10px;right:10px;height:7px;cursor:n-resize}
.rsz.s{bottom:-3px;left:10px;right:10px;height:7px;cursor:s-resize}
.rsz.e{right:-3px;top:10px;bottom:10px;width:7px;cursor:e-resize}
.rsz.w{left:-3px;top:10px;bottom:10px;width:7px;cursor:w-resize}
.rsz.ne{top:-3px;right:-3px;width:13px;height:13px;cursor:ne-resize}
.rsz.nw{top:-3px;left:-3px;width:13px;height:13px;cursor:nw-resize}
.rsz.se{bottom:-3px;right:-3px;width:13px;height:13px;cursor:se-resize}
.rsz.sw{bottom:-3px;left:-3px;width:13px;height:13px;cursor:sw-resize}
.window.maxed{border-radius:0;border-color:transparent}
.window.maxed .rsz{display:none}

/* ---------- 上下文菜单 ---------- */
#ctx-menu{
  position:fixed;z-index:9900;min-width:190px;max-width:270px;background:var(--win-bg);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:5px;display:none;backdrop-filter:blur(12px);
  animation:ctxIn .13s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes ctxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.ctx-item{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-s);font-size:13px;cursor:pointer;
  color:var(--tx);transition:background .1s;white-space:nowrap;
}
.ctx-item:hover{background:var(--bg3)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:var(--acc-soft)}
.ctx-item.dis{opacity:.38;pointer-events:none}
.ctx-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;opacity:.85}
.ctx-item .key{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx3);padding-left:18px}
.ctx-sep{height:1px;background:var(--line-soft);margin:5px 8px}
.ctx-head{padding:5px 10px 4px;font-size:10.5px;color:var(--tx3);letter-spacing:.14em}

/* ---------- 对话框 / 提示 ---------- */
#dlg-root{position:fixed;inset:0;z-index:9950;display:none;align-items:center;justify-content:center;background:rgba(6,10,11,.55);backdrop-filter:blur(3px)}
#dlg-root.open{display:flex}
.dlg{
  width:min(400px, calc(100vw - 32px));background:var(--win-bg);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-2);padding:20px;animation:dlgIn .2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes dlgIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.dlg-title{font-family:var(--disp);font-size:19px;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.dlg-title svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dlg-msg{font-size:13.5px;color:var(--tx2);margin-bottom:16px;word-break:break-all;line-height:1.65}
.dlg-input{
  width:100%;height:38px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg1);color:var(--tx);
  padding:0 12px;font-size:13.5px;outline:none;margin-bottom:16px;font-family:var(--mono);
}
.dlg-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px}
.btn{
  height:34px;padding:0 16px;border-radius:var(--r-s);font-size:13px;display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--bg2);color:var(--tx);transition:all .15s;
}
.btn:hover{background:var(--bg3);border-color:var(--bg4)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-deep);border-color:var(--acc-deep)}
.btn.dgr{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.dgr:hover{background:var(--acc-soft)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toasts{position:fixed;top:14px;right:14px;z-index:9990;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--win-bg);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--r-s);
  padding:10px 14px;font-size:13px;box-shadow:var(--shadow-2);max-width:320px;display:flex;gap:9px;align-items:flex-start;
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2);
}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--gold)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast.err svg{color:var(--danger)} .toast.ok svg{color:var(--ok)} .toast.warn svg{color:var(--gold)} .toast svg{color:var(--teal)}

/* ---------- 通用应用骨架 ---------- */
.app-toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg1);
  border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none;
}
.app-toolbar::-webkit-scrollbar{display:none}
.tb-btn{
  height:30px;min-width:30px;padding:0 8px;border-radius:var(--r-s);display:inline-flex;align-items:center;gap:6px;
  color:var(--tx2);font-size:12.5px;transition:background .12s,color .12s;flex:0 0 auto;white-space:nowrap;
}
.tb-btn:hover{background:var(--bg3);color:var(--tx)}
.tb-btn:active{transform:scale(.95)}
.tb-btn.on{background:var(--acc-soft);color:var(--acc)}
.tb-btn.dis{opacity:.35;pointer-events:none}
.tb-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tb-sep{width:1px;height:20px;background:var(--line-soft);margin:0 4px;flex:0 0 auto}
.tb-sp{flex:1}
.tb-select{
  height:30px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg2);color:var(--tx);
  font-size:12.5px;padding:0 6px;outline:none;flex:0 0 auto;
}
.app-status{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:4px 12px;font-size:11.5px;color:var(--tx3);
  border-top:1px solid var(--line-soft);background:var(--bg1);font-family:var(--mono);overflow-x:auto;scrollbar-width:none;white-space:nowrap;
}
.app-status .st-acc{color:var(--acc)}
.inp{
  height:30px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg2);color:var(--tx);
  padding:0 10px;font-size:12.5px;outline:none;
}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}

/* ---------- 文件资源管理器 ---------- */
.fx{display:flex;flex:1;overflow:hidden}
.fx-side{width:196px;flex:0 0 auto;border-right:1px solid var(--line-soft);background:var(--bg1);overflow-y:auto;padding:8px 6px}
.fx-sg{padding:6px 10px 4px;font-size:10.5px;letter-spacing:.18em;color:var(--tx3)}
.fx-si{
  display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--r-s);font-size:12.5px;color:var(--tx2);
  cursor:pointer;transition:background .12s;position:relative;
}
.fx-si:hover{background:var(--bg3);color:var(--tx)}
.fx-si.on{background:var(--acc-soft);color:var(--acc)}
.fx-si svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.fx-si .fillg{fill:currentColor;stroke:none}
.fx-si .eject{margin-left:auto;opacity:0;color:var(--tx3);display:flex;padding:2px;border-radius:4px}
.fx-si:hover .eject{opacity:1}
.fx-si .eject:hover{color:var(--danger);background:var(--acc-soft)}
.fx-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.fx-crumb{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none;background:var(--bg1)}
.fx-crumb::-webkit-scrollbar{display:none}
.crumb-seg{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--r-s);font-size:12.5px;color:var(--tx2);
  cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:background .12s;
}
.crumb-seg:hover{background:var(--bg3);color:var(--tx)}
.crumb-seg.cur{color:var(--tx);font-weight:500}
.crumb-seg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crumb-arrow{color:var(--tx3);flex:0 0 auto;font-size:11px}
.fx-search{margin-left:auto;flex:0 1 210px;min-width:120px;position:relative}
.fx-search input{width:100%;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:0 10px 0 29px;font-size:12px;outline:none}
.fx-search input:focus{border-color:var(--acc)}
.fx-search svg{position:absolute;left:9px;top:6px;width:15px;height:15px;stroke:var(--tx3);fill:none;stroke-width:1.8;stroke-linecap:round}
.fx-cols{
  flex:0 0 auto;display:grid;align-items:center;padding:0 12px;height:32px;border-bottom:1px solid var(--line-soft);
  background:var(--bg2);font-size:11.5px;color:var(--tx2);position:relative;
}
.fxc{display:flex;align-items:center;gap:5px;padding:0 6px;height:100%;cursor:pointer;position:relative;overflow:hidden;white-space:nowrap}
.fxc:hover{color:var(--tx)}
.fxc .arr{font-size:9px;color:var(--acc)}
.fxc .colrsz{position:absolute;right:-2px;top:6px;bottom:6px;width:5px;cursor:col-resize;border-radius:2px}
.fxc .colrsz:hover{background:var(--acc)}
.fx-list{flex:1;overflow:auto;position:relative;padding:4px 0 12px}
.fx-row{
  display:grid;align-items:center;padding:0 12px;height:34px;font-size:12.5px;cursor:default;position:relative;
  border-left:2px solid transparent;transition:background .1s;
}
.fx-row:hover{background:var(--bg2)}
.fx-row.sel{background:var(--sel);border-left-color:var(--acc)}
.fx-row.cut{opacity:.5}
.fx-row.dragover{outline:1px dashed var(--acc);outline-offset:-2px;background:var(--acc-soft)}
.fx-cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.fx-cell.dim{color:var(--tx3);font-size:11.5px;font-family:var(--mono)}
.fx-name{display:flex;align-items:center;gap:9px;min-width:0}
.fx-ico{width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(145deg,var(--p1,#33474f),var(--p2,#1c2a30));padding:4px;position:relative}
.fx-ico svg{width:14px;height:14px;stroke:#f2ede0;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fx-ico .fillg{fill:#f2ede0;stroke:none}
.fx-ico .extb{position:absolute;bottom:-3px;right:-6px;font-family:var(--mono);font-size:7.5px;font-weight:600;background:var(--acc);color:#fff;padding:0 3px;border-radius:3px;letter-spacing:.02em}
.fx-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx3)}
.fx-empty svg{width:52px;height:52px;stroke:var(--tx3);fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.fx-marq{position:absolute;border:1px solid var(--acc);background:var(--sel);pointer-events:none;z-index:5;display:none}
.fx-rename{
  height:26px;border-radius:4px;border:1px solid var(--acc);background:var(--bg1);color:var(--tx);padding:0 8px;
  font-size:12.5px;outline:none;width:100%;max-width:340px;font-family:var(--body);
}
.fx-progress{flex:0 0 auto;height:3px;background:var(--bg2);overflow:hidden;display:none}
.fx-progress.on{display:block}
.fx-progress i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--acc),var(--gold));animation:prog 1.1s ease-in-out infinite;border-radius:2px}
@keyframes prog{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}

/* ---------- 记事本 / 表格 ---------- */
.np-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.np-text{
  flex:1;width:100%;resize:none;border:none;outline:none;background:var(--bg0);color:var(--tx);
  padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.7;tab-size:4;white-space:pre-wrap;word-break:break-word;
}
.np-wrap-off{white-space:pre;word-break:normal;overflow-x:auto}
.np-table-wrap{flex:1;overflow:auto;background:var(--bg0)}
table.sheet{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;min-width:100%}
table.sheet th,table.sheet td{border:1px solid var(--line-soft);padding:5px 10px;text-align:left;white-space:nowrap;min-width:60px}
table.sheet thead th{position:sticky;top:0;background:var(--bg2);color:var(--tx2);font-weight:500;z-index:2}
table.sheet tbody tr:nth-child(even){background:rgba(128,160,150,.045)}
table.sheet td[contenteditable="true"]:focus{outline:2px solid var(--acc);outline-offset:-2px;background:var(--acc-soft)}
table.sheet td.rownum,table.sheet th.rownum{position:sticky;left:0;background:var(--bg2);color:var(--tx3);text-align:center;font-size:10.5px;min-width:38px;z-index:1}
table.sheet thead th.rownum{z-index:3}

/* ---------- 代码编辑器 ---------- */
.ced{display:flex;flex-direction:column;flex:1;overflow:hidden;--split:56%}
.ced-main{flex:1;display:flex;overflow:hidden;min-height:0}
.ced-edit{width:var(--split);min-width:200px;display:flex;flex-direction:column;overflow:hidden;background:#212121;position:relative}
.ced-split{width:6px;flex:0 0 auto;background:var(--line-soft);cursor:col-resize;position:relative;transition:background .15s}
.ced-split:hover,.ced-split.on{background:var(--acc)}
.ced-split::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:34px;border-radius:2px;background:var(--tx3)}
.ced-prev{flex:1;min-width:120px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.ced-prev iframe{flex:1;border:none;width:100%;height:100%;background:#fff}
.ced-prevbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg2);border-bottom:1px solid var(--line-soft);font-size:11px;color:var(--tx3)}
.ced-prevbar .dotg{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.ced-status{
  flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:4px 12px;background:#1a1a1a;color:#8b9a94;
  font-family:var(--mono);font-size:11px;border-top:1px solid #000;overflow-x:auto;white-space:nowrap;scrollbar-width:none;
}
.ced-status b{color:#e0c97f;font-weight:500}
.ced-findbar{
  position:absolute;top:0;left:0;right:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:7px 10px;display:none;flex-direction:column;gap:6px;box-shadow:var(--shadow-1);animation:ctxIn .15s;
}
.ced-findbar.open{display:flex}
.cfb-row{display:flex;gap:6px;align-items:center}
.cfb-inp{
  flex:1;height:28px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg1);color:var(--tx);
  padding:0 9px;font-size:12px;outline:none;font-family:var(--mono);min-width:60px;
}
.cfb-inp:focus{border-color:var(--acc)}
.cfb-inp.bad{border-color:var(--danger)}
.cfb-count{font-family:var(--mono);font-size:11px;color:var(--tx3);min-width:56px;text-align:center;flex:0 0 auto}
.cfb-count.err{color:var(--danger)}
.tgl{
  height:28px;min-width:28px;padding:0 7px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg1);
  color:var(--tx3);font-family:var(--mono);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:all .12s;
}
.tgl:hover{color:var(--tx);border-color:var(--bg4)}
.tgl.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* CodeMirror 适配 */
.ced-edit{min-width:0}
.ced-edit .CodeMirror{flex:1;height:auto;min-height:0;font-family:var(--mono);font-size:13px;line-height:1.65}
.CodeMirror-gutters{border-right:1px solid #2e2e2e}
.cm-match-a{background:rgba(201,162,39,.28);border-radius:2px;box-shadow:0 0 0 1px rgba(201,162,39,.5)}
.cm-match-b{background:var(--acc);color:#fff !important;border-radius:2px}
.CodeMirror-activeline-background{background:rgba(255,255,255,.045) !important}
.cm-trailingspace{background:rgba(224,90,58,.35)}

/* ---------- 漫画阅读器 / 查看器 ---------- */
.mg{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#000}
.mg-strip{flex:1;overflow:auto;background:#000;display:flex;flex-direction:column;align-items:center;scroll-behavior:auto}
.mg-strip img{width:100%;max-width:1000px;display:block;pointer-events:none}
.mg-loading{padding:40px 0;display:flex;flex-direction:column;align-items:center;gap:12px;color:#8b9a94;font-size:13px;width:100%}
.mg-loading .ring{width:38px;height:38px;border-radius:50%;border:3px solid #2a2a2a;border-top-color:var(--acc);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mg-single{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#0a0a0a;position:relative}
.mg-single img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s;cursor:grab}
.mg-hud{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;
  background:rgba(10,14,15,.85);border:1px solid #2a3a3f;border-radius:22px;padding:5px 8px;z-index:10;
}
.mg-hud .tb-btn{color:#9db3ae}
.mg-hud .tb-btn:hover{background:#1e3038;color:#e9e4d6}
.mg-page{font-family:var(--mono);font-size:11.5px;color:#9db3ae;padding:0 8px}
.mg-exitfs{
  position:fixed;top:14px;right:14px;z-index:9999;width:38px;height:38px;border-radius:50%;background:rgba(10,14,15,.7);
  border:1px solid #2a3a3f;color:#9db3ae;display:flex;align-items:center;justify-content:center;opacity:.35;transition:opacity .2s, background .2s;
}
.mg-exitfs:hover{opacity:1;background:var(--acc);color:#fff;border-color:var(--acc)}
.mg-exitfs svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.window.manga-full .wtitle,.window.manga-full .rsz{display:none}
.window.manga-full{border-radius:0;border:none}

/* ---------- 浏览器 ---------- */
.br-bar{flex:0 0 auto;display:flex;gap:5px;align-items:center;padding:7px 9px;background:var(--bg1);border-bottom:1px solid var(--line-soft)}
.br-url{flex:1;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:0 14px;font-size:12.5px;outline:none;font-family:var(--mono)}
.br-url:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.br-frame{flex:1;background:#fff;border:none;width:100%}
.br-note{padding:3px 12px;font-size:10.5px;color:var(--tx3);background:var(--bg1);border-top:1px solid var(--line-soft);flex:0 0 auto}

/* ---------- 计算器 ---------- */
.calc{display:flex;flex:1;overflow:hidden}
.calc-main{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px;min-width:0}
.calc-scr{
  background:var(--bg0);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:12px 16px;text-align:right;
  min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;overflow:hidden;
}
.calc-expr{font-family:var(--mono);font-size:13px;color:var(--tx3);min-height:18px;word-break:break-all}
.calc-res{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:.02em;word-break:break-all;line-height:1.2}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{
  border-radius:var(--r-m);background:var(--bg2);border:1px solid var(--line-soft);font-family:var(--mono);font-size:17px;
  color:var(--tx);transition:all .1s;display:flex;align-items:center;justify-content:center;min-height:44px;
}
.ck:hover{background:var(--bg3)}
.ck:active{transform:scale(.93)}
.ck.op{color:var(--gold);background:var(--bg1)}
.ck.fn{color:var(--tx2);font-size:14px}
.ck.eq{background:var(--acc);border-color:var(--acc);color:#fff;font-size:21px}
.ck.eq:hover{background:var(--acc-deep)}
.calc-hist{width:200px;flex:0 0 auto;border-left:1px solid var(--line-soft);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg1)}
.ch-item{padding:7px 9px;border-radius:var(--r-s);background:var(--bg2);cursor:pointer;transition:background .12s}
.ch-item:hover{background:var(--bg3)}
.ch-item .e{font-family:var(--mono);font-size:11px;color:var(--tx3);word-break:break-all}
.ch-item .r{font-family:var(--mono);font-size:14px;color:var(--tx);word-break:break-all}
.ch-empty{color:var(--tx3);font-size:11.5px;text-align:center;padding:20px 0}

/* ---------- 画板 ---------- */
.pt{display:flex;flex:1;overflow:hidden}
.pt-tools{width:52px;flex:0 0 auto;border-right:1px solid var(--line-soft);background:var(--bg1);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto}
.pt-tool{width:38px;height:38px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:all .12s;flex:0 0 auto}
.pt-tool:hover{background:var(--bg3);color:var(--tx)}
.pt-tool.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.pt-tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pt-cv-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--bg0);padding:16px;position:relative}
.pt-cv-wrap canvas{background:#fff;box-shadow:var(--shadow-2);touch-action:none;cursor:crosshair;border-radius:2px}
.pt-side{width:178px;flex:0 0 auto;border-left:1px solid var(--line-soft);background:var(--bg1);padding:12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.pt-lbl{font-size:10.5px;letter-spacing:.16em;color:var(--tx3);margin-bottom:6px}
.pt-swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pt-sw{aspect-ratio:1;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.pt-sw:hover{transform:scale(1.12)}
.pt-sw.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--bg1)}
.pt-range{width:100%;accent-color:var(--acc)}

/* ---------- 设置 ---------- */
.st{display:flex;flex:1;overflow:hidden}
.st-nav{width:172px;flex:0 0 auto;border-right:1px solid var(--line-soft);background:var(--bg1);padding:10px 8px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.st-ni{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-s);font-size:13px;color:var(--tx2);cursor:pointer;transition:background .12s}
.st-ni:hover{background:var(--bg3);color:var(--tx)}
.st-ni.on{background:var(--acc-soft);color:var(--acc)}
.st-ni svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.st-body{flex:1;overflow-y:auto;padding:20px 24px}
.st-h{font-family:var(--disp);font-size:21px;letter-spacing:.08em;margin-bottom:4px}
.st-sub{font-size:12px;color:var(--tx3);margin-bottom:18px}
.st-card{background:var(--bg2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:16px;margin-bottom:14px}
.st-card h4{font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.st-card h4 svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;font-size:13px}
.st-row + .st-row{border-top:1px solid var(--line-soft)}
.st-row .desc{font-size:11.5px;color:var(--tx3);margin-top:2px}
.sw2{width:42px;height:23px;border-radius:12px;background:var(--bg4);position:relative;transition:background .2s;flex:0 0 auto;cursor:pointer}

.seg button{padding:6px 14px;font-size:12.5px;color:var(--tx2);transition:all .12s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--acc);color:#fff}

/* 应用配色（印章双色渐变） */
const PLATE={
  ink:['#3c545e','#1f3038'],seal:['#d8502f','#93301b'],gold:['#c9a227','#8a6a12'],
  jade:['#58a189','#2f6a58'],teal:['#3e8f86','#245850'],plum:['#8a5a6e','#54323f'],
  slate:['#5a6f7a','#33454e'],moss:['#7a9a5a','#4a6436'],rust:['#b06a3a','#75401f'],
  indigo:['#54688a','#2e3c55']
};
function typeMeta(name,isDir){
  if(isDir)return{icon:IC.folder,plate:PLATE.gold,label:'文件夹'};
  const e=extOf(name);
  if(IMG_EXT.includes(e))return{icon:IC.image,plate:PLATE.jade,label:'图像',badge:e};
  if(AUD_EXT.includes(e))return{icon:IC.music,plate:PLATE.plum,label:'音频',badge:e};
  if(VID_EXT.includes(e))return{icon:IC.video,plate:PLATE.indigo,label:'视频',badge:e};
  if(ZIP_EXT.includes(e))return{icon:IC.zip,plate:PLATE.rust,label:'压缩包',badge:e};
  if(GZ_EXT.includes(e)||TAR_EXT.includes(e))return{icon:IC.zip,plate:PLATE.rust,label:'压缩档',badge:e};
  if(e==='pdf')return{icon:IC.pdf,plate:PLATE.seal,label:'PDF 文档',badge:'pdf'};
  if(SHEET_EXT.includes(e))return{icon:IC.table,plate:PLATE.moss,label:'表格',badge:e};
  if(['html','htm','css','js','mjs','json','xml','svg','ts','vue'].includes(e))return{icon:IC.editor,plate:PLATE.teal,label:'代码',badge:e};
  if(TXT_EXT.includes(e)||e==='')return{icon:IC.textfile,plate:PLATE.slate,label:e?'文本':'文件',badge:e||''};
  return{icon:IC.file,plate:PLATE.slate,label:e.toUpperCase()+' 文件',badge:e};
}
/* ============================================================
   虚拟文件系统 fs —— OPFS 为基座
   · OPFS：大文件 / 二进制 / 目录树（主后端）
   · IndexedDB：元数据 / 挂载记录 / 图标布局（经 store）
   · localStorage：降级缓存（store 内部自动）
   · Cookie：主题偏好副本（跨存储冗余）
   · /mnt/local/* 路径透明路由到 File System Access 后端
   ============================================================ */
const fs=(()=>{
  let root=null, opfsOK=false;
  const enc=new TextEncoder(), dec=new TextDecoder();
  const mounts=new Map();           // name -> FileSystemDirectoryHandle
  const memFallback=new Map();      // 极端降级：内存 FS
  const blobCache=new Map();        // path -> {url,t}
  /* 参数归一：兼容 (path, flag, cb) / (path, cb) / (path) 等任意签名 */
  function pub(fn){return function(...args){let cb=null;while(args.length&&typeof args[args.length-1]==='function')cb=args.pop();const p=Promise.resolve().then(()=>fn(...args));if(cb)p.then(r=>cb(null,r),e=>cb(e));return p;};}
  const norm=p=>{if(!p||p==='/'||p==='.')return '/';const a=String(p).replace(/\\/g,'/').split('/').filter(Boolean);const out=[];for(const s of a){if(s==='.')continue;if(s==='..')out.pop();else out.push(s);}return '/'+out.join('/');};
  const parts=p=>norm(p).split('/').filter(Boolean);
  function mountAt(p){const a=parts(p);if(a[0]==='mnt'&&a[1]==='local'&&a[2]&&mounts.has(a[2]))return{name:a[2],handle:mounts.get(a[2]),rest:a.slice(3)};return null;}
  /* ---- 本地后端（File System Access），签名与 OPFS 路径完全对齐 ---- */
  async function lResolve(handle,rest,create){let cur=handle;for(let i=0;i<rest.length;i++){try{cur=await cur.getDirectoryHandle(rest[i],{create:create&&i===rest.length-1?false:false});}catch(e){if(create&&i===rest.length-1){try{const fh=await cur.getFileHandle(rest[i],{create:true});return{kind:'file',handle:fh,parent:cur};}catch(e2){}}throw e;}}return{kind:'dir',handle:cur};}
  async function lStat(name2,p){const m=mountAt(p);const{rest}=m;let handle=m.handle;try{
    if(rest.length===0){return{name:m.name,path:p,isDir:true,size:0,mtime:Date.now(),type:'目录'};}
    for(let i=0;i<rest.length-1;i++)handle=await handle.getDirectoryHandle(rest[i]);
    const last=rest[rest.length-1];
    try{await handle.getDirectoryHandle(last);return{name:last,path:p,isDir:true,size:0,mtime:Date.now(),type:'目录'};}
    catch(e2){const fh=await handle.getFileHandle(last);const f=await fh.getFile();return{name:last,path:p,isDir:false,size:f.size,mtime:f.lastModified,type:typeMeta(last,false).label};}
  }catch(e){const err=new Error('不存在: '+p);err.code='ENOENT';throw err;}}
  async function lReaddir(p){const m=mountAt(p);let dir=m.handle;for(const s of m.rest)dir=await dir.getDirectoryHandle(s);const out=[];
    for await(const [nm,h] of dir.entries()){try{if(h.kind==='file'){const f=await h.getFile();out.push({name:nm,path:joinPath(p,nm),isDir:false,size:f.size,mtime:f.lastModified,type:typeMeta(nm,false).label});}else out.push({name:nm,path:joinPath(p,nm),isDir:true,size:0,mtime:Date.now(),type:'目录'});}catch(e){}}
    return out;}
  async function lRead(p,flag){const m=mountAt(p);let dir=m.handle;for(let i=0;i<m.rest.length-1;i++)dir=await dir.getDirectoryHandle(m.rest[i]);const fh=await dir.getFileHandle(m.rest[m.rest.length-1]);const f=await fh.getFile();
    if(flag==='blob'||flag==='file')return f;if(flag==='text'||flag==='utf8')return await f.text();return await f.arrayBuffer();}
  async function lWrite(p,data){const m=mountAt(p);let dir=m.handle;for(let i=0;i<m.rest.length-1;i++)dir=await dir.getDirectoryHandle(m.rest[i],{create:true});const fh=await dir.getFileHandle(m.rest[m.rest.length-1],{create:true});const w=await fh.createWritable();await w.write(data instanceof Blob?data:new Blob([data]));await w.close();Bus.emit('fs:change',dirName(p));return true;}
  async function lMkdir(p){const m=mountAt(p);let dir=m.handle;const full=[...m.rest];const last=full.pop();for(const s of full)dir=await dir.getDirectoryHandle(s,{create:true});await dir.getDirectoryHandle(last,{create:true});return true;}
  async function lDelete(p){const m=mountAt(p);let dir=m.handle;for(let i=0;i<m.rest.length-1;i++)dir=await dir.getDirectoryHandle(m.rest[i]);await dir.removeEntry(m.rest[m.rest.length-1],{recursive:true});Bus.emit('fs:change',dirName(p));return true;}
  async function lCopy(src,dst){const st=await fs.stat(src);if(st.isDir){await fs.mkdir(dst).catch(()=>{});const list=await fs.readdir(src);for(const it of list)await lCopy(it.path,joinPath(dst,it.name));return true;}const buf=await fs.readFile(src);return fs.writeFile(dst,buf);}
  async function lRename(oldP,newP){
    const st=await fs.stat(oldP);
    if(st.isDir){await lCopyDirAll(oldP,newP);}
    else{const buf=await fs.readFile(oldP);await fs.writeFile(newP,buf);}
    return lDelete(oldP);
  }
  async function lCopyDirAll(s,d){await fs.mkdir(d).catch(()=>{});const list=await fs.readdir(s);for(const it of list){const dd=joinPath(d,it.name);if(it.isDir)await lCopyDirAll(it.path,dd);else{const b=await fs.readFile(it.path);await fs.writeFile(dd,b);}}return true;}
  /* ---- OPFS 后端 ---- */
  async function oDir(p,create){let cur=root;for(const s of parts(p)){cur=await cur.getDirectoryHandle(s,{create:!!create});}return cur;}
  async function oFile(p,create){const a=parts(p);const nm=a.pop();const dir=await oDir('/'+a.join('/'),create);return await dir.getFileHandle(nm,{create:!!create});}
  async function oStat(p){const a=parts(p);if(a.length===0)return{name:'/',path:'/',isDir:true,size:0,mtime:Date.now(),type:'目录'};const nm=a[a.length-1];
    try{const dir=await oDir('/'+a.slice(0,-1).join('/'));try{const dh=await dir.getDirectoryHandle(nm);return{name:nm,path:norm(p),isDir:true,size:0,mtime:Date.now(),type:'目录'};}catch(e){const fh=await dir.getFileHandle(nm);const f=await fh.getFile();return{name:nm,path:norm(p),isDir:false,size:f.size,mtime:f.lastModified,type:typeMeta(nm,false).label};}}catch(e){const err=new Error('不存在: '+p);err.code='ENOENT';throw err;}}
  async function oReaddir(p){const dir=await oDir(p);const out=[];for await(const [nm,h] of dir.entries()){try{if(h.kind==='directory')out.push({name:nm,path:joinPath(p,nm),isDir:true,size:0,mtime:Date.now(),type:'目录'});else{const f=await h.getFile();out.push({name:nm,path:joinPath(p,nm),isDir:false,size:f.size,mtime:f.lastModified,type:typeMeta(nm,false).label});}}catch(e){}}return out;}
  async function oRead(p,flag){const fh=await oFile(p);const f=await fh.getFile();if(flag==='blob'||flag==='file')return f;if(flag==='text'||flag==='utf8')return await f.text();return await f.arrayBuffer();}
  async function oWrite(p,data){const fh=await oFile(p,true);const w=await fh.createWritable();await w.write(data instanceof Blob?data:new Blob([data]));await w.close();Bus.emit('fs:change',dirName(p));return true;}
  async function oMkdir(p){await oDir(p,true);return true;}
  async function oDelete(p){const a=parts(p);const nm=a.pop();const dir=await oDir('/'+a.join('/'));await dir.removeEntry(nm,{recursive:true});Bus.emit('fs:change',dirName(p));return true;}
  /* ---- 路由层：对上层完全透明 ---- */

/* ---------- 归档引擎：gz/tar 原生 · zip 用 JSZip · 7z 用 wasm ---------- */
const Archive=(()=>{
  async function gunzip(ab){const ds=new DecompressionStream('gzip');const stream=new Blob([ab]).stream().pipeThrough(ds);const buf=await new Response(stream).arrayBuffer();return buf;}
  function parseTar(ab){const u8=new Uint8Array(ab);const files=[];let off=0;
    while(off+512<=u8.length){
      const hdr=u8.subarray(off,off+512);
      if(hdr.every(b=>b===0))break;
      let name='';for(let i=0;i<100&&hdr[i];i++)name+=String.fromCharCode(hdr[i]);
      let sizeStr='';for(let i=124;i<136&&hdr[i]&&hdr[i]!==32;i++)sizeStr+=String.fromCharCode(hdr[i]);
      const size=parseInt(sizeStr.trim(),8)||0;
      const type=String.fromCharCode(hdr[156]);
      let prefix='';for(let i=345;i<500&&hdr[i];i++)prefix+=String.fromCharCode(hdr[i]);
      if(prefix)name=prefix+'/'+name;
      off+=512;
      if((type==='0'||type==='\0'||type==='')&&name&&!name.endsWith('/')){
        const data=u8.slice(off,off+size).buffer;
        /* pax 扩展头中的真实文件名 */
        files.push({name:name.replace(/^\.\//,''),data});
      }
      off+=Math.ceil(size/512)*512;
    }
    return files;
  }
  async function writeAll(base,files,onProgress){
    let i=0;for(const f of files){i++;if(onProgress)onProgress(i,files.length,f.name);
      if(!f.name||f.name.endsWith('/'))continue;
      const p=joinPath(base,f.name);await fs.mkdir(dirName(p)).catch(()=>{});
      await fs.writeFile(p,f.data);}
    Bus.emit('fs:change',base);
  }
  return{
    canGz:()=>typeof DecompressionStream!=='undefined',
    async extract(path,destDir){
      const st=await fs.stat(path);const e=extOf(st.name);const base=destDir||dirName(path);
      const target=joinPath(base,st.name.replace(/\.(zip|gz|tgz|tar|7z)$/i,'').replace(/\.tar$/i,''));
      if(e==='zip'){const JSZip=await Libs.jszip();const z=await JSZip.loadAsync(await fs.readBlob(path));const files=[];z.forEach((rel,ent)=>{if(!ent.dir)files.push({name:rel,data:null,ent});});
        let i=0;for(const f of files){i++;const buf=await f.ent.async('arraybuffer');const p=joinPath(target,f.name);await fs.mkdir(dirName(p)).catch(()=>{});await fs.writeFile(p,buf);}
        Bus.emit('fs:change',base);return{target,count:files.length};}
      if(e==='gz'||e==='tgz'){if(!Archive.canGz())throw new Error('当前浏览器不支持原生 gzip 解压');const raw=await gunzip(await fs.readFile(path));
        if(e==='tgz'||isTar(raw)){const files=parseTar(raw);await writeAll(target,files);return{target,count:files.length};}
        const inner=st.name.replace(/\.gz$/i,'');const p=joinPath(base,inner);await fs.writeFile(p,raw);Bus.emit('fs:change',base);return{target:base,count:1};}
      if(e==='tar'){const files=parseTar(await fs.readFile(path));await writeAll(target,files);return{target,count:files.length};}
      if(e==='7z'){try{const SevenZip=await Libs.sevenZip();await SevenZip.loadWasmModule();throw new Error('7z-wasm 接口不可用，请使用 zip/tar/gz');}catch(err){throw err;}}
      throw new Error('不支持的压缩格式: .'+e);
    }
  };
  function isTar(ab){const u8=new Uint8Array(ab);if(u8.length<512)return false;let s='';for(let i=257;i<262&&u8[i];i++)s+=String.fromCharCode(u8[i]);return s==='ustar';}
})();
/* ---------- 对话框 & 通知 ---------- */
const Dlg=(()=>{
  const root=$('#dlg-root');
  function show({title,msg,input,buttons,icon}){return new Promise(res=>{
    root.innerHTML='';const d=el('div','dlg');
    d.appendChild(el('div','dlg-title',(icon||IC.info)+esc(title)));
    if(msg)d.appendChild(el('div','dlg-msg',esc(msg)));
    let inp=null;if(input!=null){inp=el('input','dlg-input');inp.value=input;d.appendChild(inp);}
    const bs=el('div','dlg-btns');
    (buttons||[{t:'确定',v:true,pri:true},{t:'取消',v:false}]).forEach(b=>{
      const btn=el('button','btn'+(b.pri?' pri':'')+(b.dgr?' dgr':''),esc(b.t));
      btn.onclick=()=>{close(b.v===undefined?true:b.v);};bs.appendChild(btn);});
    const close=v=>{root.classList.remove('open');root.innerHTML='';res(inp?{ok:v,val:inp.value}:v);};
    d.appendChild(bs);root.appendChild(d);root.classList.add('open');
    root.onclick=e=>{if(e.target===root)close(input!=null?{ok:false,val:inp.value}:false);};
    if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')close(true);};}
    const onKey=e=>{if(e.key==='Escape'){close(input!=null?{ok:false,val:inp.value}:false);window.removeEventListener('keydown',onKey);}};
    window.addEventListener('keydown',onKey);
  });}
  return{
    alert:(title,msg)=>show({title,msg,buttons:[{t:'知道了',v:true,pri:true}]}),
    confirm:(title,msg,okT='确定',cancelT='取消')=>show({title,msg,buttons:[{t:okT,v:true,pri:true},{t:cancelT,v:false}]}),
    danger:(title,msg,okT='删除')=>show({title,msg,icon:IC.warn,buttons:[{t:okT,v:true,dgr:true},{t:'取消',v:false}]}),
    prompt:(title,msg,def='')=>show({title,msg,input:def,buttons:[{t:'确定',v:true,pri:true},{t:'取消',v:false}]}),
  };
})();
function toast(msg,type='info',ms=3200){
  const t=el('div','toast '+type);const icons={info:IC.info,ok:IC.check,err:IC.warn,warn:IC.warn};
  t.innerHTML=icons[type]||IC.info;t.appendChild(el('span','',esc(msg)));
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},ms);
}
/* ============================================================
   窗口管理器 WM —— 拖拽 / 八向缩放 / 最小化 / 最大化 / 置顶
   ============================================================ */
const WM=(()=>{
  let zTop=100,wins=[],active=null;
  const layer=$('#desktop');
  const isMobile=()=>matchMedia('(max-width:820px)').matches;
  function focusWin(w){if(!w)return;wins.forEach(x=>x.el.classList.toggle('focused',x===w));if(active!==w){active=w;renderTaskbar();}}
  function bringTop(w){
    if(zTop>8000){wins.forEach((x,i)=>x.el.style.zIndex=100+i);zTop=100+wins.length;}
    w.el.style.zIndex=++zTop;focusWin(w);
  }
  function open(appId,opts={}){
    const app=APPS[appId];if(!app){toast('未知应用: '+appId,'err');return null;}
    if(app.single){const ex=wins.find(w=>w.appId===appId&&(!app.singleKey||w.singleKey===opts.singleKey));if(ex){restore(ex);bringTop(ex);if(ex.onReuse)ex.onReuse(opts);return ex;}}
    const w={id:uid(),appId,opts,title:opts.title||app.name,closed:false,minimized:false,maxed:false,preRect:null,singleKey:opts.singleKey};
    const win=el('div','window entering');
    const small=isMobile();
    const W=small?innerWidth:Math.min(opts.w||app.w||760,innerWidth-24);
    const H=small?innerHeight-58:Math.min(opts.h||app.h||520,innerHeight-90);
    const X=small?0:clamp(opts.x??(innerWidth-W)/2+((wins.length%6)*26-40),4,innerWidth-W-4);
    const Y=small?0:clamp(opts.y??(innerHeight-H)/2+((wins.length%6)*20-50),4,innerHeight-H-64);
    win.style.cssText+=`left:${X}px;top:${Y}px;width:${W}px;height:${H}px;z-index:${++zTop};--p1:${(app.plate||PLATE.ink)[0]};--p2:${(app.plate||PLATE.ink)[1]}`;
    const title=el('div','wtitle');
    title.innerHTML=`<span class="wico">${app.icon}</span><span class="wt-text">${esc(w.title)}</span>
      <span class="wctrl">
        <button class="wc-btn min" title="最小化">${IC.minus}</button>
        <button class="wc-btn mx" title="最大化">${IC.maximize}</button>
        <button class="wc-btn close" title="关闭">${IC.x}</button>
      </span>`;
    const body=el('div','wbody');
    win.appendChild(title);win.appendChild(body);
    ['n','s','e','w','ne','nw','se','sw'].forEach(d=>{const h=el('div','rsz '+d);h.dataset.dir=d;win.appendChild(h);});
    layer.appendChild(win);
    w.el=win;w.body=body;w.titleEl=$('.wt-text',win);w.app=app;
    wins.push(w);
    /* 拖拽标题栏 */
    title.addEventListener('pointerdown',e=>{
      if(e.target.closest('.wc-btn'))return;
      bringTop(w);
      if(isMobile()||w.maxed)return;
      const sx=e.clientX-win.offsetLeft,sy=e.clientY-win.offsetTop;
      title.setPointerCapture(e.pointerId);
      const mv=ev=>{win.style.left=clamp(ev.clientX-sx,-win.offsetWidth+120,innerWidth-90)+'px';win.style.top=clamp(ev.clientY-sy,0,innerHeight-100)+'px';};
      const up=()=>{title.removeEventListener('pointermove',mv);title.removeEventListener('pointerup',up);};
      title.addEventListener('pointermove',mv);title.addEventListener('pointerup',up);
    });
    title.addEventListener('dblclick',e=>{if(!e.target.closest('.wc-btn'))toggleMax(w);});
    $('.wc-btn.min',win).onclick=e=>{e.stopPropagation();minimize(w);};
    $('.wc-btn.mx',win).onclick=e=>{e.stopPropagation();toggleMax(w);};
    $('.wc-btn.close',win).onclick=e=>{e.stopPropagation();close(w);};
    win.addEventListener('pointerdown',()=>bringTop(w),true);
    /* 八向缩放 */
    $$('.rsz',win).forEach(h=>h.addEventListener('pointerdown',e=>{
      if(w.maxed||isMobile())return;e.stopPropagation();bringTop(w);
      const d=h.dataset.dir,sx=e.clientX,sy=e.clientY,r0=win.getBoundingClientRect();
      h.setPointerCapture(e.pointerId);
      const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;let{x,y,width:W2,height:H2}={x:r0.left,y:r0.top,width:r0.width,height:r0.height};
        if(d.includes('e'))W2=Math.max(320,r0.width+dx);
        if(d.includes('s'))H2=Math.max(200,r0.height+dy);
        if(d.includes('w')){W2=Math.max(320,r0.width-dx);x=r0.left+(r0.width-W2);}
        if(d.includes('n')){H2=Math.max(200,r0.height-dy);y=Math.max(0,r0.top+(r0.height-H2));}
        win.style.left=x+'px';win.style.top=y+'px';win.style.width=W2+'px';win.style.height=H2+'px';};
      const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);Bus.emit('win:resize',w);};
      h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);
    }));
    focusWin(w);
    setTimeout(()=>win.classList.remove('entering'),260);
    renderTaskbar();
    return w;
  }
  function close(w){if(!w||w.closed)return;w.closed=true;
    if(w.onClose)try{w.onClose();}catch(e){console.error(e);}
    w.el.classList.add('closing');setTimeout(()=>w.el.remove(),170);
    wins=wins.filter(x=>x!==w);if(active===w)active=wins[wins.length-1]||null;
    if(active)focusWin(active);renderTaskbar();Bus.emit('win:close',w);}
  function minimize(w){if(w.minimized)return;w.minimized=true;w.el.classList.add('minimizing');
    setTimeout(()=>{w.el.style.display='none';w.el.classList.remove('minimizing');},240);
    if(active===w){active=wins.filter(x=>!x.minimized).pop()||null;if(active)focusWin(active);else{wins.forEach(x=>x.el.classList.remove('focused'));renderTaskbar();}}
    renderTaskbar();}
  function restore(w){w.minimized=false;w.el.style.display='';w.el.classList.add('restoring');setTimeout(()=>w.el.classList.remove('restoring'),220);bringTop(w);}
  function toggleMax(w){if(isMobile())return;
    if(w.maxed){const r=w.preRect;w.el.style.left=r.x+'px';w.el.style.top=r.y+'px';w.el.style.width=r.w+'px';w.el.style.height=r.h+'px';w.el.classList.remove('maxed');$('.wc-btn.mx',w.el).innerHTML=IC.maximize;w.maxed=false;}
    else{w.preRect={x:w.el.offsetLeft,y:w.el.offsetTop,w:w.el.offsetWidth,h:w.el.offsetHeight};w.el.classList.add('maxed');w.el.style.left='0px';w.el.style.top='0px';w.el.style.width='100%';w.el.style.height=`calc(100% - var(--task-h))`;$('.wc-btn.mx',w.el).innerHTML=IC.restore;w.maxed=true;}
    setTimeout(()=>Bus.emit('win:resize',w),60);}
  function setTitle(w,t){w.title=t;w.titleEl.textContent=t;}
  function renderTaskbar(){
    const box=$('#task-apps');box.innerHTML='';
    wins.forEach(w=>{const app=APPS[w.appId];const b=el('button','tbtn'+(w===active&&!w.minimized?' active':'')+(true?' running':''));
      b.style.setProperty('--p1',(app.plate||PLATE.ink)[0]);b.style.setProperty('--p2',(app.plate||PLATE.ink)[1]);
      b.innerHTML=app.icon+(isMobile()?'':`<span class="t-label">${esc(w.title)}</span>`);
      b.title=w.title;
      b.onclick=()=>{if(w.minimized)restore(w);else if(active===w)minimize(w);else bringTop(w);};
      box.appendChild(b);});
  }
  return{open,close,minimize,restore,toggleMax,focus:bringTop,setTitle,list:()=>wins,active:()=>active,renderTaskbar};
})();

const Ctx=(()=>{

    box.style.left=clamp(x,4,innerWidth-r.width-6)+'px';

})();

/* ============================================================
   桌面图标 —— 自由摆放 + 原生 DnD（拖出/拖入）+ 触摸长按
   ============================================================ */
const Desktop=(()=>{
  const layer=$('#icon-layer');
  const iconLayerEl=layer;
  let positions={};          // path -> {x,y}
  let sel=new Set();         // 选中的图标 path（特殊项用 @computer / @trash 前缀）
  const SPECIALS=[
    {key:'@computer',name:'此电脑',icon:IC.computer,plate:PLATE.ink,open:()=>APPS.explorer.launch({path:'/'})},
    {key:'@trash',name:'回收站',icon:IC.trash,plate:PLATE.slate,open:()=>APPS.explorer.launch({path:fs.trashPath()})},
  ];
  const dragCache=new Map();  // path -> {file,url} 预载（dragstart 内禁异步）
  let snapGrid=true;
  const CELL={w:96,h:104};
  function freePos(){const used=new Set(Object.values(positions).map(p=>p.x+','+p.y));
    for(let y=10;y<innerHeight-160;y+=CELL.h)for(let x=10;x<innerWidth-110;x+=CELL.w){if(!used.has(x+','+y))return{x,y};}
    return{x:10+Math.random()*200,y:10+Math.random()*200};}
  function snap(x,y){return snapGrid?{x:Math.round((x-10)/CELL.w)*CELL.w+10,y:Math.round((y-10)/CELL.h)*CELL.h+10}:{x,y};}
  function iconEl(st,i){
    const meta=st.special?{icon:st.icon,plate:st.plate,label:''}:typeMeta(st.name,st.isDir);
    const d=el('div','dicon');d.dataset.path=st.path;d.dataset.special=st.special?'1':'';
    d.draggable=true;d.style.setProperty('--i',i);
    const pos=positions[st.path]||freePos();positions[st.path]=pos;
    d.style.left=pos.x+'px';d.style.top=pos.y+'px';
    d.innerHTML=`<span class="plate" style="--p1:${meta.plate[0]};--p2:${meta.plate[1]}">${meta.icon}</span><span class="lbl">${esc(st.name)}</span>${meta.badge?`<span class="extbadge">${esc(meta.badge)}</span>`:''}`;
    bindIcon(d,st);return d;
  }
  function bindIcon(d,st){
    /* 预载拖出数据（mouseenter/mousedown 时机，规避 dragstart 异步锁） */
    const preload=async()=>{if(st.special||dragCache.has(st.path))return;try{
      const s=await fs.stat(st.path);if(s.isDir)return;
      const blob=await fs.readBlob(st.path);const url=URL.createObjectURL(blob);
      dragCache.set(st.path,{file:new File([blob],st.name,{type:mimeOf(st.name)}),url});
    }catch(e){}};
    d.addEventListener('mouseenter',preload);
    d.addEventListener('pointerdown',preload);
    d.addEventListener('dragstart',e=>{
      if(!sel.has(st.path)){sel.clear();sel.add(st.path);refreshSel();}
      const c=dragCache.get(st.path);
      const meta=JSON.stringify({app:'inkos',paths:[...sel]});
      try{e.dataTransfer.setData('application/x-inkos',meta);}catch(err){}
      e.dataTransfer.setData('text/plain',st.path);
      if(c){try{e.dataTransfer.items.add(c.file);}catch(err){}
        try{e.dataTransfer.setData('DownloadURL',`${mimeOf(st.name)}:${st.name}:${location.origin}${location.pathname}#${c.url}`);}catch(err){}
        e.dataTransfer.setData('text/uri-list',c.url);}
      e.dataTransfer.effectAllowed='copyMove';
      d.classList.add('dragging');document.body.classList.add('dragging-internal');
    });
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');document.body.classList.remove('dragging-internal');
      dragCache.forEach(c=>setTimeout(()=>{try{URL.revokeObjectURL(c.url);}catch(e){}},6000));dragCache.clear();
      savePos();refresh();});
    /* 单击选中 / 双击打开 */
    d.addEventListener('click',e=>{e.stopPropagation();
      /* 触摸设备：单击直接打开（长按已用于拖动） */
      if(isTouch()){if(Date.now()-(d._dragEnd||0)<450)return;openIcon(st);return;}
      if(e.ctrlKey||e.metaKey){sel.has(st.path)?sel.delete(st.path):sel.add(st.path);}
      else{sel.clear();sel.add(st.path);}
      refreshSel();});
    d.addEventListener('dblclick',e=>{e.stopPropagation();openIcon(st);});
    /* 右键 */
    d.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
      if(!sel.has(st.path)){sel.clear();sel.add(st.path);refreshSel();}
      iconMenu(e.clientX,e.clientY,st);});
    /* 触摸长按拖动 */
    let tTimer=null,tMoved=false,ghost=null;
    d.addEventListener('touchstart',e=>{tMoved=false;
      tTimer=setTimeout(()=>{if(tMoved)return;navigator.vibrate&&navigator.vibrate(20);
        ghost=d.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('sel');
        layer.appendChild(ghost);d.style.opacity='.3';
        const mv=ev=>{tMoved=true;const t=ev.touches[0];const p=snap(t.clientX-46,t.clientY-50);
          ghost.style.left=clamp(p.x,0,innerWidth-96)+'px';ghost.style.top=clamp(p.y,0,innerHeight-160)+'px';ev.preventDefault();};
        const up=ev=>{d.removeEventListener('touchmove',mv);d.removeEventListener('touchend',up);
          if(ghost){d._dragEnd=Date.now();const p=snap(parseInt(ghost.style.left),parseInt(ghost.style.top));positions[st.path]=p;ghost.remove();ghost=null;savePos();refresh();}
          d.style.opacity='';};
        d.addEventListener('touchmove',mv,{passive:false});d.addEventListener('touchend',up);
      },430);},{passive:true});
    d.addEventListener('touchmove',()=>{tMoved=true;clearTimeout(tTimer);},{passive:true});
    d.addEventListener('touchend',()=>clearTimeout(tTimer));
  }
  function openIcon(st){
    if(st.special){const sp=SPECIALS.find(s=>s.key===st.path);sp&&sp.open();return;}
    openPath(st.path);
  }
  /* 桌面图标右键菜单 */
  function iconMenu(x,y,st){
    const items=[];
    if(st.special){
      items.push({t:'打开',icon:IC.run,fn:()=>openIcon(st)});
      if(st.path==='@trash')items.push({t:'清空回收站',icon:IC.clear,danger:true,fn:async()=>{if(await Dlg.danger('清空回收站','回收站内所有文件将被永久删除。')){await fs.delete(fs.trashPath()).catch(()=>{});await fs.mkdir(fs.trashPath()).catch(()=>{});toast('回收站已清空','ok');refresh();}}});
      Ctx.show(x,y,items);return;
    }
    const ext=extOf(st.name);
    items.push({t:'打开',icon:IC.run,key:'Enter',fn:()=>openPath(st.path)});
    if(IMG_EXT.includes(ext))items.push({t:'漫画阅读',icon:IC.book,fn:()=>APPS.viewer.launch({path:st.path,mode:'manga'})});
    if(ext==='html'||ext==='htm')items.push({t:'浏览器打开',icon:IC.browser,fn:()=>openHtmlInBrowser(st.path)});
    if(TXT_EXT.includes(ext)||CODE_EXT.includes(ext)||SHEET_EXT.includes(ext))items.push({t:'代码编辑器打开',icon:IC.editor,fn:()=>APPS.editor.launch({path:st.path})});
    items.push('-');
    if(ZIP_EXT.includes(ext)||GZ_EXT.includes(ext)||TAR_EXT.includes(ext))items.push({t:'解压到此处',icon:IC.extract,fn:async()=>{try{toast('正在解压…');const r=await Archive.extract(st.path);toast(`已解压 ${r.count} 个文件`,'ok');refresh();}catch(e){toast(e.message,'err');}}});
    items.push({t:'重命名',icon:IC.rename,key:'F2',fn:()=>renameIcon(st)});
    items.push({t:'复制',icon:IC.copy,key:'Ctrl+C',fn:()=>{clip.mode='copy';clip.paths=[...sel];toast('已复制 '+clip.paths.length+' 项');}});
    items.push({t:'剪切',icon:IC.cut,key:'Ctrl+X',fn:()=>{clip.mode='cut';clip.paths=[...sel];toast('已剪切 '+clip.paths.length+' 项');}});
    if(!st.special)items.push({t:'导出下载',icon:IC.download,fn:()=>sel.forEach(p=>fs.exportFile(p))});
    items.push('-');
    items.push({t:'删除',icon:IC.del,key:'Del',danger:true,fn:()=>removePaths([...sel])});
    Ctx.show(x,y,items);
  }
  async function renameIcon(st){
    const r=await Dlg.prompt('重命名','输入新名称：',st.name);
    if(!r.ok||!r.val||r.val===st.name)return;
    const np=joinPath(dirName(st.path),r.val.trim());
    if(await fs.exists(np)){toast('同名文件已存在','err');return;}
    try{await fs.rename(st.path,np);refresh();}catch(e){toast(e.message,'err');}
  }
  async function removePaths(paths){
    const inTrash=paths.some(p=>p.startsWith(fs.trashPath()));
    const ok=inTrash?await Dlg.danger('永久删除',`将永久删除 ${paths.length} 个项目，无法恢复。`,'永久删除')
                    :await Dlg.danger('删除',`将 ${paths.length} 个项目移入回收站。`,'移入回收站');
    if(!ok)return;
    for(const p of paths){try{inTrash?await fs.delete(p):await fs.toTrash(p);}catch(e){toast(e.message,'err');}}
    sel.clear();refresh();toast('已删除','ok');
  }
  function refreshSel(){$$('.dicon',layer).forEach(d=>d.classList.toggle('sel',sel.has(d.dataset.path)));}
  async function savePos(){await store.set('icons.pos',positions);}
  async function refresh(){
    positions=await store.get('icons.pos',{});snapGrid=await store.get('desk.snap',true);
    layer.innerHTML='';sel.clear();
    let i=0;
    for(const sp of SPECIALS){if(!positions[sp.key])positions[sp.key]=freePos();layer.appendChild(iconEl({path:sp.key,name:sp.name,special:true,icon:sp.icon,plate:sp.plate},i++));}
    try{const list=await fs.readdir('/Desktop');list.sort((a,b)=>a.isDir!==b.isDir?(a.isDir?-1:1):naturalCmp(a.name,b.name));

  }
  /* 桌面空白区交互：框选 + 右键 + 外部拖入 */
  const desk=$('#desktop');
  $('#icon-layer').addEventListener('click',e=>{if(e.target.id==='icon-layer'){sel.clear();refreshSel();}});
  desk.addEventListener('contextmenu',e=>{
    if(e.target.closest('.window')||e.target.closest('#taskbar')||e.target.closest('.dicon'))return;
    e.preventDefault();
    Ctx.show(e.clientX,e.clientY,[
      {t:'刷新桌面',icon:IC.refresh,fn:refresh},'-',
      {t:'新建文件夹',icon:IC.folder,fn:async()=>{const r=await Dlg.prompt('新建文件夹','文件夹名称：','新建文件夹');if(r.ok&&r.val){const p=joinPath('/Desktop',await fs.unique('/Desktop',r.val.trim()));await fs.mkdir(p);refresh();}}},
      {t:'新建文本文档',icon:IC.newfile,fn:async()=>{const p=joinPath('/Desktop',await fs.unique('/Desktop','新文档.txt'));await fs.writeFile(p,'');refresh();}},'-',
      {t:'上传文件',icon:IC.upload,fn:()=>uploadTo('/Desktop',refresh)},
      {t:'挂载本地文件夹',icon:IC.mount,fn:mountLocalFolder},'-',
      {t:'粘贴',icon:IC.paste,key:'Ctrl+V',dis:!clip.paths.length,fn:()=>pasteTo('/Desktop')},'-',
      {t:'更换壁纸',icon:IC.image,fn:()=>APPS.settings.launch({tab:'wallpaper'})},
      {t:'显示设置',icon:IC.settings,fn:()=>APPS.settings.launch()},
      {t:document.fullscreenElement?'退出全屏模式':'全屏模式',icon:IC.fullscreen,fn:toggleFullscreen},
    ]);
  });
  /* 框选 */
  const marq=$('#marquee');
  desk.addEventListener('pointerdown',e=>{
    if(e.target!==$('#icon-layer')&&e.target!==$('#wallpaper')&&e.target!==$('#vignette')&&e.target!==desk)return;
    if(e.button!==0&&e.pointerType==='mouse')return;
    if(isTouch())return; /* 触摸避免与滚动冲突，桌面触摸单击由 click 处理 */
    sel.clear();refreshSel();
    const sx=e.clientX,sy=e.clientY;marq.style.display='block';
    const mv=ev=>{const x=Math.min(sx,ev.clientX),y=Math.min(sy,ev.clientY),w=Math.abs(ev.clientX-sx),h=Math.abs(ev.clientY-sy);
      marq.style.left=x+'px';marq.style.top=y+'px';marq.style.width=w+'px';marq.style.height=h+'px';
      const r={x1:x,y1:y,x2:x+w,y2:y+h};
      $$('.dicon',layer).forEach(d=>{const dr=d.getBoundingClientRect();const hit=!(dr.right<r.x1||dr.left>r.x2||dr.bottom<r.y1||dr.top>r.y2);d.classList.toggle('sel',hit);});};
    const up=()=>{marq.style.display='none';marq.style.width=marq.style.height='0';
      sel.clear();$$('.dicon.sel',layer).forEach(d=>sel.add(d.dataset.path));
      desk.removeEventListener('pointermove',mv);desk.removeEventListener('pointerup',up);};
    desk.addEventListener('pointermove',mv);desk.addEventListener('pointerup',up);
  });
  /* 拖入桌面：内部移动 / 外部文件导入 */
  let dragDepth=0;
  desk.addEventListener('dragenter',e=>{if(hasFiles(e)){dragDepth++;$('#drop-hint').classList.add('on');}});
  desk.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;$('#drop-hint').classList.remove('on');}});
  desk.addEventListener('dragover',e=>{if(hasFiles(e)||hasInk(e))e.preventDefault();});
  desk.addEventListener('drop',async e=>{
    if(e.target.closest('.window'))return; /* 窗口自行处理 */
    e.preventDefault();dragDepth=0;$('#drop-hint').classList.remove('on');
    /* 内部图标移动 / 资源管理器拖入移动 */
    let ink=null;try{ink=JSON.parse(e.dataTransfer.getData('application/x-inkos'));}catch(err){}
    if(ink&&ink.app==='inkos'){
      const dragged=$('.dicon.dragging',layer);
      if(dragged){const p=snap(e.clientX-46,e.clientY-50);positions[dragged.dataset.path]=p;savePos();refresh();}
      else if(ink.paths&&ink.paths.length){
        for(const p of ink.paths){if(p.startsWith('/Desktop'))continue;
          const st=await fs.stat(p).catch(()=>null);if(!st)continue;
          await fs.rename(p,joinPath('/Desktop',await fs.unique('/Desktop',st.name)));}
        refresh();toast('已移动到桌面','ok');}
      return;
    }
    /* 外部文件/目录导入 */
    const items=[...(e.dataTransfer.items||[])];
    if(items.length){toast('正在导入…');
      for(const it of items){const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();
        if(en){try{await fs.importEntry(en,'/Desktop');}catch(err){toast('导入失败: '+err.message,'err');}}
        else if(it.kind==='file'){const f=it.getAsFile();if(f)await fs.importFiles([f],'/Desktop');}}
      refresh();toast('导入完成','ok');return;}
    const files=[...(e.dataTransfer.files||[])];
    if(files.length){await fs.importFiles(files,'/Desktop');refresh();toast('导入完成','ok');}
  });
  function hasFiles(e){return[...(e.dataTransfer?.types||[])].includes('Files');}
  function hasInk(e){return[...(e.dataTransfer?.types||[])].some(t=>t==='application/x-inkos'||t==='text/plain');}
  /* 上传输入由 uploadTo() 统一接管，避免重复监听导致双倍导入 */
  async function mountLocalFolder(){
    if(!window.showDirectoryPicker){toast('当前浏览器不支持文件夹挂载（需 Chrome/Edge）','err');return;}
    try{const h=await showDirectoryPicker({mode:'readwrite'});const p=await fs.mountLocal(h);toast('已挂载到 '+p,'ok');refresh();}
    catch(e){if(e.name!=='AbortError')toast('挂载失败: '+e.message,'err');}
  }
  async function pasteTo(dest){
    if(!clip.paths.length)return;
    for(const p of clip.paths){const st=await fs.stat(p).catch(()=>null);if(!st)continue;
      const nm=await fs.unique(dest,st.name);
      if(clip.mode==='cut')await fs.rename(p,joinPath(dest,nm));else await fs.copy(p,joinPath(dest,nm));}
    if(clip.mode==='cut')clip.paths=[];
    Bus.emit('fs:change',dest);refresh();toast('粘贴完成','ok');
  }
  function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('全屏被拒绝','warn'));}
  Bus.on('fs:change',p=>{if(p==='/Desktop'||p==='/')refresh();});
  Bus.on('desk:refresh',refresh);
  /* 键盘快捷键（桌面焦点时） */
  window.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea,[contenteditable],select')||e.target.closest('.CodeMirror'))return;
    if(WM.active())return; /* 窗口聚焦时交给窗口 */
    if(e.key==='Delete'&&sel.size)removePaths([...sel]);
    else if(e.key==='F2'&&sel.size===1){const p=[...sel][0];if(!p.startsWith('@'))renameIcon({path:p,name:baseName(p)});}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();$$('.dicon',layer).forEach(d=>sel.add(d.dataset.path));refreshSel();}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&sel.size){clip.mode='copy';clip.paths=[...sel].filter(p=>!p.startsWith('@'));}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'&&sel.size){clip.mode='cut';clip.paths=[...sel].filter(p=>!p.startsWith('@'));}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&clip.paths.length)pasteTo('/Desktop');
    else if(e.key==='Enter'&&sel.size===1)openIcon({path:[...sel][0],name:baseName([...sel][0]),special:[...sel][0].startsWith('@')});
  });
  return{refresh,pasteTo,mountLocalFolder,toggleFullscreen,getSel:()=>sel};
})();

const Shell=(()=>{

    Object.entries(APPS).filter(([k,a])=>!a.hide).forEach(([k,a])=>{

  $('#show-desktop').onclick=()=>{const w=WM.active();if(w)WM.minimize(w);else WM.list().forEach(x=>!x.minimized&&WM.minimize(x));};

})();

/* ---------- 智能打开分派：stat 判型 → 目录进资源管理器 / 文件按类型调应用 ---------- */
async function openPath(p){
  let st;try{st=await fs.stat(p);}catch(e){toast('无法打开：'+e.message,'err');return;}
  if(st.isDir){APPS.explorer.launch({path:p});return;}
  const e=extOf(st.name);
  if(IMG_EXT.includes(e))return APPS.viewer.launch({path:p});
  if(AUD_EXT.includes(e)||VID_EXT.includes(e))return APPS.player.launch({path:p});
  if(e==='pdf')return APPS.viewer.launch({path:p,mode:'pdf'});
  if(ZIP_EXT.includes(e)||GZ_EXT.includes(e)||TAR_EXT.includes(e))return APPS.explorer.launch({path:dirName(p),select:st.name,archive:st.name});
  if(SHEET_EXT.includes(e))return APPS.notepad.launch({path:p});
  if(e==='html'||e==='htm'){
    /* HTML：提供 预览效果 与 编辑源码 双入口 */
    htmlChoice(p);return;
  }
  if(CODE_EXT.includes(e))return APPS.editor.launch({path:p});
  if(TXT_EXT.includes(e))return APPS.notepad.launch({path:p});
  /* 未知类型：提供通用文本打开 */
  const r=await Dlg.confirm('未知格式','「'+st.name+'」没有关联的应用。是否以纯文本形式打开？','以文本打开','取消');
  if(r)APPS.notepad.launch({path:p});
}
async function htmlChoice(p){
  const items=[
    {t:'浏览器中打开（预览效果）',icon:IC.browser,fn:async()=>openHtmlInBrowser(p)},
    {t:'代码编辑器（修改源码）',icon:IC.editor,fn:()=>APPS.editor.launch({path:p})},
  ];
  Ctx.show(innerWidth/2-110,innerHeight/2-60,items);
}
async function openHtmlInBrowser(p){
  const url=await fs.blobURL(p);
  APPS.browser.launch({url,name:baseName(p)});
}

    const rowCache=new Map(); /* path -> {file,url} 拖出缓存（禁在 dragstart 内异步填充） */

    list.addEventListener('drop',async e=>{if(e.target.closest('.fx-row'))return;e.preventDefault();

    async function newItem(isDir){
      const def=isDir?'新建文件夹':'新建文档.txt';
      const r=await Dlg.prompt(isDir?'新建文件夹':'新建文件','名称：',def);

    async function pasteHere(){
      if(!clip.paths.length)return;
      for(const p of clip.paths){if(p===state.cwd||state.cwd.startsWith(p+'/'))continue;
        const st=await fs.stat(p).catch(()=>null);if(!st)continue;
        const nm=await fs.unique(state.cwd,st.name);
        clip.mode==='cut'?await fs.rename(p,joinPath(state.cwd,nm)):await fs.copy(p,joinPath(state.cwd,nm));}

      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'&&state.sel.size){clip.mode='cut';clip.paths=[...state.sel];syncSel();}
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v')pasteHere();

      else if(e.key==='F2'&&state.sel.size===1){const it=items.find(i=>i.path===[...state.sel][0]);it&&renameItem(it);}
      else if(e.key==='Enter'&&state.sel.size===1){const it=items.find(i=>i.path===[...state.sel][0]);it&&(it.isDir?nav(it.path):openPath(it.path));}

      if(r){try{toast('正在解压…');const rr=await Archive.extract(joinPath(state.cwd,opts.archive),state.cwd);toast(`已解压 ${rr.count} 个文件`,'ok');render();}catch(e){toast(e.message,'err');}}},350);
    return w;
  }
  return{launch};
})();
async function Desktop_removePaths(paths,cwd){

  if(!ok)return;
  for(const p of paths){try{inTrash?await fs.delete(p):await fs.toTrash(p);}catch(e){toast(e.message,'err');}}

    /* ---- CSV / TSV 双视图 ---- */
