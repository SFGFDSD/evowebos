<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-ac="amber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>双折 OS · BIREFRA</title>
<script>
/* 首屏主题：Cookie + localStorage 快速读取，避免闪烁 */
(function(){try{var d=document.documentElement,m=document.cookie.match(/bf_theme=(dark|light)/),a=document.cookie.match(/bf_ac=(\w+)/),s=JSON.parse(localStorage.getItem('bf.settings')||'{}');d.dataset.theme=(m&&m[1])||s.theme||'dark';d.dataset.ac=(a&&a[1])||s.accent||'amber';d.classList.toggle('mob',innerWidth<=820);if(matchMedia('(pointer:coarse)').matches)d.classList.add('touch')}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- JSZip 解压缩库 -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js" async onerror="console.warn('JSZip 加载失败，使用原生解压')"></script>
<!-- V86 虚拟机模拟器（JS/WASM 固定 0.5.319） -->
<script src="https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js" async onerror="console.warn('libv86 加载失败')"></script>
<!-- 7z-wasm 解压引擎 -->
<script type="module">
try{const m=await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');window.SevenZip=m.default;window.dispatchEvent(new Event('sevenzip-ready'))}catch(e){console.warn('7z-wasm 加载失败',e)}
</script>
<style>
:root{
  --f-ui:'Familjen Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-mono:'Martian Mono','JetBrains Mono',ui-monospace,Consolas,monospace;
  --tb-h:48px;--ease:cubic-bezier(.2,.8,.2,1);
  --ac2:#36e2c5;--ac3:#ff4f8b;--ac4:#5b7cff;
}
html[data-theme=dark]{--bg0:#05070a;--bg1:#0b1016;--bg2:#111921;--bg3:#18222c;--bg4:#243242;--fg:#e3ebf1;--fg2:#9aabb8;--fg3:#62737f;--line:rgba(150,185,210,.13);--line2:rgba(150,185,210,.27);--glass:rgba(10,15,21,.8);--shadow:0 22px 60px rgba(0,0,0,.6),0 2px 0 rgba(0,0,0,.45);--gl:rgba(200,230,255,.035);--page:#1b2631;--pageln:#3a4c5d}
html[data-theme=light]{--bg0:#d9ddd6;--bg1:#eceee8;--bg2:#f7f7f2;--bg3:#e9ebe3;--bg4:#d7dbd0;--fg:#0f171d;--fg2:#44555f;--fg3:#7b8992;--line:rgba(20,40,55,.14);--line2:rgba(20,40,55,.3);--glass:rgba(244,245,240,.84);--shadow:0 18px 44px rgba(30,45,55,.28),0 1px 0 rgba(255,255,255,.6);--gl:rgba(20,40,55,.05);--page:#fbfbf7;--pageln:#9aa7ae;--ac2:#00a58c;--ac3:#d9285f;--ac4:#3355e0}
html[data-ac=amber]{--ac:#ffb224;--ac-ink:#1a1100}
html[data-ac=teal]{--ac:#36e2c5;--ac-ink:#001a15}
html[data-ac=rose]{--ac:#ff4f8b;--ac-ink:#23000b}
html[data-ac=cobalt]{--ac:#6b8bff;--ac-ink:#020820}
html[data-theme=light][data-ac=amber]{--ac:#cf7f00;--ac-ink:#fff}
html[data-theme=light][data-ac=teal]{--ac:#008c78;--ac-ink:#fff}
html[data-theme=light][data-ac=rose]{--ac:#d9285f;--ac-ink:#fff}
html[data-theme=light][data-ac=cobalt]{--ac:#3355e0;--ac-ink:#fff}
html{--sel:color-mix(in srgb,var(--ac) 17%,transparent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--fg);font:400 13px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable="true"],.selectable{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
svg.ic{display:block;flex:none}
.hid{display:none!important}
html.noanim *,html.noanim *::before,html.noanim *::after{animation-duration:.001s!important;transition-duration:.001s!important}
html.noglass .pop,html.noglass #tb,html.noglass .cm,html.noglass .dlg{backdrop-filter:none!important;background:var(--bg2)!important}

/* ===== 桌面基底 ===== */
#os{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
#wallfx{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.45)),
  linear-gradient(var(--gl) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/64px 64px,
  linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px) 0 0/8px 8px}
html[data-theme=light] #wallfx{background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(40,60,70,.16)),linear-gradient(var(--gl) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/64px 64px}
#dicons{position:absolute;left:0;top:0;right:0;bottom:var(--tb-h);z-index:1;outline:none;overflow:hidden}
#dhint{position:absolute;z-index:3;border:1px dashed var(--ac);background:var(--sel);pointer-events:none;opacity:0;transition:opacity .12s,left .1s,top .1s}
#wm{position:absolute;left:0;top:0;right:0;bottom:var(--tb-h);z-index:2;pointer-events:none}
.dicon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;border:1px solid transparent;cursor:default;touch-action:none;
  transition:left .32s var(--ease),top .32s var(--ease),background .15s,border-color .15s,opacity .25s;animation:iconIn .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*26ms + .15s)}
.dicon .di{position:relative;width:var(--is);height:var(--is);flex:none;pointer-events:none}
.dicon .dn{font-size:12px;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;color:#fff;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.8);pointer-events:none;padding:0 2px}
html[data-theme=light] .dicon .dn{color:#0b1218;text-shadow:0 0 6px rgba(255,255,255,.9)}
.dicon:hover{background:color-mix(in srgb,var(--ac) 9%,transparent);border-color:var(--line2)}
.dicon.sel{background:var(--sel);border-color:var(--ac)}
.dicon.dragging,.cut{opacity:.42}
.dicon.drop-on,.drop-on{outline:2px dashed var(--ac);outline-offset:-2px;background:var(--sel)}
.dicon.armed{transform:scale(1.06)}
.dicon input{width:100%;font:inherit;font-size:12px;text-align:center;background:var(--bg0);color:var(--fg);border:1px solid var(--ac);outline:none;padding:1px 2px;pointer-events:auto}
@keyframes iconIn{from{opacity:0;transform:translateY(12px) scale(.92)}}
.thumb,.fimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.thumb.ok{opacity:1}
.marquee{position:absolute;pointer-events:none;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent);z-index:30}
.ghost{position:fixed;z-index:9999;pointer-events:none;padding:6px 10px;background:var(--bg2);border:1px solid var(--ac);color:var(--fg);font-size:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;transform:translate(-50%,-120%)}
.ghost b{background:var(--ac);color:var(--ac-ink);padding:0 6px;font-family:var(--f-mono);font-size:11px}

/* ===== 应用图标 / 文件图标 ===== */
.aic{--s:32px;width:var(--s);height:var(--s);display:inline-grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));clip-path:polygon(0 0,72% 0,100% 28%,100% 100%,0 100%);position:relative}
.aic::after{content:'';position:absolute;right:0;top:0;width:28%;height:28%;background:rgba(255,255,255,.28);clip-path:polygon(0 0,100% 100%,0 100%)}
.aic svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.fic{width:100%;height:100%;display:block}

/* ===== 按钮 / 输入 ===== */
.btn{height:28px;padding:0 12px;border:1px solid var(--line2);background:var(--bg3);color:var(--fg);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--bg4);border-color:var(--ac)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:var(--ac);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger:hover{border-color:var(--ac3);color:var(--ac3)}
.ibtn{min-width:28px;height:28px;padding:0 5px;border:1px solid transparent;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--fg2);cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.ibtn:hover{background:var(--bg3);color:var(--fg);border-color:var(--line2)}
.ibtn.on{color:var(--ac);background:var(--sel);border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
.ibtn:disabled,.ibtn.dis{opacity:.32;pointer-events:none}
.sep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line2);flex:none}
.inp,select.inp{height:28px;padding:0 9px;background:var(--bg0);border:1px solid var(--line2);color:var(--fg);border-radius:2px;font:inherit;outline:none;min-width:0}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 24%,transparent)}
select.inp{padding-right:4px}
input[type=range]{accent-color:var(--ac);height:18px}
.sw{position:relative;width:38px;height:20px;flex:none;border:1px solid var(--line2);background:var(--bg0);border-radius:10px;cursor:pointer;transition:background .2s,border-color .2s}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--fg3);transition:transform .22s var(--ease),background .2s}
.sw.on{background:color-mix(in srgb,var(--ac) 30%,var(--bg0));border-color:var(--ac)}
.sw.on::after{transform:translateX(18px);background:var(--ac)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--fg2)}

/* ===== 窗口 ===== */
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:3px;box-shadow:var(--shadow);pointer-events:auto;min-width:0;animation:winIn .3s var(--ease) backwards;transition:opacity .2s,transform .24s var(--ease),filter .2s}
.win.anim{transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease),opacity .2s,transform .24s var(--ease)}
.win.min{opacity:0;transform:translateY(46px) scale(.92);pointer-events:none}
.win.closing{opacity:0;transform:scale(.95);pointer-events:none}
.win.max{border-radius:0}
.win::before{content:'';position:absolute;inset:-6px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:0;
  background:linear-gradient(var(--ac),var(--ac)) 0 0/10px 1px,linear-gradient(var(--ac),var(--ac)) 0 0/1px 10px,linear-gradient(var(--ac),var(--ac)) 100% 0/10px 1px,linear-gradient(var(--ac),var(--ac)) 100% 0/1px 10px,linear-gradient(var(--ac),var(--ac)) 0 100%/10px 1px,linear-gradient(var(--ac),var(--ac)) 0 100%/1px 10px,linear-gradient(var(--ac),var(--ac)) 100% 100%/10px 1px,linear-gradient(var(--ac),var(--ac)) 100% 100%/1px 10px;background-repeat:no-repeat}
.win.focus::before{opacity:.85}
.win.max::before{display:none}
@keyframes winIn{from{opacity:0;transform:translateY(16px) scale(.975)}}
.win-h{height:34px;display:flex;align-items:center;gap:8px;padding-left:10px;background:linear-gradient(90deg,var(--bg3),var(--bg2));border-bottom:1px solid var(--line);flex:none;touch-action:none;position:relative;z-index:1;border-radius:3px 3px 0 0;cursor:default}
.win-h::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--ac),var(--ac2) 30%,var(--ac4) 60%,var(--ac3) 85%,transparent);opacity:0;transition:opacity .25s}
.win.focus .win-h::after{opacity:1}
.win-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;letter-spacing:.02em;color:var(--fg2)}
.win.focus .win-t{color:var(--fg)}
.win-i{display:flex}
.win-ctl{display:flex;height:100%}
.win-ctl button{width:44px;height:100%;display:grid;place-items:center;color:var(--fg2);transition:background .15s,color .15s}
.win-ctl button:hover{background:var(--bg4);color:var(--fg)}
.win-ctl button.x:hover{background:var(--ac3);color:#fff}
.win-b{flex:1;min-height:0;position:relative;overflow:hidden;z-index:1}
.rz{position:absolute;z-index:6;touch-action:none}
.rz.n{top:-4px;left:10px;right:10px;height:9px;cursor:ns-resize}.rz.s{bottom:-4px;left:10px;right:10px;height:9px;cursor:ns-resize}
.rz.e{right:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize}.rz.w{left:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize}
.rz.ne{top:-5px;right:-5px;width:16px;height:16px;cursor:nesw-resize}.rz.nw{top:-5px;left:-5px;width:16px;height:16px;cursor:nwse-resize}
.rz.se{bottom:-5px;right:-5px;width:16px;height:16px;cursor:nwse-resize}.rz.sw{bottom:-5px;left:-5px;width:16px;height:16px;cursor:nesw-resize}
.win.pfs{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:99999!important;border:0;border-radius:0;transform:none!important}
.win.pfs::before,.win.pfs .rz{display:none}
body.peeking .win:not(.peek-target){opacity:.05!important;pointer-events:none!important}
body.peeking .win.peek-target{z-index:9999!important;opacity:1!important;transform:none!important;pointer-events:none}
body.peeking .win.peek-target.min{opacity:1!important}
body.peekdesk .win{opacity:.06!important;pointer-events:none!important;box-shadow:none}
#snapbox{position:absolute;z-index:1;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);pointer-events:none;opacity:0;transition:all .18s var(--ease);left:0;top:0;width:0;height:0}
#snapbox.on{opacity:1}

/* ===== 任务栏 ===== */
#tb{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:stretch;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line2);z-index:50;animation:tbIn .6s var(--ease) both .05s}
@keyframes tbIn{from{transform:translateY(100%)}}
#tb::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac) 18%,var(--ac2) 42%,var(--ac4) 68%,var(--ac3) 90%,transparent);opacity:.75;pointer-events:none}
.tb-start{display:flex;align-items:center;gap:9px;padding:0 18px 0 14px;color:var(--fg);font-weight:600;letter-spacing:.14em;font-size:12px;transition:background .15s;position:relative}
.tb-start:hover,.tb-start.on{background:var(--bg3)}
.tb-start .lg{color:var(--ac)}
.tb-start.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ac)}
#tasks{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:5px 6px}
#tasks::-webkit-scrollbar{display:none}
.task{position:relative;height:100%;min-width:46px;max-width:190px;flex:0 1 170px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid transparent;color:var(--fg);animation:taskIn .35s var(--ease) backwards;transition:background .15s,opacity .2s}
@keyframes taskIn{from{opacity:0;transform:translateY(10px) scale(.9)}}
.task .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.task::after{content:'';position:absolute;left:10%;right:10%;bottom:-5px;height:2px;background:var(--fg3);transform:scaleX(.25);transition:transform .3s var(--ease),background .2s}
.task.on::after{background:linear-gradient(90deg,var(--ac),var(--ac2));transform:scaleX(1)}
.task:hover{background:var(--bg3);border-color:var(--line)}
.task.on{background:var(--bg3)}
.task.min{opacity:.62}
.tray{display:flex;align-items:center;padding:0 2px}
.clk{font-family:var(--f-mono);font-size:10.5px;text-align:right;line-height:1.3;padding:0 12px;height:100%;display:flex;flex-direction:column;justify-content:center;color:var(--fg2);transition:background .15s}
.clk:hover{background:var(--bg3)}
.clk b{font-weight:500;font-size:12.5px;color:var(--fg)}
.showdesk{width:12px;height:100%;border-left:1px solid var(--line2);transition:background .15s}
.showdesk:hover{background:var(--sel)}

/* ===== 弹出层 ===== */
.pop{position:absolute;z-index:60;background:var(--glass);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow);opacity:0;transform:translateY(14px) scale(.985);pointer-events:none;transition:opacity .2s,transform .28s var(--ease);transform-origin:bottom left}
.pop.on{opacity:1;transform:none;pointer-events:auto}
#start{left:8px;bottom:calc(var(--tb-h) + 8px);width:min(640px,calc(100vw - 16px));height:min(560px,calc(100vh - var(--tb-h) - 24px));display:flex;flex-direction:column}
.st-search{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.st-search .inp{flex:1;height:36px;font-size:14px}
.st-body{flex:1;overflow:auto;padding:14px 16px}
.st-h{font:500 10.5px var(--f-mono);letter-spacing:.18em;color:var(--fg3);margin:4px 0 10px;text-transform:uppercase}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border:1px solid transparent;text-align:center;font-size:12px;animation:iconIn .4s var(--ease) both;animation-delay:calc(var(--i)*22ms);transition:background .15s,border-color .15s}
.st-app:hover{background:var(--bg3);border-color:var(--line2)}
.st-res{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;text-align:left;border:1px solid transparent}
.st-res:hover{background:var(--bg3);border-color:var(--line2)}
.st-res small{color:var(--fg3);display:block;font-size:11px}
.st-res .rt{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-foot{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg0) 50%,transparent)}
.st-foot .nm{flex:1;font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--fg2)}
#clockpop{right:8px;bottom:calc(var(--tb-h) + 8px);width:322px;padding:16px;transform-origin:bottom right}
.cl-big{font:300 38px/1 var(--f-mono);letter-spacing:-.02em}
.cl-big small{font-size:14px;margin-left:8px;color:var(--ac)}
.cl-date{color:var(--fg2);margin:6px 0 14px}
.cl-nav{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.cl-nav b{flex:1;font-weight:600}
.cl-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cl-grid span{height:34px;display:grid;place-items:center;font-size:12px;border:1px solid transparent;cursor:default}
.cl-grid .wd{font:500 10px var(--f-mono);color:var(--fg3);height:24px}
.cl-grid .d:hover{background:var(--bg3);border-color:var(--line2)}
.cl-grid .o{color:var(--fg3)}
.cl-grid .t{background:var(--ac);color:var(--ac-ink);font-weight:700;clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}
#peek{z-index:55;padding:8px;width:236px;transform-origin:bottom center}
.pk-h{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.pk-h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-v{height:130px;overflow:hidden;position:relative;border:1px solid var(--line2);background:var(--bg1)}
.pk-v>div{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

/* ===== 右键菜单 / 对话框 / 通知 ===== */
.cm{position:fixed;z-index:70;min-width:200px;padding:4px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow);animation:cmIn .16s var(--ease) both;max-height:calc(100vh - 12px);overflow:visible}
@keyframes cmIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.cm-i{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;min-height:30px;cursor:default;white-space:nowrap}
.cm-i:hover,.cm-i.open{background:var(--sel)}
.cm-i.dis{opacity:.35;pointer-events:none}
.cm-i.danger:hover{background:color-mix(in srgb,var(--ac3) 22%,transparent)}
.cm-i .k{margin-left:auto;padding-left:22px;color:var(--fg3);font:10.5px var(--f-mono)}
.cm-i .ar{margin-left:auto;padding-left:14px;color:var(--fg3)}
.cm-i .ci{width:16px;display:flex;color:var(--fg2)}
.cm-sep{height:1px;background:var(--line2);margin:4px 6px}
.cm-sub{position:absolute;left:calc(100% - 2px);top:-5px;display:none;flex-direction:column;min-width:190px;padding:4px;background:var(--bg2);border:1px solid var(--line2);box-shadow:var(--shadow);max-height:70vh;overflow:auto}
.cm-sub.flip{left:auto;right:calc(100% - 2px)}
.cm-i.open>.cm-sub{display:flex}
@media (hover:hover){.cm-i:hover>.cm-sub{display:flex}}
.mask{position:fixed;inset:0;z-index:80;background:rgba(2,5,8,.55);display:grid;place-items:center;animation:fadeIn .2s both;padding:12px}
@keyframes fadeIn{from{opacity:0}}
.dlg{width:min(440px,100%);background:var(--bg2);border:1px solid var(--line2);box-shadow:var(--shadow);animation:winIn .28s var(--ease) both;max-height:92vh;display:flex;flex-direction:column;position:relative}
.dlg::before{content:'';position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac4),var(--ac3))}
.dlg-h{padding:16px 18px 6px;font-weight:600;font-size:15px}
.dlg-b{padding:6px 18px 14px;color:var(--fg2);overflow:auto;word-break:break-word}
.dlg-b .inp{width:100%;margin-top:8px;height:34px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
.dlg-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.dlg-list button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);text-align:left}
.dlg-list button:hover{border-color:var(--ac);background:var(--sel)}
#toasts{position:fixed;right:14px;bottom:calc(var(--tb-h) + 14px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:min(380px,calc(100vw - 28px));padding:10px 14px;background:var(--bg2);border:1px solid var(--line2);border-left:3px solid var(--ac2);box-shadow:var(--shadow);animation:toastIn .35s var(--ease) both;display:flex;gap:12px;align-items:center}
.toast.err{border-left-color:var(--ac3)}.toast.warn{border-left-color:var(--ac)}
.toast.out{opacity:0;transform:translateX(30px);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}
.toast .btn{height:24px;padding:0 8px}

/* ===== 移动端 / 平板：任务栏变底部 Dock ===== */
html.mob{--tb-h:calc(76px + env(safe-area-inset-bottom))}
html.mob #tb{left:10px;right:10px;bottom:calc(9px + env(safe-area-inset-bottom));height:58px;border:1px solid var(--line2);border-radius:16px}
html.mob #tb::before{left:16px;right:16px;border-radius:2px}
html.mob .tb-start{padding:0 14px}html.mob .tb-start span{display:none}
html.mob .task{flex:0 0 52px;min-width:52px;justify-content:center;padding:0}html.mob .task .tt{display:none}
html.mob .task::after{bottom:3px}
html.mob .clk .dt,html.mob .showdesk{display:none}
html.mob .clk{padding:0 10px}
html.mob #start{left:8px;right:8px;width:auto;bottom:calc(var(--tb-h) + 4px)}
html.mob #clockpop{right:8px;left:8px;width:auto}
html.mob .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-left:0;border-right:0}
html.mob .win::before,html.mob .rz,html.mob .win-ctl .mx{display:none}
html.mob .win-h{height:38px}html.mob .win-ctl button{width:48px}
html.mob .dicon .dn{font-size:11.5px}
html.mob #peek{display:none}
html.touch .btn,html.touch .ibtn{min-height:34px}
html.touch .ibtn{min-width:34px}
@media (max-width:820px){.st-grid{grid-template-columns:repeat(3,1fr)}}

const fsErr=(code,p,msg)=>{const e=new Error(code+': '+(msg||code)+', '+p);e.code=code;e.path=p;return e};

/* 无论传入多少参数（stat 的 isLstat、readFile 的 flag…），都能识别 callback */
function compat(fn){return function(...args){let cb=null;const i=args.findIndex(a=>typeof a==='function');if(i>=0){cb=args[i];args=args.slice(0,i)}
  const p=Promise.resolve().then(()=>fn.apply(this,args));if(cb){p.then(r=>cb(null,r),e=>cb(e))}return p}}

/* ---------- 后端：统一接口 ---------- */
class BE{
  constructor(){['stat','readFile','writeFile','open','mkdir','rmdir','unlink','rename','readdir','exists','list','getFile','rm'].forEach(m=>{if(this[m])this[m]=compat(this[m].bind(this))})}

  async open(p,flags='r'){const be=this;if(/w/.test(flags))await be.writeFile(p,new Blob([]));return{path:p,read:()=>be.readFile(p),write:d=>be.writeFile(p,d),stat:()=>be.stat(p),close:async()=>{}}}
  async _copyTree(a,b){const s=await this.stat(a);if(s.type==='dir'){await this.mkdir(b);for(const n of await this.readdir(a))await this._copyTree(a+'/'+n,b+'/'+n)}else await this.writeFile(b,await this.getFile(a))}

    try{return await d.getFileHandle(n)}catch(e){if(e.name==='TypeMismatchError'||e.name==='NotFoundError'){try{return await d.getDirectoryHandle(n)}catch(e2){throw mapErr(e2,p)}}throw mapErr(e,p)}}

  async list(p){const d=await this._dir(p),en=[];for await(const x of d.entries())en.push(x);
    return Promise.all(en.map(async([n,h])=>{if(h.kind==='directory')return{name:n,type:'dir',size:0,mtime:0};try{const f=await h.getFile();return{name:n,type:'file',size:f.size,mtime:f.lastModified}}catch(e){return{name:n,type:'file',size:0,mtime:0}}}))}

    const w=await fh.createWritable();try{await w.write(data==null?'':data)}catch(e){try{await w.abort()}catch(_){}throw mapErr(e,p)}await w.close()}
  async mkdir(p,o){await this._dir(p,true)}

<script>
/* =====================================================================
   文本编码 / 通用读取
   ===================================================================== */
function isBinary(u){if(u.length>1&&((u[0]===0xFF&&u[1]===0xFE)||(u[0]===0xFE&&u[1]===0xFF)))return false;const n=Math.min(u.length,4096);for(let i=0;i<n;i++)if(u[i]===0)return true;return false}

  try{return{text:new TextDecoder('utf-8',{fatal:true}).decode(u),enc:'UTF-8'}}catch(e){try{return{text:new TextDecoder('gbk').decode(u),enc:'GBK'}}catch(e2){return{text:new TextDecoder('utf-8').decode(u),enc:'UTF-8'}}}}

async function askSavePath(def,title='另存为'){const v=await UI.prompt(title,'完整路径（例如 /文档/笔记.txt）',def,{selStem:true});if(!v)return null;let p=P.norm(v.startsWith('/')?v:P.join(P.dirname(def),v));

/* =====================================================================
   记事本：撤销/重做（含字号变更）、自动保存、草稿恢复
   ===================================================================== */
Apps.notepad=function(a={}){return WM.open({app:'notepad',title:'记事本',icon:appIc('notepad',18),w:780,h:540,minW:320,minH:240,build:win=>Notepad(win,a)})};
async function Notepad(win,a){

  const b=win.body,ta=$('.np-ta',b),sv=$('[data-sv]',b);

  const title=()=>{const n=N.path?P.basename(N.path):'无标题';win.setTitle((N.dirty?'● ':'')+n+' - 记事本');$('[data-name]',b).textContent=N.path||'未保存的文档'};

    if(N.dirty&&(N.path||ta.value.trim())){const r=await unsavedDlg(N.path?P.basename(N.path):'无标题');if(r==='c'||r===null)return false;if(r==='s'&&!await save())return false;if(r==='n'&&!N.path)localStorage.removeItem('bf.draft.np')}};

  if(N.path){try{const u=await fs.readFile(N.path);if(isBinary(u)&&!a.force&&!await UI.confirm('“'+P.basename(N.path)+'”看起来是二进制文件，以纯文本打开可能显示乱码。仍要打开吗？','以纯文本形式打开','仍然打开')){win.close(true);return}
      const d=decodeText(u);ta.value=d.text;N.enc=d.enc;$('[data-enc]',b).textContent=d.enc}catch(e){UI.toast('无法读取文件：'+e.message,'err');win.close(true);return}}

/* =====================================================================
   表格：CSV / TSV  表格视图 ⇄ 文本视图
   ===================================================================== */
function parseDSV(t,d){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"'&&f==='')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
const toDSV=(rows,d)=>rows.map(r=>r.map(c=>{c=String(c==null?'':c);return(c.includes(d)||c.includes('"')||c.includes('\n')||c.includes('\r'))?'"'+c.replace(/"/g,'""')+'"':c}).join(d)).join('\n')+'\n';

Apps.sheet=function(a={}){return WM.open({app:'sheet',title:'表格',icon:appIc('sheet',18),w:900,h:580,minW:340,minH:260,build:win=>Sheet(win,a)})};

<script>
/* =====================================================================
   漫画阅读器：原生滚动 · 高度累加表 · 只挂载视口±1屏 · 可见优先/后20/前10调度
   ===================================================================== */
Apps.manga=function(a={}){return WM.open({app:'manga',title:'漫画阅读器',icon:appIc('manga',18),w:920,h:700,minW:320,minH:260,build:win=>{Manga(win,a).catch(e=>{console.error(e);UI.toast('漫画阅读器出错：'+e.message,'err')})}})};
async function Manga(win,a){
  let dir,startName=null;
  if(a.path){dir=P.dirname(a.path);startName=P.basename(a.path)}else{const v=await UI.prompt('打开漫画文件夹','输入包含图片的文件夹路径','/图片/示例漫画');if(!v){win.close(true);return}dir=P.norm(v)}
  win.body.innerHTML='<div class="mg-root" tabindex="0"><div class="mg-bar"><button class="ibtn" data-a="prev" title="上一页 (←)">'+ic('up',16)+'</button><button class="ibtn" data-a="next" title="下一页 (→)">'+ic('chevD',16)+'</button><span class="mg-pgn" data-pg>0 / 0</span><span class="nm" data-nm></span><span class="muted mono" data-ld style="font-size:11px"></span><select class="inp" data-w title="图片宽度"><option value="900">宽度 ≤900</option><option value="700">宽度 ≤700</option><option value="1200">宽度 ≤1200</option><option value="fill">填满窗口</option></select><button class="ibtn" data-a="viewer" title="在图片查看器中打开（缩放）">'+ic('image',16)+'</button><button class="ibtn" data-a="fs" title="全屏沉浸阅读 (F)">'+ic('fullscreen',16)+'</button></div><div class="mg-prog"><i></i></div><div class="mg-scroll"><div class="mg-inner"></div></div><div class="mg-load">正在读取目录 …</div><button class="mg-exit" title="退出全屏">'+ic('close',18)+'</button></div>';
  const root=$('.mg-root',win.body),sc=$('.mg-scroll',root),inner=$('.mg-inner',root),pg=$('[data-pg]',root),nmEl=$('[data-nm]',root),ldEl=$('[data-ld]',root),loadEl=$('.mg-load',root),prog=$('.mg-prog i',root),wSel=$('[data-w]',root);
  let list;try{list=await fs.list(dir)}catch(e){UI.toast('读取目录失败：'+e.message,'err');win.close(true);return}
  const imgs=list.filter(x=>x.type==='file'&&KIND[P.ext(x.name)]==='image').sort((x,y)=>natCmp(x.name,y.name));
  if(!imgs.length){UI.toast('该目录下没有图片','warn');win.close(true);return}
  win.setTitle('漫画阅读器 - '+(P.basename(dir)||'/'));
  const items=imgs.map(x=>({name:x.name,path:x.path,nw:0,nh:0,state:'wait',url:null,img:null,token:0,err:false,dw:0,h:0}));
  const n=items.length,M={tops:new Array(n).fill(0),total:0,vw:sc.clientWidth||800,vh:sc.clientHeight||600,top:0,raf:0,mounted:new Map(),live:new Set(),nl:0,conc:4,maxW:900,fill:false,loaded:0,anim:0,inertia:0,medV:null,v0:0,v1:0,cur:-1,fs:false,pseudo:false};
  const w0=S.get('mangaWidth');if(w0==='fill'){M.fill=true;M.maxW=1e9}else M.maxW=+w0||900;wSel.value=String(w0==='fill'?'fill':(['700','900','1200'].includes(String(w0))?w0:'900'));
  /* 尺寸：占位用 800×1200 或已加载图的中位数；显示宽度钳制到视口宽 */
  const recomputeMedian=()=>{const ws=[],hs=[];for(const it of items)if(it.nw){ws.push(it.nw);hs.push(it.nh)}if(!ws.length){M.medV=null;return}ws.sort((p,q)=>p-q);hs.sort((p,q)=>p-q);M.medV={w:ws[ws.length>>1],h:hs[hs.length>>1]}};
  const dims=it=>{const cap=Math.min(M.vw,M.maxW);if(it.err)return{w:cap,h:120};const m=M.medV||{w:800,h:1200},nw=it.nw||m.w,nh=it.nh||m.h,w=M.fill?cap:Math.min(cap,nw);return{w,h:w*nh/nw,r:nw+' / '+nh}};
  function layout(){let y=0;for(let i=0;i<n;i++){const d=dims(items[i]);items[i].dw=d.w;items[i].h=d.h;items[i].r=d.r||(d.w+' / 120');M.tops[i]=y;y+=d.h}M.total=y;inner.style.height=y+'px'}
  const idxAt=y=>{let lo=0,hi=n-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(M.tops[mid]<=y)lo=mid;else hi=mid-1}return lo};
  const place=(i,node)=>{const it=items[i],s=node.style;s.top=M.tops[i]+'px';s.width=it.dw+'px';s.height=it.h+'px';s.left=((M.vw-it.dw)/2)+'px';s.aspectRatio=it.r};
  /* 布局变化时保持锚点不跳：记录锚点项与其内偏移，布局后恢复（scrollTop 用 instant 写入） */
  function relayout(){const a0=idxAt(M.top),off=M.top-M.tops[a0];layout();M.mounted.forEach((node,i)=>place(i,node));const nt=M.tops[a0]+off;if(Math.abs(nt-M.top)>.5){M.top=nt;sc.scrollTo({top:nt,behavior:'instant'})}sched()}
  function mountNode(i){const it=items[i],node=document.createElement('picture');node.className='mg-pic';node.dataset.n='第 '+(i+1)+' 页';node.dataset.s='';place(i,node);
    if(it.state==='error'){node.classList.add('err');node.dataset.s='加载失败 · 点击重试'}else if(it.state==='loading'&&!it.img)node.dataset.s='加载中…';if(it.img)node.appendChild(it.img);inner.appendChild(node);M.mounted.set(i,node)}
  function drop(i){const it=items[i];it.token++;if(it.state==='loading')M.nl--;if(it.img){it.img.onload=it.img.onerror=null;it.img=null}if(it.url){URL.revokeObjectURL(it.url);it.url=null}it.state='wait';M.live.delete(i);const nd=M.mounted.get(i);if(nd){nd.textContent='';nd.dataset.s=''}}
  function update(){M.raf=0;const y=M.top,vh=M.vh,v0=idxAt(y),v1=idxAt(y+vh),lo=idxAt(y-vh),hi=idxAt(y+vh*2);M.v0=v0;M.v1=v1;
    for(const[i,nd]of M.mounted)if(i<lo||i>hi){nd.remove();M.mounted.delete(i)}
    for(let i=lo;i<=hi;i++)if(!M.mounted.has(i))mountNode(i);
    for(const i of[...M.live]){const it=items[i];if(i<v0-12||i>v1+22){if(it.state==='loading')drop(i);else if(i<v0-40||i>v1+40)drop(i)}}
    pump();const cur=idxAt(y+vh*.3);if(cur!==M.cur){M.cur=cur;pg.textContent=(cur+1)+' / '+n;nmEl.textContent=items[cur].name}}
  const sched=()=>{if(!M.raf)M.raf=requestAnimationFrame(update)};
  /* 调度：可见优先 → 后面20页 → 前面10页；并发 2~5 */
  function pump(){if(M.nl>=M.conc)return;const c=[];for(let i=M.v0;i<=M.v1;i++)c.push(i);for(let i=M.v1+1;i<=Math.min(n-1,M.v1+20);i++)c.push(i);for(let i=M.v0-1;i>=Math.max(0,M.v0-10);i--)c.push(i);
    for(const i of c){if(M.nl>=M.conc)break;if(items[i].state==='wait')startLoad(i)}}
  function startLoad(i){const it=items[i],my=++it.token;it.state='loading';M.nl++;M.live.add(i);const nd=M.mounted.get(i);if(nd){nd.classList.remove('err');nd.dataset.s='加载中…'}
    fs.getFile(it.path).then(f=>{if(it.token!==my)return;it.url=URL.createObjectURL(new Blob([f],{type:mimeOf(it.path)}));attach(i,my)}).catch(()=>{if(it.token===my)fail(i)})}
  function attach(i,my){const it=items[i],img=new Image();img.decoding='async';img.draggable=false;img.alt='';it.img=img;img.onload=()=>{if(it.token!==my)return;if(!it.nw)gotDims(i,img);finish(i)};img.onerror=()=>{if(it.token===my)fail(i)};img.src=it.url;const nd=M.mounted.get(i);if(nd){nd.dataset.s='';nd.appendChild(img)}}
  function gotDims(i,img){const it=items[i];it.nw=img.naturalWidth;it.nh=img.naturalHeight;recomputeMedian();relayout()}
  function finish(i){const it=items[i];if(it.state!=='loading')return;it.state='ready';M.nl--;M.loaded++;ldEl.textContent='已加载 '+M.loaded+' / '+n;prog.style.width=(M.loaded/n*100)+'%';pump()}
  function fail(i){const it=items[i];if(it.state==='loading')M.nl--;it.token++;if(it.img){it.img.onload=it.img.onerror=null;it.img=null}if(it.url){URL.revokeObjectURL(it.url);it.url=null}it.state='error';it.err=true;M.live.delete(i);
    const nd=M.mounted.get(i);if(nd){nd.textContent='';nd.classList.add('err');nd.dataset.s='加载失败 · 点击重试'}relayout();pump()}
  /* 每 200ms 轮询 naturalWidth：一出真实尺寸立刻更新布局并补偿 scrollTop */
  const poll=setInterval(()=>{for(const i of M.live){const it=items[i];if(it.state==='loading'&&it.img&&!it.nw&&it.img.naturalWidth>0)gotDims(i,it.img)}},200);
  /* 滚动：原生 overflow；监听 passive，回调内只写数字 */
  sc.addEventListener('scroll',()=>{M.top=sc.scrollTop;sched()},{passive:true});
  const ro=new ResizeObserver(es=>{const r=es[0].contentRect;if(Math.abs(r.width-M.vw)>1||Math.abs(r.height-M.vh)>1){M.vw=r.width;M.vh=r.height;relayout()}});ro.observe(sc);
  /* 程序化滚动：instant + 自研 rAF 插值（100ms，可被打断） */
  const stopAnim=()=>{cancelAnimationFrame(M.anim);cancelAnimationFrame(M.inertia)};
  function smoothTo(t){t=clamp(t,0,Math.max(0,M.total-M.vh));stopAnim();const s=M.top,t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/100),e=1-Math.pow(1-k,3);sc.scrollTo({top:s+(t-s)*e,behavior:'instant'});if(k<1)M.anim=requestAnimationFrame(step)};M.anim=requestAnimationFrame(step)}
  ['wheel','touchstart'].forEach(ev=>sc.addEventListener(ev,stopAnim,{passive:true}));
  /* 仅鼠标：拖拽 + 0.96 摩擦惯性；触摸/触控笔完全放行 */
  sc.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;stopAnim();let ly=e.clientY,pos=M.top,v=0,lt=performance.now();const max=()=>Math.max(0,M.total-M.vh);
    const mv=ev=>{const dy=ev.clientY-ly,now=performance.now();ly=ev.clientY;v=dy/Math.max(1,now-lt)*16;lt=now;pos=clamp(pos-dy,0,max());sc.scrollTop=pos};
    const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);const step=()=>{v*=0.96;if(Math.abs(v)<0.15)return;pos=clamp(pos-v,0,max());sc.scrollTop=pos;M.inertia=requestAnimationFrame(step)};M.inertia=requestAnimationFrame(step)};
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)});
  sc.addEventListener('click',e=>{const p=e.target.closest('.mg-pic.err');if(!p)return;const i=[...M.mounted].find(([k,v])=>v===p);if(i){const it=items[i[0]];it.state='wait';it.err=false;relayout()}});
  sc.addEventListener('dblclick',()=>{M.fs?exitFS():enterFS()});
  /* 全屏：原生 Fullscreen API 与伪全屏两条路径；标题栏隐藏，仅留右上角 × */
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  function pseudo(){M.pseudo=true;win.el.classList.add('pfs');document.body.classList.add('pfs-on')}
  function enterFS(){M.fs=true;win.el.classList.add('mg-fs');root.classList.add('fs');const req=root.requestFullscreen||root.webkitRequestFullscreen;
    if(req){try{const p=req.call(root);if(p&&p.catch)p.catch(pseudo)}catch(e){pseudo()}}else pseudo();root.focus()}
  function cleanFS(){M.fs=false;M.pseudo=false;win.el.classList.remove('mg-fs','pfs');document.body.classList.remove('pfs-on');root.classList.remove('fs')}
  function exitFS(){if(fsEl()===root){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}cleanFS()}
  const onFs=()=>{if(M.fs&&!M.pseudo&&fsEl()!==root)cleanFS()};document.addEventListener('fullscreenchange',onFs);document.addEventListener('webkitfullscreenchange',onFs);
  $('.mg-exit',root).onclick=e=>{e.stopPropagation();exitFS()};
  const page=d=>{const c=idxAt(M.top+1);smoothTo(M.tops[clamp((M.top-M.tops[c]>8&&d<0?c:c+d),0,n-1)])};
  root.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowDown'){e.preventDefault();smoothTo(M.top+M.vh*.3)}else if(k==='ArrowUp'){e.preventDefault();smoothTo(M.top-M.vh*.3)}else if(k==='PageDown'||k===' '){e.preventDefault();smoothTo(M.top+M.vh*.9)}else if(k==='PageUp'){e.preventDefault();smoothTo(M.top-M.vh*.9)}
    else if(k==='Home'){e.preventDefault();smoothTo(0)}else if(k==='End'){e.preventDefault();smoothTo(M.total)}else if(k==='ArrowRight')page(1);else if(k==='ArrowLeft')page(-1);else if(k==='f'||k==='F')M.fs?exitFS():enterFS();else if(k==='Escape'&&M.fs)exitFS()});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&M.fs&&M.pseudo)exitFS()});
  root.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(!x)return;const k=x.dataset.a;if(k==='prev')page(-1);else if(k==='next')page(1);else if(k==='fs')M.fs?exitFS():enterFS();else if(k==='viewer')Apps.viewer({path:items[Math.max(0,M.cur)].path})});
  wSel.onchange=()=>{const v=wSel.value;S.set('mangaWidth',v);if(v==='fill'){M.fill=true;M.maxW=1e9}else{M.fill=false;M.maxW=+v}relayout()};
  win.dispose.push(()=>{clearInterval(poll);ro.disconnect();stopAnim();cancelAnimationFrame(M.raf);document.removeEventListener('fullscreenchange',onFs);document.removeEventListener('webkitfullscreenchange',onFs);if(fsEl()===root)try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}cleanFS();items.forEach(it=>{if(it.url)URL.revokeObjectURL(it.url)})});
  /* 启动：布局 → 定位到用户点击的那张图 → 首次渲染 */
  layout();let start=0;if(startName){const i=items.findIndex(x=>x.name===startName);if(i>=0)start=i}
  M.top=M.tops[start];sc.scrollTo({top:M.top,behavior:'instant'});ldEl.textContent='共 '+n+' 页';loadEl.remove();update();root.focus();
  setTimeout(()=>{if(start>0&&Math.abs(sc.scrollTop-M.top)>2){sc.scrollTo({top:M.tops[start],behavior:'instant'});M.top=M.tops[start]}},60);
}

/* =====================================================================
   图片查看器：滚轮/双指缩放、拖拽平移、旋转、同目录切换
   ===================================================================== */
Apps.viewer=function(a={}){return WM.open({app:'viewer',title:'图片查看器',icon:appIc('viewer',18),w:920,h:660,minW:320,minH:260,build:win=>{Viewer(win,a).catch(e=>UI.toast('图片查看器出错：'+e.message,'err'))}})};
async function Viewer(win,a){
  if(!a.path){const v=await UI.prompt('打开图片','图片路径','/图片/断面.svg');if(!v){win.close(true);return}a.path=P.norm(v)}
  const dir=P.dirname(a.path);let list=[];try{list=(await fs.list(dir)).filter(x=>x.type==='file'&&KIND[P.ext(x.name)]==='image').sort((x,y)=>natCmp(x.name,y.name))}catch(e){}
  const V={i:Math.max(0,list.findIndex(x=>x.path===a.path)),cx:0,cy:0,s:1,r:0,nw:0,nh:0,url:null};if(!list.length)list=[{path:a.path,name:P.basename(a.path)}];
  win.body.innerHTML='<div class="vw" tabindex="0"><div class="bar"><button class="ibtn" data-a="prev" title="上一张 (←)">'+ic('chevL',16)+'</button><button class="ibtn" data-a="next" title="下一张 (→)">'+ic('chevR',16)+'</button><span class="sep"></span><button class="ibtn" data-a="out" title="缩小 (-)">'+ic('zoomOut',16)+'</button><span class="mono" data-z style="min-width:50px;text-align:center;font-size:11px">100%</span><button class="ibtn" data-a="in" title="放大 (+)">'+ic('zoomIn',16)+'</button><button class="ibtn" data-a="one" title="100%">1:1</button><button class="ibtn" data-a="fit" title="适应窗口 (0)">'+ic('resize',15)+'</button><button class="ibtn" data-a="rot" title="旋转 (R)">'+ic('rotate',15)+'</button><span class="sep"></span><button class="ibtn" data-a="manga" title="漫画阅读器">'+ic('book',15)+'</button><button class="ibtn" data-a="paint" title="用画板编辑">'+ic('brush',15)+'</button><button class="ibtn" data-a="dl" title="下载">'+ic('download',15)+'</button><span class="sp"></span><span class="muted mono" data-info style="font-size:11px"></span></div><div class="vw-stage"><img alt="" draggable="false"></div></div>';
  const root=$('.vw',win.body),stage=$('.vw-stage',root),img=$('img',stage);
  const apply=()=>{img.style.transform='translate('+V.cx+'px,'+V.cy+'px) scale('+V.s+') rotate('+V.r+'deg)';$('[data-z]',root).textContent=Math.round(V.s*100)+'%';img.classList.toggle('px',V.s>=3)};
  function fit(){const sw=stage.clientWidth,sh=stage.clientHeight,rot=V.r%180!==0,w=rot?V.nh:V.nw,h=rot?V.nw:V.nh;if(!w)return;V.s=Math.min(1,sw/w,sh/h);V.cx=sw/2;V.cy=sh/2;apply()}
  function zoom(f,px,py){const s2=clamp(V.s*f,.02,40);px=px==null?stage.clientWidth/2:px;py=py==null?stage.clientHeight/2:py;V.cx=px-(px-V.cx)*(s2/V.s);V.cy=py-(py-V.cy)*(s2/V.s);V.s=s2;apply()}
  async function show(i){V.i=(i+list.length)%list.length;const it=list[V.i];if(V.url)URL.revokeObjectURL(V.url);win.setTitle(it.name+' - 图片查看器');try{V.url=await fs.url(it.path)}catch(e){return UI.toast('无法读取图片：'+e.message,'err')}
    V.r=0;img.onload=()=>{V.nw=img.naturalWidth||800;V.nh=img.naturalHeight||600;img.style.width=V.nw+'px';img.style.height=V.nh+'px';img.style.left=(-V.nw/2)+'px';img.style.top=(-V.nh/2)+'px';fit();$('[data-info]',root).textContent=V.nw+' × '+V.nh+' · '+(V.i+1)+' / '+list.length};img.src=V.url}
  stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  const ptrs=new Map();let pd=0;
  stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
  stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
    if(ptrs.size===1){V.cx+=e.clientX-p[0];V.cy+=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);apply()}
    else if(ptrs.size===2){ptrs.set(e.pointerId,[e.clientX,e.clientY]);const[a1,b1]=[...ptrs.values()],d=Math.hypot(a1[0]-b1[0],a1[1]-b1[1]),r=stage.getBoundingClientRect();if(pd)zoom(d/pd,(a1[0]+b1[0])/2-r.left,(a1[1]+b1[1])/2-r.top);pd=d}});
  const up=e=>{ptrs.delete(e.pointerId);pd=0};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',()=>{V.s>=.999&&V.s<=1.001?fit():(V.s=1,V.cx=stage.clientWidth/2,V.cy=stage.clientHeight/2,apply())});
  root.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(!x)return;const k=x.dataset.a;if(k==='prev')show(V.i-1);else if(k==='next')show(V.i+1);else if(k==='in')zoom(1.25);else if(k==='out')zoom(.8);else if(k==='one'){V.s=1;V.cx=stage.clientWidth/2;V.cy=stage.clientHeight/2;apply()}else if(k==='fit')fit();

function calcEval(src,deg){let i=0;const s=src.replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt');

    const id=/^[a-z]+/i.exec(s.slice(i));if(id){i+=id[0].length;const k=id[0].toLowerCase();if(k==='pi')return Math.PI;if(k==='e')return Math.E;if(fn[k]&&s[i]==='('){i++;const v=expr();if(s[i]===')')i++;return fn[k](v)}}throw new Error('语法错误')}

const V86URL={js:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/libv86.js',wasm:'https://cdn.jsdelivr.net/npm/v86@0.5.319/build/v86.wasm',bios:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/seabios.bin',vga:'https://cdn.jsdelivr.net/gh/copy/v86@bbb2a5b4fd44e85d902792f9b93ec3e0d42e1b0f/bios/vgabios.bin'};
Apps.vm=function(a={}){return WM.open({app:'vm',title:'虚拟机 V86',icon:appIc('vm',18),w:860,h:640,minW:340,minH:300,build:win=>VM(win,a)})};
function VM(win,a){
  const V={emu:null,buf:null,name:'',type:'auto'};
  win.body.innerHTML='<div class="vm"><div class="bar"><button class="btn" data-a="pick">'+ic('folder',14)+'选择 VFS 镜像</button><button class="btn" data-a="import">'+ic('upload',14)+'导入本地镜像</button><select class="inp" data-type style="height:26px"><option value="auto">自动识别</option><option value="cdrom">CD-ROM (iso)</option><option value="fda">软盘 (img/fda/bin)</option><option value="hda">硬盘</option></select><select class="inp" data-mem style="height:26px"><option value="64">64 MB</option><option value="128" selected>128 MB</option><option value="256">256 MB</option><option value="512">512 MB</option></select><button class="btn pri" data-a="start">'+ic('play',13)+'启动</button><span class="sep"></span><button class="ibtn dis" data-a="pause" title="暂停/继续">'+ic('pause',15)+'</button><button class="ibtn dis" data-a="restart" title="重启">'+ic('refresh',15)+'</button><button class="ibtn dis" data-a="stop" title="停止并释放">'+ic('close',15)+'</button><button class="ibtn dis" data-a="cad" title="发送 Ctrl+Alt+Del">'+ic('key',15)+'</button><button class="ibtn dis" data-a="lock" title="鼠标锁定（Esc 释放）">'+ic('lock',15)+'锁定鼠标</button><button class="ibtn dis" data-a="fs" title="全屏">'+ic('fullscreen',15)+'</button><input type="file" data-file hidden></div><div class="vm-wrap"><div class="vm-screen" id="screen_container"><div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas></div><div class="vm-hint"></div></div></div>';
  const b=win.body,sc=$('.vm-screen',b),hint=$('.vm-hint',b);
  const setHint=t=>{hint.innerHTML=t;hint.style.display=t?'block':'none'};
  const en=x=>$$a('[data-a="'+x+'"]');const $$a=s=>$a(s,b);
  const enable=on=>['pause','restart','stop','cad','lock','fs'].forEach(k=>en(k).forEach(x=>x.classList.toggle('dis',!on)));
  const pickType=n=>{const t=$('[data-type]',b).value;if(t!=='auto')return t;const e=P.ext(n);return e==='iso'?'cdrom':['img','fda','bin','ima','dsk','vfd'].includes(e)?'fda':'hda'};
  async function setImage(name,buf){V.name=name;V.buf=buf;win.setTitle(name+' - 虚拟机 V86');setHint('已载入镜像：'+esc(name)+'（'+fmtSize(buf.byteLength)+'）<br>类型：'+pickType(name)+' · 点击“启动”开始')}
  async function ensureLib(){if(window.V86||window.V86Starter)return true;setHint('正在加载 libv86.js …');await new Promise(r=>{const s=document.createElement('script');s.src=V86URL.js;s.onload=r;s.onerror=r;document.head.appendChild(s)});return !!(window.V86||window.V86Starter)}
  async function start(){if(!V.buf)return UI.toast('请先选择或导入镜像（iso / img / fda / bin 等）','warn');if(!await ensureLib())return setHint('libv86.js 加载失败，请检查网络后重试');
    if(V.emu)stop();const Ctor=window.V86||window.V86Starter,type=pickType(V.name),o={wasm_path:V86URL.wasm,memory_size:(+$('[data-mem]',b).value)*1048576,vga_memory_size:8*1048576,screen_container:sc,bios:{url:V86URL.bios},vga_bios:{url:V86URL.vga},autostart:true};
    o[type]={buffer:V.buf};setHint('正在启动虚拟机 …');try{V.emu=new Ctor(o);V.emu.add_listener&&V.emu.add_listener('emulator-ready',()=>setHint(''));setTimeout(()=>{if(V.emu)setHint('')},2500);enable(true);UI.toast('虚拟机已启动（点击画面后可“锁定鼠标”）','info',2600)}catch(e){UI.toast('启动失败：'+e.message,'err');setHint('启动失败：'+esc(e.message))}}
  function stop(){if(V.emu){try{V.emu.destroy()}catch(e){}V.emu=null}enable(false);sc.querySelector('canvas').style.display='none';sc.firstChild.textContent=''}
  b.addEventListener('click',async e=>{const x=e.target.closest('[data-a]');if(!x||x.classList.contains('dis'))return;const k=x.dataset.a;
    if(k==='import')$('[data-file]',b).click();else if(k==='start')start();else if(k==='stop'){stop();setHint('已停止')}
    else if(k==='pick'){const v=await UI.prompt('选择 VFS 中的镜像','镜像路径（iso / img / fda / bin …）',a.path||'/下载/系统.iso');if(v){try{const p=P.norm(v);await setImage(P.basename(p),await(await fs.getFile(p)).arrayBuffer())}catch(er){UI.toast('读取失败：'+er.message,'err')}}}
    else if(V.emu){if(k==='pause'){if(V.emu.is_running()){V.emu.stop();x.innerHTML=ic('play',15)}else{V.emu.run();x.innerHTML=ic('pause',15)}}else if(k==='restart')V.emu.restart();
      else if(k==='cad')V.emu.keyboard_send_scancodes([0x1d,0x38,0x53,0xd3,0xb8,0x9d]);
      else if(k==='lock'){if(V.emu.lock_mouse)V.emu.lock_mouse();else(sc.querySelector('canvas').requestPointerLock||(()=>{})).call(sc.querySelector('canvas'));UI.toast('鼠标已锁定，按 Esc 释放','info',2200)}
      else if(k==='fs'){if(V.emu.screen_go_fullscreen)V.emu.screen_go_fullscreen();else if(sc.requestFullscreen)sc.requestFullscreen()}}});
  $('[data-file]',b).onchange=async e=>{const f=e.target.files[0];if(f){await setImage(f.name,await f.arrayBuffer());e.target.value=''}};
  $('[data-type]',b).onchange=()=>{if(V.name)setImage(V.name,V.buf)};
  win.dispose.push(()=>stop());
  setHint('选择一个磁盘镜像来启动虚拟机<br>支持 .iso（CD-ROM）· .img / .fda / .bin（软盘）· 其他（硬盘）<br>镜像只能来自虚拟文件系统或本地导入');
  if(a.path){fs.getFile(a.path).then(f=>f.arrayBuffer()).then(buf=>{setImage(P.basename(a.path),buf);start()}).catch(er=>UI.toast('读取镜像失败：'+er.message,'err'))}
}
</script>

    const box=$('[data-st]',body);if(!box)return;const pct=quota?used/quota*100:0,names={image:'图片',video:'视频',audio:'音频',doc:'文档',zip:'压缩/镜像',code:'网页/代码',other:'其他'},cols={image:'#ff4f8b',video:'#5b7cff',audio:'#ffb224',doc:'#93a4b2',zip:'#d9b44a',code:'#36e2c5',other:'#7d8b97'};
    const keys=Object.keys(cat).filter(k=>cat[k]>0).sort((x,y)=>cat[y]-cat[x]),fl=[...tm.entries()].sort((x,y)=>y[1]-x[1]),mx=fl.length?fl[0][1]:1;
    box.innerHTML='<div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap"><div class="se-ring" style="background:conic-gradient(var(--ac) '+Math.max(1,pct)+'%,var(--bg0) 0)"><span>'+pct.toFixed(pct<10?2:1)+'%</span></div><div style="line-height:2"><div>浏览器存储已用 <b>'+fmtSize(used)+'</b> / 配额 <b>'+fmtSize(quota)+'</b></div><div class="muted">VFS 文件 '+files+' 个 · 合计 '+fmtSize(total)+' · 后端 '+esc(BEN[fs.backend]||fs.backend)+'</div><div class="muted" data-persist></div></div></div>'
      +'<div class="se-sec">按类型占用</div><div class="se-bar">'+(keys.map(k=>'<i style="width:'+(cat[k]/Math.max(1,total)*100)+'%;background:'+cols[k]+'" title="'+names[k]+'"></i>').join('')||'')+'</div><div class="se-leg">'+(keys.map(k=>'<div><b style="background:'+cols[k]+'"></b>'+names[k]+'<span>'+fmtSize(cat[k])+' · '+(cat[k]/Math.max(1,total)*100).toFixed(1)+'%</span></div>').join('')||'<div class="muted">暂无文件</div>')+'</div>'
      +'<div class="se-sec">按位置占用</div>'+(fl.map(([n,v])=>'<div class="se-fb"><span>'+esc(n)+'</span><em><i style="width:'+(v/mx*100)+'%"></i></em><span class="mono">'+fmtSize(v)+'</span></div>').join('')||'<div class="muted">暂无数据</div>')
      +'<div class="se-sec">维护</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+btn('persist','请求持久化存储')+btn('backup','备份全部文件为 ZIP')+btn('thumbs','清除缩略图缓存')+btn('resetset','重置设置（保留文件）')+btn('resetall','重置系统（清除 OPFS）','danger')+'</div>';
    try{const p=await navigator.storage.persisted();$('[data-persist]',box).textContent='持久化存储：'+(p?'已授予（不会被浏览器自动清理）':'未授予（空间紧张时可能被清理）')}catch(e){}
  }
  async function mounts(){
    const box=$('[data-mt]',body);if(!box)return;const ms=fs.mounts(),all=await HandleStore.all(),rest=all.filter(h=>!ms.includes('/mnt/local/'+h.name));
    box.innerHTML=row('浏览器支持','showDirectoryPicker（Chrome / Edge 等）','<span class="mono muted">'+(window.showDirectoryPicker?'可用':'不可用')+'</span>')+'<div class="se-sec">已挂载</div>'
      +(ms.map(m=>row(esc(P.basename(m)),esc(m),'<button class="btn" data-open="'+esc(m)+'">打开</button><button class="btn danger" data-unm="'+esc(m)+'">卸载</button>')).join('')||'<div class="muted" style="padding:10px 0">尚未挂载任何本地文件夹</div>')
      +(rest.length?'<div class="se-sec">需要重新授权（刷新后权限会失效）</div>'+rest.map(h=>row(esc(h.name),'上次挂载的文件夹','<button class="btn pri" data-re="'+esc(h.name)+'">重新挂载</button>')).join(''):'')
      +'<div style="margin-top:16px">'+btn('mount',ic('mount',14)+'挂载本地文件夹…','pri')+'</div><div class="sub" style="margin-top:12px">挂载后可在 /mnt/local/文件夹名 下像普通目录一样浏览、编辑、拖拽与解压；卸载不会删除本地文件。</div>';
    box._re=rest}
  function render(){$a('[data-p]',win.body).forEach(b=>b.classList.toggle('on',b.dataset.p===page));body.innerHTML=pages[page]();fill(page)}
  win.setPage=p=>{page=p;render()};
  win.body.addEventListener('click',async e=>{const nav=e.target.closest('[data-p]');if(nav){page=nav.dataset.p;render();return}
    const s=e.target.closest('.sw[data-k]');if(s){const k=s.dataset.k;S.set(k,!S.get(k));s.classList.toggle('on',S.get(k));if(k==='showHidden'||k==='showExt'||k==='thumbs')Desk.refresh(true);return}
    const ac=e.target.closest('[data-ac]');if(ac){S.set('accent',ac.dataset.ac);render();return}const w=e.target.closest('[data-w]');if(w){S.set('wall',{type:'builtin',id:w.dataset.w});render();return}
    const wf=e.target.closest('[data-wf]');if(wf){S.set('wall',{type:'file',path:wf.dataset.wf});render();return}
    const op=e.target.closest('[data-open]');if(op)return Apps.explorer({path:op.dataset.open});const un=e.target.closest('[data-unm]');if(un){if(await UI.confirm('卸载“'+P.basename(un.dataset.unm)+'”？不会删除本地文件。','卸载','卸载')){await fs.unmount(un.dataset.unm);mounts()}return}
    const re=e.target.closest('[data-re]');if(re){const h=(await HandleStore.all()).find(x=>x.name===re.dataset.re);if(h){try{if(await fs.remount(h.name,h.handle))UI.toast('已重新挂载 '+h.name);else UI.toast('未获得授权','warn')}catch(er){UI.toast('授权失败：'+er.message,'err')}mounts()}return}
    const ab=e.target.closest('[data-act]');if(!ab)return;const k=ab.dataset.act;
    if(k==='wallup')$('[data-wallfile]',body).click();else if(k==='resetlayout'){S.set('deskLayout',{});S.set('autoArrange',true);Desk.refresh(true);S.set('autoArrange',false);UI.toast('图标已重新排列')}
    else if(k==='mount'){await mountLocalDialog();mounts()}else if(k==='persist'){try{const ok=await navigator.storage.persist();UI.toast(ok?'已授予持久化存储':'浏览器未授予持久化存储','info');storage()}catch(er){UI.toast('不支持：'+er.message,'warn')}}
    else if(k==='backup'){const t=UI.toast('正在打包全部文件…','info',0);try{const tops=(await fs.list('/')).filter(x=>x.name!=='mnt'&&x.name!=='.sys').map(x=>x.path);downloadBlob(await Archive.zipPaths(tops),'birefra-backup.zip')}catch(er){UI.toast('备份失败：'+er.message,'err')}t()}
    else if(k==='thumbs'){Thumbs.cache.forEach(u=>URL.revokeObjectURL(u));Thumbs.cache.clear();UI.toast('缩略图缓存已清除')}
    else if(k==='resetset'){if(await UI.confirm('将所有设置恢复为默认值（不会删除文件）。','重置设置','重置')){const keep={deskLayout:{}};Object.keys(S.def).forEach(x=>S.set(x,JSON.parse(JSON.stringify(S.def[x]))));S.set('deskLayout',keep.deskLayout);Desk.refresh(true);render()}}
    else if(k==='resetall')resetSystem()});
  win.body.addEventListener('change',async e=>{const t=e.target;if(t.matches('[data-wallfile]')){const f=t.files[0];if(!f)return;await fs.mkdir('/图片/壁纸');const name=await fs.uniqueName('/图片/壁纸',f.name),p=P.join('/图片/壁纸',name);try{await fs.writeFile(p,new Uint8Array(await f.arrayBuffer()));S.set('wall',{type:'file',path:p});UI.toast('已设为壁纸并保存到 '+p);render()}catch(er){UI.toast('保存失败：'+er.message,'err')}return}
    if(t.matches('select[data-k]')){let v=t.value;if(t.dataset.n)v=+v;S.set(t.dataset.k,v);if(t.dataset.k==='theme'||t.dataset.k==='hour12'||t.dataset.k==='weekStart')render()}});
  win.body.addEventListener('input',e=>{const t=e.target;if(t.matches('input[type=range][data-k]')){S.set(t.dataset.k,+t.value);const v=$('[data-v="'+t.dataset.k+'"]',body);if(v)v.textContent=t.value}});
  const un=S.on(k=>{if(k==='theme'&&page==='personal')render()});win.dispose.push(un);
  render();
}

/* =====================================================================
   启动：无伪加载动画，直接进入桌面
   ===================================================================== */
async function remountPrompt(){
  const all=await HandleStore.all();if(!all.length)return;const ok=new Set();
  for(const h of all){try{const q=h.handle.queryPermission?await h.handle.queryPermission({mode:'readwrite'}):'denied';if(q==='granted'&&await fs.remount(h.name,h.handle))ok.add(h.name)}catch(e){}}
  const rest=all.filter(h=>!ok.has(h.name));
  if(ok.size)UI.toast('已自动恢复本地挂载：'+[...ok].join('、'),'info',3200);
  if(rest.length)UI.toast('上次挂载的本地文件夹需要重新授权：'+rest.map(h=>h.name).join('、'),'warn',0,{text:'重新挂载',run:async()=>{for(const h of rest){try{if(!await fs.remount(h.name,h.handle))UI.toast('未获得授权：'+h.name,'warn')}catch(e){UI.toast('授权失败：'+h.name,'err')}}}});
}
(async function boot(){
  TB.init();Start.init();Clock.init();Desk.init();S.apply();
  ['dragover','drop'].forEach(ev=>addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('#dicons,.fx'))e.preventDefault()}));
  document.addEventListener('fullscreenchange',()=>{const b=$('#trFs');if(b)b.classList.toggle('on',!!document.fullscreenElement)});
  try{await fs.init()}catch(e){console.error(e);UI.toast('文件系统初始化失败：'+e.message,'err',0)}
  S.apply();Desk.applyWall();await Desk.refresh();fs.on(()=>DragOut.clear());
  remountPrompt();
})();
</script>
