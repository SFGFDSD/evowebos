.win-title{height:32px;flex:none;display:flex;align-items:center;gap:7px;padding-left:5px;position:relative;touch-action:none;font-family:var(--f-disp)}

.rz{position:absolute;z-index:4;touch-action:none}

body.dragging iframe{pointer-events:none}body.dragging{cursor:default}
